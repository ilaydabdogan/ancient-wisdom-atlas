canonical_text:
  quote: ''
  summary: The passage discusses reported Sakai, Besisi, and related marriage and
    descent customs, including clan or sub-tribal descent rules, exceptions for the
    Batin, uncertain evidence about exogamy, post-marital residence and avoidance
    practices, and a critical warning about Vaughan-Stevens' interpretations. It also
    records a story of twins who married the same woman and a child's totem assignment,
    plus ritual uses of fern-related breast-paint and face-paint in marriage fertility
    rites and a youth's transition to manhood and marriage eligibility.
  language: English
  quote_policy: summarized
