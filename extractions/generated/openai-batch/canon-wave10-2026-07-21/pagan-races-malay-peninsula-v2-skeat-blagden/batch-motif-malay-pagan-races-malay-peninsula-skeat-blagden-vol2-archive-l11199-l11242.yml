  summary: 'The passage lists plant-related ethnographic and mythic notes: an ark
    of pulai wood; Lang-hue birth-demons sitting on a pulai tree; a banana-tree proverb
    shared by Semang and Jakun; Semang protective head-wear of leaves and screwpine
    blossom; Kari and Pie traditions involving fruit; kenudai fruit linked with tiger
    and crocodile origins; a giant baboon defending the Land of Fruit-trees with false
    durian; and a Sakai breast-painting said to represent Polypodium.'
