canonical_text:
  quote: '"We came from a land at the edge of the sky, in the country where the sun
    comes to life"'
  summary: 'The passage closes a story in which Big Brother Nibong leaves his lady-love
    by night, sails toward the Sea of the Burning Island, is shipwrecked near Kedong,
    and leaves a princess lamenting. It then reports an Upas-tree legend from Labu
    district: two Jakun chiefs are associated with palm names, especially Batin Gomok,
    whose name is linked to a solitary black-stemmed coconut palm on Bukit Galah with
    poisonous fruit and deadly effluvium. A Jakun who eats one of its tempting nuts
    dies before going ten yards. The passage next gives a Besisi tradition of origin
    and migration: the Besisi came from a land at the edge of the sky, where the sun
    comes to life, moved south to Johor, and returned out of fear of a cruel Malay
    Raja. At the edge of the sky stands a giant ancestor who, by order of Tuhan Allah,
    guards the pillars of the sky and eats falling clouds.'
  language: English
  quote_policy: quoted
