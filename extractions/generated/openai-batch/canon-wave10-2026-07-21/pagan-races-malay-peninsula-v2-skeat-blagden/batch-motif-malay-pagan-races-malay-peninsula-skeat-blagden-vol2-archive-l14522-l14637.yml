canonical_text:
  quote: ''
  summary: The passage recounts Jaja', a Malay woman who leaves her Malay husband
    for a Sakai lover, is later brought back by her Malay sons, drowns herself near
    her former home, and gives her name to a river; her Sakai children are described
    as ancestors of a high-standing Sakai family. It then notes an arthropod charm
    for impairing virility. The passage continues with Sakai/Blandas traditions about
    an island eastward across the sea, a two-summit mountain where fruit-bats are
    netted, a shipwreck after water recedes, hospitality toward the survivors, and
    the election of the ship captain as Batin Berchanggei Besi, the Chief with the
    Iron Claws.
  language: English
  quote_policy: summarized
