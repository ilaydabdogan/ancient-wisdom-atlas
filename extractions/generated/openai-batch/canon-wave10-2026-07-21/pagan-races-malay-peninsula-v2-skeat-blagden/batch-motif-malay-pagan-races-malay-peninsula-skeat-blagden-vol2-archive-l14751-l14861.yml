- id: motif:3
  label: leader vanishes from human sight
  taxonomy_refs:
  - departure
  basis: Iron-claws reaches Klang and vanishes from the sight of men, after arranging
    Hang Tuah's succession.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No destination or supernatural mechanism for the disappearance is specified.
- id: motif:4
  label: toponymic origin by misunderstood question
  taxonomy_refs: []
  basis: The Batin answers Kayu Laka, thinking the visitor asked for the tree's name
    rather than the colony's name; the note presents this as a popular derivation
    of Malacca.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage reports this as an etiological naming story; historical validity
    is not established within the passage.
- id: motif:5
  label: hospitality to strangers followed by dispossession
  taxonomy_refs: []
  basis: Malay visitors are first received and given provisions, then return with
    a flotilla, demand land, defeat the Sakai, and cause their flight.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: No sacred or covenantal status is attached to the hospitality in the passage.
- id: motif:6
  label: land ownership proven by enduring mark in stone
  taxonomy_refs:
  - royal_legitimacy
  basis: The Batin makes foot and betel-pulper impressions in stone to show that the
    land is his own, and the marks are said to remain visible.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The royal_legitimacy taxonomy fit is tentative because the passage frames
    the act as land ownership by a Batin, not as royal consecration.
- id: motif:7
  label: inheritance of a colony by a chief's child
  taxonomy_refs:
