canonical_text:
  quote: ''
  summary: The passage recounts migrations and settlement-foundations by Iron-claws,
    Hang Tuah, and Sakai/Benua groups; naming of islands, clearings, Malacca, and
    other places; Iron-claws' disappearance; arrival and later armed return of Malays
    from Kedah; Sakai flight; a stone-marking act used to assert land ownership; and
    succession or inheritance details involving Hang Tuah's children. Notes connect
    these figures with the Undang Yang Ampat and the Malay Annals Hang Tuah tradition.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Iron-claws and his people reached uninhabited islands, named them Pulau Pasir
    and Pantai Layang, and left some Sakai behind at each place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a larger uninhabited island named Jawa or Java, Iron-claws' youngest daughter
    remained with several Sakai followers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Iron-claws and the remaining party reached the then-uninhabited Malacca region,
    made a clearing called Pengkalan Tampoi, explored inland to Klang, and then vanished
    from human sight.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Iron-claws made Hang Tuah the Batin of Pengkalan Tampoi in view of his own
    departure.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hang Tuah built a house on the hill above present Malacca, and a colony grew
    there and spread to Mount Ophir.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Hang Tuah founded and named clearings near Muar: Benua Dalam and Benua Laut
    Jagun.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Malay praha from Kedah arrived while looking for new land; its people landed
    at Pengkalan Tampoi and asked for water and vegetables.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When asked the colony's name, the Batin misunderstood the question as asking
    for the nearby tree's name and answered Kayu Laka.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Malays returned with a flotilla, demanded the land held by the Sakai,
    fought them after refusal, and defeated them, causing the Sakai to flee.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Dusun Besar, the Batin rested on a great stone, ate, called a medicine-man,
    and made impressions of his foot and betel-leaf pulper in the stone to show that
    the land was his.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hang Jebat and Hang Ketuwi are described as Hang Tuah's grown sons and as
    subordinate chiefs in charge of settlements east and north of Pengkalan Tampoi.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: At Johol a daughter was born to Hang Tuah; he intended to give Johol to her
    as inheritance, left the child with his Penglima, and went toward Sungei Ujong.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A note reports Vaughan-Stevens' remark that Hang Tuah, his daughter, and his
    two sons correspond to the Undang Yang Ampat, while the editor adds that Hang
    Tuah is the celebrated Malay hero mentioned in the Malay Annals.
  category: other
  evidence_refs:
  - ev:10
