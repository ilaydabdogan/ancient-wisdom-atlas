canonical_text:
  quote: '"those that were separated are now united"'
  summary: 'The passage reports marriage customs among Benua and related groups: public
    assembly and feast, an elder''s declaration of union, hand-joining by the couple,
    a variant dance and forest chase of the bride by the suitor, parental consent,
    dower goods and reciprocal rings, monogamy and divorce by return of rings, bridal
    adornment with Palas-tree leaves and hair cutting, and associated rules on adultery,
    divorce, children, and guardianship.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: At a wedding, the whole tribe is assembled for entertainment, fermented liquor
    from the Tampoi fruit is consumed, and an elder addresses those present with a
    statement that distant and separated people are now brought together and united.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young couple approach each other, join hands, and the ceremony is concluded.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In some tribes, the ceremony includes a dance during which the bride-elect
    runs into the forest and is followed by her suitor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the chase, if the youth falls down or returns unsuccessful, the assembled
    party mocks him and the match is declared off.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The account says the woman usually contrives to stumble over a tree root and
    fall into the pursuer's arms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: No marriage is described as lawful without the consent of the parents.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The man's usual dower to the bride includes a Malay hatchet, a copper ring,
    a cooking vessel, a chopper or parang, cloth, glass beads, and armlets; the woman
    also gives a copper ring to her intended.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Polygamy is stated not to be permitted, but a man may divorce his wife and
    take another; the divorce form is the return of the copper wedding-rings, and
    the children generally go with the mother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In some tribes, the bride is decorated with Palas-tree leaves and part of
    her hair is cut off; the passage says this is also observed by Malays and is called
    andam.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A married person surprised in adultery might be put to death; if a woman could
    prove seduction, she would be sent away by her husband rather than put to death,
    and divorced parties might remarry.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: A father could not sell his child, but could give the child to another if
    the child consented; orphaned children were to be raised by nearest relatives
    unless another person agreed with consent.
  category: relationship
  evidence_refs:
  - ev:8
