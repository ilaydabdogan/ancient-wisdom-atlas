canonical_text:
  quote: This we call the 'Rite of the Flying-fox.'
  summary: 'The passage gives song-texts connected with music, feasts, and fruit plenty.
    One sequence names a Rite of the Flying-fox: a flying-fox is shot with a blowpipe,
    brought home, singed, quartered, and shared in the Balei, followed by drinking,
    singing, heel-drumming, and wishes for abundant fruit. A second sequence concerns
    Kledang fruit: Mamat Solong receives messages from aunts, climbs for fruit, children
    gather ripe fruit, kin are called to feast, and little folk drink in the Balei
    as a token of plentiful fruit.'
  language: English
  quote_policy: quoted
