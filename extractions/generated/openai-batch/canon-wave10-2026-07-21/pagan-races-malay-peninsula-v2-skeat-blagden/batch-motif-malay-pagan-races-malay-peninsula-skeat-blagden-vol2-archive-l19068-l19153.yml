canonical_text:
  quote: ''
  summary: The passage recounts a primordial human-origin episode involving a first
    pair, unusual birth from a woman's legs, the descent of mankind from a male and
    female child, and Pirman looking down on the multiplied humans. It then identifies
    a moss-covered stone slab as the first couch of the human parents, describes the
    Gunong Lulumut group as animated husband-and-wife mountains divided after a quarrel,
    and quotes accounts of Queen Putri of Mount Ophir/Gunong Ledang, Benua magical
    learning, plant knowledge, potions, animal transformations, divination, distant
    communication, and nocturnal tiger attacks.
  language: English
  quote_policy: summarized
