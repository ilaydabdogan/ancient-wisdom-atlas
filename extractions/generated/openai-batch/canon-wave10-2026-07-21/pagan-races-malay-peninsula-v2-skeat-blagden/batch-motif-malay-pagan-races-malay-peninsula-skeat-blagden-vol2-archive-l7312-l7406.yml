canonical_text:
  quote: ''
  summary: The passage describes Besisi musical instruments, including bamboo whistles,
    wind-organs made from bamboos lashed to tree tops, and a bamboo Jew's-harp. It
    then describes festive dress of Besisi men and women, annual feasts connected
    with rice bloom and harvest, brewing of fermented liquor, a banquet in the chief's
    house, incense and invocation addressed to ancestors and crop-threatening beings,
    and all-night music, flower and leaf adornment, dancing, and singing in a ceremony
    called Berentak Balei.
  language: English
  quote_policy: summarized
