canonical_text:
  quote: ''
  summary: The passage records Blandas charms and exorcistic practices. It gives a
    tiger-charm using protective imagery of water, royal or fairy shielding, and an
    eclipse allusion; describes bersawai exorcism with a leaf shelter, incense, summoned
    animal spirits, possession or “twinning,” sevenfold brushing, and a spell to expel
    demons while retaining the patient’s soul; then describes a berjin disease-exorcism
    with leaf requisites and spirit-guides, and lists several demons targeted by Blandas
    charms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents a second Blandas tiger-charm in two stanzas of Malay
    pantun type.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tiger-charm asks for water from the wellside and says it shields the speaker
    like the king’s umbrella and like a Fairy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A note explains the charm’s eclipse allusion as a belief that the sun tries
    to devour the moon and is frightened away by noise made by earth’s inhabitants.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage mentions that a charm for snaring the souls of monkeys has already
    been given elsewhere.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Blandas exorcism is called bersawai and is identified as equivalent to Besisi
    bersalong or tisi'.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The exorcism directions say to make a Nibong-palm leaf shelter and lay the
    sick man inside it on his back.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The directions say to burn benzoin or incense and summon Hantu of tigers,
    elephants, monkeys, and similar beings to descend and enter the magician’s body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The magician is to wave licuala leaves; when the invoked spirit descends and
    “twins” with him, he brushes the patient downward from head to foot seven times
    while repeating the charm.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The exorcising spell counts from one to seven, tells the seven heads to go,
    tells the soul in the shadow not to go, and tells demons and devils in the flesh
    and sinews to go.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The same spell commands the hot condition to become cold, Venoms to descend,
    and Neutralisers to ascend.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Another Blandas exorcism is called berjin and is said to appear analogous
    to the Malay ceremony of the same name.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The berjin requisites include serdang leaves for pendent leaf ornaments, bertam-palm
    leaves for waving, and legum leaves for making the leaf-chamber where the performance
    occurs.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: The disease-exorcism spell invokes spirit-guides of all sizes and ages and
    asks their help in healing someone sick in veins, bones, joints, or soul.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage states that Blandas charms and spells are used against the Langhui
    birth-demon, the Polong, the Pontianak, and the Uri or afterbirth demon.
  category: other
  evidence_refs:
  - ev:11
- id: obs:15
  text: A note says many authorities identify the Pontianak with the Langsuir and
    not with the Matianuk.
  category: relationship
  evidence_refs:
  - ev:11
