canonical_text:
  quote: ''
  summary: 'The passage discusses intermarriage among Malays, aboriginal groups, and
    Chinese immigrants, then records Semang marriage customs and beliefs: Pangan marriage
    payments of a knife blade and a long girdle, spirit-invocation chanting at marriages,
    Kedah Semang penalties for adultery, and Perak Semang beliefs that a dead wronged
    husband’s soul may send disease against the adulterer’s children, which can be
    averted by swinging the children through fire and blackening their feet.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that many Malays had Benua wives who became converts to
    Islam, while Benua men were debarred from seeking Malay wives.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pangan marriage settlements are described as including a jungle-knife or chopper
    blade presented by the bridegroom to the bride’s parents.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pangan marriage settlements are also described as including a long coiled
    girdle called salek, said to be made from sugar-palm fibres and presented by the
    bridegroom to the bride.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bride was said not to consent to part with the salek because of fear that
    it could be used against her in a magic ceremony.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pangan marriages involved chanting called siwang or ber-siwang, glossed as
    invocation of spirits.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Semang of Kedah are reported as saying that adultery was punishable by
    death, though it might in practice be commuted to a blood-fine of forty dollars
    payable in kind.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: For the Perak Semang, Vaughan-Stevens reports that if adultery with another
    man’s wife remained concealed until the injured husband’s death, the husband’s
    soul would know the offence and seek revenge on the adulterer’s children by sending
    a Disease.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: To avert the danger, the transgressor takes the children by the arms, swings
    them through fire, and jumps them on charred wood to blacken the soles of their
    feet.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the fire rite, the Disease is said to leave the child unharmed or to
    be forced to retire even if the child had already been somewhat affected.
  category: sequence
  evidence_refs:
  - ev:8
