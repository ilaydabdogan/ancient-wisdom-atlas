canonical_text:
  quote: ''
  summary: The passage describes Negrito/Semang dance practice, the difficulty and
    distinctiveness of a song dialect, and field recording of songs. An aged Semang
    named To' Gelugor performs a Monkey Song about Kra moving through trees, carrying
    fruit, peering, dangling, hooting, grinning, and being dressed for a dance with
    a porcupine quill through his nose. The collector says the last lines appear to
    be a make-believe invitation for the monkey to join the tribe's feasting and dancing.
    A following Fruit-cluster song repeats images of a fruit-cluster turning and waving
    in the wind.
  language: English
  quote_policy: summarized
