canonical_text:
  quote: ''
  summary: The passage classifies and geographically maps Northern, Central, and Southern
    Sakai dialect groups in the Malay Peninsula. It describes district boundaries,
    mutual unintelligibility among some dialect groups, an outlying Central Sakai-related
    clan, and the mixed linguistic and physical affiliations of Southern groups, with
    a suggested explanation involving marriage outside the clan’s own stock.
  language: English
  quote_policy: summarized
