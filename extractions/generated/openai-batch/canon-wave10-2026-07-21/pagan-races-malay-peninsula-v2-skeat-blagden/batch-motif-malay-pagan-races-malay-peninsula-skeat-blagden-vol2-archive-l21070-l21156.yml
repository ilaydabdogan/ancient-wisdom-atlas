- id: obs:3
  text: Northern and Central Sakai are described as separated by a line running from
    near Blanja on the Perak River toward the Serau valley in Pahang, crossing near
    several named settlements and mountains.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that he has no data for the Nenggiri valley dialect but
    suggests it probably belongs to the northern subdivision.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dialects of Blanja, Sungai Raya, and the Serau valley are described as
    border dialects within the central subdivision.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tanjong Rambutan, Ulu Kinta, Korbu, and the dialect specifically called Tembe'
    or Tembi are described as immediate northern neighbours of the central border
    dialects.
  category: relationship
  evidence_refs:
  - ev:3
