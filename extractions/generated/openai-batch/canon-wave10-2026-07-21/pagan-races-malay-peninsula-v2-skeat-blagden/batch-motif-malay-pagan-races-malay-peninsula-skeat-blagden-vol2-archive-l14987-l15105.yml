canonical_text:
  quote: ''
  summary: The passage describes Sakai customs and agreements concerning planted fruit-trees,
    Beduanda territorial claims and mixed ancestry, nomad Sakai temporary land use,
    attacks by Bataks or Lubu men and the Sakai flight, a Kenaboi Batin's poisoned
    feast and ambush against the Bataks, the commemorative name Batin P'rah, and a
    later account involving Bugis or Rawa attackers and trade competition around Guntar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In three districts, bargaining between the Sakai Batin and Malays concerned
    fruit-trees rather than land.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sakai custom required each member of the tribe to plant fruit-trees on land
    that he possessed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some Sakai planted coconut-palms and fruit-trees even when they expected to
    leave before gathering the fruit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stated terms with Malays were that a Malay must not fell a Sakai-planted
    tree and that a Sakai wanting fruit from such trees must not be prevented from
    taking it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Beduanda are described as a mixed race connected by blood with the Sakai
    and as laying claim to a definite fixed territory.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nomad Sakai are described as desiring only temporary land within the range
    of a cock's crow and as claiming only products of trees planted during their stay.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Sakai report that the Bataks or Lubu men attacked them, ate their kinsmen,
    and caused them to flee through the jungle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the flight, Sakai tribes and families were united, and the pursuing
    Bataks went east toward the sources of the Pahang river near Kenaboi settlements.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Batin of the Kenaboi called together fighting men, hid many in ambush
    in the jungle, negotiated with the Batak leader, and invited him and his companions
    to a great feast.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Batin mixed poisonous P'rah-tree fruit among dishes set before the Bataks;
    many died immediately, and others were killed by javelins from the ambushed Kenaboi.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After this event, the remaining Bataks left the country, and the Batin was
    called Batin P'rah in remembrance of the event.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A second attack is attributed to the Bugis, whom the Sakai call Rawa, described
    as coming from a nearby island.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Guntar is described as Batin of the Beduanda in Sungei Ujong and as a middleman
    through whom Sakai sold jungle wares to Malays.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: When eastern Malays offered higher prices for goods such as eagle-wood and
    ivory, the Sakai stopped selling their goods to Guntar.
  category: sequence
  evidence_refs:
  - ev:10
