canonical_text:
  quote: ''
  summary: 'The passage recounts a Bamboo Princess tale in which Khatib Malim Seleman
    seeks a princess, finds her in an enormous bamboo by cutting it with betel-nut
    scissors, and later lives invisibly with her at Bukit Peraja, where they may be
    invoked by incense. It also records origin traditions: aboriginal tribes as subdivisions
    of Mantra stock, Mantra descent from two white apes, an alternate claim that apes
    are degraded humans, and a peopling legend in which Batin Alam sails in a wondrous
    vessel from or for Rum to the future Malacca. A footnote compares a Mantra ship-from-heaven
    tradition near Mt. Ophir.'
  language: English
  quote_policy: summarized
