canonical_text:
  quote: Mantra placed the wife near the fire in order to drive away the evil spirits
  summary: 'The passage records birth customs attributed to Mantra and Benua-Jakun
    groups: use of fire against evil spirits, midwifery by relatives or ritual specialists,
    charms for mother and infant, a first-born feast, massage and incantation, root
    decoctions for birth-pains, postpartum care, infant mortality and nursing, and
    a bamboo implement for cutting the umbilical cord. Notes compare related practices
    among Besisi and Jakun accounts.'
  language: English
  quote_policy: summarized
