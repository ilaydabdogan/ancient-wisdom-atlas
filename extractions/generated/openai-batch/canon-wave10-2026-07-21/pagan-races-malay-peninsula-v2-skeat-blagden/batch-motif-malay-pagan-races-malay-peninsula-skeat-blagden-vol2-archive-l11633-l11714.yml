canonical_text:
  quote: ''
  summary: 'The passage records Semang beliefs and practices concerning eclipses,
    the rainbow, storms, and thunderbolts: eclipses are attributed to serpent-like
    beings attacking or enfolding luminaries; the rainbow is identified with a great
    serpent whose body extends to lower regions and is associated with springs, drizzle,
    sickness, and protective armlets; storms are addressed by throwing blood mixed
    with water toward the sky; and improper familiarity with a mother-in-law is said
    to bring thunderbolts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Semang are described as having great fear of eclipses, which are attributed
    to a gigantic serpent or dragon trying to enfold or swallow the obscured luminary.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The serpent associated with the moon is named Hura; it assumes serpent form
    but is said to be the moon's mother-in-law and to be attempting to embrace the
    moon.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The moon is described as shrinking from Hura's proffered embrace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A different serpent is said to swallow or attack the sun in deadly earnest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The rainbow, called Hwe-a, is believed to be the body of a great serpent or
    python, and places where it touches the earth are considered feverish and bad
    to live near.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: A rainbow-snake named Ikub Huya or Hoya is described as beginning beneath
    the heaven called Tasig, below Kari's seat, and extending to the regions of hell.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Pie's command, the rainbow-snake lets water from the nether deep through
    to the earth by pushing its head through the flat earth-crust, causing springs
    to rise for the Semang to drink.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Light drizzling rain visible with a rainbow is described as the sweat of the
    reptile and is said to cause sickness if it falls on a person not wearing a specified
    armlet.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Women wear protective Palas leaf armlets, while men wear protective armlets
    of Rock-vein fungus on the left wrist; these bands are called chining-neng.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: During thunder and lightning, the Semang draw blood from the shin-bone area,
    mix it with water in bamboo, and throw it toward the angry skies; East Semang
    or Pangan practice is described as throwing once toward the sky and once on the
    ground while saying 'bo',' meaning 'stop.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A woman demonstrated the storm practice by drawing blood into a bamboo vessel
    using a jungle-knife pressed against her shin-bone and then performing the described
    libation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Semang are reported as saying that thunderbolts will fall if a man is
    even slightly too familiar with his mother-in-law.
  category: relationship
  evidence_refs:
  - ev:6
