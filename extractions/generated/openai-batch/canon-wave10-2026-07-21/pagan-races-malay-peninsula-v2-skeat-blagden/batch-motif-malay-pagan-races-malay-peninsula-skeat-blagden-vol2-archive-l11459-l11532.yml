canonical_text:
  quote: ''
  summary: The passage surveys reported magical powers, offerings, abstinence, possession,
    exorcism, and divination among Semang, Sakai, Jakun, Besisi, and related groups.
    It describes love-charms and distant harmful magic, incense offerings, Semang
    blood sacrifice to Kari, Jakun sacrificial trays with food and water, Besisi rice-harvest
    offerings to enemies of rice, childbirth food abstinence, abstinence for visions,
    spirit-related exorcism, and divination used as diagnosis.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Love-charms, including one used in the Chinduai ceremony, are said to be believed
    irresistible; the same unnamed group is credited with becoming supernaturally
    beautiful or invulnerable at will and with killing enemies at a distance by sendings
    or pointings called tuju.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The common form of offering across the branches of these tribes is the burning
    of benzoin incense, while other offerings are described as comparatively rare.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Semang sacrifice to Kari consists of drawing blood from the shin-bone region
    and throwing it upward to the skies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Many Jakuns, especially coast tribes, expose small sacrificial trays in the
    jungle with food and water vessels on them; the trays are called anchak and are
    compared by the author to Malay sacrificial trays.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: At a Besisi rice-harvest feast, boiled rice is placed on a low tree-stump
    and offered to the enemies of the rice, represented by noxious insects and wild
    jungle beasts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The author interprets the Besisi rice offering as a complimentary present
    intended to establish a truce with acknowledged foes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Sakai childbirths, the mother is required by tribal unwritten laws to refrain
    from eating various kinds of food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sakai and Jakun medicine-men practice abstinence to some extent in order to
    acquire the power of seeing visions.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The author says records of Semang possession are minimal, but a ceremony among
    the Semang of Kedah indicates that some form of possession is believed in by them.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: The author contrasts Sakai and Jakun exorcism, where a magician invokes a
    friendly demon against the demon tormenting the patient, with Semang exorcism,
    where the magician is said to rely more on the strength of his own spirit.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Records of Semang divination are almost non-existent, while among the Sakai
    and Jakun divination is said to be used as the magical counterpart of medical
    diagnosis.
  category: action
  evidence_refs:
  - ev:9
