canonical_text:
  quote: ''
  summary: The passage reports Benua beliefs about a creator deity named Pirman, intermediary
    spirits, the Earth Genie as a source of sickness and death, spirits connected
    with trees, rivers, and mountains, the soul as made of air, magician souls carried
    by music to heaven, and a footnoted account of westward afterlife travel, grave
    provisions, spectres, and protective fires.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A reported explanation of the sounding of the North or South tree refers to
    the two extremities of a great beam and a northern hill beyond Boko from which
    north winds issue.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pirman is described as one God who made the world and visible things, sustains
    things by his will, dwells above the sky, and is invisible.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pirman is described as unapproachable except through the mediumship of Jewa-Jewa.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jin or Genies are placed between human beings and heavenly powers, with the
    Earth Genie named as the most powerful and as Pirman's minister.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Earth Genie dwells on earth, feeds upon the lives of people and other
    living things, sends sickness, and causes death, while deriving power from Pirman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each tree species is said to have its Genie, rivers have a spirit connected
    with them, and mountains are animated by the Earth Genie.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The human soul is described as distinct from the body; the souls of magicians
    are said to be carried in music to heaven while their living bodies remain beside
    them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The soul is said to be fashioned by Pirman from air, and when the Earth Genie
    dissolves its union with the body it returns to airy nothing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A footnote reports that good spirits travel west after death and are absorbed
    into the setting sun, and that weapons, cooking utensils, and food are buried
    with the corpse for the journey.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The same footnote reports that bad souls are devoured by spectres on the seventh
    day after burial and that fires are kindled to drive evil spirits away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A note states that the word Jin is of Arabic origin but that the spirits so
    named among the Jakun are almost certainly native in origin according to the source.
  category: other
  evidence_refs:
  - ev:7
