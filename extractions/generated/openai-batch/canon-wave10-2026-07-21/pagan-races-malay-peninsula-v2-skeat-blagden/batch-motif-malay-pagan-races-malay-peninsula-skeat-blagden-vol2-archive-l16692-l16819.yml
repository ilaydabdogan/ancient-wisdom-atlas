canonical_text:
  quote: ''
  summary: 'The passage gives several Besisi charms: an antidote charm against venom
    and attacking demons; an inwalling or prophylactic self-protection spell; charms
    for expelling fever, fiends, and devils; a charm against the Spectre Huntsman
    with an explicit comparison to the Wild Huntsman of the Harz mountains; and a
    brief description of famous love-charms associated with dwarf bamboo or similar
    plants on inaccessible mountain peaks.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The antidote charm repeatedly answers threats or harm by displaying or snatching
    forth an antidote, commands venom to descend and antidote to ascend, and attributes
    antidote skill to the speaker’s masters, described as old magicians.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The antidote charm calls on a bird named Chinchili' to bring means to foil
    attacking demons and calls on a skilful master to bring flour-paste to heal anguish
    in the sinews.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The inwalling charm is identified as a prophylactic Besisi charm, equivalent
    to Malay “Pendinding,” used for self-protection.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the self-protection spell, the speaker treads lemon-grass and an iron pestle,
    seeks to be inwalled against many foul fiends, uproots seven hill-crags, splits
    a long cane, and instructs the fiends to walk on one side while the speaker walks
    on the other.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The inwalling charm asks that light become the comrades’ rampart and thick
    darkness become the speaker’s rampart.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A footnote connects the lemon-grass with a legend of seven magical clumps
    of citronella grass believed to grow on peaks of some of the highest mountains
    in the Peninsula.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:7
  text: The charm for driving out devils begins with the numbers one through seven,
    commands fever to become cool, and orders fiends and devils to be plucked forth,
    opened, loosed, and driven out from body, heart, and spirit.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The driving-out charm asks Busu to bring a sucking flour-ball, flour-paste
    antidote, and Tenglang blossom, and to chant in the leaf-cell or leaf-chamber.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The driving-out charm asks Busu to gather the fiends, drive them before a
    knife-blade to the Rock called Perimbun, and leave them there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The charm against devils states a sequence in which Hong Hang becomes foam,
    foam becomes rock, and rock becomes foam, then commands diverse devils to be dashed
    down to left and right.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The same charm mentions Hong Plese', a boiling pot and copper, and brimming
    the vessel with diverse devils.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: A footnote identifies the Plese' or Pemprat as a kind of vampire said to suck
    blood from a victim’s body.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that the following charm is used by the Besisi for exorcising
