canonical_text:
  quote: ''
  summary: The passage describes Sakai face- and breast-painting practices, including
    pigments, tools, authorized users, removal of paint, funerary restrictions, gender
    and age differences, and plant-associated designs used in marriage fertility rites
    and male maturity rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Red paint is applied with the finger, and the red stripe is described as narrower
    for women than for men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Black and white marks are applied with small sticks; black pigment is charcoal,
    white pigment is lime or earth, and both are mixed with creeper sap to make them
    sticky.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A special implement called the smi-kar is used by magicians and midwives to
    apply white points; use by anyone else is said to result in being struck by lightning.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The central coloured stripe of the face pattern runs along the bridge of the
    nose and may continue to the upper lip if a moustache does not obstruct it.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the occasion for which paint was applied has passed, the paint may be
    washed off or rubbed off; child face-paint is washed off by the midwife only while
    her help is still required.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The dead are not supposed to have paint left on the face; if a painted person
    dies, the colour is washed off before burial, and funeral mourners do not paint
    their faces.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The breast-paint of Sakai men represents a fern described as a kind of polypodium.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the marriage ceremony of the Sakai, Besisi, or Kenaboi, fronds of the fern
    are bruised in water and squirted over the bride and bridegroom; this is said
    to assure many children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The dots and line of the face-paint represent another fern, whose juice is
    used to sprinkle youths before they enter the ranks of men and may marry.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Sakai women's face-paint is described as having five streaks in contrast to
    the three streaks of men's face-paint.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Children may wear red stripes until marriage, but they may not apply the black
    streaks and white dots themselves.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Old women past child-bearing omit the lower facial stripe and breast-paint
    because these designs represent hope of children; the midwife has a differentiated
    pattern because she is associated with children.
  category: attribute
  evidence_refs:
  - ev:10
