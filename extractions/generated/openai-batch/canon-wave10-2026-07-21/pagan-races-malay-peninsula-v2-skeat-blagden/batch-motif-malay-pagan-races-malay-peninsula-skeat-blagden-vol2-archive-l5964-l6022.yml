canonical_text:
  quote: ''
  summary: The passage reports a belief in apparent death followed by return to life
    after two days of incense burning, then describes Jakun graves in Johor, especially
    the tomb of a subordinate chief. The grave includes a mound, a surrounding ditch
    for the soul's canoe, westward feet orientation, grave-posts, soul-ladders, a
    timber framework, and captioned grave objects including a torch-stand, coconut
    shell, and basket. A note compares the timber framework with Mantra, Besisi, and
    Malay practices.
  language: English
