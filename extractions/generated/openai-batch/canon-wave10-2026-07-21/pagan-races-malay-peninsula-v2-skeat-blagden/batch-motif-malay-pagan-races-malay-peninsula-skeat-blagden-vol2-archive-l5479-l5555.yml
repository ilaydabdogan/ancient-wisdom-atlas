canonical_text:
  quote: ''
  summary: 'The passage describes burial preparations for a deceased woman: yellow
    crosses are marked on her hands and feet so she will know she is dead when she
    awakens in the grave; her body is arranged, shrouded, wrapped in bark, carried
    to a jungle grave, placed face upward with feet westward, given ornaments and
    betel items, covered with pickets and tree-bark, and sealed beneath an earth mound.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Little yellow crosses are made on the under-surface of the deceased woman's
    hands and feet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated explanation is that, when the deceased awakens in the grave, she
    will see the yellow crosses and know that she is really dead.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The husband and daughter place the corpse on a mat over tree-bark; the husband
    closes the eyes, crosses the arms over the breast, and arranges the head to look
    upward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two long white cloths are laid over the body; the lower cloth is cut with
    a hole so that the deceased might breathe, while the outer cloth is not opened.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The tree-bark is rolled around the body, laced with rattan, and carried by
    two men to a grave in a jungle clearing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The grave pit is almost one metre deep, long and narrow, with soil banked
    up by beams and pickets.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The corpse is laid in the grave face upward, with the feet toward the west
    and an empty space left to the left side.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The husband places silver rings, brooches, a betel-wallet, and green betel-leaves
    with the corpse, while giving one ring to a young boy identified as her son.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Pickets are placed close together over the grave to form a sloping roof, tree-bark
    is laid over them, and several participants, including all the women, rub earth
    in their hands and let it fall between the pickets.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The covering is made without openings; earth is thrown back, stamped firm,
