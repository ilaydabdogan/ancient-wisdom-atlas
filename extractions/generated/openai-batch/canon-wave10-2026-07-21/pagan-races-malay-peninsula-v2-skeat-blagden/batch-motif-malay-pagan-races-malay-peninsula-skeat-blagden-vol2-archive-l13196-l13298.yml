canonical_text:
  quote: ''
  summary: The passage gives a short attraction charm using dripping and spreading
    oil; describes Semang information about bamboo 'sendings' or 'pointings' used
    by B'lians as magically dispatched slivers that kill victims at a distance, with
    a ritual involving wax and incense; and recounts a Sakai legend in which early
    abundance is disrupted by apes angering plant-dwelling demons, Tuhan teaches humans
    to hunt with the blowpipe and use plant poison, bamboo demons obstruct the blowpipe,
    and Tuhan and the Batin destroy the demons and restore edible bamboo sprouts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A charm addresses a comrade and calls the addressee to approach and yearn
    toward the speaker as oil drips and spreads upward.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ordinary 'tuju' is described as a bamboo slip or sliver about two inches
    long, used by B'lians of the Semang tribe.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bamboo sliver is laid on the right palm and commanded to go kill its intended
    victim.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After being commanded, the tuju is said to fly through the air and pierce
    the victim to the heart.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A nicked tuju is said to be more deadly because it twists around the victim's
    heart-strings.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: One ceremony uses wax from a deserted bees' comb shaped into a taper, a lighted
    taper, incense, and a command that the sliver go directly without turning aside.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some informants said one sending could act across a distance described as
    from Siong to Ulu Selama, about two days' cross-country journey.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says Malays especially fear these pointings and believe them almost
    invariably fatal.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Sakai legend, man and beast originally lived on fruits alone, and every
    tree and plant bore sweet and wholesome fruit.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Demons are said to dwell in trees and plants, so men knocked on trunks to
    warn the demons before felling trees.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Apes broke twigs at random, incurred the wrath of the demons, and many trees
    then bore only seeds, protected fruit with hard or prickly shells, or produced
    sour or noxious fruit.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When famine began, Tuhan ordered the people to kill wild beasts for food and
    taught them the use of the blowpipe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Certain trees and plants offered to make their sap poisonous and lend it to
    man so they might be revenged upon the apes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Bamboo demons became angry with humans, entered the blowpipes, diverted darts,
    and licked off dart-poison to spoil shooting.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Tuhan grasped a clump of Seven Bamboos with red-hot hands and turned the demons
    inside into stone.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Tuhan told the Batin to put demons in the blowpipe into the fire with a long
    rattan cane, and many demons were killed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: After annihilating the demons, Tuhan touched the ground where the Seven Bamboos
    had grown, and fresh young bamboo sprouts came up for the hungry and thirsty people.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: An editorial note says Malay shadow-play versions of the Ramayana represent
