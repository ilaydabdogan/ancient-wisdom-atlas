candidate_motifs:
- id: motif:1
  label: Sympathetic attraction charm using oil movement
  taxonomy_refs: []
  basis: The charm links the addressee's approach and yearning to the observed dripping
    and upward spreading of oil.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives only a short tentative translation and does not explain
    the ritual context beyond the charm text.
- id: motif:2
  label: Magically sent bamboo projectile that kills at a distance
  taxonomy_refs: []
  basis: The tuju is a bamboo sliver laid on the palm, commanded to kill, and said
    to fly to the victim and pierce the heart.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The account is reported ethnographic information rather than a narrative
    episode.
- id: motif:3
  label: Ritual activation of a harmful sending with wax, incense, and command
  taxonomy_refs: []
  basis: The ceremony describes making and lighting a wax taper, burning incense,
    and verbally directing the sliver's path.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: Only one form of the ceremony is given.
- id: motif:4
  label: Spirit-inhabited plants require warning before cutting
  taxonomy_refs: []
  basis: Demons dwell in trees and plants, and men knock on trunks to warn them before
    felling trees.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The beings are called demons or Hantu in the English passage; no broader
    classification is supplied here.
- id: motif:5
  label: Loss of primeval food abundance through animal offense against plant spirits
  taxonomy_refs: []
  basis: The legend moves from universal sweet fruit to famine after apes break twigs
    and anger demons, leading trees to bear less accessible or harmful fruit.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage does not state that humans caused the loss; apes are the offenders.
- id: motif:6
  label: Divine teacher introduces hunting technology in famine
  taxonomy_refs:
  - culture_hero
  basis: When famine begins, Tuhan orders people to slay wild beasts and teaches the
    use of the blowpipe.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The label 'culture_hero' is a comparative taxonomy assignment; the passage
    itself names Tuhan and describes his actions but does not use this term.
- id: motif:7
  label: Plants lend poison to humans for revenge
  taxonomy_refs: []
  basis: Certain trees and plants offer to make their sap poisonous and lend it to
    man so they may be revenged upon apes.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage frames this as plant agency within the legend, not as a formal
    pact.
- id: motif:8
  label: Demons obstruct a human technology from within
  taxonomy_refs: []
  basis: Bamboo demons enter blowpipes, divert darts, and lick off dart-poison to
    spoil shooting.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The motif is limited to blowpipes and bamboo demons in this passage.
- id: motif:9
  label: Divine heat transforms demons into stone
  taxonomy_refs: []
  basis: Tuhan grasps the demon-containing Seven Bamboos with red-hot hands and turns
    the demons into stone.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is a transformation and subjugation episode, not a general origin
    of stone in the passage.
- id: motif:10
  label: Fire annihilates demons under divine instruction
  taxonomy_refs: []
  basis: Tuhan tells the Batin to put the demons into fire with a long rattan, and
    many demons are killed.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The available taxonomy includes fire as a symbol, but the motif is not
    world-destroying fire.
- id: motif:11
  label: Food sprouts restored after demon destruction
  taxonomy_refs: []
  basis: After the demons are annihilated, Tuhan touches the ground where the Seven
    Bamboos grew and young bamboo sprouts arise for the hungry and thirsty people.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage does not explicitly call this rebirth; it presents the sprouts
    as a new food source.
comparison_claims:
- id: claim:1
  claim: The passage's editorial note cautiously compares the nicked tuju to a degenerated
    bamboo arrow and to Malay shadow-play Ramayana arrows that fly of their own accord
    by the owner's will.
  claim_level: same_function
  target: Malay shadow-play Ramayana magical arrows
  evidence_refs:
  - ev:2
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The note is explicitly speculative about the nicked tuju's origin and
    does not prove historical derivation; it only supports a functional comparison
    of magically directed projectiles.
- id: claim:2
  claim: The same note gives a visual comparison between magically directed arrows
    and small serpents or dragons in the Malay shadow-play Ramayana tradition.
  claim_level: visual_similarity
  target: serpent or dragon-like magical arrows in Malay shadow-play Ramayana
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The serpent or dragon image is reported for the shadow-play Ramayana
    arrows, not for the Semang tuju itself.
