canonical_text:
  quote: ''
  summary: A Besisi medium's charm uses a ratifying word, a count from one to seven,
    commands to hang leaf ornaments, count lime-fruits, and stamp on a Balai or leaf-cell
    floor. The editor explains the ritual word, leaf nooses for snaring spirits, bamboo
    rhythm instruments, the magician's leaf chamber for divining sickness treatment,
    Malay views of Besisi ritual efficacy, and the opening of a charm for neutralising
    Venom or exorcising the Demon of Pain.
  language: English
  quote_policy: summarized
