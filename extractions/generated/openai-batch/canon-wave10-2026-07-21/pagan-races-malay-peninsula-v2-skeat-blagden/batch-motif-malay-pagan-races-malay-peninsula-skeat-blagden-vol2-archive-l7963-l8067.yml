canonical_text:
  quote: ''
  summary: The passage gives song texts about a sacred Sambhur deer and a Roe-deer.
    The Sambhur is said to originate from an aged ulcered man, is described as magical
    and golden, is caught in toils, and is to be speared by a Deer-wizard who casts
    out its Mischief. The Roe-deer song calls on Mamat the First-born to hunt it with
    a squailer, after which it is carried home, cooked, quartered equally, eaten in
    a communal feast, followed by drink, a Roe-deer dance in the Balei, and a wish
    for plentiful fruit and rice.
  language: English
  quote_policy: summarized
