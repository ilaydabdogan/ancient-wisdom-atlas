canonical_text:
  quote: ''
  summary: The passage describes Semang and related Negrito practices of body decoration
    and body marking, including comb designs and painted body patterns said to repel
    evil influences, yellow oil or turmeric-based pigment used on the face and breast
    for decoration or magic, several known paint colors, a traditional allusion involving
    Kamoj, Kari, a burning brand, and a charred stick, charcoal body marking for medicinal
    or magical purposes, disputed reports about Perak Negrito painting and tattooing,
    and Sakai nose-boring with porcupine quills or other inserts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Kedah Semang woman explained that decorative designs on bamboo combs worn
    by Semang women were intended to repel evil influences.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same informant said similar patterns were sometimes painted on women’s
    bodies for a similar magical object.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kedah Semang men were observed wearing a yellow unguent on the cheeks and
    nose, which they described as decoration.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In discussing the love-charm called “chindwai,” Semang informants explained
    that applying oil to the face and breast was for magical purposes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When coconut oil was unavailable, Semang used a similar pigment obtained from
    wild saffron or turmeric.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the Pangan of Ulu Kelantan, turmeric mixed with lime was made into a
    burnt-red ochre-like substance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that black, yellow, red, and white pigments were used by
    the Negritos, with white obtained from slaked shell-lime.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author says existing information does not make clear whether Semang obtained
    red ochre by grinding iron ore or hematite, as the Sakai reportedly did.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Semang tradition is said to contain a possible allusion to the origin of
    body-paint in a story where Kamoj, ruler of the damned, adopted a charred stick
    as his emblem in place of a burning brand received from Kari.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Vaughan-Stevens recorded that Semang marked painful parts of the body with
    charcoal for medicinal, described parenthetically as magical, purposes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: De Morgan reported that Perak Negritos painted and tattooed themselves like
    the Sakai, but the passage says the report is vague and lacks details.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Vaughan-Stevens instead declared that painting and tattooing were unknown
