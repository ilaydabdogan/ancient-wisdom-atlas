canonical_text:
  quote: ''
  summary: The passage describes bamboo vessels called "chit-nat" used in Sakai of
    Perak birth customs. It notes that the umbilical cord remnant is discarded after
    falling off, that the newborn is washed every morning for a lunar month with water
    from a special chit-nat, and that the mother is purified with water and a warm
    infusion of merian. Bartels' notes give measurements and ornamentation details
    for the vessels.
  language: English
  quote_policy: summarized
