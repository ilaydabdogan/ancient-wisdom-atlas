  summary: The passage contains translated songs or song-texts about a boat journey
    for barter at Malacca, the Pulai tree and its use in making a canoe, a fish-trap
    rite involving catching, cooking, sharing fish, and drumming in the Balei, and
    a children's bathing song that links bathing, grooming, dancing in the Balei,
    and fruit abundance.
