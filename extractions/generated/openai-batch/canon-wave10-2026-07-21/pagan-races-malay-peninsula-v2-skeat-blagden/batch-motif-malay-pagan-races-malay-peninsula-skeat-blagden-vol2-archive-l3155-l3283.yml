canonical_text:
  quote: ''
  summary: 'The passage first reports beliefs about disease, children, Karih, a death-messenger,
    and punishment of a transgressor. It then notes a Semang aphrodisiac name and
    plant. The main section describes Perak Sakai marriage customs: consent requirements,
    gifts to the bride''s family, possible interpretation as a formal substitute for
    marriage by purchase, the chief''s declaration of marriage, formation of a new
    hut and clearing, and a ceremony involving assembly at the bride''s house, shared
    rice from one dish, and joining of hands, with brief comparisons to Malay, Burmese,
    and Peguan customs.'
  language: English
  quote_policy: summarized
