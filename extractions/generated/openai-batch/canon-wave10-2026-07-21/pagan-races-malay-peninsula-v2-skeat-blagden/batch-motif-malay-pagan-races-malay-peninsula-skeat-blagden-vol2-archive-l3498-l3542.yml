canonical_text:
  quote: ''
  summary: The passage describes reported Sakai of Perak customs concerning divorce,
    marital misconduct, child custody, paternal authority, adoption of orphans, and
    penalties for adultery, including death in one report and fines in a footnoteed
    report.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A form of divorce was allowed among the Sakai; in cases involving the husband's
    grave misconduct, the case could be settled by fine or separation, with the woman
    keeping the children.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wife's refusal to take her proper share in housekeeping, planting, hunting,
    and other tasks was treated as a reason for divorce or separation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An aggrieved husband lodged a complaint with the tribal chief, who communicated
    the complaint to the woman's family; if no good result followed, separation was
    insisted on.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In that separation procedure, the woman was sent back to her own family, while
    the husband retained custody of the children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Children were described as a source of profit, and possession of children
    was said to make a husband's remarriage easier.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Paternal authority ordinarily lasted during the father's lifetime, but otherwise
    ceased when a married child left the father's roof.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The adoption of orphan children by childless people was occasionally practised.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Maxwell's account of the Perak tribes reported that the punishment for adultery
    was death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The reported death punishment was usually carried out by a relative who invited
    the victim to a hunting excursion, tired him out, killed him with a club while
    he slept, and left the remains unburied on the earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A footnote reports adultery as a great crime that often led to fighting, and
    states that guilty parties were made to pay a fine to the husband.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The footnote says the adultery fine generally amounted to thirty dollars each,
    and that the woman's fine was paid by her father or brothers.
  category: relationship
  evidence_refs:
  - ev:5
