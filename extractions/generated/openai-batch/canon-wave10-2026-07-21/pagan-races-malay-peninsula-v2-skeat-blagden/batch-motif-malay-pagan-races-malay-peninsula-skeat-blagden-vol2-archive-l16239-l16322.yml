canonical_text:
  quote: ''
  summary: The passage reports Besisi accounts of an afterlife paradise rich in fruit.
    Admission is limited to the good; the bad or ignorant may fail at a fallen-trunk
    bridge and fall into boiling water after being frightened by a dog at a fork in
    the road. Another account says thunder sounds after burial as the soul ascends
    to the Island of Fruits. Gaffer Engkoh protects souls there from beasts, and magicians
    can visit in trance and return with fruit. A related tradition tells how Gaffer
    Engkoh fell from heaven with his dog, returned to the moon by a ladder made by
    Porang Ativan/Atiyau, and later became chief of the Besisi Paradise. Nenek Kabayan
    curses him for felling the sea-coconut palm; Gaffer Engkoh’s dog becomes a sacred
    tiger and remains associated with the soul-bridge.
  language: English
  quote_policy: summarized
