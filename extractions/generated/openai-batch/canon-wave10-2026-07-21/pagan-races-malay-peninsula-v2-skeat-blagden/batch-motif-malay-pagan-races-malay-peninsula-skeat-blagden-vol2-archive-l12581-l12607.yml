canonical_text:
  quote: ''
  summary: Gaffer Long-nose meets the Semang, hears of Nakhoda Kassim, and shows him
    a child named Mouse-deer Hill. Later two children marry and Nakhoda Kassim dies.
    Mouse-deer Hill finds papers showing a royal right to choose territory, goes to
    Pahang, cannot govern it, and asks the Raja at Johor to appoint one of his sons
    instead. The Raja sends two sons; the elder kills the younger and then himself
    at Tanjong Batu. The Raja then sends his godson Salam Balik, who later has Mouse-deer
    Hill's newborn son killed, leading to conflict with the Semang, who use poisoned
    arrows. The passage also contains editorial notes on an obscure Semang saying
    and a firebrand incident compared to other texts.
  language: English
  quote_policy: summarized
