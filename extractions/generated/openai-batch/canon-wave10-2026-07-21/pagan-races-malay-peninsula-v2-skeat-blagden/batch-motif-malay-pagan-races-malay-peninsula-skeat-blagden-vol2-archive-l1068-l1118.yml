canonical_text:
  quote: ''
  summary: 'The passage describes several Benua/Jakun life-cycle and child-care practices:
    an operation performed by a woman without special ceremony, naming at birth with
    possible name change at puberty, carrying children in bark-cloth slings or behind
    the mother’s back, avoidance of hip-carrying except where possibly learned from
    Malays, early supplementation with hog’s grease, prolonged nursing, and children
    later assisting parents. Footnotes add a comparison to a wooden knife assigned
    to the “Orang Utan” and question whether hip-carrying should be treated as a borrowed
    Malay custom.'
  language: English
  quote_policy: summarized
