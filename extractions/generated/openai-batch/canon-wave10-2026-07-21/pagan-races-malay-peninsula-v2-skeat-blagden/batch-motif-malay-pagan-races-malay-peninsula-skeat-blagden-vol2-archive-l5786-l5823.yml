canonical_text:
  quote: ''
  summary: 'The passage describes burial customs and beliefs: hesitation about burial
    at noon because short shadows were believed to shorten lives; an observed ceremony
    without invocations; the mother''s audible grief; and Mantra burial practices
    including shrouding and bathing the body, waiting for friends, procession to a
    lonely tomb, varied corpse positions and east-west orientation by age, grave goods,
    grave plantings, and a fire kept at the foot of the tomb for three days.'
  language: English
  quote_policy: summarized
