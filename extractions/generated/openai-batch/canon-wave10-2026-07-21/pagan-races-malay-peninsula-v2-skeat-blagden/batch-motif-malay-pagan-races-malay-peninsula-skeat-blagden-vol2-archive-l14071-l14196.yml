canonical_text:
  quote: ''
  summary: The passage describes Sakai medicine-huts and the exorcism ceremony called
    Kuwet-niss or tuang-tuang. It notes admission by fernseed water, patterned bamboos,
    headbands whose designs represent owners' names, restrictions on use after marriage
    or tribal admission, demon-protective black patterns, a ritual circle, and a footnoted
    thorn-arbour possession practice in which a pair's utterances are treated as the
    spirits' will.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vaughan-Stevens was allowed to enter such a hut once only after a ceremony
    in which fernseed bruised in water was poured over him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hut's walls and roof were hung with tufts of dried plants, and bamboos
    of many sizes lay around the hut, all covered with incised patterns.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kuwet-niss is described as the older Sakai name for the exorcism ceremony
    also called tuang-tuang; tuang-tuang also names the bamboos used for the ceremony.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ceremony is said to require a thoroughly skilled magician, and magicians
    preserving the old tradition avoid Malays because a stranger's entry would defile
    the medicine-hut.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A note says Sakai magicians may use their own dwellings as medicine-huts,
    and a cave may sometimes be fitted up for that purpose.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A footnoted practice describes a thorn arbour enclosing a man and his wife
    while neighbours chant outside; a strange noise is taken as a sign of spirit possession,
    and the pair's later utterances are regarded as the spirits' will.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Men's ceremonial headbands, called lat, and women's headbands, called rib
    or reeb, are described as bark-cloth bands with different patterns of use and
    hair arrangement.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Painted headband patterns are said to represent the owner's name and, together
    with face-painting and blowpipe patterns, may not be used until youths are married
    and admitted into the tribe.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Decorated tuang-tuang bamboos are struck on the ground during magical ceremonies
    to make musical notes and are described as amulets or rain-charms.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Black patterns are called demon patterns because they protect against demons,
    who are said to flee when they see them.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The presiding magician wears his own black pattern without dots to hinder
    invoked demons from entering the circle where he stands and to lead them around
    the circle to see the patterns of those present.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: Participants, including the magician and attendant, let hair fall over their
    faces so black face-painting stripes are less noticeable, allowing demons to approach
    and observe the headband patterns.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The dots on the red pattern are made black rather than white so that demons
    can distinguish them more easily; the passage says older red ochre patterns used
    white dots.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: After the preparations and a short silence, the magician strikes the end of
    his bamboo.
  category: sequence
  evidence_refs:
  - ev:11
