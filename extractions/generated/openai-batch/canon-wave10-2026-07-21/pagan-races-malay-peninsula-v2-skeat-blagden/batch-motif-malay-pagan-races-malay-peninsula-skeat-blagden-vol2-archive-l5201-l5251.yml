canonical_text:
  quote: ''
  summary: 'The passage first describes a raised Malayan-type grave of a Batang Padang
    Sakai man built inside his house. It then summarizes Vaughan-Stevens'' account
    of an old Sakai or B''landas burial practice: the corpse is washed, dressed, bound,
    wrapped, carried by pole, and laid in a grave with the head to the west; the site
    is chosen by kin and a subordinate chief and kept distant from graves, roads,
    rivers, and houses. The editor adds that the described grave form copies an Arabic
    grave type through Mohammedan Malay mediation, and a footnote gives body-based
    measurements for grave dimensions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A raised Malayan-type grave was built up with earth inside the deceased man's
    house after the flooring had been removed and the walls continued down to the
    ground.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The widow and children lived in a nearby house and took Mr. Wray to see the
