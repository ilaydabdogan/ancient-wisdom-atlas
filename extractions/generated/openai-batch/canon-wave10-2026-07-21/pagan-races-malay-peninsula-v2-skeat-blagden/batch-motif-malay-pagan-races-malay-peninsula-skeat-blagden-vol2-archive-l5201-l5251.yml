- id: obs:3
  text: The old Sakai or B'landas grave form is described as peculiar but rare, and
    old burial methods are said to have ceased in places where Sakai have mixed with
    Malays and Chinese.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The corpse is washed by friends or relations and dressed in clean clothes.
  category: action
  evidence_refs:
  - ev:3
