canonical_text:
  quote: ''
  summary: The passage describes a Semang mythic and ritual complex involving Kamoj's
    charred fire-stick at Belet, the movement of souls from Kari's judgment-seat,
    disease-expelling and disease-causing uses of charred sticks by Puttos, the derivation
    of charm-bamboos and charcoal-marked ritual objects, and legends of Pie and his
    sister Simei as central figures connected with creation, healing, childbirth,
    fireflies, flowers, and charm designs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kamoj hangs one charred portion of a stick with the charred end downward before
    Belet and keeps another portion as an emblem of power and jurisdiction.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A brand hanging over the entrance stops souls that have entered from returning,
    while the upper uncharred end allows souls to come from Kari's judgment-seat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Disease that caused a person's death is fetched by winds at Kari's command,
    and the winds accompany the soul and Disease to Belet but do not enter because
    of the brand.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Puttos adopt a charred stick about six feet long as an emblem of power; they
    can use it to expel Diseases and can send it to be laid on a sick person.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Putto can touch a person with the unburnt end of the stick to make nearby
    Diseases enter the body, or with the burnt end to drive diseases out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Semang may close a path by suspending a charred stick across it, while only
    a Putto can inflict Diseases with the stick by marking it in charcoal with a secret
    sign.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Charm-bamboos are described as deriving from sticks marked with charcoal,
    later incised and rubbed with charcoal, and then replaced by lighter bamboos suitable
    for flowers and herbs used in charms.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Old fire-stick patterns are said to appear again in quivers, charm-bamboos,
    women's magic combs, and blowpipes; the blackened end of a Semang quiver represents
    Kamoj's fire-stick and works as a charm against Diseases.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: An unlucky hunter may make a fire and rub charcoal on the mouthpiece of his
    blowpipe and the butt-ends of darts; sick persons mark the painful place with
    charcoal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Pie and his sister Simei are called central figures of Semang mythology; Kari
    creates everything except the Earth, Pie completes that work and makes men, and
    Kari gives them souls or life.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Pie and Simei live among people in the Jelmol Mountains in Perak, and under
    them are Puttos, each ruling a district.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Simei gives light to fireflies so that they can accompany her at night when
    she visits sick Semang women, especially women in childbirth; men withdraw into
    the jungle when the fireflies arrive.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: After Pie and Simei disappear, fireflies continue seeking them among bushes
    and must not be harmed; by day Simei is accompanied by a bird called Me-el.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Because Kari retains power to punish mankind, Pie pities people and goes to
    the land of the Chinoi, servants of Kari, on the other side of the world.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Pie collects flowers associated with the Chinoi's hanging flower-ornaments
    and plants them near the mountains, from which current charm patterns against
    Diseases are said to evolve.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Simei helps Pie and invents designs used as charms against sicknesses peculiar
    to women; these designs are copied on women's combs.
  category: action
  evidence_refs:
  - ev:9
