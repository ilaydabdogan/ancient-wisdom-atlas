  quote: ''
  summary: The passage argues that certain words in Peninsula aboriginal dialects
    are Malayan but not Malay. The author treats them as relics of locally differentiated
    Malayan dialects in the Peninsula, suggesting primitive Malayan tribes before
    the Malay conquest, probably strongest along the coast and weaker toward the interior.
    The passage also notes uncertainty about whether some words came from Malay or
    from this older Malayan source, limiting conclusions about cultural influence.
  language: English
