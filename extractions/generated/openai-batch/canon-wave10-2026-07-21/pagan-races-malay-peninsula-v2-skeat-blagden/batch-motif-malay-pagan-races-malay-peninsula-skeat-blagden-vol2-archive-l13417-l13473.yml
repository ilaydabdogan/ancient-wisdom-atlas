canonical_text:
  quote: ''
  summary: The passage describes a Sakai belief that the coucal heals its injured
    young with a creeper called akar temu urat, which is also known to some humans
    as a medicine for broken bones and wounds. It then describes Sakai exorcism of
    thunder spirits, demon-related explanations for harm caused by wind and lightning,
    charms against demons, and a belief in seven layered winds and a cone-shaped whirlwind
    formed by meeting winds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The coucal, called but-but and glossed with Malay bubut, is said to have the
    power to heal the broken legs of its young.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a young bird's leg is broken, the mother bird is said to fetch the plant
    called akar temu urat and rub it on the injured limb; by the next morning the
    young bird is well again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The medicine has sometimes been obtained by frightening the mother bird so
    that she drops the plant; the Sakai are said to know how to find it, and some
    Malays also know it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The plant is prepared by steeping it in oil and rubbing it on the affected
    part; it is said to join broken bones and heal many kinds of wounds.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: An informant reportedly broke the growing plant, tied the pieces together,
    and the next morning the plant had grown together again with no visible sign of
    the break.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Sakai are said to perform a ceremonial exorcism of thunder spirits by
    going out of their houses and brandishing poles and arms to frighten away evil
    spirits.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The forces of nature are said not to be demons themselves, but to possess
    the souls of evil spirits or demons that cause them to harm people.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Harm caused by wind and lightning is attributed to demons, and a powerful
    charm is said to be able to banish a demon and prevent such harmful action.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The winds are said to be seven in number, arranged one above another; seven,
    like three, is described as a mystic number for the Sakai.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The whirlwind is described as a product of several meeting winds and as cone-shaped.
  category: attribute
  evidence_refs:
  - ev:7
