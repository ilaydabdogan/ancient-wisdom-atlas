canonical_text:
  quote: ''
  summary: The passage gives a catalogue of Selangor song names, mostly animal or
    plant names, notes a possible relation to Malay Rejang song-series, and then translates
    songs concerning the Elephant, Rhinoceros, and Tiger. The Elephant song presents
    a sacred and magical elephant moving through hills, sea, beaches, sanctuary, caves,
    and a freshwater lake, with a prohibition against killing it and instructions
    to offer incense and vows. The Rhinoceros song presents a rhinoceros encounter
    in which a speaker flees up a tree, later shoots the animal, distributes the meat,
    and sells the horn. The Tiger song describes a tiger roaring near a river-point,
    seeking prey, and crossing salt seas, with a footnote linking this to tigers swimming
    between Johor and Singapore.
  language: English
  quote_policy: summarized
