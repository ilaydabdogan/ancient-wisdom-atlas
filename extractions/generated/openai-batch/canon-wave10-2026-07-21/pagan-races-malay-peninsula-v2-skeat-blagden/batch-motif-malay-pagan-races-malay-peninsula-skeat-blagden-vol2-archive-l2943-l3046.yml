canonical_text:
  quote: ''
  summary: The passage introduces marriage customs and beliefs among several Aboriginal
    Malayan groups. It describes ritual purchase, shared meals, witnesses, monogamy
    and fidelity, Sakai face-paint and fern-seed fertility rites, a pre-marriage initiation,
    a contested report of communal marriage, and Jakun marriage practices including
    eating from one dish, a marriage carnival, and racing around a mound or ant hill,
    with canoe races substituted among some Sea Tribes.
  language: English
  quote_policy: summarized
