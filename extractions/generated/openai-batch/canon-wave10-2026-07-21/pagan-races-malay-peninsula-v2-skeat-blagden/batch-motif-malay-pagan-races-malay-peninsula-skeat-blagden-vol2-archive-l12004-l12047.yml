canonical_text:
  quote: ''
  summary: The passage records informants’ statements about Ta' Ponn or Gaffer Ponn,
    a world-making being likened to a Malay Raja, his celestial relationships, family,
    and adversary Kakuh. It also describes an Earth-mother living underground, a three-tier
    heaven, and a giant coconut-monkey in Kakuh's heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A being called Gaffer Ponn or Ta' Ponn is described as the maker of the world
    and as having nobody above him, with comparison to a Malay Raja.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ta' Ponn is described as the moon's husband and as living in the eastern heavens
    with Ag-ag, the Crow, who is described as the husband of the sun.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ta' Ponn is said to look like a man and to be as white as cotton.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'Ta'' Ponn is said to have four children: two male, named Rayadd and Harau,
    and two female, named Rahh-rihh and Brua''.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The noise of the riang-riang, identified as a cicada or 'Knife-grinder insect,'
    is said to be the voice of Ta' Ponn's children.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ta' Ponn's mother is named Yak or Ya' Takell; she is called the old Earth-mother
    and is said to live underground in the middle of the earth.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: Another informant named Kuka' as Ta' Ponn's father, but no further information
    was obtained about him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Ta' Ponn is said to have a dangerous enemy named Kakuh, who lives in the West.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Kakuh is described as very black, like a charred fire-log; this is given as
    the reason that the east is bright and the west dark.
  category: attribute
  evidence_refs:
  - ev:4
