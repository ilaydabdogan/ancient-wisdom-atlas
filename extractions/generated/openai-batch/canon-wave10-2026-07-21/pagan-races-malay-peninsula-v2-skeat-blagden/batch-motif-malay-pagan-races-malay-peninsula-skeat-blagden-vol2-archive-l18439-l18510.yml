canonical_text:
  quote: ''
  summary: The passage recounts a Mantra tradition in which Batin Alam divides settlement
    parties while retaining suzerainty, and his ship is said still to exist beneath
    a mountain. Later Batak invaders attack; the chief Merak Galang gathers survivors,
    carries them by ship to Rum, returns alone to Malacca, proves invulnerable, challenges
    the Bataks with a test of flying weapons, and defeats them. He then brings his
    people back and divides them into five colonies under vassal chiefs. A later invasion
    drives Batin Changgei Besi into the interior. The passage also introduces a tradition
    that certain religious books were lost during the reign of Batin Alam or Merak
    Galang.
  language: English
  quote_policy: summarized
