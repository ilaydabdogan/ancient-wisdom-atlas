canonical_text:
  quote: ''
  summary: 'The passage records Semang and Pangan accounts concerning tiger, snake,
    bird, monkey, and soul beliefs: an etiological conflict involving Pie, a tiger,
    a snake, and a rhinoceros-bird; ritual treatment of dead tigers and snakes; acts
    thought to attract or provoke tigers; coconut monkey traditions; serpent cosmology
    involving eclipses and a world-snake; and birds associated with the conveyance
    of souls and childbirth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tigers and snakes are described as formerly being good friends; after Pie
    drove off a tiger attacking a man, the tiger became Pie's enemy and opposed the
    mistletoe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The snake supported the tiger, but the rhinoceros-bird seized the snake by
    the neck and flew away with it; after the bird began to speak, the snake fell,
    and Pie placed his foot on its head.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The cobra's broad hood is explained as the result of Pie treading on its head,
    and the marks on its neck are explained as coming from the bird's beak.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The rhinoceros-bird is said now to kill snakes when it sees them and to make
    a loud noise when it sees a tiger; its feathers are used as charms for tiger-arrows
    only.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Pangan of Kelantan are reported to have placed a charred stick on or before
    the jaws of a dead tiger or poisonous snake, and to have touched tiger stripes
    with charcoal, to keep the animal souls away from the Semang.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tigers, with snakes and similar beings, are said in some accounts to frighten
    wicked souls in Belet, while other accounts admit their souls to Paradise after
    changing or restraining their predatory habits.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Burning forest leeches outside a shelter is said to cause tigers to scent
    the burning blood and come to the place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Following someone who has gone into the jungle on a blowpipe shooting expedition
    is described as a sure way to provoke the aggressiveness of the tiger-folk.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A gigantic coconut monkey is described as one of the guardians of Paradise,
    and a coconut monkey is also said to advise the parents of the race.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Semang connect the python with eclipses, imagining a python enfolding
    and seeking to devour the sun and moon.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ikub Hwea is described as a great world-snake whose visible portion is the
    rainbow.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Birds are said to convey the souls of newborn children; among Kelantan Negritos,
    a woman hoping for offspring is required to eat the soul-bird, and the phrase
    that she has eaten the bird means she expects to become a mother.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: In some Semang versions, the small Argus-pheasant conveys men's souls; another
    bird conveys women's souls; and Me-el is the inseparable companion of Simei.
  category: relationship
  evidence_refs:
  - ev:10
