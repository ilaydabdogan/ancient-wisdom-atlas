canonical_text:
  quote: ''
  summary: The passage summarizes attributes assigned to a Sakai deity called Tuhan,
    including authority over life, death, demons, humans, and souls. It then discusses
    Jakun and Mantra beliefs in Tuhan, Tuhan Allah, and Tuhan Di-bawah, including
    a dualistic Lord of the Upper World and Lord of the Lower World, with the lower
    lord credited with creating the earth and Death. The author compares these beliefs
    with Semang figures Kari and Pie, comments on limited prayer or worship, cultural
    influence from Malays, Hinduism, and Islam, and introduces demonology involving
    dangerous ghosts of the dead.
  language: English
  quote_policy: summarized
