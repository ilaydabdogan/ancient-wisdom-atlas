canonical_text:
  quote: ''
  summary: The passage describes linguistic frontier lines among several aboriginal
    Malayan groups and dialect areas. It notes dense clustering of distinct dialects
    in parts of the southern Peninsula, probable disappearance of some dialect boundaries,
    the inland location of most tribes still speaking distinctive dialects, the partial
    coastal and sea-going exception of the Besisi, earlier Semang locations near Kedah
    Peak and Province Wellesley, and the present characterization of most tribes as
    landsmen cut off from sea communication.
  language: English
  quote_policy: summarized
