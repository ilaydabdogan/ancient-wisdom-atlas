canonical_text:
  quote: ''
  summary: 'The passage reports Jakun marriage customs: courtship, consent, formal
    request to the bride''s father, dowry and reciprocal gifts, public assembly, and
    variants in which the bridegroom must catch the bride in a chase through the forest
    or around a fire. Notes discuss doubts and an older report of a hillock-circling
    chase. The passage also states rules on paternal consent, monogamy, adultery,
    divorce, children after divorce, and an Udai non-intermarriage report.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jakun marriages are reported as ordinarily celebrated in July and August,
    when fruits are plentiful.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bridegroom spends time at the intended bride's house, obtains her consent,
    and formally asks her father for her hand.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the appointed wedding day, the bridegroom goes to the bride's father's
    house, where the tribe is assembled.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man gives a dowry to the bride, minimally including a silver or copper
    ring and cloth, with possible bracelets, ornaments, household articles, and occasional
    reciprocal gifts from the woman.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The bride is delivered by her father to the bridegroom before the solemnity
    begins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: One reported ceremony includes a dance during which the bride-elect runs into
    the forest and is chased by the bridegroom; if he falls or returns without success,
    the match is declared off.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Benua of Pahang variant has a large fire kindled during a banquet before
    witnesses; the bride runs around the fire, the bridegroom follows in the same
    direction, and the marriage is valid only if he catches her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: No marriage is said to be lawful without the father's consent.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Conjugal faithfulness is described as respected among the Jakun; adultery
    is punishable by death, and polygamy is disallowed and socially censured.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In divorce, the dowry is forfeited by the husband if he initiates the divorce,
    but returned by the woman if she asks for divorce; children choose which parent
    to follow if old enough, otherwise they follow the mother.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Favre is reported as saying that Jakun he questioned denied awareness of the
    chase practice, while the editor cautions that such denials do not necessarily
    disprove the practice.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Begbie is cited as an older authority for a mound or hillock ceremony in which
    a young woman runs three times around a hillock while pursued by a man, becoming
    his wife only if he catches her before the chase ends.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Udai are reported as not intermarrying with the Jakun, who accuse them
    of devouring their dead and cohabiting with forest beasts.
  category: relationship
  evidence_refs:
  - ev:9
