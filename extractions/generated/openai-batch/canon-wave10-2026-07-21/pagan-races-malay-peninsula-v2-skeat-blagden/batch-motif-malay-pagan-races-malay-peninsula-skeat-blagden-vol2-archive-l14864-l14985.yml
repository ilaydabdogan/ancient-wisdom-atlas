canonical_text:
  quote: ''
  summary: A Sakai origin narrative continues from Hang Tuah's loss of two sons, his
    naming of Sungei Ujong, and the birth of another son at Klang. The last-born son's
    sugar-cane refuse, seen floating downstream, leads a Menangkabau royal party to
    the Batin's house. The prince marries the Batin's daughter through an exchange
    of presents; their son To' Mantri is said to give rise to the name Mantra. Another
    daughter of Hang Tuah serves as Batin for a year and is linked to the title Pangku
    Penghulu. The passage also reports custody of old bat-related objects, Sakai land
    claims, decline of the Batin's authority, and later Beduanda dominance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dispute over possession of country ends in mutually fatal combat, depriving
    Hang Tuah of both sons.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hang Tuah declares he will not wander farther and names the river Sungei Ujong,
    glossed as “River of Termination.”
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hang Tuah later proceeds to Klang because he fears the ghosts of his dead
    sons, and another son is born there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hang Tuah's last-born son crosses a river on a tree-trunk while chewing sugar-cane
    and blowing refuse from his mouth; some refuse remains on the tree and some floats
    downstream.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Menangkabau Raja's son and his party see the floating sugar-cane refuse,
    infer that people live nearby, follow the trace, and reach the Batin's house.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: One member of the arriving party is said to descend from an earlier companion
    who had gone to Menangkabau, and this secures a friendly welcome.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Malay prince sees one of the Batin's daughters through an opening in the
    wall and asks the Batin to exchange presents with him, intending marriage.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Batin says he is poor and dispossessed; the prince answers that the Batin
    has a daughter whom he wishes to marry, and the bargain is concluded according
    to Sakai custom.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The prince sends his Penghulu to the ship for presents, leaves, and returns
    after a few months to marry the Batin's daughter.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The couple have a son; the father says a boy should be called To' Mantri,
    and the west-coast Sakai near Sungei Ujong and Malacca are said to have been called
    Mantra from that time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A girl born to Hang Tuah in Johol becomes Batin for a whole year before marrying
    a Malay from Menangkabau; the title Pangku Penghulu is attributed to her Batinship.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Penghulu of Inas is said to possess a wooden chopping-board used for cutting
    up bats at Shake-Net Island and a spoon of old Sakai make manufactured from a
    bat skull.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage says Sakai previously had no fixed boundaries, which were later
    originated by Malays.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: Hang Tuah's last-born son eventually becomes Batin of Sungei Ujong, and the
    Sakai regard Sungei Ujong, Klang, Johol, and Malacca as their special fatherland.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: After Hang Tuah's race dies out, the Sakai no longer have a regularly elected
    Batin; local settlements choose Batins without a head Batin's confirmation, and
    Batin authority declines.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The Beduanda become masters of the Sakai, and their chief eventually gives
    land to Malay kinsmen without consulting the Sakai Batin.
  category: sequence
  evidence_refs:
  - ev:9
