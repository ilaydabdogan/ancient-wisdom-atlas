canonical_text:
  quote: ''
  summary: The passage introduces a Besisi Trumba or song of tribal origin obtained
    from Bedoh of Sepang Kechil. The editor describes it as preserving historical
    or boundary traditions through strings of place-names. The song names origins
    and movements through places including Gobang Gubin, Buluh Bohal, Tanah Jati,
    Endau, Johor, Tengki-tengkel, Jeram, Naning, Nuang, Boatpole Hill, and Hill of
    the Elephant, and associates several chieftains with these places. Footnotes explain
    possible meanings of Gobang Gubin, including a hole in a mythical giant bamboo
    from which the founder of the race miraculously issued, or a dog's hole in the
    ancestral bamboo connected with a mythical ancestor.
  language: English
  quote_policy: summarized
