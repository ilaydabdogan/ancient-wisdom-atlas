canonical_text:
  quote: ''
  summary: The passage describes several burial customs attributed to Ulu Langat Sakai,
    Tasau or Sakai-Jakun of Selangor, and Jakun of Negeri Sembilan, including placing
    a corpse on a platform, abandoning or burning houses after death, funerary pipes
    and singing, a jungle hut vigil lasting seven days until the deceased is believed
    to disappear, and the laying out of a woman named Sulam in a hut before burial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Ulu Langat Sakai, when a death occurred in a house, a platform was
    erected in front of it and the body was placed there for a day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the body was buried, the house where death occurred was either burned
    or deserted; the whole settlement was also frequently deserted on account of a
    death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ulu Langat Sakai burials were attended by friends of the deceased, and pipe-blowing
    and singing were described as the only funeral ceremonies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The body was generally buried no more than two feet deep.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Tasau deceased person was said to be carried some distance into the jungle
    and placed in an actual hut built for the purpose.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Tasau deceased person was watched for seven days by a son or nearest relative,
    who visited daily; after the deceased was believed to disappear, the visits stopped.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sulam’s corpse lay in a newly built hut, where a tree-bark piece lay in the
    middle, a faint fire burned near the entrance, and household objects were present.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sulam’s corpse lay on its back, covered with a white cloth, with billets of
    wood under the head and feet so they would not rest on the earth.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sulam’s husband sat beside the corpse, and the next morning the corpse and
    the man were still in the same positions.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the beginning of the funeral action, Sulam’s corpse was carried out of
    the hut by her daughter and the daughter’s husband.
  category: action
  evidence_refs:
  - ev:7
