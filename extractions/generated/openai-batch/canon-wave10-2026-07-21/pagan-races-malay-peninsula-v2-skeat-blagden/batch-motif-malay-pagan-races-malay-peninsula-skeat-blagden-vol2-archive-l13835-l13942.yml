canonical_text:
  quote: ''
  summary: The passage describes Sakai beliefs and practices concerning harmful spirits,
    disease, sacred places, and ritual specialists. It reports roof-suspended animal
    remains used to avert ape-demon revenge; names tiger, forest, river or water,
    tree, and Malay spirits associated with affliction; describes sacred places where
    incense is burned and vows are made during sickness; and summarizes the authority,
    initiation, ancestral magic, exorcistic role, and charm power of Sakai magicians.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Animal remains are suspended from the roof of a house to keep away ape-demons
    that are said to cause epileptic fits and avenge killed apes on hunters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The named spirits most afflicting the Sakai of Ulu Bertang are described as
    tiger, jungle or forest, river or water, and tree spirits.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The tiger, jungle or forest, and river or water spirits can reportedly be
    overcome to some extent by Sakai skill through charms or medicine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tree spirit is described as too quick in causing mischief for help to
    be possible, descending from trees unseen and killing its victim.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Sakai informants are said to know nothing of the elephant spirit feared
    by Perak Malays.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Small-pox is described by the Sakai as a Malay spirit hostile to the Sakai
    and kind to Malays.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Sahum chieftain estimated that twenty-four of about three hundred people
    had died of small-pox within the previous year.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: The informant states that the Sakai believe in sacred places, worship there
    like Malays, burn incense, and learned this from their ancestors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In cases of sickness, vows are made at sacred places; some sacred places are
    said to belong to Malay spirits.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Malay spirits are said to look like Malays, while other spirits look like
    the Sakai themselves.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Sacred spots are identified on Gunong Banglang and Gunong Renduwai, and people
    go there to make vows.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Many sacred places are said to be powerful and to have no name except the
    place where they dwell.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage distinguishes Sakai magicians from ordinary physicians and from
    southern medicine-men or Poyang, noting that the latter are not formally initiated
    into the magicians' mysteries.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The ancient demon- or devil-man is described as exorcising demons and diseases
    through magic power inherited from ancestors.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Sakai magician formerly had influence exceeding that of a chief, and the
