canonical_text:
  quote: ''
  summary: The passage describes Jakun practices connected with travel, fire-making,
    forest-product collection, taboo language, tiger protection, prenatal food taboos,
    and divination. A new camp-fire may be kindled for luck with a fire-drill, preferably
    by an unmarried girl just before puberty, often the leader's daughter, with a
    father or other married man operating the drill. The resulting fire is used for
    later fires and is credited with luck in cooking and protection from wild beasts.
    The passage also describes a soft wood block, sometimes discussed as shell-shaped
    and linked to ancestral implements, as well as Jakun use of a Camphor or Gutta
    Taboo language with practices such as earth-eating and abstention from bathing
    or washing during collection work. A Juru-krah is reported by Malays as able to
    drive away tigers without weapons. Parents are said to observe food taboos before
    a birth, and divination is used to estimate the sex of an expected child.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a Jakun company was travelling and wished to change camp or prepare for
    a longer stay, a new camp-fire was lighted for luck by an unmarried girl using
    a fire-drill.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The selected girl was usually the daughter of the acting leader; this was
    regarded as especially fortunate, but the leader's daughter could only be selected
    if she was just before puberty.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the Jakun normally carried a smouldering rope-end
    of tree-bark on their wanderings, while the described drill-made fire is presented
    as a survival of an older custom.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fire was obtained by drilling into a soft wood block of a kind used for
    parang handles; a small block could be carried on the person or in a tree-bark
    headband.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage links a shell-like wooden form with a marine bivalve said to have
    been used by ancestors before iron for cutting fish and determining encampment
    spots, while a note records uncertainty about whether the fire-making block itself
    was shell-shaped.
  category: object
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:6
  text: During the kindling, the girl held the block on the ground, while her father
    or another married man worked the vertical drill-shaft.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After a spark appeared, the girl fanned it into flame by blowing or by whirling
    the block, using shredded cloth around the spark to expose it to air.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Other fires for successive nights were lit from this fire, which was credited
    with good luck in cooking and greater power to ward off wild beasts such as tigers
    than a fire started from the smouldering tree-bark rope-end.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says there was no strict rule requiring a girl to perform the
    fire-kindling; any man, child, or woman could do so if convenient, except a woman
    having monthly discharges.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Jakun engaged in collecting forest gutta and camphor are said to use a special
    Camphor or Gutta Taboo language while working.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Jakun are described as attributing great efficacy to the taboo language
    and to certain ceremonial practices associated with it.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Logan is reported as mentioning earth-eating and complete abstention from
    bathing and washing during the search as accompaniments of the Camphor Taboo language.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Malays at Kuala Madek are reported as asserting that a resident Juru-krah
    walked around the village at night and drove away tigers without weapons.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Parents observed dietary restrictions in the months preceding a birth, and
    divination was used to determine the probable sex of an expected child.
  category: action
  evidence_refs:
  - ev:10
