canonical_text:
  quote: The sage-fonme possesses a special receptacle called "chit-nat"
  summary: 'The passage describes Sakai of Perak birth customs: a decorated bamboo
    receptacle called a chit-nat used for purifying child and mother; a second bamboo
    vessel used to fill it with water; reported ornamental interpretations involving
    rattans, thorns, and Tuhan''s fingerprints; a wooden semika implement used for
    cutting the umbilical cord and decorating the chit-nat; sex-differentiated disposal
    of the afterbirth; and postpartum recovery rules including a ten-day infusion
    and avoidance of cold water.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A sage-fonme is said to possess a special receptacle called a chit-nat that
    serves for purification of both child and mother.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chit-nat is described as a segment of bamboo with cut-away portions, projecting
    rounded spouts, toothed or indented edges, measurements, and black-and-white dotted
    and zigzag decoration.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A separate decorated bamboo receptacle is used to fill the chit-nat with water.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bartels reports that a described pattern was said by Vaughan-Stevens to include
    riong and betong rattans of the Tabong-story, triangular figures identified as
    Tuhan's fingerprints, and thorn or spiral figures, while also saying this pattern
    was not actually found on the object described.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: A wooden implement called semika is used by the Sakai for severing the umbilical
    cord and also for decorating the chit-nat.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: One assistant lays the patient on a clean mat and leaves, while the companion
    handles the afterbirth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: If the child is a boy, the afterbirth is tied in a cloth and suspended on
    a tree; if the child is a girl, the afterbirth is buried near the house without
    further ceremony.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The stated reason for different treatment of the afterbirth is that women
    remain in the house whereas men lead an open-air life and do not remain in one
    place.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: For ten successive days after birth, the patient takes a warm infusion called
    merian sejok; in some cases a beaten tree-bark bandage is applied.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: For ten days the patient is forbidden to drink or wash in cold water and uses
    another kind of chit-nat for purification, filled from the bamboo receptacle already
    described.
  category: action
  evidence_refs:
  - ev:9
