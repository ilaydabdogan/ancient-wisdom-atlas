canonical_text:
  quote: ''
  summary: The passage describes Semang traditions about Pie, Simei, the Puttos, charm-bamboos,
    pandanus-leaf charms against falling trees, Pie's aid and punishment of lying,
    variant accounts of Pie's whereabouts or return, blood-throwing offerings associated
    with fruit-making, and a fragmentary note about birds associated with Simei.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Puttos copied charm patterns on bamboo, and Pie deposited them in a cave
    and turned them to stone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Puttos prepared a set of charms for each Sna-hut, whose duty was to ensure
    that every man had the proper charm needed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Puttos inscribed charm-bamboos with Semang mythology; Pie also turned
    these to stone, and only the Puttos knew their location.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Leaves and blossom of the screw-pine or pandanus worn on the head are described
    as a charm against falling trees.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pie, in the form of an old man, and Simei would appear when called, help,
    and then disappear; Pie helped men and Simei helped women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Pie asked for fruit, threw away the seeds, and the seeds grew into trees bearing
    fruit in a single night; this was how the Semang knew Pie had been present.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: When a woman denied having fruit after Pie asked for it, a tree fell upon
    her; after she cried to Pie, he threw pandanus leaves on her head and the tree
    returned upright when it touched them, leaving marks on the leaves.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Pie ordered women to wear marked leaves as charms against falling trees, and
    the Puttos designed patterns for trees that easily fall; the leaves are worn in
    women's haircombs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Pie is said often to have appeared as a Semang with long, thick, bushy hair
    covering his body.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Variant accounts say Pie either returned to Kari with Simei or sleeps in the
    Jelmol Mountains and will return.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that Pie appears to require blood-sacrifices; blood thrown
    to the skies to dispel thunder is used by Pie for making red rambutan fruit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says Pie made white fruit from storm charms that the Puttos threw
    into the air for a similar storm-related reason.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A fragmentary note says that when certain birds were killed and their bodies
