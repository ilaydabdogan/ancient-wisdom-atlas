canonical_text:
  quote: ''
  summary: The passage reports Sakai birth-related demographic details and name-giving
    customs. Children are said to receive names from parents according to dreams.
    An individual's name is represented by a painted headband pattern, though the
    source notes inconsistencies in this account. A magician can remove a recalcitrant
    person's name by burning that person's headband, thereby excluding the person
    from the clan. Rehabilitation involves painting a new headband with the same pattern,
    a visit by the medicine-man and colleagues, and a feast. The passage also describes
    temporary jungle-object patterns and notes an observation of Sakai women carrying
    children on their hips.
  language: English
  quote_policy: summarized
