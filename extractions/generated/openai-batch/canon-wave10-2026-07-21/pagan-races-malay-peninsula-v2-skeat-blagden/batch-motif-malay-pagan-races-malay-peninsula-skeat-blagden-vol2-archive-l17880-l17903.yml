canonical_text:
  quote: ''
  summary: The passage gives charm formulae. One formula addresses “Grandfather,”
    equating or masking smell with water, leaf, earth, and mud, closing Grandfather’s
    nose through an areca-nut mixture, making his feet heavy like rock or a suspended
    water-jar, and commanding entrails to receive the speaker’s hand. A separate “Storm-quelling
    Charm” names the Elephant, sends its wallowing to the far side of the sea, commands
    withdrawal to right and left, and declares that the hurricane is broken.
  language: English
