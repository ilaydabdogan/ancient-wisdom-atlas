canonical_text:
  quote: ''
  summary: The passage describes rules and customs concerning burial bamboo, grave
    goods, punishment for unjust withholding of burial bamboo, gendered deposition
    of combs or hunting and charm objects, a west-coast Semang practice of placing
    food in a grave and lighting a nearby fire in imitation of the Sakai, the Pangan
    rejection of that practice, and restrained mourning behavior with footnote qualifications.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An innocent soul deprived of its burial bamboo by accident or malice may demand
    restitution from Kari.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the Sna-hut unjustly holds back the burial bamboo, Kari's lightning strikes
    him and hurls him down to Kamoj, described as the infernal region.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Beside a woman's corpse, her burial bamboo and combs are deposited; combs
    are placed in her hair if possible, with remaining combs laid on the breast of
    the corpse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The deposition of combs with a woman's corpse is said to be in accordance
    with Simei's command.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Beside men's corpses, quivers, charm-bamboos, and bamboo strings with charm-patterns
    against Diseases are deposited, while blowpipes are not deposited.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Semang of the west coast often place a little food in the grave before
    leaving it and kindle a fire nearby; the passage says this is in imitation of
    the Sakai custom.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Pangan are said not to put food in the grave or kindle the nearby fire
    in this context.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Bereaved relatives are said not to show sorrow openly; even a mother does
