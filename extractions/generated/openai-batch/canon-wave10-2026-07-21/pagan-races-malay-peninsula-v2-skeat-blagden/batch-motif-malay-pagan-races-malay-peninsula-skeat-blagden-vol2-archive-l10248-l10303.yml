canonical_text:
  quote: ''
  summary: The passage summarizes attributes of Kari, including judgment of souls,
    life-giving and life-destroying power, punitive killing through lightning, Tinjui,
    or messengers, blood sacrifice with a prescribed address, and named servants.
    It then summarizes Pie as creator of the earth and humans under Kari’s direction,
    intercessor for the Semang, and a figure possibly remembered in an emergency invocation.
    It also names Ta' Ponn and Minang as great spirits and begins a fragmentary section
    on the Sakai divine figure named Tuhan, Pirman, or Peng.
  language: English
  quote_policy: summarized
