canonical_text:
  quote: ''
  summary: The passage describes a Semang blood-throwing ceremony performed in storms,
    explanations of blood offerings to Kari, Pie, storm-spirits, and water-spirits,
    and Kedah Semang explanations of lightning and thunder involving dead medicine-men
    spinning tops or Kari shaking a flower over a sinner.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the blood-throwing ceremony, men and women cut the skin over the shins
    to obtain a few drops of blood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The blood is placed in a long bamboo receptacle with water, and the liquid
    is thrown upward with a bamboo spatula while the participant faces the setting
    sun.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: In a very severe storm the bamboo vessel may be refilled with blood and water
    and the ceremony repeated.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kari is said not to use the sacrificed blood, but to be pacified by the sign
    of repentance and to stop hurling thunderbolts and complaining to Pie.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Pie is said to use Semang blood to create red jungle fruits used as food.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Puttos are said not to cut themselves, but to throw secret remedies kept
    in bamboo cases into the air; Pie creates white jungle fruits from these.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When the monsoon brings no rain and few fruits appear, the Semang say this
    is because they have not thrown up enough blood.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: According to the Eastern Semang, ghosts of wicked or ignorant tribesmen leave
    the body, fly up to the sky with the Nyawa, and become storm-spirits.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Part of the blood is thrown upward to propitiate the storm-spirits and persuade
    them to return to the upper heavens.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Sometimes a ghost leaves the body, proceeds downward, and becomes a water-spirit;
    part of the blood is therefore thrown down upon the earth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: An aged Semang in Kedah explained lightning as the flashing in heaven of the
    top-cords of dead medicine-men, and thunder as the murmuring noise of the spinning
    tops.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Other informants associated thunder and thunderbolts with Heaven's anger,
    while the author notes uncertainty about whether such ideas are indigenous or
    from foreign sources.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Kari produces lightning when wroth by shaking a flower over a sinner; the
    flower-cups striking one another cause thunder.
  category: action
  evidence_refs:
  - ev:10
