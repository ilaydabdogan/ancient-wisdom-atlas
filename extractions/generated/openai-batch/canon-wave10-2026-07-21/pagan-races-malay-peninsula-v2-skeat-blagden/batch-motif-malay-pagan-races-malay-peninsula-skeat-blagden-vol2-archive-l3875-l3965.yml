canonical_text:
  quote: ''
  summary: 'An ethnographic description of preparations and early actions in a Besisi/Savage
    Malay marriage ceremony: a clay mound is constructed and decorated with natural
    and artificial flowers; food and water are placed on it for the bride and bridegroom;
    the bridegroom’s party arrives to drumbeats; the bride is brought to the mound;
    and the bridegroom is questioned by an official acting for the woman.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A leaf building identified as a Balei or Tribal Hall, built on the plan of
    the letter T, had been erected for the occasion.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Penghulu Lempar used clay thrown up from a pit to construct a waist-high mound
    shaped like a truncated cone and topped with a small globe and knob.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mound was described as resembling a gigantic bell with a bell-handle.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Penghulu Lempar decorated the mound with flowers before the ceremony and said
    he was accustomed to making such a mound in Johor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Natural decorations placed around or into the mound included owl-flower stems,
    wild red Singapore rhododendron, young fan-palm shoots, other palm shoots, and
    stems of a common blossoming reed.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Artificial flowers made from strips of fan-palm leaf were added and were said
    to represent the sun, coconuts, nooses or earrings, and plant blossoms or fruits
    including seal-wax palm and sail-fruit/fill-cup.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each representation of the sun was crowned with a small spike carrying a rhododendron
    blossom.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A bunch of artificial flowers was inserted into the knob-like summit of the
    mound, and a decorated plait or festoon encircled the mound below the upper rim.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A dish containing two portions of rice and wild betel-leaf and a dish of water
    were placed on the flat top of the truncated mound to be shared later by the bride
    and bridegroom.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Drums at a distance announced the approach of the bridegroom’s party.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the bridegroom’s party arrived, the bride was carried outside and placed
    close to the mound, leaving room for the bridegroom and his supporters to pass.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A lengthy catechising of the bridegroom followed; the Batin coached him, and
    the Penghulu Balei questioned him on behalf of the woman.
  category: speech
  evidence_refs:
  - ev:8
