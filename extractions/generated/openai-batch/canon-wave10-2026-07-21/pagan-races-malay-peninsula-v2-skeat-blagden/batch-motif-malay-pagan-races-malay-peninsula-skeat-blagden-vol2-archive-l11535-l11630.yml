canonical_text:
  quote: ''
  summary: The passage describes divination and exorcism practices, dream beliefs,
    amulets and talismans, and Semang beliefs about the sun, moon, stars, western
    cavern or mountains, and related celestial kinship figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage distinguishes two ways of performing divination: a tribal ceremony
    compared by the author to a seance, and divination by the medicine-man alone.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Divination is said often to form part of an exorcising ceremony in which a
    possessed medicine-man answers questions about a patient’s malady and prescribes
    remedies, and may also answer more general questions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Both Semang and Sakai, especially Sakai, are said to attach much weight to
    dreams.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among the Sakai, a new-born infant is said to receive its name in accordance
    with a dream; the Jakun are also said to have a similar strong belief in dreams.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Amulets and talismans are described as a numerous class of objects among all
    the wild tribes, including coins strung on necklaces as charms for the eyes.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Necklaces may include tufts of squirrels’ tails, teeth of apes, monkeys, and
    wild pig, small bones of birds and animals, and similar objects; the passage says
    their use is probably magical rather than only pride in capture.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tiger bristles, teeth, and claws are said to be used much more for magical
    purposes than for ornament or decoration.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Semang are said to believe that the sun has an actual human female figure
    and has a husband named Ag-ag, the Crow.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The sun is said, on reaching the west, either to fall into a great hole or
    cavern identified in some Semang legends with hell, or to go behind western border
    mountains of a flat earth and give light to the Senoi.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'Similar ideas are reported about the moon: the moon’s husband is named Ta’
    Ponn, and the stars are regarded as the moon’s children.'
  category: relationship
  evidence_refs:
  - ev:10
