canonical_text:
  quote: ''
  summary: A sequence of animal songs describes the calls, feeding habits, dangers,
    pursuit, killing, cooking, sharing, and ritual or festive treatment of chevrotin,
    mouse-deer, wild-pig, coconut-monkey, and gibbon. Notes identify some plant and
    animal terms and state that white is a sacred colour for the tribes, as among
    Malays.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chevrotin calls, seeks fruits and leaves, avoids thunderbolt, wild beasts,
    and serpent bite, roams by day and night, and sleeps at noon among brushwood,
    fallen palm-leaves, and tangled grasses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Participants are instructed to set a noose for the chevrotin, carry it home
    after capture, singe it, quarter it, cook it, and give each person an equal portion.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mouse-deer eats several plant fruits and shoots; a dog follows the scent
    of a milk-white mouse-deer, which descends to water, where the dog seizes and
    kills it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The milk-white mouse-deer is carried home, cut into quarters, and divided
    into equal portions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A note states that white is the sacred colour of these tribes and compares
    this with the Malays.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Wild-pigs eat sugar-canes, yams, sweet potatoes, and rice-field crops; a boar
    is described by its feet, shoulders, bristles, eyes, ears, chaps, and tail, and
    is hit by a blowpipe dart.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The coconut-monkey is described by type and body features, feeds on durian
    fruit, shakes trees, is stalked and shot with a blowpipe dart, runs while retching
    and vomiting, and falls.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Mamat Solong is told to pick up and carry the monkey home; Aunt Solong is
    asked to singe it; Mamat Solong is told to cut it up and give each person an equal
    portion.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: After eating the monkey, Mamat the First-born is told to rise and drink in
    the broad- and long-floored Balei, and the song instructs participants to chant
    “the monkey” so that fruit may be plentiful.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The gibbon calls, barks at the half-risen sun, chatters on the Upper Kali,
    gets up on the Upper Luar, and leaps through meranti sprays.
  category: action
  evidence_refs:
  - ev:10
