  quote: ''
  summary: The passage describes Berembun beliefs about magicians whose power comes
    from command over possessing spirits; river spirits are harmful and disease-causing
    while mountain spirits are harmless. It describes a healing/exorcism rite in a
    small hut with disciples, incense, invocations, music, spirit possession of the
    magician, consultation on disease treatment, and exorcism of a river spirit. It
    adds that tigers are the magician’s slaves.
