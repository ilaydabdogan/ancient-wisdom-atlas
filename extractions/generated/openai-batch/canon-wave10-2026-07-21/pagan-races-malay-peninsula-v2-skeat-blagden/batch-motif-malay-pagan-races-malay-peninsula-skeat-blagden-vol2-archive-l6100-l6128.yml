  quote: ''
  summary: The passage opens a chapter on music, songs, and feasts. It lists musical
    instruments used among the three races, notes that most regular instruments except
    the drum are made of bamboo, identifies the drum and banjeng as rarer among wilder
    Semang groups and probably borrowed from the Jakun, describes the nose-flute as
    played through the nose, and notes the regional distribution of the nose-flute
    and Jew's-harp.
