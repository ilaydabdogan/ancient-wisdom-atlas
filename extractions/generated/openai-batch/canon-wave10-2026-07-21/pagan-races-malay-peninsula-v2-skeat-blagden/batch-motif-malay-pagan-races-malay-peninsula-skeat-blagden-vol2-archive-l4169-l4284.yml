canonical_text:
  quote: ''
  summary: The passage records Besisi and Mantra marriage customs. It notes a Besisi
    rice-harvest drinking feast with a wife-exchange game identified with the Tampoi
    Feast. For the Mantra, it describes arranged marriage negotiations through fathers,
    ring gifts, a ceremony at the bride's house with betel exchange, parental injunctions,
    communal feasting, shared eating by the couple, pre-marital tooth filing, and
    a Borie account involving chiefs, rice packets, rings, and declaration of completion.
    It also describes a mound or circle pursuit trial in which the bridegroom must
    overtake the bride, and states that Mantra did not intermarry with other Benua
    tribes or Malays and were strict monogamists.
  language: English
  quote_policy: summarized
