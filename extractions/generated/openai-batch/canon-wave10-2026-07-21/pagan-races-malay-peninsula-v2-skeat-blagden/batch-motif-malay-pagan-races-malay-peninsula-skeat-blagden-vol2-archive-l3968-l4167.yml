canonical_text:
  quote: ''
  summary: 'The passage records a Besisi/Jakun marriage ceremony: a bride-side questioner
    asks the groom''s spokesman about household goods, tools, dwelling preparations,
    planted crops, and practical skills; ritual speech and ratification follow; the
    bridegroom and bride circle a mound, are placed together, and share rice and water.
    A feast follows in the tribal hall, preceded by night-long music. The mound is
    described by a Batin as the tribe''s religious emblem or priest. Additional notes
    discuss early betrothal, marital limits, and comparisons to Pahang, Dayak, and
    Javanese customs.'
  language: English
  quote_policy: summarized
