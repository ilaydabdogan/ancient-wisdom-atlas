comparison_claims:
- id: claim:1
  claim: The source footnote treats the battle between the pythons as part of a wider
    motif of two snakes, serpents, or dragons in combat, including Chinese dragons
    fighting for a pearl and Malay-region snakes or dragons fighting for a magical
    snake-stone.
  claim_level: same_motif
  target: two snakes/serpents/dragons fighting in Oriental art, including China and
    Malay-region examples
  evidence_refs:
  - ev:16
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an editorial comparison in the source. The present song’s explicit
    object is a horn taken after defeat, not a pearl or snake-stone, so the comparison
    should remain at the motif-family level.
- id: claim:2
  claim: The footnote identifies the present Jakun serpent-combat episode as explaining
    the origin of the rainbow.
  claim_level: same_function
  target: origin-of-rainbow explanation through serpent combat and transformation
  evidence_refs:
  - ev:16
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to the passage and the source editor’s comment;
    no external rainbow-origin corpus is provided in this request.
