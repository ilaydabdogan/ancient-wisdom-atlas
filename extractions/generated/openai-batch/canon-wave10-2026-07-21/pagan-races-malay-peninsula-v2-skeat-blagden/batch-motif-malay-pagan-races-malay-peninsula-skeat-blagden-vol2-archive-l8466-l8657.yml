canonical_text:
  quote: ''
  summary: The passage contains song-texts about a great Python or Horned Serpent,
    a tortoise hunt and feast, a poisonous toad and its rite, and a fishing-kite feeding
    its young. The Python section describes a large sacred serpent, its combat with
    another sea-python, the defeat and skyward transformation of the land-python into
    the rainbow, and warnings about Python-sickness. The tortoise section directs
    Mamat the First-born to hunt, roast, and distribute a tortoise equally. The toad
    section warns against eating the Rengkong toad and links a remembered rite with
    abundant fruit. The kite section describes the bird’s nesting, soaring, and feeding
    of its young.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Python is described as having swollen cheeks, a ladle-like head, golden
    head-scales, one hundred and forty ribs, and a body as large as a coco-palm stem.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Python is described as hungry and as swallowing or seizing a sequence
    of animals: wild-boar, mouse-deer, sambhur, and tiger.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Python is called silk-skinned, bediamonded, sacred, from the springs of
    water, and the Horned Serpent.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The silk-skinned Python goes down toward the sea and fights the old Sea-Python
    until the broad seas become narrow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Land-Python is identified as defeated, no longer fighting, asking pardon,
    and vanquished; the one from the sea is identified as victor and as having the
    stronger spirit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The dead Land-Python ascends skyward and becomes the Fire called the Rainbow,
    after its horn is taken by the old Sea-Python.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The song warns listeners to watch carefully and not step over it, saying that
    doing so will crush them as rebels and cause Python-sickness to twine around their
    limbs.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Python song ends with a wish that fruit be plentiful tomorrow and always.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Tortoise is described by its bent fore-paws, adze-shaped hind-feet, pointed
    head, spice-block-like back, black liver, and green fat.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Mamat the First-born is instructed to take a knife, bamboo blowpipe, and throwing-spear,
    search for the Tortoise by its footprints and feeding-ground, drive it out, carry
    it home, cut it up, roast it, serve it on leaf-plates, and give each person an
    equal portion.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: After the tortoise is eaten, Mamat Solong and Mamat Alang are called to drum
    on the Hall-floor.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Toad is described as croaking, dwelling at the foot of forest-trees and
    on the Upper Langat, and jumping upstream and downstream.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Rengkong Toad is described as feeding on centipedes, scorpions, and gravel;
    the song says not to eat it because it is poisonous.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: The toad section instructs listeners to chop at the Rengkong Toad and not
    be frightened if it walks off again; it says the rite and memorial should remain
    so that fruit may be plentiful.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: The Fishing-Kite is described as mewing, soaring and gliding above the cloud-belt,
    nesting and breeding in tall jelotong and kempas trees, and catching siakap fish
    and snakes to feed its young when its children’s sickness begins.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: A footnote says the battle of two snakes, serpents, or dragons is a frequent
    theme in Oriental art and compares examples involving dragons or snakes fighting
    for a pearl or magical snake-stone.
  category: other
  evidence_refs:
  - ev:16
