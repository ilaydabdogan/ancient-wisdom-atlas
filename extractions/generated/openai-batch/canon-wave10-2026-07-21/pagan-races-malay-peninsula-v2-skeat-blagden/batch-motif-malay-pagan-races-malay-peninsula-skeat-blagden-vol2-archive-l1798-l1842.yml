canonical_text:
  quote: ''
  summary: The passage describes maturity-related customs and reported body-modification
    practices among Semang and Pangan groups, including tooth-filing at or near puberty,
    alleged tooth-blackening in Liu Kelantan, denial of circumcision or incision except
    after conversion to Mohammedanism, and the reported absence or scarcity of tattooing
    and scarification evidence among the Kedah Negritos.
