canonical_text:
  quote: ''
  summary: 'The passage lists Besisi beliefs about spirits and demons: a wind demon
    at a white rock, a subterranean legion of giant human-eating demons, a hill-dwelling
    garrotter, named but undescribed spirits, animal and vegetation spirits, tabooed
    tree spirits, and Orang Bunyan associated with swamps, gutta, disappearance, deaths,
    and sacred places.'
  language: English
  quote_policy: summarized
