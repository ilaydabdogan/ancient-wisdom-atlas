  quote: ''
  summary: The passage describes the aboriginal languages of the Malay Peninsula as
    numerous unwritten dialects used by small, often isolated communities. It explains
    dialect decay through segregation, limited usefulness outside the group, contact
    with Malay-speaking communities, Malay loan-words, and increased trade and bilingualism
    after government protection reduced fear of Malay neighbours.
  language: English
