  quote: ''
  summary: The passage records Blandas charms for sending away forest demons and for
    exorcising a caul-demon during removal of the caul, followed by ethnographic notes
    on Besisi and Mantra birth practices, postpartum bathing and warming, medicinal
    plant and water preparations, infant treatment, and naming customs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A charm addresses a Deep-forest Demon and a Jungle Demon, telling them not
    to lodge there and to return to the jungle or forest-depths.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The last Blandas charm in the passage is said to have been used for exorcising
    the caul-demon when the caul was being removed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The caul charm compares the caul to a bridle and a casting-net and repeatedly
    commands a bound, tied, noosed, or anchored caul to be unloosened.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The caul charm commands the caul-fiend, fiends, devils, and fiends from named
    places such as the Forest-depths, Per'pat Rock, Banyan Hill, and Kempas-tree to
    be unloosened.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The caul-spirit or demon is addressed as coming from the ocean, lightning,
    and rain, and is told to return to Malim Putih or Malim Sidi.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker of the caul charm says the caul is unloosened not by the speaker
    but by Malim Putih or Malim Sidi.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A note states that the caul-demon was believed to lick up the sufferer's blood.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Among the Besisi, the traditional hire of the sage-femme was two dollars or
    a white jacket, and if no experienced person was available the invalid's mother
    or husband might take her place.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: For the Besisi mother, the mosquito-curtain was decorated with ceremonial
    leaf-hangings; after birth she underwent ceremonial bathing and was seated with
    her back to the fire and kept very warm.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: An infusion from roots of a creeper called akar merian was administered to
    the Besisi mother for about five or ten days.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: For Mantra birth customs, the child's head was shaved a few days after birth,
    illness was treated by rubbing the child with lime and turmeric, and the mother
    purified herself by bathing before reappearing.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Logan reports that when a Mantra mother was in labour, a charmed cup of water
    was administered to her; leaf juice was given to the child while a charm was repeated.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Among the Mantra, a name was given when the umbilical cord was cut; a second
    name was bestowed at marriage, and the birth-name could be replaced if it was
    considered unlucky.
  category: sequence
  evidence_refs:
  - ev:12
