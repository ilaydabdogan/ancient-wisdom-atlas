canonical_text:
  quote: ''
  summary: 'A footnote comments that the customs of three races are very different,
    criticizes a sweeping statement, and explains Vaughan-Stevens'' use of “exogamy”
    as marriage between different branches of the same race rather than marriage with
    strangers or foreigners. It gives an example with tribes A, B, and C as pure-blood
    groups and D as a mixed Orang Laut and Jakun group: A, B, and C may take wives
    from one another, but none may take a wife from D.'
