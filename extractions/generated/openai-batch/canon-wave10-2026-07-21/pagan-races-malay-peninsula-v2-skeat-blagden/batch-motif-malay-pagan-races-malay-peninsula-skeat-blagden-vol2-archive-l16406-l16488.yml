canonical_text:
  quote: ''
  summary: The passage lists Besisi and Malay-named spirits or demons, including shrine
    beings with animal attendants, a nocturnal Spectre Huntsman with dogs and a spear
    who can become a healer, a River Spirit, birth-sickness demons including a harmless
    dwarf form and a dangerous possessing form, Hantu Lang-hwe, and two kinds of Grave
    Demon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At certain shrines, people are said to burn incense and address the shrine
    being as Grandfather in order not to be harassed or destroyed by attendants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each shrine-associated being is said to have two attendants, an elephant and
    a tiger, and each attendant has one foot shaped like a human foot.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Demon or Spectre Huntsman is described as ten feet tall, with a very hairy
    face, and as hunting deer and pig at full moon from nightfall onward.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Spectre Huntsman has two small reddish hunting dogs named Sokong and Ko'ing,
    carries a large spear, whistles while hunting, and his dogs bark.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: People who want to meet the Spectre Huntsman restore a half-snapped tree-stem
    to an upright position, after which he appears and asks what they want.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the described encounter, the people ask for a father; the Spectre Huntsman
    says he will be a father to them and will come when they are sick, and he later
    cures them with charms.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The River Spirit is said to haunt the sources of rivers.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The harmless form of the Demon of fatal Birth-sickness, called Kuwak, is described
    as a naked white dwarf-like human only three hand-spans high, barking like a deer
    late at night.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The more dangerous birth-sickness demon has long claw-like nails, long bushy
    hair, and a long lolling tongue; it enters people and makes them mad, or enters
    water without causing harm.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The dangerous birth-sickness demon is said to have sprung from a woman who
    died while giving birth to her youngest child.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hantu Lang-hwe is said to live in the Pulai-tree, to be about the size of
    an owl, and to make a kok-kok-kok-kok sound.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: One kind of Grave Demon enters wild beasts such as deer and tigers; a deer
    or tiger with its head turned backward is explained as having been entered by
    this demon.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The other kind of Grave Demon, called Kemuk, has a pale globular body like
    a wax-gourd fruit, chases people while rocking itself, enters them, makes them
    feverish and disoriented, and gradually steals their life.
  category: action
  evidence_refs:
  - ev:10
