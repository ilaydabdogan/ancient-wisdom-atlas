  summary: The passage discusses the difficulty of correlating language and race in
    South-eastern Asia, proposes cautious hypotheses about older racial strata and
    migrations into the Malay Peninsula, and notes a local tradition in which ancient
    mines, forts, and striking landmarks of unknown origin are commonly attributed
    to the Siamese, although the author argues these traditions may refer instead
    to earlier Mon-Khmer influence.
