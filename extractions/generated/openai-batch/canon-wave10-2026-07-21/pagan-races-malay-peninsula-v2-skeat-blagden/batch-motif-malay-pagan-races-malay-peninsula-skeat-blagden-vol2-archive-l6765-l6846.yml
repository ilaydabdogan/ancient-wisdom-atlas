canonical_text:
  quote: ''
  summary: Ethnographic description of Perak Semang/Negrito singing, dancing, bamboo
    accompaniment, named tunes concerning trees, fruit, mountains, forests, and a
    tiger-spirit, followed by the beginning of an eyewitness description of a dance-drama
    with a young girl dancing in a circle.
  language: English
  quote_policy: summarized
