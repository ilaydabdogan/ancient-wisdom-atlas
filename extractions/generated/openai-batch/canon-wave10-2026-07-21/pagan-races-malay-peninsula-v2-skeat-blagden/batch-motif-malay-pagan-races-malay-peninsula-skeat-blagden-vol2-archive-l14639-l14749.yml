canonical_text:
  quote: ''
  summary: A Sakai tradition recounts Batin Iron-claws' strength, his unusual hilltop
    house, the arrival and marriage of a heavenly prince, an omen involving two brothers
    crossing water, the younger brother's departure to Menangkabau, disputes over
    swine's flesh at feasts, the founding of Pagar Ruyong after grave demons kill
    Sakai, and Iron-claws' final departure from the island by boat with those who
    ate swine's flesh and followed him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Batin received his name because of his great personal strength; he felled
    a tree unaided after twenty people failed, splitting his long fingernail in the
    act.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Batin Iron-claws built an unusual house for his subjects on a hilltop, with
    fire-burnt earth roofing, special foundation posts, a depressed roof-tree with
    projecting gable-ends, and glass walls.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Raja's son fell from heaven, stayed with the Batin, married the Batin's
    eldest daughter, and later persuaded many Sakai to stop eating swine's flesh.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two brothers named Abang and Adik crossed a stream on a tree-trunk; the trunk
    broke, both fell into the water, and their different postures in the fall became
    the basis of an omen.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A medicine-man interpreted the omen to mean that the elder brother would remain
    on his feet and restless, while the younger brother would sit like the Malays
    and cease wandering.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The younger brother determined to seek a place where the prophecy could be
    fulfilled and went to Menangkabau; Abang remained in the country.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: At a banquet, the younger son and his friends objected that the swine's head
    had not been served, refused to eat the banquet, and went to Menangkabau.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The narrative explains the custom of exhibiting the produce of a three-day
    harvest to guests as proof that all the rice has been prepared for them.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: After hearing that grave demons called Degup were killing the Sakai, Iron-claws
    convened an assembly and proposed a new settlement.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Iron-claws moved his hill house to the sea-coast, fenced it with a palisade,
    and named the place Pagar Ruyong, meaning Palm-stem Fence.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: At a feast at Pagar Ruyong, dishes with swine's flesh were placed at one end
    and dishes without it at the other; people sat according to whether they ate swine's
    flesh.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: After the feast, Iron-claws and those who ate swine's flesh declared their
    intention to leave the island.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The heavenly prince received the Batin's house at Pagar Ruyong and remained
    there, while Iron-claws later built boats and left the island with followers who
    ate swine's flesh and obeyed him.
  category: sequence
  evidence_refs:
  - ev:13
