canonical_text:
  quote: ''
  summary: 'The passage describes Mantra magical practices: prophylactic items against
    demons, bad winds, and evils; secret spells for invulnerability; two inwalling
    spells using rock, earth, mist, iron, angels, cosmic bodies, and prophetic invocation;
    a love-spell to gain affection; and a dulcifying spell to make the user agreeable
    and visually sweet. A note explains the word Hong as a powerful invocation term
    compared with Arabic Bismillah, Javanese usage, and Hindu Om/Aum.'
  language: English
  quote_policy: summarized
