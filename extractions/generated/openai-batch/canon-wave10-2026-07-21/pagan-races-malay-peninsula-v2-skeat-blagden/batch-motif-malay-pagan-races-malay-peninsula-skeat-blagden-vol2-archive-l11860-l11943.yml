candidate_motifs:
- id: motif:1
  label: mapped afterlife journey through named destinations and obstacles
  taxonomy_refs:
  - afterlife_journey_map
  basis: 'The passage gives multiple post-mortem routes: a western Paradise reached
    by a tree-bridge, a boiling lake obstacle, rescue by the Chief, an Island of Fruit-trees,
    a sea route to another land, and a diverted road for wicked souls.'
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  - ev:12
  - ev:13
  confidence: high
  cautions: The account is ethnographic and includes variant Eastern and Western Semang
    descriptions; the passage truncates the wicked souls' destination.
- id: motif:2
  label: moral differentiation or conditional judgment after death
  taxonomy_refs:
  - divine_judgment
  basis: Souls frightened into the boiling lake may be rescued only if the Chief of
    the Heaven of Fruit-trees thinks fit, and those who committed wicked acts are
    diverted from the ordinary route.
  evidence_refs:
  - ev:10
  - ev:13
  confidence: medium
  cautions: The passage does not present a formal judgment scene or complete account
    of the wicked souls' destination.
- id: motif:3
  label: sacred or otherworld tree as path and burial aid
  taxonomy_refs:
  - sacred_tree_axis
  basis: Fruit-trees define heavenly and afterlife destinations; a colossal fallen
    tree forms the bridge to Paradise; tree burial allows souls of the old and wise
    to fly over the frightening figure.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  - ev:7
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage does not explicitly call the tree an axis or sacred tree;
    the taxonomy fit is based on its repeated otherworld/pathway function.
- id: motif:4
  label: guardian of paradise or otherworld fruit
  taxonomy_refs: []
  basis: The central heaven's fruit is guarded by a gigantic baboon who attacks unauthorized
    fruit thieves; a footnote gives a variant guardian named Kanteh who keeps Paradise's
    door.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The baboon guards fruit in the central heaven, while Kanteh appears in
