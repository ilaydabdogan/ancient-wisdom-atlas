canonical_text:
  quote: ''
  summary: 'The passage reports Semang accounts of wind-beings and of heaven and afterlife
    geography. Sinai, Kari''s servant and himself a wind, compels other winds with
    whips, while the monkey Aii chastises slow winds. Kedah Semang describe three
    heavens: an upper fruit-tree heaven inhabited by major mythological personages,
    a central fruit-tree heaven guarded against fruit thieves by a giant baboon, and
    a lower heaven of sickness-bearing clouds. Eastern Semang describe old and wise
    souls traveling west to a fruit-tree Paradise by crossing a colossal fallen tree
    used as a bridge, encountering a frightening figure, and risking a boiling lake
    before possible rescue by the Chief of the Heaven of Fruit-trees. Western Semang
    describe different post-mortem destinations for B''lians, lay members, and those
    who had committed wicked acts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sinai is described as Kari's servant, as one of the winds, and as carrying
    a whip in each hand to compel the obedience of other winds.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The monkey Aii chastises winds when they are too slow in their movements.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Kedah Semang account says the heavens consist of three tiers or layers.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The highest heaven contains fruit-trees that bear luxuriantly all year and
    is inhabited by greater personages of Semang mythology.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The second or central heaven contains wild fruit-trees and is defended from
    unauthorized fruit-pilferers by a gigantic baboon that pelts them with hard, prickly,
    uneatable false durians.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A footnote attributes to Vaughan-Stevens a variant in which a gigantic Semang-like
    figure named Kanteh keeps the door of Paradise and has animals as assistants.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The third or lowest heaven contains low brooding clouds that bring sickness
    to mankind.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Eastern Semang state that souls of the old and wise go after death to
    a western Paradise containing many kinds of fruit-trees.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: To reach the western Paradise, the souls must cross a bridge made from the
    fallen trunk of a colossal tree.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the far end of the tree-bridge sits a gigantic figure called Berhala, described
    with a single nostril, empty eye-sockets, tusks, curly hair, and long fingernails
    crossed on its breast.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Many souls are frightened by the figure and fall into a vast boiling lake
    beneath the bridge, whose smooth sides they cannot climb.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The souls remain in the boiling lake for three years before the Chief of the
    Heaven of Fruit-trees may lower his great toe for them to grasp and be pulled
    out.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The old and wise, including B'lians, are buried in trees so that their souls
    may fly over the frightening figure.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: According to the Western Semang, souls of dead B'lians proceed to the Island
    of Fruit-trees.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: According to the Western Semang, souls of lay members travel a long way across
    the sea to a Land of Screw-pines and Thatch-palms, where there is a hole into
    which the sun falls at night.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: Souls of those who had committed a wicked act begin by the same road but are
    compelled to turn northwards across the sea; the supplied passage breaks off before
    naming their destination.
  category: sequence
  evidence_refs:
  - ev:13
