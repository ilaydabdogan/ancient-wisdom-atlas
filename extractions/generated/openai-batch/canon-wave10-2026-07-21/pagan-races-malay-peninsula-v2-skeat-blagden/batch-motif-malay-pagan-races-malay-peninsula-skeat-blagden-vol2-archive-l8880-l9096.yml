canonical_text:
  quote: ''
  summary: A sequence of feast or song texts addresses named participants and the
    community in relation to forest fruits and trees. The songs wish for fruit abundance,
    describe harvesting and sharing Redan, Gabang, and Bertam fruits, warn that Kabau
    fruit is poisonous, and repeatedly move from eating to drinking, dancing, and
    merrymaking in the Balei. A final Merbau tree song describes felling and working
    a tree into parts of a ship, loading it with forest products, and sailing seaward
    toward the sea of Mambang.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening lines wish that all kinds of fruit may be plentiful and that fruit
    may not fail for nine years.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Redan song, Mamat Solong is told to take a jungle-knife, climb the
    Redan tree, lop branches, gather fruit, carry it home, and serve it to all the
    people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Redan fruit is said to feed both big and little; after eating, Mamat Solong
    is told to dance and drink in the Balei while the people make merry.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Kabau tree is described by its movement, creaking stem, grey mottled bark,
    bark used for choppers, insects and birds in its branches, falling blossoms, and
    fruit that must not be eaten because it is poisonous.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Kabau song links drinking and merrymaking in the broad, long-floored Balei
    with children, men, women, and plentiful fruits such as rambutan, mangostin, and
    durian.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the Gabang song, Mamat Solong is told to take a chopper, lop fruit and
    branches, gather scattered Gabang fruit with baskets and wallets, carry it home,
    call the folk together, and give each an equal portion.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: After eating Gabang fruit, participants are told to rise, drink, and make
    merry in the Balei as the custom of their grandfathers; children sport there while
    men and women watch.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Gabang song tells women to arrange their hair, cook rice and meats for
    all the people, eat last from what is left, and sleep when filled.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Solitary Bertam-palm song names single Bertam palms at two places; its
    fruits are gathered, brought home, split, and divided into portions.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Bertam fruit is called a token or sign of a year of plenty, followed by
    commands for children, Mamat Alang, and the folk to make merry, drink, and dance
    in the Balei.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the Merbau song, Chentong the Carpenter is called to fell the Merbau; tools
    are brought, the wood is split, and parts such as a grating, gallery, deck-house,
    oars, and awning are made.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The ship is loaded with wax, eagle-wood, benjamin, resin, gutta, and gutta
    taban, then its mast is raised and it sails seaward toward the sea of Mambang.
  category: sequence
  evidence_refs:
  - ev:11
