  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A fire was kindled at the side of the Sabimba grave.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Sabimba grave was visited on the third and seventh days, and about a month
    later the house was abandoned and a new locality selected for the survivors.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Thomson's Sabimba account, people left the hut when a member was near death,
    later placed the corpse on a plank, shrouded it in its clothes, and buried it
    with utensils such as a blowpipe, chopper, adze, and cooking utensils.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In Thomson's Sabimba account, after the burial the survivors left the spot
    and wandered elsewhere.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Muka Kuning graves were near the house and about one and a half feet deep;
