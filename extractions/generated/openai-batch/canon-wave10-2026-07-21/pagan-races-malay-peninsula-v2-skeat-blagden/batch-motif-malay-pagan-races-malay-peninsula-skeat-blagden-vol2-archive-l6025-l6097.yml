canonical_text:
  quote: ''
  summary: 'The passage describes several burial practices attributed to Johor groups
    and Orang Laut subgroups: graves with frameworks and objects for the deceased,
    child grave markings, Sletar wrapping and burial with brief mourning, Sabimba
    washing, wrapping, grave goods, exhortation to the deceased, grave fire, later
    visits and relocation, and Muka Kuning gendered grave markers followed by relocation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A grave had a top framework forming an enclosure containing a coconut-shell
    drinking vessel, a torch in a rattan stand, an adze handle, and a cooking-pan;
    a back-basket was suspended outside for the deceased to carry firewood.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The niece's grave differed from the nearby Juru-krah grave by having three
    horizontal timbers instead of four, one head-piece roughly shaped like a human
    figure, and only a coconut-shell, torch and stand, and sugar-cane inside the framework.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A child's grave site was marked by a coconut-shell and cloth hung on sticks,
    and another child's half-finished grave had a lower framework, loose heaped earth,
    and a small top framework nearby.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sletar deceased persons were wrapped in their garments and buried in the earth;
    women wept briefly and left the place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Logan's Sabimba account, a body was washed, wrapped in cloth, and buried
    in a grave with a side excavation to receive it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Above the Sabimba grave were placed rice, a pot, an axe, a hatchet, a knife,
