canonical_text:
  quote: ''
  summary: The passage summarizes a Jakun/Besisi-related tale in which Nibong-palm
    and his younger brother Bujang Semangan prepare for a bride-seeking visit to the
    aged Jukrah, divine the auspicious time of departure, travel with named attire
    and weapons, meet two princesses and their escort, reach five cross-roads near
    paradise-like destinations, overcome a dog by using dew-stones to handle hot embers,
    and sleep at Jukrah's house paired with the princesses. Notes compare the dog
    with a dog believed to sit at the road to Paradise and describe related afterlife-road
    and dog customs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The village is described with seven betel-palms, seven betel-vine props, and
    betel scissors made from mouse-deer's eye-teeth, and is said to have been deserted
    because of incidents in the tale.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bujang Semangan urges his elder brother Nibong-palm to put on his best apparel
    and visit the house of an aged Jukrah.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The aged Jukrah is described as father of two princesses, one of whom Nibong-palm
    evidently desired to marry.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before setting out, Nibong-palm inspects the "Five Times" to divine astrologically
    the most propitious moment for departure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nibong-palm's attire includes a fine silk head-cloth valued at one hundred
    and ninety-five dollars, a sword called "Sweeper of the Courtyard," and a kris
    called "Sweeper of River-reaches."
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Halfway on the journey the party meets Princess Tepong or Rice-flour and Princess
    Adah, daughters of the aged Jukrah, escorted by the Mantri.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The travelers arrive at five cross-roads, one leading to the Garden of Flowers
    and another to the Island of Fruit, identified in the passage as the Jakun Paradise.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Opposite the aged Jukrah's house are two species of lime-trees and a savage
    dog lying by hot ashes; the dog bars further progress.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The travelers ask the Mantri for medicine to harden the skin of their hands
    so they can grasp glowing embers and throw them at the dog.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Mantri provides dew-stones, by which the travelers pick up the embers
    and drive away the dog.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The travelers reach the ancient Jukrah's house and sleep there; Nibong-palm
    pairs with Princess Rice-flour, and Bujang Semangan is presumed to pair with her
    younger sister.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: A note states that a dog is believed to sit at the parting of ways leading
    to the Island of Fruits and the Island of Flowers, showing the way to pious souls
    and biting the wicked.
  category: other
  evidence_refs:
  - ev:11
- id: obs:13
  text: The same note says the wicked, trying to escape the dog, fall into boiling
    water in a great copper and are killed according to some accounts.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The passage reports that a Malay informant said Besisi dogs were wrapped in
