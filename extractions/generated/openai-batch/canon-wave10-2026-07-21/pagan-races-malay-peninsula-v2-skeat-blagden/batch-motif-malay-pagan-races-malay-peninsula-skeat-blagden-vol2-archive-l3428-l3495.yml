  summary: The passage records ethnographic notes on Sakai decorative patterns, including
    tiger and musang designs formerly used in face-paint and now used as blowpipe
    marks, comments on possible sources for face-paint patterns, marriage age, polygamy,
    marital authority, adultery retaliation, and plate captions showing a newly married
    couple, painted adornment, dancing, and musical instruments at weddings.
  language: English
  quote_policy: summarized
