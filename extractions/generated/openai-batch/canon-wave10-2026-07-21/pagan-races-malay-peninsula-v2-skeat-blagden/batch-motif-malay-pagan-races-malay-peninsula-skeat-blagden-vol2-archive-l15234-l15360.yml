canonical_text:
  quote: ''
  summary: The passage reports traditions about Benua, Kenaboi, Sakai/Blandas, Besisi,
    and Senoi migrations and dispersals; gives an origin legend for gendered Senoi
    face-painting; and records traditions about abnormal races, including tailed forest
    people, giant unmarried women called Amazons, and a little hairy desert-dwelling
    people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Benua traditions are poor but generally agree with
    usual Sakai stories.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kenaboi folk are described as wandering until checked by the Kenaboi river,
    settling in attractive country near bamboo useful for blowpipes, and later moving
    down the Pahang to the Pekoi or Senoi river.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Two settlements are said to have perished through invasion by the Bataks and
    the Rawa, after which their inhabitants were dispersed and later united with other
    tribes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A host of Sakai or Blandas from Klang is described as founding a settlement
    called Kring, later spreading north and east, and moving further north after Batak
    attack.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After Kenaboi men under Batin P'rah beat back the Bataks, Besisi are said
    to have returned, broken into family groups, scattered among related groups, and
    spoken partly Sakai and partly an unknown language; the passage reports a claimed
    derivation of the name Besisi from foreign speech while noting editorial doubts
    about related details.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the face-painting legend, the Senoi decide to leave the main Sakai stock
    and seek a new eastern home, while magicians deliberate over new body-painting
    patterns to distinguish them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The magicians quickly decide the breast-painting pattern but disagree about
    changing the face-painting pattern at the eye.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A magician's wife secretly listens, enters uninvited, and joins the discussion;
    her husband strikes at her with red anatto-dyed fingers, leaving five marks on
    her face, after which the assembly decides women should bear five facial lines
    and men three.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Orang Ekor or Tailed Men are described as human-like, not dangerous, unwilling
    to deal with humans, disappearing into the forest when seen, wearing bark loin-cloths,
    and having short tails; their children are said never to be seen.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A race of gigantic unmarried women, called Amazons in the passage, is associated
    with long decorated blowpipes found on the ground or leaning against a tree; people
    who carry the blowpipes away are struck from behind, and surviving witnesses describe
    a gigantic woman who vanishes after recovering her property.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage begins to describe a fabulous race of little, hairy, desert-dwelling
    people to whom the Sakai/Blandas apply the name Sakai, but the excerpt cuts off
    before the account is complete.
  category: attribute
  evidence_refs:
  - ev:9
