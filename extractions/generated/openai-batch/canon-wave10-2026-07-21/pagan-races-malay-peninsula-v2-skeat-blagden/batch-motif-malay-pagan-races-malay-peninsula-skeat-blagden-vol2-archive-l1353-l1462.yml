canonical_text:
  quote: ''
  summary: The passage describes Jakun child-carrying and nursing practices, beliefs
    about twins, a mourning garment custom after the death of a first-born boy, and
    birth customs among several Orang Laut groups, including childbirth assistance,
    plant decoctions, protective fire, cord treatment, postpartum bathing, naming
    delay, child treatment, midwife payment, and sage-femme roles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jakun parents do not leave little children alone; the mother carries the child,
    with the father helping when there are several children and no female helper is
    available.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jakun women carry children at their backs in a sling made of cotton stuff
    or bark-cloth, with the sling passing around the child and over the mother's breast;
    an additional strip may pass around the mother's forehead.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a Jakun child wants to suck, it is moved round to the breast; a child
    may also suck with its head pushed forward under the mother's arm.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jakun women say they formerly did not carry children on their hips as Sakai
    and Malay women do, but have now adopted that practice from neighboring tribes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Jakun seen by Vaughan-Stevens said they, like the Orang Laut, had never
    seen twins; if twins were born they would be considered useful later for work,
    while the father would be uncertain about paternity.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A reported nearly obsolete Jakun custom says that when a woman loses her first-born
    child, if it is a boy, she replaces her cloth undergarment with a tree-bark loin-cloth
    worn next to the skin for one month after the child's death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: For the Orang Laut S'letar, the only stated birth custom is that children
    were welcomed to the world by the mother's joy.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Among the Sabimba, the husband alone assisted at births; a decoction of salusoh
    leaves was administered, and blowing from the mouth was practised.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Among the Sabimba, a fire was kindled near the mother to scare away evil spirits.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Among the Sabimba, the umbilical cord was cut with a knife or sliver of rattan,
    and powdered turmeric was applied.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Among the Sabimba, on the third day the mother was bathed in water mixed with
    a decoction of kamaso leaves and then treated with lime juice; she then resumed
    wandering for food with the child bound under her arm at the breast.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Among the Sabimba, a child did not receive a name until a few months old,
    and children were never beaten.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Among the Muka Kuning, a midwife assisted at births and received rattans in
    decreasing amounts according to whether it was the first, second, third, or later
    birth in the family.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Among the Muka Kuning, the mother received a decoction of kayu pangar bark,
    and the child received a decoction of its root.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Among the Beduanda Kallang, the mother drank a decoction of fallen mangrove
    leaves that had floated on water, and the child was given expressed juice of k'luna
    fruit.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: For the Orang Laut generally, each family group is said to contain one or
    more old women who work as sage-femmes, with varying status and payment by present.
  category: relationship
  evidence_refs:
  - ev:10
