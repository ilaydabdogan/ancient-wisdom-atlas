  summary: The passage describes a burial rite in which seed-rice is taken from a
    hut, sown over a grave, and sprinkled with water so that, when grown, it may serve
    as food for the deceased's soul. The deceased's sarong, two mats, and selvage
    strips are gathered and burned to ashes in a small fire kept burning since the
    ceremony began. A note compares a burial feature to a Malay form of burial called
    "papan sa' keping" or "the single plank."
