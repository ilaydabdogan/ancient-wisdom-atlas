canonical_text:
  quote: ''
  summary: 'The passage first states that the separation of the Sun and Moon established
    the division between day and night, with the Moon and Stars ruling night. It then
    gives an origin account for water or the sea: in a waterless early time, Batin
    Lord-knows-who becomes thirsty after cooking and eating a monkey, discovers water
    beneath a tree stump, descends by a liana to drink, and is pursued by a large
    white river-turtle emerging with a vast body of water. Large animals fail to stop
    the turtle, but an assembled army of mouse-deer kills it by stamping holes through
    its body. Editorial notes classify the tale as a water-reservoir myth rather than
    a true deluge myth and compare the mouse-deer with small-animal tale figures.'
  language: English
  quote_policy: summarized
