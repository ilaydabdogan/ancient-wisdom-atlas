  quote: ''
  summary: 'The passage describes preparation of a corpse: it is laid on tree-bark
    with a cloth about the hips, its physical condition is noted, women and children
    bring water, the deceased''s daughter and an old woman wash the body modestly,
    the hair is combed, a silver needle is inserted through the hair-knot, and a yellowish
    root is brought and bruised. Notes suggest the needle may be a charm against evil
    spirits and the root may be turmeric.'
