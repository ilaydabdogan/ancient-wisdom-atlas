canonical_text:
  quote: ''
  summary: The passage surveys ethnographic reports on tattooing, scarification, and
    body-paint among Sakai and related groups in Perak and neighboring regions. It
    describes facial, cheek, temple, breast, and arm markings; possible clan, tribal,
    or rank functions; tattooing materials and methods; and cautions that some reports
    may confuse tattooing with scarification.
  language: English
