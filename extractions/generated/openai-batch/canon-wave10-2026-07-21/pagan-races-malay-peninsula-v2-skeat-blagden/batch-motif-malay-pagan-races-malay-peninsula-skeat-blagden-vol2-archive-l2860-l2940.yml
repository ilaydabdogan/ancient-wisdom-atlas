  summary: The passage surveys maturity and bodily customs among Benua/Jakun and Orang
    Laut groups, including circumcision, incision, tooth filing, name changes at puberty,
    and menstrual avoidance practices. It also reports an abandoned cutting rite after
    knives were accidentally contaminated with upas poison.
