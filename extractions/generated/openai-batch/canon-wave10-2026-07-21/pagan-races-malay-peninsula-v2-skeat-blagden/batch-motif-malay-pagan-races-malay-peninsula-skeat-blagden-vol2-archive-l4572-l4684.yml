canonical_text:
  quote: ''
  summary: The passage describes marriage customs among several Orang Laut groups,
    including exchanges of tobacco, rice, cloth, betel, areca-nut, rattans, rings,
    and other goods; preparation of huts or boats before marriage; rules about kinship,
    remarriage, adultery, polygamy, and intermarriage; Muka Kuning hand-joining and
    shared eating at a wedding feast; and a general account of exogamy, bride capture
    in feud, and absence of communal marriage, polyandry, and polygamy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the S'letar, a mouthful of tobacco and one chupak of rice handed to
    the bride's mother confirmed the marriage tie; S'letar women also intermarried
    with Malays and were sometimes given to Chinese men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Sabimba, the bridegroom prepared a hut, carried the bride there
    from the Batin's house on the wedding day, and delivered white cloth, betel-leaf,
    and areca-nut to the Batin for presentation to the bride's parents.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sabimba kin rules allowed some cousin marriages but prohibited marriage between
    children of brothers; adultery was fined, and seduction of a virgin required marriage
    and the customary parental present.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Sabimba were said to have no actual marriage ceremonies beyond preparing
    an open shed over branches and leaves; the stated wife price included needles,
    thread, cloth, and reals.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Among the Beduanda Kallang, a bridegroom was expected to have his own boat
    before marriage; same-family marriage was prohibited, widowers and widows did
    not usually remarry, and polygamy and adultery were unknown.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Among the Muka Kuning, a girl was considered marriageable when her breasts
    were the size of an areca-nut; the bridegroom's parents sent rattans, cloth, a
    jacket, and two silver rings to the bride's parents.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Muka Kuning marriage took place at the bride's house before the Batin
    and guests; the couple sat side by side, joined hands, received parental advice,
    ate from the same plate or leaf, and were followed by singing and dancing to a
    rebana.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Among the Muka Kuning, an unhappy husband could return his wife to her parents,
    and after one month the parties could make other connections; polygamy was unknown
    and children of brothers could not intermarry.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: For the Akik, the passage states that a Jakun man could take an Akik woman
    as wife, but Akik men were not permitted to marry Jakun women.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the general Orang Laut account, a son commonly undertook to build or already
    possess a boat before marriage, though the couple could live in either set of
    parents' boat when needed.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: The general Orang Laut account states that men of one community could only
    take wives from another community when living on the sea; if communities were
    at feud and choice was unavailable, women and dowry could be taken by force.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The same general account says communal marriage, family-marriage, polyandry,
    and polygamy did not occur among the Orang Laut.
  category: relationship
  evidence_refs:
  - ev:12
