canonical_text:
  quote: ''
  summary: 'The passage summarizes Sakai mortuary beliefs and practices: offerings
    of food and water and a grave fire for the Grave-spirit; the soul’s passage to
    an infernal region or Fruit Island/Paradise; evil deeds remaining by the grave
    as a Hantu Kubor; a deathbed incense rite performed by a magician; explanations
    for incense involving smoke and spirits; and a brief Selangor Sakai note on washing
    the body and face-paint rules.'
  language: English
  quote_policy: summarized
