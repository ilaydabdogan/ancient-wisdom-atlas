canonical_text:
  quote: ''
  summary: 'The passage reports rare notes on Selangor Sakai religion: a fragmentary
    ceremony involving dance and chanted formulae; an Ulu Langat Sakai ceremony with
    sitting, bamboo pipes, and songs to demons or Hantu, with uncertain purpose; and
    an Ulu Langat account of the Chinduai love-charm, a rare white three-petaled flower
    from inaccessible rocky cliffs whose presence in a house makes the inhabitants
    enamoured of its owner. It also reports a Malacca hill where Chinduai is said
    to grow and says Sakai can climb such cliffs with the aid of devils, while Campbell
    states he never saw the plant.'
  language: English
  quote_policy: summarized
