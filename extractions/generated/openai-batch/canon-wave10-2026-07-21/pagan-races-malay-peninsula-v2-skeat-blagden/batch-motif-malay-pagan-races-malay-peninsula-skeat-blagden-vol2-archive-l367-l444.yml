canonical_text:
  quote: ''
  summary: The passage describes birth attendants, child care, face-painting privileges,
    pregnancy customs, miscarriage burial, labor position, assistance at delivery,
    naming at cord severance, washing with merian water, wrapping, and return of the
    child to the mother among groups identified in the passage as Negritos and Sakai,
    with comparison to Besisi and Kenaboi midwives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sage-femme is described as honored to some extent by being freed from tribal
    work while still receiving a full share of produce.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: One duty of the sage-femme is to care for children when their mothers are
    absent; mothers bring children to the huts when they have jungle-work and burdens
    to carry home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the settlement lacks such a hut, children are often slung above the ground
    to keep them out of mischief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sage-femme is said to be of little importance compared with the magician
    except while performing official duties.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sage-femme shares with the magician the privilege of putting white points
    in the face-painting; an unprivileged person doing so is believed liable to be
    killed by lightning.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Midwives of the Sakai, Besisi, and Kenaboi tribes are described as having
    an identical face-painting privileged for use while discharging their functions,
    different from their private pattern.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sakai women make no change in daily routine up to the commencement of confinement,
    and an enceinte woman is treated as being in a respectable and enviable condition.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: After some months, a Sakai woman girds herself with a waist-band called anu,
    carried round the waist and fastened at the back.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Miscarriage in the third or fourth month is described as fairly general among
    Sakai women, and the remains are simply buried without ceremony.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When a Sakai woman feels the first pang, called t'ran, she lies down and does
    not get up until the child is delivered.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: At delivery, the woman lies on her back with knees slightly raised, one assistant
    beside her on the right, and another at her feet to receive the child.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states in the Sakai delivery account that there is no professional
    sage-femme.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: At the instant the cord is severed, the child is named, then washed with merian
    water, wrapped in cloth, and handed back to the mother.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: An editorial note says the statement that there is no professional sage-femme
    contradicts earlier information about professional sage-femmes and a special kind
    of hut.
  category: other
  evidence_refs:
  - ev:12
