canonical_text:
  quote: ''
  summary: The passage reports a Semang afterlife account in which souls go to Kari
    for judgment; good souls go toward sunset and to the other side of the world,
    while Purgatory is a rock-enclosed cavern in the world-end mountain-chain. Kamoj
    rules and punishes wicked souls. Paradise is guarded by a Semang-like door-keeper,
    several beast guardians, and the brother giants Champa and Chalog, who guard Tasig
    and Kari’s lightning-hiding flowers. A following section describes Semang informants
    eventually disclosing knowledge of Ta' Ponn, a powerful benevolent being.
  language: English
  quote_policy: summarized
