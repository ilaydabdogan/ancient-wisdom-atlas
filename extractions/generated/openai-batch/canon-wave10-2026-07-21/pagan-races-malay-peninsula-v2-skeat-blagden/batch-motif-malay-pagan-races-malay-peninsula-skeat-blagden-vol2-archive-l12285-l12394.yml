canonical_text:
  quote: ''
  summary: 'The passage summarizes stories in which Pie protects the Semang through
    transformations and arrangements with Kari, then describes Semang/Pangan ideas
    about souls: the human soul as a tiny red bodily double, soul-birds connected
    with birth-trees and conception, and animal souls conveyed through plants and
    fungi.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pie turns himself into a stick-insect on a twig and catches an elephant by
    the nose when it tries to destroy his magic-flower plantation; the elephant's
    nose stretches and becomes a trunk.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pie turns himself into a manis or pangolin to defend the Semang against the
    elephant, and his scales wound the elephant's foot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pie is attacked by a tiger and a snake, places his foot on the snake's hood,
    and tells the rhinoceros-bird to drive away the tiger.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pie arranges with Kari that destructive winds become lightning, that burial
    bamboos decide soul destinations, that charms avert Diseases, that flowers from
    Kari's dwelling act as antidotes, and that Pie's Breath is less fatal than Kari's.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: According to the Eastern Semang or Pangan, each person has a soul shaped exactly
    like the person, red like blood, and as small as a grain of maize.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Souls are said to be supplied to the young of human beings and of several
    classes of animals, including tigers, wild beasts, night-beasts, birds, and fish.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Til-til-tapa and Chim iui are described as human souls in bird form; when
    these birds need life for eggs, they eat fruit from male or female birth-trees.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: If one of these birds dies naturally, the passage says this is because an
    unborn foetus has died; some say the undeveloped souls go into another bird, and
    a woman eating it becomes the mother of twins.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: An expectant mother decorates or places fragrant leaves and flowers at a tree
    of her own birth-tree species so that her child's soul, embodied in a bird, will
    recognize it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The bird conveying the soul sits on the birth-tree, is killed, and is eaten
    by the woman; first-born children's souls are said to be newly hatched young birds,
    offspring of the mother's soul-bird.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Fish-souls come from grasses, bird-souls from fruits, and each animal species
    has a corresponding soul-plant.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The susu rimau fungus contains the soul of an unborn tiger cub, and the tiger
    receives the soul by eating it.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: When a human soul-bird falls upon one of the soul-bearing fungi, the souls
    fight; the child may be crippled or die, but the human soul is said to be victorious.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Poisonous fungi convey souls of beasts noxious to humans, non-poisonous fungi
    convey souls of harmless beasts, and phosphorescent fungi convey souls of night-beasts.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The idea of the soul-bird is said to be obsolete except among the Pangan,
    while Malays, Siamese, and Chinese are thought to have different birds to convey
    their souls.
  category: attribute
  evidence_refs:
  - ev:9
