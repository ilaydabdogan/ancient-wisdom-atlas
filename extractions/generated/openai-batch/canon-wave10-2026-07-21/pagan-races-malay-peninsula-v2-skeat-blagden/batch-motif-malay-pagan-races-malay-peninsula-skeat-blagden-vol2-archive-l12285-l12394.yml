candidate_motifs:
- id: motif:1
  label: Shapeshifting protector of the Semang
  taxonomy_refs:
  - shapeshifter
  - culture_hero
  basis: Pie repeatedly changes form and acts to defend the Semang or regulate dangers
    affecting them.
  evidence_refs:
