  - ev:3
  - ev:4
  confidence: high
  cautions: The passage summarizes earlier legends rather than narrating them in full.
- id: motif:2
  label: Etiological origin of the elephant trunk
  taxonomy_refs: []
  basis: The elephant's nose is stretched after Pie catches it, becoming the trunk.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives only a brief summarized account.
- id: motif:3
  label: Afterlife destination decided by burial bamboos
  taxonomy_refs:
  - divine_judgment
  basis: Pie arranges with Kari a system of burial bamboos to decide whether souls
    go to Paradise or infernal regions.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The procedure and criteria of judgment are not described in this passage.
- id: motif:4
  label: Sacred flowers as antidotes to Diseases
  taxonomy_refs: []
  basis: Pie brings flowers from Kari's dwelling and apportions them as antidotes
    to the several Diseases.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage does not identify the flowers or Diseases individually.
- id: motif:5
  label: Soul as miniature bodily double
  taxonomy_refs: []
  basis: The soul is described as exactly shaped like the person, red like blood,
    and the size of a grain of maize.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The description is attributed specifically to the Eastern Semang or Pangan.
- id: motif:6
  label: Soul-bird conveys unborn human soul through the birth-tree
  taxonomy_refs:
  - sacred_birth
  basis: The child's soul is embodied in a bird that recognizes the decorated birth-tree
    and is then eaten by the expectant mother.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The text also states that the soul-bird idea is obsolete except among
    the Pangan.
- id: motif:7
  label: Twins from eating a bird containing undeveloped souls
  taxonomy_refs:
  - sacred_twins
  basis: Some say undeveloped souls enter another bird and that the woman who eats
    it becomes the mother of twins.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage reports this as one variant, and the sacred quality of the
    twins is not explicitly stated.
- id: motif:8
  label: Species-specific plants and fungi convey animal souls
  taxonomy_refs: []
  basis: Fish-souls, bird-souls, tiger-cub souls, and souls of noxious, harmless,
    and night-beasts are linked to grasses, fruits, soul-plants, or fungi.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage gives examples but not a complete plant-animal catalogue.
- id: motif:9
  label: Conflict between human soul-bird and animal soul-fungus
  taxonomy_refs:
  - duality
  basis: When the human soul-bird falls on a soul-bearing fungus, the souls fight,
    endangering the child, though the human soul is said to win.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The broader cosmological meaning of the conflict is not explained in the
    passage.
comparison_claims:
- id: claim:1
  claim: The passage's footnote cautiously compares the Semang soul-bird idea with
    a Malay superstition connecting the Burong Pingai bird with the soul.
  claim_level: same_function
  target: Malay Burong Pingai / Pingai bird soul association
  evidence_refs:
  - ev:6
  - ev:7
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The note itself says evidence is required in support of the statements,
    and it does not claim historical contact.
- id: claim:2
  claim: The passage's footnote compares animal or bird soul-conveyance with European
    nursery make-believe about child-bringing storks and other animals.
  claim_level: same_function
  target: child-bringing storks and other animals
  evidence_refs:
  - ev:7
  - ev:10
  counter_evidence_refs: []
  confidence: low
  limitations: This is an analogy supplied in a footnote, not evidence of shared origin
    or identical belief.
- id: claim:3
  claim: The passage's footnote compares the Semang soul-conveyance pattern with a
    Bahnar ceremony in which an infant receives a soul when an insect settles on a
    wax puppet and is shaken onto the child.
  claim_level: same_function
  target: Bahnar Hlomdon infant-soul ceremony
  evidence_refs:
  - ev:5
  - ev:10
  counter_evidence_refs: []
  confidence: low
  limitations: The comparison is brief, second-hand, and the footnote cautions that
    evidence is required.
- id: claim:4
  claim: The passage's footnote compares the Semang soul-bird motif with a Guarani
    belief that the hummingbird brings souls and takes them back after death.
  claim_level: same_function
  target: Guarani hummingbird as soul-bringer and soul-returner
  evidence_refs:
  - ev:6
  - ev:7
  - ev:10
  counter_evidence_refs: []
  confidence: low
  limitations: The traditions are geographically distant; the passage presents only
    a functional analogy and no historical explanation.
