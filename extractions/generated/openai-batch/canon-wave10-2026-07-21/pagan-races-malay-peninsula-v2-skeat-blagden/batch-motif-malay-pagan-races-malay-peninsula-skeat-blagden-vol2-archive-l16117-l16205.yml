canonical_text:
  quote: ''
  summary: 'The passage reports Blandas ritual charms: a former blood-throwing charm
    now performed with water, burnt leaves, and a recitation directed against a Demon
    or Spectral/Wild Huntsman; a charm against cramp addressing demons and giants
    through snapping and neutralising imagery; and a brief note that the Blandas attribute
    souls to maize and banana-trees and bring back the soul of rice, suspending it
    from the rafters before a feast.'
  language: English
  quote_policy: summarized
