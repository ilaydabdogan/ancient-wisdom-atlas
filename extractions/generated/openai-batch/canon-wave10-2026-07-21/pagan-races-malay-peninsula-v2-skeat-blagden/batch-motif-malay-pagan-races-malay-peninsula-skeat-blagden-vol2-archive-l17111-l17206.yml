canonical_text:
  quote: ''
  summary: 'The passage recounts a group origin and migration account: ancestors formerly
    lived in caves on a shining barren plain with prophets of several peoples, sevenfold
    heavenly bodies, serpent-souls, large birds, and animal-souls; the group journeys
    through a dew-covered plain, heaven-near mountains, and named hills to Johor and
    Selangor; the passage also explains chiefly titles, a displacement by a ruler
    called White Dolphin, descent connected with the Toh Klana, and changes in the
    coastline of the Malay Peninsula.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrating group says that in former days they were taller than at present
    and slept in caves in the rocks.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Padang Masah is described as a plain without grass, trees, rain, or rivers,
    and as shining like silver rather than resembling ordinary earth.
  category: setting
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:3
  text: The country is said to have contained the prophet of the narrating group's
    religion and the prophets of the White Man, Chinese, Indian, and Malay before
    Mohammed and before the founding of Mecca.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sky is described as containing seven suns, seven moons, seven stars, and
    seven rainbows; the rainbows are identified as seven snake-souls of Naga Melaikat.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Naga Melaikat is said to lie with his head at the gate of Heaven; later the
    dragon is described with its head at the gate of Heaven and its tail reaching
    to Keluntong.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:6
  text: Seven Roc birds and a solitary immense elephant-soul are present in the primordial
    sky setting.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The prophets of the different peoples could partly understand one another's
    languages and all called the earth 'menia.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nabi Isa, the White Man's prophet, is said to be the elder brother of Nabi
    Melaikat and to protect him as a younger brother.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Malays are described as sea-folk who came overseas from Rum, Stambul,
    Sham, and Mecca; the narrating group later first encountered Malays in Johor.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:10
  text: Padang Berimbun is described as a plain of deep, bitterly cold dew, where
    the group again slept in caves.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The mountains of Keluntong are described as very near the sky and without
    trees or grass.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: At Keluntong there are souls of a sheep, a saddle-pony, and a gajah mena,
    and all these animals are said to have seven souls shaped like themselves.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The migration route proceeds from Keluntong through the hills of Kelantan,
    the hills of the Giants, the Seven Hills, Bukit Saguntong Guntang, Ulu Pahang,
    Johor, Sungei Ujong, and finally Selangor.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:14
  text: The titles of the chiefs are said to have first been given among the Seven
    Hills beyond Siam.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: At Ayer Tawar, Raja Lumba-Lumba Putih drove out Batin Siamang Putih, who fled
    to Sungei Ujong; Batin Siamang Putih's daughter married there and became mother
    of the Toh Klana of Sungei Ujong.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: 'The passage says the group settled in Selangor and remained there, while
    the Malay Peninsula changed: former straits reached inland, some hills were once
    on the coast, and there is now sea where dry land once was.'
  category: setting
  evidence_refs:
  - ev:9
  - ev:10
