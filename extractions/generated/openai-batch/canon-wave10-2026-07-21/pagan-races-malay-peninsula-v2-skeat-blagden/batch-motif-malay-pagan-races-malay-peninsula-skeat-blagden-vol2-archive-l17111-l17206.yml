candidate_motifs:
- id: motif:1
  label: sevenfold serpent-soul cosmology
  taxonomy_refs:
  - serpent
  basis: The passage identifies the seven rainbows as Naga Melaikat's seven snake-souls
    and describes the serpent or dragon as reaching to the gate of Heaven and Keluntong.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: The passage uses both 'snake' and 'dragon'; the extraction treats them
    cautiously as the same or closely associated figure because both are linked to
    Heaven's gate.
- id: motif:2
  label: primordial shining plain as new-earth setting
  taxonomy_refs:
  - divine_judgment
  basis: Padang Masah is a barren shining plain, and the footnote states that according
    to Mohammedan tradition it is the new earth after the day of judgment.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:11
  confidence: medium
  cautions: The judgment association is supplied by the editorial note, not by the
    narrated speech itself.
- id: motif:3
  label: ancestral migration through named sacred geography
  taxonomy_refs:
  - departure
  basis: The group moves through Padang Berimbun, Keluntong, the hills of Kelantan,
    the hills of the Giants, the Seven Hills, other named places, Johor, Sungei Ujong,
    and Selangor, where it settles.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:9
  confidence: high
  cautions: This is an origin-migration itinerary rather than a complete departure-return
    hero cycle.
- id: motif:4
  label: mountain near heaven with heaven-linking serpent
  taxonomy_refs:
  - cosmic_mountain
  basis: Keluntong is described as very near the sky, and the dragon reaches from
    the gate of Heaven to Keluntong.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly call Keluntong a world-axis or center;
    the cosmic-mountain classification is based on proximity to the sky and the heaven-linked
    dragon.
- id: motif:5
  label: elder-younger sibling prophets
  taxonomy_refs:
  - sibling_pair
  basis: Nabi Isa is described as the elder brother of Nabi Melaikat and as protecting
    him as his younger brother.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The relationship is between prophets of peoples, not necessarily a tale
    of twins or paired heroes.
- id: motif:6
  label: chiefly title origin and descent
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage says the chiefs' titles were first given at the Seven Hills and
    links Batin Siamang Putih's daughter to the Toh Klana of Sungei Ujong.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage gives an origin and descent account; a legitimating function
    is plausible but not explicitly argued in the passage.
- id: motif:7
  label: multiple animal souls shaped like the body
  taxonomy_refs: []
  basis: The elephant is called an elephant-soul, and the animals at Keluntong are
    said to have seven souls shaped like themselves.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: No supplied taxonomy family directly matches this soul-multiplicity pattern.
