canonical_text:
  quote: ''
  summary: 'The passage describes several Sakai demon and spirit beliefs: rejected
    or expelled souls returned to earth as demons; a Grave Demon fed and guided by
    fire for a limited period after death; invisible atmosphere, water, tree, and
    crop spirits; animal-form demons; and tree-cutting and rice-cultivation rituals
    involving spirits, charms, and the soul of rice.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A damned Batin soul is described as turned away by Granny Lanyut as unwashable
    and returned to earth as a Ghost Demon or Hantu Degup.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Hantu Degup sees fruit and water but cannot reach them, and wanders seeking
    someone to bring nourishment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ordinary people flee from the Hantu Degup, while a magician strikes at it
    with a rattan stick described as having a triple tiger-claw-like growth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Grave Demon must return to the grave in three days, and the fire is said
    to show it the way.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the Grave Demon finds no new home after three days, it sits by the fire
    at night eating and drinking from the tray, sleeps during the day, and after seven
    days dies and vanishes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: While the Grave Demon is alive and fed, it is described as harmless to survivors
    who visit the grave to bring food or attend to the fire.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Because the Grave Demon is invisible and its presence cannot be known, fire
    and food are offered for all members of the tribe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Invisible demons of the atmosphere are said to work through rain, heat, mountains,
    lakes, stones, and trees, but are described as not very dangerous and seldom killing.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Demon Huntsman or Hantu Seburu is a lost soul excluded from the Cloud-Husks
    and sent back to earth by Granny Lanyut.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Hantu Seburu resembles a jungle-man, disappears when seen, is never far
    from water, and may be swallowed in drinking and introduced into the blood.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Baunan Demon is contrasted with the Hantu Seburu and described as having
    the form of a huge black human figure.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Mati Anak or Stillborn-child Demon has two forms, a frog and a bird, and
    is described as a soul expelled from Paradise by Granny Lanyut.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Jemoi Demon resembles a black dog, disappears when encountered, is seen
    in bushes after a long journey, and its sight brings bodily prostration and swollen
    legs.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Tree-spirits belong to the class of invisible spirits and are described as
    not very dangerous and seldom killing.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: Crop-spirits also belong to the invisible class, and their chief is the Hantu
    Juling or Squinting Demon, which is exorcised at rice harvesting.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: Before cutting a tree, a Sakai taps the trunk three or four times with the
    back of the implement; the legendary explanation is that this gives notice to
    quit to the tree's Hantu.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Before felling trees for a padi-clearing, tools are charmed; women and children
    may not be present because of dangers from evil spirits.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: During rice planting and harvesting, ceremonies are performed to protect the
    rice, avoid waking mouse-demons, and secure the soul of the rice before harvest.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:19
  text: The passage begins to mention a Sakai custom of hanging up the jaws of apes
    shot with blowpipe darts, but the details are incomplete within the supplied excerpt.
  category: object
  evidence_refs:
  - ev:9
