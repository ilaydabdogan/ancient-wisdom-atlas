candidate_motifs:
- id: motif:1
  label: Rejected soul returned to earth as demon
  taxonomy_refs:
  - afterlife_journey_map
  - divine_judgment
  basis: Several demons are described as souls damned, excluded from Cloud-Husks,
    or expelled from Paradise by Granny Lanyut and sent back to earth.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage describes punishment and expulsion but does not define Granny
    Lanyut's ontological status; the 'divine_judgment' taxonomy is therefore broad
    and provisional.
- id: motif:2
  label: Hungry and thirsty ghost unable to reach visible food or water
  taxonomy_refs:
  - afterlife_journey_map
  basis: The Hantu Degup sees fruit and water everywhere but cannot reach them and
    wanders seeking nourishment.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a literal postmortem punishment pattern within the passage; broader
    classification should be reviewed.
- id: motif:3
  label: Postmortem feeding and guiding fire at the grave
  taxonomy_refs:
  - afterlife_journey_map
  - sacred_exchange
  basis: A grave fire guides the Grave Demon, and food and drink are provided in a
    tray; while fed, the demon is harmless to survivors.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage frames the rite practically rather than as a formal exchange;
    'sacred_exchange' is a cautious taxonomy assignment.
- id: motif:4
  label: Three-day and seven-day postmortem interval
  taxonomy_refs:
  - afterlife_journey_map
  basis: The Grave Demon must return in three days, and after seven days of being
    fed it dies and vanishes, ending food offerings.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The significance of the numbers is not explained in the passage.
- id: motif:5
  label: Waterborne demon entering the body through drinking
  taxonomy_refs: []
  basis: The Hantu Seburu is never far from water and may be swallowed in drinking,
    entering the blood.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No broader comparative claim is made here; the motif is recorded as a
    passage-level pattern only.
- id: motif:6
  label: Animal-form demon
  taxonomy_refs:
  - shapeshifter
  basis: The Mati Anak has frog and bird forms, and the Jemoi resembles a black dog.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage gives animal forms or resemblances but does not narrate an
    actual transformation event.
- id: motif:7
  label: Tree-spirit warned before felling
  taxonomy_refs: []
  basis: Before cutting a tree, a Sakai taps the trunk, explained as notice to quit
    to the Hantu of the tree.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The cited note states that Vaughan-Stevens could not get a satisfactory
    explanation beyond the legendary notice-to-quit account.
- id: motif:8
  label: Rice soul secured and crop demon exorcised at harvest
  taxonomy_refs:
  - seasonal_cycle
  basis: The Hantu Juling is exorcised at rice harvest, and a ceremony before harvest
    secures the soul of the rice, followed by a feast.
  evidence_refs:
  - ev:8
  - ev:12
  confidence: medium
  cautions: The passage is an ethnographic summary and does not provide a full ritual
    text or mythic narrative.
- id: motif:9
  label: Charming tools and excluding vulnerable persons before cultivation
  taxonomy_refs: []
  basis: Before padi-clearing, tools are charmed, women and children are excluded
    because of evil spirits, and the magician performs charms with the tools.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: This is a ritual-practice pattern rather than a narrative motif.
