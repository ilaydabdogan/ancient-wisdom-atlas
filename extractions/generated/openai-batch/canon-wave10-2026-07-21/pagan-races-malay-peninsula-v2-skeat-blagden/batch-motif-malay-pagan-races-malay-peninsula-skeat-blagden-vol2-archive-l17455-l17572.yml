canonical_text:
  quote: ''
  summary: The passage reports Mantra/Jakun beliefs and ritual practices concerning
    tigers as human sorcerers, omens and rice rites, high-place wishing sites, a magical
    flower at Batu Tre, offerings to mountain spirits, and the Tuju pointing spell
    performed by Poyang magicians.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Jakun or Mantra are reported to believe that a tiger encountered in their
    path is a human being who has sold himself to the Evil Spirit and taken tiger
    form by sorcery.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same report says that before a tiger is met, a man has been or might have
    been seen disappearing from the direction from which the tiger appears.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a new clearing is to be made, attention is paid to omens and charms are
    used to expel evil spirits.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the New Year's Day of Rice feast, the head of the family cuts a little
    new rice and guests receive some to take home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Batu Tre is described as a Wishing Rock in Klang where the Mantra have long
    resorted, and visitors must not carry fire there because a spark would make the
    rock take fire and be consumed.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A flower called chingkwi grows on the Wishing Rock, is not found elsewhere,
    and can only be gathered by women.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Possession of chingkwi is said to give attraction power: a woman possessor
    is followed by men, and a man possessor by women.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Chingkwi is carried in a small bamboo vessel kept in the ear lobe or fastened
    around the waist.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: A person wishing to obtain chingkwi must sleep with the woman who has it,
    take it stealthily, and leave eight or ten silver rings on her fingers; when she
    wakes, she knows the flower is lost beyond recovery.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: If chingkwi is carried to sea, its virtue is lost.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Gunong Berembun and other mountain summits are Wishing Places because each
    has its good spirit.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: At a mountain Wishing Place, a petitioner carries two white fowls and food
    samples, places the food in a rattan tray or basket, kills one fowl, deposits
    it in the tray, and sets the other fowl free.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: The petitioner silently addresses wishes to the spirit of the mountain and
    then prepares and eats a meal at the place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: If the wish is not fulfilled after repeated visits, the spirit is considered
    unfavourable and the petitioner goes to another mountain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Poyang magicians and a few others are said to have the power to afflict and
    destroy people by spells.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: In the Tuju or Pointing Ceremony, the magician uses wax from an abandoned
    bees' nest, a vessel of water, lighted candles, an incantation, sight of or an
    image of the victim, and a wind blowing toward the victim's residence.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:17
  text: After the magician throws the wax into the air, the wind is said to carry
    it to the victim, who feels struck and then becomes sick or dies according to
    the spell.
  category: sequence
  evidence_refs:
  - ev:9
