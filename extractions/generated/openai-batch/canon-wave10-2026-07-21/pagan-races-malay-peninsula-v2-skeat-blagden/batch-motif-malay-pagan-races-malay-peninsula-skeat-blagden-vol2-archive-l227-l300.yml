canonical_text:
  quote: ''
  summary: 'The passage describes Semang birth customs and beliefs: a person''s birth-tree
    is linked with death omens; a pregnant woman carries a magically decorated birth-bamboo
    made by her husband; soul-bringing birds are eaten and kept in the birth-bamboo;
    twins are explained by eating the soul-bird with an egg; the umbilical cord is
    cut with non-iron implements; and East Semang children, like Sakai children, may
    be slung from tree boughs while adults work nearby.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a person's birth-tree dies first, this is treated as a sign that the owner's
    death will follow.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Big and strong trees are selected as birth-trees, and a Semang who has killed
    another person, except in war, avoids the other person's birth-tree for fear that
    it will fall on him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The birth-bamboo is described as a hollow bamboo internode without knots,
    covered with magical designs, and carried hidden under the girdle by pregnant
    women.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The magical designs on the birth-bamboo are intended as charms against sickness
    and nausea and are incised by the husband.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A pregnant woman without a birth-bamboo is compared by the authors to a European
    woman without a wedding-ring.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The patterns of the birth-bamboo represent the child in the mother's womb.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The expectant mother keeps in the birth-bamboo the bird whose eating is believed
    to introduce the soul into the unborn child.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Kelantan Semang expression for a woman who has hope of offspring is glossed
    as meaning that she has eaten the bird.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The bird flesh is eaten piecemeal, kept in the birth-bamboo, replaced by one
    or two bones as it is eaten, and the bones are thrown away when the child is born.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: One named bird is said to bring male souls and another named bird is said
    to bring female souls.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Twins are said to arise from eating the soul-bird with an egg, and in that
    case there is only one birth-tree.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The umbilical cord may be severed by one of the women or by the child's father,
    on a block of soft jelotong wood called potong pusat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Iron may not be used for cutting the cord; the passage names a bamboo knife,
