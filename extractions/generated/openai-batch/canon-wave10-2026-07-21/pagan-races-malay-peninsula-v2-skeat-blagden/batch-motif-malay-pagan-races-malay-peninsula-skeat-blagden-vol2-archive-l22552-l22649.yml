canonical_text:
  quote: ''
  summary: The passage discusses camphor taboo language and argues that it cannot
    be explained solely as artificial use of obsolete dialects. It surveys Malay taboo
    vocabularies for royalty, occupations, and spirits; compares the Sangirese Sasahara
    used at sea against water-spirits; notes Javanese ceremonial registers and Dayak
    sacred chant language; and proposes that the Jakun may share an ancient Malayo-Polynesian
    tendency to specialize speech in marked contexts.
  language: English
  quote_policy: summarized
