canonical_text:
  quote: ''
  summary: The passage recounts traditions of conflict involving Guntar, the Sakai,
    Rawa, Beduanda, Malays, Benua, and related groups. It describes a council confrontation,
    a secret bargain leading to Rawa attacks on Sakai homes, enslavement, defensive
    battles, flight into the jungle, later migrations, settlement in Johor, reception
    of fugitives, and intermarriage with Orang Laut. The passage explicitly presents
    these events as explaining Sakai dispersal and differences in custom, while also
    noting that the legends cannot be treated as history.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Guntar threatened the Sakai; the Sakai called on fighting men of the Senoi,
    Kenaboi, and Besisi and went in a crowd to Guntar's house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Batins of the Jungle-folk agreed to a council and leaned their blowpipes
    against a coconut-palm, whose fall is attributed in the passage to the great weight
    of the blowpipes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Guntar yielded in the council episode and withdrew his threats, after which
    the Sakai dispersed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Guntar later simulated friendship toward the Sakai while secretly promising
    the Rawa Sakai land and presents if they would drive the Sakai away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Rawa attacked the Sakai at night in their homes, thrust spears through
    the floors, killed men, and sold women and children to Malays.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Bukit Guling Batang, Sakai defenders rolled rocks and stones down from
    screes onto attacking Rawa, forcing the Rawa to retreat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Because the Rawa had better weapons, many Sakai were killed or enslaved, and
    others fled into the jungle where the Rawa did not follow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that this conflict caused wide dispersal, destruction of
    the race, and differences in customs among separated Sakai branches.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A later tradition says Guntar broke his word to the Rawa, after which the
    Rawa attacked the Beduanda and took many of their children to sell.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says that for many generations Malays of the Peninsula sometimes
    took children of Sakai parents and sold them as slaves, without further organized
    attacks.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the Malays of Kedah attacked Pengkalan Tampoi, Batin Alam withdrew with
    allied Benua groups to the mountains of Johor and later united with Sakai at Klang.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Orang Benua who remained in Johor went southward, while other Sakai returned
    to Muar, where Menangkabau wanderers later arrived.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Orang Benua reached Batu Pahat, were attacked there by unidentified men
    in boats, fled along the coast, turned inland, and settled on the river Sembrong.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: At Sembrong and nearby forest country, the Orang Benua received fugitives
    fleeing the Bataks and later hosted many Sakai fleeing from the Rawa.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: The Benua later moved westward along the Strait of Johor, encountered Orang
    Laut, and intermarried with them.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:16
  text: An editorial note in the passage cautions that these legends cannot be taken
