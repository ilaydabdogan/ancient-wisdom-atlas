candidate_motifs:
- id: motif:1
  label: Council confrontation resolved by show of collective force
  taxonomy_refs: []
  basis: The Sakai arrive in a crowd with allied fighters; the Batins attend council,
    and the blowpipes leaning against a coconut-palm are described as so heavy that
    the tree falls, after which Guntar yields.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not explicitly interpret the falling palm as supernatural;
    it is recorded as part of the tradition.
- id: motif:2
  label: False friendship and proxy attack
  taxonomy_refs: []
  basis: Guntar is said to simulate friendship with the Sakai while secretly promising
    the Rawa land and gifts to drive them away.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a political-conflict motif in the recorded tradition, not a divine
    or cosmological episode.
- id: motif:3
  label: Night raid through the raised house floor
  taxonomy_refs: []
  basis: The Rawa attack Sakai homes at night by thrusting spears up through the floor
    and killing men as they hurry out.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No broader comparative claim is made in the passage.
- id: motif:4
  label: Defensive high ground and rolling stones
  taxonomy_refs: []
  basis: At Bukit Guling Batang, Sakai defenders roll rocks and stones down on attacking
    Rawa and force them to retreat.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The episode is martial and tactical; no sacred mountain symbolism is explicit.
- id: motif:5
  label: Flight into forest causing dispersal and changed customs
  taxonomy_refs:
  - departure
  basis: After defeat and enslavement, Sakai flee into the jungle, and the passage
    states that this caused their wide dispersal and differences in custom.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The taxonomy reference to departure is broad; the passage frames the movement
    as forced flight rather than heroic quest departure.
- id: motif:6
  label: Broken promise turns former ally against sponsor
  taxonomy_refs: []
  basis: Later tradition says Guntar broke his word to the Rawa, who then attacked
    the Beduanda and took children to sell.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives this as tradition and does not provide independent historical
    verification.
- id: motif:7
  label: Child capture and slave sale across generations
  taxonomy_refs: []
  basis: The Rawa take Beduanda children to sell, and Malays of the Peninsula are
    later said to have taken Sakai children and sold them as slaves over many generations.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: This is a recurring social-violence pattern in the passage, not a mythological
    divine-child motif.
- id: motif:8
  label: Migration, refuge, and group formation by alliance and intermarriage
  taxonomy_refs:
  - departure
  basis: Batin Alam and Benua-related groups withdraw, unite or separate, Orang Benua
    flee attackers and settle elsewhere, receive fugitives and Sakai, then intermarry
    with Orang Laut.
  evidence_refs:
  - ev:8
  - ev:10
  - ev:11
  - ev:12
  confidence: medium
  cautions: The departure taxonomy is only approximate; the passage is an ethnographic
    migration tradition rather than a quest narrative.
- id: motif:9
  label: Etiology of dispersal and branch differences
  taxonomy_refs: []
  basis: The passage explicitly says the conflict explains wide Sakai dispersal, destruction,
    and differences in customs among separated branches.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage itself includes an editorial caution that the legends cannot
    be taken as history.
comparison_claims:
- id: claim:1
  claim: The passage functions as an etiological tradition explaining group dispersal
    and differences in custom after conflict and flight.
  claim_level: same_function
  target: origin-of-dispersal and custom-differentiation narrative pattern
  evidence_refs:
  - ev:5
  counter_evidence_refs:
