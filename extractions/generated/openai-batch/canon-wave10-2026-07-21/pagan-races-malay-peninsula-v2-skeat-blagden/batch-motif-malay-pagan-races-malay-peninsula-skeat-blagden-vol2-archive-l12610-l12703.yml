canonical_text:
  quote: ''
  summary: 'The passage recounts a legendary Perak royal genealogy involving Megat
    Terawis and marriage alliances, then summarizes Semang beliefs and stories about
    animals: chief souls migrating into elephants and tigers; Pie transforming into
    a stick-insect to punish and reshape the elephant; the elephant’s quarrel with
    the tapir; Malay parallels about the stick-insect; and Pie transforming into a
    pangolin to frighten and mark the elephant.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Megat Terawis wounds Salam Balik with a bullet from a remarkable gun, after
    which Salam Balik makes peace and gives his daughter to Megat Terawis in marriage.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The daughter of Megat Terawis and the son of Mouse-deer Hill are married,
    and their descendants are identified as the royal family of Perak.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The elephant is described as an animal into which the souls of chiefs are
    believed to migrate after death.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tiger is also described as an animal into which the souls of dead chiefs
    are supposed by the Semang to migrate after death.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:5
  text: In the Semang story, the elephant originally has no trunk and has four large
    teeth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The elephant harasses the Semang by stealing fruit from their back-baskets
    and disturbing flowers planted by Pie.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Semang ask Pie for help, and Pie turns himself into a stick-insect on
    a twig.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Pie, as a stick-insect, knocks out the elephant’s lower teeth and catches
    the elephant by the nose; the elephant draws back and the nose becomes a trunk.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The elephant begs for mercy and is allowed to go, but must keep the trunk
    as a reminder.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The elephant threatens the tapir after the tapir comments on the elephant’s
    changed features; the tapir thereafter stays by the river-side while the elephant
    lives in the hills.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The elephant is said to strike branches against a tree or his own foot before
    eating them in order to drive away any stick-insect.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The author reports that local Malay stories in Kedah and on the east coast
    connect the stick-insect with danger to elephants, including the name “elephant’s
    fish-poison.”
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: In a second Semang story, the elephant attacks Semang sleeping in the jungle,
    and they call Pie for help.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Pie turns himself into a manis or pangolin, rolls up, fastens onto the elephant’s
    trunk, and causes scales to run into the elephant’s foot.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: After recognizing Pie’s voice, the elephant asks for mercy; since then the
    elephant has a finger at the end of the trunk and fears the cry of the manis.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Inland Malays say the elephant cannot endure the manis, and Semang elephant-hunters
    imitate the manis cry to drive elephants.
  category: action
  evidence_refs:
  - ev:7
