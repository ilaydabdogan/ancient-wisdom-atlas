canonical_text:
  quote: ''
  summary: The passage describes Sakai practices concerning dreams, including reports
    to ritual specialists, spirit inspiration for magicians, communal dream gatherings
    on mountain summits, the Batin's invocation of Tuhan, interpretation of disguised
    dreams, and naming children from dream signs. It then introduces Sakai love-philtres,
    especially the Chinduai plant, and begins a tale in which Dato' Jaja' refuses
    betel to visiting Sakai, who vow revenge; a Sakai medicine-man makes chenduwai
    or witchcraft to affect her at a distance. Footnotes describe related love-philtre
    plants valued by Malays.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sakai attach great importance to dreams, and men report them to the magician
    while women report them to the midwife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sakai magicians are said to receive inspiration in dreams from well-disposed
    spirits.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: On important occasions, dreams awaited by magicians and the tribe involved
    the Batin and were associated with gatherings on the highest accessible mountain
    summit in the tribal territory.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mountain gatherings occupied several days, and each dream was required
    to be repeated on three successive nights.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: No such gathering had occurred since the disappearance of Berchanggei Besi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Current magicians remembered that the Batin invoked Tuhan, fell asleep immediately,
    received dreams in disguised form, and had those dreams interpreted by magicians
