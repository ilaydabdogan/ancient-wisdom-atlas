canonical_text:
  quote: ''
  summary: 'The passage transitions into a chapter on burial customs and beliefs.
    It contrasts Negrito, Sakai, and Jakun attitudes toward ghosts and describes multiple
    mortuary practices: corpse desertion, tree or platform exposure, fires at graves,
    provisioned huts and food for spirits, water trenches for spirit canoes, bamboo
    tubes for feeding corpses, and a burial bamboo used as credentials before a universal
    Judge. Footnotes compare elevated exposure with Andamanese practice and compare
    the Selangor Besisi soul-hut with a Balinese grave-side hutch involving offerings
    to Butas.'
  language: English
  quote_policy: summarized
