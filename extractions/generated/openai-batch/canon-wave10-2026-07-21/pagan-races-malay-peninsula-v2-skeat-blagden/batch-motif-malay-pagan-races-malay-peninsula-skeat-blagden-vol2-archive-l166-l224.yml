canonical_text:
  quote: "“Before they leave the presence of Kari the souls sit in the branches of
    a big tree behind his seat…”"
  summary: 'The passage reports Semang/Negrito beliefs about souls before birth: animal
    souls may reside in fungi or plants; harmful souls may attack unborn children;
    birth-bamboo designs and Puttos’ charms protect childbirth; soul-birds and other
    birds mediate human souls; souls wait near Kari before embodiment; alternate traditions
    link fish, bird eggs, birth-trees, re-embodiment, and twins.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: An embryonic human body may die after a fight involving souls, while the human
    soul is said to retain victory over the tiger-soul.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tiger-souls in fungi are described as newly developed souls from a stock that
    Kari created and scattered on the earth like seeds.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Inimical creatures obtain souls from poisonous fungi, while harmless creatures
    obtain souls from harmless fungi.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A harmful beast-soul in a poison-fungus attacks an adult eater directly, but
    in the case of a pregnant woman it attacks the unborn child’s soul as the weaker
    target.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A snake or other beast-soul in poison-fungus may bite the unborn child’s body
    when the soul-bird falls upon that fungus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A design on the mother’s birth-bamboo can repel attacks, and Puttos are called
    in difficult births to avert attacks by special charms.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Phosphorescent fungi are said to contain unborn souls of night-beasts and
    to give light so a female can find the soul she seeks.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage distinguishes West Semang, who no longer believe in the soul-bird
    and use it as food, from East Semang/Pangan, who kill the bird on behalf of women.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: East Semang/Pangan also believe that souls of Malays, Chinese, and Siamese
    are obtained from other kinds of birds corresponding to those peoples’ physical
    peculiarities.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Before leaving Kari, souls sit in the branches of a big tree behind his seat
    until he sends them away.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Semang are said not to know the souls’ pre-embodied shape, except that
    it is not human; human form is attained only in the body.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: After death, human-shaped souls cannot return to Kari for new bodies and must
    wait elsewhere.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Because the soul never dies, soul-birds do not die until completing their
    mission and cannot be accidentally shot before the predestined slayer shoots at
    them.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Another tradition places fish souls in riverside grasses and bushes, with
    each fish species corresponding to a plant species; the same is said for sea-beasts.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: In the alternate tradition, birds fly behind the mountains at sunset to the
    country of the Sen-oi, eat unknown fruits, and thereby obtain souls for their
    eggs.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The birds called chim-iui and til-til-tapa need no souls because they themselves
    are human souls in visible bird shape.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: When chim-iui and til-til-tapa require life for their eggs or are ready to
    fetch more human souls, they eat the fruit of a man’s or woman’s birth-tree.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: When one of these birds dies naturally, this is attributed to the death of
    a child in the womb, though opinions differ on the undeveloped soul’s fate.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:19
  text: Some hold that the undeveloped soul returns to Kari, is re-embodied in another
    bird, and that eating that bird’s flesh brings twins to another Semang woman.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:20
  text: The passage states that when an East Semang/Pangan person dies, that person’s
    birth-tree dies soon afterward.
  category: relationship
  evidence_refs:
  - ev:12
