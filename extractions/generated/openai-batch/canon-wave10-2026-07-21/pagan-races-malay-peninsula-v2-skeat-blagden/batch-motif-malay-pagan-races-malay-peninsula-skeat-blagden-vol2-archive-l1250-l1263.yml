  summary: The passage identifies a shell-shaped piece of wood described by Vaughan-Stevens
    as probably an ordinary waist ornament for young girls, shaped like a fan-shell
    or heart and made of wood, coconut-shell, or silver according to family means.
    It notes that such an ornament is worn by female children until about age five
    or six and may have been carried by a mother as an anticipatory charm. The passage
    also says the tribal attribution is unclear, likely not O. Laut, and probably
    refers to a Malayizing or Malayan tribe, perhaps the Jakun, because the custom
    is described as identical with a Malay custom.
