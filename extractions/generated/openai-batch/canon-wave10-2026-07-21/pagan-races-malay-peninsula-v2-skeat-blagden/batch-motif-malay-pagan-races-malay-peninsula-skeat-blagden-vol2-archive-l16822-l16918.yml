canonical_text:
  quote: ''
  summary: The passage describes the Yearning Bamboo and the Chingkwoi or Chinduai
    as rare and powerful charms in the Malay Peninsula. A splinter of the Yearning
    Bamboo is said to be placed between the teeth to make the voice irresistibly melodious
    and coercive. The Chingkwoi/Chinduai is described as a fragrant rootlet found
    beneath a crag on an Ulu Klang mountain; a Jakun seeker must ascend, build a shelter,
    and fast until a kite that nests on the crag drops a piece of the plant. The passage
    also begins an incomplete Besisi tradition about the Jakun chief Si Nibong and
    his palm-material house near the overlord Busu Baba.
  language: English
  quote_policy: summarized
