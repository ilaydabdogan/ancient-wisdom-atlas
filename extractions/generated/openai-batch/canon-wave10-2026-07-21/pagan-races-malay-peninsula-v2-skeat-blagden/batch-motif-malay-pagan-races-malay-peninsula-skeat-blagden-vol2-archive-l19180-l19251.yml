canonical_text:
  quote: ''
  summary: The supplied range includes fragmentary notes about witches who command
    animals or transform into lizards, tree-dwelling ponteanas, and plants that speak
    remedies on a day called divaly. The Jakun of Johor section reports belief in
    a supreme being called Tuhan Allah, belief among some in post-death punishment
    of sinners in hell fire, partial religious knowledge attributed to Malay contact
    among Menangkabau-state Jakun, learned persons called Pawang, absence of sun,
    moon, or idol worship, and belief in Hantu demons including an introduced Hantu
    Semambu account.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fragment says witches, described as pupils of the Benua of the caverns of
    Gunoledam, subdue crocodiles, elephants, tigers, and serpents by cabalistic words,
    and that others transform into lizards to do evil.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A kind of witch called ponteanas is said to reside in tall trees and to be
    women who died in child-bed; the passage also calls them demons and says they
    are hostile to man.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the equinox, especially the autumnal equinox, on a day called divaly, trees,
    herbs, and plants are said to talk and disclose remedies for every malady; people
    hide in the forest to hear them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A great part of the Jakun know and acknowledge a supreme being called by the
    Malay name Tuhan Allah, glossed as the Lord God.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some Jakun of Johor admit punishment for sin, and some declare that sinners
    will be thrown after death into the fire of hell, while not knowing of a reward
    for good men and good works.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Jakun of the Menangkabau States are said to have more religious knowledge,
    probably through more frequent communication with Malays, and some speak confusedly
    of God as creator and of Adam, Abraham, Moses, David, and Solomon.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The more learned persons are called magicians or Pawang, and the passage states
    that the Jakun do not worship the sun, the moon, or idols.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage states that the Jakun devoutly believe in demons or Hantu and
    introduces Hervey's account of the Hantu Semambu through comparison with unearthly
    jungle-night sounds.
  category: speech
  evidence_refs:
  - ev:8
