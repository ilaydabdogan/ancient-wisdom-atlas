canonical_text:
  quote: ''
  summary: Fragmentary ethnographic notes state that Malays of N. Sembilan, Naning,
    and Rembau came directly from Sumatra; explain the terms Juanda and Beduanda in
    relation to Jakun and mixed Malay-Jakun descendants in Rembau; note that certain
    songs do not appreciably vary in tenor or form; and describe musical instruments
    used by the Mantra of Malacca to attract game and by others to imitate the chebau
    bird.
  language: English
  quote_policy: summarized
