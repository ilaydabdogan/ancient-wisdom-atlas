canonical_text:
  quote: ''
  summary: The passage reports Mantra traditions about souls going to Fruit Island
    for food; Tuhan Dibawah, the Lord of the Underworld, as creator and supporter
    of the earth; the first brothers Poyang Mertang and B'lo, whose descendants are
    partly changed into trees and for whom Death is instituted to relieve overcrowding;
    a Borie account of Tuhan Allah, Raja Brahil/Gabriel, firmament creation, and a
    day of judgment belief; and beliefs about diseases as spirits or as caused by
    spirits and human spells, including named disease demons.
  language: English
  quote_policy: summarized
