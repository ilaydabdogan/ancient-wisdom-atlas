canonical_text:
  quote: ''
  summary: 'The passage reports Jakun birth customs from Begbie and Favre: use of
    a round wooden support during labour, a husband kindling fire and acting as midwife,
    post-birth proximity to fire, naming children from the tree under which they were
    born, lack of ordinary assistance from Pawangs or midwives in another account,
    and a reported rite in which newborns are washed in a rivulet and passed over
    a fire with incense or benzoin. Favre adds a broad comparison to child-passing-over-fire
    practices elsewhere.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Begbie's account, a Jakun woman in labour was placed face down on a round
    piece of wood fastened at both ends in a shed, pressing on the abdomen until the
    child was born.
