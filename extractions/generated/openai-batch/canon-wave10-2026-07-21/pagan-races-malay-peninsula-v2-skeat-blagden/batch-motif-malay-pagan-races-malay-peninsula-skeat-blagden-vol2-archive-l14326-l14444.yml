canonical_text:
  quote: ''
  summary: The passage reports Sakai ritual procedures involving loopwork, demons,
    and a birth-blessing spell; summarizes and criticizes an alleged Sakai clan or
    quasi-totemic system; notes Semang and Jakun evidence regarding totemism; and
    describes a Sakai charm against tigers in which an effigy, water-vessel, Latoom-flower,
    and leaf tassels are used to transfer and imprison a tiger-spirit blamed for illness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Loopwork is taken home and hung up; if it comes in half, demons escape and
    return to their original dwelling place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A spell called Tekan Badan K'luar, or Birth-blessing, is described as one
    of the original duties of the magician's profession, not secret, and performable
    by any man or woman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The magician generally imparted the Birth-blessing incantation to the Penglima
    of the place and his wife so they could substitute for him in urgent cases.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The editor states that Vaughan-Stevens did not find a consistent theory and
    that his notes often confuse clan with tribe, making reconstruction impossible.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'An alleged Sakai clan system is described as having five original main groups:
    Snake, Fish, Leaf, Thorn, and Tiger.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Snake clan's sub-groups are said to take Python, Cobra, Hamadryad, and
    similar serpent species as eponymous names.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The original purpose of sub-group crests is reported as a property mark on
    blow-tubes and as a pattern for face-painting.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Marriage regulations are said to be strictly endogamous, with marriage outside
    the clan involving expulsion and giving rise to new clans such as Civet-cat, Crocodile,
    and Scorpion.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says it is premature to use the term totemism because information
    is lacking about the sacrosanctity of the eponymous species.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that among the Semang there is no trace of totemism.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some Jakun groups reportedly abstained from elephant flesh, saying that it
    caused sickness.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A Sakai charm against tigers is made from a bundle of s'lowk leaves rolled
    to represent a tiger's body and transfixed with imitation bamboo arrows.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: The tiger charm includes a rattan strip, a leaf painted with magical patterns
    in dragon's blood, a water-vessel, a Latoom-plant flower, and other additions,
    and is hung in the house.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Dysentery or colic is attributed to the tiger-spirit; the patient is sprinkled
    with water, and the spirit is believed to transfer to the Latoom-flower and be
    imprisoned by s'lowk tassels.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Vaughan-Stevens found these tiger charms among Central Sakai or Senoi, Besisi,
    and Kenaboi, but not among Jakun or Benua-Jakun.
  category: setting
  evidence_refs:
  - ev:11
