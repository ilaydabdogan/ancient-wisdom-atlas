canonical_text:
  quote: ''
  summary: 'The passage describes Mantra and Jakun of Berembun burial customs: limited
    mourning, abandonment of houses or clearings after death, grave fires for the
    deceased spirit or ghost, placement of food and objects on a Mantra grave, and
    a bamboo tube placed at some young children''s graves. It also notes comparisons
    to Benua of Johor graves and to a wider grave tube practice mentioned in a footnote.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Mantra did not wear signs of mourning, and deaths were rarely wept over.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The house of a deceased Mantra person was abandoned by survivors, and usually
    the whole village emigrated.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Logan reports that a Mantra grave was not protected by a roof like that of
    the Benua of Johor, though it otherwise resembled it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Mantra kindled a log fire above the grave so that the deceased soul or
    spirit could warm itself and not weep or wail from cold.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Mantra placed foodstuffs, betel materials, tobacco, a wooden peeling-knife,
    and a previously broken blowpipe on the grave while praying the soul to seek no
    more from them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After a death in a clearing, the Mantra planted nothing more there and abandoned
    it after the existing crop or plants were gathered.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Among the Jakun of Berembun, a fire was burned above the grave for three or
    seven nights to prevent the deceased ghost from crying in the grave.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A bamboo tube was placed with one end near the corpse's nose and the other
    projecting above the grave; the practice was said to be limited to children who
    died young.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The stated explanation for the bamboo tube was that gases in the body needed
    an outlet to prevent swelling and bursting.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A footnote suggests that the bamboo tube custom may be a misunderstood survival
