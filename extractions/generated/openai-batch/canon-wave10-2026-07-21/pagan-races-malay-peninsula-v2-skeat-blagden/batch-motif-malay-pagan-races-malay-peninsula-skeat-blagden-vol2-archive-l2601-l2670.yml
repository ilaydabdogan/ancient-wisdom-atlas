canonical_text:
  quote: ''
  summary: The passage reports Sakai explanations of face-paint and a fern taboo;
    describes a bamboo-stamper exorcism in which a magician stands at the centre facing
    the rising sun or moon while face-patterns are displayed to repel demons; and
    describes menstrual purification customs involving seclusion, a bamboo receptacle,
    water, a plant or flower pattern, and neutralization of blood to prevent the Blood
    Demon from harming fertility.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A lay account says plucking up the fern in play would break a peace made in
    ancient times by magicians with the spirits of the fern.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The magicians said the face-paint custom had been introduced to distinguish
    unmarried from married people, and that in old councils an unmarried male could
    not take part.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: According to the magicians' version, children were told the fern story so
    that they would not pluck up the fern.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When bamboo stampers are used for exorcism, the whole clan gathers; men sit
    on the ground around the magician, while women and children sit behind the men.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The magician stands in the centre facing the rising sun or moon; such assemblies
    are frequently held at night and by firelight.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The men have their faces painted and their hair pushed back so that demons
    may see the face-patterns and retire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sakai women keep apart during monthly purification and remain at or near home;
    some close the house-door, but the husband is admitted.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A special bamboo receptacle called chit-nat or chit-nort is used for purification
    on such occasions.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The decoration of the bamboo receptacle represents a plant said by the sage-femme
    not to grow in the district now inhabited by the tribe.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: In former times the plant was placed in water used for purification; at present
    the flower pattern is used to neutralize the blood.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: If the blood is not neutralized, the Blood Demon is said to spring from it,
    creep to the woman's body, stop her courses, and prevent her from bearing healthy
    children.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The footnote describes the receptacle as a bamboo segment suited for use as
    a water cup, with an outer surface painted with ornamental stripes, right-angled
    counter-projections, irregular five-rayed stars, and black-and-white dotted outlines.
  category: object
  evidence_refs:
  - ev:10
