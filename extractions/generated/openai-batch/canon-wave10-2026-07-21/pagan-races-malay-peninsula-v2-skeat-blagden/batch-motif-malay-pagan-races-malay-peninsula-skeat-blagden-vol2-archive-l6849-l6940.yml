canonical_text:
  quote: ''
  summary: The passage describes an enacted dance in which a woman searches for a
    husband, rejects several suitors, loses them to rival young women, laments with
    words such as death and malediction, and finally accepts the status of second
    wife. A footnote describes Perak Negrito singing practices in which words are
    selected or strung together according to mood or sound, including death, fire,
    natural imagery, and landscape names. The passage then describes Perak Sakai musical
    instruments, chiefly bamboo percussion and a bamboo harp or guitar, with comparisons
    to Semang usage and a reported but questioned Siamese borrowing claim.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman dances around a circle, waves or modulates her arms, directs her hands
    behind her back, and the action is explained as looking for a husband in the forest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A suitor appears, dances around the woman, sings of flowers, birds, and insects,
    follows her as she moves backward, and presses for her hand without success.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A second and a third suitor appear and are each repulsed in turn.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Three other young girls arrive; the earlier suitors leave the first woman
    for these rivals, who accept them and dance and talk with them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The first woman tries to regain the suitors, fails, stops in the middle of
    the circle, cries lamentably, and repeats words including Death and Malediction.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: After about ten minutes one man returns to the first woman, and she accepts
    the position of second wife.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage reports that Perak Negritos sing words strung together at random,
    with joy or sorrow distinguished by the words used and by the tune or air.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: In dull moods they may sing names of rivers, mountains, and hills; after hunting
    they may sing words connected with wild animals, the forest, and weapons.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: After a death, they are reported to repeat words such as Death, Decay, Fire,
    and the name of the deceased.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: When happy, they are reported to sing of flowers, birds, and small insects;
    at times words may be chosen for sound rather than meaning and lengthened with
    nasal syllables.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Perak Sakai music is described as including bamboo slivers clashed together
    like castanets.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: Another Perak Sakai percussion method uses short bamboos open only at the
    upper end as stampers, struck on the floor or a piece of wood at regular intervals.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: A bamboo harp or guitar is described as found among the Sakai; one example
    seen among the Perak Sakai had three strings on a large joint of bamboo.
  category: object
  evidence_refs:
  - ev:12
- id: obs:14
  text: A letter is reported as stating that Sakai of both Kinta and Batang Padang
    use frets, though the supplied passage breaks off before more detail is given.
  category: object
  evidence_refs:
  - ev:13
- id: obs:15
  text: A footnote says that two bamboo sticks called sok yet are used in the Tuang-tuang
    ceremony among the Sakai and that Sakai say the custom is borrowed from the Siamese;
    the source immediately questions this borrowing claim.
  category: relationship
  evidence_refs:
  - ev:14
  - ev:15
