canonical_text:
  quote: classify the spirits and demons of all three races according to their nature
    and origin
  summary: The passage contrasts Semang demonology with that of two other groups,
    then presents a comparative table classifying Semang, Sakai, and Jakun spirits
    and demons by natural domain, including atmosphere, earth, trees, crops, fire,
    and water.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage says there is a wide gulf between the religion of the two other
    races and that of the Semang, whose demonology is described as very mild and rarely
    terrifying to them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author presents a table intended to classify the spirits and demons of
    Semang, Sakai, and Jakun according to their nature and origin.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The table’s first major class is Nature-spirits, with subdivisions including
    atmosphere-spirits, earth-spirits, tree-spirits, crop-spirits, fire-spirits, and
    water-spirits.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
- id: obs:4
  text: Atmosphere-related entries include sky-spirits, wind-spirits, a sun-spirit
    entry, rain-spirits, wind demons, and heat-spirits, with several named beings
    or demons listed in the columns.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Earth-related entries include spirits of soil, hills and mountains, swamps,
    forest, stones, and lakes, with named entries such as Ya' Takell, Jin Sarapat,
    H. Siburu, H. Tinggi, H. Baunan, and Orang Bunyan.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Tree-related entries appear in all three columns: Semang disease-spirits
    embodied in trees, Sakai demons special to each tree, and Jakun or Besisi demons
    associated with eaglewood, camphor, and gutta.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'Crop, fire, and water entries are unevenly recorded: some columns say not
    recorded or not specified, while the table names H. Juling as a crop spirit and
    H. Sungei as a river demon.'
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: A footnote cautions that some Vaughan-Stevens spirit names may be Malayan,
    while also noting agreement in several cases with Hale’s records of Sakai.
  category: other
  evidence_refs:
  - ev:8
