canonical_text:
  quote: ''
  summary: 'The passage describes musical instruments and feast adornment among the
    Kedah Semang and related groups: a Jews''-harp-like instrument with organic components,
    bamboo mouth-flutes and nose-flutes, a rare stringed bamboo guitar, a disputed
    report of a Semang drum probably attributable to Sakai, and festal body decoration
    with white leaf bands and fragrant leaves and flowers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A performer increases the sound of an unnamed instrument by holding its body
    between the teeth or over a hollow bamboo case.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The instrument has a twisted vegetable-fibre string and a handle made from
    the rib of a small monkey, and is described as similar to the Jews'-harp of the
    Peninsular Malays.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The Semang of Kedah use two kinds of flutes: a common bamboo mouth-flute
    and a nose-flute; both are rarely used to accompany songs.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The common flute is usually about a foot long, made from young bamboo, has
    three finger holes besides the mouth-hole, and is often decorated with incised
    patterns.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The nose-flute has a similar number of holes and is about twice the length
    of the common flute; nostril plugging is not recorded for the tribe, though the
    author recalls possibly seeing it, and the practice is stated to occur among the
    Sakai.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A stringed bamboo instrument or guitar is occasionally found among the Semang
    but is said to be very rare and probably not Negrito; it is made from a large
    bamboo segment with raised outer-skin strings, wooden wedge bridges, and rattan
    rings.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Use of the drum among the Semang is attributed only to De Morgan, but the
    author cautions that the report likely refers mainly or wholly to Sakai because
    De Morgan confuses the groups and describes Sakai drum-making in identical terms.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: On festal occasions, both sexes among the Kedah Semang wear white Licicala
    leaf bands instead of usual ligatures and insert fragrant leaves and flowers under
    the bands, in the girdle, on the crown of the head, and at the back of the neck.
  category: action
  evidence_refs:
  - ev:8
