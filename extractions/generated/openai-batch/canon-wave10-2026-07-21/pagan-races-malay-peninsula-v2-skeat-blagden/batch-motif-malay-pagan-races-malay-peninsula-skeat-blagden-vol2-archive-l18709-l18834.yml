candidate_motifs:
- id: motif:1
  label: Priest-physician-sorcerer as divine intercessor
  taxonomy_refs: []
  basis: The Poyang is described as combining priestly, medical, and sorcerous roles
    and as the only person entitled to implore mercy from Pirman.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a social-ritual role pattern rather than one of the supplied named
    motif families.
- id: motif:2
  label: Distant magical attack by pointing weapon and spells
  taxonomy_refs: []
  basis: The Tuju ceremony is explicitly described as killing a distant enemy through
    spells and by pointing a dagger or sumpitan toward the enemy's residence.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No supplied taxonomy family directly corresponds to this harmful-magic
    pattern.
- id: motif:3
  label: Nocturnal spirit invocation producing trance knowledge
  taxonomy_refs:
  - wisdom
  basis: The Bersawai rite uses night, fire, incense, herbs, and a call to the mountain
    spirit; if successful the spirit descends, induces trance, and imparts desired
    knowledge.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The taxonomy link to wisdom is based on imparted knowledge; the passage
    frames it as ritual practice rather than an abstract wisdom myth.
- id: motif:4
  label: Magician's tiger familiar and post-mortem tiger embodiment
  taxonomy_refs:
  - shapeshifter
  basis: Tigers are subject to Poyangs and attend them; Newbold's account adds that
    a dead Poyang's soul enters a tiger and appears in tiger form.
  evidence_refs:
  - ev:4
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage speaks of metempsychosis or apparition, not necessarily voluntary
    bodily shapeshifting; the taxonomy link is approximate.
- id: motif:5
  label: Sickness as divine order executed by a life-eating spirit
  taxonomy_refs:
  - divine_judgment
  basis: Illness is explained as Pirman ordering the Earth Genie to eat a person's
    life, with death following unless Pirman revokes the mandate.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage does not state that the sickness is moral judgment; it only
    describes a divine mandate over life and death.
- id: motif:6
  label: Successor initiation through fearless ordeal, fire-incense action, trance,
    and familiar spirits
  taxonomy_refs:
  - initiation
  basis: The Poyang's son seeking similar powers must watch alone, face a tiger-form
    apparition without fear, cast incense on fire, and then enter trance as familiar
    spirits are acquired.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The account is presented as Newbold's comparison within a footnote rather
    than the main narrator's direct observation.
- id: motif:7
  label: Ancestral compact with an animal enabling supernatural succession
  taxonomy_refs:
  - sacred_exchange
  basis: The transmigration of the Poyang's soul into a tiger is said to result from
    an ancient compact made by the Poyang's ancestors with a tiger.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The terms of the compact are not given; sacred exchange is inferred only
    from the stated compact.
comparison_claims:
- id: claim:1
  claim: The passage itself invites comparison between the main statement that Poyangs
    have tigers in attendance and Newbold's account of a deceased Poyang's soul entering
    a tiger and initiating the heir through a tiger apparition.
  claim_level: same_motif
  target: Newbold account of Poyang-tiger metempsychosis and successor initiation
  evidence_refs:
  - ev:4
  - ev:9
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: 'Both accounts are presented in the same passage, but the main text
    and footnote differ in emphasis: one concerns tiger attendance and tiger-killings,
    while the other concerns post-mortem transmigration and initiation.'
- id: claim:2
  claim: The Bersawai rite and the successor initiation share the function of trance
    as a means through which supernatural knowledge or powers are obtained.
  claim_level: same_function
  target: Trance-mediated acquisition of knowledge or power within the passage
  evidence_refs:
  - ev:3
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The two scenes differ in ritual setting and participants; the passage
    does not state that they are the same ceremony.
