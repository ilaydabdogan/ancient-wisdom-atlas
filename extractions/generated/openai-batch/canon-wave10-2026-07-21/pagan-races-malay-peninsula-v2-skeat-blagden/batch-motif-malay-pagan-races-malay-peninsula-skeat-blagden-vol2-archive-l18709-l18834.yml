canonical_text:
  quote: ''
  summary: The passage describes Poyang magicians among the Benua-Jakun/Malay context
    as priest-physician-sorcerers who can implore Pirman, cure or inflict illness,
    command or be associated with tigers, perform nocturnal rites with instruments,
    incense, fire, herbs, and trance, and invoke Jewa-Jewa as heavenly intermediaries.
    A cited Newbold account adds a post-mortem Poyang-to-tiger transmigration and
    an initiation ordeal for the Poyang's son involving a tiger apparition, incense
    on fire, trance, and female familiar spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Poyang is described as a magician and as an order combining the functions
    of priest, physician, and sorcerer; no other person is supposed to have the right
    to implore mercy from Pirman.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Malays are said to have greater faith in Poyang supplications and greater
    dread of their supernatural power than the Benua.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Poyangs are believed able to cure severe illnesses and to inflict disease
    and death on an adversary.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Tuju or pointing ceremony is described as killing a distant enemy by spells
    and by pointing a dagger or sumpitan toward the enemy's residence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bersawai ceremony is performed at night with fire, incense, herbs, and
    plants while calling on the spirit of the mountains; if successful, the spirit
    descends, puts the exorcist into a trance, and imparts desired knowledge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tigers are believed to be subject to Poyangs, and every magician is said to
    have a tiger in constant attendance.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A person killed by a tiger is supposed to have been sacrificed to the malevolence
    of a magician whom he offended.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: When healing aid is sought, presents are carried to the magician, who goes
    to the patient's house with a gelondang bamboo instrument.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At night the magician chants incantations while waving a white cloth; an attendant,
    often his wife, beats the gelondang, and another burns benzoin incense.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The chants invoke Jewa-Jewa, who resides in heaven and through whom Pirman
    alone can be approached.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The healing invocations may last all night for several nights until the magician
    announces either that he has received medicine to cure the disease or that the
    deity is inexorable.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Sickness is explained as Pirman ordering the Earth Genie to eat the sick person's
    life, with death ensuing unless Pirman revokes the mandate.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the cited Newbold account, the soul of a Poyang after death is supposed
    to enter a tiger's body.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Poyang's corpse is placed upright against the buttress root of a large
    forest tree and watched with rice and water for seven days and nights.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The transmigration is attributed to an ancient compact made by the Poyang's
    ancestors with a tiger.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: On the seventh day, the deceased Poyang's son may watch alone with a censer
    and incense if he wants similar supernatural powers.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The deceased is said to appear in tiger form as if making a fatal spring;
    the son must show no fear and cast incense on the fire, after which the tiger
    disappears.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: Two beautiful women then appear as spectres, the novice enters a deep trance,
    and the women become his familiar spirits through whose agency secrets and hidden
    treasures are revealed.
  category: sequence
  evidence_refs:
  - ev:11
