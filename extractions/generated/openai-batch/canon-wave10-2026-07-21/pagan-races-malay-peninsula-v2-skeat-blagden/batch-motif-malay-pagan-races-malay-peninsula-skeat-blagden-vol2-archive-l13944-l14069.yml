comparison_claims:
- id: claim:1
  claim: The passage supports a cautious historical-contact claim that the Sakai magician's
    staff insignia was connected with Batin or Malayan-culture influence, because
    it says the staff was originally a Batin emblem and was adopted at the first influx
    of Malays.
  claim_level: historical_contact
  target: Batin or Malayan-culture staff insignia
  evidence_refs:
  - ev:5
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is reported through the source's wording and notes; the passage
    provides no independent corroborating historical evidence.
- id: claim:2
  claim: The passage supports only a tentative linguistic similarity between P'wlli
    and the Blandas Grave Demon name Pa wul, because the note says P'wlli may be a
    corruption of Pa wul.
  claim_level: linguistic_similarity
  target: Blandas Grave Demon 'Pa wul'
  evidence_refs:
  - ev:6
  - ev:12
  counter_evidence_refs: []
  confidence: low
  limitations: The source explicitly uses tentative language and provides no linguistic
    analysis within this passage.
