canonical_text:
  quote: ''
  summary: The passage describes the authority, immunity, regalia, ritual implements,
    taboos, and medicine-huts of Sakai magicians. It states that demons could be allowed
    to torment offenders, that the supreme god directed demonic injury, that the magician
    was protected and entrusted with care of dead souls, and that special objects
    such as staffs, charms, leaves, sprinkling-brushes, and forest huts mediated contact
    with spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Sakai magician could punish offenders by refusing them protection against
    demons, allowing the demons to torment them and make them ill.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The magician had the right to enter a house and remove hung charms; a person
    who hindered him could be killed by his club.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the supreme god alone had the power and right to tell
    demons whom to injure.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: No demon could injure a magician, and the magician's death was regarded as
    an act of heaven.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The magician was said to have learned all that magic could teach him and to
    have been entrusted by Allah with care for dead souls in heaven or the Isle of
    Fruits.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The magician's soul could never be damned, while the soul of a Batin could
    be damned.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The magician's trappings included a headband, necklace, girdle, kneebands,
    staff, uncut hair, and plain undecorated loin-cloth.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The staff was made from Satambun or Tamoon wood, was linked to a Batin emblem,
    and replaced an earlier deformed bamboo charm-object.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Only magicians were allowed to bear the staff, which was believed to injure
    anyone else who tried to carry it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: One collected staff bore charms against the P'wlli or Vampire of Shake-Net
    Island, the ape spirit or epilepsy, and the argus-pheasant spirit or lunacy.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: A sprinkling-brush named chen-ow was sometimes used by the magician to sprinkle
    demons during ceremonies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Sakai people handling a magical object took a leaf in the hand to prevent
    the demon residing in the object from passing directly into them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Iron was not to be used for cutting hair or fingernails.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: A special medicine-hut belonging to magicians stood deep in the forest, at
    ground level, and was protected by a post hung with bones, leaves, and flowers.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:15
  text: The medicine-huts were said to have originally been round, and only magicians
    could enter them or see their contents, which were bamboos incised with special
    charms.
  category: setting
  evidence_refs:
  - ev:10
