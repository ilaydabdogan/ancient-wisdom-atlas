canonical_text:
  quote: ''
  summary: The passage contains translated song material about hunting a gibbon and
    an ape with blowpipes and venom, preparing the gibbon as food, and descriptive
    songs about crocodile, lace-lizard or monitor, and python. It includes crocodile
    prey-selection by gazing at reflections, a crocodile killing a monkey, the lace-lizard's
    relationship to the crocodile as chief and former younger brother, and the python's
    arboreal and hollow-tree habitat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Named brothers Mamat and Maniat are addressed and instructed to stalk a gibbon
    and take up patterned bamboo blowpipes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gibbon is struck by a venom dart, coughs or retches, tumbles down, and
    is said to have fallen.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the gibbon falls, the singers instruct that it be carried home, dry
    branches and firewood be gathered, and the gibbon be singed, roasted, carved,
    and divided into equal portions for all.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ape song gives the ape's cry, trees in which it plays, fruits on which
    it feeds, and bodily traits including white body fur, black face fur, long slender
    arms, and swinging legs.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ape is also to be stalked carefully with a blowpipe, and the passage notes
    that the rest of the ape song is the same as the song of the Siamang.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The crocodile is described as bellowing, living in river-pools, basking on
    the river-bank, entering the water for sustenance, and having a knobbed head,
    sword-blade-like tail, and clenched teeth.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The crocodile is said to gaze at human reflections; if the reflected head
    is gone, the crocodile will obtain sustenance, but if the head is present, it
    will not.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A note explains that the crocodile's gazing is a form of divination used to
    identify destined human prey by seeing the prospective victim without a head.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: A crocodile sweeps a monkey from timber into the water, smothers it in river-mud,
    brings it shoreward, batters it on timber, and swallows it whole after it is dead.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The lace-lizard or monitor is described with a knobbed head, small narrow
    eyes, sharp snout, swaying belly, widely spread footprints, sting-ray-like back
    scales, sword-blade-like tail, screw-pine-thorn teeth, and a double tongue likened
    to a false speaker's tongue.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The lace-lizard's chief is said to be the crocodile, and the lace-lizard is
    said once to have been the crocodile's younger brother; the song contrasts a land
    crocodile with a salt-sea crocodile, one on land and one in the water.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The python is described as calling, coiling in forest-tree tops, brushwood,
    and grasses, entering a hollow tree-trunk, and having a peg-top-like tail, garlic-like
