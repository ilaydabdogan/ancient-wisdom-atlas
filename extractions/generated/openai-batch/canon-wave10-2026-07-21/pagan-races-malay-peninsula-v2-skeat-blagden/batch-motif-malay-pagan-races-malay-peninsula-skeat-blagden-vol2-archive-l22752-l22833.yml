  summary: The passage describes methods by which taboo languages form special vocabulary,
    especially metaphor, descriptive periphrasis, and secondary metaphorical extension.
    It argues that the Camphor Taboo language is a ceremonial jargon distinct from
    common speech, then gives examples of periphrastic names in Camphor and Mentra
    taboo languages.
