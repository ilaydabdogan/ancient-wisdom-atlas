canonical_text:
  quote: ''
  summary: The passage describes the close of a healing ceremony in which dead saplings
    are thrown into the jungle so that evil spirits may go with them, followed by
    the patient's recovery. It then records several disease-preventive charms and
    magical objects, including charred sticks, charcoal-blackened feet, body-painting,
    magic-pattern combs, quiver and charm-holder patterns, and a pregnancy bamboo.
    The passage also describes the Chinduai love-charm, identified as a rare fragrant
    plant treated with oil and accompanied by a mystical formula whose language is
    said to be difficult or nonordinary.
  language: English
  quote_policy: summarized
