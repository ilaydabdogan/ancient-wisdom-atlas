canonical_text:
  quote: ''
  summary: 'The passage reports ritual use of fern substances in wedding and adolescence
    contexts, then summarizes several Eastern Semang or Semang beliefs about the soul:
    its form, color, size, maternal transmission, postmortem animal embodiment for
    a B''lian, afterlife crossing over a boiling lake by a tree-bridge, and a reported
    belief that human souls grow on an otherworld soul-tree and are fetched by a bird.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fern sporangia bruised in water were squirted over a wedding pair, and face-painting
    patterns represented another fern whose juice was used to sprinkle Sakai youths
    at adolescence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eastern Semang informants described each person as having a soul shaped like
    the person, red like blood, and no bigger than a grain of maize.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:3
  text: The soul was said to pass from mother to child, though the informants could
    not explain how.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The soul of a B'lian was said to enter after death into a wild animal, remain
    there until the animal died, and then be admitted into the Upper Heaven of Fruits.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ordinary people's souls were represented as crossing a boiling lake by a tree-bridge,
    with wicked persons slipping from the bridge into the lake below.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ordinary people's souls were also represented as being sent to a different
    and far less inviting Paradise.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Vaughan-Stevens is reported as recording a Semang belief that all human souls
    grew on a soul-tree in the other world and were fetched by a bird; the passage
    states that the bird was killed and eaten.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A note distinguishes this soul concept from a modern Christian soul and identifies
    it with the Malay term semangat.
  category: other
  evidence_refs:
  - ev:7
