canonical_text:
  quote: ''
  summary: 'The passage reports Mantra beliefs about natural phenomena: lunar spots
    as a tree with Moyang Bertang making nooses for mankind, mice cutting the noose-strings,
    incantations calming tempests, eclipse explanations, the sky as a suspended pot
    threatened by sprouts and string-breakage, the sun as a tethered woman, and a
    myth in which the moon hides her star-children while the sun devours hers and
    then pursues and bites the moon.'
  language: English
  quote_policy: summarized
