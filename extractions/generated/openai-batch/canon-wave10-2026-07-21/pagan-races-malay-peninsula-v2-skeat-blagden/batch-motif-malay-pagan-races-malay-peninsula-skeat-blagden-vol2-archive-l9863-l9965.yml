canonical_text:
  quote: ''
  summary: The passage describes a Mantra festival centered on a large Balei, Tampoi
    wine, invitations to Batins by a knotted string, communal eating and drinking,
    surrender of weapons at entry, all-night dancing and antiphonal song, music, and
    marriage-making during the feast. It also notes Mantra instruments, including
    the k'ranti, violin, and Aeolian bamboos, and includes plate captions concerning
    Besisi song imagery, hunting with blowpipes, and aborigines with fiddles.
  language: English
  quote_policy: summarized
