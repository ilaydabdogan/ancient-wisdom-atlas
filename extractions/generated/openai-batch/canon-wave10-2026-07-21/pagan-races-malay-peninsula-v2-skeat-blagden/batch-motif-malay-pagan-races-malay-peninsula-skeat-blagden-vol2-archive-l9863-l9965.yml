  - ev:4
  - ev:6
  confidence: high
  cautions: The passage is ethnographic description rather than a mythic narrative;
    no sacred or divine framing is stated.
- id: motif:2
  label: knotted-string feast summons and calendrical count
  taxonomy_refs: []
  basis: A rattan-like string with knots indicating the number of feast days is sent
    to each Batin.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage states the practical function of the string but does not explain
    ritual symbolism.
- id: motif:3
  label: entry hospitality with weapon surrender
  taxonomy_refs: []
  basis: The Penglima gives arrivals Tampoi wine at the Balei door and takes their
