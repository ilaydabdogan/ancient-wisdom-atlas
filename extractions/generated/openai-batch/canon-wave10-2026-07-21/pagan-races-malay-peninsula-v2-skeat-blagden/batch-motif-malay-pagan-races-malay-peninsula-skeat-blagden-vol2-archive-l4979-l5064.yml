canonical_text:
  quote: ''
  summary: 'The passage reports Perak Semang and Pangan burial customs: abandoned
    clearings and houses after deaths, preparation of graves in the jungle, use of
    an inscribed burial bamboo as testimony for the dead person, construction of a
    bamboo bier and covered grave, later imitation of Sakai and local Siamese burial
    methods by west-coast Semang, and a belief that the soul waits for the burial
    bamboo and may be hastened by Kari through thunder and lightning.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A previous burial site was visible only as a slight depression in the ground.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Clearings with crops, graves, and standing houses were reported abandoned
    after deaths in the Piah Valley; one house had reportedly been shut up with a
    dead body inside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On a death, the Pangan silently fetch timbers, go to a suitable jungle place,
    and dig a straight-sided grave deep enough for a man to stand in up to the hips.
  category: action
  evidence_refs:
  - ev:4
- id: obs:4
  text: The Sna-hut examines the corpse and gives it an inscribed burial bamboo called
    penitah or peneetor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The burial bamboo is described as testimony on the other side of the grave
    to the dead person's behavior in present life.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The burial bamboo is inserted in the deceased person's girdle with its node
    uppermost and its hollow pointing downward.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A light bier is made from bamboo poles bound with rattan or creepers, and
    interested men and women accompany the remains to the grave.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The corpse is laid supine without orientation; slanting stakes, a ridge pole,
    leaves, branches, earth, a mound, and brushwood are used to cover and protect
    the grave.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that modern west-coast Semang burial is no longer the old
    method, and that southern groups imitate Sakai methods while northern groups roughly
    imitate local Siamese non-cremating burial practices.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Semang are said never to expose a corpse.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Pangan generally do not revisit graves and are said not to fear doing
    so because they do not believe in Hantus; west-coast Semang revisit only to clear
    underwood.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: If no Sna-hut is nearby, the dead person may be buried without a burial bamboo,
    which is later lowered into the grave through a bored hole.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The soul is said to remain in the body until the burial bamboo arrives, and
    Kari may send thunder and lightning to hasten a tarrying soul.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Sna-hut keeps a supply of burial bamboos and cuts a name-mark for an adult
    man; later, men sometimes cut the signs themselves, and many people prepared a
    burial bamboo during life.
  category: action
  evidence_refs:
  - ev:9
