canonical_text:
  quote: ''
  summary: 'The passage describes Sakai body-painting practices around childbirth:
    a new mother paints her face for one lunar month and omits breast-paint; midwives
    and temporary birth helpers assume midwife face-paint while serving; newborn children
    receive sex-differentiated face patterns applied and renewed by the midwife; certain
    black lines are restricted until marriage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Sakai woman who has just given birth paints her face every day from the
    child’s birthday until one lunar month has passed; if the moon is invisible, the
    days are counted approximately.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the mother applies the childbirth-related face-paint pattern, the breast-paint
    otherwise appropriate to a Sakai woman is omitted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Sakai midwife paints her face when she wakes from sleep while attending
    a new mother; her services are usually required for three or five days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A midwife normally wears the face-paint of her tribe on other occasions, but
    omits breast-paint as soon as she begins functioning as a midwife.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A woman who is not a professional midwife but assists at a confinement puts
    on midwife face-paint while performing midwife functions, and resumes the full
    woman’s paint when her help is no longer needed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Sakai women are the only ones who paint the breast.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Children’s patterns are described as stripes from the eyebrows to the tip
    of the nose; the stripes are black for girls and red for boys, and boys also have
    two slanting red streaks from the under lip to the chin.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The children’s patterns are applied by the midwife as soon as the child is
    born, renewed every morning while the midwife is present, and cease when she leaves.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the midwife leaves, the mother may apply the ordinary tribe pattern;
    for a girl this may include the addition of a black nose-line.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Children may not wear narrow black lines until they are married; the passage
    says that by ancient custom marriage makes the youth a man. The final explanation
    about possible ill luck and ferns is incomplete in the supplied passage.
  category: other
  evidence_refs:
  - ev:6
