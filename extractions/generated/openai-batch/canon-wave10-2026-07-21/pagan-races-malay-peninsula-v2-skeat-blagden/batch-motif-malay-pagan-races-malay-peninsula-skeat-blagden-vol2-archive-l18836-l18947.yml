canonical_text:
  quote: ''
  summary: The passage describes Benua beliefs about healing through a Poyang or magician
    whose soul ascends by means of gelondang music to Jewa-Jewa, a heavenly intermediary,
    after incense is offered. Jewa-Jewa may give medicine if Pirman permits. The passage
    also records skepticism about present Poyangs, Pirman's control over life and
    death, and several plant, animal, stone, and fumigation remedies used for diseases.
  language: English
  quote_policy: summarized
