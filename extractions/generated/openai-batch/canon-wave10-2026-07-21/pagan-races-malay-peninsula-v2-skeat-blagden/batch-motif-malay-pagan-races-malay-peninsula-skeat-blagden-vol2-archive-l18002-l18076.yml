canonical_text:
  quote: ''
  summary: 'The passage recounts an attempted killing of Batin Three-Pieces, whose
    wounds close and whose severed parts reunite. It then introduces Mantra traditions
    attributed to Batin Pa'' Inah and gives a creation account: the Lord of the Underworld
    made and supports the earth; beneath the earth is the Land of Nyayek, inhabited
    by fiends with nonordinary birth; Mertang the first magician visited that land;
    Mertang and his younger brother B''lo first peopled the earth, came from a sky
    place called Rising Land, and returned there. B''lo, after death and burial, comes
    back to life when Mertang cuts off a skink''s tail near the grave.'
  language: English
  quote_policy: summarized
