canonical_text:
  quote: ''
  summary: 'The passage describes Sakai burial practices in Selangor: preparing and
    shrouding the corpse, placing personal items and a weapon with it, carrying it
    to a selected grave site, lining the trench with wood, making offerings of tobacco,
    betel-nut, rice, and cakes, repeating offerings on specified days, and tending
    the tomb. It also notes a Ulu Langat burial form described as intermediate between
    platform burial and interment, and includes a footnote comparing some practices
    to Malay, Jakun, or Malayan customs.'
  language: English
  quote_policy: summarized
