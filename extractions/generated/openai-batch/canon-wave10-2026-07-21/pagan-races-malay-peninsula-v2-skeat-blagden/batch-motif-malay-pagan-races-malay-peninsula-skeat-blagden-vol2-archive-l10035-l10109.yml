canonical_text:
  quote: ''
  summary: The passage opens a chapter on natural religion and folklore by warning
    that reports about the religious beliefs of Peninsula groups are partial, contradictory,
    and shaped by outside terminology and observer bias. It discusses M. Borie's disputed
    claim that the Mantra had lost religious books connected with Raja Brahil, corrects
    Raja Brahil to Raja Jebrail or Gabriel, and then summarizes Semang religion as
    recognizing Kari, a Thunder-god, and minor deities, with little ceremony and much
    mythology and legend.
  language: English
  quote_policy: summarized
