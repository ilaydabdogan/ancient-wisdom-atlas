canonical_text:
  quote: ''
  summary: Ethnographic account of the Besisi burial of a young woman named Sauma
    in Selangor. The body is wrapped and buried near a small soul-hut furnished with
    a ladder and provisions. Elders drop crossed choppers seven times over the grave
    to protect the living by fixing the ghost in the tomb, and plants are set around
    the grave edges.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young Besisi woman named Sauma had died the night before the narrator's
    arrival; burial preparations had been kept secret, and the narrator was taken
    upriver to the burial place near the river.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The body was brought wearing its own sarong, wrapped in a white shroud and
    two new mats, lashed to a pole; the grave was a narrow oblong pit no deeper than
    the digger's waist.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A small triangular hut was erected a yard or two from the foot of the grave
    and roofed with upright fan-palm leaves; a similar ruined hut stood near another
    grave.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A ladder made from an inclined stick was added so that the soul could climb
    up to its hut.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The hut was furnished with a model sentong basket, a small rice-bag filled
    with seed-rice, and an open wallet containing wild betel shoots, shellfish, matting,
    and tiny portions of boiled rice, fish, acid fruits, water, and sugar, with no
    salt.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A note states that articles deposited in the hut were distinctive of the sex
    of the dead; choppers would be used for a man.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The deceased's father unfastened the mats and shroud, stripped the shroud
    selvage, wetted the face and breast with a banana-leaf midrib dipped in water,
    removed the sarong to be burned, readjusted the shroud, and placed the body in
    the grave with the head on the banana-leaf rib.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A plank was placed sloping over the body to protect it from falling earth
    during refilling of the grave.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the earth was filled in, four poles were put down to mark the grave
    edges.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Two elder men stood on opposite sides of the grave and each dropped crossed
    jungle knives seven times on the center of the grave; the stated explanations
    were to keep their own lives safe, to fix the deceased's ghost in the tomb, and
    to keep it from feeding on the living.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Elders planted yams, citronella or fragrant lemon grass, sweet potato roots,
    and a purple-leaved coleus around the grave edges.
  category: action
  evidence_refs:
  - ev:8
