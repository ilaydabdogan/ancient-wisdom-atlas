  summary: The passage describes musical practices attributed to the Mantra, Jakun
    of Johor, and Orang Laut Akik. It reports wind-produced bamboo music placed in
    treetops, festivals after rice sowing or harvest with mock sword fighting and
    simulated monkey hunting, Jakun songs transmitted orally or made by ear, and fondness
    for instruments including violin, flute, and drums.
