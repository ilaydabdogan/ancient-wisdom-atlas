canonical_text:
  quote: ''
  summary: The passage reports Tembeh names and ideas concerning Sam-mor, a vaguely
    conceived Supreme Being, and Naing-Naing or Naing, a nether-region custodian associated
    with wicked souls, darkness, danger, and appeasement. It describes heaven and
    hell locations, a pre-solar flat-board earth with creatures beneath it, Naing
    dwelling in a hole below, Sam-mor high above, an ant-shaped demon’s sting, Sam-mor’s
    defeat and confinement of Naing beneath mountain-like rocks, the world being thrown
    into the air and remaining suspended, and fire being rolled into the sun.
  language: English
  quote_policy: summarized
