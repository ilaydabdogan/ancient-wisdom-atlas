canonical_text:
  quote: ''
  summary: Ethnographic remarks compare body-paint, scarification, nose-cartilage
    perforation, tooth and ear modification, head shaving with topknots, and reported
    totemism among Semang, Sakai, Jakun, Malays, Andamanese, Nicobarese, and related
    groups in or near the Malay Peninsula.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old and correct face-paint designs are described as rare; in remote tribes
    women still paint their faces, but the patterns are often ornamental, improvised,
    incorrect, abridged, or replaced by a family private totem.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Body-paint is described as more widely distributed than scarification, partly
    because painted designs can be removed while scarification marks are indelible.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that very few, if any, wild peoples of the Peninsula fail
    to use body-paint at least on special occasions, and that many formerly practiced
    scarification or tattooing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Body-paint is reported among Semang, Sakai, and Jakun, especially among the
    Sakai; the colors listed are black, white, red, and occasionally yellow, with
    red and yellow treated as equivalent from a magical point of view.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author classifies perforation of the nose-cartilage with a nose-bar or
    nose-quill as a Sakai practice, while describing the Andamanese evidence as negative.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The same nose-cartilage custom is said to be found widely among purer Sakai
    tribes; in Pahang a nose-ring may substitute for the quill, and the Orang Bukit
    are described as putting skewers through their noses.
  category: object
  evidence_refs:
  - ev:5
  - ev:10
- id: obs:7
  text: Filing and blackening the teeth are described as widespread throughout the
    Malayan region, and ear-boring as practically universal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Shaving the head except for a topknot, which is often temporarily removed
    at puberty, is reported rarely among the Semang and is regarded as probably borrowed
    from the Malays; evidence for Sakai and Jakun is limited.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The apparent system of totemism reported by Vaughan-Stevens is described as
    resting on unsatisfactory evidence, possibly produced by leading questions.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: A footnote contrasts Andamanese non-perforation of the nose-cartilage with
    Nicobarese practices including flattening children's occiputs, blackening teeth
    from puberty, and perforating earlobes.
  category: relationship
  evidence_refs:
  - ev:9
