canonical_text:
  quote: ''
  summary: The passage presents song-like sections on the Kite, the Jungle-fowl, and
    the Flying-fox. The Kite moves past named rocks and mountains to seek a Love-plant
    for healing her children and the spirit. The Jungle-fowl is described as milk-white,
    as a decoy-fowl, and as a chieftain among jungle fowls. The Flying-fox comes from
    waters, forest edges, islets, and channels, and feeds on fruit-buds and tree-fruits
    including rambutan and duku.
  language: English
  quote_policy: summarized
