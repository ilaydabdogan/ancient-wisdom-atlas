canonical_text:
  quote: ''
  summary: The passage classifies aboriginal Peninsular numeral systems into four
    types, associates them with Semang, Sakai, Jakun, and related groups, argues that
    Types II and III form a central Sakai system, and presents Type IV as a non-Malayan
    system of Mon-Khmer origin supported by comparison with Mon, Suk, and Huei numerals.
  language: English
  quote_policy: summarized
