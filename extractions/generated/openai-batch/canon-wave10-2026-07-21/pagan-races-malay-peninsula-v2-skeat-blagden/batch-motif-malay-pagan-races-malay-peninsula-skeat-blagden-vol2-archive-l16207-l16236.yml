canonical_text:
  quote: ''
  summary: 'Ethnographic passage reporting Besisi beliefs about celestial phenomena:
    departed souls go to an eternal Island of Fruit-trees identified with the moon;
    an eclipse is feared as a Hantu attacking moon-ancestors, prompting jungle lamentation,
    tomtom beating, tree-striking with parangs, and prayer to Tuhan Allah for release.
    The passage also notes guarded disclosure to strangers and an authorial comparison
    to Avilion.'
