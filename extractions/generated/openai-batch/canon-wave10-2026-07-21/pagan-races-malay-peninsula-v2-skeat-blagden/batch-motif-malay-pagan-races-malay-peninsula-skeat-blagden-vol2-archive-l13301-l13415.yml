candidate_motifs:
- id: motif:1
  label: divinely given protective clan designs
  taxonomy_refs:
  - culture_hero
  basis: Tuhan gives a complete set of charm-patterns, and headmen assign bamboo-derived
    protective designs to their tribes for use against demons.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage names Tuhan and describes the giving of charm-patterns but
    does not explicitly label Tuhan as a culture hero.
- id: motif:2
  label: serpent-like eclipse monster swallowing luminaries
  taxonomy_refs:
  - serpent
  basis: Rahu is described as dragon-like and swallowing like a serpent; it swallows
    the moon and tries to swallow the sun.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The taxonomy reference captures the serpent-like description, though the
    passage calls Rahu a monster resembling a dragon rather than simply a serpent.
- id: motif:3
  label: noise-making rite to release eclipsed luminary
  taxonomy_refs: []
  basis: People strike drums and bamboos, scream, and sing to frighten Rahu and make
    it release the moon; the same is done for the sun.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: No more specific available taxonomy reference is supplied for eclipse
    noise rites.
- id: motif:4
  label: survivor pair become ancestors of humanity
  taxonomy_refs:
  - survivor_pair
  basis: Only Ba-lut and Wa-lut survive K'lang B'lok's destruction, marry, and become
    ancestors of all living people.
  evidence_refs:
  - ev:11
  - ev:17
  confidence: high
  cautions: The destructive event is caused by a giant bird rather than by a flood
    or other common survivor-pair context.
- id: motif:5
  label: hero wins bride by slaying world-threatening monster
  taxonomy_refs:
  - sacred_marriage
  - culture_hero
  basis: Wa-lut promises to marry Ba-lut if he kills K'lang B'lok; Ba-lut kills the
    bird and then marries her, after which the pair become ancestors.
  evidence_refs:
  - ev:13
  - ev:16
  - ev:17
  confidence: medium
  cautions: The marriage is conditional and ancestral, but the passage does not describe
    it as ritually sacred or royal.
- id: motif:6
  label: world-threatening monster eggs held in check by petrification
  taxonomy_refs:
  - chaos
  basis: Two large eggs of K'lang B'lok are said to have turned to stone; Siamat warns
    that if they hatched the world would end and all would be eaten.
  evidence_refs:
  - ev:18
  - ev:19
  confidence: medium
  cautions: The available taxonomy has no direct reference for petrified monster eggs;
    chaos is a broad fit because the eggs represent a renewed world-ending threat.
