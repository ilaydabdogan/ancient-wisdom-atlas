canonical_text:
  quote: ''
  summary: The passage recounts Sakai explanations for bamboo-derived clan charm marks,
    an eclipse belief in which Rahu swallows the moon or sun and is frightened away
    by noise and song, and a Ulu Bertang legend of the giant world-eagle K'lang B'lok,
    slain by Ba-lut with a magic knife before Ba-lut and Wa-lut become ancestors of
    living people. It also reports a cave-nest with stone eggs whose hatching would
    endanger the world.
  language: English
  quote_policy: summarized
