canonical_text:
  quote: ''
  summary: The passage summarizes beliefs about tiered heavens, a paradise bridge
    over a boiling lake, western entrances to heaven and hell, separate hells, personified
    heavenly bodies, lunar paradise traditions, the divine and purifying role of fire
    and water in punishing wicked souls, and Jakun accounts of the tiger’s origin
    through animal metamorphosis.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The upper tiers are described as a Paradise of the blest filled with wild
    fruit-trees, while the third or lowest tier contains low clouds that bring sickness
    to mankind.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: All three races are said to have versions of a Paradise-bridge that crosses
    a boiling lake into which wicked souls are precipitated.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Semang legends, the entrances of heaven and hell are close together in
    the west, and a third Hyperborean-like region is also described in some Jakun
    traditions.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that there are separate hells for various races of mankind,
    and others for animals and snakes.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The heavenly bodies are described as personified, with stories about marriages
    or conflicts of the sun and moon and the fortunes of their children, the stars.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: One Mantra story says the sun was not created until after one of the floods.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some tribes, including the Besisi, identify the moon with the Island of Fruit
    or Jungle Paradise, and a Besisi song places a Garden of Flowers before it.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The moon is said to be the place into which Gaffer Engkoh climbed and, in
    several traditions, the habitation of the Jakun Man in the Moon, Nenek Kabayan.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Sakai regard Fire as a mystical emanation from the power of Tuhan, divine
    in origin and destructive of evil.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Sakai tradition describes wicked souls being washed in boiling water;
    water is said to soften and purify, while Fire would otherwise destroy the soul
    while destroying sin-spots.
  category: action
  evidence_refs:
  - ev:9
  - ev:12
- id: obs:11
  text: In the described Sakai view, Tuhan mitigates Fire with Water, so that Fire
    destroys only the collective wickedness of souls washed in the copper.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: The copper in which souls are washed is compared to a red-hot cauldron in
    which a remnant of Upas-poison burns away.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage says there is no Semang account of the tiger’s origin, but Jakun
    stories describe the tiger as metamorphosed from inferior animals, most commonly
    from a chief’s dog.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: A footnote states that a form of the bridge myth is found among the Andamanese,
    who describe a bridge of invisible cane through the sky.
  category: other
  evidence_refs:
  - ev:7
- id: obs:15
  text: A footnote says the chief of the Heaven of Fruit-trees is called Penghulu
    by the Semang, corresponds to Granny Long-breasts of the Sakai, and is called
    Gaffer Engkoh or Jongkoh among the Besisi; its guardians take different animal
    or demonic shapes by tribe.
  category: relationship
  evidence_refs:
  - ev:8
