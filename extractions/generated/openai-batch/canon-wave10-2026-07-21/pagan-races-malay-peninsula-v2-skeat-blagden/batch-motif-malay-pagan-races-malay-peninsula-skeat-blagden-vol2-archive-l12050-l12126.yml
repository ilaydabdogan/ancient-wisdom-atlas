canonical_text:
  quote: ''
  summary: 'The passage first describes a monkey-monster who prevents entry into heaven
    by people seeking heavenly fruit. It then summarizes and quotes an account of
    Semang deities: Kari creates most things and gives souls, Pie completes the earth
    and creates humans, death and disease arise through Kari''s fiery Breath and winds,
    Pie limits the destruction, institutes afterlife decisions involving burial bamboos,
    and provides charms and plant remedies for diseases.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A monkey-monster named or associated with Siong in Kedah drives back anyone
    found attempting to enter the heavens to take fruit there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The monkey-monster pelts would-be entrants with a large prickly jungle fruit
    and hurls them down headlong.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator was told that when the end of the world came, everything on earth
    would fall to the monkey-monster's share.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage notes that Vaughan-Stevens's account includes Ta' Ponn, Kari,
    and Pie, while the author could readily identify Ta' Ponn but not Kari or Pie
    among his own Semang informants.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the legend, Kari created everything except the earth, ordered Pie to complete
    the earth, and gave souls after Pie had created humans.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At first the created men were good, death was not established, and the Semang
    prospered and became numerous while living on fruits.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kari came down to the Jelmol Mountains, was unseen by the Semang, and his
    fiery Breath burned people in the neighborhood and then conducted their souls
    to heaven.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kari commissioned his Breath, which had separated into winds, to kill more
    Semang whenever they again became too numerous.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The winds were to be watched by Sentiu and Chini, with Ta' Ponn and Minang.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kari sent wicked souls to the infernal regions called Belel and created Diseases
    to destroy people in his wrath.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Pie pitied the people, came to an agreement with their chiefs, and got Kari
    to turn the winds into lightning and stop them from general slaughter except in
    special cases.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Pie arranged with Kari which souls should go to Paradise or to the infernal
    regions, and decisions were written on burial bamboos to be shown to Kari.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Pie received power to avert Diseases by charms and assigned flowers from near
    Kari's dwelling, planted on the Jelmol Mountains, as remedies for various Diseases.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Before the burial bamboo was given, the soul could not leave the body; meanwhile
    the Diseases were laid on a parasite on a tree, and Pie created a wind that sat
    on the mistletoe and reported what passed.
  category: sequence
  evidence_refs:
  - ev:8
