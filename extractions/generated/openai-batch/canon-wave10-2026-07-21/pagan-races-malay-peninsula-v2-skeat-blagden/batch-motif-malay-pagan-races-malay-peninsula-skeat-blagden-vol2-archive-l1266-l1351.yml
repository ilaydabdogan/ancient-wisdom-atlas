canonical_text:
  quote: ''
  summary: 'The passage describes Jakun birth-related customs: a boy''s umbilical
    cord is tied to a father''s throwing stone and later transferred to him; women
    use dreamed numbers and animal cries from particular directions to predict an
    unborn child''s sex or survival; adverse omens may be averted or reinterpreted
    by the husband and companions; feasts mark birth and other life events; phosphorescent
    jelly-fish are said to be wandering souls seeking a child''s body; abortion and
    related social sanctions are described; cranial deformation is denied.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For a boy, the umbilical cord is tied to one of his father's throwing stones,
    preferably one used to kill an enemy; it is washed in sea-water, smoke-dried,
    guarded with the stone, and given to the boy at marriage.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jakun women seeking the sex of an expected child wait for a dreamed number
    and then sit up for that number of nights with older female companions until a
    bird or beast cry is clearly heard.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The first clearly heard cry determines the omen: right side indicates a boy,
    left side a girl, front indicates the child will not grow up, and behind indicates
    stillbirth or early death.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a dangerous cry is heard from behind or otherwise from an adverse direction,
    the husband may drive away or redirect the source so that a later cry is heard
    from the side and the danger is considered averted.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The text says the omen rite may have become mostly an ancient custom, helped
    by a following-day feast and by named feasts for birth, marriage, and funeral
    occasions.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: Jakun belief identifies phosphorescent jelly-fishes in the sea as wandering
    souls of men awaiting a child's birth in order to try to enter its body.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage describes abortion as known but rare, with punishment and social
    sanctions depending on marital status and decisions by husband, elderly women,
    or parents.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that Jakun children do not undergo cranial deformation
    and that the average number of children born to a Jakun is three.
  category: attribute
  evidence_refs:
  - ev:7
