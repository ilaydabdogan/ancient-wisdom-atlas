canonical_text:
  quote: ''
  summary: The passage surveys Semang, Jakun, Mantra, and Benua traditions concerning
    human origins, anomalous births, flood or sea-origin cataclysms, an inferred fire
    catastrophe, and a three-tiered sky. Reported motifs include first parents formed
    from clay, divine delegation of human creation and soul-giving, human origins
    linked to apes, a moon-regulated condition in which humans did not die, miraculous
    discovery or descent of a race founder, births from non-ordinary body parts, water
    released by a dragon/snake or turtle to make a flood and ocean, first parents
    escaping drowning in a vessel, mountains stabilizing the earth's skin, and ancestors
    escaping a universal conflagration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports a tradition in which the first parents of the human race
    seem to have been formed from clay, with related names including Tanah Sa-kepal
    and Ayer Sa-titek, translated as Drop of Water.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In an ostensibly Semang legend, Kari created everything except man, asked
    Pie to create man, and then Kari gave souls to the humans.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports a Semang story of a dialogue between a baboon and the
    first parents of the human race, and notes a possible connection with a Jakun
    legend deriving mankind from a pair of white apes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Land-Jakun or Mantra myth says that early humans did not die, but became
    thin as the moon waned and fat as the moon approached fullness.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some Jakun stories describe the founder of the race as a person who fell from
    heaven or was miraculously discovered inside the stem of a giant bamboo.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Mantra tradition says children of a race of Setan were pulled from the pit
