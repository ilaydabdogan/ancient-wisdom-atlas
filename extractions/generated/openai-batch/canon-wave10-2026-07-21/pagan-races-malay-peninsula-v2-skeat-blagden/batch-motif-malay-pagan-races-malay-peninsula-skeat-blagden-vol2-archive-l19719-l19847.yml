canonical_text:
  quote: ''
  summary: The passage reports Kuning beliefs about the soul and paired male and female
    deities, describes an Orang Temiang bow-and-arrow release for shooting fire at
    a sickness spirit, and begins an Orang Akik tradition in which offended Jakun
    workers chant an incantation and a princess follows them spellbound into the forest.
    Footnotes compare religious name-substitution across traditions, mention a similar
    bow used by Malay magicians in Perak, and describe the tomb of Dato' Klambu.
  language: English
  quote_policy: summarized
