canonical_text:
  quote: ''
  summary: 'The passage reports a tradition explaining forest wandering and food taboos
    after repeated pirate attacks, then summarizes observations about the beliefs
    and practices of several Orang Laut groups: the Sletar, the Biduanda Kallang,
    and the Orang Muka Kuning. It describes lack of Sletar ritual religion, Biduanda
    Kallang healing by a Bomor who summons demons, plant remedies, and Muka Kuning
    notions of Allah Ta''ala, Nabi Muhamad, and their children above the sky.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ancestral group is said to have rebuilt clearings and houses or moved
    locality after pirate attacks, but the pirates repeatedly discovered and attacked
    them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After their settlements had been destroyed for the seventh time, the group
    abandoned former habits, wandered in the forest, and lived on spontaneously available
    forest food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The tribe made a vow never again to form clearings, live a settled life, or
    eat domestic fowl, because cock-crowing had sometimes betrayed dwellings to pirates.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Sletar are reported as having no comprehension of a Creator and no knowledge
    of Christian, Mohammedan, or Hindu divine beings named to them.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Sletar are reported as having no rites or ceremonies at birth, marriage,
    or death.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Sletar are said not to know the names of Malay mythological aerial spirits
    assigned to mountains, rocks, and trees, and to fear only the Gallang Pirates,
    described as men like themselves.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Biduanda Kallang are said to have a Bomor or physician who chants in order
    to summon demons to give them medicine.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Biduanda Kallang remedies listed include bruised Baru leaves for swellings,
    Akar lale urat juice for cuts or wounds, ginger for bowel pain, and juice of a
    tree called Kapielu angin for headache.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Orang Muka Kuning are said to have derived obscure and distorted notions
    of a Creator from the Malays.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the reported Muka Kuning account, Allah Ta'ala creates all living things,
    Nabi Muhamad is described as his wife who destroys all living things, they dwell
    together above the sky, and they have two children, one male and one female, with
    unknown names and functions.
  category: relationship
  evidence_refs:
  - ev:9
