canonical_text:
  quote: ''
  summary: The passage describes reported and observed face scarification, tattooing,
    and body-paint practices among Semang, Pangan, and Sakai groups. It records tools
    and materials such as thorns, sugar-cane leaves, soot, and charcoal; describes
    line patterns on cheeks and foreheads; reports one informant's explanation that
    the marks served as tribal identification; and notes possible magical, ornamental,
    local-fashion, and intergroup-comparison functions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator was told that Pangan at Belimbing in Ulu Kelantan wore facial
    scarifications made by scratching the skin with a thorn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The reported forehead marks were more or less vertical, while the cheek marks
    were horizontal; sometimes the design was temporarily marked with charcoal instead
    of being scarified.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Siong, the wife of a tribal chief had four distinct scarifications on the
    left cheek and fainter similar marks on the right cheek.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Her cheek marks began at the nose and crossed the cheek as dark-red, almost
    black stripes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: She said the marks were made when she was young in Ulu Plus by drawing the
    serrated edge of a sugar-cane leaf across the skin and rubbing soot or powdered
    charcoal into the incision.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: She said the marks were tribal marks by which members of the tribe could be
    recognized by friends when meeting in distant parts of the country.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The author says such marks may function as local fashions distinguishing people
