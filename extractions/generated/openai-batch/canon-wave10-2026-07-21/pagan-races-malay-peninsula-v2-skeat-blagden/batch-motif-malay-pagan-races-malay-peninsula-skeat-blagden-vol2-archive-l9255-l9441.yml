canonical_text:
  quote: ''
  summary: The passage gives translated Besisi or Selangor Malay songs about plucking
    and preparing Bangkong fruit, dancing with palm-leaf tassels, making merry in
    the Balei during a plentiful season, and a separate song in which a sick child
    laments being an outcast, prepares to go to the hills and forest, fails at snaring
    birds, then returns with a hornbill to be cooked and shared. It also introduces
    the Besisi Trumba as a song of tribal origin.
  language: English
  quote_policy: summarized
