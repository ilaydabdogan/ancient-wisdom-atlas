canonical_text:
  quote: ''
  summary: The passage reports accounts of Sakai marital sanctions, especially a described
    punishment for a wife’s adultery involving binding, exposure, a rescue attempt
    by the paramour, and limited spear attacks by the husband. It also describes chiefly
    adjudication, gender-asymmetrical divorce rules, a variant report of adultery
    fines, and several Sakai plant-based love-philtres or aphrodisiacs, including
    secret plant knowledge held by magicians.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The husband binds the guilty wife hand and foot and lays her on the ground
    near his hut.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband arms himself with three wooden spears of bamboo or palm-wood and
    waits concealed in nearby brushwood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bound woman is denied food and water and may die from ant bites or exhaustion
    if not released.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman’s paramour is expected to try to cut her bonds and bring her back
    to the husband’s house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The husband is allowed to throw each of his three spears once at the paramour
    during the rescue attempt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the husband kills the rival he may leave the wife to die or release and
    send her away; if the paramour succeeds, the husband may take no further steps
    beyond possibly sending away the wife after her return.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the paramour refuses the rescue attempt, the husband may bring him before
    a chief, name a penalty, and seek confirmation through subordinate chiefs and
    the Batin, with older men able to advise against excessive punishment.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Batin can postpone proceedings indefinitely, and postponed cases may lead
    to private quarrels ending in wounds or death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A wife cannot bring an offending husband to the Batin for punishment, because
    he can claim conjugal rights were withheld and obtain condonation and separation
    at his own instance.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that divorce was formerly disapproved and rare; if a woman
    absconded for a month and the husband did not take her back, both parties were
    free to remarry, while the husband retained the children.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A footnote report for the Sakai of Bertang gives adultery punishment as a
    monetary fine, with different amounts when the woman follows the paramour or when
    she is a chief’s wife.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: One Sakai love-philtre called “mong dar” is described as the dried blossom
    of a hill creeper steeped in water and drunk, with alleged stimulation in men
    but no effect on women.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: Another love-philtre called “chin-weh” or “chindwai” is described as a difficult-to-obtain
    fungoid plant used only by women in the same water-steeping manner.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: Under the name “chinweh kasih,” various plants are used as aphrodisiacs by
    Sakai women, and Sakai magicians know a certain secret plant that gives them especial
    deference.
  category: object
  evidence_refs:
  - ev:12
