canonical_text:
  quote: ''
  summary: 'The passage describes a Sakai performance after chanting: women perform
    stationary dance-music with clapping, cries, curtseying, swaying, arm positions,
    and palm movements timed to a drum. It also describes leader-and-chorus singing,
    notes that performers often knew or learned the words as they went, and includes
    a note about a similar invocation or prayer addressed to spirits of landscape,
    ancestors, disease, wickedness, and trouble. A caption identifies Sakai women
    and a child performing dance-music with head-dresses and girdles.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After about an hour of chanting, women came forward to perform.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The performance is described as not involving movement from place to place,
    but as evolutions performed while standing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The women clapped their hands in time with the drum, repeated cries transcribed
    as “Sough” and “Chaep,” and made a deep curtsey once to every drum-beat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The women dropped their arms to their sides, turned the upper body from side
    to side, let the arms swing loosely, and continued curtseying in time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The women stood still except for curtseying, placed one arm akimbo, held the
    other out with the palm open, and alternated the palm upward and downward in time
    with the drum until the end of the song.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Each line or word was first chanted by the song leader and then repeated in
