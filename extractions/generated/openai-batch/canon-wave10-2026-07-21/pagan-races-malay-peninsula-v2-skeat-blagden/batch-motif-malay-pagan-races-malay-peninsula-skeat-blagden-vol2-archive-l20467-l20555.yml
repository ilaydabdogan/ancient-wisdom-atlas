  summary: The passage introduces the geographical and linguistic distribution of
    aboriginal Malayan dialect groups, describing broad northern Semang/Pangan, central
    Sakai, and southern Jakun groupings; it then gives the approximate range of Semang/Pangan
    dialects, notes outlying reports, and explains Semang linguistic uniformity as
    related to comparatively nomadic life and continued inter-clan communication.
