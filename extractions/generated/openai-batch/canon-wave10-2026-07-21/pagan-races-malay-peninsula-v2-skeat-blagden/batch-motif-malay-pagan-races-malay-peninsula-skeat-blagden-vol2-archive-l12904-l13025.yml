  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The rite includes kindling incense, gathering smoke with the right hand, blowing
    smoke near the shoulders, face, and ground, and invoking mountain spirits.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The practitioner squats, leans forward on his hands, and turns his head quickly
    left and right before the bodily change is described.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The described bodily change is that the skin changes, fur grows, and a tail
    appears.
  category: attribute
  evidence_refs:
