canonical_text:
  quote: ''
  summary: The passage describes reputed powers of B'lians, including trance travel
    to a Fruit Paradise, expelling devils, love-charms, remote killing by magical
    sendings, transformation into tigers during life, and post-mortem entry of souls
    into wild beasts before proceeding to Paradise. It then gives Pandak the B'lian's
    account of a were-tiger transformation rite using incense smoke, mountain-spirit
    invocation, posture, and speech formulas for departure and return.
  language: English
  quote_policy: summarized
literal_observations:
