  text: B'lians are said to be able to turn themselves into tigers during life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After death, B'lian souls are said to enter wild beasts such as elephants,
    tigers, and rhinoceroses until the animal embodiment dies, after which they proceed
    to their own Paradise.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pandak was identified as a B'lian with a reputation as a dangerous were-tiger.
