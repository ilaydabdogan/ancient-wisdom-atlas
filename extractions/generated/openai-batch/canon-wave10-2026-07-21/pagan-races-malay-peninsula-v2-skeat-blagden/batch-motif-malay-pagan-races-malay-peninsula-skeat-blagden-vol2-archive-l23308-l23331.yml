canonical_text:
  quote: ''
  summary: The passage concludes that many parts of the Malayo-Polynesian area show
    a tendency to adapt ordinary language for special purposes. The Peninsular aborigines
    are said to show a similar tendency, most elaborately in the south as a jargon
    linked to a specialized occupation, and elsewhere as traces in dialects showing
    Malayo-Polynesian influence. The author argues that modern imitation of Malay
    is unlikely and that earlier Malayo-Polynesian influence is a more probable explanation.
  language: English
  quote_policy: summarized
