canonical_text:
  quote: ''
  summary: The passage reports a Sungei Ujong Jakun story in which a deceased Batin
    is believed to have become a sacred Siamang ape on Hebang mountain. After mourners
    find only his clothing and shroud at the tomb, they see the ape in a tree over
    the grave and conclude it is the deceased chief. The ape is later said to transform
    briefly into a tiger when wounded by a blowpipe dart, frightening the attacker,
    who dies soon afterward. A footnote interprets this as a belief that an ancestor
    in animal form can still change shape.
  language: English
  quote_policy: summarized
