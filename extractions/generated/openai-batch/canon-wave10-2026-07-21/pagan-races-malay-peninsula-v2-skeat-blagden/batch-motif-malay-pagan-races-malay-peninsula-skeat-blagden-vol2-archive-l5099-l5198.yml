canonical_text:
  quote: ''
  summary: 'The passage reviews reported and disputed Semang and Sakai mortuary practices:
    possible sitting burial, an alleged Semang corpse-eating tradition, Sakai burial
    with personal goods, burning and abandonment of death-houses because of fear of
    ghosts, tended graves with possible offerings, and a note that Sakai medicine-men
    may be exposed after death and believed to become tigers.'
  language: English
  quote_policy: summarized
