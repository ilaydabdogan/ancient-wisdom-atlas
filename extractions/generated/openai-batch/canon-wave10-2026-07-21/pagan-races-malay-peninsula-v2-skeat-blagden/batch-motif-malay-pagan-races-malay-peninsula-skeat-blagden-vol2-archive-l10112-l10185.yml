canonical_text:
  quote: ''
  summary: The passage gives general ethnographic remarks on religions of several
    Aboriginal Malayan groups. It describes Sakai religion as largely demon-worship
    mediated by a shaman or medicine-man, Jakun religion as a pagan or pre-Mohammedan
    shamanistic creed with otiose or ancestral deities, and Benua religion as Poyangism
    combined with theism and demonism. It also describes the Poyang as retaining authority
    over demons through incantations while a supreme deity remains remote, and begins
    a comparison of Berembun shamanism with ancient Asian shamanism.
  language: English
  quote_policy: summarized
