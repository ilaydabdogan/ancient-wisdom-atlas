canonical_text:
  quote: ''
  summary: The passage describes B'lians among Semang groups as ritual specialists
    of varying status, often associated with chiefly roles and Malay titles. A Kedah
    Semang chief is said to have charmed evil spirits out of a woman and then admitted
    some knowledge of medicine-man practice. Another east-coast man is reported to
    be a notorious B'lian able to turn into a tiger at will. B'lians observe food
    prohibitions not followed by lay people. The oldest and most knowledgeable B'lians
    are said to receive tree-burial with food, water, a jungle-knife, and other items;
    this burial is believed to let them enter a Paradise distinct from that of lay
    members. A footnote discusses the term B'lian as a title and its application to
    tiger-transforming men or transformed tigers, citing Newbold's account of a tiger-associated
    B'lian who asks for fire before attacking men.
  language: English
  quote_policy: summarized
