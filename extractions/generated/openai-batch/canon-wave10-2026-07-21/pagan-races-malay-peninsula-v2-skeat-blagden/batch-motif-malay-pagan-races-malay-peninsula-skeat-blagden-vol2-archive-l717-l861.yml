canonical_text:
  quote: ''
  summary: 'The passage records Blandas charms against several birth or familiar demons:
    Langhui/Langsuir, Bajang, Polong, and Pontianak. The charms describe demon bodies
    or origins, command neutralization, containment, expulsion, or return to source,
    and prescribe rubbing a sufferer with kelmoyang. Editorial notes connect Langhui
    with the Malay Langsuir, describe Langsuir and Pontianak as ghosts arising from
    childbirth death or stillbirth, and identify Malay and Muslim-mediated influences
    in some charm elements.'
  language: English
  quote_policy: summarized
