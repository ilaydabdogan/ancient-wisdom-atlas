canonical_text:
  quote: ''
  summary: The passage first gives a song-like itinerary through named rocks, hills,
    trees, palms, halting places, and a headland, then states that Nyai Techap and
    Gaffer Klambu together made the land Semujong. Notes identify several places,
    explain Nyai Techap as the sister of To' Klambu, and interpret round and split
    coats as markers of different group customs. The passage then introduces a largely
    improvisational Song of the Monkey-hunters, describing a forest hunt with blowpipe
    and darts, the carrying home, preparation, cooking, and communal eating of monkey
    meat, followed by a brief note on Mantra musical instruments.
  language: English
  quote_policy: summarized
