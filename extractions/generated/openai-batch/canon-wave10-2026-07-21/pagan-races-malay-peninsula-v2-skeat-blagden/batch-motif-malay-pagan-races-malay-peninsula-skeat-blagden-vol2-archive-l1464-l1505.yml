canonical_text:
  quote: ''
  summary: The passage describes Orang Laut birth practices on boats, cord-cutting
    measurements, postpartum washing and binding, protective noise-making after birth,
    and a belief that flying lizards cause newly arrived souls to enter newborn children.
    It also mentions a great blind Flying Lizard associated with guarding a Life-stone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When delivery occurred on a boat, the mother was supported upright or laid
    face downward on a broadened transom because space was restricted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One woman held the mother from behind, while a second woman received and washed
    the child after birth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Orang Laut cut the umbilical cord to a length measured as three breadths
    of the bamboo knife used in the operation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: About half an hour after confinement, the mother washed herself in the sea
    and returned to duties after a few days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: For about a month after childbirth, the mother bound the abdominal region
    with a cloth skirt or sarong.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Immediately after a child was born, those present shouted and beat objects
    to create a loud din lasting about ten minutes to half an hour.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The noise was intended to scare away evil spirits that might attack the mother
    or child.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the umbilical cord was cut, the demons were thought to have lost their
    opportunity.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: During intervals in the noise, the old woman assisting at the delivery blew
    upon the child, though the Orang Laut did not regard this as a charm.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Orang Laut believed flying lizards watched for births and caused newly
    arrived souls to enter newborn children.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: The flying lizards were described as subordinate to a great blind Flying Lizard
    that watches over the Life-stone in Orang Laut legends.
  category: relationship
  evidence_refs:
  - ev:5
