canonical_text:
  quote: Orang Laut children belong not to the father but to the mother.
  summary: 'The passage describes Orang Laut marriage and family customs: children
    are affiliated with the mother''s community; bride-parents may receive a present;
    a reported ant-hill ceremony is treated skeptically; wedding-feast games may prompt
    a bridegroom to pursue the bride; women and children are described as receiving
    food after men; families are linked to localities and marriage is exogamous by
    locality; monogamy is said to be usual except for a former levirate-like arrangement.'
  language: English
  quote_policy: quoted
