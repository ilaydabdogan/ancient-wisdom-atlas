canonical_text:
  quote: ''
  summary: 'The passage describes Jakun and Madek Jakun burial practices: white is
    treated as sacred and desired for burial cloth; poorer bodies may be wrapped in
    tree-bark; some frontier groups are alleged to burn corpses and abandon or burn
    the death-place; Madek Jakun mourning includes offerings on the body, wailing,
    head-knocking, and reported self-strangling gestures by women; the deceased is
    buried with property and rice, and objects are placed on the grave. A footnote
    reports a sitting burial with fire around the protruding head. The passage ends
    with an incomplete statement that great magicians were believed able to reach
    heaven.'
  language: English
  quote_policy: summarized
