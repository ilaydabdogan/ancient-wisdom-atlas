  text: The Jakun considered white a sacred colour and found comfort in obtaining
    white cloth for burial during their last sickness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When white cloth could not be obtained because of poverty, the body was wrapped
    in tree-bark.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: It is alleged that among some tribes on the frontier of Pahang the corpse
    was burnt, and that the place where a Jakun died was deserted and the house burnt;
    the passage says this was confined to a few.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the death of a Madek Jakun man, tobacco and betel-leaf were deposited on
    his breast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The deceased man's relations wept and wailed while knocking their heads against
