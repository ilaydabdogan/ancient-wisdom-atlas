canonical_text:
  quote: The earth ... is regarded as a thin, flat crust floating upon a nether ocean.
  summary: 'The passage describes Sakai cosmology and afterlife beliefs: a flat earth
    over a nether ocean, layered heavens, the Island of Fruit-trees, child souls at
    Noon, and adult souls undergoing purification and judgment involving Granny Lanyut,
    hot water, a chopper-edge ordeal, and Tuhan or Peng as supreme judge.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The earth is described as a thin, flat crust floating on a nether ocean, and
    the heavens are described as having several layers or tiers.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lowest heavenly region is identified with “Kelonsong Awan,” glossed as
    “Husks” or “Shards” of the Clouds, beyond which lies the Sakai Island of Fruit-trees.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The upper heavens are said to be inhabited by Tuhan or Peng and by a giantess
    called Granny Long-breasts or Gendui Lanyut.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Both men and women are said to go to Paradise, while children go to a place
    called Noon beneath the Cloud-husks instead of undergoing the ordeal.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:5
  text: After death, adult Sakai souls proceed to Neraka, where Granny Lanyut washes
    sin-blackened souls in hot water; the passage states that all men’s souls must
    be purified.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Granny Lanyut is described as a giantess with pendulous breasts thrown over
    her shoulders, and elsewhere as sitting sideways in the posture of a Sakai woman
    except while washing souls.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Granny Lanyut makes souls walk along the horizontal edge of a monstrous chopper
    that hangs over a large vessel of boiling water, while she stokes the fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A block of wood juts out from the opposite side of the copper vessel, and
    souls must spring across the gap between the chopper blade and the block.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bad souls fall into the boiling vessel, while good souls escape and continue
    along the block of wood toward the Island of Fruit-trees.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Good souls wait until Tuhan sends a same-sex friend to show them the way to
    the Husks of the Clouds; if they have no friend, they wait for another soul who
    has one.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the afterlife journey, the two sexes are separated, and only adults are
    allowed to proceed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Children remain with Tuhan and later spend their time playing in the place
    called Noon; the passage says they do not need to eat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Souls that fall into the vessel are fished out by Granny Lanyut when they
    are clean enough, rubbed, and placed on the block of timber.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: If souls require further purification, they may be thrown in again up to seven
    times; if they remain black, Granny Lanyut casts them out to wander on earth as
    demons, with Degup Demon and Grave Demon named as examples.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Tuhan is described as the supreme judge of souls, with demons as agents of
    his punishments; the passage also says his decree cannot be opposed and he is
    not prayed to because his will is unalterable.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: The same chief spirit or god is elsewhere named Peng by Vaughan-Stevens, who
    describes Peng’s power over demons.
  category: speech
  evidence_refs:
  - ev:8
