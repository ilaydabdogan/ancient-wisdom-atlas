canonical_text:
  quote: ''
  summary: The passage reports traditions about wild men with unusually long feet,
    Gergasi with monstrous features who are defeated by a Raja and whose seven survivors
    dwell in cave-hills, beliefs that these beings buried treasure revealed in dreams,
    and an origin claim in which their spilled blood becomes leeches or mosquitos.
    It also discusses cannibalism stories attributed to Bataks and the possible transfer
    of such charges to jungle peoples, while denying evidence for cannibalism among
    the latter.
  language: English
  quote_policy: summarized
