- id: obs:1
  text: The flying-fox is described as a roasted favorite dish of the Sakai, the subject
    of a Besisi tribal song, and represented by a bone included among the royal insignia
    of the hereditary Chief of Jelebu.
  category: relationship
  evidence_refs:
  - ev:1
