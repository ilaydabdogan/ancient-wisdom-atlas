canonical_text:
  quote: ''
  summary: The passage surveys reported animal, bird, and plant beliefs among groups
    in the Malay Peninsula. It notes flying-fox associations, the absence of Semang
    totemism, claims of tiger self-transformation by medicine-men, animal soul transmigration
    beliefs, bird roles in birth and ancestor beliefs, and plant or tree legends involving
    Disease patterns, blowpipe patterns, and humans transformed into trees.
  language: English
  quote_policy: summarized
