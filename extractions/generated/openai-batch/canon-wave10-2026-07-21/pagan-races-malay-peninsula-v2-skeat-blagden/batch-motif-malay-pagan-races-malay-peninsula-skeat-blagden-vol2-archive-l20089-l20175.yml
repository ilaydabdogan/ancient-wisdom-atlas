canonical_text:
  quote: ''
  summary: The passage describes the decline and replacement of several aboriginal
    Malayan dialects by Malay or Malay patois through assimilation. It gives examples
    from Johor, Pahang, and Selangor, including Jakun use of Malay and a special tabooed
    jargon during camphor searching. It also reports a Sakai clan's explanation that
    they spoke only Malay because they descended from an invulnerable Rawa Malay ancestor
    who could not be circumcised and therefore went to live in the jungle with aborigines.
  language: English
  quote_policy: summarized
