canonical_text:
  quote: ''
  summary: 'The passage describes Jakun birth-related customs and beliefs: naming
    a child from natural or color terms; parental food taboos while children cannot
    walk, with feared illness if violated; pregnancy behavior, including withdrawal
    from strangers and the husband''s continued proximity; a protective shell-shaped
    wooden object carried by pregnant women; ijok fibres hung publicly to warn of
    nearby childbirth; and measurement and tying of the umbilical cord before severing.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The father gives the child a name, usually taken from a tree, fruit, or colour.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among Jakun groups on the Madek River in Johor, parents refrain from eating
    certain fish and animals while their children are unable to walk; the restriction
    ends after the children can walk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a parent eats forbidden creatures during the restricted period, the children
    are believed to become liable to an illness called "bĕsong," associated with a
    swollen stomach.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The forbidden foods listed include named fish and many animals, including
    deer, chevrotins, wild pig, fowls, eggs, lizards, tortoises, and turtles.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Pregnant Jakun women withdraw when strangers, including members of their own
    race, are present.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Jakun husband, when possible, remains within sight of his pregnant wife;
    his presence is believed to further the wellbeing of the unborn child.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A pregnant Jakun woman may carry a shell-shaped piece of wood to protect her
    unborn child.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: A bundle of ijok fibres is hung in a public place to warn passers-by that
    a woman in travail is nearby; a man who sees the sign turns back.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The umbilical cord is measured from the child's navel to its knee and tied
    with a string before being severed.
  category: action
  evidence_refs:
  - ev:9
