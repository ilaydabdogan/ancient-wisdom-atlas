canonical_text:
  quote: ''
  summary: The passage gives a comparative classification of man-spirits among Semang,
    Sakai, and Jakun materials, including demons connected with birth, sinful lusts,
    sickness, discomfort, and ghosts of the dead. It then summarizes Semang and Jakun
    creation-of-man legends in which early humanity multiplies excessively, divine
    or underworld figures reduce the population, and Death is instituted. The passage
    also notes a proverb about parents dying like a banana-tree and mentions a Jakun
    story in which the mother of the first pair, Mertang and Belo, is called “Clod
    of Earth.”
  language: English
  quote_policy: summarized
