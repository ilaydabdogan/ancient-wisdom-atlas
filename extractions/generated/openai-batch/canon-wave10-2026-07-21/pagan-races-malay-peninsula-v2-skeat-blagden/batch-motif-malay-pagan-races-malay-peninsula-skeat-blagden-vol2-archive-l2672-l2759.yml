canonical_text:
  quote: ''
  summary: The passage describes Sakai customs concerning the Hantu Darah or Blood
    Demon, a receptacle called chit-nat that men avoid touching, and a purification
    water-vessel called ka-pet used by unmarried Sakai girls. It also notes Besisi
    non-practice of tattooing and related body modifications, and gives artifact descriptions
    of chit-nats and bamboo ka-pet vessels with incised or painted designs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sakai men say they have nothing to do with the Hantu Darah and direct questions
    about it to the sage-femme.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Magicians who are responsible for other medicines used against demons do not
    acknowledge the antidote against the Blood Demon.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: No Sakai man will touch the receptacle called chit-nat, which is usually kept
    planted in the ground by the waterside.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The chit-nat can be made quickly when required, and its pattern is quickly
    washed off by rain.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Unmarried Sakai girls use a water-vessel called ka-pet or karpet for purification.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The ka-pet is considered fully efficacious when incised by an old-school magician,
    and such vessels are reported among wild Sakai tribes who do not speak Malay.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Besisi are reported not to practice tattooing, scarification, nose-boring,
    circumcision, or incision, and they relate a tradition explaining why they do
    not adopt these practices.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: A note states that painting is performed with instruments used for severing
    the umbilical cord.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The ornamentation of other chit-nats is described as the exclusive privilege
    of magicians, who use a special curry-comb-like instrument cut from horn.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Two ka-pet specimens are described as bamboo stem segments, open at the top
    and closed at the bottom, decorated with narrow stripes made from leaf-patterns
    or a plant design.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The note states that slight mistakes in the ka-pet design do not cause the
    design to lose its efficacy.
  category: attribute
  evidence_refs:
  - ev:5
