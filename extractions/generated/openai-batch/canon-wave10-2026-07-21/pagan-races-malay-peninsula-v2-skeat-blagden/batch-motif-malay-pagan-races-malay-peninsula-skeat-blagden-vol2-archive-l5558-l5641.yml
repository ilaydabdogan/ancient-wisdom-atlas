  summary: The passage describes burial details for a deceased woman, including a
    timber frame, an upright bertam palm midrib as a sign about the manner of death,
    rice offerings for the woman and visiting family spirits, grave pegs bound with
    white cloth, a Blandas grave-demon charm, Besisi corpse postures, occasional abandonment
    or burning of dwellings after death, and a model hut for the soul.
  language: English
