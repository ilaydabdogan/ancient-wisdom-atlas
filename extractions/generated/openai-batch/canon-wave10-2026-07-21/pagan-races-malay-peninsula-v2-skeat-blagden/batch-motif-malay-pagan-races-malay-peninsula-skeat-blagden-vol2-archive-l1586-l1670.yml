canonical_text:
  quote: ''
  summary: The passage discusses tattooing, scarification, and body-paint designs
    among Aboriginal Malayan groups. It distinguishes tattooing from skin-scarification,
    argues that the practice is not Jakun in origin, and weighs whether it should
    be attributed to Semang/Negrito or Sakai origin. The author cites rare evidence
    among Semang/Negritos, absence of similar practices among Andamanese and Jarawa
    groups, the Plus valley in Ulu Perak under Sakai influence, L. Wray's opinion,
    and Ulu Langat Sakai evidence to conclude that tattooing and scarification are
    likely of Sakai origin and exotic among Semang. The passage then suggests that
    body-paint may have originated as magical body designs, later developing into
    tribal marks and decorative designs, while warning that much information comes
    from Vaughan-Stevens and is not secure.
  language: English
  quote_policy: summarized
