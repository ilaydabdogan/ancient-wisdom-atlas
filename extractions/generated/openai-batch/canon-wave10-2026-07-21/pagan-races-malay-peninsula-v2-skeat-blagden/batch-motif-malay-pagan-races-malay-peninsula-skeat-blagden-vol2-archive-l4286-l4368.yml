canonical_text:
  quote: ''
  summary: 'The passage describes reported Mantra, Benua, and Jakun marriage and domestic
    customs: punishment for proved adultery, separation and compensation when infidelity
    is unproved, limits on wife-beating, kin and chief-mediated sanctions, Benua betrothal,
    a reported canoe-chase marriage test, a shared-plate marriage ceremony, marriage
    gifts, remarriage without ceremony, and variable monogamy or polygyny.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Adultery is described as a capital crime when proved by witnesses, with the
    Batin's sentence carried out by the Penglima.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Convicted offenders are laid prostrate in a brook, and their heads are held
    under water by a forked stick fixed into the streambed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a husband believes his wife has been unfaithful but cannot prove it,
    he may desert her, but must leave her the house and clearing and pay cloth, money,
    and silver rings.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the unproved-infidelity case, the children remain with the wife, and she
    may not remarry until the husband takes another wife.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says the husband's right to beat his wife for any cause is not
    recognized among the Mantra, also among the Benua, and probably among other Jakun
    tribes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Mantra husband may complain to his wife's parents if she offends him; the
    wife has a reciprocal right to appeal to his parents for protection.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If a husband commits a serious offence against his wife, her relatives may
    complain to the Batin, receive authorization, strip the husband's house, and bring
    the goods to the Batin for distribution.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Among the Benua, betrothal is said to be the rule and can occur at a very
    early age for the girl.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: One reported Benua marriage account places the bride alone in a canoe with
    a paddle, sends her downstream, and has the bridegroom pursue her in another canoe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the canoe-pursuit account, overtaking the bride makes her the bridegroom's
    wife, while failure breaks off the match.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: According to members of the tribe, the union is arranged by parents and the
    ceremony consists of the couple eating from the same plate.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the shared meal, the bridegroom's relatives depart, he spends the night
    in the bride's house, and the next day he takes her home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: A present is sent to the bride's parents before marriage, including plates
    in larger numbers for Batins and their families than for others.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: A woman who has already been married uses no ceremony for remarriage; she
    goes to the new husband's house and installs herself as mistress.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Most Benua are said to have one wife, while some have two, with no apparent
    rule on the subject.
  category: relationship
  evidence_refs:
  - ev:7
