canonical_text:
  quote: ''
  summary: The passage describes Semang birth customs and beliefs about name-trees,
    taboos on the child’s birth-tree species, an expectant mother’s visit to a tree
    of her own birth-tree species, the soul of an unborn child conveyed in a bird
    that must be eaten by the mother, and a belief that tiger-souls from a tigress'-milk
    fungus can interfere with the human soul and cause malformation or death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kari is said to register souls he has sent forth by notching the tree against
    which he leans; the notches are called tangkor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Trees that have been blazed in this context are not felled, and any tree species
    may serve as a name-tree for a child of either sex.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage contrasts Western Semang use of many Malayan fruit names with
    Eastern Semang use of Semang or Menik tree names.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A child must not later injure any tree of the species belonging to his tree
    and must not eat its fruit, except in the stated case of an expectant mother revisiting
    her birth-tree.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among the Eastern Semang or Pangan, an expectant mother formerly might visit
    the nearest tree of the species of her own birth-tree and hang or place fragrant
    leaves and blossoms there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When depositing flowers at the tree, the mother avoids placing them on the
    spot where the afterbirth had been buried.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The expected child’s soul is described as being in bird form; the bird recognizes
    the tree by the spot associated with the afterbirth and waits there until killed
    and eaten by the mother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Every tree of the birth-tree species is regarded as identical with the original
    birth-tree, and the soul-bird inhabits and flies among trees of that species while
    following the unborn body.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The souls of first-born children are described as newly hatched young birds,
    offspring of the bird containing the mother’s soul; the birds obtain souls from
    Kari.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: If the woman does not eat the soul-bird during childbirth, the child is said
    to be stillborn or to die shortly after birth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Bodily malformation is explained by saying that the soul-bird fell on the
    tigress'-milk fungus, described as the young soul of a tiger resting in the earth
    until eaten by a tigress with cubs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The souls in the tigress'-milk fungus are said to be a male and female pair.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: If the bird falls on the fungus, tiger-souls escape into the bird and later
    battle the human soul in the unborn body, causing crippling or death.
  category: sequence
  evidence_refs:
  - ev:8
