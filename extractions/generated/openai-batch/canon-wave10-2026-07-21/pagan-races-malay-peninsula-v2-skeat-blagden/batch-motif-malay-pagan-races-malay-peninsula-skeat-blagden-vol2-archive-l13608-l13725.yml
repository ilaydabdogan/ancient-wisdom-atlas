canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Sakai/Blandas beliefs about demons: Peng
    and Tuhan have authority over demon harm and human death; unpurified souls become
    demons; the Degup Demon is a punished immortal soul connected to its grave and
    marked by backward feet; Sakai abandon sites where an evil-doer dies; and the
    Grave Demon receives food, water, and fire while the deceased soul goes to Neraka
    and wicked deeds seek embodiment near the grave.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Demons are described as preferring to live in pairs; Peng can annihilate them
    or increase their number, while no one else can kill them, and a magician can
    keep them away only conditionally.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Male demons are said not to fear women, and at the tuang-tuang ceremony demons
    enter the ring from above and leave through the ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Souls that cannot be purified are changed into demons, ranging from those
    shut out of the Cloud-Husks to the Hantu Degup, which suffers cold, thirst, and
    hunger.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sakai are said to believe that, except for the Degup Demon, a demon attacks
    them only after wrongdoing and with permission from Tuhan.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sakai avoid demons and, when sick but not dying, try to frighten demons
    away or oppose them with spells.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The world of demons is said to have four chiefs named Batin, Jinang, Jurukrah,
    and Penglima.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A person killed by the Degup Demon shows symptoms resembling snake-bite in
    the foot; demons have reversed feet, and if they overtake a person they shake
    him until he dies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: All deaths by demons are said to be permitted by Tuhan, who decides how long
    each person ought to live.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Degup Demon is described as a lost immortal soul too spotted for Granny
    Lanyut to purify after seven bathings in boiling water; she expels it from hell,
    and it is punished on earth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Degup Demon is visible, slays those it meets without pain, cannot go far
    from the place where its body is buried, and seeks warmth and comfort near the
    grave.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: When the Degup Demon cannot find the grave it may be heard at night crying
    “Gup”; when it finds the grave it cowers on it in the form of an old man or woman
    with feet turned backwards.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Sakai are said to leave and rebuild any place where even one evil-doer
    dies, never returning to the deserted site; deaths from other causes or of people
    with good reputations do not have the same effect.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The anchak, a sacrificial tray suspended over Sakai graves, receives food
    and water for the Grave Demon, and the fire on the grave is also lit for the Grave
    Demon.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: The soul of the deceased is said to have gone to Neraka, while the deceased
    person’s wicked deeds wander near the grave as a grave demon seeking a human embodiment;
    a good person gives no opportunity, but a bad person allows entry and becomes
    worse.
  category: sequence
  evidence_refs:
  - ev:10
