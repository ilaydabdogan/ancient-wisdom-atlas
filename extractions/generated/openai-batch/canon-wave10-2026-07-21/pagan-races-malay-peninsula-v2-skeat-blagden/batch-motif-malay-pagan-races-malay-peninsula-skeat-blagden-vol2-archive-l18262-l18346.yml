canonical_text:
  quote: ''
  summary: The passage closes an etiological story in which water connected with a
    destroyed turtle becomes the sea, and the mouse-deer receives sweet-potato leaves
    as its food share. It then gives a genealogy and political-origin account for
    Entah/Lord-knows-who's descendants, To' Terjeli, named Batins, appointed chiefs,
    the female ruler To' Mutan Jantan, Johol succession through the female side, and
    the first Raja Salengkar Alam's proclamation at Bukit Guntang Penyaring.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the turtle's destruction, the water that accompanied it is said to have
    increased greatly and formed the sea.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mouse-deer asks Lord-knows-who for a reward; Lord-knows-who takes the
    sweet-potato root, while the mouse-deer receives the leaves, which are thereafter
    its food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lord-knows-who proceeds from the sources of the Kenaboi river to Pagar-Ruyong,
    and his son To' Terjeli comes back across and settles in Jelebu.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that To' Terjeli had eight sons and then lists named Batins
    associated with Klang, Jelebu, Johor, Pagar-Ruyong, Siam, Menangkabau, Pahang,
    Stambul, and Muar.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: To' Terjeli is said to have first appointed penghulus or tribal chiefs over
    several places, including a female ruler named To' Mutan Jantan at Kuala Muar.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Dato' of Johol is said to wear hair down to the waist to preserve the
    memory of Johol's first female ruler.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The To' Klana Putra and the Dato' of Johol are credited with establishing
    or founding several states and settlements.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the death of To' Mutan Jantan, succession passes to her nephews and
    then to males, but always through the female side; several successors are named.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Salengkar Alam of Bukit Guntang Penyaring is identified as the first Raja
    ever appointed and was proclaimed Raja at a feast involving flying-fox caught
    in a fowling-net.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the proclamation feast, people descend the hill of Guntang Penyaring
