canonical_text:
  quote: ''
  summary: The passage presents three animal song or charm sections concerning the
    Tiger, the Honey-bear, and the Sambhur-deer. The Tiger section describes tiger
    territory, movement, Mount Ophir as the tiger's place of origin, and a hierarchy
    of tiger figures. The Honey-bear section describes the bear's feeding and climbing
    habits, an encounter in which Mamat the First-born kills it, and the use of its
    spleen to treat people who have fallen. The Sambhur section describes a crop-damaging
    deer, its trail and physical traits, and calls it a magic Sambhur.
  language: English
  quote_policy: summarized
