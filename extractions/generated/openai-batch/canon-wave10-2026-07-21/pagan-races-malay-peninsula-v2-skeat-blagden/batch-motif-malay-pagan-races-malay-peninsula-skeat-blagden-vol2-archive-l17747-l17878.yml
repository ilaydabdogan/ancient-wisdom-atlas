canonical_text:
  quote: ''
  summary: 'The passage gives translated spell texts: the close of a subjugating prayer,
    a pacifying spell, a tongue-breaking spell, two hate-charms, and the beginning
    of a spell for driving out Mischief. The charms invoke God, Muhammad, and the
    royal Prophet of God; use plant, animal, bodily, solar, and directional imagery;
    and direct coercive effects toward mankind, enemies, named placeholder targets,
    and Mischief.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening prayer asks God, Muhammad, and the royal Prophet of God to make
    all mankind bow and to let the speaker confront living humans described as two-footed
    and five-fingered.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pacifying spell names a throwing-stick of holy basil and asks that an
    angry heart be shut and a kind heart be opened.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The pacifying spell says that even a white or streaked elephant from beyond
    the sea reverses its hair, tusks, trunk, feet, flesh, and blood, and bows to the
    little toe of the speaker's left foot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The pacifying spell says the speaker's oil runs beside the door, imagines
    a young hornbill on the topmost bamboo spray, and asks that the speaker hit it
    with a blowpipe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The same spell says the sun is lifted upon the speaker's eyebrows, the speaker's
    tongue is like the swell of the ocean, and the speaker's lips are like ants pursuing
    one another; it then asks God, Muhammad, and the royal Prophet of God to abase
    others.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The tongue-breaking spell names dry and seed betel-nut split by an elephant's
    foot, says the speaker locks a person's heart's blood and breaks bones, and asks
    to break the tongues of enemies, foes, and assailants.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The tongue-breaking spell contrasts the targets as soft and the speaker as
    hard, and includes the statement that there is no god but God.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The mantra hate-spell plucks seven stalks and seven leaves of the Hate-plant
    and cuts them seven times while cutting the heart of a target named by placeholder.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The hate-spell commands hatred during sitting, sleeping, walking, eating,
    bathing, and drinking; it calls the target's shadow, sets a three-day period,
    and asks that the target look upon the speaker alone as sweet and bright.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The hate-spell links the soul of the placeholder target to the sun's descent
    and rising over twelve days.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Another hate-charm combines Beruwang shoots with Hate-plant leaves, invokes
    faith and sacrifice, and commands people, mankind, grass, twigs, trees, and all
    breathing things to hate the placeholder target's face and voice.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The driving-out spell addresses Mischief directly, orders it to quake and
    swerve left and right toward its wallow, says the speaker casts it out, and ends
    this excerpt with the speaker unloosing a finger of the hand.
  category: speech
  evidence_refs:
  - ev:10
  - ev:11
