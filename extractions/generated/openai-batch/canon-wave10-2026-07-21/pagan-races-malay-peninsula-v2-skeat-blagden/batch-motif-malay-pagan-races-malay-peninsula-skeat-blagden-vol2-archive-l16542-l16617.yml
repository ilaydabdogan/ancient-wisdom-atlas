canonical_text:
  quote: ''
  summary: The passage describes a Besisi divination and medium-making ceremony called
    Seoi or Sawai, Malay ber-sawai. The ceremony may be performed for illness or to
    obtain answers about welfare. At night, lights are extinguished, participants
    sit in a circle, chant an invocation with bamboo stampers, and burn benzoin incense
    in a coconut-shell brazier. A spirit is said to descend by possessing a participant,
    who falls unconscious, answers questions while possessed, and is restored to consciousness
    by inhaling incense smoke.
  language: English
  quote_policy: summarized
