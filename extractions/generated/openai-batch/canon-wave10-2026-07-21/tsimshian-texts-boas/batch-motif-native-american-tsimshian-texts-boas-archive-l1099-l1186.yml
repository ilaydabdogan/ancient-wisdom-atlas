canonical_text:
  quote: ''
  summary: The passage includes an opening note about Kotten-feathers or Rotten-feathers
    travelling with his younger brother, marrying, and returning home. It then recounts
    children who play inside a hollow log that is carried out to sea by the tide.
    They survive by catching gulls with blood rubbed on the log, are endangered in
    a whirlpool, and are saved and fed by One-leg, who later sends them home in a
    man-shaped canoe named Wa's-Eat-each-end that must be fed seals. The children
    return to the town of their fathers. A following episode begins with four clan
    hunters at sea-lion rocks; one has poor success, steals sea-lions from the Wolf-clan
    man's rock, and the Wolf-clan man carves and tests wooden sea-lion figures until
    one made from red hard wood proves good.
  language: English
  quote_policy: summarized
