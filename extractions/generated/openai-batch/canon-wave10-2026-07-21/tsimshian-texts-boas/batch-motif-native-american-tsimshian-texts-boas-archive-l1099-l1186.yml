  quote_or_summary: The boys go to One-leg's house; One-leg gives them food, hunts
    seals by the whirlpool, and Hard-instep is jealous because One-leg saved the boys.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tsimshian-texts-boas.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:7
  type: summary
  locator: lines 1148-1158
  quote_or_summary: The children eat, grow into young men, remember those left behind,
    cry, and One-leg tells them the town of their fathers is nearby and that they
    may use his canoe.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tsimshian-texts-boas.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:8
  type: summary
  locator: lines 1159-1171
  quote_or_summary: After the boys fail to find the canoe, One-leg uncovers it from
    a rotten tree. It is a large canoe shaped like a man, with a mouth at each end,
    named Wa's-Eat-each-end, and it eats anyone who crosses its bow or stern.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tsimshian-texts-boas.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:9
  type: summary
  locator: lines 1172-1179
  quote_or_summary: One-leg warns them not to pass in front of the canoe. They put
    seals aboard as food; the bow and stern each eat five seals, and the canoe travels
    very fast; they feed it more seals and continue.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tsimshian-texts-boas.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:10
  type: summary
  locator: lines 1180-1183
  quote_or_summary: The children land at the town of their fathers; their fathers,
    mothers, and relatives are crying, and the boys come back.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tsimshian-texts-boas.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:11
  type: summary
  locator: lines 1184-1195
  quote_or_summary: Four great hunters, one each from the Wolf, Raven, Eagle, and
    Bear clans, go by canoe to four rocks with sea-lions. One catches only two, while
    the Raven, Wolf, and Eagle clan men catch many, and the one man is ashamed.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tsimshian-texts-boas.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:12
  type: summary
  locator: lines 1196-1201
  quote_or_summary: One evening the ashamed man steals the sea-lions on the Wolf-clan
    man's rock; the next morning the Wolf-clan man finds none there and knows someone
    has stolen them.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tsimshian-texts-boas.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:13
  type: summary
  locator: lines 1202-1211
  quote_or_summary: The Wolf-clan man carves sea-lion figures from wood and tests
    them in water. Several woods fail, but a red hard wood like sea-lion skin works,
    and he lays the figure on his rock.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tsimshian-texts-boas.md
  rights_note: Public domain; source metadata permits full text use.
