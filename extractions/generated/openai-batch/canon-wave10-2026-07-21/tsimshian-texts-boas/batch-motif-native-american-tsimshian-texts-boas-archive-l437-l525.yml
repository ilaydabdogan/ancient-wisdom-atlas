canonical_text:
  quote: ''
  summary: A chief's daughter bears an unusual boy after swallowing a cedar leaf in
    water. The boy eats scab-contaminated chewed food and becomes so hungry that he
    consumes village provisions, leading to his abandonment. He wanders hungry, curses
    Bullhead into its present shape, makes and loses a raven-skin blanket, is publicly
    shamed, travels with a slave who falls into a canyon and revives after TxamsEm
    eats the contents of his stomach, imitates children associated with seal-blubber
    production, and later interacts with Chief Cormorant while fishing.
  language: English
  quote_policy: summarized
