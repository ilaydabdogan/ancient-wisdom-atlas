canonical_text:
  quote: ''
  summary: Ts'ak, blocked at a mountain, is invited by a Mouse-associated woman into
    a hidden house under grass. After a fire-and-earrings demonstration, she reveals
    herself as the trail through the mountain and sends him to her shaman sister,
    another Mouse woman. The second woman repeats the fire act and gives Ts'ak an
    ice or crystal carving with instructions for surviving a chief's deadly stone
    door. Ts'ak passes the door, reaches the chief's daughter, and marries her. The
    chief repeatedly tries to kill him by a bear-skin ordeal, boiling water, and enclosing
    him in a split tree, but Ts'ak survives each attempt and is identified as a great
    supernatural man.
  language: English
  quote_policy: summarized
