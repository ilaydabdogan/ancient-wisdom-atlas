canonical_text:
  quote: ''
  summary: 'Txii''msEm has a series of adventures: he learns from his own excrement
    how to steam salmon; an animated stump eats the salmon; he deceives Grizzly Bear
    into fatal self-injury while fishing and kills the Bear''s wife with hot stones;
    he delays Little Pitch after sunrise until Little Pitch dies, explaining why one
    side of the halibut is black; and he begins an encounter with a town of the air
    where unseen people and self-acting objects appear.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Txii'msEm does not know how to prepare food, defecates, asks his excrements
    what to do, and receives the answer to steam it in a hole.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Txii'msEm repeats the cooking instruction like a song while gathering stones,
    heating a hole, collecting skunk-cabbage leaves, cutting salmon lengthwise, and
    placing it in the hole.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A stump near the cooking hole moves, sits on the hole, and consumes the salmon
    while Txii'msEm is away; Txii'msEm overturns and breaks the stump with a lever
    and stones.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Txii'msEm enters Grizzly Bear's house, asks him to fish for halibut, and proposes
    using their own bodies, specifically testicles, as bait.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the canoe, Txii'msEm pretends to cut off his penis and bait his hook; Grizzly
    Bear imitates the act, cuts off his own penis, faints, attempts to attack Txii'msEm,
    and dies after Txii'msEm escapes into the water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Txii'msEm tells the female Grizzly Bear to swallow hot stones because her
    husband caught no halibut; she trusts him, swallows the stones, tumbles about,
    is struck by him, and dies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Txii'msEm cuts up the dead Grizzly Bear and his wife, remains many days, and
    eats the Bear's provisions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Little Pitch is rich and tells Txii'msEm that it is not good for him to be
    outside after sunrise, saying he must return while it is still chilly.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Txii'msEm delays Little Pitch on the fishing bank after sunrise, has him lie
    under a mat, repeatedly calls to him as his voice weakens, and then returns home
    when Little Pitch is dying.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Where Little Pitch dies, pitch comes out and runs over the halibut; the narrator
    states that this is why the halibut is black on one side.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The narrator states that Txii'msEm always ate the food of chiefs and killed
    two chiefs, Grizzly Bear and Little Pitch.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Txii'msEm finds the town of the air, sees houses, hears unseen people announce
    that the chief is coming, enters a chief's house, sits on a mat that is spread
    for him, and sees a box open by itself with salmon coming out.
  category: sequence
  evidence_refs:
  - ev:7
