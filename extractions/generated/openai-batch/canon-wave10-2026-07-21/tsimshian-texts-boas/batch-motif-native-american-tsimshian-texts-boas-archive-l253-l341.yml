canonical_text:
  quote: ''
  summary: The passage recounts Txa'msEm arranging a shooting match with Logobola'
    over the Skeena and Nass rivers, using the Crows to alter the arrows and win.
    It then tells how Txa'msEm seeks daylight hidden in a box called max, transforms
    into a cedar leaf, is swallowed by a chief's daughter, is born as a rapidly growing
    boy, gains the daylight box, and runs away with it. At a dark river mouth he opens
    the sun-box slightly after being mocked by ghosts fishing for olachen. The passage
    then begins an episode in which Txa'msEm tricks a sleeping chief whose house contains
    water and starts to take the water in a bear-skin blanket.
  language: English
  quote_policy: summarized
