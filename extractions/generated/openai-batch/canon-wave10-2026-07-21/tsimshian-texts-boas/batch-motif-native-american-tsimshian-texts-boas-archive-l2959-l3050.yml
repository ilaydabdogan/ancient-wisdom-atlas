canonical_text:
  quote: ''
  summary: The passage summarizes a sequence of Tsimshian narratives involving Txii'msEm/Txa'msEm
    acquiring water, olachen, fire, salmon, and fish; etiological episodes about mortality
    and animal features; contests among animals; sky abduction and rescue; children
    lifted by feathers and later restored; journeys involving transformed objects,
    mountains, pursuit, hollow logs, self-moving canoes, and an artificial sea lion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Txii'msEm visits a chief who owns fresh water, obtains permission to drink
    through a deception, takes all the water, and flies away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Water runs out of Txii'msEm's blanket and forms rivers; after he meets ghosts
    and turns back, the waters of Nass River turn back.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Txii'msEm makes a gull vomit olachen spawn, uses the spawn to persuade a chief
    who owns olachen to release them, catches and roasts olachen, and throws stealing
    gulls into fire, blackening their wing tips.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Txa'msEm takes the shape of a deer, ties pitchwood to his tail, steals fire,
    and strikes tree butts with his burning tail so wood burns.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Txa'msEm marries a salmon woman, obtains salmon, gains long hair, then loses
    the salmon and hair after scolding her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Txa'msEm uses his voice as an echo in a cliff to scold a chief, then flies
    away in raven shape; later he makes a stump his slave and calls fish ashore to
    kill them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Stone and Elderberry Bush give birth nearly at the same time, but Elderberry
    Bush's children are born first; this is given as the reason humans are mortal.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Beaver and Porcupine exchange visits and dangerous play; Porcupine survives
    a fall by shouting for space, while Beaver shouts for rock and bursts his belly
    on landing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Wolves and Deer feast and play laughing at each other; when Wolves see that
    Deer have no teeth, they devour them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A boy who ridicules a Star is taken to the sky and tied to the smoke-hole
    of the Star's house.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The boy's father climbs a chain of arrows to the sky, gives items to a man
    for advice, substitutes a carved figure for his son, and escapes with the boy
    while Stars pursue.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: Tobacco, red paint, and slingstones thrown by the fugitives delay the Stars;
    the Stars paint their faces, explaining red and blue stars, and a swollen advisor
    obstructs their way.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Children making noise annoy Heaven, who sends feathers down; a boy puts feathers
    on his head and is lifted up along with others who try to hold him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: A menstruating girl and her grandmother remain; the girl places wedges, a
    grindstone, a knife, and mucus in her blanket and gives birth to five boys and
    one girl who personify these objects.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The feather-lifted children transform into trees, mountains, and mucus; the
    knife girl cuts off the feather, the boys fall down, and the bones of earlier
    lifted people fall down and are revived.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: Grindstone becomes a mountain; Rotten-feathers cuts passages through mountains
    with a feather, receives advice from Great-goose, survives a lethal substitution
    involving headdresses, abducts Sleep's wife, and escapes through obstacles in
    a self-moving canoe.
  category: sequence
  evidence_refs:
  - ev:13
  - ev:14
- id: obs:17
  text: Children playing in a hollow driftwood log are carried to sea, use their blood
    to glue gulls to the log, and live on the gulls.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:18
  text: A one-legged person pulls the log from a whirlpool, cares for the boys, and
    later reveals a self-moving canoe with a head at each end that eats what crosses
    the bow or stern and takes the boys home after being fed seals.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:19
  text: One of four sea lion hunters steals another hunter's sea lions; the victim
    makes an artificial sea lion that pulls the thief and crew across the ocean when
    harpooned.
  category: sequence
  evidence_refs:
  - ev:17
