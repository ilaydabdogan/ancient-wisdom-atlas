canonical_text:
  quote: ''
  summary: Ts'ak' and his grandmother process bear meat, which is then stolen by people
    identified as Wolves. Ts'ak' deceives and injures his grandmother, receives a
    hollow bone from an unnamed man, wounds the chief's daughter, and later cures
    her after others fail. He is paid, marries her, receives a giant slave, and becomes
    a chief. Later he leaves to seek another woman beyond a mountain and attempts
    to fly upward in bird skins, but a fiery obstacle burns the wings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ts'ak' tells his grandmother he has killed a great Grizzly Bear, borrows her
    small knife, cuts the bear, and she carries the meat, which they place on drying
    sticks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ts'ak' enters the chief's crowded gambling house across the river, chews tallow,
    spits into the fireplace, and the fire blazes up.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people tie Ts'ak' to a tree with a rope and then eat all the meat in his
    grandmother's house; the passage identifies them as Wolves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the meat is gone, Ts'ak' and his grandmother cry because they have no
    food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: While his grandmother sleeps, Ts'ak' cuts out her vulva, roasts it, tells
    her it is leftover meat, and she eats it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ts'ak' sings that his grandmother ate her own vulva, and she tells him not
    to enter her house again.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: An unnamed man asks why Ts'ak' is crying, hears that the Wolves ate the meat,
    gives him a hollow bone, and instructs him to blow it through a knothole toward
    the chief's daughter's heart.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ts'ak' blows through the hollow bone; the bone strikes the heart of the chief's
    child, who becomes very sick, and the summoned shamans fail to cure her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ts'ak' sends his grandmother to announce that he will cure the chief's daughter,
    although the passage says he is not a shaman; she is first thrown out, then two
    wise men advise allowing him to try.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: Ts'ak' calls the wren, the x-sk*Iek', the x-sg'a'nt, Rattlebox, and other
    little birds, and they sit near the sick chief's daughter with small sticks while
    he performs incantations.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: A giant slave with a large belly stands in the house; a boy strikes his belly
    with a stick, and people call the slave Drum-belly.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ts'ak' pulls out the sickness and saves the chief's daughter; he receives
    elk-skins, grease boxes, the woman in marriage, and the giant slave, and becomes
    a great chief.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: After staying with his wife a long time, Ts'ak' tires of her, hears of another
    woman beyond the mountain, and leaves with his slave, the wren, and another bird.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: At the foot of the mountain, Ts'ak' finds no way forward, skins a robin, wears
    its skin, and flies upward until a great fire like lightning burns the wings and
    he falls back.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Ts'ak' then skins a bluejay, wears its skin, and again flies upward toward
    the top of the mountain before the excerpt breaks off.
  category: sequence
  evidence_refs:
  - ev:7
