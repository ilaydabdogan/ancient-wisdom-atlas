  - ev:2
- id: obs:8
  text: Asi-hwi'l meets Large-ears, and the two compare how they kill game without
    ordinary weapons.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Large-ears uses long mittens and claps his hands, causing goats to fall down
    the steep mountain sides.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Asi-hwi'l uses the red and spotted dogs to make goats fall, then climbs a
    vertical cliff with his snowshoes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Ho'uX hides in the woods before the women's brothers arrive; the brothers
    later take meat given by the sisters.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The women and the boy are taken to G'itxade'n, where the boy's uncles give
    a feast and Asi-hwi'l uses elk skins obtained for meat in giving a potlatch.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: A supernatural being in heaven sends an ash-covered slave who looks like a
