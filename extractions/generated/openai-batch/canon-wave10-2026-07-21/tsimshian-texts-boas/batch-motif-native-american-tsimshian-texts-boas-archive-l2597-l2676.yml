canonical_text:
  quote: ''
  summary: A boy is born and trained as a mountain hunter. His father gives him special
    snowshoes, two dogs that can grow large or small, and a climbing pole. Named Asi-hwi'l,
    he demonstrates his hunting powers against Large-ears, later returns with his
    mother and her sister to G'itxade'n, and is pursued into a further episode when
    a heavenly supernatural being sends an ash-covered slave disguised as a white
    bear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman gives birth to a boy, and when he can walk his father sends him into
    the mountains to look for bears.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After correcting the boy's snowshoes, the father sends him out again, and
    the boy returns with news that he has killed a bear on the mountain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother gives the boy the name Asi-hwi'l, explained in the passage as meaning
    Going-across-the-mountains.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The father gives the boy new snowshoes said to enable him to climb even steep
    mountains.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father takes two tiny dogs, one red and one spotted, from a cedar-bark
    bag and makes them large or small by striking them and speaking their color names.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The father instructs the boy to use the two dogs to drive mountain goats from
    right and left so that the goats will fall down.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The father gives the boy a climbing pole with a goat horn on one end and a
    sharp black bone point on the other.
  category: object
