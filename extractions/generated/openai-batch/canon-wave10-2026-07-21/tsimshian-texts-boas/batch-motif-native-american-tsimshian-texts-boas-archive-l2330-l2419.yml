canonical_text:
  quote: ''
  summary: The passage closes a story in which a dead prince is restored to life and
    becomes the shaman Squirrel after squirrel remains are burned. It then describes
    a sorcerer's killing method using personal traces, clothing, string, a witch-box,
    and a corpse. A following tale tells of a jealous chief who mistakenly bewitches
    his own son after the intended victim changes places in bed. Another tale begins
    with beaver-hunting brothers, the eldest brother's death at a dam, the brothers'
    discovery of his wife's liaison, the beheading of the other man, and the opposing
    town's response.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four close friends watched a body while the mother and others stayed away;
    they sang and accompanied the song with hatons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the singing and spoken song, the body came to life again and the bones
    were covered with flesh.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The revived prince invited his father's tribe and ordered the meat, bones,
    and skins of all squirrels he had shot and kept in boxes to be burned.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people burned the squirrel remains, and the great master of the squirrels
    was glad because his tribe had come to life again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prince sang about becoming accustomed to this side and the other side,
    stood as a great shaman, and received the shaman name Squirrel.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: A sorcerer is described as taking a person's perspiration or old shirt to
    a witch-box, fastening a shirt piece to a string, and cutting the string so the
    shirt falls onto a corpse in the box.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the string breaks, the sorcerer pretends to cry for the victim; after
    the victim's death he circles the house and grave, sits in the grave, rubs his
    body, and continues pretending to cry.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A chief was jealous of his son's prince friend and told his son to invite
    the friend to sleep in his house.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The prince friend was afraid of bewitching, rose during the night, and exchanged
    places in the bed with the chief's son.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The chief came to the bed, felt for the place where the prince had first lain,
    wiped out the mouth of his own son by mistake, and the son became sick for four
    days and died.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Two towns stood in the canyon of the Nass River, one inhabited by the GispawaduwE'da
    and the other by the G'itg'inio'x.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Four GispawaduwE'da brothers hunted beaver at a lake full of beaver dams and
    opened a dam to drain the lake.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The dam gave way while the eldest brother was underneath; he was buried and
    a large tree pierced his heart.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The three surviving brothers said their brother's misfortune was certainly
    connected with his wife's lack of truth to him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: At night the surviving brothers hid near the house, used pitchwood for a torch,
    listened, and heard the eldest brother's wife with a man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The youngest brother entered with the torch, spoke with his mother, learned
    that the chief's son from the opposite village was present, and reported the eldest
    brother's death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: The youngest brother found a young man with abalone-shell earrings lying on
    the wife's arm, cut off the young man's head, and carried it away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: The woman awoke, found blood on her bed, dug a hole under the bed, buried
    the body, spread the bed again, and lay down.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:19
  text: The G'itg'inio'x missed their young chief, suspected the GispawaduwE'da, and
    the brothers had hung the enemy's head over their doorway.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:20
  text: The G'itg'inio'x sent a girl slave to the GispawaduwE'da under the pretext
    that their fire had gone out.
  category: action
  evidence_refs:
  - ev:7
