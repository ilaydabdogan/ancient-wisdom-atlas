scenes:
- id: scene:1
  label: Smallpox illness and red protective acts
  summary: During a smallpox epidemic, TsEgu'ksk tries to ward off disease with a
    red pole, learns from a shaman that he will not recover, and has red arrows shot
    toward the sun as blood flows from his face.
