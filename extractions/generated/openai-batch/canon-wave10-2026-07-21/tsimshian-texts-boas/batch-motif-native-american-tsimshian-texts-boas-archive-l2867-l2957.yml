  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tsimshian-texts-boas.md
  rights_note: Public domain source; summarized.
- id: ev:2
  type: summary
  locator: 2875-2883
  quote_or_summary: TsEgu'ksk makes a red-painted bow and four arrows, has them shot
    toward the sun, bleeds from his forehead and cheeks at each shot, says he will
    not remain dead, and circles the fire twice with his rattle following the sun's
    course.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tsimshian-texts-boas.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: 2883-2893
  quote_or_summary: TsEgu'ksk asks for a coffin box, crawls into it, dies, is bound
    with mountain-goat-skin ropes and placed on a boulder; on the fourth night he
    is heard in the box, has broken the thongs, sits on the box, and has assumed the
    shape of a white owl.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tsimshian-texts-boas.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: 2893-2903
  quote_or_summary: Four men try to catch the owl; it falls back into the box, the
    thongs are magically restored, the red staff rots and falls apart, the owl says
    nobody will be left, and the epidemic kills all the people.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tsimshian-texts-boas.md
  rights_note: Public domain source; summarized.
