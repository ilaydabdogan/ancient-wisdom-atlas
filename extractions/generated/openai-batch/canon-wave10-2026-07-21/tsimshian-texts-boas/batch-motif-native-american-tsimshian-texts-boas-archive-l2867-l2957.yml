canonical_text:
  quote: ''
  summary: The passage recounts a smallpox visitation in which TsEgu'ksk uses red-painted
    objects, sunward arrows, a rattle, fire-circling, death in a coffin box, owl transformation,
    and a fatal prophecy. It then describes Rotten-feathers using a magic feather
    to revive bones, alter mountains, cross a dangerous bridge, and escape Knife-hand
    by deception. A final summarized narrative tells of a child born from a dead woman,
    ascent through the heavens, theft of the sun box, the Raven figure Txā'msEm, conflict
    with ghosts and Logobola, and the division of fish between rivers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A smallpox epidemic visits the villages.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: TsEgu'ksk places a red-painted pole before his house to ward off disease,
    but becomes sick anyway.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A shaman tells TsEgu'ksk that he will not recover.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: TsEgu'ksk makes a red-painted bow and four red-painted arrows and has a friend
    shoot the arrows toward the sun.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The arrows do not return, and blood flows from TsEgu'ksk's forehead and cheeks
    whenever an arrow is shot.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: TsEgu'ksk says he will not remain dead, circles the fire twice with his rattle
    following the course of the sun, enters a coffin box, and dies.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: People bind TsEgu'ksk's coffin box with mountain-goat-skin ropes and place
    it on a large boulder behind the village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the fourth night, noise comes from the box; TsEgu'ksk has broken the thongs,
    sits on the box, and has taken the shape of a white owl.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: After four men try to catch the owl, it falls back into the box and the thongs
    are magically replaced.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The red staff before TsEgu'ksk's house falls apart and is seen to be rotten
    throughout.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Before falling back into the box, the owl says that nobody will be left; the
    epidemic continues and all the people die.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Rotten-feathers keeps a snapped feather after boys fall down, and many bones
    fall from heaven at the same time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Rotten-feathers moves the feather over the bones four times, and the bones
    become living people again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Little-grindstone eats berries by the Skeena River and is transformed into
    a mountain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Rotten-feathers moves his feather over an impassable mountain, causing the
    mountain to melt down.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: At a canyon, Great-goose warns that the bridge will break and that Chieftainess
    Knife-hand kills her daughter's suitors by cutting off their heads with her hands.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: Rotten-feathers crosses the bridge safely, enters Knife-hand's house, and
    lies down at night with the young woman.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:18
  text: Rotten-feathers hides his feather in his topknot, exchanges the appearance
    of his hair with the sleeping young woman's hair, and pretends to sleep.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: Knife-hand feels the sleepers' heads, mistakes her daughter for the stranger,
    and cuts off her daughter's head.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:20
  text: Rotten-feathers takes the dead woman's labret, receives the name Labret, and
    is carried back across the river by the feather.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:21
  text: A chief's wife pretends to be dead, is buried on a tree, is visited by her
    lover in the grave box, and both are killed by the chief.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:22
  text: The dead woman gives birth to a boy who lives by sucking his mother's intestines.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:23
  text: The boy and a friend put on bird skins and fly through a hole in the heavens.
  category: action
  evidence_refs:
  - ev:11
- id: obs:24
  text: The boy becomes a cedar leaf, drops into a well, and is swallowed by the daughter
    of the chief in heaven.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:25
  text: The heavenly chief's daughter gives birth to a boy who cries for the box containing
    the sun; the boy steals it and becomes Txā'msEm, the Raven.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:26
  text: Txā'msEm makes daylight after ghosts refuse him fish, driving the ghosts away.
  category: action
  evidence_refs:
  - ev:13
- id: obs:27
  text: Logobola causes fog by removing his hat and causes all fresh water to disappear.
  category: action
  evidence_refs:
  - ev:14
- id: obs:28
  text: Txā'msEm wins a shooting match against Logobola by ordering crows to move
