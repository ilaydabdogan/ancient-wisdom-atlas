  - ev:2
- id: scene:2
  label: Death, coffin box, and owl prophecy
  summary: TsEgu'ksk says he will not remain dead, circles the fire, dies in a coffin
    box, appears as a white owl on the fourth night, and proclaims that nobody will
    be left before the epidemic kills all the people.
  figure_refs:
  - fig:1
  - fig:4
  symbol_refs:
