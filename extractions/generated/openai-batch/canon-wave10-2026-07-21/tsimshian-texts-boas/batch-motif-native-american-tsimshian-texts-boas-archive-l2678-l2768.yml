canonical_text:
  quote: ''
  summary: The passage contains two narrative episodes. In the first, Asi-hwi'l is
    deserted by jealous sealion-hunting brothers on a rock, survives the rising tide,
    enters a hidden animal-person house, heals a sick sea-lion chief in exchange for
    an intestine canoe, returns to the mainland, and creates living killer whales
    from yew wood to break his enemies' canoes. In the second, the chief of the Grouses
    takes human form, elopes with a chief's daughter, fathers four Grouse children,
    and the children later cross the river to their maternal grandfather, who recognizes
    and invites their family to a feast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Asi-hwi'l went to the Tsimshian country, married a Tsimshian girl, and her
    brothers are described as sealion hunters.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: During winter gales, the brothers could not kill sealions; Asi-hwi'l accompanied
    them, jumped ashore at the sealions' rock with snowshoes and staff, and killed
    all the sealions.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The brothers became jealous, deserted Asi-hwi'l, and the tide began to rise
    around the rock.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Asi-hwi'l put his staff in a fissure, sat on it, tied his bow to the staff
    when the water rose higher, climbed onto the bow, and whistled a call taught by
    his father; afterward the tide stopped rising and the water fell.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A mouse came from under a bunch of grass, invited Asi-hwi'l in, disappeared
    beneath the grass, and then appeared in the shape of a woman near a house below.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: An old woman in the hidden house said that the rock was the house of the sealions,
    that their chief was very sick, and that shamans could not cure him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Asi-hwi'l found a bone harpoon in the sick chief's side and removed it after
    the chief agreed to give him the largest canoe, which was made of sealion intestines.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Asi-hwi'l was placed inside moistened sealion intestines, the bundle was tied
    and put into the sea, and the west wind was invoked to drift it to the mainland,
    where he came out on the beach.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: To take revenge, Asi-hwi'l carved killer whales first from red cedar and yellow
    cedar, which reverted to logs, and then from yew wood, which became real killer
    whales; he sent them to break the canoes of the men who had deserted him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A chief refused many suitors for his beautiful daughter; the chief of the
    Grouses flew down, took the shape of a man wearing a fox-skin blanket, secretly
    entered the house, lay with the girl, and persuaded her to elope with him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Grouse husband and the chief's daughter crossed the river to a town inhabited
    by Grouses; his father gave a feast, they stayed through winter, and she bore
    four children in summer.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The mother told the children about their grandfather across the river, including
    his large house, many steps, and pole; the young Grouses wanted to see him and
    crossed the river on the ice.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The young Grouses were initially driven back by village children throwing
    stones, but after repeated attempts the people agreed not to disturb them and
    they entered the old chief's house.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: An old man told the chief that the birds must be the children of his lost
    daughter because they knew his house; the chief then invited their father, mother,
    and people to a feast.
  category: speech
  evidence_refs:
  - ev:11
