candidate_motifs:
- id: motif:1
  label: Abandoned on an offshore rock and surviving the rising tide
  taxonomy_refs: []
  basis: Asi-hwi'l is deserted by jealous hunters on the sealion rock and survives
    by climbing onto his staff and bow while the tide rises and then falls.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage gives the sequence after the whistle call but does not explicitly
    explain the mechanism by which the tide stops rising.
- id: motif:2
  label: Hidden animal-person dwelling beneath an ordinary surface
  taxonomy_refs:
  - shapeshifter
  basis: A mouse emerges from grass, appears as a woman, and leads Asi-hwi'l into
    a house under the grass, where the rock is described as the house of the sealions.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage identifies animal-person inhabitants but does not describe
    the hidden house as a separate cosmological realm.
- id: motif:3
  label: Healing an animal chief in exchange for a special vessel
  taxonomy_refs:
  - sacred_exchange
  basis: Asi-hwi'l removes a bone harpoon from the sea-lion chief after the mouse
    states that he will heal the chief if he receives the intestine canoe as payment.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The exchange is explicit, but the passage does not call it sacred; the
    taxonomy reference is functional rather than lexical.
- id: motif:4
  label: Return across the sea inside a sealed organic vessel
  taxonomy_refs:
  - ark_vessel
  - return
  basis: Asi-hwi'l is placed inside tied, moistened sealion intestines and drifted
    to the mainland by the invoked west wind before emerging on the beach.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The vessel is not an ark in a flood narrative; the match is limited to
    protected water transport and return.
- id: motif:5
  label: Carved wooden animals become living helpers for revenge
  taxonomy_refs: []
  basis: Asi-hwi'l's yew-wood killer-whale carvings become real killer whales and
    break the canoes of the men who deserted him.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No supplied taxonomy family precisely names animation of carved figures.
- id: motif:6
  label: Shape-shifting bird husband and elopement with a chief's daughter
  taxonomy_refs:
  - shapeshifter
  basis: The chief of the Grouses flies down, assumes the shape of a man in a fox-skin
    blanket, and persuades the chief's daughter to elope to the Grouse town.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The daughter accepts and elopes in the passage, so this should not be
    treated as abduction without additional evidence.
- id: motif:7
  label: Children of a cross-species union return to maternal kin and are recognized
  taxonomy_refs:
  - return
  basis: The four young Grouses cross the river to the old chief's house and are recognized
    as the lost daughter's children because they know the house.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: The return is performed by the children, not by the missing daughter herself.
