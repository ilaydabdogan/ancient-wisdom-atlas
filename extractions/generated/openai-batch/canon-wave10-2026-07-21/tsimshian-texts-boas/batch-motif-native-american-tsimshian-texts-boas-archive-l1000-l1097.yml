canonical_text:
  quote: ''
  summary: The passage first concludes an escape in which a man retrieves his son
    from the Star's tribe, delays pursuers with objects, receives help from G-ix-sats'a'ntx-,
    and descends from the sky by a chain of arrows. It then tells of Pht'i't', where
    Heaven, annoyed by noisy children playing ball, sends feathers that lift the children
    and then the whole town to heaven, leaving only dogs. A menstruating girl and
    her grandmother survive apart from the village. The girl places found objects
    into her belly, gives birth to six strong children, and later her children again
    encounter Heaven's feathers. When the eldest and his siblings are pulled upward,
    Little-knife climbs up and cuts the feathers so the children fall back to the
    ground.
  language: English
  quote_policy: summarized
