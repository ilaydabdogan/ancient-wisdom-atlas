canonical_text:
  quote: The eagles reciprocated.
  summary: A prince first feeds many eagles with salmon and uses their feathers for
    arrows. In winter, after his father’s people move away and leave him with his
    grandmother and a small slave, the eagles repeatedly bring food from the beach
    and water, progressing from small fish to large sea mammals and whales. The narrator
    explicitly states that the eagles repay the prince’s earlier kindness.
  language: English
  quote_policy: quoted
