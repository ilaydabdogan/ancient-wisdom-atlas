canonical_text:
  quote: ''
  summary: A chief's son marries a girl who appears as an unclean little slave girl,
    but her scabs become abalone shells and she is identified as She-who-has-a-labret-on-one-side.
    A woman announces that her people will bring food and wealth; canoes arrive with
    boxes of foods, skins, and copper plates. Her mother is named Evening Sky, a supernatural
    unseen being, and her people are described as living far away on the other side
    with great wealth. The prince feasts guests, distributes wealth in potlatches,
    becomes a great chief, takes additional wives, and later trade episodes involve
    Chilkat elk skins and red paint exchanged for weasel skins.
  language: English
  quote_policy: summarized
