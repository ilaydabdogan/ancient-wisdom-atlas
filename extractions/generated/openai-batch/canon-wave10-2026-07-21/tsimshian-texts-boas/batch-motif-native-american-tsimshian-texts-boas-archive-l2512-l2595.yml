canonical_text:
  quote: ''
  summary: A heavenly chief equips boys and a healing sister with houses, ornaments,
    and a supernatural club, sends them down to earth, and their warfare destroys
    a town and many tribes until the abused club is forgotten. The passage then shifts
    to a famine story in which two sisters meet, share scarce food, and are aided
    by Ho'uX, a supernatural being called Good-luck, who provides fish and game.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief made bows and arrows for the boys, ordered them to fight among themselves,
    and they shot at one another while aiming at eyes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When an arrow struck one of the boys, the girl removed it, sucked the wound,
    and the wound closed at once.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the boys were grown, the chief made houses for them; the eldest brother's
    house had three doors, skull-ornamented doorways, and dark entrances.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The brothers possessed head ornaments, an abalone-inlaid bow, ermine-skin
    blankets, and a carved club said to overturn houses.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chief in heaven sent the children and their houses down to the place where
    the village of the G'ispawaduwE'da had stood, while their mother stayed in heaven.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The G'itg'inio'x heard noise and singing, saw fog, and in the morning saw
    four beautiful houses on the former town site.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The chief of the G'itg'inio'x ordered his people to cross the ice and fight
    the occupants of the houses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the fight, an arrow struck one brother's eye, and the sister sucked
    it out so the wound closed again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The eldest brother warned that if fighting continued he would turn over his
    club, bury the town, and trees would grow in its place.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The club was turned to make the town disappear underground, turned again to
    restore it, and turned once more so the town was buried and all the people died.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The brothers traveled widely, made war on tribes, and destroyed them by means
    of the club.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The chief in heaven became angry at the abuse of his gift and wished that
    the brothers would forget the club; they forgot it on an expedition against Gulg'e'u.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: After losing the supernatural club, the brothers settled at DEmlaxsI'm on
    the Skeena River, and their descendants became the named clan group in the passage.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage states that the clan's privilege of wearing abalone-shell head
    ornaments comes from gifts received in heaven.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: During starvation in two towns, two sisters met, cried, shared a few haw berries
    and a small piece of spawn, and the meeting place received a name.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The sisters made a branch hut, lit a fire, and lay down to sleep with the
    daughter of one sister.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: At midnight a man appeared, lay next to the younger unmarried sister, asked
    about starvation, and said he would make a fish weir.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: The man is named Ho'uX, translated as Good-luck, and is described as a supernatural
    being.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:19
  text: Ho'uX made a weir that filled with trout, then repeatedly hunted and brought
    porcupines, mountain goat, bear, and bighorn sheep, leaving the house full of
    meat and fish.
  category: sequence
  evidence_refs:
  - ev:10
