- id: obs:3
  text: When Txii'msEm tries to take food outside, unseen agents drag him back, tell
    him to sit down, and later beat him with sticks that move by themselves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Txii'msEm comes to the house of Deer and Deer's wife, calls Deer his brother-in-law,
    and proposes that they go cut wood.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: While wood is being split, the wedges keep jumping out; Txii'msEm tells Deer
    to hold them and come nearer while Txii'msEm strikes them with a hammer and sings
    because he is glad.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Txii'msEm chews alder bark, enters Smoke-hole's house intending to steal a
