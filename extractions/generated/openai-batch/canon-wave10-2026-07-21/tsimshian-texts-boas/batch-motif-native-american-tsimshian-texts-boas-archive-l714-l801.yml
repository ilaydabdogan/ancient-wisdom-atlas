canonical_text:
  quote: ''
  summary: 'The passage recounts several episodes involving Txii''msEm, called the
    Giant: he encounters self-moving food and unseen speakers in a house and is prevented
    from removing food; he approaches Deer during wood-splitting; he attempts to steal
    Smoke-hole''s abalone-decorated bow by becoming a raven but is trapped and escapes
    through deception; he eats seals, kills a beach-house owner, hunts more seals,
    and loses cooked seals to a personified stump; finally he builds a seaside house
    and prepares himself with coal, blanket, and dagger while saying he is sad.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dish, cranberry mixture, and spoon move to Txii'msEm by themselves, and
    no visible person holds the spoon.
  category: action
