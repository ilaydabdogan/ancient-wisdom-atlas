  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Smoke-hole commands his door and smoke hole to shut; Txii'msEm cannot leave,
    and the smoke hole catches his neck.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Txii'msEm puts his voice in the woods behind Smoke-hole's house so that it
