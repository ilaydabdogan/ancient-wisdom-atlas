  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Giant comes to a man's house near the beach, calls himself the man's friend,
    eats the seals in front of the house, and kills the man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Giant uses the dead man's canoe and harpoon, spears four seals, cooks
