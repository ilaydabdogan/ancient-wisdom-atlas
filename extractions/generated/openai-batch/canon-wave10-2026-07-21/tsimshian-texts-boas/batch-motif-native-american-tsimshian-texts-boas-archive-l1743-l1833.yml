canonical_text:
  quote: ''
  summary: During famine, a chief's people search for a presumed-dead princess, poor
    boy, and grandmother. They find the boy with abundant dried fish and sea-mammal
    fat; he feeds and gifts them, saving the people. He later gives a potlatch, receives
    the name Growing-up-like-one-who-has-a-grandmother, and wears chiefly regalia.
    Because his frog blanket becomes difficult to remove, he predicts he may remain
    in the sea and send food ashore for his children. He disappears into the sea,
    and his wife and children find halibut, seals, porpoise, sea lion, and whale sent
    from him. A new fragment begins with a chief's noble son who makes bows and arrows
    and feeds dried salmon to eagles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief believes his daughter, the poor little boy, and the grandmother are
    dead, while many of his people and children have died because there is no food.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A search party travels in four canoes and, before landing, sees grease on
    the surface of the water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The searchers find houses filled with dried salmon, trout, halibut, bullhead,
    and grease from seals, porpoises, sea lions, and whales.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy has caught four whales and much other food, feeds his uncle's people,
    and gives them dried fish and marine fats.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy's food gifts save the uncle's people, and the people say that the
    poor little boy should become their chief when grown.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boy regularly goes to sea to catch seals and tells his wife that it is
    very hard to take off the frog blanket.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy buys elk skins and slaves with dried fish and gives a potlatch, placing
    goods and slaves in the middle of the house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the potlatch, he wears the skin of a white bear and a great copper on his
    head, sings, and receives the name Growing-up-like-one-who-has-a-grandmother.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the naming, he gives away slaves and elk skins to his guests.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: He says that if he puts on the frog blanket again he may not be able to remove
    it, may not return ashore, and will stay in the sea while secretly putting food
    ashore for his children.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: He disappears, does not come ashore again, and is said to stay at the bottom
    of the sea.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: His wife and two children go crying to the beach and find sea foods, including
    halibut, seals, a porpoise, a sea lion, and later a whale.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The wife tells her father's people that the father of the children sent the
    whale and other sea animals because he could not get off his frog blanket and
    now lives in the sea.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: A new narrative begins with a large town ruled by a chief whose noble child
    does not eat but makes bows and arrows.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:15
  text: When salmon arrive and are dried, the prince places one salmon on the sand
    for an eagle, and more eagles come and eat.
  category: action
  evidence_refs:
  - ev:10
