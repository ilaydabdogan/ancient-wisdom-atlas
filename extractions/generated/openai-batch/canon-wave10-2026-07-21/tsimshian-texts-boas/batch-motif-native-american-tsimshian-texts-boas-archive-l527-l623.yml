canonical_text:
  quote: ''
  summary: 'The passage recounts several episodes involving Txii''msEm/Txa''msEm:
    conflict with Chief TEno''k"LEnx over an inlaid club; failed attempts to imitate
    food-producing or food-handling actions of Seal, Chief Ts''Enk''oa''ts, and Chief
    Salmon-berry-bird; the eating of fishermen''s bait, loss and recovery of a jaw
    caught on a hook; and a repeated encounter in which steel-head salmon strike his
    heart before he catches one.'
  language: English
  quote_policy: summarized
