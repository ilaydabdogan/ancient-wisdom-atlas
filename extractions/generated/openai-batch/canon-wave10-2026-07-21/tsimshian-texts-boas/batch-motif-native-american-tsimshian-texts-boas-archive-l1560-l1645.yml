canonical_text:
  quote: ''
  summary: A poor little boy, mocked by young men, receives a bow and arrows, transforms
    into a fly with help from a wasp, and kills a white bear before the others arrive.
    The young men falsely claim the kill, but the chief verifies the boy's arrow and
    is ashamed. The chief orders the village to move away, leaving the boy, the chief's
    daughter, and the boy's old grandmother. The boy later goes to a lake, summons
    a copper-clawed great frog that has charge of the lake, prepares a tree trap,
    kills and skins the frog, puts on its skin, and dives into the lake.
  language: English
  quote_policy: summarized
