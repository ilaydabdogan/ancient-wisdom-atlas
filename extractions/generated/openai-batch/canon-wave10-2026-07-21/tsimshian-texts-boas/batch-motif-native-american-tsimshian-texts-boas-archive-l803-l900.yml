canonical_text:
  quote: ''
  summary: A hungry Giant calls from shore; Little Porpoise helps the salmon chief
    understand the call, and the fish come ashore so the Giant can take and eat them.
    The Giant later makes a raven-skin blanket and is deceived by what appears to
    be a dancing blanket but is only leaves. A separate etiological note says Elderberry
    Bush gave birth before Stone, causing people to die quickly. Another tale describes
    reciprocal visits and dangerous games between Porcupine and Beaver, contrasting
    Beaver's water environment with Porcupine's land and ice setting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Giant is sad because he is hungry and has no food, and he runs out of
    the house after resolving what to do.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The water contains ripples and many aquatic animals, including salmon, halibut,
    bullheads, and porpoises.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Giant cries out from shore; the chief among the salmon cannot hear him
    clearly and calls Little Porpoise to listen.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Little Porpoise goes ashore and enables the salmon chief to understand that
    the Giant is telling the salmon to swim together.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: The salmon go ashore together; halibut are left dry on the beach, and the
    Giant clubs, carries, dries, and eats the fish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Giant is naked and ashamed, kills many ravens with a root, fastens their
    skins together, and wears them as a blanket.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Giant sees what seems to be a dancing blanket, destroys his raven blanket
    to take it, but finds only old withered leaves and repairs the raven blanket from
    shreds.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Elderberry Bush gives birth to her children before Stone gives birth, and
    the passage states that this is why people die quickly.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Porcupine and Beaver are friends; Beaver repeatedly invites Porcupine to his
    house in the middle of a great lake, but Porcupine cannot swim and fears the water.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Beaver's feast, the food is sticks, and Porcupine is troubled but eats
    them.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Beaver proposes a game in which he will carry Porcupine on his back and come
    up four times; Porcupine fears he will die but agrees.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Beaver dives after striking the water with his tail; Porcupine receives splashed
    water, stays underwater a long time, becomes nearly dead, and is returned to shore.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Porcupine returns to his people, tells them Beaver almost killed him, and
    his people advise him to invite Beaver and play with him in turn.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Porcupine serves Beaver tree bark and spruce needles; Beaver is afraid to
    eat them but does so after Porcupine urges him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Porcupine names a tree on a grassy slope as his playing ground, sings before
    sleeping, speaks to the sky, and the sky clears; in the morning the ground is
    covered with ice.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: On a frozen, slippery place on the mountain, Beaver struggles because his
    feet slip, while Porcupine crosses with his long claws and leads Beaver across
    by the hand before telling him to climb a tree.
  category: action
  evidence_refs:
  - ev:9
