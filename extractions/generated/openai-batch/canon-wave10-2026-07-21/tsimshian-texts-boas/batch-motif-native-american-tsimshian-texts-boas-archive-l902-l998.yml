canonical_text:
  quote: ''
  summary: 'The passage contains three episodes: Porcupine survives a fall from a
    tree and urges Beaver to imitate him; Wolves use a laughing exchange at a feast
    to make Deer reveal their toothless mouths, then devour them; a boy addresses
    a Star, is taken to the sky, and his grieving father begins a rescue journey by
    learning from advisers, making an arrow ascent to the sky, testing wooden child-likenesses
    over fire, and exchanging tobacco, red paint, and sling-stones for help.'
  language: English
  quote_policy: summarized
