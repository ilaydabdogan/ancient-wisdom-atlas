- id: obs:15
  text: At TsEgu'ksk"’s command, the whale carries away Lgo-yi'yuk when she comes
    to the river for water, and later takes women who come to fetch water.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:16
  text: TsEgu'ksk" sends the otter club to kill people across the river; everyone
    is killed except one man who is away hunting.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: Haida attackers kill TsEgu'ksk" and his companions and cut off the heads of
    the slain as trophies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: TsEgu'ksk"’s severed head rolls overboard, swims back to the body, rejoins
    the trunk, and he rises healthy.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: After people sew up TsEgu'ksk"’s stomach, he is alive and well after four
