candidate_motifs:
- id: motif:1
  label: Animal in-laws and reciprocal feast-gift exchange
  taxonomy_refs:
  - sacred_exchange
  basis: The chief’s bird son-in-law and the Grouses receive a feast, provide fat
    and a large pole, and receive presents and another feast in return.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage presents affinal and ceremonial exchange literally; the broader
    meaning of the exchange is not explained in the supplied text.
- id: motif:2
  label: Animated carved or shaped objects acting as living agents
  taxonomy_refs:
  - shapeshifter
  basis: A carved squirrel becomes alive; a box assumes killer-whale shape; an otter-shaped
    club swims and acts independently.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The objects animate or take animal form, but the passage does not give
    a general doctrine of shapeshifting.
- id: motif:3
  label: Journey to an underwater chief and return with powerful gifts
  taxonomy_refs:
  - hero_descent
  - mystical_quest
  basis: TsEgu'ksk" disappears from the plank, is taken to the house of a chief at
    the bottom of the sea, and returns suddenly with objects that break the frozen
    river ice.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The destination is underwater rather than an underworld of the dead; no
    afterlife interpretation is stated.
- id: motif:4
  label: Water-source abduction by a supernatural whale helper
  taxonomy_refs:
  - stolen_beloved
  basis: TsEgu'ksk" commands the whale-shaped helper to seize the hostile shaman’s
    daughter when she comes to the river, and later to take women fetching water.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: low
  cautions: The taxonomy label is only approximate because the abducted figure is
    identified as an enemy’s daughter, not explicitly as a beloved.
- id: motif:5
  label: Reconstitution and revival after bodily dismemberment
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: TsEgu'ksk" revives when his severed head swims back and rejoins his trunk;
    another episode states he is alive and well four days after his stomach is sewn.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The text describes revival events but does not explain their ritual or
    cosmological cause.
- id: motif:6
  label: Body part as origin of natural sound
  taxonomy_refs: []
  basis: TsEgu'ksk"’s intestines sink to the river bottom and are said to cause the
    noise of the rapids.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is an etiological reading directly supported by the passage, but
    no taxonomy reference is available among the supplied motif families.
- id: motif:7
  label: Bird rescue from drowning and return over water
  taxonomy_refs:
  - return
  basis: Gulls rescue TsEgu'ksk" when his canoe capsizes and carry him on their backs
    up the river to his village.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage presents rescue and transport home, but does not frame it
    as a full return cycle.
