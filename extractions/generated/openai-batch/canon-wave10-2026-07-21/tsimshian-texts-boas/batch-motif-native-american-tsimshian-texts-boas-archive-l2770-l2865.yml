canonical_text:
  quote: ''
  summary: A group of Grouses visits a chief’s house, receives a feast, helps through
    an affinal request, returns with fat and a large fat-covered pole, and exchanges
    gifts before departing with the chief’s daughter and her children. The passage
    then recounts TsEgu'ksk", a shaman who survives an attack by an animated squirrel,
    journeys to the house of an underwater chief, receives magical objects, uses them
    to cut ice, abduct a hostile shaman’s daughter, and kill enemies. Later TsEgu'ksk"
    is killed by Haida raiders but revives when his severed head rejoins his body;
    another episode connects his intestines with the sound of river rapids. In a final
    episode, gulls rescue him from drowning and carry him home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Innumerable Grouses cross over in the morning, making the ice black with birds,
    and the chief’s daughter is among them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Grouses enter the chief’s house, filling the floor and also sitting on
    posts and beams.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chief feasts the birds with dry salmon and berries and asks his son-in-law
    to stay and help split wood because he is old.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The chief’s daughter repeats the chief’s speech to her husband, who answers
    with bird-like sounds; she then says the birds will split wood the following morning.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The son-in-law and all the birds leave through the smoke-hole and later return
    through it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Each returning bird throws fat into the fire, causing it to blaze high.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The birds bring a long fat-covered pole described as as high as a mountain;
    the chief of the birds gives it to his father-in-law, who divides it among his
    tribe.
  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: The chief and his people give presents and a feast to the chief of the Grouses,
    after which the birds leave with the chief’s daughter and her children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: A shaman in Lax-anLoE owns a rattle and a carved squirrel that becomes alive
    after dark.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: The shaman sends the squirrel across the river to kill enemies; most are killed,
    but TsEgu'ksk" and a few other men survive.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: TsEgu'ksk" lies on a red-painted plank under a cedar-bark mat while companions
    burn meat, tallow, and berries in a fire on the plank; the plank, fire, and TsEgu'ksk"
    disappear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: TsEgu'ksk" is said to have been taken to the house of G'itk'staqL, a chief
    who lives at the bottom of the sea.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:13
  text: G'itk'staqL gives TsEgu'ksk" a land-otter-shaped club, a small box with a
    whale-fin-shaped lid, and a wooden chamber-pot, explaining that the gift will
    break the frozen river ice.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: The otter-shaped club and then the box, which assumes killer-whale shape,
    move through water or over ice and cut the ice.
  category: action
  evidence_refs:
