canonical_text:
  quote: ''
  summary: Txa'msEm, also called the Giant, carries off the great water, flees in
    darkness, and reaches the Nass/Xass River, explaining present water movement and
    the river's size. He obtains olachen from a gull, later deceives or induces keepers
    at a chief's house or Supernatural place to release olachen into the river, and
    roasts them. Gulls eat his olachen, and he throws the gulls into the fireplace,
    explaining their black wing tips. Other episodes include his wearing a deer skin
    with pitch wood on the tail, eating a chieftainess's provisions, wasting salmon,
    and becoming ugly-headed.
  language: English
  quote_policy: summarized
