canonical_text:
  quote: ''
  summary: The passage opens with source notes on Tsimshian texts collected by Boas,
    then begins a myth in which a chieftainess feigns death to meet her lover in a
    burial box placed in a tree. After discovery, the lover and chieftainess are killed;
    her child emerges alive from her corpse, grows in the box, is caught by the chief's
    nephews, and is named Sucking-intestines. In the next episode, Sucking-intestines
    hears of a chief's daughter beyond the place where the heavens meet, puts on a
    bird skin to fly, gains a woodpecker-skin companion, travels upward through towns,
    and reaches the hole in the sky during a time of darkness.
  language: English
  quote_policy: summarized
