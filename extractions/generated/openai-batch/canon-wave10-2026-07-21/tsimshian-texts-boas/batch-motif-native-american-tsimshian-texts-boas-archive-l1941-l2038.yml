canonical_text:
  quote: ''
  summary: An abandoned prince, supplied by eagles, has houses full of food and grease
    on the water. Wearing a gull skin, he drops seal meat into a canoe so his father's
    people learn of him. A search party discovers his abundance but is told to keep
    silent. Hidden seal meat later exposes the truth when a slave's child chokes on
    it. The father's people return; the prince resists them because they deserted
    him, but eventually feeds his parents and the people. He marries only the younger
    of two daughters brought by an uncle, receives wealth, gives potlatches after
    his parents die, and becomes the great chief named Little-eagle.
  language: English
  quote_policy: summarized
