canonical_text:
  quote: ''
  summary: The passage first describes She-who-has-a-labret-on-one-side leaving her
    prince husband, purifying an awkward brother-in-law in four creek holes, marrying
    him, and his elevation through a potlatch into a great chief. It then begins a
    hunting narrative in which brothers climb a mountain toward a grizzly bear's den;
    two are killed, while the remaining awkward brother survives, marries the Grizzly
    Bear, and returns with her to his human family.
  language: English
  quote_policy: summarized
