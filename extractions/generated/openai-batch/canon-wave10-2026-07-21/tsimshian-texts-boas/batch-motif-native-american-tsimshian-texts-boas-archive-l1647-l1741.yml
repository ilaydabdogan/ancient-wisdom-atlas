canonical_text:
  quote: ''
  summary: A poor boy secretly uses the skin of a great frog to travel underwater,
    catch trout and salmon, and leave them by the house while ravens cry on the beach.
    The princess eventually observes and questions him; he explains that after being
    deserted and left without food he killed and skinned the frog, put on its skin,
    and became clean and great. She marries him, and later he catches animals and
    whales with his hands, leaving whale grease and bones along the shore.
  language: English
  quote_policy: summarized
