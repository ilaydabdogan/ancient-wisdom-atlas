canonical_text:
  quote: ''
  summary: The passage recounts episodes involving a great Grizzly Bear married to
    a human man, her provisioning of berries and salmon, her anger and killings after
    insult, and her departure. It then shifts to children who kill squirrels near
    a large spruce tree; a boy or prince meets the chief of the squirrels, is instructed
    to burn squirrel remains, and is made a shaman named Squirrel through ritual.
    The passage ends with a skeleton found in the spruce, recovered, laid out, painted
    red, covered with bird down, and followed by sacrifice.
  language: English
  quote_policy: summarized
