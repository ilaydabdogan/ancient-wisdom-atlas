canonical_text:
  quote: ''
  summary: A young slave discovers the severed head of her young chief and warns her
    people. The G'itg'inio'x attack the G'ispawadiiwE'da, killing the town and burning
    it, while Wa'g'ixs and her daughter Sqawo survive in hiding holes. Wa'g'ixs sings
    and rejects animal suitors for Sqawo until a thunder-associated man from heaven
    arrives, demonstrates power with a club, marries Sqawo, and attempts to carry
    both women upward. Wa'g'ixs twice opens her eyes during the noisy flight through
    the clouds and is left in a tree, explaining why trees moan in wind. Sqawo reaches
    heaven with her husband and later bears named children after conceptions associated
    with sun rays.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young slave is repeatedly sent across the frozen river to ask for fire;
    after a drop of blood falls on her foot, she sees the young chief's head with
    large ear ornaments hanging over the door and runs home crying that she saw her
    master's head.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the young slave's report, the G'itg'inio'x put on armor and go out to
    make war on the G'ispawadiiwE'da.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wa'g'ixs, wife of the eldest brother, prepares one hiding hole under her bed
    for herself and another for her daughter Sqawo.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wa'g'ixs and Sqawo hide while the G'itg'inio'x kill the G'ispawadiiwE'da and
    set fire to the town; after the ashes cool, they emerge and find no one else alive.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wa'g'ixs goes to the end of the town near the water, sits down, and sings.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Rabbit, owl, other animals, and bear come as suitors for Sqawo; Wa'g'ixs asks
    each what he can do and rejects them as insufficient.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The grizzly bear demonstrates power by tearing out two bullrush roots, coloring
    them with red alder-bark juice so that they look like bloody heads, and bringing
    them to Wa'g'ixs, who still sends him away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After Wa'g'ixs sings again, thunder sounds, a man appears, asks to marry Sqawo,
    and demonstrates a club that turns the ground and makes trees grow, burying Wa'g'ixs
    and Sqawo underground and then bringing them up again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The thunder-associated man says he saw the killing of Wa'g'ixs's friends and
    the destruction of her village and therefore came to marry her daughter.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The man carries Wa'g'ixs under one arm and Sqawo under the other and attempts
    to fly upward to heaven, warning them not to open their eyes during the noisy
    passage through the clouds.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Wa'g'ixs opens her eyes during the ascent twice; each time they fall back,
    and after the second failure the man says he cannot take her up.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The man places Wa'g'ixs into a hole made by tearing off a tree branch, replaces
    the branch, and says she shall cry whenever the wind moves the tree; the passage
    states this is why trees moan in wind.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The man flies up with Sqawo as his wife, enters his house in heaven, sleeps
    apart from her, and she conceives after rays of the sun fall through a chink upon
    her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Sqawo gives birth in heaven to sons named Hislegiyo'ontk", Ax-fEm-hwilhwi'lg'it,
    and Le-g'a'auiExsk", and then to daughters named KsEmmamil'm and KsEui-gwadziq-t'e'lix'.
  category: sequence
  evidence_refs:
  - ev:7
