canonical_text:
  quote: ''
  summary: The passage describes the great unborn Self as Brahman, ruler and protector,
    unaffected by good or evil works, sought through Veda, sacrifice, gifts, penance,
    fasting, and renunciation. It states that knowers transcend desires for sons,
    wealth, and worlds, and are not overcome by evil. Yajnavalkya teaches Janaka,
    who offers him the Videhas and himself. The text then narrates Yajnavalkya preparing
    to leave household life for the forest and teaching Maitreyi that wealth does
    not bring immortality, while all beloved relations and goods are dear for the
    sake of the Self.
  language: English
  quote_policy: summarized
