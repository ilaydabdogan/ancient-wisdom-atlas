canonical_text:
  quote: ''
  summary: In the Fourth Question, Sauryaya#in Gargya asks about sleep, waking, dreams,
    happiness, and dependence. The respondent explains that the senses are gathered
    into the mind during sleep, compares the vital breaths to sacrificial fires within
    the body, identifies roles in an internal sacrifice, describes dream and dreamless
    sleep, and says that all rests in the Highest Atman as birds roost in a tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sauryaya#in Gargya asks what sleeps and what remains awake in a person, what
    power sees dreams, whose happiness it is, and on what all these depend.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The respondent says that as the sun’s rays are gathered into its disc at setting
    and come forth at rising, so the senses are gathered into the mind in sleep.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: During sleep the person does not hear, see, smell, taste, touch, speak, take,
    enjoy, evacuate, or move about.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The vital breaths are described as awake in the body, which is called a town.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Apana is identified with the Garhapatya fire, Vyana with the Anvaharyapacana
    fire, and Prana with the Ahavaniya fire.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Samana is said to carry equally the two oblations, out-breathing and in-breathing;
    the mind is the sacrificer; Udana is the reward of sacrifice and leads the sacrificer
    daily to Brahman in deep sleep.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In sleep the mind or god re-experiences what has been seen, heard, and enjoyed,
    and is said to see all.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: When the mind or god is overpowered by light, it sees no dreams, and happiness
    arises in the body.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: All this is said to rest in the Highest Atman, compared to birds going to
    a tree to roost.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage begins a list of what rests in the Highest Atman, including earth,
    water, light, air, ether, and their subtle elements.
  category: object
  evidence_refs:
  - ev:9
