literal_observations:
- id: obs:1
  text: A Brahmana who knows the teaching is said to be a dangerous enemy; if he curses
    someone, that person departs from the world without strength and without good
    works.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the wife is seized by monthly illness, she is instructed for three days
    not to drink from a metal vessel, to wear a fresh dress, and not to be touched
    by a Sudra man or woman; after bathing at the end of the three days, she is to
    pound rice.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Different preparations of boiled rice with butter are prescribed for different
    desired children: with milk for a white son knowing one Veda, with coagulated
    milk for a reddish tawny-eyed son knowing two Vedas, with water for a dark red-eyed
    son knowing three Vedas, with sesamum for a learned daughter, and with bull meat
    for a famous learned son knowing all the Vedas.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Toward morning, after preparation according to the Sthalipaka rule, the husband
    sacrifices portions with formulas to Agni, Anumati, and the divine Savitri.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the sacrifice, the husband eats the remaining rice, gives it to his
    wife, washes his hands, fills a water jar, and sprinkles her three times while
    addressing Visvavasu.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The husband embraces the wife and recites paired identifications: he is Ama
    or breath and she is Sa or speech; he is the Saman and she is the Rik; he is sky
    and she is earth; the stated aim is begetting a male child.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Sanskrit formulas invoke Vishnu, Tvashtar, Prajapati, Dhatar, Sinivali,
    an addressee named or described as Prithushthuka in the transliteration, and the
    Ashvins in connection with arranging the womb, forming the shape, and placing
    or bearing the embryo.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A woman in labor is sprinkled with water, and the accompanying formula compares
    the movement of the embryo to wind moving a lotus-pond and asks Indra to bring
    forth the child together with the afterbirth.
  category: action
  evidence_refs:
  - ev:7
