    including false ascetics, performers of prohibited sacrifices, deceptive mendicants,
    actors, malignant speakers, and arguers who entice believers in the Veda.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A quoted saying states that the world is unsettled by denial of Self, false
    comparisons, and arguments, and does not know the difference between Veda and
    philosophy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Brzhaspati, having become Sukra, is said to have brought forth false knowledge
