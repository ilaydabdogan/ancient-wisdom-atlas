  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that what is taught and said in the Vedas is true, that
    the wise stand on it, and that a Brahman should not read what is not of the Veda.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Veda is described as the supreme light of the ether within the heart,
