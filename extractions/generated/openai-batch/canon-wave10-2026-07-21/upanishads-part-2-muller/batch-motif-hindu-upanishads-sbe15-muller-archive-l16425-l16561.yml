canonical_text:
  quote: ''
  summary: The passage warns a king against impediments to knowledge, especially false
    teachers and arguments opposed to the Veda. It recounts Brzhaspati becoming Sukra
    and producing false knowledge for Indra's safety and the Asuras' destruction,
    contrasts false knowledge with knowledge, and presents gods and demons seeking
    the Self from Brahman/Prajapati. It then describes the Veda as a supreme inner
    light in the heart, associated with fire, sun, breath, and Om, using images of
    smoke, salt in water, ghee, magic, and lightning. It concludes with Indra in the
    right eye, his wife in the left eye, and their union in the heart cavity.
  language: English
  quote_policy: summarized
