canonical_text:
  quote: ''
  summary: In a dialogue from the Katha-Upanishad, Na/^iketas insists that Death answer
    the subtle question about dying and the Hereafter. Death offers alternative boons
    including descendants, wealth, long life, rulership, maidens, chariots, music,
    dance, and song. Na/^iketas rejects these transient pleasures and asks instead
    about the hidden world. Death then distinguishes the good from the pleasant, praises
    Na/^iketas for not taking the road to wealth, contrasts wisdom with ignorance,
    and warns that those deluded by wealth and denial of another world fall under
    Death's sway.
  language: English
  quote_policy: summarized
