canonical_text:
  quote: ''
  summary: The passage describes an ancient inverted tree identified with the Bright,
    Brahman, and the Immortal; the world and cosmic powers tremble or act from Brahman's
    terror; understanding before bodily dissolution prevents taking body again; Brahman
    or the Person is known through inner faculties rather than sight; and Yoga is
    the firm stilling of the senses, mind, and intellect.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An ancient tree has roots growing upward and branches growing downward; it
    is called the Bright, Brahman, and the Immortal, and all worlds are contained
    in it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The whole world, after going forth from Brahman, trembles in Brahman's breath;
    Brahman is compared to a great terror like a drawn sword, and those who know it
    become immortal.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fire burns, the sun burns, and Indra, Vayu, and Death run away from terror
    of Brahman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person who does not understand before the body falls asunder has to take
    body again in the worlds of creation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Brahman is described as seen clearly in the body as in a mirror, as in a dream
    in the world of the Fathers, as in water in the world of the Gandharvas, and as
    in light and shade in the world of Brahma.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The senses are distinct from the Atman, and their rising and setting belong
    to them; a wise man who understands this grieves no more.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'A hierarchy is stated: beyond the senses is the mind, beyond the mind the
    highest created Being, beyond that the Great Self, beyond the Great the highest
    Undeveloped, and beyond the Undeveloped the all-pervading, imperceptible Person.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Person's form is not seen with the eye, but is imagined by heart, wisdom,
    and mind; those who know this are immortal.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the five instruments of knowledge stand still with the mind and the intellect
    does not move, that is called the highest state; the firm holding back of the
    senses is called Yoga.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: An editorial note explains the tree as a fig-tree whose downward branches
    strike root and form new stems, so that one tree grows into a complete forest.
  category: object
  evidence_refs:
  - ev:9
