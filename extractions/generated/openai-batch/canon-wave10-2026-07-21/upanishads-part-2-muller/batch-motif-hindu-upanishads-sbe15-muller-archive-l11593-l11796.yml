canonical_text:
  quote: ''
  summary: The passage gives numbered chains of transmission in repeated 'from' formulas.
    One chain runs through named human teachers to Ambhina from Aditya, the Sun, and
    states that pure Yajus verses, coming from Aditya, were proclaimed by Yajnavalkya
    Vajasaneya. A second lineage variant runs through named teachers to Prajapati,
    then to Brahman, and ends by identifying Brahman as self-existent and offering
    adoration to Brahman. Editorial notes discuss textual variants and compare the
    final paragraph with a similar passage in the Satapatha-brahmana.
  language: English
