canonical_text:
  quote: "“The point of his heart becomes lighted up, and by that light the Self departs”"
  summary: 'Yajnavalkya describes the person returning from dream to waking, then
    turns to the process of death: the embodied Self weakens, senses and vital powers
    gather around the Self, the Self enters the heart, sensory functions cease, the
    heart-point is lit, and the Self departs through bodily openings with life and
    vital spirits following. Knowledge, work, and prior acquaintance accompany the
    departing Self. The passage uses analogies of a heavy carriage, fruit falling
    from a stalk, royal attendants, a caterpillar moving to another blade of grass,
    and a goldsmith reshaping gold to explain death and transition to another body
    or life.'
  language: English
  quote_policy: quoted
