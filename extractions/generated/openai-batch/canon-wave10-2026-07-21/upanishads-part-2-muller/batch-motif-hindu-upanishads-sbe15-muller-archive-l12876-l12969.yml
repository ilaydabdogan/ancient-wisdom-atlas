canonical_text:
  quote: ''
  summary: The opening of the Fifth Adhyaya describes the imperishable Highest Brahman
    as the place where knowledge and ignorance are hidden. A distinct controlling
    one governs both, rules all germs and forms, bears a wise fiery son in thought,
    spreads and gathers nets in a field, creates lords, rules all, shines by comparison
    with the sun’s car, causes the universal germ and natures to ripen, and is connected
    with a Brahma-germ hidden in the Upanishads and Vedas, known by Brahma.
  language: English
  quote_policy: summarized
