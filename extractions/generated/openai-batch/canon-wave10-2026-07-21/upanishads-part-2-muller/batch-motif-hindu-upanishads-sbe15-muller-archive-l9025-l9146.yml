canonical_text:
  quote: ''
  summary: The passage contains notes and a translated dialogue in which Vaideha asks
    Yajnavalkya to continue speaking for emancipation. Yajnavalkya describes a person
    moving between dreaming and waking, compares that movement to a fish moving between
    two riverbanks, and compares entry into a desireless dreamless state to a falcon
    returning to its nest. The passage then describes the true form as desireless,
    fearless, embraced by the intelligent Self, untouched by good and evil, and beyond
    ordinary distinctions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker rejects the claim that sleep or dream is the same as waking, saying
    the senses have stopped and that dream-vision requires only the light inherent
    in the Self.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In dream, the person enjoys himself, moves about, sees good and evil, and
    returns to the waking place without being followed or affected by what was seen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In waking, the person likewise enjoys himself, moves about, sees good and
    evil, and returns to the sleeping or dreaming state.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage compares the person’s movement between sleeping and waking to
    a large fish moving along the right and left banks of a river.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage compares the person’s movement into a state without desires or
    dreams to a falcon or swift bird that roams in the air, becomes tired, folds its
    wings, and is carried to its nest.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: The body is described as containing Hita veins, as small as a hair divided
    a thousandfold and full of white, blue, yellow, green, and red.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Dream dangers are described as fancied experiences, including being killed,
    overcome, chased by an elephant, or falling into a well.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The person may fancy being a god or king, or say “I am this altogether”; the
    passage calls this his highest world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The true form is described as free from desires, evil, and fear; when embraced
