canonical_text:
  quote: ''
  summary: The passage continues the Madhu teaching by naming the moon, lightning,
    thunder, ether, law, the true, mankind, and the Self as mutually “honey” with
    all beings, and by identifying the corresponding immortal person with the Self,
    the Immortal, Brahman, and the All. It then describes the Self as lord and king
    of all beings, using a wheel image for containment. It recounts Dadhyanc Atharvana
    proclaiming this honey-teaching to the two Asvins through a horse’s head, cites
    verses about the episode, and interprets the Lord/Atman as maker, indweller, and
    multiform presence in bodies. The passage ends by beginning a lineage list of
    transmission.
  language: English
  quote_policy: summarized
