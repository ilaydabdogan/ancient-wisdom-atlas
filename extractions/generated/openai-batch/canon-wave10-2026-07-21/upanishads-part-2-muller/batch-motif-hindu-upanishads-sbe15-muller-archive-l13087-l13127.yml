canonical_text:
  quote: ''
  summary: At the opening of the Sixth Adhyaya, the passage contrasts deluded explanations
    that name Nature or Time as the cause of everything with the claim that God's
    greatness turns the Brahma-wheel. Creation unfolds at the command of a knower
    described as the time of time, and is named as earth, water, fire, air, and ether.
    The same figure completes the work, rests, brings together self and matter with
    qualities and time, orders works endowed with the three qualities, destroys the
    work when these are absent, and remains different from what has been produced.
    A translator's note warns that verses 3-4 are extremely obscure.
  language: English
  quote_policy: summarized
