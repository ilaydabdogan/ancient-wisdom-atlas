canonical_text:
  quote: ''
  summary: The passage says that one who knows Brahman's bliss, beyond the reach of
    speech and mind, fears nothing and is freed from distress about good and bad acts.
    It then presents Bhrigu Varuni asking his father Varuna to teach Brahman. Varuna
    defines Brahman as that from which beings are born, by which they live, and into
    which they enter at death, and directs Bhrigu to know through penance. Bhrigu
    repeatedly performs penance and successively perceives food, breath, mind, understanding,
    and bliss as Brahman. Later sections give rules concerning food, reciprocal relations
    among breath and body, water and light, earth and ether, and hospitality to a
    stranger through food-giving.
  language: English
  quote_policy: summarized
