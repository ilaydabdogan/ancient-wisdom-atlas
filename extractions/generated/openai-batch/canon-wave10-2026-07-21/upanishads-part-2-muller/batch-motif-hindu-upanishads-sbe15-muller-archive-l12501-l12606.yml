canonical_text:
  quote: ''
  summary: The passage describes an indwelling reality perceived in the heart and
    known by mind, whose knowers become immortal. It identifies the purusha or Self
    as all-encompassing, extending beyond the earth, lord of immortality, ruler and
    refuge, present everywhere yet separate from the senses. It also speaks of an
    embodied spirit as a bird within a nine-gated town, and of the Self as both smaller
    than small and greater than great, hidden in the heart, ancient, omnipresent,
    and eternal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says an indwelling reality is always in the heart of man, is perceived
    by heart, thought, and mind, and that those who know it become immortal.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The person or purusha is described as having a thousand heads, a thousand
    eyes, and a thousand feet, compassing the earth on every side, and extending beyond
    it by ten fingers' breadth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The purusha is said to be all that has been and will be, lord of immortality,
    and whatever grows by food.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage attributes hands, feet, eyes, head, and ears everywhere to this
    being and says it encompasses all in the worlds.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The being is described as separate from all senses while reflecting the qualities
    of all senses, and as lord, ruler, and great refuge of all.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: An embodied spirit within a town with nine gates is called the bird, flutters
    outward, and is called ruler of the whole world, including what rests and what
    moves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage describes a being that grasps without hands, hastens without feet,
    sees without eyes, hears without ears, knows what can be known, and is not known
    by anyone.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Self is described as smaller than small, greater than great, and hidden
    in the heart of the creature; a man who has left grief behind sees the majesty
    and the Lord by the grace of the creator.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The speaker says he knows the undecaying ancient one, the self of all things,
    infinite and omnipresent; the passage says all birth is stopped in him and that
    Brahma-students proclaim him eternal.
  category: speech
  evidence_refs:
  - ev:7
