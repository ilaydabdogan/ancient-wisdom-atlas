canonical_text:
  quote: ''
  summary: The passage describes food as the origin, sustenance, and final return
    of earthly creatures; then presents successive inner Selves consisting of breath,
    mind, understanding, and bliss, each in human form with named parts. It states
    that knowing or worshipping these principles as Brahman grants food, full life,
    fearlessness, freedom from evils, and attained wishes. A pupil asks about the
    postmortem destination of the knower and non-knower. The answer gives a cosmogonic
    account in which Brahman wills to become many, broods, creates all, enters creation,
    and becomes manifest and unmanifest reality. A following verse says that existence
    is born from prior non-existence, that the Self-made is flavour, and that bliss
    enables breathing.
  language: English
  quote_policy: summarized
