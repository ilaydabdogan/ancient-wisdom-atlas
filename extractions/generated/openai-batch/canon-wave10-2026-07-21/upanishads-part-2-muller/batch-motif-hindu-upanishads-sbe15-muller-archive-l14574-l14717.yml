canonical_text:
  quote: ''
  summary: The passage lists traits arising from passion, says the elemental Self
    is overcome by them and assumes many forms, then presents the Valakhilyas asking
    Prajapati Kratu how the elemental Self can leave bodily identity and unite with
    the true Self. Kratu describes the bound and deluded condition of the elemental
    Self through similes of water, fetters, prison, Yama, intoxication, possession,
    serpent-bite, magic, dream, actor, and painted wall. He gives a remedy of Vedic
    knowledge, proper duty, ascetic penance, meditation on Om, and knowledge of Brahman,
    leading to imperishable bliss and union with the Self.
  language: English
  quote_policy: summarized
