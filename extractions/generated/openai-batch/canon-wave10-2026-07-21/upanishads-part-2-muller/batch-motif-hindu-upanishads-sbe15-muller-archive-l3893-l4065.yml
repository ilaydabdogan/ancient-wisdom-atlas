canonical_text:
  quote: ''
  summary: The passage presents correspondences among sacred utterances, Vedic recitations,
    breaths, food, Brahman, cosmic regions, gods, bodily elements, and the syllable
    Om. It describes a golden immortal Person in the heart and a ritualized ascent
    through Agni, Vayu, Aditya, and Brahman by uttering Bhu, Bhuvas, Suvas, and Mahas.
    It lists duties joined with learning and practising the Veda, gives a short self-identifying
    teaching attributed to Trisanku using tree, mountain, light, and immortality imagery,
    and records a teacher's ethical instructions to a pupil after Vedic instruction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhu, Bhuvas, Suvas, and Mahas are arranged as four sacred interjections and
    correlated with classes of Vedic verses, breaths, food, and Brahman; the one who
    knows them is said to know Brahman and to receive offerings from all Devas.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage locates an ether within the heart and says that within it is a
    Person consisting of mind, immortal and golden.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A bodily route is described from the uvula and the root of the hair, where
    the two sides of the head are opened; with successive utterances the figure enters
    Agni, Vayu, Aditya, and Brahman.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: After entering Brahman, the figure obtains lordship and becomes lord of mind,
    speech, sight, hearing, and knowledge; Brahman is described as having ether as
    body, truth as nature, and as peaceful and immortal.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage gives fivefold groupings of material and bodily realities, including
    earth, sky, heaven, quarters, intermediate quarters; Agni, Vayu, Aditya, moon,
    stars; water, herbs, trees, ether, universal Self; breaths, senses, and body elements.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Om is identified with Brahman and with all this, and is presented as preceding
    speech, Saman-singing, hymn-recitation, priestly responses and orders, Agnihotra
    performance, and the beginning of a lecture.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A list of necessities joins right, truth, penance, restraint, tranquillity,
    consecrated fires, Agnihotra, hospitality, duty, children, marriage, and descendants
    with learning and practising the Veda; named authorities emphasize truth, penance,
    or Vedic learning and practice.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The teaching attributed to Trisanku is in the first person and uses images
    of shaking a tree, glory like a mountain top, high-risen pure light, treasure,
    wisdom, immortality, and imperishability.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: After teaching the Veda, the teacher instructs the pupil to speak truth, do
    duty, continue Vedic study, give the teacher his reward, maintain the line of
    children, and not swerve from truth or duty.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The teacher tells the pupil not to neglect sacrificial works due to gods and
