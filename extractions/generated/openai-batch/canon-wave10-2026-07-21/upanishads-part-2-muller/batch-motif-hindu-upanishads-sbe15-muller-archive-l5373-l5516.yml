canonical_text:
  quote: ''
  summary: The passage describes Brahman or the Self producing fire, gods, social
    powers, and Law; differentiating the undeveloped world by name and form; entering
    beings as their hidden Self; and being known through Self-knowledge. It also presents
    Soma as food and Agni as eater, treats gods as manifestations of Brahman, and
    states that those who know their identity with Brahman become all this, while
    gods are displeased by such knowledge.
  language: English
  quote_policy: summarized
