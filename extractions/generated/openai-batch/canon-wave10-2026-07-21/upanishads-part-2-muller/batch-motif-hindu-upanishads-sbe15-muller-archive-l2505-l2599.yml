  quote: ''
  summary: Yama and Na/^iketas discuss the Self as difficult to teach and comprehend.
    Na/^iketas rejects transient treasures and seeks imperishable teaching. Yama describes
    meditative recognition of the hidden Ancient Self, identifies Om as the word recorded
    by the Vedas and as Brahman, and says the knowing Self is unborn and deathless.
  language: English
  quote_policy: summarized
