canonical_text:
  quote: ''
  summary: The passage contrasts sacrificial works and their limited rewards with
    higher knowledge of Brahman. Proper fire offerings and related sacrifices can
    carry the sacrificer by sun-rays to a heavenly Brahma-world, but these works are
    described as frail and impermanent, leading eventually back to old age, death,
    and rebirth. Those practicing penance, faith, tranquility, and alms in the forest
    depart through the sun to the immortal Person. A Brahmana, after examining the
    worlds won by works, is instructed to approach a learned Guru with fuel in hand
    to receive knowledge of Brahman.
  language: English
  quote_policy: summarized
