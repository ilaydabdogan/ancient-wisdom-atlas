canonical_text:
  quote: "“As the flowing rivers disappear in the sea, losing their name and their
    form...”"
  summary: The passage describes renunciant knowers of Vedanta attaining freedom and
    immortality at death, the dissolution of personal parts and faculties into elements
    and deities, and the wise person’s loss of name and form like rivers entering
    the sea. It states that knowing highest Brahman makes one Brahman and frees one
    from grief, evil, and the fetters of the heart. It also restricts teaching the
    science of Brahman to ritually and scripturally qualified recipients, recalls
    Angiras as a former teacher of the true science, and ends with adoration to the
    highest Rishis.
  language: English
  quote_policy: quoted
