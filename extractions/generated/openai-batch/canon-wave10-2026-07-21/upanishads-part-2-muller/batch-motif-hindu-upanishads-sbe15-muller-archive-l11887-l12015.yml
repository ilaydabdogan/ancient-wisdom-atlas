canonical_text:
  quote: ''
  summary: The passage gives Upanishadic verses and commentary using images of a manifold
    cord, a cosmic wheel, and a river with fivefold features. It describes a bird
    or self moving in the Brahma-wheel until blessed by the Lord, and states that
    knowledge of Brahman or the god frees the living self from fetters, birth, and
    bondage. It also lists paired principles such as perishable and imperishable,
    knowing and not-knowing, and identifies Pradhana and Hara.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentary explains a one though manifold cord as love or desire, and
    identifies three paths as righteousness, unrighteousness, and knowledge; deception
    is described as ignorance of self arising from good or bad works.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentary describes a wheel-like scheme with a felly, sixteen items,
    fifty spokes, twenty counter-spokes, and six ogdoads.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The river in verse 5 has water made of five streams, five springs, waves called
    five vital breaths, a fountain head called mind, a course of five perceptions,
    five whirlpools, rapids called five pains, fifty kinds of suffering, and five
    branches.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The note to verse 5 maps the river’s components to organs, elements, mind,
    sense objects, and pains, and says the river, like the wheel, is meant for Brahman
    as cause and effect in the phenomenal world.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the vast Brahma-wheel, all things live and rest, and a bird flutters as
    long as he thinks the self in him is different from the mover.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the bird or self is blessed by the mover or Lord, he gains immortality.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The Highest Brahman is called a safe imperishable support, and Brahma-students
    who know what is within the world are described as devoted, merged in Brahman,
    and free from birth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Lord supports the perishable and imperishable, the developed and undeveloped;
    the living self is bound because it enjoys the fruits of works, but is freed from
    all fetters when it knows the god.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage lists two unborn beings, one knowing and one not-knowing, one
    strong and one weak; it also mentions an unborn she through whom each man receives
    recompense for works, and an infinite Self appearing under all forms but inactive.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage identifies the perishable with Pradhana and the immortal imperishable
    with Hara.
  category: relationship
  evidence_refs:
  - ev:8
