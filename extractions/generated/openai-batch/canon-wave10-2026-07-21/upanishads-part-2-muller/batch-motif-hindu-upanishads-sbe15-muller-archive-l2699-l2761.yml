canonical_text:
  quote: ''
  summary: The passage contrasts an undisciplined person, whose senses are like unmanageable
    horses, with a person of understanding whose mind and senses are controlled. It
    teaches that the unmindful enter the round of births, while the mindful reach
    a place from which they are not born again, described as the end of the journey
    and the highest place of Vish^m. It then gives a hierarchy beyond the senses,
    describes the hidden Self as visible to subtle seers, urges disciplined inward
    restraint and awakening, compares the path to the Self to the difficult edge of
    a razor, and says perception of the unchangeable reality frees one from the jaws
    of death. It closes by praising the hearing or repetition of the ancient story
    of Na/§iketas told by Death and of the greatest mystery in ritual or learned settings.
  language: English
  quote_policy: summarized
