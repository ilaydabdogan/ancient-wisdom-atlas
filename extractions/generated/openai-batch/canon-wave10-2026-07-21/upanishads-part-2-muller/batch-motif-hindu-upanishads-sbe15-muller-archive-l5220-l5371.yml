canonical_text:
  quote: ''
  summary: The passage gives ritual teachings about the Saman, its relation to tone,
    speech, breath, and sacrificial singing; introduces an ascension recitation that
    asks to be led from unreality, darkness, and death to reality, light, and immortality;
    and then presents a cosmogonic teaching in which the primordial Self, alone as
    a person, becomes aware of itself, overcomes fear, divides into husband and wife,
    generates humans, assumes paired animal forms, and identifies itself with creation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Brahmadatta Aaikitaneya, while taking Soma, swears that Ayasya Angirasa did
    not sing a different Udgitha, but sang it as speech and breath.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Saman's property and gold are identified with tone, and its support is
    identified with speech, with some saying the support is in food.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the Prastotr begins to sing the Saman, the sacrificer is instructed to
    recite three Yajus-verses associated with the Abhyaroha, described as an ascension.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The recitation asks to be led from unreal to real, darkness to light, and
    death to immortality, and the explanations equate the negative terms with death
    and the positive terms with immortality.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: During the other Stotras, the sacrificer may ask for a boon, and a knowledgeable
    Udgatr priest is said to obtain desired things for himself or for the sacrificer
    by singing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The knowledge of this Saman is called the conqueror of the worlds, and one
    who knows it has no fear of not being admitted to the worlds.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the beginning, the Self alone existed in the shape of a person, saw only
    itself, said 'This is I,' and is associated with burning down evils.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The solitary Self feared, then reasoned that there was nothing else to fear,
    and the passage states that fear arises only from a second.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Self felt no delight while alone, wished for a second, split itself into
    husband and wife, embraced the wife, and men were born.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The wife thought she should hide after being produced from the Self; she and
    the other then became paired animals, and the births of cows, one-hoofed animals,
    goats, sheep, and paired creatures down to ants are described.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Self knows itself as the creation because it created all this, and the
    passage says that one who knows this lives in this creation.
  category: speech
  evidence_refs:
  - ev:10
