canonical_text:
  quote: ''
  summary: The passage discusses an Upanishadic reference to Hiranyagarbha being born
    from Rudra/Brahman and the adjective kapila applied to him. It explains how Indian
    literary traditions often trace knowledge lineages back to Brahman or Svayambhu
    through divine and ancient transmitters, then examines later identifications of
    Kapila with the founder or teacher of Sāṃkhya, a Vishnu/Vasudeva-related figure,
    or an avatara associated with the sons of Sagara.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage cites an earlier statement that Rudra, described as creator and
    supporter of the gods, gave birth to Hiranyagarbha, and another statement that
    Hiranyagarbha was seen being born.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The adjective kapila, glossed as reddish or fiery, is applied to Hiranyagarbha
    and is said to have produced divergent interpretations.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that branches of knowledge were commonly traced back to Brahman
    or Brahman Svayambhu and then through Prajapati, deities, and ancient family ancestors.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The beginning of the Mundaka Upanishad is summarized as a teacher lineage
    from Brahman to Atharvan, Atharvan to Angir, Angir to Satyavaha Bharadvaja, Bharadvaja
    to Angiras, and Angiras to Saunaka.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Manu is described as called both Hairanyagarbha and Svayambhuva, as descended
    from Svayambhu or Hiranyagarbha.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage presents it as natural for a philosophical system such as Sāṃkhya
    to be assigned to Hiranyagarbha or Brahman Svayambhu, and says that Kapila is
    represented as handing knowledge to Asuri, and Asuri to Pañcasikha.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says that later readers used the occurrence of the word Kapila
    to support the primordial existence of Kapila as founder of Sāṃkhya, but the author
    states that he sees no evidence for a real historical Kapila in this context.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Śaṅkara is described as first explaining kapila as a golden or kapila-colored
    Hiranyagarbha, then quoting verses that represent Kapila as a Paramarshi, a portion
    of Vishnu, a destroyer of error in the Krita Yuga, and a teacher of Sāṃkhya.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Vijñānātman is described as explaining the verse without reference to Kapila
    the Sāṃkhya teacher, while Śaṅkarānanda is described as rejecting that identification
    but also mentioning Kapila as an avatara of Vasudeva and burner of the sons of
    Sagara.
  category: speech
  evidence_refs:
  - ev:7
