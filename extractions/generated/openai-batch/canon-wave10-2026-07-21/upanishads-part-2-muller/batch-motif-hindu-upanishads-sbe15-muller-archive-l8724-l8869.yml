canonical_text:
  quote: ''
  summary: 'The passage describes the Taijasa/Atman in relation to food, heart-channels,
    breaths, directions, negating description, and fearlessness. It then introduces
    a dialogue in which Yajnavalkya comes to Janaka Vaideha; because of an earlier
    boon, Janaka may ask questions freely. Janaka asks what the light of man is, and
    Yajnavalkya answers successively: sun, moon, and fire.'
  language: English
  quote_policy: summarized
