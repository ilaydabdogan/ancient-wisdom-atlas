  summary: The passage presents a philosophical account in which Pradhana, the organs,
    vital airs, food, Agni, Soma, the sun, time, the year, Prajapati, Vishnu, and
    Brahman are related through consumption, knowledge, seasonal time, and dissolution
    into the Self.
