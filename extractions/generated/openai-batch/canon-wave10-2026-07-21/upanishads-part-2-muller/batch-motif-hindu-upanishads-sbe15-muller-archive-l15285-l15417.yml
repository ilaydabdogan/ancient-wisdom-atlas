literal_observations:
- id: obs:1
  text: Manifest and unmanifest nature are described as food, while the enjoyer is
    described as without qualities but possessing intelligence by virtue of enjoying.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Intellect, perceptive organs, active organs, and vital airs are described
    as functioning for tasting their corresponding objects or effects.
  category: action
  evidence_refs:
  - ev:1
