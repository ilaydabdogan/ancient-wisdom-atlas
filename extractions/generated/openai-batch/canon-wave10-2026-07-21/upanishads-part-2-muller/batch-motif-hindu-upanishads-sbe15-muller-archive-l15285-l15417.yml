  text: Agni is called the food-eater among the gods, and Soma is called the food.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: One who knows the teaching is called an ascetic, a yogin, and a performer
    of the Self-sacrifice; sensory restraint is illustrated by not touching intruding
    objects of sense.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Food is called the highest form of Self, and the body or vital principle is
    said to depend on food for perception and vital airs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Creatures on earth are said to be born from food, live on food, and return
    to food at the end.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Creatures seek food day and night; the sun takes food with rays, vital airs
    digest food, fire flares by food, and Brahma or Prajapati made all this while
    desirous of food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Food is called the body of Vishnu Visvabhrit; breath is the essence of food,
    mind of breath, knowledge of mind, and joy of knowledge.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Food is described as caused by time, time by the sun, and the year as a twelve-month
    form divided into solar movements and divine halves.
  category: sequence
  evidence_refs:
  - ev:5
