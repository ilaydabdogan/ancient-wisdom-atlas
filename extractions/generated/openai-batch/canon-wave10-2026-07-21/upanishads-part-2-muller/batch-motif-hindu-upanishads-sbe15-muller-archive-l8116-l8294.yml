canonical_text:
  quote: "“As a mighty tree in the forest, so in truth is man”"
  summary: A dialogue presents chains of dependence linking sacrifice, gifts, faith,
    directional deities, water, seed, initiation, truth, fire, speech, heart, and
    breaths. Yājñavalkya describes the Self by negation and imperishability, challenges
    Śākalya to explain a person beyond the listed supports, and Śākalya’s failure
    is followed by his head falling. Yājñavalkya then challenges the assembled Brahmanas,
    who remain silent, and begins a simile comparing man to a forest tree.
  language: English
  quote_policy: quoted
