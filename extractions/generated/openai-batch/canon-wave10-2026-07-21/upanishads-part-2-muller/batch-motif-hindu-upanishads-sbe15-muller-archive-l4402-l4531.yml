canonical_text:
  quote: "“He who is this (Brahman) in man, and he who is that (Brahman) in the sun,
    both are one.”"
  summary: The passage states that Brahman in the human person and Brahman in the
    sun are one. It says that one who knows this, after departing this world, reaches
    and comprehends the Self described through food, breath, mind, understanding,
    and bliss. The accompanying notes discuss a graded scale of bliss among human
    and divine beings and compare related hierarchies in other Sanskrit sources and,
    cautiously, Buddhist cosmography.
