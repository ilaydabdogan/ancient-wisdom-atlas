canonical_text:
  quote: ''
  summary: 'A teaching describes the subtle Self or Purusha as indwelling, intelligent,
    and the driver of the body. In response to a question, Prajapati is said to have
    created unintelligent creatures, entered them like air, and divided himself into
    five vital breaths. The passage identifies inner heat with Purusha and Agni Vaisvanara,
    the fire that digests food within a person. It then presents the body through
    a chariot image: the senses are reins, active organs are horses, the body is the
    chariot, the mind is the charioteer, and temperament is the whip.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Self, called Purusha, is described as very small, invisible, incomprehensible,
    and dwelling here in part.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The intelligent part reflected in a person is called Prajapati and Visva;
    it knows the body, makes the body intelligent, and is described as the body’s
    driver.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Questioners ask how a desireless being that is the driver made the body intelligent.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Prajapati is said to have stood alone in the beginning, lacked happiness when
    alone, meditated on himself, and created many creatures.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Prajapati saw that the creatures were without understanding, compared to a
    stone and a lifeless post, and decided to enter them so that they might awake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Prajapati made himself like air, entered within the creatures, and, because
    being one was not sufficient, divided himself fivefold.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The fivefold divisions are named Prana, Apana, Samana, Udana, and Vyana, each
    associated with a bodily movement or function.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Upaṃśu vessel and Antaryama vessel are used in an analogy with prana and
    apana, and heat is said to be produced between them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The heat between the breaths is identified as Purusha and as Agni Vaisvanara.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Agni Vaisvanara is described as the fire within a person by which eaten food
    is cooked or digested; a sound associated with it is not heard by a person departing
    this life.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: After dividing himself fivefold, the being is described as hidden in a secret
    place, assuming the nature of mind, having the pranas as his body, and being free
    like ether.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: From within the interior of the heart, the indwelling being thinks that he
    will enjoy objects, opens five apertures of the senses, and enjoys objects through
    five reins.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The perceptive organs are called reins, the active organs horses, the body
    a chariot, the mind the charioteer, and temperament the whip.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Driven by the whip, the body goes around like a wheel driven by a potter;
    the body is again said to be made intelligent and to have the indwelling driver.
  category: sequence
  evidence_refs:
  - ev:9
