canonical_text:
  quote: He who is the person in the sun, I am he.
  summary: The passage gives invocations to Aditya, Brahman, and Pushan, asks for
    the golden covering of the true Brahman to be opened, identifies the speaker with
    the person in the sun, describes Brahman as solar light and immortality, presents
    images of rays, a swan, an ocean of light, lamps, and the world egg, and explains
    sacrificial offerings and Om as channels linking fire, sun, rain, food, breath,
    offspring, and divine worlds.
  language: English
  quote_policy: quoted
