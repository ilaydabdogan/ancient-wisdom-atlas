canonical_text:
  quote: ''
  summary: The passage describes an inner channel from the heart to the eye; a sequence
    in which mind, bodily fire, and breath produce sound that becomes alphabetic utterance,
    with commentary relating this to Om, letters, and Veda; the result of seeing this
    as freedom from death, disease, and misery and becoming all; four conditions of
    the Self, with the fourth greater; Brahman distributed as one foot in three states
    and three feet in the last; and the Great Self appearing to become two so that
    true and untrue have their desert.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A channel is said to go from the heart to the eye and to be an artery that
    is one while divided into two.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentary says the light of Brahman is below the body's sphere of fire,
    becomes manifest when the fire is heated and fanned by sonant breath, first as
    Om, then as articulate letters, and finally as the Veda, while remaining itself.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mind excites the body's fire, the fire stirs the breath, and the breath
    moving in the chest produces a low sound.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sound is described as brought forth by the touch of fire as with a churning-stick,
    developing through minim, double minim, and treble minim, and becoming the alphabet
    when uttered.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The one who sees this does not see death, disease, or misery; seeing all,
    he becomes all everywhere.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Four conditions are listed: the person in the eye, one who walks as in sleep,
    one who is sound asleep, and one above the sleeper; the fourth is said to be greater
    than all.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Brahman with one foot moves in the three, and Brahman with three feet is in
