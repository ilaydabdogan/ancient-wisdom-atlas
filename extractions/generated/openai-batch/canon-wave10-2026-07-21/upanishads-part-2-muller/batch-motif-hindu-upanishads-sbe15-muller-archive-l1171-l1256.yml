canonical_text:
  quote: ''
  summary: 'Scholarly introduction to the 5vetaj-vatara-upanishad: it is described
    as belonging to the Taittiriya or Black Yajurveda tradition, as a secret teaching
    transmitted by 5vetaj-vatara to hermits and restricted to a son or regular pupil,
    as a highly ranked Upanishad, and as difficult to date. The passage also discusses
    animal-color meanings in personal names and warns against inferring Christian
    influence from the name. It closes with a general claim that Upanishads share
    a stock of ideas and expressions while having independent local growth across
    settlements.'
  language: English
  quote_policy: summarized
