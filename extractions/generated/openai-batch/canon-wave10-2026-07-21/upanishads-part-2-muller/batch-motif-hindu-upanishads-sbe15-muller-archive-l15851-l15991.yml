canonical_text:
  quote: "“he binds his Self by his Self, as a bird with a net”"
  summary: The passage teaches that desire, imagination, belief, doubt, fear, and
    related states are mind, and that a person bound by will and belief becomes enslaved
    while one free from them reaches liberty. It describes stillness of the senses,
    mind, and intellect as the highest state, a path or door to Brahman, and an ascent
    through the Northern Path and solar door. It also describes rays from the Self
    in the heart, upward and downward routes, the Self as controller and source of
    the senses, worlds, Vedas, gods, and beings, and a sacrificial mapping of fire,
    year, seasons, earth, sky, Vayu, and Prana.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Desire, imagination, doubt, belief, unbelief, certainty, uncertainty, shame,
    thought, and fear are described as mind, and the person is said to bind the Self
    by the Self like a bird with a net.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person possessed of will, imagination, and belief is called a slave, while
    the opposite person is called free.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Standing free from will, imagination, and belief is described as the sign
    of liberty, the path to Brahman, the opening of the door, and the way to the other
    shore of darkness.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The highest state is described as the condition in which the five instruments
    of knowledge stand still with the mind and the intellect does not move.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: After speaking, Sakayanya becomes absorbed in thought, and Marut, identified
    in a note as King Brihadratha, bows before him, worships him, and departs contentedly
    to the Northern Path.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Northern Path is called the path to Brahman, said to have no side-road,
    and Marut is said to burst open the solar door, rise on high, and go away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Self dwelling in the heart is described as having endless rays of different
    colors, and one ray, the Sushumna, leads upward by piercing the solar orb.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Other upward rays lead a worshipper to mansions belonging to the different
    bodies of gods, while dim downward rays lead a man helplessly onward to enjoy
    the fruits of his actions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Aditya, the sun, is described as the cause of new births for those who do
    not worship him, heaven for those who worship him as a god, and liberty for those
    who worship him as Brahman.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In a question-and-answer passage, the Self is said to send out or hold back
    the organs of sense; the Apsaras and solar rays are also mentioned in connection
    with the senses.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Self is said to devour objects by the five rays, identified with the organs
    of sense.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Signs of the Self are compared to the heat of fire, the purest taste of water,
    shoots as signs of seed, and smoke, light, and sparks as signs of fire.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Pranas and related powers are said to proceed from the Self again and again
    like sparks from fire and rays from the sun.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: All Pranas, worlds, Vedas, gods, beings, and named classes of sacred or explanatory
