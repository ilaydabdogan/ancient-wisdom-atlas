  summary: A dialogue between Sakalya and Yajnavalkya lists a series of persons or
    self-principles, each associated with a dwelling, sight, light or mind, and a
    devata. Yajnavalkya then challenges Sakalya and claims knowledge of the quarters,
    their deities, and their abodes, beginning with the eastern quarter and the southern
    quarter.
