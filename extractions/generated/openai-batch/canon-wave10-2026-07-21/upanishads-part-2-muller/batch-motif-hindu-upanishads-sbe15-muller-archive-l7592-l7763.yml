canonical_text:
  quote: ''
  summary: The passage concludes a teaching on the immortal inner Self as the unseen
    ruler within faculties and seed. Gargi Vacaknavi challenges Yajnavalkya before
    an assembly with two questions, framed by a warrior-bow image. She asks in what
    the all-encompassing cosmos is woven; Yajnavalkya answers first that it is woven
    in ether, then that ether is woven in the imperishable Akshara/Brahman. He describes
    this imperishable through negations and says cosmic bodies, time, rivers, social
    praise, gods, ancestors, and ritual relations stand or move by its command. He
    distinguishes ritual acts performed without knowledge from departure with knowledge
    of the Akshara. Gargi concedes that Yajnavalkya cannot be defeated in argument
    concerning Brahman. A new question by Vidagdha Sakalya begins concerning the number
    of gods.
  language: English
  quote_policy: summarized
