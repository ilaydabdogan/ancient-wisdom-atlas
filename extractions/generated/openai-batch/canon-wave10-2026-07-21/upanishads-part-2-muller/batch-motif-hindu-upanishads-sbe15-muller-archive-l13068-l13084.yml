    the term “kalasargakaram” through several glosses: creator of the sixteen kalas,
    creator by means of inherent power, or creator of the Vedas and other sciences.
    The note also lists the sixteen kalas and connects them with an Atharvaṇika/Praśna
    Upanishad reference as printed in the passage.'
