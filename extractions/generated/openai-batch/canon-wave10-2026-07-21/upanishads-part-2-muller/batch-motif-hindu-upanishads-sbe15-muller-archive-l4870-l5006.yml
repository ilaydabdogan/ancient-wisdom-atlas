canonical_text:
  quote: ''
  summary: The passage explains ritual and cosmogonic meanings attached to the horse
    sacrifice. It describes sacrificial libation vessels around the horse, then presents
    Death or Hunger as the primordial being from whom water, earth, fire, cosmic divisions,
    the year, speech, Vedic forms, sacrifices, humans, and animals arise. Death becomes
    an all-eater, performs austerity for a greater sacrifice, becomes the sacrificial
    horse, and is identified with the sun, year, sacrificial fire, worlds, and the
    deity Death. The end begins a new section on Devas and Asuras seeking ritual victory
    through the udgitha.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two sacrificial libation vessels are placed before and behind the horse; the
    former is gold, the latter silver, they are called Mahiman, and their place is
    called their yoni.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: All is said to have been concealed by Death, identified with hunger; Death
    desires a body, moves about worshipping, and water is produced from him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The froth of the water hardens and becomes earth; Death rests on the earth,
    becomes heated, and Agni proceeds from him full of light.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The being divides threefold, with Aditya and Vayu named among the thirds;
    a body is mapped onto directions and worlds, and it stands firm in water.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Death desires a second body, embraces Speech in his mind, and the seed becomes
    the year; Speech bears it for a year and sends it forth, and the newborn cry becomes
    speech.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Death chooses not to kill the newborn and brings forth Vedic texts, metres,
    sacrifices, men, and animals by speech and by the year-body; he then resolves
    to eat whatever he brought forth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Death desires a greater sacrifice, toils, and performs penance; glorious power,
    glossed as the senses, goes out of him, and the body swells while mind remains
    in it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The swollen body becomes a horse fit for sacrifice; the horse is set free
    and offered after a year, while other animals are given to the deities.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The shining sun is identified with the Asvamedha sacrifice, the body with
    the year, Agni with the sacrificial fire, and the worlds with bodies; the sacrificial
    fire and horse sacrifice are said to be one deity, Death.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: A knower of this teaching is said to overcome another death; death does not
    reach him, death is his Self, and he becomes one of those deities.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Devas and Asuras are described as two kinds of descendants of Prajapati; the
    Devas are younger, the Asuras elder, and the Devas seek to overcome the Asuras
    at sacrifices by means of the udgitha.
  category: sequence
  evidence_refs:
  - ev:10
