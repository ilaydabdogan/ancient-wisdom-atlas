canonical_text:
  quote: ''
  summary: A ritual sequence centers on offerings of ghee into fire and remnants placed
    in the Mantha, followed by praises of the Mantha, eating it with Savitri and honey
    verses, sun worship, teacher-pupil transmission of the Mantha-doctrine, a claim
    that the Mantha could make a dry stick grow branches and leaves, restrictions
    on teaching it, preparation details using Udumbara wood and seeds, and a brief
    generative passage in which essences culminate in man and seed before Prajapati
    creates a woman as an abode.
  language: English
  quote_policy: summarized
