canonical_text:
  quote: ''
  summary: 'Yama grants that Naḳiketas'' father will be reconciled and peaceful. Naḳiketas
    describes the heaven-world as free from fear, old age, hunger, thirst, and sorrow,
    and asks Death to teach the fire-sacrifice that leads there. Yama teaches the
    rite, including the altar bricks and their arrangement; Naḳiketas repeats it correctly,
    and Yama names the rite after him and gives him a many-coloured chain. The passage
    states that performance and knowledge of the Naḳiketa fires overcome birth and
    death and lead to peace and heavenly rejoicing. Naḳiketas then asks his third
    boon: instruction about whether a dead person continues to be or not.'
  language: English
  quote_policy: summarized
