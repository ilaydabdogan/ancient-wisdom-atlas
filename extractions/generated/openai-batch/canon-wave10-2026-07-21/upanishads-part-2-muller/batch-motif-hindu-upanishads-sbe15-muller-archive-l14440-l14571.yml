canonical_text:
  quote: ''
  summary: The passage contrasts a pure Self that only seems to be an agent or enjoyer
    with an elemental Self that is overcome by action-fruits, qualities, bodily elements,
    and paired opposites. In dialogue, the Valakhilyas ask Prajapati Kratu about this
    other self, and he explains it through body-elements, rebirth, inner agency, and
    several analogies including a water drop, a netted bird, iron pervaded by fire,
    and a wheel moved by a potter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Self is described as seeming to have desires, seeming to be overcome by
    bright or dark fruits of action, and wandering in every body while remaining free,
    unmanifest, invisible, unattached, unchanging, pure, stable, and a spectator.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Self is said to conceal himself in the cloak of the three qualities and
    to appear as an enjoyer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Valakhilyas ask Prajapati Kratu about another being also called Self who
    is really overcome by bright and dark fruits of action and enters good or bad
    birth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Prajapati Kratu identifies this other one as the elemental Self, says its
    course is downward or upward, and says it roams while overcome by pairs.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sound, touch, form, taste, smell, and the gross elements are called Bhuta;
    their aggregate is called body, and the one said to dwell in the body is called
    Bhutatma, the elemental Self.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The immortal Self is compared to a drop of water on a lotus leaf, while the
    elemental Self is said to be overcome by the qualities of nature.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: When overcome, the elemental Self becomes bewildered, does not see the creator
    and holy Lord within itself, and is carried along by waves of the qualities.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The elemental Self enters the beliefs expressed as “I am he” and “this is
    mine,” binds its Self by its Self like a bird with a net, and enters good and
    bad birth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A distinction is made between the elemental Self, which acts, and the inner
    man, who causes action by means of the organs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A ball of iron pervaded by fire and hammered by smiths is used as an analogy
    for the elemental Self pervaded by the inner man and hammered by the qualities
    becoming manifold.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Four tribes, fourteen worlds, and many beings are described as manifold and
    as impelled by man as a wheel is impelled by a potter.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The body is described as produced from marriage, growing in darkness, coming
    forth by the urinary passage, built up with bones, covered with flesh and skin,
    and filled with impurities.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Bewilderment, fear, grief, sleep, sloth, carelessness, decay, sorrow, hunger,
    thirst, wrath, ignorance, envy, cruelty, folly, pride, and other states are listed
    as results of the quality of darkness.
  category: attribute
  evidence_refs:
  - ev:7
