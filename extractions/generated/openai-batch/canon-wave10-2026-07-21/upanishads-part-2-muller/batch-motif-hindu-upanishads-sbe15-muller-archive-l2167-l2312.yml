canonical_text:
  quote: ''
  summary: Vagasravasa performs a sacrifice and gives away his possessions, including
    worn-out cows. His young son Nachiketas questions the worth of such gifts and
    repeatedly asks to whom he will be given; the angered father says he will give
    him to Death. Nachiketas reflects on mortality, enters Yama's abode, and remains
    without hospitality for three nights. Yama returns, acknowledges the neglected
    Brahmana guest, grants three boons, and Nachiketas asks first for reconciliation
    with his father.
  language: English
