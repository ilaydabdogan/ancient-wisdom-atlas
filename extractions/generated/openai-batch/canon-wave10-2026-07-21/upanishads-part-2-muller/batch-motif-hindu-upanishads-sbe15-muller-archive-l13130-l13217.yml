canonical_text:
  quote: He is beyond all the forms of the tree (of the world) and of time...
  summary: The passage presents a figure identified in the verse and commentaries
    as the Lord, Brahman, or Highest Self. He is described as the beginning, the source
    of causes that unite soul and body, above the three kinds of time, without parts,
    many-formed, worshipped, and dwelling in the mind. Another verse says he is beyond
    the world-tree and time, and that the world moves round from him. Commentarial
    material interprets the passage through yoga, renunciation of works, destruction
    or cessation of karmic effects, freedom from saṃsāra, and knowledge or union of
    the self with Brahman or the Highest Self.
  language: English
