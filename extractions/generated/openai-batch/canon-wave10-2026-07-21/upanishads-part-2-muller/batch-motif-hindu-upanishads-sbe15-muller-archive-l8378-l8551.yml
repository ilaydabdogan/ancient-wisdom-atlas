canonical_text:
  quote: ''
  summary: At Janaka Vaideha’s audience, Yajnavalkya arrives and is asked whether
    he seeks cattle or subtle questions. Janaka reports previous teachings identifying
    speech, life, sight, and then hearing with Brahman. For speech, life, and sight,
    Yajnavalkya says the prior teaching is incomplete, supplies each faculty’s body,
    resting-place, and mode of worship, and declares each to be the Highest Brahman
    for one who knows it. Janaka repeatedly offers a thousand cows with a great bull,
    while Yajnavalkya says he should not accept payment before fully instructing a
    pupil.
  language: English
  quote_policy: summarized
