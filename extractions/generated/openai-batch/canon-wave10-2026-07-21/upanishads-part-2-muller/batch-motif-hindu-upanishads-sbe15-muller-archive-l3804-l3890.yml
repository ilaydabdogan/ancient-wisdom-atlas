canonical_text:
  quote: Thou (Om) art the shrine (of Brahman), covered by wisdom. Guard what I have
    learnt.
  summary: The passage teaches several sacred unions or correspondences, then presents
    prayers and oblation formulas for wisdom, prosperity, students, restraint, peace,
    glory, cleansing, and refuge in Om. It then introduces sacred interjections and
    maps them to Brahman, Self, worlds, fire, air, sun, and moon.
  language: English
  quote_policy: quoted
