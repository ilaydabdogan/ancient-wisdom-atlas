canonical_text:
  quote: ''
  summary: 'The passage reflects on the decay of rulers, supernatural beings, and
    cosmic structures, then presents King Brihadratha asking a saint for release.
    Sakayanya teaches him about the Self, described as rising from the body, reaching
    the highest light, and being Brahman. A transmitted teaching from Maitri is then
    introduced: the Valakhilyas ask Prajapati Kratu how an unintelligent body, compared
    to a cart, becomes intelligent and who its driver is; Prajapati identifies the
    pure, bodiless, imperishable one as the maker and driver of the body.'
  language: English
  quote_policy: summarized
