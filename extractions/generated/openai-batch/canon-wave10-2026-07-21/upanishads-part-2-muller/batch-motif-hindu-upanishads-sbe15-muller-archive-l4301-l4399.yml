canonical_text:
  quote: ''
  summary: The passage describes Brahman as the cause of blessedness and says fearlessness
    is obtained in what is invisible, incorporeal, undefined, and unsupported; even
    the smallest distinction produces fear. A Śloka states that wind, sun, Agni, Indra,
    and Death act from terror of Brahman. The passage then examines bliss by beginning
    with an ideal human measure and multiplying bliss one hundredfold through Gandharvas,
    Fathers, Devas, Indra, Br/haspati, and Pra^apati, repeatedly paralleling these
    measures with a desire-free sage.
  language: English
  quote_policy: summarized
