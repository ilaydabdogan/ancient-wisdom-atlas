canonical_text:
  quote: ''
  summary: Uddalaka recounts a prior encounter in which a Gandharva asked about the
    thread binding this world, the other world, and all beings, and about the inner
    ruler. Yajnavalkya identifies the thread as air and describes the immortal Self
    as the inner ruler dwelling within and ruling cosmic elements, celestial domains,
    beings, and faculties.
  language: English
  quote_policy: summarized
