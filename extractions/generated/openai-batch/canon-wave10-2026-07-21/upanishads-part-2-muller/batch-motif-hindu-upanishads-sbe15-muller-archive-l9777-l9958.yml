canonical_text:
  quote: ''
  summary: Yajnavalkya teaches Maitreyi that all things are dear for the sake of the
    Self, that the Self is to be known, and that knowing the Self makes all known.
    He uses analogies of instruments and sound, smoke from fire, waters entering the
    sea, and a mass of salt to describe the Self, the source of scriptures and beings,
    and nonduality. Maitreyi states that she is bewildered; Yajnavalkya explains that
    the Self is imperishable, incomprehensible, unattached, and described by negation,
    then departs into the forest. The passage then begins a teacher-pupil lineage
    or “stem.”
  language: English
  quote_policy: summarized
