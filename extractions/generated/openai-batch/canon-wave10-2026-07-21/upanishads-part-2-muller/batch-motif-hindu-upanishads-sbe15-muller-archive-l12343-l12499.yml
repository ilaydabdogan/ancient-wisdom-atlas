canonical_text:
  quote: ''
  summary: The passage describes knowledge of Brahman or the great person as releasing
    one from fetters and death. It presents the deity as unborn, eternal, pervading
    regions, present in fire, water, plants, trees, all beings, and the cave of the
    heart. In the Third Adhyaya, Rudra is described as the sole ruler, creator, protector,
    and the one who rolls up the worlds at the end of time; prayers ask mountain-dwelling
    Rudra to appear auspiciously and not harm humans or beasts.
  language: English
  quote_policy: summarized
