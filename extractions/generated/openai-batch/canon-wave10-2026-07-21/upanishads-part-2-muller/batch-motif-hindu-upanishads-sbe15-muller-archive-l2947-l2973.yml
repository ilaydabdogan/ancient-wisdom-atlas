  quote: ''
  summary: The passage says that the wise perceive a single being within their Self
    and gain eternal peace. It asks how the highest indescribable pleasure is to be
    understood, whether it has its own light or reflected light. It then states that
    sun, moon, stars, lightning, and fire do not shine there; when he shines, all
    else shines by his light.
