  quote: ''
  summary: The passage presents breath as the sap of the limbs, as lord of speech
    under names such as Brhaspati and Brahmanaspati, and as Saman and Udgitha. It
    states that breath is equal to beings and the universe, that one who knows Saman
    obtains union and oneness with Saman, and that breath upholds the universe while
    speech is song.
