canonical_text:
  quote: ''
  summary: 'The excerpt closes a Vedanta instruction by restricting a highest mystery
    to qualified recipients and promising that truths shine forth for one devoted
    to God and Guru. It then begins the Praśna-Upanishad: six Brahman-seekers approach
    Pippalada with fuel, are told to stay a year in penance, abstinence, and faith,
    and Kabandhin asks the origin of creatures. Pippalada answers that Prajapati desired
    creatures, performed penance, and produced the pair matter and spirit; the sun
    is spirit and the moon matter. The sun gathers spirits into its rays, rises as
    Vaiśvānara, spirit, and fire, and is praised as golden, all-form, thousand-rayed,
    and the spirit of all creatures. The year is identified with Prajapati and has
    southern and northern paths; those relying on sacrifices and pious gifts gain
    the moon.'
  language: English
  quote_policy: summarized
