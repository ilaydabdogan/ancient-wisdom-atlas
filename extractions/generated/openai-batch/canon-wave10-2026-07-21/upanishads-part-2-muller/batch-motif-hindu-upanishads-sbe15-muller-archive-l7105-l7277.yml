canonical_text:
  quote: ''
  summary: The passage presents a series of dialogues with Yajnavalkya. It describes
    ritual gains of earth, sky, and heaven; the eight Grahas and Atigrahas as organ-object
    pairs; death, breath, name, and karmic consequence after death; dissolution of
    bodily and mental functions into cosmic elements; a Gandharva-mediated question
    about the vanished Parikshitas; their journey to the realm of horse-sacrifice
    performers through a narrow cosmic space by Indra and Vayu; and the Self within
    all as the one breathing through the vital breaths.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An answer states that the Puronuvakya gains earth, the Yajya gains sky, and
    the Sasya gains heaven; after this Asvala is silent.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Yajnavalkya lists eight Grahas and eight Atigrahas: breath/apana, speech/name,
    tongue/taste, eye/form, ear/sound, mind/desire, arms/work, and skin/touch.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In response to the claim that everything is food of death, Yajnavalkya identifies
    fire as death and says fire is food of water, after which death is conquered again.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: When a sage dies, Yajnavalkya says the vital breaths do not move out but are
    gathered in him; the dead body swells and lies at rest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Yajnavalkya says that name does not leave the dead person, because name is
    endless, and by it the person gains the endless world.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A question describes the dead person's speech entering fire, breath air, eye
    sun, mind moon, hearing space, body earth, self ether, body hairs shrubs, head
    hairs trees, and blood and seed water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After being asked where the person then is, Yajnavalkya takes Artabhaga aside;
    their private discussion is summarized as karman, with a person becoming good
    by good work and bad by bad work.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Bhujyu Lahyayani recounts that students came to the house of Patanjala Kapya,
    whose daughter was possessed by a Gandharva identifying himself as Sudhanvan the
    Angirasa.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Bhujyu asks where the Parikshitas were, after recalling that the Gandharva
    was asked about the ends of the world.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Yajnavalkya says the Parikshitas went where those who performed a horse-sacrifice
    go.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The world is described as thirty-two journeys of the sun's car, surrounded
    by an earth twice as large, which is surrounded by an ocean twice as large, with
    a very narrow space between them.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: Indra becomes a bird and hands the Parikshitas through the narrow space to
    Vayu, who holds them within himself and conveys them to the dwelling of those
    who performed a horse-sacrifice.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Yajnavalkya says Vayu is everything by itself and all things together, and
    that one who knows this conquers death.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: Ushasta Cakrayana asks Yajnavalkya to tell him the visible Brahman, the Self
    within all; Yajnavalkya identifies it as the Self that breathes through the vital
    breaths.
  category: speech
  evidence_refs:
  - ev:13
