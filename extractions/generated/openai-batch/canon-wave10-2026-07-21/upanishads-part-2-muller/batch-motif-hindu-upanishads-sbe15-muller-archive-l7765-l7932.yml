canonical_text:
  quote: ''
  summary: In a disputation, a questioner repeatedly asks Yajñavalkya how many gods
    there really are. Yajñavalkya reduces the count from many named divine powers
    to thirty-three, then to six, three, two, one and a half, and one. He identifies
    deity groups with cosmic elements, senses or vital breaths, months, thunder, sacrifice,
    food, breath, wind, and finally breath as Brahman. The passage ends by beginning
    another knowledge formula about a person whose dwelling is earth, sight is fire,
    and mind is light.
  language: English
  quote_policy: summarized
