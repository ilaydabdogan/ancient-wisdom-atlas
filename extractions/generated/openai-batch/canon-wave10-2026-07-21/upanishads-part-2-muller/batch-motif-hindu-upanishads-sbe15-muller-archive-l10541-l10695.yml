canonical_text:
  quote: ''
  summary: 'The passage identifies bodily and mental faculties with powers gained
    by knowing them: breath as first and best, speech as richest, eye as firm rest,
    ear as success, mind as home, and seed as generation. The faculties quarrel over
    which is greatest and ask Brahman to judge. Speech, eye, ear, mind, and seed each
    depart for a year, and the others continue living in impaired ways. When breath
    prepares to depart, the other faculties are violently displaced and plead with
    breath not to leave. They offer breath their own powers, name all food as breath''s
    food and water as breath''s dress, and the text connects this to ritual rinsing
    of the mouth. A new section begins with Svetaketu Aruneya visiting King Pravahana
    Jaivali, who asks whether he knows how departing people separate and how they
    return to this world; Svetaketu says he does not.'
  language: English
  quote_policy: summarized
