canonical_text:
  quote: ''
  summary: Yajnavalkya completes Janaka Vaideha's partial teachings about hearing,
    mind, and heart as Brahman by naming each one's body, resting place, and mode
    of worship. Janaka repeatedly offers cattle as reward, while Yajnavalkya says
    a reward should not be accepted before full instruction. Janaka then descends
    from his throne, bows, and asks to be taught where he will go when departing.
    Yajnavalkya introduces a person in the right eye called Indha or Indra, his wife
    Viraj, and their meeting place, food, covering, road, and veins within the heart.
  language: English
  quote_policy: summarized
