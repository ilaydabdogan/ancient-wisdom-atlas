  quote: ''
  summary: A scholarly introduction argues against hastily expunging or correcting
    apparently late or irregular Upanishadic wording. It cites terms and objects such
    as Dhatr as creator, Deva as God, setu as a barrier rather than a modern bridge,
    and adarja as mirror, and compares their occurrence across the Rig-veda, Upanishads,
    and ritual texts. It also discusses uncertainty about whether irregular readings
    come from original composers, compilers, reciters, or writers.
  language: English
