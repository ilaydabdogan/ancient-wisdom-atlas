canonical_text:
  quote: ''
  summary: 'A king questions Svetaketu about unanswered matters concerning the world
    of the departed, libations, and two paths for men. Svetaketu admits ignorance
    and reports this to his father Gautama. Gautama approaches King Pravahana Gaivali,
    declines ordinary wealth, and comes as a pupil to receive the teaching. The king
    says this knowledge has not previously dwelt with any Brahmana and then describes
    a sequence of cosmic altars: heaven, Parjanya, this world, man, and woman. On
    these altars the Devas offer successive oblations, from which arise Soma, rain,
    food, seed, and finally a human being.'
  language: English
  quote_policy: summarized
