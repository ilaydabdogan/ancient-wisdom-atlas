  summary: The passage describes the living or incarnate Self as subtle, non-gendered,
    and joined to whatever body it takes. It migrates and assumes forms according
    to deeds, qualities, and paths. The passage also describes a beginningless and
    endless being who creates all things in the midst of chaos and envelops everything;
    those who know him are released from fetters.
