canonical_text:
  quote: ''
  summary: 'The passage describes the true knower or person who sees, hears, acts,
    and dwells in the highest indestructible Self. It states that one who knows the
    indestructible being becomes all-knowing and becomes all. The Fifth Question then
    asks what a person obtains by meditating on Om until death. The answer presents
    Om as both the highest and the other Brahman, and assigns different results to
    meditation on one, two, or three Matras of Om: arrival at earth and the world
    of men; arrival at Manas, the sky, and the Soma-world followed by return; or movement
    to light, the sun, and Brahma-world, where the meditator is freed from evil like
    a snake from its skin and learns to see the all-pervading Highest Person. Separate
    Matras are described as mortal.'
  language: English
  quote_policy: summarized
