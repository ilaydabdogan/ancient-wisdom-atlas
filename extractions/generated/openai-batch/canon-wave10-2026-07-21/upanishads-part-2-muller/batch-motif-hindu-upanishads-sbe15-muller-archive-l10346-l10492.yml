canonical_text:
  quote: ''
  summary: The passage expounds the Gayatri through its syllables and feet, mapping
    them to Vedic knowledge, vital breaths, the fourth bright foot above the skies,
    truth, sight, force, and life. It describes Gayatri/Savitri instruction as protective
    of vital breaths, measures possible teacher fees against the first three feet
    while denying any fee can obtain the fourth, gives an adoration and imprecatory/desiderative
    use of Gayatri, recounts a dialogue in which Agni/fire is called Gayatri's mouth
    and a knower consumes evil, and begins a prayer asking Pushan to uncover the golden
    disk that hides the face of the True/Brahman.
  language: English
  quote_policy: summarized
