  quote: '"When the child is born, he prepares the fire, places the child on his lap"'
  summary: 'The passage describes birth rites for a boy: a fire is prepared, offerings
    of thick milk and clarified butter are sacrificed with blessings, speech is spoken
    into the child’s ear, the child is fed a mixture with gold, given the secret name
    “Veda,” handed to his mother for nursing with an invocation to Sarasvati, and
    praised as surpassing father and grandfather when born to a knowledgeable Brahmana.'
