  basis: Speech is a cow whose udders are ritual and social utterances sustaining
    gods, men, and fathers; the note links the utterances to oblations.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The cow is an explicit metaphor for speech; the sacrifice taxonomy is
