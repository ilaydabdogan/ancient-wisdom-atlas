canonical_text:
  quote: ''
  summary: 'The passage gives a series of meditative identifications: a small luminous
    person in the heart rules all; lightning is Brahman and cuts off evil; speech
    is a cow with ritual utterances as udders; Agni Vaii^vanara is the digestive fire;
    the departing person ascends through wind, sun, and moon to a sorrowless world;
    sickness and funerary acts are called highest penance; food and life are interdependent;
    breath is identified with liturgical forms and power; and the Gayatri foot is
    mapped to earth, sky, and heaven.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person under the form of mind, described as light and small like a grain
    of rice or barley, is said to be within the heart and to rule all that exists.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lightning is identified as Brahman; one who knows this is cut off from evil
    by that Brahman.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Speech is to be meditated on as a cow with four udders named Svaha, Vasha/,
    Hanta, and Svadha.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The gods live on the Svaha and Vasha/ udders, men on Hanta, and the fathers
    on Svadha; breath is the bull of the cow and mind is the calf.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Agni Vaii^vanara is described as the fire within man by which eaten food is
    cooked or digested.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The internal fire has a noise heard when one covers the ears; a person near
    departure from life no longer hears that noise.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: When the person leaves this world, he comes successively to wind, sun, and
    moon; each makes room for him and he mounts higher through it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The ascent ends in a world described as having no sorrow and no snow, where
    the person dwells for eternal years.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Suffering pain during sickness, carrying a dead person into the forest, and
    placing a dead person on the fire are each called the highest penance; one who
    knows this conquers the highest world.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Food alone is rejected as Brahman because it decays without life, and life
    alone is rejected because it dries up without food; food and life together, when
    one, reach the highest state.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Pratr/da asks his father whether he can help or harm one who knows the teaching;
    the father rejects the sufficiency of only the oneness of food and life and teaches
    names connected with food as rest and life as delight.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Breath is identified with Uktha, Ya^us, Saman, and Kshatra; knowing these
    identifications brings raised offspring, excellence, power, protection, and union
    or oneness with the named forms.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: Earth, sky, and heaven are said to form eight syllables, corresponding to
    one foot of the Gayatri; knowing that foot lets one conquer as far as the three
    worlds extend.
  category: relationship
  evidence_refs:
  - ev:12
