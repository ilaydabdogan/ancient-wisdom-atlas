- id: motif:5
  label: Afterlife ascent through cosmic stations to a sorrowless world
  taxonomy_refs:
  - afterlife_journey_map
  - ascent
  basis: The departing person travels through wind, sun, and moon, each opening a
    passage upward, and arrives at a world without sorrow or snow.
