- id: motif:6
  label: Sickness and funerary transition as highest penance
  taxonomy_refs: []
  basis: The passage calls sickness pain, carrying the dead into the forest, and placing
    the dead on fire the highest penance, with conquest of the highest world for one
    who knows this.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This is doctrinal interpretation of suffering and funerary practice, not
    a full initiatory narrative.
- id: motif:7
  label: Food and life as interdependent pair reaching highest state
  taxonomy_refs:
  - duality
  basis: Food without life and life without food are each inadequate, while the two
    deities together become one and reach the highest state.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The duality is complementary rather than antagonistic.
- id: motif:8
  label: Union and oneness with sacred forms through breath
  taxonomy_refs:
  - wisdom
  - annihilation_union
  basis: Knowing breath as Uktha, Ya^us, Saman, and Kshatra brings union and oneness
    with those forms.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage says union and oneness, but does not describe annihilation;
    that taxonomy ref is therefore tentative.
- id: motif:9
  label: Sacred meter encodes the three worlds
  taxonomy_refs:
  - wisdom
  basis: The three worlds are mapped to one foot of the Gayatri, and knowing this
    correspondence brings conquest across their extent.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The motif is cosmological and liturgical; the wisdom taxonomy is based
    on the stated efficacy of knowing the correspondence.
