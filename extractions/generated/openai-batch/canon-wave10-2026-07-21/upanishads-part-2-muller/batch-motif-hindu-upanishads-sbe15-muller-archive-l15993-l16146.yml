canonical_text:
  quote: ''
  summary: The passage identifies sacrificial fires with cosmic regions and with bodily,
    textual, and ritual elements. It describes the sacrificer being lifted or presented
    through Indra/Aditya, Prajapati as Knower of the Self, and Brahman. It then turns
    to the three fires, digestive fire, oblation, and meditation on the solar splendour
    of Savitri through the image of a gold-coloured bird in the heart and sun. A sequence
    of verses teaches that thoughts become quiet like fire without fuel, that mind
    and thought cause bondage, birth, and liberty, and that a mind entering the Self
    is like water in water, fire in fire, and ether in ether. The passage ends with
    prayers to Agni and Vayu to grant their worlds to the worshipper.
  language: English
  quote_policy: summarized
