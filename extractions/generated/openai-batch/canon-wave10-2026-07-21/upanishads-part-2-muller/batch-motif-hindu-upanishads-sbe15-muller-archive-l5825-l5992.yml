canonical_text:
  quote: ''
  summary: The passage describes divine or central breath as tireless and imperishable;
    narrates how Prajapati creates the active senses, which are seized by Death as
    weariness while central breath remains unseized; parallels this with deities and
    Vayu; prescribes breathing observance for avoiding evil death and gaining union
    with prana; expounds a triad of name, form, and work unified in the Self; and
    begins a dialogue in which Gargya Balaki offers to teach Brahman to Ajatasatru
    and identifies the person in the sun as Brahman, which Ajatasatru rejects.
  language: English
  quote_policy: summarized
