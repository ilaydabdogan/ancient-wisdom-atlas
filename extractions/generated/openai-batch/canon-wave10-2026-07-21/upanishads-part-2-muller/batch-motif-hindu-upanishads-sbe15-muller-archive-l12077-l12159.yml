canonical_text:
  quote: ''
  summary: 'The passage describes realizing the Self through the syllable Om and meditation,
    using fire-drill and hidden-substance analogies: fire in wood, oil in seeds, butter
    in cream or milk, and water in dry river-beds. It then introduces verses to Savitr,
    in which the sun-god collects mind and thought, brings Agni above the earth, and
    is invoked by collected minds for blessedness. Translator notes explain the fire-drill
    comparison and identify the Savitr verses as drawn from Vedic Saṃhitā hymns.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man is instructed to make his body the under-wood and the syllable Om the
    upper-wood, repeating the drill of meditation to perceive a bright god like a
    hidden spark in wood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Self is compared to oil in seeds, butter in cream, water in dry river-beds,
    and fire in wood, and is said to be seized within the self through truthfulness
    and penance.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Self is said to pervade everything, to be like butter contained in milk,
    and to have roots in self-knowledge and penance; this is identified as Brahman
    taught by the Upanishad.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The note explains that fire produced by a fire drill is compared to the Self:
    it is not seen at first but becomes visible when the stick is drilled in the under-wood.'
  category: other
  evidence_refs:
  - ev:4
