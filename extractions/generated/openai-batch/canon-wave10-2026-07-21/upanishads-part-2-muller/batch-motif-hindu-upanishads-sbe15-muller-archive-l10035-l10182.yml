canonical_text:
  quote: ''
  summary: The passage teaches that the visible and invisible Brahman are full, identifies
    Om with ether, Brahman, and the Veda, narrates Prajapati's one-syllable instruction
    Da to gods, men, and Asuras, explains the heart and truth through syllables, gives
    a cosmogonic sequence from water to truth/Brahman to Prajapati to gods, and maps
    the true to the sun, the solar person, and the person in the right eye.
  language: English
  quote_policy: summarized
