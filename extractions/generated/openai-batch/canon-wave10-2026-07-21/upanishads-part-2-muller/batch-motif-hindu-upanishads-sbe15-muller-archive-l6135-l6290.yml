canonical_text:
  quote: ''
  summary: The passage describes the intelligent person moving within the body during
    dream, resting in deep sleep through channels from the heart, and the emanation
    of senses, worlds, gods, and beings from the Self. It then explains symbolic correspondences
    among the inner life, body, head, breath, food, eye-parts, deities, sages, senses,
    and tongue. It concludes with paired forms of Brahman and correspondences between
    cosmic elements, the sun, bodily breath and ether, the eye, and persons in the
    sun and right eye.
  language: English
  quote_policy: summarized
