canonical_text:
  quote: he crosses by means of the boat Om to the other side of the ether within
    the heart
  summary: 'The passage describes an inward yogic and doctrinal progression: the practitioner
    leaves bodily and sensory attachments, arms himself with fortitude, asceticism,
    and freedom from egotism, overcomes a guardian at the door of Brahman, crosses
    by the boat Om, enters the Hall of Brahman, breaks through the shrine by the teacher’s
    doctrine, and attains purity, freedom from desire, and blessedness in Brahman.
    It also frames this knowledge as a secret teaching transmitted only to qualified
    recipients.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A shrine consisting of ether in the heart is described as blissful, the highest
    retreat, one’s own, one’s goal, and the heat and brightness of fire and sun.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The practitioner leaves behind the body, sense organs, and sense objects as
    no longer belonging to him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The practitioner seizes a bow whose stick is fortitude and whose string is
    asceticism, and uses an arrow consisting of freedom from egotism against the first
    guardian of the door of Brahman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A contrasting egoistic man is described as taking the diadem of passion, earrings
    of greed and envy, the staff of sloth, sleep, and sin, a bow of anger and lust,
    and an arrow of wishes, with which he destroys all beings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After killing the guardian, the practitioner crosses by the boat Om to the
    other side of the ether within the heart and enters the Hall of Brahman slowly
    like a miner entering a mine.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: By the doctrine of his teacher, the practitioner breaks through the shrine
    of Brahman, described as consisting of four nets, until he reaches blessedness
    and identity with Brahman.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The resulting state is described with attributes including pure, clean, tranquil,
    breathless, bodiless, endless, imperishable, unborn, and independent; the practitioner
    stands on his own greatness and sees the wheel of the world as one who has alighted
    from a chariot sees its revolving wheel.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says that if a man practices Yoga for six months and is thoroughly
    free from the outer world, perfect Yoga is accomplished; if he remains pierced
    by passion and darkness and attached to children, wife, and house, perfect Yoga
    is not accomplished.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: "^'akayanya bows before the king and says that through Brahma-knowledge the
    sons of Pra^apati, the Valakhilyas, have gone to the road of Brahman."
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says Yoga gives contentment, power to endure good and evil, and
    tranquillity, and that the secret doctrine should be communicated only to a son
    or pupil of serene mind who is devoted to his teacher and properly qualified.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: In a pure place, the practitioner is instructed to be pure, firm in goodness,
    study the truth, speak the truth, think the truth, and offer sacrifice to the
    truth.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After obtaining the reward of Brahman, the practitioner’s fetters are cut,
    and he is said to know no hope, fear, or desires, while a man full of desires
    is called a slave and the opposite man free.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage reports a view that the Guna goes into bondage to the will and
    is delivered when the fault of the will is removed, and then states that seeing
    and hearing occur by the mind as an instrument.
  category: speech
  evidence_refs:
  - ev:10
