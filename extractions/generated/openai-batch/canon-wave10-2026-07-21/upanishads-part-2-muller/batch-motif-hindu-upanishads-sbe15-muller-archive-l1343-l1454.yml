  summary: The passage is an introductory discussion of the Śvetāśvatara Upanishad.
    It compares the text with other Upanishads, Sāṅkhya, and Vedānta; emphasizes one
    Being rather than dualism; describes nature as God's own power; presents God as
    creator and ruler in a phenomenal sense; and explains orthodox Vedānta as illusion
    rather than evolution, using tree and mirage metaphors.
