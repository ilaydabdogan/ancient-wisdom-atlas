- id: obs:3
  text: In waking and dreaming, where there is as it were another, one can perceive,
    speak to, think, touch, and know the other.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The one seer is compared to an ocean and described as without duality; this
