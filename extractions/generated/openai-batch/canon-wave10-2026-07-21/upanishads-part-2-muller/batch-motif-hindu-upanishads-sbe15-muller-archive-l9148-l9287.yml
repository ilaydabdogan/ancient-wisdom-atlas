canonical_text:
  quote: An ocean is that one seer, without any duality
  summary: The passage describes deep sleep as a state in which sense and cognitive
    capacities remain inseparable from the perceiver although no second object is
    present. It contrasts this with waking and dreaming, where another can be perceived.
    Yajnavalkya teaches the king about the one seer, Brahma-world, highest bliss,
    and a hierarchy of blessings, after which Janaka Vaideha offers a gift and asks
    for instruction for emancipation.
  language: English
  quote_policy: quoted
literal_observations:
