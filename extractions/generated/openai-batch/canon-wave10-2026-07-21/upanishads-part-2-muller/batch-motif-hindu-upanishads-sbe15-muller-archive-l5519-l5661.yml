canonical_text:
  quote: ''
  summary: The passage describes Brahman manifesting as Agni and social forms; urges
    worship and knowledge of the Self; presents a human ritual actor as a world for
    gods, seers, ancestors, humans, and animals; recounts the primordial Self's desire
    for wife, offspring, wealth, and sacrifice; and explains seven foods, especially
    milk, as cosmic sustenance produced and renewed by an imperishable Person.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Brahman is said to exist among the Devas as Agni, fire, and among humans through
    Brahmana, Kshatriya, Vaishya, and Shudra forms.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who departs without knowing the Self as true future life is not received
    or blessed by that Self, and even great holy work perishes for one who lacks that
    knowledge.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The text instructs a person to worship the Self as his true state; when he
    does so, his work does not perish and his desires are obtained from that Self.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Through sacrifices, libations, recitation, ancestor offerings, hospitality
    to people, and fodder and water for animals, a man is described as the world of
    Devas, Rishis, Fathers, men, and animals.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: All beings are said to wish that the one who knows this should not be injured,
    just as each wishes his own world not to be injured.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the beginning the Self alone desired a wife for offspring and wealth for
    sacrifices.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The lonely person's completeness is mapped as mind as self or husband, speech
    as wife, breath as child, eye as worldly wealth, ear as divine wealth, and body
    as work.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage calls this arrangement a fivefold sacrifice and states that animal,
    man, and all this are fivefold.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The father of creation is said to have produced seven kinds of food by knowledge
    and penance or work, assigning one to all beings, two to the Devas, three to himself,
    and one to animals.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The two foods assigned to the Devas are interpreted as huta sacrificed in
    fire and prahuta given away at sacrifice, with another explanation referring to
    new-moon and full-moon sacrifices.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The food given to animals is identified as milk; the text says newborn humans
    and animals live on milk and that all that breathes and does not breathe rests
    on milk.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: A person who knows the teaching and sacrifices with milk is said to overcome
    death on the day of sacrifice by offering the entire food to the gods.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Person is identified as imperishable and as producing food again and again.
  category: attribute
  evidence_refs:
  - ev:7
