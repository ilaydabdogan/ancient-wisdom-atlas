  quote: ''
  summary: The passage identifies the Self with Breath and Sun as inner and outer
    forms, describes a golden solar person entering the lotus of the heart, presents
    Time as a solar fire that devours beings, instructs worship with Om, and equates
    Brahman, Sun, Om, and the world-tree Aśvattha.
