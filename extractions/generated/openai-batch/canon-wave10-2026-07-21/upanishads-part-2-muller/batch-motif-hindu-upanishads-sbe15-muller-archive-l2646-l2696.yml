canonical_text:
  quote: ''
  summary: The passage describes two beings or principles dwelling in the heart-cave
    and called shade and light, invokes the Naciketa rite as a bridge for crossing
    to a fearless shore, and presents a chariot simile in which the Self, body, intellect,
    mind, senses, and sense-objects are mapped to rider, chariot, charioteer, reins,
    horses, and roads.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two entities are said to drink their reward in the world of their own works,
    to have entered the cave of the heart, and to dwell on the highest summit, glossed
    as the ether in the heart.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those who know Brahman call the two entities shade and light; the same recognition
    is also attributed to householders who perform the Trinakiketa sacrifice.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The speaker asks to master the Naciketa rite, described as a bridge for sacrificers,
    and also the highest imperishable Brahman for those wishing to cross to the fearless
    shore.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Self is to be known as sitting in a chariot; the body is identified as
    the chariot, the intellect as the charioteer, and the mind as the reins.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The senses are called horses, and the objects of the senses are called their
    roads.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the Highest Self is in union with the body, senses, and mind, wise people
    call him the Enjoyer.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A translator's note says the chariot simile has some similarity with Plato's
    Phaedrus, while adding that Plato did not borrow it from the Brahmans.
  category: other
  evidence_refs:
  - ev:6
