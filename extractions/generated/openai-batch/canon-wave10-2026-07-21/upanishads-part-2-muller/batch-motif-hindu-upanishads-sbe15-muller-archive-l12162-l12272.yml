canonical_text:
  quote: ''
  summary: 'The passage invokes Savitri to bring divine light and orders of invocation,
    describes sages collecting mind and thought, asks heavenly sons of the Immortal
    to hear a song moving like the sun''s path, and links fire, wind, Soma, and the
    birth of mind. It then gives instructions for inward yogic discipline: love of
    Brahman by Savitri''s grace, bodily alignment, turning the senses toward the heart,
    crossing fearful torrents in the boat of Brahman, breath regulation, and restraint
    of the mind likened to a chariot with vicious horses. Notes cite Vedic parallels
    and record ritual and Upanishadic interpretations.'
  language: English
  quote_policy: summarized
