canonical_text:
  quote: ''
  summary: The passage describes an Agnihotra offerer who breaks through desire, bewilderment,
    nets, and cosmic spheres to behold Brahman/Vishnu. It then gives meditations on
    the thumb-sized inner Brahman in the heart and a cosmological account of beings,
    metres, seasons, breaths, deities, planets, and other creatures rising in the
    directions, returning into the sun, and looking out from him. The final section
    identifies the Self in the heart with fire, the sun, and multiple divine names.
  language: English
  quote_policy: summarized
