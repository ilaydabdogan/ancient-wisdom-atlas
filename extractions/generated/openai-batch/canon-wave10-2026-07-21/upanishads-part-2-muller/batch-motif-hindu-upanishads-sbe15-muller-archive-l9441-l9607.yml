canonical_text:
  quote: ''
  summary: The passage teaches that the Self is Brahman; that desire, will, and deed
    determine a person's becoming and post-mortem return; that the desireless knower
    obtains Brahman and immortality; that the body is cast off like a snake's slough;
    that Brahman-knowers travel an ancient colored path to heaven and beyond; and
    that ignorance is associated with blind dark worlds, while self-knowledge brings
    fearlessness and immortality.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Self is identified as Brahman and described as consisting of knowledge,
    mind, life, senses, elements, light and no light, desire and no desire, anger
    and no anger, right and wrong, and all things.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person becomes according to acts and behavior; good acts produce good becoming,
    and bad acts produce bad becoming.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person is said to consist of desires; desire becomes will, will becomes
    deed, and deed is reaped.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person's mind goes to the object to which it is attached together with the
    deed; after obtaining the result of deeds in another world, the person returns
    to this world of action.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: For the person who does not desire, is freed from desires, or desires only
    the Self, the vital spirits do not depart elsewhere; being Brahman, that person
    goes to Brahman.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: When all desires that entered the heart are undone, the mortal becomes immortal
    and obtains Brahman.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The body is compared to the slough of a snake lying dead and cast away on
    an ant-hill, while the disembodied immortal spirit is Brahman and light.
  category: relationship
  evidence_refs:
  - ev:5
