canonical_text:
  quote: The Self indeed is his light
  summary: Janaka questions Yajnavalkya about the light of man when external lights
    are absent. Yajnavalkya identifies sound and then the Self as light, describes
    the Self/person in the heart as moving between this world, the other world, and
    sleep, and explains dream as a self-illuminated state in which the person creates
    forms and returns unattached.
  language: English
  quote_policy: quoted
