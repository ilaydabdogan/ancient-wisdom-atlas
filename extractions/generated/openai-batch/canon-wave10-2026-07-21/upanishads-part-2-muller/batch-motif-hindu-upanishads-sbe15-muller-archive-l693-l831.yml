    his son asks to whom he will be given, and the father gives him to Death. A voice
    directs the boy to Death''s house for three nights without food. Death returns,
    questions him, grants boons, and teaches the Na/^iketa fire sacrifice connected
    with imperishable good works and conquest of death. The introduction states that
    the Brahmana story explains the name of a sacrificial ceremony and was used as
    a frame for Upanishadic doctrine.'
