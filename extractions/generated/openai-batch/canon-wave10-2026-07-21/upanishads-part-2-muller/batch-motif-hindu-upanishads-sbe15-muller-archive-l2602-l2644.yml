canonical_text:
  quote: ''
  summary: The passage teaches that the Self is ancient, unborn, eternal, and not
    killed when the body is killed. It describes the Self as hidden in the heart,
    paradoxically smaller than small and greater than great, bodiless within bodies,
    and accessible only to a desireless, tranquil, ethically prepared person whom
    the Self chooses. It ends with a compressed image in which Brahmans and Kshatriyas
    are as food and death itself as a condiment for the supreme He.
  language: English
  quote_policy: summarized
