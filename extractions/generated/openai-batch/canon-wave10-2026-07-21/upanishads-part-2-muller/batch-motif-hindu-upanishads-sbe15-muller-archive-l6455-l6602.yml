canonical_text:
  quote: ''
  summary: Yajnavalkya teaches Maitreyi through analogies of smoke from fire, waters
    reaching the sea, salt dissolving in water, and the disappearance of duality when
    the Self is all. A following Madhuvidya section describes earth, water, fire,
    air, sun, and space as honey for all beings and all beings as honey for them,
    with corresponding bright immortal persons in cosmos and body identified with
    Self, Immortal, Brahman, and All.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Texts and branches of knowledge, including Vedas, legends, cosmogonies, knowledge,
    Upanishads, verses, rules, glosses, and commentaries, are said to have been breathed
    forth from a great Being, like smoke from a lighted fire with damp fuel.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: All waters are said to find their centre in the sea, and various sensory,
    mental, bodily, and verbal functions are mapped to specific organs or faculties.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A lump of salt thrown into water dissolves and cannot be taken out again,
    though the water tastes salty wherever sampled.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The great Being is described as endless, unlimited, and consisting of nothing
    but knowledge, rising from the elements and vanishing again in them.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Maitreyi says she is bewildered by the statement that after departure there
    is no more knowledge.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Yajnavalkya replies that the teaching is not bewildering and is enough for
    wisdom.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: When there is duality, one perceives, salutes, and knows another; when the
    Self alone is all this, the text asks how one could perceive or know another or
    know the Knower.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Earth, water, fire, air, sun, and space are each described as the honey of
