candidate_motifs:
- id: motif:1
  label: Divergent afterlife paths with return and non-return
  taxonomy_refs:
  - afterlife_journey_map
  - return
  - ascent
  basis: The passage contrasts the southern path of the Fathers, involving return,
    with the Northern path to Aditya, from which there is no return.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents a doctrinal map rather than a narrative of an individual
    journey.
- id: motif:2
  label: Ascetic search for the Self leading to an immortal destination
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: Those who seek the Self through penance, abstinence, faith, and knowledge
    gain Aditya, described as immortal, free from danger, highest, and final.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The described practices are listed briefly and not narrated as a full
    quest episode.
- id: motif:3
  label: Cosmic dualities structured by time
  taxonomy_refs:
  - duality
  - seasonal_cycle
  basis: The month is divided into dark and bright halves, and Day and Night into
    night and day, with matter and spirit assigned to these paired divisions.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives symbolic correspondences but does not personify the
    paired halves beyond their identification with Prajapati.
- id: motif:4
  label: Food, seed, pair, and sacred birth
  taxonomy_refs:
  - sacred_birth
  basis: Food produces seed, creatures are born from seed, and observance of Prajapati’s
    rule produces a pair.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage frames procreation in doctrinal and ritual terms, not as a
    single birth narrative.
- id: motif:5
  label: Dispute of bodily powers and supremacy of life-breath
  taxonomy_refs:
  - wisdom
  basis: The powers of ether, wind, fire, water, earth, speech, mind, eye, and ear
    contend over supporting the body, and Praṇa demonstrates its superiority.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The motif is philosophical and didactic rather than heroic or mythic in
    plot form.
- id: motif:6
  label: Departure and return of the vital principle
  taxonomy_refs:
  - departure
  - return
  basis: When Praṇa acts as if going out, the other powers go out; when Praṇa returns,
    they return.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Praṇa only acts “as if” going out; the passage does not describe death
    itself.
- id: motif:7
  label: All things fixed in a central life-principle
  taxonomy_refs:
  - world_center
  basis: Everything, including Vedic texts, sacrifice, and social classes, is said
    to be fixed in Praṇa like spokes in the nave of a wheel.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The world-center reading rests on the wheel-nave metaphor and centralizing
    function of Praṇa.
- id: motif:8
  label: Breath identified with cosmic deities and elements
  taxonomy_refs:
  - wisdom
  basis: Praṇa is praised as Agni, Surya, Parjanya, Indra, Vayu, earth, matter, God,
    what is and is not, and immortal.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage supplies a list of identifications but does not narrate transformations
    among forms.
- id: motif:9
  label: Sacred offering exchange involving gods, Fathers, and Praṇa
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: Creatures bring offerings to Praṇa; Praṇa is called the best carrier for
    the gods and the first offering to the Fathers, and sacrifice is fixed in Praṇa.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage mentions ritual functions and offerings without describing
    a full ritual sequence.
- id: motif:10
  label: Divine life-breath as father and mother-like protector
  taxonomy_refs:
  - divine_parent_child
  basis: Praṇa is called father and is asked to protect the speakers like a mother
    protects her sons.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The parental language occurs in praise and prayer, not in a genealogical
    story.
