canonical_text:
  quote: ''
  summary: The passage contrasts the southern path of the Fathers, associated with
    offspring and return, with the northern path to Aditya, associated with seeking
    the Self and non-return. It describes Prajapati through time, food, seed, and
    procreation. It then narrates a dispute among gods or powers of the body in which
    Praṇa demonstrates that the other powers depend on it, receives praise as a cosmic
    power identified with deities and elements, and is invoked for protection and
    wisdom. The final section begins a question about Praṇa’s origin and relation
    to the body, answered by saying Praṇa is born of the Self.
  language: English
  quote_policy: summarized
literal_observations:
