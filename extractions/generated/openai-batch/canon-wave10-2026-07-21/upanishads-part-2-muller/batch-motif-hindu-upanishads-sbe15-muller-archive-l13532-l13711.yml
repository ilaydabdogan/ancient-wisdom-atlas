  text: Ṛṣis who desire offspring are said to go to the South; the path of the Fathers
    is identified with matter and involves return.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those who seek the Self through penance, abstinence, faith, and knowledge
    gain the Northern path to Aditya, described as immortal, safe, highest, and without
    return.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A verse describes a father with five feet and twelve shapes, and also mentions
    a sage in a chariot with seven wheels and six spokes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The month, Day and Night, and food are each identified with Prajapati; dark
    and night are linked with matter, while bright and day are linked with spirit.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Food produces seed, and creatures are born from seed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Those who observe the stated rule of Prajapati produce a pair; those characterized
    by penance, abstinence, truth, and absence of crookedness, falsehood, and guile
    are assigned a pure Brahma-world.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bhargava Vaidarbhi asks how many gods keep what has been created, how many
    manifest it, and who is best among them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ether, wind, fire, water, earth, speech, mind, eye, and ear are named as gods
    or powers; they contend that they support and keep the body.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Praṇa says it alone supports and keeps the body by dividing itself fivefold.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: When Praṇa acts as though going out from above, the other powers go out; when
    Praṇa returns, they return, like bees following their king or queen.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Speech, mind, eye, and ear praise Praṇa as fire, sun, rain, Indra, wind, earth,
    matter, God, what is, what is not, and what is immortal.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Everything, including Vedic verses, sacrifice, Kshatriyas, and Brahmans, is
    said to be fixed in Praṇa like spokes in the nave of a wheel.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Praṇa is addressed as Prajapati moving in the womb and being born again; creatures
    bring offerings to Praṇa.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Praṇa is called the best carrier for the gods, the first offering to the Fathers,
    Indra by light, Rudra as protector, the sun in the sky, and the lord of lights.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: When Praṇa showers rain, creatures are delighted because they hope for food.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Praṇa is called father and is asked not to go away; Praṇa is also asked to
    protect like a mother protects sons and to give happiness and wisdom.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: Kausalya Aśvalayana asks where Praṇa is born, how it enters and abides in
    the body, how it divides itself, how it goes out, and how it supports what is
    within and without.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: The answer states that Praṇa is born of the Self and compares Praṇa to a shadow
    thrown on a man.
  category: relationship
  evidence_refs:
  - ev:9
