canonical_text:
  quote: ''
  summary: The passage expounds speech, mind, and breath as constituents of the Self
    and maps them onto worlds, Vedas, divine and human classes, family relations,
    and forms of knowing. It then assigns cosmic bodies and lights to speech, mind,
    and breath; describes Prajapati as the year with sixteen digits who wanes, enters
    living beings at new moon, and is born again; teaches ways of gaining three worlds;
    and describes a deathbed handing over from father to son, followed by divine speech
    and mind entering him.
  language: English
  quote_policy: summarized
