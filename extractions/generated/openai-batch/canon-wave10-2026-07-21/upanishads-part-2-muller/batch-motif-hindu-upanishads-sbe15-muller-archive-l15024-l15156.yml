canonical_text:
  quote: ''
  summary: The passage explains Om, the Vyahritis, and the Savitri verse through correspondences
    among deities, worlds, body parts, time, breath, elements, and knowledge. Prajapati
    utters the three worlds, is mapped onto a cosmic body, and is worshipped through
    the three utterances. The sun/Savitr is treated as the object of meditation and
    as eye; Bhargas and other divine or elemental names are explained etymologically.
    The passage closes by describing the Self as the inner knower and contrasting
    twofold knowledge with an ineffable non-twofold knowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage enumerates triadic correspondences called bodies, including Agni-Vayu-Aditya,
    Brahma-Rudra-Vishnu, altar fires, Vedic forms, worlds, times, heat, growth, thought,
    and breaths, and says they are praised and identified by Om.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cited saying identifies the syllable Om with both the high and the low Brahman.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The world is said to have been unuttered before Prajapati brooded and uttered
    it as Bhuh, Bhuvah, and Svar.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The three worlds are described as Prajapati's gross body, with Svar as head,
    Bhuvah as navel, Bhuh as feet, and the sun as eye.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The eye is called truth, and the person dwelling in the eye is said to proceed
    to all things or know all objects with certainty.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Worship with the Vyahritis Bhuh, Bhuvah, and Svar is said to worship Prajapati,
    the Self of All, as the sun or Eye of All.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Savitri formula is interpreted as choosing Savitr or Aditya, meditating
    on the god's splendour, and asking him to stir up thoughts.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Bhargas is identified with one placed in the sun or with the pupil in the
    eye, and its name is explained through rays, parching, lighting, delighting, and
    the movement of creatures to and from him.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The names Surya, Savitr, Aditya, Pavana, and Apas are explained through verbal
    or functional associations such as squeezing, bringing forth, taking up, purifying,
    and nourishing.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Self called Immortal is described as thinker, perceiver, goer, evacuator,
    delighter, doer, speaker, taster, smeller, seer, hearer, toucher, pervader, and
    one who has entered the body.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: When knowledge is twofold, perception through hearing, seeing, smelling, tasting,
    and touching is said to occur; when knowledge is not twofold, it is described
    as without effect, cause, action, name, comparison, or predicate, and as something
    that cannot be told.
  category: relationship
  evidence_refs:
  - ev:11
