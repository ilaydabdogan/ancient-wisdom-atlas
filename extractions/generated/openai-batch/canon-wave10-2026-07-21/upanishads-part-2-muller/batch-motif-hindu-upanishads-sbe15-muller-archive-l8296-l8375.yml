canonical_text:
  quote: '"from what root, tell me, does a mortal grow up, after he has been felled
    by death ?"'
  summary: The passage compares a human body to a tree, including blood, flesh, tendons,
    bones, and marrow. It asks how a mortal could grow again after being felled by
    death, rejects seed as the answer because seed comes from the living, and notes
    that a tree pulled up by the root does not regrow. It then states that Brahman,
    described as knowledge and bliss, is the principle for one who gives gifts and
    for one who stands firm and knows.
