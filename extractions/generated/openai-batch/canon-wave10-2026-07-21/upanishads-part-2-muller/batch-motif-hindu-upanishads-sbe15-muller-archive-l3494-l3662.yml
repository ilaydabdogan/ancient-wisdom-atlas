canonical_text:
  quote: "“Two birds, inseparable friends, cling to the same tree.”"
  summary: The passage describes the Self or Brahman as hidden in the heart, self-luminous,
    all-pervading, and knowable by purified wisdom rather than by ordinary senses
    or learning alone. It presents the image of two birds on one tree, one eating
    and one watching, and says that grief ends when the other lord is seen and known.
    It also describes the path of truth, the fading of desires, release from rebirth,
    and sages entering wholly into the omnipresent Self.
  language: English
  quote_policy: quoted
