canonical_text:
  quote: Om is the bow, the Self is the arrow, Brahman is called its aim.
  summary: The passage presents the Imperishable, the heavenly Person, Brahman, and
    the Self as the source, support, and hidden inner reality of beings, elements,
    ritual forms, senses, and worlds. It uses images of fire and sparks, a heart-cave,
    a bow and arrow, a bridge, and crossing darkness to describe origin, knowledge,
    meditation, and union with Brahman.
  language: English
  quote_policy: quoted
