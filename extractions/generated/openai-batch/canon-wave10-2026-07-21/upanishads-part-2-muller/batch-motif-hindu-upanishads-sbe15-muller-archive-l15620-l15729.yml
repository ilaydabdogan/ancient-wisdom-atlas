canonical_text:
  quote: ''
  summary: The passage describes meditation on Brahman/Atman, the seeing of Brahman
    as brilliant fire and light, the definition of Yoga as joining breath, Om, mind,
    and senses, and several similes in which vital airs are offered into Brahman as
    fire, Atman lights up like heated clarified butter, powers proceed like sparks
    and rays, and the worshipper becomes identified with inner light.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A seer cuts through what covered the personal soul, sees Brahman as fiery
    and bright like the sun, and obtains immortality after seeing him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Meditation is directed to the highest Being within and to objects named as
    body, Om, and mind; indistinct understanding becomes distinct.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the works of the mind are dissolved, Brahman or Atman is described as
    bliss, immortal, brilliant, the way, and the true world.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person whose senses are hidden as in sleep and who is in the cavern of the
    senses sees Praṇava, or Om, with pure intellect.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The person who sees Praṇava is said to become called Praṇava and to share
    attributes such as leadership, brightness, sleeplessness, and freedom from old
    age, death, and sorrow.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Yoga is defined as the joining of breath, Om, and the universe, and also as
    the oneness of breath, mind, and senses with the surrendering of all conceptions.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A simile compares a sportsman drawing out denizens of the waters with a net
    and offering them in the fire of his stomach to the Prāṇas drawn out with Om and
    offered in the faultless fire, Brahman.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Atman, called Not-breath, is said to light up when touched by the Prāṇas,
    as clarified butter in a heated vessel lights up when touched with grass and sticks.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The flaring-up form is identified as the manifest form of Brahman, the highest
    place of Vishnu, and the essence of Rudra, and it fills all worlds by dividing
    its Self endlessly.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Prāṇas and related powers proceed from the being like sparks from fire
    and rays from the sun.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The warmth of the body is described as the heat of the highest, immortal,
    incorporeal Brahman; the body is compared to clarified butter, and light appears
    in the ether within the heart through concentration.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The worshipper becomes identified with the light, and thought disappears with
    its support as an iron ball placed in earth becomes earth.
  category: sequence
  evidence_refs:
  - ev:10
