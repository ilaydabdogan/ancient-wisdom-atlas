  summary: A scholarly introduction discusses philological readings, the relative
    date of the Maitrayana-Brahmanaupanishad, alleged Vaishnava and Buddhist references,
    Vishnu as a manifestation of the Highest Spirit, Brihaspati/Sukra misleading the
    Asuras for Indra’s safety, Sakayanya’s opposition to unregulated renunciation,
    and Max Müller’s claim of continuity between the Upanishads and Buddhism. A footnote
    quotes a cosmological dialogue in which earth rests on water, water on air, air
    on ether, and ether has no support.
