canonical_text:
  quote: ''
  summary: The passage describes Siva/Rudra as the hidden lord, maker, and great Self
    dwelling in all beings and in the human heart. Knowing him frees one from fetters
    and death and brings immortality. The text describes a state beyond day and night,
    existence and non-existence, where Siva alone is present as eternal light. It
    then says his form cannot be visually perceived, but he can be known through heart
    and mind. The passage ends with prayers to Rudra for protection and for him not
    to harm offspring, lives, cattle, horses, or men, while petitioners call on him
    with oblations.
  language: English
  quote_policy: summarized
