canonical_text:
  quote: ''
  summary: The passage explains Prana and related vital breaths within the body and
    cosmos. Prana is compared to a king assigning functions; the breaths dwell in
    bodily organs and channels. Udana leads a person after death to worlds according
    to good or bad work. Cosmic entities such as sun, earth, ether, air, and light
    correspond to vital functions. Thought at death, Prana, light, and the self lead
    onward to the deserved world. Knowledge of Prana’s origin, entry, place, distribution,
    and internal state brings immortality.
  language: English
  quote_policy: summarized
