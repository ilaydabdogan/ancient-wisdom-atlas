    their possible but uncertain relation to later Sankhya and Yoga systems, and earlier
    Rig-Veda uses of numbers. It then notes textual obscurity and commentarial traditions
    for the Svetasvatara, describes the Prasna-Upanishad as a question-answer text
    associated with Pippalada and compared with the Mundaka-Upanishad, and surveys
    titles and affiliations of the Maitrayana-Brahmana-Upanishad.
  language: English
  quote_policy: summarized
