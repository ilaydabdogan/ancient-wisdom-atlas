canonical_text:
  quote: ''
  summary: An Upanishadic account of the udgitha presents Devas asking personified
    faculties to sing for them. Asuras corrupt speech, smell, sight, hearing, and
    thought by piercing those singers with evil. When the vital breath in the mouth
    sings, the Asuras perish. This breath is named and described as far from Death,
    removes evil/death from the other deities, carries them beyond death into cosmic
    forms, and becomes the center through which food satisfies the senses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Devas ask speech, scent-breath, eye, ear, and mind to sing the udgitha
    for them; each agrees and sings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Asuras identify each singer as a means by which the Devas may overcome
    them, rush at the singer, and pierce the singer with evil.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The evil affecting the first five singers is described as bad speech, bad
    smell, bad sight, bad hearing, and bad thought.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the breath in the mouth sings, the Asuras attack it but perish and scatter
    like a ball of earth hitting a stone; the Devas rise and the Asuras fall.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The breath in the mouth is explained through names: Ayasya because it is
    within the mouth, Angirasa because it is the sap of the limbs, and Dur because
    Death is far from it.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The same deity removes the evil identified with death from the other deities
    and deposits their sins at the end of the quarters of the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The deity carries speech, scent-breath, eye, ear, and mind across death; after
    being freed from death, they become Agni/fire, Vayu/air, Aditya/sun, the quarters/space,
    and the moon.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The vital breath obtains eatable food for itself, and the other deities enter
    into it so that food eaten by breath satisfies the other senses.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'The passage states benefits for one who knows this teaching: such a person
    rises by the self, is carried across death, and becomes supporter, chief leader,
    and strong ruler among relations.'
  category: speech
  evidence_refs:
  - ev:4
  - ev:6
  - ev:8
