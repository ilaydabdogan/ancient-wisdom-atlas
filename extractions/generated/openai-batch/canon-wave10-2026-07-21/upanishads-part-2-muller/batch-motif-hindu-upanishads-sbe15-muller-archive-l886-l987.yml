canonical_text:
  quote: ''
  summary: The passage is part of the introduction. It warns against conjectural reconstruction
    of old texts, discusses suspected later verses in the Katha Upanishad involving
    Death, Naciketas, boons, a supposed necklace, and the heaven-leading fire sacrifice,
    then introduces the Mundaka Upanishad as teaching the highest knowledge of Brahman
    beyond sacrifice or worship. It also explains the title Mundaka through shaving
    or razor imagery and notes a cautious comparison with Buddhist mendicants and
    Buddhist doctrines.
  language: English
  quote_policy: summarized
