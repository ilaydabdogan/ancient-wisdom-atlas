canonical_text:
  quote: ''
  summary: The passage first gives a brief teaching on Brahman through negation and
    the name “True of the True.” It then presents Yajnavalkya preparing to leave his
    household for the forest and arranging a settlement between Maitreyi and Katyayani.
    Maitreyi asks whether wealth can bring immortality; Yajnavalkya says it cannot.
    She asks instead for his knowledge of immortality. He teaches that husband, wife,
    sons, wealth, social classes, worlds, gods, creatures, and everything are dear
    for the sake of the Self; the Self is to be known, and by knowing the Self all
    is known. He adds that seeking these realities outside the Self leads to abandonment
    by them, and illustrates the point with sounds of a drum, conch-shell, and lute
    being grasped through their source.
  language: English
  quote_policy: summarized
