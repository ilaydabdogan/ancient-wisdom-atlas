canonical_text:
  quote: ''
  summary: 'The passage concludes a teaching on the Self: the Self is not reached
    by speech, mind, or eye, but is apprehended by affirming its reality; when desires
    and heart-bonds cease, the mortal becomes immortal and obtains Brahman. A death-route
    through one artery of the heart rising through the crown is described. The inner
    Self is likened to a thumb-sized Person in the heart, to be drawn from the body
    like pith from a reed. Naciketa receives knowledge from Death and becomes free
    from passion and death. The passage then opens the Mundaka Upanishad with a lineage
    of Brahman-knowledge from Brahma through Atharva and other teachers to Angiras,
    who answers Saunaka by distinguishing lower knowledge from the higher knowledge
    that apprehends the Indestructible. The Indestructible is described as imperishable,
    beyond sensory grasp, and the source from which beings and cosmic elements arise,
    with analogies of spider-thread, plants, and hair.'
  language: English
  quote_policy: summarized
