canonical_text:
  quote: ''
  summary: The passage presents meditative recognitions of Brahman in human faculties,
    natural phenomena, and divine contexts; describes the attainments of one who knows
    and worships Brahman; gives a post-mortem sequence in which the knower reaches
    several forms of Self and sings a Saman identifying himself with food, eater,
    and poet; then begins the Bṛhadāraṇyaka Upanishad with the sacrificial horse mapped
    onto the cosmos, weather, day and night, classes of beings, and the sea.
  language: English
  quote_policy: summarized
