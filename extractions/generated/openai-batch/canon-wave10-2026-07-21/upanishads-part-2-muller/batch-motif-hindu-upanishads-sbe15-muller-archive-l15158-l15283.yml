canonical_text:
  quote: ''
  summary: The passage identifies the Self with many divine names and with the Sun,
    presents renunciation and meditation as ways to perceive the Self, describes eating
    as a sacrifice to the Self through breath, fire, water, and invocations to the
    vital airs, and explains a metaphysical distinction between Purusha as eater and
    Prakriti or Pradhana as food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The same Self is called by many names, including lordly, creator, breath,
    ruler, solar, lunar, and divine names.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Self is described as the Sun, hidden by a thousand-eyed golden egg and
    compared to one fire hidden by another.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person is instructed to say farewell to living beings, go to the forest,
    renounce sensuous objects, and perceive the Self from the body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sun is described as golden, all-forming, all-knowing, highest-ascending,
    warming, thousand-rayed, and rising as the spirit of all creatures.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: One who knows this is said to become the Self of both Breath and Sun, meditating
    on and sacrificing to the Self.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A purification verse asks that Vasu, Agni, and the rays of Savitri purify
    contaminated food and sin.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before eating, the offered food is surrounded with water, and food is offered
    with invocations to Prana, Apana, Vyana, Samana, and Udana.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The mouth is treated as a fire in which food is offered, and the remaining
    food is eaten in silence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After washing, the practitioner meditates on the Highest Self as breath, fire,
    and the five vital airs that enter the body and satisfy all.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The text states that one who eats according to this rule does not in turn
    become food for others.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'A further explanation distinguishes the food and the eater: the thinking
    Purusha in Pradhana is the feeder, while the elemental Self and what is composed
    of the three qualities are food.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Animals are said to spring from seed, and seed is described as food.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The world is described as food called pleasure, pain, and error, and childhood,
    youth, and old age are also said to have the character of food.
  category: attribute
  evidence_refs:
  - ev:7
