canonical_text:
  quote: ''
  summary: The passage describes postmortem routes through fire, light, smoke, moon,
    rain, food, and rebirth, contrasting a non-returning path to Brahman worlds with
    a returning path governed by sacrifice and merit. It then gives ritual instructions
    for a man seeking greatness, including a twelve-day observance, collection of
    herbs and fruits, preparation of fire, ghee, and Mantha, and repeated offerings
    with Svaha invocations.
  language: English
  quote_policy: summarized
