  text: Through Yoga, the sage beholds a gold-coloured maker, lord, person, Brahman,
    and cause, leaves good and evil behind, and makes breath, senses, body, and related
    faculties one in the Highest Indestructible.
  category: action
  evidence_refs:
  - ev:1
