  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The knower is instructed to restrain the mind, set sense objects away, remain
    without conceptions, and merge thought in the hidden highest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'A practice of fixed attention is described: the practitioner presses the
    tongue toward the palate and restrains voice, mind, and breath.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After cessation of mind, the practitioner sees his own Self as smaller than
    small and shining as the Highest Self, becomes selfless, and obtains final liberation
    and imperishable bliss.
  category: sequence
  evidence_refs:
  - ev:3
