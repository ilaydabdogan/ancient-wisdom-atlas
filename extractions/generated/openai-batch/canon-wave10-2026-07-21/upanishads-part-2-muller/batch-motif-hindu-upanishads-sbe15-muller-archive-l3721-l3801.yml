canonical_text:
  quote: ''
  summary: The passage opens the Taittiriyaka-Upanishad with invocations for divine
    favor, adoration of Brahman and Vayu as visible Brahman, protection for speaker
    and teacher, and peace. It then introduces Siksha, the doctrine of pronunciation,
    followed by an exposition of the secret meaning of union under five heads. The
    supplied excerpt details correspondences for worlds, heavenly lights, and knowledge,
    and begins but does not complete the section on offspring.
  language: English
  quote_policy: summarized
