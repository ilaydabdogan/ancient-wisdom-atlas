canonical_text:
  quote: ''
  summary: The passage closes a teaching on arrival at the Highest through Vedic verses
    and Om, then presents the Sixth Question concerning the person of sixteen parts.
    Pippalada teaches that this person is within the body, sends forth vital and cosmic
    constituents, and receives them back as rivers enter the ocean, leaving the person
    partless and immortal. The students praise the teacher as one who carries them
    from ignorance to the other shore. The passage then begins the Maitrayana-Brahmana-Upanishad
    with a teaching that sacrificial fires culminate in meditation on the Self. King
    Brihadratha renounces sovereignty, performs forest penance, encounters the self-knowing
    Sakayanya, and rejects worldly pleasure because the body and all beings are perishable.
  language: English
  quote_policy: summarized
