canonical_text:
  quote: ''
  summary: The Valakhilyas ask a saint-teacher which among several named gods and
    principles is best for meditation. The teacher answers that these are chief manifestations
    of the highest, immortal, incorporeal Brahman; through them one proceeds to higher
    worlds and finally becomes one with the Purusha. Kutsayana's hymn praises an addressee
    as many gods, the earth, all, the imperishable, and the Self and maker of all.
    A following cosmogonic teaching describes primordial darkness, obscurity, and
    goodness, then identifies aspects with Prajapati/Vishva, Rudra, Brahma, and Vishnu,
    and says that the one becomes many and enters all beings as Self within and without.
  language: English
  quote_policy: summarized
