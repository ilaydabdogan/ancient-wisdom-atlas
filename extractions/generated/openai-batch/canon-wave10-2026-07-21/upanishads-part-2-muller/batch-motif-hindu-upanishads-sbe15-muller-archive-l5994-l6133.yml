canonical_text:
  quote: ''
  summary: Gargya repeatedly identifies persons or presences in moon, lightning, ether,
    wind, fire, water, mirror, sound, space, shadow, and body as Brahman. Ajatasatru
    rejects each formulation and gives alternate modes of adoration with promised
    results. Gargya becomes silent and asks to come as a pupil. Ajatasatru, though
    noting the unusual relation of a Brahmana learning from a Kshatriya, takes him
    to a sleeping man, calls to him, wakes him by touch, and asks where the intelligent
    person was during sleep. He explains that in sleep the intelligent person absorbs
    the intelligences of the senses and lies in the ether in the heart.
  language: English
  quote_policy: summarized
