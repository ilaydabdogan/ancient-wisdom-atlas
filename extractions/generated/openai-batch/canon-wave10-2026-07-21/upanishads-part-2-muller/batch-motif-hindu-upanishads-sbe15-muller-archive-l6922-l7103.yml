canonical_text:
  quote: ''
  summary: At Janaka Vaideha's sacrifice, a reward of cows with gold is offered to
    the wisest Brahmana. Yajnavalkya has his pupil drive the cows away and is challenged
    by Asvala, the Hotri priest. Asvala questions him about how the sacrificer is
    freed from death, day and night, the waxing and waning moon, and how the sacrificer
    approaches the Svarga world. Yajnavalkya answers through correspondences between
    ritual priests, bodily faculties, and cosmic powers, and then explains ritual
    recitations, oblations, worlds gained, mind, and breaths.
  language: English
  quote_policy: summarized
