canonical_text:
  quote: ''
  summary: The passage praises a colorless sun or god whose power produces endless
    colors and asks for good thoughts. It identifies the Self with fire, sun, wind,
    moon, firmament, Brahman, water, and Prajapati, then addresses the same divine
    principle as male, female, young, old, animal, cloud, seasons, seas, infinite
    source of worlds. It ends with an image of one red, white, and black unborn female
    producing offspring, one unborn male who loves and lies by her, and another who
    leaves her while she eats.
  language: English
  quote_policy: summarized
