canonical_text:
  quote: "“it had arisen in consequence of the neglect of Pie's command never to stay
    more than five days in one place.”"
  summary: 'The passage describes physical condition, diseases, childbirth, treatments,
    and disease fears among Semang, Sakai, Blandas, and Besisi/Jakun groups. It includes
    a Semang tradition of a fatal “great death” or plague whose onset, symptoms, and
    cause are reported: it came only twice, killed all who were attacked, and was
    said to follow neglect of Pie’s command not to remain more than five days in one
    place.'
  language: English
