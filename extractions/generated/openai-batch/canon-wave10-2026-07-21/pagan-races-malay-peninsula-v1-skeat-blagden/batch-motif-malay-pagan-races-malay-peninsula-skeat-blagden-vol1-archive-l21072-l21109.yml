canonical_text:
  quote: ''
  summary: The passage discusses Semang bamboo tubes and related terms, distinguishing
    and equating quivers, charm-tubes, and burial bamboos. It notes that a Semang
    go' could serve as a quiver or carry magical herbs and a sorcerer's paraphernalia;
    that goh and gah are decoratively indistinguishable and treated as forms of go';
    that gu' appears to refer to bamboo receptacles; and that Vaughan-Stevens's reported
    gi charm-tube with Disease-patterns is judged doubtful. It then introduces a classification
    of charm-patterns by the objects they adorn.
  language: English
  quote_policy: summarized
