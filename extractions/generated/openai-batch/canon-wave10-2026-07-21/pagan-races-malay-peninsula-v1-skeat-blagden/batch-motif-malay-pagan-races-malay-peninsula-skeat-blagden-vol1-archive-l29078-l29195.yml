canonical_text:
  quote: ''
  summary: The passage gives an ethnographic description of the Benua, contrasting
    their seclusion, family-based forest life, equality, lack of war, and alleged
    openness or simplicity with Malay influence, Islam, Christianity, and surrounding
    groups. It also compares the Benua or southern Peninsula aborigines with Bataks,
    Dayaks, Malays, Berembun tribes, and Menangkabau Malays, while presenting speculative
    claims about conversion, assimilation, corruption, and possible violence under
    intensified contact.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes Benua courtesy and politeness as habitual, while saying
    that an unresolved sense of wrong may lead to fury or madness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage speculates that if the Benua are drawn from seclusion into wider
    intercourse, their character may harden and they may add the kris to spells and
    replace tuju with amok.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Benua are said occasionally to embrace Islamism, but attachment to old
    habits, pride in the antiquity of their race, and lack of regard for Malays are
    said to make them averse to conversion.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Malays are said to be persuaded that the Benua will ultimately be amalgamated
    with them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage proposes that Christianity, if presented simply, would be received
    by the Benua, and that an intelligent and kindly missionary would gain father-like
    authority among them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage proposes that relations between the Benua and the Malays could
    be improved by placing their intercourse on a juster footing through the Singapore
    government and the Temenggong, identified parenthetically as the Sultan of Johor.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that the southern Peninsula aborigines, Bataks, and Dayaks
    have essentially the same character, and that this character can still be recognized
    in the Malay.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says that Benua individuals and families live detached in family
    groups in the forest, more in the presence of nature than of people.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says that family influence, simple solitary pursuits, and lack
    of disruptive institutions preserve harmony, equality, and an absence of appreciable
    social strife or ambition among the Benua.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Bataks and most Dayaks are said to preserve the Benua character at bottom,
    while having elaborated superstitions and social habits and acquired gambling,
    head-hunting, and cannibalism.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says that Benua nature remains recognizable in the Malays, although
    Islam, modern Archipelago history, and courts modeled on Islamic forms have altered
    its simplicity and artlessness.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: War is said to be unknown to the Benua and to the Berembun tribes, while Menangkabau
    Malays are described as increasing and spreading in their portion of the Peninsula.
  category: relationship
  evidence_refs:
  - ev:8
