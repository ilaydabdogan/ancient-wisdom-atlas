canonical_text:
  quote: ''
  summary: The passage describes Sakai loans, gifts, debts, property, cultivation,
    inheritance, and the authority of the Pelima or Penghulu. It emphasizes informal
    consent in contracts, collective or family property, debt service under chiefly
    decision, inheritance by descendants, ascendants, and collateral kin, abandonment
    of property when there are no heirs or epidemic death, and chiefly control over
    occupation of land.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sakai borrow knives, hatchets, other objects they cannot make, and also
    house clearings or crops from Malays; loans are said to be returned.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Contracts are described as requiring consent alone, with no regular form.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Donation is described chiefly as applying to a portable article such as a
    knife, and similar presents may be made by a son-in-law to a prospective father-in-law.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Debts may arise from failure to return a borrowed article that has been lost,
    from fines, and similar causes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A debtor and the debtor's family work for the creditor for one or two months
    according to the Penghulu's decision, while the creditor provides food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After working for the creditor, the debtor and family retire into the forest
    until their plantation can support them again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A debtor is socially despised and may be derisively given a killed monkey's
    muzzle as a portion of food.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: The Pelima or Penghulu is described as the petty chief of each Sakai village,
    with extensive authority short of capital power.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The chief's authority is said to rest on age and position rather than legal
    sanction, and the tribe is compared to a larger family circle.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Individual property is said not to exist in the main account; family property
    takes its place.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Cultivation is carried out in common by family members under the father's
    direction, and produce is shared among family members and possibly neighbours.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: A son who takes up land elsewhere is excluded from a share of the family plantation
    produce, though he is still welcomed when visiting his parents.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: A cited contrary statement says women may possess land, while at marriage
    such land passes to the husband; planted durian and other trees may remain a woman's
    exclusive property and may be transferred with a marked incision on the tree.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: The inheritance order is descendants, ascendants, and collateral branches
    of the same family.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: If there are no heirs in the stated classes, the house and clearing are abandoned
    as accursed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: If the deceased died of an epidemic illness, heirs abandon everything because
    they fear the soil or goods may contain the disease germs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: Property rights are described as collective, not individual, and the Penghulu
    designates the limits of ground each tribal member may occupy.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:18
  text: Even abandoned land may not be taken up again without the consent of the tribal
    chief.
  category: action
  evidence_refs:
  - ev:8
