canonical_text:
  quote: ''
  summary: The passage describes Jakun dealings with Malay chiefs, British officials,
    money, forests, land grants, and land tenure. It reports a small jungle-produce
    fee, statements of loyalty, complaints over forest sales, reluctance to use money,
    a practice of burying money, acceptance of British revenue collection, avoidance
    of land grants and registration, relocation after a death in a house, and an account
    of Rembau land transactions originating in gifts and later sales from aboriginal
    chiefs to settlers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A small fee called “penchong alas” was collected from Malays who gathered
    jungle produce, described as one dollar per man once in three years.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A chief described his relation to the Dato' of Johol with a formula stating
    that custom, agreements, and alliances cannot be altered or revoked.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some Batin or Jurukrah complain that Penghulus obtain large sums by selling
    forests.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Jakun are represented as satisfied when forests are reserved for their
    maintenance and as saying they do not know what to do with money.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: When given money, Jakun are said to take it home to the forest, bury it, and
    not disclose its location, so it is lost after death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: One man repeatedly came alone to Lister for money so that he could bury it
    without difficulty; he was described as desiring silver while not using it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Jakun conversation is described as full of proverbs and sayings, and Malays
    are said to admire their speaking ability while also knowing their simplicity.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Jakun are said not to object to revenue collection by British officials,
    while criticizing Malay handling of money and revenue.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Jakun are said to dread land grants and to leave the country for the interior
    mountains if pressed by binding taxation or registration.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The stated reason for objecting to land grants is a custom that, if a death
    occurs in a house, the occupants must leave the place and settle elsewhere.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The origin of Rembau land tenure is described as beginning with free gifts
    of forest land from the Batin, followed by presents and later land sales to Mohammedan
    settlers.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The price for land is described as a knife, weapon, cloth, or another article
    valued by the Jakun; later Beduanda chiefs sold waste lands for dollars.
  category: object
  evidence_refs:
  - ev:9
  - ev:10
