canonical_text:
  quote: ''
  summary: 'The passage describes reported antidotes and remedies for poison wounds,
    then surveys Semang weapons and implements: rejected claims about finished neolithic
    tools, probable earlier use of stone chips and flakes, bamboo and bone tools,
    Malay-origin iron knives and axes with possibly distinctive aboriginal hafting,
    prized imported weapons, and details on Semang spears and bows.'
  language: English
  quote_policy: summarized
