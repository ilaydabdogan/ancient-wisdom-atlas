canonical_text:
  quote: ''
  summary: The passage describes Tala’s temperament and musical lament for his absent
    wife, then recounts a fatal return voyage in which Pawang tied himself to his
    sister and her husband before all three drowned, while Tala and Pawang’s wife
    survived in the boat. It then describes Rembau Jakun/Batin political status, marriage
    between Menangkabau colonists and Batin daughters, the origin of the Beduanda/Waris
    group, recognition of Batin powers in mountains and forests, and matrilineal exogamy.
  language: English
  quote_policy: summarized
