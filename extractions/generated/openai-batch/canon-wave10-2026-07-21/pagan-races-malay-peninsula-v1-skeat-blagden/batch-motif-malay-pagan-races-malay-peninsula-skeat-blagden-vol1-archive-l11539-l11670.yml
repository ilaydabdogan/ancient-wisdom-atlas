canonical_text:
  quote: ''
  summary: The passage describes fishing, shellfish gathering, hunting, and trapping
    practices among several Aboriginal Malayan groups. It reports women fishing with
    rod and line in shallow water; a splashing method for catching sembilang; Besisi
    use of nets, traps, fish-fences, spears, and limited fish poison; Besisi shellfish
    collecting and shell refuse; Mantra poisoned bow-traps; and Benua-Jakun forest
    hunting of hogs and deer with dogs and spears.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some women are reported as expert fishers who use a light rod and line, stand
    in shallow water, and throw bait in a manner compared to fly-fishing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A method called kachau or mengachau sembilang involves splashing or dabbling
    for sembilang; the fish are said to mistake the splashing for that made by crabs
    along tidal mangrove waters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Besisi use the Malay casting-net, fish-traps set in dams or fish-fences,
    and the fish-spear; fish poisoning with tuba is said to be little practiced because
    it is discouraged by the Government.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Besisi, described as Orang Laut, collect shellfish mostly by hand on sandy
    foreshore flats, and discarded shells near houses sometimes form small kitchen-middens.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Mantra use poisoned bow-traps and darts; the described trap uses a springy
    rod with an ipoh-poisoned spike that is released by a slight touch.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Benua-Jakun obtain principal animal food supplies in the forest, especially
    wild hog, which is described as abundant in some districts.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Benua-Jakun hogs are killed with the help of dogs and spears; the larger dog
    is the proper hog hunter, though smaller dogs may also join the chase.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Benua-Jakun spear has a broad, thin-edged head on an approximately eight-foot
    shaft; the hunter carries it into the forest or on journeys and sticks it head-upward
    before a doorway when entering a house.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Roe-deer and sambhur are chased by the larger dog variety, while mouse-deer
    are generally hunted by the smaller dog variety.
  category: relationship
  evidence_refs:
  - ev:8
