canonical_text:
  quote: ''
  summary: The passage describes subsistence, trade, housing, weapons, travel, social
    organization, and ritual practices among Jakun/Benua-Jakun, Mantra, Besisi, and
    related groups. It notes harvest-time marriage festivities, mimetic dances at
    tribal feasts, objects associated with chiefs, burial rites including a miniature
    hut for the deceased person's soul, and traditions interpreted by the source as
    pointing to ancestor-worship and shamanism.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some Jakun of Johor cultivate rice, yams, plantains, water-melons, sugar-cane,
    occasional tobacco, and especially valued durian trees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mantra and Besisi hold a marriage-carnival at harvest-time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tobacco, betel substitutes, gambir, and lime are obtained by barter from Malays
    of the coast.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The northern Jakun, including Besisi and Mantra, use the blowpipe with poisoned
    arrows as a common weapon; bows and arrows are known but not employed, and the
    passage says they do not engage in tribal fights.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some blowpipes are fitted with a spear-point at the muzzle, and the Sabimba
    blowpipe is reported to have been introduced from Sambas in Borneo through sea-board
    Malays.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Benua-Jakun huts are generally built on piles, reached by ladder, and in some
    accounts are abandoned when a death occurs.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Jakun of Malacca build small huts raised on piles and surround them with
    thorn bulwarks for protection against tigers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: For river voyages, excepting the Sabimba, they use boats made from hollow
    tree-trunks, but they avoid and are said to dread the open sea.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Trade is described as controlled by Malays, who exchange cloth, pots, dishes,
    ironware, and similar goods for jungle produce, while also oppressing the Jakun
    through debt and unfair dealing; this is contrasted with treatment from Chinese
    traders.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: At tribal feasts, songs are chanted and mimetic dances are performed in imitation
    of jungle denizens.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The ritual performer is described as dressed in leaves and carrying a distinctive
    dance-wand.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that these feast performances are apparently a form of
    productive magic.
  category: other
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Batin or chief sometimes has a peculiar unidentified object as part of
    his regalia.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage lists peculiar marriage and burial rites, including the mound-ceremony,
