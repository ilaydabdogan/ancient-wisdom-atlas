canonical_text:
  quote: ''
  summary: 'The passage describes Benua-Jakun hunting, trapping, and fishing practices:
    dog-assisted hunting from canoes along streams; spring-spear snares used by Johor
    Benua and Berembun tribes; pit traps, bird-lime, and multiple river-fishing methods
    including canoes, rattan traps, fish-fences, and a bridge-like net apparatus.'
  language: English
  quote_policy: summarized
