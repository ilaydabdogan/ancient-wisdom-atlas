canonical_text:
  quote: ''
  summary: 'The passage describes Semang and Pangan dress and grooming practices:
    armlets and bracelets made from plant materials, seeds, rattan, metal, or fungus;
    some bracelets used as charms; men’s hair shaving, head fillets, protective head-dresses,
    flowers, and top-knots; a Perak Semang hair tuft explained as ordered by the deity
    Pie; and beard or moustache practices used as gender distinction.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Armlets are described as being made from bertam palm fibre, plaited rattan,
    Rock-vein fungus strings, and sometimes metal; the author did not see European
    bead armlets among the Semang of Kedah.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Perak Semang bead armlets or ligatures were often made like necklaces, with
    black and white seeds strung alternately; they could be narrow or broad enough
    to cover much of the arm.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Women are said to wear palas-leaf bracelets as a charm, while men wear tight
    bracelets of the Rock-vein Creeper on the left wrist; these bracelets are called
    Chin-ing-neng.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among Kedah Semang men, some had short woolly hair in spiral clusters, while
    most had adopted head-shaving; the passage compares this shaving to practices
    among Andamanese and local Malays.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author says the men he saw did not usually wear head coverings, though
    some made red-cloth turbans from cloth he gave them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: On special occasions, heads were bound with palm-leaf fillets; special head-dresses
    were also used for protection against diseases, and flowers were worn for ornament.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some boys wore a top-knot, and Vaughan-Stevens reported seeing men wearing
    it; for some Perak men, a frontal tuft was explained only by the reply that it
    was Pie’s order.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Kedah Semang men usually had little beard growth, though one short woolly
    beard and slight moustaches are reported; Eastern Semang men are said to pluck
    out the beard but retain the moustache to be distinguished from women.
  category: attribute
  evidence_refs:
  - ev:7
