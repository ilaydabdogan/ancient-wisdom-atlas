canonical_text:
  quote: ''
  summary: The passage describes Besisi blowpipe ornamentation, including customary
    patterns, magic emblems, occasional animal or reptile figures, and a conventionalized
    motif said to represent the body and limbs of the spectacled monkey. It also describes
    the blowpipe grip area, a cleaning rod, leaf stoppers against insects, dart parts
    and materials, polishing, and ingredients of Besisi dart poison. A footnote mentions
    a similar blowpipe device among the Mantra and disputes an earlier explanation
    of its purpose.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A blowpipe is described as ready for use after decoration with customary patterns
    or magic emblems used by the tribe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Besisi blowpipe patterns are described as mostly highly conventionalized rectilinear
    incisions, with occasional depictions of an animal or reptile such as a lizard
    on polished shafts.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Besisi explanation given to the author identifies the ordinary blowpipe
    and quiver pattern as a rudimentary representation of the limbs and body of the
    spectacled monkey or lotong.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The outer case of the Besisi blowpipe is usually divided by a central node,
    and the second quarter from the muzzle is usually left undecorated except perhaps
    for rings or zigzags because it is the part generally held during a hunting expedition.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The cleaning rod called jenghek is made from a perforated palm-wood rod with
    strips of palm leaf threaded through it and is worked up and down inside the blowpipe
    tube.
  category: object
  evidence_refs:
  - ev:6
- id: obs:6
  text: The muzzle of the blowpipe may be stoppered with leaves to keep out white
    ants, small wild bees called kelulut, and other insects.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Besisi names are given for parts of the blowpipe dart, including the shaft,
    butt-end, point, and nick above the point.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The dart butt-end and shaft are made from named creepers, light woods, and
    palm leaf-ribs, and the dart is carefully polished with memplas leaves.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Two accounts of Besisi dart poison list ingredients including ipoh or ches,
    malai, tenet, jenu or tuba fish-poison, ipoh creeper root, pepper, and arsenic.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: A footnote reports a similar blowpipe device among the Mantra as described
    by Vaughan-Stevens, rejects his explanation about producing a sharper tone, and
    states that the device strengthens, weights, and helps protect the blowpipe from
    insects.
  category: relationship
  evidence_refs:
  - ev:5
