canonical_text:
  quote: ''
  summary: The passage describes aboriginal rice-field protection devices, Sakai or
    related agricultural clearing practices, and a pre-felling charm ceremony. The
    ritual uses uprights, an east-west pole, a suspended hatchet helve, a branch,
    a bunglei shoot, a coconut-shell censer with benzoin, a chopper, and a hatchet
    blade. A magician faces the rising sun, works the implements through smoke in
    seven circles, and recites a charm asking spirits and four magicians for permission
    and bodily coolness so that the clearing may be opened without harm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rice was planted in open spaces among felled great trees, and suspended bamboo
    pieces on upright posts sounded in the wind to scare birds from the fields.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: When wind did not move the bamboo scarecrows, people operated them by cords
    or creepers converging on a small central shelter where a watchman was posted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The same scare apparatus was also used to frighten wild elephants away from
    jungle plantations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The agricultural work is divided in the passage into felling, burning, sowing,
    reaping, and offering of first-fruits.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A selected forest patch was usually cleared in the drier season with a hatchet
    and chopper, and a described felling method made one larger tree bring down several
    partly cut smaller trees.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After drying, felled timber was set on fire, leaving some thicker stumps;
    padi was planted in spaces between stumps before the wet season.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before felling, choppers and hatchets had to be charmed to avoid accidents
    attributed to evil spirits.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Women and children were not allowed to be present during the tool-charming
    because of dangers they might incur.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that in each village at least one man, and later usually
    the Penglima or village chief, knew the charms after the wizards had died out.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: The ceremony used two forked uprights supporting a horizontal pole running
    east and west, from which a hatchet helve was suspended.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: A forest-tree branch, a young bunglei shoot, a half coconut-shell filled with
    earth as a censer, a chopper, and the hatchet blade were placed beneath or near
    the pole.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: The ceremony began at sunrise when saplings were cut and erected.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:13
  text: The magician strewed benzoin incense over embers, faced the rising sun, knocked
    the blade from the hatchet helve, and suspended the helve.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The magician deposited and lifted the chopper and hatchet blade, crossed his
    hands in smoke, made seven successive circles in the smoke, and called aloud seven
    times.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The spoken charm addresses spirits of hill-locked basins, the Spectral Huntsman,
