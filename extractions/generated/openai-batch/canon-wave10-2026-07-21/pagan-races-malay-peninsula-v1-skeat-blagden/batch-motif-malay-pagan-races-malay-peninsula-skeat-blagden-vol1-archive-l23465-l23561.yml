canonical_text:
  quote: ''
  summary: The passage describes Semang/Pangan “gu'” bamboo tubes, or myth-bamboos,
    as bamboo receptacles once known only to the Puttos, used for preserving engraved
    records including Semang mythology and possibly history, and also for containing
    magical and medicinal implements. It then identifies features and named incised
    figures or objects on Bamboo No. 1, including a lotong monkey, Kari the Thunder-god,
    a throne and implements, and spears associated with Champa and Chalog.
  language: English
  quote_policy: summarized
