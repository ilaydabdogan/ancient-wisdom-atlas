  summary: The passage introduces a chapter on hunting, trapping, and fishing among
    aboriginal groups of the Malay Peninsula. It describes their hunting skill, sensory
    tracking, knowledge of animal places, weapon types, jungle travel, and expertise
    in snares, traps, and fishing methods. It also notes similarities and possible
    borrowing between Semang, Sakai, Jakun, and Malay techniques.
