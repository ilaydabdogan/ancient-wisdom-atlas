canonical_text:
  quote: ''
  summary: 'The passage describes ritual procedures for clearing, burning, and planting
    a rice field: tools are charmed and fumigated, a burning ceremony invokes lightning,
    fire, magicians, winds, and whirlwind, torches are kindled only by the magician,
    and the planting rite uses circles, tamun wood, a bunglei plant, incense, and
    explicit sympathetic reasoning for rice growth and protection.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a charm was completed, the hatchet-head was put back into its helve,
    the hatchet and chopper were returned to the owner, and the charm had to be said
    separately for each tool.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A first clearing was made around the middle point of a circle about twelve
    yards in diameter; the chopper and hatchet were turned seven times in smoke in
    strict silence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The burning ceremony took place when felled timber was dry enough; men, women,
    and children gathered at midday on the sheltered side of the clearing.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A censer was set up, and its smoke was used to fumigate a half coconut-shell
    containing coconut-oil and polishing leaves; the oil was named minyak b'rangsang.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The magician faced east, lifted the oil-filled shell to his lips, and recited
    a charm addressing Lightning and mentioning Fire, the Four Magicians, seven winds,
    and the whirlwind.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Participants dipped treebark torches into the oil and gave them to the magician,
    who alone was permitted to kindle them from embers in the censer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After their torches were kindled, the company went in various directions and
    set the fallen timber alight in as many places as possible.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After burning and after the first showers of the wet season, men prepared
    pointed dibbles from tamun hardwood saplings, with bark removed and a hollow at
    the thicker end for seed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At sunrise the magician and the sowing participants went to the field; near
    the middle, he drew a circle around himself with a tamun staff and placed the
    planting-sticks inside it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The company sat outside the circle in a wide irregular ring called the Rice-bin,
    or kepuk.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: A bunglei plant was planted at the centre, a tamun branch was placed near
    it, a censer with incense was set nearby, and seven small holes were made in the
    centre of the circle.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that tamun wood was chosen because the tree fruits low
    in a ring around its trunk, so that rice might by sympathy flower near the ground;
    bunglei was chosen because animals do not eat it, with the hope that rice would
    be similarly spared.
  category: relationship
  evidence_refs:
  - ev:7
