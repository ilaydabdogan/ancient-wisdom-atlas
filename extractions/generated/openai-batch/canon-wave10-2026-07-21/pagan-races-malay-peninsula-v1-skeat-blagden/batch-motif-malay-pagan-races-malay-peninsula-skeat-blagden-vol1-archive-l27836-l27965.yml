  summary: Ethnographic passage describing Semang/Negrito and Sakai dealings with
    Malays and other outsiders, including hunting and housing patterns, a Kedah Semang
    journey to Penang, barter and deception in trade, dependent labour relations,
    cultivation, and reported Sakai honesty and exploitation by Malays.
