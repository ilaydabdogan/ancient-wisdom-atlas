  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes the Negrito as living by bow and blowpipe and sleeping
    in temporary lean-to sheds where game is plentiful.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that the Sakai look down on the Negrito, while the Negrito
    is described as a cheerful hunter who looks down on nobody.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bendahara of Kedah sent two Kedah Semang to Penang for inspection by English
    friends.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One Kedah Semang passenger became frightened and tried to upset the small
    boat; the Malays killed him and threw him overboard.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The other Kedah Semang arrived safely, was kindly treated, received cloth
    and money, bought iron implements, returned to Ian, built a hut, and cultivated
    crops.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: In exchanging jungle produce for cloth, the Semang are described as often
    being imposed upon by Malays because they do not know the produce's intrinsic
    value.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says the Semang sometimes obtain tobacco from Malays by presenting
    medicines they claim come from particular shrubs and trees and represent as cures.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Upper Perak Semang are reported to have clearings, cultivate rice and other
    grains, and have houses, though some live more nomadically and return to houses
    at times.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Upper Perak tribes are described as dependents of the Malays, who call them
    to fell jungle, plant ladangs, collect jungle produce, and build houses in exchange
    for goods.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Sakai are contrasted with Negritos as living in houses and both planting
    and hunting, with many small clans surrounded by Malays and cut off from each
    other.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage reports De Morgan and Hale as describing Sakai honesty, peacefulness,
    kindness, and willingness to assist outsiders where not affected by Malay intercourse.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage reports that Malays cheated Sakai in trade, including an example
