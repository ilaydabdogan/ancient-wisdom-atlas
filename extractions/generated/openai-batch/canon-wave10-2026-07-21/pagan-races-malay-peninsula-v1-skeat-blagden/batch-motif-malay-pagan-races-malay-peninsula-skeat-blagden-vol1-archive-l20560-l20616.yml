  quote: ''
  summary: The passage describes Benua-Jakun time reckoning by north and south monsoons,
    crop and fruit seasons, stick positions for daylight, and nights as travel-distance
    units. It then describes Orang Laut/Akik handicrafts, especially boat-building,
    long voyages in fragile vessels, handmade sails, awnings, cordage, temporary coastal
    sheds for boat-building, residence in boats, and self-made fishing nets.
  language: English
