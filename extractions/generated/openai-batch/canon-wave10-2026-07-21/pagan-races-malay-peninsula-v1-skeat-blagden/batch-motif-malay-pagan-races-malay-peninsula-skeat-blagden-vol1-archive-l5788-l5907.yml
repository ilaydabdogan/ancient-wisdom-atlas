canonical_text:
  quote: ''
  summary: The passage describes food procurement, eating and drinking practices,
    rice and millet adoption, trade dependency on Malays, and methods of obtaining
    fire among aboriginal groups of the Malay Peninsula.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some tribes entering settled or Malay-linked conditions are described as dependent
    on Malays for food supplies, while more nomadic groups move after local food sources
    are exhausted.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thoroughgoing nomadic groups are said seldom to remain more than three or
    four days in one place before moving to another food source area.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The staple food of these groups is described chiefly as wild vegetable food,
    especially wild yams, roots, and jungle fruits, with hunting, trapping, and fishing
    used when plant supplies decline.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Less nomadic groups obtain rice from Malays by barter, and their own crops
    are described as insufficient for most of the year.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Eating is described as done by hand, with food placed on simple dishes such
    as banana leaves; bones of small animals or birds are held and gnawed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Women and girls are said to wait until men have finished eating.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Drinking implements include bamboo vessels, gourds, coconut shells, earthenware
    water pots, leaves, and the hand.
  category: object
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:8
  text: The Orang Laut are described as throwing water from the hand into the mouth
    accurately; mothers are described as letting water drip from the hand into an
    infant's open mouth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage presents a sequence in which the wildest groups do not eat rice,
    cultivation and eating of millet marks an early grain stage, and some less nomadic
    groups later barter for or cultivate small amounts of rice.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: Methods of obtaining fire are described as varying by group, including friction,
    flint and steel, trade matches with Malay names, and palm fluff as tinder.
  category: sequence
  evidence_refs:
  - ev:10
