canonical_text:
  quote: ''
  summary: Ethnographic description of Selangor Sakai chiefly offices, succession
    to the title of Batin, enforcement of custom, penalties, annual tribute, subordinate
    officers, and reported Ulu Langat Sakai punishments for murder, adultery, and
    theft.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that members of the tribe are guaranteed against dispossession.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the interior of Selangor, the Batin is described as chief of a group of
    Sakai villages that are usually near each other.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Subordinate titles listed under the Batin are Mentri or Jinang, Jukrah or
    Jekra, Penghulu Balai, and Penglima.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that a group of villages seldom has the full set of offices
    at one time, and that combinations of offices vary among groups.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Three titles are identified as also used by Malays of the Peninsula, while
    three are said to be otherwise used by the Jakun and borrowed by the Selangor
    Sakai.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The title of Batin is hereditary and usually passes to the eldest son; if
    there is no issue and no suitable close relative, the Jinang or Jukrah appoints
    a close relation of another Batin of the same tribe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Batin is described as executive and administrative head of the tribe,
    with patriarchal methods, and is required to enforce tribal customs and select
    seasons and methods for river fishing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Fines are described as the most common penalty; for insubordination or serious
    crime the penalty may be banishment or death by kris, with the author noting that
    banishment alone appears to be an original Sakai practice and that kris execution
    is likely borrowed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A small annual tribute of rice is said to be paid to the Batin by members
    of the tribe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Jinang represents the Batin when the Batin is absent and may govern without
    a Batin; the Jukrah marshals tribesmen for common work; the Penghulu is household
    and administrative officer; and the Penglima is executive officer.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: For the Ulu Langat Sakai, murder is reported as very rare, and a hypothetical
    murderer was said to be fined ten jungle-knives, ten hatchets, ten blowpipes,
    ten saucepans, and similar goods.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: In adultery cases, the man could be fined as for murder or no fine might be
    imposed; the woman was kept or taken over and was not punished.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Theft is reported as rare among the Ulu Langat Sakai, with no specific punishment;
    items taken from another person's house were regarded as borrowed rather than
    stolen.
  category: speech
  evidence_refs:
  - ev:8
