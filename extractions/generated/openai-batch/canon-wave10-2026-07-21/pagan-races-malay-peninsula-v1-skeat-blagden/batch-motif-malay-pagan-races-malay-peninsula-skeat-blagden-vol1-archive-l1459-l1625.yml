canonical_text:
  quote: ''
  summary: The passage reviews anthropological arguments about the relationship of
    Semang, Sakai, Negrito, Papuan, Melanesian, and other populations. It criticizes
    earlier broad racial identifications, summarizes comparative measurements of Negrito
    groups, notes uncertainty about Negritos in Borneo, and introduces the separate
    Sakai problem and older claims of Malay admixture.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: De la Croix is described as professing adherence to the Pan-Negrito theory
    while still distinguishing the Semang from the Sakai to a considerable extent.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: De Morgan is described as distinguishing Sakai peoples south of the river
    Plus from Semang north of it, noting hostility between them, but concluding that
    all the wild men of the Peninsula belong to one race identified with the Negritos
    of New Guinea.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Miklucho-Maclay is reported as stating that both the Orang Sakai and Orang
    Semang are pure-blood Melanesians, while the passage calls these two groups radically
    different types.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A footnote says Miklucho-Maclay and Meyer treated Negritos and Papuans as
    one stock, while Keane, citing Wallace and Flower, emphasized fundamental differences
    between Papuan and Negrito types.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage presents Sir William Flower's suggestion that the Negrito might
    represent an undeveloped type of an aboriginal race from which Negro and Papuan
    forms might be specialized derivatives, but states that this remains an unproven
    hypothesis.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Appendix table is described as a compact way to compare branches of allied
    Negrito races, with the warning that the measurements are too few to be conclusive
    and are not intended to prove connection.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that African pygmies observed by Sir H. Johnston may be
    shorter than Andamanese and Negrito groups of the Philippines and Malay Peninsula,
    while the latter three are practically of the same height.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage describes all four compared groups as brachycephalic, having woolly
    hair, and having skin color ranging from dark copper or chocolate to glossy black.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage notes that it remains disputed whether Negritos occur in Borneo,
    which would geographically connect the Malay Peninsula and the Philippines.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The opening of the Sakai problem says older writers attributed non-Negrito
    blood among the wild tribes of the Peninsula to admixture with civilized Malays,
    but also says the Semang and Sakai types are strongly contrasted.
  category: relationship
  evidence_refs:
  - ev:6
