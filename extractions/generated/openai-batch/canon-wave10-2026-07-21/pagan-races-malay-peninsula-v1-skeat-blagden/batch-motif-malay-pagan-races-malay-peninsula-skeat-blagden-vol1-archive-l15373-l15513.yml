canonical_text:
  quote: ''
  summary: 'The passage describes preparation of a poison-like weapon mixture from
    plant materials, water, animal parts, and Ipoh/Upas sap, then discusses Sakai
    implements and weapons: possible use of stone chips, bamboo and bone cutting or
    boring tools, metal implements obtained from Malays, spears with bamboo blades,
    disputed bow attribution, and blowpipe construction.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several named barks and leaves are placed in bamboo with water, heated, and
    their liquid is added to a pot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Additional barks, tubers, fruits, roots, and rattan sap are boiled separately
    and added to the mixture.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: Heads of centipedes and snakes and scorpions' tails are smoked between two
    knife-blades and added to the mixture.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The pot is boiled until the contents are reduced by one-half.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The liquid is filtered through a palm-leaf funnel into clean bamboo, returned
    to the pot with Ipoh or Upas sap, boiled to a golden-yellow syrup, and poured
    into bamboo tubes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that Sakai tribes, like the Semang, had not reached a stage
    at which stone implements would have been produced, though they may have used
    chips and flakes of stone for cutting.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Sakai are described as acquainted with cutting and boring instruments
    made of bamboo or bone and as obtaining axes, spear-heads, and choppers from neighbouring
    Malays.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hale is cited as saying that the Perak Sakai purchased spears and other implements
    from Malays, while some self-made spears had fire-hardened bamboo blades used
    for spring-traps.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Where iron blades are scarce, spear blades made of bamboo with palm-wood shafts
    are described as the natural and usual substitute.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Only two cases are said to attribute bow use to the Sakai, and the passage
    explains these cases as likely applications of the name Sakai to Negrito or Semang-related
    groups.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Sakai blowpipe is described as having outer and inner tubes made of the
    same material and arrangement as the Semang blowpipe, with a one-piece casing
    and a central node removed and smoothed when necessary.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Image captions identify Sakai of South Perak with blowpipes and describe Sakai
    dart-quivers with bamboo tubes or reeds, a node forming the bottom, a rattan ring,
    and a recess for wadding.
  category: object
  evidence_refs:
  - ev:10
