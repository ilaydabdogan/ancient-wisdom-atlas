  summary: The passage describes the Jakun use of the parang for cutting trees, clearing
    branches in jungle travel, and defense against wild beasts. It recounts a Jakun
    defending himself against a tiger with a parang, suffering serious injuries but
    killing the tiger. It then notes Negri Sembilan Jakun skill with weapons, especially
    accurate shooting and a described method of using the blowpipe.
