canonical_text:
  quote: ''
  summary: The passage reports an encounter between a gunboat and two Orang Sletar
    families, describing their initial shyness, subsequent barter after fair treatment,
    and fear of being carried to Gallang because of pirates. It also describes portrait
    sketches of a Sletar man and woman, then summarizes reports on the Orang Sabimba
    as forest nomads associated with fear of water, avoidance of Chinese people, and
    subordination in interactions with Malays.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several small boats and canoes approached an anchored gunboat near the shore
    and were identified as two families of the Sletar tribe, known to Malays as Orang
    Utan Sletar.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Orang Sletar families included two men, three women, and several children
    of both sexes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Orang Sletar were initially shy and difficult to persuade to speak, but
    after kind treatment and small presents, the men visited the gunboat daily with
    fish and some birds for barter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After fair dealing by the commander and crew, the Orang Sletar promised to
    visit the gunboat again in future and to tell others of their tribe to do the
    same.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: When asked why they had run away from the gunboat before, the Orang Sletar
    answered that they feared being carried off to Gallang, a place associated in
    the passage with fierce pirates.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A Sletar man sat steadily for a likeness, seemed to understand the process,
    and smiled slightly when the sketch was shown to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Sletar woman hid her face under her hair and would not show it until her
    young child was given to her; then she took a maternal position and the sketch
    was completed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Orang Sabimba are described as forest nomads without boats or canoes and
    as regarding water with terror.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Orang Sabimba are described as detesting the Chinese and always moving
    away from their vicinity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Malay women in Logan's host house ordered Orang Sabimba women about and arranged
    the limbs, face, and eyes of a female subject being sketched.
  category: relationship
  evidence_refs:
  - ev:5
