canonical_text:
  quote: ''
  summary: The passage describes Semang fishing implements and methods, including
    basket scoops, rods and lines, harpoons, cooperative fish-driving, and possible
    but unobserved stream poisoning. It then describes Sakai hunting and trapping
    methods, including bamboo blowpipes with poisoned darts, tactics for attacking
    elephants and other large animals, use of dogs, and the b'lantek spring-spear
    trap.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Semang use a small bamboo basket-work scoop to catch small fry in pools,
    sluggish waters, or places where retreat is cut off.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For angling, the Semang use a straight unpeeled stick as a rod, a bark-fibre
    line fastened to the rod tip, and no reel.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Semang use fish-spears and harpoons to kill or capture large fish and
    tortoises.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Siong, a Semang harpoon was about ten feet long, with a palm leaf-stem
    shaft and an iron head obtained from local Malays.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: In a shallow obstructed river, one Semang harpooner hid behind a fallen tree-trunk
    or snag while another drove fish upstream toward him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The narrator says Derris elliptica root stream-poisoning is a general Peninsular
    tribal fishing method, but that he neither saw nor heard of it among the Semang
    at Siong.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Perak Sakai use bamboo blowpipes to shoot poisoned darts at birds, monkeys,
    and other small animals in high trees, and a reported case is mentioned of a leopard
    killed with a blowpipe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: To kill an elephant, the Sakai are described as stalking it from behind, laming
    it with a pointed stake in the sole of its foot, and then shooting poisoned darts
    from behind a tree.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Sakai of Perak, like the Semang, use dogs in the chase.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Sakai use traps and snares, including the b'lantek spring-spear trap,
    for game ranging from rhinoceros to porcupine; the spear points may be fire-hardened.
  category: object
  evidence_refs:
  - ev:8
