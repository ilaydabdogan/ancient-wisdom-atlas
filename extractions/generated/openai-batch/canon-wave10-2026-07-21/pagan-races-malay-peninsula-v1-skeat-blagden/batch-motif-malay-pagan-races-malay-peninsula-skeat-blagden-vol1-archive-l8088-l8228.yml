literal_observations:
- id: obs:1
  text: An incantation addresses the Mati-anak of the outcrop, calls for it to return
    to the outcrop, speaks of plucking out and neutralising the demon, commands the
    poison to descend, and calls the speaker's Neutraliser to rise.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the words are spoken, the speaker spits twice upon the necklace, ending
    the ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The plants used for the necklace must be pulled up and must not be cut or
    dug up.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Selangor Sakai are described as wearing copper, brass, and iron arm-rings
    and bracelets more commonly, and as preferring metal finger-rings, though rings
    from jungle materials are still sometimes made.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Perak Sakai men are described as wearing long wavy hair down to the shoulders
    in a wild condition, while wilder-tribe women are said to wear hair in a mop;
    contact with Malays may lead to tying the hair back in a knot like the Malays.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Iron is reported as not to be used for cutting hair or fingernails, and the
    wilder tribes are said never to have their hair cut; body hair is also left untouched.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: For washing head and hair, scraped inner bark of a thorny creeper is applied
    with water and produces thick lather; the author suggests it may be the b'luru
    climber used by Malays as a soap substitute.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Men sometimes wear a cord with two small knots or rosettes as head-dress,
    while women are said to prefer flowers of the field in their hair.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Specific Sakai women are described wearing white flowers in the ears, a grass
    tuft in the hair, a plant passed through the ears and hanging down the back, and
    a tall plant in the chignon.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Sakai women occasionally wear Negrito women's combs, including decorated bamboo
    combs and combs made from small wooden teeth bound tightly together.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: When Sakai women wear long hair, they may adorn the head with fillets and
    bouquets held by a comb or a long dagger-shaped bamboo pin with incised patterns.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Fillets and bouquets are generally gathered fresh in the forest, though dried
    plaited plants are also worn.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: Sakai women wear porcupine quills and other materials through the ear-lobe,
    use rolls of cloth or other materials to enlarge the orifice, insert short bamboo
    tubes with flowers, and may substitute earrings of copper, beads, or a flower
    stalk.
  category: object
  evidence_refs:
  - ev:10
