canonical_text:
  quote: ''
  summary: 'The passage describes Sakai bamboo stampers or tuang-tuangs decorated
    with magical designs and used as paired sounding instruments in ceremonies. It
    gives Vaughan-Stevens''s explanations for designs on two bamboo specimens: squatting
    human figures, chevrons, a fish-fence and trap in a river, a fire sign, and a
    crooked bamboo wizard''s staff bearing a charm against a vampire, epileptic attacks
    identified with an ape-demon, and madness identified with an Argus-pheasant demon.
    The staff designs include fences, posts, vampire feet and loin-cloth, seven bamboos
    from the Tabong legend, bamboo leaves, clouds, vampire wings/body, and Argus-pheasant
    feather, foot-scale, and tail-eye patterns. Several explanations are explicitly
    treated as uncertain or unconvincing by the authors.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tuang-tuangs are described as bamboo tubes closed at one end by a natural
    node and open at the other.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tuang-tuangs were decorated with magical designs, used in Sakai magic
    ceremonies, and usually struck on the ground in pairs to produce musical notes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On Bamboo No. 1, the lowest design is explained as a man and a boy in sitting
    or squatting postures; the informant reportedly demonstrated the posture.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A chevron band above the lowest design is explained as angles of the boy's
    knee and ankle repeated around the bamboo, but the text says this explanation
    is the least convincing in the series.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: One design is explained as a long fish-fence with a trap in a river; a wavy
    line represents fish movement in water and a dotted straight line represents fence
    posts viewed from above.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Another design is explained as a man warming his hands at a fire, with intertwined
    fingers forming the sign for fire; the authors state that this explanation is
    not very convincing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bamboo No. 2 is described as a crooked bamboo wizard's staff containing a
    charm against the vampire, apes glossed as epileptic attacks, and the Argus pheasant
    glossed as madness.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that the Sakai vampire is regarded as a flesh-and-blood
    being rather than a demon, while the ape-demon and Argus-pheasant demon can pass
    through walls and hedges and the vampire cannot.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the fence pattern, dots represent fence-post tops, projections represent
    the vampire's feet and indirectly the vampire itself, and a double row of dots
    represents the vampire's loin-cloth.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: A row on the staff shows the seven bamboos of the Tabong legend, with intervening
    figures identified as bamboo leaves, vampire wings, clouds, and the vampire's
    wings and body.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: 'Later divisions show figures from the Argus pheasant: feather figures, foot
    scales, and eyes on tail-feathers; clouds are said to be emblematic of nocturnal
    life like the vampire.'
  category: attribute
  evidence_refs:
  - ev:10
