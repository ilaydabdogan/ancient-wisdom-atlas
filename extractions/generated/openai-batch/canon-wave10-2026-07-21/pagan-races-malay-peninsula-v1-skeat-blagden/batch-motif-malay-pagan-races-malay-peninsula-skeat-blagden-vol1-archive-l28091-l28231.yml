  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage attributes to the Sakai strong knowledge of the jungle and skill
    in finding and capturing game.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: In an earlier period, the Sakai are described as having no fixed abode because
