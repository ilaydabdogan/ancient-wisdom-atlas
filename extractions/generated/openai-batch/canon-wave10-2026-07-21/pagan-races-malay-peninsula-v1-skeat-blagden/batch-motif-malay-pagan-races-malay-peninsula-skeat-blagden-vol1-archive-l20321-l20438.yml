canonical_text:
  quote: ''
  summary: Ethnographic passage describing Sakai river-raft travel, primitive tin
    washing and prospecting, Ulu Langat Sakai daily subsistence work, Blandas bark-cloth
    and basketry, Besisi mat-work, decorated pouches, dug-out canoes, paddle forms,
    and brief comparisons with Malays, Chinese, Dayaks, and Jakun boat use.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People identified in the note as Sakai did not usually work rafts back upstream
    through rapids; after reaching a destination they returned on foot through forest,
    leaving rafts to drift downstream.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some more civilised Perak Sakai, including in Ulu Kinta, practiced primitive
    tin mining by washing stream tin known in Malay as lampan.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Malays and Chinese regarded the Sakai as strong prospectors and paid them
    for prospecting work when they could be induced to do it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ulu Langat Sakai daily routine includes early rising, going into the jungle
    for hunting or produce, returning for a meal, inspecting traps and fishing-stakes,
    and collecting animals shot with blowpipes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Blandas of Kuala Langat made bark-cloth by detaching and pounding Artocarpus
    bark in methods similar to those of the Sakai.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Blandas wooden mallet for pounding bark-cloth has transverse ridges or teeth
    on its underside, used to separate fibres and soften the material.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Blandas bark-cloth is usually undecorated, though Artocarpus sap stains it
    a deep reddish tinge; the passage also names Blandas baskets and states that Malays
    copy their wallet patterns.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Besisi women of Kuala Langat make sleeping-mats, small square sitting-mats,
    mat-work bags, and small woven pandanus or rush-work pouches carried at the waist.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Besisi mat material is mainly pandanus or screw-pine leaves torn into strips
    with a short wooden holder fitted with iron teeth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Besisi pouches are decorated with raised or coloured rush-work or with coloured
    threads stitched along the desired pattern.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Besisi are described as expert builders of small dug-out canoes, with
    paddle blades generally longer and narrower than Malay paddle blades; the writer
    did not recall seeing a Jakun sail his boat on the Selangor coast.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A note compares Besisi small square mats to sitting-mats worn by Dayaks and
    other non-Mohammedan tribes of the Malay Archipelago, while saying Peninsular
    tribes carry such mats rolled rather than wearing them.
  category: relationship
  evidence_refs:
  - ev:8
