    from original forest habits to Malay contact and Malay-supplied or Malay-induced
    commodities.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the described Semang barter method, Malays deposited commodities in an
    open space near known Semang camping grounds and then withdrew.
