canonical_text:
  quote: ''
  summary: The passage describes Malay influence on aboriginal groups’ material habits
    and several barter arrangements involving Semang, Pangan/Eastern Semang, and Kedah
    Semang. It emphasizes non-contact barter, trade in forest products and Malay goods,
    unequal valuation, medicinal exchanges, dependence on Malay villages for commodities,
    and limited subsistence independence through rice cultivation.
