canonical_text:
  quote: ''
  summary: 'The passage describes the close of a Selangor Sakai rice-feast or harvest
    rite, including washing, greetings, betel, incense or smoking-shell actions around
    the pillar bearing the Rice-soul, distribution of rice, and departure etiquette.
    It then describes a water-powered bamboo noisemaker used by Selangor Sakai to
    scare monkeys from fruit trees. The passage closes with notes on Blandas agricultural
    rites and two padi-related charms: one expelling Earth-demons before opening a
    clearing, and one calling the Rice-soul home at harvest.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the meal, guests washed their hands in water placed in coconut shells
    and greeted others of the same sex by extending the hand without rising.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Betel-leaf was handed round while the host and his wife ate in a corner of
    the hut; after eating, they also exchanged greetings with the guests, and the
    host's wife exchanged greetings with the other women.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The magician removed incense from the censer, offered the smoking shell once
    to every adult, then passed it seven times around the pillar on which the Rice-soul
    was hung and set it at the foot of the pillar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Unboiled rice remaining from the three days' harvest was divided equally among
    the guests, while uneaten boiled rice from the feast was assigned to the magician.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Guests living at a distance departed and were accompanied by the owners of
    the rice field; before departure, the women alone greeted the host seven times.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The host was not permitted to accompany anyone home until the most distinguished
    guest had departed, and all guests left early enough to reach their dwellings
    before nightfall.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The host's wife, although seated near him, received no formal greeting except
