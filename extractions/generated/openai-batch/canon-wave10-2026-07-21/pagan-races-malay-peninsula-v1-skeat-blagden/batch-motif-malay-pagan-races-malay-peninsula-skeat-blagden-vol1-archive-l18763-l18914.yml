  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The passage says no direct record had been obtained of the Blandas rice-planting
    ceremonies in K. Langat, but the author believed their agricultural rites were
    largely borrowed from Malay neighbors and cited two padi-planting charms as partial
    support.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the clearing charm, the speaker uses leaves and shoots to chase Earth-demons
