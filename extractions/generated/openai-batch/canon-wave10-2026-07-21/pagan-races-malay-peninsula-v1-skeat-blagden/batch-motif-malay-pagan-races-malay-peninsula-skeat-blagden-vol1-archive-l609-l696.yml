canonical_text:
  quote: ''
  summary: 'The passage describes practical ecological knowledge attributed to aboriginal
    groups of the Malay Peninsula: close observation in trapping, fishing, tracking,
    blowpipe use, extensive use of edible and treated poisonous plants, obtaining
    water from creepers and bamboo, preparation of dart and fish poisons, use of rare
    bamboo for blowpipes, and a brief note on ancestral wanderings and the distinction
    of Semang, Sakai, and Jakun groups.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Itesisi method for securing the argus pheasant and the method of splashing
    a rod tip in water to catch sembilang fish are described as outcomes of close
    observation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Springes and traps for monkeys, wild pigs, small mammals, and birds are described
    as complicated devices that require knowledge of the animals' haunts, habits,
    and likely paths.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage attributes to the groups trained abilities in detecting game at
    a distance, blowpipe skill, sight for seeing small animals through foliage, and
    smell keen enough to track snakes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wild races are said to use many edible plant parts, including fruits,
    seeds, roots, tubers, stems, bark, leaves, shoots, buds, ferns, and fungi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some poisonous plants are made edible through treatment, including perah fruit
    when cooked and wild yams after washing out the poison.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When in doubt about the edibility of a fruit, the people are said to use birds
    and monkeys as guides.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Water is obtained by tapping wild creepers and from the hollow internodes
    of certain large bamboos.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The upas tree, upas creeper, and tuba or fish-poison creeper are identified
    as main ingredients of dart-poison, and tuba is also associated with stupefying
    fish in streams.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bambusa Wrayi or longinodis is described as a rare bamboo with very long slender
    internodes, growing only on two or three mountains and selected for making a jointless
    blowpipe.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says the ancestors of these races reached the Malay Peninsula
    after long wanderings and identifies Semang, Sakai, and Jakun as three distinct
    races.
  category: sequence
  evidence_refs:
  - ev:7
