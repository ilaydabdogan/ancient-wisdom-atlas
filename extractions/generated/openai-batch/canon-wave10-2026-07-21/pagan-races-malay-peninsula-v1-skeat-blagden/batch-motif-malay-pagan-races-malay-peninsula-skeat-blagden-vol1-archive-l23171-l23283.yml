canonical_text:
  quote: ''
  summary: 'Ethnographic discussion of quiver, blowpipe, tube, and comb designs among
    the Semang/Negritos of Perak: ring-line groups, hatchings, blank centre panels,
    and gendered epidemic patterns are described or conjectured as charms against
    lightning, diseases, serious diseases, and epidemics.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A form of design on arrow-quivers is said to be a charm against lightning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Quivers in the Berlin Museum usually show five to seven triple ring-line groups
    placed at roughly equal distances; where there are six groups, a wider central
    space is often left.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The arrangement of these quiver groups is said to correspond to common panel
    arrangements on tubes and combs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A simple ring-line group with no specific import is described as acting as
    a general charm against diseases.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Single and double hatchings may appear within ring-line groups while panels
    remain vacant, and the same simple figure may appear in all panels or in a second
    panel of a pattern.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The text says these figures may recall charcoal stripes placed by sick persons
    on diseased body parts, or special signs used similarly by the Puttos.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: For differentiated panel patterns, the author states that positive data are
    completely lacking, and no panel except possibly the middle one is more prominent
    than the others.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: Undivided patterns covering a whole tube are described as charms against serious
    diseases.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage describes simple ring-lines and complicated disease designs as
    two extremes forming a foundation for subsequent development.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In an occasional Semang practice, a pattern may be inserted in the centre
    panel while the rest is left free; the centre panel is generally indistinguishable
    from other panels and its size may lack special import.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage suggests that at a later stage the centre panel may have been
    reserved for the chief disease-pattern, and notes a stage with a simple specialised
    central pattern plus added incised-line panels above and below.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Descriptions often treat the size of the vacant centre panel as indifferent,
    but the panel's separating effect is described as consistently recognized.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Vaughan-Stevens is reported as saying that patterns with a vacant centre panel
    prevail against epidemics, and that epidemics are drawn as two undivided patterns
    separated by ring-lines, the upper for men and the lower for women.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage conjectures that blank centre panels are intended to separate
    men's and women's patterns; quiver Wi is described as having an empty centre panel
    and as purporting to protect men and women alike from a disease common to both.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: Vaughan-Stevens is reported as saying that diseases attacking both sexes are
    warded off by patterns on men's quivers and blowpipes because women are usually
    near the men; women generally do not use quivers as charms, though there is no
    rule against it.
  category: speech
  evidence_refs:
  - ev:11
