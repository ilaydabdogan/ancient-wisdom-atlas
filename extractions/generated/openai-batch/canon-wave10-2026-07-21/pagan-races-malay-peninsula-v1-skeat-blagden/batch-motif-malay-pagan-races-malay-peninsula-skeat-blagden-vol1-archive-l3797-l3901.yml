canonical_text:
  quote: ''
  summary: The passage describes Sakai physical adaptation, children’s endurance of
    hunger, a young men’s game called K'lupent involving painful rattan or string
    blows, a children’s tug-of-war, and a summary of Sakai cultural practices, material
    culture, religion, marriage observance, and fear of death or ghosts. It ends by
    introducing the Jakun as a southern mixed group.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Sakai people had become accustomed to clothes and better-built
    houses, making them more susceptible to changes of temperature; Sakai children
    are said to endure lack of food better than Semang children.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Younger Sakai men play a game called K'lupent while sitting around the fire
    in the evening, as women plait mats and baskets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In K'lupent, a player seeking a girl’s favour tries to disgrace his opponent
    and increase his own esteem among the women.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: K'lupent is played with short rattan slivers, or sometimes string, manipulated
    so that blows can cut the skin or cause pain.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Players sit opposite one another with bare arms, set small stakes, challenge
    each other to endure a named number of blows, and the loser is scorned if he cries
    out for the blows to cease.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sakai or Blandas children know a form of tug-of-war in which children on each
    side pull a rope in opposite directions; the author says this was probably borrowed
    from Malay children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The summary describes the Sakai as largely nomadic, initially shy, and sociable
    and talkative once confidence is gained; it also says they may live in tree-huts
    or other temporary shelters and wear tree-bark clothing unless they have adopted
    Malay clothing.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage describes Sakai facial tattooing, scarification, body-painting,
    black and white bead-necklaces, nose ornaments, and the absence or rarity of circumcision
    and tooth-filing.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Sakai distinctive weapon is described as a perfected bamboo blowpipe;
    they are said to lack boats and generally not use rafts, to have musical instruments
    similar to the Semang, to barter jungle products, and to practice primitive agriculture
    with a pointed stick.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says little is known of Sakai religion, but mentions a deity called
    Tuhan who appears somewhat analogous to the Semang Kari; alleged totemism is described
    as unproved.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Sakai are said to be strict in observing the marriage tie and to have
    great fear of death or of the ghost of the deceased, sometimes burning down or
    deserting an encampment where a death occurred.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage introduces the Jakun, or Wallace’s “savage Malays,” as part of
    southern mixed tribes divided into three main and two subordinate groups.
  category: relationship
  evidence_refs:
  - ev:11
