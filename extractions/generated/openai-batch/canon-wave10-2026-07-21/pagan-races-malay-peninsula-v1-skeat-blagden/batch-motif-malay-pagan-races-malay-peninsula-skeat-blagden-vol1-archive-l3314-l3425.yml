canonical_text:
  quote: ''
  summary: The passage compiles physical-anthropological notes on Sakai/Senoi/Blandas
    people, especially skull form and hair. It cites Rudolf Virchow and Vaughan-Stevens
    on a Sakai woman's skull, Sakai hair locks and specimens, contrast with E. Semang/Pangan
    hair, body-hair growth, and a Sakai tradition that a reddish hair type called
    “Water hair” was the original form.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rudolf Virchow is cited as discussing height measurements of individuals measured
    by Vaughan-Stevens and as describing a skull of a Sakai/Senoi woman.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The skull of the Sakai/Senoi woman is described as orthodolichocephalic.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The formation of the nose on that skull is described as depressed to such
    an extent that Virchow was tempted to regard it as pithekoid.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A lock of hair from a Sakai/Senoi man from the north of the Peninsula was
    accompanied by a memorandum stating that the man's clan does not cut the hair.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sakai hair lock is described as wavy and is contrasted with the spirally
    curled structure of E. Semang/Pangan hair.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The Sakai hair lock is described as blackish, slightly brownish and glossy
    in reflected light, light brown under the microscope, with a dark often interrupted
    medulla and pointed, broken, or split ends.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Vaughan-Stevens says that Sakai/Blandas body hair is naturally thin and scattered,
    and that the hair on the body, back of the head, and under the arms grows slightly
    upwards.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: An old Batin chose specimen No. 39 as a typical example of Sakai/Blandas hair,
    and tradition declared it to be the original form.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In Vaughan-Stevens' account, the Sakai themselves say straight hair sometimes
    found among them comes from cross-breeding with Malays and call it coarse; the
    supposed original type is called “Water hair” or “Rambut Ayer,” has a reddish
    tinge, and usually does not turn white.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Specimen No. 39 is from a 35-year-old Sakai woman; specimens Nos. 40 and 41
    are from Sakai men aged 75 and 37; specimen No. 43 is from three children.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A later specimen, No. 105, is described by Virchow as an immense shock of
    hair reaching 30 cm., consisting of thick glossy black hairs with a reddish tinge
    toward the tips.
  category: attribute
  evidence_refs:
  - ev:9
