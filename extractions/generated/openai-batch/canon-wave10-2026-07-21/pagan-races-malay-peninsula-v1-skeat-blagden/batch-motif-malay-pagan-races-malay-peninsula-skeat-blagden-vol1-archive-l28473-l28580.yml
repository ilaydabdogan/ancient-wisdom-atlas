canonical_text:
  quote: ''
  summary: An ethnographic account describes a party of Mantra visitors brought from
    Malacca to Singapore by Logan's Malay writer. The visitors fear the sea crossing,
    hunt birds and bats while staying in Logan's compound, compare Singapore unfavorably
    with Malacca because of its limited forest, admire a Chinese temple, and are described
    individually, especially Pawang, who is treated by companions and local Malays
    as a knowledgeable medicine and charm specialist.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Logan's Malay writer, Mohammed bin Haji Abdul Fatha, brought a party of Mantra
    to Malacca and then to Singapore so Logan could learn more about them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The visiting party consisted of Pawang and his wife, Parut and his wife, and
    Tala.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Mantra visitors hesitated to make the voyage because the passage says
    their people, like interior tribes generally, had a hereditary dread of the sea.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the vessel they were placed below deck, became seasick, and one man who
    looked at the rolling waves retreated below again in fear.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: While staying in Logan's compound, they shot birds with poisoned arrows and
    ate bats after broiling them slightly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: They judged Singapore poorly when birds and forest were scarce, and said they
    could not live where there was so little forest.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: When asked what price the Mantra would accept for Gunong Berembun, Pawang
    answered, “Ten godowns.”
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Of the sights in Singapore, the Chinese Temple pleased them most, but they
    still declared Malacca a finer place.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Pawang was regarded by his companions as more able and knowledgeable, and
    local Malays sought herbs and charms from him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Women in particular regarded Pawang as a magician, and many threw themselves
    at his feet when first approaching him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Parut is described as indolent, good-natured, contented, and apparently unconcerned
    with care or thought beyond the moment.
  category: attribute
  evidence_refs:
  - ev:7
