canonical_text:
  quote: ''
  summary: The passage describes two Sakai Perak designs. Fig. 13 is an inherited
    bamboo charm-pattern, only partly remembered, associated with a tabong legend
    and used to drive demons from a warm roof-loft. Fig. 14 explains the pattern of
    a tuang-tuang sounded before entering a swamp to collect nipah or similar acid
    palm fruits; the design maps swamp features, palm vegetation, hillocks, hidden
    dangers, fruit, millipedes or scolopendra, and the charm’s purpose of making the
    insects sleep so gatherers are protected.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tradition explaining Fig. 13 is said to be no longer current, and two
    different versions were given for each of its figures.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bamboo bearing the Fig. 13 pattern had passed from father to son for three
    generations.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Fig. 13 bamboo pattern was recognized as a charm-pattern intended to drive
    away demons seeking shelter on cold nights in the warm upper story or roof loft.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some figures in the Fig. 13 pattern were still recognized, while others were
    uncertain and retained by ancient custom; the remembered tradition connected the
    pattern in some way with the tabong legend.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: One important Fig. 13 figure was a rattan creeper with fruit and leaves; a
    whip appeared in the same figure, and the rattan forms depended on the use to
    be made of it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fig. 14 is described as the original pattern of a tuang-tuang sounded before
    entering the swamp to collect acid fruits of nipah or k'lubi asam palms.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The acid palm fruits are used as spices by the Sakai.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The palms described are stemless, with leaves growing from the ground in a
    tuft and root-clumps forming small hillocks in swampy ground.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The palm hillocks are described as full of scolopendra attracted by the fruit;
    because of these creatures, women are generally not allowed to pick the fruit,
    which is the men’s work.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The figures marked at the top panel are called a frogs'-leg pattern and are
    said always to be used as the symbol of a swamp; their placement at top and bottom
    signifies that the fruit region is wholly swampy.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Parts of the design represent interlaced palm leaves, luxuriant vegetation
    requiring a parang to cut a passage, root-hillocks on the landward side, and a
    slight rising of ground at the swamp entry point.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The pattern includes dead palm-stump clumps and soft pathways that may conceal
    pointed palm shoots capable of wounding a naked foot.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: The fruit-gatherer is described as entering from the land side, crossing hillocks,
    sinking into soft ground, and possibly reaching sharp shoot-points below the surface.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Later parts of the design represent large leaf-tufts, nipah fruit bunches,
    a hillock, a millipede, and the millipede’s track.
  category: object
  evidence_refs:
  - ev:10
- id: obs:15
  text: The stated object of the charm is to make millipedes fold their legs together
    and sleep so they cannot injure anyone plucking the fruit.
  category: action
  evidence_refs:
  - ev:11
