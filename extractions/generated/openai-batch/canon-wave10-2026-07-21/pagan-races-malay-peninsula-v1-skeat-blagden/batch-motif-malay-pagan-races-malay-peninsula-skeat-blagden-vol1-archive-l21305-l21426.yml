canonical_text:
  quote: ''
  summary: The passage describes Semang and Sakai bamboo objects and patterns, including
    myth bamboos with figures such as Kari, Pie, Simei, Putto, and guardians of Paradise;
    a dream scene of instruction in manufacture; burial bamboos whose patterns serve
    as credentials before Kari’s judgment throne; a private birth bamboo carried by
    a woman; bamboo stampers used for emergencies or signals; and blowpipe, quiver,
    and charm-tube patterns used against diseases and accidents.
  language: English
  quote_policy: summarized
