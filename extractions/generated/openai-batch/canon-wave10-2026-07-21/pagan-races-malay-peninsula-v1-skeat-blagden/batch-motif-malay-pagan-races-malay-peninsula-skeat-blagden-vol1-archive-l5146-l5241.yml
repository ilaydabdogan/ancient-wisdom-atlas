canonical_text:
  quote: ''
  summary: 'The passage gives ethnographic notes on Orang Laut, Jakun, and related
    groups: racial classification as framed by the source, comparative height, intermixture,
    demographic decline, walking on land, climbing trees with or without ladders,
    throwing shell and coral implements, and a brief summary of Jakun subsistence
    practices.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author presents Jakun and Orang Laut as closely related and classifies
    both as branches of a Mongoloid stock, while also describing Malays as a specialised
    branch of the same stock.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives Orang Laut average height as about 5 ft. 3 in. and Besisi
    and Blandas as about 5 ft. 1 in., while warning that more measurements would be
    needed for certainty.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author suggests that Orang Laut greater height may partly reflect less
    intermixture with Semang and Sakai groups; more inland Jakun are said sometimes
    to show traces of a Negrito strain.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says the Orang Laut population is much smaller than a century
    earlier, attributing this largely to smallpox and to conversion to Islam followed
    by absorption among Malays.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Orang Laut children are described as tiring soon on land and walking with
    legs bent outwards; mixed individuals are described as straighter and stronger.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Adult Orang Laut are described as tiring soon when walking and as clumsy on
    land, with the source attributing this to frequent squatting in little boats.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Orang Laut are described as good climbers when necessary, climbing small coastal
    trees by clasping the trunk and using the inside of the foot.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says the Orang Laut do not appear to use rope or noose methods
    for climbing; when a tree is too large to climb by arms and legs alone, they make
    a ladder.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The ladder is described as made with bamboo pegs driven into a tree, a bamboo
    pole lashed to the peg ends, and bark-fibre lashings; it is left in place until
    it falls apart.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Orang Laut are described as very sure and strong throwers, using bivalve shells
    and coral-ring implements to strike crabs, birds, and other targets on the shore.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Jakun, Semang, and Sakai are described as largely nomadic; Land Jakun are
    also said to practise some agriculture and to live partly by hunting, trapping,
    fishing, and keeping dogs and fowls.
  category: attribute
  evidence_refs:
  - ev:11
