    was reaped by hand and transported in canoes when quantities were large.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Orang Sletar neither dug nor planted; rice was a luxury to them, and they
    ate certain roots and seasonal fruits.
  category: action
  evidence_refs:
  - ev:8
