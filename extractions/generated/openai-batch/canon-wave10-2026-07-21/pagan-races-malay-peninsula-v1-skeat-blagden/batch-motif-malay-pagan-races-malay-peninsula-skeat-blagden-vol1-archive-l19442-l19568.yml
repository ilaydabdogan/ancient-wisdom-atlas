canonical_text:
  quote: Offerings were made, as by the Malays, to the Earth genie ("Jin Bumi") on
    commencing to fell the forest.
  summary: The passage describes Benua-Jakun durian feasting, the permanent value
    and rental customs of durian groves, annual forest clearing for rice and other
    crops, an offering to the Earth genie before felling forest, women's control of
    formed clearings, simple agricultural tools, and the non-cultivating subsistence
    of the Orang Sletar.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The durian feast is described as the most joyous season of the year for the
    Benua, taking place in a forest-and-river setting and recalling older banquets
    under a traditionary prince.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A full-grown durian orchard is described as the only cultivated property of
    permanent value to the Benua-Jakun, with durian trees sold and groves sometimes
    rented.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: By custom, the renter of a durian grove was entitled to the produce for two
    successive seasons.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rice-planting involved annually clearing fresh jungle patches and building
    huts in the clearings, usually at some distance from a river to avoid inundations
    after heavy rains.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Offerings were made to the Earth genie, called Jin Bumi, when forest felling
    was begun.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After a space was opened, trees were left to dry for months, then burnt; holes
    were made with a stick for plants and seeds brought from the previous clearing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Common cultivated plants included sweet potato, potato, tapioca, water-melon,
