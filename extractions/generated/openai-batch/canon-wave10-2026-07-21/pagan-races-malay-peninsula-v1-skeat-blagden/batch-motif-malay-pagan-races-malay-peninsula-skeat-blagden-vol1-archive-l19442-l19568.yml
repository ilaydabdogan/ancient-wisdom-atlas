  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Once formed, the clearing received no further cultivation and was left to
    the control of the women.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Benua-Jakun had no agricultural implements beyond a sharpened stick used
