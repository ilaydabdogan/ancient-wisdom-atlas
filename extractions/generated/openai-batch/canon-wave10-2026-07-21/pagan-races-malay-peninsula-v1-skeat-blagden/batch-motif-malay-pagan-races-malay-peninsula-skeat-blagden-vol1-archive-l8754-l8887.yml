canonical_text:
  quote: ''
  summary: The passage describes forms of habitation among aboriginal groups of the
    Malay Peninsula, beginning with natural shelters such as palm leaves, caves, rock-shelters,
    trees, branches, and tree buttresses, then distinguishing hut types associated
    with Semang/Negrito, Sakai, Jakun, and Malays. It presents a proposed sequence
    for Semang shelter evolution from natural refuges to single palm-leaf weather-screens
    and then to circular or bee-hive huts made of multiple palm leaves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies large umbrella-like palm leaves and natural caves or
    holes in the ground as two early and obvious forms of shelter for a jungle-dwelling
    population.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Perak, the inhabited caves are described as rock-shelters formed by overhanging
    cliffs rather than hollowed-out caverns.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Batu limestone caves are presented as an exception where jungle-folk sometimes
    inhabited limestone caves because these caves offered protection against wild
    elephants.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The use of natural refuges such as trees and rock-shelters is said to be common
    to the wilder members of the three races discussed by the authors.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: More settled fellow-tribesmen are said to have developed a hut type that began
    as a pile-hut type common in Southeast Asia and gradually became assimilated to
    the Peninsular Malay type.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Semang huts are said to frequently resemble Andamanese huts, and circular
    or semicircular palm-leaf huts are said to be recorded in districts where Negrito
    influence is certain or suspected.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Semang are described as generally more given to tree-shelters and ground-level
    huts than the average Sakai or Jakun.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Sakai and Jakun are described as especially fond of building huts on very
    lofty house-posts.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Mr. Wray reports that in Perak he had not seen a bee-hive hut or tree-hut
    made by Semang or Sakai, although he had seen very tall tree-huts built by Malays
    at Kuala Dipang and elsewhere.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The proposed Semang shelter sequence moves from natural shelters, to a single
    palm-leaf weather-screen, to multiple palm leaves arranged in a row, semicircle,
    or circle to form a round or bee-hive hut.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A footnote reports an early account in which tree-dwellings were seen from
    a distance and compared to enormous bird nests in trees.
  category: other
  evidence_refs:
  - ev:8
