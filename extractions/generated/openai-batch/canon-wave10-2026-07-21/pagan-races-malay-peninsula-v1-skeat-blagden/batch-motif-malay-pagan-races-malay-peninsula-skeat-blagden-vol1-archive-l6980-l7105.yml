canonical_text:
  quote: ''
  summary: 'The passage gives ethnographic notes on food, drink, fire handling, stimulants,
    and food avoidances among named Malayan groups: Benuas, Jakun, Udai, Orang Laut/Sletar,
    and Sabimba. It describes honeycomb preparation, leaf or cup drinking vessels,
    carrying smouldering bark-fibre rope, betel and tobacco use, forest and river
    subsistence, animal food avoidances, and a Sabimba division of cooking by sex.'
  language: English
  quote_policy: summarized
