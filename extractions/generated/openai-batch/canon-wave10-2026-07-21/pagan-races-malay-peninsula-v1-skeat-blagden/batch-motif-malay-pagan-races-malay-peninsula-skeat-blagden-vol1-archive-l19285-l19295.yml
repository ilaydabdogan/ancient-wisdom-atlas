canonical_text:
  quote: ''
  summary: At the ripening of the grain and the appointed start of harvest, food is
    gathered and guests are invited for the Rice New Year's Day feast. In the morning
    the family head wraps himself to conceal his person, goes to the padi-field with
    a Malay reaping-knife, and begins an invocation naming Allah and the soul of the
    Rice.
