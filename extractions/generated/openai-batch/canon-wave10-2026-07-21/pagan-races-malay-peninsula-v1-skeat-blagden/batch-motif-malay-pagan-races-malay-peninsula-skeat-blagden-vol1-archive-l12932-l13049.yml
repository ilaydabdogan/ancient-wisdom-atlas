canonical_text:
  quote: ''
  summary: The passage discusses stone and organic implements in Malaya. It notes
    that discovered stone tools are axe or chisel blades rather than spear-heads,
    considers whether stone-tool users were settlers already at a later stone-age
    stage, argues that cave deposits do not prove cave inhabitants made the implements,
    and suggests technologically different groups may have coexisted and exchanged
    tools. It describes possible bamboo weapons hardened and shaped with fire, calls
    the aboriginal stage more like a wood-and-bone age than a stone age, concludes
    that Sakai and Semang were not makers of the stone axes and chisels found in the
    Peninsula, compares this with Andaman islanders, and lists simpler stone implements
    likely used by Malayan wild tribes.
  language: English
  quote_policy: summarized
