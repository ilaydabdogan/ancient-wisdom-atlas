canonical_text:
  quote: ''
  summary: The passage describes Orang Kuantan blowpipes, quivers, arrows, poison
    use, and a second rare wooden blowpipe type. It records materials, construction
    methods, measurements, museum collection history, and comparisons with Benua/Jakun
    and Peruvian blowpipe specimens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One Orang Kuantan blowpipe type is described as not slowly dried like that
    of the Benua-Jakun, so its rings loosen and require wedges.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cap is said to be made by women from woven, untrimmed pandanus leaf.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The quiver has a waist-cord without a buckle, a knot at the cord-end, and
    distinctive decoration.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The quiver interior contains a small reed-bundle and leaves room for a bamboo
    poison-holder.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Resin called tuyum is kept at the bottom of the quiver and used to fasten
    the butt-ends of darts.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The arrows are made from the leaf-stem of the langkap palm, are roughly made,
    and are often used without poison for small birds.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Only a minority of Orang Kuantan are said to possess poison, and some of the
    poison is described as compounded from harmless ingredients.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A second Orang Kuantan blowpipe type is presented as rare and as apparently
    peculiar to the Jakun or savage Malayan race.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The described second-type blowpipe was obtained in the Kuantan district of
    Pahang from a man belonging to jungle-tribes on the borders of Pahang and Kemaman.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The wooden blowpipe has a slightly smaller bore at the muzzle-end than at
    the mouthpiece, described as imitating the proportions of a bamboo blowpipe.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The wooden blowpipe is made from hard wood, probably penaga, split into two
    grooved halves and fitted back together to form a tube.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The wooden tube is bound along its length with cane and covered with a gutta-like
    substance to protect the bands and seal possible air leaks.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: A similar but not identical blowpipe is reported among Benua or Jakun of East
    Johor; it is longer and protected by a bamboo casing.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Douglas specimen is said to correspond closely to a Peruvian blowpipe
    from the Huallaya river, which is described as made from two grooved halves bound
    and wax-covered.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The quiver associated with the Douglas blowpipe is made from a bamboo internode
    of stated length and diameter.
  category: object
  evidence_refs:
  - ev:10
