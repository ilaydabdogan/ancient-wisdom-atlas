canonical_text:
  quote: ''
  summary: 'The passage explains motifs on Sakai tuang-tuang instruments and related
    patterns: a rattan-and-swamp pattern with animal and plant figures; a crop-protection
    charm showing a house, plantations, crops, and harmful animals; and a rain-producing
    charm using rain marks, monsoon signs, tortoise eggs, and kepayang fruits as symbols
    of wetness and the rainy season.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One pattern includes spoons, a water-bird, two frogs, a mangrove-bush, and
    a central manau rattan creeper with stems, leaves, and prickly leaf-whips.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A scorpion in the pattern is described as a hieroglyph indicating the word
    “scorpion-tail,” the Sakai name for the tiger-claw thorns of the rattan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fig. 17 is a copied tuang-tuang whose owner would not part with it, and its
    pattern is intended as a charm to protect crops and plantations around the house
    from animals.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lowest division of Fig. 17 shows the house, ladder-like steps or logs
    in mud, a sweet-potato field, and a hilly setting used for small clearings and
    huts.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The central division of Fig. 17 contains cultivated plants separated by six
    dead trees, including maize, yams or keladi, sugar-cane, tapioca, another yam,
    a banana tree, and grass dots around the plants.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The upper part of Fig. 17 contains the animals against which the charm is
    directed: a caterpillar, a rat, two monitor or lace-lizards, and a tortoise with
    her young; trees and a puddle mark hiding places or homes.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Fig. 18 is a copied tuang-tuang that serves as a charm to produce rain when
    drought from a light monsoon damages the rice-fields.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The rain-charm pattern uses strokes, dots, and curves to represent wind-driven
    rain, violent downpour, drops, the north-east and south-west monsoons, a tempest,
    and much rain by repetition.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Near the rain figures is a double row of tortoise eggs, described as symbols
    of the tortoise, which in turn represents moisture, wetness, and dirt.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: A central row of young kepayang fruits is explained by their development at
    the start of the rainy season and dropping of ripe fruit as the season ends, though
    the author says the real explanation is not fully known.
  category: sequence
  evidence_refs:
  - ev:9
