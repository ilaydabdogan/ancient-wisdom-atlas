canonical_text:
  quote: ''
  summary: The passage lists agricultural practices of several Orang Laut groups.
    The Sabimba are said to have abstained from planting and to have relied on jungle
    wild fruits. The Orang Muka Kuning are said not to have cultivated plants or bred
    animals except dogs. The Beduanda Kallang are said not to have cultivated plants
    and to have reported an ancestral vow against making cultivation clearings, with
    death believed to follow if the vow were broken.
