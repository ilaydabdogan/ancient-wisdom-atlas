canonical_text:
  quote: ''
  summary: The passage describes hair dressing, head coverings, magical combs, nose-sticks,
    earrings, and girdles among Kedah Semang and related Sakai, Pangan, Jakun, Mantra,
    and mixed Semang-Sakai groups. It notes that some Semang women wore leaf fillets,
    horn-like plant shoots, and bamboo combs used as disease charms, and it compares
    certain ornaments and garments across nearby groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kedah Semang women’s hair is described as usually longer than men’s hair,
    and some women and men partially shaved the head while women left a circular patch
    at the back and a forehead fringe untouched.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several women wore magic combs described as safeguards against diseases.
  category: object
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:3
  text: Several women wore Licuala leaf fillets on their heads, said to be usually
    reserved for special occasions.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Forms of Semang women’s headdress included oval or rectangular shaven patches
    and quill-like plant shoots worn like horns in the hair.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: One described hair-dressing method used three Licuala leaf fillets from ear
    to ear over the top and back of the head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Another described hair-dressing method used a single fillet carried around
    the edges of the clump of hair at the back of the head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The horn-like shoots were identified as growing shoots of Lowia grandiflora
    and were worn for magical purposes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: A woman is described as having bound her head with a fishing line, using the
    hook as a fastening.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The combs were usually bamboo, roughly three inches by five in an average
    specimen, and decorated with many differing designs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage reports that each disease was said to have an appropriate comb
    pattern and that several combs could be worn at once for protection against several
    diseases.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Similar combs are reported among Pangan, Semang and Sakai of Perak, and mixed
    Semang-Sakai groups such as the O. Jelei of Pahang.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that wearing a stick through the nasal septum was not practised
    in Kedah and was unknown to the Andamanese, while common among Perak Sakai and
    Sakai of Pahang.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Rolled-up leaf earrings made from banana and Licuala leaves are said to be
    worn by both sexes.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: The fringed waist-cord found among Semang is also reported among Sakai and
    Jakun, and a similar grass-bundle girdle is reported for Sakai women near Mt.
    Bujang Malaka and Mantra women north of Malacca.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: A tree-bark waist-wrap or loin-cloth is described as probably of Malayan origin
