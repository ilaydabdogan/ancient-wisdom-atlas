canonical_text:
  quote: ''
  summary: The passage describes figures and panels on decorated Semang bamboos, including
    beings who bar certain souls from heaven, two gigantic brother spirits who guard
    Tuhan's heaven, lightning-carrying flowers, a fixed name-row, and a second bamboo
    whose panels depict chiefs receiving dream communications and instructions, chiefly
    connected with insignia, craft objects, and medicinal preparation.
  language: English
  quote_policy: summarized
