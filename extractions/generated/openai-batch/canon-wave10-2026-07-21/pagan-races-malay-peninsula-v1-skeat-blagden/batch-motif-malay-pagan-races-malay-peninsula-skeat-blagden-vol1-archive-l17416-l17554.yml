canonical_text:
  quote: ''
  summary: The passage describes technical manufacture of a blowpipe, darts, and quiver
    among Benua groups, including binding and polishing the blowpipe, using heat to
    work bamboo and darts, preparing a bamboo quiver, and marking darts to indicate
    poison strengths for different quarry.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The blowpipe tube is cut and grooved until a cleaning rod can pass through,
    then its two halves are bound together and held in a clamp or vice while binding
    is completed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mouthpiece is made from wood, bored with a bone awl, enlarged, warmed,
    rubbed with resin, fitted to the tube, and shaped with a chopper.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The outer bamboo case has its nodes pushed out and is heated over a slow fire,
    bent downward with wooden pincers, and repeatedly worked to make it soft and yielding.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The blowpipe interior is polished with a cleaning rod, skate-skin, and then
    mamp'las leaves; the final polishing stage is said to take two or three days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A mouthpiece is smoothed and coated with gutta-percha, a small hole is made
    in the lower node for air, and the shaft is softened by steaming and straightened
    by eye.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The darts are measured from breast to breast of the maker, made from the hard
    outer cuticle of a kredok palm, dried for a long time, kept in reserve, and seldom
    used twice.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bent or warped dart-shafts are straightened by hand over a fire, and the darts
    are often used unpoisoned and without nicks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The quiver is made from green bamboo internode filled with wet clay and exposed
    to gentle heat for an extended period to prevent warping.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After first heating, the quiver is wrapped in bark to protect it from hearth
    smoke and gradually obtains a golden-yellow color.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The quiver cap is made by women from nipah or pandanus leaves, and the quiver
    is fitted with reeds and a waist-cord of t'rap bark with a buckle of wood, bone,
    tortoise-shell, or cash.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: A system of marks on darts distinguishes poison strengths and corresponds
    to quarry categories from birds through large mammals.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The dart-poison sequence begins with ipoh alone and adds fish stings, centipedes,
    and snake-poison for stronger mixtures.
  category: sequence
  evidence_refs:
  - ev:6
