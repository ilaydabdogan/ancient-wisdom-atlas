  quote: ''
  summary: The passage offers a tentative ethnographic classification of several Malayan
    aboriginal groups by presumed Semang, Sakai, Jakun, Sea-Jakun, and Malay admixture.
    It discusses the Blandas, Kenaboi, Berembun, Pago, Udai, Besisi, Mantra, Beduanda,
    Benua-Jakun, Jakun, Orang Laut, and Labu-area groups, noting uncertainty throughout.
