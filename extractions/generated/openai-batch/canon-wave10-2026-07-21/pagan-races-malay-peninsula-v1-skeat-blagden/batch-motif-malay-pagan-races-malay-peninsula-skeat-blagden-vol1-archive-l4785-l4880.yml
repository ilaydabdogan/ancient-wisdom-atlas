canonical_text:
  quote: ''
  summary: The passage gives ethnographic descriptions of bodily traits and practices
    attributed to Jakun/Benua and Orang Laut people, including hearing, feet and toe
    use, climbing, swimming, children's games, sleep postures, children's sleeping
    places, and separation of sleeping arrangements around puberty.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes ear lobes as perforated and much distended, and says
    hearing was sharper among the Jakun than among the Semang or Sakai.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Jakun children's little toes are comparatively straight and
    are used by the observer as an indicator in judging recent mixture with Malay
    or other ancestry.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says adult Jakun feet become knotted, scarred, stiff, diseased,
    and affected by dirty marshy water entering cracks and thorn scratches.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says half-blooded Orang Laut are able to take small objects from
    the ground with their toes, drag them toward the hand, and hide them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage describes a Jakun/Benua climbing method in which the ankles are
    bound with a head-rope.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says Jakun/Benua swim well and dive well, while Orang Laut are
    excellent swimmers and divers using a breast-stroke-like method compared to the
    Malay method.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says Orang Laut and Jakun children can swim as well as adults
    even before they can walk.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage describes Jakun children pulling against each other with a rattan
    rope held between the teeth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage describes a small Jakun boy performing an agility game while seated
    low with a bamboo stick placed through his elbows behind his back.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says Jakun usually sleep curled into a ball, with knees drawn
    up especially in colder morning hours.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage says children sleep on a mat on the ground at the mother's breast,
    between the mother and a smouldering fire, enclosed more or less in her arms.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage says that when signs of puberty appear, Jakuns arrange children
    to sleep apart, with different sleeping places for boys, girls, bachelors, and
    married people depending on land, boats, or coastal platforms.
  category: sequence
  evidence_refs:
  - ev:10
