canonical_text:
  quote: ''
  summary: The passage describes Jakun collection of taban gutta, ritualized practices
    associated with camphor collection, including food abstinence, eating earth, and
    use of the Camphor Language, beliefs about camphor trees yielding or withholding
    camphor, and a Malay-controlled trade monopoly regulating exchange with the Jakun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says taban does not run like dammar or other guttas, so mature
    or nearly mature trees were felled to extract gutta.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jakun collectors reported variable amounts of taban from individual trees,
    commonly nearer three to five kati's than the higher maximum claims.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Jakun left younger taban trees because felling them did not repay the
    labor, and they believed younger trees would keep up the stock.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Jakun ate taban seeds but did not extract edible vegetable tallow from
    them, unlike Malays in some places such as Siak.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: When searching for camphor, both races abstained from certain foods, ate a
    little earth, and used an artificial language called the Camphor Language or bhasa
    kapor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Camphor Language was reported to be the same on the Sedili, the Endau,
    and the Batu Pahat, and many words were formed from Malayan by periphrasis.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: It was believed that without the Camphor Language collectors would have difficulty
    finding camphor trees and the camphor would not yield itself.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: An old Jakun stated that if camphor were otherwise always obtainable, its
    value would lead to every full-grown tree being removed from the forest.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Berembun tribes on the western side of the Peninsula did not collect camphor
    and were unacquainted with the Camphor Language.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Malayan Penghulu, Jinang, or other headman in each river district headed
    the monopoly of trade with the Jakun, and strangers were prohibited from trading
    with the Jakun directly.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Penghulu regulated prices with principal men of the river and then conferred
    with Jakun chiefs or Batins to secure the agreed point.
  category: sequence
  evidence_refs:
  - ev:6
