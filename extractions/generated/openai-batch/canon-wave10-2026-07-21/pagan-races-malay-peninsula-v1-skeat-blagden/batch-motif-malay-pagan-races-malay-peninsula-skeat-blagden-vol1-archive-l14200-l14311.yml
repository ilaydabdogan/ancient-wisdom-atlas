literal_observations:
- id: obs:1
  text: An illustrated list includes arrows, arrow vanes and notch, arrows in a quiver,
    bamboo poison receptacles, spears with bamboo and iron heads, bamboo fishing receptacles,
    a bamboo water-tube, wooden plate, fruit-shell receptacle, bamboo whistle, flutes,
    bamboo guitar, drum, bamboo Jew's-harp, and flint and steel with bamboo receptacle.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A described Semang bow model was made of a wood named in the Semang dialect
    and used a string of twisted jungle-fibre; its arrows were bamboo with barbed
    iron heads.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bowstring is described as made from carefully twisted strands of tree-bark,
    greased and waxed, and the arrow-shafts from an internode of bamboo.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The arrow shafts are often decorated with incised patterns and have barbed
    iron points fitted into sockets at the end of the shaft, with rattan binding around
    that part.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The arrow construction is described so that a wounded animal may break off
    the shaft while leaving the point in the wound.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The arrow point is described as crusted with several coatings of Upas poison;
    wounds from it are said soon to kill the victim.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The arrow is usually winged with hornbill feathers, and the iron point is
    forged by pounding a red-hot piece of iron between two large stones.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Perak Semang are described as having a powerful bow and iron-barbed poisoned
    arrows used to kill large game.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Mr. L. Wray reports that Perak Semang arrow-heads were made of hard wood,
    thin sheet-iron cut from meat-tins and mounted in wood, and forged iron.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Mr. L. Wray reports that Semang arrows had detachable fore-shafts with barbed-iron
    or hard wooden heads thickly coated with poison except near the point.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Semang informants told Wray that such arrows could kill pig, sambhur deer,
    wild oxen, and rhinoceros; Wray saw bones of these animals at their camps.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Two Perak bows collected by Grubauer were purchased for the Cambridge University
    Museum; the first specimen is described by material, measurements, shoulder positions,
    and cord material.
  category: object
  evidence_refs:
  - ev:9
