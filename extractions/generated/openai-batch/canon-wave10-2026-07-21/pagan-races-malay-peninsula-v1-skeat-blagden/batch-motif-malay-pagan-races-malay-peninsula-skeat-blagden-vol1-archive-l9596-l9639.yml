canonical_text:
  quote: ''
  summary: 'The passage describes Sakai shelter forms and comparisons with neighboring
    groups: a Batu caves rock-shelter with bamboo bedding, palm-leaf screens, charcoal
    drawings, and a cooking-pot support stone; a statement that Sakai use rock-shelters
    and palm-leaf screens less than Semang and usually have rectangular huts; observations
    of Sakai tree-huts in Selangor; and a footnote comparing high tree platforms with
    Jakun practice and explaining their use against wild animals, while noting that
    elephants may pull them down.'
  language: English
