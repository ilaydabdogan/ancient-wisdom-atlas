canonical_text:
  quote: ''
  summary: The passage opens a chapter on decorative art by warning against speculative
    interpretation. It then critiques Vaughan-Stevens' so-called flower-theory, which
    reads Semang bamboo back-comb patterns as a system corresponding to flower anatomy,
    especially an Ixora flower. The author describes the proposed mapping of comb
    panels to flower parts and emphasizes omissions and uncertainties in that interpretation.
  language: English
  quote_policy: summarized
