canonical_text:
  quote: ''
  summary: 'The passage describes domestic arrangements and habitation patterns among
    several Aboriginal Malayan and Orang Laut groups: Berembun house interiors, Udai
    forest roaming without regular huts, Sletar boat-dwelling life, Sabimba and Muka
    Kuning temporary or minimal huts, Kallang river boat residence with avoidance
    of the sea, and Akik temporary coastal sheds alongside extended residence in boats.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One described large cottage had an elevated recess for guests, side rooms,
    a narrow apartment with two fireplaces and cooking utensils, and an open platform
    connecting to other bedrooms under a separate roof.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Berembun houses had mats, often lacked pillows or curtains, and in such cases
    family members and guests slept together in one open apartment; fireplaces were
    usually present, often at the side where the floor was depressed.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Udai were said rarely to build huts, roaming the forest by day and resting
    wherever fatigue or night overtook them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Sletar Orang Laut moved in small sampans, skirted mangroves, collected
    food from shores and forests, exhausted one spot, and then searched for another.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Sletar family boat contained a fireplace at one end, utensils in the middle,
    and a sleeping space under a kajang awning at the other end for a family, sometimes
    with a cat and dog.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sletar children searched for shellfish on the shore at low water and at high
    water climbed mangrove branches and dived into the water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Sabimba Orang Laut erected rude temporary forest huts with floors level
    with the ground and did not remain long in one spot.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Muka Kuning Orang Laut lived scattered in small huts beneath forest trees;
    the huts had platforms on four posts, leaf roofs without intervening walls, open
    ends, and no ladder or door.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Beduanda Kallang Orang Laut lived in boats on the Kallang river, avoided
    the sea, moved toward the interior before night, dragged boats ashore in strong
    wind, and did not make huts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Akik Orang Laut built temporary coastal sheds when ashore for boat-building,
    net-mending, or collecting materials, but otherwise lived with their families
    in boats for months while fishing, collecting marine products, and making long
    voyages.
  category: sequence
  evidence_refs:
  - ev:9
