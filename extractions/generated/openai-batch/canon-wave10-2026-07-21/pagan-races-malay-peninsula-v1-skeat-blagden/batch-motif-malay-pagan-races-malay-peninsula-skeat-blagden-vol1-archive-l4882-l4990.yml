  quote: ''
  summary: The passage gives ethnographic descriptions of Jakun physical endurance
    and adaptation, including a case of silent endurance during painful ulcer treatment,
    then describes the Orang Laut or Sea-Jakun as boat-dwelling coastal groups distributed
    around the Johor archipelago, Singapore, and nearby islands, with notes on political
    subjection, piracy, tribal divisions, settlement, relocation, and decline from
    smallpox.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Jakun patient with deep-seated ulcers applied sulphate of copper freely
    to a large ulcer surface after receiving instructions and warning from Vaughan-Stevens.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the painful reaction, the patient's leg muscles quivered and contracted,
    but he made no movement or sound and showed only deep breathing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The patient spoke in firmly measured tones and calmly replied that the doctor
    had called the substance medicine.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Jakun sensitivity to heat is difficult to answer and
    that the Jakun appear to suffer less from cold mountain winds than some other
    tribes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says the Jakun had long practised a rude but persistent agriculture,
    cultivating rice and tubers, while also consuming much fish.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that Jakun children endure want of food better than those
    of the Semang.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Orang Laut is described as a name for wandering coast tribes whose usual permanent
    dwelling is in their boats.
  category: relationship
  evidence_refs:
  - ev:6
