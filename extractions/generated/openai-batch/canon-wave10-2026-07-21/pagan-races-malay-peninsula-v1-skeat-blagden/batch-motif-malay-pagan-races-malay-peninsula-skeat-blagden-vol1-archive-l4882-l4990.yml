  text: The Orang Laut headquarters are described as the narrow straits between the
    islands of the Johor archipelago, with spread to Banca, Billiton, Borneo-coast
    islands, Celebes, Buru, and voyages to northern Australia.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Before the introduction of steam-vessels by the English and Dutch Governments,
    the Sea-folk are said to have been formidable pirates.
  category: attribute
  evidence_refs:
  - ev:8
