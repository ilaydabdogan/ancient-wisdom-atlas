literal_observations:
- id: obs:1
  text: The Sakai are described as simple in manner, open in speech, just in dealings,
    plainly clothed and fed, and supplied by the forest.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ulu Langat Sakai are described as liberal hosts who would share anything
    in their house and feel hurt if an offer were refused.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ulu Langat Sakai are said to comply when asked to do something, but not
    usually to offer without being asked.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Ulu Langat Sakai are described as accepting gifts, looking for presents
    from European visitors, and trading simply without gaining the advantage in bargains.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Besisi are described as reticent and shy with strangers and as sometimes
    hiding in the jungle or up trees when a white man first visits their settlement.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Batin Tirus asked whether Mr. G. C. Bellamy could take off his boots, and
    later answered that he was more than ten years old despite being a great-great-grandfather;
    a Jinang at Sa-jangkang gave a similar age reply.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Besisi are described as hospitable, liberal, grateful, and as remembering
    the White Man who visited them on a particular occasion.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: When properly treated, Besisi guides are said to assist through the jungle
    promptly and without bargaining for wages.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Besisi are described as contented, saying their earthly bliss consists
    in eating, working, and sleeping, and as cheerful in huts, jungle, seaside, or
    elsewhere.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Besisi are said never to have possessed their own alphabet, but to preserve
    a tradition of a sacred volume called Kitab that was destroyed by fire.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says Besisi can work hard, have taken up agriculture, planted
