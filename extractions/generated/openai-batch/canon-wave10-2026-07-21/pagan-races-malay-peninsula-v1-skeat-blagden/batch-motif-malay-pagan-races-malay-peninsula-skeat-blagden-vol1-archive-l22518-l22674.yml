canonical_text:
  quote: ''
  summary: The passage explains terms and functions of incised charm-patterns on combs,
    including flower cures, signs that call for the Sna-hut when Disease becomes serious,
    traditional authority attributed to the Sna-hut and Puttos, panel names and tokens,
    blank or omitted panels, blackened edge-lines, and combs worn against fatal Diseases.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Specified flowers are said to effect an immediate cure, while related flowers
    may produce the desired result more slowly.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A special sign in panels 3, 4, 5, 6, or 7 indicates that the Sna-hut should
    be summoned if the Disease gains too strong a footing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tradition assigns the Sna-hut the duty of ensuring that incised figures are
    correct.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The choice of ground patterns is connected with learning from the Putto, described
    as the servant of Pic; present-day comb cutters choose these patterns themselves
    and learn quiver patterns.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Repeated signs in the first panel pattern are called "was"; a distinguishing
    stripe is called "gehab"; a blank first panel is called "was picheg," and blank
    panels are explained as arranged by the Puttos.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A supplementary top line on the first panel is called "tepi" or edge-line,
    appears on combs, quivers, and charm-tubes, and may be represented by a broad
    dark stripe.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the second panel, repeated like figures are called "yil-toij"; a distinctive
    element within them is called "ziat"; and a distinguishing stripe called "kos"
    serves as a token.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Some combs lacking both first and second panel patterns are nevertheless described
    as useful against the approach of fatal Diseases.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the third, fourth, sixth, seventh, and eighth panels, repeated separate
    figures are called "yil-toij," while a single indivisible figure effective for
    the whole is called "ken."
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A broad black edge-line is made by paring off the bamboo cuticle and blackening
    it with charcoal; the note says "us" is evidently the word for fire.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The note states that some Diseases expelled or prevented by specified combs
    may be or are certainly fatal if the combs are not worn.
  category: relationship
  evidence_refs:
  - ev:8
