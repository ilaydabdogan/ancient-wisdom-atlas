canonical_text:
  quote: ''
  summary: 'The passage gives an ethnographic account of the Sakai of Perak and neighboring
    groups: they are described as peaceful within their own society, affectionate
    to family and friends, and attached to objects of the deceased. It reports past
    Malay hunting and enslavement of Sakai, trade between Sakai and Malays, partial
    independence or integration in Malay settlements, use of Malay numerals and money,
    continuing hostility among some wilder groups, and intentional use of stream beds
    as tracks to avoid being followed to mountain homes.'
  language: English
  quote_policy: summarized
