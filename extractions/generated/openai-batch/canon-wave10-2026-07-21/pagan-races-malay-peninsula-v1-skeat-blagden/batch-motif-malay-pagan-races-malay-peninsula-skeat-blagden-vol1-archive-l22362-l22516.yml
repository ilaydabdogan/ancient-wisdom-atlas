canonical_text:
  quote: ''
  summary: The passage describes rules and variations in Pangan/Semang comb patterns,
    their relation to quiver, blowpipe, and charm-tube patterns, and a Pangan explanation
    linking comb flower designs to healing plants. It states that errors in comb patterns
    do not entirely remove the comb's power, outlines restrictions on panel placement
    and design borrowing, and describes women seeking flowers corresponding to comb
    panels, preparing them in water, drinking the infusion, and rubbing the wet flowers
    on an affected body part.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Variations in comb patterns are attributed to young people cutting many comb
    patterns, unlike the more correctly cut quiver and blowpipe patterns made by men.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Pangan man says that an error in a comb pattern does not take away the comb's
    power, comparing it to a break or hole in a bird-trap through which a bird may
    or may not escape.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Except for the first, second, and fifth panels, figures on combs are said
    to be of the simplest kind, usually derived from first- or second-panel patterns
    with special marks omitted.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Young people copying combs sometimes insert full first- or second-panel patterns
    at the sides; the text compares this error to writing capital letters instead
    of small ones.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The composition of patterns on combs, quivers, and charm tubes is described
    as governed by strict rules.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: In quivers the blank panel is always in the central part of the bamboo tube,
    but in combs the blank panel must not be central because the central design is
    the most important.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A comb designer may use whole or modified quiver or blowpipe designs, or invent
    new ones, provided first- or second-panel patterns are not chosen for this purpose.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The drawings and combs collected by Vaughan-Stevens are described as mostly
    from the East Semang or Pangan and typical of east coast Negrito work, though
    not all were made by men.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: According to the Pangan explanation, women without the appropriate comb may
    be unable to go far enough into the jungle to seek a particular flower when Disease
    finds them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In such cases a woman seeks was or pawer flowers like those depicted on the
    comb, taking the nearest available match; these flowers must not be the same as
    those for quiver and charm-tube patterns and may correspond to the third, fourth,
    or fifth comb panel.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The woman places the plants in a bamboo tube filled with water, stirs them,
    adds special was and pawer flowers if available, drinks the infusion, and rubs
    the wet flowers on the affected body part before discarding them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Certain flowers came to be regarded as having more healing power than others,
    so patterns derived from them were preferred for wearing on combs.
  category: relationship
  evidence_refs:
  - ev:9
