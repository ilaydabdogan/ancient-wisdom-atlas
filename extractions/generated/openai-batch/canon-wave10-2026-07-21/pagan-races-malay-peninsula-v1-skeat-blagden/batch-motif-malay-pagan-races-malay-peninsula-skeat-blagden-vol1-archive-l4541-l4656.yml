canonical_text:
  quote: ''
  summary: The passage gives ethnographic and physical-anthropological descriptions
    of Benua-Jakun, Berembun, and related Jakun or Orang Utan groups in Johor, reports
    Miklucho-Maclay’s opinions about aboriginal type, Papuan or Negrito elements,
    intermarriage with Malays, selected individuals he figured, and a note on alleged
    population decline through Malay and Chinese advance and intermarriage. No mythic
    narrative, ritual episode, supernatural being, or symbolic object is described.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Benua-Jakun are described as having black hair that is generally smooth
    and lank, with bodies generally smaller and shorter than Malays and often lighter
    or neater in build.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Malay followers remarked that some children could not be
    distinguished in appearance from Malayan children.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The preceding physical descriptions are said to be mostly extendable to the
    Berembun tribes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Miklucho-Maclay is reported as concluding that Johor contained an aboriginal
    non-Malayan population, probably related to Papuans.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Miklucho-Maclay reported encountering occasional individuals whose hair resembled
    the Malayo-Papuan mixed-race type of the west coast of New Guinea and differed
    from the curled hair of other Jakun or Orang Utans.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Miklucho-Maclay’s argument is summarized as relying on supposed reversions
    to an aboriginal type and on the idea that interior Malays had partly inherited
    Jakun or Orang Utan traits through intermarriage.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Miklucho-Maclay attributed centuries of intermarriage partly to coast Malays
    fleeing inland rather than accepting Islam at the time of conversion to Mohammedanism.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: An editorial note says the net result of Miklucho-Maclay’s remarks is to establish
    a small Negrito element among at least some Jakun tribes of Johor, while criticizing
    his preconceived selection of striking Negrito traits.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: A woman of the river Leba, about eighteen and mother of two children, is described
    with brachycephalic head measurements and frizzled hair; the passage says she
    was selected to be figured for that hair and was not a typical example of the
    local Wild Tribes.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: A male Jakun or Orang Utan from Garib is described by height, cephalic index,
    facial features, and hair of Malayan type.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: A woman of the Jakun or Orang Utan Sletar is said to belong to a branch of
    the Orang Laut.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage says it is difficult to estimate the number of Benua-Jakun in
    Johor, and reports Maclay’s claim that these tribes were gradually becoming extinct
    through the advance of Malay and Chinese populations and intermarriage with Malays.
  category: sequence
  evidence_refs:
  - ev:11
