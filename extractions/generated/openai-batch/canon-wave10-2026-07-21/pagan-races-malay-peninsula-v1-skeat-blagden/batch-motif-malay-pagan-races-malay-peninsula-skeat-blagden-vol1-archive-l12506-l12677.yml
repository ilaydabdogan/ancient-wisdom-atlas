canonical_text:
  quote: ''
  summary: The passage describes modes of barter involving Jakun and Orang Laut-associated
    groups in the Malay Peninsula. It lists goods and prices, then summarizes how
    Sabimba, Orang Muka Kuning, Beduanda Kallang, and Orang Akik collected forest
    or marine products and received rice, sago, cloth, tools, weapons, utensils, tobacco,
    and salt through Malay chiefs, headmen, or traders. Several groups are described
    as being under Malay authority or restricted from trading freely.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An opening table lists articles bought from the Jakun and articles sold to
    the Jakun on the Lenggiu, including rice, tobacco, salt, earthenware cookware,
    a rice-pot or saucepan, and a parang, with prices.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sabimba colony of Orang Laut near the source of the Tembrau is described
    as consisting, circa 1850, of twenty-five men, thirty women, and fifteen children.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sabimba are described as slaves of the reigning Chief of Johor and as
    being under a Malay Jinang who employed them to collect forest products.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Sabimba collected taban, dammar, rattans, eagle-wood, ebony, chandan,
    and wax, and received rice, sago, and rarely cloth in return.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other Malays were allowed some barter with the Sabimba, through which the
    Sabimba obtained axes, hatchets, earthenware, cooking-pots, iron pans, salt, chillies,
    and tobacco; a note says taban could not be disposed of to others under pain of
    ducking.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Another notice describes the Sabimba as eighty individuals employed cutting
    rattans for Malays in exchange for rice, weapons, and utensils.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Orang Muka Kuning were entrusted to a Malay headman or Batin named Pajar,
    appointed by the Yam-tuan Muda of Rhio, who visited them, brought rice and other
    articles, and received jungle produce in return.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Orang Muka Kuning were prohibited from trading with other persons under
    penalty of ducking, and bartered rattans, dammar, and eagle-wood for rice, cloth,
    implements, tobacco, and salt.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'The passage gives exchange rates for the Orang Muka Kuning: one thousand
    rattans for four gantangs of coarse rice, one hundred dammar torches for six gantangs,
    and one basketful of eagle-wood for four gantangs.'
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Beduanda Kallang are described as fishermen and foresters who collected
    jungle produce for a Malay headman under the Temenggong of Johor.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Orang Akik built temporary sheds along the coast when ashore, lived for
    months in boats, fished, collected agar-agar and tripang, and gathered wood and
    pork-oil when season or weather prevented the other activities.
  category: sequence
  evidence_refs:
  - ev:10
