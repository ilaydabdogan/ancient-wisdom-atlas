canonical_text:
  quote: ''
  summary: 'The passage describes Sakai fishing and hunting technologies and practices:
    bark-fibre casting nets weighted with tin or stones; fish-dams, weirs, and river
    traps resembling Malay methods; poison-root fishing; spring-spear traps; and Sakai
    jungle hunting, tracking, and animal capture skills.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sakai make casting nets from twine manufactured from the inner bark of
    a creeper by twisting two strands together on the thigh.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some casting nets are weighted with tin chains obtained from Malays and attached
    to the outside edge of the net.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: De Morgan saw simpler casting nets weighted with stones and made from strands
    of bark of the t'rap or wild breadfruit tree.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sakai commonly take fish with fish-dams, weirs, and traps, described as
    closely following Malay methods and probably copied from them to a great extent.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a wide shallow river, a Y-shaped fish-fence is set across the stream with
    a fish-trap or weel at the upstream-facing point of the V.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: In deep narrow streams, the stream is fenced or dammed across and weels are
    set in the opening.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Kinta River fish-trap described by Hale used a bamboo grating, a platform,
    and rows of posts, with water directed through the grating in the dry season.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Scrapings of a poisonous jungle-root are thrown into the river above the grating
    to drive fish downstream half-stupefied, often yielding several hundred fish.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The spring-spear trap called b'lantek paut or p'lantek uses a strong springy
    rod with a bamboo dart released when an animal disengages a short cord.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Campbell describes Sakai hunters moving stealthily through the jungle without
