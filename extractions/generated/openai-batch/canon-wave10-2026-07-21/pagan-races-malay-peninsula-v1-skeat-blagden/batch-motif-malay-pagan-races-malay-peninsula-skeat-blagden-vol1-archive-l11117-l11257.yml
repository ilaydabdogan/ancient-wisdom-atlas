  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Sakai are described as having exceptional knowledge of the jungle, including
    sleeping under trees or among branches when out in the rain.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Sakai are said to detect animals at a distance and were believed able
    to track snakes by smell and catch many of them.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Sakai hunt with blowpipes, spears, knives, and in some cases guns, and
    sell animals and birds to Malays.
  category: action
  evidence_refs:
  - ev:8
