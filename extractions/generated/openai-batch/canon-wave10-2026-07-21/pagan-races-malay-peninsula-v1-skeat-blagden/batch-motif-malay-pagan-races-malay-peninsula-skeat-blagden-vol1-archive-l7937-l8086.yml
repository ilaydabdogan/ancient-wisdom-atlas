canonical_text:
  quote: ''
  summary: The passage describes Sakai bark-cloth dress, the manufacture and wearing
    of the selampit, the black fungus or Rock-vein girdle, Sakai necklaces and bracelets
    made from natural and traded materials, and a necklace charm in which a maker
    faces east and invokes the Evil Spirit or Mati-anak.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sakai selampit is described as a strip of tree bark rolled around the
    body, passed between the legs and waist, tucked at the belt, and allowed to fall
    down in front like a fan.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The selampit is said to measure about 3 to 4 metres in length and to be made
    from Ipoh tree bark or wild bread-fruit tree bark.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
