  text: The bark is prepared by spreading it on a tree trunk, striking it with a wooden
    mallet, washing it, and drying it several times until supple.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Both men and women are said to have worn the bark-cloth garment.
  category: relationship
  evidence_refs:
  - ev:3
