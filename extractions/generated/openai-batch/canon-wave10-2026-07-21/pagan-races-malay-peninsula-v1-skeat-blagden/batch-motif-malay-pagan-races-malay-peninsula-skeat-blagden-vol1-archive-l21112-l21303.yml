canonical_text:
  quote: ''
  summary: The passage classifies decorated objects among Semang, Sakai, and Jakun
    groups, especially bamboo combs, bamboo tubes, quivers, charm bamboos, blowpipes,
    mats, bark-cloth, and body decoration. It notes that Semang comb patterns include
    protective designs against accidents and diseases, then critiques Vaughan-Stevens's
    proposed explanations of quiver, charm-tube, and blowpipe patterns, including
    his flower-theory, copying theory, and gendered disease-protection claims.
  language: English
  quote_policy: summarized
