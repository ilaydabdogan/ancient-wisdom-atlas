  summary: The passage describes pillows and house forms among groups identified as
    Blandas and Besisi/Jakun in Selangor, including raised huts, tree-huts, ladders,
    palm-thatch construction, roof-gable arrangements, small house size, settlement
    defenses made from fallen trees, and a brief introduction to a Besisi chief's
    house as described in a tribal song.
  language: English
