canonical_text:
  quote: ''
  summary: 'The passage describes Semang and Pangan habitation features: communal
    shelters with roof smoke apertures, bamboo sleeping platforms, separate hearths,
    and no regular pillows; small raised granaries and storage huts for rice and property;
    a stated Semang preference for huts either in trees or on the ground despite occasional
    raised-floor huts; and a Perak Semang report of ground-level houses with braziers
    lit under the roof for protection from wild beasts.'
  language: English
  quote_policy: summarized
