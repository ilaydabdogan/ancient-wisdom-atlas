canonical_text:
  quote: ''
  summary: The passage describes ordinary rice harvesting and a pre-harvest sunrise
    ceremony. Participants gather in a watcher’s hut around a brim-full sack of rice.
    A magician inserts a reaping-knife with beeswax into the sack, faces the rising
    sun, recites a charm addressing a squinting or blind demon, declares that he takes
    the soul of the rice back to the house, ties seven rice-plants from seven holes
    to the knife, recites an expulsion formula, and cuts the stalks. The rice-heads
    are taken back, wrapped, placed on a second sack for three days, and later used
    for the rice-feast; remnants are distributed among guests.
  language: English
  quote_policy: summarized
