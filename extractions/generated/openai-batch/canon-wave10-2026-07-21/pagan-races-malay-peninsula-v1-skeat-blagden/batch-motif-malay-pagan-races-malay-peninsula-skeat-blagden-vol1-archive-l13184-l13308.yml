canonical_text:
  quote: ''
  summary: The passage argues that firearms among Sakai and Semang are recent, then
    treats the bow as chiefly confined to Negrito-origin groups in the Malay Peninsula.
    It reviews and discounts older claims that Sakai or Jakun used the bow, attributing
    many to confusion between groups or possible borrowing. A reported Temiang/Orang
    Laut bow practice, including hunting, fishing, and magic ceremonies, is described
    as probably Sumatran or as possible Semang influence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Firearms are described as a recent acquisition among the Sakai and Semang,
    connected with peace after stronger government in the Malay States.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bow is said to be confined in the Peninsula to tribes wholly or partly
    of Negrito origin and to be their chief tribal weapon.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The blowpipe is associated with the Sakai, while the spear is associated with
    certain Jakun tribes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Several older reports of bow use by Sakai and Jakun are discounted because
    the writers are said to have confused Sakai with Semang or Negrito groups.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Logan is reported to say that the Jakun, called Benua, knew the bow and arrow
    but did not use them; the passage suggests this may have come from rumors of Semang
    bows.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A reported Temiang account describes arrow-release methods and says a bow
    was used for shooting small game and fish and also in magic ceremonies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says the Temiang/Orang Laut information came from Sumatra and
    was probably a Sumatran custom rather than an Orang Laut custom.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says it is not established that the bow is a tribal weapon of
    Sakai or Jakun extraction; if found among them, it would likely be in a mixed
    Semang-Sakai or Semang-Jakun group.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A footnote corrects an alleged Sakai bow as a Pangan bow and says a form of
