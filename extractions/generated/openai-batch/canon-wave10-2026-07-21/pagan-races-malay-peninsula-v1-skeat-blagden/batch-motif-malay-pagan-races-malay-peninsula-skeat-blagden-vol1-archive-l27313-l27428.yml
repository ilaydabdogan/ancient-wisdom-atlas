canonical_text:
  quote: ''
  summary: The passage describes political offices, jurisdiction, councils, legal
    fines, complaint procedures, loans, taxation customs, and property succession
    among Benua-Jakun and Johor Jakun groups, including explicit comparisons to Malay
    offices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several riverine or local Benua/Jakun groups are described as being under
    named Batins, Jukrahs, or related chiefs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The To' Jinang is described as a local Malay authority with nominal governmental
    power and a role in maintaining and regulating a Malayan trade monopoly involving
    the Benua.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says each Batin had subordinate officials called Jinang and Juru-krah,
    and it also mentions a war chief called Pelima.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each Batin had absolute authority within his own jurisdiction, while difficult,
    unusual, or collective matters were referred to a council of Batins, excluding
    the Batin Anak Setia.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Council deliberations were sometimes prolonged, especially when novel matters
    lacked precedents in the old adat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Offences against property or person are described as rare, and crimes could
    be expiated by fines paid in coarse Chinese plates or saucers rather than coins.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Adultery and theft were fined from 10 to 20 plates, murder was fined 60 plates,
    and the fine was divided equally between the Batin and the injured person.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: If an offender failed to deliver the plates required by a fine, the offender
    became the slave of the victim.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Complaints were investigated by the Batin, who assembled elders for consultation;
    the Batin could not convict a thief without confession or direct evidence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: No regular tax was paid to the Batins, but presents were often made to them,
    and loans were given without pledges.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage gives rules for dividing common property at consensual separation,
    for inheritance at the death of husband or wife, and for a wife's clearing to
    pass to her children with the father as usufructuary trustee during life.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Among the Johor Jakun, each tribe was under an elder called the Batin, who
    directed movements and settled disputes.
  category: relationship
  evidence_refs:
  - ev:8
