canonical_text:
  quote: ''
  summary: Ethnographic description of Sakai, Blandas, Besisi, and Mantra dress and
    adornment practices, including Sakai nose-quills, bark-cloth and Malay clothing,
    Besisi jewelry and beliefs about coins and hornbill-crest ornaments, occasional
    face-painting, and Mantra clothing norms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The nose-quill is described as a distinctive Sakai ornament, apparently originally
    Sakai, and worn by both sexes among the Perak Sakai.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Sakai groups, including those of S. Kinta, wore porcupine quills through
    a perforation in the septum of the nose.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The passage distinguishes male and female arrangements of the quill: men
    passed the ends between the hair and top of the ear, while women passed them through
    the lobe itself.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A long bone from a fish, bird, or monkey, and among the Sakai of Pahang a
    nose-ring, could substitute for the quill.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: Wooden pieces and rolled banana-leaf are also recorded as substitutes for
    porcupine quills, and some wearers ornamented their nose-sticks.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The nose-quill is also recorded as occasionally worn by Selangor Sakai in
    Ulu Langat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Blandas of Kuala Langat had largely adopted Malay dress, but when working
    in the jungle they often returned to bark loin-cloths; women commonly wore short
    bark-cloth skirts or kilts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Besisi generally wore Malay-style everyday clothing, while the chawat
    persisted in jungle contexts and red sarongs were preferred.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Besisi bracelets, armlets, rings, necklaces, and similar ornaments were worn
    profusely; coin necklaces were valued because wearing coins was believed to be
    especially good for the eyes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Besisi rings were made from natural products such as bone, horn, tortoiseshell,
    coconut-shell chips, black coral, stone, shell, and the red crest of the solid-crested
    hornbill or Rhinoplax.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The red hornbill crest was valued by the Besisi, as by the Malays, because
    it was believed to turn green whenever poison approached the wearer.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Besisi nose-boring and tattooing or scarification had long disappeared if
    they had ever been practiced; face-painting still appeared occasionally on special
    occasions such as tribal feasts.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Mantra, except for young children, are described as not going absolutely
    nude; men wore at least a waist covering, women wore Malay sarongs, and men's
    holiday clothing followed local Malay dress.
  category: action
  evidence_refs:
  - ev:8
