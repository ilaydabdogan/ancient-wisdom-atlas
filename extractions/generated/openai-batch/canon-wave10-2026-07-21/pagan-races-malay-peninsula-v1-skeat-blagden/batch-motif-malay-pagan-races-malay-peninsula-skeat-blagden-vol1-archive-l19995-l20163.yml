canonical_text:
  quote: ''
  summary: The passage describes Semang and Sakai arts and crafts, including bark-cloth
    tools and garments, mat-making, bamboo substitutes for pottery, raft-making, simple
    ironworking methods, daily Sakai industry, and the beginning of Sakai bark-cloth
    manufacture from Artocarpus bark.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Semang bark-beating mallets from Perak are described as hard palm-wood, bat-shaped
    tools with cylindrical handles and a scored striking surface that leaves a grained
    texture.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman's garment is described as a fungus fringe sometimes supplemented with
    small Artocarpus bark strips; some examples are belts tied behind or long plaited
    cords wound round the loins.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mat-making is assigned to women among the Kedah Semang and is used chiefly
    for bags, sacks, and wallets for rice, roots, fruits, and similar articles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that the Perak Semang are ignorant of pottery and instead
    use large bamboo stems as cooking vessels when green and as water vessels after
    the sap dries.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A single wooden bowl is reported as having been carved from a tree root with
    a knife at S. Kerbu.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Semang of Perak are said not to make boats, but to make rafts by lashing
    together twenty or thirty large bamboos and floating down the Perak River before
    walking back.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: One reported Semang ironworking method heats iron red hot and then batters
    it between two stones into the required shape, including arrow-heads.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage compares this with Andaman Negrito iron shaping, in which iron
    was battered between stones without prior heating.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Semang ironworking material is described as old tool-iron obtained from Malays;
    the Semang are said not to extract iron from ore.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Mr. Wray reports seeing Upper Perak Semang use double-piston bamboo bellows,
    a charcoal fire, an iron anvil, and an iron hammer, making knives and spear-heads
    in local Malay shapes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Perak Sakai daily work is described as early rising, carrying wallets and
    tools into the jungle for food, firewood, or tree-resin, while others remain at
    home making darts and ornamenting bamboo quivers and receptacles.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Perak Sakai bark-cloth manufacture begins by cutting incisions in full-grown
    Artocarpus bark to mark a broad strip, then hammering the bark in place.
  category: sequence
  evidence_refs:
  - ev:11
