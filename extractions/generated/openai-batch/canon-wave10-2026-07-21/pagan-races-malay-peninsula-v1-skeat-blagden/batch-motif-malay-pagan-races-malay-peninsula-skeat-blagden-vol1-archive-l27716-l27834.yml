canonical_text:
  quote: pass from one fruit-grove to another as the trees ripen
  summary: The passage describes seasonal movements of wild jungle-dwelling groups
    in the Malay Peninsula according to fruit ripening, especially durian; comments
    on counting systems and Malay numerals learned through barter; discusses accusations
    and mistreatment involving Malays and aboriginal groups; and presents the author's
    views on government protection, missionary activity, and likely absorption into
    the Mohammedan population.
  language: English
  quote_policy: quoted
