  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Most blowpipe patterns, except the first eight, are described as originally
    taken from bamboo tubes on which original blowpipe patterns had been copied.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the described blowpipe designs, the upper end of the design is remote from
