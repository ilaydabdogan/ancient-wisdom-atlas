  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The described blowpipe tube is not peeled, and the uppermost and lowest lines
    of the design coincide with the upper and lower extremities of the tube.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that repeated figures in Semang pattern bands regularly
