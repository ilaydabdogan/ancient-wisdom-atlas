canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Semang and related Negrito hunting, trapping,
    animal keeping, and fishing practices: use of bows, spears, blowpipes, poisons,
    elephant and rhinoceros hunting methods, horn barter, traps and bird-lime, hunting
    dogs, monkey pets, Perak poisoned arrows, and differences between mountain and
    river groups in fish use.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Semang are described as dexterous with bow and spear and able to kill
    large animals by contrivances.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: They use blowpipes and poison darts with Ipoh, a poison said to be procured
    from tree juice.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: They are said to suffer seldom from beasts of prey because of sharp sight
    and agile tree climbing.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: For elephant hunting, small Semang parties wait as elephants descend a hill.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The hunters drive a poisoned, fire-hardened splinter into the sole of an elephant’s
    foot, lame it, and then dispatch it with spears and sharp sticks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A rhinoceros may be found wallowing or embedded in marshy mud, with a hard
    dry crust forming around it; Malays call such an animal badak tapa, the recluse
    rhinoceros.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Semang collect combustible materials, build a large fire over the mud-embedded
    rhinoceros, and kill it for food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The rhinoceros horn is preserved because it is supposed to have medicinal
    properties and is bartered to Malays for tobacco and similar goods.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The narrator states that he did not personally witness the big-game methods
    described from Marsden, while noting that comparable ingenious methods are recorded
    elsewhere.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Kedah Semang use traps, pitfalls, snares, bird-lime from ficus or gutta
    sap, a rat snare compared in principle to a Malay rat-trap, and a semi-wild reddish
    hunting dog.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Semang are said generally not to keep domestic cats, but sometimes to
    keep young monkeys as hand-reared pets.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Upper Perak Semang are reported to kill big game with poisoned arrows that
    have barbed heads and detachable fore-shafts.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Negrito groups living on high mountains are said to depend little on fish,
    whereas river-dwelling Semang use fish as food.
  category: setting
  evidence_refs:
  - ev:8
