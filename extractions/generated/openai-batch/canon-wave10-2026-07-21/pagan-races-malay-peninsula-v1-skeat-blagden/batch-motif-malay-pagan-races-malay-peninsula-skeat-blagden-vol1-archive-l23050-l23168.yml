  quote: ''
  summary: The passage describes variation and classification in Semang-related quiver,
    charm-tube, and blowpipe patterns. It notes changing ring-lines and muzzle-end
    bands, tribal additions used as decoration, separation between charm-tube and
    blowpipe pattern sets, the presence of central Disease-patterns, divergences from
    comb-pattern classification, and a statement that ring-line tubes are held to
    precede other tube patterns in the arrangement of charm patterns by the Puttos.
  language: English
  quote_policy: summarized
