canonical_text:
  quote: ''
  summary: 'The passage describes household structures and furnishings among Jakun
    and Benua-Jakun groups: family platforms arranged around a hut center, Jakun houses
    in Johor compared with Malay-style houses, wooden pillows and their dyes and uses,
    and Benua-Jakun raised houses with bark sides, leaf roofs, ladders, and greater
    height where elephants were common.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each family made a structure that served as bed at night, seat by day, table
    for meals, and shelter in bad weather, using thin poles, transverse sticks, posts,
    and leaves.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Beds were placed around an enclosure so that sleeping occupants lay with their
    feet toward the center, which was intentionally left vacant for cooking or other
    uses.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Favre reports that he had heard Jakun were like wild beasts and slept like
    birds on tree branches, but he states this was far from true and that no Jakun
    lacked some kind of dwelling.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Jakun of Johor built houses in the Malay manner; some houses were comfortable,
    divided into rooms, raised from the ground, and entered by ladder.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Described house furnishings included pots, plates or similar vessels, mats,
    an iron frying-pan, coconut-shells for holding water, and baskets for carrying
    food.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Jakun pillow was made of soft wood, convex at the sides and underneath,
    concave on top, and sometimes stained red, yellow, or black with materials from
    bark, root, oil, and charcoal.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Women’s log-pillows were most carefully stained, while men’s pillows were
    also used in the daytime for other purposes, including as a float for a crocodile
    line; this pillow type had been replaced by cotton-filled pillows.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Benua-Jakun houses varied in size and finish, often consisting of one raised
    room on sapling posts with rough stick flooring, bark sides, leaf thatch, and
    a narrow steep ladder to the doorway.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Benua-Jakun house floors were built at different heights above the ground
    and were generally high in places where elephants were abundant.
  category: relationship
  evidence_refs:
  - ev:9
