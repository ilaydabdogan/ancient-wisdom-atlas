canonical_text:
  quote: ''
  summary: 'The passage describes Semang and Negrito dress and ornaments in Kedah
    and Perak: bark clothing, cloth obtained through exchange, necklaces made of fibres,
    seeds, leaves, animal trophies, shells, perfume, beetle legs, coins, buttons,
    and fibre armlets, bracelets, and knee-bands. It explicitly notes that some objects
    threaded on necklaces appear to be worn for magical reasons.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The clothing of the Perak Semang is described as similar to that of the Negritos
    of Kedah.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Because the Perak Semang are said to have no manufactures of their own, their
    clothing consists chiefly of the inner bark of trees; some obtain cloth from Malay
    villages by exchanging jungle produce.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The simplest Kedah Semang necklace is a neck-string or ligature made of Rockvein
    fungus or bertam palm fibre, sometimes embellished with tree leaves and palm-leaf
    knots.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: More elaborate Kedah Semang necklaces consist of two or more strings fastened
    at one point and threaded with small trophies of the chase, wild roots, fruits,
    seeds, and other objects.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that the objects on these elaborate necklaces appear to
    be commonly worn for magical reasons.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: One Kedah Semang necklace contained ape teeth, small bundles of fragrant grass,
    possible bear teeth, small flat beans, and European-manufactured buttons regarded
    as valuable.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Perak Negrito necklaces are described as chains of black and white seeds arranged
    alternately and fastened together in a bunch, with some varying greatly in size.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Perak necklace strings carry hunting and fishing trophies such as animal teeth
    or bones, squirrel-tail tufts, fish-scales, shells, and perfume extracted from
    trees.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Green beetle legs are rarely inserted between seeds, and coins are worn on
    necklaces when obtainable.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Kedah Semang armlets, bracelets, and knee-bands are usually made from jungle
    fibre on the same general principle as their girdles and necklaces.
  category: object
  evidence_refs:
  - ev:9
