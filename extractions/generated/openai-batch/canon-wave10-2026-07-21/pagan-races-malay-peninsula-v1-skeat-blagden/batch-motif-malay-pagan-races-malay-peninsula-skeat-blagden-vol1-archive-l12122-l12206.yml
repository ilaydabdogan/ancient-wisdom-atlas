  quote: ''
  summary: 'The passage describes economic relations between Jakun communities and
    Malay traders in Johor: Malay traders bring desired goods by canoe, Jakun people
    become indebted, and repay obligations by collecting forest commodities. It also
    describes temporary demand-driven extraction of gutta taban and the method of
    cutting the felled tree so its viscous milk flows.'
