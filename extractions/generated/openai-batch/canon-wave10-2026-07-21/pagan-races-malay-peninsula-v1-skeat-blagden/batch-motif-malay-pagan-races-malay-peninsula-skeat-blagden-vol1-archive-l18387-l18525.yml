canonical_text:
  quote: ''
  summary: The passage describes a rice-planting ceremony using planting-sticks, a
    seed-pouch, rice from the first seven ears of the previous harvest, a charm to
    Dong the Black Princess, sevenfold fumigation, seven holes, and three days of
    protective repetition. Notes explain the Rice-soul or Rice-baby, the Black Princess/Putri
    Sadong as a rice-field protectress, and mouse-demons that threaten the rice. The
    passage also gives a taboo concerning planting-sticks and describes guarding the
    ripening rice from animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each individual brings a planting-stick and drives it into the earth inside
    a ring; a woman's seed-pouch is placed within the ring and mixed with rice grains
    saved from the first seven ears cut at the previous year's harvest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A charm summons Dong, the Black Princess, described as dwelling as a recluse
    in the sea for six months, to assist in planting rice so that a small amount of
    seed may multiply greatly.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The magician faces east, takes the pouch, waves it seven times in a circle
    through smoke from a censer, and counts the seven passes aloud.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Rice-seed from the pouch is dropped into each of seven holes and covered by
    the magician; the planting-sticks are also waved seven times through the smoke.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The company goes to the field to plant, with women beginning by planting the
    pouch seed before using the main stock of seed; the planting-sticks are returned
    to the ceremonial place for three consecutive days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A note identifies the saved rice as the Rice-soul or its embodiment, called
    in Malay the Rice-baby.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: A note states that the rice has a soul that wanders for three days and nights,
    while the rice-body is exposed to evil demons in the form of mice; the demons
    cannot pass the enchanted ring of planting-sticks or the inner circle of seven
    holes, and after the third night the rice-soul returns to its body.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A note says the Black sea-Princess descends with the wet monsoon, can protect
    rice-fields against evil spirits except the Squinting Demon, and is identified
    as Putri Sadong, Princess of the Limestone Caves, associated with rice cultivation.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Wet earth clogging a planting-stick must not be removed by rubbing the stick
    against a tree; if the stick is knocked against a tree, mouse-demons hear it and
    dig up the seed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the rice ripens, men, women, and children drive away birds, apes, elephants,
    squirrels, and other enemies, and families may live in a small field shelter while
    the rice ripens.
  category: setting
  evidence_refs:
  - ev:9
