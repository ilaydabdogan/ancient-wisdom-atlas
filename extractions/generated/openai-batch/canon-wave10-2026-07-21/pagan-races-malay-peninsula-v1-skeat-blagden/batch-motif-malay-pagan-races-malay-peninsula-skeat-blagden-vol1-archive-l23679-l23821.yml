canonical_text:
  quote: ''
  summary: The passage explains a set of Semang/Pangan decorative figures as representations
    of Kari, his servants and winds, lightning, charms against lightning, divine and
    afterlife figures, Kari's throne and judgment-seat, a tree containing unborn souls
    and birth tallies, and guardians who keep alien souls and tiger-souls from parts
    of Paradise or heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sinai is represented by rattan whips, is described as Kari's servant, is himself
    a wind, and is invisible to all except Kari.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sinai has a whip in each hand and uses the whips on winds that refuse to obey
    Kari's commands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The winds have a place below Kari in the clouds called Kabut, and disobedient
    winds are represented as awaiting Kari's sentence in a prison-like figure.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: All winds are described as personified living beings, servants of Kari, invisible
    to all except him.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A beaker-shaped figure called jag represents a wild fruit eaten by Kari; the
    exact part of the figure intended as the fruit was not known.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A zigzag line represents Kari's lightning.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: When Kari is angry and wishes to strike someone, servants bring him a flower
    from his dwelling-place, and he shakes its spike over the sinner to send lightning
    where he wishes.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The bell-like flower cups make the sound of thunder, the larger storm sounds
    are described as Kari's wrathful voice, and mountain echoes are described as Pie's
    answers remonstrating with Kari.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Semang charm against lightning is said to consist of three incised ring-lines
    on the quiver, first used by Pie's command and first made by the Puttos.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Kari is represented as a god who is not always depicted in the same form,
    but he invariably has the zigzag lightning line as an attribute.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Simei is identified as the daughter of Pie, and Pie is separately represented.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Kari is described as the highest power, and Tuhan and Pie are described as
    compelled to obey him.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: Black indentations below the figures represent rattan mats on Kari's floor,
    made for him by the Chin-oi or Sinoi.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: A tree against which Kari's chair leans contains still-unborn souls in its
    branches, and Kari cuts a tally on its trunk for each newborn Semang.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:15
  text: The tree called kla-to-ong is full of blossoms, and its fruits are eaten by
