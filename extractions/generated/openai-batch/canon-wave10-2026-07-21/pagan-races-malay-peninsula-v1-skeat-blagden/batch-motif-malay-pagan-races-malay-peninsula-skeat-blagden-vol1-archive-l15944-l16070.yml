canonical_text:
  quote: ''
  summary: The passage describes blowpipe handling, Blandas and Besisi blowpipes and
    dart equipment, Malay-derived Besisi spear forms, and detailed construction of
    the Besisi blowpipe, including bamboo tubes, gendered or kinship terminology for
    paired tube pieces, mouthpiece wedges, casing, and protected muzzle-end finishing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The operator holds the blowpipe mouthpiece firmly in both hands immediately
    in front of the mouth rather than supporting the shaft far forward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blandas or Langat blowpipe is described as hardly distinguishable from
    the Besisi weapon; the passage also names materials for its dart, butt-end, dart-quiver,
    and a leaf carried as a squirrel-charm.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Besisi, like the Blandas, are said to obtain their spears from the Malays,
    and Besisi fish-spear forms and the name “tiruk” are said to be borrowed from
    the Malays.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Besisi blowpipe inner tube is made from two bamboo internodes; a middle
    node is removed, the abutting ends are resin-coated, and the pieces are spliced
    with a connecting cylinder or jacket.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: One blowpipe tube piece is longer and called the man-piece, while the shorter
    is called the woman-piece; alternatively the pieces are called mother-piece and
    child-piece, and the connecting-piece is called “cheinal.”
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The wooden mouthpiece is bored through and fitted by hand into the butt-end
    of the inner tube; cane, leaves, or cloth may be used as wedges, and some leaves
    show fire traces at their edges.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The outer casing is made from long-jointed bamboo; its central node is removed
    with a sharpened spike or boring-rod and rasped down with a rattan leaf-whip.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: The inner tube is inserted into the casing, and the muzzle-end is tightened
    and protected with split casing ends, an inserted bamboo cylinder, cane binding,
    resin coating, and a coconut- or tortoise-shell ring.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
