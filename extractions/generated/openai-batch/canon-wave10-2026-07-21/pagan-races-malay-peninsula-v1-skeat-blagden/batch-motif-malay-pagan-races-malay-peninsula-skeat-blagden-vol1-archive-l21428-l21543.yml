canonical_text:
  quote: ''
  summary: The passage summarizes Semang traditions and ethnographic claims about
    the origin, preservation, development, and use of blowpipe and comb patterns;
    discusses resemblances or possible borrowings among Semang, Sakai, Pangan, and
    Tembeh designs; describes Tembeh message signs on bamboo; and contrasts Semang
    disease-related designs with Sakai charms against evil spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Semang tradition ascribes the origin of blowpipe patterns to the god Pie,
    aided by his daughter Simei, who planted Kari's flowers near the mountain peak
    Jelmol and derived patterns from them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The patterns derived from the flowers are said to be effective against Diseases.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Putto incised the correct patterns on bamboo exactly as Pie had invented
    them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The inscribed bamboos were deposited in a large cave and changed into stone
    by the god so that they would remain available as patterns.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A set of patterns was prepared for each Sna-hut, whose task was to ensure
    that the people used the correct drawings, while only the Putto knew where the
    caves were.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Flower parts named tepi, was, pawer, and mos are represented on combs according
    to the tradition, though the passage says the details are not fully worked out.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Berlin Ethnographical Museum publication is reported as saying that Semang
    patterns derive from a fundamental pattern with close resemblance to a typical
    Sakai motive, and that the Semang are asserted to know the order of development
    of simpler figures.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The East Semang or Pangan are said to have one pichod pattern, allegedly learned
    from the Sakai, and to use it and its variants as the groundwork of all their
    patterns.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The pyramidal figure is said to be the basis of Semang decorative art and
    is described as a simple figure common in the art of many other peoples, with
    no necessity to suppose foreign borrowing.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Tembeh are described as formerly using no decoration for blowpipe or quiver
    and later copying East Semang or Pangan patterns sparingly.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Tembeh message characters were notched or drawn in charcoal on bamboo, with
    sender and recipient signs at the top and below, and signs representing actions,
    persons, goods, times of day, and numbers one to ten.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Sakai magical designs are described as charms against evil spirits; each tribe
    is said to have a design for all members, and these designs are contrasted with
    the more numerous Semang designs directed against personified Diseases.
  category: relationship
  evidence_refs:
  - ev:9
