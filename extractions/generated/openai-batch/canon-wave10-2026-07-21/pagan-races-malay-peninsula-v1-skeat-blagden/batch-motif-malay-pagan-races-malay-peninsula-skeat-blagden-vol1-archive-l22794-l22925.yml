  quote: Cross-hatching (on combs) has a threefold meaning.
  summary: 'The passage explains graphic conventions for comb and body-part patterns:
    dotted or dashed lines distinguish otherwise similar figures; cross-hatching on
    combs can signify knobby protuberance, a hill with pathways, or disease swelling;
    exact cutting of patterns is emphasized; and some combs were said to have had
    individual name-marks distinct from signs affecting pattern power.'
