canonical_text:
  quote: ''
  summary: The passage describes Semang classifications of dotted and ring-line patterns
    on bamboos, blowpipes, quivers, and related objects. Some dotted designs are identified
    as charms protecting owners from injuries. Ring-lines and figure-bands are described
    as diagnostic design features, sometimes linked to disease seriousness and, in
    one tradition, to protection from lightning. The passage also compares formal
    features across comb, quiver, and blowpipe patterns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In subdivision ID, spaces divided by ring-lines, including the central space,
    are filled with essentially identical figures.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dotted designs called pichod are divided by the Semang into two groups,
    which Vaughan-Stevens distinguishes as simple and compound.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Semang explanation reported to Vaughan-Stevens is that these dotted designs
    are a different kind of charm, called tankor in the passage.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Class IE is said to protect the owner against slight external injuries, while
    the more complicated pattern IF protects against more serious injuries.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pattern IF was formerly cut by the Sna-hut themselves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Subdivision IG contains narrow bands or spaces enclosed between groups of
    ring-lines, and these spaces contain double cross-lines.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Single cross-lines are described as special marks of Class I.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage says that the essential features of this class include the number
    and position of ring-lines and the figure-rows or bands called was and pawer,
    together with the Disease pattern in specified designs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ring-lines are said to denote the seriousness of disease in inverse proportion
    to their number.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: A tradition is reported in which the Putto gave the rings as charms to protect
    the owner against lightning.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Three parallel ring-lines in combination are called keng-uin or kening-uin,
    with the middle line treated as the ring-line proper and accompanied by the two
    outside lines.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The two outside ring-lines form a usual dividing band or border between rows
    of figures on the bamboos.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage states that no one now knows why the great chiefs originally chose
    the described ring-line forms.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: A distinction is made between patterns where the upper figure called was reaches
    the bamboo edge and patterns where a vacant space is left, separated by one or
    more horizontal lines.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The edge-line above the was is said to play the same part in tube patterns
    as in comb patterns, with the difference that one or two bands of ring-lines may
    appear above the was.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: The passage reports an assertion that the shorter portion of the blowpipe-tube
    was originally derived from a quiver pattern.
  category: relationship
  evidence_refs:
  - ev:8
