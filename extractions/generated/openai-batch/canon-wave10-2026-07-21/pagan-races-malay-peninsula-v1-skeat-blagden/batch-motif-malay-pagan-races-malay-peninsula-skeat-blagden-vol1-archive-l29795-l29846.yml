canonical_text:
  quote: ''
  summary: The passage describes the Orang-Laut Akik as maritime divers, fishermen,
    boat-builders, and boat-dwelling families who made long voyages and used temporary
    coastal sheds for work ashore. It also describes their reported social attitudes
    toward Malays and Land Jakun, an asymmetric marriage rule involving Jakun and
    Akik women, and a discussion of whether the Johor Orang Laut were rightly accused
    of piracy or confused with other maritime groups.
  language: English
