canonical_text:
  quote: '"Orang Utan" simply means "Man of the Jungle," i.e. "Wild Man,"'
  summary: The passage explains Malay ethnographic names for aboriginal groups of
    the Malay Peninsula, especially the meanings and uses of terms such as Orang Utan,
    Semang, Sakai, Senoi, Jakun, Orang Laut, and related local names. It also discusses
    mistaken or regional uses of orang-outang for apes and proposes or rejects several
    etymologies.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that Malay orang means "man" and utan means "jungle," so
    Orang Utan or Orang Hutan means "Man of the Jungle" or "Wild Man" in modern Peninsular
    Malay.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the European application of orang-outang to an ape probably
    arose from an early traveller's mistake or jest, and cites Bontius and Tulpius
    as early examples.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the term Orang Utan can even be applied to sea tribes,
    including the Orang Utan S'letar, described as a branch of the Orang Laut.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage lists Semang, Pangan, Sakai, Senoi, Jakun, Orang Bukit, Orang
    Laut, Blandas, Bersisi, Mantra, and Udai as names applied to definite local groups
    or hordes.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says Semang has not been satisfactorily explained, while Sakai
    has been connected by others with "dog" but is here more cautiously compared with
    Sanskrit Sakhi, "Friend," though that explanation is also called unlikely.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A footnote says that in Sumatra the expression orang utan is used for anthropoid
    apes, while in Borneo the word Maias is used for the orang-outang; the Peninsular
    Mawas is described as probably a tradition connected with that usage.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A footnote rejects the derivation of Pangan from Malay panggang, "to roast,"
    and reports a suggestion that it may be akin to a North Bornean word pangan meaning
    "friendly."
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A footnote states that Senoi is said to mean "Man" in Sakai and interprets
    Gunong Senoi as probably "Hill of the Senoi" or "Wild-men's Hill."
  category: speech
  evidence_refs:
  - ev:8
