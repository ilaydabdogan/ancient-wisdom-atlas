canonical_text:
  quote: ''
  summary: The passage gives ethnographic descriptions of Mantra and Jakun groups
    in the Malay Peninsula, including physical traits, estimates of distribution and
    population, mission contact, language replacement by Malay, remarks on bathing
    and playthings, and reported historical or traditional explanations for resemblance
    between Jakun and Rembau Malays.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Mantra are described with an angled lower jaw, vertically elongated upper
    face, small slightly upturned nose, large mouth, shoulder-length hair, and spreading
    toes that make the front of the foot broad.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Another cited description says the Mantra have gross and loose lips and a
    prognathous profile.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: M. Borie stated that tribes from Selangor to Mount Ophir were known as Mantra
    and estimated their number as not exceeding 2000; the passage notes doubt about
    this estimate and suggests he may have included the Besisi.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that the Mantra distinguish themselves from both the Besisi
    and the Jakun.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Miklucho-Maclay visited the Catholic mission to the Mantra near Malacca and
    gave Mantra head-index measurements between 74 and 89.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the Ayer Salak mission near Malacca, Miklucho-Maclay found that the Orang
    Mantra had forgotten their language and replaced it with Malay, the language of
    their school-books and religious works.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Miklucho-Maclay reported that the Mantra people he saw, mostly children and
    women, were almost without exception of Malay type.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: According to Logan, the Mantra were chary of bathing and had a kind of top
    called gasing kunde as their only plaything.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Jakun of Rembau and Negri Sembilan are said to resemble local Malays closely,
    but the passage reports a historical and traditional claim that they were in the
    Peninsula before those Malays.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The same reported tradition says the Rembau Malays descend from the Jakun
    on their mother's side, connected by the author to the arrival of To' Peter or
    Tu Puttair.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Favre describes the Jakun of Rembau, Negri Sembilan, and related states as
    very short, with a low physiognomy, depressed lower nose, slightly projecting
    but generally well-formed lips, and a resemblance to Malays.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Logan described the Johor Jakun as taller than those of Malacca; some had
    hawked or aquiline noses, the men were healthy but generally thin, and the women
    were plump and healthy.
  category: attribute
  evidence_refs:
  - ev:10
