  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The general arrangement of blowpipe patterns is explicitly compared with that
    of quivers and charm-tubes and described as evidently similar despite differences
    between individual patterns.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Semang are reported to classify both blowpipe and quiver or charm-tube
    patterns in the same general groups; the grouping is said to have remained essentially
    the same even when individual figures were assigned differently.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Vaughan-Stevens is said to have adopted the Semang classification for blowpipe
    illustrations and only occasionally referred to it for the go' and ga'.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Blowpipe patterns called tenwad are divided into two types: those with ring-lines
    separating each band or panel from the next, and those with ring-lines only at
    the extremities.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In subdivision I A, the central portion called betud contains the chief motive;
