canonical_text:
  quote: ''
  summary: The passage describes technical rules and classification for Semang blowpipe
    patterns, including fixed relationships among pattern-band widths, methods of
    incising and blackening elements, cross-line conventions, and comparison with
    quiver, charm-tube, and comb patterns. Blowpipe patterns called tenwad are divided
    into two types depending on the placement of ring-lines, and one class has a central
    chief motive called betud, compared structurally with the central Disease-pattern
    on combs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The widths of pattern-bands or panels are described as having fixed relationships
    to one another, while the exact width of a free central panel is said to be of
    no consequence.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Semang are reported as generally beginning to cut the pattern at the top
    and bottom and working gradually toward the middle; the central panel design is
    also said usually to be incised first as a commencement.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Rules are given for cross-lines: a specified figure must not be hatched at
    the point of intersection, right-angled cross-lines are rarely inserted unless
    they can be given full length, and additional cross-line types produce differences
    among patterns.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Very short strokes are said to have the same significance as dots and to be
    produced with a blunt-pointed knife.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Broad black stripes and figures in the designs are said to be produced by
