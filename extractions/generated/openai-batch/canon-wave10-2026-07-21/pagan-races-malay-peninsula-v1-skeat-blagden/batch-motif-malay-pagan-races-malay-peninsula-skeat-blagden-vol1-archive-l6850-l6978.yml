canonical_text:
  quote: ''
  summary: 'The passage describes food practices among Berembun and Jakun groups in
    Johor and related areas: snake and monkey consumption, utensils and water containers,
    Jakun rice and tapioca use, exchange with Malay traders, variable meat preparation,
    elephant feasting practices, seasonal durian encampments, and honeycomb as a prized
    food.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Berembun tribes used snakes and some monkeys as food, and used dogs to
    discover snakes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists several kinds of snakes sought for food, says pythons and
    ripung were best flavoured, and reports that some snakes were considered poisonous
    even if their teeth were removed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Berembun tribes used wooden platters and coconut-shells for grinding condiments,
    and used large bamboos or a large melon-shell for carrying water.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jakun near Batu Gajah ate fruits and fish, obtained some rice, salt, and tobacco
    from Malay traders in exchange for forest products, and mainly subsisted on tapioca-root.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Batin informed H. W. Lake that during much of the year, when the people
    dispersed in search of jungle fruits, they lived entirely on tapioca-root and
    fruit.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Favre described Jakun food in general as irregular, including many kinds of
    animals and plant foods such as yams, plantains, wild fruits, leaves, and roots.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says Jakun meat preparation could include cooking, eating raw,
    or placing an animal on the fire until the hair was singed and then considering
    it cooked.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Favre saw large monkeys prepared by singeing, served on a mat to seven or
    eight people, who quickly ate them, leaving only the skeleton.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In eating, some Jakun used no dish; an iron frying-pan served for cooking,
    plantain leaves served as plates, and coconut-shells as drinking-cups.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Some Jakun tribes refused elephant flesh on the stated ground that it would
    cause sickness, while others ate elephant flesh.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: When an elephant was killed, Jakun called friends and relatives to a large
    feast and built huts for guests until the animal was entirely consumed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: During the durian season, Jakun families left their houses, went to durian-tree
    places, cleared the ground, stayed in leaf shelters, and for six weeks or two
    months ate nothing but durians.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the durian season ended, the place was deserted until the next proper
    season.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Favre reports honeycomb as one of the Jakun's most prized dishes.
  category: object
  evidence_refs:
  - ev:8
