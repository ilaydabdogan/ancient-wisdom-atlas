canonical_text:
  quote: ''
  summary: The passage gives ethnographic remarks on bows and blowpipes among Semai,
    Sakai, Semang, and other Malayan and Bornean groups. It compares bamboo and wooden
    blowpipe manufacture, proposes Sakai introduction and perfection of the blowpipe
    in the Malay Peninsula, and describes geographical distribution of more decorated
    or rougher blowpipe forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the natural weapon of the Semai is the bow and that
    they learned the blowpipe from the Sakai.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes the Bornean or Malay Archipelago blowpipe as a long
    wooden barrel or tube whose interior is bored out.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage contrasts wooden blowpipe manufacture with the Peninsular bamboo
    blowpipe, describing the wooden method as clumsier and more laborious.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Peninsular wild tribes manufacture blowpipes from
    a long-jointed bamboo identified as Bambusa Wrayi, while suggesting wooden forms
    may occur where that bamboo is rare or absent.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author supposes that the Sakai introduced the blowpipe into the Malay
    Peninsula and later perfected it.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the Bornean blowpipe has a sight, while Sakai blowpipes are
    believed to lack one, but the Bornean weapon is otherwise described as inferior
    in labor required, weight, and finish.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The most developed and decorated blowpipe type is reported among central Sakai
    or Senoi, Besisi, Mantra, and probably the Blandas of southern Selangor.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Outside the area of those named groups, the passage reports rougher and less-finished
    blowpipes; northern Semang are said to use a rough blowpipe with little decoration
    and often a native gutta or resin mouthpiece.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: A footnote reports that the Sakai use no weapons other than the blowpipe,
    while the Semang have a powerful bow and iron-barbed arrows; another note reports
    well-made blowpipes among Semang of Upper Perak and Selama.
  category: other
  evidence_refs:
  - ev:7
