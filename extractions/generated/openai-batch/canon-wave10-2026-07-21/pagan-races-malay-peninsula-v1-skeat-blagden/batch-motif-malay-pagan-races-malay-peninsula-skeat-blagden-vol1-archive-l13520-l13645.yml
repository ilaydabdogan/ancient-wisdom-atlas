canonical_text:
  quote: ''
  summary: The passage compares blowpipe quivers and darts among Sakai, Semang, Borneans,
    and South American Indians; records the use of clay pellets from blowpipes in
    Malacca, Perak, and Borneo; describes ordinary blowpipe loading with a dart and
    wad; and notes reports that some blowpipes were hidden in living bamboo stems.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Borneo quivers are described as contrasting with Sakai quivers: Borneans
    do not use a separate reed for each dart and instead attach a long wooden hook
    or prong to keep the quiver in position through the hunter''s belt.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sakai are described as fastening their quivers about their waists with a cord;
    the author speculates that they may once have gone naked.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Professor Tylor is cited for the general distinction that south-east Asian
    blowpipe darts do not have cotton butts, whereas South American Indian darts commonly
    do.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sakai and Semang are said never to use iron dart-points, while Borneo natives
    do; among Sakai and Semang, the point is described as one piece with the shaft.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Semang dart is described as coarser and clumsier than the Sakai dart,
    and the Bornean dart as clumsier still, with the shaft driven through the butt
    so that it may slide up and down.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Begbie records Jakun at Malacca shooting clay pellets, as well as darts, from
    blowpipes in 1833; Wray reports that such pellets are often used by bird-collectors
    at Malacca and have been used there from time immemorial.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wray reports a Malacca bird-collector using clay pellets for collecting in
    Perak, and Douglas reports that boys in Borneo commonly shoot small birds with
    small clay pellets from small blowpipes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In loading a blowpipe, the user holds it vertically in one hand and inserts
    the pointed end of the dart into the mouthpiece orifice with the other hand.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A small wad is almost invariably inserted behind the dart butt to prevent
    windage, and the wad is made from flocculent down.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Vaughan-Stevens reports that information about blowpipes was difficult to
    obtain and that in some cases the weapons were hidden in living bamboo stems in
    the jungle after the nodes had been removed.
  category: setting
  evidence_refs:
  - ev:6
