  summary: The passage describes charm-patterns on combs, especially the central panel.
    It says the patterns primarily represent affected parts of the body, may be combined
    for multiple affected parts, and may be repeated when disease-associated healing
    emblems are especially valued. It records terms for full-panel, repeated, unrepeated,
    and special-sign forms, and notes that the emblems represent parts of human anatomy.
    A footnote cautions that some terms lack corroboration.
