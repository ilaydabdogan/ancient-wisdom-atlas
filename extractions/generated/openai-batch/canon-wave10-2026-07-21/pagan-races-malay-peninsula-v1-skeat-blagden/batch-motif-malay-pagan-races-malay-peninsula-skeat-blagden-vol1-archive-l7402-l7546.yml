canonical_text:
  quote: ''
  summary: The passage describes Sakai belief in ubiquitous evil spirits and the use
    of worn ornaments as protective talismans, including an episode in which a girl
    insists on recovering copper-wire spirals from a necklace because their loss is
    believed to cause illness. It then describes Semang and Pangan girdles, waist-cords,
    leaf-belts, fungus-string girdles, bark loin-cloths, and the possible magical
    significance of retained ligatures or strings worn on the body.
  language: English
