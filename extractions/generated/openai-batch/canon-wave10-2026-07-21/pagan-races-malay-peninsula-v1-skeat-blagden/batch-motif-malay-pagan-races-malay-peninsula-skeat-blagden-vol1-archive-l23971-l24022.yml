canonical_text:
  quote: ''
  summary: 'The passage describes decorated Bamboo No. 3 and explains several represented
    figures: Tin-jui, a terrible saurian formerly conjured by the great chiefs called
    Puttos to kill an evil-doer; two named flowers used to exorcise the reptiles represented
    by Tin-jui and Chig-eg; Chig-eg, a similar creature that kills only women; and
    Aii, a long-tailed monkey that whips the winds sent by Kari when they are too
    slow.'
