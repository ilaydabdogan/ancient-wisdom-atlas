canonical_text:
  quote: ''
  summary: The passage describes a Besisi chiefly headgear called Buluh Bohal, said
    to be an inherited insignia of lineal chiefs, with a mystic knot and bamboo receptacle.
    A footnote conjectures a connection with bamboo cloth and a tradition that the
    first ancestor issued from bamboo. The passage then summarizes Mantra social equality,
    Batin offices and succession, the Batin's role in installing Rajas, legal principles
    by institutional setting, theft and property customs, and Benua-Jakun family relations.
  language: English
  quote_policy: summarized
