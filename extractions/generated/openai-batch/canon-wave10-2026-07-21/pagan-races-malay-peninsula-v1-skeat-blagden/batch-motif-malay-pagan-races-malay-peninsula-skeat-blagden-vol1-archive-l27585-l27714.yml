  quote: ''
  summary: The passage describes legal penalties, theft sanctions, marriage and inheritance
    rules, chiefship and succession among Jakun and Orang Laut groups, and comparative
    notes on the mobility of Semang, Sakai, and Jakun/Besisi groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Beating or wounding another person is answered by the same kind of beating
    or wounding; insult is punished by a fine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Theft requires return of property and a fine to the Batin; repeated theft
    may lead to confiscation of all property, and habitual theft may be punished by
    death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the group is strictly monogamous, treats conjugal infidelity
    as a capital offence, requires the defaulting party in divorce to return the dowry,
    and forbids selling children against their will.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Children whose parents have both died must be cared for by the next of kin.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: After parental death, property is divided equally among all children.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: If a Jakun man dies in debt, only half the debt is paid and the creditor loses
    the other half; the remaining property goes to next of kin, with a widow preferred
    over a grown son, though a man may leave property to any relation.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Newbold is reported as describing the Udai as without laws or government,
    but the authors warn that this should not be taken literally.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Orang Laut or Sea-Jakun chiefship system is said to have been the same
    as that of the Jakun, with titles such as Batin, Jinang, Jukrah, Penglima, and
    Hulubalang.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says little direct information survives about Orang Laut law and
    government, but it infers practical identity with the Jakun system and compares
    succession through a remark about Sabimba inheritance.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The wilder Semang are described as highly nomadic, rarely staying more than
    three days in one locality, living by hunting and gathering wild roots and game
    in the northern Peninsula.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Sakai tribes of Perak are described as tied to their own valleys, sometimes
    at feud with neighboring groups, and migratory within their own districts rather
    than generally wandering over all hills.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: Jakun groups, including the Besisi, are described as migrating over greater
    distances, including to Batu Pahat in Johor and the Strait of Dumei near Sumatra.
  category: action
  evidence_refs:
  - ev:9
