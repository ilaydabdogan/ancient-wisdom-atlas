canonical_text:
  quote: ''
  summary: The passage describes blowpipe shooting technique, dart range and accuracy
    reports for Sakai, Jakun, and related groups, and an ethnographic discussion of
    Ipoh and blowpipe origins in relation to Greater Malaya, bamboo availability,
    independent invention, and possible Sakai transmission.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fibrous material is described as collecting around leaf-bases of certain
    palms, especially tukas, or certain rattans, resulting from destruction of softer
    tissues.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: In shooting, the mouthpiece is usually taken into the mouth, with fingers
    commonly crossed under the tube near the mouthpiece.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sometimes only the edges of the mouthpiece are inserted between the teeth
    and lips.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the dart leaves the tube, the passage says it makes a sharp hollow sound
    compared to a pop-gun or air-gun discharge.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:11
- id: obs:5
  text: The effective range of blowpipe darts by the best shots is given as 50 to
    60 yards as an outside limit, while practical use seldom exceeds 100 feet.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cited reports describe Sakai shooting as effective at up to 60 yards, highly
    accurate at 50 yards, and capable of killing birds and monkeys in high trees at
    60 yards.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cited reports for the Jakun and Kuantan blowpipe give varying ranges, including
    about 70 or 80 feet for proper effect, 50 to 60 yards, and a rough Kuantan blowpipe
    range of about 40 paces.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Geiger is reported as treating Ipoh origin as probably not Malay in a narrow
    sense, while also noting a boundary between blowpipe-and-Ipoh users and non-users
    corresponding to the Malay and Polynesian language boundary.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Brandes is quoted as saying that natives who use the blowpipe form one family
    of languages.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The author concludes that Ipoh may be Malay in a wider Greater Malayan sense
    and that the wooden blowpipe may also be of Greater Malayan origin, while allowing
    that wooden and bamboo forms may have arisen independently.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that, if independently invented, the bamboo blowpipe must
    have been invented in a place such as the Malay Peninsula or Sumatra, where Bambusa
    Wrayi or Bambusa longinodis is indigenous.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage presents as a final supposition that the Sakai introduced and
    perfected the bamboo blowpipe, after which it was copied by aboriginal tribes
    of Malayan origin in districts lacking Bambusa Wrayi.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
