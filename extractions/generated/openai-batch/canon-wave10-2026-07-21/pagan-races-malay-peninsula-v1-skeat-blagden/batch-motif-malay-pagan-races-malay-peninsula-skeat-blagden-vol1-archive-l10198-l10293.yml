canonical_text:
  quote: ''
  summary: 'The passage lists the occupants and contents of a comparatively well-furnished
    Mantra hut, then describes Jakun, Negri Sembilan Jakun, and Malacca Jakun/Benua
    habitation forms: tree-huts or raised huts reached by ladders, hearth fire, loft
    storage, restricted building woods, movable huts abandoned during contagious disease,
    remote settlements with dogs, and branch enclosures made against predators.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Mantra hut is described as occupied by two men, two women, and two children
    and containing weapons, tools, cooking vessels, baskets, plates, cups, clothing,
    ornaments, and other household items.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jakun domiciles are described as being perched on trees, sometimes 25 to 35
    feet high and more commonly about 20 feet high, with access by ladder.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Dogs associated with the Jakun dwellings are said to have become accustomed
    to climbing the ladder.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some Jakun huts were only 3 or 4 feet from the ground; inhabitants lived,
    ate, and slept on the main floor, with a hearth at one side and a loft used for
    storage.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: A fire was always kept burning on the hearth to drive away mosquitoes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some Negri Sembilan Jakun houses were raised on four high wooden poles, elevated
    for fear of tigers, and entered by a long ladder.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: One-room Negri Sembilan Jakun houses could contain the whole family, dogs,
    and bodies of caught animals.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Negri Sembilan Jakun are described as restricted to using only pētaling
    and jambu k'lat wood in constructing these huts.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Their huts were made movable at a moment's warning, and a whole encampment
    could vanish in a single night on the appearance of small-pox or another contagious
    disorder.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The huts were usually in remote forested hillsides or dales, with small plantations
    nearby; bones and hair from eaten animals lay near them, and dogs warned of approaching
    strangers.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Some Malacca Jakun/Benua families lived without houses; groups of five or
    six families chose a place in thick forest and cleared a circular space about
    25 to 30 feet in diameter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The cleared forest circle was surrounded with cut branches and thorny branches
