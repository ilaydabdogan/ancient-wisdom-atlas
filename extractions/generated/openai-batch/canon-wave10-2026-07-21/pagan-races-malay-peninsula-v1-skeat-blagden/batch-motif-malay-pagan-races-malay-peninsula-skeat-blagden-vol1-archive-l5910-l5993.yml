canonical_text:
  quote: ''
  summary: The passage describes food preparation and subsistence practices among
    Semang, Sakai, Jakun, and Pangan groups, including torches, cooking with fire,
    bamboo and leaf containers, raw or roasted meat, treatment of poisonous yams,
    introduced iron cooking vessels, hunting and fishing, deserted shelter remains,
    and fire-making by friction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A simple torch is described as lumps of dammar wrapped with palm leaves and
    tied with vegetable fibres.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Semang, cooking is described as the duty of women; among more nomadic
    tribes it often consists of slightly roasting small mammals and birds killed by
    men, though some meat is eaten raw.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Flesh-meat is placed in a cleft stick that leans over a fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Rice, when available, is fire-dried in green bamboo; yams and roots are grated,
    wrapped in banana-leaf strips, and baked; fish are usually baked like bird and
    animal flesh.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Sakai are said to have methods similar to the Semang, and both groups
    have methods for treating poisonous yams so they can be eaten.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Iron cooking utensils, including Malay rice-pots, have been introduced among
    the coastal Jakun and to some extent among inland Sakai and Semang.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Kedah or Western Semang diet is described as rice, sugar cane, tapioca,
    wild roots and fruits, small birds and animals, and more often fish and turtle
    caught or harpooned in the river.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Some Negrito tribes still hunt with the bow, while the blowpipe has also been
    adopted in some places, especially toward the south.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Western Semang are described as not being restricted by religious rules
    in searching for food, with a footnote noting an alleged exception for the soul-bird
    elsewhere.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: In a deserted Pangan rock-shelter near Singora, the observer found remains
    of a fire, ribs of a small tortoise, and a half-smoked native cigarette.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: In deserted Pangan semicircular huts at Ulu Aring, the observer found remains
    of fires, bamboo vessels for dried rice, and a half coconut-shell probably used
    for drinking.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Pangan near Kampong Buntal used to come down to the Malay hamlet for rice
