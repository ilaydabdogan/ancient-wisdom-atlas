canonical_text:
  quote: ''
  summary: 'The passage explains symbolic decorative or charm patterns. One design
    encodes a tree, disease spots, fish-scale-like leprous scales, and blood-producing
    ulcers arranged in three rows for the patient''s head, body, and feet; it is described
    as a survival of a charm-pattern used by ancient Sakai magicians, with a note
    identifying it as a small-pox charm. Another design depicts a house-building charm:
    house wall, burnt clearing trees, palm leaves, props, thatching materials, creeper
    lashings, ladders or steps, intertwined rattans, cut leaves, thatch slats, and
    a zigzag jungle path, ending with the statement that the complete design assists
    a house-builder in finding and using materials.'
  language: English
  quote_policy: summarized
