  quote: '"Bringer-down of squirrels"'
  summary: The passage identifies the Besisi name for a quiver and its cover, describes
    the cover as a hollowed piece of soft wood, and states that tinder or palm-fluff
    was carried inside it for use as wadding when shooting with a blowpipe. It also
    notes that leaves of a creeper called the “Bringer-down of squirrels,” or another
    similarly named creeper, were carried in addition to the tinder.
