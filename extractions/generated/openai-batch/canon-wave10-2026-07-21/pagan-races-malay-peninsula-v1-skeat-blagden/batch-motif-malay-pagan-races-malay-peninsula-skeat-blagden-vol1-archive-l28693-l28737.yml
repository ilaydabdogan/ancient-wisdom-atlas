canonical_text:
  quote: ''
  summary: The passage describes Batins and Jakun chiefs as informants on traditions
    and laws, especially in relation to Malay Mohammedan customs. It reports Batin
    claims to forest and waste lands, the transfer of some governmental and taxation
    rights to the Beduanda, revenue-sharing arrangements in Johol, local fee collection
    in Muar, and a note on Menangkabau settlers entering Negri Sembilan as peaceful
    immigrants seeking fertile land.
  language: English
  quote_policy: summarized
