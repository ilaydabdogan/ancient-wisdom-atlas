canonical_text:
  quote: ''
  summary: Ethnographic notes describe illnesses among Jakun, Benua-Jakun, Orang Laut,
    Beduanda Kallang, and Sletar groups, including skin disease, fever, smallpox fear,
    abandonment of smallpox victims, a remembered vow to flee smallpox, closing rivers
    with felled trees during outbreaks, and herbal treatment prescribed by a Pawang.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jakun of Negri Sembilan are described as suffering chiefly from malignant
    skin diseases, partly inherited and partly attributed by the source to lack of
    bathing.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When housed in a building assigned by Rowland, the Negri Sembilan hillmen
    became despondent, developed dry painful coughs, repeatedly said they were about
    to die, and recovered after huts were built in their own manner.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among Jakun of Johor, a person attacked by smallpox is said to be entirely
    abandoned by parents, relations, friends, and neighbours.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: For other diseases, some treatment is given in the form of an infusion or
    decoction of wild plants prescribed by a Pawang.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Benua-Jakun are said to explain their fear of smallpox by a past severe
    visitation that thinned the tribe and led to a vow that descendants should flee
    from smallpox whenever it appeared.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: If smallpox broke out again, the Benua-Jakun would abandon both the victim
    and the locality.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Benua of the Lenggiu and Sayong are said to close their rivers by felling
    trees across them when they hear smallpox is present elsewhere in the country.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Beduanda Kallang of Singapore formerly occupied about a hundred boats
    but were reduced to eight families by smallpox.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Sletar are described as suffering from deformities of hands and limbs,
    widespread scaly skin eruptions, and disease of the feet resembling leprosy.
  category: attribute
  evidence_refs:
  - ev:8
