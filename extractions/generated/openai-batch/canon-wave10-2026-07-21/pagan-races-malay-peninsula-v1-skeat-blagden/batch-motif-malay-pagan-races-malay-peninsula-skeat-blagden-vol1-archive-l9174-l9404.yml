canonical_text:
  quote: ''
  summary: 'The passage describes several forms of leaf shelters in the Malay Peninsula:
    Semang and Pang-an palm-leaf ground-screens for rain and wind protection; round
    or bee-hive leaf shelters attributed to Pangran/Pangan groups; Tahan river leaf
    shelters filled with palm leaves for rest or warmth; and a larger Semang communal
    shelter in Kedah with multiple sleeping places, posts, palm leaves, and wind-braces.'
  language: English
  quote_policy: summarized
