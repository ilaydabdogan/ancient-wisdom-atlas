canonical_text:
  quote: ''
  summary: 'The passage describes arts, crafts, subsistence practices, trade, and
    transport among Besisi, Mantra, Jakun of Johor, and Benua-Jakun groups: Besisi
    metal-work and bamboo bellows; Mantra bag and mat making plus knotted-string date
    reckoning; Jakun hunting, forest-product exchange, baskets, mining, and dugout
    canoes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Besisi of Kuala Langat are described as having advanced somewhat in metal-work
    and as having acquired some idea of it from Malays.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A small Besisi forge near Sungei Ampang had bellows made of two upright bamboos
    with cloth-bound piston-rods moved alternately to create a continuous current
    of air.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mantra girls are reported as being taught to make bags and mats.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Writing is said to be unknown among the Mantra, who reckon dates by tying
    knots in a string.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Jakun of Johor are described as skilled hunters whose daytime activities
    include preparing arrows, weapons, arrow-poison, food from animals, and houses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Jakun who do not cultivate rice are described as gathering forest products
    and exchanging them at Malay houses for small quantities of rice.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Jakun panniers or back-baskets are said to be made either of basket-work or
    tree-bark, with one bark example made from meranti.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Jakun are said to be employed by Chinese tin-miners in some places, and also
    to work mines by themselves at Jelebu and sell tin at Pahang.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Benua-Jakun canoes are described as dugouts from one piece of wood, used for
    produce transport, fishing, and travel on the river network.
  category: object
  evidence_refs:
  - ev:8
