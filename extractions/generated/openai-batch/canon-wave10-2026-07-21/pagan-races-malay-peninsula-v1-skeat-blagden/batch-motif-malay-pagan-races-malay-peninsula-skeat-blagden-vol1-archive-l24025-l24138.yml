canonical_text:
  quote: ''
  summary: The passage describes a decorated bamboo called “Gu’” whose kli-cha flower
    designs, when used by great chiefs or Puttos in water, could drive the venomous
    sea-snake Ikub back to the sea bottom. It then describes birth-bamboos called
    “tahong,” concealed bamboo tubes worn by expectant Semang mothers under the girdle,
    containing flint and steel and bearing patterns that function as pregnancy charms
    and diagrams of stages from conception to birth. Notes explain specific marks
    representing the child, mother, their connection, and blood loss at birth, and
    mention rules of concealment, engraving, and an orthodox pattern held by the lesser
    chief Sna-hut.
  language: English
  quote_policy: summarized
