canonical_text:
  quote: ''
  summary: The passage describes a Mantra rice-harvest procedure in which the Rice-souls
    are called infants, the first seven ears are cut and taken home, additional padi
    is harvested and prepared for a feast, and guests receive uncooked new rice and
    food as berkat. It then lists cultivated padi varieties and rice-cultivation methods,
    and describes Benua-Jakun fruit-tree planting, later orchard reclamation, and
    seasonal residence in durian groves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage’s opening speech refers to the Rice-souls as infants that are
    taken up and borne homewards.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The operator cuts the first seven ears and carries them to his house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Members of the household are sent to another part of the field to cut more
    padi; the grain is trodden and rubbed out by foot, husked, and cooked with previously
    collected food.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: After the guests feast, each guest receives some uncooked new rice and food
    as berkat, described as a blessing or largess.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage gives a list of names used by the Mantra for different cultivated
    padi varieties.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Dry-rice cultivation is said to be the most prevalent, while wet cultivation
    is also reported at named places; a note distinguishes dry hill-rice, swamp-grown
    rice, and wet rice with embankments and water-courses.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Gambier planting is the only other form of cultivation the author says he
    has found ascribed to the Mantra in this passage, while other light crops such
    as tobacco are suggested as occasional crops.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Benua often plant young durian and chempedak trees among potatoes and
    bananas, revisit the place in later years, and clear young jungle around fruiting
    trees to reclaim the orchard.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Families sometimes go to distant durian groves, build slight temporary huts
    beside the fruit trees, and remain there for the fruit season of one to two months.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: At Danlek, smaller huts on the ground appeared to be devoted to durian-eating,
