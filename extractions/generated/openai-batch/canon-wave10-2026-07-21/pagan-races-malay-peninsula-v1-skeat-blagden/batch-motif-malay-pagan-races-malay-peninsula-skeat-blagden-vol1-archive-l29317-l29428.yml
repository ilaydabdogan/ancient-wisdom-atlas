canonical_text:
  quote: ''
  summary: The passage describes the Jakun as honest, independent, resistant to servile
    control, geographically and astronomically limited in formal knowledge, skilled
    with blowpipes and poisoned arrows, lacking writing or symbolic signs, and capable
    of education. It then compares Jakun and Malays, asserting similarities in ignorance
    and superstition but differences in manners, customs, moral qualities, and attitude
    toward instruction.
  language: English
  quote_policy: summarized
