  quote: ''
  summary: 'The passage explains Sakai drawings or copied patterns: a poisonous spider
    web scene with male, female, young, tree branches, and surrounding hill and forest
    signs; and a second copied pattern used as a charm for women catching small fish
    and protection against poisonous fishes, including tortoises and fishing equipment.'
  language: English
  quote_policy: summarized
