literal_observations:
- id: obs:1
  text: The skull is described with marked subnasal and dental prognathism, large
    flat nasal bones, a cordate nasal aperture, large blackened teeth, filed upper
    incisors and canines, slight chin prominence, and a short ascending ramus of the
    mandible.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The skull is classified with a series of craniometric terms and said to probably
    represent an intermediate form between dolichocephalic and brachycephalic types.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The vertebral column is said to show no particular marks of inferiority; the
    scapulae are described as small and broad, and the clavicles as diseased but unusually
    formed with an exaggerated curve.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pelvis is said to give the best indication of the skeleton's sex; the
    ilia are compared with the European pelvis, and the femurs are described as rather
    straight with accessory adductor tubercles.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author states that the skull cannot be assigned without hesitation to
    a well-recognised type, notes features described as infantile in the historical
    terminology of the passage, and states that the cranial sutures show maturity.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The conformation of the nose skeleton and type of prognathism are said to
    resemble skulls from Central African populations more than Oceanic populations,
    according to the passage's historical racial terminology.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage compares facial features with crania from Sumatra, Java, Borneo,
    and the Andamans, and compares scapula and femur traits with those of Bushman
    specimens while also noting differences.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A skeleton from Pahang described by Sir William Turner is said to differ from
    the described skeleton, being microcephalic and brachycephalic, but its identification
    as Semang is stated to be uncertain.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The observed Semang hair is described as crisp, short, very curly or woolly
    in purer types, brownish-black rather than bluish-black, and Negrito in section;
    chin-hairs are described as few and straggling, with little beard seen.
  category: attribute
  evidence_refs:
  - ev:8
