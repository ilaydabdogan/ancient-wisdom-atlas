  summary: A fragmented comment on Sea Jakun attitudes toward the sea and on Chinese
    and Malay bargaining is followed by W. L. H. Duckworth's note summarizing Annandale
    and Robinson's expedition data on physical characteristics and craniological specimens
    from groups in the Malay Peninsula.
