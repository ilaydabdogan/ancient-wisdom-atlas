literal_observations:
- id: obs:1
  text: The passage says it is hard to believe any true Sea Jakun really dread the
    sea, and suggests that a professed fear may have been fear of being taken by "white
    pirates."
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts Chinese bargaining, which is described as perhaps defensible,
    with Malay bargaining, which is said to go beyond the Chinese and not be defensible.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Duckworth's note states that Annandale and Robinson's expedition to the Malay
    Peninsula followed Mr. Skeat's expedition, and that Mr. Annandale had been a member
    of Skeat's party.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The note says observations are available for average skin and eye colour,
    hair characters, stature, and cephalic index for Semang, Sakai, people of the
    Trang coast, and South Perak Malays.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The note says the South Perak Malay data are probably entirely new.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The note says the results were tabulated in an appendix for general comparison
    and for comparison among the groups themselves.
  category: action
