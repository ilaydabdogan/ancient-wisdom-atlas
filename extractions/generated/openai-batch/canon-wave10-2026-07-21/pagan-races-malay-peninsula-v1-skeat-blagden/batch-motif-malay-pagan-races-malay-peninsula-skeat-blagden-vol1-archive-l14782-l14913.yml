canonical_text:
  quote: ''
  summary: Ethnographic description of Semang/Pangan blowpipe-dart construction, dart
    measurement, bamboo quivers, and the beginning of a detailed account of Kedah
    Semang Upas poison collection for darts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eastern Semang or Pangan blowpipe-dart shafts are described as rougher in
    workmanship than Sakai shafts and are made from the leafstalk of the bertam palm.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dart shaft is pared, polished with tiger's-tongue leaves, lightly touched
    with resin, fitted into a small cone-shaped butt-end, sharpened to a fine point,
    and nicked around the shaft near the point.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The nick is said to allow the dart point to break off when it collides with
    something, leaving the point in the wound; only the point below the nick is coated
    with poison.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator explicitly likens the dart to a bee-sting and states that this
    feature may have been copied from nature.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The conical butt is made from a kind of rattan, steadies the dart in flight,
    assists its momentum, and is pared to pass freely through the blowpipe tube.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Chintok reports that the Pangan of Ligeh use the foot as a standard length
    for a blowpipe-dart, and that another standard is the forearm bone from elbow
    to little-finger joint.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Semang quiver for new-made darts is a simple bamboo internode, often externally
    ornamented, and lacks the elaborate fittings of Sakai quivers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Padang went out at Siong to collect Upas poison for darts, carrying a bamboo
    poison receptacle, a jungle-knife or chopper, and wax from a small wild bee comb.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: For tapping the Upas tree, Padang affixed a strip of bertam palm leaf to the
    tree with wax and slashed V-shaped marks in the bark; the sap was described as
    dangerous to the eyes if it spurted, while the poison is described as a blood
    poison.
  category: sequence
  evidence_refs:
  - ev:7
