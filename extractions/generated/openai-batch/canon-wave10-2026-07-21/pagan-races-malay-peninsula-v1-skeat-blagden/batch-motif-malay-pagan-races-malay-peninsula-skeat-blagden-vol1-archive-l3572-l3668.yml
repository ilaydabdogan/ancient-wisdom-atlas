  quote: ''
  summary: The passage gives ethnographic observations about Sakai (Blandas) sensory
    abilities, eyesight tests, hearing, hands, feet, gait, and weapon-carrying habits.
    It also records a belief that a squinting Hantu threatens the padi harvest and
    that squinting is associated with a wider visual field.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sakai (Blandas) are described as fearing a demon, called a Hantu, connected
    with danger to their padi harvest and described as squinting.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sakai (Blandas) are said to believe that a person who squints has a wider
    visual field than a person with normal sight.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vaughan-Stevens reported only a few cases of short sight among the Sakai (Blandas),
    while noting that jungle men and women could point out animal horns in foliage
    and quickly notice small moving objects.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The jungle setting is described as thickly enclosed by trees and foliage,
    making estimates of far sight difficult.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sakai (Blandas) are described as having eyes that tire in strong light,
    while in open spaces Vaughan-Stevens could distinguish far-distant objects better
    than they could.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: L. Wray tested the eyesight of between thirty and forty Sakai of both sexes
    and concluded that they had very good sight as a race.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The hearing of the Sakai (Blandas) and Tembeh is described as less acute than
    that of the Takun and about equal to that of the W. Semang.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Sakai (Blandas), like the Semang, are described as having no difficulty
    extending one finger while the other fingers are closed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage describes features of Sakai feet and gait, including a bent little
    toe, frequent foot injuries from thorns or stones, setting down the middle of
    the foot, an upright body, and a slight rhythmic arm swing.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: A Sakai traveler is described as usually carrying a blow-gun in one hand and
    a parang in the other, ready to cut prickly rattan or other hidden obstacles.
  category: action
  evidence_refs:
  - ev:9
