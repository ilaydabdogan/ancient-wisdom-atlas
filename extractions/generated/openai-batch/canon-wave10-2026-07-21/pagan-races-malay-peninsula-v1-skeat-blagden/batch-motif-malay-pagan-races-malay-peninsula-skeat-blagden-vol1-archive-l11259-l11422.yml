canonical_text:
  quote: ''
  summary: The passage describes hunting, fishing, trapping, and related practices
    among Sakai, Blandas, and Besisi groups, including fish-poisoning with tuba, a
    communal fishing feast, children playing near poisoned water, a Blandas monkey-hunting
    charm invoking monkey souls and concealment of the hunter, keeping a young wild
    pig in a cage, and Besisi hunting weapons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Game-fences are made from sticks planted in rows with palm-leaves tied across
    them; game is driven against the fence and then shot or speared.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Selangor Sakai fish by temporarily poisoning small streams and rivers with
    sap from the pounded root of the plant called tuba by Malays; stupefied fish are
    caught by hand or with a harpoon or gaff.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: At a fishing feast at Ulu Beranang, families stayed on the bank under bertam
    palm leaves, counted the fish caught, dried fish on a wooden grill over a fire,
    and cooked supper.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:4
  text: Children swung on giant creepers and played in the water while mothers feared
    that the poison might harm them; one child suffered colic after drinking the water
    too soon.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:5
  text: After supper, children resumed playing, elders smoked and rested, and women
    continued drying fish into the night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: The Blandas of K. Langat eat what they can catch, are expert with the blowpipe,
    and use dogs to find quarry.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: A Blandas charm is presented as highly effective for bringing down monkeys;
    it addresses the lord and souls of apes and monkeys and calls them down.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:8
  text: The monkey charm describes tears and souls descending and asks that the monkeys
    not see the speaker, who walks hidden as if smoke-shrouded.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:9
  text: The Blandas sometimes keep wild animals for future consumption; the narrator
    saw a young wild pig kept in a strong cage beneath a raised hut-floor.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: The Besisi of K. Langat generally use the blowpipe in hunting, also possess
    spears and jungle-knives, and sometimes share an old Tower musket obtained from
    Malays.
  category: object
  evidence_refs:
  - ev:11
