canonical_text:
  quote: ''
  summary: The passage describes Pangan/Semang charm-patterns incised or charcoal-marked
    on bamboo sticks, charm-tubes, quivers, and later blowpipes. These objects are
    said to protect wearers from diseases, hold flowers, herbs, and magic leaves,
    and show continuity and adaptation between charm-holders, quivers, and blowpipe
    components.
  language: English
  quote_policy: summarized
