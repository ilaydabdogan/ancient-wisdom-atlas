canonical_text:
  quote: ''
  summary: The passage discusses scholarly theories about the racial and linguistic
    affinities of the Sakai and related groups in the Malay Peninsula. It contrasts
    Schmidt's proposed Mon-Annam identification with Virchow's tentative comparison
    of the Sakai with Vedda, Tamil, Korumba, and Australian groups, using physical
    measurements and linguistic arguments. No mythological narrative, ritual action,
    sacred object, or symbolic episode is presented.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Professor Rudolf Martin's measurements helped establish
    a distinct element in the Sakai racial problem and that this shifted the problem
    into a new phase.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports two alternative theories concerning the relationship of
    the Sakai to other groups in the region.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: One theory, attributed to P. W. Schmidt, seeks to identify the Sakai with
    tribes of Mon-Annam origin, partly on linguistic affinity and partly on Thorel's
    descriptions.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The passage cautions that linguistic evidence alone is an unsafe guide and
    notes physical differences between the Sakai and Thorel's third group of interior
    Cambojan tribes.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: The alternative theory, attributed to Virchow, tentatively regards the Sakai
    as an outlying branch of a group including Vedda, Tamil, Korumba, and Australian
    races.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The comparison with Vedda, Tamil, Korumba, Australian, and Sakai groups is
