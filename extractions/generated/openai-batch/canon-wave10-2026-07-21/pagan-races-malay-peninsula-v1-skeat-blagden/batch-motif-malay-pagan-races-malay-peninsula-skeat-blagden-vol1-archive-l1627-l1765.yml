  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage introduces the Jakun problem as the relationship between Malays
    and the Benua or mixed tribes in the southern Malay Peninsula.
  category: relationship
  evidence_refs:
  - ev:7
