canonical_text:
  quote: ''
  summary: 'Ethnographic description of Besisi hunting, trapping, and fishing: live
    capture and sale of animals, use of traps and bird-lime, a bamboo noose method
    for catching argus pheasants at their dancing-grounds, worm-bait angling including
    by women, and mangrove-creek rod fishing in which splashing attracts mud-fish.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Besisi are described as bringing in wild animals and birds caught alive,
    including birds, chevrotain, Gymnura, mangrove snakes, monkeys, and tiger-cats,
    and as selling some animals for small sums.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Besisi used spring-traps, fall-traps, springes, and game-fences to trap
    game of different sorts and sizes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bird-lime was made from viscous tree sap, sometimes mixed and boiled down,
    then applied to short rattan sticks or slivers set in notches on tree branches
    visited by birds.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Besisi usually kept bird-lime in small bamboo tubes corked with a section
    of bertam palm leaf-stalk.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The argus pheasant is described as shy, living chiefly in hilly forest, and
    using regular dancing-grounds that it clears of weeds and shrubs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: For argus pheasants, the Besisi of Kuala Langat planted sharp, flexible bamboo
    slivers bent into upright nooses in the centre of the birds' dancing-grounds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says argus pheasants may twist their necks in the nooses, allegedly
    mistaking them for new weeds, and may kill or choke themselves while trying to
    pull them up.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Besisi of Langat are described as expert fishers who use sand-worms and
    long mud-worms as bait.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that much angling is done by women, who become clever with
    the rod.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A rod-fishing method is described in which a fisherman goes by dug-out canoe
    at about half-tide among mangrove roots in salt-water creeks and fishes with a
    very short rod and short line.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In that method the fisherman splashes the rod tip vigorously in the water,
    causing large mud-fish such as sembilang and b'lukang to rush the bait.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The sembilang is described as having poisonous spines capable of causing painful
    wounds lasting several days.
  category: attribute
  evidence_refs:
  - ev:8
