canonical_text:
  quote: ''
  summary: The passage describes Sakai social order, chieftain titles, legal penalties,
    compensation, banishment, and contract practices. It reports the Penghulu's role
    in migration, judgment, and consultation with elders; penalties for murder, theft,
    and sexual disputes; and forms of exchange based on portable objects, food supply,
    leases, and loans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a village migrates, the Penghulu conducts the migration and may appoint
    chiefs over newly established villages from among his sons or relations.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A chief is described as equal to fellow tribesmen except when acting on behalf
    of the village's common interests.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among the Ulu Bertang Sakai, chieftains are reported to be called Seruyan
    rather than Batin; Ba-Naun and his son Ba-Jelang are named in this context.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The late Sultans of Perak are said to have given special titles to Sakai persons,
    including mentri-related titles and other named titles.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The death penalty is reserved for murder, and the relatives of the victim
    are permitted to execute the murderer using the weapon with which the crime was
    committed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A murderer is said usually to flee into the forest, where he is pursued and
    killed, often while asleep; murder is described as exceedingly rare.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Theft is punished by exclusion from the tribe; the exiled offender must make
    a new clearing away from the settlement and may be tied to a tree and flogged
    with a rattan if he refuses.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In disputes about women or assault, the Penghulu acts as civil and criminal
    judge and orders the guilty party to pay compensation.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Enticing away a married woman is punished by a fine of up to seven dollars;
    fines may be paid in money or, among some groups, in kind such as tapioca or rice.
  category: other
  evidence_refs:
  - ev:9
- id: obs:10
  text: A cited note says a murderer who used a blowpipe could be compelled to eat
    a portion of the victim's flesh.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A cited note describes adultery as a serious crime that may lead to fighting,
    with fines paid to the husband and the woman's fine paid by her father or brothers.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: In banishment, the condemned person is said to leave at two nights' notice
    and abandon property, wife, and children; in serious cases the Penghulu consults
    the elders.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The passage says there is no actual sale among Sakai who do not use money
    or substitutes for money; contracts may involve handing over a portable object
    in return for a promise of food supply.
  category: other
  evidence_refs:
  - ev:13
- id: obs:14
  text: A blowpipe with quiver and darts is valued at a fortnight's food supply for
    a family, while a beaten tree-bark loin-cloth is valued at a month's food supply.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: Leases are said to be rare because families usually cultivate their own land,
    though land may sometimes be leased in exchange for food; loans are said to be
    more usual.
  category: other
  evidence_refs:
  - ev:15
- id: obs:16
  text: A footnote dialogue reports that a hungry person or a man from a distance
    may ask and be given food.
  category: speech
  evidence_refs:
  - ev:16
