canonical_text:
  quote: ''
  summary: The passage describes Jakun palm-leaf dancing dress and then Mantra agricultural
    practice. It reports small clearings, burning of felled trees, planting of padi
    and yams, dream omens for choosing a new clearing, betel-leaf charm blowing to
    the four cardinal points, expulsion of devils, sprinkling with rice-flour water,
    burial of a talisman against a ground demon, and a special rice-sowing rite in
    which padi-seed is addressed as an infant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Jakun full dancing dress for the described occasions was made from woven
    strips of serdang palm leaves and included a fringed head-band, tassels, a bandolier,
    and a belt.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The palm-leaf dancing dress was worn the next morning at an additional impromptu
    performance before the observers departed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Mantra cleared a small piece of ground, burned felled dry trees, and planted
    padi and yams; the rice harvest was said to last only a couple of months.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Benua-Jakun made offerings to the earth-genie Jin
    Bumi when commencing a new clearing, and then introduces Mantra procedures for
    selecting a new plantation locality.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Mantra cultivator tested whether supernatural powers were favourable by
    attending to the first dream after selecting a locality.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Dreams of being chased by a dog or enemy, entering water, water flooding the
    locality, or similar incidents were treated as bad omens.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Dreams of felling or climbing trees, ascending a hill, or growing plants were
    treated as favourable omens.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After choosing a fortunate place, the cultivator took betel-leaf, repeated
    a charm over it, chewed it, and blew it toward the four cardinal points.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The charm asks for devils of every description to be expelled and driven away.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the charm ceremony, the cultivator felled an initial small space, later
    cleared more ground, burned the dried trees, sprinkled rice-flour water with a
    brush of leaves, and buried a talisman against an evil influence or bad demon
    in the ground.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The special rice rite used padi mixed with rice-flour water and lime-juice,
    a knife, a sarong, a censer, leaves, and incense smoke from gum benjamin or eagle-wood.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the rice-sowing invocation, the padi-seed is called an infant; leaves were
    then planted in the ground and the padi was sown.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage adds that similar ceremonies were used for wet or swamp rice.
  category: sequence
  evidence_refs:
  - ev:9
