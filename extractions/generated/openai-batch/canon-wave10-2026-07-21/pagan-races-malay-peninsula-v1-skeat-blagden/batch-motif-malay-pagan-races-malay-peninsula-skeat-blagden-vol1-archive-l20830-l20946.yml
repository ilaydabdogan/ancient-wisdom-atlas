canonical_text:
  quote: ''
  summary: 'The passage critically frames Vaughan-Stevens''s material on aboriginal
    Malayan decorative art, rejecting his flower-theory while valuing his collections
    and observations. It then describes a representational principle in tribal artwork:
    objects may be shown by a chief part or associated idea, as with a bat shown by
    a wavy wing-pattern and a stag by a small triangular slot. The author connects
    this principle cautiously with sympathetic magic and notes that complete animals
    and plants were also drawn on objects such as blowpipe shafts and bamboo implements.'
  language: English
  quote_policy: summarized
