canonical_text:
  quote: ''
  summary: The passage shifts from discussion of the blowpipe to discussion of Ipoh
    poison. It reports Geiger's view that the introduction of the blowpipe practically
    involved the introduction of poison, and that varieties of Ipoh poison were generally
    used more for hunting than for warfare. It distinguishes Ipoh antiar and derrid
    as practically harmless when taken internally, while Ipoh tieute may be dangerous
    because it contains strychnine and is usually used against beasts of prey such
    as tigers.
