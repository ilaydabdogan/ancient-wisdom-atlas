canonical_text:
  quote: ''
  summary: The passage gives ethnographic descriptions of clothing, hair treatment,
    and body oiling among Orang Laut groups and related named subgroups, with comparisons
    to Jakun and Malay dress practices. It notes bark-cloth and cloth garments, sarongs,
    waist-cloths, head ties, loose hair, children's nakedness before puberty, and
    the use of fat or oil to protect skin and hair from seawater and sun exposure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An opening fragment describes an unnamed group using cotton stuff or a similar
    tree-bark band in imitation of the Jakun, while disliking any covering for the
    top of the head even in the sun.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Orang Laut, both sexes use fat or oil on the body and hair because
    seawater is said to irritate unprotected skin when it is later exposed to the
    sun; coconut oil and other oils are now available, while fish-fat was formerly
    used.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among the Orang Laut, Sletar, men and women generally wore a coarse Artocarpus
    bark wrapper extending from the navel to the knee, and they sometimes used an
    old patched Malay sarong instead.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among the Orang Laut, Sletar, men bound their locks with a cloth tie or sometimes
    a Malay headkerchief, while women's hair fell over the face and shoulders.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Orang Laut, Sletar children are described as going entirely naked until puberty.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Orang Laut, Sabimba are described as having close relations with Malays
    and wearing cloth instead of tree bark; women wore sarongs after the manner of
    Malay women, while men wore a scanty strip of cloth around the middle and between
    the thighs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Among the Orang Laut, Muka Kuning, males mostly wore an Artocarpus bark chawat,
    and females wore short cloth sarongs.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Orang Laut, Akik are described as having dress resembling that of Malays,
