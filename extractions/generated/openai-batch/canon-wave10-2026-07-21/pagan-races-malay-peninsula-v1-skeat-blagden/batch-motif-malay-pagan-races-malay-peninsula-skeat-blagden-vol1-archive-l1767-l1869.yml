canonical_text:
  quote: ''
  summary: The passage surveys scholarly views on the Jakun/Benua, rejecting a simple
    Pan-Negrito origin and presenting them as aboriginal tribes settled in the Peninsula
    before Malay conversion to Islam. It reports an account in which Arab priests
    brought by trading vessels made converts, while Benua/Jakun who refused to abandon
    ancestral customs fled to interior fastnesses. The author describes the Jakun
    as a composite group, mostly aboriginal Malayan but sometimes partly Semang and
    Sakai, and discusses incomplete anthropometric, linguistic, and comparative evidence
    concerning their relationship to Malays and Malay Archipelago populations.
  language: English
  quote_policy: summarized
