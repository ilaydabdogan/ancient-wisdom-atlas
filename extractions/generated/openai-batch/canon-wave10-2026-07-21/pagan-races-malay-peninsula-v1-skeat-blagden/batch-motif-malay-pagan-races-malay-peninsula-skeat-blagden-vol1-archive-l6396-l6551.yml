  text: The passage presents Sakai tobacco, betel, and opium habits as probably or
    occasionally acquired through Malays.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Blandas diet is described as having less animal food and more rice than
    that of the Semang and Sakai; a meal observed in Kuala Langat consisted of boiled
    rice seasoned with acid jungle fruits.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Besisi make a preserve from durian pulp by burying the paste in the ground
    for months until after fermentation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Besisi are said to believe that acid fruits must not be eaten with game
    killed by poisoned darts because this would bring out poison symptoms in the eaters.
