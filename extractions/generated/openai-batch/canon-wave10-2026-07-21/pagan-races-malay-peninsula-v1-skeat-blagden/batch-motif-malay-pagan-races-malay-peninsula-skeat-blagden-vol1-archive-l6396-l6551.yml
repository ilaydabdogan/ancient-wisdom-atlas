literal_observations:
- id: obs:1
  text: Perak Sakai are described as very fond of tobacco and betel, using wild betel
    leaves when other betel is unavailable, and some may learn to smoke or eat opium
    from Malays.
  category: action
  evidence_refs:
  - ev:1
