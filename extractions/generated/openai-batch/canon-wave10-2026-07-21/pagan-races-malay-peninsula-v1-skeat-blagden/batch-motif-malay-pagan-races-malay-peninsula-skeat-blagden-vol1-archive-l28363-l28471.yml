- id: obs:4
  text: The Mantra of Malacca are described as suffering raids and incursions from
    neighbouring Malays, especially the Rawa.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Large Rawa bands under Bata Bidohom attacked the Mantra, killed many men,
    carried away more than a hundred women and girls into Pahang, and sold them as
    slaves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bata Bidohom was reputed to be invulnerable.
  category: attribute
  evidence_refs:
  - ev:5
