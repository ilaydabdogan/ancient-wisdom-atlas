canonical_text:
  quote: ''
  summary: 'Ethnographic passage on relations between aboriginal groups and Malays:
    Jakun guests report Malay violence and ask Europeans for help escaping; Mantra
    are raided by Rawa Malays under Bata Bidohom, who is reputed invulnerable, with
    men killed and women and girls enslaved. The passage then notes that Malay hostility
    may be restrained by fear of aboriginal supernatural powers, including the tuju
    or Pointing charm, and by belief in older gods and demons surviving under newer
    religions.'
  language: English
  quote_policy: summarized
