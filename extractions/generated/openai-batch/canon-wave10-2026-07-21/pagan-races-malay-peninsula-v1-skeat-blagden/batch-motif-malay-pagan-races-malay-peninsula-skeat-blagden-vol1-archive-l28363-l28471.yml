- id: obs:1
  text: Jakun guests at a Malay wedding-feast reported bad treatment by Malays, including
    recent killings and woundings ordered by a Malay chief.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Jakun speakers said they intended to escape to the Company's territory,
    asked the Europeans to take them, and two offered themselves as unpaid lifelong
    servants or slaves.
