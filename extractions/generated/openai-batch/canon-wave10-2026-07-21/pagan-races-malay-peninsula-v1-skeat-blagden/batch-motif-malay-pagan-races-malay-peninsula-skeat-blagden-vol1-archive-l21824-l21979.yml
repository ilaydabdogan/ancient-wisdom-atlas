canonical_text:
  quote: ''
  summary: Ethnographic notes describe Semang decorative charm-patterns on quivers,
    dart-quivers, combs, and bamboo objects. Quiver panels are said to aid hunting
    specific mammals; a dart-quiver design includes fish scales, rattan thorns, python
    bones, and hawks' eyes; and comb designs are described as protective charms for
    women against reptiles, insects, and disease. A similar protective design is reported
    as being painted on some Semang-Sakai women's breasts in the northern Plus valley.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Semang informants said the entire set of quiver patterns was intended to bring
    down monkeys, apes, and other small mammals and described the set as having magical
    virtue and as a slayer of many victims.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each quiver panel was said to contain a special design effective for bringing
    down a particular animal species; the first five panels concerned apes and monkeys,
    while two lower panels concerned the bear-cat and civet-cat.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A third dart-quiver is analyzed as having fish scales and rattan thorns in
    its first panel, python and python-bone designs in three middle panels, and hawks'
    eyes and scales in the fifth panel.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The writer states that this third dart-quiver appears to be a food-charm and
    suggests that the proximity of fish scales and rattan thorns may refer to rattan
    fish traps that hold fish by their scales.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: A comb design is analyzed as including rattan thorns, a diamond-shaped diagram
    filled with pitted marks called cucumber seeds, and cross-lines called tenweg.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The complete comb design is described as a charm protecting a woman against
    venomous reptiles and insects.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The chief's wife reported that a similar design, for a similar purpose, was
    sometimes painted on the breasts of women belonging to wild Semang-Sakai tribes
    in the northern Plus valley.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The described specimens were collected among the Negritos of Siong in the
    interior of Kedah.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The charm-patterns studied by Vaughan-Stevens are said to be Semang patterns,
    except for one Sakai tuang-tuang example, and to occur on bamboo combs, large
    bamboo tubes, and bamboo blowpipes.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Magical bamboo back-combs of Semang women are said to be worn throughout the
    Semang region, though on the western side of the main mountain range they are
    now worn more ornamentally, with rules for composing the patterns forgotten there.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: The bamboo back-combs, called tin-leig or tela', are described as protecting
    women against diseases such as fever; for external injuries, other talismans rather
    than combs are used.
  category: attribute
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: The Semang are said not to use these combs for dressing their hair, although
    women may wear eight or sixteen back-combs arranged around the head.
  category: action
  evidence_refs:
  - ev:10
