- id: obs:2
  text: The Sabimba used the blowpipe as their principal weapon to obtain tree-dwelling
    animals, and used dogs to hunt wild hog.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Beduanda Kallang are described as both fishermen and foresters who divided
    their time between these pursuits.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some Beduanda Kallang had small fishing-stakes near the river mouth and visited
    them in the mornings.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Akik are described as expert divers and fishermen who used nets they made
    themselves.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Money is said to be understood only by the most civilized members of the three
    races; trade is described mainly as barter in jungle produce.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Chief barter articles include gutta, tree-gum or dammar, wood-oils such as
    camphor and benzoin, perfumed wood such as eagle-wood or gharu, and to a limited
    extent minerals, especially tin.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: In return for jungle produce, the jungle-folk receive rice, tobacco, salt,
    areca-nuts, cloth, cooking utensils, implements, tools, weapons, and occasionally
    beads and looking-glasses.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that the jungle-folk appear to prefer dealings with Chinese
    traders, who obtain necessities for them and are said not to cheat them as mercilessly
    as the Malays.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage reports that many Malay legends refer to an alleged Sakai and
    Semang practice of leaving barter objects in a recognized spot and later taking
    articles left there by Malays as payment.
  category: sequence
  evidence_refs:
  - ev:8
