canonical_text:
  quote: ''
  summary: 'The passage describes several aboriginal Malayan groups by subsistence
    practice: the Udai as forest hunters, the Sabimba as blowpipe and dog-assisted
    hunters, the Beduanda Kallang and Akik as fishermen, foresters, divers, and net
    users. It then introduces barter, stating that jungle produce is exchanged for
    goods such as rice, tobacco, salt, tools, weapons, and occasional luxuries. It
    notes a preference for Chinese trading partners over Malays and reports that many
    Malay legends refer to Sakai and Semang depositing barter goods at a recognized
    spot and later collecting goods left by Malays as payment.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Udai are described as preferring hunting to agriculture, roaming the forest
    by day, and living on animals they captured.
  category: action
  evidence_refs:
