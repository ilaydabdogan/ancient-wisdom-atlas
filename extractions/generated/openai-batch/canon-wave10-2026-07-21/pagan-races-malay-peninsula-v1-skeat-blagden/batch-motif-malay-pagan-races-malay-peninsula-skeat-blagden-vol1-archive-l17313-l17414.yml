canonical_text:
  quote: ''
  summary: The passage describes a Kuantan blowpipe quiver, its darts, poison traces,
    and associated contents; compares the specimen with Benua-Jakun, Dayak, Borneo,
    Sakai, Besisi, and Peru blowpipe traditions; and begins an account of Benua-Jakun
    blowpipe manufacture from split penaga wood with bamboo casing and rattan bindings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The quiver exterior is described as having a flattish four-peaked pandanus-leaf
    cap, plaited rattan rings, a plaited bark cord, a waist cord, incised decoration,
    and resin traces at the bottom.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The quiver interior contains a rolled-up reed bundle with sixty-five reeds;
    five reeds contain darts and one additional loose dart is present, making six
    darts total.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The darts are reported to have broken or blunt points; the passage says they
    were probably used for knocking over small birds, and only the loose dart has
    traces of poison.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The dart butt-ends are made from very light pith-like wood, are irregular
    in length, incompletely rounded, cut square at the lower end, and do not taper
    toward the shaft as in better-made Sakai and Besisi darts.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In two darts the shaft is driven through the butt-end, a feature the passage
    says may be seen in Borneo blowpipe-darts.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The remaining quiver contents are two rolled-up pieces of old chintz cloth
    and a spear-shaped wooden spatula still coated with poison.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The author identifies the blowpipe and quiver as a variety of the Benua-Jakun
    blowpipe and quiver known from eastern Johor, despite the Kuantan provenance north
    of the Pahang River.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Benua-Jakun blowpipe is described as having a wooden internal tube and
    a bamboo outer casing, with length and calibre varying by maker.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Benua-Jakun blowpipe is described as rare, taking sixteen days to make,
    and being made from a felled and split penaga sapling whose halves are shaped,
    fitted, bound with rattan, rounded, trued by wetting and pressing, marked with
    charcoal, and grooved.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A reported Kuantan bored blowpipe is said to resemble that of the Dayaks,
    but the passage states uncertainty about whether it is indigenous or introduced
    by Dayaks.
  category: relationship
  evidence_refs:
  - ev:9
