canonical_text:
  quote: ''
  summary: The passage analyzes Negrito quiver, charm-tube, blowpipe, and comb patterns,
    especially their panels, names, gender associations, and supposed disease-warding
    functions. It discusses blank centre panels, possible imitation or transfer of
    designs among object types, and the uncertainty caused by contradictory pattern
    names and explanations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women are described as having seventy main Disease patterns on combs, excluding
    varieties, and those comb patterns are said to include only Diseases that may
    attack women alone.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The writer argues that men and women probably had different patterns for Diseases
    common to both, and that tubes meant to be efficacious for both sexes would need
    two patterns, associated with a blank centre panel.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Quivers F and G are said to have no dividing centre panel and special quiver
    patterns for women; quiver O is described as having an empty centre panel with
    the same pattern at top and bottom in reverse order.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that the meaning of the patterns remains difficult, but
    that comb designs appear to imitate men's quiver patterns with a broad incised
    centre panel.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says there are no fundamental differences in the outer arrangements
    of quivers, charm-tubes, and blowpipes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Certain blowpipe pattern classes contain whole panels or whole designs filled
    with dotted figures, and the blowpipe drawings lack spirals in place of ring-lines.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Several quiver and charm-tube names include body-part expressions, and some
    pattern names or Disease titles are linked to affected body parts that the patterns
    are supposed to protect.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Patterns with the same name and similar sickness function may be identical
    or entirely different, while nearly identical patterns directed against a similar
    Disease may have different names.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Every blowpipe pattern is said to have a special name, but the passage says
    it is undecided whether untranslated names also denote Diseases.
  category: speech
  evidence_refs:
  - ev:9
