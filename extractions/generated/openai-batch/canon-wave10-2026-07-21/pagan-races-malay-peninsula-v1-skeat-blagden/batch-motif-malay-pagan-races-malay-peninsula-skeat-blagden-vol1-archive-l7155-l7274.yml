canonical_text:
  quote: ''
  summary: The passage discusses dress among the wild tribes of the Malay Peninsula,
    especially disputed reports of nudity, the stated absence of animal skins and
    bird feathers in dress, and the comparative interest of girdles, including a Semang
    fungus-string girdle said to resemble some Andamanese girdles. The passage also
    lists illustrated Negrito and Semang articles of apparel and ornaments.
  language: English
  quote_policy: summarized
