canonical_text:
  quote: ''
  summary: The passage surveys weapons and implements used by aboriginal groups of
    the Malay Peninsula, including bamboo knives, possible stone flakes, Malay kris
    daggers, wooden and bone awls, throwing-sticks, bamboo and metal spears, hatchets,
    adze lashings, blowpipe-mounted spearheads, and firearms obtained by barter. It
    repeatedly compares these tools with Malay models and supplies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sharp sliver of bamboo is described as the most primitive and locally natural
    form of knife, found among wild tribes and also on some Malay ceremonial occasions.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Stone flakes or chips are presented as possible former substitutes when Malay
    knives were unavailable and bamboo or bone knives were inadequate.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Malay kris daggers and other Malay weapons are occasionally used by wild tribes,
    especially the Jakun; wooden and bone awls are still used for boring.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The earliest local spear is proposed to have been a throwing-stick or “squailer,”
    recorded among the Jakun and also known in two forms to Peninsular Malays.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bamboo spears are still largely used, especially by wilder aborigines; metal
    spears of Malayan types are used for fishing and hunting.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: No stone spear-head had been found in the Peninsula, and the author suggests
    that earlier spear-heads may have been made of bamboo or another perishable material.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: In war, spearheads are sometimes lashed to the muzzle-end of a blowpipe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Hatchets used by the wild tribes are generally obtained from Malays by barter
    or purchase; any rude substitutes are said to copy Malay blade models.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that no independent axe-type is recorded among Sakai or
    Semang, though they may have non-Malay names for such tools.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Malays in Besisi and Blandas country reportedly said that experts could distinguish
    Malay and Jakun adze-head lashings.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: All branches of the wild tribes are said generally to possess some firearm,
    usually an old Tower musket, often owned or used in common by the men of the tribe.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Firearms are said to be obtained by barter at extortionate rates from friendly
    Malays or Chinamen.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: A cited account reports tree-huts with sharpened wooden spears or sticks,
    including missile sticks with traces of blood and feathers.
  category: setting
  evidence_refs:
  - ev:10
