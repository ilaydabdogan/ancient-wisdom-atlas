literal_observations:
- id: obs:1
  text: The passage states that the wildest Semang do not appear as a race to tattoo
    or scarify the face or body, though some may have learned scarification from the
    Sakai.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Semang men especially often shave the head, and about half a dozen front teeth
    are sometimes filed, though tooth-filing is not necessarily described as a Semang
    custom.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Semang women wear a magic comb in their hair, and the comb is believed to
    avert disease and danger.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Semang do not circumcise.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The distinctive Semang weapon is described as the bow with poisoned arrows;
    many have adopted the blowpipe of the Sakai and Jakun.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Semang habitations are described as natural shelters under overhanging rocks
    or simple leaf-shelters on the ground or between tree branches.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: An advanced type of leaf-shelter is described as long enough to accommodate
    the entire tribe and furnished with bamboo bed-places.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Semang are said to have no boats, but occasionally use rough bamboo rafts
    for drifting downstream.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Their musical instruments are described as bamboo stamping instruments, a
    nose-flute, and a Jew's-harp; they have no drums.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Semang barter jungle produce with the Malays, but do not work for them
    as much as the Jakun do.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says the Semang have deities called Kari and Pie, described as
    mythological personages or otiose gods rather than objects of an actual cult.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: Kari and Pie are said to have many divine attributes, while the passage notes
    practically no trace of an actual cult directed to them.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Semang marriage rite is described as slight, but the group is characterized
    as strictly monogamous and faithful to the marriage tie.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: The passage reports a Malay claim that Semang formerly devoured their dead
