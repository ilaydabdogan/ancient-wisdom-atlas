  summary: 'The passage gives ethnographic descriptions and comparisons of Sakai,
    Tembeh, Semang, Senoi, and Jakun physical endurance and practices: climbing, access
    to raised huts, swimming, sleeping postures, sleeping spaces, clothing, and weather
    discomfort.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sakai (Blandas) and Tembeh (Temia) are described as being at the bottom
    of the scale for strength and physical endurance.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sakai (Blandas) are said to be less clever than the Semang in passing
    through bush or jungle, but to have a better sense of direction.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sakai (Blandas) are described as better than the more civilised Semang
    at climbing a straight high stem.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: For small trees, the Sakai (Blandas) climb like the Central Sakai (Senoi);
    for larger trees, they use nearby runners, climbing-plants, or smaller trees rather
    than cut notches in the bark.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Access to high raised Tembeh (Temia) huts is by a diagonally placed trunk
    or sloping bamboo, with a similar shorter trunk noted among Kuantan Sakai mixed
    with Tembeh blood.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: One stated reason for raised hut access is to prevent dogs and fowls from
    entering huts without doors and causing mischief while men are away.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Among the Tembeh (Temia), the raised and slippery bamboo access is said to
    keep out intruders, especially black panther and python.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Very small children are sometimes left for hours in raised airy huts, where
    they are said to be safe from great cats and snakes and protected from falling
    by a low parapet.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Sakai (Blandas) swim little, mainly when crossing a river or bathing,
    and use a dog-like forward circular arm stroke.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Central Sakai (Senoi) are considered the best Sakai swimmers, probably
    because the Pahang river gives them more practice; the Tembeh (Temia) are said
    not to swim at all.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Sakai (Blandas) women generally sleep on the back with the head slightly raised,
    explaining that side-sleeping would put weight on the hip and cause latah or cramp.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Sakai (Blandas) men often sleep on the back with legs drawn up, though side-sleeping
    also occurs; stated reasons for back-sleeping include detecting vermin and hearing
    noise or alarm better.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Among the Sakai (Blandas), as among the Semang (Pangan), bachelors inhabited
    the verandah or external part of the hut when such a space existed.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:14
  text: Among the Tembeh, the sleeping space of married people was separated by a
    low partition.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:15
  text: Sakai groups that have adopted Malay clothing are said to experience discomfort
    without headgear in the sun, and the Sakai (Blandas) are said to suffer more from
    cold wet mountain winds than the Jakun.
  category: attribute
  evidence_refs:
  - ev:13
