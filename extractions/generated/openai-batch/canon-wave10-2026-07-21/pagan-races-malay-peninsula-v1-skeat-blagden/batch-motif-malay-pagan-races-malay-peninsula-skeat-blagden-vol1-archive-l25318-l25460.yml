  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: To the right of the Argus are two blue scorpions approaching each other; objects
    before the stings represent swellings, with a double row of dots for the female
    sting effect and a single row for the male sting.
  category: object
  evidence_refs:
  - ev:12
- id: obs:15
  text: The original Fig. 8 pattern was incised on a bamboo tuang-tuang; the stated
    interpretation is that the Argus pheasant's help is summoned against scorpions
    and millipedes by striking the bamboo on the ground because the bird lives on
    them.
  category: action
