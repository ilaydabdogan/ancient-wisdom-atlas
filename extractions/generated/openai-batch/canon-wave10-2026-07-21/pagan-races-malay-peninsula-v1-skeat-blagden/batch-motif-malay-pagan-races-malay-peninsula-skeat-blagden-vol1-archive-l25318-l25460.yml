    were said to denote seven bamboos.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Object A is identified as the chief bamboo of a tuang-tuang ceremony, and
    B as the second bamboo.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Figures on the second bamboo represent two sorts of rattan important in preparing
