canonical_text:
  quote: ''
  summary: The passage describes Sakai decorative and ritual patterns on blowpipes
    or bamboo musical instruments, including ape elbows, bamboo stems, vampire parts,
    clouds, stars, rattans, and animal figures. It also describes painted bamboos
    used in a ceremony by a magician and pupil, a catalogue of charm patterns against
    animals, disease, house collapse, and drought, and a specific charm pattern where
    an Argus pheasant is invoked against scorpions and millipedes by striking an incised
    bamboo on the ground.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
