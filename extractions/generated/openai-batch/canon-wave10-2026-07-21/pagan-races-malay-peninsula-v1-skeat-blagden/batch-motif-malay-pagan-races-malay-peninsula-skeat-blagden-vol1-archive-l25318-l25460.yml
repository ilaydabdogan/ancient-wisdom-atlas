    and repeated figures indicate multiplicity.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The two bamboos do not form a pair, came from different localities, and the
    shorter one is always held in the right hand.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Vaughan-Stevens obtained specimens of charm patterns against scorpions and
    millipedes, mice and squirrels, ants, skin disease, house collapse, millipedes
    for women searching for salak-palm fruit, spiders, poisonous-spined fish, rice-harvest-destroying
    animals, and drought; one figure is unexplained.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In Fig. 8, a male Argus pheasant appears at the center with two long tail-feathers;
    wheel-shaped marks represent the tail markings and disc-shaped marks represent
    the wings.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: To the left of the Argus pheasant is a long reddish-yellow millipede, with
    its head toward the Argus tail; dotted lines represent traces left on flesh by
