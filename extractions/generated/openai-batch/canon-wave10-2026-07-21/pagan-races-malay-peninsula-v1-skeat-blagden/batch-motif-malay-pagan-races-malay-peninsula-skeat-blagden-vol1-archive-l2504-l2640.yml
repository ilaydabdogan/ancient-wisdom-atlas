  text: 'The passage lists mixed categories: Semang plus Sakai, Semang plus Jakun,
    Sakai plus Jakun, and further crosses arising from these mixed groups.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note states that half-bloods with Malay or Chinese fathers are said to be
    unknown among the wild tribes, while such admixture is permitted but disliked
    by clans in close contact with Malays.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Semang country is described as running roughly from Chaiya and Ulu Patani
    to Kedah, then to mid-Perak and Northern Pahang.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage reports height measurements for Semang or Pangan adults, including
