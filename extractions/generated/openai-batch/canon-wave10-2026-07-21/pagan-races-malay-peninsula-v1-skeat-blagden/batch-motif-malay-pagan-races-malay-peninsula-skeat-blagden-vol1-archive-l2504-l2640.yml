  summary: The passage classifies mixed Semang, Sakai, and Jakun populations; describes
    Semang territory and physical measurements; notes bodily practices such as tooth
    filing; includes a caption of a Sakai girl carrying a bamboo water cylinder; and
    reports a N. Sembilan belief about a stranger in a Jakun house who talks the husband
    to sleep.
