  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage describes physical features including a round face, low and projecting
    forehead, short flattened nose, broad cheekbones, sometimes everted lips, small
    ears, and slight jaw protrusion.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The six front teeth in the upper jaw are often filed to make a concave anterior
