canonical_text:
  quote: ''
  summary: The author states that aboriginal or native groups are tending toward assimilation
    and absorption, with losses of language, customs, and other attributed qualities.
    He argues that the trend may be too late to avert fully, and proposes official
    study of native thought, law, and custom, along with encouragement of native industries
    and culture. He links this to giving status and self-respect, especially to the
    Malay peasant accustomed to jungle or sea life, and claims this would benefit
    alien races subject to Malay assimilation more than forest reservation or paternal
    oversight.
  language: English
