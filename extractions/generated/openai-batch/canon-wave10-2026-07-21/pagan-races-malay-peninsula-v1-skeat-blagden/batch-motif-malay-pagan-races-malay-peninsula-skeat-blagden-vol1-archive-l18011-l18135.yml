canonical_text:
  quote: ''
  summary: The passage describes Semang and Sakai subsistence and cultivation practices,
    including Chinese millet, hill-rice, catch-crops, shifting forest clearings with
    burning, elevated rice storage, wild fruit gathering by lopping boughs, and planting
    rice seed with pointed sticks rather than ploughing or harrowing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Semang are described as planting Chinese millet, called sekoi or cat's-tail,
    as a substitute for rice, possibly because it grows better than rice on higher
    ranges.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author records the Semang as millet-eaters and discusses whether the name
    Orang Sekoi, or Millet-men, may derive from millet-eating, while noting an alternative
    possible derivation from a stream or river name.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At a later stage, Negritos are described as still semi-nomadic, migrating
    after harvest, and growing hill-rice along with catch-crops such as bananas, sugar-cane,
    tapioca, maize, and sweet potatoes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hill-rice cultivation is described as selecting and clearing a fresh forest
    plot, usually on a hill slope, lopping branches from fallen trees, burning debris,
    and sowing rice among remaining stumps during the rainy season.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Siong in Kedah, Semang had cleared part of the slope of Bukit Temesu and
    planted rice and light catch-crops, except tapioca.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Semang at Siong stored harvested, poor-quality rice in a very small hut
    or barn on high posts to keep it beyond the reach of small mammals.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author states that the preceding remarks apply equally to the Semang of
    Perak.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Perak Sakai gather wild tree fruit by climbing trees, lopping fruit-laden
    boughs, and then picking fruit from the boughs on the ground; a note says the
    Malays also practice this method.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hill Sakai are said to practice no agriculture, while Sakai who have reached
    the earliest agricultural stage are described as cultivating Chinese millet.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Wray is reported as seeing a Sakai millet field at 2400 feet in Perak and
    as noting millet cultivation, tapioca as staple food, and additional crops such
    as sweet potatoes, sugar-cane, pumpkins, and tobacco.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Perak Sakai are described as not using ploughing or harrowing implements,
    instead making holes with a pointed stick between roots and tree-stumps for rice
    seed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Kampong Chabang on the upper waters of S. Kerbu is described as having an
    aboriginal jungle clearing of about five acres.
  category: setting
  evidence_refs:
  - ev:8
