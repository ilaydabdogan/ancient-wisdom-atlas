canonical_text:
  quote: ''
  summary: The passage describes legal and political customs involving Adat Perpatih,
    Adat Temenggong, Batin Gemala's attempted establishment of a Penghulu in the Muar
    area, and the resulting quarrels. It then describes Berembun tribes as protected
    by neighboring Malays' and Chinese people's belief in the supernatural power of
    Berembun Poyangs, who are sought for cures and for revenge through disease or
    misfortune. It also briefly characterizes Berembun tribes as not practicing war
    and describes Benua-Jakun subsistence conditions.
  language: English
  quote_policy: summarized
