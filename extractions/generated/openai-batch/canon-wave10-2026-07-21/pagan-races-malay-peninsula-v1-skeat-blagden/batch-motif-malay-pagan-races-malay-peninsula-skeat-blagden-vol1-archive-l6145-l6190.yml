canonical_text:
  quote: ''
  summary: 'The passage describes Semang and Pangan fondness for tobacco, their use
    of decorated bamboo tubes for carrying it, and their usual acquisition of it by
    barter from Malays, with some groups said to grow tobacco. It then describes Perak
    Sakai food practices: wilder Sakai live on wild tubers, roots, fruits, and animals
    or birds shot with blowpipe darts, generally seeking game only when other foods
    fail. More settled tribes cultivate garden crops including maize, sugar-cane,
    tapioca, sweet potatoes, yams, rice, and other plants, and are reported not to
    use salt. A footnote reports Semang-Sakai burning freshwater shells to make lime
    for betel.'
