canonical_text:
  quote: ''
  summary: The passage summarizes physical-anthropological comparisons among Semang,
    Sakai, Pangan, Orang Laut, Orang Bukit, Samsam, and related groups, focusing on
    measurements of living people and skulls. It then notes limited observations on
    diseases among aboriginal groups, especially fear of small-pox and the prevalence
    of ulcers and skin disease among Semang.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Semang and Sakai types are connected by many transitional
    forms, making the extreme forms distinguishable only through examination of very
    large numbers of individuals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says cephalic index does not clearly differentiate Semang and
    Sakai, while stature, skin-colour, and hair-characters are more reliable for the
    distinction.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the Samsams of the Trang coast, like South Perak Malays,
    stand apart from Semang and Sakai.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the measured Pangans fall within the range of variation established
    by observations in the Fasciculi Malayenses.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says a Pangan skull provided by Mr. Skeat aligns with the Semang
    and Sakai group except in cranial capacity, which is greater than in cases observed
    in Fasciculi Malayenses.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage describes Grubauer's Semang skull as microcephalic but having
    an unusually high cephalic index figure of 85.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says reported high radio-humeral index figures for living Semang
    likely result from the authors' method of measurement and overstate forearm length.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage warns that conclusions based on skulls from ancient cemeteries
    require caution, using an Orang Laut Kapir skull as an example.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says little has been observed about diseases among wild aboriginal
    tribes and that they appear not much troubled by sickness overall.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says all of the wild aboriginal tribes are in mortal terror of
    small-pox, from which many tribes have suffered at times.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says fever appears to trouble the Semang less than malignant ulcers
    and minor cutaneous diseases.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage reports that the wife of the Semang chief at Siong had a severe
    ulcer that had eaten deeply into her left leg.
  category: attribute
  evidence_refs:
  - ev:9
