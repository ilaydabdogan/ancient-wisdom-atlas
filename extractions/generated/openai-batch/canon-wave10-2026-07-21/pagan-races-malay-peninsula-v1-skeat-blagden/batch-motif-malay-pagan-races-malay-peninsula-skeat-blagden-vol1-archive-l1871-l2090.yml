canonical_text:
  quote: ''
  summary: 'The passage proposes standards for classifying three main ethnical groups
    of the Malay Peninsula, cautions that intermixture produces variation, describes
    physical traits assigned to Semang, Sakai, and Jakun types, and aligns these groups
    with Martin''s hair-character classes: woolly-haired, wavy-haired, and smooth-haired.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author says a synoptical table is intended to provide standards for testing
    and classifying three main ethnical groups of the Peninsula, while noting that
    intermixture can produce divergence from those standards.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Semang type is described with short stature, a brachycephalic-to-mesaticephalic
    skull index, dark copper or chocolate-brown skin tending to shiny black, woolly
    hair, a broad flat nose, round straight eyes, a weak chin, and little or sparse
    beard.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sakai type is described as slightly taller than the Semang, dolichocephalic
    or long-headed, with variable skin colour, long black wavy hair, a flat projecting
    forehead, a small fine often tilted nose, broad cheek-bones, small horizontal
    often half-closed dark-brown eyes, a longer pointed chin, a small mouth with a
    full projecting lower lip, and little beard.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Jakun type is described as perhaps the tallest of the three, brachycephalic
    or bullet-shaped, with generally dark coppery skin, long straight smooth dark
    bluish-black hair, high marked cheek-bones, a flattish face, dark-brown eyes of
    moderate size, a strong chin with square jaws, a large or broad mouth, and scanty
    beard.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author presents Martin's hair-character classification as distinguishing
    the Semang as Ulotrichi or woolly-haired, the Sakai as Cymotrichi or wavy-haired,
    and the Jakun or aboriginal Malayan type as Lissotrichi or smooth-haired.
  category: relationship
  evidence_refs:
  - ev:5
