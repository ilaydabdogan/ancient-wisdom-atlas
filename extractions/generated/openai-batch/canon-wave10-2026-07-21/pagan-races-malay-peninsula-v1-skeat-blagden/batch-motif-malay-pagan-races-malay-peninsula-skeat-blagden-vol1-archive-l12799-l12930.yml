canonical_text:
  quote: ''
  summary: 'The passage discusses stone implements called batu lintar from the Malay
    Peninsula: their regional distribution, uncertain origin and use, Malay beliefs
    that they were missiles of evil spirits, possible attribution to an earlier race,
    practical or medicinal uses among Malays, and debate over whether Perak cave-dwellers
    made them.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Forty-nine stone implements called batu lintar were sent from the Malay Peninsula
    and described as occurring across the Indian Archipelago and in parts of mainland
    Southeast Asia.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vaughan-Stevens could not identify the race that had used the implements,
    and the Malays and wild tribes were said not to know their origin or use with
    certainty.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wild tribes were said to ignore the stones when encountered, while Malays
    were said to believe they were missiles of evil spirits and to store them in huts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The described stone implements included clubs or mallets, chisels or gouges,
    adzes, knives or choppers, and a stone ring; no spear-head or arrow-head specimen
    was reported.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The implements were found at varying depths below the surface.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Some wild tribes asserted that a former race of men, distinct from themselves
    and the Malays, once lived in the Peninsula; the passage says the use of stone
    implements was only vaguely and tacitly attributed to that race.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some stones showed traces of copper and iron under the microscope.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Malays used some of the stones as tips for the metal spurs of fighting-cocks,
    believing such tips could not be blunted; Malay children also played with the
    stones and tried to smooth them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A footnote states that the stones' most important use among Malays was medicinal,
    without giving details in this passage.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Stone implements are described as numerous in some western and central Malay
    Peninsula regions and rare in others; the text notes a possible introduction from
    Sumatra based on comparative distribution.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Wray argued that it had been too rashly assumed that Perak cave-dwellers made
    the stone implements, because the implements suggested a higher intelligence than
    the cave remains indicated.
  category: speech
  evidence_refs:
  - ev:7
