canonical_text:
  quote: ''
  summary: The passage describes a Sakai rice-harvest feast following the first three
    days of reaping. The feast functions as hospitality to guests and as a welcome
    for the returning Rice-soul, whose husks and seven rice-heads are preserved. Women
    reap first while men procure meat and fish; on the fourth day guests are escorted
    to the feast-house. Before the meal the magician passes a censer seven times around
    the guests and around key rice-harvest objects, then places boiled rice grains
    on children’s heads so they will remember how to prepare rice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The offering of the feast to guests after three days of reaping is described
    as hospitality by the chief or host, and omitting it is considered mean.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The remains of the feast and the husks are not thrown away; guests may inspect
    the harvest, and the Rice-soul may see the husks on its return.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The Rice-soul is said to return from three days of wandering, to be welcomed
    by the feast, fortified by charms against later demonic trouble, and to reside
    in seven rice-ears until the grain is mixed with the main seed stock.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: During the first three days, women reap the rice while men procure meat and
    fish from forests and streams; afterward both sexes participate in reaping.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the fourth day the rice is cooked for expected guests, and men in their
    best clothes, with bachelors wearing flowers and carrying blowpipes, prepare to
    lead the guests to the feast-house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The most distinguished guest is fetched last and accompanied by the people,
    while unmarried men act as a kind of bodyguard.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before the meal, women and children sit together in one place and men sit
    in another.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The magician sends the censer seven times around the circle of guests; the
    guests pass it from hand to hand, and the magician counts each completed circuit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The magician passes or waves the censer around the reaping-knives, the cloth
    containing the seven rice-heads, the central pillar, the rice-sacks, and the cooking-pots,
    and then deposits it at the foot of the pillar.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The magician places boiled rice grains on the heads of the children so that,
    when older, they will remember how to prepare rice for their own children.
  category: action
  evidence_refs:
  - ev:8
