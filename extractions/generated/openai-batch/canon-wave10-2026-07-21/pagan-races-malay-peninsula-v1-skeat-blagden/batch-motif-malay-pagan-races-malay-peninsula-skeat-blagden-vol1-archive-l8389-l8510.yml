canonical_text:
  quote: ''
  summary: The passage describes dress, hair treatment, ear piercing, ornaments, and
    talismanic necklaces among Mantra groups around Gunong Berembun and Benua-Jakun
    of Johor. It also notes resemblances between particular Mantra, Sakai, Benua,
    Malay, and Javanese forms of dress or ornament.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Many Mantra around Gunong Berembun wear Artocarpus bark; men use the chawat,
    women wrap a rude bark cloth from waist to knees, and they lack footwear and toilet
    articles.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mantra women gather their hair on top of the head, plait it in a crown shape,
    fasten it with pins, and on special occasions add flowers and leaves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mantra female ear perforations are widened with wooden pins or rolls of Licuala
    leaf; pendants are not worn, but many wear ear-studs and silver rings.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Little girls have their ears pierced by their parents; when earrings are absent,
    the holes are filled with rolled banana-leaf strips or a large wooden stud.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Children wear necklaces made of monkey bones, bear or tiger teeth, coins,
    and shells, and the passage says these are worn as a talisman against disease
    rather than merely as ornament.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A close resemblance is reported between a Sakai women's girdle of small grass
    bundles on a waist cord near Gunong Bujang Malaka and a girdle observed among
    Mantra women north of Malacca.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Among the Benua-Jakun of Johor, the original male dress is described as the
    chawat; most men observed had Malay garments, often ragged.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Benua-Jakun women generally wore a short sarong as their only garment, with
    some wearing the Malay jacket; their hair was bound in a knot behind.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage says Benua-Jakun women expressed a desire for pretty sarongs,
    jackets, handkerchiefs, and ornaments, and would wear full Malayan costume if
    they had the means.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Benua-Jakun ornaments are described as plain brass rings and bracelets; pierced
    ears may hold a native cigarette or cloth instead of an earring.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: A cited note says Benua men and women near their own haunts go nearly naked
    with a reddish-brown terap-bark sabaring around the loins, and on visits to Malay
    villages try to appear more decently clothed.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The same cited note says Benua people carry small mat pouches containing items
    such as tobacco, flint and steel, a knife, and a bamboo call or whistle.
  category: object
  evidence_refs:
  - ev:10
