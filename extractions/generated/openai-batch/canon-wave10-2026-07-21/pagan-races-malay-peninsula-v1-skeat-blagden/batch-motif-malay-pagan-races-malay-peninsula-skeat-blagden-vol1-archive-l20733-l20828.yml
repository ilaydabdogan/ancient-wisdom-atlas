canonical_text:
  quote: ''
  summary: The passage critiques Vaughan-Stevens' interpretation of Semang decorative
    patterns. It argues that he misunderstood the Malay word "bunga" as referring
    to a flower rather than to a pattern, and proposes instead that named panels on
    combs may refer to separate flowers or fruits, such as Ixora, rice-grains, and
    salak fruit. The passage also notes that naming patterns after things they represent,
    resemble, or are associated with is common in the Malay Peninsula, while rejecting
    the extension of a single-flower theory to other Semang objects.
  language: English
  quote_policy: summarized
