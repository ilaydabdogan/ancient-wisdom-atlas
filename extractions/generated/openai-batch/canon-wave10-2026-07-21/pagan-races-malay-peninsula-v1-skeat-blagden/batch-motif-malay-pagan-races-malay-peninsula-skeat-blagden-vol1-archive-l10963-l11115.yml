canonical_text:
  quote: ''
  summary: The passage gives an ethnographic description of Sakai and Peninsular Malay
    hunting, trapping, and fishing technology. It explains spring-spear traps, snares,
    bird-lime, fish-dams, rattan hooks, mountain-top residence, periodic river fishing
    during food scarcity, and fishing huts observed on a river bank.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A spring-spear trap is described as using an elastic tapering rod set horizontally,
    a spear-shaft lashed to its thinner end, uprights, a cross-bar, crossed sticks,
    a cord, a rattan ring, a bamboo noose, and a smaller spring.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: When an animal touches the taut cord between the crossed sticks, the rattan
    ring is pulled away, the small spring releases the large spring, and the spear
    is driven toward the animal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Another spring-trap uses a large wooden spring to strike the butt-end of a
    spear so that it flies like an arrow across an animal track.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A third spring-trap is identified as the Malay flying spring-spear, but Hale's
    description is not given because the Sakai were said to profess ignorance of it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that all three forms of spring-spear-trap are known to
    and used by the Peninsular Malays, while the question of whether Malays or aboriginal
    tribes first used them is left open.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sakai snares for animals and birds are said to be made of rattan, commonly
    as a simple rattan noose held taut by a stout wooden spring, and used to catch
    rats, squirrels, and animals as large as porcupines.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bird-lime is made by boiling sap from a gutta-tree to the desired consistency,
    applying it to thin rattan slips, and planting the slips thickly over the ground
    to catch small birds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Kinta Sakai are described as living on mountain-tops and going down to
    large rivers for fish only when vegetable food is nearly exhausted.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: About once in three months the Kinta Sakai are said to travel to a large river
    and obtain fish by means including fish-dams, but they do not dry the fish, so
    a large catch only yields a few days of feasting while it remains good.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: De Morgan says Sakai fishing with rod and line uses a primitive hook made
    from curved-back rattan thorns and a line made from tree-bark fibres.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: De la Croix says the Sakai are skilled at making bow-nets, and reports seeing
    small Sakai fishing huts on the banks while ascending S. Kerbu with Mr. Brooke
    Low.
  category: action
  evidence_refs:
  - ev:6
