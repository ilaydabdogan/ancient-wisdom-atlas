canonical_text:
  quote: ''
  summary: The passage reports ethnographic observations about the diet and habits
    of the Sabimba, the Orang Laut Muka Kuning, and an unspecified Orang Laut group.
    The Sabimba are said to eat rice, various animals, birds except fowl, and wild
    jungle fruits; to depend on Malays for arms and much food; and to lack brewing
    of intoxicating liquors though they reportedly formerly possessed it. The Orang
    Laut Muka Kuning are described as eating the same forest foods as the Sabimba
    and also forbidding fowl. Another Orang Laut group is described as traveling by
    sea to Pulau Tinggi for a plentiful crop of durians.
