canonical_text:
  quote: ''
  summary: The passage opens with a bibliographic note on leather or parchment documents
    and bindings, then describes bark-cloth and related attire among the Semang and
    Sakai. Kedah Semang make Upas-bark cloth by felling young saplings, loosening
    and stripping the bark, washing out poisonous sap, and drying it. A black girdle
    called tentom is woven from fungus rhizomorphs called urat batu. Perak Negrito/Semang
    bark garments are described as Artocarpus bark, sometimes yellow-painted with
    broken-line patterns, and further accounts describe bark made supple by pounding
    or beating. Wray’s account adds that Perak Semang and Sakai used Antiaris bark,
    soaked it in running water for a month to remove poison, and beat it with grooved
    wooden bats to produce grain.
  language: English
  quote_policy: summarized
