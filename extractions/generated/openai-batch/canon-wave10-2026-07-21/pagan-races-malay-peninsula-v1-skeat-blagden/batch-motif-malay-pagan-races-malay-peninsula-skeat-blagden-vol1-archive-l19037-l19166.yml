canonical_text:
  quote: ''
  summary: 'The passage describes Besisi/Jakun rice cultivation rites: planting and
    harvesting charms, seasonal feasts at the Batin''s house, a ceremony returning
    the Rice-soul to the house and suspending it from the roof ridge-pole, a harvest
    feast at Ayer Itam, a pre-feast invocation inviting animals, insects, and blight
    that harm rice to partake before humans eat, an outside rice deposit on an old
    tree-stump, and later communal choral and mimetic dances.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An opening cultivation charm instructs people to plant rice, yams, cane, and
    bananas, to shade the planters, and to reap ripe rice quickly so that it does
    not rot.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sowing and reaping operations are described as always accompanied by the reciting
    of charms.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Periodical feasts are described as being held in the Batin's house when the
    rice first blooms and at the beginning, middle, and end of the harvest.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Besisi have a ceremony for bringing the Rice-soul back to the house; after
    arrival it is suspended from the roof ridge-pole rather than placed in a rice-bin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The witnessed festival took place at the Besisi settlement at Ayer Itam, at
    the decorated house of the Batin, which had an attached balei.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Women of the village cooked the rice; before the feast, a minor chief sat
    at the head of two rows of banana-leaf dishes heaped with rice and recited a charm.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The charm invites the rice crop's enemies, including Round-foot, rats, blight,
    finches, stink-bugs, caterpillars, green-fly, deer, and pig, to partake of the
    year's Eldest-born before the people eat.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Round-foot is explained as a euphemism for the elephant.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the invocation, a small portion of rice was carried out of the house
    and placed on an old tree-stump near the house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the banana leaves were unfolded, the feast began; the Batin or tribal
    chief fed last.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: At night, an orchestra, choral singing, dancing, named airs, and mimetic song-dances
    were performed; some actors repeated words after the Batin and matched gestures
    to the words.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
