canonical_text:
  quote: ''
  summary: An ethnographic passage records observations on the sight, hearing, hands,
    and feet of Semang people, with brief comparisons to E. Semang, W. Semang, Jakun,
    Sakai, and Tembeh groups. It describes eye and ear appearance, apparent acuity
    of sight and hearing, hand position and finger movement, injuries, and an inward
    curve of the hallux. No mythological narrative or symbolic episode is present.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The examined Semang eyes are described as round, wide-open, horizontal, and
    usually deep brown; one old man had greyish-brown eyes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The authors describe the Semang as not unpleasant-looking and note a wild
    look around the eyes, which they connect to eye spacing, depression of the upper
    nose, and restless eyes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Semang eyesight appeared good to the observers, and the few tested cases
    showed normal colour-vision.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The observed Semang ears are described as distinctly small, and hearing appeared
    ordinarily acute; one youngish man showed slight deafness.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage compares hearing among groups, stating that E. Semang hearing
    is not as acute as Jakun hearing but is sharper than among W. Semang, Sakai, or
    Tembeh; it also says exceptional sharpness of hearing occurred more often among
    W. Semang than among the other listed tribes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says wild nomadic tribes frequently meet with accidents; among
    the few measured men, one had a deformed finger and another had lost the little
    toe of his left foot.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The hands of both sexes are described as constantly occupied and seldom at
    rest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The observer reports that Negrito palms were held sideways, while Sakai and
    Jakun palms were directed backwards.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: After explanation, both Semang and Sakai people could close the fist and stretch
    out one finger without unclosing the others.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: In measuring the span between thumb and little or middle finger, the observer
    was struck by an inability to open the fingers freely.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The most noticeable point about the Semang feet is described as a remarkable
    inward curve of the hallux.
  category: attribute
  evidence_refs:
  - ev:5
