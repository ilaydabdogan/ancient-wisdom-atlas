canonical_text:
  quote: ''
  summary: The passage explains how names such as Sakai, Semang, Jakun, and Benua
    are used for groups in the Malay Peninsula, notes Malay external naming and some
    group self-designations, lists several fabulous tribes to be treated under religion,
    and criticizes older speculative racial-origin theories.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The word "Sakai" is described as used in Malay, like "Semang," in the sense
    of a retainer or follower of a native chief, analogous to Rayat or subject.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mantra and Besisi are said to prefer self-designations translated as Hill
    Men, Men of the Interior, Men of the Sea, or simply Jakun.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The term "Sakai" is described as a generic term for all the wild men of the
    peninsula and as occurring in combinations such as Sakai Liar, Sakai Jinak, Sakai
    Bukit, Sakai Rawang, Sakai Laut, Sakai Ulu, Sakai Dalam, and Sakai Bla; "Semang"
    is said to be used similarly at times.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that the work will use "Semang" mainly for Negrito tribes,
    "Sakai" for the second ethnical group, and "Jakun" for the southern third ethnical
    group, with "Benua" noted as an older European term.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The passage names fabulous tribes: Orang Ekor or Tailed People, Orang Gergasi
    or Giants, Orang Mawas or Orangoutang People, and Orang Peri or Fairies, and says
    they will be treated in the chapter on Religion.'
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vaughan-Stevens is reported as asserting that "Udei" or "Udai" is used by
    the Orang Pangan as a contemptuous term for tribes near Belum in Perak and by
    northern Malays for the more settled Semang, though the author rejects his explanation
    of the word.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Older writers are described as holding a Pan-Negrito theory that all wild
    tribes were of Negrito origin, explaining difficulties through proposed intermixture
    with Malays and other races and through a "wrecked slave-dhow" theory.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: Ridley is cited as reporting that Vaughan-Stevens once regarded the Semang
    as descendants of escaped negro slaves brought over by Alexander the Great.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Some authorities are said to have attempted to identify the Semang with the
    African negro, an identification the passage rejects because of marked diversity
    of type.
  category: other
  evidence_refs:
  - ev:8
