canonical_text:
  quote: ''
  summary: The passage records Sakai magic combs and then describes ornamental patterns
    on blowpipes, flutes, and quivers among several Malay Peninsula groups. It notes
    Mantra plant-derived pattern names, Besisi zoomorphic designs, the practice of
    representing only part of an animal figure, and limited comparative evidence for
    Jakun, Blandas, Besisi, Sakai, and Mantra art patterns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Magic combs are reported among the Sakai, are little known, and usually have
    more teeth than Semang combs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mantra pattern called krakap chamai is described as an ornamental blowpipe
    design that imitates wild sirih or betel-vine growth.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The pattern called okeh le-it hubi or ukir lilit ubi is compared to intersecting
    branches of a tuber plant.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A caption identifies a centipede on a Besisi flute and a lizard on the shaft
    of a Besisi blowpipe.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that available material is insufficient to reach a conclusion
    about Jakun artistic work.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: Blandas and Besisi patterns are said to show no appreciable departure from
    Sakai patterns.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The practice of drawing part of a figure instead of the whole is reported
    for the Sakai and is said to have been well understood and used by the Besisi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The commonest Besisi zoomorphs are listed as lizards, centipedes, and the
    lotong or long-tailed spectacle monkey.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Besisi drawings of these zoomorphs are reported on blowpipes and quivers.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: For the lotong, the bones or sometimes extremities such as fingers and toes
    are usually represented, and tribe members recognize them as the symbol of the
    Semnopithecus.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Besisi lotong pattern is said to resemble a Mantra pattern, but the Mantra
    name for that pattern is krakap chamai, or wild betel-vine shoots.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: A second Mantra pattern is named le'it hubi, or entwined tuber-shoots, and
    the passage notes that only limited comparative material is available.
  category: other
  evidence_refs:
  - ev:11
