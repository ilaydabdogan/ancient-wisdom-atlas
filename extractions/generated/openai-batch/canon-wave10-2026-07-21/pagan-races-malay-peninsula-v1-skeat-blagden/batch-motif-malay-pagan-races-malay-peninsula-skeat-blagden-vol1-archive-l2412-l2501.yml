canonical_text:
  quote: ''
  summary: The passage discusses perceived racial and cultural mixture in the Malay
    Peninsula. It contrasts Menangkabau agricultural immigrants with other Peninsular
    Malays, describes amalgamation with the Jakun of Rembau, and argues that many
    so-called Malay populations descended from aboriginal tribesmen through intermarriage,
    conversion, and cultural assimilation. It also says aboriginal absorption was
    ongoing, Malay admixture had often been exaggerated, and much admixture occurred
    among aboriginal groups themselves.
  language: English
  quote_policy: summarized
