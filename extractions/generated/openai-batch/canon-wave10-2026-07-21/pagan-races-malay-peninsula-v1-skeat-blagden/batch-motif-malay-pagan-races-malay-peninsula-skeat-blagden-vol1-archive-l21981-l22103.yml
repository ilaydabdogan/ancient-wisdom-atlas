canonical_text:
  quote: ''
  summary: The passage describes Semang explanations for magic comb patterns used
    as protection against Diseases brought by winds as Kari's punishment. Pie pacifies
    Kari, gives a talismanic comb protection, and is credited with inventing the comb
    patterns. Women wear varied combs for mutual protection, store them in shelters,
    and are buried with them so the soul remains protected. Men instead have talismans
    incised on quivers and charm-holders; ancient women are said to have carried charm-tubes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: According to the passage's report of Semang ideas, winds bring Diseases as
    punishment for sins that Kari, the thunder-god, wants to avenge.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Wind-demon is sent from Kari, passes over a person's head, and deposits
    Disease on the forehead, from which it spreads over the body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Pie pacifies Kari and turns aside Kari's punishments by giving the Semang
    a talisman that the winds dare not approach.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a protected woman wears the correct magic comb, the Wind encounters the
    scent of the comb's first or uppermost panel, called the was, and falls to the
    ground until she has passed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: If several women are together, a woman wearing the relevant protective first-panel
    pattern can protect another nearby woman who is not wearing that pattern.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women walking together wear different combs for mutual protection from different
    Diseases.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Every Disease is said to have a special wind as its messenger, which is given
    as the reason for varying first-panel patterns.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Semang woman is said usually to possess twenty to thirty magic combs, and
    women lend combs to one another or omit wearing them depending on the circumstances.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: In huts or shelters, combs are taken out of the hair and inserted between
    roof slats.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At night the combs are not worn.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When a woman is buried, all her combs are buried with her so that Diseases
    warded off during life may not hurt her soul when dead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Semang explanation reported in the passage is that Pie invented the magic
    comb patterns and that the patterns were not borrowed from another people.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage reports that in olden times the magic comb had only three teeth.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Comb teeth are explained as the means for fastening the combs into the hair.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: Men are said not to wear combs because their hair is too short; their talismans
    are incised on quivers and charm-holders.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: It is alleged that in very ancient times women carried a special charm-tube
