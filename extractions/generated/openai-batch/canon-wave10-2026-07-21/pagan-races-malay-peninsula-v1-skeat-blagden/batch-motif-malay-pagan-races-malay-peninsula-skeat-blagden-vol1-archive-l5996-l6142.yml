canonical_text:
  quote: ''
  summary: The passage describes Semang fire-making equipment and hearth maintenance,
    Kedah and Perak Semang preparation of poisonous yams and other roots, gendered
    order at meals among Kedah Semang, and sparse betel-chewing among Semang groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Semang fire-making method uses a rattan line worked rapidly around part
    of a dried branch until friction ignites fallen wood dust.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Semang may carry fragments of flint and tool-iron, use palm-base fluff as
    tinder, and carry fire apparatus on the person, often in a small bamboo cylinder.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Perak Semang are said to carry fire apparatus in a bamboo tube that may be
    decorated with incised lines and to obtain tinder from the sugar-palm.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Semang hearth consists of short logs or sticks with ends converging toward
    a common centre, placed on clear ground and kept smouldering until the encampment
    moves.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kedah Semang prepare poisonous yams by rasping them, mixing the raspings with
    slaked lime, kneading them into dough, wrapping them in fresh banana leaf, placing
    them in a cleft stick, and roasting them slowly over fire.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that these treated yams are called "kleb" by the Semang
    and "ubi kapor" by Malays, and that Semang informants described them as highly
    poisonous unless treated as described.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Siong in Kedah, yams were observed inserted between roof slats, and other
    yams were described as baked or boiled; tapioca-root was thought to have been
    obtained by barter from Malays.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Perak Semang are described as rendering wild yam roots edible through prolonged
    fermentation and six days of culinary treatment, while amorphophallus is described
    as inedible and poisonous, especially when mixed with Ipoh.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Among Kedah Semang, women and girls cooked the food and were not allowed to
    eat until the men and boys had finished.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: In one observed meal, rice and small fowls brought by the observer were placed
    in separate heaps on large banana leaves and eaten first by all the males sitting
    together.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Betel-chewing is described as occurring only sparingly among the Semang groups
    encountered and as rarer than among more southern tribes.
  category: attribute
  evidence_refs:
  - ev:9
