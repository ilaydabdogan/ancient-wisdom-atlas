literal_observations:
- id: obs:1
  text: A murderer could avoid the death penalty by paying blood-money or a fine;
    if unable to pay, the culprit could be flogged with rattan or bound to a tree
    until payment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who cheated a fellow tribesman could be fined if he had money; otherwise
    all tribal members would give him a severe scolding.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: One account states that the Semang formerly had many, or thirty, Puttos, described
    as Big Chiefs, religious teachers, and rulers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Puttos were said to meet once every eight months, with each Putto assigned
    a district.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Semang of each district chose a Sna-hut, who decided local questions and
    received directions from the Putto of the district.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Putto gave instructions in the name of Pie, and the Puttos were described
    as dreaded messengers of the deity.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: When a Putto died, Pie was said to elect a successor from among the Semang.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Puttos were said to be a separate unmarried class who lived at Pie's abode
    on the Jelmol mountain in northern Perak.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Only the Sna-huts were said still to possess charms against misfortune and
    disease and other knowledge communicated by the Puttos.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: A reported chain of recourse runs from tribesman to Sna-hut, from Sna-hut
    to Putto, from Putto to Pie, and from Pie to Kari.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Pie and Kari are identified in the passage as the two chief deities of the
    Semang.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: De Morgan's account says each Semang village has a Penghulu with full powers,
    no superior Raja or higher assembly, and exceptional assemblies only for inter-village
    disputes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The same account states that individuals are equal, caste is unknown, the
    chief is equal to his men except during official duties, and property is held
    in common.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: The Sakai are described as having one Penghulu per village, succeeded by his
    eldest son or by someone appointed during his lifetime if there is no son.
  category: sequence
  evidence_refs:
  - ev:6
