canonical_text:
  quote: ''
  summary: The passage describes Perak Semang arrow-poison preparation, comparing
    it to blowpipe-dart poison. Poison is applied to arrowheads in repeated coatings
    and dried over fire. The passage discusses poison effects, bow range, and reported
    use of poisoned arrows against animals including monkeys, birds, elephants, rhinoceroses,
    and tigers, with a note that Vaughan-Stevens limits their use to tigers while
    De Morgan and the author do not.
