canonical_text:
  quote: ''
  summary: The passage describes gendered divisions of labour among several Aboriginal
    Malayan groups, including hunting, agriculture, house-building, cooking, child
    care, fishing, and craft production. It then describes bark-cloth manufacture,
    its materials, tools, decoration, and comparison with Polynesian tapa cloth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states a general rule that men perform work requiring brute force,
    while women perform the remaining work.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among wild Semang groups, men hunt, while women build shelters and cook.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Among groups described as having reached agriculture, men do felling and heavy
    clearing, while women do lighter clearing, lopping, sowing, reaping, and sometimes
    surface tilling with a pointed stick.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The cited description of Benua-Jakun women says they control the plantation,
    carry water and baskets, gather food, cook, nurse children, weave mats and bags,
    and sometimes angle for fish.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In house or hut building, men perform heavy timber work and women complete
    the structure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men are described as makers and decorators of their own weapons and implements,
    including blowpipes, bows, quivers, arrows, axe-handles, knife-handles, and spear-shafts.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women are described as making bags, baskets, mats, wallets, pouches, bark-cloth,
    and basket-work.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Women take a large share in fishing and in collecting roots and fruits, while
    women and girls perform cooking and child care.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A catechism addressed to the bridegroom at a Besisi wedding is said to list
    the duties of a would-be husband.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Bark-cloth is described as ordinary workaday wear of the wilder branches of
    the tribes, made from material compared with Polynesian tapa cloth.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Bark stripped from a tree is beaten out with a wooden mallet that may be round
    or toothed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A described bark-cloth mallet specimen is grooved or toothed transversely,
    while other mallets have a flat under-surface divided into small squares.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The finished cloth is often decorated with designs said to resemble main designs
    sometimes seen on tapa cloth.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Bark for cloth is generally taken from a wild bread-fruit tree called terap
    or t'rap, but bark from other trees, including the Upas tree and a ficus, is also
    reported.
  category: object
  evidence_refs:
  - ev:9
- id: obs:15
  text: When Upas bark is used, its poisonous sap is washed out with water.
  category: sequence
  evidence_refs:
  - ev:9
