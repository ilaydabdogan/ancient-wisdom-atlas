canonical_text:
  quote: ''
  summary: The passage describes Sakai blowpipes, darts, quivers, waist attachments,
    shooting range and accuracy, a cautioned report of a rifled blowpipe, and the
    preparation of a powerful blowpipe poison from Ipoh sap and root sap dried over
    a slow fire. It repeatedly compares Sakai implements with Semang implements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The blowpipe tube is doubled to keep it straight, prevent warping, and protect
    the otherwise frail weapon.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sakai blowpipe is described as more highly decorated than the Semang blowpipe,
    with incised rectilinear designs and a wooden mouthpiece.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sakai darts are made from the hard leaf-rib of bertam, use bertam wood butt-ends,
    are 8-11 inches long, and are more delicately finished than Semang darts.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A palm-down wad is inserted behind the darts to prevent windage; the passage
    describes preparation of the down by scraping, drying, and rolling plant material.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Sakai quivers are made from decorated bamboo internodes and contain small
    tubes or reeds for darts plus requisites for making and poisoning new darts.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The quiver is attached to the waist cord by a woven cane ring, and its lid
    has an internal bent cane ring for holding wadding.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The girdle is made from finely plaited Artocarpus cuticle and fastened with
    a bone buckle.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The described maximum range of a blowpipe dart is about 80 metres, while the
    usual used range is 30-35 paces or 23-27 metres.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: A Sakai was reported to hit a dollar on the trunk of a fallen tree at about
    30 paces with his first shot.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A report that a blowpipe was rifled is presented as unsupported and requiring
    caution.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: For a powerful poison, the Sakai mix Ipoh sap and sap from a small root in
    a bamboo tube, then dry the mixture gently over a slow fire while adding moisture
    at intervals.
  category: sequence
  evidence_refs:
  - ev:9
