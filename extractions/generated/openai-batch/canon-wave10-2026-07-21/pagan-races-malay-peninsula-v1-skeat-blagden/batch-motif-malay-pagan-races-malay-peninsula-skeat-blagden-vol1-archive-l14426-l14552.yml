canonical_text:
  quote: ''
  summary: The passage describes a decorated Semang quiver and its arrows, including
    construction details, geometric patterns, hurriedly made arrows, tiger-arrows
    equipped with rhinoceros-bird feathers as charms, reports about the feathering’s
    non-aerodynamic use, a lost Putto charm over feathers, and carrying/use details
    for quivers in jungle travel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The second quiver is described as decorated with concentric rings, two rows
    of converging triangles called the bamboo-shoot pattern, and a concentric curved
    pattern called the hawk's-eye pattern.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The second quiver contained no loose feathers but held four arrows with measured
    lengths and feathering; the arrows chiefly differed from those in the first quiver
    in the treatment of the head.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two arrows had iron points spliced into short wooden socket-pieces inserted
    into bamboo shafts, with junctions bound by split rattan coated with resin.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The two better-made arrows were single-barbed and decorated with incised rings
    between the ends of the feathered shaft portion.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The remaining two arrows were roughly made, undecorated, lacked wooden socket-pieces,
    and had iron spikes inserted directly into the hollow end of the shaft; the author
    judges them likely hurried emergency products.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Vaughan-Stevens reports that rhinoceros-bird feathers are used as a charm
    to make an arrow fatal against a tiger, and that only tiger-arrows are equipped
    in this way.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: Vaughan-Stevens says the feathering is not used to make the arrow fly straight
    as in Europe, and reports that feather orientation could vary on the shaft.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: The feathers are described as having five types of varying value; some are
    cut down for use, and one type is split with a parang.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Putto is said to have pronounced a charm over the feathers in ancient
    times, but the charm is now unknown because the Puttos are long dead.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The illustrations are said to show a Semang travel quiver, a quiver with magic
    rings, an obsolete bamboo-headed tiger-arrow, and other arrow types.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: A decorated bamboo quiver holds only three or four arrows, has a pointed end
    for planting in the ground, and may be carried by hand or through the back of
    the belt.
  category: object
  evidence_refs:
  - ev:11
