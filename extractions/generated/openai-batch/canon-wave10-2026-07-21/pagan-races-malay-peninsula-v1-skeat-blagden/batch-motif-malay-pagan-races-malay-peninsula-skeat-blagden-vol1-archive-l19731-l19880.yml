  summary: The passage describes basket-work, weaving, pottery, and other arts and
    crafts among Peninsular aboriginal groups, with special attention to women’s basketry,
    plant materials, the absence or scarcity of certain crafts, and a note on Kedah
    Semang hunting crafts. It also records traditions among these tribes of lost sacred
    books and compares this belief with an Indo-Chinese and Tavoy Karen tradition
    involving books given by a sacred personage.
