canonical_text:
  quote: ''
  summary: The passage describes habitation forms recorded among groups of the Malay
    Peninsula and nearby Singapore/Johor, including long or communal shelters, raised
    huts on posts, tree-huts, boat dwellings of the Orang Laut, and rock-shelters
    used by Semang and Pangan groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A long or communal shelter is described as a round or beehive hut extended
    into an ellipse or oval.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Small granaries or store huts on high posts and huts with floors raised on
    posts are listed among dwelling forms.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Observers saw beings leave nests, walk erect, gather berries or similar food,
    climb palms, and behave in a human-like way; the account later identifies the
    supposed apes as men.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tree-huts are described as standing 30 to 50 feet above the ground in lower
    branches of large spreading trees, reached by notches cut in the trunk.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The tree-huts are described as beehive-shaped, made of branches and twigs
    tied at the top and bent around a hollow interior, with a small side entrance
    and creeper cordage.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Several settlements are reported with huts in trees, including a settlement
    of fifteen huts with one or two in a tree, another with five tree huts and seven
    ground hovels, and another with four tree-huts.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old Orang Laut of Singapore and Johor are described as dwelling exclusively
    in boats.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: An Orang Laut boat is described as having a hearth at one end, utensils in
    the centre, and a sleeping area under a matwork awning at the other end.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: A family of five or six, together with a cat and a dog, is described as sheltering
    under the awning from birth to grave.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Kedah Semang are described as nomadic, without fixed habitations, seldom
    staying more than three days in one place, and commonly using rock-shelters.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A small rock-shelter at Ban Tun is said to have been inhabited by nine Pangans
    until they deserted it after hearing the visitors approach.
  category: sequence
  evidence_refs:
  - ev:7
