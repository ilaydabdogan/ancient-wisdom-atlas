canonical_text:
  quote: ''
  summary: The chapter segment evaluates claims that aboriginal groups of the Malay
    Peninsula manufactured or used stone implements. It presents reports and traditions
    about stone tools before iron, including Bradley's finds, De Morgan and Hale's
    cited traditions, and Vaughan-Stevens' account of Pangan statements, wooden models,
    and recognition of stone tools. The passage repeatedly cautions that the evidence
    is vague or inconclusive, noting Malay-type shapes in the models, uncertain procedures,
    linguistic ambiguity, and Wray's statement that stone spear-heads, choppers, or
    arrow-heads had not been found in the Peninsula.
  language: English
  quote_policy: summarized
