canonical_text:
  quote: ''
  summary: The passage reports an alleged explanation of Sakai charm-pattern origins
    involving Tuhan's finger-prints and a blackened fingertip making a triangular
    mark on bamboo. It then discusses triangle/V-pattern derivation, notes affinities
    and possible borrowings among Jakun, Besisi, Semang, and Sakai decorative art,
    and gives owner-supplied interpretations of designs on a Semang quiver, including
    plant blossoms, fruits, tortoise forms, deer tracks, and hawks' eyes. The author
    interprets some designs as attracting tortoises or deer by representing animals'
    feeding grounds or signs.
  language: English
  quote_policy: summarized
