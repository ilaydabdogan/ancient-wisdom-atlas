    by Miklucho-Maclay.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Virchow describes a broad zone of wavy-haired people positioned between spiral-haired
    Melanesians and straight-haired Malays in the islands, and analogously places
    the wavy-haired Sakai/Blandas between northern Semang and southern/coastal Jakuns
    and Malays in Malacca.
  category: relationship
  evidence_refs:
  - ev:3
