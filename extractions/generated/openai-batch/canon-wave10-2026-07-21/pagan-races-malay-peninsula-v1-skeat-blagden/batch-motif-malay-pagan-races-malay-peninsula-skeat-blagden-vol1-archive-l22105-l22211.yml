canonical_text:
  quote: ''
  summary: The passage describes Semang women's magic bamboo combs, their protective
    use against diseases said to affect women, their relation to men's quiver and
    blowpipe patterns, their burial with women at death, and the detailed manufacture
    of the combs with incised charm patterns, ring-lines, charcoal, water, heat, and
    wax.
  language: English
