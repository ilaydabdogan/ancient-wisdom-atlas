canonical_text:
  quote: ''
  summary: The passage describes copied and original incised bamboo designs attributed
    to Sakai use. It explains panels showing a Sakai house, rice-field, rice-processing
    tools, animals, and charms. One full design is identified as a rain-charm involving
    tortoise and frog imagery and the expulsion of rice pests. Another tuang-tuang
    design is used to deter ants from boar-flesh through the sound and vibration of
    a struck bamboo. A further tuang-tuang is described as protection against two
    skin diseases and includes frog-hole, frog-leg, ant-heap, disease, and victim
    imagery. Captions also identify a hut-building charm and a charm for driving away
    demons.
  language: English
  quote_policy: summarized
