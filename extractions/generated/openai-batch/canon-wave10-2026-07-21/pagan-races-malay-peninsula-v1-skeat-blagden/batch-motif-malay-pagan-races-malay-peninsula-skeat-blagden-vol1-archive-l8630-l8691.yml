canonical_text:
  quote: ''
  summary: 'The passage describes Orang Laut dress and hair practices: women and girls
    use glittering or natural ornaments, including seeds, bivalves, crab-leg segments,
    and shells; crawfish claws and fish jaws serve as grooming tools; shell hair ornaments
    are contrasted with Jakun flower ornaments; boys use shells until manhood except
    for special reasons.'
  language: English
  quote_policy: summarized
