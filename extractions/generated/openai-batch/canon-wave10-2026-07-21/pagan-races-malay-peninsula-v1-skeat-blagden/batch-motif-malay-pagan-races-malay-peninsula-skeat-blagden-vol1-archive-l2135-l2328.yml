canonical_text:
  quote: ''
  summary: The passage discusses difficulties in counting aboriginal populations because
    of their mobility and avoidance of Europeans, cites a census and numerical estimates,
    then considers and rejects Vaughan-Stevens's theory of Sakai/Senoi/Blandas Negrito
    origin with heavy Malay admixture. It describes cultural and religious barriers
    between Mohammedan Malays and jungle tribes, patterns of intermarriage and child
    affiliation, social penalties for Malay women marrying tribal men, and an exception
    in Negri Sembilan/Johol where Menangkabau Malays amalgamated with local aboriginal
    groups while Jakun chiefs retained authority for a time.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the same aboriginal families or individuals may move from
    one place to another and later return, causing observers to count the same people
    more than once.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage presents the 1901 census report of the Federated Malay States
    as the main available guide to aboriginal numbers, while noting errors and likely
    undercounting.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author estimates a probable minimum of 25,000 aborigines for the Federated
    Malay States and suggests surrounding regions would raise the total to about 35,000
    or 40,000.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: Vaughan-Stevens is reported as claiming that the Sakai, called by him Senoi
    or Blandas, are a Negrito tribe with large admixture of Malay blood.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author rejects the Pan-Negrito theory on anthropological grounds, arguing
    that certain combinations of skull types could not produce a mainly dolichocephalic
    mixed tribe.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage identifies a strong cultural and religious barrier between Mohammedan
    Malays and non-Muslim jungle tribes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: When a Malay man mates with a woman from the jungle tribes, the passage says
    the children usually follow the father’s religion and are merged into his race.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: An exception is described in which Malay traders live with Sakai women in
    Sakai country, desert them and their children, and the children remain with the
    tribe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Unions between Malay women and heathen tribesmen are described as known but
    very rare, formerly punishable by death and still subject to severe social ostracism.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says the most appreciable admixture of blood is between one wild
    tribe and another.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: An important exception is described in parts of Negri Sembilan, especially
    Johol, where Sumatran Malays of mainly Menangkabau origin amalgamated with local
    aboriginal groups on nominally honourable and equal terms.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the mixed government described for Negri Sembilan/Johol, Jakun Batins or
    chiefs retained a share of authority for a time.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: A footnote says these tribes have a tendency to hide in the forest when a
    European approaches.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: A footnote reports that among the jungle tribes the tribal name seems to follow
    the male line and sons-in-law join the father-in-law's settlement.
  category: relationship
  evidence_refs:
  - ev:9
