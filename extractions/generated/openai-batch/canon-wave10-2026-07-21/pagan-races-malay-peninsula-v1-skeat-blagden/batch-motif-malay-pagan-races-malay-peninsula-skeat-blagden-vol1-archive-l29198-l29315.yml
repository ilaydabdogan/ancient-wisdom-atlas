  quote: ''
  summary: The passage describes hostile and coercive relations involving Menangkabau
    Malays, Mantra, Benua, and other Malays; a footnoted old Malay statement about
    Benua customs centered on mountains, caverns, forest, trees, water, blowpipes,
    and forest food; and a description of the Jakun of Johor as hospitable, generous,
    and usually non-quarrelsome.
  language: English
  quote_policy: summarized
