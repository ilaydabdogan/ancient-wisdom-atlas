  text: Menangkabau Malays are recorded as formerly attacking the Mantra and killing
    some of their Batins.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many Mantra families left the neighborhood and formed small colonies elsewhere
    after the attacks; the Mantra attributed failed resistance to the attackers' muskets
    and antidotes to ipoh poison.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Every outlet from the country of the Benua is described as occupied and guarded
    by Malays, who prevent strangers' free access and keep the Benua in the interior.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Benua are described as timid and unwarlike but resistant to compulsion
