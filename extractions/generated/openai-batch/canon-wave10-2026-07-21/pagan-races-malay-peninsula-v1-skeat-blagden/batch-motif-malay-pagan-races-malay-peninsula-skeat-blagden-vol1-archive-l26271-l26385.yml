canonical_text:
  quote: ''
  summary: The passage compares social organization, chieftainship, law, subsistence
    movement, and chiefly titles among Semang, Sakai, Jakun, and Orang Laut groups.
    It notes ranked offices among southern Jakun, simpler Semang and Sakai organization,
    Sakai custom-based law and mobile cultivation, Semang and Jakun chiefly regalia,
    uncertain reports of Semang superior chiefs called Puttos, and a Kedah Semang
    Big Chief reputed to be magically invulnerable.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage contrasts the social organization of Semang, Sakai, and southern
    Jakun, stating that Semang and Sakai have simpler organization while southern
    Jakun have a Batin and subordinate chiefs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vaughan-Stevens is reported as having named Semang superior chiefs as Putto/Puttow/Puttau
    and inferior chiefs as Sna-hut, but the passage says those titles had not been
    recorded by other observers.
  category: speech
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:3
  text: The passage says the titles Batin, Jinang, and Jukrah are rare north of Selangor
    except perhaps among Orang Laut communities, and that the chief/subchief system
    is most fully developed among Orang Laut or Sea Jakun.
  category: relationship
  evidence_refs:
  - ev:2
