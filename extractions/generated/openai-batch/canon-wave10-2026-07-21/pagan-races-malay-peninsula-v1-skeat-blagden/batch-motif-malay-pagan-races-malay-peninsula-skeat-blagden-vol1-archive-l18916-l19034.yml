canonical_text:
  quote: ''
  summary: The passage describes a charm in which a magician returning from the rice-field
    announces his arrival and household members welcome the Rice-child. It notes that
    the aborigines attribute a soul to maize, banana trees, and rice. It then describes
    Besisi horticulture, fruit-tree claims and disputes with Malays, a fruit-gathering
    implement, occasional fruit-tree magic, and the opening of a rice-planters' song
    about felling clearings and burning dried timber.
  language: English
  quote_policy: summarized
