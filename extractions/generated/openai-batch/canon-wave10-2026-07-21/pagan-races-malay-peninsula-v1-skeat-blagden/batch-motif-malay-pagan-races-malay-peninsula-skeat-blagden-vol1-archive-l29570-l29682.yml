canonical_text:
  quote: ''
  summary: The passage reports Malay beliefs that the Jakun possess supernatural powers,
    including knowledge of nature, divination, sorcery, effective blessings and curses,
    plant-based healing, and power over wild beasts. It also contrasts Jakun hospitality
    toward European travelers with Malay host behavior, and briefly reports descriptions
    and accusations concerning the Udai and Orang Sletar.
  language: English
  quote_policy: summarized
