  quote: ''
  summary: The passage describes a small concealed cave shelter under an overhanging
    rock, traces of its recent occupation, a Semang custom of breaking camp by the
    fifth day attributed to Pie, and several forms of tree shelters or raised huts
    used by Semang and Pangan groups, especially for protection from wild animals.
    It also notes comparisons to platforms or tree-building practices elsewhere.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A small cave or overhanging-rock shelter is described as located under a very
    steep and lofty hill, difficult to reach, and further concealed by thorny bamboo.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shelter contained a rough bamboo sleeping-stage, with other occupants
    apparently using fresh heaped leaves as beds.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The site had ashes of four separate fires, one apparently extinguished by
    water, along with tortoise-rib fragments and a half-smoked native cigarette.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A note says that among the East Semang or Pangan, an encampment is customarily
    broken up by the fifth day at the latest; the custom is attributed to Pie, and
    serious infringement is believed to bring a severe plague on the guilty parties.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tree shelters are described as developing from branch shelters and weather-screens
    into tree-built huts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author states that the most reasonable explanation for arboreal dwellings
    is protection from wild beasts, especially where elephants, tigers, and other
    wild animals are abundant.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Perak Semang house in the Piah valley is described as a large raised structure
    on posts with its floor about 15 feet above the ground, three ladders, and evidence
    below of wild pig, deer, and seladang remains.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Pangan tree-huts observed on the Ulu Tahan river are described as small roofed
    platforms raised about 15 or 20 feet from the ground and reached by a ladder made
    of sticks lashed across two neighboring trees.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: A note says that similar peculiar platforms or bedsteads are also found in
    the Andamans and, according to another informant, in Fiji.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: A comparative note says that some hill inhabitants in Pegu build at ground
    level when safe from inundations but build between tree branches when protection
    from tigers is necessary; the author adds that inundation is rarely applicable
    as an explanation in the Malay Peninsula.
  category: relationship
  evidence_refs:
  - ev:5
