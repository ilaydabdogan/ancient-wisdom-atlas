canonical_text:
  quote: ''
  summary: 'The passage describes Sakai material culture and craft practices: bark-cloth
    pounding, grooved mallets, women’s sugar-palm fibre belts and hip-bunches, rattan
    baskets and back-baskets, fibre casting-nets, mat-work, bamboo and shell substitutes
    for pottery, and differing reports about boat- or raft-building among Perak Sakai
    groups.'
  language: English
  quote_policy: summarized
