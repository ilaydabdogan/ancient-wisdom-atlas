  summary: The passage describes Benua-Jakun food preparation, domestic utensils,
    fire-making, household eating, and use of betel and tobacco. It includes an anecdote
    about two guides making a light with sticks in a hut, descriptions of fireplaces,
    containers, graters, condiments, root preparation, communal household meals, child
    feeding, and tobacco use by both sexes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two guides left the path during heavy rain to visit a deserted gutta-collector's
    hut, where they were later found resting and smoking native cigarettes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The guides procured a light by rapidly revolving the end of a dry stick in
    a small depression made in another stick.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Benua households usually had two fireplaces furnished with ordinary pots and
    pans, and with small supplies of coarse Chinese plates and saucers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Water was carried and stored in the shell of a cultivated large melon, and
    bamboo was sometimes converted to the same use.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: An onak stem with thorn tips broken off was used as a grater; hard wooden
    platters and a half coconut-shell were used to bruise chillies and other condiments.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Condiments such as onions and turmeric were supplied by Malays.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Roots of a cultivated plant were roasted in embers between meals or when someone
    was hungry, and for regular meals they were grated or boiled with hog's grease
    or vegetable oil.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The whole household ate together, while the wife sat near the fireplace with
    smoking pots and pans within reach and replenished plates.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Children were described as being overfed, including with potatoes boiled in
    hog's grease from the third or fourth day of life.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Benua used betel-leaf, obtained betel accompaniments from Malays, and
    treated tobacco as a favored luxury used freely by both sexes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Women were described as sitting together weaving mats, each with a native
    cigarette in her mouth.
  category: action
  evidence_refs:
  - ev:6
