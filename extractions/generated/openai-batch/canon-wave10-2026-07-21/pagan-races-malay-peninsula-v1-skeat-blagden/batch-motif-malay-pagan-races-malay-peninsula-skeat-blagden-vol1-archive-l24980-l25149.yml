  quote: ''
  summary: The passage classifies charm-pattern designs on blowpipes, combs, quivers,
    and related objects according to visual features such as vertical dividing lines
    and their stated relation to disease outcomes. It states that charm patterns can
    avert disease only if worn before the disease gains a foothold; afterward, the
    patient must drink a decoction made from materials denoted by the pattern figures.
    It also introduces Sakai designs on musical instruments called tuntong or tuang-tuang.
  language: English
