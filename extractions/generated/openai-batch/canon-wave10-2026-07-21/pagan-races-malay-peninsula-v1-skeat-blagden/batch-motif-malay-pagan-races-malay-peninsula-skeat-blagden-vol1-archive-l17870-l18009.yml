canonical_text:
  quote: ''
  summary: 'Ethnographic passage on cultivation among aboriginal groups of the Malay
    Peninsula: incidental and deliberate fruit-seed dispersal, planting and clearing
    around fruit trees, use of magic and animal-scaring devices for fruit and rice,
    dangers from animals in durian groves, tree-felling methods, early grain cultivation,
    rice customs, and limited rice use among some Semang groups.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Malay chief reports that Besisi people formerly ate jungle fruits in a shelter
    at the gathering place, causing many fruit-trees to grow in one spot from discarded
    seeds.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After this result was pointed out, the Besisi carried fruit away before eating
    it and later moved each fruit season to new spots to spread seeds more widely.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aborigines planted fruit-seeds or seedlings among catch-crops and cleared
    undergrowth around bearing trees about once a year.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Magic was said to be used more often than physical care for improving fruit-bearing,
    while devices were also used to scare away animals that fed on fruit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bears and tigers are described as animals associated with durian groves and
    as allegedly tearing open fallen durian fruit to eat the pulp around the seeds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Some aborigines were attacked and killed in or near small shelters built under
    durian trees for fruit-season watchers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Aborigines are described as skilled tree-fellers who stand on crossed-stick
    platforms and cut trunks at the point where buttresses spring from the trunk.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Jakun workers, when clearing a large area, selected a large tree and felled
    it in a direction intended to bring down smaller trees with it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage presents Chinese millet and light catch-crops as early grains
    or crops, with rice usually introduced later and often cultivated on a small scale
    with inadequate implements.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Magic rites are said to play a large part in rice-planting customs of the
    Sakai and Jakun, and less so among the Semang.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Non-Malay aboriginal rice names, aboriginal rice varieties, and aboriginal
    harvest-rites are cited as evidence against rice terms being borrowed by Mohammedan
    Malays; irrigation is presented as a boundary between pagan and Mohammedan Malay
    cultivation.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The wildest Semang tribes are described as generally not eating rice except
    when they obtain a small amount through other Semang who know Malays; they mostly
    live on roots.
  category: sequence
  evidence_refs:
  - ev:13
