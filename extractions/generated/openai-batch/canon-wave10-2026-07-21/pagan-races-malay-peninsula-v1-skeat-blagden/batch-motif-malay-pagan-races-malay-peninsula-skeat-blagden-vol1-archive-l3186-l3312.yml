canonical_text:
  quote: ''
  summary: The passage describes the geographical distribution, admixture, and physical
    characteristics of the Sakai or Senoi, especially in relation to Semang, Pangan,
    and Jakun groups. It notes uncertainty about racial boundaries, summarizes measurements
    and bodily features, and reports a visual resemblance between a photographed Sakai
    individual and the Veddas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sakai are described as having their racial focus in the mountain ranges
    of south-eastern Perak and north-western Pahang.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that no distinct geographical boundary can be drawn between
    Semang and Sakai and describes a belt of mixed tribes in mid-Perak and northern
    Pahang.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the east coast, Sakai are said not to extend far into Kelantan or Trengganu,
    while admixture with Pangans is said to begin near Ulu Jelai in Pahang.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: West of the central chain, Sakai are said to extend through interior Selangor
    and southward with increasing Jakun admixture through inland Negri Sembilan toward
    Malacca and probably Johor.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Because the exact racial limits of the Sakai are described as undefined, the
    author places the line between Sakai and Jakun at southern Selangor and mid-Pahang,
    where Jakun influence is considered appreciable.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The account of Sakai physical characters is said to be based chiefly on published
    notes and material supplied by Professor Martin, because the exploring party did
    not encounter Sakai individuals.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Sakai are described as not appreciably differing from the Semang in height;
    male and female average heights and head form measurements are reported.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage describes Sakai facial form, lips, lighter complexion relative
    to the Semang, and black hair with a brownish shimmer.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Other travellers and photographs are said to present the Sakai as slender,
    sometimes emaciated-looking, with long unkempt wavy hair and large restless eyes.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: One of the Sarasin brothers, familiar with the Veddas, is reported to have
    initially thought a photograph of a typical Sakai was a photograph of a Vedda.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The author states that, without committing to the affinities of the Sakai,
    they appear distinct from the Semang and from the Jakun type.
  category: relationship
  evidence_refs:
  - ev:9
