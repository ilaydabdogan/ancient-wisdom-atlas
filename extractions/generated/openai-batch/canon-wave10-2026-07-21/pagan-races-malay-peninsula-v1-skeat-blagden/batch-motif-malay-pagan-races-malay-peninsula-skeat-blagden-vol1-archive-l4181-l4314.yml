canonical_text:
  quote: ''
  summary: The passage surveys ethnographic labels, locations, and physical descriptions
    for Udai/Orang Pago, Besisi/Sisi, and Mantra/Mentera. Its most mythologically
    relevant note reports that the term Udai could refer to human groups and also
    to a demon label identified with a jungle race.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Newbold reports the Udai as a little-known race scattered over Jelebu, Pahang,
    Trengganu, and Kedah, resembling the darker variety of Jakun, smaller in size,
    and described as more savage.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Newbold treats the Udai as distinct from the Benua grouping, under which he
    places Jakun, Orang Bukit, Rayat, Utan, Sakai, Alas, Blandas, Besisi, and Akik.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vaughan-Stevens records that the term Udai is applied by the Pangan to pygmy
    tribes of Belum, by Malays to the Orang Jinak or Tame Semang, and also to a species
    of demon called Hantu.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The demon named in the Udai terminology is reported as sometimes identified
    with the whole jungle race, which many Patani Malays call Hantu Pari or Udai Pari.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The authors state that the exact relationship of the Orang Pago or Udai to
    other wild peoples is uncertain; they may be mixed with the Semang or chiefly
    of Negrito origin, and the question is left open.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Besisi are said to call themselves Sisi, while the Malay explanation Besisi
    equals Bersisik, 'scaly people,' is treated as Malay popular etymology.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Besisi are located on streams flowing from Gunong Berembun, including
    Sungei Ujong, Linggi, and the lower Langat with its feeders.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Martin describes the Besisi as essentially brachycephalic and notes that the
    Blandas and Besisi have a larger proportion of relatively taller individuals than
    the Sakai.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Mantra, also called Mentera or Mintera, are described as dwelling about
    Gunong Berembun and adjacent mountains and occupying or frequenting upper parts
    of streams, including the upper Langat.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Logan describes Mantra faces as appearing to be formed of two parts separated
    by a line across the eyes, with detailed reference to forehead, cheek-bones, jaw,
    and chin.
  category: attribute
  evidence_refs:
  - ev:6
