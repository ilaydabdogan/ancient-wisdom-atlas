canonical_text:
  quote: ''
  summary: The passage explains part of a decorative panel called kenachol, whose
    figures are read from right to left. Fig. 2 and following figures are said to
    depict objects hanging above the judgment throne of the Thunder-god Kari. Fig.
    2 is named penjok taduk and is glossed as involving a loin-cloth and pendant flower
    decorations, or possibly an unknown fabulous material used only by Kari and prepared
    by the immortal Chin-oi. Fig. 3 is named kenaij/kenigh, a term of uncertain meaning,
    elsewhere associated with representations of Disease in charm patterns and with
    bright or glittering things. A footnote identifies Kari as the chief deity or
    Thunder-god of the Eastern Semang or Pangan and cautiously compares fabulous objects
    and materials with Malay regalia traditions.
  language: English
  quote_policy: summarized
