canonical_text:
  quote: ''
  summary: 'The passage describes the Semang/aboriginal Malayan burial bamboo called
    the penitah: a patterned bamboo tube buried with the dead and believed to be carried
    by the soul to Kari''s judgment throne. A tribal chief, the Snahut, controls the
    cutting of the patterns and may refuse this for a wicked person, leading to condemnation
    when the soul cannot produce its bamboo. The passage also notes variation in patterns
    by sex, age, and status, the special patterns of chiefs and greater chiefs, and
    the former use of a name-mark on men''s burial bamboos.'
  language: English
  quote_policy: summarized
