canonical_text:
  quote: ''
  summary: The passage describes quiver construction and decoration among the Mantra,
    Besisi, and O. Kuantan/Pahang Jakun, including bat-wing patterns, woven bands,
    waxed panels, resin, reeds, and dart maintenance. It also describes O. Kuantan
    blowpipe types, materials, joining methods with resin and gutta-percha, limited
    range, and reported concealment in living bamboo stems.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bat's-wing pattern is described on the O. Kuantan quiver in the same position
    as a Mantra woven band, with the passage cautiously suggesting it may be a reminiscence
    of such a band.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mantra woven band is said to encircle the outer part of the quiver where
    the item called “pintal tukas” is kept; an editorial note says the terminology
    is confused and distinguishes plaiting from tukas-palm fluff.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The Mantra and Besisi make a rectangular front patch or panel on the quiver
    by scraping off the cuticle surface and waxing it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The rectangular quiver panel is used for rolling up the points of darts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vaughan-Stevens reports that the waxed effect could sometimes be produced
    by rubbing the nose on the quiver panel; the author says he observed Besisi nose-rubbing
    on panels but not the full operation and calls for corroboration.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Mantra carry a small stock of resin at or near the bottom of the quiver,
    mainly to fix loose dart butt-ends, and the quiver interior has reeds.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The O. Kuantan are said to have at least two blowpipe types: a very rough
    type and another resembling aboriginal Malayan blowpipes.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: One O. Kuantan blowpipe type is made from semeliang bamboo internodes, with
    an internal tube in two lengths joined by an outer sheath made from the midrib
    of a langkap palm leaf.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The joined blowpipe ends are wrapped with rag or formerly plant-fibre smeared
    with heated resin, then coated with gutta-percha melted by turning it around a
    firebrand.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The O. Kuantan mouthpiece is described as made of or covered with gutta-percha
    rather than the more usual wood.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: These O. Kuantan blowpipes are described as the least effective known in the
    Peninsula, unable to propel a dart more than forty paces, little used, and reportedly
    hidden inside living bamboo stems with nodes knocked out.
  category: attribute
  evidence_refs:
  - ev:8
