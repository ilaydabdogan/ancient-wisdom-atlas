canonical_text:
  quote: ''
  summary: The passage gives critical methodological remarks on aboriginal Malayan
    decorative art. It cautions that geometrical patterns receive inconsistent native
    explanations, describes ring-lines used as borders or dividers, argues that irregularity
    is characteristic of authentic designs, and discusses terminology for bamboo receptacles
    called goh/gah or go'/tabong without finding a decorative distinction between
    quivers and charm-receptacles.
  language: English
