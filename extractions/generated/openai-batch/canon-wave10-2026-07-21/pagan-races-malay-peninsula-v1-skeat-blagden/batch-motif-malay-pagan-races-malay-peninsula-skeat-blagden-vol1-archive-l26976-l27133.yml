canonical_text:
  quote: ''
  summary: The passage describes Blandas/Jakun customary legal maxims, chiefly jurisdiction
    over inland and coastal zones, an origin record involving movement through named
    places and the founding of Semujong, and Besisi chiefly offices, duties, fines,
    and insignia.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Batin could send a hardened offender several miles into the jungle to live
    alone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blandas of K. Langat are said to have the same governmental system as
    the Selangor Besisi and to possess legal maxims functioning as an unwritten code.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Blandas chiefs invoke the maxims to settle disputes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One maxim attributes laws to Batin Tanggong Gagah and locates path and customs
    among hills, hill-foot, cave, and hill-basin.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: A maxim places the Batin and Jinang at the limit of full flood-tide and assigns
    the Land-folk's chief to hill-tops, upper Langat, and specified forest and mineral
    dues.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A maxim assigns maritime equipment and activities, including sail, oar, anchor,
    awning, fish-fences, fish hunting, and sting-ray spearing, to the Batin of the
    Sea-folk.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A maxim states that laws are at the top of the trunk, genealogy at the bottom,
    and that the chiefs' laws follow the Raja's ruling.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A variant law recounts movement around Sumatra and Menangkabau and through
    Pagar Ruyong, Jati, Tanjong Pagar, and Johor Lama.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: To' Bombong is said to have opened the Nine Rivers with named Batins and elders.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Another section of the law says the Land Semujong was founded where betel-palms
    and coco-palms grew thickly and waved their crests.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: The record describes rule over the Nine Streams' Sources, maintenance by Fourfold
    States, support by Fourfold Clans, and expansion to several passes and streams.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: To' Bombong is identified as becoming To' Klana and as founder of the Land
    Semujong.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Batin Galang went seaward and became a pirate, while Granny Beoi and Batak
    G'rodok went ashore at Rawang, where ancestors dwelt.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The author states that a collection of these Jakun records would be comparable
    to those of the Rembau Malays.
  category: other
  evidence_refs:
  - ev:11
- id: obs:15
  text: Among the Besisi of Langat, the Batin arbitrates disputes referred by subordinate
    chiefs, acts at marriages as priest, acts as magician, and judges wrongdoing.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: Fines imposed by the Besisi Batin are usually paid in cloth or cooking-pots
    rather than money.
  category: object
  evidence_refs:
  - ev:12
- id: obs:17
  text: The Jinang, Penghulu Balei, Jukrah, and Penglima are described as subordinate
