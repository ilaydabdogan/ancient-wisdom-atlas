canonical_text:
  quote: ''
  summary: The passage describes barter practices among Semang, Sakai, Blandas, Besisi,
    Mantra, and related groups, including trade in jungle products for manufactured
    goods, avoidance of direct contact through intermediaries or riverbank deposits,
    preferences among outside trading partners, and the use of charms and magic in
    collecting wild honey. A honey-gatherers' charm addresses moon-white apes and
    'Grannies,' which the author interprets as representing honey collectors and wild
    bees respectively.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Perak Semang are described as obtaining a considerable portion of their livelihood
    by bartering jungle produce with Malays and as ignorant of the value of money.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Perak Sakai are described as trading with Malays either through a tame Sakai
    intermediary or by depositing jungle products on riverbanks and returning later
    for exchange goods.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sakai trade goods listed include tree-gum, resin, gutta, caoutchouc, wax,
    honey, ivory, and rhinoceros horns, exchanged for cloth, salt, kitchen utensils,
    and similar goods rather than money.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Selangor Sakai are said to prefer trading with Chinese, who supply tobacco,
    cloth, rice, tools, and cooking utensils, and to avoid Malays when possible because
    Malays are described as cheating them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Blandas and Besisi are said to make considerable use of incantations and magic
    when collecting jungle produce.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The honey-gatherers' charm calls to moon-white apes, asks them to come into
    the moonlight and listen affectionately, addresses 'Grannies,' and requests teaching
    in how to weave a mat of rushes and bees-wax.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The author explains that the moon-white apes probably represent the Blandas
    honey collectors themselves, while 'Grannies' refers to wild bees that are supposed
    to be deceived by the fiction.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Besisi are said to have similar honey-collecting charms, with one such
    charm previously quoted by the author elsewhere.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Besisi in the Kuala Langat district are said to raise rice crops that neighboring
    Malays tried to cajole from them; the author reports intervening to protect them
    and doubting Malay accusations of false measures.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Mantra are described as having no traders, shopkeepers, or artificers,
    but still engaging in ordinary trade in jungle products and using a coconut-shell
    as a measure.
  category: object
  evidence_refs:
  - ev:10
