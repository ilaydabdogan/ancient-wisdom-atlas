  quote: ''
  summary: 'Ethnographic description of the Malagasy filanjana or iakon palanquin:
    its construction, gendered variants, teams of bearers, relief method, journey
    logistics, luggage carrying, and evening rest around cooking fires after exertion.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some bearers begin carrying their master's children while still boys, becoming
    accustomed to carrying work from childhood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Few middle-aged men can maintain the pace needed for carrying people, but
    many retain enough strength and endurance to carry burdens into old age.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The filanjana, also called iakon in some coastal areas, is described as the
    national carriage of Madagascar.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gentleman's filanjana is built from two light wooden poles held by iron
    rods, with an iron-framed padded leather seat, back, optional foot-rest, pockets,
    sun-shade, and waterproof apron.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The writer states that he travelled many hundreds of miles in such a conveyance
    during district visitation and journeys from the central province.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The ladies' palanquin is described as an oblong basket of plaited sheep-skin
    on poles made from the mid-rib of the rofia palm leaf, sometimes with cloth covering
    and mosquito netting.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Both kinds of palanquin are carried by four stout bearers called maromita,
    a word glossed as meaning “many fordings.”
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Bearers frequently shift the pole from one shoulder to the other and maintain
    a short trot, about six miles an hour on tolerably level ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: For longer travel, six or eight men are used so that relief bearers can rotate
    in, sometimes taking the poles while the group remains in motion.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: An ordinary day's journey is six to seven hours, though bearers may go eight
    or nine hours; good teams may continue this work through journeys lasting months.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Long journeys require additional carriers because beds, bedding, tents, provisions,
    cooking apparatus, clothing, books, and other articles must be transported.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Light packages are balanced on a pole carried by one man, while boxes and
    heavier items are carried by two or more men according to bulk and weight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: After extraordinary exertion, bearers are described as made happy by a gift
    of beef, then gathering around cooking fires in the evening for feasting and jollity.
  category: action
  evidence_refs:
  - ev:6
