literal_observations:
- id: obs:1
  text: A Hova may spend much more on a tomb than on a dwelling house, begin making
    the tomb later in life, and take several years to complete a large costly tomb.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Family tombs of well-to-do people are often placed near ancestral villages,
    rice-fields, or landed property within square enclosures; the tomb may stand in
    the center with houses for slaves and dependants around it.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Royal tombs are in palace-yards, and tombs of old chieftains are in ancient
    towns throughout Imerina.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A tomb vault is constructed with stones lowered into a trench, a west-side
    entrance doorway, stone shelves around three sides, a large covering stone, and
    an earthen and stone superstructure in stages.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ancient tombs used stones fixed without mortar and were sometimes covered
    on top with white quartz; costlier modern tombs may have regular masonry, mouldings,
    pilasters, carved capitals, or arcades.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Prime Minister’s family tomb is described as a large multi-chambered vault
    with verandah, roof access, open arcade, brass door, and lightning conductors.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Imerina the dead are not enclosed in coffins but wrapped tightly in dark-red
    silk lambas and laid on stone shelves in the vault.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kainingory, an aged general believed to be about one hundred years old, was
    ordered by the Queen to be wrapped in one hundred lambas, with the Queen herself
    sending about thirty.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Funerals usually take place the day after death or by the second day; the
    corpse may be placed in a small tent in the house or courtyard before burial.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Funeral displays may include officer’s clothing, women’s dress articles, and
    attendants carrying diamond-shaped paper fans that are placed at the head of the
    grave.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Tombs of the sovereign and highest ranks of Andrians have a small finished
    wooden house erected on top of the stone structure.
  category: attribute
  evidence_refs:
  - ev:7
