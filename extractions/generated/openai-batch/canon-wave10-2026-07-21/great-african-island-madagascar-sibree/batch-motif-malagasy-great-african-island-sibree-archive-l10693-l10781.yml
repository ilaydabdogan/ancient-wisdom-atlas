canonical_text:
  quote: ''
  summary: 'The passage describes ceremonies surrounding Malagasy circumcision festivities:
    preparation of decorated gourds, fetching sacred and strong water with armed escorts,
    sevenfold carrying of water around the house, basket-making for unripe bananas
    used as a faditra or piaculum, night lighting and dances, measuring and blessing
    of children, figurative benedictions of manhood and prosperity, a morning water-fetching
    rite involving stone-throwing at the town gate, seating children on drums near
    the hearth, circumcision, and warming the children at a rush fire.'
  language: English
  quote_policy: summarized
