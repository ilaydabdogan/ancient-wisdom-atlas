literal_observations:
- id: obs:1
  text: Some towns use dense prickly-pear thickets as an impervious barrier, with
    narrow winding roads leading to gateways made of round poles hung from a cross-bar.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some gateways include low interior walls or long low tunnels with multiple
    pairs of barred wooden gates, especially near uninhabited land where Sakalava
    marauding parties are said to appear.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Old Betsileo towns are described as being built on very lofty and inaccessible
    hills, while plains may contain detached homesteads enclosed by thorny mimosa
    ring-fences.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bara towns are described as arranged more for cattle convenience than human
    comfort and as having prickly-pear defenses and pole gateways similar to Sihanaka
    villages.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: In eastern and southern Madagascar, many apparent village houses are rice
    stores called trano donho, or elevated houses.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The rice stores are raised on four posts and have smooth saucer-shaped collars
    below the floor to stop rats or mice from climbing to the stored rice.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The same rice-houses are also used for storing clothes and other valuables.
  category: object
  evidence_refs:
  - ev:7
