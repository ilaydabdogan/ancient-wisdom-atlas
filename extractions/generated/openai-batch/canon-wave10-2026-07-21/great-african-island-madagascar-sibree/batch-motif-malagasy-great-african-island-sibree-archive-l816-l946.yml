canonical_text:
  quote: ''
  summary: The passage reproduces and comments on seventeenth-century English promotional
    descriptions of Madagascar by Walter Hamond and Richard Boothby. It presents title-page
    claims about Madagascar's fertility, inhabitants, commodities, and colonial suitability;
    describes Hamond's praise of inhabitants' honesty and supposed Adamic innocence;
    notes wars with neighboring groups; mentions valuable trees including a blood-colored-sap
    'flesh-tree'; and quotes a Christian colonial-missionary appeal to possess and
    redeem the personified land. Boothby's title further presents Madagascar as an
    'Earthly Paradise' and a desirable English colony and trading base.
  language: English
  quote_policy: summarized
