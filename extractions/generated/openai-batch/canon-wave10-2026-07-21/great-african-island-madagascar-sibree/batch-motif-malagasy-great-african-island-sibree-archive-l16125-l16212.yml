canonical_text:
  quote: ''
  summary: 'The author argues that Malagasy people newly attached to Christianity
    sometimes interpreted baptism and the Lord''s Supper as ody, or charms, expected
    to provide benefits. He gives examples: people asked to pray to or drink baptism;
    crowds sought baptism after royal adoption of Christianity; a deacon drank leftover
    baptismal water rather than discard it; and sick members requested that communion
    bread and wine be brought to their homes. The author explicitly compares these
    missionary experiences to the rise of sacramental ideas in early Church history.'
  language: English
  quote_policy: summarized
