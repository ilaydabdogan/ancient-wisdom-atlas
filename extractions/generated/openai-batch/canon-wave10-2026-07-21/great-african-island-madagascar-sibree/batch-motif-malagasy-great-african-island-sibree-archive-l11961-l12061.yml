canonical_text:
  quote: ''
  summary: The passage explains Malagasy words for family, tribe, nation, siblings,
    cousins, half-siblings, in-laws, and children. It notes a possible connection
    between a mother-derived word for nation or clan and female-line inheritance,
    describes how sibling words extend to cousins and friendly address, and records
    marriage preferences and taboos among different cousin categories, including a
    ceremony for some consanguineous marriages and a prohibition on marriage between
    sisters' descendants of the same mother.
  language: English
  quote_policy: summarized
