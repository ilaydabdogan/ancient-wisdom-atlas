  quote: ''
  summary: The passage first describes animal life inhabiting a fleshy fern-like river
    plant in the Mananj^ra. It then discusses the exceptional character of Madagascar’s
    fauna, especially deficiencies compared with Africa, specialized forms, and affinities
    with Southern Asia or Malaya. It reports Dr. Philip L. Sclater’s deductions that
    Madagascar was long isolated, had a former land connection with India, and may
    be a relic of a broken-up former continent named Lemuria. It also notes Dr. Hartlaub’s
    emphasis on Indian affinities among birds and Alfred Wallace’s work on animal
    distribution.
