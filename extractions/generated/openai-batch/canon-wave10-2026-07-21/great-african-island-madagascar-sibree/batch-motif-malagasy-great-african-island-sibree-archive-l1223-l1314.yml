canonical_text:
  quote: ''
  summary: The passage criticizes early English and French maps of Madagascar, especially
    their interior detail. It says Rochon's map appears complete but omits major interior
    places and seems filled in by imagination; Lloyd's map is described as unreliable
    and admitted by Lloyd to lack correctness for the interior; Owen's coastal survey
    is distinguished as accurate; later French maps are said to rely largely on verbal
    information and itineraries, with Grandidier criticizing Lacombe's claimed island
    crossings as imaginative because Lacombe had not left the east coast.
  language: English
  quote_policy: summarized
