canonical_text:
  quote: ''
  summary: The passage reports Malagasy beliefs and customs concerning fady or tabooed
    foods, lunar calendars, auspicious and inauspicious days and months, infant killing
    connected with unlucky birth days, possible aversion by offerings or ordeal, travel
    food prohibitions, Anorohoro village-entry restrictions for strangers arriving
    at bad-omen times, and a Bara rule of live burial in an ant-hill when a child's
    birth day is unlucky to both parents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain vegetables or prepared foods could be fady to individuals or families
    and could restrict whether a visitor might enter a house while carrying them.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that belief in lucky and unlucky days is common to all
    tribes in Madagascar, and that the Malagasy month is lunar.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The days from one new moon to another are described as being named by twelve
    names, the same as month names, with subdivisions called vava, vanto, and fara
    or vady.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hova month names are described as Arabic in origin, while coastal month names
    are described as compounds of native words; related east and west forms are said
    not to be synchronous.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the former Hova system, only twelve of twenty-eight days were counted lucky,
