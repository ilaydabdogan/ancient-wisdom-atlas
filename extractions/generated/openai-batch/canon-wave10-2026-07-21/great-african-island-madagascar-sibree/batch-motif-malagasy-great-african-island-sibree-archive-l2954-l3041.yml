    a large ahoma/akoma specimen, a boa-like Sakalava serpent said to constrict victims
    and sometimes kill oxen or people, and records a native report that it strikes
    with a tail spur and sucks blood. It also describes lizards, chameleons, and tree-frogs
    exposed in fallen treetops after a cyclone.
