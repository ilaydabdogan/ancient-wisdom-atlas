canonical_text:
  quote: ''
  summary: The passage introduces a chapter section on Malagasy circumcision observances.
    It states that, unlike Jewish and Mohammedan religious circumcision, Malagasy
    circumcision is presented mainly as initiation into the community. It describes
    Hova observances appointed by the sovereign, public preparations, hair-dressing,
    officiants with living parents, sacrifice and prayers for children, preparation
    of consecrating water, dance, alteration of the ritual house, and ornamented gourds
    for water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Malagasy circumcision has little, if any, religious
    significance and is regarded rather as an initiation into the community.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children who undergo the ceremony are said to be made "men," "consecrated,"
    or established.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says circumcision prevails throughout the various tribes of the
    island and that its main observances are generally similar, with some local variations.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among the Hovas, the ceremony is described as a major festivity appointed
    every few years by the sovereign, rather than occurring when each male child reaches
    a fixed age.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ceremonies last several days, and royal-family observances are described
    as fuller than those of the people generally.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After proclamation of a national assembly, people are ordered to clear roads
    for the sovereign's visit to six ancient towns and are admonished to "kill the
    rats," glossed in the passage as putting sorcerers to death.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The first ceremony after notice is a special dressing or parting of the hair
    for the fathers and mothers of the children, while the sovereign is attended seated
    on a sacred stone in the centre of the capital city.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Many ceremonies at this time are performed by people whose father and mother
    are still living; persons from Alansora perform ceremonies for the sovereign.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A red-and-white cow is sacrificed with prayers and supplications for blessings
    on the children, including victory over enemies and long life; oxen are then killed
    amid dancing, rejoicing, and cannon fire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Preparations are made for fetching water called sacred or consecrating water,
    while the parents' hair is dressed in the sedotra style of numerous small plaits
    lengthened with false hair and folded around small pieces of wood.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A dance called soratra is arranged in lines, the sovereign takes part, and
    he pulls down the southern wall of the house where circumcision is to be performed
    before the house is extended southward and furnished.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Bottle-shaped gourds for fetching the sacred water are ornamented and bound
    with three bands.
  category: object
  evidence_refs:
  - ev:11
