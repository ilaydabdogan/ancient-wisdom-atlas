canonical_text:
  quote: ''
  summary: The passage describes Malagasy beliefs and taboos concerning crocodiles
    and other animals. Crocodiles are feared as destructive river and lake animals,
    are killed only in retaliation, are addressed in an annual proclamation near Lake
    Itasy, and are propitiated with prayers. Crocodile teeth are used as charms and
    ornaments. Other reported beliefs include crocodiles living on stones, mating
    with water-birds, and embodying the spirits of chiefs. The passage then describes
    wider beliefs in transmigration or embodiment of spirits in lemurs, Aye-ayes,
    wild cats, owls, and bats, with taboos and omens attached to these animals.
  language: English
  quote_policy: summarized
