  summary: The passage describes Hova sacred places and beliefs involving venerated
    trees, Vazimba tombs and spirits, offerings and taboos, water-dwelling beings,
    a story of blindness and underwater disappearance, a water-princess or mermaid
    figure, and roadside heaps receiving small deposits for safe return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People are described as paying adoration to a lontana tree with an ox-skull
    and charms, and another large tree bears a fixed figure of a woman.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tree with the woman figure is explained by local informants as a place
    where people pray when they want women or are about to marry.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stones and graves of the Vazimba are described as formerly prominent sacred
    places among the Hovas.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vazimba tombs became sacred places; Vazimba spirits were treated as objects
    of special worship and dread.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Oxen, sheep, and fowls were sacrificed at Vazimba tombs, and stones were rubbed
    with fat to obtain good or avert anger.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Treading on Vazimba tombs was believed to offend them and to result in pain,
    disease, or blindness.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Vazimba are described as of two kinds, kindly-disposed and fierce or cruel;
    some inhabit water and others are terrestrial.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Vazimba were believed to appear in dreams to people seeking their aid,
    warning and directing them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A famous Vazimba called Eanoro had tabooed things; salt, onions, shellfish,
    and funeral meat are named as offensive to him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Salt near Eanoro's water required substitute naming, and people inspired by
    him were said to be violently shaken if they used the wrong term.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A slave-girl inspired by Eanoro was said to have been struck blind after offending
    him, restored to sight by a plant wash, and then taken by him into the river Ikiopa
    for three days under water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Vazimba in Lake Itasy were said to show themselves on a rock, wear a red lamba,
    and disappear if anyone came too near.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Vazimba are reported to have disappeared from the central provinces after
    the idols were burnt and to have gone into the sea west of the island.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Among the Tankla people, Andriamhavirano is described as a water-princess
