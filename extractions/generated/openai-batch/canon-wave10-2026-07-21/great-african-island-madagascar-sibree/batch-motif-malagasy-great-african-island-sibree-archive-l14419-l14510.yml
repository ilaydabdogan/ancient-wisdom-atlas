canonical_text:
  quote: ''
  summary: 'The passage describes several Malagasy idols and charms: offerings and
    water sprinkling by idol-keepers; Manjakatsiroa as a sovereign''s tutelary idol
    used in an accession ritual; Ranakandriana as an oracle-like idol kept in a cave;
    other idols credited with protective or punitive powers; the burning of Imerina
    idols and charms by royal command in 1869; and household or tribal charm worship,
    including family idols, dreams, offerings, sacrifices, and cattle-protecting charms.'
  language: English
  quote_policy: summarized
