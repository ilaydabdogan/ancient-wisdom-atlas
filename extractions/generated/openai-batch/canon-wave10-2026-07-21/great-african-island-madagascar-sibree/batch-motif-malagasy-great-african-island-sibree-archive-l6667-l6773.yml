canonical_text:
  quote: ''
  summary: The passage reports nineteenth-century ethnographic accounts of Kimos or
    Quimos, described as a very short-statured people in Madagascar’s interior, and
    of the Kalio or Behosy, described as living in a wooded western region with distinctive
    subsistence and movement habits. The author stresses that these accounts concern
    regions little known to Europeans and then turns to the difficulty of estimating
    Madagascar’s population.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kimos or Quimos are reported as people of very short stature in Madagascar’s
    interior, averaging about three feet six inches, though the author says accessible
    traces are lacking.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage attributes to the Kimos lighter colour than most inhabitants of
    Madagascar, woolly hair, long arms, and particular descriptions of women’s breasts.
  category: attribute
  evidence_refs:
