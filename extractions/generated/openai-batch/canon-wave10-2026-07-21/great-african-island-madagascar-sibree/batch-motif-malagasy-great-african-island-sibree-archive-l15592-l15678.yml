canonical_text:
  quote: ''
  summary: The passage describes Malagasy clothing, especially the lamba, its uses
    in speech, work, serving, travel, and sleep; food customs involving hand-washing,
    hospitality, feasts, and blessings; and water-fetching and household labor by
    women of different ranks. The author repeatedly compares these customs with biblical
    and Eastern practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The lamba is described as outdoor or walking dress whose ample folds enclose
    the arms.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: During excited preaching or public address, a speaker may throw the lamba
    off one shoulder to free the arm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before active work, the lamba may be thrown off the shoulders and bound tightly
    round the waist; servants gird themselves before serving meals, and masters may
    use girded lambas as towels.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The lamba can be easily taken off, cast away, or left with a pursuer; among
    the poor it may serve as covering by night as well as day.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Many Malagasy people do not wear shoes, but for rocky or prickly journeys
    they may prepare rough sandals bound around the foot with thongs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Because hands are largely used in serving and eating food, washing before
    and after eating is described as necessary; a servant pours water over the hands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When friends are invited to a feast, the host and hostess serve at the table,
    and a servant is sent at the exact time the feast is ready to summon the guests.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Christianised Malagasy are described as asking a blessing before eating, treating
    the act as consecrating the food, which is then called vita fisaorana, or properly
    blessed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Ivohitrosa, daughters and wives of the king and his family are described
