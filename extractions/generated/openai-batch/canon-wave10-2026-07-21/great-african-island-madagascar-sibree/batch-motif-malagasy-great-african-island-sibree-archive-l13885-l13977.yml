canonical_text:
  quote: ''
  summary: 'The passage describes several Malagasy customs and beliefs: reluctance
    or taboo around pronouncing one''s own name; the tatao custom of placing feast
    food or water on the head; regional terminology for stone or rubbish heaps; royal
    death taboos; beliefs about death pollution, restless departed spirits, and washing
    after funerals; and Sakalava relocation after a death in a village.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some persons do not tell or pronounce their own name; attendants, slaves,
    or servants may answer for them, and the passage gives a Sakalava example in which
    self-pronunciation of the name is fady.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tatao is described as placing on the head a portion of rice, honey, and meat
    eaten at the New Year's feast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When people have safely crossed a dangerous stream, they take a handful of
    the water and put it on their heads.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author describes the stream-crossing tatao action as apparently a sign
    of thanksgiving and suggests the practice may be a relic of an ancient form of
    worship.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: Among the Betsileo, the word tatao is applied to heaps of stone and rubbish,
    which the Hova call fanataovana.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the death of a sovereign, a number of things become fady for a specified
    time, usually several months and sometimes a year.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Radama I's death, reported prohibitions included showy dress, ornaments,
    unguents, horseback riding, palanquin carriage, various crafts, writing, salutations,
    music, dancing, singing, furniture use, and drinking spirits; many people were
    ordered to shave the head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Queen Rasoherina's death in 1868, reported prohibitions included playing
    musical instruments, clay building, pottery manufacture, lying on a bed, spinning,
    and preparing silk; ordinary death rites involving bullock killing and usual ceremonies
    were also restricted.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says Malagasy concern for tombs is partly explained by a belief
    that the departed spirit is unrestful if the body remains unburied.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'The passage reports a general belief in death pollution: funeral attendees
    cannot approach the palace or sovereign until a month has passed, and corpses
    are not allowed to be buried in or remain long in the capital city.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The rough bier used to carry a body is thrown away near the grave as polluted,
    is not used even for firewood, and is left to decay.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: After a funeral, mourners wash their dress or dip part of it in running water
    in a ceremony called afana, understood in the passage as carrying away uncleanness
    from proximity to a corpse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Among the Sakalava, when a death occurs in a village, the settlement is broken
    up and rebuilt at a distance because the deceased spirit is believed to haunt
    the spot and harm those who remain.
  category: action
  evidence_refs:
  - ev:6
