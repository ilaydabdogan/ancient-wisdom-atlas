  summary: The passage describes a seventeenth-century English proposal to found a
    plantation or station in Madagascar, first under Prince Eupert and later under
    the Earl of Arundel, which was halted by English political troubles. It then summarizes
    Sir William Davenant's poem on Madagascar as a dream-form, complimentary poem
    to the prince, full of inflated praise, imagined rulership, and images of a wealthy
    golden island with mines, coral trees, mermaids, pearls, and gems. The passage
    concludes by treating the poem as evidence of extravagant English ideas about
    distant countries' wealth.
