  summary: The passage discusses Malagasy words as evidence of historical contact
    and earlier social customs. It describes Arabic-derived terms in calendrical,
    commercial, written, and other vocabulary; Malagasy terms preserving fortified-village
    practices, hilltop settlement, polite entry formulas, primitive bridge forms,
    and a gesture of homage; and possible French influence on the word for domestic
    cat.
