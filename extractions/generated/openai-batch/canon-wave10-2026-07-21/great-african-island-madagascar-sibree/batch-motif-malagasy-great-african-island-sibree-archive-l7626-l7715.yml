  summary: The passage describes English, European, and Arabic loanwords in Malagasy
    as evidence of historical influence. It links English-derived terms to military
    training, building, education, printing, and Christianity; notes some newer ecclesiastical
    and scientific terms; and then discusses Arabic influence in Malagasy names for
    days, months, zodiacal constellations, divination, witchcraft, and fate.
  language: English
  quote_policy: summarized
