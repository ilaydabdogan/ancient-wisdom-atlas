canonical_text:
  quote: ''
  summary: 'The passage describes several Malagasy burial customs as reported by missionary
    and colonial-era observers: forest burial among Ikongo Tanala with a notched tree
    marker and funeral games; Bara practices involving gunfire, wailing, killing oxen,
    royal mourning obligations, stone-covered burials, and cave burial; Betsileo cave
    tombs in precipices marked by cattle skulls and guarded enclosures; and Antankarana
    corpse treatment, canoe coffins, shore cemeteries, offerings or feasts for ancestral
    spirits, desiccation, and contact with corpse-fluid.'
  language: English
  quote_policy: summarized
