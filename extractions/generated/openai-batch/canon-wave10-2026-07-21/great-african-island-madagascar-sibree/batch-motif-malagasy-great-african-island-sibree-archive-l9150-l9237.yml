canonical_text:
  quote: ''
  summary: 'The passage describes Malagasy court etiquette around the sovereign: royal
    carrying, sacred stones used on return and accession, scarlet regalia, salutes
    toward the palace, rules about bodily orientation before the Queen, the sovereign''s
    required highest seat, acknowledgment of royal land ownership, and comparisons
    to Assyrian, Polynesian, English coronation, and Muslim directional practices.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Assyrian kings are described as appearing in state chariots with a large decorated
    umbrella carried over them by an attendant.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Malagasy praise songs call the Queen “not walking on the ground,” and
    the sovereign is usually seen carried in a state palanquin except when stepping
    to a sacred stone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A sacred stone in the centre of Antananarivo is used when the Queen returns
    to the capital; she stands on it briefly and is saluted by troops and cannon.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Another sacred stone west of the city was formerly used for the sovereign
    to stand on at accession.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Scarlet is described as the royal colour in Madagascar; only the sovereign
    may wear a scarlet lamba, and a royal house is draped in scarlet when a king or
    queen dies.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: When people see the scarlet umbrella at a distance, they bow toward it and
    salute the Queen.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: It is improper to turn one’s back toward the sovereign; people passing before
    her bend down, stretch out both hands, and repeat a formal salutation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: On festive occasions loyal Malagasy turn toward the palace when drinking the
    sovereign’s health; soldiers at distant posts also turn toward the palace and
    salute with music, drums, and presented arms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Shooting in the direction of the palace in Imerina is described as improper
    because it appears threatening toward the majesty living there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Whenever a Malagasy sovereign appears in an assembly, she must be seated in
    the highest place; examples include church galleries and the highest throne in
    the royal chapel.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: A cited account of Tamehameha says subjects were not allowed to be physically
    above him, even by walking on a deck over his cabin.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: At the opening of a building, a dollar is presented to the highest military
    officer present as acknowledgment of the Queen’s proprietorship of the land.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: People must turn out of the way before the sovereign and also before anything
    belonging to her when it passes through the streets.
  category: action
  evidence_refs:
  - ev:10
