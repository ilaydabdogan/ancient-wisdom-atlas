canonical_text:
  quote: ''
  summary: 'The passage describes Hova blood-covenant observances involving selected
    objects, invoked witnesses, maledictions and benedictions, and water poured over
    the parties’ hands. It then describes Sakalava royal ancestor customs: royal corpses,
    retained relics, possible human sacrifices, relic houses, and the political authority
    attached to possession of royal relics.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A native account of the Hova blood covenant lists seven roots of grass, a
    twisted-neck grasshopper, dung from a calf without its mother, water from a drying
    spring, an old bone, a single gun, and a spear without a foot, placed in a rice
    winnower.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: An invocation is made to God, the four corners of the earth, and Andriampetitra;
    these are addressed as witnesses to the covenant.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The contracting parties are described as not being of the same parents but
    as united in friendship and affection by the covenantal things.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ritual objects are each explained as warnings of consequences if the covenant
    or friendship is not kept.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: After further maledictions and benedictions, the wooden dish containing the
    objects is overturned, and water is poured over the hands of the contracting parties
    above the dish.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Among the southern Sakalava, a king’s corpse is wrapped in ox-hide and suspended
    in deep forest recesses; after some months chiefs search for specific remains,
    while the rest is ceremonially interred.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Human sacrifices are sometimes offered during the royal funerary occasion,
    with victims’ bodies placed under the royal bier.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Royal relics are enclosed in a crocodile’s tooth and carried to a sacred house
    where former kings’ relics are preserved.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Possession of the royal relics is said to constitute the right to royal authority;
    a legitimate heir without them loses authority, while a usurper with them can
    ascend the throne.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Mojanga, the Zomba sacred house preserves northern Sakalava royal relics
    in four suspended boxes containing hair and finger and toe nails, with gold or
    silver covers and weapons placed around them.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Sakalava are said to meet at the Zomba on every Friday to sing and pray,
    though the supplied passage ends mid-sentence.
  category: action
  evidence_refs:
  - ev:9
