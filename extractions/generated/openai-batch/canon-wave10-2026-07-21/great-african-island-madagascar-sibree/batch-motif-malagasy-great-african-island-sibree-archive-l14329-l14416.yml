canonical_text:
  quote: ''
  summary: The passage describes Malagasy idols taken out on special occasions while
    elevated on poles and covered from view. It lists fady, or tabooed things and
    acts, for Kelimalaza, Ramahavaly, and Rafantaka. Ramahavaly is described as a
    healing idol with powers over disease, nature, seasons, futurity, and punishment,
    with serpents as agents of anger. The passage also describes Ramahavaly's wooden
    lizard forms, coverings, charms, and burning, and Rafantaka's form as a wild-boar
    tusk with red silk and bead-and-silver ornament.
  language: English
  quote_policy: summarized
