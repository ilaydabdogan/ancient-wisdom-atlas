literal_observations:
- id: obs:1
  text: The passage notes that ancient writers frequently mention papyrus boats, and
    cites Plutarch describing Isis traveling in a papyrus barque while searching for
    the body of Osiris.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the south-east coast of Madagascar, boats called sitry are used in lagoons,
    river mouths, and for going out to sea to foreign vessels.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sitry are described as plank-built boats with carefully fitted planks, high-rising
    ends, about thirty feet in length and eight feet in beam, able to carry fifty
    people.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sitry construction uses no nail or iron; planks are tied with twisted
    anhona palm-fibre cord and holes are plugged with hard-wood pins.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: In sitry, seats stiffen the structure, bamboo strips caulk the seams, and
    bamboo loops serve as rowlocks for large oars or sweeps.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the north-west coast, outriggers are widely used for Sakalava and Antankarana
    canoes and are said to be necessary for rough bays and inlets; the passage contrasts
    this with Hova canoes, where the outrigger is not seen.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some north-western canoe types have thin planking and curved pieces rising
    from head and stern; the author says some may have been introduced by Banyan traders
    from India, while others are probably as old as the northern Malagasy tribes themselves.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A canoe type called lakaminara has a raised central platform called a fira
