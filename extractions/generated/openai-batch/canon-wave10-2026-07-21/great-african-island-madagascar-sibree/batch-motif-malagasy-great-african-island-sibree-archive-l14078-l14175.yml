canonical_text:
  quote: ''
  summary: 'The passage catalogs Malagasy charm practices and related customs among
    Bara, Betsileo, Sihanaka, and Hova groups: body-worn charms made from wood, bones,
    miniature figures, horn, ashes, fat, wax, and needles; charms for fatigue, safe
    crossing, acquisition, invulnerability, healing, protection, bull-fights, and
    ordeals; Bara fady with penalties and youth instruction; a Sihanaka stone-pitching
    prosperity custom; and white earth or clay face marking for cures and festive
    or coronation use.'
  language: English
  quote_policy: summarized
