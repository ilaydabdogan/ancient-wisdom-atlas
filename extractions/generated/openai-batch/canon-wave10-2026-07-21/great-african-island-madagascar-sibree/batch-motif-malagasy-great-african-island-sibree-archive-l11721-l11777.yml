canonical_text:
  quote: ''
  summary: 'A quoted account from Robert Drury describes southwestern Malagasy burial
    practice: a tree is chosen and ritually treated to make a coffin; an ox or cow
    is killed, its blood sprinkled, and forefathers and other beings invoked. The
    corpse is washed, wrapped, placed in the hollowed tree coffin, and carried to
    a fenced family burying-place. Fires and burned cattle offerings are made outside
    the enclosure, the family elder calls the ancestral dead by name to receive the
    deceased, and only selected relatives and bearers enter to bury the corpse. Annual
    cleaning of the burial place also requires a cattle burning before entry.'
  language: English
  quote_policy: summarized
