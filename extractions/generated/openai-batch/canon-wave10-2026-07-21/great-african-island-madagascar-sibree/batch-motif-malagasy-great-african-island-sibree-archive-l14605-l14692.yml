canonical_text:
  quote: ''
  summary: 'The passage first recounts a man offering his blood and life to sanctify
    a new royal house, with the king substituting a simulated death and granting hereditary
    exemptions to the man''s descendants. It then describes Malagasy sacred places
    used as altars: tomb headstones, stream stones, fertility stones, Tanala stone
    and stake altars, and Bara tamarind trees, posts, and royal-enclosure posts associated
    with offerings, vows, prayers, guardianship, and propitiation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man named Eatrimofoloalina offered that his blood be shed to sanctify a
    new royal house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king ordered that only the man's ear be cut and that red-dyed water be
    sprinkled over the post so observers would think the man had been killed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the simulated killing, the king granted hereditary protections to the
    man's descendants, who became known as Tsimatimanota, glossed as not killed although
    transgressing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that the Malagasy have no temples but have sacred places
    where sacrifices are offered and which may be considered a kind of altar.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tomb headstones are described as rude slabs of blue granite or basalt anointed
    with blood and fat from animals killed at funerals and other occasions, especially
    New Year.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some stones in stream beds are anointed to propitiate spirits believed to
    dwell in or near the water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Other stones are anointed by women who wish to obtain children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Among the Tanala, one described altar consists of three stones fixed in the
    ground with a large flat stone covering them and an upright stone as a back-piece.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Another Tanala altar consists of an upright stake with bamboos arranged around
    it in a cone shape, with stones in front.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Heads of cattle, fowls, and other animals are thrown on the stake-and-bamboo
    altar as offerings, and people pray there for desired blessings, especially children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Among the Bara, sacred tamarind trees near towns have small baskets, mats,
