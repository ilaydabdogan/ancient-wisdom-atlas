  text: After the deaths of a prince's mother and her sister, people in the district
    were not allowed to dig or plant until the fanany appeared; the restriction created
    famine danger and Hova authorities intervened to hasten the appearance.
  category: sequence
  evidence_refs:
  - ev:1
