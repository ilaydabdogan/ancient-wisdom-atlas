comparison_claims:
- id: claim:1
  claim: The passage explicitly contrasts Malagasy flower use in festivities with
    Polynesian practice, stating that Malagasy do not make much use of flowers in
    festivities like Polynesians, while still listing specific Malagasy royal, offering,
    and ordeal-procession uses.
  claim_level: same_function
  target: Polynesian festive flower use
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs:
  - ev:7
  confidence: medium
  limitations: This is an authorial comparison only; the passage gives no details
    of Polynesian examples and does not support a claim of historical contact or common
    inheritance.
