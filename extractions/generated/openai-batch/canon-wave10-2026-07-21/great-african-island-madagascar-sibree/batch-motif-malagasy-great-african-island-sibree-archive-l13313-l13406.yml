canonical_text:
  quote: ''
  summary: The passage describes beliefs about the fanany, including a cultivation
    ban after deaths until its appearance and lore that it has seven horned heads,
    can swell to mountain size, ascend to heaven, or take refuge in the sea. It then
    catalogs Malagasy sacred trees and plant practices, including venerated tomb trees,
    trees connected with idols or death omens, sacred Tamarind and Baobab trees, birth
    and acknowledgment rites using trees or roots, flower adornment and offerings,
    flowers in ordeal-cleansing processions, victory charms, household taboos, and
    a Hova housewarming food plant.
  language: English
  quote_policy: summarized
literal_observations:
