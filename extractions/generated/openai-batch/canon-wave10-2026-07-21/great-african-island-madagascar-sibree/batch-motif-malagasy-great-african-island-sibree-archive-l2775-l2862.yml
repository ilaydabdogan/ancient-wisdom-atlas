canonical_text:
  quote: ''
  summary: 'A natural-history passage describes several Madagascar birds: white egrets
    following cattle and roosting seasonally near Ambohimanga; parrots, parroquets,
    cuckoos, and long-tailed birds; small birds camouflaged against dry-season grass;
    scarlet male cardinal-birds or fody in breeding behavior; kingfishers near water;
    and a correction that reported hummingbirds are likely a mistake while sun-birds
    are present.'
  language: English
  quote_policy: summarized
