canonical_text:
  quote: ''
  summary: The passage describes annual ceremonies for royal ancestors, including
    ox slaughter, taboos on entry, prayers, burning fragrant gum, anointing relic
    boxes and royal property, music, dance, frenzy, and oracular speech attributed
    to departed kings. It then summarizes Malagasy and Hova burial customs, explaining
    that departed friends are believed to become divine in a certain sense and able
    to benefit descendants. It also describes Hova tomb construction using basalt
    slabs detached by fire and dragged communally, with food preparation and bullock
    killing during the work.
  language: English
  quote_policy: summarized
