canonical_text:
  quote: Andriamanitra hita-maso — "the god seen by the eye," the visible divinity.
  summary: The passage describes Malagasy royal absolutism, fear of the sovereign's
    word and frown, former language treating sovereigns as visible divinity, petitioners
    waiting at palace gates, a custom by which a criminal seen by the sovereign during
    a royal progress may claim pardon, and large royal journeys with thousands of
    attendants. The author repeatedly compares these practices to biblical and Eastern
    royal customs.
  language: English
  quote_policy: quoted
