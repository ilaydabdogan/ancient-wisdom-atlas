canonical_text:
  quote: ''
  summary: 'The passage describes Malagasy ordeal customs and household superstitions:
    infant exposure to oxen for children born in an ill-fated month; a water-in-the-nose
    test for theft; sneeze blessings; practices involving lost milk-teeth, toothache
    worms, morning saliva, spitting, threshold etiquette, food tasting to prove good
    faith, Bara vigilance, and Hova sacred house orientation and chants for protection.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An infant could be laid at the entrance of a cattle-fold, with oxen driven
    over the spot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the oxen avoided the infant, the child was considered to have overcome
    the evil fate and was spared.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Children who survived this ordeal were said to be sent away for a time and
    believed likely to become extremely rich; the passage gives the Prime Minister
    as an example.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bdno-dn'-drona ordeal tested an accused person by putting water in the
    nostrils, with sneezing treated as a sign connected to guilt.
  category: action
  evidence_refs:
  - ev:3
