canonical_text:
  quote: ''
  summary: The passage reports a cattle-dealer belief that throwing the top of an
    ant-hill at a returning ox prevents it from returning to its former owner. It
    then describes the buffalo or bull as an emblem of strength and majesty in Malagasy
    figurative language, including royal and chiefly salutations, bull-fighting charms,
    and a circumcision ceremony in which an ox has a special song-name and its body
    parts are ritually apportioned among participants and recipients. A footnote notes
    remains of a former Queen's fighting bull wrapped in a red lamba.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A reported practice removes the top of a large ant-hill and throws it at the
    rump of an ox that keeps returning to the town where it was bought; cattle dealers
    are said to believe the animal will then not return to its former owner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The buffalo is described as the largest and most powerful land animal known
    to the Malagasy and as an emblem and embodiment of strength and majesty in poetical
    and figurative language.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kings are said to have been saluted as "Omhelahy," glossed in the passage
    as "bulls," and the expression is said to occur in benedictions at circumcision
    and other festivities.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In some tribes the chief is said to be saluted by a word printed in the passage
    as "£ih7/," usually meaning "animal" or "living creature."
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bull-fighting is described as a former favourite Malagasy amusement, and charms
    are said to have been used to make a favourite animal victorious.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: During rejoicings connected with circumcision ceremonies, the ox has a prominent
    place and is called in songs by a special name printed as "Vbrihangy" rather than
    by the common name printed as "bniby."
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Every portion of the circumcision ox is said to be apportioned to a particular
    person, including participants in the slaughter, the old, the newly-delivered,
    and visitors.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The circumcision ox song is described as a chant with a repeated chorus; the
    ox-name is repeated in every stanza, and body parts such as horns, hoofs, tongue,
    ears, eyes, brain, head, neck, and hump receive special mention or allocation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A footnote reports that remains of one of a former Queen's fighting bulls
