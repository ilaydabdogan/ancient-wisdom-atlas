canonical_text:
  quote: ''
  summary: The passage introduces a chapter on Malagasy idolatry and religious observances.
    It describes Malagasy idolatry as largely charm-worship, with a Hova development
    involving principal idols. In Imerina, several idols were venerated, especially
    four considered protectors of the kingdom and sovereign. The named idol Rakelimalaza
    is described as a protective charm made of sacred-tree wood wrapped in white silk,
    kept in an idol-house under hereditary guardianship, sometimes anointed, and visited
    by people bringing offerings for desired benefits.
  language: English
  quote_policy: summarized
