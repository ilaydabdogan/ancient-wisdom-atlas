- id: obs:4
  text: Malagasy idolatry is described as fetishism or worship of charms, while Hova
    idolatry is described as a somewhat different development from the charm-worship
    common on the island.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: European observers in early nineteenth-century Imerina found household idols
    or sampy, village and district idols, and a group of fifteen or sixteen more widely
