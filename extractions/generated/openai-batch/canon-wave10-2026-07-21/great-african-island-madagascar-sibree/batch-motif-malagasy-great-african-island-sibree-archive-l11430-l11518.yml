  quote: ''
  summary: The passage describes Betsileo/Botsileo corpse treatment after death, Sihanaka
    village memorial poles, mourning rites, funeral animal killings, and notes comparable
    Hova and eastern-coast or Polynesian mortuary practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wailing, drumming, fiddling, and shell-blowing are described as continuing
    throughout the earlier burial observance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the described Betsileo/Botsileo custom, the body is said to swell on the
    third day after death and is then removed from the coffin and rolled on planks
    until pulped.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the fourth day, another ox is killed, and skins from that animal and previously
    killed animals are cut into long strips.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The corpse is held upright against a house beam, incisions are made in both
    heels, putrid liquid is collected in earthen pots, and the remaining body is strapped
    to the beam.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage mentions a belief about a worm supposed to come from the corpse
    but says it will be treated elsewhere.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the entrance of almost every Sihanaka village, tall slender tree trunks
    are fixed in the ground and rise about thirty to fifty feet.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Forked tree pieces are fixed to the tops of the poles, with sharpened points
    resembling a large pair of horns.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The memorial poles are erected by children of deceased persons, who fetch
    hard durable wood from the forest.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Clusters of shorter poles often bear skulls and horns of bullocks; one village
    is said to be named Marosalazana, meaning “Many poles,” because of such a group
    at its entrance.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: Small tin trunks or property of the deceased, including mats and baskets,
    are placed near the poles on a fork or wooden railing.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: The narrator explains this placement as probably connected with an idea that
    objects belonging to the dead should not be used.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Sihanaka mourning ceremonies often continue for a week, with men and women
    in the house weeping, singing funeral chants, and playing music.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: One man goes around the house chanting a dirge, and those inside the house
    answer him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The mourning includes drinking spirits, eating beef, and killing oxen every
    evening; on the first day of watching the corpse, many oxen are speared.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The heads of the killed oxen are set on poles near the grave.
  category: object
  evidence_refs:
  - ev:5
- id: obs:16
  text: On the funeral day, oxen are placed along the route of the corpse, speared
    one after another as it approaches, and laid on the ground for the corpse-bearers
    to step over.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: The passage states that the Hovas formerly observed a comparable custom, especially
    for royal funerals, killing bulls and some of the sovereign’s finest horses.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:18
  text: For the Betsimisaraka and other eastern tribes, the passage states that certain
    customs show connection with Polynesian practices of placing corpses on open stages
    or frameworks rather than burying them.
  category: relationship
  evidence_refs:
  - ev:7
