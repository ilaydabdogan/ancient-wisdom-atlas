    holes, stones, torches, and lamps. It next introduces biblical symbolic acts used
    by prophets and false prophets, and begins a Malagasy historical example in which
    the King of Imerina sends a messenger to a southern central chief, saying that
    the chief is his son, a Malagasy expression for subordination.
