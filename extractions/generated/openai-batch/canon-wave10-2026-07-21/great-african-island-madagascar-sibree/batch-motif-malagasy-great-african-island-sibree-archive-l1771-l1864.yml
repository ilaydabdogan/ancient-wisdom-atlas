canonical_text:
  quote: ''
  summary: 'The passage surveys volcanic features in Madagascar: old crater piles
    and lava flows, a vague local tradition that ancestors saw flames bursting forth,
    coastal lava entering the sea, a marshy Antsihanaka depression interpreted as
    caused by subterranean force, and the Mandritsara valley described as a deep elongated
    pit with a Dantean visual analogy. It concludes that igneous action strongly shaped
    Madagascar and neighboring island groups.'
  language: English
  quote_policy: summarized
