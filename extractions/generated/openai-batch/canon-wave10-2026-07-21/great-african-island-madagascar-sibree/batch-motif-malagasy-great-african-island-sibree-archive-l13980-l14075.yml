candidate_motifs:
- id: motif:1
  label: death-house abandonment or avoidance
  taxonomy_refs: []
  basis: The passage reports leaving, destroying, or fleeing dwellings connected with
    death among several groups.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives limited explanation and uses outsider ethnographic terminology.
- id: motif:2
  label: provision of fire for the dead
  taxonomy_refs: []
  basis: Fire is carried to the grave and placed at the headstone so the dead person
    may get fire if cold.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not describe a broader afterlife geography or journey.
- id: motif:3
  label: post-burial accusation of a bewitcher
  taxonomy_refs: []
  basis: A tomb-side adjuration calls on the deceased to expose the person who bewitched
    them, with communal participation.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage reports the formula but not the full ritual context.
- id: motif:4
  label: removal of dangerous or liminal illness from the village
  taxonomy_refs: []
  basis: The seriously ill or insensible are removed from village space, either to
    a hidden place or to a forest associated with the dead.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The Sihanaka and Tanala accounts differ sharply in severity and outcome.
- id: motif:5
  label: return from death-place punished by killing
  taxonomy_refs: []
  basis: The southern Tanala account says insensible relatives placed in the forest
    are stoned and killed if they revive and return to the village.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: This is reported as a custom in a missionary ethnographic text and is
    not framed as mythic resurrection.
- id: motif:6
  label: divinatory object exposes a witch through bodily sign
  taxonomy_refs: []
  basis: Black sand placed on a corpse is believed to make the bewitcher go naked,
    marking the accused within a month.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not identify the oracle method beyond mentioning consultation.
- id: motif:7
  label: nocturnal sorcerer with inverted or displaced clothing
  taxonomy_refs: []
  basis: Witchcraft practitioners are described as going naked at night while carrying
    the outer dress on the head.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The description is filtered through the author and linked to accusations
    of witchcraft.
- id: motif:8
  label: malefic symbolic bundle at the victim's threshold
  taxonomy_refs: []
  basis: A basket of symbolic ingredients is laid at a person's door or window to
    betoken evil or injury.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: Only one detailed example is supplied.
- id: motif:9
  label: multipurpose charm for harm, protection, love, battle, and benefit
  taxonomy_refs: []
  basis: Ody charms are described as used for love, danger, malignant aims, pre-battle
