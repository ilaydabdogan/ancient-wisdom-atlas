canonical_text:
  quote: ''
  summary: The passage describes reported Malagasy death customs, illness-related
    exclusions, witchcraft accusations, divination, sorcery practices, and charms
    among Sihanaka, Sakalava, Eara, Tanala, Bara, and east-coast groups. It includes
    deserted houses after death, fire placed for the dead, tomb adjurations against
    bewitchers, secret removal of the seriously ill, casting away and killing revived
    insensible relatives, black-sand divination for sudden death, nocturnal naked
    sorcery, and harmful or protective ody charms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sihanaka are described as leaving a dwelling after a death and allowing
    it to decay, calling such deserted dwellings trano foloka, or broken houses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts the Sihanaka practice with the Sakalava, who are said
    to pull down the house or leave the village, and notes that a similar notion is
    found among the Eara.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When taking a corpse to the grave, the Sihanaka are said to carry an earthen
    dish of burning cowdung on a man's head and place it at the headstone so the dead
    person may get fire if cold.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After a corpse is placed in the grave, a man knocks on the tomb door or covering
    stone and calls on the deceased to expose whoever bewitched them; the gathered
    people join the adjuration.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A seriously ill Sihanaka person is said to be secretly removed from the village
    to an out-of-the-way place, where only nurses may see the person.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Among the southern Tanala, insensible ill relatives are said to be placed
    in the forest where the dead are thrown; if they revive and return, they are stoned
    and killed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Tanala term sudden death fola-manta, described as broken-unripe, and such
    deaths are ascribed to witchcraft.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: For sudden death, a diviner consults an oracle and places wrapped black sand
    on the corpse's head with words about a person caught carrying his cloth within
    a month.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The black sand is believed to make the bewitcher go about naked; if a person
    is caught in such practices during the month, he is killed.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Practitioners of witchcraft are described as going naked by night with the
    outer dress carried on the head, and sorcerers are said to dance on tombs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A harmful charm could be laid at a person's door in a basket containing small
    articles, each with symbolic meaning.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: One described harmful charm basket contained death stones, a burned hole indicating
    calamity by fire, hedgehog bristles, parts of scorpions or centipedes, hair, grave
    earth, and other ingredients.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Charms called ody are described as used for many purposes, including exhilaration
    in sorrow or danger, love, malign injury, victory before battle, protection from
    evils, and procurement of benefits.
  category: object
  evidence_refs:
  - ev:9
