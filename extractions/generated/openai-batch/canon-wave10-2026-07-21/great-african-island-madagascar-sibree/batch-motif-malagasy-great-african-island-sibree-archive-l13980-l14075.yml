  cautions: The passage groups many local uses under one broad charm category.
comparison_claims:
- id: claim:1
  claim: The passage itself presents Sihanaka, Sakalava, and Eara practices as related
    forms of death-associated house avoidance, while noting different concrete actions.
  claim_level: same_motif
  target: death-house abandonment, destruction, or fleeing among Sihanaka, Sakalava,
    and Eara
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The Eara comparison is brief, and the passage does not fully explain
    the underlying belief for each group.
- id: claim:2
  claim: The Sihanaka and southern Tanala illness practices share a function of removing
    the seriously ill or insensible from normal village visibility, but the Tanala
    account adds a forest of the dead and killing if the person returns.
  claim_level: same_function
  target: illness removal or exclusion in Sihanaka and southern Tanala accounts
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not explicitly state that the two customs have the
    same rationale.
- id: claim:3
  claim: The passage describes ody charm use as extending beyond a single group, mentioning
    widespread practice outside Christianised areas and among Bara, Tanala, and east-coast
    tribes.
  claim_level: same_function
  target: cross-regional Malagasy use of ody charms for protection, harm, and benefit
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The line range ends during the list of groups, and the passage gives
    only a general cross-regional statement.
