  quote: ''
  summary: The passage surveys birds of prey, crows, and water-birds in Madagascar.
    It records that Malagasy people regard owls as birds of evil omen, while a hawk
    called vdromahery, glossed as “strong bird,” functions as a crest or national
    emblem for the Hova Government and appears as a large figure on royal palaces
    in Antananarivo. The remainder describes abundant hawks, crows, marsh and lake
    birds, and named water-bird species across several regions.
