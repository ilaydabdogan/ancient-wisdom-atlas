  summary: The passage describes Malagasy and Sakalava practices of avoiding words
    that sound like the names of sovereigns or chiefs, resulting in replacement terms
    and dialect change. It also notes obsolete vocabulary connected with divination
    and idol-worship, likening an old dictionary to a museum of religious relics,
    and describes French and English loanwords as evidence of European influence on
    Malagasy speech.
