  summary: The passage describes Malagasy improvised eating utensils; customs of nose-rubbing,
    kissing, handshaking, and older foot-kissing; tattooing and other forms of bodily
    adornment among Hova, Betsileo, southern, and forest groups; dental coloring or
    whitening practices; and the opening of a discussion of hair-dressing.
  language: English
  quote_policy: summarized
