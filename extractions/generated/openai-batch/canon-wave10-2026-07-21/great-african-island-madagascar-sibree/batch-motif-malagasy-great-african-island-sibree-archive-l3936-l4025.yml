literal_observations:
- id: obs:1
  text: On the eastern coast, long pieces of bamboo serve as household waterpots because
    the soil is unsuitable for earthen vessels.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Boys in the interior and on the eastern coast use fine bamboo as blow-guns
    for killing small birds and animals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bamboo is used for snuff-boxes and for musical instruments, including fifes
    and flutes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: On some rivers of the south-eastern coast, a bamboo raft called a zdhitra
    is described as the only means of crossing where there are no canoes.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The described zdhitra consists of about thirty or forty bamboo pieces, ten
    to twelve feet long, lashed at the head with creeper and spreading like a fan
    at the stern.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: When loaded, the zdhitra is partly under water; the narrator and companion
    cross safely but get wet, and later the raft comes apart so that bearers swim
    ashore from the scattered bamboos.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A prickly bamboo called bdrardta grows in the interior and western coast,
    especially along the Ikiopa and Betsiboka rivers, and is used for building after
    its prickly leaves are removed.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: A gigantic arum called xia grows in dense masses in water along eastern riverbanks;
    its fruit and root are edible when cooked.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The baobab on western Madagascar is called hontona and also mdfom-hdriha,
    glossed as monkey's bread, because lemurs eat its small fruit.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The tamarind grows to great size on western riverbanks; the narrator describes
    encamping beneath a large tamarind during a canoe voyage down the Ikiopa.
  category: action
  evidence_refs:
  - ev:6
