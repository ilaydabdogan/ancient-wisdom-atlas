  quote: ''
  summary: The passage describes Malagasy uses of bamboo for music, water vessels,
    blow-guns, snuff-boxes, flutes, raft transport, and building, then describes prickly
    bamboo, giant arum, baobab, and tamarind trees along rivers and coasts of Madagascar.
    It includes a first-person account of crossing the Matitanana on an unstable bamboo
    raft.
