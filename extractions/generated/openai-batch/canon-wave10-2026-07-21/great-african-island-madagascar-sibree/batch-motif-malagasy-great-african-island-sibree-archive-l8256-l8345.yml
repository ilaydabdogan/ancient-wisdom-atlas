canonical_text:
  quote: "“the name stands for the person it represents”"
  summary: 'The passage describes Malagasy naming practices: personal names may come
    from animal words; fathers and sometimes mothers may take names meaning father
    or mother of a child; adoptive and extended kin may be treated similarly; offensive
    or ugly names and anti-praise are used to avert envy or the evil eye; chiefly
    and royal names are treated as taboo or sacred; and names are linked to personal
    presence, status, influence, and fame.'
  language: English
  quote_policy: quoted
literal_observations:
