  text: A mother may also, though less commonly, take a name meaning “mother of” the
    child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: People without children may change their names in this way when they adopt
    relatives’ children.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Brothers’ and sisters’ children are described as being considered almost the
    same as one’s own children, and uncles and aunts are constantly called fathers
