canonical_text:
  quote: ''
  summary: The passage discusses foreign admixture among Malagasy groups, especially
    in Imerina and among western and northern peoples called Sakalavas. It describes
    conquest-related enslavement, endogamous rank and clan practices, Arab settlement,
    Indian trading presence, Muslim town features, mainland African slave importation
    by dhow, emancipation by the Hova government, and visible regional differences
    in colour and physique.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Hovas of Imerina the author describes only slight extra-Malagasy
    admixture, while noting that some upper and well-to-do people appear especially
    light-skinned and European-like to him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: During Hova conquests in the first half of the nineteenth century, many women
    and children of conquered tribes were brought back to the capital region, and
    their descendants are described as forming a large part of the slave population.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says free people do not intermarry with slaves, debt-slaves marry
    among themselves, nobles generally marry within their rank, and tribes and families
    often marry internally to preserve landed property and clan feeling.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The western and northern peoples loosely called Sakalavas are said to have
    three foreign elements among them: Arab, Indian, and African.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Arab immigrants are described as having long-standing intercourse with Madagascar,
    with some settlement over many centuries, while often remaining distinct from
    the native population and intermarrying little except with heiresses or high-ranking
    women.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Banyan traders from Kutch and Bombay are said to be present in north-west
    coastal towns, where Indian dress, ornaments, utensils, music, customs, Muslim
    worship, stone houses, mosques, and the muezzin call are observed.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: An African element is described as deriving from mainland slaves brought by
    Arab slaving dhows; recent emancipation by the Hova government is expected to
    reduce this traffic, though the coast’s bays and inlets may allow dhows to evade
    English cruisers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The author states that travellers in Madagascar observe considerable differences
    in colour, facial outline, profile, and stature among the people encountered across
    the country.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: A footnote raises a speculative question about whether the Malagasy name for
    Arabs, printed as Saliima, is derived from the salutation salama and compares
    this with Hebrew shalom.
  category: speech
  evidence_refs:
  - ev:9
