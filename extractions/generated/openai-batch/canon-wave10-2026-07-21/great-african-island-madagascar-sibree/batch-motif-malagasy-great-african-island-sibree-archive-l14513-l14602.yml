canonical_text:
  quote: ''
  summary: 'The passage describes Malagasy sacrifices and related rites: animal offerings
    with fat, blood, burning, eating, anointing, and water sprinkling; royal ancestor
    rites; named types of thanksgiving and benefit-seeking offerings; former human
    sacrifices in one district; faditra expiatory offerings that transfer or remove
    evils; a failed blood ritual advised by a diviner; and a proposed human sacrifice
    at the setting of a royal palace corner-post.'
  language: English
  quote_policy: summarized
