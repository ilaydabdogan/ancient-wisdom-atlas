  summary: The passage gives an ethnographic description of slavery and social ranks
    in central Madagascar. It distinguishes three slave classes, describes their origins,
    notes customs of attendants and burden-bearing, and introduces the Hovas as free
    commoners organized by clans with restricted intermarriage.
  language: English
  quote_policy: summarized
