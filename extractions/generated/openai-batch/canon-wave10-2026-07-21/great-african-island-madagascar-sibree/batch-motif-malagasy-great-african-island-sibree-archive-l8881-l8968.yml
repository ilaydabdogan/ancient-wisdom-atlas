- id: obs:3
  text: 'The slave population is divided into three named classes: Zaza-Hova, Andevo,
    and Mozambiques.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Zaza-Hova are described as of the same stock as the Hovas, with enslavement
    traced to debt, political punishment, crimes, or family punishment under earlier
    laws.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Andevo are described as the largest slave division and chiefly descendants
