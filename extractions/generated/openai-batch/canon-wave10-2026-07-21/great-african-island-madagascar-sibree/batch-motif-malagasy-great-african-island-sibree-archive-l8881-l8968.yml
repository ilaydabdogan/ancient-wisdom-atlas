  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says free Malagasy people would not normally go abroad without
    at least one follower, and that Malagasy acquaintances may escort Europeans who
    are walking alone.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says a respectable Malagasy person would have a slave boy or girl
    carry a small article such as a Bible or hymn-book.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that seniority is respected, so when two enslaved brothers
    travel, the younger one carries the burden as far as his strength allows.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Hovas are described as commoners and free people, subdivided into tribes
    and clans that seldom intermarry; cousins who are children of brothers often marry
    to keep property from dispersing.
  category: relationship
  evidence_refs:
  - ev:7
