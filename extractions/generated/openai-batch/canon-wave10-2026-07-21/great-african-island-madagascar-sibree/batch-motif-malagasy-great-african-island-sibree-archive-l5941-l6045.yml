  summary: The passage discusses how traditions and philology may illuminate Malagasy
    origins. It says Hova tradition points to ancestors entering the central province
    from the east coast. A native history lists Hova rulers but says earliest accounts
    are obscure and mixed with fabulous legends, including a story that some chiefs
    originated from a son of God cast down to earth to play with the Vazimba. The
    passage also summarizes arguments about Arabic astral terminology and wider Malayo-Polynesian
    linguistic affinities.
