- id: obs:3
  text: The Betsimisaraka and Bezanozano are described as not burying their dead underground,
    but enclosing them in wooden coffins exposed on mounds or trestles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: People near the head of Antongil Bay put the dead in rude tree-trunk coffins
    arranged in order, usually in obscure shaded woods or forest areas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Among Tanala or forest tribes near Ivohitrosa, the corpse of a person of importance
    is kept for a month before burial, with the face exposed for three days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The important person's body is covered with a red cloth, silver is placed
    in the mouth, and rings are put on the hands but not on the feet.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The corpse is watched for a month while fat is burned to counter the smell.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The burial procession is accompanied by gunfire and loud wailing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: At the grave, a man addresses the spirits of the dead already buried there,
    saying that they have received this one and must not follow his descendants, grandchildren,
    or brothers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: A king's corpse is buried on the day of death, his death is not publicly announced,
    and broken guns are placed with the corpse.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: An image of the king is made, covered with cloth, and hung in the east corner
    of the house.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: The heads of the king's wife and children are shaved.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: After six weeks the king's image is thrown into the River Matitanana, followed
    by customs like those used in the burial of a subject.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:14
  text: Every ox in the kingdom that bellows at that time is killed for the benefit
    of those burying the image.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: The royal corpse is buried in a wooden house in the forest, in a nato-wood
