canonical_text:
  quote: ''
  summary: The passage describes Malagasy beliefs about animal omens, animal fables,
    several fabulous beasts, dangerous serpents, and the Fanany, a creature associated
    with noble corpses and treated as an embodiment of the dead person's spirit that
    can become a guardian deity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bird is described as an evil omen; if its droppings fall on a person's head,
    that person is watched as certain to die, mourned, and oxen are killed to ward
    off the death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A fowl laying an unusually large egg is regarded as ominous of extraordinary
    good or evil, while an unusually small egg is feared as foreboding evil.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A small insect attacking young rice plants is called “God's lamb” and is regarded
    as an instrument of divine anger for human wickedness.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Malagasy animal and bird fables are numerous and include
    conversations between paired animals, giving reasons for their habits, likes,
    and dislikes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Songomby is described as ox-sized, extremely swift, and addicted to human
    flesh.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Tokandia or Tokantongotra is described as single-footed, with joined forelegs
    and joined hind legs, two feet in all, incredibly swift, man-eating, and nocturnal.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Lalomena is described as ox-sized, red-horned, and living in water.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage mentions strange serpents of marvellous power and notes a western-island
    boa said to drop from trees onto oxen and passing travellers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Fanany, also called the Fanany with Seven Heads, is variously described
    as a lizard, worm, and serpent, and is believed to come from the corpse of people
    of noble blood as an embodiment of their spirits.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the described burial practice, pots containing liquid from a noble corpse
    are preserved until a small worm appears; the corpse is not buried until this
    happens.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the worm grows, the corpse may be buried; the earthen pot with the worm
    is placed in the grave with a long bamboo reaching to the outside air.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After six or eight months, the worm is said to climb the prepared path into
    the village, appear like a lizard, and be called Fanany.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Relatives question the Fanany and treat the lifting of its head as a correct
    answer identifying it with the deceased.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The relatives further test the Fanany by placing blood from an ox's ear and
    rum in the plate from which the deceased ate their last meal; drinking these liquids
    is taken as confirming its identity.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Fanany steps on a clean cloth, is carried into the village with feasting
    and rejoicing, and is then returned to the tomb, where it is said to remain, become
    a guardian deity, and grow enormously.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Richardson is reported as saying he had not seen the Fanany itself but knew
    that the bamboo and earthen pot were arranged in the tomb as described.
  category: other
  evidence_refs:
  - ev:8
