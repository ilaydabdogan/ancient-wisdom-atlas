  text: Short hair with a slight tuft or topknot over the forehead is described as
    the mark of the military class, while civilians are described as wearing plaited
    hair.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hova women's hair is described as long, straight, glossy, and black; hair
