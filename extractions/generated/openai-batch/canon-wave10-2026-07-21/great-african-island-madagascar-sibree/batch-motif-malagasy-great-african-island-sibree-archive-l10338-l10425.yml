- id: obs:1
  text: A ruler named in the passage as Ead^ma adopted English military tactics, cut
    his hair short, and ordered officers and soldiers to do the same.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women of the capital assembled in large numbers to protest the king's hair
