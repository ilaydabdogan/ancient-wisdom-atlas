  quote: ''
  summary: 'The passage describes Malagasy hair-dressing practices and social meanings:
    a royal order requiring military short hair, women''s protest and punishment,
    hair as a military/civilian marker, Hova women''s braiding methods, mourning and
    royal-death shaving, festive first hair-cutting for children, regional coiffure
    styles, hair ornaments or containers, and Bara waxed hair knots.'
