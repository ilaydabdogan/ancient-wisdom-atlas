canonical_text:
  quote: ''
  summary: 'Ethnographic description of Betsileo tomb forms and funeral customs: roadside
    cube tombs, upright memorial stones, hollow tombs with trees, deep subterranean
    burial chambers approached by tunnels, large slab tombs, memorial stones, ox skull
    displays, and selected rites at the funeral of a noble child.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Roadside Betsileo tombs are described as plain square or almost cubic piles
    made of thin undressed stones laid evenly.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the road toward Ambohinambourina, the narrator reports many tombs and carved
    monuments, including upright memorial stones of hard white granite, often appearing
    in couples and sometimes with a carved post between them.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: South of the Matsiatra river, upright memorial stones and carved wood pillars
    are rare or absent, while numerous plain cube tombs occur.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Many hollow cube tombs have dracaena, mimosa, and other trees growing out
    of a circular opening in the center and overshadowing the tomb.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The burial chamber is described as excavated deep below the square stone pile,
    and a long low mound marks a tunnel-like descending passage from the surface to
    the chamber.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Richardson reports that some Betsileo tombs are as much as sixty feet deep
    and are approached by a gradually descending passage opening forty or fifty feet
    from the tomb.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some rich tombs are described as surface structures made from five immense
    stone slabs forming four walls and a roof.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some tombs have skulls of oxen killed at the funeral arranged on the cornice;
    examples with 500 skulls and with 108 skulls on an outer square are reported.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the funeral of a child of noble birth, two oxen are first wrestled with
    and thrown down before being killed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the first blood is drawn from the oxen, a portion is taken to the child's
    grandfather to taste.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Women carrying the deceased child's property enter the house by the south
    door and leave by the west door during the proceedings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The corpse is placed in a long box covered with colored cloth and furnished
    with a roof-like top.
  category: object
  evidence_refs:
  - ev:7
