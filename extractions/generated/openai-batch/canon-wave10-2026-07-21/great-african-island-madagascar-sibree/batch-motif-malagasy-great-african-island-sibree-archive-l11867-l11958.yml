canonical_text:
  quote: ''
  summary: The passage explains Malagasy kinship terminology for parents, children,
    adoption, fosterage, posterity, and childlessness. It notes terms that extend
    parent-child language to elders and political authority, terms for girls and children,
    adoption and inheritance practices, a levirate-like marriage practice to preserve
    a childless elder brother's descendants, and symbolic expressions involving water,
    spindle work, suckling, and the eye.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The compound phrase meaning “father together with mother” is applied to superiors,
    elders, or patrons, and is also used reciprocally between sovereign and people
    as a title of respect.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An early Malagasy Scripture translation reportedly used the compound parent
    phrase for the Fifth Commandment, leading at least once to a sermon interpreting
    it as a command to honor government and great people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Sakalava dialect, the word for man is said to correspond in Hova to
    chief, president, or governor, while the word for woman is said in Hova to mean
    brooding over, like a bird over young.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The word for child is used broadly for biological children, step-children,
    nephews, nieces, and younger persons addressed or spoken of.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Terms distinguish son, daughter, boy, girl, and an only-child girl called
    by a compound glossed as “male-female.”
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A child dying under two years of age is called by the word for water, which
    is also used figuratively for something soft and delicate.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: In many tribes a girl is called “spindle-child,” and the passage states that
    every Malagasy woman can spin and weave.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Adoption of relatives' children is described as common and is named by a phrase
    literally glossed as “raising up children.”
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Children of near relatives united by adoption may be treated as children of
    the same parents and inherit equally.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Dying without posterity is described as a great calamity and is termed “dead
    as regards the eye.”
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: If an elder brother dies childless, the next brother is said to be required
    to marry the widow to keep the elder brother in remembrance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Children from such a marriage are considered the elder brother's heirs and
    descendants.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The brother who preserves heirs for the elder brother is described by a phrase
    glossed as “make to live the eye.”
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: A marriage benediction wishes numerous offspring and descendants; other terms
    name the youngest child, the last child when the mother is pregnant again, a foster-child
    as “suckling together with,” and unnamed children.
  category: speech
  evidence_refs:
  - ev:7
