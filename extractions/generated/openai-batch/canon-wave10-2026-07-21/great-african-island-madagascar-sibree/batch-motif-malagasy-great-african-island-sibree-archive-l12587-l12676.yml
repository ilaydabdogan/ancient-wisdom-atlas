  summary: 'The passage describes decorative arts among the Hova: church wall and
    window ornament, geometric wall-painting behind a pulpit, woven and beaded lambas,
    silverwork, plaited mats and baskets, and a brief comparison of a Hova church
    painting with medieval English church wall-painting.'
