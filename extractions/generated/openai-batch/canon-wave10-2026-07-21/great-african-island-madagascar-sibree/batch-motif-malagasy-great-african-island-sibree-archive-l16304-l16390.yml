canonical_text:
  quote: "“two communion services going on at one time in the church”"
  summary: The missionary author describes church divisions in Madagascar around the
    Lord's Supper. In one village, a disputed pastor election led rival parties to
    hold simultaneous communion services with separate bread and wine. In another
    village, an excluded man was encouraged to take the communion bread by force,
    so the table had to be literally fenced. The author calls these exceptional cases
    and compares them with Corinthian and apostolic church abuses, while also comparing
    orderly Malagasy communion services with early Christian eucharistic practice
    described by Justin Martyr. The passage ends by noting native deacons directing
    congregational behavior during worship.
  language: English
  quote_policy: quoted
