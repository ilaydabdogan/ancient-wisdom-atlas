  quote: '"came from across the ocean, they were not natives of Madagascar."'
  summary: The passage reports traditions that some chiefs and ruling clans in south-eastern
    and eastern Madagascar descend from settlers from across the ocean, especially
    Arabs. It describes a hollow soap-stone elephant at Ambohisary, said to have been
    brought from Imaka, possibly Mecca, by Ramania, ancestor of the Zafiramania. The
    author also discusses claims of descent from Abraham, Arabic books and vocabulary,
    and cautions about the degree to which physical or linguistic differences confirm
    these descent traditions.
  language: English
