canonical_text:
  quote: ''
  summary: 'The passage describes the usual interior arrangement of a Hova house:
    polite entry at a raised threshold, domestic objects for rice preparation and
    water storage, a hearth with cooking stones and fire, animal spaces, smoke-blackened
    roofing, and a north-east corner identified as sacred, where former religious
    acts were performed and a household charm was kept.'
