literal_observations:
- id: obs:1
  text: On the morning after the preceding observances, oxen of the people are blessed
    and an unblemished ox is killed for the sovereign.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sovereign eats part of the roasted ox near the royal ancestors' tombs
    while invoking a blessing, and a small portion of rice is placed on the head with
    a blessing formula naming God the Creator.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sovereign, royal family, and heads of the royal clans enter the chief
    palace and eat together.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A red-and-white ox is killed at both Ambohimanga and Antananarivo; at Antananarivo
    the sovereign kills the animal in person, and at Ambohimanga a member of the royal
    family kills it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Ambohimanga, the sovereign and court feast, eat the special food named
    in the text, and offer prayer at the tombs of the royal ancestors.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A rush dipped in ox blood is placed at the door of the royal tomb-houses,
    and the hump is deposited inside the house.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Before the public feast, people are forbidden on pain of death to kill animals
