  evidence_refs:
  - ev:3
- id: obs:8
  text: Festival regulations require fat for royal soap factories, hides for soldiers'
    equipment, a small poll-tax, and the royal rump-share of each slaughtered ox.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: If someone dies during the first days of the month, mourning and full funeral
