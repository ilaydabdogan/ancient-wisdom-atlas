  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Friends, parents, and superiors are visited, small pieces of money are given
    as substitutes for preserved meat, and good wishes and benedictions are exchanged.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Small fires called harendrina are lit at dusk on the two evenings before the
    royal bathing; the first evening is for the sovereign and the second for the people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Children carry and wave bundles of dry grass fixed to bamboo poles as lights,
