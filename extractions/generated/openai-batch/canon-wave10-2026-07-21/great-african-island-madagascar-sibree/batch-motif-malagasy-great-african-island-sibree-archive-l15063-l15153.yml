  quote: ''
  summary: The passage describes Fandroana observances involving the sovereign, royal
    ancestors' tombs, ox-killing, feasting, public regulations, visiting, benedictions,
    dusk fires carried by children, mourning for the dead at the new year, household
    bathing with water placed on the head, and temporary social obligations for slaves
    and spouses.
  language: English
