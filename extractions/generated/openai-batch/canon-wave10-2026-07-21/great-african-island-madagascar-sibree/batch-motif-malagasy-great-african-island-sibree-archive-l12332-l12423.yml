canonical_text:
  quote: ''
  summary: The passage describes a Sihanaka widowhood custom in which a widow of a
    man of wealth or position is dressed in finery for the funeral, then reviled,
    blamed through the idea of stronger fate, stripped, given coarse and broken utensils,
    confined under a mat, restricted in speech and washing, and kept in mourning for
    months or a year before returning to her kin only after divorce by her husband's
    family. It also records Malagasy kinship terms and proverbs, notes recent Christian-influenced
    changes in marriage and morals, and describes Hova class and clan restrictions
    on intermarriage, including a rule that a free man must redeem a slave woman before
    marrying her and that she remains free after divorce.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Sihanaka, when a man of position or wealth dies, his wife is placed
    in the house on the funeral day dressed in her best clothes and silver ornaments
    until the family returns from the tomb.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On returning from the tomb, the family reviles the widow and says her vintana,
    or fate, was stronger than her husband's and that she is virtually the cause of
    his death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The family strips the widow of her clothes and violently removes ornaments
    from her ears, neck, and arms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The widow is given a coarse cloth, a broken-handled spoon, and a dish with
    the foot broken off for eating.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The widow's hair is dishevelled, she is covered with a coarse mat, remains
    under it all day, leaves only at night, and may not speak to people entering the
    house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The widow is not allowed to wash her face or hands, except the tips of her
    fingers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The described widowhood treatment may last a year or at least eight months,
    and the widow may not go to her own relations until divorced by her husband's
    family.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The word havana is described as meaning strictly 'relative' but also being
    used broadly for friends and acquaintances.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A proverb says a person is a relative while patsa last, but becomes a distant
    relative when the patsa are eaten.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Havan-tsi-aina, literally 'a relative without life,' is used for an unkind
    relation; atin-kavana or ati-havana is used for near relations or consanguinity.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that Christian influence in the central provinces has raised
    the estimation of marriage, reduced divorce, and brought polygamy nearly to an
    end.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Hova population is described as divided into nobles, Hova commoners, and
    slaves, with these classes generally unable to intermarry.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Nobles are divided into six clans; the sovereign can take a wife from the
    third clan, and some noble ranks have limited intermarriage rules with inferior
    ranks or commoners.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: Hova commoners are subdivided into tribes, clans, and families that usually
    do not intermarry with one another but keep to their own clan and often their
    own family.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: A free man cannot marry a slave woman except by redeeming her first; if he
    divorces her, she continues free.
  category: sequence
  evidence_refs:
  - ev:12
