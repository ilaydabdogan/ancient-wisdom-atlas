  summary: The passage opens a chapter on Malagasy personal, tribal, and geographical
    names. It describes long compound personal names as meaningful units, notes shorter
    names and combinations, states that Madagascar has tribal but not family names,
    and explains several prefixes used to form proper names or respectful forms. It
    also notes that ordinary words, including names of animals, plants, actions, and
    objects, may become proper names with these prefixes.
