canonical_text:
  quote: ''
  summary: The passage describes Salamanga, a Betsileo and southern Malagasy ritual
    intended to cause an evil spirit possessing a sick person to leave the body. Under
    a diviner’s direction, horn-like wooden objects and a forked branch are placed
    at the house, household charms and a dollar are set on a rice-mortar, the sick
    person is seated and dressed ornamentally, and villagers perform music, clapping,
    singing, and dancing to drive the spirit into a dancer. A note adds Bezanozano
    practices involving a bitter creeper cooked for a young heir at a funeral, and
    breaking the gable-ridge horns of the house after a person of consequence dies.
  language: English
  quote_policy: summarized
