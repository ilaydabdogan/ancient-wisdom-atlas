canonical_text:
  quote: ''
  summary: The passage describes clothing and ornamentation among forest tribes and
    south-east coast groups, including upper-class women’s bead and metal ornaments,
    poorer women’s mat clothing, and a child-protecting back mat called Idndo. It
    then describes a highly ornamented girl in the Matitanana valley. A weapons section
    lists spears, shields, bows, arrows, bamboo blowguns, slings, and iron-smelting
    equipment, and reports a tradition in which Andriamanelo’s iron spears defeated
    the Vazimba, who lacked iron weapons and called the new weapons “flying iron.”
  language: English
  quote_policy: summarized
