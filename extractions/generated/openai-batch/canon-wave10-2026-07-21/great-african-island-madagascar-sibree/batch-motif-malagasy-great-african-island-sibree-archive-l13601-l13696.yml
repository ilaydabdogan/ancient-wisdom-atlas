canonical_text:
  quote: ''
  summary: 'The passage describes the deadly tangena ordeal, its abolition and continued
    belief in it, then outlines several Tanala or related ordeals: a Creator''s ordeal
    using boiling water and suspended quartz stones, a crocodile river ordeal, the
    Koddo ceremony with hair-cutting, signs of guilt, lightning, and water-lustration,
    and the Vokoka drink of water mixed with earth from a former sovereign''s tomb
    as a test of allegiance. It ends by introducing another former Imerina ordeal
    concerning children born in Alakaosy, without giving the details in this excerpt.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tangena ordeal is described as causing great mortality, sometimes when
    whole villages took it, and as a destructive practice with an appearance of fair
    dealing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some people who had taken the tangena during persecution of Christianity were
    watched after pieces of skin had been rejected and could have been killed if they
    spat out the poison's bitter taste.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The text states that the tangena ordeal was abolished by the Anglo-Malagasy
    treaty of 1865 in areas under Hova authority, but belief in it persisted and a
    nearby village used it during an epidemic in April 1878, causing several deaths
    before government punishment followed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Among the Tanala or forest tribes, other ordeals were in use, and two were
    called tangena with another word added.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Tangena-Janahary, or Creator's ordeal, water is boiled in a pot and
    quartz pieces called 'living stones' are suspended in the water without touching
    the bottom.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The accused must remove the stone with the palm, place it in cold water, and
    then be watched until the next day for blistering.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the accused first declares his own hand unblistered, he is counted guilty;
    if others declare the unblistered hand, he is declared innocent and his accuser
    must give him one slave.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the crocodile ordeal, the suspected person is taken to a river containing
    many crocodiles while the people assemble.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: A man stands behind the accused, strikes the water three times, and addresses
    the crocodiles, asking them to show whether the culprit is guilty or not.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The accused must swim across the river and back; if he is not hurt, the accusers
    are fined four oxen divided between the swimmer, king, and councillors.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the Koddo ceremony, the accused is set on a rice-mortar and made to mutter
    while a man with a large stick approaches.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The man strikes the earth three times, cuts the accused person's hair three
    times, throws the hair to God, and invokes God to show guilt or innocence by signs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Signs of guilt in Koddo are said to include trembling, purging, vomiting,
    and sometimes later lightning striking the guilty person's house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: If a guilty person finds favor with the judges, they invoke God's mercy and
    purify him by lustration; if innocent, he is sprinkled with water in which silver
    rings have stood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The Vokoka is described as water mixed with earth from the tomb of a former
    sovereign, drunk as a test of allegiance and regarded as a kind of ordeal.
  category: object
  evidence_refs:
  - ev:6
- id: obs:16
  text: The passage begins to mention another former Imerina ordeal concerning children
    born in the month of Alakaosy, but the excerpt stops before describing it.
  category: other
  evidence_refs:
  - ev:7
