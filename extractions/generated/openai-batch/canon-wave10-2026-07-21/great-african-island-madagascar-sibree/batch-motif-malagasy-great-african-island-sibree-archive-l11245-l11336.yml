canonical_text:
  quote: ''
  summary: 'The passage describes Malagasy tombs and burial memorials, including tombs
    called cold or sacred houses, royal grave goods, former Imerina pole displays
    of bullock skulls and horns, basalt memorial slabs, and several Betsileo memorial
    forms at Ikangara: square stone tombs, carved timber railings and posts, granite
    blocks, horned skull displays, tall carved wooden posts, iron-horned granite monuments,
    and smaller ox-skull staging posts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A tomb-house is described as resembling a dwelling-house but lacking a window
    or hearth, and is called both a cold house and a sacred house.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Valuable property is often deposited in such tombs, and the burials of King
    Eadama I. and Queen Rasoherina included costly dress, furniture, other valuables,
    and chests of money.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The royal coffins were made of silver plates formed from hammered dollars,
    with many thousands of dollars placed in the coffin as a bed for the deceased
    sovereign.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: In former times in Imerina, poles near tombs held skulls and horns of bullocks
    killed at funeral feasts; the custom was falling into disuse there but was still
    kept by other tribes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In many places, a massive upright slab of rough undressed basalt is erected
    as a memorial for distinguished personages.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Betsileo people are described as having burial memorials with decorative
    carving on elaborate timber posts over or near graves and, to a lesser extent,
    on massive memorial stones.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Ikangara, the narrator found a grouped collection of about forty or fifty
    tombs and monuments of several kinds.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The largest tombs at Ikangara were square flat-stone structures about twenty
    to twenty-five feet across and about five feet high, surrounded by carved post-and-rail
    fencing with vase-shaped corner tops.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Another tomb type had a square flat-stone structure with a west-side square
    enclosure of carved posts with vase-shaped heads, lintels, an intermediate upright,
    and a central carved post.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: A third monument type was a massive granite block with carved posts at the
    four corners and carved cross-pieces on top that held skulls of funeral bullocks.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Another memorial type was a massive square wooden post about twenty feet high,
    carved on all four sides from top to bottom; in one case a pair stood as if forming
    a gateway.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Another memorial type was an oblong dressed granite block with iron hooping
    around the top, holding a dozen or more pairs of slender iron horns.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: Smaller carved posts with vase-shaped heads and open staging near the top
    held upright sharp-pointed wooden pieces for placing ox-skulls.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: Many memorials were weathered, defaced, falling, or rotting away, while the
    carving showed great variety.
  category: attribute
  evidence_refs:
  - ev:12
