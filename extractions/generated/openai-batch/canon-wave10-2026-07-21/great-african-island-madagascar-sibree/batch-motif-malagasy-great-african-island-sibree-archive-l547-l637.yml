  quote: ''
  summary: 'The passage recounts early European knowledge and discovery accounts of
    Madagascar: Marco Polo’s second-hand description, including the rukh or gigantic
    bird later linked by the author to the extinct Aepyornis; Portuguese voyages around
    Africa and to India; Fernando Soares’s discovery of Madagascar’s east coast in
    1506; Joao Gomez d''Abreu’s discovery and naming of the west coast as San Lorenco;
    Tristan da Cunha’s later coastal visits, charting, and poetic commemoration; and
    additional naming of Cape Natal and landing near the Matitanana River.'
