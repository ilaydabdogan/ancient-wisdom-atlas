canonical_text:
  quote: ''
  summary: The passage describes changing housing, trades, market activity, money
    storage, and handicrafts in and near Antananarivo. It emphasizes Malagasy skill
    in hand production, especially women's spinning, weaving, matting, and basketry,
    and men's metalwork, including silver chains, filigree ornaments, and vases made
    by native workmen after a European model.
  language: English
