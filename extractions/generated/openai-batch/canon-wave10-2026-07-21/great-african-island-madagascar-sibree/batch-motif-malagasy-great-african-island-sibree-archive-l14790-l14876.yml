canonical_text:
  quote: ''
  summary: The passage describes Hova sikidy divination, its alleged Arabic linguistic
    and historical connections, its native attribution to supernatural ancestral transmission,
    its procedure using countable objects and rule-governed grids, its use in daily
    and royal decisions, and offerings prescribed to avert evils identified by the
    oracle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Hovas, divination was called sikidy and is described as holding
    an important place.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that sikidy and several related terms are probably of Arabic
    origin and that divination was probably introduced into Madagascar by Arab settlers
    on the east and west coasts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Native accounts said this form of divination was supernaturally given to ancestors;
    diviners invoked the names of ancients said to have first received and transmitted
    the art.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sikidy is described as a process worked with countable or divisible objects
    such as beans, rice, straw, sand, or similar materials under definite and invariable
    rules.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The process used lines resembling a chess-board, sets of columns, and repeated
    removal of pairs of beans until one or two remained to be placed in a square.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fixed numerical combinations filled further tables, and columns read in different
    directions had special names and meanings used to determine what should be done
    about actual or feared evils.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: People resorted to sikidy in illness, buying and selling, journeys, and fear
    of calamity, and placed implicit belief in its direction as being of divine origin.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The first Queen Ranavalona is said to have used divination for almost every
    action and event, including repeated oracle consultations before an ordinary meal
    of rice.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Offerings called faditra and sorona were made to avert evils identified by
    the sikidy, and these offerings often had verbal or other connections with the
    particular evil.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Examples of averting offerings include a heaven-named herb for evil from heaven,
    a small fish called water-sheep for evil from sheep, and dead-stone for feared
    death.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: For evil whose origin was fire, scarlet songosongo flowers were offered; to
    bring home a distant person, a reed was erected on a mountain according to the
    sikidy instructions.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Hova diviners also practiced casting nativities and were called mpanandro,
    glossed as makers of days.
  category: attribute
  evidence_refs:
  - ev:10
