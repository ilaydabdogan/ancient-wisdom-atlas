canonical_text:
  quote: ''
  summary: The passage argues that Christianity has reduced harsh punishments and
    especially moderated warfare among the Hovas. It contrasts earlier Hova campaigns
    involving killing and enslavement with an 1873 expedition against the S^kaliivas
    in which violence was limited, services were held in the camp, and local people
    reportedly interpreted the gospel as a 'showing of mercy.' It also records the
    Prime Minister's instruction against cruelty and ends with a leaven metaphor for
    gospel influence.
  language: English
