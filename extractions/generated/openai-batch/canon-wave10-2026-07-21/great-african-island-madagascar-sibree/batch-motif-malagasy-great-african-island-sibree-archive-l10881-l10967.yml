canonical_text:
  quote: ''
  summary: 'The passage describes a Malagasy practice of blood-brotherhood, called
    fato-drt in the text, and gives reported variants: a general form in which parties
    share blood taken from the body; Grandidier and Zomena''s famake using ox blood,
    a ritual beverage, weapons, oath-curses, and kinship recognition; a Bara form
    involving blood from belly incisions; and Count de Benyowsky''s allegiance oath
    involving ox blood and mutual blood-sucking from incisions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the Malagasy practice of making brotherhood by partaking
    of each other's blood is termed fato-drt, translated in the passage as “bound
    by blood,” and is found with variations in almost every tribe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated purpose of the covenant is to make participants as brothers, devoted
    to one another's welfare and ready to sacrifice for one another because they have
    become of one blood.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the general ceremony, a small portion of blood is taken from the breast
    or side, mixed with other ingredients, stirred with a spear-point, and swallowed
    by each contracting party.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Imprecations are uttered against persons who violate the solemn engagement.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Grandidier became brother by blood with Zomena, a Tanosy chief in south-west
    Madagascar, to gain his good-will and help in travelling farther inland from the
    Onilahy or St. Augustine River.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Grandidier's reported case, the blood was taken not from the contracting
    parties but from an ox sacrificed for the purpose.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before Grandidier and Zomena's ceremony, diviners fixed a favourable day,
    people assembled on the east side of the King's house, and the two participants
    sat together on a new mat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: An ox was thrown down and bound; a prince of the family of Zafiraminia cut
    its throat while reciting prayers and caught the first blood in a calabash filled
    with water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Salt, soot, a leaden ball, and a gold manilla were added to the blood-and-water
    vessel; the passage also notes other reported mixtures using brine, pimento, pulverised
    flint, earth, gunpowder, and rum instead of water.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Grandidier used the ramrod of his gun and Zomena used his spear; they dipped
    the points into the consecrated liquid while the principal chief struck their
    weapons with a knife and stated covenant obligations and misfortunes for perjury.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Zomena made Grandidier drink the sacred beverage, struck him on the shoulders,
    back, and breast with the empty vessel, and Grandidier then repeated the same
    ceremonies.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: After the famake was completed, the passage says Grandidier and Zomena were
    brothers in blood; relatives, princes, and princesses congratulated Grandidier,
    used kinship names for him, and took his hand.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: For the Bara, Richardson is quoted as saying that two persons form friendships
    by drinking a little blood from incisions in each other's bellies, and that these
    friendships are relied on for plundering, sexual aims, and protection from plunder.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: In the Benyowsky account, oxen were killed for ranks of the people, chiefs
    took drops of blood and pronounced an oath, and a later oath involved mutual incisions
    under the left breast and mutual sucking of blood with maledictions against violators.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
