  summary: The passage describes Malagasy and Betsileo decorative carving on house
    posts, shutters, memorial posts, and small objects. It notes geometric and sun-like
    designs, memorial posts with ox skulls and horns, carved figures of oxen and men,
    comparisons with Polynesian and Mangaian ornament, and a call to document carvings
    before weathering or foreign influence causes their loss.
