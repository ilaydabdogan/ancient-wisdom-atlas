  summary: 'The passage catalogs useful plants and plant products in Madagascar: gourds
    for containers and musical instruments; tobacco, snuff containers, and hemp; hemp
    and cotton textiles; vegetable dyes from bark, lichens, and indigo; mulberry and
    tapia trees for silkworms; lichen collection; and a correction of common assumptions
    about tropical flowers.'
