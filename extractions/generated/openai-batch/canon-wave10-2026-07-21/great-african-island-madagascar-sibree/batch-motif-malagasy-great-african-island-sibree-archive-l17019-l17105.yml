canonical_text:
  quote: ''
  summary: The author evaluates the depth of Christian influence in Madagascar, distinguishing
    public moral change from inward conviction. He says church affiliation had become
    socially advantageous, producing many nominal Christians. He reports that rumors
    of loss of royal support greatly reduced attendance in some villages, while better-instructed
    congregations and memories of persecution suggested some steadfastness. He explains
    mass churchgoing and idol burning as strongly influenced by the sovereign’s example,
    contrasts this with a revival in the Sandwich Islands, and comments on limited
    emotional expression among sincere Christians.
