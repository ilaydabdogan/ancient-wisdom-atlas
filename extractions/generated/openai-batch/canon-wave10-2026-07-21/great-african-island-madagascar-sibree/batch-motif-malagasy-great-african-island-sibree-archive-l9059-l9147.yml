canonical_text:
  quote: ''
  summary: The passage describes Malagasy social marriage restrictions, the special
    privileges and taboos of the Zinakambeny clan, and several royal customs. At a
    sovereign's accession, allegiance is sworn through named rites involving a speared
    calf, struck water, or the presentation of hasina silver coin. Variants include
    drinking water mixed with red earth from a royal tomb. The passage also describes
    the scarlet umbrella as a visible sign of the sovereign and compares some customs
    to biblical and African royal parallels.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Andrian clans, Hova, slaves, slave classes, tribes,
    and families observe restrictions on intermarriage, including a prohibition on
    intermarriage among descendants of sisters down to the seventh generation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Zinakambeny clan of Andrians is described as maintaining privileges and
    refusing certain actions or associations, including mending a fence, lending mats
    or drinking vessels, eating from the same dish with others, and associating with
    other tribes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a Malagasy sovereign succeeds to the throne, persons of position and
    representatives of distant tribes come to the capital to take an oath of allegiance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The passage names three signs of allegiance: spearing the calf, striking
    water, and presenting hasina or silver coin.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the calf rite, a young calf is killed, its head and feet are reversed,
    spears are thrust into the carcass, oath-takers hold spears, a judge recites penalties,
    and assent is shown by shaking the spears.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the striking-water rite, oath-takers stand around a pond containing several
    materials, including bullock dung, grass flower, musket ball, rice chaff, musket
    wadding, branches, long grass, and a water flower.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the oath is recited in the striking-water rite, assent is given by striking
    the water with boughs, striking a spear into the pool, and firing a musket over
    it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A variant oath is described as being taken over water in a canoe, which is
    violently shaken by the surrounding people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the accession of Ranavalona I, an oath form used red earth from a king's
    tomb mixed with water; common people drank it, and it was understood to operate
    as a curse if the oath was violated.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The hasina form of allegiance consists of presenting a silver dollar or unbroken
    money, accompanied by a wish or prayer that blessings on the sovereign accompany
    the offering.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A Malagasy sovereign is described as moving outside the palace with state
    ceremony, accompanied by chief people, soldiers, and attendants.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The sovereign's presence is marked by a large scarlet umbrella carried over
    her, including when she is on the palace verandah or in the gardens.
  category: object
  evidence_refs:
  - ev:9
