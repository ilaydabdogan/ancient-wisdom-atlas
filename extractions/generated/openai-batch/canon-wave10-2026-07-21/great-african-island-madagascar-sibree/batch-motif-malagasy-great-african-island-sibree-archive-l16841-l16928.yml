  text: The narrator says several firms conduct profitable business in Antananarivo
    and native traders bring goods, and he explicitly connects Christianity with civilising
    influence and honest trade.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that improved dwellings provide some families with separate
    sleeping places and that a repealed building restriction led to extensive rebuilding
    in Antananarivo using brick, stone, clay, timber, and metal.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Martyr Memorial Churches are said to have encouraged building skills and
    shown local people how to use local construction materials.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator characterizes earlier Hova marriage practice as including general
    polygamy, frequent divorce, and a proverb comparing marriage to a knot easily
    untied.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says public opinion and Christian conscience are growing in relation
    to marriage, polygamy is at an end in Imerina, divorce is less frequent, and church
    censure restrains wrong-doers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the government adhered to Christianity, it stopped public work and closed
    markets on the Sabbath, creating a legal day of rest, and many people attended
    public worship.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The native authorities are praised for laws against manufacturing or importing
    ardent spirits into Imerina, while the passage says rum brought by English and
    French traders harms coastal populations.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says cruel punishments for political and other crimes have been
    abolished or fallen into disuse, and that burning alive for some military offences
    was replaced in later cases by fine and loss of rank.
  category: action
  evidence_refs:
  - ev:6
