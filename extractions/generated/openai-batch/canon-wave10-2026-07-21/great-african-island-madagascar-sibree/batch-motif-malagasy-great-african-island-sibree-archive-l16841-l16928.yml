  summary: The passage presents a missionary-era account of social changes in Antananarivo
    and Imerina, attributing increased trade, rebuilt dwellings, changes in marriage
    practice, Sabbath observance, temperance laws, and reduced use of cruel punishments
    to Christianity and government action.
