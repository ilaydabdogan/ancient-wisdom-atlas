  summary: The passage describes Malagasy royal authority, respect for age and seniority,
    marriage and betrothal customs, levirate-like widow marriage, clan endogamy for
    property retention, adoption, desire for children, fertility blessings for brides,
    and frequent invocation of the Divine Name in greetings and benedictions. The
    author repeatedly compares these customs with Biblical Hebrew or Jewish practices
    and texts.
