  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Queen Ranavalona I had earlier announced an adopted boy of royal descent as
    her successor, even though she later had a son of her own.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At a solemn palace meeting, the Queen places two covered vessels on a table
    and has the two princes open them.
  category: action
  evidence_refs:
  - ev:8
