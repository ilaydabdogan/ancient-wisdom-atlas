canonical_text:
  quote: ''
  summary: The passage describes Malagasy beliefs about unlucky months, days, and
    lunar phases; the killing or ritual preservation of children born at unlucky times;
    work abstentions and lucky days connected with idols and royal undertakings; and
    the tangena poison ordeal, in which a poison from a tree nut was believed to possess
    supernatural power to detect guilt in suspected witchcraft, treason, or other
    serious crimes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Tanala, the month Faosa is described as extremely unlucky, with
    work, moving residence, and travel avoided during it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tanala children born in Faosa are said to be usually buried alive in a distant
    forest, unless the parents decide to let the child live and call a diviner.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The diviner prepares an expiatory bath from grass, herbs, other articles,
    and water; the child is bathed, and the water and its contents are buried.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among one Sakalava clan, children born on Tuesdays are put to death, and many
    families have an ill-omened day for newborn children.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Hova month Alakaosy is described as very unlucky, the waning moon as unfavorable
    for important undertakings, and Antankarana burials as timed immediately after
    the new moon appears.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Before the destruction of idolatry in Imerina, every idol had a sacred day
    on which its votaries abstained from work; Sunday or Thursday were also described
    as lucky days for a Hova sovereign to travel or begin undertakings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The tangena is described as a small tree whose fruit nut provides a substance
    that can act as an emetic in small quantity and a virulent poison in larger quantity.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The tangena ordeal was used chiefly to detect witchcraft and other serious
    crimes such as treason when ordinary evidence could not be obtained.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: The fruit was believed to contain a supernatural power, called a kind of searcher
    of hearts, that entered the suspected person and either cleared or convicted that
    person.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the ordeal, a portion of two nuts was rubbed into water or banana juice;
    the suspect had eaten rice and swallowed three small square pieces of fowl skin,
    then drank tepid water to induce vomiting; innocence was shown by rejecting the
    three pieces uninjured.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage states that the ordeal carried a risk of poisoning and could be
    manipulated to produce an unfavorable result against disliked persons.
  category: other
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage quotes Dr. Davidson as comparing the relevant word to Greek pharmakeia
    and noting overlap among terms for physician, sorcerer, and poisoner in ancient
    and African-language contexts.
  category: speech
  evidence_refs:
  - ev:8
