  summary: The passage gives an ethnographic description of variation in skin color,
    hair, facial form, head shape, and stature among Malagasy groups. It divides Malagasy
    peoples broadly into eastern, central, and western tribes, identifies some groups
    as lighter or darker in complexion, and gives a detailed physical description
    of Hovas, including a cited description from Ellis.
