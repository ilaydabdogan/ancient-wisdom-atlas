    Andriamanelo.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: A reported remnant of the Vazimba on the west coast is said to have been conquered
    with other local people by chiefs who founded the northern Sakalava kingdom of
    Iboina.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The natives say Lake Itasy was formed when a Vazimba chieftain named Eapeto
