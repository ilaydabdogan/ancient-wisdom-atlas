  text: The author asks whether an aboriginal or autochthonous people inhabited Madagascar
    before the arrival of Malayo-Polynesian tribes and says the information is scanty
    and mixed with the marvellous.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Imerina, graves believed to belong to the Vazimba are described as small
    shapeless heaps of stone scattered over bare downs and regarded with superstitious
    fear.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Traditions describe the Vazimba as low in stature, with narrow elongated heads,
    and ignorant of the use of iron.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Vazimba are said to have fled before the superior weapons of the Hovas;
