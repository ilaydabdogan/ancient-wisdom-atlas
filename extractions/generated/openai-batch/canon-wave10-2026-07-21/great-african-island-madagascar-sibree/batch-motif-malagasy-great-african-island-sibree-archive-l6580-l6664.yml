canonical_text:
  quote: ''
  summary: 'The passage surveys traditions and reported material traces of an earlier
    Vazimba people in Madagascar: feared graves in Imerina, descriptions of Vazimba
    physique and lack of iron-working, displacement by Hova and Sakalava powers, a
    tradition that the chieftain Eapeto formed Lake Itasy by damming a river and flooding
    a rival chief''s rice-fields, and Betsileo beliefs about Vazimba grave-circles
    where offerings are made to remove sickness.'
  language: English
  quote_policy: summarized
