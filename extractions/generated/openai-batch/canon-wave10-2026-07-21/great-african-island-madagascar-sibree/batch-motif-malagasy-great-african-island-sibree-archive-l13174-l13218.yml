canonical_text:
  quote: ''
  summary: 'The passage describes ceremonial and proverbial apportionment of parts
    of an ox or killed creature to ritual participants, social ranks, and craftspeople.
    It then turns to birds: owls are described as ill-omened spirit-birds, the takatra
    as a dreaded path-crossing bird whose nest must not be destroyed, and Tanala diviners
    as reading good and bad birds by their calls and flight direction.'
