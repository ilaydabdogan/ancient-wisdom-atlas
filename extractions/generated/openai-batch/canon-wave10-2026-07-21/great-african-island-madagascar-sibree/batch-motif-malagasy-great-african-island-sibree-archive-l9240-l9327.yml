canonical_text:
  quote: ''
  summary: The passage describes Malagasy royal etiquette around royal property, collective
    labor for royal works, the judicial use of a named spear of royal authority, and
    a public kabary assembly for hearing messages from the sovereign. It also reports
    a comparison with Polynesian and African royal etiquette concerning royal water
    or property passing through public space.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When royal property is carried through a street, people clear the road, move
    to the sides, and uncover their heads.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A spear-bearer precedes the property and shouts a command meaning to get to
    one side; disobedience is threatened with the spear.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The property described may be small luggage, water-jars, or bullocks, and
    is treated as royal property requiring a free road and uncovered heads.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A dog that crosses the path of the royal property may be speared and left
    wounded on the road.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author states that a similar custom is found in Polynesia and Africa,
    and gives an example from Tamehameha's reign involving the king's calabash of
    water.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: For special work on royal courtyards, people of all ranks perform manual labor
    while the Queen sits on a raised seat watching.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A similar collective labor pattern is described for clearing ground and building
    chapels, involving men and women, nobles, slaves, officers, and soldiers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Tsi-tia-lainga is described as a spear with a large silver blade engraved
    with the sovereign's name; its name is glossed as meaning “Hater of lies.”
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a consequential person is accused of a grave offence, officers take the
    Tsi-tia-lainga to the accused person's house and plant it in front of the house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the spear is planted, no one may leave the house until the accusation
    has been examined and its truth investigated.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: A kabary is described as a public assembly for hearing a message from the
    sovereign, usually held at Andohalo or sometimes at Mahamasina.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: On very great occasions, much of the central province population and representatives
    from distant tribes and provinces attend the kabary.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: People gather before daylight, sit on the ground, and hear cannon, drums,
    and military music announce the movement and approach of high officers carrying
    the royal message.
  category: sequence
  evidence_refs:
  - ev:6
