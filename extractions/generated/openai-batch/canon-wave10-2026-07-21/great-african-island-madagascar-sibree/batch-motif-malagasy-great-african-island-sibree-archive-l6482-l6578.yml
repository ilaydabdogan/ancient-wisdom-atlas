  quote: ''
  summary: 'The passage gives a historical and ethnographic account of the Sakalava:
    their name from a small river, expansion by conquest across western Madagascar,
    formation of Menabe and Iboina, later decline before Hova power under Andrianimpoina
    and Eadama I, French protection claims in the north, and notes on Sakalava lifeways
    and landscape.'
