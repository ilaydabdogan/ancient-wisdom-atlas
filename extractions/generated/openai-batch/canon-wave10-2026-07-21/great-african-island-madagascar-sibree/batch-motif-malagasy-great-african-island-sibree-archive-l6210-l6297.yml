  quote: ''
  summary: The passage describes the Bara region and a representative Bara warrior’s
    hair, charms, weapons, and attributed raiding attitude. It then introduces the
    Tanala as forest people living in a dense forest belt, with some under Hova supremacy
    and southern groups such as Ikongo described as independent and protected by mountain
    strongholds with water and rice grounds.
