canonical_text:
  quote: ''
  summary: The passage describes Malagasy linguistic features, dialect groupings,
    differences between coast and Hova forms, comparisons with Polynesian languages,
    and a speech taboo in which words forming chiefs' names become sacred and are
    replaced in common use. It also gives an accession-name example involving Queen
    Pasoherina/Rasoherina as printed in the passage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Malagasy word for million literally means the
    finishing of counting, and that the word for ten thousand is the same as the word
    for night.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Malagasy commonly prefers passive verbal forms, using
    a construction equivalent to “seen by me it” rather than “I see it,” and also
    notes suffix pronouns and elliptical terseness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports that only a few Malagasy dialects had been carefully investigated,
    while differences in vocabulary, pronunciation, and speaking style could initially
    hinder understanding between people from distant parts of the island.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage first names three dialect groupings—Hova, Sakalava, and Betsimisaraka
    with allied eastern tribes—then says closer examination reduces these to two broader
    groups because the latter two share similarities and common differences from Hova.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage identifies the Hova as the ruling tribe, says native literature
    is printed in their dialect, and suggests that this dialect may become the standard
    form of Malagasy.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that coast dialects from warmer regions are more like Polynesian
    languages than the Hova dialect of the colder highlands.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says many coast words consist entirely of vowels, while Hova forms
    insert firmer sounds or add terminal syllables such as na, ka, or tra, including
    when adapting English words and names.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: The passage attributes some phonetic changes to climate and to an obscure
    correlation between temperature and laryngeal structure.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage describes a custom among Malagasy tribes, said to be common to
    Polynesian languages, in which words forming chiefs' names are tabooed for common
    use.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage says proper names in this language group often contain names of
    common objects such as animals, birds, insects, plants, and trees; if such a word
    forms all or part of a chief's name, it becomes sacred and is replaced by another
    name, often a descriptive epithet or periphrasis.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage gives the example of the late Queen Pasoherina/Rasoherina as printed
    in the passage, saying she was known before accession by another name and took
    the queenly name on becoming queen.
  category: sequence
  evidence_refs:
  - ev:11
