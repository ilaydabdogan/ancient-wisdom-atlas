canonical_text:
  quote: ''
  summary: 'The passage describes Malagasy beliefs and customs concerning the ox or
    large-humped buffalo: a legendary royal introduction of eating cattle, royal or
    chiefly control over slaughter, New Year blessing and first-fruits rites, restricted
    killing at funerals or agricultural seasons, prescribed animal portions for royalty
    and kinship exchange, and sacrifices in which blood and fat are offered to ancestors
    at tomb stones and other sacred places.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The large-humped buffalo or ox is described as the most valuable and plentiful
    animal in Madagascar and as having legendary history attached to it.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Hova king named Ralambo is remembered as the first person who ventured to
    use the ox as food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The story explains the name omby through Ralambo's speech when cattle folds
    were filled, though the author doubts this etymology.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Among several Malagasy groups, killing an ox is described as an office belonging
    to a chief, a king-descended person, or a member of the king's family.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the Fandroana New Year's festival, fattened oxen are driven into the royal
    courtyard, blessed by the sovereign, and an unblemished ox is killed; its hump
    is taken to the sovereign to taste as first-fruits.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some Malagasy tribes are said not to kill oxen except at funerals or other
    important occasions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Sakalava of Menabe are said not to kill a red bullock for food except
    from necessity, and then only with sacrificial forms.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Betsileo formerly killed oxen only at reaping times, while the Tanala
    chiefly kill at planting time and offer much of the flesh on altars in their fields.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The rump of every ox killed is described as the royal share.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The same rear portion of a fowl is described as the proper portion from children
    or inferiors to parents or superiors, and the corresponding portion of a sheep
    gives its name to a marriage payment made to the bride's parents.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that the ox, fowl, and sheep are considered proper animals
    for Malagasy sacrifice.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Sacrifices are described as sometimes holocausts but more often shared feasts
    in which blood and fat are the parts offered.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Blood and fat from sacrificial victims are said to be smeared on upright tomb
