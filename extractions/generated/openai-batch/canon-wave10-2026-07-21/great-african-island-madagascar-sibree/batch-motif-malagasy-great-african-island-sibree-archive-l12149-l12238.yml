- id: obs:2
  text: Among the Hovas, a marriage is celebrated first at the bride’s father’s house
    and then at the bridegroom family’s house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young Hova couple sit together and eat rice and other food with one spoon
    from the same dish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A handsome silk lamba is thrown around both members of the couple.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The marriage becomes legal and binding when a small sum of money is presented
    to the bride’s parents or guardians; the payment is called vbdi-bndry, glossed
    as sheep’s rump.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author says that some Malagasy marriage customs seem connected with a
    widely extended practice of taking a wife by force from her father’s family.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Among the Sakalavas, a young man seeking a wife has his courage and qualifications
    tested by standing before a skilled spear caster and catching each thrown spear
    between his arm and side.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: If the suitor shows fear or fails to catch a spear, he is rejected; if he
    does not flinch and catches the spears, he is proclaimed an accepted lover.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A betrothed girl is called fofomhady, and the passage states that cohabitation
