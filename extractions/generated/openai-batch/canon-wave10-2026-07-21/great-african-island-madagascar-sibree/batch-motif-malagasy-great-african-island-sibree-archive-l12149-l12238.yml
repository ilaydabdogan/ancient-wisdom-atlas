canonical_text:
  quote: ''
  summary: The passage gives Malagasy terms related to marriage and family, describes
    Hova marriage rites involving shared food, a silk lamba, and a payment to the
    bride’s kin, then describes Sakalava courtship tests, betrothal practices, royal
    sibling marriage with consecrated water and prayers, dynastic succession concerns,
    and differing premarital customs among some Malagasy groups.
  language: English
  quote_policy: summarized
