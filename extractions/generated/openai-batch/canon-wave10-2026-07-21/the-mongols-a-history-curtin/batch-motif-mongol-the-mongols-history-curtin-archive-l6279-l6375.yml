  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Jinghis Khan left large possessions to his sons Juchi, Jagatai, Ogotai, and
    Tului, with Tului receiving the father's home places between Kara Kurum and the
    Onon region.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The passage says the inheritance arrangements agreed with Mongol custom:
