  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ogotai resisted accepting sovereignty and named others, especially Tului,
    as better fitted; the others answered that Jinghis himself had chosen Ogotai.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After forty days of feasting, Ogotai yielded; on the forty-first day, identified
