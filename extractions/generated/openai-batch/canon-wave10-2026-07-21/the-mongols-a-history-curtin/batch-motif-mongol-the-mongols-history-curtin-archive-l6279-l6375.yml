  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the last rites and honors for Jinghis Khan, the sons returned to their
    possessions; after two years the family assembled on the Kerulon for a Kurultai
    of election, with Tului acting as regent.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Kurultai spent three days in feasting and pleasure before proceeding to
    choose a Grand Khan.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ye liu chu tsai urged the assembly to choose Ogotai as Jinghis Khan's choice,
