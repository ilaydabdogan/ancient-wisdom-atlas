canonical_text:
  quote: ''
  summary: Juriat factions are drawn to Temudjin by his generosity and protection,
    while kinship ties to the Taidjuts create hesitation. Temudjin gains allies through
    service pledges and marriage alliances, hosts a feast near the Onon, and then
    faces a quarrel over mare's milk precedence and a stolen bridle that leads to
    violence, withdrawal from alliance, and later desertion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Juriats hunted with Temudjin's party, received more game than was due to them,
    thanked him, and felt drawn toward joining him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Juriat elders objected to joining Temudjin by saying the Taidjuts were kinsfolk,
    but Ulug Bahadur and Tugai Talu went to Temudjin with their kinsmen and dependents.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The newcomers described themselves as leaderless and offered friendship, service,
    and military defense to Temudjin.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Temudjin said the newcomers had roused and cheered him, then made rules and
    arrangements that pleased them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Temudjin sought alliance with Podu, chief of the Kurulats, by offering him
    his sister in marriage; Podu accepted and offered half his horses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Temudjin refused to frame the marriage alliance as taking or giving, called
    Podu and himself brothers and allies, and asked for friendship and faithful help.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Another Juriat faction said the Taidjuts tormented them while Temudjin gave
    clothing and horses to the needy, called him a genuine leader and father, and
    joined him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Temudjin's mother married Munlik, and after gains in power Temudjin held a
    feast near the Onon River in a forest for his mother, step-mothers, kinsfolk,
    and new people.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the feast, jealousy over position and the stealing of a bridle caused a
    dispute and outbreak; Sidje Bijhi withdrew with his party from alliance with Temudjin.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Temudjin sent a jar of mare's milk first to his mother, Kassar, and Sachai
    Baiki; Holichin and Hurchin became angry and struck Shikiur, master of provisions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Belgutai was ordered to keep order; he stopped a man connected with the Churkis
    who had stolen a bridle, and Buri Buga wounded Belgutai while defending that man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Belgutai did not complain and said cousins should not quarrel over him; Temudjin,
    watching under a tree, broke a branch, took a milk paddle, beat the Churkis, and
    brought his step-mothers back to their places.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The two Juriat parties that had joined Temudjin later cooled in allegiance,
    are said to have been influenced by Jamuka's intrigues, fought each other, and
    deserted.
  category: sequence
  evidence_refs:
  - ev:8
