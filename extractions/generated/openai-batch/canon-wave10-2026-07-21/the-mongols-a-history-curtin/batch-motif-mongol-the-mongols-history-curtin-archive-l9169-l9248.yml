  summary: The passage recounts Hassan Sabah's rise at Melik Shah's court, conflict
    with Nizam ul Mulk, concealment with Abu Fazl, journey to Egypt, involvement in
    a Fatimid succession dispute, imprisonment and reported marvels, a sea voyage
    during which others become his disciples, and later preaching travel ending at
    Alamut.
