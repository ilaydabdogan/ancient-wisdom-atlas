canonical_text:
  quote: ''
  summary: Kubilai appoints Chang hong fan to command the campaign against the Sung
    ruler. Chang defeats the land forces, attacks the Sung fleet near Ya i, and traps
    the emperor's vessel. Liu sin fu drowns himself with the boy Emperor Ti ping after
    declaring that a Sung sovereign should prefer death to captivity; many dignitaries
    and the Empress also drown themselves. The imperial seal is found on Ti ping's
    corpse, restoration efforts fail, remaining leaders die, and the Sung family disappears
    as Kubilai becomes master of China.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chang hong fan advises Kubilai that Kuang wang must be mastered, and Kubilai
    sends him a jeweled sword and appoints him commander-in-chief.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chang hong fan defeats the Sung land forces; several commanders or officers
    are captured, one kills himself, one is burned over a slow fire, and Wen tien
    is refused the death he requests.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The remaining conflict is against the Sung fleet near Ya i, where Chinese
    troops are entrenched on the island and believe shallow northern waters will protect
    them from large Mongol vessels.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chang hong fan sends oil-soaked, ignited boats toward the Chinese fleet with
    help from a southern wind, but the attack fails because Chang shi kie has covered
    the front barks and rigging with mud.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After reinforcements arrive from Canton, Chang hong fan attacks from north
    and south; the Chinese fleet remains unbroken at evening but loses order, and
    Chang shi kie attempts to escape through mist toward the open sea.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The emperor's vessel reaches a channel mouth blocked by Mongol barges lashed
    together, leaving no way forward and no possibility of return.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Liu sin fu has his wife and children thrown into the water, tells Ti ping
    that a Sung sovereign should prefer death to captivity, then jumps into the sea
    with the boy Emperor; many dignitaries also drown themselves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: More than eight hundred ships fall to the Mongols, and Ti ping's corpse is
    later found among many Chinese corpses floating in the water, bearing the seal
    of the Empire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Chang shi kie asks the Empress to help choose a Sung relative as Emperor,
    but after learning of her son's death she jumps into the sea and is followed by
    the ladies of her service.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Chang shi kie sails toward Tung king hoping to return and install a new Emperor,
    but he dies in a tempest; Su liu i is slain by his own men, China submits, and
    the Sung family vanishes.
  category: sequence
  evidence_refs:
  - ev:8
