canonical_text:
  quote: ''
  summary: 'The passage recounts Mongol campaigns against remaining Sung forces: sieges
    of Kwe lin fu and Chao chiu, slaughter after conquest, the sea-borne flight and
    death of the young Sung emperor, Liu sin fu''s insistence on enthroning another
    royal son under Heaven''s possible favor, and the establishment of a final Sung
    refuge in straits near Ya i.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Alihaiya besieged Kwe lin fu for three months; after failing to overcome Ma
    ki's resistance, he sent a Kubilai-issued diploma appointing Ma ki commander-in-chief,
    and Ma ki burned the diploma and killed the officer who carried it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kwe lin fu stood at the meeting of two rivers and was initially exposed on
    one side only; the Mongol general dug new beds for the rivers and turned them,
    making the city assailable on every side.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the changed river position allowed an assault, the Mongol army stormed
    Kwe lin fu; Ma ki fought through the streets and squares, was captured while wounded,
    died soon afterward, and the inhabitants were killed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ki wang, or Y Wang, the young Emperor, sailed to Hwei chiu and sent an officer
    with a letter offering submission to Kubilai through Sutu; Kuang tung soon submitted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kubilai summoned Bayan from South China; after Bayan's departure the Sung
    party retook many cities, while Sutu declared the Chinese untrustworthy and returned
    to slaughtering cities without mercy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Chao chiu, Sutu laid siege; the commandant Ma fa actively resisted, burned
    Mongol battering engines during a sortie, died in combat, and the city was taken
    and its people killed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The young Emperor had no safe port, wandered at sea without a resting-place,
    and died at age eleven on Kang chuen, described as a desert island.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When officials were ready to submit to Kubilai, Liu sin fu opposed them and
    argued that a son of Tu tsong remained and should be made Emperor, saying that
    Heaven might not have decreed the ruin of the Sungs.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The chiefs placed Kuang wang on an earth mound, knelt, and rendered homage;
    the new Emperor was named Ti ping, with Liu sin fu and Chang shi kie as ministers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Chinese headquarters were mainly on water; the fleet retired to straits
    in the Gulf of Canton between mountain Kiche and the island of Ya i, a position
    described as the last refuge and stronghold of the Sung dynasty.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: Chang shi kie built a palace for the Emperor and barracks for warriors on
    the summit of the island, while working to provision the vessels and the people
    there.
  category: action
  evidence_refs:
  - ev:9
