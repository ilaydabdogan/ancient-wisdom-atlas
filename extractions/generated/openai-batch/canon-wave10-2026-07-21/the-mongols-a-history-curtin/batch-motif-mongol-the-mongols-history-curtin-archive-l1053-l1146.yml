    authority is the only genuine authority.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Temudjin follows the trail for three days and meets Boorehu, a young man milking
    a mare, who says he saw the eight horses, provides a white horse with a black
    stripe for the journey, hides his pail and bag, and joins Temudjin.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Temudjin and Boorehu travel together for three days and see the eight horses
