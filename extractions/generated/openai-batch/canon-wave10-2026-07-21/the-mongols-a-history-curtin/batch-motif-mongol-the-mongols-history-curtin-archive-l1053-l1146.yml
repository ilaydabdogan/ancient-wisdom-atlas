canonical_text:
  quote: ''
  summary: Temudjin, still constrained by a kang and pursued by the Taidjuta, seeks
    help from Sorgan Shira. Sorgan's household removes and burns the kang, hides Temudjin
    under wool in a cart, and protects him during a search. Sorgan then gives him
    a mare, food, mare's milk, a bow, and arrows, sending him to his family. Temudjin
    finds his mother and brothers, settles with them near Mount Burhan and a green
    lake, then later pursues eight horses stolen by Taidjut thieves. On the trail
    he meets Boorehu, who joins him in searching for the stolen horses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sorgan Shira returns to Temudjin, warns that searchers will come the next
    day, urges him to go to his mother and brothers, and tells him not to reveal that
    Sorgan saw him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Temudjin recalls that Sorgan Shira and his sons previously pitied him and
    removed the kang from his shoulders in the dark, and he decides to go to Sorgan
    for help.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Temudjin enters Sorgan Shira's yurta; when questioned, he answers with a comparison
    of a bird pursued by a falcon hiding in thick cover.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sorgan Shira decides that his household should help Temudjin; the boys remove
    and burn the kang, hide Temudjin in a cart under wool packs, and tell Kadan to
    guard the wool and keep silent.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Taidjuta search Sorgan's yurta and the wool; they prod the wool with lances,
    one lance enters Temudjin's leg, and Temudjin remains silent and motionless.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the searchers leave, Sorgan Shira says that his house's smoke and fire
    would have vanished forever if Temudjin had been found.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sorgan Shira gives Temudjin a white-nosed sorrel mare, a boiled lamb, a skin
    of mare's milk, a bow, and two arrows, but no flint, so that he will not make
    fire and betray himself.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Temudjin travels by the ruins of his first house, the Onon, the Kimurha, Mount
    Baitar, and Horchukin, where he finds his brothers and his mother Hoeiun.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Temudjin moves with his family to Mount Burhan, near high land, a river, a
    hill, and a green-colored lake, where he fixes his yurta and lives for a season
    by trapping marmots and field mice.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: Taidjut thieves drive off eight of Temudjin's horses, leaving only the white-nosed
    sorrel mare that Sorgan had given him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Belgutai and Kassar each offer to pursue the stolen horses, but Temudjin rejects
