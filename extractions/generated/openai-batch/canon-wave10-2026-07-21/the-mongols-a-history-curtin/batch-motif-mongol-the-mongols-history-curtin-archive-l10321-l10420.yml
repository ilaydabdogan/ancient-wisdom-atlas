canonical_text:
  quote: ''
  summary: The passage recounts a contested genealogy for Hassan II, accusations of
    license and violence among the Ismailite Assassins, Hassan II's killing, Mohammed
    II's vengeance and teaching, intimidation or killing of religious critics, and
    the capture, recapture, razing, and revenge killings connected with a mountain
    castle near Kazvin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A tale about Hassan's genealogy was ridiculed, after which its supporters
    maintained that Nesar secretly met Mohammed's wife and that Hassan resulted from
    that meeting.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ismailites who tried to prove Hassan's descent from Nesar were called "Nesari"
    by opponents, and the passage says the title carried obloquy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that crime and immorality reigned where the Order had power
    or influence, and that people formerly acting from obedience or religious duty
    began murdering wantonly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hassan II died in the fourth year of his reign by the dagger of his brother-in-law
    at the castle of Lamsir.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mohammed II, Hassan's son and successor, first avenged his father by executing
    Nanver and all Nanver's male and female kindred.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mohammed II is described as preaching the doctrine of license, crime, and
    vice and as claiming to be the Imam.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Orthodox regarded the Assassins as heretics and outcasts; Fakhr ul Islam
    issued a legal opinion against them and later was killed by an Assassin.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: An Ismailian Prior sent an agent to Rayi; the agent appeared as a student,
    waited until Fakhr ud din Rasi was alone, shut the door, and put a dagger to his
    breast.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The agent demanded that Fakhr ud din Rasi stop cursing the Ismailians and
    extracted a solemn promise of silence from him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The agent said he had no command to kill Rasi, conveyed his master's invitation
    to Alamut, gave Rasi money, promised yearly payments, and mentioned two Yeman
    tunics.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: When later asked why he did not curse the Ismailians, Fakhr ud din Rasi replied
    that their arguments were "so trenchant."
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: At Arslan Kushad, the Ismailians surprised by night a castle two leagues from
    Kazvin on the top of a high mountain.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After Sultan Tagash took the castle and placed a small garrison on the mountain,
    the Ismailians reentered at night through an underground passage known only to
    them and killed the whole garrison.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: After a second siege, the Ismailians negotiated withdrawal in two divisions
    but actually left in one party; the Sultan then ordered the castle razed.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The Ismailians later took vengeance on Sheikh Ali by having one of their Assassins
    kill him in a mosque at Damascus as he returned from pilgrimage to Mecca.
  category: action
  evidence_refs:
  - ev:12
