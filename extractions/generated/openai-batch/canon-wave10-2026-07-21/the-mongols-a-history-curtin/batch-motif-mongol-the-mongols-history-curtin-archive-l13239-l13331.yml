canonical_text:
  quote: ''
  summary: The passage describes Subotai continuing the siege of the Kin capital despite
    submission and negotiations; the Kin Emperor offering vassalage and sending his
    son as hostage; both sides using siege engines, fire, and explosive projectiles;
    a truce followed by plague; the killing of a Mongol envoy during peace talks;
    a second investment of the capital; failed relief efforts; and the Kin ruler’s
    decision to abandon the capital while leaving the royal family behind.
  language: English
  quote_policy: summarized
