canonical_text:
  quote: ''
  summary: After Hulagu takes Bagdad, he asks the Ulema whether a just unbeliever
    or an unjust Muslim is preferable as sovereign, and they endorse the just unbeliever.
    The passage then recounts the subjection of territories, the punishment of Teghele
    despite a token of favor, the reconciliation of rival Sultans of Rum after a submissive
    gift and intercession, Bedr ud din Lulu's crafty presentation of earrings to Hulagu,
    and the hopes of Christians and Jews under Mongol power after Abbasid rule.
  language: English
  quote_policy: summarized
