canonical_text:
  quote: ''
  summary: Jelal seeks friendly union with the Sultan of Rum through envoys and a
    proposed alliance, but refuses a dynastic marriage request and refuses to surrender
    a guest. Diplomatic relations worsen after insults from Jelal's vizir. Jelal then
    captures Khelat after a long siege; the city is plundered, inhabitants are tortured
    or enslaved, and Ashraf's wife is taken as Jelal's concubine. Ashraf and Kei Kubad
    move toward an alliance against Jelal and gather forces for a combined campaign.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jelal sends an envoy with a letter to the Sultan of Rum asking for friendly
    relations and close union, describing the two rulers as eastern and western bulwarks
    of Islam against infidels.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kei Kubad receives the letter favorably and proposes strengthening the alliance
    by marrying Jelal's daughter to his son, Kei Kosru.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kei Kubad's envoys bring presents and request Jelal's daughter for Kei Kubad's
    son, but the request is refused.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The envoys ask Jelal to surrender the Erzerum prince Jihan Shah, but Jelal
    refuses because Jihan Shah is a guest at his court.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Jelal's vizir Sherif speaks rudely to an envoy and later explains that the
    envoys' presents were worth less than two thousand dinars.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The envoys return displeased, and Kei Kubad sends one envoy to make an alliance
    with Ashraf.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After six months of siege work, Jelal storms and takes Khelat on April 2,
    1230.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Jelal initially wishes to prevent pillage, but his generals insist that the
    army must be allowed to plunder after the long siege, and he yields.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Khelat is given over to the army for three days and nights; many people die
    under torture for hidden treasure, and women and children are kept for captivity.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ashraf's Georgian wife is taken by Jelal and made his concubine.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Yakub and Abbas, younger brothers, also fall into Jelal's power; afterward
    Jelal repairs Khelat's walls and grants land in the region to his generals.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Erzerum prince warns Jelal that Ashraf and the Sultan of Rum are forming
    a treaty and advises attacking before their forces can unite.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: After hearing of Khelat's fall and his consort's capture, Ashraf meets the
    Sultan of Rum's envoy, who is charged with concluding a treaty against Jelal.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Ashraf gathers horsemen and contingents from several regions and goes to join
    Kei Kubad at Sivas for a combined march on Khelat.
  category: action
  evidence_refs:
  - ev:11
