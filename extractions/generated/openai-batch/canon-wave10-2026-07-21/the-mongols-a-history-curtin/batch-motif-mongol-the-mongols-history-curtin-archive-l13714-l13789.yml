  text: Kutan received the submission of Chungchangan from its governor, left the
    governor in office, and ordered him to march with his warriors in the vanguard.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chinese forces resisted Kutan's main forces in wild mountain defiles between
