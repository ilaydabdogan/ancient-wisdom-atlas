canonical_text:
  quote: ''
  summary: 'The passage recounts Mongol military operations in Shen si, Su chuan,
    Hu kuang, and nearby regions: city submissions, sieges, captures, massacres, defensive
    successes by Chinese and Sung commanders, repeated sacks, a governor''s destruction
    of family and property before suicide, Kutchu''s death after campaigns, Ogotai''s
    affection for Kutchu, and later Mongol missions and troop movements.'
  language: English
  quote_policy: summarized
