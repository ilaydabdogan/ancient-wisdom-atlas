  quote: ''
  summary: The passage describes Argun's governorship in Persia, severe tax abuses
    under Sherif and his agents, profanation of a mosque with extorted goods, Argun's
    later attempts to correct abuses, the handling of revenue orders at the courts
    of Kuyuk and Mangu, tax reform, punishment of an offending Mongol general, and
    Argun's return to Mongolia by command of the Grand Khan.
  language: English
