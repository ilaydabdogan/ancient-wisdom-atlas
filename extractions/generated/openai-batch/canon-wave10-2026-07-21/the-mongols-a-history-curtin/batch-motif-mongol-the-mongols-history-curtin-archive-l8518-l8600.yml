literal_observations:
- id: obs:1
  text: Argun went as governor to Khorassan, left agents of the regent Turakina in
    the province, and went into Azerbaidjan and Irak to address the conduct of Mongol
    commanders.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Envoys from Rum and Syria asked Argun for protection, and Argun sent men to
    those regions to gather tribute.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sherif, having received wide liberty of action from Argun, collected taxes
    with exceptional harshness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tax collectors were instructed to spare no one; armed warriors were quartered
    in houses, and people were seized, imprisoned without food or water, and tortured.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Moslem ulemas, widows, and orphans sought mercy or justice but were treated
