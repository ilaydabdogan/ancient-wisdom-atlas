    pieces to wrap the goods for transport.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After Sherif's death, Argun remitted unpaid taxes and released prisoners held
    for non-payment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the Kurultai that elected Kuyuk, Argun collected and delivered revenue
