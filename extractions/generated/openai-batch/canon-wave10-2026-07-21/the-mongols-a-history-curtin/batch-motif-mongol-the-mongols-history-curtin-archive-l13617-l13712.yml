literal_observations:
- id: obs:1
  text: 'Ogotai summoned major Kurultais, and the second council decided on three
    expeditions: against the Sung Empire, Corea, and regions north and west of the
    Caspian and Black Sea.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ogotai wanted to lead the western expedition himself but yielded to princes
    of his family and appointed Batu to chief command in those regions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the Kin dynasty's destruction, the Mongols kept most of Honan despite
    an agreement with the Sung sovereign, prompting Sung princes to urge force and
    Li tsong to order a march on Pien king.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Three chiefs under Tsui li secretly declared submission to an advancing Sung
    general while pretending to cooperate with Tsui li.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Li po yuan arranged for fire to be set to a city gate and stabbed Tsui li
    with a dagger blade when Tsui li came to the gate.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tsui li's body was tied to a horse's tail and dragged to the palace, his head
    was exposed to the people, and his body was made a burnt offering to the spirit
    of the late Emperor Nin kia su.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ogotai reacted to Li tsong's invasion of Honan by military action and by sending
