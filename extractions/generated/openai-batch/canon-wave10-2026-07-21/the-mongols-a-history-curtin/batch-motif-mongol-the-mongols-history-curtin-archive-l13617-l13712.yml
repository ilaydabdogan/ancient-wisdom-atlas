  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that war had been fixed at the Kurultai and lists three
    army corps assigned to attack parts of the Sung Empire.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
