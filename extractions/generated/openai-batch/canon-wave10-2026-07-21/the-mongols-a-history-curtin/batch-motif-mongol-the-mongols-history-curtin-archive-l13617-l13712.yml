  summary: The passage describes Ogotai's councils and decisions to launch multiple
    campaigns, the Sung response to Mongol retention of Honan territory, the assassination
    and ritualized posthumous punishment of Tsui li in Pien king, and renewed Mongol
    plans for war against the Sung Empire.
