canonical_text:
  quote: ''
  summary: Kutuz consolidates rule in Egypt and prepares to oppose the Mongols. Hulagu
    advances through Syria, crosses the Euphrates by boat bridges, sacks towns, and
    marches on Aleppo. Refugees flee amid winter hardship, robbery, and plague. Near
    Aleppo, a sortie is drawn into an ambush at Bankussa. Hulagu demands surrender,
    Moazzam refuses, and Aleppo is besieged, stormed, sacked, partly depopulated,
    dismantled, and later its citadel yields.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kutuz had been captured by Mongols in boyhood, sold in Damascus and Cairo,
    claimed to be a nephew of Shah Mohammed, and added El Moizzi to his name after
    manumission.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kutuz justified taking authority from Mansur by saying a leader was needed
    to drive out the Mongols, and he later removed Mansur with Mansur's mother and
    brother to Damietta.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The new Sultan imprisoned eight generals, received the army's oath, prepared
    a campaign against the Mongols, and sent a reassuring letter to Prince Nassir
    of Syria.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hulagu took El Biret, freed Said from prison, crossed the Euphrates by bridges
    of boats, sacked Mahuj, left garrisons after killing inhabitants, and marched
    on Aleppo.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fear of the Mongols drove many people from Aleppo toward Damascus and from
    Damascus toward Egypt; winter cold, robbery, and plague increased their suffering.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Mongol division camped near Aleppo; part of Aleppo's garrison and volunteers
    sallied but quickly returned when they found the enemy superior in numbers and
    resolute.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some Aleppo forces occupied Bankussa, pursued Mongols who appeared to flee,
    fell into an ambush, and many perished while fleeing back toward the city gates.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hulagu summoned Moazzam to surrender and accept Mongol commandants in the
    city and citadel; Moazzam answered that only the sabre stood between them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The besiegers built a counter-wall in one night, trained twenty catapults
    on Aleppo, and took the city by assault on the seventh day of investment, January
    25, 1260.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Aleppo was sacked for five days and nights, many inhabitants were killed,
    certain houses and religious buildings were safeguarded as refuges, women and
    children were sold into slavery, and walls, mosques, and gardens were destroyed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: About one month after the city fell, the citadel yielded; the victors found
    booty and spared many artisans for captivity.
  category: sequence
  evidence_refs:
  - ev:8
