canonical_text:
  quote: ''
  summary: The passage narrates the prolonged Mongol siege of Siang yang and Fan ching,
    court concealment by Kia se tao, relief attempts by Sung forces, a supply flotilla
    that breaks through river defenses, the deaths of commanders who resist capture
    or submission, the use of Persian-built siege engines, the fall of Fan ching,
    and the renewed attack and attempted parley at Siang yang.
