canonical_text:
  quote: ''
  summary: 'The passage narrates Mongol military operations against Sung China: failed
    peace contacts, assassination of an envoy, naval and land battles, executions,
    surrenders rewarded with office, punishment and killing of a disgraced minister,
    fire-arrow attacks on a river fleet, renewed campaigning under Bayan, destruction
    of a city, panic in the Sung capital, and an appeal from the Empress blaming Kia
    se tao.'
  language: English
  quote_policy: summarized
