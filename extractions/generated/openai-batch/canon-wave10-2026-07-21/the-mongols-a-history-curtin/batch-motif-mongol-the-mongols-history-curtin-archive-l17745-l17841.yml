canonical_text:
  quote: ''
  summary: The passage narrates civil war and factional conflict at the late Mongol
    court in China. Polo Timur is pardoned and elevated, purges the palace, coerces
    the Empress Ki to summon the rebellious heir, faces defections, becomes violent
    and hated, and is killed under a secret imperial order. His head is sent to the
    heir, who returns with Kuku Timur and presses for imperial power. The passage
    then contrasts the divided Mongol court with Chu yuan chang's expanding rule,
    the defeat and suicide of Chang si ching, the child succession of Min ching under
    his mother, and the disappearance of Han lin ulh.
  language: English
  quote_policy: summarized
