  summary: The passage describes Hassan’s pulpit proclamation that his followers are
    released from religious law because the day of Resurrection has arrived as the
    Imam’s manifestation; celebratory banquets, dancing, music, wine, and sport follow.
    It summarizes an Ismailian view of endless cosmic epochs and Resurrection, marks
    17 Ramadan as a feast and calendar epoch, records Hassan’s claim to be Imam and
    God’s vicegerent with Reis Mossafer as his delegate, describes a similar festival
    at Mumin Abad, and gives a lineage and infant-substitution story used to support
    Hassan’s claimed Fatimid descent.
  language: English
