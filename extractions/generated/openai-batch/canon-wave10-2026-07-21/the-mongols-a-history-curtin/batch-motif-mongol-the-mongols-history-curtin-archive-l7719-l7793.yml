  summary: 'Historical narrative of Mongol raids and regional responses: Kamil of
    Egypt campaigns toward Amid, Mongol forces devastate areas west of Persia and
    around Erbil, the Kalif of Bagdad mobilizes for holy war, Mongols use an ambush
    stratagem near Khanekin, and Chormagun''s campaigns drive Georgian rulers and
    people toward mountain and fortress refuges.'
