canonical_text:
  quote: ''
  summary: The passage recounts Jinghis Khan's final Tangut campaign, the submission
    and killing of the Tangut ruler Li hien, the concealment of Jinghis's death, and
    the transport of his remains. It then gives legendary variants of his death, including
    a chronicle account in which Jinghis and the Tangut king Shidurgo engage in a
    shape-changing contest, Shidurgo is killed with a hidden triple magnetic dagger,
    and Kurbeljin Goa restores her beauty in the Kara Muren, bewitches Jinghis, and
    disappears in the river.
  language: English
  quote_policy: summarized
