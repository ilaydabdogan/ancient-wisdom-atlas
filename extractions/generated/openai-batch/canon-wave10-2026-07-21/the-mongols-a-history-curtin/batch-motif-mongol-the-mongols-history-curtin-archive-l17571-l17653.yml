canonical_text:
  quote: ''
  summary: The passage recounts Chagan Timur’s capture of Nan king, court intrigue
    around Togan Timur, disputes between Mongol commanders, Ali hwei Timur’s failed
    attempt to seize the throne, Chagan Timur’s later campaigns and assassination
    by Tien fong and Wang se ching, and Kuku Timur’s succession and violent revenge
    at Chagan Timur’s coffin, including an offering of the killers’ hearts to his
    father’s spirit.
