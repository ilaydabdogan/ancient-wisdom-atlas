- id: obs:1
  text: Kuyuk's installation is presented as a great Kurultai attended by subject
    rulers, ambassadors, monks from the Pope, and Rusudan's son.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rivalry of the King of Georgia and Rusudan's son leads to a division of
    their country, with David receiving Georgia proper and suzerainty while Rusudan's
    son receives Imeretia, Mingrelia, and Abhasia.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Cilician King Hayton sends his brother Sempad to Kuyuk's enthronement
    and receives additional cities from the Grand Khan.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nassir, Prince of Damascus, receives a letter of safe-conduct from the Grand
    Khan, carries it in his girdle, and gives splendid gifts in response.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mongol forces raid districts between the Euphrates and Tigris, pillage settlements,
    kill many people, massacre a caravan, seize goods and money, and then return to
    Khelal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After Kei Kosru's death, his three sons Yzz ud din, Rokn ud din, and Alai
    ud din succeed him; all three names appear on coinage and are mentioned in mosques
    at public service.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Shems ud din of Ispahan, the grand vizir, supports Yzz ud din, executes some
    supporters of Rokn ud din, marries the late Sultan's widow, and sends Rokn ud
    din to Kuyuk with tribute and presents.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Rokn ud din and Beha'i ud din Terjuman accuse Shems ud din before Kuyuk, after
    which Kuyuk orders Rokn ud din to take Yzz ud din's place and Terjuman to take
    Shems ud din's office.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Shems ud din sends Rashid ud din with gold and jewels to Kuyuk, but the envoy
    hides the treasures in the stronghold of Kemash and flees to Aleppo.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Terjuman arrives at Malattia with two thousand Mongols and proclaims the new
    Sultan.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Shems ud din is seized, tortured by Mongols sent by Terjuman in order to discover
    hidden treasures, and finally killed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Rum is later divided between Yzz ud din and Rokn ud din along the Sivas River;
