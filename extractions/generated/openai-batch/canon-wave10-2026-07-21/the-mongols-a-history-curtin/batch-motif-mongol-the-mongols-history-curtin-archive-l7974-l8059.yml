canonical_text:
  quote: ''
  summary: The passage describes Kuyuk's installation at a great Kurultai attended
    by many subject rulers and envoys; Mongol influence over Georgia, Cilicia, Damascus,
    Rum, and neighboring regions; raids and pillage by Mongol forces; and a succession
    struggle in Rum in which the Grand Khan's authority, tribute, gifts, coinage,
    public mosque mention, territorial division, seizure, torture, and hidden treasure
    all appear as political instruments.
  language: English
  quote_policy: summarized
