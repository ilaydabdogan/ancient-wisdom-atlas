candidate_motifs:
- id: motif:1
  label: Ritual food-sharing denied as kinship exclusion
  taxonomy_refs:
  - sacred_exchange
  basis: The widows prepare ancestor offerings, refuse sacrificed meats to Hoelun,
    and thereby exclude her from their ruling circle and relationship.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage shows ritual food denial and social exclusion; the taxonomy
    link to sacred exchange is functional rather than named in the passage.
- id: motif:2
  label: Abandoned widow and children survive in hardship
  taxonomy_refs: []
  basis: Hoelun is left by the leading kin group, loses Yessugai's followers, and
    supports her children in poor and hostile conditions.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  confidence: high
  cautions: No supernatural element is stated in this motif within the passage.
- id: motif:3
  label: Quarrel over seized food among siblings
  taxonomy_refs:
  - sibling_pair
  basis: Temudjin's golden-hued trout and earlier bird are taken by half-brothers,
    prompting complaint, maternal admonition, and escalating sibling conflict.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The relation includes half-brothers and a broader sibling group, not only
    a simple pair.
- id: motif:4
  label: Half-brother killing by paired brothers
  taxonomy_refs:
  - sibling_pair
  basis: Temudjin and Kassar approach Baiktar from opposite sides and kill him with
    arrows after his plea to spare Belgutai.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage frames the act as murder; any wider mythic interpretation
    requires comparison beyond the literal event.
- id: motif:5
  label: Birth omen of blood in hand
  taxonomy_refs:
  - sacred_birth
  basis: Hoelun rebukes Temudjin by saying he was born grasping blood in his fingers,
    and the narrator immediately links the killing to his future career of eliminating
    opponents.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage gives an ominous birth sign, but it does not describe divine
    parentage or explicitly call the birth sacred.
- id: motif:6
  label: Maternal counsel to unite against external enemies
  taxonomy_refs: []
  basis: Hoelun tells the boys not to quarrel because they are deserted and cannot
    yet punish the Taidjuts, urging them to agree and gain strength.
  evidence_refs:
  - ev:6
  - ev:10
  confidence: high
  cautions: This is a pragmatic counsel scene in the passage; no specific taxonomy
    family is asserted.
comparison_claims:
- id: claim:1
  claim: Hoelun explicitly compares the boys' quarreling to the sons of Alan Goa,
    supporting a cautious comparison to an internal Mongol legendary model of fraternal
    discord.
  claim_level: same_function
  target: sons of Alan Goa as invoked in Hoelun's speech
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only the allusion and does not recount the Alan Goa
    episode, so the comparison should remain limited to the function of admonishing
    quarrelsome brothers.
- id: claim:2
  claim: Hoelun's statement that Temudjin was born grasping blood, together with the
    narrator's career framing, supports comparison to a birth-portent pattern foreshadowing
    future violence.
  claim_level: same_function
  target: birth-portent or sacred_birth motif family
  evidence_refs:
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage presents the sign retrospectively in rebuke and does not
    describe divine sanction, miracle, or ritual validation.
