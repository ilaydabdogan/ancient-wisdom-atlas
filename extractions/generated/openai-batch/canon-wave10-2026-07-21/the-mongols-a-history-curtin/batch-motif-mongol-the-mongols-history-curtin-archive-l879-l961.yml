canonical_text:
  quote: ''
  summary: After Yessugai dies, Temudjin is brought home. Hoelun and her children
    are excluded from ancestor-offering meat and abandoned by leading kin, while Yessugai's
    followers are led away. Hoelun tries unsuccessfully to recover the people and
    then supports her children in poverty. A quarrel over a golden-hued trout and
    an earlier bird leads Temudjin and Kassar to kill their half-brother Baiktar with
    arrows. Hoelun rebukes them, recalling Temudjin's birth with blood in his fingers
    and comparing the brothers to predatory animals.
  language: English
  quote_policy: summarized
