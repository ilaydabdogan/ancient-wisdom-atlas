  text: Yessugai dies shortly after sending for Temudjin, and Munlik brings Temudjin
    home from Desaichan.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During ancestor-offering preparations, Ambagai's widows refuse to share sacrificed
    meats with Hoelun and thereby exclude her from their ruling circle and relationship.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Targutai Kurultuk and Todoyan Jirisha lead away people who had belonged to
    or been assembled by Yessugai.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: Charaha attempts to persuade Targutai and Todoyan to take Hoelun with them,
    but an unnamed warrior of Targutai mortally wounds Charaha with a spear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Temudjin seeks advice from the wounded Charaha, weeps after hearing that his
    father's people and relatives have been led away, and turns to Hoelun for help.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hoelun mounts, orders attendants to take lances, overtakes the deserting people,
    and stops half of them, though they still do not return with her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hoelun protects and supports her family in poor and hostile conditions, and
    her children make hooks from needles to fish in the river Onon.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Temudjin catches a golden-hued trout, and Baiktar and Belgutai take it from
    him; Temudjin also says Baiktar had earlier taken a bird he shot.
  category: action
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:9
  text: Hoelun counsels Temudjin and Kassar not to quarrel, reminding them that they
    have no friends and no present power to punish the Taidjuts.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Temudjin and Kassar rush out, find Baiktar herding horses on a hill, approach
    him from behind and in front, and aim arrows at him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Baiktar asks Temudjin and Kassar to spare Belgutai even if they kill him,
    then waits with his legs bent under him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Temudjin and Kassar kill Baiktar with arrows.
  category: action
