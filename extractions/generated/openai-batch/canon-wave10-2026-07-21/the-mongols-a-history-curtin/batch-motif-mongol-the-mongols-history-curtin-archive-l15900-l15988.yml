canonical_text:
  quote: ''
  summary: The passage recounts Kubilai Khan’s plans for renewed attacks on Japan
    and Cochin China, the coerced shipbuilding and levies for expeditions, repeated
    campaigns in Tung king, defeats and retreats caused by resistance, heat, rain,
    and disease, the deaths of generals and of Chingkin, the renewed submission of
    Chin ge suan with a gold statue, Kubilai’s punishment of Togan, and a reconnaissance
    mission to islands south of China followed by the arrival of ships bearing tribute
    or presents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kubilai planned a second attack on the Japanese islands, named Atagai chief
    of the expedition, and required ships and levies from Korea and Chinese provinces.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Forced dock workers and sailors deserted in crowds, robbed on highways, or
    became pirates along the coast, while the army and many council members opposed
    the Japanese expedition.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the King of Cochin China sent ambassadors, Kubilai refused them an audience
    and ordered Togan to march through Tung king and attack Cochin China, with Sutu
    aiding in planning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tung king had earlier submitted to Kubilai and agreed to pay tribute every
    three years, while Kubilai’s agent resided at its capital.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Chin ge suan, successor in Tung king, hated the Mongols, obstructed Togan’s
    demand for provisions, and led Togan to decide that Tung king must first be brought
    to obedience.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In 1285 Togan entered Tung king, crossed the Fu Hang River on rafts, found
    the enemy arrayed on the opposite bank, and saw them flee while their king vanished.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tung king forces rallied and harassed Togan’s army; summer heat and rains
    brought disease, the army retreated toward Yun nan, and Li heng died after being
    wounded by a poisoned arrow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sutu was cut off by Tung king men and died in battle at the Kien moan River;
    Kubilai grieved for him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Chingkin, whom Kubilai had declared his successor, died at forty-three and
    left three sons: Kamala, Dharma Bala, and Timur.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In 1286 the Japanese expedition was ready but Kubilai was dissuaded from it,
    leaving Japan in peace while a new expedition was sent toward Cochin China and
    Tung king.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the 1287 campaign Kubilai’s forces defeated Tung king men in seventeen
    engagements, ravaged part of the country, pillaged the capital, seized wealth,
    and retired to Yun nan.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the Mongols retired, Chin ge suan returned with large forces.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In 1288 Togan reentered Tung king, found the inhabitants armed, continued
    the campaign until summer disease forced a fallback, and then suffered attacks
    during retreat.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Situr saved Togan’s army by leading the vanguard and opening a way, while
    Togan lost many men, including the generals Fan tsie and Apatchi.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Chin ge suan later offered submission, asked Kubilai to forget past events,
    and sent a gold statue.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Kubilai punished Togan by taking away his rule in Yun nan, forbidding him
    the palace, and assigning him Yang chiu as a residence.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: Kubilai charged Yang ting pie to investigate secretly the forces and wealth
    of islands south of China, and ships from ten kingdoms later arrived at Tsuen
    chiu with stated tribute or possible presents.
  category: sequence
  evidence_refs:
  - ev:10
