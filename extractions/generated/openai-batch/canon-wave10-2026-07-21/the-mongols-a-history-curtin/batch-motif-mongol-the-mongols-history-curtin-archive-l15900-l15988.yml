candidate_motifs:
- id: motif:1
  label: Imperial expedition checked by local resistance and climate
  taxonomy_refs: []
  basis: The Tung king campaigns include entry by Togan, local resistance and harassment,
    disease associated with summer heat and rains, and retreat or fallback.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:8
  confidence: high
  cautions: This is a historical narrative pattern in the passage, not a mythic motif
    by itself.
- id: motif:2
  label: Submission expressed through tribute or offering
  taxonomy_refs: []
  basis: Tung king’s earlier submission involved periodic tribute; Chin ge suan later
    offered submission and sent a gold statue; ships of ten kingdoms arrived bearing
    stated tribute or possible presents.
  evidence_refs:
  - ev:2
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage presents diplomatic and political exchange; it does not describe
    the exchange as sacred.
- id: motif:3
  label: Dynastic succession through declared heir and descendants
  taxonomy_refs:
