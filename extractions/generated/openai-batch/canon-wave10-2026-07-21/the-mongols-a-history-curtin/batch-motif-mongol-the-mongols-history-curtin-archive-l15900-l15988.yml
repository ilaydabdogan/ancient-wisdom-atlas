  cautions: The passage gives a dynastic fact but does not elaborate a legitimation
    myth.
- id: motif:4
  label: Defeated commander punished by loss of rule and exclusion from palace
  taxonomy_refs: []
  basis: After the difficult Tung king campaigns, Kubilai removes Togan from Yun nan
    rule, forbids him the palace, and assigns him another residence.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is a political punishment pattern, not explicitly mythological.
- id: motif:5
  label: Secret reconnaissance preceding tribute from distant islands
  taxonomy_refs: []
  basis: Kubilai sends Yang ting pie to learn secretly about islands south of China,
    and the next year ships from ten kingdoms arrive with stated tribute or possible
