canonical_text:
  quote: ''
  summary: 'The passage summarizes events in Timur''s reign: settlement with Burma
    through tribute, patent, and seal; a later Burmese usurpation and failed punitive
    expedition; resistance in regions west of Yunnan after refusal of China''s calendar;
    revolt among hill and mountain peoples; and episodes in the northern war against
    Kaidu and Dua, including a failed cavalry warning cordon, capture and sparing
    of Kurguez, and arrests of negligent commanders and distrusted returnees.'
  language: English
  quote_policy: summarized
