canonical_text:
  quote: ''
  summary: A Kin emperor retreats from the capital area amid Mongol pressure, suffers
    losses at the Hoang Ho crossing, and later flees by night. Pien king is besieged
    by Mongol forces under Subotai and undergoes famine. Tsui li seizes power inside
    the city, installs a regent, submits to Subotai, dismantles defenses, extorts
    wealth, and sends royal captives, learned persons, and skilled workers to the
    Mongol camp. Subotai executes male members of the reigning family and sends the
    Empresses and princesses toward Mongolia, where they suffer privation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A commandant entered the capital and reported that the country was ruined
    westward, after which the Emperor went east and crossed the Hoang Ho hoping to
    gain help from Shan tung.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A strong wind prevented troops on the southern bank of the Hoang Ho from following
    the Emperor; a Mongol division appeared there, a battle followed, two Kin generals
    were lost, and about one thousand men died, mostly by drowning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After hearing of his lieutenant's victory, Subotai invested the capital with
    severity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Baksan allowed his men to pillage during his march, and inhabitants fled to
    Wei chiu and closed its gates against his warriors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Baksan withdrew, was followed by She tian tse, and urged the Emperor to recross
    the Hoang Ho and take refuge at Kwe te fu; the Emperor crossed by night with seven
    officers, and his troops scattered after learning of his flight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: During the siege of Pien king, food prices rose greatly, people died of hunger,
    officials begged, some men ate wives and children, and houses were torn down for
    fuel.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tsui li killed high officials in his presence, entered the palace armed, held
    a council, and proclaimed Prince Wa nien tsung ko as regent.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tsui li took high offices for himself and his relatives, sent submission to
    Subotai, went out to meet him dressed in royal fashion, and burned the outlooks
    and wooden towers on the city walls.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: Tsui li assembled the regent, Empresses, and ruling family under guard, moved
    into the Emperor's palace, and sent jewels, precious objects, and state robes
    to Subotai.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Tsui li detained selected women from noble households, compelled people to
    bring silver and gold, used torture in searches for wealth, and induced the dowager
    to write to the Emperor urging submission.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Tsui li sent the Empresses, regent, royal family members, a descendant of
    Confucius, learned men, physicians, artists, actors, and embroiderers to Subotai's
    camp.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Subotai immediately put all male members of the reigning family to death and
    sent the Empresses and princesses to Mongolia, where they suffered want and privations
