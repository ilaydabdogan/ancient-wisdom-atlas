canonical_text:
  quote: ''
  summary: Jinghis addresses several companions and commanders, recalls prophecies,
    Heaven-sent tidings, battle services, birth-time service, and truthful counsel,
    then grants offices, command assignments, hereditary dignity, women, a wife, regional
    authority, pardons, and other rewards.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jinghis recalls that at Hurho Nachubur, under a thick spreading tree where
    Khan Kutula made merry and danced, Heaven bestowed wisdom and tidings that became
    clear to Mukuli.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jinghis makes Mukuli a prince, commander of ten thousand on the left wing,
    governor toward the Haralin mountains, and says Mukuli's descendants will inherit
    his dignity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Jinghis says Horchi prophesied about him in youth, shared hardships as a comrade,
    and now receives rewards after his words of foreknowledge are verified.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Horchi is granted the right to choose thirty beautiful maidens and women from
    conquered nations and is assigned to assemble, command, govern, and guard peoples
    and camps near the Irtish among forest nations.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Jinghis recounts Churchadai's battle service, including taking the vanguard,
    breaking enemy forces, wounding Sengun, fighting at Baljuna, and devising a plan
    against Jaganbo.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Jinghis gives his wife Ibaha, daughter of Jaganbo, to Churchadai as a high
    reward, while asking Ibaha to leave Ashi Timur and one hundred men with him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Jinghis orders Churchadai to govern four thousand of the Units and assigns
    Churchadai, Chelmai, Chepe, and Subotai to the battle front, describing them as
    swift raging watch-dogs and as able to overcome stones, cliffs, and deep waters.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Jinghis assigns Boorchu, Mukuli, Boroul, and Chilaun to be behind him, makes
    Kubilai elder in warlike matters and decisions, and places Baidun under Churchadai
    because of disobedience.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Jinghis describes Hunan as a fearless wolf at night and a black raven by day,
    directs others to take counsel with Hunan and Kokosi, and appoints Hunan commander
    of ten thousand under Juchi.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Jinghis says Hunan, Kokosi, Daigai, and Usun did not withhold or distort what
    they heard and saw.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Jinghis tells Chelmai that when Jinghis was born at the river Onon, Chelmai's
    father came from Mount Burhan with blacksmith bellows and a sable wrap, and gave
    the infant Chelmai to serve Jinghis for life.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Jinghis calls Chelmai his fortunate comrade, says Chelmai has shown immense
    service, and releases him from nine death penalties while rewarding him.
  category: action
  evidence_refs:
  - ev:7
