canonical_text:
  quote: ''
  summary: The passage recounts Mongol military actions against the Kin capital Chong
    tu, including the defeat of a relief convoy, famine during the siege, the governor
    Fu sing's suicide, Chin chong's flight, slaughter and burning of the palace, and
    Jinghis Khan's orders for further campaigns. It also narrates campaigns against
    the Merkits, Tumats, Kirghis, Kitans, Tangut, and Corea, and describes Jinghis
    rewarding Mukuli with hereditary princely rank, command in China, and a gold seal
    of authority.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Utubu summoned his son to Nan king after hearing of a new Mongol inroad, while
    Chong tu was poorly provisioned and fearful of the nearby Mongols.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Utubu sent a large food transport under Li ing with a numerous army, but the
    Mongols attacked, Li ing was killed, the battle was lost, and the transport was
    seized.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the transport disaster, troops under two other Kin generals dispersed
    and went home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The besieged city was cut off and suffered severe hunger, including the devouring
    of the dead and the killing of living men for food.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fu sing proposed that Chin chong attack the Mongols with all forces in the
    city and either die fighting or conquer.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fu sing gave his possessions to his servitors, took poison, and died.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Chin chong fled the city and left the Imperial princesses behind after they
    asked him to save them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A great slaughter occurred in the capital, and the palace was set on fire
    and burned for about a month or longer, according to the passage.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Jinghis sent officers to receive Imperial plunder and praise Mingan for his
    siege work.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Jinghis sent Samuka with ten thousand men to attack Nan king and capture the
    Emperor, but Samuka retreated because his force was too small; a later second
    attempt also failed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage states that the Kin dynasty was approaching doom and extinction.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: Subotai defeated Merkits near the Jem River in the Altai; two sons of Tukta
    Bijhi and his brother Kutu were slain, while Kultuk Khan was captured.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Kultuk Khan demonstrated archery skill by shooting an arrow into a goal and
    splitting it with a second arrow.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: Juchi asked Jinghis to spare Kultuk Khan, but Jinghis refused, and Kultuk
    died like the others.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: Boroul crushed the rebellious Tumats but died in a close and bitter conflict.
  category: action
  evidence_refs:
  - ev:14
- id: obs:16
  text: Juchi reduced the Kirghis after they rose against Jinghis.
  category: action
  evidence_refs:
  - ev:15
- id: obs:17
  text: Mukuli recovered the Kitan region by strategy, finesse, and fighting, and
