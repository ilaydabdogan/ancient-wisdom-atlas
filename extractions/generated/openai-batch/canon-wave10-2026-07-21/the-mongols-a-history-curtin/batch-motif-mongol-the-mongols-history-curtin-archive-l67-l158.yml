  summary: 'The passage explains several historical uses of the word Mongol: a narrow
    sense for peoples south of Lake Baikal and north of the Gobi, broader Asian and
    European uses, and an expansive racial classification. It summarizes geographical
    spread, lists groups and dynastic records associated with the name, and describes
    an early Mongol homeland in a mountain-and-river region whose waters flow toward
    both the Pacific and Arctic basins.'
