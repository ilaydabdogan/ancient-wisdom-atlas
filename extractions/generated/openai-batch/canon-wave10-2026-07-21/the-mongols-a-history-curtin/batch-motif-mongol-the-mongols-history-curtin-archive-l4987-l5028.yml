    fates.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The fifty thousand permitted to return to the city did so after paying two
    hundred thousand gold pieces, and the city received Mongol commandants.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Later requisitions of men and the nonreturn of many people left Samarkand
    ruined and unoccupied for a long time.
  category: setting
  evidence_refs:
