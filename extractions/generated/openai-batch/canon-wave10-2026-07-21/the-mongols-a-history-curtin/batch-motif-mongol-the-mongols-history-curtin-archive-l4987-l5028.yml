canonical_text:
  quote: ''
  summary: After Samarkand's surrender, Alb Khan escapes by a night sortie, while
    the citadel is stormed the next day and defenders in a mosque are burned. The
    surrendered Kankalis are separated, disarmed, made to appear Mongol-fashion, and
    then killed. A census divides the surviving population into allotted skilled persons,
    siege laborers, and ransomed returnees, while later requisitions leave the city
    ruined. Jinghis Khan has prevented Shah Mohammed from relieving the cities and
    sends chosen men to hunt him down, with the ruler compared to fleeing animals
    and a hunted beast or outcast.
  language: English
  quote_policy: summarized
