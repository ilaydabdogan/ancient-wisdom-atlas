canonical_text:
  quote: ''
  summary: The passage recounts the recognition and installation of Ahmed as the Abbasid
    Kalif Al Mostansir Billahi, his reciprocal investiture of Sultan Beibars, public
    ceremonies of oath, regalia, prayer, coinage, procession, and sermon, followed
    by Mostansir's expedition toward Baghdad, mixed support and refusal from towns,
    violence at Hitt and Anbar, and his disappearance after defeat by Mongol forces
    near Anbar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chief functionaries and ulema assembled in the palace; Ahmed's genealogy was
    established, and Taj ud din administered the oath of allegiance while the Sultan
    pledged conditional homage tied to Islamic divine law and prophetic traditions.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kalif invested Beibars with sovereignty over countries submitted to Islam
    and those that might be freed from unbelievers; the act was fixed in a diploma,
    and those present pledged faith and homage to the Kalif.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sultan ordered provincial recognition of the new Kalif, including mention
    of his name in public prayers and stamping it on new coinage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kalif gave the Sultan a mantle of the House of Abbas, later appeared publicly
    on a white steed with distinctive garments and weapons, and installed the Sultan
    with robes of office and a gold chain.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The diploma conferring power on Beibars was read and then carried above the
    heads of the vizir and grand marshal during the Sultan's solemn procession through
    the decorated city.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At a Friday sermon in the citadel mosque, the Sultan arranged for gold and
    silver coins to be showered from above onto the Kalif's person, interrupting the
    discourse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Beibars formed a household and military retinue for the Kalif, including officers,
    horsemen, servants, Mameluks, mounted warriors, and Beduins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Sultan and Kalif left Cairo for Damascus; later the Kalif took the road
    toward Baghdad with appointed generals, while some companions halted and other
    emirs joined him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: On the Euphrates route, Al Hakim adhered to Mostansir after Turkmen accompanying
    him deserted; Ana accepted the Sultan-recognized Kalif, Baditse acted similarly,
    and Hitt refused to open its gates.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hitt was taken by violence, and the Kalif's warriors plundered Christians
    and Jews in the city.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kara liuga or Kara Buga, commander of Mongols guarding Arabian Irak, marched
    on Anbar with cavalry, entered suddenly, and cut down people; Bahadur Ali, governor
    of Baghdad, joined with garrison troops.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Near Anbar, the Kalif placed Turkmans on his right, Arabs on his left, and
    himself in the center; after an ambush and the flight of the wings, the center
    was surrounded, overpowered, and cut to pieces.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Kalif was lost in the chaos and was never seen again; reports differed
    on whether he was killed or escaped and later died of wounds.
  category: sequence
  evidence_refs:
  - ev:10
