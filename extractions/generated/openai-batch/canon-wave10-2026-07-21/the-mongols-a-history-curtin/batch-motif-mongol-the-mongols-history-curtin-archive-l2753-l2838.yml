canonical_text:
  quote: ''
  summary: After defeating the Keraits, Temudjin spares and rewards Hadak for loyal
    defense of Wang Khan, distributes Kerait people and property, incorporates Jaganbo's
    daughters into his family arrangements, and rewards Kishlik and Badai for warning
    him of treachery. He attributes his victory and survival to Heaven. Wang Khan
    and Sengun flee; Wang Khan is killed at a Naiman ford, while Sengun is later deserted
    by Kokocha, whose wife refuses to abandon her master. Temudjin executes Kokocha
    and rewards the wife. Wang Khan's head is ritually honored, then made into a silver-rimmed
    skull cup by Baibuga, who declares that there cannot be two lords on earth just
    as there is only one sun in heaven. Sengun is later slain, his family is sent
    to Temudjin, and the Keraits cease to exist as a separate people.
  language: English
  quote_policy: summarized
