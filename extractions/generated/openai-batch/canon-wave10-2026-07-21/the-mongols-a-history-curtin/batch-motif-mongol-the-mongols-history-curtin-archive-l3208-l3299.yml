canonical_text:
  quote: ''
  summary: Jinghis addresses several companions and households, recalls earlier services
    rendered to him and his family, and grants rewards including command over people,
    ceremonial food-distribution honors, legal pardons, land for camps, freedom from
    servile status, rights to booty and game, and military commands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jinghis tells Vanguru that he stayed with him in one camp, did not lose the
    way in darkness and fog, did not lose composure in disorder, and endured cold
    and wet with him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vanguru asks to collect the scattered Baivuts; Jinghis consents and tells
    him to command and govern them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Jinghis says Vanguru and Boroul pleased him as masters of nourishment by dispensing
    food justly, and he grants them special places and duties when food and drink
    are distributed at gatherings and feasts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jinghis says his mother took Shigi Kutuku, Boroul, Kuichu, and Kokoelm from
    abandoned camps, made them her sons, and reared them as comrades for her own children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Jinghis says Boroul was his comrade in battle perils and bad weather and did
    not let him lack drink or food when exposed to the enemy.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hargil Shila, a fleeing Tartar, came hungry to Jinghis's mother, sat near
    the entrance, seized five-year-old Tului, and took a knife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Altani rushed at Hargil Shila, caught his hair, and pulled away the knife;
    Chedai and Chelmai heard her screaming, ran with weapons, and killed the stranger.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Altani, Chedai, and Chelmai argued about who had performed the greatest service
    in saving Tului, and Altani won the verbal dispute.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the struggle with Wang Khan at Kalanchin, Ogotai was wounded in the neck
    by an arrow, and Boroul sucked the blood from the wound, saving him from stifling.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Jinghis says Boroul saved two of his sons and grants that he will be saved
    nine times from suffering the death penalty.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Jinghis says Sorgan Shira, with his son, hid him at a yurta after Targutai
    Kurultuk and the Taidjuts captured him, ordered Kadan to serve him, and gave him
    freedom.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Sorgan Shira and his household ask to make a camp in Merkit land at Sailyange;
    Jinghis grants the request and adds privileges for descendants involving bows
    and arrows, wine in the Khan's camp, and forgiveness for nine death offenses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Jinghis tells Chilaun and Chinbo that he remembers their earlier words and
    deeds and tells them to come to him if anything fails them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Jinghis declares Sorgan Shira, Badai, and Kishlik free, allows them to keep
    booty taken in war and game killed in hunting, and invites them to live with him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Jinghis says Naya and his father seized Targutai but refused to hand over
    their master, came to Jinghis as subjects, and were judged by Jinghis to understand
    lofty duty.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Jinghis states that Boorchu commands ten thousand on the right hand and Mukuli
    commands ten thousand on the left, and he appoints Naya as a commander in the
    center.
  category: action
  evidence_refs:
  - ev:8
