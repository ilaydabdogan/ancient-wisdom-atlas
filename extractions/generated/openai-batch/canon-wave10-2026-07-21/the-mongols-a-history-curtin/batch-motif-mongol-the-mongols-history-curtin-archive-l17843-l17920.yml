canonical_text:
  quote: ''
  summary: The passage recounts the submission of Fang kwe chin, the Ming advance
    under Chu yuan chang and his generals, a proclamation that Heaven had transferred
    power from the Mongols to a virtuous warrior, Chu's proclamation as emperor and
    naming of the Ming dynasty, Togan Timur's flight north, the fall of Ta tu, and
    later Ming-Mongol conflict around Kara Kurum.
  language: English
  quote_policy: summarized
