canonical_text:
  quote: ''
  summary: The passage recounts the fall of Ahmed, a hated and abusive minister of
    Kubilai, after Chingkin and others oppose him and Wang chu assassinates him. Kubilai
    first punishes the assassins and honors Ahmed, but later, after the discovery
    of a diamond and other disclosures, orders Ahmed's corpse dishonored and punishes
    his household and clients. The passage then recounts a similar accusation against
    Sanga, Ahmed's successor in finance, whose hidden pearls and precious stones are
    exposed by an officer and a favored Persian.
  language: English
  quote_policy: summarized
