    replacement saplings, Mangu's execution of officers and rival figures, punishments
    of women accused of magic, dispersal and deprivation of Ogotai's descendants,
    rewards to loyal allies, and a transition to the fate of the Uigur sovereign and
    a deferred marriage alliance.
