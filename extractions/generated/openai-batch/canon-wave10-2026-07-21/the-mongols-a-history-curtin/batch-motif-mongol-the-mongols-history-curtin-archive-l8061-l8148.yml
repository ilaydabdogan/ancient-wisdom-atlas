canonical_text:
  quote: ''
  summary: The passage recounts Mongol-era succession and diplomacy involving Mangu,
    the rival Rum brothers Yzz ud din and Rokn ud din, envoy substitution, forged
    letters, accusations of magic and poison, Batu's inspection of envoys, Alai ud
    din's death on the road, Mangu's division of Rum, later military enforcement by
    Baidju and confirmation by Hulagu, and Hayton of Cilicia deciding to petition
    the Grand Khan after oppressive tax collection in Armenia.
  language: English
  quote_policy: summarized
