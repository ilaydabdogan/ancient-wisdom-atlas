- id: ev:7
  type: summary
  locator: lines 12694-12700
  quote_or_summary: Beibars summoned judicial, military, noble, and European witnesses,
    had Hulagu's letters to Mogith read, declared them the cause of detention, seized
    Karak, returned to Cairo, and killed Mogith.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain source; passage supplied in request.
- id: ev:8
  type: summary
  locator: lines 12700-12706
  quote_or_summary: Hulagu devoted attention to building a palace at Alatag and finishing
    the observatory at Meraga; he liked learned men, especially astronomers and alchemists,
    and spent large sums on the latter.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain source; passage supplied in request.
- id: ev:9
  type: summary
  locator: lines 12708-12717
  quote_or_summary: Hulagu's rule extended from the Oxus to Syria and the Byzantine
    Empire; he assigned provinces to Abaka, Yshmut, Tudan, Moyin ud din Pervane, Melik
    Sadr ud din, Ikiatu, and possibly Turkan Khatun.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain source; passage supplied in request.
- id: ev:10
  type: summary
  locator: lines 12718-12721
  quote_or_summary: Hulagu put vizir Seif ud din Bitikdji to death, replaced him with
    Shems ud din Juveini, and made Juveini's brother governor of Bagdad.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain source; passage supplied in request.
- id: ev:11
  type: summary
  locator: lines 12722-12729
  quote_or_summary: Hulagu condemned Zein ud din Muyyed Suleiman, known as El Hafizzi,
    for allegedly turning part of Damascus's income to his own profit and reproached
    him for betraying Hulagu and earlier princes.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain source; passage supplied in request.
- id: ev:12
  type: summary
  locator: lines 12731-12734
  quote_or_summary: The death sentence against El Hafizzi included his family, brothers,
    relatives, and clients, fifty persons total; only his son and nephew escaped.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain source; passage supplied in request.
- id: ev:13
  type: summary
  locator: lines 12736-12745
  quote_or_summary: Fars had submitted to Mongol dominion; Abu Bekr's successor sent
    homage and rich presents to Ogotai, who gave a patent of investiture and title,
    while Fars paid annual gold tribute and gifts.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain source; passage supplied in request.
- id: ev:14
  type: summary
  locator: lines 12747-12749
  quote_or_summary: Seljuk Shah came with rich presents to greet Hulagu, was fittingly
    received at the Oxus, and was afterward imprisoned.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain source; passage supplied in request.
