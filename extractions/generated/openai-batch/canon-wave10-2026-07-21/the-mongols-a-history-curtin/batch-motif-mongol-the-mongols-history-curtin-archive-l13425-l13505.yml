canonical_text:
  quote: ''
  summary: 'After the fall of a Kin capital is anticipated, Ye liu chu tsai persuades
    Ogotai not to massacre the inhabitants and to cancel a law requiring death for
    inhabitants of stormed cities. The passage then follows the Kin sovereign’s declining
    position: executions, Kuan nu’s seizure of control, a deceptive negotiation with
    Temutai followed by a night attack using fireworks arrows, failed moves toward
    Tsai chiu, Sung-Mongol pressure, and the last refuge of the Kin sovereign. It
    ends with Tsi yang shen captured while fighting; he refuses homage to Ogotai,
    bows south toward his own emperor, and is killed.'
  language: English
  quote_policy: summarized
