canonical_text:
  quote: ''
  summary: 'The passage recounts Buri Buga''s dying words, Talaigutu''s pledge of
    descendants to Temudjin and related household transfers, Hoelun''s rearing of
    boys, and a historical account of Togrul/Wang Khan of the Keraits: the death of
    Markuz, his widow''s revenge through hidden warriors, Togrul''s dynastic conflicts,
    alliances with Yessugai and Temudjin, recovery of Temudjin''s stolen wife, Togrul''s
    exile and restoration, and later campaigns against Barins and Merkits.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The dying Buri Buga says he had feigned defeat out of fear of the Khan and
    that his life has now been taken.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Talaigutu commands his eldest son Gunua and Gunua's sons Mukuli and Buga to
    serve Temudjin forever, with severe bodily punishment named if they leave his
    doors.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Talaigutu commands Chilaun and Chilaun's sons Tunge and Hashi to guard Temudjin's
    golden doors, with death named as the penalty for failure.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Talaigutu gives Chebke to Temudjin's brother Kassar; Chebke gives the boy
    Boroul, found in the Churki camp, to Hoelun.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hoelun places Kuichu, Kokochu, Shigi Kutuku, and Boroul with her own children
    and rears them while watching by day and listening by night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Togrul of the Keraits is identified as Wang Khan and as a man with important
    dealings with Temudjin and with Yessugai, Temudjin's father.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Markuz Buyuruk is captured by Naur, sent to the Kin emperor, nailed to a wooden
    ass, and chopped into pieces.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Markuz's widow seeks vengeance by approaching Naur with feigned homage and
    possible marriage, bringing sheep, mares, and cowskins said to hold distilled
    mare's milk but actually holding armed warriors.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: During Naur's feast, the men hidden in the cowskins are released and, with
    the widow's attendants, kill Naur and his household.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Togrul succeeds his father by killing two uncles and cousins, is driven out
    by Gurkhan with Naiman support, then seeks Yessugai's aid and is reinstated.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Togrul vows endless friendship to Yessugai and becomes his sworn friend or
    anda.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: After Yessugai is poisoned and young Temudjin loses authority, Togrul helps
    and harbors Temudjin.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: When Merkits steal Temudjin's wife after his marriage, Togrul assists in restoring
    her and part of Temudjin's people.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: After receiving the title Wang Khan, Togrul is later expelled by his brother,
    lives poorly on goat milk, asks Temudjin for help, receives cattle, and is honored
    with a feast and a promise to be treated as father and ally.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Temudjin and Wang Khan fight Barins and Merkits as allies; later Wang Khan
    conducts a Merkit campaign alone, seizes people and herds, and gives none of that
    booty to Temudjin.
  category: sequence
  evidence_refs:
  - ev:11
