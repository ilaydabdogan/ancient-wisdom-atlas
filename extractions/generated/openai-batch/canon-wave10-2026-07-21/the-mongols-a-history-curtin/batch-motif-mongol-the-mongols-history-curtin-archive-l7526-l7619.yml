canonical_text:
  quote: ''
  summary: The passage narrates Jelal ud din's final flight from Mongol pursuit near
    Amid, his abandonment by Otuz Khan, the deaths of many guards, his escape into
    the mountains, capture by Kurds, and killing by a Kurd seeking vengeance. It adds
    that his death ended the Kwaresmian dynasty, gives a character description and
    critique, describes the recovery of his effects and burial by Mozaffer, and reports
    later claims that Jelal had survived, including impostors or claimants put to
    death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jelal abandoned the Ispahan journey, went toward Amid, drank in camp, dismissed
    a warning about foreign troops, and was surprised by Mongols at daybreak.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mongols surrounded the Sultan's pavilion while he slept; Orkhan drove
    the enemy away, and Jelal's household officers got him a tunic and horse.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Jelal ordered two principal officers to guard one of his wives, a daughter
    of the Fars prince, during flight.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jelal sent Orkhan in another direction to draw off the Mongols, rode toward
    Amid with one hundred horsemen, found the city gates closed, fled toward the Tigris,
    and then doubled back.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Jelal stopped for the night at a granary; Otuz Khan deserted while he slept,
    and Mongols caught up at daybreak while Jelal's guards fought them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Most of Jelal's men were slain defending him; fifteen Mongols pursued him,
    two reached him, and he killed both before escaping on a superior horse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Jelal entered the mountains alone, was captured and stripped by Kurds, revealed
    his identity to their chief, and was left in the care of the chief's wife while
    the chief sought horses.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Another Kurd learned that the captive was said to be the Sultan, named his
    brother's death at Khelat as a grievance, pierced Jelal with a javelin, and killed
    him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that the Kwaresmian dynasty perished with Jelal ud din.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage reports Mohammed of Nessa's description of Jelal's stature, face,
    complexion, bravery, gravity, silence, and languages, followed by a negative assessment
    of his foresight, wisdom, conduct, drinking, and leadership.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Mozaffer sent men to collect Jelal's effects; his horse, saddle, and sabre
    were recognized by his generals, and his corpse was placed in a mausoleum.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: After Jelal's death, reports circulated that he had been seen in various places;
