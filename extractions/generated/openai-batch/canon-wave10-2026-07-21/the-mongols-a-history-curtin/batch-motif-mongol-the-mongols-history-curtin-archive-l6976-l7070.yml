canonical_text:
  quote: ''
  summary: The passage recounts Ghiath's desertion, appeal to the Kalif, pursuit by
    Jelal, asylum at Alamut, subsequent flight to Kerman, coercion of his mother Beglu
    Ai by Borak, a failed conspiracy, and Borak's execution of Ghiath, Beglu Ai, and
    their followers. Borak sends Ghiath's head to Ogotai Khan to secure Mongol friendship.
    The passage then describes Jelal's attempts to gain allies among Kankali Turks
    and Kipchaks, plans involving Derbend, claims against Shirvan and Georgia, and
    a council scene in which Jelal rejects cautious military advice with a lion-and-sheep
    comparison.
  language: English
  quote_policy: summarized
