canonical_text:
  quote: Heaven knows my decision.
  summary: The passage narrates the final siege of Tsai chiu, extreme famine inside
    the city, assaults by Mongol and Sung forces, Nin kia su’s failed escape and transfer
    of the throne to Ching lin, the city’s final breach, and the suicides and funerary
    acts surrounding the fall of the Kin dynasty.
  language: English
  quote_policy: quoted
