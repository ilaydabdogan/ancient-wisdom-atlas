candidate_motifs:
- id: motif:1
  label: siege famine and cannibalism
  taxonomy_refs: []
  basis: The city suffers scarcity, disease, use of human flesh as food, and consumption
    of leather, bones, captives, wounded, and vulnerable inhabitants.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: high
  cautions: This is a historical siege motif in the passage, not a cosmological or
    divine famine pattern.
- id: motif:2
  label: women disguised as men defending a last refuge
  taxonomy_refs: []
  basis: Young women with strength dress in men’s clothes and carry fagots and stones
    to defend the Emperor’s last refuge.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives no further individualization of these women or outcome
    specific to them.
- id: motif:3
  label: breached wall revealing hidden inner defense
  taxonomy_refs: []
  basis: Attackers seize part of the bulwarks but discover a new wall behind the first
    and a broad moat between them.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage presents this as military fortification rather than an explicitly
    symbolic labyrinth or ordeal.
- id: motif:4
  label: last sovereign refuses survival after dynastic fall
  taxonomy_refs:
  - royal_legitimacy
  basis: Nin kia su speaks of being the last sovereign of a long dynasty, rejects
    survival in confinement or contempt, and later hangs himself.
  evidence_refs:
  - ev:5
  - ev:11
  confidence: medium
  cautions: The royal_legitimacy taxonomy link is broad; the passage emphasizes dynastic
    reputation and sovereign status rather than a formal legitimacy doctrine.
- id: motif:5
  label: emergency transfer of sovereignty during disaster
  taxonomy_refs:
  - royal_legitimacy
  basis: Nin kia su yields the throne to Ching lin, instructs him that he may rescue
    the dynasty, and Ching lin takes the seal and is enthroned during the final breach.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The new reign is immediately overtaken by the city’s fall, limiting any
    developed restoration motif.
- id: motif:6
  label: sovereign suicide with commanded cremation
  taxonomy_refs: []
  basis: Nin kia su announces readiness to die, orders his intimates to burn his dead
    body, and hangs himself; palace officials burn the body.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage records a funerary command and suicide but does not frame
    the act as sacrifice.
- id: motif:7
  label: collective honorable drowning after defeat
  taxonomy_refs: []
  basis: Hu sha hu drowns himself in the river to avoid death by an ignoble hand,
    and five officers with five hundred men follow his example.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The motive is stated for Hu sha hu; the passage says the others followed
    his example but does not separately state each person’s motive.
- id: motif:8
  label: silent surprise assault by gagged soldiers
  taxonomy_refs: []
  basis: Meng kong’s men gag their mouths, move silently, enter through breaches with
    ladders, and fight until sunset.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is an episode of military stratagem rather than an explicitly mythic
    trickster or initiation motif.
