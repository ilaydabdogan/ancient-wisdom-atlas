canonical_text:
  quote: ''
  summary: The passage describes the Kentei Khan and Mount Burhan region as the early
    Mongol homeland, marked by rivers, pasture, herding, raiding, conflict, and the
    capture of women. It then presents Temudjin as a uniquely successful world conqueror
    and frames his origin as mythic genealogy. The account names a blue wolf and gray
    doe as first mythic parents of Temudjin's family; they cross a lake, settle near
    the Onon at Mount Burhan, and have a son, Batachi. Later descendants include the
    brothers Duva Sohor, a one-eyed man with extraordinary sight, and Doben. From
    Mount Burhan Duva sees migrating people and directs Doben to Alan Goa, who later
    bears Doben sons. The passage also gives Alan Goa's lineage and describes clan
    formation around Mount Burhan.
  language: English
  quote_policy: summarized
