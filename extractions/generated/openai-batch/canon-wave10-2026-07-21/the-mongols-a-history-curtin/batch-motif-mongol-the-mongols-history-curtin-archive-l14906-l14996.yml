  quote: ''
  summary: The passage describes Kubilai Khan's response to the arrest of his envoy
    by the Sung court, his delayed campaign against the Sung due to other conflicts,
    the revolt and defeat of Li tan, the succession of the Sung emperor Tu tsong,
    Liu ching's defection and strategic advice, a failed attempt by Kia se tao to
    entice Liu ching back with princely insignia, and the opening stages of the siege
    of Siang yang, including famine strategy and river warfare.
  language: English
