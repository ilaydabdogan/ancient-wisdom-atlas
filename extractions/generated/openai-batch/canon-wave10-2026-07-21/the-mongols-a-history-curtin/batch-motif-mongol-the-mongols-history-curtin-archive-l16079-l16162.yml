canonical_text:
  quote: ''
  summary: The passage recounts reversals among Sarban, Shireki, Yubukur, and Kubilai,
    followed by Kaidu's new anti-imperial league with Nayan, Singtur, and Kadan. Kubilai
    prevents Kaidu and Nayan from joining forces, advances against Nayan, consults
    astrologers, deploys a cavalry-infantry formation, and appears in a tower borne
    by armored elephants beneath a sun-and-moon standard. Nayan is defeated, captured,
    and killed without bloodshed; his reported Christian cross standard is contrasted
    with Kubilai's standards. A later campaign by Timur defeats Singtur and Kadan.
  language: English
  quote_policy: summarized
