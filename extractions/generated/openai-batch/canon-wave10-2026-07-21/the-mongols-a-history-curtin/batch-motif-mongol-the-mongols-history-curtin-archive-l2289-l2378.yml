canonical_text:
  quote: ''
  summary: The passage describes Temudjin executing a suspected spy, resisting a hostile
    confederacy that is weakened in mountain storm and fog, wintering with Wang Khan,
    entering and then losing proposed marriage alliances, and becoming the target
    of Jamuka's accusations and a plot involving Sengun and others; Wang Khan initially
    rejects the accusations against Temudjin by appealing to Heaven and Jamuka's unreliability.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Temudjin calls an unnamed man a son of his enemy and a spy, says he has no
    cause to spare him, and has the man's head cut off.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tukta Bijhi returns from Lake Baikal, attacks Temudjin, is baffled, and then
    turns to Buiruk of the Naimans, who joins a wider confederacy against Temudjin.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Temudjin is supported by Wang Khan and retires toward mountain lands near
    the Kitan border in order to draw the enemy into dangerous high passes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wind, snow, and dense fog, said to have been brought by magicians, stop the
    fighting and force the confederates to retreat with heavy losses of men and horses.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Jamuka plunders weakened portions of the confederate groups and then encamps
    near Temudjin and Wang Khan while closely observing events.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Temudjin and Wang Khan winter on level land near the mountains, where snow
    serves as water.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Marriage arrangements are proposed between Juchi and Chaur Bijhi, and between
    Kush Buga and Kutchin Bijhi, but the agreements are later broken and followed
    by coolness between Temudjin and Wang Khan.
  category: relationship
  evidence_refs:
  - ev:7
