candidate_motifs:
- id: motif:1
  label: enemy confederacy defeated by mountain weather
  taxonomy_refs: []
  basis: A coalition follows Temudjin into mountain terrain, but wind, snow, dense
    fog, frost, and cold stop the action and cause losses before a full battle occurs.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage reports that magicians brought the weather only as something
    said, not as an asserted fact by the narrator.
- id: motif:2
  label: reported magical weather in battle
  taxonomy_refs: []
  basis: The storm and fog that halt the confederates are described as having been
    brought on, as was said, by magicians.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The attribution to magicians is framed indirectly; the passage does not
    name the magicians or describe a ritual.
- id: motif:3
  label: broken dynastic marriage alliance
  taxonomy_refs:
  - sacred_exchange
  basis: Two marriage contracts between Temudjin's and Wang Khan's families are first
    agreed on, later broken, and followed by wrangling and coolness between the allies.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage treats the marriages as political-family contracts; the taxonomy
    reference is approximate because no explicit sacred ritual is described.
- id: motif:4
  label: succession anxiety through fictive kinship
  taxonomy_refs:
  - royal_legitimacy
  basis: Jamuka argues that Wang Khan's treatment of Temudjin as elder son makes Sengun
    the younger brother, threatens Sengun's inheritance, and will lead to loss of
    life.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage presents this as Jamuka's persuasive claim, not as a confirmed
    political fact.
- id: motif:5
  label: slanderous counselor incites betrayal
  taxonomy_refs: []
  basis: Jamuka repeatedly tells Sengun that Temudjin plans to destroy Wang Khan's
    family and seize the country, and a plot to kill Temudjin follows.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage states that Jamuka caused or directed the quarrel, but the
    full reasons for the rupture are said to be not well explained.
- id: motif:6
  label: Heaven withdraws from unjust action
  taxonomy_refs:
  - divine_judgment
  basis: Wang Khan says that if they hold unjust, evil thoughts against Temudjin,
    Heaven will turn from them.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: This is an ethical warning in speech rather than a narrated divine intervention.
- id: motif:7
  label: destruction of rival's kin and followers
  taxonomy_refs:
  - royal_legitimacy
  basis: Sengun's supporters discuss slaying Hoelun's children, destroying Temudjin,
    or taking his people in the context of protecting Sengun's position.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The actions are proposed in speech and plot, not carried out within this
    passage.
