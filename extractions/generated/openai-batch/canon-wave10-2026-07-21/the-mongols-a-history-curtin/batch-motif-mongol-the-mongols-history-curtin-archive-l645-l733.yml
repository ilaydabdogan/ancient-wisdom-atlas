  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kutula is chosen khan to lead the expedition, after which the Mongols feast,
    dance around a wide-spreading tree, and stamp out a knee-deep ditch.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kutula marches against China, defeats the Golden Khan's forces, and returns
