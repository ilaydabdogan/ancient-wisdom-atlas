- id: obs:1
  text: Ambagai warns that Mongol chiefs will avenge him if he is killed, but the
    Golden Khan ignores the warning and has him executed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Golden Khan sends Bulgadji to Mongolia to report Ambagai's execution;
    the Durbans refuse Bulgadji horses, and he eventually reports the matter to Kaidan.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kaidan, Tuda, and Yessugai hold council with many Mongols and resolve to avenge
