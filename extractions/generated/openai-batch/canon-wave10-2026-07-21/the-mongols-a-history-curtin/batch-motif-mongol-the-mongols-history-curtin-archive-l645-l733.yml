canonical_text:
  quote: ''
  summary: The passage recounts Ambagai's execution by the Golden Khan, Bulgadji's
    report to Mongol leaders, a council resolving vengeance, Kutula's election as
    khan with a feast and dance around a tree, Kutula's successful campaign against
    the Golden Khan's forces, his later ambush and escape from the Durbans through
    a swamp, a false report of his death and his wife's refusal to believe it, his
    return with horses and goose eggs, the mourning crowd's transformation into a
    triumphant feast, and Kutula's subsequent punishment of the Tartars for sending
    Okin Barka to the Golden Khan.
  language: English
  quote_policy: summarized
