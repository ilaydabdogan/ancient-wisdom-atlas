canonical_text:
  quote: ''
  summary: The passage describes political handling of the Kalifate under Beibars,
    including Mostansir’s doomed enterprise and Hakim’s role as an Egyptian Kalif
    who legitimized the Sultan while holding little real power. It then recounts the
    theft of Salih’s letter, related flights and defenses at Mosul, killings of Christians,
    and a Kurdish siege of the monastery of Mar Matthew, where monks resisted with
    weapons and naphtha before paying ransom.
