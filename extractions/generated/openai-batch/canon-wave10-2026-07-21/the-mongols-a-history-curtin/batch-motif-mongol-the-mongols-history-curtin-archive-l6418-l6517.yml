canonical_text:
  quote: ''
  summary: The passage describes Persia after Jinghis Khan's invasion as devastated
    and depopulated; reports fearful rumors about the Mongols; recounts the fates
    and rivalries of Shah Mohammed's sons; follows Jelal ud din's movements in India,
    his decision to return to Persia to reclaim his father's dominion, losses in the
    desert crossing, and his reception by Borak in Kerman through gifts, marriage,
    and the yielding of Kevashir.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Persia, especially its eastern regions, is described as ruined, deserted,
    and massively depopulated after Jinghis Khan's invasion.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: People terrified by events in Persia believed the Mongols were dog-headed
    and ate human flesh as ordinary food.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Shah Mohammed''s three sons are reported with different outcomes: Jelal ud
    din sought refuge at Delhi, Rokn ud din was slain by the Mongols, and Ghiath ud
    din saved himself in a Mazanderan stronghold.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Ghiath ud din used an intended marriage of his sister in political dealings:
    she was promised to Edek Khan, but after Edek was killed by Togan Taissi she was
    given to Togan, who paid homage.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After swimming the Indus during defeat, Jelal ud din was pursued by Mongol
    warriors toward Delhi; Iletmish avoided receiving him directly by sending gifts
    and recommending Multan instead.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Jelal ud din attacked Karadja's lands, sacked cities, routed an army, then
    accepted peace and Iletmish's daughter in marriage while Iletmish also joined
    a league against him if needed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Jelal ud din's advisers disagreed over whether he should stay safe from the
    Mongols in India or return west; he decided to go to Persia in hope of regaining
    his father's dominion.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: While crossing the desert north of the Indus, Jelal ud din lost part of his
    army to disease, exhaustion, and hunger, reaching Kerman with only four thousand
    men.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Borak Hadjib had gained control in Kerman, defeated and killed a Kevashir
    governor who attacked him after Ghiath ud din encouraged the attack for the sake
    of seizing baggage and women.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: When Borak heard Jelal ud din was in Kerman, he sent rich gifts, received
    him, offered a daughter in marriage, and Jelal later stood before Kevashir, which
    opened its gates to him.
  category: sequence
  evidence_refs:
  - ev:10
