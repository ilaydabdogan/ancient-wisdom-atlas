canonical_text:
  quote: ''
  summary: The passage describes diplomatic exchanges among Beibars of Egypt, Berkai
    on the Volga, the Byzantine emperor Michael, and other rulers. It includes envoys
    stopped and released, an oath-breaking judgment by Christian clergy, court ceremonial
    at Sarai, Berkai's announcement of conversion to Islam and alliance proposal against
    Hulagu, rich religious and diplomatic gifts from Beibars, public prayer recognition
    for Berkai, Kipchak arrivals and conversions in Cairo, asylum-seekers granted
    fiefs, and renewed requests that Berkai restrain raids on Byzantine lands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A letter praises the Sultan's troops from many nations, mentions Mohammedan
    and Christian vassals, reports that warriors declaring themselves Berkai's subjects
    were received in Cairo, and adds the pedigree of the new Kalif Hakim.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sultan's envoy and associates set out toward the Volga but were stopped
    in Greek regions by Emperor Michael because of complaints about Berkai's troops
    raiding Michael's possessions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Michael had previously sent a Greek document swearing peace and amity to the
    Sultan.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Beibars summoned the Patriarch and bishop for a decision on oath-breaking;
    they declared that a sovereign who breaks an oath abjures his religion.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Beibars sent the clerical decision to the Emperor and also sent Berkai a letter
    imploring him to stop attacks on the Empire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After Michael freed the envoys, they sailed over the Black Sea, landed at
    Sudak, crossed the Crimea, and reached Sarai east of the Volga after a twenty-day
    journey.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Sarai, Berkai's vizir Al Furussi met the envoys, instructed them in Sarai
    ceremonial, and brought them to Berkai in a very large tent.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the audience, the envoys left all weapons behind, avoided touching
    the threshold, and were moved from the left to the right of the throne after Beibars's
    letter was read.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Berkai's principal wife sat at the Khan's right, and fifty or sixty high officers
    occupied stools near him.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Berkai questioned the envoys and later sent envoys with them to the Sultan
    at Cairo; Se'if ud din returned after an absence of two years.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Two Muslim envoys from Berkai, Jelal ud din el Kadi and Nur ud din Ali, arrived
    in Cairo through the Byzantine capital and received an audience from Beibars in
    the Castle of the Mountain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Berkai's letter announced that he and his four brothers had received Islam,
    proposed an alliance against Hulagu, requested an Egyptian corps toward the Euphrates,
    and asked aid for Yzz ud din.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Beibars sent a long written answer and rich presents to Berkai, including
    a Koran copy, Osman's pulpit and prayer carpet, textiles, arms, saddlery, arrowheads,
    lamps, servants, horses, camels, wild asses, a giraffe, and balsam.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Beibars also sent a turban associated with Mecca, arranged a pilgrimage in
    Berkai's name, arranged that the Khan's name be placed next to his own in Friday
    public prayers in several cities, and sent the first Friday sermon of the new
    Kalif.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Beibars sent back two hundred warriors from Kipchak with Berkai's envoys.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Large groups of Kipchaks came to Cairo, dismounted and bowed to the earth
    when they saw Beibars, were treated liberally, and accepted Islam in his presence.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: High officers from Fars, chiefs of the Arab tribe Kafadje, and the emir of
    Arabian Irak came to Egypt seeking asylum, and Beibars gave them fiefs.
  category: action
  evidence_refs:
  - ev:12
- id: obs:18
  text: Beibars later sent Shuja ud din to Berkai, asking him to stop raids on Byzantine
    lands, and sent pilgrimage-worn turbans, marble vases, and other presents.
  category: action
  evidence_refs:
  - ev:12
- id: obs:19
  text: While Hulagu defended his northern frontier against Berkai's armies, Hayton
    of Cilicia attacked Egyptian regions, formed friendship with Rokn ud din, and
    marched against Aintab.
  category: sequence
  evidence_refs:
  - ev:13
