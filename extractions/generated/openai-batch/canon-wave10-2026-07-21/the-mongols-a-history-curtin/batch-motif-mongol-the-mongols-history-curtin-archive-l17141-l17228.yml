canonical_text:
  quote: ''
  summary: The passage narrates Togan Timur's accession after Yang Timur delays the
    enthronement and dies; factional appointments and a plot by Tang Kichi's group
    to enthrone Hoan ho Timur; Peyen's violent suppression of the conspirators and
    of Peyao; revolts among the Chinese and Mongol restrictions on them; and Peyen's
    later downfall through Toktagha's disclosure to the Emperor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yang Timur went out with princes and distinguished persons to meet Togan Timur
    near the capital, but delayed the enthronement after being dissatisfied with the
    reception.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Togan Timur attempted to repair his fault by arranging to marry Peyao, Yang
    Timur's daughter, but Yang Timur died while the matter was being discussed and
    settled.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yang Timur is described as all-powerful since Tob Timur's advent, as having
    forced the widow of Yissun Timur to marry him, and as having taken forty princesses
    descended from Jinghis as concubines.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Yang Timur's death, an Empress published the late Emperor's will, Togan
    Timur was made sovereign, and a promise was made concerning the succession of
    Yang Tekus.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The new Emperor is described as inclined toward luxury and pleasure; Peyen
    became minister, Satun became chief commander, and Tang Kichi later succeeded
    Satun.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Togan Timur raised Peyao to the highest rank possible to a woman in order
    to win Yang Timur's powerful family.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tang Kichi, described as fiery and envious, formed a plot to raise Hoan ho
    Timur to the throne.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The conspirators planned to hide troops and seize the Shang tu summer palace.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After Peyen was informed of the plot, Tang Kichi was killed while resisting
    arrest, and Targai was found in his sister the Empress's apartment and killed
    despite her attempt to hide him with her garments.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Peyao fled to the Emperor's chamber and begged for her life, but Togan Timur
    refused to save her, and Peyen killed her elsewhere after she was taken from the
    palace.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Talientali was killed after fleeing to Hoan ho Timur's mansion, Hoan ho Timur
    was forced to kill himself, and the passage states that Yang Timur's great family
    was extinguished.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Court weakness, palace tragedies, murders, and civil war are said to have
    roused the Chinese, who began to cast off the Mongol yoke; revolts arose in several
    regions and were suppressed early.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In 1336 the Mongol court prohibited Chinese people from having horses and
    arms and forbade them to use the Mongol language.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Peyen put one prince of Jinghis's blood to death and exiled two others without
    the Emperor's knowledge; he was widely hated, while the Emperor was guarded by
    Peyen's servants.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: Toktagha, Peyen's nephew and an officer of the guards, informed the Emperor
    of the country's condition; secret measures led to Peyen being barred from reentering
    the capital after a hunting trip, exiled, and dead on the way.
  category: sequence
  evidence_refs:
  - ev:10
