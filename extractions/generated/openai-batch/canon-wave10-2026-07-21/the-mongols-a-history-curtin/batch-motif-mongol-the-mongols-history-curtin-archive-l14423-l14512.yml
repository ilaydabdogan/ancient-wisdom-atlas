canonical_text:
  quote: ''
  summary: 'The passage recounts Mongol and Sung military actions in western Su chuan:
    Niuli relieves and recaptures Ching tu; Mangu besieges and takes the mountain
    stronghold Ku chu yai through a surrendered gate; advisers debate whether Mangu
    should withdraw because of the southern climate; the siege of Ho chiu follows
    amid rivers, storms, supply warfare, failed assaults, disease, and Mangu''s death.
    The army raises the siege, carries Mangu''s body north, and Assutai conducts the
    corpse to Mongolia for burial near the graves of Jinghis and Tului.'
  language: English
  quote_policy: summarized
