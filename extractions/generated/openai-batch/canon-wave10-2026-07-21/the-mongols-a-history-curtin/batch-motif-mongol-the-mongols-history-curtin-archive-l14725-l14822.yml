  summary: The passage recounts Arik Buga's renewed struggle against Kubilai, Algu's
    defection, western campaigns, Organa's negotiation and marriage to Algu, and Arik
    Buga's eventual ritual submission to Kubilai. It ends with Assutai explaining
    that he killed Apishga by command of his then-sovereign, Arik Buga, and would
    obey Kubilai in the same way.
