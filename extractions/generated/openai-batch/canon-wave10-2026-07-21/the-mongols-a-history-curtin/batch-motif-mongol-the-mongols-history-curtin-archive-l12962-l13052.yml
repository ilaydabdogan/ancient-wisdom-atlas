canonical_text:
  quote: ''
  summary: 'The passage recounts early campaigns under Ogatai against the Kin: a rejected
    embassy with offerings to Jinghis Khan''s spirit; the siege of Si ho chin and
    deaths of its commandant''s household and dependents; Kin victories and diplomatic
    challenges; the siege and surrender of Fong tsiang; a southern route into Honan
    identified as matching Jinghis Khan''s death-bed plan; and the killing of a Mongol
    envoy by the Sung after he crossed their boundary.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kin emperor sent Ajuta to Ogatai with offerings to Jinghis Khan's spirit,
    and Ogatai refused them because the Kin ruler had not acknowledged Jinghis as
    overlord.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Jinghis Khan's death, Mongol warfare in China continued and Si ho chin
    was besieged.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The commandant of Si ho chin expected eventual Mongol victory and capture,
    and asked his wife Li shi to consider her destiny.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Li shi said they should die for the dynasty and took poison; two sons of the
    commandant and their wives followed her example.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The commandant burned the five bodies, stabbed himself, and twenty-eight dependents
    died with him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Kin commanders won two successes against Mongol forces, including Cheng ho
    shang's defeat of an eight-thousand-man detachment and Yra buka's relief of King
    yang.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Yra buka released an envoy sent earlier by Tului and dismissed him with a
    challenge to the Mongols.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ogatai and Tului set out for China, crossed the Hoang Ho, took sixty forts,
    and laid siege to Fong tsiang.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A Kin peace envoy refused, even under threat of death, to obtain Fong tsiang's
    surrender; Ogatai had the envoy's beard cut off and imprisoned him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Antchar blockaded Fong tsiang, captured nearby places, kept out provisions,
    and the city surrendered after food and supplies were exhausted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Honan was described as difficult to capture because it was bounded by the
    Hoang Ho and guarded by rugged mountains and the Tung kwan fortress.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Li chang go proposed entering Honan from the south, and Tului recognized the
    route as the same plan traced by Jinghis Khan on his death bed.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Chubugan was sent to request passage through Sung territory, was killed after
