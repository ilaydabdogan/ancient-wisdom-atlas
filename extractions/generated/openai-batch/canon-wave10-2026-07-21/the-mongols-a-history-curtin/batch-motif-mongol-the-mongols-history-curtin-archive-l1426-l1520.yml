canonical_text:
  quote: Heaven appoints Temudjin to be lord of dominion, I am taking his power to
    him.
  summary: Temudjin separates from Jamuka after Bortai interprets Jamuka's cryptic
    words as dangerous. Horchi reports a spirit-revealed vision involving a cow, a
    broken horn, and a hornless bull announcing Heaven's appointment of Temudjin.
    Clan leaders swear loyalty and proclaim Temudjin Khan, after which he assigns
    offices and Subotai pledges protective service.
  language: English
  quote_policy: quoted
