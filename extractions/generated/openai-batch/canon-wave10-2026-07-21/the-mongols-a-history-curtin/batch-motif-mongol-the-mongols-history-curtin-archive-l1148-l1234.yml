canonical_text:
  quote: ''
  summary: Temudjin and Boorchu recover stolen horses, escape pursuers, and form a
    bond of loyal comradeship. Temudjin later marries Bortai, seeks Boorchu as a permanent
    companion, offers Bortai's sable cloak to Togrul in honor of Yessugai's former
    anda bond, receives Togrul's promise of support, and accepts Chelmai as an attendant
    from Charchiutai.
  language: English
  quote_policy: summarized
