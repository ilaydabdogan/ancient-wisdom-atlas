canonical_text:
  quote: ''
  summary: The passage describes the rule of Kia Mohammed at Alamut, the popularity
    and rumored Imam status of his son Hassan, repression of Hassan's partisans, and
    Hassan's own secret violations of prohibitions. It then shifts to the rise of
    Zenky, the introduction of Nur ed din and Saladin as future destroyers of the
    Fatimid dynasty, Zenky's career and death, Eyub's rescue of Zenky, Saladin's birth
    during Eyub's search for asylum, and the division of Zenky's possessions between
    his sons.
  language: English
