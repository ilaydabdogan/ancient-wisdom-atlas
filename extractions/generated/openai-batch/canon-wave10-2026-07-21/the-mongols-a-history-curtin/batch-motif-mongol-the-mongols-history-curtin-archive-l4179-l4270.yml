    the wider pattern of Turkish slaves rising to military and political power, Mohammed
    Shah's rebellion against the Gurkhan of Kara Kitai, the killing of a tribute agent,
    Mohammed's defeat and escape in servile disguise, and a later renewed victory
    with Osman of Samarkand.
