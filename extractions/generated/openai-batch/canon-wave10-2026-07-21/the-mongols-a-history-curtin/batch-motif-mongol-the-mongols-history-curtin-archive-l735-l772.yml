canonical_text:
  quote: ''
  summary: The passage narrates a renewed Taidjut attack against the surviving sons
    of Kabul, Bartan's wounded escape, and thirteen-year-old Yessugai's quick martial
    self-rescue. Maral Kayak flees with three sons to Bartan. After a temporary Taidjut
    triumph, Bartan dies and Yessugai Bahadur succeeds him; his name is explained
    as meaning number nine, and his descent from Boduanchar is emphasized. The passage
    then describes Mongol clan politics, Chinese interference, and Yessugai's success
    in restoring cooperation and the primacy of Kabul's sons.
  language: English
