candidate_motifs:
- id: motif:1
  label: Heaven-supported royal accession
  taxonomy_refs:
  - royal_legitimacy
  basis: Temudjin frames his future honor-giving under Heaven’s continued support,
    and Togrul affirms that Temudjin has been made Khan and demands loyalty to him.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage is presented as historical narrative; the motif label identifies
    a legitimacy pattern rather than proving a ritual doctrine.
- id: motif:2
  label: Loyal companions rewarded with rank and duties
  taxonomy_refs:
  - covenant
  basis: Temudjin places early comrades first, promises honor to those who joined
    him, and assigns duties to the new followers.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: No formal oath or treaty is described; the covenant taxonomy is only a
    cautious fit for reciprocal allegiance and reward.
- id: motif:3
  label: Vendetta escalating from theft to war
  taxonomy_refs: []
  basis: Taichar’s horse theft leads Darmala to kill him; Jamuka then seeks vengeance
    for his brother and joins an armed campaign against Temudjin.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: This is a political-vendetta pattern rather than a named taxonomy motif
    in the supplied list.
- id: motif:4
  label: Victory, terror, and generosity attract adherents
  taxonomy_refs: []
  basis: After Temudjin’s battle victory and harsh execution of selected captives,
    the passage says terror, kindness, and rewards bring him many adherents.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage itself links these causes to the gaining of adherents; broader
    symbolic meaning is not asserted.
- id: motif:5
  label: Hospitality to potential defectors
  taxonomy_refs: []
  basis: Juriat clansmen who meet Temudjin while hunting are fed with meat and given
    kettles; the passage frames the episode as the reason a division of Jamuka’s clansmen
    came and joined Temudjin.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The hospitality is explicit, but the exact causal and political sequence
    is compressed in the passage.
