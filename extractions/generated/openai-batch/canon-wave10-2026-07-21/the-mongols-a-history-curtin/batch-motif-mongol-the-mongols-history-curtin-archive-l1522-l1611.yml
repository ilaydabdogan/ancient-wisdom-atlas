canonical_text:
  quote: ''
  summary: Temudjin honors early companions, addresses new followers under Heaven’s
    continued support, announces his accession to Togrul and Jamuka, and receives
    replies. A horse theft by Jamuka’s brother Taichar leads Darmala to kill him,
    prompting Jamuka’s vengeance alliance with Targutai and the Taidjuts. Temudjin
    is warned, defeats the larger enemy force at Dalandaljut, executes selected captives
    by boiling them in caldrons, and then gains adherents through fear, victory, reward,
    and hospitality.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Temudjin addresses Bobrchu and Chelmai as comrades who came to him when he
    was alone and places them first in the assembly.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Temudjin tells men who left Jamuka and joined him that, if Heaven continues
    to keep and uphold him, they will be fortunate helpers and stand in high honor;
    he then instructs them in duties.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Temudjin sends Tagai and Sukagai to announce his accession to Togrul, who
    approves that Temudjin has been made Khan and warns against falseness to him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Temudjin sends Arkai Kassar and Belgutai to Jamuka; Jamuka replies that calumnies
    have separated him from his anda and urges faithfulness to Temudjin.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that, in the customs described, a slave was considered
    like a brother for purposes of vendetta.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Taichar steals a herd of horses from Darmala, while Darmala’s assistants fear
    to follow and recover them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Darmala pursues alone at night, shoots Taichar with an arrow, kills him, and
    drives back the horses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Jamuka seeks vengeance for his brother, allies with Temudjin’s enemies the
    Taidjuts, and joins Targutai in assembling three tumans of warriors for a surprise
    attack.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mulketokah and Boldai inform Temudjin of the enemy movement; Temudjin marches
    out with thirteen thousand warriors.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Temudjin fights Targutai and Jamuka at Dalandaljut and wins a bloody first
    triumph; the enemy army is broken and prisoners are taken.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: In a forest near the battleground, Temudjin arranges the prisoners, selects
    principal ones for punishment, and has selected opponents boiled alive in seventy
    or eighty large caldrons over multiple days.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The execution spreads terror; the passage also says Temudjin’s kindness and
    rewards to friends bring him many adherents through hope and fear.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Unuts, Manhuts, Munlik, and Munlik’s seven sons join Temudjin after the
