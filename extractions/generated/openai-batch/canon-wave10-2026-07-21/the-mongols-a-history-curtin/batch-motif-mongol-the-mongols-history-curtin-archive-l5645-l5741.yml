  summary: The passage recounts the Mongol pursuit of Jelal ud din to the Indus, a
    battle constrained by river and mountain, Jelal ud din's leap into the river,
    the drowning of his sons and seizure of his harem and treasures, and later Mongol
    campaigns against Ghazni and Herat, including a deception-linked uprising at Herat
    and the city's siege and devastation.
