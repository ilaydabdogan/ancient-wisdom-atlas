canonical_text:
  quote: ''
  summary: Sengun presses Wang Khan to treat Temudjin as a mortal threat. Wang Khan
    invokes his promise, counsel, and Heaven's favor, and refuses direct participation
    in murder, though he tells Sengun to act apart from him if he insists. Sengun,
    Jamuka, and Temudjin's relatives plan to lure Temudjin to a false betrothal feast
    and kill him. Munlik suspects the invitation, so Temudjin sends substitutes. Sengun
    then plans a rapid attack and seizure near Mount Mao. Aike Charan tells his wife
    of the plan; servants Badai and Kishlik overhear enough to warn Temudjin. Temudjin
    moves north of Mount Mao, sends scouts, receives news of the enemy's advance,
    and prepares for battle at Kalanchin.
  language: English
  quote_policy: summarized
