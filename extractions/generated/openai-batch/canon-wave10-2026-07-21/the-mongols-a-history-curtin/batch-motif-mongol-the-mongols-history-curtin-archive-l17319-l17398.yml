  summary: The passage describes unrest caused by river works, tax burdens, and land
    seizures; anti-Mongol rebellions in China; a report that Fohi/Buddha had appeared
    as a deliverer; claims of Sung dynastic descent; an oath sealed with sacrificed
    animals; red caps used as rebel ensigns; a comet interpreted by rebels as heralding
    Togan Timur's fall; imperial countermeasures; military campaigns; pirate activity;
    and court intrigue against Toktagha.
