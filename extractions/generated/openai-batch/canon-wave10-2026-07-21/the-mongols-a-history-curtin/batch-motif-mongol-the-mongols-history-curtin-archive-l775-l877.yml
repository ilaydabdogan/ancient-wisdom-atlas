canonical_text:
  quote: ''
  summary: The passage recounts lineage rivalry among Mongol leaders, Yessugai's seizure
    of Hoelun from her Merkit husband, Temudjin's birth and naming after a captured
    Tartar chieftain, a dream omen leading to Temudjin's betrothal to Bortai, and
    Yessugai's poisoning by Tartar hosts followed by his request that Temudjin be
    brought quickly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents rivalry between descendants of Kabul and Ambagai as a
    major political fact among the Mongols, and describes both as descended from Kaidu.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yessugai, while hawking along the Onon, saw the Merkit Yeke taking home a
    wife from the Olkonots and returned with two brothers after seeing that the woman
    was beautiful.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hoelun warned Yeke that the approaching men were hostile, urged him to flee,
    and gave him her shift as he escaped.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yessugai and his brothers failed to overtake Yeke, returned to Hoelun, seized
    her while she wept and screamed, and she became Yessugai's wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: During later attacks on the Tartars, Yessugai took among his captives a chieftain
    named Temudjin Uge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hoelun gave birth near the hill Dailiun Baldak to a son who was born firmly
    grasping a lump of dark blood in his fist and was named Temudjin because Temudjin
    Uge had been taken at that period.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When Temudjin had passed his thirteenth year, Yessugai set out with him to
    seek a bride among Hoelun's brothers and met Desaichan between the mountains Cihurga
    and Cheksar.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Desaichan described a dream in which a white falcon holding the sun and moon
    in its talons flew down to his wrist, and he interpreted the dream as an omen
    of greatness and high fortune connected with Yessugai's arrival with his son.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Desaichan showed Yessugai and Temudjin his ten-year-old daughter Bortai; Yessugai
    asked for her as a bride for Temudjin, and Desaichan agreed on condition that
    Temudjin remain with him for a time.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the road home, Yessugai stopped at Cheksar, where Tartar hosts who remembered
    his captures and killings gave him poison in drink at a feast.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Yessugai reached home after three days but became increasingly ill, told Munlik
    that he had been poisoned by enemies, and instructed him to inform relatives and
    first bring Temudjin quickly.
  category: speech
  evidence_refs:
  - ev:7
