canonical_text:
  quote: ''
  summary: The passage describes Mongol attacks on Benakit, Khodjend, and Bokhara.
    It includes capitulation followed by killings and forced labor, Timur Melik's
    island defense and river escape, his final evasion of pursuers with three arrows,
    the investment of Bokhara, the failed breakout of its defenders, and Jinghis Khan's
    entry into the mosque, where sacred objects and religious leaders are subordinated
    to Mongol military use. A religious notable interprets the disaster as God's wrath.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Mongol division attacked Benakit, whose officers surrendered after three
    days when their lives were promised.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Benakit surrendered, inhabitants were driven out; Turks or Kankali warriors
    were killed, artisans were spared and divided among the Mongol army, strong young
    men were taken for siege work, and other people were slain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Khodjend, Timur Melik commanded and took one thousand chosen warriors to
    a fort on an island beyond effective range of stones and arrows from either bank.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The besiegers at Khodjend were reinforced by Mongol fighting troops and native
    laborers, who carried stones from a mountain and built a road from the shore toward
    the river fortress.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Timur Melik built twelve covered barges protected from fire; the boats shot
    arrows through openings, and night attacks harmed the invaders.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Seeing that continued defense would fail, Timur Melik placed men and baggage
    in seventy boats and chosen warriors in the twelve covered barges, then moved
    down the swift river at night by torchlight.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The flotilla broke a chain stretched across the river near Benakit and continued
    while enemies hunted it from both banks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After learning of forces, ballistas, and a boat bridge near Jend, Timur Melik
    landed upstream, took to horse, fought while pursued, and eventually abandoned
    his baggage.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When Timur Melik had lost all his men, three Mongols pursued him; with three
    arrows left, he used an unpointed arrow to put out one pursuer's eye and warned
    the others about the two remaining arrows, after which they withdrew.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Jinghis Khan moved against Bokhara, pillaged Nur and Charnuk on the way, took
    stalwart men for siege work, and invested Bokhara on all sides.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bokhara's defenders attempted a night breakout, initially scattered the Mongols,
    but were pursued to the river and nearly all cut down.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Ulema and notables came out to give homage and open Bokhara's gates; Jinghis
    Khan rode into the city, entered the main mosque on horseback, mounted steps near
    the minbar, and ordered that horses be fed there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Boxes for Koran copies were used to hold grain for Mongol horses, sacred volumes
    were trampled by horses, wine and provisions were brought into the mosque, and
    religious leaders and doctors of law served the Mongols and their horses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: One great man suggested imploring the Almighty; another answered that God's
    wrath was moving near them and told him to be silent and serve the Mongols.
  category: speech
  evidence_refs:
  - ev:8
