canonical_text:
  quote: ''
  summary: The passage recounts the disposal of captured Kwaresmian royal women and
    officials, Turkan Khatun's refusal of rescue by her grandson, Jelal ud din's flight
    from Urgendj and victory near Nessa, the deaths and public display of his brothers,
    and the Mongol siege, massacre, plunder, and flooding of Urgendj.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Captured royal women were assigned as concubines, wives, or gifts; Turkan
    Khatun was taken to Kara Kurum, and Nassir ud din was put to death at Talekan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Turkan Khatun rejected the suggestion that she seek refuge with Jelal ud din,
    saying captivity was preferable to salvation at his hand.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mohammed's three elder sons reached Urgendj, where seventy thousand men gathered
    around them after the capital had been left without rule.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Commanders hostile to Jelal ud din's succession plotted to kill him, and he
    fled across the desert to Nessa with three hundred warriors under Timur Melik.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Jinghis reorganized his forces, sent Juchi, Jagatai, and Ogotai toward Urgendj,
    and set a cordon to cut off retreat toward the Indus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Jelal ud din attacked the Mongol line near Nessa, forced it to flee, and continued
    onward; the passage calls this the first victory over Mongols in the Kwaresmian
    Empire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Jelal ud din's two younger brothers failed to escape and perished near Nessa;
    their heads were fixed on lances and carried through Khorassan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Urgendj, Juchi first sent a summons to surrender; when it was ignored,
    the Mongols began a siege and attempted unsuccessfully to divert the Oxus above
    the town.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Quarrels between Juchi and Jagatai slowed the siege until Jinghis placed Ogotai
    in command.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The citizens of Urgendj defended the city desperately for months and continued
    street-by-street resistance after the general assault; women and children also
    fought.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After the inhabitants asked to capitulate, Ogotai rejected mercy, separated
    artisans from the rest, spared the artisans for exile to Mongolia, and ordered
    the others killed except some youthful women and children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the slaughter, the Mongols plundered Urgendj, opened the sluices of
    the Oxus, flooded the city, and drowned people who had hidden there.
  category: action
  evidence_refs:
  - ev:6
