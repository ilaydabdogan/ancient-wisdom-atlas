canonical_text:
  quote: ''
  summary: The passage narrates Jelal's attempts to secure allies, his conflict with
    Bagdad forces, a victory by ambush, campaigns around Dakuka, Takrit, Meraga, Azerbaidjan,
    and Tebriz, negotiated peace with Togan Taissi through Jelal's sister, clemency
    toward Tebriz after surrender, and the opening of a campaign against the Georgians,
    who answer with a boast comparing themselves to the Mongols.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jelal writes to Moazzam asking for aid against Nassir; Moazzam replies that
    he will support Jelal except in a struggle against the high chief of all Moslems.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kush Timur commands twenty thousand Bagdad forces, and a pigeon is sent to
    Mozaffar with an order to attack Jelal's rear guard and block his retreat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Jelal sends a message to Kush Timur saying that he has not come as an enemy
    and that he seeks the Kalif's good-will and aid against a larger enemy menacing
    Islam.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kush Timur answers by arranging his men for battle; Jelal places part of his
    smaller army in ambush, charges three times with five hundred troops, feigns disorderly
    flight, draws the enemy into the trap, and attacks both flanks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kush Timur is killed, his army is broken, and the defeated forces are pursued
    to the gates of the capital.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After victory, Jelal captures and sacks Dakuka, moves against Takrit, captures
    Mozaffar with a small force, and later frees him on a promise to return to and
    remain in his own lands.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Jelal turns from plans against Bagdad toward Azerbaidjan and learns that Togan
    Taissi, his maternal uncle and brother-in-law, is moving to take Hamadan after
    pillaging Azerbaidjan.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Jelal arrives near Togan's camp about midnight, where large numbers of sheep,
    mules, horses, asses, and cattle are gathered.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: After daybreak Togan sees Jelal's troops, recognizes Jelal by the regal umbrella,
    sends his wife, who is also Jelal's sister, to seek peace, and then places his
    troops under the Sultan's banners.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Euzbeg leaves Tebriz for Gandja, spends his time drinking, and leaves affairs
    of state to his consort, who remains in Tebriz.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Jelal besieges Tebriz; after five days of fighting, as he is ready to storm
    the city, the inhabitants ask to surrender and deny responsibility for killing
    his father's warriors and sending their heads to the Mongols.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Jelal accepts the inhabitants' statement, spares them, grants requested possession
    of Khol and other places to Euzbeg's wife, and sends an escort to convey her to
    Kho'i.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: After taking Tebriz and staying there for some days, Jelal sets out on an
