canonical_text:
  quote: ''
  summary: The passage narrates political conflict around Kurguz, Ongu, Kelilat, Ogotai,
    Chinkai, and Sherif ud din. Kelilat is assassinated at Bukhara; Ongu’s gift tent
    is overturned by wind and destroyed by Ogotai; Kurguz’s gift tent and girdle improve
    Ogotai’s mood and health; Ogotai attempts to reconcile Kurguz and Ongu, then judges
    Ongu’s party, invokes Jinghis Khan’s Yassa, shows conditional mercy, and grants
    Kurguz authority. Sherif ud din is exposed as a double-dealer, and Kurguz later
    issues ordinances and removes abusive officers.
  language: English
  quote_policy: summarized
