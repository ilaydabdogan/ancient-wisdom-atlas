canonical_text:
  quote: ''
  summary: Hulagu prepares the siege of Bagdad by securing roads and mountain passes,
    uses Ake of Daritang and then destroys him and his household, consults rival astrologers
    about the siege, orders his army to converge on Bagdad, and causes panic flight
    toward the city across the Tigris.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hulagu prepared troops to besiege Bagdad and aimed first to seize all roads
    between Hamadan and Bagdad.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One route for the left wing passed through mountains, high snow-covered passes,
    and the fortress Daritang, which commanded a defile at the boundary of Arabian
    Irak.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hulagu summoned Ake, the Daritang commandant, offered him favors, and engaged
    him to yield his fortress and try to win over other commandants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After returning home, Ake repented, warned Bagdad of the enemy plans, and
    offered to raise Turkmans and Kurds if the Kalif sent trained horsemen; the Kalif
    refused the offer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Mongol mounted force seized Ake, compelled him to call out his people under
    the pretext of a census, ordered him to tear down the fortress, and then killed
    him, the men under him, and his household.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Emir Said, Ake's son, fled into the mountains and later sought safety in Bagdad,
    where he was killed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the Daritang road was secured, Hulagu consulted astrologers; one predicted
    six calamities if the Mongols besieged Bagdad, while Nassir ud din denied the
    prediction and said the city would be taken by Hulagu.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Hulagu ordered Mongol forces to converge on Bagdad, with the right wing moving
    through Mosul, the left wing by Daritang, and Hulagu himself in the center by
    the Holvan road.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mostassim refused to visit Hulagu's headquarters but offered annual tribute
    if Hulagu withdrew; Hulagu answered that he was too near to turn back without
    seeing the Kalif and sent another embassy.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: As the Mongol right wing neared the southern bank of the Tigris, panic spread
    among the people of the region, and crowds sought refuge in Bagdad by rushing
    into the water and paying boatmen valuables for passage.
  category: action
  evidence_refs:
  - ev:5
