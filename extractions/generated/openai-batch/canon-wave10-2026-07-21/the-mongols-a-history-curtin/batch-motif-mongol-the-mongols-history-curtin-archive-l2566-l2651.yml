canonical_text:
  quote: ''
  summary: Temudjin marches east with a reduced army. Huildar dies after charging
    a wild boar while still wounded and is buried near the Kalka. Temudjin secures
    the submission of the Ungirats by invoking a blood bond. He sends envoys to Wang
    Khan with a long complaint recalling their father-son language, mutual agreement,
    Wang Khan’s past hardships, oaths by High Heaven, past aid, betrayal, and rescue.
    Wang Khan regrets the quarrel and sends back a blood oath in a horn. Temudjin
    also sends a reproachful message to Jamuka about envy, separation from his father,
    and the dark drinking cup of mare’s milk.
  language: English
  quote_policy: summarized
