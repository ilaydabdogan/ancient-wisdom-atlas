canonical_text:
  quote: ''
  summary: Jinghis Khan, near death, gives Kiluken instructions about loyalty to his
    widow and sons and predicts Kubilai's future rule. After his death, Kiluken and
    the princes escort the body toward Kentei Khan with a large mourning procession.
    The funeral car becomes stuck in blue clay in the Mona Khan mountains until Kiluken
    leads a chant urging the dead khan to return to his homeland and people. The car
    then moves on, and the body is buried in a Kentei Khan forest near a large tree;
    afterward the forest trees become indistinguishable, concealing the grave. The
    passage closes with an appraisal of Jinghis Khan as a vast conqueror and manslayer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jinghis lies helpless in bed with death near and speaks to Kiluken, described
    as his old comrade and the gray hero.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jinghis tells Kiluken to be true to his widow Bortai Fudjin and to his sons
    Ogotai and Tului.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Jinghis states that a person born to life is not deathless and says it is
    clear that he must leave all and go away from them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Jinghis says the boy Kubilai's words are weighty and predicts that Kubilai
    will one day sit on his throne and secure prosperity.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Kiluken and many princes carry the corpse back toward the Kentei Khan region
    through Tangut and across the Gobi, followed by a very large train of people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The mourners wail and chant; their lament says the khan formerly swooped like
    a falcon and led like an eagle, but now a car bears him and he has left wife,
    children, and the national Kurultai.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the Mona Khan mountains the funeral car stops in blue miry clay and even
    the best horses cannot move it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kiluken leads a new chant addressing the dead khan as a lion of the Tengeri
    and asking whether he will leave wife and nation in the quagmire.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The chant lists the khan's birth land, rivers, Mongol subjects, commanders,
    birthplace, standards, instruments, Kerulon fields, wife, friends, land, and golden
    mansion as awaiting him elsewhere.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The chant asks whether the khan remains because the land pleases him, because
    Tanguts are vanquished, or because Kurbeldjin Goa was beautiful, and asks to bear
    his remains to their last home and resting place.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: After Kiluken's chant, the funeral car moves from the blue clay, passes the
    mountain range and Gobi, and reaches home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The body is buried in a Kentei Khan forest near a majestic tree that had pleased
    Jinghis Khan during his lifetime.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the burial, all trees in the forest become equal in size and appearance,
    so that no one knows or can learn where the body is hidden.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage appraises Jinghis Khan as a great historical figure, a ruler seeking
