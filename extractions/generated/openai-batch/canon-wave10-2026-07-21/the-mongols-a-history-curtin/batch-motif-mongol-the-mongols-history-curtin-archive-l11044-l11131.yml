canonical_text:
  quote: ''
  summary: 'The passage narrates Hulagu''s siege of Bagdad: Mongol forces use Tigris
    waters to trap opponents, reject embassies and gifts, seize the walls, lure or
    compel inhabitants to leave the city, execute leading figures, slaughter disarmed
    crowds, begin the sack of Bagdad, and confront the Kalif in his palace.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After pursuit of a Mongol vanguard, the Mongols faced the pursuers and the
    two armies camped opposite one another until daybreak.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the night the Mongols opened canals from the Tigris and submerged a
    plain behind their opponents, making retreat difficult or impossible.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At daybreak another battle occurred in which most of the Bagdad men perished,
    while the Chancellor fled to the city with a small party.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Kalif sent the vizir and the Nestorian patriarch to Hulagu with a message
    of yielding, but Hulagu answered that his wish might now be different because
    he was at the capital's gates.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Several delegations, including officials and the Kalif's sons, came with presents,
    but Hulagu did not grant them an audience.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A renewed attack lasted six days, the eastern wall was seized, and river escape
    was said to be impossible both downstream and upstream.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Chancellor attempted escape by boat and was driven back by stones, burning
    naphtha, and arrows; three boats were captured and their men slaughtered.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Hulagu ordered Suleiman Shah and the Chancellor brought, then sent them back
    to tell people they would be taken to Syria and should leave through the gates
    without hindrance.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Many people left Bagdad seeking safety, were divided among Mongol divisions,
    and were killed by the sword.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Suleiman Shah was questioned about his knowledge of the stars and the fatal
    day; he replied that the Kalif was bound by destiny and had not heard faithful
    servants.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Suleiman Shah was killed along with his whole household, counted as seven
    hundred persons, including the Chancellor's son.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Kalif went out with his three sons and three thousand dignitaries and
    officials; after Hulagu's instruction he proclaimed that people should lay down
    arms and come to the Mongol camp, where the crowds were slaughtered except for
    the Kalif and his sons.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Three days later the sack and pillage of Bagdad began, with Mongols entering
    from all sides and sparing only Christian houses and those of a few foreigners.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: At a feast in the Bagdad palace, Hulagu had the Kalif brought before him and
    described himself as a guest in the Kalif's house while asking what gift the Kalif
    had for him.
  category: speech
  evidence_refs:
  - ev:10
