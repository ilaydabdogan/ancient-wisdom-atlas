canonical_text:
  quote: ''
  summary: After a childless emperor's death, Bulagan supports Ananda for the throne,
    while another party supports Khaishan and his brother Ayurbali Batra. Batra refuses
    to usurp his elder brother, sends him the imperial seal, and governs as regent
    until Khaishan is installed by a Kurultai. Khaishan honors ancestors, punishes
    Ananda's faction for violating the Yassa and dynastic consent, supports translations
    and Lamas, then dies. Batra is later installed as Bayantu at an astrologically
    designated hour and promotes scholarly examinations and learned men.
  language: English
  quote_policy: summarized
