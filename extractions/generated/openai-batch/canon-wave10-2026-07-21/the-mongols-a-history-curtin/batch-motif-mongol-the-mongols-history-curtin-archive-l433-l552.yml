canonical_text:
  quote: ''
  summary: Nachin kills encountered hunters and herding boys, seizes horses and hawks,
    and takes Kaidu and surviving women to Bargudjin. The narrator presents Nachin
    as the selfless guardian of the Mongol remnant and preserver of Kaidu, whose descendants
    become major Mongol lineages. The passage then gives genealogy from Kaidu to later
    clans and to Kabul Khan. Kabul visits the Chinese emperor, fears deception and
    poison, later eats and drinks heavily, is interpreted by Chinese observers as
    made by High Heaven to rule, then offends the emperor by touching his beard and
    ear. Kabul excuses the act by blaming his hand; the emperor avoids punishment,
    gives him gold-embroidered silks, a crown, and a gold girdle, and dismisses him
    with honor.
  language: English
  quote_policy: summarized
