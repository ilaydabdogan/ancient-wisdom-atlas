canonical_text:
  quote: ''
  summary: Temudjin reminds former supporters that he was proclaimed khan after other
    eligible men declined, sends admonitory messages to Togrul and Sengun, receives
    Sengun's declaration of war, reunites with Juchi Kassar, and uses a deceptive
    message to lure Wang Khan's trusted warrior before attacking Wang Khan's feasting
    camp. After a three-day battle the Keraits can no longer fight, and Wang Khan
    and Sengun flee.
  language: English
  quote_policy: summarized
