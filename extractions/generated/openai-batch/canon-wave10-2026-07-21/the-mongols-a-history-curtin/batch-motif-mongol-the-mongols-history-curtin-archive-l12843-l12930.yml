canonical_text:
  quote: ''
  summary: The passage recounts the defeat of Sherif ud din, called the Madhi, after
    soldiers overcome fear that spirits protect him; Hulagu’s punitive order against
    Shiraz and its recall; Uns Khatun’s marriage and the end of the Salgarid dynasty;
    the Mongol siege and retreat from El Biret; Hulagu’s death, burial with treasures
    and living maidens, and Dokuz Khatun’s death and Christian patronage; and two
    anecdotes of Hulagu’s substitutionary judgments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Many thought Sherif ud din, called the Madhi, was assisted by spirits and
    that anyone attacking him would be paralyzed; for a time no one in the Shiraz
    army would raise a hand against him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two warriors first shot arrows at Sherif ud din, others followed, the Mongols
    charged, the insurgents fled, and Sherif ud din was killed with most of his followers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hulagu ordered Altadju beaten and a tuman sent to punish Shiraz, but recalled
    the order after learning Sherif ud din was dead and most Shiraz people were innocent.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Uns Khatun was sent to the Ordu to marry Mangu Timur, Fars was managed by
    the Divan in her name, and the Salgarid dynasty ended with her death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At El Biret, the Mongols filled the fortress fosse with wood, and the besieged
