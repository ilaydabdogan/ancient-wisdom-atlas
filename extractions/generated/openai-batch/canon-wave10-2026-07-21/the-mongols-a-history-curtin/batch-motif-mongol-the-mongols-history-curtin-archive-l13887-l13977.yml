- id: obs:1
  text: Turakina set aside Chu tsai's advice and gave Abd ur Rahman control of imperial
    finances; the passage states that Chu tsai became despondent, died in 1244, had
    saved many lives, founded two colleges, and published on astronomy.
  category: sequence
  evidence_refs:
  - ev:1
