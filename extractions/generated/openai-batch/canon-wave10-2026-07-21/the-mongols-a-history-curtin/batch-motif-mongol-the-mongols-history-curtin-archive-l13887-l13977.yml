canonical_text:
  quote: ''
  summary: The passage recounts fiscal conflict after the conquest of Honan, Chu tsai's
    displacement and death, Temugu's abandoned move toward power, the delayed Kurultai
    that elected Kuyuk, Fatima's accusation and execution, Shira's later execution,
    Kuyuk's journey and death, the controlled spread of news, Batu's recognition of
    Ogul Gaimish's regency, and a Kurultai dispute over succession legitimacy based
    on descent, Jinghis Khan's laws, and Ogotai's will.
  language: English
  quote_policy: summarized
