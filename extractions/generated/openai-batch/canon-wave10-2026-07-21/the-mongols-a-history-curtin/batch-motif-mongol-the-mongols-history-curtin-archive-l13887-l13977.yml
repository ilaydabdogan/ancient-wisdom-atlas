    the west.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The assembly to elect a new sovereign was delayed because Batu did not come;
    he was said to feign a sore leg, and Kuyuk was elected when the Kurultai assembled
    without him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After Turakina died, enemies of Fatima conspired against her, and Shira accused
    her of causing Prince Kutan's illness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After Kutan died, Kuyuk ordered Fatima's trial; she was tortured until she
