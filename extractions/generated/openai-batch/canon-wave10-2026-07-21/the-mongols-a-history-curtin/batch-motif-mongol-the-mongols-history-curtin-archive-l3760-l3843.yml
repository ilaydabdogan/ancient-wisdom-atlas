canonical_text:
  quote: ''
  summary: Jinghis prepares to invade China, prays to High Heaven on a mountain before
    departure, marches with a disciplined mounted army, gains aid and defectors near
    the Great Wall, wins early victories but is wounded at Tai tong fu, and later
    supports the Kitan prince Lyuko after an oath compact made on Mount Yen with sacrifice
    and arrow-breaking.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jinghis directs Tuguchar to guard the home lands and then moves from the Kerulon
    in March 1211 to subdue the Chinese Empire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before leaving his native place, Jinghis visits a lofty mountain; on the summit
    he loosens his kaftan, puts his girdle around his neck, and calls High Heaven
    to help him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Jinghis says he is going to avenge Berkai and Ambagai, his uncles, whom the
    Altyn Khans put to death; he asks Boundless Heaven for aid from lofty places,
    men on earth, and good and evil spirits.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Jinghis's four sons, Juchi, Jagatai, Ogotai, and Tului, accompany him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The invasion army is described as strictly disciplined, entirely mounted,
    and organized in units of ten, one hundred, one thousand, and ten thousand warriors.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Individual warriors carry armor, helmet, lance, sabre, ax, bow, and quiver,
    and are followed by multiple horses; herds of cattle follow the army, and on forced
    marches each man carries milk and a small portion of flesh food.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: To reach the Great Wall, the Mongols cross about twelve hundred miles, including
    part of the Gobi desert.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ala Kush Tegin of the Onguts, whose duty is to guard the Great Wall for the
    Emperor, favors the Mongols.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mingan, sent by the Chinese commander Kin kien to reconnoitre the Mongols,
    deserts and gives the Mongols information; the Mongols then attack and rout Kin
    kien's forces.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Mongols win widely in 1212 and defeat Kin armies where they meet them,
    but Jinghis is wounded by an arrow while besieging Tai tong fu and withdraws north
    for a time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Lyuko, a prince of the dispossessed Kitan dynasty and an officer in the Kin
    army, flees, raises men, and becomes ready to add his strength to Jinghis; Jinghis
    sends Antchin Xoyon to conclude an alliance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Lyuko and Antchin ascend Mount Yen, kill a white stallion and a black bull
    as sacrifice, turn north, hold and break an arrow, and exchange pledges of faith
    and support.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: When an imperial army marches against Lyuko, Jinghis sends warriors; Lyuko
    defeats the Emperor's army, receives further aid, gains support among the Kitans,
    and with Jinghis's consent proclaims himself King of Liao.
  category: sequence
  evidence_refs:
  - ev:7
