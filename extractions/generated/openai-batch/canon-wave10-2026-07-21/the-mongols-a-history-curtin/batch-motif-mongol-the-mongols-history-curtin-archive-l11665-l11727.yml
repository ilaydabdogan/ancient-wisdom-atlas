  quote: ''
  summary: The passage recounts Nassir's retreat toward Egypt after the sack of Aleppo,
    the fearful surrender of Damascus to Hulagu's representatives, the proclamation
    of safety under Mongol authority, the appointment and reinstatement of local authorities,
    and Hulagu's later capture of Harem after an oath of safe conduct, followed by
    the killing of its inhabitants except for one Armenian jeweller.
