canonical_text:
  quote: ''
  summary: The passage recounts a battle near Ispahan after Jinghis Khan's death,
    Ghiath's desertion of his brother Jelal, a Mongol ambush that breaks Jelal's forces,
    Jelal's escape and disappearance, his public return at the Bairam prayer, rewards
    and shaming after the battle, and Ghiath's later murder of Mohammed, Jelal's favored
    companion, in breach of an oath.
  language: English
  quote_policy: summarized
