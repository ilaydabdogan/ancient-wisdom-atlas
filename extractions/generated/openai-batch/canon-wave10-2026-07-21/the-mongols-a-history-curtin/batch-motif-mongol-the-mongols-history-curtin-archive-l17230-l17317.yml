canonical_text:
  quote: ''
  summary: The passage recounts an imperial edict justifying the removal of Tob Timur's
    ancestral tablet, the degradation and exile of Putacheli, and the exile of Yang
    Tekus by appealing to a succession narrative, alleged crimes against Kushala Khan,
    and Heaven's punishment and favor. It then describes the execution or death of
    punished figures, ministerial changes, the completion of dynastic annals under
    Toktagha, further cycles of office and exile, and the spread of rebellion, piracy,
    and flood-related public works in southern China.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the year given in the passage, the Emperor removed Tob Timur's tablet from
    the hall of Imperial ancestors, excluded the Empress widow from court, and exiled
    Yang Tekus to Corea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The edict says Kushala Khan, the Emperor's father, had been excluded from
    court and sent away, and later was summoned to the throne while beyond the Gobi
    desert.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The edict says Tob Timur accepted rule on condition of yielding to Kushala,
    sent the seal of Empire to him, and later caused his death while outwardly showing
    kindness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The edict says Tob Timur then took the throne again, appointed his own son
    as successor, put Empress Papucha to death, exiled the edict's speaker, and challenged
    the speaker's descent from Kushala.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The edict attributes Tob Timur's death to Heaven's punishment and presents
    the Emperor's own rule as dominion due to him as Kushala's eldest son.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The edict orders a tribunal to remove Tob Timur's tablet, deprive Putacheli
    of imperial title and appanage, send Yang Tekus into exile, and punish others
    involved in the alleged crimes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Yang Tekus was killed by Yue Kusar during the journey to Corea, and Putacheli
    died soon after reaching her place of exile.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Machartai, disapproving the cruel acts and fearing blame, resigned; Toktagha
    and Timur Buga took his place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Annals of the Liao, Kin, and Sung dynasties were completed by a commission
    of eminent scholars established under Toktagha when Togan Timur became Emperor.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The completed works included calendars, astronomical methods, biographies,
    lists of books, a Sung library of books on all subjects, and descriptions of foreign
    countries and tribute-paying states.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: After Toktagha retired, a series of ministers or officials were appointed,
    recalled, or exiled, including Alutu, Pierkie Buga, Turchi, Tai ping, and Toktagha
    himself.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Insurrection spread in southern China; troops were raised, cities seized,
