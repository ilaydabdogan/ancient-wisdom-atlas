canonical_text:
  quote: ''
  summary: The passage recounts Shah Mohammed’s flight from Nishapur and later regions
    as Mongol forces pursue him, sack towns, issue a proclamation claiming Heaven-given
    empire, and threaten those who resist. Mohammed repeatedly seeks refuge, narrowly
    escapes capture, is misdirected away from the pursuers by false guides, and finally
    considers refuge on a Caspian island while praying and vowing future justice if
    restored to power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When Shah Mohammed learned that enemy forces had entered Khorassan, he left
    Nishapur with a small escort under the pretext of hunting.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the Shah left Nishapur, the vizir, mufti, and cadi governed the city
    while awaiting a governor from Urgendj; the governor died before arrival, and
    an escort of one thousand later left the city and was cut to pieces by Mongols.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nishapur was summoned to open its gates, and the three regents answered that
    the city would surrender when Shah Mohammed was captured.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chepe gave the regents’ representatives a proclamation in Uigur characters
    stating that Heaven had given the Khan empire over east and west, that those who
    submit would be spared, and that those who resist would be slaughtered with their
    families and dependents.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The proclamation ordered provisions for Mongol troops and warned the city
    not to trust its walls or try to escape ruin.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Three Mongol bodies of ten thousand each pursued Mohammed toward Irak; Subotai
    and Chepe reunited at Ravi, took the place by surprise, and sacked it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Kazvin, Mohammed consulted leaders of his son Rokn un din’s army, and Hezerasp
    advised retreat across a mountain chain between Fars and Lur.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After news came that Ravi had been taken and plundered, chiefs and princes
    fled, and the army dispersed because of fear of the Mongols.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mongol forces nearly caught Mohammed on the road to Karun, shot arrows at
    him without knowing who he was, wounded his horse, and the horse carried him safely
    to the fortress.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After Mohammed escaped from the fortress, the Mongols pursued him, followed
    men who professed to be guides dismissed by him, realized they had been tricked,
    killed the guides, and returned to Karun.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Mohammed fled to Serdjihan, described as a strong place on a mountain, then
    to Gilan and Mazanderan, appearing stripped of property and almost unattended.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mohammed asked where he could find safety from the Mongols, and friends advised
    him to go to a little island in the Caspian as the safest place.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: At a village on the seashore, Mohammed prayed five times each day in the mosque,
    had the Koran read to him, and tearfully promised God that justice would reign
    in his empire if power came to him again.
  category: action
  evidence_refs:
  - ev:8
