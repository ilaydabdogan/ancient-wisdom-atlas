canonical_text:
  quote: ''
  summary: The passage recounts the Mongol siege and blockade of Mayafarkin, Prince
    Kamil's refusal to surrender, notable defensive episodes, famine and cannibalism,
    the city's fall, Kamil's execution and public display of his head, the fate of
    captured Mameluks, the later blockade and surrender of Mardin, and the honored
    reception in Egypt of Abul Kassin Ahmed, an Abbasid descendant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Prince Kamil refuses the summons to surrender Mayafarkin and says he will
    fight because he trusts no Mongols.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kamil opens his supplies and treasures to encourage his people and avoid the
    example of the Kalif of Bagdad, who is said to have lost life and empire through
    avarice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kamil begins the defense with a sortie in which many besiegers are killed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Both sides have skilled catapult operators; one report says stones launched
    at the same instant meet in the air and shatter each other.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two strong champions from Mayafarkin repeatedly join sorties and leave many
    Mongols dead on the plain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The siege becomes a blockade, famine appears, and the besieged are forced
    to eat dogs, cats, shoes, and eventually people.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After a year of blockade, the inhabitants report that no defenders remain;
    Oroktu Noyon finds only seventy half-famished people, and the Mongols enter to
    pillage.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The two champions move to a housetop, kill men passing below, refuse surrender
    when surrounded, and die fighting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Prince Kamil and nine Mameluks are captured and taken to Hulagu; Kamil is
    killed by having flesh torn from his body and forced down his throat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kamil's cut-off head is fixed on a lance, carried through several cities,
    paraded in Damascus with tambourines and singers, hung near the gate El Feradis,
    and later placed in the mausoleum of Hussein, son of Ali.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Eight of the nine Mameluks are killed; the last is spared because he had been
    chief hunter for the prince of Mayafarkin and is taken into Hulagu's service.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Mardin is attacked at Hulagu's command; its height protects it from projectiles,
    forcing a blockade that leads to epidemic and famine.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Said of Mardin dies during the crisis, with the passage giving either disease
