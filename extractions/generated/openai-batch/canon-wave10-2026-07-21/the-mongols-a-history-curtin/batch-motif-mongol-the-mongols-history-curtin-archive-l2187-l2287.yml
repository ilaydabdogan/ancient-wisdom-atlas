canonical_text:
  quote: ''
  summary: The passage narrates Temudjin after conflict with Jamuka, Kadan's hilltop
    appeal for her husband, Temudjin's campaign against the Tartars, discipline over
    booty, a council decision to kill Tartar male captives above a cart-wheel-hub
    height, Belgutai's disclosure of the decision and the prisoners' flight to a mountain
    stronghold, and the later taking of Aisugan and Aisui, including the discovery
    of Aisui's husband in a crowd near Temudjin's tent.
  language: English
  quote_policy: summarized
