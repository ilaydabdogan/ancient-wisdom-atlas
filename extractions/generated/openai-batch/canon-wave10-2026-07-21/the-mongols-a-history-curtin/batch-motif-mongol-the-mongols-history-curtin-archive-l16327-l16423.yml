  summary: The passage describes Kubilai's punishment of Sanga and other officials
    after abuses, summarizes the use of foreign finance officials and harsh exactions,
    records Kubilai's death, and then describes his public works, postal system, capital
    and palaces, annual hunt, court luxury, festivals, sacred number nine in gift-giving,
    and displays of horses, elephants, camels, and imperial goods.
