canonical_text:
  quote: "“Mount Burhan has saved me, and from this day I will make offering to the
    mountain...”"
  summary: Hoakchin warns Hoelun of an approaching raid. Temudjin and his family flee,
    while Bortai is hidden by Hoakchin but discovered and carried off by Merkit horsemen.
    The raiders pursue Temudjin toward Mount Burhan but cannot enter the mountain
    land. The narration explains Bortai’s abduction as vengeance for Yessugai’s earlier
    taking of Hoelun from Chilaidu. Temudjin later thanks Hoakchin and Mount Burhan,
    vows hereditary offerings and sacrifice to the mountain, performs homage and libation,
    and then asks Togrul and Jamuka to help rescue Bortai.
  language: English
  quote_policy: quoted
