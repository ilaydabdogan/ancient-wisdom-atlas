  evidence_refs:
  - ev:2
- id: obs:3
  text: After Turan Shah's killing, the chiefs gave allegiance to Shejer ud dur, who
    had been governing until Turan Shah could reach Cairo.
  category: relationship
  evidence_refs:
  - ev:2
