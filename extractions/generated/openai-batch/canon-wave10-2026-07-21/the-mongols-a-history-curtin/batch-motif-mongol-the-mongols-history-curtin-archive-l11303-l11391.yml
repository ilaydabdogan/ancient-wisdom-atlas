canonical_text:
  quote: ''
  summary: 'The passage recounts political turmoil in Egypt and Syria before and during
    the Mongol period: Salih dies, Turan Shah is murdered by Mameluk chiefs, Shejer
    ud dur and Eibeg rise to power, Mameluk/Bahriye power expands, Nassir contests
    Egypt, and fugitive Bahriye officers seek patrons before Mogith''s failed attack
    is defeated by Kutuz.'
  language: English
