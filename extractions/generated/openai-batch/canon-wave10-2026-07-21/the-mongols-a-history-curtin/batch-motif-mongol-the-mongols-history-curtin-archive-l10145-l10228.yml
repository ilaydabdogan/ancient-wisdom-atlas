  basis: Saladin orders Nur ed din's name to be mentioned in public Friday prayers
    after the Kalif's name and later transfers the prayer prerogative from the Fatimid
    line to the Abbasid line.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage describes historical Islamic political-religious practice;
    the taxonomy link is functional rather than a claim of mythic kingship.
- id: motif:6
  label: concealed esoteric knowledge revealed publicly
  taxonomy_refs:
