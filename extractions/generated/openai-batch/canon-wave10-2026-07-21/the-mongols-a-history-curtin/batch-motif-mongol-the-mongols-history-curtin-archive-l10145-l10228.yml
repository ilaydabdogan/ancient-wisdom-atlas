candidate_motifs:
- id: motif:1
  label: city burned to hinder an enemy
  taxonomy_refs: []
  basis: Fustat is deliberately set on fire by Shawer's command to hamper the enemy
    and burns for fifty-four days and nights.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is presented as a historical military tactic, not as a cosmic or
    supernatural fire motif.
- id: motif:2
  label: bodily token sent as distress appeal
  taxonomy_refs: []
  basis: Adhad encloses locks of hair from his wives' heads to dramatize his plea
    for rescue from Nur ed din.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage explains the sign within the historical narrative; no broader
