- id: motif:3
  label: treacherous banquet plot exposed
  taxonomy_refs: []
  basis: Shawer intends to destroy Shirkuh, Saladin, and their suite under cover of
    a banquet, but the plot becomes known before it succeeds.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives a political assassination plot rather than a ritual
    or supernatural feast.
- id: motif:4
  label: severed head as proof of enemy's removal
  taxonomy_refs: []
  basis: The Kalif asks Shirkuh for Shawer's head, and after Shawer is killed his
    head is sent to the Kalif.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The motif is extracted as a narrative pattern of political proof and vengeance,
    not as a mythic head cult.
- id: motif:5
  label: ritual speech transfers religious-political legitimacy
  taxonomy_refs:
