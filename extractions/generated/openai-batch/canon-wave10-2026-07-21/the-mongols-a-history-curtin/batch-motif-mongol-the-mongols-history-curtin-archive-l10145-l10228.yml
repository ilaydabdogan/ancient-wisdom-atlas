canonical_text:
  quote: ''
  summary: 'The passage narrates warfare and political-religious change in Egypt and
    Syria: Belbeis is captured, Cairo is besieged, Fustat is burned by Shawer''s command,
    Adhad appeals to Nur ed din, Shirkuh and Saladin come to Egypt, Shawer plots against
    them and is killed, Shirkuh and then Saladin become vizir, Saladin redirects public
    prayer allegiance from the Fatimid to the Abbasid line, and Hassan II assumes
    leadership among the Assassins, claims religious authority, and prepares an Alamut
    assembly with a pulpit facing Mecca.'
  language: English
  quote_policy: summarized
