canonical_text:
  quote: ''
  summary: Wang Khan and Sengun advance against Temudjin. Both sides assign vanguards
    and commanders. Huildar vows to seize a hill and plant Temudjin's tail standard,
    while Churchadai leads the Units. Temudjin's forces repel successive attacks;
    Sengun is wounded by an arrow and the Keraits cease fighting. Afterward Temudjin
    withdraws, grieves over missing companions and his son Ogotai, then receives Boorchu
    and later Boroul, who brings the wounded Ogotai back. Temudjin cauterizes Ogotai's
    wound with fire. Kadan Daldur reports that Wang Khan, after Sengun's wound and
    counsel from Achik Shilun, abandons further battle and returns home with his son.
  language: English
  quote_policy: summarized
