canonical_text:
  quote: ''
  summary: The passage narrates Mohammed's conflict with Kalif Nassir over titles,
    public prayers, succession, and authority; Mohammed secures a theological ruling
    to depose Nassir and recognize an Ali-descended Kalif. It then describes political
    violence in Persian Irak, the Shah's advance toward Bagdad, a disastrous mountain
    march ruined by prolonged snow and attacks, and a Sunnite attribution of the disaster
    to Divine anger. The passage ends with Mongol envoys from Jinghis Khan and an
    explanation of Sunni and Shiite succession claims.
  language: English
  quote_policy: summarized
