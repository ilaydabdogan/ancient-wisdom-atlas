canonical_text:
  quote: ''
  summary: The passage recounts Jinghis Khan's renewed campaign in northern China,
    palace violence at Chong tu, the killing of Hushaku by Kaoki, Tangut and other
    defections from the Kin side, the sack of many cities, Jinghis' Heaven-invoking
    peace message, a peace settlement involving marriage and tribute, and a later
    Kara Kitan revolt that drew Mongol intervention against the capital.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In 1213 Jinghis resumed military action in China, and Mongol armies advanced
    nearly to the gates of Chong tu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hushaku was placed in command north of Chong tu despite protests and spent
    much of his time hunting while Mongols were nearby.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hushaku spread a report that Tuktani was raising rebellion and used a false
    alarm about Mongols in the suburbs to cover his purpose.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hushaku summoned Tuktani as if for counsel and killed him with his own hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hushaku replaced the Emperor's guard with his own followers, moved the Emperor
    to another building, and the Emperor was killed that day by a eunuch.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hushaku wanted supreme power, but the throne passed to Utubu, the late monarch's
    brother.
  category: sequence
  evidence_refs:
  - ev:4
