    them unfaithful to their master.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After Otrar was taken, inhabitants were driven outside while the city was
    pillaged, and Inaldjuk continued resistance in the fortress until he was captured
    alive.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Jinghis had molten silver poured into Inaldjuk’s ears and eyes as vengeance
    for the slain merchants; the surviving inhabitants of Otrar were spared and the
    fortress was levelled.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Signak, inhabitants tore Juchi’s envoy to pieces while calling on God’s
    name; Juchi ordered continuous attack until the city was captured, after which
    every soul in the city was slain.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Juchi appointed a son of Hassan Hadji as commandant of the ruins of Signak
    and then moved along the river, sacking places he visited.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: At Jend, the commandant fled; the people considered killing Chin Timur, Juchi’s
    envoy, but released him after he warned them of Signak, and the Mongols later
    scaled the walls without resistance.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The inhabitants of Jend were driven into the open country for nine days and
