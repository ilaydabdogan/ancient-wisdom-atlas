- id: obs:1
  text: Jinghis arranged for a letter to be intercepted; the account says the Shah
    was deceived and separated his generals, while the narrator judges it more likely
    that the Shah and his commanders chose to fight from fortified cities.
  category: action
  evidence_refs:
  - ev:1
