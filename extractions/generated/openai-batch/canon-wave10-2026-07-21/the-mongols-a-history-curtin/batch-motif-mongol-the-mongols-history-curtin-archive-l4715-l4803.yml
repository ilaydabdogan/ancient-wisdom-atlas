  text: Jinghis reached the Syr Darya and organized his army into four great divisions
    with assigned commanders and objectives.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Otrar was strengthened and provisioned before a siege; after five months,
    surrender was considered, but Inaldjuk refused because he had killed Mongol merchants
    and expected no mercy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A chief of horsemen attempted a night escape from Otrar, was captured, offered
