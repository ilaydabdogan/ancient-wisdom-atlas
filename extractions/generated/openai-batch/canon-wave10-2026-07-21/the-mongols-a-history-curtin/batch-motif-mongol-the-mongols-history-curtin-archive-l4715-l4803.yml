  summary: The passage recounts Jinghis Khan’s campaign against the Kwaresmian Empire
    along the Syr Darya. It describes an intercepted letter, the Shah’s defensive
    dispersal, the Mongol division of forces, the sieges and punishments of Otrar
    and Signak, and the capture or sparing of other towns according to resistance
    or submission.
