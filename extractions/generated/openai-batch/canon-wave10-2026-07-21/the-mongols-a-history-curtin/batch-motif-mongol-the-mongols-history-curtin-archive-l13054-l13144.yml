  quote: ''
  summary: The passage narrates Tului's advance through mountain barriers into Kin
    territory, the Kin court's defensive deliberations, several engagements and feigned
    maneuvers, Ogotai's siege operations and river crossing, the failed Kin attempt
    to flood the country by cutting dikes, the encirclement of exhausted Kin forces,
    and Wanien Khada's capture and final exchange with Subotai.
  language: English
  quote_policy: summarized
