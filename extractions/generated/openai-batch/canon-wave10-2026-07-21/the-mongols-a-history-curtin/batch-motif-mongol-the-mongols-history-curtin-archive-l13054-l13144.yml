  text: Tului assembled thirty thousand mounted warriors at Pao ki.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tului captured Ta san kuan, destroyed Fong chin, opened a way through the
    Hwa mountains, crossed into Kin regions, took many towns and strong places, and
    caused large numbers of deaths and displacements.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Kin Emperor called a council and rejected a plan to concentrate the army
    in towns near Nan king, deciding instead to defend Honan at its northern and southern
