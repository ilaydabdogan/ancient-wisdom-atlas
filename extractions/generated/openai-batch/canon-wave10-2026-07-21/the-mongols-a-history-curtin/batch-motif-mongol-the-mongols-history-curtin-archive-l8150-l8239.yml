candidate_motifs:
- id: motif:1
  label: Disguised royal journey to a distant imperial court
  taxonomy_refs:
  - departure
  basis: The king leaves after delay, travels in disguise, crosses Asia Minor, and
    reaches multiple Mongol courts.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage is historical narrative rather than mythic tale; the taxonomy
    match is limited to the departure-and-journey pattern.
- id: motif:2
  label: Protective charter from a powerful ruler
  taxonomy_refs: []
  basis: Mangu gives letters patent that function as safeguard for the king and his
    country and as a charter of freedom for the Armenian church.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is an administrative or diplomatic pattern, not explicitly a sacred
    covenant.
- id: motif:3
  label: Conquest enabled by division among local rulers
  taxonomy_refs: []
  basis: The passage states that dissensions among princes enabled enemies to bring
    rulers to death or submission and populations to destruction or torture.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a historical-political pattern, not a specialized mythic motif.
- id: motif:4
  label: Hidden treasure extracted through coercion
  taxonomy_refs: []
  basis: Chin Timur tortures people to disclose hidden wealth, then kills them or
    forces survivors to repurchase their homes.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The hidden object is material wealth rather than sacred or forbidden knowledge.
- id: motif:5
  label: Mountain refuge of rebels and fugitives
  taxonomy_refs: []
  basis: Kankali bands occupy mountain districts, and Sangur later seeks refuge in
    the Kuhistan mountains after defeat.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The mountains are literal military refuges, not described as cosmic or
    sacred mountains.
- id: motif:6
  label: Failed sanctuary in a sacred building
  taxonomy_refs: []
  basis: Three thousand Kankalis seek safety in the grand mosque at Herat, but attackers
    force the mosque and kill every man.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The text describes hoped-for safety in a mosque but does not explicitly
    discuss sanctuary law or sacred protection.
- id: motif:7
  label: Imperial grant of rule contested by appeal to supreme authority
  taxonomy_refs:
  - royal_legitimacy
  basis: Sair claims the Grand Khan gave him Khorassan, while Chin Timur sends Kelilat
    to Ogotai with submitted princes to secure authority over the regions.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The motif concerns administrative legitimacy rather than mythic kingship
    or divine sanction.
