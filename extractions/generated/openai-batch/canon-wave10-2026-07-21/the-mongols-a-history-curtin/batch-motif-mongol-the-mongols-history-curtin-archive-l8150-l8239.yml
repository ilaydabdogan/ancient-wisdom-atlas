canonical_text:
  quote: ''
  summary: The passage recounts an unnamed king’s delayed, disguised journey to several
    Mongol courts and his receipt of letters patent from Mangu. It then describes
    devastation in Asia Minor and Khorassan, Mongol administrative appointments, Chin
    Timur’s coercive extraction of hidden wealth, Kankali resistance and defeat, the
    killing of refugees in a mosque, Sair Bahadur’s campaign against Karadja, and
    a jurisdictional dispute over Khorassan and Mazanderan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The death of Queen Isabella delayed an unnamed king, who set out in 1254,
    traveled in disguise, crossed Asia Minor, and visited the courts of Batu, Sartak,
    and Mangu.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mangu received the king with distinction and gave him letters patent serving
    as a safeguard for him and his country and as a charter of freedom for the church
    in Armenia.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator states that Mongol campaigns and Jelal ud din’s ravages brought
    many rulers to death or submission and many people to destruction or torture.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Jinghis Khan returned from the west, Juchi left Chin Timur in Kwaresm
    as governor.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: When Ogotai sent Chormagun against Jelal ud din, Chin Timur was ordered to
    guard Khorassan with troops from Kwaresm while Chormagun fought the Sultan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Chin Timur governed Khorassan with four colleagues appointed by different
    heads or branches of Jinghis Khan’s family.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Chin Timur sought jewels and gold, tortured people to reveal hidden wealth,
    killed them after learning its location, and made some survivors buy back their
    homes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kwaresmian or Kankali bands ravaged Khorassan, killed Mongol-appointed prefects
    and pro-Mongol Kwaresmians, and occupied mountain areas under Togan Sangur and
    Karadja.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Chin Timur attacked the Kankalis three times without crushing them, but Kelilat
    later defeated them at Sebzevar after three days of fighting.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After defeat, Karadja fled toward Sidjistan, Sangur sought refuge in the Kuhistan
    mountains, and three thousand Kankalis went to Herat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Kelilat sent four thousand horsemen to Herat; after three days they forced
    the grand mosque where the Kankalis had hoped for safety, and every man inside
    was killed at sword edge.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Sair Bahadur was commissioned by the Grand Khan to march against Karadja and
    bring fire and sword to rebels; he besieged Arak Seistan and took it after two
    years.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Sair Bahadur told Chin Timur that the Grand Khan had given him Khorassan to
    govern, while Chin Timur contested the matter by planning a report and sending
    Kelilat to Ogotai with submitted local princes.
  category: sequence
  evidence_refs:
  - ev:9
