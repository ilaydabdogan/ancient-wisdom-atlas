canonical_text:
  quote: ''
  summary: The passage describes Alamut as a strongly built and well-provisioned mountain
    fortress with rock-cut storage and a water-filled moat. Hulagu orders Alamut razed,
    leaves forces against Lemsher, and holds an eight-day feast. Rokn ud din, former
    ruler of Alamut, assists Mongol demands for Ismailian surrender, marries a Mongol
    woman, and is later sent toward Mangu's court under escort. Mangu refuses to see
    him, and he is killed with attendants near a mountain according to one account;
    a variant attributed to Rashid says he was killed while on the way to Mongolia.
    The passage then reports a general order to exterminate the Ismailians, including
    women and children, and closes with a hostile characterization of Rokn ud din
    and prior crimes attributed to him.
  language: English
  quote_policy: summarized
