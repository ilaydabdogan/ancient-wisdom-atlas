canonical_text:
  quote: ''
  summary: 'The passage describes Mongol movements among the Polovtsi, Caucasus foothills,
    and Russian forces: coerced guides lead the Mongols into ambush; the Mongols make
    and then betray an alliance with the Polovtsi; Polovtsi fugitives seek Russian
    aid; Russian princes kill one Mongol embassy while another invokes Heaven as judge;
    Russian and Polovtsi forces advance toward the Kalka while Mystislav acts without
    coordination with other princes.'
  language: English
  quote_policy: summarized
