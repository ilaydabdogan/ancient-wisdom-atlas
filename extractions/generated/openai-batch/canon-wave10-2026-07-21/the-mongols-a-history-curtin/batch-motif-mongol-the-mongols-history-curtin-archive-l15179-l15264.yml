canonical_text:
  quote: ''
  summary: The passage narrates Bayan's campaign along the Yang tse, including repeated
    city surrenders, peace overtures from Sung officials, a river battle in which
    Chinese vessels are sunk, the suicide by poison of a Sung governor, Kubilai's
    attempted restraint and later embassy, the killing and wounding of envoys, and
    a Sung court letter offering vassalage to Kubilai.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bayan crossed the great river with his army after nearby captures and surrenders,
    left a garrison under Alihaya, and moved east with the rest of his forces.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ching pong was charged with securing Chin y's submission; after a promised
    office, Chin y opened Hoang chiu's gates to the Mongols and induced another governor
    to surrender.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Many commandants along the Yang tse surrendered without waiting for a summons,
    and the passage states that Bayan's kindly reception of Chinese facilitated his
    conquests.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kia se tao gathered a large army and river fleet, then sent a Mongol captive
    as envoy with fruit presents and peace proposals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bayan answered that Kia se tao should have sought peace before Bayan crossed
    the Yang tse and should come in person if sincere; the letter received no answer.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sung forces attempted to bar the Yang tse with an island position and boats;
    Bayan attacked from both banks with ballistas and missiles, causing Chinese troops
    to flee to vessels, many barges to sink, and many men to die.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The river victory gave the Mongols large booty, weakened the resolve of Sung
    warriors, and was followed by further Mongol seizures and surrenders of cities
    in Kiang nan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wan li sin, wishing to die as a Sung subject, invited relatives and friends
    to a banquet and took poison before the city fell to the Mongols.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kubilai instructed Bayan to stop until autumn because great heat was approaching,
    but Bayan argued that an enemy held by the throat should not be given a breathing
    spell.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hao king and his suite were released from confinement, but Hao king became
    ill on the road and died after reaching Yen king.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Kubilai later sent a peace embassy; Bayan gave it an escort and forbade hostile
    acts, but Chinese troops attacked, wounded Lien hi kien, and killed his colleague.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Sung court sent a letter disclaiming knowledge of the attack, promising
    punishment of those responsible, and saying the Emperor was ready to declare himself
    Kubilai's vassal.
  category: speech
  evidence_refs:
  - ev:8
