canonical_text:
  quote: ''
  summary: 'The passage recounts late Sung resistance after Mongol advances: the prince
    Y wang is enthroned at Fuchau, Wen tien siang rallies Chinese resistance, Li ting
    shi refuses multiple demands to submit and is eventually captured and killed with
    Kiang tsai, further Mongol victories cause defections, and the Sung court flees
    by fleet toward Tsuen chiu, where ship seizures provoke the local governor to
    expel the fleet and deliver the city to the Mongols.'
  language: English
  quote_policy: summarized
