canonical_text:
  quote: ''
  summary: In 1199 Wang Khan and Temudjin attack Naiman forces after the Naiman polity
    has been divided by a quarrel between Buga Khan's sons. Jamuka persuades Wang
    Khan that Temudjin will betray him, causing Wang to leave at night. Gugsu Seirak
    then attacks Wang's people. Wang asks Temudjin for help, and Temudjin sends four
    chiefs, including Boorchu, who rescue Sengun, rally the broken forces, recover
    Wang's property, and defeat the Naimans. Wang thanks Temudjin and the four leaders
    with gifts and praise. Later, at the Black Forest, Temudjin tells Wang that each
    depends on the other's friendship for safety against enemies and plotting kin.
  language: English
  quote_policy: summarized
