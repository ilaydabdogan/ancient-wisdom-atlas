canonical_text:
  quote: ''
  summary: The passage recounts Mongol violence at Erbil, Sanjar's failed engagement,
    Salih's honored reception by Beibars and the Kalif, the long siege of Mosul by
    Samdagu, the interception of Akkush's relief message, ambush and defeat of the
    relieving force, Mongol deception through enemy clothing, surrender under a promise
    of mercy, massacre after the walls are removed, the return of hidden survivors,
    and the executions of Salih, his young son Alai ud din, and Mohai.
  language: English
  quote_policy: summarized
