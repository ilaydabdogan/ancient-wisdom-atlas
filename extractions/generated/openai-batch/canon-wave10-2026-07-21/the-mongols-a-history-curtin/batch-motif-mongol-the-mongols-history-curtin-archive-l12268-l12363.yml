- id: ev:5
  type: summary
  locator: lines 12301-12308
  quote_or_summary: Akkush is ordered to relieve Mosul and sends a pigeon, but the
    bird lands on a catapult in Samdagu's army and its letter informs Samdagu instead.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain; summary from supplied passage.
- id: ev:6
  type: summary
  locator: lines 12309-12315
  quote_or_summary: Samdagu sends warriors; Mongols wait in three ambushes; Egyptians
    suffer from ambushes and sand-bearing wind, and the Sultan's army is slaughtered
    except for a remnant.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain; summary from supplied passage.
- id: ev:7
  type: summary
  locator: lines 12315-12317
  quote_or_summary: The Mongols attack Sinjar, kill nearly all the men, and seize
    women and children captive.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain; summary from supplied passage.
- id: ev:8
  type: summary
  locator: lines 12317-12325
  quote_or_summary: Mongols wear the clothing of Akkush's dead warriors and approach
    Mosul; the people mistake them for forces sent by the Sultan, go out to meet them,
    and are slain.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain; summary from supplied passage.
- id: ev:9
  type: summary
  locator: lines 12326-12332
  quote_or_summary: After six months and summer heat, Samdagu promises to spare all
    and send Salih to Hulagu for pardon; Salih yields and sends surrender terms.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain; summary from supplied passage.
- id: ev:10
  type: summary
  locator: lines 12333-12339
  quote_or_summary: Salih comes to the Mongol camp on June 25, 1262, with presents
    and performers; Samdagu does not receive him and puts him under strong guard.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain; summary from supplied passage.
- id: ev:11
  type: summary
  locator: lines 12340-12351
  quote_or_summary: Samdagu tells the people to fear nothing and remove the walls;
