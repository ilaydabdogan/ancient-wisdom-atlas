canonical_text:
  quote: '"The Empire has been conquered on horseback," said the sage, "but no man
    can rule it from the saddle."'
  summary: After Ogotai becomes sovereign, he establishes Jinghis Khan's code, pardons
    recent offenses, and, under Ye liu chu tsai's advice, regularizes ranks, legal
    procedure, tribute, and provincial administration. Chu tsai urges governance by
    Confucian rules, and scholars gradually enter office. The Mongols then renew expansion
    according to plans attributed to Jinghis Khan's deathbed, arranging three major
    expeditions at the election Kurultai.
  language: English
  quote_policy: quoted
