canonical_text:
  quote: ''
  summary: Jelal seeks aid against the Mongols, first through Ashraf and then through
    Mozaffer. Ashraf delays the envoys by going to Egypt, while Mozaffer refuses aid
    because of conflicting oaths, political dependence on his brothers, and lack of
    authority over other princes. News arrives by pigeon and by a runaway Mongol that
    the Mongols are searching for Jelal. Jelal attempts an ambush using baggage as
    bait, but Otuz Khan gives a false report and the ambush is abandoned. Concluding
    that no aid will come, Jelal’s party resolves to retreat toward Ispahan with only
    the dearest wives and children. A later envoy from Massud of Amid proposes a campaign
    in Rum and promises troops.
  language: English
  quote_policy: summarized
