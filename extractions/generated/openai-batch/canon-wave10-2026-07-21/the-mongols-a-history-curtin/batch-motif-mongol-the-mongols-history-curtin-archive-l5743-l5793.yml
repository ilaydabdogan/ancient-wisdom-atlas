canonical_text:
  quote: ''
  summary: The passage recounts renewed slaughter after the destruction of Herat and
    Merv, including survivors hiding in ruins, on a mountain peak, and in mosques.
    It then describes Jinghis killing both supporters and deserters of Jelal ud din,
    followed by a feud among Agrak, Azam, and Nuh Jaudar that escalates into mutual
    killing and ends with a Mongol mounted corps killing indiscriminately while a
    small remnant flees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Herat was destroyed, troops were later sent to capture people who had
    escaped and appeared in the ruins; about two thousand were found and slain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sixteen people took refuge on a steep mountain peak, later descended to Herat,
    and were joined by a few others until the new population numbered forty.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief mosque of Herat is described as the only refuge of the forty-person
    new population.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Merv was partly repeopled after its ruin, but five thousand Mongols were sent
    there and slaughtered all whom they found.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ak Melik was left at Merv with an order to kill anyone who reappeared in the
    ruins, and he used muezzins calling from minarets to draw hidden Moslems into
    the mosque, where they were seized and killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Jinghis is said to have killed those faithful to Jelal ud din on the Indus
    and then destroyed those who had deserted him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Agrak asked Azam not to let Nuh Jaudar remain in Azam's country; Azam answered
    that Moslems had great need not to quarrel and followed with fifty men to make
    peace.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After eating and drinking wine, Agrak rode with one hundred men to the Kolluj
    camp; Jaudar, thinking Agrak wanted peace, rode out with his son to greet him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Agrak drew his sabre as if to strike Jaudar and was immediately killed by
    Jaudar's men; Agrak's adherents then killed Azam and attacked Jaudar's camp, killing
    Jaudar and his children, and later killed many Gur men.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A mounted Mongol corps then attacked all parties, killed indiscriminately,
    and a small remnant fled in different directions.
  category: sequence
  evidence_refs:
  - ev:7
