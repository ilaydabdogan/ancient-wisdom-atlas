canonical_text:
  quote: ''
  summary: The passage recounts a sequence of dynastic deaths and struggles in Fars,
    Turkan Khatun's role in deposing Mohammed Shah and elevating Seljuk Shah, Seljuk's
    murder of Turkan and Mongol prefects, the punitive campaign sent by Hulagu, Seljuk's
    final flight to the tomb of Sheik Morshed and death there, the enthronement of
    Uns Khatun, a debate over punishing Shiraz, and the later rise of Sherif ud din
    as a pious claimant whom many regarded as the expected Mahdi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Abu Bekr died after a thirty-year reign; Said succeeded briefly; a child named
    Mohammed later died; the Fars throne then passed to Mohammed Shah.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mohammed Shah had commanded the Fars contingent in Hulagu's campaign against
    Bagdad and is described as brave, unsparing, dissolute, and tyrannical.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Turkan Khatun had Mohammed Shah seized as he passed the harem and informed
    Hulagu that he was unfitted to govern.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Turkan Khatun freed Mohammed Shah's brother Seljuk Shah from prison and married
    him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At a wine-flushed banquet, Seljuk Shah was taunted about rising through his
    wife's favor and ordered a eunuch to cut off her head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the eunuch brought the princess's head, Seljuk Shah removed two pearls
    from the ears and threw them to the musicians at the banquet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Seljuk Shah heard that Hulagu's prefects in Shiraz disapproved of the
    killing, he killed them and also murdered people attached to them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hulagu ordered Mohammed Shah executed and ordered Altadju and Timur to march
    against Seljuk Shah with reinforced divisions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Altadju offered Seljuk Shah pardon if he repented, but Seljuk Shah maltreated
    the messenger.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Magistrates and notables bearing flags, food, and copies of the Koran went
    to meet Altadju; Altadju reassured them and forbade his troops to harm them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Seljuk Shah fought at Kazerun, fled to the tomb of the holy Sheik Morshed,
    and was surrounded there by the Mongols.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: At the tomb, Seljuk Shah broke the stone covering over the saint's body with
    a club and called on the Sheik for aid.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage reports a local saying that the saint had declared that people
