canonical_text:
  quote: ''
  summary: The passage describes Kurguz protecting Persian civilians from Mongol officers,
    restoring Tus, and participating in the repopulation and agricultural recovery
    of Herat after devastation. It then recounts his conflict with Sherif and with
    members of Jagatai's household after Ogotai's death, his arrest by Argun, judgment
    before Mongol princely authorities, and execution by having earth crammed into
    his mouth. After Kurguz's death, Sherif gains an opportunity to serve and is described
    as a low-born secretary and interpreter whose command of Mongol made him important.
  language: English
  quote_policy: summarized
