canonical_text:
  quote: ''
  summary: 'The passage recounts Mongol military and diplomatic pressure in Western
    Asia and the Caucasus: ransom demands, tribute arrangements, commands framed under
    heavenly authority, Hayton of Cilicia''s vassalage to the Grand Khan, Mongol conquests
    and withdrawals, reports of sackings, Queen Rusudan''s refusal to submit, the
    use of her son as hostage under Batu''s protection, the Mongol-backed installation
    and anointing of a rival David, and Rusudan''s death by poison.'
