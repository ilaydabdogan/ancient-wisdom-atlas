  summary: The passage recounts Sherif ul Mulk's rebellion against Sultan Jelal, the
    hiding of Jelal's harem and treasures, provincial revolts amid Mongol pressure,
    Jelal's efforts to gather troops, the killing of an envoy whose report might demoralize
    the army, Sherif's arrest and strangling after prayer, and Jelal's suppression
    of a revolt at Gandja by beheading its leaders.
