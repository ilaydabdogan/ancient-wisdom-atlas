canonical_text:
  quote: ''
  summary: Temudjin recognizes Kulan's wisdom and trusts Naya. After campaigns against
    the Merkits, he defeats Tukta Bijhi near the Irtish, suppresses revolts, disperses
    Merkit groups, and sends Subotai in an iron kibitka to hunt Tukta's sons with
    Heaven's aid. Jamuka, reduced to five servitors, is betrayed and brought to Temudjin,
    who executes the betrayers and offers Jamuka renewed companionship while recalling
    past services.
  language: English
  quote_policy: summarized
