candidate_motifs:
- id: motif:1
  label: Abducted wife recovered from captors
  taxonomy_refs:
  - stolen_beloved
  basis: Bortai had been taken by the Merkits and given to Chilger; Temudjin seeks
    her, calls for her during the flight, and announces that he has found those he
    was seeking.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage is framed as historical-legendary narrative rather than an
    explicitly supernatural rescue tale.
- id: motif:2
  label: Oath-bound anda friendship as shared life
  taxonomy_refs:
  - covenant
  basis: Jamuka states that a given word between allies is like an oath, and later
    Temudjin and Jamuka renew anda friendship, saying andas have one life and guard
    one another.
  evidence_refs:
  - ev:1
  - ev:9
  confidence: high
  cautions: The passage describes social and political oath-friendship; no divine
    witness to the anda oath is explicitly narrated.
- id: motif:3
  label: Exchange of gifts to renew a bond
  taxonomy_refs:
  - sacred_exchange
  basis: Temudjin girds Jamuka with a golden belt taken from the Merkits; Jamuka gives
    Temudjin a rich girdle and a white stallion during the renewal of their friendship.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The exchange is clearly formal and relational, but the passage does not
    explicitly call the objects sacred.
- id: motif:4
  label: Heaven-aided vengeance for insult
  taxonomy_refs:
  - divine_judgment
  basis: Temudjin says Heaven, through the aid of Togrul and Jamuka, strengthened
    his hands to avenge the insult committed by the Merkits.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage reports Temudjin's attribution to Heaven but does not describe
    a direct divine command, sign, or judgment scene.
- id: motif:5
  label: Questioned paternity after captivity
  taxonomy_refs: []
  basis: Bortai gives birth to Juchi in the same year, and the passage states that
    because of her captivity Juchi's real father remained a question in Temudjin's
    mind.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage notes uncertainty of paternity but does not develop its later
    political consequences within this excerpt.
comparison_claims:
- id: claim:1
  claim: The Bortai episode can be cautiously compared to a stolen-beloved pattern
    because a wife is abducted by enemies and recovered by her husband during a retaliatory
    campaign.
  claim_level: same_motif
  target: stolen_beloved motif family
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The passage emphasizes military pursuit and recognition rather than
    a magical or otherworldly rescue.
- id: claim:2
  claim: 'The renewed anda bond has the same function as a covenant pattern: speech
    and pledged mutual protection establish a binding relationship between allied
    men.'
  claim_level: same_function
  target: covenant motif family
  evidence_refs:
  - ev:1
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The text presents the covenant as social and martial; explicit divine
    sanction is not stated for the anda renewal.
- id: claim:3
  claim: The belt, girdle, and stallion exchange can be cautiously compared to a sacred-exchange
    pattern insofar as valuable objects mark and reinforce the renewed bond.
  claim_level: same_function
  target: sacred_exchange motif family
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The objects are not explicitly called sacred, and the passage does
    not specify a formal ritual formula for the exchange.
