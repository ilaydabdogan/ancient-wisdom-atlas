canonical_text:
  quote: ''
  summary: Togrul, Jamuka, and Temudjin join in an armed campaign against the Merkits.
    During the night flight of the Merkits, Temudjin finds Bortai, who had been taken
    captive and given to Chilger. The defeated Merkits are killed or captured, and
    Temudjin attributes the success to Heaven working through Togrul and Jamuka. Bortai
    later gives birth to Juchi, whose paternity is questioned because of her captivity.
    A small boy, Kuichu, is also seized and given to Hoelun. Temudjin and Jamuka renew
    their anda friendship, exchange valuable gifts, feast under a tree near a cliff,
    and sleep under one blanket.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Togrul set out with two tumans of warriors toward the Kerulon and met Temudjin
    at the river Kiinurha; one tuman was led by Togrul's brother Jaganbo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jamuka waited three days for Togrul and Jaganbo and reproached them for lateness,
    saying that a given word between allies is like an oath.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The warriors crossed the Kilho to Buura, seized people there, and took the
    wife of Tukta Bijhi; Tukta Bijhi and Dair Usun fled after being warned at night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: As the Merkits fled at night along the Selinga, Temudjin called for Bortai;
    she recognized his voice, came from a small covered cart with Hoakchin, caught
    his horse by the bridle, and the moon came through clouds as they recognized each
    other.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Temudjin sent word to Togrul that he had found the people he was seeking and
    asked to camp rather than continue that night.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage recalls that three hundred Merkits had previously attacked Temudjin,
    rode three times around Mount Burhan without finding him, took Bortai, and gave
    her as wife to Chilger.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Chilger, frightened by the army led by Togrul and Jamuka, said his offenses
    against Bortai had brought suffering on the Merkits and then hid or vanished.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Haatai Darmala was captured, a kang was put on his neck, and the party went
    toward Mount Burhan.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The three hundred Merkits who had ridden around Mount Burhan were all slain;
    their wives were assigned either to new husbands or to slavery.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Temudjin told Togrul and Jamuka that Heaven, through their aid, had strengthened
    his hands to avenge a great insult and that the Merkits were extinguished and
    their wives captive.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: That same year Bortai gave birth to Juchi, and the passage states that Juchi's
    real father was always a question in Temudjin's mind because of Bortai's captivity.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: A small boy named Kuichu, described as beautiful and richly dressed, was found
    in the Udut camp, seized, and given to Hoelun.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Temudjin, Togrul, and Jamuka destroyed the Merkit dwellings and captured the
    women left in them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Temudjin and Jamuka renewed their earlier anda friendship, discussed the idea
    that andas share one life and protect one another, exchanged valuable gifts, feasted
    under a broad tree near Huldah cliff, and slept under one blanket.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
