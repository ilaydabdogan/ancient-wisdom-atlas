canonical_text:
  quote: ''
  summary: 'Historical narrative of succession disputes in the Mongol ruling line
    in China: Bayantu displaces Kushala and appoints his own son Shudi Bala; Temudar
    is accused, reinstated, and posthumously punished; conspirators assassinate Baidju
    and Shudi Bala; the seal and insignia are carried to Yissun Timur, who becomes
    emperor and later punishes the conspirators; Asukeba''s succession is later challenged
    because earlier claims of Kuluk Khan''s sons had been bypassed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bayantu had been made heir on condition that he appoint one of his nephews
    as heir, but he removed Kushala, the eldest son of Kuluk Khan, and sent him to
    Yunnan as governor.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kushala's household officers viewed the move as exile, encouraged Mongol commanders
    to support him, then abandoned him; Kushala fled to the Altai for refuge among
    the Khans of Jagatai.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bayantu appointed his own son Shudi Bala as heir and died in February 1320.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Temudar, Bayantu's first minister, was accused of injustice, removed from
    office, and given a death sentence; the Empress delayed execution and reinstated
    him after Bayantu died.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Shudi Bala, also called Gheghen Khan, mourned his father, fasted, gave charity,
    refrained from acting against Temudar out of regard for his mother, and trusted
    Baidju.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: After Temudar died, accusers demanded justice; Shudi Bala cancelled Temudar's
    titles, destroyed his tomb, and seized his property.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tekchi and others connected with Temudar formed a plan to assassinate Shudi
    Bala and Baidju and give the throne to Yissun Timur.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tekchi sent Walus secretly to Yissun Timur with a letter bearing sixteen names
    and explaining the plan; Yissun Timur arrested Walus and sent an account of the
    plot to the Emperor, but the couriers arrived late.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Nanpo the conspirators killed Baidju in his tent, forced the guard of the
    Emperor's pavilion, and Tekchi slew Shudi Bala.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that Shudi Bala's death was the first assassination in
    the Imperial family of the Mongols.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Antai Buga and Yesien Timur seized the great seal and other insignia of dominion
    and brought them to Yissun Timur, who proclaimed himself Emperor at the Kerulon
    River and granted a general pardon.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Yissun Timur ordered the execution of conspirators, including Tekchi and his
    accomplices, and confiscated their property; Sonan was executed after ministers
    reported his attack on Baidju.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Yissun Timur appointed his son Asukeba as heir, but Asukeba's right was challenged
    because Bayantu had earlier been expected to make a son of Kuluk Khan his heir.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Yissun Timur was able to seize power while Kuluk Khan's sons were absent;
    he died five years later at Shang tu.
  category: sequence
  evidence_refs:
  - ev:10
