canonical_text:
  quote: ''
  summary: Jinghis and his commanders proceed through a series of campaigns and sieges.
    Termed is stormed and its inhabitants massacred after an old woman’s swallowed
    pearl is discovered. Balkh submits but is assembled under a census pretext, slaughtered,
    pillaged, burned, and demolished. Nusrat i kuh resists for six months before being
    annihilated. Tului, Subotai, Chepe, Togachar, and others ravage Khorassan, Tus,
    and Nessa; Nessa’s inhabitants are bound and slaughtered. The passage closes by
    introducing Merv as an ancient, renowned city near the Murghab River.
  language: English
  quote_policy: summarized
