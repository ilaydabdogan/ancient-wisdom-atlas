canonical_text:
  quote: ''
  summary: The passage recounts assassinations and political intimidation attributed
    to Hassan Sabah and the Assassin Order, the purge of Assassins by Akhras of Aleppo,
    retaliatory killings, demands for castles, rulers’ feigned obedience followed
    by demolition of strongholds, and Hassan’s intimidation of Sultan Sindjar through
    a dagger planted near his bed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hassan's policy is described as selecting victims from powerful and rich people;
    Mevdud, Prince of Mosul, was stabbed to death in the forecourt of the great mosque
    at Damascus, and the killer was immediately decapitated.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Risvan, Prince of Aleppo, had protected the Assassin Order and used it to
    extend his dominions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Akhras, Risvan's sixteen-year-old son, condemned all people belonging to the
    Assassin Order to death; more than three hundred men, women, and children were
    slain, and two hundred were imprisoned.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Abul Fettah, head of the Assassin Order in Syria, was killed and mutilated;
    other Assassins were thrown from a fortress, fled, denounced relatives, or were
    killed, and the Order's treasures were seized.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Order later retaliated; in an audience at Baghdad, three murderers attacked
    and killed Ahmed Bal, apparently mistaking him for Togteghin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Abu Mohammed commanded Ilghazi to surrender the castle of Sherif; Ilghazi
    feigned compliance while the people demolished walls and filled moats to prevent
    the Order from gaining the fortress.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Khashab, who devised the Sherif castle stratagem, was later killed; Bedii,
    governor of Aleppo, and one of his sons were also killed, and a surviving Assassin
    was imprisoned because Togteghin feared to mete out justice.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nur ed din received a command to surrender the castle of Beitlala, appeared
    to yield, secretly roused the people, and the fortress was destroyed to keep it
    from the Order.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that governors in Persia and Syria were opposed to the
    Assassins because they kept peace and order, and therefore were especially exposed
    to Assassin daggers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: After failed peace efforts with Sultan Sindjar, Hassan Sabah won over people
    in Sindjar's household and caused a servant to plant a dagger in the floor beside
    the sleeping Sultan's bed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hassan's note told Sindjar that the dagger could have been placed in his bosom
    and claimed that Hassan, from his rock, guided the hands of men around the Sultan;
    Sindjar then ceased disturbing the Ismailians.
  category: speech
  evidence_refs:
  - ev:7
