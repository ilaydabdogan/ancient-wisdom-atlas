  summary: 'The passage recounts Saladin''s military campaigns in Syria, repeated
    attempts by Assassins to kill him, his blockade and withdrawal from the Assassin
    stronghold of Massiat, and later developments at Alamut: Mohammed II''s poisoned
    death, Jelal ud din Hassan''s announced return to Islam and reforms, the later
    restoration of earlier practices under the child ruler Alai ed din Mohammed, and
    the designation of Rokn ud din Kurshah as successor.'
