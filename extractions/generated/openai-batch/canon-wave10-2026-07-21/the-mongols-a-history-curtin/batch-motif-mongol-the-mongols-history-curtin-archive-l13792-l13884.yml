literal_observations:
- id: obs:1
  text: Ogotai is described as spending time in pleasure, hunting, and drinking while
    residing seasonally among Kara Kurum, Kertchagan, Ormektua, Lake Kosa, and Ongki.
  category: setting
  evidence_refs:
  - ev:1
