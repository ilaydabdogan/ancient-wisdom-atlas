- id: obs:3
  text: Near Ongki, Ogotai had a large enclosure called chehik, with many doors, into
    which troops drove animals for hunting.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Game in the enclosure was killed first by the Grand Khan, then by his family,
    with permission descending by degrees until common men could hunt.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ogotai drank excessively; Jagatai ordered an official to limit the number
    of cups he drank, and Ogotai evaded the order by using larger cups.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ye liu chu tsai brought Ogotai a wine-rusted iron ring and used it as an example
    of wine's damaging effects, but Ogotai did not abandon the habit.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After Ogotai fell ill following a hunt, Turakina asked Chu tsai for help in
    seeking Heaven's restoration of the Grand Khan.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Chu tsai advised just deeds and benevolence, identifying corrupt sale of offices,
    traffic in justice, and the suffering of innocent prisoners as problems.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: When Ogotai came to his senses, imprisoned and exiled people were pardoned,
    and he recovered from that illness.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A later illness followed five successive days of hunting and drinking until
    midnight; the next morning Ogotai was dead.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After Ogotai's death, roads to his residence were guarded and couriers were
    sent to stop travelers until the Grand Khan's family had officially received the
    news.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ogotai had appointed Kutchu as successor, then destined Shiramun to empire
