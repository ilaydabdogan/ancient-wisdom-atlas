  summary: The passage recounts Shah Mohammed's flight from Mongol pursuit, his refuge
    and death on a Caspian island, and his deathbed transfer of authority to Jelal
    ud din. It also describes Turkan Khatun's flight, executions of imprisoned princes,
    the fall of Ilak through drought, and her capture by Jinghis Khan's forces.
  language: English
