canonical_text:
  quote: ''
  summary: The passage recounts Gutchluk's seizure of the Gurkhan's person and authority,
    Chepe Noyon's campaign against Gutchluk, the proclamation of religious freedom
    in Kashgar, Gutchluk's pursuit and beheading, Jinghis Khan's warning against pride,
    Chepe's earlier status as a former enemy who was accepted and promoted by Temudjin,
    and Chepe's later gift of white-muzzled horses as recompense for a horse he had
    killed.
