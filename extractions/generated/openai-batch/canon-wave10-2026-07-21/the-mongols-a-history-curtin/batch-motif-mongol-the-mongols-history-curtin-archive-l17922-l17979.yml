- id: obs:1
  text: A Mongol heir who died in 1378 had taken the title Khakan or White Khan, glossed
    as Grand Khan.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tukus Timur succeeded his father and was recognized with compliments from
