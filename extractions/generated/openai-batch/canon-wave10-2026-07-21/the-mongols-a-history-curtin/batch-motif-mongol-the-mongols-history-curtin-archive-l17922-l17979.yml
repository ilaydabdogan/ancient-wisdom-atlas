  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: In 1412 Mahmud, prince of the Uriats, killed Buin Shara and put Dalbek on
    the Mongol throne.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: For two centuries Mongol princes tried to regain lost dominion, yielding to
    China under sufficient force and attacking border provinces when they were unguarded.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: By the middle of the seventeenth century the Mongols were divided into groups
    under small chieftains, each bearing the title Khan.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Kalkas occupied the northern birthland of the Mongols; the Eleuts occupied
    former Naiman and Uigur lands to the west; the Chakars and Ordos lived between
    the Great Wall and the Gobi desert.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Manchu dynasty, after winning dominion in China in 1644, took some eastern
