  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tukus Timur's troops repeatedly violated Chinese borders, and in 1388 a Chinese
    army defeated him at Buyur Lake and captured his wives, second son, and more than
    three thousand officers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tukus Timur was assassinated near the Tula while fleeing; Yissudar, a prince
