  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ambition among other claimants produced ongoing civil war, brief reigns, the
    rise of Goltsi in 1403, Goltsi's assassination, and the elevation of Buin Shara
    as Khan.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Buin Shara refused the Chinese emperor's invitation to declare himself a vassal
    in 1408; a Chinese invasion followed and was defeated near the Tula.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Yung lo advanced with a large army in 1410, while Olotai deserted Buin Shara
