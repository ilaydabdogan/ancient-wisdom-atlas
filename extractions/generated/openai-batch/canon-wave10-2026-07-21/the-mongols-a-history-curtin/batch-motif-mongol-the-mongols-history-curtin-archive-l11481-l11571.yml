canonical_text:
  quote: ''
  summary: Hulagu summons regional rulers and receives or rejects submissions; some
    communities are spared while Sarudj is destroyed. In Syria, Nassir faces fear,
    weak loyalty, factional dispute, attempted violence, evacuation of families, and
    army collapse. In Egypt, Eibeg is killed by Shejer ud dur, who is then executed
    and dishonored; the boy Mansur is enthroned before Kutuz imprisons him and takes
    power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hulagu summoned the Prince of Mardin to obedience; the prince sent his son,
    a judge, an emir, presents, and a letter claiming illness as the reason for not
    appearing personally.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hulagu replied that the prince's illness was feigned because he feared Nassir
    of Syria and wished to preserve options between Hulagu and Nassir.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hulagu took Nisibin; Harran and Koha submitted and were spared, while Sarudj
    sent no deputation and its people were killed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hulagu's march caused dismay in Syria.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nassir and Mogith negotiated through envoys near Lake Ziza for six months
    and reached a treaty about Mameluks and Bahriyes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nassir resolved on resistance near Damascus but distrusted his army, whose
    officers and soldiers feared Hulagu's victorious forces.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The vizir Zein ud din el Hafizzi praised Hulagu and advised submission; Beibars
    Bundukdar struck and cursed him, calling him a traitor seeking Islam's destruction.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mameluks attacked Nassir in a garden with the intention of killing him and
    choosing a new Sultan; Nassir escaped to the citadel and later returned to camp.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A council decided that Nassir, his officers, and warriors should send their
    families to Egypt; the evacuation expanded, and many officers did not return,
    leaving Nassir's army disbanded.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Shejer ud dur killed Eibeg after believing he intended to kill her; she was
    then beaten to death, stripped, thrown over a fortress wall into the moat, and
    left without burial for several days.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Eibeg's fifteen-year-old son Mansur was raised to the throne, and Kutuz later
    imprisoned Mansur with his brother and mother before being proclaimed sovereign.
  category: sequence
  evidence_refs:
  - ev:8
