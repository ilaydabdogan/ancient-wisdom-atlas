literal_observations:
- id: obs:1
  text: The Ismailians hoped a war would end the Abbasids, were disappointed, and
    determined to act themselves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Assassins killed the Kalif Mostershed and his attendants and mutilated
    the corpses by cutting off ears and noses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rashid, successor to Mostershed, planned to avenge his father before moving
    against the Assassins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Four active adherents followed Rashid, entered his tent when an opportunity
    came, and stabbed him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rashid was buried in Ispahan, and the warriors assembled to march against
    the Order scattered.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: When news of Rashid's death reached the Grand Prior, there was joy in Alamut
    and kettledrums sounded for seven days and nights in the mountain region.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The murder of Rashid brought alarm to the Abbasid world, and the passage says
    Abbasid Kalifs thereafter rarely, if ever, appeared in public.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Agents of the Order traveled through Asia, fortresses already held were strengthened,
    and new fortresses were built, bought, or taken by force.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Kei Busurgomid, near death after fourteen years of rule, made his eldest son
    Kia Mohammed Grand Prior.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The ruler at Alamut increased the Order's power but did not claim sovereign
    power for himself; he ruled in the name of an invisible Imam expected to appear
    in the future and rule mankind.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The real tenets of the Order were known only to the Grand Prior and chosen
    associates bound to secrecy by dreadful oaths, while most people under Alamut's
    control considered themselves devout followers of Mohammed.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Some disciples were employed for political schemes or private revenge involving
    removal of men by dagger, and they believed they were serving a holy cause and
    removing enemies of faith and country.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Books and manuscripts of Hassan Ben Sabah and later Alamut chiefs were destroyed
    at the coming of the Mongols, making internal information difficult to obtain.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: In response to Sultan Sindjar's inquiry, the Prior stated belief in one God,
    Mohammed, the Koran, creation, the last day, rewards, punishments, judgment, and
    resurrection.
  category: speech
  evidence_refs:
  - ev:10
