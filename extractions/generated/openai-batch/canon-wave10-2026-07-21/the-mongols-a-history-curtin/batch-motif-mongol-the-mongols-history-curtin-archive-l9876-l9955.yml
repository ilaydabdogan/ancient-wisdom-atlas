  quote: ''
  summary: The passage recounts assassinations attributed to the Ismailian Assassins,
    the fear and celebration that followed, the expansion of the Order through agents
    and fortresses, succession at Alamut, claims of rule in the name of an invisible
    Imam, concealment of internal doctrine, and a public doctrinal reply framed in
    Islamic terms.
