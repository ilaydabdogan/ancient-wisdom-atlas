  summary: The passage recounts punishments and pardons under Timur, Durduka's campaign
    against Dua, Kaidu's final large campaign and disputed battle, Kaidu's claim to
    the title Grand Khan, the strength and marriage-wrestling challenge of Kaidu's
    daughter Aiyaruk, and the mourning and succession arrangements after Kaidu's death.
