    saying fear had driven him away and that he had not raised arms against Kubilai;
    Timur pardoned him and sent him with an army against Dua.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Durduka came upon Dua's troops suddenly while they were preparing to pass
    a river, defeated them, and many were slain or drowned.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In 1301 Kaidu led his largest assembled army with Dua and forty princes, while
