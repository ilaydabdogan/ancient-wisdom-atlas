canonical_text:
  quote: ''
  summary: 'The passage describes the political maneuvering after Kuyuk''s death:
    Batu and Siur Kukteni support Mangu for the imperial throne; Mangu is proposed,
    refuses, then accepts after pressure; a new Kurultai is arranged in Jinghis Khan''s
    homeland; Ogul Gaimish serves as interim regent and is associated with sorcery;
    Ogotai-line princes reject the election while Batu sends troops and orders Mangu''s
    installation.'
  language: English
  quote_policy: summarized
