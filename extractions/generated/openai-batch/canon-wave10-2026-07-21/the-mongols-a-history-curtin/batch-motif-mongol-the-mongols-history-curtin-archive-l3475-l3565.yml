canonical_text:
  quote: ''
  summary: 'The passage describes shifts of allegiance around Jinghis Khan: the sons
    of Tukta Bijhi seek refuge after carrying away their father''s severed head; the
    Idikut of the Uigurs first acts against them, then receives Mongol envoys and
    declares submission with vivid sky and river imagery; Jinghis tests the Idikut''s
    sincerity through a demand for personal homage and treasure. It then recounts
    a Tangut campaign ending in marriage alliance, and Arslan Khan''s break from the
    Gurkhan, homage to Jinghis, and incorporation as Jinghis''s fifth son through
    marriage to Altun Bighi.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The three sons of Tukta Bijhi and their uncle fled with Tukta Bijhi's head
    after cutting it from his body on the battlefield, and they sought refuge and
    protection from the Idikut.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Idikut killed the envoy sent by the fleeing brothers, took the field against
    them, scattered their forces, and later became troubled about the political danger
    caused by this act.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Jinghis Khan sent Alp Ing and Durbai as envoys to the ruler of the Uigurs
    after hearing of the Idikut's changed resolve.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Idikut honored the Mongol envoys and sent envoys of his own to Jinghis
    with a message yielding the Uigur land and calling himself Jinghis Khan's servant
    and son.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Idikut's message, the arrival of Jinghis's envoys is described through
    images of blue heaven appearing through clouds, a bright sun in the sky, and a
    blue shining river where ice had hidden everything.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Four envoys from the sons of Tukta Bijhi came to Jinghis Khan and declared
    their subjection.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Jinghis Khan doubted the Idikut's sincerity and sent a second message requiring
    the Idikut to come in person and present the greatest valuables from his treasure
    house.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Idikut took gold, silver, pearls, and other precious objects from his
    treasure house and sent them to Jinghis Khan, but excused himself from appearing
    in person.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Mongols invaded Tangut again, defeated forces there, captured Uiraka and
    the fortress of Imen, invested the chief capital Chong sing, and concluded peace
    when the Tangut king gave his daughter to Jinghis in marriage.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In 1209 Jinghis returned home in triumph and found Arslan Khan of the Karluks
    and the Idikut of the Uigurs waiting to render homage.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Arslan Khan had been under the Gurkhan's suzerainty, but after regional revolts
    and Mongol victories he killed the Gurkhan's agent, joined Jinghis Khan, and awaited
    favor.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Arslan desired a golden girdle, a high position in Mongol service, and the
