canonical_text:
  quote: ''
  summary: 'The passage narrates Tului''s siege and destruction of Merv: divided counsel
    in the city, failed resistance, assurances given during negotiation, binding of
    the governor and associates, forced evacuation, public execution of war chiefs,
    massacre and enslavement, torture for treasure, plunder and demolition, and the
    later killing of hidden survivors. It then introduces the siege of Nishapur, said
    to be undertaken to avenge Togachar, with extensive siege machinery, burning naphtha,
    an offer of submission, and Tului''s refusal.'
  language: English
  quote_policy: summarized
