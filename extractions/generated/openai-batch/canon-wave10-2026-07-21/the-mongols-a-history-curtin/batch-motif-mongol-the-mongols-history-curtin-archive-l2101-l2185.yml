- id: obs:4
  text: Kuridai, who was present at the oath-taking, tells Mergitai about the plot,
    and Mergitai urges him to warn Temudjin.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Kurulat sentry captures Kuridai on the road, learns his errand, frees him,
    and gives him a fast stallion.
  category: action
  evidence_refs:
  - ev:3
