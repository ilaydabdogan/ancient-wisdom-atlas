- id: obs:1
  text: Several named groups meet at Alhuibula and choose Jamuka as their Khan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The assembly takes an oath that anyone disclosing their plans should fall
    like the earth and be cut off like branches; they then push down part of a river
    bank and cut branches from a tree with sabres.
  category: speech
  evidence_refs:
  - ev:1
