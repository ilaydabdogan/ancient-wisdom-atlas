canonical_text:
  quote: ''
  summary: A coalition chooses Jamuka as Khan, takes an oath with enacted signs involving
    earth and tree branches, and plans to kill Temudjin. Kuridai, aided by Mergitai
    and a Kurulat sentry, warns Temudjin, who allies with Wang Khan. Jamuka's shamans
    raise wind and rain against Temudjin and his allies, but the weather turns against
    Jamuka and his army scatters. Later, after battle with the Taidjuts, Temudjin
    is wounded; Chelmai saves him by removing stiffened blood and obtaining cream
    mixed with water from the enemy camp. Temudjin praises Chelmai's services and
    promises not to forget them.
  language: English
  quote_policy: summarized
