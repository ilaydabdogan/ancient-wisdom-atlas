  evidence_refs:
  - ev:5
- id: obs:9
  text: Jamuka says Heaven is not gracious that day; his army scatters, and some allies
    leave him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After an all-day battle with Autchu's forces, Temudjin is wounded in the neck
    and faints from blood loss.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Chelmai sucks out stiffening blood from Temudjin's wound, preventing it from
    choking him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Chelmai strips himself naked, enters the enemy camp to find mare's milk, takes
