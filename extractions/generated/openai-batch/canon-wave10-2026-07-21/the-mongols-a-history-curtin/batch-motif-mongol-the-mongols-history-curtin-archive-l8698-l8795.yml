canonical_text:
  quote: ''
  summary: The passage introduces the Ismailians, later called Assassins, as an offshoot
    of divisions in Islam after Mohammed's death. It recounts early caliphal succession
    disputes, civil war between Aly and Muavia, political killings, Muavia's rise
    to sole rule, and his effort to secure Yezid's succession through oaths, including
    coercion at Mecca.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ismailians are described as later known by enemies as Molahids and by
    Europeans as Assassins, and as an offshoot from one of Islam's two divisions after
    Mohammed's death.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The divisions in Islam are attributed to the problem of finding a successor,
    or Kalif, after Mohammed's death.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Mohammed is said to have died without stating whom he wished to succeed him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Abu Bekr was elected by Medina, named Omar on his death bed, Omar appointed
    electors, those electors chose Othman, and Aly was elected after Othman was slain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Muavia was elected in Damascus as a Kalif opposed to Aly and used Othman's
    bloodstained clothes in the Damascus mosque to rouse Syria against Aly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A battle at Siffin between Muavia and Aly was indecisive, and arbitration
    over the caliphate did not settle the conflict.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Aly was killed by an assassin; Hassan succeeded him, resigned after six months,
    retired to Medina, and was poisoned; Muavia then became sole Kalif.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Muavia considered election unsafe and planned to choose his son Yezid as successor
    while Muavia was still ruling.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Deputations from cities and provinces named Yezid as heir and gave an oath
    of allegiance and homage; Arabian Irak and Syria joined in the oath.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Muavia went to Medina and Mecca to win or force consent to Yezid's election;
    named dissentients left Medina for Mecca after rude treatment.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Mecca men proposed earlier methods of choosing a Kalif, but Muavia ultimately
    forced them at sword point to give the oath to Yezid.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The passage states that the new method was followed throughout the empire
    afterward.
  category: sequence
  evidence_refs:
  - ev:10
