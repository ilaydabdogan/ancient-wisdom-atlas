canonical_text:
  quote: ''
  summary: The passage recounts Jelal's failed assault on Khelat, his campaign against
    Turkmen raiders, the Georgian killing of Mohammedans and burning of Tiflis, vengeance
    against the Ismailians, renewed conflict with Mongol forces, internal opposition
    involving Hussam ud din Ali and Jelal's consort, astrological counsel before battle
    near Ispahan, a battle oath in the palace courtyard, and the killing, massacre,
    beheading, and exposure of captured Mongols.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jelal attacked the city on his arrival and again the following day; his troops
    pillaged the outskirts but withdrew, and continued resistance led him to abandon
    the assault plan.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cold and deep snow drove Jelal away from Khelat, while Azerbaidjan also required
    his attention because Turkmans were pillaging people and caravans.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Jelal made a swift march against the Turkmans, cut off their retreat to the
    mountains, surrounded them, killed them, and took their families and booty as
    captives.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Georgians united, moved on Tiflis, killed Mohammedans there, and set the city
    on fire because they despaired of defending it against Jelal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Ismailians had killed a general favored by the Sultan, and Jelal retaliated
    by carrying fire and sword into their land.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hussam ud din Ali entered Azerbaidjan at the invitation of people hostile
    to Jelal, and Jelal's dissatisfied consort also invited him to seize the region.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Mongol force moved toward Irak and Ispahan; Jelal sent horsemen to watch
    them, and the Mongol force was described as five divisions with named commanders.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Astrologers advised Jelal to wait four days before fighting, and he complied.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Jelal received alarmed generals in the courtyard, spoke calmly on unrelated
    matters before discussing battle order, and made the generals swear not to turn
    from the enemy or prefer life to heroic death; he took the same oath himself.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: When Mongol foragers were sent into Lur, Jelal sent men after them, blocked
    defiles in their rear, killed many, and captured four hundred.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Some captured Mongols were given to the populace and massacred in the streets;
    Jelal personally cut off the heads of others, and their bodies were thrown out
    for vultures and dogs.
  category: action
  evidence_refs:
  - ev:9
