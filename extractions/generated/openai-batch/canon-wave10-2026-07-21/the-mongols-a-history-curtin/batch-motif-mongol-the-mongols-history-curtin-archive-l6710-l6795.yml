    conspirators.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sultan married Euzbeg's wife, and troops took Gandja while Euzbeg went
    to Alandja.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A newly raised Georgian army including Alans, Lesgians, Kipchaks, and others
