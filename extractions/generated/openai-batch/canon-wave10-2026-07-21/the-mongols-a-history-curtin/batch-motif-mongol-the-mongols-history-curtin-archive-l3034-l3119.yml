canonical_text:
  quote: ''
  summary: Jamuka answers Temudjin as a former anda, refuses renewed companionship,
    asks for a bloodless death, and promises posthumous aid to Temudjin's descendants.
    Temudjin deliberates, orders Jamuka killed without blood loss and buried honorably,
    then subdues opposing peoples, raises the nine white tails standard on the Upper
    Onon, takes the title Jinghis, and rewards Munlik, Boorchu, Mukuli, and others
    for their services.
  language: English
  quote_policy: summarized
