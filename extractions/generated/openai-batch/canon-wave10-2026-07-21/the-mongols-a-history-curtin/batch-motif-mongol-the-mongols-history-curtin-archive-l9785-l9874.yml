literal_observations:
- id: obs:1
  text: Aksonkor Burshi is described as the Prince of Mosul and as a just, daring,
    feared man.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:2
  text: Eight Assassins, disguised as dervishes, attacked Aksonkor in the chief mosque
    of Mosul while he was taking his place on the throne.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aksonkor killed three of the attackers but received a fatal wound; all remaining
    attackers were slain except one who escaped.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The escaped attacker's mother first adorned herself because she believed her
    son had died in the successful attack, then cut off her hair and blackened her
    face when he returned alive.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Busi, Prince of Damascus, was targeted after Tahir was executed and six thousand
    members of the Order were massacred at Busi's command.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that Assassin vengeance continued for years and passed
    from one generation to another.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sherns ul Muluk, the mufti of Kasvin, the mayors of Ispahan and Tebriz, merchants,
    and ordinary men are listed among those killed by the Order or its agents.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Kalif Abu Ali Mansur is described as the first Kalif to die by the hand of
    an Assassin, though the motive or sponsor is said to be unknown.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Efdhal was killed by two men of the Order, and the passage says no one knew
    who had employed them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the Kalif's assassination, Efdhal's son Abu Ali was freed and made vizir,
    but Assassins soon killed him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage describes Egypt as entering turmoil and disorder from struggles
