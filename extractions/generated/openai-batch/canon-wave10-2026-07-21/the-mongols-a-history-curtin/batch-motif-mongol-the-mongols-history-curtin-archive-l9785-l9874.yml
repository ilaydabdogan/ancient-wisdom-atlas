  summary: A historical account describes assassinations and attempted assassinations
    attributed to the Assassin Order, including attacks on Aksonkor Burshi, Busi,
    Fatimid and Abbasid political figures, and the weakening of the Abbasid Kalif
    Mostershed under Seljuk power.
