canonical_text:
  quote: ''
  summary: After Mangu's death, Kubilai accepts a treaty with the Sung side and withdraws
    northward because Arik Buga and allies may exclude him from the succession. The
    passage narrates a tribute agreement, a river-crossing massacre, Kia se tao's
    concealment of the treaty, Kubilai's election and enthronement at Shang tu, Arik
    Buga's rival title-taking, and the ensuing military and political conflict.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kubilai receives notice of Mangu's death and letters from his partisans urging
    him to prevent Arik Buga's attempts; Hao king advises that Arik Buga and Duredji
    may act together to exclude him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Kubilai accepts Kia se tao''s terms: the Sung Emperor is to acknowledge vassalage
    to the Grand Khan, pay annual silver and silk tribute, and use the Yang tse as
    a boundary.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Uriang Kadai's movement is affected by the treaty, and a rear guard crossing
    a river on a bridge of boats is attacked when Kia se tao sends sailing barges
    against the bridge; one hundred and seventy men left on the southern bank are
    killed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kia se tao keeps the Sung Emperor unaware of the treaty and presents the Mongol
    retreat and the rear-party massacre as his own victory.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kubilai camps outside Yen king and complains to Arik Buga about levies; Arik
    Buga gives quieting replies while allegedly seeking to draw Kubilai to the Kurultai
    or capture and kill him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Kubilai's adherents meet at Shang tu, elect him immediately, and place him
    on the throne with formalities in 1260.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A deputation of one hundred is sent to inform Arik Buga of Kubilai's election;
    Duredji is arrested and imprisoned after revealing intrigues; Apishga and his
    brother are seized and imprisoned by Arik Buga.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: Arik Buga sends Alemdar to levy troops and distribute silk and silver, wins
    declarations from some governors and generals, and takes the sovereign title.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The two claimants exchange envoys without agreement; Arik Buga sends an army
    that is defeated by Kubilai's vanguard, after which Arik Buga seeks protection
    in Kirghis regions and kills Apishga, Apishga's brother, and the deputation of
    one hundred.
  category: sequence
  evidence_refs:
  - ev:9
