canonical_text:
  quote: ''
  summary: 'The passage recounts late Yuan-period military rebellions and rival regimes:
    fighting around Shan tung, Tsi nan, and Ta tu; seizure of Kai fong fu and installation
    of an emperor there; a northern raid reaching Shang tu and burning Kubilai Khan''s
    palace; Chu yuan chang''s consolidation through a pirate''s submission and hostage
    pledge; internal killings among rival factions; the famine-stricken siege of Sin
    chiu; and Chin yiu liang''s ambush, confinement, killing of Siu chiu hwei, and
    self-proclamation as Emperor of Han.'
  language: English
  quote_policy: summarized
