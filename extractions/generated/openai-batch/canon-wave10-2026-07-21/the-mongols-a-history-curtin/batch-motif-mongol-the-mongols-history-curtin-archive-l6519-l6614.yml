canonical_text:
  quote: ''
  summary: Jelal manages suspected treason in Kerman, forms a political alliance in
    Fars, exploits disorder under his brother Ghiath, uses deceptive banners, messages,
    promises, and rings to undermine Ghiath, receives commanders and petty rulers
    in submission, and then campaigns against Kalif Nassir toward Baghdad.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sultan learns that Borak, his father-in-law, is suspected of pondering
    treason; Orkhan advises arrest and seizure, while Khodja Jihan argues that punishment
    without clear proof would unsettle many people.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jelal chooses to feign ignorance and continue his journey; Borak remains master
    of Kerman, and members of his family later rule there as the Kara Kitan dynasty
    of Kerman.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sad, son of Zengwi, Atabeg in Fars, is described as a ruler claiming descent
    from the Turk chief Salgar; Salgarid dominion is traced through Salgar's grandson
    Sankor and later descendants.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Near Shiraz, the Atabeg sends his son with five hundred horsemen to welcome
    Jelal and excuses his own absence by saying he had vowed not to meet anyone; Jelal
    accepts the explanation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Jelal returns territories to Sad and marries Sad's daughter in order to gain
    the Atabeg thoroughly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'Irak and nearby regions are described as disordered: local cruel masters
    hold districts, Ghiath''s name is mentioned in prayers but tribute is not paid,
    and unpaid troops take what they can from the people.'
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Jelal gives his horsemen white banners like those used by the Mongols; when
    Ghiath sees them, he thinks Mongols are attacking and flees.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Jelal sends Ghiath a message saying he came for rest after hardships and will
    withdraw if met with swords; Ghiath believes this, returns to Rayi, and dismisses
    his large forces.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Jelal sends an agent to Ghiath's generals with large promises and rings as
    proof of favor; many yield, while others report the rings to Ghiath, who arrests
    the agent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Jelal advances with three thousand picked horsemen; Ghiath flees to a fortress,
    then leaves that asylum after mild messages and goes to his brother's headquarters.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Commanders come to Jelal with shrouds on their shoulders and fall at his feet
    to seek pardon; he treats them kindly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Petty rulers who had gained power during anarchy come voluntarily to render
    homage; some receive permission to return to their places.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After securing power, Jelal campaigns against Kalif Nassir, besieges Shuster,
    lets his army forage in small parties, abandons the siege after two months, and
    moves toward Baghdad.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Kalif Nassir strengthens Baghdad and gives one million dinars to his troops
    before waiting for battle.
  category: action
  evidence_refs:
  - ev:8
