candidate_motifs:
- id: motif:1
  label: leaderless community seized by a stronger kin group
  taxonomy_refs: []
  basis: Boduanchar identifies the river group as having no head and says their ulus
    can be taken easily; the brothers then seize the people and bring them to their
    own place.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage frames the seizure in social and political terms; no explicit
    sacred or supernatural element is present.
- id: motif:2
  label: captive woman as clan ancestress
  taxonomy_refs:
  - royal_legitimacy
  basis: The first captive woman becomes Boduanchar's wife and bears a son from whom
    the Balin clan descends.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The taxonomy reference is functional and broad; the passage gives clan
    descent, not explicit royal consecration.
- id: motif:3
  label: impassable river crossed by hidden rafts
  taxonomy_refs: []
  basis: The Jelairs think the Kerulon cannot be crossed, but Golden Khan's forces
    secretly build rafts, cross quickly, and defeat them.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This is a military stratagem in the passage, not explicitly a mythic water-crossing.
- id: motif:4
  label: refugees become trespassers and provoke a widow's retaliation
  taxonomy_refs: []
  basis: Surviving Jelairs seek refuge at Monalun's settlement, dig roots, spoil a
    horse-training area, and are then trampled and dispersed by Monalun and attendants.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The motif candidate is based on sequence and social conflict; no wider
    taxonomy match is asserted.
- id: motif:5
  label: forgotten armor and fatal pursuit of stolen horses
  taxonomy_refs: []
  basis: Monalun's sons hastily pursue a stolen herd without armor; their wives bring
    the armor after the sons are already dead and are killed too.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not state whether the lack of armor directly causes the
    deaths, only that the armor arrives too late.
- id: motif:6
  label: hidden child survivor with adult protector
  taxonomy_refs:
  - survivor_pair
  basis: After the family slaughter, Kaidu survives as a small boy because his nurse
    hides with him under firewood.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The survivor pair is a nurse and child rather than a reproductive or founding
    couple; the passage does not make a supernatural claim.
- id: motif:7
  label: returned stolen horse enables vengeance journey
  taxonomy_refs: []
  basis: Nachin lacks a horse for reconnaissance and vengeance until a sorrel stallion
    from the stolen herd wanders back, allowing him to set out alone.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The return of the horse is narrated as timely but not explicitly miraculous.
- id: motif:8
  label: recognition of stolen possessions leads to ambush
  taxonomy_refs: []
  basis: Nachin recognizes hawks on the hunters' wrists as belonging to his brothers,
    lures the younger hunter aside, and kills him.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage ends before the encounter with the second hunter is completed.
comparison_claims:
- id: claim:1
  claim: 'The Kaidu-and-nurse episode has the same broad function as a hidden survivor-pair
    pattern: a child and protector survive after a kin-group massacre by concealment.'
  claim_level: same_function
  target: survivor_pair motif family
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The pair is nurse and child, not a marital or procreative survivor
    pair; the passage does not explicitly compare it to other traditions.
- id: claim:2
  claim: The captive-wife descent notice has a broad lineage-legitimating function
    because it explains the origin of the Balin clan through Boduanchar's captive
    wife and their son.
  claim_level: same_function
  target: royal_legitimacy motif family
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: low
  limitations: The passage gives clan descent rather than explicit royal legitimacy,
    enthronement, or divine sanction.
