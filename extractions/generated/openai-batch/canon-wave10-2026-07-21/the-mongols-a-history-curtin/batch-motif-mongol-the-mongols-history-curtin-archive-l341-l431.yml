canonical_text:
  quote: ''
  summary: The passage recounts Boduanchar's proposal and execution of a raid on a
    leaderless river community, the capture of a Charchiut woman who becomes a wife
    and clan ancestress, a genealogy leading to Mainyan Todan, Monalun, Katchi Kyuluk,
    and Nachin, conflicts with the Jelairs, a river-crossing attack by the Golden
    Khan's forces, the later killing of Monalun and her sons after horse theft, the
    survival of the child Kaidu with his nurse under firewood, and Nachin's beginning
    of reconnaissance and revenge against Jelair hunters.
  language: English
  quote_policy: summarized
