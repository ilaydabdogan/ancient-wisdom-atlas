literal_observations:
- id: obs:1
  text: Princes and higher officers assemble in the hall while others remain outside;
    an official commands homage, and those present touch their foreheads to the ground
    four times before also making obeisance before an altar tablet bearing the Khan's
    name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the banquet Kubilai's table is raised above the others and placed so he
    faces south; his chief wife sits at his left, princes sit lower at his right,
    officers lower still, and ordinary guests sit on the carpet.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two large men stand at the hall entrance to punish anyone who steps on the
    threshold by stripping and beating them with rods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Golden vessels, wine bowls, and handled cups are used at the banquet; those
    serving the Khan cover their mouths and noses, and music and kneeling accompany
    the Khan's raising of the wine cup.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kubilai has five principal wives, with Jambui Khatun as chief; each wife has
    her own court attended by damsels, pages, and eunuchs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Officials select Kunkurat girls for the Khan's court, pay their parents, and
    send the girls to be examined by matrons; those who pass attend the Khan, while
    others marry officers or become palace employees.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Chroniclers state that Jambui Khatun influenced Kubilai to become a Lamaist,
    and that he prayed to Christ, Mohammed, Moses, and Buddha for good fortune.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Kubilai is described as of medium stature, fair complexion, keen black eyes,
    and kindly disposition; he first designates Numugan as heir, then Chingkin, and
    Numugan is later banished after criticizing this appointment.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Guekjin urges Bayan to raise the issue that Kubilai has not named a successor;
    Kubilai then appoints his grandson Timur and charges Bayan to announce and install
    him with festivals and ceremonies.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: After Kubilai's death a Kurultai is held at Shang tu; Kamala aspires to the
    throne, but generals and Chinese officials adhere to Timur, and Bayan's sabre-backed
    declaration ends debate before Kamala and the princes kneel and Timur is proclaimed
    Grand Khan.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Timur gives imperial rank to his parents, raises a monument to Kubilai, Jambui,
    and Chingkin, assigns offices and commands, and Bayan is later remembered for
    justice and modesty.
  category: sequence
  evidence_refs:
  - ev:11
