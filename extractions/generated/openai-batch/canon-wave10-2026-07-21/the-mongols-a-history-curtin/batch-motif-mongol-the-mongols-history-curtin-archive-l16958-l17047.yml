canonical_text:
  quote: ''
  summary: A succession crisis follows the death of Yissun Timur. The Empress promotes
    her young son Asukeba, while Yang Timur, governor of the capital, supports Tob
    Timur from Kuluk Khan's line. Yang Timur uses the capital troops, arrests opponents,
    and has Tob Timur proclaimed. Rival forces supporting Asukeba are defeated; Shang
    tu surrenders the imperial seal and jewels, Asukeba dies, and his supporters are
    exiled or executed. Tob Timur then sends the great seal, robes, and regalia to
    his elder brother Kushala, who proclaims himself sovereign and confirms Tob Timur
    in succession.
  language: English
  quote_policy: summarized
