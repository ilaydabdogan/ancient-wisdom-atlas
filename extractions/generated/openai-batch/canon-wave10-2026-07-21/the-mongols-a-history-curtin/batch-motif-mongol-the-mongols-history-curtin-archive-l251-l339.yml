candidate_motifs:
- id: motif:1
  label: Child exchanged for food
  taxonomy_refs: []
  basis: A poor man asks Doben for venison and offers his son in return; Doben gives
    venison and takes the boy as an attendant.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents this as a pragmatic exchange; no sacred or ritual
    framing is stated.
- id: motif:2
  label: Celestial paternity and sacred birth of future rulers
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  - miraculous_child
  - royal_legitimacy
  basis: Alan Goa says a radiant golden-hued visitor comes by light and that her three
    youngest sons are children of Heaven whose status will be known when they become
    khans.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The paternity account is reported in Alan Goa's speech within the passage.
- id: motif:3
  label: Bundle of arrows as unity lesson
  taxonomy_refs:
  - wisdom
  basis: Alan Goa demonstrates that single arrows can be broken but a bound bundle
    cannot, then applies this to the brothers keeping one mind and one spirit.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The taxonomy reference is broad; the passage's specific image is the five-arrow
    bundle.
- id: motif:4
  label: Disinherited youngest brother departs
  taxonomy_refs:
  - departure
  basis: Boduanchar is denied property by four brothers, decides to leave, and rides
    away to live in freedom at a new place.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not yet complete a full heroic cycle; only the departure
    and independent settlement are present in this range.
- id: motif:5
  label: Falcon-assisted wilderness survival
  taxonomy_refs: []
  basis: Boduanchar catches and trains a falcon and survives by hunting, scavenging
    after wolves, and using the falcon to catch ducks and geese.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No available taxonomy reference precisely matches the falcon-aided survival
    pattern.
- id: motif:6
  label: Recognition through animal and feather signs
  taxonomy_refs: []
  basis: The new people identify Boduanchar by his mangy-tailed horse, falcon, daily
    milk visits, and feathers blown from the northwest.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The evidence supports recognition and tracking signs, but the passage
    does not mark this as a formal omen.
- id: motif:7
  label: Hospitality without known origins
  taxonomy_refs: []
  basis: Boduanchar and the new people meet daily with good feeling; they give him
    mare's milk though neither side asks or knows the other's origin.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This is a social pattern in the passage; its broader motif status requires
    review.
