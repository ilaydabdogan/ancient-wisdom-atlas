canonical_text:
  quote: '"Your three youngest brothers are children of Heaven"'
  summary: Doben obtains venison and exchanges part of it for a poor man's son as
    attendant. After Doben dies, Alan Goa bears three sons while widowed; her older
    sons question their paternity. Alan Goa teaches her five sons with single arrows
    and a bound bundle, explains that a golden-hued visitor from Heaven fathers the
    three youngest, and urges unity. After her death Boduanchar is deprived of property,
    leaves his brothers, survives with a trained falcon, befriends a new people by
    the Tungeli, and later returns reconciled with Ilatagi.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Doben finds a man roasting venison in the forest and receives most of the
    meat from him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A poor man of the Malish Boyandai asks Doben for venison and offers his son
    in return; Doben gives him a deer leg, takes the boy home, and makes him an attendant.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After some years, the boy grows up, Doben dies, and the grown attendant serves
    Alan Goa as widow.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: While widowed, Alan Goa bears three sons named Buga Hatagi, Tusalchi, and
    Boduanchar.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The two sons born of Doben question how Alan Goa has borne three sons without
    a husband or paternal brother in the yurta and suspect the resident man.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Alan Goa seats her five sons together, gives each one arrow to break, and
    then has them try to break five arrows bound together; the single arrows break,
    but the bundle does not.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Alan Goa says a golden-hued man enters her yurta through the door of light
    and the smoke hole like sunshine, fills her with brightness, and departs on rays
    of the sun or moon like a swift yellow dog.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Alan Goa says the three youngest brothers are children of Heaven and that
    their status will be known when they are khans.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Alan Goa tells her sons that if they stand apart they can be broken like single
    arrows, but if they keep one mind and one spirit no man on earth will injure them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After Alan Goa dies, four brothers take the shared property and give no property
    to Boduanchar, whom they count as weak and simple.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Boduanchar decides to leave, mounts a poor roan horse with a galled back and
    mangy tail, rides up the Onon, and builds a small yurta at Baljunala.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Near his yurta Boduanchar snares a falcon using hairs from his horse's tail,
    trains it, and lives through winter and spring by hunting and by using what wolves
    leave.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Beyond Mount Duilyan near the Tungeli River, Boduanchar discovers a new people,
    visits their yurtas, and drinks mare's milk given by them.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The new people do not know where Boduanchar came from, and he does not ask
    who they are, though they meet daily with good feeling.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Ilatagi searches for Boduanchar and asks the new people about a young man
    with a mangy-tailed horse marked by old gall sores.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The new people identify the young man as one who has a falcon and comes daily
    for mare's milk; they infer he lives northwest because duck and goose feathers
    blow from that direction.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: Boduanchar arrives, becomes reconciled, and goes home with Ilatagi.
  category: sequence
  evidence_refs:
  - ev:10
