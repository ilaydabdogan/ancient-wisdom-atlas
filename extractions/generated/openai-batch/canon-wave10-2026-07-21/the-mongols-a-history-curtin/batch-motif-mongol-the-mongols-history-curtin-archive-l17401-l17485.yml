candidate_motifs:
- id: motif:1
  label: court corruption with magical specialists and political scapegoating
  taxonomy_refs: []
  basis: Hama fills the palace with followers and Tibetan Lamas described as magical
    practitioners, then instigates accusations that remove Toktagha from power.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage is a historical narrative with hostile moral language; the
    magical specialists are reported by the narrator, not presented as performing
    a specific mythic act.
- id: motif:2
  label: dynastic name as rallying sign of royal legitimacy
  taxonomy_refs:
  - royal_legitimacy
  basis: Liau fu tong proclaims Han lin ulh as legal Sung Emperor, the claimant takes
    the designation Ming wang, and the Mongol court fears that the Sung name will
    rouse the Chinese.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: This is an explicitly political use of dynastic legitimacy, not a sacred
    kingship episode in the passage.
- id: motif:3
  label: succession plot to replace a failing ruler with an heir
  taxonomy_refs:
  - royal_legitimacy
  basis: Hama observes imperial decay and decides to raise the heir apparent to the
    throne; the design is discovered and Hama is killed.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives political motives and does not frame the attempted succession
    as divinely sanctioned.
- id: motif:4
  label: religious renouncer becomes victorious founder-saviour
  taxonomy_refs:
  - culture_hero
  - royal_legitimacy
  - departure
  basis: Chu yuan chang is described as a Buddhist priest who cast off his habit to
    become a warrior, gained supporters through success and moderation, was met as
    a saviour, and is identified as future founder of the Ming dynasty.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The extraction treats the historical narrative's language of destiny and
    saviourhood as motif-like; human review should confirm whether to retain culture_hero
    and departure taxonomy links.
- id: motif:5
  label: destruction of stranded vessels by fire weapons
  taxonomy_refs: []
  basis: Poan nu's heavy barks strand in the Han chuen shallows and rebels burn the
    flotilla with fire-bearing arrows, causing his death and the loss of Mien yang.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The motif is military and local; it should not be conflated with the available
    world-destroying fire family.
- id: motif:6
  label: rejected vassalage and tribute bargain for a captive
  taxonomy_refs: []
  basis: Chang se ching offers vassalage and yearly tribute in grain, gold, and silver
    if Chu ends the siege and releases Chang se te; Chu distrusts him, keeps the captive,
    and takes the city.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The exchange is political and material; no sacred exchange is stated in
    the passage.
