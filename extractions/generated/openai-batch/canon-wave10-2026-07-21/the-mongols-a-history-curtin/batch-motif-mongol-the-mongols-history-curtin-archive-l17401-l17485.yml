canonical_text:
  quote: ''
  summary: The passage narrates the weakening of Mongol rule under Togan Timur through
    palace intrigue, accusations against Toktagha, regional rebellions, rival imperial
    claimants, military defeats and victories, Hama's rise and execution, and the
    emergence of Chu yuan chang as a former Buddhist priest turned rebel warrior and
    future founder of the Ming dynasty.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hama served the inclinations of Togan Timur and populated the palace with
    his own followers, youthful debauchees, and Tibetan Lamas described as practicing
    magic and holding grotesque superstitions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Hama's instigation, imperial censors accused Toktagha of diverting funds
    intended for war and public service; Toktagha was stripped of office, exiled,
    and forced to surrender command.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Siu chiu hwei called himself Emperor, held Wu chang, and sent Ni wen tsiun
    to try to capture Mien yang.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Poan nu was sent against Ni wen tsiun; his heavy barks stranded in shallows,
    the rebels burned the flotilla with fire-bearing arrows, Poan nu died with warriors,
    and Mien yang was lost to the Mongols.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In 1356 Ni wen tsiun took Siang yang and conquered Tchong ling after defeating
    the Mongol general Tur chi pan.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Liau fu tong, chief of the Honan Red Caps, proclaimed Han lin ulh, son of
    the first pretender Han chan tong, as the legal Sung Emperor; the claimant took
    the designation Ming wang and established a court at Pochiu.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Mongol court feared that the name Sung, described as dear to the Chinese,
    might rouse them; Mongol forces were sent against the claimant, and Liu hala Buga
    defeated Liau fu tong, who fled with his Emperor.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After Toktagha's disgrace, Hama became first minister and his brother Sue
    sue became chief censor; Hama had Toktagha killed at his place of banishment.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Hama planned to raise the heir apparent to the throne, but the plan was discovered;
    Hama was sentenced to exile and then strangled by his enemies in 1356.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Chu yuan chang is introduced as destined to destroy Mongol rule in China and
    found the Ming dynasty; he was a Buddhist priest who cast off his habit to become
    a warrior under the rebel leader Ko tse ling.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Chu yuan chang gained supporters through continual success and moderation
    and was met by the people in Tai ping as their saviour.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Chu captured several cities and besieged Chang chiu; Chang se ching sent his
    brother Chang se te to relieve the city, but Chang se te was defeated and captured.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Chang se ching offered to become Chu's vassal and pay yearly tribute in grain,
    gold, and silver if Chu ended the siege and released Chang se te; Chu refused
    and captured the city.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: In the north, adherents of Ming wang were beaten in Shen si by the Mongol
    general Chagan Timur, while Liau fu tong had mastered most of Honan and wished
    to capture Kai fong fu.
  category: sequence
  evidence_refs:
  - ev:12
