  quote: ''
  summary: The passage describes Mohammed’s discouragement during the Mongol advance,
    conflicting advice among his commanders, Jelal ud din’s offer to resist at the
    Oxus, Mohammed’s fatalistic reply, his hurried flight through Khorassan after
    news of Bokhara and Samarkand, a plot by Turkish troops against him, Jinghis’s
    dispatch of three Mongol corps to pursue and capture him, and the Mongol treatment
    of cities that surrendered or resisted.
