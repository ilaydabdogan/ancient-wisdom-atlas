  summary: The passage describes Persian Shiite expectations around Shah Mohammed,
    Kalif Nassir's secret appeal to Jinghis Khan, diplomatic exchanges between Jinghis
    and the Kwaresmian Shah, the killing of Mongolian merchants at Otrar, and Jinghis
    Khan's mountain-top supplication to Heaven for vengeance before attacking the
    Kwaresmian Empire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Shiites of Persia interpreted events as the arrival of a day of justice
    and regarded the Kwaresmian Shah as an agent of Allah and a sacred person.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kalif Nassir convened a council at Bagdad, and a sage advised that Jinghis
    Khan could bring Shah Mohammed to his senses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Because the envoy's journey to the Mongols passed through Shah Mohammed's
    dominions, the envoy's head was shaved and the commission was written or branded
    on it, then covered; the message was also memorized.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After four months of travel, the envoy reached Mongol headquarters, delivered
    the message orally, was admitted secretly to Jinghis Khan, and revealed credentials
    traced with fire on his crown.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The hidden message included an invitation for Jinghis Khan to invade the Kwaresmian
    Empire and destroy its reigning dynasty.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Jinghis Khan considered the invitation but waited for a reason to justify
    attacking a ruler with whom he had recently spoken in friendship.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Jinghis Khan sent three envoys to Shah Mohammed with gifts including silver
    ingots, musk, jade, and white camel-hair robes.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The envoys' message expressed a desire for peace and commerce while addressing
    Shah Mohammed as Jinghis Khan's cherished son.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrator explains that the message functioned as a demand that Mohammed
    declare himself a vassal because ruler relationship terms denoted degrees of submission.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Shah Mohammed questioned one envoy at night about Jinghis Khan's conquest
    of China and military strength, then dismissed the envoys with apparent friendliness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The narrator states that wherever Jinghis Khan became sovereign, travelers
    immediately had safety even where robbery had long been customary.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: A party of four to five hundred merchants from Mongolian places arrived at
    Otrar with rich wares; Inaldjuk imprisoned them, reported them as spies, and killed
    them after Shah Mohammed ordered their death.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: When Jinghis Khan heard of the slaughter, he wept with indignation, went to
    a mountain top, bared his head, put his girdle around his neck, prostrated himself,
    implored Heaven for vengeance for three days and nights, then descended to attack
    the Kwaresmian Empire.
  category: sequence
  evidence_refs:
  - ev:10
