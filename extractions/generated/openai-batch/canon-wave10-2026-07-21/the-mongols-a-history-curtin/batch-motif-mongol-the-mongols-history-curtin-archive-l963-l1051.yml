  summary: The passage describes Temudjin consolidating authority in his household,
    the killing of his half brother through Kassar, a Taidjut pursuit led by Targutai,
    Temudjin's refuge on Mount Targunai, two events he interprets as Heaven's protection
    or will, his capture and confinement, and his escape with aid from Sorgan Shira
    and an old woman.
