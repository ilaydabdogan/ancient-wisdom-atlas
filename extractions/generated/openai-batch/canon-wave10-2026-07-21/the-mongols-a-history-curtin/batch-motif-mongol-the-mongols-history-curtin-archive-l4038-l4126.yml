canonical_text:
  quote: ''
  summary: The passage recounts the westward movement of Yeliu Tashi after the fall
    of Kitan rule, his recognition by local rulers, his conquests and creation of
    Kara Kitai authority, later succession under Chiluku, the asylum and marriage
    granted to a fleeing Naiman prince later called Gutchluk, Gutchluk's rebellion
    with outside support, and the assault and slaughter at Bela Sagun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Kitan rule in North China was overthrown by the Kins, Yeliu Tashi took
    farewell of his sovereign in 1123 and journeyed westward with two hundred men.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Governors and tribal chiefs along Yeliu Tashi's route showed him homage as
    a descendant of Apaki and supplied armed warriors.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bilik, prince of the Uigurs, received Yeliu Tashi at the boundary with gifts
    of livestock, gave sons and grandsons as hostages, and recognized him as overlord.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Yeliu Tashi conquered Kashgar, Yarkend, Khotan, and Turkistan, and rulers
    in Transoxiana and Kwaresm were reduced to vassalage or tribute.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After extending his dominion across a broad region, Yeliu Tashi took the title
    Gurkhan of Kara Kitai and fixed his chief residence at Bela Sagun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Chiluku welcomed the son of the last Naiman ruler when he came seeking asylum
    in Kara Kitai and gave him his daughter in marriage.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says Chiluku's occupation with hunting and pleasure caused major
    vassals to defect and led his new son-in-law to move against him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Naiman Khan requested permission to gather scattered Naiman remnants under
    the claim that they could serve Chiluku; Chiluku consented, gave rich presents,
    and confirmed the title Gutchluk, meaning the Strong Man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Gutchluk gathered followers from several places, was joined by the chief of
    the Merkits, and his bands made incursions for wealth before he sought an ally.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Gutchluk asked Shah Mohammed to attack the Kara Kitai Empire, and a Kara Kitan
    army sent toward Samarkand was recalled to meet Gutchluk's war against Chiluku.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: While Chiluku's army was absent, Gutchluk seized the state treasures at Uzkend
    and tried to surprise Bela Sagun, but Chiluku took the field and defeated him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Shah Mohammed and Osman attacked Kara Kitan forces and captured Tanigu; defeated
    troops later plundered their own subjects, were refused entry by Bela Sagun, besieged
    it, took it by assault, and slaughtered its people.
  category: sequence
  evidence_refs:
  - ev:8
