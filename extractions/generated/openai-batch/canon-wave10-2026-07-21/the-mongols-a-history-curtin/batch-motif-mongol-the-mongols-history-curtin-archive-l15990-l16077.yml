canonical_text:
  quote: ''
  summary: The passage recounts Kubilai's confrontation with Kaidu and allied or rival
    Mongol princes. Kaidu asserts a hereditary and assembly-based right to the Mongol
    throne, fights and later allies with Borak as an anda, gains influence over Jagatai
    territory, and opposes Kubilai through alliances and invasions. Tok Timur later
    backs Shireki and then Sarban as claimants, while Kubilai's commander defeats
    the rebel combination. The passage ends with Tok Timur's death and a note on his
    battlefield bravery, white horse, and view of blood as ornament.
  language: English
  quote_policy: summarized
