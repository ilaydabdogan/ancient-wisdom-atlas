canonical_text:
  quote: ''
  summary: 'The passage narrates fourteenth-century military and court struggles in
    China: Ming yu chin proclaims a Hia dynasty in Su chuan; Chu yuan chang defeats
    Chin yiu liang and his sons, ending their would-be Han dynasty; then Mongol court
    factions struggle after Chagan Timur''s murder, with Polo Timur, Tukien Timur,
    the heir, and ministers contending around imperial authority.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ming yu chin, formerly sent by Siu chiu hwei to conquer Su chuan, captured
    the Su chuan capital after learning of his master's murder and proclaimed himself
    Emperor of a dynasty called Hia.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: War began between Chu yuan chang and Chin yiu liang, who is described as a
    seeker for Empire and as the general who had beaten Siu chiu hwei to death with
    a crowbar.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chu yuan chang defeated Chin yiu liang near Kiu kiang, captured Kiu kiang
    and Nan chang fu, and received submissions from principal cities in Kiang si.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Chin yiu liang equipped many vessels and besieged Nan chang fu; Chu yuan chang
    sailed from Nan king with a flotilla, met him at Lake Poyang, and after a three-day
    battle Chin was killed by an arrow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Chin yiu liang's eldest son was captured, his officers yielded, and his second
    son Chin li proclaimed himself Emperor at Wu chang before surrendering without
    conditions.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The surrender of Wu chang was followed by the surrender of Hu kuang, and the
    passage attributes the ease of later conquest to Chu yuan chang's reputation for
    leniency and his army's discipline.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Before the campaign against Chin yiu liang's dynasty, Chu yuan chang responded
    to the capture of Ngan fong, where the Sung Emperor was living, and defeated Liu
    chin.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After Chagan Timur's murder, Polo Timur tried to capture Tsin ki despite imperial
    commands, but his troops were defeated by Kuku Timur, Chagan's son.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Mongol sovereign's weakness is said to have favored factions, and the
    heir, influenced by Cho se kien, accused prominent persons and caused two leading
    persons to be put to death.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Cho se kien and Pa pu hwa plotted against Tukien Timur; Polo Timur defended
    him, refused to surrender command after being stripped of office, and Tukien's
    movement toward the capital caused the heir to flee northward.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Tukien Timur declared that Polo Timur remained loyal to the Emperor and demanded
    Cho se kien and Pa pu hwa as traitors; he retired only after the two ministers
    were handed over and Polo Timur was reinstated.
  category: speech
  evidence_refs:
  - ev:10
