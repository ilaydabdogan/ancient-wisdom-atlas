  summary: The passage recounts Babek's violent rebellion, capture, public humiliation,
    and execution; then describes Abdallah of Ahwas developing a secret political-religious
    movement, the spread of its teachings through agents, the Karmathite outbreak
    and attack on Mecca, and Abu Abdallah's later mission among Berbers with an announcement
    of a Mahdi.
