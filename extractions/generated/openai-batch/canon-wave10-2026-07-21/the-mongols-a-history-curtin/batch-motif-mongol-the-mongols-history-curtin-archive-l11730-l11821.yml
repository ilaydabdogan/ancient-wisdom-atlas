- id: ev:5
  type: summary
  locator: lines 11779-11786
  quote_or_summary: Egypt, formerly a refuge from Mongols, fears invasion; Africans
    in Cairo leave, and Mongol envoys in Cairo demand the Sultan's obedience and threaten
    war.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:6
  type: summary
  locator: lines 11786-11796
  quote_or_summary: Kutuz convenes a great council; Kaimeri argues Hulagu cannot be
    trusted, Beibars calls for war, the chiefs agree, and Kutuz declares they will
    take the field and not be remembered as cowards.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:7
  type: summary
  locator: lines 11797-11805
  quote_or_summary: The council decides Hulagu's envoys must die; Kutuz levies tribute
    and taxes, seizes deserters' goods, and forces Nassir's wife and other women to
    surrender jewels.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:8
  type: summary
  locator: lines 11805-11812
  quote_or_summary: Kutuz takes an oath of fidelity from his generals and departs
    from the Castle of the Mountain on July 26, 1260, with a force of 120,000 Egyptians,
    Syrians, Arabs, and Turkmans.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:9
  type: summary
  locator: lines 11812-11818
  quote_or_summary: On the day of departure, Kutuz has the chief Mongol envoy and
    three others beheaded in Cairo, exposes their heads at the Gate of Zavila, and
    spares only one of the remaining envoys.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:10
  type: summary
  locator: lines 11819-11821
  quote_or_summary: A summons throughout Egypt orders every warrior to march in the
    struggle for Islam; anyone trying to hide is punished with bastinado.
  source_text_path: texts/public-domain/mongol/internet-archive/the-mongols-a-history-curtin.md
