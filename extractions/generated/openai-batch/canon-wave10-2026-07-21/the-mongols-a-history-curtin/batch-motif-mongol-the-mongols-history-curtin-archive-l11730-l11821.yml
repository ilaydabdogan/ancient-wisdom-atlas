canonical_text:
  quote: ''
  summary: The passage narrates Hulagu's withdrawal after news of Mangu's death, Kita
    Buga's command in Syria, Nassir's desert flight, betrayal, capture, and coerced
    surrender of Ajalon, then Egypt's response to Mongol demands. Kutuz convenes a
    council, chooses war, raises resources, takes oaths from his generals, executes
    most Mongol envoys, displays several heads, and summons all Egyptian warriors
    to fight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hulagu received news of Mangu's death, decided to return toward Mongolia,
    made Kita Buga commander in Syria, and ordered the walls and citadel of Aleppo
    leveled.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Historians are reported as saying Hulagu had intended to take Palestine from
    Moslems and give it to Christians before Mangu's death changed his course; his
    journey was later stopped by news that Kubilai had been elected.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kutuz wrote to chiefs under Nassir, offering offices and money, and Turks
    and Kurds deserted Nassir.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nassir changed route, traveled by desert toward Shubek and Balka, and was
    reduced to a small following with little beyond horses and servants.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two Kurd attendants informed Kita Buga of Nassir's whereabouts, and Mongols
    seized Nassir near Lake Ziza.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kita Buga forced Nassir to order the commandant of Ajalon to surrender the
    fortress, and Ajalon was leveled to the ground after resistance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Mongols had taken possession of Baalbek and ruined the city and its citadel.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nassir was sent to Tebriz with relatives and other captives; while passing
    Damascus and seeing Aleppo's ruins, he was deeply affected and wept.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hulagu received Nassir well and promised to reinstate him in Syria after subduing
    Egypt.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Egypt, formerly a refuge for people fleeing the Mongols, became fearful of
    threatened invasion; Africans living in Cairo returned to distant homes.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mongol envoys came to Cairo, summoned the Sultan to obedience, and threatened
    war if he refused.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Kutuz convened a great council; Nassir ud din Kaimeri and Beibars favored
    war, the chiefs agreed, and Kutuz declared that they would take the field and
    do their duty.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: It was decided that Hulagu's envoys must die, and they were imprisoned before
    execution.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Kutuz raised resources by levying tribute, taxing revenues and heads, seizing
    goods of deserters, and forcing Nassir's wife and other women to surrender jewels.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Kutuz took an oath of fidelity from his generals and departed from the Castle
    of the Mountain with a large mixed army.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: On the day of departure, Kutuz had four leading Mongol envoys beheaded in
    four quarters of Cairo and exposed their heads at the Gate of Zavila.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: A summons ordered every warrior in Egypt to march in the struggle for Islam,
    and anyone hiding was punished with bastinado.
  category: action
  evidence_refs:
  - ev:10
