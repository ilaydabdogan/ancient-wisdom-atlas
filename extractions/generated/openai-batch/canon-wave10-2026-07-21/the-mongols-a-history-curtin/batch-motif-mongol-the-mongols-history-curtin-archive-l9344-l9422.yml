  quote: ''
  summary: The passage describes Ismailian instruction as a guarded graded initiation
    taught by apostles and masters. Novices pass through degrees, swear silence and
    allegiance, and learn doctrines about seven Imams, seven word-endowed prophets
    with vicars, Ismail as the latest prophet and sole guide to salvation, twelve
    apostles of the supreme Imam, and the mystic interpretation of Islamic practices
    with an emphasis on rational proof.
  language: English
  quote_policy: summarized
