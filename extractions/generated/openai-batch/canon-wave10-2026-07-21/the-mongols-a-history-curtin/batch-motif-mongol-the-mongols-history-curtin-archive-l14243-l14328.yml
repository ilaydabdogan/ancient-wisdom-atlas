canonical_text:
  quote: ''
  summary: The passage recounts accusations and executions around the Uigur Idikut
    Salendi under Mangu, a reprieve made in hope of obtaining a cure from High Heaven,
    Mongol practices for condemned criminals granted life, and later campaigns under
    Mangu, Kubilai, and Uriang Kadai, including a sacrifice to Heaven from a mountain
    top and Kubilai's use of banners forbidding killing at Tali.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A slave accused the Buddhist Idikut Salendi of planning to kill Mohammedans
    in mosques on a Friday throughout the Uigur kingdom.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Salendi denied the accusation, was summoned for trial, was tortured, confessed
    guilt, and was sent back to Bish Balik for execution.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Salendi's head was cut off by his own brother Okendji, and two higher officials
    condemned as accomplices were executed by being cut crosswise into four pieces.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bela was condemned to death but was reprieved when Mangu wished to win from
    High Heaven the cure of his mother; Bela's family and possessions were taken,
    and he was sent on a mission to Syria and Egypt.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that Mongol princes who granted life to a criminal sent
    him to the army, a perilous mission, or a country with a death-dealing climate.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The slave accuser received recompense, became a Mohammedan, and was courted
    with rich presents by frightened Uigurs on returning to Bish Balik.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After Mangu removed Uigurs who might favor Ogotai's descendants, he gave the
    kingdom to Okendji, Salendi's brother and executioner.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In 1252 Mangu gave Honan to Kubilai as an appanage and, after consulting Chinese
    sages, made a great sacrifice to Heaven from a mountain top.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Kubilai marched through Su chuan, crossed difficult mountains, and crossed
    the Kin sha river on rafts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: At Tali, Kubilai unfurled silk banners stating that killing man or woman was
    forbidden on penalty of death; Tali opened its gates, and the conquest cost five
    lives.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Kubilai returned to Mongolia and left Uriang Kadai to master the southern
    regions; Uriang Kadai subjected the Tupo or Tibetans, many of whom entered his
    army.
  category: sequence
  evidence_refs:
  - ev:10
