canonical_text:
  quote: ''
  summary: The passage recounts Jinghis Khan's decision in 1223 to return from the
    Indus region toward Tangut and China, introduces two accounts marked by the narrator
    as myth-stamped or second-hand, describes a one-horned speaking creature interpreted
    as Heaven's warning against bloodshed, relates a captive cadi's dangerous exchange
    about the Khan's bloodshed, and then reports executions of captives and continued
    campaigns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In spring 1223, after wintering near the Indus, Jinghis resolved to march
    up the Indus and return through Tibet toward Tangut and China.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator says two accounts about Jinghis's possible reaction to slaughter
    are of interest but bear a myth stamp and are other men's opinions rather than
    Jinghis's own expressed thoughts or actions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the Iron Gate of North India, guards saw a creature with deer-like body,
    horse-like head, one horn, green hair, and speech; it told them their master should
    return to his own land.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Jinghis was troubled by the creature's message and consulted Ye liu chu t'ai,
    who identified the creature as Kotwan and interpreted it as a sign that Heaven
    warned against further needless bloodshed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Gurjistan cadi says he was at Herat on a tower, was seized by Mongols, brought
    to Tului, answered Tului's questions, received favor, and was sent to Jinghis.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Jinghis asked the cadi whether the blood he had shed would be remembered against
    him; he held a dart while questioning him, became enraged at the answer, dropped
    the dart, and later said he had plundered and slain without right knowledge.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: Before starting home, Jinghis commanded the killing of superfluous prisoners;
    artisans needed for skill in Mongolia were left alive, and the other captives
    were slain after hulling a large store of rice.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: The Mongols took the road toward Tibet, turned back from the difficult region,
    went to Peshawur, and Jinghis ordered the killing of those who had returned to
    Balkh.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: After Shah Mohammed's death, Chepe^ Nbyon and Subotsi plundered and ruined
    regions including Eastern Irak and lands near the Caspian, and later received
    reinforcements with a command to conquer the Polovtsi.
  category: action
  evidence_refs:
  - ev:9
