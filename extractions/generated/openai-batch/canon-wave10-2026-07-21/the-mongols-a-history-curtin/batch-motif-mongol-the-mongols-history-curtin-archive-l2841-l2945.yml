canonical_text:
  quote: ''
  summary: Baibuga, alarmed by Temudjin's rise, seeks allies against him. Ala Kush
    instead informs Temudjin. Temudjin prepares and wins a major battle against Baibuga's
    coalition, captures people connected with Baibuga, incorporates a learned seal
    keeper, and pursues remaining enemies. In a later episode, Dair Usun gives his
    daughter Kulan to Temudjin; Naya escorts them for safety, is accused, and is defended
    by Kulan and by his own declaration of loyalty.
  language: English
  quote_policy: summarized
