canonical_text:
  quote: ''
  summary: The passage recounts the rise and contested legitimacy of the Fatimid caliphate,
    secret missionary activity against the Abbasids, the seizure of Baghdad's symbols
    of authority by a Fatimid partisan, and the early life of Hassan Ben Sabah, including
    his education at Nishapur, a pact with Omar Khayyam and Nizam ul Mulk, and his
    later appeal to Nizam for favor.
