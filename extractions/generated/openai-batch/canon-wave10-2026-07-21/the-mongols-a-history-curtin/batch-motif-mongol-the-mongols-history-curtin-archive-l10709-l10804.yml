  summary: The passage narrates Hulagu's pressure on Rokn ud din to surrender, the
    siege and surrender of Meimundiz, the forced surrender and destruction of further
    Ismailian castles, the fall and burning of Alamut, and the destruction of manuscripts
    concerning Ismailian teaching.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rokn ud din replied in fear that he would send his son and three hundred warriors,
    but instead sent a seven-year-old half brother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hulagu recognized the substitution, treated the boy kindly, sent him back,
    and demanded Rokn ud din's second brother, Shahinshah.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hulagu sent Shahinshah back with a message ordering Rokn ud din to destroy
    Meimundiz and come quickly.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hulagu rejected Rokn ud din's excuses and ordered troops to enter Rudbar simultaneously
    from several routes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The three hundred men sent by Rokn ud din were secretly killed near Kazvin
    by Hulagu's order.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Meimundiz, Hulagu gave Rokn ud din five days to surrender, promising no
    harm if he yielded within that time and threatening assault afterward.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Mongols cut trees into beams, carried them to neighboring summits, and
    made catapults; Hulagu placed his tent on the highest position.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Rokn ud din sought a written surrender, but a tumult in the fortress stopped
    his brother from leaving and threatened anyone who supported surrender.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The catapults were mounted, an attack began from all points, and favorable
    weather allowed siege work in mountains usually made impassable by storms and
    snow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Rokn ud din decided to abandon the fortress, sent chief men and his son to
    the Mongol camp, and later prostrated himself before Hulagu with his minister,
    an astronomer, and two physicians.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Mongols entered Meimundiz, and Rokn ud din, though treated kindly, was
    watched and forced to order Ismailian commandants to surrender their fortresses.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: More than forty strong castles surrendered and were destroyed after their
    garrisons withdrew; Alamut and Lemsher remained as the last strongholds.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: At Alamut, the garrison received three days to remove personal belongings;
    on the fourth day Mongols and Persians entered, seized what remained, and set
    the buildings on fire.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Ataul Melik Juveini obtained Hulagu's permission and destroyed manuscripts
    related to Ismailian opinions and teaching in the library of Alamut.
  category: action
  evidence_refs:
  - ev:9
