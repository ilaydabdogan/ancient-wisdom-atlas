  summary: 'The passage gives background on Kin, Sung, Kitan, and Mongol relations,
    then narrates a diplomatic confrontation: a Kin envoy demands that Jinghis Khan
    receive the new emperor’s announcement kneeling; Jinghis refuses, invokes Heaven’s
    favor before his leaders, sends an ultimatum to the Golden Khan, and both sides
    prepare for war.'
