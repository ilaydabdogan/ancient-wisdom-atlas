canonical_text:
  quote: ''
  summary: The passage describes Hulagu's capture of Bagdad, the disclosure and seizure
    of hidden treasures, the counting and partial removal of the Kalif's harem, the
    sack and burning of parts of the city, the survival of some Christians under protection,
    the execution of the Kalif and Abbasid family members, the appointment of new
    officials, and a story explaining Ben Amran's rise through a vision and betrayal.
    It closes with accusations against Ibn Alkamiya and a religious lament spoken
    after the Kalif's death.
  language: English
  quote_policy: summarized
