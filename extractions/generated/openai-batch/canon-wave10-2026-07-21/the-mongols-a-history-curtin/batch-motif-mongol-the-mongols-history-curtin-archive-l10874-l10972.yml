canonical_text:
  quote: ''
  summary: Hulagu, after destroying the Assassins, sends an ultimatum to the Abbasid
    Kalif Mostassim at Bagdad. Hulagu demands submission and threatens Heaven's anger.
    Mostassim replies defiantly, invokes his religious authority, and warns Hulagu
    against attacking the Abbasid house. Hulagu declares that Heaven has given earthly
    empire to Jinghis Khan's descendants. Bagdad's officials debate gifts, defense,
    and military preparations, but preparations are delayed while Mongol spies observe
    the situation.
  language: English
  quote_policy: summarized
