  quote: ''
  summary: The passage summarizes advanced degrees of Assassin teaching, including
    an ineffable first principle, a disciple’s ascent toward the one who precedes
    him, the ninth-degree removal of a final veil, and the distinction between public
    religion and philosophical knowledge. It then recounts the Assassin presence in
    Syria, their links with rulers and agents, and several assassinations or attempted
    assassinations involving Jenah-ed-devlet, Risvan, Abu Tahir, Abul Fettah, Khalaf,
    Tancred, Abu Harb, and Ahmed.
  language: English
  quote_policy: summarized
