canonical_text:
  quote: ''
  summary: The passage recounts Ogotai's reception of Persian vassal princes, administrative
    appointments in Khorassan and Persia, and the rise and contested authority of
    Kurguz. It describes Kurguz's literacy-based advancement, the imperial ordinance
    authorizing his fiscal work, opposition from rivals, false accusations, a violent
    encounter with an investigative commission, and the sending of a blood-stained
    garment to Ogotai as evidence of injury.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kara Kurum receives princes of Iran; Ogotai is pleased, feasts them, shows
    favor, and confirms each in his own region.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ogotai compares Chin Timur's methods with Chormagun's, and Chin Timur is made
    governor with Kelilat associated with him, free of Chormagun and other commanders.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chin Timur appoints Sherif ud din of Kwaresm as sealkeeper and Behai ud din
    Juveini as minister of Finance; commanders from other branches of Jinghis Khan's
    family have agents in the finance ministry.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Chin Timur dies in 1235, Nussal succeeds him and then gives way to Kurguz,
    who is described as having organized Khorassan well and repressed fiscal extortioners.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kurguz is identified as an Uigur and a Buddhist who rose mainly through merit
    after mastering Uigur letters and penmanship.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kurguz reads Jinghis Khan's letter to Juchi when no secretaries are present
    and is said to be the only man in the hunting party able to read it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Chinkai persuades Ogotai to issue an ordinance sending Kurguz to collect taxes
    and make a census in Mazanderan and Khorassan, with instructions that no man trouble
    him during the work.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When Kelilat opposes him, Kurguz shows the patent and states that it orders
    no man to trouble him in his labor.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kurguz reorganizes Mazanderan and Khorassan and suppresses extortioners and
    tyrants.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sherif ud din and Kelilat urge Ongu to seek his father's office; Ongu sends
    a nephew to Ogotai with false accusations against Kurguz, and Ogotai sends Argun
    with two others to investigate.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Tenakit, Argun's commission orders Kurguz to return to Tus; after he refuses,
    violence occurs and Kurguz loses one tooth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Before returning, Kurguz sends a trusted friend by night to Ogotai carrying
    one of Kurguz's blood-stained garments.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The commission and allied commanders expel Kurguz's secretaries and assistants
    from his residence; later a messenger brings an order requiring civil and military
    chiefs to state their cases before Ogotai, who has been angered by the bloody
    garment.
  category: sequence
  evidence_refs:
  - ev:9
