canonical_text:
  quote: ''
  summary: The passage describes Mangu as generous but stern, enforcing strict military
    discipline and punishing plunder severely. It recounts a court anecdote in which
    a shaman mispredicts the survival of Mangu's infant son, accuses an executed nurse
    after the child dies, and triggers retaliatory killings that Mangu then punishes.
    After Mangu's unexpected death, his brothers are in distant regions; Kubilai,
    identified as successor according to the Mongol system, continues his campaign
    toward Wu chang fu. The passage then describes the Sung court's alarm, the removal
    of a deceiving minister, and the appointment of Kia se tao, who is portrayed as
    unfit, cunning, and secretly negotiating with Kubilai.
  language: English
  quote_policy: summarized
