  quote: ''
  summary: The passage recounts Kubilai's handling of Arik Buga and his officers after
    civil conflict, the admission that Arik Buga had been urged to assume the Grand
    Khanate, the sentencing of several officers, the sparing and later death of Arik
    Buga and Assutai, the continuing rivalry with Kaidu over Mongol headship, and
    Kubilai's early dealings with Sung China, including an imprisoned envoy and Kia
    se tao's concealment of a vassal treaty.
