candidate_motifs:
- id: motif:1
  label: heavenly punishment of a transgressive rival
  taxonomy_refs:
  - divine_judgment
  basis: Jinghis explicitly interprets Taibtengeri’s death and vanished body as Heaven’s
    angry response to his conduct toward Jinghis’s brothers.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The heavenly explanation is presented as Jinghis’s speech, not as an independent
    narrator’s theological statement.
- id: motif:2
  label: royal elimination of a challenger to sovereign authority
  taxonomy_refs:
  - royal_legitimacy
  basis: Jinghis says Taibtengeri tried to equal him and that he extinguished him;
    the aftermath reduces Munlik’s faction and the passage later emphasizes that no
    individual challenger remains.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
  confidence: medium
  cautions: The passage is historical-legendary prose rather than a formal royal investiture
    myth; the motif label should be reviewed.
- id: motif:3
  label: corpse disappearance through upper opening
  taxonomy_refs:
  - ascent
  basis: The body is reported lifted out and vanished through the tent’s upper aperture
    or smoke hole on the third day at dawn.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage reports disappearance through an upper opening but does not
    explicitly describe a soul ascent or apotheosis.
- id: motif:4
  label: protector sought by oppressed vassal ruler
  taxonomy_refs:
  - royal_legitimacy
  basis: The Uigur Idikut kills the oppressive agent of his overlord and seeks protection
    from Jinghis, whose power is said to fill Asia with amazement and terror.
  evidence_refs:
  - ev:18
  confidence: low
  cautions: This is a political episode in the passage; its connection to a broader
    motif family is indirect.
- id: motif:5
  label: transmission of learning from one people to another
  taxonomy_refs:
  - wisdom
  basis: The Uigurs are described as devoted to learning and as the people from whom
    the Mongols received an alphabet and early instruction.
  evidence_refs:
  - ev:17
  confidence: medium
  cautions: The passage frames this as historical-cultural transmission, not as a
    mythic gift of wisdom.
