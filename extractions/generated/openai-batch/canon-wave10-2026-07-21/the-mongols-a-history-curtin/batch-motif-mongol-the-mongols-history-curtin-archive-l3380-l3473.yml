canonical_text:
  quote: ''
  summary: Jinghis permits Temugu to deal with Taibtengeri. Temugu arranges for strong
    wrestlers to attack the shaman after a staged challenge; Taibtengeri is killed
    outside the yurta. Jinghis manages the reaction of Munlik and his remaining sons,
    places his tent over the corpse, and later explains the corpse’s disappearance
    through the smoke hole as Heaven’s anger against Taibtengeri. The passage then
    moves to Jinghis’s campaigns, regional dominance, and the Uigur Idikut seeking
    his protection.
  language: English
  quote_policy: summarized
