canonical_text:
  quote: ''
  summary: Jinghis rewards followers and relatives, while Munlik's sons, especially
    the shaman Kokochu/Taibtengeri, gain recognition. Taibtengeri and his brothers
    beat Kassar and later invoke a sacred command from High Heaven warning Jinghis
    that Kassar threatens his rule. Jinghis moves against Kassar, but Hoelun intervenes
    by invoking shared nursing and kinship. Jinghis later reduces Kassar's followers.
    Taibtengeri's faction then attracts people, humiliates Sokor and Temugu, and Bortai
    warns Jinghis that such treatment of his brothers endangers his dominion and children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jinghis directs Daigai, his shepherd, to collect homeless people and command
    them after rewards and offices are distributed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Munlik, Jinghis Khan's step-father, brings seven sons to the assembly; the
    fourth, Kokochu, also called Taibtengeri, is identified as a shaman of boundless
    ambition.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The seven brothers attack and beat Juchi Kassar; Kassar complains to Jinghis,
    who rebukes him for letting them beat him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Taibtengeri tells Jinghis that a spirit has given him a sacred command from
    High Heaven: Jinghis will rule first, then Kassar, and Jinghis''s rule will be
    short-lived unless Kassar is set aside.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Jinghis goes to Kassar by night, ties Kassar's sleeves, removes his cap and
    girdle, and questions him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hoelun travels by night in a camel-drawn kibitka, arrives at sunrise, unties
    Kassar, restores his cap and girdle, bares her bosom, and addresses Jinghis and
    Kassar as sons who drank from her breasts.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Hoelun asks why Temudjin is destroying his own kindred flesh in Kassar and
    praises Kassar's strength and skill with arrows in suppressing rebellions.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Jinghis says he acted from fright and is ashamed, but later secretly takes
    away most of Kassar's people, leaving fourteen hundred yurtas instead of the four
    thousand first given to him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hoelun grieves after learning of Jinghis's action and dies shortly afterward;
    Chebke is then placed with Kassar to guard him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Many men gather to Taibtengeri, including people belonging to Temugu; when
    Temugu sends Sokor to lead them back, Taibtengeri beats Sokor, puts a saddle on
    his back, and sends him to his mother.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When Temugu goes to Taibtengeri, the seven brothers surround him, threaten
    him, and force him to kneel and beg pardon.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Temugu reports the treatment to Jinghis while weeping; Bortai then tearfully
    warns that if Jinghis's brothers are ruined during his life, the people will not
    obey his helpless children after his death.
  category: speech
  evidence_refs:
  - ev:8
