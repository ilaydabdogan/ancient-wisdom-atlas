- id: obs:1
  text: Kaidu is presented as claiming Mongol sovereignty through descent from Ogotai,
    whose claim rested on designation by Jinghis and confirmation at the first electoral
    Kurultai.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Mangu's election rejected and broke the pact that
    had fixed the khanship among Ogotai's descendants, bringing long struggle and
