  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: After ending the Sung dynasty, Kubilai demanded Japanese acknowledgment of
    his suzerainty; the Japanese monarch gave one envoy no audience, and later envoys
    were killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kubilai ordered a large expedition against Japan despite counsellors' warnings,
    with troops sailing from China and a Korean contingent joining them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Japan-bound fleet was struck by a tempest near the Japanese coast; ships
    were wrecked, many men were captured or killed, and only a remnant returned to
    China.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cochin China first rendered homage and tribute, but Kubilai installed a council
