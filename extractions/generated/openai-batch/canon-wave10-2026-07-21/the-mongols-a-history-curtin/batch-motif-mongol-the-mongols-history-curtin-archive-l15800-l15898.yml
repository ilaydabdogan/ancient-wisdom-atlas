  summary: The passage describes Kaidu's claim to Mongol sovereignty through descent
    from Ogotai and the broken succession pact caused by Mangu's election; Kubilai's
    post-conquest campaigns toward Japan, Cochin China, and Burma; the loss of the
    Japan expedition in a tempest; local resistance to Mongol officials; and Mongol
    battles against Burmese elephant forces followed by tributary submission.
  language: English
  quote_policy: summarized
