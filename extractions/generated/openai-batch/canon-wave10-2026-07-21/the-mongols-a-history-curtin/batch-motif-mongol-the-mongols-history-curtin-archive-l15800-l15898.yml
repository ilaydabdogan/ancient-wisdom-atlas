    capital before later returning to Canton.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king of Mien tien advanced against the Mongols with horsemen, infantry,
    and a first line of elephants carrying towers with archers.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mongol horses panicked at the elephants, after which Nassir ud din ordered
    dismounted archers to attack the elephants from the forest-side position.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Wounded elephants disrupted their own ranks, the Mongols remounted and routed
