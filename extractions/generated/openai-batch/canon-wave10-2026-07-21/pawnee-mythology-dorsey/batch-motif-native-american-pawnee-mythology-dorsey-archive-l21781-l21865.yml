canonical_text:
  quote: ''
  summary: Coyote-Man is brought into a lodge to treat a wounded young man, sends
    the people away, kills and cooks the young man, and is exposed by a small Snake.
    He then asks Buzzards to carry him into the sky; they eventually drop him into
    a hollow log. After several days, he tricks women into cutting down the log by
    making raccoon tails appear through its holes, then emerges and claims the log
    was his house.
  language: English
  quote_policy: summarized
