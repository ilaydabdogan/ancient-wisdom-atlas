canonical_text:
  quote: ''
  summary: The passage ends one tale by describing the consecration of Deer and Buffalo
    to Tirawa. It then gives a tale in which Buffalo, during a human famine, choose
    the chief's daughter and bundle keeper to lead herds toward the people. She gives
    birth to a calf, who is taught by the Wind to identify its mother and kin. The
    calf's song reveals the mother's status, causing her to give up the sacred bundle,
    and the Buffalo chief explains this as the origin of illegitimate children among
    the people. A new tale begins with Hungry Coyote following buffalo tracks and
    meeting a calf he first intends to eat.
