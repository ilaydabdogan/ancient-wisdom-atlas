canonical_text:
  quote: ''
  summary: A young gambler travels westward under the guidance of North Wind. He encounters
    dwarfs, an eagle-feathered peak, the horizon, the buffalo who controls the big
    water, and the western lodge of the four gods, where he learns ceremonies and
    receives food and seeds. He returns eastward with buffalo power, offerings, and
    magic meat, feeds his people, and enables them to obtain plentiful buffalo and
    cultivated seeds.
  language: English
  quote_policy: summarized
