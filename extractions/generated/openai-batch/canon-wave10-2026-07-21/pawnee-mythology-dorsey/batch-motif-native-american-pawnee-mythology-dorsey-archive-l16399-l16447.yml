canonical_text:
  quote: ''
  summary: A boy pursues a Magpie through woods, lakes, ponds, rushes, and thick timber
    for four days and nights. In a dream, a black-painted man with feathers says the
    bird is the errand bird of an island medicine-lodge and identifies himself as
    that bird, instructing the boy to return to his people and come back after several
    years. The boy follows the Magpie out of the woods and returns home. The passage
    then describes a feared Skidi medicine-man or wizard who uses grave-dug human
    body parts in killing, and who invites the boy to his tipi, gives him a pipe,
    and serves him mush.
  language: English
  quote_policy: summarized
