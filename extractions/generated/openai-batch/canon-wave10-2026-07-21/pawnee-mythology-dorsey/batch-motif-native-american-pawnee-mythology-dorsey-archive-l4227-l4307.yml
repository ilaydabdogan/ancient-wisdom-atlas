canonical_text:
  quote: ''
  summary: A warrior who had received a black lightning arrow leaves it with another
    man while hunting buffalo. A dark cloud comes from the west, lightning strikes
    around the people, and the arrow slips from his hands and returns into the clouds
    as part of Lightning. In a later dream, the being who had aided him says the gods
    took the arrow back because he broke his promise; he will still become a successful
    warrior but never a chief. The passage then begins another account, in which a
    Skidi man dreams of a robed being who instructs him to keep a four-day vigil on
    a hill and later gives directions for making and carrying a holy-bundle with a
    sun-glass-like object, pipe parts, and an animal skin for war-path use.
  language: English
  quote_policy: summarized
