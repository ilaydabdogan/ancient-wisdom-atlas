canonical_text:
  quote: ''
  summary: The passage summarizes a Pawnee bundle narrative in which a man receives
    visions and ritual instruction from a water monster, animals, celestial beings,
    and the Sun, including instructions for an effigy or bundle connected with rain
    and a child representing Tirawa. It then summarizes “The Girl Who Married a Star,”
    in which a girl becomes the wife of a star, violates a prohibition, descends toward
    earth with her son by a sinew rope, is killed by her star husband’s stone, and
    leaves a son who grows up, destroys monsters with another boy, becomes a great
    man, and is thought to return to heaven.
  language: English
  quote_policy: summarized
