canonical_text:
  quote: ''
  summary: A young boy with unexplained curative success is visited by a jealous medicine-man
    and his wife. After repeated smoking and questioning about medicine power, the
    boy denies having power or initiation. After another smoke offering he faints,
    later develops signs of pregnancy, and leaves to die in strange country. He reaches
    a lodge of little people and animals, enters despite warnings, and seeks death.
    The lodge beings deliberate about helping him; a south-side being later revealed
    as Hawk carries him to another animals' lodge, where the animals are willing to
    help.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy acts peculiarly, plays by himself, imitates a doctor, and is said
    often to cure successfully.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A powerful medicine-man from a neighboring tribe hears of the boy, becomes
    jealous, visits him, and offers tobacco from a skunk-skin pouch; they smoke together.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The medicine-man and his wife make several visits to the boy and his mother,
    bring presents, and ask the boy to relate stories of his medicine.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy says he has no power, has never been initiated into a mysterious lodge,
    and does not know the origin of any curative power he has shown.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: On a fourth night the old man again offers smoke; the boy faints, is awakened
    by the old man, and the old man and his wife go home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Afterward the boy feels peculiar in his stomach and shows increasing signs
    of pregnancy.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy sets out to die in strange country, travels south and then west, goes
    to dangerous places, and tempts wild animals to kill him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: On a hill the boy hears noises, follows them to a large new tipi, is repeatedly
    warned not to approach, but enters and states his willingness to die.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Inside the lodge are little people; on the south side is a queerly dressed
    man with white streaks of paint on his face, with lariats and downy feathers hanging
    over him.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The lodge beings decide that raccoon, muskrat, and two errand men should decide
    whether to help; they are willing, but other animals' lodges must be consulted.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The south-side being is instructed to take the boy to the next animals' lodge;
    the boy closes his eyes, the being flies with him on his back, and at the second
    lodge the carrier is revealed as Hawk.
  category: action
  evidence_refs:
  - ev:8
