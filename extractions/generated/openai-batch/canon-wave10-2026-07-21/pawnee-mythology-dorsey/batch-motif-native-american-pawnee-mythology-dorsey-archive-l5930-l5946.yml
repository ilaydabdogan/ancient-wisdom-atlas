canonical_text:
  quote: ''
  summary: A girl takes an arrow, a cactus, and a bladder, fills the bladder with
    water at a creek, and runs north. A human Skull discovers she is gone and pursues
    her. She sees the Skull, sings, and meets a Mountain-Lion, who pities her but
    says he cannot help because the Skull is powerful and suggests other animals ahead
    might help. When the Skull nearly catches her, the girl drops the cactus; it spreads
    into many cacti and blocks the Skull for a time, but the Skull later rolls over
    the cactus and gains on her again.
  language: English
  quote_policy: summarized
