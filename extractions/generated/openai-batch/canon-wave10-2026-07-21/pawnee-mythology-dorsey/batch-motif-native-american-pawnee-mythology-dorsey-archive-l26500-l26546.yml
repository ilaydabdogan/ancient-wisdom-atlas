canonical_text:
  quote: ''
  summary: The passage summarizes two Pawnee medicine narratives. In the first, a
    boy remains with Eagles, learns to fly, witnesses the Eagles punish his uncle,
    receives eagle-related medicine objects and healing instructions, returns home,
    uses eagle transformation in war, becomes a warrior and chief, and transmits his
    power. In the second, a Dog helps a boy marry a girl, gives him songs, medicines,
    ceremonial objects, a Dog dance, and a star-marked pony identified with Dog, after
    which the boy succeeds in war and heals a sick man with Dog medicine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bones are taken from a cave at night and dropped over the country; the boy
    is taught to fly but is not yet allowed to return home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy brings young animals to the old Eagles; when he brings deer, they
    judge him strong enough to return to his people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two Eagles circle the boy's uncle, carry him into the sky, drop him into the
    Eagles' den, and the old Eagles spit on him for several days while his bones are
    scattered over the earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the uncle's death, the frightened people move their village, and the
    site receives a name referring to the Eagles carrying off a man.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old Eagle offers the boy an eagle skin to keep his spirit, gives him a
    claw, paint, a wing-bone whistle, and instructions for an eagle-wing fan and fawn
    rattle used in doctoring.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ten Eagles fly with the boy to his home; after circling him on a village mound,
    he becomes a boy again and returns to his mourning parents.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The boy gives his mother his bundle to place on an altar in the west.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boy becomes an eagle to overtake a war party and later to return ahead
    of it; his report is confirmed when the warriors come back.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The boy becomes a great warrior, enters a medicine-lodge, makes his eagle
    skin turn into a live eagle, becomes chief, dies old, and transmits his power.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A Dog speaks to a boy on a hill, says it pities him, teaches him a song, and
    the song brings a previously refusing girl to him for marriage.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Dog tells the boy to call him brother and gives him a buffalo robe, eagle
    fan, bone whistle, rattle, medicines, and the Dog dance.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Dog tells the boy to capture a pony marked by a star on its forehead and says
    that the pony will be Dog himself.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: In a medicine dance the boy appears with feathers and seems surrounded by
