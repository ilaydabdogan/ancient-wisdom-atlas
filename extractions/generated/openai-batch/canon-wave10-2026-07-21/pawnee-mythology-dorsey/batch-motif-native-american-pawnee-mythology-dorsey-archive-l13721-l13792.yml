canonical_text:
  quote: ''
  summary: 'The passage describes stages of the Lightning''s medicine ceremony: a
    procession carrying cottonwood trees and willows, animal-clan imitations in the
    lodge, preparation and purification rites, secret acquisition of a cedar tree
    for the medicine lodge, ritual production of lightning with a stone, hide, and
    water, and a later display of animal powers with drums, ashes, dancing, and falling
    to the ground.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two cottonwood trees were cut and assigned to two carriers; willows were cut
    and carried by other men according to their places in the lodge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The procession order placed the two errand men first, then the willow men,
    then the cottonwood-tree carriers, while the man headed the procession.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: As the procession neared the village, the man waved an eagle wing and shouted
    and grunted; each time, the men fell to their knees, which the passage explains
    as showing power in the stomach being taken from them and as revealing animal-clan
    identity through imitation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the lodge, a song about entering was sung; the group went four times around
    in a circle, entered, and circled the fireplace four times while each man imitated
    his kind of animal.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Inside the lodge, willows were arranged so that each animal group had a booth
    or lodge of its own, with four singers at the altar.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Men went out for animal skins, medicine, and paints; meat was served, and
    preparation was made for a rubbing connected with the powers of the stone and
    with several thunderings at one time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the next day, each man was instructed to go to the hills, mourn or sleep,
    eat wild sage, swim, rub wild sage on his body, and avoid going home or touching
    a woman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The owner went alone to obtain a cedar tree while followers waited at a distance;
    the method was kept secret, and the cedar was later placed on the south side of
    the lodge where the Bear family was.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the darkened lodge, a dyed and tanned buffalo hide was waved, the owner
    waved the stone before the hide, and other men squirted water from their mouths
    onto the stone; the passage says lightning was made in this way.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The leader instructed participants to put mud, downy feathers, and animal
    skins on their bodies so that they could throw up animal power from their insides
    and let the people see these powers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The owner and three men ran around the fireplace, threw ashes up to the four
    world-quarter gods, stamped, fell face downward, and the things called powers
    were seen sitting on the ground before the later singing and dancing ended in
    quiet.
  category: sequence
  evidence_refs:
  - ev:7
