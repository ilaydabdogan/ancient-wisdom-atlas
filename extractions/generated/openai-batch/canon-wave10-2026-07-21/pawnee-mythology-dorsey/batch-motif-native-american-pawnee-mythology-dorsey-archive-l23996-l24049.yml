canonical_text:
  quote: ''
  summary: 'The passage contains abstracted Pawnee narrative material: a fragment
    about Whipping Feather and North Wind; an abstract titled “The Man Who Married
    a Buffalo,” in which a human man, a buffalo cow, and their calf-child move between
    human and buffalo communities, undergo recognition tests, and the man is transformed
    into a buffalo bull; and the beginning of “How the Witch-Woman Was Killed,” in
    which a witch abducts a favored child of White Moccasins and takes him east to
    big water.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the opening fragment, a boy known as Whipping Feather has power to travel
    fast and drive buffalo; he accompanies his parents, finds food and game, marries,
    and eventually goes to North Wind.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On a buffalo hunt, a shy boy who dislikes girls has intercourse with a buffalo
    cow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The next spring the cow has a calf that repeatedly asks for its father.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The cow and calf travel east to find the father, change into human beings,
    and enter his lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man does not at first recognize the woman or acknowledge the child, but
    after her explanation he takes them into his lodge as wife and child.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The buffalo woman warns people that if her son strikes children his hands
    would be like buffalo hoofs, and that if he falls he might become buffalo.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the child brings water to his father during gambling, the father angrily
    refuses to drink; the wife leaves with the child, and the man follows, but she
    refuses to return.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The child pities his father, feeds him pemmican, and brings water from the
    ground by pawing the earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the buffalo village, the man identifies his father-in-law, mother-in-law,
    wife, and child among buffalo by tail marks, cockle-burr marks, and a wink from
    the child.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The buffalo agree to let the man remain with them and magically turn him into
    a buffalo bull.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The man, with his wife, son, and buffalo, returns to the human village so
    he can obtain eagle feathers and other presents.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The man tells his people where to find buffalo, to kill them, and to make
    them holy; he later brings additional bunches of buffalo to them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The man himself is later found to have been killed, because when his hide
    is removed it is discovered to be covered with feathers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: A Witch-Woman lives east of the village and sometimes doctors people, while
