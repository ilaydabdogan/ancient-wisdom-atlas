canonical_text:
  quote: ''
  summary: 'The passage contains abstracts of Pawnee narratives: a boy exposes a woman’s
    moon identity, kills a spider form, and sends it to the heavens as Moon; an origin
    of the basket dice game in which gods animate mud images and humans learn dances,
    seeds, and game symbolism from Moon and star beings; an origin of a new band founded
    by three young men with ceremonial knowledge; and the origin of the Crow Lance
    society through raccoon sacrifice, death and restoration, and instruction by Crows
    in a cave.'
  language: English
  quote_policy: summarized
