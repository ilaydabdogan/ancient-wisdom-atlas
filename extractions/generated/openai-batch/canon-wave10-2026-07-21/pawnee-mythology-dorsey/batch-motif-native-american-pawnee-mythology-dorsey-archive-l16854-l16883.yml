canonical_text:
  quote: ''
  summary: After a return from meat-drying, the people are attacked and one man is
    brought home wounded. Village medicine-men attend him without success. A poor
    boy, under the influence of a Bear spirit, performs a healing act involving a
    sun ray, colored paints from his mouth, and dust blown into the wound. The patient
    improves, recalls the boy, promises ponies and robes, and is cured. The boy sings
    about the Bear, the people infer that he had been taken into the Bear's den, and
    gifts are delivered to his lodge. The passage ends as the boy asks that the lodge
    be swept and arranged.
  language: English
  quote_policy: summarized
