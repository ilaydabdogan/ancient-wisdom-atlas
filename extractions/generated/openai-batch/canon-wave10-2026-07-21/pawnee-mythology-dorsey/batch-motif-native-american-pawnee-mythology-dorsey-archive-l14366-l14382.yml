canonical_text:
  quote: ''
  summary: Animal-Boy is guided by animals back to his people, enters Stone-Man's
    lodge with the men, is selected by Stone-Man because of his woodpecker cap, and
    arranges for errand men. Stone-Man has a message sent to the chief about buffalo
    near the camp. At night Stone-Man's daughter urges Animal-Boy to kill her father,
    saying he has killed many young men; Animal-Boy says the animals may help him.
  language: English
