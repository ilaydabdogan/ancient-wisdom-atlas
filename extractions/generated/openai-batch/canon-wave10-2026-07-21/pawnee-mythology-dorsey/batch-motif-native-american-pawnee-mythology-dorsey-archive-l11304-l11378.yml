canonical_text:
  quote: ''
  summary: 'The passage closes a tale in which a young man declares the Witch-Woman
    ended, associates her with a hill-side spring and possible animal forms, reclaims
    his robe, identifies himself with the north wind, transforms into a speckled snowbird,
    and flies north. It then begins another tale: a wandering young man is taken in
    at a village, invited by Eyes-Wide-Open the Coyote to a cannibal witch-woman,
    loses a deadly diving contest, and is killed. His identical brother comes seeking
    him, finds his head among skulls, agrees to a reciprocal diving wager with the
    witch-woman, and later receives the attention of a Beaver family that decides
    to help him.'
  language: English
  quote_policy: summarized
