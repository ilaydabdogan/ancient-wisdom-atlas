canonical_text:
  quote: ''
  summary: A young man who had not cared for women lies with a young girl, sends her
    away, and bathes at a spring gushing from a hillside. In a dream, Spider-Woman
    appears with a spring of water coming from between her legs and tells him that,
    because he washed after sexual connection, he will be like a woman. The young
    man becomes sleepless and sick; medicine-men attend him, and one says he is turning
    into a woman because of Spider-Woman. A note explains a Pawnee belief that springs
    originate from spider-women and presents the story as a warning not to bathe in
    springs after intercourse while unclean.
  language: English
  quote_policy: summarized
