  quote: '"the rattle was made from a magic gourd"'
  summary: A husband who hunts game with great speed withholds food from his wife
    and abuses her. When she flees to a village, the villagers feed and hide her.
    The husband searches villages with a magic gourd rattle that makes the woman appear
    inside it when it is pointed toward her; he finds her and takes her home. A note
    compares the tale’s rattle with rattles formerly carried by a Pawnee society.
