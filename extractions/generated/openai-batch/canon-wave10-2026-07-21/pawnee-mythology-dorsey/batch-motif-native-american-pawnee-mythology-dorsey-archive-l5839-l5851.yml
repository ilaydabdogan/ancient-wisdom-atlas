canonical_text:
  quote: ''
  summary: A young man repeatedly hears clam shells singing at a creek. The clam shells
    say they are ready to receive some of his people, teach them their power, and
    give curing mud so some may become medicine-men. The young man brings his friend
    to the water bank for the clam shells to talk to him. The friend later returns
    saying he now has magic power and can doctor the sick. The young man then says
    it is time to hunt buffalo.
