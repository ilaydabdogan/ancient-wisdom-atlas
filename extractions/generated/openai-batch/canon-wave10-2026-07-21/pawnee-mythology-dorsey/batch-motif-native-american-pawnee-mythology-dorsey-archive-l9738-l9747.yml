canonical_text:
  quote: ''
  summary: A note identifies the passage as a Kitkehahki bundle story told by Thief.
    It says the story teaches that heavenly gods have powers superior to earth gods
    and that children should respect bundles from the stars or heavenly gods. The
    summary describes an unnamed person with a tipi of living fire who tortures Hawk,
    is overcome, and has the fire carried back to heaven by Hawk. Hawk marries Mother-Corn,
    and the pair represent the Morning and Evening Stars. The Kitkehahki star bundle
    bears an owl representing priestly power. Mother-Corn gives Hawk all her power
    except her ability to make things grow again.
  language: English
