canonical_text:
  quote: ''
  summary: A boy meets a man in the timber who gives him clothing and hunting gear,
    tells him how to provide meat and direct women to food plants, and reveals himself
    as the boy’s father, Ready-to-Give, the Wind from the north and one of the gods.
    Ready-to-Give says he has withheld buffalo and game because the people made the
    boy and his mother outcasts. The boy returns to the grass-lodge, reports this
    to his mother, and later hunts buffalo with his father’s help. Ready-to-Give enters
    the lodge and tells the women that the people are starving because of their treatment
    of the outcasts.
  language: English
  quote_policy: summarized
