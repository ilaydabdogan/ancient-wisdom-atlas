  text: The old witch enters a sweat-lodge and pours water onto hot stones with a
    buffalo-horn spoon, producing steam.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the heat becomes too great, Without-Wings turns into a Badger and digs
    into the ground so that only his mouth and head remain above ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Without-Wings tells the old woman to pour more water on the stones; she had
    expected the heat to scald him, but she cannot endure it herself and leaves the
    lodge.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Buffalo bulls around the sweat-lodge run away after seeing Without-Wings come
    out uninjured.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The old witch sends Without-Wings to gather wood at a tree with an Eagle's
    nest in a place where lightning has killed others.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Without-Wings speaks to the Eagles and tells them who he is; the lightning
    stops and the storm passes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The old Buffalo cow challenges Without-Wings to a race to the four world quarters,
    with the stated result that either people will live upon buffalo or buffalo will
    live upon people.
  category: speech
  evidence_refs:
  - ev:3
