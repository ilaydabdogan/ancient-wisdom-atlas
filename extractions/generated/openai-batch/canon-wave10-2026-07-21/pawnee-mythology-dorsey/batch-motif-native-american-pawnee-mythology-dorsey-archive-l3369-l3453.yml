  text: For the race, Without-Wings turns into a Magpie, while the old woman travels
    by pointing a cane as far as she can see and arriving there in a single step.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Without-Wings commands Badgers to dig holes so the old woman will fall into
