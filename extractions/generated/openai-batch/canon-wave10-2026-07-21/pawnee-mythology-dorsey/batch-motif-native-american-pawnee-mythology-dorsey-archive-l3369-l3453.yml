canonical_text:
  quote: ''
  summary: Without-Wings survives ordeals imposed by an old witch or Buffalo cow,
    including a heated sweat-lodge, a lightning-struck Eagle-tree, and a race around
    the world whose stakes determine whether people will live on buffalo or buffalo
    on people. He releases and sorts buffalo from a cave, drinks water belonging to
    the Buffalo chief, kills the skeletal chief after a mocking-bird reveals a vulnerable
    place, and returns to his people after the buffalo divide into herds.
  language: English
  quote_policy: summarized
