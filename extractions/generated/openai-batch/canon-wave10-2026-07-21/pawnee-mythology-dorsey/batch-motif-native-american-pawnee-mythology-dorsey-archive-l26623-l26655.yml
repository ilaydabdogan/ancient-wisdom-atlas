canonical_text:
  quote: ''
  summary: A poor young man becomes successful in war and marries the girl who rejected
    him. After she dies, he mourns until a mysterious unseen boy leads him toward
    spirit land. An old woman instructs him to cross a black stream on a log and gives
    him clay balls. He enters a spirit village, strikes his wife four times with the
    balls, and persuades her to return. The old woman teaches him the elk dance and
    gives him a whistle, red beans for communion with spirits, and more balls that
    become buffalo. The guide reveals himself as Wind. After the couple returns, the
    man is unfaithful; his wife dies again, and Wind says he cannot regain her. The
    passage then begins a second abstract in which a recently married man returns
    from war-path, learns his wife is dead, mourns at her grave, and is addressed
    by a boy.
  language: English
  quote_policy: summarized
