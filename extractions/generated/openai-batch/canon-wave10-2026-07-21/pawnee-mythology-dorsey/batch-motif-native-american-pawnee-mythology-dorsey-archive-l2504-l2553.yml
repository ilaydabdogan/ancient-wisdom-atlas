canonical_text:
  quote: ''
  summary: Three young men agree to remain apart from their former people and establish
    a new group. The chief's son promises to carry on ceremonies, and the medicine-man
    promises to teach mysteries, songs, herbs, and roots. They weep, smoke together
    under bright stars, and speak of heavenly gods watching them. The next day they
    plan to retrieve seeds from their old village. Corn, beans, and squash seeds are
    gathered, planted, and later a sacred bundle is made with a white ear of corn
    and other gathered objects. The medicine-man later starts a dance, teaches followers,
    and the people increase.
  language: English
  quote_policy: summarized
