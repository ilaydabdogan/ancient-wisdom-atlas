canonical_text:
  quote: ''
  summary: 'The passage concludes a story in which Coming-Sun uses a downy feather
    and aid from a mysterious being to call buffalo, loses that power after a woman
    enters his tipi and another man takes the feather, and later dies. It then begins
    a story of Buffalo Gaming Sticks: Tirawa gives people the ring-and-sticks game
    and songs; a young man meets a woman at the gaming field, she bears a buffalo
    calf, and a snow bird later leads hunters, especially the young man, to a buffalo
    herd where the woman and calf are present and buffalo bulls threaten the young
    man''s life.'
  language: English
  quote_policy: summarized
