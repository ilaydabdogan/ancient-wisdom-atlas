canonical_text:
  quote: ''
  summary: The passage first closes a tale in which buffalo are killed, one is consecrated
    to the gods, and buffalo learn through dreams when people will surround them.
    It then begins a tale in which Buffalo and Deer both approach a human buffalo
    hunt seeking slaughter. The Buffalo leader insults Deer; Deer answers in song,
    contrasting buffalo flesh left for coyotes with a deer being made holy. After
    the exchange, Deer becomes angry and runs among the people while men pursue it.
    A note says the story explains a Pawnee custom of trying to kill a deer at the
    beginning of a buffalo hunt before reaching buffalo.
  language: English
