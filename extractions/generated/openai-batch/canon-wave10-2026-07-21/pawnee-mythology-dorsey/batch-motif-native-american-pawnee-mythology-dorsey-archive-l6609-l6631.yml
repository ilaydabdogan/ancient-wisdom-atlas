canonical_text:
  quote: "“Each year this buffalo was to drop one hair.”"
  summary: Tirawa placed wonderful or large human beings on earth before the speaker's
    people lived there. These beings lived at the Swimming Mound in Kansas, where
    their bones were later found. Rain and water from the northwest made a deep flood
    that killed them. Tirawa then placed an old buffalo bull in the northwest to hold
    the water back. The buffalo was to lose one hair each year; when all its hairs
    were gone, people would no longer live on earth. The passage adds that Tirawa
    named four ways to kill people but promised not to send the flood again; a note
    attributes the tale to Young-Bull and says it concerns Pawnee belief about the
    end of the world.
  language: English
  quote_policy: quoted
