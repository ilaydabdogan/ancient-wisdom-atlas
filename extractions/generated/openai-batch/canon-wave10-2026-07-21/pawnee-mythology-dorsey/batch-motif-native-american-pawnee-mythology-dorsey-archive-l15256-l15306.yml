canonical_text:
  quote: ''
  summary: A boy who has been presumed dead returns secretly, tells his mother that
    his father shot him with an arrow, and explains that swans carried him to the
    animals' lodge at Swimming-Mound, where animals revived him. With his mother's
    approval, he kills his father by sending a sunfish bone to his heart and later
    becomes a great medicine-man.
  language: English
