canonical_text:
  quote: ''
  summary: 'The passage summarizes a ritual removal and use of a medicine root, followed
    by the origin of the Geese medicine: a young man undergoes an ordeal to receive
    animal-derived power, uses a sacred flute in courtship, raises geese with his
    wife, and has a son who founds the Geese medicine-lodge.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A root found after a vision is uncovered, smoked to, addressed as father and
    mother, and understood to consent to removal when water oozes from it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men sit west of the root, place their hands on it, and thank it; women stand
    with hoes in the four directions while men smoke to Mother Earth before digging.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The four directional women are assigned explicit meanings: west as birth,
    east as young life-power, north as chief or warrior, and south as the land of
    the dead.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When exposed, the root is seen to have the form of a human being; after removal,
    pipe offerings are made to celestial and earthly recipients and to parts of the
    root's body.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The root is to be placed in a medicine bundle, and its spirit is said to remain
    with the people who remove it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the man's tipi the root is sung over, cut up with supplication, and portions
    are distributed to medicine-men, while the central part is retained by the man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At night the man sees a woman clothed in black with downy feathers, holding
    a clam shell and powdered root; she teaches him how to use the root in doctoring
    and is identified as the root herself.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A young man seeking success in love learns from an ugly young man that the
    latter's power came from antelope.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: At a river bank the young man is tied by a lariat around his waist and suspended
    from the bank with the other end tied to a tree; he remains there four days and
    sees fire and water each night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: On the fourth night the young man faints and finds himself in an animals'
    lodge where he is told that elk is in charge and instructed in how to obtain power.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the ordeal, the ugly young man gives him a red-painted flute made of
    root with elk-hide strings from a sacred bundle and instructs him in its use with
    courtship warnings.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: After four nights of using the flute, the girl he loves follows him to his
    lodge, and the two later travel east to a swamp where she finds two goslings and
    raises them as pets.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: When the couple return to the village, people see geese at the lodge entrance
    and are astonished because the geese act like human beings.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: 'One goose dies, and the other flies away after saying the couple will have
    two children: one will die young and the other will live to be great.'
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The predicted sons are born; one dies as a young man, while the other becomes
    a great warrior and medicine-man and founds the Geese medicine-lodge.
  category: sequence
  evidence_refs:
  - ev:9
