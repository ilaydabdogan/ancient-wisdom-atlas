canonical_text:
  quote: ''
  summary: A young man feeds Snakes who say they are held by a witch living among
    the people. He summons buffalo from a cave or hill so the people can hunt. The
    Witch-Woman challenges him, identifies him as the Morning-Star, and displays a
    robe whose celestial image changes through moon phases as he shoots arrows at
    it. The full moon becomes a spider; he kills it, shoots it into the heavens, and
    commands it to remain there as the moon. The old woman dies.
  language: English
  quote_policy: summarized
