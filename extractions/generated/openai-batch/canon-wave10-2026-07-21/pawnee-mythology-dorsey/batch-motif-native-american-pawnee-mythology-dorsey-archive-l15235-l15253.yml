canonical_text:
  quote: ''
  summary: During a buffalo surround, a medicine-man tells his son to follow him if
    he pursues a buffalo cow. The father and son become separated among the hills,
    kill and begin skinning a buffalo, and the father says he will look from a hill
    because they are in enemy country. Remembering the son's wonderful deeds in the
    medicine-lodge, the father becomes envious, shoots the boy with an arrow, confirms
    his death, throws him into a tributary of the Republican River, and returns home
    with the buffalo meat while releasing the boy's pony.
  language: English
  quote_policy: summarized
