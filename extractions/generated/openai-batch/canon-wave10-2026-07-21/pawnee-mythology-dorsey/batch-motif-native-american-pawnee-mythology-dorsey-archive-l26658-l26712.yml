canonical_text:
  quote: ''
  summary: In one abstract, a man travels to spirit land to recover his wife with
    aid from an old woman, receives balls, a rattle, a whistle, and instructions,
    later uses a rattle that releases armed warriors, loses his first wife after slighting
    her, and institutes a whistle dance and bewitching practice. In the Handsome-Boy
    abstract, a guarded youth is reproached for lacking warrior reputation, departs
    with ponies, receives dream guidance, obtains a flint knife and fire-making knowledge,
    receives prairie-dog aid, and takes an enemy scalp.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man enters a bright tipi at night, finds an old woman, and receives four
    mud balls; the tipi floor is covered with sage, fox skins, eagle feathers, and
    other items.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man crosses a log that first shakes and then becomes quiet, declares readiness
    to die, enters a spirit-land village, and uses balls to attract his wife, who
    follows him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old woman gives balls that become buffalo, gives an elk dance, a rattle,
    and a whistle, and says warriors who died on the plains make their home in the
    rattle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After returning, the wife is instructed to sleep each night in a cactus bed
    until her nerves become normal, and she remains apart from people for several
    days because of their odor.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At night the man is told that Breath or Wind has assisted him and that he
    is to obey his wife.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the war-path, the man removes the rattle handle; dust from the rattle becomes
    armed warriors who attack a village and then re-enter the rattle as dust.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After taking a second wife and speaking slightingly of his first wife, the
    man returns and finds the first wife's bones on her bed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The man mourns at the grave, receives no spirit address, institutes the whistle
    dance, and teaches bewitching by throwing red beans into the air.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Handsome-Boy is carefully guarded and well clothed by his parents; after a
    girl reproaches him for having no warrior reputation, he captures two ponies and
    sets out.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Handsome-Boy has no fire utensils and eats raw flesh while traveling.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: In dreams or at night, a man with a bear-claw necklace and scalp-fringed leggings
    directs Handsome-Boy to hills.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: From a high hill, Handsome-Boy sees people coming up from water who look like
    eagles; after putting his hand to the ground he finds a flint knife.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Handsome-Boy kills and skins a buffalo with the flint knife, sees sparks passing
    among weeds at another hill, takes sticks, and uses sticks, flint, and sand to
    make fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: At a prairie-dog town, Handsome-Boy hears singing and dancing about him killing
    an enemy, sees prairie dogs dancing, gives tobacco into a hole, and asks them
    to help him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Handsome-Boy paints himself and his pony, meets a man, and takes his scalp.
  category: action
  evidence_refs:
  - ev:6
