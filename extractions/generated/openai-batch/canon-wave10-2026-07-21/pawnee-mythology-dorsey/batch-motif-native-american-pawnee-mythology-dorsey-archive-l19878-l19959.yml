canonical_text:
  quote: ''
  summary: The supplied passage first describes a boy whose Dog songs and dog hide
    marked with a moon picture heal a sick man; he receives gifts and begins the Young-Dog
    dance among the Pawnee. It then begins the tale of Burnt-Belly, a poor boy living
    with his grandmother. He finds and feeds a brown Dog, which grows quickly, brings
    meat, appears in his dream, instructs him to go on the war-path, promises protection,
    and brings him a pony from an enemy village. Later, while associated with a chief’s
    son, Burnt-Belly joins a buffalo surround, is mocked, kills two buffalo, gives
    one to the chief’s son, and brings meat to his grandmother.
  language: English
