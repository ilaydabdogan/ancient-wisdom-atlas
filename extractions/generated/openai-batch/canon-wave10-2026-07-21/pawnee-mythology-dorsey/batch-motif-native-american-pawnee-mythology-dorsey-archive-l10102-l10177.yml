canonical_text:
  quote: ''
  summary: The passage gives the conclusion of a tale in which a boy follows a Buffalo
    woman, is taken to the Buffalo people, survives attacks, requests the Buffalo
    ceremony, exchanges tobacco and smoke, helps arrange sacrificial killing of Buffalo
    for human ritual use, becomes a Buffalo, and is later killed, leaving a holy robe
    marked with feathers. It then begins another tale about a woman-avoiding young
    man who is really a blackbird and a Buffalo girl who dislikes men, both setting
    out to meet each other between their villages.
  language: English
  quote_policy: summarized
