canonical_text:
  quote: ''
  summary: Raven instructs the girl how to deceive Long-Tongue while removing ticks
    from his head, how to command the entrance stone, and how to handle the sacred
    bundle. The girl follows the instructions, causing Long-Tongue to die temporarily
    before reviving. Long-Tongue later threatens to kill her after a journey, and
    Raven advises her to delay him by asking for a buffalo so she can make tallow.
    Raven removes objects from the sacred bundle, directs the girl to prepare and
    spread tallow, tells her of a four-day journey to people who can save her, carries
    her out through a small hole, and then guides her eastward from above while she
    runs.
  language: English
  quote_policy: summarized
