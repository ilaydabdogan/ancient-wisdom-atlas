  quote: ''
  summary: 'The passage is an abstracts section summarizing several Pawnee myth narratives:
    the origin of the Chaui; an encounter with a buffalo-transforming woman and the
    four gods in the west; the Small-Ants'' bundle, Moon instruction, buffalo, corn,
    and lodge origins; and the four gods of the north with Kingfisher and ceremony
    transmission.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tirawa creates the heavens, the earth, and a woman, and Moon suggests that
    a man be sent to earth as her mate.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first pair are instructed in kinship terms, earth-lodge construction and
    symbolism, fireplace, altar, sacred bundle, tools, corn, earthenware vessels,
    cooking, sacrifices, and dances used in calling buffalo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the western-gods abstract, a man meets a strange hairy woman whose morning
    tracks appear as animal tracks; later she turns into a buffalo and leads him to
    her lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Four men sit in the west in the buffalo woman's lodge and represent the four
    gods; the man later returns dazed, is awakened by a bluebird, and finds a buffalo
    robe on his shoulders.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man's people kill buffalo and sacrifice the heart and tongue to the four
    gods in the west as directed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Before corn and buffalo, people wander for food; a boy directed by Moon leads
    them north to a new home, where famine threatens.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The young man fasts on a hill, sees Moon's reflection in water, drinks from
    a spring as commanded, and repeatedly encounters women of different ages.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The young man enters a cave from which the spring issues; a young girl changes
    into women of various ages, represents phases of the moon, and declares herself
    to be Moon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Moon gives the young man ring and javelin games for men and a basket or dice
    game for women.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The young man sees many earth-lodges that are really ant-hills, and is told
    they will serve as models for the people's lodges.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The young man receives magical corn and meat, instructions for buffalo, and
    the Small-Ants' bundle; ceremonies are performed, buffalo come, and the first
    buffalo is treated as sacred.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:12
  text: After the people are fed they build earth-lodges; later the young man receives
    seeds, the spring dries, the cave disappears, and the people divide into bands
