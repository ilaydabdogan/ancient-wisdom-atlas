canonical_text:
  quote: ''
  summary: A group of warriors become fast on a Turtle's back and are carried under
    a large body of water, while the youngest is left to report the event. The boy
    dreams of the submerged men alive in an underwater lodge, later enters the water
    himself, sees animals led by the Turtle, learns mysteries, and returns with powers.
    The community drains the water, finds the warriors' skeletons, fails to find the
    Turtle, and the animals remove the boy's power.
  language: English
  quote_policy: summarized
