canonical_text:
  quote: ''
  summary: A boy tells the women to watch for an approaching man. The man comes over
    the hills, searches the village for cache holes, climbs a lodge, sees smoke rising
    from timber, and follows it. The women receive and feed him. He asks who they
    are and where their goods came from. They say their son kills buffalo and that
    they were made outcasts because of the girl's condition. The boy is summoned;
    the man perceives his mysterious powers, feather, and strange eyes. The boy says
    he is sorry the people left his people behind.
  language: English
  quote_policy: summarized
