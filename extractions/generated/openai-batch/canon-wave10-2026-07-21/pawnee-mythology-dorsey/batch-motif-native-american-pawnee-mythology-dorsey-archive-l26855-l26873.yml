canonical_text:
  quote: ''
  summary: Coyote visits another Coyote village under the name Dragging-the-Stone,
    is feared because he appears warrior-like, refuses high-status hospitality, camps
    with a poor couple, joins a buffalo hunt, kills an old woman's horse, receives
    buffalo, quarrels with a giant who claims it, drives the giant away, gains reputation,
    then at a feast burns people with tallow and is overtaken and killed on a sandbar.
