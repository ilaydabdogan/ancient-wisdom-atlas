canonical_text:
  quote: ''
  summary: Abstract of a Pawnee narrative in which a woman born with bear spirit power
    mourns her dead son, enters a bear den, receives medicines, paints, songs, ritual
    instructions, and healing powers from bears, returns to the village, cures a wounded
    man, establishes bear-related ritual practices, teaches the bear dance, and transmits
    bear mysteries to others.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man kills a bear while his wife is pregnant, and the girl born afterward
    is said to possess the spirit of bears.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the girl's fingernails are trimmed, she nearly dies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman later has three children; the first two die in infancy, and the
    third, a boy, dies after returning sick from a hunt.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the boy's grave is found robbed and his body exposed, the mother mourns
    by the grave for four days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman crawls under a drooping cedar tree at night and hears a bear growling
    and speaking to her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The speaking bear says that the bears have taken pity on her and asks her
    to follow him into a den described as being like a lodge.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: In the bear den, the woman meets the bear's wife and six cubs and is told
    she may have as many children as the number of cubs she can catch.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The woman catches two cubs and is told she may take them home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The bear blows colored breath on the woman's face and says this will enable
    her to restore wounded men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The bear's wife gives the woman pieces of cherry, hackberry, and bullberry
    from her mouth and says they are to be used in doctoring.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The bear and his wife give the woman paints and feathers and instruct her
    to use them in doctoring.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: The woman is instructed to make a buffalo-hide tipi painted with a yellow
    circle, black band, red band, cedar tree, and owls that guard the bears' den.
  category: object
  evidence_refs:
  - ev:4
- id: obs:13
  text: The woman is told to kill the two cubs at home and make sleeping bags from
    their hides for her children, while the cubs' spirits will return to the bears.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: At home, after seeing the woman bear in a vision, the woman kills one cub,
    tans and paints its skin, places a yellow feather on it, and hangs it where the
    sun may strike it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: The passage states that the spirit of the bear is present with the woman,
    and that whenever she is touched she grunts like a bear.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:16
  text: The woman's husband receives red paint and feathers from her before battle,
    and enemy arrows do not affect him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: A wounded man is treated by the woman and her husband through a prepared tipi,
    paints, bear song, bear-like grunts, inhaling power from the sun, smoking to the
    sun, colored breath blown on the wound, and burning cedar leaves.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: After repeated doctoring, the wounded man begins to recover.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:19
  text: The cured man sees the woman in dreams as a cinnamon bear and is made a member
    of the bear society.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:20
  text: The woman feeds the cured man cherries from her mouth, opens her bundle, displays
    the bear hide with paints and feathers, and offers tobacco mixed with pony saliva
    to different gods and to the bears.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:21
  text: The woman later gives birth to more children, makes the tipi with her husband,
    and originates the bear dance.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:22
  text: The woman teaches her son bear mysteries, teaches the bear dance to a sincere
    Chaui visitor, performs in medicine-lodges, and her son becomes one of four leaders
    of the bear ceremony.
  category: sequence
  evidence_refs:
  - ev:9
