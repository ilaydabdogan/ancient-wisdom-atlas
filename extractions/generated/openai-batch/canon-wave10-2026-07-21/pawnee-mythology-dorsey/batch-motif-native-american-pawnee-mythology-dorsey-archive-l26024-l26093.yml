candidate_motifs:
- id: motif:1
  label: Human initiation by bear beings
  taxonomy_refs:
  - initiation
  basis: The woman enters the bears' den, receives powers, medicines, objects, songs,
    and instructions, returns to human society, and uses the acquired bear medicine.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:7
  confidence: high
  cautions: The passage is an abstract; details of ritual sequence and terminology
    may be fuller in the complete narrative.
- id: motif:2
  label: Animal-spirit medicine and healing power
  taxonomy_refs: []
  basis: Bear beings give the woman colored breath, berries, paints, feathers, songs,
    and instructions that she later uses to heal a wounded man.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: No specific external taxonomy reference for animal medicine is supplied
    in the available list.
- id: motif:3
  label: Mourning encounter leading to other-than-human instruction
  taxonomy_refs:
  - death_rebirth
  - initiation
  basis: The woman's mourning after her son's death and disturbed grave leads directly
    to her encounter with the speaking bear and entrance into the den, after which
    she returns empowered.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The dead son is not revived; any death-rebirth reading applies to the
    woman's change of status rather than literal resurrection.
- id: motif:4
  label: Sacred exchange for healing and ritual membership
  taxonomy_refs:
  - sacred_exchange
  basis: The healed man gives presents, becomes a member of the bear society, receives
    cherries from the woman's mouth, and offerings are made to gods and bears.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The woman explicitly tells the healed man not to worry about recompensing
    her, so the exchange is ritual and social rather than a simple payment contract.
- id: motif:5
  label: Origin of bear dance and bear ceremony leadership
  taxonomy_refs:
  - culture_hero
  - initiation
  basis: The woman originates the bear dance after receiving bear teachings and later
    transmits bear mysteries; her son becomes one of four leaders of the bear ceremony.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage frames her as originator of a specific ceremony, not as a
    generalized culture hero beyond this bear rite.
- id: motif:6
  label: Protective war medicine
  taxonomy_refs: []
  basis: The woman gives red paint and feathers to her husband, after which enemy
    arrows do not affect him in battle.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: 'The protection later has limits: the husband is warned that arrows can
    harm his hands and eventually dies after being wounded in an attack.'
- id: motif:7
  label: Bear-associated transformation or animal identification
  taxonomy_refs:
  - shapeshifter
  basis: The bear spirit is present with the woman, she grunts like a bear when touched,
    and the healed man dreams of her as a cinnamon bear.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: medium
  cautions: The abstract does not state that she physically changes shape; the shapeshifter
    reference is limited to spirit presence, behavior, and dream appearance.
- id: motif:8
  label: Tree-marked ritual shelter and cedar in healing
  taxonomy_refs:
  - sacred_tree_axis
  basis: A cedar tree shelters the woman before the bear encounter; a cedar tree is
    painted on the ritual tipi; cedar leaves are burned during healing.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:7
  confidence: low
  cautions: The passage gives repeated cedar associations but does not explicitly
    describe the tree as a cosmic axis or world-center.
