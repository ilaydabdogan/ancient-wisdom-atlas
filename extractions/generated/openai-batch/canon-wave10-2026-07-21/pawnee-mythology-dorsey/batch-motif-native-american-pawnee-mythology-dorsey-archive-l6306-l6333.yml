canonical_text:
  quote: The fire never went out. The fire was kept up by the dead people.
  summary: A girl tells a boy to watch at night and not be afraid. In the lodge, a
    fire burns continually and is tended by dead people. Nightly drumming, children,
    and dancers enter the lodge; the boy follows the girl's instruction to answer
    the dance leader with “Nawa” after the leader says they have smoked. Across successive
    nights, the visitors become increasingly visible to him.
  language: English
