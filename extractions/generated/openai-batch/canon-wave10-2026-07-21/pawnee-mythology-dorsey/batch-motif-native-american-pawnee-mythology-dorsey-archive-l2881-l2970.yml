canonical_text:
  quote: ''
  summary: In the tale of the girl who married a Star, a woman living with her Star
    husband bears a son, digs through to see the earth below, makes a sinew rope,
    and descends with the child. The rope does not reach earth; Star finds them and
    kills the woman with a stone, while the boy survives. The boy is received by an
    old woman and her grandson. The two boys repeatedly go to forbidden dangerous
    places; lightning kills a bear and a monster, mountain-lions are killed, and the
    boys clear the country of wicked animals. Star-Boy returns to his people, identifies
    Star as his father, and later disappears, being thought to have gone back to heaven.
    The passage ends with the opening of another tale in which a man hears a woman
    crying at a deserted campsite but finds no one.
  language: English
  quote_policy: summarized
