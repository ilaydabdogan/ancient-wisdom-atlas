canonical_text:
  quote: ''
  summary: After lightning kills a girl in a lodge, her father discovers a smoking
    hole and digs up a many-colored, woman-shaped stone or object from the struck
    ground. The people perform washing, cedar-smoke, mud-smearing, prayer, and pipe-smoking
    rites before the stone, which is addressed as a heavenly father and kept with
    the people. The girl is buried on a high hill. Her father dreams of her marked
    with a star and moon-like eagle feathers, and she says the gods have favored her
    and that she is staying by the moon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After regaining consciousness, the girl's father sees fire at the lodge side
    where lightning struck and smoke coming through round holes in the girl's head,
    pillow, and ground.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father tells the people that his daughter has been killed by lightning,
    and the people gather while afraid to approach the struck place.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The father digs at the struck ground and uncovers an object shaped like a
    woman, with head, shoulders, and body, and many colors.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ritual materials are assembled, including tanned buffalo hide, eagle down
    at the altar, cedar limbs on live coals, cedar-nut tea in a wooden bowl, a flint,
    and skunk scent.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The people are told to wash with the tea, stand over burning cedar limbs so
    smoke passes over their bodies, smear their faces with mud from the lightning-struck
    ground, and pray at the stone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The father addresses the stone as Father, says it is from the heavens and
    has taken his daughter, and asks it to keep and teach its powers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the lightning strikes the girl, the clouds disappear and the sun shines
    brightly.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The next day the father invites his male relatives and says the object is
    not a flint but is shaped like a human body.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: A man smokes a pipe to the stone and says it shall be one of the people and
    remain with them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The stone is passed over the girl's body, pipe ashes are placed before it,
    and the men find that it is small but very heavy, leading them to call it iron
    stone.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The girl is buried on a high hill in a shallow grave arranged with forks,
    poles, grass, and dirt.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: At the grave, the father says he does not mourn because he believes the gods
    in the heavens favored and took the girl.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: In a dream, the father sees his daughter with a bright star on her forehead
    and eleven eagle feathers on the back of her head arranged like a moon.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: The dream daughter tells her father that the gods have favored her and that
    she is staying by the moon.
  category: speech
  evidence_refs:
  - ev:12
