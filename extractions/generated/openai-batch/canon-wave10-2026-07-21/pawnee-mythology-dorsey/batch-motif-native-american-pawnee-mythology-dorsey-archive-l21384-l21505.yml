canonical_text:
  quote: ''
  summary: 'The excerpt first gives a song and prose fragment in which young women
    bring pack strings for the priests. It then begins a Coyote tale: a Coyote visits
    an eastern Coyote village, takes the name Dragging-the-Stone, frightens the people
    by acting fearless and refusing invitations, lodges with a poor old Coyote couple,
    hears about a wonderful being who seizes the fattest buffalo, and then a crier
    summons named men with bows and arrows to search for buffalo.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Three stanzas say that daughters came alone with pack strings and thought
    of the wonderful old men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An errand man asks women to bring pack strings to the priests' lodge and to
    go after wood; Coyote's, Fox's, Rabbit's, and Spider-Woman's daughters come with
    packs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A village of Coyotes hears of another Coyote village to the east, and one
    Coyote travels to visit it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The visiting Coyote sees Coyote-men playing with gambling sticks, fears they
    will kill him, and decides to make them afraid of him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the edge of the village, the visitor announces that his name is Dragging-the-Stone,
    and the people become frightened by the large-sounding name.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Dragging-the-Stone is dressed like a warrior with a quiver, arrows, and bow;
    he walks through the village unconcernedly and sits near the gambling game.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Dragging-the-Stone refuses invitations to eat from the chief, the giant or
    wonderful being, and the bravest man, saying each has a mouth and can eat alone;
    the refusals increase others' fear and wonder.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the evening, Dragging-the-Stone chooses the poorest lodge in the village,
    where an old Coyote and his wife live, while the villagers avoid him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The old Coyote says a wonderful being claims the fattest buffalo from hunters
    and is feared because he kills people or blows them away; Dragging-the-Stone says
    he wants to meet him because he dislikes the robbery of meat.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: An old man cries through the village and sings for named men to bring bows
    and arrows and search for buffalo.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: A note says the story is told to teach young men on the war-path not to show
    fear before enemies.
  category: other
  evidence_refs:
  - ev:11
