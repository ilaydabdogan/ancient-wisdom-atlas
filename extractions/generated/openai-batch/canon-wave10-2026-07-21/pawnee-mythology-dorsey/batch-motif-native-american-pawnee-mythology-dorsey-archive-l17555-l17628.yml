canonical_text:
  quote: ''
  summary: The passage closes an account of Bear medicine and ceremony by describing
    cedar branches gathered by a woman, succession to her son, names she gives, and
    the continuing keeping of her teachings and regalia. It then begins a separate
    account, “The Buffalo Power and the Wild Horse Dance,” introducing a powerful
    chief, his son, repeated failed war parties associated with the son, the son’s
    rejection by warriors and family, and his decision to leave the village expecting
    death.
  language: English
  quote_policy: summarized
