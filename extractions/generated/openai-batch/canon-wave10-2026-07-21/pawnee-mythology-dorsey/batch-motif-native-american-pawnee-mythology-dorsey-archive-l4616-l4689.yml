canonical_text:
  quote: ''
  summary: Ready-to-Give, who identifies himself as Wind, says his son will call buffalo
    and provide food for the people. He departs in wind and dust, later returns with
    agricultural seeds, instructs the household women to plant them, and teaches his
    son to make the Ready-to-Give bundle and to use tobacco offerings with a buffalo
    skull. After months of ceremonial instruction, he leaves again for winter and
    warns his son about relatives who abandoned them. A starving hunter from the people
    approaches the camp seeking cached corn.
  language: English
  quote_policy: summarized
