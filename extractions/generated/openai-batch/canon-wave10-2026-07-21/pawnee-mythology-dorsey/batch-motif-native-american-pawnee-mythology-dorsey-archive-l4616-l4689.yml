  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ready-to-Give says winter requires him to stand in his place in the north
    to send food to people, and then disappears with wind-noise and dust through the
    lodge opening.
  category: sequence
  evidence_refs:
  - ev:1
