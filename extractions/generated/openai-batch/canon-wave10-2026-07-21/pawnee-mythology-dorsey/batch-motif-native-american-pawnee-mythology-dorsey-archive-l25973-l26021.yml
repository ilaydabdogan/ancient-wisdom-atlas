canonical_text:
  quote: ''
  summary: A boy is transformed, wounded, restored, and instructed by Bear, receives
    a bear claw and healing dust power, returns as a medicine-man, heals a wounded
    man, honors bear spirits, and later guides a chief's son through an animals' lodge
    initiation. Both boys become powerful medicine-men; the first boy disappears when
    the Bear dies, and the chief's son continues the bear dance and transmits the
    power to his children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bear, Bear's family, and the boy are changed between bear and human forms.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bear shoots the boy with an arrow, blows colored dust on him, shoots an arrow
    through him, and the boy is restored to life.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy is told that his people are returning home, that he should go with
    them, and that he must not forget the bears because he is one of them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Bear takes a bear claw from a cedar tree and hangs it around the boy's neck.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy is told that he can heal the sick by blowing colored dusts, that he
    has canine teeth like a bear, and that he will die when Bear dies.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boy is directed to go to the animals' lodge to learn to be a medicine-man.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: After other medicine-men fail to heal an injured man, the boy blows different
    dusts on the wound and heals him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In doctoring, the boy sings bear songs, and people know that he has visited
    bears.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The boy takes down his bear claw and four colored feathers, thanks the bears
    for his first fee, sings to call bear spirits, and smokes to them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The chief's son asks the poor boy to teach him his power; the poor boy says
    the chief's son is to be chief and may not be a medicine-man or have bear spirit
    because chiefs should not kill people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: When enemies attack, the boy wears his bear claw and feathers, paints his
    face red with black streaks down each eye, attacks the enemy, kills many, and
    is honored by the village.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The boy becomes leader of the bear dance.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The poor boy lowers the chief's boy over a steep bank by lariat, inserts two
    sharpened dogwood sticks into the skin of his back, and leaves him suspended until
    the animals receive him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The chief's boy sits with his back to the sun so that the sun may tell the
    bears that the poor boy is sending a substitute.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: On the fifth morning the chief's son stands by the poor boy fully dressed
    in ceremonial garments and carrying a bundle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The chief's son says he was received in the lodge and taught the power of
    medicine-men, and he delivers presents to the animals.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: The two boys enter the medicine-lodge, perform feats, become powerful medicine-men,
    and the chief's boy becomes chief.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: When old, the first boy grunts, embraces his friends, leaves the lodge, and
    disappears after people hear a scream of bears; this is said to occur because
    Bear has died.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: The chief's son continues the bear dance, marries, has children, and passes
    on the mysterious power learned in the animals' lodge.
  category: sequence
  evidence_refs:
  - ev:8
