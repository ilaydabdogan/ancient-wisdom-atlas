canonical_text:
  quote: ''
  summary: A Buffalo woman sings for the husband who brought her downstream. Old Claw-Shield
    Coyote falsely claims her but is ignored; a handsome young man on a white horse
    receives her, feeds her corn, and takes her west to the Buffalo camp, where she
    says she is married. The young man gives pipe smoke to the Buffalo, who send themselves
    to the human people to be killed and made holy with smoke offerings. The passage
    explains buffalo dispersion, ceremonial elk dress, bundles, posts, an eagle feather
    placed on a knoll, and blackbirds staying with buffalo. The passage then begins
    a separate story about a poor boy and his grandmother living apart from the village.
  language: English
  quote_policy: summarized
