canonical_text:
  quote: ''
  summary: 'The passage summarizes episodes involving a warrior''s mud-pony performance
    and subsequent loss of power, a hunt interrupted by enemies and aided by Potawatami
    giants, and the opening of a migration-and-medicine-lodge narrative: three Pawnee
    villages are formed from a family, powers are assigned to sons and groups, Animal
    Boy is challenged and transformed, Crow Feathers takes his costume, a poor couple
    receives a rapidly growing boy who produces buffalo, and Stone-Man gives a Kitkehahki
    man arrow-deflecting power before a red-fox hunting episode begins.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A distinguished warrior asks to join final sleight-of-hand performances, disappears
    for three days to prepare, enters enemy country in war paints, and returns with
    many ponies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The warrior takes a poor boy to his lodge; later they dig clay from a high
    hill, and the boy makes four mud ponies that are placed in a sun ray in the lodge
    to dry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At night the warrior and boy take the clay ponies to the medicine-lodge; the
    warrior sings, the mud ponies walk around, and after the performance the boy throws
    them into water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the mud ponies are thrown into the creek, the warrior is no longer known
    to capture ponies, because his power was taken from him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: During a summer hunt a medicine-man takes his stone medicine; enemies attack,
    Potawatami allies send twenty warriors described as giants, and the enemy are
    overthrown.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the enemies are defeated, Pawnee cut out enemy hearts, place them in
    medicine-bags, smear their faces with blood, and the owner of the stone medicine
    survives though the bundle is lost.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A man and wife have two sons and many daughters; each son takes a wife, and
    the father makes lodges on each side of his own, forming three Pawnee villages
    that face west.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The father tells the older son to obtain power from animals and have roots
    and herbs, and tells the younger son to learn the power and strength of stones.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Kitkehahki go south, the Chaui west, and the Pitahauirat remain east;
    the passage associates these groups respectively with stone power, heavenly gods,
    and favor from Tirawa.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: A Chaui young man disappears, returns famous as Animal Boy, and is challenged
    by Crow Feathers to become an animal; Animal Boy becomes an eagle.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Crow Feathers commands Animal Boy to remain an eagle and returns to the village
    wearing Animal Boy's costume.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A poor woman gathering grass sees a bird drop down before her and finds a
    boy baby, whom she and her husband care for.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The child grows rapidly, asks for a bow and arrow and a spider-web ring, shoots
    at the rolling ring, and a dead buffalo appears; this continues for many days.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The boy's power is not recognized because he remains ragged and dirty; the
    passage states that he is Animal Boy, who had been taken into the animals' lodge
    and given great power.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:15
  text: A Kitkehahki man in the west is addressed by Stone-Man and receives power
    to ward off arrows; after returning he behaves insolently, and his people fail
    when they try to kill him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: A red fox has carried away game; a chief offers his eldest daughter to whoever
    kills it, Animal Boy helps prepare a trap, and the fox is caught in Animal Boy's
    trap, though he only gets hair from its tail.
  category: sequence
  evidence_refs:
  - ev:8
