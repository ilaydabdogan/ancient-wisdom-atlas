- id: motif:2
  label: loss of power after improper disposal of ritual objects
  taxonomy_refs: []
  basis: The warrior's pony-capturing power is taken from him after the mud ponies
    are thrown into the creek.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage states the causal link but does not explain the underlying
    rule.
- id: motif:3
  label: power obtained from stones or Stone-Man
  taxonomy_refs:
  - sacred_exchange
  basis: The younger son is told to learn stone power, the Kitkehahki understand stones
