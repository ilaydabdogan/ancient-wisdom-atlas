  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: An editorial note says the story of the boy and the cannibal witch teaches
    children not to marry strange women, identifies strange women as spider-women
    with bad influence, and says birds help destroy evil spirits.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: The same note says the lark led the boy to a lodge of gods in the west, where
    he received a sacred bundle and instructions, and where the people were promised
    buffalo.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the following tale, a hunter travels east, enters a grass-lodge at the
    invitation of the Witch-Woman, eats from a wooden bowl, becomes sick, and dies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Witch-Woman cuts up the dead hunter's flesh, hangs it on poles, and keeps
