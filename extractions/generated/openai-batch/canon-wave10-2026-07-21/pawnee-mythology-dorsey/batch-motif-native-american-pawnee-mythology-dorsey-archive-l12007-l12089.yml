- id: obs:1
  text: An adviser says he will blow breath on the strings that hold the twin balls
    together so the string will wear out and break.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the game day the uncle tells the girl to strike his swollen ankles with
    his stick, and she does so before playing twin balls with Spider-Woman.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the twin-ball game the girl notices the string weakening; the string
    parts and the balls separate.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: After Spider-Woman wants to stop playing, the girl insists on continuing and
    obtains twin balls that come out from under her uncle's feet after she beats his
    feet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The girl wins the games, wins Spider-Woman's people, and finally wins Spider-Woman
    herself.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The people with the girl kill and burn Spider-Woman; after burning, she is
