canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a girl, aided by her uncle, defeats
    Spider-Woman in a twin-ball game; Spider-Woman is killed, burned, and seen in
    spider form, and the episode explains rheumatism. It then gives an editorial note
    on a tale about a boy, a cannibal witch, strange women as spider-women, helpful
    birds, the lark, a divine lodge, a sacred bundle, and the promised buffalo. A
    following tale begins with a hunter killed by a Witch-Woman in a grass-lodge and
    his son challenged to a dance while carrying his father's head.
  language: English
  quote_policy: summarized
