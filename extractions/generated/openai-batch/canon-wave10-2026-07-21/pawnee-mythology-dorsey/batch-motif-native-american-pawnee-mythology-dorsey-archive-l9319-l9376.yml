  text: Buffalo bulls rush to the place where the boy stands, stamp, bellow, and speak.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The female buffalo runs and turns into a ring; the ring rolls and falls onto
    the black stick.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The old bull says the boy cannot see the buffalo, but their spirits will be
    with him, and says the strings on the sticks are many buffalo.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The old bull instructs the boy to put the ring on the black stick, hang the
    objects on the north side of the lodge, first play with the gambler's sticks,
    break the gambler's stick, and then use the buffalo-given sticks.
  category: speech
  evidence_refs:
  - ev:5
