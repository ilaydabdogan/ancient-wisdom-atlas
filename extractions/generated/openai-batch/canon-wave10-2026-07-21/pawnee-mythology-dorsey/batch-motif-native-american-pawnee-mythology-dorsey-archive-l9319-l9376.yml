canonical_text:
  quote: ''
  summary: A boy encounters buffalo bones and skulls whose voices offer help. A young
    bull becomes a white playing stick, and a young female buffalo, with the participation
    of buffalo bulls, becomes a ring. The boy asks his grandfathers for aid against
    a bad man who kills and eats people. An old bull tells him that buffalo spirits
    will accompany him and gives instructions for arranging and using the sticks and
    ring in a gaming contest. The boy prepares the lodge, the people gather, a witch
    woman waits with a bone quirt intending to kill him, and the boy sings a challenge
    to the gambler.
  language: English
  quote_policy: summarized
