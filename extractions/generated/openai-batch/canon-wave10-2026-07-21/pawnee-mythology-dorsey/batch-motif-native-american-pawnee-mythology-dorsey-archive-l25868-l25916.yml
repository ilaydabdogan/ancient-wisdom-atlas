  category: speech
  evidence_refs:
  - ev:9
- id: obs:20
  text: The boy later sees fire coming from water, becomes unconscious, and finds
    himself in a lodge where animals sit in groups.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:21
  text: Magpie explains to the animals that the boy was fed poisonous food by the
