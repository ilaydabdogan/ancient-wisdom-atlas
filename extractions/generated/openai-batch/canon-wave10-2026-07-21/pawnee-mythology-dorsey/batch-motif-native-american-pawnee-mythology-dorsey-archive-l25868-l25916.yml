candidate_motifs:
- id: motif:1
  label: Return after death under a ritual covering
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Proud Boy is killed, placed with Yellow-Corn under a painted robe in a closed
    tipi, and later comes out of the tipi after dust and animal noises occur.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage is an abstract; Yellow-Corn's own emergence is not separately
    described, though Proud Boy asks for food for 'them'.
- id: motif:2
  label: Couple accepts death together
  taxonomy_refs:
  - annihilation_union
  basis: Yellow-Corn states willingness to die with Proud Boy, and the two are seated
    together before being killed and covered side by side.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The taxonomy label is approximate; the passage states willingness and
    shared death but does not elaborate a doctrinal meaning of union.
- id: motif:3
  label: Enemy destruction without ordinary weapons
  taxonomy_refs: []
  basis: Proud Boy says he will not use his weapons but that his enemies will die;
    he points a water dog toward them and they die afterward.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not explain what the water dog is or how it causes the
    deaths.
- id: motif:4
  label: Animal-guided initiation into medicine power
  taxonomy_refs:
  - initiation
  - mystical_quest
  basis: The boy follows Magpie into timber, receives visionary instruction, is taken
    to the animals' lodge, and is taught by the turtle/fireplace being.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The abstract ends before the healing episode is completed, so the full
    initiation outcome is not included in this passage.
- id: motif:5
  label: Animal or lodge beings appearing in human visionary form
  taxonomy_refs:
  - shapeshifter
  basis: A black-painted man says he is bird, and a mud-covered fiery man says he
    is turtle and the fireplace of the animals' lodge.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: medium
  cautions: The passage reports visionary identifications but does not narrate a full
    transformation sequence.
- id: motif:6
  label: Poisonous food as crisis requiring animal healing
  taxonomy_refs:
  - initiation
  basis: The jealous medicine-man feeds the boy human-flesh mush; Magpie explains
    that the poisonous food has become an enlarging clay ball and asks the animals
    to pity him.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: medium
  cautions: The text breaks off just as the animals approve, so the actual healing
    action is not present in the supplied lines.
- id: motif:7
  label: Transmission of medicine power after ordeal
  taxonomy_refs:
  - wisdom
  basis: Proud Boy becomes a medicine-man, heals the sick, and teaches his power;
    in the second abstract, the boy receives instruction from animal-associated powers.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:9
  confidence: medium
  cautions: This joins two adjacent abstracts by shared medicine-power pattern, not
    by a stated narrative connection.
