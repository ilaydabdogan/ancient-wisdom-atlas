canonical_text:
  quote: ''
  summary: The passage summarizes the end of a story in which Proud Boy and Yellow-Corn
    are killed, covered in a painted robe inside a tipi, and Proud Boy later emerges,
    uses a water dog against his attackers, and becomes a medicine-man. It then begins
    the abstract of “The Bear Medicine-Man,” in which a boy follows Magpie, receives
    visions, is poisoned by a jealous medicine-man, and is taken to the animals’ lodge
    where a turtle/fireplace being teaches him and animals are asked to heal him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yellow-Corn's husband is told of her desertion; after reproach and taunting
    by his brothers, he decides to accompany others to kill Proud Boy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Proud Boy tells his father not to fear, to cover Proud Boy and Yellow-Corn
    side by side with a robe, and to leave them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Proud Boy eats a root, gives some to Yellow-Corn, and she expresses willingness
    to die with him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the morning Proud Boy holds a buffalo scalp to the rising sun, paints Yellow-Corn,
    gives her more root, and they sit in front of the buffalo scalp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Yellow-Corn's husband and his friends shoot and kill Proud Boy and Yellow-Corn
    and ride over them with horses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Proud Boy's parents place the bodies on a bed, cover them with a painted robe
    as directed, close the tipi, and do not mourn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dust rises straight up from the tipi at noon, and noises like those of mountain-lion,
    buffalo, birds, and others are heard; dust and noises recur several times.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Proud Boy comes out of the tipi in the afternoon and asks his mother to prepare
    food for them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Proud Boy says he will not use weapons against his enemies but that they will
    die; he points a water dog toward them, after which Yellow-Corn's first husband
    and then one helper per day die.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Proud Boy declines an offer to be made chief, becomes a medicine-man, heals
    the sick, teaches his power, and people begin painting their tipis in imitation
    of his.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A little boy follows Magpie day after day into timber and sees a black-painted
    man in vision who says the bird is the medicine-men's errand man and that he is
    bird.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The vision figure tells the boy to return to his people and later return;
    Magpie leads the boy back to his village.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: A jealous Skidi medicine-man is said to visit graves for human ears and other
    things, using them to kill people.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: The jealous medicine-man invites the Chaui boy to his tipi, gives him a pipe
    to smoke, and gives him mush that is really human flesh.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Magpie leads the boy back to timber and to the animals' lodge because the
    boy is in a dangerous condition.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The boy finds himself lying on a fireplace shaped like a turtle.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:17
  text: In vision the boy is among rushes and sees a mud-covered man emitting fire
    from his eyes and mouth.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:18
  text: The mud-covered being says he is turtle, that he carried the boy, and that
    he is the fireplace of the animals' lodge.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:19
  text: The turtle being teaches the boy that in the medicine-men's lodge he may shoot
