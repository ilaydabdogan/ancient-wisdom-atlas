canonical_text:
  quote: ''
  summary: Bear-Man wears Woodpecker-Boy's clothing and equipment and is treated by
    the village as the boy, but his attempts to repeat the boy's feats fail. Meanwhile
    the real Woodpecker-Boy is starving in a hole until a grandchild and old woman
    find him, pull him out, feed him with begged corn mush, and help him recover.
    Once strong, he asks for ash and dogwood to make a bow and four arrows, then goes
    into the timber with the other boy.
  language: English
