  summary: The Buffalo agree to go to the home of the people. Their herd leader is
    a white-spotted bull married to a white-spotted cow. During the journey the cow
    gives birth to a snow-white female calf. The calf carries the sacred bundle and
    decides each morning how far the herd will travel. The herd reaches a place where
    the people are; the supplied excerpt breaks off after “and they gave.” Paratextual
    notes say a song’s words have no meaning and identify the story as concerning
    the origin of the Buffalo bundle and teaching respect for the sacred bundle.
