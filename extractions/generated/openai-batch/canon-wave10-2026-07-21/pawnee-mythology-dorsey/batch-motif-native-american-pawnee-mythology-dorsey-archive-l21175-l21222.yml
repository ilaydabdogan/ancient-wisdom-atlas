canonical_text:
  quote: I must fix myself up so that I can deceive my wife and marry my daughter.
  summary: Coyote gives his wife instructions about recognizing a chief, is buried,
    emerges from the grave, disguises himself as a one-eyed chief, uses arrow-making
    and buffalo tongues and hearts as signs of status, and asks his wife for their
    daughter in marriage.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The old man tells his wife to bury his body in a hole with his head left sticking
    out, and says he has looked to Tirawa for assistance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: He tells his wife that a man making arrows after the people have left the
    village, or a man carrying only buffalo tongues and hearts after a kill, should
    be recognized as a chief and may have their daughter if he asks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Coyote dies, is buried as requested, and his wife and children leave to join
    the other people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Coyote crawls out of the grave and states that he will alter his appearance
    to deceive his wife and marry his daughter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Coyote stays near his family's grass-lodge and then makes arrows at the village
    site after the people break camp.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The daughter says the arrow-maker looks like her father, while the mother
