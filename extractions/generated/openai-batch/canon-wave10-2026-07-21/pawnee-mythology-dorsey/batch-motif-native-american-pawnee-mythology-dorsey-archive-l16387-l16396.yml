  summary: A little boy leaves a village near Fremont, Nebraska, enters thick timber,
    finds many Magpies, and unsuccessfully tries to shoot them before running after
    one. A source note says the story was told by Little-Chief, Chaui, is generally
    related during the Bear ceremony and sometimes to children, and teaches poor boys
    that bears are friends from whom mysterious power may be secured if approached
    properly.
