  quote: ''
  summary: After four days, a missing girl's relatives search the village and investigate
    the chief's boy, who had been courting her. A woman watches the chief's boy overnight
    and sees that he does not leave the lodge. The girl's uncle confronts the chief
    and the chief's boy, who denies having seen the girl recently. Men count the young
    men in the lodges and find that the poor boy is missing from the chief's lodge;
    the people conclude that he took the girl away. The passage ends mid-sentence
    as some people begin to threaten unspecified action.
