canonical_text:
  quote: ''
  summary: Two girls lead a young man westward toward their country, repeatedly testing
    whether he can keep pace. When they leave the ravine they are again Buffalo, and
    the boy keeps up with them through hills, mountains, and valleys. At night on
    a mountain they become girls again and question him about how he could escape
    if Buffalo pursued him. He reveals that his arrows and bow are blacksnakes and
    explains the sequence by which Buffalo could eventually find and kill him. The
    girls mention a white-spotted bull who leads all Buffalo. At dawn they bring the
    boy near the Buffalo people, whose place is marked by dust clouds, and the boy
    watches from a hill as Buffalo gather around the two girls.
  language: English
  quote_policy: summarized
