canonical_text:
  quote: ''
  summary: In an animals' lodge, four animal practitioners use a bowl of water, jaw-working,
    somersaulting, and vomiting to bring up different bones from a baby inside the
    boy, but then seek help from the Bears. The youngest Bear opens the boy's belly
    with a claw; the animals work their powers, heal him, teach him nightly mysterious
    performances, and direct him to live above the lodge by day. The boy forages,
    makes weapons, hunts, is sent back to his village for offerings, wakes parents
    who thought him dead, gathers meat, robes, tobacco, and other gifts from kin,
    and at Pahuk throws the offerings into the water before jumping in and finding
    himself back in the animals' lodge with the gifts inside.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four unnamed animal practitioners go around a bowl of water, dip their noses,
    work their jaws, turn somersaults, and vomit different bones of the baby that
    was in the boy; when they can do no more, they ask the Bears for help.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bears agree to help; the youngest Bear uses his smallest claw to cut open
    the boy's belly and remove meat, which is thrown to little animals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bears, medicine-men, and other animals rise, rush to the boy, work their
    powers, carry him around, heal the wound, stand him up, push him until he walks,
    and seat him on the south side.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The animals tell the boy that he should stay above their lodge during the
    day, return at night, and learn their mysterious performances.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: On dry land the boy digs and eats artichokes, eats plums, finds a knife and
    sinew at the deserted village site, cuts ash and dogwood, makes a bow and blunt
    arrows, kills rabbits and birds, and eats them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At night the boy returns to the animals' lodge, where the animals play sleight-of-hand
    upon his body while teaching him, and they keep him there for a long time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In fall the animals tell the boy that the tribes have returned and instruct
    him to enter his village at night, wake his parents, and ask for two parfleches
    of dried meat, robes, and much tobacco.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The boy returns to his lodge, wakes his mother and father, asks his father
    to call relatives, and the relatives bring a large pile of requested gifts; his
    uncle helps load the gifts onto a pony.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Near Pahuk the boy unloads the pony, sends his uncle home, sees feather-like
    forms on the water and hears peculiar noises, rolls the parfleches and throws
    the gifts into the water, then jumps from the steep bank and finds himself in
    the animals' lodge with the gifts inside.
  category: sequence
  evidence_refs:
  - ev:5
