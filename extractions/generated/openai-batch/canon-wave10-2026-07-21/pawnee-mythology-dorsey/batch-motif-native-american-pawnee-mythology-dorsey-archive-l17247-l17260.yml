canonical_text:
  quote: ''
  summary: A female Bear gives a woman powdered berries by coughing them up, and the
    woman eats them. The Bear explains that the woman is now prepared to doctor the
    sick by blowing breaths and giving coughed-up berry powders. The Bears keep the
    woman in their den and teach her mysterious things. The male Bear tells her it
    is time to go home and gives red paint and a red downy feather for her husband;
    the female Bear gives yellow paint and a yellow feather.
