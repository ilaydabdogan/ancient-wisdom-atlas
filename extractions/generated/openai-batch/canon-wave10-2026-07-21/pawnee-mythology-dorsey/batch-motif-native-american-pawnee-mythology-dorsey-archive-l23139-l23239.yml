canonical_text:
  quote: ''
  summary: 'The passage closes a tale in which Black Rat and White Rat are associated
    with different underground foods through songs and are thereafter known by those
    food names. It then gives two war-party tales: Turtle gathers Mosquito and Cricket,
    is captured, deceives lodge people into throwing him into water, and the tale
    explains later cricket and mosquito habitats; another war party attacks three
    hard-to-kill men who are Hawks, and the Hawks destroy Rabbit, Turtle, Spider-Woman,
    and the attacking warriors with fire and war clubs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Black Rats are linked with rat trails in the forest and with artichoke vines
    climbing on red willows, where digging yields artichokes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Magpie sings to White Rat that ground beans or earth-nuts are found under
    the ground by willows in soft, crumbling soil, and that White Rat shall live on
    earth-nuts.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Rats sing that an errand bird of the northern god called Ready-to-Give
    has given them artichokes to eat.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After this, White Rat is known as the ground-bean Rat and Black Rat as the
    artichoke Rat.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Turtle starts on the war-path, says a root is sticking into them and they
    are angry, and allows Mosquito and Cricket to join.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Turtle, Mosquito, and Cricket enter a lodge and try to kill the people inside;
    Turtle is caught, Cricket enters a hole, and Mosquito lands in the fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: When threatened with fire, Turtle says he is not afraid of fire and would
    scatter it around the room; when water is proposed, he says he is afraid of water.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After being thrown into the water, Turtle raises his head, sticks out his
    tongue, and says the water is his home and he fooled the people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Mosquito later flies into swampy country and gets his legs stuck in mud; the
    tale says crickets have since lived in lodges and mosquitoes near swampy places.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A note says the Turtle war-party story is told to children to teach them not
    to join a war party with weak men, but to join a strong party.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: Many people go on the war-path against three men who are hard to kill, and
    the ground around the three men's camp is covered with skulls of earlier failed
    attackers.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: Rabbit, Turtle, and Spider-Woman are among the attacking party and boast that
    they will kill the three hard-to-kill men.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Rabbit charges while riding a mule and singing; Turtle carries a grass spear
    and a shield; Spider-Woman says to kill two men but leave the youngest for her
    to catch.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The three men make a fire, come out with fire before them, kill many attackers
    by fire, kill others with a war club, and finally kill Rabbit, Turtle, and Spider-Woman.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The tale identifies the three hard-to-kill men as Hawks, and a note says the
    story teaches warriors to imitate the Hawks rather than Rabbit, Turtle, or Spider-Woman.
  category: attribute
  evidence_refs:
  - ev:10
  - ev:11
