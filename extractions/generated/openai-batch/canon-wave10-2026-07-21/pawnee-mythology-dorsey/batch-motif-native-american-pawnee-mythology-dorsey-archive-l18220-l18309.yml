    something is going to happen.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A storm comes from the west, rain and wind follow, and one woman is blown
    away by the wind.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the storm, a drove of Buffalo comes near the village, one Buffalo speaks,
    and the carried-away buffalo skull, drums, and gourds are returned to the lodge.
  category: action
  evidence_refs:
  - ev:4
