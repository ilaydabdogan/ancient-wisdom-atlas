canonical_text:
  quote: ''
  summary: The passage concludes an origin account in which Howling-Fox receives buffalo
    abundance and learns the Buffalo ceremony from Buffalo-Woman, then shifts to an
    account of the Buffalo Medicine Dance involving a buffalo attack, storm omen,
    entry into a Buffalo or animals' lodge through cave and water, and instruction
    about a buffalo skull as a ritual object. It then begins another account in which
    an abandoned pregnant woman with a crying child meets a Buffalo bull who offers
    a healing root.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Howling-Fox remains with chiefs and braves to receive buffalo offerings, and
    the people credit him with bringing the Buffalo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After several killings, the Buffalo pass east; Howling-Fox says the Buffalo's
    promise has been fulfilled and tells the chief the people should move east to
    the permanent village.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Howling-Fox stays behind in the old camp, where Buffalo-Woman visits at night
    and teaches him Buffalo dance songs and the Buffalo ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Howling-Fox starts the Buffalo dance, wears a ring from a Buffalo cow on his
    left arm, gives gifts to the man who had owned the ring, and teaches that man
    the ceremony and songs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Howling-Fox dies soon afterward, and the people say this happened because
    he had given all his secrets to the other man.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: During a buffalo hunt, the people camp in a valley with the holy lodge and
    sacred bundle at the center of the village.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: A buffalo bull attacks the village, enters the holy tipi where the bundle
