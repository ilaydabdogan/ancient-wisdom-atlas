  text: Tirawa tells the man that the earth should be called mother and that the lodge
    represents the mother's breast.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tirawa says the smoke from the opening is like milk from the mother's breast,
    and that eating cooked food is like sucking a mother's breast because it makes
    people grow strong.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tirawa says he gives life and increase, but humans will not live forever,
