  text: The woman is the first to enter the completed lodge and offers corn raised
    from seed to the four gods named as southeast, southwest, northeast, and northwest,
    pressing and rubbing it upward on each post.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man kills an animal with bow and arrows, takes its fat, greases the four
    posts, and places the skull upon the altar.
  category: action
  evidence_refs:
