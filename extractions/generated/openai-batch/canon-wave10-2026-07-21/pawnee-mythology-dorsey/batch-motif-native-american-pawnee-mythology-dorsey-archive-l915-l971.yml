canonical_text:
  quote: ''
  summary: After a lodge is completed, a woman offers corn at four posts to four directional
    gods, and a man uses animal fat and a skull at the posts and altar. Tirawa explains
    the lodge as the mother's breast, smoke as milk, cooked food as nourishment, and
    human mortality as return to earth. Tirawa instructs the woman to boil speckled
    corn in water over fire and feed the resulting mush to her husband, after which
    they increase. Tirawa also gives ceremonies, including the Woman-dance and Starisu
    Woman's dance, and the passage describes preparations for a buffalo-linked dance
    performed by high-born young people under priests and a chief.
  language: English
  quote_policy: summarized
literal_observations:
