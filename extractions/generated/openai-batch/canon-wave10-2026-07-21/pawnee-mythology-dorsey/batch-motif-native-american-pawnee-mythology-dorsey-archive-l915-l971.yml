- id: obs:10
  text: For the Starisu Woman's dance, winter buffalo meat is requested, high-born
    young men try to kill the fattest buffalo, and the meat is taken to the chief's
    lodge to be jerked and dried.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In spring after corn planting, four priests and one chief seek consent for
    the ceremony; women clear the lodge and sweep it with eagle-wing fans.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The four priests sit at the west, girls sit on the north side, young men sit
