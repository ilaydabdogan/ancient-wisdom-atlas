canonical_text:
  quote: ''
  summary: 'A woman refuses to return a wonderful robe, saying she now has it for
    a skirt. A boy repeatedly sings that he is hunting the robe and names paintings
    on it: dragonflies, lightning, thunders, and winds. The Witch-Woman challenges
    his power. The boy cries and blows from the west; clouds, wind, and rain come.
    The old woman returns the robe, but the wind carries her into the heavens and
    then blows her down into mud at a ravine, where she sinks.'
