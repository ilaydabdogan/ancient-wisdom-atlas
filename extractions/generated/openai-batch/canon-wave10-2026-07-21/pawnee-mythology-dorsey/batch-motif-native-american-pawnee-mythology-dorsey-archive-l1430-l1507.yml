canonical_text:
  quote: ''
  summary: A young man directs a quieted village and a small hunting party in a ritual
    buffalo hunt using a feathered willow stick. The first buffalo is killed, butchered,
    and ritually offered with heart, tongue, fat, and tobacco to Mother-Corn. The
    people receive grease, further buffalo emerge from a cave through repeated use
    of the feather-stick, and the people are instructed in earth-lodge building, planting
    seeds, and future dream communication from the woman in the cave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief orders the crier to tell the village to put away games, keep still,
    and summon four men; the young man is to instruct them for the buffalo hunt.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A long willow is fetched, peeled, and fitted with a feather; a bunch of buffalo
    hair is placed on the bundle again.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man leads the four men toward the cave and sticks the feathered
    stick into the ground halfway between the cave and the village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A buffalo appears; the four men circle it, shoot it with bows and arrows,
    skin it, remove its head, place the head on a high hill, and carry the meat and
    hide back.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The buffalo meat is placed southeast of the entrance in the young man's lodge,
    and older men are invited.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The young man says an offering must first be made to Mother-Corn because she
    gave the buffalo; the heart and tongue are boiled.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: West of the village, the young man lifts the heart, tongue, and tobacco toward
    the sky, lowers them to the ground, and places the tobacco on the heart and tongue.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Men scramble for pieces of heart, tongue, or fat; those who get some take
    it home, rub grease on themselves and their families, and put it in the fire after
    use.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The young man says the work is incomplete, that Mother-Moon will tell them
    more, and that they must do as she says every time they kill buffalo.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the feathered stick is stuck in the same place again, buffalo rush out
    of the cave, move in several directions, and many are killed and brought to the
    village.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The people build earth-lodges as the young man instructed; every four days
    he repeats the feather-stick action, and the fourth time says all the buffalo
    are out of the cave.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The woman in the cave says she has given the promised things, tells the young
    man to give seeds to the people for planting, and says she will speak to him at
    his bedside in dreams.
  category: speech
  evidence_refs:
  - ev:9
