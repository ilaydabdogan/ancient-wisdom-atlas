canonical_text:
  quote: ''
  summary: During a summer medicine-men ceremony, a poor boy starts the Loon Dance.
    Two Loons are carried by errand men while medicine-men representing animals follow.
    Afterward the Loons are put in a sacred bundle carried by warriors on the war-path.
    In later ceremonies the Loons are set before the medicine-men in remembrance that
    the two Loons taught mysteries, animal ways, and medicinal uses of roots and herbs
    to the people.
