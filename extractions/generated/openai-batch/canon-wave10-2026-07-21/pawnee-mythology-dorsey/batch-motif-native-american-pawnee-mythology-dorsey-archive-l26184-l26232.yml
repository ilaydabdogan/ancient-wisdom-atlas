canonical_text:
  quote: ''
  summary: In this abstracted passage, Howling Fox repeatedly meets a buffalo woman
    who changes between woman and buffalo form. She identifies her daughter in a ring,
    gives Howling Fox healing paint and later buffalo-calling power, directs a starving
    village toward buffalo, instructs the making and arrangement of an earth-lodge,
    receives offerings, and brings buffalo bulls to receive smoke. Howling Fox leads
    ritual instructions for the hunt, including sparing a cow messenger. The people
    kill buffalo, find ritual objects on the animals, reward Howling Fox, and return
    home. Howling Fox remains behind, is taught the buffalo dance and ceremony by
    the buffalo woman, institutes it among the people, transfers the ceremony to another
    man, and dies after giving away all his knowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman examines rings, identifies her daughter among them, says she will
    take the daughter with her, gives Howling Fox paint to use across his mouth for
    healing the sick, becomes buffalo, and disappears after a ring is tied between
    her horns to her hair.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Howling Fox thanks the gods in the heavens after seeing the buffalo, returns
    two rings in the morning, and asks the owner of the unreturned ring not to question
    him because he will be compensated.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The village travels southwest to hunt buffalo without success; Howling Fox
    meets the buffalo woman, who says she is there to help him and tells him to direct
    the people northwest.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Howling Fox approaches the chief with an offering of food before suggesting
    that the people stop going southwest and travel northwest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The buffalo woman tells Howling Fox to make an earth-lodge with its entrance
    facing west and says she will return in four days wanting offerings such as feathers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the fourth night, Howling Fox gives the buffalo woman presents, goes with
    her to a buffalo wallow, sees her become buffalo, follows her to bulls, and ties
    presents on their horns.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The buffalo woman becomes woman again, says the people will soon have buffalo,
    gives Howling Fox power to call buffalo, covers him with her robe, and blows her
    breath, making a great wind that leaves him at home when it dies down.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the lodge is prepared, the buffalo woman brings bulls for the people,
    enters Howling Fox's lodge, and instructs him how to arrange it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Howling Fox makes a great fire, scatters ashes over the lodge floor and toward
    the entrance, and at night buffalo bulls enter the lodge one after another to
    receive smoke.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A buffalo bull sits in the west of the lodge; after smoke is offered, the
    buffalo woman says her father is satisfied.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The buffalo woman gives Howling Fox buffalo meat, and the chief is later feasted
    and sees hoofprints on the ashes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Spies first report seeing no buffalo, then report several bulls in a ravine;
    a crier summons the people for an attack and announces that ribs, tongues, and
    hearts are to be brought to Howling Fox's lodge.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Howling Fox instructs the people not to break open skulls with stones for
    brains and not to kill one cow, because she is a messenger.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Many bulls are killed while the cow is allowed to escape; as the bulls are
    skinned, eagle feathers and native tobacco are found on their heads.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The people conclude that Howling Fox helped bring the buffalo, give him many
    presents and ponies, kill buffalo four times, and return to their permanent village.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Howling Fox stays behind, is visited at night by the buffalo woman, is taught
    the buffalo dance and ceremony, returns to institute it, wears the gaming ring
    from the cow on his left arm, gives a buffalo robe and pony to a man, teaches
    him the ceremony, and soon dies because he gave all his knowledge to another man.
  category: sequence
  evidence_refs:
  - ev:8
