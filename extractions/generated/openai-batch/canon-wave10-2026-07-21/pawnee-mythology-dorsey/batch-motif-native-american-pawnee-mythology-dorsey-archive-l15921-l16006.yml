    heavens.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: After being refused and later hearing that Yellow-Corn had married the greatest
    warrior in the village, Proud-Boy became angry, silent, disturbed, and discarded
    or gave away personal items.
  category: sequence
