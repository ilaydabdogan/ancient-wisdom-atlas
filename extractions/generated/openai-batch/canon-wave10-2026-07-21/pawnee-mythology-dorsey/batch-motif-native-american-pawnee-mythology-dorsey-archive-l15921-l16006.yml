canonical_text:
  quote: ''
  summary: A girl consecrated with holy ointment is kept in the priests' lodge under
    a sacred bundle, becomes keeper of the bundles, carries the bundle on a buffalo
    hunt, and later undergoes a washing ceremony that removes the ointment and returns
    her to ordinary status. Proud-Boy wishes to marry her after she is known as Yellow-Corn,
    but his father refuses because he lacks war, hunting, wealth, and sacrificial
    achievements. Proud-Boy later hears she has married a great warrior and withdraws
    in anger and distress.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Priests kept singing for one whole day and one whole night while the girl
    sat before them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl was taken to the lodge of the priests, and her parents had to live
    with those people although they belonged to another named band.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The girl was required to sit under the sacred bundle and was told that holy
    ointment made her holy.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old man warned the girl that going out, playing, or making noise could
    affect the winds, buffalo, gods in the west, cool days, and rain.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The girl lived with the old people and became keeper of the sacred bundles;
    Proud-Boy came at night to look into the lodge at her.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the buffalo-hunt journey, the girl carried the sacred bundle on her back
    and sat before or under it after camp arrangements were made.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The people found many buffalo, killed them, and brought meat to the priests'
    lodge where the girl was; the tongue and heart were boiled for her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: As the people neared the village after the hunt, scouts or runners checked
    the corn, beans, and squash and reported good crops.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the return to the village, priests opened the bundle, used sweet-smelling
    grass on glowing coals, passed bundle contents over smoke, removed the holy ointment
    from the girl, used sage dipped in water near her, and had her greased with fat
    from holy meat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage says the eyes of the gods were removed from the girl after the
    ointment was removed, so that she became like any other girl.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Offerings of meat and corn were first given to the girl and then to others;
    after the ceremony her grandfather led her home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Proud-Boy told his father that he wanted to marry the girl, who was now called
    Yellow-Corn because she represented Mother-Yellow-Corn.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Proud-Boy's father said he could not marry Yellow-Corn because he lacked enemy-camp
