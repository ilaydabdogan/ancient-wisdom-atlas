canonical_text:
  quote: ''
  summary: A man returns alone and says he became separated from the others. The people
    call him a coward. Later the victorious war party returns with captured ponies,
    victory songs, body painting, and smoke-signaling. The warriors say they thought
    the man had strayed and been killed. Wolf-Man listens silently. In fall, another
    distinguished warrior plans an expedition among the Comanche, and Wolf-Man secretly
    joins the party.
  language: English
  quote_policy: summarized
