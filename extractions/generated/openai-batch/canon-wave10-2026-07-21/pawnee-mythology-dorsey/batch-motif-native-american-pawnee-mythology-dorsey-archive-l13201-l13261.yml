canonical_text:
  quote: The stone in your lodge was a god, and was in the heavens.
  summary: A daughter tells her father that she is among the gods and that a heavenly
    stone in the lodge is a god. She instructs him to sleep beside it. In dreams,
    a man associated with the stone says he killed the daughter, lost his place in
    the heavens, is now with the father, and will teach him to be a medicine-man.
    The father performs ritual acts with bathing, mud, fasting, crying, and later
    receives dream directions concerning the animals' lodge.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The daughter says she is among the gods and says the stone in the lodge was
    a god in the heavens.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The daughter says the lightning did not kill her, that the stone fell from
    the heavens, and that she is to turn to stone.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The daughter instructs the father to make his bed on the north side of the
    stone, place his pillow near it, and attend to it because it will speak to him
    in sleep and listen when spoken to.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The daughter disappears, and the father is temporarily dazzled by the light
    around her before he can see plainly at night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father tells his wife what the daughter said; the wife advises him to
    do it, and he lies down by the stone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: While asleep by the stone, the father sees a man at the head of his bed who
    says he liked and killed the daughter, lost his place in the heavens, and is now
    with the father as one of the gods.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The dream-man instructs the father to keep him at the altar, keep other people
    away, cover him with buffalo hide, and maintain fresh mud by pouring water into
    a small hole.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The dream-man describes downy feathers on his head, a robe with the hair outside,
    mud on his face, red paint around his mouth, a gourd-like rattle in his right
    hand, and an eagle wing in his left hand.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The dream-man says he is not the Lightning but a god, says the daughter is
    gone, and says he now takes her place and will teach the father to be a medicine-man.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The dream-man says he stood high in the heavens, knows where the animals'
    lodges are, will open their entrance, and will make the father understand these
    things through his power.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: The next day the father does not eat or drink, bathes in the creek, takes
    mud from the holy place, touches the stone, prays to it as father, applies mud
    to his head and face, and goes west to a hill to fast and mourn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: On the hill the father dreams of the same man, who tells him not to mourn
    or fast and says that later he will be told where to go and stay, and that the
    animals' lodge will be opened to him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: After several days without dreams, the father sleeps by the altar on a rainy
    stormy night and dreams that a man representing the stone tells him the time has
    come to go to a distant place where the animals' lodge is.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: After waking from the rainy-night dream, the father sees that the storm has
    passed, goes out, stands upon the lodge, and cries.
  category: action
  evidence_refs:
  - ev:6
