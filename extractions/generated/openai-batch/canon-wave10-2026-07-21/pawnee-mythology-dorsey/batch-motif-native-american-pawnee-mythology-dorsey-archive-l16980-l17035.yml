canonical_text:
  quote: ''
  summary: A poor boy has buffalo cow meat specially prepared and packed in a parfleche.
    Later he leads the chief's boy to Wonderful River, to a place previously indicated
    by the Bear. At a steep bank he ties and lowers the chief's boy with rawhide ropes,
    provides meat and a sharp stick, and instructs him to hang under the bank and
    feed birds. If the birds take him into their lodge within four days, it will show
    favor and possible acquisition of powers; otherwise the poor boy will retrieve
    him on the fifth day. The chief's boy agrees.
  language: English
  quote_policy: summarized
