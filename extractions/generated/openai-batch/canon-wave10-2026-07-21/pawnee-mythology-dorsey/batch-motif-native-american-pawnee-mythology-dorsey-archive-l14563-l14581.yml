  quote: ''
  summary: A man and a boy reach a Buffalo herd. The man calls out, selects a powerful
    young Buffalo with flint horns, and instructs the boy to follow it to a lodge;
    helpers are to process stone fragments knocked from the opponent. The boy follows
    the Buffalo to the lodge, where Stone-Man watches, threatens to kill the Buffalo
    and the young man, and arms himself with a bow.
  language: English
