canonical_text:
  quote: ''
  summary: The passage summarizes two Pawnee narratives. In the first, a medicine-man
    refuses his son, the son and mother perform water-related sleight-of-hand, the
    jealous father kills the son and throws him into a river, and animals at Pahuk
    restore the son, who later becomes leader of the medicine-lodge. In the second,
    a chief's son is deceived and abandoned near Pahuk, is aided by animals, receives
    animal powers, returns home, and causes his deceiver to be dragged under water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy is told it is time to join his father's medicine-lodge; he prays to
    be received, brings presents, and his father refuses.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother takes her bundle and arrows, and she and her son enter the lodge
    with downy feathers, a robe, and earth; later they enter singing about diving
    ducks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the creek, the mother and the boy perform with gourds in water; the gourds
    become soft down or ducks and then return to being gourds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The father, described as jealous and envious, takes his son away during a
    buffalo hunt, shoots him in the side with an arrow, throws him into the river,
    and later pretends ignorance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy's body floats downstream to an animals' lodge; animals carry him to
    Pahuk, remove the arrow, and beaver and otter restore him to life.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The animals send the restored boy home for tobacco, feathers, beads, and sweet
    grass, which his mother collects from sacred bundles in the village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boy tells his mother what his father did and gives her a water-dog test
    connected with whether the animals at Pahuk have eaten his father's intestines;
    after this, the boy becomes leader of the medicine-lodge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A man leads the chief's son to Pahuk, ties a rope around him, suspends him
    over a bank to collect eagle and woodpecker feathers, disappears, and the boy
    realizes he is pregnant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Animals carry the chief's son into their lodge; Buffalo and Elk jump over
    him, and Bear cuts him open, removes the bones of a child, and heals the wound.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Animals give or teach powers to the chief's son, including Snake's sunfish
    bone, Buffalo's whistle, Bear's dust for painting sick people, Eagle's flying,
    and Duck's swimming and diving.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Animals send Crow, Beaver, Otter, and Fox to four directions for food, and
    Owl, Buffalo, and two Crows accompany the boy back to his village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After returning, the chief's son receives presents, sends for his deceiver,
    takes him to a creek, touches the water, and the deceiver is dragged under and
    never seen again.
  category: sequence
  evidence_refs:
  - ev:8
