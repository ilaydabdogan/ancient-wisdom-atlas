  summary: The introduction summarizes a Pawnee account in which Wolf, sent by Wolf-Star,
    tries to steal people from Lightning, bringing mortality; Lightning's failure
    to sacrifice Wolf brings warfare and death. The author then discusses the absence
    of a connected Pawnee creation story, the likely ritual preservation and loss
    of origin material in Skidi sacred-bundle ceremonies, the role and loss of songs,
    and the editorial use of informant notes and abstracts.
