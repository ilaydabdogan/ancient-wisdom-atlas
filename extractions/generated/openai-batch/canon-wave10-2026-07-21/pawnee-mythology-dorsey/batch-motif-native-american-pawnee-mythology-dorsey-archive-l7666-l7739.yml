canonical_text:
  quote: ''
  summary: A poor boy receives dream instructions from a man standing on water, borrows
    a shield associated with another man's sun dreams, joins a war party despite rejection,
    kills an enemy and takes a scalp, returns uncredited, and later receives further
    stream-side dream instructions involving a three-day stay, four dives, and an
    encounter with the wonderful man's sister.
