canonical_text:
  quote: ''
  summary: A young man named Black-Eyes is refused by a village girl, leaves home
    with his bow and arrows, crosses a stream, and enters a Prairie Dog town. A Prairie
    Dog girl takes him into an underground lodge and marries him. His mother follows
    his footprints and tear-drops, laments in song, finds a hole where the tracks
    end, and dreams that the Prairie Dog wife tells her to bring her son's prized
    black arrow. When a boy Prairie Dog catches the arrow, he turns back into a boy,
    and his mother recovers him. The passage ends as he says he will return home but
    must take his wife with him.
  language: English
  quote_policy: summarized
