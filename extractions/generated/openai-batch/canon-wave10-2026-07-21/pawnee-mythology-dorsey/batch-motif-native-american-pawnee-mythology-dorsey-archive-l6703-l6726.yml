  quote: ''
  summary: An elder addresses a grandchild about celestial signs, the making of people
    by stars, and the future ending of the world through commands of the North Star
    and South Star. The passage then recalls a war-path ritual in which a man offers
    pipe smoke to heavenly beings and Tirawa before putting on items from a sacred
    bundle under priestly instruction.
