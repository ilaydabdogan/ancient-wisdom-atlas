  text: Old people are reported to have said that the Morning-Star and Evening-Star
    placed people upon the earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The North Star and South Star are said to end all things; the North Star gives
    the command and the South Star carries it out.
  category: relationship
  evidence_refs:
  - ev:2
