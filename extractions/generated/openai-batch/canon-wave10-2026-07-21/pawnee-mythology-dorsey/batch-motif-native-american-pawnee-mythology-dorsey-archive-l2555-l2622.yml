canonical_text:
  quote: ''
  summary: A war party is told to obtain and sacrifice a raccoon. One man finds, kills,
    and sanctifies a raccoon, and the group burns it in timber despite objections.
    Later the same man scouts ahead, is attacked by enemies revealed as Crows and
    Coyotes, and is left as if dead with scratches but no ordinary wounds. At night
    he awakens to unfamiliar black-painted dancers, one carrying a crow-feathered
    lance. They lead him to mountains and a high tree, where voices from the tree
    tell him not to forget who brought him there when Deer and Antelopes appear. A
    source note identifies the tale as the origin of the crow-lance standard of the
    Crow-Lance Dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The war-party leader tells the men to look for a raccoon and says they must
    sacrifice it before going far into enemy country.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: One man finds a raccoon sleeping on a tree, shoots it with an arrow, declares
    it holy, carries it back, and reports it to the leader.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The people go to timber and burn the raccoon as a sacrifice; some object that
    the raccoon should have been roasted and eaten, and some return home in fear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man who made the sacrifice is later sent as a scout and is attacked and
    killed by beings first described as enemies and then identified by scouts as Crows
