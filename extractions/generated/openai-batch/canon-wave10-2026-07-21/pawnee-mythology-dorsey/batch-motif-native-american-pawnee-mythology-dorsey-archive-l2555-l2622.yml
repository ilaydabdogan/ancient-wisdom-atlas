- id: obs:8
  text: The dancers take him through places in the mountains to a hollow with a high
    tree and tell him to lie down under the tree, where he sleeps.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the morning he sees Deer and later Antelopes; a voice from the tree tells
    him he may follow them if he wishes and then reminds him that the Crows brought
    him there, after which he remains at the tree.
  category: sequence
  evidence_refs:
  - ev:5
