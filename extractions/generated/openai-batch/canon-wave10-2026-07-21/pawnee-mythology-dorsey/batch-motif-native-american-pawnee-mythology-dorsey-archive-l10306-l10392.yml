canonical_text:
  quote: ''
  summary: A poor boy sleeps near a hill and encounters a young man of the Buffalo
    people, who promises that Buffalo people will send him calves and later larger
    buffalo. The boy is shown a hidden buffalo opening in a bank, kills the first
    calf, brings it home, and he and his grandmother begin to have and preserve meat.
    The boy tells his grandmother not to beg and to share meat with those who were
    kind. A girl from the hungry village visits, eats, and receives meat to take home.
  language: English
  quote_policy: summarized
