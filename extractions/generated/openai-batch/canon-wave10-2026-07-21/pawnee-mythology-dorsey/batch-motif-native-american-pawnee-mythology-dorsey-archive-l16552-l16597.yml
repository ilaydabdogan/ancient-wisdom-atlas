  quote: ''
  summary: A boy with a growing weight in his stomach follows Magpie to riverine animal
    lodges. Several animal groups cannot help him. As he weakens and returns to Pahuk,
    the animals say that only a powerful animal medicine-man who controls the animal
    lodges may be able to help, and Magpie volunteers to fetch him.
