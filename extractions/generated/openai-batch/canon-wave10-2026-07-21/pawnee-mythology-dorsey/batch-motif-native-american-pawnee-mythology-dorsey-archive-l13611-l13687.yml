canonical_text:
  quote: ''
  summary: 'The passage describes preparations for a new medicine lodge and ceremony:
    materials are gathered, a central circular lodge is built, hunting and harvest
    provisions are arranged, the man discloses the stone and instruction received
    from animals, and ritual cleaning and arranging of sage, beaver skin, stone, and
    bird skins in the lodge follows.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the fall, men cut forks and timber for a lodge circle, women brought elm-bark
    strips, willows were gathered, and the people later returned from a successful
    buffalo hunt with meat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man invited male relatives to his lodge, taught them medicine-men's songs,
    and told them about the lodge to be built.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Early in spring, a place in the center of the village was selected for the
    new lodge; ten forks were set in a circle and the lodge was completed around the
    time corn was planted.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before a buffalo hunt, old men held bundle ceremonies for hunting success,
    and the man instructed relatives to obtain snipe and crane skins and much buffalo
    meat for the new ceremony.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At night, the man invited chiefs and braves to his lodge and stated that his
    daughter had been killed by the heavens and that the thing that killed her was
    present.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The man placed a stone before the chiefs and braves and said he had talked
    with it in sleep for a long time and had done what it told him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The man said he had been placed on Swimming-Mound for several days, entered
    the animals' lodge with the stone's help, and received teachings and songs from
    animals.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The man said the animals told him to have sleight-of-hand performances in
    the lodge built with community help.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Buffalo meat was to be jerked, dried, packed in parfleches, and kept for the
    sleight-of-hand performances; the man also expected plentiful corn and meat after
    return to the village.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the people returned to the village, women gathered corn to cure, fires
    were made to roast corn, and the man selected two young men as errand men.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The two errand men were told to wear robes with the hair outside and to sweep
    the lodge with eagle wings and brushes of wild sage.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Wild sage was piled in the west inside the lodge; a beaver skin was placed
    on the sage, the stone was put in front of the beaver, and the remaining sage
    was spread around the lodge circle.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Bird skins mounted on crossed sticks were hung in the west, north, east, and
    south of the lodge, with smaller snipe hung around the lodge.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that there was something wonderful about the birds, which
    medicine-men saw and heard afterward.
  category: attribute
  evidence_refs:
  - ev:8
