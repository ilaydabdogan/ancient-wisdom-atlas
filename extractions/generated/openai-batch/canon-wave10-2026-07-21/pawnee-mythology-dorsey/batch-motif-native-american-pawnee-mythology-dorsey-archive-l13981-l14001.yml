  summary: A poor elderly couple living east of the village in a grass-lodge find
    a baby boy after a bird falls into grass gathered by the woman. They care for
    him despite having no food, lay him by the fire, and he grows quickly. The boy
    asks for bows and arrows, then for a spider-web ring made from the woman's robe,
    which is rolled for him as a shooting target.
