canonical_text:
  quote: ''
  summary: A poor boy brings water to a lodge and leaves without being fed. The chief's
    daughter searches for him, finds him by his pony, declares that he will be her
    husband, gathers tools and weapons at his request, and hides with him near the
    village. During later enemy attacks, the pony speaks to the boy, urges him into
    battle, helps conceal recognition, and gives him red clay. The boy repeatedly
    performs successful war deeds. After the village rejoices and prepares to move
    camp, the couple returns openly; the chief approves because the boy has shown
    himself a great warrior.
  language: English
  quote_policy: summarized
