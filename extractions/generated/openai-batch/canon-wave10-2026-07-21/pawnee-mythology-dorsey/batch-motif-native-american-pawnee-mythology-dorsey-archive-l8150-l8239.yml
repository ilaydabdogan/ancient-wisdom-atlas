canonical_text:
  quote: ''
  summary: 'The passage closes an episode in which Burnt-Belly-Boy directs the people
    to food and buffalo, receives a new tipi, and lives with his wife and grandmother.
    It then begins the tale of Young-Duck: a hunter observes and releases a young
    duck, his wife gives birth to a girl named Young-Duck, and the girl develops strong
    affinities with ponds and water. She makes a water-filled pool inside the tipi,
    is washed with its sweet-smelling water, receives dream instructions, and uses
    a hooked stick and carrying strings to gather wood in an extraordinary way.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Burnt-Belly-Boy says through his wife that he will bring buffalo near so the
    people can kill them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Burnt-Belly-Boy asks the chief to have the crier summon the people, and the
    people follow him into thick timber where they find animals, nests, beans, and
    pecans for food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After helping the people kill deer and small game, Burnt-Belly-Boy tells them
    to go west, where they find and kill many buffalo.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people bring meat to Burnt-Belly-Boy's lodge, and he is given a new tipi
    where he places his grandmother and lives with his wife.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man who hunts along streams sees a young duck diving around ponds and carrying
    weeds, catches it, keeps it briefly, and releases it after his wife tells him
    to do so.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman gives birth to a child named Young-Duck, and as the girl grows her
    parents notice that she has mysterious ways and likes ponds and water.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The mother says the child is like the duck because the father watched and
    brought the duck home before the child was born.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Young-Duck digs a small bowl-sized hole in the west part of the tipi, brings
    flag roots and peppermint from the ponds, plants them in the hole, and water appears
    in it the next day.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Young-Duck tells her mother to wash her face and head every day with water
    from the pool, and says she will sit upon the pool when not doing anything.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The mother finds that the pool water smells sweet, washes Young-Duck with
    it, and Young-Duck becomes very pretty with hair reaching to her knees.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Young-Duck has dreams in which a voice tells her what to do.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Young-Duck comes back from the ponds with a hooked stick, rawhide carrying-strings,
