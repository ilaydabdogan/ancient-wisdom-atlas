canonical_text:
  quote: ''
  summary: A young man awakens by a lake and is joined by a speaking black Horse,
    which says it will go home with him. The Horse instructs him to eat grass, circles
    him each day to remove tiredness, and brings him to his father's village. The
    boy returns to his parents' lodge, says he cannot stay and must go back, and asks
    his father to tell his brothers he wants several items including tobacco, beads,
    a handkerchief, and sweet grass; the passage ends mid-list.
