canonical_text:
  quote: ''
  summary: The passage describes a carved giant thigh bone kept as a ceremonial medicine
    object, received through dreams and songs, used on an altar, and credited with
    curing or preventing illness. It then begins another account in which Tirawa destroys
    an earlier race of powerful giants by rain, water, thunder, and lightning; their
    bodies become roots or bones with curative power for later people, and the Big-Black-Meteoric-Star
    later reveals where to find the roots.
  language: English
  quote_policy: summarized
