canonical_text:
  quote: ''
  summary: The passage introduces a group of Pawnee sacred stories called true accounts
    of heavenly beings, explains their ceremonial settings and conditions of narration,
    and begins the tale “Origin of the Chaui,” in which Tirawa creates the cosmos,
    speaks a woman into existence, and consults the gods in the heavens. A source
    note identifies Roaming-Chief as teller and links the tale to a sacred altar bundle
    and buffalo-meat offerings.
  language: English
  quote_policy: summarized
