  text: The tales are usually told during ceremonies, especially during intermissions,
    pauses between rites, or resting periods in long ritual chanting.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Those present may ask priests for a tale, and the person who made the ceremony
