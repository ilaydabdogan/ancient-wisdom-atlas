canonical_text:
  quote: ''
  summary: An impoverished, mistreated boy is repeatedly left behind and abused, especially
    by a chief's daughter. A crippled horse left behind with him proves to be a speaking
    helper that deliberately lamed itself to join him. The boy and horse grow strong;
    the horse instructs him concerning the chief's daughter. The daughter comes to
    desire him, runs away with him, and they make a home in timber. Warned by his
    horse of enemy attacks, the boy returns to the village and repeatedly helps secure
    victory. His wife later enters the village gaily dressed, and the chief rejoices
    that his daughter married the poor boy. The supplied line range ends with the
    beginning of a following heading.
  language: English
  quote_policy: summarized
