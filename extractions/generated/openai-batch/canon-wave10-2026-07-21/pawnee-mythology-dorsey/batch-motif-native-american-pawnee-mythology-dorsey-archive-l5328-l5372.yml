canonical_text:
  quote: "“You shall be called ‘Whipping-Feather.’”"
  summary: A boy obtains items including tobacco for a strange being. Outside the
    village, he gives the items to the being, who gives him a fox-skin cap with an
    eagle feather, names him Whipping-Feather, and says he will later travel as the
    being does and meet him driving Buffalo. The boy then directs his parents to food,
    distributes ground beans and deer meat to the people, hosts leaders, and causes
    the people to learn that Buffalo are near the camp and kill them.
  language: English
  quote_policy: quoted
