    a buffalo robe painted with stars, dark clouds, lightning, the sun, the moon,
    swallows, and gadflies. A source note says the tale was told to children as a
    warning not to meddle with ceremonial or religious objects or with objects belonging
    to others; it also notes Pawnee variants and a version in which Coyote replaces
    Witch-Woman.
