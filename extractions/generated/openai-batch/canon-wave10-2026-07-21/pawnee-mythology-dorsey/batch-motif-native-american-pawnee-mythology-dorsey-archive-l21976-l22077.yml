canonical_text:
  quote: ''
  summary: The passage contains the end of a Coyote and rolling stone tale and a Coyote
    and rolling skull tale. In the first, Bull-Bats first protect Coyote from a rolling
    stone, but after he mocks them they restore the stone and send it after him, and
    it kills him. In the second, Coyote disturbs or challenges a singing skull on
    a prairie; the skull pursues and devours him and others. Four girls flee, three
    are killed after throwing pack strings that become obstacles, and the youngest
    is guided to Milk-Weed, who kills the skull with a blue bead blown from his mouth.
    A note states that the skull story teaches children not to abuse skulls because
    skulls have supernatural power.
  language: English
  quote_policy: summarized
