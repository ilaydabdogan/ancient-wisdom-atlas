canonical_text:
  quote: ''
  summary: In a Coyote tale passage, animal-named figures are summoned to look for
    buffalo. Dragging-the-Stone joins the hunt on Old-Woman-Coyote's horse after decorating
    the horse and himself. During the hunt he kills the horse after it sexually assaults
    him, receives a buffalo kill from another man, and disputes the carcass with a
    giant. The giant blows him away with his breath, but a Coyote figure continues
    the fight until the giant leaves. The people become afraid of Dragging-the-Stone
    and later honor him at a feast, proposing him as chief; the excerpt ends during
    his reply.
  language: English
