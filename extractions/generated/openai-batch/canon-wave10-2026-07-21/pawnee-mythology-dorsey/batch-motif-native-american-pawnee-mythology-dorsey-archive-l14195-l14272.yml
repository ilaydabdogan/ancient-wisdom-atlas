canonical_text:
  quote: ''
  summary: Burnt-Belly directs a communal buffalo hunt and produces abundant fat meat
    by pulling hairs from buffalo. Crow-Feathers kills only a poor bull, envies Burnt-Belly,
    and later dies after trying to kill him. Stone-Man blocks Burnt-Belly's wife at
    the creek and forcibly drinks from her bucket. Burnt-Belly confronts Stone-Man,
    but his arrows fly back and his animal power seems to depart. Stone-Man goes west
    with his wife, makes the buffalo go west so the people lack meat, builds an earth-lodge,
    places a fine stone in its western side, and later remains with his daughter after
    his wife dies.
  language: English
  quote_policy: summarized
