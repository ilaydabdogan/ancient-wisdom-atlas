  quote: ''
  summary: A boy returns home carrying things given by a mysterious man. He travels
    without tiring and runs faster each day. Near camp he hears his father crying
    on a high hill, reveals himself, and tells his father not to touch him for a while.
    They go toward camp, where his mother is also crying, and the father goes to tell
    her that her son has returned.
