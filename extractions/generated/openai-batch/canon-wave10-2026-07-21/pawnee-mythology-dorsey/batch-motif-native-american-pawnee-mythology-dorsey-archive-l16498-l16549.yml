canonical_text:
  quote: ''
  summary: A boy experiences frightening sights and sensations, loses consciousness,
    and awakens in an animal lodge. The Beavers are described as leaders of the lodge's
    medicine-men, while the Magpie acts as messenger and advocate. The Magpie explains
    that the boy has a growing ball of clay in his stomach from a previous meal involving
    buffalo-hide scrapings, white clay, and medicine. The animals are asked to pity
    him. The Beavers attempt a cure with ritual movements, water, mouth contact, and
    grunting, but fail. The animals decide the boy should be taken to another animal
    lodge farther up the Platte River, and the Magpie offers to take him.
  language: English
