canonical_text:
  quote: ''
  summary: A kind young son of a chief lives in a village on the Republican River.
    An unnamed man invites him on a long journey to a far-away country. They reach
    Pahuk, where the man lowers the boy by a lariat over a steep bank to collect eagle
    and woodpecker feathers. The man leaves him there. The boy, who has become pregnant
    during the journey and is near giving birth, cries for help until exhausted and
    falls asleep. A note states that the story teaches that animals cannot be deceived
    and that betraying a friend has dire consequences.
