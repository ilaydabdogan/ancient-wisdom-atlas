canonical_text:
  quote: "“After that the boy became the leader of the medicine-lodge and taught the
    people what the animals had taught him.”"
  summary: A boy killed by his father is carried by water animals to Pahuk, revived
    by Beaver and Otter, and sent back to request ritual objects. He returns to his
    mother, reveals his father’s act, gives her a water-dog test that confirms the
    father’s insides have been eaten by beings at Pahuk, and later becomes leader
    of the medicine-lodge, teaching what the animals taught him.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The boy’s body drifted downstream with Beaver on one side, Otter on the other,
    Mink heading the procession, and other animals swimming behind.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Pahuk, the boy was taken into a lodge, placed on the ground, had the arrow
    removed, and was brought to life through the powers of Beaver and Otter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The animals told the boy to return to his people and ask for native tobacco,
    eagle feathers, blue beads, and sweet-smelling grass.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy returned to his mother, who first interpreted his appearance as a
    dream, then touched him, made a fire, and seated him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The people opened their sacred bundles and brought the requested objects to
    the boy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boy later returned again and stayed with his mother for some time; his
    father visited, but the boy had little to do with him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy told his mother that his father shot him with an arrow, killed him,
    carried him to a stream, and threw him in for underwater animals to eat.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boy told his mother to dip a little water-dog into the stream; a piece
    of liver in its mouth would show that the people at Pahuk had eaten his father’s
    insides.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mother dipped the little animal’s nose into the stream and found a little
    piece of liver in its mouth; she also saw heaving water, entrails, and blood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The boy placed the little animal near the fireplace, gave it smoke and tobacco,
    and put it back in the bundle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The boy became leader of the medicine-lodge and taught the people what the
    animals had taught him rather than what his father had taught him.
  category: action
  evidence_refs:
  - ev:7
