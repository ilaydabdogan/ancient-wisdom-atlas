canonical_text:
  quote: ''
  summary: A Buffalo goes along a path to big water and sits in the water. The boy
    returns to the bank, where Wind instructs him to remove and bundle his clothing
    and gear, wade into the water, and begin a journey. When the water reaches the
    boy's arms, Wind blows down, lifts him, and carries him to a destination. Wind
    tells him to leave his things, go by the north side, and enter the far east lodge,
    where four gods in the west will teach him many things. The boy leaves his things
    and goes west toward the lodge.
