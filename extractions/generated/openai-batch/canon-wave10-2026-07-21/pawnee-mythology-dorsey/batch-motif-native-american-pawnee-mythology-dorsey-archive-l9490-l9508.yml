canonical_text:
  quote: ''
  summary: A boy searches villages for his mother by singing about her and is finally
    told she is present. The father returns to find the family missing, follows the
    boy through a passage into the under-world, and reaches the same village. Hawk
    touches his wife and son, turning them into Hawks, then becomes a Hawk himself.
    He catches and eats the little snake that had taken his wife, after which they
    become snake hawks.
