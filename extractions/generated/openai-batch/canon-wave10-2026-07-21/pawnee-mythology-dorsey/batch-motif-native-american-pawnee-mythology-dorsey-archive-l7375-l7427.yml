canonical_text:
  quote: ''
  summary: The father gives the boys conflicting directions about a dangerous place
    associated with their mother's killers and tries unsuccessfully to leave. Later,
    the strange boy persuades Handsome-Boy to go there. They enter timber with dead-looking
    yellow-leaved trees and find a grass-lodge of sharp-elbow people, who greet them
    as grandchildren and prepare a kettle. The strange boy warns Handsome-Boy not
    to cry and gives instructions for escaping when the people try to kill them.
  language: English
