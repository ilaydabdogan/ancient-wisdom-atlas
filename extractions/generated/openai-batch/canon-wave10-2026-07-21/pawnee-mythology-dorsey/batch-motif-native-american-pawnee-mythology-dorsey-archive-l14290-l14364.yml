canonical_text:
  quote: ''
  summary: Two hungry men arrive at Stone-Man's lodge and report that Animal-Boy disappeared
    after losing his wife. Stone-Man feeds them, sends them back with dry meat, and
    invites their people to come west where there are many buffalo. The people come,
    receive meat, and Stone-Man selects a handsome young man as husband for his daughter.
    After the young man accepts, Stone-Man seats him beside the girl but later says
    he is not married to her and that they must play the hoop game inside the lodge.
    Stone-Man uses the game to throw him into a hot hole or boiling water, then repeats
    this treatment with other selected sons-in-law while promising buffalo to the
    people.
  language: English
  quote_policy: summarized
