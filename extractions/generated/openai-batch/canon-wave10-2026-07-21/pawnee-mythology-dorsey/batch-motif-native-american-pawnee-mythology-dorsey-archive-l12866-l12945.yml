canonical_text:
  quote: ''
  summary: A poor young man and a chief's daughter leave their home and settle near
    ponds at Pahuk. The woman finds two young Loons, who begin speaking like children,
    call the couple father and mother, and live with them. The Loons promise the couple
    power to doctor the sick and lead the man to a nocturnal pond display involving
    sparks of fire from the water, circling waterfowl, swans drumming on the water,
    and ducks forming a downy feather that grows to resemble an earth-lodge before
    being distributed among the fowls.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief said the poor boy should be killed if he returned, because a poor
    boy had no right to marry the chief's daughter.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The poor boy and the girl traveled south, then east along the Platte River,
    and reached the swampy country known as Pahuk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man built a grass-lodge near a lake in the forest and hunted game
    for food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wife went to a pond for water, saw a Loon fly from the bank, and later
    found two little Loons near the pond.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman repeatedly tried to catch the two little Loons, but they swam away
    into the water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: One morning the couple heard voices like children outside asking why their
    mother did not come for water.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The woman saw the little Loons going toward the pond, later picked them up
    when they swam to her, and carried them to the lodge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Loons came every night; the woman lay with one and the man with the other,
    and in the morning the Loons woke them to go swim in the pond.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Loons called the man father and the woman mother, said the woman could
    not have children, and promised to give the couple power to doctor the sick.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Loons instructed the man to follow them to the pond while the woman remained
    behind.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the pond the Loons struck the water and made a great noise, and the man
    saw something like sparks of fire rising from the water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Waterfowl circled the pond with the young Loons in the lead, while two big
    swans on each side flapped their wings on the water and made a drumming sound.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Two little Ducks placed downy feathers at the center of the pond; the feather-form
    grew and changed until it looked like an earth-lodge on the pond.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The other fowls each took a piece of the downy feather until it was gone,
    after which the noise ceased and the fire died down.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:15
  text: After the pond event, the young Loons returned to the grass-lodge with the
    man and continued their morning swimming routine.
  category: sequence
  evidence_refs:
  - ev:9
