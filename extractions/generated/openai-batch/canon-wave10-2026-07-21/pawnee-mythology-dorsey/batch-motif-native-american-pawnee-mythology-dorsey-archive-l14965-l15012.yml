canonical_text:
  quote: ''
  summary: A young man is suspended over a bank, sees fire in the water, loses consciousness,
    and is taken into an animals' lodge. The animals explain that Elk controls the
    lodge and give him powers meant to be reported to the homely young man. After
    returning to the bank, he honestly tells the homely young man what he learned.
    The homely young man shares his own power through a sacred bundle containing a
    flute, red paint, root, and elk-hide strings, with instructions for their use.
  language: English
  quote_policy: summarized
