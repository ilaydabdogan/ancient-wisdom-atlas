  quote: ''
  summary: A man hides in a lodge to catch a boy, but the boy smells the father’s
    presence and runs into the timber. The man prepares buckskin strings and gives
    instructions for tying them to hair. The strange boy repeatedly visits Handsome-Boy;
    the boys play, eat, drink, and look for lice in one another’s hair. During one
    lice-picking episode, Handsome-Boy ties a bunch of hair on the strange boy’s head
    very tightly with the buckskin strings, while the boy tries to jump up and run
    away. The supplied passage ends mid-action.
