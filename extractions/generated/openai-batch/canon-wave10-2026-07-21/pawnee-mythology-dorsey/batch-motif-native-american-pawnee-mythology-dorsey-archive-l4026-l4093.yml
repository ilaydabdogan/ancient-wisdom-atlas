canonical_text:
  quote: ''
  summary: A boy hides in a tree above Buffalo. Drops from his robe reveal him, and
    the Buffalo attempt to knock down or cut away the tree. The boy cries out; his
    grandmother releases the bob-tailed dog Afraid-of-Nothing, who leads dogs and
    the grandmother to him. The dogs and grandmother attack and kill many Buffalo,
    and the tree falls without hurting the boy. The boy directs his grandmother to
    eat buffalo meat rather than people, gives her seeds and a buffalo-shoulder-blade
    hoe, sends her north, frees the dogs, and departs south toward the land of the
    Sun as a great warrior.
  language: English
  quote_policy: summarized
