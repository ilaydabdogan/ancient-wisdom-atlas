canonical_text:
  quote: ''
  summary: Rabbit loses his tail when it catches on a willow limb beside a creek.
    Turtle tells him where to find it, explains that willows will bear white fur or
    burrs at their ends as a sign of the event, and replaces Rabbit's tail. The passage
    then begins a separate tale in which White Rat and Black Rat, described as the
    first two Rats on earth, travel in opposite directions while seeking food and
    meet Magpie.
  language: English
  quote_policy: summarized
