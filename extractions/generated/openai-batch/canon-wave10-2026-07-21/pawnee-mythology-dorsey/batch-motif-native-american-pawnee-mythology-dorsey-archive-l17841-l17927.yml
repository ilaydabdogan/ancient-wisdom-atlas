canonical_text:
  quote: ''
  summary: 'The passage concludes an account of a young man with Buffalo and horse-related
    powers: a killed brother-in-law is restored, the young man uses a lariat to bring
    a storm against enemies, opens the earth with a spear to divide battle lines,
    and later dies after his brother-in-law violates a rule about the two horses fighting
    in the same battle. His wife preserves a powerful black lariat and Buffalo dance
    items for their children, and a son becomes a medicine-man who performs the Wild-Horse
    dance. The passage then begins an origin account for the Buffalo Ceremony, in
    which Howling-Fox watches gambling-stick games, hears unseen underground footsteps
    moving east and west, and dreams of an evil one who addresses him.'
  language: English
  quote_policy: summarized
