    continued to follow Diving-Duck.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Diving-Duck dived into a stream of water; the fire struck the water and went
    out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Diving-Duck gave the baby-board to a man, who carried it to the boy; the boy
    took it to the tipi, where a priest placed it on the west side of the lodge.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The girl told the boy to get otter strings for tying the baby; another man
    helped him, and the strings were placed in front of the girl.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The girl next told the boy to go south and bring a piece of robe for the baby
    to lie upon; the boy cried as he left.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Morning-Star addressed the boy as his son, provided an arrow, and instructed
    him how to shoot a buffalo.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The buffalo charged, and the boy stepped aside and shot it in the heart; they
    removed skin from the back, and the boy took it to the lodge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The boy obtained a wild-cat hide with help from the Hawks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The girl told the boy to come to her bedside at night and to stay outside
    until night.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: On the first night, the boy heard a whizzing sound, recognized it as a serpent,
    and killed the snake by touching it with a moccasin containing the Morning-Star
    symbol.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: After the serpent was killed, the girl told the boy he could not come to her
    that night but could come the next night.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: On the next night, the girl touched the ground with a war club, and two bears
    came and tried to kill the boy in the lodge; the passage ends as the boy waves
    the Morning-Star symbol.
  category: action
  evidence_refs:
