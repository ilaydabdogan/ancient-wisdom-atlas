canonical_text:
  quote: ''
  summary: A sequence of helpers and animal helpers retrieve a baby-board and associated
    materials for a boy at a lodge. Magpie and Diving-Duck carry the baby-board while
    pursued by fire, which is extinguished in water. The girl assigns further tasks
    involving otter strings, a robe or buffalo skin, and a wild-cat hide. Morning-Star
    helps the boy kill a buffalo and is linked with a protective symbol in the boy's
    moccasin. At night the boy faces a serpent and then two bears after the girl uses
    a war club.
  language: English
  quote_policy: summarized
