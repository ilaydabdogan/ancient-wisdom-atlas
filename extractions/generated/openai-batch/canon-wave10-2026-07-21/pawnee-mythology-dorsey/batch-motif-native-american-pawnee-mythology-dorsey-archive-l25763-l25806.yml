canonical_text:
  quote: ''
  summary: The passage summarizes one narrative in which two hermaphrodites kill a
    strange man, a boy counts coup on him, receives visions from him as Thunder-Bird
    or crane, learns ceremony, and performs in the medicine lodge. It then begins
    the abstract of “Proud Boy and the Animal Medicine,” describing a medicine-lodge
    tree ceremony, a girl who repeatedly wins races, and Proud Boy’s desire to marry
    her because of her power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two hermaphrodites digging artichokes see a strange man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One of the hermaphrodites slips behind the strange man and kills him with
    a hoe, and they return home to tell what happened.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: People find the dead man with painted face and bloody head as though scalped,
    and they dance a scalp dance that night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A grandfather leads his young grandson to the dead man so the boy can count
    coup; downy feathers and the scalp-lock are removed, and the scalp-lock is fastened
    to a pole before the lodge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The boy dreams of the man, who says he is Thunder-Bird; the boy sees a great
    crane-like bird talking to him, and the bird becomes a man again and promises
    power.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boy throws away the scalp but keeps a feather and carries it with him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: During a buffalo hunt the boy sees the man in a vision, is told to visit him,
    leaves the feather on a tree, and sees the man by a pond turning into a crane
    and back into a man.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The man takes the boy to a cleared place with an altar in the west, a bird,
    and Bird-That-Never-Moves in the south, and teaches him ceremony and sleight-of-hand
    performances for several days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: When the boy returns toward his village, he encounters his father crying on
    a hill and then his mother mourning, and he asks that neither parent touch him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: During a hunt the boy directs that many buffalo be killed and prepared for
    ceremony; he enters the medicine-men’s lodge with his bundle, is painted with
    blue clay, receives offerings, and is seated in the south.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: 'The boy performs wonders before becoming a medicine-man: he turns a downy
    feather into Thunder-Bird, makes a skull and places it in the east, and makes
    Thunder-Bird and the sun crane in the south disappear.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: At the boy’s request his friends prepare a medicine-lodge, and he gives a
    ceremony called the elk dance because a large crane in the west has head feathers
    like deer antlers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: Three bands of Pawnee unite in a great medicine-lodge and form a procession
    to obtain a tree for the lodge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: A poor boy later known as Proud Boy loves the daughter of a leading man, but
    she pays no attention to him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: Scouts report that an enemy is near the selected tree; an old warrior is sent
    to kill him, and the girl is selected to cut the tree.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: On the return to the village with the tree, a race is held and the girl wins;
    the prize is that she may live with the priest until the end of the season.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:17
  text: The following year the ceremony is repeated; Proud Boy receives only a waistband
    from his father, and the girl again wins after a disputed race is postponed and
    her father prepares a painted buffalo calf robe for her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:18
  text: Proud Boy’s determination to marry the girl increases because he knows she
    possesses wonderful power; for winning the race she receives red ointment and
    lives with the priest.
  category: relationship
  evidence_refs:
  - ev:6
