canonical_text:
  quote: ''
  summary: The passage spans tale boundaries. In one Coyote-and-Bear episode, Coyote’s
    songs make Bear think Coyote has extraordinary power over waters, trees, hills,
    and sunlight, but Bear later tests him at a fire, realizes Coyote is afraid, and
    kills him. In another Coyote-and-Bear tale, Bear breaks Coyote’s weak bow; Coyote
    invokes Father Sun, frightens Bear into making replacement bows, accepts a fine
    plum-tree bow, and flees to the prairie. The passage then begins a Turkey tale
    in which Coyote claims he will teach Turkey ritual fires and offerings to heavenly
    gods while secretly planning to kill and eat him.
  language: English
