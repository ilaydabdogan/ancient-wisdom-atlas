canonical_text:
  quote: ''
  summary: A powerful Bear, described as leader of the Bears and son of the Sun, pities
    a boy, teaches him bear songs, transformations, sleight-of-hand, and curative
    power. The Bear family demonstrates wounding and restoration to life, changes
    between bear and human forms, makes the boy one of them, gives him a bear-claw
    necklace and medicine power through breath and colored dust, instructs him to
    seek an animals' lodge on the Wonderful River to learn as a medicine-man, and
    sends him home with a small bundle that his parents preserve in the tipi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bear is described as leader of all the Bears, as directly communicating
    with the Sun, and as the son of the Sun.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bear says he will pity the boy, send him back to his people, warn the
    people not to try to kill him, place him in the Bears' lodge on the north side
    facing south, and teach him sleight-of-hand.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: While singing Bear songs, the Bear changes the cubs, the mother Bear, and
    himself into human beings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bear first shoots at the boy without piercing him, then blows different
    colored dusts on the boy's side and shoots an arrow through him; the Bear family
    works over the boy and restores him to life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: For several days the boy remains in the Bear's den learning the secrets of
    the Bear.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bear tells the boy that he is now one of the Bears and must visit him
    from time to time.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Bear family and the boy are changed back into Bears, and the boy is then
    changed into a human being again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At a cedar tree the Bear takes down a bear claw, strings it on buckskin, and
    places it around the boy's neck.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Bear tells the boy to put his breath into the Bear's breath and says the
    boy now has curative colored dust in him, the spirit of the Bear, for healing
    wounds or sores by touching his sides, blowing his breath, and producing dust.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Bear warns that if people anger the boy, the boy's canine teeth may come
    out like the Bear's, so he must be careful among his people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Bear gives the boy his power, calls him his son, links the boy's lifespan
    and death to the Bear's, and directs him to an animals' lodge under a steep bank
    on the Wonderful River to learn to be a medicine-man.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The boy leaves the cave at night, returns home, and lies down; his parents
    notice a small bundle, treat it as meaningful, wrap it in a robe, and hang it
    on the side of the tipi.
  category: sequence
  evidence_refs:
  - ev:6
