canonical_text:
  quote: ''
  summary: A man returns to the lodge place and hears a little bird singing that it
    knows where his niece is. The bird says the niece is about to play the twin-ball
    game with Spider-Woman, who will kill her if she wins. The man asks the bird to
    lead him. The bird flies east, while the man uses balls and a stick to fly. At
    the timber the bird tells him he can hear his niece crying; he listens, hears
    her, finds her, and says he has come to protect her and that she will kill Spider-Woman
    by using her own twin balls.
  language: English
