canonical_text:
  quote: ''
  summary: An unnamed man remains crying on a mound beside a stone said to have come
    from the heavens. Animal-associated beings connected with Elk, Eagles, river animals,
    and Bear urge him to leave or remove the stone because it brings rain, lightning,
    and danger to their people or children. The stone displays many colors and green
    or bright light, giving the man courage during frightening nocturnal encounters.
    A bear-like man finally turns into a Bear and departs; storm clouds gather without
    thunder or lightning.
  language: English
  quote_policy: summarized
