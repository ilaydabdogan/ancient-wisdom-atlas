- id: obs:2
  text: A red-painted man with downy feathers, a reed whistle, and an elk skin addresses
    the man as his son, says the Elks obey him, and offers a robe, whistle, and great
    power if the man leaves and removes the stone.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The red-painted Elk-associated speaker says the stone came from the heavens
    and draws lightning that will kill many of his people if left on the mound.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Many Eagles fly overhead and light around the man; another feathered, clay-covered
