  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A loud noise approaches from the timbered country; the man sees the stone
    give bright light, and a strange bear-like man appears.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The bear-like man has a bear robe, bears' claws around his ankles, a red-painted
    face, and two tusks, and his breath produces different colored dusts that the
    stone's light dispels.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The bear-like speaker says the mound is his lodge, that he lives there with
