canonical_text:
  quote: ''
  summary: A warrior directs a boy to throw ponies into creek water, after which the
    warrior loses his power; the passage says the mud ponies should have been kept
    on dry land in a cave. A related sleight-of-hand ceremony lasts several days,
    and its participants are called medicine-men or stone-medicine-men. Later, during
    a hunt, the owner of a covered stone brings it with him. The Pawnee/Kitkehahki
    are surrounded by enemies, a messenger seeks Potawatami aid, and twenty Potawatami
    men with medicine-bags fight the enemy, place hearts in their bags, put blood
    on their faces and guns, frighten the enemy, and save survivors.
  language: English
  quote_policy: summarized
