canonical_text:
  quote: ''
  summary: 'The passage summarizes several Pawnee myth abstracts: a girl joins her
    star brothers and becomes the seventh Pleiad; a poor boy dreams of ponies, receives
    a song and dance from Tirawa, and his mud ponies become living animals; buffalo
    bring a sacred bundle and a calf becomes a boy who teaches bundle rites; the last
    white buffalo are associated with sacred bundles; and a warrior encounters the
    girl who died and was buried while he was away.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl discovers that her brothers disappear at night and return in the morning;
    the abstract states that they are stars and that she becomes the seventh of the
    Pleiades.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A poor boy in a village is befriended only by the chief, dreams of two ponies,
    makes small mud ponies, carries and hides them, and treats them as living by giving
    them food and drink.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: While sleeping in the chief's lodge, the boy dreams again, hears Tirawa singing,
    repeats the song on a hill, and is told that Tirawa has given him a dance, that
    he will be chief, and that his ponies will live.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mud ponies are found as living animals; the boy leads them to the village,
    where people revere them as the first ever seen.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The poor boy marries the chief's daughter, goes to war on one of the ponies,
    returns victorious, and founds a chief's society.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: White Spot, a buffalo leader, takes a white cow and calf; the calf carries
    a bundle and decides the distance of each day's journey.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The buffalo visit people, give them buffalo that are made holy, and the abstract
    reports the capture of a bundle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A little calf is disowned by the figure it claims as mother, says her milk
    will turn black and that there will be no more white buffalo, then returns to
    the people's village, becomes a boy, grows up, and takes charge of the buffalo
    bundle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The calf-boy explains ritual uses of fat, pipe, meat fork, and enemy arrows
    as pipe tampers in offerings to Tirawa; he says fingers should not be used because
    that would make the people offer themselves.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: In a related abstract, a disowned little white calf turns brown; later a white
    buffalo bull and cow are found, their robes are used in sacred bundles, and no
    white buffalo are seen after that.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A young man repeatedly goes on the war-path; while he is away, the girl who
    loves him becomes sick, dies, and is buried on a hill on a platform covered with
    a small mound.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: After returning victorious and mourning at the grave, the young man enters
    a lodge from which smoke issues and sees the buried girl surrounded by her belongings;
    he stays overnight but, at her request, does not approach her.
  category: sequence
  evidence_refs:
  - ev:10
