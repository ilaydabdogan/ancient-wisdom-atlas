canonical_text:
  quote: ''
  summary: A returned boy forbids his mother to touch him and asks his parents to
    keep his return secret. He directs the preparation of dried buffalo meat, enters
    the medicine-lodge with a small bundle and offerings, receives a seat among the
    medicine-men, performs wonders, manifests a thunder-bird, skull, and cranes, and
    founds a lodge ceremony later called the Elk dance. The passage then begins the
    Karipiro bundle ceremony, describing inter-band invitations, sacred bundles, ritual
    songs, and a tree used as the center pole of the ceremonial lodge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy has come back, tells his mother not to touch him, asks his parents
    not to let others know, and refuses to answer visitors' questions about where
    he had been.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy tells his father to kill many buffalo so that dried meat can be taken
    to the medicine-man's lodge; relatives kill buffalo and dry the meat.
  category: action
  evidence_refs:
