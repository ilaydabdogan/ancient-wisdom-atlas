canonical_text:
  quote: ''
  summary: A young man, aided by Beavers, enters a diving contest with an old cannibal
    witch-woman, survives by hiding in the Beavers' underwater lodge, and returns
    after the witch emerges first. His side kills the witch and her supporters, and
    the passage explains springs near stream banks as coming from the witch's trampled
    body. The next tale begins with Coyote/Hoof-Shield and Spider-Woman in a hungry
    village; Coyote eats pieces of his wife's buffalo-skin garment, then follows the
    smell of burnt beef to a tipi where a young girl promises food when her brothers
    arrive.
  language: English
  quote_policy: summarized
