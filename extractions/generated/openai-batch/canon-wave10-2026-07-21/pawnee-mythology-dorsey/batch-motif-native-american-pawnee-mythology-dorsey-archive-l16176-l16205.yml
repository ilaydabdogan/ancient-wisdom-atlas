canonical_text:
  quote: ''
  summary: After completing his lodge, Proud-Boy decorates his pony with red clay
    and eagle feathers, dresses himself, takes an eagle fan, and repeatedly rides
    to watch arriving tribes for the girl he loves. On each occasion he does not find
    her. Later he rides around the village and sees people gathered at a distance
    around his tipi, admiring its pictures; the passage says it was the first tipi
    with pictures seen among the Kitkehahki.
