canonical_text:
  quote: ''
  summary: 'The passage contains abstracted Pawnee narratives: a boy aided in obtaining
    buffalo and marrying a chief''s youngest daughter; Buffalo seeking Red-Spider-Woman''s
    daughter and causing Red-Spider-Woman''s death and transformation into medicine;
    buffalo and deer precedents for consecration; a bundle-carrying buffalo chief''s
    daughter who gives birth to a singing calf; Coyote encounters involving hunger,
    song, and hunting luck; and a girl whose corn mush offering sustains priests''
    bundle ceremony and improves the hunt.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy is instructed to shoot a calf, brings home progressively larger buffalo,
    and his grandmother dries and stores the meat while a girl visits the lodge and
    is fed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy receives a full costume from his benefactor, seeks the chief's daughter
    through his grandmother, marries the youngest daughter after the chief consents,
    calls buffalo four times for starving people, remains faithful to his wife, and
    has many children.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Red-Spider-Woman is said to live in the center of the earth, control corn
    and beans, and have many daughters; Buffalo live in the north, and their chief
    has a son named Curly-Eyes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Four buffalo, including Curly-Eyes, travel south; Curly-Eyes falls in love
    with one of Red-Spider-Woman's daughters; delegations offer increasing amounts
    of buffalo-filled land to obtain her, but Red-Spider-Woman refuses.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The buffalo move south for many years, trample Red-Spider-Woman's fields,
    kill her as she begins to disappear into the ground, and her body remains in the
    ground as a medicinal root from which squash medicine is derived.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A buffalo calf dreams that its party will be surrounded, killed, and consecrated;
    the dream comes true, and the buffalo are satisfied when consecrated.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Buffalo and deer dispute the relative merits of their meat for consecration;
    deer runs among hunters, is shot and consecrated, and deer are thereafter first
    consecrated on a hunt.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: During famine, buffalo far in the west decide that the chief's daughter should
    lead them to the people; she carries a bundle, divides them into four herds, and
    the herds are killed around the village.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The bundle-carrying daughter gives birth to a calf in a ravine; Wind teaches
    the calf the names of its parents; the calf sings of its parentage; the daughter
    is ordered to stop carrying the sacred bundle.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A famishing Coyote hears buffalo, sees a calf, questions it, and the calf
    sings while passing by and escaping; Coyote dies of hunger.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In a village of Coyotes, priests open a sacred bundle; a lone girl brings
    corn mush to the priests, who sing all night with the bundle open, and hunters
    are successful the next morning.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In winter, people tell Coyote tales; a young man hunting encounters Coyote,
    chooses not to shoot him for fear of bad luck, and is thereafter lucky while hunting.
  category: sequence
  evidence_refs:
  - ev:8
