candidate_motifs:
- id: motif:1
  label: Aided low-status suitor wins chief's daughter
  taxonomy_refs:
  - royal_legitimacy
  basis: The boy is aided, receives fine clothing, obtains the chief's consent through
    his grandmother, and marries the chief's youngest daughter after previously being
    despised by other daughters.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The abstracted passage does not give the full earlier context or explicitly
    state royal succession; the taxonomy reference is based only on marriage into
    a chief's family and status reversal.
- id: motif:2
  label: Calling game restores abundance during starvation
  taxonomy_refs:
  - sacred_exchange
  basis: When people are starving, the boy calls buffalo four times and buffalo become
    numerous.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage summarizes the action and does not describe a ritual formula
    or exchange in detail.
- id: motif:3
  label: Rejected bride-purchase followed by migration and death-transformation into
    medicine
  taxonomy_refs:
  - sacred_exchange
  - death_rebirth
  basis: Buffalo delegations offer increasing amounts of buffalo-filled land for Red-Spider-Woman's
    daughter; after refusal, buffalo migrate, Red-Spider-Woman is killed, and her
    body remains in the ground as medicinal root and squash medicine.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage supports offer, refusal, killing, and medicinal transformation;
    'death_rebirth' is approximate because no literal rebirth is described.
- id: motif:4
  label: Animal consecration establishes ritual precedent
  taxonomy_refs:
  - sacrifice
  basis: The singing buffalo calf's dreamed killing and consecration come true, and
    the deer story explains why deer are first consecrated on hunts.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The abstracts focus on consecration precedent but do not provide the full
    ritual details.
- id: motif:5
  label: Sacred bundle and fourfold herds in famine relief
  taxonomy_refs:
