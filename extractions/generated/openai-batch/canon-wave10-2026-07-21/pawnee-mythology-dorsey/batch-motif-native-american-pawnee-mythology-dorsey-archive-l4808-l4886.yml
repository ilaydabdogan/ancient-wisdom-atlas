canonical_text:
  quote: ''
  summary: A boy travels west through several peoples with unfamiliar customs. He
    encounters a group without bows and arrows, a mouthless people who smell smoked
    meat, and small people using stones tied to strings. He teaches the small people
    how to make bows and arrows. After he passes beyond all people, North-Wind reveals
    that he has guided and protected him. The boy reaches a high peak associated with
    eagles and feathers, then a horizon boundary with water and fog. North-Wind instructs
    him to offer eagle feathers and native tobacco to a Buffalo who controls the big
    water and can grant permission to go beyond the horizon.
  language: English
  quote_policy: summarized
