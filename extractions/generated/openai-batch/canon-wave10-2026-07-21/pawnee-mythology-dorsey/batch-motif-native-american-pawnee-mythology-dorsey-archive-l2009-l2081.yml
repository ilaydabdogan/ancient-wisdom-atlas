canonical_text:
  quote: ''
  summary: 'A poor boy meets a red-painted strange man who gives him a moccasin containing
    the symbol of Morning-Star and tells him it will protect him while he seeks a
    girl in another village. With an old man as guide, the boy uses the symbol to
    remove obstacles made by the girl: a canyon, a stream of water, thick timber,
    and animals. The girl is told to marry him but demands a baby-board. The boy goes
    north and meets the same man, who identifies himself as Morning-Star and promises
    to obtain the baby-board, saying it will be adopted by the boy''s people under
    his protection. Morning-Star consults animal helpers. Beavers make baby-boards,
    while Turtles keep fires that prevent approach. Coyote and then Hawk try to get
    a baby-board, but both are driven away by sparks and flames.'
  language: English
  quote_policy: summarized
