canonical_text:
  quote: ''
  summary: A poor boy is taken in by a chief and becomes close to the chief's son.
    Through a deception involving a chief's daughter, the poor boy leaves with her
    for Pahuk. There they encounter two young Loons, who live with them, give them
    power, and teach the man mysteries of water fowl. The couple and Loons return
    after four years; the Loons help in war. Later, one Loon protests when another
    man approaches the wife, is mistreated, and dies after reporting the wife's unfaithfulness.
    The other Loon also dies; their skins are kept, the wife is expelled, Loons become
    used on a medicine-man's altar, and the man leaves his medicines to the chief's
    son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A poor boy is befriended by a chief, lives with him, looks after the chief's
    ponies, and is a close friend of the chief's son.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief's son is in love with another chief's daughter but seeks an excuse
    not to marry her by involving the poor boy; the girl objects and refuses the first
    attempt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In a second attempt, the poor boy dresses in the chief's son's clothing, meets
    the girl at night, reveals his identity and the deception, says he himself will
    marry her, and they leave south with their belongings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman's relatives ask about her, and the village realizes the poor boy
    is absent and has left with her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The poor boy and the woman travel south to Pahuk, make a grass-lodge, and
    live there.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman sees a Loon at a pond, finds a nest with two young birds, later
    hears the young Loons talking, and captures them when they allow it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Loons spend nights with the couple and return to ponds by day; they tell
    the couple they will have no children but will receive the Loons' power.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The man follows the Loons into the water; the Loons enter with great noise
    and sparks, other water birds swim in the pond, downy feathers form an earth-mound
    shape, and the man is taught the mysteries of water fowl.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the Loons' suggestion, the man hunts and returns with many ponies; the
    couple and Loons then return to the village after four years away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The chief's son leads war parties, the poor boy assists him, and a Loon guides
    and protects them; they return with scalps and ponies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: During another war expedition, a village young man attempts to visit the wife;
    the Loon left with her protests noisily and is mistreated, while the husband on
    the war-path senses that something is wrong.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The ill Loon tells the husband that his wife was unfaithful and that the other
    man mistreated him; the Loon dies, the other Loon also dies, the man keeps their
    skins, drives his wife away, and Loons are thereafter used on a medicine-man's
    altar.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The man eventually dies of grief and leaves his medicines to the chief's son.
  category: sequence
  evidence_refs:
  - ev:8
