canonical_text:
  quote: ''
  summary: A Witch-Woman and a powerful poor boy live in a lonely prairie tipi with
    four powerful dogs. The boy hunts animals but is repeatedly sent by the Witch-Woman
    to kill humans for her to eat. When pursued, he escapes by riding on the point
    of a fired arrow. The Buffalo learn of the Witch-Woman's eating of human flesh,
    become angry, and hold a council led by a bull with a white spot on his forehead.
    A note identifies the tale as concerning a wonderful boy who lived with Witch-Woman,
    overcame the buffalo, and is linked to origins and to a Chaui variant.
  language: English
