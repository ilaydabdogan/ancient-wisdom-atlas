canonical_text:
  quote: ''
  summary: The excerpt concludes a tale in which two powerful boys destroy village
    populations, follow signs of their father, overcome a Lizard being at a stream
    or under-world passage, find their father dead, burn him on a layered wooden pyre
    on a high hill, and ascend toward the heavens. It then gives brief editorial notes
    on versions of Long-Tooth Boy and begins the tale of Burnt-Belly, a poor orphan
    boy named for fire-scorching who serves others for food and is teased by a wonderful
    man as a future warrior and brother-in-law.
  language: English
  quote_policy: summarized
