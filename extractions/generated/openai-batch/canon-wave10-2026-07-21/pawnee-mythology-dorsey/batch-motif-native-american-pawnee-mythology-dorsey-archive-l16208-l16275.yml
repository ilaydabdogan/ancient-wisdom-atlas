canonical_text:
  quote: ''
  summary: The passage reports that people thought animals had pitied Proud-Boy’s
    spirit and given him power while he was in the woods. Proud-Boy sees Yellow-Corn
    arriving with her mother, gains the mother’s permission to take her, and brings
    Yellow-Corn to his tipi. In the tipi she sees mysterious things, eats with him,
    and hears him say he has brought her to remain as his wife. Yellow-Corn says she
    already has a husband, a warrior who is away, but finally consents to stay. Her
    mother later tries to recover her daughter, pointing to the absent husband, but
    Proud-Boy refuses; Yellow-Corn remains with him, and the pair do not attend later
    ceremonies or dances.
  language: English
  quote_policy: summarized
