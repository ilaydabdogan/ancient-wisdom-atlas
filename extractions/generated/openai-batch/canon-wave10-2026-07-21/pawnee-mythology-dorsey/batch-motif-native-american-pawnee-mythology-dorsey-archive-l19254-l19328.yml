- id: obs:1
  text: The introductory note names Sun-Chief, Skidi, as teller and says the tale
    teaches that travelers should not fear scalped people because they can confer
    power; it also links the story to ventriloquism.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wounded man was unable to continue with a war party; other men left him
    buffalo meat, water, and fire sticks and promised to notify his people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the war party left, the wounded man heard many voices and an unseen
    nearby voice that said it had only wanted to scare him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After nights of strange voices, the man repeatedly found that portions of
    his meat had been stolen.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: When his meat was nearly or entirely gone, the man called for the taker to
    kill him rather than let him starve; the reply was laughter.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Scalped-Man appeared and offered to heal the wounded man and care for him
