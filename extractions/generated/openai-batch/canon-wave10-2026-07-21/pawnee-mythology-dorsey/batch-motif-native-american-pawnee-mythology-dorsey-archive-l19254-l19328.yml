  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wounded man agreed to go, and Scalped-Man carried him on his back to a
    home in a big cave.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Inside the cave were wild sage, a fireplace, a buffalo skull with presents,
    the lost meat, parfleches of dried meat, buffalo robes, and no visible opening.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Scalped-Man regularly left the cave and returned after many voices, war cries,
    and laughter were heard.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Scalped-Man told the wounded man that he made the noises himself; after demonstrating
    voices that sounded like many people, he convinced the man.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The wounded man heard what seemed to be his father, mother, and others calling
    him, rose and tried to get out, but could not find the entrance.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After demonstrating the voices, Scalped-Man offered to give the wounded man
    the power of making many peculiar sounds.
  category: speech
  evidence_refs:
  - ev:8
