canonical_text:
  quote: ''
  summary: An editorial note identifies the story as told by Sun-Chief, Skidi, and
    says it concerns scalped people, power-conferral, and ventriloquism. In the tale,
    a wounded man is left behind by a war party with meat, water, and fire sticks.
    He hears unseen voices, loses his meat, and is frightened. Scalped-Man appears,
    offers healing and care, carries him to a cave, and later demonstrates that he
    can make many voices and offers the man the power of making peculiar sounds.
  language: English
  quote_policy: summarized
