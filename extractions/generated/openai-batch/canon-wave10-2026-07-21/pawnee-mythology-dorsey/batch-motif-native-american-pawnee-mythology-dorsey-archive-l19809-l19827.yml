canonical_text:
  quote: I am going to teach you how to be a medicine-man.
  summary: A young man uses a song previously taught by Dog to bring the woman he
    wants to marry to him. After she consents and travels with him, they return to
    Dog. Dog asks to be called brother, gives the man ritual objects, promises children,
    instructs him in medicine practice, breathes out smoke, and gives him roots. A
    source note states that the story teaches that dogs should not be mistreated because
    they have powers they can bestow.
