canonical_text:
  quote: ''
  summary: During a ceremony, two pieces of fat are passed among young men, girls,
    and two priests in the west for greasing, then placed before the chief. The chief
    says Tirawa gave the dance because the people were hungry and recounts how a young
    man was guided by the Moon to a cave, received fat and other aids, and later witnessed
    buffalo rushing from the cave after a woman called them. The conclusion links
    correct performance of the ceremony with finding many buffalo on hunts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two pieces of fat are distributed to a first young man and a first young woman,
    passed among young men and girls for greasing, then returned through the two priests
    in the west and placed before the chief.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief puts the two pieces of fat together and tells the people that Tirawa
    gave them the dance because they were hungry.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A young man who had charge of the dance went away while the people were starving
    and was guided by the Moon to a hilly country, a hillside cave, and a tipi where
    an old woman identified herself as the Moon.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Moon says she brought the young man because the people need food; she
    says Tirawa promised buffalo, that buffalo are scarce on earth, and that buffalo
    living under the ground will be sent.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Moon gives the young man pieces of fat for the people to eat or chew so
    they can get grease from it and feel better; the young man returns and gives the
    fat to the people.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: On returning to the cave, the young man finds a young girl outside an earth-lodge
    with a basket of plum seeds and gambling sticks nearby.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The young woman gives the young man gambling sticks and a ring for the men,
    a basket with plum seeds for the women, and two pieces of dried meat for the children
    so they will be sustained while the buffalo are still far away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The young man gives the gambling sticks to the men, the basket and seeds to
    the women, and meat to the children, who are filled.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Several days later, the same woman stands in a pond and tells the young man
    to stand outside the cave entrance while she calls the buffalo.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: At the last call, buffalo rush out from the cave; the young man tells the
    people that buffalo are on the prairie, and the people kill many buffalo.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The concluding statement says the ceremony must be performed correctly so
    that many buffalo may be found on the hunt.
  category: speech
  evidence_refs:
  - ev:10
