canonical_text:
  quote: ''
  summary: A man and wife travel south; after the woman gives birth, the afterbirth
    is thrown into water, the woman dies, and the boy is nourished by animals. A younger
    brother born from the afterbirth is captured and joins the family. The brothers
    repeatedly enter dangerous places, encounter and defeat a water monster, snakes,
    a spotted calf leader, a bear-disguised man, and an old woman with a river and
    cliff ordeal. The passage ends incompletely during the old-woman episode.
  language: English
  quote_policy: summarized
