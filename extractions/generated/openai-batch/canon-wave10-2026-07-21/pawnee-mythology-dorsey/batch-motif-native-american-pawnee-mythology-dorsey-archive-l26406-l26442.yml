canonical_text:
  quote: ''
  summary: An unnamed man separated from a war party encounters an old wolf, receives
    a fatigue-relieving root and instructions for keeping the wolf's spirit through
    a strip of wolf skin, becomes the famous warrior and scout Wolf Man, and dies
    in old age as sunlight rests on him, as the wolf had died. A second abstract tells
    of a man who meets Coyote, is taken among wolves and coyotes, receives medicines,
    bones, a whistle, and a skull piece, returns home, and becomes a medicine-man.
  language: English
  quote_policy: summarized
