canonical_text:
  quote: ''
  summary: 'A dream-instructed man is taught rites for preparing buffalo-game medicine:
    offerings are made to trees before cutting sticks, buffalo materials are used
    to bind and form the implements, a cow-derived ring is made and given a star-bead,
    and the game is taught on the west side of the village with smoke offerings, scoring
    rules, cooking duties, and offerings to heavenly powers and buffalo.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The instructor says smoke is to be offered at the base of trees, ashes buried,
    and the trees cut only after the rite.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two body-length sticks are to represent men, and two shorter sticks are to
    represent buffalo with one horn.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sticks that represent men are also said to have the spirit of a one-horned
    buffalo in the west.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Buffalo sinew is used to splice and bind the sticks.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: A buffalo cow is killed; the flesh is not to be eaten, and material from about
    the vulva is used for the ring.
  category: action
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:6
  text: The cow’s head is to be placed toward the east so that buffalo coming from
    the west will notice the absence and follow the camp.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Marks are made on the sticks for ears, hands, legs, and one horn.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The front part of the prepared implement represents the Sun, and the hind
    portion represents Spider-Woman or the Moon.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Sun and Moon are said to have first played the game in the heavens, and
    after the Sun lost, the Moon gave the game to man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: One stick is blackened to represent darkness or north, while the other remains
    white to represent day or south.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: In a later dream, the strange man gives a white bead to be placed on the ring,
    and the bead represents the star itself.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The ring is carried by the man’s granddaughter and is thereafter spoken of
    as a granddaughter to all men.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Before play, smoke is offered to the sun, moon, stars, ground, ring, and sticks,
    and ashes are placed on the ring and sticks.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Players divide into two parties and pairs, and scoring is based on where the
    sticks pierce or reach the ring, horn, head, limbs, or bead.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The losing side brings wood, kindles fire, and boils meat; the other side
    offers buffalo heart and tongue to heavenly gods and to the buffalo.
  category: sequence
  evidence_refs:
  - ev:9
