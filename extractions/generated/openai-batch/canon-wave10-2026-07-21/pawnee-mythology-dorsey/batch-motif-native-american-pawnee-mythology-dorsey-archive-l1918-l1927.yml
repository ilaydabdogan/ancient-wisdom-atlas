  quote: '"You are near the place now."'
  summary: A Raven tells a girl she is near a place. She sees a mound-like place,
    finds a man outside a lodge making a bow, asks him to save her from a mysterious
    being that has followed her for days, enters the lodge, and sits beneath a sacred
    bundle. Long-Tongue climbs out of a gulch and resumes chasing her as the passage
    breaks off.
