canonical_text:
  quote: ''
  summary: Spotted-Horse-Chief leads a war party from the village, crosses the icy
    Platte River first, and his followers cross after hearing his song. Near an enemy
    camp he opens his bundle, fills a pipe, uses a sun-glass, and interprets the sun
    and winds as signs of heavenly favor. The warriors stretch their lariats, selected
    men capture many ponies at night, and the party travels four days and nights before
    the young men receive new names and ponies. Later Spotted-Horse-Chief dies from
    a wound after a battle with the Sioux, and his bundle objects are buried with
    an old woman custodian.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The company starts out early, travels far from the village, and additional
    men join after scouts signal from hills.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the Platte River, broken ice is floating downstream; Spotted-Horse-Chief,
    carrying a bundle, crosses first while pushing away cakes of ice, but the followers
    initially remain behind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Spotted-Horse-Chief sings a warrior Coyote song, the men state that
    he is brave, cross the cold icy river, and warm themselves at a fire he has kindled.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When an enemy camp is sighted, Spotted-Horse-Chief sits on the south side,
    opens his bundle, fills a pipe with native tobacco, takes out a sun-glass, and
    the sun appears while smoke comes through the pipe stem.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Spotted-Horse-Chief tells the warriors that gods in the heavens favor them,
    that the sun and winds helped his pipe ritual, that the gods will guide them and
    blind the enemy, and that each man should stretch out his rawhide lariat rope.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Scouts report that the enemy camp is quiet and that ponies are being driven
    away; after night, selected men find many ponies along a stream and bring them
    to Spotted-Horse-Chief.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The warriors lariat ponies and drive them rapidly; after traveling four days
    and four nights without rest, the men faint and are sore, and young men receive
    new names and ponies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Afterward many young men join Spotted-Horse-Chief's war parties; he is later
    wounded in a battle with the Sioux, dies despite treatment by Buffalo Society
    men, and his bundle, pipe, sun-glass, and skin are buried with an old woman after
    her death.
  category: sequence
  evidence_refs:
  - ev:8
