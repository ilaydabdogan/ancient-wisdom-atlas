canonical_text:
  quote: ''
  summary: A young man distributes corn and meat to the chief and villagers, appoints
    another man to continue distribution for four nights, and returns to a cave. There
    an old woman tells him that the gods have given buffalo to his people and gives
    instructions for killing the first buffalo, tanning its hide, and placing its
    skull on a high hill and later in the village lodge. She gives him braided corn
    seeds, buffalo hair containing a marked feather to summon buffalo, and a sacred
    bundle named the Small-Ants bundle. The young man installs the objects in his
    lodge, then tells the chief that Mother-Moon spoke to him in dreams and that the
    people are now to kill buffalo. The chief accepts the instructions and prepares
    to select men for the task.
  language: English
  quote_policy: summarized
