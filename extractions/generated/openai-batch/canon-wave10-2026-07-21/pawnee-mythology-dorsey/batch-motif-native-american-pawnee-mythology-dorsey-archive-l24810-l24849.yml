literal_observations:
- id: obs:1
  text: A daughter of a Buffalo chief visits a boy and his sister.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy has one red arrow and one black arrow, shoots a cow, and follows it
    in hopes of recovering the arrow that penetrated only beneath the skin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A tipi appears at night; in the morning it has become Buffalo; later the boy
    finds a woman covered with a robe inside the magic tipi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the third night the woman tells the boy of her love, feeds him, and they
    pass the night as man and wife; in the morning she is Buffalo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The boy offers tobacco to an old bull before entering the Buffalo village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the Buffalo village the boy is received kindly by some and hostilely by
    others.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: White-Spot Buffalo jumps at the boy and is shot; the boy next kills the girl's
    father, who also has a white spot on his forehead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: When the Buffalo become angry and try to kill him, the boy turns into a breath
    feather each time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The Buffalo ask for a sacrifice of smoke; certain buffalo are taken to the
    boy's village, killed, and their meat is made holy; their spirits return to the
    Buffalo village with news.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The boy travels with Buffalo as a feather and becomes Buffalo, which is shown
    by a buffalo hide covered with feathers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: A young boy who dislikes women escapes them as a blackbird; he learns of a
    Buffalo girl who dislikes men, and they meet on a high hill between their villages.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Buffalo girl sings by a river bank; Coyote hears her and schemes to get
    her, but the boy arrives first and takes her to his tipi.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:13
  text: The girl's father is glad; Buffalo are summoned and given smoke; the Buffalo
    chief sends eight Buffalo and then increasing numbers to the people to be killed,
    their meat is made holy, and the Buffalo finally scatter for the benefit of the
    people.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Women in ceremonies wear an elk dress and an eagle feather on the head in
    imitation of the Buffalo wife when a husband makes Buffalo holy.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Buffalo wife makes her husband angry; he flies away as a blackbird and
    thereafter lives among buffalo.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: A poor boy living with his grandmother is addressed while asleep by the buffalo
    chief's son, who says his home is beyond mountains where buffalo live in a great
    cave; on return the boy is led toward the buffalo place and a little calf comes
    from the side of a hill.
  category: sequence
  evidence_refs:
  - ev:7
