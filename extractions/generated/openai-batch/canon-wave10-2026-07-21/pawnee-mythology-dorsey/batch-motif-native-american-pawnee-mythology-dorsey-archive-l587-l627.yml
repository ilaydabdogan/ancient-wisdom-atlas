canonical_text:
  quote: ''
  summary: The passage summarizes a Pawnee historical tradition that the Chaui, Pitahauirat,
    and Kitkehahki were formerly one division called the Kawarahkis near Nemaha, Nebraska,
    and later separated or migrated. It also discusses similarities among their origin
    myths, probable later acquisition of rites and origin stories from the Skidi,
    differences from Skidi social and religious organization, and the later close
    association of the four bands through Oklahoma removal, government treatment as
    one tribe, intermingling, ceremonial visiting, and storytelling.
  language: English
  quote_policy: summarized
