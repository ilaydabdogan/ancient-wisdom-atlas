canonical_text:
  quote: ''
  summary: A flint being becomes a small marked stone and is taken home by a man,
    who installs it with pipe smoke, coverings, and a bundle. The man later invokes
    the stone as his brother to become flint or stone, making himself invulnerable
    while killing a dangerous lake monster and then seven dangerous spotted calves.
    The people verify the deaths and use remains from the monsters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A seated man or being says he will become a small stone, asks to be carried
    to the man's people, and says he will listen when smoked with, spoken to, and
    prayed to.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The seated man turns into flint and shrinks into a very little stone marked
    with the sun on one side and the moon and several stars on the other.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The finder places the stone on an altar in the west of the lodge, receives
    black handkerchiefs and buckskin for coverings, gives pipe smoke to the stone
    and ground, and wraps the stone into a tied bundle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The possessor of the stone goes to a great lake where a monster lies among
    human bones and skulls; the monster asks him to step on its back because of a
    pain.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before stepping on the monster, the man addresses the stone as his brother
    and asks to be turned into flint so he can kill the monster.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sharp bones on the monster's back break against the man's flint body, and
    the man kills the monster by pounding its head with his flint feet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: People find the monster dead, cut it up, and mix fat and flesh from its body
    with their medicines.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The man hears of seven dangerous spotted calves, finds them sliding down a
    hill on sleds made with buffalo ribs, and accepts their invitation to slide.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Suspecting that the spotted calves intend to kick him to death, the man asks
    the flint to help turn him into stone.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The spotted calves kick the man without hurting or marking him; after the
    order is reversed, he kicks each calf from the sled and kills all seven.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: People from the village skin the spotted calves and confirm that they are
    no longer living.
  category: action
  evidence_refs:
  - ev:8
