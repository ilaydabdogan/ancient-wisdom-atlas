  summary: During another ceremony, offerings are brought; robes and parfleches are
    taken into the tipi and ponies are tied outside. A woman empties her medicine
    bundle, arranges a young bear hide, feathers, and paints near the fireplace, prepares
    native tobacco with saliva taken from horses, and offers tobacco to the sun at
    the fireplace.
