canonical_text:
  quote: All of us agreed that we would send the girl back.
  summary: Spirit relatives tell the grieving young man that they agreed to send the
    dead girl back, though she is not fully real and must not be angered. The girl
    explains that her relatives have granted permission for him to speak with and
    be near her, but they cannot yet be together. She later tells him that her four
    uncles are returning to the village with buffalo meat and fat for her grave. She
    instructs the young man to hold her with all his strength when she tries to disappear
    at the sight of her uncles; this will happen four times, and he must call for
    the uncles to help.
  language: English
  quote_policy: quoted
