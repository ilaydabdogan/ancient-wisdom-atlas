canonical_text:
  quote: ''
  summary: Animals find a bewitched chief's son, take him into their lodge, heal him,
    and teach him mysteries and animal powers. Individual animals give him objects
    and abilities, including a snake bone, a buffalo whistle, healing dust or paint,
    flight, and swimming or diving. The animals feed him, guide him back to his village,
    and instruct him how to deal with the man who tried to poison him. The boy returns
    to his father, is recognized, and later takes the injuring man to the creek, where
    the man is dragged under the water and disappears.
  language: English
  quote_policy: summarized
