canonical_text:
  quote: ''
  summary: A mourning man encounters a shining green stone and a bear-associated being,
    then experiences a lightning storm that opens access to an animals' lodge. The
    animals give him medicines, songs, ritual powers, and instructions for a stone
    medicine-lodge, after which he returns to his people and establishes ceremonies
    involving altars, animal powers, trees, lightning, and swallowed powers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man is mourning, hears noises from timber, and fear is removed when he
    sees the green color of a stone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man or being appears with a brightly shining stone, wearing a bear robe,
    two great tusks, and bear claws about his ankles.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bear-associated being breathes colored dust, which the stone dispels,
    says he is afraid of the stone and that lightning will kill his child, then turns
    into a bear and leaves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A storm comes from the west; lightning flashes, rain falls, animals cry, and
    lightning repeatedly strikes a spot on the river bank.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the man is stunned by lightning, the stone man tells him that animals
    have not previously been friendly with man but will now give him power.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The man takes up the stone, prays to it, and enters the animals' lodge through
    the hole where lightning struck.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Mink passes in and reports to the animals; the animals send a messenger asking
    the man to remove the stone and then confer about giving him power.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The animals walk around a fire while the man enters the lodge, show him pieces
    of ice taken from his stomach, and tell him to swallow them again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The animals say that, after swallowing the ice pieces, the man will have power
    to blow objects into people's stomachs.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: A scalped man in the lodge tells the tale of his power, and other animals
    give the man their medicine.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The man brings the stone into the lodge, and the animals blow their breath
    upon it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Skunk says he has power to make rainbows and gives the man power to cure people
    with lightning.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: The animals tell the man that he has formed a stone medicine-lodge, with one
    altar containing the mysterious stone and a second altar belonging to the Beavers,
    and that they will teach him sleight-of-hand powers and many songs.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:14
  text: After leaving the lodge, the man sees clearly in the night and enters his
    home with the stone, a skin, and other gifts.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: In the morning he offers smoke to the sun and asks it to confirm what has
    happened.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: He disappears daily and returns with roots and herbs; he is watched and appears
    as deer, coyote, and eagle while guided in his search for medicines.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:17
  text: He sings his songs, tells companions about his experiences, and takes presents
    to the animals on the journey back to the village.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:18
  text: A medicine-lodge is built after timbers are gathered and a successful buffalo
    hunt occurs; altars are made with skins of birds and animals.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:19
  text: Four decorated and notched ash limbs, cottonwood saplings, and willows are
    used around the altar.
  category: object
  evidence_refs:
  - ev:6
- id: obs:20
  text: When visiting timber, the medicine-man grunts and throws others down; some
    vomit corn-cobs or pieces of root after rising.
  category: action
  evidence_refs:
  - ev:6
- id: obs:21
  text: The medicine-man discovers each man's animal power because a wounded man imitates
    the animal from which he obtained power.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:22
  text: Booths are made inside the lodge for different medicine-men, each man places
    his medicines in his booth, and a cedar tree is selected for the bear medicine-man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:23
  text: During a night performance the man makes lightning appear; each man throws
    up his animal's power, the powers are seen sitting on the ground, and afterward
    each man picks up and swallows his power.
  category: sequence
  evidence_refs:
  - ev:7
