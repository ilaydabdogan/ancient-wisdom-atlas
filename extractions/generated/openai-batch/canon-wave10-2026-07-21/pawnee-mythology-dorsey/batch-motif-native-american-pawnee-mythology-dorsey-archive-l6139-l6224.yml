  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The transformed boy instructs the people to place fat on the bundle when they
    kill Buffalo, because the bundle and the fat belong to Tirawa.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'The pipe and raccoon penis are said to go together in the bundle: the pipe
    gives smoke to the gods, and the raccoon penis is used in offering fat to the
    gods.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy instructs that captured enemy arrows should be placed on bundles and
