- id: motif:1
  label: Origin of a sacred buffalo bundle with ritual prescriptions
  taxonomy_refs:
  - sacred_exchange
  basis: The account explains how the bundle is captured from the Buffalo and how
    the transformed boy prescribes offerings of fat, smoke, and captured enemy arrows
    to Tirawa and the gods.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The taxonomy reference is broad; the passage specifically concerns Pawnee
