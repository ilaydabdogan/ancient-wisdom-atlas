  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The boy warns that people must not press tobacco with their fingers, because
    doing so would offer themselves to the gods and they would soon die.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The editorial note says that "The Last of the White Buffalo" is apparently
