canonical_text:
  quote: ''
  summary: The passage contains the closing portion of an origin account for the Buffalo
    Bundle, in which people capture a sacred bundle from the Buffalo, a white buffalo
    calf seeks its mother and father, is refused nursing, curses white buffalo milk,
    becomes a boy, and gives ritual instructions about the bundle, fat, pipe, raccoon
    penis, enemy arrows, tobacco, and offerings to Tirawa and the gods. It then gives
    a brief editorial note on a fragment titled "The Last of the White Buffalo" and
    begins a separate story, "The Wife Who Returned from Spirit Land," in which a
    young warrior courts a girl and joins a war party to capture ponies before marriage.
  language: English
  quote_policy: summarized
