- id: motif:2
  label: Animal calf transforms into human ritual teacher
  taxonomy_refs:
  - shapeshifter
  basis: The calf returns to the village, turns into a boy, grows into a remarkable
    man, and becomes the instructor for bundle rites.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The text states one transformation from calf to boy; it does not describe
    repeated shape-changing.
- id: motif:3
  label: Rejected offspring causes loss of white buffalo
  taxonomy_refs: []
  basis: The mother refuses to nurse the calf, and the calf says it will turn her
    milk black and that there will be no more white Buffalo.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage gives the statement but does not narrate the later fulfillment
    beyond the calf’s declaration.
- id: motif:4
  label: Captured sacred object from nonhuman beings
  taxonomy_refs:
  - sacred_theft
  basis: The sacred bundle carried by the girl is captured by the people from the
    Buffalo and becomes the center of later ritual instructions.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: medium
  cautions: The text says the bundle is captured, not stolen; the taxonomy reference
    is approximate.
- id: motif:5
  label: Ritual danger of self-offering through improper handling
  taxonomy_refs:
  - sacred_exchange
  basis: The boy warns that tamping tobacco with fingers would make people offer themselves
    to the gods and die.
  evidence_refs:
