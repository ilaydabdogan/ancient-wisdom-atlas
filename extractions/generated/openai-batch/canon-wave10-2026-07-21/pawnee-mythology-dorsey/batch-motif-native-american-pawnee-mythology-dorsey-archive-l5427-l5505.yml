canonical_text:
  quote: ''
  summary: A Buffalo cow with a bull-calf travels east to the human village so the
    calf can see his father. In a ravine she changes herself into a woman and the
    calf into a boy, and the young man eventually recognizes and accepts them as wife
    and son. The household recognizes that the woman and child are not human. The
    Buffalo woman warns that the boy may reveal or resume calf form. Later, while
    the young man is gambling, the boy brings him water and is ignored; the Buffalo
    woman becomes angry, leaves with the child, and the man follows them after they
    have become Buffalo again.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Buffalo cow who had had connection with a man has a little bull-calf; when
    grown, the calf asks where his father is.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Buffalo mother and calf travel east for many days to the village of the
    people and stop in a ravine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the ravine, the Buffalo cow turns herself into a woman and turns the calf
    into a young boy; each wears a buffalo or calf robe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At night near the entrance of the young man's lodge, his sister finds the
    woman and child and tells her brother that a woman outside wishes to see him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Buffalo woman tells the young man that the boy is his son; the young man
    initially says he knows no woman and thinks she is mistaken.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Buffalo woman reminds the young man of an earlier encounter in a mud-hole
    while he was running after Buffalo, and he then accepts the boy as his son and
    the woman as his wife.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old people recognize that the woman and boy are not human beings; they
    do not touch the woman but catch and caress the boy.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: After four days inside the enclosed bed, the Buffalo woman begins to be like
    other people.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Buffalo woman warns the old people to watch the boy because, if he strikes
    children, his hands would turn into calf's hoofs and hurt them badly.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Buffalo woman also warns that if the boy falls upon the ground, he will
    turn into a Buffalo calf and run away.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The young man goes daily to the gambling grounds to play with sticks, and
    at noon the boy brings him a bucket of water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the young man is losing at the gambling sticks, he refuses to go to his
    son to drink; the Buffalo woman sees this, becomes angry, and leaves with the
    boy and their robes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The grandmother sees the Buffalo woman and child going away and tells the
    young man to stop playing and come home.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The young man follows and sees the woman and child going not as human beings
    but as Buffalo.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The calf comes back to jump around its father, then runs again to its mother;
    at night the Buffalo sit in a hollow while the calf lies beside the father.
  category: relationship
  evidence_refs:
