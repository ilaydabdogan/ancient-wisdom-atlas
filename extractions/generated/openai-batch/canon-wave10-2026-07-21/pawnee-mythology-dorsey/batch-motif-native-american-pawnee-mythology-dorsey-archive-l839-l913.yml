canonical_text:
  quote: ''
  summary: The Moon asks that the first woman be given a mate because created things
    are in pairs. Tirawa makes a man and instructs the pair to regard earth and moon
    as mothers and heavens and sun as fathers. Tirawa gives resources, teaches lodge
    construction as a structure corresponding to heavenly gods and human bodies, gives
    fire-sticks, establishes a mound, fireplace, altar, buffalo skull, sacred bundle,
    ritual objects, sacrifices, weapons, farming tools, colored corn, pottery, food
    plants, medicine herbs, and animal flesh.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Moon says that created things have been made in pairs and asks that a
    mate be given to the woman.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tirawa makes a man and sends him to the woman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tirawa gives the earth to the man and woman and tells them to call earth and
    moon mother, and heavens and sun father.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The earth is described as giving birth to all things, and trees, fruits, shrubs,
    and berries are given for human use and food.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tirawa teaches the pair to build a lodge with ten forked sticks set in a circle,
    including four upright forks in a parallelogram.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The lodge posts are said to represent four gods who hold up the heavens, with
    minor gods and an outer circle of many gods represented by additional poles.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The south side of the lodge is assigned to men, the north side to women, and
    the entrance is to face east.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The lodge is described as breathing as if human; five posts on each side represent
    the branches of the man and woman, and netted willows represent ribs of the gods.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: A fireplace is dug in the center of the lodge, and fire-sticks belonging to
    the sun are given for making fire.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Dirt from the fireplace is placed before the lodge as a mound for the rising
    sun to see, and a small mound in the west is left for an altar.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A buffalo is to be killed, and its skull is to be placed on the west altar
    facing east so the first rays of the sun shine on it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Tirawa or the buffalo spirit is said to be present at the skull when sunlight
    shines on it, and the skull is said to live with and communicate with the people.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: A sacred bundle is to hang over the altar, and the woman is to have charge
    of it.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: Pipe, native tobacco, mother-corn, and painted sticks with scalps are given,
    and the painted sticks are to be placed outside the lodge in the four directions.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: Animals and birds are said to have power from the bundle and to go in pairs
    and increase.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Thunder is identified as the father's voice, and sacrifices are required for
    him and the other gods in the heavens.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: The man receives a wonderful bow and arrows, while the woman receives bow
    and arrows, a hoe made from a buffalo shoulder blade, and four colors of corn
    seed.
  category: object
  evidence_refs:
  - ev:9
- id: obs:18
  text: The woman and man are instructed to make a clay pot, cook corn on the fire,
    eat it, use herbs for food and sickness, and eat animal flesh.
  category: action
  evidence_refs:
  - ev:10
