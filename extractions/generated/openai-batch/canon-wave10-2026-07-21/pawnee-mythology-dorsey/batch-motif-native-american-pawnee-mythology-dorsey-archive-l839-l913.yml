candidate_motifs:
- id: motif:1
  label: paired creation and increase
  taxonomy_refs:
  - duality
  basis: The Moon states that things have been made in pairs, asks for a mate for
    the woman, and animals and birds later receive power to go in pairs and increase.
  evidence_refs:
  - ev:1
  - ev:7
  confidence: high
  cautions: The passage speaks of pairing and increase, not of twins or a formal marriage
    rite.
- id: motif:2
  label: cosmic mothers and fathers
  taxonomy_refs:
  - divine_parent_child
  - mother_goddess
  basis: The pair are instructed to call earth and moon mother and heavens and sun
    father; earth is described as giving birth to all things.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The wording gives relational titles and birth imagery, but does not narrate
    a child born directly from these cosmic parents in this passage.
- id: motif:3
  label: sacred lodge ordered as cosmos and body
  taxonomy_refs:
  - world_center
  basis: The lodge contains a center fireplace, east entrance, directional posts representing
    gods holding the heavens, outer and minor gods, and human-body correspondences.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not use the term world center; the identification is
    based on the lodge's ordered center and cosmic correspondences.
- id: motif:4
  label: solar fire and central hearth gift
  taxonomy_refs:
  - sacred_exchange
  basis: Tirawa gives fire-sticks belonging to the sun for making fire in the center
    fireplace.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: This is a divine gift of fire implements, not a theft or destructive fire
    episode.
- id: motif:5
  label: buffalo skull altar with spirit presence
  taxonomy_refs: []
  basis: A buffalo skull is placed on the altar facing east; Tirawa or the buffalo
    spirit is present when sunlight shines on it, and the skull is to live with and
    communicate with the people.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: No external buffalo-skull motif family is inferred beyond the literal
    altar and spirit-presence pattern.
- id: motif:6
  label: sacred bundle empowering life and ritual order
  taxonomy_refs:
  - sacred_exchange
  basis: Tirawa gives a sacred bundle to hang over the altar, places the woman in
    charge of it, and says animals and birds receive power from it and increase.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The contents of the bundle are not enumerated in this passage beyond its
