canonical_text:
  quote: ''
  summary: A young girl and a young man meet while each says they are traveling to
    visit a person known for disliking the opposite sex. The girl identifies herself
    as the girl who dislikes men, learns the young man's name, and says she likes
    him. After they separate, she tells her people about him. An old Buffalo instructs
    her to bring the young man, and she returns to the lower village at dawn and sings
    from a small northern knoll. A note states that the tale concerns deeds that may
    draw buffalo near a village for hunting and explains why blackbirds can perch
    on buffalo because a blackbird married a buffalo cow.
