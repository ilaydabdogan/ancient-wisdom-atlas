canonical_text:
  quote: ''
  summary: 'The passage explains difficulties in grouping Pawnee tales, states that
    Pawnee categories distinguish true from false tales, and outlines an editorial
    fourfold division: heavenly supernatural tales, Ready-to-Give cultural hero tales,
    earthly supernatural and medicine/manitou tales, and Coyote or Wolf moral trickster
    tales.'
  language: English
  quote_policy: summarized
