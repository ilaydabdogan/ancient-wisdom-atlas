canonical_text:
  quote: ''
  summary: A man receives instructions from a water-monster, Eagles, Wild-Cat, Evening-Star,
    plants, birds, heavenly gods, and the Sun concerning a pipe-stem, eagle feathers,
    corn, forked sticks, songs, and rain-related ceremonial use. The episode explains
    elements of the pipe-stick ceremony through gifts and teachings from nonhuman
    and celestial beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man lies in one place for several days killing eagles and takes one tail
    feather intended for the head of the water-monster.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The water-monster appears to the man in a dream, gives him a pipe-stem, and
    instructs him to string eagle feathers and tie them on a stick.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The water-monster says the pipe-stem and eagle feathers can be used to compel
    other people to give presents.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The water-monster tells the man to travel until he finds an Eagle nest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man finds a big Cottonwood tree with an Eagle nest; the mother is a Brown
    Eagle, the father is a White Eagle, and several young ones are in the nest.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The man cries and asks the Brown Eagle for help; the Brown Eagle says Tirawa
    gave him a pipe and that Tirawa will help him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Brown Eagle says the Eagles represent the sky but can do only certain
    things for the man and cannot help him fully.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: Wild-Cat says his skin has black spots, his fur is blue, he represents the
    sky and the stars, and he can teach the man how to cheat others.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Evening-Star says Wild-Cat was placed on earth and helps get presents from
    other people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: Evening-Star gives an ear of corn, tells the man to call it mother, and says
    that although it looks dead, kernels planted in the ground will live and bear
    again.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: Evening-Star says the ear of corn is to be tied onto a stick and that the
    stick must have a downy feather to represent Tirawa.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: A plum bush offers its timber for forked sticks and states that it bears much
    fruit.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: Woodpecker offers to help make the sticks, says his bill must be placed at
    the point of the sticks, and connects the sticks with requests for rain or for
    rain to stop.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: Ducks fly overhead and offer help, saying they place eggs along streams of
    water, the eggs hatch, and they have many children.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Owls hoot and say to take their feathers and place them on the sticks.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: Four gods in the heavens say that people who want rain must sing songs, and
    that other songs are used to stop the rain.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:17
  text: After returning home, the man has night visions of different animals who give
    him songs and teach him songs.
  category: action
  evidence_refs:
  - ev:7
