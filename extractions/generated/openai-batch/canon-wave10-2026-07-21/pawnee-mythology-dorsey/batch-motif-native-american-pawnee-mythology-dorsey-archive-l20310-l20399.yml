canonical_text:
  quote: ''
  summary: The passage closes a story in which a young man returns from Spirit-Land
    with a ghost-wife, a ceremony, ritual objects, and food-producing balls, aided
    by a being who reveals himself as the Wind. After the man disobeys his ghost-wife,
    she dies permanently; he transmits the ceremony and dies. The passage then notes
    a Pitahauirat variant titled “The Spirit Wife and the Whistle Dance” and begins
    the tale of Handsome-Boy, a protected youth kept from war-path activities who
    is propositioned and taunted by a woman at night.
  language: English
  quote_policy: summarized
