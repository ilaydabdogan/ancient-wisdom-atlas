canonical_text:
  quote: I am hunting a robe. My painted robe I am hunting.
  summary: A young man has overcome Deer racers connected with an old woman who wishes
    to harm him. The old woman covets his wonderful painted robe. During a gambling-stick
    game and a false alarm, she takes the robe, hides it under her dress, and later
    claims it as her skirt while denying she has seen it. The young man searches the
    village and sings that the robe has the heavens and flocks of swallows painted
    upon it and is among the people.
  language: English
  quote_policy: quoted
