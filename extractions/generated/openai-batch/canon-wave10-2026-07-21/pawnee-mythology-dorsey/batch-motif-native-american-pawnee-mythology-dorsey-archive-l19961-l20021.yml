canonical_text:
  quote: ''
  summary: A Dog repeatedly instructs Burnt-Belly in dreams and speech to go on the
    war-path, gives him red paint, owl feathers, and a bone whistle, and explains
    celestial protection involving the Sun and a heavenly father of Dogs near Tirawa.
    Burnt-Belly raids enemies, takes ponies and scalps, completes four successful
    scalp returns, becomes known as a warrior, and marries. Later the Dog watches
    his wife during war absences. After another man visits the wife and the Dog is
    kicked out, Burnt-Belly returns, withdraws with the Dog to a high hill, refuses
    pipe-mediated reconciliation, and says he will remain there with the Dog and may
    help warriors who come to him. The supplied passage ends in the middle of a statement
    about turning into something.
  language: English
