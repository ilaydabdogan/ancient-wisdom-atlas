canonical_text:
  quote: ''
  summary: A girl misses a young man who has gone on the war-path without her knowing.
    Her sadness turns to sickness, and she dies as the people prepare for a buffalo
    hunt. The people carry her to a high mound near the graveyard and construct a
    shallow burial platform with east and west forks and poles. A note says the tale
    illustrates Pitahauirat belief in a future land and the results of disobedience
    to supernatural powers.
