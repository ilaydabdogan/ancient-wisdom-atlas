canonical_text:
  quote: ''
  summary: A young man uses paint, a root, and a flute while going around the village
    at night. After repeated nights, the girl he loves follows him and refuses to
    return home. Warned that her parents are searching for her, he leaves with her
    toward the east. They travel, reach swampy ponds, and the girl takes two young
    Geese from the water, calling them her children. The couple lives in grass-lodges
    in timbered areas; the man hunts, while the girl tends the Geese, talks to them
    as humans, and later makes moccasins for them.
  language: English
  quote_policy: summarized
