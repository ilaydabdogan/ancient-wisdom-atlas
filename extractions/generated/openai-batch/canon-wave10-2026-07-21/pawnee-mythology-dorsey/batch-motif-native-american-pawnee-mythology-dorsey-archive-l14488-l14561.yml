canonical_text:
  quote: ''
  summary: Animal-Boy fulfills Stone-Man's demands for wolf-hide quivers and bows
    with animal aid. Stone-Man challenges him to a hoop game whose stakes include
    the people's transformation into stone or the bubbling of Stone-Man's spring.
    Otter gives Animal-Boy a root for protection, and Animal-Boy escapes the boiling-water
    hole by otter-like movement and transformation. Stone-Man concedes, then demands
    a fighting buffalo. Animal-Boy appeals for help in the west, and the Buffalo leader
    reveals the plateau stone that gives Stone-Man his power and instructs Animal-Boy
    to damage it.
  language: English
  quote_policy: summarized
