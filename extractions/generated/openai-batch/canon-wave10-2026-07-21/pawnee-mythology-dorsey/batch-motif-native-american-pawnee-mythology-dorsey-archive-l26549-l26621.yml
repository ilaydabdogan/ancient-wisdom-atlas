canonical_text:
  quote: ''
  summary: 'A sequence of Pawnee myth abstracts recounts: Burnt Belly and a Dog whose
    dreams and protection bring food, war success, marital surveillance, and final
    petrification; a poor young man who receives the Sun-Dance from Eagle, Swans,
    Owls, and other birds; a hunter taught the Sun-Dance by a speaking skeleton named
    Knee-Prints-Upon-the-River-Banks; a girl bewitched in connection with a hollow
    tree, a strange child, and a Fox, then cured by a medicine-man; and a graveyard-dwelling
    ghost-man who heals through whirlwind and dust before becoming a whirlwind and
    skeleton.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman and her poor grandson live in a grass-lodge; the boy feeds a
    Dog, and the Dog brings them meat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Dog appears in dreams, tells the boy to go on the war-path, and promises
    protection.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The Dog helps the boy capture a horse and later gives him owl feathers, a
    bone whistle, and red paint.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Dog tells the boy that the sun is his father, that the sun protects him,
    and that the father of Dogs sits near Tirawa.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy repeatedly returns with scalps, is recognized as a warrior, marries,
    and relies on the Dog to watch over his wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When a man visits the wife and kicks the Dog, the Dog does not meet the returning
    husband; the boy and Dog later sit on a high hill until they turn into red sandstone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A poor young man goes to a hill, cries, and by the fourth night hears drumming
    clearly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The young man sees Eagle, follows him, and finds birds sitting in a circle
    with two Swans in the center drumming while the birds whistle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Eagle says the birds will give the young man their dance; the Swans describe
    fasting, dream instruction, and when to give the dance; Owls teach him songs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The young man thereafter institutes the Sun-Dance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A skeleton approaches a hunter and his wife, the man gathers the bones in
    a robe, and a voice identifies the being as Knee-Prints-Upon-the-River-Banks.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The skeleton smokes with the man, says he controls all animals and birds,
    and teaches him the Sun-Dance.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: A young girl finds a hollow fallen tree containing a strange child with long
    hair, thin arms, long fingernails, yellow face paint, and a black forehead.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the child disappears, the girl screams and acts like Fox, and Fox runs
    from the group.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: A medicine-man places the girl over smoke; she vomits white clay and Fox hair,
    and he sucks hairs from her body.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: A graveyard-dwelling man is associated with whirlwinds, cures by throwing
    dust that envelops a sick person as a whirlwind, and later becomes a whirlwind
    and falls down as a skeleton.
  category: sequence
  evidence_refs:
  - ev:9
