  quote: ''
  summary: After parting from Young-Duck, the girls agree that she should lead them.
    Each day they come to her tipi and ask to go for wood. Young-Duck accepts, takes
    her stick and strings, leads the girls in line into the timber, and stops at each
    cottonwood tree, telling the others to continue gathering wood and not pay attention
    to her.
