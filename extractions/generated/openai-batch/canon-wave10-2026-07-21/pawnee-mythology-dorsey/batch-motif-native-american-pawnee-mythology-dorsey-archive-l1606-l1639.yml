canonical_text:
  quote: ''
  summary: A Pawnee lodge ceremony proceeds through smoke offerings, pipe passing,
    food preparation, fat offerings to named sacred recipients, handling of plum sticks
    representing four northern gods, disposal of those sticks in creek water, purification
    of ceremonial objects with sweet grass smoke, retying and hanging of the bundle,
    distribution of meat, and a closing statement that the gods have accepted the
    offering and will send good gifts.
  language: English
  quote_policy: summarized
