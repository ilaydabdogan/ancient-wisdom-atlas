canonical_text:
  quote: ''
  summary: A poor boy identified as the returned Animal-Boy uses a ring to provide
    buffalo meat for an old couple. The passage then introduces Stone-Man, a man made
    invulnerable by a man of stone. A red fox scares buffalo away, causing hunger,
    and the chief promises his oldest daughter to whoever kills it. Belly-Boy/Burnt-Belly
    directs his grandmother to build a trap, catches the fox, is challenged by Crow-Feathers,
    and returns with the fox hide.
  language: English
  quote_policy: summarized
