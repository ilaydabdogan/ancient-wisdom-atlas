canonical_text:
  quote: ''
  summary: The passage gives abstracts of Pawnee narratives in which war-party leaders
    and other persons receive power through prayer, dreams, visions, sacred objects,
    offerings, and bundles. One warrior receives a storm-associated arrow that later
    returns to the clouds when neglected. Spotted-Horse receives instructions, sacred
    materials, a bundle, and Sun protection, becoming a successful warrior and chief.
    A boy searching for buffalo encounters artichokes, the Wind, and a man with a
    hawk headdress who asks for offerings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man on the war-path travels west to a mountainous country, suffers
    hunger, and the blamed leader ascends a hill to pray.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the fourth night the praying man faces west, is surrounded by storm, lightning,
    and thunder, and falls into a trance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After awakening, the man finds a small black arrow with flint point and stone
    shaft on his breast, offers smoke to gods and to the arrow, states a condition
    about neglecting it, and wears it over his breast.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A protector of warriors visits the leader in vision and tells him where to
    find an enemy camp; the party captures ponies and escapes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The leader offers horse hair to his protector on the return journey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the leader later leaves the wonderful arrow behind while aiming at a
    buffalo, a dark cloud appears; the arrow escapes despite efforts to hold it, returns
    to the clouds, and becomes part of lightning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The same mysterious being visits the mourning warrior, reminds him of the
    condition under which the arrow was given, and says he will be a great warrior
    but never a chief.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A man dreams of a mysterious being with a painted buffalo robe, lariat, and
    bundle, and is told to stand on a hill for four days to receive power.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The man finds sun glass and blue stone, makes them into a pipe with an unperforated
    stem, skins a wild-cat for the bundle, and later smoke passes through the unperforated
    stem.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The man says his protector is the Sun, travels on the east side of his companions,
    takes ponies successfully, and becomes a chief.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The bundle and rites are transmitted to a young man, whose name changes with
    each new war-path success; as Spotted-Horse-Chief he leads a party against the
    Sioux with success attributed to the bundle rite.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Early in winter, people travel west on a buffalo hunt and pause exhausted;
    a boy decides to look for buffalo and goes out with moccasins filled with pemmican.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The boy eats an artichoke, feels better, and hears the Wind say he has been
    protected since long before birth.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The boy hears a noise like a feather striking a dry buffalo robe, sees more
    artichokes, and sees a man wearing a hawk's head dress who gives the head dress
    to him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The man with the hawk's head dress asks the boy to bring offerings of red
    paint, blue beads, eagle feathers, and tobacco.
  category: speech
  evidence_refs:
  - ev:9
