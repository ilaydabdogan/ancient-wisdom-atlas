  text: The men sit in a circle west of the root, and women with hoes are positioned
    in the west, south, east, and north.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man fills and lights a pipe, kneels, and gives four whiffs to Mother-earth
    before the digging begins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man addresses Mother-earth, asking permission to dig into her and remove
    a father or mother root for medicine bundles and use among sick people.
  category: speech
  evidence_refs:
