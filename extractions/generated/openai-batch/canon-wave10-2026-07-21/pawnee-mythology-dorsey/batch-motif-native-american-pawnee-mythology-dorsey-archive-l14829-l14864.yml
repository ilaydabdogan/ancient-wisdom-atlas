canonical_text:
  quote: ''
  summary: A ritual group thanks a sacred root, arranges men and women around it,
    and uses pipe offerings and prayer to ask Mother-earth for permission to remove
    it. Four women dig from directional positions whose meanings are explained. The
    root is found in human form, placed in the center of a circle, and honored with
    further smoke offerings to cosmic powers and to its body parts.
  language: English
  quote_policy: summarized
