canonical_text:
  quote: ''
  summary: 'The passage closes one buffalo episode in which a boy calf helps a young
    man survive tests set by buffalo bulls by identifying his calf-son and cow-wife
    through secret signs. The young man returns home, foretells the coming of buffalo,
    and the people later thank Tirawa for the game and buffalo. A new tale begins:
    during famine among the Kitkehahki on the Republican River, the people travel
    west seeking buffalo, settle in timbered country, and continue to face winter
    hunger. The chief calls for men to hunt far away. A boy identified as Coyote asks
    his mother to make moccasins so he can join the hunters, though she doubts him
    because he is not yet a man. A source note says the tale was told in bundle ceremonies
    and buffalo hunts to seek similar good fortune and to encourage young men and
    reverence for buffalo-game implements.'
  language: English
  quote_policy: summarized
