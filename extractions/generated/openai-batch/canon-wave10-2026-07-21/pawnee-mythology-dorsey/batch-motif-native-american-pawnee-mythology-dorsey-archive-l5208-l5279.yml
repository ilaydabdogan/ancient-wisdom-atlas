  - ev:3
  confidence: high
  cautions: The passage does not state how the young man came to have buffalo kin;
    only the recognition-test episode is present here.
- id: motif:2
  label: Recognition test of animal kinship under threat of death
  taxonomy_refs:
  - initiation
  basis: The buffalo bulls test the young man by requiring him to identify his son
    among calves and his wife among cows; successful recognition prevents his death.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The test is ordeal-like, but the passage does not explicitly call it an
    initiation.
- id: motif:3
  label: Return with promise of buffalo abundance
  taxonomy_refs:
  - return
  basis: After passing the buffalo tests, the young man returns home and announces
    that buffalo will come in great numbers in four days.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives the announcement and thanksgiving but not the full account
    of the buffalo arrival.
- id: motif:4
  label: Community departure in famine to seek buffalo
  taxonomy_refs:
  - departure
  basis: Crop failure and hunger lead the chief to order the people west to hunt buffalo,
    and later to send men far into the country.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: This is the setup for the new tale; later journey events are outside the
    provided passage.
- id: motif:5
  label: Child Coyote seeks adult hunting role
  taxonomy_refs:
  - trickster_boundary
  - initiation
  basis: The boy is identified as Coyote, plays with children, asks for moccasins,
    and wants to go with adult men to hunt buffalo though he is not yet a man.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The excerpt does not yet show Coyote's later actions or whether he succeeds
    in the adult hunting role.
- id: motif:6
  label: Ritual telling for hunting good fortune
  taxonomy_refs: []
