- id: obs:3
  text: The calves are arranged in a row; the young man walks around them three times,
    sees one calf wink, identifies that calf as his son, and is not killed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bulls set a second test with cows of the calf-mother's age in a row; the
