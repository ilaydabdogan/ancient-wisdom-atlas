canonical_text:
  quote: "“Always remember that when we die we live again.”"
  summary: The passage closes the story of a ghost-wife who had returned from Spirit
    Land. After conflict over moccasins and after the man strikes her, she disappears
    as a whirlwind, the child dies and is placed in her grave, she appears once more
    to declare that no more dead people will return because of the man’s wrongdoing,
    and the man starves at the grave. The passage then begins a new frame in which
    a child asks elders about men singing and rattling gourds for Tirawa.
  language: English
  quote_policy: quoted
