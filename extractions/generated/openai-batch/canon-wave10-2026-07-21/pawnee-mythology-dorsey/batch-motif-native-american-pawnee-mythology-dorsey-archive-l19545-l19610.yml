canonical_text:
  quote: ''
  summary: A boy living with Eagles is trained to fly, brings food to the old Eagles,
    and is judged strong. The old Eagle says the boy has received Eagle powers and
    should return to his people, but first the Eagles will seize the man who threw
    him into the den. The Eagles and Eagle-Boy fly to the village, identify the man
    by his eagle-feather robe, carry him into the sky, drop him into the den, kill
    and eat him, scatter his bones, and the people later name the place after the
    event.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Eagles tell the boy that the man had acted badly by dropping him into
    the den and that the boy would later help kill him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy practices flying out of the den while other Eagles watch him and prevent
    him from going back to the people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy repeatedly brings animals and fish to the old Eagles; when he brings
    a small deer, the old Eagles judge him to be strong.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: At night, the old Eagle says the young Eagle should return to his people because
    the Eagles have given him their powers, and he should be good to his people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The old Eagle also says he wants to eat the man who threw the boy into the
    den, and the Eagles agree to bring the man to the den.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: At dawn the Eagles and Eagle-Boy fly high in the sky toward the village to
    the east, where the people are located.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Eagle-Boy identifies the man seated on the south side of the village by
    his robe covered with eagle feathers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Eagle-Boy flies down and the Eagles swoop down in a funnel-shaped line,
    seize the man, and lift him from the ground while nearby men run to the village.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Eagles carry the man into the sky, unwrap his buffalo robe, grasp his
    flesh by the arms and legs, and drop him through the hole into the den, where
    he is killed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Eagles place the dead man before the old Eagles, eat him for several days,
    and scatter his bones over the earth.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: After the Eagles carry the man off, the people break camp and later call the
    site by a name referring to the Eagles carrying a man off.
  category: sequence
  evidence_refs:
  - ev:9
