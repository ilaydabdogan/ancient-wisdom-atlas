canonical_text:
  quote: ''
  summary: 'The passage contains compressed Pawnee myth abstracts: the defeat of Stone-Man
    and the founding of the Stone-Medicine lodge; the Fossil Giant Medicine-Lodge,
    in which a dream-revealed giant bone becomes a medicine bundle; and the beginning
    of the Squash Medicine, where defiant giants are destroyed by water and later
    provide medicine power through bones and a giant-derived root.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Stone-Man shoots repeatedly at a buffalo, but the arrow points stop in the
    buffalo's hair; he empties multiple quivers and finally uses four colored rush
    arrows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The buffalo rises and hooks Stone-Man; pieces of stone fall from him, the
    young man's two errand men batter him to pieces, and the girl throws the pieces
    into a boiling spring where steam fills the lodge and ascends from the top.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy and girl leave the lodge and return in the morning to find that it
    has become an earth-lodge of solid stone; the abstract explains this as the origin
    of geysers in the west.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The young man takes his wife home, starts an animal-lodge, and performs many
    miracles in which his wife participates, including flint-pointed arrows dropping
    from her body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Stone-Medicine lodge has on its altar a saved stone that is part of the
    girl's father; during a Sioux attack the keeper drops it into a river, it is not
    recovered, and the ceremony is transmitted by the boy and his wife to their children.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Near Swimming Mound, a man from a hunting party sleeps on a high hill and
    is addressed by a giant who says many giant people drowned there and that their
    bones are nearby.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The giant tells the man to find a thigh bone on the south side of the hill
    and says it will give him great power; after waking, the man finds the bone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The bone is carved with a man and woman, a skull, bow and arrows, many stars,
    and the sun and moon on the head; the man takes it home and makes it into a bundle.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The man later dreams again of the giant, who instructs him how to hold the
    ceremony and teaches songs; years later he holds the ceremony, becomes a great
    medicine-man, uses dust from the bone in doctoring, and those who touch the bone
    during a smallpox epidemic are immune.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Before ordinary people, a race of giants is so large that they can carry buffalo,
    lacks fear of wild animals or heavenly gods, reviles the sun, and insults thunder.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Tirawa decides to destroy the giants and sends rain; buffalo in the west move,
    water breaks through and covers the earth, and the giants are washed away to steep
    banks and other high places, where they sink into soft earth under lightnings
    and clouds.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Power is said to remain in the destroyed giants for later medicines, and their
    bones are said to have healing power.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: When ordinary people come to be on earth, Big-Black-Meteoric-Star visits a
    man, tells him where to dig for a powerful root sprung from a giant, explains
    the giants' destruction, and instructs him in obtaining and preparing the root.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The man recognizes the root as one feared because of its human-like odor,
    digs one out, sings the songs he was taught, and people lose their fear and join
    him.
  category: action
  evidence_refs:
  - ev:8
