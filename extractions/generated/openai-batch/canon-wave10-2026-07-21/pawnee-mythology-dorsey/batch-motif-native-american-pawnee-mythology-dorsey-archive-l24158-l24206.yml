candidate_motifs:
- id: motif:1
  label: Return of a dead or spirit wife from spirit land
  taxonomy_refs:
  - return
  - resurrection
  - death_rebirth
  basis: The woman is identified as a ghost/spirit; the young man attempts to wrest
    her from spirit land, and she remains among the living for years while her bones
    remain on the hill.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage emphasizes that she remains a spirit and that her bones remain
    elsewhere, so this is not clearly a bodily resurrection.
- id: motif:2
  label: Fourfold trial to retain a supernatural spouse
  taxonomy_refs:
  - initiation
  - mystical_quest
  basis: The young man faces four named trials to hold the spirit wife, failing three
    and succeeding on the fourth with help from her uncles.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage calls them trials, but does not explicitly frame them as an
    initiation or quest beyond the act of retaining the wife.
- id: motif:3
  label: Lost ghost spouse after mistreatment
  taxonomy_refs:
  - departure
  basis: After the husband repeatedly strikes the ghost-wife, she disappears as a
    whirlwind and later says she will never return.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage attributes the loss specifically to striking her; broader
    taboo or forbidden-act language is not supplied.
- id: motif:4
  label: Child of human-spirit union with ground-contact restriction
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: The spirit wife gives birth to a boy who is not allowed to touch the ground
