canonical_text:
  quote: ''
  summary: 'An abstract recounts a young man’s effort to keep a ghost-wife from spirit
    land through repeated nightly spirit visits, grave offerings, and four trials.
    The returned wife later disappears as a whirlwind after being struck, their child
    dies, and she declares that spirits will never again return from spirit land.
    A following abstract describes the end of the world: an earlier race of giants
    was destroyed by flood; Tirawa set a buffalo bull in the northwest to prevent
    a second flood until its last hair is shed; fire, celestial changes, and the Milky
    Way as a road of death are named among end-time signs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ghost woman warns the young man that she may disappear, though perseverance
    might let him retain her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spirits of children and musicians enter a lodge where a fire is always burning;
    the young man cannot see them at first, but sees them more clearly on later nights.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A spirit leader says the spirits have taken pity on the young man and warns
    him to guard his wife carefully.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The visiting spirits are identified as the girl’s relatives.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The girl can report events in the real world, including the people’s return
    to the village and her four uncles preparing fat offerings for her grave.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The young man faces four trials to hold the spirit wife while she struggles
    to free herself; he fails three times and succeeds the fourth time with the uncles’
    aid.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: During the successful trial, she flies upward and the young man tries to hold
    her by her hair.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: After eating com and beans, she announces that she will remain, and the uncles
    are to remain four nights in the tipi.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: The mother later digs at the grave and finds the daughter’s bones; the daughter
    says the bones are on the hill but that she is truly the daughter’s spirit.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The couple live happily for many years; the woman gives birth to a boy, may
    not cook or make clothing, and the boy is not allowed to touch the ground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: The husband takes a second wife, and later trouble arises over preference
    for the ghost-wife’s moccasins.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: When the husband repeatedly strikes the ghost-wife, she disappears; a whirlwind
    remains in her place, rises in the lodge, and exits through the top opening.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The child is dead by morning and is buried in the mother’s grave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:14
  text: After four days of mourning, the wife’s spirit reappears, says she left because
    he struck her, says she will never return, and says spirits will never again return
    from spirit land.
  category: speech
  evidence_refs:
  - ev:5
