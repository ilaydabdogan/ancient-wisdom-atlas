canonical_text:
  quote: ''
  summary: A young man follows a dream to a northeastern body of water, where a water-monster
    draws him into an animal medicine-lodge and teaches him about animal powers, songs,
    and a ritual image. After returning home, he constructs a sea-serpent image from
    willows, buffalo materials, mud, and dyed hide. In a later dream the water-monster
    appears as a medicine-man and teaches him how to catch an eagle so that he can
    obtain the feather needed for the image.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man wakes from a dream, deliberates for several days, decides to
    go to the big water he saw, and journeys for many days to the northeast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the big stream on a cloudy day, he sits on the bank and sees the water
    spouting up as the water-monster approaches.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The water-monster comes up and dives back three times; the fourth time it
    comes up, remains for a while, and then goes down into the water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The monster's breath seems to draw the man toward the water; he is afraid,
    closes his eyes near the water, and loses awareness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the man opens his eyes, the monster's head is at the south entrance,
    and animals of all kinds are present in the place where he is.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The monster says it came from the big waters with a message, controls animal
    beings in the big waters, and is in an animal medicine-lodge where animals will
    teach the man their mysteries.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The monster tells the man to make an image of the monster, place it in his
    lodge, stay there alone, and learn songs and powers through dreams.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that at this time the Skidi did not know there were birds
    and eagles, and the monster places the man back on dry land.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The man gathers willows, kills buffalo, uses a bull scalp and hair, tans and
    dyes hide for the head covering, covers the body with mud, and lacks a feather
    for the sea-serpent image.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: In a dream, the man sees a mud-covered man with red, blue, and yellow streaks
    on his face, many soft downy feathers on his head, and a longer downy feather
    on top.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The dream figure identifies himself as the Water-Monster and a medicine-man,
    and gives instructions for catching the high-flying bird by hiding in a grave-like
    hole on a high mound with rabbits as bait.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: The man prepares the trap as instructed; magpies and crows appear first, an
    eagle descends, and the man catches the eagle by both legs and pulls it into the
    hole.
  category: action
  evidence_refs:
  - ev:7
