canonical_text:
  quote: ''
  summary: The group lives in one place for several years while the young man provides
    game. The Loons ask the woman about their people and origin, and she says their
    home is far away. The Loons say they want to go to their people and that their
    father, taught the mysteries of the water fowls, should start a medicine dance
    among his people. One Loon tells the man to try to capture ponies from the enemy;
    he agrees, his wife makes moccasins for him, and he leaves. During his absence
    the Loons fly into the sky to spy around.
  language: English
