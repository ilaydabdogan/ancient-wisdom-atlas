canonical_text:
  quote: He went into the water and dived four times. When he came out he felt strong.
  summary: At night, the boy follows instructions by entering the water and diving
    four times. He emerges strong and finds himself dressed and armed. He meets a
    sister associated with a lodge, goes with her to her lodge, and is accepted by
    her brother as a brother-in-law. Soon afterward, when enemies attack the village,
    the boy fights them off and kills several.
