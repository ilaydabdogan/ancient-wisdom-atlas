canonical_text:
  quote: ''
  summary: A girl associated with a grave appears in the air with a boy. Her uncles
    catch and hold her until she says she will remain with them. In the lodge they
    find her bed covered with robes that had been placed in the grave. She eats corn,
    beans, and squash, says she will stay with the young man, and lets her uncles
    stay four days before returning to their people. The uncles report that their
    niece lives with the young man who had disappeared. The people come to the lodge
    and see her. Later her mother watches her, takes a hoe, goes to the hill where
    the grave was, and begins digging into it.
  language: English
  quote_policy: summarized
