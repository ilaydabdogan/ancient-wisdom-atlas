  quote: half women and half men
  summary: The passage opens in a time when the Kitkehahki lived near the Republican
    River and Swimming-Mound. Two gender-dual people go out with hoes and buffalo-hide
    sacks to look for artichokes. After finding none at first, they go farther downriver
    to a bank where many artichokes grow. While digging, one of them sees a man sitting
    nearby, shows no fear, continues digging, and quietly tells the companion about
    him. A note attributes the tale and describes a related ceremony known as Elk
    medicine.
