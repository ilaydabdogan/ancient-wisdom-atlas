canonical_text:
  quote: ''
  summary: The passage closes a previous account by saying that a bundle was lost
    and the Stone-Medicine-Men's ceremony no longer exists. It then narrates Tirawa
    creating a man and woman, their family, and Man-from-the-East's organization of
    lodges and named village groups. He teaches bundle ceremonies, gives Kawarakis
    bundles, assigns different sacred powers to descendants, and describes the migrations
    and ritual identities of the Pitahauirat, Chaui, and Kitkehahki. The passage ends
    with Crow-Feathers, also called Cheat-Coyote, tricking Animal-Boy into taking
    eagle form, stealing his buckskin leggings and moccasins, and leaving him unable
    to return to human form.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bundle associated with the Stone-Medicine-Men's ceremony is said to be lost;
    the people who knew the ceremony have died, and the ceremony no longer exists.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tirawa creates a man and a woman and places them on the earth; they have two
    sons and many daughters, and the two sons take wives.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old man, called Man-from-the-East by his children, says the family cannot
    all live in one lodge and directs that lodges be made to the right and left for
    his older and younger sons.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tipi to the right is named Leading-Village or Chaui, and the tipi to the
    left is named Small-Village or Kitkehahki.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Man-from-the-East teaches his two sons bundle ceremonies and gives them bundles
    like his original bundles; these bundles are called Kawarakis.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The older son's family makes a village near Nemaha, Nebraska; the other son's
    family makes a village near Little Nemaha, Nebraska; other families remain behind
    and increase.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Man-from-the-East instructs that the two sons' lodges must face west as his
    does, and that additional lodges made as the families increase must face east.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Man-from-the-East says the oldest son's descendants will communicate with
    animal gods and learn the mysteries of herbs and roots, while the younger son
    will understand stones and their power and strength.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Man-from-the-East says the people remaining with him will know the sacred
    things belonging to Tirawa and will be called Tirawa people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Kitkehahki go south, the Chaui go west, and the Pitahauirat stay east.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Pitahauirat are described as favored by Tirawa; the Chaui are described
    as watched over by heavenly gods.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Kitkehahki are described as having many bundles, understanding the powers
    of stones, and knowing a stone god that talks with people and makes them famous.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Among the Chaui, a young man is said to disappear and return as a wonderful
    young man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Among the Pitahauirat, a man with many names is called Cheat-Coyote or Crow-Feathers
    and is said to steal things from many people.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: When the three bands come together to offer buffalo to the gods, Crow-Feathers
    sees Animal-Boy from the Chaui band and wants his fine buckskin leggings and moccasins.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Crow-Feathers dares Animal-Boy to turn into an animal; Animal-Boy removes
    his leggings and moccasins and flies like an eagle.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: Crow-Feathers tells Animal-Boy to remain an eagle and not come down; Animal-Boy
