canonical_text:
  quote: They taught me the powers of the medicine-men.
  summary: The chief's boy returns at sunrise with decorated clothing and a bundle,
    and he and the poor boy go home. In his father's lodge, the chief's boy reports
    that the poor boy let him descend to the animals' lodge under the Wonderful River,
    where animals in a circle taught him medicine-men's powers and requested offerings.
    Gifts are gathered and taken back. In the fall medicine-men's lodge, the boys
    take special ritual seats, including a cedar-tree place reserved for one who has
    been taken into the animals' lodge. They later perform unmatched feats and become
    leaders of medicine and Bear dances. The poor boy's life is linked to the Bear;
    he disappears after taking a bear-claw robe and after people hear Bear screams.
    The remaining man maintains the Bear dance, teaches his children the mysteries,
    and the ceremony is said to continue among the Pawnee.
  language: English
  quote_policy: quoted
