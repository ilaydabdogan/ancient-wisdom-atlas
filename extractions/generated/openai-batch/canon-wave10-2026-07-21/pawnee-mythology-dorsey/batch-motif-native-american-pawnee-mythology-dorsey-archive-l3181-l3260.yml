canonical_text:
  quote: ''
  summary: A youth named Without-Wings, of the Eagle family, sits alone on a hill.
    Buffalo-Woman and Corn-Woman approach from opposite directions, sing to him, bring
    moccasins, and both become his wives. They live with him and his mother in an
    earth-lodge. Buffalo-Woman gives birth to a son on the prairie, and Corn-Woman
    gives birth to a son in a corn-field. The boys quarrel over a black buffalo-horn
    spoon and an ear of black corn; Buffalo-Woman leaves with her son, and Corn-Woman
    later disappears with her son into the under-world after promising unseen help.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Without-Wings' mother washes his face, combs his hair, and is proud of him
    because he is a handsome youth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Without-Wings does not associate with the other boys and spends his days alone
    on top of a hill; the people do not yet know he belongs to the Eagle family and
    has powers greater than theirs.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: While seated on the hill, Without-Wings hears singing from west and east,
    and two women approach while singing about their hearts beating when they look
    at him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman from the east is Buffalo-Woman, who sits on Without-Wings' right
    side; the woman from the west is Corn-Woman, who sits on his left side.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Buffalo-Woman and Corn-Woman each say they have brought moccasins; Buffalo-Woman
    puts a right moccasin on his right foot, Corn-Woman puts a left moccasin on his
    left foot, and Without-Wings says he takes both women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Without-Wings brings the two wives to his earth-lodge, where his mother joins
    them in living together.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Buffalo-Woman gives birth to a male child on the prairie, and Corn-Woman gives
    birth to a male child in the corn-field.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Buffalo-Woman's son has a little black buffalo-horn spoon, and Corn-Woman's
    son has an ear of black corn; the boys quarrel over the objects and fight.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the boys' quarrel, the mothers become angry, Buffalo-Woman runs away
    with her boy, and Corn-Woman says Without-Wings should follow Buffalo-Woman.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Corn-Woman tells Without-Wings that although he cannot see her, she will always
    be present and will help him; she and her boy then disappear and go back into
    the under-world.
  category: speech
  evidence_refs:
  - ev:7
