canonical_text:
  quote: ''
  summary: The passage gives the ending of a story about Ready-to-Give, a boy associated
    with Wind, who has been rejected by his people but invites them back, feeds them,
    calls buffalo, goes on the war-path, returns with ponies, marries the chief's
    daughter, and dies in old age. It then gives editorial notices for related variants
    and begins the tale of The Wonderful Boy, in which a Skidi young man gambles away
    his possessions and his sister's things, is rebuked by his father, is comforted
    and equipped by his sister, and departs westward.
  language: English
  quote_policy: summarized
