canonical_text:
  quote: ''
  summary: A Poor Boy living with a Witch-Woman and four powerful dogs journeys to
    the buffalo country after the Buffalo people decide to stop him from supplying
    the Witch-Woman with human flesh. Buffalo who become women learn his secrets,
    but an old Buffalo chief helps him win smoke, water, and running contests. After
    pursuit, concealment, and rescue by his dogs, the Boy redirects the old woman
    away from human flesh and toward seeds. The Buffalo council then decrees future
    relations between Buffalo and people, including smoke offerings, horn spoons,
    human running superiority, buffalo availability, robe use, and the northern divine
    status of White Spot and the buffalo girls.
  language: English
  quote_policy: summarized
