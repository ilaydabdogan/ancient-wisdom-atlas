canonical_text:
  quote: ''
  summary: Coming-Sun repeatedly tries and fails to intercept warriors and ponies
    that disappear into a ravine. A mysterious being reveals himself as Foot-Prints-upon-Bank-of-River
    and North-Wind, gives Coming-Sun a medicine bag and feathers, and appoints him
    as a medicine-man rather than a leading warrior. Coming-Sun later gains true prophecy
    and ritual powers, including instructions for calling buffalo and hiding warriors
    with buzzard feathers and dust.
  language: English
