canonical_text:
  quote: ''
  summary: 'Two Geese advise and assist a young man and woman who had fled from their
    people. The Geese scout for the young man, help him return with ponies and meat,
    and are seen by the village as behaving like people. After one Goose dies, the
    other leaves and foretells that the woman will bear two sons: one will die, and
    one will become great. The prophecy is fulfilled, and the surviving son becomes
    a warrior and medicine-man who starts the Geese society among the Pawnee.'
  language: English
  quote_policy: summarized
