canonical_text:
  quote: ''
  summary: A fragment recounts Kingfisher making a division into water and land, then
    turning into a woman when touched by a man. The man institutes a ceremony for
    the four gods of the north. In the ritual, eight priests use a bundle, altars,
    a bowl of water, feathered sticks with shell faces, red ointment, buffalo-hide
    moccasins, a buffalo beard, a kingfisher, rattles, song, and pipe smoke. The chief
    priest represents both a god who carries out Tirawa's wishes and the first man,
    reenacting Tirawa making land appear from waters. Notes compare the kingfisher
    idea with Skidi and Arikara traditions and explain turkey-feather symbolism.
  language: English
  quote_policy: summarized
