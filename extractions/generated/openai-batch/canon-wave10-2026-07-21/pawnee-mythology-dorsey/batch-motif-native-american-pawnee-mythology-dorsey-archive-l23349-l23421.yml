canonical_text:
  quote: ''
  summary: The passage summarizes a Pawnee myth segment in which a fleeing girl uses
    dropped objects to delay Long-Tongue, whose split skull becomes the sun and moon;
    it then summarizes how Evening-Star's daughter rules a lodge, kills suitors, and
    is overcome by a poor boy aided by Morning-Star, talismanic objects, animal helpers,
    and ritual instructions culminating in marriage, bundle-making, and a requested
    maiden sacrifice.
  language: English
