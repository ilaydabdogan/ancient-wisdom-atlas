canonical_text:
  quote: ''
  summary: A group of strange three-eyed, spine-covered beings enter while the husband
    is absent, eat the meat by the fireplace, warn that they will spare the woman
    only if she is quiet, and later kill and carry her away after she insults them.
    A boy on the bed is not seen; afterward he wakes and eats bones left behind. The
    father returns, sees the mother missing and blood on the ground, and understands
    that bad people killed her.
