  summary: A Gobbler repeatedly sings of acorns on trees and of walking far to places
    under the earth where white clay, yellow clay, and salt are found. After each
    stanza, an old man tells the people that the Turkeys have been to those places,
    explaining their white-spotted coats, yellow-painted mouths, and dandruff-like
    markings on their heads.
