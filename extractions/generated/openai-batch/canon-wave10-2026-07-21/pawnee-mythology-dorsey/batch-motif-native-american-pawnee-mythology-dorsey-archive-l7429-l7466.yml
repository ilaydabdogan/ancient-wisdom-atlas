canonical_text:
  quote: '"You are now dead as a human being. You shall again take life and become
    a locust tree."'
  summary: Two boys are invited into the lodge of sharp-elbow people, who plan to
    kill, cut up, and boil them. The strange boy perceives the danger, escapes with
    his brother, and the sharp-elbow people injure and scald one another until their
    grass-house burns. The strange boy then transforms the leader and others into
    locust trees, takes four thorns home as awls for his father, and the father reflects
    on the boy's power against dangerous beings.
  language: English
  quote_policy: quoted
