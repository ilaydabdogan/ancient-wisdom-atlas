canonical_text:
  quote: ''
  summary: 'A man dreams that a strange man commands him to take his people and a
    stone to Swimming-Mound on the Republican River. The dream gives ritual instructions:
    place and circle the stone, wait for storm signs, follow lightning to a hole by
    trees, crawl into a passage under the mound, and bargain with animals for their
    power by offering to remove the stone from their lodge entrance. On waking, the
    man smokes to the stone as Father, prepares his family to depart, travels to the
    mound, places the stone there, experiences wind and mysterious sounds, fasts,
    and sees elk around the hill.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After another rainstorm, the man dreams again and sees the strange man, who
    tells him to leave the village for Swimming-Mound on the Republican River with
    his people and the stone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dream instructs him to place the stone on the mound, stand on the south
    side facing north, sometimes walk in a circle around the stone, and remain until
    a rainstorm comes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dream tells him to watch for thunder and lightning, go to the lightning-struck
    riverbank, find a clump of trees and a hole, crawl into the hole, and place the
    stone at the entrance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The dream says the entrance will enlarge and lead under Swimming-Mound toward
    the animals' lodge, where mysterious noises and rubbing on the animals' sacred
    stick will be heard.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The dream says an animal will leave the lodge, find the stone at the entrance,
    return, and that the animals will seek a way to remove the stone.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The dream tells the man to appear to the animals, ask them to give him their
    power, and then remove the stone.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After waking, the man fills and smokes his pipe, gives whiffs to the stone,
    places his hands on it, addresses it as Father, and says he dreamed of it as a
    man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The man tells his kinfolk to prepare to move to Swimming-Mound because his
    father has spoken to him in a dream.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The household prepares food, fetches ponies, packs belongings, and departs
    quietly in a southwesterly direction without telling people in the other lodges.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After many days, the group reaches the Republican River and Swimming-Mound;
    the women pitch the tipi in the river bottom, and the man carries the stone in
    a buffalo robe to the mound.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: When the man prepares a place on the hill for the stone, wind begins to blow
    on each side of the mound.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The man thinks the mound is breathing on the stone, or that the animals of
    the mound are sending wind to remove the people's smells from the stone.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: At night the man hears strange noises from the mound, like rubbing sticks
    and drumming; he is not afraid, stays all night, and fasts through the following
    day.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: On the second night he hears strange noises, whistling, and a sound like strong
    wind, then sees a big drove of elk around the hill.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: When he sees the elk, the man closes his eyes and asks Father whether he should
    listen to these animals and whether they are to give him power.
  category: speech
  evidence_refs:
  - ev:11
