canonical_text:
  quote: ''
  summary: A young man wakes at a village site at dawn. The village site and its remains
    speak, identifying him as the child or son of White-Moccasins. He finds a speaking
    clam shell, which says that a Witch-Woman placed it there to follow his people
    and act in her place, but that its power failed and it became a clam shell. The
    shell says it called on the gods to send him back, tells him to follow a trail
    to find his people, and instructs him to drop it into the first stream of water.
  language: English
  quote_policy: summarized
