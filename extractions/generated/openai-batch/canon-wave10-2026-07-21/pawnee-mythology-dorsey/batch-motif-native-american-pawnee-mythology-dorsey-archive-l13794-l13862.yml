canonical_text:
  quote: ''
  summary: In a medicine ceremony, the owner and other medicine-men swallow ice- or
    glass-like power placed in water and retain it. A distinguished warrior asks to
    perform in the medicine-men's lodge, recruits and feeds a poor boy as helper,
    gathers sticky mud from a hill, has the boy make four mud ponies, tests them in
    sunlight, and later makes them walk, trot, and stop during a lodge performance,
    impressing spectators who give presents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men who revived stood in front of their willow lodges.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The owner instructed the errand man to place a wooden bowl of water west of
    the fireplace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The owner and three others went to powers described as looking much like ice
    or glass; the owner held one up, put it in the water, lifted it to his mouth,
    and swallowed it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After swallowing the power, the owner stamped his feet, beat the sides of
    his body with his palms, stood straight, and said he would keep the power within
    him; other men and medicine-men repeated the movements.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: A distinguished warrior entered the lodge, asked permission to take part in
    the ceremonies, and said he wished to perform sleight-of-hand tricks for the medicine-men.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The medicine-men accepted the warrior's request, and the warrior said he would
    prepare for three days and perform on the fourth night.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The warrior was described as a successful pony-raider and as wearing red and
    white clay, downy feathers, a robe, a belt with eagle legs filled with native
    tobacco, and an otter collar with an ear of corn.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The warrior brought a very poor boy to his lodge, fed him soup with dried
    meat, asked for help in the medicine-men's lodge, and the boy agreed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The warrior and boy went into the hills, dug sticky mud from the side of a
    high hill, carried it to the warrior's lodge, and the boy made four mud ponies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The boy set each mud pony in rays of sunlight coming through the lodge hole
    and moved the ponies as the sun rays moved around the lodge.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: In the night lodge performance, the warrior, assisted by the boy, made the
    mud ponies walk around the lodge; robe movement made them trot, and foot-stamping
    made them stop.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The medicine-men wondered because the warrior was not a medicine-man, and
    spectators gave many presents to the warrior.
  category: relationship
  evidence_refs:
  - ev:7
