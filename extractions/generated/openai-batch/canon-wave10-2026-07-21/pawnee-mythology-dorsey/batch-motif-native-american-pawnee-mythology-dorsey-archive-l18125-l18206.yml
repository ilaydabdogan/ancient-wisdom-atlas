canonical_text:
  quote: ''
  summary: Howling-Fox has a lodge completed, receives Buffalo-Woman and buffalo bulls
    there, offers pipe smoke and requested gifts, and is told that the Buffalo will
    provide food. Hoofprints in ashes and dried meat confirm the buffalo visit to
    the chief and men. Scouts find buffalo in a ravine, offer smoke to sky and ground,
    and the hunters are instructed about the coming hunt, including body parts to
    bring to the lodge and one cow not to kill because she is a messenger.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Howling-Fox tells the chief that he has been away and that the people will
    soon find plenty to eat; the chief orders the lodge finished.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Buffalo-Woman tells Howling-Fox that she brought bulls for the people, will
    come again with her father, and wants her father to receive native tobacco and
    eagle feathers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Howling-Fox has people keep away from the lodge, has a large fire made, and
    later scatters ashes around the fireplace and through the entrance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At night a buffalo bull sits in the west of the lodge while Howling-Fox fills
    and lights the pipe and blows smoke toward him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Buffalo-Woman says that her father is satisfied and that the people should
    kill some Buffalo because the Buffalo are thankful for the return of the girl.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Additional buffalo bulls enter the lodge to receive smoke, and one promises
    Buffalo to the people the next morning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Buffalo-Woman gives dried meat to Howling-Fox, and the chief, crier, and braves
