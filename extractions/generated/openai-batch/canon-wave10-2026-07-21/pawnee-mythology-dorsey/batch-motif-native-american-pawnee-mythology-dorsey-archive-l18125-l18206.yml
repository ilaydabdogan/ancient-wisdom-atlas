  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The chief tells the assembled men that the hoofprints were not made by men
    and points to the meat they are about to eat.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Three men first see no Buffalo from a hill, then return as instructed and
    find several Buffalo bulls in a ravine at the foot of the hill.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: After returning to the lodge, the three scouts each blow smoke toward the
    sky and the ground as a thanks offering.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The chief has the crier announce a buffalo attack, with ribs, tongues, and
