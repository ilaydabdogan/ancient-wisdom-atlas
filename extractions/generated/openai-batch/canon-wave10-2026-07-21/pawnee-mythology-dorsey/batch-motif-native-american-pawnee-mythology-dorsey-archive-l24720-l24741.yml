canonical_text:
  quote: ''
  summary: The supplied range contains two abstracted narratives. In the first, Hawk’s
    wife is stolen by a snake, the son searches for her in the under-world, the father
    follows, and the three are reunited and become Hawks before killing the snake.
    In the second, White Moccasin’s wife gives birth to a dog, which White Moccasin
    casts into a creek. Clam Shell rescues the dog, who becomes a boy, returns to
    his people, gains status, marries the chief’s daughter, receives warning and protection
    from a deer that becomes a girl, and defeats his father and other enemies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hawk, described as a great warrior, lives with his wife and child, and his
    wife disappears while he is absent.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The son searches for his mother in the under-world and passes through different
    villages; the father later starts after the little boy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The father, mother, and son find one another, turn successively into Hawks
    when struck by the father, and kill the snake that had stolen the woman.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: White Moccasin’s wife gives birth to a dog, and White Moccasin throws the
    dog into a creek.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Clam Shell rescues the dog, says that a witch threw him into the water, and
    tells him to follow the trail of his people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The rescued dog looks around and finds that he is now a boy; after looking
    around again, he discovers a quiver.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boy goes to his village, announces that he is White Moccasin’s child,
    and is taken to the chief’s lodge.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: On a buffalo hunt the boy is a leading spirit; after returning, he marries
    the chief’s daughter and they have many children.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the boy goes south, he sees a deer; after he looks again, the deer has
    become a girl who warns him that his father is trying to kill him and says she
    will protect him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The boy returns, invites men including his father to his lodge, and challenges
    his father to a contest in which the father has no power over him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy waves his hand, and his father begins to butt his head against everything
    he encounters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: White Moccasin’s friends try to kill the boy with clubs; the boy yells, and
    his enemies, including his father, fall down.
  category: action
  evidence_refs:
  - ev:6
