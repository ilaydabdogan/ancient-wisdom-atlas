canonical_text:
  quote: ''
  summary: A Chaui man lives with a woman for many years, hunts for her household,
    and cares for her children. The woman later joins the medicine-men's lodge and
    sits with the Bear family on the south side, avoiding the western Grizzly group
    because of their violent practice. In performances she makes a plum tree grow
    from hard ground inside the lodge, shakes fruit from it, performs other wonders,
    and teaches most of these things to her son.
  language: English
