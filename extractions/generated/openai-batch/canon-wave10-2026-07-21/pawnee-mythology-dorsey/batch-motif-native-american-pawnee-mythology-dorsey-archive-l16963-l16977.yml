  quote: ''
  summary: During a battle, the poor boy kills enemies while the chief's boy watches
    and admires his courage but remembers he has been told not to kill. The community
    recognizes the poor boy's powers, invites him into the Bear dance, and eventually
    makes him leader of its ceremonies. The chief's boy asks for the same powers,
    but the poor boy refuses. Winter arrives and the people begin preparing for a
    buffalo hunt.
