canonical_text:
  quote: ''
  summary: Handsome-Boy cries at the sight of dangerous things, but a strange boy
    reassures him and says they will kill some and take them home to their father.
    The strange boy touches Handsome-Boy’s legs and feet, making them heavy and covered
    with flint. The strange boy’s own feet and legs are described as protected like
    horned-toad skin and turtle shells. The two boys step on snakes, cannot be bitten
    through, kill four large rattlesnakes, skin them, and plan to arrange the rattling
    skins on a doorway for play.
  language: English
