  summary: A chief's son courts another chief's daughter, and the village expects
    them to marry because she openly favors him and her relatives permit their meetings.
    The chief's son decides not to marry her and plans to use his poor friend to create
    an accusation of faithlessness. He then asks the girl to meet him outside the
    village at night, and she agrees. A source note identifies the tale as Skidi and
    says it concerns the origin of a medicine ceremony and a moral about wives' faithfulness.
