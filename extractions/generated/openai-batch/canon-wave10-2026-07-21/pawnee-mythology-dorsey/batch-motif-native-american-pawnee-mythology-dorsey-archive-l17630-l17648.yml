  quote: He started out and went directly west.
  summary: A boy asks his mother for moccasins and food, says he is going alone rather
    than with a war party, receives moccasins filled with food, equips himself at
    night, and travels west. After his food is gone, he becomes hungry, weak, dizzy,
    and believes he is dying; he sees a hill and decides to go lie down on it.
