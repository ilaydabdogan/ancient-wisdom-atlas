canonical_text:
  quote: ''
  summary: Wolf-Man distinguishes himself on a war party by scouting farther than
    others, discovering enemy movements, helping capture enemy ponies, giving them
    to the leader, receiving the name Man-Who-Has-No-Leader, returning in victory,
    and thereafter becoming valued as leader of scouts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wolf-Man repeatedly stays behind when the war party starts, arrives last at
    camp, and reports what he has seen farther south than other scouts went.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Most of the warriors do not believe Wolf-Man's reports at first.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Other scouts later see Wolf-Man returning from a long distance ahead of them
    and report this to the main company.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wolf-Man reports that there are no signs of enemy in that direction and recommends
    going southeast toward the land of the Osage.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before daylight, Wolf-Man scouts ahead and returns after seeing Cheyenne and
    Arapaho breaking camp.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The company hides until noon, follows the enemy trail, and observes where
    the enemy are making camp and taking their ponies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wolf-Man is one of six scouts selected at night to capture ponies, but he
    leaves the group and drives ponies to the leader.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wolf-Man gives captured ponies to the leader, and the leader publicly names
    him Man-Who-Has-No-Leader.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Wolf-Man brings more ponies to the leader and again gives them all to him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: While other men ride captured ponies, Wolf-Man is seen walking and sometimes
    running without appearing tired.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The leader divides the captured ponies so that all warriors receive one, while
    Wolf-Man chooses one pony.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Near the village, the leader starts a prairie fire and has the young men paint
    their faces black with burnt grass.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Village people see smoke, then see the warriors returning over the hills on
    ponies and singing victory songs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: After this return, leaders invite Wolf-Man on future war parties; he is described
