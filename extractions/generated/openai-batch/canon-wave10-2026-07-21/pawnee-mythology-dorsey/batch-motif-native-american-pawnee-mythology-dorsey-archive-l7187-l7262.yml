canonical_text:
  quote: ''
  summary: A mysterious or strange boy is retained with Handsome-Boy and his father
    after hair and buckskin strings associated with him are put in a sacred bundle.
    The two boys grow up as brothers. Their father warns them against a dangerous
    bull-boat at the river, but the strange boy urges Handsome-Boy to go. In the boat,
    rising waves threaten them; the strange boy turns into a goose and flies, and
    Handsome-Boy follows by flying. After they return, the father warns them against
    another dangerous river place, a steep bank. The strange boy again urges Handsome-Boy
    to go, and they arrive at the bank and see many snakes below.
  language: English
  quote_policy: summarized
