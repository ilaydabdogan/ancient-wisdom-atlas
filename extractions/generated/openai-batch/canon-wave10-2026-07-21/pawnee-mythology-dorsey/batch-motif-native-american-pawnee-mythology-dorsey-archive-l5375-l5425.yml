canonical_text:
  quote: ''
  summary: The passage closes a story in which a boy or young man repeatedly meets
    a strange being driving buffalo, directs the people to kill buffalo, explains
    that the wonderful being gave him birth-power, watched over him, drove away and
    restored the buffalo, and then leaves for North-Wind, never returning. The passage
    then begins a story titled "The Man Who Married a Buffalo," in which a young man
    who rejects women pursues buffalo cows, has intercourse with a young cow stuck
    in mud, and the following spring buffalo cows begin to have calves. A note identifies
    the tale as a variant about a man marrying a buffalo and says its object is to
    teach human relatedness to buffalo and to help bring buffalo to be slaughtered.
  language: English
  quote_policy: summarized
