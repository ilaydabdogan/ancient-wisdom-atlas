canonical_text:
  quote: ''
  summary: Animals in a lodge thank the boy for presents placed in the water, send
    him for more presents, and then give him further instructions. Four little men
    identify themselves as animals with lethal jaw power and direct him to kill and
    skin the smallest one, leaving the skull or head part in the skin. After preparing
    the hide, the boy is told it gives him the same power and can be used at a creek
    against an enemy attempting to poison him. The animals also tell him their mysteries,
    including roots and herbs.
  language: English
