canonical_text:
  quote: ''
  summary: A man whose medicines are herbs receives dream instructions for making
    and using a javelin game with celestial, directional, buffalo, and curing associations.
    A separate abstract describes a lost warrior who appeals to spirits, hears a singing
    buffalo cow, learns mysteries and a song, receives war-related powers, and thereafter
    succeeds on the war-path.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man whose medicines are herbs sleeps in the open and sees stars in the sky
    appearing as sticks and rings of a javelin game.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man appears to him in sleep and instructs him to make gaming sets like the
    ones he saw and to play on the west side of the village.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The west is described as the home of buffalo, the east as the home of diseases,
    the south as the home of the dead, and the north as the direction from which enemies
    come.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: He is instructed to make an ash bow and dogwood arrows, kill two buffalo bulls,
    and use their hides as wrappings for two javelins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wood for javelins is to be cut with actions associated with the north, east,
    south, and west, addressing enemy, disease, death, and preservation of the tree's
    leaves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: He is told to smoke to the heavens to remind them that they gave him the game.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Two body-length sticks are to represent men, and two shorter sticks are to
    represent one-horned buffalo in the west.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: A buffalo cow is killed with her head toward the east, and skin from about
    the vulva is removed to make a ring.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The gaming sticks are made to represent ears and a single horn, and cross
    sticks represent legs; the front cross stick represents the sun and the hind one
    the moon.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: The sun and moon are said to have first played the game in the heavens; the
    moon won and gave the sticks to men.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: One prepared stick is charred black to represent darkness, night, or north;
    another is left white to represent light, day, or south.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: A white bead tied to the ring represents the star that gave him the game.
  category: object
  evidence_refs:
  - ev:4
- id: obs:13
  text: The ring is carried by his granddaughter and is said to represent the granddaughter
    of men.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:14
  text: At the gaming ground they smoke to the star, to earth, and to the ring and
    javelin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: The game count is one hundred and twenty, described as the number of fingers
    and toes on six individuals, and values depend on the ring's relation to parts
    of the javelin.
  category: other
  evidence_refs:
  - ev:5
- id: obs:16
  text: The losing side furnishes fire for boiling meat for an offering, and pieces
    of heart and tongue are offered to the sun, moon, and stars.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: At the end of the game, the game and player are rubbed with fat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:18
  text: In a later night visit he is told to make a ring from a buffalo calf, put
    a blue bead on it to represent Tirawa, and understand the ring as representing
    earth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:19
  text: For doctoring a sick person who had played with the sticks, dust is taken
    from the center of the ring's stopping place, smelled by the sick person, and
    rubbed over the body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:20
  text: Other men make gaming sets in imitation of this first set, and the owner uses
    the black javelin as a pipe-stem in the medicine-lodge though it is not perforated.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:21
  text: In the second abstract, warriors are taken by an enemy; one hides, loses his
    way while returning home, and cries to spirits.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:22
  text: On a hill, the lost warrior hears a buffalo cow singing in the east.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:23
  text: The buffalo cow teaches the man many mysteries and gives him power to travel
    without fatigue and capture ponies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:24
  text: The man sings a song learned from the buffalo at sunrise and thereafter is
    always successful on the war-path.
  category: sequence
  evidence_refs:
  - ev:7
