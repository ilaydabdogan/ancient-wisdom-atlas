canonical_text:
  quote: ''
  summary: 'The passage ends a Wolf-Man narrative with a fast-walking companion, a
    root learned through a dream-like encounter, a difficult journey, livestock taken
    from a Mexican village, Wolf-Man’s old age, transmission of secrets and songs
    to his son, and death when the morning sun enters his earth-lodge. It then gives
    the story of Coyote and Wolf Medicine: a man smokes Coyote’s pipe, is taken to
    Coyotes and Wolves, receives medicinal roots, a healing whistle, and bones associated
    with killing, protection, and Coyote power, returns home, signals with the whistle,
    and cures a urinary illness. The passage begins the next story with a failed war
    party in Comanche country and a wounded man.'
  language: English
  quote_policy: summarized
