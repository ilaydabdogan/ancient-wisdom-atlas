canonical_text:
  quote: ''
  summary: The passage summarizes several Coyote abstracts. In one, a buffalo skull
    taunts Coyote, pursues him into a village, devours nearly everyone, and chases
    four girls; packstrings create obstacles, and the youngest is saved when a small
    boy identified as Milkweed breaks the skull with a blue bead blown from his mouth.
    In another, Coyote envies buffalo, becomes buffalo through a wallow episode, repeatedly
    shifts between coyote and buffalo, ignores a warning about traveling toward humans,
    escapes hunters by falling over a precipice and becoming Coyote again, and is
    finally gored to death when buffalo pretend to transform him again. A final brief
    abstract says Coyote’s wife and child run after buffalo, after which the family
    decides to scatter over the country.
  language: English
  quote_policy: summarized
