canonical_text:
  quote: ''
  summary: A powerful chief's favored son is blamed for failed war parties, rejected,
    and leaves home to die. At a lake he offers his clothing to the lake spirit, sees
    horses and buffalo in a vision, is trampled and seemingly killed, and then finds
    himself in a lodge beneath the lake. Buffalo and horse beings say they pity him,
    will make him a medicine-man, and teach him dances. After reporting to his parents
    and bringing presents, he receives gifts from the horses and buffalo, returns
    home, and becomes a successful warrior.
  language: English
  quote_policy: summarized
