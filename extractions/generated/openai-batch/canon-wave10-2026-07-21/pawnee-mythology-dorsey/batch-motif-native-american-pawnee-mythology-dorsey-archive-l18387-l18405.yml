  quote: ''
  summary: A boy playing on a hillside sees an old lean Buffalo, addresses him as
    grandfather, and pities his age. The Buffalo replies that he is old, notes that
    the boy's people kill and eat buffalo, and says he wants to give the boy something
    before dying. The boy feeds the Buffalo grass. After eating, the Buffalo gives
    the boy a small stomach-carried ball with magic powers, saying that smelling it
    will allow the boy to see him. A note states that the boy receives power from
    the buffalo and becomes a great medicine-man.
