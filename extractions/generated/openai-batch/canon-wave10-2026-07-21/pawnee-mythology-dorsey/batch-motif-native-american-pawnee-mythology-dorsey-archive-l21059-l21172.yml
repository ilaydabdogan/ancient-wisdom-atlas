canonical_text:
  quote: ''
  summary: The passage contains the end of “Coyote and the Scalped-Woman,” in which
    Coyote taunts Scalped-Woman, disguises himself as other men, leads her into a
    rocky hole where she becomes stuck, has sexual connection with her, is declared
    her husband, and later leaves. It then gives “How a Witch-Woman Was Killed by
    Coyote,” in which Coyote encounters Spider-Woman, whose laughter and dancing at
    his exposed body part continue until she dies; an appended note explains the tale
    as a warning for girls. The passage also begins “Coyote Marries His Daughter,”
    introducing Coyote’s household, sickness, songs between husband and wife, and
    a note stating that the story warns young men against marrying their own daughters.
