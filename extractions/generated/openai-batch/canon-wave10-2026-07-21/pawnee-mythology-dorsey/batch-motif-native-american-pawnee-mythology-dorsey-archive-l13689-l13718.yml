canonical_text:
  quote: ''
  summary: A Pawnee medicine ceremony is prepared inside a lodge. Errand men prepare
    ash wood implements for the altar; medicine-men and their wives gather with food.
    Specialists who know secrets of animals or heavenly bodies ask to participate.
    The man directing the rite places water drums, organizes a procession, instructs
    men to cut cottonwood trees and willows for arranged positions in and around the
    altar and lodge, throws men down as they go, and some vomit corncobs, sticks,
    or roots. At a creek he waves an eagle wing, sends the men into the water to swim,
    and tells them to wash clean daily before performing wonderful things.
  language: English
  quote_policy: summarized
