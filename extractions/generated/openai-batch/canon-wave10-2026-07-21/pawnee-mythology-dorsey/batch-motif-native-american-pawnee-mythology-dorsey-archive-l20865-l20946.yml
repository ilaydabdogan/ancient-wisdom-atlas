canonical_text:
  quote: ''
  summary: The child of Handsome-Boy cries for his father and points the mother toward
    a tipi where Handsome-Boy is with another woman. The child's mother later attacks
    Handsome-Boy and threatens to kill him and the child; the new wife strikes her,
    and a man kills her. Chiefs guard and counsel Handsome-Boy, but he renounces rule,
    prepares scalp-and-eagle-feather leggings, tells the people he has been to the
    Spirit-Land, gives teachings from the spirits, and disappears; the passage explains
    this as the origin of similar Pawnee ceremonial leggings. A separate account tells
    of a war party that hears a woman-like cry, discovers a cedar tree crying, ignores
    one man's warning, and is destroyed by enemies while the cautious man survives
    to tell the story.
  language: English
  quote_policy: summarized
