canonical_text:
  quote: ''
  summary: A troubled boy in a quiet tipi throws aside his robe and says he is ready
    to be killed. He asks the assembled people to look at him and see his trouble.
    Little men sit on the west side, other men sit in a circle, and a distinctively
    dressed man with white clay face streaks, black feathered lariat ropes, and a
    tied war club sits on the south side. The people say they lack the power to grant
    the boy's wish and defer the decision about animal assistance to two errand men
    near the entrance. A Raccoon is on the north and a Muskrat on the south, though
    the passage breaks off before completing the sentence.
