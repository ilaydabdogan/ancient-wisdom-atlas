canonical_text:
  quote: ''
  summary: The passage gives abstracted episodes in which Long-Tooth-Boy defeats dangerous
    animal beings, protects his family with a magically enlarged stone corral, teaches
    the people, gives buffalo, and disappears leaving a flint for a sacred bundle.
    It then summarizes Burnt-Belly, a poor man who receives visions by water, gains
    Sun-related shield power, fasts and dives four times, becomes transformed, marries,
    and becomes a successful warrior. The final fragment introduces a strange boy
    living beyond water, wearing a woodpecker-scalp cap and other animal-associated
    gear, and a woman who swims toward him despite water animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy awakens his brother, and they take an old woman's skin home before returning
    to a riverbank with many skeletons, a fire, and a groaning man nearby.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The groaning man asks the boys to warm their feet and step on his back, but
    Long-Tooth-Boy uses a magic flint to turn his legs into stone, stamps on the being,
    and kills it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The killed being is identified as a catfish whose back spines had caused the
    deaths of many people who tried to help it by stepping on its back.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The boys go east to a den of mountain-lions, strike the largest with an arrow,
    ride it home, and cause the other lions to disperse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Buffalo become angry because Long-Tooth-Boy killed a spotted calf and fill
    the sky with dust as they scatter over the country.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Long-Tooth-Boy, his father, and his brother make a circle of smooth stones
    that grows overnight into a high corral with one entrance.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Buffalo try and fail to break down the stone corral; some smash their skulls,
    and the buffalo eventually scatter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Long-Tooth-Boy tells the people he has overcome all bad animals, teaches them,
    gives them buffalo, and says his power comes from clouds, lightning, and flint
    stones.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Long-Tooth-Boy directs that his brother's skull be placed in the stone circle,
    smokes with his brother, disappears at night, and a large flint is found in his
    place and put in a sacred bundle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Burnt-Belly is a poor man who begs food from a man living apart from the village
    with his sister; the man jokes that Burnt-Belly is his sister's future husband.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: At a stream of water Burnt-Belly has a vision of a finely costumed man, who
    says Burnt-Belly will become a great warrior and that a young man's power comes
    from the Sun and is in his shield.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Burnt-Belly joins a war party despite protest, takes a scalp, and gives it
    to the leader.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: In a later dream on a riverbank, Burnt-Belly is told to fast for four days,
    dive into the water four times, and stand on the bank; after doing this he finds
    himself beautifully costumed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Burnt-Belly meets the sister at the river, asks her for a drink, and she follows
    him to her brother's lodge, where they spend the night together; afterward he
    repulses an enemy attack and leads a successful war party.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: A village is on one side of a stream; to the west are ponds with islands,
    where a strange boy lives.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:16
  text: The strange boy wears a cap of woodpecker scalps, has an otter quiver and
    black bow, and wears leggings with owl heads that hoot at night.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:17
  text: A strange woman braves water-animal dangers and swims over toward the boy.
  category: action
  evidence_refs:
  - ev:8
