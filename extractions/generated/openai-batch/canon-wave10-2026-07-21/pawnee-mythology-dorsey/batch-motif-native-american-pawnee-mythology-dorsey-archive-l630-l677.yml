  summary: The passage is an introductory methodological discussion. It previews comparative
    study of Pawnee tales, notes differences and similarities among Pawnee bands and
    Arikara traditions, discusses Coyote tales as more readily borrowed than ritual-related
    tales, describes differences in ceremonial richness among bands, and explains
    that the volume groups tales by character of tale rather than by band or informant.
  language: English
  quote_policy: summarized
