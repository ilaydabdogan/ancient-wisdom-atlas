canonical_text:
  quote: ''
  summary: A stranger is led into the animals' lodge, undergoes darkness and ritual
    handling of ice-like objects said to have been taken from his stomach, receives
    medicine power, hears an account of another man cured by the animals, learns performances
    and lodge prescriptions, and places a stone before the Big-Medicine-Animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The stranger is told to enter where the animals are, cry, be meek, and ask
    the animals for help.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the stranger enters the lodge, the animals walk around the fire; darkness
    follows, and when sight returns the stranger is lying on his back at the south
    inside the lodge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stranger is told to stand west of the fireplace and sees several things
    on the ground that look like pieces of ice.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man explains that the ice-like things were taken from the stranger's stomach
    by the animals and must be received into his mouth while he stamps his feet, so
    that they return to his stomach.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: As each thing is dropped into the stranger's mouth and he stamps, it seems
    to melt away and disappear back into his stomach.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The stranger is told that he now has power like the animals, including power
    to mesmerize and to throw things into people's stomachs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The stranger is seated near the entrance and sees all kinds of animals sitting
    around the circle, with two men at the entrance, one of whom is scalped.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The speaking entrance man says that in youth he was not in his right mind,
    was led away by a strange being in a snowstorm, and was taken into the animals'
    lodge.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The speaking entrance man says the animals cared for him and cured him, and
    that his condition was connected with his father killing a black-tail deer before
    his birth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The stranger remains in the lodge for several nights and is taught sleight-of-hand
    performances.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The stranger is instructed that when he builds the animals' medicine-lodge
    he should kill snipe and cranes and hang their skins inside the lodge.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: After the animals teach him all their powers, the stranger is told to bring
    in a stone and set it on the west side of the lodge before the leading animals
    called the Big-Medicine-Animals.
  category: sequence
  evidence_refs:
  - ev:5
