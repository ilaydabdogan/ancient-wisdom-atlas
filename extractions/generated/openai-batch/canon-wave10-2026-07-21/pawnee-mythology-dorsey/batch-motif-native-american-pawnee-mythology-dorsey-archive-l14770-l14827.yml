canonical_text:
  quote: ''
  summary: 'The passage explains an origin of root medicine associated with giants
    or large people. The Big-Black-Meteoric-Star teaches a man that feared odorous
    roots are transformed large people and possess curative power. The man is instructed
    to sing songs, offer pipe smoke, dig the whole human-shaped root, and read signs
    from the root: water oozing means consent, while escaping air means anger and
    loss of curative power.'
  language: English
  quote_policy: summarized
