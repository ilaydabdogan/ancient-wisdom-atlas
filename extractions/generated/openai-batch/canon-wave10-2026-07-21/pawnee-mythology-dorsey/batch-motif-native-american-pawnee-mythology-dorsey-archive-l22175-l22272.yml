- id: obs:4
  text: The men say the Buffalo are holy and that their meat should be taken to the
    priest's lodge.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: One fast Buffalo reaches a high precipice, falls, turns into a Coyote, and
    runs away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old people say that the Coyote must have been turned into a Buffalo by
    another Buffalo.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Coyote asks the Buffalo bull to take pity on him and let him turn into a Buffalo
    again.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Buffalo bull tells Coyote to find a buffalo wallow, then hooks him repeatedly
    there and kills him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The narration says that since that time Coyotes have been willing to be Coyotes
    and Buffalo have disliked Coyotes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: A Coyote lodge stands on the banks of a stream of water in the northern country,
    and Coyote-Man is away hunting.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: When Buffalo pass the lodge, the Coyote children and their mother run after
    them; the mother says they might as well chase Buffalo as stay and starve.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The youngest Coyote tires during the chase and sings about his father and
    the running Buffalo; the father overtakes and passes him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: A young Buffalo gives out, and the Coyotes surround, kill, and eat it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Coyote family decides that the children should scatter, and the narration
    says this is why Coyotes were found everywhere in the country.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: A passage note says the story was told to young people to teach them about
    long buffalo hunts and about Coyotes scattering over the earth.
