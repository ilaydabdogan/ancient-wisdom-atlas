canonical_text:
  quote: ''
  summary: In the visible end of 'Coyote Turns into a Buffalo,' Coyote in Buffalo
    form travels with Buffalo toward a village to get 'smoke,' misunderstands the
    phrase, is discovered with the herd, escapes human hunters by turning back into
    Coyote, asks to become Buffalo again, and is killed by the Buffalo bull at a wallow.
    The narration explains lasting relations between Coyotes and Buffalo. In 'Coyote
    Family Run After the Buffalo,' a Coyote mother and children pursue passing Buffalo
    while Coyote-Man is away; after a long chase, the family kills and eats a tired
    young Buffalo and then scatters, explaining why Coyotes are found everywhere.
  language: English
  quote_policy: summarized
