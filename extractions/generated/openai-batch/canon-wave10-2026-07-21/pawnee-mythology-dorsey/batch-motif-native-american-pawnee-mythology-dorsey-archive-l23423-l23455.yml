- id: obs:2
  text: A beautiful girl lives in a solitary earth-lodge west of a grass-lodge village;
    many young men die while attempting to marry her, and success would bring a sacred
    bundle from Tirawa and other blessings.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A rich boy goes north and fasts; on the fourth day a red-painted man identified
    as the Sun gives him a bow and arrow and says the girl is the daughter of Evening-Star.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy travels west with an old man and they overcome a deep canyon, a stream
    of water, thick timber, two bears, and two mountain-lions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The boy strikes the ground with his bow, after which remaining animals become
    quiet, including a great serpent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The girl accuses the boy of wanting to know Tirawa’s secrets, and inside the
    lodge they find a sacred bundle and four priests representing winds, clouds, lightnings,
    and thunders.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy is sent for a baby-board and cradle accessories and is aided by a
    mysterious being described in the abstract as presumably Morning-Star.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Four old men give the bundle to the girl and send the boy and girl out as
    husband and wife; men and animals in the lodge return into the heavens and timber.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boy and girl return to his people and teach them to build earth-lodges
    and explain the symbolism of the earth-lodge.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The second abstract is titled as a contest between Morning-Star and Moon.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: A Mysterious Man lives alone in a lodge on a hill, always returns successfully
    from hunting, and is connected to a village where famine prevails.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: The villagers wish to appeal to the Mysterious Man but fear snakes; Spider-Woman
    is willing to challenge him, and the chief invites the young man to become his
    son-in-law.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The young man declines the chief’s offer, saying he must feed the snakes and
    consult them; after another successful hunt he scatters meat for the snakes.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The snakes say they are willing if the young man can release them from a witch’s
    power; he releases buffalo from a cave and the people kill them, repeating the
    release on two following days.
  category: sequence
  evidence_refs:
  - ev:9
