canonical_text:
  quote: ''
  summary: The supplied passage contains abstracts for two Pawnee narratives. The
    first describes a rich boy’s quest to marry the daughter of Evening-Star, aided
    by the Sun, overcoming obstacles, entering a western lodge with a sacred bundle
    and four elemental priests, receiving the bundle through marriage, and returning
    to teach earth-lodge construction and symbolism. The second begins a narrative
    titled as a contest between Morning-Star and Moon, describing a Mysterious Man
    who hunts successfully, feeds and consults snakes during a famine, seeks to free
    them from a witch’s power, and releases buffalo from a cave for the people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first abstract is titled for the daughter of Evening-Star and her sacred
    bundle.
  category: other
  evidence_refs:
