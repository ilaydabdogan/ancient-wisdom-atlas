canonical_text:
  quote: ''
  summary: The passage summarizes two Pawnee myth abstracts. In one, Burnt-Belly changes
    into an eagle, gains and uses buffalo-calling power, and loses that power after
    lying with a girl before the proper time. In the other, an unnamed man meets Flint
    Man, receives flint-related powers for transformation, rain-making, healing, and
    protection, installs the transformed flint stone on an altar, and defeats several
    dangerous beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Burnt-Belly and his mother live in a deserted village and are very poor.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: After his mother strikes him for soiling his robe, Burnt-Belly turns into
    an eagle despite her protests, hovers near her, and later becomes a boy again
    after repeated requests.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Burnt-Belly's mother makes bows and arrows for him each morning and then buffalo;
    he kills game and later buffalo.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: People return to the village and later live in timber where they have plentiful
    meat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A chief fears the boy's power, asks him to call buffalo, and Burnt-Belly disappears
    as an eagle for several days before returning to direct a successful buffalo hunt.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief moves his village near the boy's lodge and offers him his daughter;
    Burnt-Belly refuses because the proper time has not arrived.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A girl visits Burnt-Belly's tipi and lies with him, after which he loses his
    power; the abstract states that if he had called buffalo four times first, he
    could have married and kept his power.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: An unnamed man travels to far prairie country and finds a man of flint who
    emits sparks of fire, can transform into any creature, and can see great distances.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Flint Man renders himself invisible by asking the man to smoke so that smoke
    gets into the man's eyes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Flint Man gives the man powers to turn to stone, bring rain during drought
    through a flint-and-water action, and cure sickness with pieces of flint.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Flint Man turns into blue flint and diminishes into a small stone marked with
    moon, stars, and sun; the man takes it home, places it on an altar, and friends
    bring offerings to it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The man visits a monster near a big lake, sees human bones, and kills the
    catfish monster by trampling its back while his flint feet protect him from its
    spines.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: People take the monster's fat for medicines, and the man later kills seven
    spotted calves who challenge strangers to slide downhill on a buffalo-rib sled.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The man visits a gluttonous buffalo bull in the west; when the bull tries
    to gore him, he turns into flint, the bull breaks off its horn, and the man kills
    it with an arrow.
  category: action
  evidence_refs:
  - ev:10
