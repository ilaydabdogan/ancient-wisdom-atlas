canonical_text:
  quote: ''
  summary: A boy waits in a hollow while two Buffalo go to another hollow, roll on
    the ground, and become women. The women sit beside him and ask about his reputed
    powers of escape. The boy confirms the report and explains that his arrows, their
    flint points, his bow, a grassy meadow, and finally a pond and mud hole are involved
    in his sequence of escape and vulnerability. The women are satisfied and the three
    start away.
