canonical_text:
  quote: ''
  summary: The Buffalo report that Red-Spider-Woman refused to give tobacco or the
    girl. The Buffalo chief orders the Buffalo to travel to her place. After a long
    southward journey, Curly-Eyes retrieves his girl and other Buffalo take away other
    girls, trampling Red-Spider-Woman's fields and lodge. Red-Spider-Woman runs to
    the prairie and begins to disappear into the ground, but the Buffalo trample and
    kill her. The Buffalo chief declares that she will remain underground as a human-shaped
    root with curative powers that people will dig for medicine.
  language: English
