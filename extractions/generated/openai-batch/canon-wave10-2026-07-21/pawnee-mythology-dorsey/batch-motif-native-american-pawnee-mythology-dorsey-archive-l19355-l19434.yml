canonical_text:
  quote: ''
  summary: A healed man gives requested presents to Scalped-Man, returns to a medicine
    ceremony, demonstrates ventriloquistic sleight-of-hand, and later defends the
    village with medicine-warrior powers. After a long life he dies by suicide when
    he senses Scalped-Man is gone. The next account begins with a Pawnee man who disappears
    during village relocation, later returns covered with eagle feathers, keeps apart
    from the people, disappears again, and returns with more eagle feathers tied in
    a buffalo robe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people find the man in his own cave and are surprised that he is well.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man requests blue beads, native tobacco, a black silk handkerchief, and
    eagle feathers, then gives these presents to Scalped-Man in Scalped-Man's cave
    at night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the village, a Medicine-Men's ceremony is under way, with medicine-men
    performing sleight-of-hand said to have been taught by different animals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man performs by throwing his voice in different directions so it seems
    that many people are speaking.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: During an enemy attack, one enemy warrior is described as able to make arrows
    miss him and to ward off blows.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wounded man prepares for battle by covering himself with white clay, putting
    a downy feather in his hair, wearing an eagle-wing whistle, carrying wild sage
    in his left hand, and carrying a small war club in his right hand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The man blows the whistle, runs very fast, attacks the enemy from the rear,
    is not struck by arrows, kills the enemy warrior with a small war club, and kills
    many others.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The warriors later speak of an unidentified man covered with white clay and
    praise his bravery.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The man becomes a great medicine-man and warrior and is never injured in many
    battles.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: After a long life, the man commits suicide because something tells him Scalped-Man
    is gone and he no longer wishes to live.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the next account, the Pawnee move from near Nemaha, Nebraska, toward the
    Republican River, and one man wanders away.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The lost man later returns wearing a buffalo robe with the hair outside, covered
    with soft eagle feathers, with downy feathers on his head and one soft feather
    in his scalp-lock.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: The people infer from his dress and eagle feathers that he has been to an
    animals' lodge or another mysterious place.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The returned man stays apart, follows after the people have passed, sits on
    the south side of the village or javelin-game field, and does not allow any man
    to sit with him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: After disappearing again, the man returns with more eagle feathers, ties them
    in a small buffalo robe, and hangs the robe in his tipi.
  category: sequence
  evidence_refs:
  - ev:11
