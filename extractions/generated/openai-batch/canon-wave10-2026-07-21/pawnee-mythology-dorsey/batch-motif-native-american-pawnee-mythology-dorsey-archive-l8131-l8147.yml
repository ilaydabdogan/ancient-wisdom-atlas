canonical_text:
  quote: ''
  summary: A boy sends his grandmother to ask the chief for a young girl in marriage.
    The chief is angry, but the girl agrees and the chief consents. The boy is seated
    near the entrance of the chief's lodge and mocked by the two older daughters.
    After the fourth day Burnt-Belly-Boy goes away and returns as an eagle; when he
    becomes human, he wears eagle-feather clothing and a buffalo robe painted with
    the sun. The passage ends mid-sentence as the two oldest sisters try to leave
    their husband.
