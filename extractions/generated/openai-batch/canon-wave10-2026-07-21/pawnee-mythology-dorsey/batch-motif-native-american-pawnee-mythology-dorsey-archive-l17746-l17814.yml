canonical_text:
  quote: ''
  summary: A boy obtains tobacco, sweet grass, feathers, paint, and a black lariat
    rope, carries them to a Horse, and is taken to the lodge of the Buffalo. Horse
    and Buffalo give him speed, weapons, and battle substances. He returns, succeeds
    in horse-raiding and battle with a poor friend, marries a chief's daughter, and
    becomes chief. A jealous young man turns the wife's brother against him. The husband
    warns the brother-in-law not to ride the dun or black Horse while hunting, but
    the brother-in-law takes the dun Horse, chases Buffalo, and is killed along with
    the horse. The black Horse neighs, and the owner announces the death before others
    know it.
  language: English
  quote_policy: summarized
