canonical_text:
  quote: ''
  summary: A summoned Bear enters an animal lodge and cures a boy afflicted by a hard
    stone in his stomach. The Bear cuts the boy open, removes the stone, eats a piece
    of liver by prior agreement, closes the wound with breath, restores the boy to
    life, and grants him Bear medicine power. The boy later becomes Smoking-with-the-Bear,
    a powerful medicine-man associated with Bear ceremonies, Bear-Men practices, sunrise
    observance, smoking to the sun and bear, and the transmission and eventual loss
    of a secret medicine practice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A flying messenger returns to the lodge and reports that presents were delivered
    to a being who promised to help the boy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dust comes in at the lodge entrance, settles, and reveals that the arriving
    being is a Bear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bear is seated on the north side of the lodge so it can look at the sun.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lodge leader tells the Bear that the animals have failed to help the boy
    because the object in his stomach is a hard stone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bear says it will cure the boy if it may eat a piece of the boy's liver,
    and the boy agrees.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bear performs by standing on its hind legs, striking its breast, crying
    aloud, rolling in dust, and standing again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Bear blows its breath on the boy until he becomes unconscious, opens the
    boy's breast with a claw, removes a large round stone from the stomach, and eats
    a piece of liver.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Bear blows on the boy's mouth, nostrils, and wound opening until the wound
    closes and is well again, but the boy lies as if dead.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The animals cannot make the boy alive; the Magpie asks the Bear to restore
    him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Bear revives the boy by blowing on his nostrils and mouth, taking him
    in its arms, and hugging him; the boy breathes and stands up.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Bear calls the boy its son and gives him power to cut people open and
    eat their liver; the animals then teach the boy their powers.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: After returning home, the boy later confronts the Skidi man, shows a bear
    claw in his hand, makes it disappear, and the man falls dead.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Skidi people thank the boy for killing the man rather than mourning him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The boy becomes a great medicine-man, calls a live bear to medicine ceremonies,
    and is linked to Bear-Men cutting people open and eating their liver.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: The boy is also said to belong to the Deer society, and a quarrel over power
    is resolved when others fear he can take away the Deer family's fireplace and
    move turtles around it.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:16
  text: The boy takes the name Smoking-with-the-Bear, watches the sunrise from the
    lodge, sometimes smokes to the sun and the bear, teaches his son, and the secret
    ends with Medicine-Sun.
  category: sequence
  evidence_refs:
  - ev:12
