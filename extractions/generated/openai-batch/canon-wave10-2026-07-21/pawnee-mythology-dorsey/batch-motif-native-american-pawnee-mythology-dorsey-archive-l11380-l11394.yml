  quote: ''
  summary: A little Beaver tells a boy to follow and imitate him by diving into the
    water. The boy follows and reaches the Beavers' lodge. The Beavers say they pity
    him and will help him kill an old woman. They instruct him where to dive and promise
    to keep him while the woman remains underwater. An old Beaver cuts off a young
    Beaver's leg, boils the meat, feeds it to the boy, and throws the bone into the
    water outside the lodge.
