canonical_text:
  quote: ''
  summary: Spider-Woman lives with her daughters near a garden and kills visitors
    by challenging them to a jumping dice game and calling storms. Two powerful brothers
    go to her lodge, are warned by one daughter not to eat the food, take medicine,
    eat poisoned human brains and then human eyes served as food, and vomit each meal
    outside the lodge before returning.
  language: English
  quote_policy: summarized
