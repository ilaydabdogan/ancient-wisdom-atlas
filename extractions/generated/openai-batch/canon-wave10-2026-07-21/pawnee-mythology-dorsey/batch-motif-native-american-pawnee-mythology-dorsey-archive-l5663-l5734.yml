canonical_text:
  quote: '"Here lies the child of White-Moccasins.\nHere lies the child of White-Moccasins."'
  summary: An old Witch-Woman who dislikes a divinely protected child transforms a
    clam into her substitute, steals the child from White-Moccasins' lodge, carries
    him east, and raises him near a great water as her son. The bereaved village scatters.
    When grown, the boy is warned not to go west, but a Crow tells him he belongs
    west and a red Hawk guides him to a village site, where underground insects sing
    that he is White-Moccasins' child.
  language: English
  quote_policy: quoted
