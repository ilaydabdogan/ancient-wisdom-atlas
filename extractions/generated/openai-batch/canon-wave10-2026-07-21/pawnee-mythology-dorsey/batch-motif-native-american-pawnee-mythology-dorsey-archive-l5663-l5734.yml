  text: The old woman knows the child was born under the protection of a minor god
    in the heavens and dislikes the child.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a creek, the old woman tells a clam to take her place as Witch-Woman, blows
    her breath on the clam shell, and it becomes an old woman with a wrinkled face.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before daylight, the real Witch goes into the tipi of White-Moccasins, takes
    the little child on her back, and leaves the lodge.
  category: action
  evidence_refs:
  - ev:2
