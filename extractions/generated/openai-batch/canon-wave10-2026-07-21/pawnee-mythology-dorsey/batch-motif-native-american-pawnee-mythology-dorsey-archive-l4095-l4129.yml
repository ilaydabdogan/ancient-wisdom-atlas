canonical_text:
  quote: ''
  summary: 'The passage closes an episode in which the Buffalo, after being beaten
    by a boy, hold council and declare future relations between buffalo and people:
    people will hunt buffalo, eat their meat, use horns as spoons, smoke, and use
    robes. White-Star-on-Forehead and the Buffalo girls are killed and placed in the
    north as gods who send buffalo to the people. The old woman goes north; her descendants
    have seeds, while the boy''s descendants become warriors who do not plant. The
    passage then begins a new tale, naming the warrior and the black lightning arrow,
    with several young men on a war-path in a western mountainous country lacking
    food; a note says the tale concerns the origin of a warrior bundle centered on
    a black lightning arrow and teaches obedience to the heavenly gods.'
  language: English
  quote_policy: summarized
