canonical_text:
  quote: ''
  summary: The passage first concludes an episode in which a medicine-man says green
    moss from streams is needed to cure a young man who is half woman and half man;
    no moss can be found, Spider-Woman is blamed for its disappearance, and the young
    man kills himself from shame. It then begins a tale of a war party whose leader
    carries a sacred bundle but fails to offer smoke to the gods. The party attacks
    a village, is surrounded, and all are scalped but not killed. The survivors decide
    not to return home and instead live away among hills. A note explains a Pawnee
    belief that scalped men in warfare were not killed but wandered as supernatural
    beings, lived in the south, and could sometimes confer magic power.
  language: English
  quote_policy: summarized
