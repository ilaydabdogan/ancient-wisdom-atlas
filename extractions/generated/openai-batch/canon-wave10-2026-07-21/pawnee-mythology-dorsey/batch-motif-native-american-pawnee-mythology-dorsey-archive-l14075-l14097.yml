canonical_text:
  quote: ''
  summary: Crow-Feathers brings a fox home, and the chief gives him his daughter.
    The fox is displayed on a pole, but its hair falls off and appears bluish rather
    than red. The village remains without nearby buffalo, while a boy uses a bow,
    arrows, and a ring rolled by his grandmother; buffalo are found where the ring
    falls and are processed by the old man and old woman. The hungry people look to
    Crow-Feathers for help. Burnt-Belly instructs his grandmother to take pemmican
    to the chief's tipi, drop it, and describe it as fat used to grease the boy's
    eyes.
  language: English
