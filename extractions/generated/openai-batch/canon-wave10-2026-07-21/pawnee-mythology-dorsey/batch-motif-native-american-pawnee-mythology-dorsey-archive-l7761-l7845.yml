canonical_text:
  quote: ''
  summary: 'The passage first closes the Burnt-Belly episode: a formerly despised
    boy leads a successful war party, distributes ponies, publicly reveals his identity,
    and is chosen as chief and great warrior. It then begins the story of Woodpecker-Boy,
    a strange boy living on an island near a village. He wears animal-associated clothing
    and equipment, is visited by a woman who reveals herself as the Moon in swan form,
    receives a crossing arrow, enters a starving village, and goes into the timber
    to locate hidden foods and make animal images.'
  language: English
  quote_policy: summarized
