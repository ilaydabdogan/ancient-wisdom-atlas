canonical_text:
  quote: ''
  summary: A Pawnee party visits a Potawatami village with a young medicine-man. The
    young medicine-man notices a Potawatami man associated with an otter hide and
    bear robe. During ceremonies he is attacked with medicines but catches the thrown
    powers, which appear as sharp sunfish bones. At night he suspects bewitchment,
    is visited by a crawling figure with an eagle wing, follows the figure to a Potawatami
    lodge, and throws a mole skin at the man there. After leaving the village, he
    tells his companions that something placed in him will come out as they enter
    a stream; one companion pulls the thing from his mouth and throws it on the bank.
    The animal is burned, and news arrives that a Potawatami man died that morning.
  language: English
  quote_policy: summarized
