canonical_text:
  quote: ''
  summary: In a passage headed as the origin of the Pawnee Eagle Dance, a man who
    has been collecting eagle feathers from a hill seeks power from the beings inside
    it. He carries off his nephew, offers the child to be devoured in exchange for
    power and instruction, and the child falls through a hidden opening into the eagles'
    den. The eagles condemn the uncle's action, refuse him power, and decide that
    the child will remain with them and be turned into an Eagle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man repeatedly finds many eagle feathers on a high hill, stands by a soft
    downy feather, cries, gathers feathers, and knows he has received no power.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: While the people have their village on the Republican River, the man decides
    to learn what is inside the hill where the eagle feathers are found and considers
    what to do for the animals in the hill.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man finds his nephew among children, carries him away, and after many
    days says they are going to a wonderful place; the child's parents search the
    village and cannot find him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the hill, the man places the child on the downy feathers and says he gives
    his nephew to the being there to devour in return for pity, power, and teaching
    about the scattered feathers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: When released, the boy drops into a hole; the downy feather marks an opening
    used by eagles to fly in and out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the boy falls in, the man cries for several days, sees that he receives
    no powers, picks up feathers, and goes home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Eagles in the den whistle, jump up, look at the boy, talk among themselves,
    and declare the man's action wrong.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Eagles say the man stole his own nephew and that the child has a father
    and mother who are hunting for him, mourning for him, and love him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Two old Eagles, identified as the father and mother of the Eagles, sit on
    the east side of the den; their feathers are worn off and they look very old.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:10
  text: The old man Eagle says the man acted hastily to learn the Eagles' power and
    secrets, refuses to give him powers, says the child should remain with the Eagles,
    and gives consent to turn the boy into an Eagle.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Eagles fly around the den and around the boy, surround him in a flock,
    and when they fly up many feathers are scattered around him.
  category: action
  evidence_refs:
  - ev:6
