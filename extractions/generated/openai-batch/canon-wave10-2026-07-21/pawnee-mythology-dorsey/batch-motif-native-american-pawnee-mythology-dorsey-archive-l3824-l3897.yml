canonical_text:
  quote: ''
  summary: 'A boy among the Buffalo is addressed by an old Buffalo chief, who says
    the Buffalo want to kill him because his grandmother eats people instead of Buffalo.
    The old Buffalo helps the boy and instructs him in a pond ordeal against White-Spot-on-Forehead.
    The boy dives four times before dawn, causing White-Spot-on-Forehead to refuse
    to swim. The Buffalo gather in two opposing groups. The old Buffalo then tells
    the boy of a second challenge: a smoking contest at a dry cottonwood tree, with
    death as the penalty for losing. White-Spot-on-Forehead appears as a man, performs
    the smoking ritual, and his smoke scatters before reaching the top. The boy begins
    his own pipe ritual as the passage breaks off.'
  language: English
  quote_policy: summarized
