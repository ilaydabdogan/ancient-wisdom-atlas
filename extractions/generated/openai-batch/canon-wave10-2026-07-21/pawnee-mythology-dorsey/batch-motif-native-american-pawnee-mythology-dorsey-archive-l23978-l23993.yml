  quote: ''
  summary: In a famine, a chief directs the people west to find buffalo. After settling
    in timbered country, famine worsens and hunters are sent farther out. Coyote Boy
    follows the hunters, falls behind during snow, and is addressed by Snow Storm,
    who says he is the author of the boy's life. The boy receives artichokes, fast-travel
    power, magical food for his mother, and later a cap from his protector.
