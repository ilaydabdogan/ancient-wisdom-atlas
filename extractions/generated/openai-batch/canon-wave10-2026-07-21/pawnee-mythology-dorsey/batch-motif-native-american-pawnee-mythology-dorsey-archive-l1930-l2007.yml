comparison_claims:
- id: claim:1
  claim: The skull-to-sun-and-moon episode has the same narrative function as a celestial-body
    etiology, because it explains both the origin of the sun and moon in this episode
    and the human pictures visible on them.
  claim_level: same_function
  target: celestial-body origin and marking etiologies
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is functional only; no specific external tradition or historical
    relationship is established.
- id: claim:2
  claim: The passage explicitly supports comparison with constellation-origin narratives
    because it identifies the transformed heavenly group as the Pleiades.
  claim_level: same_function
  target: Pleiades / constellation-origin narratives
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The passage names the Pleiades but does not compare this account with
    other Pleiades traditions.
- id: claim:3
  claim: The earth-lodge in the second narrative is comparable in function to a terrestrial
    microcosm of celestial order, since stars are assigned lodge positions matching
    their heavenly stations and animals occupy the spaces between them.
  claim_level: same_function
  target: earthly ritual or mythic structure arranged as celestial order
  evidence_refs:
  - ev:7
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is limited to structural similarity within the passage; no
    ritual use or cross-cultural link is stated.
- id: claim:4
  claim: The North-Star red-bird episode supports a cautious comparison to sacred
    or celestial birth patterns, because a star-being fathers a child after appearing
    in bird form.
  claim_level: same_motif
  target: celestial father or sacred-birth motif pattern
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage confirms the celestial fatherhood but gives little information
    about the child's later role in the provided lines.
