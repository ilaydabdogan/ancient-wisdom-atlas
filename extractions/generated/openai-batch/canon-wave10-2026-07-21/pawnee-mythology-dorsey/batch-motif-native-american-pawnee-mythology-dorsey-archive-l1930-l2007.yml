candidate_motifs:
- id: motif:1
  label: dismembered head becomes sun and moon
  taxonomy_refs:
  - ascent
  basis: Long-Tongue's skull is split, and the two pieces fly into the sky and become
    the moon and sun.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The taxonomy reference is broad; the passage gives a transformation into
    heavenly bodies rather than a general ascent narrative.
- id: motif:2
  label: celestial etiology for markings on sun and moon
  taxonomy_refs: []
  basis: The passage explicitly says the transformation explains human pictures upon
    the sun and moon.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No external comparison is named beyond the explanatory function inside
    the passage.
- id: motif:3
  label: adopted woman becomes sister to a band of brothers
  taxonomy_refs:
  - sibling_pair
  basis: The youngest brother determines the woman's relation to the brothers, and
    they agree she will remain as their sister.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The available taxonomy item is singular 'sibling_pair', while the passage
    concerns a woman and a brother group.
- id: motif:4
  label: corn cultivation from a celestial bundle
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: The woman identifies Evening-Star as her mother, receives an ear of corn
    from the bundle, and plants it so more corn is gathered.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage does not explicitly state that this is the first origin of
    corn or agriculture.
- id: motif:5
  label: star father appears as bird and fathers a child
  taxonomy_refs:
  - sacred_birth
  - shapeshifter
  basis: North-Star identifies himself as father of the child and says he was as a
