canonical_text:
  quote: ''
  summary: 'The passage concludes a narrative in which a man destroys Long-Tongue,
    whose split skull becomes the moon and sun. The protected woman is adopted as
    sister by a group of brothers, plants corn from a bundle associated with Evening-Star,
    bears a child fathered by North-Star in red-bird form, and receives an account
    of the group''s future places among the stars and as Hawks. The passage then begins
    another narrative: heavenly gods build a western earth-lodge; Evening-Star sends
    her daughter, a guarded rain-wrapped bundle, and a mandate that the daughter kill
    young male suitors so women may overcome men.'
  language: English
  quote_policy: summarized
