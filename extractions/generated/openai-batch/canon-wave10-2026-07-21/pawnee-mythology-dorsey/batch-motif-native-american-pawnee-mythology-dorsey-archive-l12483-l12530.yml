canonical_text:
  quote: ''
  summary: Unnamed speakers tell the boy to return to his people with objects and
    teach their mysteries. The lost young man known as the medicine-child returns
    to his lodge and village. The old medicine-man who had poisoned him visits with
    his wife and presents. Later the young man visits the old man, recognizes another
    poisoned pipe, avoids swallowing the smoke, and uses his own tobacco-root-sumach
    mixture to make the old man sleepy. A chief then gives the young man presents
    and asks him to return the poison and kill the old man, whom the people fear.
  language: English
  quote_policy: summarized
