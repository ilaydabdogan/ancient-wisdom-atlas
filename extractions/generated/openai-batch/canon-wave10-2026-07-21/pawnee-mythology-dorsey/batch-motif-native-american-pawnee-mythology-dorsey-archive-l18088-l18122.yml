canonical_text:
  quote: She found a buffalo wallow and began to roll in it and turned into a Buffalo.
  summary: A weakened traveling group camps at the Platte River. At night Buffalo-Woman
    instructs Howling-Fox to build a west-facing earth-lodge and prepare eagle feathers,
    blue beads, and native tobacco. On the fourth night he brings the items, accompanies
    her, witnesses her change into a Buffalo at a wallow, and ties the gifts to buffalo
    bulls' horns. Through Buffalo-Woman's speech the bulls promise buffalo and give
    Howling-Fox power to call buffalo. Buffalo-Woman then covers him with her robe,
    blows her breath like wind, and brings him back to his home area.
  language: English
  quote_policy: quoted
