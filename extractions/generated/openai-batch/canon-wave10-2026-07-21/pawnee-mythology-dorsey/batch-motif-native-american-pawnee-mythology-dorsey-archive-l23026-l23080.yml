canonical_text:
  quote: ''
  summary: The passage concludes a tale in which Skunks have killed nearly all the
    Beavers, leaving one young Beaver. A diving bird guides the young Beaver into
    the water to the lodge of the killed Beavers, who declare the Skunks enemies and
    make the water their permanent home. The narrator adds that beavers have lived
    in water ever since and that people formerly returned beaver bones to water believing
    they would become Beavers again. A following tale tells how Wild-Cat, after Bear
    eats her young while she is hunting, follows Bear, cuts open his belly, and recovers
    her young. Coyote then takes the Bear meat, falsely boasts to his young that he
    killed Bear, and flees from an old Bear until he dies. A note says the story was
    told to children as a lesson about a small wild-cat killing a bear that slew its
    young.
  language: English
  quote_policy: summarized
