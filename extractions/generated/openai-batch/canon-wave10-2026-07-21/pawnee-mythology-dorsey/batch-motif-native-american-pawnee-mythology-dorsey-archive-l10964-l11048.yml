canonical_text:
  quote: ''
  summary: 'The passage ends a Coyote episode: a man in the hills refrains from shooting
    Coyote, asks for a story, throws a stick when Coyote does not respond, sings about
    him, and later attributes hunting luck to not having shot him. The passage then
    begins a Spider-Woman tale: a robe-wearing young man hears of missing young men
    and of Spider-Woman''s lethal tree-climbing contests, travels to her village,
    is hosted in a grass-lodge, and receives warnings about Eyes-Wide-Open and about
    foods identified as human body parts.'
  language: English
  quote_policy: summarized
