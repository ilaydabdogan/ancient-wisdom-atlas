canonical_text:
  quote: ''
  summary: 'The passage closes a Prairie Dog-wife story: a pregnant female Prairie
    Dog turns into a woman, lives with the boy and bears children, warns him against
    a particular woman, and leaves with the children after he violates the warning;
    they turn into Prairie Dogs, and he dies in misfortune. The passage then begins
    a gambler tale: two brothers are introduced, a dangerous nearby village is associated
    with a gambler and Spider-Woman, and the older brother is lured to the gambler,
    where deceptive food drains his power before a proposed game with sticks.'
  language: English
  quote_policy: summarized
