candidate_motifs:
- id: motif:1
  label: Animal spouse leaves after violated prohibition
  taxonomy_refs:
  - shapeshifter
  basis: The Prairie Dog wife transforms into a woman, marries the boy, forbids a
    sexual act with a particular woman, and returns with the children to Prairie Dog
    form after he violates the warning.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives only the conclusion of the broader tale; earlier causes
    are only alluded to.
- id: motif:2
  label: Boundary crossing before return to nonhuman kin
  taxonomy_refs:
  - return
  basis: The wife crosses a stream before declaring she will go to her people with
    her children, after which they turn into Prairie Dogs.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The stream’s symbolic function is inferred from its placement in the sequence,
    not explicitly explained.
- id: motif:3
  label: Loss, bad luck, and death after broken marital warning
  taxonomy_refs: []
  basis: After the young man ignores the wife’s warning, she and the children leave,
