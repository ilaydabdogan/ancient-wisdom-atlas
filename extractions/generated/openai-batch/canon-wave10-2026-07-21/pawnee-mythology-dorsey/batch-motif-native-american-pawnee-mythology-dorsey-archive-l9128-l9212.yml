comparison_claims:
- id: claim:1
  claim: The source note explicitly treats this gambler tale as a possible variant
    of No. 27 in the same collection.
  claim_level: same_motif
  target: No. 27 in The Pawnee - Mythology (Part I)
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The note also says this tale is not believed to be true in the same
    way as No. 27 and is therefore placed separately.
- id: claim:2
  claim: The source note links this tale to other versions from Pawnee bands, especially
    Kitkehahki versions with different details about the Gambler’s power and gaming
    implements.
  claim_level: same_motif
  target: Other Pawnee-band versions of the Gambler tale, including Kitkehahki versions
    told by Thief and White-Sun
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The variants summarized in the note differ in key details, including
    the source of the Gambler’s sticks, the loss of his power, and the helper or opponent
    figures.
- id: claim:3
  claim: The Kitkehahki variant summarized in the note shares the function of special
    gaming implements in a contest with the Gambler, though the implements are obtained
    through buffalo skulls rather than the details narrated in this passage.
  claim_level: same_function
  target: Kitkehahki variant with buffalo skulls becoming live animals and offering
    themselves as javelin and ring
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: This claim relies on the editor’s variant summary in the note; the
    main passage here has not yet narrated the contest or its implements beyond the
    proposed play with sticks.
