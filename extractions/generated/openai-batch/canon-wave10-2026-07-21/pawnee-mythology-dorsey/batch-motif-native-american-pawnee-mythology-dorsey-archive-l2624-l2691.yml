  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: On the fourth night the leading Crow gives the man the crow-feathered lance,
    teaches songs, gives paint, and instructs him to start the Crow-Lance society.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The leading Crow states that the lance carrier will be called the priest,
