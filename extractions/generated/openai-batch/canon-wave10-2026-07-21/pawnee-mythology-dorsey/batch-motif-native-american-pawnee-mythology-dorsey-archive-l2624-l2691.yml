  text: At evening the Crows return to their tree; after dark the boy hears strange
    noises or singing from the mountainside, and a voice from the tree speaks to him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Four times the young man has a chance to follow animals, but the Crows hold
    him back; on the fifth night the Crows on the trees disappear and singing is heard
    inside the mountain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man is taken into the side of the mountain and finds a large cave where
    Crow people sit in a circle and a crow-feather-covered lance stands in the west.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Crow people sing, imitate the Crow at the end of each song, and dance
