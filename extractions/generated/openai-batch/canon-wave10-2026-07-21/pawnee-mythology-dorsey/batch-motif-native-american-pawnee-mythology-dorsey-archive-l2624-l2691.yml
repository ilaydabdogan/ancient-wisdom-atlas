    it during buffalo-hunting marches.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Crow explains that the man was thought to have been killed by enemies,
    but Crows and Coyotes had frightened him; Coyotes wanted to eat him, while Crows
    revived him and gave him the dance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The tale gives a lesson that people frightened by a body of Crows and Coyotes
    may be killed, while those who do not become afraid will not be killed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The next section begins with the Skidi few in number somewhere in Nebraska
