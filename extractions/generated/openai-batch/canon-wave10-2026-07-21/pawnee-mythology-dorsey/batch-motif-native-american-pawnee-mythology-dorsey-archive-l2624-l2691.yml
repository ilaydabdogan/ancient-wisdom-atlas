canonical_text:
  quote: ''
  summary: A boy among the Crows hunts, cooks by a fire, hears singing from a mountainside,
    and is restrained by the Crows until he is taken into a mountain cave. There the
    Crow people dance around a crow-feathered lance, teach him songs and dances, give
    him the lance and paint, and instruct him to found the Crow-Lance society with
    a priestly lance carrier. The Crow explanation says Crows and Coyotes had frightened
    him to death; the Crows revived him, while the Coyotes had wanted to eat him.
    The next tale begins with a Skidi young man dreaming of a long water-monster coming
    up a big river; the accompanying note connects the tale to the pipe-stick or Calumet
    ceremony and reports a Skidi belief about Wichita borrowing.
  language: English
  quote_policy: summarized
