canonical_text:
  quote: ''
  summary: The passage summarizes the end of one Pawnee narrative in which a boy with
    mysterious power feeds famine-stricken people, summons buffalo through ritual
    actions involving North Wind, fasting, moccasins, directions, and a feathered
    stick, declines chieftainship, and later fills cache holes with corn. It then
    begins another narrative, “The Wonderful Boy,” in which a boy loses family property
    gambling, is rejected by his father, travels west through villages, and encounters
    unusual peoples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Food placed in a pot multiplies magically; the boy also receives artichokes,
    Indian potatoes, and buffalo meat, with which his mother feeds famishing people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy’s power increases until he can produce buffalo meat by reaching under
    a buffalo robe, and his father says only the son has mysterious power.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy visits North Wind and tells him to call buffalo.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boy asks that a grass-lodge be placed on the west side of the village,
    and two women enter and make moccasins.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: People given to the boy imitate buffalo bulls, cows, and calves and circle
    his lodge four times by way of south, east, and north.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The boy wears out many pairs of moccasins during four days and four nights
    while fasting.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Scouts report buffalo; some are killed, made holy, and their heads are placed
    toward the east so they may be restored to life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Further scouting reports six, eight, and ten buffalo on successive occasions,
    with increasing numbers killed and made holy.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At night all are ordered to be quiet, dogs are kept from barking, and the
    boy yells from a high hill toward the four directions; wind and snow begin.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At daybreak buffalo appear in every direction, with a circle of buffalo on
    a hill around the feathered stick used by the boy in calling buffalo.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy presents buffalo to the chiefs, eats grass before eating meat, says
    he is not to be chief, refers to Tirawa as maker of the people, and returns the
    people given to him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: After crop failure and renewed famine, the boy instructs the chiefs to clean
    cache holes, address skin receptacles for desired grain, place sacks in the holes,
    and cover them; on the fifth day the sacks are filled with corn.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the following narrative, a boy loses his belongings, his robe, his sister’s
    robe, and her trinkets in a ring and javelin game.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The boy’s angry father tells him to keep gambling until all family property
    is lost and then never return; the boy later travels west through several villages.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:15
  text: The west-traveling boy encounters naked people who hunt rabbits with clubs
    and later people without mouths who take nourishment by inhaling smoke from roasting
    meat.
  category: setting
  evidence_refs:
  - ev:10
  - ev:11
