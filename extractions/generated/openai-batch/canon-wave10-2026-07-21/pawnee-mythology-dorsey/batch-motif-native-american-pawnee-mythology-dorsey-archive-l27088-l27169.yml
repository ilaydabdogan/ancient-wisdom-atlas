canonical_text:
  quote: ''
  summary: 'The passage gives short abstracts of Pawnee animal tales: Coyote’s encounter
    with Artichoke; Coyote body-part etiologies for fruit and nut plants; Skunks deceiving
    and killing Beavers; Wild-Cat killing Bear and recovering her young; Rabbit’s
    lost tail; Rats receiving food knowledge from Magpie; Turtle escaping captors
    by pretending fear of water; and an animal war party defeated by foxes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote is challenged by Artichoke to bite it, devours it, is lifted from the
    ground by increasing flatus, and is finally washed away by his own excrement.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chief Coyote uses an unusually long membrum to fool women into thinking it
    is a snake; after it is gnawed apart underground, pieces are thrown in different
    directions and produce plum trees, grape vines, berry bushes, and nut trees.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: An underground insect states that coyotes will no longer have long membrums
    after the event involving Chief Coyote.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Skunks repeatedly summon Beaver medicine-men under pretense of treating a
    sick Skunk, kill them during the treatment, and use them as food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The last Beaver is taken underwater by a diving bird and finds the lodge of
    the Beavers who had been killed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The abstract says Beavers have lived in water and have been enemies with Skunks
    since that time, and that people throw beaver bones into water so they may again
    become beavers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wild-Cat follows Bear after Bear eats her young, fights Bear, opens Bear’s
    stomach, removes her young, and carries them home.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Coyote claims to have guarded Wild-Cat’s bear prey, receives the whole bear,
    tells his family he killed it, then runs from an old bear until he dies of fright.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Rabbit loses his tail on a willow limb; Turtle directs him to find it, says
    the willow will bear white fur in recognition of the event, and restores Rabbit’s
    tail.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Magpie tells Black Rat where to find artichokes and White Rat where to find
    ground nuts; rats have used these foods since then.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Turtle is captured on a war path; when captors threaten fire he says he will
    scatter it, and when they propose water he claims to fear it, is thrown in, and
    says he fooled them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Rabbit, Turtle, and Spider-Woman go on the war path, hear of three hard-to-kill
    men whose camp is covered with skulls, boast of their power, and are killed by
    fox enemies using firebrands and war clubs.
  category: sequence
  evidence_refs:
  - ev:8
