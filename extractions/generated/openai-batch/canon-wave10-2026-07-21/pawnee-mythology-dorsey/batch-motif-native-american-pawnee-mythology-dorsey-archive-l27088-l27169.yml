  label: Sexual deception and body-part-derived plants
  taxonomy_refs:
  - trickster_boundary
  basis: Chief Coyote uses his long membrum to deceive women by making it resemble
    a snake; after the body part is gnawed apart, its pieces produce trees, vines,
    bushes, and nut trees.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage does not itself label Coyote as a trickster; the taxonomy
    link is based on the described deception and boundary-crossing behavior.
