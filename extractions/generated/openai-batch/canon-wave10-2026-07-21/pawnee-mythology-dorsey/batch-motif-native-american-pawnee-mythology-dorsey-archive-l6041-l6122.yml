canonical_text:
  quote: ''
  summary: A poor boy in a time before horses dreams of two ponies from the heavens,
    repeatedly makes and tends two mud ponies, receives a song and dance associated
    with Tirawa, finds two live ponies where the mud ponies were, gains status through
    acquiring more ponies, becomes a chief, and founds the Chief's Society whose songs
    and dance are later kept by named Pawnee groups.
  language: English
  quote_policy: summarized
