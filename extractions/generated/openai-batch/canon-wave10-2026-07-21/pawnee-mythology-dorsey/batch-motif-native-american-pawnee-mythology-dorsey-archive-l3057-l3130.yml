canonical_text:
  quote: ''
  summary: 'The passage closes a corn-bundle narrative: a young man is instructed
    by Corn-Woman in a dream about respecting living corn, naming his daughter, praying
    to Mother-Corn, Mother-Earth, Mother-Evening-Star, and Mother-Moon, using cornfields
    for children''s health, and placing a singing sacred ear of corn in a bundle.
    It then begins the Meteorite People narrative, in which Pahokatawa, a wonderful
    being killed and dismembered, is restored by gods with the help of animals, birds,
    and insects, receives a feather in place of missing brains, later comes from the
    sky as a meteor, warns the people of enemies, and foretells a meteor fall including
    a turtle-shaped multicolored meteor.'
  language: English
  quote_policy: summarized
