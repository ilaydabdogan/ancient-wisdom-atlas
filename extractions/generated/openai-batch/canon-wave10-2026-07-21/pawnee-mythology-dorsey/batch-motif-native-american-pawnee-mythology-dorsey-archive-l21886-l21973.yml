canonical_text:
  quote: ''
  summary: The passage contains a Coyote story in which hungry Coyote uses pipe-sticks,
    claimed kinship, and a promised meeting on a hill to lure Beavers from the water
    and kill them for his children. A note says the story warns people to be careful
    about receiving a Pipe-stick ceremony from unknown people. The passage then begins
    another Coyote story in which hungry Coyote gives a knife to a round stone as
    a present, finds a village with meat, repeatedly tries to take the knife back,
    and is pursued by the speaking stone while other animal beings refuse or cannot
    help him. A note says this story warns children not to reclaim gifts given to
    stones, trees, or other things.
  language: English
  quote_policy: summarized
