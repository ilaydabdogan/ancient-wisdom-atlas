  text: Inside the Beavers' lodge, Coyote sings that the Beaver who swims with a stick
    is his child or son and that he will use the club hanging at his belt upon him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Coyote tells the Beavers that a main party of pipe-stick people is on the
    hill and that the Beavers are children of Coyote's people, who are their fathers.
  category: speech
  evidence_refs:
