canonical_text:
  quote: ''
  summary: Handsome-Boy recounts war victories and his return, refuses to rejoin his
    birth parents, divides ponies between households, fights with a lodge spear and
    gives scalps and the spear to mourners, is rewarded and married, leads a hunt
    after a dream message from a mysterious being, keeps a spirit-given prohibition
    against striking anyone, suffers abuse from his wife, and is later chosen as husband
    by a beautiful girl whose family hosts him with food and a pipe; he and the girl
    remain in her tipi for four days and nights.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Handsome-Boy reports past war actions, including killing enemy chiefs, taking
    a war bonnet, taking scalps, and returning to his own people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old men and old women respond to Handsome-Boy with shouting, singing, crying,
    and dancing for joy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: His father and mother try to take him to their lodge, but he refuses and says
    he has a new father, mother, and brother.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Handsome-Boy and his brother bring up a drove of ponies and divide it into
    two bunches, leaving one bunch for his birth parents and taking the other to his
    new parents.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When enemies attack the village, Handsome-Boy takes a spear from a lodge,
    enters battle, kills four people, and hangs four scalps on his belt.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Handsome-Boy gives the four scalps and the spear to mourners and receives
    a pony tied before the ceremonial lodge, which he gives to his new father.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Handsome-Boy's new father tells him it is time to take a wife; a young girl
    is selected, he marries her, and they have one male child.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The first wife is described as mean, and Handsome-Boy tolerates her bad behavior.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Handsome-Boy is selected to lead the people on a hunt.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A mysterious being appears to Handsome-Boy in a dream and tells him where
    the buffalo are and how to find them; scouts later find a large herd.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The wife repeatedly reports that a young man has tried to approach her and
    asks Handsome-Boy what he would do if he found her with a man.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Handsome-Boy says he could not do anything because it is not in him to strike
    anyone, and the narration states that spirits had told him never to strike anybody.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: After his wife becomes angry, calls him names, and tries to strike him, Handsome-Boy
    leaves the village, lies face-down on the ground, and weeps.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: A beautiful girl sits near Handsome-Boy and says she has come to be with him,
    take him to her lodge, and make him her husband; he accepts.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The girl brings Handsome-Boy to her tipi, her mother cooks dried buffalo meat
    for him, and her father brings tobacco and a pipe and smokes with him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Handsome-Boy and the beautiful girl remain in the tipi for four days and four
    nights.
  category: sequence
  evidence_refs:
  - ev:10
