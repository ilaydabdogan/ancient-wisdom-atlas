candidate_motifs:
- id: motif:1
  label: Return of the recognized hero to his people
  taxonomy_refs:
  - return
  basis: Handsome-Boy declares that he has returned to his own people, identifies
    himself, and is publicly received with joy.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage is a late segment of a longer tale; the full departure-and-return
    arc is only partly visible here.
- id: motif:2
  label: Warrior recognition through trophies
  taxonomy_refs: []
  basis: Handsome-Boy recounts scalps and a war bonnet as proofs of earlier battles,
    then later takes four scalps in a village battle.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: No external motif index number is supplied; this is a descriptive motif
    candidate only.
- id: motif:3
  label: Ritualized martial exchange and reward
  taxonomy_refs:
  - sacred_exchange
  basis: After killing enemies with the lodge spear, Handsome-Boy gives the scalps
    and spear to mourners, receives a pony tied at the ceremonial lodge, and passes
    the pony to his new father.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage describes the exchange but does not explain its ceremonial
    meaning; the taxonomy link is broad.
- id: motif:4
  label: Dream revelation of game location
  taxonomy_refs:
  - wisdom
  basis: A mysterious being appears in a dream and tells Handsome-Boy where the buffalo
    are and how to find them; scouts then find the herd.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The available taxonomy has no exact dream-revelation or hunting-guidance
    category; 'wisdom' is used only in the sense of transmitted knowledge.
- id: motif:5
  label: Spirit-given prohibition against striking
  taxonomy_refs: []
  basis: Handsome-Boy refuses violent retaliation because spirits had told him never
    to strike anybody.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage alludes to an earlier spirit encounter outside the supplied
    excerpt.
- id: motif:6
  label: Rejected sufferer chosen by a new spouse
  taxonomy_refs: []
  basis: After humiliation by his wife and solitary weeping outside the village, a
    beautiful girl comes to Handsome-Boy and asks to take him to her lodge as husband.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The girl is not described as supernatural in the supplied passage, so
    no divine-beloved or sacred-marriage classification is asserted.
- id: motif:7
  label: Four-day and four-night couple seclusion
  taxonomy_refs: []
  basis: Handsome-Boy and the beautiful girl remain together in the tipi for four
    days and four nights after her family hosts him.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The duration is explicit, but the passage does not state a ritual interpretation
    for the seclusion.
