- id: motif:2
  label: Restoration of a slain kinsman
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: After the brother-in-law is killed, the husband arranges a ritualized scene
    at the east side of the village; the wife arouses her brother and he is restored
    to their father.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The abstract states the restoration but compresses the procedure and does
    not describe interior experience of death or return.
- id: motif:3
  label: Magical war implements alter battlefield conditions
  taxonomy_refs: []
  basis: The lariat brings a storm from the heavens over the enemy, and the spear
    opens a deep ravine between the enemy and the village.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The specific ceremonial or mythic classification of the implements is
    not given in the excerpt.
