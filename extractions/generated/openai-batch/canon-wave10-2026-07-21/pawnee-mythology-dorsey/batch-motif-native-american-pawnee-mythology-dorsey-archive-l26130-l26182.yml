canonical_text:
  quote: ''
  summary: The passage summarizes the end of a Pawnee narrative about a powerful chief’s
    son-in-law associated with black and dun horses, magical war implements, restoration
    of a slain brother-in-law, eventual death in battle, and transmission of wonderful
    belongings to a son who continues the wild horse dance. It then begins the abstract
    of “The Origin of the Buffalo Ceremony,” in which Howling Fox hears underground
    rumbling, meets a buffalo woman searching for her missing daughter, and gathers
    gaming rings for a ritual offering because the daughter is said to be one of the
    rings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man takes his shield, robe, and spear, waves the spear at enemies while
    they shoot at him, frightens the enemy, and orders his side to attack.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the battle action, the man becomes famous, is offered the chief’s daughter
    in marriage, and becomes chief of the tribe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A jealous young man goes to the girl’s brother and bears false witness about
    the girl’s husband.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The husband has warned his brother-in-law not to ride a black or dun horse
    while hunting; the chief’s son disobeys, rides a dun horse to a buffalo hunt,
    and the buffalo kill him and the horse.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chief’s son-in-law realizes by magic power what has happened and informs
    his father-in-law.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The slain boy is placed on the east side of the village; people are told to
    keep quiet and guard the horses; at sunrise black and dun horses run over and
    trample the boy, after which the wife is told to arouse her brother, who is restored
    to their father.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the warpath, the man throws his lariat over his shoulder; a storm comes
    from the heavens, covers the enemy, scatters them, and the party captures the
    enemy’s horses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When his village is attacked, the man throws his spear among the enemy; it
    makes a great noise as it falls, and a deep ravine opens between the enemy and
    the village.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The husband says that when black and dun horses fight together in the same
    battle he must die; he gives his belongings to his wife, mounts his black horse,
    enters the enemy, and is killed with the horse, while the brother-in-law on the
    dun horse is also killed with that horse.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The woman gives her husband’s lariat and other wonderful belongings to one
    of her sons, who becomes a medicine-man and continues the wild horse dance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Howling Fox watches men play the ring and javelin game and hears a rumbling
    noise pass east beneath the playgrounds and later pass west.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Howling Fox is told to remain on the playground the next day; in the morning
    he bathes, takes pipe and tobacco to the grounds, sits at the northeast corner,
    and remains after the game.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: A woman comes from the west, addresses Howling Fox, and is recognized by him
    as buffalo; she says she has six sons and one missing daughter.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The buffalo woman tells Howling Fox that she will give him great power if
    he finds her daughter, who is a ring used by one of the gamblers.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Howling Fox borrows gaming rings, has his lodge swept, places the rings west
    of the fireplace, makes a smoke offering to the heavens and to each ring, prays
    to the rings for mercy, hides them under his pillow, and later carries them to
    the grounds.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: After placing the rings on the north side of the grounds, Howling Fox hears
    rumbling from beneath the ground and the rattling of hoofs as the sound draws
    near.
  category: action
  evidence_refs:
  - ev:8
