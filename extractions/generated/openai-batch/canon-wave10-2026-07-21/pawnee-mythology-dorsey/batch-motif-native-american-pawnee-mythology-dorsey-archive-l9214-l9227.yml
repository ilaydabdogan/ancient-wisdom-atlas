canonical_text:
  quote: ''
  summary: A game is prepared and played between a gambler and a boy, each with many
    people on his side. After losing all he has, the boy accepts a wager in which
    the loser will be killed. He loses, while an old witch dances and claims his head.
    The people run away; the young man is taken to a killing place, beheaded, and
    his head is taken into a lodge while the body is left outside. Later, people wonder
    why he has not returned home and ask for him through the village.
  language: English
