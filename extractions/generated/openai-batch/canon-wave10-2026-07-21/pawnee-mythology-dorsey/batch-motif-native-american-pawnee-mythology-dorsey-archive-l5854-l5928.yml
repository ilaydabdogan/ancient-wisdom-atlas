canonical_text:
  quote: ''
  summary: 'The excerpt first concludes a witch-woman story: a young man kills four
    buffalo, makes them holy for sacrifice, marries the chief''s daughter, becomes
    a great warrior, and takes the name White-Sun after saying he was born under the
    sun''s protection. The passage then begins a tale titled "Pursuit by a Rattling
    Skull; the Pleiades": a girl on a buffalo hunt is lost while gathering wood, captured
    by a Skull, forced to clean it and eat its scales, abandoned by her people after
    a failed search, and later receives an arrow, bladder, and cactus from a mysterious
    man for a flight from the Skull.'
  language: English
  quote_policy: summarized
