canonical_text:
  quote: Four girls went from a village in the winter time to gather firewood.
  summary: Four girls gather firewood in winter and are drawn by a sweet-smelling
    root odor. Three turn back, leaving one girl to follow the odor north to a cedar-covered
    hillside and a rock lodge. A fine-looking young man invites her in, saying the
    odor comes from there. Once she enters, a stone closes the opening, the man appears
    as an ugly old man, and he threatens to kill her in a few days. She sees a sacred
    bundle with five large gourd rattles in the lodge. A source note identifies the
    broader tale as a magic-flight version involving theft of a sacred bundle from
    Rolling-Head's stone house with raven's aid, Rolling-Head's defeat by hawk, and
    celestial transformations.
  language: English
  quote_policy: quoted
