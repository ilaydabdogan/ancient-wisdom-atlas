  text: The Buffalo propose that the girl be cut open and laid out so the golden Eagle
    will reach for her heart, at which moment she should seize his legs.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Buffalo drive droves into water and mud so that many buffalo appear dead
    along the stream.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The girl is placed in an arbor, cut open, with her bowels put aside and her
