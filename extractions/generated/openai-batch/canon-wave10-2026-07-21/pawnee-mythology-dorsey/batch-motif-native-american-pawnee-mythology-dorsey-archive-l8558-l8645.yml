  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The golden Eagle sits on the girl's breast and looks for her heart; when he
    reaches for it, she takes hold of his legs and addresses him as her uncle.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: When the woman touches the Eagle's legs, the Eagle turns into the boy again
