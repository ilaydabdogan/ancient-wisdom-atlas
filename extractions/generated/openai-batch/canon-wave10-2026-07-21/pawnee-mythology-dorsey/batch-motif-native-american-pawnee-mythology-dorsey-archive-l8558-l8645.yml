canonical_text:
  quote: ''
  summary: A girl reaches the Buffalo, who identify her eagle-formed uncle as Morning-Star,
    a heavenly chief who desires human flesh. The Buffalo stage a trap with apparently
    dead buffalo and the girl laid open as a corpse-like decoy. The golden Eagle comes
    to eat her heart; she grasps his legs and he becomes a boy again. He declares
    rules for future offerings to Morning-Star involving a captured woman and consecrated
    buffalo. The woman and boy then vanish in dark clouds, returning to the Moon and
    the east. The passage then begins the next tale, where Burnt-Belly is struck by
    a poor woman and begins singing of his toes becoming eagle claws.
  language: English
  quote_policy: summarized
