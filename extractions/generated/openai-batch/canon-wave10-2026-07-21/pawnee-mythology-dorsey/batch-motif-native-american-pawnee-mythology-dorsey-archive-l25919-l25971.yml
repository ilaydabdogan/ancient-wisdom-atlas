canonical_text:
  quote: ''
  summary: The passage summarizes a Pawnee narrative in which an afflicted boy is
    taken among animal medicine-lodges, where many animals fail to heal him until
    a powerful bear removes a stone from his body, eats part of his liver, breathes
    on him, and gives him bear medicine power. The boy later uses this power, receives
    the name Smoking-With-the-Bear, and is associated with smoking to the rising sun
    and to bears. The passage then begins an abstract of 'The Bear Medicine,' in which
    a poor boy goes west into the mountains to a bear home, meets a mother bear and
    cubs, and is confronted by a powerful old bear who claims sun-derived power and
    decides to teach the boy.
