canonical_text:
  quote: ''
  summary: Two boys reach another village. The strange boy says the people are bad,
    that they must be killed in the under-world, and that the villagers would not
    reveal whether the boys' father is there. He tells Handsome-Boy to twist his head;
    both boys twist their heads and their heads rattle like gourds. The strange boy
    then instructs Handsome-Boy to enter the village by one way while he enters by
    another, and to announce that the people will die whether they look at Handsome-Boy
    or not.
  language: English
