canonical_text:
  quote: ''
  summary: Birds and Eagles gather around a tipi where Coyote is hungry. The Bald
    Eagle says the girl must be sent to get Buffalo for their grandfather. The Eagles
    place the girl on rawhide lariat ropes hanging from the sky; she swings away toward
    the west, disappears, and returns with Buffalo running behind her. Crow kills
    two Buffalo by cawing over them. Coyote skins and eats the meat, receives dried
    meat to take home to his starving children, and later the figure named Hoof-Shield
    feeds his family and guests. On a later visit, the birds again help him get meat,
    Crow scolds him, and the Eagles warn him not to bring anyone.
  language: English
  quote_policy: summarized
