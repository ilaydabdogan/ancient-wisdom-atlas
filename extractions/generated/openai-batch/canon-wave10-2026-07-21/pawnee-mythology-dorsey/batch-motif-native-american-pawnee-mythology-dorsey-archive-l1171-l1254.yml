canonical_text:
  quote: ''
  summary: 'The passage closes an origin account in which buffalo are sent by western
    gods and first offerings of heart and tongue are made to them. It then begins
    the account of the Small-Ants Bundle and the Buffalo: ancestral people lacking
    seeds and buffalo wander for food; a wise young man receives instruction from
    Mother-Moon to lead the people north and await gifts connected with Mother-Corn;
    the people settle near ponds, a spring, and a high hill, suffer hunger, and the
    young man cries on the hill. In a pond he sees the Moon and an old woman, who
    identifies herself as the one who guided him and tells him to continue crying
    on the hill alone.'
  language: English
  quote_policy: summarized
