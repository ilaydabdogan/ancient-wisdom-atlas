candidate_motifs:
- id: motif:1
  label: Cannibal old woman with lodge, skulls, and human-food hospitality
  taxonomy_refs: []
  basis: Multiple abstracts describe a female antagonist associated with human skulls
    or heads and food made of human flesh, eyes, ears, or lethal food.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:6
  - ev:8
  confidence: high
  cautions: The passage consists of abstracts, not full narrative texts; not all antagonists
    are named Spider-Woman.
- id: motif:2
  label: Contest or dance against a dangerous supernatural woman
  taxonomy_refs:
  - initiation
  basis: Visitors or captives face games or dances set by Spider-Woman, a cannibal
    mother, or Witch-Woman; survival of the contest leads to defeat of the antagonist.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The available taxonomy term 'initiation' is only a broad fit; the passage
    itself calls these contests games or dances.
- id: motif:3
  label: Bird transformation as protection in a supernatural contest
  taxonomy_refs:
  - shapeshifter
  basis: The boys in Abstract 73 and the young man in Abstract 75 become snowbirds
    and larks while opposing the old woman.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The abstracts do not explain whether the transformations are bodily, ritual,
    or metaphorical.
- id: motif:4
  label: Antagonist carried to the Moon
  taxonomy_refs:
  - ascent
  basis: In Abstract 73 grasshoppers take the old woman to the Moon; in Abstract 75
    the young man carries the old woman to the Moon.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: 'The circumstances differ between abstracts: insect carriers in one, bird-transformed
    hero in another.'
- id: motif:5
  label: Etiology of visible beings or marks in sky
  taxonomy_refs: []
  basis: The old woman's dress may be seen hanging from the Moon, and grasshoppers
    may be seen at the Sun in summer.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: This etiological reading is based on the abstract's statement that these
    may be seen; the fuller narrative may add details.
- id: motif:6
  label: Magical game implement enables travel and victory
  taxonomy_refs: []
  basis: The uncle places himself on the double-ball game object and is carried in
    search of his niece; the strengthened ball set enables the girl to win.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: No supplied taxonomy reference directly names this game-object pattern.
- id: motif:7
  label: Burning followed by animal transformation
  taxonomy_refs:
  - shapeshifter
  basis: After burning, the old woman becomes a spider in Abstract 74; after Witch-Woman
    is burned, a croaking tree frog springs onto a tree in Abstract 76.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The Abstract 76 wording does not explicitly say the Witch-Woman becomes
    the frog, only that she bursts open and the frog springs forth.
- id: motif:8
  label: Animal or bird messenger guides kin-rescuer
  taxonomy_refs: []
  basis: The girl asks birds to tell her uncle she needs help, and a little bird later
    offers to lead him to his niece.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This motif is explicit only in Abstract 74 within the supplied passage.
comparison_claims:
- id: claim:1
  claim: Abstracts 73, 75, and 76 share a recurring pattern of a dangerous old or
    witch-woman connected with human remains, cannibal or lethal food, and a dance
    or contest in which the antagonist is ultimately defeated.
  claim_level: same_motif
  target: Cannibal witch contest pattern within the supplied Pawnee abstracts
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  - ev:8
  counter_evidence_refs:
  - ev:7
  confidence: medium
  limitations: The abstracts differ in protagonists, names, and outcomes; Abstract
    74 uses a ball game rather than a dance.
- id: claim:2
  claim: Abstracts 73 and 75 both use snowbird and lark transformation in the defeat
    of an old woman, and both connect the defeated old woman with the Moon.
  claim_level: same_function
  target: Bird-transformation and Moon-removal pattern in Abstracts 73 and 75
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: 'The agents of removal are different: grasshoppers in Abstract 73 and
    the young man in Abstract 75.'
- id: claim:3
  claim: Abstracts 74 and 76 both end the witch-woman's defeat with burning and an
    animal emergence or transformation.
  claim_level: same_function
  target: Post-burning animal-form outcome in Abstracts 74 and 76
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The spider transformation is explicit in Abstract 74; the tree-frog
    relation in Abstract 76 is less explicit.
