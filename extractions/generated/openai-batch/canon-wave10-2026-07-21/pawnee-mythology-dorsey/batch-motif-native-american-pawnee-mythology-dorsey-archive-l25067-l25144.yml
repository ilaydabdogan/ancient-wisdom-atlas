canonical_text:
  quote: ''
  summary: The passage gives abstracts of Pawnee narratives involving Spider-Woman
    or witch-women who keep skulls or heads, offer human body parts as food, and challenge
    visitors or captives to games or dances. Young men, a girl aided by her uncle,
    and a hunter's son encounter these figures. Antagonists are defeated through medicine,
    bird or ball-game power, helpers, burning, or being carried to the Moon. Several
    endings explain visible features in the Moon or Sun, spiders, tree frogs, rheumatism,
    seeds, and buffalo power.
  language: English
  quote_policy: summarized
