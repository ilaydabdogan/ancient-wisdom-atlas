- id: ev:3
  type: summary
  locator: Abstract 73, lines 25080-25085
  quote_or_summary: The boys prepare for the game with white clay and black eye streaks,
    dance near the steep bank, and turn into snowbirds and larks when the old woman
    sings of storms and air.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/pawnee-mythology-dorsey.md
  rights_note: Public domain; source metadata allows full text use.
- id: ev:4
  type: summary
  locator: Abstract 73, lines 25085-25089
  quote_or_summary: After the boys sing of grasshoppers, the grasshoppers lift the
    old woman to the Moon, where a piece of her dress may be seen, and then fly to
    the Sun.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/pawnee-mythology-dorsey.md
  rights_note: Public domain; source metadata allows full text use.
- id: ev:5
  type: summary
  locator: Abstract 75, lines 25116-25128
  quote_or_summary: A young man finds skulls and a lodge with three ugly girls and
    one beautiful girl; the youngest warns that her mother is a cannibal. He survives
    the food and dance, becomes snowbird and lark, carries the old woman to the Moon,
    marries the youngest girl, and later brings buffalo.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/pawnee-mythology-dorsey.md
  rights_note: Public domain; source metadata allows full text use.
- id: ev:6
  type: summary
  locator: Abstract 74, lines 25091-25106
  quote_or_summary: A being takes the girl to a far country in the wind. Spider-Woman
    says she must play double ball, keeps skulls, offers human eyes, and the girl
    asks birds to tell her uncle that she needs help; a little bird later guides him
    east.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/pawnee-mythology-dorsey.md
  rights_note: Public domain; source metadata allows full text use.
- id: ev:7
  type: summary
  locator: Abstract 74, lines 25102-25115
  quote_or_summary: The uncle travels and helps with the double-ball game, blows on
    the string, and the girl wins. The old woman is killed and burned, jumps from
    the fire into grass as a spider, and the uncle explains rheumatism and bent sticks.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/pawnee-mythology-dorsey.md
  rights_note: Public domain; source metadata allows full text use.
- id: ev:8
  type: summary
  locator: Abstract 76, lines 25130-25139
  quote_or_summary: A hunter enters Witch-Woman's grass-lodge, eats, dies, and his
    head is hung up. His son comes; she hangs the father's head around his neck and
    is about to kill him, but rescuers burn her. She bursts open and a croaking tree
    frog springs upon a tree.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/pawnee-mythology-dorsey.md
  rights_note: Public domain; source metadata allows full text use.
