canonical_text:
  quote: ''
  summary: In the Stone-Man Medicine-Lodge episode, a chief's younger daughter discovers
    that an old woman and her grandson possess a red fox and much buffalo meat. The
    grandson, later named Burnt-Belly, sends meat and the red fox to the chief as
    part of a marriage request. The chief accepts, hosts a meal, and gives his younger
    daughter to him. Burnt-Belly then washes in a pond and appears as a handsome young
    man with woodpecker-feather headgear and a star-covered robe that sparkles like
    fire. Crow-Feathers, another son-in-law, tries to imitate Burnt-Belly's dress
    and power, but burns his own robe and is wounded when a woodpecker tied to his
    head pecks him.
  language: English
  quote_policy: summarized
