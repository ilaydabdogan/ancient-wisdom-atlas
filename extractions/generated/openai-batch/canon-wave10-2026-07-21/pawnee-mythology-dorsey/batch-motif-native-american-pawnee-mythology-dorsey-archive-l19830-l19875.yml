  quote: ''
  summary: In a passage from “The Dog Medicine,” a Dog instructs a boy to perform
    the Dog dance, promises him a marked pony that is actually the Dog himself, and
    sends him on the war-path. The boy recruits companions, raids an enemy village,
    captures the marked pony, returns home, revisits the Dog, and later enters a Medicine-Men’s
    ceremony where he dances, sings an unfamiliar song, and is painted with red ointment.
  language: English
