canonical_text:
  quote: ''
  summary: A young man leaves an old man's lodge at night, goes to a frozen creek,
    breaks the ice, and dips a little animal into the water. The animal later appears
    with liver in its mouth amid blood and entrails. The old man is found dead, and
    the chief suspects the young man. The young man later performs dance and sleight-of-hand
    among the medicine-men and is acknowledged as the leading medicine-man. Potawatami
    visitors observe the performances, are awed, receive gifts, and ask the Pawnee
    to visit with the young man.
  language: English
  quote_policy: summarized
