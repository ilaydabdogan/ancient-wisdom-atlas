  summary: In a Turkey Ritual passage, the Gobbler sings of acorns on trees, walking
    to a distant rocky place, and flat, rough feet. An old man tells the people that
    the Turkeys have been where rocks abound and explains that the Turkeys are going
    south to a rocky land with many acorns, where they will live so people may come
    to hunt and kill them.
