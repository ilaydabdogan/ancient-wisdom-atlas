canonical_text:
  quote: ''
  summary: An old Eagle instructs a boy in healing objects and their use, sends Eagles
    to escort him home, and the boy returns to his parents as a young man. He tells
    the village how his uncle found the Eagle-feather-covered mound, offered him to
    the Eagles in hopes of gaining power, and was later carried to the den and eaten.
    The boy later changes into an Eagle to reach a war party, returns to human form,
    warns the warriors of nearby enemies, and prepares with Eagle-associated regalia.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old Eagle tells the boy to obtain an Eagle-wing fan and says the wing
    will carry the Eagles' power and breath for healing sick people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:2
  text: The old Eagle tells the boy to kill a young fawn, make a rattle from the fawn
    skin, and shake it over sick people to arouse the animal spirit in them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At daylight ten Eagles leave the den with the boy and fly toward the village
    on the Republican River.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Near the village, the Eagles alight on a high mound, tell the boy to go to
    his people, and say they will watch over him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Eagles fly around the boy Eagle, and he turns into a young man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boy finds his father and mother in a lodge by the fireplace; they are
    scarred, have short hair, and have mourned for their lost child for years.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The returned young man gives a bundle and tells his family to place it at
    the altar in the west.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The boy tells the gathered villagers that his uncle found a mound covered
    with Eagle feathers, with an entrance at the top hidden by soft downy feathers.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boy says his uncle gathered feathers from the place, put them on his robe,
    and was regarded as wonderful though he had no power.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The boy says his uncle gave him to the Eagles as a present and asked them
    to take pity on him and give him their powers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy says the Eagles did not eat him, took pity on him, and allowed him
    to fly into the sky and look over the country.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The boy says he helped carry the man up into the sky and down into the den,
    where the Eagles ate the man.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: After staying in the village, the boy disappears, turns into an Eagle, flies
    to the warriors, then flies down and turns into a young man in their camp.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The boy tells the warriors that the enemy is near, and scouts report that
    only a few tipis are present.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Before the attack, the boy spreads clay on his body, places a bone whistle
    on his breast, puts a soft downy feather in his scalp-lock, and carries a club
    later recognized as an eagle claw.
  category: action
  evidence_refs:
  - ev:8
