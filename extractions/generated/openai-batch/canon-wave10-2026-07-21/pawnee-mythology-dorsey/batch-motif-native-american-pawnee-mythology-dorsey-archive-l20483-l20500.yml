  summary: At night the boy sleeps and repeatedly hears dancing and singing that announces
    Handsome-Boy has killed and scalped an enemy. In another dream a mysterious being
    addresses him as son and instructs him to find, kill, scalp, dry, and keep an
    enemy's scalp. The boy later hears the singing nearby, approaches the apparent
    people, and sees that they are prairie dogs running into holes. He then takes
    native tobacco from his place.
