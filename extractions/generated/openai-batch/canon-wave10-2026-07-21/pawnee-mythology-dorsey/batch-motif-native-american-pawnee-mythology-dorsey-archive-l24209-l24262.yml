canonical_text:
  quote: ''
  summary: 'The passage gives abstracts of several Pawnee narratives: an eschatological
    star council and world-end signs; a fatal black-Moon war omen; a tale of a young
    man shamed by a talking membrum; a tale of Spider-Woman causing a man to become
    woman; a war party scalped after neglecting smoke offering; and the start of a
    courtship and elopement story involving a poor boy and a chief''s daughter.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the first great council of stars, an old person and a young person became
    sick, were placed on a stretcher, and were carried by certain stars behind a chief
    medicine-man around North Star.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: South Star is said to capture the stretcher carriers, and South Star is identified
    as the god of death who would take possession of earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: World-end signs include meteors flying through the sky, rivers rising, animals
    drifting downstream carrying people, Clam Shell carrying some like babies, and
    some people being in bird shape.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Moon has turned black several times, but the end of the world has not
    yet come; the time is to be determined by North and South Stars.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the end time, people will turn into stars and go south, while all stars
    first fall from the heavens and mingle with people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A war party sees the Moon turn black; some men treat this as an evil omen
    and want to postpone, but others continue, and many warriors and chiefs are killed
    with only one escaping.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A young hunting man strikes and questions his membrum after urinating; it
    answers that it sees buffalo and continues speaking until addressed by his mother-in-law.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The young hunting man becomes so ashamed after the talking membrum episode
    that he leaves and is never heard of again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A young man who cares nothing for women bathes in a spring and dreams of Spider-Woman,
    the spirit of the spring, who says he will be like a woman.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Medicine-men declare that the young man is becoming woman because he has been
    bewitched by Spider-Woman; spring moss is the only cure, but none can be found.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The young man commits suicide rather than be a hermaphrodite.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A war-party leader carries a sacred bundle on his back but never makes a smoke
    offering, and the others complain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The war party attacks a small village, finds many enemies, is surrounded,
    and all are scalped.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The scalped men decide they are too ashamed to return to their people and
    agree to live among the hills.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Years later a hunter sees the scalped people singing as scabs drop from their
    heads; after he shoots at them, they run into a cave and disappear.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:16
  text: A poor boy likes a chief's daughter; she invites and visits him, he refuses
    to lie with her, and she proposes that they elope.
  category: sequence
  evidence_refs:
  - ev:10
