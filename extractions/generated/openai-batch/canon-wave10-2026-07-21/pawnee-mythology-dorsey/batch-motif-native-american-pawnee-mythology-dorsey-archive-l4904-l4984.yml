canonical_text:
  quote: ''
  summary: A boy reaches a divine lodge with gardens of crops. The four gods, described
    as representatives of Tirawa, identify the North-Wind as his helper and the South-Wind
    as harmful. Through songs, cooking, and ritual handling of crop seeds and buffalo
    meat, the boy receives ceremonies, seeds, and a buffalo robe for the benefit of
    his starving people. The North-Wind returns him through a foggy water place near
    the horizon. The boy then summons a Buffalo from the water with feathers; the
    Buffalo recognizes the robe and seeds, grants him its power, and says the Buffalo
    people will go to his people. The boy then gathers eagle feathers at a mound.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The divine lodge is approached through an entrance near three gardens: pumpkins
    or squash on the north side, beans on the south side, and corn west of the lodge;
    a watermelon is later brought from the south side.'
  category: setting
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:2
  text: The four gods in the west of the lodge question the boy and say they know
    he is a great gambler who has lost everything.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The South-Wind is shown in the south of the lodge as an ugly-looking man with
    rough, pale-looking skin and unbrushed hair; he is said to bring bad luck, harm
    young men, and scare Buffalo away from the people.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The North-Wind is identified as the one who brought the boy to the lodge;
    he has skin like the boy's, buffalo grease on him, and is called the good wind
    that drives buffalo to the people.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The gods say they are representatives of Tirawa and that the boy is in Tirawa's
    home, though Tirawa cannot be seen.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Priests and errand men bring squash, beans, watermelon, and corn into the
    lodge; seeds are removed or set aside together, food is cooked or boiled, and
    the young man eats while songs are sung or taught.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dried buffalo meat is boiled and eaten by the young man; he is then told he
    must return because his people are starving, first feed them, and then call the
    buffalo for the people to kill.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The gods tell the boy to return to the Buffalo sitting in the water and say
    the Buffalo will speak to him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The gods give the boy a buffalo robe and instruct him to use it for whatever
    he wants to do for the people's benefit; he is told to put the seeds and other
    things in the robe.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The North-Wind takes the boy back by covering him so that they disappear;
    the boy is later dropped into water at the place where the horizon touched the
    ground, in fog-like conditions, and wades to a bank.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy throws down feathers to summon the Buffalo from the water; the Buffalo
    comes up, asks whether he has visited the gods, and recognizes the robe and seeds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Buffalo tells the boy that he now has all the Buffalo's power and that
    the Buffalo people will go to the boy's people.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The boy places feathers on the Buffalo's head and then, following the Wind's
    instruction, gathers many feathers at the mound of the eagles.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: A note identifies the four gods as Clouds, Lightning, Thunder, and Wind, often
    spoken of as messengers of the evening star.
  category: other
  evidence_refs:
  - ev:9
