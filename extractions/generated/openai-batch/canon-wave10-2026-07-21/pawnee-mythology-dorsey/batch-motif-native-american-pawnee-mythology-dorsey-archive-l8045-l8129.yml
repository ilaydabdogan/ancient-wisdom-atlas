canonical_text:
  quote: ''
  summary: 'Chief''s daughters repeatedly drive a squirrel up a cottonwood tree and
    make a marriage contest: whoever shoots the squirrel on the nose will marry them.
    Little Burnt-Belly-Boy, who lives with his grandmother and obtains buffalo by
    shooting a buffalo-hide ring, succeeds at the squirrel shot after being mocked.
    A man wearing bear claws claims the squirrel and marries the two older daughters,
    but the youngest refuses him, suspects the boy is the real killer, and confirms
    it when she finds the squirrel skin and meat in his grandmother''s lodge.'
  language: English
  quote_policy: summarized
