canonical_text:
  quote: ''
  summary: A girl secretly visits a poor boy at night and proposes that they marry
    by running away to a distant country. She says she can provide a meat bag filled
    with dried meat and fat and can get her brother's quiver, bow, and arrows. The
    next day, while tending her father's ponies, she and the boy meet beyond the hills
    and agree to run away that night. A source note identifies the story as a variant
    of the widespread After-Birth-Boy tale and notes a difference in the placement
    of the after-birth.
  language: English
  quote_policy: summarized
