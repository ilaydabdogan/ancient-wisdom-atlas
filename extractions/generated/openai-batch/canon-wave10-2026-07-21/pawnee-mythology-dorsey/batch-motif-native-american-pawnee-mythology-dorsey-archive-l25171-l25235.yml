canonical_text:
  quote: ''
  summary: Abstract of a Pawnee narrative in which a boy is carried to Pahuk, healed
    by animal medicine-men, instructed in animal mysteries, returns to his village
    as a powerful medicine-man, defeats rival medicine-men, performs ceremonies involving
    animal powers, and transmits beaver medicine to his son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Magpie and Buzzard act as errand men for an animal lodge; Magpie summons animal
    delegates to Pahuk, and Buzzards carry the boy there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the boy enters the lodge at Pahuk, he becomes conscious and sees four
    little men at the west whom he had seen earlier.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Otters, Bears, and other animals try to cure the boy but are unable until
    the Ground Hogs are asked.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chief Ground Hog puts his nose in a bowl of water, moves his jaws, and vomits
    up a bone; other Ground Hogs repeat this until their power is exhausted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A young Bear cuts open the boy's belly with his claw, removes flesh, and the
    medicine-men work over the boy until the wound is healed and he again becomes
    conscious.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boy is told to leave the lodge by day and return at night; by day he lives
    on seeds, berries, and small game, and by night he is instructed in animal mysteries.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy returns to his village, where his parents have come to regard him
    as dead, and he asks that food be prepared and relatives and friends called in.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The boy collects presents, throws two parfleches of presents into water, follows
    them into the animals' lodge, and later brings more presents because there are
    not enough for all the animals.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the exchange of presents, the boy is given power to slay enemies, is
    permitted to kill the smallest Ground Hog, keeps the skull in the skin, and is
    taught sleight-of-hand.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The returned boy is reported as a great medicine-man, resumes contests with
    an old medicine-man, smokes pipes with him, refuses a chief's bribe to kill him,
    and later uses his Ground Hog at a creek before the old medicine-man is found
    dead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy enters the medicine-men's lodge, dances, and performs sleight-of-hand.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Potawatami visitors admire the boy and invite Pawnee to bring him to their
    village; later the boy says he has been bewitched and instructs companions to
    plunge him into a stream and remove the thing escaping from his mouth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the stream episode, the Pawnee are informed that the Potawatami medicine-man
    who tried to overcome the boy has died.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: In later ceremonies the young man commands a Cottonwood tree to grow from
    a Cottonwood stick, makes a beaver-lodge, uses beaver powers, causes a dead loon
    to fly about a lake, lives to old age, and transmits beaver medicine to his son.
  category: sequence
  evidence_refs:
  - ev:8
