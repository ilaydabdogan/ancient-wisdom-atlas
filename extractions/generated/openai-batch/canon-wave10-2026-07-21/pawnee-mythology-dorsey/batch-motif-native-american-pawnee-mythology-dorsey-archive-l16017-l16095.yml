canonical_text:
  quote: ''
  summary: Proud-Boy is missing after the people break camp and is mourned as dead.
    He wanders through timber, encounters birds and animals, mistakes a deer for the
    girl he loves, becomes afraid, and falls asleep. Birds, owls, water-dogs, Buffalo,
    Bear, Mountain-Lion, Eagle, and other beings give him a medicinal root, powers,
    ritual instructions, and designs for a robe and tipi. Buffalo directs him to take
    a buffalo scalp after his first kill and return to his people. Proud-Boy follows
    the camp trail and returns at night to his parents' tipi, where his mother lights
    a fire and feeds him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the people broke camp, Proud-Boy's people looked for him but could not
    find him; his father said he must have been eaten by wild animals, and the people
    mourned him as dead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Proud-Boy went through timber and hilly cedar places where water-dogs dwelt;
    birds came near him, but he did not notice them because he was thinking of the
    girl he loved.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In a willowy place Proud-Boy saw what he thought was the girl he loved, embraced
    her, and found that the figure was a black-tail deer, which threw him down.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Proud-Boy cried, heard owls, a bear, and a mountain-lion, felt afraid, asked
    to be killed, and then fell asleep after a screech-owl hooted near him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When Proud-Boy awoke before sunset, birds sat around him, pitied him, and
    offered him a root that they ate when sick or wounded.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: At night the owls and water-dogs came to Proud-Boy and gave him great powers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Buffalo told Proud-Boy to get a robe, paint the symbol of the Sun on it, and
    have it thrown over his body if he was killed so that the birds and animals would
    wake him from sleep.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the animals' lodge, Bear described four kinds of bears and gave Proud-Boy
    power, a bear-like spirit, victory over enemies, and knowledge of roots and herbs
    for making medicine.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Bear, Mountain-Lion, Buffalo, Eagle, Owls, and other birds instructed Proud-Boy
    to place their pictures on a separate tipi, with specified locations for some
    figures.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Buffalo instructed Proud-Boy that his first buffalo kill should be a bull,
    that the bull would be Buffalo himself, and that Proud-Boy should hang the scalp
    with horns on a pole at the head of his bed.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Proud-Boy returned to the old camp location, followed the people's trail for
    three days and nights, entered his father's tipi at night, and was recognized
    by his mother when she kindled the fire.
  category: sequence
  evidence_refs:
  - ev:9
