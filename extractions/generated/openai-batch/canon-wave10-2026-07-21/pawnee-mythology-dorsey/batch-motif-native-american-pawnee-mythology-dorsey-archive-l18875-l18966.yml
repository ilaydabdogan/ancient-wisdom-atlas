canonical_text:
  quote: ''
  summary: A man is drawn by a Raven-Man and ravens to a cave in a mountain, where
    animals and birds become painted people and perform a dance led by Elk people.
    After eating powerful red beans, he becomes deathlike and sees Tirawa in the heavens,
    who instructs him to teach the dance and the use of the beans. He learns in the
    cave for four days, returns east to his people, composes songs, and begins the
    Deer-Dance or Elk-Dance. The passage also begins a separate Wolf-Warrior episode
    in which a separated warrior hears an old Wolf singing on a hill.
  language: English
  quote_policy: summarized
