  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: While lying there, the man goes into the heavens and sees Tirawa sitting in
    an earth-lodge, holding a bow in his left hand and bunches of wild sage in his
    right hand.
  category: sequence
  evidence_refs:
  - ev:4
