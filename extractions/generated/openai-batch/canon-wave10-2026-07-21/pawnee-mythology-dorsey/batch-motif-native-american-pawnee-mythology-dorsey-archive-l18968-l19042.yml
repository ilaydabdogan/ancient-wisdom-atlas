canonical_text:
  quote: ''
  summary: A Pawnee narrative excerpt describes an old Wolf instructing a man in medicines
    and wolf-derived objects for fast travel, war success, long life, and the transmission
    of power. The Wolf dies at sunrise, later appears in a dream, and the man ritually
    takes the Wolf's nose and scalp strip along with a root before returning home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The introductory note says the story concerns the origin of individual power
    obtained from a wolf, making a man a fast traveler and great warrior, and reminds
    old men to transmit power to young men.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Wolf says a certain root gives strength for long-distance walking, and
    instructs the man to powder it, mix it with white clay, and snuff it when tired
    on the war-path.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Wolf instructs the man to make a wolf robe and moccasins from wolves,
    with front paws on the moccasins and hind paws at the heels, to be worn on the
    war-path for fast travel.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man addresses the Wolf as father, asks for long life and warrior power,
    and promises to keep a tobacco bag filled with sumach leaves mixed with tobacco
    so he can smoke to the Wolf.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Wolf says he is dying of old age and tells the man to cut off his nose
    with a strip of scalp, dry it, and wear it on his scalp-lock because the nose
    will be the Wolf's spirit.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Wolf says that keeping the nose-and-scalp object will allow the man to
    live until old age, and instructs him to give the things to his children and tell
    them about the Wolf.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Wolf howls with his head raised toward the heavens, and the man hears
    a song that he can sing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The man sleeps beside the Wolf at night, and the passage states that the Wolf's
    power is transferred to the man through a dream.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Near morning, the first morning star is identified as “Wolf-Star,” after which
    the Wolf gives a large howl and lies down again.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: At dawn, the Wolf looks toward the sun, howls, and dies as the sound fades.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In a later dream, the Wolf tells the man to take the nose, says the Sun is
    his father and source of power, and says the Sun helped him pass out of this world
    to a place unknown by man.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The man places sumach leaves and tobacco inside the Wolf's nostrils, cuts
    off the nose with a piece of scalp, leaves the body on the hill, takes the root
    and nose, and returns home instead of joining the war party.
  category: sequence
  evidence_refs:
  - ev:7
