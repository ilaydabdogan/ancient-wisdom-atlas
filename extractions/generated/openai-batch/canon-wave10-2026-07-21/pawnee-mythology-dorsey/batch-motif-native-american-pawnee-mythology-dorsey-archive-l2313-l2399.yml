  quote: ''
  summary: The passage describes a lodge ceremony in which celestial beings teach
    two people songs, dances, seeds, games, and the basket dice game. The Moon, Evening-Star,
    the four old men identified as Wind, Clouds, Lightning, and Thunder, star women,
    Big-Black-Meteoric-Star, Tirawa, and Spider-Woman are connected with the origin
    and meaning of the basket, plum seeds, sticks, medicine powers, and doctors' dance.
    The passage then begins a new story about a northern Skidi or Pitahauirat village
    where boys imitate medicine-men, and a poor boy asks the sons of a medicine-man
    and a chief to promise to learn rituals, songs, and mysteries.
