canonical_text:
  quote: ''
  summary: 'The passage first concludes a Loon medicine account: a poor boy becomes
    a warrior and medicine-man through the Loons, teaches what he knows to the chief''s
    son, and dies, leaving the mysteries with that son. It then begins the account
    of the Lightning''s medicine ceremony. A Kitkehahki girl is born on the Republican
    River with a forehead birthmark that people describe as like the Moon, a meteor,
    or a star. As she grows, she behaves unusually, staying indoors by day and watching
    or counting the stars at night. Her parents make mats, a pillow, and provide her
    robe. One clear day she predicts a rainstorm; thunder follows, dark clouds appear,
    and during the storm she sits by the fire, watches lightning through the lodge
    opening, moves her bedding to the northwest post, and is associated with sharp
    lightning and thunder as the lodge fills with smoke and the people are stunned.
    A source note says the tale recounts the origin of a medicine ceremony and teaches
    that stars can send one of their number to earth to teach their ways.'
  language: English
  quote_policy: summarized
