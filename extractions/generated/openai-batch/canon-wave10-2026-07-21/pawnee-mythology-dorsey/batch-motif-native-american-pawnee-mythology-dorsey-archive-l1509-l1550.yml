canonical_text:
  quote: ''
  summary: 'A young man instructs the village to plant and tend seeds, after which
    the people have corn and meat. He later finds the cave closed and its spring dry,
    and the people divide into bands. A new section begins: Tirawa creates a man,
    directs him to point his thumbs north, and the faces of four northern gods are
    imprinted on his thumbnails in two stages. The four gods empower the man to create
    a mate and send Kingfisher to earth. Notes explain that these gods send buffalo
    and rain, are represented ceremonially by four shell-bearing sticks, and are associated
    with hunters, raven feathers, and a shell disk tradition also noted among the
    Skidi.'
  language: English
  quote_policy: summarized
