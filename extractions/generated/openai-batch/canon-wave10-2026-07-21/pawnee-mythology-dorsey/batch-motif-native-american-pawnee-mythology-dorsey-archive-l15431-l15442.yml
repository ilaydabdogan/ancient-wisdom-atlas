  quote: ''
  summary: A man returns home without his son. The boy’s mother and father search
    through the village, fail to find him, and mourn him as dead. Years later the
    father marries another woman. After the boy has been thrown into the river, the
    water carries his body downstream to an animals’ lodge, where the animals say
    that if he is to be brought back to life he must be taken to Pahuk.
