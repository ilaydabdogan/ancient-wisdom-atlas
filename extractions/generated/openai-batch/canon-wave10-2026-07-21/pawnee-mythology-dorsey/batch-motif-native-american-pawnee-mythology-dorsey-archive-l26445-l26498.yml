canonical_text:
  quote: ''
  summary: Two Pawnee myth abstracts are summarized. In no. 104, a wounded man abandoned
    in enemy country is taken by Scalped-Man to a cave, healed, taught powers and
    performances, given ritual objects and a secrecy warning, returns as a medicine-man
    and warrior, and later dies grieving for Scalped-Man. In no. 105, a feather-clad
    man seeks power at a feather-covered hill and sacrifices his nephew into an eagles'
    den; the Eagles reject the man's act, keep and teach the boy, and transform him
    into a young Eagle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A party returns to enemy country; one man is wounded in flight and abandoned
    by his friends with food and drink.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night the wounded man hears a woman and strange voices, loses portions
    of his food, and asks the mysterious being to kill him when the food is gone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Scalped-Man appears and takes the wounded man to a big cave furnished with
    wild sage, a fireplace, a buffalo skull with offerings, meat parfleches, and buffalo
    robes; the wounded man cannot find an exit.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Scalped-Man warns the wounded man not to try to escape when he thinks he hears
    his parents calling him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Scalped-Man teaches ventriloquism and sleight-of-hand, heals the wound, gives
    an eagle feather and body paint, instructs the man in actions for speed while
    fleeing, and says wild sage in his hands will become arrows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Scalped-Man warns the man never to tell of the cave abode, or his power will
    be taken away.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The man returns to where the warriors left him, is found by friends, requests
    presents for Scalped-Man, returns home, displays power in the medicine-lodge,
    and becomes a medicine-man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: During an attack, the medicine-man uses Scalped-Man's power, wards off arrows,
    strikes an enemy power-holder with a club given by Scalped-Man, and the enemies
    are overcome.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The medicine-man becomes a great warrior and finally commits suicide while
    grieving for Scalped-Man, who disappears.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the second abstract, a lost man returns after two years wearing a buffalo
    robe covered with feathers and a feather headdress, later makes a feather bundle,
    and repeatedly visits a feather-covered hill to pray though he has no power.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The feathered man takes his nephew to the feathered hill, drops him through
    a hole into an eagles' den, offers him to the animals to devour, and receives
    no power afterward.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Eagles receive the boy, are angry at the man for the impatient sacrifice,
    decide to punish him, and include two old featherless Eagles described as parents
    of all Eagles.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Eagles decide to keep the child and teach him their power; by flying around
    him and scattering feathers and down, they make him into a young Eagle who lives
    with young Eagles and eats meat brought by old Eagles.
  category: sequence
  evidence_refs:
  - ev:10
