canonical_text:
  quote: ''
  summary: A female Bear instructs a woman in bear medicine objects and a painted
    tipi, sends two young Bears with her, and later appears in a dream telling her
    to kill the remaining young Bear. The woman prepares the skin as a spirit-holding
    object, begins to act like a bear, empowers her husband in battle with red paint
    and a feather, and is summoned to treat a wounded man after other medicine-men
    cannot help.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The female Bear tells the woman to put paint on her person, put a feather
    on her head, and have a painted tipi made from tanned buffalo hides.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tipi is to have a yellow circle at the bottom, a black band in the middle,
    red above, and a west-side image of a cedar tree with two owls beside it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The female Bear says the two owls are friendly to the Bears and guard the
    entrance.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The female Bear tells the woman to take two young Bears home and says that
    if they are killed their skins can be made into casks for the woman's children.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The female Bear says the Bears will come back to the Bears after they are
    killed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: The woman starts home with the two young Bears; the wilder Bear strays away
    on the third night, while the little Bear remains with her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The little Bear resists entering the village because he is not used to the
    odor of people, and the woman carries him into the village on her back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: In a dream, the female Bear tells the woman to have the little Bear killed
    and says he will return to her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: The woman's brother kills the little Bear; the woman tans the skin, paints
    the inside yellow, puts a yellow-painted feather on the head of the bear skin,
    and hangs it on a pole in the sun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The passage states that the skin was to hold the spirit of the Bears so that
    the spirit would be present with the woman.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: The woman makes grunting noises like a Bear when touched and is seen at sunrise
    with yellow paint, a yellow downy feather, and the bear hide.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: Her husband notices her grunting at night and thinks she must have been with
    the Bears; the people are careful in speaking to her because she acts like a bear.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: The woman realizes that she has the spirit of a bear and connects this with
    becoming sick as a young girl when her nails were cut.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:14
  text: During an enemy attack, the woman gives her husband red paint for his body
