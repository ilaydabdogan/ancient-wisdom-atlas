  quote: ''
  summary: After several years among the Eagles, Eagle-Boy has become a young man
    and is to be sent home. An old Eagle instructs him to kill and skin him so that
    the Eagle's spirit will stay with him. The old Eagle gives him a claw, a downy
    feather, earth to use as battle paint, and a bone whistle from an Eagle wing,
    and promises Eagle help in battle and sickness.
