canonical_text:
  quote: When they arrived at the moon, they placed the old woman in it, and there
    she was left to stay for all time.
  summary: In the closing episode of “The Basket Game, or The Woman in the Moon,”
    two boys resist Spider-Woman’s deadly jumping game and weather songs. The older
    boy then sings storms, heat, and grasshoppers into being. The grasshoppers lift
    Spider-Woman to the moon, where she remains, and then fly to the sun, explaining
    visible celestial and summer phenomena. The passage also begins the next tale,
    introducing a lame man and his niece and a warning about children wandering away
    from home.
  language: English
  quote_policy: quoted
