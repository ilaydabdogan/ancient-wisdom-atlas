canonical_text:
  quote: ''
  summary: In the morning the young man goes down to a spring to drink. At the cave
    from which the water flows, he sees an old woman, who tells him to go back up
    the hill and return before sunset to drink again. The young man goes up the high
    hill and cries; another man comes and cries beside him. The young man tells the
    other man, addressed as his brother, to go down to the village and stay with his
    people, leaving him alone on the hill.
