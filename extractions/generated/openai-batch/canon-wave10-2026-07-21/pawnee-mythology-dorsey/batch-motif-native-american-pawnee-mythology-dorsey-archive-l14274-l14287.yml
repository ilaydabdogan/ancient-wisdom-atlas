canonical_text:
  quote: ''
  summary: A wonderful boy loses his wife and leaves his people. The people are hungry
    because there are no buffalo, so the chief orders young men to search the country
    in pairs. Two young men travel west for many days, become unable to go farther
    for lack of food, climb a high hill, see an earth-lodge in the west, infer that
    its occupant must be Pawnee, approach at sunset, listen, hear a man talking, recognize
    him as one of their people, and enter as he begins to speak.
  language: English
  quote_policy: summarized
