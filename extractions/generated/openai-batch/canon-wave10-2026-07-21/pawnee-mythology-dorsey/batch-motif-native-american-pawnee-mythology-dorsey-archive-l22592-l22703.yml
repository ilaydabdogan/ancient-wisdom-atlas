canonical_text:
  quote: ''
  summary: The passage contains Coyote tales. In one, Coyote persuades young Turkeys
    and then older Turkeys to enter a sack and roll down a hill; he carries the older
    Turkeys home as captured prey, but his child opens the sack and the Turkeys escape.
    The little Coyotes are punished and sing a mocking song about their father. In
    another tale, Coyote proposes a fright contest with Prairie-Chicken while intending
    to kill and eat him; Prairie-Chicken later frightens Coyote at a steep bank, causing
    Coyote to fall into a canyon and die. A note explains the story as a warning to
    children. A following tale begins with Coyote trying to lure Prairie-Chicken down
    from a tree, and the two exchange songs about bewitching and poison-ivy berries,
    with a note about teaching children that some things poisonous to people are not
    poisonous to prairie chickens.
  language: English
  quote_policy: summarized
