canonical_text:
  quote: ''
  summary: Woodpecker-Boy repeatedly kills game for an old woman’s household while
    the rest of the village starves. The chief’s youngest daughter learns that the
    man in the chief’s lodge is Bear-Man, who stole Woodpecker-Boy’s clothing and
    threw him into a hole. She returns the hung things to Woodpecker-Boy; Bear-Man
    changes into a bear and is driven away with fire sticks. Woodpecker-Boy then provides
    food, instructs the people to move for game, gives seeds, teaches planting and
    seasonal hunting, orders that his woodpecker-head cap be worn in dances, and disappears
    after naming a poor boy as his successor. The next tale opens with a poor woman
    and homeless boy living in a grass-house at the edge of a village near a stream,
    ravine, and forked cottonwood tree.
  language: English
  quote_policy: summarized
