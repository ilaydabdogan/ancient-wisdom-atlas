canonical_text:
  quote: ''
  summary: Proud-Boy repeatedly boasts among the boys that he wants to fight, kill,
    and take a scalp. After a successful buffalo hunt, the people hold thanksgiving
    ceremonies and offer buffalo tongues and hearts to gods in the heavens. Proud-Boy
    directs his father and others to prepare a horned buffalo scalp, a buffalo-hide
    tipi painted with animal figures, cedar poles, and later a ceremonial setup with
    dirt, a mound, a cedar tree, the scalp, and a robe painted with the sun and birds.
    In spring the Kitkehahki prepare for a large ceremony near the Platte River and
    invite other tribes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Proud-Boy repeatedly enters the place where boys are playing, commands them
    to stop making noise, and boasts that he longs to fight, kill, and take a scalp.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The children report Proud-Boy's behavior, and they give him the name Proud-Boy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After many buffalo are killed and the meat is dried, the people return eastward
    to their village.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people hold thanksgiving ceremonies for the successful hunt and offer
    tongues and hearts of many buffalo to gods in the heavens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: During the following winter, buffalo come in droves to the village, so the
    people do not have to go on the hunt.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Proud-Boy asks his father to kill a young buffalo bull and take its scalp
    with the horns left on it; the father brings the scalp home, and it is tanned
    and prepared as Proud-Boy directs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Proud-Boy asks for several buffalo to be killed to make him a tipi because
    he wants to live by himself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Women sew tanned buffalo skins together, and selected men paint the tipi as
    Proud-Boy directs.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: The tipi is painted with a Cinnamon Bear, a Grizzly Bear, a Mountain-Lion,
    buffalo, an Eagle, Red and Black Owls, and many other birds.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Women cut and prepare cedar poles for the tipi; afterward the tipi is folded
    and put away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In spring the Kitkehahki prepare for a big ceremony, select a place on the
    Platte River, and send runners to invite other tribes.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: A note describes a willow used in a race to mark the center of the ceremonial
    circle, and says the received presents are offered to the gods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: That night Proud-Boy orders his mother to put up his tipi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: When the tipi is put up, dirt is piled around the lodge circle, a dirt mound
    is made on the west side inside, a cedar tree is placed by the mound, the buffalo
    scalp is hung at the head of the bed, and a robe painted with the sun and birds
    is spread on the bed.
  category: object
  evidence_refs:
