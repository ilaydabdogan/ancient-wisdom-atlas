canonical_text:
  quote: ''
  summary: A man kills a Buffalo bull who is chief of all Buffalo after turning into
    stone, then protects his village by placing stones that grow into a defensive
    wall. The buffalo herd attacks, breaks itself against the wall, scatters, and
    the stones later shrink and remain as a memorial circle. Years later the man loses
    his stone; the gods are angry, send a western storm, and lightning kills him after
    he says he will be taken and placed among the gods. A new tale, “The Turkey Ritual,”
    begins with Turkeys arriving as warriors; Old Gobbler sings of acorns, blue clay,
    and red paint, and an old man interprets these songs as explanations for the Turkeys’
    shiny coats and red legs.
  language: English
  quote_policy: summarized
