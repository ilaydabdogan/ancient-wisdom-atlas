canonical_text:
  quote: ''
  summary: Bear-Woman performs offerings involving tobacco, horse saliva, pipe smoke,
    directions, Tirawa, the sun, and the Bears. She tells her husband how the Bear
    took her to its den and teaches him Bear songs. Her later children’s survival
    is linked to two young Bears. She has a tipi painted according to Bear instruction,
    leads Bear dance ceremonies, and uses Bear-spirit power to protect her husband
    in war, though he dies when not possessed by that power. Afterward she teaches
    her son. A Chaui man brings gifts, is tested, and receives the Bear mysteries
    and Bear dance, with his tipi painted like hers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman places offerings to the west and southwest, identifies the southwest
    as the home of the Bears, and applies native tobacco to the bear hide’s nostrils
    while passing her hands over the hide.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman instructs her husband to smoke a pipe with whiffs directed to Tirawa,
    the sun in the east, the setting sun in the west, and the southwest home of the
    Bears; the ashes are dumped southwest of the fireplace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the smoke offering, the woman tells her husband that the Bear came to
    her and took her to the Bears’ den, and she teaches him songs she learned from
    the Bear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people are said to know that the woman has wonderful powers.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman has a son who is never known to be sick and a daughter; several
    later children die, which she connects with having caught only two young Bears.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman makes a tipi from tanned buffalo hides and has it painted as the
    Bear had told her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Bear ceremonies and dances, the woman is sent for because she is one of
    the leading persons in the Bear dance.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: On buffalo hunts, the woman has her husband possessed of the Bear spirit so
    that arrows and bullets cannot go through his body, but she warns that a strike
    on the hands will kill him.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: During an enemy attack on a buffalo hunt, the husband fights while wounded,
    says he was not possessed by the Bear’s spirit when attacked, and dies after the
    Skidi retreat through a pond.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: After word is sent to Bear-Woman, she asks the women if any are sick with
    blood; her husband’s niece answers that she is, and Bear-Woman takes her toward
    the place where the men are bringing the husband.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After her husband’s death, Bear-Woman mourns for many days and months, teaches
    her boy the mysteries of the Bear, and keeps her tipi decorated.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A Chaui man brings dried buffalo meat, robes, and two ponies, asks Bear-Woman
    to teach him the mysteries of the Bear, is tested by her, and receives the Bear
    mysteries and Bear dance; his tipi is painted like hers.
  category: sequence
  evidence_refs:
  - ev:8
