  summary: In several short Coyote tales, Coyote sings warnings to Prairie-Chicken,
    unsuccessfully seeks marriage with Rabbit, appears as Coyote-Man to lead people
    to salt after children petition him, and a Coyote scout on a buffalo hunt schemes
    after seeing rosebuds instead of buffalo.
