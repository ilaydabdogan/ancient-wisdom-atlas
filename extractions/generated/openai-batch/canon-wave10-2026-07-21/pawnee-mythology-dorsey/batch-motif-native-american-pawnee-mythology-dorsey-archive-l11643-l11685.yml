canonical_text:
  quote: ''
  summary: Coyote is spared by the Buffalo, secretly directs the girl to roll a ring
    to him, and begins a relay in which animals and birds carry the ring while the
    Buffalo pursue. Some Buffalo become stuck in mud, and the relay ends when Eagle
    carries the ring into the heavens. The Buffalo then decide to scatter over the
    land so people may kill them. The girl returns to her people and instructs them
    to select a holy girl each year so the Buffalo will come.
  language: English
  quote_policy: summarized
