canonical_text:
  quote: ''
  summary: A man follows a dream instruction to the place where he had heard crying
    and meets a woman linked to a speckled corn kernel. She identifies herself as
    Corn-Woman, says her spirit is of Mother-Evening-Star, instructs him to carry
    the kernel, helps him through dreams, and directs him to make the kernel into
    a sacred bundle. His mother cares for and prays to the bundle, and Corn-Woman
    later gives instructions for delayed marriage and corn planting, resulting first
    in five ears and then more planting.
  language: English
  quote_policy: summarized
