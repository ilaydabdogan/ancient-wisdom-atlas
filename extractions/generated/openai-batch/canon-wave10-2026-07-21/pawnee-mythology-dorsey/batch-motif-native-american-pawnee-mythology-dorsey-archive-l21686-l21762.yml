canonical_text:
  quote: ''
  summary: Coyote-Man deceives Bear by making himself look needy, persuades Bear to
    let him take tallow, kills and butchers Bear, and roasts the meat. A squeaking
    tree distracts him; when he climbs and threatens it, his hand is caught between
    rubbing trees. While trapped, he calls out to other Coyotes in a warning form
    that brings them to the cooked meat, which they eat. After being released, he
    meets a strange man equipped with medicine objects, who says he is traveling to
    doctor a chief's wounded son and describes his approach-song.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bear asks where Coyote-Man is going, and Coyote-Man says he is going to a
    village west of there; Bear says he is going to his den.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Bear leaves, Coyote-Man runs through timber in a large circle, comes
    to a creek, puts mud on his head and body, and puts white clay on his lips so
    they look chapped.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Coyote-Man asks Bear for grease for his chapped lips; Bear says he knows Coyote-Man
    is tricky but eventually agrees.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bear tells Coyote-Man to cut him on the loin for a little tallow; Coyote-Man
    cuts deeply, puts a spiked arrow into the wound, and kills Bear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Coyote-Man skins Bear, cuts up the meat, carries it to a pile of dried limbs,
    makes a large fire, and roasts the meat before eating.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A squeaking tree interrupts Coyote-Man; he threatens the source of the noise,
    climbs up, sees two trees rubbing, places his hands there, and his hand is caught
    when the trees move.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: While caught in the tree, Coyote-Man calls to a drove of Coyotes, telling
    them not to come because he has cooked meat; the Coyotes come and eat all the
    meat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the Coyotes leave, the trees open, Coyote-Man gets loose, scolds himself,
    and licks the remaining grease from the ground.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Coyote-Man later meets a strange man wearing a buzzard cap and buffalo robe,
    carrying an eagle wing and gourd rattle, and bearing a medicine-bag on his back.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The strange man says he is going to a western village to doctor the chief's
    son, who was wounded in battle, and that he will bathe him and receive presents.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The strange man says that near the village he stops, sits briefly, rises,
    and sings repeatedly about a medicine-case on his back.
  category: speech
  evidence_refs:
  - ev:8
