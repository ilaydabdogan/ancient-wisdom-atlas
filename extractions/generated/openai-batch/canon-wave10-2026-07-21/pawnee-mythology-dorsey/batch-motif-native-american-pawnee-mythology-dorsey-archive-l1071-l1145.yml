canonical_text:
  quote: ''
  summary: 'The passage first concludes a buffalo-related ceremony involving pipe
    handling, meat preparation, grease applied to lodge posts and the fireplace, communal
    assent, and a chief''s statement that the buffalo under the earth have heard the
    buffalo call and will help send buffalo for the hunt. A new section then begins:
    the first two created people are placed near Nemaha, Nebraska, build a west-facing
    earth-lodge, multiply through descendants, keep a sacred bundle, and move west
    in three village groups. At a gambling-stick playground, a detached man sees a
    strange woman; the next morning he finds split-hoof animal tracks where her footprints
    should be. Later she crosses the playground again, goes over the hills, turns
    into a buffalo, and the man pursues her for many days.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pipe is put upon the ground four times, then given to a priest who says
    "Nawa," after which all also say "Nawa."
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two selected men cut up meat and boil it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A young man is instructed to take grease from the soup, rub it on posts at
    named lodge positions and the fireplace, and pour grease into the center of the
    fireplace.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The young man gives a buffalo-horn spoon to the chief; the chief says "Nawa,"
    sits down, and the meat is divided among the people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The chief says the ceremony came from forefathers, was performed as nearly
    as possible according to what Tirawa told them, and that the buffalo under the
    earth have heard the buffalo call and will help send buffalo for the hunt.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The chief tells the people to arise and go out through an entrance called
    the wonderful buffalo's entrance.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The next section is titled "The Four Gods in the West."
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: When the people were first put on the earth, two first-created people were
    placed near what is now Nemaha, Nebraska, and made a west-facing earth-lodge.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The first-created pair increased, had many children, and gave separate lodges
    to married children.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The first lodge had a sacred bundle; the related lodges lived on dug foods
    such as artichokes and ground beans.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The people moved west, arranging one village behind while two other villages
    were in front.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: At one stopping place, people played with gambling sticks on the south side
    of the village; the source note identifies the game as a ring-and-javelin game
    in which the javelin symbolizes the buffalo.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: One man who did not seem to care for anything sat near the players and remained
    at the playground after others went home at dark.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The man heard a grunting sound like that of a woman and saw a strange woman
    with a covering over her hair pass through the gambling grounds and go over a
    hill.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: The next morning the man looked for the woman's footprints and instead found
    tracks of an animal with split hoofs; the people came to see the tracks and were
    reluctant to play again, though some urged play to continue.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: Late in the afternoon the people saw a woman come from a hill, run across
    the playground, pass the seated man, circle around, go over the hills, and turn
    into a buffalo.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: The seated man jumped up and ran after the buffalo for many days.
  category: action
  evidence_refs:
  - ev:17
