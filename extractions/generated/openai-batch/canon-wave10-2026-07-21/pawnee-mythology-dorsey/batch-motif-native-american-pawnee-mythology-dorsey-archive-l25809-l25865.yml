canonical_text:
  quote: ''
  summary: A girl carrying a bundle lives under ritual restrictions with a priest;
    a successful buffalo hunt and crop safety are followed by ceremony, after which
    she is named Yellow-Corn. A boy who wishes to marry her is rejected for lacking
    war honors and later becomes despondent when she marries a great warrior. In the
    wilderness he encounters animals and receives food, medicines, powers, a sun-picture
    robe, and instructions concerning animal images and a buffalo scalp. He returns
    transformed as Proud Boy, gains public recognition, and later takes Yellow-Corn
    to his tipi during a spring ceremony, despite her existing marriage and her mother's
    attempt to retrieve her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The girl lives with a priest, carries a bundle during a buffalo hunt, and
    is warned that she must sit still or the wind, buffalo, and western gods will
    respond unfavorably.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The buffalo hunt succeeds; the girl is given the buffalo heart and tongue;
    crops are found unmolested; the bundle is opened in ceremony; her ointment is
    removed; the gods stop watching her; she is named Yellow-Corn.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A boy's attempt to marry Yellow-Corn is refused because he has not gone on
    the war-path or taken scalps; he becomes sad and wanders, and later learns that
    Yellow-Corn has married the greatest warrior in her village.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy goes to the water dogs, is mourned as dead, sees a girl in the timber,
    discovers on embracing her that she is a deer, mourns, and tells animals to kill
    him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Birds take pity on the boy and give him a root to eat; owls and water dogs
    come to him during the night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Buffalo gives the boy a robe bearing a picture of the sun and tells him that,
    if killed, he should throw the robe over himself and birds would wake him from
    sleep.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boy finds himself in an animals' lodge, where four bears give him power
    to conquer enemies and medicines, and animals instruct him to put their pictures
    on his tipi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Buffalo tells the boy that the first buffalo he kills will be Buffalo himself
    and instructs him to take its scalp and place it on a pole at the head of his
    bed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The boy returns to his people, appears painted and gaily costumed with an
    eagle fan and painted pony, boasts of overcoming enemies, and receives the name
    Proud Boy.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The people kill many buffalo, hold thanksgiving ceremonies, later find buffalo
    near the village, and Proud Boy obtains the buffalo scalp as directed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In spring a large ceremony is held by three tribes; Proud Boy's tipi is erected,
    and a cedar tree is placed on a little mound to the west.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Yellow-Corn arrives with her mother; Proud Boy asks for Yellow-Corn, her mother
    consents, and Yellow-Corn goes to his tipi, where she and Proud Boy eat and speak
    of mutual love.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Yellow-Corn says she is already married and that her great-warrior husband
    will return; Proud Boy says he is not afraid, and Yellow-Corn remains with him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Yellow-Corn's mother later finds her with Proud Boy and asks her to return,
    but Proud Boy refuses; many ceremonies are held while Proud Boy and Yellow-Corn
    remain alone in their tipi, and victorious warriors return.
  category: sequence
  evidence_refs:
  - ev:7
