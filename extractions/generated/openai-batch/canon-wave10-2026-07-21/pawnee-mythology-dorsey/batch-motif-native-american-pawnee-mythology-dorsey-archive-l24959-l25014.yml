canonical_text:
  quote: ''
  summary: Three Pawnee myth abstracts are included. One tells of a witch-woman who
    steals a wonderful painted buffalo robe from a boy identified with North Wind
    and is transformed into a spring after a storm. Another tells of a cannibal witch-woman
    who kills one boy in a river-diving contest but is overcome by his twin brother
    with Beaver aid, becoming a spring near the river. A third begins a story in which
    starving Coyote meets a girl and sky-bird brothers who cause buffalo to follow
    her back.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Witch-Woman in a village kills many people, steals, and has power to turn
    people into animals.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Attempts to kill the Witch-Woman with sticks and knives fail, and a priest
    sings songs foretelling her death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A spring visitor wears a robe painted with stars, clouds, lightning, the sun,
    the moon, swallows, and flies.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A deer belonging to the old woman challenges the robe-wearing boy to race,
    and the boy wins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: During a false alarm of enemies, the woman steals the boy's robe, taunts him,
    and wears the robe as a skirt.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The boy sings four times, after which the old woman recognizes his power and
    gives back the robe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The old woman is taken up to the heavens in a rainstorm, thrown back into
    a muddy ravine, urinates, and is thereafter described as a spring.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The boy says he represents North Wind, becomes a speckled snowbird, and flies
    north.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In a second story, a boy refuses to eat with a Witch-Woman, enters a diving
    contest with her, is killed, and his head is placed with her trophies.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The dead boy's twin brother goes to find him, cries at the river bank, and
    is taken by Beaver into the Beavers' lodge.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Beavers feed the twin with boiled meat from a young beaver's leg; the
    bone is thrown into water, and the young Beaver returns with the leg intact.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Beaver chief gives the twin blue mud with which he paints himself before
    the contest.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: The twin enters the Beavers' lodge during the dive, stays there until the
    old woman appears on the bank, then comes above the water victorious.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: The witch people are killed and trampled into the ground, water is forced
    from the old woman, and she becomes a spring near the river.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: In a third story, Coyote and Spider-Woman are famishing, and Coyote eats small
    pieces cut from Spider-Woman's dress.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: Coyote follows the smell of roasting meat for four days and finds a tipi with
    a young girl seated on the west side and sweet grass on the floor.
  category: setting
  evidence_refs:
  - ev:16
- id: obs:17
  text: Bald Eagle, White Eagle, other eagles, Hawk, Crow, and Magpie come from the
    sky or arrive at the tipi, and the eagles call Coyote grandfather though he cannot
    see them.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:18
  text: The eagles swing the girl from two lariats hanging from the sky; she flies
    west, returns with buffalo following her, and Crow kills two buffalo while crying
    'Caw! Caw!'
  category: sequence
  evidence_refs:
  - ev:18
