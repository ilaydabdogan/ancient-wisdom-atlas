canonical_text:
  quote: ''
  summary: A boy accepts Spider-Woman's deadly tree-climbing challenge, sings that
    he belongs in trees, survives the falling tree, and Spider-Woman and her people
    are killed. He declares that human-eating will cease, assigns mice to the foot
    of hollow trees and his own people to the top, and becomes a speckled woodpecker.
    The next tale begins with a Witch-Woman who kills, steals, transforms boys into
    animals, resists ordinary weapons, and is addressed through ritual consultation
    with an old priest.
  language: English
  quote_policy: summarized
