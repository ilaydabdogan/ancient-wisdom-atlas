canonical_text:
  quote: ''
  summary: A girl pursued by a human Skull seeks help from Bear and Buffalo, but both
    say they cannot help her and direct her onward. She delays the Skull by dropping
    a water bladder that becomes a river and by planting an arrow that becomes thorny
    trees. The Skull crosses by log and later burns through the trees with fire from
    its mouth. The girl reaches a lodge of three armed boys; the eldest breaks the
    Skull with a war club, and the girl further smashes and burns its pieces. The
    boys let her stay until their older brothers return.
  language: English
  quote_policy: summarized
