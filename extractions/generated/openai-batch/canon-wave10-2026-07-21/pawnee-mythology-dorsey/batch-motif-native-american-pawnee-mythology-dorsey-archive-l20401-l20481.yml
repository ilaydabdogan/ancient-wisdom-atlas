canonical_text:
  quote: ''
  summary: A boy called Handsome-Boy resolves to leave home and make a name for himself.
    Traveling over the plains with two horses, he suffers because he has no means
    to make fire. A mysterious being appears in dreams, claims to stand between people
    and spirits, promises to make him a great man, and directs him to hills where
    he finds a flint knife and later fire sticks. He encounters eagle-like human beings
    near water, kills buffalo, dries meat, learns to make fire, and later waits near
    a Prairie Dog village after further dream instruction.
  language: English
  quote_policy: summarized
