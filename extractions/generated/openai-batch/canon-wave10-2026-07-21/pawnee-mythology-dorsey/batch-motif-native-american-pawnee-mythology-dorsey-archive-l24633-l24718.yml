  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the wife and child become Prairie Dogs, Bright Eyes has bad luck and
    dies broken-hearted.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Two wonderful brothers live in a village from which many young men have gone
