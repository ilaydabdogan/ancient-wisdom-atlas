candidate_motifs:
- id: motif:1
  label: Divine punishment by storm and placement in the heavens
  taxonomy_refs:
  - divine_judgment
  - ascent
  basis: Gods are angered after Flint man loses his magic stone; they send a rainstorm
    and lightning, and he is placed in the heavens.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The abstract gives limited context for why loss of the stone angers the
    gods or what placement in the heavens means.
- id: motif:2
  label: Magically growing protective enclosure
  taxonomy_refs: []
  basis: Villagers place stones around the village; the stones grow into a high corral
    during the buffalo attack and shrink the next day.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No available taxonomy reference directly matches this enclosure pattern.
- id: motif:3
  label: Animal beings instruct humans to hunt them for food
  taxonomy_refs:
  - sacred_exchange
  basis: Turkey warriors, called sages, tell the people where they are going so that
    the people may hunt them for food.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The exchange is implied by the turkeys' speech but not elaborated as a
    formal reciprocal covenant in the abstract.
- id: motif:4
  label: Human departure into animal community and return
  taxonomy_refs:
  - departure
  - return
  - shapeshifter
  basis: Bright Eyes leaves his village, enters Prairie Dog town, marries there, and
    is later restored to his mother's son through the black arrow.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The abstract does not fully describe the mechanics of Bright Eyes's initial
    transformation or residence among Prairie Dogs.
- id: motif:5
  label: Animal spouse becomes human and bears children
