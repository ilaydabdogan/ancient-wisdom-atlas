  text: After a girl says she does not love him, Bright Eyes grieves, leaves alone
    toward the east, crosses a river, enters Prairie Dog town, and marries a young
    Prairie Dog.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Bright Eyes's mother tracks him by tears and footprints, mourns near Prairie
    Dog town, and receives a vision from a beautiful young girl.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: The vision directs the mother to bring a black arrow from the boy's quiver
    to a hole; when Prairie Dog leaves the hole and jumps at the arrow, he becomes
    her son again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Bright Eyes returns home with his pregnant Prairie Dog wife; she rolls in
    dust, becomes a woman, and they have many children.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Prairie Dog wife warns Bright Eyes not to associate with the girl who
    had rejected him; after he lies with that girl, his wife and child cross the stream
