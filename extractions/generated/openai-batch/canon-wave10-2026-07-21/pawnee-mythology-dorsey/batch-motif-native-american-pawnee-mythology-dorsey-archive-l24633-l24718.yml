    strikes him, and he is placed in the heavens.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: A village crier announces enemies, but the approaching warriors are turkeys
    described as sages who tell the people where they are going so that people may
    hunt them for food.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bright Eyes lives near a village between a hill and a creek, with Prairie
    Dog town across the creek.
  category: setting
  evidence_refs:
