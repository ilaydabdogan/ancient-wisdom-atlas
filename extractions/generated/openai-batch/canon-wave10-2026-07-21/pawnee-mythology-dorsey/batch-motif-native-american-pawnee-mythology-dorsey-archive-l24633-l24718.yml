canonical_text:
  quote: ''
  summary: 'The passage summarizes several Pawnee myth abstracts: a buffalo-chief
    killing followed by a buffalo attack, magically growing stones, and divine lightning
    punishment; a turkey ritual in which turkey warriors explain that people may hunt
    them; Bright Eyes leaving human society for Prairie Dog town, being restored by
    his mother, marrying a Prairie Dog wife, and losing her after violating her warning;
    and a two-brother gambling story in which the elder dies and the younger defeats
    Gambler with buffalo-spirit gaming implements.'
  language: English
  quote_policy: summarized
literal_observations:
