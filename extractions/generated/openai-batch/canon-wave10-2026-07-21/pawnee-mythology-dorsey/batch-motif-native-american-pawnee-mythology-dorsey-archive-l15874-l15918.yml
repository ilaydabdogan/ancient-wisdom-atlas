canonical_text:
  quote: ''
  summary: In a ceremonial context involving a pole and a foot race, Proud-Boy watches
    a girl win a contested race. After a second race is arranged, the girl's father
    gives her a red-painted calf robe to wear. She wins again, passing all runners.
    Proud-Boy declares that he will seek divine help, perform war deeds, capture and
    give ponies, and claim her as wife. Priests anoint the girl with holy ointment,
    sing, and raise the pole while people cry to the gods; Proud-Boy joins the shouting
    as a petition for divine favor.
  language: English
  quote_policy: summarized
