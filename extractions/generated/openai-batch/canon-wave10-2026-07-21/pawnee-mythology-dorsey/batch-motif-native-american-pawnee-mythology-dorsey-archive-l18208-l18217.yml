canonical_text:
  quote: ''
  summary: A selected man directs companies by hand motions to move and attack from
    each side. After the surround is made, the chief gives a sign and the people rush
    the Buffalo, which rise and try to run. A Buffalo cow designated not to be killed
    is spared. Many bulls are killed and meat is distributed to everyone. While skinning
    the Buffalo, the men find eagle feathers and native tobacco on their heads, leading
    each man who killed a Buffalo to understand that Howling-Fox was involved in their
    coming. The passage then begins an incomplete return-to-camp action.
