canonical_text:
  quote: The North Star is the one which is to end all things.
  summary: 'The passage describes Pawnee teachings about the end of the world: Tirawa
    and heavenly gods may decide the day and manner of ending; celestial bodies give
    life and announce signs; the North Star guides the dead and is tied to circling
    stretchers; the South Star eventually rises, captures the stretcher-bearers, and
    takes possession; final signs include meteors, color changes in Sun and Moon,
    rising waters, crying animals, and clam shells that cry and appear bird-shaped.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Tirawa says there are several ways of destroying people on earth, including
    storms, while sending fire from the sky is described as a thing he is not sure
    of doing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gods in the heavens placed by Tirawa would sit in council, select a day
    when all things would end, and decide how all things should cease to be.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Morning-Star is said to rule the minor gods; Morning-Star and Evening-Star
    gave life to people, and Sun and Moon also helped give life.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A red Moon is a sign that the world is ending; a black Moon is a sign that
    a great chief is to die; the Sun shines brightly and then its brightness dies
    out before the end.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The North Star was placed in the north so that it would not move and would
    watch over the other stars and the people.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: When a person dies, the North Star takes the person and places them on a pathway
    leading to the Star of Death, the land of spirits, identified as the South Star.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The South Star was given power to move close to the North Star from time to
    time, look to see whether it still stood in the north, and then move back to its
    place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: An old person and a young person became sick, were placed on stretchers, were
    carried by certain stars, and the two stretchers are tied to the North Star and
    circle it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: As the end approaches, the South Star comes higher until it captures the people
    carrying the stretchers; the two people on the stretchers die, the North Star
    disappears and moves away, and the South Star takes possession of the earth and
    people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Other signs of the end include meteors flying through the sky, the Moon changing
    color, the Sun showing different colors, and rivers and creeks rising.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Animals such as otter, beaver, and others drift down the streams and cry out
