- id: obs:1
  text: The introductory note states that a woman receives power from the buffalo
    and becomes a medicine-woman.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Buffalo bull instructs the woman to place the child on the ground, rolls
    in the dust, and tells her to put the child in the robe made while he wallowed
    and to put dust over the child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the first bull bawls, three more bulls come; they blow breath upon the
    child, and one bull places wool from his back on the child.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Buffalo cow lies down, the child is placed beside her, and after sleep the
    child is said to be well; by daylight the boy is strong and well.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The Buffalo gives the woman a root and instructs her to pound it and give
    it to the boy when he is sick, then wash him at the creek after pains appear.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Buffalo says that the root will scare wild beasts away.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the woman passes a snake while carrying the root, she looks back and
    sees that the snake has died.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Whenever the child becomes sick, the woman washes him in the river and he
    becomes well.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A man comes to live with the woman and asks to be her husband; she accepts
    him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The man learns about his wife's medicine and her power to cure the sick, asks
    how she received it, and hears how the Buffalo pitied her and saved the boy.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The man, woman, and boy go west to the Buffalo so the man can thank them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Buffalo bull teaches them the Buffalo dance and tells them to imitate
    the Buffalo rolling upon the ground.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the Buffalo rolls, a rattle is taken from the ground; the rattle has
    the picture of a buffalo skull and is to be shaken before sick people.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Buffalo rolls again and makes a whistle with a moon-shaped shell at the
    end and another shell tied to the middle.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Buffalo says that after the whistle is blown near a patient, seeing his
