canonical_text:
  quote: ''
  summary: A woman whose child is sick receives help from Buffalo beings. Buffalo
    bulls and a Buffalo cow doctor the child with dust, breath, wool, rest, and a
    root medicine. The root protects against danger and is used with washing in water.
    Later the woman's husband goes with her and the boy to thank the Buffalo. The
    first Buffalo bull teaches them the Buffalo dance, creates or provides a rattle
    and whistle for doctoring, gives a sign by which a patient’s outcome may be known,
    and disappears. The man later becomes a medicine-man and gives the people the
    Buffalo dance.
  language: English
  quote_policy: summarized
