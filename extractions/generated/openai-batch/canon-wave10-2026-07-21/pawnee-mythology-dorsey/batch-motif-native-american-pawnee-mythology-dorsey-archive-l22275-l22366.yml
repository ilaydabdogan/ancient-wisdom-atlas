canonical_text:
  quote: ''
  summary: Turtle tricks a fat Buffalo into carrying him across a river, kills it
    from inside, and prepares to butcher it. Coyote learns of the kill, wins a proposed
    jumping contest to claim the Buffalo, and leaves Turtle with remnants while he
    goes for his children. Turtle anticipates Coyote's cheating, has Bald-Eagles carry
    the meat and himself to a Cottonwood nest, and cooks there. Coyote mistakes the
    fire's reflection for Turtle in the water, dives, is caught under logs, and dies;
    his children see Turtle in the tree and run away. A note says the story teaches
    children not to be fooled by those who misrepresent things after game is killed.
    The excerpt also begins the next tale, in which Coyote encounters Bear in the
    timber.
  language: English
  quote_policy: summarized
