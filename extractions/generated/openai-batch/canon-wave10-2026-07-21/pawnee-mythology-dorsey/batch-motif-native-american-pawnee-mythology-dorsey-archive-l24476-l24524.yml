canonical_text:
  quote: ''
  summary: The passage summarizes the end of one tale in which a boy aided by Moon
    travels by magic arrow, produces food and game, is robbed by Bear-Man, is rescued,
    regains his belongings, exposes the impostor, gives seeds, teaches agriculture
    and ceremonies, and disappears. It then begins tale 44, in which Burnt-Belly,
    the poor woman's son, enters a difficult squirrel-shooting marriage contest, shoots
    the squirrel, and has his prize claimed by a bear-clawed impostor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A female figure on an island addresses the boy as grandchild, says it is time
    to return to his people, gives him a magic arrow for crossing water, and is identified
    as Moon traveling as a swan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy goes at night to the village on his arrow and enters a lodge where
    his bow, arrow, and other belongings are hung up.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy returns with food and tells the chief to have people surround timber,
    where they find ground-bean nests and many animals because the boy had made mud
    images at night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy repeatedly revisits the village, produces more game, and is called
    wonderful; on the third time buffalo are found in the timber.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bear-Man becomes jealous, digs a hole, and the boy falls into it while shooting
    himself across the lake; the boy is robbed of clothing and left in the hole.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Birds on the boy's clothing peck Bear-Man, and snake arrows and a bow bite
    him; nevertheless he enters the chief's lodge and gains favor from all the chief's
    daughters except the youngest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bear-Man fails to produce game as the boy had done.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After five days in the hole, the boy is discovered by an old woman's grandchild;
    the old woman and grandchild rescue and feed him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: With new bow and arrows, the boy and rescuer hunt increasingly large animals,
    and the old woman builds a fine tipi from the skins.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The chief's youngest daughter stays with the old woman, learns of Bear-Man's
    treatment of the boy, and restores the boy's clothing, quiver, and other belongings
    to him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the belongings are restored, snakes and birds express joy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The impostor turns into a bear and is chased out of the village by firebrands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The boy brings game one last time, gives seeds for planting, teaches agriculture
    and ceremonies, and disappears.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: In tale 44, the chief's tipi stands apart on the north side of the village
    near a stream, with a ravine and forked cottonwood nearby; a poor woman and her
    child live east of the village in a small grass-house and are mistreated.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:15
  text: A squirrel lives in the forked cottonwood, and the chief's eldest daughter
    has it announced that whoever kills the squirrel may marry her; only the squirrel's
    nose is visible.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Burnt-Belly, son of the poor woman, has the power of bringing buffalo by using
    a ring and javelin game in his lodge.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:17
  text: Burnt-Belly is laughed at but enters the contest and shoots the squirrel;
    a man with bear claws claims the prize, while Burnt-Belly obtains several hairs
    of the squirrel.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: The bear-clawed impostor takes the squirrel to the chief's lodge, marries
    the two eldest daughters, fails to make the squirrel skin emit light, and fails
    to bring buffalo.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:19
  text: The chief's youngest daughter refuses the impostor and runs to the old woman's
    lodge.
  category: action
  evidence_refs:
  - ev:7
