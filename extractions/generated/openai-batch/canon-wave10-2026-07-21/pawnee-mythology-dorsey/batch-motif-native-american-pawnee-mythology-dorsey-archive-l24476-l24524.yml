candidate_motifs:
- id: motif:1
  label: Celestial helper grants a water-crossing instrument
  taxonomy_refs: []
  basis: Moon, traveling as a swan and watching over people, gives the boy a magic
    arrow by which he can cross water and return to his people.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The abstract gives only a compressed account; the helper's fuller identity
    and relation to the boy are not elaborated here.
- id: motif:2
  label: Culture hero provides game, seeds, agriculture, and ceremonies, then disappears
  taxonomy_refs:
  - culture_hero
  basis: The boy produces game for the people, later gives seeds to plant, teaches
    agriculture and ceremonies, and disappears.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: high
  cautions: The passage is an abstract rather than a full narrative, but the provider-teacher
    pattern is explicit.
- id: motif:3
  label: False claimant steals the hero's place but cannot reproduce the hero's power
  taxonomy_refs: []
  basis: Bear-Man robs the boy and gains standing in the chief's lodge but fails to
    produce game; in tale 44 the bear-clawed man claims Burnt-Belly's squirrel and
    fails to produce expected light and buffalo.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: high
  cautions: The two examples occur in adjacent abstracts; direct narrative linkage
    between them is not stated.
- id: motif:4
  label: Shapeshifting bear impostor exposed and expelled
  taxonomy_refs:
  - shapeshifter
  basis: The impostor in the first tale turns into a bear and is chased out of the
    village by firebrands.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not explain whether the bear form is original identity,
    transformation, or revelation beyond the statement that he turns into bear.
- id: motif:5
  label: Animate belongings defend or recognize the rightful owner
  taxonomy_refs:
  - serpent
  basis: Birds on the stolen clothing peck Bear-Man, snake arrows and bow bite him,
    and the snakes and birds express joy when the belongings are restored to the boy.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The motif includes birds and weapons as well as serpentine forms; only
    the serpent component maps directly to the available taxonomy.
- id: motif:6
  label: Hidden or trapped hero is rescued and returns to prosperity
  taxonomy_refs:
  - return
  basis: The boy remains in the hole for five days, is discovered and rescued, receives
    new weapons, hunts successfully, regains his belongings, and is restored against
    the impostor.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage summarizes restoration rather than narrating a formal return
    episode in detail.
- id: motif:7
  label: Difficult bride contest won by derided poor youth and claimed by impostor
  taxonomy_refs: []
  basis: Burnt-Belly, the poor woman's son, is laughed at but shoots the squirrel
    whose killing wins marriage to the eldest daughter; a man with bear claws claims
    the prize.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The tale continues beyond the provided passage, so the final outcome of
