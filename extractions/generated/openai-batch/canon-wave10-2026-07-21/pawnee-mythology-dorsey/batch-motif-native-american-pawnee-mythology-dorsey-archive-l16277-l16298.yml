canonical_text:
  quote: '"There is a straight smoke going up over the hills to the south."'
  summary: A camp sees smoke to the south and then a victorious war party returns
    with horses, scalp poles, scalps, and ponies. Proud-Boy reassures Yellow-Corn.
    Yellow-Corn's husband is told that Proud-Boy carried her away and that she is
    living with him; he remains silent and goes to his own home. His brothers praise
    his warrior and ritual status, contrast him with the unproven Proud-Boy, and urge
    taking bows and arrows to kill both.
  language: English
  quote_policy: quoted
