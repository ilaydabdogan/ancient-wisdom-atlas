- id: obs:11
  text: After several years, the woman says she must go to her people, leaves the
    lodge, changes into a black-tail Deer, and runs away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The man remains with his people, cares for his children, observes that the
