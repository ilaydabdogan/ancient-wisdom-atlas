canonical_text:
  quote: ''
  summary: 'A man brings a Deer wife and fawn children into the village after they
    change into human form. They perform in the medicine-men''s lodge using white
    body paint, black marks, deer antlers, fawn skin, song, and transformations; the
    man is later made leader because of his powers. After years, the Deer wife returns
    to her own people by changing into a black-tail Deer, and the man eventually leaves
    for the woods and never returns. A new narrative begins: a man living away from
    the village dreams on the mountains of a black-painted messenger who summons him
    to a Deer dance in a cave, and after waking he is instructed by a speaking Raven.'
  language: English
  quote_policy: summarized
