canonical_text:
  quote: ''
  summary: At night two young men go to a hill to persuade a poor young man to stop
    crying and starving himself and to return with them and the captives. He says
    he can return only if they grant what is in his heart. After they promise, he
    recalls his poverty, his interest in chiefs, medicine-men, priests, offerings,
    sacred-bundle ceremonies, and medicine mysteries, and the group's raids and captures.
    He then proposes that they stay away from their own people, treat the conquered
    captives and their children as their people, and assign the chief's son as high
    priest, the medicine-man's son as medicine-man, and himself as chief. The final
    sentence in the supplied range is incomplete.
  language: English
  quote_policy: summarized
