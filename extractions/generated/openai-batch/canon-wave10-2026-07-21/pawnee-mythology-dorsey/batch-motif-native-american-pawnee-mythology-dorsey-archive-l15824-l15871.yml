canonical_text:
  quote: ''
  summary: A ceremonial sequence involves finding and cutting a tree, carrying it
    to the village, a race whose winner becomes holy, anointing and priestly observances,
    buffalo hunting and consecrated meat, invitation of other tribes for a repeated
    ceremony, and Proud-Boy's attention to a swift girl and to his own clothing as
    he says he is becoming a young man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A concealed man receives news that an enemy is alone; when the enemy comes
    near, an attack occurs and the man kills the enemy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A tree is found; a young girl is selected to cut it first, and warriors then
    assist her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the tree falls, men shout and women give a war cry; men carry the tree
    on horseback, with other men riding alongside to replace tired carriers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Men, women, boys, and girls are commanded to run to the village; the winner
    is to become holy and receive red ointment on the body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the race winner is a woman she lives with the priest until the season is
    over; if the winner is a man he wears a holy robe and is anointed by priests during
    the season.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Proud-Boy runs near the girl in the race but cannot keep up with her because
    she is a swift runner.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The tree is carried into the village and set in place; the ceremony is performed,
    visiting tribes return home, and the Kitkehahki remain in the village.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Proud-Boy wears paint and fine clothing while watching for the girl; his clothing
    includes a short buffalo-hide string tanned on one side and hairy on the other.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Kitkehahki go buffalo hunting, kill many buffalo, and young men consecrate
    many buffalo and bring meat to the priests' lodge, where it is jerked.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the buffalo hunt, another ceremony similar to the previous one is planned;
    in early spring a runner is sent to invite other tribes, and the tribes gather
    again.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:11
  text: Proud-Boy sees the girl dressed in beautiful garments made of buckskin, young
    buffalo calf skin, buffalo hide, calf hoofs, and black buffalo-hide moccasins.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Proud-Boy asks his father for something to wear; his father gives him buckskin
    and a waist string, but Proud-Boy is disappointed because he wants leggings.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Proud-Boy's aunt makes him elk moccasins; he paints and dresses himself and
    says that he has laid away his buffalo string and is getting to be a young man.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The ceremony is performed again, and the people travel many miles to get the
    tree, with some riding horses and others walking.
  category: sequence
  evidence_refs:
  - ev:7
