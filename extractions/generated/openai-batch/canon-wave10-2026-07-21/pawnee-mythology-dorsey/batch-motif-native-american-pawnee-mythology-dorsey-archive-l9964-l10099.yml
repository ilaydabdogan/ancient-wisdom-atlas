canonical_text:
  quote: For there were the buffalo, like threads covering the earth.
  summary: The passage gives a song of named landscape places visited by a singer
    who finally finds buffalo near the village; an explanatory note says people sing
    it on hunts so buffalo may be found nearby. The passage then begins a tale in
    which a boy living with his sister makes arrows, receives a visit connected with
    the Buffalo chief's daughter, shoots a young Buffalo cow whose arrow remains in
    her hair, and follows her through successive timber groves where a tipi and a
    covered woman appear.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The song names a sequence of places, including trees by water, hills, an earth-lodge
    at a hill foot, river banks, a cottonwood thicket, white clay, sand, black islands,
    buried human bones, a separating stream, and an island point with a tree clump.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The song speaker says he climbed a hill, arrived at the top, stood at a place
    where great herds of buffalo once started, and saw buffalo covering the earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prose explanation says the singer visited many places, found only prairie
    on the hills, and finally found buffalo near the village.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The prose explanation says people sing this song on their hunt so they may
    find buffalo near and not far away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A boy and his sister live by themselves; the boy travels south for feathers,
    makes arrows, and makes one arrow red, one black, and the others plain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A village in the west is described as the place where the Buffalo lived, and
    the daughter of the Buffalo chief comes to visit the boy and his sister.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy's sister sees someone coming to their tipi and sings to her brother
    about someone coming on the hilltops from where he brought feathers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A young Buffalo cow enters the tipi; the boy shoots at her, but the arrow
    does not pierce her body and its point curls under her hair, hanging on her side.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Buffalo cow runs outside, and the boy follows her to box-elder timber
    at twilight; when she enters the timber, the boy finds a tipi there and sleeps
    near it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The next morning the Buffalo stands where the tipi had been; she goes east,
    circles around, and goes west again, and the boy becomes angry and calls her names.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the evening the cow enters a cottonwood grove; the boy finds the tipi again,
    enters it, and sees a woman covered with her robe who gives him a calf robe for
    sleeping.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the morning the Buffalo stands by the boy with the arrow still in her hair;
    when he crawls toward the arrow, she runs again, slowly enough for him to keep
    following.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Toward evening the cow enters weeping-willow timber; the boy again sees the
    same tipi and sits inside on the south side.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: A footnote says the story is told during ceremonies by old men to children
    who enter the lodge, and that it teaches care of bows and arrows, desire to kill
    buffalo, consecration of meat to gods of the heavens through the bundle, and hospitality
    to strangers.
  category: other
  evidence_refs:
  - ev:12
