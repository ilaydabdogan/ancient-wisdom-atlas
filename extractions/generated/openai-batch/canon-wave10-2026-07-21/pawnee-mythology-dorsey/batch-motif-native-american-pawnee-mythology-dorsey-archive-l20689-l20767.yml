canonical_text:
  quote: ''
  summary: Handsome-Boy enters his father's lodge, finds another boy occupying his
    place, and does not reveal himself after his parents direct him away from the
    bed. He is invited to Young-Dog and Crazy-Dog ceremonies, selected as a brave,
    and proves himself in battle by killing enemies, counting coup, and taking scalps.
    His companion gains honor by following him. After the battle, women receive scalps,
    perform a Scalp dance, and praise the young man. The next day Handsome-Boy paints
    his pony and himself, wears scalps and a war bonnet, and sees a gray pony tied
    to a spear as a public challenge-reward sign for future battle.
  language: English
  quote_policy: summarized
