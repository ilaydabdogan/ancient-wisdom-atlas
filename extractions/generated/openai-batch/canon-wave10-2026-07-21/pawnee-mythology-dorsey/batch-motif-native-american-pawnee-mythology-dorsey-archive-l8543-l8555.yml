canonical_text:
  quote: ''
  summary: A crying woman continues on while animals try to catch the Eagle for her
    by means involving dead animal meat. The Eagle repeatedly refuses to eat. The
    woman reaches a lodge of Elks; the Elks host her, say they can call any animal,
    kill an elk, arrange its body over a hole, and place the woman beneath it. Birds
    and the Eagle come, but the Eagle again refuses the meat and flies away. The Elks
    are surprised, and the woman cries and goes a long distance.
