canonical_text:
  quote: ''
  summary: A man and woman live in a grass-house after traveling south. The woman
    bears a rapidly growing boy, and the afterbirth is buried by an elm tree. Strange
    sharp-spined beings kill and take the woman. A second boy, recognized as born
    from the afterbirth, is later captured and joins the father and first son. The
    two brothers undergo dangerous episodes involving a river crossing, snakes, thunder
    and lightning beings in a tree, and the cannibal beings who killed their mother.
    The boys destroy the cannibals' lodge, transform the leader and people into locust
    trees, survive as charred leaves, learn of the younger brother's Wood Rat source
    of power, seek their fleeing father, and enter an underground world following
    his trail.
  language: English
  quote_policy: summarized
