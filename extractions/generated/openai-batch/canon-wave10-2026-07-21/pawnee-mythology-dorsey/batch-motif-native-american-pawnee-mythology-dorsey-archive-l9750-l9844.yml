canonical_text:
  quote: HAWK SLAYS THE FIRE-KEEPER.
  summary: A young husband is seized, blinded, burned, and enslaved by a mysterious
    fire-associated being. His wife follows his traces westward, finds him in a hot
    lodge with her red-painted uncle, sings for his release, and leads him away. After
    a commanded fall from a rocky bank, he reappears from a cedar tree with his robe
    and leggings, sends his wife home, goes west to kill the being, and the people
    later see fire or meteors in the sky as the sign of the Fire-Keeper’s death.
  language: English
  quote_policy: quoted
