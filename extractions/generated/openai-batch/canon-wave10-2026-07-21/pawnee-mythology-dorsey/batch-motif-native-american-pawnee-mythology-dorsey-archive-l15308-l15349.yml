canonical_text:
  quote: ''
  summary: During Pawnee medicine-lodge ceremonies, a leader's wife repeatedly instructs
    her adolescent son to ask his father, the leader of the medicine-men, for admission
    into the lodge by offering a pony, presents, a pipe with tobacco, and food. The
    father refuses each time. The boy cries to his mother, who says her own father
    was also a medicine-ceremony leader and that she understands some of his mysteries;
    she then opens her sacred bundle and removes a black-dyed skirt. A note identifies
    the tale as told by White-Horse, Pitahauirat, and as a Pitahauirat version of
    the preceding tale.
  language: English
  quote_policy: summarized
