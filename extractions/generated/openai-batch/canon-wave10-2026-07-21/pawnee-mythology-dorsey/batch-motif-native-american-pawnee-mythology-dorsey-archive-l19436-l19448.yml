  summary: 'A lost man returns with a sacred bundle from a wonderful place. The people
    regard him as wonderful, kill many buffalo, and return to their village with him.
    The passage states that he actually has no powers, but has found a wonderful place
    and brought things from it home; he wants to learn more about that place. A note
    says the tale''s moral resembles No. 86: a young man should not mistreat a member
    of his own tribe for personal benefit.'
