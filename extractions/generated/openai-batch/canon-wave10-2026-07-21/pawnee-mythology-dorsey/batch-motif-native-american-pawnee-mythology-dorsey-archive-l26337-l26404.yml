candidate_motifs:
- id: motif:1
  label: human marriage with animal woman brings medicine power
  taxonomy_refs:
  - sacred_marriage
  basis: The buffalo story has a man marry a woman among buffalo and receive a shield
    from buffalo; the deer story has a man join with a woman who becomes deer and
    learn deer power from her.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage is an abstract and does not explicitly name the marriages
    as sacred; the taxonomy reference is approximate for a human-nonhuman spouse pattern.
- id: motif:2
  label: animal-given war medicine with correct-use condition
  taxonomy_refs:
  - sacred_exchange
  basis: The man gives requested presents to buffalo, receives a shield with a left-shoulder
    instruction, and is wounded when he wears it on the right shoulder.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: No broader comparative identification is asserted beyond the exchange
    and conditional use described in the abstract.
- id: motif:3
  label: taboo involving animal substance and fire causes death
  taxonomy_refs: []
  basis: Buffalo warn the man never to put buffalo horn or hoof in fire; later a person
    throws a spoon into the fire in his tipi and the man dies.
  evidence_refs:
  - ev:8
