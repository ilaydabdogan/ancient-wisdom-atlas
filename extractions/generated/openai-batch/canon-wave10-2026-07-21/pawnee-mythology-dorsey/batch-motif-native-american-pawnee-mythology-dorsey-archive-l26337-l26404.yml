canonical_text:
  quote: ''
  summary: Three Pawnee abstracts describe humans receiving powers or ritual knowledge
    through relations with buffalo, deer, and an animal lodge. In one, a man marries
    a buffalo woman, receives a shield, becomes a wonderful man after buffalo intervention,
    and dies after a fire-related restriction is unknowingly violated. In another,
    a man marries a deer woman, gains the power to become a deer and back into a man,
    demonstrates this in a medicine-lodge, and later loses the deer wife. In a third,
    a man is led by Raven to an animals' lodge, becomes ill after eating red beans,
    experiences a heaven visit to Tirawa, and returns to institute the deer dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the buffalo shield abstract, an envious man leaves the village, remains
    away through winter, and returns in spring without entering the village because
    he has no home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man follows a buffalo herd, sees a woman among the buffalo, asks her to
    marry him, and goes with her to a buffalo village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The buffalo woman's uncle asks for presents of scalp and blue beads; the man
    obtains these from the chief's tipi and gives them to the buffalo.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The buffalo give the man a shield and instruct him to wear it on his left
    shoulder.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The man uses the shield in several attacks on his village, kills many enemies,
    and shows increasing bravery.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: During a fourth attack, the man wears the shield on his right shoulder, is
    wounded, and is taken home to die.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A buffalo bull makes water in front of the man's tipi; the man rubs resulting
    mud on his face, buffalo roll in his tipi, dust appears, and he becomes a man
    with a buffalo robe on his shoulder.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Buffalo warn the man never to put buffalo horn or hoof in fire; later a careless
    person throws a spoon into the fire in his tipi and the man dies.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the deer marriage abstract, a young man hunting at Pahuk associates with
    a woman who turns into a deer.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The man shoots at the deer several times but cannot kill it, follows it to
    a swamp, and there it becomes a woman.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The man and deer woman lie together, both become deer, wander the country,
    and the woman gives birth to two fawns.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The deer woman teaches the man deer power, enabling him to transform himself
    into a deer or back into a man at will.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: In a medicine-lodge, the man borrows deer antlers, sings, places them on his
    head, and becomes a deer.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The man places fawn skin over his boy, causing the boy to become a fawn, and
    then turns the fawn back into a boy.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Medicine-men acknowledge the man's great power and make him their leader.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:16
  text: After many years, the deer woman says she must leave, becomes a black-tailed
    deer, and runs off.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: In the deer dance abstract, a man wanders from the village to the mountains
    and dreams of a black-painted man in a buffalo robe who says he is an errand man
    of the deer society.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:18
  text: The man sees Raven in the sky, and Raven directs him to the top of the mountains.
  category: action
  evidence_refs:
  - ev:18
- id: obs:19
  text: At a lodge entrance, a man explains that he spoke in the vision, had become
    Raven, and caused many ravens to make noise like human beings because the man
    seemed afraid to enter the animals' lodge.
  category: speech
  evidence_refs:
  - ev:19
- id: obs:20
  text: Inside the lodge are many animals, with elks as leaders; they sing, turn into
    people each after his kind, dance, sing, and eat red beans.
  category: setting
  evidence_refs:
  - ev:20
- id: obs:21
  text: The animals give red beans to the man; he becomes very ill, believes himself
    dead, visits the heavens, and sees Tirawa in an earth-lodge with a bow in his
    left hand and sage in his right.
  category: sequence
  evidence_refs:
  - ev:21
- id: obs:22
  text: Tirawa puts wild sage on the ground, moves it, and red beans appear.
  category: action
  evidence_refs:
  - ev:22
- id: obs:23
  text: Tirawa tells the man to return to his people and teach them the dance.
  category: speech
  evidence_refs:
  - ev:23
- id: obs:24
  text: The animals and birds leave the lodge at daylight, return nightly for four
    nights, and the man returns to his people, makes songs, and institutes the deer
    dance.
  category: sequence
  evidence_refs:
  - ev:24
