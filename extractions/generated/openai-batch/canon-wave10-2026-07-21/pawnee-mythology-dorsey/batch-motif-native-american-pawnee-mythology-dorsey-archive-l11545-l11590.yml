canonical_text:
  quote: She traveled far into the sky towards the west and disappeared.
  summary: Hoof-Shield, a Coyote, takes another hungry Coyote to a girl's tipi. They
    persuade the girl to be swung in a lariat swing so that Buffalo may be killed
    for food. She rises far into the western sky and later appears with many Buffalo,
    who pass the tipi, circle, and run back west with her. Hoof-Shield realizes they
    have done wrong and flees. The girl's brothers and the birds gather to search
    for her in the sky, on earth, and underground.
  language: English
  quote_policy: quoted
