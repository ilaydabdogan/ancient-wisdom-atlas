canonical_text:
  quote: ''
  summary: A mother verifies that her daughter's bones and grave goods remain in the
    grave, while the returned daughter explains that her body is there but she is
    present with the family as a spirit. The spirit wife lives with her husband for
    years and bears a son, who is carefully carried so he never touches the earth,
    since falling would signal his disappearance. The husband asks to take another
    wife; the spirit wife reminds him that she returned from Spirit Land for him and
    that he promised not to remarry, but she eventually consents. Later the human
    wife gives the husband moccasins that do not fit.
  language: English
