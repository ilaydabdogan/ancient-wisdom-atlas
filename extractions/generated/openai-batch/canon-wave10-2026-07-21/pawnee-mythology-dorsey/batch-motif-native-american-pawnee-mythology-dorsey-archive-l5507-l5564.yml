canonical_text:
  quote: ''
  summary: A buffalo calf cares for his human father during travel by providing pemmican
    and water. After they arrive among the Buffalo people, the calf gives the man
    signs by which to identify the calf's grandfather, grandmother, and mother among
    groups of similar-looking Buffalo. The man succeeds in each recognition test,
    though the Buffalo people remain hostile.
  language: English
