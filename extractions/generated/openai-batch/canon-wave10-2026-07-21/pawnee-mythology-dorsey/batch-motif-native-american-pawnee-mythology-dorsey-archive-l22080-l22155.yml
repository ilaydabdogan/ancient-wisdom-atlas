canonical_text:
  quote: ''
  summary: A starving Coyote asks a Buffalo bull for help. The Buffalo, warning that
    Coyote is tricky, transforms him into a Buffalo through a buffalo wallow and horn
    contact, then teaches him buffalo powers and conduct. Coyote-Buffalo later tries
    to turn another starving Coyote into a Buffalo, loses his own Buffalo form, returns
    to the Buffalo with an excuse, and is transformed again with a warning not to
    try to transform Coyotes.
  language: English
  quote_policy: summarized
