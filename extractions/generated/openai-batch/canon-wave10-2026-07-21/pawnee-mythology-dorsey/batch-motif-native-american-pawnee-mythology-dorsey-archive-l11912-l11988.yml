canonical_text:
  quote: ''
  summary: A girl is carried by the wind to a distant country where Spider-Woman says
    she must play the twin-ball game. A Rat-Woman household shelters her and warns
    her that Spider-Woman offers human eyes as food and kills contestants. The girl
    refuses the food, later accepts the game challenge but asks for four days while
    seeking her uncle. Meanwhile the uncle discovers her absence and uses twin balls
    and a stick to fly through the air searching in several directions.
  language: English
  quote_policy: summarized
