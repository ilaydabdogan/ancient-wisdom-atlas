canonical_text:
  quote: ''
  summary: Stone-Man repeatedly shoots at a Buffalo but cannot kill it, even after
    using four colored rush arrows. The Buffalo and the young man's errand men break
    Stone-Man apart; the daughter throws the pieces into a boiling lake, after which
    steam fills the lodge, the lodge becomes solid stone, and the passage explains
    western geysers. The passage then connects a Stone-Man fragment with the Kitkehahki
    animal/medicine lodge ceremony, Animal-Boy, Stone-Man's daughter, and their descendants.
  language: English
  quote_policy: summarized
