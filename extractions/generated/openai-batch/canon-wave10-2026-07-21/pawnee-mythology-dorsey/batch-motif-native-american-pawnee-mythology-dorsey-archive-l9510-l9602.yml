canonical_text:
  quote: ''
  summary: A woman gives birth to a dog-child who is thrown into a creek, rescued
    by a Clam Shell, transformed into a boy, and guided back to the village. The chief
    receives him, he proves himself in a buffalo hunt, marries the chief's daughter,
    is warned by a deer-woman that White-Moccasins seeks to kill him, and defeats
    White-Moccasins and his companions by supernatural power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: While the people prepare to go hunting, White-Moccasins' wife gives birth;
    the child is identified as a dog, and White-Moccasins carries it through camp
    and throws it into the creek.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dog cannot swim, and a Clam Shell takes it out of the water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Clam Shell sings, speaks to the dog, says it saved his life, says the
    people wronged him, and instructs him to follow the people's trail and sing the
    song when he catches up.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Clam Shell tells the dog to look around; the dog turns into a boy, and
    a quiver appears for him to take.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the village, the boy sings that White-Moccasins' child was left at the
    old village site, and the chief invites him into the tipi.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The chief rebukes White-Moccasins and says the boy will stay with him; the
    boy says he will herd the chief's ponies and marry the chief's daughter when the
    time is right.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The boy plans a hunt, many buffalo are killed, and after the successful hunt
    the chief gives his daughter to the boy in marriage.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: On a high hill to the south, the boy sees a black-tailed deer that turns into
    a young girl; she warns that White-Moccasins is trying to kill him and promises
    protection against open attack or poison.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The boy publicly challenges White-Moccasins to show his power and try to kill
    him; White-Moccasins tries and fails.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The boy waves his hand at White-Moccasins, causing him to pound his head against
    objects; when other people attack the boy with clubs, the boy whistles and they
    fall dead, and a later whistle kills White-Moccasins.
  category: action
  evidence_refs:
  - ev:8
