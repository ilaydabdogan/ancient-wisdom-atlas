canonical_text:
  quote: ''
  summary: Handsome-Boy gives tobacco at Prairie Dogs' holes and asks for help against
    enemies. He scouts, fights a lone mounted enemy, kills and scalps him, and later
    hears Prairie Dogs dancing again. A mysterious being appears in dreams, warning
    him of coming hardship, promising protection, directing him east to meet enemies,
    and finally telling him to go north to a prairie hole or cave for a long journey
    where he will learn something.
  language: English
  quote_policy: summarized
