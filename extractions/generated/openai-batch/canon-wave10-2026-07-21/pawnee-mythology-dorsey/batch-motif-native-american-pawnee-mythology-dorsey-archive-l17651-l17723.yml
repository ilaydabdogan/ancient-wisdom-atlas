canonical_text:
  quote: ''
  summary: A boy who expects to die reaches a lake, drinks and washes, addresses the
    powers of the place, removes his clothing and throws the bundle into the lake.
    He then sees horses and buffalo circle the lake and later run over and trample
    him, making him think he has been killed. After being touched, he finds himself
    in a large lodge under the lake among Horse and Buffalo people. The Buffalo leader
    explains that they brought him there to pity him, give him powers, make him a
    warrior, chief, and medicine-man, and require him to start the Buffalo and Wild
    Horse dance. The old bull and old black Horse request specific presents, and the
    Buffalo and Horses gather around the boy until he disappears.
  language: English
  quote_policy: summarized
