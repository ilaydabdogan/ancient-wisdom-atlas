  text: A young boy is left on a hill and later goes down toward a spring near a cave
    before sunset.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: 'As the young man drinks from the spring and looks into the cave, he sees
    female figures in a sequence: a young girl, an older woman, a middle-aged woman,
    and an old woman, after which the old woman disappears.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A voice from the cave calls the young man; he crawls into the cave, is told
    to stand and look, and sees another country.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The old woman takes the young man to her earth-lodge and directs him to look
    in different directions, where he sees female figures again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The young girl identifies herself as the new Moon and explains that the older
