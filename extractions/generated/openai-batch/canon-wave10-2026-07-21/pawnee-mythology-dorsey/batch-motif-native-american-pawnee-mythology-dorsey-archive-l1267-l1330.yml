canonical_text:
  quote: ''
  summary: A young man encounters changing female forms at a spring and cave, enters
    the cave into another country, and learns from a Moon figure that the Moon ages
    and returns as a girl. The Moon/old woman gives him game implements from the buffalo
    and instructs him to take them to the village so men and women can play while
    hungry and awaiting the buffalo. He returns, tells the leaders, and the games
    are adopted by men, women, boys, and girls.
  language: English
  quote_policy: summarized
