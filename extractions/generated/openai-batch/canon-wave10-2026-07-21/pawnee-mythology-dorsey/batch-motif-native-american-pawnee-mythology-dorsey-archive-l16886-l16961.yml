canonical_text:
  quote: ''
  summary: A poor boy who has Bear medicine conducts a private lodge ceremony with
    a bear claw, feathers, pipe, songs, and ponies. He tells the chief's son that
    the Bears taught him mysteries and that the Bear spirit helped him heal a wounded
    man, but he cannot fully teach or explain the power. He gives the chief's son
    a robe and pony; the chief permits his son to live with the poor boy and learn.
    Later, when enemies attack, the poor boy dresses with Bear-related objects and
    paint, enters battle, withstands projectiles, kills enemies, and the village celebrates
    him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women sweep out the lodge, spread a mat, leave, and the boy is alone for his
    ceremony.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy takes a bear's claw and four differently colored downy feathers from
    his bundle and lays them on the ground.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy places his hands in the mouths of the horses, then passes his hands
    over the bear's claw and feathers as a sign of thankfulness to the Bear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The boy fills and smokes a pipe and sings a song calling the spirit of the
    Bear to him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chief's son sees the objects before the poor boy, says he knows the poor
    boy has been among the Bears, and says the Bears taught him mysteries.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief's son begs the poor boy to teach him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The poor boy tells the chief's son that he cannot teach him the mysteries
    because the chief's son will be a chief and must be kind and good to the people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The poor boy says that having the spirit of the Bear requires killing people
    and taking scalps, and he says he does not want the chief's son to do this.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The poor boy says the Bear spirit overcame him while he visited a wounded
    man and that he cured the wounded man.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The poor boy gives the chief's son a choice of robes and gives him a pony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The old chief tells his son to live with the poor boy and learn from him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The two boys remain together, and the poor boy sings Bear songs that had been
    taught to him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: During an enemy attack, the poor boy puts the bear claw around his neck, places
    a feather on his head, paints his body red, makes two black streaks downward from
    his eyes, and takes a bow with a few arrows.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: In battle, arrows and bullets seem to drop off the poor boy's body; he kills
    two enemies, the enemy line breaks, and the village sings and dances victory songs
    for him.
  category: sequence
  evidence_refs:
  - ev:8
