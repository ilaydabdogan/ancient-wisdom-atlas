canonical_text:
  quote: ''
  summary: An old Skidi medicine-man repeatedly visits a young man, tells him medicine
    mysteries, brings gifts, and asks how the young man knows medicine powers. The
    young man denies possessing such powers. After a pipe-smoking exchange, the young
    man becomes increasingly pregnant, leaves the village in shame, travels along
    and across the Platte River, and enters a large tipi despite repeated warnings
    from within.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a lodge, a robe is spread on the west side with two pillows; visitors are
    seated and fed before the old Skidi continues telling medicine mysteries.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old Skidi medicine-man makes several visits to the young man and continues
    his story over multiple days and nights.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On one visit, the old man and his wife bring a buffalo robe, a pipe, eagle
    feathers, and other small gifts, place them before the young man, and ask to hear
    why he knows medicine mysteries while young.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man accepts the gifts but asks the old man to continue his story.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young man says he has no powers, has not seen mysteries in the heavens,
    has not been taken into animals' lodges, and has no roots or herbs for patients.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old man becomes enraged because he expected a long story about the boy's
    animal-lodge experience and powers.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the fourth night, the old man takes a pipe from a skunk bag; the young
    man and old man smoke it in turn.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: While emptying ashes from the pipe bowl, the young man falls over from lack
    of sleep; the old man wakes him and then says he and his wife will leave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After lying by the fireplace wrapped in a robe, the young man feels a peculiar
    stomach sensation; over months his stomach grows larger.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The young man concludes that the old Skidi man has done something to him and
    tells his relatives that he is pregnant, unfit to stay in the village, and going
    away to die in an unknown country.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The young man takes meat, leaves the village, travels south toward the Platte
    River, then west along it, and does not eat because of shame and lack of desire
    to live.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: He goes to places where he thinks wild animals might kill him, but none come;
    he crosses the Platte River to rocky hills and is weak with a prominent stomach
    and thin limbs and face.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: On a hill, he hears peculiar noises, follows them, and sees a very large new-looking
    tipi below a ridge.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: Voices from the tipi warn him not to approach, stop, or enter, and threaten
    to eat him if he comes in; he ignores the warnings and enters.
  category: sequence
  evidence_refs:
  - ev:7
