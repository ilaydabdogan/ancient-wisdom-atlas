canonical_text:
  quote: Just as the sun was coming up in the east, the two Horses ran over the young
    man and touched him.
  summary: An old man and old woman recover a badly cut-up boy and are instructed
    by the owner of the dun Horse to place the body on the east side of the village.
    The owner orders the people to keep quiet and secure their horses. At night horses
    neigh and rumbling is heard; a man discovers the black and dun Horses running
    to the body. At sunrise the two Horses run over and touch the young man, then
    stand panting on the south side. The passage then says the young man sat up through
    the night and gave instructions to his wife about preparing buffalo meat.
  language: English
  quote_policy: quoted
