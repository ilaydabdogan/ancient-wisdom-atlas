canonical_text:
  quote: ''
  summary: 'A Buffalo gives a boy instructions and objects for a Buffalo medicine
    dance and for doctoring wounds; after the Buffalo dies, the boy performs the dance
    in a medicine ceremony. A following account begins the Buffalo Game Medicine:
    a man taught by animals sees a constellation of two sticks and a ring, then receives
    dream instructions for making and using game implements in a medicine context.'
  language: English
  quote_policy: summarized
