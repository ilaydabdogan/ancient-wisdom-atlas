    of scalp after the Buffalo's death for the boy's own use.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Buffalo instructs the boy to collect mud from places where buffalo bulls
    have made water, keep it in a buffalo bladder, chew a piece of a ball and root,
    and apply mud to face, nose, and body before dancing or doctoring.
  category: action
  evidence_refs:
  - ev:2
