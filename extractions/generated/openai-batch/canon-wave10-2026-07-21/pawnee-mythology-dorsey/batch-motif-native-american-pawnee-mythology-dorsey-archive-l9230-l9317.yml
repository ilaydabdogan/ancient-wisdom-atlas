canonical_text:
  quote: ''
  summary: A younger brother learns from Raven that his brother is dead and that the
    head is at the gambler's lodge. He follows his brother's trail, receives warnings
    from hosts about human eyes and ears offered as food, delays a stick game with
    the gambler, and seeks help among buffalo bones. Speaking bull skulls promise
    aid, buffalo manifestations appear and vanish, and a speaking stick remains to
    help him beat the gambler.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The younger brother sends birds to search, and Raven reports that the brother
    is dead and that his head is at the gambler's lodge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy starts to hunt for his brother, uses his powers so he can see well,
    follows his brother's steps, and sleeps where his brother had slept.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At a bank where his brother had sat, the boy sees the errand man watching
    him, then goes to the tipi where his brother had stayed and is welcomed because
    he resembles the other boy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people at the tipi warn that the gambler will offer human eyes as food
    and advise the boy not to eat them but to carry them back so they can throw them
    away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The errand man summons the boy to the gambler's lodge; the gambler seats him
    nearby, offers a bowl of eyes, asks about playing sticks, and accepts the boy's
    delay until the fifth day.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the third day the hosts warn that dried human ears will be presented as
    squash; the boy refuses to eat, takes the bowl away, and the hosts throw its contents
    away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the fourth day the boy asks where there are buffalo wallows and bones,
    is directed to a hillside, and goes there at night among many buffalo skeletons
    while crying.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: At an old bull skull, the boy sings that he is crying because the gambler
    has requested a stick game and he has no sticks; he asks for sticks and a ring.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The old bull addresses the boy as grandchild, says the buffalo will try to
    help, says young bulls can help because he is old, and states that they want to
    get rid of the gambler.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: At a young bull skull with sharp horns, the boy again asks for help, saying
    that he and the gambler are to put up their lives.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The young bull says he is the strongest bull and will help; buffalo then come
    from different directions, bellow, stamp, fight, disperse, and disappear.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the buffalo disappear, the boy sees a stick where they had been, and
    a voice from the stick says it will be one to beat the gambler and that its point
    should be burnt black.
  category: object
  evidence_refs:
  - ev:8
