canonical_text:
  quote: ''
  summary: During a Kitkehahki period on the Republican River, medicine-men hold prolonged
    dances and sleight-of-hand ceremonies attended by other bands. A stranger from
    another land performs wonders beyond those of the local medicine-men. The leading
    medicine-man complains to his wife, while his fourteen-year-old son hears him.
    After the father leaves, the boy asks his mother to find two long-necked squashes
    and help him perform in the medicine-men's lodge. The mother objects that he is
    too young and has not been taught the mysteries, but the boy urges her to go with
    him to the fields. A note says the tale concerns the origin of certain sleight-of-hand
    performances and is told at the close of the ceremony, encouraging young men to
    emulate the boy and obtain the pity of animals.
  language: English
  quote_policy: summarized
