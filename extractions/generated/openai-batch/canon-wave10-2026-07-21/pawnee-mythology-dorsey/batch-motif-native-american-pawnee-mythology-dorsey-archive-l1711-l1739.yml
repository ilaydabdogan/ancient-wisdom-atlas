canonical_text:
  quote: ''
  summary: Long-Tongue leaves the lodge after changing from an old man into a handsome
    young man and moving a stone door by speaking to it. While the girl cries, Raven
    identifies Long-Tongue as a dangerous rolling skull, explains the odor of roots
    in a sacred bundle, and gives the girl instructions involving a request to go
    outside and the gathering of hackberries. The girl follows these instructions.
    Later Raven returns and tells her that Long-Tongue will ask her to remove lice
    from his head.
