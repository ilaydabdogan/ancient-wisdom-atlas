canonical_text:
  quote: ''
  summary: After a condition described as nothing but water, the man loses awareness.
    A Buffalo touches him and leads him to a lodge where four old men in the west
    identify themselves as gods with creative power. They show him buffalo meat stored
    in parfleches, demonstrate placing the buffalo heart and tongue on a fire as something
    to do for them after a kill, give him seeds wrapped in buffalo skin, release buffalo
    to follow him to his village, place a robe on him, and send him away. A little
    blue bird touches him awake; he still has the robe and goes to tell the people.
  language: English
  quote_policy: summarized
