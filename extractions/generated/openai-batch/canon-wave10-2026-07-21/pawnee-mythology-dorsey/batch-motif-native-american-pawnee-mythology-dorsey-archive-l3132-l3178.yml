canonical_text:
  quote: ''
  summary: The passage describes a falling-star or meteor event that frightens the
    people until they recall Pahokatawa's words. Later, two men find a barren round
    place with a colored, turtle-shaped stone identified as a promised meteor. The
    stone is ritually approached with tobacco, smoke, pipe offerings, and prayers,
    kept with the Morning-Star bundle, moved to a high hill after relocation, and
    credited with war success and protection from disease. The passage then begins
    the next tale, “Buffalo-Wife and Corn-Wife,” with a young man who avoids expected
    work and war duties and climbs a hill daily; a note says the tale teaches respect
    for corn and buffalo and explains their role in sacred bundles.
  language: English
  quote_policy: summarized
