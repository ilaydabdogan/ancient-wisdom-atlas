canonical_text:
  quote: ''
  summary: The Wind guides the boy near a village and asks him to bring blue beads,
    eagle feathers, paint, sweet grass, and native tobacco. After several failed attempts,
    the boy enters his father’s lodge, has the items gathered, gives them to the Wind,
    and is sent back to his people. He returns to a starving community, produces meat
    from beneath a robe, directs scouts to buffalo in the northwest hills, and later
    sings songs heard in a lodge above while the people resume buffalo hunting.
  language: English
  quote_policy: summarized
