canonical_text:
  quote: ''
  summary: A young man releases an enemy horse, prepares his own ponies, and travels
    north. He finds a fresh mound with a hole and childlike footprints, leaves his
    ponies and possessions, and enters the hole. The underground passage grows larger,
    winds about, contains running streams, and leads him to a mud-covered little human
    being with an eagle-bone whistle who allows him to pass. He runs toward daylight
    and emerges near his ponies, possessions, and a village, where men say he has
    arrived alive and in bodily form, brought by someone watching over him.
  language: English
  quote_policy: summarized
