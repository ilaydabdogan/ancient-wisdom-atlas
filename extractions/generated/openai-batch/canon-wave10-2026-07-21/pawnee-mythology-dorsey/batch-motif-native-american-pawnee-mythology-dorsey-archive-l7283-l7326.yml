canonical_text:
  quote: ''
  summary: Two boys place snakes at the lodge doorway so their father will hear the
    rattles, but he is frightened and has the snakes removed. The father warns the
    boys not to go to a high hill where people and animals are killed by lightning.
    After he leaves, the strange boy persuades Handsome-Boy to go there. At the hill,
    amid clouds, thunder, and lightning, the strange boy identifies a hollow tree
    where four wonderful beings live and make thunder and lightning. He climbs the
    tree, pulls out a red-painted being dressed in a buffalo robe and black lariat,
    learns its name is Thunder, and throws it down for Handsome-Boy to catch.
  language: English
  quote_policy: summarized
