canonical_text:
  quote: ''
  summary: Coyote-Buffalo announces that he will travel west. A Buffalo warns him
    that he will meet twenty running Buffalo, including nineteen cows and one bull,
    and tells him not to listen to or join the bull when the bull invites him to go
    where the people are to receive smoke. Coyote promises to obey, but after traveling
    west he meets the group, accepts the bull's invitation, runs with them, rests
    with them, and suggests starting again toward the place where smoke will be received.
