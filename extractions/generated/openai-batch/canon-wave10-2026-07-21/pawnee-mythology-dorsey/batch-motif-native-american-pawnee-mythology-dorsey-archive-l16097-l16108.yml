  quote: ''
  summary: Proud-Boy returns before the people depart and travels with them. In camp
    he dresses in fine clothing, carries an eagle-tail fan, keeps his face painted,
    avoids playing with the boys, boasts about future battle deeds, rides to the playgrounds
    on a horse that is painted in several colors, and sometimes holds the fan before
    his face while riding past the boys.
