canonical_text:
  quote: ''
  summary: Two artichoke diggers kill a strange man. Villagers find the body marked
    with paint, feathers, and a hair rope. A young boy later counts coup on the body
    and takes a downy feather from the scalp-lock. In dreams and in the timber, the
    dead man reveals himself as Thunder-Bird, appears in crane-like form, tells the
    boy to keep the feather, and teaches him a ceremony and sleight-of-hand practices
    at a cleared altar place.
  language: English
  quote_policy: summarized
