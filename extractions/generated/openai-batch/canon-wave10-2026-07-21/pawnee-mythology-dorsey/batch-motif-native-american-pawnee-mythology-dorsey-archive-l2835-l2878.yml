canonical_text:
  quote: ''
  summary: 'The excerpt first describes part of the pipe-stick ceremony: night songs
    enter the lodge, songs name corn and animals, a child is painted to represent
    Tirawa, stood on an oriole nest by priests and a pipe-stick leader, and then released
    with instructions about the paint. The ceremony is said to have come from heaven,
    animals, and a water-monster. The next tale begins with two girls sleeping on
    an arbor; one wishes a star were her husband, then wakes in a strange country
    and lives with the Star as a man, who gives prohibitions about leaving and digging.'
  language: English
  quote_policy: summarized
