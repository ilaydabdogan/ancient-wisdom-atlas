canonical_text:
  quote: ''
  summary: The passage closes an account of Buffalo Game Medicine with dust gathered
    at the stopping place of a ring and a black-stick smoke feat. It then narrates
    a lost warrior who prays, meets a singing Buffalo cow at dawn on a hill, learns
    a song and medicine power, and gains success in travel and pony capture. A following
    story begins with a lonely boy who laments his lack of wife or kin, disappears
    for a winter, returns in spring, encounters a woman among a Buffalo herd, seeks
    marriage, and is asked by her uncle to obtain a scalp and blue beads for the Buffalo.
  language: English
