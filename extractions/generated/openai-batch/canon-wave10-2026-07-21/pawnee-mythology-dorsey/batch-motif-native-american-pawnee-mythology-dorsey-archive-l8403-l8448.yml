canonical_text:
  quote: ''
  summary: Hawk finds his hidden wife Young-Duck in a tipi. She has been bewitched
    and partly changed into an old woman. At her request he carries her into the sky
    in hawk form and drops her; where she falls, he finds her transformed into an
    open clam shell. The passage then begins another tale in which the stars, Morning-Star,
    and Moon decide to send two people to the earth among the animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man called Hawk enters a tipi in a valley and sees a man, a woman, four
    girls, and his wife Young-Duck, who is covered so that he cannot see her.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young-Duck has told the people not to tell Hawk she is there, and they say
    they have not seen her when asked.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The youngest girl points to where Young-Duck is lying, and Hawk sees his wife's
    feet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Young-Duck says Hawk cannot see her because she is changed; when she gives
    in, he sees that from the waist up she is an old woman with hanging ears.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Young-Duck says an old woman bewitched her and that she will always live changed;
    she asks that her parents and husband not weep for her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Young-Duck instructs Hawk to put her on his back, fly high into the sky, drop
    her, then find her where she falls and see what creature she is.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Hawk stays near Young-Duck all night; the passage says she is very thin because
    she has eaten only ground beans during that time.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The next day they climb a hill; Hawk turns into a hawk again, Young-Duck climbs
    on his back, and he flies up into the heavens.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: Young-Duck falls from Hawk's back; Hawk follows to where she falls and finds
    her as an already open clam shell.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The clam shell's outside is rough like the old witch's skin, while its inside
    is smooth and delicate like the girl's skin.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The next tale begins by saying there were no people on earth and that the
    stars in the heavens wanted to put people on earth and show them how to live.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Morning-Star proposes putting two people on earth among the animals; Moon
    agrees to send her woman, and Morning-Star agrees to send his younger brother.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: A source note says the next tale was told by Cheyenne-Chief, Skidi, gives
    a moral about children, especially brothers and sisters, not quarreling, and says
    the tale foretells Skidi sacrifice of a maiden.
  category: other
  evidence_refs:
  - ev:6
