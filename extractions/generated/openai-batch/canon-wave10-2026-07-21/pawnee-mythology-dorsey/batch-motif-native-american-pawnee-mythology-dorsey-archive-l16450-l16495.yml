canonical_text:
  quote: ''
  summary: After the Skidi leave camp, the boy returns to the timber and is guided
    by Magpie. Through sleep and dreams he is moved between places, reaches the animal
    lodge, and encounters Turtle, who identifies himself as the fireplace of the animal
    lodges. Turtle gives ritual instructions involving an ash bow, cane or reed arrows,
    downy feathers, four circuits around the fireplace, and shooting the turtle-fireplace.
    Magpie and Turtle state that the boy is not well or in trouble, and Magpie says
    he will ask the lodge animals to take him in. The passage connects these events
    with medicine-man lodge song and a Skidi medicine-lodge turtle-shaped fireplace.
  language: English
  quote_policy: summarized
