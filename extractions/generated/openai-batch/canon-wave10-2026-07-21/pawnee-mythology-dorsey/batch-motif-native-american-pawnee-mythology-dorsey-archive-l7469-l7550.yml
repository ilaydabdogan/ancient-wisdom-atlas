- id: obs:1
  text: The father believes the boys may try to kill him and considers running away,
    but returns when he understands that the boy’s power is watching him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father hunts, brings back deer and buffalo, cooks and jerks meat, fills
    a trough with water, and leaves while the boys are away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The strange boy tells Handsome-Boy that their father has run away because
    he is afraid of them, while Handsome-Boy initially disbelieves this.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The strange boy says the two boys escaped the sharp-elbow people by stepping
    on the kettle rim, becoming charred leaves, flying out through an opening, landing,
    and becoming boys again.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At an elm tree, the two boys disappear and are then in an underground lodge,
    which is described as a wood rat’s nest.
