canonical_text:
  quote: ''
  summary: In this passage, the boys’ father fears them, prepares food and water,
    and runs away. The strange boy tells Handsome-Boy how they escaped the sharp-elbow
    people by becoming charred leaves, then leads him to an underground lodge at an
    elm tree, identified as a wood rat’s nest and the place where he received powers
    from animal beings. The boys later search for their father, question animals and
    insects, receive direction from Mouse and a speaking wood mortar, and enter an
    underground world where villagers say their father has passed through.
  language: English
  quote_policy: summarized
