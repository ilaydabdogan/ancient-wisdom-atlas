    and ground beans.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The strange boy says animal gods dwelt there, including a being with lightnings
    in his hands, eyes, and mouth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Lightning man says that some human beings falsely claimed to be sky-lightnings,
    killed many people, and were to be removed from earth and given power to stand
    in the heavens as thunder and lightning.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The strange boy says this is why he was not afraid of thunder and lightning
    that he had captured in a hollow log on the side of a high mound.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: A woman wearing black clothing gives the boys ground beans, which they eat
    before leaving.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The boys search through the timber and question animals, insects, and bugs
    about their father, but these beings say they have not seen him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Mouse says it knows where the father is and leads the boys from the fireplace
