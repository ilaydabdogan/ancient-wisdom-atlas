canonical_text:
  quote: ''
  summary: Coyote-Man travels to a place where two women are gathering wood. He finds
    a baby tied to a baby-board against a tree, removes and decapitates the baby,
    puts the head back in the cradle, and leaves. When the women lift the baby onto
    their backs, the head falls out, and they know Coyote-Man has been there. Coyote-Man
    continues to another village.
