canonical_text:
  quote: ''
  summary: A ritual game is played with rejoicing. After one side loses, meat is cooked
    and portions of heart and tongue are offered to the sun, moon, and stars. Fat
    is rubbed on the sticks, ring, and the man himself, and the sticks and ring are
    tied to a pole placed in the ground. That night the man receives another vision
    in which the same being gives instructions about another ring from a calf, prayer
    to Tirawa, symbolic beads, war-path use, and doctoring without herbs or roots
    in a specified case.
  language: English
  quote_policy: summarized
