canonical_text:
  quote: ''
  summary: A poor boy in a Bear den tells the mother Bear he has sought her place
    and accepts possible death. She warns him that her husband is coming and tells
    him to hold the little Bear tightly because the father values that child. The
    male Bear enters, smells a human, threatens the boy, and repeatedly orders him
    to release the little Bear. The boy refuses. The little Bear intercedes, asking
    the father to pity and spare the boy. The Bear calms after exhaling differently
    colored dusts, and the boy releases the young Bear. The Bear then tells the boy
    of killing many people and hunters, of arrows dropping from his shaggy coat, and
    of bringing their guns and things into the den.
  language: English
  quote_policy: summarized
