  quote: ''
  summary: The passage introduces Pawnee medicine narratives as restricted, privately
    owned accounts explaining rites and medicine powers. It begins the story of a
    Skidi child with mysterious behavior who heals a sick woman by touching Mother-Earth
    and laying hands on the painful place, after which he is regarded as a medicine-man.
    A note connects the story to Beaver medicine, its inheritance, and an albino beaver
    skin said to have given power.
  language: English
