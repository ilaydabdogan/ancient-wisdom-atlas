canonical_text:
  quote: ''
  summary: An afflicted boy/man with a swollen belly is brought before animal medicine-men.
    Animal errand figures and lodges discuss whether to help him, and messengers summon
    other animal lodges. The head lodge at Pahuk directs that the boy be cured there,
    and Buzzards carry him in relay to the bank of Pahuk.
  language: English
  quote_policy: summarized
