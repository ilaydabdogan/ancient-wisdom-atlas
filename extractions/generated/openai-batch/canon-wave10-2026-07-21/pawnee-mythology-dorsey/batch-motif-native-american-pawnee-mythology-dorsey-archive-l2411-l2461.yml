canonical_text:
  quote: ''
  summary: Three young men go on the war-path, kill a cruel husband in a camp, remain
    with the women, teach their language, train boys as warriors, capture ponies,
    and repeatedly attack villages, killing men while sparing women and children.
    By forcing captives to adopt their language, they become one tribe. Later they
    move north toward their home country with scalps intended as offerings to heavenly
    gods. At a valley camp beside a stream and high hill, the poor young man stays
    on the hill crying and does not answer when the chief's son and the medicine-man's
    son urge him to come down and return home.
  language: English
  quote_policy: summarized
