canonical_text:
  quote: ''
  summary: A wonderful boy travels to Spider-Woman's village, where she kills people
    through a tree-climbing contest. After being warned and refusing human brains,
    he prepares with clay, markings, feathers, and a song, wagers his life against
    Spider-Woman and her children, survives the falling tree, and the people kill
    Spider-Woman, her people, and Eyes-Wide-Open. The boy ends cannibalism, transforms
    a host woman and her child into mice who live near old tree roots, and becomes
    a speckled woodpecker living in tree tops, explaining woodpecker and mouse habitats.
  language: English
  quote_policy: summarized
