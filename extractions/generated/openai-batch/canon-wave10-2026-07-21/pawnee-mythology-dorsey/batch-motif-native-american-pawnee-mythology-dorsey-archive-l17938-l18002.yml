canonical_text:
  quote: ''
  summary: Howling-Fox follows dream instructions to the playground and waits after
    the games. A woman arrives from the west; he identifies her as Buffalo because
    of her tracks. She says she is searching for her only daughter, who has been killed,
    made into a ring used in the stick game, and has come back to life. She asks Howling-Fox
    to bring the rings to her and promises him powers that will keep his people from
    hunger. Howling-Fox obtains rings from their owners, clears his lodge, places
    the rings by the fireplace, smokes toward the heavens, ground, and rings, addresses
    the rings as living mothers, and puts them under his pillow.
  language: English
  quote_policy: summarized
