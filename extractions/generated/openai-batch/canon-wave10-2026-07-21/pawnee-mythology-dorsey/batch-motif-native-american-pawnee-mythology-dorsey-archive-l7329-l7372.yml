canonical_text:
  quote: ''
  summary: A strange boy draws out named storm beings, including Lightning, Loud-Thunder,
    and Wonderful-Lightning. He and Handsome-Boy bring four Lightnings and Thunders
    to their earth-lodge for their father, who says the beings are from the heavens
    and should not be molested. The strange boy refuses to return them to the tree
    where they kill those nearby, assigns thunder and lightning beings to the west
    and south and to seasonal and sky activity, and the beings disappear from earth.
    The father becomes afraid and recalls that the boys have gone to forbidden wonderful
    places and destroyed them, even the gods.
  language: English
  quote_policy: summarized
