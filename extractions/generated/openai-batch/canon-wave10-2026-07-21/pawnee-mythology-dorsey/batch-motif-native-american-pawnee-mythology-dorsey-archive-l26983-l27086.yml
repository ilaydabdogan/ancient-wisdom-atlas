canonical_text:
  quote: ''
  summary: The passage gives short abstracts of Pawnee Coyote narratives. Coyote repeatedly
    deceives or attempts to deceive Turtle, Bear, Turkey, Turkeys, Prairie Chicken,
    Rabbit, and people, sometimes gaining food or escape and sometimes being exposed,
    defeated, or killed. One abstract presents Coyote giving salt to people and being
    remembered in song. The final supplied item gives only the title of a Coyote-and-artichoke
    story.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Turtle begs Buffalo to carry him across a river, enters Buffalo's anus, gnaws
    his intestines, and kills him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote offers Turtle a knife and proposes a jumping contest over the buffalo,
    with the winner to receive the buffalo and the loser to help cut it up.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Turtle asks two eagles to take him and the meat up to their nest in a Cottonwood
    tree, where he makes fire and cooks the meat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Coyote returns with his children, mistakes the reflection of fire in water
    for Turtle, dives in, and becomes caught between two logs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Coyote boasts to Bear that he can stop rivers and turn trees to hills; Bear
    believes him at first, then recognizes the deception and kills Coyote.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After Bear breaks Coyote's imitation bow, Coyote addresses the sun as if accusing
    Bear of a sacrilegious act, causing Bear to make him another bow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Coyote offers to teach Turkey how to make fire for offerings; they face a
    fireplace and perform movements of offering a scalp to fire while Coyote sings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Turkey becomes suspicious and escapes while Coyote's eyes are closed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Coyote offers dancing Turkeys a better dance, bites off the heads of two,
    takes them home, and deceives his family while eating all the meat himself.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Coyote persuades Turkeys to roll down a hill in a sack, carries the sack home,
    and loses the Turkeys when his youngest child unties it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Coyote and Prairie Chicken hold a contest to see which can frighten the other;
    Prairie Chicken startles Coyote near a steep bank, and Coyote leaps over the bank
    and is killed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Coyote invites Prairie Chicken to come down from a limb and dance, then threatens
    it with poisons; Prairie Chicken replies that it is fond of the named things and
    flies away.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Coyote tries to marry Rabbit and is refused; Rabbit later tries to marry Coyote,
    and Coyote refuses because of Rabbit's cracked nose, saying Rabbits and Coyotes
    will never intermarry.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: People who have no salt beg salt from Coyote at the place where he roasts
    meat; he gives salt to them, disappears, and children later sing to coyotes on
    a hill about the gift.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Coyote claims to bring great news, demands the chief's daughter as reward,
    lies with her, then reveals that he has seen rosebuds; the people kill him for
    the deception.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: The supplied excerpt includes the title 'Coyote and the Artichoke' but no
    narrative action for that abstract.
  category: other
  evidence_refs:
  - ev:12
