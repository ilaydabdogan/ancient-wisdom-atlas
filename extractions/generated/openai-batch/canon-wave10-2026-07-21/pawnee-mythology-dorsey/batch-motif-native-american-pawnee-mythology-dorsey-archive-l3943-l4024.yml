canonical_text:
  quote: ''
  summary: A boy in conflict with Buffalo uses a bowstring, arrows, deer leggings,
    and a transformed bow to run, fight, disappear, and evade pursuit. Buffalo girls
    advise the pursuing Buffalo where to seek him, and strong-breathed bulls force
    him out of grass and water hiding places before the girls declare that his power
    is used up.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy removes a bowstring and uses it to whip his own legs and the legs
    of his Buffalo partners, after which they run fast and take the lead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: White-Spot-on-Forehead's people behave aggressively before battle, including
    throwing dirt on their backs and locking horns.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy strings his bow, tells his partners to stand by him, shoots Buffalo
    that try to pass him, and kills many Buffalo in the fighting herd.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boy kills a young bull that is fighting an old bull, and the opposing
    Buffalo become enraged; the boy's side is few and overpowered.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the pursuit, the boy runs fast because of deer leggings, but the deer's
    power gives out.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the Buffalo nearly catch the boy, he shoots arrows and disappears; the
    Buffalo later see him ahead again.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
- id: obs:7
  text: Two female Buffalo, called girls in the passage, answer the pursuers' questions
    and tell them to continue forward or go to specific places where the boy may be
    found.
  category: speech
  evidence_refs:
  - ev:5
  - ev:8
  - ev:10
- id: obs:8
  text: After using his last arrow, the boy throws his bow on the ground, stands on
    it, and the bow becomes a blacksnake that runs swiftly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: At a meadow, the Buffalo eat the grass inward until only a central bunch remains;
    a chosen bull blows on it, and the boy jumps out and disappears.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: At a pond, the Buffalo drink nearly all the water, exposing turtles, fish,
    and a mud-hole; a chosen bull blows his breath, the boy jumps onto dry land, and
    disappears again.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Buffalo girls state that they have killed the boy because he has used
    up all of his power.
  category: speech
  evidence_refs:
