canonical_text:
  quote: ''
  summary: The passage closes an episode in which Coyote, appearing as an old man,
    is recognized while attempting to marry his own daughter. His wife kills him with
    a club, his sons drag him out, and the camp leaves him unburied; a saying explains
    dead coyotes on village sites by this event. The next tale begins with Coyote
    and his two wives traveling south, toward the land where the sun travels, to seek
    other people and avoid giants. At a brook below a high hill they see Wonderful-Being;
    the wives fear he will kill them, while Coyote instructs them to place pebbles
    in their robes so the stones will rattle. A note identifies the teller and says
    the story teaches fear of giants and recalls that giants were destroyed by Evening-Star.
  language: English
  quote_policy: summarized
