canonical_text:
  quote: ''
  summary: A boy kills a large buffalo cow. He and an old woman prepare and bring
    home the meat. After eating, the boy goes to an opening in the side of a hill
    and meets a strange man, who gives him moccasins, leggings, a buffalo robe, an
    eagle cap, an otter-skin quiver with arrows, and a bow. The strange being instructs
    the boy to tell his grandmother to ask village girls to come live with them. The
    boy returns to the tipi and begins striking his bowstring with an arrow while
    singing.
  language: English
