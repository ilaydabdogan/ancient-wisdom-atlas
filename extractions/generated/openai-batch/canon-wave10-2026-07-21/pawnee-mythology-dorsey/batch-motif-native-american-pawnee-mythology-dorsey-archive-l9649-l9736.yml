canonical_text:
  quote: ''
  summary: A mistreated wife repeatedly flees Sun-Ray, first to the Beavers and then
    by changing into a Mole and tunneling to a distant village. Sun-Ray uses a rattle
    and string to retrieve her, but after villagers rebuke him he releases her and
    returns to the sun. The next tale begins with Tirawa creating the world, Fire-Keeper
    guarding all fire, and Hawk brothers living across a deep stream; the older Hawk
    brother marries a priest's daughter, angering the excluded Fire-Keeper.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman leaves the lodge while the man is hunting and cries at a creek.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Beaver ask why she is crying; after hearing that her husband is mean and
    withholds food, they take her into their lodge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The husband finds the woman's footprints on sand by the stream.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband moves his rattle around the waters, makes the woman appear in
    the rattle, and pulls her out with a string from the Beaver dam.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The husband says he can find the woman wherever she goes and throws hot coals
    at her when she cries.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman goes to a mortar, turns herself into a Mole, replaces the pounder,
    digs far through the ground, covers her feet with grass, and reaches a far-away
    village.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: People in the far-away village ask where she came from; after hearing she
    is hiding from her husband, they tell her to stay with them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sun-Ray enters the strange village as a sun-ray, unseen by the people, puts
    the woman to sleep, places her in the rattle, and then turns into a man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The village people tell Sun-Ray that he belongs in the heavens, took a woman
    from earth for his wife, mistreated her, and did not feed her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Sun-Ray angrily threatens to treat the woman worse than before and pulls the
    rattle string so that she comes out.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sun-Ray later says he is sorry, returns the woman to the village in his rattle,
    tells the people to care for her, goes back toward the sun, and disappears.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Tirawa creates the world, makes Fire-Keeper to guard all fire in the west,
    and places people on the earth who are descended from heavenly gods.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A deep stream west of the village can be crossed only by the Hawk brothers,
    who use a log across the stream.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Hawk brothers are described as wonderful beings who wear coyote robes
