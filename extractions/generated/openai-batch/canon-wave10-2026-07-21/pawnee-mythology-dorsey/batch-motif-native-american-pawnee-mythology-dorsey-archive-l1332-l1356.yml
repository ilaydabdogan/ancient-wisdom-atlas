canonical_text:
  quote: ''
  summary: An old woman meets a returning young man at a cave, shows him many ant-hill-like
    earth-lodges with people entering and leaving, and says he will have villages
    with many people. In her lodge she instructs him about lodge construction, altar
    placement, placing a promised buffalo skull at the altar, and distributing corn
    and dried meat to the village. The young man returns to his lodge, sets down the
    bowls, wakes his mother, and tells her to make a fire and keep the people near
    it.
  language: English
