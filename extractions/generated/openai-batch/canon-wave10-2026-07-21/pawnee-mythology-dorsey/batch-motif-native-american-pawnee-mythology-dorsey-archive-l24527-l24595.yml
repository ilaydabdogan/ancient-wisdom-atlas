canonical_text:
  quote: ''
  summary: 'Passage contains abstracted Pawnee narrative episodes: a youngest daughter
    marries Burnt-Belly after he appears as an eagle and leads a buffalo hunt; the
    story of Young Duck, Hawk, a jealous old woman, and the origin of the clam shell;
    and the story of a poor boy/Morning-Star who eats reserved corn seeds, becomes
    Eagle, is pursued, captured through human-flesh bait, and establishes sacrifice
    to Morning-Star.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Burnt-Belly enters a lodge as an eagle, changes into human form wearing eagle-feather
    garments, rejects two older sisters who try to claim him, and leads the people
    to small game and buffalo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man captures a diving duck and releases it at his wife's request; later
    the wife gives birth to a girl called Young Duck, who has duck-like habits involving
    water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Young Duck receives visionary instructions for a crooked stick and carrying-straps,
    uses the crook to draw dry limbs from trees, and becomes leader of girls gathering
    firewood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hawk is recognized by Young Duck, asks animals that he may become human, and
    marries her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A jealous old woman kills Young Duck, removes part of her skin, substitutes
    her own skin, throws the girl into a stream, and returns disguised as the young
    girl.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Medicine-men fail to identify the disguised old woman, but Crow doctor recognizes
    her; Hawk hears his wife's voice singing at the river, and the old woman is thrown
    into water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hawk turns into a hawk, flies along the creek for four days, finds his wife
    in a tipi, carries her upward, drops her, and discovers that she is Clam Shell,
    rough outside and smooth inside.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: When no people lived on earth, Moon sends down a woman and Morning-Star or
    his younger brother near a stream with food.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The woman plants corn and warns the boy not to touch remaining seeds; the
    boy eats the seeds, is whipped, sings, gradually becomes an eagle, and flies away.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: Beavers, elks, and buffalo try to help the woman catch Eagle by hiding her
    and simulating death, but Eagle is not fooled at first.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: The animal helpers say that Eagle is Morning-Star, chief of the heavenly gods,
    and that he desires human flesh.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The woman or girl is cut open and placed on an arbor as bait; Magpie, Crow,
    and Coyote come to feed, and Eagle alights there.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:13
  text: When Eagle looks for the girl's heart, she grabs his legs, he becomes a boy
    again, and he declares that future enemies shall be sacrificed to Morning-Star
    after many have been made holy.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The woman returns to Moon and the boy goes to the east, where he stands behind
    his brother.
  category: sequence
  evidence_refs:
  - ev:11
