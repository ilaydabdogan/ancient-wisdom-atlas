canonical_text:
  quote: ''
  summary: A buffalo council plans to kill a boy and sends two young buffalo cows
    for him. Before leaving, the boy obtains human bodies for his cannibal grandmother,
    evades pursuers, refuses to kill more, and travels west. Hungry, he shoots one
    of two buffalo, removes a kidney, and is stopped by a woman in a buffalo robe.
    She tells him to replace the kidney, reveals that she and the killed buffalo came
    for him, and revives the dead buffalo; she then tells him to wait so they can
    speak.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Buffalo sit in council, plan how they could kill the boy, and decide to
    send two young Buffalo cows to tell him the Buffalo want him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy sits on a high hill, sways his head from right to left while listening,
    and says that someone wants him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old woman tells the boy she has only a small piece of human meat and asks
    him to kill four men so she will have plenty to eat and can sleep among the dead
    men.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy kills men in a village and carries their bodies to the old woman's
    tipi while villagers pursue him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When pursued after killing the fourth man, the boy disappears after running
    over a hill and appears on another hill; pursuers see deerskin leggings and a
    yellow robe and think he may be a deer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The boy says he feels sorry for the people and refuses the old woman's request
    to kill one more person.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy tells the old woman to tie up the dogs, later to untie all except
    Afraid-of-Nothing, and then leaves toward the west.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After many hungry days without game, the boy sees two Buffalo, hides, shoots
    one so it dies, and cuts into its back to remove a kidney that he is about to
    eat raw.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A voice from behind the boy tells him to put the kidney back in its place,
    walk away, and not look.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The speaker appears as a woman wearing a new buffalo robe with unplaited hair
    and says that she and the other Buffalo came after the boy.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The woman pushes the dead Buffalo until it moves and rises; the narrator states
    that the woman was a Buffalo and the mate of the other Buffalo.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The two Buffalo go around in a circle, one staggering and the other pushing;
    after the killed Buffalo walks away, the speaker tells the boy to wait in a hollow
    because they want to talk with him.
  category: sequence
  evidence_refs:
  - ev:7
