canonical_text:
  quote: ''
  summary: After crop failure leaves the people hungry, they seek help from a young
    man whose lodge is surrounded by snake dens. A Spider-Woman proposes challenging
    him for buffalo, while village men urge the chief to invite him to live as son-in-law
    with the chief's daughter so the people may obtain food. The chief intercepts
    the young man outside the lodge; the young man says he must feed and consult the
    snakes before agreeing, and later reappears carrying a deer.
