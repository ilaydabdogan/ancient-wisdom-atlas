canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which Ghost-Man becomes a whirlwind
    to heal a sick man, fails to return to human form, falls as a skeleton, and is
    buried by the recovered man; the narrator explains this as the reason whirlwinds
    are called ghosts or spirits. It then begins a tale of a young man whose newly
    married wife dies. While mourning at her grave, he is addressed by an unseen mysterious
    being who tells him he can see his wife if he travels bravely and alone toward
    the south. After a difficult journey, he reaches a bright tipi, meets an old woman
    with wild sage, and receives instructions for entering Spirit-Land by crossing
    a black stream on a log. She gives him mud balls to throw at his wife among the
    dancing spirits so that she will remember the living and come to him, and says
    the mud balls will enable his return.
  language: English
  quote_policy: summarized
