canonical_text:
  quote: ''
  summary: 'The passage ends a story in which a boy sings to a gambler, the gambler
    admits his identity, and the final throw of sticks turns the sticks and ring into
    buffalo. The defeated gambler, his family, the witch, and Coyote are beaten to
    death by the boy''s supporters, and the people rejoice. A new story begins: a
    Hawk warrior''s wife disappears while he is away. Their child, Young Hawk, searches
    for his mother, finds a passage into the ground, travels in the under-world, reaches
    a village, and sings his mother’s, father’s, and his own names. A note states
    that the story explains the power of certain hawks over snakes and the name snake
    hawks.'
  language: English
  quote_policy: summarized
