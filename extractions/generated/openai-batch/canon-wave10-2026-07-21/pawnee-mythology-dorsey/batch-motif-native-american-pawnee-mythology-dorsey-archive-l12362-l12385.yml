canonical_text:
  quote: ''
  summary: A boy regains consciousness in an animal lodge where errand men ask the
    animals to help him. The Beaver medicine-men request help from Otters, Bears,
    and other animals, but they fail or refuse. The Ground-Hog people agree to help;
    the boy is put to sleep and placed near the lodge center while the Ground-Hog
    leader performs a ritual involving the fireplace, a bowl of water, and the vomiting
    up of a bone.
  language: English
  quote_policy: summarized
