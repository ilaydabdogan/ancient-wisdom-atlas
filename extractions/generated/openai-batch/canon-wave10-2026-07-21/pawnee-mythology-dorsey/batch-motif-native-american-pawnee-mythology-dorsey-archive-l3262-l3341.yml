canonical_text:
  quote: ''
  summary: Without-Wings repeatedly changes into an eagle to follow a Buffalo cow
    and calf who become a woman and boy at night. The woman and child repeatedly leave
    him asleep and try to evade him across timbered country, a stream, and mountains.
    The boy, who calls Without-Wings his father, feeds him and later warns him about
    the Buffalo village, the dangerous grandmother, a falling stone at the entrance,
    and recognition signs for finding his wife and son among similar buffalo and calves.
  language: English
  quote_policy: summarized
