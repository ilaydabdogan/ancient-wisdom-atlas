canonical_text:
  quote: This woman looked at the child and went on.
  summary: A boy is born in the family of White-Moccasins and is carried around daily
    by women of the village. A young girl takes him out and later gives him to another
    woman. A woman recognized as Witch-Woman comes near, looks at the child, and goes
    on; the women do not tell the parents. A note says the tale concerns the end of
    dreaded supernatural beings and links Witch-Woman, Hawk, warriors, and a hawk
    skin in a warrior's bundle.
