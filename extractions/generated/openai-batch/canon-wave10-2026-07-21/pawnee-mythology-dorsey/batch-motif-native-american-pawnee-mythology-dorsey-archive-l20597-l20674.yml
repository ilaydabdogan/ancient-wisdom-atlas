canonical_text:
  quote: '"I am the Wind that blows."'
  summary: A young man in Spirit-Land undergoes smoke and wild-sage rites, is told
    about routes and restrictions for the dead, meets a supernatural guardian who
    gives him battle objects and instructions, exits by a cave, receives dream guidance,
    and returns toward his village.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The young man is stood at the edge of the village while hot coals are placed
    to his east, south, west, and north; wild sage is put on the coals so smoke rises
    around him at the center.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The uncle touches the young man with wild sage, makes a ball from sage leaves,
    gives it to him to eat, and tells him not to spit anything out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After four days, the uncle tells the young man that he is not dead, that a
    watching being made him come there, and that dead people come through the passage;
    he distinguishes warriors, those who die on sick beds, and suicides.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The coals and wild sage smoke are arranged again before the young man is rubbed
    with sage and told to return to his people and report his journey.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the passage-way, the young man reaches a little being; after he closes
    and opens his eyes, he sees the man of his dreams, wearing a buffalo robe and
    leggings with scalps and eagle feathers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The man says he has cared for the young man, brought him to the dead people,
    and is the Wind that blows; he says he will be with him so enemies cannot kill
    him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Wind gives the young man mud, a downy feather to put on his head, and
    a whistle to blow in battle; he says the young man will die if an enemy shoots
    the feather.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The young man leaves the being, runs to the cave entrance, finds his pony
    and belongings, saddles the pony, and starts north; dreams continue to direct
    his travel.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: In a dream, the being instructs him to cut small pieces from each scalp, string
    them, wear them on his breast, and says he will become known as a great man.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The being tells him that his parents adopted another boy because they thought
    he was dead and warns him not to be angry; the young man reaches the village area
    and identifies himself as a returning warrior.
  category: sequence
  evidence_refs:
  - ev:8
