canonical_text:
  quote: ''
  summary: Handsome-Boy is warned and aided by a mysterious being, fights enemies,
    enters a hole in a mountain, passes a dwarf, and reaches a village associated
    with the passage of the dead. An uncle instructs him about different afterlife
    journeys, purifies him with sage smoke, and sends him back. The mysterious being
    reveals himself as Wind, gives him war objects, and continues guiding him. Handsome-Boy
    returns to his village unrecognized, proves himself in battle and dances, honors
    an adopted household, marries, becomes a hunt leader, and later goes off to mourn
    after conflict with his wife.
  language: English
  quote_policy: summarized
