canonical_text:
  quote: ''
  summary: 'An editorial note frames the tale as teaching that heavenly gods protect
    pregnant women and newborn children, and as a hero tale connected with a bundle
    ceremony. The tale then begins: a young woman becomes pregnant though she says
    she has not been with a man, is expelled with her mother and grandmother, and
    is left behind when the village goes on a buffalo hunt. The women survive in the
    deserted village. The young woman gives birth to a boy on a day of strong north
    wind. The child grows quickly, receives bows and arrows from his grandmother,
    and hears a voice in the timber claiming to be his father.'
  language: English
  quote_policy: summarized
