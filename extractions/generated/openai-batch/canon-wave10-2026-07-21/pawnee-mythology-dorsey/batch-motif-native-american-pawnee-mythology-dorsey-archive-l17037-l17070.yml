canonical_text:
  quote: ''
  summary: A poor boy prepares sharpened dogwood sticks, seats the chief's boy toward
    the sun, and says the ordeal will place the chief's boy in his stead and allow
    him to receive powers from animals. He pierces the chief's boy's back with the
    sticks, ties elk-hide strings and a lariat to them, lowers him over a bank near
    meat, and ties the rope to a tree. Birds come from the west and receive meat from
    the chief's boy. The poor boy concludes that his friend is favored by animals,
    later finds him gone, and believes the animals have taken him. The excerpt ends
    as the poor boy is touched while sleeping on the bank.
  language: English
