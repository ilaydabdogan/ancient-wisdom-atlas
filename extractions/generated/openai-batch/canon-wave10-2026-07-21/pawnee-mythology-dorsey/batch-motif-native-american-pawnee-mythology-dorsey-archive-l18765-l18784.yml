canonical_text:
  quote: The man was able to transform himself into a Deer at any time, and then change
    to a man.
  summary: A woman and a man wander for several years; the woman gives birth to two
    fawns and teaches the man the ways of the black-tail Deer, including transformation
    into a Deer and back into a man. After about three years, she leads him and the
    fawns back toward his village, where a yearly medicine-men's ceremony is occurring.
    She tells him to go to the medicine-lodge, announce his return, gain consent to
    enter, and then come back to her and the fawns. A note identifies the teller and
    says the tale warns young men about strange women on the prairie, who may be transformed
    black-tailed deer whose influence can lead men to madness and death.
  language: English
  quote_policy: quoted
