canonical_text:
  quote: ''
  summary: A root used for Squash Medicine is addressed as a willing medicine power,
    brought into a prepared tipi, ritually smoked to, divided among medicine-men for
    their bundles, and treated with ongoing offerings. That night the ritual leader
    dreams of a feather-covered woman with a clam shell, water, and powdered root,
    who teaches a healing song and procedure; the narrator identifies her as the root
    itself and says the man becomes a great medicine-man. The passage then begins
    a separate origin account in which a handsome young Pawnee man, unsuccessful in
    courtship, seeks the secret of a homely man liked by women; the homely man says
    his power came from the antelope and takes the seeker toward an ordeal at the
    Missouri River.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The root is addressed as having signaled by water from its top that it was
    willing to be removed from the earth for use in healing the sick.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The root is not to be placed near sick people or lodge entrances, but is to
    be kept in medicine bundles so that its spirit and power remain with the people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The root is brought into a swept tipi with new mats and placed on the west
    side of the fireplace while people sing and medicine-men enter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man offers pipe smoke to the Big-Black-Meteoric-Star, to the root, and
    to the head, then asks that pieces of the root be distributed to medicine-men
    for their bundles and for driving disease from the camp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Medicine-men choose pieces from body-like parts of the root, including arm,
    feet, ankles, and knees; the man takes the hips and chest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man says the divided root's power is with every medicine-man in the tipi
    and instructs them to hang it away from children and women, smoke to it nightly,
    pray to it, and put it away.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: In a dream, a woman in a black dress covered with soft downy feathers holds
    a clam shell in one hand and powdered root in the other, sings, and drops the
    root into water in the shell.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dream woman instructs the man to sing the song while doctoring a sick
    person, place root dust in the shell, and give the mixture to the patient so that
    the patient will become well.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: After waking, the man smokes, addresses the dream figure as his mother, promises
    to follow her instructions, and asks that her spirit remain with him in dreams;
    the narrator states that the woman was the root itself.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A handsome young Pawnee man repeatedly tries to court women, but the girl
    he likes and other girls run away from him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The young man asks a homely young man how he is liked by the girls, and the
    homely young man says he has a power given by the antelope.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The homely young man takes the seeker toward the Missouri River, ties him
    around the waist with a lariat, and says he must hang over a steep bank.
  category: action
  evidence_refs:
  - ev:8
