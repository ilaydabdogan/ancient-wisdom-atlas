canonical_text:
  quote: ''
  summary: A boy gives beads and scalps to the Buffalo and receives a small war shield
    with instructions to wear it on the left shoulder. He succeeds in several battles
    while following the rule, but is wounded when he places the shield on the right
    shoulder. A Buffalo bull and unseen Buffalo are involved in his recovery and temporary
    transformation into a Buffalo, after which he returns as a man with a buffalo
    robe. He later dies after a buffalo horn spoon is thrown into the fire, violating
    a secret Buffalo instruction. The next story begins with a Skidi hunter at Pahuk
    who meets a woman who becomes a black-tail Deer, resists his bullets, compels
    him to live with her, and transforms him into a Deer.
  language: English
  quote_policy: summarized
