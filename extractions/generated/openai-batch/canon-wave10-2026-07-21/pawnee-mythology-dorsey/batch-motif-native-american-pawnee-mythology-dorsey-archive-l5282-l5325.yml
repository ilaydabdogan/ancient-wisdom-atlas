canonical_text:
  quote: ''
  summary: A boy follows men west despite his mother's warning about snow. After three
    days without food he falls behind during a snowstorm. An artichoke drops before
    him, he eats it, and an unseen speaker identifies himself as Snow-Storm, says
    he gave the boy life, appears as a man in a snowy buffalo robe with a fox-skin
    cap and feather, and instructs the boy to return home, gather artichokes, feed
    his parents, and request red paint, blue beads, black eagle feathers, and native
    tobacco. Snow-Storm says he has blown his breath on the boy so he can travel with
    windlike speed. The boy glides home, gives artichokes to his mother to boil, summons
    relatives, and begins asking them for the named goods.
  language: English
  quote_policy: summarized
