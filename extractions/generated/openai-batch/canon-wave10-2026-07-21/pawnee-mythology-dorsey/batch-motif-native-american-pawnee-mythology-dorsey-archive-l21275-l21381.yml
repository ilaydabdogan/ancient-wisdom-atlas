canonical_text:
  quote: ''
  summary: The passage contains the end of a Coyote tale in which Coyote and his two
    wives frighten Wonderful-Being by singing, jumping, and rattling pebbles; Wonderful-Being
    flees, Coyote and his wives run away, the older wife dies, and an explanation
    is given for coyotes in rocky places and dead coyotes on prairies. It then tells
    how thirsty Coyote offers his tongue, heart, and body parts to four western gods
    for rain, retracts the promise after rain comes, and is killed by hail, with an
    explanatory saying about dead coyotes. The next tale begins with Coyote-Man, Fox-Man,
    Rabbit-Man, and Spider-Woman scouting buffalo and bringing meat to the priests’
    lodge, where priests sing with rattles; a note states the story teaches offerings
    through priests and their bundles.
  language: English
  quote_policy: summarized
