canonical_text:
  quote: ''
  summary: 'The passage gives abstracts of several Coyote narratives: Coyote obtains
    food-producing bodily tricks from squirrels and Beaver but overuses them; deceives
    and kills Bear; impersonates a medicine-man and kills a sick boy; is carried skyward
    by Buzzards and dropped; commits further violence and is transformed after being
    thrown on fire; uses pipe-sticks to lure and kill beavers; and is finally killed
    by an animate rolling stone after reclaiming a gift and mocking his rescuers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote asks squirrels for food; a male squirrel instructs a body operation
    that produces pecans, but repeated use causes bleeding, and the squirrels heal
    Coyote while saying he has lost power.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Beaver teaches Coyote a procedure in which cottonwood bark and oil from Coyote's
    cut scrotum make pemmican; Coyote is warned not to do it more than four times
    daily, disobeys, and returns for healing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Coyote deceives Bear by making his head and lips appear afflicted, cuts Bear
    deeply, kills him, and roasts the meat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Coyote's hand is caught between rubbing limbs after he orders them to stop;
    other coyotes eat his meat before the tree releases him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Coyote obtains a medicine-man's song and dance, kills him, wears his costume,
    enters a village, pretends to doctor a sick boy, and kills the boy with a red-hot
    iron.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Snake appears after Coyote cuts the boy into pieces and puts him in a kettle;
    Coyote gags Snake with meat, but Snake informs the people that Coyote killed the
    boy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Buzzards carry Coyote into the sky, where he sees game below; two Buzzards
    separate and Coyote falls into a hollow log, remaining there for several days.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Coyote uses tails from his raccoon-hide quiver through holes in the log so
    people think the tree contains raccoons; when they cut it down, he feigns anger.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Coyote removes a baby from a baby-board, cuts off its head, replaces the head
    in the cradle, and is later captured and thrown on fire, after which he becomes
    a little hairy man.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Coyote makes pipe-sticks and carries them to the beavers' lodge; the beavers
    become his children, meet him for a pipe-stick dance on a hill, and many are killed
    by his club.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Coyote gives his knife to a big round stone for help finding food, reclaims
    it when he sees meat in a village, and repeats the gift and reclamation before
    the stone pursues him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Bears, mountain-lions, and buffalo say they cannot help Coyote against the
    pursuing stone; bull bats shelter him and break the stone with flatus.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: After Coyote mocks the bull bats, they reassemble the stone fragments; the
    stone again pursues Coyote and kills him.
  category: sequence
  evidence_refs:
  - ev:13
