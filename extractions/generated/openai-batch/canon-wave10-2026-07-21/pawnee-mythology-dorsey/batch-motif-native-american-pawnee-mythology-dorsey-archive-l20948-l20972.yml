canonical_text:
  quote: ''
  summary: A warrior borrows a warriors' bundle, invites young men to his lodge, and
    leads a pipe-smoking rite addressed to the gods in the heavens before announcing
    a raid into enemy country. The young men prepare clothing, food, and moccasins,
    depart in the morning, and travel many days. Near a deep ravine they see a big
    Turtle; two mischievous young men climb onto it, try to ride it, jump on it, and
    become stuck fast.
  language: English
  quote_policy: summarized
