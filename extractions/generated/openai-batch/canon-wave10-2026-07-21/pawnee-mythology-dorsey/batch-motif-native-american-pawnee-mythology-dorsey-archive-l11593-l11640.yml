canonical_text:
  quote: ''
  summary: Crow accuses Hoof-Shield of losing the birds' sister and says he must help
    return her. The birds search; Blackbird reports that the Buffalo are playing with
    the girl. Selected birds see the Buffalo playing a ring-and-sticks game and understand
    that the ring is the girl. Birds report this to the tipi. Animals gather, and
    Coyote has pine juice spread over him to imitate sickness. A rescue party of animals
    and birds is chosen, with Coyote as leader and Badger digging holes for Fox, Rabbit,
    and Coyote. Coyote approaches the Buffalo game alone while pretending to be sick.
  language: English
  quote_policy: summarized
