canonical_text:
  quote: ''
  summary: Howling-Fox waits at night with rings at the play ground. A Buffalo appears,
    rolls on the ground, becomes a woman, identifies one ring as her daughter, gives
    Howling-Fox instructions and mud with curing power, and departs after he ties
    the ring to her horns. Later Howling-Fox compensates the owner of the missing
    ring. During a hungry buffalo hunt, the woman returns, gives dried meat, directs
    him to advise travel northwest, and the chief grants him authority to guide the
    camp.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Howling-Fox watches the men playing sticks from the top of the lodge, then
    after dark takes rings to the ground, sits on the north side, and smokes a pipe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A rumbling sound and hoof sounds come from under the ground; a dark form appears,
    is recognized as a Buffalo rolling on the ground, and then stands up changed into
    a woman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: There are three rings; the middle ring has a blue bead instead of a white
    bead, and the woman identifies it as her daughter.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The woman tells Howling-Fox that she will look after him, tell him where to
    get meat when needed, appear in his dreams, and speak with him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The woman gives Howling-Fox mud said to have her power and instructs him to
    put it across his mouth and blow his breath toward the sick so its smell will
    reach them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Howling-Fox ties the ring and string tightly to the Buffalo's horns; the Buffalo
    snorts, runs west, and disappears from sight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Howling-Fox returns two rings to their owners and gives his pony to the owner
    of the missing ring as replacement, promising later information and further payment.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: On a later southwest buffalo hunt, the people find no buffalo and become hungry
    while the chief continues ordering travel south.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The woman appears to Howling-Fox during the hungry camp, says she has come
