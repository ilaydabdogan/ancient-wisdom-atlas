canonical_text:
  quote: ''
  summary: People from one Skidi band hear of a young medicine-child who cures diseases.
    A powerful Skidi medicine-man and his wife visit the boy to learn the source and
    nature of his powers. The boy receives them with seating, food, and pipe-smoking.
    The older medicine-man states that he came to make friends and discuss medicine
    mysteries, then spends the night and part of the next day recounting how he received
    his own powers. He leaves with his wife, invites the young man to visit, and later
    word comes that he will visit again with his wife.
  language: English
  quote_policy: summarized
