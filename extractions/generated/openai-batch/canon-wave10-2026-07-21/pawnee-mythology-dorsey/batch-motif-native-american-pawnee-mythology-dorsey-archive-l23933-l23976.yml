canonical_text:
  quote: ''
  summary: The passage gives abstracts of two Pawnee narratives. In the first, Coming
    Sun is dream-instructed to fast on a hill, fails several warrior-related interception
    tasks, is met by North Wind, receives medicine and feather powers for war and
    buffalo calling, loses that power after a woman enters his tipi and a young man
    removes the feather, then becomes blind and dies. In the second, a buffalo game
    is given to the people; a young man has relations with a woman who bears a buffalo
    calf, follows a snowbird to countless buffalo, finds the woman and child as cow
    and calf, passes recognition tests with the calf's help, and returns to announce
    buffalo abundance in four days.
  language: English
  quote_policy: summarized
