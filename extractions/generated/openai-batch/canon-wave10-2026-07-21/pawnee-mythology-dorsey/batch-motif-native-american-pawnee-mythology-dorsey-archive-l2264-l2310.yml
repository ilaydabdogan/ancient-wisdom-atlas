canonical_text:
  quote: ''
  summary: 'The passage closes one heavenly-being narrative in which a young man releases
    buffalo and other animals from caves, returns to heaven as Morning-Star, and is
    credited with saving people from starvation and allowing childbirth after the
    spider-woman is killed. It then begins the tale of the origin of the basket dice
    game: gods make a boy and girl from mud, give the boy bow and arrows, deliberate
    over life and light, and send animals whose killing determines conditions; the
    boy kills a spotted black-and-white animal as day begins. The selected range ends
    as the young hunter and his wife approach a lodge after hearing night singing.
    A footnote states that the basket and dice symbolize seven stars, the moon, the
    earth, and its contents.'
  language: English
  quote_policy: summarized
