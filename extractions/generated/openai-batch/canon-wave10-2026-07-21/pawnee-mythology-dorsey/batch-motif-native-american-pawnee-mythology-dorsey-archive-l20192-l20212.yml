canonical_text:
  quote: ''
  summary: A man associated with graveyards enters a village with whirlwinds appearing
    around him. People identify him as possibly a ghost. Hearing of a sick man whose
    spirit is threatened by a ghost or whirlwind, Ghost-Man attends him, throws dust
    into the air, forms a whirlwind around him, and the sick man recovers. He takes
    no payment. He later heals others similarly, including a man sick after dreaming
    of dead people. A note attributes the story to Big-Crow, Kitkehahki, and says
    it expresses belief in ghosts and warns care in seeking a medicine-man.
  language: English
  quote_policy: summarized
