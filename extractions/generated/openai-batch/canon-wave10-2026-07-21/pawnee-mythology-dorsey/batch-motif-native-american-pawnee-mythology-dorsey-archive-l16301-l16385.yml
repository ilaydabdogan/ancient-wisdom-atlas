canonical_text:
  quote: ''
  summary: Proud-Boy and Yellow-Corn prepare for an announced attack by eating a root
    and arranging for their bodies to be laid together under a robe. They are killed,
    placed in Proud-Boy's tipi, and after dust and animal sounds occur there four
    times, they emerge alive. Proud-Boy later uses a water-dog against the men responsible
    for the killing, refuses chieftainship, and becomes a medicine-man while Yellow-Corn
    is said to prescribe for women.
  language: English
  quote_policy: summarized
