canonical_text:
  quote: ''
  summary: A man who has received dream instructions demonstrates a bundle and a holeless
    pipe lighted by the sun, gathers companions for war, becomes a successful warrior
    and chief, and passes the bundle through his wife to a related boy. The boy is
    taught the bundle rules, succeeds in raids, changes names after pony captures,
    and later plans to recover Pawnee ponies taken by Sioux warriors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A source note says the tale explains a warrior's bundle with a small pipe
    having a holeless stem; successful smoking of the pipe near an enemy village was
    taken as an omen of victory, and failure meant the war party returned home.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man says he has the things shown to him in a dream and wants to try what
    he was told to do.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A skin is spread out with the other things; it resembles a wild-cat skin,
    has a long tail, and bears many horse-hoof prints.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man fills the pipe, goes to the ray from the sun, rests the sun-glass
    on the bowl, puffs, and smoke is seen moving through the stem although the stem
    has no hole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The watching men thank him, and after the pipe is emptied he wraps the bundle
    with native tobacco inside.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The owner tells his friends that a mysterious being appeared in a dream, commanded
    him to stand on a hill in the west, later commanded him to find certain things,
    and was seen smoking a little pipe lighted by the sun.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The friends ask to join the owner, saying that the being who took pity on
    him may also take pity on them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The owner says help must come not from himself but from the things before
    him and from the Sun.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The men agree to go on the war-path; the owner leads and carries the bundle
    while traveling on the east side of the group.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The man becomes a great warrior and chief, owns many ponies, kills buffalo,
    and takes meat to the priests' lodge where it is made holy, jerked, and dried.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Because he has no children, the man gives the bundle to his wife when he dies,
    and she keeps it until a related boy grows up.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The boy is taught how to carry the bundle, when to open it, and to walk all
    day on the east side of the company; if anyone passes in front of him, he is to
    turn back and go home.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The boy becomes successful on the war-path and changes his names from Yellow-Bird
    to Proud-Fox, then Spotted-Horse, and then Spotted-Horse-Chief after successive
    pony captures.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: A fine spotted horse among the captured ponies is described as seeming to
    be the chief of ponies.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: Warriors from the Sioux country capture many Pawnee ponies, and Spotted-Horse-Chief
    tells a few friends that he intends to go on the war-path to get the ponies back.
  category: sequence
  evidence_refs:
  - ev:10
