  summary: In this abstracted Pawnee narrative segment, Stone-Man repeatedly tests
    and destroys prospective sons-in-law, while Animal Boy returns with animal assistance,
    is selected as son-in-law, completes impossible tasks, survives the lethal ring-and-javelin
    test by otter power, learns of Stone-Man's plan to turn people into stone, breaks
    the stone source of Stone-Man's power, and approaches a further contest aided
    by buffalo.
