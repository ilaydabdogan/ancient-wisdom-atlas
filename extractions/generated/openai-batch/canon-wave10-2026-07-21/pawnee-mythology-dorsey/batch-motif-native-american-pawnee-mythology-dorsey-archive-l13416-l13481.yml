canonical_text:
  quote: ''
  summary: During an evening storm, a man hears thunder, animal sounds, and drumming,
    sees lightning strike the riverbank, and is himself struck down. Stone-Man appears
    and says the animals tried to frighten him but will speak to him and give him
    powers; he instructs the man to carry him to the lightning-opened entrance and
    not remove him until the animals teach their secrets. The man enters the hole,
    reaches an animal lodge lighted by fire, sees a Mink pass to and from the entrance,
    and refuses a fire-maker's request to remove the stone until the animals grant
    him the medicine-men's ceremony.
  language: English
  quote_policy: summarized
