canonical_text:
  quote: ''
  summary: A boy recognized as the son of White-Moccasins follows a trail where voices
    from plants, insects, village objects, and dropped items sing his identity. He
    reaches a village, rejects the chief's offer to become his son-in-law because
    he is too young, rejoins his father, and helps the people find buffalo. Later,
    as a young man and successful war leader, he postpones marriage until he can make
    four buffalo holy. He leads companions eastward to kill a female enemy at a grass-lodge
    by a big water. He turns into a Hawk; the old woman turns into an Owl and then
    the Witch-Woman. He resumes human form, kills her with a club, buries her, burns
    her owl parts and medicine bags, and returns to the village.
  language: English
  quote_policy: summarized
