canonical_text:
  quote: ''
  summary: 'The passage gives abstracts of three Pawnee narratives: Sun-Ray repeatedly
    confines and recovers his mistreated wife through a rattle until she escapes by
    transformation and he returns to the sun; Hawk is captured and blinded by Fire-Keeper,
    restored after a precipice ordeal, then kills Fire-Keeper and establishes fire,
    star-help, sacred bundles, and owl guardians; Singing Hawk scouts for buffalo
    and his songs become ritual songs for finding buffalo near home.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Sun-Ray abstract, a man and his wife live alone; he is a successful
    hunter but treats his wife meanly, and she tries to leave him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife repeatedly finds herself inside a rattle hanging at her husband's
    belt, and he uses the rattle to recover her from villages.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife tells people of her husband's cruelty and later, after crying at
    a creek, is taken into a beaver lodge.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: After the husband throws hot coals at her, the wife becomes a mole, digs out
    under a mortar, covers her feet with grass, leaves no trail, and reaches a distant
    village.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The husband enters a village as a sun ray, discovers the wife, and is rebuked
    by people who say he belongs in the heavens and has no right to mistreat an earthly
    woman.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the end of the Sun-Ray abstract, the husband releases the wife, repents,
    becomes Sun-Ray, and returns to the sun.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the Fire-Keeper abstract, Fire-Keeper lives in the west near a deep river,
    while two Hawk brothers live across the river and cross it by means of a magic
    log.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The older Hawk brother marries the priest's daughter, and Fire-Keeper, the
    priest's brother, decides to kill him because he was not consulted about the marriage.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Hawk husband is seized in fog, stripped, has his clothing burned, loses
    his eyes, is led away, and is made to stir fire as a slave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The wife follows clothing fragments and tracks west to a tipi with a big fire,
    where she finds her red-painted uncle and her blind husband.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:11
  text: The blind husband comes out of the lodge and the child stops crying; the wife
    obtains his half-burned war club and leads him east.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: At the husband's request, the wife places him at the edge of a steep rocky
    hill before sunrise and pushes him over; afterward she meets him in normal condition
    and fully costumed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The restored Hawk goes to avenge himself, turns into Hawk, strikes Fire-Keeper
    on the head, turns human again, and throws fire through the sky.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The restored Hawk announces that warriors should receive help from the light
    of the stars.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Animals and birds thank the restored Hawk and call him Warrior-Bird.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: The Hawk brothers instruct the woman's father that their skulls should be
    kept in sacred bundles as protectors on the war-path, and that priests or owls
    should remain at home as guardians of the people.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: In the Singing Hawk abstract, priests hold ceremonies in a grass-lodge representing
    the first lodge on earth, and women bring food offerings.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:18
  text: Coyote people, including all animals, go on a buffalo hunt; Hawk acts as scout,
    travels nearly around the world, finds buffalo near home, and people sing his
    songs so that they may find buffalo near home.
  category: sequence
  evidence_refs:
  - ev:8
