canonical_text:
  quote: ''
  summary: At night a party uses the north star as a guide to leave enemy country
    and return safely to its own country. The leader cuts hair from a pony, strings
    it on a pole, places it on a high hill, and offers it to the god who gave him
    an arrow. The warriors divide the ponies and return to the village singing war-songs
    and giving war-whoops. The villagers meet them and hear of the wonderful arrow
    given to the young leader by the gods. Later, people are eager to see the arrow
    when the young man is said to be going out on the war-path.
  language: English
  quote_policy: summarized
