canonical_text:
  quote: ''
  summary: A boy plays a ring-and-stick gambling game against a gambler. The wagers
    escalate from clothing to lives and then to friends, people, property, wife, children,
    and the gambler's own life. The gambler's messenger, Coyote, fails to retrieve
    sticks from a lodge because of noisy buffalo, while the boy's messenger, Black-Bird,
    succeeds. With a new set of sticks, the game's advantage reverses and the boy
    wins the gambler's possessions and household; the gambler then falls and says
    his leg is broken.
  language: English
  quote_policy: summarized
