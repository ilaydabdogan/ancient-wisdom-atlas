canonical_text:
  quote: ''
  summary: A chief organizes a ceremony by distributing water drums and gourd rattles,
    marking himself as leader, directing soldiers in regalia, seating singers outside
    the lodge, calling the people out in a buffalo-calling manner, leading a fourfold
    procession with songs about maturation, hunting, buffalo-calling, and old animals,
    and concluding inside the lodge with directional pipe-smoking, shared smoking,
    ash-emptying, and fourfold hand motions over the pipe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief gives the four water drums to priests, assigns gourd rattles to
    three older men who stay with the priests, and keeps the largest rattle to show
    that he is the leader of the ceremony.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two soldiers put on crow-feather bustles with coyote tails and red headdresses,
    then take long sticks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief puts a mysterious headdress on his head and covers it with black.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief leads, the priests follow with drums and rattles, and the group
    seats itself on a mat outside the lodge, with the chief at the west facing east.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: One of the chiefs is ordered to call the people out as the young man called
    the buffalo, making a peculiar noise four times.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Two men with pipes stand at the entrance and lead the procession out, followed
    by alternating groups of four young men and four young women, and finally by soldiers
    dancing with sticks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The procession goes around outside the singers four times.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Songs in the ceremony concern a child growing to manhood, young men able to
    hunt buffalo and the enemy, calling the buffalo, and old bulls and cows dropping
    from the herd because of old age.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: After entering the lodge, the chief smokes a pipe filled with native tobacco
    toward named directions and toward the fireplace, then lets drummers and singers
    smoke.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chief stands by the fireplace facing east, empties ashes from the pipe,
    and passes his hands over the pipe four times and above it four times.
  category: action
  evidence_refs:
  - ev:8
