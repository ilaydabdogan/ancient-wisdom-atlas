  summary: A young man leaves a tipi, crosses an unsafe log over a black stream after
    being encouraged by an unidentified speaker, and reaches a light-filled village.
    There he sees men and women dancing in a circle, including his wife. He strikes
    her with mud balls four times as she circles, after which she speaks with him,
    says she cannot return, then eventually gathers things and decides to go.
