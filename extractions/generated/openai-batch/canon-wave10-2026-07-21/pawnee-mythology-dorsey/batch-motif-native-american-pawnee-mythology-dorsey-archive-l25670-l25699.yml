canonical_text:
  quote: ''
  summary: A young boy shows medicine-lodge power by transforming himself and squashes
    in connection with swans. His father, a leading medicine-man, fears the boy's
    power and kills him during a buffalo hunt. The boy returns, explains that swans
    carried him to Swimming Mound after death, and kills his father by sending a breathed-upon
    sunfish bone into him. The boy later becomes a great medicine-man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sleight-of-hand performances continue for many months in a medicine-lodge,
    and a stranger displays great skill there.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The leading medicine-man tells his household about the stranger's skill, and
    his son asks his mother to help him enter the lodge.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother objects because the boy is too young and has not received instructions
    from his father.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: At a creek, the mother bathes and the boy turns into a swan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The boy and his mother take two squashes home; the mother makes him a booth
    in the medicine-lodge, and the boy fills the squashes with swan down after removing
    their seeds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: During a night performance, two young men cut two squashes in two, after which
    the squashes appear whole again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The boy sings and squirts water on the squashes, forming a pool under them;
    the squashes sing like swans, become swans, follow him, and are changed back into
    squashes when he touches their necks.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The people rejoice at the young man's power, but his father worries and hastens
    the ceremony to its end.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: During a buffalo hunt, the father separates his son from the crowd, tells
    him to skin a cow, and shoots him; the son recognizes his father as the shooter
    and dies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The father returns home with meat, pretends ignorance of his son's whereabouts,
    and mourns his death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: On the night of the return to the village, the young man enters his lodge
    quietly, wakes his mother, tells her to keep quiet, and goes to his uncle's lodge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The father sends for the returned young man and offers him medicines, but
    the young man refuses to return.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The young man tells his mother that after his death he found himself in Swimming
    Mound, where his swans had taken him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:14
  text: The boy and his mother plan to kill the father; the boy breathes on a sunfish
    bone from his bundle, and the bone flies into the man and kills him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The boy grows up to be a great medicine-man.
  category: sequence
  evidence_refs:
  - ev:5
