canonical_text:
  quote: ''
  summary: A boy overcomes animal obstacles and, with supernatural aid, transforms
    Evening-Star's dangerous daughter into a human wife. Morning-Star institutes two
    Morning-Star bundles, ritual knowledge, offerings of captured girls, ceremonial
    reenactment of the obstacles, and baby-board prescriptions. The couple returns
    to the village with the bundle, while star gods and animals return to their places.
    The passage then gives an editorial note about a related sacred-bundle tale and
    begins another tale about a young hunter seen by villagers.
  language: English
  quote_policy: summarized
