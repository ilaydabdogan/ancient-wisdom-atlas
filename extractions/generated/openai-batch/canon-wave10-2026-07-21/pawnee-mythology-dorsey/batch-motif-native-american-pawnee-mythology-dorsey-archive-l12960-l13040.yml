canonical_text:
  quote: ''
  summary: A Boy-Loon locates the returning husband, who comes back with many ponies.
    The couple travels back to their village carrying two Loons. The poor boy gives
    ponies and one Loon to the chief's son, and a Loon later guides and protects war
    parties. During a later absence, a young man enters the wife's bed and kicks the
    Loon. The Loon sickens, explains the offense, says its spirit is broken, and instructs
    that after death its skin be kept, its flesh thrown into the waters, and its spirit
    used in the medicine-lodge and heard in dreams.
  language: English
  quote_policy: summarized
