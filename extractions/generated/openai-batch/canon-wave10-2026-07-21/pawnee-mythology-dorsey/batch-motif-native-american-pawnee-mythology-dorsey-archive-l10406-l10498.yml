canonical_text:
  quote: ''
  summary: A poor boy sings for his grandmother to ask the chief for his daughters.
    While singing, he appears as a fine-looking young man with an eagle cap, new clothing,
    bow, arrows, and quiver. The grandmother asks the chief, who delays his answer.
    The youngest daughter visits, declares that she loves the boy, and later gives
    meat and fat to her parents, saying the people will be fed through him. After
    eating, the chief consents to her marriage. The boy marries the youngest daughter,
    hosts the chief and leading men with meat, and says he will try to find buffalo
    for the hungry people.
  language: English
  quote_policy: summarized
