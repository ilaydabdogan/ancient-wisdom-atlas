  quote: ''
  summary: An abstracted Pawnee narrative segment recounts Animal Boy's display of
    a true red fox, his marriage to the chief's daughter, his magical production of
    buffalo food, Crow Feathers' failed imitation and death, and a later conflict
    with Stone-Man, who drives buffalo west and whose country the Kitkehahki eventually
    move toward.
