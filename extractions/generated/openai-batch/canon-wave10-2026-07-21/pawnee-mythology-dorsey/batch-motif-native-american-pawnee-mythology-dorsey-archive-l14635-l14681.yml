canonical_text:
  quote: ''
  summary: 'The passage closes a previous account in which a stone connected with
    a ceremony is lost to avoid enemy capture, while the ceremony and songs about
    Animal-Boy continue. It then introduces the Fossil Giant Medicine-Lodge: a Stone-Medicine-Men
    society whose altar object appears to be a large white stone but is explained
    by medicine-men as a giant bone. A narrator is instructed by an old man after
    giving presents. The old man tells of a hunter at Swimming-Mound who dreams of
    a large man whose drowned people’s bones rest there. The dream figure says the
    bones have curative powers and tells him to take a thigh bone from the south side
    of the hill; the man wakes, finds and digs out a giant thigh bone carved with
    figures and weapons.'
  language: English
  quote_policy: summarized
