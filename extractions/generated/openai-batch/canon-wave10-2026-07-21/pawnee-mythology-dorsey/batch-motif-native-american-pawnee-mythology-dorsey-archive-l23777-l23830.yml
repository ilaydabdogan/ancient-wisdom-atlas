    Ready-to-Give,” in which an outcast pregnant girl bears a rapidly growing son
    of Wind, who receives game, food plants, agriculture, sacred-bundle instructions,
    buffalo rites, and public status; and the beginning of “The Man Who Called the
    Buffalo,” about a boy with mysterious power who meets North Wind as protector.
  language: English
