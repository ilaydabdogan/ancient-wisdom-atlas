canonical_text:
  quote: ''
  summary: A poor boy is befriended by a chief's son but remains ashamed of his family's
    poverty. At a camp near dangerous mountains, his father warns him that mysterious
    animals among the cedars kill humans and horses. The boy leaves at night intending
    to be devoured, crosses mountain features, and enters a den. Inside he finds a
    Bear lodge with a mother Bear and cubs. The mother Bear pities him, warns that
    a powerful Sun-endowed Bear lives there, and points out skeletons and victims'
    belongings in the den.
  language: English
  quote_policy: summarized
