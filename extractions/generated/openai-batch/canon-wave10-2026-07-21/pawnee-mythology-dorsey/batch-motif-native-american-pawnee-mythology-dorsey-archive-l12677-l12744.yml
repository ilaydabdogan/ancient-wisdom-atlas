canonical_text:
  quote: ''
  summary: 'The passage describes a renewed medicine-man ceremony connected with beaver
    medicine: communal hunting and preparation, construction of lodges around a pond
    and a beaver lodge in its center, public sleight-of-hand performances, a dead
    loon that flies around the pond, burial of ritual items in the water, later gifts
    at the pond, the appearance of an island where a tree had been planted, and transmission
    of the beaver ceremony to the medicine-man''s son. It then begins a new narrative
    on the origin of the loon medicine ceremony, introducing a poor Skidi boy without
    relations who is taken into the chief''s son''s lodge and supported by him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After earlier ceremonies, the people prepared for winter hunting, killed many
    buffalo, returned in spring to plant corn, hunted again, and dried meat for the
    young medicine-man's expected dance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young medicine-man called men to his medicine-lodge, and for three days
    medicine-men had sleight-of-hand performances in the earth-lodge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Instructions were given that medicine-men should make lodges around a nearby
    pond, make a kind of beaver lodge in the center of the pond, and later perform
    at the pond openly before the people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Medicine-men cut willows, cottonwood, box elder, and elm, and made lodges
    around the pond in the water; the people made a great beaver lodge in the center
    of the pond.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Around daylight the young medicine-man took a cottonwood tree, swam to the
    central beaver lodge, and placed the tree in the center of the lodge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the early morning, the people heard yelling and shouting at the pond, went
    there, and found the medicine-men at work.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Medicine-men performed magic powers and sleight-of-hand acts, including putting
    sharpened willow sticks through another man's cheek and swallowing pieces from
    the cottonwood tree before pulling them up again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the afternoon the young medicine-man stood in the west with a dead loon,
    set it free, and the loon flew around the pond and back to him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The young medicine-man said the loon had gone around the pond, told the medicine-men
    to leave the pond, bury their limbs and the things they had been playing with
    in the water, go to the lodge, and eat; after eating, they were dismissed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Years later, men visited the pond, gave presents of robes, tobacco, beads,
    and feathers, and saw an island in the center of the pond where the young man
    had planted the tree.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In old age the medicine-man gave his son the beaver he used in medicine ceremonies
    and told him to keep up the ceremony; the son learned the ceremonies and the old
    man died.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The next narrative begins long ago among the Skidi on the Loup River in Nebraska,
    where a poor boy without relations went from lodge to lodge for food.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: The chief's son invited the poor boy into his lodge, gave him moccasins, leggings,
    a robe, and a buffalo-hide lariat, and assigned him to care for and water ponies.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The poor boy cared for the ponies well; the chief's son's relations were glad
    he stayed, gave him gifts, and treated him kindly.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: After the two boys grew to manhood, the chief's son was devoted to his companion
    and wanted to keep him in his lodge.
  category: relationship
  evidence_refs:
  - ev:10
