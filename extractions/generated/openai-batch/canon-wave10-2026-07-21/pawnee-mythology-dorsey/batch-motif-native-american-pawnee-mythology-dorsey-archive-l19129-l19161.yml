  quote: ''
  summary: A war party travels south to enemy country. Wolf-Man wears wolf-hide garments
    and carries dust that removes fatigue. Another tireless scout exchanges secrets
    with him, giving him a root from his scalp-lock that relieves fatigue and hunger;
    the scout says the root came from a Horse through a dream instruction.
  language: English
  quote_policy: summarized
