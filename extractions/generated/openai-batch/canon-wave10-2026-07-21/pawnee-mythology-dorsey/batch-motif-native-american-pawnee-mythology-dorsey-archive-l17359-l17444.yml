canonical_text:
  quote: I am now imitating the Bear, / I am now acting like one.
  summary: A woman with Bear medicine and her husband perform songs, breath rituals,
    cedar use, repeated visits, dream-mediated knowledge, and a final act involving
    powdered cherries to heal a wounded man and admit him to the Bear society; his
    relatives pay her with robes, meat, and ponies.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The woman sings that she is imitating the Bear and acting like one; she grunts
    and makes noise like a bear while the man is made to feel like a bear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman and her husband sit in their tipi all night singing bear songs.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: At sunrise, the woman inhales power from the sun in the east, and the man
    smokes to it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The woman and man gather cedar and go to the wounded man's lodge because the
    wounded man is getting worse.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The woman enters the lodge, circles it by way of the north and south, and
    approaches the place where the patient lies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman repeatedly blows her breath toward the wound; her breath is described
    successively as without color, yellow, red, black, and white.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The colored breaths go straight to the wound; the wound becomes fresh and
    blood begins to flow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The spirit of the Bear within the woman is roused; she grunts and raises her
    hands, and some people say the bear's teeth are coming out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The husband taps the woman on the back with cedar limbs until she quiets down,
    and cedar limbs are placed on coals so that burnt cedar smell and smoke fill the
    lodge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The woman repeats the performance four times in total, gives the wounded man
    no medicine, and the wound heals rapidly.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The wounded man reports seeing the woman in sleep with a yellow feather, a
    cedar limb, a young bear hide, and a she cinnamon bear walking on her left side.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The wounded man asks what ponies and buffalo robes will be sent to the woman,
    and his friends propose robes, seven parfleches of dried buffalo, and five ponies.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The woman learns the wounded man's thoughts in a dream from the Bear and tells
    him he will become a member of the Bear society.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The woman places powdered cherries into the man's mouth during the final rite;
    he eats and becomes well.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The wounded man's relatives send robes and parfleches filled with meat on
    ponies to the woman.
  category: action
  evidence_refs:
  - ev:7
