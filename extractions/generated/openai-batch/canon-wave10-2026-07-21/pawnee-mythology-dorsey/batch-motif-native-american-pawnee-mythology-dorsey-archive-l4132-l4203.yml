canonical_text:
  quote: ''
  summary: A war-party leader goes to a high hill to pray to the gods for power and
    success in finding enemy villages. After three days and nights of crying and prayer,
    a western storm covers the sky; lightning and thunder strike, and he loses consciousness.
    In the morning he finds a small black arrow on his breast and understands it as
    a gift from Lightning promising success on the war-path. He ritually smokes to
    the sky, the west, and the arrow, addresses the arrow as his brother, and wears
    it on his breast. Later he dreams of a warrior-god who says he gave the arrow,
    instructs him to keep it, and directs him south, where the party finds a Comanche
    village and captures ponies.
  language: English
  quote_policy: summarized
