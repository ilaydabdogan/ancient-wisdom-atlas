canonical_text:
  quote: ''
  summary: A boy shows his mother signs of wonderful power, prepares two squashes
    with swan feathers in a hidden enclosure, and publicly performs in the medicine-lodge.
    With singing, water, and assistance, the squashes are cut open, rejoined, changed
    into swans, and changed back. The medicine-men rejoice, but the boy's father,
    a leading medicine-man, is troubled because the power is not his and he did not
    teach it. The ceremony is ended early, and the father later calls on the boy during
    preparations for a buffalo hunt.
  language: English
  quote_policy: summarized
