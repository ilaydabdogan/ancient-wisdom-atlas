  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: An unmarried woman gives birth to a child and is left behind when the people
    go on a hunt because they are angry at her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A buffalo bull on a hill blows smoke from his mouth, gives the woman a root
    for doctoring the child, and creates a robe by rolling on the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Three buffalo bulls blow their breath on the child, and a buffalo cow is involved
    when the child sleeps and later awakens well.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The buffalo tell the woman the root will drive away wild beasts; when she
    passes a snake, it dies because of the root.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A man offers to become the woman's husband, learns of her power, returns west
