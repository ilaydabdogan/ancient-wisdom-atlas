canonical_text:
  quote: ''
  summary: Three abstracted Pawnee narratives concern buffalo medicine and buffalo
    dances. In one, a buffalo bull disrupts a sacred tipi, later promises restoration,
    guides buffalo medicine-men to a buffalo lodge through deep water, and grants
    a ceremony centered on a buffalo skull inhabited by buffalo spirit and consulted
    through dreams. In another, buffalo heal an abandoned woman's child and teach
    buffalo dance and doctoring objects, including a root, rattle, and whistle. In
    a third, an old buffalo grants a boy objects and instructions for buffalo dance
    and wound-healing power; after the buffalo dies, the boy takes ritual materials
    and performs the dance.
  language: English
  quote_policy: summarized
