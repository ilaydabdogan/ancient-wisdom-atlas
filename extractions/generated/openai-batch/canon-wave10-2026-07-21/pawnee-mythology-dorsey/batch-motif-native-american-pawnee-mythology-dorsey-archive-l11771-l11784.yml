canonical_text:
  quote: ''
  summary: Spider-Woman, unable to poison two boys with her medicine, decides to kill
    them. She invites them to stay overnight and play the basket game the next day.
    The old woman and her girls sleep near the entrance to detect any attempt by the
    boys to leave. In the morning she feeds them what appears to be squash, but the
    boys discover it is human ears, vomit it out, and then agree to begin the game
    when the sun is high.
