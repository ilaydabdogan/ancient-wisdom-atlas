canonical_text:
  quote: ''
  summary: A man finds signs that his wife has been killed by dangerous beings in
    a timber lodge, then cares for his child Handsome-Boy while hunting. He prepares
    meat and a hollow-log water trough for the boy. During the father's absences,
    a strange boy appears singing that Handsome-Boy is loved and fed with meat while
    he himself was thrown away and fed by his grandmother. The strange boy repeatedly
    makes Handsome-Boy forget the visits, but one day forgets to give the command.
    The father learns the visitor says he was placed at the roots of a big elm tree,
    recognizes this as the place where he put the after-birth, and concludes there
    was a child in it.
  language: English
  quote_policy: summarized
