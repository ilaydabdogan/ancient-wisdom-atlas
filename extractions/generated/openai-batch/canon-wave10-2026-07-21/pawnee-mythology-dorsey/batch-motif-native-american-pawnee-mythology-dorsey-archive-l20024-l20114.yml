canonical_text:
  quote: ''
  summary: 'The supplied range begins with the end of a tale in which a boy and dog
    become red stone, identified as the origin of red sandstone. It then gives a Skidi
    Pawnee fragment on the Eagle and the Sun Dance: a poor young man leaves the village,
    cries on a high hill, hears drumming from the river, and is led by an Eagle to
    birds dancing in the timber. Swans and Owls help transmit the dance, songs, fasting
    rules, four-day duration, dream instructions, and seasonal timing. The range ends
    with the opening of a Skeleton-Man tale in which a hunting couple encounters a
    being that becomes a skeleton and names itself.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy and a dog turn into red stone on a hill, and people identify this as
    the origin of red sandstone in the country.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young man who considers himself poor leaves the village, goes to a high
    hill, and cries there for several days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man hears drumming from the river; on three approaches the sound
    stops, but on the fourth approach he also hears whistling and notices something
    flying overhead.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: A bald-headed Eagle speaks to the young man and says that it has come to take
    him to the drumming.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Eagle leads the young man into the timber, where birds sit in a circle
    and two large Swans in the center make the drumming sound by beating their wings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Eagle gives the dance to the young man, explains the birds' whistling,
    and prescribes dancing for four days and four nights without eating or drinking.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Swans identify themselves as leaders of the dance, say their spirits will
    accompany the young man, and tell him he will dream the dance and its rites.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Swans say the dance should be given when Buffalo bulls stand on high hills.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Owls circle, sing, and the man learns their songs before being told to go
    home and start the dance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After starting the dance, the young man has visions, learns the ceremony clearly,
    and gives many Sun dances during summers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the next tale opening, a man and wife hunt away from the village, make
    a grass-house in timbered country, cook meat on coals, and hear someone coming
    from the timber.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: A being enters the lodge, turns into a skeleton, drops with rattling bones,
    and later whispers the name Knee-Prints-upon-the-River-Banks.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The man gathers the bones and places them in a corner after his wife refuses
