canonical_text:
  quote: ''
  summary: The passage first closes an account in which a boy's seeds are planted,
    multiplied, and distributed to the people, explaining how they obtained corn seeds.
    It then begins the story of Coming-Sun, a Skidi young man on the Loupe River,
    who is instructed in a dream to stand on a high hill for four days and nights.
    He goes there, cries through the vigil, encounters a mysterious being, and is
    directed to pursue a warrior-like man seen near a ravine and spring. A footnote
    identifies the being as Pahohatawa and states that Coming-Sun received great power
    but later lost it by preferring woman over the divine warning.
  language: English
