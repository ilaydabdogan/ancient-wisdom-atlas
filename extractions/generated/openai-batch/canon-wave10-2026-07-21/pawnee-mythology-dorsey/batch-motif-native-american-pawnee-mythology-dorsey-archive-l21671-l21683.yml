  quote: ''
  summary: Coyote-Man has his wife cut him so oil comes from his body; he pours it
    over pounded bark to make pemmican for the children. After repeated attempts,
    blood comes out instead of oil. He asks the Beavers to heal him; they heal him
    but take away his power. He then wanders into thick timber and sees a Bear coming.
