canonical_text:
  quote: ''
  summary: A woman and a boy are brought to earth by stars and given food. The woman
    saves seed corn and prepares ground for planting, but the boy eats the stored
    seeds after being warned not to touch them. After punishment, the boy sings that
    his body is turning into eagle parts, becomes an Eagle, and flies away. The woman
    follows him to the Badgers, who try to help by hiding her under a baited trap,
    but the golden Eagle detects the concealment and leaves.
  language: English
  quote_policy: summarized
