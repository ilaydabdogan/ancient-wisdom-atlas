canonical_text:
  quote: ''
  summary: 'The passage first summarizes two brothers who kill hostile village people,
    defeat Lizard, kill their father, make a funeral pyre with four kinds of poles,
    and ascend with him in smoke. It then summarizes Long-Tooth-Boy: a man’s wife
    dies after childbirth near small ponds; a strange long-toothed boy appears and
    is captured in water with buffalo advice; two boys enter and destroy a water monster;
    they survive a log transformed into a tree by an old woman and restore Long-Tooth-Boy
    after a raccoon stratagem; a witch in yellow-bird form abducts the father into
    the sky; the brothers follow, infiltrate the witch’s village, rescue their father,
    kill the witch, and place her head on a pole as sentinel.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the opening abstract, two figures pass through villages, shake their heads
    with a rattle-like sound, and cause all people in a bad village to die from opposite
    sides of the village.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same two figures encounter their father’s tracks by a stream, meet a strange
    being identified as Lizard across the water, and the younger brother conquers
    Lizard by making his feet turn into flint stone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two figures enter the village containing their father, kill people there
    including their father, carry his body to a high hill, build a funeral pyre with
    four kinds of poles, and ascend with him in rising smoke.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: In Long-Tooth-Boy, a man and wife live for years in a country of small ponds;
    the woman gives birth, dies, and the father throws the afterbirth into water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father feeds the child with animals’ milk, and a strange boy with long
    teeth comes to play with the child while the father is absent.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After a failed capture attempt in which the father turns into a parfleche,
    a buffalo instructs him to use an inflated buffalo bladder tied to Long-Tooth-Boy’s
    head, and Long-Tooth-Boy is captured in water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The boys are warned not to visit dangerous places, disobey, and encounter
    a water monster that is said to have swallowed their father.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The boys leave their bows and arrows on the bank, put stones in their pockets,
    slide down a beaver path, turn into foam on touching the water, float into the
    monster’s mouth, and become human again inside.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Inside the monster, Long-Tooth-Boy breaks and plays with his bow and arrows,
    makes a spark with flint stones, throws the spark inside the monster, and the
    monster bursts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The boys drag the monster’s skin home with sinew strings and give it to their
    father for a tobacco pouch.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: An old woman on the opposite side of a river causes a fallen log to stand
    upright and grow like a tree, spits on it so that it becomes cold and sleets,
    and human skulls are around the tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The text states that Long-Tongue-Boy gnaws steps in the tree so the boys can
    descend.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Long-Tooth-Boy becomes a raccoon; the older brother takes the raccoon into
    the old woman’s lodge, a pot boils over onto the old woman, and she falls toward
    the fire and is killed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:14
  text: The older brother wraps the meat, throws it into a pond, and Long-Tooth-Boy
    is restored to life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: A witch turns into a yellow bird, alights on the lodge opening, seizes the
    father by the hair after he misses his shots, and disappears with him into the
    sky.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: Each brother shoots arrows upward and follows the father into the sky, where
    they see yellow feathers and warriors dancing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:17
  text: Long-Tooth-Boy disguises himself, enters the witch’s village, sees his father
    sitting by the witch, and returns to his brother.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:18
  text: The brothers create a dust storm at a gopher hill, enter the tipi where their
    father is confined, later cut off the sleeping witch’s head, and take their father
    away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:19
  text: At the end, the witch’s head is to be placed on a pole outside the lodge,
