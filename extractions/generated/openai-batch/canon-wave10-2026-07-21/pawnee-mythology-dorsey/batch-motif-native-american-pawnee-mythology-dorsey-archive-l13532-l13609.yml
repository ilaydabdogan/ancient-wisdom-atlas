canonical_text:
  quote: ''
  summary: Animals in a lodge transfer breath and power to a stone and to a strange
    man, instructing him in a Stone-Medicine-Lodge ceremony with altars, tobacco,
    gifts, songs, and sacred objects. The man returns to his camp, offers smoke to
    Father Sun and to the stone, gathers roots and herbs under mysterious animal power,
    is seen taking animal forms, and later asks his relatives for offerings before
    planning a medicine-man's lodge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The animals go one by one to a stone and blow their breath upon it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skunk says he knows lightning, gets power from it, can make rainbows in the
    night, and the Skunks give the man power to cleanse people from lightning shock.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the animals give their breath, they tell the man to take the stone,
    say heavenly power and animal power will accompany him, name the lodge the Stone-Medicine-Lodge,
    and give instructions for placing the stone, altars, and a dead Beaver.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man is taught medicine-men's sleight-of-hand power and songs, is told
    to bring tobacco, a black silk handkerchief, and a shell, and is given animal
    skins and downy feathers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man carries the stone home in feathers, sets it at the west side of his
    tipi, and hangs skins on tipi poles above it.
  category: setting
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: At sunrise on a high hill, the man offers his pipe to Father Sun, asks that
    what he has heard and seen be made true, says the heavens took his dead daughter,
    and asks for power to understand mysteries.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After returning home, the man sits by the stone and sacred things and gives
    smoke to the stone and to the things hung on the pole.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Swimming-Mound, the man disappears nearly every day and returns with roots
    and herbs, telling the people that the animals will take care of him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Women watching the man see him appear as a deer, then as a coyote, and then
    fly like an eagle while mysterious power guides him to herbs and roots.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: During the journey east, each night the man places the stone in the west,
    hangs the things on a pole, smokes, eats, and sings songs the women have not heard.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the village, the man tells male relatives what he experienced in the animals'
    lodge and what powers he received, asks for presents and native tobacco, and later
    says the animals received the presents and smoke.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The man asks his friends to help build a lodge that winter, and they agree
    to build a medicine-man's lodge.
  category: action
  evidence_refs:
  - ev:10
