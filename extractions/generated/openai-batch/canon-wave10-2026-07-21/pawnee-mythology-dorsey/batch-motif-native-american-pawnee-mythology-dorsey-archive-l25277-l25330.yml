canonical_text:
  quote: ''
  summary: An abstract recounts a girl marked at birth and associated with stars,
    rain prophecy, lightning, and a heaven-fallen stone. After her death or removal,
    her father receives dreams and visions from her and from the stone’s spirit, prepares
    the stone as a medicine bundle, fasts, and seeks power from animal beings at Swimming
    Mound.
  language: English
  quote_policy: summarized
