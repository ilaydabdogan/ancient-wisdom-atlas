canonical_text:
  quote: ''
  summary: The passage closes a Coyote etiological episode in which an insect's operation
    changes male anatomy and scattered pieces give rise to plums and berries. It then
    tells of hungry Skunks who deceive Beavers by feigning a young Skunk's illness,
    summon Beaver doctors, incapacitate them with the young Skunk's discharge, kill
    and eat them, and dispose of their remains in water. A note states that the story
    teaches children that Beavers are a medicine family but Skunks have greater power.
  language: English
  quote_policy: summarized
