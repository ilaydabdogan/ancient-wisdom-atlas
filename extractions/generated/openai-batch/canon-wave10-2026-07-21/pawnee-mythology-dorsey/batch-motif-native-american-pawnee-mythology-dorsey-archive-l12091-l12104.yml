canonical_text:
  quote: ''
  summary: A woman continues singing while a boy and the Witch-Woman dance. The Witch-Woman
    is about to kill the boy when men arrive, kill the old woman, and save him. She
    is burned in a fire, bursts open, and something flies to a tree; it is found to
    be a croaking tree frog. The boy reports that the Witch-Woman had killed a man
    and is now dead, and the people discover that she had turned into a tree frog.
    A source note states that the story warns hunters away from home not to stop at
    strange habitations.
