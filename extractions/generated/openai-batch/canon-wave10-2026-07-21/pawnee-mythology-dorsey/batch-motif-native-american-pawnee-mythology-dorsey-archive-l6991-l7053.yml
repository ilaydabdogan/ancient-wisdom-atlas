canonical_text:
  quote: ''
  summary: A girl and boy meet at night, travel south to a broad stream, and live
    alone in a grass-house and then an earth-lodge secured with a buffalo hide. The
    man hunts and provides meat while his wife becomes pregnant. After she requests
    buffalo milk bags, he hunts far away, returns during her labor, and she gives
    birth to a boy. The man buries the after-birth under a large elm tree. The child
    grows, and one day while the man is away hunting the woman hides the sleeping
    child under a robe when she hears strange voices outside the lodge speaking her
    language.
  language: English
  quote_policy: summarized
