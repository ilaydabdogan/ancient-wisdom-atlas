canonical_text:
  quote: ''
  summary: Woodpecker-Boy directs the chief and villagers to surround timber, where
    they repeatedly find roots and game. After each success he disappears or is seen
    again on an island. The chief seeks him and wants him as a son-in-law. A Bear-Man
    watches the boy, digs a hole at his lake crossing, traps him, and asks for his
    clothes before offering to pull him out.
  language: English
  quote_policy: summarized
