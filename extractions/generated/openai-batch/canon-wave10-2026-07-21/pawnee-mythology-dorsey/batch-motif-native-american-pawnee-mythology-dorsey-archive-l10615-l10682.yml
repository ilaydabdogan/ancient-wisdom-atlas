canonical_text:
  quote: ''
  summary: 'The excerpt preserves the end of one tale, where a vine bears a little
    squash called medicine and the Buffalo scatter over the land after Red-Spider-Woman
    is killed. It then begins “The Singing Buffalo Calf”: a buffalo calf dreams at
    night and sings warnings that people will surround and surprise the buffalo. The
    herd dismisses her warning, but by daylight people have surrounded them; they
    yell, the buffalo jump up, and the calf runs away. A footnote explains the calf’s
    warning as a lesson that children may perceive enemy approach or impending danger
    and should be heeded.'
  language: English
