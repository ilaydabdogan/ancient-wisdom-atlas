canonical_text:
  quote: ''
  summary: A chief's son first tries and fails to persuade a girl expected to marry
    him to lie with his poor friend. Later he gives the poor boy his clothing and
    wampum beads so the poor boy can meet the girl in disguise. The girl, thinking
    the poor boy is the chief's son, lies with him. The poor boy reveals his identity,
    says the chief's son has deceived her, asks her to be his wife, and proposes that
    they go south. She agrees because she fears village mockery. The poor boy gathers
    weapons and fire-making items, the girl gathers tools and a robe, and they travel
    south by night while resting by day.
  language: English
  quote_policy: summarized
