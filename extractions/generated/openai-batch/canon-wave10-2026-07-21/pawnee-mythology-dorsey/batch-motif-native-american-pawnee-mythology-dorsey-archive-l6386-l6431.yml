canonical_text:
  quote: '"I am not real."'
  summary: A girl associated with a grave and identified as a spirit repeatedly escapes
    from a young man who tries to hold her. Her uncles place meat on her grave and
    cry, preventing them from hearing the young man's calls. The girl says that if
    she gets away four times he will never see her again, but if her uncles hear and
    touch her she must stay. On the final attempt, the young man catches her by the
    hair as she jumps and remains in the air.
