canonical_text:
  quote: ''
  summary: A tipi is placed west of the woman's lodge. The woman takes her husband
    into it with her medicine bundle, opens the bundle, changes clothing, paints herself
    yellow and her husband red, places matching feathers in their hair, and sings
    a song to call the Bears for help. The Bears had instructed her to sing the song
    and promised that cedar limbs around the tipi the next morning would indicate
    their help. The song repeats that someone spoke, that beings shall come from yonder,
    and that the singer's father stood where the singer now stands.
  language: English
