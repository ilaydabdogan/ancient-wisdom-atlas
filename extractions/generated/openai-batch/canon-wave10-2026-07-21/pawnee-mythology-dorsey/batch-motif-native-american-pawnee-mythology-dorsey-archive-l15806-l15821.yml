canonical_text:
  quote: ''
  summary: Proud-Boy is among boys going out for a tree, and an unnamed girl, daughter
    of a leading Pitahauirat man, is among the girls. Proud-Boy notices her, but she
    does not notice him. Near the timber, young warriors are sent to find a suitable
    tree and report that an enemy is in the timber. An old warrior is chosen to defend
    the tree and hides in position to attack the enemy. A source note attributes the
    story to Overtaker, a Pitahauirat owner of the Buffalo ceremony, says possible
    Comanche elements may be present because of the narrator's contacts, but states
    the story is mainly Pitahauirat and teaches against stealing another man's wife.
  language: English
  quote_policy: summarized
