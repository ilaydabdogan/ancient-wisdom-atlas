canonical_text:
  quote: ''
  summary: The passage contains three Coyote tales. In the first, Coyote announces
    that buffalo have arrived, receives gifts, demands the chief's daughter, then
    reveals that what he saw in the valley were rosebuds rather than buffalo; the
    people catch and kill him. In the second, a speaking Artichoke repeatedly tells
    Coyote to bite it; Coyote eats it and suffers escalating bodily effects until
    his excrement washes him away. In the third, early Coyote people carry membrums
    around their waists; their leader inserts his into a noisy hole where an underground
    insect chews it apart, and he scatters the pieces so that plums, grapes, berries,
    and nuts will grow. Footnotes state didactic explanations for the artichoke and
    fruit-origin tales.
  language: English
  quote_policy: summarized
