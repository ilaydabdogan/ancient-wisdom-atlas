canonical_text:
  quote: ''
  summary: The passage first gives a fragment in which a mysterious being smokes with
    a man, claims control over animals and birds, gives him the Whistle dance, and
    teaches him the Sun dance ceremony. It then tells of a Kitkehahki girl gathering
    wood who sees an uncanny child in a hollow tree, becomes affected by fox-like
    behavior, and is treated by her medicine-man uncle through smoke, medicine, vomiting
    of white clay and fox hair, and extraction of hair from her body. A note states
    the story warns women to be careful of animals encountered away from home, especially
    in timber.
  language: English
  quote_policy: summarized
