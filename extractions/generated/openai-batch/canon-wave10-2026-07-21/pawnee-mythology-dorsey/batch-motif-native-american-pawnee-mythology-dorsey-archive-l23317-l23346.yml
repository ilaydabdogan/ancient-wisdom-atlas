canonical_text:
  quote: ''
  summary: An abstracted narrative describes four girls following a strange odor northward.
    One girl reaches a cedar-covered hill and rock-lodge, enters with a young man
    later associated with Long-Tongue, a fierce rolling skull, and receives instructions
    from Raven. She uses ticks, berries, tallow, sacred-bundle objects, and Raven's
    help to escape while Long-Tongue is delayed in pursuit. The supplied passage ends
    mid-action.
