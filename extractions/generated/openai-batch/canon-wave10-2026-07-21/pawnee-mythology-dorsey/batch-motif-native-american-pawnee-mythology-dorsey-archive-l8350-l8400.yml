canonical_text:
  quote: ''
  summary: A woman believed to be the young man's wife refuses treatment because a
    false skin covers her. Crow, a medicine-man from the west, arrives with black
    paint and a black gourd, directs water to be dipped westward, and helps reveal
    the hidden wife Young-Duck as a voice in the water. Crow exposes the old woman
    as a witch who killed the girl and threw her in the water. The community punishes
    the witch's children, and the young man turns into a hawk to search along the
    creek for his wife.
  language: English
  quote_policy: summarized
