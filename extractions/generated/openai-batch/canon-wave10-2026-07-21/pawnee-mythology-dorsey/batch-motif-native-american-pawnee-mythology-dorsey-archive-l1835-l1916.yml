canonical_text:
  quote: ''
  summary: Long-Tongue resumes pursuit of a fleeing girl after licking tallow. He
    threatens to kill her. The girl repeatedly drops or uses objects that produce
    stones, tallow, arrow-points, dogwood, dead buffalo, dead turkeys, and a gulch,
    causing Long-Tongue to stop or be impeded. Raven flies above and warns her. Long-Tongue
    is described as turning into a rattling, rolling skull whenever he runs.
  language: English
  quote_policy: summarized
