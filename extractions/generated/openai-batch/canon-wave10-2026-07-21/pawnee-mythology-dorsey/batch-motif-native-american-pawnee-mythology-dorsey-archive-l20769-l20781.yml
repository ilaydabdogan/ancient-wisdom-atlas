canonical_text:
  quote: ''
  summary: During a dance, a brave selected with Handsome-Boy as a leader rides among
    the dancers and recounts killing and scalping an enemy, which is met with shouting.
    Handsome-Boy then rides among the dancers and recounts that, after being left
    in bed while warriors went on the war-path, a woman came to his bedside at night,
    mocked him for not being a brave warrior, and prompted him to set out. He says
    he spent many years on the prairie, met an enemy, fought him, and killed him.
  language: English
