canonical_text:
  quote: ''
  summary: A woman prepares herself and a boy with objects from a medicine bundle,
    performs with him in a medicine-lodge and at a creek, and transforms gourds into
    feathers and ducks and back again. Her husband, a leading medicine-man and the
    boy's father, refuses to help, becomes jealous of their power, later takes the
    boy away during a buffalo hunt, shoots him, and throws him into a river.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman takes downy feathers, buffalo robes, and a ball of mud from a bundle;
    she spreads mud on herself and the boy and places a buffalo robe on the boy's
    shoulders.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman takes the boy by the hand to the medicine-lodge; when her husband
    sees them, he bows his head and says nothing.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the lodge, the woman and boy sit on the north side near the entrance, a
    place given by other medicine-men.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the procession, the woman sings about diving ducks, the boy imitates
    ducks, and they march outside in a circle four times before reentering the lodge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman says she wants to do her performance in the daytime at noon rather
    than at night.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman asks the medicine-men to help her and has them march to the creek,
    with herself and the boy in the lead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the creek, the woman holds two gourds under water; they become downy feathers,
    drift downstream, return upstream when she waves her hands, and become gourds
    again when pulled under water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boy releases the gourds under water, and they come up as two ducks; the
    ducks swim, return to the boy, and become gourds again when he catches them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The medicine-men try to mesmerize the woman, but the passage says she has
    too much power for them.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The boy's father is angry and jealous because he can do many things but cannot
    equal turning gourds into ducks.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: After people speak of the woman and boy as wonderful, the man remains angry
    with them.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: During a buffalo hunt, the father takes his son far from the other people,
    accuses him and his mother of outdoing him, shoots the boy in the side with a
    bow and arrow, throws him into the river, and goes home.
  category: action
  evidence_refs:
