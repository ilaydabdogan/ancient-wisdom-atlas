canonical_text:
  quote: ''
  summary: Scalped-Man teaches a wounded man deceptive sounds and sleight-of-hand,
    heals him with white clay, gives him a downy eagle feather empowered by breath,
    instructs him in ritual uses of feather, clay, spittle, and wild sage for speed
    and battle, demands secrecy about himself and his dwelling, and sends the man
    back to the cave where his people will find him.
  language: English
  quote_policy: summarized
