canonical_text:
  quote: ''
  summary: The passage concludes a tale in which Dragging-the-Stone uses hot buffalo
    tallow over a fire to burn a circle of people while escaping, but is caught on
    a sand bar and killed. A saying connects coyotes lying on sand bars with this
    failed deception. The next tale introduces Old Coyote-Man, who begs squirrels
    and beavers for food. The squirrels and beavers demonstrate food-producing tricks
    involving cutting his body and teach him limits on their use. At home Coyote-Man
    exceeds the limit taught by the squirrels; blood flows instead of pecans, and
    the squirrels heal him but take away the power. A source note says the story is
    told to children as a warning about tricky men.
  language: English
  quote_policy: summarized
