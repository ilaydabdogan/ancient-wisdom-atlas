canonical_text:
  quote: ''
  summary: 'In an ongoing contest between the boy’s side and White-Spot-on-Forehead’s
    side, smoke moves around a tree and the boy prepares to shoot his opponent. A
    further challenge is proposed: each contestant must drink all the water from a
    pond or be killed. The old bull helps the boy by giving him horns that suck up
    water. White-Spot-on-Forehead drinks and restores the pond; the boy uses the horns
    to make the pond dry. White-Spot-on-Forehead then asks for another chance and
    proposes a race. Seven runners are chosen on each side, and the race begins with
    White-Spot-on-Forehead’s side apparently in the lead while the boy is last.'
  language: English
  quote_policy: summarized
