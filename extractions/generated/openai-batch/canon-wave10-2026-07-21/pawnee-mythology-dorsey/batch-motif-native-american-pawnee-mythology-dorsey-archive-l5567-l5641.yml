canonical_text:
  quote: ''
  summary: A buffalo calf tells his human father how to identify him among similar
    calves. After the father succeeds, the Buffalo accept the man, who becomes a buffalo
    bull. The Buffalo send buffalo to the hungry village in exchange for ritual goods
    and smoke; the buffalo are killed and sacrificed to Tirawa. The man repeatedly
    brings buffalo to the village and is later unknowingly killed in buffalo form,
    his feathered hide revealing his former human identity. The next tale begins by
    introducing a solitary Witch-Woman who both cures and kills people by medicine
    thrown through the air.
  language: English
  quote_policy: summarized
