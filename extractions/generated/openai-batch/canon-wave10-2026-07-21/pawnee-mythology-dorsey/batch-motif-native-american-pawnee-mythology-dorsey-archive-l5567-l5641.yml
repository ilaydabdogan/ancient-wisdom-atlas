- id: obs:1
  text: The calf instructs the young man that he will be among many calves and will
    signal himself by winking and by a cockle burr over his eye.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Buffalo arrange about twelve young bull calves of the same size, height,
    and color, and the man identifies his son by the wink and burr.
