  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The young man asks his father and relatives to gather eagle feathers, native
    tobacco, blue beads, and clam shells.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The young man tells the people where to find the Buffalo, says they are to
    be killed and made holy, and says they came for smoke and as a sacrifice to Tirawa.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The people find the Buffalo in the ravine, surround them, kill them, and sacrifice
    most of them to Tirawa.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The young man takes the gathered goods to the Buffalo people, then repeatedly
