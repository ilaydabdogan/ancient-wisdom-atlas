  quote: ''
  summary: Eagles repeatedly surround a boy, cover him with down, and cause feathers
    to appear on his arms. After another circling, he is placed on the south side
    of the den and has become an Eagle according to his age. He cannot yet fly, stays
    in the den, eats meat brought by the Eagles with the other young Eagles, and is
    taught by the old Eagles the power he is to have.
