canonical_text:
  quote: ''
  summary: A narrative titled “How Medicine-Hat got its Name” tells of Eagle-Bull,
    who has run away with Badger-Woman, trying to trap eagles near Elk River. A mysterious
    bird-associated presence and dream-person interfere with the traps and demand
    a woman as food. Eagle-Bull refuses to kill Badger-Woman, kills a dog as substitute
    bait, then murders and butchers a starving Assiniboine and uses the flesh as bait.
    The eagles are then successfully caught, and the dream-person grants Eagle-Bull
    eagle-trap power and gives instructions for four days of trapping. Editorial notes
    connect the story to the place-name Medicine-Hat and to origins of eagle-trapping.
  language: English
  quote_policy: summarized
