canonical_text:
  quote: ''
  summary: The passage gives several Coyote episodes involving powerful or animate
    rocks. Coyote steals or takes beads and charms connected with rocks, ignores warnings
    about proper conduct or payment, is caught or pursued by rocks, and is sometimes
    rescued when animal helpers shout and break the rock. One episode explains scattered
    rocks in the Rocky Mountains as fragments of a broken pursuing rock.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: To'sa-ki'yacatsi is building a fire and shatters an approaching rock by striking
    it with an elbow that bears large bead medicine.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote kills To'sa-ki'yacatsi with a stone and steals the bead charm, putting
    it on his own arm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Coyote splits one rolling rock with the stolen charm but is crushed and killed
    by a larger rock before he can extend his elbow.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fox tells Coyote that beads come from a murmuring rock and warns that the
    rock must be paid or it will catch him in a trap.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Coyote takes beads without paying, returns repeatedly, and is caught by the
    rock in a trap.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After Coyote frees his toes and runs, the rock pursues him across a river,
    up a hill, down to level ground, and into deep water.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Snipe agrees to help Coyote after saying he has done wrong; when the rock
    strikes her, she shouts and the rock breaks into many little rocks scattered in
    the Rocky Mountains.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In another version, Fox warns Coyote about a large rock that opens and closes,
    but Coyote approaches, takes beads, is caught, and is freed when Fox tells the
    rock to open.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Coyote takes beads and a gun-sack from another boulder, dresses up, dances,
    defiles the rock, and says it can never track men; the rock then moves after him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A Ka'wi bird, a Crane, and a rattlesnake try to stand between Coyote and the
    pursuing rock, but the rock kills or crushes them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Night-hawk screams at the rock, causing it to break up, but Coyote is later
    crushed by another rock before he can say the same word.
  category: sequence
  evidence_refs:
  - ev:8
