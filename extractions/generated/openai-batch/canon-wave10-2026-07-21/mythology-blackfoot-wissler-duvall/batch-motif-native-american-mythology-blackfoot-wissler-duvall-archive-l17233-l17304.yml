canonical_text:
  quote: ''
  summary: 'The passage describes ceramic objects from the Terraba region and compares
    them with types known from the Chiriqui region: small decorated vessels associated
    with an alligator-design ware group, animal or bird-form whistles, relief-modeled
    animal vessels, four-node vessels, a pottery drum, and other jars or tripod vessels.
    It repeatedly notes similarities and limits of comparison, ending with a cautious
    suggestion of possible connection between the two culture areas pending further
    research.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first objects singled out are small vessels from the Terraba region said
    to correspond to the alligator group of ware from Chiriqui.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Terraba vessels have painted and raised conventional designs and raised
    animal figures, but the raised animal figures are not recognizable as alligator
    features.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The vessels are decorated in black and red on a light or dark cream-colored
    background and are small, with the largest only 9 cm in diameter.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A common object in this Chiriqui ware is a whistle in the form of an animal
    or bird, and one animal-form example is present in the Terraba collection.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Another specimen is an animal-shaped vessel with head, tail, and legs modeled
    in relief; it is similar to some Chiriqui pieces but lacks the finish of typical
    Chiriqui ware.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Three Terraba vessels have four nodes on the shoulder, and two have painted
    designs on the nodes, a stated characteristic of the Chiriqui group.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Terraba pottery drum is 17 cm high and 8 cm in diameter at the top, with
    an indented flaring rim, cylindrical stand with four raised bands, annular base,
    dull red ware, and black paint.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The drum rim is described as functional for securing a skin drumhead rather
    than as ornament.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The pottery drum has an open base and a hole where the upper part joins the
    cylindrical stand.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Clay drums are described as probably exceptional in Chiriqui, rare compared
    with other pottery forms, while small pottery whistles in the form of clay drums
    are not uncommon there.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Other Terraba forms include a large biscuit-ware jar and several tripod vessels,
    but the passage says their similarities to Costa Rican or Chiriquian forms are
    not strong enough for comparison at that time.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage ends by saying more data are needed and by cautiously suggesting
    a possible connection between the Terraba and Chiriqui culture areas.
  category: relationship
  evidence_refs:
  - ev:7
