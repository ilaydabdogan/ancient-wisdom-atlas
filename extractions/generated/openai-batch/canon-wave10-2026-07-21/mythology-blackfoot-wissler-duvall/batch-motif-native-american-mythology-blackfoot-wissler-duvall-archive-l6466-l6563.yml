canonical_text:
  quote: ''
  summary: The passage describes Whirlwind-Boy using painted buffalo bones and sweet-grass
    for buffalo-drive omens, then becoming a whirlwind and disappearing with his aged
    mother. It then gives the Bladder Story, in which a poor boy revives his dead
    mother with an inflated bladder, charcoal, paint, song, and four lodge shakings;
    cures warts with charcoal and song; and draws back an absent son-in-law through
    a sinew, paint, coal, and song ritual. Footnotes explain related practices, including
    a children's buffalo-bone test, snake and lizard or horned-toad navel-cord amulets,
    and a parallel sinew reference in Dakota myths. The passage begins The Water-Bull
    by describing a chief's daughter who disappears after bathing at a river and later
    appears from the water to children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Whirlwind-Boy paints one side of a right hind-leg buffalo bone yellow, throws
    it, and treats the yellow side landing upward as confirmation that buffalo will
    go down the drive and over the cliff.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Whirlwind-Boy also uses a bone, a stick, and a braid of sweet-grass; if the
    braid falls hanging on the stick, the buffalo are expected to go over the cliff.
    The note explains the hanging grass as symbolizing drying meat and plenty.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A footnote describes a children's game using buffalo foot bones to test whether
    girls or boys laugh, with different future character outcomes attached to laughing
    or not laughing.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: Whirlwind-Boy tells his aged mother that he wants to go away before she dies;
    after she asks him not to leave, he agrees to take her with him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Whirlwind-Boy calls the camp to watch, places his mother on a high cliff,
    becomes a whirlwind, and when the whirlwind reaches her, she disappears; neither
    is seen again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'A footnote says the story accounts for childcare practices using navel-cord
    amulets: a snake shape for boys and a lizard or horned-toad shape for girls, because
    those animals were said to be long-lived and not sick.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Bladder Story, a poor boy's mother is badly gored in the head by a
    buffalo and is dead or nearly dead, but the boy says she will come to life again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The boy inflates a bladder, puts it on his mother's head with charcoal, paints
    black spots on her and corresponding circles on himself, sings while beating time
    on a calf robe, and directs his uncle to shake the lodge four times.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the lodge is shaken four times, the bladder moves, the woman shakes
    her head four times, gets up, and is well again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The boy explains that when the bladder and charcoal are placed on something
    and the lodge is shaken, that object will move.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: A young man covered with warts asks the boy to cure him; the boy rubs charcoal
    over him, sings the same song, predicts the warts will disappear in three nights,
    and the cure succeeds.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: An old woman asks the boy to bring back her absent son-in-law; the boy uses
    buffalo sinew with attached muscle, yellow paint, a live coal, and a song, causing
    the sinew to contract and the distant man to feel drawn back.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The beginning of The Water-Bull says a rich chief's daughter associated with
    the water disappears after bathing at the river, and her father remains behind
    when the camp moves so he can look for her body when the water is low.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Children playing near the stream see the missing girl put her head out of
    the water and call to them to tell her father something; the quoted speech is
    cut off in the supplied passage.
  category: sequence
  evidence_refs:
  - ev:11
