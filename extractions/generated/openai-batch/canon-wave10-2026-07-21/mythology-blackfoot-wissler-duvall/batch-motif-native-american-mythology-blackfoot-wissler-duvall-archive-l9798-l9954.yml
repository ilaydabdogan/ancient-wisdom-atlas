canonical_text:
  quote: ''
  summary: The passage describes Shoshone and Lemhi games, especially the hand-game
    and dice-throwing, including equipment, play procedure, scoring, betting, songs,
    spectators, charms for success, regional variation in dice, and several athletic
    games such as races, kicking, wrestling, and putting the shot.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies dice-throwing and the hand-game as the most popular
    Shoshone games.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hand-game uses two small bones or sticks, one wound with sinew or string
    and one plain, hidden one in each hand under a blanket.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the hand-game, the hiding player exposes the hands, sings, moves the arms,
    and the opponent watches and points to the hand thought to contain the plain piece.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Correct and incorrect guesses determine whether play passes to the opponent
    or tally-sticks are surrendered; the game ends when one side has lost all counters.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A spectator may accompany the hand-game chant by striking tin with a stick,
    and spectators may join in arm-swinging and singing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports that beaver testicles and excrements were formerly used
    as charms to ensure success at the game.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: One Lemhi dice form uses four long, thin willow sticks with convex and flattened
    grooved sides, marked so that certain upward faces count points when thrown on
    a flat stone.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A second Lemhi dice type has a red-painted groove and different marks; players
    wager counters on achieving or surpassing point totals counted with tally-sticks.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says Fort Hall and Wind River dice markings and counting differ
    from Lemhi examples, and that a tray with bone dice reported by other observers
    was not known at Lemhi to old white residents.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Dice-throwing and the hand-game are described as the gambling games par excellence,
    with contemporary wagers sometimes reaching ten or fifteen dollars.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Foot-races and horse-races are described, including horse-races in which riders
    went around a stick marking the half-goal and returned to the starting point.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The kicking game involved mostly boys and young men trying to kick opponents'
    legs and bodies; it had no betting, no goal, and no winner, and is described as
    physical exercise.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Wrestling and putting the shot are named as favorite pastimes, with bets made
    on putting the shot.
  category: other
  evidence_refs:
  - ev:11
