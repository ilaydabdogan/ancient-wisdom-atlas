canonical_text:
  quote: ''
  summary: 'Ethnographic discussion of Shoshone mythology: reported lack of systematic
    cosmogony or migration legend; variable creator/father attributions to A''po,
    Wolf, or Coyote; Wolf as older benevolent brother and Coyote as younger trickster
    and culture hero; Coyote''s fire theft, obsidian flaking, procreation of Indians,
    taboo, and immortality; Dzo''avits ogres and other supernatural water, cannibal,
    and mountain beings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Shoshone mythology is characterized by the absence
    of a systematic cosmogony and migration legend, while some groups report southern
    origin or local origin.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A creator role is sometimes assigned to A'po, called the Father or Indians'
    Father, who is contrasted with Wi'hindaibo, Iron-Man, creator of the Whites, whom
    A'po conquers in a trial of strength.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some informants identify A'po with Wolf or Coyote.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Wolf is described as the older benevolent brother, and creation of the sun,
    moon, and animals for human benefit is sometimes credited to Wolf among the Lemhi.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Coyote is described as the younger figure who thwarts Wolf's designs and introduces
    strife, labor, and death into the world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Coyote is credited as culture hero, leader in the theft of fire, and associated
    with the flaking of obsidian.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A myth is reported in which Coyote procreates all Indians, and the Shoshone
    become his special proteges because he washed them as newborn infants.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Many Lemhi are said not to kill coyotes, and the passage reports a strong
    belief that Coyote is immortal and rises again after being killed.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: The Dzo'avits are described as a race of gigantic ogres dwelling in stone
    houses; arrows shot at a sleeping Dzo'avits break instead of waking him.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Individual Dzo'avits are overcome by the Weasel brothers or other Indians,
    and the whole tribe is said to be destroyed either by a bird-caused conflagration
    or by the magic of Weasel-woman's uncle.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Pa'-n-dzo'avits is described as a water-dwelling giant with enormous hands
    and feet who sleeps on rocks in the water and dives away when Indians approach.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: In one myth, Pa'-n-dzo'avits rises from the water and climbs a tree after
    twin heroes until Pabi'hiano, the Water-youths, throw him back.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The water-buffalo swallows one of the twins and is shot by the other twin.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Pa'ona, or water-baby, is not seen by Indians but is heard crying at night.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage reports anthropomorphic cannibals called no'mori'ka and states
    that some Indians still believe in their existence.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: Nu'-numbi is described as a very small but strong mountain figure who shoots
