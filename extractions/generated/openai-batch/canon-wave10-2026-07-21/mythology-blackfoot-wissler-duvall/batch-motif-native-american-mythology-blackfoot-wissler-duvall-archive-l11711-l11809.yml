comparison_claims:
- id: claim:1
  claim: The passage supports a cautious comparison between Shoshone and Bannock creator/father
    attributions involving Wolf and Coyote.
  claim_level: same_function
  target: Bannock and Shoshone Wolf/Coyote creator or father roles
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is based on reported attributions summarized from Clark
    and informants; it does not provide full parallel myths.
- id: claim:2
  claim: The passage contrasts a Lemhi pattern of older benevolent Wolf and younger
    disruptive Coyote with a Ute pattern in which the elder figure is the marplot
    and the younger is the benefactor.
  claim_level: same_motif
  target: Ute Cin-au'-ao elder/younger sibling-pair pattern
  evidence_refs:
  - ev:2
  counter_evidence_refs:
  - ev:2
  confidence: medium
  limitations: The roles are explicitly reversed, and the Hare is not similarly important
    among the Lemhi.
- id: claim:3
  claim: The passage states that some Coyote tales are partly shared with neighboring
    tribes and present typical trickster features.
  claim_level: same_function
  target: Neighboring tribes' trickster-cycle pattern
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: No specific neighboring tribe or individual tale is identified in this
    excerpt.
- id: claim:4
  claim: The passage indicates a relationship between Dzo'avits traditions and Powell's
    account of Dzo'avits as a witch transformed into echo, but the forms differ.
  claim_level: same_motif
  target: Powell's Dzo'avits transformed-into-echo account
