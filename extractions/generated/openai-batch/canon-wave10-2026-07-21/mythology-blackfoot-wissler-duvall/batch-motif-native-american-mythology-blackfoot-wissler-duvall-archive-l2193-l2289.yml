canonical_text:
  quote: ''
  summary: A Blackfoot star myth begins with Smart-Crow receiving a dream warning
    from a Crow about future twin sons and a dangerous visitor. While Smart-Crow is
    away, the visitor enters the lodge, rejects many vessels for food, accepts the
    pregnant woman's belly as the serving place, cuts her open with a white stone
    knife, and removes twin boys. He names one Ashes-Chief and the other Stuck-Behind.
    Smart-Crow returns, finds the infants and his wife's body, pursues the stranger,
    and hears the stranger promise restoration through a medicine song. The stranger
    gives Smart-Crow a lodge and running-fisher skin, and sets up a lodge with four
    buffalo tails. A note links the story with the Origin of the Four-Tail Lodge and
    with Dusty-Stars or Puff-Balls, including a Blackfoot association between fungi
    and fallen stars.
  language: English
  quote_policy: summarized
