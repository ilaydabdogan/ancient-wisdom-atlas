- id: obs:6
  text: The Cree dance was said to have been introduced at Lemhi and Fort Hall by
    the Cree about eight years earlier and to have become popular.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Cree dance, a woman approached a seated man or drummer and tried to
    pull him up; after reluctance he joined her, placed an arm or hand on her, and
    the pair moved clockwise around the central fireplace.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the end of the song, men released their partners and received a coin; at
    the next dance the man was expected to invite the former partner and return twice
    the amount.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: On exceptional occasions, including visits from friendly tribes, gifts such
