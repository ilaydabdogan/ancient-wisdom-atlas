- id: obs:2
  text: 'At the time of the visit, the Lemhi Shoshone practiced two dances: the ta''cayuge
    or war-dance, and the a''nonokakin or Cree dance, also called kwapakin or hugging-dance.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A decision to hold a dance was made early in the day, news spread over the
    reservation, and drummers gathered at sunset on the dance-ground.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The drummers suspended a large drum from four willow sticks fixed in the ground
