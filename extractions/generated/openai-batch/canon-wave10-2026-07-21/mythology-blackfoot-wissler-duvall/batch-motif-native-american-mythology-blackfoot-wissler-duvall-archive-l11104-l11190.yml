canonical_text:
  quote: ''
  summary: The passage describes Lemhi Shoshone dance practices observed or reported
    by the writer, especially the ta'cayuge war-dance and the a'nonokakin or Cree
    hugging-dance. It records how dances were announced, the drumming and dance grounds,
    the central fire and willow structures, the partner-selection and reciprocal payments
    of the Cree dance, the social/night character of the performance, and the movements,
    dress, scars, weapons, and comparative resemblances of the war-dance.
  language: English
  quote_policy: summarized
