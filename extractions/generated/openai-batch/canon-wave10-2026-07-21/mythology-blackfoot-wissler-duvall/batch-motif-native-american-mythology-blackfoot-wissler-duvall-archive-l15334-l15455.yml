canonical_text:
  quote: ''
  summary: A boy retrieves a lost ring from the sea with help from fish after throwing
    gold into the water; an old fish returns the ring in exchange for a golden skin,
    and the Chief leaves his people. A colt then asks its owner to return it to the
    place where it was found. In the following tale, Bear's son, mistreated by White
    schoolchildren, obtains an iron rod and kills them. He travels with three powerful
    companions. At a creek-side house, Iron-Head-Man repeatedly assaults the companions
    while they cook, but Bear defeats him and follows his head to a hole. The companions
    fail to descend, while Bear descends, kills three men underground, and sends up
    their wives. The companions seize the women, cut the rope, and leave Bear below.
    Bear is healed by his older brother, rides an eagle upward while feeding it sheep
    and his own flesh, and later fails to recover the stolen wives.
  language: English
  quote_policy: summarized
