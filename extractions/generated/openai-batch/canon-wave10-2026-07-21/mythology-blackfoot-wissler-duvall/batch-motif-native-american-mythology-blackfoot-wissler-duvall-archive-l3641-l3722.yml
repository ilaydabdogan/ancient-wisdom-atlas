canonical_text:
  quote: ''
  summary: A little sister carrying her little brother warns six older brothers that
    their elder sister has become a bear and killed many people. The siblings flee
    after a planned escape. The elder sister, as a bear, pursues them through magical
    obstacles, kills four brothers at a tree, and is then shot in the head after a
    bird’s warning. The little brother revives the dead brothers by shooting arrows
    upward. The siblings decide to live in the sky and become the North Star and the
    stars of the Great Dipper/Ursa Major.
  language: English
  quote_policy: summarized
