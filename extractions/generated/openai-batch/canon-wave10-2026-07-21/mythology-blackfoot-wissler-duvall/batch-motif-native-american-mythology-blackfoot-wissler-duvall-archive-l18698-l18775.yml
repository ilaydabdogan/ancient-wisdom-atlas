canonical_text:
  quote: ''
  summary: The passage gives museum-style notes on basketry, Andamanese objects and
    customs, and archaeological stone implements from India and China. It describes
    baskets used by chiefs and Kachins, Andamanese hunting and fishing equipment,
    skulls and jaws worn as tokens for lost relatives, a human-bone fetish worn by
    friends of a sick person, and several cross-regional similarities among stone
    implements.
  language: English
  quote_policy: summarized
