canonical_text:
  quote: ''
  summary: The passage describes Shoshone and Lemhi decorative art on parfleches,
    moccasins, and other objects. It records interpretations of some designs as mountains,
    rivers, trees, lakes, lodges, sunlight, horned-toad, and exchange, then summarizes
    Kroeber’s typology and distribution of moccasin patterns and compares Shoshone
    and Lemhi styles with Ute, Gros Ventres, Blackfoot, and Sioux patterns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Shoshone are described as painting parfleches, rawhide envelopes, and
    scabbards, and embroidering leggings, moccasins, soft bags, and pouches with quill
    and beadwork.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some decorative designs recorded at Wind River were interpreted as geographical
    features such as hills, creeks, or roads.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: On one parfleche, obtuse triangles represent mountains, a red central line
    represents a river, and right-angled triangles represent tipis.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: On a second parfleche, a green central rectangle represents trees, a red frame
    represents ground, blue diamond halves represent a lake, and a yellow transverse
    line represents an inlet.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Other elements on the second parfleche are identified as mountains, timber
    on mountains, the sun shining on mountains, grass, ground, lodges, and sunlight.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'Some non-geographical interpretations are recorded: prongs as rays of the
    sun, two perpendicular stripes on a moccasin as the horned-toad, and a cross as
    the idea of exchange.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: At Lemhi, attempts to obtain design interpretations mostly failed; one term
    for a parfleche design was found to mean only “corners.”
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'Kroeber distinguishes three main types of moccasin decoration: stripe-border,
    a single geometric pattern covering the front, and a central figure such as a
    crossing angle, circle, U-figure, or transverse zigzag.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Kroeber states that the Ute highly develop the stripe-border pattern, while
    the Shoshone rarely employ it and are characterized by round-head and angle-across
    forms.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'For the Lemhi, three popular styles are described: a circular design, the
    Blackfoot U-pattern, and a longitudinal stripe perpendicular to a horizontal bar
    with possible triangular extensions.'
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says Lemhi evidence revises Kroeber’s tribal relationship scheme
    for moccasin decoration by linking Shoshone forms with Gros Ventres, Blackfoot,
    and Ute patterns in different respects.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Ute and Shoshone embroidered designs are said to share spreading, forked,
    pronged, diamond, triangle, and slanting bar designs, though the Shoshone are
    also said to lack several characteristic Blackfoot and Sioux-related patterns.
  category: relationship
  evidence_refs:
  - ev:12
  - ev:13
