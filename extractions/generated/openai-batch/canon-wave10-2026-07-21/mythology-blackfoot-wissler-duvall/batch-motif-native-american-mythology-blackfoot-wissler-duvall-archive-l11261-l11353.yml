canonical_text:
  quote: ''
  summary: The passage describes accounts of obtaining supernatural power through
    dreams, visions, mountain vigils, medicines, and tutelary helpers. It describes
    medicines that counsel, heal, protect, or harm; dream-based animal friendships
    and immunities; loss of a helper through disobedience; death and return foretold
    by the Sun; and a medicine-man receiving talon and claw tokens from eagle, bear,
    and badger.
  language: English
  quote_policy: summarized
