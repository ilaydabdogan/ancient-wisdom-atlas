  summary: The passage describes dancers' costumes, borrowed paraphernalia, individual
    variation in dress and paint, and a comparative note on Wind River Shoshone body-painting
    in which animal figures, tracks, rainbow lines, kill marks, and painted hands
    carry stated meanings.
  language: English
