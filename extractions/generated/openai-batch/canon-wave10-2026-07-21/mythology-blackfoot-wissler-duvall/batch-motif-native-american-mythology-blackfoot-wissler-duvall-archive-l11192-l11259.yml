literal_observations:
- id: obs:1
  text: The passage states that there were no definite costume rules; performers borrowed
    paraphernalia, producing varied appearances.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some performers wore wigs or porcupine head-dresses, and some carried eagle-feather
    fans with little bells attached.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A war-dancer wore a rattle and eagle-bone whistle derived from Fort Hall Shoshone
    sun-dance regalia, without awareness of their original ceremonial significance.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: One well-dressed dancer wore beaded moccasins, beadworked leggings, a zigzag-decorated
    breechclout, a linen shirt, an embroidered vest with an identifiable sunflower,
    a porcupine head-dress with two tall eagle feathers, and leg-bands with bells.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chief's favorite son wore a Prairie bonnet without a tail, with tall feathers,
    reddish-yellow horsehair, small mirrors, bells, beadwork, weaselskin strips, ribbons,
    and additional beaded and belled garments.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Another dancer wore beaded moccasins, otter-skin anklets, a beaded girdle,
    a red shirt, and a porcupine head-dress; his belt held an eagle-bone and a wooden
    staff ending in a bird head and a pebble-filled buckskin rattle.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some dancers wore necklaces of small bone discs strung on parallel thongs.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The chief's son used yellow, red, dark-brown, and blue paint on his face,
    hair, thighs, and lower legs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Other dancers used white clay, red paint, yellow patches or lines, blue circles,
    and circular yellow patches; informants said selection of both paint and costume
    was purely individual choice.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Wind River Shoshone body-painting is described as more complex, including
    bear or snake figures for medicine, a buffalo figure on a sun-dancer, horse-track
    shapes, rainbow lines, marks for people killed, and painted hands for hand-to-hand
    encounters.
  category: relationship
  evidence_refs:
  - ev:7
