canonical_text:
  quote: ''
  summary: 'The passage includes an introductory note on ritual knowledge and elder
    authority, followed by three Old Man tales: earth is made after a flood through
    animal diving, languages are differentiated by colored waters on a mountain, and
    Old Man and Old Woman decide human work, anatomy, reproduction, and permanent
    death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women are described as taking important parts in most ritualistic ceremonies,
    and young people are said to hesitate to narrate myths out of deference to elders.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: During a flood, Old Man sits on the highest mountain with all the beasts.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The flood is attributed to the above-people after the baby, glossed as a fungus,
    of the woman who married a star was torn in pieces by an Indian child.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Old Man sends Otter, Beaver, Muskrat, and then Duck to dive for earth; the
    first three return drowned without earth, while Duck returns drowned holding some
    earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Old Man takes the earth, feigns placing it on the water three times, then
    drops it; afterward the above-people send rain and everything grows on the earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the flood, Old Man mixes water with different colors, whistles people
    together, and gives differently colored water to different men and groups.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Blackfoot, Piegan, and Blood receive black water, and those who drink
    black water speak the same language while others speak differently.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The language event is located on the highest mountain in the Montana Reservation,
    with Chief Mountain suggested in brackets.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Old Man and Old Woman are described as the only two persons in the world,
    and they agree that Old Man will have the first say and Old Woman the second say.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Old Man and Old Woman decide features of human life including hide tanning
    labor, the placement of eyes and mouth, the number of fingers and thumbs, and
    the position of the genitals.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Old Man proposes that a floating buffalo-chip would mean people die for four
    days and live again, while a sinking chip would mean permanent death.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Old Woman rejects that decision method and throws a rock into the water; when
    it sinks, she says people should die forever so that sympathy will exist.
  category: action
  evidence_refs:
  - ev:8
