canonical_text:
  quote: ''
  summary: A disputed marriage contest is resolved by wolf-traps, which Beaver wins.
    The eldest daughter rejects Beaver because of his filthy bodily condition and
    goes to Crow-Arrow, while the youngest daughter accepts and cares for him. During
    a meat shortage Beaver transforms by painting himself, reveals a fine lodge and
    gifts, rejuvenates his grandmother, rewards his wife, and directs a buffalo drive
    involving a white buffalo and a beaver-colored buffalo. Crow-Arrow attempts to
    fake success with spoiled meat and later shoots the beaver-colored buffalo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'After a dispute over who killed the bird, the chief sets a new test: young
    men are to set wolf-traps, and whoever catches a black wolf or a white wolf will
    become his son-in-law.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Beaver asks his grandmother to make a wolf-trap; she objects but sets one
    near the lodge, and in the morning both a black wolf and a white wolf are in Beaver's
    trap.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Crow-Arrow catches a black wolf, but the chief accepts Beaver's two wolves
    as decisive and declares the little dirty boy his son-in-law.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The eldest daughter is taken to Beaver's lodge, but she is disgusted by his
    dirty eyes, large abdomen, and repeated soiling of the bed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The eldest daughter leaves Beaver and goes to live with Crow-Arrow; the chief
    is angry because he believes Beaver has power and his daughter should have kept
    the promise.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief sends his youngest daughter to Beaver; she says Beaver is pretty
    and nice, stays with him, and cleans the bed cheerfully and kindly.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: During a time without meat, Beaver sends his wife to her mother and sends
    his grandmother away so that he can be alone in the lodge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Alone, Beaver mixes yellow paint with water, paints his body and hair, and
    becomes a man; the Four-Tail Lodge of his father stands before him with clothing,
    beds, and furniture.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Beaver gives his grandmother a fine dress covered with elk-teeth, and when
    she puts it on she becomes a young woman again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Beaver gives his wife a fine elk-tooth dress, applies paint to her hair, and
    gently pulls it until it becomes very long.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Beaver sends his wife to tell her father that he will drive buffalo into an
    enclosure and that a white buffalo must be roped and killed without damaging the
    skin, because it is to become a robe.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: For the buffalo drive, Beaver places a white rock on one side and a beaver-colored
    rock on the other, directs rows of rocks and buffalo-chips to be laid out, shouts
    four times, and a herd appears led by a white buffalo and a beaver-colored buffalo.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Crow-Arrow cuts spoiled meat from an old buffalo carcass to make the chief
    believe he has first secured meat, then runs to the drive and shoots the beaver-colored
    buffalo while the white buffalo is already roped.
  category: sequence
  evidence_refs:
  - ev:11
