canonical_text:
  quote: ''
  summary: 'The extract contains several Coyote-related episodes: Fox wins a race
    and withholds food from Coyote; a poor boy kills a fox, marries into Eagle''s
    family, is robbed by Coyote at a buffalo-hole, and is restored when his bird returns
    to him; Coyote changes into a baby in a boat, is adopted by women, removes a dam
    blocking salmon, eats salmon, has his nose altered by wolves, and retaliates by
    altering their noses; Coyote cures and marries an abandoned chief''s daughter,
    then explains wife-stealing after his wife is stolen; Coyote mocks an old buffalo,
    reconciles through pipe-smoking, gives him horns, and helps pursue his enemies.'
  language: English
  quote_policy: summarized
