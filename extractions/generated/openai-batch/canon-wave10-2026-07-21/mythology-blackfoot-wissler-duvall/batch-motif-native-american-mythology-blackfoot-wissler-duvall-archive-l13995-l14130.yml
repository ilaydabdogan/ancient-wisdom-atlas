- id: obs:4
  text: The grandson slept with Eagle's older daughter, was expelled, went away crying,
    found a blanket, red paint, beads, and an otter-skin sash, grew bigger, returned,
    and married Eagle's younger daughter.
  category: sequence
  evidence_refs:
  - ev:2
