    a stone to free his head.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Old women ask Old Man to get meat; he scatters hair from his robe and makes
    bloody snow by rubbing his buttocks on it, then tells the women he has killed
    something so they leave their babies in cradles.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: While the women are gone, Old Man cuts off the babies' heads, puts their bodies
