canonical_text:
  quote: ''
  summary: 'The passage gives several Old Man episodes: fiery leggings alarm a Piegan
    camp; Old Man provokes a bear and scares it with a buffalo horn; he enters an
    elk skull to join dancing mice, sleeps despite warning, loses his hair, and is
    freed by people; he deceives old women, kills and cooks their babies, escapes
    through holes, disguises himself, and suffocates the women with smoke; the next
    episode begins with Old Man soiling a sleeping girl''s dress and demanding payment
    to remove it.'
  language: English
  quote_policy: summarized
