  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Old Man sleeps with his head in the skull; the mice chew off his hair, and
    afterward he cannot remove the skull from his head.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Old Man swims in a river with the antlers above the water and imitates an
