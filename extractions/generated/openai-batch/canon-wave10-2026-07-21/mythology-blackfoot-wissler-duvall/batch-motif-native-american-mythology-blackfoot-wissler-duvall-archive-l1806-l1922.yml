- id: obs:3
  text: Old Man and the bear run around a large tree until a deep trail is worn and
    a buffalo horn is uncovered; Old Man places the horn on his forehead, charges
    the bear, and the bear flees while defecating on him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Inside an elk skull on the ground, white mice are dancing; Old Man wants to
    join them.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The mice tell Old Man he is too large to enter but may put in his head and
