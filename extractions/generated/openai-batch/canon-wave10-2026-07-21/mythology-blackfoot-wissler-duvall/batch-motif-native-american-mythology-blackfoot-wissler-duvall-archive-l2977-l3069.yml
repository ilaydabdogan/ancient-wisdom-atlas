canonical_text:
  quote: ''
  summary: 'Blood-Clot travels through several dangerous encounters: he enters a snake-lodge,
    kills the head snake and other snakes while sparing a pregnant snake, frees stored
    food for the people, is swallowed by a sucker-fish and releases people from its
    belly by dancing and cutting its heart and ribs, defeats a wrestling woman with
    hidden knives, defeats a swinging woman at a swift stream, and returns to his
    old father and mother saying he has rid the world of monsters.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Blood-Clot announces that he must travel, enters a lodge of old women, asks
    for meat and fat, and is warned that a nearby snake-lodge is dangerous and takes
    everything.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The snake-lodge contains a head snake with one horn, lying asleep with his
    head in the lap of a beautiful woman; berry soup is placed by the fire for him.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Blood-Clot drinks the berry soup, ignores the woman's whispered warning to
    leave, asks to smoke, and cuts off the head snake's head with a white rock knife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Blood-Clot kills the snakes in the lodge but spares one pregnant snake; the
    passage states that all snakes in the world descended from her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The snake-lodge is full of dried meat, fat, and other provisions, which Blood-Clot
    turns over to the people along with the lodge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: After warnings to keep to the south side of the road, Blood-Clot ignores the
    advice and is carried by a windstorm into the mouth and stomach of a great sucker-fish.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Inside the fish's stomach, Blood-Clot sees many people, some dead and some
    still alive, and proposes that they hold a dance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Blood-Clot paints his face, ties a white rock knife to his head, participates
    in a dance with hoof rattles, cuts down the fish's heart, cuts through its ribs,
    and lets the people out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A note in the source says this episode is regarded as the origin of a ceremony
    called the dance of the spirits of the dead or ghost dance, and connects the shining
    knife with the name Smoking-Star.
  category: other
  evidence_refs:
  - ev:3
- id: obs:10
  text: Blood-Clot is warned about a woman who challenges people to wrestle; he discovers
    hidden knives in the ground, then throws the woman onto them and cuts her in two.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Blood-Clot is warned about a woman with a swing beside a swift stream; he
    observes that she drops people into the water, then cuts the vine while she is
    swinging and lets her fall into the stream.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Blood-Clot says he has rid the world of all the monsters, climbs a high ridge,
    and returns to the lodge of his old father and mother.
  category: sequence
  evidence_refs:
  - ev:6
