candidate_motifs:
- id: motif:1
  label: recovery of a dead relative's scalp followed by revival
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Coyote retrieves Wolf's scalp from the enemy dance, places it where Wolf
    rested, and Wolf later speaks and is alive again.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage does not explicitly state the mechanism by which the returned
    scalp causes revival; the sequence supports but does not explain the connection.
- id: motif:2
  label: disguise by wearing another person's skin
  taxonomy_refs:
  - trickster_boundary
  basis: Coyote kills an old woman, wears her skin, imitates her gait, and thereby
    approaches the enemy dancers.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: This is a disguise episode rather than an explicit bodily transformation.
- id: motif:3
  label: theft of fire from another people
  taxonomy_refs:
  - sacred_theft
  - fire
  basis: Coyote learns another people own fire, devises a plan, obtains fire during
    a dance, hides it, and his party runs away with it.
  evidence_refs:
  - ev:5
  - ev:10
  - ev:11
  - ev:14
  confidence: high
  cautions: The passage frames the act as stealing from Crane's people; it does not
    provide an explicit ritual or theological interpretation of the fire.
- id: motif:4
  label: culture-bringing acquisition of first-seen fire
  taxonomy_refs:
  - culture_hero
