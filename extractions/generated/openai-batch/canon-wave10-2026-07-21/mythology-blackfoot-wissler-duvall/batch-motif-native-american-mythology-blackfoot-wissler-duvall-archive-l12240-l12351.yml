- id: obs:3
  text: The enemy are conducting a scalp-dance around a pole with Wolf's scalp; Coyote
    receives the scalp during the dance and runs away with it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At home Coyote places the scalp where Wolf usually lay down; after a period
    of lamenting and neglecting the fire, Wolf calls to Coyote and is alive again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Coyote sees fire below while outside at night, asks his anus about it, and
