canonical_text:
  quote: ''
  summary: Coyote laments Wolf's death, tracks the enemy by their campfires, kills
    and skins an old woman to disguise himself, enters the enemy camp, and escapes
    with Wolf's scalp from a scalp-dance. Back home he places the scalp where Wolf
    used to lie; later Wolf revives and orders him to make a fire. In a subsequent
    fire-theft episode, Coyote sees fire below the mountain, learns from his anus
    and excrements that another people led by Crane possess it, leads a party to visit
    them, endures insulting food, uses dance and disguise-like conduct to obtain fire,
    and with Jack-rabbit's flute and the woodpeckers' help steals pine-nut food from
    a tree-hung bag before fleeing with the fire and food.
  language: English
  quote_policy: summarized
