canonical_text:
  quote: ''
  summary: The passage is an introductory classification of Blackfoot myth groups.
    It notes myths explaining ceremonial ritual origins, often through a hero or through
    women who mediate ritual or power after relations with a male being. It then describes
    origin and transformation narratives, miscellaneous tales with Plains, Eastern,
    and Kutenai connections, ethical puzzle narratives, the Medicine-Hat tale’s eagle-trapping
    etiology, and Old Man tales told to children as lullabies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says a hero appears and transfers a ritual, and links this to
    the tendency to assign mythical origins to important ceremonial practices.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women are described as frequently playing important roles in transferring
    rituals and other powers, with examples including Elk-Woman, Otter-Woman, Woman-who-Married-the-Buffalo,
    and Woman-who brought-the-Pipe.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that, in almost every such case, the woman has sexual relations
    with a male being from whom, or by virtue of whom, the ritual or power comes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The grant of ritual or power is often said to appease a wronged husband or
    parents.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The authors caution that the pattern may be a conventional mode of constructing
    a myth based on human interest in love passion.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage defines cultural and other origin myths as narratives accounting
    for conditions in humanity and nature, and for folk-practices.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: In this group, origins and transformations are described as primary rather
    than secondary parts of the narratives.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says this origin-myth group lacks correspondence to Plains mythology
    in most cases, seems relatively original with the Blackfoot, and contains suggestions
