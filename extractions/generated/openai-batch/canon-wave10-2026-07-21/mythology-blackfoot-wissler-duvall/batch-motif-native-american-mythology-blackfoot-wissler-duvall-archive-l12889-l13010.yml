canonical_text:
  quote: ''
  summary: 'Fragmentary opening: Bear crosses a river on Blue-Bald-Head''s outstretched
    legs, falls into the water when he withdraws them, floats for a month, and emerges
    without hair. Main tale: Weasel''s brother is eaten by the giant Dzo''avits; Weasel
    and his wife deceive Dzo''avits in their lodge, kill and dismember him, and separate.
    Dzo''avits'' giant brothers, including the miracle-worker pair Da''dapekono, set
    out toward the remains.'
  language: English with some Latin passages
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bear asks Blue-Bald-Head to let her cross the river; he stretches out his
    legs, she crosses, strikes his knee with her cup while drinking, and he pulls
    up his legs so that Bear falls into the water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bear floats for a month and comes out where her cubs had been killed; she
    sees that all the hair has come off her body.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Weasel and his brother live and hunt together until Dzo'avits catches and
    devours Weasel's brother; Weasel mourns and cries through the night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Weasel finds his brother's cut-up body hanging in Dzo'avits' tent, returns
    home, and gives his wife instructions about refusing Dzo'avits' food, preparing
    adulterated food and drink, sending him for wood, and keeping the obsidian knife
    at home.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dzo'avits comes to Weasel's lodge with a sagebrush-bark bag containing the
    dead brother's flesh, enters, sleeps, and asks to feed Weasel's crying child;
    Weasel's wife refuses.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Weasel's wife sends Dzo'avits to gather firewood; the sagebrushes call out
    to be chosen, causing him to run about and remain away a long time.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: While Dzo'avits is away, Weasel waits on top of the wikiup; when Dzo'avits
    returns, Weasel's wife serves him a jack-rabbit mixed with waste, and again refuses
    to let him feed the crying child.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Weasel seizes Dzo'avits by the hair from the roof, lifts him over the fire,
    and calls for the obsidian knife; Dzo'avits is mutilated and killed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Dzo'avits' brothers hear the noise made when severed parts are thrown out
    and believe it is their brother's signal that he has killed game.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Weasels cut Dzo'avits' body into small pieces, hang the pieces on a tree,
    and bury his head in the ground.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Weasel tells his wife she may go to her family or elsewhere; he says he will
    run around the mountains and turn into a weasel, while she uses a magical cane
    to vault to her uncle's lodge.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The giant brothers decide to visit Dzo'avits and join his feast; two miracle-workers
    called Da'dapekono are delayed when one moccasin of each is hidden, but later
    obtain ground-hog skin moccasins and outdistance the others.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Da'dapekono arrive at the tree where Dzo'avits' flesh hangs and eat specific
    organs; the passage explains a name for them as eaters of those organs.
  category: sequence
  evidence_refs:
  - ev:10
