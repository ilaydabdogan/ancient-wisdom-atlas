canonical_text:
  quote: ''
  summary: Coyote visits several brothers-in-law for food and attempts to reciprocate
    by copying their food-producing methods, often unsuccessfully or harmfully. Hosts
    include Owl, Wido'tc, Jack-rabbit, Beaver, Otter, and Deer. Coyote later kills
    Deer deceitfully to eat his flesh. A following tale begins with Porcupine tracking
    buffalo, persuading a fat buffalo to carry him across water by letting him crawl
    into its rectum, and killing the buffalo from inside; Coyote overhears Porcupine
    speaking about skinning the buffalo.
  language: English
  quote_policy: summarized
