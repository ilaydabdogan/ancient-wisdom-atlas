candidate_motifs:
- id: motif:1
  label: reciprocal hospitality meal with failed imitation
  taxonomy_refs:
  - sacred_exchange
  - trickster_boundary
  basis: Coyote is repeatedly fed by brothers-in-law and then attempts to reproduce
    their acts when they come to eat, often producing refusal or failure.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage presents recurring hospitality and imitation, but it does
    not name the exchange as sacred or explicitly frame it as a ritual category.
- id: motif:2
  label: host offers own flesh or kin as food
  taxonomy_refs:
  - sacrifice
  basis: Owl and Deer provide parts of their own bodies, and Beaver kills his sons
    as food for Coyote; Coyote imitates these acts with his own body or sons.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:6
  confidence: medium
  cautions: The text reports killing and self-wounding for food, but does not explicitly
    interpret these as ritual sacrifice.
- id: motif:3
  label: trickster's harmful imitation
  taxonomy_refs:
  - trickster_boundary
  basis: Coyote repeatedly copies others' food-making methods but produces inferior,
    rejected, empty, or destructive results.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The label uses Coyote's widely recognizable trickster function, but the
    extraction is based on actions in this passage rather than an explicit passage
    label.
- id: motif:4
  label: deceptive killing to obtain flesh
  taxonomy_refs:
  - trickster_boundary
  basis: Coyote wants all of Deer's flesh, secretly kills him during a dance, directs
    relatives to put the corpse in water, then retrieves and eats it with his son.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No broader comparative claim is implied beyond the passage's pattern of
    deception and flesh-taking.
- id: motif:5
  label: killing prey from inside its body
  taxonomy_refs:
  - trickster_boundary
  basis: Porcupine enters the fat buffalo's rectum as a means of being carried across
