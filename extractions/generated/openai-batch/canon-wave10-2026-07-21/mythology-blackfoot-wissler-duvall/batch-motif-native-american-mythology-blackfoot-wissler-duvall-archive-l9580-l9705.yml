canonical_text:
  quote: ''
  summary: 'The passage describes Shoshone warfare-related material culture and customs:
    bows, arrows, poisons, quivers, clubs, armor, shields, a shield-making ceremony,
    shield decoration, signal fires, scalping, coup-sticks, war paint, and chiefly
    display.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists bows and arrows, poggamoggans, shields, and skin armor as
    Shoshone military equipment.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Two bow types are described: a narrow sinew-lined Shoshonean bow and a compound
    bighorn bow spliced in the center with glue and sinews.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bows could be ornamented with porcupine quills or with snake skin glued to
    the bow; the bowstring was twisted sinew, and the archer used a wrist-guard.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Arrow shafts are described as about two and a half feet long, made from grease-bush,
    treated with heat and moisture, smoothed with stones and sand, unnotched, and
    feathered near the rear.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Several reported arrow poisons are mentioned, including a decayed mixture
    involving pulverized ants and an animal spleen, and rattlesnake poison used in
    hunting and war.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The quiver contained both arrows and a fire-drill, was preferably made of
    otter skin, and was worn on the back by a strap.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The poggamoggan is described as a leather-covered wooden handle joined to
    a leather-covered round stone by a thong, with a wrist-loop attached.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Armor consisted of many folds of dressed antelope skin joined with glue and
    sand, and protected both men and horses.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: A shield was made from buffalo bull neck skin, tightened on the ground, covered
    with clay, and hardened with burning coals so that it could turn a lance point
    or round bullet.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The shield-making account includes obtaining a young buffalo bull skin, preparing
    a feast with warriors, old men, and medicine-men, heating stones, pouring water
    on them, steaming and stretching the green hide, removing hair, trampling the
    hide for several days, and handing it to the owner.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The performers declared the finished shield arrow-proof, and the passage says
    there was an implicit belief in its efficacy against arrows and bullets.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: A modern Shoshone shield cover in the Museum is described as decorated with
    a crescent moon, nine circular star patches, and hawk and eagle feathers around
    the circumference.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: War customs described include signal-fires on mountains, scalping, distinction
    for touching a corpse first, distinction for leading a successful war-party, coup-sticks,
    face painting before war, and a chief wearing a trailing eagle-feather bonnet
    in a skirmish.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: 'The passage compares Shoshone equipment and customs with those of other groups:
    the Shoshonean bow is said to be shared with several named peoples, sinew lining
    on Plains bows is attributed to Great Basin contact, and Shoshone war customs
    are said to follow Prairie tribes.'
  category: relationship
  evidence_refs:
  - ev:1
  - ev:7
