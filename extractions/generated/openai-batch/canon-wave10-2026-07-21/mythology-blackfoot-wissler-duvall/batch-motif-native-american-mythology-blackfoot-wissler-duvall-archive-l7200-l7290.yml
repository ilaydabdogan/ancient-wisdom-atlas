canonical_text:
  quote: ''
  summary: 'An old woman deprived of food receives help from rats: buffalo hair from
    a rat nest produces dried meat when placed under rocks. She feeds children, later
    punishes the camp for abandoning her by making buffalo unavailable, calls the
    children back with food from a never-empty calfskin bag, and is thereafter carried
    with the moving camp; at death she leaves the bag and power to the girl who helped
    her. The passage then begins a tale of Bear-Moccasin, who teaches Chief-Old-Man
    ritual actions involving bear objects, paint, a robe, pipe, and songs; after shooting
    himself, Chief-Old-Man performs the instructions and Bear-Moccasin comes back
    to life, then kills himself again on a painted dagger.'
  language: English
  quote_policy: summarized
