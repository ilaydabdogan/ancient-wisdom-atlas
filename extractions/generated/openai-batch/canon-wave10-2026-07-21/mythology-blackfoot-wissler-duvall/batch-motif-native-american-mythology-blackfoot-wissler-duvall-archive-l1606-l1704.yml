canonical_text:
  quote: ''
  summary: 'The passage contains several Old Man episodes: a Coyote feigns injury
    during a race and causes Old Man''s dried meat to be eaten; Old Man mistakes berry
    reflections in water for real berries and later beats the bushes; and Old Man
    receives a bird''s eye-throwing power, violates the warning about crooked trees,
    loses his eyes, and is mocked by a passing coyote.'
  language: English
  quote_policy: summarized
