canonical_text:
  quote: ''
  summary: The passage gives ethnographic notes on bodily adornment, grooming, painting,
    washing, and dwellings among Lemhi/Shoshone-related groups, including shade-lodges,
    menstrual huts, tipis, grass-lodges, and comparative reports about Shoshone, Paiute,
    Kiowa, and other accounts of habitation types.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the nose was not pierced for ornaments, while beads
    and shell pieces could be worn from the ears; ear perforations and plugs or rings
    are also described.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hair arrangements are described for men and women, including loose hair, men's
    cues with feathers or skins, and women's middle part marked with red paint.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Beard hair was pulled out with tweezers, and fingernails were filed with a
    small rough flat stone; one named medicine-man was noted for a moustache.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tattooing is described as generally not practiced, except that women sometimes
    made small black-stained punctured circles on the face.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Face and body paints mentioned include red paint mixed with grease, red paint
    kept in buckskin pouches, white clay, black paint, and bluish paint.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A washing practice is described in which water is held in the mouth, squirted
    onto the hands, and then used to wet the hair and face.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the time of the visit, most Lemhi are said to have lived in log cabins
    and to have spent warm-season days in rectangular brush shade-lodges with a possible
    central fireplace.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Temporary shades could be made from willows or cottonwoods, and circular enclosures
    of similar construction were used for feasts and some dances.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: A menstrual hut is described as a small, low conical or dome-shaped structure
    near the main habitation, made from branches or trunks and brush or canvas.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Only a few canvas-covered tipis were seen, one used for dance-regalia storage;
    the passage says skin-lodges had been common among bands in contact with Prairie
    tribes, and that the Lemhi had lost tipis in a fight with the Atsina.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: According to the Lemhi and their myths, the habitation preceding the skin
    tipi was small and conical, with brush walls in summer and sage-brush or spear-grass
    thatching in winter.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage compares Shoshone-related grass, rush, straw, or tule dwellings
    with reports from Kiowa memory, Bonneville, Fremont, Western Shoshone, and Paiute
    examples; it also says there is no evidence for Shoshone semi-subterranean earth-lodges,
    while some travelers mentioned cave-dwellers.
  category: relationship
  evidence_refs:
  - ev:11
  - ev:12
