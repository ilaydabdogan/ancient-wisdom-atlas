  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: The uncle wants to eat his nephews; their mother delays him, helps the boys
    leave early, and the uncle later tracks them while longing for them.
  category: sequence
  evidence_refs:
  - ev:11
