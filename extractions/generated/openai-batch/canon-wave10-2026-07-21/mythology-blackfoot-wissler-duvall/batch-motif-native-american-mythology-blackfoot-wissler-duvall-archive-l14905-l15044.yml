candidate_motifs:
- id: motif:1
  label: supernatural wife obtained through exchange of medicine
  taxonomy_refs:
  - sacred_exchange
  basis: Thunder permits the boy to have his wife in exchange for the boy's medicine
    after seeing the bear's paw.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage frames the event as an exchange after an attempted abduction;
    it does not explain the nature of the medicine beyond the bear's paw.
- id: motif:2
  label: power object frightens a powerful being
  taxonomy_refs: []
  basis: Thunder initially intends to kill the boy but becomes frightened when he
    sees the boy's bear's paw.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not specify why the bear's paw has this effect.
- id: motif:3
  label: false or overestimated medicine man exposed by failed threat
  taxonomy_refs: []
  basis: The feared medicine man fails to harm the husband who resists him; the people
    then judge him as not very powerful and kill him.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The tale does not explicitly call him false, only less powerful than believed.
- id: motif:4
  label: animal associated with a dead man's spirit
  taxonomy_refs: []
  basis: After the medicine man is killed, his dog escapes and is supposed to be his
    master's spirit.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage states a belief or supposition but does not explain the mechanism
    of the association.
- id: motif:5
  label: cannibal returns to life after burning
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: The Indians burn the Cannibal, but he comes to life again.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: Only a brief statement is given; no ritual, interval, or cause of return
    is described.
- id: motif:6
  label: cannibal spouse kills and eats wife
  taxonomy_refs: []
  basis: The husband kills his wife and eats her flesh and organs.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The heading groups the episode among cannibal stories, but the passage
    segment itself gives no separate name for the husband.
- id: motif:7
  label: human flesh disguised as game and recognized by hair
  taxonomy_refs: []
  basis: The uncle gives his nephews sliced meat, saying it is game; a boy sees hair
    on it and the children suspect it is human.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The text says the boys suspect the uncle killed an Indian; it does not
