canonical_text:
  quote: ''
  summary: The passage contains the end of a Thunder-wife episode, a tale of a feared
    but exposed medicine man, and three cannibal-story episodes. A boy obtains Thunder's
    wife after Thunder fears his bear-paw medicine. A medicine man who claims women
    and is believed able to kill by coughing is challenged, exposed, killed, and associated
    with an escaping dog said to be his spirit. The cannibal episodes describe named
    cannibals eating women and corpses, a husband killing and eating his wife, and
    an uncle killing a friend, feeding the flesh to nephews as game, and then pursuing
    the fleeing children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy goes up into the mountains and meets Thunder's ten wives while they
    are digging roots.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy selects the prettiest wife, tries to carry her off, and she resists
    while the other wives call Thunder.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Thunder arrives with a terrible noise, first intends to kill the boy, then
    becomes frightened after seeing the boy's bear's paw.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Thunder offers his wife in exchange for the boy's medicine; the boy agrees
    and takes the woman home, where she lives with him and helps dig roots.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: A large man called a powerful medicine man starts dances and claims good-looking
    girls as wives by pointing and crying “Wu!”.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: People believe the medicine man can kill them by making them cough, and they
    fear him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: When the medicine man seizes another man's second wife, the husband pushes
    him away and is not harmed; the people then decide he lacks much power and kill
    him with a rock.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The medicine man's dog escapes after his death and is said to be his master's
    spirit.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: No'mo-rika and his father are feared cannibals who kill women and eat corpses;
    the father and son eat the father's wife.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: No'mo-rika says he likes to eat people, ambushes women digging potatoes, carries
    them off, eats them, and sleeps five days after devouring a woman.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Indians burn the Cannibal, but he comes to life again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In another episode, a husband mistreats his wife; after she urges her son
    to shoot him and the son spares him, the husband later stabs and kills her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The husband eats his dead wife's flesh, stomach, and intestines, then stops
    eating.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: In a third episode, a man visits a friend, kills him, skins and dries the
    body, slices it, and gives the meat to his nephews as alleged game.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The nephews discover hair on the meat, compare it with their own hair, suspect
