  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The daughter is said to spend each day on the water looking for people to
    take home and kill.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Coyote uses an elk horn scraper to break all the teeth of the daughter and
    then of the old woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After Coyote has intercourse with the daughter and the old woman, both women
    feel pregnant the next day.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: While Coyote is sent to fetch water, many babies fall from the women's wombs;
    the women wash most of the babies and make them into the tribes of Indians, leaving
    the Shoshone aside for Coyote to wash.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Coyote washes the Shoshone babies, calls them his children, says he will stay
    with them, and tells them to be brave against other Indians.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the shorter variant, Coyote meets an old woman and her daughter; the old
    woman warns him that the daughter kills and eats visitors.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: In the shorter variant, Coyote fashions a male member from blue stone, gathers
