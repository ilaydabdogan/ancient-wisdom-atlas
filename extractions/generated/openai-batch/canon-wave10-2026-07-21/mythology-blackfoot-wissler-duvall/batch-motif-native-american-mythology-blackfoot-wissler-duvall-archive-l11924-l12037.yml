canonical_text:
  quote: ''
  summary: Coyote encounters an old woman and her daughter, learns that they kill
    and eat men by means of toothed female genitals, escapes once, then returns with
    tools and breaks their teeth. The women become pregnant; many babies are born
    and washed into different tribes, while Coyote washes the Shoshone and calls them
    his children. A shorter variant repeats the encounter with an old woman and dangerous
    daughter, in which Coyote uses a stone artificial phallus and thorns to overcome
    the teeth, marries the girl, and fathers ancestors of the Shoshone.
  language: English with some Latin passages
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote reaches an island with two wikiups, smoke rising, and an old woman
    seated between them; the old woman invites him inside.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman's daughter says she had dropped Coyote in the water; when she
    looks inside, she sees him there and cooks duck eggs for him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Coyote notices many quivers hanging in the lodge and becomes frightened.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Coyote asks his anus for advice, and the anus warns him that the girl and
    her mother kill and eat men and tells him to use an elk horn scraper to break
    their teeth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The women appear to swallow food but let it pass to the abdominal or genital
    region, where Coyote hears egg shells cracking.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:6
  text: At night the old woman fastens the door with a rope so Coyote cannot escape;
    after Coyote wishes for rats, rats come and gnaw the rope.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Coyote simulates intercourse without inserting himself, runs to the door,
