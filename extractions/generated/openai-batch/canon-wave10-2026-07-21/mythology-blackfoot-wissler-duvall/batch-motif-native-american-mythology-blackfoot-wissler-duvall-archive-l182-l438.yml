- id: obs:4
  text: Titles in the Old Man section include earth-making, language confusion on
    a mountain, the order of life and death, permanent death, first marriage, migration,
    gambling, and encounters with beings or objects such as the Great Spirit, a rolling
    stone, squirrels, bear, elk-skull, women, girls, and buffalo.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Star Myths section lists titled figures or entities including Twin-Brothers
    or Stars, Blood-Clot or Smoking-Star, Fixed-Star, Scar-Face, Cuts-Wood, Seven
    Stars, Bunched Stars, and Moon-Woman.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ritualistic Origins section lists titles concerning medicine traditions,
    pipes, lodges, shields, charms, and named beings or groups such as Beaver-Medicine,
    Otter-Woman, Buffalo-Rock, Medicine-Pipe, Worm-Pipe, Seven Stars, Bear-Lodge,
    Horse-Lodge, Eagle-Head Charm, and Buffalo's Adopted Child.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Cultural and Other Origins section includes explanatory titles such as
    Why Dogs do not Talk, Why Grasshoppers Spit, and How Medicine-Hat got its Name.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Miscellaneous Tales section includes titles about lost children, cliffs,
    marriages to snake, filth, and horse, ghost feeding, coyote feeding, buffalo riding,
    animal contests or war, warriors, Wolverene-Woman, Seven-Heads, and Sand Hills.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: Some entries identify variant versions by group or narrator category, including
