canonical_text:
  quote: ''
  summary: A group of children find their camp abandoned and are taken in by an old
    woman who is a cannibal. A girl and her little brother escape after the brother
    warns her of the old woman's attack. At the river, the girl uses an Elk's Head
    skull as a speaking decoy and persuades a Water-Bull to carry them across after
    lousing him, while deceiving him with beads. The old woman pursues, smashes the
    skull, asks the Water-Bull to ferry her, insults him after lousing him, and is
    dropped into the river and drowned. The girl and her brother reach the vicinity
    of their people's camp but are afraid to enter at once.
  language: English
  quote_policy: summarized
