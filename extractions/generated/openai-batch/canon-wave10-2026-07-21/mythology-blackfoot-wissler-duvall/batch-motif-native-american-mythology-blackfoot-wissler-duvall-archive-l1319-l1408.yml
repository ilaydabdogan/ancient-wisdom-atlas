canonical_text:
  quote: ''
  summary: 'The passage gives a Sarcee account of separation from the Chipewyans during
    a winter crossing of an icy lake, followed by Blackfoot Old Man traditions: Old
    Man leads and teaches people, departs without dying, interacts with a good Great
    Spirit, makes mountains, is given a cross, is sent to teach people and animals,
    and appears in fragments about human-eating buffalo and gambling objects that
    transform between garments and food.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Sarcee version says the Sarcee and Chipewyans were once one people living
    in the north and travelling south in winter.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: During a crossing of a big lake on ice, a woman struck an elk horn protruding
    from the ice with an axe; the elk rose, shook its head, and frightened the people
    into running away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Those who ran north became Chipewyans, while those who ran south became the
    Sarcee or Sotënna.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A note identifies the lake as an Alberta lake called Buffalo Lake by the Indians
    because of its buffalo-like shape, and says the episode was also known to the
    Arapaho and Cheyenne.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Old Man led people to the area of the present Blood Reserve, said it would
    be a fine and rich country, and taught people described as living like wild animals
    the arts of civilization.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A parenthetical note says that only about thirty lodges crossed the ice and
    that these included representatives of all tribes then in the country, when the
    Blackfoot were still one tribe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Old Man did not die; he went among the Sioux, stayed for a time, finally disappeared,
    took his wife with him, and had no children.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A good Great Spirit made a man and a woman; Old Man was not made by anyone
    and always existed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the Great Spirit asked Old Man to show power by making mountains, Old
    Man made the Sweet-Grass Hills from a piece of Chief Mountain, moved Chief Mountain
    to its present location, shaped it, and named it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Great Spirit made a big cross for Old Man to carry; Old Man asked for
    another man to carry it, carried it briefly, tired, and was told to go among people
    and animals and teach them how to live.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The other man became or was a white man, tired of carrying the cross, and
    was sent away as a traveller.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The created man and woman wandered toward Mexico and tried to build a mountain
    to reach the sky and be with their children, but the people became mixed until
    many languages resulted.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A Northern Blackfoot fragment says Blackfoot people were living on grass while
    buffalo killed and ate them, until Old Man told them they should eat buffalo and
    made arrows for them; buffalo-drives followed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: A note says the idea that buffalo formerly ate men is found in Cheyenne myths.
  category: other
  evidence_refs:
  - ev:7
- id: obs:15
  text: At a far-northern place called Old Man's Gambling-Place, Old Man joined people
    playing the game of the arrows and the rolling wheel.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: When Old Man lost his robe and moccasins, the robe became back-fat and the
    moccasins became buffalo tongues; the winner returned them, and they became a
    robe and moccasins again when Old Man put them on.
  category: sequence
  evidence_refs:
  - ev:8
