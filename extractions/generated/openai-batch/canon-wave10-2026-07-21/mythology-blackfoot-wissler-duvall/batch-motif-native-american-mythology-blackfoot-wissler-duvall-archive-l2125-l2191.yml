canonical_text:
  quote: ''
  summary: Old Man encounters squirrels playing a hot-ashes game, kills most of them
    while sparing a pregnant female squirrel, stores and eats the bodies, and loses
    the remaining meat to a lynx while asleep. In anger he alters the lynx and a piece
    of wood, later creates wind and marks birch bark, misuses fire-leggings despite
    instructions, and finally becomes a pine-tree after not being chosen by women
    selecting husbands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old Man travels after eating dried meat and finds squirrels playing a game
    in which one covers others with hot ashes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old Man persuades the squirrels to let him cover them all at once, but spares
    a pregnant female squirrel after she begs him; he says this will allow more squirrels
    in the world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Old Man leaves the covered squirrels under the hot ashes despite their calls,
    and they die.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Old Man makes a red-willow scaffold for the squirrel meat; the passage says
    this is why red willow is greasy.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Old Man tells his anus to make noise and wake him if anyone comes; it wakes
    him for birds and insects, but he later sleeps through the noise when a lynx comes
    and eats the squirrels.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Old Man follows the lynx tracks, finds the lynx on a flat stone, bangs the
    lynx's nose flat, and puts hair on the nose as whiskers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Old Man becomes angry at his anus, rubs a stick from the fire, and the passage
    says that wood smells bad to this day.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Old Man goes to a hill because of pain, rolls buffalo-chips down the hill
    to produce wind, is blown about, and is held by a birch tree.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Old Man scolds the birch for being strong and slashes its bark with a knife;
    the passage identifies this as the cause of birch-bark markings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A man brings promised leggings and warns Old Man not to use them often, saying
    they set things on fire and can bring food when used on ice with dance and song.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Old Man ignores the warning, puts on the leggings, dances, sees them catch
    fire, removes them quickly, and returns them to their owner.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: At a time when women and men were not married, women choose husbands at a
    buffalo-drive; no one chooses Old Man.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: After not being chosen, Old Man becomes angry, tears down the cliff, turns
    into a pine-tree, and remains there.
  category: sequence
  evidence_refs:
  - ev:6
