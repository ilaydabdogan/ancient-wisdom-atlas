canonical_text:
  quote: ''
  summary: The passage describes games, horse parades, children's play, and examples
    of realistic art. It lists boys' spring games, women's shinny and ball games,
    horse-parade entertainment with war regalia and mock battles, cat's-cradle figures,
    children's imitative play, and decorated objects bearing figures such as a woman,
    sun, rainbow, horse, tipi, snake, bear, and bird.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Boys are said to play three games at the beginning of spring: a football
    race, arrow-shooting, and a hoop-game.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The football race uses two balls, one for each side; contestants run in the
    same direction, kick their own ball toward a predetermined goal, may rest and
    be replaced, must not use their hands, and win by reaching the goal first.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: An arrow-game involves two competitors shooting feathered arrows at a stick-shaped
    target and betting blankets on the result.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hoop-game is played with a willow hoop and a dart.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women played shinny by facing each other and attempting to carry a ball to
    the antagonists' goal; at Wind River, women also used a dumb-bell shaped buckskin
    ball with forked sticks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Horse-parades are described as entertainment in which men retire from camp,
    put on breechclouts and war-bonnets, mount horses, gallop toward camp, and ride
    around it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: One cited account says equestrians displayed scars, waved scalps of slain
    enemies on poles, and uttered exclamations of joy; sham battles on horseback were
    also fought at Lemhi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Wind River game called nawa'tapi, several women approach a goal while
    juggling two to four balls of mud or gypsum; the first to arrive without dropping
    any wins.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Cat's-cradle is known to Lemhi boys and girls; named figures include boy,
    woman, tipi, rabbit-snare, fish-trap, and antelope, with the antelope figure loosened
    and tightened to represent motion.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that cat's-cradle has a native name glossed as wonder-making
    but seems to have no ceremonial significance.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Children's games include girls playing with buckskin dolls and model cradle-boards
    and making small lodges, while boys shoot arrows and race in imitation of elders;
    Lemhi boys also use slingshots.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Examples of realistic art include reported petroglyphs, a pictographic drawing,
    painted lodges, moccasins painted with a woman, sun, flower, rainbow, horse, tipi,
    snake, and bear, and a drum painted with a bird.
  category: object
  evidence_refs:
  - ev:7
