canonical_text:
  quote: ''
  summary: Old Man makes a red-willow scaffold for roasted squirrel meat, sleeps,
    and relies on Little Brown-Eye, identified as his anus, to keep watch. A lynx
    steals the meat, and Old Man punishes Little Brown-Eye and then reshapes the lynx,
    explaining traits of willow wood and lynx form. After a wind cools Little Brown-Eye,
    Old Man calls for stronger wind, is carried away by a storm, catches a birch-tree,
    and cuts it, explaining birch marks. In the next episode, Old Man joins deer and
    elk playing follow-the-leader, leads them over a cliff, and many are killed, while
    pregnant animals are spared.
  language: English
  quote_policy: summarized
