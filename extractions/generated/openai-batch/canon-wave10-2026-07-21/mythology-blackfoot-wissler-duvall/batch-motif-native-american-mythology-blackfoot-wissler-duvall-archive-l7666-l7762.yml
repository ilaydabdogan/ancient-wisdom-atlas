canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a woman marries a handsome
    man in a white buffalo-robe who later thaws during a Chinook and leaves only excrement;
    their unborn son becomes Excrement Chief. It then gives the tale of a woman left
    behind during a camp move who is taken by a handsome young man and later found
    living wild among horses. It also gives the tale of a jealous co-wife who sharpens
    her leg, kills people by kicking, and is killed and burned. Source notes mention
    Crow, Piegan, Gros Ventre, and Arapaho parallels or affiliations.
  language: English
  quote_policy: summarized
