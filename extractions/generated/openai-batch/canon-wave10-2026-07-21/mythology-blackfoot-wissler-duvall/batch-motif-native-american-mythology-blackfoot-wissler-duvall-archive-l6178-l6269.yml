candidate_motifs:
- id: motif:1
  label: Hidden animal-associated society teaches human ritual
  taxonomy_refs:
  - initiation
  basis: The two men pass from a prairie-dog town into a lodge where the Kit-Fox Society
    is assembled and a Kit-Fox man teaches the ceremony; the passage explicitly says
    this is how the men learned it.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage gives ritual instruction but does not explicitly label the
    experience as initiation.
- id: motif:2
  label: Vision quest or dream establishes a ritual society
  taxonomy_refs:
  - initiation
  basis: Chief-Speaking is instructed to sleep on a buffalo-drive hill with the buffalo-rock,
    sees a procession from the sun after seven days, and then organizes the Catchers
    Society.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The term 'vision quest' is not used in the passage; this is a cautious
    motif label based on the dream-seeking sequence.
- id: motif:3
  label: Buried child restored to life by buffalo bulls
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Four buffalo bulls find the buried baby, state they will bring him to life,
    and successively restore him from burial to life and full adulthood.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage describes restoration to life directly; broader death-rebirth
    interpretation should remain limited to the stated sequence.
- id: motif:4
  label: Miraculous growth from infant to adult
  taxonomy_refs:
  - miraculous_child
  basis: After the buffalo bulls revive the buried child, their successive actions
    cause him to crawl, become half-grown, and become a full-grown man.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage does not explain the child's conception beyond saying the
    mother suddenly became pregnant.
- id: motif:5
  label: Animal powers gained through rescue and negotiated substitution
  taxonomy_refs:
  - sacred_exchange
  basis: Rabbit and Hawk each promise speed powers; the young man protects Rabbit,
    substitutes a squirrel for Hawk, and receives power from both.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
  confidence: medium
  cautions: The passage calls the gifts 'power' but does not provide a formal category
    for the exchange.
