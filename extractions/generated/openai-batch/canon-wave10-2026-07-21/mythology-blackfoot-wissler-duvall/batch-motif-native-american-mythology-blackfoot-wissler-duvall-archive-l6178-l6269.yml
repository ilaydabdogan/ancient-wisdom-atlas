canonical_text:
  quote: ''
  summary: 'The passage recounts three ritual-origin or mythic episodes: two men enter
    a prairie-dog town and learn the Kit-Fox Society ceremony; Chief-Speaking dreams
    of a procession from the sun and organizes the Catchers Society with buffalo-rock
    songs supplied by his wife; a chief''s daughter gives birth to a child, buries
    him, and four buffalo bulls restore him to life and adulthood, after which he
    visits his people and gains powers from Rabbit and Hawk.'
  language: English
  quote_policy: summarized
