canonical_text:
  quote: ''
  summary: The passage describes material culture, especially moccasins, leggings,
    shirts, tippets, necklaces, and fans. It details animal materials, construction
    methods, seasonal adaptations, gendered clothing forms, ornaments, and comparisons
    among Shoshone, Bannock, Blackfoot, Plains, and Algonquin-style footwear. It also
    notes bear-claw necklaces as a badge for men who had killed a grizzly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Moccasins are described as made from deer, elk, or buffalo skin dressed without
    hair; winter buffalo-skin moccasins had the hair inside.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Informants reported that moccasins were stuffed with sage-brush bark during
    the cold season.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some young men ornamented moccasin tops with polecat skins, with the tail
    trailing at the heel; the passage also notes many undecorated moccasins in contemporary
    use.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Shoshone and Bannock are described as making moccasins in one piece, and
    the passage gives a detailed cutting, folding, sewing, incision, and lacing process
    for footgear made from tanned buckskin.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The described moccasin-making method is said to agree with ancient Blackfoot
    practice, differ from recent hard-soled Plains moccasins, and include one observed
    Algonquin-style moccasin with a seam in the middle of the upper.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Men and women were often barefoot at home.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Women’s leggings were of antelope skin, reached to the knee, and were secured
    by a garter; men’s leggings were also of antelope skin but were long, full, and
    made from nearly an entire skin.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Men’s leggings had fringed side flaps, sometimes ornamented with bunches of
    hair from a slain enemy, and were commonly decorated with long beaded strips.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Men’s shirts were made of animal skin and had fringes and decorated shoulder
    straps; women’s chemises lacked these shoulder straps and could have nursing openings,
    porcupine-quill embroidery, girdles, and attached awl-cases.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: A Shoshone tippet is described as an otter-fur collar with attached ermine-skin
    rolls, fringe, and shell ornamentation, forming the appearance of a short cloak.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage notes a change from children wearing beads in Lewis and Clark’s
    time to cylindrical bead necklaces being popular among men and women, preceded
    by ornaments of salmon vertebrae, shells, sweet-grass, and embroidered collars.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Elk-tooth necklaces were worn by women and children, while bear-claw necklaces
    were reserved for men who had killed a grizzly and functioned as a badge of distinction;
    eagle-feather fans were also made.
  category: relationship
  evidence_refs:
  - ev:6
