canonical_text:
  quote: ''
  summary: The passage presents several Blackfoot ritual-origin narratives. A man
    fasting on a mountain receives a medicine-pipe from the smallest of the Seven
    Stars. A lone elk hunter gives meat to Coyote and receives a medicine-pipe. Man-with-a-Woman-Inside-of-Him
    is taken through dream guidance to an underwater Otter lodge, where Otter and
    Otter's wife transfer skins, songs, and bundle-handling knowledge. In the Bear-Lodge
    narrative, a lost child is taken by Bear to a painted cave, fed and raised through
    winter, given the name Big-Bear, a lodge design, a knife, and medicine, then returns
    to his people as a wild and invulnerable fighter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man went to a mountain-top to fast and sleep for four days, heard singing
    from above, saw the smallest of the Seven Stars singing, and received a medicine-pipe
    after that star became a person.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A lone hunter in the foothills killed elk, heard Coyote call and sing about
    wanting meat, offered an elk to Coyote, and then received a medicine-pipe from
    Coyote.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Man-with-a-Woman-Inside-of-Him slept on a raft on Round Lake, was carried
    far from shore by wind, dreamed of Mink inviting him to Mink's father's lodge,
    and heard drumming under the water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the man shut his eyes as instructed, he found himself under water in
    a lodge where Otter was lying near the fire.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Otter became as a person, said he would give the man power, made a smudge
    with lake-shore grass, sang of the water as his medicine-lodge, and later transferred
    an otter-skin to the man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Otter's wife assisted with songs and bundles and transferred a mink-skin to
    the man in the same manner.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The man stayed with the underwater people until he learned many songs and
    the ways of handling the bundle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A little boy fell from a dog-travois during a camp move, remained sleeping,
    and could not be found by his mother when she searched for him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bear heard the lost child crying at night, took him to a cave, and the child
    thought the cave was a tent because it was painted outside with Bear's figure,
    hind-feet, and wings.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Bear kept the child through winter, made food for him by transforming buffalo-chips
    into meat and saskatoon-sticks into ripe berries, and the child grew very fast.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Bear named the boy Big-Bear and gave him Bear's name, tent design, a large
    bear-knife, and medicine that would let him obtain things and protect him from
    enemies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Big-Bear returned to camp with painted body and face, was initially unrecognized,
    became increasingly wild, and survived attacks without wounds when the people
    tried to kill him.
  category: sequence
  evidence_refs:
  - ev:7
