canonical_text:
  quote: ''
  summary: The passage describes Congo-region fetiches, masks, rattles, tomtoms, and
    drums. It explains fetiches as objects empowered by incantations, ritual performances,
    and magical substance for practical purposes; surveys regional forms of human
    and animal fetiches; describes masks used in war, dance, and shamanic contexts;
    and notes the functions of rattles, tomtoms, and drums in royal, ritual, musical,
    and signaling contexts.
  language: English
  quote_policy: summarized
