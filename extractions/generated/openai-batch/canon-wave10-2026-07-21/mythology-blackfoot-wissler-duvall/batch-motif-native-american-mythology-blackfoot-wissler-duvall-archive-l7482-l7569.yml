canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which compensation is accepted by
    a wronged husband, and a split feather is destroyed in fire, releasing a trapped
    couple. It then begins the tale “The Treacherous Wives”: two wives trap their
    jealous husband in a hidden pit on a hill, return to camp, and say he must have
    been killed. A gray wolf rescues the man through a tunnel, claims him as a son,
    and the man goes with the wolf pack. The man, now wolf-like, springs traps at
    a buffalo-drive for the pack until people capture him and see that he is a man
    with wolf hair and claws.'
  language: English
  quote_policy: summarized
