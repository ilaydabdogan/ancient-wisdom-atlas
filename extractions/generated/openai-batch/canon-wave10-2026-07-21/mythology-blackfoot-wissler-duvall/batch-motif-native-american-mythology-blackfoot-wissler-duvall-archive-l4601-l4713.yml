evidence:
- id: ev:1
  type: summary
  locator: lines 4601-4612
  quote_or_summary: The buffalo fence has been broken down; only a small number of
    bulls are killed. The woman's husband reserves ribs and back-fat for a feast and
    says they are briefly saved by having some meat.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/mythology-blackfoot-wissler-duvall.md
  rights_note: Public domain source; summarized.
- id: ev:2
  type: summary
  locator: lines 4613-4624
  quote_or_summary: The woman is called to make medicine again and orders only women
    to dance so cows will come. In the morning the rock has fallen on its face, and
    cows in the enclosure are killed with arrows without escaping.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/mythology-blackfoot-wissler-duvall.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: lines 4625-4629
  quote_or_summary: The people have plenty of meat, believe in the power of the rock,
    and the woman who found the rock is respected by her husband.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/mythology-blackfoot-wissler-duvall.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: lines 4631-4636
  quote_or_summary: The narrative introduces the origin of the medicine-pipe and says
    the Blood Indians have very old medicine-pipes, all of which came from Thunder.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/mythology-blackfoot-wissler-duvall.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 4638-4651
  quote_or_summary: A girl who has not married hears thunder and says she will marry
    him. While gathering wood, her packstrap breaks repeatedly; after her mother leaves,
    a handsome young man appears and says he came because she said she would marry
    him. The girl says he must be Thunder.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/mythology-blackfoot-wissler-duvall.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 4652-4664
  quote_or_summary: Thunder tells the girl to close her eyes; she later finds herself
    on a high mountain at a lodge. An old man and old woman are there; lightning flashes
    about the girl without hurting her, and the old man knows she belongs to the family.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/mythology-blackfoot-wissler-duvall.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 4664-4669
  quote_or_summary: Thunder makes sweet-pine smudges and teaches his daughter-in-law
    how to bring in the outside bundle, the medicine-pipe. Later she gives birth to
    two boys.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/mythology-blackfoot-wissler-duvall.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 4670-4681
  quote_or_summary: Thunder asks if the woman wants to see her parents and says he
    will send them his pipe so they may live long. She returns to her people's lodge,
    identifies herself to her mother, calls the relations together, and says the pipe
    will come in four days.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/mythology-blackfoot-wissler-duvall.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 4683-4689
  quote_or_summary: Four days later Thunder arrives with the woman, her two boys,
    and the pipe. The pipe-transfer ceremony occurs, and Thunder says he will return
    in spring; tobacco and berries should be saved for him and prayed over.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/mythology-blackfoot-wissler-duvall.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 4689-4695
  quote_or_summary: Thunder takes the youngest boy and departs; a cloud rolls away,
    and the people hear one loud thunder and one faint thunder identified as the boy.
    People appeal to Thunder for the sake of his youngest child, and he heeds them.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/mythology-blackfoot-wissler-duvall.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 4696-4700
  quote_or_summary: Thunder warns that the woman and elder child will disappear if
    dogs try to bite them. A dog later snaps at the boy, after which he and his mother
    vanish; medicine-pipe owners fear dogs.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/mythology-blackfoot-wissler-duvall.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 4702-4704
  quote_or_summary: A note says Thunder is often said to steal or seduce women and
    cites another version of the medicine-pipe origin in Grinnell.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/mythology-blackfoot-wissler-duvall.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 4706-4713
  quote_or_summary: In the Worm-Pipe tale, a hunter in camp sees a worm on burning
    decayed wood; the worm becomes a person with a decorated medicine-pipe and eagle
