canonical_text:
  quote: ''
  summary: The passage concludes a buffalo-drive medicine episode in which ritual
    dancing and a powerful rock help secure buffalo. It then narrates the origin of
    a Blood medicine-pipe from Thunder through a human woman who marries him, bears
    two sons, returns to her people with the pipe, and becomes associated with a dog
    taboo. A short following tale tells of a worm on burning wood becoming a person
    and transferring a medicine-pipe to a hunter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the buffalo-drive episode, the people kill only a small number of bulls
    after a fence is broken down, and the woman's husband sets aside ribs and back-fat
    for a feast connected to his wife's medicine-making.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the next night the woman orders only the women to dance so that cows will
    come to the drive.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the women's dance, the rock is seen fallen on its face, cows are found
    in the enclosure, and the cows are killed with arrows without escaping.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people become happy, have plenty of meat, believe in the power of the
    rock, and the woman is respected by her husband.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that all medicine-pipes came from Thunder and that one
    very old Blood pipe was regarded as the real one handed down by Thunder.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A girl says she will marry Thunder after hearing thunder roll.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: While gathering wood, the girl's packstrap repeatedly breaks; after her mother
    leaves, a handsome young man appears and says he has come because the girl said
    she would marry him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The girl identifies the young man as Thunder.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Thunder tells the girl to close her eyes; when she opens them she is on a
    high mountain at a lodge.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the mountain lodge, an old man says the girl smells bad, an old woman identifies
    her as a daughter-in-law, and lightning flashes around the girl without hurting
    her when the old man looks at her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Thunder makes smudges with sweet-pine needles and teaches his daughter-in-law
    how to bring in the bundle hanging outside, identified as the medicine-pipe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The woman gives birth first to one boy and later to another boy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Thunder asks whether the woman wants to see her parents and says he will send
    them his pipe so that they may live long.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The woman returns near her people's lodge, tells her mother and relations
    that she married Thunder, and says Thunder will give them his pipe in four days.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Four days later Thunder comes with the woman, her two boys, and the pipe,
    and a ceremony of transferring the pipe takes place.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: After the pipe transfer, Thunder says he will return in spring and that tobacco
    and berries should be saved for him and prayed over.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: Thunder takes the youngest boy; a cloud rolls away and the people hear one
    loud thunder and one faint thunder, the faint one being identified as the boy.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: When Thunder threatens, people appeal to him for the sake of his youngest
    child, and the passage says he heeds their prayers.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:19
  text: Thunder says that if dogs attempt to bite the woman or elder child, they will
    disappear.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:20
  text: After a dog snaps at the boy, the boy and his mother disappear, and medicine-pipe
    owners are said to fear dogs.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:21
  text: A note says Thunder is often said to steal or seduce women and points to another
    medicine-pipe origin version in Grinnell.
  category: other
  evidence_refs:
  - ev:12
- id: obs:22
  text: In the Worm-Pipe tale, a hunter sees a worm crawling on a decayed burning
    stick while he sits smoking in camp.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:23
  text: The worm becomes a person holding a decorated medicine-pipe with a straight
    tubular bowl, wearing an eagle plume, shaking the pipe-stem, and singing that
    fire is his medicine.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:24
  text: The worm-person transfers the pipe to the man.
  category: action
  evidence_refs:
  - ev:14
