candidate_motifs:
- id: motif:1
  label: ritual action brings successful buffalo drive
  taxonomy_refs: []
  basis: The woman's instruction that only women dance is followed by cows entering
    the enclosure, the rock falling on its face, and a successful kill.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage gives only the end of this tale, so the origin and full ritual
    context of the rock medicine are incomplete here.
- id: motif:2
  label: sacred object obtained from Thunder
  taxonomy_refs:
  - sacred_exchange
  basis: The passage says medicine-pipes came from Thunder and narrates Thunder transferring
    his pipe to the people through a ceremony.
  evidence_refs:
  - ev:4
  - ev:8
  - ev:9
  confidence: high
  cautions: The taxonomy label is broad; the passage specifically concerns a medicine-pipe
    origin rather than a general exchange system.
- id: motif:3
  label: human woman marries Thunder
  taxonomy_refs:
  - sacred_marriage
  - divine_beloved
  basis: The girl says she will marry Thunder, Thunder comes for her, and she later
    tells her people that she married him.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage includes coercive or abductive elements, so “sacred marriage”
    should not be read as purely consensual beyond the literal statement that she
    said she would marry Thunder.
- id: motif:4
  label: transport to supernatural mountain dwelling
  taxonomy_refs:
  - ascent
  basis: Thunder has the girl close her eyes, after which she finds herself on a high
    mountain at his lodge.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage describes sudden transport to a mountain, not a step-by-step
    ascent journey.
- id: motif:5
  label: recognition by harmless lightning
  taxonomy_refs: []
  basis: Lightning flashes around the girl without harming her, and the old man recognizes
    that she belongs to the family.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage does not explain whether this is a formal test, sign, or protective
    recognition beyond the immediate family identification.
- id: motif:6
  label: children of human and Thunder as intercessory link
  taxonomy_refs:
  - divine_parent_child
  basis: The woman bears two boys by Thunder; the youngest becomes associated with
    faint thunder, and people appeal to Thunder for the sake of his youngest child.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: high
  cautions: The passage does not state whether the child independently acts as an
    intercessor; the people invoke him in prayer to Thunder.
- id: motif:7
  label: taboo attached to sacred-pipe ownership
  taxonomy_refs: []
  basis: Thunder warns about dogs, a dog snapping at the elder boy leads to disappearance,
    and medicine-pipe owners are said to fear dogs.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage frames this as fear of dogs, not as a fully detailed ritual
    prohibition.
- id: motif:8
  label: shape-changing worm gives a medicine-pipe
  taxonomy_refs:
  - shapeshifter
  - sacred_exchange
  basis: A worm on burning wood becomes a person holding a medicine-pipe and transfers
    it to a hunter.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: Only the opening of the Worm-Pipe tale is included, so later ritual rules
    or consequences are not available in this passage.
