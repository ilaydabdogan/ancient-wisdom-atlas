canonical_text:
  quote: ''
  summary: 'The passage describes origins and episodes associated with the Black-Tail
    Deer-Dance: a dead man returns from the land of the dead with songs and prayers;
    a Kutenai man is revived through an all-night dance; a medicine-woman kills and
    revives dancers using an otter-skin and ritual substances; a dancer displays visionary
    crosses during the dance. It then gives a tale in which Horned Toad and Frog travel
    between lakes, nearly die from heat, are revived by water and rain, and marry.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who had been dead seven days is brought back to his decomposed body
    by a spirit of the dead and comes to life among his friends.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The revived man says he has come from the land of the dead to teach songs
    and prayers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The revived man leads a circular dance, keeps time with a small bell, sings
    songs learned in the land of the dead, and prays for the people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the dance and prayer, hunters bring back much meat, and the dance is
    called the Black-Tail Deer-Dance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that people take part in the Black-Tail Deer-Dance before
    hunting and can see in dreams where game is to be found.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Kutenai man is buried in snow, found by his dog, and carried home dead by
    his wife after four days.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The wife prays that her husband be brought to life and that food be given
    to the family.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Two young men arrive, say spirits will help, and ask for a dance so the dead
    husband may regain life.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: After an all-night dance, one young man stands at the corpse's head with a
    black cloth, another touches the corpse's breast, the corpse opens his eyes, and
    one young man walks on his chest until he becomes alive.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: One of the young men gives the revived man a cross and tells him to pray to
    it and never part with it.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says the Black-Tail Deer-Dance uses the same songs sung on the
    night of the Kutenai man's revival.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: A medicine-woman owns an otter skin with skull attached and challenges others
    to test whose medicine is strongest.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: The medicine-woman mixes water and earth, sprinkles the mixture on the otter
    head, spits water toward dancers, and those struck fall dead.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The medicine-woman places pine branches on coals, holds the otter-skin in
    the smoke, rubs it, and the dead dancers come to life again.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: During a reported Black-Tail Deer-Dance, a dancer shows crosses appearing
    on his breast and back while dancing and disappearing when he stops.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: In the same report, the narrator sees a cross on the ground by the dancer's
    feet and a cross above the dancer's head with rays like the sun.
  category: object
  evidence_refs:
  - ev:16
- id: obs:17
  text: Horned Toad travels from one lake to another to see Frog, persuades Frog to
    return with him, and they start back while it rains hard.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:18
  text: When the sun becomes very hot, Horned Toad weakens, and Frog passes water
    over his back to revive him.
  category: action
  evidence_refs:
  - ev:18
- id: obs:19
  text: Frog and Horned Toad nearly die during the journey, but rain begins again,
    they are refreshed, reach the lake, and marry.
  category: sequence
  evidence_refs:
  - ev:19
