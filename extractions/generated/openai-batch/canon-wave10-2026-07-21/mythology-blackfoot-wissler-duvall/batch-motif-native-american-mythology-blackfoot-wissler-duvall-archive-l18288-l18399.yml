  summary: The passage describes museum collection objects, including African musical
    instruments, Congo textiles, Benin bronzes and carved tusks, and British South
    African decorated gourds, vessels, pins, and spoon handles. It highlights textile
    manufacture, geometric design elements, carved processions, human and animal representations,
    and comparisons to named decorative patterns.
