literal_observations:
- id: obs:1
  text: The passage lists several African musical instruments, including a sansa,
    a marimba with gourd resonators, a musical bow construction, a harp-guitar-like
    instrument, a zither with bark resonator, and a trumpet of ivory and wood.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bakuba plush cloth is described as raphia fabric woven by men, with plush
    patterns sewn on afterward by women.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pile-cloth work is also attributed to the Bapendi near the mouth of the Kwango,
    and similar fabrics are reported from Lake Ntomba; the passage says the fabric
    seems to have traveled north in trade.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: One Congo design element is a rectangle containing four right-angled triangles
    whose apices touch, identified in the passage as the Samoan whirligig pattern.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Benin accessions include bronze figurines, ornaments, tusk-stands, and carved
    tusks.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The carved Benin tusks show human figures with peaked headgear bearing staves,
    wands, or leaf-shaped swords, nude men with legs curved upward and outward, and
    sigma-shaped designs associated with eye ornaments and a tail-like appendage.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: One Benin tusk includes a horseman in a brimmed helmet and pleated skirt,
    holding a dart while reining the horse.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The same Benin specimen includes a dignitary supported on either side by an
    attendant.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Small tusks and tusk-tips are divided by descending spiral lines into bands
    with realistic carvings; the passage says the relief figures on a piece seem to
    represent a procession.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The smaller tusks include representations of hand-to-hand encounters, European
    headgear, umbrellas, a wheeled vehicle, a European house, fish, birds, and quadruped
    forms.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Decorated gourds from British South Africa combine geometric designs, including
    checker patterns, triangle rows, and lozenges or triangle columns, with representations
    of human figures, birds, and beasts.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Some wooden vessels duplicate earthen pot forms and are decorated with bands
