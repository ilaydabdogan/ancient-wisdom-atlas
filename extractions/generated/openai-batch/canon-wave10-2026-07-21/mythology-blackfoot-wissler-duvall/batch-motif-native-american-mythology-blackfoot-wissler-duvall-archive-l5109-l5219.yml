literal_observations:
- id: obs:1
  text: A lance was buried with its last owner, and a related transfer ceremony included
    the recipient's wife being thrown down upon thorns; an indecent exposure episode
    later became a fixed part of the transfer narration.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A white man, believing his wife was in love with a young Indian, rowed away
    with her while the Indian was away swimming, leaving the Indian alone on the island.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The abandoned Indian cried, made a bed of feathers, slept in it, and lived
    by digging roots.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An Otter and a white Swan swam toward the shore, addressed the Indian as their
    son, told him not to be frightened, instructed him to keep his eyes shut, and
    promised to take him to the shore before the white man arrived.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Swan sang words naming wind, rain, and hail as medicine; the Otter dipped
    his fingers in water four times, rubbed his hair, blew his whistle four times,
    and sang that water was his medicine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Smoking-Otter medicine is said to have originated when the Indian returned
    to his people and took an otter-skin and a swan-skin as his medicine.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The owner of the Smoking-Otter medicine smokes, shakes bells on the otter
    four times, blows smoke into his hand, rubs it on the otter-skin, and directs
    smoke to the otter, bells, owner's heart, and ground.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Always-Talking killed his wife Stepped after she fell in love with a younger
    man, then told the camp what he had done and that they should move.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The camp moved far north across a large river; the spring water rose so high
    that the people could not cross back, while Always-Talking mourned and regretted
    killing Stepped.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Eight buffalo, one Cow and seven bulls, found the dead woman's remains; the
    Cow pitied her and brought seven cows to aid in doctoring her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When only the woman's bones remained, the buffalo became people, painted and
    dressed in fine clothes, with seven drums and other medicine things.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The buffalo people sang, covered the skeleton with dirt and grass, and hooked
