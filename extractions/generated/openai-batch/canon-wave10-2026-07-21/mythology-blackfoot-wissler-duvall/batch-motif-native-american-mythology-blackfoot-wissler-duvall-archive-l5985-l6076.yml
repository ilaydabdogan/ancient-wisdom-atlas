canonical_text:
  quote: ''
  summary: A young man fathers a child with a buffalo-cow. The child later finds his
    human father and brings him to the buffalo mother, who becomes a woman after charging
    four times. After the husband violates her warning not to strike at her with fire,
    she and the child vanish as buffalo. The father seeks them among the buffalo,
    passes several recognition tests with his son's secret help, but fails the final
    test when another calf imitates the sign; the herd tramples him.
  language: English
  quote_policy: summarized
