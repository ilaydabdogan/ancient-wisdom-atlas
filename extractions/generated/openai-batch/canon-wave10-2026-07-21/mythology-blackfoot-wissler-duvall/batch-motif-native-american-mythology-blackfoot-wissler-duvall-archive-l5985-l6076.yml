  text: A young man finds a buffalo-cow fast in the mire and later the cow gives birth
    to a boy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy visits Indian camps to play with children and mysteriously disappears
    in the evening.
  category: action
  evidence_refs:
