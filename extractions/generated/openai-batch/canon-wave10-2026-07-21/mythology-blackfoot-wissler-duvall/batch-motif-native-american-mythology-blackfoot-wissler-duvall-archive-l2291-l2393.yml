canonical_text:
  quote: ''
  summary: A stranger transfers the Four-Tail Lodge to Smart-Crow and teaches him
    its ritual, songs, and painted symbols. Smart-Crow gives his two sons to a rock
    and a beaver to raise. Later he retrieves them by tricking them out of their foster
    places and having them lick his hand to recognize him as their father. The boys
    are renamed Rock and Beaver. Rock and Beaver hunt buffalo and begin a rite involving
    their mother's bones, a cooking pot, buffalo parts, breath blown four times, a
    robe covering the bones, and repeated calls for their mother to rise as the pot
    boils.
  language: English
  quote_policy: summarized
