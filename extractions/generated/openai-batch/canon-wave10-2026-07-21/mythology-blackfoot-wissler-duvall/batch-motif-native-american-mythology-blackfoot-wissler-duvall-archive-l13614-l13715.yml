  summary: The passage contains the end of a Coyote and Porcupine episode and a Skunk
    and Eagle episode. Coyote and Porcupine contest rights over a buffalo, Porcupine
    eats meat and is killed, repeatedly revives, climbs a growing pine-tree with the
    recovered meat, and kills Coyote's family. In the Skunk episode, Skunk intercepts
    women intended for Eagle, Eagle reclaims them by ruse and retreats to a high rock,
    and Skunk is injured after mistaking a reflection in water and attempting to climb
    after Eagle.
