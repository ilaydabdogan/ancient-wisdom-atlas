canonical_text:
  quote: ''
  summary: The passage contains the end of a Turtle tale in which Turtle kills a woman,
    resists execution until he is thrown into deep water, and then survives while
    singing of a scalp. It then gives the tale "The Warrior's Dilemma," in which a
    scout spares an isolated family after their child feeds him, arranges to receive
    a medicine-bundle, and is later suspected by his war-party of betrayal. A note
    states that this and the following narrative are treated as ethical puzzles. The
    passage begins the next tale, in which another scout sees a beautiful woman alone
    in a small lodge and spends the night with her.
