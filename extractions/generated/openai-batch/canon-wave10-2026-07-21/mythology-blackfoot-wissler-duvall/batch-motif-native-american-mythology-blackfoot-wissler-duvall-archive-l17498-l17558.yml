  summary: The passage describes a naturally mummified body found in a copper mine
    at Chuquicamata, Chile, probably a male miner crushed by a cave-in. It attributes
    preservation partly to copper salts, notes the mine’s atacamite deposit, and says
    the body’s age is unknown but supposed pre-Columbian. The latter portion contains
    captions and page matter for terra cotta stamp designs from Colombia.
