canonical_text:
  quote: ''
  summary: 'The passage recounts several episodes involving Dzo''avits, Weasel, Mosquito,
    and the Weasel brothers. Weasel defeats a giant Dzo''avits in a throat-cutting
    contest with an obsidian knife, kills the giant''s wife, finds his older brother''s
    gray hair between the giant''s teeth, and restores the brother by tying the hair
    to a fire-drill. Mosquito later frees Indians from Dzo''avits'' bag and kills
    Dzo''avits in another throat-cutting contest. A Weasel brother defeats other dangerous
    beings through contests and reversals: wrestling a Dzo''avits into fire, pushing
    another from a mountain-rock, and surviving a bear family''s swinging-game before
    killing them and wearing the old bear''s skin.'
  language: English with some Latin phrases
  quote_policy: summarized
