canonical_text:
  quote: ''
  summary: The passage contains the end of a tale about a decapitated woman’s Head
    that follows her husband, performs camp work under a no-watching rule, kills a
    curious boy, and floats downriver; a tale titled “The Man Cut in two below the
    Waist,” in which a legless war-party survivor is carried homeward but abandoned
    on a raft; and most of a tale titled “The Ghost-Woman,” in which an unseen woman
    performs domestic tasks for a traveler, becomes his companion under a fire-related
    prohibition, and is revealed as bones after he threatens her with fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman whose husband had cut off her head is represented by the Head, which
    follows him and calls him her husband.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Head fixes lodges and the camp, dresses hides quickly under cover, and
    says that no one must watch her while she works.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A curious boy watches the Head; she says he has done wrong, chases him, kills
    him with a digging-stick, pursues the people, and then floats down a river current.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the second tale, a young man fetching water finds a man without legs, who
    says his war-party was killed except for him and asks to be taken home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young man carries the legless man, while the other men object that he
    would frighten children; when the legless man is fed, his food drops to the ground.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: At a large river, the legless man is placed on a raft; the swimmers let go
    of the raft ropes, reach shore, and the legless man floats downstream.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Ghost-Woman tale, a lone young man by a camp-fire tells an “Old woman”
    to mend moccasins, gather wood, and make bedding; these tasks are completed by
    an unseen helper.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: An unseen woman enters at night, asks where she should sleep, and later says
    the man must not look at her while she makes a fire.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: On the journey home, the man asks the Old Woman to make a war-lodge, fire,
    cooked food arrangements, and a bed; similar unseen help continues.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: On the fourth morning, the man sees a handsome woman, and she says she will
    live with him but he must never strike at her with fire.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: After living with the woman for a long time, the man angrily raises a stick
    from the fire as if to strike her; she covers herself with a robe, and when he
    lifts it there is only a skeleton, whose bones he buries.
  category: sequence
  evidence_refs:
