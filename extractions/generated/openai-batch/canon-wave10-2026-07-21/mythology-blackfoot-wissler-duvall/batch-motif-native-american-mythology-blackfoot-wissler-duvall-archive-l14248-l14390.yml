canonical_text:
  quote: ''
  summary: 'The passage contains several mythic episodes. Coyote kills and eats a
    horse obtained by trade, then kills a White trickster/White man through a sexualized
    violent trick. In another episode, Coyote transforms a red-willow stick into a
    pinto horse, wins a race with it, sells it, and the horse later appears only as
    a willow stick with a rope. Porcupine is captured by enemies but kills them with
    his quills, scalps them, and Coyote steals the scalps for his own household. The
    passage then begins the story of Lodge-Boy and Thrown-Away: the Sun warns a hunter
    in a dream about a visitor; the visitor eats only when food is placed on his chest,
    after which the pregnant wife falls dead; he removes twin boys from her womb and
    throws one into water and the other into the lodge entrance. The water-thrown
    child later emerges, scratches his brother, is captured by the father, and the
    brothers are reconciled. The twins revive their dead mother by making her stir
    meat, and later roll a hoop southward despite their father''s warning; the passage
    ends mid-action as they pursue it.'
  language: English
  quote_policy: summarized
