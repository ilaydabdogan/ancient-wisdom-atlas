canonical_text:
  quote: ''
  summary: 'The passage describes Maori textile and garment techniques: wool overlay
    on flax fabric, geometric and tufted patterns, garment-making superstitions concerning
    the aho thread, Kanekeneke rattling flax garments, Manaeko rain capes, Kahu-kuri
    dog-hair fighting mats, and Kahu feather cloaks. It also notes limited comparisons
    with Aleutian basket decoration and western North American robe or blanket materials.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wool overlay is made by catching wool thread under twining as the garment
    is woven, allowing the thread to pass over warps before re-entering the weave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The overlay technique produces line patterns, dots, tufted fringe, knots,
    circular and rectangular figures, borders, broken lines, zigzags, and triangular
    shapes in multiple colors.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says garment-making is connected with legends and superstitions,
    including evil omens if certain rules are disregarded.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: One stated rule is that the aho must be long enough to weave the full width
    of the cloak and must not become entangled or knotted.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kanekeneke are kilts and shoulder capes covered with rattling thrums made
    from strips of flax leaf.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The movement of a Kanekeneke wearer causes the flax thrums to clatter against
    each other.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Manaeko are rough capes of undressed flax used as shelter and rain coats,
