canonical_text:
  quote: ''
  summary: 'The passage closes one episode in which an old woman requires four sweat-houses
    to remove sand and lake-grass from her body. It then narrates the Otter-Woman
    episode: Chief-Level-Head finds his wife missing at the water, follows tracks
    to a beaver house, mourns, and receives her back from the lake with beaver songs,
    a medicine-bonnet, a bundle, and tobacco rites. A following episode explains how
    a wronged beaver-bundle owner receives help from Lizard, an old man, animals,
    and birds who obtain tobacco-seed from the sun; animal-planted tobacco succeeds,
    and tobacco-planting songs become part of beaver-medicine.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man finds the old woman and the boy on the bank, and the old woman tells
    him not to come near until he has made four sweat-houses.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman enters the sweat-houses one by one, and sand and lake-grass
    are found in each; the sweat-houses are said to get sand out of her body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chief-Level-Head, also called Buffalo-Lodge-Pole, is described as a great
    hunter and trapper who camps separately with his wife, Otter-Woman, in the far
    north.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chief-Level-Head returns from hunting with meat on two dog-travois and cannot
    find Otter-Woman in camp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the water place he finds Otter-Woman's robe, paunch pail, wooden cup, and
    bundle of wood, and he sees tracks going down into deep water toward a beaver
    house.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: He makes a raft of four poles, follows the tracks in clear water to the beaver
    house, concludes that Beaver has run off with the woman, and cries for seven days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man comes to him at night, says he has been sent, tells him to prepare a
    lodge because his wife is coming the next day, and tells him not to look out when
    she comes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The messenger sings songs identified in the passage as beaver-songs while
    Otter-Woman is coming up.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Otter-Woman comes out of the lake wearing a medicine-bonnet, accompanied by
    head men identified in brackets as beavers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The party transfers the bundle, medicine-bonnet, tobacco-plant, and other
    items to Otter-Woman and her husband over seven days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The following summer Chief-Level-Head plants tobacco-seeds as the Beavers
    directed, the tobacco grows well, and he later transfers the bundle to another
    man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In a separate episode, a man who owns a beaver-bundle is angry and grieved
    because others planted tobacco-seed without waiting for his return.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: A Lizard asks about the man's trouble, promises help, and directs him to go
    into the woods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: A very old man calls together many quadrupeds and birds, who prepare the ground
    for planting seed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Antelope and the Snow-bird offer the power of their dung to make the plants
    grow.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Three birds go toward the sun for tobacco-seed; two give out at clouds and
    change color, while the third reaches the sun, becomes black, and brings down
    the seed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: The assembled animals plant the new tobacco-seed with songs and ceremony,
    then fence the plot with rocks and sticks.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: The man returns to his people with many new songs and sings them in lodges
    when he hears beaver-men singing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: At harvest time, only the tobacco planted by the animals is growing; other
    plots have been trampled into the earth by buffalo.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:20
  text: The man gives his tobacco to his disappointed friends, receives the other
    beaver-bundles from them, puts the bundles together, and the tobacco-planting
    songs become part of the beaver-medicine.
  category: sequence
  evidence_refs:
  - ev:9
