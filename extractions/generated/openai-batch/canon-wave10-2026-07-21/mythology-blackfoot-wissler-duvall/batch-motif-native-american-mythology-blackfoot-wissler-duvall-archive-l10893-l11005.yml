canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Shoshone ceremonial dances: the absence
    or recent adoption of some dances among Shoshone groups; a Wind River buffalo-dance
    with painted female participants, a planted staff, ritual contact for good medicine,
    and buffalo impersonation; the Lemhi nu''akin seasonal dance for food abundance;
    and a translated nu''akin song with animal, rock, cloud, wind, and eagle imagery.'
  language: English with Indigenous-language terms and translated song fragments
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes Shoshone ceremonial organization as simple and reports
    no trace of age-societies; a Wind River wolf-dance is said not to be organized
    by supernatural-experience grouping and to correspond to the Lemhi ta'cayuge.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sun-dance is reported at Wind River and Fort Hall, but Lemhi elders said
    it had not been celebrated among them and associated it with fear of several days
    without food and drink.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the described Wind River buffalo-dance, dancers gather in a tipi, two female
    participants are brought to the center, and an old attendant replaces their clothing
    with sage-brush aprons.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The young girl in the buffalo-dance is covered with white clay and black spots,
    receives a staff, stretches out her arm, and plants the staff in the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dancers pass under the girl's arm, rush at her with a yell, lift and carry
    her, and bystanders touch her with hands and coup-sticks for good medicine.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A later part of the buffalo-dance has women impersonating buffaloes run into
    the bush, while men pursue, capture, and bring them back.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Lemhi nu'akin or ta-nu'in is described as a major former dance held for
    several days near late winter or early spring to ensure food, especially salmon
    and berries.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: For the nu'akin, a camp-circle is formed without a special lodge; men and
    women stand in the main ring, neighbors interlock fingers, and boys and girls
    form concentric circles.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nu'akin costume and paint include women's elk-tooth dresses or equivalents,
    face and hair paint, men's facial paint, white clay on forehead and hair, and
    eagle or magpie feathers in the hair.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The nu'akin uses no drum; dancers sing and move clockwise, women leave the
    circle when singing stops and resume with a new song, and the performance ends
    with a feast.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A Fort Hall grass-dance is described as similar to the nu'akin, with an interlocked
    circle of men and women, several days and nights of dancing, and the purpose of
    making grass grow.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The recorded nu'akin song includes translated images of a mountain-sheep's
    son, going out on a rock, a red ball cloud and wind, singers kneeling, and a white
    eagle's son.
  category: speech
  evidence_refs:
  - ev:9
