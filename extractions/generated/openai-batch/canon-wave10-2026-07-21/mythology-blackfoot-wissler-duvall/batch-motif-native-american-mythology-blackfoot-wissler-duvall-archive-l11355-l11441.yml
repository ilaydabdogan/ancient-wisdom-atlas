canonical_text:
  quote: ''
  summary: The passage records Shoshone and Bannock statements about miracle-working,
    the soul and its destinations after death, Enga-gwacu Jim's reported otherworld
    experiences and return to life, a belief in posthumous transformation into a silver-fox,
    and several ghost encounters involving skeleton-like apparitions, fear, strength
    transfer, and a spoken dismissal formula.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A term glossed as miracle-working is described as semantically uncertain and
    is also applied to tightrope walking, a beaded charm used by Coyote, and cat's-cradle;
    Shoshone skepticism about Indian miracle-workers and recent Bannock claims of
    wonder-working powers are noted.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The principle of life that departs at death is called mu'gua, and during life
    its seat is said to be in the head.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The common belief described is that a dead Indian's mu'gua rises to Wolf's
    house, where Wolf washes and revives it; while rising it looks like clouds and
    becomes more widely visible after washing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Half-way up, the rising mu'gua is met by a spirit descending on horseback,
    who escorts it to its proper place; the mu'gua then becomes a dzo'ap, or ghost.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Enga-gwacu Jim's reported experience, his mu'gua emerged from his thigh,
    looked back at his body, went underground, encountered a place where one of A'po's
    helpers was remaking dead men, heard and then briefly saw A'po, saw his body lying
    dead on earth, and returned alive.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In another reported experience, Enga-gwacu Jim went up to the clouds and found
    another world with sage-brush, inhabited by skeleton Indians among whom he recognized
    former friends.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some Shoshone are said to believe that one of Tendo's sons changed into a
    silver-fox after death, leading them to abstain from hunting such foxes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ghosts are described as greatly dreaded; examples include children frightened
    by the cry of dzo'ap, avoidance of an old cemetery at night, female ghosts seen
    by Jack Grouse, and a skeleton figure seen by his nephew and later interpreted
    as his father's wraith.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: An unnamed Shoshone reportedly resisted a ghost that tried to push him over,
    got his fingers between the skeleton's bare ribs, and afterward became very strong,
    with the suggestion that some of the ghost may have entered him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Enga-gwacu Jim addressed a skeleton-like apparition with a formula telling
    it it was only a ghost and to leave him alone; the figure turned and disappeared
    into the ground, and the same formula reportedly worked against an uncanny snake.
  category: speech
  evidence_refs:
  - ev:8
