  summary: The passage recounts episodes in which two boys or brothers pursue a hoop
    to the sea, encounter a water-buffalo, survive or recover from swallowing, escape
    imprisonment in a dark rock by rain, pass a giant’s bear-dogs, explain snow on
    mountains and death from old age, are carried by the giant bird Nii'neyunc to
    an island, receive aid from the bird’s mother and from Water-youths, avoid a water
    giant by being placed in a tree, and make mouths for a mouthless Owl tribe before
    returning home.
