canonical_text:
  quote: ''
  summary: 'The passage closes an account of a sun-dance-related buffalo-tongue confession
    ritual directed by the orphan later called Cuts-Wood, followed by his war-path
    counting-sticks and death omen. It then begins the tale of The Seven Stars: a
    young woman secretly has a bear lover; her little sister reveals this, the bear
    is killed, and after a forbidden touch during play the older sister becomes a
    bear, kills many people, and returns to human form.'
  language: English
  quote_policy: summarized
