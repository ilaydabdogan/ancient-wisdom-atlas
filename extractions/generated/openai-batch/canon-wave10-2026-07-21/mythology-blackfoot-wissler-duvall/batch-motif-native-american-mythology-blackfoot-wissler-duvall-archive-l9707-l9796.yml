canonical_text:
  quote: ''
  summary: 'The passage describes Shoshone war and peace customs: an eagle-feather
    standard in a drill-ride, scalp-dance practices, a brief reference to a Coyote
    myth involving recovery of a brother''s scalp, a war-party recruitment custom
    called wupa''rEk, pre-expedition lodge-to-lodge dances and prayers, and peace
    ratification through smoking, compensation, gifts, surrender of scalps, and reciprocal
    adoption of children.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a drill-ride, a standard of eagle feathers attached to a twelve-foot lance
    was borne alongside the chief.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The scalp-dance involved bringing a scalp to the village, elevating it on
    a central pole, dancing, and then giving the scalp to women and boys who paraded
    it and taunted it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: One account says only women danced in a circle around the central pole or
    tree from which the scalps were suspended, while men sang and beat a small hand-drum.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Women in the scalp-dance wore headbands ornamented with eagle feathers and
    heavily beaded capes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another account says seated men were approached and left in alternation by
    three or four women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage notes a myth in which Coyote, disguised as an old woman, enters
    an enemy camp to recover his brother's scalp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that men were always killed and scalped, while women were
    sometimes taken captive and at times were said to have been maltreated and butchered
    by Shoshone women.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage reports Bourke's mention of mutilating enemy corpses in revenge
    for a young warrior's death, but states that Ute heart-eating for courage had
    not been established among the Shoshone proper.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: An observed imitation of the custom called wupa'rEk involved about fifteen
    men holding the edge of a blanket, beating it with wooden sticks, and singing
    without changing positions or using a drum.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The older form of wupa'rEk was described as a prospective war-party or horse-raid
    leader and companions carrying a buffalo-hide from lodge to lodge; anyone who
    held and beat the hide was obliged to join the expedition.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In an 1840 account of preparations for an expedition against the Blackfoot,
    a chief announced the expedition, young men prepared equipment and food, and the
    chief led followers in a farewell dance at every lodge while receiving tobacco
    or other presents.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In an 1876 account, a Shoshone man mounted on a pony and almost naked went
    lodge to lodge at night, praying for the capture of many Sioux scalps and ponies,
    while lodge inmates responded vehemently.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Peace treaty ratification was generally marked by ceremonial smoking, possible
    horse indemnity for slain tribesmen, gifts to bereaved families, surrender of
    scalps, assurance that no scalp-dance had been performed, exchange of presents,
    and reciprocal adoption of children.
  category: sequence
  evidence_refs:
  - ev:9
