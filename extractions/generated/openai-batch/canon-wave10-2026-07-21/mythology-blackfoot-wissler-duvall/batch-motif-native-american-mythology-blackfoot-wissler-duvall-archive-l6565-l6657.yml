canonical_text:
  quote: ''
  summary: 'The passage continues a tale in which a chief''s daughter returns from
    the water, says her husband lives there, and establishes reciprocal offerings
    involving drowned buffalo and gifts thrown into water. Two women descend with
    her into the water, reach a dry lodge, hear a medicine-song, and receive instruction
    to make offerings to water-people when crossing streams. The passage then begins
    the tale of Red-Head: a red-haired man lives with his mother; a newly created
    woman who came from the ground seeks help from Ants, who make the first porcupine-quill
    embroidery on buckskin, a robe, and leggings.'
  language: English
  quote_policy: summarized
