canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a sister and younger brother are
    denied by their parents, ordered tied to a tree, and abandoned when the camp moves.
    A poor old woman arranges for her dog Shaggy to free them. The brother rapidly
    becomes a young man with power, produces a buffalo kill, feeds the starving camp
    while excluding his parents, and kills both parents with hard meat. The passage
    then begins a second tale about a poor old woman sleeping by a cliff whose dried
    meat and fat are eaten by rats from a hole in the rocks. A footnote reports related
    versions or renderings in other collections and traditions.
  language: English
  quote_policy: summarized
