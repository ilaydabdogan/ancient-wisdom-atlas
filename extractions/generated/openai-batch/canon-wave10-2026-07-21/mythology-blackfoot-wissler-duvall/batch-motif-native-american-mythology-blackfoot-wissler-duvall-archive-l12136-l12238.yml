canonical_text:
  quote: ''
  summary: Coyote questions an old woman about the killing of his older brother Wolf
    and the nightly dance with Wolf's skin. He kills the old woman, wears her skin
    as a disguise, enters the camp, retrieves Wolf's skin during the dance, escapes
    pursuit by disguises and transformations, and restores Wolf to life by returning
    the skin to the body. A following episode says that Wolf warned Coyote not to
    peep from their grass-lodge during battle; when Coyote looked out, Wolf was slain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote tells the old woman that his paint shows he came from a distant land
    in the East and asks what the people are doing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman says the Indians killed Coyote's older brother, took his scalp,
    and perform a scalp-dance every night.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The old woman describes her regular actions: walking behind because of age,
    being supported by girls, caring for children, saving part of her food, and dancing
    with Wolf''s skin after it is handed to her.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Coyote kills the old woman, removes and wears her skin, sees that he resembles
    her, and imitates her walk with a staff.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Disguised as the old woman, Coyote enters the camp, is supported by girls,
    sees his brother's skin on a pole, cries unseen beneath the skin, and copies the
    old woman's food behavior.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The girls notice that the disguised figure's eyes and later conduct resemble
    Coyote, and Coyote tells them not to mention Coyote.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the dance, Wolf's skin is tossed to Coyote; he puts it around his neck,
    dances, drops the old woman's skin, and runs away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: During pursuit, Coyote is shot at without being hurt, hides twice as old Coyote
    excrement in ground cavities, and later becomes a water-spider to cross a body
    of water.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
- id: obs:9
  text: Coyote carries his brother's scalp eastward, places it on an east-facing rock,
    goes to Wolf's buried body, and later covers the body with Wolf's skin and puts
    him together again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the following episode, Wolf warns Coyote not to peep from their grass-lodge
    during the fight; Coyote peeps, and Wolf is slain at that moment.
  category: sequence
  evidence_refs:
  - ev:8
