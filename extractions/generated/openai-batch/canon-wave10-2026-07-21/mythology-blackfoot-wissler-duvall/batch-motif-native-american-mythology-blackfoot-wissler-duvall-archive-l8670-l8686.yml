canonical_text:
  quote: ''
  summary: The passage reviews and rejects a theory that Shoshoneans formerly occupied
    the Plains and were driven westward. It cites Brinton as supporting a broad earlier
    Shoshonean range and Kroeber as rejecting that view on linguistic grounds. It
    presents absence of migration legends, cultural traits, lack of buffalo tales,
    and the mythological importance of coyote and wolf as evidence for long Plateau
    occupancy, while treating recorded westward Shoshone movements as local and Prairie
    cultural influence as late.
  language: English
  quote_policy: summarized
