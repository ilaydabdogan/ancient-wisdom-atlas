canonical_text:
  quote: ''
  summary: 'The passage closes a Big-Bear narrative with his later power, chiefship,
    water-making, long life, and surviving tent and knife. It then gives several ritual-origin
    accounts: a white mare gives a man a painted Horse-Lodge and teaches its songs
    and ritual; underwater lodges reveal medicine and ceremony for black-and-yellow
    buffalo-painted lodges; a Crow appears in a dream and transfers a lodge, medicine,
    songs, and ceremony; and a Sarcee hunter caught in a blizzard enters a bear den,
    is spared by bears, and begins receiving bear power and a knife ritual.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the people stopped trying to kill Big-Bear, he was kind to everybody,
    painted his lodge, became a great chief, fought successfully without being hurt,
    lived a long time, and had strong children.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When water was lacking, Big-Bear produced water for his parents by scrunching
    the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A poor married man owned a white mare and a white stud colt, later became
    rich in horses, and cared for the old white mare.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The White Mare spoke to the man, called him father, and said she would give
    him a lodge that he would see the next morning.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man found a lodge with the old white mare on the right side and the colt
    on the left side; the White Mare instructed him how to paint it.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The Horse-Lodge paintings included the old white mare, the colt, seven stars,
    bunch stars, the morning star, earth, hills, and fallen stars.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Inside the Horse-Lodge, the White Mare taught the man songs and ritual; the
    lodge and ritual were later transferred among Piegan, Blood, Northern Blackfoot,
    and Piegan owners, with ten horses given at one transfer.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Two men making arrows beside a river saw a lodge on the bottom of the water;
    one dived down, entered it, found no water inside, and saw much medicine hanging
    up.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The same man later entered another lodge under water and was taught the whole
    ceremony; this is stated as the beginning of the black-and-yellow buffalo-lodges.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A man catching eagles hid in a hole on a hill, slept, and dreamed that a Crow
    came and said it would give him its lodge, medicine, and songs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Crow transferred the lodge to the man and taught him the songs and ceremony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A mixed-blood Sarcee hunter lost direction in a blizzard, found a warm bear
    den, heard a Bear growl, and prayed to the Bear.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: A young male Bear pitied the young man, asked the father Bear not to harm
    him, and was told to give the man some of his power first.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Inside the bear den the man saw a lodge with a bearskin door, a rawhide bag,
