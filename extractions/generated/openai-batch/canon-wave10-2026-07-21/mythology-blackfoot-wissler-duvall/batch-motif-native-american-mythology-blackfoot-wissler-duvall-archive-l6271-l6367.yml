canonical_text:
  quote: ''
  summary: A young man fleeing a buffalo-bull is aided by Rabbit and Hawk powers,
    then by hawks who blind the bull. The bull bargains for restored sight, revives
    the man's dead horse, and gives power. The young man later enters a buffalo cave
    near the mountains, where buffalo live as people. After conflict with a jealous
    buffalo chief, he becomes a bull, kills the chief, and commands the buffalo to
    leave the cave and remain buffalo, explaining why buffalo no longer speak. Returning
    to his people, he cares for a poor old couple and repeatedly turns a moccasin
    into a buffalo-calf for food. A human chief seeks him as a son-in-law, and the
    youngest daughter marries him.
  language: English
  quote_policy: summarized
