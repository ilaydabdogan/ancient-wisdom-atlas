canonical_text:
  quote: ''
  summary: 'The passage gives several Old Man episodes: a river episode involving
    a muskrat, a lariat, and a sleeping female beaver; Old Man making buffalo laugh
    until one dies; Old Man giving and reclaiming a robe from a rock, being pursued
    by the rolling rock, and being aided by night-hawks; Old Man retaliating against
    young night-hawks and then escaping older night-hawks through a man’s medicine
    leggings that make fire; and Old Man leading deer and elk people in games until
    he tricks many animals into jumping from a high bank, while sparing some pregnant
    females.'
  language: English
  quote_policy: summarized
