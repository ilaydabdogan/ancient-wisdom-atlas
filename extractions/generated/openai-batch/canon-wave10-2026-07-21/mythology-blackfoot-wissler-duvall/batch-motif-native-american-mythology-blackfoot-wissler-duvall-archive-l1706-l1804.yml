canonical_text:
  quote: ''
  summary: The passage contains two Old Man episodes. In the first, Old Man, lacking
    eyes, has a girl lead him, attaches hoof-rattles to her dress to track her, and
    falls into the river when she removes and throws the rattles away. He then borrows
    one eye from Coyote, frightens people because one socket remains empty, blames
    Coyote, and takes Coyote's other eye. Editorial notes compare the eye-loss and
    eye-borrowing pattern with other cited versions and related Arapaho and Gros Ventre
    tales. In the second episode, Old Man steals medicine leggings from a lodge owner,
    twice wakes back in the owner's lodge with the leggings on his back, and is finally
    given the leggings with instructions that they are to be used for hunting because
    they make brush catch fire when worn while running around game.
  language: English
  quote_policy: summarized
