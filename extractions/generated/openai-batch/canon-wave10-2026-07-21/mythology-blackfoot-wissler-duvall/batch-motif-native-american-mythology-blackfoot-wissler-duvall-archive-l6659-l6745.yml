canonical_text:
  quote: ''
  summary: 'The passage first gives the close of a quillwork-origin narrative: Red-Head
    asks a young woman to make decorated moccasins and a shirt; she says quillwork
    is her medicine and must not be watched, takes the work to Ants, receives completed
    items, and is instructed by Weasel about designs. The designs are explained as
    representing the sun, weasel trails, and places trampled by weasels. Weasel then
    tells her not to marry Red-Head but to kill him with a sharpened bone; she does
    so, runs to the Piegan, and teaches them quillwork. A footnote records variant
    accounts involving Weasel instructions, weasel suits, war-bonnets, and design
    meanings. The passage then begins “The Meeting in the Cave,” in which a Snake
    hunter and a Piegan hunter independently use the same cave, meet in the dark,
    identify each other by signs, play a stick-game the next morning, and the Piegan
    wins the Snake’s possessions, hair, and scalp.'
  language: English
  quote_policy: summarized
