canonical_text:
  quote: ''
  summary: The passage contains the end of a Dzoavits episode, the tale titled “The
    Sheep-Woman,” and the opening of “Thunder.” In the first fragment, two brothers
    find their sister in Dzoavits’ lodge, kill Dzoavits, rescue her, and later lose
    her when her hair catches fire. In “The Sheep-Woman,” a wife connected with mountain-sheep
    tracks is tricked by two brothers who turn into sheep; she pursues them to Coyote’s
    people, where Grasshopper kills a baby sheep and becomes her new husband after
    a hide test. In the opening of “Thunder,” Rabbit wants Thunder’s wife despite
    his grandmother’s warning.
  language: English with one brief Latin phrase
  quote_policy: summarized
