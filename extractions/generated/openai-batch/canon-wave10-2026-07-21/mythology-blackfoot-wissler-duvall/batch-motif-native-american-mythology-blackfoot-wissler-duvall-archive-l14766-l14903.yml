  locator: lines 14803-14825
  quote_or_summary: In “The Sheep-Woman,” two brothers live with their wife. The older
    brother repeatedly follows a mountain-sheep trail around the mountain back toward
    the lodge. The wife goes out for roots but brings none, saying her baby cries
    and must be nursed.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/mythology-blackfoot-wissler-duvall.md
  rights_note: Public domain source; summary based on supplied passage.
