  type: summary
  locator: lines 14826-14842
  quote_or_summary: The younger brother watches from the mountain summit. His guardian
    spirit tells him to build a big fire. He sees the woman coming along and making
    sheep-like tracks; later he remembers and tells his brother.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/mythology-blackfoot-wissler-duvall.md
  rights_note: Public domain source; summary based on supplied passage.
