  type: summary
  locator: lines 14844-14861
  quote_or_summary: The brothers decide to trick the wife by turning themselves into
    mountain-sheep near the lodge. The woman sees them, shoots at them, and pursues
    them across the mountains as they repeatedly escape.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/mythology-blackfoot-wissler-duvall.md
  rights_note: Public domain source; summary based on supplied passage.
