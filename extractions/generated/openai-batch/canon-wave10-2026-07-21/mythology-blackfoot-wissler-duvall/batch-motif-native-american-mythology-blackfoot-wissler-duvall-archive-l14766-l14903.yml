- id: motif:1
  label: abducted sister recovered from antagonist husband
  taxonomy_refs:
  - stolen_beloved
  basis: The sister disappears, the older brother says Dzoavits has taken her, and
    the brothers find her as Dzoavits’ wife before killing him and carrying her away.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage begins mid-episode, so the initial taking of the girl is only
    summarized through the brother’s statement.
- id: motif:2
  label: sibling pair rescue with younger sibling disobedience
  taxonomy_refs:
  - sibling_pair
  basis: The two brothers act together to recover the sister, but the younger brother’s
    actions cause or contribute to both the disappearance and the later fatal fire.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The brothers’ exact ages and prior narrative context are not fully present
    in the excerpt.
