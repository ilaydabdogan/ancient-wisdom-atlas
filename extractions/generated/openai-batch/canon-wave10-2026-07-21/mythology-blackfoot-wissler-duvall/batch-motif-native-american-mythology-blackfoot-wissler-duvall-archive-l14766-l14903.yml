  type: summary
  locator: lines 14863-14887
  quote_or_summary: The woman reaches Coyote’s people and reports the sheep. Coyote
    paints himself and organizes a hunt. Grasshopper disguises himself with a moccasin
    patch, shoots the baby sheep, and later the woman marries him when her testing
    stick breaks on his sheep-skin. Coyote is jealous.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/mythology-blackfoot-wissler-duvall.md
  rights_note: Public domain source; summary based on supplied passage.
