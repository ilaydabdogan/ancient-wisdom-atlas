canonical_text:
  quote: ''
  summary: 'The supplied passage contains several short narratives and notes: a Ghost
    borrows a household pail and returns it with objects said to be meat before a
    buffalo-cow appears; Coyote feeds two starving lost brothers and guides them home
    after receiving a promise of future entrails; a rancher''s daughter finds a skeleton,
    her father revives it, and the revived Piegan marries her and later returns to
    his people riding tame buffalo; the next Kutenai story begins with a good man
    whose spirit goes to the land of the dead, accompanied by notes on Blackfoot-Kutenai
    ceremonial exchange and a Grinnell parallel for the buffalo-riding tale.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man camping with his family hears a night voice ask to borrow his pail for
    the speaker's mother.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pail is returned with a voice saying its contents are meat, but the family
    sees a boiled piece of an old lodge-cover.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Ghost borrows the pail again and returns it saying it contains ribs and
    tripe, but the family sees old bones and sticks of wood without meat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the man says he cannot eat the contents, the Ghost says he will send
    out a young man to kill game; the next morning a buffalo-cow is found lying on
    the ground.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A young man and his little brother are lost on the prairie, out of food, and
    starving when they find Coyote eating.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The older brother asks Coyote to feed the little brother and promises always
    to leave entrails for Coyote when he hunts.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Coyote tells the brothers they will be safe, instructs them not to watch him,
    and tells them to shut their eyes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The brothers hear Coyote singing that he is looking west for something to
    eat; after they open their eyes, Coyote has a buffalo-calf.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: As Coyote travels along a ridge toward the brothers' home, meat repeatedly
    falls over the ridge, and Coyote takes them home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A white rancher has many tame buffalo, some of which he rides like horses.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The rancher's unmarried daughter finds a skeleton on a river-bank after high
    water has washed it out.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The daughter asks her father to make a sweat-house and doctor the skeleton,
    saying she will marry it if it becomes a man and keep it as a chum if it becomes
    a woman.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The skeleton comes to life through the father's doctoring, proves to be a
