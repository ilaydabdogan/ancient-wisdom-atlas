canonical_text:
  quote: ''
  summary: The passage is an anthropological catalogue-style discussion of Arctic
    and Eskimo material culture collections. It compares artifacts from Prince Albert
    Land, the Mackenzie River, Pond's Bay, Eclipse Sound, Cumberland Sound, Hudson
    Bay, Netchillik, King William Land, Alaska, Siberia, and St. Lawrence Island.
    Items described include knives, bows, arrows, garments, kayak models, drums, masks,
    pipes, slate blades, needle cases, an ivory piece with pictographs, and a caribou-tooth
    ornament.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening discussion states that a small collection shows similarities to
    Alaskan Eskimo culture and Central Eskimo culture, with specific comparisons made
    for bow construction, arrows, a woman's knife, and garments.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A small purchased collection from the mouth of the Mackenzie River includes
    kayak models, an Eskimoan hand drum, snow probes, bone needles, horn spoons, wooden
    gambling sticks, and a bow with a quiver full of arrows.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Mackenzie River arrows are described as two-feathered, with several bird-arrow
    point forms and heavier barbed arrows; the bow is wooden, single-curved, and backed
    with sinew cables; the quiver has red-line ornamentation and a small pocket containing
    sinew.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A collection from Eskimo near Pond's Bay and Eclipse Sound is said to have
    general Central Eskimoan characteristics and minor details peculiar to Cumberland
    Sound collections.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Four leather masks from the Pond's Bay collection are described; two resemble
    a Cumberland Sound mask described by Boas and have white sealskin borders, black
    faces, curved forehead bands, radiating lines, and fur eyebrows, while the other
    two lack radiating lines and have hairy lips, with one having squinting eyes.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Eight stone pipes are reported in the Pond's Bay collection, most brass-bound
    and identical in form to examples described from the west coast of Hudson Bay.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage describes a throwing board, numerous slate blades and points,
    triangular woman's knife blades, long narrow straight-backed blades resembling
    Alaskan knives, triangular slate points with perforations, and a complete slate
    harpoon head.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: A rectangular bone needle case, apparently an old specimen from a camp site,
    is compared in cross-section to a Netchillik case and a King William Land specimen,
    while its decoration uses dots rather than lines.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: A small curved ivory piece has delicate pictographs on its sides; the specimen
    is weathered and incompletely restorable, but the author compares it to Alaskan
    art.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: A peculiar ornament has four rows of caribou teeth arranged on a rectangular
    two-color mat and backed by membrane, with the only similar specimen known to
    the author coming from St. Lawrence Island, Alaska.
  category: object
  evidence_refs:
  - ev:10
