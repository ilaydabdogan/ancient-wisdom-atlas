canonical_text:
  quote: ''
  summary: The passage describes fishing techniques and plant-food preparation among
    Wararika and Shoshone groups, including spearing, nets, dams, weirs, baskets,
    medicine song during a fish drive, seed and berry processing, root-digging implements,
    and cooking or storage methods for roots and other plant foods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Wararika fishing scene involves fifty to a hundred men wading, spearing
    fish, erecting scaffolds, standing on rocks, using scoop-nets, and stretching
    netting in narrow channels.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Youngsters carry fish home, where women clean and prepare them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Shoshone fish dam is made from rocks and willow wattle-work so that water
    passes while solids are retained.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two or three watchmen guard the fishing spot while the rest of the party travels
    downstream, enters the water, and ascends the current.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Shoshone fishing party lashes the water with long poles while joining
    in a medicine song, driving trout toward the dam for capture in sacks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Fishing nets include leaded lines made with grooved stones, reed floats, and
    twine made from the outer bark fiber of a weed.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A weir-and-basket fish trap blocks channels with tree trunks and willow stakes,
    with long tapering baskets set near apertures in the weir.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The trap baskets are narrow at the lower end so fish cannot turn around, and
    fish are removed by untying the small ends of the longitudinal willows.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says the Shoshone depended considerably on vegetable food and
    that this contributed to the name “Diggers” for portions of the tribe.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Seeds and berries are gathered, pounded, ground, mixed, roasted, dried, formed
    into cakes or bread, and stored.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Women use digging-sticks or horn-and-stick implements for gathering roots;
    observed digging-sticks are also described as iron tools with handles or knobs.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Roots such as yampa, Valeriana edulis, camass, prairie-turnip, and an unidentified
    white root are eaten, dried, pounded, baked in the ground, cooked with hot stones,
    or boiled.
  category: action
  evidence_refs:
  - ev:8
