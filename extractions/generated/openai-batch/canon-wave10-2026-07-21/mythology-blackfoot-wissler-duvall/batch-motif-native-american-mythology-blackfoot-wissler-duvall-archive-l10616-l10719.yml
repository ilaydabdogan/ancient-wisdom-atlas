literal_observations:
- id: obs:1
  text: Children were named by their parents at about ten or twelve years of age,
    though an old man could sometimes bestow his name on a young person.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Girls could be called after different species of frogs, while children were
    not named after dog, wolf, coyote, or fox.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Individual peculiarities and notable achievements could be reflected in names,
    and a new name could be assumed after a notable achievement.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Tɨndoy, translated as Climber, was said to have received that name because
    as a child he became angry and climbed a tree after his mother refused him a request.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A chief visited by Lewis and Clark had two names and bestowed his second name
    on Clark as a token of friendship toward whites.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Lemhi people were described as reluctant to divulge their native names.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: In recent times the handshake is described as the symbol of friendly welcome
    when receiving white and Indian visitors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'A hundred years earlier, an embrace was described as customary: the host
    placed the left arm over the guest''s right shoulder, clasped the back, touched
    the left cheek to the guest, and repeatedly shouted an expression interpreted
    as joy.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The common Lemhi Shoshone pipe type described has a narrow currant or rose-brier
    stem and a small red-stone bowl.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The manufacture of the pipes was said to be a monopoly of a few men.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Large catlinite pipes were rare, and pouches containing specimens were said
    to have been obtained from the Blackfeet.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Shoshone were said never to have cultivated tobacco, obtaining it from
    eastern neighbors and southern Shoshone bands according to Lewis.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Informants said the Shoshone used kinikkinik obtained by drying leaves of
    dzi'ampi and also used red-willow bark.
  category: object
  evidence_refs:
  - ev:7
