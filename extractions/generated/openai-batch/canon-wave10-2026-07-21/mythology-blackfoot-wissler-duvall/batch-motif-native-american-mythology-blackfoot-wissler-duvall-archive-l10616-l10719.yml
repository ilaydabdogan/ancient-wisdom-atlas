  summary: 'The passage describes various customs attributed mainly to Bannock, Shoshone,
    and Lemhi Shoshone contexts: naming practices, reluctance to disclose native names,
    forms of salutation, pipe types, pipe manufacture, tobacco sources, and kinikkinik
    use.'
