canonical_text:
  quote: ''
  summary: The passage contains several adjacent animal tales. Skunk searches for
    and recovers his missing anus, kills and robs Indians with his filth, and is killed
    by wolves. In another tale, Coyote traps and kills Skunk, cuts off his anus, and
    gives it to Indians, who spear it until Skunk wakes again, recaptures it through
    a hidden hole, mends it, and thereby loses much of his former lethal power. In
    a further tale, Mountain-Lion frightens Skunk by whistling after Skunk declares
    whistling his only fear, then evades Skunk's arrows. The final partial tale says
    Bull-Frog carried off Elk-woman's son, but the bird Hi'to tells the boy his true
    mother lives in the mountains and helps him flee.
  language: English
  quote_policy: summarized
