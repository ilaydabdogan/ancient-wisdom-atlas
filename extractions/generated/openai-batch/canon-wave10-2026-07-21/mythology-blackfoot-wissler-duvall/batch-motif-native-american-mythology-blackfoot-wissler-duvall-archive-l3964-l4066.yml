canonical_text:
  quote: ''
  summary: The passage gives several Blackfoot accounts of the origins and use of
    beaver-related medicine. In one account, Beaver enters a purified lodge, sings
    for animal skins, and the man learns the songs and makes a medicine bundle. In
    a North Piegan version, a woman receives a bundle from Beavers, and her husband
    learns songs, painting, and ceremonial directions through dreams; further dreams
    explain sun-dance items and rules, including a head-dress, elk robe, and annual
    tobacco planting. In a Piegan version, an old woman and child drown or sink while
    crossing the Yellowstone River, are taken by Beaver to an underwater lodge, are
    defended from Otter and other animals, and return with songs and power that begin
    Crow-water medicine.
  language: English
  quote_policy: summarized
