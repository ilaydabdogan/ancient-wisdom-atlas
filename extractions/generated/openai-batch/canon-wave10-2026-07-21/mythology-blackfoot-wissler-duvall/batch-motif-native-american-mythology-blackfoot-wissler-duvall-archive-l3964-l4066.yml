- id: obs:3
  text: The man gathers the skins taken by Beaver, makes them into a bundle, and keeps
    the beaver-medicine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the North Piegan version, the wife is invited down to the Beavers' lodge,
    later returns to her own lodge burning incense, and identifies a large bundle
    as given by the Beavers.
  category: sequence
  evidence_refs:
  - ev:3
