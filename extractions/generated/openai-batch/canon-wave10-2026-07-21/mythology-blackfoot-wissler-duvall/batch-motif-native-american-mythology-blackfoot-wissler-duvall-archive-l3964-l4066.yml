  - ev:5
- id: obs:8
  text: A head-dress is given in a dream for the woman who vows to give the sun-dance,
    and an elk later gives a robe for the woman who gives the sun-dance.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tobacco is kept in the beaver-medicine bundle and must be planted every year
    by a woman wearing the head-dress and carrying a digging-stick, while songs are
    sung.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Piegan version, an old woman and her little son cross the Yellowstone
    River on a raft made from a lodge covering, the rope breaks, the raft sinks, and
    they are believed drowned.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The old woman says Beaver pulled her and the boy into his lodge under the
    water, where they were safe and saw many other animals.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Otter proposes killing and eating the woman, but Beaver argues that she and
    the boy were drowning, took pity on them, and prevails over the other animals.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Beaver tells the old woman that she will have great power, live long, and
    receive songs; after returning, she starts Crow-water medicine and keeps the first
    beaver-skin that comes into her hands for medicine.
  category: sequence
  evidence_refs:
