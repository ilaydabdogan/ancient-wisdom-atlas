canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which a giant bird or black monster
    carries off a White sheep-raiser, who kills the monster and its son and takes
    tail feathers. It then presents the tale of a poor boy and his speaking colt:
    the boy finds the colt and gold by a pond, wins repeated races against a Chief
    with Coyote as ally, survives a fire-riding contest, captures a gigantic horse
    with the colt''s help, and crosses a sea to bring back a young woman.'
  language: English
  quote_policy: summarized
