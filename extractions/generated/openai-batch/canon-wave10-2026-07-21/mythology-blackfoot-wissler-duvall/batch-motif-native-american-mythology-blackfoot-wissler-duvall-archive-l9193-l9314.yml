canonical_text:
  quote: ''
  summary: The passage describes Northern/Lemhi Shoshone economic life as seasonally
    divided between salmon fishing on Columbia tributaries and buffalo hunting east
    of the Rocky Mountains, with details on horseback hunting, antelope relay pursuit,
    animal-skin stalking, poisoning of points or spears, small-game trapping, communal
    distribution under scarcity, and salmon fishing with spears, nets, weirs, barriers,
    and torches.
