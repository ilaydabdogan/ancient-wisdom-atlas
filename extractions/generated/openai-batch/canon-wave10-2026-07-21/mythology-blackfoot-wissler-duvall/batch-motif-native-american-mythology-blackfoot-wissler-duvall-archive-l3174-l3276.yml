canonical_text:
  quote: ''
  summary: 'The passage concludes a star myth in which a woman and her boy return
    from the sky through a hole. Morning Star warns her that the child must not touch
    the ground before the proper time and tells her to mark his sign on her lodge.
    After a grandmother’s lapse, the child disappears, leaving a puff-ball, and a
    new star appears in the sky-hole; this is given as the origin of the Fixed Star,
    lodge paintings, and medicine-woman leadership in the sun-dance. The passage then
    begins the Scar-Face tale: a poor scarred young man, rejected by a chief’s daughter,
    sets out to seek the Sun and is warned by a black cave-dweller near the Sun’s
    lodge.'
  language: English
  quote_policy: summarized
