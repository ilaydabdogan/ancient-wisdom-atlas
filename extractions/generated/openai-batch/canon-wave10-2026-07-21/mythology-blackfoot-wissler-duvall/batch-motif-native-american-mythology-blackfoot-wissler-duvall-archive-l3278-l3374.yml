canonical_text:
  quote: ''
  summary: Scar-Face travels to the dwelling of Sun. Morning Star, Sun's son, brings
    him to the lodge and asks Moon to receive him. Moon hides Scar-Face under cedar
    as Sun approaches; Sun smells the visitor, orders a cedar smudge, sees Scar-Face,
    and takes pity on him. Sun makes a sweat-house, wipes a metal disk at the back
    of his head, and brings Morning Star and Scar-Face inside; afterward the two boys
    look alike. Moon mistakes Scar-Face for Morning Star, and Sun gives Scar-Face
    a new name based on that mistake. Sun permits Scar-Face to travel in sky-land
    except west or straight down. Scar-Face persuades Morning Star to go west, where
    seven white geese attack; Scar-Face kills them with his club and later brings
    their heads as proof. A parenthetical note identifies this as the origin of scalping.
    In a later western excursion, seven cranes attack; Scar-Face uses his robe as
    protection and strikes them with his club before the excerpt breaks off.
  language: English
  quote_policy: summarized
