canonical_text:
  quote: ''
  summary: The passage closes one origin account in which an old bull restores a man
    from a remaining bone in a sweat-house and grants ritual powers, leading to the
    founding of the Bull, Horn, and Matoki societies. It then gives a North Piegan
    version in which Black-Crow, a buffalo-powered young man who becomes a cow, and
    a calf use deception, animal transformation, dance regalia, bonnets, and sticks
    to lead buffalo away from White-Crow. The account ends by explaining features
    of the Horn Society and medicine-dance roles.
  language: English
  quote_policy: summarized
