literal_observations:
- id: obs:1
  text: A hide-smoking apparatus is described as a crossbeam, two poles, a hole near
    a tree, and a fire; a deerskin was sewn into a hollow cylinder and staked around
    the firehole.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: During one witnessed smoking process, a woman built a fire of wooden shavings
    in an excavation, and smoke yellowed the inner surface of the skin after ten to
    fifteen minutes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Shoshone are reported as using white, yellow, and brown buckskin; yellow
    and brown tints are attributed to drying over smoldering willow fires of different
    kinds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pottery is reported through informants and cited writers, including earthen
    or soft-stone jars, cylindrical kettles, and water-jars with stoppers.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Women are described as frequently using a bow-shaped loom notched at both
    ends for beadwork; the Shoshone frame is contrasted with more generally rectangular
    looms.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Most Shoshone bead sewing is described as lacking a definite stitching system,
    while two museum specimens show vertical bands with a ridged effect compared to
