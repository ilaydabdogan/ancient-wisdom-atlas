    cups, and hats worn by women on the march.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Shoshone clothing is described as Plains-style; blanket robes were used by
    both sexes, usually made from dressed animal skins and worn over the shoulders.
  category: object
  evidence_refs:
  - ev:7
