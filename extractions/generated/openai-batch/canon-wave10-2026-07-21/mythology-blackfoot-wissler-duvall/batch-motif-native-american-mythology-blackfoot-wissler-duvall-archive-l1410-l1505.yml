canonical_text:
  quote: ''
  summary: Old Man gives his robe to a large rock, later tries to reclaim it, and
    takes it back when the rock refuses. The rock rolls after him and Fox; Bears and
    Buffalo-bulls are crushed trying to stop it, while Night-hawks break it apart.
    Old Man then injures the Night-hawks' young, and the adult Night-hawks retaliate
    by soiling his robe until he loses it in a river. In the next tale, Old Man joins
    Squirrels' hot-ash game, spares one expectant squirrel, and roasts the others
    to death.
  language: English
  quote_policy: summarized
