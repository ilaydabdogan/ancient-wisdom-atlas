canonical_text:
  quote: ''
  summary: 'Wolf and Coyote debate primordial human conditions. Wolf proposes an easier
    order without hunting difficulty, death, menstruation, or sexual birth, while
    Coyote''s contrary choices establish present conditions: hunting, death, mourning
    customs, an other-world destination for the dead, menstruation, and uterine birth.
    A second episode presents Wolf and his younger brother Coyote living together;
    Coyote ignores warnings concerning their aunt Bear, is wounded by her, and is
    healed by Wolf. Wolf kills Bear in revenge, but Coyote disobeys instructions while
    butchering her body, after which Wolf predicts attacks by hostile Indians. Enemy
    Indians later attack; Coyote fights, Wolf is killed and scalped after Coyote''s
    jealous wish, and Coyote pursues the enemies, mourning, leaving quivers, questioning
    a speaking body part, and disguising himself before meeting an old woman. The
    passage ends abruptly.'
  language: English with some Latin phrases in the source passage
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wolf wanted life to be easy and pleasant for the Indians, while Coyote released
    the game so people would have to hunt.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wolf said the Indians should not die, but Coyote said they must die; after
    a sick Indian died, Coyote taught crying, hair-cutting, and that the dead go to
    another world.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wolf proposed no menstruation, but Coyote used blood on his daughter so that
    she began menstruating and went to a menstrual lodge; the passage states that
    present conditions follow Coyote's wishes regarding menstruation and birth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wolf and his younger brother Coyote lived together, and Wolf warned Coyote
    not to visit their aunt Bear because he feared Coyote would misbehave.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Coyote went to Bear's wikiup, attempted intercourse with her while she was
    cooking, and Bear wounded him before running away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Wolf found Coyote wounded, rebuked him, treated and cured him, then killed
    Bear in anger and ordered Coyote to bring her body back with its inside intact.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Coyote skinned and butchered Bear but removed an unidentified body part called
    the he'gwi; Wolf said the most important part was missing and warned that hostile
    Indians would attack them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hostile Indians surrounded Wolf and Coyote's home; Coyote fought alone while
    Wolf stayed indoors dressing and painting himself.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Coyote became jealous of Wolf's fine appearance and wished the enemy would
    kill him; Wolf was then shot, killed, scalped, and stripped of his dress, while
    Coyote fled.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Coyote made arrows, found and buried Wolf's body, cried, tracked the enemy
    through abandoned camp-sites, saw scalp-poles, and left quivers at several places.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Coyote asked his anus when the enemy had left a camp and received an answer;
    later he painted his cheeks to avoid recognition and sat beside an old Indian
    woman.
  category: sequence
  evidence_refs:
  - ev:11
