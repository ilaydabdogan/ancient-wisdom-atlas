canonical_text:
  quote: ''
  summary: The passage contains pursuit tales in which stolen fire, food, and pine-nuts
    are carried away from Crane's people. Coyote, Hai, Rock-squirrel, Jack-rabbit,
    Woodpecker, Rats, and others participate in theft, pursuit, concealment, death,
    revival, and etiological distribution of fire and pine-nuts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Crane's people could not start a fire, found their food-sack empty, and began
    pursuing the departed Indian visitors at Crane's command.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote wore war-dress, kept at the rear of the fleeing line, was repeatedly
    shot at, lost his hair to arrows or shots, but was not hurt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Coyote hid first in an old track and later in a pile of old excrements while
    the enemy searched for him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When exhausted, Coyote gave the food and fire to the men ahead of him; the
    enemy overtook, killed, and skinned him but did not find the stolen property.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Crane's people killed the fleeing Indians one by one; Jack-rabbit hid in a
    hole; Hai and Rock-squirrel were left carrying the food and fire respectively.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hai wished his leg would rot, put the food into the rotted leg, and after
    being kicked the leg flew or ran away by itself.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hai wished for rain and snow behind him; the weather effaced the track, and
    the leg went westward scattering pine-nuts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Rock-squirrel carried the fire by his breast, jumped from a steep cliff, threw
    firesticks over the mountains, and addressed the fire as something everyone would
    use.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The narrative states that Rock-squirrel's action is how all the Indians got
    fire.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: Crane stopped the pursuit, went to the river with Chickadee, and turned into
    the bird he is now.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Jack-rabbit came from his hiding place, struck Coyote and then every one of
    the Indians with his whistle, and they came back to life.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the pine-nut episode, pine-nut food hung from the top of a pole; the Rats
    tried unsuccessfully to climb up, and Woodpecker with his brother made a hole
