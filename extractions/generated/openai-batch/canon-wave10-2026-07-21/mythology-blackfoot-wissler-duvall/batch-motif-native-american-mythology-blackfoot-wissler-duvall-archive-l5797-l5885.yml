canonical_text:
  quote: ''
  summary: A woman agrees, silently and as a sacrifice for her hungry people, to marry
    the leader of the buffalo herd after he offers to drive the herd over. Birds herald
    the arrival of Scabby-Bull, who claims her mental promise and takes her away.
    Her husband mourns and seeks help from living beings. Bluebird, Blackbird, Ant,
    an old couple, and Prairie-chicken successively give information, powers, medicine,
    and guidance for approaching and killing Scabby-Bull.
  language: English
  quote_policy: summarized
