canonical_text:
  quote: ''
  summary: 'The passage compiles reported mourning and funeral customs: lamentation
    for a deceased medicine-man, decorated horses and goods buried or destroyed, a
    corpse tied to a favorite horse and driven into a river toward the land of souls,
    the killing of a chief''s wife and horses, grave mourning songs, hair cutting,
    scarification, property distribution or burning, abandonment of dwellings, following
    the dead person''s former paths, and removal of a dying person to an isolated
    shelter.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the death of a Lemhi medicine-man in 1906, people lamented him for four
    or five days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three horses were decorated with ribbons, mirrors, feathers, and blankets;
    after the corpse was put in the ground, the finery was buried and the horses were
    killed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In De Smet's account, relatives' hair is cut, horses' manes and tails are
    docked, possessions are piled in the lodge, tent-poles are cut up, and property
    is burned.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In De Smet's account, the corpse is tied to the man's favorite horse, the
    horse is driven into a river current, and warriors tell the horse to carry the
    master to the land of souls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Remy's account, after two horses were sacrificed, a chief's wife stepped
    on her husband's tomb, had her hair cut by the husband's brother, was shot through
    the heart, and was buried with the husband; her hair was hidden at a distance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The mother of the deceased prostrated herself at the grave every evening and
    sang a mourning song.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mourning women gashed their legs and cropped their hair; sometimes arms and
    ears were scarified. Men usually clipped hair at the back of the neck, with one
    cited case of a man cutting all his hair quite short.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The deceased person's personal property was distributed or burned; the deceased
    person's lodge was abandoned; some survivors followed the dead relative's former
    paths, a practice called hunting the dead; a sick person could be moved to a solitary
    shelter to avoid abandoning a dwelling after death.
  category: sequence
  evidence_refs:
  - ev:7
