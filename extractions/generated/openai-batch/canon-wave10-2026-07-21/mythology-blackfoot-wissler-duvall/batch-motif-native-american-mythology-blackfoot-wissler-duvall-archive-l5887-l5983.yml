candidate_motifs:
- id: motif:1
  label: Rescue of a stolen or captive wife
  taxonomy_refs:
  - stolen_beloved
  basis: The man seeks and retrieves his wife from Scabby-Bull, who keeps and threatens
    her.
  evidence_refs:
  - ev:1
