- id: motif:2
  label: Transformation into animal and insect forms for escape and approach
  taxonomy_refs:
  - shapeshifter
  basis: The man becomes a prairie-chicken and winged ant; the woman becomes a winged
    ant; both later become prairie-chickens and then humans.
  evidence_refs:
  - ev:2
  - ev:6
  confidence: high
  cautions: The transformations are powers granted or mediated by helpers rather than
    inherent traits of the human figures.
- id: motif:3
  label: Animal helpers guide and empower a human rescuer
  taxonomy_refs:
  - culture_hero
  basis: Prairie-chicken directs the man, Ant grants transformation power, worms or
    ants help the woman complete her task, birds support her cover story, and bluebird
    warns the fugitives.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
  - ev:7
  confidence: medium
  cautions: The man is not explicitly named a culture hero in this passage; the motif
