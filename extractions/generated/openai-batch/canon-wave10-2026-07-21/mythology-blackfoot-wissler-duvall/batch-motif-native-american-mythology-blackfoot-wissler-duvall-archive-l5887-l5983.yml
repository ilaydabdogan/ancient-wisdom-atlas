- id: motif:4
  label: Pursuit delayed by discarded objects or garments
  taxonomy_refs:
  - return
  basis: During the return flight, the woman discards moccasins and garments, and
    the buffalo stop at each item before gaining again.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The available taxonomy has no direct discarded-object pursuit motif; 'return'
    is used only for the escape-homeward sequence.
- id: motif:5
  label: Refuge in a tree during attack
  taxonomy_refs:
