canonical_text:
  quote: ''
  summary: A man, aided by Prairie-chicken and Ant, gains the power to take animal
    and insect forms in order to approach Scabby-Bull and recover his wife. The woman
    is forced to make quilled moccasins and is guarded by a horn that makes noise
    if anyone speaks to her, but her ant-formed husband contacts her at the spring.
    The pair flee in transformed forms, are pursued by buffalo, delay the herd with
    discarded clothing, climb a tree, and are discovered after the woman spits on
    a lame bull. The man kills the buffalo and Scabby-Bull with arrows, including
    a medicine-arrow. After the woman admits grief and love for the bull, the man
    mutilates and kills her.
  language: English
  quote_policy: summarized
