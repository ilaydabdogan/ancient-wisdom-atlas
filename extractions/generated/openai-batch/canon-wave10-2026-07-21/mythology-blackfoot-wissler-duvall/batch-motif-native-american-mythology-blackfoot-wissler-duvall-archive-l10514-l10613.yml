canonical_text:
  quote: ''
  summary: 'The passage lists kinship terms and describes marriage practices: childhood
    betrothal, gifts or livestock to the girl''s father, a proposal by wrapping a
    blanket around a girl, early marriage, postmarital residence and labor with the
    wife''s relatives, polygamy, levirate, sanctions for unauthorized intercourse,
    divorce and remarriage, elopement, spousal address avoidance, and a strict mother-in-law
    speech taboo.'
  language: English
  quote_policy: summarized
