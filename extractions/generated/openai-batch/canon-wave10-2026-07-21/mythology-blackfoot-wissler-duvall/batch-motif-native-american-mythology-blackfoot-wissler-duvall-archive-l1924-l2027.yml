canonical_text:
  quote: ''
  summary: The passage contains several Old Man tales. In one, Old Man refuses a girl's
    offerings until she offers herself, causes her death, hides among old women, shifts
    blame to a bird during a ditch-jumping ordeal, promises to revive the girl, and
    escapes by injuring the assembled people with hot grease and misleading pursuers.
    In another, two women avoid Old Man by pretending to be dead and then escaping.
    In another, Old Man extends his lariat among strawberries, and a girl is killed
    when she mistakes the protruding end for a berry.
  language: English
  quote_policy: summarized
