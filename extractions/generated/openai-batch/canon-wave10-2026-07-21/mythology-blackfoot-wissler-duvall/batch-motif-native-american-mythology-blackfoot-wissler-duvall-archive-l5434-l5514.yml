canonical_text:
  quote: ''
  summary: The passage gives the close of a narrative in which a Piegan hunter is
    attacked by swarming insects until mosquitoes assemble, appear in decorated ranks,
    sing and dance, and drive the insects away. A note identifies Blackfoot named
    men's societies and compares them with military societies among neighboring Plains
    peoples. The next narrative, titled “The Braves,” tells of a boy hunting squirrels
    who falls asleep, hears shouting and a war-whoop, and sees many men descending
    from the sky in detailed painted dress and ritual equipment; the account concludes
    that this is how the Braves were first found out, and names the men with arrows
    as Brave-Bears.
  language: English
  quote_policy: summarized
