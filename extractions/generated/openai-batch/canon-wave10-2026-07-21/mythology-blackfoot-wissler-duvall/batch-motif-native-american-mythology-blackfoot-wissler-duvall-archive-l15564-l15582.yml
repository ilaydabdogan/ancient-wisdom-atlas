canonical_text:
  quote: I saw my own body lying there dead.
  summary: A first-person speaker recounts hearing and briefly seeing the Father,
    whose buckskin bag is described as the source from which he makes everything.
    After a wire is tapped three times, the world opens and the speaker sees the earth
    and his own dead body. The Sun says the speaker will be restored to life, and
    the speaker suddenly returns alive. The speaker also reports that a familiar spirit
    left during sickness and did not return. In a separate experience, the speaker
    goes up to the clouds, where the people are skeletons, some are friends, and the
    other world contains much sage-brush.
  language: English
