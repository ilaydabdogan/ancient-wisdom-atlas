canonical_text:
  quote: ''
  summary: A child hidden from a threatening son-in-law grows miraculously into Blood-Clot,
    who identifies himself as the Smoking-Star come down to help. He kills the abusive
    son-in-law, punishes unhelpful older women, instructs the helpful younger daughter
    to care for the old parents, then travels to another camp. There he confronts
    bears who rule cruelly, monopolize fat and meat, kill many of them with heated
    stones, spares a pregnant female bear, frees confined young women, and redistributes
    the bears' property to old women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man hears a baby crying, threatens to kill it if it is a boy, and
    sends his wives to inspect it; they report that it is a girl.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man is pleased by the report because he expects the child to become
    another wife, and he sends old bones for soup for the baby.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At night the baby tells the old man to hold him against each lodge-pole in
    succession; the old man moves around the lodge in the direction of the sun, and
    the baby grows larger at each pole.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the lodge-pole circuit, the baby becomes a fine young man, obtains black
    flint or obsidian, and says he is the Smoking-Star who came down to help and will
    return.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Blood-Clot goes hunting with his father, kills a scabby cow, and arranges
    for his father to confront the son-in-law.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The son-in-law threatens the old woman, threatens the old man, and shoots
    arrows at him; Blood-Clot then kills the son-in-law.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Blood-Clot kills the two older women, burns them with the son-in-law's body,
    and tells the younger daughter to care for the old parents.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Blood-Clot visits another camp and enters the lodge of old women, who say
    bears take all the fat, leave them lean meat, and will kill him if they hear him
    complain.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The bears rule the camp, live in a bear-lodge or painted lodge, and are described
    as very cruel.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Blood-Clot drives buffalo over the drive, saves a scabby cow for the old women,
    and the animal proves to be very fat when cut open.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Blood-Clot butchers the buffalo, places fat on sticks, hides it from the bears,
    and uses hot stones heated in a fire to kill the chief bear and his wife.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Blood-Clot kills the bears in their lodge except for one pregnant female who
    pleads for her life.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that if the pregnant female bear had not been spared, there
    would have been no more bears in the world.
  category: other
  evidence_refs:
  - ev:7
- id: obs:14
  text: The bears' lodge contains dried meat, other property, and all the young women
    of the camp; Blood-Clot gives the property and lodge to the old women and frees
    the young women.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: An editorial note says the preceding material is similar to a version by Maclean
