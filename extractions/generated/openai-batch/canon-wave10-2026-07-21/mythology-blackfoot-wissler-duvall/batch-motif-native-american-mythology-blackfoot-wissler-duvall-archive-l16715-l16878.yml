  summary: The passage is a museum-style description of Arctic and Northeastern North
    American artifact collections, including Pond's Bay ivory pictographs, a Norton
    Collection Greenland kayak outfit with hunting equipment and ivory decoration,
    and the Henry M. Booth archaeological collection from the Hudson River Valley
    with banner stones, amulets, stone tools, pottery, and steatite objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Pond's Bay collection is described as showing several resemblances to
    Alaskan culture and as coming from an eastern outpost of the Central Eskimo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Norton Collection is said to include specimens from Holstensborg and Discoe
    Islands, presented by G. Frederic Norton, with the Holstensborg series consisting
    of a complete Greenland-type kayak outfit.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Greenland kayak outfit includes a characteristic harpoon and lance, each
    with a throwing board; the throwing board is held by two ivory pegs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Greenland specimens are characterized by bone and ivory inlaying and trimming,
    including decorated paddles, a line rack, harpoon and lance fore-shafts, and an
    ivory ball on one harpoon shaft.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: A kayak is described as of typical Greenland type with carved ivory supports,
    toggles, and buttons; a Pond's Bay kayak is said to resemble the Greenland type,
    with paddles almost identical.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Henry M. Booth collection contains 1154 catalogued archaeological specimens
    gathered mostly from the Hudson River Valley between Westchester County and Albany,
    representing prehistoric Algonkin culture in that region.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Booth collection contains about twenty banner stones, whole and fragmentary,
    including plain, notched, and perforated forms; the perforated forms are said
    to recall Ohio, Indiana, and middle-western archaeology.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Booth collection also includes bird amulets, gorgets, stone tubes, semilunar
    knives, a rubbed slate point, celts, grooved axes, gouges, adzes, long pestles,
    mortars, and a grooved stone associated with shaping arrow shafts.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Pottery is poorly represented in the Booth collection and is mainly Algonkian
    with some Iroquoian types; steatite is common, and a broken steatite pipe stem
    appears to have been reworked as a bead or ornament.
  category: object
  evidence_refs:
  - ev:9
