canonical_text:
  quote: ''
  summary: The passage ends one tale in which a war-party leader marries a woman from
    a hostile group and brings her and her relations to his party. It then gives a
    non-formal account of the Wolverene-Woman, an animal-human being who appears as
    an attractive person to lone men or women and brings death or disappearance after
    sexual familiarity, especially when the victim smells lodge fire or camp smoke.
    A brief abstract of Seven-Heads describes a seven-headed devourer of young women,
    a man who receives power from animals, kills the monster, marries a princess,
    and rescues her after thunder steals her through a sequence of animal killings.
    A final tale locates the Sand Hills as the place of the dead and describes a hunter
    who flees a dead man, later returns, is addressed by him, and then sickens and
    dies.
  language: English
  quote_policy: summarized
