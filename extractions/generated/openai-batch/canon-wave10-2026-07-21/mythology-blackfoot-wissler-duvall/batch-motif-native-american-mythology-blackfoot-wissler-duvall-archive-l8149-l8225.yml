candidate_motifs:
- id: motif:1
  label: marriage changes enemy relations into kin
  taxonomy_refs: []
  basis: The war-party leader avoids killing the woman's relations because marriage
    would make them his relations, then brings them to camp and lives with the woman
    from a hostile tribe.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage is the ending of a preceding tale, so the larger narrative
    context is missing.
- id: motif:2
  label: animal-human seducer shapeshifter
  taxonomy_refs:
  - shapeshifter
  basis: The Wolverene-Woman appears in attractive human form to lone men or women,
    can flee as a wolverene, and brings harm after sexual familiarity.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The editor states this is not a formal narrative and gives no specific
    wolverene myth.
- id: motif:3
  label: fatal return to lodge fire after supernatural seduction
  taxonomy_refs: []
  basis: After contact with the Wolverene-Woman, victims die, faint, disappear, or
    are permanently changed when they return and smell the fire of the lodges.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The text gives this as a belief or conception rather than a complete tale.
- id: motif:4
  label: animal helpers grant power for settling a dispute
  taxonomy_refs:
  - sacred_exchange
  basis: A man settles animals' quarrel over meat and receives power from them in
    return, which enables later heroic action.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage says only that the animals gave him power; the nature of the
    power is not specified.
- id: motif:5
  label: many-headed devourer of young women defeated by hero
  taxonomy_refs: []
  basis: Seven-Heads is a seven-headed person who devours young women and is killed
    by a man with animal-given power.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Only an abstract of the story is provided.
- id: motif:6
  label: stolen wife rescued from thunder
  taxonomy_refs:
  - stolen_beloved
  basis: After the hero marries the princess, thunder steals her, and the hero rescues
    her by killing a sequence of animals emerging from one another.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage abbreviates the rescue with 'etc.' and does not explain the
    relation between thunder and the nested animals.
- id: motif:7
  label: place of the dead and fatal encounter with a dead person
  taxonomy_refs:
  - afterlife_journey_map
  basis: The Sand Hills are named as where the dead go; a hunter encounters a dead
    man there, flees, encounters him again, and dies after returning to camp.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The living man does not fully journey into an afterlife realm; the passage
    locates the encounter near a place associated with the dead.
comparison_claims:
- id: claim:1
  claim: The editorial note compares the Wolverene-Woman conception to the Dakota
    Deer-Woman and the Pawnee Wolf-Woman.
  claim_level: same_motif
  target: Dakota Deer-Woman and Pawnee Wolf-Woman as described by Bush Otter
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides only the editor's comparison and does not include
    the Dakota or Pawnee narratives themselves.
- id: claim:2
  claim: The passage reports an Indigenous belief that the Seven-Heads story was brought
    in by the French.
  claim_level: historical_contact
  target: French source or transmission for the Seven-Heads narrative
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: low
  limitations: This is a reported attribution of origin; no French source text or
    transmission history is supplied in the passage.
- id: claim:3
  claim: The editorial note links the Seven-Heads narrative to discussion of its distribution
