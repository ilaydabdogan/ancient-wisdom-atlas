canonical_text:
  quote: ''
  summary: The passage is an introductory comparative and cultural discussion of Blackfoot
    mythology. It notes parallels and absences among neighboring Plains and central
    North American traditions, lists Blackfoot mythical characters treated as real
    and venerated, describes their roles in sanctioning practices and beliefs, and
    states that Blackfoot myth narration is broadly unrestricted except for reluctance
    around ritual-origin myths and medicines.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The authors state that they did not try to determine the full place of Blackfoot
    mythology among Plains mythologies, but they note parallels with neighboring tribes
    in footnotes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says many myths distributed through central North America appear
    in the Blackfoot collection and in works by other writers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage names Imitations of the Host, Vaginal Teeth, and The Dancing Ducks
    as striking exceptions, and says these appear in Arapaho collections, with all
    except Vaginal Teeth also in Gros Ventre.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Informants were found who claimed to have heard several narratives but could
    not render them, including The Dancing Ducks, Vaginal Teeth, a flageolet received
    from an elk, a man deceiving a bear by playing dead, recovery of water by stealing
    concealed vessels, and a wounded man carried home by a bear.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage lists Imitation of the Host, Raven Creating the World and People,
    The Tar-Baby, and Recovery of the Daylight by Theft as narratives for which no
    recognition was observed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The authors tentatively note similarities between Blackfoot mythology and
    the mythologies of the western Cree, Crow, Gros Ventre, Arapaho, and Arikara,
    while emphasizing that more data are needed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says Blackfoot tales are only part of Blackfoot literature, alongside
    historical, military, adventurous, ceremonial, and other narratives.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The narratives in the collection are described as corresponding in general
    style to fiction and as often valued for aesthetic factors.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says mythical characters are fixed in folk-thought and are generally
    accorded a reality like that of a deceased friend.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage lists Sun-Man, Moon-Woman, Morning-Star, Thunder, Scar-Face, Seven-Stars,
    the Pleiades, Otter-Woman, Elk-Woman, Old Man, Blood-Clot, Scabby-Round-Robe,
    Woman-who-Married-the-Star, and Woman-who-Married-the-Buffalo among the most venerated
    mythical characters.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: All of the named venerated characters are said to have made at least some
    important contribution to the welfare of the people.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Sun, Moon, Thunder, and Morning-Star are described as being of very great
    power and supernatural significance.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The named characters collectively are said to give sanctions for many practices
    and beliefs, especially formal parts of ceremonies and worship rather than ethical
    procedure.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: The passage says the moral lives of these characters are not always exemplary;
    Old Man is held in contempt, and Scar-Face may be criticized for acting from spite
    despite doing a great thing.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage states that there are no known seasonal restrictions on telling
    Blackfoot myths, no detailed myths limited to select audiences, and no myths restricted
    by gender, though people not versed in a ritual may be reluctant to narrate its
    origin myth.
  category: speech
  evidence_refs:
  - ev:10
