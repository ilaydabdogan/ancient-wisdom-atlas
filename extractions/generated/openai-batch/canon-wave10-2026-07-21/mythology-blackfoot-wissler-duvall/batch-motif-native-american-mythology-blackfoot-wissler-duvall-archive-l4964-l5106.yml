canonical_text:
  quote: ''
  summary: 'The passage describes ritual transfers of bear-related medicine objects:
    a bear-knife, a lance, and a painted lodge. The rites involve smoke, songs, paint,
    bear regalia, thorns, thrown objects that must be caught, instructions for warfare,
    and taboos. It also begins the next tale, in which a white man, his wife, and
    an unmarried Indian friend travel to a remote island on a great water, where suspicion
    arises.'
  language: English
  quote_policy: summarized
