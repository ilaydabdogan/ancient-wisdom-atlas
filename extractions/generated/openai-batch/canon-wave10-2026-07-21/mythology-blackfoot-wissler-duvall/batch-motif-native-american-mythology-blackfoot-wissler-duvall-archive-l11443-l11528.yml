canonical_text:
  quote: ''
  summary: The passage describes ordinary medicinal remedies using plants, spruce,
    sweet-grass, and buffalo horn; recourse to a medicine-man when ordinary remedies
    fail; a disease theory in which a ghost or spirit enters the body; ritual extraction
    by sucking, incantation, sweat-lodge use, and killing of the extracted spirit;
    a Ute comparison involving spirit-caused illness and eagle-claw scarification;
    and compensation and other powers attributed to medicine-men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ordinary sickness is treated with medicinal roots and herbs, including sagebrush
    leaves and a sweet-smelling plant called ba'gwina.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A spray of a spruce species called dza'-wongobi, or good-pine, is kept in
    dwellings; its needles are ignited for inhaled smoke or boiled for tea, and spruce
    bark is similarly used for colds and headaches.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Large braids of sweet-grass are suspended from walls and are said to be boiled
    and drunk for colic.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some Shoshone keep old buffalo horns as eye-medicine; small particles are
    boiled with spruce needles, cooled, and rubbed over a sore eye.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: When ordinary remedies fail, a sick person decides to call a medicine-man,
    and this decision usually follows a dream.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states a theory of disease in which a dzo'ap, or ghost, has entered
    the patient's body.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The medicine-man's treatment is described as designed to extract the intruder
    and render it innocuous.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: At the reported time there were three practitioners, two men and one woman;
    the woman was said by white informants to practice hypnotism, though testimony
    was contradictory.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: One doctor was said to cure rattlesnake bites, while Tu'mo-dzo, a hunchback,
    was a specialist for sexual troubles and was said to carry his medicine in his
    hump.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: Tu'mo-dzo was credited with curing barrenness and was described as treating
    venereal disease by suction followed by expectoration.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The usual method of medicine-men includes incantations and sweat-lodges, and
    the doctor forms a tube with his hands at the patient's mouth and sucks until
    the patient retches and belches forth the evil spirit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The extracted evil spirit is seized, shown to spectators sometimes as blood
    or a small object, rubbed between the doctor's palms, and killed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: A Ute doctor drives away an evil spirit by stretching the patient on the ground,
    scarifying from head to heel with an eagle claw, and having men sing an incantation
    in chorus.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Compensation for a doctor varies, including a dollar in one case and a horse
    in others.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Medicine-men are also described as able to charm arrows for hunting and impart
    supernatural virtues to shields, and they are not said to cause sickness or death
    of fellow tribesmen.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: Sons or nephews of physicians sometimes follow the same profession.
  category: relationship
  evidence_refs:
  - ev:8
