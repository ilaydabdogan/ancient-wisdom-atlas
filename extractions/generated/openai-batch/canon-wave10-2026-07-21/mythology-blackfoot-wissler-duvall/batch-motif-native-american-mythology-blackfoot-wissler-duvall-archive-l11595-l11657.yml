canonical_text:
  quote: ''
  summary: 'The passage summarizes Shoshone, Ute, and Lemhi explanations of celestial
    phenomena: an icy domed sky with a rainbow-serpent causing snow and rain; thunder
    and lightning caused by Coyote, a mouse, mouse children, or the Hare''s arrow;
    falling stars, the Pleiades, the Sun, Moon, new moon, man in the moon, and eclipses
    explained through mythic beings, transformations, combat, fire, tears, and divine
    regulation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sky is described in one account as a domed firmament of ice, with a huge
    serpent identified with the rainbow coiled against it; the serpent's friction
    with the ice causes snow, and melting snow becomes rain.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thunder is explained either as Coyote howling or as a small mouse rushing
    through clouds; lightning is attributed to the mouse's children playing recklessly,
    while another cited account makes lightning the Hare's arrow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A gigantic bird named Nii'neyunc is mentioned, but the passage states that
    it does not seem to be connected with thunder.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Falling stars are described in a Ute belief as the excrements of small star-gods,
    and a Lemhi account describes a shooting star that entered the ground, leaving
    a hole and glass-like splinters.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Pleiades are identified as members of Coyote's family who deserted him
    because of his insatiable lust.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: One account says the Sun was once very close to earth and scorched the Indians,
    so the Hare was sent to kill it; from the corpse a new Sun was made and raised
    to its present height.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A more elaborate account says the Sun moved irregularly, scorching people
    when near and chilling the earth when hiding in a cave; after the Sun singed the
    Hare, the Hare shattered it with a magical weapon, causing a world-fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the elaborate Sun account, the Hare's body is burned except for the head;
    tears from the Hare's bursting eyes quench the conflagration, and the conquered
    Sun is brought before a council of gods that regulates seasons and the alternation
    of day and night.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A Lemhi version derives the Moon from the gall of the Sun and says it was
    later raised to the sky like the resuscitated Sun.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The man in the Moon is identified as a giant cannibal holding a blanket; a
    Ute account says Whippoorwill transformed a frog into the new moon by incantations.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: An old doctor is reported as saying he had seen the Sun die twice while Indians
    were shooting at it, apparently in relation to eclipses.
  category: speech
  evidence_refs:
  - ev:10
