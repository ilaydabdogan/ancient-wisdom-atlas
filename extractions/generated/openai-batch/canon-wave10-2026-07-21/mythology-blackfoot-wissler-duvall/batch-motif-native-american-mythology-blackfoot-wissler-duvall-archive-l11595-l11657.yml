comparison_claims:
- id: claim:1
  claim: 'The passage presents several explanations of thunder and lightning that
    perform the same etiological function while assigning causation to different beings:
    Coyote, a mouse, mouse children, and the Hare''s arrow.'
  claim_level: same_function
  target: alternative thunder-lightning etiologies within the cited Shoshone/Powell
    material
  evidence_refs:
  - ev:2
  counter_evidence_refs:
  - ev:2
  confidence: high
  limitations: The variants are summarized, and the passage does not establish whether
    they belong to the same community, period, or narrative cycle.
- id: claim:2
  claim: The elaborate Sun-Hare account is explicitly described as apparently derived
    from both Ute and Shoshone sources, supporting a cautious same-motif comparison
    across these nearby source traditions.
  claim_level: same_motif
  target: Ute and Shoshone Sun-Hare solar combat and regulation accounts
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The statement is mediated through Powell as summarized by the passage,
    and individual Ute versus Shoshone version boundaries are not separated.
- id: claim:3
  claim: 'The Lemhi and Ute lunar accounts share the function of explaining the Moon
    or new moon''s origin, but the mechanisms differ: Moon from the Sun''s gall versus
    frog transformed by Whippoorwill.'
  claim_level: same_function
  target: Lemhi and Ute Moon-origin explanations
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  limitations: The accounts are not the same motif in detail; the comparison is limited
    to lunar-origin function.
- id: claim:4
  claim: 'The passage juxtaposes multiple star explanations in which celestial lights
    are treated as person-related or material phenomena: falling stars as star-god
    excrement, a shooting star as an impact object, and the Pleiades as Coyote''s
    family.'
  claim_level: same_function
  target: falling-star and Pleiades etiological explanations in Ute, Lemhi, and Coyote-family
    material
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs:
