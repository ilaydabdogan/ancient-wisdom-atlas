canonical_text:
  quote: ''
  summary: 'The passage concludes a ritual-origin narrative in which a powerful young
    husband brings buffalo to a drive, organizes the Bull''s Dance, repeatedly emerges
    from brush in successive buffalo-bull forms, and returns to human form when his
    wife catches his horns. An editorial note identifies the tale as an account of
    the Bull Society ceremony. The passage then begins the Whirlwind-Boy narrative:
    a woman who has lost many infants encounters a tiny boy in a whirlwind, receives
    instructions for a navel-cord and sweet-grass packet, bears a surviving son, and
    later the boy gives prescriptions involving buffalo bones and colored paint to
    stop children from crying.'
  language: English
  quote_policy: summarized
