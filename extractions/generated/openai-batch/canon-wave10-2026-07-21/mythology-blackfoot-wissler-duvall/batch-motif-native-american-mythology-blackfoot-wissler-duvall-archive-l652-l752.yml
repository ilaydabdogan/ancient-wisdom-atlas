  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage distinguishes the present Blackfoot Natos or Sun-Man, whose consort
    is Moon-Woman, from the Old Man.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
