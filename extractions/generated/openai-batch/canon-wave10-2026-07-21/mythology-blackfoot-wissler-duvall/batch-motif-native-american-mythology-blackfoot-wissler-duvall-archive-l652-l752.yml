canonical_text:
  quote: ''
  summary: 'The passage summarizes scholarly and Blackfoot views of Old Man/Napiw
    traditions: older creation and culture-origin functions, later obscene and comic
    trickster associations, contested tale assignments, Algonkin comparisons, and
    disputes over whether Napiw is identical with or distinct from Natos/Sun-Man and
    Moon-Woman.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several writers are said to indicate that the Blackfoot formerly had a creation
    myth in which the Old Man initiated the production and transformation of the world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Earlier accounts are described as including the peopling of the earth and
    the instruction of mankind in the art of living, though these details are often
    absent from the Old Man myths recorded in this paper.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The authors state that many collected Old Man tales emphasize absurd, humorous,
    obscene, and brutal incidents, and that no ritual or ceremonial practices appear
    to be based on these narratives.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage connects Old Man narratives with suggested origins for material
    culture and with named places and topographical features in Alberta.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:10
- id: obs:5
  text: The assignment of some myths to the Old Man is described as confused or disputed
    among observers and informants.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The authors propose that creative and cultural origin myths concerning the
    Old Man have disintegrated, partly because of parallels with similar Algonkin
    characters and partly because of present Blackfoot attitudes.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage reports that Blackfoot people did not regard the Old Man as a
