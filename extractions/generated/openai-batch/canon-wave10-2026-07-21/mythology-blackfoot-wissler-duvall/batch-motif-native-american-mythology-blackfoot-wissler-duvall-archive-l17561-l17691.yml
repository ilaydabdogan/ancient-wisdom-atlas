literal_observations:
- id: obs:1
  text: Small lots of objects were received from New Guinea, Australia, Melanesia,
    Micronesia, and Polynesia.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: George S. Bowdoin presented a Hawaiian feather war-cape that had belonged
    to Kamehameha III and had been given by him to Commodore Lawrence Kearny in 1843.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The cape foundation is described as netting made of Olona fibre, prepared
    by soaking, scraping, and rolling on the thigh without a spindle.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The cape netting uses a variation of the square knot, with small meshes and
    horizontal strips cut and joined to suit a circular cape pattern.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that the examined cape foundations give no evidence for
    the practice of enlarging a small cape over time by adding net and feathers at
    the edge.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bright liwi breast feathers cover the cape body, while yellow black Oo wing-tuft
    feathers form two large spherical triangles and four semi-crescents.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Individual feathers were knotted and attached separately to the netting; on
    the described cape, each feather is secured by three knots.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage contrasts Hawaiian, ancient Peruvian, Maori, and Pomo featherwork
    by the different foundations and attachment methods used.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Engler Melanesian collection from the New Hebrides and New Caledonia groups
