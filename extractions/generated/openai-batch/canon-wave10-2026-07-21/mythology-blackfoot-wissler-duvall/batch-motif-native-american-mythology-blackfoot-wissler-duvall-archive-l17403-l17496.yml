literal_observations:
- id: obs:1
  text: A blow-gun used by an Indian is described as an effective weapon; a skilled
    marksman can kill a small bird at thirty or forty paces.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The blow-gun is described as especially deadly against birds or monkeys in
    treetops because near-vertical shooting allows steady aim.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The poison used with the blow-gun is said to act quickly, usually within about
