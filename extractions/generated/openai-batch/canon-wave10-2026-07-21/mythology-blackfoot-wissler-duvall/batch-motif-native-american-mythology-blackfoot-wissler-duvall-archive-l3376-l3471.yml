canonical_text:
  quote: ''
  summary: The passage concludes one Scar-Face episode and begins a Piegan variant.
    Scar-Face proves to Sun that he killed dangerous cranes, receives marked clothing,
    returns from Sun’s realm to his people by means of a cedar hoop, directs the making
    of a sweat-house, and transfers Sun-given clothing to his chum. The narrator explains
    the solar origin of the sweat-house, the medicine-lodge, and the weasel-tail suit,
    and says Scar-Face later became a star. In the variant, a rejected scarred young
    man seeks power, kills dangerous swans near Sun’s dwelling, is welcomed by Morning
    Star, purified by incense and sweat-house rites, loses his scar, and receives
    ritual objects and instructions from Sun.
  language: English
  quote_policy: summarized
