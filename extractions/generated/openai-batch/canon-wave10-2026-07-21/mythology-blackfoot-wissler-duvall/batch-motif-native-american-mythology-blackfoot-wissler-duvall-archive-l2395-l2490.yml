candidate_motifs:
- id: motif:1
  label: Dead or skeletal woman restored to life through food and lodge power
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: The woman is fed buffalo body parts to restore her to life, and Smart-Crow
    later says her bones were bleached but she is alive through the lodge's power.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The immediate passage states restoration clearly, but the preceding death
    episode lies outside this excerpt.
- id: motif:2
  label: Powerful lodge received from a stranger after a restoration promise
  taxonomy_refs:
  - sacred_exchange
  basis: Smart-Crow says he did not kill the stranger because the stranger promised
    to restore his wife and gave him the new lodge.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The exchange is reported in Smart-Crow's speech; the full encounter with
    the stranger is not included in this passage.
- id: motif:3
  label: Ritual purification of a medicine lodge by sweat-house, paint, smudge, and
    songs
  taxonomy_refs:
  - initiation
  basis: The new lodge is purified with the sweat-house, Smart-Crow paints his family,
    and he teaches smudge practice and two seven-songs.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage presents ritual instruction and purification, but does not
    explicitly name the event as an initiation.
- id: motif:4
  label: Disobeyed parental prohibition sends children into danger
  taxonomy_refs:
  - departure
  basis: The father forbids rolling the hoop with the wind; Rock disobeys, and the
    runaway hoop leads the boys to the old woman's rock lodge.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The available taxonomy has no exact prohibition-disobedience label; departure
    is only a broad fit.
- id: motif:5
  label: Cannibal hostess kills with smoke but dies by her own smoke
  taxonomy_refs: []
  basis: The old woman is a cannibal who kills by suffocating victims with smoke;
    the boys' protections cause the smoke to overcome her instead.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: No supplied taxonomy reference directly names this smoke-killer reversal
    motif.
- id: motif:6
  label: Magical protective objects shield children from lethal smoke
  taxonomy_refs: []
  basis: Beaver's hoop keeps smoke away from his head, and Rock's yellow plume whirls
    to keep smoke from his face.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not explain the origin of the hoop's or plume's power
    within this excerpt.
- id: motif:7
  label: Weapon empowered by nonhuman helper releases destructive water
  taxonomy_refs: []
  basis: Rock asks the rock that raised him to make his arrow do what he wishes; the
    arrow opens a hole and water carries away the old woman's lodge.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The water destroys a lodge locally; the passage does not frame it as a
    general flood or renewal.
