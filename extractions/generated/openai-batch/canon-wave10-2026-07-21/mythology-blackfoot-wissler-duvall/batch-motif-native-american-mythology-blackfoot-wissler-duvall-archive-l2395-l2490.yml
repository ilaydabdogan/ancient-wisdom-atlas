canonical_text:
  quote: ''
  summary: A woman is restored to life after being fed buffalo parts, and Smart-Crow
    credits a new powerful lodge received from a stranger. Smart-Crow moves his family,
    purifies the new lodge with a sweat-house rite, and teaches smudge and songs.
    Later, Rock disobeys his father by rolling a game-hoop with the wind. Rock and
    Beaver follow the hoop to a cannibal old woman's rock lodge, where she tries to
    kill them with smoke. Magical objects protect the boys, the old woman dies from
    the smoke, and Rock uses an arrow, water, and help from the rock that raised him
    to wash away her lodge.
  language: English
  quote_policy: summarized
literal_observations:
