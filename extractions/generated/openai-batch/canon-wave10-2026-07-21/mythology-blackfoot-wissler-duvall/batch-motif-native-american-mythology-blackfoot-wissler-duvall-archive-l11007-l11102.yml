  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The a'po-no'kakin, or Father's dance, was danced like the nu'akin but with
    different songs, usually wordless and partly prayer-like; it was usually performed
    by old men and was said to have originally belonged to the Bannock.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The dii'mu-no'kakin involved men and women moving counter-clockwise in a circle
    and bending low at regular intervals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The wo'honokakin is named from a musical instrument, the wo'honog, made from
    a notched wooden board and a second stick or bundle of twigs drawn down the notches.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage reports similar notched or rasping instruments among the Assiniboine,
    Cheyenne, Hopi, Tonkaway, and Mexican tribes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the wo'honokakin, men and women were ranged on different sides of the dance-ground,
    and both sexes could invite members of the other sex as partners.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: If a man refused a woman's invitation in the wo'honokakin, he was believed
    liable to death by a bear while hunting; another informant broadened the possible
    misfortune to drowning, windfall death, and other injuries.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: Wo'honokakin dancers usually formed four to six couples; spectators sang a
    wordless song; partners faced each other, touched or grasped, ran rapidly backward,
    and then returned to their starting position.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The wo'honokakin usually took place on spring evenings, was said not to have
    been practiced at Lemhi for twenty years, and was reported at Duck River Reservation
    as last performed in 1905.
  category: setting
  evidence_refs:
  - ev:8
