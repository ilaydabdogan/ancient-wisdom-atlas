canonical_text:
  quote: ''
  summary: 'The passage discusses several Northern Shoshone-related dances and customs:
    the nu''akin in relation to ghost-dance terminology and antiquity; a fish-coming
    and first-salmon celebration with paint, feast, distribution, and a pre-eating
    ceremony; the Father''s dance and another circular dance; the wo''honokakin, named
    from a notched rasp instrument, with gendered partner selection, wordless songs,
    refusal sanctions, and spring performance; comparisons to similar instruments
    and Ute/Uinta bear-dance forms; and a brief cross-reference to the scalp-dance.'
  language: English
  quote_policy: summarized
