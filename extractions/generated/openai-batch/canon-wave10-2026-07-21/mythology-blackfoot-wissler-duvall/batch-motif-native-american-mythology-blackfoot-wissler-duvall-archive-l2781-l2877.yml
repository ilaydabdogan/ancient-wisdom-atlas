  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: Beaver tells his wife not to put sagebrush on the fire because it is against
    his medicine; she later forgets and throws sagebrush into the fire while he is
    away.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the sagebrush is burned, Beaver says he must leave, takes a white robe
    and a plume, blows the plume into the air, rises to the sky, joins his brother,
