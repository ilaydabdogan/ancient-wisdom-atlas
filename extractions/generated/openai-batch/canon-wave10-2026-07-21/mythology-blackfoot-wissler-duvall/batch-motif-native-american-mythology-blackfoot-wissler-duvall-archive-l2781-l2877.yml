  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the following tale, an old man and woman have three daughters married to
    a young man who hunts buffalo with his father-in-law but orders that no meat be
    given to the old people.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: One daughter takes pity on her parents and secretly drops meat in front of
