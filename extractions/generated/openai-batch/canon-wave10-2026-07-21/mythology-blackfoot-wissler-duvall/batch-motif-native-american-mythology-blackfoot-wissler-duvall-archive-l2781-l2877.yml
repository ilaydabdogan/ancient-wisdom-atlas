canonical_text:
  quote: ''
  summary: 'Beaver and Little-Dog disguise themselves, enter Crow''s lodge, discover
    buffalo hidden in a deep hole, drive the buffalo out onto the earth, and escape
    Crow by hiding in buffalo hair. After a sagebrush fire taboo is violated, Beaver
    leaves his wife, ascends to the sky, and joins his brother as one of two stars.
    A second tale begins: an old couple is deprived of meat by their son-in-law, receives
    secret aid from one daughter, and the old man finds a blood clot that becomes
    a boy baby when boiled for soup.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Beaver transforms himself into a digging-stick, and Little-Dog becomes a pup;
    Crow's young daughter finds them at the old camping-place and carries them home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Crow's daughter lifts the edge of a bed and shows the pup a deep hole beneath
    it where buffalo are visible.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The digging-stick falls into the hole, and the pup grows into a large dog
    and also slips down into the hole; the girl is frightened and does not tell her
    mother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Inside the hole, Beaver becomes a man and Little-Dog becomes a monstrous dog;
    they chase and frighten the buffalo so that the animals rush out through the hole
    onto the earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Crow returns and waits beside the hole to kill the two agents, but Beaver
    and Little-Dog escape by transforming or shrinking again and concealing themselves
    in buffalo hair.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
