  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Water-youths pushed the boy's boat to shore, placed him high in a pine
    tree, and later threw Pa'-n-dzo'avits back into the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The boy crossed cactus fields unharmed after putting on many moccasins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The boy passed many rattlesnakes for a whole day after the Water-youths told
    him not to be afraid.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: In Dzoavits' country, the boy was told not to laugh and to stand straight
