canonical_text:
  quote: ''
  summary: The passage recounts a boy's survival after a predatory bird carries two
    boys to an eastern sea island, kills one, and is killed by the surviving boy.
    The survivor receives aid from the bird's mother and Water-youths, passes a sequence
    of dangers, and opens the mouths of Owl-people. A second, incomplete tale begins
    with a boy seeking his maternal grandfather beyond mountains and fire, leaving
    a rabbit skin as a life-token and losing his feet while crossing burning ground.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two boys camped at night at the foot of a pine tree and built a fire.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bird Nii'neyunc was seen nearby, seized the boys after they shot arrows
    at him, and flew east with them to an island in the big sea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nii'neyunc killed one boy, devoured him, and drank his blood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The surviving boy threw an obsidian knife at Nii'neyunc's throat, after which
    the bird flew up and later fell dead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The surviving boy followed smoke and met an old woman identified as Nii'neyunc's
    mother.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nii'neyunc's mother told the boy to cut off the bird's feathers, made him
    a boat, gave him duck eggs, brought wood, and built a fire for him.
  category: action
  evidence_refs:
  - ev:3
