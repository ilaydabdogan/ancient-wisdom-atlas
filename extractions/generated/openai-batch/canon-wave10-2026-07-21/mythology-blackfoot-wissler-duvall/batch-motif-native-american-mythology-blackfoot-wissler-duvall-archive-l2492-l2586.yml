canonical_text:
  quote: ''
  summary: Rock and Beaver disobey their father's prohibitions involving berries and
    a morning-bird. Rock kills a horned snake at a berry tree, then shoots at the
    powerful morning-bird; the bird and tree rise higher until Beaver can no longer
    see Rock. Beaver weeps at the foot of the tree and becomes a dirty little ragged
    boy again. During a time of hunger, an old Piegan woman finds him, takes him home,
    and has her daughter feed him. A chief announces an archery contest for his eldest
    daughter as wife. Beaver, mocked for his filth and low appearance, shoots the
    bird, while Crow-Arrow tries to claim the shot by switching arrows; the people
    say the boy made the hit. Editorial notes compare parts of the incident with an
    Arapaho incident and the widely distributed Found-in-the-Grass Myth.
  language: English
  quote_policy: summarized
