canonical_text:
  quote: ''
  summary: A father tests two strangers by making arrows and later inspects them while
    they sleep. He discovers that the smaller stranger is his former wife in male
    disguise. In the morning he confronts her and her companion with a white rock
    knife. The pair escape through the smoke-hole like shooting-stars; a thrown rock
    knife cuts off one of the woman's legs. The woman and her new husband go up to
    live in the moon, explaining why the woman seen in the moon has one leg.
  language: English
  quote_policy: summarized
