canonical_text:
  quote: ''
  summary: The passage describes pipe-smoking procedures and directional pipe gestures,
    compares several reported pipe customs, records menstrual and pregnancy seclusion
    rules attributed to Coyote, and describes burial methods, funerary gifts, and
    words spoken to the dead about going to a good land and not returning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a proper pipe-passing procedure, the chief or host smokes first, passes
    the pipe to the left through the visitors, receives it back unsmoked, cleans the
    bowl with a tamper, and sends it on a second round.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Lewis's account of Ke-ml'awE's reception, a fire was kindled in a cleared
    circle in the lodge center, the pipe stem was pointed to the four cardinal points,
    and the pipe was also offered toward the sky and fire-place before participants
    smoked.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the author did not see the pipe offered to six directions,
    and that a chief called this a Sioux custom not practiced by his tribe, while
    also noting Lewis's contrary account as conclusive.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Accounts of Green River Snakes and Ross describe smokers handling the pipe
    in differing prescribed ways, holding it toward cardinal directions, and using
    a forked stick from a medicine bag to place burning horse-dung in the bowl.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lewis reports that Shoshone smokers removed their moccasins before smoking
    and asked white visitors to do likewise; the act was said to involve sincerity
    in friendship and a wish that a disloyal smoker go barefoot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author found little recollection of the moccasin-removal custom except
    one old man's statement that medicine-men formerly removed moccasins when smoking
    during treatment of patients.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ross reports that the Shoshone claimed to have been the first smokers at the
    beginning of the world and to have taught other Indians to smoke.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: During menstruation, women retire to a special lodge, remain by themselves,
    and abstain from meat and fish; formerly their food was seeds and roots, and bread
    is now allowed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage records beliefs that eating meat during menstruation would prolong
    blood flow indefinitely, and that entering the menstrual lodge or approaching
    catamenial blood could cause vomiting and death.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: In late pregnancy a woman retires to the same lodge, men stay away, women
    friends may speak from outside, and both spouses abstain from meat and fish shortly
    before birth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The institution of the menstrual lodge and the origin of menstruation are
    attributed to Coyote.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Older Lemhi burial practice is described as wrapping and tying the body in
    blankets and placing it in rock clefts; later corpses are buried in the ground.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Tree-burial is described as known among other tribes but not used by these
    Indians; Nevada Snakes are said to have usually concealed bodies among rocks,
    with cremation only occasional.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Relatives and friends give gifts to the deceased, and a woman kneels by the
    corpse and shouts into its ears the donors' names and the nature of their offerings.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The funerary address tells the dead person that they are going, should reach
    a good land, should see good Indians, should not return, and that it is good to
    go.
  category: speech
  evidence_refs:
  - ev:11
