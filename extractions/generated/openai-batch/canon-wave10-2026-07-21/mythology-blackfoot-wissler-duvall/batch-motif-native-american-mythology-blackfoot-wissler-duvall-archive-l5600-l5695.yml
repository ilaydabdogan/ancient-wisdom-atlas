canonical_text:
  quote: ''
  summary: 'The passage closes a dog-man narrative in which a dog husband is recognized,
    retaliates against public mockery by calling away the camp dogs, then gives dog-skin
    medicine that leads to a society called The Dogs. It then begins the tale of Has-Scars-All-Over:
    a hungry camp fails to drive buffalo until a young woman vows to marry the buffalo
    leader; after the herd is driven over, the buffalo leader appears as a handsome
    young man and claims her, while her human husband later prepares weapons and follows
    her to the buffalo place.'
  language: English
  quote_policy: summarized
