canonical_text:
  quote: ''
  summary: The passage includes a brief episode in which little Elk violates an instruction
    not to drink spring-water and loses most of his teeth, followed by several Coyote
    tales. Coyote imitates Fox's root-gathering methods and is trapped; lives with
    women who discover his diseased eye and flee; loses games until Wolf repairs his
    eye with mountain-sheep eyes; disguises himself as a woman and impregnates two
    women; disputes the number of spring months with a little bird, whose rattlesnake
    friend frightens him away; and begins a race episode involving Fox, ground-hogs,
    and stones tied to the feet.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hi' to instructs little Elk not to drink fine spring-water on the way and
    to go up the mountains to find his mother.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Little Elk drinks from the spring, after which all his teeth fall out except
    two large teeth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fox eats yampas and says he pulls them from the ground with his tail; Coyote
    imitates the method, puts his tail in deeply, and is pulled underground by the
    yampas.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a second root-gathering version, Fox warns Coyote not to put his tail in
    too deeply; Coyote does so, becomes stuck, is eventually helped out, later repeats
    the act, and is killed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Coyote lives in a grass-lodge with two young women, is asked to hunt buffalo,
    and kills only one poor buffalo.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: One woman notices that Coyote uses only one eye; when his weaselskin covering
    is removed, maggots are seen coming out of the eye, and both women run away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Coyote pursues the fleeing women to a cliff; when they shake their bells while
    he climbs, he falls and is killed, and the women reject him as a blind old beast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wolf wagers property on games in which Coyote competes; Coyote loses ball,
    arrow-shooting, and arrow-throwing games and explains his failures by saying he
    is tired or overworked.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Wolf removes the weaselskin from Coyote's eyes, sees maggots, kills the maggots
    with little arrows, inserts mountain-sheep eyes, and Coyote then wins the replayed
    games.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Coyote meets two women gathering seeds, assumes the appearance of a woman,
    sleeps with them at night, and leaves at dawn.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: After Coyote leaves, the two women feel strange, are pregnant, and each gives
    birth that same day.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Coyote and Wolf are chiefs when a council is called to decide the number of
    spring months; Coyote proposes ten months, To'tsegwe proposes three, and the Indians
    accept three.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Coyote becomes angry at To'tsegwe, tries to kill him, but Rattlesnake comes
    from a hole and hisses, frightening Coyote back to Wolf's camp.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Fox kills two ground-hogs and cooks them; Coyote proposes a race around the
    mountains with stones tied to the racers' feet, with all the food going to the
    winner.
  category: sequence
  evidence_refs:
  - ev:12
