candidate_motifs:
- id: motif:1
  label: Old Man as culture-hero figure
  taxonomy_refs:
  - culture_hero
  basis: Old Man/Napiw is the central figure of a major narrative group and is associated
    with creating earth, shaping land, transformations, seasonal bags, and origins
    of peoples.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage is an editorial introduction and does not explicitly define
    Old Man as a culture hero, though one cited comparative source uses that category
    for a related Sauk and Fox myth.
- id: motif:2
  label: Earth-diver creation from primordial water
  taxonomy_refs:
  - chaos
  basis: Several cited accounts begin with only water or earth covered by water; animals
    dive for mud or earth, muskrat succeeds, and Old Man enlarges the material into
    the earth.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The available taxonomy lacks an exact earth-diver motif family; the chaos
    reference only captures the undifferentiated water-before-land setting.
- id: motif:3
  label: Animal transformation and skin disguise
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: Old Man is transformed into a wolf, then later takes Frog's skin and uses
    it as a disguise to kill bears.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage reports a summarized variant and notes that the wolf transformation
    is later lost sight of in the narrative.
- id: motif:4
  label: Theft of seasonal containers
  taxonomy_refs:
  - sacred_theft
  - seasonal_cycle
  basis: Maclean is cited for a report in which Old Man is a party to stealing bags
    containing summer and winter.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: Only a brief external report is given; no full narrative details are included
    in this passage.
- id: motif:5
  label: Descent of peoples from the culture figure's sons
  taxonomy_refs: []
  basis: Petitot is cited for a tradition that the Northern Blackfoot, Bloods, and
    Piegan are the respective offspring of Old Man's three sons.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage gives only a reported tradition and does not narrate the genealogy
    in detail.
- id: motif:6
  label: Animals killed through laughter at trickster-like antics
  taxonomy_refs:
  - trickster_boundary
  basis: In a reported incident, Old Man alters a fox and sends him to attract buffalo;
    the buffalo die laughing at the fox's antics.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage contrasts Grinnell's version with the editors' collection,
    where the buffalo laughing to death is due to Old Man's acts, but it does not
    provide the full local version.
- id: motif:7
  label: Animal land-shaping after creation of earth
  taxonomy_refs: []
  basis: After Old Man enlarges the mud into land, a wolf runs across the plastic
    matter and its steps form valleys, with plains, mountains, and lakes resulting
    from the pattern of movement and indentations.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This motif is present in one cited version within the passage and may
    not be present in all variants summarized here.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the Frog-skin and bear-killing incident in
    an Old Man story to part of an Algonkin myth recorded among the Sauk and Fox.
  claim_level: same_motif
  target: Algonkin myth recorded among the Sauk and Fox by William Jones
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states the similarity but does not summarize the Sauk and
    Fox parallel, so the basis for the comparison cannot be independently evaluated
    from this passage alone.
- id: claim:2
  claim: The passage presents the earth-diver creation from mud or earth as a motif
    frequent in central North America and shared in general form by Blackfoot and
    numerous Algonkin tribes.
  claim_level: same_motif
  target: Central North American and Algonkin earth-diver creation pattern
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs:
  - ev:10
  confidence: medium
  limitations: The passage includes an old Piegan man's statement that he regarded
    the story as a white man's tale, so the editors' conclusion is not uncontested
    within the reported evidence.
- id: claim:3
  claim: The passage states that the Sarcee knew the earth-diver myth in the same
    form as the preceding account.
  claim_level: same_motif
  target: Sarcee earth-diver creation account
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The Sarcee version is not quoted or summarized independently here beyond
    the statement that it was in the same form.
- id: claim:4
  claim: The passage compares a buffalo-laughing-to-death episode recorded by Grinnell
    with a variant in the editors' own collection, where the buffalo's laughter is
    caused by Old Man's acts.
  claim_level: same_motif
  target: Blackfoot buffalo-laughing episode in Grinnell and in the editors' collection
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: Only the Grinnell incident is summarized; the collection's version
    is mentioned without narrative details.
