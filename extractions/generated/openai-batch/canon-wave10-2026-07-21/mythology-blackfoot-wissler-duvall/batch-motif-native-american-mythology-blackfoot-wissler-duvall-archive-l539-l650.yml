canonical_text:
  quote: ''
  summary: The passage introduces the editors' classification of Blackfoot narratives,
    then surveys Old Man/Napiw stories and reported variants, including animal transformation,
    disguise, killing of bears, fox and buffalo episodes, seasonal bags, ancestral
    sons, and several accounts of world creation from mud or earth obtained by diving
    animals from primordial waters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The editors state that the collected narratives are arranged into groups including
    Tales of the Old Man, Star Myths, Ritualistic Origin, Cultural or other Origins,
    and a miscellaneous collection.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old Man, or Napiw, is given first place in the collection, and Grinnell is
    said to have recorded additional adventures not found in this collection.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In one summarized adventure, Old Man hunts with wolves, sleeps under their
    tails for warmth, disobeys an injunction not to open his eyes, is struck on the
    nose with a bone, and later kills the wolf who threw it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The same summarized adventure is said to include the only known case in which
    Old Man becomes an animal; he is transformed into a wolf by request, though later
    appears in his true form.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Old Man encounters Chief Bear and other bears, shoots arrows into them, takes
    Frog's skin, wears it as a disguise, and kills the bears.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The editors state that the Frog-skin and bear-killing incident is strikingly
    similar to part of an Algonkin myth recorded among the Sauk and Fox.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Grinnell is reported to record an incident in which Old Man plucks hair from
    a fox and sends the fox to attract buffalo; the buffalo are killed by laughing
    at the fox's antics, and the fox freezes stiff while Old Man butchers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Maclean is cited for a report that Old Man was a party to stealing bags containing
    summer and winter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Petitot is cited for the statement that the Northern Blackfoot, Bloods, and
    Piegan are traditionally the offspring of Old Man's three sons.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The editors state that creation of the world from mud brought to the surface
    by a diving animal is frequent in central North American mythology and that Blackfoot
    versions have been recorded elsewhere.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: In one cited version, there is initially only water; Old Man sits on a log
    with four animals, sends animals underwater, and the muskrat returns with mud
    in his mouth.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the same cited version, Old Man rolls the mud in his hand until it grows,
    falls into the water, and becomes large enough for him to step on; a wolf then
    runs over it, making indentations that become valleys, while other places become
    plains and mountains, and water in some indentations becomes lakes.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In another cited version, all earth is covered with water, Old Man is in a
    canoe, and he calls on duck, otter, badger, and muskrat to bring earth from the
    abyss.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: In that version, the muskrat is the best diver, returns fainting with a particle
    of earth between the toes of his paw, and Old Man blows on it until it becomes
    the whole earth.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The same version says Old Man takes four days to complete the mountains, rivers,
    plants, and beasts.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The editors report that the myth was also known to the Sarcee in the same
    form, that an old Piegan man had heard of it but regarded it as a white man's
    tale, and that Henry recorded a version in which the world was first water inhabited
    by a great white man and his wife.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: The editors conclude that there is no reason to doubt that this myth was known
    to the Blackfoot in the same general form as among numerous Algonkin tribes.
  category: speech
  evidence_refs:
  - ev:10
