canonical_text:
  quote: ''
  summary: The passage first recounts the origin and ritual powers of Crow-water-medicine
    through a mourning man's mountain dream, ritual songs, animal skins, and subsequent
    practices. It then begins the Scabby-Round-Robe narrative, describing a dance
    custom in which women wear lovers' clothing, the public mockery of Scabby-Round-Robe,
    his connection with Beaver power, and his departure to the hills until the waters
    become warm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Crow Indian mourns his son killed in war and camps in the mountains to dream
    for power to revenge the death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After ten nights, he dreams of drumming and singing and follows a man who
    says there is dancing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dream lodge contains many old men and women, eight men with drums, animal
    skins, a whistle, smudge materials, wild turnip, berry soup, and an old woman
    with otter- and weasel-skins.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man learns the songs in the dream lodge, returns to his people, and starts
    Crow-water-medicine; later dreams add further animal skins and songs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Crow-water-medicine people pray, sing, dance, paint people troubled by bad
    dreams, treat the sick, meet at regular times, and use red paint on face and hands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A stated dance custom has a woman with a lover dress in his clothes and publicly
    declare war deeds understood as the man's intended deeds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Scabby-Round-Robe is described as very poor and in love with a young married
    woman whose husband owns a water-bundle or beaver-bundle.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Scabby-Round-Robe wears a strip of skin with two magpie feathers and a badly
    tanned robe with cut-off corners.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The young woman dances wearing Scabby-Round-Robe's clothes, and onlookers
    identify the clothes and mock him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Scabby-Round-Robe had earlier been taken by the Beavers, lived with them for
    one winter, and obtained some of their power.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Scabby-Round-Robe tells the young woman to say that when the waters are warm
