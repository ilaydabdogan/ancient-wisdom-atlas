canonical_text:
  quote: ''
  summary: The passage describes comparative decorative patterns in Lemhi, Shoshone,
    Blackfoot, Crow, Nez Percé, and Arapaho-related material culture. It discusses
    beadwork designs such as the Blackfoot mountain-design, stepped rhombi, rectangular
    crosses, angular horseshoes, color preferences, floral trade-item decoration,
    and Shoshone parfleche patterns built from triangles, squares, borders, diamonds,
    lozenges, and hourglass forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that inspection of Lemhi beadwork tends to establish a closer
    relationship with the Blackfoot.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Blackfoot mountain-design is described as a checkered or plain step triangle
    and is said to occur frequently on dance-leggings, moccasins, belts, and hat-bands.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two step triangles can unite into a stepped rhombus, or their approaching
    bases may be separated by a line interrupted with a rectangular or narrow hexagonal
    figure.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A rectangular cross appears on a small amulet, an armlet, dance-leggings,
    hatbands, and as a central design within a stepped rhombus.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The angular horseshoe design is mentioned as occurring and as common among
    the Blackfoot and Crow.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author contrasts the preference of many Plains tribes for white backgrounds
    with Blackfoot and Shoshone use of less white and more greenish or bluish colors.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gauntlets made for trade, and sometimes moccasins, are decorated with floral
    designs; native informants consider this style recent, and somewhat similar designs
    occur on Nez Percé pouches.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kroeber is reported as recognizing a distinct Shoshone parfleche painting
    style characterized by partial substitution of square-and-triangular combinations
    for exclusively triangular designs.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The author says Shoshone parfleches show a strong tendency toward longitudinal
    border-stripes, often with corner squares connected by obtuse triangles; these
    occur in sixteen of twenty-two examined parfleches.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Bordered parfleche variants include central rectangles, lozenges, isosceles
    triangles, obtuse and right-angled triangles, homogeneous triangles, bisecting
    stripes, and diamond or central-strip arrangements.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Some parfleches without square-triangular borders are described as decorated
    in Arapaho fashion with long narrow patterns arranged in longitudinal stripes.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: One decorative layout divides the field into three portions by two transverse
    lines and includes triangles, a central diamond, hourglass figures, and obtuse
    triangles.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: The author concludes that border-stripes are common and that square-and-triangular
    patterns have diagnostic value, but that Shoshone parfleche decoration does not
    conform to any single type.
  category: speech
  evidence_refs:
  - ev:11
