canonical_text:
  quote: ''
  summary: A dead woman is ritually enabled to drink and eat at a river and is restored
    to life. Buffalo figures provide instructions involving buffalo hair, a bridge
    of shields, the choice and care of medicine-shields, and later the woman returns
    to her husband, makes three shields, and gives war-path rules; the passage states
    that this is how people got medicine-shields. A second account begins with a Piegan
    dreaming in a buffalo-wallow and directing his father to make a shield and associated
    ritual equipment from animal materials, prepare a horse to resemble a rabbit,
    warn the camp to stake down lodges, and stage a powerful medicine action.
  language: English
  quote_policy: summarized
