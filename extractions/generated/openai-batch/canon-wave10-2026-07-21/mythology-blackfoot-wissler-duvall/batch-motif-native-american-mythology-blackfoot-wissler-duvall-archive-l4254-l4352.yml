candidate_motifs:
- id: motif:1
  label: Beaver-derived implement protects a warrior in a dangerous water crossing
  taxonomy_refs:
  - wisdom
  basis: Scabby-Round-Robe's Beaver stick receives the spear-strike, enabling him
    to kill the Snake chief after diving across the high river; the passage later
    connects Beaver songs with diving as safety.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:8
  confidence: medium
  cautions: The prior origin of the stick and Beaver relationship is outside this
    passage; the motif label is limited to details stated here.
- id: motif:2
  label: Marginal follower gains war honor through a perilous exploit
  taxonomy_refs:
  - initiation
  - return
  basis: Scabby-Round-Robe and his chum are ordered back, but he persists, crosses
    the river, kills the enemy chief, returns with the trophy, and receives public
    and social rewards.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage presents war achievement and reward, not an explicitly named
    initiation rite.
- id: motif:3
  label: Diving beneath water as a means of safety and victory
  taxonomy_refs: []
  basis: Scabby-Round-Robe repeatedly dives to cross and return, and the passage explicitly
    says that beaver-songs often say diving is safety.
  evidence_refs:
  - ev:4
  - ev:8
  confidence: high
  cautions: This is a local passage-level motif; no broader comparative taxonomy reference
    is asserted beyond the literal statement.
- id: motif:4
  label: Animal appears as human and grants ritual medicine
  taxonomy_refs:
  - shapeshifter
  - sacred_exchange
  - initiation
  basis: The man tells the woman he is the Elk she heard, asks her to go away with
    him, promises medicine, and explains the ceremony.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage says the man is the Elk; the term shapeshifter is a taxonomy
    alignment rather than a word used in the passage.
- id: motif:5
  label: Animal assembly contributes powers and body parts to ceremonial regalia
  taxonomy_refs:
  - sacred_exchange
  - initiation
  basis: The Elk-man calls animals to give the woman power; Crane, Buffalo, and other
    animals contribute parts used on the medicine-bonnet, and each sings a song.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:13
  confidence: high
  cautions: The exact identities of all contributing animals are not fully enumerated
    in the passage.
- id: motif:6
  label: Ritual regalia represents the body of the animal power
  taxonomy_refs: []
  basis: The elk-skin robe represents the Elk, and the feather bunches on the bonnet
    represent horn prongs.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: Only the Elk robe and horn-prong feather bunches are explicitly described
    as representational.
