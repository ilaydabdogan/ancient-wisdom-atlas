canonical_text:
  quote: ''
  summary: The passage closes an episode in which Scabby-Round-Robe follows a Piegan
    war-party, crosses a dangerous river with a Beaver-derived stick, kills and scalps
    a Snake chief, and is rewarded with status, a woman, a lodge, and beaver-medicine.
    It then begins the Blood version of The Elk-Woman, in which an Elk appears as
    a man to a woman, gives her medicine and ceremonial instruction, and calls animals
    to contribute powers and objects to a medicine-bonnet.
  language: English
  quote_policy: summarized
