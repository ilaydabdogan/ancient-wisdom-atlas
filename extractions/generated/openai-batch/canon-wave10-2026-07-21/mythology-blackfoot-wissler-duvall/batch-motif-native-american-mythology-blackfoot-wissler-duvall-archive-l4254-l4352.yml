    is given by the Arikara in Dorsey's work.
  claim_level: same_motif
  target: 'Arikara incident cited in footnote: Dorsey, op. cit., p. 127'
  evidence_refs:
  - ev:15
  counter_evidence_refs: []
  confidence: low
  limitations: The passage provides only a bibliographic note saying the incident
