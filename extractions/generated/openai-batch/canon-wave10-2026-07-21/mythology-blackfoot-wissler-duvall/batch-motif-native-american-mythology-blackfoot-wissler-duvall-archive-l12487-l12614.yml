canonical_text:
  quote: Everyone except Coyote and his companions was drowned.
  summary: 'The passage first recounts Coyote joining wild geese, a council on a mountain
    deciding to flood the world, Coyote and companions surviving, and survivors making
    trees, watercourses, fish, and animals. It then gives the narrative of Coyote
    and his daughters: Coyote deceives his family through a false war departure, self-wounding,
    feigned illness, feigned death, funeral instructions, a prohibition on looking
    back, and a return associated with a southern visitor who marries his daughters.'
