literal_observations:
- id: obs:1
  text: A boy’s body is consumed by flames; after sunset Tosa-pono comes, predicts
    rain and snow, the storm puts out the fire, and Tosa-pono puts the burnt boy’s
    body together again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The restored boy goes toward his two grandfathers’ lodge, where a large bear-dog
    that used to eat Indians and was also used as a horse notices him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The grandfathers restrain the bear-dog, recognize the boy as their grandson,
    kiss him, tell him to rest, give him food, and build a fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the boy perishes in the flames, his mother sees a skin hanging in her
    lodge break to pieces and weeps for him through the night.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The grandfathers’ animal becomes restless when hostile Indians approach; after
    being released it kills enemies, and the bear kills all of the enemy when the
    old men are exhausted.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the fighting, the old men cut off the heads of slain men, tie scalps
    on a pole, and sing all night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy leaves his grandfathers to return to his mother, and the grandfathers
    hold back the bear so it will leave their grandchild alone.
  category: action
  evidence_refs:
  - ev:5
