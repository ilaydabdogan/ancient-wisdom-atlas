canonical_text:
  quote: ''
  summary: The passage ends one narrative in which a burned boy is restored by Tosa-pono,
    visits his grandfathers, is protected by their bear-dog, and returns to his grieving
    mother. It then begins another narrative, “The Disobedient Brother,” in which
    Snake kills a woman, her sons extract animals and a baby sister from her corpse,
    and the younger brother begins caring for the sister but disobeys instructions.
  language: English
