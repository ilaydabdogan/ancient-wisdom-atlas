canonical_text:
  quote: ''
  summary: The passage contains the end of a Blackfoot star myth in which six poor
    boys, mocked for lacking red buffalo-calf robes, ascend to the house of the Sun
    and Moon, ask for water to be withheld, and become the Bunched Stars or Pleiades
    after dogs save the people by making springs and praying for rain. It then begins
    'The Moon-Woman,' in which a woman with two children is enticed to the moon by
    a lunar man and later returns disguised as a male visitor to see her children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A poor family has six boys who lack red buffalo-calf robes and are mocked
    by other children for wearing brown or old buffalo-skin robes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boys agree that if they do not receive red robes by the next spring, they
    will leave camp and go to the sky country.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After no red robes come, the oldest brother says he will take all the brothers
    to the sky, and the fourth brother proposes taking all the water away from the
    people because they have treated the boys badly.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The oldest brother uses weasel-hair, instructs his brothers to close their
    eyes, blows the hair upward, and the brothers find themselves in the house of
    the Sun and Moon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sun is described as an old man and the Moon as his wife; the Moon pities
    the boys, cries, asks the Sun seven times to help, and the Sun finally agrees.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The water in streams and lakes boils and evaporates during a period of great
    heat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Two dogs dig into a river-bank and water comes out like a spring; the passage
    says this is how springs were made.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: People dig holes into hills and crawl into them to survive the heat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: An old white medicine-dog leads the dogs, howls toward the sky, prays to the
    Sun and Moon, explains the boys' lack of red robes, and asks pity for the dogs
    below.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: On the eighth day the Sun and Moon give the people a long, great rain.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The six boys remain in the sky and are identified as the Bunched Stars, or
    Pleiades.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: A woman with two children and a black birthmark on her calf disappears after
    being enticed away by a man who lives in the moon.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: After living in the moon, the woman wants to see her children, disguises herself
