canonical_text:
  quote: ''
  summary: Crow-Arrow’s crow-feather arrows fail to clean a buffalo skin, while Beaver’s
    arrows are treated as powerful medicine. Angry at Beaver’s greater power, Crow-Arrow
    transforms himself and his family into crows, threatens the people with starvation,
    and removes the buffalo over the mountains. Beaver sets a trap by transforming
    into a corpse-like beaver on the ice; Crow is deceived, caught, blackened with
    smoke, and released after promising to call the buffalo, but he breaks the promise.
    Beaver and Little-Dog then set out to find the buffalo, repeatedly transforming
    into animal or small forms as they approach Crow’s camp.
  language: English
  quote_policy: summarized
