literal_observations:
- id: obs:1
  text: Two women collecting wood see Bear-Moccasin; he tells the young woman she
    escaped once but he will lie with her, takes her sleeve, and she cuts the sleeve
    with a knife, flees, and tells the chief.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief prepares medicine for loading his gun, goes with the woman, finds
    Bear-Moccasin lying by brush, shoots him, removes his canine teeth, cuts his body
    into small pieces, and burns the teeth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bear-Moccasin's friend comes intending to restore him to life, but when he
    sees the canine teeth are gone, he refuses to try and says Bear-Moccasin has already
    done much harm.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A following story is introduced as another version or reverse; in it a young
    man dreams he came to life after death and asks his chum to try the procedure
    if he dies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young man tries to rape the chief's wife in view of the camp, the chief
    kills him, his body is cut up and burned, the camp moves, and people march over
    the ashes to wipe out every trace.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dead man's chum later searches the ashes, finds a very small bone, paints
    it, places a robe over it with a pipe nearby, shoots four arrows so they fall
    on the robe, and the dead man rises and chases him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The revived young man returns at night to his mother's lodge, sends her to
    request special food from the chief, is understood to be asking for a woman, then
    kills the chief, burns and scatters him in the same way, takes the chief's wives,
    and becomes chief.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A brief additional version says the chief is forced to go around kissing all
    the dogs in camp and freezes to death in the cold.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Split Feather story begins in a hunting setting when buffalo and deer
    are plentiful; a medicine-man who hunts often leaves his wife at camp and secretly
    has the power of a feather.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The medicine-man suspects his wife, splits the feather down to about its middle,
    places it under the bedding, and departs as if for a hunt lasting two or three
    days.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The wife sends word to her young single lover, tells him her husband is away,
    and they occupy the bed under which the feather has been placed.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The next morning people gather around the lodge; the man and woman are fast
    together and cannot be separated, the big medicine-men cannot help, and the young
    man's father is advised to prepare horses and weasel suits as gifts for the wronged
    husband and to beg for his son's life.
  category: sequence
  evidence_refs:
  - ev:8
