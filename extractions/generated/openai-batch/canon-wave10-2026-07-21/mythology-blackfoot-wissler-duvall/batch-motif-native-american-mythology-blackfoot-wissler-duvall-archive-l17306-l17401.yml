canonical_text:
  quote: ''
  summary: The passage describes the Schmidt and Weiss ethnological collection from
    the upper Rio Caiari-Uaupes region of Amazonas, Brazil, including ceremonial feather-work,
    weapons, musical instruments, a chief's ceremonial dress, tobacco-smoking equipment,
    blow-guns, poisoned arrows, and manufacturing details for blow-guns and arrows.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The museum acquired the Schmidt and Weiss collection, made in 1905-06 among
    Indians on the upper waters of the Rio Caiari-Uaupes, a tributary of the Rio Negro
    in Amazonas, Brazil.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hermann Schmidt lived eight months alone with the Indians after losing his
    boat, learned customs, and acquired knowledge of their language.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The expedition results included ethnological specimens, a vocabulary, drawings
    of painted figures on rocks at waterfalls, and folk-tales.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: About three hundred pieces of feather-work are described as ceremonial items
    worn only by men on ceremonial occasions.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The collection also included spears, shields, bows, arrows, blow-guns with
    poisoned arrows, fish traps, baskets, pottery vessels, drums, rattles, pan-pipes,
    and whistles made of deer and jaguar bones.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A photographed headman or chief is described in ceremonial dress, carrying
    a ceremonial spear and basket-work shield, wearing a decorated comb, and bearing
    a perforated cylindrical stone and four jaguar teeth from his neck.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Native tobacco is smoked as a large cigar held in a long wooden fork-like
    holder stuck into the ground near a hammock.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Blow-guns on the Upper Caiari-Uaupes are made from palm stems, with nested
    stems, a wooden mouth-piece, a boar's tooth sight, and a spiral bark wrapping.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage describes an alternate method in some localities using a single
    split piece of palm wood, hollowed and cemented together.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Arrows are small, palm-derived shafts wound with wild cotton near one end,
    dipped repeatedly into poison, and carried with poisoned ends protected in a quiver
    filled with soft vegetable material.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The blow-gun is called Sarabatana on the Upper Caiari-Uaupes, Pucuna by many
    Amazon-region tribes, and Gravatana by the Portuguese of the river district.
  category: speech
  evidence_refs:
  - ev:11
