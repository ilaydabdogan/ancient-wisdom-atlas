canonical_text:
  quote: ''
  summary: 'The passage concludes an eagle-catching and medicine-transfer narrative:
    Spider finds his runaway wife with Eagle-Bull, asks for the child, receives eagle-catching
    power and ritual instructions, later receives help from magpie-children, and transfers
    knowledge of the eagle-trapping place to a medicine-pipe man. The passage then
    begins “The Lost Children,” in which children refuse shells to the son of a medicine-pipe
    man, and the father orders the camp moved while those children are away.'
  language: English
  quote_policy: summarized
