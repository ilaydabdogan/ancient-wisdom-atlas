candidate_motifs:
- id: motif:1
  label: restoration from bones after cannibal consumption
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: Blood-Clot is eaten repeatedly, his bones are restored to life by a little
    girl, and he later kills the cannibal.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is reported as a variant incident rather than narrated in full in
    the passage.
- id: motif:2
  label: slain person becomes a star
  taxonomy_refs:
  - ascent
  basis: The figure says death will send him into the sky as Smoking-Star, and the
    star appears when he is killed.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives only a brief ending and does not name the human figure
    in the supplied range.
- id: motif:3
  label: celestial husband takes human wife to sky
  taxonomy_refs:
  - divine_beloved
  - sacred_marriage
  - ascent
  basis: Morning Star appears as a man, claims the woman because she wished for him
    as husband, and takes her into the sky after she consents.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The term divine is a taxonomy alignment; the passage names celestial beings
    rather than using that category.
- id: motif:4
  label: Sun and Moon as parents of a star being
  taxonomy_refs:
  - divine_parent_child
  basis: The passage states that Sun is Morning Star's father and Moon is his mother.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This is a genealogical relationship in the narrative and not a full episode
    by itself.
- id: motif:5
  label: cosmic food and water contained in small gifts
  taxonomy_refs: []
  basis: Moon gives four berries and a shell with drops of water, and the passage
    says these are all the world's food and all the ocean's water.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage marks the ocean-water statement with a question mark, so the
    detail may be editorially uncertain.
- id: motif:6
  label: forbidden medicine plant dug despite warning
  taxonomy_refs:
  - forbidden_knowledge
  basis: Moon forbids digging the large turnip because it is medicine; the woman later
    digs it out and thereby opens a view to earth.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The taxonomy label emphasizes forbidden knowledge, while the literal prohibition
    concerns a medicine plant.
- id: motif:7
  label: animal-person medicine helper
  taxonomy_refs: []
  basis: Crane-Woman helps through songs, smudge, and ritual handling of the digging-stick;
    the footnote states that animal helpers in such procedures are assumed to be persons
    in disguise.
  evidence_refs:
  - ev:7
  - ev:11
  confidence: high
  cautions: The person-in-disguise explanation comes from an editorial note rather
    than dialogue in the story.
- id: motif:8
  label: ritual power from marital fidelity
  taxonomy_refs: []
  basis: Crane-Woman says her fidelity to her marriage vow gives her power to help
    the young woman.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This is stated within one speech and may be part of the specific medicine
    procedure rather than an independent motif.
- id: motif:9
  label: opening between sky country and earth
  taxonomy_refs: []
  basis: After the turnip is dug, the young woman looks through the hole and sees
    earth, trees, rivers, and her people's lodges.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not explicitly call the hole an axis or world center.
- id: motif:10
  label: return from sky with child under taboo
  taxonomy_refs:
  - return
  basis: Morning Star commands the woman to return to her people with the boy and
    imposes a fourteen-day prohibition on the child touching the ground.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The supplied passage ends before the return is completed.
- id: motif:11
  label: conditional transformation of child into fixed star
  taxonomy_refs: []
  basis: Morning Star says the boy will become a puff-ball and then a star fixed in
    the turnip hole if he touches the ground too soon.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: In the supplied range this remains a warning, not an accomplished event.
- id: motif:12
  label: spider-web as descent aid from sky
  taxonomy_refs:
  - return
  basis: Sun calls a helper for the woman's descent, and the man arrives with a strong
    spider-web.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage ends before the spider-web is used.
comparison_claims:
- id: claim:1
  claim: The passage explicitly notes that Grinnell's version contains an additional
    Blood-Clot incident involving repeated cannibal consumption, bone restoration,
    and revenge against the cannibal.
  claim_level: same_motif
  target: Grinnell's version of the Blood-Clot narrative, cited in the passage as
    op. cit., p. 37
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The supplied passage gives only the editor's brief comparison and not
    the full Grinnell text.
- id: claim:2
  claim: An editorial note identifies Crane-Woman's role with a broader Blackfoot
    narrative pattern in which animals participating in medicine procedures are treated
    as disguised persons who become as people.
  claim_level: same_function
  target: Blackfoot narratives with animal figures in medicine procedures
