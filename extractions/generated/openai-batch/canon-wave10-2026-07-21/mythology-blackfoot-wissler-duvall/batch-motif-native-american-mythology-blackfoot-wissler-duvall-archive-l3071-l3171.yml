canonical_text:
  quote: ''
  summary: 'The passage contains a note on a Blood-Clot variant, a brief account of
    a slain person becoming the Smoking-Star, and the opening portion of the Fixed
    Star narrative: a young woman wishes for Morning Star as husband, is taken to
    the sky, receives food and water from Moon, is warned not to dig a medicine turnip,
    disobeys, is helped by Crane-Woman in a medicine procedure, sees earth through
    the turnip hole, and is told to return with her child under a fourteen-day ground-contact
    prohibition.'
  language: English
  quote_policy: summarized
