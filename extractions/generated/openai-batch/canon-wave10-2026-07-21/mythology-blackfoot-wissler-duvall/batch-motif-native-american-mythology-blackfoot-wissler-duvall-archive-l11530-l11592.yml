  quote: ''
  summary: The passage describes cases where medicine-men could not restore the sick,
    explanations involving a whirlwind, a dzo'ap, or Coyote carrying off a person's
    mind or mu'gua, and a series of charms used for protection, harm, eye disease,
    and attracting women. It lists materials such as spruce needles, buckskin bags,
    weasel parts, buffalo parts, obsidian, spear-grass, sacred stones, rattlesnake
    heads, animal liver and gall, roots, and stones.
  language: English
  quote_policy: summarized
