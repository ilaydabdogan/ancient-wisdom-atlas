canonical_text:
  quote: ''
  summary: 'A first-person narrator recounts several supernatural experiences: hearing
    a water-baby at a moonlit river, meeting a skeleton-like ghost that disappears
    into the ground when addressed, fleeing a circling cry that becomes like a bear''s
    panting, seeing a vanishing Indian and then being pursued by a rattlesnake he
    identifies as a ghost, and later becoming sick after a dream, being told by the
    Sun that he will die and may be restored, and experiencing his soul leaving his
    body and descending to another world where a helper of the Father remakes dead
    men.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator travels toward the Flathead Reservation with two other Shoshone,
    reaches a river at night under the moon, and swims across while clothes remain
    on the bank.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: While retrieving clothing, the narrator hears a baby crying, sees a faint
    light under a cottonwood, feels strange, and identifies the crying being as a
    water-baby called Pa'ona.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An Indian-like figure comes toward the narrator; its head and body are visible
    but its face is not, and the narrator later sees that the apparent striped vest
    is the ribs of a skeleton.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The skeleton-like figure has light in its eyes, does not speak, is addressed
    by the narrator as a ghost, then goes down into the ground and disappears.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Several days later at sunset, while looking for ground-squirrels near a row
    of pine trees, the narrator hears a sound like a woman crying at a funeral.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the narrator builds a small cooking fire, the sound stops, returns nearer
    in darkness, circles around him, and changes into the panting of a bear.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: As a boy, the narrator sees an Indian on a hill, tries to flash sunlight toward
    him with a mirror, approaches him, and then loses sight of him after the figure
    walks away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The narrator tracks the place where the hill figure sat and finds that the
    footsteps suddenly cease, leading him to conclude that it must have been a ghost.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After crossing a creek, a rock is thrown at the narrator, he sees a rattlesnake,
    and the snake repeatedly pursues him despite thrown stones.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The narrator thinks the pursuing snake may be a ghost, perhaps the same vanished
    man, tells it to let him alone because it is a ghost, and it lets him go.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The narrator roasts salmon on issue-day against the advice of his familiar
    spirit and dreams of a large battle in which a hail-stone strikes him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the dream, the narrator becomes sick for a month, eats little, and says
    his spirit no longer helps him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Sun tells the narrator that he is going to die, should have a separate
    lodge put up for himself, and may be restored to life after death if he desires
    to live again.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Indians build the narrator a separate lodge and leave him there to die
    by himself.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: After three days and four nights in the tent, the narrator's soul, called
    mu'gua, comes out of his thigh, steps forward, and looks back at his body.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: When the soul has taken three steps, the narrator's body becomes cold and
    dead.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Something comes down and passes through the narrator's soul; the soul goes
    downward, reaches another world, follows a trail, and sees a helper of the Father
    making some dead men over again.
  category: sequence
  evidence_refs:
  - ev:9
