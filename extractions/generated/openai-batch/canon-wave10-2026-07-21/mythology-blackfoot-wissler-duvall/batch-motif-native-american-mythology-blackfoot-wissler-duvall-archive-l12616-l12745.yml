canonical_text:
  quote: ''
  summary: A Coyote episode describes Coyote being recognized and unmasked by his
    son, later injuring a baby girl and being exposed by Hummingbird, after which
    Duck's family ascends to the sky as a constellation while Coyote remains behind.
    A second episode introduces Iron-Man, father of the white people, and Wolf, father
    of the Indians, who compete in smoking and gun-making, with Wolf prevailing.
  language: English with Latin interpolations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote offers to show the boy an old hunting place and briefly says that he
    knows where it is before denying that knowledge.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman hears a strange drum-like noise and sends her son to investigate;
    the son sees Coyote during sexual activity while his tail strikes the ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During a rock-squirrel hunt, Coyote tells the boy to poke a stick into rock
    crevices while Coyote opens his mouth for squirrels to jump in.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy sees four holes in Coyote's teeth, recognizes him as his father, becomes
    frightened, and runs home crying.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy tells his sisters that their husband is their father, and the mother
    tells the daughters to look for a wart on the husband's head.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The two women play with Coyote's head, pull off his false hair, and Coyote
    drops his disguise and flees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Duck visits the Coyote family, marries the two girls, and the group begins
    wandering; one of the married women gives birth to a girl.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Coyote later arrives on crutches, asks whether the little girl is his granddaughter,
    and plays with her; afterward the child cries continually.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Duck goes to Hummingbird, a medicine-man, and asks him to cure the child.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Hummingbird orders the fire put out and the holes in the wikiup covered, which
    the passage identifies as a medicine-man's custom.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Hummingbird says the trouble must have been one of Coyote's tricks; Coyote
    objects that medicine-men always blame him and rekindles the fire.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the fire is extinguished again, Hummingbird returns, sucks from the
    baby, extracts the injuring object from her body, strikes Coyote with it, and
    stuns him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The extracted object falls into the fire and is burned up.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Duck, the two young women, Coyote's wife and son, and the baby fly up to the
    sky and form a constellation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Coyote wakes the next morning alone, eats a half-cooked deer's head from the
    ashes, sees his relatives in the heavens, and repeatedly fails to jump up to them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Iron-Man is described as the father of the white people and as living on the
    water, while Wolf is described as the father of the Indians and as living underground.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: Wolf's son travels across the water to Iron-Man's house and receives an invitation
    for Wolf to visit and compete in making guns.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: Wolf enters Iron-Man's sea house with a breath of air, and the two smoke pipes;
    Wolf smokes Iron-Man's tobacco, while Iron-Man is stupefied by smoke from Wolf's
    pipe.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: Wolf dispels the smoke and restores Iron-Man after Iron-Man is nearly dead
    from smoking.
  category: action
  evidence_refs:
  - ev:10
- id: obs:20
  text: Iron-Man and Wolf each make guns from half of a large iron ball, and Wolf
    makes more guns in the same time, winning the contest.
  category: action
  evidence_refs:
  - ev:11
- id: obs:21
  text: A variant note says that in another version Iron-Man vomits and dies from
    smoking too much.
  category: other
  evidence_refs:
  - ev:12
