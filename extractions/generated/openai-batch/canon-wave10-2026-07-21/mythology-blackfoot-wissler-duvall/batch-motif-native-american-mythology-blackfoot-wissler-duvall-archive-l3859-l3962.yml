  - ev:21
  - ev:22
  confidence: high
  cautions: The taxonomy label is broad; the passage describes ritual origin and transmission
    rather than an individual ordeal-focused initiation.
- id: motif:2
  label: sacred exchange for ritual power
  taxonomy_refs:
  - sacred_exchange
  basis: The beaver-bundle is given in relation to taking the woman away; Sun requests
    feathers and hides for songs; Beaver offers medicine-songs in exchange for skins.
  evidence_refs:
  - ev:4
  - ev:7
  - ev:21
  confidence: high
  cautions: The exact social or ritual meaning of the exchanges is not interpreted
    beyond the passage wording.
- id: motif:3
  label: human woman enters water-being relationship
  taxonomy_refs:
  - stolen_beloved
  basis: In both versions, a woman leaves ordinary camp life after contact with Beaver
    and is associated with water or an underwater home.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:16
  - ev:17
  confidence: medium
  cautions: The passage does not describe explicit abduction; in the Blood version
    the woman eventually goes with Beaver, so 'stolen beloved' is only a cautious
    family match.
