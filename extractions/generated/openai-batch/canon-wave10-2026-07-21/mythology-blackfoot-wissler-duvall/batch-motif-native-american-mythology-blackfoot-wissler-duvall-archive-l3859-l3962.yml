- id: motif:1
  label: origin of ritual bundle and medicine-songs
  taxonomy_refs:
  - initiation
  basis: The passage explicitly frames both versions as origins of beaver-medicine,
    with instructions, songs, bundle transfer, and prescribed rites.
  evidence_refs:
  - ev:10
