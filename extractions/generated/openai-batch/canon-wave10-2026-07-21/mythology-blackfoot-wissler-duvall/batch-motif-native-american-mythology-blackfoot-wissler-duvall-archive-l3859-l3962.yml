canonical_text:
  quote: ''
  summary: Two versions describe the origin of beaver-medicine. In the first, a hunter's
    older wife goes to the lake and is connected with Beaver; she instructs her husband
    to burn sweet grass, host water creatures, invite Sun, Moon, and Morning-Star,
    give requested feathers and hides, receive songs, and obtain the beaver-bundle
    with associated spring tobacco planting and dance rites. In the second, a hunter's
    wife goes with Beaver to his underwater home, gives birth to a young beaver, and
    Beaver offers medicine-songs to the husband in exchange for animal and bird skins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hunter camps near a lake and has two wives in the Northern Blackfoot version.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The older wife goes to fetch water, sees a young man identified as Beaver,
    accepts his invitation to his tent, and disappears from the husband's camp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The younger wife later sees the older wife rising from the water, and the
    two women kiss.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The older wife says the husband can obtain the beaver-bundle, which Beaver
    will give for taking her away.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The older wife instructs that sweet grass be burned, water creatures come
    to the tent, a feast be prepared, and Sun, Moon, and Morning-Star be invited by
    prayer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sun and Moon come down and sit with the man and woman in an ordered arrangement.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sun burns sweet grass, sings, and requests eagle-tail feathers, hawk-tail
    feathers, black-fox hides, and black-coyote skins in connection with ritual songs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Sun uses paint on his hands, gives it to the man, and the man prays to Sun
    for long life.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Sun sings all night and gives songs to the man before departing before sunrise
    to rise in the east.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: After four nights of singing, the beaver-bundle is given to the man, and Sun
    states that the people shall always have it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Sun gives seasonal instructions for spring tobacco planting, dancing, making
    a buffalo-hide vessel, feeding the Indians, and a tobacco-seed dance by the bundle
    owner and old men.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Further instructions describe digging a hole, planting seed, making an oblong
    altar, burning dry sticks, raking ashes, and having boys pray for tobacco-seeds
    to grow.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: A later inspection of the tobacco requires sweet grass burned at each corner
    of the oblong, after which tobacco is taken to the bundle owner.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: The dried tobacco is mixed with kinnikinnick, prayed over, smoked, and evaluated
    by the bundle owner as a good or small crop.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: In the Blood version, a man and wife camp alone on a small lake shore; the
    man is a great hunter with many bird and animal skins, including a white buffalo
    skin.
  category: setting
  evidence_refs:
  - ev:15
- id: obs:16
  text: In the Blood version, Beaver comes out of the water, makes love to the woman,
    and she eventually goes with Beaver to his underwater home.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: The husband finds his wife's trail going down into the water and concludes
    what has happened.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: After four days, the woman returns from the water to the lodge and is pregnant.
  category: sequence
  evidence_refs:
  - ev:18
- id: obs:19
  text: The woman gives birth to a beaver and keeps it alive in a bowl of water at
    the head of her bed.
  category: action
  evidence_refs:
  - ev:19
- id: obs:20
  text: The husband becomes fond of the young beaver and plays with him every evening.
  category: relationship
  evidence_refs:
  - ev:20
- id: obs:21
  text: Beaver knows the husband is kind to the young beaver and resolves to give
    medicine-songs in exchange for bird and animal skins.
  category: action
  evidence_refs:
  - ev:21
- id: obs:22
  text: Beaver instructs the woman to ask her husband to do whatever Beaver requests
