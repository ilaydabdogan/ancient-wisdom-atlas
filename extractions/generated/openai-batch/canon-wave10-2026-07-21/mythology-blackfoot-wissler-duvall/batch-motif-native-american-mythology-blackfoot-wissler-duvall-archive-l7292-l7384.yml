canonical_text:
  quote: ''
  summary: Bear-Moccasin and Chief-Old-Man conduct repeated killing-and-revival tests
    using songs, pipe, robe, weapons, paint, and a bear-claw. Bear-Moccasin revives
    from severe injuries, temporarily takes bear-like form, and says he can be brought
    back from any remaining body fragment. Later he survives enemy attacks while butchering
    buffalo. He then abuses his power by attempting to take the chief's wife; she
    escapes and tells the chief. The chief kills and dismembers him, but Bear-Moccasin
    returns. Another friend tells the chief to remove and burn Bear-Moccasin's canine
    teeth if he kills him again.
  language: English
  quote_policy: summarized
