canonical_text:
  quote: ''
  summary: A husband meets his wife at a river while she is carrying water to her
    buffalo-lover. She flees with him after the Bull sleeps. A buffalo herd pursues
    them, is delayed by a robe, and surrounds the tree where they hide. The woman
    reveals that white flint rock can kill the herd leader, Has-Scars-All-Over. After
    an old scabby bull discovers them, the herd attacks; the husband kills many buffalo
    and finally kills the leader with white-pointed arrows. The woman mourns the dead
    bull and admits love for him; the husband kills her and later founds the Front
    Tails society. The passage then begins a separate tale in which buffalo refuse
    a drive and elders suspect secret power.
  language: English
  quote_policy: summarized
