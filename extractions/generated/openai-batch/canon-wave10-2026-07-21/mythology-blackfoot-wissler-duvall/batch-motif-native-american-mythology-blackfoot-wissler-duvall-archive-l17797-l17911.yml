canonical_text:
  quote: ''
  summary: The passage inventories Maori carvings and chiefly artifacts in a museum
    collection and describes Maori robes, materials, loom and weaving methods, seaming,
    fine Kakahu and taniko borders, Korowai mats, and wool overlay decoration, with
    comparisons to other textile traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The collection includes Maori wood carving: two large wooden Teko-Teko images
    from old council houses, two carved prows of war canoes, and a gable-board piece
    from a council house.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The collection also contains a chief's war belt, a wooden bark-beater, a whalebone
    patu or club, and eight shawl-like garments of chiefs ornamented with feathers
    and cord fringes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Maori robe series was increased to eighteen robes, and Maori costume is
    described as rectangular mats ranging from shoulder capes and waist mats to garments
    enveloping the whole figure.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The garments vary in kind from fine silky robes and feathered cloaks to coarse
    garments made with rattling flax-leaf cylinders.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Garment value is said to depend on material fineness, ornament type and number,
    and labor, with common garments requiring about eighteen months and elaborate
    ones twice that time.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Flax leaves are scraped and beaten for fibre; varieties used for rank cloaks
    are cultivated and prepared carefully until the material resembles silk and may
    be kept for years.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ornament materials include feathers of red parrot, white pigeon, albatross,
    tui, and kawi, as well as dog hair, sealskin, and colored worsteds.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The loom is described as two sticks supporting the work, with women weaving
    by hand and using a four-thread weft in twine weaving.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage compares the Maori loom to the loom used by Indians of the Northwest
    Coast for cedar-bark garments, while noting differences in warp suspension and
    twining structure.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The same four-ply twining technique is reported to occur on basket edges in
    Borneo and adjoining islands.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Hamilton is reported as saying older garments were unseamed, but the collection's
    old robes are described as mostly seamed, with one narrow cape as an exception.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Fine dress mats called Kakahu have close taniko colored borders and are described
    as garments no plebeian would be allowed to wear; the Museum has no example of
    them.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: A Korowai is described as a woman's mat with twisted-fibre shreds introduced
    during weaving and arranged in stripes, groups, or across the surface, often with
    black fringe and colored feathers or wool.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Many mats are woven upside down, and long warp ends are later rolled into
    a soft rope finish for the neck.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: One old garment in the Museum collection has brown and black wool overlay;
    this decoration is also found on otherwise undecorated mats and on some Korowai-type
    mats.
  category: object
  evidence_refs:
  - ev:9
