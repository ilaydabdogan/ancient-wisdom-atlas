canonical_text:
  quote: ''
  summary: 'An ethnographic passage describes Shoshone social organization: absence
    of clan divisions, food-based band names, camp and village arrangements, camp-circle
    use, chiefly authority, succession, police assistants, absence of tribal judicial
    functions, and examples of punishment and kin terminology.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Shoshone social organization was extremely simple
    and that no totemic or other clan division had been found among them.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Shoshone proper are said to have been designated n^'mo, meaning people,
    while many local groups had names formed with an “eater” term preceded by a food
    item.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage lists named bands or groups including Salmon-eaters, Sheep-eaters,
    Squirrel-eaters, seed-eaters, Groundhog-eaters, White-Knives, Pine-nut eaters,
    Bannock, Wind River people, and Fort Hall people.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ross is reported as recognizing three divisions and as describing one division
    as superior, central in council, and occupying the central space in camp when
    the divisions camped together.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Shoshone sometimes gathered in villages, but early explorers also encountered
    isolated families or small family bands.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some informants remembered a camp-circle used for councils, dances, times
    of war, and tribal hunting; horses were kept inside and the circle opened toward
    the east, as did individual lodges.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says chiefly powers were advisory rather than dictatorial; little
    chiefs gained dignity through warlike deeds, and the head-chief directed camp
    affairs, councils, visitors, and hunting or fishing excursions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: At dances or hunts, the chief was assisted by di'rakone, policemen armed with
    quirts, and at Fort Hall a camp crier announced important occurrences.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The head-chieftaincy is described as nonhereditary, although a son might sometimes
    succeed; Tu'pambe was recognized as Tendoy’s heir-apparent despite older sons.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that neither chief nor tribe member exercised judicial
    functions, and murderers were dealt with by the victim’s family and friends.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: In cases of adultery, a husband sometimes shot one of the offender’s horses;
    the passage gives an example in which Mo'bi shot a lover’s horse and was later
    bound and sentenced by government-appointed Indian judges.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage begins a list of terms of relationship with A'p5, glossed as father
    or father’s brother.
  category: relationship
  evidence_refs:
  - ev:7
