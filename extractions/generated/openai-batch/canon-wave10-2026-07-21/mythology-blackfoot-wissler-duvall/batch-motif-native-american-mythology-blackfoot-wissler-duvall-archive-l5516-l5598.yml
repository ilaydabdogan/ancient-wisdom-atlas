canonical_text:
  quote: ''
  summary: A chief's daughter, sought by many young men, repeatedly borrows and cares
    for a large brindle travois dog. After she wishes the dog were a young man she
    could marry, the dog becomes a nocturnal human visitor. She identifies him by
    marking him with white earth and later by biting his finger, which corresponds
    to the dog's painted body and injured toe. The dog becomes a man before her, says
    the situation follows from her wish, and they leave camp together. After four
    years they return with two children, and the dog-man stays with his former owner
    while hiding his feet or moccasins in a way that makes people suspicious.
  language: English
  quote_policy: summarized
