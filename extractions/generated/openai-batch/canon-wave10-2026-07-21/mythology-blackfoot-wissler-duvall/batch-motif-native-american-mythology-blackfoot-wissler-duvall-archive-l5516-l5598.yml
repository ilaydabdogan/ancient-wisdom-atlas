  - ev:4
- id: obs:6
  text: She prepares white earth mixed with water and uses it to mark the visitor's
    hair, robe, and back.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At a dance the next day, none of the men in camp has the paint marks, but
    the travois dog has white paint stripes matching the marks she made.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: On a later visit she bites the visitor's middle finger; after a dance in which
    the young men show their hands, no man has a bruise, but the travois dog is lame
    and has a toe nearly cut in two.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: She borrows the dog for water, takes him into the brush out of sight of camp,
    and tells him he is the one who visits her at night.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The dog becomes a man, removes the travois, and tells the girl that it was
    her fault because she wished it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The girl calls the situation a disgrace and asks to go far away from camp;
    the dog-man proposes returning with the water and leaving at night when people
    are asleep.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: At night the girl leaves after telling her mother she is going out, and the
    dog-man appears; they go away together.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The next morning the chief asks for the missing girl, and the dog's owner
    asks for his missing large travois dog.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The dog-man and the girl are gone for four years and have two children, a
    boy and a baby-girl; the passage says the children are real people because the
    dog-man is now a person.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: When they return to the girl's people, the dog-man calls at the lodge of his
    former owner, has ten dogs with him, says he belongs to a far-away tribe that
    speaks the same language, and changes moccasins out of sight, making people suspicious.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: An editorial note says the myth is widely distributed and describes a favorite
    Blackfoot theme in which an overvalued maiden is humiliated by marrying a promising
