  text: The girl is described as the daughter of a head man or chief, and many young
    men seek her as a wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man in the camp owns a very large brindle dog; the girl borrows the dog,
    hitches him to a travois for wood, feeds and pets him, and he accompanies her
    for water.
  category: relationship
  evidence_refs:
  - ev:1
