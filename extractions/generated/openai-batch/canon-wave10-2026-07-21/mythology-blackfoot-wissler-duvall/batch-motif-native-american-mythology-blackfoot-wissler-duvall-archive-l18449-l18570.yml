  text: Some carved wooden boxes are described as apparent imitations of plaited basket
    tobacco-pouches.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wood carving is represented by a monkey-headed staff, a large hat surmounted
