canonical_text:
  quote: ''
  summary: 'The passage describes Asian and Philippine museum collections: Korean
    fieldwork, gifts from Tibet, India, China, and Manchuria, the Jesup Philippine
    collection, rice and textile industries, a bamboo rice mill, transportation and
    habitation models, Bontoc Igorot objects, carved and imitative forms, ornaments,
    and lime-box decorative patterns compared with patterns from parts of the Malay
    area, Borneo, and Sumatra.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Collections from Asia and the Malayan area are introduced, including Korean
    fieldwork and gifts such as Tibetan scrolls, Indian weapons, Chinese token coins
    and a sceptre-like object, and a Manchurian pipe.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Jesup Philippine collection is described as representing four cultures:
    Christianized tribes, Pagan tribes, Moro tribes, and Negrito tribes.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Rice industries, textile arts, and the hemp industry are represented in the
    Philippine collection; the passage notes the distribution of rice culture on the
    Asiatic continent and suggests possible acquisition by Malayan groups from a southern
    Asiatic culture center.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Philippine rice mill is described as made almost entirely of bamboo and
    seemingly modeled on an Old World stone mill.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Transportation by water and land is represented by boat models and real boats
