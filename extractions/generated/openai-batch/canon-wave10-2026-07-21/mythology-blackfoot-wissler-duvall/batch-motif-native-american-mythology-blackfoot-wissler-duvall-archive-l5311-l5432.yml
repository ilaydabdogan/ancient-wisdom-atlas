canonical_text:
  quote: ''
  summary: The supplied passage contains the end of a shield-power account, the tale
    of the Eagle-Head Charm, and the opening tale of the Pigeons. A boy demonstrates
    and later uses a medicine shield with buffalo-like actions, dust, storm, cottonwood
    trees, a horse, and an elk-horn hook. A man seeking power at an eagle nest is
    taken into the nest, meets eagles including an eagle-person, receives songs and
    nonlethal blessings, and later makes an eagle-head charm and whistle associated
    with safety and success. An old Piegan mourner named Changes-His-Camp encounters
    pigeons or turtle-doves, who give him a society, dance, and foretell revenge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy sits wrapped in a buffalo robe and sings while a runner brings a shield
    into the lodge without stopping.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy puts on the shield by using the carrying strap, falls into a dug hole,
    rolls in dust, grunts like a buffalo, rises, and shakes himself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A great storm immediately follows; dust shaken from the boy rises straight
    upward, the lodge containing the shield remains standing, and other lodges are
    blown over.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: During a later enemy attack on the Piegan camp, the boy remains seated in
    his lodge until he sends for young men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young men place many young cottonwood trees against the boy's lodge, and
    the boy has his horse brought in.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boy puts on wristlets, armlets, and a necklace, takes the shield, sings,
    rolls in dust, shakes himself, shoots upward through the lodge top, breaks some
    cottonwood trees, and comes down astride his horse.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The horse jumps four times; the enemy run; the boy pursues them and strikes
    them with the elk-horn hook hanging on the shield, and each person struck dies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The shield takes its name from its owner, who always sat down, though the
    people call him he-who-never-sits-down.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: A man sees a buffalo-calf standing in an eagle nest at the top of a tall tree
    and sleeps at the foot of the tree hoping to receive power.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After hearing a puff of wind, the man wakes in the eagle nest; he sees two
    eagles circling, takes two young eagles in his arms, and cries.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The female eagle says the man pities their children and asks that something
    be done for him; the male eagle knocks the buffalo-calf and a dead calf off the
    nest and becomes a person.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The eagle-person has a straw in the bunch of hair on the top of his head and
    says it is to make the man as hard to hit in a fight as a straw.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The eagle-person sings songs concerning enemies, guns, the head-top, and power;
    he gestures as if flying and searching, blows his whistle four times, and takes
    the man down to the ground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The eagle-person throws a tail feather through a calf as a model for killing
    enemies; the man rejects that kind of power, the female eagle asks for another
    power, and the male eagle gives long life and good luck.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The man later receives the head and wing-bone of a white-headed eagle from
    young men, ties the head to his hair, makes a bone whistle, succeeds in raids
    and fights, and in old age transfers the charms and formula to a younger man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Changes-His-Camp, an old Piegan man, mourns his son on a high hill in the
    fall near many pigeons or turtle-doves.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:17
  text: The turtle-doves say they will give the old man a society, say revenge is
