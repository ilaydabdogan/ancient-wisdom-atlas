canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which Kxua’naL is mistaken for
    salmon by Snéné’iq beings, escapes when they faint, and later leads people to
    kill the Snéné’iq family in their mountain house with burning cedar-bark and urine
    smoke, taking their accumulated wealth. It then gives another Snéné’iq episode:
    a man in an underground lodge shoots a figure looking through the roof entrance;
    later Kodanatoxai’x finds the grieving Snéné’iq mother, imitates her wails, receives
    a copper and permission to take masks and other goods from her dead son’s mountain
    house, and uses the masks in the ka’siut. The final lines begin a new episode
    about a girl asking for mountain-goat tallow.'
  language: English
  quote_policy: summarized
