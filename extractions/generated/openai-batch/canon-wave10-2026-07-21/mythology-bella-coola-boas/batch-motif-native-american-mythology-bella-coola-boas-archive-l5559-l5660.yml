  quote_or_summary: In early times at Nurwé’ix, people live in underground lodges
    with roof entrances. A woman sees something looking in; her husband shoots through
    the entrance, hits the throat of the supposed enemy, hears it roll down the roof,
    and finds nothing outside at daylight.
