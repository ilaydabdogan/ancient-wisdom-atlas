- id: ev:7
  type: summary
  locator: lines 5623-5631
  quote_or_summary: A villager going upriver hears loud wailing and is frightened;
    many men go but are also frightened. Kodanatoxai’x offers to find the cause.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 5631-5637
  quote_or_summary: Kodanatoxai’x goes upriver by canoe with one friend, sees a large
    Snéné’iq on a flat rock, imitates her wails, and is told she is glad because she
    has lost her son.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 5637-5646
  quote_or_summary: The Snéné’iq says she will repay Kodanatoxai’x’s kindness, gives
