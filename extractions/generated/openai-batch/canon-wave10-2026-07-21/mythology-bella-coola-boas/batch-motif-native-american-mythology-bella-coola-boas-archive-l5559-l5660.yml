candidate_motifs:
- id: motif:1
  label: Nonhuman captors treat a human as game or fish
  taxonomy_refs: []
  basis: The Snéné’iq handle Kxua’naL as if he were salmon, prepare him on a mat,
    and begin cutting him.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not explain the Snéné’iq category beyond the actions
    described here.
- id: motif:2
  label: Escape from monster by crossing water
  taxonomy_refs: []
  basis: Kxua’naL escapes a pursuing Snéné’iq by jumping into the river because the
    Snéné’iq is unable to swim.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The taxonomy list includes water as a symbol but no exact motif family
    for water-boundary escape.
- id: motif:3
  label: Collective attack on dangerous mountain-dwelling beings
  taxonomy_refs: []
  basis: Kxua’naL organizes people to climb to the Snéné’iq mountain house and attack
    with arrows, fire, cedar-bark smoke, and urine.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: This is recorded as a narrative pattern rather than a named comparative
    type.
- id: motif:4
  label: Deadly smoke drives or kills beings inside a house
  taxonomy_refs:
  - world_destroying_fire
  basis: Burning cedar-bark and urine are pushed or poured into the closed house,
    producing poisonous smoke that kills the Snéné’iq family.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The event is localized to one household; the available taxonomy label
    'world_destroying_fire' is broader than this passage.
- id: motif:5
  label: Wealth obtained from slain nonhuman household
  taxonomy_refs: []
  basis: After the Snéné’iq family is killed, people enter the house and take accumulated
    wealth; in the following episode, goods are also taken from a dead Snéné’iq son’s
    house.
  evidence_refs:
  - ev:5
  - ev:11
  confidence: high
  cautions: The passage presents both violent seizure and authorized retrieval; they
    should not be conflated as identical acts.
- id: motif:6
  label: Mourning nonhuman mother rewards a human who joins her wailing
  taxonomy_refs:
  - sacred_exchange
  basis: Kodanatoxai’x imitates the Snéné’iq mother’s wails; she says she will return
    his kindness and gives him a copper and access to her son’s house.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage frames the act as kindness and reward, but does not use the
    term sacred.
- id: motif:7
  label: Ritual masks acquired from a nonhuman house
  taxonomy_refs:
  - sacred_exchange
  basis: The Snéné’iq mother tells Kodanatoxai’x that masks in her son’s house should
    be used in the ka’siut, and he later uses the found masks in winter dancing.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage names the ka’siut but does not explain its ritual context
    beyond the use of masks in winter dancing.
- id: motif:8
  label: Shooting an unknown night visitor through a roof entrance
  taxonomy_refs: []
  basis: The husband thinks an enemy is attacking through the lodge roof entrance
    and shoots, later revealed through the found body to have killed the Snéné’iq
    son.
  evidence_refs:
  - ev:6
  - ev:10
  confidence: high
  cautions: The passage delays identification of the target until later in the story.
