  text: Aiavila’axa is guardian of the moon, restores the moon to full size every
    month, and cleans the moon’s face after an eclipse; the moon is called A’ni’arg‘ila.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A female deity has charge of the birth of all animal beings and rocks a cradle
    while singing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Nono’osqa, called the mother of flowers and daughter of Snukpa’nuits, gives
