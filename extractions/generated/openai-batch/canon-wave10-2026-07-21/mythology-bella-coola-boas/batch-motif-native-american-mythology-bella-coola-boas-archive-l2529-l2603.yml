    old women assist her and call a shaman to her aid.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Every year at the winter solstice the deities determine who shall die during
    the ensuing year by placing two beings on the ends of a swinging plank and calling
    men and animals to stand near the plank ends.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: When one of the two beings falls from the plank, the person standing near
    that being will die sooner than the one at the opposite end.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Nutsekoa’lsika, whose name means “long ear,” carries news from earth up to
    the House of Myths.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: 'Axk’unta’m has two children: the deer Snod’lexelts ALk’unta’m, called the
