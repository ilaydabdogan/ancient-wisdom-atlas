candidate_motifs:
- id: motif:1
  label: Restricted initiatory access and divine transmission of dances
  taxonomy_refs:
  - initiation
  basis: The passage links kua’siut secrets to initiation, blocks non-initiates from
    approaching, and describes new dances sent down by deities.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage is descriptive and does not narrate an initiation ordeal or
    sequence.
- id: motif:2
  label: Divine intercession against threatened punishment, death, and sickness
  taxonomy_refs:
  - divine_judgment
  basis: Anugat’o’tsem, Snitsma’na, and Aiatila’axa intervene for humans when principal
    deities threaten punishment, death, or sickness.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage does not describe moral criteria for the threatened punishment,
    so the judgment label should be reviewed.
- id: motif:3
  label: Moon restoration after monthly waning and eclipse
  taxonomy_refs:
  - seasonal_cycle
  basis: Aiavila’axa restores the moon to full size every month and cleans its face
    after an eclipse.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage gives a cosmological function rather than a full narrative
    episode.
- id: motif:4
  label: Divine care of animal births
  taxonomy_refs:
  - sacred_birth
  basis: A female deity is in charge of the birth of all animal beings and rocks a
    cradle while singing.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The deity’s name is not preserved in this passage segment.
- id: motif:5
  label: Spring mother of flowers gives birth to plants
  taxonomy_refs:
  - seasonal_cycle
  - mother_goddess
  - sacred_birth
  basis: Nono’osqa is called mother of flowers and gives birth every spring to all
