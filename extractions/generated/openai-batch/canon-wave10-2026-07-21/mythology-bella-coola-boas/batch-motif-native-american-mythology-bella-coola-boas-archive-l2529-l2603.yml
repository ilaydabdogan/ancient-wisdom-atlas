canonical_text:
  quote: ''
  summary: 'The passage describes figures and functions in the House of Myths: guardians
    and dance deities, intercessory deities who protect humans from punishment and
    death, a moon guardian, a deity connected with animal births, Nono’osqa as mother
    of flowers and spring plant birth, an annual winter-solstice determination of
    who will die, a messenger between earth and the House of Myths, children of Axk’unta’m,
    and four brothers who execute divine intentions and teach human arts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed male figure in a corner of the house prevents people who are not
    initiated in the secrets of the kua’siut from approaching the house.
  category: action
  evidence_refs:
  - ev:1
