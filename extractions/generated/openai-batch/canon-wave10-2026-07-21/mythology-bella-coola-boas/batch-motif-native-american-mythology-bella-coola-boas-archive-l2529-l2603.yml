    to send one.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another deity has the office of singing to accompany the ka’siut dances of
    the gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Anugat’o’tsem intervenes on behalf of humans when Senx and ALk’unta’m threaten
