canonical_text:
  quote: ''
  summary: 'The passage gives tabular ancestor names, then states that the Sun created
    and sent groups of men to Skeena River and Bute Inlet, where they became ancestors
    and received salmon-weirs for village sites. It then begins the tradition of Se’lia:
    in a dark primordial world, Totoso’nx descends from heaven to a mountain near
    Fraser River, lives with Raven, travels by river and sea to find people, reaches
    a shell-covered abalone chief’s house where the sun rises, exchanges canoes, and
    continues along the sun’s course toward the western world-post and copper country.'
  language: English
  quote_policy: summarized
