  quote: ''
  summary: 'An appendix passage reports a practice involving half-grown eaglets: people
    climbed cliffs with ropes, raised the birds, removed tail-feathers when they were
    full-grown, and released them. It also reports an unclear belief about feeding
    an eaglet first and the brood dying. A following note states that suicide was
    common and gives causes such as shame, remorse, disappointment, or quarrels, though
    the method is obscured by OCR corruption. The passage ends with the heading for
    a section on Salish basketry designs.'
