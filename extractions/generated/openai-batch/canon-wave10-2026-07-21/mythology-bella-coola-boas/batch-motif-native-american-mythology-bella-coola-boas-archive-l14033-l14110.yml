canonical_text:
  quote: ''
  summary: The passage gives an ethnographic account of Thompson food storage and
    preparation practices, including long-term salmon preservation, salmon-roe preparation,
    salmon-oil extraction and storage, root and berry drying, basket boiling with
    hot stones, roasting with fire, pounding with pestles, and preparation of dishes
    using fish, berries, roots, grease, blood, and flour.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Families kept surplus salmon from each season's catch for two or three years
    for emergencies, and salmon-heads were dried and stored.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Salmon-roe was wrapped in dry grass or bark, buried until nearly rotten, and
    then roasted or boiled.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Salmon-oil was made in a stone-lined, mud-plastered pit by boiling fat salmon
    with water and heated stones, stirring the mixture, and simmering it until the
    oil was extracted.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After cooling, floating salmon-oil was skimmed off; boiled salmon was squeezed
    and basketed, and oil was stored in prepared salmon-skins tied and sealed with
    salmon-roe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some Upper Thompsons stored mixtures of salmon-oil with deer or elk grease,
    or salmon-oil with pounded roasted salmon-flesh, in salmon-skins; the Nicola band
    prepared catfish oil similarly from the liver.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Roots were threaded and dried; berries were dried on mats in the sun or made
    into cakes by basket boiling with hot stones, mashing, and drying on plant layers
    and pole frameworks.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Berries and meat were mashed with pestles on large flat stones.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Food was boiled in baskets with red-hot stones and roasted on spits before
    fire, under ashes, or in underground ovens.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Several dishes combined dried venison, berries, roots, salmon-roe, bearberries,
    deer-grease, deer blood, or flour through boiling, pounding, mixing, and cooling
    into cakes or porridge-like preparations.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Large fish tails were roasted before fire until crisp; salmon could be soaked
    until half decayed and cooked with berries and roots; fried salmon or trout could
    be soaked, pounded, and eaten with grease.
  category: sequence
  evidence_refs:
  - ev:10
