literal_observations:
- id: obs:1
  text: Quartzite pebbles were found in gravel on a river bank and on mountain-sides,
    and almond-shaped flakes were broken from them.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some almond-shaped flakes were used for scraping without additional flaking,
    as indicated by worn and polished broader ends.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A finished stone skin-scraper was described as an almond-shaped flake perfected
    by chipping around the edge.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Stone scrapers were inserted into split wooden handles about three feet long
    and secured by winding the holding portion with a thong.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: After skins were fleshed and freed from hair, they were stretched on pole
    frameworks and scraped or poked until dry to prevent stiffness.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bone scrapers were made from deer posterior metapodial bone and from scapula,
    and examples were found on the surface and in a grave.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A similar contemporary scraper was made from a horse rib or barrel-hoop, with
    rag-wrapped ends for handles, and used like a draw-knife to beam deer-skins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Awls and needles were described as required for garment manufacture, with
    examples made of steatite, chalcedony, basalt, and bone.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bone awls and related points were said to be adapted for sewing skins or possibly
    for plaiting baskets.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: One bone awl bore traces of red ochre, and another was made from one half
    of the distal end of a deer metapodial.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bone needles, both fine and coarse, were found in graves and scattered through
    the ground; each had an elliptical eye, and one had incised-line ornament.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that many implements used for hunting were probably also
    used in warfare.
  category: relationship
  evidence_refs:
  - ev:7
