canonical_text:
  quote: ''
  summary: The passage describes Thompson Indian arrows, quivers, early firearms,
    native hunting dogs, and methods of deer hunting, including dog-assisted pursuit
    to water, drowning deer at river crossings, night ambush at swimming places, and
    the later obsolescence of some practices due to changes in deer behavior and fencing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: War arrows are described as having detachable foreshafts, often made of antler
    or bone, barbed, poisoned, and sometimes painted with spiral lines, rings, or
    black coloration.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hunting arrows could be made without points, could be barbed, and could have
    detachable heads tied by string to the shaft to impede animals after the head
    disengaged.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Animal figures were branded on shafts of hunting arrows, while human figures
    were branded on shafts of war arrows.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Quivers were made from several materials, including tanned deer, elk, buffalo
    hide, clipped buffalo-fur, wolverine, dog, coyote, other skins, and sagebrush.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some quivers had pouches for fire-drill and tinder, and some had covers to
    protect arrows.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Flintlock muskets were the first guns used by the Thompson Indians and were
    adopted in warfare and hunting; later repeating rifles became common.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Native hunting dogs resembled coyotes, were poor watch-dogs but good hunters,
    and are said to have become extinct through interbreeding with introduced dogs.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Valued deer-hunting dogs were tied up, fed sparingly on good food, and sometimes
    purged with medicine and sweat-bathed before a hunt.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A hunter started before daybreak with dogs held by a halter with a toggle,
    found tracks of a large buck, released the dogs, and followed at a run.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: Dogs generally drove deer to water or to larger rivers, where deer often tried
    to cross at favored places.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At river crossings, people pursued swimming deer in canoes, caught them by
    the antlers with a hooked stick, pulled the head underwater, and held it there
    until the deer drowned.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: During fall and later seasonal movements, people lay in wait at regular swimming
    places at night and shot deer with bow and arrows as they landed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage reports that deer formerly swam Thompson River in large numbers
    but had nearly stopped doing so in the preceding decade, making that hunting method
    obsolete.
  category: sequence
  evidence_refs:
  - ev:7
