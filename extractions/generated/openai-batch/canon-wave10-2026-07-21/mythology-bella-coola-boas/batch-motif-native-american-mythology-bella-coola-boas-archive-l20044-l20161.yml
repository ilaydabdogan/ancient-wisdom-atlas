canonical_text:
  quote: ''
  summary: The passage describes routes and settings associated with the country of
    souls, including a lodge with east and west doors and an alternate canoe crossing
    over a lake. It also records beliefs about animal worlds underground, prayer to
    mysterious powers in nature, and offerings or painted faces used to appease spirits
    at sacred mountains and lakes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A lodge-like structure is described as long from east to west, shorter north
    to south, rounded like an ant-hill, and made of clay or clay-like material within
    the supplied fragment.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The structure has an eastern doorway and a western doorway; the trail reaches
    the eastern door, while entry to the land of ghosts is through the western door.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A double row of fires runs through the length of the lodge, and people are
    always present in it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: When deceased friends expect a soul to arrive, they assemble in the lodge;
    the arriving soul hears talking, laughing, singing, and drums, and is welcomed
    by name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: On entering, the newcomer sees a broad country with pleasant air, light, warmth,
    flowers, grass, ripe berries, and people dancing and singing with drums.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The people of the spirit-land are said in this account to lift the newcomer
    on their shoulders, run around with him, and make noise.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Other reported accounts describe the souls as clothed like they were in life,
    and some describe people living in lodges but without visible fires or winter
    houses.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: Another tale describes the way to the country of souls as crossing a lake
    in a canoe for several days through dim air until the light grows and the shore
    appears.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A figure associated with the account is summarized as showing a canoe crossing
    for souls, a land of ghosts and dancing souls, a lake surrounding the earth, and
    an earth with rivers and villages.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Certain animals are believed to have hidden underground worlds with concealed
    entrances, where animals are born and from which they wander into the human world.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Animals may return to their own worlds, making them scarce in the human world
    for a time; some accounts distinguish animal souls, while others say animals go
    to the same land as humans.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Animals are said to wander in the human world to benefit mankind and to return
    home when Indians ill-use them or no longer need them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Some Indians say deer and other game were provided for Indians rather than
    whites, and that game diminishes as Indians decrease in number.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Prayers and observances are said to rest on belief in mysterious powers pervading
    nature, including stars, dawn, mountains, trees, and animals.
  category: other
  evidence_refs:
  - ev:7
- id: obs:15
  text: Old prayers addressed the supplicated spirit simply as “Thou” or “Chief,”
    and were chiefly for fulfillment of desires and protection from harm.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: Making fun of prayer is said to result in derangement of mind or bodily affliction.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:17
  text: High mountain peaks, hills, and certain places are described as sacred residences
    of land mysteries, with rain or snow following human treading or first visits
    in some cases.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:18
  text: Hunters near sacred places made offerings such as hair, cloth, powder, shot,
    tobacco, or stones to appease spirits and secure weather and hunting luck.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: Women picking berries or digging roots on certain mountains painted their
    faces red, and people painted their faces red before certain lakes for good weather
    and fishing; the paint is called an offering to spirits.
  category: action
  evidence_refs:
  - ev:9
