canonical_text:
  quote: ''
  summary: The passage lists Thompson Indian omens, taboos, and signs concerning death,
    hunting luck, gambling luck, bodily signs, animals, corpse contamination, salmon
    runs, coyote-related weather beliefs, lightning-struck wood, and weather signs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Animal cries or unusual sounds near a dwelling are described as signs of death,
    including cries of an owl or coyote, long howling by a dog, cock-crowing, and
    imagined weeping near a house.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Finding a dead young mouse on one's path is said to portend the death of a
    young child known to the finder.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Elderly men placed fingernail clippings one at a time on a hot stone by the
    fire; gradual burning was a good sign, while a clipping jumping off the stone
    was taken by the man as a sign that he would die soon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a rock called “The Marmot” on the Salmon River trail, a person expected
    to die soon was believed unable to pass through the narrow passage without sticking;
    a marmot running out and crying was another warning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A buckskin thong worn around the neck was not to be cut by the wearer because
    this was treated as symbolic of cutting one's own throat and was associated with
    violent death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A sudden peculiar crack and hissing noise from the fire was taken by a hunter
    as a sign that he would kill deer the next day; repeated noises indicated several
    deer.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A hunter going out in the morning before eating was considered lucky, while
    carrying a lunch was considered unlucky, with dried serviceberries noted as an
    exception some carried.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Four is described as a lucky number, and the Indians are said to count by
    fours in counting, dividing, and especially gambling.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Buzzing in the ear is identified as the dead calling, and a tree falling in
    calm weather is called a bad omen.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Touching hair with the fingers is said to prevent it from growing long; sneezing
    indicates that someone is talking about or naming the person; a hard-beating heart
    signals news, probably bad news.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A dog lying with its lower jaw on both front paws indicates that a visitor
    with a pack of food or presents will come; a cock crowing after dark and before
    midnight is a bad omen of recent origin.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: A female black bear is said to have premature young if falling leaves touch
    her back, so she enters her hole when leaves begin falling; the male black bear
    enters his den much later.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A married man was believed luckier at gambling than an unmarried man, and
    warts on a person were said to show that the person is stingy.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Corpses are described as contaminating everything they contact; a corpse taken
    across a river in a canoe prevents fish from being caught for four days, and a
    drowning during the salmon run causes fish to cease running for several days.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: Many red worms in wild cherries are said to indicate that there will be many
    salmon.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: A person bathing in the river must bathe below, not above, fishing platforms,
    because salmon are said to be affected downstream from the bathing place.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Children are forbidden to mention the coyote's name in winter because the
    animal might turn on its back and immediately bring cold weather; fog or mist
    is also attributed by some to the coyote turning over.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:18
  text: Burning wood from lightning-struck trees is said to bring cold weather; stepping
    over or on such wood causes swelling or sickness; touching or taking a lightning
    arrow-head is said to make a person go crazy.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:19
  text: A cat rolling over is said to be a sign of good weather.
  category: relationship
  evidence_refs:
  - ev:11
