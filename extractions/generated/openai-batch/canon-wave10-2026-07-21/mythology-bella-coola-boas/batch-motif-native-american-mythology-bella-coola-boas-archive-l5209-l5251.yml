canonical_text:
  quote: ''
  summary: The Sun devises a new attempt to kill a visiting youth by using his daughters,
    who take the form of mountain-goats on a meadow near a precipice. The Sun exchanges
    arrows with the youth and gives him coal-pointed arrows that fail to kill the
    goats. The goats drive the youth over the steep mountain, but he transforms into
    a ball of bird’s down and survives. He retrieves his own arrows, kills the goat-formed
    daughters, proves their deaths to the Sun, then restores them to life by reattaching
    their feet and throwing the bodies into a little river. The girls give him a new
    name meaning that he restored them to life, and the Sun offers him marriage to
    his two eldest daughters.
  language: English
  quote_policy: summarized
