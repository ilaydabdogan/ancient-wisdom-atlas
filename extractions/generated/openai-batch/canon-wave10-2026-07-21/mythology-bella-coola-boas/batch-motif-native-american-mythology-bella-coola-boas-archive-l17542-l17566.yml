canonical_text:
  quote: ''
  summary: The passage describes rules for inheritance of subsistence places, household
    goods, animals, and equipment, followed by regulations for dividing deer and other
    large game among hunting parties and a stranger arriving during butchering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Deer-fences, fishing-stations, and eagle’s eyries are inherited by all male
    children; the eldest has the right to divide them and choose first.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hunter eldest son generally takes the deer-fence, while a fisherman brother
    may receive the fishing-station; sometimes sons use the places in common until
    deaths leave a survivor who claims all and transmits them to his sons.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: If a man dies without sons, nearest male relatives take his hunting places;
    if there are no near male relatives, daughters and sons-in-law inherit the property.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A widow with children inherits her deceased husband’s lodge, which belongs
    to her and her children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The widow or female children inherit kettles, baskets, cooking utensils, and
    some blankets or robes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Males inherit canoes and fishing, hunting, and trapping utensils; dogs of
    the deceased that are not killed become property of the male children.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Horses are divided among all children, male and female, with males taking
    twice as many or first choice; some hold that daughters inherit a father’s horses
    before male relatives other than brothers.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: In deer distribution, the shooter receives the brisket and skin, while the
    rest of the animal and intestinal fat are divided equally among the other hunters.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A stranger hunter arriving while a deer is being butchered receives some meat,
    and among the upper portion of the tribe large game is invariably divided among
    hunting-party members.
  category: action
  evidence_refs:
  - ev:6
