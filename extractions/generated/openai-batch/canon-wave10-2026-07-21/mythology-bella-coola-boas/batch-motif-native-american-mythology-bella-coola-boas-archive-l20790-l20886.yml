  quote: ''
  summary: The passage describes Thompson beliefs and practices concerning warrior
    guardian spirits, scalp knowledge, weapon protection and healing, ritual painting,
    feather power, tests of guardian-spirit protection, souls, the lower world, ghosts,
    ghost behavior, and means of avoiding or repelling ghosts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Only warriors whose guardian spirits gave them the mystery of the scalp were
    said to take or wear scalps.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some warriors sought scalp knowledge by washing in water containing arrow-heads
    or by praying to weapons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Warriors who did not know the mystery of a scalp risked evil consequences
    if they wore one.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some men wore many scalps on horns, hair, belts, or weapons, and regular scalp-takers
    regarded scalps as spirits.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: A wounded warrior could be struck over the body with an arrow while another
    warrior sang and said that his wolf arrow would make him well.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Warriors whose chief guardian spirit was an arrow, knife, or other weapon
    were described as protected against hostile weapons and as healing quickly if
    wounded.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man who killed an enemy blackened his face with charcoal; if he failed to
    do this, the victim's spirit was said to be able to blind him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Warriors smoked to the sun and sometimes to the four points of the earth,
    painted body patterns according to dreams, and painted weapons with skeleton designs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Golden-eagle tail-feathers were highly valued and used by shamans and warriors
    on hats, head-bands, hair, and weapons.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A person wearing golden-eagle feathers was supposed to possess the bird as
    a guardian spirit or to claim power equal to shamans.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Some men killed themselves, or were shot by others, in attempts to test whether
    guardian spirits could restore life or make a person proof against bullets or
    arrows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Living persons, animals, growing things, rocks, fire, and water were said
    to have souls because they had been people in the mythological age.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Souls were said to appear in the lower world as they did at death and to continue
    their former occupations without sickness or want.
  category: setting
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:14
  text: The setting sun was believed to draw the soul along, so people avoided sleeping
    with their heads toward sunset.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Each soul was said to have a shadow that remains in this world after death
    as the ghost of the departed.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: After death, the ghost was said to wander for four days and four nights among
    familiar people and places, then generally haunt the death or burial place.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The dead were said to try to send sickness into surviving relatives so that
    the relatives would join them in the underworld.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: Ghosts were said to be ordinarily invisible but bodily, visible to shamans,
    skilled persons, dogs, and horses; they appear at night and sleep with the bones
    by day.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:19
  text: Whistling after dark was said to attract ghosts; imitating ghost sounds and
    using horseshoes, shod horses, or bell-spurs were described as ways to avoid or
    repel ghosts.
  category: action
  evidence_refs:
  - ev:10
- id: obs:20
  text: Ghosts were described as light-gray, partly or wholly naked, with blue fire
    at the mouth and eyes, and with blue fires near graves said to be their breath.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:21
  text: A dead person's nail, hair, or bone could assume ghost form, pursue people,
    disappear when shot with an arrow, and leave the corresponding body part behind.
  category: action
  evidence_refs:
  - ev:12
- id: obs:22
  text: Pursuing ghosts were said not to leave the trail, allowing a person to avoid
    them by turning aside from it.
  category: attribute
  evidence_refs:
  - ev:12
