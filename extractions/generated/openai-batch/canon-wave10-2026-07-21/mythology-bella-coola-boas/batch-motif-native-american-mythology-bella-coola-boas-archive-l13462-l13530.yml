  summary: The passage describes Thompson hair-dress practices for men, women, warriors,
    children, puberty-rite participants, mourners, and the use of animal-skin ties.
    It emphasizes differences by gender, age, warrior status, ritual occasion, mourning,
    and adornment with feathers, ochre, clay, and guardian-animal skin.
