literal_observations:
- id: obs:1
  text: Men’s hair could be braided, tied with a string, left loose, cut across above
    the brow, parted, or tied in knots at the front or back.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women commonly divided the hair into two side braids, with the braid ends
    often tied together at the back; young women could wear two braids folded up on
    each side.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Warriors wore a front hair knot on one side, with the opposite side loose
    or braided into a queue; the passage says this was used both on the war-path and
    ordinarily.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Warrior top-knots were decorated with eagle or hawk tail-feathers, small feathers,
    and red ochre.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other warrior hair styles included upward braids stiffened with white clay,
    crossed short braids, horn-like stiffened braids, and a fiery-red front braid.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Children of both sexes usually wore loose hair until puberty.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: During puberty rites, girls had the hair made into two knots behind the ears,
    while boys had the hair made into one knot at the back of the head.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Widows, widowers, and other mourners had the hair cut straight across the
    shoulders or back of the neck.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Loose hair and braid ends were generally tied with a narrow animal-skin strip,
    often from the person’s guardian.
  category: object
  evidence_refs:
  - ev:7
