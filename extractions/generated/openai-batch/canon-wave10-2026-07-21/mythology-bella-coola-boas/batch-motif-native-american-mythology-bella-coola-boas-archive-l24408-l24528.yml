canonical_text:
  quote: ''
  summary: The passage is an archaeological description of artifacts from the Thompson
    River region, including stone drills or perforators, sandstone arrowshaft-smoothers
    found in graves, carved or charred bone objects of uncertain use, skin-scrapers,
    bone awls, and an iron awl found with a skeleton at Kamloops. It offers functional
    hypotheses for several objects but does not present a mythic narrative.
  language: English
