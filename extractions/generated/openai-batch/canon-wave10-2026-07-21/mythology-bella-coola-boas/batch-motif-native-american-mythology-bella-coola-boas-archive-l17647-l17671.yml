canonical_text:
  quote: ''
  summary: The passage describes two Upper Thompson social-feast customs. In one,
    a messenger announces an intended visit, the host and neighbors prepare food,
    guests stay for two or three days, and departing guests give presents to those
    who helped prepare the feast. In another, a man lowers a bundle of food through
    a winter-house opening before entering and being feasted; the food serves as compensation
    for what he eats.
  language: English
