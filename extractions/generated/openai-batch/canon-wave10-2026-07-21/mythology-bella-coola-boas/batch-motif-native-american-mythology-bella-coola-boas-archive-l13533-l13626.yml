canonical_text:
  quote: ''
  summary: Ethnographic description of Thompson hair ornaments, feather ornaments,
    hair removal, face and body painting, tattooing practices, washing substitutes,
    and skin ointments, with distinctions by sex, age, role, dreams, and neighboring
    Coast influence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some shamans used rattlesnake, bow-snake, and garter-snake skins.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hair-ribbons were widely used by both sexes and could consist of buckskin
    with strings, quill embroidery, shells, bone, claws, feathers, beads, buttons,
    ribbons, cloth, or strings fastened into hair plaits.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A male-only hair ornament was made from a long strip of buckskin with pairs
    of eagle or hawk feathers; a related otter-skin braid with eagle or hawk feathers
    was particularly worn by warriors.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Beards were pulled out with horn, wood, copper, or metal tweezers; some women
    narrowed their eyebrows by plucking; the parting of the hair was often painted
    red.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Red ochre, other red earths, hematite, charcoal, yellow ochre, and white clay
    or powder were used for face and body painting.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Some painting modes were associated with warriors, shamans, or ceremonies,
    while others were personal adornment used more by women than men.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Young women could have red dots on each cheek or extended over temples and
    eyebrows; elderly women painted the whole face red up to the eyes.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Men painted their faces according to their dreams, including cheek spots,
    eyebrow streaks, wet red paint, scratched stripes made with deer jaw or teeth,
    or one side of the face painted red.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tattooing was mostly practiced by women and was rare among the Upper Thompsons;
    Lower Thompson women often had lines radiating from the mouth over the chin, lines
    from the nose toward the ear lobes, or tattoos on the back of the wrist.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that wrist tattooing was evidently borrowed from Coast
    tribes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Tattooing was done by puncturing the skin with a fine needle or cactus-spike
    and passing a charcoal-coated thread under the skin.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Substitutes for soap and skin treatments included birch-leaf water, poplar
    ashes, urine, white soapy clay, deer fat, salmon oil, and ointment made from ashes
    mixed with deer fat.
  category: object
  evidence_refs:
  - ev:8
