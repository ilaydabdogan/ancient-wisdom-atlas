literal_observations:
- id: obs:1
  text: The passage states that archaeological investigations were carried out for
    the Jesup North Pacific Expedition in the Thompson River region between Spences
    Bridge and Kamloops.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spences Bridge is described as being on Thompson River, below the mouth of
    Nicola River, in a narrow valley between steep mountains.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Spences Bridge area is described as dry, with scant vegetation except
    where irrigated, open timber in higher valleys, and plants including cactus, sagebrush,
    greasewood, bunch-grass, and cottonwood-trees.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says many salmon ascending Thompson River turn up Nicola River.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kamloops is described as located at the confluence of the North Thompson and
    South Thompson Rivers, with surrounding rolling plateau and dry vegetation similar
    to Lytton and Spences Bridge.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Kamloops Indians are reported as saying that formerly large herds of elk
    inhabited the hills and were hunted by neighboring tribes and by themselves.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage lists salmon, roots, berries, deer, bear, wild fowl, and fish
