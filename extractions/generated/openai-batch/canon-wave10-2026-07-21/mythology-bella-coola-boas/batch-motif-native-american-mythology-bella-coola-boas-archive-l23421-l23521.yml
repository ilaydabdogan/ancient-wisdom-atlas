  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: A rocky cliff on the north shore of Kamloops Lake near the mouth of Tranquille
    River is said to bear numerous red pictographs and to be locally known as Battle
    Bluff.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: A large burial-place and village-site on the Indian reserve north of Kamloops
    bridge is described, along with a broader camping-ground and the modern Indian
    village near North Thompson River.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Nicola Valley is described in terms of its river, lake, streams, plateau,
    former abundance of bear and elk, trout, and commercial intercourse with Kamloops,
