canonical_text:
  quote: ''
  summary: The passage describes ceremonial dances with prayer signs, a ritual opportunity
    for young men and women to choose spouses, communal food blessing and distribution,
    sunset pipe smoking oriented to the sun and directions, lodge prayers around a
    fire, later introduced Okanagon/Christian prayer elements, and a catalogue of
    guardian spirits acquired through puberty rites or inherited by some shamans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the dance, chiefs associated with east and west positions move, stop, mark
    time, pray, make signs, and return to their proper places, concluding the first
    dance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the first morning dance, young men and young women are permitted to
    touch one another; a man may touch the desired girl on the breast, and a woman
    may take hold of a young man’s sash and follow him dancing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stated purpose of the spouse-touching custom is that there should be no
    unmarried women in the tribe.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the four morning dances, women place brought food on a large mat while
    silence is preserved; a chief extends his hands over the food and prays for safety,
    abundance, and ease in obtaining food resources.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two young men cut up and divide the food; chiefs and other leading men make
    speeches admonishing the people, and additional dances and a feast follow later
    in the day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After sunset, middle-aged and elderly men gather at the head chief’s house,
    smoke a large pipe passed with the sun’s course, and smoke four pipefuls.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The chief is said to smoke a puff to the sun, while three other pipes are
    said to be offered to the east, the zenith, and the west.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mourners and menstruating women are described as not excluded from the dances.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ceremonial chiefs later held dances weekly on Saturdays, kept time by
    cutting notches in sticks, introduced Okanagon words into prayers, used a crossing
    gesture while dancing, and the dances later fell out of use after the advent of
    white miners in 1858.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At irregular times, people pray inside lodges in the morning and sometimes
    evening, kneeling in a circle around the fire and facing inward while the oldest
    or most important man leads singing and prayers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Each person is said to have a guardian spirit acquired during puberty ceremonials;
    a few shamans inherit guardian spirits from powerful parents, with those spirits
    appearing uncalled for in dreams and visions.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Animals and objects possessing mysterious powers can become guardian spirits,
    and their powers are described as differentiated.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Favorite shaman guardian spirits include heavenly bodies, natural phenomena,
    many animals, bird’s down, trees, tobacco, and pipe; the most powerful listed
    include otter, wolf, eagle, rattlesnake, badger, chicken-hawk, grizzly bear, coyote,
    and owl.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Guardian spirits identified as belonging only to shamans include night, fog,
    blue sky, east, west, human figures and body parts, bat, and death-related beings
    or objects such as the land of souls, ghosts, grave structures, bones, and teeth.
  category: object
  evidence_refs:
  - ev:9
