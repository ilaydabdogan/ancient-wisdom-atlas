canonical_text:
  quote: ''
  summary: The passage describes Thompson potlatch gift repayment, feast equipment
    and song contests, reciprocal personal gifts and hospitality, a masked form of
    begging for food, and tobacco preparation and smoking customs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a potlatch, presents are given between two sides; friends of each party
    are requited, principal presents are given from O. to S., and a return potlatch
    may repay them the next year.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the feast, remaining food and used articles such as cups, plates, knives,
    spoons, and mats are divided among those present.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The principal items interchanged as presents include horses, blankets, money,
    guns, clothes, and food.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ceremonial drums are described as large tambourine-like instruments covered
    with fawn-skin, often painted red, and fitted with deer-hoofs to rattle.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: At feasts involving singing or dancing, singers keep time with drums, sticks,
    the ground, or a board.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A feast host was formerly expected to supply fresh meat to preserve his good
    name; horses, cattle, or venison are mentioned as food sources.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: A present may be offered to the person who sings the best song, with judging
    by the giver or sometimes by vote of the assembled people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Individuals give presents to friends or blood relations as goodwill or recognition,
    especially at a first meeting or house visit, with an exact equivalent expected
    later.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: An Indian is said to be welcome to eat at another's house without charge,
    even if an enemy, and food is shared as long as any remains.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: A person whose winter provisions are exhausted may beg while wearing a dogskin
    blanket, dogskin leg wrappings, and a birch-bark mask with eye holes and hair
    whiskers, painted wholly or partly black.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The masked beggar enters an underground house carrying a staff and basket,
    warms himself at the fire, dances while grunting, receives food in the basket,
    and leaves.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The masked beggar is described as much dreaded by children.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: The upper-division Thompson Indians are said to have smoked wild tobacco from
    time immemorial; leaves were dried, greased, broken up, and mixed with bearberry
    leaves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Women now smoke as much as men among the upper division, but two or three
    generations earlier smoking was said to be mostly a male privilege except for
    women claiming strong medicine.
  category: relationship
  evidence_refs:
  - ev:5
