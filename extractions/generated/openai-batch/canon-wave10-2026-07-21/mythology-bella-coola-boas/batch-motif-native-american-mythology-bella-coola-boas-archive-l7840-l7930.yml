literal_observations:
- id: obs:1
  text: Youths reaching maturity were said to take part in ceremonials requiring them
    to cross from one boulder to another in a prescribed number of leaps.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A second village-site was located about half a mile below Lytton on a high
    gravel terrace on the left bank of the Fraser River, with basalt chips, burned
    and crackled firestones, and a carved stone object of undetermined use found on
    the surface.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A third village-site lay on a high terrace on the left bank of the Fraser
    River about two miles north of Lytton, near a small brook and marsh, with remains
    of many underground houses and stone artifacts.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: A lower-terrace cemetery had recent graves marked by three wooden grave-posts
    carved to represent human beings and by a rifle.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Additional underground houses, stone points, pestles, rubbed stones, and a
    fourth prehistoric village-site with old house remains were reported near the
    Fraser bluff and opposite Stein Creek.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A fifth ancient village and burial-place north of Stein Creek included human
    bones, pecten shell fragments, steatite pipe fragments, antler wedges, and ancient
    houses measuring about fifty to sixty feet in diameter.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: A sixth site on sandy terraces on the west bank of the Fraser contained burials,
    traces of habitations, house-pits, human bones, stone implements, and several
    complete burials; the text says these sites may or may not have been occupied
    at the same time.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The author states that prehistoric habitations occurred at varying distances
    from larger village-sites and says this suggests a mode of life similar to present
    Indians, among whom one or two families often live away from main villages.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The listed resources of the prehistoric people of Lytton were chiefly stone,
    copper, shell, bone, antler, teeth, animal skins, and vegetable substances.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Different stones were used for scrapers, hammers, fish-knives, arrow points,
    chipped implements, pipes, perforators, pendants, and celts; quartz crystals were
    said to possibly have been used for drills and charms.
  category: object
  evidence_refs:
  - ev:8
