canonical_text:
  quote: ''
  summary: The passage describes pipe-sharing customs as signs of goodwill or hostility
    depending on direction, then lists ceremonies and restrictions for pregnancy,
    including bathing, sweating, prayers to Dawn of the Day and Water, restrictions
    on foods, animals, smoking, scratches, corpse viewing, tracks, and hunting by
    the husband, with consequences said to affect childbirth, the child’s form, survival,
    or future traits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pipe is passed among friends during speeches, business discussions, gatherings,
    or private conversation, with participants alternately taking a few whiffs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Passing the pipe in the direction of the sun’s course is described as a sign
    of goodwill.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Passing the pipe opposite the sun’s course, or tearing one’s clothing while
    talking or quarreling, is described as a sign of displeasure, anger, evil wishes,
    or enmity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For a first pregnancy, a newly married woman and her husband were required
    to undergo ceremonies said to resemble puberty ceremonies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The pregnant woman and her husband bathed often in cold water, sweat-bathed,
    and prayed, especially to Dawn of the Day and sometimes to Water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A spring used by a pregnant woman or her husband for drinking or washing was
    said to be liable to run dry or diminish; a stone was put into the water to prevent
    this.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A pregnant woman was restricted from touching or eating certain animals because
    her child was said to risk resembling them in form, feature, or habits.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Eating hare flesh was said to cause harelip in the child, and eating food
    partly eaten by a mouse, rat, or dog was said to cause premature birth.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: If a pregnant woman saw a snake, she had to turn and walk away in the opposite
    direction.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Stepping on wolf or otter tracks was said to endanger the child and later
    children, but treatment by a shaman with otter or wolf as guardian spirit was
    said to prevent the deaths.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A pregnant woman was not to watch a corpse being prepared for burial, because
    the navel-string was said to become twisted around the child like the string tied
    around the corpse.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Roasted weasel or fisher flesh was permitted, and their stretched skins hung
    above the bed were said to make the child good-looking like those animals.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: During a first pregnancy, the woman was not to touch salmon, eat salmon-heads,
    put food aside for later, scratch herself, or wear her hair differently from the
    puberty style; these restrictions were associated with easy birth or avoiding
    marks.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: If the pregnant woman felt a small movement in her belly, this was taken as
    indicating a male child; the father then made a miniature bow and arrows and placed
    them in the child’s hands shortly after birth.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The husband of a pregnant woman was restricted from hunting or eating several
    animals, with stated consequences for the unborn child, childbirth, or the father’s
    future hunting luck.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: If the husband killed snakes, the child was said to resemble a dead person
    or ghost.
  category: relationship
  evidence_refs:
  - ev:11
