canonical_text:
  quote: ''
  summary: The passage describes Thompson puberty customs, especially restrictions
    on adolescent boys and young men in training, rock-paintings connected with ceremonies
    and dreams, puberty body modifications, changes in observance of these customs,
    a note on cross-sex dressing, and marriage arrangements involving betrothal, eligibility
    after puberty rites, kin consultation, gift presentation, acceptance or refusal,
    and occasional return of marriage gifts among wealthy Lower Thompsons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boys at adolescence were not to go near the lodge of a menstruating woman;
    the passage says they would bleed at the nose if they did.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Boys generally avoided touching the winter-house ladder with their hands,
    and if they touched it they had to wash their hands afterward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Youths at home did not wash close to married people, and the passage says
    that entering a sweat-house used by a married couple would make a youth a poor
    man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A young man while training avoided the liquid in which deer or other flesh
    had been boiled, avoided berries, roots, and food prepared by women, ate meat,
    birds, salmon, or trout, and ate alone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Lads painted records of ceremonies and dreams on boulders or cliffs, especially
    in wild places such as canyons near waterfalls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The rock-paintings usually showed animals, birds, fishes, arrows, fir-branches,
    lakes, sun, thunder, and women; figures of women were said to symbolize future
    wives, and making rock-paintings was believed to insure long life.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nose-ornament and ear-ring perforations, and tattooing for both males and
    females, were generally done around puberty or after ceremonial training.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that most male puberty customs had fallen into disuse,
    while female puberty customs were still maintained to a great extent, though modified
    in some respects.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sweat-bathing continued to be common, especially among men, mainly for sanitary
    purposes, and the practice of a cold bath after each steam-bath was maintained.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage says that dressing and behaving like a member of the opposite
    sex did not prevail among the Thompsons, with only two known people at Spuzzum
    described as doing so.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Girls were often betrothed as infants and were considered marriageable only
    after completing the ceremonies connected with puberty.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the marriage mode called “to place down,” a suitor sent a middle-aged relative
    or other messenger with presents to the girl’s parents, after which the girl’s
    kin discussed the proposal and the girl was asked whether she liked the suitor.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Public marriage offers could be made at gatherings by announcing the suitor’s
    offer and displaying gifts; rejected gifts were returned, while accepted gifts
    were retained and divided among the girl’s blood relatives.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Among the Lower Thompsons, some wealthy people returned marriage presents
    to a pleasing new son-in-law; the passage calls this exceptional and says it may
    have come from Coast tribes.
  category: sequence
  evidence_refs:
  - ev:9
