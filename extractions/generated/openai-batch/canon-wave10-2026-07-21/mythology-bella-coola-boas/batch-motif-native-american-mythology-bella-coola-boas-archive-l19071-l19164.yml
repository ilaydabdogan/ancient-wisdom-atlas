  cautions: This is an ethnographic social custom, not a mythic narrative episode.
- id: motif:2
  label: blood-relation marriage taboo and preferred exogamy
  taxonomy_refs: []
  basis: Cousins are forbidden to marry as one blood, distant blood unions are discouraged,
    and Lower Thompson marriages between different villages are favored.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives social rules without cosmological explanation.
- id: motif:3
  label: affinal succession through sororate and levirate obligations
  taxonomy_refs: []
  basis: A widower seeks a wife among the deceased wife’s sisters or relatives, while
    a widow passes to the deceased husband’s nearest male kin, with support obligations
    for children.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents legal or customary obligations rather than a mythic
    plot.
- id: motif:4
  label: bodily marking of sexual transgression
  taxonomy_refs: []
  basis: For first suspected adultery, the husband cuts off one braid of the wife’s
    hair, making her a visible object of public ridicule and shame.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: Only the literal sanction is supported; no broader symbolic meaning is
