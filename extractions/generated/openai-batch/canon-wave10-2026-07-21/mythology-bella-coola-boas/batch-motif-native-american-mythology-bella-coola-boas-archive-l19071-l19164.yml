canonical_text:
  quote: ''
  summary: The passage describes Thompson marriage customs, including public marriage
    before a chief, separation procedures, kin and blood restrictions, residence-based
    band membership, expectations after a spouse’s death, sanctions for adultery,
    polygamy as a sign of wealth, a post-consummation rite for a new wife, and menstrual
    isolation with cleansing and food-contact taboos.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young people who wish to live together as husband and wife appear before the
    chief, who calls an assembly, asks relatives for their opinion, gives advice,
    and declares the couple married if all approve.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Presents are sometimes given to the bride’s parents during the publicly recognized
    marriage procedure.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a married person later wishes to separate, the chief may call a public
    meeting, hear complaints, and publicly declare the couple separated if sufficient
    reasons are given.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that cousins were forbidden to marry because they were
    considered of one blood, and marriage among distant blood relations was discouraged.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wealthier, more successful, or more distinguished people tended to prefer
    marriages with similarly distinguished families, and Lower Thompson people favored
    marriages between members of different villages.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A person living for a year with a spouse’s people and making a home mostly
    among them was considered a member of that tribe or band.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: A widower was expected to seek another wife among the sisters or relatives
    of his deceased wife.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A widow became attached to the deceased husband’s nearest male kin, generally
    the next brother, who had rights over her and was bound to support her children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Taking another man’s sister-in-law as wife without his consent could result
    in the killing of the offending man, and sometimes the woman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: A husband who believed his wife had committed adultery for the first time
    cut off one braid of her hair, making her a public object of ridicule and shame.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: For repeated adultery, the paramour was generally shot by the husband, and
    the woman was either killed or divorced.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Many men had multiple wives, and having several wives was treated as an indication
    of wealth.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: A newly married couple slept under the same robe but were not supposed to
    have intercourse for two to seven nights, generally four nights.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: After first intercourse, the young wife rose before daybreak, went to the
    water, washed herself, spent the day in seclusion, and returned after sunset.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The young wife left her maiden’s breech-cloth near the bed, her mother retrieved
    it, prepared provisions, called friends and neighbors to a feast, and announced
    the daughter’s changed status.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The maiden’s breech-cloth was given to an old woman to use for soling moccasins,
    and the young wife never wore a breech-cloth afterward.
  category: object
  evidence_refs:
  - ev:6
- id: obs:17
  text: During menstruation, every woman isolated herself in a small brush or bark
    lodge at some distance from others, used her own cooking and eating utensils,
    and was supplied with food by another woman.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: Before returning among the people after menstruation, a woman had to change
    clothes and wash several times in clear water; the isolation clothes were hung
    in a tree for later use or washing.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: For one day after returning from menstrual isolation, a woman did not cook
    food; a man eating food cooked by a woman at such a time was said to risk loss
    of hunting ability, sickness, or death.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:20
  text: Young women hindered by relatives from marrying the man they desired, or made
    to marry someone they did not like, were reported to have committed suicide.
  category: action
  evidence_refs:
  - ev:9
