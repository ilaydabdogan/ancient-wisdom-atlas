  quote: ''
  summary: 'The excerpt gives figure captions for animal-form antler carvings found
    in graves and summarizes Dawson''s notes on regional burial practices: bodies
    buried sitting upright or on the side, bones buried after decomposition, a Nicola
    Valley reburial after about a year, red ochre on heads or skulls, and grave objects
    interpreted by Dawson as representations of property rather than objects intended
    for future use by the dead.'
