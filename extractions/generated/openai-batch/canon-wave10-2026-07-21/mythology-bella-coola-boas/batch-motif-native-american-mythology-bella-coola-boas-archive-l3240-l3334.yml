canonical_text:
  quote: ''
  summary: The passage first describes a costly piece placed in water for four days,
    with the water and white cedar-bark used for longevity, healing, and invulnerability,
    and notes the large transparent eye of the si’siun. It then introduces Toa’lav’it
    as an invisible protector of mountain-goat hunters whose gear may be seen moving.
    In the narrated tradition, Raven withholds salmon from Lynx’s children. Lynx prepares
    arrows and a cedar-bark quiver, ascends the mountain, meets Toa’lav’it, attributes
    the arrows to him, and receives mountain-goats and ongoing supernatural hunting
    protection. Lynx later withholds goat fat from Raven’s children. Raven imitates
    Lynx’s expedition but claims Raven made his arrows; Toa’lav’it calls him bad and
    leaves.
  language: English
  quote_policy: summarized
