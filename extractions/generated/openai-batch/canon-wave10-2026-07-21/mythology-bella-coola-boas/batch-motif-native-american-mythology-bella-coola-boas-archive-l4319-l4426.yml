  text: Raven reaches the house called Kowa’msta’, enters it, sees a sun-box hanging
    from the roof, cuts its rope, and carries it away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When Raven touches the sun-box, the present Sun comes out of it.
  category: sequence
