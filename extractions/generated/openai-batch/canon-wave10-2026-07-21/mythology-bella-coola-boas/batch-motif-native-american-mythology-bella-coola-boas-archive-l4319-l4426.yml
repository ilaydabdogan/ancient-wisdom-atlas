canonical_text:
  quote: ''
  summary: 'The passage recounts Raven obtaining a better Sun from a sun-box and sharing
    his name and song; the Sun then grants Yuyo’lkumai a house, provisions, a song,
    a dance, and a name. It continues with traditions of several groups: Lxumtené’m
    is sent down by the Sun and gains the giant Qoatiwa’la as helper; Toto’sk‘ma is
    sent to a mountain and Raven declares salmon will remain in a river; the Sun sends
    the first Nulle’ix from heaven with a salmon-weir, and a Snéné’iq is killed after
    looking into their underground lodge. The old Snéné’iq searches and cries for
    her lost son, causing fear until an unafraid man goes upriver toward her.'
  language: English
  quote_policy: summarized
