canonical_text:
  quote: ''
  summary: The passage lists Thompson hunting, trapping, and fishing regulations concerning
    respectful treatment of deer, bears, beavers, salmon, sturgeon, trout, eagles,
    and other animals. It describes taboos about contact with bones, women, birth
    order, speech, sexual intercourse, dreams, handling of tools, animal remains,
    and ritual purity; it also describes prayers, songs, face-painting, sweat-bathing,
    divination, and practices believed to preserve hunting or fishing success.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fresh deer bones are to be kept from contact with women and dogs, and hunters
    consider it lucky to roast and eat a small part of each deer immediately after
    butchering it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a deer-hunting party is unsuccessful, hunters may say the deer are waiting
    for another animal to die first and then kill an animal crossing their path as
    the supposed cause of failure.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A hunter must not give a deer head to, or eat with, a first- or second-born
    man, because the deer would become wild and difficult to shoot.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hunters use substitute names for buck, doe, and fawn when reporting what they
    have shot, so as not to displease deer by boasting and not to offend other hunters.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Deer meat is not taken through the common lodge entrance; in a hunting lodge
    it is taken through a back hole because the common door is used by women.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the father of an adolescent girl begins to hunt, deer are said to be
    shy and to run away from him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A hunter seeking success, especially in bear-hunting, sweat-bathes, sings
    to his spirit for success, and may address the bear asking it to appear and be
    shot.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The grisly bear is asked not to be angry or fight the hunter, but to pity
    him and deliver itself to him; the grisly-bear hunter abstains from sexual intercourse
    before hunting.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: A bear is believed to be forewarned of its death by signs like people.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: After killing a bear, the hunter and companions paint their faces in alternating
    black and red perpendicular stripes, sing the bear song, and may thank the bear
    for letting itself be killed easily.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: After the bear head flesh is eaten, the skull is tied high on a small treetop;
    placing heads of bears or large animals on trees or stones is described as a mark
    of respect.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Bears are said always to hear what people say about them, so a person intending
    to hunt bears must be careful what he says about bears or his plans to kill them.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: A certain part of the beaver entrails is said to resemble a man; the hunter
    or trapper removes it, throws it into water, and it may be used to divine whether
    someone nearby will die and when.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: Children must not swim in rivers during September because this is believed
    to disturb the salmon-run and expose the children to drowning.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Sturgeon fishers keep lines, hooks, and bait hung away from the house to avoid
    contaminating influences, and a dream of ghosts means the fisherman should not
    go sturgeon-fishing the next day because he would catch nothing.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Live trout may be transplanted to lakes without trout, and the fish should
    be caught and handled by a clean or non-tabooed person.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: Shooting an eagle with a gun is said to remove the gun’s power to kill, leaving
    it able only to wound; filling the barrel with urine overnight is described as
    a remedy.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:18
  text: A hunter or trapper should not mock an animal he intends to hunt or trap,
    should speak respectfully about it, and should say he may kill it rather than
    that he shall kill it.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:19
  text: Some hunters and trappers avoid eating with others or eating food cooked by
    women other than old women, drink cold water soaked with mountain juniper or wild
    rhubarb from a personal cup, avoid combing their hair on trips, and anoint their
    hair before departure.
  category: action
  evidence_refs:
  - ev:12
