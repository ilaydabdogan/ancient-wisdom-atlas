canonical_text:
  quote: ''
  summary: A procedural account describes how O. invites S. to a potlatch through
    a messenger bearing surety gifts, how S. reciprocates with equivalent gifts and
    travels with companions and presents, and how the guests are formally received
    with refreshments, speeches, supper, tobacco, public gift distribution, songs,
    drumming, and dancing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: O. decides to give a potlatch to S. and sends a messenger to announce the
    intention.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The messenger arrives mounted on a horse with saddle and bridle, with tobacco
    rolled in new blankets tied to the saddle, and delivers the horse and attached
    articles to S. as surety gifts.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The messenger may wear two suits of clothes and give the outer suit to S.;
    alternatively, young men may remove the clothes from him without ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: S. invites friends to accompany him, receives presents from them, and sends
    the messenger back with an equivalent horse and attached articles plus another
    suit of clothes as a return present for O.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: S. and the rest travel on horseback to O.’s house with pack-horses loaded
    with presents and other horses intended as presents.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the day of arrival, the messenger leaves the guests, hurries to O., announces
    their expected arrival, and delivers the return horse and attached articles as
    surety of S.’s speedy arrival.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Young men and women are sent to meet the guests on the road and offer refreshments
    or a meal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The arriving guests draw up in line some distance away, beat a drum, give
    notice of arrival, and begin to sing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A man called the speaker invites the guests to take possession of a prepared
    long, half-open lodge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The host or the host’s speaker welcomes S. with a speech, and S. responds
    with flattering remarks to the host.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Supper is served first to the guests on rows of large table-mats, and afterward
    O. and his friends eat supper.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Huge log-fires are lit between the guests’ long lodge and the lodge occupied
    by the host and his friends.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: O. gives tobacco to the guests for them to smoke.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: S.’s speaker gives away presents received from S.’s friends, makes an oration
    with each present, and the host’s speaker repeats his words before the article
    is handed over.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Between the giving of presents, the donating party generally improvises songs
    with drum-beating and dancing.
  category: action
  evidence_refs:
  - ev:8
