canonical_text:
  quote: ''
  summary: A young man living with his wife’s Wolf relatives is empowered by his wife
    to hunt mountain-goats, observes the Wolves’ unusual handling of the meat, survives
    a dangerous ball game with his brothers-in-law, violates an obscure warning by
    falling in love with a girl at the brook, and is then taken by his wife and child
    to his father’s house, where his father recognizes him by his voice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The wife says she must give her husband strength, pats his head and body,
    gives him a tail, and instructs him which way to go up the mountain and not to
    follow her brothers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband follows his wife’s instructions, finds forty mountain-goats stopped
    at a steep cliff, kills all of them, rolls them down the precipice, and returns
    home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife and her brothers ask the husband about his hunting result; he says
    he killed forty goats, while the brothers have killed none.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The whole Wolf tribe goes to bring home the meat, except the young man; he
    secretly follows and sees the Wolves eating the dead mountain-goats.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Members of the household return carrying objects that look like large windpipes,
    hang them over the fire, and the wife pulls mountain-goat meat out of them.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each windpipe contains as much meat as ten mountain-goats; after the meat
    is removed, the windpipes disappear and are identified as the baskets of the Wolves.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The wife’s brothers invite the husband to play with a fist-sized ball, and
    the wife warns that they killed her first husband with this ball by pursuing and
    biting him from behind.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The husband catches the ball, runs away, is nearly bitten on the neck, throws
    the ball backward, survives, and later refuses further invitations to play.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When sent to fetch water, the husband meets a pretty girl at the brook, talks
    with her, falls in love, and asks her to meet him there every day.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The wife touches the left side of her neck, her finger becomes red, and when
    she dips it into the water, the water becomes a thick jelly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The wife says the husband has let smoke touch her blanket, identifies this
    with his falling in love with the woman at the brook, and threatens to send him
    away if he repeats it.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: The husband says he did not understand the warning and promises not to look
    at or speak to any woman thereafter.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The wife proposes going to the husband’s father’s house so he will not see
    the girl again; the next morning they leave with one windpipe filled with food,
    carried by the boy.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:14
  text: At the father’s house, the old chief first does not recognize his son by sight
    but recognizes him after hearing his voice and welcomes his son, wife, and child.
  category: sequence
  evidence_refs:
  - ev:7
