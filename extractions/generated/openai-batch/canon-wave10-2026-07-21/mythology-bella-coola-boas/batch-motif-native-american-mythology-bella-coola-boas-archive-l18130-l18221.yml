canonical_text:
  quote: ''
  summary: The passage describes Thompson and neighboring Nicola infant carriers,
    cradle materials, substances placed in cradles for desired effects, postnatal
    shaping of infants' bodies, early childhood restrictions, a warning about an Owl
    carrying children away, a tooth-disposal practice, and the former custom of giving
    children to friends or relatives to raise.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Birch-bark baby-carriers are described as having buckskin coverings or packing-lines,
    ornamented flaps, a maple-wood hoop, straps, and rattling deer-hoofs at the head
    end.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Thompson people near Spences Bridge and most Nicola Valley Indians used
    a carrier in which the child was placed in a buckskin sack on a board with a hoop,
    flaps, and lacing.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: When carried, some cradles hung down the mother's back; when riding, they
    could hang from a saddle pommel; while the mother worked, they could be suspended
    from a tree branch.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Soft materials such as fawn-skin blankets, grass, fir twigs, sagebrush, animal
    skins, and cedar bark were placed in or with the cradles.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some people placed wild currant branches in the bottom of the carrier, believing
    that they quieted the child.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Others placed the dried tail and lower backbone of a silver salmon in the
    carrier so that the child would not urinate often.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Thompson Indians are said not to have compressed or deformed children's
    heads, though a few Lower Thompsons with coast wives permitted those wives to
    deform their children's heads.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Infants' feet, noses, eyelids, limbs, and other body parts were bandaged,
    pulled, or rubbed after birth to produce desired bodily form and appearance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After children could walk, they were largely allowed to play freely, but were
    made to rise early, wash often in cold water, and avoid playing after sunset or
    making too much noise.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Children were frightened into quietness by being told that the Owl would come,
    put them into a basket containing snakes or crawling insects, and fly away with
    them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: When a child lost a tooth, the father put it into raw deer-flesh and gave
    the flesh to a dog to swallow; the collector says he could not obtain a reason
    for the custom.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Children were formerly given to friends or relatives to raise, especially
    to replace a dead child or to keep a childless couple from loneliness.
  category: relationship
  evidence_refs:
  - ev:9
