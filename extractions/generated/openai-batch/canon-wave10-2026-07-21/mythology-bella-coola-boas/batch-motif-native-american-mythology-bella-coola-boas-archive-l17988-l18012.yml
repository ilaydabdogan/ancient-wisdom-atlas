canonical_text:
  quote: ''
  summary: 'The passage describes Thompson birth practices: the birthing woman’s posture
    and use of a rope, possible assistance by an experienced elderly woman or household
    helpers, midwife compensation and washing, disposal of the afterbirth and blood,
    treatment of the navel-string, and the father’s firing of an arrow or gun immediately
    after birth to prevent swelling of the child’s navel.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman giving birth among the upper division lay on her side with head and
    shoulders somewhat elevated and held a rope placed for that purpose.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some women used the services of an experienced elderly woman, while others
    accepted no help, help only from the husband, or help from women in the house.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Elderly women acting as midwives generally received a deerskin blanket for
    their work and needed no purification afterward beyond washing their hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The afterbirth was hung on a tree branch so that no dog or snake might touch
    it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If a dog or snake touched the afterbirth, the woman was said to have no more
    children.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Among the Lower Thompsons, the afterbirth was buried near water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In cases of premature birth or miscarriage, the afterbirth was thrown into
    the river or sometimes buried in wet ground; any lost blood was buried.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The navel-string was cut with an ordinary knife, tied with something soft,
    and smeared with black-pine gum; some people instead smeared it with tree-gum
    and tule pollen without tying it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Immediately after birth, the father went outside and fired an arrow into the
    air; the passage says a gunshot was used in the present day instead.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: If the father did not fire the arrow or gun, it was said that the child’s
    navel would swell.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: After the outer piece of the infant’s navel-string dropped off, the mother
    sewed it in an embroidered buckskin piece and tied it to a broad object; the passage
    excerpt ends before completing the object description.
  category: action
  evidence_refs:
  - ev:11
