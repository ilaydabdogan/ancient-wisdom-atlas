literal_observations:
- id: obs:1
  text: Pipes are described as formerly and presently made mostly of stone, usually
    with high narrow bowls and long stems, using materials including soapstone, soft
    slate, sandstone, white clay, sagebrush-root, and buck's horn.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maple-wood is preferred for stems, which are described as rather thick and
    between about five or six inches and a foot and a half long.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Stone pipes are frequently carved, and carving may be filled with melted lead
    or German silver; formerly red paint was used.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some old pipe bowls were carved as heads of animals, birds, and men, while
    others had a carved ridge or a square bottom piece with a hole for a string and
    beads.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Shamans' pipes were often decorated with eagle-feathers, and these pipes,
    as well as pipes smoked at gatherings or councils, were larger than ordinary pipes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Catlinite pipes were bartered from tribes to the southeast, and pipe tomahawks
    were obtained from those tribes and from the Hudson Bay Company.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Pipes with double bowls were sometimes used, and tubular pipes are remembered
    by old Indians as having been used, though less commonly than ordinary pipes.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage begins an incomplete statement about a custom of passing the pipe
    around among all the men in a circle.
  category: sequence
