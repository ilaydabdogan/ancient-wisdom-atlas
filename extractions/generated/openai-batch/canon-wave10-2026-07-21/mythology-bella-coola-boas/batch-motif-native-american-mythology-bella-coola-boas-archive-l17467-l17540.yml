  quote: ''
  summary: The passage describes Thompson Indian rules for inheritance, personal property,
    gifts, common land use, hunting and gathering access, exceptions for fishing stations,
    deer fences, and eagle eyries, and seasonal berrying and root-digging practices
    including the Botani Valley gathering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A father's property could be divided among sons, with daughters and other
    relatives sometimes receiving shares; nearest kin and males generally had priority.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sons who inherited their father's property were expected to provide for their
    mother, and a larger share could go to the relative responsible for an orphan
    child.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A woman's effects were treated as distinct from her husband's, and on separation
    she took her own property, including roots and berries she had gathered.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Gifts of individual property between spouses or from parents to children were
    not returnable after death or separation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Land was described as neither individual nor family property, because everyone
    had access to the common country.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bands had usual hunting places, but people from other villages or divisions
    could hunt there without being treated as intruders.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Large parties from the Lytton band seasonally crossed the mountains to hunt
    elk and fish trout in the Upper Nicola Valley, returning when service-berries
    ripened and root-digging time approached.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Hunting territory was treated as common tribal property, and related Shuswap
    or Okanagon persons were allowed access like members of the local bands.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Members of one tribal division were not allowed to build deer fences in the
    territory of another division.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: An unrelated person caught hunting, trapping, or gathering bark or roots within
    recognized tribal limits could forfeit his life.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Salmon-fishing stations and mountain deer-fence places were exceptions to
    common use and were treated as the property of the builder or maintainer for fishing
    and trapping purposes.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:12
  text: Golden eagle eyries were owned by individuals or families.
  category: object
  evidence_refs:
  - ev:4
- id: obs:13
  text: Berrying and root-digging grounds were common property, but an old woman could
    watch important berry patches and notify others when berries were ripe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Botani Valley was a long-standing mountain gathering place for upper tribal
    divisions during May and June root-digging, and each division had a recognized
    camping ground.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Lower Thompsons permitted Coast Indians to gather berries on their territory.
  category: relationship
  evidence_refs:
  - ev:6
