canonical_text:
  quote: ''
  summary: 'The passage describes archaeological ornaments and possible tools from
    Thompson River region sites: bear-claw pendants, tooth pendants, abalone shell
    fragments, and beads made from bone, copper, shell, and vegetable material, often
    found in graves, at the neck of skeletons, or with cremated bones. It also reports
    an informant statement about tooth pendants being worn as ear ornaments and necklace
    elements.'
  language: English
