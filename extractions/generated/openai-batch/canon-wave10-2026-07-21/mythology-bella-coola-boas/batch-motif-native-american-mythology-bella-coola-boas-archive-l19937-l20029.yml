comparison_claims:
- id: claim:1
  claim: The passage explicitly presents variant local explanations for the Moon,
    including a former Indian obscured by his sister and, in other Lower Thompson
    legends, a light carried by a transformer; both function as lunar explanatory
    accounts.
  claim_level: same_function
  target: local Thompson and Lower Thompson lunar-origin explanations
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only brief summaries and does not provide full versions
    of either legend.
- id: claim:2
  claim: 'The passage gives two local Dipper interpretations: a grizzly bear pursued
    by hunters and a Lower Thompson account of Transformers or Black Bear’s children
    turned into stars; both function as constellation etiologies.'
  claim_level: same_function
  target: local Thompson and Lower Thompson Dipper constellation explanations
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The relationship between the variants is not explained beyond their
    shared reference to the Dipper.
