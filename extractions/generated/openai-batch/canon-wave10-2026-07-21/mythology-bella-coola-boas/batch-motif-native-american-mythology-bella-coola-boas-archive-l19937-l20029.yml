candidate_motifs:
- id: motif:1
  label: mapped journey to the country of souls
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage gives a directional and sequential route to the country of souls,
    including twilight, tracks, a shortcut, a red trail, a stream, a bridge, a pile
    of clothes, and changing light.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage reports the route as known from shamanic visits; it does not
    present a single named deceased protagonist completing the whole journey.
- id: motif:2
  label: narrow bridge crossing on the soul road
  taxonomy_refs:
  - afterlife_journey_map
  basis: The trail to the country of souls crosses a clear stream by a long slender
    log on which tracks of souls can be seen.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The text describes the bridge literally but does not state a trial or
    judgment at the crossing.
