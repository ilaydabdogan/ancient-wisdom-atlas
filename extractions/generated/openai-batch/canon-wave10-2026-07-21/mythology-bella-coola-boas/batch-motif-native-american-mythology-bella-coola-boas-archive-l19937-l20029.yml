  quote_or_summary: High mountains are the residence of the Old Man, who makes rain
    or snow; others say an old woman makes rain and snow. Coyote’s house is in a glacier
    or in the upper world, described as a prairie on a steep-sided plateau.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: lines 19957-19965
  quote_or_summary: 'Beliefs about the Sun are conflicting: he appears as a cannibal,
    was once too near the earth and moved away after receiving presents, or was a
    chief at Lytton. A sun or moon halo is called entering or forming a house and
    predicts cloudy weather, rain, or snow.'
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: lines 19966-19971
  quote_or_summary: Sun-dogs are called the Sun throwing away his children; when the
    Sun is tired of one kind of weather he becomes angry and turns out his children,
    indicating a weather change.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 19972-19986
  quote_or_summary: The Moon was formerly an Indian; his sister, the Hare or Frog,
    sits on his face after jumping there during a crowded gathering of Stars. His
    halo is his house, cirrus clouds are pipe smoke, and his pipe and basket hat are
    visible. Moon phases are caused by the sister’s shadow; other Lower Thompson legends
    describe the moon as a transformer’s light.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 19987-19989
  quote_or_summary: Stars are generally considered transformed people; in one legend
    they are roots growing in the upper world.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 19990-19996
  quote_or_summary: The Pleiades are called a bunch or cluster and are the Moon’s
    friends; a star following them is a dog on their trail. Their position was formerly
    used to tell the time of night. The Morning Star and Great Bear are also named.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 19997-20005
  quote_or_summary: The Great Bear or Dipper is a grizzly bear; three handle stars
    are hunters pursuing it, with the first brave, the second leading a dog, and the
    third afraid. They were in this position when turned into stars.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 20006-20014
  quote_or_summary: Other stars are named as a swan, a canoe filled with hunters pursuing
    it, women roasting roots, fishermen, weasel tracks, and arrows slung on a hunter.
    Lower Thompsons identify the Dipper with Transformers or Black Bear’s children
    turned into stars. The Milky Way is called the trail of the stars, gray trail,
    or tracks of the dead.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 20015-20017
  quote_or_summary: The Rainbow was once a man, a friend of Thunder, who often painted
    his face with bright colors.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 20018-20023
  quote_or_summary: The country of souls is underneath us toward sunset. Reports of
    shamanic visits describe a trail through dim twilight with tracks of recently
    departed people and their dogs, meeting a short cut used by shamans to intercept
    departed souls.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 20024-20027
  quote_or_summary: The soul trail becomes straighter and smoother, is painted red
    with ochre, descends to a wide shallow clear stream, and crosses it on a long
    slender log bearing tracks of souls.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 20028-20029
  quote_or_summary: After crossing, the trail ascends to a height with a huge pile
    of clothes where souls leave belongings from the living world; farther on the
    darkness over the trail gradually disappears.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; summarized.
