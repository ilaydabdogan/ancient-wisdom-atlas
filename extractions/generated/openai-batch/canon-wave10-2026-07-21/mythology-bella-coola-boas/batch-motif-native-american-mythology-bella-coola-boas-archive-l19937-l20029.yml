canonical_text:
  quote: ''
  summary: The passage records Thompson beliefs and tales concerning giants, mountain
    and glacier dwellings of powerful beings, personified sun and moon phenomena,
    constellations as transformed beings or scenes, the rainbow as a former man, and
    a mapped route to the country of souls beneath the world toward sunset.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Giants are said to chase or steal people and are not known to have weapons.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two hunters take refuge in a large fir-tree from a giant and two tall companions;
    the giants catch and break the hunters’ arrows, then leave to search for a lost
    dogskin apron.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: High mountains are described as the residence of the Old Man, who makes rain
    or snow; an alternative Lower Thompson belief assigns rain and snow making to
    an old woman.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Coyote’s house is said to be either in a glacier or in the upper world, which
    is described as a prairie on a steep-sided plateau.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Sun is described in conflicting ways, including as a cannibal, as formerly
    too near the earth until he moved away after receiving presents, and as a chief
    at Lytton.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A halo around the sun or moon is called entering or forming the house and
    is said to portend cloudy weather, rain, or snow.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sun-dogs are called the Sun throwing away his children and are interpreted
    as signs of a change between cold and mild weather.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Moon is said to have formerly been an Indian; he would be as bright as
    the Sun if his sister, the Hare or Frog, did not sit on him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Moon invited the Stars to his house; because it was crowded, his sister
    jumped on his face and has remained there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Moon’s halo is described as his house, cirrus clouds as the smoke of his
    pipe, and visible markings in the moon as his pipe and basket hat.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The waxing and waning of the Moon are explained by the position of the sister’s
    shadow; other Lower Thompson legends call the moon the light carried by a transformer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Stars are generally considered transformed people, while one legend describes
    them as roots growing in the upper world.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Pleiades are called a bunch or cluster and are described as friends of
    the Moon; a following star is called a dog on their trail, and their sky position
    was used to tell time at night.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Great Bear or Dipper is called a grizzly bear; three handle stars are
    described as hunters pursuing the bear, with a small companion star as a dog.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Other star groups are named as a swan, a canoe of hunters, women roasting
    roots, fishermen, weasel tracks, and arrows slung on a hunter’s body.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: The Milky Way is called the trail of the stars, the gray trail, and the tracks
    of the dead.
  category: object
  evidence_refs:
  - ev:9
- id: obs:17
  text: The Rainbow is said to have once been a man, a friend of Thunder, who often
    painted his face with bright colors.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:18
  text: The country of souls is located underneath us, toward sunset, and its trail
    is described from shamanic visits to the lower world.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:19
  text: The soul trail passes through dim twilight, bears the tracks of recently departed
    people and their dogs, and meets a shamanic short cut used to intercept a departed
    soul.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:20
  text: Farther along, the soul trail is straighter, smoother, painted red with ochre,
    descends to a clear shallow stream, and crosses it by a long slender log marked
    by tracks of souls.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:21
  text: After the bridge, the trail ascends to a height where an immense pile of clothes
    marks the place where souls leave belongings brought from the living world; beyond
    it the darkness gradually disappears.
  category: sequence
  evidence_refs:
  - ev:13
