canonical_text:
  quote: ''
  summary: The passage introduces an ethnographic study of Salish basketry designs,
    especially among Lillooet, Thompson, and Quinault groups. It discusses the development
    of geometric patterns from realistic representations, contrasts Salish geometric
    tendencies with northern Coast Indian animal motives, notes uncertainty caused
    by variants and convergent designs, describes an old Quinault pattern whose meaning
    is lost, and lists two Lower Thompson pattern names.
  language: English
  quote_policy: summarized
