  summary: 'The passage describes Thompson games and amusements: boys'' pebble and
    ball-catching games, arrow-shooting contests, foot-races, jumping, horse-racing
    and riding contests, wrestling, tug-of-war, strength tests with stones, card gambling,
    and swimming or bathing practices.'
