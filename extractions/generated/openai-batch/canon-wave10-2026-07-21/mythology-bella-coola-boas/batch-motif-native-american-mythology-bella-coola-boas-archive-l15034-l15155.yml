canonical_text:
  quote: ''
  summary: The passage describes Thompson fishing methods and equipment, including
    hook-and-line fishing, sturgeon, catfish, trout, salmon-trout, weirs, traps, and
    canoe manufacture, use, and trade among Thompson divisions and neighboring named
    bands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hook-and-line fishing uses baits such as fish roe, fish eyes, ants' eggs,
    woodworms, grasshoppers, flies, and meat; hooks are described as bone or wood-and-bone
    implements attached to Indian-hemp bark lines.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sturgeon are fished on the Fraser River near Lytton with large bone hooks,
    wooden shanks, heavy bark lines, stone sinkers, and salmon tail-end bait, from
    shore or more often from canoes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Catfish fishing uses a stake set near shore, a short thick line under the
    water-line, lighter baited lines, and overnight checking; other longer lines are
    set in the stream.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hook-and-line trout fishing is practiced in creeks and mountain lakes, including
    fishing from rafts by people camping nearby for hunting and root-digging.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Salmon-trout fishing uses thicker bark lines, large hooks formerly made of
    bone or wood with horn or bone points, stone sinkers, and salmon-trout roe bait;
    the coiled line is thrown into the stream and hauled in.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fish-weirs are built like fences across shallow rivers from poles, sticks,
    and bush limbs; salmon are stopped at the obstruction and then speared or removed
    with gaff-hooks.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Fish-traps include split pine-wood slat forms, sometimes box-shaped, and cylindrical
    willow-switch basket forms; they are set in streams near lake outlets with the
    stream dammed on each side.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that Lower Thompsons hardly ever fished through holes in
    the ice and hardly ever used weirs and traps.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:9
  text: Thompson canoes are described mostly as dug-outs, especially cedar dug-outs
    made by the lower division and sold to other divisions of the tribe.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Spences Bridge band generally bought canoes from the Lytton band, while
    the Lytton and Upper Fraser bands also manufactured many canoes themselves, chiefly
    from yellow pine and cottonwood.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Bark canoes were formerly used by the Spences Bridge band on lakes and for
    crossing lakes and deep mountain streams, but are described as out of use for
    thirty years or more.
  category: object
  evidence_refs:
  - ev:8
