canonical_text:
  quote: ''
  summary: The passage first describes a young man who approaches the wailing Snéné’iq,
    receives a copper, supernatural powers, and presents from her, and then distributes
    the presents at a festival. It then begins the tradition of Stu1x, describing
    named beings who come down from Nusma’ta, a house in which languages are written
    and distributed among tribes, a wolf-being who remains a wolf, the group’s travel
    down Bella Coola River, and Séxé’m carrying a house in a small box that expands
    to full size on Mount Ni’ya.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man crosses the river to see the Snéné’iq, touches her feet, and joins
    in her wailing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Snéné’iq says she is wailing because she lost her child.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Snéné’iq gives the young man a copper and says she will give him supernatural
    powers and be his supernatural helper.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Snéné’iq says her house is large and beautifully painted, instructs the
    young man to decorate a future house in the same manner, and says her possessions
    will be his to distribute among his people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young man returns home carrying the copper, brings friends to the Snéné’iq’s
    house, carries down the presents, gives a festival, and distributes the presents
    among his tribe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The tradition of Stu1x names beings who came down from Nusma’ta to a place
    near sunrise.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In their house, all languages were written down and distributed among the
    various tribes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nutseqo’ax does not assume human shape, but remains a wolf, as he had been
    in heaven.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The group travels down Bella Coola River; Anuxé’m stays at Kounalos, Késmi’o
    stays in the country of the T!aa’nsné, and the others go toward the sea over the
    mountains.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Séxé’m carries their house in a small box named Nuts’axma'ls; when the house
    is put down on Mount Ni’ya, it enlarges to natural house size.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The enlarged house has a horse-fly painted around the door and a sun represented
    on each side.
  category: object
  evidence_refs:
  - ev:6
