canonical_text:
  quote: ''
  summary: 'The passage describes Thompson mortuary customs: addressing the deceased
    after burial, leaving food near graves, child and infant burial practices, grave
    markers and grave structures, canoes and wooden likenesses placed on graves, family
    burial grounds, later gathering and rewrapping of bones, temporary burial or cremation
    for deaths far from home, return of remains to kin burial grounds, and a note
    on Nicola Valley Athapascan rockslide burials.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After burial, an elderly person addressed the deceased and asked the deceased
    not to trouble the widow or widower.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Food was sometimes thrown near the grave for the deceased to use while visiting
    the grave and so the deceased would not visit the house for food and cause sickness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A child's clothes and cradle could be hung near the grave or buried near it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a mother died leaving an infant, the infant was sometimes wrapped in
    a robe and buried alive with the mother in its cradle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Graves could be marked with small heaps of boulders, conical huts, peeled
    and red-ochre-painted poles, suspended belongings, or piles of stones.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: On many graves near Lytton, the deceased's canoe was placed bottom side up.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some graves had wooden figures carved in the likeness of the deceased, painted,
    supplied with hair, equipped with goods, and dressed in clothes that could be
    renewed.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that grave figures were intended to keep the dead relative
    in memory, show respect, identify the buried person, and display the wealth and
    status of living relatives.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Each group of families had its own burial ground, placed conspicuously at
    some distance from the village.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: A young child was buried away from old graves because burial close to an old
    grave was said to prevent the mother from having more children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Wealthy people sometimes opened a relative's grave after one or two years,
    gathered the bones, cleaned them, and put them in a new skin robe or blanket,
    while witnesses were feasted.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Bodies of poor people, people without friends, or people who died far from
    usual burial places might be covered with sticks, bark, and branches with no further
    care.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: If a person with relatives died in the mountains, the body was carried to
    the river valley if possible, or temporarily covered or buried and later interred
    with kin.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: If death occurred in a very distant or strange place, the body could be burned
    and any remains wrapped and carried to the family graveyard.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Bodies of people from another tribal division or strangers were often temporarily
    buried where they died and later removed by relatives for burial among kin.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: A note says the Athapascan tribe of Nicola Valley placed bodies at the bottom
    of rockslides and covered them with sliding boulders.
  category: action
  evidence_refs:
  - ev:10
