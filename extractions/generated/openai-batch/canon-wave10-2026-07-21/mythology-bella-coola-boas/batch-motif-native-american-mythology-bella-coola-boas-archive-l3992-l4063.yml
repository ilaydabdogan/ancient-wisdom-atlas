canonical_text:
  quote: ''
  summary: Xé’mak:sta uses a restored canoe, bear transformations, down, and a two-ended
    staff to outpace and defeat people coming by canoe to kill his mother. He first
    sickens them, cures them, kills them when they attack, then restores them to life;
    marriage offers follow the resuscitations. The passage then begins a separate
    episode in which four brothers go mountain-goat hunting and several fail to return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people prepare and take all their canoes early in the morning to prevent
    Xé’mak:sta from following them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Xé’mak:sta instructs his friend to find an old broken canoe placed over the
    salmon-weir, launch it after the people leave, and wait for him at Ktso.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the old broken canoe is placed in the water, it becomes whole like a
    new canoe.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Xé’mak:sta jumps into the canoe, shakes himself, assumes the shape of a bear,
    walks in the canoe, and resumes human shape.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Xé’mak:sta tells his friend to follow slowly in the canoe while he runs home
    over the mountains.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Near the shore, Xé’mak:sta turns into a bear, runs over the mountains, and
    reaches his home before the people arrive.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Xé’mak:sta tells those in his father’s house that the people of Nuxa’lk are
    coming to kill his mother because their daughters are in love with him, and he
    says he will defeat them without help.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Xé’mak:sta’s speaker warns the approaching canoes not to come ashore because
    the shaman is present and will kill them, but the people disbelieve him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Xé’mak:sta covers his bear-skin blanket with down, shakes himself on the roof,
    and the down settles on the canoes, causing the people to become sick with sore,
    swollen skin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Xé’mak:sta points the healing end of his staff toward the canoes; the people
    recover, and the down flies back to him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the recovered people land and approach the house while threatening Xé’mak:sta
    and his mother, he points the deadly end of his staff at them and they fall dead,
    except for one person who stayed in a canoe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Xé’mak:sta touches the chief of Qo’mqutis with his staff and revives him,
    then revives others; the revived people give daughters in marriage and ask that
    friends be restored to life.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Four young men, sons of Semsiuta’k-as’s son, go upriver to hunt mountain-goats,
    separate by creeks, and several brothers fail to return after searches.
  category: sequence
  evidence_refs:
  - ev:8
