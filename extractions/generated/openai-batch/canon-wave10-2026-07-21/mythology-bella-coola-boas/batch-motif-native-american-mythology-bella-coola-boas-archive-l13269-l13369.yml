  quote: ''
  summary: The passage gives an ethnographic description of Thompson clothing, introduced
    garments and trade materials, current uses of blankets and moccasins, cowboy-style
    dress among some young men, women’s headwear and sewing, clothing decoration,
    and ear and nose ornaments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Introduced materials and garments include cloth leggings, beaded leggings,
    woollen blankets, red sashes, ribbons, and beads; the passage says many of these
    later went out of use and that current dress differs little from that of whites
    except among some old people.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Older people still often use blankets in winter, but over other clothes; men
    sometimes make blankets into shirts, pantaloons, and leggings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Moccasins are described as general footwear for both men and women, especially
    among the Upper Thompsons, and the passage says they never go barefoot.
  category: object
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:4
  text: When hunting or travelling, men wear moccasins and tie garters below the knee
    and around the ankles to keep trouser legs close and tight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fur caps, handkerchiefs, buckskin gloves, and buckskin mittens are described
    as seasonal clothing items.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Young men of the Upper Thompsons, especially from the Spences Bridge and Nicola
    bands, are said to affect cowboy dress, and horses are saddled and bridled in
    cowboy fashion.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Men’s clothes and women’s colored dress materials are described as commonly
    bought from neighboring trading stores, and many women are described as skilled
    at cutting and sewing clothing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Women commonly wear silk handkerchiefs as head-dress; some old women wrap
    buckskin or blanket around the leg in cold weather or snow.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Clothing decoration includes buckskin fringe, red-painted designs, pinking,
    perforations, beads, copper tubes, dentalia, disk-shaped horn, bone, shell beads,
    elk teeth, feathers, quills, ribbons, eagle-down, and red wool.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that with the introduction of silk, old designs seem to
    have disappeared and imitations of white designs took their place.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Both men and women wore ear-ornaments made with bark or skin strings passed
    through holes in the ear, from which dentalium shells hung; later beads and metal
    buttons were also used.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Nose-ornaments are described as used by women only and as made from dentalium
    shells, bone, copper, or slate passed through the septum of the nose.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Lower Thompsons sometimes used abalone-shell ear-ornaments.
  category: object
  evidence_refs:
  - ev:6
