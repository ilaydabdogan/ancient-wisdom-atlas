canonical_text:
  quote: ''
  summary: A Raven episode narrates several schemes. Raven marries a widow, desires
    her daughter, withholds fire, questions kinds of wood about their behavior in
    fire, and uses selected bark in an attempted sexual ruse that the daughter detects
    and punishes. Raven then feigns sickness, is excluded from a feast, uses his children
    and a false warning to make the guests flee, and steals the meat. Finally, Raven
    visits Deer, asks when Deer is fattest, and later lures Deer up a mountain to
    a meadow near a precipice, where they begin exchanging taunting songs.
  language: English with Latin section
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A widow has a beautiful daughter; Raven marries the widow and soon covets
    the daughter.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raven leaves his house without fire for two days until the girl complains
    of cold, then offers to get firewood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Raven questions alder, pine, red cedar, and Douglas fir bark about what they
    do when thrown into fire, rejecting some answers and selecting the bark that says
    it will fall into girls' laps.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Raven takes pieces of the selected bark home, places them on the hearth, and
    instructs the girl how to sit near the fire; the bark falls into her lap and burns
    her genital area.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Raven tells the girl to find and sit on a moving herb in the woods as a remedy;
    he hides in the woods under sand with only his penis exposed, but she recognizes
    his eyes, beats him, and returns home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mo’xmuk’t, described as a mountain-dwelling bird, invites the people to a
    feast; Raven is not invited.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Raven pretends to be sick and sends his two children to see what food Mo’xmuk’t
    is preparing; they see meat being broiled.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Raven cries out behind the feast house, runs home, lies by the fireplace,
    and has his children cover him with ashes to avert suspicion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After messengers find Raven apparently sick by the fireplace, the people ask
    his opinion about the cries; he tells them enemies are coming and advises them
    to flee without food.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the people flee, Raven takes all the meat and hides it near his house;
    when the people return, they suspect him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Raven asks Deer when Deer is fattest, then returns at that season and invites
    Deer to go up the mountain to tell about their ancestors.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Raven brings Deer to a meadow near a steep precipice, seats Deer near the
    edge while Raven sits farther back, and begins a sung exchange about Deer’s long
    forelegs and nose and Raven’s gray nose.
  category: sequence
  evidence_refs:
  - ev:6
