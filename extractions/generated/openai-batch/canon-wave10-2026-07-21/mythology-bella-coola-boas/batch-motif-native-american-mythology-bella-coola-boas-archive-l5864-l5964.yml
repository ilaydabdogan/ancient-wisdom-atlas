canonical_text:
  quote: ''
  summary: Raven travels, enters a house with dried fish and invisible self-moving
    work, summons his sisters to remove the provisions, and is punished by the Echo
    who inhabits the house. He is then hosted at feasts by Maxuat!a’laqa, K’uéla’is,
    and Aix’a’xoné, who produce salmon-eggs, grease, and salmon-berries by special
    bodily or sung acts. Raven tries to imitate these acts for return feasts and fails,
    producing nothing, burning his hands, and filling a box with excrement. He then
    goes with his sisters to Salmon country, abducts the chief’s daughter after sabotaging
    Salmon canoes, and escapes in his own canoe. At home, his Salmon wife lengthens
    his hair despite warning him; his hair catches in drying salmon as he leaves the
    house.
  language: English
  quote_policy: summarized
