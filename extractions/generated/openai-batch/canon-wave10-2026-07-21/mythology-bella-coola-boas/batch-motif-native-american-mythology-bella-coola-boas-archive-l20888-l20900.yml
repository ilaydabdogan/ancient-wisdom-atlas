canonical_text:
  quote: ''
  summary: 'The passage describes beliefs about ghosts interacting with living people:
    ghosts may consume a living person''s food, drink, or tobacco smoke and take away
    the person''s soul; pipe-smoking can make a ghost disappear; people without guardian
    spirits may swoon at seeing ghosts; ghosts may pursue, throw stones or bones,
    haunt camps, trouble dreams, or be inferred from sudden fear or depression. It
    also states that suicide souls do not go to the land of souls, according to shamans.'
