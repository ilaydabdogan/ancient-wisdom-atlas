- id: obs:2
  text: The people described were formerly called Couteau or Knife Indians by Hudson
    Bay Company employees, but are now called Thompson Indians; they call the whole
    tribe Nuak-a'pamux.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the ending "mux" means "people" and that the Thompson
