  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Thompson habitat is described as the southern interior of British Columbia,
    mostly east of the Coast Range, about one hundred miles long by ninety miles broad.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fraser River, Thompson River, and Nicola River run through the territory;
    principal villages are in or near their valleys, with adjacent country used as
    hunting ground.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Shuswap are named as northern and eastern neighbors and nearest akin;
    the Lillooet are northwest, the Okanagon south and east, and Coast Salish are
    at the mouth of Fraser River canyon.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage lists more distant peoples known by name, including Salish tribes
    of Montana, Idaho, and interior Washington, Sahaptin, Kootenay, northern Shoshone,
    Stiltx:, and Crees.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The territory is divided near Lytton at the junction of Thompson and Fraser
    Rivers; the Lower Thompson country is described as rugged, mountainous, deeply
    valleyed, timbered, and dependent mainly on streams for livelihood.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The country north and east of Lytton is described as dry, rugged or hilly,
    with round mountain slopes, valleys, plateaus, sagebrush, grease-wood, grass,
    pine, more game, and some agricultural and stock-raising possibilities.
  category: setting
  evidence_refs:
  - ev:6
