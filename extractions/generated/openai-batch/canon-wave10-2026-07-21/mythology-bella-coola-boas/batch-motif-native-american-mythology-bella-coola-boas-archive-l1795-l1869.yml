canonical_text:
  quote: ''
  summary: The passage describes Northern British Columbia facial paintings that represent
    animals or ritual meanings by mapping selected animal body parts, colors, and
    symbolic marks onto the human face. Examples include killer whale, dog-fish, sculpin,
    starfish, the sea-monster Ts’an x6’utsé, mosquito, hawk, frog, copper as wealth,
    and blood associated with a killed slave under a house post.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A killer whale design is described as a dissected profile fitted to the face,
    with head and teeth on the right cheek, tail on the left cheek, and dorsal fin
    on the forehead.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Green paint marks the base of the killer whale dorsal fin, the joint of the
    tail, and the eye, and is said to be used exclusively by the family Sta’stas.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dorsal fin alone can be used to symbolize the killer whale.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dog-fish design uses the person’s eyes as the fish’s eyes and places the
    snout, nostrils, gills, split tail, and dorsal fin on different parts of the face.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dog-fish is associated with red color, and the painting may be supplemented
    with black daubs on both cheeks.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sculpin design uses red, blue, and black; the human mouth represents the
    sculpin mouth, spines rise from the upper lip, nostrils are on the cheeks, a blue
    triangle marks the dorsal fin, and a black tail is on the forehead.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Two red bars in one figure are identified as the arms of a starfish, elsewhere
    shown as a cross.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that a following series of paintings represents animals
    by symbols, arranged to show the body parts used.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The sea-monster Ts’an x6’utsé is represented by a large red-and-black mouth
    with enormous teeth and is described as having red and black colors and a black
    dorsal fin.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ts’an x6’utsé is translated as “grisly bear of the sea,” identified with the
    Tsimshian sea-monster Hagula’q, and described as half bear and half killer whale
    with two tails and an enormous dorsal fin.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A human face is often shown at the base of the sea-monster’s dorsal fin; the
    passage also notes a general tendency to mark animal joints with eyes that may
    develop into faces.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: Other paintings show the mosquito by a long proboscis, the hawk by a beak
    and tongue line, and the frog by a large toothless mouth or reddened lips.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: The same or similar lip painting may represent copper as wealth, the frog,
    or the blood of a slave killed during a festival and buried under a house post,
    with the blood version extending slightly beyond the lips.
  category: relationship
  evidence_refs:
  - ev:10
