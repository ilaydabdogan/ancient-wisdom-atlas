  summary: 'The passage describes archaeological finds and inferred practices in the
    Thompson River/Kamloops region: stone hammers or pestles, anvils, mortars, a reported
    carved stone dish, slate knives, cooking features, underground house pits, cache
    pits, and antler wedges, with several comparisons to Lytton, Coast tribes, Columbia
    Valley, and California.'
