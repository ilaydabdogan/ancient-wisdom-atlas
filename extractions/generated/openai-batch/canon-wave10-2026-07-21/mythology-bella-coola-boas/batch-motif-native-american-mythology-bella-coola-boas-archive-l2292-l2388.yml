canonical_text:
  quote: ''
  summary: The passage introduces Boas’s account of Bella Coola mythology as a coordinated
    system of deities. It describes a five-level cosmos with earth between two heavens
    and two underworlds; an upper heaven ruled by a female deity, Qama‘its; a lower-heaven
    house of gods containing the Sun and other deities; an underworld of ghosts; and
    the landscape and beings associated with Qama‘its’s house. It also recounts that
    Qama‘its fought primordial mountain beings and reduced their size.
  language: English
  quote_policy: summarized
