canonical_text:
  quote: ''
  summary: The passage describes conventional facial-painting symbols and visual conventions
    used to represent animal body parts or animal identities. It explains examples
    involving mountain-goat horn, bear feet and ribs, sea-lion, killer whale, the
    sea-monster Ts’an x0’utsé, halibut, eagle, and woodpecker designs, with emphasis
    on body-part substitution, color coding, and geometric abstraction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Circular ornaments around a long object are described as being turned upward
    in flat representation so that they resemble a row of cross-sections; examples
    include the mountain-goat horn and comparisons to hat rings or sculpin vertebrae.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A bear-foot design places the heel portion above the eyebrows, making the
    heel serve as both part of the foot and the animal’s ears.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author states that the conventional symbols in the following figures require
    explanation to identify the animals they represent.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A small triangle on the nose in Fig. 15 is said to symbolize the mouth of
    an animal name that appears corrupted in the OCR text as “devil-ietewein.”
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Fig. 16, large teeth of the sea-lion rise over the eyebrows, and a red-painted
    chin symbolizes the throat of the killer whale.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Fig. 1, Plate V, a large red oval in the middle of the face represents
    the bladder of the sea-lion and is accompanied by the red chin symbol for the
    killer whale throat.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: In Fig. 2, the tail of the sea-monster Ts’an x0’utsé is described as identical
    in form with the tail of the killer whale, with color used to distinguish the
    design.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: In Fig. 3, one black eyebrow and one red eyebrow are used for the same sea-monster.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: In Fig. 4, the painting shows the tail of a halibut protruding from the dancer’s
    mouth; the author says the painting is intended to represent a sea-lion swallowing
    a halibut rather than the halibut alone.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: For Fig. 4, the whole face of the dancer is said to represent the sea-lion,
    identified by the food it is eating; the chin is again painted red for the killer
    whale throat.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: In Fig. 5, crossing black lines symbolize the ribs of the bear, and the author
    describes this as a purely geometrical design intended to symbolize an animal
    form.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: In Fig. 6, the dancer’s head is daubed red to represent the white head of
