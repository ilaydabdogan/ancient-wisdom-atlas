canonical_text:
  quote: ''
  summary: 'The passage describes archaeological finds from Lytton, British Columbia:
    steatite smoking pipes, inferred tobacco and bearberry smoking evidence, a schistose
    pebble with an incised cross, red-painted or red-ochre-stained objects, and decorated
    antler and bone implements. The author cautions that the incised cross is not
    necessarily borrowed or post-contact.'
  language: English
  quote_policy: summarized
