  text: Information attributed to James Teit says that before manufactured tobacco
    was introduced, wild narrow-leaved tobacco of the region was used.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states as a possibility that prehistoric people of Lytton smoked
    wild tobacco mixed with bearberry, and says charred bearberries in old hearths
    strengthen this opinion.
  category: sequence
  evidence_refs:
  - ev:1
