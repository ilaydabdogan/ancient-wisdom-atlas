  summary: The passage describes limited former intercourse and intermarriage between
    upper and lower divisions of the Thompson Indians, exceptions involving the Lytton
    band and Coast Salish connections, reasons including difficult travel and interdivisional
    attitudes, and increased intercourse after the arrival of whites, roads, and railway
    construction.
