canonical_text:
  quote: ''
  summary: The passage records prayers and ritual acts directed to mountains, rain,
    the Chinook Wind, and the Dawn; taboos concerning haunted lakes, thunder, frogs,
    animal deaths, and the rainbow; and beliefs that particular mountains, lakes,
    sky powers, and weather phenomena can affect rain, sickness, healing, fire, and
    bodily harm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People prayed to certain mountain-peaks for good weather and plenty of fish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At one Fraser River location, three high mountains are named; the middle and
    highest, A’moten, is believed to be a man, with two wives on either side.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Threatening or making a striking motion toward A’moten with a stick is said
    to cause rain at once.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kazik, a mountain near Lytton, is said to possess supernatural power; when
    a person with a strong guardian spirit points at it, rain follows. Skoiaiks is
    named as another peak of this kind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Roots and other vegetation near a haunted or mysterious lake should not be
    gathered; nearby vegetation is called the lake’s blanket, and swamp-grass and
    reeds in the water are called its hair.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the lake is robbed of its blanket, it may retaliate with sickness, bad
    luck, death, an apparition, or a death-warning affecting the offender or a near
    relative.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some first berries of the season were offered to the earth or, more often,
    to the mountains by an old gray-haired person who danced and held the fruit toward
    the mountain-tops.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the berry offering, the word “qai'lis” was repeated twice, faces were
    painted red, and the people danced for some time.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: To end heavy rain, a supplicant heated a stick in the fire, described sunwise
    circles with it, stopped successively toward the east, south, west, and north,
    addressed the Rain and mountains, then threw the stick into the fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In spring, the warm Chinook Wind was prayed to and asked to remain, blow,
    and dry the earth.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Every morning at daybreak, one of the oldest members of each household went
    outside and prayed to the Dawn.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Dawn of the Day was believed to cure hernia when supplicated through an
    adolescent girl who chewed charcoal, spat it on the swelling four times, and addressed
    the Dawn.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Thunder is believed to shoot ordinary thunder arrow-heads and red-shafted
    flicker tail-feathers, and the flicker feathers are said to set fire to whatever
    they touch.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: People attached red-shafted flicker feathers, lightning-struck wood, or splints
    of such wood to arrows intended to set enemy houses on fire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: During heavy thunderstorms, men bit their dogs’ ears to make them howl, which
    was believed to drive thunder away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Killing a frog may cause rain; the death of a grizzly bear, black bear, or
    big-horn sheep may change the weather.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: People feared pointing at the rainbow because it could make their fingers
    sore; if pointing was necessary, they first wet the little finger in the mouth
    or spat on it.
  category: action
  evidence_refs:
  - ev:9
