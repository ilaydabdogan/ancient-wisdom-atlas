canonical_text:
  quote: ''
  summary: The passage explains several face-painting and hair-dress designs. These
    designs are said to represent the throat of Ts’an xo’utsé, an eagle’s nest, a
    halibut, mosquito bites, a split tree trunk with woodpecker holes, copper plates
    and their valued ridge, a rock-slide with uprooted trees, and red evening clouds.
    It also notes a visual principle shared with totem-pole carving and describes
    the breaking and distribution of copper plates.
  language: English
  quote_policy: summarized
