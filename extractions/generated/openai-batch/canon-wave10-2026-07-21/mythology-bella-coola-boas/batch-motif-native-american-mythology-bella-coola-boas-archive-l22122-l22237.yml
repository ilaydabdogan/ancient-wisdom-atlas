canonical_text:
  quote: ''
  summary: The passage catalogues Thompson Indian decorative designs on handles, quivers,
    a shaman’s head-band, gambling implements, digging-sticks, pipes, rock-paintings,
    caps, gaming objects, pouches, and tools. It explains several represented forms,
    including earth-lines, lightning, mountains, suns, stars, dreams, water features,
    animals, snakes, the world, trees, and puberty ceremonial rock-paintings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A handle design is explained as earth-lines with four lines connecting earth
    and sky as lightning; a quiver design includes mountains rising over an earth-line
    and two suns.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A shaman’s head-band painting shows a wolf and a star on one side, and a star
    with the shaman wearing a feather head-dress on the other side.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gambling implements are described as decorated with designs intended to secure
    luck; a pouch design includes the sun, star-dots, and a cross interpreted as either
    crossing trails or a reel for winding string.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Handles of digging-sticks sometimes have carvings representing the owner’s
    dreams.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A shaman’s pipe carries designs including a loon-necklace design, a lake and
    river, animals, earth-lines, mysterious colored lakes connected by a river, a
    mountain with fog on top, a snake, a rattlesnake, the sun, and another loon necklace.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Other pipe appendages are described as carved with the sun, a man holding
    a spear, a canoe-shaped appendage, a big-horn sheep head, an otter, and rib designs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Most rock-paintings in the Thompson country are assigned to the same class
    of designs; almost all were made by boys and girls during puberty ceremonials,
    and the figures in each painting are generally disconnected because they were
    made by different people at different times.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A cap design includes lodges on an earth-line, dentalia in a mountain design
    over the earth-line, and dots representing stars.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: A stick-game skin has a surrounding line and inner circle representing the
    world; inward short lines are clumps of trees, and two men and a dog appear in
    the center of the world.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A ball bat represents a small snake, a tobacco pouch shows a lizard, and tools
    are decorated with butterfly, eye, and wood-worm designs.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Only a few painted or etched designs are closely adapted to the form of the
    object; butterfly designs and arbitrary symbols of food and trees are noted as
    adjusted for decorative effect.
  category: attribute
  evidence_refs:
  - ev:7
