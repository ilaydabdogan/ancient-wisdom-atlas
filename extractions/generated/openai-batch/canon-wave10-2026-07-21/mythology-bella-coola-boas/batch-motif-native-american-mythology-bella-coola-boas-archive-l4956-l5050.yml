canonical_text:
  quote: ''
  summary: A boy accompanied by the Salmon boy travels by river through fish countries,
    survives hazards by following instructions, and reaches the Salmon country. In
    a Salmon house, two children are thrown into water, become salmon, are eaten,
    and are restored when their remains are returned. The youth then seeks a beautiful
    girl who warns that her husbands die; a Latin segment describes his use of stones
    against her toothed genitalia, with the passage ending before the episode is fully
    resolved.
  language: English with a Latin segment
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The canoe travels down the river to the Salmon country; the boy is unseen
    by the other canoe passengers until they land, and the Salmon boy identifies him
    as his brother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Salmon boy warns the youth about the stench near the Smelt country and
    falling scales at the place of the Herrings; the youth follows the instructions
    and is unharmed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: They pass a greasy Olachen village and arrive at the Salmon country, where
    houses are associated with named salmon kinds, canoes are on the riverbank, and
    children smell the outsider without seeing him.
  category: setting
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: In the central house, the youth sees a beautiful girl with red hair, white
    skin, and clear crystal-like eyes, and he falls in love with her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Salmon boy says the house door tries to bite entrants; he jumps through
    first, and the youth imitates him when the door opens again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hosts offer food made of algae from river logs; when the youth does not eat
    it, he is told to throw two children into the river without looking, after which
    he finds a male and a female salmon and roasts them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The people instruct the youth to preserve the intestines and bones and return
    them to the river; the children return injured until a missing eye and bone are
    also thrown into the water, after which they are well.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The youth asks to see and marry the beautiful girl; she says whoever marries
    her must die, though she likes him and permits him to lie beside her without intercourse.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Latin segment says the youth takes two long round stones from the shore,
    hides them, lies with the woman, persists despite her warning, claims not to be
    merely mortal, and uses the stones against her toothed vagina; the supplied passage
    ends before the episode is complete.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
