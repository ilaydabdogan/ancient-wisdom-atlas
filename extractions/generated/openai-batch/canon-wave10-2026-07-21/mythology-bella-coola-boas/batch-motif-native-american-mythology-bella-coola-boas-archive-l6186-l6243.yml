canonical_text:
  quote: ''
  summary: The Deer kills sleeping people with knives, but an old woman remains awake
    and rouses others, who pursue him until he climbs a tree. The old woman teaches
    the pursuers a song for bringing him down. They repeatedly forget it after jumping
    over a log, but remember when they go around the log while humming the tune. They
    sing at the tree, causing the Deer’s limbs and body to fall, then tear him to
    pieces. One man uses a Deer leg to declare that some future people will have one
    leg shorter than the other, explaining limping.
  language: English
