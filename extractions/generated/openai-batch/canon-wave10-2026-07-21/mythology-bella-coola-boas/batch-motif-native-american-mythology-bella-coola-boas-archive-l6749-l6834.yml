  quote: ''
  summary: A mountain-goat hunter sees a fire emerge from a cave in a glacier, cuts
    its fiery thread, carries the fiery ball home, and has the villagers play with
    it. A beautiful young man, later identified as the glacier, kills and impersonates
    an old woman in order to recover the ball, which is identified as his wind.
