  summary: The passage describes recent Thompson Indian migrations and settlement
    changes, especially moves toward better agricultural land after contact with whites;
    the decline of Neqa’umin as a fishing-centered settlement; intermarriage with
    neighboring tribes and white settlers; mixed-descent populations; demographic
    counts for two Spences Bridge-area bands; and an opening statement about reported
    changes in reputation or character traits.
  language: English
