  summary: The passage describes copper, shell, dentalium, mica, bone, fibre, and
    ochre objects found with or near a skeleton/body, especially near the neck and
    back. Several items are interpreted as pendants, necklace elements, garment ornaments,
    or possible ear ornaments. A named informant says some specimens were probably
    worn on the chest by daughters of chiefs.
