  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Noak‘i’la asks Masmasala’nix to break the mountain to open a way for the river,
    and the brothers Masmasala’nix try unsuccessfully to split it with wedges.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The hauhau pecks the mountain with its beak in an attempt to break it, but
