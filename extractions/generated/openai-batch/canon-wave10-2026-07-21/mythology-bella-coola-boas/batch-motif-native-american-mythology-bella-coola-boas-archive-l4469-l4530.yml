candidate_motifs:
- id: motif:1
  label: Culture figures make a dangerous country inhabitable
  taxonomy_refs:
  - culture_hero
  basis: The brothers discuss calling people to make the country inhabitable, and
    Noak‘i’la calls helpers to open a way for the river through the mountain.
  evidence_refs:
