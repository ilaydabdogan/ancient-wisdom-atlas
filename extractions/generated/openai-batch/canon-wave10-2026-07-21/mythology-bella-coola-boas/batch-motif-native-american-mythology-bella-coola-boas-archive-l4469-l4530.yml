  basis: Isyi’yot first thinks Xé’mtsiwa is an eagle, wonders whether he retained
    an eagle shape from heaven, and asks why he did not assume human shape.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage frames the form as an observed or questioned condition rather
    than narrating a transformation event.
- id: motif:4
  label: Serpent splits a mountain
  taxonomy_refs:
  - serpent
  basis: The xtsaltsalo’sem or si’siuL, a mountain snake, crawls on Suwa’k:x:, and
