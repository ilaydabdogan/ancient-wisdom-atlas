canonical_text:
  quote: ''
  summary: The passage recounts how figures sent from heaven or by the Sun descend
    to named mountains and rivers, build canoes, establish houses and territorial
    markers, confront a dangerous river hidden by a mountain, call helpers, and attempt
    to break the mountain so the river may pass. A mountain snake called xtsaltsalo’sem
    or si’siuL succeeds in splitting the mountain where other helpers fail.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sun sends Isyi’yot and Xé’mtsiwa down to the mountain Suwa’k:x’, and their
    sister Qa’qma comes down with them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Xé’mtsiwa and Isyi’yot wear eagle blankets.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Isyi’yot and Xé’mtsiwa agree to make canoes and to visit one another depending
    on who finishes first.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Isyi’yot goes down the mountain, settles on the north side of Bella Coola
    River at the foot of Mount SqtsL, and builds a house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Isyi’yot finishes his canoe first, starts toward Nod’u!el, visits a sequence
    of named places, and erects posts at those places.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Isyi’yot sees his brother sitting on a log wrapped in a blanket; at first
    he thinks he is an eagle, then recognizes him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Xé’mtsiwa says he did not assume human shape because the place is dangerous,
    and says he brought down the olachen but it cannot go up the river.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Xé’mtsiwa tells Isyi’yot that taking possession of many places is not right
    and that he should take possession only of the place where he built his first
    house.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Isyi’yot sees that the river disappears under mountain Suwa’k:x:, cannot be
    ascended by canoes, and has no fish in it.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Isyi’yot proposes calling people to make the country inhabitable, and both
    brothers arise and consider what to do.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Noak‘i’la, his brother Ts’a’k’us, and his sister SL’ax'L’axta’aL come down
    from heaven through a hole and intend to descend the river, but find it exceedingly
    dangerous.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Noak‘i’la calls Masmasala’nix, who comes down to help and makes a canoe named
    Qoaqoa’usaloL.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: At A’sk«lta, Noak‘i’la’s brother and sister land and become ancestors of the
