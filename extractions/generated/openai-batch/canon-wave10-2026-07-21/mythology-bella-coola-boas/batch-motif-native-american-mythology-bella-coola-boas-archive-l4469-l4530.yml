  - ev:8
  confidence: medium
  cautions: The passage does not explicitly call these figures culture heroes; the
    label is a functional motif classification based on actions described.
- id: motif:2
  label: Descending sibling groups establish places and ancestors
  taxonomy_refs:
  - sibling_pair
  basis: Two sibling groups descend from above; one group concerns settlement and
    territorial claims, and Noak‘i’la’s brother and sister become ancestors at A’sk«lta.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage includes sibling groups including sisters, not only a strict
    pair.
- id: motif:3
  label: Animal-human form or retained eagle shape
  taxonomy_refs:
