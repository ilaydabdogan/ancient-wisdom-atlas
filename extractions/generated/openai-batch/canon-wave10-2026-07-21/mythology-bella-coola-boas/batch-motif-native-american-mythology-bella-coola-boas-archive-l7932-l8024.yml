  summary: An archaeological discussion identifies green stone and jade-like specimens;
    notes local stone, paint, ochre, and copper sources and uses near Lytton; quotes
    Dawson on Shuswap red ochre localities and an Adams Lake ochre cave; and summarizes
    animal remains associated with Lytton village-sites and burial-grounds.
  language: English
