literal_observations:
- id: obs:1
  text: Several green stone specimens are technically described; two are said not
    to be jade, while several others fulfill optical and physical tests for jade,
    and one implement is believed to be jade despite a lower specific gravity.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Green stones were seen along the Fraser and Thompson Rivers, and parent outcrops
    were reported in a creek tributary to the Fraser above Lytton.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Siliceous sandstone was used for smoothers, groove-grinding in serpentine,
    and grinding-stones; copper clay, calcareous earths, yellow earths, and red ochre
    were used for paints of corresponding colors.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Dawson identifies three Shuswap red ochre localities: Skwo''-kil-ow on Adams
    Lake, Tsul''-a-men or Tulameen at a red bluff on the Similkameen, and an unidentified
    locality on the Bonaparte above Hat Creek.'
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the Adams Lake paint-producing locality, a shallow cave near the beach
    appears to have been enlarged or formed by digging for ochre; damp pyritous schists
    produce yellow ochre, which is collected and burnt to a bright red color.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A black shining mineral, probably micaceous iron or graphite according to
    the source, was formerly used to paint the face, but the informant did not know
    its source.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Copper was made into objects and apparently used for ornaments and clothing
    decoration, as indicated by copper stains on human bones, elk-tooth beads, and
    dentalium shells.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Worked and broken bones and teeth indicate that animals were useful to the
    prehistoric inhabitants of Lytton; bones of deer, black bear, birds, and fish
    were found in village-sites, salmon bones occurred in old hearths, and the age
    of a surface dog jaw-bone was unproven.
  category: relationship
  evidence_refs:
  - ev:6
