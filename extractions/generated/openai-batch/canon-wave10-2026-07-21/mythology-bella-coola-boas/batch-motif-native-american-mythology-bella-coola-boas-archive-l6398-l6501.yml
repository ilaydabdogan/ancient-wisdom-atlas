canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which a boy lights torches on the
    path of the Sun, causing destructive heat on earth until the Sun throws him down
    and makes him the mink. It then tells of two chiefs’ gambling sons: one son loses
    all property and family, is abandoned by the village, survives for a time with
    hidden embers, loses his fire to snow, and is near death. A young woman sent by
    her father the Wolf feeds and restores him, leads him to a cliff house with a
    dangerous mouth-like door, and brings him before the Wolf chief and his people.
    The wolf guests put on dangling tails and leave as wolves. The young man marries
    the Wolf girl, has a child, and is warned that smoke must never touch her blanket.'
  language: English
  quote_policy: summarized
