- id: obs:3
  text: Items 3-4 list the back and dorsal fin, and a short bear’s tail, of the sea-monster
    Ts’an xd’utsé; the colors are black or black and red, and the designs are used
    by Yakula’nas and Nanaa'ri groups named in the passage.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Items 5-8 describe sculpin facial-painting designs: red lips represent the
    sculpin mouth, while blue elements over the mouth, nose, forehead, or other face
    areas represent spines, vertebrae, or flippers.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Item 9 lists a blue hat of raven and says it is used by G'it’ina.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Items 10 and 13 describe mountain-goat horn or horns; item 13 also places
    ears over the eyebrows. These designs are associated with LqénéLlanas or Lqénoxla’nas
    of Q’u'na or Skidans as printed in the passage.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:9
