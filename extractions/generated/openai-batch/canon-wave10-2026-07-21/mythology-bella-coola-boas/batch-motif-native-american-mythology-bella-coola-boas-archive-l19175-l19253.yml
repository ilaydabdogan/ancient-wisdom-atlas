canonical_text:
  quote: ''
  summary: 'The passage describes Thompson customs concerning women, menstruation,
    hunting success, weapons, and the placement of lodge doors, followed by customs
    after death: temporary placement of the body, changes to the house ladder, wake
    restrictions, treatment of a deceased woman''s provisions, mourning songs, corpse
    preparation, burial orientation, grave digging, and grave-sweeping to remove evil
    influences.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage associates certain animal parts with special potency and states
    that a woman might have her mouth twisted if she ate the head of a deer.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A menstruating woman did not eat venison or flesh of other large game because
    the animals might be displeased and her menstrual flow might increase.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lodge doors were placed so that women going for water did not pass by the
    part of the lodge where people’s heads lay during sleep; doors were generally
    oriented toward watering-places.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women accompanying a hunting party were forbidden to smoke while men were
    hunting; some men also forbade women in camp to eat until sunset or until hunters
    returned.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If a woman, especially a menstruating woman, crossed in front of a gun, the
    gun became useless for war or hunting; the owner counteracted this by washing
    it in medicine or striking the woman with it on principal parts of the body.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The same prohibition about crossing in front applied to other weapons of hunting
    or war.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the father of an adolescent girl had difficulty killing deer, he used
    wood from a lightning-struck tree soaked in water, put the water into his gun
    barrel overnight, and sometimes placed the wood near his pillow for two nights
    to break the spell.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Immediately after a death, the body was placed outside the house on a temporary
    covered platform, and the position of the ladder of the underground house was
    changed until after the body was removed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Neighbors and friends gathered at the deceased person’s house and were guests
    of the relatives until after burial.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: During the time before burial, gathered people were not to sleep, because
    their souls might be drawn away by the ghost of the deceased or by the deceased
    person’s guardian spirit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After a woman’s death, provisions she had stored from the preceding season
    were set before the people; leftovers were burned outside the lodge, and participants
    induced vomiting with slender twigs.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Relatives and friends, especially women, expressed grief by improvising mourning
    songs before and sometimes after burial.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Before burial, no one was allowed to eat, drink, or smoke in the open air
    after sunset or dusk, because the ghost would harm them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The corpse was generally left unwashed, without medicine, with loose hair
    and ordinary apparel; it was tied with bent knees and rolled in robes or mats.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: The body was buried sitting and facing east, or laid on its left side with
    the face toward the south, in a circular shallow hole.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:16
  text: If winter ground was frozen, fires were lit to thaw it before digging the
    grave.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: Before interment, the grave was swept out four times with a fir or rosebush
    branch following the sun’s course to drive away evil influences; the branch was
    thrown toward the west.
  category: sequence
  evidence_refs:
  - ev:11
