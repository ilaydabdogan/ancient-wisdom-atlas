canonical_text:
  quote: ''
  summary: The passage describes several Thompson basket forms and their practical
    uses, including conical carrying baskets, water-holding baskets, round open baskets
    used as kettles with hot stones, flat-backed baskets for tobacco, pipes, bait,
    fishing tackle, and saddle-bags, and bark baskets used for storage, transport,
    cooking, buckets, and cups. It also notes newer tray, pitcher, and goblet shapes
    made in imitation of objects seen among whites.
  language: English
