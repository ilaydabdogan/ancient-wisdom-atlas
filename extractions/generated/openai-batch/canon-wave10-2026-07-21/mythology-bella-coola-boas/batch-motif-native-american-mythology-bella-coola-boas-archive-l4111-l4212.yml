canonical_text:
  quote: ''
  summary: 'The passage recounts the end of a tale in which a young man, aided by
    a woman, kills Toa’lav’it with a staff, receives his dogs and hunting equipment,
    and assumes his name and role. It then gives an Alqla’xl ancestral notice involving
    descent to a mountain, a raven-box house, and a marriage link. A Stsk‘e’il tradition
    follows: Alk’ala’lis and his brothers descend from heaven to a mountain, seek
    abalone shells, become lost, receive help and supernatural power from the Raven
    Qa”xaxsila, pass through a cave, acquire shells, return after a year, and find
    that only the youngest brother’s wife remained faithful.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Toa’lav’it had two dogs described as wolves and tied one to each side of his
    bed.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the night Toa’lav’it and the young man exchanged cries; near daybreak
    the young man cried three times but Toa’lav’it did not answer.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman told the young man to take Toa’lav’it’s staff and point it at him;
    when the young man did so, Toa’lav’it died.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The woman told the young man to free the dogs, and the dogs bit off the head
    of their former master.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The woman told the young man to throw Toa’lav’it’s body down a precipice;
    while doing this he saw his lost brothers lying in the abyss.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman gave the young man a new name, the dogs, the staff, and the quiver.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The woman instructed the young man to hunt goats on the mountain with four
    arrows and with the staff, and to carry goats at his belt rather than on his back.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The young man killed a large goat and returned; the woman said he was now
    like Toa’lav’it and gave rules about sleeping with her and helping unhappy people
    who wanted goats.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: In the Alqla’xl tradition, named figures were sent down to the mountain SqtsL;
    their house was called the raven box, had posts representing men, and had a raven
    design on the front.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the Stsk‘e’il tradition, Alk’ala’lis and his three brothers were sent down
    from heaven to the mountain Skoldo’k‘L and settled in Stsk-é’iz.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Raven’s people had many abalone shells, while Alk’ala’lis and his brothers
    had none, so the brothers set out in a canoe to look for shells.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After losing their way on the ocean, the brothers saw a Raven who named himself
    Qa”xaxsila, said he would give them supernatural power, and directed them toward
    a cave.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The brothers covered their canoe with mats and entered the cave; starfishes
    fell from the cave roof but were kept off by the mats.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The brothers emerged near a beach covered with abalone shells, filled their
    canoe, decorated their paddles and hats with shells, received or took names, and
    returned after a year with Raven’s directions.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: On returning home, the brothers found that only Sat!i’/la’s wife had remained
    true; the other wives had taken new husbands.
  category: relationship
  evidence_refs:
  - ev:8
