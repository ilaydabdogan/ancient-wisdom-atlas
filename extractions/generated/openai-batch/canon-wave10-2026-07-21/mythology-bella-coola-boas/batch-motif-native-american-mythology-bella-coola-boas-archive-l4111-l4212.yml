candidate_motifs:
- id: motif:1
  label: Defeat of predecessor followed by transfer of name and equipment
  taxonomy_refs:
  - initiation
  basis: The young man kills Toa’lav’it through the staff, receives his dogs, staff,
    quiver, hat, blanket, and belt, and is told he is now like Toa’lav’it.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage presents a role transfer and renaming, but does not explicitly
    call it an initiation.
- id: motif:2
  label: Magically aided mountain goat hunting
  taxonomy_refs: []
  basis: The woman says the young man’s four arrows will hit goats even if his aim
    fails, and that pointing the staff will produce goats when none are visible.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No broader taxonomy reference is assigned because the passage gives this
    as a specific hunting power.
- id: motif:3
  label: Ancestral descent from heaven or sky to a mountain
  taxonomy_refs:
  - cosmic_mountain
  basis: The Alqla’xl figures are sent down to SqtsL, and Alk’ala’lis with his brothers
    are sent down from heaven to Skoldo’k‘L.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The mountain is an origin landing-place in the passage; the broader cosmic-mountain
    reading should be reviewed.
- id: motif:4
  label: Raven-guided quest for abalone shells
  taxonomy_refs:
  - mystical_quest
  basis: The brothers set out to find abalone shells, become lost, receive supernatural
    power and directions from the Raven Qa”xaxsila, pass through a cave, and return
    with shells.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage depicts Raven as guide and helper here, not as a deceiver.
- id: motif:5
  label: Covered canoe protected during cave passage
  taxonomy_refs:
  - labyrinth_initiation
  basis: The brothers cover their canoe with mats before entering a cave, and the
    mats protect them when starfishes fall from the roof.
  evidence_refs:
  - ev:6
  confidence: low
  cautions: The cave is hazardous and transitional, but the text does not describe
    a labyrinth or formal initiation.
- id: motif:6
  label: Return after long absence and testing of spouses’ fidelity
  taxonomy_refs:
  - return
  basis: After returning from a year’s absence, the brothers find that only the youngest
