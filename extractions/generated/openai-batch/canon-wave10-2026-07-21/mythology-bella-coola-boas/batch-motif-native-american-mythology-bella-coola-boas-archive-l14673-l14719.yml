  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Most deer-fences were intended for capturing deer from late September to early
    or middle December, in mountain areas frequented by deer at that time.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Deer-fences were placed in little valleys or defiles between mountains, especially
    at deer crossings or routes to winter grounds.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The fences were roughly constructed of poles, tree limbs, and similar materials,
