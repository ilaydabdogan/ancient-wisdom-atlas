canonical_text:
  quote: ''
  summary: 'The passage describes Thompson Indian deer-hunting practices: an obsolete
    dog-related practice; moonlight ambushes at salt-licks and drinking places; solitary
    mountain hunting with improvised blankets, kettles, and water-pails; and deer-fences
    built in mountain valleys and crossings to capture deer seasonally.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that an older dog-related deer-hunting practice had fallen
    completely out of use because the old breed of dogs had become extinct, current
    dogs were mostly not useful for deer-hunting, and the law was against the practice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Spences Bridge and Nicola bands, deer were shot by moonlight at
    favored salt-licks during hot summer weather.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hunters concealed themselves in shallow pits screened with bushes, or behind
    available bushes or trees, and waited until deer appeared within range.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Deer were also shot in a similar way at favored drinking places.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Single-handed deer hunting required knowledge of deer habits, knowledge of
    seasonal ground, use of cover, tracking ability, and shooting ability.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some mountain hunters, especially single men, endured winter hardship by carrying
    no food and no extra clothing, living on what they shot, and using raw deerskins
    as blankets.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hunters made rough kettles from spruce-bark or deer paunches, set them in
