  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Deer paunches were sometimes also used as water-pails.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Deer-fences were formerly numerous; remains were still visible in parts of
