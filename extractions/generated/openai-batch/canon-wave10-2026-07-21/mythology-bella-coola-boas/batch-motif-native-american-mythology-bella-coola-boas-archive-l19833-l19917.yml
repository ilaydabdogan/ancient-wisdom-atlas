canonical_text:
  quote: ''
  summary: The passage reports Thompson beliefs about lake apparitions, a tempestuous
    lake appeased with cedar bark, rock paintings attributed to place spirits, dangerous
    or vanishing images, mountain monsters, dwarf-like cliff and forest beings associated
    by some with cedar trees, and another kind of ghost-colored pursuer being.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boat apparitions appear at one end of a lake, row across while speaking French,
    return, and disappear; four men are considered a good omen and eight a bad omen
    associated with sickness or death for the viewer.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A lake at the head of Salmon River becomes tempestuous when people touch its
    waters.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: People appease the tempestuous lake by throwing white inner cedar bark onto
    its waters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some rock paintings, especially on rocks overlooking water, are claimed to
    be made by the spirits of those places.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: One red-painted rock site represented the sun, stars, coyote, wolf, grizzly
    bear, and other figures; its fading is interpreted as a sign that the spirit left
    the place.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: People passing below a cliff painting near Nicola Lake in canoes avoid looking
    at it, because they say looking will immediately cause wind to blow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A painting near Kamloops Lake is ascribed by most Indians to supernatural
    agency, while some say it was painted by Shuswap people to commemorate a victory
    over a Thompson war-party.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Lower Thompsons describe mountain monsters including a white, limbless
    human body that rolls on the ground and cries like an infant; seeing such monsters
    is followed shortly by death.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Some cliff pictures in brilliant colors are said to appear and vanish suddenly.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Upper Thompsons believe in a race of dwarfs inhabiting steep cliffs and
    forests, with pale skins, gaunt bodies, deep-set eyes, and very small stature.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The dwarfs wander in mountains, make sounds such as shouting, groaning, or
    weeping, flee hunters into inaccessible places, and were guardian spirits for
    some Indians.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Lower Thompsons say the dwarfs can become visible or invisible at will;
    some are very small, a few men are very tall, and none are of medium height.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The dwarfs wear clothing like that formerly worn by Indians, have not been
    seen with bows and arrows, and are said not to kill, steal, or chase people.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Some people believe the dwarfs are cedar trees or cedar-tree spirits and that
    they can transform themselves; they are fond of joking and playing tricks.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: A man making a cedar canoe encountered a dwarf with the man's wedge in its
    body; the dwarf told him to paint his face red when making a canoe so that the
    wood would work more easily, and then vanished.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: A dwarf put burnt cedar wood into a sleeping woman; a charcoal trail led the
    people until it disappeared, after which they saw a large piece of charcoal on
    the side of a cedar tree.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: Another kind of naked, ghost-colored, very gaunt being with large protruding
    eyes chases people persistently; a person overtaken faints unless he has great
    mysterious power.
  category: action
  evidence_refs:
  - ev:11
