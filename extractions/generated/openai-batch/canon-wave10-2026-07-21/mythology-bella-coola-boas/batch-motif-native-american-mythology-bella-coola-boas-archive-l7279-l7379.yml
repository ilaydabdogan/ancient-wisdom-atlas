canonical_text:
  quote: ''
  summary: The passage first describes the Olx as initiated in heaven, returning from
    initiation with eagle-voice whistles, entering an ecstatic state, being restrained
    with a blanket, teaching a song, and appearing with mask, dancing-club, red cedar-bark
    rings, and two masked assistants. It then shifts to Boas’s comparative discussion
    of Bella Coola village-community traditions, ceremonial personification of supernatural
    beings, borrowing and similarity among Coast and Athapascan traditions, and neighboring
    clan, descent, crest, and totem systems.
  language: English
  quote_policy: summarized
