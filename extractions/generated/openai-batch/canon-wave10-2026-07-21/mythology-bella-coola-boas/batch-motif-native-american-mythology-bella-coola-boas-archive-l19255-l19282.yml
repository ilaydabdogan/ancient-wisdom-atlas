canonical_text:
  quote: ''
  summary: The passage describes funerary treatment of a deceased person's possessions,
    animals, slaves, and a deceased woman's baskets. Property may be buried, burned,
    damaged, or hung near the grave, on a tree, or in a grave tent. Dogs, horses,
    and sometimes slaves may be killed or buried with the deceased. A woman's carrying
    baskets are damaged and hung near her grave or in a mountain area she frequented.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some property of the deceased was buried in the grave or hung near it, including
    weapons, tools, ornaments, the medicine-bag or guardian spirit, and sometimes
    pieces of birch-bark.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Weapons were sometimes broken or otherwise damaged before being hung on a
    nearby tree or inside a conical tent covering the grave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A deceased person's deer-fence was generally burned, and an heir erected a
    new one in the same place; snares were burned with the deceased or hung near the
    grave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Only a son strong in “medicine” would take possession of his deceased father's
    medicine-bag, weapons, and similar items.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the deceased had dogs, one or more were killed and their skins hung up;
    dogs might be strangled at the grave and hung to a tree or pole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the deceased had horses, some were said to accompany him; their skins were
    hung up near the grave, and horses might be shot or clubbed near the grave and
    left there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the deceased had many slaves, some could be killed at the grave and thrown
    into it, or forced into the bottom of the grave and buried alive before the master
    was placed above them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If a woman died, her root or berry carrying baskets were hung near her grave
    or in a mountain place she had frequented, after a hole was made in the bottom
    or the basket was otherwise damaged.
  category: sequence
  evidence_refs:
  - ev:6
