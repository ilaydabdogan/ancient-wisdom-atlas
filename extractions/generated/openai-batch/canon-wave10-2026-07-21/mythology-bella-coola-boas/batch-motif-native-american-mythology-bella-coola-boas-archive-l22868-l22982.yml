canonical_text:
  quote: ''
  summary: The passage catalogs Salish and neighboring basketry design names and discusses
    how animal and natural forms are represented in conventionalized geometric patterns.
    It focuses on flying-goose, big-horn sheep, rattlesnake-tail, flying-bird, snake-track,
    lightning, and mountain-chain patterns, noting ambiguity where similar zigzags
    may be interpreted differently.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists named designs derived from objects or beings, including
    butterfly, star, packing-strap, zigzag or crooked form, grave-box, and eagle patterns.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lower Thompson design names can be the names of represented objects, including
    animals, body parts, tools, landscape features, and natural phenomena.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author states that correspondents for many patterns, and some additional
    designs, were found among Lillooets and Quinaults.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that animal motives are not predominant among the Salish
    tribes under discussion, compared with certain Coast tribes farther north, but
    are still common and show conventionalization.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Lower Thompson flying-goose pattern is described as representing the flight
    of a goose, with drooping body, raised wings, and adaptation to basket-weaving
    and serial arrangement.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A similar design was said to represent a big-horn sheep, distinguished by
    a downward bend at the ends of the figure indicating horn curvature; no specimen
    was obtained.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Another Lower Thompson design similar to the flying-goose pattern is described
    as doubtful in meaning but said to represent a rattlesnake tail or rattle; closer
    arrangement of units distinguishes it.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: A Yakima bag design was explained as depicting flying birds; a second bag
    with a less advanced version made the meaning clearer, and the more geometric
    form was said to derive by eliminating head and tail.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Snake designs are described as widely used but often indistinguishable from
    other similar patterns.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The typical snake or snake-track pattern among Salish Indians is described
    as a simple vertically arranged zigzag, but the same form may also represent lightning.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage states that identifying the maker’s intended meaning may require
    the artist’s own statement, because authorities do not always agree.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: A horizontal snake zigzag may be identical with a mountain pattern representing
    a mountain chain.
  category: relationship
  evidence_refs:
  - ev:10
