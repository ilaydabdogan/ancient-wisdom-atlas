canonical_text:
  quote: ''
  summary: The Crane pulls a canoe ashore and is told by its chief that, by catching
    it, he has obtained the chief as a supernatural helper. The chief offers an always-full
    box, but the Crane asks for and receives the chief's song, names, and dance. The
    Crane returns home, announces to Raven that he has found supernatural power, and
    instructs Raven to use his mask and transmit the dance to descendants.
  language: English
