canonical_text:
  quote: ''
  summary: The passage describes rites and restrictions for girls at puberty, including
    seclusion, prayers to Dawn, water actions, body-related petitions, painted records,
    food and contact taboos, possible sweat-bathing for shamanic or wisdom aims, and
    disposal of ritual materials. It also describes restrictions on the father of
    a maturing girl and puberty ceremonies for boys according to their desired adult
    roles, with warriors praying to the Sun and others to Dawn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A short girl who wanted to become taller used a high lodge, held a lodge pole,
    addressed Dawn, and blew water four times while asking Dawn to make her taller.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A girl who considered herself tall enough used a low lodge, placed her hand
    on her head, and prayed to Dawn not to grow taller.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A girl who wanted to be thinner or have small feet used water or spittle at
    daybreak and prayed to Dawn for the desired bodily condition.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The girl washed her face and head with decoctions of wild flax stems and flowers
    or young yellow pine tops, said to give fair complexion, smooth skin, and abundant
    hair.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: She removed lice into a hollow plant stem on each of four days, set the stem
    in a stream to float away, and prayed to Day-dawn to be free of lice in later
    years.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: She painted records of offerings and ceremonies with red paint on boulders
    and small stones, including images of fir branches, cross-trails, lodges, mats,
    and men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The painted records were believed to insure long life, and the painted men
    were described as symbolic of her future husband.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Children were forbidden to approach her hut or converse with her because they
    might get sick.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: After four months of isolation, she was allowed to live with the other people,
    help her mother with work, and wash morning and evening.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says that in earlier times isolation lasted more than a year,
    and rare longer training periods could include sweat-bathing for girls who wished
    to be shamans or become wise.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The sweat-house used by such girls was made with four wands or four fir branches
    and heated with four stones.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: After seclusion, the hut was left until it fell down, four branches were thrown
    into water, the girl’s dress was burned on a hilltop, and other clothes were hung
    in trees.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: During training the girl had permitted foods and many prohibited foods, and
    violations were associated with sickness, bewitching, or childlessness in the
    case of bear-meat for a young woman.
  category: other
  evidence_refs:
  - ev:9
- id: obs:14
  text: A man with a maturing daughter was told not to hunt or trap for about a month
    because he would be unsuccessful.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The father was instructed to prepare the first grouse he snared with plant
    roots in the eye sockets and mouth and hang it near his pillow to preserve future
    snaring success.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: 'Boys’ puberty ceremonies depended on their aspirations: future hunters practiced
    hunting and shooting, warriors prayed to the Sun and performed mimic battles,
    and would-be gamblers danced and used gambling-sticks.'
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: Only warriors prayed to the Sun; the other boys prayed to Dawn of the Day.
  category: speech
  evidence_refs:
  - ev:11
