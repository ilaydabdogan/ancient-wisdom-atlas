canonical_text:
  quote: ''
  summary: The passage describes Thompson intergroup hostilities and alliances, including
    exchanges of presents with friendly groups, fighting with Klickitat hunting parties,
    the Fraser River War with white miners, and Kaupéllst offering himself as hostage.
    It then describes women’s beaver-tooth dice game and a men’s stick game using
    carved or painted personal sticks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unidentified party decided not to proceed farther because the people above
    were considered warlike and treacherous and the mountains were extremely rough.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lower Thompsons were friendly with upper bands and the Okanagon, and their
    hunting parties exchanged presents when they met in the mountains.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: When Lower Thompson hunting parties met Klickitat hunting parties, the passage
    says they always fought one another.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In 1858 some Lower Thompsons carried on a desultory war for several months
    with white miners, including an engagement near Boston Bar in which eight or nine
    Indians were killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The quarrel with whites is attributed partly to rough treatment of Indians
    and the killing of an Indian by a white man; natives retaliated by killing whites.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The affair was called the Fraser River War, and Kaupéllst offered himself
    to the whites as a hostage for the good conduct of his people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some men of the upper bands were initially hostile to whites, while leading
    chiefs and most people were friendly.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women played a dice game with beaver teeth tossed onto a blanket or skin;
    each tooth was marked on only one side with carved lines or spots.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The beaver-tooth dice game had specified scoring outcomes depending on whether
    blank sides, faces, triangular-marked dice, the dotted die, or the die called
    the man came up.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Men played another game with sticks made of rounded and smoothed mountain-maple
    wood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The stick sets varied in number; many sticks were carved or painted, sometimes
    with animals or birds dreamed by their possessor, and each man carried his sticks
    in a buckskin bag.
  category: object
  evidence_refs:
  - ev:6
