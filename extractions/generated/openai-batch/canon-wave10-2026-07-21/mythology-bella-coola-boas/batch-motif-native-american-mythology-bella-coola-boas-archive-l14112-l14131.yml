canonical_text:
  quote: ''
  summary: 'The passage describes a method for cooking large quantities of dry roots
    in an earth oven: a circular pit is dug, lined with flat stones, heated with fir
    wood and small stones, layered with damp earth, branches, pine needles, and roots,
    covered with earth, and heated by a fire on top for periods ranging from twelve
    hours to two days depending on the root.'
