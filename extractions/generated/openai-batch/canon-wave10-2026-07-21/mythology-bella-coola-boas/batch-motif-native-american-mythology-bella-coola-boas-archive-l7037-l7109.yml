canonical_text:
  quote: ''
  summary: 'The passage describes the sisau’k: ceremonial as a dramatic presentation
    of clan legend with gift distribution, restricted transmission of secret details,
    and hereditary ownership by chiefs. It explains Bella Coola clan traditions as
    village-community property maintained through endogamy, with newer exogamic practices
    used by wealthy chiefs to gain additional legends. It then describes the ki’siut
    as a religious initiation ceremony personifying heavenly deities and gives an
    opening sequence in which E’xém invites nine brothers and their sister from the
    House of Myths and lies in an elevated room covered with red cedar-bark rings.'
  language: English
  quote_policy: summarized
