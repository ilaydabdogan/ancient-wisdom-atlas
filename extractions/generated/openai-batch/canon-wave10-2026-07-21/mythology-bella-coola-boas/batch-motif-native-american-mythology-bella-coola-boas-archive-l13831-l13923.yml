canonical_text:
  quote: Roots and berries formed an important part of the food-supply, of the tribe.
  summary: 'The passage describes Thompson food procurement: fishing for salmon, trout,
    and other fish; avoiding insects and shellfish; gathering roots and berries seasonally;
    using root-diggers and baskets; taking roots and seeds from squirrel and mouse
    nests; and distinguishing plant use and trade among upper and lower divisions.'
  language: English
  quote_policy: quoted
