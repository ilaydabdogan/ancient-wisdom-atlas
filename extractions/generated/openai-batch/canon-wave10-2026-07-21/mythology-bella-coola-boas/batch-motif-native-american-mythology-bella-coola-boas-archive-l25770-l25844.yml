canonical_text:
  quote: ''
  summary: Archaeological commentary records named consultants' identifications of
    depicted artifacts as tools, ornaments, hunting implements, traps, spindle-whorls,
    and a drinking tube. One note states that, during ceremonies in which young girls
    received their manitous, they were not allowed to use a cup and drank through
    such a tube for one year.
  language: English
