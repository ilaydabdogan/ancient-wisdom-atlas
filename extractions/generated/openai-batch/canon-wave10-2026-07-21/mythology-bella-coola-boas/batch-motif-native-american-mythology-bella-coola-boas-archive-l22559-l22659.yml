canonical_text:
  quote: ''
  summary: The passage is an ethnological comparison of Thompson Indian culture, art,
    manufactures, trade contacts, basketry, weaving, and religious/social organization.
    It emphasizes pictographic decorative art, eastern influence through Nicola Valley
    and Okanagon contact, coastal affiliations in some manufactures, a hypothesis
    about coiled basketry and Athapascan migration, and a general characterization
    of the Thompson as a plateau people receptive to outside influence.
  language: English
  quote_policy: summarized
