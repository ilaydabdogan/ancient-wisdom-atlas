canonical_text:
  quote: ''
  summary: 'The passage describes Thompson childbirth and infant-care practices: beliefs
    about the infant navel-string, rituals for difficult delivery, postpartum washing
    and separation, restrictions around fire, treatment of newborns with bark-infused
    water and pitch, and construction and use of cradles or carriers among Upper,
    Lower, and Upper Fraser Thompson groups.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cradle band could have hanging thongs with fawn hoofs, glass beads, and
    bone beads that made a jingling noise when the cradle moved.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the dropped-off piece of an infant’s navel-string could not be found or
    was lost, it was regarded as a calamity and associated with later foolish behavior
    or being lost while hunting or travelling.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: For a hard delivery, the husband bathed in water, submerged his whole body
    once, ran to the house nearly nude, circled the house four times following the
    sun’s course, entered, and stood at his wife’s head.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After birth, the mother was given a hot drink made from boiled berry-bush
    branches or, among the Lower Thompsons, cedar decoction.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Before delivery, when there was much pain, the midwife rubbed the woman’s
    abdomen and gave her warm water to drink.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says that sending word to all the people before delivery would
    make birth harder, because the child was said to shrink back in response to people’s
    presence or noise and come forward when all was quiet.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Abortion was described as rare; newborn strangling or drowning was also described
    as very rare and socially condemned.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: For a postpartum period, the mother washed each morning in creek water, drank
    herb tea, and remained separated from her husband until the washing period ended.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: For four days after confinement, the woman did not go near the fire, especially
    where food was cooking; if she passed near it, a mat was placed between her and
    the fire, and she was not allowed to cook.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The newborn was washed in warm water in which spruce-bark, balsam-bark, or
    similar materials had been boiled; tamarack-bark was also used and was said to
    make the child strong later.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A newborn could be smeared with black-pine pitch and deer-fat, which was said
    to make the child quiet and not peevish.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Infant carriers were made from birch-bark, coiled basketry, spruce-root, or
    black bear hide, and could include buckskin flaps, a hoop, hanging trinkets, and
    a conduit for moisture.
  category: object
  evidence_refs:
  - ev:10
