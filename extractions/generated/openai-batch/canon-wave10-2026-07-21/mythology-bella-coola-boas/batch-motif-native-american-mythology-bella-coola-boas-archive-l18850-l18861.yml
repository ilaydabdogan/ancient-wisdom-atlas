canonical_text:
  quote: ''
  summary: The passage describes boys whose dreams may resemble their fathers' dreams
    or concern the same guardian spirit. Fathers may give sons skin or feathers from
    the father's guardian spirit to take into the mountains; the object may help the
    boy, who may dream of it until it becomes one of his guardian spirits. Fathers
    also ask about, interpret, and advise on dreams. Many people carry a bag containing
    the skin of a guardian spirit, made from the whole skin of a guardian-spirit bird
    or animal; others carry or wear part of the feathers or skin.
  language: English
