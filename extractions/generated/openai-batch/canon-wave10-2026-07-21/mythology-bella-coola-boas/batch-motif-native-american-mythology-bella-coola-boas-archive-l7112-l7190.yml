canonical_text:
  quote: ''
  summary: The passage describes a winter ceremonial sequence in which messengers
    invite dancers, E’xém and Nusx‘ia’mi perform and lead song, repeated circling
    and jumping occur around the fire and near the door, deities are announced as
    arriving on the roof and then descending, and red cedar-bark offerings and grease
    are given to appease them. It then summarizes Cannibal society initiation traditions,
    including initiation by Ba’exorla in the House of Myths, a sky journey with human
    flesh for food, and a former practice in which a slave was killed as food for
    Ba’exotla and partly consumed by order members before the novice’s departure.
  language: English
  quote_policy: summarized
