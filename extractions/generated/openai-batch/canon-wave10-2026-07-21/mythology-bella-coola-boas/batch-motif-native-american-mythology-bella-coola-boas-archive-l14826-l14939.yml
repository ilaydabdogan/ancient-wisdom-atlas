canonical_text:
  quote: ''
  summary: Ethnographic description of Upper Thompson hunting and fishing practices,
    including small-game snares, bear and other game hunting, a reported grizzly-hunting
    technique using a pointed bone and club, salmon and fish capture with bag-nets
    and drag-nets, and the construction of river platforms and breakwaters for net
    fishing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men of the Upper Thompsons are described as hunting frequently, including
    short winter hunting trips by men otherwise engaged in farming or other work.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hares, squirrels, and grouse are described as being snared in their haunts
    or shot with arrows.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A small-game snare is described as made of Apocynum cannabinum twine, set
    on an animal run, with a loop resting in notches on a trap-stick and a spring-pole
    generally five to six feet long.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bears are described as hunted with bow and arrow, sometimes with dogs, and
    also trapped by deadfalls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Killing a black bear or cougar is said not to be considered a great feat,
    while single-handed killing of a grizzly, especially a silver-tip bear, is said
    to bring high respect for courage.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A past Indian grizzly hunter is described as using a double-pointed sharpened
    bone held in the hand and a stone club.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the described grizzly-hunting technique, the hunter put the hand holding
    the pointed bone into the bear’s mouth when the bear stood up and opened its mouth;
    the closing mouth was pierced, and the hunter then clubbed the bear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that few Indians, except some older men, now trap or snare
    game or fur-bearing animals, and that young men prefer hunting to trapping.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In larger rapid rivers, salmon and other fish are caught with a bag-net made
    of bark twine on a fir or cedar hoop with a long handle.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The bag-net includes horn rings and a string with a small stick handle; when
    the fisherman lets go of the stick, the fish’s weight brings the rings together
    and closes the net mouth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After capture, fish are placed in a circular hole cleared among piled boulders,
    and a small stick or short club is used to kill or handle the fish.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Drag-nets are described as used in winter, spring, and early summer, especially
    in lakes and river pools, and may be left overnight and hauled into a canoe in
    the morning.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Fishermen build platforms at places where fish keep close to shore while ascending
    rapids, and they use stakes and a breakwater to make water rough and foamy so
    the dipped net is better hidden.
  category: setting
  evidence_refs:
  - ev:9
