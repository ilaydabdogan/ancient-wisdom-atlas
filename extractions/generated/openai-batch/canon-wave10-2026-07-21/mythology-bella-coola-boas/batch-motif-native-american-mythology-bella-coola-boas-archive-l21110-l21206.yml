canonical_text:
  quote: ''
  summary: The passage describes shamanic treatment of bewitchment and illness, shamanic
    contests, ritual body painting, fertility treatment, smoking as communication
    with guardian spirits and the spirit-world, recovery of a lost soul from the land
    of souls, treatment of animals, and communal rites in response to a plague seen
    as fog or vapor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A summoned shaman treats suspected bewitchment by sucking disease from the
    patient’s brow, leaving a bleeding mark, and showing a removed bone with bloody
    deer hair.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In some cases the shaman throws the extracted disease toward the west and
    blows at it four times.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shamans contest one another; the one with greater cunning or a more powerful
    spirit may cause the death or bodily distortion of the others.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A shaman may order parts of a patient’s body painted according to dreams or
    instructions from a guardian spirit; the meanings of the designs are known only
    to the shaman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A shaman reputed for treating childless women gives them a specific root to
    eat, paints their upper faces according to dreams, and requires them to promise
    names for their children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before treatment the shaman may smoke from a long pipe hung with eagle feathers;
    smoking is described as communication with the guardian spirit and the spirit-world.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: An explosion in a shaman’s pipe is regarded as a mystery and as an omen, interpreted
    by some as bad and by others as good.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: When a very sick person’s soul is said to have left the body, the shaman wears
    a conical mat mask and acts as though traveling, crossing obstacles, searching,
    talking, and struggling for the soul.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The soul is said to leave through the frontal fontanelle; shamans can see
    it near the body, but lose sight of it farther toward the world of souls.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A soul seen by a shaman in the shape of fog is taken as a sign that the owner
    will die.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: A shaman seeking a lost soul searches the old trail and graveyards, may use
    a shorter trail to the land of souls, and can remain only briefly in that country.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The shaman captures the soul, carries it in his hands, and uses a deer-hoof
    rattle on his foot to repel pursuing souls.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Another described method has the shaman asking for the soul, taking it by
    force if refused, clubbing attacking souls, and returning with a blood-marked
    club.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: After recovering the soul, the shaman places it on the patient’s head to return
    it to the body.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: A plague may be announced by a shaman whose guardian spirit has told him it
    is coming; he sees it as approaching fog or a ground-hugging cloud of vapor.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:16
  text: In response to the plague, people paint themselves like the shaman, join his
    song, dance, bring food, and the shaman sacrifices a small piece of each offering
    to the plague spirit before throwing the offering into a stream.
  category: sequence
  evidence_refs:
  - ev:11
