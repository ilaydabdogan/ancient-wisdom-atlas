canonical_text:
  quote: ''
  summary: 'The passage describes boys'' puberty and guardian-spirit training: dream
    signs initiate a period of running, sweating, cold washing, face-painting, ritual
    equipment, mountain-top night vigils with fire, dance, song, prayer to Dawn of
    the Day, archery practice, later mountain seclusion, fasting, abstinence, and
    bathing.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ceremonial isolation and practice could be extended over years in the mountains,
    where the participant was alone with his guardian spirit while fasting, sweating,
    and praying for knowledge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Boys painted their faces each day according to their dreams and did not show
    the painted design until after obtaining protectors.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Adolescent boys began regular training after first dreaming of an arrow, a
    canoe, or a woman, generally between twelve and sixteen years of age.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boys were made to run races holding bows and arrows until they sweated,
    then were sent to wash in cold water; this was repeated four times on each of
    four successive days.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: During the four days their faces were painted red, and they wore head-bands,
    deer-hoof ornaments, drinking tubes, scratching bones, and aprons with designs
    of future occupations.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the first night the boys went to a mountain-top, lit a fire, and danced
    and sang all night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: On the next three nights they went to the same or a nearby mountain-top, danced,
    sang, prayed to the Dawn of the Day, and fired arrows at targets in the early
    morning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The fire and prayers were connected with requests for long life and health;
    the fire was also described as a signal to all the world that puberty had been
    attained.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Afterward the boys left home at intervals for lonely mountain places, staying
    from a few days to longer periods and living on game they shot.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: On the first return to the mountains, they were expected to stay four days
    and nights, or sometimes eight, to fast, and for two days not to drink.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When at home, they ate sparingly, kept away from the fire, and bathed morning
    and evening in the nearest creek.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: When going to the mountains, they took a water-basket, a fire-drill, and a
    mat.
  category: object
  evidence_refs:
  - ev:8
