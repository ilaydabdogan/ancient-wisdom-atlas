canonical_text:
  quote: ''
  summary: The passage describes Thompson Indian children's games and amusements,
    including string figures, slings, tops, bull-roarers, tobogganing, snow games,
    hobby-horse races, drawing figures, suspended wooden swallows, and a creek game
    with grass balls. It then describes the importance of gesticulation in speaking
    and story-telling and lists hand signs for animals, landscape features, tools,
    actions, times of day, and deer movements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Children’s games included Cat’s-cradle, in which strings were arranged on
    the fingers to form named figures such as animals, dwellings, and human actions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Boys used slings made from Indian-hemp cord or thong with a buckskin piece
    for holding a pebble; the passage says these were used for distance throwing,
    not for hitting or killing.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tops, whirligigs, and bull-roarers were made from wood, bark, pins, strings,
    and holes arranged for spinning or whirring play.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tobogganing was practiced by boys and girls, with former sled substitutes
    including flat stones, planks, birch-bark pieces, and tied fir branches.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Men sometimes used tied fir branches as toboggans to slide down frozen mountain-sides.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Snow amusements included snowballing, making snow men, rolling large snowballs,
    and racing on pole hobby-horses with grass manes and tails.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Children made figures of birds, people, canoes, and other forms on the ground
    with pebbles, stones, sticks, and sand drawings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Boys made wooden swallow figures, suspended them by strings from tree branches,
    and watched them turn in the wind.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In winter, boys floated grass balls called fish down swift creeks while other
    boys tried to spear them from the ice edge with sharp sticks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Gesticulation was described as indispensable to good speaking or story-telling
    among the Thompson Indians.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Some gestures were used as signs between people at a distance or when silence
    was needed to avoid disturbing or frightening game.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The listed signs include hand and finger positions for bear, deer, doe, bush,
