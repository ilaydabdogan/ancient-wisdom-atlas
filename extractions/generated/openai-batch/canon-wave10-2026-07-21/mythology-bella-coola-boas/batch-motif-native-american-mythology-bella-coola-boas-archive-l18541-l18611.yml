canonical_text:
  quote: ''
  summary: 'The passage describes prescribed practices for a girl during menstrual
    isolation and training: regulated combing, drinking, washing, bodily purification,
    prayers to Dawn and fir-branches, use of tree branches and plant materials, making
    miniatures of women’s articles, threshold stepping over fir-branches, restrictions
    on wiping the mouth, face-painting and rattling deer-hoof ornaments, final suspension
    of miniature articles at a trench, and burning preserved menstrual fluid on a
    windy ridge with prayer against prolonged menstruation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The girl uses a four- or five-pronged comb so that menstruation will not last
    longer than that number of days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the fifth morning she receives a new birch-bark cup and continues to drink
    through a tube; drinking from a stream or spring without the tube is said to dry
    up the spring.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the water where she washes, she sucks four mouthfuls through the tube and
    spits each out before drinking through the tube.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: For bodily purity she binds four yellow-pine needles together, pierces the
    flesh of her armpits until it bleeds, and prays that her armpits and skin will
    smell sweet and not become noxious.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some girls wear pads of wild strawberry leaves under the armpits.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some spit four times on a fir twig while praying to Dawn that they will not
    have foul breath.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: At daybreak girls rub their bodies, hands, and heads against yellow-pine trunks
    and pray to Dawn for deliverance from sickness and evil influences.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: When carrying home fir or, among the Lower Thompsons, hemlock branches for
    the hut floor, the girl strokes her back, head, legs, feet, and moccasin-strings
    while praying for endurance and durability.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: She makes moccasins of sunflower leaves and grass and prays that her real
    moccasins will not wear out or burst while travelling.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: She often sets up sticks and fir-branches near trail crossings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The girl is expected to be back in her hut at sunrise and may spend the day
    picking needles from two large fir-branches while praying not to be lazy but quick
    and active at work.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: During training she makes miniatures of articles women commonly make, including
    baskets, mats, rope, and thread, so that later she can make them properly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Four large fir-branches are placed before the hut so she must step over them
    when entering or leaving; they are renewed each morning and the old ones are thrown
    into the creek.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:14
  text: When the branches are removed she prays that she may never bewitch any man
    or fellow-women.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:15
  text: The first four times she goes in or out, she addresses the fir-branches, asking
    them to help her with their power if she steps into trouble or another person’s
    magical spell.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:16
  text: After eating she may not wipe her mouth with her hand, because hair would
    grow around her mouth; she uses cedar-bark or sagebrush-bark kept on a neck string.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: Her comb, scratcher, and drinking-tube may also be attached to the neck string.
  category: object
  evidence_refs:
  - ev:6
- id: obs:18
  text: Each day she repaints her face and wears strings of deer-hoof parts around
    the ankles, knees, and waistband so that they rattle when she walks or runs.
  category: object
  evidence_refs:
  - ev:7
- id: obs:19
  text: Near the end of training she goes at night to a previously dug trench, erects
    poles, and suspends all the miniature articles she made during training.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:20
  text: Some of the first menstrual fluid is preserved in a rag, taken to the top
    of a lofty windy ridge without vegetation, and burned while the girl prays against
    prolonged menstruation.
  category: sequence
  evidence_refs:
  - ev:8
