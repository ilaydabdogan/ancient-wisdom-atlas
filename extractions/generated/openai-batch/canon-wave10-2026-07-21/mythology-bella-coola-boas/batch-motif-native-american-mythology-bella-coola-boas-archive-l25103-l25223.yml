canonical_text:
  quote: ''
  summary: 'The passage describes archaeological finds and burial practices in the
    Thompson River region: incised dentalium shells, carved stone and antler figures,
    in-ground and rock-slide burials, flexed and wrapped bodies, red ochre or paint,
    ornaments and tools buried with the dead, grave-covering structures including
    poles, slabs, mats, boulders, and canoe pieces, dog skeletons near some bodies,
    partly burned children''s bone deposits, unrelated caches, and regional comparisons
    of carved stone objects and burial evidence.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dentalium shells found in a grave at the large burial-place at Kamloops bear
    incised designs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A stone image represents a human head surmounted by a human figure, with a
    conoid hole in the lower forehead, a legless-lizard-like relief on the upper figure's
    back, and a perforation between the throat of the upper figure and the back of
    the lower human figure.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stone image is said to resemble stone carvings from southeastern Vancouver
    Island, the Lillooet Valley, Yale, the Columbia River region, the Gulf of Georgia,
    and Puget Sound, and may have originated under the influence of cultures from
    those districts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: An antler tip is carved to represent the head and neck of a bird, with mouth
    furrows, drilled cone-shaped eyes, and charring.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dead were buried a short distance from villages, and no burials were found
    in pits marking underground house sites.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: In most ground burials, bodies were placed about three feet deep with knees
    drawn up to the chin; some bodies appear to have been wrapped in fabrics or mats
    and tied with cords.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Traces of red ochre and other paints appear on bones and surrounding earth,
    and bodies were decorated with ornaments and buried with tools.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some pouches near bodies contained arrow-making tools and gambling implements,
    while graves of women contained tools such as mat-making needles and awls.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Some graves were surrounded by poles or slabs of wood, apparently forming
    small tents over bodies; one Kamloops grave was surrounded by broken canoe pieces
    arranged like a conical tent.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Three graves near Nicola Lake were covered with boulders and are described
    as recent in origin.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: In Nicola Valley rock-slide graves, skeletons were usually placed on the back
    with knees doubled up and heads toward the east.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Nicola Valley graves contained large nephrite celts, copper pendants, and
    a necklace, and were covered by disturbed rock-slide material, with rocks, poles,
    branches, or a mat-covered tent marking or covering graves.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: Near some Nicola Valley bodies, dog skeletons were found, and dog bones and
    nearby rocks showed red ochre coloration.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: At the Government Site near Kamloops, small masses of children's bones were
    found partly burned, with bone beads and chipped cache forms of glassy basalt.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: Caches near Kamloops contained glassy basalt, hammer-stones, bone awls, needles,
    sap-scrapers, and similar items, and these caches were not associated with graves.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: The passage concludes that finds from Kamloops, Spences Bridge, and Nicola
    Valley corroborate conclusions from Lytton and indicate a broadly uniform ancient
    culture in the southern interior of British Columbia.
  category: relationship
  evidence_refs:
  - ev:8
