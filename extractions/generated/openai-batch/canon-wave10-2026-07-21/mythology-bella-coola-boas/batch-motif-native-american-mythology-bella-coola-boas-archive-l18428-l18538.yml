canonical_text:
  quote: ''
  summary: 'The passage describes ceremonies and restrictions for a girl during a
    ritual isolation connected with monthly periods: digging trenches, using fir branches
    and stones, fasting and drinking through a bird-bone tube, wearing fir-branch
    clothing, praying to the Dawn, bathing at water, discarding stones and branches
    to avert disease, and receiving limited food from parents or guardians.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes a girl in a restricted period that includes a first
    four days and nights and a later period of isolation.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:2
  text: She digs trenches near a trail, parallel to it and on the lower side; the
    excavated dirt is thrown on the lower side of the ditch.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The trench ceremony is said to be believed to shorten the duration of her
    monthly periods.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: At each end of the trench she may plant a fir-branch, the digging stick, or
    a root-digger, or place smooth painted stones or small unpainted stones.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: She wipes her eyes and face with small fir-branches, and after the ceremony
    the branches are hung on a tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The ceremonies are repeated for four nights or mornings in succession, four
    times each morning, while she supplicates the Dawn of the Day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:7
  text: Some nights she goes to lonely mountain places, dances, asks spirits to pity
    and protect her during her future life, and sleeps there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:8
  text: During the first four days and nights she does not wash, fasts, and is allowed
    only a little water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: Her drinking-water is kept in a red-painted birch-bark cup, and a new cup
    is given each day for the first four days and thrown away at night.
  category: object
  evidence_refs:
  - ev:2
- id: obs:10
  text: Her mouth must not touch the water surface, so she drinks through a tube made
    from the leg of a crane, swan, or goose.
  category: action
  evidence_refs:
  - ev:2
- id: obs:11
  text: During the first four days she wears a rough conical head-dress of small fir-branches,
    and some girls also wear sleeveless fir-branch shirts or tunics.
  category: object
  evidence_refs:
  - ev:3
- id: obs:12
  text: At the bathing place she places the head-dress on four tree-stumps one after
    another and prays to the Dawn for generosity from herself and from her friends.
  category: action
  evidence_refs:
  - ev:3
- id: obs:13
  text: In another morning ceremony she runs four times with two small stones from
    under the water in her bosom; the stones fall out as she runs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: While running with the stones she prays to the Dawn that childbirth may happen
    as easily as the stones are delivered from her clothing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:15
  text: After the first four days she may eat, wash, lie down, and comb her hair,
    and her parents or guardians feed her sparingly.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: Part of the first four scanty meals is buried beneath where she sits, at the
    crossing of two trails, or at both places, so that she will not lack a little
    food or drink later in life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: She goes to water, preferably a spring, carries four stones in her bosom,
    spits on them, and throws them one at a time into the water while praying that
    disease leave her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: She washes and bathes by drawing a fir-branch, or among the Lower Thompsons
    sometimes a hemlock-branch, over each part of her body four times while praying
    to the Dawn for freedom from disease or pain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:19
  text: After addressing the Dawn about sickness leaving her body, she tosses the
    branch away between her legs and backward.
  category: action
  evidence_refs:
  - ev:6
- id: obs:20
  text: In washing she does not touch her body with her hands but uses a brush made
    of fir-boughs dipped into the water.
  category: object
  evidence_refs:
  - ev:6
- id: obs:21
  text: After the first four days some girls put on knee-length buckskin aprons with
    pictures painted in red paint.
  category: object
  evidence_refs:
  - ev:7
