canonical_text:
  quote: ''
  summary: The passage describes shamanic attire and ritual equipment, the use of
    albino deer skin as an object of mysterious power, diagnosis of sickness through
    guardian spirits and dreams, omens of a patient's death, and curing procedures
    involving red paint, incantations, water, fire, songs, imitation of spirits, gestures,
    dance, blowing, hand passes, and sucking out and displaying disease material.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The shaman may wear a mat mask over the head, deer-hoof strings around knees
    and ankles, and items made of albino deer skin, which is described as possessing
    mysterious power.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shaman does not accept payment for the first patient treated.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some shamans ascertain the cause of sickness after guardian spirits enter
    their chests; if one spirit does not provide information, another may be called.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a guardian spirit refuses to enter the shaman's body and jumps back, this
    is described as a sure sign that the patient will die.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After seeing the patient, the shaman declares the nature of the disease and
    generally says the knowledge was gained through previous dreams.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The curing procedure includes painting the hair and sometimes the hands and
    chest red, removing robe and shirt, and using incantations to expel disease from
    the patient.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The shaman keeps water in a small basket, puts it into the mouth, and sprays
    it over or in front of the patient's body; some shamans are said to alter or boil
    the water by supernatural means.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some shamans keep a small fire near them and swallow glowing embers and burning
    sticks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: During treatment, some shamans dislike yawning, head-scratching, or noise
    because these are said to interfere with the spell.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The shaman sings a song given by the guardian spirit and may imitate the spirit
    by voice and gesture or converse with it in speech not easily understood by listeners.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The shaman may gesture, dance with jerking and jumping motions, blow on the
    patient's body, and make repeated hand passes over it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After invoking spirits through songs, some shamans remove disease by sucking
    and, if successful, show it to people by spitting it out; the disease may appear
    as deer-hair, and the passage begins to mention blood as another form.
  category: sequence
  evidence_refs:
  - ev:7
