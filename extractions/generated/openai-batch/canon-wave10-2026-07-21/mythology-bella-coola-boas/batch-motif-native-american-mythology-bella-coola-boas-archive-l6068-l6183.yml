canonical_text:
  quote: ''
  summary: Raven assigns uses of animal skins, hair, and meat and teaches ceremonial
    practices. In the following Deer episode, Deer and his son T’o’pewas travel by
    canoe to gather fuel. A strange canoe with two men and a woman passes; after one
    man says T’o’pewas is good to eat and Deer insults them, the woman Nutsekoa’lsik-an
    persuades her companions to return. They kill and eat T’o’pewas. Deer grieves,
    questions objects in his canoe, and learns from a knot-hole what happened. He
    reaches a village feast, sees his son’s blanket, is invited to dance, obtains
    shell knives as dance gear, and begins a dance around the fire that he says will
    make the people sleep.
  language: English
  quote_policy: summarized
