canonical_text:
  quote: ''
  summary: The passage describes Thompson funerary payment practices, mourning customs,
    war-party actions associated with grief among the Spences Bridge band, Lower Thompson
    grave boxes and grave figures, secondary treatment of bones, and later adoption
    of burial under missionary and white influence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a payment occasion, a speaker stands, exhibits each article, and makes
    a speech with each payment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Relatives of the deceased sit in a circle before the assembly, sometimes on
    the opposite side of the fireplace, while their speaker stands near them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Male relatives smoke a large pipe that is passed around in the direction of
    the sun, and an old man refills it when empty.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Relatives of a deceased person may pay horses, blankets, money, guns, other
    goods, and food costs; the passage says people prefer not to appear mean or stingy
    in such payments.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The buckskin thongs worn by widowers are cut after the festival.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Among the Spences Bridge band, male relatives of a deceased adult may set
    out on the war-path after burial and mourning, saying they will wipe away their
    tears.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Spences Bridge war party does not return until one or more enemies, generally
    Lillooet, have been killed, after which the participants resume ordinary life.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Such war parties may include nearest male relatives and outsiders; if a stranger
    is among them, someone may kill him and perhaps bury his body in or over a recent
    relative's grave as a funeral offering.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Lower Thompsons are said to have formerly buried their dead, but for many
    generations placed bodies in large square painted and carved cedar boxes with
    lids, supported by painted and carved posts.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each cedar box belongs to a family or group of families, may contain many
    bodies, and a new box is made nearby when the old one is full.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Poles and grave figures are placed around the boxes, with clothing and other
    offerings attached; an attached article may be removed if replaced by a similar
    article of inferior quality.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Streamers fly from the tops of poles as a token of respect to the deceased.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Some old burial places consist of stagings on poles or posts, with bodies
    wrapped in cedar-bark mats in a sitting position and deposited in boxes or on
    the stagings.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: One grave figure near Boston Bar is described as a colossal man-shaped figure
    with a hole in its back large enough for a person to squat inside, used as a receptacle
    for the dead while awaiting burial.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Lower Thompsons also put carved wooden figures of birds and sometimes
    quadrupeds at graves instead of the usual human grave figures.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: Grave figures are made in solitary places; if they are seen before completion,
    the artists are said not to be able to finish them properly.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Bones of a deceased relative are frequently taken up, bundled, and re-covered
    with new material, with a large feast often given on such occasions.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: Under missionary and white influence, the Lower Thompsons have adopted burial,
    removed old grave boxes, and buried their contents; in some recent house-shaped
    boxes, bones were buried inside.
  category: sequence
  evidence_refs:
  - ev:10
