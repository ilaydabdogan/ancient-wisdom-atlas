canonical_text:
  quote: ''
  summary: 'The passage describes several Thompson games: a gambling-stick guessing
    game using deer-skin mats, dry grass, ring-marked sticks, pointers, fourfold tapping
    and sunwise movement; a men''s running ring-and-spear game with marked scoring;
    a seated ring-and-stick variant; and the beginning of another ring game played
    by children and sometimes adults.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the gambling-stick game, two players kneel opposite each other, each with
    a deer-skin gambling-mat and a bundle of dry grass.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first player places a ring-marked stick and another stick on his mat,
    then moves them to the hidden near end of the mat and rolls each in dry grass
    until covered.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The other player uses a pointer to tap each covered stick four times, move
    the covered sticks four times following the sun's course, and separate one stick
    to the edge of the mat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first player loosens the grass around the separated stick, returns it
    to the center of his set, shakes the sticks near his ear, and throws them down
    one after another.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The outcome is determined by whether one or both ringed sticks appear among
    the thrown sticks, and the stake is valued in counters.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each player has his own set of sticks, mat, and pointer, and songs often accompany
    the gambling-stick game.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The designs on the illustrated gambling-stick set include man, screw of ramrod,
    Snake, Wolf, Otter, Eagle, Grizzly bear, unnamed sticks, and unmarked sticks.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A men's ring game uses a buckskin-covered ring filled with sand; a player
    rolls it, runs after it, and throws a small spear so that the ring falls on the
    spear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ring game's points are determined by light and dark marks, beads, or earlier
    porcupine-quill marks on the ring; a ring standing against the stick counts forty,
    the highest score.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A seated variant uses the same ring and throwing-stick and the same scoring,
    with players sitting face to face and rolling the ring from one to the other.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Another ring game is generally played by boys and girls, occasionally by adults,
    outdoors or in winter houses during cold weather, using a larger ring made of
    pliable sticks, bark, dry grass, or reeds.
  category: setting
  evidence_refs:
  - ev:8
