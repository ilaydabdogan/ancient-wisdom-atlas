canonical_text:
  quote: ''
  summary: 'The passage describes Thompson fishing methods: bag-net salmon fishing
    from moored canoes or rock stations, long-handled nets, shore spearing with detachable
    or fixed barbed spear-heads, torchlit canoe spearing for large trout, seasonal
    spring fishing near the Nicola River with platforms and a weir, and winter spearing
    through holes in the ice.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bag-net fishing may be done from moored canoes without a platform, though
    the hauls are described as lighter than platform hauls.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes night fishing on the clear Thompson River from daytime
    fishing on the muddy Fraser River.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rapid Fraser River water and low rock points are described as favorable conditions
    for catching salmon close to the banks.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Long bag-net handles are used where fishermen stand above the water, and fishing
    platforms are uncommon where suitable rocks are plentiful.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: One shore spear has a long handle, two prongs with inward-pointing barbs,
    and detachable barbed points connected by a line for hauling the fish ashore.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Another spear type has one long barbed point and may be used with a very long
    handle to thrust through fish from rocks or from some distance off shore.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: In still water, fish are speared from canoes at night by torchlight, especially
    large trout.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Each spring around April, the Spences Bridge band gathered near the mouth
    of Nicola River to catch large trout, using platforms and a weir across Nicola
    River.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Large numbers of men from the Nicola and Lytton bands fished at the same spring
    site, with many tents present at named locations.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: A three-pronged spear for trout has two long barbed prongs and a shorter central
    sharp point; former materials included firwood and deer-antler, with iron later
    substituted for the barbs.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Fishing-canoe crews consist of at least three or four men wearing masks or
    eye-shades, with one steering, one holding a torch, and harpooneers standing on
    each side.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Very cold weather with running ice is considered favorable for canoe spearing,
    while muddy Fraser River water prevents fish from being seen by the Lower Thompsons.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: In winter, fish are speared through ice holes; the spearman shades his head
    and shoulders with a blanket or mat, and no bait is used.
  category: action
  evidence_refs:
  - ev:7
