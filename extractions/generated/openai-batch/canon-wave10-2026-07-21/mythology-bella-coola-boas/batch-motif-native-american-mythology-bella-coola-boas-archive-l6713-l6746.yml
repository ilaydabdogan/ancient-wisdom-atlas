canonical_text:
  quote: ''
  summary: A youth seeking a supernatural being stays in the mountains and discovers
    a clear spring visited by a man later identified as Killer Whale. After the youth
    explains his ugliness and rejection by wives, Killer Whale makes him drink well
    water, induces vomiting of fish matter, transforms his hair and skin with water
    and hemlock twigs, gives him a new name, and adorns him with bear-skin, eagle-down,
    and red cedar-bark.
  language: English
  quote_policy: summarized
