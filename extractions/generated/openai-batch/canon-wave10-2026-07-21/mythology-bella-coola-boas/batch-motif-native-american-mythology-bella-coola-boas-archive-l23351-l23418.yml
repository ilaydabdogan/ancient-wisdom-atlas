canonical_text:
  quote: ''
  summary: 'The passage describes Salish basketry designs: mountain-and-lake forms,
    a Quinault wave pattern derived from canoe-made water ripples, zigzag lightning
    designs that may be confused with snake and mountain designs, a Lower Thompson
    zigzag ladder design referring to subterranean lodges, and a private semi-sacred
    dream design. It concludes with a discussion of realistic forms becoming geometric
    representations and notes parallels in nearby northern tribes and elsewhere.'
