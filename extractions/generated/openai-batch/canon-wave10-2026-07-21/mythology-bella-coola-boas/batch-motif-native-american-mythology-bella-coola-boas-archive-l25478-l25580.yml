canonical_text:
  quote: ''
  summary: 'The passage describes archaeological burials and finds near Kamloops,
    the Nicola Valley, and Nicola Lake: bodies placed in flexed positions, some in
    pole or tent-like structures with matting, wrappings, red ochre, ornaments, tools,
    and other associated objects, plus caches and child burials covered with boulders.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One Kamloops burial contained a probable woman about twenty years old lying
    on her left side with head toward the east and legs slightly flexed; the body
    was wrapped in red-ochre-daubed fabric and skin and bound with cords.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same burial included dentalia, shell beads, copper beads, tooth pendants,
    and a fabric bag containing beaver-tooth dice, bone needles, an iron awl in a
    bone handle, bone tubes, basalt chips, a bone pendant, bearberry seeds, and other
    bone objects.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The iron awl in the first described grave is identified in the passage as
    the only object from that grave showing contact with whites.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another Kamloops burial had poles placed around the body in a space about
    three feet in diameter, with burned-off tops; the skeleton was a woman about thirty
    years old with head to the west, knees flexed to the chest, and arms flexed.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The pole-enclosed Kamloops burial included small mammal bones, a birch-bark
    dish over the thighs, woven vegetable-fibre wrapping, cat-tail matting, wood pieces,
    a chipped basalt knife, a bone awl, stone and bone fragments, a beaver tooth,
    a whetstone, and chips.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Two shallow caches in shifting sand contained flakes and tools or possible
    tools made of glassy basalt, hammer-stone pebbles, slate or whetstone pieces,
    and bone pieces.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nicola Valley Grave 1 contained an old woman in a pole tent about seven feet
    long, covered with cat-tail mats; the skull was south, the face east, the body
    was on its back with closely flexed legs projecting upward, and no objects were
    present.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nicola Valley Grave 2 had a similar body orientation and flexed-leg position
    and included a broken nephrite celt, rubbed stone, fresh-water unio shell, chipped
    pieces, chipped points, and a chip of glassy basalt at the right side.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Near the mouth of Nicola Lake, skeletons of two children were found eighteen
    inches deep in a pocket of black soil, with the top of each grave covered by five
    or six boulders.
  category: setting
  evidence_refs:
  - ev:7
