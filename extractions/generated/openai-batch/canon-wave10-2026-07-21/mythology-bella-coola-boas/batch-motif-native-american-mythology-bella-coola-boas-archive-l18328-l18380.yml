canonical_text:
  quote: ''
  summary: 'The passage describes Thompson beliefs and ceremonies surrounding twins
    and the grisly bear: twins are protected by the bear, linked with special powers,
    and treated through singing, red paint, fir branches, sunwise circling, seclusion,
    washing, and elder-first order. It then introduces puberty ceremonies for boys
    and girls, including immediate separation of a girl at puberty.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Twins are said to be endowed by the grisly bear with special powers, including
    making good or bad weather, and to be unable to see a grisly bear; the bear is
    described as their protector rather than their real father.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When twins first cried, the father could select a young man to sing; the selected
    man was believed to become proficient in the mystery of the grisly bear, obtain
    the bear as guardian spirit, and become unable to see the bear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The selected singer wore a bark headband with eagle or hawk feathers, painted
    his whole face red, and held fir branches; for male-and-female twins, he held
    a male branch in the right hand and a female branch in the left.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the children’s crying, the singer went four times around them following
    the sun’s course, sang the grisly-bear song, and struck the children with sex-matched
    branches, always striking the elder first.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the ceremony the parents’ faces were painted red; the grisly-bear painting
    was a red bear paw on each cheek, and a red human hand impression could represent
    a bear in facial paintings.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The singer sometimes stayed with the twins during the parents’ period of separation,
    washed them, sang over them, and kept two sex-corresponding fir branches near
    their pillows, as did the parents.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The mother always suckled the elder twin first; the passage states that if
    she did not, one of the twins would die.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After twin births, the parents moved away from other people into a lodge made
    of fir boughs and bark until the children were about four years old.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: During this period the twins were carefully bathed, washed with fir twigs
    or boughs dipped in water, and kept from contact with other people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: During washing, the father described circles around the twins with fir boughs
    while singing the grisly-bear song.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A male passing a lodge where twin children lived whistled, called from a distance
    by whistling if he wanted to see someone, and did not enter.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Many ceremonies were performed when boys and girls reached puberty, generally
    to make them healthy and successful in their future occupation; a girl at puberty
    was immediately separated from other people.
  category: sequence
  evidence_refs:
  - ev:9
