  summary: 'The passage gives ethnographic notes on Thompson standards of personal
    beauty and stereotypes applied to neighboring peoples, then describes Thompson
    subsistence: staple foods, seasonal movement through mountain hunting and gathering
    grounds, managed burning for roots, divisions of labor, changes in animal abundance,
    traded dried meats, and salmon fishing in Fraser and Thompson Rivers.'
  language: English
  quote_policy: summarized
