  text: Deer, salmon, roots, and berries are named as former staple foods; deer is
    described as more important for the upper division and salmon for the lower division.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A large portion of the tribe formerly lived in the mountains for much of the
    year, moving between root-digging and deer-hunting grounds according to harvest
    times and seasonal deer movements, and returning to winter houses when winter
    began.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that people sometimes set fire to woods to increase roots
    on burned hillsides; men hunted and trapped, while women gathered and prepared
    roots, berries, and other food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A current tradition reports changes in deer, elk, mountain-sheep, and mountain-goat
    abundance over time, including the disappearance of elk and the finding of old
    elk antlers in mountain and plateau areas.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage lists many animals whose meat was eaten and says dried meat from
    moose, buffalo, antelope, and caribou was obtained by trade because those animals
    did not occur in the Thompson habitat.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Lower Thompsons are described as hunting chiefly mountain-goat, black
    bear, and marmot, and as eating rock-rabbit, which the upper band did not use
    as food.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Five varieties of salmon are said to run in the larger rivers in fall; salmon
    are described as the principal fish, with differing abundance and varieties in
