  text: The passage records Thompson opinions about personal beauty and bodily features,
    including a table contrasting pretty, fairly pretty, and ugly traits.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lillooet are said to be ridiculed for low stature and obesity, while Coast
    tribes of the Fraser River delta are stigmatized with labels tied to head deformation,
    nose shape, and lack of moccasins.
  category: relationship
  evidence_refs:
  - ev:1
