canonical_text:
  quote: ''
  summary: 'The passage describes Thompson Indian manufactures: materials used for
    implements and utensils, a division of labor by type of work, specialist exchange,
    stone-working techniques, arrowhead production from bowlders, use of antler and
    later iron flakers, and stated comparisons to prehistoric Lytton stone work and
    Carrier flake-holding methods.'
  language: English
  quote_policy: summarized
