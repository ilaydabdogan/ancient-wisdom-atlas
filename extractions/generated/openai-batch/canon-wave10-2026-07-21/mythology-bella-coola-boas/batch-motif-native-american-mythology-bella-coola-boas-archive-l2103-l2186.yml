canonical_text:
  quote: ''
  summary: The passage explains a sequence of Bella Coola and nearby facial paintings
    and tattoo designs, identifying represented clouds, sky effects, animal forms,
    ritual blood, a monster, a fish-net, mourning tears, and a sea-otter tattoo associated
    with a post-Deluge landing. It concludes that similar or identical geometric decorations
    can signify different objects and that decorative constraints encouraged geometric
    and color-symbolic forms.
  language: English
  quote_policy: summarized
