canonical_text:
  quote: ''
  summary: The passage describes a post-ordeal feast and a flogging custom for children,
    with stated aims of transferring influences, building courage, testing boys' character,
    and aiding recovery from battle wounds. It then describes beliefs and rites surrounding
    twins, including repeated grizzly-bear dreams before birth, special names for
    twins, and a father's post-birth circuit around the house while striking the ground
    with a fir-bough and singing a grizzly-bear song.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The morning after the ordeal, the old man who had given the thrashing invited
    all people of the winter house, especially the children, to a feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports a belief that if the flogger struck children with the
    same whip used on a woman, evil influences from the woman would be transferred
    to the children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: One stated reason for the custom was to help children overcome bashfulness,
    become courageous, and endure great pain without fear or flinching.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ceremony was also said to reveal boys' character; a boy who stepped forward,
    raised his arms, and accepted flogging would be a good warrior.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Those who had undergone flogging were believed to recover quickly if shot
    or hurt in battle; the custom was said to have gone out of use within the previous
    fifteen years.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: A woman about to deliver twins was generally made aware beforehand by repeated
    appearances of the grizzly bear in her dreams.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Twins were regarded as different from other children and were called grizzly-bear
