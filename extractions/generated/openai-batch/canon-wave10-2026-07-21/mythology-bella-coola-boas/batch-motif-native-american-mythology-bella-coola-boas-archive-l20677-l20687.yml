  quote: ''
  summary: 'The passage describes lengthy ceremonial training for shamans, including
    a Lower Thompson rite in which a shaman seeking a dead person as guardian spirit
    uses a skull at a private sweat-house and prays to the deceased soul for knowledge.
    It also lists favorite guardian spirits of warriors: sun, thunder or thunder-bird,
    water, and mountain tops.'
