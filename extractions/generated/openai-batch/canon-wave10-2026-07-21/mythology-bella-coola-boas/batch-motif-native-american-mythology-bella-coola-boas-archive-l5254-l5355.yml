canonical_text:
  quote: ''
  summary: 'The Sun repeatedly tries to kill his son-in-law: first by making him fall
    into boiling river water at a salmon-weir, then by trapping him under sea ice
    after sending him to retrieve a hammer. The young man survives by changing into
    salmon or fish form and returns in human form. He later catches a singing bird
    and instructs it to peck out the Sun’s eyes while the Sun sleeps.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sun calls his son-in-law to raise the trap of his salmon-weir and takes
    him upriver in the Sun’s canoe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The river water is boiling; the Sun rocks the canoe, and the young man falls
    from the weir beam into the water and whirlpool.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sun returns home and tells his daughters he lost his son-in-law in the
    river; the daughters are sad.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: After disappearing in the water, the young man is carried to Nuskya’xék, takes
    salmon shape in the water, resumes human shape on land, and returns to his wife.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Sun next takes the young man to split a submerged snag, drops his hammer
    into the water, asks the young man to dive for it, and promises him supernatural
    power if he retrieves it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the young man dives, the Sun orders the sea to rise and calls cold wind
    so that a thick sheet of ice forms over the sea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The young man finds the hammer but cannot break through the ice; he finds
    a narrow crack, changes into a fish, escapes, and resumes his own shape.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The young man returns the hammer by throwing it against the Sun’s stomach
    and warns the Sun to stop trying to kill him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Sun says he wants a singing bird; the young man recognizes it as sku’laten,
    shoots one wing, and catches it alive.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The young man tells the bird that the chief has tried to kill him and instructs
    the bird to peck out the Sun’s eyes while the Sun sleeps.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Sun places the bird near his face at night; while he sleeps, the bird
    pecks out his eyes, and in the morning he says the bird has blinded him.
  category: sequence
  evidence_refs:
  - ev:6
