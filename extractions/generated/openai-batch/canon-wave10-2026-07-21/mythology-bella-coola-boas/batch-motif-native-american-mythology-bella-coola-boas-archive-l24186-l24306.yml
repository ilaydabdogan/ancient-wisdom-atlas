canonical_text:
  quote: ''
  summary: 'The passage describes archaeological finds from the Thompson River region:
    pebbles used as hammers or possible club-heads, notched pebbles possibly used
    as sinkers or balls, stone celts made of green stone or nephrite, a possible antler
    handle, and reported techniques for cutting and polishing nephrite.'
  language: English
