canonical_text:
  quote: ''
  summary: The passage explains how conventional designs on ceremonial implements,
    tools, and weapons can represent dreams, landscape features, foods, animals, or
    other objects. It notes that accompanying figures, object use, and placement can
    determine the meaning of otherwise ambiguous designs, including examples involving
    a lake and river, basket and ladle, water-snakes, rattlesnakes entering a den,
    trees, a hunter, dogs, and a feather-decorated warrior.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In ceremonial implements, some designs represent the dreams of the owner.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Accompanying figures can define the significance of an ambiguous design.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: On a pipe stem, a circle with a long line signifies a lake and a river flowing
    into it, with beaver and otter figures running toward the river helping determine
    that meaning.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: An almost identical design on tongs represents a basket and ladle rather than
    a lake and river.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A figure of conventional designs includes signs for trails, fir-branches used
    in girls' puberty ceremonials, basketry or fir-branch piles, matting, a trench,
    an underground house with ladder, grave-poles, bear tracks, a loon, connected
    lakes and river, cascade, mountain with lake and gulches, sun, star, rainbow,
    mountains and valleys or snake track, and lightning.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: In some cases, the use of an implement determines a design's significance
    even when the object's form or conventional sign is not reproduced.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The red ornament on a stirrer represents food: the red tip signifies salmon,
    middle lines signify roots, and red on the handle signifies trout.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: On tongs, red at the end represents the spring from which water is obtained,
    and lines on the back represent water-snakes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the inner side of a bow, two rattlesnakes are represented by red zigzag
    bands and white cross-lines for the tails, crawling into a den represented by
    a red band in the middle of the bow.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Another bow represents a hunter and two dogs, a warrior decorated with feathers,
    red ends as trees, and four lines on one end as wood-worms.
  category: object
  evidence_refs:
  - ev:6
