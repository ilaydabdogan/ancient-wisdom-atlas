canonical_text:
  quote: ''
  summary: The passage describes Thompson sewing, embroidery, basketry, and mat-making
    materials and techniques, including changes in embroidery materials, bark and
    coiled cedar basket construction, gendered basketry labor, ornamentation methods,
    regional similarities in basket forms, and tule or bulrush mat construction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Needles, thorns, bark thread, deer-sinew, buckskin, porcupine quills, horsehair,
    beads, and silk thread are listed as sewing or embroidery materials, with silk
    thread said to have largely replaced bead embroidery after 1858.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Basketry-making is described as an important industry among the tribe, and
    above Lytton baskets of various shapes were made of birch-bark, with spruce-bark
    used for the largest baskets.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bark baskets are described with stitched edges of split spruce or poplar roots,
    a rim strengthened by split willow-twigs, and ornamentation by stitches, incised
    designs, or red painted designs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lower division of the tribe and the Upper Fraser division are said to
    make coiled basketry of cedar-twigs, and the same type is associated with several
    neighboring groups.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Only women and girls are said to occupy themselves with the described coiled
    basketry work.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cedar roots are dug, cut, buried to keep fresh, peeled or scraped, dried,
    and split with a deer-bone awl into strips used for stitching and for forming
    coils.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Coiled baskets are made by laying coils one above another and whip-stitching
    them; most of these baskets are described as water-tight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Basket ornamentation is made by hooking strips of grass and bark into the
    stitches, and the passage describes whitening grass and darkening Prunus bark
    by burial in damp earth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Large open-work cedar-twig baskets are used by the Lower Thompson Indians,
    are unknown on the upper courses of the rivers, and are described as being of
    the same make as coastal baskets.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Upper Thompson Indians make mats from tule and bulrushes, woven or sewn
    with bark twine.
  category: action
  evidence_refs:
  - ev:8
