  text: The passage states that reduced pride, interest in games, athletic exercises,
    and fun are attributed chiefly to disease and knowledge of expected extinction,
    with changes of pursuits and new ideas also contributing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The people are described as socially and otherwise in transition from past
