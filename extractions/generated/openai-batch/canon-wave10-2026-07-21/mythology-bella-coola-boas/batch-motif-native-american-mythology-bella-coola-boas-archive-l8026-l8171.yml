canonical_text:
  quote: ''
  summary: 'The passage is an archaeological and material-culture description of Lytton-area
    finds: animal bone, teeth, antler, shells, skins, vegetable materials, grave and
    hearth deposits, dentalium-shell trade routes, and chipped stone points or forms
    used or found in relation to hunting, fishing, and root-digging.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Animal bone was made into awls, scrapers, adzes or chisels, needles, pendants,
    knife-handles, and related implements; no suitable bone arrow-points were found.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Elk teeth, small carnivore teeth, woodchuck teeth, beaver teeth, and antler
    were made into ornaments, dice, knife points, wedges, harpoon-points, digging-stick
    handles, war-clubs, daggers, and carved figures.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Animal skins were used for garments, with preserved portions found; animal
    bones are said to indicate possible use of fine skin garments.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Several shell types were made into spoons, beads, tassels, pendants, and rattles.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that present dentalium-shell trade did not come along the
    Fraser River but from north of Vancouver Island over the mountains to the upper
    Fraser, with trade in the hands of the Chilcotin; the same prehistoric route is
    described as probable.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Charred wood, other charred fragments, copper-wrapped wood, and birch-bark
    were found in village-sites and graves.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Charred berries and Lythospermum seeds were found in hearths, and large numbers
    of the seeds were sometimes found over skeletons in graves.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: A gum resembling fir or pine gum was found in a clam-shell spoon and on a
    bone knife handle; woven vegetable fiber and red-cedar bark string were found
    in graves.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Many food-procurement implements were found, especially chipped points for
    arrows, knives, and spears, commonly made from glassy basalt.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Small chipped objects described as fantastic forms were found; some were of
    glassy basalt and one described specimen was daubed with red ochre.
  category: object
  evidence_refs:
  - ev:9
  - ev:12
- id: obs:11
  text: A large translucent brown chalcedony point is described as one of the most
    beautiful chipped implements found, and small glassy basalt implements are said
    to show considerable skill.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage notes the absence of rubbed stone arrow or spear points at Lytton,
    while rubbed fish-knives are common and related rubbed points are mentioned for
    the coast and Kamloops.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: Some chipped specimens have smooth edges or polish; the passage argues that
    the localized smoothness would not be explained by blowing sand or natural stone
    disintegration.
  category: attribute
  evidence_refs:
  - ev:13
