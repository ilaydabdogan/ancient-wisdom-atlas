  quote: ''
  summary: The passage is an archaeological description of ruined underground house-pits
    at Lytton, British Columbia, and of tools and manufacturing traces found there,
    including elk-antler wedges, pestles or mauls, stone hammers, grooved stones,
    nephrite celts, and worked stone boulders.
