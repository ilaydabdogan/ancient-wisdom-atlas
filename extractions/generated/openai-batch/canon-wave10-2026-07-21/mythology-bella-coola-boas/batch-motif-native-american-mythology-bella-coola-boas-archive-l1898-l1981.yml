canonical_text:
  quote: ''
  summary: The passage describes facial and regalia paintings used to symbolize animals,
    birds, fish, whales, and sea-monsters through tails, fins, feathers, throats,
    eyes, horns, mouths, and other body parts. It includes a brief tradition in which
    Raven, bearing the inherited name of his uncle Nenk‘ilsua’s, kills the bird Ts’a’gul,
    puts on its skin, flies up to heaven, and liberates the sun.
  language: English
  quote_policy: summarized
