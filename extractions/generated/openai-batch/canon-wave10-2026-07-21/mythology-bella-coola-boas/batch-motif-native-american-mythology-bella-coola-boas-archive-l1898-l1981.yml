  text: Wasx is described as a fabulous monster, believed to be half wolf and half
    whale, able to hunt on land and in the waters.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wasx is said to return from hunting carrying several whales on or under parts
    of its body, including one in its long tail.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The curved tail holding a whale is identified as one of Wasx’s symbols.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Yak"la’nas chief is described as wearing two wolves’ tails tied to his hair
    top-knot with red cedar-bark, along with a twisted red cedar-bark ring.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bird-tail paintings are differentiated by feather form, including hawk, woodpecker,
    and raven tails.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Raven-tail symbolism may be supplemented by red paint on the dancer’s throat
