canonical_text:
  quote: ''
  summary: The passage describes Upper Thompson and Lower Thompson beliefs about very
    tall, powerful giants associated with the Okanagon and Upper Thompson country.
    The giants are said to lack upper eyelids, never sleep, dress in animal skins
    or robes, carry large game, live in caves in steep rocks, leave a strong odor
    on their tracks and touched branches, sometimes take women, and sometimes induce
    sleepiness in fishers while taking fish.
