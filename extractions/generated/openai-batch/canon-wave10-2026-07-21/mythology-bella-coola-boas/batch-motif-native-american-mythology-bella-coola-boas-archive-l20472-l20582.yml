  text: Chiefs wear cedar-bark head-bands tied in front with a red-painted knot, with
    the ends hanging down their backs.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dancing ground is deliberately prepared by smoothing, spreading clay if
    needed, watering, trampling, and keeping dust down with water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Dancing begins at sunrise with four dances; dancers stand three abreast in
