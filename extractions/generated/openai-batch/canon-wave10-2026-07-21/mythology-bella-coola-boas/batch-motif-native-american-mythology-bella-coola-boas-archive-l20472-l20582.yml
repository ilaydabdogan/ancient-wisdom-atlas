canonical_text:
  quote: ''
  summary: The passage describes a Thompson Indian dance gathering at a prepared river-side
    dancing place. Participants assemble in fine clothing and paint, with no weapons
    allowed. Chiefs and dancers wear sashes, head-bands, cedar-bark ornaments, dentalia,
    feathers, or down. The dancing place is smoothed and watered. At sunrise, dancers
    form a circle in social groups while two chiefs stand outside the circle in the
    west and east. The older head chief prays, speaks, keeps time, gives orders, and
    is associated with visions, prophecy, and speech about a future world. The younger
    chief wakes people at daybreak, leads singing, helps the head chief, and may introduce
    songs said to come in visions from the Great Chief. The dance includes stamping,
    slow circular motion, holding sashes, children dancing with parents, and hand
    signs including one explicitly said to draw nearer the power to which they pray.
  language: English
  quote_policy: summarized
