- id: obs:8
  text: 'Two chiefs stand outside the dance circle: an older head chief in the west
    and a younger chief in the east.'
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The head chief makes speeches and prayers, keeps time, gives orders, is expected
    to have visions, can prophesy, and tells about the future world.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The eastern chief wakes people at daybreak, leads singing, and assists the
    head chief.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: New songs are sometimes introduced, and the chiefs say they received them
    in visions from the Great Chief.
  category: speech
  evidence_refs:
