canonical_text:
  quote: ''
  summary: The passage is an archaeological description of burials at Lytton and nearby
    Lillooet. It describes flexed human remains, bark wrappings or coverings, grave
    goods including tools, paints, ornaments, dentalium, copper, animal teeth, seeds,
    possible pouch deposits, and possible amuletic colored pebbles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Small animal bones and bear-teeth are said to indicate that some of the people
    were hunters, while stone adzes suggest canoe manufacture; at Lillooet, bodies
    were found wrapped in bark.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The investigators report that they did not find any grave in which the body
    was in a sitting posture.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: One described grave contained a horizontal flexed body with the knees in front
    of the chest, hands to the face, and a beaver-tooth knife and antler or beaver-tooth
    objects positioned from knee to face in a way interpreted as a possible pouch
    deposit.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another burial had the body and head covered with birch-bark, hands over the
    face and forehead, paints near the lower body, and dentalia, copper, elk-teeth,
    celts, arrow-points, bone needles, and animal teeth in nearby positions.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A young adult skeleton was flexed with the head to the north and face to the
    east; black arrow-points were throughout the grave, with beaver-teeth and red
    paint near the right leg.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: An older disarranged skeleton was associated with chipped stone points, arrow-shaft
    smoothers, whetstones, carved antler, bone tools, pendants, dice made of woodchuck-teeth,
    white paint, mica pendants, and birch-bark.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Two highly decayed burials contained stone tools and chips, whetstones, birch-bark,
    dentalium, copper-covered wood or copper ornaments, shell and hair ornaments,
    and red or yellow paint; one assemblage was positioned as though originally in
    a pouch.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Over a few bones, including a puma femur, were found birch-bark pieces and
    rolls, a shell spoon partly filled with gum, red and blue paint, bone and antler
    tools, beaver-teeth, basalt and stone objects, a steatite pipe fragment, and Lythospermum
    seeds.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says Lythospermum seeds seem to have been placed over the body,
    based on shell-like seeds mixed with a black mass interpreted as decayed plant
    material.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Grotesquely formed pebbles of bright and clear colors were sometimes found
    in graves and may have been prized as amulets or charms.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: The summary of typical graves states that bodies were buried on the side with
    knees drawn up to the chest, often covered with birch-bark, with implements placed
    at the side in pouch-like positions and elk-tooth pendants frequently near the
    neck.
  category: sequence
  evidence_refs:
  - ev:10
