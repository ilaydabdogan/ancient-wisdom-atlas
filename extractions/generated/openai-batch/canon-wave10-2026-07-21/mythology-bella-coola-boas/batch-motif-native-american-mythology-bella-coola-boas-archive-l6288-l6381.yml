canonical_text:
  quote: ''
  summary: A woman lost while berry-picking is compelled to become the wife of Stump.
    A woman rooted to the floor secretly helps her survive a dangerous lousing task
    and later escape. The fleeing wife uses objects that transform into obstacles,
    reaches heaven, enters the Sun's house through fire, and the pursuing Stump is
    burned. She later bears the Sun's son and returns with him to her father's house
    by descending along the Sun's eyelashes or sunbeams.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman goes into the woods to pick berries, loses her way, reaches a river,
    and meets a wild-looking man named Stump.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Stump says he knows the location of her father's village but will not tell
    her because he wants to marry her; she follows him because she sees no way to
    escape.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Stump's house is under trees, and inside it is a woman rooted to the floor.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The rooted woman gives the wife a brad-awl and explains that Stump's lice
    are toads; she instructs her not to scream, to pick them up with the awl, throw
    them behind her, and pretend to bite and eat them by biting her nail.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wife removes the toads from Stump's head with the awl and deceives him
    by making biting sounds with her thumbnail.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Stump's chamber-pot acts as a watchman and reports the wife's first escape
    attempt, enabling Stump to pursue and bring her back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The rooted woman tells the wife to drill holes around the chamber-pot's rim
    and gives her a bladder filled with urine, a comb, and a grindstone for her escape.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the second escape, the urine becomes a lake, the comb becomes a thicket,
    and the grindstone becomes a large mountain that carries the woman up to heaven.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the Sun's house, the woman safely jumps through a fiery doorway, while
    Stump later enters and is consumed by the fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The woman lives in a room in the Sun's house, bears a boy named T'dtqoa'ya
    who is the son of the Sun, and later descends with him along the Sun's eyelashes
    or sunbeams to her father's house.
  category: sequence
  evidence_refs:
  - ev:7
