canonical_text:
  quote: ''
  summary: 'The passage describes Thompson dwelling forms: winter underground houses
    falling out of use, summer square and round pole lodges covered with mats, bark,
    or skins, regional differences in lodge use, central fires and smoke openings,
    newer tent preferences, and large paired open shelters used for gatherings such
    as potlatches and fishing places.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Underground winter dwellings were superseded by ordinary log houses, and deserted
    frameworks left circular holes in the ground.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Except during the three coldest months, the described Indians used summer
    lodges made from pole frameworks covered with mats or bark; these lodges could
    be square or round.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The square lodge was built on cleared flat ground with paired poles, cross-poles,
    a gable-end doorway, overlapping reed mats, and an upper opening for smoke and
    light.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: One variety of square lodge used converging corner poles and short cross-pieces,
    making it look almost circular and like a winter house covered with mats.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Circular lodges were larger than square ones and used long poles arranged
    in a circle with their small ends meeting near the center; the top opening could
    be covered by a flap at night or in bad weather.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Among the Nicola and Spences Bridge bands, skins were often substituted for
    mats and were sometimes painted in colors and figures; the Lower Thompson Indians
    did not use round lodges.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Inside the lodge, the floor was covered with small fir branches, the fire
    was in the middle, and the doorway was covered by a mat, skin, or blanket.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Older people still used these lodge types, while young people preferred cotton-drilling
    or light-canvas tents in summer.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: For large gatherings such as potlatches and fishing-place assemblies, large
    lodges were made from two open-front shelters facing each other, with large log
    fires in the space between them.
  category: setting
  evidence_refs:
  - ev:7
