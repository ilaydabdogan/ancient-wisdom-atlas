canonical_text:
  quote: ''
  summary: The passage reports the aftermath of a massacre, including Nicola’s discovery
    and burial of the dead, burial treatment of dogs and grave goods, and notes on
    Thompson and Athapascan burials. It then summarizes archaeological resources and
    implements of the Thompson River region, including stone materials, ochre, bone
    and shell objects, imported whale bone, dentalium shells, grave contents, and
    hunting, fishing, and cutting tools.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nicola learned of the massacre, saw dead people left by Shuswap warriors,
    and was described as surprised and pained.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some children had been tied in pairs and thrown over spear handles fixed to
    house-poles; some older persons and children had been disembowelled.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nicola began to bury the dead hastily, and the burial work took his party
    more than a day and a half.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: No avenging party was sent by the Nicola Athapascans; the Thompsons sent out
    a party, but its success was unknown.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dogs were killed and buried with their known owners; dogs whose masters were
    unknown were killed and buried separately.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Dentalium shells, stone axes, kettles including one copper kettle, other items,
    and a double-bladed iron knife were buried with bodies or known owners.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Thompsons and Athapascans were described as close friends and were buried
    together indiscriminately.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Iron-Head had not heard of burials in the rock-slide before or since the massacre;
    a chief later said a person who died of smallpox was buried there because it was
    out of the way.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The archaeological resources of the prehistoric Thompson River people are
    described as practically the same as those found at Lytton.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Basalt or augite-porphyrite, green stones, and nephrite were available or
    distributed regionally and were used for chipped implements or celts.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Tough rocks such as diorites were used for hammers and pestles; yellow ochre,
    fragments bearing galena, and an iron awl were found at Kamloops.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Bone was used for arrow points, beaver teeth were made into dice, and whale
    bone imported from the seacoast was made into war-clubs.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Pecten shells, freshwater unio shells, cat-tail matting, sagebrush-bark fabrics,
    cedar fibre, and charred bearberries were found in the archaeological contexts
    described.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Food-procurement implements included chipped points for arrows, spears, knives,
    basalt blades, and caches of chips and flakes, some of which were used for cutting.
  category: object
  evidence_refs:
  - ev:10
