literal_observations:
- id: obs:1
  text: In areas where good bark was abundant, lodges were built on the square-type
    plan and covered with long strips of spruce, balsam fir, or black pine bark, with
    the smooth side outward.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lower Thompsons used cedar-bark only, and their temporary lodges were
    frequently a single slanting roof similar to a smaller version of a large shelter
    described earlier.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A temporary conical structure for girls coming to womanhood was sometimes
    located near a hunting-lodge or Indian village and made entirely of fir branches
    and tops.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The girls' structure was made from four small fir-trees placed in a square,
    with their tops tied together, branches knotted, and openings filled with fir
    tops and twigs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A separate house for women during menstruation was occupied for only a few
    days, roughly made of brush or cedar-bark, generally conical, and large enough
    for one person to sit inside.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Most lodges for adolescent girls had a small circular hole in the centre into
    which the girl placed her feet or in which she squatted.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sweat-houses were always found close to water.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: A common sweat-house form used willow wands bent over with both ends stuck
    in the ground, arranged at right angles to make a round shape and fastened at
    intersections.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The sweat-house door was made large enough for a man to creep through on hands
    and knees, and a one-foot-square hole near the entrance held hot stones.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: When used, the sweat-house was covered with blankets to hold hot air and steam,
    and the floor was covered with fresh fir-bough ends, often mixed with aromatic
    plants.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Sweat-houses accommodated one to four persons in a squatting posture, and
    the Nicola band used poles for the framework when wands were unavailable.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Caches were used to store provisions and utensils, either on lower limbs of
    a large spreading tree or in a circular cellar hole about four feet deep for berries,
    fish, and similar items.
  category: object
  evidence_refs:
  - ev:6
