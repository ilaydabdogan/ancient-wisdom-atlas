canonical_text:
  quote: ''
  summary: A boy is mocked by other children after saying that his father is the Sun.
    Angered, he tells his mother he will return to his father in heaven. He makes
    a bow and many arrows, shoots them upward until they form a chain reaching the
    ground, climbs to heaven, enters the Sun's house, and asks to take his father's
    place. The Sun consents but instructs him to use torches carefully so as not to
    burn the people.
