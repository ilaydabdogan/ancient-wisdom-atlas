comparison_claims:
- id: claim:1
  claim: Within the passage, the old trail to spirit-land and the Christian new trail
    serve the same broad function as postmortem routes, though their stages and destinations
    differ.
  claim_level: same_function
  target: old trail to spirit-land compared with Christian new afterlife trail
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal comparison reported by the passage; it should not
    be extended to external traditions without additional evidence.
- id: claim:2
  claim: The passage explicitly relates the fate of some very bad persons to that
    of suicides by saying their tracks could not be found and their souls vanished.
  claim_level: same_function
  target: souls of suicides and souls of some very bad persons
  evidence_refs:
  - ev:1
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: Both statements are presented as variant or limited beliefs, not universal
    doctrine.
- id: claim:3
  claim: The water routes of drowned souls function as alternate afterlife routes
    distinct from the trail of the dead visible to shamans.
  claim_level: same_function
  target: drowned-person water routes compared with the ordinary trail of the dead
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives several alternatives for drowned souls and says shamans
    cannot follow or see some of them.
