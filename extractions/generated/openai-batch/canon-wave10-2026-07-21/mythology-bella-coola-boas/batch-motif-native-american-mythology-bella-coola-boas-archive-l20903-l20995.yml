candidate_motifs:
- id: motif:1
  label: mapped afterlife routes and destinations
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage distinguishes suicides without tracks, drowned souls on water
    routes, ordinary souls going to the land of souls, and Christian souls following
    a new trail through graveyards, sky, and western descent.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage records multiple variant beliefs rather than a single uniform
    map.
- id: motif:2
  label: water route for drowned souls
  taxonomy_refs:
  - afterlife_journey_map
  basis: Drowned souls are described through water-related destinations and routes,
    including remaining in water, traveling on rivers and lakes, reaching a country
    beyond waters, or following a trail over waters.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: Several alternatives are reported, and the shaman cannot follow some routes.
- id: motif:3
  label: infant soul return in later child
  taxonomy_refs:
  - death_rebirth
  basis: A dead infant may be said to return as a later child of the same sex and
    same mother, while other forms of rebirth are denied.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The taxonomy reference is broad; the passage describes a restricted infant-return
    belief, not general rebirth.
- id: motif:4
  label: future return of named figures with the dead
  taxonomy_refs:
  - return
  basis: Old Man and Coyote will return to this world, preceded by messengers, and
    bring souls back from the country of the dead.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not describe the full consequences of the souls' return.
- id: motif:5
  label: ascent to sky and confession before a Chief
  taxonomy_refs:
  - ascent
  - divine_judgment
  - afterlife_journey_map
  basis: Christian souls ascend by a trail to the sky, see the Chief, confess sins,
    and then continue toward another destination with variants about final fate.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The account is explicitly a Christian-associated new trail within the
    passage, and variants differ on what happens after confession.
- id: motif:6
  label: postmortem vanishing or non-arrival for exceptional dead
  taxonomy_refs: []
  basis: Souls of suicides and some very bad persons are said in some accounts to
