- id: motif:7
  label: appointed time of death
  taxonomy_refs: []
  basis: People and animals are said to die only when a set time has arrived; missed
    shots and sudden deaths are interpreted by this rule.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No supplied taxonomy family directly matches this motif.
- id: motif:8
  label: soul departure causing bodily death
  taxonomy_refs: []
  basis: The body must soon die if the soul leaves and does not return, and death
    is immediate when the soul reaches spirit-land.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage separates soul from life and breath, but does not elaborate
    a full doctrine beyond these statements.
- id: motif:9
  label: guardian-spirit shamanism through dreams and visions
  taxonomy_refs: []
  basis: Shamans accomplish supernatural feats through guardian spirits who instruct
