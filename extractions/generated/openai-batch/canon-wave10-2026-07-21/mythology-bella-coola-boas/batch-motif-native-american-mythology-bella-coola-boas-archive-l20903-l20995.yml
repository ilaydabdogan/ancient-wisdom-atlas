canonical_text:
  quote: ''
  summary: The passage reports variant beliefs about postmortem destinations for suicides,
    drowned people, ordinary dead, infants, Christians, and very bad persons; describes
    limited infant soul return; predicts the future return of Old Man and Coyote bringing
    souls back; states that beings have appointed death times and that soul departure
    can cause bodily death; and summarizes shamanic powers, guardian spirits, ritual
    objects, and shamanic sickness or cure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some shamans say they cannot find tracks or locate the place where the souls
    of suicides go.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Variant statements say the souls of suicides are lost, cease to exist, or
    remain on earth wandering aimlessly.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: People who are drowned are said not to go to the abode of souls; variant accounts
    place their souls in water, on waterways, beyond waters, or on a circuitous trail
    over waters.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: All other people, including children, still-born and new-born infants, and
    miscarriages, are said to go to the land of souls.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some accounts say warriors killed in battle travel more quickly, and others
    say a good person reaches the land of souls sooner than an evil person.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: A male infant who dies may be identified with a later male child born to the
    same mother; the passage rejects rebirth across old age, sex, or mother in this
    belief.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Souls remain in the country of the dead until Old Man and Coyote return to
    this world.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Old Man and Coyote are expected to be preceded by messengers, come from the
    east, and bring souls back on tobacco-smoke clouds, red clouds, or the aurora.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage reports an established belief that non-Christian Indians go over
    the old trail to spirit-land, while Christian Indians go by a new trail.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Souls of Christian Indians are said to wander from graveyard to graveyard
    before taking a trail upward to the sky, where they see the Chief and confess
    sins.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the sky episode, the Christian soul is said to go downward toward the
    west and reach the old abode of shades, though variants say some are retained,
    extinguished, or drop down.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Some very bad persons are compared to suicides in that their tracks could
    not be found and their souls were thought simply to vanish.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Every person and animal is said to have a set time for death, so missed shots
    or sudden deaths are explained by whether that time has come.
  category: other
  evidence_refs:
  - ev:8
- id: obs:14
  text: The soul may leave the body before death; if it reaches spirit-land, the body
    immediately dies, while the soul is said not to need the body, life, or breath.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: Shamans perform supernatural feats with the help of guardian spirits, who
    instruct them by visions or dreams.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Both females and males could become shamans, though the passage says few female
    shamans remain at the time described.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: Some shamans have staffs painted with symbolic figures such as lightning,
    snakes, or guardian spirits, and similar figures may be carved or painted on pipes.
  category: object
  evidence_refs:
  - ev:10
- id: obs:18
  text: Shamans are believed to cause and cure sickness from witchcraft or soul loss,
    including by shooting an enemy with a spirit or with deer nasal bones by thought
    or guardian-spirit help.
  category: action
  evidence_refs:
  - ev:11
