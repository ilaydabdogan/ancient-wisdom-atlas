canonical_text:
  quote: ''
  summary: 'The passage describes several Thompson Indian games: ring-and-dart games
    with marked darts and special customs for boys, a guessing game called lehal using
    paired bones, songs, percussion, and rattling adornments, and a birch-bark card-matching
    game with painted paired images.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In one ring-and-dart game, players sat in two facing lines while a ring was
    rolled between them and darts were thrown at the moving ring.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The darts were short, feathered at one end, sharp at the other, sometimes
    forked, and marked with ownership signs such as notches, dots, circles, or paintings.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Old people sometimes put boys' darts into the fire of the winter house, and
    the boys were allowed to recover them only by catching the ends with their teeth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sometimes all the darts were thrown outside and the boys scrambled for them;
    the one who obtained the most darts was the victor.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A boy who lost all his darts could regain them by putting up his back as a
    target, with every arrow fired at it becoming his property.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Another ring game used a finger-ring-sized ring placed on the ground, and
    each player threw two darts to hit its center.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Boys and girls won or lost darts in these games, but did not gamble for anything
    else.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The lehal guessing game was played by two facing rows; one side handled two
    short bones, one tied with sinew, while the other side guessed which hand held
    the plain bone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The side playing lehal sang a lehal song and might use drums, sticks beaten
    on the floor or a board, or singing alone.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Some lehal players wore knuckle coverings of weasel or other skin with buckskin
    strips, or wrist strings set with fawn hoofs to make a rattling noise.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: A birch-bark card game used small cards painted with dots, with two cards
    of each kind in the set.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The birch-bark card game involved selecting or being dealt cards and winning
    by mating cards with their matching partners.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The card images listed include sun, man, dog, fishes, fish backbone, roots,
    possible loon-necklace, trail crossings, bridge or four quarters, trails, creeks,
    or tree trunks.
  category: object
  evidence_refs:
  - ev:8
