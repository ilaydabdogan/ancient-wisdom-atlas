canonical_text:
  quote: ''
  summary: 'The passage describes beliefs about shamanic bewitchment: a person is
    especially vulnerable while eating, drinking, or smoking; people avoid those acts
    near an unknown shaman; nail clippings and loose hair are disposed of to prevent
    enemies from using them; possession of a person''s weapons can give an enemy power
    over the owner; stronger magic can reverse the effect onto the taker; and some
    shamans are said to cause sickness by drawing souls, though the supplied passage
    ends fragmentarily.'
