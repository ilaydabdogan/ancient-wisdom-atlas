canonical_text:
  quote: ''
  summary: The youngest brother leaves camp to search for his brothers, finds a house
    by following distant smoke, meets ALmrEnmeEna’m, sleeps with her, and receives
    food and warnings about her dangerous husband Toa’lav’it. She instructs him to
    hide offered food in a bag, stay awake, imitate the husband’s sounds, and says
    he may marry her if he kills the husband. Toa’lav’it returns with mountain-goats,
    prepares a fire and meal, watches the visitor eat, and the visitor hides food
    while the wife distracts Toa’lav’it.
  language: English
  quote_policy: summarized
