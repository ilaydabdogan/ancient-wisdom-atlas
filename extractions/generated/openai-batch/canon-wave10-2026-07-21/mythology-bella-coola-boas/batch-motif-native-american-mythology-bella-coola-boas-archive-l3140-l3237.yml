canonical_text:
  quote: ''
  summary: 'The passage describes several beings or powers connected with shamans:
    Skaia, a river spirit shaped like a salmon; a bereaved young man who prays on
    a mountain and receives a carved switch from the Sun, then gains S’a’tema as a
    supernatural helper able to cure and revive the dead; L’étsa’apléLana, who gives
    a healing song to a sick narrator; and the si’siuL, a water-associated shamanic
    helper used in curing disease.'
  language: English
  quote_policy: summarized
