canonical_text:
  quote: ''
  summary: 'The passage describes marriage customs: a bridegroom claims a bride after
    a delay, the couple is moved between affinal households through processions, feasts,
    clothing gifts, food gifts, and reciprocal return visits. It also describes other
    marriage forms in which touch, an arrow-touch proposal, cutting or loosening clothing,
    lying beside a girl, or a four-night nocturnal courtship ending in hand-touch
    establishes marriage, usually without presents or ceremonial visits.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bridegroom did not immediately go to claim the bride, but generally waited
    several days and then stayed at her parents' house before taking her to his father's
    house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the bridegroom's father's house, the bride was treated well and was not
    allowed to do any work.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bridegroom's father announced a date for conducting the newly married
    couple back to the bride's father's house and received food or other presents
    from friends and neighbors.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bridegroom's father gave his son new clothes, and the bridegroom's mother
    gave the daughter-in-law a similar gift, which the couple wore over their other
    clothing.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Food and presents were carried, or transported by horse when horses were available,
    and the bride and bridegroom rode two of the best steeds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the bride's father's house, food gifts were cooked, feasts were held, and
    the couple later removed their new clothes and gave them to the bride's parents,
    who passed them to the bride's kin.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Presents given nominally to the bride's parents were divided among the parents'
    friends.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: After a morning feast, the party returned home and left the newly married
    pair with the bride's relatives.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A later return visit conducted the couple back to the bridegroom's parents,
    with similar feasts, presents, clothing gifts, and horses presented to the bridegroom
    by his father-in-law.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In a long-distance suit, a man's father could carry presents to the girl's
    parents and ask for a daughter-in-law; if accepted, he returned the next morning
    with the new daughter-in-law.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Another marriage form was contracted by a man's touching a girl's person;
    even accidental touching required marriage.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Touching a maiden's naked breasts or heel made her the man's wife, with no
    retraction for either party.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: A young man's intentional touch of a young woman with his arrow functioned
    as a marriage request, and her hanging her head was taken as assent.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: If the girl's household called the young man son-in-law and treated him well,
    he understood that he had been accepted.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Cutting or loosening one string of a maiden's breast-lacing, cutting her breech-cloth,
    or lying down beside her required marriage without further ceremony.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: In a nocturnal courtship pattern, a young man lay on the edge of a girl's
    blanket on successive nights; rejection could be shown by alarm, dismissal, or
    striking, while acceptance culminated on the fourth night when she put her hand
    outside the blanket and he took it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: After the hand-touch, the girl told her parents that the young man had touched
    her hand; her father informed his people and her mother prepared a small feast.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: In marriage by touching, presents and ceremonial visits were generally not
    given or made.
  category: relationship
  evidence_refs:
  - ev:10
