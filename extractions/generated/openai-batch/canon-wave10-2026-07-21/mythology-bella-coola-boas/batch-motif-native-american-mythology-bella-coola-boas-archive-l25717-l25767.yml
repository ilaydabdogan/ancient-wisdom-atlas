  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: For Fig. 1, Baptiste proposed an unfinished pipe, while Michel of Lytton proposed
    a small hafted hammer for crushing food for a rich toothless old person.
  category: speech
  evidence_refs:
  - ev:4
