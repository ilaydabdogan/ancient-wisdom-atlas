canonical_text:
  quote: ''
  summary: The passage describes Grave 9, including the position of a skeleton, associated
    dog bones colored with red ochre, birch-bark, charcoal, a basalt point, a decayed
    wooden bow, and nephrite celts. It then records 1899 information from named Indigenous
    informants and Mr. Teit about the possible functions of several archaeological
    specimens figured elsewhere, including a pipe or hammer, beaver-spear, anvils
    or ball/club-head, and a tool for chipping, carving, and cutting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A skeleton in Grave 9 rested on the soil surface and was covered by about
    one foot of rock-slide material.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Above the skeleton were pieces of birch-bark, dog bones colored with red ochre,
    a chipped point of glassy basalt, and pieces of charcoal.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The body lay on its back, with hands to the shoulders, flexed legs with raised
    knees, and the head turned east.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Fragments of a much-decayed wooden bow extended beside the body from the femur
    to the skull; the bow was smooth and ornamented on one side with small cuneiform
    incisions.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A green nephrite celt and a shorter celt lay with the bow, with specified
