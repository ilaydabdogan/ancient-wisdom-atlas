  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cambium from several trees was sought in spring; yellow-pine cambium was often
    dried for winter use, and alder cambium was sometimes eaten.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bark was separated with a short piece of horn or wood, and cambium was scraped
    with an edged bone or horn implement; knives are said to be used at the present
    day.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cactus hearts, mushrooms, pine nutlets, hazelnuts, and Balsamorrhiza seeds
    were prepared or eaten by named bands or divisions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Pure water was seldom drunk while eating; water in which meat or fish had
    been boiled was substituted, and dried plant materials were used to prepare drinks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Meat preservation included removing and storing fat, slicing flesh, piercing
    slices with slits, and drying the meat by sun, wind, smoke, fire, or artificial
    heat.
  category: sequence
  evidence_refs:
  - ev:6
