canonical_text:
  quote: ''
  summary: The passage describes the route and research aims of an 1897 expedition
    through Fraser River, Lillooet, Chilcotin, and toward Bella Coola. It records
    travel by pack-train, visits to villages, collection of anthropometric and ethnological
    data, separation of Mr. Farrand and Mr. Boas for different fieldwork routes, and
    observations about Chilcotin settlement patterns and recent contact with whites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The expedition intended to investigate physical characteristics of Indigenous
    people along Fraser River north of Lytton and to study Chilcotin customs and physical
    characteristics.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The expedition planned to continue over the mountains to the coast to study
    the Bella Coola, whose customs and beliefs are described as not previously subjected
    to systematic inquiry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The party started from Spences Bridge with a train of ten horses and crossed
    mountains between Spences Bridge and Lillooet on narrow trails.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The expedition expected to meet many Indigenous people in the high valley
    of Botani, where tribes of Fraser River and Thompson River assembled every spring,
    but encountered comparatively few.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Lillooet, Mr. Farrand separated from the main party to visit Upper Lillooet
    villages on Seton and Anderson Lakes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pack-train proceeded along the wagon-road toward Caribou, visiting Indian
    villages near the road and collecting anthropometric measurements.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: On July 3 the party reached Soda Creek on Fraser River, described as the most
    northern Shuswap village, then crossed the river and proceeded westward into Chilcotin
    territory.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After reaching the western Chilcotin village of considerable size, Farrand
    continued the investigation of the Chilcotin while Boas continued across the mountains
    to Bella Coola.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that the Chilcotin had been brought into contact with whites
    comparatively recently and at the time lived in log-cabins, raised cattle and
    horses, and tilled the soil.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Some Chilcotin families are described as still roaming in the mountains between
    Lillooet and Chilcotin River and not settled on reservations.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Farrand spent most of his time in larger Chilcotin villages, visited isolated
    families near Tatla Lake and in the mountains during August, and then proceeded
    northward to the pass leading to Bella Coola.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Boas followed a more northern route toward the pass, crossed the plateau north
    of Tatla Lake, and met a few Chilcotin near Lake Nakoontloon.
  category: action
  evidence_refs:
  - ev:6
