canonical_text:
  quote: ''
  summary: The passage names two mountains near the Bella Coola River headwaters.
    One mountain has a warning fire in his house. When Qama’its attacks the mountains
    by canoe, the fire warns him; he breaks her canoe, she returns to heaven, and
    the canoe becomes a visible stone. Qama’its is said to visit earth and cause sickness
    and death. The passage then describes the central house of the gods in the lower
    heaven, its several names, and a bird-painted post before it.
  language: English
  quote_policy: summarized
