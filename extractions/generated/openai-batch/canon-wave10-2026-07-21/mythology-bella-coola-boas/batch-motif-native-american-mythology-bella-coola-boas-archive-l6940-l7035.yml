    their Cannibals.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author says Jacobsen attributes Baxbakualanuxsi’waé to Bella Coola Cannibal
    ceremony, but Boas identifies the name as Kwakiutl in origin and says he found
    no Bella Coola mask representing the being.
  category: relationship
  evidence_refs:
  - ev:8
