canonical_text:
  quote: ''
  summary: A youth and his sister flee a pursuing bear woman, cross water to a village,
    and receive help from villagers, Loon, Grebe, barnacles, and sea-worms, who use
    a canoe trap to destroy the bear woman. The siblings then take separate trails
    that meet, and they marry. The passage then shifts to ethnographic commentary
    on Bella Coola ceremonials, their relation to clan legends and secret-society
    initiations, and Boas's comparison and disagreement with Jacobsen about Kwakiutl-derived
    Cannibal Society traditions and masks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The youth and his sister travel together; he proposes finding a village where
    he will marry her, and she agrees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: They reach a sheet of water, see a village on the other side, call for transport,
    and a canoe comes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the village, the youth says a bear woman is pursuing them and that he has
    failed to kill her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The village people decide that Loon and Grebe should fetch the bear woman
    while barnacles and sea-worms hide in the canoe to bite her and make her upset
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The bear woman boards the unsteady canoe; in the middle of the water, the
    barnacles and worms bite her, she jumps up, and the canoe capsizes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Loon and Grebe swim ashore; later the barnacles and sea-worms come ashore
    looking stout because they have eaten the bear.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'The youth sets a condition using two trails: if the trails meet, he and the
    girl will marry; if not, they will separate forever. The trails meet and the youth
    marries the girl.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author says the Bella Coola have two ceremonials, the sisau’k and the
    ki’siut, corresponding to the Kwakiutl Lad’laxa and ts’étsa’eqa.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author describes sisau’k ceremonials as dramatic representations of clan
