canonical_text:
  quote: ''
  summary: The passage describes the Lytton area at the confluence of the Thompson
    and Fraser Rivers, its climate, subsistence resources, village location patterns,
    and archaeological remains. It reports earlier collections from a large burial-ground,
    the 1897 Jesup North Pacific Expedition explorations, the main sand-hill burial-place
    and village-site, wind-exposed human bones and artifacts, local handling of exposed
    remains, and traces of hearths and underground houses north and south of the hill.
  language: English
  quote_policy: summarized
