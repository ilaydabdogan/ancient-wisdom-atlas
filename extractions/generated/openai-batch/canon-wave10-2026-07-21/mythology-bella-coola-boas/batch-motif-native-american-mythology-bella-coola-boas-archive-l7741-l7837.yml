- id: obs:1
  text: Lytton is situated at the confluence of the Thompson and Fraser Rivers in
    southern British Columbia.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The surrounding landscape is described as including the Fraser River canyon,
    plateau country, mountain ranges, dry climate, scanty vegetation, and open timber
    at higher elevations.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The present inhabitants are described as subsisting on fish, especially during
    salmon runs, and also on roots, berries, deer, and bear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: More permanent villages are located on larger rivers, and Lytton is described
    as an important village because it is near fishing, berrying, and root-digging
    grounds.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that extensive village remains and large burial-grounds
    at Lytton indicate similar conditions in prehistoric times.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: A large burial-ground on land between the Fraser and Thompson Rivers had been
    described by Dr. George M. Dawson, and collections from the region are said to
    be held in several museums and private cabinets.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Jesup North Pacific Expedition made explorations near Lytton in July 1897,
    with field assistance and excavation work by named participants.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The main explored burial-place and village-site is described as a sand-hill
    on a terrace north of the river confluence, with a large pine tree on its crest.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wind is said to shift the light dry sand, uncover graves, disarrange them,
    and sometimes re-cover the remains.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Objects left or lost by later campers are scattered on the surface and may
    be covered by blowing sand, so they must be distinguished from undisturbed burials.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The surface is described as strewn with human bones and artifacts including
    shell beads, antler wedges, stone scrapers, chipped points, grinding-stones, celts,
    and similar materials.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Local Indians deposit exposed bones and objects in a large box or sometimes
    bury them, and they consider the bones to be those of Indians while not knowing
    whether they are their own ancestors.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The undisturbed graves are described as lacking European objects and therefore
    as antedating contact with whites, with some considered several hundred years
    old.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: North and south of the sand-hill, the passage reports old hearths or traces
    of hearths, firestones, grinding-stones, charcoal, partly burned birch-bark, and
    remains of underground houses.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
