candidate_motifs:
- id: motif:1
  label: Loss of animal gift through mistreatment
  taxonomy_refs: []
  basis: Raven mishandles the salmon after catching them in his hair, and the salmon
    depart with his wife to the salmon country while Raven loses his long hair.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage is the end of a larger Raven episode; the earlier acquisition
    of the salmon and long hair is outside the supplied excerpt.
- id: motif:2
  label: Marriage of human woman and solar being
  taxonomy_refs:
  - sacred_marriage
  basis: 'Nispuselxsak:ai’x: seeks Smai’yakila, identified as the Sun, reaches his
    house, and marries him.'
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage presents the marriage plainly; broader ritual or cosmological
    significance is not stated.
- id: motif:3
  label: Miraculously fast-growing child
  taxonomy_refs:
  - miraculous_child
  basis: T’otqoa’ya is born after one day in the Sun’s house and can walk and talk
    on the second day of life.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No additional infancy feats are described before the return to earth.
- id: motif:4
  label: Ascent to the sky by constructed path
  taxonomy_refs:
  - ascent
  basis: T’otqoa’ya shoots arrows that form a chain from earth to sky and ascends
    it to Smai’yakila’s house.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The ascent is by an arrow-chain rather than a ladder, tree, mountain,
    or rope.
- id: motif:5
  label: Reckless handling of solar fire
  taxonomy_refs:
  - world_destroying_fire
  basis: T’otqoa’ya lights all the sun torches at once, producing destructive heat
    that burns trees and boils water.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage describes destructive heat rather than a complete destruction
    of the world.
- id: motif:6
  label: Protective covering saves people from cosmic heat
  taxonomy_refs: []
  basis: 'Nispuselxsak:ai’x: covers the people with her blanket and saves them during
