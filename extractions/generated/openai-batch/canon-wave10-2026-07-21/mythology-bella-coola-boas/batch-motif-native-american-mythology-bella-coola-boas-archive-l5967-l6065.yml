canonical_text:
  quote: ''
  summary: 'The passage ends an episode in which Raven mishandles salmon and loses
    both the salmon and his long hair. It then narrates the Mink episode: Nispuselxsak:ai’x:
    marries Smai’yakila, the Sun, bears T’otqoa’ya, and returns to earth with the
    child along the Sun’s eyelashes or rays. T’otqoa’ya climbs to the sky by an arrow-chain,
    insists on carrying the sun, lights all the torches at once, and causes destructive
    heat. His mother saves people with a blanket; animals acquire traits from how
    they hide or are scorched. Smai’yakila casts T’otqoa’ya down to become the mink.
    Smai’yakila then raises a deluge, sparing people whose canoes are tied to mountain
    tops, later lowers the waters, and promises not to send another deluge while assigning
    uses to the porcupine.'
  language: English
  quote_policy: summarized
