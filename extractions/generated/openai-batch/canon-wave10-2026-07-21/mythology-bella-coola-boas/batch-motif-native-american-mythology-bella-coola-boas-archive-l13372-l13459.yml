canonical_text:
  quote: ''
  summary: 'The passage gives an ethnographic description of Thompson ornamentation
    and hair dressing: necklaces and later bracelets or rings, gendered use of ornaments,
    special grizzly-bear-claw necklaces for certain shamans and hunters, hair growth
    and cutting in mourning, greasing and perfuming the hair, hunters'' pre-departure
    hair anointing, daily bathing before grooming, women combing husbands'' hair,
    wooden combs, and several Upper Thompson men''s hairstyles.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that certain rings were not used by the tribe, while southern
    Lillooet men and women are said to have worn them; labrets were also unknown.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Necklaces were made chiefly from shells, claws, cactus and Eleagnus argentea
    seeds, or flat circular horn or bone beads strung on buckskin or bark thongs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men and women could wear several necklaces together, and girls and young women
    threaded cactus flowers on bark for necklaces.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some men's necklaces were made of twisted animal skin with pendant eagle feathers;
    later necklaces used trade beads, shell beads, dentalia, copper pieces, buckskin
    beadwork, buttons, and beads.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A grizzly-bear-claw necklace was worn only by shamans claiming the grizzly
    bear as guardian spirit or by hunters who had killed a grizzly bear and wished
    to make their bravery known.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In later days, brass or copper bracelets and anklets were worn, with anklets
    described for women only; finger-rings came into use with the Hudson Bay Company.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hair was allowed to grow and was cut only as a sign of mourning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Upper Thompson people greased hair with deer-back fat, while Lower Thompson
    people used salmon oil; boiled plant materials mixed with deer grease were used
    to perfume hair.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hunters anointed their hair with deer brain and a plant before departure;
    most people took a daily morning bath in a pond or stream before dressing hair
    and painting themselves.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Women combed their husbands' hair, and combs were made of thin split wooden
    strips glued together.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Several Upper Thompson men's hairstyles involved braiding front, side, and
    back hair, crossing or tying braids, and sometimes placing a comb in the knot.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
