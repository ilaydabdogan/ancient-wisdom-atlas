    ago.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The rear of the house is opened, an elevated room in the rear is prepared,
    and Xé’mak’sta stays there for three nights with his youngest brother.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the fourth evening Xé’mak’sta tells his youngest brother he will go to
    Nuxa’lk- to see relatives and will soon return.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Xé’mak’sta travels along the north side of the fiord over the mountains and
    reaches a house at Avxla’xt.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Avxla’xt, Xé’mak’sta asks a man to tell his relatives that he wishes to
    see them and to bring out young women.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Xé’mak’sta points the deadly end of his staff toward two women; they fall
    down dead, and then he points the staff at them again so that they arise.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After being revived, the women love Xé’mak’sta and wish to marry him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Xé’mak’sta goes behind the women and returns in bear shape, with his body
