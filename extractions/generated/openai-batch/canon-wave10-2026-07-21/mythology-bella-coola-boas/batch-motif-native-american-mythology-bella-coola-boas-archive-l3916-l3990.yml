  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Xé’mak’sta shakes eagle-down from his left shoulder onto the women, causing
    their skin to be covered with sores and their bodies to inflate, then heals them
    with his staff.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The women are pleased by Xé’mak’sta’s powers, return home, long for him, come
    back, lie down with him, and are told to return in the evening.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:16
  text: Xé’mak’sta sends his friend to bring other women, seduces all the young women
