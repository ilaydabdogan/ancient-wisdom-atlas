canonical_text:
  quote: ''
  summary: A youth receives eagle-down, a bear-skin blanket, a staff-related healing
    power, a new name, and return instructions from the Bears. He returns to his parents’
    house through the rear, is recognized by his brothers, and stays in an elevated
    rear room. He then travels to Nuxa’lk-/Avxla’xt, summons women, kills and revives
    them with his staff, changes into bear form and back, makes them sick with eagle-down
    and heals them, then seduces women from both sides of the river. The village people
    plan to kill his mother in retaliation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bear gives the youth eagle-down and a bear-skin blanket and explains that
    down placed on the left shoulder and shaken can make a maltreater sick when it
    settles on the person’s skin.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The youth is told that he can cure the afflicted person by approaching with
    the healing end of his staff.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bears give the youth the name Stsk:!la and instruct him not to enter his
    parents’ house by the door, but to wait behind the house and enter through an
    opened rear wall.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bears accompany the youth until they are near the village, then return,
    while the youth stays behind the village.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The youth’s mother is crying in her house; the youth knocks on the wall near
    where she is sitting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The youngest and older brothers report that their brother has returned, but
