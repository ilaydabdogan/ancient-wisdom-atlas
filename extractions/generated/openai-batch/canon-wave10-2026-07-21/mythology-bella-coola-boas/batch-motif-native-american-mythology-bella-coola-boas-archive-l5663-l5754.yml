canonical_text:
  quote: ''
  summary: A girl who wishes for the Snéné’iq to take her is carried away in a basket
    to the Snéné’iq’s house. An old woman captive warns her not to eat deceptive food
    and teaches her how to kill the Snéné’iq with mountain-goat horns worn on her
    fingers and a song. The girl burns the Snéné’iq’s body, whose ashes become mosquitoes,
    then receives four baskets and ritual dance materials from the old woman and returns
    home with food, blankets, masks, and cedar-bark used in the winter dance.
  language: English
  quote_policy: summarized
