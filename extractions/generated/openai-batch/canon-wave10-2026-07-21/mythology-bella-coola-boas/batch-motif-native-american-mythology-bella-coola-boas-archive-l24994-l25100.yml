canonical_text:
  quote: ''
  summary: 'The passage describes archaeological objects from the Thompson River region:
    stone pipes, tobacco-use information, coastal pipe finds, a possible grave charm,
    and decorated objects in bone, stone, antler, dentalium shell, and dagger forms.
    It notes red ochre on grave objects, incised designs interpreted by analogy with
    contemporary painted designs, possible manitou markings, possible wood-worm-boring
    designs, and several specific decorative forms such as eyes, ladder-like lines,
    pits, circles, and notches.'
  language: English
  quote_policy: summarized
