  summary: 'The passage describes Thompson Indian headgear: animal-skin caps, guardian-spirit
    animal caps, coyote-tail and coyote-skin head-bands, hunter and warrior head-dresses
    with ochre and feathers, a red snake-shaped buckskin streamer, and high shaman
    head-bands with eagle feathers, star and wolf designs, and animal-skin attachments.'
