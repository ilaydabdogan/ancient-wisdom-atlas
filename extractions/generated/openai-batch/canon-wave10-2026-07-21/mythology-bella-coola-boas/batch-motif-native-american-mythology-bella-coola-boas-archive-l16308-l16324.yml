canonical_text:
  quote: ''
  summary: 'Ethnographic account of Lower Thompson warfare relations: they describe
    themselves as having few trained warriors and generally amicable relations, while
    upper bands are said to have raided Lower Lillooet and Coast tribes, sometimes
    with Lytton assistance. Lillooet and coastal retaliatory parties are described
    as retreating or stopping before attack. The supplied passage ends mid-sentence.'
