canonical_text:
  quote: ''
  summary: The passage catalogs guardian spirits associated with different activities
    and persons, including natural phenomena, animals, animal parts, weapons, tools,
    and marked colors. It states that animal names may be revealed by guardian spirits
    and that knowing such names gives power over animals. It describes people as sharing
    the qualities of their guardian spirits, identifies the Sun as a special deity
    and omen-giver for warriors, and recounts pre-war rites by men and war-support
    dances by women using weapons and symbolic stick movements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Guardian spirits are listed by activity or social category, including hunters,
    fishermen, gamblers and runners, women, and an opening set that includes animals,
    blood, weapons, the sun, and thunder.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
- id: obs:2
  text: The passage says animals without mysterious power did not become guardian
    spirits, and that only few birds and hardly any trees or herbs could become guardian
    spirits.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:3
  text: All animals are said to have their own names, which guardian spirits may reveal;
    knowing such a name gives a person additional power over the animal, and the knowledge
    is generally not shared except perhaps from father to son.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:4
  text: Some guardian spirits are only part of an animal or weapon, and some are described
    by unusual or particular colors.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:5
  text: A person is said to partake of the qualities of the guardian spirit, and some
    guardian spirits are considered more powerful than others.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:6
  text: The Sun is described as the special deity of the warrior; warriors prayed
    to the Sun, and an appearance of the Sun in a dream signaled that the warrior
    would be killed or wounded.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:7
  text: Before going on the war-path, men sweat-bathed, supplicated guardian spirits,
    danced a circular dance against the sun’s course, mimed battle, imitated the sounds
    of their guardian-spirit animals, and pointed weapons toward the Sun.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:8
  text: While men were on the war-path, women danced at intervals, used knives and
    sticks in symbolic motions, painted their faces red, sang, supplicated war weapons,
    pointed weapons toward the enemy’s country, and hid the weapons afterward.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:9
  text: A woman who saw hair or scalp on a ritual weapon understood that her husband
    had killed an enemy; seeing blood on the weapon signified that her husband had
    been wounded or killed.
  category: other
  evidence_refs:
  - ev:12
