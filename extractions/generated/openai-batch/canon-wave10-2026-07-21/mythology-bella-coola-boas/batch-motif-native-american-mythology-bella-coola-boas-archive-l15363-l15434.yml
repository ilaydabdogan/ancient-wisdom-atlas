literal_observations:
- id: obs:1
  text: The Spences Bridge band exchanged local products such as elk-skin, dried venison,
    Indian-hemp bark, wild sunflower, and bitter-root for dried salmon, canoes, dried
    huckleberries, cedar-root baskets, and sometimes steatite.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When buying canoes from the Lytton band, the Spences Bridge band generally
    hired Lytton men to bring them through the swift waters of Thompson Canyon by
    paddling, poling, and towing, and paid them in buckskins.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Lytton band traded with the Lower Thompsons, giving animal products, shells,
    tobacco, tools, bags, mats, roots, berries, bark, and red ochre in exchange for
    canoes, salmon products, cedar materials, woods, skins, nuts, blankets, and baskets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Lower Thompsons sold goat products, berries, roots, fats, dressed skins,
    bark twine, cedar-root baskets, and dentalia to Coast tribes, receiving grass,
    mats, dried dog-salmon, sturgeon-oil, canoes, and abalone shells in return.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Upper Thompsons and Shuswap exchanged caribou and deer skins and dentalium
    shells for dried fish from the Spences Bridge band; the shells were said to come
    from the Chilcotin and Carriers and to be resold to the Upper Thompsons and Okanagon.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Small parties of Okanagon came at long intervals to Boston Bar to buy dried
    salmon, paying with roots, dried berries, and dressed buffalo and deer skin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Fountain on Fraser River was a noted trading and fishing resort where
    salmon were abundant, and a Hudson Bay Company pack-train later came once a year
    to buy salmon and trade.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Spences Bridge was described as one of the principal points for intertribal
    trade; some Spences Bridge, Nicola, and Lytton people traded in fall with the
    Similkameen at or near Keremeous.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Southern Carriers later came into Shuswap country and as far south as Thompson
    River to trade for fish or buy food, and some wintered near Spences Bridge.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Indian-hemp bark was bundled into packages, dried salmon were sold by a stick
    of one hundred fish, buffalo-skins were sold tanned, and some roots and goat-hair
    blankets had described values or circulation limits.
  category: object
  evidence_refs:
  - ev:7
