canonical_text:
  quote: numerous customs were observed intended to propitiate them
  summary: The passage describes customs concerning animals and plants, especially
    deer-hunting practices. Hunters are said to handle deer meat and remains carefully,
    distribute a lad’s first deer, place leftover meat or heads in trees, cover intestines
    and blood with fir-boughs, address the deer, and perform sweat-bathing, singing,
    prayer, and bone-burning when seeking hunting success or avoiding bad luck.
  language: English
  quote_policy: quoted
