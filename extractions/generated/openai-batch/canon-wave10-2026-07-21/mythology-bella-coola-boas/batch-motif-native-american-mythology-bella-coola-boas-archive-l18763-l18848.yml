canonical_text:
  quote: ''
  summary: The passage describes rites performed by youths, including fasting or seclusion,
    purging, sweat-bathing, cold-water and dew washing, prayers for strength and success,
    exercises, archery tests with deer-related targets, work on stone with prayer,
    mountain rites involving a stone, and the acquisition of animal or bird guardian
    spirits through dreams.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Youths purified themselves through vomiting, sweat-bathing, and washing in
    cold water; the cold-water washing is said to occur only after the second mountain
    sojourn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sweat-lodge door faced east and was made of four sticks interwoven with
    fir branches; heated stones were used, commonly eight or four.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: During sweat-bathing, youths struck themselves with nettles, carried cooled
    stones, threw them ahead, and prayed that disease and laziness would leave them
    as the stones did.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the sweat-lodge, youths prayed and sang to the spirit called “The Sweat-bathing
    Grandfather Chief,” asking for strength, agility, wisdom, courage, luck, wealth,
    hunting skill, and protection from bewitchment, sickness, poverty, laziness, and
    fatigue.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After sweat-bathing, youths rubbed plant, mud or silt, and cottonwood-bark
    substances on parts of the body to prevent facial hair and bad armpit odor; they
    gargled water four times for sweet breath and rolled or washed in dew.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some men followed instructions from their spirit concerning painting one side
    of the body or decorating clothing in a particular way.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Youths performed physical exercises, including jumping over bars, running
    hills, long runs or walks, and shooting while running, while praying for speed
    and bodily strength.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Youths practiced archery at marks, including shooting in darkness, moonlight,
    and daybreak.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: One archery target was a deer humerus set horizontally on a stick with the
    open end facing the marksman.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Additional suspended targets could be miniature deerskin figures representing
    a buck, a doe, and a fawn, hung one above another.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: For four successive nights, youths fired four arrows at the targets from about
    thirty yards; if they missed, they ran about a mile and returned to shoot again,
    potentially continuing all night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Success or failure at the archery targets was interpreted as an indication
    of future hunting ability and preferred prey; hitting the bone indicated skill
    at hitting vital places.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Giving the first squirrel, chipmunk, or grouse shot to an old person to eat
    was said to bring future hunting luck.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A youth made round holes in rocks or boulders with a hand-held jadeite adze,
    working at night and praying to Stone for arm strength, tirelessness, and dexterity.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: At certain peaks and lonely mountain places, some youths set up a stone, danced
    and sang around it, and shot an arrow at it; if the stone moved or cried out,
    this signified success in becoming great hunters.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The rites continued until the lad dreamed of an animal or bird, after which
    that animal or bird became a protector or guardian spirit for life.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: Guardian spirits were said to help, protect from danger, impart power, magic,
    and knowledge of the worlds of the living and the dead, and provide a song for
    summoning them.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: After receiving a guardian spirit, lads painted their faces with designs symbolic
    of the spirit, decorated clothing according to its instructions, hunted the dreamed
    animal or bird, and preserved its skin entire after killing it.
  category: sequence
  evidence_refs:
  - ev:11
