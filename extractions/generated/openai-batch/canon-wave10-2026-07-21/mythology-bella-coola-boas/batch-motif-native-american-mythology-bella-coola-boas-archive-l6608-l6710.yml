canonical_text:
  quote: ''
  summary: The passage concludes a story in which a man breaks a promise to his Wolf
    wife by meeting his former wife; the Wolf wife leaves with their son, and the
    man follows them through mountains, cave, and water into another world, where
    he recovers them and lives in the country of the Wolves. The passage then begins
    a Snu'llal tradition about G-a'waté's scab-covered son, his failed marriages,
    a matching wife, and a journey using mountain-goat tallow and eagle-down along
    creeks.
  language: English
  quote_policy: summarized
