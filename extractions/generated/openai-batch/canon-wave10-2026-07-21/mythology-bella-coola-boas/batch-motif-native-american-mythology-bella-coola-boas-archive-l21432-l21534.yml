canonical_text:
  quote: ''
  summary: The passage lists Thompson Indian medicinal preparations and practices
    for illnesses and bodily conditions, including plant decoctions, washes, powders,
    sweat-baths, cold-water washing, rattlesnake-bite treatment with tied buckskin
    strings and shamanic incantations, purification remedies, a cradle-padding use,
    and a poison made from roasted toad grease.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage enumerates remedies for colds, sore throat, stomach ailments,
    vomiting, hair loss, pains, sores, burns, sickness from a dead body, purification,
    blisters, and other conditions.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For rattlesnake bite, wet buckskin strings rubbed with red ochre and attached
    to a weasel or ermine head are tied above the wound, then moved higher after swelling;
    cutting, burning, sucking, herbs, and shamanic incantations are also used.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The rattlesnake-bite incantations are attributed to shamans who have the rattlesnake
    as their guardian spirit.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Purification uses plant decoctions and washes, including Shepherdia bark,
    Heracleum root, juniper stems and needles, spruce needles and young shoots, Douglas-fir
    branches or twigs, and herbs rubbed on the arms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: For blisters on the feet after walking on rotten matter such as decomposed
    salmon full of worms, the affected person does not walk again until sunset and
    then washes the feet in cold water.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A poison may be made by roasting a large toad in the sun or before a fire,
