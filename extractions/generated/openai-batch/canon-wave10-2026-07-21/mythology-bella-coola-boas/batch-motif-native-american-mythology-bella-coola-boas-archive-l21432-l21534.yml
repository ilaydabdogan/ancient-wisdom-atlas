  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says the victim of the toad-grease poison dies when the throat
    swells.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sweat-bath is described as used partly for purification and partly for
    hygienic and curative purposes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Nicola band washed in cold water before entering the sweat-house, while
