canonical_text:
  quote: ''
  summary: The passage describes a cricket song whose tune imitates a cricket chirp
    and whose words ask listeners to mend or fuel the fire. It then describes Thompson
    and Spences Bridge-area feast and potlatch dances involving gifts, singing, drums,
    animal and bird imitation, enacted hunting scenes, costumes, rattles, face paint,
    down worn in the hair, and possible northern Shuswap influence. A concluding note
    states that Thompson culture resembles other western plateau cultures and shows
    influence from Plains and North Pacific coast cultures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A song called the cricket song imitates the cricket's chirp, and the cricket
    is said to say words equivalent to mending or fueling the fire.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dances take place at potlatches and other festivals.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: One or more dancers, often women, dance until out of breath and then hold
    out a dress or blanket as a present to the guests.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sometimes a man dances while holding a rifle, performs manoeuvres, utters
    grunts and exclamations, and then gives the rifle to the guests.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some dancers imitate birds and animals such as prairie-chicken, hare, or goose
    in sound and gesture.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Some dances enact the actions of animals while feeding and the hunting of
    them, causing amusement among onlookers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The animals chosen for imitation were said to have motions suited to this
    dance and were seldom guardian spirits; they were not the guardian spirits of
    the persons imitating them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Some people thought the custom of imitating birds in these dances may have
    been copied from the northern Shuswap.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: Northern Shuswap exhibitions included animal dances on a large scale, especially
    imitations of moose and caribou, with dancers dressed to resemble the animals
    including antlers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In northern Shuswap-style animal dance exhibitions, several men acted out
    rutting-season actions, hunting, final death, shooting, and skinning of the animals.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Hunters in the enacted hunt painted their faces in perpendicular red and black
    stripes.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Many actors held rattles made of cow's or sheep's horn with shot inside.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: Some women danced facing guests, hissing, moving body, head, and arms, or
    advancing and receding; sometimes women advanced toward the speaker and gave or
    received presents.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: A principal giver of presents might dance to drum and song, and a guest who
    praised the dancer was entitled to a present.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Chief or best singers sat in a circle around the drummer or leader of the
    singing.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:16
  text: At potlatch dances, some men and women formerly put bird down on their hair;
    eagle down was excluded because it was considered the special property of the
    shaman.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:17
  text: Some people kept down in bags made of bow-snake skin and painted their faces
