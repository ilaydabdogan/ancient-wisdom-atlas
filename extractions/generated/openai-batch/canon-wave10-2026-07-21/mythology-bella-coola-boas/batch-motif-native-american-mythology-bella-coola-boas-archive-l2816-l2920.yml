canonical_text:
  quote: ''
  summary: The passage describes a wedge holding open the mouth of the sky; the world
    as an island in the ocean fastened to a giant-held stone bar; an ocean being whose
    swallowing and releasing of water causes tides; the lower ghost country, its entrances,
    social layout, return and no-return rules, and second death; a second account
    of travel to the ghost country by canoe and by the trail of the dead; and the
    beginning of a tradition in which Winwi'na seeks to bring salmon from their far-western
    land to the Bella Coola River with animal help.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An opening called K-awa'umsta is described as the mouth of the sky kept open
    by a wedge, and Masmasala'nix says the wedge will prevent the sky from bursting
    again.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The human world is called the land below and is described as an island swimming
    in the boundless ocean.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A giant in the far east sits with legs apart and holds a long stone bar to
    which the earth is fastened by two stone ropes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the far-eastern giant adjusts his hold or moves the earth, the passage
    explains earthquakes, epidemics, and the disappearance of sickness.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Séisats lives in the ocean, swallows and releases seawater twice daily, and
    this action is given as the cause of tides; a ceremonial mask represents him with
    white stripes for sea levels.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The world below is the country of the ghosts, called Asiuta'nEm, and one stated
    entrance is a hole in each house between the doorway and the fireplace.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ghost country stretches along sandy banks of a large river and includes
    a hill with sharp stones; summer here is winter there, and night here is day there.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ghosts are said to walk on their heads, speak a different language, receive
    new names upon arrival, and live in a fenced village.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The ghost dancing-house is below each village burial-place, is large and long,
    has four fires, and places women on the floor while men sit on an elevated platform.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Newly arrived ghosts enter the dancing-house through the smoke-hole by means
    of a rope ladder, with two men standing at the foot of the ladder.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A person who has entered the ghost dancing-house cannot return to earth; souls
    may ascend the rope ladder to the lower heaven and be sent by deities to be born
    again in the same family, while those who remain die a second death and sink to
    a second lower world from which there is no return.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Another account says an old man reached the ghost country in his canoe, saw
    a trail of the living and a trail of the dead, followed the trail of the dead,
    and reached a village with a dancing-house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The land of the salmon, Mia'ltoa, is situated in the far west; salmon leave
    it in early spring to ascend rivers and return to it in the fall.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Winwi'na, living at Q'o'mqitis, wishes salmon would ascend the river and dreams
    that with the help of all animals he has made war on and vanquished the salmon,
    after which salmon ascend Bella Coola River.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Winwi'na gathers the animals, states his wish to go to Mia'ltoa, proposes
    war on the fish, and says he will take slaves and place them in the river; Mink
    asks how they are to assist him.
  category: speech
  evidence_refs:
  - ev:8
