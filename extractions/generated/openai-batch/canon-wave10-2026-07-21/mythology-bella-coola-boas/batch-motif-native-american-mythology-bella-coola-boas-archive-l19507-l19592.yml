canonical_text:
  quote: ''
  summary: The passage describes mourning customs and restrictions for widows, widowers,
    and orphans, including bed arrangements with plant materials, washing rules, food
    and work taboos, restrictions on fishing and hunting, beliefs about harmful contact,
    hair-cutting and body thongs after death, grave markers, carved ornaments, and
    burial or grave goods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Widows and widowers used rosebush-sticks and other plant materials in or near
    the bed, slept with the head toward the north rather than the west, and some wore
    twigs in buckskin on the body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Widows and widowers were required to wash in creeks and clean themselves with
    fresh fir-twigs morning and evening for a year; failure was said to bring sore
    throat, loss of voice, or loss of sight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Widows and widowers were forbidden several foods for one year and abstained
    from smoking for half a year.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A widower was not to fish at another man's fishing-place or with another man's
    net, because doing so would make the station and net useless for the season.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before releasing a trout transplanted to another lake, a widower blew on the
    fish's head, spat chewed deer-fat grease on it, bid it farewell, and asked it
    to propagate and become plentiful.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Grass or branches on which a widow or widower sat or lay were said to wither;
    if a widow broke sticks or branches, her hands or arms would also break.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A widow was not to pick berries, cook food, fetch water for her children,
    let her children lie on her bed, or sit or lie where they slept.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some widows wore a dry bunch-grass breech-cloth for several days so that the
    husband's ghost should not have connection with them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A widower was not to fish or hunt, and when on horseback he generally tied
    a small piece of fir-branch to the horse's mane or saddle horn.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A widower did not allow his shadow to pass in front of another widower or
    a person believed to have more knowledge or magic than ordinary.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Breath gestures directed at the fingers or body were said to make widows or
    widowers grow thin or stout.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: An orphan, widow, or widower was told to eat few but hearty meals, since eating
    little and often would make them always hungry.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: On the fourth day after a death, the widow or widower cut the hair short;
    the detached hair was tied in a knot, fastened to a stone, and thrown into the
    river.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: On the same day, buckskin thongs were tied around parts of the body, sometimes
    with rosebush-wood attached, and fir twigs were worn in belts or shirts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Grave customs described include obsolete conical tents, canoes, and wooden
    figures; later flags, streamers, guns, and blankets; and more recent fences, crosses,
    and money nailed to crosses.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: Small carved figures of birds, the moon, canoes, and similar forms were placed
    on some graves as ornaments, not usually as representations of guardian spirits.
  category: object
  evidence_refs:
  - ev:9
- id: obs:17
  text: Some people still buried articles with the deceased, wrapped or placed blankets
    on the coffin, and hung hats, babies' cradles, and other articles near graves.
  category: object
  evidence_refs:
  - ev:10
