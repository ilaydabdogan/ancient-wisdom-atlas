  text: An antler dagger or knife over one foot long was found at the large burial-place
    at Kamloops, with a worn hole near the upper end that may have held a thong.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A pointed implement made from the thin edge of a large bone had a broken handle,
