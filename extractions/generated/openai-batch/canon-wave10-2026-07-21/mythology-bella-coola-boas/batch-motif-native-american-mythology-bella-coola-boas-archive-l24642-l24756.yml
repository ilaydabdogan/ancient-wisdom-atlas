canonical_text:
  quote: ''
  summary: The passage describes archaeological finds from the Thompson River region,
    including antler and bone knives or spear-points, skins and vegetable-fibre fabrics
    from graves, mats used as body wrappings, cord bindings, bark fibres possibly
    used for carrying fire, pigments and ornaments for body or clothing decoration,
    head-scratchers or hair/nose ornaments, and copper pendants.
  language: English
  quote_policy: summarized
