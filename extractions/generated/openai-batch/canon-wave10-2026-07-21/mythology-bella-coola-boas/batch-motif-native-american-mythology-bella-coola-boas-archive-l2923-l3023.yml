canonical_text:
  quote: ''
  summary: Winwi'na has a self-moving canoe built and leads clouds, birds, animals,
    and the Hermaphrodite westward to the country of the Salmon. The party invisibly
    carries away male and female children of several fish kinds, gathers berries at
    another place, returns to Bella Coola, releases the fish into the river, assigns
    seasons for salmon arrival and berry ripening, and feasts the companions. The
    passage then lists mythical names and describes a belief that Winwi'na's canoe
    returns annually from the Salmon country, followed by another canoe that brings
    the ka'siut ceremonial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The birds agree to depart, and Winwi'na asks Masmasala‘nix to build a canoe;
    Masmasala‘nix makes a self-moving canoe with two names.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Winwi'na starts in the canoe with the clouds, birds, animals, and the Hermaphrodite;
    the Cormorant joins as a passenger near Bella Bella.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The travellers go west for a long time and reach the country of the Salmon,
    described as a treeless vast prairie with a large sun and a Salmon village.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Raven is sent as a spy and reports that the Salmon play on the beach in the
    evening; Mink suggests that this is the best time to carry some away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Several named birds and Cloud state which kinds of salmon or fish they will
    carry away, while Cormorant says he will take whatever he can get.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mink instructs the captors that each must take one male and one female, and
    says they are invisible to the Salmon like ghosts are invisible to humans.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The birds and Mink take one male and one female child of various fish kinds;
    the children faint as though their souls had been taken, while their bodies remain
    where they were playing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Salmon do not see the captors and do not know why the children are fainting.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Qoalé’nia, where many berries grow, the Hermaphrodite goes ashore, picks
    all kinds of berries, and carries them into the canoe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After seven months in the country of the Salmon, the travellers return; Cormorant
    disembarks at Bella Bella with captured Salmon, and the passage says this explains
    salmon at Bella Bella.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the mouth of Bella Coola River, the party throws the fish into the water;
    the Salmon jump and begin to ascend the river.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Winwi'na tells each salmon kind when it is to arrive, scatters berries over
    mountains and valleys, tells them when to ripen, and then gives his companions
    a feast.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage states that the birds and animals in the tradition are called
    by mythical names rather than by their ordinary names, and it lists names for
    salmon, Cloud, birds, Cormorant, and the Hermaphrodite.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: According to the stated Bella Coola belief, Winwi'na's canoe arrives every
    year from the country of the Salmon, stays in Bella Coola country for nine months,
    and then returns.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: When Winwi'na's canoe leaves, another named canoe arrives from S’anok! pta’Itua
    bringing the ka'siut ceremonial, moving through successive points of land over
    four-day intervals before reaching the river mouth.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:16
  text: At the river mouth there is said to be a named house with a named post standing
    in the water in front of it; three named men live in the house, the canoe is tied
    there, and the ka'siut ceremonial begins.
  category: setting
  evidence_refs:
  - ev:9
