    are quarrelsome.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists approved qualities such as purity, cleanliness, honesty,
    bravery, friendliness, hospitality, diligence, modesty, sociality, religiousness,
    honor, gratitude, faithfulness, and industry.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: An elderly man of a household or a chief could speak late at night to advise
    people, especially young people, about how to live with one another, the benefits
    of good conduct, the results of evil conduct, and ideas of future life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During winter nights people spent time in speeches, accounts of war and hunting
    experiences, and mythological stories; old people took turns telling myths and
    legends after others had gone to bed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Disease is said to have been attributed to natural causes, witchcraft, neglect
    of observances, and the influence of the dead.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The neglect of hunters to perform certain observances while hunting was said
    to be followed by sickness, for which animals themselves were held responsible.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some people claimed that all sickness comes from the east.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: Natural diseases were generally treated with enumerated medicines, chiefly
    decoctions or preparations of plants, with some animal-part and ash preparations
    also listed.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
- id: obs:9
  text: Severe or sudden pains were treated by drinking water in which dried beaver
    testicles had been soaked, after which the testicles were dried and kept for future
    use.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Colic or cramps in the bowels or stomach were treated with hot fir-branches,
