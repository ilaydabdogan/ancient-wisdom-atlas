canonical_text:
  quote: ''
  summary: The passage describes Nana’tskuit establishing a house with an eagle-topped
    post, Raven traveling to copper and abalone countries and receiving ceremonial
    items and names, Raven settling near another village with his sister, and Crane
    arriving to give Raven supernatural powers, fish, and a captured pitch-covered
    sea monster; the passage ends with Crane harpooning a large canoe of singing people.
  language: English
  quote_policy: summarized
