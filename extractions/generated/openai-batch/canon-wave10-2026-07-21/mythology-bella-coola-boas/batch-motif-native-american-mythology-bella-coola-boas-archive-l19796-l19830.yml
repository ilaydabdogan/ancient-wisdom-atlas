  category: setting
  evidence_refs:
  - ev:4
- id: obs:12
  text: A person who sees these apparitions is said to die shortly afterward, and
    people passing within sight of such places turn their faces away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: At a lake between three mountains near Foster's Bar, strange mysteries may
    appear as logs crossing the lake with dogs running on them, empty canoes crossing,
    and ice changing into people who run along the shore; these apparitions vanish
    and are considered an evil omen.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: A mountain lake near the country of the Coast tribes is said never to freeze
