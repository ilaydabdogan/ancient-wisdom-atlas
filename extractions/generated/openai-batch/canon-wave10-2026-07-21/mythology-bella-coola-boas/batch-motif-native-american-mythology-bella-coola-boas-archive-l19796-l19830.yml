canonical_text:
  quote: ''
  summary: The passage records explanations for thunder, lightning, fog, lakes, rivers,
    fish in ponds, fire, water, and mysterious beings. It describes the Thunder-bird
    shooting arrows with its wings, fog as earth steam or as caused by Coyote, a deluge
    survived by Coyote and three men, fire and water being liberated from animal possessors,
    and dangerous apparitions associated with mountain peaks, lakes, cascades, and
    a nonfreezing lake near Coast tribes.
  language: English
  quote_policy: summarized
