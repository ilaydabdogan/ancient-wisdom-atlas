literal_observations:
- id: obs:1
  text: Pipe tomahawks and other steel or iron tomahawks and hatchets were used in
    recent times and were procured from the Hudson Bay Company and the Okanagon.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: One coat of mail was a cuirass made of four boards, laced with buckskin and
    covered with thick elk-hide.
  category: object
  evidence_refs:
