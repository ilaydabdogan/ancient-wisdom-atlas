- id: obs:3
  text: A vest of armor was made from narrow vertical strips of wood or rods, laced
    with bark strings and held over the shoulders by thongs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some armor vests were covered with elk-skin, fringed, painted with animal
