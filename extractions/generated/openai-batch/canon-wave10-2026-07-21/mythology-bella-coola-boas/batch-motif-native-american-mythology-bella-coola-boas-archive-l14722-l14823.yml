canonical_text:
  quote: ''
  summary: 'The passage describes Thompson deer and elk hunting methods: deer-fences
    with spring-pole snares, deer-trail nooses, organized drives with leaders, marksmen
    and drivers, division of deer carcasses, hunting with nets and corrals, cliff
    drives, and winter pursuit with snowshoes or dogs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A deer-fence included openings wide enough for deer, shallow holes at the
    openings, bark-string snares, and spring-poles held by trigger mechanisms.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The snare mechanism was hidden with dry spruce-needles and arranged so that
    a deer stepping in the opening would release the spring-pole.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the deer placed its foot in the snare, the spring-pole tightened the
    snare around the leg and lifted or suspended the animal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Lower Thompsons are said not to have used deer-fences much, and instead
    set nooses on deer-trails that caught the head or antlers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Small groups of hunters walked over prescribed ground at a distance from each
    other and met at set points for consultation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In large hunting parties, an experienced leader directed a drive, marksmen
    were stationed where deer were expected to go, and drivers moved in a crescent-shaped
    line.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Driven deer were forced toward the bottom of a gulch or toward the center
    of a valley, where hunters shot them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The oldest hunter present generally divided the deer into nine pieces.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When hunters were few, drivers shouted; women and boys could be pressed into
    service; and in flatter open country deer were sometimes hunted on horseback.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Formerly deer were caught in bark nets set as corrals or across deer-trails,
    and deer were shot, driven into the nets, or found unable to leave the corral.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Large hunting parties sometimes killed elk by driving them over cliffs bordering
    plateaus.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In deep mountain snow, deer and elk were run down by hunters on snowshoes
    or by dogs, then shot or clubbed when near enough.
  category: action
  evidence_refs:
  - ev:7
