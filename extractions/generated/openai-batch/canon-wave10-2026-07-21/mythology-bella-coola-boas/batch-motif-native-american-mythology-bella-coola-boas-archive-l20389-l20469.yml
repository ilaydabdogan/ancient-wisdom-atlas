canonical_text:
  quote: ''
  summary: The passage describes Thompson practices and beliefs concerning sunflower-root
    preparation, first seasonal foods, first tobacco smoking, and neighborhood festivals.
    It includes ritual restrictions, facial painting, divination with fir branches,
    prayers addressed to Sunflower-Root and tobacco, smoke gestures for breath and
    health, occasional smoking to the sun and four quarters, and an authorial note
    interpreting such customs as animistic or nature-oriented.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women cooking or digging sunflower-root are required to abstain from sexual
    intercourse, and a man must not come near the oven while women are cooking the
    root.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women going to dig sunflower-root sometimes paint the whole face red or paint
    a large black or red spot on each cheek.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Four long, thin fir branches are sometimes placed with their small ends spread
    near the bottom of the oven and their thick ends tied and raised above the center.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the roots have cooked for a while, the fir branches are pulled out,
    and their color is used to determine whether the roots will cook successfully.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dark or black branches indicate successful cooking, while spotted or light-colored
    branches indicate the reverse.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Successful cooking of sunflower-roots is sometimes attributed to Coyote urinating
    on them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Young people, when first eating seasonal berries, roots, or other products,
    address a prayer to Sunflower-Root asking for help in ascending and reaching mountain
    tops and avoiding clumsiness.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Omitting the first-food prayer is said to make the eater lazy and cause long
    sleeping in the morning.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the first tobacco ceremony, an elderly man assembles adult male smokers
    and smoking women, often outside the lodge after sunset, and announces that the
    tobacco, called chief, will be cut up.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The elderly man cuts tobacco, mixes it with roasted bearberry leaves, fills
    and lights a large pipe, and passes it to each person following the sun’s course.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Each smoker takes one whiff, blows smoke downward between the fingers and
    over the breast, rubs the chest and shoulders, and prays to tobacco for lengthened
    breath, freedom from sickness, and long life.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Some men are said to have smoked to the sun, or to the sun and the four quarters;
    smoking is described as a privilege of people with mysterious powers, including
    shamans and others.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: People of each neighborhood meet at intervals for feasting, dancing, and praying,
    with winter dances in large winter houses and fine-season dances outdoors at certain
    places.
  category: setting
  evidence_refs:
  - ev:9
