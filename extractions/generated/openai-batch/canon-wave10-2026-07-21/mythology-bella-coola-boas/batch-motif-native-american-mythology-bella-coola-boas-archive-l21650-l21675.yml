canonical_text:
  quote: ''
  summary: The passage lists dream signs and other omens said to predict death or
    recovery. Dreams of westward or southward disappearance, midstream disappearance,
    eating food from dead people, stream crossing, or ghosts on a bed indicate death,
    while turning back, coming ashore, or ascending a height indicates recovery. It
    also states that dream-portended events may be avoided by face painting, a sweat-bath,
    and prayers, and lists death omens involving head itching in an orphaned person,
    an apparition near a house, and pipe-smoking divination.
  language: English
  quote_policy: summarized
