- id: obs:2
  text: After woods on the mountain burned, the Hau’hau moved to Nuto’Lk’6L, near
    a stone pillar described as similar in appearance to a tree, and was later heard
    in Nuto’tk’ou.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Four men went mountain-goat hunting, made an evening fire, slept with their
