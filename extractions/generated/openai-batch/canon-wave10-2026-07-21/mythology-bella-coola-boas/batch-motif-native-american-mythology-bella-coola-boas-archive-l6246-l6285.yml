canonical_text:
  quote: "“The Hau’hau lives on the mountain Nusla’xem, in a large cave.”"
  summary: The passage describes the Hau’hau as a large-winged being associated with
    a mountain cave and later a tree-like stone pillar. It then recounts how four
    mountain-goat hunters camped by a fire; three were killed by Hau’hau beings, while
    the survivor shot at the attacking beak and later discovered many dead Hau’haus
    below a precipice. He returned to the village, reported the deaths, and the dead
    men were buried in boxes on pole tops inside a fence.
  language: English
  quote_policy: quoted
