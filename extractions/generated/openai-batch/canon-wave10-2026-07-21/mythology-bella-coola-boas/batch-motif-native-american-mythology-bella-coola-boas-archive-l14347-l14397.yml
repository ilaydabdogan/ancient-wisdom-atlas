canonical_text:
  quote: ''
  summary: The passage describes bow and arrow construction, regional use of a particular
    bow type, bow and arrow ornamentation, arrow-making techniques, stone and iron
    arrow-head materials, a belief that some large chipped arrow-heads were made by
    Raven, and distinctions between war-arrows and hunting-arrows.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mounted bow is described as having double curvature, bird-cherry bark winding,
    yellow-dyed horsehair ornament, and an eccentric twine string used when sinew
    is unavailable.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A similar bow shown as Fig. 219 is wound with bird-cherry bark and has ends
    covered with flattened goose-quills.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Fig. 219 bow type is said to have been in common use among the Okanagon,
    the Athapascan tribe of Nicola Valley, the Nicola band, and some men of the Spences
    Bridge band, while other bands did not use it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Okanagon-type bow was held perpendicularly and used a secondary arrow-release,
    while other bows were held horizontally and used a primary release.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Simple bows were used for shooting birds and small game.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bows were sometimes painted or adorned with red-filled incised lines, woven
    dyed quills, quill-embroidered buckskin, and red-headed woodpecker scalps attached
    to the ends.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A hand-guard protected the back of the thumb on the bow hand, especially with
    Okanagon-type bows.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Arrows were made of rosewood or service-berry wood, soaked in warm water,
    straightened with the teeth, and sometimes polished with an arrowshaft-smoother.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Arrow feathering used either three split feathers applied spirally or two
    whole feathers laid flat, fastened with deer-sinew and pitch.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Arrow-heads were made of glassy basalt from named source areas, and some were
    made from large chipped heads found in valleys.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that the Indians believe the large chipped heads found
    in valleys were made by Raven.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: War-arrow heads were inserted parallel to the nock, while hunting-arrow heads
    were inserted at right angles to the nock; war-arrow points were generally barbed
    and hunting-arrow points leaf-shaped.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Indians maintain that the described orientation of arrow-heads allows
    the head to penetrate more easily between the ribs.
  category: speech
  evidence_refs:
  - ev:6
