canonical_text:
  quote: ''
  summary: 'The passage describes several Thompson Indian rites and beliefs: fertility
    practices involving eating particular animal parts, a mother’s mountain rite for
    protecting an infant and herself from sickness or bewitchment, disposal of an
    outgrown cradle in a tree, birth-order luck beliefs and birth feasts with elder
    blessings, and a winter ordeal in which children may avoid or undergo whipping
    with service-berry switches, followed by disposal of the whip in the river and
    washing in cold water.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women seeking children ate a roasted mouse of a specified species, and women
    sometimes ate a buck’s penis in order to bear male children.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a mother first took her baby to a high mountain root-digging place, she
    hung the baby in its carrier on a broken tree limb.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mother painted her face, and sometimes the top of her head, red and danced
    before the infant, sometimes all night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mother made a blowing and throwing-away gesture that the passage identifies
    as symbolic of taking disease or evil from the infant and casting it away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mother prayed to the spirits of the place or to the mountains for the
    child’s protection from sickness, death, and bewitchment.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The mother also prayed for herself while kneeling, spitting on her hands,
    and rubbing her body upward and over her head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the child outgrew the cradle, the cradle was suspended from a tree branch
    away from the village and was not used again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: First-born and second-born children were regarded as heavier of foot and unlucky,
    especially in hunting, while the youngest child was considered luckiest.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: At a child’s birth, the father generally gave a feast to neighbors, and an
    old man or woman might hold and bless the child.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The father gave a skin to the person who blessed the child.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: A winter ceremony called “whipping the children” was generally performed twice
    a year in winter houses.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: An elderly man made a whip from long thin service-berry switches, struck the
    house hole four times, entered, and asked who would pick his berries.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: A woman could avert the children’s ordeal by dancing opposite the man and
    pretending to pick berries from the switch into her basket.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: An adult substitute could avert the children’s ordeal by taking four lashes
    across the back.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: If no one intervened, children around eight years old and older came forward
    one by one to dance, sing, and pretend to pick berries into a basket.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Children who refused the berry-picking performance could be struck four times
    over the bare back, and a lad might request more lashes to show endurance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: A boy who met the flogger, spoke to him, held out his hands, and blessed him
    was generally exempt from flogging.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: The remains of the whip were always thrown into the river, and after the ceremony
    all children were sent to wash in cold water.
  category: sequence
  evidence_refs:
  - ev:7
