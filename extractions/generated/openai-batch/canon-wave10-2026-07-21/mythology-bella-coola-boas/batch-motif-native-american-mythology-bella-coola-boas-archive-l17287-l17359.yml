canonical_text:
  quote: ''
  summary: 'The passage describes Thompson social organization: chieftaincy based
    on qualifications with some father-to-son descent, informal male councils, election
    of war-chiefs and use of heralds, treatment and incorporation of captives, limited
    totem claims at Spuzzum, kin-based obligations of vengeance, hereditary family
    names traced to ancestors, and child-naming practices.'
  language: English
  quote_policy: summarized
