  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Other thin, corroded copper ornaments from the main burial-place may have
    served as bangles or pendants, but their position on the body could not be distinguished.
  category: object
  evidence_refs:
  - ev:2
