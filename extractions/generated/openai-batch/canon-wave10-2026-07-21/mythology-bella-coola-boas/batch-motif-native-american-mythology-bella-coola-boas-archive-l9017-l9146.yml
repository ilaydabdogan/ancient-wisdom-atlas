  summary: Archaeological description of ornaments and beads from Lytton graves and
    sites, including copper, stone, mica, shell, bone, tooth, dentalium, olivella,
    and red cedar bark string. The passage notes uncertain placement of objects on
    decayed bodies, possible uses as pendants, bangles, hair ornaments, necklaces,
    or fringes, and cautious comparisons with coastal and Alaskan ornament forms.
