canonical_text:
  quote: ''
  summary: The passage describes seasonally regulated canoes associated with Bella
    Coola calendrical divisions and divine arrivals, then describes cave-dwelling
    and woodland deities who initiate people or shamans through fainting, visionary
    encounters, bodily signs, songs, and a journey to the country of the ghosts from
    which the initiate is turned back before entering the ghosts' dancing-house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Smaya’na is said to be considered a human being, and his children make a canoe
    go up Bella Coola River with the rising tide from the river mouth to the mountain
    Smaya’na in a single tide.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two named canoes, No’ak‘nEm and Kunkunu’qtstuts, alternate in staying, leaving,
    and returning, and the gods of the House of Myths are said to come to Bella Coola
    villages in No’ak‘nEm.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The arrival and departure of the canoes are said to be strictly regulated
    by the Bella Coola calendar, which divides the year around winter and summer solstices
    and named months.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: When No’ak‘nEm arrives, a deity called Anatlikuts’ai’x opens the door of her
    cave dwelling; there is said to be one deity of this name for each village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An Anatlikuts’ai’x is described as stepping outside, standing before her house,
    and dancing with trembling hands; a person who sees her faints, and his soul is
    taken into her house and initiated into the secrets of the ku’siut.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A woman named Nustsxoaxlo’stxuit is said to live at a particular Nuskésit’tsta
    near Bella Coola River; she is described as emaciated, black-skinned, and wearing
    a black blanket, and an ancient chief who first saw her was initiated, returned,
    danced, told what he had seen, and then died.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A deity named Lataia’iL or Sxai’éxoax is described as a special initiator
    of shamans who lives in the woods and carries a wooden wand wound with red cedar-bark.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Lataia’iL wears a large neck ring made of bear-skin strips and red cedar-bark,
    plays in mountain ponds, makes water boil when he jumps into it, and causes menstruation
    in women and nosebleeding in men who meet him.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: When initiating someone, Lataia’iL touches the person's chest with his wand,
    paints the person's face with a rainbow design, and swings the wand so that its
    noise causes the listener to faint.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A shaman initiated by Lataia’iL reports seeing him often and being told who
    will die or become sick; blackened bodies and people dancing on their heads are
    described as signs of imminent death.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the country of the dead, the shaman sees deceased relatives in a house;
    they weep and tell him not to come so soon, and a chief's speaker calls people
    to the ghosts' dancing-house.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: At the entrance to the ghosts' dancing-house, reached over a narrow plank,
    Lataia’iL takes hold of the shaman, turns him around, and tells him to return
    because entering would prevent his return; the shaman then revives and has Lataia’iL
    as a supernatural helper.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: Jacobsen's cited description says a youth seeking Kle-klati-e’il in the woods
    faints on meeting him, recovers with a song given by the spirit, becomes a shaman,
    and later receives new songs from repeated encounters with the guardian spirit.
  category: sequence
  evidence_refs:
  - ev:12
