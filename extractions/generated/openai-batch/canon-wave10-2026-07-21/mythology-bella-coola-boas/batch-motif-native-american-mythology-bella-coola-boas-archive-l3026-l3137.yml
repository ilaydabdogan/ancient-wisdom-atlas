- id: claim:1
  claim: The passage itself identifies Jacobsen's Kle-klati-e’il, bracketed as Laxaia’iL,
    with the previously described Lataia’iL/Sxai’éxoax spirit and presents a closely
    matching shamanic-initiation function involving a woodland encounter, fainting,
    and cedar-bark-associated spirit attributes.
  claim_level: same_function
  target: A. Jacobsen's cited account of Kle-klati-e’il [Laxaia’iL]
  evidence_refs:
