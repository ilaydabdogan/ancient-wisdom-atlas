canonical_text:
  quote: ''
  summary: Boas discusses Bella Coola social organization, endogamy, guarded clan
    traditions, contradictory family variants of Coast myths, prayers to Senx or Ta’ata
    resembling Tsimshian prayers to Laxha, and the borrowing and reinterpretation
    of ka’siut secret-society and cannibal ceremonial customs across Bella Coola,
    Kwakiutl/Bella Bella, and Tsimshian traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bella Coola village communities are described as generally having four ancestors,
    usually three men and one woman, who are called brothers and sister but are said
    to have been created independently by Srenx and therefore not necessarily treated
    as blood relatives.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kwakiutl village communities are contrasted as descendants of one single being,
    making them relatives who are forbidden to intermarry.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Boas states that Bella Coola clan traditions were acquired partly through
    intermarriage with Coast tribes and partly by independent invention, and that
    endogamy helped prevent traditions from spreading through the whole tribe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Families are described as guarding their clan traditions from other families,
    producing inconsistent and contradictory traditions within the tribe.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: 'Different Bella Coola families are said to assign major world-changing acts
    to different figures: Raven liberates the sun, Mink helps bring about the present
    state of affairs, and Totoso’nx causes the sun to appear.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage notes discrepancies in traditions about Mink and Wasp visiting
    their father, the Sun.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bella Coola prayers to Senx or Ta’ata are said to resemble Tsimshian prayers
    to Laxha, the sky; both involve the idea that when the Sun wipes his face there
    will be clear weather and human happiness.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ka’siut ceremonial, secret societies, and ceremonial cannibalism are described
    as customs borrowed by the Bella Coola from Coast tribes; the ceremonies and paraphernalia
    of the Bella Coola and Kwakiutl are described as practically identical.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In a Bella Bella and Kwakiutl tradition, a forest spirit named Baxbakualanuxsi’waé
    lives in the forest and initiates members of the Cannibal Society.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A Tsimshian tradition says that secret societies were introduced by a hunter
    who was taken inside a cliff by a white bear and saw a house where the societies
    were performing ceremonies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Boas concludes that the same ritual is practiced by distinct tribes but explained
    by distinct myths, and infers that the ritual is older than the explanatory myths.
  category: other
  evidence_refs:
  - ev:8
