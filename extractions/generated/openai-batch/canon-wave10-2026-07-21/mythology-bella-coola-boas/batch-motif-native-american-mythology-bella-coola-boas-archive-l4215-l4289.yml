canonical_text:
  quote: ''
  summary: The passage gives several origin traditions. It names A’tsta and the house
    Tla’palst with its canoe painting T!kun; recounts Stsk-é’ir ancestors descending
    from heaven with olachen and the daylight box, while Raven stops a cold mountain
    wind with a canoe-pole; presents another Stsk-é’ir origin in which the Sun makes
    Q’éét/Eq’ora’m and Aqla’m, who descend with the light-giving nusxé’mta and establish
    houses and marriage ties; and gives the Nuse’ex tradition in which the Sun sends
    two Ravens and their Crow sister, the elder Raven breaks the nusxé’mta to liberate
    the sun, travels by water, receives a cedar canoe, builds at Nuse’éx, and encounters
    copper-associated women whom he calls sisters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man later had a daughter named A’tsta, took the name Ix-ialxotsai’x, named
    his house Tla’palst, and had a front painting representing a canoe called T!kun.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: One Stsk-é’ir tradition names a group sent down to Skold’k-L from heaven;
    before departure Masmasala’nix gave them olachen, and they carried the nusxé’mta,
    the box containing daylight.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker emtenk:ai’x caused the olachen to disappear and later reappear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A cold wind blew down mountain Skolo’k't; Raven pushed his canoe-pole upward
    toward the mountain, causing the wind to stop, and the mountain’s name is explained
    as meaning “canoe-pole.”
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In another Stsk-é’ir tradition, the Sun made Q’éét/Eq’ora’m and Aqla’m, gave
    Q’éét the skin of the bird Q6’x6x for dances, and the two men sat four days at
    the foot of the pole before descending to earth with the nusxé’mta lighting their
    way.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Q’éét married Qoa’lsant’s daughter, then married chiefs’ daughters in many
    named villages; his wives gave him their houses, he returned home, and he left
    his children with their mothers.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Q’éét had two named men guarding the entrance to his house.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the Nuse’ex tradition, the Sun sent two Ravens and their sister the Crow
    down to Lxtsaétx, and they carried the nusxé’mta, in which the sun was kept.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The elder Raven broke the nusxé’mta after the younger brother refused; the
    sun was liberated, and the brothers took the names Kunkune’m and Xémlai’x.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Kunkune’m traveled to Satsq, built a house near a lake, caught animals, sought
    people, and met an eagle with a human face and then a bird named ALmena’m.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: ALmena’m made Kunkune’m a canoe by burning out a cedar tree and gave him a
