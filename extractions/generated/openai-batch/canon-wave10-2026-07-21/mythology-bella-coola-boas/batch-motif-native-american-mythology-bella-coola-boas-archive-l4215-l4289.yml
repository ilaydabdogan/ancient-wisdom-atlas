candidate_motifs:
- id: motif:1
  label: Heavenly descent carrying daylight and food
  taxonomy_refs:
  - culture_hero
  basis: The Stsk-é’ir ancestors are sent down from heaven with olachen and the daylight
    box, and another version has Sun-made men descend with the nusxé’mta lighting
    their way.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: The passage states descent and carriage of daylight/food but does not
    explicitly call the figures culture heroes.
- id: motif:2
  label: Sun or daylight contained in a box and released
  taxonomy_refs: []
  basis: The nusxé’mta is described as a box containing daylight in one tradition
    and containing the sun in another; in the Nuse’ex account the elder Raven breaks
    it and liberates the sun.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: high
  cautions: The passage does not describe the box as stolen or explain how the sun
    came to be inside it.
- id: motif:3
  label: Raven alters natural conditions
  taxonomy_refs:
  - culture_hero
  basis: Raven stops a cold mountain wind with a canoe-pole, and the elder Raven breaks
    the sun-containing box to liberate the sun.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: medium
  cautions: The two Raven episodes occur in different traditions within the passage
    and may not identify the same individual Raven.
- id: motif:4
  label: Ancestor establishes inter-village marriage and house relations
  taxonomy_refs:
  - royal_legitimacy
  basis: Q’éét marries chiefs’ daughters in many villages, receives their houses,
    gains relatives in many places, and leaves children with their mothers.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The link to royal or chiefly legitimacy is inferred from marriages to
    chiefs’ daughters and house transfer; the passage does not explicitly state a
    political doctrine.
- id: motif:5
  label: Named place explained by ancestral action
  taxonomy_refs: []
  basis: The mountain’s name is explained as meaning “canoe-pole” because Raven stopped
    the wind by pushing a canoe-pole toward it.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is an etiological naming pattern limited here to one mountain name.
- id: motif:6
  label: Canoe-assisted search for a new home
  taxonomy_refs:
  - departure
  basis: Crow tells the brothers to leave and seek a new home; Kunkune’m travels,
    receives a cedar canoe and paddle, reaches Nuse’éx, and builds a house.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The taxonomy term is broad; the passage emphasizes settlement travel rather
    than an explicit heroic departure cycle.
comparison_claims:
- id: claim:1
  claim: The two Stsk-é’ir origin traditions in the passage share a motif of figures
    descending from heaven or from the Sun’s domain with the nusxé’mta providing daylight
    or light on the way to earth.
  claim_level: same_motif
  target: Stsk-é’ir origin traditions within the same passage
  evidence_refs:
  - ev:2
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The first account names a larger group and olachen, while the second
    centers on two men made by the Sun; the passage also says the tradition is not
    quite certain.
