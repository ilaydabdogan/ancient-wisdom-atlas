canonical_text:
  quote: ''
  summary: The passage describes northern British Columbia facial paintings and ornaments,
    explaining how animal, whale, fish, sun, rainbow, moon, copper, and rank-related
    designs are placed on the human face or worn as associated ornaments. It notes
    color conventions, body placement, materials such as abalone shell and wood, and
    chiefly uses of certain designs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A facial painting in Fig. 1 places the killer whale on the left side of the
    face and the right whale on the right side; the animal forms are adapted to the
    eyebrow area.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Heavy, regular eyebrows are described as a sign of beauty, and some Indians,
    particularly women, pluck eyelid hair to make a sharp eyebrow line.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The killer-whale and right-whale designs are said to be identical in form
    and identified by color: red for right whale and black for killer whale.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Red is also used in another whale design to symbolize whale eyes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Red painting on the lips supplements the whale design and symbolizes copper,
    described as a valuable Haida possession.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Chief Skidegate used the red lip painting and wore a single upright sea-lion
    bristle in his hair on festive occasions; the bristle indicated that no one in
    the tribe was of equal rank.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Figs. 2 and 3 represent halibut, and the series from Fig. 2 to Fig. 13 is
    described as realistic representations of whole animals or large portions of animals.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The red sun with black rays was worn in different facial positions and was
    also made as a wooden forehead ornament with abalone shell inlay.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sun ornament was used by the chief of the Kits’adé’s of the Stakinqoan
    of the Tlingit and was called the “house of the sun.”
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The rainbow design was placed in more than one position on the face or forehead,
    with described blue and green line placements.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The crescent moon design uses abalone shells glued to the cheeks to represent
    faint moonlight illuminated by reflection from the earth, and it could be supplemented
    by a crescent-shaped wooden neck-ring inlaid with abalone shell.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: 'Three designs symbolize animals by means of their heads: a woodpecker head
    in black and red, a sea-lion shown reclining backward as if blowing, and a wolf
    indicated by teeth and a long snout.'
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Most preceding facial designs are described as treating the face like a flat
    surface; exceptions with adaptation to the human face include the whales, the
    rainbow, and the crescent moon.
  category: attribute
  evidence_refs:
  - ev:9
