canonical_text:
  quote: ''
  summary: The passage explains plate figures and color-hachure keys for Bella Coola
    masks and a carving or implement. It catalogues masks representing named beings,
    animals, natural phenomena, Nond’osqa in before-and-after flower-birth states,
    attendants or shaman figures, thunder-bird-related objects, a sea-monster, a spirit,
    and a hermaphrodite, noting colors, materials, dimensions, and catalog numbers.
    One bird-shaped implement used by a companion of the thunder-bird is described
    as releasing eagle-down when shaken during a dance.
  language: English
  quote_policy: summarized
