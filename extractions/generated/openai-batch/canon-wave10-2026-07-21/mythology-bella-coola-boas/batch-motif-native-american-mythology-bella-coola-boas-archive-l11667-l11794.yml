  quote: ''
  summary: The passage describes Thompson and Lower Thompson weaving, netting, blanket-making,
    textile patterning, material preparation, intergroup craft comparisons, and semi-subterranean
    winter dwellings occupied by related family groups near river water. It is ethnographic
    and technical rather than myth narrative.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage includes figure captions and references for open-work baskets,
    rush mats, grass mats, skin blankets, square bags, woven bags, cedar-bark mats,
    and a netting stick.
  category: object
  evidence_refs:
  - ev:1
  - ev:4
  - ev:7
  - ev:8
- id: obs:2
  text: One matting method uses a two-stranded bark-string selvage and lighter two-stranded
    bark-string warp, with grasses woven into this groundwork.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Patterns on some mats are obtained by using grass of different colors, and
    wool strands may sometimes replace grass.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: This matting is also used for pouches, and some table mats are made of young
    tule or bulrushes tied with twine made from named plant materials.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The described weaving method is said to be identical with that used by Coast
    Indians for cedar-bark blankets and is also used by Thompson Indians for bags,
    rabbit-skin blankets, pouches, and sagebrush socks.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Threads were made from Apocynum cannabinum and Asclepias speciosa fibers;
    Apocynum fiber was traded to the Lower Thompsons, and nettle was used by the Lower
    Thompsons when bark fiber was unavailable.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fiber was shredded and cleaned by pulling it over the sharp edge of a small
    board and then spun on the bare thigh into two-stranded twine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Bags are woven with warp threads held in pairs by loops of the woof, and round
    bags are formed from a bottom portion, continued spirally, widened or narrowed
    by managing warp strands, and finished with buckskin.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Wallets are made by twined weaving; designs are made by embroidery or by weaving
    colored grasses or bark twine into the fabric.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The wallet-weaving style is said to seem recently acquired through intercourse
    with the Sahaptin.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Lower Thompson Indians weave cedar-bark mats in the same style as those
    used by Coast Indians.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: At the time described, rag mats or rugs are often made from scraps of cloth
    or calico, and their patterns are mostly the same as those on basketry.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Blanket weaving was an important industry among the Lower Thompson Indians;
    Coast Salish used both dog hair and goat hair, while Thompson Indians are said
    to have used goat hair only.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Goat wool could be whitened or cleaned with baked white diatomaceous earth
    and beating with a flat stick.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Blanket thread-making is described as the same as the Songish process, and
    the loom and spindle are also described as the same except that the Thompson spindle
    disk and shaft are wooden.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Blanket-making process and implements are said to be the same as those of
    the Lower Fraser Indians, though the narrator states that the exact weaving manner
    was not personally observed.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:17
  text: Many blankets had tassel fringes, and black bear hair threads plus goat-hair
    threads dyed yellow or red were woven into blanket patterns similar to basketry
    patterns.
  category: object
  evidence_refs:
  - ev:7
- id: obs:18
  text: Nets were made from Apocynum bark thread using a wooden netting stick to make
    equal-sized meshes, with meshes made by a double knot.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: The tribe used semi-subterranean winter houses, called kekule-house in Chinook
    jargon, generally built in principal river valleys within easy distance of water.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:20
  text: Winter houses were inhabited by groups of related families who scattered during
    hunting and fishing seasons but lived together in winter; dwellings usually numbered
    one to four at a place and accommodated about fifteen to thirty people.
  category: relationship
  evidence_refs:
  - ev:9
