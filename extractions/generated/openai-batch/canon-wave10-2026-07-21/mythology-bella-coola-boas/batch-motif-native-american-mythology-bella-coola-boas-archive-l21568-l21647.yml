canonical_text:
  quote: ''
  summary: The passage describes Thompson Indian charms for hunting, gambling, love,
    wealth, animal husbandry, restoring luck to utensils, and beliefs about dreams,
    the wandering soul, contact with the dead in dreams, and death omens involving
    sick persons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hunter who could not locate game used a fool-hen head as a charm, praying
    to it and tossing it so the beak’s direction would indicate where game could be
    found.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the fool-hen head pointed the same way on a second toss, the hunter regarded
    that direction as certain and slept with the head under his pillow with the beak
    pointing that way.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hunters wore the tail of a snake, described by some as a double-headed snake
    because of eye-like protuberances near its thick tail, as a charm against danger
    while hunting grizzly bear.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A hunter could lay the body or skin of a mountain mouse on a wounded deer’s
    tracks and stop pursuing it that day; the deer was said not to travel far and
    soon to die.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Chewing deer sinew was said to make the sinews of a wounded deer contract,
    so that it would travel with difficulty and be overtaken.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some gamblers’ wives suspended an elongated stone or stone hammer above their
    husbands’ pillows and spun it rapidly to reverse bad gambling luck.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Other gambling-luck rites included a wife bathing in water, driving a peg
    near the pillow, or sitting on a fresh fir branch while the husband played.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: One love charm used male and female plants tied together with one hair from
    the man and one from the woman; the plants were buried or worn, and prayers were
    addressed to them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Another affection charm used male and female plants mashed with red ochre,
    applied as tiny cheek spots at running water at sunset or daybreak, then sewn
    into a buckskin sack and worn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage says that if the love charms were not properly prepared, either
    the charmer or the charmed person might become crazy.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Dodecatheon flowers were used as a charm for love, wealth, and receiving presents,
    while the fool-hen heart was used by some men to gain a woman’s love.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: After a horse was castrated, its testicles could be placed on a tree or high
    boulder out of dogs’ reach, or buried to make the horse return if lost or stolen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Astragalus and Rosa plants were used to bring back the luck of tables and
    utensils contaminated by unclean persons.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage states that when a person dreams, the soul leaves the body and
    walks around the earth; nightmare is described as the soul nearing the beginning
    of the trail to the world of souls.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: If a person dreams that a dead person touches, lies on, or wears an article
    of clothing, that article should not be worn again and should be hung in a tree,
    or evil or sickness will follow.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: If someone dreams of a sick person naked and passing from east to west or
    west to east, the sick person is said to die.
  category: sequence
  evidence_refs:
  - ev:10
