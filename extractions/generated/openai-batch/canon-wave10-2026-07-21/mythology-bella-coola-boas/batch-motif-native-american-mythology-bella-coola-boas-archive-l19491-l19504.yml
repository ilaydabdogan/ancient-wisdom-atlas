    white handkerchief is now used instead.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: For a year the mourner had to sleep on a bed made of fir-branches; the provided
    passage cuts off after this statement begins.
  category: action
  evidence_refs:
  - ev:6
