canonical_text:
  quote: ''
  summary: The passage describes mourning practices for widows and widowers after
    a spouse's death, including repeated passage through rosebushes, four days of
    wandering at evening or daybreak, eye-related rites with fir-twigs and a stone
    from running water, food and water restrictions involving sharp sticks and fire,
    a mourning head-band, and the beginning of a year-long sleeping restriction on
    fir-branches.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the death of a husband or wife, the surviving spouse went out at once and
    passed through a patch of rosebushes four times.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For four days after the death, the surviving spouse wandered during the evening
    hours or at daybreak.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mourner wiped their eyes with fir-twigs, hung the twigs in tree branches,
    and prayed to the Dawn.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mourner rubbed a small smooth stone taken from beneath running water four
    times across their eyes, threw it away, and prayed not to become blind.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the first four days, the mourner was not to touch food, ate with sharp-pointed
    sticks, and spat the first four mouthfuls of each meal and the first four of water
    into the fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Immediately after the death of the spouse, the mourner put on a narrow head-band
