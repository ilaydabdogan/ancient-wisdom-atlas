canonical_text:
  quote: ''
  summary: The passage records winter-weather omens and weather-causing actions involving
    hares and other animals, sayings that personify snow and rain through named beings,
    a belief about muscles or knots moving upward in old age, and an art-historical
    discussion of Thompson decorative art, including rare animal and human carvings,
    comparisons with neighboring Coast tribes, and explanations of pictographic or
    conventional symbols used for trails, offerings, trenches, sacrifices, routes,
    huts, and fir branches.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Large numbers of hares, early hare migration to lower ground, early whitening
    of hare and weasel coats and ptarmigan plumage, and arrival of certain birds are
    stated as signs of hard or early winter.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Burning the feet, skin, or bones of a hare is said to cause cold weather or
    snow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During snow or rain, speakers are reported as using sayings in which Old Man
    scratches himself or Grandfather, Grandmother, or Coyote urinates.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Small muscles or knots above the instep in the left leg are said to move upward
    as a person grows old; one variant says they move only to the knee and then back
    again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says plastic art is almost absent among the Thompson Indians when
    compared with the highly developed art of neighboring Coast tribes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The listed Thompson-area carvings include animal-form vessels and heads, bone
    animal figures, a man-shaped vessel, warrior-head war-club handles, grave figures,
    and a house-top stone ornament representing a man.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage contrasts a principle in which animal forms adapt to implement
    forms with a principle in which symbolic designs are placed on suitable surfaces
    without close connection to implement form.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Many designs are described as symbolic or pictographic rather than primarily
    decorative, and some conventional meanings are said to be understood.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Conventional signs include a cross for crossed trails, dots for offerings,
    straight lines for trenches, lines or dots near trench ends for sacrifices, and
    connecting lines for designs that belong together or are near one another.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Some conventional signs are described as ambiguous, and the use of an implement
    may determine the meaning of designs on it.
  category: attribute
  evidence_refs:
  - ev:9
