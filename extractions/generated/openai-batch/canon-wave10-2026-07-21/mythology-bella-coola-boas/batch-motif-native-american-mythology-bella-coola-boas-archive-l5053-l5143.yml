canonical_text:
  quote: ''
  summary: 'The passage continues an episode in which a dangerous woman is disarmed
    and survives intercourse with a young man. She is identified as Salmon-berry Bird,
    daughter of Spring Salmon, and bears a boy and a girl. Salmon relatives take the
    young man, his wife, and children back toward his people in canoes that appear
    to a watchman as salmon entering a weir. The young man resumes human shape at
    night, identifies himself to his parents as the fish they caught, and gives instructions
    for handling Salmon: bones must not be broken and must be returned to the water.
    When this is done, the Salmon return to life while leaving their meat behind.
    Cohoes Salmon gives colored leaves, causing autumn leaf color. The young man later
    gathers eagle-down, has his brother cover him and beat time, ascends as a feather
    to heaven, and reaches the House of Myths.'
  language: English with an opening Latin passage
  quote_policy: summarized
