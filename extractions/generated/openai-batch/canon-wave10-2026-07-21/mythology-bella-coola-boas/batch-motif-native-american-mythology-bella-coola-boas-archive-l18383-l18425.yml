canonical_text:
  quote: ''
  summary: 'The passage describes first-menstruation ceremonies for a girl among Upper
    and Lower Thompson groups: seclusion in a fir-and-bark hut, body painting and
    special hair arrangement, a scratcher and blanket or robe, running ordeals, an
    Upper Thompson night fire rite on a mountain height, a Lower Thompson staff rite
    addressed to Day-dawn, prayers to Earth or Nature while running, and tree-splitting
    or bending acts connected with bodily strength.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl of the relevant age may be moved into wilder mountain areas for required
    ceremonies.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A conical hut of fir branches and bark is erected at a distance from other
    houses, and the girl squats or sits inside it, sometimes in a circular hole dug
    deep enough to reach her shoulder-blade level when squatting.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The hut is kept away from other houses so lodge smoke will not blow on the
    girl, since the smoke is said to make her unlucky or sick.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the first indications and on each succeeding morning during her first menstruation,
    the girl's face is painted red all over.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Her hair is arranged in two knots, one behind each ear, and a deer-bone skin-scratching
    implement may be stuck into one knot.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: She is wrapped from head to toe in a heavy blanket, or formerly a heavy skin
    robe, fastened at the waist and breast.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: She is made to run as fast as possible to a goal, usually twice going and
    twice returning, until she sweats profusely.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the first night of separation, in the Upper Thompson custom, she goes to
    a prominent mountain place such as a peak or hilltop, gathers black or previously
    burned fir-wood, piles it around the foot of a tree, and sets it on fire.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Upper Thompson fire rite, she spits four times into the fire, prays
    to it that she may never suffer hunger, and dances, sings, and prays around the
    fire and embers until daybreak.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Lower Thompson custom, she carries a staff for one night, leans it
    against a tree stump at daybreak, and prays to Day-dawn for a good husband, which
    the staff symbolizes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Among both Upper and Lower Thompson groups, she runs while praying to Earth
    or Nature to be fleet of foot and tireless of limb.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: She splits small fir-trees from top to bottom so that she may be strong, and
    she bends, twists, or knots somewhat larger trees three to five feet high.
  category: action
  evidence_refs:
  - ev:8
