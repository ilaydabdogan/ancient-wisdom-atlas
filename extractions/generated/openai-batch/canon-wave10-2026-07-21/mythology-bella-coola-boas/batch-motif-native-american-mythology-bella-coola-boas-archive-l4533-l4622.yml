canonical_text:
  quote: ''
  summary: A brief closing fragment says that after a river passage was opened, Noaki/la
    descended the river, Xé’mtsiwa cast off an eagle dress and became a man, and Isyt’yot’s
    descendants used eagle regalia. The Tradition of Satsq then tells of the chief
    Smawu’n, descended from heaven to a mountain. His grandson So’nxuak-as refuses
    marriage, is rebuked by his father, leaves home, travels by mountain and river,
    witnesses a canoe being made by invisible agency, and is received at Ha’mts’it’s
    village. Ha’mts’it offers his daughters; So’nxuak-as selects the second daughter
    and receives only part of the chief’s traditions. After the bride is fetched and
    a marriage feast is held, Ha’mts’it transfers ritual objects, whistles, a whale
    painting, a raven-shaped ladle, land along one side of the river, and stones assigned
    as the bride’s helpers.
  language: English
  quote_policy: summarized
