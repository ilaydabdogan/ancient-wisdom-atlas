  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage states descent and chiefship but does not elaborate a full
    origin charter in this excerpt.
- id: motif:3
  label: departure after family conflict
  taxonomy_refs:
  - departure
  basis: After his father rebukes him for refusing marriage, So’nxuak-as leaves home
    and travels up the mountain and down a river.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The later purpose of the journey emerges through hospitality and marriage
    rather than a stated quest at departure.
- id: motif:4
