canonical_text:
  quote: ''
  summary: The passage describes Salish and neighboring basketry design names and
    derivations, including arrow-head, strap or tump-line, net, box or grave-box,
    stone-hammer, star or cross, crossing-trails, lakes and streams with ducks, houses
    and household furniture, firewood, mountain, and possible snake-track patterns.
    Several interpretations are presented as uncertain or locally variable.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The arrow-head pattern is said to derive from triangular, diamond, or leaf-shaped
    stone arrow-points.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: One arrow-head design arrangement uses half arrow-head pairs separated by
    a white stripe and connected into a band or braid.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The strap pattern is derived from an Indigenous packing-strap or tump-line
    used around the forehead or chest while carrying an article.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The conventionalized strap design is described as connected squares, diamonds,
    or rhomboids.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The strap design closely resembles a net and is sometimes known by that name,
    while the passage separately identifies an undoubted fish-net design on a Quinault
    basket.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The box pattern is said to imitate grave-boxes used in disposing of the dead.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The stone-hammer design derives from stone hammers described as ceremonial
    objects with large heavy heads and short handles.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the stone-hammer design, handles are joined to make a symmetrical double-headed
    implement form.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: The star pattern is usually a modification of a cross made up of small squares.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Another cross-like design is called star by some interpreters and crossing
    trails by others.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: A simple cross is said to be commonly used to indicate both crossing trails
    and cardinal points of direction, making the design interpretation doubtful.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: One Upper Thompson bag side represents unconnected lakes, lakes connected
    by flowing streams, and ducks flying toward the water.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: The lakes on the Upper Thompson bag are described as mysterious, with different
    colors of water indicating that quality.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: The reverse side of the Upper Thompson bag has rows of rhomboidal leaf-shaped
    arrow-heads and crosses interpreted as crossing trails or compass points.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: Another Upper Thompson-region bag is said to represent houses and household
    furniture, with rows of lodges on one side and dishes, baskets, and firewood on
    the other or edge.
  category: object
  evidence_refs:
  - ev:7
- id: obs:16
  text: The mountain pattern is especially common among the Quinault Indians of Washington
    and usually appears as a horizontal series of acute-angled zigzags.
  category: object
  evidence_refs:
  - ev:8
- id: obs:17
  text: Variants of the mountain pattern are described as broken zigzags arranged
    similarly.
  category: object
  evidence_refs:
  - ev:8
- id: obs:18
  text: A Thompson basket design had been called a mountain pattern by some members
    of that tribe, though the passage says the weight of authority favored snake-tracks.
  category: relationship
  evidence_refs:
  - ev:8
