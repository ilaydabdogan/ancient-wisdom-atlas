canonical_text:
  quote: ''
  summary: The passage concludes an episode in which Raven imitates Lynx by cutting
    fat from his own body to feed children, then gives a child to Lynx after Lynx
    reproaches and feeds Raven's children. It then gives ethnographic notes on Toa'lat'it,
    Astas/Raven traditions, K'tsos as father of mountain-goats, Thunder-bird and his
    ceremonial companions, and village traditions tied to mythical ancestors sent
    down by Senx.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven cuts his own belly, removes fat from his intestines, cuts the fat into
    five pieces, replaces his intestines, and places the fat in his quiver.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raven has his wife fetch the quiver and warm the fat near the fire as food
    for his children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the fat grows warm near the fire, Raven protests, takes the fat, and
    puts it back in his belly.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lynx says he had formerly fed Raven's children and that Raven had not treated
    Lynx properly by feeding Lynx's children.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lynx gives pieces of fat and meat to Raven's children.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Raven offers one of his children to Lynx so that the child may grow up with
    Lynx's children.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage reports that the former spirit Toa'lat'it was killed by an Indian
    who took his place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that a similar tradition is told of Astas, the Carrier
    name for Raven, described there as a principal culture hero, and that many Astas
    traditions are common to the Carriers, Bella Coola, and Awi'k'én6x of Rivers Inlet.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: K'tsos is described as the father of all mountain-goats.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: A hunter who meets K'tsos first thinks he sees a kid, but after closing and
    opening his eyes sees K'tsos in real shape as an enormous buck.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The hunter is instructed to ascend the mountain after recognizing K'tsos;
    if he descends, he will fall and die.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The thunder-storm is said to be produced by Thunder-bird, who lives on the
    mountains with spirits considered his friends.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Thunder-bird is represented by a black mask with red nostrils and prominent
