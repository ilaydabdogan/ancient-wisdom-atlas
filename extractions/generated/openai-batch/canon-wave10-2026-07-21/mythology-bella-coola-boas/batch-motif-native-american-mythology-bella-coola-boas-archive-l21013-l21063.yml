canonical_text:
  quote: ''
  summary: The passage describes beliefs about souls approaching the sun in illness,
    shamanic bewitchment through ghosts, avoidance of old-style dress by ritually
    vulnerable youth, etiquette and taboos around shamans, bad-luck spells on hunters,
    special relations between spirits and animals, warnings about awakening strangers,
    and a shaman’s appearance when visiting a sick person.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fainting-fits are explained as souls approaching the sun; when the souls almost
    reach it, the persons die.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: This condition is described as a disease that is very difficult to cure.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Shamans are said to throw sickness on persons by making ghosts frequent their
    houses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Young men, young women, boys, and girls fear wearing unusual old-style clothing
    or ornaments, including feathers, fur hats or caps, and skin head-bands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stated reason for this fear is that a strange shaman might test their
    powers and they might be bewitched or killed, because puberty ceremonials were
    not properly performed and most lack guardian spirits.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Parents may tell a boy wearing an animal-skin cap or feathered head-band to
    remove it before going where many Indians, especially strangers, may see him,
    and to wear a manufactured hat or cap instead.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Shamans were sometimes killed by relatives of a man whom they were thought
    to have bewitched.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Fear of witchcraft led people to treat shamans with respect.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Startling a shaman or eating meat, especially venison, without first inviting
    him to eat are named as actions offensive to shamans.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: No one allowed his shadow to fall on a shaman, but the shaman’s shadow falling
    on another person was not considered harmful.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: A shaman could throw a bad-luck spell on a hunter or trapper, sometimes lasting
    for years unless broken by someone with the proper power or knowledge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A person under this hunting spell is said to have a ghost walking beside him
    while he hunts.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Animals may detect the hunter or the accompanying ghost and disappear; if
    they do not, the unseen ghost may unnerve the hunter so that he misses.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: If the spell was cast by a man whose spirit was the deer, deer knew or were
    warned of the hunter’s coming and stayed out of sight.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: Shamans could kill animals by their spirits, except representatives of their
    own guardian spirits; deer are said to be the only animal no shaman could kill
    by his spirit.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: Hunters spoke modestly of their successes to avoid exciting envy and having
    a spell thrown on them by greater hunters.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:17
  text: A stranger ought to be awakened by calling only and not by shaking, because
    rude awakening might lead him to bewitch the person.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: When called to visit a sick person, the shaman appeared with red face paint
    and either a large fur hat decorated with eagle tail-feathers and small animal
    skins as pendants, or with these ornaments otherwise worn.
  category: attribute
  evidence_refs:
  - ev:8
