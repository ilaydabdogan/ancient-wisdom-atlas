canonical_text:
  quote: ''
  summary: The passage recounts a journey by Wakitmai and his brothers in a self-moving
    canoe, their receipt of ceremonial secrets and valuables, their return after an
    unexpectedly long absence, and Wakitmai’s transformations of animals and landscape
    features. It then begins the tradition of NusxeF’al, in which the Sun sends beings
    down to Nusxe’q!, modifies fish abundance after a forbidden catch, and Xemaksta,
    a rapidly grown child, visits bear hosts who provide supernatural food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sea is described as extending far up Bella Coola valley.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Masmasala’nix made a self-moving canoe called Koo-koo, and the travelers journeyed
    to Fraser River and southeastward with their speaker.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The travelers received secrets of the sisau’k dance and mother-of-pearl from
    Pelkhanny, and later received other sisau’k secrets and copper from Klallia, chief
    of the coppers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On their return, the travelers met an old woman on a small island at Rivers
    Inlet; when she looked at the canoe, her eyes took on the lustre of mother-of-pearl,
    and she is identified as the crab.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The old woman’s answers showed that the travelers had been absent many years,
    although they thought the journey had lasted no more than four days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The travelers dragged their canoe from the head of Rivers Inlet to the lake
    above, creating the river that empties into Rivers Inlet; sea-lions and whales
    ascended through this river into the lake.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wakitmai transformed whales into stone, and his thrown canoe-pole missed the
    sea-lions and stuck in the mountain now called Skallakt, meaning canoe-pole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wakitmai had a magic wand from the chief of mother-of-pearl; one end restored
    life and the other caused death, and he used it to transform sea-lions into driftwood.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wakitmai settled at Bella Coola, married a daughter of a couple met at Tallio,
    had a son and daughter who grew up in four days, and initiated them into the sisau’k
    ceremonial.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: One of Wakitmai’s sisau’k masks represented himself as a raven, and another
    represented the chief of mother-of-pearl.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Sun sent down Semsiuta’k‘as, Nusqoa’xlané, their sister E’nvarana, called
    darkness, and the Hermaphrodite to Nusxe’q!.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Sun wished two Bears to assume human shape, but only their eyebrows became
    human-like; the Bears lived at Mo’asla’L by a cascade and caught salmon there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Hermaphrodite first saw the olachen and began catching them; because women
    were forbidden to catch them, the Sun became angry, removed most of the olachen,
    and sent cohoes salmon instead.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Semsiuta’k‘as reached the sea, took the name Nonotxoq!£’maix’, married Nuqai’tsta,
    and had a child the following day who grew into a youth after four days and was
    named Xe’mak:sta.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Xe’mak:sta went upriver carrying a bow and bird-arrows and met people wearing
    red cedar-bark ornaments and bear-skins; they looked like people but were Bears.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Inside the Bears’ house, the Bears made fire by striking together two green
    stones.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The Bears roasted skunk-cabbage, which appeared to the youth as salmon, served
    it in a dish made from a Bear’s knee-pan, and knew the youth’s thoughts about
    the quantity of food.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: Four berries placed in the dish replenished as the youth ate them, and the
    Bears asked him to stay until the next day.
  category: sequence
  evidence_refs:
  - ev:9
