canonical_text:
  quote: ''
  summary: 'The passage describes Thompson naming practices: public naming by feast
    and proclamation, use and transmission of deceased relatives’ names, invention
    of nicknames and dream-derived names, gendered name suffixes and name sources,
    names taken from guardian spirits, nature, animals, plants, contact-era English/French
    and baptismal names, and naming practices for dogs and horses.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A highly regarded method of giving a name involves gathering neighboring people,
    giving a feast, and publicly proclaiming the name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same public naming custom was also used when grown-up people changed their
    names.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A name is generally chosen from a deceased relative, and the name is not taken
    until at least a year or more after that relative’s death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among relations, the nearest kin generally takes the deceased relative’s name,
    and older kin take precedence over younger kin.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: No two persons in the same tribal division bear the same name, and few people
    in the whole tribe bear the same name.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: New names are continually invented and can be transmitted to children and
    grandchildren.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some names are nicknames based on events or physical traits, and some names
    are taken from significant dreams.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Men’s and women’s names are distinct, and many names use gender-associated
    suffixes.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Some men have names from objects in nature, mostly names of guardian spirits.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:10
  text: Animal names are described as less frequent among the Upper Thompsons and
    common among the Lower Thompsons; Lower Thompson names also include plant names.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Some Indigenous people known to white people adopt or are given English or
    French names, and church members also have baptismal names.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Dogs and horses are named from markings, color, resemblance, animal qualities,
    or human-like naming patterns.
  category: relationship
  evidence_refs:
  - ev:8
