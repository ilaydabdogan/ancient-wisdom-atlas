literal_observations:
- id: obs:1
  text: Woodworking used elk-antler wedges driven by hand-hammers; wooden mallets
    and flat-sided stone clubs could also be used for driving wedges.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Stone adzes, axes, chisels, chipped stone knives, beaver-tooth knives, and
    stone drilling points are listed as tools for woodworking, carving, canoe-building,
    and drilling.
  category: object
  evidence_refs:
  - ev:3
- id: obs:3
  text: Small circular decorations on bone objects were made with a notched bone point,
    preferably bear bone; a blunt point produced a circle without a central dot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:4
  text: The Lower Thompsons and the Lytton band made dug-out canoes of cedar and pine
    and treated them by filling them with water boiled by red-hot stones with dried
    salmon-heads.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:5
  text: Spruce-bark canoes were sometimes made with the smooth side outward, spruce-root
    sewing, a wooden frame, and gum-calked seams; they were not much used by the Lower
    Thompsons.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Implements and utensils of stone, bone, wood, bark, or skin were painted with
    mineral, plant, fungal, charcoal, bone, and later washing-blue materials.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: Paints were mixed with melted deer-grease, heated, applied with a stick or
    finger, kept in stone vessels or on hide, and fixed on skin by rubbing with heated
    Opuntia.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Animal skins were used for clothing, bedding, bags, and related purposes;
    deer and elk skins were most important, and the skin-preparation process begins
    with drying, scraping, and rubbing with decomposed deer brains or marrow.
  category: sequence
  evidence_refs:
  - ev:8
