canonical_text:
  quote: ''
  summary: 'The passage describes mortuary and mourning practices: treatment of enemy
    bodies and found bones, four-day isolation of corpse handlers, purification or
    burning of dwellings and goods after death, restrictions on using a dead man''s
    possessions, divination with miniature deer figures, measures to keep the ghost
    from entering the house, avoidance of the deceased''s name, food taboos for bereaved
    kin, and children crossing or passing the mother''s corpse four times. A note
    also mentions comparable burial or graveyard practices among neighboring Similkameen
    and Shuswap groups.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Enemy bodies are treated differently depending on location: covered with
    sticks or shallowly buried, thrown into water if killed near a river, or left
    on the ground if within the enemy''s own country; human bones found on the ground
    are cleaned and buried.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those who handle the corpse or dig the grave are isolated for four days and
    fast until the body is buried.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the isolation period, grave workers eat with sharp-pointed sticks from
    a small mat, drink from birch-bark cups, discard these items afterward, spit the
    first four mouthfuls of food and water into the fire, bathe in a stream, and avoid
    sleeping with their wives.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A buckskin may be given to the assembled people to 'wipe away their tears,'
    then cut into strips and divided.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A lodge in which an adult dies is burned; a winter house after a death is
    purified with water soaked with tobacco and juniper, fresh fir-boughs, and pieces
    of tobacco and juniper, but is burned if multiple deaths occur together or in
    immediate succession.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Most utensils and the bed of the deceased are burned; the place where the
    deceased lay is avoided for a time, then an adult male sleeps there for four consecutive
    nights before it is considered safe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Property not placed in or near the grave is divided among relatives or outsiders;
    clothing given to outsiders is washed or put in running water before being worn.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A dead man's bow and arrows, long leggings, moccasins, and pipe are dangerous
    to appropriate or use; the dead man may return for the bow and arrows and take
    the possessor's soul, leggings or moccasins may cause swelling sickness, and a
    rapidly burning pipe is read as a sign that the deceased wants it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: If relatives want a dead man's traps or snares, they hang them for a long
    time in a tree far from habitation or a graveyard before use.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the first night after burial, the household makes four miniature deer of
    dry grass, suspends them from the roof, shoots them with sharp-pointed stick arrows,
    and divines whether another death will soon occur from how quickly they fall and
    from whether a doe falls first.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A string of deer-hoofs is hung across the winter house and rattled by an old
    woman for four nights to hinder the ghost from entering; juniper branches are
    placed at the door or burned for the same purpose, and people often move camp
    after a death.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The name of a recently deceased person is not to be mentioned, and affinity
    terms change after the death of a spouse.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: An orphan is forbidden to eat venison for two years after a parent's death;
    parents who lose a child avoid fresh meat for several months.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Children whose mother has died are made to jump, be lifted, or walk four times
    over or past the corpse.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage note says some Similkameen burials used rock-slides, boulder heaps,
    poles, and shallow graves with stones; it also says Shuswap people sometimes went
    together to graveyards early in the morning to pray.
  category: other
  evidence_refs:
  - ev:11
