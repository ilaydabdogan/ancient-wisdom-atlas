  quote: ''
  summary: The passage describes Thompson hand signs, vocal signals, hunting calls,
    trail and camp markers, and social organization. It notes that different calls
    were used in spirit-haunted high mountains because spirits were said to imitate
    ordinary calls and lure hunters. It also describes non-hereditary leadership based
    on wealth, wisdom, oratory, war prowess, competence, and generosity.
  language: English
