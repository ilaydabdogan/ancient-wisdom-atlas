canonical_text:
  quote: ''
  summary: The passage describes the Sun deity Senx as master of the House of Myths
    and the main recipient of Bella Coola prayers and offerings. It lists prayer contexts,
    offerings through fire, principal and inferior deities of the House of Myths,
    brief references to traditions about salmon, healing water, a cannibal transformed
    into a mosquito, and the winter ceremonial in which deity masks represent myths.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A white crane-like being named Q0’x0x is described as sitting on top of a
    post.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Senx, the Sun, is identified as master of the house and is also called Ta’ata,
    Smai’ya-kila, and Smayalo’orla.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the Bella Coola pray to the Sun and that Boas did
    not find prayers directed to Qama’its or other lower-heaven deities.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Prayers to the Sun are reported for travel, fair weather after rain, mountain-goat
    hunting, misfortune, illness, successful hunting, and berry gathering.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hunters throw four small slices of seal-meat, mountain-goat tallow, or similar
    food into the fire as an offering to the Sun for hunting success.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sick people burn clothing decorated with red cedar-bark as an offering to
    regain health.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Senx and Axk’unta’m stay in the rear of the House of Myths, while Snavk’ulx:a’ls
    stays near the fire.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Snavk’ulx:a’ls is described as an old man who formerly ruled the House of
    Myths and gave up his place to Senx and Axk’unta’m.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Senx and Axk’unta’m are described as rulers of mankind, creators of mankind,
    and in many traditions as trying to destroy man.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Nunusomik-éeqonE’m, Axk’unta’m’s mother in one collected legend, is described
    as a cannibal who sucks out human brains through the ears and is eventually transformed
    into the mosquito.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: One tradition says salmon were obtained when a man gambled with Axk’unta’m,
    won the salmon as the stake, and took them down from heaven.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage also refers to other salmon-origin traditions in which birds obtained
    salmon and Raven obtained salmon by marrying a salmon girl.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Axk’unta’m is said to give man the power to cure disease by means of the water
