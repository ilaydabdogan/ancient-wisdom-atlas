canonical_text:
  quote: ''
  summary: The passage describes Thompson snowshoe forms, snowshoe construction, temporary
    snowshoes and toboggans; the introduction and use of horses; riding and packing
    equipment; and trade among Thompson divisions and neighboring groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lower Thompson snowshoe frames are described as generally rounded, with rather
    wide meshes, suited to travel on steep mountains and moist snow.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Snowshoes used by the upper portion of the tribe are described as longer and
    more closely netted, with the front turned up.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Snowshoe frames are bent by tying the two frames together, spreading the points
    with a short stick, and steaming them until they take shape.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The regular snowshoe frame is made from one piece of mountain-maple or yew,
    and the network is made from fine twisted raw deer-hide strings.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A temporary snowshoe may be made from two fir-branch pieces tied at both ends,
    with small sticks tied across to stretch the shoe and support the foot.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hunters are said to have used fir-branch toboggans for sliding down snow-covered
    hillsides.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Horses were introduced among the Upper Thompsons toward the end of the eighteenth
    century and were at first extensively used for food.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The first horses are said to have been obtained from Sahaptin, Shoshone, and
    Cayuse groups; horses reached the northern Shuswap about 1830 and the Carriers
    not before 1860.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the time described, horses are used for riding and packing, with pack-saddles,
    packing-skins, saddle-girths, saddles, cruppers, stirrups, and nose nooses or
    later bridles.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Before the arrival of whites, riding-saddles other than local wooden saddles
    were unknown; local saddles could be padded, fringed, and ornamented.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Saddle-blankets, saddle-bags, pack-ropes, and halter-ropes are described as
    made from plant fibers, skins, cloth, buckskin, or horsehair, depending on item
    and period.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage reports early trade among divisions of the tribe and with neighboring
    interior and coast tribes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Okanagon sold items including buffalo-hides, painted skin robes, bark,
    nets, bags, moose-skin, scent, red ochre, horses, twine material, beads, salmon,
    roots, berries, and sometimes shells to the Spences Bridge band.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Nicola band bartered buffalo-skin bags, buckskins, and horses for salmon,
    berries, roots, and Indian-hemp bark.
  category: relationship
  evidence_refs:
  - ev:8
