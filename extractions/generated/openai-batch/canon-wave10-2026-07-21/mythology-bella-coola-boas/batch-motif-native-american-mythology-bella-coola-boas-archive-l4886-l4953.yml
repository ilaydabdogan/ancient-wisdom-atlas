canonical_text:
  quote: When she opened the last salmon, she found a small boy in it.
  summary: At K’’i’pots near Senxl on the Bella Coola River, a chief’s wife finds
    a small boy inside a salmon while cutting fish. She washes him in the river, nurses
    him with her own baby, and both children grow rapidly. The Salmon boy builds a
    hut and tells his companion always to shout before entering, warning that he will
    die if the rule is forgotten. On alternate days the hut is filled with birds,
    which feed the town. When the companion forgets to shout, he finds a nearly dead
    salmon on the hut floor, vomiting quartz. The people carry the salmon to the water
    and place it on sticks. A canoe of people arrives, says they have come to fetch
    him, and the Salmon rises and boards it; his brother then joins him.
  language: English
  quote_policy: quoted
