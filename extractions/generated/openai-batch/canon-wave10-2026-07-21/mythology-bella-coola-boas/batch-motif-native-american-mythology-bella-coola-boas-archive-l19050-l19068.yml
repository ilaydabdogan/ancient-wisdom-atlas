canonical_text:
  quote: ''
  summary: The passage describes marriage-related customs in which young men or women
    touch desired partners during religious dances or after washing. Touching a girl
    could lead to marriage; women could also touch men, though men were not strictly
    compelled to accept. Rejection could cause shame. Parents who prevented suitors
    from touching a daughter could find that she eloped, and custom could then treat
    her as already married to the young man.
