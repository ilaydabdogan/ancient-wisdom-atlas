  summary: 'The passage consists of plate captions and explanations. It describes
    two views near Lytton, British Columbia: one looking up the Fraser River from
    Lytton and noting river junctions, a burial-place, Stein Creek, and a cultivated
    ranch; another looking across the Fraser River toward a village-site and burial-ground
    called the “Sixth Site,” with a circular house-pit or former underground-house
    depression and measurements. Additional captions name ethnographic or archaeological
    subjects such as preparation of skins, a storehouse, an underground-house interior,
    a conical lodge framework, and a sweat-house.'
