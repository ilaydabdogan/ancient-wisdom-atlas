canonical_text:
  quote: ''
  summary: The passage reports an accidentally discovered prehistoric burial-ground
    at Spuzzum, notes a comparison with Lillooet lodge-burial customs, and describes
    Thompson conceptions of the world, transformers, Coyote-related stone formations,
    weather-producing peoples, the capture of Wind, and Thunder as a bird.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People digging for gold at Spuzzum found a previously unknown prehistoric
    burial-ground near the mouth of Spuzzum Creek.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: About twenty skeletons were found on the same level in a circle around ashes
    interpreted as the remains of a large lodge fire.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bodies had been interred in a sitting posture, some wrapped in birch-bark,
    and associated objects included stone tools, dentalia, grizzly-bear claws, and
    a copper club.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The bones were removed and reburied in the present Spuzzum graveyard; nearby
    were remains of very old winter houses with large willow and alder trees growing
    in their centers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that Lillooet people sometimes buried a person in a lodge
    near the fireplace and later placed dead relatives alongside, producing a graveyard
    circle around the old fireplace.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The earth is described as square by some people and nearly circular by others,
    with Lytton as the center of the world because Coyote’s son reached earth there
    when returning from the sky.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The world is described as level near the center, mountainous near the outer
    edge, surrounded by lakes with clouds and mists, rising toward the north, and
    drained by rivers flowing southward.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: East and west are described as the most important compass points, while four
    is identified as the mystic number occurring in ceremonies and myths.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Mountains and valleys are said to have received their present form from transformers
    travelling through the world.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Old Coyote is described as the greatest transformer and as sent by the Old
    Man to put the world in order.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Three brothers named Qoa’qiqat travelled through the country working miracles;
    another transformer named Kokwée’la is also named.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The brothers were transformed into stone, Old Coyote retreated to his house
    of ice, and many remarkable rocks and boulders are regarded as transformed men
    or animals from the mythological period.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: Mythological-age beings called spéta’kt are described as men with animal characteristics,
    magical gifts, rapidly maturing children, and later transformation into real animals.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:14
  text: Three rocks east of Spences Bridge are identified with Coyote’s and Coyote’s
    wife’s body parts and their basket kettle after a magical encounter with the Qoa’qiqat.
  category: object
  evidence_refs:
  - ev:5
- id: obs:15
  text: Cold winds are attributed to people living far north where earth and sky meet,
    and hot winds to another people living far south.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: Former wars between the north and south weather peoples caused alternating
    hot and cold winds; the wars ended through a marriage between the south chief’s
    daughter and the north chief’s son.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: The child of the north-south marriage was thrown into water and became ice
    drifting down the river.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:18
  text: Wind is described in one legend as a man with a large head and an extremely
    thin, light body that fluttered and could not stay on the ground.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:19
  text: In the beginning Wind blew a gale continuously, was snared by a young man,
    and was released after promising to moderate.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:20
  text: Thunder is described as a bird a little larger than a grouse, with descriptions
    varying between wholly red plumage and grouse-like plumage with red markings.
  category: attribute
  evidence_refs:
  - ev:8
