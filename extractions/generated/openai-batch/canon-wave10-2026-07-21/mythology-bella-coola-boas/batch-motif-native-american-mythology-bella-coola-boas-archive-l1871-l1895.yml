canonical_text:
  quote: "“the feet of the animals are used as symbols”; “slaves are killed, and buried
    under the house-post.”"
  summary: The passage describes animal feet, tracks, talons, tails, and hoofs used
    as facial-painting or ornament symbols. It gives several examples, especially
    eagle talons worn or represented in hair, head-rings, and shell ear ornaments.
    It also describes a Yakla’nas chief’s house-erection celebration, during which
    slaves are killed and buried under a house-post, and states that red painting
    of the lips and surrounding skin symbolizes this ceremony.
  language: English
  quote_policy: quoted
