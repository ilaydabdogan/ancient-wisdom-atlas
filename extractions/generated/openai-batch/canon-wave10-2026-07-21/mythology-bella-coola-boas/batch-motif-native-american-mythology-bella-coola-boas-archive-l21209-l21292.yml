canonical_text:
  quote: ''
  summary: The passage describes Thompson shamanic practices for sickness, hunting
    success, prophecy, weather control, and ghost-laying; reports magical feats attributed
    to Coast Salish shamans; describes prophets who return from trance or the spirit-world
    with messages; and recounts Pé’lak’s prophecies of white settlers and his transformation
    of fish-bones into salmon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An offering to a shaman could be divided among the people or eaten immediately,
    and this was said to prevent sickness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Instead of receiving an offering, a shaman sometimes escorted the sickness
    westward, blessed it, and told it to leave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a shaman failed to cure a patient, he had to return his fees to the deceased
    person’s relatives.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A shaman’s guardian spirit was said to be more willing to help when the shaman
    was well paid.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: When game could not be found, a shaman or another hunter could make Suppleauels
    by sitting naked through the night on brush near a fire, expecting a vision.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At daybreak the Suppleauels practitioner went to a stream, washed, prayed,
    and sang; the other hunters then washed and joined his song.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the rite, the practitioner directed the hunters where to hunt and told
    one hunter he would shoot a deer or other animal, after which the party was to
    stop hunting and return.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The hunters delayed eating the deer until the following day, and after repeated
    directions they were said to shoot plenty of game each day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Some shamans were consulted about future events, including sickness outcomes,
    weather, and the abundance of berries and salmon.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some shamans and other persons were said to control wind, snow, or rain with
    the help of guardian spirits.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: For laying ghosts, one shaman sat and smoked constantly while others danced
    and sang.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Two men from Yale were said to cut flesh from their bodies and pass arrows
    through muscles, with wounds healed by the next morning and no visible scars.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: A coast shaman was believed able to defecate a whole dog salmon after eating
    only a morsel of dog salmon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Prophets sometimes claimed to have visited and returned from the spirit-world
    with messages.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: A person revived from trance might say he had been in the land of the ghosts,
    and dances could be held by friends and neighbors for several days.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: If the revived person claimed to have seen the chief of the land of the ghosts
    and to have been sent back with a message, he traveled through the country and
    was listened to with respect.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: Some Indians prophesied through visions about the coming of whites, epidemics,
    Indian extinction, and new goods such as whiskey, stoves, dishes, flour, and sugar.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:18
  text: The Lower Thompson chief Pé’lak traveled through the tribe and foretold white
    settlers and major changes in detail.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:19
  text: Pé’lak said the Indians would “die out like fire” when whites appeared; the
    passage states that his information seems to have come from Hudson Bay Company
    employees.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:20
  text: Pé’lak put fish-bones into a river and turned them into salmon; crowds came
    to see and hear him.
  category: action
  evidence_refs:
  - ev:9
