- id: obs:4
  text: The roof was covered with poles or split wood, then pine needles or dry grass,
    and finally earth beaten and stamped down.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Lower Thompson Indians lined these houses with large pieces of cedar bark
    because of heavy rainfall in their country.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A large notched log served as a ladder giving access to the house, with its
    lower end near the center and its upper end in the square entrance.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The ladder leaned against the west side of the entrance-hole and was firmly
    lashed there.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The fire was at the foot of the ladder and was separated from it by a stone
