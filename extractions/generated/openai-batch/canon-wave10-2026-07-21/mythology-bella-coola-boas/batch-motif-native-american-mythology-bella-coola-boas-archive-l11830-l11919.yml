  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The head man of the house sometimes painted new designs according to his dreams.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The ladder was generally placed with its small end leaning slightly east;
