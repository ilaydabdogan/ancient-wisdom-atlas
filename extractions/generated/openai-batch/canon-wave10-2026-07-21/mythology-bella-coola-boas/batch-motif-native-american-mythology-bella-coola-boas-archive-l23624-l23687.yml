canonical_text:
  quote: ''
  summary: 'The passage describes archaeological locations in the Thompson River and
    Nicola Valley region: village-site evidence, talus-slope graves, grave markers
    of rocks, branches, sticks, twigs, posts, a carved human-face post, grave goods
    in one burial, house- and cache-pits, a named shooting rock associated with an
    arrow-skill custom, reported red pictographs, and an informant''s recollection
    of numerous twig-marked graves.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Evidence of village-sites was found on a wind-swept sand-knoll north of the
    river and near the mouth of Tranquille River on Kamloops Lake.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Likta‘qrten, bodies had been placed on the surface at the foot of a rock-slide
    or talus slope and covered by causing rocks to slide down over them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some graves were marked by low piles of rocks; in some cases a branch was
    inserted among the rocks over the grave and extended down to the body.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: One skeleton rested in a small tent of poles covered with cattail-stalk mats,
    and no objects were found with that body or in the tent.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another grave without a tent contained a celt and chipped basalt points.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Indians knew of the Likta‘qrten graves and considered them to belong to
    the Thompson Indians, but cared little for them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Numerous pits interpreted as remains of underground houses and food-caches
    were located between the slide and the river and at other valley locations.
  category: object
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:8
  text: A rocky bluff was called Ka'iatamus a canex, translated in the passage as
    “the shooting rock,” because young men passing on the trail used to try to lodge
    an arrow on its top.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the southern base of the shooting-rock cliff, talus-slope burials were
    marked by posts and twigs, and one post was carved at the top to represent a human
    face.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The graves at the shooting-rock cliff were known by the Indians as graves
    of Thompsons, but were little cared for because no near relatives of the buried
    people were living.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The graves of two children and one man at the mouth of Nicola Lake were about
    eighteen inches deep and each had a pile of five or six boulders above it.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Red pictographs were reported by the Indians on a rocky promontory on the
    northern shore near the middle of Nicola Lake.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: At Nxaxtetex’, three main talus slopes contained graves marked by sticks and
    twigs; an informant said the place once resembled a patch of small dead trees
    because the twig grave markers were so numerous.
  category: object
  evidence_refs:
  - ev:9
