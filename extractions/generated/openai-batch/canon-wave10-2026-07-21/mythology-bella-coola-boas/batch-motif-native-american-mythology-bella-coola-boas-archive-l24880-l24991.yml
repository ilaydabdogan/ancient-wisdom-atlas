literal_observations:
- id: obs:1
  text: Rolls of copper were found in combination with dentalium shells as beads strung
    on fibre cords, probably forming part of a large breast-shield.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some dentalium shells from graves at the large burial-place at Kamloops bear
    incised designs and are interpreted as possible nose-ornaments, ear-pendants,
    or parts of ornaments.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shell beads and perforated shell disks or cylinders were found at Kamloops;
    barnacle-ring beads were recovered from Government Hill, while olivella-shell
    beads were not found.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two worked stone objects are described, including one fluorite object with
    an almond shape and groove and another perforated square-section stone object
    with notched rounded upper edges.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The perforated stone object is reported as possibly an attachment to a dog-halter,
    but more likely a sinker for a fish-line according to information obtained from
    Indians at Spences Bridge.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sets of dice made of beaver-teeth were frequently found in graves, and the
    game associated with such dice is said to have continued among many tribes in
    the territory.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Bird-bone tubes found in grave pouches were colored with red ochre and sometimes
    notched, scratched, or marked with zigzag lines; they are proposed as possible
    gambling-bones.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Bone and wood cylinders or oval bars from graves at Spences Bridge and Nicola
    Valley were marked with incised lines or notches.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Perforated Pecten caurinus shells from the large burial-place at Kamloops
    are interpreted as parts of rattles similar to those used in dances of present
    Coast Indians.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Steatite stone pipes from graves at Kamloops are tubular with wine-glass-shaped
    bowls and are compared in general form with pipes from Lytton.
  category: object
  evidence_refs:
  - ev:10
