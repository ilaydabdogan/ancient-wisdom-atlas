canonical_text:
  quote: ''
  summary: The passage describes archaeological finds from Thompson River region burial
    places and sites, including copper and dentalium ornaments, shell and barnacle
    beads, stone objects, dice or gaming pieces, bird-bone tubes, perforated Pecten
    shells interpreted as rattle parts, and steatite pipes. It notes several cautious
    functional or visual comparisons with present North Pacific Coast practices, Lytton
    finds, Mississippi Valley bird-shaped stones, and present Coast Indian dance rattles.
  language: English
