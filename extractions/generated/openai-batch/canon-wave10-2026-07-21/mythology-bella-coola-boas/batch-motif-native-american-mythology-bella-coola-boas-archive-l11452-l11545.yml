canonical_text:
  quote: ''
  summary: 'The passage gives an ethnographic description of skin dressing and buckskin
    preparation: oiling, drying, scraping, smoking over specific fuels, soaking, wringing,
    stretching, pounding, coloring, tanning, and sewing implements. It also reports
    a claim that smoking buckskins was learned from the Okanagon.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Skins are softened by applying oil from bones or salmon-heads, rolling them
    up, placing them in a cool place, and repeating the process until the underside
    becomes soft and oily.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the weather is not hot or breezy, a skin is dried near a fire; after softening,
    it is stretched on a four-pole framework and beaten or pounded with a stick or
    scraper.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Buckskin for clothing is scraped, while hair and the outer cuticle are pulled
    away as the scraper loosens them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Skins for moccasins are often smoked on a bent-stick framework above a purpose-dug
    hole containing a smoldering fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Specific fuels and plant materials are named for smoking skins, including
    rotten fir-wood, fir-bark, yellow-pine cones, wormwood or sagebrush, and juniper
    for darker color.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A blanket is spread over the smoking framework to hold in smoke and exclude
    air, and the skin is reversed after one side is sufficiently colored.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A later-described process soaks the dry skin in water for several days, lays
    it on a peeled poplar log, and scrapes it with a deer ulna or horse rib used like
    a draw-knife.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After scraping, the skin is dried, smoked, placed in warm water and soap,
    rolled with dry grass, fastened to a log, twisted with a stick, and wrung out.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After wringing, the skin is stretched on a frame, pounded until dry and soft,
    and smoked again; nearby fire may warm it during drying.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Dry corncobs with a little wood are burned to give skin a bright yellow color,
    and skins may also be tanned in a decoction of Betula papyrifera.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: An alternate method leaves skins in warm water until the hair can be removed;
    these skins are not smoked and are generally made into gloves.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Some Indians claim that the custom of smoking buckskins was learned from the
    Okanagon.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Former sewing implements included wooden, bone, and horn needles and awls;
    steel needles have replaced the older needles.
  category: object
  evidence_refs:
  - ev:9
