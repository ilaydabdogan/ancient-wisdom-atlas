canonical_text:
  quote: ''
  summary: A youth identified as the son of the chief of the Black Bears takes a chief’s
    daughter to his house and marries her. He rejects hemlock bedding, prepares a
    bed with rotten wood and devil-clubs, gives her foods whose identities are later
    revised, and interprets her unquestioning eating as proof of love. The couple
    sleeps from fall until late spring; she thinks only one night has passed though
    a year has elapsed. On waking, she sees devil-clubs around the bed, and the couple
    makes a fire and discusses her relatives.
  language: English
  quote_policy: summarized
