canonical_text:
  quote: ''
  summary: 'The passage concludes a story in which the Sun is blinded by a bird, remains
    inactive for four days, and is healed by his son-in-law with water connected to
    Salmon-country rejuvenation. The young man then descends from heaven, transformed
    into eagle-down, while his wife descends by her father''s eyelashes. A new story
    begins: Anutxo''dts and girls encounter the Snéné''iq, who captures them in a
    back-basket after giving gum. Anutxo''dts cuts a hole in the basket and most children
    escape, but one girl remains captive. Her mother mourns for four days and nights;
    mucus from her nose becomes a red-haired child who says his father, the Sun, sent
    him to recover the daughter. Given a salmon-spear and abalone earrings, the boy
    goes up the Qoa''Lna River, sits in a tree over the water, and deceives the Snéné''iq
    by imitating her reflection until she looks up and addresses him.'
  language: English
  quote_policy: summarized
