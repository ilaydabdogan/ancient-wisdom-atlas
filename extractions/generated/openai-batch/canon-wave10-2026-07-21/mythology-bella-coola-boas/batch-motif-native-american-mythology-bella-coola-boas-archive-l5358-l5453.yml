  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The wife was told by her father to climb down his eyelashes, and she reached
    the ground at the same time as her husband.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The young man's younger brother did not recognize him after he had been in
    heaven for one year.
  category: relationship
  evidence_refs:
