literal_observations:
- id: obs:1
  text: The passage notes a narrow mountain range separating neighboring country from
    the Upper Fraser band, with recorded instances of crossings and attacks on the
    Lower Thompsons.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Shuswap are described as warlike, avenging invasions of Thompson bands
    and making expeditions against the Thompsons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Several war-party incidents are described, including Spences Bridge expeditions,
    a Lytton party attacking Lillooet after finding no one in Chilcotin country, a
    concealed Lower Okanagon ambush that did not strike, and the abduction of two
    Athapascan women near Nicola River.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A war-party supposed to be Chilcotin entered Shuswap territory, was discovered
    near Thompson River, chased by Thompson Indians, and almost exterminated.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Peace was sometimes made between Upper Thompsons and Shuswap by giving the
    daughter of a noted warrior or war-chief of one tribe to the son of a war-chief
    of the other.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: An orator or chief who favored peace could sometimes avert war, after which
    fighting would give way to feasting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: War captives enslaved by Thompson groups included people from Lower Fraser
    River and Lower Lillooet, with captives described mostly as young women and sometimes
    boys and girls; captives could be recovered by force, purchase, escape, or sale.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Many Lillooet slaves among upper Thompson divisions were said to have been
    purchased by chief Cixpe’ntem or his father around 1850 and taken back to their
    country.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage ranks several bands and neighboring peoples by warlike reputation
    and says that a good horseman or hunter was the Upper Thompson ideal.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Thompson people are described as engaging in blood feuds, going armed, posting
    night scouts, extinguishing fires in some places, retiring to fortified camps
    or houses, keeping weapons ready while eating, and concealing knives, bows, arrows,
    or shortened guns.
  category: action
  evidence_refs:
  - ev:5
