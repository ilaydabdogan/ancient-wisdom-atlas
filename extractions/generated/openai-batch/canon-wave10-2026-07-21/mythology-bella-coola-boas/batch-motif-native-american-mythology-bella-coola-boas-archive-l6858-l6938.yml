canonical_text:
  quote: ''
  summary: A woman married to Bear is found by her hunter brother after Bear predicts
    the brother will kill him and instructs her to keep his skin whole. On the way
    home she is revealed to be able to take bear form through the bear-skin. At home
    she disregards the customary four-day delay, cleans and stretches the skin, breaks
    bone needles, becomes a bear, kills her mother and the village people except her
    little sister, and places the broken needles in the bear-skin jaws. She removes
    her heart and lungs into her hands to avoid being killed by an arrow to the body.
    Her brother returns, is told by the little sister what happened, shoots through
    the bear woman's hands, and flees with the little sister over a canyon log; when
    the bear woman follows, the log turns and she falls into the chasm.
  language: English with a brief Latin passage
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bear asks about the woman's hunter brother, cries, predicts that the brother
    is watching and will kill him, and instructs the woman to skin him while leaving
    the skin whole so she can wear it as a blanket.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: An arrow kills Bear; the hunter brother and two dogs enter the den, find the
    woman, and she skins Bear according to the instructions and carries the bear-skin.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: While the woman follows her brother with the two dogs, the brother repeatedly
    hears barking and bear growls; after hiding behind a tree he sees a large bear
    with the dogs and realizes his sister has assumed bear form.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The woman insists on cleaning and stretching the bear-skin immediately, although
    her brother says the custom is to wait four days; her father tells the brother
    to let her proceed, and the brother leaves because he fears her bear-form power.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The woman cleans the bear-skin, repeatedly asks for bone needles, breaks them,
    and when no more needles are available growls, puts on the bear-skin, assumes
    bear form, kills her mother, and kills the village people except her little sister.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The little sister sees that the broken needles have been put into the jaws
    of the bear-skin to serve as teeth.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The two sisters sit on opposite sides of the fire; the passage then reports
    in Latin that the bear woman menstruates and uses the little sister in an abusive
    act, saying she had spared her for that purpose.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The bear woman removes her lungs and heart from her chest, places them in
    her left and right hands, and does this because she expects her brother to shoot
    her and wants a body-shot arrow not to kill her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The hunter brother returns, the little sister tells him what happened and
    asks him to shoot through the bear woman's hands; he does so, the bear woman dies,
    and he flees with the little sister.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The brother and little sister cross a deep canyon on a log; the brother resets
    the log so it will turn over, and when the bear woman follows their tracks and
    steps on it, she falls into the chasm.
  category: sequence
  evidence_refs:
  - ev:8
