- id: obs:1
  text: Several antler, bone, and steatite artifacts from graves or surface finds
    are described as bearing incised or carved designs.
  category: object
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:8
- id: obs:2
  text: A ladder-like design is identified by consultants as a snake or worm pattern
    representing striped skin, usually drawn without the animal’s head or tail.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: End designs on a digging-stick handle are interpreted as a hairy insect; a
    long line with short right-angle marks is interpreted as a snake or worm; crossing
    lines are probably cross-trails; other parallel-line groups are uncertain.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Women with guardian spirits are said to have carved representations of them
