canonical_text:
  quote: ''
  summary: An archaeological report describes incised and carved designs on antler,
    bone, and steatite artifacts from Lytton. Indigenous consultants and the author
    interpret some designs as snakes or worms, insects, wood-worms, a butterfly or
    eye, cross-trails, earth or mountain forms, bat or goose forms, and dream or manitou
    beings. The passage also notes similarities between prehistoric Lytton designs,
    present local Indigenous design conventions, and old or recent coast culture art.
  language: English
  quote_policy: summarized
