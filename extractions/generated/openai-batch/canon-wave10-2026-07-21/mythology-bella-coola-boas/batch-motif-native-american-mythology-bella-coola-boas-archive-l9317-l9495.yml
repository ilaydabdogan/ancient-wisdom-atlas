    as snake or worm signs; other marks may signify the wood-worm.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Designs on a steatite pipe are said probably to represent beings that appeared
    to the owner in a dream, especially beings from a first important dream in which
    a manitou was received.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Specific pipe marks are interpreted as possible wood-worms, rattlesnake tail,
