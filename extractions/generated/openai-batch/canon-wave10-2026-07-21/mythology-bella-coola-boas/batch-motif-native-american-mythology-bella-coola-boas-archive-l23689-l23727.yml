canonical_text:
  quote: ''
  summary: Iron-Head gives a history of graves near Nicola Lake. In an earlier spring,
    Nicola Athapascans lived in an underground house and Thompson Indians camped nearby
    to fish. After suspicious figures and animal-like cries were noticed around the
    camp, a boy sent to investigate was killed by a Shuswap warrior. A larger Shuswap
    party attacked, killing the camp and underground-house inhabitants except for
    some young women taken as slaves and two Thompson people who escaped by swimming
    across the lake. The attackers left property behind in haste; shortly afterward
    the chief Nkwala arrived with companions.
  language: English
  quote_policy: summarized
