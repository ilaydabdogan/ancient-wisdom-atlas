canonical_text:
  quote: ''
  summary: 'The passage gives several Bella Coola traditions: the Sun sends beings
    from heaven to named places; an eagle founder distributes languages and animal
    and bird sounds; a surviving sister is taken to heaven by the Sun, marries him,
    and bears Sqot, who ascends by an arrow-chain after being maltreated; the Sun
    punishes the offenders by fire and boiling water; another group moves through
    mountain places and a bird makes salmon ascend a river; an avalanche destroys
    a village but one man is dug out alive; and Raven discovers and breaks beaver
    dams blocking a river.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sun sends an eagle and companions from heaven to Mount Ts’elk't; the eagle
    takes the name Sikulkultso’t and builds a house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before coming down from heaven, the eagle writes down and distributes the
    languages of tribes, the cries of animals, and the songs of birds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The eagle has a child whose hair is described as white like an eagle’s head.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Sun sends Téqo’mno, A’usté, Sx0’ya, and their sister K-imitga’n; after
    conflict with the Tsimshian, the brothers are killed except for Téqo’mno and K-imitga’n,
    who survive.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The surviving siblings go upriver toward the Sun; a Bear asks to marry K-imitga’n,
    and she refuses because she is thinking of her dead brothers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the river source K-imitga’n meets the Sun, who takes her to heaven and
    marries her; the next morning she has a son, Sqot, who grows very quickly.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Sun sends K-imitga’n and her son back to earth and tells her that, if
    attacked, the boy should shoot upward with a bow to make a chain of arrows from
    the sky.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Other children maltreat Sqot and mock his claim that the Sun is his father;
    Sqot shoots arrows upward until they form a chain and climbs to the sky.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'The Sun lets Sqot descend along his eyelashes and then punishes the offenders:
    his perspiration ignites their house, the floor becomes red-hot, the lake water
    boils, and K-imitga’n’s house does not burn.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the fire ceases, surviving people recognize Sqot as the Sun’s son, treat
    him kindly, and increase in number.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A group sent to Na’us travels toward Nuxa’lk and reaches a mountain with axe
    stone; the bird Qlé’lx”’ana is frightened away and makes salmon ascend Bella Coola
    River.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: An avalanche buries a village and kills Anoxema’axots; a man whose house has
    a post with a copper fastened to it survives and is dug out by returning brothers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Nana’tskuit and siblings travel to So’mx6r; Raven investigates why a river
