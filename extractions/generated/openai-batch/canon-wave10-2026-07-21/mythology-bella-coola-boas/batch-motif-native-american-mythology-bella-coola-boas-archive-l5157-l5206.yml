canonical_text:
  quote: ''
  summary: An old woman warns a young male visitor that the men at the rear of the
    house intend to harm him. She gives him a mountain-goat bladder containing cold
    wind and tells him to open it when fire threatens him. The Sun tests the visitor
    by heat near the fire and then traps him in a doorless underground stone house
    with a fire inside. Each time, the visitor opens the bladder; cold wind, snow,
    and icicles counter the heat. The Sun sends his four daughters to sweep out what
    he expects to be the visitor’s remains, but they find the interior icy and the
    youth alive; as they descend, he sees their genitalia and scratches them.
  language: English
  quote_policy: summarized
