canonical_text:
  quote: Yuyo'lkumai and Qoa’x were sent down by the Sun to the top of the mountain
    SqtsL.
  summary: The Sun sends Yuyo'lkumai and Qoa’x down to a mountain. Yuyo'lkumai is
    assigned to give languages to the tribes and live in Senxi, descends with his
    sister, and receives names from the Sun. Qoa’x dislikes earth, wishes to return
    to the sky, assumes deer form, and recovers his fire-drill. In a treeless landscape,
    Yuyo'lkumai makes a leaf hut, sees a salmon-weir, and follows the Sun’s water
    test with a stick and four abalone shells; when the stick is absent, he concludes
    there are no people higher upriver.
  language: English
  quote_policy: quoted
