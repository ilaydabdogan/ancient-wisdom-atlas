canonical_text:
  quote: ''
  summary: The passage is an ethnographic-historical account of Thompson Indian territorial
    boundaries, population decline, settlement movement, memories of former population
    density, estimates around the arrival of white miners, famine, smallpox mortality,
    flight to mountains and sweat-houses during epidemic, winter-house deaths and
    burial, and initial statistics for the Spences Bridge Indians.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Current tradition is reported as saying that tribal boundaries had remained
    the same except for Shuswap-speaking people formerly extending farther down Thompson
    River and an Athapascan tribe formerly holding the Nicola Lake area; both groups
    are said to have been absorbed by the Thompsons.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Thompson tribe is described as greatly reduced in numbers, while the passage
    cautions that numerous underground-house ruins alone do not prove decrease because
    families sometimes built multiple houses and survivors or later residents moved
    to new settlements, reserves, or arable land.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Old people are reported as saying that forty or fifty years earlier, smoke
    from Indian camp-fires was always visible along Thompson River, and old Indians
    compared the number of people near Lytton to ants around an ant-hill.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage estimates that in 1858 the Indian population between Spuzzum and
    Lytton was at least two thousand, compared with probably not over seven hundred
    at the time of writing, and infers that the entire tribe had numbered at least
    five thousand.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: A famine is said to have depopulated the tribe a year or two before the arrival
    of white miners, but the actual decrease is said to have taken place only since
    the advent of whites in 1858 and 1859.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Smallpox is described as the greatest cause of reduction; it was brought into
    the country in 1863 and, if old people’s evidence is reliable, killed from one-fourth
    to one-third of the tribe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: During the smallpox outbreak, some Indians fled to the mountains, some died
    along the trail, and some took refuge in sweat-houses expecting cure by sweating
    but died there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: During the spring epidemic, winter-house conditions exposed inhabitants to
    contagion; one group near Spences Bridge was completely exterminated, another
    group of about twenty all died inside a house, and friends buried them by letting
    the roof down before later moving the bones to a graveyard.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The author rejects the general explanation that decrease among Indian tribes
    is chiefly due to old people dying and women’s sterility, stating that among the
    Upper Thompson Indians there are comparatively few sterile women.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: For Spences Bridge, the author reports an 1884 count of 144 Indians, excluding
    thirteen temporary residents, and introduces a ten-year record of changes from
    1884 to 1894.
  category: attribute
  evidence_refs:
  - ev:9
