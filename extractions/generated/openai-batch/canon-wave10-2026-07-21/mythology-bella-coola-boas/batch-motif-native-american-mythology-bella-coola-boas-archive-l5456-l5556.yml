canonical_text:
  quote: ''
  summary: In one episode, an unnamed boy leads a Snéné’iq to two stone knives, beheads
    her, and prevents her head from rejoining her body. He then enters her house,
    finds his sister and other children dead or dried, revives them by patting their
    bodies, and brings them home. After growing up, marrying, and having a rapidly
    growing son, he identifies himself as Son of the Sun, says he was sent by his
    father to recover the daughter, instructs his mother to guard his son and gather
    eagle-down, and ascends skyward in the down. A second narrative begins with the
    people of Q’6o’mqitis discovering that bodies are being taken from their burial-ground.
    Kxua’naL feigns death to investigate; a Snéné’iq carries him away in a basket.
    Kxua’naL attempts to escape by grasping a tree branch but is carried on to the
    Snéné’iq’s house, where he sees the Snéné’iq household around a fire and notices
    a harpoon.
  language: English
  quote_policy: summarized
