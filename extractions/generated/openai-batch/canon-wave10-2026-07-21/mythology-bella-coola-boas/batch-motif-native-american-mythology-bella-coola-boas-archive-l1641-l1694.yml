- id: obs:4
  text: The discussed collection was obtained from E'’drnsa, a Haida chief from Masset
    described as a famous artist of the tribe.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The material is arranged from realistic representations toward more conventional
    and geometrical animal designs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Decorations differ according to the rank and wealth of the wearer.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Full and realistic animal representations are said to have greater value and
    to indicate higher rank than conventional symbols of animals.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'The Haida are described as divided into two exogamous clans: the Raven clan,
    Q’oa''la, and the Eagle clan, Giit’ina’.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Haida clans are subdivided into many families, and each family has a number
    of crests.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Some crests are common to a clan: the Eagle clan has the eagle, and almost
    all Raven clan families have the bear and killer whale.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Special family crests are said to derive from traditions about an ancestor’s
    adventures and encounters with an animal or spirit.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: 'The Haida are described as having maternal descent: a child belongs to the
    mother’s clan and inherits the maternal uncle’s rank and property.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: A youth initially appears to possess only the most general clan crest, while
    higher rank and property distributions can entitle him to additional crests.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Use of the total number of family crests appears to be restricted to the family
