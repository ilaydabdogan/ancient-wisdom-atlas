  quote: ''
  summary: The passage introduces a collection of Haida facial paintings used for
    festive dances, describes their crest subjects, colors, materials, and application
    methods, and explains how Haida clans, families, maternal descent, rank, property
    distribution, and ancestral traditions relate to crest use.
  language: English
  quote_policy: summarized
