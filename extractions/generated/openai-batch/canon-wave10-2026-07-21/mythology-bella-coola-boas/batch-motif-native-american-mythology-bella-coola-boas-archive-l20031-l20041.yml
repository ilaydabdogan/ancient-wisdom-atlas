canonical_text:
  quote: ''
  summary: 'The passage describes three aged guardians stationed at points along the
    trail of souls: before a river, between the river and the land of ghosts, and
    at a lodge at the trail’s end. Their duty is to send back souls whose time to
    enter the ghost-land has not arrived. The third guardian is chief and may send
    messages to the living world with returning souls. The soul eventually reaches
    the door of a large lodge made of hard white material.'
  language: English
