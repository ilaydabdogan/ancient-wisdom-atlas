  summary: 'An ethnographic passage describes Thompson social customs: a nighttime
    exchange involving a decorated kettle or formerly a decorated stone with a burning
    cedar-bark slow-match; older and newer forms of potlatch involving feasting, wealth
    display, distribution of presents, and in some cases expected future return-giving;
    and a brief contrast with Coast tribes'' potlatches.'
