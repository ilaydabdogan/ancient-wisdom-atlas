literal_observations:
- id: obs:1
  text: Three or four men took a food-filled kettle decorated with feathers, strings,
    and a lighted cedar-bark slow-match, along with bundles of clothes, skins, and
    food, to a friend's winter house around bedtime.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The men lowered the kettle into the house on a long string, swung it violently,
    sang, and repeatedly pulled it up when people inside tried to catch it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the people inside finally caught the kettle, the men outside threw in
    bundles of food, clothes, and other items, and the people inside scrambled for
    them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the visit, the household that had received the gifts later visited the
    givers and treated them in the same way.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The earlier form of the custom used a painted and decorated stone instead
