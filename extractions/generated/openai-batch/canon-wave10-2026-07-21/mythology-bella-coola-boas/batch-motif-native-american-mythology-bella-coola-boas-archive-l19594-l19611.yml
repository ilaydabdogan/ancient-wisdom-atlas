canonical_text:
  quote: ''
  summary: The passage describes a large payment ceremony held about a year after
    a person’s death. Relatives host and feed people, erect a grave fence, compensate
    those who performed funeral-related services, settle substantiated debts of the
    deceased, and distribute horses whose proceeds are divided among the assembled
    people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A day about one year after a death is used as the occasion for a large “paying”
    day by the deceased person’s relatives.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ceremony is said to be often confused by white observers with the potlatch
    described elsewhere.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: People from the surrounding area are called to the house of the dead person’s
    chief relative and are feasted for several days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A fence is generally erected around the grave while the assembly is called
    out to witness it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The relatives announce that they are going to pay, and the payments consist
    of money, blankets, horses, and similar goods.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The person who washed the deceased, the coffin maker, the grave diggers, and
    the fence makers receive payments.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The messenger who announced the death and the women who cooked for the company
    are also paid.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: If the deceased owed debts and claimants substantiate them, those debts are
    paid.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Horses are given to the assembled company “to wipe away their tears,” then
    sold to the highest bidder, with the money divided among the people.
  category: action
  evidence_refs:
  - ev:5
