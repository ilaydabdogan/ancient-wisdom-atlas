canonical_text:
  quote: ''
  summary: The passage describes Thompson practices for distributing game from hunting,
    the status attached to hunting skill, gendered labor expectations, contemporary
    election and duties of chiefs, and winter feasting as a form of sociability and
    liberality.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who hunted alone and shot several deer distributed part of the spoils
    among friends as a recognized custom and as a sign of liberality and regard, with
    expectation of similar treatment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among Spences Bridge people, the hunter brought game to his house and generally
    distributed the meat himself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Among the Nicola band, a hunter could leave meat, sinew, or skins in the mountains
    for poor people or less successful hunters or fishermen, tell them what was left,
    describe the place, and be praised for hunting ability and liberality.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Among the Lower Thompsons, a hunting-chief divided fat, meat, and skins almost
    equally among a returning hunting-party, with the best hunters allowed a skin
    or two or a little extra fat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A solitary hunter who killed more animals than he could carry invited friends
    to help bring the meat home; after the animals were skinned and cut up, the hunter
    divided the portions equally so far as fairness allowed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a solitary hunter carried home one deer or goat himself, others had no
    right to claim the meat, though he generally shared portions with friends and
    neighbors for reciprocal reasons; trapped animals belonged entirely to the trapper.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hunting was considered the most honorable occupation, and boys skilled in
    hunting were called grown, while adults without distinction in hunting or war
    were not called grown up.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Men's stated duties included hunting, trapping, fishing, snaring, fighting,
    tool and weapon making, felling trees, instructing children, tending horses and
    hunting-dogs, energetic conduct, and protecting or admonishing wives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Married women's stated duties included house work, gathering firewood, erecting
    and cleaning lodges, lighting fires, making mats, baskets, bags, clothing, cooking,
    processing roots and berries, helping with fish and game, dressing skins, fetching
    water, child care, and educating daughters.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Chiefs are described as elected by vote, influenced by priest or Indian agent,
    and responsible for ecclesiastical affairs, tribal speech-making, reserve matters,
    and minor disputes in council.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Winter feasts included social gatherings where a family with abundant food
    invited neighboring families to eat and converse, showing the donor's goodwill
    and liberality.
  category: action
  evidence_refs:
  - ev:7
