  locator: lines 2606-2610
  quote_or_summary: Masmasala’nix is associated with hunting instruction, fish-making
    in some accounts, and giving Bella Coola carvers the ideas for designs.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; concise summary used.
- id: ev:2
  type: summary
  locator: lines 2611-2629
  quote_or_summary: Sp'ix-pikne’m, daughter of Senx, invents cedar-bark working; her
    ka’siut figure enacts the work with Omatosé’k-, a board, a breaker, cedar-bark,
    and a song identifying her as the Cedar-bark Breaker.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; concise summary used.
- id: ev:3
  type: summary
  locator: lines 2630-2638
  quote_or_summary: Raven’s connection with the House of Myths is described as obscure
    and contradictory; some family traditions say he was sent down by Senx to become
    an ancestor of man and that he invented arts, including the first salmon-trap.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; concise summary used.
- id: ev:4
  type: summary
  locator: lines 2639-2645
  quote_or_summary: Masmasala’nix unsuccessfully attempts to make winter ceremonial
    whistles, Raven succeeds, Raven gives the world its present shape, institutes
    Bella Coola festivals, and returns to the House of Myths.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; concise summary used.
- id: ev:5
  type: summary
  locator: lines 2646-2665
  quote_or_summary: Nine brothers and their sister L’étsa’apléLana are listed as deities
    concerned with the ki’siut ceremonial and described with moon, star, rainbow,
    blossom, kingfisher, sea-lion-bladder, and cedar-bark attributes; Xémxémala’oLla
    carries Nuspo’xta, who restrains them from harming humans.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; concise summary used.
- id: ev:6
  type: summary
  locator: lines 2666-2674
  quote_or_summary: In one tradition L’étsa’apléLana steals provisions, is pursued
    and wounded by the wronged person, returns to the House of Myths, cannot be cured
    by the deities, and recovers when the wronged person withdraws his arrow.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; concise summary used.
- id: ev:7
  type: summary
  locator: lines 2674-2678
  quote_or_summary: Boas notes that the ten deities appear to be deities of the ki’siut
    rather than the sisau’k ceremonial.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; concise summary used.
- id: ev:8
  type: summary
  locator: lines 2679-2687
  quote_or_summary: In the rear of the House of Myths is Llo’sta, where Ba’exoLla
    or Snupaaxora’t lives; when Senx and Axk’unta’m want to destroy visitors, they
    send them past his door, he devours them, and he also initiates the Cannibal.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; concise summary used.
- id: ev:9
  type: summary
  locator: lines 2687-2698
  quote_or_summary: In the Sr’nxtemx’ tradition, Ba’exoLla comes to mountain Sqtst,
    meets the son of Srnxalo’bela, takes him to the House of Myths, names him Q’oalaiu’tstimot,
    and places a snake in his body that lets him pass through water and eat flesh
    through the youth’s mouth.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; concise summary used.
- id: ev:10
  type: summary
  locator: lines 2699-2705
  quote_or_summary: Ba’exoLla takes the youth to the upper heaven past the rent in
    the sky and to Qama‘its’s house, where a strong gale blows them toward the house.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; concise summary used.
- id: ev:11
  type: summary
  locator: lines 2705-2711
  quote_or_summary: Qama‘its offers to give the desired supernatural power and tells
    them to watch her house post; when the post closes its eyes it becomes dark and
    the visitors faint, and when it opens its eyes light returns.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain source; concise summary used.
