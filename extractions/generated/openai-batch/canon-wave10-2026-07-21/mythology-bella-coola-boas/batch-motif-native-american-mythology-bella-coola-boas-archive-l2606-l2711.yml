candidate_motifs:
- id: motif:1
  label: Divine invention of ceremonial craft
  taxonomy_refs:
  - culture_hero
  basis: Sp'ix-pikne’m invents cedar-bark working and Raven invents or completes ceremonial
    and subsistence technologies such as the salmon-trap and whistles.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage presents multiple figures and traditions rather than a single
    unified narrative of invention.
- id: motif:2
  label: Raven as world-shaping culture figure
  taxonomy_refs:
  - culture_hero
  basis: Raven is said to have been sent as an ancestor of man, to have invented arts,
    to have given the world its present shape, and to have instituted Bella Coola
    festivals.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage explicitly notes that Raven’s residence in the House of Myths
    is obscure and contradictory.
- id: motif:3
  label: Supernatural initiation through naming and bodily serpent
  taxonomy_refs:
  - initiation
  - serpent
  basis: Ba’exoLla initiates the Cannibal, gives the youth a new name, and puts a
    snake in his body that gives powers and eats flesh through him.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage reports this as a tribal tradition explaining Cannibal Society
    membership; broader ritual details are not included here.
- id: motif:4
  label: Ascent to upper heaven for supernatural power
  taxonomy_refs:
  - ascent
  - initiation
  basis: Ba’exoLla takes the youth past a rent in the sky to the upper heaven and
    Qama‘its’s house, where Qama‘its says the youth will receive supernatural power.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage ends during this episode, so the full outcome of the promised
    power is outside the provided range.
- id: motif:5
  label: Devouring guardian or dangerous inner-room being
  taxonomy_refs:
  - initiation
  basis: Ba’exoLla dwells in a rear room and devours visitors sent past his door;
    the same figure also initiates the Cannibal.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The devouring of visitors and initiation of the Cannibal are adjacent
    statements, but the passage does not fully explain their ritual relationship.
- id: motif:6
  label: Theft followed by pursuit, wounding, and cure by the wronged person
  taxonomy_refs:
  - sacred_theft
  basis: L’étsa’apléLana steals provisions, is pursued by the person she wronged,
    returns wounded to the House of Myths, and recovers only when that person withdraws
    his arrow.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The stolen goods are ordinary provisions in the passage; the classification
    as sacred theft is tentative because the thief is a deity, not because the provisions
    are described as sacred.
- id: motif:7
  label: Animate house post controlling light and darkness
  taxonomy_refs: []
  basis: At Qama‘its’s house, the post’s closing eyes immediately brings darkness
    and fainting, while the opening of its eyes restores light.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage gives the event but does not explain the post’s broader cosmological
    function.
