canonical_text:
  quote: ''
  summary: 'The passage describes Bella Coola mythological beings associated with
    invented arts, ceremonial figures, and the House of Myths: Sp''ix-pikne’m invents
    cedar-bark working; Raven is linked with ancestry, inventions, world-shaping,
    and festivals; a group of nine brothers and their sister are described as ki’siut
    deities with specific painted designs; L’étsa’apléLana steals provisions and is
    cured by the person she wronged; Ba’exoLla lives in a rear room of the House of
    Myths, devours visitors, initiates the Cannibal, and conducts a youth to the House
    of Myths and then to Qama‘its in the upper heaven, where a house post controls
    darkness and light by closing and opening its eyes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Masmasala’nix is said to teach hunting methods, to have made fish according
    to some accounts, and to provide ideas for carving designs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Senx has a daughter, Sp'ix-pikne’m, who invented the art of working cedar-bark;
    her figure is used in the ka’siut ceremonial to represent that invention.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sp'ix-pikne’m calls for Omatosé’k-, a board, a cedar-bark breaker, and cedar-bark
    before beginning work and singing that she is the Cedar-bark Breaker.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Raven’s residence in the House of Myths is reported as obscure and contradictory;
    some family traditions say he was sent down by Senx to become an ancestor of man
    while also inventing arts.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Raven is credited with making the first salmon-trap, making ceremonial whistles
    after Masmasala’nix failed, giving the world its present shape, instituting Bella
    Coola festivals, and returning to the House of Myths.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Nine brothers and their sister are especially concerned with the ki’siut ceremonial
    and are described with painted designs including full moon, half moon, stars,
    rainbow, salmon-berry blossom, kingfisher form, and sea-lion bladder filled with
    grease.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:7
  text: Xémxémala’oLla is said to carry a small woman named Nuspo’xta, who entreats
    the brothers and their sister to desist when they threaten harm to humans.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In one tradition, L’étsa’apléLana visits houses and steals provisions, is
    pursued by the wronged person, returns to the House of Myths, cannot be cured
    by the deities, and recovers after the wronged person withdraws his arrow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ba’exoLla or Snupaaxora’t lives in a rear room named Llo’sta in the House
    of Myths; when Senx and Axk’unta’m wish to destroy visitors, they send them past
    his door and he devours them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ba’exoLla initiates the Cannibal and, in the Sr’nxtemx’ tradition, conducts
    the son of Srnxalo’bela from a mountain to the House of Myths, gives him the name
    Q’oalaiu’tstimot, and places a snake in his body.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The snake placed in the youth’s body enables him to pass through water and
    tears flesh from a person’s body when the youth applies his mouth to that body.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Ba’exoLla takes the youth past a rent in the sky to the upper heaven and the
    house of the supreme deity Qama‘its, where a strong gale blows them toward the
    house.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Qama‘its says she will give the youth great supernatural power and tells the
    visitors to watch when the post of her house closes its eyes; when it closes its
    eyes, darkness comes and the visitors faint, and when it opens its eyes, light
    returns.
  category: speech
  evidence_refs:
  - ev:11
