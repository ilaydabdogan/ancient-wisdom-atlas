canonical_text:
  quote: ''
  summary: Hudson Bay Company agents are described as the first whites to reach the
    vicinity and as building a block-house west of the mouth of North Thompson River.
    Nearby graves are identified as belonging to Indians who first met whites; the
    bodies were buried on their backs with heads west in wooden coffins fastened with
    blacksmith-made iron nails. Traces of underground houses were found near the graves.
    Local Indians did not object to exploration of graves they knew were those of
    immediate ancestors, but they did not know the people associated with other graves
    at Kamloops.
  language: English
  quote_policy: summarized
