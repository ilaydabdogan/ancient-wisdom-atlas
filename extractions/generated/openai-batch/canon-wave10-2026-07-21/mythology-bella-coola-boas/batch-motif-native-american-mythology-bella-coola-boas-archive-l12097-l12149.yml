  summary: The passage describes Thompson Indian storage structures, caches, scaffolds,
    houses, camping and seasonal residence patterns, household furnishings, sleeping
    and eating arrangements, and basket and bag uses, including exchange of cedar-root
    baskets between lower and upper divisions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Berries or roots for storage are placed in baskets and wrapped with birch-bark
    before the roof of the storage structure is put on.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described storage roof uses two crossed layers of closely laid poles,
    pine-needles, and earth, with a central opening that can be closed with sticks
    or bark and earth.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some storage cellars, especially for fish, are made in the side of a bank
    with a side door.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Lower Thompsons use a raised box-like cache, usually made of boards, with
    a slanting roof, a small gable-end door, and access by a short ladder underneath.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some raised caches have shingles and tin around the posts to keep mice and
    other animals out.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Upper Thompsons build pole scaffolds near their houses, about five feet
    above the ground, for storing cumbersome articles such as saddles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the time described, Thompson Indians live in villages of well-built log-houses,
    many with lumber floors and shingle roofs, with some houses occupied year-round
    and others intermittently.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: People also camp near hunting, fishing, root-digging, gold-mining, reserve,
    and agricultural locations; some live in small log-houses during the farming season,
    while a few prefer year-round summer lodges.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sleeping arrangements include brush or dry grass covered with skins or grass
    mats, rolled ends or filled skin bags as pillows, and buckskin hammock beds fastened
    to beams or posts.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Meal-time mats are spread on the ground and serve as tables, with people squatting
    around them and helping themselves to food.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Baskets and bags are used for storage, carrying, and other purposes; large
    lidded oblong baskets store food and clothing, while smaller ones hold sewing
    materials and trinkets.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The lower division sells cedar-root baskets to the upper division, making
    those baskets common among the upper division.
  category: relationship
  evidence_refs:
  - ev:6
