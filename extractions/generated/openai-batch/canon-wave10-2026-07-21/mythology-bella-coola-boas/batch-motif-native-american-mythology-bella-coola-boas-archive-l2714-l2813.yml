canonical_text:
  quote: ''
  summary: The passage describes a youth and companion at Qama’its’s house, where
    a house post closes its eyes and they briefly become stones; Qama’its gives the
    youth a bear-skin and cedar-bark blanket, sprinkles visitors with water from a
    salt-water pond, instructs the youth about the Cannibal dance, and sends him back.
    The youth descends on a bird to the sea, is approached by people in canoes, and
    returns to the village where a snake in his body tears flesh from people until
    they sing and beat time. The passage then describes Kok0o’sLxEm as an initiator
    of the Olx-dancer, and gives cosmological accounts of Sun guardians, a sky-supporting
    post, the Sun’s bridge and solstice regulators, solar phenomena, twenty-four sky
    guardians, the bursting of the sky from too much firewood, and Masmasala’nix repairing
    the sky and establishing the Sun’s daily course.
  language: English
  quote_policy: summarized
