  quote_or_summary: The speaker invites dancers to the dancing-house; the masked Cannibal
    enters with assistants, women prepare to surround him, he cries and growls, bites
    two men, dances around the fire with the fire on his left, and is pacified over
    four nights by songs and dances.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain; summarized.
- id: ev:8
  type: summary
  locator: lines 7228-7235
  quote_or_summary: The Cannibal tells what he saw during his absence, the song-leader
    makes a song, and after four days the S’a’Lpsta monster is exorcised using a red
    cedar-bark-ornamented dish and incantations that make him vomit a snake, wolf,
    or eagle.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain; summarized.
- id: ev:9
  type: summary
  locator: lines 7235-7242
  quote_or_summary: The animal is seen with head and body and vomits flesh and blood
    into the dish; assistants cover it with down and cry “Hoip”; S’a’Lpsta disappears,
    the Cannibal becomes ordinary, circles the fire with it on his right, and says
    Ba’exoila has left him.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain; summarized with short quoted cry/name.
- id: ev:10
  type: summary
  locator: lines 7242-7246
  quote_or_summary: The dish contents are thrown into water; the dish is burned in
    the dancing-house and is supposed to be conveyed to heaven; after this the Cannibal
    no longer dances and a bed is prepared for him for four days.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain; summarized.
- id: ev:11
  type: summary
  locator: lines 7246-7249
  quote_or_summary: After four days he may re-enter houses, but first must stop at
    the door, shout “Wa, wa, wa,” and jump over the threshold; after four more days
    he is led to the river.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain; summarized with short quoted cry.
- id: ev:12
  type: summary
  locator: lines 7249-7259
  quote_or_summary: At the river he is pushed into the water for final purification,
    struggles, returns weeping because the spirit has left, receives salmon on his
    throat, later takes one bite, and after the dancing season may eat normally; children
    eat the salmon for protection against sickness.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain; summarized.
- id: ev:13
  type: summary
  locator: lines 7259-7265
  quote_or_summary: A rite called taking the lip of S’a’Lpsta out of the Cannibal’s
    body is performed; the lip is thrown onto another Cannibal, who falls into ecstasy,
    and the shaman throws it toward the sky, where it disappears.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/mythology-bella-coola-boas.md
  rights_note: Public domain; summarized.
- id: ev:14
  type: summary
  locator: lines 7265-7277
  quote_or_summary: The dish and spoon used by the Cannibal during ecstasy are destroyed,
    and he must wear a small red cedar-bark ring for four years.
