candidate_motifs:
- id: motif:1
  label: Spirit-led initiation in an upper mythic house and return
  taxonomy_refs:
  - initiation
  - ascent
  - return
  basis: The novice is taken up by a spirit to the House of Myths, initiated there,
    and returns altered by the experience.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage gives ritual description rather than a full narrative itinerary;
    “ascent” is based on the wording that the spirit takes him up and on the reference
    to higher regions.
- id: motif:2
  label: Dangerous possessed initiate pacified by community ceremony
  taxonomy_refs:
  - initiation
  basis: The ka’siut ceremonial is explicitly said to pacify the Cannibal and exorcise
    the possessing spirit; the people and assistants try to control and quiet him
    through capture attempts, cries, songs, and dances.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The available taxonomy has no specific possession or exorcism family,
    so the taxonomy reference is limited to initiation.
- id: motif:3
  label: Exorcism through vomiting a possessing animal
  taxonomy_refs:
  - serpent
  basis: The assistant of S’a’Lpsta makes the Cannibal vomit the snake, wolf, or eagle
    that possesses him; the animal then vomits flesh and blood into the ritual dish.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The serpent taxonomy applies only to the snake form; the passage presents
    snake, wolf, and eagle as alternatives.
- id: motif:4
  label: Purification and reintegration after spirit possession
  taxonomy_refs:
  - initiation
  - return
  basis: After exorcism, the Cannibal stops dancing, remains apart, performs a threshold
    re-entry, undergoes river purification, returns weeping because the spirit has
    left, and gradually resumes eating normally.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The extraction keeps to the ritual sequence and does not infer social
    meanings beyond reintegration described in the passage.
- id: motif:5
  label: Transfer and skyward removal of a dangerous ritual remnant
  taxonomy_refs: []
  basis: The S’a’Lpsta lip is taken from the Cannibal’s body, thrown onto another
    Cannibal who falls into ecstasy, then retrieved by the shaman and thrown toward
    the sky, where it disappears.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The passage describes the act but does not explicitly explain the lip’s
    nature or broader symbolism.
- id: motif:6
  label: Ritual destruction or disposal of objects used in dangerous states
  taxonomy_refs: []
  basis: The flesh and blood contents of the dish are thrown into water, the dish
    is burned, and the dish and spoon used during the Cannibal’s ecstasy are destroyed.
  evidence_refs:
  - ev:10
  - ev:14
  confidence: medium
  cautions: The passage does not state whether these disposals are purificatory, protective,
    or both; that function should be reviewed.
