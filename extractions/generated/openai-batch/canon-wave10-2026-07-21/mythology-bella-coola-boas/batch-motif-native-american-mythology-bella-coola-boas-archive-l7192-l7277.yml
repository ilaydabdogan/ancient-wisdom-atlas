canonical_text:
  quote: ''
  summary: A novice is taken by a spirit to the House of Myths and returns as a Cannibal.
    The community conducts a ceremonial sequence to capture, pacify, dance with, exorcise,
    purify, and reintegrate him. The ceremony includes masked assistants, cries of
    “Hoip,” circuits around the fire, exorcism of the S’a’Lpsta monster through a
    vomited animal, disposal of blood and flesh in a dish, river purification, food
    restrictions, transfer and removal of a S’a’Lpsta lip, destruction of ritual utensils,
    and four years of wearing a red cedar-bark ring.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A spirit appears to a novice in the woods, takes him up to the House of Myths,
    and initiates him there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The novice returns early in the morning, is heard outside the houses, and
    has lost nearly all his hair; the loss is attributed to strong wind in the higher
    regions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some Cannibals are described as not eating human flesh, but tearing dogs apart
    or eating raw salmon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The stated object of the ka’siut ceremonial is to pacify the Cannibal and
    exorcise the spirit possessing him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the Cannibal approaches, a black-painted speaker wearing a cedar-bark
    ring and eagle-down calls out to awaken the people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Cannibal is accompanied by four assistants called Aritpa, who wear masks
    and cry “Hoip” to pacify him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The people try to capture the Cannibal with a noose and ropes; he throws them
    off, tears the ropes, disappears, and is later found after a search.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When the people approach him, the Cannibal attacks them but gradually becomes
    quieter.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the dancing-house, the Cannibal opens the door with his assistants, wears
    a mask, utters cries and a growl, bites two men, and dances around the fire leaving
    it to his left.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Cannibal dances for four nights while the people try to pacify him with
    songs and dances.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After entering the house and becoming quieter, the Cannibal tells the people
    what he saw during his absence, and the song-leader makes a song about it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Four days later, the S’a’Lpsta monster that possesses him is exorcised; an
    ornamented dish is prepared, and the assistant of S’a’Lpsta uses incantations
    to make the Cannibal vomit a snake, wolf, or eagle.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The animal associated with the possession is seen to vomit flesh and blood
    into the prepared dish; the assistants cover its body with down while crying “Hoip.”
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: After the S’a’Lpsta disappears, the people beat time four times, the Cannibal
    becomes like an ordinary man, walks around the fire keeping it to his right, and
    says that Ba’exoila has left him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The dish contents are thrown into water, while the dish itself is burned in
    the dancing-house and is said to be conveyed to heaven.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: After the exorcism, the Cannibal stops dancing, stays in a prepared bed for
    four days, and later re-enters houses only after stopping at the door, shouting,
    and jumping over the threshold.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:17
  text: For final purification, he is taken to the river, pushed into the water, struggles,
    and is brought back weeping because the spirit has entirely left him.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:18
  text: A piece of salmon is placed on his throat, then removed, and later he is allowed
    one bite; after the dancing season he may eat normally again.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:19
  text: The salmon that touched his throat is eaten by children as protection against
    sickness.
  category: action
  evidence_refs:
  - ev:12
- id: obs:20
  text: A later rite removes the lip of S’a’Lpsta from the Cannibal’s body; the lip
    is thrown on another Cannibal, who falls into ecstasy, and the shaman throws it
    toward the sky, where it disappears.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:21
  text: The dish and spoon used by the Cannibal during his ecstasy are destroyed,
    and for four years he must wear a small red cedar-bark ring.
  category: sequence
  evidence_refs:
  - ev:14
