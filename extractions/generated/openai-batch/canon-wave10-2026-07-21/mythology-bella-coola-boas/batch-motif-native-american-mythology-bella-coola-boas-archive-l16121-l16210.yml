canonical_text:
  quote: ''
  summary: 'The passage describes Thompson defensive fortresses and war-expeditions:
    fortress construction and supplies, contrast with Lillooet fortresses, motives
    for raids, war-party organization, scouting and signals, sparse food and fire
    use, war-paint and battle preparation, discipline, division of spoils, and occasional
    taking and display of enemy heads, scalps, and hair.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fortresses are described as located near main rivers, with long trench-like
    entrances roofed with sticks and brush, covered with earth, blocked by large stones,
    and supplied with food and water.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Thompson fortresses are said to have been impregnable because they could
    not be broken into successfully or set on fire from outside.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lillooet fortresses are described as different in construction and sometimes
    taken by storm or set on fire by arrows with lighted cedar-bark attached.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Thompson war-expeditions occurred often before fur-traders, while full tribal
    wars were rare; warfare is described as being mainly for plunder, adventure, or
    revenge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: War-parties ranged from five or six persons to several hundred, and a man
    who refused to join lost respect among his fellows.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Stories about war-parties are said to emphasize endurance, courage, and prowess,
    but also cruelty and treachery.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The stated object of war-parties was surprise by stealthy attack or sudden
    onslaught; ambuscades were frequent, and storming a stockade or fortified house
    was considered very brave but uncommon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A war-party was commanded by a war-chief; inexperienced young men were kept
    in the middle, the best men led, and scouts went ahead and watched the camp at
    night.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Warriors communicated by imitated bird or animal cries, sign language, and
    notices made with sticks placed in special positions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The war-party carried little food, ate sparingly, and the chief distributed
    food around the circle opposite to the sun’s course.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: War-parties made few and small fires, preferring yellow-pine bark because
    its fire went out quickly and made the fire’s age hard to determine.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Men in a war-party wore little clothing for freedom of movement, or armor;
    before hand-to-hand fighting the bow and quiver were often thrown aside.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Before attacks, warriors applied war-paint and dressed their hair in a warrior
    style, using red and black patterns; some patterns were based on dreams, and some
    parties used a uniform style to avoid confusing allies with enemies.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Some warriors fasted the day before an imminent attack; in close combat, front
    men used short spears, men behind used tomahawks, clubs, and long knives, and
    those behind them used bows and arrows.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: A man who fled before or during battle could be shot by companions for cowardice.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The war-chief generally divided booty and slaves, with brave or distinguished
    warriors receiving better shares, though disorder and disputes over spoils could
    occur.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: Scalping and beheading are described as occasional rather than common; an
    enemy head could be displayed and then thrown into the river.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: Weapons and clothing could be ornamented with locks of enemy scalp hair, belts
    or braids could be made from long hair with eagle-feathers, and dried scalps could
    be worn in the hair to show that a man was an old warrior.
  category: object
  evidence_refs:
  - ev:10
