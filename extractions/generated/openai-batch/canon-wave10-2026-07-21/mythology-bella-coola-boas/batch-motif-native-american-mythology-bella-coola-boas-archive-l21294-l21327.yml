canonical_text:
  quote: ''
  summary: 'The passage reports three recent prophets among the tribe: a Fraser Delta
    man who prayed, used an interpreter, performed sleight-of-hand, and later died;
    a Nicola woman who said she had been in the land of souls and described its wonders;
    and an Okanagon woman who claimed visionary destiny as savior of the Indians,
    invulnerability, and urged battle against whites before turning back under opposition.
    The passage then lists ethical teachings against theft, sexual misconduct, lying,
    laziness, adultery, and boasting, emphasizing ridicule, shame, distrust, poverty,
    divorce, harm, and insulting labels as consequences.'
  language: English
  quote_policy: summarized
