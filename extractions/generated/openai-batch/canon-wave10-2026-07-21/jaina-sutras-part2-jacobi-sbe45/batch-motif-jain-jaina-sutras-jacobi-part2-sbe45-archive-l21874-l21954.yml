canonical_text:
  quote: ''
  summary: The passage continues a classificatory account of living beings. It lists
    named animals, describes five-sensed aerial animals and bird wing-types, says
    young birds are hatched by mothers' warmth, describes parasites and vermin arising
    in or on animate and inanimate bodies and substances, and explains water-bodies
    or water-lives as produced, condensed, carried, and directed by wind, including
    forms such as frost, snow, mist, hail, dew, and rain. It also states that some
    beings born in water come forth in water-bodies and feed on their humours.
  language: English
  quote_policy: summarized
