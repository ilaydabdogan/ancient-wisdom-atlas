  summary: The passage rejects rival doctrines of cosmic creation from a primeval
    egg and by Brahman, asserts that the world is not created and will not perish,
    explains misery through wicked deeds, criticizes doctrines about post-liberation
    defilement of the soul, describes uncontrolled disputants whirling in the beginningless
    Circle of Births and becoming lowest Asuras, and instructs the wise monk not to
    mix with such heretics or with possessive religious paths.
