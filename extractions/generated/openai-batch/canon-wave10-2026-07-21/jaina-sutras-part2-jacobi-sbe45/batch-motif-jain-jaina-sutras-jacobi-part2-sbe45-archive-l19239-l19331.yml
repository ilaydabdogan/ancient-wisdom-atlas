canonical_text:
  quote: '"We shall teach him our religion."'
  summary: 'The passage introduces a king ruling a pacified kingdom, lists his assembly,
    and describes religious teachers approaching a faithful man, apparently the king,
    to teach their doctrine. Their teaching argues that the soul is not separate from
    the body: life lasts only as long as the body, the corpse is burned, and no one
    can show a separate soul as one can show a sword apart from its scabbard or a
    fibre apart from grass.'
  language: English
  quote_policy: quoted
