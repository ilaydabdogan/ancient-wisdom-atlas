  summary: The excerpt closes a teaching on ascetic detachment and describes Samudrapala
    attaining liberation after annihilating karma and crossing the flood of worldly
    existence. It then opens the twenty-second lecture, introducing royal households
    at Sauryapura and the figure Arish¢anémi, described as a famous son, saviour of
    the world, lord of ascetics, and bearer of auspicious bodily marks.
