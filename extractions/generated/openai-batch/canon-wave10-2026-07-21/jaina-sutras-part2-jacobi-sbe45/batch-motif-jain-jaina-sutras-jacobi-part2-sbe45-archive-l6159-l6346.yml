canonical_text:
  quote: ''
  summary: A king hunting in the Késara-park kills a deer near a meditating houseless
    ascetic. Fearing he has nearly harmed the monk, he apologizes. The monk teaches
    him non-cruelty, transience, death, karma, and afterlife consequences. The king
    renounces royal power, adopts the faith of the Ginas, and later answers a renounced
    Kshattriya monk about his name, lineage, teacher, doctrine, prior heavenly existence,
    and commitment to self-control.
  language: English
  quote_policy: summarized
