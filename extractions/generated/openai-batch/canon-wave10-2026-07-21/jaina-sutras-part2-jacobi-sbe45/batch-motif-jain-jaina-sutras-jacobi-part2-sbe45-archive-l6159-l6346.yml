  text: The king is accompanied by a large host including horses, elephants, chariots,
    and footmen while hunting deer on horseback in the Késara-park of Kampilya.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A houseless ascetic is present in the Késara-park, engaged in sacred study
