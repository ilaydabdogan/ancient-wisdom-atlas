  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A Kshattriya who had abandoned his kingdom and become a monk asks the former
    king about his name, Gotra, ascetic vocation, veneration of the enlightened ones,
    and reputation as a well-behaved monk.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The former king identifies himself as Sa#zaya/Saṅgaya, says he belongs to
    the Gotra of Gotama, and names Gardabhili as his teacher.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The former king rejects several doctrines as heresies, affirms a life hereafter
