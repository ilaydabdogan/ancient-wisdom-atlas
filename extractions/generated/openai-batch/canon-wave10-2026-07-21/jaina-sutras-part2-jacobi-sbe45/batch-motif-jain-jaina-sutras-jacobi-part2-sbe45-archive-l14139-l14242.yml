canonical_text:
  quote: "“They go from darkness to utter darkness”"
  summary: The passage surveys and rejects several doctrines about the soul, action,
    rebirth, elements, skandhas, and liberation. It criticizes views that identify
    one intelligent principle with the universe, deny post-mortem rebirth and moral
    consequence, separate the soul from action, posit eternal substances, or explain
    body or soul through elements or skandhas. The passage concludes that rival teachers
    promise deliverance to people in various settings if they adopt their creed.
  language: English
  quote_policy: quoted
