  text: The narrator asks how such a theory can explain that a man who undertakes
    action and commits sin will himself suffer severe pain.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Another doctrine says that every fool or sage has an individual soul while
    the body exists, but that after death souls are no more and are not born again.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The same denialist position says there is neither virtue nor vice, no world
    beyond, and that the individual ceases when the body dissolves.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A doctrine attributed in the passage to adherents of the Sankhya philosophy
    says that when a man acts or causes another to act, it is not his soul that acts
    or causes action.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator says that holders of such opinions cannot explain the variety
    of existence in the world and go from darkness to utter darkness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some say there are five elements and the soul as a sixth substance, and that
    the soul and world are eternal.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Some say there are five skandhas of momentary existence and do not admit the
