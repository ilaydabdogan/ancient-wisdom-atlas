  summary: The passage warns monks against intercourse with women through images of
    danger near fire and a lac-filled pot destroyed in fire. It condemns committing
    sin and then denying it for reputation, describes women inviting a monk with offerings
    to their house, and instructs the monk not to desire such visits because sensual
    fetters lead to repeated delusion.
