canonical_text:
  quote: See, life in this world (is transient)
  summary: The passage exhorts hearers to recognize the transience of life, abandon
    delusion and harmful conduct, practice mercy toward living beings, follow ascetic
    discipline, and understand karma, rebirth, and the absence of protection from
    wealth or kin at death. It contrasts destinations such as the abode of Asuras
    and the world of gods and cites the Ginas as authorities for these virtues.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Life in the world is described as transient; even a hundred-year life ends
    as short-lived, while greedy men remain attached to pleasures.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: People who engage in undertakings that harm their souls and kill living beings
    are said to go for a long time to the world of the wicked, the abode of the Asuras.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Foolish people are represented as sinning recklessly while saying they are
    concerned only with the present and questioning who has returned from the next
    world.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The addressees are told to believe the words of one who sees everything, while
    they are described as blind or obstructed by works that result in delusion.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A wise ascetic is instructed to consider that living beings are like himself
    with respect to love of life and aversion to pain.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A householder is instructed to be merciful, fair, and equal toward living
    beings, and is said thereby to go to the world of the gods.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A monk instructed in the creed of the Lord is told to exert himself in truth,
    subdue selfishness, collect pure alms, seek the Law, perform austerities, possess
    the Guptis, and desire liberation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Wealth, cattle, and relations are said not to save or protect a person; at
    calamity or the end of life he must go and come alone.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: All living beings are said to owe their present form of existence to their
    own Karman and to wander in the Circle of Births, subject to birth, old age, and
    death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The present time is called the best opportunity to mend, awakening is called
    difficult to obtain, and the first Gina and other Ginas are said to commend these
    virtues.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Monks are instructed not to kill living beings in the threefold way while
    pursuing spiritual welfare and abstaining from sins.
  category: action
  evidence_refs:
  - ev:10
