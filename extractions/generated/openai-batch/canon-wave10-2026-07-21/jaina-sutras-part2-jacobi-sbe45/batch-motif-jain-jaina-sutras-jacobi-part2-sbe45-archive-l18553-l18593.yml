canonical_text:
  quote: ''
  summary: A didactic Jain passage instructs a renunciant to practice chastity, obey
    the teacher, learn proper conduct, and avoid carelessness. It compares a novice
    who has not mastered the Law to a fledgling carried off by birds of prey when
    it tries to leave the nest too early. It warns that unprincipled men may seduce
    such a novice away from the community, and says a good man should live with his
    teacher to perform duties and end mundane existence.
  language: English
