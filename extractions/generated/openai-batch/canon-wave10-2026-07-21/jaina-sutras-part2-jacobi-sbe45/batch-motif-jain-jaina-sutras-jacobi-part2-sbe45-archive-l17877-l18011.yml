canonical_text:
  quote: All beings hate pains; therefore one should not kill them.
  summary: A dialogue asks for the path preached by the wise Brahmana, glossed as
    Mahavira, by which one crosses the flood of Samsara and reaches liberation. The
    answer describes a difficult path formerly, presently, and futurally followed;
    enumerates six classes of living beings; identifies non-killing and non-injury
    as wisdom and peace/Nirvana; and gives rules for ascetic restraint regarding alms,
    food prepared with slaughter, and speech about gifts that involve harm.
  language: English
  quote_policy: quoted
