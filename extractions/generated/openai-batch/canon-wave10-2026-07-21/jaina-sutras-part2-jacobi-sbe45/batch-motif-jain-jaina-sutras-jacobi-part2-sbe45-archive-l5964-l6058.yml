canonical_text:
  quote: ''
  summary: 'The passage first praises the disciplined chaste monk: pleasant things
    are compared to poison for one seeking the true Self, and the monk is urged to
    abandon them, guard chastity, and remain restrained. Supernatural beings honor
    such a monk, and the eternal Law proclaimed by the Ginas is said to have led the
    Siddhas to perfection. The passage then opens the lecture on the bad Sramana,
    describing a Nirgrantha who has entered the order but becomes complacent, neglects
    study, indulges in comfort, disrespects teachers, harms living things, uses unwiped
    objects, and walks carelessly.'
  language: English
  quote_policy: summarized
