canonical_text:
  quote: ''
  summary: 'The passage concludes the eleventh sin, deceit, as producing bad Karman.
    It then describes the twelfth sin, greed: poorly controlled heretical monks use
    mixed true-and-untrue speech, pursue sensual pleasure, and after death undergo
    adverse rebirths among Asuras and later with impairments. It then introduces a
    thirteenth kind of Karman connected with disciplined religious life, listing careful
    ascetic practices of non-harm, controlled speech, proper alms-taking, guarded
    senses, chastity, and careful bodily conduct.'
  language: English
  quote_policy: summarized
