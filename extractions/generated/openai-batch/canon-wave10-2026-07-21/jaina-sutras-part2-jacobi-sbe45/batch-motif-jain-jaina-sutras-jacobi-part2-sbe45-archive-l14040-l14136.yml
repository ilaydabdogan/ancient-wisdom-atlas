canonical_text:
  quote: One should know what causes the bondage of Soul, and knowing (it) one should
    remove it.
  summary: The passage opens a doctrinal chapter in which Gambusvamin asks Sudharman
    what Mahavira teaches as the cause of the soul’s bondage and what must be known
    to remove it. Sudharman answers that owning or approving possession of living
    or lifeless things prevents deliverance; killing or approving killing increases
    iniquity; attachment to kinsmen, companions, wealth, and relations cannot protect
    one from future misery. Knowing this, one gets rid of Karman. The passage then
    describes some Sramanas and Brahmanas who deny these words and some who teach
    that the five gross elements produce Atman and that living beings cease when the
    elements dissolve.
  language: English
  quote_policy: quoted
