canonical_text:
  quote: ''
  summary: The passage introduces a lecture on real truth, contrasting the virtue
    and peace of the good with the vices and unrest of the wicked. It criticizes those
    who learn the Law from teachers but neglect conduct, speak rudely, distort doctrine
    through personal opinion, speak untruth from pride, conceal truth, and renew quarrels.
    Such deceitful people are said to deprive themselves of good and go to endless
    punishment. A footnote explains that “Tathagatas” refers to Jain teachers and
    notes its use as a synonym of Tirthakara and Buddha.
  language: English
  quote_policy: summarized
