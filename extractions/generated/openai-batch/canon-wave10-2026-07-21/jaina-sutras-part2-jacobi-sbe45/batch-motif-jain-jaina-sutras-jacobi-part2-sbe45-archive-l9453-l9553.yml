canonical_text:
  quote: ''
  summary: The passage gives procedural rules for a monk’s inspection of his almsbowl,
    mouth-cloth, broom, and cloth. It specifies bodily posture, handling, folding,
    and wiping, warns against inattentive or improper actions and distractions, and
    states that careful inspection protects six kinds of living beings while careless
    inspection injures them. It then notes that in the third Paurushi the monk should
    beg food and drink for specified reasons not included in this excerpt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After paying respect to the Guru, a monk should inspect his almsbowl in the
    last quarter of the first Paurushi, without performing the Kala-pratikramama.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The monk should inspect his mouth-cloth first, then his broom, and then inspect
    his cloth while holding the broom.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The monk stands upright, holds his cloth firmly, inspects it leisurely, spreads
    it, and wipes it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The cloth is to be spread without shaking or crushing it, with the folds removed
    and friction avoided; it is to be folded six times lengthwise and nine times breadthwise.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The monk should remove living beings with his hand while spreading the cloth
    on the palm of his hand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The passage lists points at which want of attention must be avoided: beginning
    the work, taking up the corners of the cloth, folding it, shaking out dust, putting
    it down, and sitting on the haunches.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage further warns against holding the cloth loosely, by one corner,
    so that it flaps, so that it undergoes friction, or so that it is shaken in different
    ways.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says inspection should be neither too little nor too much, and
    that things to be inspected should not be exchanged.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: A monk engaged in inspection neglects the inspection if he converses, gossips,
    renounces something, teaches another, or receives his own lesson from another.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: 'Careful inspection protects six kinds of living beings: earth-bodies, water-bodies,
    fire-bodies, wind-bodies, plants, and animals.'
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Careless inspection injures the six kinds of living beings.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: In the third Paurushi the monk should beg food and drink for six reasons,
    though the reasons are not included in the supplied passage.
  category: action
  evidence_refs:
  - ev:11
