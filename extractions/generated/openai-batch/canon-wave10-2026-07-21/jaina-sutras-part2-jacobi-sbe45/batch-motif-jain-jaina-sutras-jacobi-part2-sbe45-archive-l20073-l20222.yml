canonical_text:
  quote: ''
  summary: 'The passage classifies five kinds of committing sins: injury prompted
    by motive, injury not prompted by personal interest, slaying, accidental killing
    or cutting, and killing by error of sight. It repeatedly states that bad Karman
    accrues when a person injures, kills, causes another to do so, or consents to
    another doing so.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first kind of committing sins is injury to movable or immovable beings
    for one’s own sake or for the sake of relations, household, family, friends, Nagas,
    Bhitas, or Yakshas; the passage includes doing it oneself, having it done by another,
    or consenting to it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The second kind is killing movable living beings without seeking body parts,
    protection, support, maintenance, or bodily benefit; the passage calls the agent
    a fool who acquires the habit of cruelty and becomes a wanton killer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same second kind is applied to killing or damaging immovable living beings
    such as reeds, grasses, trees, and straw.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person may pile up grass and light a fire, cause it to be lighted, or consent
    to its lighting in places such as marshes, lakes, sheets of water, pasture-grounds,
    ditches, moats, thickets, forests, and mountain settings; bad Karman accrues.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The third kind, called slaying, occurs when a person thinks that someone has
    hurt, is hurting, or will hurt him or others, and kills movable or immovable beings,
    causes them to be killed, or consents to their killing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the accidental hunting example, a man goes hunting deer, aims an arrow
    at what he thinks is a deer, and instead kills another animal such as a partridge,
    duck, quail, pigeon, monkey, or francoline partridge.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the accidental weeding example, a man intends to cut weed-grasses with
    a knife but instead cuts cultivated plants such as rice, Kodrava, panic seed,
    Paraka, or Ralaka; bad Karman accrues.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the error-of-sight examples, a man kills a friend after mistaking him for
    an enemy, or kills a person who is not a robber after mistaking him for one during
    a riot.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:9
  text: Across several categories the passage treats direct action, having another
    person act, and consenting to another’s act as karmically consequential.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
