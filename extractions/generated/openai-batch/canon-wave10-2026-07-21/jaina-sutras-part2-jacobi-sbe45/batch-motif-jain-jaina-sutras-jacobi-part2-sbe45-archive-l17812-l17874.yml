  quote: ''
  summary: 'The passage contrasts worldly bondage, ignorance, violence, and attachment
    to wealth with the conduct of the awakened wise person, sage, and monk: avoiding
    sin, falsehood, harmful action, desire for food, honor, fame, life, and death,
    and seeking liberation beyond the cycle of births.'
