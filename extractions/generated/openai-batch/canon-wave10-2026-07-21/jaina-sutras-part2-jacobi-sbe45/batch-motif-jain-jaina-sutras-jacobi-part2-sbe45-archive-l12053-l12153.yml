  summary: The passage describes Karman as composed of infinite atoms that bind souls
    throughout the six directions of space, gives immense maximum and brief minimum
    durations for several karmic categories, and says a wise person should know these
    subdivisions in order to prevent and destroy them. It then introduces the six
    Lésyās produced by Karman, with notes explaining Lésyā as a karmic condition,
    reflection, or subtle substance affecting the soul.
