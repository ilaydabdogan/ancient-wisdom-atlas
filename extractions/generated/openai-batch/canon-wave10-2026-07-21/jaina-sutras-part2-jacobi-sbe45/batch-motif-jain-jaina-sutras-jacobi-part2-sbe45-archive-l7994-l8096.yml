canonical_text:
  quote: ''
  summary: Rājīmatī finds herself alone with the monk Rathanémi, who invites her to
    accept him as lover and enjoy pleasures before later following the path of the
    Ginas. Rājīmatī remains self-controlled, rebukes him with images of vomited drink,
    snakes, a wind-driven plant, and a caretaker who does not own the goods he guards.
    Rathanémi hears her words, returns to the Law, and practices true Śramaṇahood
    for life.
  language: English
  quote_policy: summarized
