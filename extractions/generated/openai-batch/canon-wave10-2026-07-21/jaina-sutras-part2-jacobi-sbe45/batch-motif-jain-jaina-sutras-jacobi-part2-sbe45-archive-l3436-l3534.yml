canonical_text:
  quote: ''
  summary: 'The passage first gives instruction on faultless alms-receiving, self-control,
    and wandering without fixed residence, attributed to the Arhat Giatrzputra. It
    then presents a parable: a ram is fed and fattened for a guest, lives while no
    guest comes, but is killed and eaten when the guest arrives. This is compared
    to an ignorant sinner who kills, lies, steals, pursues pleasures, eats meat, squanders
    wealth, commits sins, and at death is burdened by Karman, grieves like the ram,
    and falls unwillingly to the dark world of the Asuras. Further examples compare
    small gains or forbidden pleasures to great loss.'
  language: English
  quote_policy: summarized
