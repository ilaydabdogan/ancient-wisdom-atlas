canonical_text:
  quote: ''
  summary: A first-person questioner asks the Kévalin/Kâsyapa to describe hell punishments
    and how sinners go there. The reply describes sinners descending after death into
    dark hells, where punishers burn, pierce, drown, roast, and drive them across
    rivers including Vaitarani and Kadambavaluka, ending with the sunless hell Asurya
    surrounded by fire.
  language: English
  quote_policy: summarized
