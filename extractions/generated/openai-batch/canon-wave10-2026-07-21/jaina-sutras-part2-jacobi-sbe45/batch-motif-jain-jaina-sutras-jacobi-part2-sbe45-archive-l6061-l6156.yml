canonical_text:
  quote: ''
  summary: The passage lists behaviors that define a bad Sramana, including careless
    inspection, disrespect toward teachers, deceit, quarrelsomeness, unsafe sitting
    and sleeping practices, eating milk-products and after sunset, leaving one's teacher,
    following heretical teachers, fortune-telling, relying on relatives' food, and
    sitting on a householder's seat. It contrasts such a monk, despised like poison,
    with one who avoids these faults and is welcomed like nectar. A footnote explains
    careful inspection as a monastic duty to avoid injuring living beings. The next
    lecture opens by introducing King Sangaya of Kampilya, who has many troops and
    war-chariots and goes hunting.
  language: English
  quote_policy: summarized
