canonical_text:
  quote: "“the whole world is on fire, as it were, by old age and death, I shall save
    my Self”"
  summary: A son or aspirant says that, because the world is as if burning through
    old age and death, he wishes to save his Self if permitted. His parents warn him
    that the duties of a Sramama monk are extremely difficult, listing vows of non-injury,
    truth, non-taking, chastity, non-possession, food restrictions, bodily hardships,
    mendicancy, and many similes for the difficulty of ascetic conduct.
  language: English
  quote_policy: quoted
