  text: The parents compare such a life to that of pigeons always afraid of dangers,
    mention painful hair-plucking, and call the vow of chastity difficult to keep.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The parents describe the son as accustomed to comfort, tender, and cleanly,
