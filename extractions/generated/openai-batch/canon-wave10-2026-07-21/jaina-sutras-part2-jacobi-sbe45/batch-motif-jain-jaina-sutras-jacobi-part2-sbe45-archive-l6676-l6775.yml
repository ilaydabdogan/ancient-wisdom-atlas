  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The difficult duties named include abstaining from unchastity, giving up claims
    on wealth, corn, and servants, abstaining from undertakings, and owning nothing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The difficult duties named include not eating the four kinds of food at night
    and not storing things wanted for later use.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hardships listed include hunger, thirst, heat, cold, insects, insults,
