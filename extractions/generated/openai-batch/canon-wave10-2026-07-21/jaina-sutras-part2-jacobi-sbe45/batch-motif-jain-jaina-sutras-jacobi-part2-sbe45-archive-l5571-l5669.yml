canonical_text:
  quote: ''
  summary: The passage first reports that teachers of the Law, along with a king,
    queen, Brahmanical Purohita, his wife, and sons, attained enlightenment, the end
    of misery, or perfection. It then begins the Fifteenth Lecture on the true monk,
    describing the monk as one who adopts the Law, abandons former connections and
    desires, wanders as an unknown beggar, practices austerity, endures hardship,
    avoids praise and curiosity, meditates on the soul, and does not live by divination.
  language: English
  quote_policy: summarized
