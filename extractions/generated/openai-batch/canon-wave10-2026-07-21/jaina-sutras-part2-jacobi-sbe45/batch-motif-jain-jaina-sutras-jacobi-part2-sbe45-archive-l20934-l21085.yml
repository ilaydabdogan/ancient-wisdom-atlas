canonical_text:
  quote: '"from womb to womb, from birth to birth, from death to death, from hell
    to hell, from pain to pain"'
  summary: The passage contrasts demerit and merit. It describes violent punishment,
    attachment to sensual pleasures, the acquisition of sinful Karman, descent after
    death to hell, the dark and painful qualities of hell, and repeated rebirth and
    suffering. It then describes righteous people and monks who abstain from killing
    and wicked actions, practice restraint, and are praised through images of purity,
    non-adhesion, protection, freedom, steadiness, and splendor.
  language: English
  quote_policy: quoted
