canonical_text:
  quote: ''
  summary: The passage defines exertion through a contrast between works and abstention
    from works. It associates carelessness with Karman and foolishness, and carefulness
    with the absence of Karman and wisdom. It describes destructive conduct by sinners,
    deceivers, and cruel persons, then turns to the wise exertion of a pious monk
    who is free from bonds, destroys bad Karman, removes the thorn of sin, and follows
    right doctrine.
  language: English
  quote_policy: summarized
