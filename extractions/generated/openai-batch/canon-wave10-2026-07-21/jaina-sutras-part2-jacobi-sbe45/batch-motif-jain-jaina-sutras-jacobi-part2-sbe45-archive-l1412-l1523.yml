canonical_text:
  quote: ''
  summary: The passage discusses reports about contemporary philosophical doctrines
    around the time of the Buddha and Mahavira, especially Agnosticism, Jain Syadvada/Saptabhanginaya,
    and Buddhist reticence on the Tathagata after death and Nirvana. It argues that
    Mahavira’s Syadvada may have responded to Agnostic positions, and that contemporary
    Agnosticism may also have influenced Buddhist handling of questions about the
    liberated one after death. It also cites a tradition that Sariputta and Moggalana
    had previously followed Saggaya and brought 250 disciples to the Buddha.
  language: English
  quote_policy: summarized
