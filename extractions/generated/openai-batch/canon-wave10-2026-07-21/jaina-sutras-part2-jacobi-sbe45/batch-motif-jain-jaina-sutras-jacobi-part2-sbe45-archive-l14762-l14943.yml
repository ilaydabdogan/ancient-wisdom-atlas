canonical_text:
  quote: ''
  summary: Ṛṣabha exhorts his sons to learn the Law, warning that human birth is rare,
    death comes to all, beings suffer the fruit of their own deeds, deceit perpetuates
    rebirth, and restraint, nonviolence, austerity, and renunciation destroy Karman.
    The passage also describes family and others trying unsuccessfully to draw a houseless
    monk back to domestic life.
