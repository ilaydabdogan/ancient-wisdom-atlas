  quote: ''
  summary: The passage is an introductory scholarly argument about whether Jainism
    should be dated late because it shares some doctrines with Vaiśeṣika philosophy.
    The author disagrees with Bhandarkar’s conclusion, describes Vaiśeṣika as a systematization
    of common Sanskrit philosophical concepts, allows that borrowings or compromise
    may have occurred, and lists shared doctrinal points concerning action and the
    soul, causation, and qualities and substratum.
