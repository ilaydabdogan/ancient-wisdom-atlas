canonical_text:
  quote: ''
  summary: The passage names four heretical creeds and criticizes agnostics, Vinaya-upholders,
    and Akriyavadins. It contrasts false doctrines with teaching that karma, right
    knowledge, right conduct, abstention, and non-injury lead toward liberation. It
    describes beings as repeatedly reborn in samsara, which is compared to a boundless
    and impassable flood of water.
  language: English
  quote_policy: summarized
