canonical_text:
  quote: ''
  summary: The passage describes conception, gestation, birth, and nourishment of
    human beings and several classes of five-sensed animals. Human birth is said to
    occur through a man and woman depositing humours, with souls born according to
    karman and other conditions. Embryos feed first on parental substances and then
    on the essence of the mother’s food, emerge as male, female, or neuter, and later
    consume milk, cooked food, plants, or living beings. Parallel descriptions are
    applied to aquatic animals, quadrupeds, reptiles, and other terrestrial animals,
    with notes on eggs, live birth, and species categories.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man and a woman combine in cohabitation and deposit humours in a generative
    place said to have been produced by karman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Souls of different human categories are born there, including those associated
    with Karmabhumi, Akarmabhumi, minor continents, Aryas, barbarians, women, men,
    and eunuchs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage connects sex differentiation with semen, the mother’s blood, and
    other circumstances contingent on coming into existence.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:8
- id: obs:4
  text: Before birth, beings first feed on the mother’s menses, the father’s semen,
    or both, and later absorb the essence of the mother’s food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Foetuses gradually increase, attain proper dimensions, and come forth from
    the womb as males, females, or neuters.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Human babies suck the mother’s milk; when older, they eat boiled rice, gruel,
    or movable and immovable beings.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A parallel paragraph applies the birth-and-food pattern to aquatic five-sensed
