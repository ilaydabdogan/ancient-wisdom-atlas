    and later eat plants or movable and immovable beings.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A paragraph applies the pattern to quadruped terrestrial five-sensed animals,
    including solidungular, biungular, multiungular, and nailed-toe animals; their
    young feed on mothers’ milk.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A paragraph applies the pattern to reptiles moving on the breast, including
    snakes, huge snakes, Asalika, and dragons; some lay eggs and some bear living
    young.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Reptile young are said to come out of eggs as males, females, or neuters,
    and while young they live on wind.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Another terrestrial five-sensed animal group is described as walking on arms,
