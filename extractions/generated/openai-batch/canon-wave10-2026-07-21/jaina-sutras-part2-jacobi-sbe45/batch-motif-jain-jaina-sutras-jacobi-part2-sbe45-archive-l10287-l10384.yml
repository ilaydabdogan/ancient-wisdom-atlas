literal_observations:
- id: obs:1
  text: The passage enumerates practices or attainments including subduing the ear,
    eye, smell, tongue, and touch; conquering anger, pride, deceit, greed, love, hate,
    and wrong belief; stability; and freedom from Karman.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Longing for liberation is said to give the soul an intense desire of the Law,
    increase longing for liberation, destroy anger, pride, deceit, and greed, prevent
    acquisition of bad Karman, remove wrong belief, and establish right faith.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that purity of faith can lead some souls to perfection
    after one birth and that no one possessing it will be born more than three times
    before reaching perfection.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Disregard of worldly objects makes the soul disgusted with pleasures of gods,
    men, and animals, indifferent to objects, inactive in undertakings, and redirected
    from the road of Samsara to the road to perfection.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Desire of the Law leads the soul to become indifferent to pleasures, abandon
    household life, become a houseless monk, end bodily and mental pains, and obtain
    unchecked happiness.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Obedience to co-religionists and the Guru gives the soul discipline; discipline
    and avoidance of misconduct toward the teacher prevent rebirth as a denizen of
    hell, an animal, a low man, or a bad god.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Praise, devotion, and respect for the Guru are said to result in birth as
    a good man or god, perfection, beatitude, praiseworthy disciplined actions, and
    influence upon others to adopt discipline.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Confession of sins before the Guru removes the thorns of deceit, misapplied
    austerities, and wrong belief, which obstruct final liberation and cause endless
    migration of the soul.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Through confession and simplicity, the soul avoids acquiring a specified form
    of Karman and annihilates such Karman already acquired.
  category: sequence
  evidence_refs:
  - ev:6
