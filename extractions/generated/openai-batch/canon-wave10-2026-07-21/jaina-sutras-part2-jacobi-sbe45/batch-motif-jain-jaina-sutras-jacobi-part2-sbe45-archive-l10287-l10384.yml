  summary: The passage lists disciplines such as subduing the senses, conquering passions,
    stability, and freedom from Karman. It then explains what the soul obtains through
    longing for liberation, disregard of worldly objects, desire of the Law, obedience
    to co-religionists and the Guru, and confession of sins before the Guru.
  language: English
