canonical_text:
  quote: ''
  summary: The passage describes an ignorant pleasure-seeker who doubts the next world,
    acts cruelly toward living beings, commits falsehood and other sins, later suffers
    disease and fear, and is destined for painful consequences in hell or rebirth
    according to deeds. Similes compare him to a snake gathering dust, a charioteer
    who leaves the highway and breaks an axle, and a gambler defeated by Kali. The
    passage contrasts the fool’s unwilling death with the peaceful willing death of
    virtuous, self-controlled persons, while noting differences among monks and householders
    in self-control.
  language: English
  quote_policy: summarized
