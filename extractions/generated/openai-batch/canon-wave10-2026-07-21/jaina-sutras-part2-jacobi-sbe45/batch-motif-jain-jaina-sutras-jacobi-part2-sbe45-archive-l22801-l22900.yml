  quote: ''
  summary: A polemical passage contrasts a rejected view that accidental killing or
    eating specially prepared meat does not incur guilt with Ardraka's response that
    knowledge of living beings, restraint, truthful speech, and abstention from harm-producing
    food are required. It also discusses feeding worthy monks for merit and rebirth
    in Arupa dhatu, then rejects merit without self-control.
