canonical_text:
  quote: "“knowledge, faith, and right conduct are the true causes of final liberation”"
  summary: Kesi questions Gautama about why Vardhamana's Law forbids clothes while
    Parsva's Law allows garments, though both pursue the same end. Gautama replies
    that Tirthakaras establish useful outward marks, but final liberation depends
    on knowledge, faith, and right conduct. Kesi also asks how Gautama has overcome
    many foes and escaped fetters; Gautama identifies the foes as self, passions,
    and senses, and says he has cut off his fetters by the right means.
