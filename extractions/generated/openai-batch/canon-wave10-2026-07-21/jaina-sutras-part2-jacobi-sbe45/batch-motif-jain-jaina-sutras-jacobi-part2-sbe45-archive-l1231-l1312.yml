canonical_text:
  quote: ''
  summary: The passage compares Jaina records in the Sutrkritanga about materialistic
    or heretical philosophical doctrines with Buddhist accounts. It describes doctrines
    identifying body and soul, asserting eternal elements, denying sin or merit, presenting
    death as dissolution into elements, and depicting cremation. It also notes a related
    doctrine with a permanent soul and compares it cautiously with a Vaiseshika-like
    system and with Pakudha Kavkayana in Buddhist record.
  language: English
  quote_policy: summarized
