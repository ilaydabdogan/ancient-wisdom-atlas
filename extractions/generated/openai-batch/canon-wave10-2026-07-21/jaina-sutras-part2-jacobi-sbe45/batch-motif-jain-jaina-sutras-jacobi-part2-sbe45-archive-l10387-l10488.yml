canonical_text:
  quote: ''
  summary: 'The passage lists religious practices and their effects on the soul: repentance,
    confession before the Guru, purity, adoration of the twenty-four Ginas, reverence,
    expiation, Kayotsarga, self-denial, praises and hymns, keeping the right time,
    Prayaschitta, and begging forgiveness. These practices are said to destroy or
    obstruct Karman, stop Asravas, preserve conduct, produce wisdom, lead toward liberation
    or heavenly rebirth, and cultivate kindness toward living beings.'
  language: English
  quote_policy: summarized
