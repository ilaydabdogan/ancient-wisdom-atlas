canonical_text:
  quote: "“Happy are we, happy live we who call nothing our own; when Mithila is on
    fire, nothing is burned that belongs to me.”"
  summary: King Nami, remembering a former birth after descending from the gods and
    being born human, becomes self-enlightened, enthrones his son, renounces royal
    life, and enters Pravragya. Sakra/Indra, disguised as a Brahmana, questions him
    with images of civic uproar, fire, fortification, palaces, punishment, and conquest;
    Nami answers with teachings on non-possession, ascetic security, impermanence,
    justice, and self-conquest.
  language: English
  quote_policy: quoted
