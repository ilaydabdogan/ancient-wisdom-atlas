canonical_text:
  quote: ''
  summary: The passage contrasts wavering ascetics with cowards who seek escape in
    battle and presents fearless warriors as a model for monks who abandon household
    ties and wander for the soul's welfare. It reports accusations against monks who
    care for sick brethren, answers those accusations by criticizing inconsistent
    or passion-driven conduct, recommends non-exasperating argumentation, and states
    that a sound monk should attend a sick brother while enduring hardships until
    final liberation. The opening of the next chapter reports claims about ancient
    penitent men attaining perfection despite drinking water or eating fruits and
    roots, and warns that such assertions mislead the ignorant.
  language: English
  quote_policy: summarized
