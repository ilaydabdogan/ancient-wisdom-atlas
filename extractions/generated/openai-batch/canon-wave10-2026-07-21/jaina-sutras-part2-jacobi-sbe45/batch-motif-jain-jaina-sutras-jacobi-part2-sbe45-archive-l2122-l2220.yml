  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The person who desires his own welfare is instructed to adhere to good conduct
    after hearing such comparisons.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The listener is urged to be eager for discipline in order to acquire righteousness;
    a son of the wise who desires liberation is said not to be turned away from anywhere.
  category: speech
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:8
  text: One should be meek, avoid talkativeness in the presence of the wise, acquire
    valuable knowledge, and avoid what is worthless.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: When reprimanded, a wise man should not be angry but forbearing, and should
    not associate, laugh, or play with mean men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: One should do nothing mean, avoid excessive speech, and meditate alone after
