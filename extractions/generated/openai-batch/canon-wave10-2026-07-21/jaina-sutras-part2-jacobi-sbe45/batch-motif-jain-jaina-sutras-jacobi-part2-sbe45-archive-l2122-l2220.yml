canonical_text:
  quote: ''
  summary: The passage opens a lecture on discipline for a houseless monk free from
    worldly ties. It contrasts an obedient monk who responds attentively to a superior’s
    order with an insubordinate monk who does not. It uses animal comparisons for
    a bad pupil and for a person turning from virtue to evil, then instructs the aspirant
    to pursue discipline, righteousness, knowledge, meekness, forbearance, avoidance
    of mean company, limited speech, and solitary meditation after learning.
  language: English
  quote_policy: summarized
