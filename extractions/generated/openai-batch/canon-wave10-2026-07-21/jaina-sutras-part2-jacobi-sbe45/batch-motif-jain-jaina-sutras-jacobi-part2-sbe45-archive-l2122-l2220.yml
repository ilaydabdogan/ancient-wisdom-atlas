  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A bad, insubordinate, and talkative pupil is said to be turned out like a
    bitch with sore ears driven away everywhere.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A brute of a man is said to turn away from virtue and take to evil ways like
