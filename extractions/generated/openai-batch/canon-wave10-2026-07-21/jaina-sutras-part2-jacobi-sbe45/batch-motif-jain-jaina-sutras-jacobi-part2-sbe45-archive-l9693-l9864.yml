canonical_text:
  quote: ''
  summary: 'The passage presents Garga, a learned Jain elder, reflecting through an
    extended allegory: a car can cross a wilderness just as religious exercise crosses
    Samsara, but bad bullocks make the journey difficult, just as bad pupils fail
    when yoked to the Law. The passage lists unruly behaviors of bullocks and pupils,
    then has Garga leave bad pupils to practice austerities. It then begins a new
    lecture on the road to final deliverance, defined by knowledge, faith, conduct,
    and austerities, and lists five kinds of knowledge.'
  language: English
  quote_policy: summarized
