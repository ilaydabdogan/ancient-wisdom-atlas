canonical_text:
  quote: ''
  summary: A didactic Jain passage describes how a monk who avoids harmful, conceited,
    delusive, passionate, careless, and karmically productive conduct, and who attends
    to many enumerated vows, duties, disciplines, scriptures, categories, and qualities,
    will not remain in the circle of transmigration. It concludes that a clever monk
    who exerts himself regarding these points will soon be released from the Circle
    of Births. The following opening of the next lecture introduces deliverance from
    beginningless time and all misery, achieved through true knowledge, avoidance
    of ignorance and delusion, and destruction of love and hatred.
  language: English
  quote_policy: summarized
