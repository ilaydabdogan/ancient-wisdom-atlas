  quote: ''
  summary: The passage introduces Harikesa-Bala as born in a Svapaka/Kandala family
    and becoming a disciplined monk and sage. A commentator’s note recounts Bala’s
    last birth near the Ganges, his parents, his stay in a grove near Benares, the
    devotion of a Yaksha, Bhadra’s possession after showing aversion to the monk,
    her recovery conditioned on being offered as Bala’s bride, Bala’s refusal, and
    her later marriage to Rudradeva.
