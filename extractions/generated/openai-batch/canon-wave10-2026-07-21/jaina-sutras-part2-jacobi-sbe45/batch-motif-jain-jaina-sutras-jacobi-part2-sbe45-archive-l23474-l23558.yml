  quote: ''
  summary: The passage reports the Venerable One's teaching about followers and other
    practitioners who undertake fasting, vows, or partial restraints before death.
    It distinguishes those who renounce injury, false speech, theft, sexual intercourse,
    and property from those who do not fully abstain, and states that after death
    beings experience their Karman and receive happy or evil lots, including rebirth
    among Asuras or later birth with disabilities in some cases.
