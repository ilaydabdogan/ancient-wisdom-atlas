canonical_text:
  quote: wander about till he reaches final liberation
  summary: The passage closes an instruction to monks about alms and liberation, then
    opens the lecture called Ardraka. Gosala challenges Mahavira’s consistency because
    he formerly wandered alone but now teaches surrounded by many monks. Ardraka replies
    that Mahavira remains truly single and alone in mental condition while teaching
    the Law, and he defines proper Sramana conduct against practices he associates
    with householders. A translator/commentarial note recounts Ardraka’s monastic
    career, an elephant kneeling before him, and his remark about breaking worldly
    fetters.
  language: English
  quote_policy: quoted
