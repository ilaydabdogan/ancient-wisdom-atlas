  summary: Didactic verses describe Beatitude, the Law, and Liberation as attained
    through restraint, right knowledge, and austerity. The passage contrasts this
    with false awakening and wrong ascetic practice, using images of a Samsara flood
    or current, an island of safety, birds catching fish, a wrong path, and a blind-born
    man in a leaky boat.
