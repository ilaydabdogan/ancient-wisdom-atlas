canonical_text:
  quote: "“many souls have crossed the ocean of Samsara”"
  summary: 'The passage prescribes correct Jain mendicant conduct: exceptional reasons
    for omitting alms-seeking, inspection of possessions and places, reverence to
    the Guru, study, meditation, Kayotsarga, daily and nightly reflection on transgressions,
    confession, recitation of the Pratikramana Sutra, austerities, and praise of perfected
    saints. It concludes that this conduct has enabled many souls to cross the ocean
    of Samsara.'
