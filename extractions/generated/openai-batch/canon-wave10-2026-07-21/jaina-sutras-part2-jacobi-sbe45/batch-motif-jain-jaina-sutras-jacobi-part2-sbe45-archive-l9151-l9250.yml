canonical_text:
  quote: ''
  summary: The passage defines the true Brahmana through ascetic discipline, non-injury,
    truthfulness, non-stealing, chastity, non-attachment, abandonment of household
    ties, and freedom from Karman. It rejects animal sacrifice, Vedic ritual, outward
    marks, and birth-status as sufficient for spiritual identity, and states that
    one becomes a Brahmana, Kshattriya, Vaisya, or Sudra by actions. Vijayaghosha
    accepts Jayaghosha's teaching after his doubt is resolved.
  language: English
  quote_policy: summarized
