canonical_text:
  quote: ''
  summary: The passage describes Mount Sudarsana as a radiant golden mountain at the
    center of the earth and then uses that mountain, along with a catalogue of other
    superlative mountains, trees, celestial bodies, animals, beings, warriors, flowers,
    gifts, and speeches, to praise Mahavira. Mahavira is presented as noble, wise,
    full of faith, knowledge, and virtue, a teacher of the highest Law and Nirvana,
    an ascetic renouncer, and one who annihilated all Karman and reached the highest
    perfection.
  language: English
  quote_policy: summarized
