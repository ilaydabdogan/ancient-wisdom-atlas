  quote: ''
  summary: The Venerable One reports followers who cannot strictly keep Posaha-days
    but can prepare for death by fasting. Their Samayika Desavakasika vow limits daily
    travel in the four directions, renounces injury to living beings, and is followed
    by repeated cases of movable and immovable beings dying and being born within
    or beyond those limits.
