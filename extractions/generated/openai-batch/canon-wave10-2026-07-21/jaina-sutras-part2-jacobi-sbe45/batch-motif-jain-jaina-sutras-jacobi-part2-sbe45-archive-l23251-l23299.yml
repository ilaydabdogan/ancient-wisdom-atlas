canonical_text:
  quote: ''
  summary: The passage instructs renunciation of injury to movable beings, gives an
    analogy of a householder freeing a captured thief, explains that movable and immovable
    forms arise through Karman and that the embodied soul passes from one state to
    another when a life-span ends, and introduces Udaka’s question to Gautama about
    whether renouncing slaughter of one class of beings could lead to ceasing all
    injury. A note frames the following debate as concerning whether movable beings
    could ever die out in Samsara.
