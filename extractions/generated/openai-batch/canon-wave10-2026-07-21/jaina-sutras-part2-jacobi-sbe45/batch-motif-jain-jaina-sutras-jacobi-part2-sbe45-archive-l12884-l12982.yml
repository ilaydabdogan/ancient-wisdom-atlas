canonical_text:
  quote: ''
  summary: The passage classifies perfected souls, lists categories and numerical
    groupings of those who may reach perfection, locates the perfected souls at the
    top of the world after they leave their bodies below, and describes the upper
    cosmographic place as pure, white, umbrella-shaped, and near the end of the world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Perfected souls are distinguished from beings belonging to Samsara and are
    said to include women, men, hermaphrodites, orthodox persons, heterodox persons,
    and householders.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Perfection is said to be reachable by persons of greatest, smallest, and middle
    size, and in high places, underground, on the earth's surface, in the ocean, and
    in water.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage gives numerical counts for simultaneous attainment of perfection
    among categories of sex or gender, religious status, bodily size, and location.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Perfected souls are said to be debarred from the non-world, to reside on the
    top of the world, to leave their bodies below, and to go to the top of the world
    on reaching perfection.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A place called ishatpragbhara is located twelve Yojanas above the Vimana Sarvartha
    and is described as umbrella-shaped.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ishatpragbhara place is described with large measurements, eight Yojanas
    of thickness, a greatest thickness in the middle, and a margin thinner than a
    fly's wing.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The same place is described as naturally pure, consisting of white gold, and
    resembling an open umbrella.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Above the umbrella-shaped place is a pure blessed place called Sita, described
    as white like a conch-shell, the anka-stone, and Kunda-flowers, and one Yojana
    from the end of the world.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Perfected souls are said to penetrate part of the uppermost Krosa and to reside
    at the top of the world, rid of all transmigration and arrived at perfection.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The dimension of a perfected soul is stated to be two-thirds of the height
    of the individual in the last existence.
  category: attribute
  evidence_refs:
  - ev:6
