  summary: The passage reports a polemical description of unnamed heretics who reject
    the twelve Angas, the Canon of the Ganins taught by the Sramanas and Nirgranthas,
    and assert their own doctrine as true. It then gives a doctrinal contrast between
    an ignorant man who attributes suffering to oneself or another person as cause,
    and a wise man who denies such causation and attributes embodiment, life changes,
    loss of body, states of existence, and pleasure and pain to Fate. The narrator
    states that those who hold these opinions cannot escape misery or properly inform
    others.
