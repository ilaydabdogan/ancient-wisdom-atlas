canonical_text:
  quote: ''
  summary: The passage gives ascetic instruction on vigilance, careful conduct, conquest
    of will, resistance to delusion and external allurements, and the urgency of discipline
    before death. It uses images of darkness after an extinguished lamp, a watchful
    Bharumda bird, snares, a harnessed horse, and an ocean of life crossed to an opposite
    shore. It then distinguishes death against one's will, associated with ignorant
    men and repeated occurrence, from death with one's will, associated with wise
    men and occurring at best once.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wealth is said not to protect a careless man in this world or the next; although
    he had seen the right way, he fails to see it like a person in darkness whose
    lamp has gone out.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressee is instructed to remain awake while others sleep, to trust nobody,
    to stay alert, and to be watchful like a Bharumda bird.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A monk is told to step carefully as if everything were a snare, to care for
    his life until he wins the stake identified as enlightenment, and afterward to
    despise life while annihilating sins.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A monk reaches liberation by conquering his will, compared to a well-broken
    horse clad in harness going to battle; watchfulness in youth is said to help a
    monk obtain liberation quickly.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The reasoning that victory over the will can be gained later is criticized
    as presupposing eternal human life; the passage urges exertion, abstinence from
    pleasures, understanding the world, impartiality like a sage, and self-guarding.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Sramana is instructed to suppress delusion, control himself, avoid hatred
    toward external things, keep external things out of his mind, remove pride, deceit,
    and greed, and desire virtues until death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Impure and vain heretics are described as subject to love and hate and under
    the influence of passions.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Life is described as an ocean with currents identified as births, difficult
    to cross; one man has reached the opposite shore and one wise man has answered
    a question.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'Two ways of life ending with death are declared: death with one''s will and
    death against one''s will. Death against one''s will belongs to ignorant men and
    happens many times; death with one''s will belongs to wise men and at best happens
    once.'
  category: relationship
  evidence_refs:
  - ev:8
