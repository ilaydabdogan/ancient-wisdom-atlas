canonical_text:
  quote: ''
  summary: 'The passage describes the durations of different leśyās across classes
    of mundane existence, connects lower and higher leśyās with miserable and happy
    courses of life, and states when souls proceed to new birth. It then begins an
    instruction on the houseless monk: leaving household life, renouncing attachments,
    avoiding harmful acts and luxurious dwellings, living in austere places, and refraining
    from building or cooking out of compassion for living beings.'
  language: English
  quote_policy: summarized
