canonical_text:
  quote: all beings desire happiness
  summary: The passage rejects claims that water ablutions or fire rites bring perfection,
    arguing that such practices can harm living beings and do not remove Karman or
    sin. It teaches that a wise monk should understand that beings desire happiness,
    abstain from violence, avoid indulgent and self-serving ascetic behavior, beg
    humbly, renounce fame and sensory pleasures, practice control, endure pain, await
    death, annihilate Karman, and not return to worldly involvement.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage says that those who maintain that perfection may be obtained through
    water are declared wrong by the clever ones.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage argues that if water washed off impure Karman it would also remove
    merit, and that a fool using ablutions as a way to reach Moksha kills living beings.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that if water washed off sins, some who killed water-beings
    would have obtained perfection; therefore the claim of perfection through water
    is wrong.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage describes people lighting fire in the morning and evening and
    claiming that perfection is obtained through fire; it counters that mechanics
    who use fire would then also be liberated.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that a wise person who knows the truth should know and
    understand that all beings desire happiness.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says sinful creatures wail, suffer, and tremble, and instructs
    a wise monk who has ceased to sin to abstain from violence toward movable and
    immovable beings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says one who stores and eats food, makes ablutions, and washes
    and adorns clothes is far from being a naked monk; it also says a wise man should
    see the use of water as sinful and abstain from bathing, seeds and bulbs, and
    women.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage criticizes one who leaves family, house, cattle, and wealth but
    then seeks houses with nice food, professes the Law to fill his belly, brags for
    food, and flatters for food, drink, and other things.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage instructs a monk to beg where he is unknown, not seek fame and
    respect through austerities, avoid pleasant sounds and colors, conquer pleasures,
    avoid attachment, bear pain, wander homeless, give safety to all beings, and be
    free from passions.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says a monk should eat in order to practice control, desire to
    get rid of sin, have recourse to control when suffering pain, and subdue the foe
    at the head of battle as it were.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says that even when beaten the monk should be like a plank, should
    wait for death, and after annihilating Karman should not again mix with the world,
    but be like a car whose axle is broken.
  category: sequence
  evidence_refs:
  - ev:9
