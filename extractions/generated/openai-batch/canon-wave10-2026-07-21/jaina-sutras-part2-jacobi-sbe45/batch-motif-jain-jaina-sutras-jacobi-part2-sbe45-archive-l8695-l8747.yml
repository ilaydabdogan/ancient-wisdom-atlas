canonical_text:
  quote: ''
  summary: 'The passage gives rules for a disciplined Jain monk: he should avoid attending
    to sense objects while minding study, avoid eight specified faults such as anger
    and greed, use concise blameless speech at the proper time, and avoid faults connected
    with searching for, receiving, and using alms, articles of use, and lodging. A
    note enumerates categories of faults that can make food and other items unfit
    for a Jain monk.'
