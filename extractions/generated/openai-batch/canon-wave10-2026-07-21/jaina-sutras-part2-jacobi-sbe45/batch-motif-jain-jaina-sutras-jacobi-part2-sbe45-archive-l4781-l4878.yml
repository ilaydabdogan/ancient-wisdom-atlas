canonical_text:
  quote: ''
  summary: A sage or monk is beaten after teachers incite young men against him. Bhadra,
    king Kausalika’s daughter and the Purdhita’s wife, recognizes him as the ascetic
    who had refused her and warns the attackers of his ascetic power. Yakshas and
    Asuras come to the sage’s aid and beat the people. The Brahmana and his wife ask
    forgiveness; the sage says he has no hatred and explains that the Yakshas attend
    him. The group worships him and offers boiled rice; he accepts food and drink
    after a month-long fast. Gods then rain perfumed water, flowers, and treasures,
    sound drums, and praise the gift.
  language: English
