    consisting of five Samitis and three Guptis.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The five Samitis concern careful going to avoid harming living creatures,
    gentle and righteous speech, receiving alms without faults, careful receiving
    and keeping of necessary things, and performing bodily operations in an unfrequented
    place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The three Guptis concern preventing the mind from wandering, preventing bad
    speech by silence, and placing the body in an immovable posture.
