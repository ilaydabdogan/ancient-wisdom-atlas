canonical_text:
  quote: ''
  summary: The passage closes the meeting of Kesi and Gautama by saying that knowledge
    and virtuous conduct were elevated, important subjects settled, and the assembly
    pleased. It then opens the lecture on the Samitis, enumerating five Samitis and
    three Guptis as eight articles of the creed, explaining disciplines of careful
    going, speech, receiving alms, handling necessities, bodily functions, and guarding
    mind, speech, and body. It further describes the disciplined monk’s careful walking
    by cause, time, road, effort, and attention.
  language: English
  quote_policy: summarized
