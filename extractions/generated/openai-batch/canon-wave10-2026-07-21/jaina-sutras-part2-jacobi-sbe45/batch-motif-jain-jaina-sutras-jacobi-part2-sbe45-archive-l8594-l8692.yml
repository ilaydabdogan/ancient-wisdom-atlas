  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'A well-disciplined monk’s walking should be pure in four respects: cause,
    time, road, and effort; the stated cause is knowledge, faith, and right conduct;
    the time is daytime; the road excludes bad ways.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The effort in walking is fourfold with regard to substance, place, time, and
    condition of mind; the monk is to look with his eyes, attend to a space of a yuga,
    do so as long as he walks, and do so carefully.
  category: action
  evidence_refs:
  - ev:8
