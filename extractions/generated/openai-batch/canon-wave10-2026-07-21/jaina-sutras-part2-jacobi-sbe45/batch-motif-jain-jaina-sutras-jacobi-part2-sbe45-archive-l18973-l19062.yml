canonical_text:
  quote: ''
  summary: A teacher explains why a person who subdues the senses, is qualified for
    the ascetic task, and abandons the body may be called Brahmana, Sramana, Bhikshu,
    and Nirgrantha. Each title is defined by renunciation of sinful actions and passions,
    disciplined conduct, modesty, equanimity, knowledge of the Self and the Law, and
    striving for Liberation. The speaker concludes by identifying himself as the Saviour.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Venerable One says that one who subdues his senses, is well qualified
    for his task, and abandons his body is to be called a Brahmana, Sramana, Bhikshu,
    and Nirgrantha.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pupil asks why such a person is to receive these four names and asks the
    great sage to tell this.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The person is called a Brahmana because he has ceased from listed sinful actions,
    possesses the Samitis, exerts himself, and is neither angry nor proud.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The person is called a Sramana because he is free from obstacles and desires,
    abstains from property, killing, lies, and sexual intercourse, and gives up passions
    including wrath, pride, deceit, greed, love, and hate.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The person is called a Bhikshu because he is modest, obedient to his Guru,
    disciplined in the senses, able to sustain troubles, practices prescribed conduct
    with a pure mind, is steadfast, and eats a moderate quantity of food given by
    others.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The person is called a Nirgrantha because he is single, knows the absolute
    atman, is awakened and disciplined, possesses Samitis and equanimity, knows the
    true nature of the Self, renounces causes of sin, searches and knows the Law,
    seeks Liberation, and lives restrained.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The speaker concludes by saying that this should be known as he has told it
    because he is the Saviour.
  category: speech
  evidence_refs:
  - ev:6
