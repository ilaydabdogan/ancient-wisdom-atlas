canonical_text:
  quote: ''
  summary: The passage contrasts outward ascetic signs and verbal claims with disciplined
    conduct, self-control, non-attachment, non-violence, regulated alms-taking, and
    preparation for death. It describes karmic consequences after death, including
    hell for sinful conduct, ascent to heaven or luminous regions for pious and restrained
    persons, the world of Yakshas for a disciplined householder, and liberation or
    divine existence for a restrained monk. A later section warns that family, possessions,
    teacher-attendance, clever speech, or philosophical talk alone cannot save one
    from the results of one's own deeds in endless Samsara.
  language: English
  quote_policy: summarized
