canonical_text:
  quote: ''
  summary: A didactic Jain passage titled “Freedom from Error” instructs a celibate
    monk to avoid heretical doctrines, reject misleading absolute alternatives, affirm
    central Jain categories, and recognize karmic bondage, liberation, rebirth, deities,
    perfection, and moral distinctions. Translator notes explain Jain doctrines of
    multiple bodies and compare them with broader beliefs about plurality of souls
    and soul travel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage addresses a clever monk practicing chastity and tells him not
    to adopt heretical doctrines or behave badly in the religion.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that alternatives about the world being without beginning,
    without end, eternal, or not eternal do not lead to truth but to error.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage warns against unqualified statements about whether killing small
    and great animals carries the same guilt, and about whether accepting specially
    prepared things affects a person with demerit.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says not to maintain the identity of the audarika, aharika, and
    karmana bodies, and not to assert absolutely that everything can or cannot come
    into existence everywhere.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage instructs the hearer to maintain the existence of the world, Jiva
    and Ajiva, Dharma and Adharma, bondage and liberation, virtue and vice, Asrava
    and its stoppage, karmic effect and annihilation of Karman, and activity and non-activity.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage affirms the existence of anger, pride, deceit, greed, love, hate,
    and the fourfold Circle of Births.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage affirms that gods and goddesses exist, that perfection and non-perfection
    exist, and that there is a place reserved for those who attain perfection.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage affirms that pious and wicked men exist, and that good and bad
    exist.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage rejects the theory that a person is always good or always bad
    and says wrongly instructed Sramanas do not comprehend the soul’s bondage through
