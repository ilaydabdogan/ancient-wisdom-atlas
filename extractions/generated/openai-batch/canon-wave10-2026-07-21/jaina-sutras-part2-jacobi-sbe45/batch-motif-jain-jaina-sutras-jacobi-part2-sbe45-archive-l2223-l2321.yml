canonical_text:
  quote: Subdue your Self, for the Self is difficult to subdue
  summary: 'The passage gives rules for a monk or pupil under discipline: truthful
    acknowledgment of actions, restraint in speech and anger, subduing the Self through
    self-control and penance, proper bodily comportment before the teacher, respectful
    questioning, and transmission of sacred text according to tradition.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: If the pupil has done something mean, he should not deny it but should say
    whether he has or has not done it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pupil should not wait in every case for an express command, and the passage
    compares this to a horse that responds to the whip or to seeing the whip.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Disobedient, rough-speaking, ill-behaved pupils exasperate even a gentle teacher,
    while polite pupils who humour the teacher win even a hot-tempered teacher.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The pupil should not speak unasked, should not lie when asked, should not
    give way to anger, and should bear pleasant and unpleasant occurrences with indifference.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says the Self is difficult to subdue and that a subdued Self brings
    happiness in this world and the next.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: Self-subdual by self-control and penance is stated to be better than being
    subdued by others through fetters and corporal punishment.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The pupil should do nothing disagreeable to the wise, whether in words or
    deeds, openly or secretly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage forbids certain positions and gestures near the teacher, including
    sitting beside, before, or behind him, touching his thigh, answering from a couch,
    sitting on the hams, crossing arms, stretching legs, or standing too close.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:9
  text: When addressed by the superior, the pupil should not remain silent, should
    treat the address as a favour, ask for the command, approach politely, rise, and
    answer modestly and attentively.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:10
  text: The pupil should not ask questions while sitting on a stool or bed, but should
    rise, come near, and ask with folded hands.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:11
  text: If a pupil observing the conduct rules asks about the sacred text, its meaning,
    or both, the teacher should deliver it according to tradition.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:12
  text: A monk should avoid untruth, positive claims about future matters, sinful
    speech, deceit, and sinful or meaningless statements.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:13
  text: A translator's note quotes a commentator's illustrative verse using impossible
