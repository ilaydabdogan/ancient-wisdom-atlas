canonical_text:
  quote: ''
  summary: 'A karmic rebirth narrative: Brahmadatta and Xitra/Aitra meet again, recall
    earlier births as brothers, slaves, animals, outcastes, and gods, explain separation
    through karman from sinful thoughts, discuss the fruits of deeds, and contrast
    royal pleasures with renunciation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A figure with a sinful resolution to become a universal monarch descends from
    the heavenly region Padmagulma and is born of Xulani in Kampilya as Brahmadatta.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Xitra is born in Purimatala in a merchant family and enters the order after
    hearing the Law.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Kampilya, Sambhuta and Xitra meet again and tell each other the rewards
    realised for their good and bad actions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Brahmadatta is described as a universal monarch, powerful and glorious king,
    and he respectfully addresses the one who had been his brother in a former birth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The speaker recalls a sequence of shared births or states: brothers, slaves
    in Dasarzas, antelopes on mount Kalazigara, geese on the shore of Mvztaganga,
    Svapakas in Kasi, and gods; the present birth is called the sixth birth in which
    they are separated.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A speech states that karman is produced by sinful thoughts and that the influence
    of this karman caused the separation.
  category: speech
  evidence_refs:
  - ev:5
