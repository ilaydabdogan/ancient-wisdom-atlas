  summary: A scholarly additional note compares the Jaina Parable of the Three Merchants
    with Gospel parables in Matthew, Luke, and the Gospel according to the Hebrews.
    It quotes a version with three servants who waste, multiply, or hide a talent
    or substance and receive different outcomes. The note argues that the Jaina version
    preserves essential elements, is said in Uttaradhyayana VII, 15 to be taken from
    common life, and was probably invented in India rather than Palestine.
