canonical_text:
  quote: ''
  summary: A parental speaker warns that life as a Sramana is extremely difficult
    and advises the son to enjoy human pleasures before adopting the Law. The son
    replies that nothing is difficult for one free from desire, then recounts repeated
    sufferings in samsara and many torments undergone in hell, including heat, cold,
    roasting, hell rivers, suspension over a boiler, cutting with saws and weapons,
    the thorny Salmali tree, crushing presses, wild dogs, and a red-hot iron car.
  language: English
  quote_policy: summarized
