canonical_text:
  quote: ''
  summary: 'The passage classifies six Lésyās by color and describes the habits of
    a man who develops each: black, blue, grey, red, yellow, and white. It then states
    that Lésyās have innumerable varieties and gives minimum and maximum durations
    for several of them in large cosmological time measures.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who acts from the five Asravas, lacks the three Guptis, injures living
    beings, commits cruel acts, is wicked and violent, and does not subdue his senses
    develops the black Lésyā.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man marked by envy, anger, want of self-control, ignorance, deceit, immodesty,
    greed, hatred, carelessness, pursuit of pleasures, and sinful undertakings develops
    the blue Lésyā.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man who is dishonest, base, not upright, deceitful, a heretic, a speaker
    of hurtful and sinful things, a thief, and jealous develops the grey Lésyā.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A man who is humble, steadfast, free from deceit, disciplined, restrained,
    attentive to study and duties, loves and keeps the Law, fears forbidden things,
    and strives for the highest good develops the red Lésyā.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A man with little anger, pride, deceit, and greed, whose mind is at ease,
    who controls himself, attends to study and duties, speaks little, is calm, and
    subdues his senses develops the yellow Lésyā.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A man who avoids constant thought about misery and sinful deeds, meditates
    on the Law and truth, has ease of mind, controls himself, practises the Samitis
    and Guptis, is calm, and subdues his senses develops the white Lésyā.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that Lésyās have as many varieties as there are Samayas
    in innumerable Avasarpinis and Utsarpinis and as there are countless worlds.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The shortest duration given for each listed Lésyā is half a muhūrta; maximum
    durations are given for the black, blue, grey, red, and yellow Lésyās in Sāgaropamas,
    Palyopamas, Asamkhyeya parts, and muhūrtas.
  category: attribute
  evidence_refs:
  - ev:8
