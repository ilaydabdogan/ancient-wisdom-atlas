canonical_text:
  quote: ''
  summary: The passage gives instructions for a Jain monk to endure violence, hunger,
    illness, exposure, filth, lack of alms, and social respect without attachment
    or despair. It then names four difficult requisites—human birth, hearing the Law,
    belief, and energetic self-control—and describes karmic rebirth through divine,
    hellish, human, and non-human states, followed by purity, Nirvana, ascent to upper
    regions, and heavenly Yakshas.
  language: English
  quote_policy: summarized
