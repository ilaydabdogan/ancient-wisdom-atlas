canonical_text:
  quote: ''
  summary: 'A commentator says Mahavira’s speech was understood by all creatures as
    their own language. The passage then introduces Lecture II.9, listing twenty-two
    troubles that a monk must learn, know, bear, and conquer, and begins explaining
    the first three: hunger, thirst, and cold.'
  language: English
  quote_policy: summarized
