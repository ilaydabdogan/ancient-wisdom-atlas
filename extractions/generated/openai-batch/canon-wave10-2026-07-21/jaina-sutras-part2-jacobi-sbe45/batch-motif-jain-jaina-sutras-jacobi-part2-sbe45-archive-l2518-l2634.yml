- id: obs:3
  text: The text enumerates twenty-two troubles declared by the Venerable Ascetic
    Mahavira for a monk living as a wandering mendicant.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: The monk must learn, know, bear, and conquer the troubles so as not to be
    vanquished by them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The listed troubles include hunger, thirst, cold, heat, stinging insects,
    nakedness, discontent, women, erratic life, study-place, lodging, abuse, corporal
    punishment, asking, refusal, illness, grass-pricking, dirt, respectful treatment,
    understanding, ignorance, and righteousness.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Regarding hunger, a self-controlled monk should not cut or cause cutting of
    food, nor cook it or cause another to cook it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The hungry monk is described as potentially emaciated and vein-covered, yet
