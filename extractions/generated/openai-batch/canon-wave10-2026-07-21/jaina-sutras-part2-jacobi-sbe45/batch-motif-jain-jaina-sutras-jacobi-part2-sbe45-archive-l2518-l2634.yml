  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Regarding thirst, the monk should not drink cold water and should try to get
    distilled water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The thirsty monk is depicted wandering on deserted ways with dry throat and
    distress, and is told to bear the trouble of thirst.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: Regarding cold, the restrained ascetic should not walk beyond the prescribed
    time and should remember the teaching of the Gina.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A monk should not entertain the thought of making a fire to warm himself despite
