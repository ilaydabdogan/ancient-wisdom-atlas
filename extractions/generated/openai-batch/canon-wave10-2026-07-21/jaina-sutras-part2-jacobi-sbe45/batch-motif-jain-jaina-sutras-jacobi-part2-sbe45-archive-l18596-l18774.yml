canonical_text:
  quote: ''
  summary: 'The passage gives instructions for a Jain monk: remain with the teacher,
    follow monastic rules, accept correction without anger, maintain nonviolence and
    restraint, learn and teach the Law accurately, use proper speech, avoid falsification
    and harmful practices, and pursue truth, austerity, silence, and liberation. It
    uses similes of a lost person in a wood, a guide in darkness, and sunrise revealing
    the way to describe learning the Law through proper guidance and the words of
    the Jinas.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An intelligent monk is instructed not to leave the company of his teacher
    and to follow rules for postures, lying down, sitting, exertion, Samitis, and
    Guptis.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The monk is instructed not to be influenced by pleasant or dreadful sounds,
    not to be sleepy or careless, and to get rid of doubts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If admonished or corrected by monks, a heretic, a female slave, or a householder,
    the monk should not retort, become angry, do harm, or use hard words, but should
    promise not to repeat the wrong.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage compares correction to a person lost in a wood being shown the
    salutary path by others who are not lost.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says that a guide in a dark night cannot find the way because
    he cannot see it, but recognizes the way when the sun rises.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A novice who has not mastered the Law does not know it, but afterwards knows
    it through the words of the Ginas, as a wanderer sees the way after sunrise.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The monk is instructed to be restrained toward movable and immovable beings
    above, below, and on earth, wandering without hostile thoughts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the proper time the monk may ask a well-conducted monk about living beings,
    hear the conduct of the virtuous, follow it, and keep it in his heart as the doctrine
    of the Kévalins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Protection in thoughts, words, and acts is associated with peace and the annihilation
    of sins.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Hearing the desired Truth is said to give bright ideas, and austerities, silence,
    and pure food are associated with final Liberation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Those who investigate and expound the Law are described as awakened, ending
    mundane existence, liberating themselves and others, and answering well-deliberated
    questions.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The teacher of the Law should not conceal or falsify truth, seek pride or
    fame, joke, or pronounce benedictions.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The monk should avoid injury to living beings, avoid the use of spells, not
    desire things from others, and not utter heretical doctrines.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The monk should not ridicule heretical doctrines, should avoid hard words,
    should be modest, and should expound the Syadvada while using permitted kinds
    of speech.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: If a follower believes something untrue, the monk should correct him kindly,
    avoid outrageous language, and avoid unnecessary long-winded explanations.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: The monk should learn the sacred texts as revealed, not speak unduly long,
    not corrupt the faith, not pervert or obscure the truth, and fabricate neither
    text nor meaning.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:17
  text: A person who knows the sacred texts, practices austerities, understands details
    of the Law, and is an authentic interpreter is said to be competent to explain
    the entire creed.
  category: attribute
  evidence_refs:
  - ev:10
