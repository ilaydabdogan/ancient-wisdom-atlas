canonical_text:
  quote: Therefore he should avoid women, knowing them to be like a poisoned thorn.
  summary: The passage instructs monks to avoid intercourse and intimacy with women,
    warns that such contact interrupts meditation and causes social suspicion, describes
    hypocritical renouncers who speak holy words while secretly sinning, lists severe
    punishments for adulterers, says knowledge of these consequences does not prevent
    wrongdoing under Karman, and depicts an ornamented young woman asking a Sramana
    for religious instruction or friendship.
  language: English
  quote_policy: quoted
