canonical_text:
  quote: ''
  summary: The passage describes the final stage of pure meditation in which bodily,
    verbal, and mental functions cease, remnants of Karman are annihilated, and the
    soul rises upward to the highest Akasa, attaining perfection and deliverance.
    It then introduces the Road of Penance, explaining how a monk destroys bad Karman
    through austerities, abstinences, disciplines, and the stopping of karmic influx,
    illustrated by a tank drying after its water supply is cut off.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In pure meditation, the practitioner first stops the functions of mind, then
    speech, then body, and finally breathing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During final pure meditation, all organ functions cease and four remnants
    of Karman are annihilated.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After getting rid of the audarika, karmana, and taigasa bodies, the soul takes
    the form of a straight line and goes upward in one moment to the highest Akasa
    without touching anything or taking up space.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The soul develops into its natural form and obtains perfection, enlightenment,
    deliverance, final beatitude, and the end of misery.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The lecture on exertion in righteousness is attributed to the Venerable Ascetic
    Mahavira as told, declared, explained, and demonstrated by him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Road of Penance opens by asking the listener to hear how a monk destroys
    bad Karman acquired by love and hatred through austerities.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Abstaining from destroying life, lying, taking what is not given, sexual indulgence,
    property, and eating at night makes the soul free from Asravas.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Possession of the five Samitis and three Guptis, freedom from passions, subduing
    the senses, vanquishing conceit, and avoiding delusions are also said to free
    the soul from Asravas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A large tank whose water supply has been stopped gradually dries up; this
