canonical_text:
  quote: ''
  summary: The passage gives a didactic classification of living beings. It subdivides
    animals by birth mode and habitat, gives examples and life-duration ranges for
    aquatic, terrestrial, and aerial animals, classifies men by birth and region,
    and classifies gods into four principal kinds with further subdivisions, including
    heavenly and upper-region gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states two birth modes, including birth by generatio aequivoca
    and birth from the womb, and says either type is further divided into aquatic,
    terrestrial, and aerial animals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aquatic animals are exemplified by fishes, tortoises, crocodiles, Makaras,
    and Gangetic porpoises, and their maximum and minimum life durations are specified.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Terrestrial animals are divided into quadrupeds and reptiles; quadrupeds are
    divided into solidungular, biungular, multiungular, and nailed-toed animals.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Reptiles are divided into those that walk on their arms, such as lizards,
    and those that move on their breast, such as snakes.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage assigns terrestrial animals a longest life duration of three Paly6pamas
    and a shortest duration of less than one muhurta, with a separate duration for
    continuance in the same kind of body.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Winged animals are divided into four kinds by wing form, and the passage specifies
    their longest and shortest life durations and their continuance in the same kind
    of body.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Men are divided into those originating by generatio aequivoca and those born
    from the womb; womb-born men are further grouped by Karmabhumi, Akarmabhumi, and
    minor continents, with stated subdivision counts.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'Gods are divided into four kinds: Bhaumeyikas, Vyantaras, Jyotishkas, and
    Vaimanikas; the passage states the number of kinds within each group.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Bhavanavasins or Bhaumeyikas are listed as ten Kumaras, including Asura-,
    Naga-, Suvarna-, Vidyut-, Agni-, Dvipa-, Udadhi-, Vata-, and Ghazika-Kumaras as
    transmitted in the passage and note.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The eight Vyantaras are listed as Pisakas, Bhutas, Yakshas, Rakshasas, Kinnaras,
    Kimpurushas, Mahoragas, and Gandharvas.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: 'The Jyotishkas are associated with fivefold dwellings: moons, suns, Nakshatras,
    planets, and hosts of stars.'
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Vaimanika gods are divided into those born in heavenly Kalpas and those
    born in regions above them; the former are connected with twelve named Kalpas.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: The upper-region gods include Graiveyakas and Anuttaras; the Graiveyakas are
    arranged in a ninefold sequence from lowest of the lowest through highest of the
    highest.
  category: sequence
  evidence_refs:
  - ev:13
