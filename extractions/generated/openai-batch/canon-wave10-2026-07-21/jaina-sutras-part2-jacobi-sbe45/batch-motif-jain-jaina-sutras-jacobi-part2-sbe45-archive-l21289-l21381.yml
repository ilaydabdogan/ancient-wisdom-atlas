canonical_text:
  quote: ''
  summary: The passage describes devout followers of the Nirgrantha creed who observe
    fasts, vows, and austerities, provide material support to Nirgrantha Sramanas,
    and, after confession and food-refusal, die and are reborn among gods. It then
    classifies persons as foolish, wise, or mixed according to their practice of cessation
    from sin and non-killing. A commentator’s inserted story tells of a magic-using
    friar in Rajagriha who abducts women, is killed by a king after fleeing into a
    hollow tree leading to an underground room, and whose bones mixed with milk cure
    one captive woman’s passion for him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The described followers are said to love the Nirgrantha creed and to avow
    it as true while calling other views futile.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: They keep the bar of their gates raised and their door open, and they have
    no desire to enter a stranger’s house or seraglio.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: They keep the Pedsaha/Posaha fast on the fourteenth and eighth days of the
    month, on certain festivals, and on full-moon days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: They provide Nirgrantha Sramanas with food, drink, dainties, spices, clothes,
    bowls, blankets, brooms, medicines, stools, planks, beds, and couches.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: They purify themselves by practicing vows, renunciations, fasts, and austerities
    they have vowed to perform.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: After many years as followers of the Sramanas, whether sick or not, they refuse
    food and omit many meals.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: They confess and expiate their sins, attain perfection, die at their allotted
    time, and are born again as gods in a divine region.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A person who does not practice cessation from sin is called foolish; one who
    practices it is called wise; one who partly practices it is said to be in a mixed
    state.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The conduct of one who does not practice cessation from all sins is associated
    with killing living creatures, while the conduct of one who practices cessation
    from all sins is associated with not killing living creatures.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the inserted story, a friar versed in magic arts carries off every woman
    he sees in Rajagriha.
  category: action
  evidence_refs:
  - ev:2
- id: obs:11
  text: The king follows the friar into a hollow tree in a park, reaches an underground
    room, kills the friar, and releases the captured women.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:12
  text: One released woman refuses to return to her husband because of love for her
    seducer; wise men advise that she drink the friar’s pounded bones mixed with milk,
    and the spell and passion are cured.
  category: sequence
  evidence_refs:
  - ev:3
