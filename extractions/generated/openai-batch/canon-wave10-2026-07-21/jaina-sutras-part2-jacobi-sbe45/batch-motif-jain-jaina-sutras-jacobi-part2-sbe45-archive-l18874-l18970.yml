  quote: ''
  summary: The passage teaches that one who subdues the senses and practices control
    should be non-hostile in thought, word, and deed. It emphasizes the rare value
    of human birth for receiving and adopting the Law, contrasts an unspecified heretical
    view about gods ending misery with a Gaina/Jain emphasis on human embodiment,
    and describes wise beings, Tathagatas, Kasyapa, and the Great Hero in relation
    to control, annihilation of former works, avoidance of new works, Moksha, and
    liberation.
  language: English
  quote_policy: summarized
