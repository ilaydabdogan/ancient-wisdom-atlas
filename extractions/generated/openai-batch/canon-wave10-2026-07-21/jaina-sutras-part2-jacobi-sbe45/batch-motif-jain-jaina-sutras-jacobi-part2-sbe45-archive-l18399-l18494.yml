canonical_text:
  quote: '"right knowledge and conduct"; "ascend to the place where there is no Gotra
    at all"'
  summary: The passage gives monastic instruction contrasting quarrelsome, proud,
    or self-promoting conduct with obedience to a teacher, self-control, right knowledge,
    and right conduct. It rejects pride in birth, pedigree, learning, austerity, sanctity,
    and livelihood. It warns that a monk acting like a householder or using monkhood
    for support will not attain final liberation and may suffer repeatedly in the
    Circle of Births. It praises those who abandon pride and describes great sages
    ascending to Moksha, a place where there is no Gotra. It also instructs a monk
    to view the body like a corpse, discern acceptable alms, and avoid greed for food
    and drink.
  language: English
  quote_policy: quoted
