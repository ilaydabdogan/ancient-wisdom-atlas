canonical_text:
  quote: "“Both Laws pursuing the same end, what has caused this difference?”"
  summary: The passage presents doubts about whether Parsva’s four-vow Law or Vardhamana’s
    five-vow Law is right, and about differing monastic clothing rules. Kesi and Gautama
    perceive their pupils’ thoughts and arrange to meet. Gautama goes to the Tinduka
    park with his pupils; Kesi receives him, offers him straw and hay as a seat, and
    the two sit together, compared to sun and moon. Human and nonhuman audiences assemble.
    Kesi asks Gautama why two Laws with the same end differ, and Gautama replies that
    wisdom recognizes the truth of the Law and that different kinds of saints require
    two forms of Law.
  language: English
  quote_policy: quoted
