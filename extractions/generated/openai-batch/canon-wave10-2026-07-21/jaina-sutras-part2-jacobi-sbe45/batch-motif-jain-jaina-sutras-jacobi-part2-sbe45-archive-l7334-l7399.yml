canonical_text:
  quote: ''
  summary: A speaker addresses a king, saying that an unnamed woman remained by his
    side but could not remove his pains, so he was without protection. He reflects
    on repeated suffering in the endless Circle of Births and resolves that, if freed
    from pain, he will become a calm and restrained houseless monk. After sleep his
    pains vanish, and the next morning he leaves his relations and becomes a monk.
    He then teaches that the Self is one's own protection, moral agent, friend, and
    foe, and identifies the Self with the Vaitarani river, Salmali tree, Kamaduh cow,
    and Nandana park. The passage closes with a warning that careless monks who neglect
    the great vows and desire pleasure do not fully cut off their fetters; the supplied
    excerpt ends mid-statement about monastic attentiveness.
  language: English
  quote_policy: summarized
