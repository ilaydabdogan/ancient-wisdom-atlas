canonical_text:
  quote: ''
  summary: The passage describes Mṛgaputra as indifferent to worldly and otherworldly
    interests, blocking the influx of karma through bad channels, purifying himself
    through meditation, knowledge, right conduct, faith, penance, and pure meditations,
    and reaching perfection after long ascetic practice. It presents him as an exemplar
    for enlightened renouncers and urges the hearer to despise wealth and accept the
    Law leading to Nirvana.
