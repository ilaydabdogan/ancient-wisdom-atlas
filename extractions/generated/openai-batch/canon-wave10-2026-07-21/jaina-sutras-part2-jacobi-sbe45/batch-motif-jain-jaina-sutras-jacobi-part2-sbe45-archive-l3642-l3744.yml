canonical_text:
  quote: ''
  summary: 'The passage presents didactic verses contrasting pleasure and renunciation,
    describing rebirth among humans, in hell, or as a god according to conduct, and
    asking how to escape miserable Samsara through detachment. An accompanying note
    recounts Kapila''s backstory: his desire for a servant-girl leads him to seek
    gold, he experiences sudden repentance and renunciation, becomes a Svayamsambuddha,
    and later converts a band of robbers through recited verses.'
  language: English
  quote_policy: summarized
