canonical_text:
  quote: ''
  summary: 'The passage begins the Tenth Lecture, called “Carefulness.” A wise Arhat
    proclaims the Law and instructs how a monk should practice carefulness: wandering
    without offending creatures, avoiding strain on living beings, not taking what
    householders have not freely given, and living on allowed food after mastering
    the Law and removing carelessness. A footnote explains the translated term as
    samahi/samadhi and relates it to a means of obtaining Moksha.'
