canonical_text:
  quote: ''
  summary: 'Instructions describe the conduct of an ascetic or monk: he remains restrained
    in a deserted house, endures dangers and calamities without fear, avoids quarrels,
    observes restrictions concerning water and householders, rejects self-invented
    rites and sensual pleasures, and follows the Law proclaimed by authoritative teachers.
    A dice-player simile illustrates choosing the highest Law over inferior alternatives.'
  language: English
  quote_policy: summarized
