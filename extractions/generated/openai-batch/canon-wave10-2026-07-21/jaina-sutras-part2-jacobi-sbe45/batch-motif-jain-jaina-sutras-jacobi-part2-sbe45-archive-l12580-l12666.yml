canonical_text:
  quote: ''
  summary: 'The passage gives ascetic instructions for a monk: avoid lighting fire
    because it destroys beings; avoid wealth, trade, taste, honors, gifts, property,
    egoism, passions, and the Asravas; live by alms; meditate on true things; reject
    food when death arrives; leave the human body and attain liberation, absolute
    knowledge, and eternal beatitude. It then introduces a lecture on the division
    between Living Beings and Things without life, a classification a monk must know
    for self-control, with a note listing major subcategories.'
  language: English
  quote_policy: summarized
