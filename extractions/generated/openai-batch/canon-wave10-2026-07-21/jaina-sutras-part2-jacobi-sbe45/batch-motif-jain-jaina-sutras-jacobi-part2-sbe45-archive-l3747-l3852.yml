canonical_text:
  quote: ''
  summary: A didactic ascetic passage teaches that knowledge, faith, nonattachment,
    nonviolence, regulated alms, and austerity lead toward welfare and liberation,
    while lust, hatred, killing, false ascetic claims, divinatory practices, and insatiable
    desire lead to karmic bondage, hell, Asura rebirth, and wandering in Samsara.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed person described as free from delusion and possessing perfect knowledge
    and faith speaks for the benefit, eternal welfare, and final liberation of all
    beings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A monk is instructed to cast aside fetters of the soul, hatred, and attachment
    to pleasures.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A stupid, ignorant sinner neglects the soul’s welfare, sinks through hatred
    and lust, and is compared to a fly caught on glue.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Weak men find it difficult to give up pleasures, while pious ascetics get
    over impassable Samsara as merchants cross the sea.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some who call themselves Sramanas are said to be ignorant of the prohibition
    against killing living beings, and stupid sinners go to hell through superstitious
    beliefs.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage forbids permitting or consenting to the killing of living beings
    and connects this with possible deliverance from misery.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A careful person who does not injure living beings is called circumspect,
    and sinful karma is said to quit him as water quits raised ground.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: In thoughts, words, and acts one should do nothing injurious to beings in
    the world, whether moving or unmoving.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A monk should know what alms may be accepted, beg only to sustain life, avoid
    daintiness, and eat austere or unappealing foods when necessary.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Interpreters of bodily marks, dreams, and bodily forebodings are declared
    not to be Sramanas.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Those who lack discipline, abandon meditation and ascetic practices, and desire
    pleasures and good fare will be reborn as Asuras and later wander for a long time
    in Samsara.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: 'Desire is depicted as difficult to satisfy: even the whole earth would not
    be enough for one person, and wants increase with possessions.'
  category: attribute
  evidence_refs:
  - ev:10
