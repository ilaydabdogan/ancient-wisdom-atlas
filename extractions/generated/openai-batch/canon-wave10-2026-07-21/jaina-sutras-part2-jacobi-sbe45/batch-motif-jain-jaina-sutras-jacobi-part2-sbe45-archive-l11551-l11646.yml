canonical_text:
  quote: ''
  summary: 'The passage gives instructions for a Śramaṇa engaged in austerities: study
    the sūtras, eat measured and allowed food, choose a virtuous companion or live
    alone, remain secluded, restrain the senses, avoid attachment, and uproot love,
    hatred, and delusion. It explains a causal chain linking desire, delusion, karman,
    birth and death, and misery, and uses similes of an egg and crane, birds and a
    fruit tree, fire in a windy forest, mice near a cat, and crossing the ocean before
    rivers.'
  language: English
  quote_policy: summarized
