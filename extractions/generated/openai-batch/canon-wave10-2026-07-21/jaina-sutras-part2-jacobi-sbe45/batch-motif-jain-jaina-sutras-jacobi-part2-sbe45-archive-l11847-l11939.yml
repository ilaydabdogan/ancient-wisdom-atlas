- id: obs:1
  text: A monk is instructed not to desire a companion, even one able to perform religious
    duties, and not to desire worldly reward for austerities if he regrets taking
    vows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that infinitely varied emotions arise in one who is the slave
    of his senses.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person desiring happiness and submerged in the ocean of delusion forms many
    plans to ward off misery and exerts himself for them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Objects of the senses, including sounds, cause neither pleasant nor unpleasant
    feeling to the indifferent person.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Recognizing the vanity of desires leads to perfect indifference, and ceasing
    to desire sense objects extinguishes desire for pleasures.
  category: sequence
  evidence_refs:
  - ev:4
