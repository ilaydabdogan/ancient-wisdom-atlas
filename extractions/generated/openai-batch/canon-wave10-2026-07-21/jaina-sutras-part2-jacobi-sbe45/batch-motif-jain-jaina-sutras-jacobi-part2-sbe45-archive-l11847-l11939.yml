canonical_text:
  quote: ''
  summary: The passage instructs a monk not to desire companionship or worldly reward,
    describes sense-bound desire as delusion and misery, praises indifference to sense
    objects, and states that dispassion removes karmic obstructions and leads to knowledge,
    purity, beatitude, and freedom from misery. It then introduces the eight kinds
    of Karman by which the soul turns in the Circle of Births and begins listing their
    functions.
  language: English
  quote_policy: summarized
