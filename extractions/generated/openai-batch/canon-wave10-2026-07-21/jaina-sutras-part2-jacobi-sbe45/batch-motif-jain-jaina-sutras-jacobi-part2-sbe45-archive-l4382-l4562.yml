  quote: ''
  summary: The passage exhorts Gautama to remain on the cleared right path, cross
    fully beyond the great ocean, follow the practices of perfected saints, and reach
    perfection. It then introduces the right discipline of a houseless monk, contrasts
    ill-behaved and well-behaved traits, and praises the very learned monk through
    a series of similes involving water, animals, heroic and royal figures, gods,
    the sun, and the moon.
