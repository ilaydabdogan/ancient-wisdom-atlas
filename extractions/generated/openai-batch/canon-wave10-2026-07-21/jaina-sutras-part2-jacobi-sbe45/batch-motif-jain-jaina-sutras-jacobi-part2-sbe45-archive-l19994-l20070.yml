canonical_text:
  quote: ''
  summary: 'The passage frames the Second Lecture, called “On Activity,” as a discourse
    heard by Sudharman from Mahavira and addressed to Gambusvamin. It states that
    the lecture treats merit and demerit: merit is associated with the Self at rest,
    demerit with the Self in disturbance. It then begins an explanation of demerit,
    says that sentient beings among hell-beings, animals, gods, humans, and other
    beings feel pain in connection with sin, and lists thirteen kinds of activity
    or sin.'
  language: English
  quote_policy: summarized
