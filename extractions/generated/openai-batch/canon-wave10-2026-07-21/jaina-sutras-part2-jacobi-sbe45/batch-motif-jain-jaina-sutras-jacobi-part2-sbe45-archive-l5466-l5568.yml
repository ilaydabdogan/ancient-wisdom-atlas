  quote: "“The Law alone, and nothing else in this world, will save you, O monarch.”"
  summary: After the Purohita and his family enter the order, the queen addresses
    the king. She condemns greed and confiscation, says worldly treasures cannot save
    him at death, vows to live as a nun, uses animal and fire similes for attachment,
    and urges the king to abandon kingdom, pleasures, and property, learn the Law,
    and practice penance.
