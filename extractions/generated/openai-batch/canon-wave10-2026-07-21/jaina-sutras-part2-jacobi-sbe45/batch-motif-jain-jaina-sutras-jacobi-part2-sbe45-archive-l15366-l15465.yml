canonical_text:
  quote: "“A man believes himself a hero as long as he does not behold the foe”"
  summary: The passage introduces the Third Lecture, “The Knowledge of Troubles.”
    It states that an untested person or novice may think himself heroic until he
    encounters actual battle, pain, mendicant austerities, seasonal hardship, begging,
    insults, animal bites, insect bites, hair-plucking, and chastity difficulties.
    Hostile people revile monks, and the text says such deluded people go from darkness
    to deeper darkness.
  language: English
  quote_policy: quoted
