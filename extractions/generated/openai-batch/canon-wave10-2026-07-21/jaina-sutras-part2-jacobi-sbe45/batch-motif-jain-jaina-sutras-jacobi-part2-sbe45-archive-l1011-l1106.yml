canonical_text:
  quote: ''
  summary: 'The passage surveys external reports on ancient Nigazthas/Gainas: Pésaha
    fasting and renunciatory discipline, doctrines about the soul, the treatment of
    cold water as living, reported continuity between ancient Nigazthas and present
    Gainas, and the Samaññaphala Sutta description of a Nigaztha restrained in four
    directions. The editor adds cautions about the accuracy and interpretation of
    these reports.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Pésaha observance is described as fasting, eating once, or eating one
    dish only on the eighth and fourteenth days of each fortnight, with bathing, adornment,
    scents, lights, and other comforts given up.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The editor states that present Gaina laymen discard ornaments and luxuries
    during Pésaha days but, to his knowledge, do not remove their clothes or pronounce
    a monastic formula of renunciation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Buddhaghosa is reported as saying that Nigazthas hold that the soul has no
    colour, while Agivikas divide mankind into six classes according to the colour
    of the Atman.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says both Nigazthas and Agivikas maintain that the soul continues
    to exist after death and is free from ailments.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Buddhaghosa is reported as saying that Niganztha Nataputta considered cold
