canonical_text:
  quote: ''
  summary: The passage condemns ascetics who rely on outward signs, self-mortification,
    nakedness, forbidden alms, occult practices, or sensuality while neglecting vows
    and self-control. It warns that such conduct leads to misery, hell, and brute
    rebirth. A wise hearer is instructed to abandon wicked paths, follow the road
    of the great Nirgranthas, destroy Karman through virtuous conduct and self-control,
    and reach mukti, the permanent place. The sermon is attributed to an austere and
    calm great ascetic and sage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person may wear a shaven crown and mortify himself for a long time, yet
    fail if careless about vows, penance, and self-control.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The false ascetic is compared to a hollow clenched fist, a false Karshapana,
    and glass resembling turquoise, and is lightly regarded by discerning people.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that the Law harms one who mixes it with sensuality, using
    similes of poison, an awkwardly handled weapon, and a Vetala not laid.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person who practices divination from bodily marks and dreams, augury, superstitious
    rites, and magic tricks for a sinful living is said to have no refuge at retribution.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A sinner who breaks the rules of monks is described as going from darkness
    to darkness, toward misery, hell, and rebirth as a brute.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: One who accepts forbidden alms and devours everything like fire is said to
    go to hell after sinning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Nakedness is declared vain for one who errs about paramount matters; such
    a person loses both this world and the next.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A wise person hearing the discourse is told to abandon every wicked path and
    walk the road of the great Nirgranthas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: One possessing virtuous conduct, best self-control, freedom from sinful influences,
    and destroyed Karman is said to reach mukti, the greatest, best, permanent place.
  category: sequence
  evidence_refs:
  - ev:6
