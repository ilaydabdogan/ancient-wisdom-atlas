canonical_text:
  quote: ''
  summary: 'The passage closes Lecture XX with King Srézika praising an ascetic, asking
    forgiveness, becoming a believer with his household, and departing after bowing.
    The ascetic continues wandering, restrained by the three Guptis and non-injury.
    Lecture XXI begins the story of Samudrapala: Palita, a Jain lay merchant and disciple
    of Mahavira, travels by boat to Pihuzda, marries a merchant’s daughter, and has
    a son born at sea, named Samudrapala. Samudrapala grows up in comfort, studies
    many arts, marries Rapizi, sees a condemned man being led to execution, recognizes
    this as the result of wicked actions, becomes enlightened, leaves his parents,
    and enters houselessness. The passage then states monastic duties, including the
    five great vows, compassion, restraint, chastity, and control of the senses.'
  language: English
  quote_policy: summarized
