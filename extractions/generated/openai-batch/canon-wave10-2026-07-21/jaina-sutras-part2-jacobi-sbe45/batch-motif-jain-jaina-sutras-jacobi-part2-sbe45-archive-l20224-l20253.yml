canonical_text:
  quote: Thereby the bad Karman accrues to him.
  summary: 'The passage enumerates the sixth, seventh, and beginning of the eighth
    kinds of committing sins: lying, taking what is not freely given, and mere conceit.
    It describes direct action, causing another person to act, or consenting to another''s
    action, and says bad Karman accrues in the lying and taking cases. The beginning
    of the eighth case describes a man overcome by sorrowful, anxious, and downcast
    meditation.'
