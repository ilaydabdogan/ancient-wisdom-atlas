canonical_text:
  quote: ''
  summary: The passage presents a series of royal exempla who adopt the faith of the
    Ginas, give up kingdoms or pleasures, place sons on thrones, become monks or Sramamas,
    practice penance, cut down Karman, and reach perfection. Sakra directs the renunciation
    of Dasarmabhadra and Nami. The next lecture opens in the pleasant town of Sugriva,
    introducing king Balabhadra, queen Mriga, and their son Balasri or Mrigaputra,
    a crown-prince and future lord of ascetics who enjoys palace life with his wives.
  language: English
