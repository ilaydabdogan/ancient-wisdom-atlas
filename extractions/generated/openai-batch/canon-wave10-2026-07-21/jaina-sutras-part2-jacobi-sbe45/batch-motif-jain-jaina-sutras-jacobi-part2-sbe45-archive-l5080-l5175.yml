canonical_text:
  quote: ''
  summary: A saintly speaker instructs a king that pleasures are painful and transient,
    that pious monks seek right conduct, and that karma alone follows a person beyond
    death. The speaker recalls former births among the Svapakas, urges the king to
    renounce pleasures and enter the order, describes death, funeral burning, family
    separation, and rebirth according to karma. The king replies that he knows the
    Law but remains attached to sensual pleasures after a sinful resolution connected
    with seeing Sanatkumara at Hastinapura.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pleasures and ornaments are described as burdensome or pain-producing, while
    pious monks are said to be intent on right conduct rather than pleasure.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says that “we” twice belonged to the Svapakas, described as the
    lowest caste, loathed by people and living in Svapaka hamlets.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king is told that his present power and prosperity are the reward of good
    actions and is urged to abandon transitory pleasures and enter the order.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person who has done no good actions and has not practiced the Law is said
    to repent in the next world when becoming prey to Death.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Death is compared to a lion taking an antelope, and relatives are said to
    be unable to save the dying person or share his suffering.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The doer’s Karman is said to follow him; leaving family, animals, fields,
    house, wealth, corn, and everything else, he enters a new good or bad existence
    accompanied only by Karman.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: After the corpse is burned on the funeral pile, the wife, sons, and kinsfolk
    are said to choose another man to provide for them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Life is described as continuously moving toward death, and old age as carrying
    off human vigor.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The king replies that he knows the teaching but finds sensual pleasures hard
    to abandon; he says that after seeing Sanatkumara in Hastinapura he formed a sinful
    resolution and still longs for sensual pleasures despite knowing the Law.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage ends with the beginning of a simile comparing the king’s condition
    to an elephant sinking in a quagmire.
  category: speech
  evidence_refs:
  - ev:10
