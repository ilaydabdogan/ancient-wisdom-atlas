canonical_text:
  quote: ''
  summary: 'A didactic passage lists successive renunciations and disciplines of a
    monk: turning from the world, limiting desires, renouncing possessions, food,
    passions, activity, body, and company. These practices are said to destroy Karman,
    prevent rebirth, lead to a final no-return stage of meditation, and bring the
    monk to the highest region of the universe and absolute happiness.'
  language: English
  quote_policy: summarized
