- id: obs:2
  text: A monk who renounces collecting alms in only one district is described as
    overcoming obstacles, being content with the alms he receives, not coveting a
    fellow-monk’s alms, not envying other monks, and taking separate agreeable lodging.
  category: action
  evidence_refs:
