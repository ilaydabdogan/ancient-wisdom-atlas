canonical_text:
  quote: ''
  summary: The excerpt continues Nami's dialogue with Indra. Indra urges sacrifices,
    almsgiving, householder observance, wealth, and pleasure, while Nami answers by
    praising self-control, the taught Law, austerity, and freedom from greed. Sakra
    then throws off a Brahmana guise, reveals himself, praises Nami's conquest of
    passions, reveres him, and departs through the air. Nami leaves the house and
    takes Sramanahood. The next lecture begins with images of a falling leaf and a
    dew-drop to stress the brevity of human life, followed by warnings about sin,
    rare human birth, karma, and rebirth into elemental, vegetable, and other bodies.
  language: English
  quote_policy: summarized
