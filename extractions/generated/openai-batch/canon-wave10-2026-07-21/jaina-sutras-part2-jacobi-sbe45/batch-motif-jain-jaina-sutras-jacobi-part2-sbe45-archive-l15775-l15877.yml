canonical_text:
  quote: ''
  summary: The passage contrasts ascetic restraint with doctrines favoring comfort
    and sensual pleasure. It cites Parasara and earlier great men as eating seeds,
    sprouts, and drinking water while reaching perfection; warns weak monks not to
    be discouraged; rejects claims that pleasant results come through pleasant living;
    uses parables of mistaken value and future remorse; condemns violence, false speech,
    theft, sexuality, and property; describes heretics defending sexual pleasure with
    similes; and compares women as a temptation for the unwise to the difficult Vaitarani
    river of hell.
  language: English
  quote_policy: summarized
