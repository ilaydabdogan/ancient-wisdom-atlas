canonical_text:
  quote: "“As I feel pain, so they do. Therefore they should not be injured or killed.”"
  summary: The passage discusses how using living beings to meet wants is tied to
    lack of restraint and sin. It describes senseless beings as lacking reason, consciousness,
    intellect, mind, and speech, yet still reckoned as harm-causing. It states that
    beings may move between sentient and senseless embodiments through Karman. A questioner
    asks how to become restrained, and the Acharya answers with the Venerable One’s
    teaching that living beings feel pain and should not be injured or killed.
  language: English
  quote_policy: quoted
