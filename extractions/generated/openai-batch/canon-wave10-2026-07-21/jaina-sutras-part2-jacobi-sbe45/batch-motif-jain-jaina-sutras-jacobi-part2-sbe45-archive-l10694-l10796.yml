canonical_text:
  quote: ''
  summary: 'A didactic sequence lists virtues, renunciatory qualities, watchfulness,
    discipline, and knowledge, and states the results they bring: non-rebirth, freedom
    from bodily and mental pains, severing attachment and desire, Samvara, prevention
    of sinful Asravas, destruction of Karman remnants, perfection, enlightenment,
    deliverance, final beatitude, and an end to misery. Knowledge and sacred lore
    are said to keep the soul from being lost in Samsara, with the image of a threaded
    needle that will not be lost.'
  language: English
  quote_policy: summarized
