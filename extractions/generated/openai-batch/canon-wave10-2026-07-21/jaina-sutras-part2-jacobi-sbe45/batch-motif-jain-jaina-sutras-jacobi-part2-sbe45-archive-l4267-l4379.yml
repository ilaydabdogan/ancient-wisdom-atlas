canonical_text:
  quote: ''
  summary: 'The passage describes the soul entering various embodied states, including
    multi-sensed beings, gods, and denizens of hell, and being driven through Samsara
    by good and bad Karman. It then presents a sequence of rare opportunities: human
    birth, Arya status, possession of five senses, instruction in the Law, belief
    in it, and practice of it. The speaker warns Gautama about aging, decline of the
    senses, disease, and bodily decay, and instructs him to abandon attachments, wealth,
    wife, friends, relations, and amassed fortune after entering the houseless state.'
  language: English
  quote_policy: summarized
