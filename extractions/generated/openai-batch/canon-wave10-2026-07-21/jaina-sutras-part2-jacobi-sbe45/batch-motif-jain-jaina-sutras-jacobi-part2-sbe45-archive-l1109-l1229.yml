canonical_text:
  quote: ''
  summary: The passage argues that Buddhist references and mistakes concerning Nataputta
    Mahavira, Parsva, Sudharman, and the Niganthas can be used as evidence for the
    existence of Parsva's followers and for an older Jain sect before or during the
    time of Buddha. It also summarizes a Jain account in which Kesi and Gautama reconcile
    the old and new branches of the church near Sravasti, explaining differences over
    vows and clothing, and relates these differences to later Svetambara and Digambara
    division.
  language: English
  quote_policy: summarized
