canonical_text:
  quote: ''
  summary: A doctrinal debate passage states that beings pass through the Circle of
    Births between immovable and movable forms. Gautama rejects Udaka's interpretation
    that renouncing injury to one class of beings could amount to ceasing injury altogether.
    He uses an analogy about a renouncer who returns to household life and begins
    another about householders seeking instruction in the Law.
  language: English
