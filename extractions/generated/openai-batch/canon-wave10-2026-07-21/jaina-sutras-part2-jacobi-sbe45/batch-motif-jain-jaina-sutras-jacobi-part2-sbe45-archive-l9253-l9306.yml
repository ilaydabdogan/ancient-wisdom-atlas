canonical_text:
  quote: ''
  summary: A speaker is praised for having explained true Brahmanahood and is asked
    to accept alms. He refuses alms, urges a Brahmana to enter the order, and teaches
    that attachment to pleasure binds beings to Karman and Samsara, using images of
    glue and wet clay sticking to a wall. Vijayaghosha learns the Law from the houseless
    Gayaghosha, enters the order, and both figures annihilate their Karman through
    self-control and penance, reaching highest perfection.
  language: English
  quote_policy: summarized
