canonical_text:
  quote: ''
  summary: The passage is a praise of Mahavira. Various religious and lay groups ask
    who proclaimed the wholesome Law and inquire about the knowledge, faith, and conduct
    of the Gatriputra. The reply praises the sage as omniscient, pure, detached, homeless,
    crossing the flood of Samsara, and the proclaimer of the highest Law of the Ginas.
    His knowledge and virtues are described through comparisons with a lamp, sun,
    fire, sea, ocean, Indra/Sakra, heaven, and Mount Meru/Sudarsana, which is then
    cosmographically described.
  language: English
