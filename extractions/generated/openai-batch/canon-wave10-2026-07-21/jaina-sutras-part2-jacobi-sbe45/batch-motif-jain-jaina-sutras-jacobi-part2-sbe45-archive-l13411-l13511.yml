canonical_text:
  quote: ''
  summary: The passage continues a classification of living beings. It names beings
    with four organs of sense, introduces beings with five organs of sense as denizens
    of hell, animals, men, and gods, then classifies hell denizens according to seven
    hells and gives graded minimum and maximum durations of life in each hell. It
    also states that the length of life of hell denizens equals their continuance
    in the same kind of body.
