canonical_text:
  quote: "“So are all creatures averse to pain.”"
  summary: The passage presents a didactic test in which philosophers refuse to hold
    a vessel of burning coals because it would burn and cause pain. This becomes a
    general maxim that all living beings are averse to pain. The passage contrasts
    teachers who permit violence toward living beings with those who reject it, linking
    the former to future suffering and samsaric wandering and the latter to the end
    of misery. It concludes that a monk seeking the soul’s good should guard himself
    from sinful action.
  language: English
  quote_policy: quoted
