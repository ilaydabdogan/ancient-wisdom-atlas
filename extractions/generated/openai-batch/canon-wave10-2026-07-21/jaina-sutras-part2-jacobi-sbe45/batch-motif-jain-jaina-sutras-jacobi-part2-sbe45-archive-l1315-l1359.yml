canonical_text:
  quote: ''
  summary: The passage defines Kriyavada as the doctrine that the soul acts or is
    affected by acts, and Akriyavada as the doctrine that the soul either does not
    exist, does not act, or is not affected by acts. It classifies several Jain, Brahmanical,
    materialist, and Buddhist systems under these categories. It also notes Vedanta
    references in the Jain canon and introduces Fatalism as a heresy discussed in
    the Sutrakritanga, comparing it with Makkhali Gosala’s statement in the Samannaphala
    Sutta that the pollution and defilement of sentient beings are uncaused.
  language: English
