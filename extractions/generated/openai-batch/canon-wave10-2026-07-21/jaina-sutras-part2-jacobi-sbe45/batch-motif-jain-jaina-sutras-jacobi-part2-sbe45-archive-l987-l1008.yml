canonical_text:
  quote: I belong to nobody, and nobody belongs to me.
  summary: A quoted passage from the Anguttara Nikaya describes a lay adherent being
    exhorted on the Uposatha day to remove his clothes and declare non-belonging.
    The passage then argues that ordinary family and household relations contradict
    the declaration, resulting in charges of lying speech and taking what was not
    freely given. The commentary states that this would make a Nigantha layman's duties
    equal to a monk's on Uposatha days, while noting that the description does not
    fully agree with Jaina Posaha rules.
  language: English
