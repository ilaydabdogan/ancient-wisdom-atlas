canonical_text:
  quote: ''
  summary: The Venerable Gautama rejects a claim about movable and immovable beings
    and injury, warns that blaming righteous ascetics or Brahmanas harms merit for
    another world, and teaches that one who learns even one noble religious truth
    should honor the teacher. Udaka first turns away, then accepts the teaching and
    asks to pass from the creed of four vows to the creed of five great vows and Pratikramana.
    Gautama takes him to Mahavira, whom Udaka circumambulates three times and worships
    before repeating the request.
  language: English
  quote_policy: summarized
