canonical_text:
  quote: ''
  summary: The passage summarizes doctrines in which purity is uncaused, individual
    conduct and effort do not produce outcomes, and all living beings lack intrinsic
    power while experiencing happiness or misery through necessity in six forms of
    existence. It then notes Jain classifications of four philosophical schools, discusses
    the uncertain views of the Agnanikas or Agnostics, and compares them with a Buddhist
    account of Sanjaya Belatthiputta. A footnote expands the enumeration of living
    beings to include animals, sense-based classes of beings, egg- or womb-generated
    beings, and plants or grains.
  language: English
  quote_policy: summarized
