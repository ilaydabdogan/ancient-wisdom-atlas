canonical_text:
  quote: ''
  summary: The lecture opens with an exhortation to hear true instruction on religion
    and liberation. King Srézika of Magadha visits the Mazdikukshi Kaitya park, sees
    a restrained saint sitting under a tree, honors him, and asks why a young nobleman
    has entered the ascetic order. The saint says he is without a protector. The king
    offers royal protection and worldly pleasures, but the saint replies that the
    king too is without protection. To explain, the saint recounts a childhood illness
    in Kausambi, where physicians and family members could not remove his pain.
  language: English
  quote_policy: summarized
