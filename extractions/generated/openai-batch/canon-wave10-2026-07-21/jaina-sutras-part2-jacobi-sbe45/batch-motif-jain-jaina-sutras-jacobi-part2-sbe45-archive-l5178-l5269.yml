canonical_text:
  quote: ''
  summary: 'The passage contrasts counsel against sensual pleasure with the fate of
    King Brahmadatta and the sage Xitra, then begins the Ishukara lecture: former
    gods are reborn in noble families, turn away from worldly life, and two sons of
    a Brahmanical Purohita announce their intention to become monks while their father
    invokes Vedic teaching about sons and a better world.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker says time passes quickly and human pleasures are impermanent, comparing
    them to a bird leaving a fruitless tree.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker tells the king that if he cannot abandon pleasure, he should do
    noble actions, follow the Law, and have compassion on all creatures, after which
    he will become a god in a new existence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Brahmadatta, king of the Pavéalas, does not act on the saint's counsel; he
    enjoys the highest pleasure and afterwards sinks into the deepest hell.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Xitra is described as a great sage of excellent conduct and penance who is
    indifferent to pleasure, practices the highest self-control, and reaches the highest
    place of perfection.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some beings who had been gods in the same heavenly region are born below in
    the ancient, wealthy, famous town called Ishukdra, described as beautiful like
    heaven.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: By a remnant of merit from a former life, these beings are born in noble families;
    they become disgusted with the world, afraid of Samsara, abandon pleasures, and
    take refuge in the path of the Ginas.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The reborn group is listed as two males who remained bachelors, the Purohita
    Bhvzgu, his wife Yasa, the widely famed king Ishukdra, and his wife Kamalavati.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says they fear birth, old age, and death, are intent on pilgrimage,
    hope to escape the Wheel of Births, examine pleasures, and abandon them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The two dear sons of the Brahmanical Purohita remember their former birth
    and the penance and self-control they had practiced then.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The two sons, averse to human and heavenly pleasures and desiring liberation,
    tell their father that human life is transitory, they take no delight in domestic
    life, bid farewell, and will turn monks.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The father tries to dissuade the would-be monks and cites those versed in
    the Vedas as saying there will be no better world for men without sons; he also
    mentions studying the Vedas, feeding priests, and having sons.
  category: speech
  evidence_refs:
  - ev:10
