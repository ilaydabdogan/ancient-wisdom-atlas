canonical_text:
  quote: ''
  summary: 'The passage gives rules for a Jain monk or sage: he should endure heat,
    insects, lack of clothing, fatigue, homelessness, fear, poor lodging, abuse, and
    beating without anger or complaint; he should avoid attachment to women, property,
    householders, comfort, and fixed residence; he should wander on allowed food,
    sit alone in marginal places, tolerate living beings, practice patience, and meditate
    on the Law.'
  language: English
  quote_policy: summarized
