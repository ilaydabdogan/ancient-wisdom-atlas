  quote: ''
  summary: Didactic verses instruct a monk or sage to practice non-injury, restraint,
    careful speech, celibacy, non-possession, endurance of hardships, and doctrinal
    truthfulness. The passage contrasts the unattached ascetic with the sinner who
    harms beings, seeks unallowed food, women, property, and accumulates Karman leading
    to misery after death. It states that realizing oneself as single and alone leads
    to Liberation.
