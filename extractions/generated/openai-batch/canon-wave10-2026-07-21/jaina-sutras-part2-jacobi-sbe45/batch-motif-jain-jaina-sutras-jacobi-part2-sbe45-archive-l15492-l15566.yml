canonical_text:
  quote: ''
  summary: The passage warns that monks may be overcome by tender family attachments.
    Relatives lament and urge a monk to return home, invoking obligations to parents,
    siblings, sons, wife, debts, and livelihood. The monk is described as returning
    home when held by attachment. Several similes compare this attachment to a creeper
    around a tree, keepers following a newly caught elephant, a cow staying near its
    calf, and the difficulty of crossing the ocean. The passage concludes that a monk
    should renounce attachment because it causes sin.
