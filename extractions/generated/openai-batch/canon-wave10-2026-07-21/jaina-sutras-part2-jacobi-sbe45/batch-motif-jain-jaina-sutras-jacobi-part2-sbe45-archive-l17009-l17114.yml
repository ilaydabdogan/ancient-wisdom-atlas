canonical_text:
  quote: ''
  summary: The passage states that sinners suffer the harms they inflicted and continue
    acquiring Karman in samsara. It condemns fire use, plant cutting, and seed destruction
    as harm to living beings. It warns that humans die at all life stages and that
    human birth is difficult to obtain. It also rejects claims that perfection is
    gained by salt abstention, bathing or water contact, cold water, or fire-tending.
  language: English
