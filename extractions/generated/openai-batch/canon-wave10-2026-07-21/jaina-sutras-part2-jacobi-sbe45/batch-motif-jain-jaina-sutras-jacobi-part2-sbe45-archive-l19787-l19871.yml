  quote: ''
  summary: The passage contrasts householders and property-acquiring killers with
    the true monk, teaches renunciation of works, develops an analogy of shared pain
    among all living beings as a basis for non-violence, cites Arhats and Bhagavats
    as declaring an eternal law of non-harm, and describes monastic restraint from
    killing, acquisition, sensory attachment, passions, and reward-seeking after death.
  language: English
