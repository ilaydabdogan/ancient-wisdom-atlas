canonical_text:
  quote: ''
  summary: 'Kési questions Gautama through a series of images: an island amid floodwaters,
    a boat on an ocean, a sun illuminating darkness, and a safe place beyond suffering.
    Gautama interprets these as the Law, the body and life crossing the Circle of
    Births, the omniscient Gina, and Nirvaza. Kési’s doubt is resolved; he bows to
    Gautama and adopts the Law of the five vows.'
  language: English
  quote_policy: summarized
