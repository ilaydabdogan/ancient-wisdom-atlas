  text: Kési asks Gautama to name an island that stands in the midst of water and
    is not inundated; Gautama answers that the flood is old age and death, and that
    Law is the island, firm ground, refuge, and shelter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kési asks how Gautama will reach the opposite shore in a boat drifting on
    an ocean with many currents; Gautama answers that a leaking boat will not reach
    the opposite shore, but a non-leaking boat will.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gautama identifies the body as the boat, life as the sailor, and the Circle
    of Births as the ocean crossed by great sages.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kési asks who will bring light into a dreadfully dark gloom inhabited by many
    beings; Gautama answers with the image of a spotless sun and identifies the luminary
    as the omniscient Gina who has ended the Circle of Births.
  category: speech
  evidence_refs:
  - ev:3
