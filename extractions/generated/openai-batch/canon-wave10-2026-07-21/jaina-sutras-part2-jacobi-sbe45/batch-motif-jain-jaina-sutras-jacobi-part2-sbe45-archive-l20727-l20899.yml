canonical_text:
  quote: ''
  summary: The passage contrasts worldly enjoyment, demerit, merit, and a mixed state.
    A wealthy pleasure-enjoying man is described with ritual acts, adornment, attendants,
    women, music, torchlight, and a throne-room. Some observers call him godlike,
    while noble observers condemn his cruel actions and associate him with hell and
    delayed enlightenment. The text then classifies demerit as not leading to liberation
    or Nirvana, merit as holy and leading to final beatitude, and lists unrighteous
    householders' violence, deception, sensory attachments, commerce, and harmful
    acts.
  language: English
  quote_policy: summarized
