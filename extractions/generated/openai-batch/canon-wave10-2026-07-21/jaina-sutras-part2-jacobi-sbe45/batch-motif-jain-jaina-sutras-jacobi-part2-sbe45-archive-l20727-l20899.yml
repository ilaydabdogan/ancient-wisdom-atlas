- id: obs:1
  text: A pleasure-enjoying man is described as eating, drinking, dressing, sleeping,
    bathing, making offerings to house-gods, performing auspicious and expiatory rites,
    washing his head, and adorning himself in sequence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man appears adorned with wreaths, precious stones, gold, new clothes,
    and sandal, seated on a large throne in a lofty upper room, surrounded by women
    and followers, with night-long torchlight, storytelling, plays, singing, and music.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the man gives an order to one person, four or five men come without being
    asked and ask what they should do, fetch, give, put on him, or provide according
    to his desire.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Unworthy men who see him call him a god or anointed of the gods, while noble
    men say he does cruel actions and will not easily obtain enlightenment in the
    future.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The conduct described under demerit is called unworthy, impure, not holy,
    not right, not eradicating sins, not the road to perfection, liberation, Nirvana,
    or final delivery, and is judged untrue and bad.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The explanation of merit says that various kinds of men in the four directions
    are associated with conduct that is holy, right, true, good, and reaches final
    beatitude.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The mixed state is described as not holy and bad, using the negative classification
    previously applied to demerit.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Unrighteous householders in the four directions are described as having great
    desires, undertakings, and possessions, and as gaining an unrighteous livelihood.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The unrighteous men are said not to abstain from violence, killing living
    beings, bribery, fraud, deceit, sensory enjoyments, ornaments, commerce, wrong
    weights and measures, slaughter, making others work or cook, binding, killing,
    and causing pain.
  category: action
  evidence_refs:
  - ev:6
