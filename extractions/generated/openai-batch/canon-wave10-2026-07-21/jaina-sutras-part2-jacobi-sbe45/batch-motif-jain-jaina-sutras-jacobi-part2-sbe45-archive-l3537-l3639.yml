canonical_text:
  quote: ''
  summary: 'The passage contrasts limited human pleasures and lifespan with divine
    pleasures and vast divine lifespans. It gives a parable of three merchants who
    set out with capital: one gains, one preserves his capital, and one loses it.
    The teaching interprets the capital as human life, gain as heaven or the state
    of gods, and loss as rebirth in hell or as an animal. Virtues lead to human rebirth
    or divine status, while the sinner forfeits higher courses. A final simile compares
    human pleasures to a drop of water on Kusa-grass beside the ocean of divine pleasures.'
  language: English
  quote_policy: summarized
