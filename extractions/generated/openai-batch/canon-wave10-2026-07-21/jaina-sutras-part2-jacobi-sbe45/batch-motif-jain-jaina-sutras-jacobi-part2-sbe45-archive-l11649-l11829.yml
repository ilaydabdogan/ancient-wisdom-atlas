canonical_text:
  quote: From desire of pleasure arises the misery of the whole world, the gods included
  summary: The passage teaches that desire for sensory pleasure produces misery, while
    dispassion ends bodily and mental suffering. It compares pleasures to attractive
    poison and illustrates sensory attachment through repeated animal similes involving
    sight, sound, smell, taste, touch, and mental feeling. The indifferent person
    is compared to a lotus leaf not moistened by water.
  language: English
  quote_policy: quoted
