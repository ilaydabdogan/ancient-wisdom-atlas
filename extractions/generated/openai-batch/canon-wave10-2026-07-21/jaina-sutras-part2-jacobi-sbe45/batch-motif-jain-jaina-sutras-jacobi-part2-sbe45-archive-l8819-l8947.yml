canonical_text:
  quote: ''
  summary: The passage lists faults connected with a monk’s obtaining, accepting,
    and using alms, including begging by deception, threats, flattery, displays of
    learning, conjuring, invisibility, spells, and charms. It also describes careful
    inspection and wiping before handling objects, lists bodily wastes and similar
    matter to be disposed of, classifies places by whether they are frequented or
    seen, and begins criteria for a proper secluded place of disposal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage enumerates modes by which a monk wrongly procures alms, including
    expatiating on misery, curing sick people, threats, wagers, tricks, desire for
    good fare, flattery, display of learning, conjuring a god, making himself invisible,
    teaching spells, and using roots or charms to avert evils.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage enumerates ten faults concerning acceptance of alms, including
    accepting from a frightened layman, accepting soiled food, food placed among animate
    things, covered food involving animate and inanimate matter, transfer between
    vessels by the layman, forbidden condition or occupation of the giver, mixing
    pure and impure food, disputed joint ownership, soiling by milk or butter, and
    spilling milk or similar substances.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A zealous monk is instructed to inspect a thing with his eyes, wipe it, and
    then take it up or put it down while observing Samiti.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Excrements, urine, saliva, mucus, bodily uncleanliness, food offals, waste
    things, and the monk’s own body when he is about to die are grouped as things
    to be disposed of in a prescribed way.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Places are classified according to whether they are frequented by people and
    whether they are seen by people.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: A suitable place is described as neither frequented nor seen by other people,
    free from obstacles to self-control, even, and not covered with grass or leaves.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage also lists faults in use or consumption of alms, including assembling
    ingredients for a good meal, accepting too much food, praising rich fare or blaming
    poor fare, and eating choice food outside prescribed occasions.
  category: action
  evidence_refs:
  - ev:7
