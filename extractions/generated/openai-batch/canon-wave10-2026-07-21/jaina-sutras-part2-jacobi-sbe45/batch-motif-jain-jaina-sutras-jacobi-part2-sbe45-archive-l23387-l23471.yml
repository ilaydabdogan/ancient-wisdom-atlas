  summary: The passage presents questions and illustrations concerning people who
    enter or approach the Nirgrantha/Sramana discipline, renounce injury and accept
    instruction, then return to domestic life. It also describes lay followers who
    cannot enter monastic life but undertake periodic observance, limits on desires,
    and renunciation of major harmful actions.
