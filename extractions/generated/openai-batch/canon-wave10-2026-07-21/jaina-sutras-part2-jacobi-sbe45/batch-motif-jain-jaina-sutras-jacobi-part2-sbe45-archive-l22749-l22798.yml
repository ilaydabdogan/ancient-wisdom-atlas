canonical_text:
  quote: ''
  summary: The passage contrasts an enduring profit shared by a saviour and sage with
    ordinary gain, praises a non-killing, compassionate teacher grounded in the Law,
    rebukes an addressee for equating such a figure with wicked men, and introduces
    a discussion attributed in a note to Buddhists meeting Ardraka. The discussion
    uses hypotheticals about a savage roasting objects or a man under mistaken identity
    and states that, in one case, the savage would be guilty of murder according to
    the speakers’ views.
  language: English
  quote_policy: summarized
