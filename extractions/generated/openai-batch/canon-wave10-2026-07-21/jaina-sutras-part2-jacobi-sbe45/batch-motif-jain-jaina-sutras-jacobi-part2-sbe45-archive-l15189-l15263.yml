canonical_text:
  quote: ''
  summary: A didactic Jain passage teaches that a monk's Karman is annihilated through
    control, the wise reach perfection and overcome death, and those who resist seductions
    are like those who have crossed Samsara. Pleasures are compared to diseases and
    to a burden that causes a driven animal to collapse. Great vows and the prohibition
    of eating at night are compared to precious things, while greedy pleasure-seekers
    are said to neglect meditation. The passage ends by urging escape from the senses
    and self-discipline, warning that the wicked will grieve and wail.
  language: English
  quote_policy: summarized
