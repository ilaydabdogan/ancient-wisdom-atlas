canonical_text:
  quote: ''
  summary: An unnamed ascetic mendicant approaches a Brahmanical sacrificial enclosure
    while begging. The priests mock and reject him, refusing him food prepared for
    Brahmanas. A Yaksha living in a Tinduka-tree has compassion and speaks invisibly.
    The ensuing speech contrasts propertyless ascetic mendicancy with sacrificial
    privilege, using the image of gifts sown in a field that produces merit, and questions
    the benefit of sacrifices if a self-controlled mendicant is refused.
  language: English
  quote_policy: summarized
