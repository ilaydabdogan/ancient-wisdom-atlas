canonical_text:
  quote: ''
  summary: The passage praises Sramana Gnatriputra, also called the Arhat, Hero, and
    lord, as highest and wisest among men. It describes his endurance, destruction
    of karma, freedom from greed, lack of possessions, crossing of the ocean of life,
    protection for all, conquest of passions, doctrinal mastery, control, abstinence,
    austerity, knowledge of this world and the beyond, and total renunciation. It
    concludes that people who hear and believe the Law taught by the Arhat will either
    end mundane existence or become like Indra, king of gods.
  language: English
  quote_policy: summarized
