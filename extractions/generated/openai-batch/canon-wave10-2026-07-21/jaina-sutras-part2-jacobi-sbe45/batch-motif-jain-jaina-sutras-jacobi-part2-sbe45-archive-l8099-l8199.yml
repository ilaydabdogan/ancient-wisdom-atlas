canonical_text:
  quote: ''
  summary: The passage first concludes an account of two practitioners who, after
    severe austerities, become Kevalins, annihilate their Karman, and reach highest
    perfection. It then introduces the twenty-third lecture, naming Parsva as an enlightened
    Jina and Kesi as his learned disciple, who arrives at Sravasti and stays in Tinduka
    park. It also names Vardhamana as a Jina and prophet of the Law and Gautama as
    his learned disciple, who also arrives at Sravasti and stays in Koshthaka park.
    Kesi and Gautama live there carefully with disciplined pupils. Editorial notes
    describe the lecture as a legend concerning the union of the old church of Parsva
    and the new church of Mahavira.
  language: English
  quote_policy: summarized
