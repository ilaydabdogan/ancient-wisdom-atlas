canonical_text:
  quote: ''
  summary: 'The passage gives prescriptive rules for a Jain monk’s conduct: avoiding
    improper solitary contact, accepting instruction, regulating posture, movement,
    alms, and food, and behaving properly toward the teacher. It contrasts good and
    bad pupils, describes the transmission of sacred knowledge to a worthy pupil,
    and states that such a pupil may become a Siddha or a powerful god after leaving
    the impure body. The passage then opens the Second Lecture by reporting Mahavira’s
    declaration of twenty-two troubles to be borne and conquered by a wandering mendicant.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A single monk is instructed not to stand or converse with a single woman in
    barbers’ shops, houses, the ground between two houses, or the highway.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says he will devotedly accept instruction from wise ones, whether
    given kindly or roughly, as beneficial.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wise and fearless monks regard rough instruction as a benefit, while foolish
    or bad monks hate it.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A monk is instructed to occupy a low, firm, non-rocking seat, to rise seldom
    and only with cause, and to sit motionless.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A monk should go out and return at the right times and act appropriately for
    each period of the day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A monk should not approach people dining in a row but should collect freely
    given alms, beg according to sanctioned rules, and eat moderately at the proper
    time.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A monk should wait for alms alone at a regulated distance from other monks,
    and another monk should not pass him to get ahead of him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A monk should accept permitted food prepared for someone else and eat in a
    covered, sheltered place without living beings or seeds.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Well-dressed, well-cooked, well-cut, richly seasoned, very rich, strongly
    flavoured, or much sweetened foods are described as unallowed and to be avoided.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The teacher’s instruction of a clever pupil is compared to a rider managing
    a well-broken horse, while instruction of a foolish pupil is compared to tiring
    work with an unbroken horse.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A bad pupil interprets correction as blows and hard words and views the teacher
    as malevolent, while a good pupil thinks the teacher treats him like a son, brother,
    or near relation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The pupil should not provoke the teacher’s anger; if anger is perceived, he
    should pacify the teacher with kindness, folded hands, and a promise not to do
    wrong again.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: An excellent pupil needs no express directions, or is quickly directed, and
    carries out duties as told.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: When worthy, enlightened teachers are satisfied with a pupil, they make over
    to him extensive and weighty knowledge of the sacred texts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The successful pupil’s knowledge is honoured, his doubts are removed, he gladdens
    his teacher by good acts, and he keeps the five vows while protected by austerities
    and meditation.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: After leaving a body described as consisting of dirt and impurities, the successful
    pupil becomes either an eternal Siddha or a god of great power and small imperfections.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: Sudharman reports that Mahavira declared twenty-two troubles which a wandering
    mendicant must learn, know, bear, and conquer.
  category: speech
  evidence_refs:
  - ev:11
