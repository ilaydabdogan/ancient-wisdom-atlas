  summary: The passage classifies movable embodied beings, especially animals, by
    number of sense organs. It lists beings with two sense organs and three sense
    organs, notes that they inhabit only parts of the world, gives maximum and minimum
    life and body durations by cross-reference or verse, and begins the classification
    of beings with four sense organs. Translator notes identify or discuss several
    animal names and uncertainties.
