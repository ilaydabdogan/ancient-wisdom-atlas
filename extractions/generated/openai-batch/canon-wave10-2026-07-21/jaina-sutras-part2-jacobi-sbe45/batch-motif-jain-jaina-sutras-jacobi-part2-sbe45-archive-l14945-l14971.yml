  summary: The passage contrasts deluded attachment and unrighteous influence with
    the conduct of the worthy and wise. It describes virtuous heroes of faith as choosing
    the great road, the right and certain path to perfection. A person who has entered
    the road to the destruction of Karman controls mind, speech, and body, renounces
    possessions, relations, and undertakings, and walks while subduing the senses.
