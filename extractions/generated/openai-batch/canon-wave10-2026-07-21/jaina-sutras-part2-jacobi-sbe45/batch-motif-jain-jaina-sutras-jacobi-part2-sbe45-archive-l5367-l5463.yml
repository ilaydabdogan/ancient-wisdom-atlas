canonical_text:
  quote: ''
  summary: 'A fatherly speaker and his sons discuss Death, Old Age, the non-return
    of days, and the urgency of adopting the Law. The passage then presents Bhvzgu
    speaking with his wife Vasishz/i after the loss of sons: he declares domestic
    life unattractive and intends to become a mendicant, while she urges enjoyment
    of pleasures. He answers with images of a tree without branches, a bird without
    wings, a snake shedding its slough, fish and birds breaking nets, and wise men
    abandoning pleasure for mendicancy.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker asks his sons whom they call unfailing; the sons answer that mankind
    is harassed by Death, taken hold of by Old Age, and that the days are unfailing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sons state that a day that passes will never return, and that elapsed
    days are profitable or profitless depending on whether one acts up to the Law
    or contrary to it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A speaker proposes that, after living together and acquiring righteousness,
    both parties will go forth as monks and beg alms from house to house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The reply rejects postponement unless one could befriend or escape Death,
    and says the Law will be adopted immediately so that they will not be born again
    and faith will put aside attachment.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bhvzgu tells Vasishz/i that domestic life has ceased to attract one who has
    lost his sons, and that the time has arrived for him to become a mendicant friar.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bhvzgu compares himself without sons to a tree whose branches are lopped off,
    a bird without wings, a king in battle without followers, and a merchant on a
    boat without goods.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Vasishz/i urges enjoyment of collected pleasures before going on the road
    of salvation and later says that a mendicant's life is misery.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Bhvzgu replies that pleasures have been finished, life is drawing to its close,
    and he will lead the life of a monk while indifferent to gain and loss, happiness
    and suffering.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bhvzgu compares his sons' abandonment of pleasure to a snake casting off the
    slough of its body and going along free and easy.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Wise men of exemplary character and austerities are said to abandon pleasure
    and live as mendicants, like the Rohita fish breaking through a weak net.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The incomplete closing comparison mentions herons and geese that rent a net
    and fly through the air, and begins to compare this to the speaker's sons.
  category: speech
  evidence_refs:
  - ev:7
