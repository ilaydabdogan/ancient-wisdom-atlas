canonical_text:
  quote: ''
  summary: The passage gives doctrinal descriptions of gods’ life spans and bodies,
    states that living and lifeless things have been described according to reasoning,
    and instructs a sage to practice self-control and final self-mortification through
    staged fasting. It also distinguishes deathbed dispositions and actions that lead
    to bad births from those that lead to Bodhi at death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The great Vimana Sarvartha(siddha) is said to have no difference between the
    longest and shortest duration of life; both are thirty-three Sagaropamas.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The duration of the gods’ continuance in the same kind of body is said to
    equal the duration given for their life.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The text states that living beings, both worldly and perfected, and lifeless
    things, with and without form, have been described.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A sage who has learned and believed the described nature of living beings
    and lifeless things should delight in self-control.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After many years as a Sramana, a sage should mortify himself through religious
    exercises.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The stated durations of mortification are twelve years as the longest, one
    year as the middle, and six months as the shortest.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The staged mortification includes abstaining from dressed food, keeping various
    fasts, eating Akamla after specified fasts, keeping shorter and longer fasts,
    and finally breaking fasts after half a month or a whole month until death.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
- id: obs:8
  text: Certain Bhavanas are said to lead to evil ways, glossed as bad births, and
    to be obnoxious at the time of death.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:9
  text: Souls that cherish heretical opinions, commit sins, and kill living beings
    are said not to reach Bodhi at the time of death.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:10
  text: Souls that cherish orthodox opinions, do not commit sins, and are enveloped
    in white Lesya are said to reach Bodhi at the time of death.
  category: relationship
  evidence_refs:
  - ev:13
