canonical_text:
  quote: ''
  summary: The passage presents a son addressing his parents about suffering in hell
    and across existences, then seeking permission to enter the order. He compares
    monastic self-reliance to the life of wild animals, renounces property and social
    ties with snake-slough and dust similes, goes forth, and is described as observing
    vows, penance, non-attachment, impartiality, and equanimity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says that suffering in hell is more painful than any suffering
    in the human world and that he has undergone uninterrupted suffering in every
    kind of existence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The parents say that a man is free to enter the order, but that it causes
    misery to a monk that he may not remedy ailments.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The son answers that he will practise the Law like a wild animal roaming by
    itself in the woods, through self-control and penance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The animal analogy includes a wild animal that falls sick at the foot of a
    tree without anyone to cure it, give it medicine, ask after its health, or feed
    it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When healthy, the wild animal roams in woods and by lakes for food and drink,
    then walks and rests according to wild-animal habits.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A pious monk is said to go to many places like animals and afterwards to the
    upper regions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A monk on a begging-tour is instructed not to despise or blame the food he
    receives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After obtaining his parents’ permission, the son gives up all property and
    all claims in property, compared to a snake casting off its slough.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: He gives up power, wealth, friends, wives, sons, and relations, compared to
    shaking dust from his feet, and then goes forth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: He observes the five great vows, practises the five Samitis, is protected
    by the three Guptis, and undertakes mental and bodily penance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: He is described as without property, egoism, attachment, or conceit; impartial
    toward all beings; indifferent to paired opposites; turned away from passions
    and harmful actions; and free from sins and fetters.
  category: attribute
  evidence_refs:
  - ev:8
