canonical_text:
  quote: ''
  summary: The passage presents a series of doctrinal exchanges. A verse praises the
    perfected Nirgrantha sage. A Vedic Priest claims that feeding two thousand holy
    mendicants brings merit and divine rebirth; Ardraka rejects this, linking such
    feeding, contempt for compassion, and praise of slaughter with hell or darkness.
    A Vedantin claims shared doctrine but posits an invisible eternal Soul; Ardraka
    argues against a single common Soul by citing differentiated beings, lots, castes,
    and species, and contrasts ignorant teachers with those possessing full Kevala
    knowledge. A Hastitapasa says his group kills one elephant yearly to spare other
    animals.
  language: English
