  summary: The chapter addresses a monk who has renounced family and worldly ties,
    warning him to avoid sexual pleasures and to guard himself against women’s approaches,
    bodily display, sweet speech, offers of intimacy, and other temptations. These
    temptations are compared to traps, bait, snares, a wheelwright bending a wheel-rim,
    and milk mixed with poison that later produces remorse.
