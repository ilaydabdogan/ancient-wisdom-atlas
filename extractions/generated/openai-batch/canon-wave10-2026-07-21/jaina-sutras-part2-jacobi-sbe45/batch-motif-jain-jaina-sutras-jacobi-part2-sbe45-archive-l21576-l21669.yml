canonical_text:
  quote: come forth as trees
  summary: The passage describes living beings, impelled by Karman, taking birth in
    earth and then emerging as trees. It explains that tree-animating beings feed
    on liquid substance or sap, consume elemental and plant bodies, and assimilate
    consumed bodies into their own parts. It further describes tree-originated trees,
    plant parts such as roots and leaves, and parallel treatment of creepers and grass.
  language: English
  quote_policy: quoted
