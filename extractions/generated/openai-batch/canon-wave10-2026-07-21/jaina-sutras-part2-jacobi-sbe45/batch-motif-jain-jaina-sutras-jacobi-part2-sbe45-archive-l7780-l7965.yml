  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: A note identifies the bride's father as Ugrasena and connects the Dvaraka
    setting with Krishna legend as told by Brahmans and Jainas.
  category: other
  evidence_refs:
  - ev:9
- id: obs:15
  text: A note identifies Raivataka as Mount Girnar and says it is sacred to Jainas
