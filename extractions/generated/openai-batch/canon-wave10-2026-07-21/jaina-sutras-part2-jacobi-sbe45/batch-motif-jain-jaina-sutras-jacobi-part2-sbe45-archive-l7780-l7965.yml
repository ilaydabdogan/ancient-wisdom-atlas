- id: obs:8
  text: Surrounded by gods and men, the Venerable One leaves Dvaraka in a palankin,
    ascends Mount Raivataka, arrives at a park, descends from the palankin, and undergoes
    renunciation when the moon is in conjunction with Aitra.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: He plucks out his perfumed, soft, curled hair in five handfuls.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Vasudeva blesses the newly renounced ascetic, and Rama, Keshava, the Dasarhas,
    and many people pay homage to Arishtanemi before returning to Dvaraka.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When Ragimati hears of the Jina's ordination, she is afflicted, decides it
    is better to become a nun, cuts off her black tresses, enters the order, and induces
    many relations and servants to enter the order too.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Vasudeva tells Ragimati, after she has cut off her hair and subdued her senses,
    to cross the dreadful ocean of Samsara without difficulty.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: On Ragimati's way to Mount Raivataka it rains; with wet clothes she enters
