canonical_text:
  quote: ''
  summary: Arishtanemi is prepared for marriage to Ragimati with royal pomp. On the
    wedding journey he sees frightened animals confined for slaughter as wedding food,
    reflects that killing on his account will obstruct happiness in the next world,
    gives away his ornaments, and renounces. Gods and humans accompany him to Mount
    Raivataka, where his ordination occurs and he plucks out his hair. Ragimati, distressed
    by his ordination, decides to become a nun, cuts off her hair, enters the order,
    and induces others to enter. On her way to Mount Raivataka she is caught in rain
    and waits in a dark cave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Keshava asks for Ragimati in marriage on behalf of the prince, and her father
    says the prince should come so that he may give his daughter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince is bathed with lucky herbs, performs customary ceremonies, wears
    heavenly clothes and ornaments, rides Vasudeva's best mast elephant, and is accompanied
    by umbrella, chowries, music, Dasarhas, and an army.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the way, he sees animals kept in cages and enclosures, afraid, miserable,
    and on the point of being killed for their flesh.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: He asks the charioteer why animals desiring happiness are confined, and the
    charioteer answers that they will furnish food for many people at the wedding.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After hearing that many animals will be slaughtered, the great sage reflects
    that if living beings are killed for his sake he will not obtain happiness in
    the next world.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: He gives the charioteer his earrings, neck-chain, and all his ornaments after
    forming his resolution.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gods descend from heaven with their retinue to celebrate his renunciation
    according to established custom.
  category: action
  evidence_refs:
