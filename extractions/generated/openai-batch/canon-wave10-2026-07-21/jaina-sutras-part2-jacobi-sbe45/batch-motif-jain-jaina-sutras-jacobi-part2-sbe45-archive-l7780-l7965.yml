comparison_claims:
- id: claim:1
  claim: The editor's note connects the Dvaraka setting and associated Krishna-family
    figures with Krishna legend as told by Brahmans and Jainas, indicating a shared
    narrative environment for this passage.
  claim_level: same_motif
  target: Brahman and Jaina Krishna/Dvaraka narrative tradition
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The note supports shared setting and legendary background, not necessarily
    identity of the Arishtanemi renunciation motif across traditions.
- id: claim:2
  claim: The note presents Mount Raivataka/Girnar as a sacred location in both Jaina
    and Hindu contexts, though for different stated associations in the note.
  claim_level: same_function
  target: Raivataka/Girnar as shared sacred geography in Jaina and Hindu tradition
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison rests on the translator's note, while the narrative
    passage itself uses the mountain as the place of Arishtanemi's renunciation and
    Ragimati's route.
