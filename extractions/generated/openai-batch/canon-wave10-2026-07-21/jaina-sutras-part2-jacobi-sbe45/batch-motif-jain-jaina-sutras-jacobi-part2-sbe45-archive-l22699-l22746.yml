canonical_text:
  quote: ''
  summary: A wise man teaches the Law impartially while avoiding places frequented
    by men fallen from true faith. Gōsāla compares the Sramana Gnatriputra to a merchant
    who displays wares to attract a crowd for gain. Ardraka replies that Mahavira
    seeks no new Karman, destroys old Karman, and teaches the vow leading to Moksha;
    he contrasts this with merchants who kill living beings, seek property and sensual
    pleasures, and gain bondage, rebirth, and pain.
  language: English
