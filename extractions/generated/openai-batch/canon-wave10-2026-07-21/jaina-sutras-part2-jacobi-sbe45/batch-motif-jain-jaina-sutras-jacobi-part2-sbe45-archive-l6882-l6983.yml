canonical_text:
  quote: ''
  summary: 'A first-person speaker describes repeated torments in hell: burning, laceration
    by iron-billed vultures, injury at the river Vaitarami and in a dagger-leaved
    forest, cutting and skinning by weapons, capture and killing in animal forms,
    processing as tree and iron, forced consumption of molten metals, poisoned meat,
    burning fat, and blood, and continuing fear and pain.'
  language: English
  quote_policy: summarized
