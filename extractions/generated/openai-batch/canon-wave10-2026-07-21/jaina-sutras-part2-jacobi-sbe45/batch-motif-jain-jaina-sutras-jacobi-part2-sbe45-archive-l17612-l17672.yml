canonical_text:
  quote: ''
  summary: 'The passage gives rules for a Jain monk: avoid insulting address, bad
    company, household entanglement, village amusements, fine things, anger under
    abuse, and offered pleasures; wander with exertion, endure pain, obey wise teachers,
    practice right conduct before enlightened ones, renounce pride, deceit, and worldly
    vanity, and thereby bring about final Liberation.'
  language: English
  quote_policy: summarized
