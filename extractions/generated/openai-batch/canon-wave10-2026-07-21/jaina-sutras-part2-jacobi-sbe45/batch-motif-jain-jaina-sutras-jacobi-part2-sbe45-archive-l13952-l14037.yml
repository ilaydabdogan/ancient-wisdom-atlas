canonical_text:
  quote: ''
  summary: The passage contrasts souls with heretical opinions and black Lesya, practitioners
    of the creed of the Ginas, ignorant men, learned hearers of salvific doctrine,
    and several kinds of conduct that realize named Bhavanas. It closes by attributing
    the thirty-six lectures of the Uttaradhyayana to the enlightened and liberated
    G7#atrz(putra).
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Souls cherishing heretical opinions, committing sins, and enveloped in black
    Lesya are said not to reach Bodhi at death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those who love and piously practise the creed of the Ginas are said to become
    pure, free from the soil of passions, and eventually get out of the Circle of
    Births.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men who do not know the creed of the Ginas are said to commit unholy suicide
    many times and die against their will.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Those well versed in sacred lore, possessing much knowledge, awakening piety
    in others, and appreciating good qualities are described as worthy to hear the
    doctrine of salvation.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A person who amuses others through ribaldry, buffoonery, comic appearance,
    jests, and words is said to realize the Kandarpa-Bhavana.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Those who practise spells and smear their bodies with ashes for pleasure,
    amusement, or power are said to realize the Abhiyegika-Bhavana.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A deceitful man who reviles sacred lore, Kevalins, the teacher of the Law,
    the Sangha, and monks is said to realize the Kilvishika-Bhavana.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A continuously angry person who puts faith in prognostics is said to realize
    the Asuratva-Bhavana.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Those who use weapons, eat poison, throw themselves into fire or water, and
    use things not prescribed by good conduct are said to be liable to be born and
    die again and again, realizing the Meha-Bhavana.
  category: sequence
  evidence_refs:
  - ev:5
