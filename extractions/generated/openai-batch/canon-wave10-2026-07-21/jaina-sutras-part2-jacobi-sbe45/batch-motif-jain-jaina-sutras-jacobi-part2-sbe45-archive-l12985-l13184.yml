  quote: ''
  summary: The passage describes perfected beings as formless, fully living, possessed
    of knowledge and faith, beyond the boundary of Samsara, and in incomparable happiness.
    It then classifies living beings still in Samsara into movable and immovable beings,
    and subdivides immovable beings into Earth Lives, Water Lives, and plants, with
    further divisions by subtle or gross state, development, material or plant form,
    location in the world, duration, and sensory qualities.
