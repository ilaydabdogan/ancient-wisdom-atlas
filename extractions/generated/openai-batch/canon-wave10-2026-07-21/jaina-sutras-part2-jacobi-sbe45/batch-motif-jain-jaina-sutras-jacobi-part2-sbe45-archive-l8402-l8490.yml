  quote: ''
  summary: A dialogue between Kesi and Gautama uses allegorical questions and answers
    about fetters, a poisonous inner plant, a burning fire, an unruly horse, bad roads,
    and a flood. Gautama identifies the objects with attachment, love of existence,
    passions, the mind, and false paths, and describes overcoming them through destruction
    of attachment, knowledge, discipline, and the path taught by the Ginas. The flood-and-island
    question appears at the end of the provided range without its answer.
