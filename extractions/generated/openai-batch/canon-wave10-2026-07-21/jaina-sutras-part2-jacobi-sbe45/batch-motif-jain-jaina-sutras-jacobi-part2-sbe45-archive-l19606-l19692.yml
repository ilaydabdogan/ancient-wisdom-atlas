canonical_text:
  quote: ''
  summary: The passage describes men who have left former occupations without entering
    the noble path, then presents reflections associated with renouncing possessions,
    pleasures, and relations for mendicant life. It contrasts attachment to property,
    sense pleasures, and kin with the recognition that pleasures and relations cannot
    take on or remove painful illness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says four men differ in intellect, will, character, opinions,
    taste, undertakings, and plans; they have left former occupations but have not
    entered the noble path, cannot return to worldly life, cannot get beyond it, and
    remain stuck in pleasures and amusements.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men from the East, West, North, and South, including various social categories,
    may own houses, fields, servants, and peasants, and may renounce their possessions
    to lead a mendicant life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some renouncers leave kinsmen and property, while others without kinsmen or
    property also lead a mendicant life; in either case the passage describes renunciation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man about to become a monk is described as reflecting that he possesses
    fields, houses, metals, clothing, jewels, pearls, conches, corals, rubies, and
    other wealth, and that he enjoys sounds, colours, smells, tastes, and touch.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A wise man is instructed to reflect that a painful illness or disease may
    befall him and to address pleasures as if asking them to take on the disease or
    deliver him from it; the passage states that this desire has never been fulfilled.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that pleasures and amusements cannot help or save a person;
    either a person first forsakes them or they first forsake the person.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage lists mother, father, siblings, wife, descendants, servants, friends,
    kinsmen, companions, and acquaintances as relations more intimately connected
    with the person, and applies the same illness-reflection to relations as to pleasures.
  category: relationship
  evidence_refs:
  - ev:6
