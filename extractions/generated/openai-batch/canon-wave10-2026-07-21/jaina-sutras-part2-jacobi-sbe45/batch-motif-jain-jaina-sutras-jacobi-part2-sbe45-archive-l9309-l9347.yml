canonical_text:
  quote: ''
  summary: The passage declares correct behaviour as a practice leading to freedom
    from misery and says that Nirgranthas have crossed the ocean of Samsara by practising
    it. It lists ten parts of monastic behaviour, explains their uses in relation
    to leaving, entering, asking permission, offering things, carrying out intentions,
    self-blame, assent, respect, and placing oneself under another teacher. It then
    instructs a monk after sunrise to inspect and clean his things, pay respect to
    the superior, and ask him with joined hands.
