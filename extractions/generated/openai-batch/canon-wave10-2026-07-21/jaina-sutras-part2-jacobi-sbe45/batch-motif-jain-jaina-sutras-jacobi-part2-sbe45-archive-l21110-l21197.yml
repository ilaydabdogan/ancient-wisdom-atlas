  summary: The passage lists severe ascetic practices involving restricted eating,
    regulated begging, bodily neglect, nakedness, difficult postures, chastity, endurance
    of contempt and hardship, and eventual refusal of food. It states that practitioners
    who attain their end reach Kevala, described as highest knowledge and faith, at
    their last breath, and obtain perfection, enlightenment, deliverance, final beatitude,
    and the end of misery. It adds that some become liberated without assuming another
    body, while others die at the allotted time, with the excerpt ending during a
    statement about residue.
