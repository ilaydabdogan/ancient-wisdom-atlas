canonical_text:
  quote: ''
  summary: The passage describes Yakshas descending after the end of their lifespan
    and being reborn as men according to merit. A meritorious human birth is associated
    with wealth, kinship, health, wisdom, and later religious knowledge, self-control,
    penance, shedding of Karman, and becoming an eternal Siddha. An editorial note
    discusses long early years, world ages, seasons, and the Jain eon as a wheel with
    Aras, descending and rising phases. The next lecture warns against carelessness,
    violence, evil acquisition of wealth, and the inescapable effects of one's own
    actions, illustrated by a burglar caught in a breach he made.
  language: English
  quote_policy: summarized
