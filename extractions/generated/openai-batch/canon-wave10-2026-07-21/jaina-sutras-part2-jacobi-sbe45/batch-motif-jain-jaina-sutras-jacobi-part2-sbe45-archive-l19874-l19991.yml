canonical_text:
  quote: ''
  summary: The passage gives monastic rules about avoiding sinful action and complicity,
    refusing food acquired through theft, force, or harm to living beings, accepting
    only lawful and measured alms, preaching the Law without material motive, and
    pursuing Liberation through renunciation and discipline.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The monk is instructed not to perform actions arising from sinful causes,
    not to have them performed by another, and not to consent to another performing
    them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The monk should not take food, drink, dainties, or spices when he knows they
    were bought, stolen, or taken by force for him or for a co-religionist through
    sinful conduct toward living beings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Permissible food is described as prepared for others, free from faults of
    giver, receiver, and receiving, pure, free from living matter and living things,
    begged, given because of the monk's profession, collected in small bits, fit for
    a learned monk, lawful, and of prescribed quantity.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The permitted food is said to support discipline minimally, like greasing
    the axle of a carriage or anointing a sore.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The monk should consume such food without delay, compared to a snake returning
    to its hole, and should eat, drink, dress, seek cover, and sleep at the proper
    time.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A monk who knows proper measure should travel, teach, explain, praise, and
    preach the Law to all who come to listen.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The preached Law includes indifference for peace of mind, cessation of passion,
    Nirvana, purity, simplicity, humility, freedom from bonds, and prohibition against
    killing any living being.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The monk should not preach for food, drink, clothes, lodging, resting-place,
    objects of pleasure, or any motive other than annihilation of Karman.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Those instructed in the Law by such a monk, called heroes of faith, are described
    as possessing virtues, abstaining from sins, ceasing from passions, conducting
    themselves well, and reaching final beatitude.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The monk searches and knows the Law, seeks Liberation, may or may not get
    the white lotus, renounces actions, worldly occupations, and household life, and
    is called by many ascetic and wisdom titles.
  category: attribute
  evidence_refs:
  - ev:8
