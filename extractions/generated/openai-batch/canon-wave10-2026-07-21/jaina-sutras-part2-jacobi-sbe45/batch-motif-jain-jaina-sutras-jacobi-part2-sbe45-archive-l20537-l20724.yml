canonical_text:
  quote: ''
  summary: 'The passage condemns the practice of wrong sciences for material gain,
    then catalogues harmful occupations and acts: violence against people and animals,
    burglary, theft, arson, mutilation of animals, delegated or consented harm, robbery
    of Sramanas or Brahmanas, refusal of alms, and verbal abuse of ascetics. It repeatedly
    states that such acts degrade the actor and includes post-mortem rebirth among
    Asuras and evildoers for practitioners of wrong sciences.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain sciences are said to be practiced for food, drink, clothes, lodging,
    a bed, and objects of pleasure; the passage calls these practices wrong science
    and says practitioners will be reborn among Asuras and evildoers, then later deaf
    and dumb or night-blind.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man may become another person's companion or helpmate, go to meet someone,
    become a burglar or cut-purse, tend sheep, hunt, catch birds, use nets, fish,
    herd cows, slay cows, keep dogs, or hunt with dogs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: As companion or helpmate, or in similar roles, the man follows or approaches
    another, gains confidence, then beats, cuts, pierces, tears, thrashes, or kills,
    obtaining food and degrading himself.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Animal-related roles are described as beating, cutting, piercing, tearing,
    thrashing, or killing animals such as rams, buffaloes, antelopes, birds, fish,
    cows, and dogs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A man may rise in an assembly and promise to kill an animal, including named
    birds and a monkey, and then commit the same kinds of violent acts.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man angered by a shortage in his granary or liquor-cask may set fire to
    householders' cornfields, cause another to set the fire, or consent to another's
    setting the fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage describes making deep cuts in the strong limbs of camels, cows,
    horses, or donkeys, either directly, through another, or by consenting to the
    act.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage describes covering stables with brambles or twigs and burning
    them, either directly, through another, or by consenting to the burning.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The passage describes stealing householders' earrings, jewels, or pearls and
    robbing Sramanas or Brahmanas of objects such as umbrellas, sticks, staffs, pots,
    chairs, clothes, blankets, boots, knives, or scabbards.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The same acts of arson, animal injury, stable-burning, theft, and robbery
    are repeated for a man acting without consideration and without provocation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A man who detests Sramanas or Brahmanas may slap or abuse them; when a monk
    comes on the begging-tour, he refuses alms and insults Sramanas.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Such men are said to praise this life, do nothing for the next world, suffer
    and grieve, and continue causing others to suffer, be slain, or be put in fetters.
  category: sequence
  evidence_refs:
  - ev:8
