  quote: ''
  summary: The passage contrasts true knowledge and karmic freedom with ignorance,
    false doctrine, and misguided teachers. It uses images of deer in a snare, ignorant
    guides, blind guides, birds in a cage, and the Circle of Births to describe repeated
    death, misery, and failure to reach self-control. It also discusses Kriyavadin
    doctrine and a karmic distinction between intending to kill, unknowingly killing,
    and fully developed demerit.
