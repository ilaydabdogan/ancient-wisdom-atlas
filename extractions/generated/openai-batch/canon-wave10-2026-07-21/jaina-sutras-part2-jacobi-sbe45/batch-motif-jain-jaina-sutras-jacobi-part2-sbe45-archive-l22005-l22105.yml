canonical_text:
  quote: ''
  summary: A framed Jain doctrinal discourse, transmitted by Sudharman from Mahavira
    to Gambisvamin, introduces the lecture called “Renunciation of Activity.” It describes
    the Self as active, uncontrolled, and capable of sin. An opponent argues that
    sin requires sinful mental, verbal, and bodily functions, killing, an internal
    organ, awareness of operations, or even dream-consciousness. The teacher replies
    that sin can still exist without those conditions, citing Mahavira’s assignment
    of the six classes of living beings as the reason and introducing an example of
    a murderer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sudharman addresses Gambisvamin and says he heard the discourse from Mahavira;
    the lecture is named “Renunciation of Activity.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Self is described as potentially not renouncing activity, being accustomed
    to act, adhering to errors, being prone to sin, ignorant, stolid, and not considering
    the operations of mind, speech, and body.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Venerable One says the Self is uncontrolled, unresigned, active, careless,
    prone to sin, ignorant, and commits sins even when a fool does not consider mental,
    verbal, and bodily operations or see even a dream.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The opponent tells the teacher that there can be no sin without sinful thoughts,
    speech, bodily functions, killing, an internal organ, consideration of mind, speech,
    and body, or even dream-experience.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The opponent elaborates that sin of mind, speech, and body occurs when there
    is sinful mind, sinful speech, and sinful body, and that only one possessing the
    listed qualities can commit sin.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The teacher answers that sin can exist even when the perpetrator lacks the
    conditions listed by the opponent.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Venerable One assigns the six classes of living beings, from earth-lives
    to movable beings, as the reason; with regard to them, the Self does not avoid
    and renounce sins and harms through cruelty.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage introduces an illustration by the Venerable One using the example
    of a murderer, but the example itself is not included in the provided range.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A translator note states that the passage emphasizes the Jain doctrine that
    the Self or atman is the direct cause of all actions, contrasted with Sankhya
    and Buddhist positions, and also notes that karman results from the action of
    every being, even those with undeveloped consciousness.
  category: other
  evidence_refs:
  - ev:4
