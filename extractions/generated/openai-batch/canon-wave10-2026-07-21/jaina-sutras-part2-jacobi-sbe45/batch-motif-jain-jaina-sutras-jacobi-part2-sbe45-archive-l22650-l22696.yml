canonical_text:
  quote: ''
  summary: A speaker distinguishes criticism of wrong doctrines from blame of persons,
    declares the creed’s right path as taught by worthy men, and describes the non-injurious
    conduct of a controlled person. Gôsâla accuses the Sramana of avoiding public
    lodgings out of fear of being questioned by learned monks. Ardraka replies that
    the Sramana acts purposefully, not from fear or royal command, and answers worthy
    people when there is a definite purpose. A note explains this purpose through
    karma connected with becoming a prophet or Tirthakara.
  language: English
  quote_policy: summarized
