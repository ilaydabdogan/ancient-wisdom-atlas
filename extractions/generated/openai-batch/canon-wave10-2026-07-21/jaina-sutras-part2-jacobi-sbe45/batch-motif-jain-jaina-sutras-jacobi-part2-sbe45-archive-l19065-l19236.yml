canonical_text:
  quote: ''
  summary: A Jain discourse called “The Lotus” presents a simile of a lotus-pool.
    Four men from the quarters enter the pool to fetch a central white lotus and become
    stuck in mud. A monk remains on the bank, calls the lotus to fly up, and succeeds.
    Mahavira then explains the allegorical meanings of the pool, water, mud, lotuses,
    men, monk, bank, voice, and flying up.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sudharman says he heard the discourse called “The Lotus” from Mahavira and
    addresses Gambisvamin.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes a lotus-pool with much water and mud, many white lotuses,
    and one large white lotus in the middle.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A first man comes from the Eastern quarter, stands on the bank, sees the central
    white lotus, claims to know the way, and says he will fetch it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The first man enters the pool; as he proceeds, the water and mud seem to extend,
    and he becomes unable to reach the lotus or either bank and gets stuck in the
    mud.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other men from the Southern, Western, and Northern quarters repeat the pattern
    after seeing previous men stuck; they also become stuck in the mud.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A monk living on low food and desiring to get to the shore of Samsara comes
    to the lotus-pool and sees the central lotus and the four men stuck in the mud.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The monk does not enter the lotus-pool; from the bank he raises his voice,
    tells the white lotus to fly up, and the lotus flies up.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mahavira states that the narrative is a simile, and Nirgrantha monks and nuns
    ask him to explain its meaning.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Mahavira explains that the lotus-pool means the world, the water means Karman,
    the mud means pleasures and amusements, the many white lotuses mean people in
    general, and the one large white lotus means the king.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Mahavira explains that the four men mean heretical teachers, the monk means
    the Law, the bank means the church, the monk’s voice means preaching of the Law,
    and the lotus flying up means Nirvana.
  category: speech
  evidence_refs:
  - ev:9
