  quote: As merchants go over the sea, so they will cross the flood (of Samsara)
  summary: The passage describes renouncers who abandon adornment and renounce everything.
    It compares their progress to merchants crossing the sea and says they will cross
    the flood of Samsara, where beings suffer because of their own deeds. A monk who
    understands this should live virtuously, follow the Samitis, avoid false speech
    and taking what is not given, and cease injuring living beings; this peace is
    identified with Nirvava/Nirvana.
