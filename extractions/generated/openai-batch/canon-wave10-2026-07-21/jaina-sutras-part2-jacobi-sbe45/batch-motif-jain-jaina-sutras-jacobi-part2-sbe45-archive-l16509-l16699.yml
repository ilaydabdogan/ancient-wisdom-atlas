canonical_text:
  quote: ''
  summary: The chapter describes punishments endured by sinners in hell for deeds
    committed in former lives. It catalogs bindings, mutilations, burning grounds,
    caldrons, named hells, devouring animals, a mountain, and a river of molten iron,
    then states that former cruelty returns in the Circle of Births and urges the
    wise hearer toward non-violence, renunciation, and self-control.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker announces another kind of perpetual suffering for sinners who
    committed crimes and deeds in former lives.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Punishers bind sinners, cut open their bellies, tear skin from their backs,
    cut off arms, scald mouths, yoke them to a car, and pierce their backs with a
    goad.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sinners are made to walk over burning or slippery red-hot ground and are driven
    forward with arrows, sticks, or other implements.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the intolerable hell, sinners are crushed by falling rocks, and a caldron
    called Santapani is named as a place where evildoers suffer for a long time.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sinners are thrown into caldrons and boiled; they rise again and are eaten
    by devilish crows and other clawed beasts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A smokeless fire in the form of a pile is described; distressed sinners there
    are head downward, lacerated, and cut with iron knives.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: A hell called Samgivani is described as a place where life is long and evil-minded
    men are tortured; tied and skinned sinners are eaten by steel-nebbed birds.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sinners are pierced with sharp pikes and compared to captured pigs being transfixed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A great place is always on fire, with fires burning without fuel; sinners
    are thrust into burning piles and melt like butter in fire.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: In a crowded hot place, sinners are beaten, have backs and skulls broken,
    are split and sawn, tortured with red-hot awls, forced to carry burdens, driven
    over thorny ground, cut into pieces, and thrown about like a bali-sacrifice.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A dreadful mountain called Vaitalika towers high in the air, and evildoers
    are tortured there for more than a thousand hours.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: Punishers crush sinners with hammers and clubs; sinners fall head foremost
    with mangled bodies and vomit blood.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Hungry, savage jackals devour shackled evildoers, and sinners must descend
    one by one into a dreadful slimy river flowing with molten iron.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage states that the sinner’s pains are uninterrupted, that there is
    no escape, and that cruelty done in a former birth is inflicted on the sinner
    in the Circle of Births.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: The wise hearer is instructed not to kill any living being, to believe true
    doctrines, renounce property, know the world, and practice self-control while
    awaiting death.
  category: speech
  evidence_refs:
  - ev:12
