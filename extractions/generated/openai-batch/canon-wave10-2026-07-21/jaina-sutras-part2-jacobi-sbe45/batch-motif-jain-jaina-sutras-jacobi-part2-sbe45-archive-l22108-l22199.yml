  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The first illustration describes a sentient being with five senses and a developed
    internal organ who restricts himself among the six classes of living beings and
    chooses to meet wants by means of earth-bodies in general.
  category: action
  evidence_refs:
  - ev:6
