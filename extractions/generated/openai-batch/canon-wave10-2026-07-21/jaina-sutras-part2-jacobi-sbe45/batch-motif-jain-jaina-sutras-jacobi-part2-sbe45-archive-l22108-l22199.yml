canonical_text:
  quote: ''
  summary: The passage uses the example of a murderer who has resolved to kill when
    opportunity arises, then applies that reasoning to sin, intention, and harm toward
    living beings. An opponent objects that one cannot intend harm toward beings one
    has never known, and the Ācārya says the Venerable One refuted this through illustrations,
    beginning with a sentient being restricting its use of living beings to earth-bodies
    in general.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A murderer who hates a householder, the householder's son, the king, or the
    king's servant resolves to enter the victim's house and kill him when an opportunity
    is found.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage characterizes the murderer with such a resolution as continually
    full of hostility and wrong, wicked, and harmful through cruelty.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Ācārya applies the example to the five cardinal sins, passions such as
    anger, and wrong belief, describing the person as uncontrolled, unresigned, active,
    careless, prone to sin, ignorant, and stolid.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that a fool commits sins even without considering the operations
    of mind, speech, and body and even without seeing a dream.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The analogy is extended from murderous intentions toward a particular human
    target to an ignorant man entertaining cruel intentions toward all sorts of living
    beings.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: An opponent objects that there are many living beings one has never seen,
