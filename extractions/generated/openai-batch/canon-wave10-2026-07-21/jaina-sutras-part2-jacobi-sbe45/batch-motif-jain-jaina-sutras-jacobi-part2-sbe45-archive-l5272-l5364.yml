canonical_text:
  quote: ''
  summary: A Purohita urges young men to live as householders, enjoy wealth and family
    life, and later go to the woods as sages. The young men reject Vedic study, feeding
    Brahmanas, sons, riches, family, and pleasures as means of salvation or religion;
    they describe pleasures as obstacles to liberation and choose to become Sramanas
    who wander for alms. The dialogue includes analogies about fire, milk, oil, and
    the soul, followed by a counterclaim that the soul is formless, eternal, and bound
    by bad qualities. The young men state that they will not repeat their former sinful
    actions and take no delight in household life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Purohita advises the young men to stand at the head of their house, enjoy
    life with their wives, and afterward depart to the woods as sages.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Purohita is described as consumed by a fire of grief and as trying to
    persuade the young men gradually, including by money and desired objects.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young men say that study of the Vedas, feeding Brahmanas, and the birth
    of sons will not save the Purohita.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The young men describe pleasures as brief happiness, long suffering, an obstacle
    to liberation from existence, and a mine of evils.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The young men say that a person who remains attached to pleasures, wealth,
    and anxiety comes to old age and death, and that robbers, glossed in the passage
    as time, drag him away.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Purohita offers great wealth, women, family, and exquisite pleasures for
    the asking.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The young men reject riches, family, and pleasures as useful for religion
    and say that they will become virtuous Sramanas wandering for alms.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A speaker compares the soul produced in the body to fire produced in Arani-wood,
    butter in milk, and oil in sesame seed, and says such things arise and perish
    rather than remain permanent.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The reply states that the soul cannot be apprehended by the senses, has no
    corporeal form, is eternal, and is fettered by bad qualities that cause worldly
    existence.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The young men say that, when they were ignorant of the Law, they did sinful
    actions and were kept from entering the order, but that they will not act that
    way again.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The young men say they take no delight in the life of a householder because
    mankind is harassed and taken hold of while the unfailing ones go by.
  category: speech
  evidence_refs:
  - ev:11
