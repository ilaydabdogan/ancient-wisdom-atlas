canonical_text:
  quote: ''
  summary: The passage instructs a wise or houseless practitioner to recognize impermanence,
    conquer greed, follow the noble path, abstain from sin, prepare for religious
    death, withdraw the senses like a tortoise drawing in its limbs, practice nonviolence,
    non-stealing, truthfulness, restraint, hidden penance, moderation in food, drink,
    and speech, meditation, forbearance, and wandering until liberation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Those who have good places, including heavenly places, must eventually leave
    them, and human relations and friendships are limited in duration.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wise man is instructed to conquer greed and enter a noble path described
    as containing all virtues and as not blamed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A houseless monk should exert himself and abstain from sins whether he knows
    the Law through intuition or instruction.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a wise man knows that the apportioned span of his life is nearing its
    end, he should quickly learn the method of dying a religious death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A tortoise is described as drawing its limbs into its own body, and this is
    used to describe how a wise man should cover sins with meditation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The practitioner should draw in hands, feet, mind, the five organs of sense,
    the effect of bad Karman, and bad use of language.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The virtuous exert themselves toward Liberation and are instructed to live
    calmly, without attachment, and indifferent to personal happiness.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage forbids killing living beings, taking what is not freely given,
    and speaking false or treacherous speech.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A man who guards himself and subdues his senses is said to abhor sins of the
    past, present, and future.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Benighted men of wrong faith, though renowned as heroes, exert themselves
    badly and receive evil consequences, while wise men of right faith, also renowned
    as heroes, exert themselves well and avoid evil consequences.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Penance performed for fame is said to be of no good, while penance unknown
    to others is called meritorious; the practitioner is told not to spread his own
    fame.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A pious man should eat little, drink little, talk little, remain calm, exert
    himself, subdue the senses, and be free from greed.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: A monk should meditate, perform religious practices, abandon his body, treat
    forbearance as paramount, and wander until he obtains liberation.
  category: sequence
  evidence_refs:
  - ev:10
