canonical_text:
  quote: ''
  summary: 'The passage gives rules and verses for a Nirgrantha or chaste monk: he
    should avoid looking at, listening to, conversing with, remembering, or lodging
    near women; avoid rich food, excess food and drink, ornaments, adornment, and
    attachment to pleasant sensory objects; and eat regulated alms for the sustenance
    of life while concentrated in thought.'
  language: English
  quote_policy: summarized
