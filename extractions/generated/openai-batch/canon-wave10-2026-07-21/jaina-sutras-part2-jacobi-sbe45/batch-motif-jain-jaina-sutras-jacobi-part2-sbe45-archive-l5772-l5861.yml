canonical_text:
  quote: "“leaves the house and lives single, he is a true monk.”"
  summary: The passage describes qualities of a true monk, then introduces a discourse
    on ten conditions for perfect chastity. Sudharman says he heard the discourse
    from Mahavira. The venerable Sthaviras are said to have declared conditions by
    which monks may attain self-discipline, Samvara, contemplation, sense-guarding,
    and chastity. The first three conditions prohibit certain sleeping or resting
    places, conversation with women, and sitting with women on the same seat, with
    repeated reasons for avoiding such situations.
  language: English
  quote_policy: quoted
