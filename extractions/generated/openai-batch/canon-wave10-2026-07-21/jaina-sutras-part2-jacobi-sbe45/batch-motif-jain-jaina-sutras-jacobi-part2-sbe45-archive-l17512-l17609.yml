canonical_text:
  quote: ''
  summary: 'A prescriptive Jain passage lists things from which a wise man or monk
    should abstain: bodily adornment and grooming, problematic alms, bodily indulgence,
    greed and harm, lay entanglements, games, forbidden speech, quarrels, possessions,
    use of householder goods, honors, and pleasures. It also instructs the monk to
    use only sustaining food and drink and share a portion, attributes the Law and
    sacred texts to Mahavira, and gives rules for restrained and non-deceptive speech.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Verse 13 says a wise man should abstain from perfumes, wreaths, bathing, cleansing
    of the teeth, property, and actions referring to women.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Verse 14 says a wise man should abstain from alms that have been prepared,
    bought, stolen, brought for the sake of a monk, contain particles of such things,
    or are otherwise unacceptable.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Verse 15 says a wise man should abstain from invigorating food, anointing
    of the eyes, greed, damaging others, washing limbs, and rubbing them with Lédhra-powder.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Verse 16 says a wise man should abstain from deliberating with laymen, praising
    their work, answering their questions, and eating a householder’s meals.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Verse 17 says he should not learn to play chess, should not speak what is
    forbidden by the Law, and should abstain from fights and quarrels; the translator’s
    note says the word rendered chess may refer to a chequered-board game or another
    meaning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Verse 18 says a wise man should abstain from shoes, an umbrella, dice, chowries,
    working for another, and helping each other.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Verse 19 says a monk should not void excrements or urine among plants and
    should not rinse his mouth with distilled water after removing everything endowed
    with life.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Verse 20 says a monk should not eat or drink from a householder’s vessel or
    wear a householder’s clothes, especially if he is a naked monk.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Verse 21 says a wise man should abstain from a stool, bed, or seat in a house,
    from asking for news, and from recollection of past sports.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Verse 22 says a wise man should abstain from fame, glory, renown, honors,
    respectful treatment, and all pleasures in the whole world.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Verse 23 says a monk should be content with food and drink that sustain life
    and should give a portion of it to others.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Verse 24 says the Nirgrantha, the great sage Mahavira, possesses infinite
    knowledge and faith and taught the Law and the sacred texts.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Verse 25 says that in speaking a monk should use as few words as possible,
    should not delight in another’s foibles, should avoid deceiving speech, and should
    answer after reflection.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Verse 26 says one will repent of having used the third kind of speech, that
    a secret should not be made known, and that this is the Nirgrantha’s commandment;
    the note identifies the third kind as speech partly true and partly untrue.
  category: speech
  evidence_refs:
  - ev:14
