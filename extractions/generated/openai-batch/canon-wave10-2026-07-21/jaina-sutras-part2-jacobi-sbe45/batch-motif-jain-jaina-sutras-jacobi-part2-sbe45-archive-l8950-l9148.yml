canonical_text:
  quote: ''
  summary: 'The passage concludes instructions on the Samitis and Guptis, especially
    restraint of mind, speech, and body to avoid sinful harm. It then begins the lecture
    on the true sacrifice: the Brahmana sage Gayaghesha, living as a restrained houseless
    monk, comes to Benares and approaches a sacrifice performed by the Veda-versed
    Brahmana Vigayaghesha after a month-long fast. Refused alms by the priest, Gayaghesha
    remains equanimous and teaches the assembly about what is essential in the Vedas,
    sacrifice, heavenly bodies, and dharma, while redefining the true Brahmana as
    a detached monk rather than a merely ritual or learned priest.'
  language: English
  quote_policy: summarized
