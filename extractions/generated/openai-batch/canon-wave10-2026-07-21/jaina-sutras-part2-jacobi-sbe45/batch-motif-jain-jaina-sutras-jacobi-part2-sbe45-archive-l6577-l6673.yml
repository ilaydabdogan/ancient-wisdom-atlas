canonical_text:
  quote: ''
  summary: Mrgaputra sees a restrained ascetic from his palace, remembers a former
    birth as an ascetic, and asks his parents for permission to enter the order. In
    his speech he rejects pleasures, describes body and human life as impermanent
    and painful, frames Samsara as misery, compares worldly pleasures to poisonous
    fruit, and compares preparation for the next world to taking provisions on a long
    journey. The passage ends with the beginning of a house-on-fire simile.
  language: English
  quote_policy: summarized
