canonical_text:
  quote: ''
  summary: The passage introduces Nalanda near Ragagrzha, the wealthy householder
    Lépa, and his bathing-hall and park. In a garden, Udaka, a Nirgrantha follower
    of Parsva, asks the Venerable Gautama about a point of faith concerning vows to
    renounce injury to movable beings. Udaka argues from the Circle of Births and
    from the possibility of movement between immovable and movable bodies. Gautama
    rejects Udaka's interpretation, says such teachers mislead laypeople and void
    vows, and affirms that killing beings in movable bodies is a sin.
  language: English
  quote_policy: summarized
