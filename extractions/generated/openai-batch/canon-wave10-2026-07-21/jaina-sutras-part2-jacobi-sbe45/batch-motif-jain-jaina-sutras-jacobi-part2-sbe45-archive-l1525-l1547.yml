canonical_text:
  quote: ''
  summary: A scholarly introduction attributes major influence on Mahavira’s doctrines
    to Gosala, son of Makkhali. It reports a Jaina account in which Gosala lived with
    Mahavira as a disciple and ascetic for six years, then separated, founded his
    own Law, and became leader of the Agivikas. It contrasts Buddhist records that
    place him as successor to Nanda Vakkha and Kisa Samkicca in an already established
    monastic order. The author accepts some shared austerities between Mahavira and
    Gosala but questions the Jaina account of their relation. A footnote fragment
    mentions Buddhists in Ceylon retaining the doctrine of Nirvana.
  language: English
  quote_policy: summarized
