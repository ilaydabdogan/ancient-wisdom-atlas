canonical_text:
  quote: Their punishment will be adequate to their deeds.
  summary: 'The passage describes torments in hell inflicted on sinners by cruel punishers:
    roasting by fire, cutting, boiling in blood and filth, mutilation, forced drinking
    of molten metals, and continued suffering. The punishments are connected with
    bad Karman, former-life sins, and atonement for crimes.'
  language: English
  quote_policy: quoted
