canonical_text:
  quote: ''
  summary: The passage recounts Watakwuna’s spirit-guided journey to the Western Ocean,
    the thunderers’ instruction to build the first elm bark canoe, the crossing to
    a gathering of thunderbirds in human form, and the chief thunderer’s gift of a
    war bundle with ritual obligations, war powers, dream powers, weather assistance,
    and images representing his bird-human dual nature.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Spirits appear to the travelers and lure them onward when human strength and
    courage can no longer continue.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The travelers reach the shore of the Western Ocean and pause because they
    do not know how to cross the water.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The thunderers appear again to Watakwuna in a vision and instruct him to build
    an elm bark canoe, described as the first known to humans and the prototype for
    later canoes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Watakwuna, also spelled Wratakwuna in the passage, and seven helpers build,
    launch, and paddle the canoe beyond sight of land while invisible spirits accompany
    and encourage them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At their goal, a great number of thunderbirds in human form are gathered and
    waiting; the chief of the thunderers comes forward to address Watakwuna.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The chief thunderer says he pitied Watakwuna’s fasting and suffering and gives
    him a war bundle to use upon the earth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The war bundle is to be fed and sacrificed to, and is said to protect Watakwuna,
    his children, and his grandchildren if he obeys the chief’s instructions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tobacco is named as the chief offering that will please the war bundle and
    its masters.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The chief lists objects for the bundle, including an egg, powder, a little
    bow, an image of an arrow, a scabbard, birds of the air, and red paint.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The egg and powder are said to enable Watakwuna to set fire to the earth at
    will.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The chief says red paint will please him, put new life into Watakwuna and
    his men, and that enemies slain in war will be food for the chief and the war
    bundle.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The chief instructs Watakwuna to carve and paint images representing him as
    a Great Powered Bird and as a man with a flint-lock gun, and says he can change
    into either bird or man at will.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Thunder-bird-beings are said to come to earth in human form as short, thick-set
    men with strong limbs and bows and arrows, and to be recognized by persons who
    have received power from them in dreams.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The chief grants Watakwuna dream knowledge, forewarning of enemies’ plans,
    knowledge of battle outcomes, and instructions for night fighting.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Before war, Watakwuna is to feast and sacrifice to the war bundle; by calling
    through the sacred things he may receive fog for concealment and lightning and
    hail against enemies.
  category: speech
  evidence_refs:
  - ev:10
