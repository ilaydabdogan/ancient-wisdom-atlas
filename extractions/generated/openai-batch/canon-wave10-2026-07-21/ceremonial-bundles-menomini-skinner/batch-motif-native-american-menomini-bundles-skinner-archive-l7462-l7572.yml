canonical_text:
  quote: ''
  summary: The passage describes a medicine bundle given to Ma'nabus by grandfathers,
    its animal-related and protective medicines, restrictions on ownership and use,
    and a ritual for opening the bundle when a saxkanao prevents successful hunting.
    Men petition the bundle owner with gifts and tobacco; the owner opens the bundle
    in the clean woods, holds a feast, recounts Ma'nabus's acquisition and transmission
    of the bundle, shoots a drawn deer figure with a small bow and arrow to symbolize
    the next day's game, and sings associated songs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bag contains many medicines, each with its own song.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chief medicines are named for deer, wolf, bear, and skunk, with additional
    medicines against saxkanao harm and human enemies.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ma'nabus takes the bundle, learns its uses from the grandfathers, and passes
    it to the Indian people so they may outwit saxkanaowuk and have food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Possession of the bundle is restricted to a few powerful men who receive it
    through fasting and suffering or through a vision; women may not use or touch
    it.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: When a saxkanao is understood to be harming hunting luck and driving game
    away, men bring gifts and tobacco to the bundle owner and ask him to open the
    bundle.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The owner appoints a journey to clean woods, far away from disturbance, where
    the bundle will be opened.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: At the gathering, participants hold a feast of meat, or corn and bean soup,
    or tobacco if nothing else is available; the pipe is passed afterward.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The bundle owner gives a speech explaining how Ma'nabus got the bundle and
    its use to mankind, and states that the feast is eaten in memory of the bundle.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The owner opens a mink skin, takes out a little bow and little arrows fastened
    point-first in red-colored medicine, strings the bow, and shoots a deer figure
    drawn on the ground by his assistant.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The shooting of the deer figure is explicitly said to symbolize the slaying
    of game on the following day.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The bundle owner and assistant use clappers while singing songs associated
    with the bundle ritual.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: One song refers to a bag of leaves and is explained as a way to deceive an
    enemy and arouse the bundle's pride.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Another song says that the singer's parents' fire was in full blaze when he
    was able to sit up; the passage glosses this as referring to Ma'nabus and to his
    powerful parents above and below.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: A later repeated song states that the singer will eat meat tomorrow.
  category: speech
  evidence_refs:
  - ev:14
