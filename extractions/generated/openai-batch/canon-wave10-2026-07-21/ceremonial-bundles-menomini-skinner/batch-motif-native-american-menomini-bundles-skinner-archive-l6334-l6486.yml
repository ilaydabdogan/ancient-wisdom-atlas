canonical_text:
  quote: ''
  summary: 'The passage describes Menomini war-bundle rites: songs declare ritual
    objects powerful through divine power; warriors perform a war dance; scouts locate
    the enemy; a night approach and predawn assault are said to follow thunderer instructions.
    The mikao opens the bundle, sings a sacred war song with deer-hoof rattles that
    is said to deepen enemy sleep, distributes charms or medicines, and remains with
    the bundle while warriors fight. Figure captions identify war powers such as Birds
    of War, a white Porcupine, twin God Boys, Fairies, thunderers, an underground
    spider, herons, and a mink or weasel. The passage also describes scalping, rewards
    from the bundle, and the belief that battle-killed enemies are devoured by the
    sun.'
  language: English; includes transcribed Menominee song lines with English translations.
  quote_policy: summarized
