    rather than a bird but that many associated beliefs, especially the war against
    snakes, were identical.
  claim_level: same_function
  target: Iroquois thunder beliefs and war-against-snakes motif
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The note is brief, secondary, and emphasizes both similarity and difference
    in the form of thunder.
- id: claim:2
  claim: A note reports war clubs with similar data among the Potawatomi and suspected
    similar Ojibway specimens, suggesting a nearby regional parallel for keeping such
    clubs for thunder-related spirit children.
  claim_level: same_function
  target: Potawatomi and Ojibway war-club practices linked to similar data
  evidence_refs:
