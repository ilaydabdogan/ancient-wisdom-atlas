canonical_text:
  quote: ''
  summary: The passage describes a thunderbird-related spirit child born after an
    invisible bird enters a woman, the signs of his supernatural origin, ritual objects
    and treatment required for him, the thunderbirds' relation to war and protective
    imagery, a hierarchy of heavenly birds, an etiological account of the vulture's
    bald and foul-smelling head, and a belief in a metallic cylinder by which fortunate
    dreamers ascend to four wish-granting dignitaries.
