canonical_text:
  quote: ''
  summary: The passage describes Menomini mourning bloodletting, replacement of a
    deceased medicine lodge member through a later medicine dance, rites to send a
    lingering spirit home, burning of certain diseased bodies, beliefs that the dead
    call or petition the living, food offerings to hungry shades, and a 1912 dreamer
    society funeral intended to assure safe passage to the hereafter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shortly after a death, living family members are cut and bled with gashes
    on wrists, knees near the joints, and calves, using a flint.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated purpose of the bloodletting is to draw sorrow from the mourners'
    blood and prevent illness; it is described as a regular part of mourning rites.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the deceased belonged to the medicine lodge, a near relative assumes responsibility
    for seeing that the deceased person's place is filled.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One year after the funeral, preferably in spring, a medicine dance resembling
    initiation is held and usually lasts a day and a night.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the ceremony, members go to the grave with medicine bags, shouting to
    drive the lingering spirit back to its home among the shades, with laughter and
    merrymaking to erase the memory of death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: During this action, participants go out through the west door of the lodge,
    which is otherwise not permitted.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The new person raised to fill the departed person's ceremonial place is addressed
    by the mourner with the kinship term formerly used for the deceased, but the relationship
    is only ceremonial.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The newly elected member must later make a return gift to the sponsor equal
    in value to the gift previously given to the elders, usually with help from relatives.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Formerly, bodies of persons suffering from scrofula or similar diseases were
    burned so that disease-causing worms would be consumed and not attack others.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ear ringing or a sound in the head while still is said to be the souls of
    the dead calling the person to join them, and the person replies that he will
    not come until unable to eat blackberries.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A departed shade may whisper in a survivor's ear asking for food or drink;
    the survivor names the deceased, prepares or hunts food, hosts a feast, makes
    a sacrifice, speaks in memory of the deceased, and deposits portions for the spirit.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: Food left for the shade must not be touched by animals; after its spiritual
    substance is eaten, it may be served to a relative or visitor, and neglected ghost
    requests are said to bring calamity.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: In a 1912 account, a deceased member of the society of dreamers asked fellow
    members to conduct his funeral so proper rites would assure his soul safe passage
    to the hereafter; the members sang, danced quietly, and spoke in undertones to
    a muffled drum.
  category: action
  evidence_refs:
  - ev:12
