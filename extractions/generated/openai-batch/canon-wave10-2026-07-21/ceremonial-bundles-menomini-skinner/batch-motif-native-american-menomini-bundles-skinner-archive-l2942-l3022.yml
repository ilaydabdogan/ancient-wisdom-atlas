canonical_text:
  quote: ''
  summary: The passage describes the importance of night dreams and puberty dreams
    among Menomini and Potawatomi people, including canoe talismans made after drowning
    or rescue dreams, a Seneca example of Hard Hickory's miniature canoe, the sacred
    personal status of puberty dreams, obligations to personal guardians, and examples
    of fasting youths receiving or encountering sacred powers and objects.
  language: English
  quote_policy: summarized
