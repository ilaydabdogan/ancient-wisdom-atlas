canonical_text:
  quote: "“Never speak ill of anything you see, it may be a manitou,”"
  summary: The passage describes Menomini beliefs and practices concerning protected
    children, ritual remedy for a child offended by mistreatment, a feast with tobacco
    to repair the injury, moral and physical training of children, preparation for
    the dream fast, rules about punishment, and frightening devices used to quiet
    children. Footnotes add comparative ethnographic notes about infant moccasin perforation
    beliefs and similar child-training customs among other Indigenous groups.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Children under the protection of gods are not to be scolded until well grown,
    because they may become offended and go back to their friends or relations.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a child becomes ill from such mistreatment, the parents consult a seer,
    who accepts tobacco, hears their story, sleeps over the matter, and reports his
    finding the next day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The seer explains that the child has been abused, that its guardians are calling
    it back, and that the remedy is a feast of game for old people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the feast, sacrificial tobacco is placed on the west or east side of the
    lodge according to the quarter where the child’s guardians dwell.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The feast must be held in the baby’s presence, and the guests need not consume
    all the food set before them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: A notable person present is asked to speak, explaining who the child is and
    that the gathering is meant to rub out the injury done to the child; the guests
    answer together.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Children are trained to respect the aged and reverence the powers of nature;
    a proverb warns not to speak ill of anything seen because it may be a manitou.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: At about age six, a boy’s physical training includes bathing in icy water
    before eating, sometimes plunging naked through a hole in river ice, returning
    bare, running, and then being called before the fire for explanation; girls receive
    similar treatment in a less violent way.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Until shortly before age fifteen, children undergo tests, including going
    without food for two or three days in preparation for the dream fast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Children are denied soup and salt, and are required to sleep doubled up, based
    on stated beliefs about bodily strength, tendons, and old age.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Children are not struck until age eight; later they may be whipped with a
    pack strap, while ear-pulling and head-striking are described as harmful.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Small children may be scolded, have water thrown in their faces, be ducked
    if crying at night, or be frightened with warnings about an owl stealing them
    or with an image.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A footnote states that a belief concerning perforation of infants’ moccasins
    is also found among several named Indigenous groups.
  category: other
  evidence_refs:
  - ev:7
- id: obs:14
  text: A footnote states that similar accounts of child training are reported for
    Sauk and Fox, Seneca and other eastern tribes, and Ojibway or Mississauga, and
    suggests the practice was widespread in the Woodlands.
  category: other
  evidence_refs:
  - ev:8
