canonical_text:
  quote: ''
  summary: The passage compares Menomini war-bundle customs with Winnebago, Iowa,
    Sauk, Fox, Oto, Omaha, Dakota, Iroquois, Delaware, and Cree evidence; describes
    an Iowa pre-war sacred-bag rite; summarizes regional war-bundle patterns, ceremonial
    cannibalism comparisons, Sauk bundle-origin differences, and introduces Menomini
    hunting magic and medicine bundles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the Winnebago have several parallels to Menomini war customs,
    but that their sacred-bundle origin legend differs because the thunderers gave
    the bundles themselves rather than acting as intermediaries for stronger powers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Iowa account, one or two days before a war party departed, the man
    who was to carry the sacred bag hid it while others prepared sacred articles or
    personal fetishes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Iowa account, deer were brought in and eaten, and the warriors painted
    themselves as if expecting to see an enemy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Iowa account, participants measured steps, knelt, pulled away grass
    and sticks while moving backward to poles, and then rose.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Iowa account, each participant placed sacred objects before himself,
    sang, opened the objects, asked for good luck, and sang again while replacing
    them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage identifies a Central group war-bundle type exemplified by the
    Menomini, Sauk, Fox, Iowa, Oto, and Winnebago, while noting related or vestigial
    evidence in other nearby groups.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says that among the Teton-Dakota, if a man dreams of a thunderbird
    he must go on the warpath.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that ceremonial cannibalism similar to the Menomini type
    is reported for several North American peoples, including eating hearts or flesh
    of enemies or slain foes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says Sauk war bundles are derived from multiple sources, including
    the Buffalo, and that Sauk origin myths for the war bundle differ from Menomini
    origin myths.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Sauk comparison, origin beings give only a small part at a time, and
    the owner gathers contents bit by bit through repeated fasting and revelation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In contrast with the Sauk comparison, the passage says Menomini bundles were
    given all at once and already prepared.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage states that a Sauk bundle ceremony includes an eating race between
    members of two phratries.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Menomini are said to use traps and snares as well as sympathetic and contagious
    magic to secure game, using charms, powders, mystic formulae, and medicine bundles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Menomini hunting medicines are grouped as private medicines used for the owner’s
    personal benefit and public medicines that are privately owned but used for public
    benefit through an elaborate attended ritual.
  category: relationship
  evidence_refs:
  - ev:7
