canonical_text:
  quote: ''
  summary: The passage describes Menomini ritual and recreational games, including
    shinney, bowl-and-dice, cup-and-pin, and moccasin games. It explains how some
    games are performed to appease sky guardian sisters, restore health, fulfill seer
    prescriptions, or keep a deceased person’s spirit content. It also describes game
    objects, scoring, directional seating, and dice forms modeled on powerful beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sick female sponsor says she will give tobacco and have a game performed
    because she has neglected her guardians, the sacred sisters of the eastern sky,
    and hopes they will forgive her and make her well.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The female sponsor takes her position on the east side of the field, where
    her guardians dwell, and does not play in a game she gives herself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the shinney game, a double ball is thrown up between posts, players try
    to catch it with sticks and move it to the opposite goal, and the first side to
    score four goals wins prizes supplied by the hostess.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A girl under the guardianship of the sacred sisters of the southern sky has
    similar obligations, but the southern sisters are more commonly associated with
    the bowl-and-dice game.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the bowl-and-dice game, the hostess sits south of the contestants, and
    the first throw is decided by a knife toss in which captains call sides.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bowl-and-dice play involves throwing the bowl contents, continuing while counts
    are made, and using sticks to count toward a game total of fifty.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: There are eight dice corresponding to the number of the sisters of the southern
    sky; six are round, one is usually crescent-shaped as the moon, and one is usually
    shaped like a mud-turtle.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The moon and mud-turtle forms are chosen because they are regarded as powerful
    manitous; dice may be made of wood or bone, colored on one side, and sometimes
    carved as moons, turtles, or thunderers.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The cup-and-pin game was formerly common but is said to have gone out of date
    partly because keeping one in the lodge is believed to bring starvation, since
    it once had use as a hunting charm.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The cup-and-pin game uses bone units, a perforated buckskin tail, and a bone
    pin; catches have point values and the game can be played for fun or wagers.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Seers often prescribed the cup-and-pin game for ailing children, who then
    had to make it and sometimes play it to secure good health and happiness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The moccasin game is played near a deceased person’s grave to keep the spirit
    or ghost amused and contented so that it will not disturb the living.
  category: action
  evidence_refs:
  - ev:7
