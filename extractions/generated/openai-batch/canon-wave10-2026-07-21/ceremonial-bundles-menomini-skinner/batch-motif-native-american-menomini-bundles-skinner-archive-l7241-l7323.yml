canonical_text:
  quote: ''
  summary: The passage describes Menomini small private medicines and charms, comparative
    notes on war-bundle practices among Menomini and neighboring peoples, and Menomini
    hunting medicines. It classifies hunting bundles, says some were handed down from
    gods through Ma'nabus and Naxpatao, describes hunting success as dependent on
    supernatural aid, explains failed hunts through sorcery and theft of medicine
    in owl form, distinguishes public and private medicines, and names Misasakiwis
    as the greatest bundle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Small private medicines are said to derive chiefly from dreams; some have
    practical value as scents or lures, but their chief efficacy is thought to lie
    in accompanying songs and formulae.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Small charms are also described as being used to procure luck in gambling,
    begging, and similar activities; the author states that the underlying concepts
    of such charms are probably widespread in North America.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage compares Menomini and Sauk war-bundle practices, including restrictions
    on women near Menomini bundles, a Sauk bundle usable in the presence of menstruating
    females, different feast-eating rules, different ceremony organization, and bundle
    storage practices.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says a Menomini mikao's nephew could carry the war bundle, a Shawnee
    carrier was appointed from the turtle totem, Iowa and Menomini did not place the
    bundle on the ground, and Iowa held a spring bundle ceremony at the first thunder
    as Menomini did.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Potawatomi Wabano war bundle is described as differing from Menomini bundles
    in contents; it is kept by the Bear totem, is a gift of the Underneath Gods, gives
    prominence to the Thunder Power, and has no dog-eating feast.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Osage and Kansa bundles are said not to have been investigated but to seem
    distinct in contents, legends, and rituals from several other regional bundle
    traditions.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'Large true hunting medicine bundles are divided into two sorts: bundles of
    magical composition handed down from gods to humans through Ma''nabus and Naxpatao,
    and bundles centered on an actual lure or scent with accumulated accessory charms.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Trappers are said to use medicines to draw animals to snares, and Menomini
    are said to believe animals have intelligence almost equal to humans and are captured
    because humans are more fortunate.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Menomini hunters are described as appeasing supernatural powers so that friendly
    aid continues; the passage says hunting skill is useless without assistance from
    above.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: An unsuccessful hunt may be explained as the result of a covetous Saxkanao
    or sorcerer, in owl shape, stealing the hunter's medicine or learning and diverting
    the source of supernatural aid.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage divides hunting medicines into public communal bundles and private
    individual charms, and names Misasakiwis as the greatest of the few public medicine
    bundles.
  category: object
  evidence_refs:
  - ev:10
