canonical_text:
  quote: ''
  summary: The passage compares Menomini burial customs with Winnebago and other regional
    practices. It describes shared corpse arrangement, red paint on the corpse's face
    as a sign of happiness in moving to another sphere, stepping over the grave to
    confuse the ghost, removal of the corpse through the rear of the lodge, absence
    of a Menomini four-day wake, warriors counting coups at the grave post, and regional
    parallels extending westward.
  language: English
  quote_policy: summarized
