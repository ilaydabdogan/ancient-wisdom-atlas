canonical_text:
  quote: ''
  summary: The passage describes Menomini marriage customs as derived from Ma'nabus,
    including rare love matches, arranged proposals by relatives, transfers of gifts
    and return gifts, lectures and feasts, plural marriage and widower replacement
    customs, sanctions for adultery, divorce procedures including a dream dance blanket
    rite, and the Ma'nabus blanket, a sacred perforated buckskin robe connected with
    a taboo against male-female skin contact.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Menomini marriage customs are said to derive directly from Ma'nabus, who instructed
    the forefathers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Love matches are described as very rare, with most unions decided by old people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In one courtship account, a youth goes at night to his sweetheart's lodge,
    usually with a companion who waits outside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the youth is rejected, he leaves and the companion may try; if accepted,
    he spends the night and the woman later announces the engagement to her parents.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Young men who had intercourse with a virgin are said to have composed and
    sung boasting songs naming her before other young men.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: When a young man reaches about eighteen or twenty, his parents or oldest female
    relatives may decide that he should marry, sometimes without informing him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The young man's relatives choose a suitable girl and visit her parents; the
    mother speaks for the proposal.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The proposal is phrased as a request to become related and to have the daughter
    for the son.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: If the girl's parents refuse, the passage says the young man's parents are
    believed likely to hire a witch against them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The young man's parents provide clothing for the girl and gifts such as maple
    sugar, wild rice, mats, and other goods for her parents.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the gifts are delivered, the girl comes to live with the young man that
    night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The couple are lectured by their parents; after ten days the groom's father
    gives a feast for the bride's relatives, and within a year the bride's parents
    make return presents of equal value.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The marriage proposal may occasionally be reversed, with the girl's parents
    asking the youth's parents for him.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: If the couple do not agree, they may separate at will.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Plurality of wives was formerly allowed, but the passage says the custom giving
    a man first right to younger sisters after marrying the eldest was not observed.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: If a man's wife dies, her parents may ask one of her sisters to take the deceased
    sister's place after mourning ends.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Adultery by a woman was formerly punished by her husband with death, and her
    paramour might also be killed if caught in the act; sometimes the woman's life
    was spared but her nose was cut off.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: Adultery was often condoned until it became a public scandal, after which
    divorce might occur.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: In one divorce procedure, a man leaves taking only his gun; later the boys
    go with the man, the girls with the woman, and the woman retains household property.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:20
  text: A rarer divorce method occurs through the dream dance, where the man dances
    in a new blanket and publicly casts it away to signify throwing away his wife.
  category: action
  evidence_refs:
  - ev:10
- id: obs:21
  text: If the man takes the wife back after the dream dance blanket rite, the passage
    says this offends the drum and he will die.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:22
  text: The Ma'nabus blanket is described as a large buckskin with a single perforation,
    prepared to cover the woman because of a taboo against contact between male and
    female skin.
  category: object
  evidence_refs:
  - ev:11
- id: obs:23
  text: Certain people in each band receive through dreams the right to possess these
    robes; the skins are painted, ornamented, kept as sacred articles, and rented
    to users.
  category: relationship
  evidence_refs:
  - ev:12
