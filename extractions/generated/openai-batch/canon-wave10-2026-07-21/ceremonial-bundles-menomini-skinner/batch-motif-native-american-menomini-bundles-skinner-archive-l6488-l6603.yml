canonical_text:
  quote: ''
  summary: The passage describes wartime decoy and signaling practices, care for slain
    warriors, treatment of scalps, return ceremonies centered on the war bundle, public
    honors for brave men, brave songs, a scalp dance, and footnote comparisons with
    some nearby tribal practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Small war parties used bird images or stuffed bird skins, animated with cords
    and accompanied by imitated bird cries, to draw enemies into ambush.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An enemy war party imitated a crane by raising a deer leg above grass, moving
    loosened sinews, and counterfeiting crane calls; Menomini scouts discovered the
    deception.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: War-party members signaled to one another with whip-poor-will calls or wolf
    howls, and prisoners being led away could break twigs or leave other signs for
    their own people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among the Menomini it was considered honorable to drag their own slain from
    the battlefield so they would not be scalped by the enemy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Returning warriors stretched scalps on hoops, dried them in the sun, and rubbed
    a noxious medicine from the bundle on the inner surface of the scalps.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The medicine applied to a scalp was said to cause a scalped person who still
    lived to die, regardless of distance.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: As the returning party neared the village, the people came out to meet them
    with rejoicing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the place of earlier outward-journey ceremonies, a scalp dance was performed
    to proclaim the miraculous power of the war bundle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the bough lodge, the mikao announced victory, recited brave deeds, and
    named the heroes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Some men could have their names changed by council action, and others received
    the right to wear an eagle feather as a bravery insignia after killing an enemy.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A well-wisher could give a brave man new clothes and declare that he would
    always be brave because he was dressed in clothes of thunder power.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: A brave song asks how the singer’s drum sounds to his comrade and ends with
    four whoops.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: In the scalp dance, trophies were hung from short sticks; a warrior seized
    a scalp wand, sang his victory song, related his achievement, and reenacted the
    scene.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: A typical scalp-dance song states that the singer’s life and power are as
    fire, with the parenthetical note that this was given from the bundle.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: A figure caption identifies deer-hoof rattles from a war bundle, with sticks
    carved to represent the thunderers.
  category: object
  evidence_refs:
  - ev:13
