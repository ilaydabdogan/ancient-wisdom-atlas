canonical_text:
  quote: ''
  summary: The passage gives a Menomini hunting-medicine origin narrative in which
    a fasting youth meets an underground panther at a secluded lake, offers tobacco,
    receives a stone and roots for a powerful medicine, and then kills a bear. It
    then introduces another hunting-medicine origin myth, attributed to Sophia Pecore,
    in which a mother repeatedly threatens to give her crying little girl to the owls;
    the Great Birds Above and Owl hear this, and when the mother throws the child
    outside, Owl secretly takes her away. The passage also includes an authorial comparison
    to Plains medicine-origin myths and a footnote about Huron white-panther shamanistic
    aid.
  language: English
  quote_policy: summarized
