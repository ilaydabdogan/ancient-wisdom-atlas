  summary: The passage describes Menomini thunderer birchbark records and songs, tobacco
    offerings connected with their exhibition and hunting, Wickano's weather powers
    and visionary instruction, named thunderbird hierarchy in the western heavens,
    seasonal thunderstorm explanations, and thunderers protecting people by hunting
    underworld snakes.
