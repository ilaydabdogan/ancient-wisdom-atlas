canonical_text:
  quote: ''
  summary: Sekatcokemau sends a bear messenger to summon animal beings to a council.
    On the way, Wolf is carried across Lake Michigan by speaking water or a wave and
    promises a lasting totemic partnership. Black Bear crosses with help from Bald
    Eagle through a temporary exchange of body parts and promises brotherhood. At
    the council Sekatcokemau proposes that the animals change form and become Menomini
    Indians. The passage then identifies the original animals as ancestors of the
    dominant subgentes and explains linked gentes through these traditional pacts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sekatcokemau identifies a naked bear servant, furred only on head and feet,
    as the messenger of the earth who will carry news for him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bear messenger is sent on his rounds and finds invited guests at their
    homes, including Awase the black bear at Mackinaw and Kwutatcia the crane in a
    marsh on the Wisconsin River.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wolf comes to the shore of Lake Michigan at Green Bay and pauses because he
    does not know how to cross and dislikes swimming.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The water speaks to Wolf, offers to take him over on its back, and a wave
    upholds and ferries him across.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After crossing, Wolf thanks the water or wave and promises partnership, shared
    totems, and descendants bearing the wave name; the passage states that wolf and
    wave subgentes later head a gens together.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Black Bear cannot cross Lake Michigan, and Pinasiu the bald eagle offers one
    of his wings in exchange for one of Bear's forelegs so Bear can cross.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bear crosses, returns the borrowed wing, thanks Bald Eagle, and says they
    will always be brothers; the passage states that black bear and bald eagle form
    linked gentes with clan names commemorating the event.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the council the guests sit and smoke before Sekatcokemau says they are
    of animal nature and proposes that they change forms and exist as Menomini human
    beings.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The animals approve, return home, gather their families, choose future residences,
    and become men, the ancestors of the Oma'nomaneo.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage lists the original ten animals invited to the feast as ancestors
    of the dominant subgentes of the ten Menomini gentes, with Sekatcokemau identified
    as the royal gens.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A note states that members of linked gentes may claim one or both ancestors
    as totems because of the traditional pact made by them.
  category: relationship
  evidence_refs:
  - ev:6
