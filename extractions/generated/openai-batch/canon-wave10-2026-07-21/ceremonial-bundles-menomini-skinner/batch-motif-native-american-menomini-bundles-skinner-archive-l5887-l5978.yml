canonical_text:
  quote: ''
  summary: The chief Thunderbird-being instructs Watakwuna in the use, care, taboos,
    sacrifices, and rewards associated with a war bundle. The bundle empowers stealth,
    protection, war medicines, attack, healing, and ritual thanks to the thunderers.
    Watakwuna and his followers are fed sturgeon on the islet, depart by canoe over
    calm water, return safely with abundant food, and bring the war bundle tradition
    to their people. The ethnographic passage then notes Museum examples of such sacred
    bundles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says the war bundle will be used to seek an enemy at night, approach
    with snake-like stealth, and encircle the enemy village.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each warrior is instructed to carry an image of a medicine bird and wear a
    single quill feather in his hair.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The hummingbird and the sharp edge of a knife blade are used as comparisons
    for the warriors' protection from being hit or struck.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sacred roots in the bundle are to be made into incense, chewed, carried in
    the mouth, and sprayed with saliva on the warriors to help them elude enemy sight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The attack begins after surrounding the village and signaling on a war whistle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tomahawks and war clubs are described as kept in powerful medicine until saturated.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Taking a scalp includes licking fresh blood from it as a sign that the enemy
    are devoured on behalf of the thunderers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After fighting, a ceremony with dancing, thanks to the thunderers, and songs
    for the scalps is prescribed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The war bundle is to be respected, tied with string, hung outside the house
    in a place by itself, and kept away from women, maidens at puberty, and menstruating
    women.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The bundle is not to be opened casually; it may be opened in peril, during
    spring or fall sacrifice, or in accidental injury to use roots to stop bleeding,
    with tobacco payment to the thunderers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The chief Thunderbird-being orders that a bead pack strap or belt be made
    and kept in the bundle as an honor for a warrior who kills an enemy chief or leader.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Servants of the thunderer bring, cook, and serve sturgeon to Watakwuna and
    his followers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The chief of the thunderers says the thunderers do not eat sturgeon but feed
    on horned snakes and evil monsters of the underworld.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Watakwuna and his followers leave the islet by canoe, find the water calm
    and the sun bright, and safely reach the shore.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: On the overland return journey, food is abundant and game falls dead before
    them without use of bows because of the power of the war bundles.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: Watakwuna and his followers return to their people, recount the venture, and
    the war bundle is said to remain among humans with powers granted to the worthy
    in dreams.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: The ethnographic narrator states that the Museum collection contains eight
    sacred bundles and rituals, and that these bundles contain skins of sacred birds.
  category: object
  evidence_refs:
  - ev:13
