canonical_text:
  quote: ''
  summary: The passage describes Menomini bear-bundle information attributed to Nakuti,
    including its inheritance, supernatural donors, use as a war bundle, a feast and
    singing ceremony after a bear kill, and songs to thunderers, a northern giant,
    and crow. It then describes private hunting medicine in a three-weasel-skin amulet,
    its secret contents and provenance, and an image-based rite in which a target
    figure is drawn on the ground, treated with red medicine, and shot in the heart
    with a miniature arrow to secure game or harm an enemy. A quoted Tanner account
    is introduced as an Ojibway comparison for a similar medicine-hunt and image-puncturing
    practice.
  language: English
  quote_policy: summarized
