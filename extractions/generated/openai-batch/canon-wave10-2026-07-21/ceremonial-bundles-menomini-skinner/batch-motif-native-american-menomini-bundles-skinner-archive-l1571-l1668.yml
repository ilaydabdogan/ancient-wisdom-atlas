canonical_text:
  quote: ''
  summary: 'Ethnographic account of a Menomini procedure after murder: the offender’s
    kin gather a blood offering and summon a pipe holder; the parties meet at the
    victim’s lodge; a peace pipe is ritually lit and offered. Acceptance pardons the
    murderer and restores relations, while refusal leads to further negotiation and
    possible death liability.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After committing murder, the criminal flees to his father or nearest relative
    and explains the situation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The offender’s father calls on relatives to collect presents, always including
    a pony, as a blood offering to the victim’s family.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Word is sent to a Sakanahowao, described as a pipe holder, who gets out sacred
    regalia.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Sakanahowao, a Nanawetau, the offender’s family, and the culprit as a
    semi-prisoner proceed to the lodge of the deceased.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The victim’s family waits in the lodge with a Nanawetau as representative;
    the offender’s party sits near the door or outside.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The murderer stands stripped in the center of the lodge with his face painted
    black.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: One informant says the black color denotes that the murderer is in the shadow
    of death.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The murderer’s brother stands beside him and is also liable to the death penalty
    if the pipe is refused.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Presents and a conspicuously displayed pony bridle are placed in the center
    of the floor, with the peace pipe laid on top.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: A Nanawetau fills the pipe and lights it with flint and steel; the first spark
    igniting the punk is read as auspicious, while failure foretells trouble.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The attendant does not blow on the pipe or put it in his mouth; he swings
    the pipe stem in a circular motion so the fire takes hold by itself.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Sakanahowao says the offender’s side has come with the pipe of peace to
    seek acceptance under an old rule and to prevent further bloodshed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Sakanahowao offers the mouthpiece first to the father or closest relative
    of the dead man, then passes it from east to west following the sun’s course.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: If the relative accepts, he takes the pipe weeping; the pipe bearer places
    his badge of authority on the acceptor’s neck.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: After acceptance, the culprit is told he has been pardoned by means of the
    badge and is now brother to the victim’s relatives.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: The relative wears the badge four days; afterward the servant returns it,
    washes the black from the murderer’s face, and frees him with advice.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: The relative who accepted the pipe is said to have control over the murderer’s
    soul and to be able to have it care for his own soul on the death journey.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:18
  text: If the aggrieved party rejects the pipe, they turn away their heads as the
    pipe is offered.
  category: action
  evidence_refs:
  - ev:9
- id: obs:19
  text: After refusal, the Sakanahowao lays the pipe across the presents again and
    representatives argue over how to resolve the matter and assign blame.
  category: sequence
  evidence_refs:
  - ev:9
