canonical_text:
  quote: give him a mighty charm that he might pass on to the people to help and save
    them
  summary: Ma'nabus is distressed because people suffer starvation and hostile medicine
    men spoil hunting. Supernatural grandfathers and grandmothers give him a hunting
    charm or bundle for the people. Beaver, weasel, mink, and a bird ask to enter
    or contribute to the bundle, bringing skins, medicine-holding functions, hunting
    power, songs, and swiftness.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Ma'nabus is troubled on behalf of the men and women of the world because they
    are subject to starvation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wicked medicine men called saxkanaowuk are befriended by the horned owl and
    plague the people while moving about in the guise of guardian owls.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The saxkanaowuk interfere with hunting by stealing luck, driving away deer,
    bewitching traps, and replacing lead pellets with shadowy spirit bullets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The powers above, called the grandfathers and grandmothers of the Indians,
    decide to give Ma'nabus a mighty charm to pass on to the people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The illustrated Great Hunting Medicine includes a bag and items such as tapping
    sticks, a magic wolf-skin turban, weasel skins, bow and arrows, a fiber-string
    bag, and a mink skin for a tiny bow and arrow.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A little beaver across the great water knows by telepathy that the bundle
    is being given to Ma'nabus and swims toward the place without leaving wave or
    ripple.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The little beaver sings to Ma'nabus, offers his skin to be in the bundle to
    hold medicines, and is accepted by Ma'nabus.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The weasels are described as mighty hunters; one says he will enter a deer
    through its mouth and pass out the rectum, killing it through the vitals, and
    Ma'nabus places weasel skin in the bundle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The mink is described as a mighty hunter who quickly returns with food; he
    asks to hold the tiny bow and arrows and their medicine, sings that he will fetch
    game, and is admitted to the bundle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A bird asks to enter the bundle, and Ma'nabus permits him so that he may give
    the people power to fly swiftly from place to place while hunting.
  category: action
  evidence_refs:
  - ev:8
