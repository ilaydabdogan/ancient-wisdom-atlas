canonical_text:
  quote: ''
  summary: 'The passage describes Menomini puberty dream-fasting by youths and maidens:
    solitary fasting in a small lodge, abstention from food and water, blackened face,
    prayer for a supernatural vision, parental monitoring, a choice between food and
    charcoal, interpretation of visions from above versus on or below the earth, guardian
    powers and medicine objects, girls'' fasting and menstruation-related fasting,
    comparative ethnographic notes, and one adult renewal fast after an incomplete
    early dream.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A youth or maiden around age fifteen withdraws to a secluded place, builds
    a tiny one-person wigwam, and fasts for eight to ten days according to strength
    and endurance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the fast no food or water is taken, and the faster's face is blackened
    to denote sadness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The faster prays and wishes for a supernatural vision while keeping the mind
    on things above the earth in the heavens.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Pebbles or bullets are placed under the tongue to stimulate saliva and prevent
    the mouth from becoming too dry.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The faster sees and speaks to no one except parents, who visit daily and ask
    whether a vision has occurred.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: If no vision has occurred by the eighth day, the parents present bowls of
    charcoal and food and tell the faster to eat and stop fasting or take charcoal
    and continue.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Taking the food ends the fast; taking the charcoal is treated as noble, and
    the faster paints the face with it and fasts longer.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After a vision occurs, the parents give the faster food and ask whether the
    vision concerned things on high, on the earth, or below it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Visions of things on high, including the sun, moon, stars, thunder birds,
    or powerful heavenly birds, are described as good omens and may promise boons
    and guardianship.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: In extraordinary cases a guardian gives a small living thing, such as a sturgeon,
    minnow, mud-turtle, or animal, to be placed in the dreamer's body, where it lives
    and makes the person strong.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Objects may be given to the faster for a medicine bag, and the medicine bag
    itself is later given by elders at initiation into the Mitawin.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: For a girl, dreaming of things on high is said to mean long life, happiness,
    virtue, and perhaps social elevation; one example includes a large fat man, the
    sun, a red waist, and eight virgins in the east.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: Girls usually fast during their first monthly terms, and the writer reports
    finding two girls fasting under those circumstances in a forest lodge on the Menomini
    Reserve.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Dreams of something below the skies, on the earth, or under the earth are
    treated by the parents as useless or evil; the dreamer is told to break the fast
    and try again, though a third recurrence must be accepted.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: A middle-aged man whose four children died before maturity was permitted to
    fast again because his early dream was incomplete, and he obtained a further vision.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: The passage includes comparative notes on Iroquois, Potawatomi, Central Algonkin,
    and Eastern Cree customs related to fasting, girls' fasting, and dream disclosure.
  category: other
  evidence_refs:
  - ev:10
