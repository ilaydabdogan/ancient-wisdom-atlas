canonical_text:
  quote: ''
  summary: 'The passage describes Menomini burial customs: death is treated as departure
    to the spirit abode; the body is dressed, painted, watched over with songs, and
    given goods; the corpse is taken from the house through a window or side opening
    to confuse the ghost; mourners hold a feast in which the unseen soul is thought
    to participate; a widow receives a lock of hair and keeps garments as a temporary
    representation of her husband; and a close relative steps over the grave and flees
    to keep the spirit from following. Footnotes compare some customs with neighboring
    or cited traditions and mention a Ma''nabus-Naxpatao account of permanent death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Death is described as the last great event in a Menomini career and as a departure
    from earth to the abode of spirits.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Relatives move the dead person from the place of death, dress the body in
    cherished finery, and carry the person's other effects outside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The face of the dead person is painted with vermilion; different markings
    are described for men and women, and red is said to signify happiness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Old people, seers, prophets, and medicine persons are invited to the wake;
    guests camp near the deceased's lodge and sing death songs at night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: For an adult, death songs are accompanied by rattle and drum; for a child,
    only one instrument is used because the combined noise is said to disturb the
    child's spirit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the third day, female relatives place calico, tobacco, other goods, and
    the departed person's medicine bag near the head of the corpse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The body is taken from the lodge through a window, or formerly through a hole
    in the wigwam wall, rather than through the door, so that the ghost will be confused
    and unable to return to the house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the cemetery, mourners and guests eat the feast of the dead, and the soul
    of the deceased is supposed to join the meal unseen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: All food set before the guests must be consumed, and bones must not be given
    to dogs or cats because this is considered irreverent.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Warriors smoke in honor of the dead before the body is carried to the grave.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The widow places new clothes beside the grave, receives a lock of hair cut
    from the dead man's head, wraps it in the garments, and takes them home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The widow keeps the garments in her bed for a year or until mourning ends,
    calls them her husband, talks to them, and offers them food, drink, and tobacco.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: When the corpse is lowered into the grave, the nearest relative steps over
    the grave and quickly leaves through the woods so that the spirit will be confused
    and unable to follow the mourner home.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: A footnote states that before the death of Naxpatao, brother of Ma'nabus,
    humans and animals came to life on the fourth day, and that Ma'nabus's refusal
    to receive his slain brother caused death to be unending.
  category: sequence
  evidence_refs:
  - ev:10
