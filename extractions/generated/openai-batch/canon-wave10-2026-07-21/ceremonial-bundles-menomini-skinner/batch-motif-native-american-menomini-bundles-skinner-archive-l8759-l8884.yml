canonical_text:
  quote: ''
  summary: The passage describes a birchbark record for a medicine doll, including
    the medicine lodge, Mitawuk session, chants to a female spirit of good fortune,
    and ritual images associated with harm to enemies. It then describes a good-luck
    bundle attributed to the powers below, gives a Potawatomi youth's dream-origin
    story for receiving the bundle and later medicines from underground powers, and
    lists the bundle's contents, offerings, and procedure for requesting desired goods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The birchbark record shows the mitawikomik or medicine lodge, attendant priests,
    figures representing the Mitawuk in session, and an enclosure representing a cross
    section of the lodge and the speeches of the Mitawuk.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A female spirit of good fortune controlled by the guardian doll is shown,
