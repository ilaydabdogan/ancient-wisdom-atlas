- id: obs:8
  text: A Potawatomi youth received a sacred-dream promise of assistance from the
    powers below and a future present at a place he would recognize.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: While returning across Lake Michigan, the youth recognized a rock in the water
    as the promised place, had his companions leave him there, received the good-luck
    bundle, and was told not to open it until he was older.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The youth was miraculously transported home and was already there when his
    companions arrived.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At a high bluff on Lake Winnebago, the youth sprayed medicine from his mouth
    onto the rock, the rock opened, and he entered a storehouse of the underground
    powers, where he chose medicines with songs and formulae.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The youth later sacrificed to the powers below by pouring whiskey into the
    earth and burying goods, and he was rewarded with permission to visit another
    rock hoard.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The bundle contains a chief, a dressed wooden doll with real and imitation
