canonical_text:
  quote: ''
  summary: The passage describes Menomini ceremonial-bundle practices involving tobacco
    offerings to thunderers and manitous, war summons by tobacco and red-painted wampum,
    visionary instruction from the sun to use a war bundle, preparation of a war party,
    ritual handling of the bundle by the mikao, pipe offerings for spirits, prayer
    to thunderbirds for power against enemies, and a dog offering with tobacco and
    song. Captions within the passage identify thunderers aiding Menomini, defeated
    enemies, warriors in a scalp dance, a thanks offering, and a war chief possessed
    by thunder.
  language: English
  quote_policy: summarized
