canonical_text:
  quote: ''
  summary: The passage describes a Menomini public hunting medicine bundle attributed
    to Ma/nabus, activated in times of food scarcity through tobacco offerings, songs
    to wolf, owl, buck, and doe, smudging, dance, a hunt, a ceremonial feast, fumigation
    and division of meat, and protective use of smudge medicine against a potential
    thief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ma/nabus makes a small powerful medicine after bringing wolf and deer into
    partnership, and it is to be kept by worthy older men until starvation threatens.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When food shortage becomes severe, neighbors decide to bring tobacco to the
    bundle owner and ask him to use the bundle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bundle owner leads the party into the woods with the bundle and does not
    allow anyone to go ahead of him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: At camp, the bundle owner takes the bundle to a clean place in the woods toward
    the intended hunting direction and hangs it there.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The owner opens the bundle with a tobacco offering, spreads out its contents,
    gives a speech, shakes a deer-hoof rattle, and begins to sing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The songs name the wolf as powerful and the owl as powerful and able to see
    all things.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Other songs express desire for a fat buck in the fall and for a fat doe.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: During the songs, ordinary members of the party dance while acting out the
    slaying of deer.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The next morning, the owner wraps a small portion of medicine in a rag for
    each hunter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The owner burns mixed medicine as incense in a skillet and carries it around
    camp so that smoke blows toward the intended hunting direction.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: 'Two scaffolds are erected: one for edible venison and another for the head,
    lungs, legs, and neck, which are described as the parts most affected by the medicine.'
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The owner smudges rifles, a pack strap, knives, and other utensils connected
    with the deer hunt.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: During the hunt the owner sings the previous songs to please the animals so
    they will grant power.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: On the first evening, untabooed meat is eaten ceremonially in honor of the
    wolf and the owl, and the ritual is repeated for four days except for the feast.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The owner fumigates the meat with incense and fire, then divides the meat
    equally among his followers.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: Smudge medicine is thrown into the fire to blind any Saxkaniio who approaches;
