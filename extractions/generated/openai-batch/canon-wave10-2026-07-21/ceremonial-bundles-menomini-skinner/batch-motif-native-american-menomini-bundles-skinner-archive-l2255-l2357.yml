canonical_text:
  quote: ''
  summary: The passage describes Menomini birth preparation, cradleboard use, prenatal
    restrictions, birth seclusion, a fertility charm involving a walking-stick insect,
    and naming customs in which some children are believed to be under supernatural
    protection or to be manitous in human form. A sick or crying child may be diagnosed
    by a seer as having been given the wrong name; after tobacco offerings and revelation,
    the seer reports the proper name to the parents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Prospective parents prepare a cradleboard before birth; the father carves
    the woodwork and the mother ornaments it with beadwork, toys, and charms.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cradleboard is described as a portable bed that binds the child, supports
    a straight back, and formerly produced an admired flattened appearance at the
    back of the skull.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: During pregnancy, the mother and husband observe dietary caution because their
    condition is believed to affect the unborn child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pregnant woman avoids unusual or grotesque sights because of their feared
    effect on the unborn child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Near birth, the woman withdraws to a special shelter away from her husband
    and from sacred objects that might be polluted by blood.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: After birth, the infant is bathed, placed on the cradleboard, and kept there
    much of the time until able to walk.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The cradle and bands are softened with bulrush-down, and the mother may carry
    the cradle on her back or rock it with her feet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A woman desiring a son may use a live walking-stick insect as a charm, letting
    it crawl downward over her bare skin while praying for a boy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage reports a belief that finding a walking-stick insect on one’s
    clothing foretells the birth of a child.
  category: other
  evidence_refs:
  - ev:4
- id: obs:10
  text: A note reports a post-birth physical manipulation performed on a boy, explained
    as intended to prevent abnormal growth and help him master his passions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Parents ordinarily decide on a child’s name soon after birth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Some children are said to be born under the special protection of Powers Above
    or Below, and some babies are described as manitous in human shape.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Thunder boys are described as powerful god beings come to earth temporarily,
    and some girls are said to personify sacred sisters of the eastern sky.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: Such children are said already to possess a name known in their heavenly abode,
    and use of another name is offensive to them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: If a child cries ceaselessly, is listless, or is sickly, parents may first
    call a local doctor, whose cures may fail.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The case may then be given to an old seer, preferably one able to understand
    the language of babies, described as a special Menomini dialect unintelligible
    except to the initiated.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: The seer is invited with tobacco and a gift, examines and speaks to the child,
    and identifies wrong naming as the cause of the trouble.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: The seer makes a tobacco offering and prayer to the gods; that night the baby
    appears to the seer from far away and repeats its complaint.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: The seer reports to the parents that the child is under the protection of
    the Powers Above and must be called by its proper name.
  category: speech
  evidence_refs:
  - ev:10
