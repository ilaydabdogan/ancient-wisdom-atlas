canonical_text:
  quote: ''
  summary: The passage describes Menomini relations with neighboring peoples and then
    gives a mythic account of martial tactics and sacred bundle powers derived from
    the Powers Above. The sun and morningstar pity humans at war, call animal beings
    to council, gather their gifts into a bundle, and give it to thunderbirds for
    transmission. Watakwuna fasts and receives a vision directing him westward across
    the ocean to the thunderers; after sacrifice and tobacco offerings, seven pure
    young men agree to accompany him, and the difficult westward journey begins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Menomini are described as friendly with the Dakota, Winnebago, and Potawatomi,
    while their relations with the Ojibway are described as uncertain and suspicious.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sauk are described as a hated enemy of the Menomini, with the Fox often
    not distinguished from them; the Osage are also named as a traditional enemy.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Menomini are said to derive fundamental strategic tactics and sacred palladiums
    for success from the Powers Above.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the mythic period, the sun and morningstar look down on their human grandchildren,
    pity their warfare, and call a council.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The council includes swift-flying birds, the buffalo, the weasel, and the
    pine snake, all of whom come out of pity for human beings.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The swift-flying birds promise speed and escape by bird skins; the buffalo
    gives strength and courage; the weasel gives stalking and success in taking scalps;
    the pine snake gives skill in hiding, spying, and escape.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the animal gifts are made, the sun and morningstar gather the presents
    into a bundle and give it to the thunderbirds to transmit to human beings.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Watakwuna sorrows over his people's reverses, blackens his face with charcoal,
    and goes to an isolated place to fast and pray.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Watakwuna's entreaties reach the sun and morningstar, and the thunderers send
    word for him to come to them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The vision tells Watakwuna to go straight westward across the ocean to a high
    rocky island surrounded by waters, where he will find the thunderers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the vision, Watakwuna makes a sacrifice to the Powers Above, invites
    seven pure young men, and offers tobacco to the thunderers in his medicine lodge.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The seven young men believe Watakwuna's account and resolve to accompany him
    westward to the home of the thunderers.
  category: sequence
  evidence_refs:
  - ev:7
