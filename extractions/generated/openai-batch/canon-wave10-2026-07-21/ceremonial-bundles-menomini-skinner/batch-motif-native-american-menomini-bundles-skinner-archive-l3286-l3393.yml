canonical_text:
  quote: ''
  summary: 'The passage introduces Menomini games as activities performed for pleasure
    and, often, religious purposes such as curing illness, with betting between opposing
    sides. It describes several games: a ball game with goals, batting, running, and
    catching rules; a sand or earth game involving a dirt holder, a challenger, pursuit,
    capture, release, and scoring sticks; a flying-stick distance game using fire-hardened
    sticks; a snow-snake game using rods carved like snakes and thrown over snow and
    ice; and an ice game using a heavy-headed throwing stick.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that all or nearly all Menomini games have both pleasure
    and religious motives, that the religious use is usually as a cure for illness,
    and that the games are accompanied by betting.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bets in Menomini games and contests are laid by individuals on one side against
    individuals on the opposing side.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Menomini games are divided in the passage into athletic sports and games of
    skill and chance.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ball game uses two leaders, equal sides averaging ten men, and two stakes
    set about one hundred yards apart as goals.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: First play in the ball game is determined by tossing up a stick and grasping
    it hand over hand until one side has the top position.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the ball game, a batter uses a wooden club or bat to drive a deerskin-covered
    yarn ball toward opponents, then may run between stakes while opponents try to
    put him out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the ball game, ten home runs win, and a batter who knocks a foul straight
    upward and catches it himself wins the game for his side.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sand or earth game uses two home lines, equal parties, and a first-play
    decision by tossing a knife and betting on which side will fall uppermost.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the sand or earth game, one man holds out a handful of dirt or sand, and
    an opposing player tries to distract the party and slap the holder’s hand to knock
    the earth away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the earth is knocked away, players pursue the challenger; a caught player
    becomes a prisoner but can be released by a touch from one of his own side.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Scoring in the sand or earth game is marked with sticks, and the side obtaining
    all of the opponents’ sticks wins.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The flying-stick game is played by equal sides or by two single men, each
    bearing a bundle of yard-long, straight, tapering sticks.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Flying-stick implements are hardened with fire and ornamented by spiral bark
    wrapping and smoke.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the flying-stick game, sticks are thrown over the ground for distance;
    the farthest stick wins a point, and the loser gives up one throwing stick for
    each point.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The snow-snake game is played by opposing sides with heavy wagers, using long
    straight rods carved to resemble snakes and thrown over snow and ice for distance.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: 'The snow-snake rods are described as formerly having two types: one straight
    and plain, and one with a raised snake-like head.'
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: The ice game uses a throwing stick with a tapering shaft and heavy knob or
    head, hurled over the ice so that it writhes, bounces, and whirls.
  category: action
  evidence_refs:
  - ev:9
