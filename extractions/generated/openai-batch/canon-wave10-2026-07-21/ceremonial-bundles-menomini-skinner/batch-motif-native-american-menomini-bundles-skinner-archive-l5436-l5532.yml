canonical_text:
  quote: ''
  summary: The passage argues that Menomini sacred bundles may have developed through
    the accumulation of personal charms and medicines received in childhood, dream
    fasts, visions, and later dreams. It discusses war, witch, hunting, and good luck
    bundles; the mixing and interchangeability of medicines; protective crow and rattlesnake
    skins; comparative notes on Sauk, Fox, and Blackfoot practices; and a footnoted
    dream story in which an old man journeys west for a thunderer's egg that becomes
    the nucleus of a war bundle.
  language: English
  quote_policy: summarized
