canonical_text:
  quote: ''
  summary: The passage describes Menomini war-bundle scalp dances, the transfer of
    scalps to female relatives through gift exchange, semiannual and modern bundle
    ceremonies involving feasts, tobacco, prayers, thunderers, rain, and healing,
    later variations in bundle contents, and a brief cosmological account of a copper
    or brass cylinder reaching to the highest heaven where four gods sit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A warrior stamps and then dances faster around a circle or lodge to the beat
    of a drum, singing and giving war whoops.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The warrior's sister or nearest female relative takes the scalp from him and
    gives cloth or other goods in return, described as washing the blood from his
    hands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After this exchange the scalp becomes the woman's property; if a man has no
    female relatives to perform the exchange, the scalp reverts to the bundle.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Unredeemed scalps are put inside the bundle and kept there until the next
    spring or fall semiannual ceremony.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the semiannual ceremony, war-bundle owners gather in a secluded place,
    offer tobacco and prayers to patron deities, open the bundles, and hold a feast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Warriors dance with unredeemed scalps, recount the circumstances of capture,
    and are joined by onlookers; by the end the trophies accrue to women, and the
    ceremony is said to add glory and strength to the war bundles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Modern semiannual ceremonies are held as feasts without the scalp dance; game
    is preferred for the feast, a dog may substitute, and feeding and giving tobacco
    to bundles is said to please the thunderers, bring winds and rain, cleanse the
    earth, and may be accompanied by prayers for a sick person and burned herbal incense.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage distinguishes older war bundles dominated by thunder power from
    modern variants that may add Powers Below, including the underground man-sturgeon
    being inani-namao, despite older Menomini objections to mixing such powers with
    Above powers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: One collected war bundle had become a powerful lacrosse charm; its owner used
    its medicines for players but did not recite battle formulae, and the bundle contained
    a small netted hoop said to represent the sun.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Nakuti reported that his grandfather's bundle contained medicine from the
    north giant mowakiu and was also used for hunting.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Menomini are reported to claim that a large cylinder of brass or copper
    extends from earth to the fourth and highest heaven, with four gods seated at
    its top.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: Nakuti's great-grandfather is said to have dreamed of the four gods and of
    Wabano, the morning-star, and in the dream he walked through the sky until the
    gods' leader approached him singing.
  category: action
  evidence_refs:
  - ev:9
