- id: claim:1
  claim: The passage itself contrasts the Menomini semiannual opening of multiple
    bundles with Harrington's note that among the Sauk no such multi-bundle ceremony
    occurred, though bundles were opened one per day for several days.
  claim_level: same_function
  target: Sauk bundle-opening ceremony as reported in Harrington note
  evidence_refs:
  - ev:5
  counter_evidence_refs:
  - ev:5
  confidence: medium
  limitations: The comparison is limited to a brief editorial footnote and does not
    describe Sauk ritual details beyond the bundle-opening sequence.
- id: claim:2
  claim: The passage's footnote links Kansa and Osage bundles with scalps inside or
    tied outside bundles, visually resembling the Menomini association of scalps with
    war bundles.
  claim_level: visual_similarity
  target: Kansa and Osage scalp-bearing bundles as reported in Harrington note
  evidence_refs:
