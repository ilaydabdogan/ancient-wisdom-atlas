canonical_text:
  quote: ''
  summary: The passage describes a former Menomini feast and sacrifice after a youth’s
    first big-game kill, then outlines Menomini puberty dream-fasting rules. Fasting
    youths or maidens may dream of upper powers, lower powers, manitou animals, or
    the sacred metal cylinder. Visionary beings promise patronage and aid while requiring
    offerings and tokens. Upper powers are generally beneficial, while lower powers
    such as horned snakes and underground animals are dangerous and can lead to sorcery,
    severe sacrifices, and medicine obtained from the power’s body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A former Menomini custom involved preparing a feast and sacrifice to the gods
    when a youth killed his first big game; it was called oskinanitawin, translated
    as “youth’s feast, or dance.”
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that this first-big-game custom is also found among the
    Northern Algonkin.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Menomini puberty dreams during fasting are said to be confined to four classes
    of strong powers: gods above, gods below, manitou animals, and the sacred metal
    cylinder.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After fasting for an indefinite period not longer than ten days, the supplicant
    is approached by a being that speaks, promises lifelong aid and patronage, requires
    sacrifices, and requires a token to be kept on the person.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The powers above include the sun, moon, morningstar, and thunderers; the passage
    calls such visions good, though it describes the moon as an undesirable patron
    for many dreamers.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sun is described as appearing in human shape rather than his own guise;
    the morningstar appears as a homely man with a large red mouth; thunderers appear
    as men or birds and may carry clubs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the cited typical dream, a tall man with a big red mouth appears from the
    east after eight days of fasting, makes the earth bend under his steps, promises
    longevity and safety, directs the dreamer to make and carry a war club, and asks
    for prayer and tobacco offerings.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A strong power may test a dreamer by appearing as an ordinary person without
    the usual magical attributes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The powers below are described as evil and include horned hairy snakes, underground
    bears, and underground panthers; dreamers usually stop fasting and try again if
    such a power appears.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Acceptance of a lower-power dream is said to leave no alternative but sorcery,
    and such a dream must be accepted if it occurs three times.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: An evil power may be heard only as a mystical voice and may demand a later
    meeting at a secluded place.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: One collected story describes a thunderer intercepting a faster on the way
    to meet an evil power, persuading him not to go, keeping the appointment, and
    killing the evil one.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Snake dreams are described by a few informants as rarely not wholly evil,
    but most informants condemn horned-snake dreams; such dreams require repeated
    large sacrifices including dogs and tobacco.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: Those who accept lower-power dreams may receive evil attributes only after
    long training and offerings, sometimes including human sacrifice; the power may
    demand the first living thing met on the way home or the faster’s firstborn, and
    refusal brings death.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: An evil power usually gives the dreamer part of its body as a medicine.
  category: object
  evidence_refs:
  - ev:10
