canonical_text:
  quote: ''
  summary: The passage describes captive servitude connected with regional warfare,
    reported treatment of Pawnee slaves, Menomini ceremonial cannibalism on the warpath,
    a turtle-heart courage custom, and several kinds of personal war charms and bundles,
    including clubs, feathers, an otterskin medicine bag, a war headdress, and miniature
    red-and-black objects associated with thunderbird protection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several Wisconsin tribes are described as having made captives of Pawnee,
    Osage, Missouri, and Mandan people; Menomini are said to have had only a few such
    captives, obtained by purchase rather than capture.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports severe treatment of Pawnee slaves by Indian masters, including
    one sick female slave killed by a Menominee woman; it also gives Mas-caw as an
    exception who was not treated as a slave and married a chief’s daughter.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Menomini warriors are described as often carrying no provisions on the warpath.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After killing an enemy, warriors are said to cut long strips of flesh, especially
    from the thighs, and place them in their belts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At night the flesh is described as roasted on a spit before the fire, while
    those who did not secure or eat such flesh were jeered at by comrades.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'A boast is quoted from participants: “I am brave, I can eat anything.”'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that Menomini did not eat the hearts of fallen foes, unlike
    Ojibway, Sauk, and Fox as described here.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A warrior is said customarily to swallow the still-quivering heart of a turtle;
    success in retaining it was associated with the turtle’s courage and longevity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Minor personal war charms are described as ranging from small bundles to a
    single magic feather.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: War clubs are described as common charms given to the possessor by some Power
    and varying from practical weapons to very small toy-like clubs.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Small clubs are described as carried on the owner’s person for their power
    to avert danger.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The figure caption lists an otterskin medicine bag carried in war, a wrapped
    war bundle, two antique war clubs, and a war headdress with two eagle feathers
    denoting two slain foes.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: One wallet-sized packet contained a little club, bow and arrow, and tiny lacrosse
    stick, all painted red and black to signify day and night and to symbolize constant
    thunderbird protection.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage says this amulet was said to have brought its wearer through the
    Civil War unharmed.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: A similar packet omitted the lacrosse stick, bow, and arrows, and substituted
    a model tambourine drum.
  category: object
  evidence_refs:
  - ev:9
