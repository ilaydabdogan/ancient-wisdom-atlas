canonical_text:
  quote: ''
  summary: 'The passage describes Menomini burial and mourning customs: a grave house
    with a spirit door and inverted totem sign, food offerings for the dead, widow
    mourning restrictions and release, punishments for violating mourning rules, pollution
    rules and protective dead sticks for mourners, and an unusual child-loss rite
    involving a dry-goods bundle treated as the deceased child and later redistributed
    in a dance with reciprocal gifts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A board house is erected over the grave; the deceased person's totem animal
    is painted upside down on the head board to show it is dead, and a tiny door is
    made at the head of the grave house for the spirit.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Relatives place or offer food for the dead, sometimes saying that they bring
    food; the passage states that the corpse or spirit consumes the spiritual aspect
    while the physical food remains.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During luxurious meals or the sugar season, tidbits may be placed in a tiny
    wooden bowl hung up in memory of a dead relative; after several days the food
    may be given to a visitor of the same sex and nearly the same age as the deceased.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mourning period is said to have formerly lasted four years, though the
    passage says it had recently been shortened.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A widow in mourning does not dress well, blackens her face, leaves her hair
    uncombed, and is forbidden to look upward; the text says that if she looks upward
    clouds will gather and rain will fall.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The widow's husband's relatives watch her observance of mourning rules; near
    the end she brings them presents, they comb her hair and tell her to wash and
    dress, and she gives them a lock of her husband's hair kept in a bundle of clothes.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: If a widow has not observed mourning rules, her husband's relatives may punish
    her by slashing her cheeks, cutting off her nose or an ear, or cutting hair from
    half of her head; the passage says such mourning rules formerly applied to men
    as well as women.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A man is considered unclean for one year after a death in his family and cannot
    handle medicine during that time; after ten days he may take up his gun.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Dead twigs carried during mourning are said to ward off trouble; a mourner
    must use dead sticks as insulation before touching a horse or child, and mourners
    use a stick to scratch because they may not touch their heads.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Parents who have lost a beloved child may wrap new dry goods in a sack, place
    the bundle under a suspended food dish for a year, call the bundle by the child's
    name, speak to it as the child, and keep food in the dish for it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: After a year the parents give a dance, preferably in springtime, and an agent
    distributes the bundle contents to guests; the recipients later return presents
    of equal value, completing a cycle said to appease the parents' sorrow.
  category: sequence
  evidence_refs:
  - ev:9
