canonical_text:
  quote: ''
  summary: The passage describes Menomini cosmological material concerning four gods
    who receive the spirit of an unborn child and fix its career and lifespan; the
    sun and moon as Powers Above; the sun as patron of war, source of war-bundle power,
    and giver of long life; solar dream insignia; a Jesuit account of a sun offering
    for sturgeon; and comparative notes about neighboring groups' solar beliefs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage names four gods: Minisifiio-hawatuk, described as a red war god
    sitting in the east, and three Inan-hawatukuk, described as judges of the dead.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spirit of an unborn child may leave a pregnant woman's body, enter a tube,
    and ascend until it reaches the four gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Minisi-no'hawatuk seizes the unborn child's spirit, examines it, prophesies
    its career, war victories, and age at death, and grants it a fixed number of years
    of life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Minisi-no'hawatuk assigns one of the Inan-hawatukuk to watch for the fulfillment
    of the prophecy and to avenge the child if it is slain before the appointed time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sun and moon are listed among the Powers Above.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sun is described as the great patron of war and as commanding Morningstar
    and the thunderbirds to give war bundles to mankind.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Battles are fought and scalps taken in honor of the sun, and the sun grants
    long life to those who win its patronage.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: People who dreamt of the sun roached their hair and wore a brass collar, beaded
    rope, or sun figure to symbolize the sun's rays or the sun itself.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Father Andre reports seeing a picture of the sun painted on a board tied to
    a brightly painted pole, with a sheaf of small cedar sturgeon-net floats suspended
    on the pole.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Menomini speakers in Father Andre's account described the object as a
    sacrifice or exhortation to the sun, asking it to have pity, send sturgeon into
    their river, and make fishing prosperous.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Father Andre replaced the sun picture with a crucifix; the next morning sturgeon
    entered the river abundantly, and the speakers said that the Spirit who made all
    was the one who fed them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage reports a Potawatomi statement that they believe in Kitchi Manito
    as creator and benefactor, honor him in the sun, and call him Kisis.
  category: speech
  evidence_refs:
  - ev:8
