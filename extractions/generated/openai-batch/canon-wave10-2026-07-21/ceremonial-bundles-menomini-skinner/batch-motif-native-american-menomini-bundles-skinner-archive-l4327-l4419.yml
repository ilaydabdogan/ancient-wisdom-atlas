canonical_text:
  quote: ''
  summary: The passage describes Menomini cosmology as a layered universe divided
    by the earth into upper good powers and lower evil powers. It identifies Mate
    Hawatuk as supreme creator, explains ritual cooperation with good spirits through
    prayer, sacrifice, medicine bundles, and Ma'nabus, and recounts thunderbirds as
    rain-bringing beings who may be born as humans to obtain tobacco, heal people,
    and transmit offerings upward through fire. It also notes inherited birchbark
    records depicting the thunderers' sky village and weather powers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The universe is described as divided into two portions, above and below, separated
    by the earth; each portion is subdivided into four tiers.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The upper regions are inhabited by good gods, while the lower regions are
    called the lair of evil gods.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mate Hawatuk resides in the topmost stratum, is called the nominal head of
    the universe, and is described as creator of the world and its inhabitants.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Menomini religion centers on a struggle between good
    and bad forces, and that humans aid benign forces with sacrifice and prayer.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Good spirits are said to have given mankind medicine bundles and, through
    Ma'nabus, some dominion over disease in return for proper ceremonies and sacrifices.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Thunderbirds dwell in a tier below Mate Hawatuk, are his servants, are friendly
    to mankind, and bring rain to earth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Thunderers are said to have existed before the Menomini, and some original
    animals who became men to form the tribe were thunderbirds.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Thunderers are said to come to earth and be born as men; the name Mudje'kiwis
    is associated with thunder and with eldest sons.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Two minor thunderers, Kewuta'wapeo and Pawe'kone, were sent to earth to obtain
    tobacco, which thunderbirds desired but could not get in their heavenly home.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says the thunderers could obtain tobacco only by coming down and
    being born of women in human shape.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Kewuta'wapeo entered the body of a woman and made her pregnant; Pawe'kone
    later entered a woman of a distant tribe.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: When the thunderers grew up, signs revealed who they were; they cured the
    sick and helped people, asking mainly for tobacco.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: After receiving tobacco, a thunder man cast it into the fire and addressed
