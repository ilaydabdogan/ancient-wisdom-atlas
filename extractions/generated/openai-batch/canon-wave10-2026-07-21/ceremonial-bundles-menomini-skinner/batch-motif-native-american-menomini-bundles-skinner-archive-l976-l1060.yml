canonical_text:
  quote: ''
  summary: The passage introduces Nakuti as a principal Menomini informant on the
    older social system, cites an eighteenth-century colonial notice of Menomini totems
    and a cross-bearing eagle device, comments on Christian disruption of older practices,
    and reproduces a variant totem-origin tradition involving the Great or Good Mystery,
    animal and bird spirits, Thunderers, the Bear and Eagle taking human form, and
    the adoption of Beaver, Sturgeon, and Elk into kinship roles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The information on the ancient system is said to have been obtained from Nakuti,
    also called Sun-fish, an elderly Menomini informant, and partly corroborated by
    other old men.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A 1736 colonial census entry under Folles Avoines is presented as the first
    recorded statement about Menomini totems, listing the Large-tailed Bear, the Stag,
    and a Killiou or eagle perched on a cross.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The cross is explained by a story in which a dangerously sick chief recovered
    after a missionary prayed with a cross in hand, and the chief then wanted a cross
    added to his arms with the Killiou perched on it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Large-tailed Bear is identified as Sekatcokemau, an underground bear represented
    in native drawings with a long curling tail said to be of metal.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Stag is identified with the omaskos or elk gens, and the Killiou is identified
    by the author as probably the bald eagle rather than the golden eagle subgens.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author states that Christianity has helped break up the old system and
