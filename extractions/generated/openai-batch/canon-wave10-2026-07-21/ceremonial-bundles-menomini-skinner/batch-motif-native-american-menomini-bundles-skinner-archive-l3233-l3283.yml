canonical_text:
  quote: ''
  summary: 'The passage describes Menomini menstrual restrictions: first menstruation
    requires a longer period of seclusion, later periods shorter segregation, separate
    cooking and utensils, restrictions on touching certain beings or looking upward,
    and dangers attributed to contact with menstrual pollution. It also describes
    a man whose internal guardian animal may die if he eats from a contaminated dish,
    disputed rules about entering houses with sacred objects, comparative notes on
    nearby tribes, and continuing avoidance of food in Christian homes by some pagan
    Menomini.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At first menstruation a girl is compelled to camp by herself for ten days;
    at later periods she is segregated for two or three days or as long as the period
    lasts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The menstrual camp is near the family lodge and may be a bough house, a full-sized
    wigwam, or only a kettle stake in the open.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The menstruating girl or woman must not touch a tree, dog, or child, with
    death stated as the consequence for what is touched.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Looking upward is tabooed because it is said to offend the powers above.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: She must dress as though in mourning, wear disheveled hair, and use a stick
    rather than her hand if she scratches her head.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: She has her own cooking utensils, cooks for herself, and these utensils are
    not used by anyone else because they are considered permanently defiled by her
    touch.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: If other persons eat from such a vessel, they are expected to become sick
    and perhaps die, though a special medicine or remedy is said to exist.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A man whose supernatural guardian has placed a tiny turtle, fish, or other
    small animal in his vitals risks the death of that animal if he eats from a dish
    touched by a menstruating woman.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the internal animal dies, the man vomits it forth and his power is permanently
    destroyed; if he learns in time, he may take an emetic and vomit the food before
    the animal is killed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some Indians say a menstruating woman has no right to be in any house during
    her period, but that no harm would be done even if shrines or sacred objects were
    present.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says the Kickapoo and probably other Central Algonkin tribes require
    heavy sacrifices in atonement for this matter, and that most Indians say the same
    is true of the Menomini.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Many pagan Menomini are said to refuse to eat in Christian homes for fear
    of losing power through food prepared by a menstruating woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: A footnote compares the practice with Ojibway and Ottawa examples and says
    Sauk and Fox, Kickapoo, Winnebago, and probably Central Algonkin groups and their
    neighbors practiced the custom.
  category: relationship
  evidence_refs:
  - ev:6
