canonical_text:
  quote: ''
  summary: The passage describes Menomini games and contests, especially a memorial
    moccasin-and-bullet guessing game held near a cemetery with tobacco invitations,
    wagers, music, dancing, deceptive performance, scoring counters, and decisive
    calls. It also summarizes Cat's Cradle forms, a tradition that games were once
    forbidden, a draw-stick game, and pony and foot racing as gambling contests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tobacco invitations are sent in memory of a dead person, and players assemble
    at an appointed place near the cemetery.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sides of four, eight, or ten are chosen; players line up opposite one another
    with two pairs of moccasins between them, and each side has a musician with a
    drum.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each player wagers goods against the corresponding player on the opposite
    side.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A leader chosen for first play conceals a bullet in a moccasin while making
    deceptive movements, singing, grimacing, and gesturing; his drummer keeps time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When a crowd is present, women may dance, bystanders shout and dance, and
    the songs may be improvised, obscene, or imitate small animals and their cries.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the bullet is hidden, the player stops singing and the opponent guesses
    by turning over moccasins; success or failure assigns points and may reverse which
    side conceals next.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The guesser may call “Tos” or “Tosaha” while pointing; if correct this can
    win the game, while the bullet hider may answer “Kup” immediately to limit the
    result to points.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Point sticks or counters are kept between two stakes, with the number of counters
    agreed on by the captains; the object is to win all the points from the other
    side.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Menomini Cat's Cradle has named forms, including one variety representing
    a creek and another representing a partridge foot.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: A tradition says all games were forbidden to the Menomini in the earliest
    days because they were thought to make people lazy and worthless, though this
    idea had been abandoned.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: The draw-stick game uses twelve sticks of even length and two longer sticks;
    possession of the long sticks determines whether a side wins, draws, or wins a
    stake in a pool.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Pony races and foot races are described as long-favored contests that provided
    means for gambling.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: A footnote states that the moccasin game is also described at length by Hoffman
    and was nearly obsolete at the time of the account.
  category: other
  evidence_refs:
  - ev:11
