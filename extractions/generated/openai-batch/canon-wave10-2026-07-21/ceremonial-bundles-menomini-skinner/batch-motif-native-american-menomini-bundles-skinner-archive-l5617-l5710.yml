canonical_text:
  quote: ''
  summary: The passage describes common features of Menomini sacred bundles, including
    their private ownership, dream-derived divine authorization, mediated supernatural
    origin, typical contents, restricted opening rituals with incense, pipe, prayer,
    feast, tobacco offering, and analogous war and hunting ceremonies identified by
    the author as sympathetic magic. It then summarizes Menomini warfare organization
    and the role of divine inspiration in leadership.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Menomini sacred bundles for war, hunting, witchcraft, or other purposes are
    described as private property of individuals, derived from gods through dreams;
    inherited bundles cannot be used unless the holder is divinely empowered.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Menomini bundles are not clan property and contrasts
    this with the Winnebago case.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bundles are described as aggregations of charms presented at one time by a
    deity with whom the owner communicated, contrasted with piecemeal acquisition
    among the Sauk and Fox.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Most true bundles are said to come through minor powers rather than directly
    from the gods who made them; ordinary war bundles came via thunderers, while hunting
    bundles came through Ma/nabus.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bundles of the same class have similar contents; war bundles and hunting-bundle
    orders have expected charms and ingredients, and medicines against witches and
    incense are common items.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: War and hunting bundle opening rituals differ regarding origin-myth recitation,
    but neither kind may be opened unless it is to be used, and both begin with incense,
    pipe passing, prayer, and feast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After a bundle is opened, tobacco is placed with the contents and old tobacco
    is removed and smoked or otherwise sacrificed to the powers that gave the charm.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: During smoking, a servant lights the pipe, holds it by the bowl, twirls the
    stem so the gods may partake, points the mouthpiece up and down, and passes it
    to participants.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The author describes the war-bundle discovery and war dance before conflict
    as homologous with the hunting-bundle ceremony in which performers simulated hunting
    deer, and calls both examples of sympathetic magic.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: War bundles contain war clubs, implements of war, and war helpers or guardians,
    while hunting bundles contain miniature hunting implements and skins of animal
    helpers.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: War is described as open to every man, but leadership generally requires divine
    inspiration; every man above puberty is described as a potential warrior.
  category: attribute
  evidence_refs:
  - ev:8
