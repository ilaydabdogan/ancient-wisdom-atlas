candidate_motifs:
- id: motif:1
  label: animal grandmother gives hunting medicine to a human child
  taxonomy_refs:
  - sacred_exchange
  basis: The owl grandmother shelters the lost girl and gives her a named medicine
    for charming game, intended for future use by her family and people.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents the owl as grandmother and sacred power; it does
    not explain whether this is a transformation, kinship term, or other category.
- id: motif:2
  label: four-day seclusion and touch taboo before medicine transmission
  taxonomy_refs:
  - initiation
  basis: The girl is forbidden to be touched for four days and must stay silently
    in a tiny clean wigwam for four days before instructing her father in the medicine.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly call this an initiation; the motif label
    is based on the observed seclusion, taboo, and instruction sequence.
- id: motif:3
  label: purity of children and young girls as condition of medicine efficacy
  taxonomy_refs: []
  basis: The medicine is kept and prepared by a pure young girl, and children are
    brought into the lodge because their purity attracts aid from the Sacred ones.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: No broader taxonomy reference is assigned because the available list has
    no direct purity motif family.
- id: motif:4
  label: hunting rite calls game through song, vapor, and sacred invocation
  taxonomy_refs: []
  basis: Hunters use cedar, heated stones, medicated vapor, songs, and invocation
    of the owl and Sacred Powers; the spell calls wild animals toward the wigwam.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage describes ritual technique but does not frame it as a mythic
    journey or battle motif.
- id: motif:5
  label: winter-to-spring awakening of owls and Sacred Powers
  taxonomy_refs:
  - seasonal_cycle
  basis: The return occurs near spring during maple-sugar making; owls begin to whoop
    and sing, and winter is described as a short night to the Sacred Powers.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The seasonal statement is brief and embedded in the return narrative rather
    than presented as a full seasonal myth.
- id: motif:6
  label: underneath animal powers give or authorize a hunting charm
  taxonomy_refs:
  - sacred_exchange
  basis: Nimokwetcikun is said to have come as a gift from underneath bear and panther,
