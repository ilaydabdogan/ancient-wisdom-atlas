canonical_text:
  quote: ''
  summary: A lost girl is kept over winter by an owl who is identified as her grandmother.
    The owl gives her Spotted fawn medicine for charming deer and other game and instructs
    her return to her parents at the spring sugar bush, including four days without
    touch and a four-day stay in a small clean wigwam. The girl teaches her father
    the use of the fawnskin medicine and its sacred songs. The passage then describes
    the ritual preparation and use of this hunting medicine by a pure young girl and
    hunters, including cedar boughs, heated stones, medicated vapor, songs, invocation
    of the owl and Sacred Powers, and the calling of wild animals. A second hunting
    charm, Nimokwetcikun, is described as a gift from underneath bear and panther,
    with procedures for bear and beaver hunting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A little girl is taken to an owl's den in the wilderness, where the owl is
    identified as her grandmother and keeps her in comfort in a fancy wigwam through
    the winter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The owl grandmother says she will take the girl home, dress her beautifully,
    and give her Kitag'asa Musk'ikiu, or Spotted fawn medicine, for charming deer
    and other game so they may be killed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The medicine is to be kept wrapped in a spotted fawnskin and is said to be
    powerful for the girl, her parents, her great-grandparents, and all her people
    in the future.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Near spring, the girl's parents are making maple sugar at their sugar bush
    while snow remains and owls begin to whoop and sing.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that winter is regarded as a short night to all the Sacred
    Powers.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The owl instructs the girl to stand silently at the limits of her parents'
    tapped trees and not allow her mother to touch her for four days.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The owl instructs that a tiny wigwam be prepared in a clean, untrampled place
    away from the sugar camp, where the girl must remain silent for four days.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The mother finds the girl, calls to her, and the girl refuses touch because
    she is forbidden to allow it for four days.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The girl tells her parents to make the tiny wigwam and says her father must
    visit frequently so she can instruct him in the medicine given by her grandmother
    owl.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The girl shows her father how to use the fawnskin medicine, which has sacred
    songs that must be repeated as the owl ordered.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The medicine is described as always prepared and guarded by a pure young girl
    when hunters wish to use it.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:12
  text: In the medicine lodge, hunters sit in a circle around cedar boughs, heated
    stones are rolled in from an outside fire, medicine is poured on the stones to
    make vapor, songs are sung, and the sacred power of the owl is invoked.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Tiny boys and girls are brought into the lodge in memory of the little girl,
    and their purity is said to attract aid from the Sacred ones.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The spell calls wild animals to approach the wigwam, and hunters meet the
    game coming to them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: A separate charm, Nimokwetcikun, is said to have come to its first owner as
    a gift from the underneath bear and panther.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: The second charm includes roots and herbs wrapped in an old squirrel skin
    with quill-bound feet, with the skin used as a mortar for grinding medicines.
  category: object
  evidence_refs:
  - ev:10
- id: obs:17
  text: For bear hunting, the hunter touches powder to the bear's track with the end
    of his ramrod and sings while trailing the bear.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: For beaver hunting, the hunter pronounces the name of the white underground
    panther and sings the sacred song two or four times.
  category: speech
  evidence_refs:
  - ev:12
