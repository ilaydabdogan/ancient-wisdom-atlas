canonical_text:
  quote: ''
  summary: The passage describes Menomini final funeral rites on the fourth day, including
    a feast, an oration on burial customs and ancestral beliefs, prayers for the dead
    person’s soul, grave-post coup counting by warriors, the use of the dream drum,
    removal of the corpse to the cemetery, and a speech meant to remove the grave
    from the memory of the living. It also notes a distinct ceremony for unrecovered
    bodies and gives comparative remarks about Sauk, Fox, Potawatomi, and Winnebago
    rites and afterlife concepts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Final rites continued until the fourth day, when a feast of the dead was held
    and Old Wisawnokwut gave an oration about established burial customs, ancestral
    Menomini beliefs, named braves, and two heroes of the past.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A prayer asked that no evil creeping thing prevent the dead man’s soul from
    reaching its destination, that no reptile or insect disturb the grave or corpse,
    and that Mate Hawatuk make the ghost happy during a four-day journey toward the
    great dream drum above.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prayer also asked that the deceased not look back longingly at the world
    or make the survivors forlorn.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two warriors struck the grave post and counted coups; James Black-cloud recounted
    power derived from the sun and survival in the Civil War, after which six marks
    were made on the grave board that bore the deceased’s inverted totem.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Charles Apatakesik recounted deeds from a recent war, including the slaying
    of four enemies.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the speeches, the dream drum was beaten, the corpse was lifted, pushed
    through an open cabin window, and carried to the cemetery.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A short speech was made to erase the memory of the newly made grave from the
    minds of the living.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Members of the dreamers beat the drum in a lively measure for the deceased,
