canonical_text:
  quote: ''
  summary: A Menomini war-bundle account describes a heavenly or dream setting in
    which a warrior receives a Thunderer’s egg and instructions for making a war bundle.
    The bundle’s rites use four small war clubs set at the compass quarters with burned
    tobacco, and its songs address southern sacred birds, crow, thunderbirds, the
    north giant, morningstar, and the red war god Minisino-hawatuk. The passage also
    summarizes Menomini rules about war bundles, nephew obligations in warfare, and
    reciprocal treatment of captives.
  language: English
  quote_policy: summarized
