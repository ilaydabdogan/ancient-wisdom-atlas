  quote: ''
  summary: The passage describes Menomini defensive war practices involving ceremonial
    bundles, medicine amulets, bundle owners, and the mikao; concealment of women
    and children during attacks; limited peace customs; didactic war stories; and
    brief comparative notes on war medicines among nearby or related Native peoples.
  language: English
  quote_policy: summarized
