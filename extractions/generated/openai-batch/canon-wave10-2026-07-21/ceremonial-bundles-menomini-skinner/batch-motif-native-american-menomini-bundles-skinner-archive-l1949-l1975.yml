  quote: ''
  summary: The fragment includes comparative notes and a robe-related custom. One
    note says an unspecified matter was not so among the Ojibway and Cree. Another
    says the Sauk and Fox cut off a woman's ears and cut or bite off her nose. The
    main passage describes a request made with a tobacco present, another present
    paid when the robe is returned, and indemnity demanded if users soil the robe.
    It adds that the same practice was reported among neighboring Ojibway and among
    the Shawnee.
