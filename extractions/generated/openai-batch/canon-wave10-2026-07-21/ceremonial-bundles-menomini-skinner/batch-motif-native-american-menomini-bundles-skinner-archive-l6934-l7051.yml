canonical_text:
  quote: ''
  summary: The passage describes Menomini sacred war and lacrosse charms, thunder-being
    gifts, war-bundle observances, protective warrior objects, animal-power imagery,
    an eagle-given cedar knife packet, and Civil War departure dances and prayers
    invoking the Powers Above, especially thunderers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eight thunder beings led by a dark-blue-or-black dressed chief appeared to
    a sacred dreamer and gave him a lacrosse bat, ball, tiny bow and arrows, and a
    round stone thought to be a thunderbolt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The thunderer told the recipient to carry the objects to war and said he would
    never be hurt.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The original owner is reported to have gone through the Black Hawk war and
    returned unharmed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The owner had a lacrosse game played before departing and annually held spring
    and fall feasts in honor of the thunderers, with a whole deer or bear eaten before
    the open bundle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A song naming the roaring thunderers was used repeatedly at feasts and also
    as a prayer for aid in hard battle conditions.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: War hats, otterskin headbands or bands with jinglers, bear-claw necklaces,
    and mitawin medicine bags are described as protective safeguards carried or worn
    by warriors.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: A panther figure was embroidered on warrior moccasins; the text says the black
    design symbolized panther ferocity and functioned as a prayer to the panther for
    power.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: A buffalo-head skin headdress with horns attached is described as once belonging
    to Chief Oshkosh.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: A woven packet with many wrappings contained a cedar knife said to have been
    given by the bald eagle and was opened before war or hunting.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: A song connected with the cedar-knife packet refers to clouds peeping in heaven;
    the passage explains this as a reference to thunderers hiding behind clouds to
    stalk and kill snakes.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: When the eagle appeared to the invoker, it gave advice said to be sufficient
    to win the day.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage says war bundles had declined in reverence, though some were carried
    by Menomini volunteers in the Civil War.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Before leaving for the Civil War, Menomini volunteers went lodge to lodge
    in finery with faces painted red or black, danced circularly to a tambourine drum,
    and heard their chief pray to the Powers Above, especially thunderers and other
    gods connected with the bundle.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The warriors performed the Last Words dance, sang that they were brave warriors,
    and whooped four times at the conclusion.
  category: action
  evidence_refs:
  - ev:12
