canonical_text:
  quote: ''
  summary: 'The passage describes Menomini hunting-related medicines and rituals:
    an incised flat board recording a hunting dream formula, prayers to supernatural
    powers and animal guardians, a buffalo-calling medicine with regalia and tobacco
    sacrifice, and guardian dolls kept in sacred packs and used with tobacco offerings
    and ritual records for obtaining blessings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A flat stick or board bears incised figures said to hold the owner's supernatural
    experiences and is read during Mitawin ceremonies and before hunting.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says that in youth he blackened his face, fasted, and prayed to
    the Powers Above and Below for success with four-legged animals and fish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker addresses Wabiskinitapasos, the sacred white deer, and Wabiskuitnama,
    the sacred white beaver, who are said to have charge over things on earth and
    in water and to grant the speaker's desires.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The hunting prayer asks to call out animals, slay deer, have medicine enter
    the heart of a bear, dream prophetically, and locate a bear den.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The buffalo-calling medicine consists of a red dyed deer-hair headdress, a
    gourd rattle, buffalo-tail armbands with quillwork figures representing thunderbirds,
    and an uncollected white-horse-tail armband.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Before a buffalo hunt, the owner of the charm summons companions, prepares
    a small feast, prays with the rattle, and sacrifices tobacco to all the gods for
    protection and success.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After the tobacco sacrifice, the party wears the armbands and sets out expecting
    buffalo to come and surrender and expecting safety from enemies or wild beasts.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Some older Menomini possess small wooden figures guarded in sacred packs and
    exhibited at Mitawin meetings as proof of intimacy with the supernatural.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The guardian dolls are propitiated by frequent tobacco sacrifices and entreated
    for blessings such as long life, food, clothing, visitors, money, and health.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: One guardian doll was accompanied by a birchbark ritual record; the doll is
    set up in the lodge while the Mitao opens the scroll and reads or explains it.
  category: sequence
  evidence_refs:
  - ev:10
