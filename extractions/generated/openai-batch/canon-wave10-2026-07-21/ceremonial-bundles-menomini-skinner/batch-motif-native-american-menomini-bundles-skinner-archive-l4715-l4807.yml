canonical_text:
  quote: ''
  summary: The passage reports beliefs about the sun, moon, morningstar, female spirit-sisters
    connected with games, and subterranean powers. It describes lunar dream patronage,
    morningstar as an eastern male dream visitor and war-bundle donor, four eastern
    virtuous sisters and four southern sisters who patronize women’s games, a four-tiered
    under-earth hierarchy led by a white bear, and horned hairy serpents opposed by
    thunderbirds and regarded as dangerous omens or sources of sorcery if accepted
    in vision.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Perrot smoked the calumet with Potawatomi chiefs at Green Bay, and the chiefs
    addressed him as a chief spirit because he used iron and praised the sun for instructing
    and sending him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The moon is described as less powerful than the sun; dreaming of it is considered
    undesirable but not evil, and a persistent moon vision must be accepted.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The moon is said to bring long life ending in misery, and people having the
    moon as patron are strong when it is full and weak or sickly when it wanes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Morningstar dwells in the eastern sky, is often personified as a large man
    with an enormous mouth, appears to young men in dreams, promises strength and
    success, influences war, and with the sun donated the war bundle through the thunderbirds.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Four virtuous sisters dwell in the east; they were mortal women made immortal
    by overhead beings, patronize women and girls, may enter women’s bodies and be
    reborn, possess the female shinney game, and are associated with red and with
    red sunrise.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Another set of four sisters dwells to the south, has charge of the bowl and
    dice, animates women who must give the dice game in their honor, and is associated
    with distinctive garment colors.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Powers Below reside in four tiers under the earth, with the white bear
    in the lowest tier as supreme leader of the Underneath Gods and with other animal
    powers and their servants arranged above.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The horned snake, also called the hairy snake, is described as a gigantic
    reptile with black or golden scales, a hairy head, and stag-like horns.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The horned snakes seek to destroy humans but are rarely successful because
    the thunderbirds are their relentless enemies.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Seeing a horned snake while awake is a bad sign that may foretell death in
    the family; seeing one in a dream is an evil omen, and a fasting dreamer should
    break the fast and begin again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Accepting a horned-snake vision is said to make the dreamer possessed of malign
    powers of sorcery and witchcraft.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage’s notes state that a related shinney belief was also found among
    Potawatomi and that similar horned-serpent beliefs and images are found in an
    Iroquois source.
  category: other
  evidence_refs:
  - ev:9
  - ev:10
