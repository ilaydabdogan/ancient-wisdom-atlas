canonical_text:
  quote: ''
  summary: The passage describes the final chant of a Menomini hunting-bundle ceremony,
    an imitative deer-hunt dance, the hanging of the bundle on a tree, protective
    powder thrown into fire against saxkanao, the nocturnal hunting action of the
    bundle's powers, morning smudging of weapons, distribution of animal-skin medicines,
    a four-night repetition of the rite, and taboos and fumigation procedures for
    game parts believed to contain medicine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the fourth chant is the last chant and that the numbers two
    and four are significant, with four identified as the sacred number of the Menomini.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The translated chant identifies Red Legs as the deer, describes the deer as
    killed and dressed, and calls the buck deer or male deer “the man.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the last song, all the company except the bundle owner and his assistant
    dance and imitate the next day's chase with gestures representing a buck, a doe,
    hoofs, shooting, falling, skinning, and quartering.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After songs for the medicines, a young man described as clean-living and as
    not having known woman carries the bundle to a clean spot and hangs it on a tree
    limb.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bundle owner throws powder from the bundle into the fire so that saxkanao
    cannot approach, be able to steal game, or have power over the owner; the passage
    says saxkanao would be stricken blind if he attempted to approach.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'During the night, the bundle is said to hunt: its magic powers go through
    the nearby forest and make deer and other game tame, sluggish, and impaired in
    their heads, lungs, and legs.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the following morning the hunters eat a heavy breakfast, although ordinary
    hunters avoid breakfast for fear of ill luck; the bundle party is said to be protected
    from such misfortune.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The bundle is opened in the morning, a smudge is made from one of its medicines,
    and the men hold bows or rifle muzzles downward in the smoke so the medicine's
    virtue will impregnate them and give them power.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: While smudging the weapons, participants call out desired numbers and kinds
    of deer, imitate firearm reports, and the passage says these spoken wishes will
    come to pass through the medicine.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Participants paint small red spots on each cheek to fascinate the deer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The bundle owner distributes the bundle contents, wearing the wolfskin head
    band himself and giving medicines to his men; mink, weasel, and other skins are
    described as powerful medicines that let their carriers hunt like those animals.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The entire ceremony is repeated every night and morning for four nights.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The head, lungs, and legs of butchered game may not be eaten without ceremony
    during the four-day period because they are considered still filled with the medicine
    that attacked those parts.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: A person who thoughtlessly eats the tabooed parts is said to be punished when
    the medicine enters his body, turns his skin black, and causes him to waste away
    and die.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Cedar leaves mixed with a leaf called nami-panam are burned on hot coals in
    a frying pan to make a portable fumigant that is carried beneath the infected
    parts to drive out the medicine and make them fit to eat.
  category: action
  evidence_refs:
  - ev:10
