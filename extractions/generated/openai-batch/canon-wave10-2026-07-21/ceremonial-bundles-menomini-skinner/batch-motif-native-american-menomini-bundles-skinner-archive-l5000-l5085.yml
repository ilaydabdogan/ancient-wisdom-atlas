canonical_text:
  quote: ''
  summary: The passage describes Menomini beliefs about two souls, the postmortem
    westward journey of the heart-soul along the Milky Way, temptations and barriers
    on the road to the village of the dead, a dog-guarded log crossing over a swift
    river, welcome and feasting in the land of the dead, an alternate account of reception
    and washing by Naxpatao, and a brief cosmological statement about upper and lower
    worlds. Authorial notes compare some details with Plains-Cree, Ojibway, and Shawnee
    materials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that every human being has two souls.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: One soul, agawetatciuk, is said to reside in the head, to be the intellect,
    and after death to linger near the graveyard as a ghost.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Food sacrifices are offered for the graveyard-lingering ghosts, which are
    described as giving sharp whistling cries after dark.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tcebai is said to dwell in the heart and to be the soul that travels to
    the hereafter; funeral services are held for it.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: After leaving the body, the soul travels westward for four days and nights
    toward the home of Ma'nabus and Naxpatao.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Milky Way is described as the single broad, plainly marked trail used
    by good and bad souls alike.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: A great strawberry in the trail and a fountain of pure, beautiful water tempt
    the traveling soul to break a purification fast.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A swift river separates the soul from the great village of the dead, which
    is ruled by Naxpatao.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The only bridge over the river is a slippery log that sways with the current.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: A huge dog guards the log and decides whether the soul may attempt to cross;
    he does not permit evil persons or those who abused dogs or wolves to pass.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A soul that falls from the log into the river is carried downstream forever
    by the swift current.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A soul that reaches the other shore is welcomed by inhabitants of the village
    of the dead and escorted to a place of happiness, feasting, lacrosse playing,
    radiance, vermillion-painted faces, and absence of war, pestilence, want, or sorrow.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: In another account, Naxpatao sends his servant to meet the newcomer and escort
    it to him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: In the alternate account, Naxpatao leads the shade to a central immense wooden
