comparison_claims:
- id: claim:1
  claim: Fox and Menomini traditions share the idea that thunderers are friends of
    the Indians who receive tobacco, while differing in directional placement.
  claim_level: same_function
  target: Fox and Menomini thunderer beliefs
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the attributes summarized in this passage.
- id: claim:2
  claim: Several neighboring traditions connect thunder powers with hostility toward
    snakes, horned snakes, or water monsters, though details vary.
  claim_level: same_motif
  target: Great Lakes and eastern thunder-versus-serpent or water-monster pattern
  evidence_refs:
  - ev:4
  - ev:6
  counter_evidence_refs:
  - ev:4
  confidence: medium
  limitations: The passage notes variation, including loss of the snake-subsistence
    idea among Northern Saulteaux and no present Eastern Cree thunder-bird association.
- id: claim:3
  claim: The belief in thunderers as birds combined with antipathy toward underneath
    monsters is presented as widespread among Central, some Plains, and eastern Algonkin
    groups.
  claim_level: same_motif
  target: Thunderbird opposed to Powers Below or underneath monsters
  evidence_refs:
  - ev:6
  counter_evidence_refs:
  - ev:6
  confidence: medium
  limitations: The author uses probabilistic language and notes that the Iroquois
    conceive the thunderer as an old man.
- id: claim:4
  claim: The horned snake concept is presented as more widely distributed than the
    thunderbird concept, extending to Iroquois, Seminole, and Southwest occurrences.
  claim_level: same_motif
  target: Horned snake concept across North American traditions
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states distribution but does not provide detailed narratives
    for each region.
- id: claim:5
  claim: The Menomini skeleton man is compared with parallels among the Missisauga,
    Plains-Ojibway, and perhaps the Fox.
  claim_level: same_motif
  target: Skeleton man figure in neighboring traditions
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The figure is only briefly described, and the Fox parallel is qualified
