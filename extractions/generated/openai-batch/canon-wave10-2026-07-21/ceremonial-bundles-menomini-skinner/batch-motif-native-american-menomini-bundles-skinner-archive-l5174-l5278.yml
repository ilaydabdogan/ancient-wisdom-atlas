canonical_text:
  quote: ''
  summary: The passage summarizes Menomini and neighboring traditions concerning Mate
    Hawatuk, the white bear as underworld chief, thunderers, horned snakes or serpents,
    rain-making practices, lesser spirits, sacred rocks and springs, sun veneration,
    and the journey of the soul to an afterworld across a guarded log bridge toward
    a western Elysian Field.
  language: English
  quote_policy: summarized
