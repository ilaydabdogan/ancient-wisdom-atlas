- id: claim:1
  claim: Menomini regulation puberty dreams are reported by the author to closely
    resemble Potawatomi dreams, though the cylinder type had not been collected from
    the Potawatomi.
  claim_level: same_motif
  target: Potawatomi puberty dream patterns
  evidence_refs:
  - ev:7
  counter_evidence_refs:
  - ev:7
  confidence: medium
  limitations: The claim depends on the author's comparison and notes an absence of
    the cylinder type in collected Potawatomi material.
- id: claim:2
  claim: The passage cautiously links Menomini shared-vision bands with similar admission
    or association patterns among Woodland Potawatomi, Eastern Sioux, and Iroquois
    groups.
  claim_level: same_function
  target: Vision-based ritual or secret-society affiliation in Woodland Potawatomi,
    Eastern Sioux, and Iroquois contexts
  evidence_refs:
