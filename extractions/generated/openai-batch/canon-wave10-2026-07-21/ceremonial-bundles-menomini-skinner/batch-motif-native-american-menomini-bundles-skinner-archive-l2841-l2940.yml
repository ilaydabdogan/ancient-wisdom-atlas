canonical_text:
  quote: ''
  summary: 'Ethnographic description of Menomini puberty and related dreams: animal
    dream powers, protective transformations into lice or ants, indwelling animal
    medicine, ascent through a heavenly metal cylinder, ghost protection, sacred-bundle
    dreams involving journeys to supernatural powers, girls'' dreams of social preferment
    and children, dream eligibility rules, and loose ritual associations formed by
    people with similar visions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ordinary animal dreams are described as rare among the Menomini; the bear
    and buffalo are said to be most common, with buffalo, bear, and weasel associated
    with war, healing, hunting, courage, or success.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lice could be appointed by a dream guardian to remain with and care for a
    dreamer; such a dreamer was not to destroy the parasites and might become a louse
    to escape danger.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In a brief account, three women chased by enemies through a swamp use dream
    power to become ants, crawl into an anthill, and avoid discovery.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Certain persons were thought to possess turtles or fish inside their bodies,
    placed there by a great power dreamed of by the faster; a taboo involving a dish
    touched by a menstruating woman could cause the medicine to die and be vomited
    forth, killing the owner.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A sacred metal cylinder is described as standing in the center of the heavens;
    a dreamer could ascend through the tube and receive gifts from gods at the top.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: One man dreamed that spirits of the dead pitied him; when he was in danger,
    a ghost stood between him and the danger to ward off attack.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Some dreams gave the faster the right to own a sacred bundle and usually involved
    a visionary journey to the home of thunderers, the morningstar, or evil powers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Girls could have the dream types already described, and also a class of dreams
    concerning social preferment, brave sons, many children, a tall pole with a flag,
    or sacred families of sky sisters.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: Eligibility for dreaming is denied to anyone long past puberty or anyone who
    has had sexual intercourse.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: People with similar visions could associate in loose bands or cults; buffalo
    dreamers performed annual ceremonies together, and thunderer dreamers briefly
    pooled rites around a drum before lightning struck it.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:12
