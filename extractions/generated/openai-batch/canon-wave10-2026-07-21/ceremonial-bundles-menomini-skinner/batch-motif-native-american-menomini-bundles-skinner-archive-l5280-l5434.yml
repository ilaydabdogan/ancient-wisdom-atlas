canonical_text:
  quote: ''
  summary: 'The passage summarizes and quotes comparative accounts of Indigenous afterlife
    beliefs: souls pass to a southern or southwestern paradise, a dog guards the entrance,
    grave goods are buried with the dead, and unworthy persons go to infernal dwellings.
    It then quotes Roger Williams on Narragansett deity names, including a great Southwest/Sun
    God, directional gods, a children''s god invoked by a dying man, and Sun, Moon,
    Sea, and Fire gods. The final section defines Menomini medicine bundles as Petcikunau,
    lists four basic types, and gives two possible origins: supernatural instruction
    or gradual accretion of charms.'
  language: English
