canonical_text:
  quote: ''
  summary: The passage describes Menomini lacrosse as a religious game associated
    with thunder power, tobacco invitations, feasting, prizes, sacred objects, dream-directed
    conduct, medicines for success, and occasional funerary dedication to a deceased
    thunder man. It then begins a description of girls' shinney as an annual game
    honoring the sacred sisters of the eastern sky, with tobacco invitations, team
    captains, eight prizes, and a sacred shinney stick kept apart from ordinary play.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lacrosse is described as rarely or never played for amusement alone, but for
    a religious motive, and generally given once a year by a man with thunder power.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the lacrosse game, bits of tobacco are sent by messengers to desired
    guests, who are told the day and hour of the game.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The lacrosse host prepares a feast, brings goods such as mats, calicoes, and
    beaded belts as presents for winning guests, hangs them on crossbars, and lays
    a sacred war club, pipe, and thunder charms on a mat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lacrosse host does not take part in his own game and is later described
    as sitting by while others play.
  category: action
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:5
  text: Delegated leaders collect the players' lacrosse bats, shuffle them, and lay
    them in two equal rows; players join the side on which the thunderers have decreed
    their bats shall fall.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: An old man or chief who has been fed addresses the players, explaining why
    and for whom the game is played and telling them to play roughly or gently according
    to the host's original dream.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Men on one side usually mark one cheek with red paint so they can be distinguished
    from their opponents.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The lacrosse contest begins when the ball is tossed among the gathered players;
    each side tries to get the ball to the opponent's goal, and the first side to
    score four goals wins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the conclusion of the lacrosse game, prizes supplied by the host are distributed
    among the winners.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Special medicines are reported for success in lacrosse, and many champions
    attribute their skill to these medicines.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some lacrosse games are given for a recently deceased person if that person
    was a thunder man.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The text reports that players in ancient times were said to wear deer tails
    tied to their backs during the game, while noting uncertainty about the report.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Girls' shinney is described as an annual game played in honor of the sacred
    sisters of the eastern sky, as lacrosse is played by men.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: A girl who decides to sponsor shinney sends tobacco to two women, asking each
    to gather a team; those women then send tobacco to other women of their choice.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: For shinney, eight prizes offered by the girl are hung near a goal post, and
    a sacred shinney stick with tobacco is placed beside them.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: The sacred shinney stick is made by the girl's parents when they learn she
    is supernaturally endowed; it is ornate, carved, daubed with red paint, kept wrapped
    in a secret place, and not used in ordinary play.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: After the shinney arrangements, tobacco is given to the girls who smoke, and
    the hostess addresses them; the provided passage cuts off during the account of
    her address.
  category: sequence
  evidence_refs:
  - ev:10
