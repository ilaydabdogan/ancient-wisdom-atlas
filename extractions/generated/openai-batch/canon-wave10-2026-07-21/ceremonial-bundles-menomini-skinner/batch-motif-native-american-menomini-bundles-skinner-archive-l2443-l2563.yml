comparison_claims:
- id: claim:1
  claim: The passage explicitly notes similar offering poles among Eastern Cree, Saulteaux,
    Ojibway, and Potawatomi, while contrasting Menomini practice with Sauk and Fox
    dog sacrifice tied to poles.
  claim_level: same_function
  target: Neighboring Great Lakes and Algonquian offering-pole practices; Sauk and
    Fox dog-sacrifice variant as a contrast.
  evidence_refs:
  - ev:1
  counter_evidence_refs:
  - ev:1
  confidence: medium
  limitations: The comparison is observational and does not establish origin, transmission,
    or identical ritual meanings; the dog-sacrifice element is explicitly absent in
    the observer's Menomini experience.
- id: claim:2
  claim: The Ojibway baby-board miniature hockey stick and balls are tentatively connected
    by the author to the same reason as the Menomini girls' game under sacred sisters'
    protection.
  claim_level: same_function
  target: Ojibway infant-associated miniature hockey-stick-and-balls practice.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: low
  limitations: The passage uses tentative wording, and the Ojibway reason is inferred
    rather than independently explained in this excerpt.
