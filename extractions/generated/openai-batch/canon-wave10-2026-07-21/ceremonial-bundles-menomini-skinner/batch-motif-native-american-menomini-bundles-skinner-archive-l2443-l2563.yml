canonical_text:
  quote: ''
  summary: The passage records Menomini offering poles, sacred games connected with
    thunderers and female guardian sisters, four southern-sky sisters associated with
    directions, colors, winds, and games, seer-diagnosed causes of newborn crying,
    recognition of reincarnated deceased persons in infants, family lucky names, and
    perforated infant moccasins meant to keep a child's soul from returning over the
    Spirit Road.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Poles with tobacco and other offerings are described near Menomini lodges,
    usually for a personal guardian and sometimes for other powers.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The observer states he has not seen a sacrificed dog tied to such a pole among
    the Menomini, unlike the Sauk and Fox comparison mentioned in the passage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A violent game is treated as equivalent to war and is said to delight the
    thunderers, who play it among themselves, while sacred sisters play shinney.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A child under the sacred sisters' protection is expected to have the game
    played once yearly in spring; quarrels anger the sisters, and neglect can cause
    sickness until a game is ordered.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Four related sisters live in the southern sky but may roam the four compass
    points.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Tiaiyasin is the eldest southern-sky sister and controls the four winds; Getciyacinumki
    is red, travels east, and causes the red morning glow; Otcikakiu is black and
    goes north.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: The southern-sky sisters may animate human girls; women ornament broadcloth
    dresses with silk in the sisters' colors as a prayer for protection, and the sisters
    possess the bowl and dice game.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:8
  text: A seer may find that a newborn's crying is due to a desire for a dress, earrings,
    or a toy, rather than an offense to gods.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: A seer may identify a newborn as the reincarnation of a long-dead person by
    resemblance, cheek paint traces, or ears already pierced, after which the child
    is to be called by the deceased person's name.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:10
  text: Children have family lucky names distinct from public names, with fixed names
    by birth order and gender; the eldest son and daughter names are related to the
    thunderers.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:11
  text: Infants wear moccasins with perforated soles because the child's soul is fresh
    from the land of spirits and might otherwise be enticed back over the Spirit Road
    by old comrades.
  category: action
  evidence_refs:
  - ev:12
