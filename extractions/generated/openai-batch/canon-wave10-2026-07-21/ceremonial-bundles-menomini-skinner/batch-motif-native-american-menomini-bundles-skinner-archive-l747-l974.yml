  quote: "“the animal side always won because the bears were strongest in war”"
  summary: The passage describes Menomini gentes and subgentes, rules of relatedness
    and non-intermarriage, gentile names, totemic animal associations, dream-guardian
    naming, lists of animal, bird, and natural-kind clan names, notes on mythical
    and servant bears, a dream about four judges of life at the top of a heavenly
    cylinder, recent intrusive totems, and a former lacrosse division between bird-totem
    men and animal-totem men that is compared to a Winnebago upper/lower phratry system.
  language: English
