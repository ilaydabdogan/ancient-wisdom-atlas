canonical_text:
  quote: ''
  summary: The passage describes Menomini social norms as emphasizing individual rights
    over property and personal decisions. It states that husbands could not dispose
    of wives’ or children’s property, that family members could trade their own possessions
    without interference, and that even infants had rights to their belongings. It
    then reports the ethnographer’s judgments about premarital female autonomy, moral
    standards compared with Ojibway, Cree, and white rural communities, and the extension
    of individual autonomy into public promises and business honor.
  language: English
  quote_policy: summarized
