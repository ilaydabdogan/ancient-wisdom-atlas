- id: obs:1
  text: The Menomini, also called the Wild Rice People, are described as a small Algonkin-speaking
    tribe living in Shawano and Oconto Counties, Wisconsin, near their original habitat
    on Green Bay.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the Menomini numbered about fifteen hundred and that
    perhaps one third still retained their former religion and pagan practices.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage recounts Menomini contact with whites beginning around 1634 with
    Jean Nicollet at Green Bay and summarizes later political and military relationships.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The writer says he studied Menomini ethnology for four summers with the assistance
    of John V. Satterlee.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
