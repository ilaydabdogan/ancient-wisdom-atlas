  claim: The beaver hunting and fishing medicine bundle is attributed by Jim Wisu
    to Utagami, or Fox, origin, suggesting a nearby Great Lakes tradition connection
    within the passage’s own account.
  claim_level: historical_contact
  target: Utagami / Fox origin of the beaver bundle
  evidence_refs:
