candidate_motifs:
- id: motif:1
  label: Fasting youth receives spirit-given medicine bundle
  taxonomy_refs:
  - initiation
  - wisdom
  basis: The youth fasts, receives repeated spirit appearances, accepts the revelation,
    and transmits instructions for making the beaver bundle.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage is ethnographic description and does not explicitly call the
    event an initiation; taxonomy references are approximate motif-family matches.
- id: motif:2
  label: Animal chief grants hunting power
  taxonomy_refs:
  - sacred_exchange
  basis: The youth says the chief of the beavers living in the middle of the ocean
    gave him the rite, and a successful trap demonstration follows before elders.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not describe a negotiated exchange with the beaver chief,
    only a gift or grant of power.
- id: motif:3
  label: Songs and odors lure animals to traps
  taxonomy_refs: []
  basis: The medicine’s odor lure is applied to snares, while formulae and songs invoke
    aid and call game or fur-bearing animals to traps.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:7
  confidence: high
  cautions: No external taxonomy reference is supplied for hunting lure medicine.
- id: motif:4
  label: Ambivalent medicine usable for hunting and witchcraft
  taxonomy_refs:
  - duality
  basis: The same or related bundle is primarily for hunting and trapping but also
    has sorcery and witchcraft uses in evil-minded hands.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage groups several medicines and bundles; the exact boundaries
    between them may require human review.
- id: motif:5
  label: Sympathetic sorcery through a victim’s hair
  taxonomy_refs: []
  basis: A sorcerer places the intended victim’s hair in a packet, after which the
    victim is said to bleed slowly to death unless counteracted.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: No available taxonomy reference directly names hair-based sympathetic
    magic.
- id: motif:6
  label: Counter-medicine and counter-sorcery diagnosis
  taxonomy_refs: []
  basis: Some medicines oppose harmful medicines, and a powerful medicineman can identify
    and frustrate a sorcerer’s attack.
  evidence_refs:
  - ev:3
  - ev:11
  confidence: high
  cautions: The passage gives limited procedural detail about the counteraction.
- id: motif:7
  label: Serpent-killing medicine yields enemy-destroying powder
  taxonomy_refs:
  - serpent
  basis: The bundle can destroy the Misikinubikuk or great hairy snakes; the sorcerer
    then uses parts of the snake to make medicine for harming enemies.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The serpent taxonomy ref is supported by the passage’s explicit identification
    of great hairy snakes, but broader comparative interpretation is not made here.
