canonical_text:
  quote: ''
  summary: The passage describes a beaver hunting medicine bundle, its lures, songs,
    origin narrative, and related sorcery uses. A fasting youth receives a powerful
    hunting and fishing medicine from a spirit or beaver chief, demonstrates it before
    elders, and attributes its efficacy to above and beneath gods. The passage also
    describes medicines for witchcraft, counter-medicines, sympathetic attack using
    a victim’s hair, and a procedure for killing great hairy snakes and turning their
    parts into harmful medicine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The beaver medicine is used to capture animals, especially beaver, and includes
    a dried beaver head, five small bundles of powder and roots, and scent lures applied
    to traps with water and a twig.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Formulae or songs are sung to call game to the trap and to increase the effectiveness
    of the lure.
  category: action
  evidence_refs:
  - ev:1
