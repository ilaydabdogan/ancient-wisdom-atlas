  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The odor of bad medicines is said to be fatal to a snake.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Jim Wisu reported that the bundle was of Utagami, or Fox, origin.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A powerful hunting and fishing medicine was given to a fasting youth by a
    spirit that appeared repeatedly until the youth believed the revelation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After accepting the revelation, the youth invited twenty grayheaded men, offered
    them tobacco, and announced that they would make a beaver bundle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The youth said the chief of the beavers, who lives in the middle of the ocean,
    gave him the rite or power he was about to perform.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: An attendant placed a trap where water was drawn, and after the elders smoked,
    a beaver was found in the trap.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The youth interpreted the caught beaver as showing the friendship of the above
    and beneath gods, who had given him the power.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A necklace with a suspended bottle of medicine is worn by the user of the
    Beaver Hunting Bundle.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Beaver Hunting Bundle is primarily for hunting and trapping beaver and
    other game, but it can also be used in sorcery and witchcraft by an evil-minded
    person.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The beaver hunting medicines are described as three in number, with a dried
    beaver body and a tin box containing seven kinds of medicine powder.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: Each beaver hunting medicine has a song to invoke supernatural aid and lure
    beaver and other fur-bearing animals to traps.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The evening before using the beaver hunting medicine, the bundle owner makes
    a feast of dried blueberries and dried sweet corn.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: A small metal box contains two packages of strong medicine used to overpower
    the medicine of the beaver.
  category: object
  evidence_refs:
  - ev:8
- id: obs:17
  text: For general witchcraft, fifteen medicines made of powdered roots and similar
    materials are kept in separate packages inside a small European-made trunk.
  category: object
  evidence_refs:
  - ev:9
- id: obs:18
  text: Five deadly sorcery medicines used to kill an enemy include a buffalo tail,
    a grizzly bear claw, and four packages of powdered medicine.
  category: object
  evidence_refs:
  - ev:10
- id: obs:19
  text: A sorcerer places a hair of the intended victim in a packet, after which the
