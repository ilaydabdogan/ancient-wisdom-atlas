canonical_text:
  quote: ''
  summary: The passage describes Menomini childhood protections and naming-related
    practices involving thunderers for boys and sky sisters for girls. Boys under
    thunderer protection receive a ball stick or tiny war club as a protective charm,
    while girls under sky-sister protection receive female game implements. Owners
    of these amulets must play sacred games annually for their heavenly patrons; neglect
    is linked to sickness, and games may be prescribed to mollify disease-sending
    powers. The passage also recounts four pure virgin sisters who after death live
    in the eastern sky below the morningstar, influence the destiny of women, and
    may descend to enter a woman, producing a gifted girl child who displays unusual
    signs and weather knowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy child is said to be under the protection of the thunderers and may be
    called a thunder child or described as being in league with thunder.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: People with thunder as guardian address thunder when it is heard and may go
    out in the rain to commune with the thunderers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Menomini man observed in 1911 offered tobacco to the thunderers during a
    night thunderstorm and asked them to pass aside.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A boy whose name is changed must receive a ball stick or tiny war club as
    a memento and charm against disaster, especially in war, and must keep and carry
    it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A girl child is described as under the protection of the sky sisters and must
    receive a shinney stick and double ball, or a bowl and dice game.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The amulets carry a lifelong obligation to play at least one sacred lacrosse,
    shinney, or dice game each year in honor of the owner’s heavenly patrons.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Neglecting the annual game obligation is said to bring misfortune, especially
    sickness; a prescribed game can mollify the powers who sent disease.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Four girls remained virgins and lived so purely that, when they died, they
    were permitted to live forever in the eastern sky below the morningstar.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The sacred sisters influence the destiny of women; the youngest is described
    as the most powerful and the eldest as the least powerful.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: When longing to be on earth, one of the sky sisters may drop down and enter
    a woman, after which a child is born to an earthly couple.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The child connected with the sky sisters may differ from other children by
    unusual crying, sudden silent sadness during play, accurate weather prophecy,
    or later self-identification.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: When the parents learn that the girl is under the protection of the eastern-sky
    sisters, they make the female shinney game for her because it is the sisters’
    property and emblem.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage notes similar baby-language seer or naming customs among Omaha,
    Kickapoo, Ottawa, Ojibway, and Potawatomi, and similar thunder-guardian ideas
    among Potawatomi.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:10
