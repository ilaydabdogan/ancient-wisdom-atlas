canonical_text:
  quote: ''
  summary: The passage describes the fourth-day division of hunt meat connected with
    a medicine bundle, a thanksgiving feast and tobacco offering to the bundle, a
    red medicine with tiny arrows used against enemies, and the power of partial bundle
    contents or even dreams of the bundle. It then recounts how Ma'nabus, troubled
    by the people's suffering, receives a new bag from the powers above and below.
    The bag contains deer and wolf medicines. After Ma'nabus doubts its power, the
    grandparents take him to an island in the center of the ocean, open the bag, tap
    sticks, sing, and cause animals to appear. Ma'nabus accepts the medicine, returns
    to earth, gives it to mankind, and teaches the songs required when opening it.
    The bundle is identified as Kitagasa Muskiki, Spotted Fawn Medicine, with contents
    including a bag, god dolls, a medicine pouch, wolf tail medicine, a wooden man
    figure, and fawnskin medicine.
  language: English
  quote_policy: summarized
