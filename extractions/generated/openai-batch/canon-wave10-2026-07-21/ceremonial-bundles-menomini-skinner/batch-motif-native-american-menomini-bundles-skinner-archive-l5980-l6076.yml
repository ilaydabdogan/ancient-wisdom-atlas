canonical_text:
  quote: ''
  summary: The passage describes Menomini war bundles, their dream-authorized and
    variable contents, standard wrappings, a painted internal skin robe showing thunderers
    and other powers, and a bundle-opening rite in which the owner prays, offers tobacco,
    recites his dream along the painted diagram, and warriors place tobacco on figures
    of their totems or guardians.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A note states that actual objects were not given to an Indian in dreams; instead,
    dreams provided descriptions of objects and the right to make them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A war bundle is described as opened and spread out, showing wrappings, whistles,
    rattles, tobacco offerings, charms, food bowls, carved thunderer images, birdskins,
    a buffalo tail, a crow head, feathers, and medicines.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage identifies recurrent war-bundle features including bird, snake,
    and weasel skins, reed whistles for signaling, deer-hoof rattles for sacred songs,
    and paint given by thunderers to cure the wounded.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Buffalo tails were found in two bundles, with the explanation that in some
    versions of the tradition the bison was among animals that agreed to help mankind.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other bundle contents vary according to instructions received in the owner’s
    dream.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A tradition says a wampum belt or equivalent should be kept as a gift for
    the warrior who slays an enemy chief, though such belts were not found in the
    collected bundles and were said in two cases to have already been awarded.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The inner wrapping of the medicines should be white tanned deerskin, giving
    the bundles the name Wapana'kian or “white-mat”; the outside wrapping is usually
    a reed mat, with a woven Indian-made bag as an alternative.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: One sacred internal skin wrapper was painted with devices representing thunderers
    and the ways they aid mankind.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The painted figures are said to represent powers that appeared to the owner
    in his war dream and to portray their promises of success.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the bundle was opened, the painted skin was spread on the ground; after
    a prayer to the thunderers and an offering of tobacco, the owner recited his dream
    while following the diagram.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The owner followed the diagram from the top of the skin downward to the inner
    square, then around the sacred field from east to west, described as following
    the wind or the sun’s course from horizon to horizon.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the narrative, each assembled warrior laid tobacco on any figure representing
    his totem or guardian and prayed for that power’s patronage during the next campaign.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A figure caption describes thunderers in the third tier of heaven bestowing
    strength on Mike'wuk, or war leaders, with lightning lines shown from the eyes
    and beak-like nose of one figure.
  category: setting
  evidence_refs:
  - ev:8
