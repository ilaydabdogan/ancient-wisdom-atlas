  quote: ''
  summary: The passage describes a Menomini cosmological scheme of upper and lower
    worlds divided into four tiers, each ruled by a presiding power and inhabited
    by ranked animal or bird beings. It also reports sacrifices and homage to these
    powers, contrasts Mate Hawatuk with a white underground bear, and gives the author's
    regional comparisons with neighboring traditions.
