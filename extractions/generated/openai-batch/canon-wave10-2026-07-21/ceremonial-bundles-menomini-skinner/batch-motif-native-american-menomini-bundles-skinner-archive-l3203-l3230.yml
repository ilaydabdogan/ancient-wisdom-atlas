canonical_text:
  quote: ''
  summary: A young Shanapow fasts for eight days and dreams of a sacred being associated
    with Keshena Falls. In the dream he is shown a rock in the falls and discovers
    a sacred bear kettle connected with the underneath god and sacrifice feasts. He
    then finds and kills a bear, makes a sacrifice, and eats with invited others.
    The passage also describes later ritual handling of the kettle with maple sugar
    offerings, a feast and song for the monster below the falls, and Shanapow’s keeping
    of a bear cubskin set on a stick during sacrifices.
  language: English
  quote_policy: summarized
