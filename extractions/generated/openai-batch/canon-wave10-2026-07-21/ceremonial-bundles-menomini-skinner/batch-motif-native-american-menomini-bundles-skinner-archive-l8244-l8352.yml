canonical_text:
  quote: ''
  summary: The passage describes restrictions on eating game taken through a medicine
    power, public proclamation and song of medicine powers in mitawin rites, a comparative
    Wisconsin Ojibway winter bear-hunting ceremony, a Menomini bear-cub-skin bundle
    parallel, and the provenance, structure, functions, and contents of a dual Big
    Bear and Little Beaver medicine bundle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Game taken through the medicine power is not to be eaten by women or children
    until the hunter fumigates it by burning opaseteikun root to draw out the power.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the restriction on eating unfumigated game is not observed, the transgressors
    are said to turn black and die.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: During parts of the mitawin rites, a charm owner may proclaim strong powers,
    dance, and sing in their honor; the beaver-power dancing song refers to the hunter
    searching for game.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The quoted Wisconsin Ojibway bear-hunt custom has hunters assemble apart from
    women and children, with a chief Medicine Man presiding over drum-beating and
    songs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the quoted Ojibway ceremony, the chief Medicine Man places cloth, calico,
    a stuffed cub bear-skin, and a filled pipe before him, then addresses the bear
    as brother and asks it to show itself and give its body for food.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ojibway ceremony includes songs recited from inscribed boards, passing
    the drum and boards around, and painting hunters and dogs with vermillion from
    the medicine bag before the hunt.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Skinner reports a Menomini bear cub skin set on a painted stick and addressed
    in the same manner; it belonged to a bear bundle containing roots, herbs, and
    other medicines.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dual bundle was originally owned by the Ojibway Wamekwayanamit, sold to
    the Menomini Kawikit, and descended to Antoine Shipikau, from whom it was obtained
    for the Museum.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The medicine contents were kept in a small old European-made trunk instead
    of the usual Indian-made covering.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The bundle contents are divided into a Big Bear Bundle used to shield the
    owner from witches and guard other medicines, and another charm used to assist
    in taking game, especially beaver.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Big Bear Medicine consists of a buffalo tail, a grizzly bear claw, and
    three small packages of roots and herbs.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The grizzly bear claw is described as protective and as an antidote for disease,
    with sickness attributed to rivals who possess supernatural aids; a small scraped
    portion of the claw is taken in water with a song formula.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
