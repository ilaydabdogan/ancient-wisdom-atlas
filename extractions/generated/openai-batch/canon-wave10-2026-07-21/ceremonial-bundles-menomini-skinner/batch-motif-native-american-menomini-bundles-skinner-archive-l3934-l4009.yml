canonical_text:
  quote: ''
  summary: The passage describes Menomini burial practices, including earlier birchbark
    grave lining and wrapping, a special upright burial requested by a medicineman
    after a vision, funerary goods and tobacco placed near the grave, warrior speeches
    recounting coups, marked tallies on a grave-head stake, slain enemies' spirits
    assigned to accompany the deceased on the Milky Way spirit road, a four-day journey
    requiring nightly fires and guidance, and a redistribution of funeral goods through
    speakers and their female relatives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Earlier graves were lined with dry birchbark, corpses were wrapped in birchbark,
    bodies were buried at full length, and implements were not placed in the grave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One old medicineman was buried sitting upright at his dying request after
    a vision commanded that his head point skyward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Goods brought by women of the family were piled at the head of the grave,
    and the deceased person's medicine bag with a tobacco offering was placed nearby.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men described as tested for bravery were invited to speak at the funeral,
    and one advanced to the grave-head stake to recite his bravest deeds aloud.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The warrior speaker named an enemy he had killed and stated that the enemy's
    spirit should accompany the deceased person's soul over the spirit road, identified
    parenthetically as the Milky Way, to the hereafter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bystanders responded in chorus, and the warrior cut a nick in the stick while
    an attendant painted a red X for each coup; in some cases a shaved stick was used
    to show each deed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: More than one warrior could come forward and make a speech until all invited
    speakers had finished.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The deceased person's soul was said to travel four days to reach the hereafter
    and to be unable at first to build necessary fires on the nights of the journey.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The spirits of slain warriors, controlled by their slayers, were said to be
    able to build the fires and guide the deceased person's feet because they had
    long been dead and knew the usages of the other world.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: After the warrior speeches, the attendant apportioned the grave-side goods
    among the speakers; the speakers then had to give them to their nearest female
    relatives, who later had to give equal-value presents to the original donor.
  category: sequence
  evidence_refs:
  - ev:8
