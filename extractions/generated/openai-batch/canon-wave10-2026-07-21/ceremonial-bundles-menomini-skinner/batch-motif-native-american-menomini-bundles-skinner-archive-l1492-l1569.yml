canonical_text:
  quote: ''
  summary: The passage describes the civil and ceremonial duties of the Mikao and
    warrior police, including public order, announcements, ceremonies, rice-harvest
    regulation, and mediation. It details the Sakanahowao, a bear-clan peace maker
    who kept a peace pipe said to derive from the chief underground bear. A footnote
    describes the last known pipe and regalia and explains symbolic meanings assigned
    to discs, a heart ornament, brooches, red ribbons, and the red pipe stem. The
    closing paragraph describes the peace maker’s role in stopping reciprocal revenge
    killings after murder.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Mikao and men of notable bravery served civil as well as military functions,
    including policing the camp, making public announcements for chiefs, managing
    ceremonies, regulating the wild rice harvest, and acting as intermediaries in
    quarrels.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The warrior police were called Nanawetauwuk, sometimes Minisnowuk, and more
    rarely Akitcita; a note states that Akitcita was borrowed indirectly through Ojibway
    or Chippewa usage.
  category: speech
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: The badge of civil authority was a scalloped leather necklace with a round
    sun-like figure suspended over the breast, similar to but smaller than the insignia
    worn by a head man.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: One member of the warrior police, necessarily from a bear clan, was called
    Sakanahowao and kept the peace pipe said to have been given to the bear clans
    by the chief underground bear.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The last recorded Sakanahowao was Keshina; the last peace maker’s pipe and
    regalia were obtained from his son.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The described regalia consisted of thirty-two German silver ornaments on harness
    leather arranged as a collar and pendant, including discs, a heart-shaped ornament,
    and a pendant falling in front.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ten graded discs forming the pendant were called the morningstar’s tail
    and were said to signify that day, joy, and brightness follow night, sorrow, and
    crime.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The right half of the collar was said to signify the goodness, purity, and
    justice of Mate Hawathk, the supreme overhead god, toward the wronged party.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The brooches on the right and left of the collar were described as looking
    into the central heart, corresponding to divine inspection of human hearts or
    souls.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The left half of the collar referred to the sympathy of the Evil God, the
    great underground bear, for the murderer.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The large round brooch at the end of the morningstar’s-tail series referred
    to the intercession of the sacred white bear for the criminal.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The red ribbons at the end of the pendant and the red color of the peace-pipe
    stem were said to signify the shedding of blood.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: After murder, the uncle or nephew of the slain man was expected to kill the
    murderer unless authorities intervened, and reciprocal killing could continue.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The proper authorities for intervention were the Sakanahowao or warrior chief
    and his attendant, linked to bear totems whose heads came from the underworld
    and who held the pipe and office of peace maker.
  category: relationship
  evidence_refs:
  - ev:11
