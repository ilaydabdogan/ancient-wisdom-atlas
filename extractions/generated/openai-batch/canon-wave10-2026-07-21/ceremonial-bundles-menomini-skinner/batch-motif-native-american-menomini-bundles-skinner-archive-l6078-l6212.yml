canonical_text:
  quote: ''
  summary: The passage describes inheritance, purchase of instruction, and divine
    authorization for use of a Menomini war bundle; women occasionally empowered by
    thunderers; captions depicting thunderers, sky birds, lightning, medicines, and
    warriors; and a biannual fall and spring sacrifice involving opening the bundle,
    food, songs, tobacco offerings, distribution of old tobacco, and burning tobacco
    in fire on behalf of the thunderers.
  language: English, with transcribed Menomini ritual speech and English translations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the death of a bundle owner, the bundle goes to the son who showed the
    most interest; a family member may pay goods and tobacco for instruction until
    the ritual is learned, after which the father may transfer the bundle before death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A son may not use the bundle without a divine revelation; if a bundle descends
    to a woman, she generally instructs her nearest male relative, who cannot use
    it unless permitted by the thunderers, though some say instruction may be bought
    from an accredited mikao.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that women are occasionally empowered by the thunderers
    to possess the bundle and that tradition tells of several women successful as
    partisans.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Figure captions identify the Chief Thunderer and servants, Nasewuk mythic
    sky birds, eagles and other high-flying birds in a second tier of heaven possessing
    lightning, lesser birds in a first tier of heaven with root medicines, healing
    herbs given to men by the Thunderers, warriors disguised as birds, and warriors
    in combat.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Biannual sacrifices occur in the fall and early spring when the voices of
    the Thunderers are first heard; the bundle is opened and the leader addresses
    a grandfather while making the sacrifice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A small feast of meat is prepared and placed in wooden bowls belonging with
    the bundle; songs are sung, each representing a stage of action at the feasts.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: An attendant feeds the mikao with a wooden skewer and states that the thunderbird
    gave the war bundle and that the man will eat what is offered in the thunderbird’s
    stead.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the conclusion of the feast, two kinds of tobacco are given to the bundle,
    the white mat, and the great thunderbirds who made it and gave it to man and the
    earth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The mikao passes out stale tobacco from former offerings to the people and
    tells them to take part; if alone, the mikao handles the renewing of the tobacco
    and other details himself.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The mikao casts tobacco on the flames, gives it to the fire called grandfather,
    asks the fire to consume it on behalf of the thunderers, and prays for long life
    and happiness for his family.
  category: speech
  evidence_refs:
  - ev:9
