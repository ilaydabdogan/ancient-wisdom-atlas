canonical_text:
  quote: ''
  summary: 'The passage describes the contents and decorations of a fawnskin hunting
    medicine bundle, including fawn medicine, male and female figures, medicine packets,
    panther, women, and eagle designs. It then describes a hunting ceremony: the party
    camps in the woods, builds a game scaffold, opens the bag with tobacco, feast,
    speeches, and songs, shakes and taps medicines, sets up ancestral male and female
    figures, and uses powder in fire to blind saxkanao. The hunters carry the medicines
    during the hunt, smudge selected deer parts afterward, and hold return feasts
    to feed and thank the bundle. The passage closes by explaining that Ma''nabus,
    because the great bundle and fawnskin medicine were powerful but not widely available,
    decided to make and distribute a smaller hunting bundle to help people hunt and
    reduce starvation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bundle contents include fawn medicine, male and female figures, a fawnskin
    medicine containing a human figure, human hair, and powdered medicine, plus other
    small medicine packets or bags.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The male figure is said to represent great powers, identified as grandfathers
    and grandmothers, who gave the bundle to Mii'nabus to transfer to the people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The enveloping bag has panther designs on one side, a row of women joining
    hands on the reverse, and eagle designs beneath; the passage states the panthers
    and eagles are decorative or chosen as worthy great animals, while the women show
    that women made the bag.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The party goes to a distant place in the woods, makes camp, and erects a scaffold
    to hold game, doing this first to show faith in the powers of the bag.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the evening the bag is opened with tobacco, a feast, and speaking; songs
    begin, the bundle owner shakes the fawn medicine like a rattle, others hold medicines,
    and the singers tap the medicines on the ground while calling for desired game.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The male and female figures are set up on sticks on either side of the open
    bundle and its contents so that the powers they represent may be present and take
    part in the ceremony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Powder is thrown in the fire to blind saxkanao.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the following day the hunters set out carrying medicines, including the
    wooden figures; the bundle owner carries a wolf tail in a bag at his belt, which
    is described as powerful for causing deer to give up to him as they do to the
    wolf.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the hunt, the heads, legs, and lungs of deer are smudged with ingredients
    from the largest fawnskin bag and are then fit to eat; the briskets belong to
    the bundle owner.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After returning home, the bundle owner boils the briskets, invites relatives
    to a feast, opens the bag, spreads out its contents, and tobacco is smoked and
    speeches are made to give food and tobacco to the bundle in gratitude.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The return ceremony continues for the first three nights after the return,
    ending with a thanksgiving speech asking the bag to continue its bounty and promising
    remembrance when game is killed and eaten.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The feast and good treatment of the bundle are described as necessary because
    the bundle may not keep off the saxkanaouk unless treated well; tobacco must always
    be kept with the bundle.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Ma'nabus, still concerned that saxkanao troubled the people and that the great
    bundle and fawnskin medicine were too limited in distribution, decided to make
    and distribute a smaller hunting bundle to help people hunt and reduce starvation.
  category: action
  evidence_refs:
  - ev:9
