canonical_text:
  quote: ''
  summary: The passage explains Menomini medicine bundles and charms as sacred objects
    empowered by contact with supernatural donors, dreams or visions, and especially
    ritual songs. It describes the transfer or purchase of bundles, the non-transferable
    character of the original dream, secrecy around meetings with supernatural donors,
    the role of seers, comparisons with other tribal bundle systems, and a Seneca
    secret medicine powder said to resemble an early form of sacred bundle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A medicine bundle or charm is said to gain sanctity through ritual use and
    contact with the animating power of the supernatural donors it represents.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage distinguishes three qualities of a medicine bundle or charm:
    the object itself, power given by a dream, and the animating force of songs.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Possession of the songs is described as sufficient to let an owner use the
    bundle’s power, while the dream is valuable especially to the first possessor
    who received the vision and right to make the charm.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A Menomini speaker compares the songs in a bundle to the electric current
    that makes an electric car move.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author reports that old people say few living Indians are sufficiently
    old-style in life and custom to obtain great bundles or personal charms.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bundles proper are said to have many songs; the passage says that formerly
    there was a song for each object or group of objects, but many songs have been
    forgotten.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Seers are described as interpreting dreams and prescribing charms, especially
    for children thought to be descended from supernatural beings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Bundles and their rituals may be purchased, and the objective part of the
    bundle is transferred with the songs, but the dream need not be transferred.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In some cases, telling about the meeting between bundle owner and supernatural
