canonical_text:
  quote: ''
  summary: 'The passage recounts Menomini phratry and totem origins: Bear meets Wolf
    beneath a waterfall and is carried by Crane, accepting Crane and Wolf as younger
    brothers; Wolf later admits Dog and Deer. It describes Big Thunder and the Thunderers
    as rain-bringing laborers made by the Good Mystery, recipients of corn, and makers
    of fire after receiving it from Ma''na-bush, who stole it from an old man on an
    island in a great lake. The Thunderers exchange corn and fire with the Bear village
    for rice, settle with the Bear family, and kindle and distribute fire from a central
    long wigwam. The passage then lists present and variant arrangements of Menomini
    phratries and totems.'
  language: English
  quote_policy: summarized
