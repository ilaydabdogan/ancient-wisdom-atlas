    as stated in the passage.
- id: motif:3
  label: Fire obtained by theft and transmitted to a community
  taxonomy_refs:
  - sacred_theft
  basis: The Thunderers receive fire from Ma'na-bush, who stole it from an old man
    on an island in a great lake; the Thunderers then serve as fire makers and distributors.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: high
  cautions: The passage only briefly summarizes the theft episode and does not narrate
    its full sequence.
- id: motif:4
  label: Sacred exchange of staple foods and fire
  taxonomy_refs:
  - sacred_exchange
  basis: Thunderers offer corn and fire to the Bear village in return for rice belonging
