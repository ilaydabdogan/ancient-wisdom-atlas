  summary: The passage lists Menomini phratries and totems, comments on the fragmentary
    survival of knowledge about former social organization, and describes rules or
    customs concerning exogamy, patrilineal descent, inheritance, joking and avoidance
    relationships, nephew obligations in war and vengeance, father-in-law privileges
    in dividing bear game, totemic lodge grouping, and individual sacred packs.
  language: English
  quote_policy: summarized
