  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Menomini are described as formerly divided into bands known by the names
    of their chiefs, apparently during a displaced wandering period before reservation
    life.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Marriage outside the gens was required, and marriage within the gens was treated
    as incest because members claimed descent from the same totem.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Descent and inheritance are described as patrilineal.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Property of a deceased person largely went to those who cared for the person
    during the last illness unless heirs had been designated; part of the property
    paid for funeral ceremonies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Leaders for war or other purposes could be chosen from any gens or totem if
    the person proved worthy.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: A joking relationship existed with uncles, aunts, nephews, nieces, sisters-in-law,
    and brothers-in-law, while joking between cousins was tabooed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: In war, a nephew or brother-in-law was expected to follow a man, and the nephew
    was to serve and protect the uncle at risk of his own life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: If an uncle was killed, the nephew was expected to take a scalp in revenge
    or not return alive; the nephew is also described as the uncle's blood avenger
    in intertribal quarrels.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A man was not to speak to his mother-in-law and was to remain respectfully
