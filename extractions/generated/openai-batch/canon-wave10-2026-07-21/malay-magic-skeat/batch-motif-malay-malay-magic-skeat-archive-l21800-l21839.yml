  summary: 'The passage describes Malay funeral preparations: summoning religious
    functionaries or substitutes, notifying relations and friends, preparing the shroud
    and several possible coffin forms, cleaning and lining the coffin, placing earth
    and other substances in it, positioning tea-leaves near the corpse, and carrying
    the corpse to be washed. A broken footnote-like fragment mentions salt thrown
    on fire to drive away evil spirits or counter thunder.'
