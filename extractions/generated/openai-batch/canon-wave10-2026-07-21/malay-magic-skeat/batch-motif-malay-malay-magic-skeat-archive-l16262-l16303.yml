canonical_text:
  quote: ''
  summary: 'The passage describes equipment and procedure for catching a crocodile:
    a sharpened wooden piece is hidden inside a fowl bait, attached to twine, a long
    rattan line, and a visible float; the bait is placed on a small floating platform
    near the riverbank and secured to a branch or stake. If the gear disappears by
    morning, the crocodile is presumed to have swallowed the bait and gone off towing
    the rattan. The passage adds practical advice for pursuing an aggressive crocodile
    by boat rather than sampan, with a footnote explaining the sampan as a tree-trunk
    canoe.'
