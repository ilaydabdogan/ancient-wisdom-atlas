literal_observations:
- id: obs:1
  text: An opening charm repeats the action of sifting rice-ends over different bags
    and says that King Solomon bids haste while one bird is invited as another disappears.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the call, the operator is instructed to stand in the middle of the
    enclosure and address the souls of Princess Puding, Queen Kapor, and Queen Sarap,
    telling them to enter the Bundle and perch on the Ivory Railing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The call says that King Solomon has come to call the addressees and threatens
    them with a bear-cat, wild beasts, falling over seven valleys and seven knolls,
    and lack of food or drink if they do not come.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: An alternative charm begins with cutting a mengkudu branch, summons near and
    far birds, and tells birds with eggs, young, blindness, or broken limbs to come
    and assemble in King Solomon’s audience-hall.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The same alternative charm tells the named souls to come down to King Solomon’s
    audience-hall and put on King Solomon’s necklace, breast-ornaments, and armlets.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before entering the hut, the operator addresses the hearts of wild doves,
    names the hut the Magic Prince, names the tube Prince Distraction, and says the
    birds should be distraught with longing to assemble in King Solomon’s Hall.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The operator is told to put lips to the decoy-tube, sound the call, and repeat
    the mengkudu-stem formula or a longer version.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After wild pigeons arrive and enter the enclosure or Palace-yard, the operator
