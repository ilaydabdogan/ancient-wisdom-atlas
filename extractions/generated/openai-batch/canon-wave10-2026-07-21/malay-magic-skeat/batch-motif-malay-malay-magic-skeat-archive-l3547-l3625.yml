canonical_text:
  quote: ''
  summary: 'The passage describes several Malay kramats and spirit-associated sites:
    a rock kramat of Nakhoda Hussin, an orthodox jin linked with water, rain, streams,
    incense offerings, tiger guardians, and revelation to a village pawang; a tree
    kramat whose swelling is connected with agricultural prospects; the Machap kramat
    where oaths are treated with special fear; and cases of evil hantu occupying trees,
    requiring pawang exorcism or causing harm when a layman cuts such a tree.'
  language: English
  quote_policy: summarized
