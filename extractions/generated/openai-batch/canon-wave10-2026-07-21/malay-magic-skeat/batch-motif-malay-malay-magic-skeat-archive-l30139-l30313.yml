canonical_text:
  quote: ''
  summary: The passage describes Malay systems for determining lucky and unlucky times.
    It first notes colour associations for S’ri, Brahma, and Vishnu. It then outlines
    the Five Moments system, whose divisions are named Ahmad, Jibra’il, Ibrahim, Yusuf,
    and ‘Azra’il, arranged across parts of the day and days in a repeating table.
    Each division gives omens and prescriptions concerning lost animals or valuables,
    the truth of news, trade, planting, voyages, war, colours of clothing, facing
    directions, prayer, and postponement. The passage also mentions related five-part
    and seven-part timing schemes, including one based on the seven heavenly bodies.
  language: English
  quote_policy: summarized
