canonical_text:
  quote: ''
  summary: A reaping ceremony passage gives invocations to God, Prophet ’Tap, the
    named Rice, and named Dang figures; the procession goes through a lane in the
    rice to the mother-sheaf from which the Rice-soul is to be taken. Before baskets
    are set down, the Pawang recites words addressing herons and telling Spectral
    Reapers to retire. A footnote links some names to a Malay Annals story about two
    women whose rice field shone and whose rice was transformed into metals after
    a supernatural visitation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The invocation begins in the name of God and gives peace to Prophet ’Tap,
    who is said to be in charge of the Earth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says he knows the origin of the Rice, named S’ri Gading and Gemala
    Gading, and describes it as associated with the end and beginning of the clearing,
    scattered or cast down, and overrun by ants called Silambada.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker addresses Dang ’Pok, Dang Meleni, and Dang Salamat; Dang Salamat
    is described as carrying a pole slung on the back, and the addressed figures are
    asked to gather their attendants.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The invocation asks that safety and daily bread be granted by God.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: On reaching the rice, the procession files through a prepared lane in the
    rice until it reaches the mother-sheaf from which the Rice-soul is to be taken.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before the rice-baskets are deposited, the Pawang repeats lines addressing
    herons and Spectral Reapers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The recited lines ask herons to roost on the shaft of the speaker’s bow and
    command Spectral Reapers to retire so that baskets may be placed on the ground.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the Pawang’s recitation, the baskets are deposited.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A footnote identifies two of the invoked names as names of girls mentioned
    in the Malay Annals in connection with a strange event involving their rice.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the footnote’s Malay Annals account, two young women cultivate rice on
    Mount Sagantang Maha Miru; one night they see their rice-fields gleaming like
    fire, and Malin says the light may be a great snake or naga.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The footnote says that in daylight the two women find the rice grain converted
    into gold, the leaves into silver, and the stalks into brass; it adds that the
    prodigy was due to a supernatural visit from a descendant of Raja Secander Zulkarneini.
  category: sequence
  evidence_refs:
  - ev:6
