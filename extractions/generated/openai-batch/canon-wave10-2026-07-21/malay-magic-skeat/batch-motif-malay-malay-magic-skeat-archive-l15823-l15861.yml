canonical_text:
  quote: ''
  summary: The passage recounts the making of a creature from sugar-cane, stone, saffron,
    and betel-nut frond materials, its animation after prayer to God Almighty, its
    later treachery, and Siti Fatima’s curse and bodily alteration of it into the
    crocodile of the sea. It then describes Perak Malay Pawang procedures for hooking
    a crocodile using a slain white fowl, its blood on the line, observation of the
    fowl’s movements in water, and a spell invoking Tuan Putri Padang Gerinsing.
  language: English
  quote_policy: summarized
