- id: obs:1
  text: A female maker arranges sugar-cane joints as a backbone, peelings as ribs,
    a sharp stone on the head, saffron bits as eyes, and a betel-nut frond mid-rib
    and leaves as the tail.
  category: action
  evidence_refs:
  - ev:1
