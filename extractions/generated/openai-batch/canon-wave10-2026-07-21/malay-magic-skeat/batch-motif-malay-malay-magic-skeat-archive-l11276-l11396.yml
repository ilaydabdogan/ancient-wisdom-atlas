  quote: ''
  summary: The passage describes an ill-omened bee-tree whose falling branch injures
    workers, the ritual precautions and sacrifice used before felling it, the later
    death of the pawang, and explanatory notes on Malay and Sakai bee-tree charms
    and customs governing ownership, wax collection, and the dangers of climbing and
    guarding bee-trees.
