literal_observations:
- id: obs:1
  text: Men were sitting under an ill-omened tree plaiting ataps when a large branch
    fell without wind or other stated cause, breaking one man’s arm and injuring two
    others.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tree was to be felled because coolie houses stood nearly under it, but
    there was difficulty finding someone willing to fell it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Penang Malay agreed to fell the tree only if a pawang first drove away the
    demons.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pawang placed white and red cloth on sticks around the tree, burned incense
    in split bertam palm leaf-stalk contrivances, beheaded two white fowls, sprinkled
    their blood on the trunk, and performed incantations.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The tree was felled without mishap after the ritual actions.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pawang is said to have died about nine months after the felling.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The word Tualang, also given as Toh Alang or Sialang, is explained as a generic
    name for trees in which wild bees have built nests, meaning a bee-tree rather
    than a particular species.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The author states that the available bee-nest collection charms were chiefly
    from Sakais under Malay influence on the Selangor coast, though some were described
    as pure Malay charms.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Two cited charms refer to a peeling-knife or long-handled knife and the buttress
    of a Pulai-tree.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the Siak customs quoted, a sialang tree generally belongs to the finder
    if it stands in forest belonging to his tribe.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: If the sialang stands in another tribe’s jungle, the finder may take all the
    wax once and afterwards, during life, the wax of one branch; after his death the
    tree belongs to the tribe of that jungle.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Wax proceeds are divided into thirds among the tree proprietor, the climber,
    and the watchman below.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The climber’s work is dangerous because he climbs tall, branchless sialang
    trees using bamboo pegs driven into the trunk.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The watchman’s work is dangerous because he is said to face bears and tigers
    that come after wax and honey.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage lists several kinds of trees that become sialangs when inhabited
    by bees and distinguishes another bee, neruan, which nests in holes rather than
    trees.
  category: attribute
  evidence_refs:
  - ev:10
