canonical_text:
  quote: ''
  summary: The passage describes a Malay birth ceremony in which a Bidan is engaged
    around the seventh month of pregnancy by presenting a copper cherana vessel containing
    betel-related offerings. An embedded cited note gives instructions for obtaining
    a pelsit by drawing one's shadow into oneself, after which a child apparition's
    tongue becomes a living creature kept in a bottle. A footnote states that multiple
    Bidans, commonly seven and sometimes nine in romances, attended royal births,
    and notes their honorific status and severe responsibility.
