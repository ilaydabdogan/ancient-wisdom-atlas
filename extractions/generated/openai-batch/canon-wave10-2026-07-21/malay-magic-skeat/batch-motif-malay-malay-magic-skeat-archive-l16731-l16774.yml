canonical_text:
  quote: ''
  summary: 'The passage reports Malay snake legends: the uler kapak daun is said to
    be fed insects by birds; a python’s live gall-bladder kept in a jar is believed
    to develop into a serpent and, when dried, to serve as a small-pox remedy; the
    chintamani snake is said in Selangor to have once been a Raja, to be fed by birds
    that were its subjects, to be harmless and lucky, to appear bright and glittering
    blue, to occur in charms connected with the Rice-soul ceremony, and sometimes
    to spring from a bird-of-paradise egg; the cobra is said to carry a bright stone
    in its head whose radiance makes the head visible at night.'
  language: English
  quote_policy: summarized
