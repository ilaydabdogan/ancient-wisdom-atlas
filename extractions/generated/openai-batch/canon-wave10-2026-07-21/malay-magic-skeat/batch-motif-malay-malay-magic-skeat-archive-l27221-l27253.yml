canonical_text:
  quote: ''
  summary: During an invocation to spirits, the Pawang scatters saffron-stained parched
    rice in every direction while chanting. The chant greets and petitions the Holy
    Ones or Grandsires of the place, marks movement from the enclosure toward the
    four corners or extremities of the universe, asks pardon, commends the theatrical
    company and associated participants to the spirits' care, and asks that they not
    be harmed, oppressed, or deprived of livelihood, but be made cool and refreshed
    like the snake called chinta-mani.
  language: English
  quote_policy: summarized
