canonical_text:
  quote: ''
  summary: A Malay account explains the origin and continuing danger of the Spectre
    or Wild Huntsman. A boy learns that his father has become an evil forest spirit,
    receives names and identifying signs from his mother, enters the forest, and is
    recognized by the huntsman as his son. The huntsman explains the location of a
    borrowed chisel, commands the boy to care for his family and warn his kin about
    taboos involving bamboo steps and projecting poles, and says the night call of
    the birik-birik bird signals his nearness. Variants describe the wife or whole
    family joining the huntsman in the forest chase. A note gives a charm, cure, and
    augury for those affected by his magic, and a caption describes a model of the
    huntsman with spear and hounds.
  language: English
  quote_policy: summarized
