  summary: The passage describes four Sheikhs associated with the Four Corners of
    the Earth, enclosed within white-iron ring-fences and addressed through a formula
    asking pardon of the Four Corners. It then notes Arabic-derived titles in invocations
    to a sea-spirit, including Imam An Jalii as Priest of the Seal, and identifies
    the Old Man of the Sea with Batara Guru. A footnote suggests that Arabic spirits
    may have replaced earlier native Malay spirits with similar functions.
