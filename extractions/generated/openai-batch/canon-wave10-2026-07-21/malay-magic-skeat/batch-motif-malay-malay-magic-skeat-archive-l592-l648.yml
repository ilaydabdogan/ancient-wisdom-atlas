canonical_text:
  quote: ''
  summary: The excerpt first continues the legend of a pilgrim whose fingertips are
    petrified by water, who kills a fierce red-furred beast, takes its whiskers, and
    uses them as payment while reaching Mecca. It then explains bores, river-mouth
    tidal waves, and floods as caused by the passage of a gigantic animal called Bena
    in Selangor, probably a dragon-like being. A footnote records Malay terms for
    male and female floods and describes floods as moving in male-female pairs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A male traveler refrains from drinking water but dips the tips of his fingers
    into it, and the fingertips immediately become petrified.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The traveler meets pigs, deer, and elephants fleeing from a beast described
    as not very large but having fiery red fur.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The traveler climbs a tree; the beast pursues and climbs after him; he drives
    a poniard or hadik into its skull and kills it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After killing the beast, the traveler removes its whiskers, and people flee
    from him because the whiskers belonged to a fierce beast.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Raja gives the traveler food and receives one whisker in payment; the traveler
    similarly pays his way at seven successive villages and reaches Mecca.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bores or eagres at river mouths and floods due to heavy rain are said to be
    caused by the passage of a gigantic animal, probably a kind of dragon.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Selangor the animal whose passage up rivers causes the tidal wave or bore
    is called Bena.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The first rising of a freshet is called Bah Jantan, the male flood, while
