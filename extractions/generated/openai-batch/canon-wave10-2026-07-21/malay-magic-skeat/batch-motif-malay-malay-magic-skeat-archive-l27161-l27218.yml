  quote: ''
  summary: A theatrical-exhibition invocation asks that participants not suffer vomiting,
    weariness, fatigue, weakness, or pains, and that they feel cool and fresh like
    the chinta-mani snake. The speaker addresses Black Awang as King of the Earth,
    acknowledges his earth-dwelling habits, asks him to withdraw three paces from
    the shed’s four corners, and places performers, musicians, bridegrooms, spectators,
    and household owners under his care.
