canonical_text:
  quote: ''
  summary: The passage first gives part of a crocodile-related charm involving bait,
    water, repeated blowing, stroking, and spoken formulas. It then recounts a story
    in which a woman’s child Sarilang falls into a river while being bathed, appears
    to her in a dream saying he has become a crocodile, and later rises at the river
    in a partly crocodile, partly human form, asking her to return after fourteen
    days with an egg and a plantain.
  language: English
