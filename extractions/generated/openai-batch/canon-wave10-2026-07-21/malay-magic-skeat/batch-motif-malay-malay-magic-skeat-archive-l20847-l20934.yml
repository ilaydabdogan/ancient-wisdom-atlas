canonical_text:
  quote: ''
  summary: 'The passage describes Malay wedding costumes and ritual accessories: the
    bridegroom’s dress and headgear, elite and royal variants, the preparation of
    the Rice of the Presence in an octagonal tiered framework, colored eggs and ornaments
    on a central mast, the bride seated before the groom’s arrival while zikir maulud
    continues, the bridal mat and betel tray, holy-water washing by the bridegroom,
    and the departure of the wedding procession.'
  language: English
  quote_policy: summarized
