canonical_text:
  quote: ''
  summary: The passage presents ceremonies and charms for decoying or snaring pigeons.
    It describes words and actions before setting out, sounding a decoy-tube, naming
    the hut and decoy, flicking the hut with leaves from trees of different heights,
    scattering rice while threatening non-descending pigeons with predators and dangers,
    summoning personified pigeon souls to King Solomon's audience-hall, and sprinkling
    neutralising rice-paste on a railed enclosure while calling pigeons to descend.
    An opening authorial note speculates about a possible relation between such hunting
    customs and the story of Orpheus's lute.
  language: English
  quote_policy: summarized
