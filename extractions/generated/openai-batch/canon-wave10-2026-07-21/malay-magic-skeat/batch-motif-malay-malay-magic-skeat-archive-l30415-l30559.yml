canonical_text:
  quote: ''
  summary: 'The passage describes Malay astrological and calendrical divination: zodiacal
    signs are assigned by Abjad calculation from a person’s and mother’s names; Rejang
    divisions of the lunar month are associated with animal symbols and daily prognoses;
    the first Rejang is a horse and includes auspicious activities, lost-property
    predictions, and a horse-effigy remedy for averting evil. The passage also compares
    Rejangs with Hindu lunar mansions and contrasts them with Arab Anwa.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A stated view holds that every person’s luck is determined by one of the zodiacal
    constellations.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The method for finding a person’s sign calculates the numerical equivalents
    of the person’s name and the mother’s name by Abjad letter values, adds them,
    divides by twelve, and maps the remainder to zodiacal signs such as the Ram and
    the Bull.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each constellation is said to have characteristics that influence the whole
    life of the person subject to it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Several constellations are listed with Malay names, including the Virgin as
    a palm-blossom spathe, the Southern Cross as a skate or sting-ray, Orion as a
    spring-gun or spring-spear-trap, and the Great Bear as a boat or junk.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The lunar month is described as divided into Rejangs, compared with Hindu
    Nacshatras or lunar mansions; Malay versions commonly raise the number to thirty
    to fit the days of the lunar month.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Each Rejang division has a symbol, usually an animal; the first animal in
    the list is usually the horse.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage notes that a horse’s head is also the figure of the first Hindu
    Nakshatra, while saying there is little trace of identity among the remaining
    figures.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Rejang system appears in mnemonic verses and prose treatises.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: In one prose treatise, the first day of the lunar month has the Rejang of
    a horse and is linked with God Almighty creating the prophet Adam.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The first horse-Rejang day is described as good for planting, travelling,
    sailing, trading, and weddings; it is lucky to be attacked in war but unlucky
    to take the offensive.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: For lost property on the first horse-Rejang day, the treatise predicts recovery,
    describes the thief’s appearance, and says the property has been placed in a house
    under the care of a dark man.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: For the first horse-Rejang day, a child born on that day is said to be extremely
    fortunate, an ill person is said to recover quickly, and the remedy for averting
    evil is to make a representation of a horse and throw it away toward the east.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage also notes Malay recognition of a solar year and adoption of a
    lunar year, with solar reckoning increasingly introduced in some districts under
    European influence.
  category: setting
  evidence_refs:
  - ev:9
