canonical_text:
  quote: ''
  summary: The passage discusses Malay identifications of Batara Guru/Shiva with land,
    forest, shoreline, and sea beings. It reports that the Spectre Huntsman was described
    to the collector as a god and as Batara Guru, that Batara Guru of the Sea was
    identified by some with Si Raya and uncertainly with the God of Mid-currents,
    and that different divine names were assigned to the state chamber, forest zones,
    shore, tidal zone, and open sea.
  language: English
  quote_policy: summarized
