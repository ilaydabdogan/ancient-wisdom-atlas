canonical_text:
  quote: ''
  summary: 'The passage reports beliefs about the Langsuir or langsuyar: a woman who
    dies in childbirth before the forty-day period is completed may become a flying
    demon. Preventive treatment of the corpse involves placing glass beads in the
    mouth, eggs under the armpits, and needles in the palms so that she cannot shriek,
    move her arms as wings, or use her hands for flight. A Selangor origin story describes
    the original Langsuir as a beautiful woman associated with a night-owl, who died
    from shock after hearing her child was stillborn and had taken the shape of the
    Pontianak. The passage also includes adjacent notes on the bajang and on Langsuior/Pontianak
    terminology.'
  language: English
  quote_policy: summarized
