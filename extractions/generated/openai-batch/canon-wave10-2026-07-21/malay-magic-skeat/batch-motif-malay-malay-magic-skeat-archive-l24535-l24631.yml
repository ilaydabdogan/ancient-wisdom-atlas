canonical_text:
  quote: ''
  summary: The passage describes Malay ritual methods for recalling or preventing
    the escape of a sick person’s soul, using a rice-bag with ritual objects, charms,
    rice measurement, a wrist-tied ring, and commands to demons. It then quotes a
    Malay Sketches anecdote about the reception of such magical-medical practices
    by religiously respectable Malays.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A soul-doctor places a fowl’s egg, seven small cockle-shells, and a measure
    of husked rice into a rice-bag.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The soul-doctor rubs the rice-bag over the patient’s body, shakes the contents,
    and sets it close to the patient’s head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: While shaking the bag, the soul-doctor recites a charm calling the sick man’s
    soul back into the patient’s frame and body and to its own house, ground, parents,
    and sheath.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After three days the rice is measured; increase means the soul has returned,
    no change means the soul is half outside the body, and decrease means the soul
    has escaped and not returned.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage explains that in this rite the soul is expected to enter the rice
    and thereby cause its displacement.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A second method, described as stopping the soul while it is escaping, uses
    a gold ring, an iron nail, a candle-nut, three small cockle-shells, three closed
    fistfuls of husked rice, and parti-coloured thread in a rice-bag.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the second method the bag is shaken seven times every morning for three
    days, after which the soul is supposed to be firmly reseated in the patient’s
    body.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The rice from the second method is poured out at the door for fowls to eat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ring is tied to the patient’s wrist with a strip of tree-bark, and the
    passage states that by means of this string the soul is supposed to return to
    its body.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The second charm names a peeling-knife and hooked knife, addresses sea-demons
    and hamlet-demons, and commands them to leave and not carry off the patient’s
    soul.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A footnote states that the peeling-knife is mentioned because demons are said
    to dread it and hurt themselves on it.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The concluding quotation is introduced as an example of how Black Art and
    medical performances resembling it are regarded by many respectable Malays.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the quoted anecdote, Haji Wan Muhammad, the Sultan of Perak’s teacher,
    writes a letter after hearing a discussion of superstitions.
  category: action
  evidence_refs:
  - ev:9
