canonical_text:
  quote: ''
  summary: The passage argues that the greater gods of the Malay Pantheon are modified
    borrowings from Hindu divinities, while lesser gods and spirits are native. It
    lists nature-linked native powers, presents Shiva under the names Batara Guru
    or Kala as supreme, states that every department of nature has a propitiated godling
    or spirit, identifies Batara Guru with Siva in Balinese and old Javanese contexts,
    and notes that Malay magicians appeal to Vishnu, Brahma, Batara Guru, Kala, and
    S'ri.
  language: English
  quote_policy: summarized
