  quote: ''
  summary: The passage describes a Bidan receiving and charming a cherana containing
    betel-chewing accessories, pouring out the contents to read omens, chewing betel,
    and using several forms of divination to learn the child's horoscope. When childbirth
    approaches, she is fetched to identify the luckiest birth place in the house,
    using structural rules and a hatchet or cutlass blade test; a rattan loop is hung
    from the rafters to help the patient sit up.
