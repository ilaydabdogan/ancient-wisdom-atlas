canonical_text:
  quote: ''
  summary: The passage first lists several Malay magical beliefs and practices, including
    auspicious timing, amulets, epidemic vessels sent to sea, magic at a distance,
    and verbal charms. It then describes the narrator’s observation of a reaping ceremony
    at Chodoi, Selangor, for fetching home the Rice-soul, with an aged female Pawang
    seated before ritual baskets and a set of ritual accessories including rice, oils,
    incense, an egg, a stone, a nail, reaping instruments, tepong tawar, and a brush
    made from seven kinds of plant leaves.
  language: English
  quote_policy: summarized
