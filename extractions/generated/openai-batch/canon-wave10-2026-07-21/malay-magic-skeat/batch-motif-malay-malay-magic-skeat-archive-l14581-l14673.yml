canonical_text:
  quote: ''
  summary: 'The passage describes Malay tin-mining beliefs and taboos: a mine failure
    attributed to a female figure’s displeasure after an alleged contract breach;
    the pawang’s role in prospecting streams; signs by which tin may reveal its presence;
    taboo language among Selangor tin-miners; prohibited acts and objects in mines;
    and omens involving falls, fire, and death in the mining kongsi.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The failure of the Sungei Jelok mines is attributed to an unnamed female figure’s
    displeasure over an alleged breach of contract by the towkay lombong.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The term pawang is described as sometimes functioning as a verb meaning to
    prospect a stream or mine; a pawang discovers and proves a stream before mines
    are opened.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tin is believed, rarely, to announce its presence by a peculiar noise at night,
    and birds and insects may indicate its whereabouts by their sounds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tin-miners in Selangor are said to use bhasa pantang, or taboo language.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the mine, especially before the karang has been removed, wearing shoes
    or carrying an umbrella is forbidden; the stated reason is that spirits might
    be offended, though the passage also gives a practical explanation involving limiting
    the Towkay Labur’s inspection.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Quarrelling and fighting in the mine are forbidden because they are said to
    drive away the ore.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Bathing in the mine is not allowed, and a man may not work there wearing only
    a bathing-cloth; he must wear trousers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: If a man takes off his sun hat and puts it on the ground, he must turn it
    over so that it rests on its crown.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Limes may not be brought into the mine; the Malay miner is said to dread the
    fruit and calls it salah nama, meaning “wrong name,” in pantang language.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: When looking at the check-roll, it is forbidden to point at names with the
    finger; the check-roll may not be examined at night with an open light.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Falling off the mining ladder is considered unlucky and is said to make the
    person likely to die within the year.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: An outbreak of fire in the mine is considered an omen of prosperity, and some
