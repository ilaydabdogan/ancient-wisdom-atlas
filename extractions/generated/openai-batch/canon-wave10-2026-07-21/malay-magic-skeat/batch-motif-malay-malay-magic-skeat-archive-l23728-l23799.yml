  quote: "“Fig. 2. — Ceremony of invoking the tiger spirit.”"
  summary: The passage describes an observer attending a ceremony connected with the
    tiger spirit. Attendance is regulated by an odd, unchanging number of persons
    over three nights. The room contains the patient’s bed, three decorated water
    jars, a larger decorated jar with artificial palm-leaf flowers and ornaments called
    a pleasure-garden and intended to attract the spirit, a censer with burning embers,
    and betel accessories. A note describes medical taboos marked by coconut leaves
    on a string across a path.
  language: English
