canonical_text:
  quote: ''
  summary: 'The passage describes Malay building rites for erecting a centre-post:
    a sacrificial victim''s blood and body parts are put into the post-hole to appease
    a local earth-spirit; another version deposits metal objects and other items,
    uses incense and three clods of earth, and seeks dream omens; a further note describes
    a water-cup omen and discusses traditions of human foundation sacrifice and later
    substitutes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A locally presiding earth-demon or earth-spirit is treated as relevant to
    the building site and is to be conciliated during the centre-post rite.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: A sacrificial victim's throat is cut according to Muhammadan custom, and its
    blood is spilled into the hole.
  category: action
  evidence_refs:
