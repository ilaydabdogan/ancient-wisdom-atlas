- id: obs:3
  text: The victim's head and feet are cut off and deposited in the hole as a foundation
    for the centre-post.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A ring is put on the little finger as a compliment to the earth-spirit before
    the charm is repeated and the post erected.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: One variant deposits scrap-iron, tin-ore, a candle-nut, a broken hatchet head,
