- id: obs:3
  text: Her head, with the stomach sac depending from it, separates from the trunk
    and flies to the nearest tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After this event she exists as an evil spirit that sits on the roof-tree and
    whinnies when a child is born, or tries to come through the floor to drink the
    child's blood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: A cited description calls the Penangal a female wraith associated with death
    in childbirth and with tormenting small children in the form of a face or bust
    with bloody trailing entrails.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Another cited account says the Penanggalan was originally a woman using devilish
    magic; her head and neck loosen from the body with intestines attached, while
    the body remains behind.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Penanggalan is said to fly to suck blood; persons whose blood is sucked
    die, and people touched by blood and water dripping from the intestines become
    seriously ill with sores.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Penanggalan is said to like the blood of women in childbirth; houses where
    births occur hang jeruju leaves or place thorns as protection.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Penanggalan is said to fear thorns because her intestines may get caught
    in them; a cited story says one was caught until daylight and killed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A person able to become a Penanggalan is said to keep vinegar in a vessel
    so that swollen intestines can be soaked, shrink, and re-enter the body.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Polong and the Pelesit are described as remaining spirits of this class
    and as resembling familiar spirits or bottle imps.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Polong is described as a very small female figure or mannikin, about the
    size of the top joint of the little finger, that flies where it is told to go.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Polong is preceded by the Pelesit, described as its pet or plaything and
