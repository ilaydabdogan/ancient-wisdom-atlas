canonical_text:
  quote: ''
  summary: 'The passage describes birth-related spirits and allied familiar spirits.
    An unnamed woman is transformed into an evil flying head-spirit after her neck
    splits; she attacks or threatens newborn children. Footnoted accounts compare
    this figure with the Penangal or Penanggalan, a female head or bust with trailing
    entrails that sucks blood, especially around childbirth, and can be resisted with
    thorns. The passage then describes the Polong and Pelesit as familiar-like spirits:
    the Polong is a tiny female figure, the Pelesit is likened to a house-cricket
    that enters victims before the Polong, and the Polong is kept and blood-fed by
    an owner.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man finds a woman sitting in a vat and asks what she is doing there.
  category: sequence
  evidence_refs:
