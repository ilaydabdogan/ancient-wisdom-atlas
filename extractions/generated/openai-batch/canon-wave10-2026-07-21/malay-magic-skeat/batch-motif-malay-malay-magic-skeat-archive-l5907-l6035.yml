canonical_text:
  quote: ''
  summary: The passage introduces Malay magical rites connected with air, especially
    charms for wind and weather. It describes a Selangor magician summoning wind,
    turning a contrary wind, and calming violent wind with ritual speech and objects.
    It also records a rice-spoon charm tied to a vessel’s mast and a traditional rain-making
    rite involving an inverted earthenware pan, water, and a cat, with notes explaining
    some objects as rain or sky symbols and as sympathetic magic.
  language: English
  quote_policy: summarized
