canonical_text:
  quote: ''
  summary: The passage introduces a Malay story from Selangor about elephant-folk
    who possess a city near Siam and live in human guise. In the story, Laboh wounds
    an elephant with a caltrop after elephants damage his rice. He follows the wounded
    elephant, reaches Pak Henang, heals Princess Rimbut by extracting the caltrop
    from her foot, and marries her. Later, when he violates her food injunction by
    adding young tree-shoots to rice, she turns back into an elephant and flees into
    the jungle.
  language: English
  quote_policy: summarized
