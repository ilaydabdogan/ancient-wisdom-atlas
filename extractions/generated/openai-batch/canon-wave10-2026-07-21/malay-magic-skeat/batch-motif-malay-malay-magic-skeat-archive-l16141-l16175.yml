  quote: ''
  summary: 'The passage describes how a man-eating crocodile kills and swallows prey,
    notes a parallel with the boa, and recounts three escapes from crocodiles: Lebai
    ‘Ali escaping after being left in mud as the tide fell, Si Ka’ escaping up a stem
    while losing a toe, and a Klang launch youth escaping by putting his thumbs into
    the crocodile’s eyes.'
