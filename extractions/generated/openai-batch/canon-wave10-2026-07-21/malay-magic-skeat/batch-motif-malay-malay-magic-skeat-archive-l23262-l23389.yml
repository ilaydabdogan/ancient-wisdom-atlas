canonical_text:
  quote: ''
  summary: 'The passage describes Malay procedures for casting out harmful “mischiefs”
    or Badi from sick persons: preparing a leaf-brush, rubbing the patient with a
    mixture of woods, water, and scrap iron, reciting a charm invoking Prophets Noah
    and Elias and commanding the leaves to act as medicine, then brandishing a spear
    and drawing breath over the patient. Notes discuss Badi name variants, the broader
    practice of healing by breath, and an alternative case involving influence from
    a waxen image.'
  language: English
  quote_policy: summarized
