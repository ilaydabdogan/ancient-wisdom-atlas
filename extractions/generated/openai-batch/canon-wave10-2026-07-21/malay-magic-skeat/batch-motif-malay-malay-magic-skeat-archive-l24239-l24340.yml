canonical_text:
  quote: ''
  summary: 'The passage describes the Malay Mengalin or “sucking charm” cure: evil
    spirits are first driven from a sick man, the patient is wrapped, and a dough
    ball with eggs and saffron is rolled over the body while a charm is spoken to
    draw out poisonous influences. Bone splinters or red hairs found in the dough
    are treated as signs of the plaguing spirit. The charm addresses Venom and invokes
    natural forces, flooding, and drowning imagery against it. A related example describes
    Malay medicine-men treating Umat’s eye illness by extracting needles and thorns
    said to cause his affliction.'
  language: English
  quote_policy: summarized
