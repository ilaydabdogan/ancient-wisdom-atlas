canonical_text:
  quote: ''
  summary: 'The passage describes portions of several Malay games: a Cakeseller carries
    off a boy after an exchange with Paterfamilias; Main Tul uses a single upright
    stake as a home and a selected pursuer; Main Seladang has a player impersonate
    a wild bull, engage in a baiting dialogue about spear-making, killing the bull,
    taking its heart, and feeding it to the Crown Prince, then charge and kick other
    players; Main China Buta is described as Blind Man’s Buff with a blindfolded catcher
    and a formulaic selection opening.'
  language: English with Malay phrases
  quote_policy: summarized
