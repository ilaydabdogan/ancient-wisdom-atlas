canonical_text:
  quote: ''
  summary: The passage describes tabak trees and the diseased heartwood called gharu
    or eaglewood. It says that finding gharu is the province of the Pawang, because
    the trees are under hantu or wood-spirit care. The Pawang burns incense at the
    forest edge and at a likely tree, recites a charm with Malay formulae and invocations,
    uses prescribed substitute words for the tree and its contents, and then cuts
    or rots the tree to obtain the heartwood. The passage also lists visible tests
    for finding gharu in a standing tree.
  language: English with Malay formulae and terms
  quote_policy: summarized
