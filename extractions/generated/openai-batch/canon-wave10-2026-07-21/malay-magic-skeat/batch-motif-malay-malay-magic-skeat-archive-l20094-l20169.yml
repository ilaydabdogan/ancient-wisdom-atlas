canonical_text:
  quote: ''
  summary: 'The passage first preserves a fragment about black magic enabling a petitioner
    to “live backwards,” then turns to Malay betrothal procedure: names for betrothal,
    inquiry through a messenger, polite self-depreciation, an inspection of the prospective
    bride called the “Inspection of the Buffalo-calf,” and former use of bird-shaped
    rice receptacles for betrothal presentation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A preceding charm-related note says black magic is thought to enable a petitioner
    to “live backwards,” in connection with dying and returning to life.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A third class of invocations is described as making a person formidable and
    is assigned to the chapter on war.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Betrothal is named with the Malay terms tunangan or pinangan.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: When a marriageable youth’s parents see a suitable match, they send a messenger
    to ask the girl’s parents whether she has already been bespoken.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If the answer is satisfactory, the messenger is sent again to request the
    girl’s hand for the youth and arrange a day for a meeting.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The preliminaries include polite self-depreciation on both sides; the girl’s
    father may describe his daughter as unable to cook or sew.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The youth’s representatives formerly had the right to interview the girl and
    satisfy themselves that she was without blemish or spot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: This interview was called the “Inspection of the Buffalo-calf.”
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: During the inspection, a member of the wooing party speaks verses mentioning
    satela yams, the hills of Bantan by the sea, uncertainty about good luck or calamity,
    and the heart turning toward the other party.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A representative of the girl describes her metaphorically as a buffalo-calf
    allowed to forage for itself and invites inspection for possible defects such
    as torn coat, broken limbs, or lost sight.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: If satisfied, the youth’s representative replies with verses about the high
    sun, a buffalo-calf dying if tethered, a long search, and finally meeting what
    was wanted.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Bird-shaped receptacles were formerly used to contain rice for presentation
    during betrothal; the bird at the bottom represented a peacock, and two smaller
    rice receptacles hung around its neck.
  category: object
