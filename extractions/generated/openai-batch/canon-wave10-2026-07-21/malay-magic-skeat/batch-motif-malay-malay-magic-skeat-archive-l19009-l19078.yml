canonical_text:
  quote: ''
  summary: 'The passage describes Malay birth-related practices: a conditional vow
    to hold a feast if a child grows safely; occasional shaving of the child’s head
    on the forty-fourth day and sending hair clippings to Mecca for casting into the
    well Zemzem; postpartum bathing of the mother; the mother’s placement on a heated
    platform called the saleian; rules for the fire beneath it; and footnoted Pahang
    customs for retaining a midwife.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A vow may be made at a child’s birth to give a feast at the tonsure of the
    child’s hair before marriage if the child grows up safely.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ceremony of shaving the child’s head may occur on the forty-fourth day
    after birth and is called balik juru.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A small payment may be given to a pilgrim to carry clippings of the child’s
    hair to Mecca and cast them into the well Zemzem.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The payment for carrying the hair clippings is called ’kekah or ’akekah in
    the case of a boy and kerban in the case of a girl.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mother is bathed in hot water at eight o’clock each morning for three
    days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After ablution from the day of birth, the mother undergoes a ceremony called
    naik saleian, glossed as “ascending the roasting-place.”
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The saleian is a rough couch on a small sloping platform about six feet long,
    with a hearth beneath it and a roaring fire lit under it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Each corner of the hearth has a bunch of lemon-grass leaves fastened to it;
    each bunch is charmed by ejecting betel-leaf upon it, and a pillow is prepared
    with a needle at each end.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The saleian fire is lit by the Bidan from the house-fire, must not be allowed
    to go out for forty-four days, and must not be used for cooking, or the child
    will suffer.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the Pahang custom quoted in the note, Umat presents a midwife with a brass
    dish containing green sirih leaves and copper money as a retaining fee; the recipient
    is then bound to attend the patient and may later claim further fees.
  category: relationship
  evidence_refs:
  - ev:5
