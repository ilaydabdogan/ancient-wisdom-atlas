canonical_text:
  quote: "“Come on board this Lanchang ... So may ye depart with the ebbing stream”"
  summary: The passage gives several Lanchang charms in which an offering or spirit-boat
    is guarded, escorted, boarded by summoned beings, and sent away. One charm summons
    elders and lords of various terrains to board the Lanchang and depart permanently
    to remote places, under threat of curse and deprivation if they return. Another
    asks a crocodile-spirit to forward the Lanchang to named river and sea powers.
    A longer charm addresses spirits as a shipwrecked crew, feeds them, and treats
    the Lanchang as a substitute for the sick man’s wasted body. The passage then
    introduces a Tiger Spirit ceremony used to expel a weaker rival spirit.
  language: English
  quote_policy: quoted
