canonical_text:
  quote: ''
  summary: 'The passage describes several Malay love-magic procedures for abducting
    or attracting another person''s soul: beating one''s own shadow with a prepared
    cane, using a lime branch with seven limes, and using a head-cloth at the full
    moon while reciting charms that summon the target''s soul and compel remembrance.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One procedure instructs the practitioner to take a body-length rattan cane,
    fumigate it with incense, recite a charm over it seven times, and strike the practitioner's
    own shadow once after each recital.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shadow-beating rite is to be repeated at sundown, midnight, and early
    morning; the practitioner then sleeps under a coverlet of five cubits of white
    cloth, after which the desired soul is expected to come.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The charm addresses Irupi, the Shadowy One, and orders this being to bring
    the target's breath and soul to the practitioner, whether the target is awake
    or asleep.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The explanatory note states that the shadow is supposed to embody or represent
    the soul, that the speaker's shadow-soul is expected to fetch the woman's body-soul,
    and that the white cloth is treated as a soul-cloth into which the woman's soul
    is expected to enter.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another method uses a lime branch with seven limes on one stalk, suspended
    from the top of a mosquito-curtain on three successive nights while a charm is
    recited.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A further ceremony is described as abducting another person's soul without
    direct contact between the soul-receptacle, identified as a head-cloth, and the
    soul-owner.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: For the head-cloth rite, the practitioner goes out on the fourteenth lunar
    night and two following nights, sits on a male ant-hill facing the moon, burns
    incense, and recites a charm.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The full-moon charm asks that the target become distraught for love at sunrise
