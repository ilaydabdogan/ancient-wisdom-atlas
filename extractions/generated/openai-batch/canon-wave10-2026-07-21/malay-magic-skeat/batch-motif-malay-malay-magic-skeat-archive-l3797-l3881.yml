  quote: ''
  summary: The passage describes Malay kramat shrines dedicated to sainted dead in
    Selangor and nearby districts, noting that shrine dedicatees may be Javanese,
    Kampar, or Sakai as well as Malay, while Chinese worshippers are described as
    visitors rather than dedicatees. It recounts a taboo pork offering at a Moslem
    shrine punished by a tiger guardian, then describes the shrine of ’Toh Kamarong,
    guarded by a white elephant and white tiger, and a story in which ’Toh Kamarong
    carries off a boy after the boy’s mother invokes him, later revealing the deed
    in a dream and leaving human footprints within tiger tracks.
  language: English
