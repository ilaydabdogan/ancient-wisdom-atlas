canonical_text:
  quote: ''
  summary: The passage gives rules for interpreting parched rice floating in water-filled
    jars during a Malay medical inspection rite. Rice movements and shapes indicate
    fatality, recovery, image-magic, spirit demands, or spirit-caused illness. The
    rite includes prepared flower jars, an extra nosegay jar meant to attract the
    patient’s soul, an invocation addressed to Wheat/parched rice, and the sacrificial
    tray called Anchak for propitiating evil spirits.
  language: English
  quote_policy: summarized
