canonical_text:
  quote: ''
  summary: The passage describes a Malay adolescent ceremonial tooth-filing rite.
    A tooth-filer prepares instruments with rice, tepong tawar, and charms; the patient
    reclines while the teeth are touched with metal rings and an egg, the mouth is
    propped open with a dried areca-nut, and the file is ritually neutralized before
    tooth crowns are cut. A footnote describes a rice-coconut-thread arrangement used
    to dispel harmful influences and protect the tooth-filer’s eyes from badi issuing
    from the teeth.
  language: English
