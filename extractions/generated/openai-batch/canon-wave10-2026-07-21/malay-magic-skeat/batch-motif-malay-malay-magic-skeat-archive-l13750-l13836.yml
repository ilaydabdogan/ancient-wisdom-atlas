canonical_text:
  quote: ''
  summary: 'The passage describes Malay rice-harvest rites involving the Rice-soul:
    grain connected with it is placed in a rice-bin with other objects; a Pawang describes
    a preliminary protective rite at the four corners of the field to confine Rengkesa
    or spectral reapers; special rice-ear forms are identified as places where the
    Rice-soul resides; women reapers follow charms and bodily rules while harvesting;
    and the sheaf left standing after the Rice-soul is taken home is called the Mother
    of the Rice-soul and treated as a newly made mother.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pounded grain is mixed with grain obtained from the Rice-soul and deposited
    in the rice-bin together with a stone, rosin, and a wreath of empty rice-ears.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author says he did not witness the preliminary search for the mother-sheaf,
    but that the Pawang described it and household people performed it for him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mother-sheaf is described as the place in which the Rice-soul was supposed
    to be contained.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: To confine the Rengkesa, the rite instructs a person to visit the four field
    corners, tie a knot in a rice-leaf at each corner, hold the breath, and recite
    a charm.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The charm addresses Shadows and Spectral Reapers and assigns them to the boundaries
    of the field.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the spirits are confined to the four corners, the searcher may look
    for special varieties of rice-ear in which the Rice-soul resides.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tongkat Mandah is presented as the best special rice-ear variety, but the
    passage states that if the Reception Ceremony is not properly performed, the owner
    will die.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Other named special rice varieties include The Kite, The Veiled Princess,
    Female Rice, and Padi Mendhara, each described by distinctive plant features.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Women reapers are instructed to repeat charms, cover their heads, reap facing
