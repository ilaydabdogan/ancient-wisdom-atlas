canonical_text:
  quote: ''
  summary: 'The passage describes a Malay funeral procession: the corpse is protected
    and placed on a bier with a coffin or mat arrangement, the bier is covered with
    colored cloth and sometimes floral strips, bearers carry it to the grave, and
    mourners generally wear no special mourning dress except certain rare or rank-related
    signs.'
