canonical_text:
  quote: ''
  summary: The passage records Malay nursery-rhyme games. One game uses a head-tapping
    counting formula whose meaning is described as obscure. Another, called Chan chan
    siku rembat, involves boys standing in a row with hands behind their backs while
    a token is secretly placed in one hand during a rhyme; the token-holder must leap
    away without being tripped, and a successful player participates in a challenge-response
    exchange about travel, a cooking-pot, a vessel-master, a broken tow-rope, and
    a pass. A third game, Hantu Musang or “The Pole-cat Fiend,” begins with a boy
    seated under a cloth between two others, but the description is cut off in the
    supplied passage.
  language: English with Malay phrases
  quote_policy: summarized
