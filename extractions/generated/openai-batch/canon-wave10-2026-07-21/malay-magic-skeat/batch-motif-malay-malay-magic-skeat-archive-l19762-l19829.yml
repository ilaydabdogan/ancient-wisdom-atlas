canonical_text:
  quote: ''
  summary: 'The passage describes part of an adolescent tooth-filing ceremony: the
    Pawang treats the patient’s upper teeth, uses a charm on betel-leaf that the patient
    chews to stop pain, washes and resharpens tools, and the company eats saffron-stained
    pulut rice. The lower jaw is treated later. The passage also describes possible
    dental outcomes: teeth filed down to the gums, cased with gold, filed into shark-like
    points, or blackened with coconut-shell oil and other materials. Notes cite comparable
    Sumatran tooth-filing, blackening, and gold-casing practices.'
