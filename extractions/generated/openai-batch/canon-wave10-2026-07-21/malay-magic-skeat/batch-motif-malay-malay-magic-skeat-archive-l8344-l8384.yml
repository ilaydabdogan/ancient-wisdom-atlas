  quote: "“wherever thou mayest chance to fall, there will I make a palace”"
  summary: A Raja waits for an auspicious time and sends his second son with a retinue
    to find good land for a settlement. After traveling through forests, hills, and
    waters, the Prince finds four islands, shoots a silver arrow from the bow Indra
    Sakti, and declares that he will build his palace where the arrow falls. The arrow
    falls on one island, which is then named Pulau Indra Sakti, and a town is erected
    there.
