canonical_text:
  quote: ''
  summary: The passage describes Malay omens from animals, insects, and birds, then
    explains the development of omen-reading into Tilek, a divinatory rite for ascertaining
    divine pleasure after offerings. It gives instructions for a rite using food,
    cigarettes, betel, rice, a beeswax taper, a lemon, a fish thorn, a torn-eye needle,
    birches of coconut leaf-ribs, incense, and colored thread. In an observed performance,
    a medicine-man interprets the dim blue burning of the taper as a promise, then
    continues the rite by piercing a lemon with a fish prickle and a needle to form
    a cross.
  language: English
  quote_policy: summarized
