canonical_text:
  quote: ''
  summary: 'The passage reports Malay birth-related prohibitions and precautions:
    a father must not cut his hair before the child is born; marked timber should
    not be used for house uprights because it may endanger childbirth; during pregnancy
    people must avoid certain movements through the house and must keep a guest for
    an even two-night period; during an eclipse the expectant woman is placed in the
    kitchen beneath a shelf with a spoon in her hand to prevent deformity in the child.
    The cited account is identified as concerning Perak Malays.'
