canonical_text:
  quote: ''
  summary: The passage describes theatrical ritual practice. A preceding action involves
    a performer placing his face in an imagined essence associated with a gong before
    acting. A similar ceremony was observed in 1897 at Jugra, Selangor, where its
    stated purpose was to drive evil spirits away from the performance site. The account
    identifies the Malay pawang ’Che Hussein, who also acted as clown and later wrote
    transcripts of plays. The performance area was prepared with mats, four posts,
    a ceiling-cloth, horizontal cords, plaited coconut-leaf ornaments shaped like
    animals, birds, fruit, and flowers, bananas for the players, and banana-tree stems
    and leaves at the posts.
