canonical_text:
  quote: ''
  summary: The passage gives a charm summoning the Child of the Solitary Jin Salaka
    with an offering of arrack and toddy under the authority of God and Prophet Solomon.
    It then describes Malay reverence for a sacred royal Lump of Iron used in oath-taking
    and denunciations, explains related iron objects used to repel evil spirits and
    steady the soul, and notes animistic associations of stones, including stones
    used with the Rice-Soul, child substitutes, bezoar stones, and tabasheer.
  language: English
  quote_policy: summarized
