canonical_text:
  quote: The “Monkey Dance” is achieved by causing the “Monkey spirit” to enter into
    a girl of some ten years of age.
  summary: The passage describes several Malay dance performances involving spirit
    invocation, possession, exorcism, ritual objects, music, and dance. It gives detailed
    procedures for the Monkey Dance, a possession dance involving a young girl, and
    also describes the main dabus piercing dance, dances of temporarily animated objects,
    a Palm-blossom dance setup, and a Pedikir wedding dance model.
  language: English
  quote_policy: quoted
