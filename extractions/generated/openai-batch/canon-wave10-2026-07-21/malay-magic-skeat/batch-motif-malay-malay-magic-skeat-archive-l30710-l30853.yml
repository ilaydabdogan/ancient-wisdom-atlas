canonical_text:
  quote: ''
  summary: 'The passage describes Malay astrological and divinatory magic squares:
    rankings of colours, arrangements of five Hindu deity names, irregular square
    forms, emblem substitutions, five-square and seven-square arrangements, and the
    use of such diagrams to determine auspicious times or days for beginning an operation
    such as a journey.'
  language: English
  quote_policy: summarized
