canonical_text:
  quote: ''
  summary: The passage describes a Palm-blossom Dance in which women chant invocations,
    cover and fumigate palm-blossom sheaves, throw rice, and cause a sheaf to sway,
    jump, and fall as if possessed. The rite ends with stanzas asking the spirit to
    return and with the spoiled sheaves placed beneath a banana-tree. It then describes
    a related Dancing Fish-trap performance in which a fish-trap is dressed as a human-like
    figure and made to rock and leap after an invocation and a magician's whispered
    command. The passage ends with the start of a new section on buffalo and cock
    fights.
  language: English
  quote_policy: summarized
