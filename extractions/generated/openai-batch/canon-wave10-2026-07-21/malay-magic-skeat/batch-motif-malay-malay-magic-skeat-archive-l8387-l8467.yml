  summary: The passage describes Malay ritual practices connected with road-making
    in the forest, including incense and rites to exorcise demons from a road trace.
    It then introduces beliefs about large dangerous wild animals, especially the
    elephant, as beings credited with human, superhuman, or supernatural powers. It
    states that ceremonies, prescribed formulas, and powerful spells are considered
    necessary for trapping and taming wild elephants, and notes a reported Siamese
    connection for many elephant spells.
