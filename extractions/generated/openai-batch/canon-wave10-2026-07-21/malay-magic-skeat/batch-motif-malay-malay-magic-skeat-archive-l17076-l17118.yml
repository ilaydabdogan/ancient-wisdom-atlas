  quote: plunged into the sea only to reappear as a porpoise
  summary: The passage recounts a wizard using spells, leaves, and parched saffron-stained
    rice in a fishing rite; the leaves become fish and produce a large catch. The
    wizard then settles debts, divides the remainder among his children, enters the
    sea, and reappears as a porpoise. A following note describes a belief that a tadpole-like
    creature divides into a frog and a catfish, and that the fish's own brain can
    cure wounds caused by its poisonous spines.
