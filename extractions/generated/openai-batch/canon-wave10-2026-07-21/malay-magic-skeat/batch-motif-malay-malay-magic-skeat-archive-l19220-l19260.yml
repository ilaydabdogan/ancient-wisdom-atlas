  quote: ''
  summary: The passage describes Malay birth-related precautions and postpartum treatments.
    A pregnant woman, Selema, avoids disparaging speech so disliked qualities will
    not be reproduced in the child, and avoids daytime sleep so the child will not
    fall prey to evil spirits. After confinement, the mother drinks ash-based potions
    mixed with ingredients such as black pepper, garlic, and vinegar, wears a waist
    bandage, and receives cosmetics made from temu kuning and kunyit t'rus over specified
    three-day periods.
