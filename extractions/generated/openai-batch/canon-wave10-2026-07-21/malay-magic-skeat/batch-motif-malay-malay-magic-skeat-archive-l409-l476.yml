canonical_text:
  quote: ''
  summary: The passage gives two explanations of tides involving Pusat Tassek or Pusat
    tasek, described as a cavern, huge ocean-bottom hole, or Navel of the Lake/Seas
    inhabited by a vast or gigantic crab. In one account the crab’s return displaces
    water and causes flood tide, while its departure lets water rush into the cavern
    and causes ebb. In Clifford’s variant the crab blocks the aperture to the underworld
    while seated; rivers raise the sea then, and ebb occurs when the crab leaves and
    waters pour down through the hole. The passage also discusses the legendary Pauh
    Janggi tree, said in Malay fable to grow in the central whirlpool or Navel of
    the Seas, sometimes on a sunken bank and guarded by dragons, and notes its prominence
    in Malay romances and shadow-plays.
  language: English
