canonical_text:
  quote: ''
  summary: The passage describes Malay beliefs and practices concerning severed or
    body-connected materials such as hair clippings, nail parings, eyebrows, saliva,
    and soil from footprints. Such materials are treated as still connected with the
    person and therefore dangerous if injured or used by malicious magic. It also
    discusses wax-image magic using hair and nails, ritual body modifications such
    as hair cutting, nail paring, ear boring, and tooth filing, and the wearing of
    long or artificial nails. The author compares long-nail practices in Malay, Chinese,
    Siamese, and Sumatran contexts while cautioning against assuming direct borrowing.
  language: English
  quote_policy: summarized
