canonical_text:
  quote: "“several of the trees now to be seen in the forest are really metamorphosed
    human beings.”"
  summary: The passage reports Malay traditions concerning haunted trees. It states
    that all trees were planted by Prophet Elias and placed in Prophet Noah’s charge;
    that in King Solomon’s time trees, birds, and animals could speak; and that some
    forest trees are metamorphosed humans. It gives an etiological story for the Jelotong
    and Berombong trees, describes the lime-tree spirit as specially revered by Penang
    theatrical players, notes lime-fruit uses involving spirits and souls, and begins
    an account of eagle-wood or gharu.
  language: English
  quote_policy: quoted
