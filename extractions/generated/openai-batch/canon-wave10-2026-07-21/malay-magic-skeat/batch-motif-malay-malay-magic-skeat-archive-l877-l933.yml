canonical_text:
  quote: ''
  summary: 'The passage records Malay beliefs and terms concerning rainbows and sunset:
    rainbow forms are named as snake, pillow, and flag; a partial rainbow may be an
    omen of a Raja''s death; treasure is believed to lie beneath a rainbow end but
    cannot be reached; sunset is a dangerous hour when spirits are powerful; a protective
    household act uses a pungent root spat at seven points; and the yellow western
    sunset glow is called the yellow deity.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage gives a rainbow-related expression, ular danu, glossed as 'the
    snake danu,' and says that in Perak a rainbow arch across the sky is called bantal,
    'the pillow.'
  category: attribute
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:2
  text: A small visible portion of a rainbow that seems to touch the earth is called
    tunggul, 'the flag.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the partial rainbow called 'the flag' is seen at a particular compass
    point, probably west according to the narrator, Perak Malays say it foretells
    the approaching death of a Raja.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A popular belief says the ends of the rainbow rest on the earth and that digging
    at the exact spot beneath one end would reveal untold treasure, though no one
    can arrive there.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sunset is described as the hour when evil spirits of all kinds have most power.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Perak, children are often called indoors at sunset to protect them from
    unseen dangers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A woman in a house with young children may chew kuniet terns, an evil-smelling
