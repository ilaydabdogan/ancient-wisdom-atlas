canonical_text:
  quote: ''
  summary: The passage discusses Malay divine titles and identifications, especially
    Batara Guru as Shiva, noting confusions with Brahma and Mahadewa, uses of dewa
    and mambang, sea-spirit invocations, a genealogy in which Guru fathers major Hindu
    figures, the grain goddess Sri/Seri, Sambu/Jambu and crocodile-spirit associations,
    Kala as a manifestation of Shiva, and Sanskrit-derived religious vocabulary in
    Malay and Javanese.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The honorific sang-yang is described as used for epithets such as 'the only
    God,' while batara is said to be limited to actual names of Hindu deities; Batara
    Guru is treated as an exception that became regarded as a proper name.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage reports examples of Malay mythological confusion: Batara Guru,
    identified parenthetically as Shiva, is identified with Brahma in one example,
    and Guru is distinguished from Mahadewa in another, although Mahadewa is said
    to be another name for the same divinity.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Dewa is described as used for greater and lesser divinities, and the Dewas
    are said to be called so because they are immortal.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:4
  text: Mambang Tali Hams, called the god of mid-currents, has been explained as referring
    to Batara Guru, but the passage treats this as confusion and links the name with
    color attributes usually assigned to inferior divinities.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In an invocation to a sea-spirit, the god of mid-currents is asked to forward
    a message to Dato' Rimpun 'Alam, described as apparently another name for Batara
    Guru, because the god of mid-currents habitually visits the Heart of the Seas
    where Toh Rimpun 'Alam dwells.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A quoted genealogy represents Guru as the father of the Hindu Trinity, Sambu,
    and Seri.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Seri is identified with Hindu Sri and described as the goddess of grain.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sambu or Jambu is said to be the first portion of the name almost universally
    ascribed to the crocodile-spirit by Peninsular Malays.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A footnote says Sambhu is another name for Shiva and that its application
    to the crocodile-spirit would appear to indicate that the crocodile-spirit was
    formerly regarded as an embodiment of the supreme god's manifestation as a water-god.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The title Toh Panjang Kuku is applied to the corresponding manifestation of
    the supreme god on land and is said to strongly suggest the tiger.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage says many theological words in the list are Sanskrit and are presented
    as evidence of the former prevalence of Hindu religion among Malays and Javanese;
    it also says Sanskrit avatar became Malay batara.
  category: other
  evidence_refs:
  - ev:10
