canonical_text:
  quote: ''
  summary: A section of the legend of Che Puteh Jambai recounts concealed riches,
    dream-guided searches, local treasure-sites, sunken golden instruments, and a
    fisherman who loses a gold chain after ignoring a bird's repeated kachip signal.
    The passage then introduces charms, amulets, and talismans as ways Malays try
    to influence fate, contrasting them with divination, omens, and dreams used to
    ascertain fate.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A female figure in the legend is described as exceptionally lovely and as
    having Rajas and Chiefs of neighboring countries as suitors.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Her parents conceal a great part of their riches in various places, disappear,
    and are not seen again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The children do not find the property, but, following instructions received
    in dreams, undertake sea voyages to distant lands to search for it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Places near Jambai are identified with the legend of Che Puteh, including
    Bukit Bunyian where treasure is said to be buried and a gorge used by Che Puteh's
    buffaloes to descend to the river.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two deep pools, Lubuk Gong and Lubuk Sarunai, are said to contain a golden
    gong and a golden flute sunk by Che Puteh Jambai; the flute may appear on rocks
    but disappears into the pool before a mortal approaches.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Malay of Ulu Perak is told in a dream to fish in the pool of the gong, bring
    a pair of betel-nut scissors called kachip, and use them immediately when told.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The fisherman hooks something heavy and hauls a gold chain into his canoe
    until the boat can hardly hold more.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A little bird repeatedly calls notes sounding like kachip; the fisherman delays
    because he wants more chain, and the chain is pulled back into the pool before
    he cuts it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The expository section states that Malays use divination, omens, and dreams
    to try to ascertain fate, and charms, amulets, and talismans to try to influence
    fate.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage distinguishes charms that are directly effective or protective
    from charms supposed to influence another mind, including love-charms and charms
    for conjugal fidelity.
  category: other
  evidence_refs:
  - ev:8
