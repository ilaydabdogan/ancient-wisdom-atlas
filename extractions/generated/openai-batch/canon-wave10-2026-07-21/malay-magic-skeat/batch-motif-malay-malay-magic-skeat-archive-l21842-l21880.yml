canonical_text:
  quote: ''
  summary: 'The passage describes a Malay funeral washing procedure: the body is positioned
    for washing, water is poured with scoops, banana-stem rollers may be used if no
    volunteers support the body, a chief washer may shampoo the body, and successive
    washings use cosmetic water, lime water, and a final washing called “NineWaters.”'
  language: English
  quote_policy: summarized
