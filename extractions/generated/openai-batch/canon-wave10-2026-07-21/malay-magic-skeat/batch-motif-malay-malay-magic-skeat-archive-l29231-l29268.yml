canonical_text:
  quote: ''
  summary: The passage describes a method for measuring a kris blade to determine
    whether it is perfect or unlucky, lists preferred varieties, describes the kris
    panjang as worn by aristocracy, bridegrooms, and chiefs, and explains that Malay
    valuation of krises includes proportion, damask, antiquity, bloodshed, and supernatural
    lucky quality. This lucky quality, betuah, may make the possessor invulnerable;
    its reverse is chelaka, ill-omened. A betuah kris may be inherited from father
    to son and honored as divine.
  language: English
  quote_policy: summarized
