canonical_text:
  quote: ''
  summary: 'The passage gives mining charms and ritual instructions: offerings of
    betel and cigarettes to named beings; commands and threats meant to drive beings
    away; an oath and origin claim involving blood, kinship, and different inheritances
    of ore versus refuse; instructions to clear evil spirits before excavation and
    propitiate local spirits so tin-ore will show itself; and preparation of a spirits’
    banquet in a model royal audience-chamber with foods, flags, tapers, incense,
    and an invitation charm invoking saintly or wizardly figures.'
  language: English
  quote_policy: summarized
