canonical_text:
  quote: ''
  summary: The passage lists and compares Malay royal regalia associated with Perak,
    Selangor, Pahang, and Jelebu. It also mentions a celebrated sword used by Peramas
    Cumunbang to kill the serpent Sicatimuna, a Johor prince bringing royal insignia
    to Perak to assume sovereignty, musical instruments and processional objects of
    Selangor kingship, Pahang pages bearing royal items, Jelebu insignia, and the
    borrowing of ordinary royal lances for a bridegroom's procession because of his
    supposed one-day sovereignty.
  language: English
  quote_policy: summarized
