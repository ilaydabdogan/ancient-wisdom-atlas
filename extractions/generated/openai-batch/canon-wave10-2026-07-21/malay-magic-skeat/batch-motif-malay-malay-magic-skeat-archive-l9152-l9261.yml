canonical_text:
  quote: ''
  summary: The passage gives several Jugra Hill traditions about a Princess who is
    invisible to mortals and is accompanied by a ghost or sacred tiger. A variant
    distinguishes a real harimau kramat from an ambitious young tiger killed by Innes.
    A local version says Nakhoda Ragam traveled by boat with his wife, identified
    with the Princess of Malacca/Tuan Piitri Gunong Ledang; she killed him with a
    needle, called the blood in the boat spinach-juice when questioned, buried his
    remaining thigh at Jugra Hill, and brought ashore two cats that became ghost-tiger
    guardians of the shrine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A lady remains on Jugra Hill for a time, constructs a bathing-place, later
    visits periodically while invisible to mortal sight, and has a faithful attendant
    in the shape of a handsome tiger.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Turney reports that stories about the Princess and the tiger are well known
    and are related from mother to daughter in Langat.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'One version says there were two tigers: the real harimau kramat and an ambitious
    young tiger who followed the Princess; the young tiger was killed by Innes.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The other tiger accompanies the phantom mistress and prowls and howls around
    Jugra Hill; it is said to have been shot at by several Malays and Sergeant-Major
    Allie.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In a local version, Nakhoda Ragam travels in a boat with his wife, who is
