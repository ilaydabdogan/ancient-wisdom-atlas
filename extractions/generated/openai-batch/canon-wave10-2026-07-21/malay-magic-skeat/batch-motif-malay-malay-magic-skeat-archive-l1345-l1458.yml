  quote: ''
  summary: 'The passage first states that man is composed of four elements, each linked
    with an essence. It then describes Malay royal sanctity: the king’s body is treated
    as sacred, this sanctity is believed to extend to the regalia, and breaches of
    royal taboos are said to bring death through Daulat, a divine royal power. The
    passage also lists examples of regalia from Malacca and the Malay Annals.'
