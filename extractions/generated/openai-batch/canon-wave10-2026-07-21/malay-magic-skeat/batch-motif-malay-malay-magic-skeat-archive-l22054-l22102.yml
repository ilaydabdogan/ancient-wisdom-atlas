  quote: ''
  summary: 'The passage describes Malay burial procedures: earth must not fall directly
    onto the coffin, grave-diggers receive and tilt the soil into the grave, temporary
    grave-posts are shaped and placed according to the deceased’s sex and body position,
    a white cloth marks recent death, leaves are strewn beside the grave, and notes
    report older or pre-Muhammadan burial customs involving grave goods and a circular
    mound with a central post.'
