canonical_text:
  quote: ''
  summary: The passage describes Malay royal prerogatives, including exclusive rights
    over certain animal products and ketiar fruit; special royal vocabulary and penalties
    for improper use; posthumous replacement of a king’s name or title; and belief
    that kings and, more weakly, officials affect crops, fruit trees, and crocodile
    behavior. A footnote compares posthumous royal naming customs with Burma, Siam,
    Macassar, and an attribution to Ancient India.
  language: English
  quote_policy: summarized
