canonical_text:
  quote: ''
  summary: 'The passage transitions from bezoar stones to a section on water purification,
    introducing a bathing ceremony. It also reports on bezoar or guliga stones: saline
    springs called Sungan are used in a salt-poor district and frequented by red monkeys
    whose stomachs may contain Bezoars; hunters wait at these springs to shoot likely
    animals. In Siak, guliga stones are described as intestinal stones from porcupines,
    treated as royal property of the Sultan, collected by Sakeis, sometimes clandestinely
    sold, highly valued, and claimed by natives to cure chest or bowel complaints
    and to act as an aphrodisiac when worn on the navel or when water in which one
    has been soaked is drunk.'
  language: English
  quote_policy: summarized
