canonical_text:
  quote: ''
  summary: The passage records Malay beliefs about dogs, wild ghost-dogs, a charm
    threatening wild dogs and sending them back to remote places, a belief that bears
    fight tigers, a story of a faithful tame bear mistakenly killed after protecting
    a child from a tiger, and traditions about the man-like ape Mawas. The passage
    explicitly notes parallels between the faithful bear story and Beth-Gelert and
    the Panchatantra story of the Ichneumon and the Snake.
  language: English
  quote_policy: summarized
