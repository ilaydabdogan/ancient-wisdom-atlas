canonical_text:
  quote: ''
  summary: 'The passage gives Malay deer-hunting charms and ritual directions: deer
    are called into a prepared path between spearmen; a stag is addressed with royal
    imagery and a Solomonic ornament; the spearer disclaims direct agency; after a
    deer is secured, the carcass is ritually stroked or flicked with black cloth,
    jacket, leafy spray, or branch to expel mischief or badi. The formulas name human
    ritual figures, supernatural agents, archangel-like names, the Jin Ibni Ujan as
    origin of mischief, and Mentala/Batara Guru as addressee when representative parts
    are deposited or left.'
  language: English
  quote_policy: summarized
