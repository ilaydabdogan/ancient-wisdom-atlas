  quote: ''
  summary: 'A fishing-stakes ceremony is described: a tray is suspended at the seaward
    end, rice and cigarettes are scattered on the water, a charm is recited, neutralising
    rice-paste is applied with a leaf-brush to parts of the stakes, assistants sprinkle
    posts and a boat with its gear, the bowl is washed in the sea, the brush is fastened
    to a head-post, and fishing-wizards enforce taboos including restrictions on umbrellas
    and boots.'
