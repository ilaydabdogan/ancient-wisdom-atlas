canonical_text:
  quote: ''
  summary: The passage describes a Malay fishing ceremony in which portions of food
    and cigarettes are prepared for spirits; a blemishless black goat is killed and
    its head, feet, and viscera are placed on offering trays with rice-bags and wax
    tapers. Bilal Umat circles the trays with a smoking censer, sends the left-hand
    tray in procession to a mangrove tree, hangs it there, and calls out to notify
    the Land Spirits that offerings await them. He then returns and makes a ritual
    leaf-brush.
  language: English
