canonical_text:
  quote: ''
  summary: A Malay ritual specialist, Raja Ngah, presides over a ceremony with female
    singers and drums. Her head and face are covered while an orchestra sings in an
    unknown 'spirit language' to summon Jin from several realms to relieve the King's
    suffering. The Pawang sits before a lighted taper holding a tied sheaf of daun
    sambau, shakes, and the candle flame is interpreted as showing the Jin's arrival.
    She is then treated as possessed, bows to the taper, sprinkles saffron-coloured
    rice and perfumed water, and repeats the ceremony before male members of the royal
    family. The passage explains that Malay States, districts, and individuals have
    special spirits; this State has four principal Exalted Spirits who guard the Sultan
    and State and require royal protocols, special invocations, music, singers, and
    umbrellas prepared in their honour.
  language: English
  quote_policy: summarized
