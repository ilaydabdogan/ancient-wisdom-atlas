canonical_text:
  quote: ''
  summary: The passage describes the construction and use of a censer, lists named
    ketupats, lepats, and small coconut-leaf models placed in or associated with a
    sacrificial tray, explains that tray contents are intended for spirits and refuse
    for their slaves, assigns cooked and uncooked foods and eggs to particular spirit
    recipients, and begins an eyewitness account of a Pawang performing a wave-offering
    with a suspended tray, holy water, a taper, fumigation, and circular movement
    of the censer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A standard censer is described as made from split bamboo bent outward, interwoven
    with rattan, lined with banana leaf, filled with earth, and planted vertically
    in the ground.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Live embers are placed on the censer, incense is crumbled over it, and an
    appropriate charm is recited.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Eight ketupats are named, with several described by number of corners and
    by translated labels such as luck of the country, candle-nut, garlic, paddle-handle,
    market, onion, Pahang market, and hen’s egg.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Three lepats are named and described by leaf material or shape: coconut leaves,
    plantain leaves, and three-sided palas leaves.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Small models made of coconut leaves may be added, including an owl, buffalo,
    stag, ground-dove, crab, and rarely a horse.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The things deposited in the tray are said to be intended for the spirits,
    while refuse on the ground beneath it is for their slaves.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Cooked food in the tray is assigned to the king of the spirits, while uncooked
    food is assigned to his following.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Of two eggs, the uncooked egg is alleged to be for the Land-spirit, identified
    here as the Wild Huntsman, and the cooked egg for the Sea-spirit; the source says
    this assertion needs further investigation before full acceptance.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the wave-offering account, the Pawang sits with his back to the patient,
    facing dishes of cooked and uncooked food; the sacrificial tray is suspended about
    three feet above the ground in the room.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Pawang lights a wax taper, removes a yam-leaf covering from a jar of holy
    water, gazes into the water, and extinguishes the taper again.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Pawang fumigates his hands in censer smoke, holds them briefly over the
    holy water, then takes the censer and describes three circles around the jar before
    setting it down.
  category: action
  evidence_refs:
  - ev:7
