  summary: 'The passage remarks that Peninsular Malays still regard asking pardon
    before mentioning the king''s name as imperative. It also explains the expression
    that a ruler is master of fresh water in the ocean by citing Leyden''s Malay Annals:
    when fresh water was exhausted, Raja Sang Sapurba had circles of rotan or bamboo
    placed in the water, descended into a small boat, and put his feet into the water
    within the circles.'
