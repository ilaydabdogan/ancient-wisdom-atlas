canonical_text:
  quote: ''
  summary: The passage describes a Malay deer hunt using stakes, ropes, nooses, shouting
    drivers, concealed knife-bearers, and later division of the animal. It then describes
    charms used by the deer Pawang to manage forest and earth demons, obtain trees
    and deer, control dogs, deceive deer and spirits, and remove badi from the carcass.
    Sample charms ask for deer, invoke named beings and kiraman katibin, and ask Hantu
    Bakar and Jembalang Bakar to turn aside when entering the jungle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hunters fasten a rope with nooses to stakes near a thicket where deer are
    concealed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some hunters conceal themselves near the nooses with knives, while the rest
    advance from the opposite side shouting and yelling.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Startled deer flee toward the nooses, become entangled, and are killed by
    concealed hunters or by the larger party with spears and knives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The animal is divided between the sportsmen after the hunt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The deer Pawangs use speech described as gibberish when entering the jungle
    to induce wood demons and earth demons to recede or refrain from interfering.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Pawang charms are used to ask for a tree and a deer, to unroll and suspend
    the toils, to call spirits described as herdsmen of deer, to manage deer and dogs,
    to deceive deer and spirits, and to drive badi from the slain animal's carcass.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The asking-for-deer charm addresses Sidi the Dim-eyed and other named figures,
    demands male and female deer with specified physical traits, and asks for the
    boon by daylight and by virtue of kiraman katibin.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A note explains kiramun katibun as two recording angels associated with each
    person, one recording good deeds and one recording evil deeds, and says they are
    mentioned in the Koran.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: The petition token consists of chopping down a small tree and using it to
    pierce the slot of the deer.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: On first entering the jungle, a charm asks Hantu Bakar and Jembalang Bakar
    to turn aside so the speaker may let loose the body-guard, glossed as the pack.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A note states that the first person to draw blood receives a special portion,
    while the Pawang receives the other half.
  category: relationship
  evidence_refs:
  - ev:8
