canonical_text:
  quote: ''
  summary: 'The passage describes Malay rice-harvest treatment of the mother-sheaf
    and Rice-soul: a coconut-and-flower mixture is eaten and partly spat among the
    rice, rice-stalks are kissed and addressed as the speaker''s child, the last sheaf
    is brought home and mixed with the Rice-soul, and rice from selected heads is
    reserved for next year''s seed and tepong tawar. Notes compare this with a post-birth
    feeding practice and cite rice-spirit invocations. The passage then introduces
    Malay tin-mining ceremonies, mining wizards, and beliefs that ore has vitality,
    grows, and may resemble a buffalo moving underground.'
  language: English
  quote_policy: summarized
