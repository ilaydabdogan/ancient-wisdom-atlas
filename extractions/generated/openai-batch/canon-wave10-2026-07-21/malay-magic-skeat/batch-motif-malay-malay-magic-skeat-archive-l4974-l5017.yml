canonical_text:
  quote: ''
  summary: The passage describes the Malay sea-spirit Si Raya or Madu-Raya, his family,
    his rule over the sea, and a conditional identification placing his abode at the
    navel of the seas in a central whirlpool where a Magic Tree, roc or garuda, and
    Gigantic Crab appear. The crab's movement in and out of its cave is said to cause
    tides. The passage also lists White, Black, and Yellow divinities dwelling in
    the Sun, Moon, and Yellow Sunset-glow, and notes a sunset-related water action.
  language: English
  quote_policy: summarized
