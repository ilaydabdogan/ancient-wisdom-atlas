canonical_text:
  quote: ''
  summary: 'The passage lists Malay interpretations of dreams as omens, including
    danger, enemy arrival, trouble, and gambling luck. It then gives a legend of Che
    Puteh Jambai and his wife: a poor husband dreams that a supernatural visitor commands
    him to kill his wife to improve their condition. Before the killing, the wife
    washes at the river with lime juice, cuts her hand, and blood falling into the
    river causes jars full of gold to rise and float upstream. The husband spares
    her, and the couple become wealthy.'
  language: English
  quote_policy: summarized
