canonical_text:
  quote: ''
  summary: 'The passage describes parts of a Malay wedding ceremony: the bridegroom
    is led into the bridal chamber and seated beside the bride; the couple undergo
    a repeated assisted seating and rising procedure with reciprocal vows and blessing-prayers;
    they feed each other rice from the nasi setakona; the bridegroom pays respects
    to the company; food, rice bundles, and eggs are distributed to guests with distinctions
    by status; and the passage adds notes on post-wedding residence, officiants, marriage
    formulae, dower, and the absence of a wedding ring.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A brother or near relation of the bridegroom leads him into the bridal chamber
    and seats him cross-legged on the left side of the bride, who sits on his right
    with her feet tucked up.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The seating process called bersanding involves slowly bending the knees to
    sit and slowly straightening them to stand, repeated three times with assistance
    from friends.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A pair of matronly ladies may assist by raising first the man and then the
