  quote: ''
  summary: 'The passage surveys Malay games and amusements: cock-fighting stakes and
    game-cock care; gambling with dice, cards, and poe-table attributed to Chinese
    introduction; Saparaga/Sepak raga as a circle ball game; Sangheta/Singketa as
    violent arbitration between tribes; reciprocal Pantun singing and musical devotion;
    riddles and children''s games; and the popularity and construction of Malay kites.
    The supplied text ends while introducing kite pattern names.'
  language: English
