canonical_text:
  quote: ''
  summary: The passage describes Malay symbolic dances, especially a war dance in
    which dancers use wands as swords and appear possessed by a Dance-spirit, then
    are restrained and removed. It then explains ritual elements in Malay dances,
    including incense, rice, invocation, and exorcism or escorting home of the spirit.
    It introduces the Gambor Dance, performed by girls entering womanhood, with ritual
    costume, a pleasure-garden made from a water-jar and sprays with artificial flowers,
    fruit, and birds, and offerings intended to attract Hantu Gambor.
