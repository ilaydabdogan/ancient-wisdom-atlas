  text: Parents of both parties choose people for decoration work and notify relations
    and friends who wish to help with wedding preparations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Both houses are decorated with vertically striped hangings, ornamental ceiling-cloths,
    and floor coverings such as mats, rugs, and carpets.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the bridegroom’s house a small raised platform or dais, called petarana,
    is erected for him to put on his wedding garments before going to meet the bride.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the bride’s house a similar petarana is erected, along with a low dais
    called rambat in front of her door.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Two standard candlesticks called tiang rambat stand at the outer corners of
