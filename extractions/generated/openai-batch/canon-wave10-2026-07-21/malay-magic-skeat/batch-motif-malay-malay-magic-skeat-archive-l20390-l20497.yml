canonical_text:
  quote: ''
  summary: 'The passage describes Malay marriage-house preparations: decoration of
    both houses, construction of platforms and a bridal doorway dais with candle-standards,
    arrangement of a two-stepped wedding couch called the pelamin, and the use of
    pillows and costly borders to mark rank. A footnote comments on Malay terms for
    marriage and married status.'
  language: English
  quote_policy: summarized
literal_observations:
