canonical_text:
  quote: "“the very centre of the cross, called the Heart of the Earth”"
  summary: 'A Pawang conducts a ceremonial preparation for a Malay theatrical exhibition:
    he charms and scatters rice, distributes betel chews to drummers and to upper
    and lower parts of the performance space, presses and turns his thumb in a ring
    at the centre of a cross called the Heart of the Earth, charms drums over a brazier,
    and begins the taboh tune with a flageolet. Notes identify betel portions for
    the White Genie and Black Earth Genie, and captions describe masks of clowns and
    a forest demon.'
  language: English
  quote_policy: quoted
