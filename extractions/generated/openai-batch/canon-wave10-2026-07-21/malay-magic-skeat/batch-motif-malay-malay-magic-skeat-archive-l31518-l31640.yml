canonical_text:
  quote: ''
  summary: The passage gives ritual instructions and charms for invoking an Earth
    Genie to harm someone, for causing dissension between husband and wife by manipulating
    two wax figures, and for abducting another person’s soul without contact by reciting
    a charm through a hollowed hand at sunrise or under a red newly risen moon.
  language: English with Malay charm text and English renderings
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A charm addresses an Earth Genie and bull-shaped earth or world spirits, inviting
    them to accept a banquet and assist in causing sickness, madness, or death to
    a named person.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dissension rite is identified as a charm for sowing dissension between
    husband and wife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two wax figures are made, one resembling the husband and one resembling the
    wife.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The practitioner holds the figures face to face, repeats the charm three times,
    and breathes on their heads after each repetition.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The male figure is placed by the practitioner’s right thigh and the female
    figure by the left thigh, both looking away from each other.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Incense is burned, and the same charm is recited twenty-two times over each
    figure.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The figures are put back to back, wrapped in seven thicknesses of leaves,
    tied with seven-coloured thread wrapped seven times, and buried.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: After seven days the figures are dug up; if they are still present the charm
    has failed, but if absent it will work and the couple will be divorced.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The dissension charm describes Fatimah as a goat and Muhammad as God’s tiger,
    saying she will be like a goat facing a tiger if she faces him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage identifies a following procedure as an example of soul abduction
    without contact.
  category: other
  evidence_refs:
  - ev:10
- id: obs:11
  text: For soul abduction, the practitioner goes out when the sun clears or when
    the newly risen moon looks red, stands with the right big toe on the left big
    toe, makes a trumpet of the right hand, recites the charm three times, and blows
    through the hollowed fist after each recital.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The soul-abduction charm says the speaker looses a shaft that darkens moon,
    sun, and stars, but the target is the stalk of the heart of a named person; the
    charm then calls that person’s soul to come walk and sit with the speaker.
  category: speech
  evidence_refs:
  - ev:12
