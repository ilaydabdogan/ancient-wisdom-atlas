canonical_text:
  quote: ''
  summary: 'The passage describes Malay funeral actions at the grave: the Imam sits
    on leaves, pours eagle-wood and sandal-wood water in three libations over the
    grave, scatters flowers, reads the Talkin as an exhortation to the deceased, and
    leads the assembly in the tahalil. It reports a belief that during the Talkin
    the corpse momentarily revives, rises partly to listen, realizes its death, and
    falls lifeless again. Notes describe shroud bands made into memorial bracelets
    and children passing three times beneath a parent’s karanda to prevent pining.'
  language: English
  quote_policy: summarized
