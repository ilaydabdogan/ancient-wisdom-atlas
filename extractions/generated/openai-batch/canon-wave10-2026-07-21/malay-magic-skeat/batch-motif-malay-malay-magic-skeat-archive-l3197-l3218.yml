canonical_text:
  quote: ''
  summary: An unfilial son persists in turning his parents away. The parents return
    to the shore and weep; the mother lays her hand on her breast and prays that,
    if he is truly her breast-reared son, he be changed into stone. Milk comes from
    her breast, and the ship with all aboard is turned to stone. The mother looks
    back at her son, the father does not, and both parents are turned into pauh trees,
    one leaning seaward with sweet fruit and one landward with bitter fruit. The ship
    is now a hill; its furniture was once borrowed by Malays for feast days and not
    returned until none remained.
  language: English
