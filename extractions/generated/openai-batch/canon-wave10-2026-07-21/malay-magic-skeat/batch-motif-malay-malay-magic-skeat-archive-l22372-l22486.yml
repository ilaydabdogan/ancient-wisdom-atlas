canonical_text:
  quote: ''
  summary: A ceremonial medical inspection uses smoke, rice, jars, leaves, a taper,
    oil, water, and spoken invocations to summon souls, ask permission from named
    custodial figures, appoint guardians, inspect signs in jars of water, and judge
    the patient’s prospects from smell, leaf condition, scum, and water movement.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The smell of rising smoke is assessed: pleasant smell is a good sign, scorched
    smell is bad, and offensive smell means no medicine can save the patient.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Parched, washed, and saffron rice are fumigated over incense and strewn around
    a row of jars.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The rite addresses the seven souls of the named patient and asks them to come
    so the group may see the medicine for them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The rice is strewn first to the right, then to the left, and then to the right
    again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before the calladium leaves are removed from the jar mouths, named figures
    associated with earth, heavens, trees, and water are greeted, and permission is
    requested to see the remedies.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A wax taper is waved in censer smoke seven times toward the right, then planted
    on the edge of a jar before gazing into the water to see signs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tanju is addressed as a guardian for the speaker’s brother and as a being
    sprung from primordial elements and from the gum of Muhammad’s eyes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: An oily scum on the water is a bad sign, and a faded calladium-leaf covering
    is a sign of severe sickness.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The jars are fumigated with incense smoke and anointed with oil of Celebes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mustia Kembang is addressed as a guardian, said to have sprung from Lady Eve,
    and asked to cooperate without breaking faith or promise.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Parched rice is thrown into the jars, and water is requested as a boon for
    the healing of the named patient.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Perfectly still water is a bad sign, while slightly disturbed water is a good
