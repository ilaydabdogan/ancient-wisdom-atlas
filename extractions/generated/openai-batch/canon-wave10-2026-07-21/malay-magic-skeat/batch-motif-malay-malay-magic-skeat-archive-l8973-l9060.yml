canonical_text:
  quote: ''
  summary: 'The passage reports a strongly held Malay belief in were-tigers, especially
    associated with Korinchi people from Sumatra. It gives anecdotes offered as proof:
    a man with gold-plated teeth killed in tiger form, Haji ‘Abdallah caught naked
    in a tiger trap, Korinchi men vomiting feathers after alleged tiger-form feeding,
    clothing and packs left where a tiger emerges, and Perak incidents involving missing
    fowls and tiger traces. A footnote describes a Javanese method of tiger transformation
    through sympathetic magic using an elastic tiger-striped sarong and charms. The
    passage also notes that Korinchi people deny the powers attributed to them.'
  language: English
  quote_policy: summarized
