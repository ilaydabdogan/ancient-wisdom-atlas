canonical_text:
  quote: ''
  summary: A Malay harvest rite describes the Pawang and bearers bringing the Rice-child
    home, its threshold reception with call-and-response verses and saffron-rice,
    its placement on a sleeping mat with pillows, the arrangement and fumigation of
    rice baskets, and three days of taboos explicitly compared to those observed after
    the birth of a real child. A note reports a field action and invocation asking
    Prophet ’Tap, guardian of the earth, to confirm the speaker’s child and protect
    it from demons and devils.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Pawang and Eldest Bearer returned from the field with the Rice-child,
    which the bearer shielded from the sun with an umbrella.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the foot of the house-ladder or threshold, the wife of the owner and other
    women met the party.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wife of the owner asked “What news?” three times and received “It is well”
    three times.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the third reply, the wife threw saffron-rice over the Pawang and recited
    lines identifying the arriving one as a child of hers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Pawang replied with verse saying that he had crossed the stream because
    of a strong desire to come.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The bearer of the Rice-child added a verse described as likely spoken on the
    Rice-child’s behalf, saying the coming was not fortuitous but desired from the
    heart.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Rice-child, still in its basket, was carried into the house and laid on
    a new sleeping-mat with pillows at the head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Three bearers returned with rice-baskets covered with sarongs; the baskets
    were deposited in size order at the foot of the soul-basket.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Pawang removed the sarongs, put them on the Rice-child’s pillow, stuck
    the penuweis into her hair, fumigated the row of baskets and the Rice-child, and
    covered them with a long white cloth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The wife of the master of the house was instructed to observe taboos for three
    days.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The taboos forbade goods and tame animals to leave the house, required quiet
    as for a newborn child, forbade hair-cutting, forbade reapers’ shadows to fall
    on the rice, and required a light near the Rice-child’s head and the hearth-fire
    to remain burning for three days.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states that these taboos are in many respects identical with those
    observed for three days after the birth of a real child.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: A note reports that each reaper tied rice leaves together, dug up earth with
    the great toe of the left foot, inserted the earth into each clump, and spoke
    an invocation.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The invocation greets Prophet ’Tap as the one in charge of the earth and asks
    him to confirm the speaker’s child, do it no harm, and remove it from Demons and
    Devils.
  category: speech
  evidence_refs:
  - ev:12
