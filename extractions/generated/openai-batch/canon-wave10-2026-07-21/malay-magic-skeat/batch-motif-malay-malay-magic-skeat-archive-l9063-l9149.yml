canonical_text:
  quote: ''
  summary: The passage describes Chenaku occult practitioners who can transform into
    tigers, Malay beliefs about ghost tigers marked by an unusually small foot and
    serving as invulnerable guardians of sacred places, a shrine guardian tiger killing
    a man who offered pork at a Muhammadan shrine, and traditions linking Jugra Hill
    with ghost-tiger guardians, the Princess of Gunong Ledang, haunted jungle beings,
    and the Princess's giant cat attendant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Chenaku, only people practiced in elemu sehir, or occult arts, are described
    as capable of transforming themselves into tigers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Korinchi people are said to fear entering the Chenaku district.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ghost tigers are generally supposed to have one foot a little smaller than
    the others, and the narrator reports being shown spoor with this feature near
    Sepang.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ghost tigers are considered invulnerable, harmless to humans, and generally
    guardian spirits of sacred spots.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The shrine of 'Toh Kamarong was alleged to be guarded by a white ghost elephant
    and a ghost tiger who ranged the surrounding country without harming anyone.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Chinaman from neighbouring pepper plantations offered pork at the shrine,
    after which the ghost tiger killed him before he could return home.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The ghost tigers guarding the shrine at the foot of Jugra Hill were said to
    have formerly been pets of the Princess of Malacca, Tuan Putri Gunong Ledang.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Local report says the Princess left her country when it was taken by the Portuguese
    and established herself on Jugra Hill.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Bukit Jugra is described as isolated, conspicuous from the sea, and an object
    of veneration; its jungle is said to be full of hantus, including a langswayer
    and a bajang.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Princess of Gunong Ledang is described as holding the premier position
    among the fabulous denizens of Jugra Hill, and the passage notes an association
    between Mount Ophir and Bukit Jugra in traditionary lore.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: A story says the Princess killed her husband by pricking him to death with
    needles, chose to live free from married restrictions, and travelled to distant
    lands with a cat of fabulous dimensions as her attendant.
  category: sequence
  evidence_refs:
  - ev:10
