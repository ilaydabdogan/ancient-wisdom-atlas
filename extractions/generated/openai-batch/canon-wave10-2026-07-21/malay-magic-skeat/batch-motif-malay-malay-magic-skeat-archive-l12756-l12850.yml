canonical_text:
  quote: ''
  summary: 'The passage describes a Malay sowing ceremony involving a four-pole frame,
    four planted corner plants, a coconut shell of water used for omens, and rice-seed
    planted in seven holes with a charm addressing Prophet ’Tap and the rice-child
    S’ri Gading/Gemala Gading. It then summarizes related planting and reaping rites:
    apology-like propitiation of the rice before cutting, sprinkling with flour-water,
    setting aside the first cut rice for a feast, visiting a revered kramat with offerings
    and prayers, occasional mock combat to expel evil spirits, and an occasional propitiation
    of the earth-spirit.'
  language: English
  quote_policy: summarized
