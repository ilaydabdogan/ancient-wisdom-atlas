canonical_text:
  quote: ''
  summary: The passage describes the contents and handling of an anchak, a sacrificial
    tray prepared by the Pawang with cooked and uncooked fowl portions, colored rice,
    cakes, rice-bags, liquids, blood, tapers, betel, cigarettes, and coins. The loaded
    tray is waved around and over a patient, the patient spits into it, and the Pawang
    carries it into the night jungle and hangs it from a selected tree. A white ant
    settling on the offering is received by the Malays present as a sign that the
    spirits accepted it.
  language: English
  quote_policy: summarized
