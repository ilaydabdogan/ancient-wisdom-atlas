canonical_text:
  quote: ''
  summary: A parallel account describes Azrael confronting the personified Earth and
    forcibly taking its white Heart to God. God orders Gabriel to mould Adam from
    this earth-substance; Gabriel softens it with water, hardens it with fire, and
    obtains life from God for it. The passage then notes Eve, the first-born child,
    a birth attended by darkness and evil influences, and an apotropaic action by
    Adam. Footnotes compare Islamic and Malay variants of Adam’s clay formation, including
    failed first forms, Azrael’s role, Eblis, and iron in the successful body. A quoted
    Malay treatise also enumerates the human body’s bones, blood-vessels, and other
    parts.
  language: English
  quote_policy: summarized
