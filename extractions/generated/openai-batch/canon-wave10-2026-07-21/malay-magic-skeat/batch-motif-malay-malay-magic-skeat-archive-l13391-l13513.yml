canonical_text:
  quote: ''
  summary: 'A Pawang performs a rice-field ritual: she prepares objects from the soul-basket,
    anoints and fumigates them, cuts the first seven rice heads while praying, kisses
    and wraps them, places them in a basket as the Rice-child, calls the rice-soul,
    and has the First Bearer escort the basket under an umbrella. Notes within the
    passage explain omens and additional actions believed to affect the quality and
    fullness of the rice.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A small lump of soil is picked up with the toe of the left foot and deposited
    in the centre of the sheaf.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The contents of the soul-basket are identified as an egg, stone, candle-nut,
    and shell; they are anointed with oil, fumigated, and replaced in the basket.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Pawang anoints the blade called the penuwei sulong or “Eldest Rice-cutter”
    with frankincense oil, presses her right thumb against the roof of her mouth,
    and cuts the first seven rice heads while repeating “the Ten Prayers.”
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The first seven rice heads are put together, kissed, and accompanied by eye-turning
    and swallowing gestures.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A note reports the Pawang’s explanation that eye-turning, swallowing, tongue
    placement, throat contraction, hand-clapping, and arm gestures are used to affect
    whether the rice is smooth, rough, full, or empty.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The seven ears are laid in a white cloth, anointed, tied with parti-coloured
    thread, fumigated with incense, strewn with several kinds of rice, folded in the
    cloth, and placed in the basket.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Pawang strews rice over the sheaf, tosses some backward over her head,
    throws the remainder over the party, asks pardon, and calls “kur semangat” three
    times.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The coconut shell that had held the tepong tawar is pushed into the middle
    of the sheaf, and the trodden lane around the sheaf is concealed by bending surrounding
    rice ears over the gap.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The First Bearer slings the Rice-child basket around her neck with a red cloth
    and opens an umbrella to shield the Rice-child from the sun.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: After the Pawang repeats an Arabic prayer, she moves to another part of the
    field, cuts another seven rice heads, places them in a rice-basket, and gives
    instructions to female bearers to reap in parallel straight lines.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: 'A note lists omens: crow or rook cawing, kite cry, and ground-dove flight
    are disastrous or bad; the flight of the bird called Rice’s Husband is good; absence
    of any portent or sound is best.'
  category: other
  evidence_refs:
  - ev:11
- id: obs:12
  text: A note states that the umbrella had been forgotten and that, without it, the
    Rice-child could not be escorted home.
  category: other
  evidence_refs:
  - ev:12
