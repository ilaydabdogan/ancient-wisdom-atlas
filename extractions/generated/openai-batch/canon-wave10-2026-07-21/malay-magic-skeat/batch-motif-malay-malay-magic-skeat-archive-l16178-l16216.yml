  summary: 'The passage reports Malay beliefs and observations about crocodiles: crab-like
    underwater stalks in a preceding fragment; supposed false stomach pouches for
    stones and victims'' belongings; neck eyes used underwater or at night; swallowed
    stones interpreted as counts of places or victims; a roaring fighting sound; and
    ways of provoking the wrath of crocodile-folk by dipping cloth in their river
    water.'
