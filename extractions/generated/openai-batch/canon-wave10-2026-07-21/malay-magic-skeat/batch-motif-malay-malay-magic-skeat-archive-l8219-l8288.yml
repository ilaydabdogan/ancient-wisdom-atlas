canonical_text:
  quote: ''
  summary: The passage describes a Malay building-measurement augury in which a final
    measurement may coincide with one of eight beasts. Unlucky results can be avoided
    by shortening the threshold. Rhyming stanzas give examples for the dragon, dairy-cow,
    lion, and dog, with associated predictions of safety, death, prosperity, obstacles,
    or violence. Notes mention an alternative measurement from threshold to the end
    of the house and connect the dragon with a mystic Dragon used as an aspect compass
    in Malay charm-books.
  language: English
  quote_policy: summarized
