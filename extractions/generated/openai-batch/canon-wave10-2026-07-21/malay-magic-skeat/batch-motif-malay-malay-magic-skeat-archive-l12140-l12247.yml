canonical_text:
  quote: ''
  summary: The passage gives an opening ritual speech that summons a personified addressee
    and names ivory implements used in cutting, collecting, and processing plant sap.
    A note identifies these as the Pawang's working tools. The passage then lists
    rules collected at Langat, Selangor, for planting sugar-cane, maize, plantains
    or bananas, sweet potatoes, cucumbers, gourds, cocoa-nuts, and rice. The rules
    connect planting success with time of day, bodily condition, tool shape, night
    sky, protection from fire-flies, coconut seed omens, and the Rice Soul being treated
    as an infant.
  language: English
  quote_policy: summarized
