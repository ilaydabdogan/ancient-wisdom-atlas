canonical_text:
  quote: ''
  summary: The passage describes Malay poison-neutralising charms and related ritual
    practice. It says such charms may be used against poisons and other evil principles
    believed to have entered a sick person, frames the charms as divine gifts sent
    by God through Gabriel to Muhammad, describes a procedure using grated bezoar-stone
    mixed with water and drunk after the charm, and gives examples involving upas,
    sea-snake venom, and an invocation of Dato’ Malim Karimun.
  language: English
  quote_policy: summarized
