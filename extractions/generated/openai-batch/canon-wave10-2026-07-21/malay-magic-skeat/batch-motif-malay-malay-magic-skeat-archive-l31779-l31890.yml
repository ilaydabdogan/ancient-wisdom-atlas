literal_observations:
- id: obs:1
  text: For daytime use, the practitioner is instructed to burn incense and say a
    formula denying that a turban is carried and saying instead that the soul of Somebody
    is carried in the girdle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At sundown, when the sun is at the horizon, the practitioner chews betel and
    spits out the chewed leaf three times.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The practitioner stands opposite the door, preferably looking west, burns
    incense, and repeats a charm.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The charm gives the names Nur Mani and Si Pancha Awalis, asks the addressee
    to concentrate thoughts on the speaker, be enamoured, be distraught by day and
    night, and return home and to the palace.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator states that the charm is intended to induce a wandering soul,
    semangat riang, to return to its owner.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: A wizard informant said it was taboo during the whole evening of using the
    charm to let anyone pass between the light and the patient.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A following ceremony is described as professedly divination, tilek or penilek,
    but the narrator calls it another form of soul-abduction.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The practitioner is instructed to take wax from a deserted bees' comb, make
    a wax taper, stick it on the rim of a white cup, and repeat a charm so that the
    affected person can be seen in the taper's flame.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The taper charm calls the souls of Somebody to come together to the speaker
    and says the solitary taper is their house and house-ladder.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The taper charm states that the liver, stomach, heart, spleen, great maw,
    body, and life of the souls have been given into the speaker's care.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The practitioner is instructed to take a fathom's length of thread with seven
