canonical_text:
  quote: ''
  summary: The passage describes Malay propitiation rites involving offerings. In
    one rite, a banana-leaf limas receptacle is loaded with rice, bananas, betel,
    a cigarette, an egg, and other items, carried to a river or sea, addressed to
    Khailir/Khizr as Lord of water, and set adrift; water from beneath it is taken
    home to bathe the sick man. Another rite, ambang-ambangan, wraps sevenfold offerings
    in a banana leaf, deposits them at a place where three roads meet, and addresses
    Jembalang Jembali, Demon of the Earth, asking him to restore the patient and threatening
    a curse if he does not. The passage notes that this latter rite is generally used
    for fever and then begins a transition to counter-charms against poisons.
  language: English
  quote_policy: summarized
