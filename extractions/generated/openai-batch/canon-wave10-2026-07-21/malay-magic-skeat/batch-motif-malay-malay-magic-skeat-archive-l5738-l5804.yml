canonical_text:
  quote: ''
  summary: 'The passage catalogues several Malay spirits: jungle spirits, tree-associated
    spirits, a baboon demon that can possess dancers and enable climbing feats, a
    tiger-spirit that takes bird form, and a demon said to interfere with snares by
    loosening knots. A footnote adds that Hantu Raya may dwell at the centre of four
    crossroads and mentions a sea-spirit of the same name, Si Raya, probably identified
    with Batara Guru. The opening fragment notes that those attacked by an unidentified
    male being foam at the mouth.'
  language: English
  quote_policy: summarized
