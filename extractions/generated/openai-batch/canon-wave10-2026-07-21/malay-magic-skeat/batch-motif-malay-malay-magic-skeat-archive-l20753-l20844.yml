canonical_text:
  quote: ''
  summary: 'The passage describes Malay wedding henna rites: henna is dabbed on the
    sitter’s palms, salutes are exchanged, relations repeat the action and an Arabic
    prayer concludes it. A Henna Dance with a henna cake in a brazen candle-ringed
    cup is performed, followed by eating and distributing henna-staining rice. The
    ceremonies repeat on the third night. On the fourth morning, the Concluding Day,
    fine apparel is worn and the bride’s hair, head-dress, tinsel fillet, jacket,
    jewelry, sarong, and trousers are described, with a note on a fillet pattern containing
    naga and butterflies.'
  language: English
  quote_policy: summarized
