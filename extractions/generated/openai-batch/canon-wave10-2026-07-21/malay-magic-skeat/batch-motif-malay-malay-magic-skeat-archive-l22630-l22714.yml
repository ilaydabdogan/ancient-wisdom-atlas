canonical_text:
  quote: ''
  summary: The passage describes Malay sacrificial trays used either as offerings
    for spirits to feed from or as containers into which evil spirits are invited
    before the tray is removed, hung in the jungle, or set adrift. It then gives a
    typical arrangement of tray contents, including banana leaf, parched rice, betel,
    cigarettes, tapers, water receptacles, coins, meat, cakes, rice packets, eggs,
    water, cane-juice, blood, animal remains, and a censer, with repeated cooked/raw,
    numerical, directional, and color arrangements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One described use of the tray is to carry it out of the house, suspend it
    in a suitable place, and leave its contents for spirits to feed upon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Another described use places objects on the tray into which evil spirits are
    ceremonially invited to enter; the tray is then removed by hanging it in the jungle
    or setting it adrift in sea or river.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When set adrift, the tray is called the “keeled sacrifice-tray” or anchak
    pelunas.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The offerings vary according to the ceremony’s aim, the beneficiary’s means,
    and the medicine-man’s choice.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A typical tray is lined with banana leaf, strewn with parched rice, and supplied
    with five betel chews, five cigarettes, five wax tapers, five water receptacles,
    and five copper cents or dollars.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The five sets of articles are divided so that one portion is placed in the
    centre of the tray and four portions in its corners.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The tray includes fourteen portions of meat and fourteen portions of Malay
    cakes, with seven cooked and seven uncooked portions in each case.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The tray’s rattan suspenders are hung with fourteen long-shaped and fourteen
    diamond-shaped ornamental rice receptacles made of plaited coconut leaf.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Cooked and uncooked packets of rice, each stained a different color, may be
    placed in the tray; the listed colors are white, yellow, red, black, blue, green,
    and purple.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Two eggs are required, one cooked and one raw.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Alternate water receptacles are filled with water and cane-juice, while the
    central receptacle is filled with the blood of the sacrificial animal.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Feathers, feet, entrails, parched-rice refuse, and a censer are deposited
    on the ground directly under the tray.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Strictly, a white fowl and a black fowl should be killed, with only half of
    each cooked and the remainder left raw.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The portions of fowl are made very small and are described as a mere symbol
    or indication of each kind of food required by the spirits.
  category: attribute
  evidence_refs:
  - ev:6
