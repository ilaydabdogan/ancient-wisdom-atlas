canonical_text:
  quote: ''
  summary: 'An English account describes a multi-day Malay wedding: separate feasting,
    Koran readings and music, repeated henna dyeing, bridegroom processions with attendants
    and royal regalia, reception at the bride''s house with rosewater and rice, public
    acceptance of the bride with a stated cash dowry before the Imam, a prayer and
    blessing by the Bilal, and the couple sharing yellow rice on the dais to complete
    the marriage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Malay dances, supper is served to men in the balei or separate hall
    and to women in the adjoining house; Koran readings and drums continue until daylight.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bridegroom's fingers are dyed on Tuesday evening for a second time and
    on Wednesday evening for a third time with more ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bridegroom is dressed in silks and cloth of gold and paraded in an open
    carriage with groom'smen shading him by fan and umbrella.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bridegroom's procession includes followers beating drums and singing,
    a Royal sireh-box with dragons called naga pura and naga taruy, and Royal spears
    carried before and behind him.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the bride's house, the bridegroom is received with showers of rosewater
    and taken by elders to a raised dais where the bride and bridegroom await friends.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fourteen elders and then others dye the bridegroom's fingers with henna; women
    repeat the process on the bride while gongs and drums are beaten.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Imam states that the dowry is $100 cash and hears Wan Mahamed Esa publicly
    receive Siti Meriam as his wife.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Bilal reads a prayer and pronounces a blessing after the public reception
    of the bride as wife.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: On Thursday, the bride, with her father and relations, receives the Resident
    and accompanying guests; cakes and preserves are served.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The bridegroom later arrives in another procession with groom'smen, a Royal
    silk umbrella lent by the Sultan, Royal spears, the Selangor Band, and a crowd
    singing and beating gongs and drums.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The bridegroom's arrival is greeted with showers of rice, and the bride and
    bridegroom sit on the dais and help each other partake of yellow rice; the marriage
    is then said to be completed.
  category: sequence
  evidence_refs:
  - ev:10
