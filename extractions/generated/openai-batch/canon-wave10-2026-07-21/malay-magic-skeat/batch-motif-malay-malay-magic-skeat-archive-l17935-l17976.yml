canonical_text:
  quote: the vessel represents the head of the person standing his trial
  summary: The passage describes a Malay sorcery-detection ordeal in which a Pawang
    scrapes an iron vessel with a razor while the accused is in another room; if the
    accused is guilty, hair falls from the corresponding part of his head. It also
    describes village complaints after unexplained sickness or deaths, punishment
    of suspected wizards or witches, and a disrupted note about a Bajang familiar
    sent to harm victims and requiring food from its owner.
  language: English
