canonical_text:
  quote: "“the ‘Soul of the Rice’ not being disturbed thereby”"
  summary: The passage describes storing, processing, and cooking rice; contrasts
    modern sickle reaping and threshing with older tuai clipping, which is considered
    pious because it does not disturb the Soul of the Rice; explains land-sharing
    and rental arrangements; states that failure to follow cultivation ordinances
    and prohibitions leads to agricultural failure because these rules protect rice
    from enemies; and introduces a Pawang’s account of the sowing ceremony.
  language: English
  quote_policy: quoted
