canonical_text:
  quote: ''
  summary: A woman chants an invocation to Penglima Lenggang Laut, describing his
    Yellow Spirit-boat, its named parts, crew, route from the Navel of the Seas toward
    the sea where the Pauh Janggi grows, and asking him to descend into embodiment.
    While the chant continues, the medicine-man fumigates himself with incense, lies
    down with his head covered, undergoes possession-like convulsions and a cough,
    sits up, attends to jars, and lights a wax taper from a lamp.
  language: English
  quote_policy: summarized
