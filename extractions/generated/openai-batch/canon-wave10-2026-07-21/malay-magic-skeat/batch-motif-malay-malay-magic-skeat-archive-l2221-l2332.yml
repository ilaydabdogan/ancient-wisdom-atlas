canonical_text:
  quote: ''
  summary: 'The passage describes Malay royal status and salutation customs: royal
    blood is said by many Malays to be white; saluting kings and chiefs requires precise
    bodily gestures; rank governs whether hands may be touched and how high hands
    are raised; breaches of royal prerogatives are believed or reported to bring death;
    examples include a quotation from the Malay Ramayana, the killing of Imam Bakar
    after touching a chief’s hands, audience-hall salutation procedure before the
    Sultan, and the death of Penghulu Mohit attributed to usurping royal privileges.'
  language: English
  quote_policy: summarized
