canonical_text:
  quote: ''
  summary: 'The passage describes Malay funeral preparations: a burial service with
    religious participants facing west, timing arranged so the body can be taken to
    the grave before nightfall, preparation of scented water and fragrant materials,
    preparation of betel items, cloth, an alms bowl for kin contributions, and bringing
    a bier; in the single-plank coffin case, the body is laid on a plank carried on
    the bier.'
