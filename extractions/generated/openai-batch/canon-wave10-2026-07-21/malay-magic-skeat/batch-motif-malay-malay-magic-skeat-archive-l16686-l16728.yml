canonical_text:
  quote: ''
  summary: 'The passage gives instructions and cautions concerning crocodiles, including
    killing a crocodile by cutting the root of its tail, warning against keeping a
    captured crocodile alive overnight because the spirit Langsuir may empower it,
    and warning against bringing it into a house because of its relation with the
    house-lizard. It then describes snake lore: the python''s live gall-bladder is
    prized and believed to grow into a larger serpent if preserved, and a pit viper
    is described as remaining coiled on a tree branch for days.'
  language: English
  quote_policy: summarized
