  quote: ''
  summary: The passage lists varieties and qualities of eagle-wood, describes its
    economic and ritual uses, and records a procedure in which a gharu-wizard burns
    incense, invokes eagle-wood and earth beings, listens to a karas-tree for a whispering
    sound interpreted as the voice of a spirit, marks the bark with a cross, builds
    a shelter, recites another charm, and expects the gharu-spirit to appear.
