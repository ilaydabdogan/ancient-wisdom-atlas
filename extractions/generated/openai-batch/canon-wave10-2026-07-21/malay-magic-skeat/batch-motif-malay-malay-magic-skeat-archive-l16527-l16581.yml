canonical_text:
  quote: ''
  summary: A crocodile charm addresses Si Jambu Rakai, binds and presents a fowl bait
    under the name Princess Rundok, threatens death if the offering is refused, and
    orders the crocodile's movements by invoking King Solomon's Word and an Islamic
    formula. The accompanying ritual uses a canoe paddle as a mock crocodile tail,
    thread connecting a floating platform and boat, and three strikes on the water
    to read an omen for when the crocodile will swallow the bait. During each strike
    the practitioner repeats an origin formula mentioning Fatimah to make the crocodile
    bold.
  language: English
  quote_policy: summarized
