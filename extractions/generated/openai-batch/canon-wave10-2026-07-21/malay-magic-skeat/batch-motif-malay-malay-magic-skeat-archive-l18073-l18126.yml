canonical_text:
  quote: ''
  summary: The passage describes the Langsuir as a female birth-spirit or woman-vampire
    recognizable by a green robe, very long nails, long black hair, and a neck-hole
    through which she sucks children's blood. It gives a method for taming her by
    cutting her nails and hair and stuffing them into the neck-hole, after which she
    may live as an ordinary woman until a dance causes reversion to ghostly form.
    It also reports wild Langsuir gathering at river-mouth fishing stakes to steal
    fish, gives a charm for laying a Langsuir, and notes a plate depicting the Penanggalan
    and Langsuir.
  language: English
  quote_policy: summarized
