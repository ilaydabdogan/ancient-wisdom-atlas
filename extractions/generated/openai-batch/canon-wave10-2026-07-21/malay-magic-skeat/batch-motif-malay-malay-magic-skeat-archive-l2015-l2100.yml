canonical_text:
  quote: ''
  summary: 'The passage describes Malay royal prerogatives attributed to Sultan Muhammed
    Shah and later Malay rulers: restrictions on public use of yellow cloth, certain
    house forms, gold-decorated creeses and gold ornaments; rules for entering the
    palace with prescribed clothing and creese placement; umbrellas reserved to the
    raja and royal family; funeral restrictions on Payong, Puwadi, and alms unless
    royally permitted; and later continuities at Malay Sultan courts, including a
    distinction between manufactured yellow cloth and saffron-dyed yellow cloth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sultan Muhammed Shah is described as establishing the order of his sovereignty
    and as the first to prohibit public wearing or display of yellow cloth items,
    with named exceptions for waist cloth, coat, and turban.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says he prohibited several house-building features, including
    abutments, smaller houses connected to main houses, suspended pillars or timbers,
    timbers projecting above roofs, and summer houses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says he prohibited gold ornamentation on creeses and the wearing
    of certain gold anklets or hollow bracelets ornamented with silver.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says prohibited articles could be worn only by the ruler's particular
    licence, and that this privilege has belonged to the raja ever since.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Entry into the palace is described as requiring a cloth petticoat or sarong
    of decent length, a shoulder-cloth, and a creese worn in front.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: If a person entered with the creese worn behind, the gate porter was required
    to seize it; conduct contrary to the order is called a transgression against the
    raja and subject to a fine.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The white umbrella is described as confined to the raja's person, while the
    yellow umbrella is confined to his family.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: At funerals of subjects, the use of the Payong, the Puwadi, and the distribution
    of alms are interdicted unless royal permission is granted; forbidden articles
    may be confiscated.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Puwadi is defined as spreading a cloth, generally white, for funeral and other
    processions; for a deceased person of high rank, it may extend from the house
    where the corpse is kept to the burial-ground.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that similar prohibitions remain in force at the courts
    of Malay Sultans in the Peninsula, though a yellow umbrella is generally substituted
    for the white, at least in Selangor.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage distinguishes manufactured yellow cloth from cloth dyed yellow
    with saffron, treating wrongful use of the saffron-dyed cloth as especially heinous.
  category: relationship
  evidence_refs:
  - ev:9
