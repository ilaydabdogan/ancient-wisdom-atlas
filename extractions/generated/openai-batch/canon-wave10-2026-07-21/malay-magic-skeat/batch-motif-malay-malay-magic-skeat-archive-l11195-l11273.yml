canonical_text:
  quote: ''
  summary: The passage gives a Malay legend in which a quarrelling husband and wife
    exchange mocking phrases while the husband climbs and the wife cooks stones substituted
    for yams; both are transformed into stick-insects and continue their mutual mockery.
    It also reports Malay interpretations of a night sound on the Langat river as
    the note of these insects and as a guide to Malacca-cane localities, including
    a Selangor variant involving a cane climbed toward the sky. A following section
    describes the Tualang or Sialang tree, its poisonous sap, its hollow projections
    regarded as spirit houses, the taboo against felling such trees, and examples
    of people harmed or dying after cutting them.
  language: English
  quote_policy: summarized
