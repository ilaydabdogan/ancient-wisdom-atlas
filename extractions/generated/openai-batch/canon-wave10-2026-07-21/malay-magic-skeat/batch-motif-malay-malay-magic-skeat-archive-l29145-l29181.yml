canonical_text:
  quote: ''
  summary: The passage lists auspicious and inauspicious qualities of Malay weapons,
    especially the kris and the badik/sendrik. Particular damask patterns or markings
    are said to bring luck, safety, success in trading, combat, planting, or property
    division, while splits or cracks in a kris blade are treated as unlucky signs,
    including one sign that the kris requires blood and may make its possessor sick
    if this is not satisfied.
