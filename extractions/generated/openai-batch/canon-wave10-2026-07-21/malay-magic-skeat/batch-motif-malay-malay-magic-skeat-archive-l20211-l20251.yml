canonical_text:
  quote: ''
  summary: 'The passage describes Malay betrothal customs: forfeiture rules for pledge-money,
    customary marriage portions, the proposer’s right to demand a silk outfit when
    paying the full portion, the fiancée’s avoidance of her lover, absence of ring,
    priest, and consent-request at the engagement, former reciprocal gift exchanges,
    a carved areca-nut chain redeemed by payment, and cloths used to wrap presentation
    betel-leaf.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage describes forfeiture rules for pledge-money: if one side refuses
    after receiving pledge-money, twice the received amount is forfeited; if the youth
    refuses, he forfeits the pledge-money already paid to the girl’s parents.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Marriage portions are described as varying between families, with $44 stated
    as the generally recognized customary wedding portion, while $30 and $50 are noted
    as less common amounts.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the full $44 is paid, the proposer may demand a complete silk outfit,
    or persalinan, valued at about $20, so the actual amount changing hands is described
    as closer to $24.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Malay fiancée is described as taking pains to avoid her lover and as being
    “as watchful as a tiger.”
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that no engagement-ring is used locally, no priest or Lebai
    is present at the engagement ceremony, and the girl is not asked for her consent.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: A former Selangor custom is described in which the man sends betel-leaf, fruit,
    and eggs in network receptacles, while the woman sends specially prepared rice
    in rush-work receptacles of various patterns.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The woman is said to have sometimes carved a chain of three or four links
    from a single areca-nut, and the prospective bridegroom was expected to redeem
    it by paying one dollar per link.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two square cloths resembling doilies are described as patterns of the gĕdĕbong,
