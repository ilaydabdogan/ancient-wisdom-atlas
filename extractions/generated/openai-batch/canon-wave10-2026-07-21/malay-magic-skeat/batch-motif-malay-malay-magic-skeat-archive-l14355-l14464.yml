canonical_text:
  quote: ''
  summary: The passage lists Malay tin-mining taboos and penalties administered by
    the pawang, then explains beliefs that tin is protected by spirits and is itself
    alive, mobile, reproductive, and responsive to treatment. It also defines mining
    ritual objects and terms, including altars for offerings, prescribed vegetal materials,
    palm-leaf fringes, incantation, and a ritual stake.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person may not cross a race while a miner is sluicing unless he goes some
    distance above the miner upstream; violation incurs a tin-sand penalty payable
    to the race owner and adjudicated by the pawang.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a mine, an unsheathed kris or spear must be wrapped in leaves so that even
    the metal setting is hidden; spears may only be carried at the trail.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the death of a miner, each comrade at that mine pays one chupak of tin
    sand to the pawang.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage relates the common fine amount to Malay customary law and to a
    customary dowry amount for certain marriages.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Malay miner is said to believe that tin is under the protection and command
    of spirits that must be propitiated.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The tin itself is described as alive, as having properties of living matter,
    as moving by its own volition, as reproducing itself, and as having likes or affinities
    for certain people and things.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says tin-ore should be treated with respect, its convenience consulted,
    and mining conducted so that the ore may be obtained without its own knowledge.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: An ancha is a square frame of bamboo and peeled wood, hung under the thatch
    of the smelting-shed and used as an altar on which miners place offerings to spirits.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The ancha should use kayu sungkei and be bound with a creeper; rattan may
    not be used.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A genggulang is a platform or altar erected by the pawang at the opening of
    a mine, made of kayu sungkei, with posts, a raised platform, railing, a four-step
    ladder, a coconut-leaf fringe, and creeper bindings; rattan must not be used.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Jari lipan is defined as a fringe made from young white coconut-palm leaflets
    plaited together.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Jampi is defined as the pawang's incantation.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Kapala nasi is described as a peeled kayu sungkei stake stuck in the ground,
    with its top split into four.
  category: object
  evidence_refs:
  - ev:11
