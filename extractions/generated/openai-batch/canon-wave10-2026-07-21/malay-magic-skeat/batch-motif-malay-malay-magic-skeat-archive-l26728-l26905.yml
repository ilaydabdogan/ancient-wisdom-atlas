canonical_text:
  quote: "“The pole-cat fiend has arrived / And not a fowl is left.”"
  summary: 'The passage describes several Malay children’s games and nursery rhymes:
    Hantu Musang, Mam Tunggul, Kuching, Sorok-sorok, Main Galah Panjang, Sanebang,
    and Sapu-sapu ’Ringin. The games combine bodily play, guessing, chasing, marked
    ground, rhythmic touching, and sung images involving a pole-cat fiend, stump,
    cat, night hiding, water, a banyan tree, a maimed crocodile, eggs, plantains,
    and a fruit-bat.'
  language: English with Malay rhymes and terms
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In Hantu Musang, a boy is placed between two others with a cloth fitted over
    his head like a cap; the outside boys pull the front and back cloth ends alternately,
    rocking him while a rhyme is repeated.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Hantu Musang rhyme mentions digging tapioca, knotted timber where the
    pole-cat breeds, pepper-blossom, the arrival of the pole-cat fiend, and the absence
    of a fowl.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the Hantu Musang rhyme ends, the two outside boys run away, and the pole-cat
    pursues them and may bite the first one he overtakes on the arm.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Mam Tunggul, one boy represents the tunggul or stump and stands between
    two facing parties; boys whisper names to him until matching selections occur,
    after which he gestures and one side carries the other side back on their shoulders.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: In Kuching, a witness turns away while one boy is selected as the cat and
    another boy twitches him; the witness then turns round and guesses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: Sorok-sorok is described as the Malay equivalent of hide-and-seek, with the
    stated difference that it should properly be played only at night.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:7
  text: Main Galah Panjang uses a square of ground divided into four quarters by a
    cross and is played by three players on each side.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:8
  text: In Sanebang, two players sit facing each other, chant a rhyme, and one lightly
    touches the other’s left arm in time to the music.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: The Sanebang rhyme includes a river mouth, drizzling rain, a bathing Katong,
    and the Princess’s hand.
  category: speech
  evidence_refs:
