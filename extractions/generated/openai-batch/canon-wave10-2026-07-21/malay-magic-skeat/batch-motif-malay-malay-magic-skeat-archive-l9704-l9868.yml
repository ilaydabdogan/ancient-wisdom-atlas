canonical_text:
  quote: ''
  summary: 'The passage gives deer-hunting instructions and charms: reading deer tracks
    as omens, calling named deer herdsmen, invoking pawangs, teachers, God, and other
    named powers, cutting or requesting a tree for noose support, naming rattan and
    toils by origin, addressing deer with scent-fixing and longing charms, taking
    seven ritual steps, and invoking powers so the toils remain effective.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The deer track or slot is examined for signs; a shortened side indicates danger
    to the quarry, and lameness in one hoof indicates it will be killed within seven
    days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After entering the jungle and finding the dogs, the practitioner waits for
    the dogs to bark and then calls four named herdsmen of the deer to come down to
    meet the dogs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: One charm states that the speaker is not the huntsman and the dogs are not
    his; the huntsman is named as Pawang Sidi and the dogs as belonging to Pawang
    Sakti, with efficacy invoked through a teacher and a declaration of God.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A deer pawang named ’Che Indut provides a charm to recite while cutting the
    support or shoulder of the noose, usually from a young Delik tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Another instruction says to carry the toils into the jungle, meet the deer
    slot, ask a figure named ’Tap for a tree, and then begin unrolling the toils.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The rattan and the toils are given names, and an explanatory note says that
    mentioning an object's origin is supposed to give power over the addressed article.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A charm addressed to the deer is used for fixing the scent and suspending
    the toils, telling the deer to ascend the twin stream and push forward its two
    fore-feet.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: When setting the nooses, the practitioner addresses the deer and tells it
    to be filled with yearning and longing, fast-bound by love of the noose.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: In another set of directions, after a charm for emboldening the dogs, the
    practitioner takes seven steps forward, leaves the toils behind, stands erect,
    and asks the Saids to drive the deer into the toils.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: After unrolling and doubling the toils, the practitioner invokes Mentala or
    Batara Guru, the Teachers, and Sir Yellow Glow so that the toils will still kill
    the quarry even if staled by dogs or men.
  category: speech
  evidence_refs:
  - ev:10
