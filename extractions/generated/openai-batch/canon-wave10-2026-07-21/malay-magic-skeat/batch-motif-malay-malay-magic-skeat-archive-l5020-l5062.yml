canonical_text:
  quote: ''
  summary: The passage first describes a ritual action in which ashes are thrown toward
    a brightness while a formula naming Mambang kuning and mambang k'labu is recited,
    with the stated purpose of putting out a brightness believed to cause fever in
    persons weak in semangat. It then classifies Jins or Genii as subordinate spirits
    influenced by Muhammadan tradition and treated as a link between gods and ghosts.
    The passage states that Malays tended to identify these imported spirits with
    older Hindu spirits, especially the Black King of the Genii, who is described
    as rising to the level of a great Hindu divinity and as at times a manifestation
    of Shiva Batara Guru or the destructive side of Shiva, Kala. A footnote cautiously
    proposes that Sang Gala may be a corruption of Sangkara, a name of Shiva.
  language: English with Malay terms and formula
  quote_policy: summarized
