canonical_text:
  quote: ''
  summary: 'The passage describes Malay collection rites and beliefs concerning gutta-percha,
    camphor, and coconut palm products: gutta-percha trees are said to have an indwelling
    spirit whose blood is requested as sap; camphor collection is restricted by permits,
    ritual specialists, taboos, special language, and dream guidance from a female
    camphor spirit; coconut toddy collectors address named beings or souls located
    in parts of the palm while climbing and tapping it.'
