  summary: The passage describes Malay omen-reading from human actions and natural
    events. It lists bodily actions, domestic behaviors, clothing damaged by rodents,
    child posture, praise of children under the evil-eye belief, a star near the moon,
    and the entry of an unusual animal or wild bird into a house, together with associated
    consequences or counter-actions.
