canonical_text:
  quote: ''
  summary: 'The passage describes Malay birth and infant-care ceremonies: placing
    a spice-block or stone-child in the cot as a substitute when the child is removed;
    frequent cold-water bathing; rubbing the child with a rice and red-stone paste
    that has been fumigated; depositing selected objects and named parasites in the
    bath water; and beginning a post-bath ceremony performed by the Bidan.'
  language: English
  quote_policy: summarized
