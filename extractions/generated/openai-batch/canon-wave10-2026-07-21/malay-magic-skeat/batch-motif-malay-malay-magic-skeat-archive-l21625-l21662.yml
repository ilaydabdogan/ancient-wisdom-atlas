canonical_text:
  quote: ''
  summary: The passage recounts a rejected suitor, later named Mat Taib, who seized
    Wan Dena by her hair while armed with a kris and held her for three days and nights
    until drugged by an old woman. Wan Dena was then released and married to Mat Arshad
    at the Sultan’s palace; within a year Mat Taib attacked Bandar, killing Mat Arshad
    and wounding Wan Dena. The passage then describes panjat adat, a less lawless
    procedure in which a man sends his kris to the girl’s household with an offer
    of doubled dower and presents; if the guardians refuse, they return the kris with
    double the dower offered.
  language: English
