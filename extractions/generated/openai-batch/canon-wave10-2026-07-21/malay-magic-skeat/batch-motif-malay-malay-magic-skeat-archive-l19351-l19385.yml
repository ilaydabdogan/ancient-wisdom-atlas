  quote: ''
  summary: The passage describes Malay beliefs that a father's infringement of birth-period
    taboos, especially killing animals, can cause a child to be born with marks, deformities,
    or animal-associated afflictions called kenan. Examples include a crab-associated
    deformity and a fish-affection diagnosed and treated by a Pawang with a potion
    made from pounded fish bones. The passage also lists categories such as fish-struck,
    ape-struck, dog-struck, and crab-struck.
