canonical_text:
  quote: ''
  summary: 'The passage describes several Malay procedures for recalling a soul: one
    involving a dough image or cup and soul-cloth, another using seven betel chews,
    rice, thread, and an egg, and another using a rice-bag containing rice, an egg,
    a nail, and a candle-nut. Charms repeatedly summon the soul or souls back to their
    own house, family, and the patient’s body.'
  language: English
  quote_policy: summarized
