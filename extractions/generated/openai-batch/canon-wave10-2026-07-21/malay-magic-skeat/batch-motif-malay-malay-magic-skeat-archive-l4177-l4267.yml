canonical_text:
  quote: ''
  summary: The passage describes Malay lustration practices, especially the Tepong
    Tawar rice-flour-and-water rite. It explains fire and water as lustration media,
    the neutralising purpose of rice-water paste, the leaf brush used to apply it,
    the objects and persons to which it is applied, omens associated with the water’s
    movement, and selected leaves used in the brush with stated meanings.
  language: English
  quote_policy: summarized
