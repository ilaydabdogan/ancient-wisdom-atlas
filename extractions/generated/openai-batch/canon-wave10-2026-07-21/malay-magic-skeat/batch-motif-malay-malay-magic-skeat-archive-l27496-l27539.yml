  summary: The passage describes the Mdyong as a Malay theatrical performance involving
    dancing or posturing and singing, usually performed by travelling professional
    companies. It explains that Mdyong uses named tunes assigned to particular staged
    actions or stock characters, including sleep, death, entering the jungle, sitting
    down, the Princess, and other parts. The author compares this system in principle
    to a rudimentary Wagnerian leitmotif.
