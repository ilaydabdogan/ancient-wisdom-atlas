canonical_text:
  quote: ''
  summary: The passage describes the Malay Pawang as a ritual specialist with social
    sanctioning authority, an hereditary familiar spirit, regalia-like insignia, royal-color
    privileges, trance-oracle functions, political influence, guarded charms, and
    sometimes hereditary office. It gives anecdotes about claimed powers and describes
    a ritual method for obtaining magic by approaching the grave and ghost of a murdered
    man at a specified lunar time with prescribed objects, incense, circumambulation,
    and name-calling.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that neglect of certain rules was said to cause bad harvests
    and that observance of such rules is attributed to the influence and sanction
    of the Pawang.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Pawang is said to keep a familiar spirit called a hantu pusaka, an hereditary
    spirit running in the family, enabling him to deal with hostile wild spirits.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The priestly magician is described as owning insignia analogous to royal regalia
    and called by the same name, kabesaran.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The priestly magician shares with the king the right to use yellow cloth and
    to enforce certain ceremonial words and phrases.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The magician is described as acting as a spirit-medium, giving oracles in
    trances, possessing political influence, practising occasional austerities, and
    observing some degree of chastity.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: An aged magician from Perak was reputed to be able to raise a sandbank in
    the sea at will, but explained that he could do so only in wartime when pressed
    by an enemy boat.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Medicine-men are described as reticent about books and charms; one Pawang
    would not tell a charm until the narrator removed his shoes and sat with him on
    a yellow cloth while the formula was repeated.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The office of magician is said to be very often hereditary, though not always,
    and the passage introduces recognized ways in which a man may acquire magic.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: One stated method for obtaining magical powers requires meeting the ghost
    of a murdered man.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The ritual instructions prescribe a midrib of an ivory coconut-palm leaf for
    the grave, two more midribs representing canoe-paddles, a companion, and a visit
    to the grave at full moon when the fifteenth lunar day falls on a Tuesday.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The ritual further prescribes incense with glowing embers in a censer, carrying
    them to the grave head-post, fumigating the grave by going three times around
    it, and calling the murdered man by name.
  category: sequence
  evidence_refs:
  - ev:9
