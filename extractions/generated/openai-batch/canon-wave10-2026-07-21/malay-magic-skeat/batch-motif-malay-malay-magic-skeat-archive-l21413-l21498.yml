canonical_text:
  quote: ''
  summary: 'The passage describes the close of one Malay wedding account, including
    a visit by the bride and bridegroom to the Sultan and a concluding bathing ceremony,
    then gives another account of a wedding: preparations, decorated bridal furnishings,
    food arrangements, a buffalo sent with music, repeated henna-staining rites, tepong
    tawar sprinkling by the bride’s female-side relatives, offerings to guests, dancing
    and martial performances, and the summoning and arrival of the bridegroom for
    the marriage rite.'
  language: English
  quote_policy: summarized
