canonical_text:
  quote: ''
  summary: The passage describes Malay funeral prayer practices, including collective
    recitation with bodily motion, distribution of alms, funeral feasts, repeated
    tahalil, Koran reading to the corpse over three nights, commemorative feasts on
    set days, ancestor prayers and feasts, gender- and age-specific variations, grave
    markers, and grave-mound fittings. The final lines begin a new topic on Malay
    medicine and the balance of four elements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: All present turn their heads and rock side to side while seated and reiterate
    words one hundred times with a changing pace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Contributions in the alms-basin are divided among the entire company as alms.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The master of the house invites those present to a funeral feast at about
    five p.m.; the meal is described as like an ordinary Malay banquet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the feast the Imam reads prayers, the company breaks up, and the funeral
    decorations are left undisturbed for three days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: For three days the nearer neighbours are feasted in the morning and evening.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: For three nights at about ten p.m., a service called Reading the Koran to
    the Corpse is performed by the Imam or someone hired for the purpose, and even
    a slight slip is regarded as a great sin.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the end of three days there is another feast, after which the tahalil is
    repeated.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the seventh day a similar feast is followed by tahalil and distribution
    of prayer fees, though poor people may omit this tahalil or the host may ask for
    the fees to be waived.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A fourteenth-day feast normally ends the ceremonies, except that richer classes
    may keep forty-day and hundred-day feasts, and an anniversary may be kept as a
    holiday in respect for the deceased.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A day in Ramthan or Maulud may be chosen for prayers and feasting the ancestors.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When a woman dies, women wash the corpse; for very young infants the talkin
    is sometimes omitted.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: A woman’s nisan is distinguished by its shape, and a temporary nisan may be
    replaced by a permanent one after the funeral.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: When the grave is finally made up, four carved and scalloped planks are placed
    around the grave mound to keep the earth from falling down, and a feast is held.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage ends with a transition to Malay medicine, stating that successful
    practice is based on preserving the balance of power among four elements.
  category: other
  evidence_refs:
  - ev:8
