canonical_text:
  quote: The burning of incense is one of the very simplest, and hence commonest,
    forms of burnt sacrifice.
  summary: The passage describes Malay ceremonial use of incense as a burnt sacrifice,
    including an invocation to the Spirit of Incense, cosmic destinations and beings
    summoned by the fumes, observation of smoke for divination, and a second sacrificial
    practice involving several kinds of rice scattered or placed in a tray. It opens
    with a short fragment about a Bilal and a cloth from a preceding context.
  language: English
  quote_policy: quoted
