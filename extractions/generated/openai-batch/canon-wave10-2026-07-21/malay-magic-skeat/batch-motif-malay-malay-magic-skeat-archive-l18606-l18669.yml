canonical_text:
  quote: ''
  summary: 'The passage describes Malay birth-ceremony arrangements: plant leaves
    and a rattan cooking-pot stand are fastened under the raised house floor, a casting-net
    and leaves are placed above the patient, a layered tray with rice, mats, and sarongs
    is prepared for the newborn, and mother and child are purified by warm-water bathing.
    Footnotes mention a Penanggalan/Manjang being caught in the snare, charm use by
    the Bidan during severe sickness, and a Mid-Sumatra comparison for sitting delivery
    posture.'
  language: English
  quote_policy: summarized
