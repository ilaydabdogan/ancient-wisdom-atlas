canonical_text:
  quote: ''
  summary: A theatrical ceremonial sequence begins with a tray containing incense
    and prepared rice. The Lagu Pemanggil, or Invocation, is performed on instruments
    while the Pawang fumigates the fiddle, masks, daggers, and other properties. He
    lights and charms three tapers, waves them in three directions, places them on
    selected objects, marks a brazen ring with lime and a cross-shaped sign, then
    shrouds his head and handles rice in the incense before sprinkling it.
  language: English
  quote_policy: summarized
