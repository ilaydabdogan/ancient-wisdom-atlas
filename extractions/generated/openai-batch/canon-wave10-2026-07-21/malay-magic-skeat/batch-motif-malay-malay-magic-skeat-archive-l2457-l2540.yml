canonical_text:
  quote: ''
  summary: The passage describes Malay royal regalia kept outside the ruler's residence
    because of feared uncanny effects. A trumpet is said to sweat before a royal death;
    people who stepped on or interfered with a state drum died afterward. The narrator
    handles the trumpet with the Raja Muda's permission, then becomes ill. A Malay
    man vows sacrifice at a local saint's shrine if the narrator returns, and a banquet
    with goat and saffron-colored rice is held at the saint's tomb after his recovery.
  language: English
  quote_policy: summarized
