  summary: The passage describes a Bajang counter-charm drawing made from sacred names
    in Arabic script, an illness attributed to the Bajang, a procedure for identifying
    the spirit's owner through questioning a delirious patient, and notes on beliefs
    about the Bajang as a male malignant spirit or enslaved familiar kept in a prepared
    bamboo vessel.
