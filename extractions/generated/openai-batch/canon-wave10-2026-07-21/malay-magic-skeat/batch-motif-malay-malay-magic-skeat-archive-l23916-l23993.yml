canonical_text:
  quote: "“The Tiger Spirit had taken possession of the Pawang’s body”"
  summary: A Pawang conducts a healing and diagnostic ceremony involving water-jars,
    tapers, betel, a talismanic stone, a kris dagger, coins, rice, cloth, flower bouquets,
    oil, smoke, and areca-palm blossom. He diagnoses the patient as dangerously ill
    but possibly recoverable with spirit aid, performs flower-stroking treatment,
    and then appears possessed by the Tiger Spirit, behaving in tiger-like ways.
  language: English
  quote_policy: quoted
