canonical_text:
  quote: ''
  summary: 'Ethnographic description of Malay wedding couch furnishings: large and
    small pillows, their colors, shapes, numbers, rank restrictions, the mosquito
    curtain enclosing the couch, decorative Bo-leaf fringe, bamboo clothes-rod, fragrant
    liquids, flowers, and notes on a curtain-opening rite and social disturbance over
    excessive big pillows.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A clear passage of about three feet is left behind the mosquito curtain so
    the bride and bridegroom may go to the peraduan after the ceremony.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The big pillows are normally white, but yellow is substituted when they are
    intended for a Raja.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The big pillow nearest the couch center is called bantal tumpu and may have
    a hexagonal bolster beside it, or an octagonal one in the case of a Raja.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The smaller embroidered pillows are red, sometimes purple or orange, and may
    occur as a set called the Twelve Pillows.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Twelve Pillows are said in the passage to be an innovation, probably introduced
    from Malacca.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'At Klang, the permitted number of big pillows varies by status: common people
    three, a wealthy man four, a Headman five, and a Raja presumably one or two more.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The number of small pillows is unrestricted, but the topmost small pillow
    is always triangular and is called gunonggunongan.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The mosquito curtain enclosing the couch has stiffened upper edges with a
    square bamboo frame and a front fringe called daun budi, described as Bo-tree
    leaves.
  category: object
  evidence_refs:
  - ev:4
  - ev:8
- id: obs:9
  text: The front of the mosquito curtain is rolled upward rather than drawn aside.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the back of the curtain, except for a Raja’s wedding, a bamboo clothes-rod
    is suspended with scarlet-covered scrollwork and sometimes horn or ivory fittings.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The rod’s wooden collar may have hollows filled in front with rose-water or
    perfume and at the back with flowers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: A footnote reports a Klang disturbance caused by too many big pillows at a
    Malay wedding, resolved by police intervention.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: A footnote reports a special curtain-opening ceremony performed by the bridegroom
    after the wedding ceremony, with cakes called curtain-openers being eaten.
  category: action
  evidence_refs:
  - ev:7
