canonical_text:
  quote: ''
  summary: 'The passage describes buffalo-bull fights in Pahang: bulls stab and lift
    one another with their horns, one eventually shows exhaustion, flees, and is briefly
    pursued. It also states that buffalo bulls keep to their own ground, that fighting
    on home ground gives an advantage, and that match organizers select neutral or
    weaker-owned ground depending on the match. The narrator comments on the brutality
    of such fights, their status as cherished local custom, and compares interference
    with them to banning English fox-hunting.'
  language: English
  quote_policy: summarized
