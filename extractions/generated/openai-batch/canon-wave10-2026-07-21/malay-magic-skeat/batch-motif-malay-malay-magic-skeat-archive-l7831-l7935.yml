canonical_text:
  quote: ''
  summary: 'The passage describes Malay fowling charms for wild pigeons and doves.
    It explains that the wizard uses figurative names during the ceremony: the hut,
    calling-tube, decoy, rods, nooses, and pigeon species receive royal or ceremonial
    names. The birds are invited as princesses into palace-like trap settings with
    food imagery, summoned from all conditions, and threatened with a bear-cat if
    they do not descend.'
  language: English
  quote_policy: summarized
