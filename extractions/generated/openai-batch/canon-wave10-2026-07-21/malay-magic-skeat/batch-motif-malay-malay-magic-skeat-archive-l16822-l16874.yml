canonical_text:
  quote: ''
  summary: 'The passage records Malay beliefs and comparative notes about snakes and
    toads: dreaming of a snake bite foretells success in love; a horned toad is said
    to live in hill jungle, wither surrounding vegetation, and kill by approach, touch,
    or bite; the common toad’s bite is also said to be fatal despite toads having
    no teeth. The passage then compares toad-venom beliefs with Shakespearean examples
    and compares the toad-stone or jewel motif with Malayan traditions of pearls carried
    in deadly snakes.'
