  quote: ''
  summary: The passage discusses regulations for wearing the kris, including a prohibition
    against persons of inferior birth wearing a gold-ornamented kris. It then describes
    a method for measuring one-edged weapons with a string, names the method ukor
    mata sa-Ulah, and attributes its use to Sumatran Malays, especially in Menangkabau.
    It also notes that spearheads can be measured and gives footnote context from
    Malay legal traditions concerning prohibitions on gold ornamentation of creeses
    or krises.
