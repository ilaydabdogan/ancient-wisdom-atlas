canonical_text:
  quote: ''
  summary: The passage describes a Malay possession and healing/exorcism ceremony
    in which a Pawang behaves in a tiger-like way toward a patient, draws blood from
    his own arm, fights an invisible evil spirit, uses a dagger, palm blossom, jars,
    head-cloth, sarong, charms, and stroking gestures, then collapses exhausted and
    returns to consciousness. It then introduces a similar ber-hantu ceremony from
    Malay Sketches, set in a king’s house with a woman Pawang in male attire, a mat,
    candle, vessels of rice, padi, and perfumed water, and an attendant.
  language: English
  quote_policy: summarized
