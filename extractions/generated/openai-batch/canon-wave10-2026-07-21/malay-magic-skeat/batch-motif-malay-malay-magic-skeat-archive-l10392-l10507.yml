canonical_text:
  quote: ''
  summary: 'The passage introduces Malay beliefs and legends about bears and monkeys,
    especially the siamang, which is associated with the human race in legend. A Labu,
    Selangor legend explains the origin of the siamang: Princess Telan is betrothed
    to Si Malim Bongsu, who sails away and fails to return. His elder brother Si Malim
    Panjang tries to take his place and attacks her when rejected. The princess turns
    into an ape or siamang, escapes, climbs trees near the sea, and sings that Bongsu
    has broken his promise. Bongsu recognizes her voice, shoots her with a blow-gun,
    and restores her human form with rose-water, but again postpones marriage; the
    same pattern repeats, and the supplied excerpt breaks off during Bongsu’s reaction
    to the second transformation. Notes also mention an alternate siamang-origin account
    from pulai-tree roots and another monkey legend about rival monkey tribes.'
  language: English
  quote_policy: summarized
