canonical_text:
  quote: ''
  summary: 'The passage describes Malay accounts of the Polong and Pelesit as familiar
    or afflicting spirits: the Polong is made from a murdered man''s blood kept in
    a bottle and fed with the keeper''s blood, then sent to harm enemies; healers
    interrogate the possessing spirit to learn its owner and sender. The Pelesit is
    described as kept in a bottle, fed rice or blood, sent into a victim''s body,
    and acquired through a graveyard and crossroads ritual involving the tongue of
    an exhumed first-born child.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Polong is said to originate from the blood of a murdered man placed in
    a long-necked bottle, with prayers or readings performed over it for seven or
    twice seven days until a bird-like chirping is heard.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The operator cuts a finger and places it in the bottle so the Polong can suck
    it; the keeper is called the Polong's father or mother and feeds it daily with
    blood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The keeper may order the Polong to afflict someone out of anger, or may be
    paid by another person to send the Polong against an enemy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person tormented by the Polong cries out, loses awareness, tears off clothing,
    bites and strikes nearby people, and is described as blind and deaf to everything.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Healers or wise men are called to treat the afflicted person with formulas
    and other procedures, and a doctor questions the spirit about who sent it, why
    it came, and who its parents are.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The spirit may confess the names of its parents and the instigator, may give
    false names, or may refuse to confess; if the attack is resolved the patient recovers
    consciousness but remains weak, while refusal to confess may be followed by death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Pelesit is described as flying to and fro until it finds the body its
    mistress ordered it to enter; harm is said to occur especially when it enters
    tail-first.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Malay women are said to catch and keep the Pelesit in a bottle, feed it parched
    or saffron-stained rice or blood from the fourth finger, and bury it when they
    wish to get rid of it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In a Pelesit affliction, one sign mentioned is raving about cats; the medicine-man
    asks the spirit who its mother is, and it replies through the patient's voice
    in a high falsetto, naming the sender.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A recipe for securing a Pelesit instructs the practitioner to go to a graveyard
    at night and dig up a first-born child whose mother was also first-born and who
    has been dead less than forty days.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The exhumed child is carried to an ant-hill and dandled; when the child shrieks
    and lolls out its tongue, the practitioner bites off the tongue and takes it home.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The practitioner obtains a shell from a solitary green coconut palm, heats
    it with fire at a place where three roads meet until oil comes out, dips the child's
    tongue in the oil, and buries it at the heart of the crossroads for three nights.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: After three nights the buried tongue is dug up and is said to have turned
    into a Pelesit.
  category: sequence
  evidence_refs:
  - ev:12
