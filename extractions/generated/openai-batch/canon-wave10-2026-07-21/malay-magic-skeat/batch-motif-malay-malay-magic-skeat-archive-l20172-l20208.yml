canonical_text:
  quote: ''
  summary: 'The passage describes Malay betrothal customs: the girl’s parents summon
    witnesses and prepare food; representatives of the youth bring a betel-leaf tray
    with money or jewelry as a pledge; both parties eat and chew betel; the pledge
    is offered and accepted in a family circle; the engagement length is stated; witnesses
    are asked to hear the agreement; the marriage portion is customarily understood
    in Selangor.'
  language: English
  quote_policy: summarized
