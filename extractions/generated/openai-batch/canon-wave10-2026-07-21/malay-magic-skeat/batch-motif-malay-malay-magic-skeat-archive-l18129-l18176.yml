canonical_text:
  quote: ''
  summary: The passage discusses the Pontianak or Mati-anak as the stillborn child
    of the Langsuir, with a night-owl-like embodiment and special address as a Jin
    or Genie in charms used to lay it. A charm against the Pontianak invokes grave-mound
    soil, bamboo-joints, the liver of the Jin Pontianak, and an Islamic formula. The
    passage also describes corpse treatment intended to prevent a stillborn child
    from becoming a Pontianak. It then introduces the Penanggalan as a monstrous vampire
    that sucks the blood of children and begins a story about a woman performing religious
    penance in a wooden vinegar vat.
  language: English
