  quote: "“looking towards the west (Mecca)”"
  summary: 'The passage describes Malay funerary practice in Selangor: restrained
    mourning, direct movement of the body to the tomb, grave preparation, lowering
    and positioning of the corpse on its right side toward Mecca, use of planks and
    pegs to protect the body from earth, alternative coffin or trench arrangements,
    removal of five corpse bindings, and an action in which lumps of earth are put
    to the deceased''s nostrils “to be smelled” before being placed at the grave side
    and shoveled in.'
