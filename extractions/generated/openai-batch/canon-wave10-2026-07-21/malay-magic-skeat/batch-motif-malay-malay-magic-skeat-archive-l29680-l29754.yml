  summary: 'The passage describes clairvoyant and divinatory methods for recovering
    details of a robbery: a divining-glass vision involving a Jin, the use of a truthful
    child as medium, and a separate water-bowl test using folded name-papers and Koran
    reading to identify a culprit.'
