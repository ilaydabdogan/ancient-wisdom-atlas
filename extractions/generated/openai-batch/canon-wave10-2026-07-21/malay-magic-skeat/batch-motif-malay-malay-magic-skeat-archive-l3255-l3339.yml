canonical_text:
  quote: ''
  summary: The passage describes the Malay Pawang as a significant ritual specialist
    whose office may be hereditary and accompanied by transmitted insignia. The Pawang
    is consulted in agriculture, fishing, mineral prospecting, and sickness, receives
    customary small fees, and issues instructions and pantang taboos governing harvest,
    field work, reaping tools, threshing methods, and village pricing of padi and
    other local produce.
