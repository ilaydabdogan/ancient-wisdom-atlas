canonical_text:
  quote: ''
  summary: The passage gives instructions for capturing a crocodile by manipulating
    a line and reciting charms. The operator tugs the line three times, recites a
    charm describing the crocodile’s origin from Fatimah and its body parts as made
    from plant, mineral, and celestial materials, then twists, clenches, jerks, and
    hauls the line. A further invocation asks the King of the Sea/God of Currents
    for pardon while expelling the crocodile’s “mischief.” The crocodile is hauled
    to the surface, questioned about whether it caught an unnamed person, and commanded
    to wind the line around its muzzle.
  language: English with Malay terms
  quote_policy: summarized
