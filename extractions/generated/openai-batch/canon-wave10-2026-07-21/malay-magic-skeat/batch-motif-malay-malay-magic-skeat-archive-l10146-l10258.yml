canonical_text:
  quote: Hunting-dogs are spoken to continually as if they were human beings.
  summary: The passage presents Malay hunting charms addressing quarry and hunting
    dogs. A quarry animal is ordered to step into a snare and threatened with death
    and deprivation if it does not. Hunting dogs are addressed as human-like agents,
    urged to keep the scent and pursue the deer, threatened with loss of blessing,
    and promised kinship or marriage with the quarry. The Pawang uses ritual accessories,
    calls named dogs to bark, and claims the dogs belong not to him but to a magical
    deer Pawang. The passage also links some dog names to the wild Spectre Huntsman,
    treats ugliness as formidability, and describes dogs as bearers of embodied Luck.
  language: English
  quote_policy: quoted
