canonical_text:
  quote: ''
  summary: The passage reports several variant accounts for the origin of the genii
    and the White Genie, including derivation from parts of the great snake Sakatimuna,
    blood from the first twins Habil and Kabil, and a large monkey or baboon. It also
    discusses the relationship of the Black and White Genii, identifying the Black
    King with Kala and the White Genie with Maharaja Dewa or Mahadewa/Shiva, and notes
    the White Genie's confusion with a sun-dwelling White Divinity. A footnote discusses
    Ujan/Benua 'ajam and possible relation to Jin ibn Jan or Jan in Arabic authorities.
  language: English
  quote_policy: summarized
