canonical_text:
  quote: "“Soul of So-and-so, come and walk with me”"
  summary: The passage describes Malay beliefs and charms for calling the soul. The
    soul is presented as a separable phantom-like double that may be invited, recalled
    to its owner’s body, abducted into a prepared receptacle, and affected through
    that temporary domicile. The passage also discusses a sevenfold conception of
    the human soul and connects it with recurring sevenfold ritual objects and actions.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The soul is described as appearing to waking or sleeping people as a phantom
    separate from the body, bearing the body’s likeness, having physical power, and
    being able to walk, sit, and sleep.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:2
  text: Charm language asks the soul to remember the speaker as it remembers its own
    parents, house, and house-ladder, and invites the soul to walk, sit, sleep, and
    share a pillow.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The passage states that a soul called in the right way will hear and obey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: One described purpose of calling the soul is to recall an escaping soul to
    its owner’s body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another described purpose is to abduct another person’s soul and induce it
    to reside in a specially prepared receptacle.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Named receptacles include a lump of earth sympathetically connected with the
    body, a wax mannikin connected indirectly, and a cloth with no such connection.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The abducted and imprisoned soul is said to enjoy any latitude allowed to,
    and suffer from any mutilation of, its temporary domicile or embodiment.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that every man is supposed, from Malay charms, to possess
    seven souls or a sevenfold soul.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The number seven is connected with several ritual examples: seven twigs,
