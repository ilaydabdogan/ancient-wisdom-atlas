canonical_text:
  quote: ''
  summary: The passage records Malay beliefs and practices concerning a were-tiger
    appearing as a wild boar from a grave, animal-food avoidances involving swine,
    buffalo, oxen, and white buffaloes, the ritual use and adornment of sacrificial
    buffaloes, a story explaining avoidance of white buffalo flesh through a child’s
    death and a parental curse, a variant involving a ground-dove, a belief that squirrels
    develop from a large caterpillar, and a superstition that cats possess supernatural
    powers and bring luck.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Malay at Langat is cited for the belief that a were-tiger sometimes appears
    as a wild boar escaping from a grave, leaving a hole visible in the grave afterward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that modern Malays universally avoid swine flesh and contact
    with anything connected with swine, and links this to Islamic observance.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that buffalo flesh is generally preferred to ox flesh in
    Malay countries and presents this preference as connected with an older avoidance
    of cow-beef.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that buffalo flesh, not ox flesh, is eaten sacrificially
    on festive occasions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A sacrificial buffalo presented to a Raja is described as covered with cloth,
    having dressed horns, and wearing a breast-ornament; yellow cloth is used for
    a great Raja or Sultan.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The flesh of the white or albino buffalo is generally avoided as food, though
    it has been prescribed medicinally in at least one cited case.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the explanatory tale, a Malay child falls into a large rice-bin during
    the parents’ absence, suffocates in the rice, and the decomposing body produces
    ooze.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the same tale, the parents’ buffalo licks the ooze from the rice-bin; the
    parents find the child’s remains and curse the buffalo, which becomes white.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: One version of the tale implicates a ground-dove in the offence and punishment,
    and the passage says people therefore do not eat the flesh of either offender.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that Malays believe the squirrel is developed from a large
    caterpillar called ulat sentadu.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that cats are believed to possess supernatural powers and
    that keeping cats is considered lucky because they desire a soft cushion and thus
    wish prosperity.
  category: attribute
  evidence_refs:
  - ev:8
