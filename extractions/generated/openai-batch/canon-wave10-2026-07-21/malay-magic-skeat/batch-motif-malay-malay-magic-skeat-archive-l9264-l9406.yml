canonical_text:
  quote: ''
  summary: 'The passage gives Malay tiger-protection charms: one to keep a tiger distant,
    one to lock its jaws, and others to frighten the tiger or strengthen the speaker’s
    courage. It also reports beliefs about wounded tigers doctoring themselves and
    killed tigers receiving a public reception, including an observed prepared tiger
    propped up as if alive.'
