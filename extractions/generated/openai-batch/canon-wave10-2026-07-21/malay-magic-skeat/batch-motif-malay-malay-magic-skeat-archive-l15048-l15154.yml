canonical_text:
  quote: ''
  summary: The passage gives a mining charm that commands named seeds to assemble
    at a chosen spot for excavation, threatens a curse if they do not gather, and
    invokes a teacher, Elder Wizard, Younger Wizard, and an Islamic formula. It then
    states that tin-mining ceremonies and charms could apply by analogy to gold and
    silver, notes animal forms attributed to tin and gold spirits, and quotes a description
    of gold as guarded and given by a dewa who must be conciliated with prayers and
    offerings while the miners avoid pronouncing God’s name or worship. It also notes
    gold dust, royal prerogative associations of gold, and begins a silver invocation
    addressed to the Child of the Solitary Jin Salaka.
  language: English
  quote_policy: summarized
