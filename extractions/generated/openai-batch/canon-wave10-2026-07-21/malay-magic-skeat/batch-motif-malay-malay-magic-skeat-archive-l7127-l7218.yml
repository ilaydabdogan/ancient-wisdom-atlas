canonical_text:
  quote: ''
  summary: The passage reports Malay notes and beliefs about several birds. An opening
    fragment describes an unnamed female bird escaping capture by flying from tree
    to tree. The weaver-bird is said to make long hanging bottle-shaped nests with
    a golden needle that can be found only if the nest is carefully unravelled; its
    nests are associated with dangerous or inaccessible trees, use in polishing, and
    a fumigation rite for a crying infant. A helmet-shaped weaver-bird nest is described
    as the male bird’s swing, furnished with a perch, clay daubs, and fireflies for
    light. The King crow is called the Slave of the Monkeys, with its tail feathers
    marking freedom or bondage. The Gray Sea-eagle is called the Slave of the Shell-fish
    and is said to warn shell-fish of tidal changes.
  language: English
  quote_policy: summarized
