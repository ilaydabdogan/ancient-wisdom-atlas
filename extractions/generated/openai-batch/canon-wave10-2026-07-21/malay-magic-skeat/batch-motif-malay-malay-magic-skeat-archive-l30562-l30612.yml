canonical_text:
  quote: ''
  summary: A fragmentary note says a defective manuscript passage concerns an image
    to be thrown away in a direction or into the jungle, with the object corresponding
    to the symbol of a particular day. The passage then quotes calendrical information
    on Malay month and year reckoning, including alternating lunar months, Persian
    and Rum month-counting modes, agricultural and lunar planting calendars, seven-day
    weeks marked by the Mohammedan Sabbath, ways of measuring the day, sunset as the
    beginning of the religious day, and two Arab-borrowed year cycles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The manuscript note is described as defective or illegible, but other prescriptions
    indicate that an image is to be thrown either in a definite direction or into
    the jungle, and that the thing thrown corresponds with the symbol of the particular
    day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One month-counting method assigns thirty days to one month and twenty-nine
    to the next, alternating to the end of the year.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage names a Persian mode of thirty days to each month and a Rum mode
    of thirty-one days to the month.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some people are said to calculate the year as 354 days and eight hours, intercalating
    twenty-four hours every three years and reckoning thirty-three days for the difference
    between solar and lunar years.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The majority of the lower classes are said to estimate the year by fruit seasons
