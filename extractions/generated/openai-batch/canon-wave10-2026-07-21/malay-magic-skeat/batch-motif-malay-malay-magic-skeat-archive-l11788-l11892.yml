canonical_text:
  quote: ''
  summary: 'The passage describes beliefs and practices concerning eagle-wood: a spirit
    may demand sacrifice, danger follows the felling of a tree if someone passes between
    trunk and stump, a ritual recipe may revive someone killed by the spirit, and
    a naturally animal-shaped piece of eagle-wood is treated as containing the tree’s
    soul and aiding collectors. It then introduces camphor-collecting taboos among
    Orang Hulu, including the use of a special language and restrictions on ordinary
    Malay speech, food, and related conduct.'
  language: English
  quote_policy: summarized
