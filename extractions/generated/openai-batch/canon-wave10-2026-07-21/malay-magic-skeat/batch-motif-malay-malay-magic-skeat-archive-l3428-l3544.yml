canonical_text:
  quote: ''
  summary: 'The passage describes a procedure for acquiring magic power at a grave,
    including an invocation, fumigation of a midrib, seating at the head and foot
    of the grave with canoe-paddles, a visionary change of scenery into sea, and the
    appearance of an aged man. It then describes Malay kramat holy places: their reverence,
    association with vows, graves of holy persons or local founders, possible non-grave
    sites in jungle, hills, and groves, explanations as spirit-places, and a specific
    kramat at Bukit Nyalas with granite boulders, bamboo, and traces of rites.'
  language: English
  quote_policy: summarized
