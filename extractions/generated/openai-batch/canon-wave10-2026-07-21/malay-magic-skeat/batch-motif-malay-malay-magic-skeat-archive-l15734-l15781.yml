  summary: A group halts at Chigar Galah near a stream flowing into the Perak River
    and finds the stream water white like santan. Magat Terawis is sent to the source
    and finds a large haruan fish suckling its young, with milk issuing from large
    white breasts. After Magat reports this to the Raja, the Raja names the river
    Perak, meaning silver, because of its whiteness. The passage then introduces crocodile
    lore, noting conflicting origin stories and stating that Malays regard the crocodile
    as a dangerous animal with mysterious powers. A footnote compares the milk-white
    river episode to Northern mythology and notes the importance of the color white
    in many Malay myths.
