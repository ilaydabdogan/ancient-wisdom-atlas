  summary: 'The passage describes ritual preparations for a Malay rice-field ceremony:
    a creeper-bound basket intended as the cradle of the Rice-soul or Rice-baby contains
    several objects, additional sarongs are placed with rice-baskets, five female
    bearers carry the receptacles from the house toward the rice-field under the Pawang''s
