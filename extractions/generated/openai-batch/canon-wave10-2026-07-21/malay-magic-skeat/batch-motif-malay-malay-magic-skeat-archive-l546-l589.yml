    the tree by driving seven nails into it, finds a nest of young rocs, and after
    dream advice waits for the parent roc. He ties himself to the parent roc’s feathers
    and is carried westward, later reaching a house and then a clear pool surrounded
    by stone human figures. The supplied passage then shifts to a fragment about the
    Golden Dragon, Raja Naga, kinship, royal installation, and the Golden Dragon’s
    seven heads.
