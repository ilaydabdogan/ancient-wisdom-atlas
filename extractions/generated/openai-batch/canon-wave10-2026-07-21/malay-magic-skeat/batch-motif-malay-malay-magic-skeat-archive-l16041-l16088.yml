  quote: ''
  summary: 'The passage reports Malay crocodile lore: a mother crocodile watches hatchlings
    and eats those that flee from the water, while escaped young become tigers in
    one account or monitor lizards in a Selangor version. It also explains crocodiles’
    supposed lack of tongues as a design to limit their taste for human flesh, cites
    a proverb about crocodiles accepting corpses, and lists three named sets of crocodile
    fangs with their meanings.'
