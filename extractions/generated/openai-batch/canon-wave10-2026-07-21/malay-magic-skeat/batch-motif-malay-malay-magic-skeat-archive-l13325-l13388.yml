canonical_text:
  quote: ''
  summary: A female ritual practitioner performs a vegetation charm over a sheaf,
    using fumigation, a stone, egg, cockle-shell, candle-nut, iron nail, tree-bark
    cord, rice, oil, and a prayer formula called the Ten Prayers. The prayer names
    God, Muhammad, holy water, Pancha Indra, several open doors, a child in the womb,
    and sacred figures including ‘Isa, Moses, Joseph, and David, and asks for the
    opening of the doors of daily bread on earth and in heaven.
  language: English with Malay terms
  quote_policy: summarized
