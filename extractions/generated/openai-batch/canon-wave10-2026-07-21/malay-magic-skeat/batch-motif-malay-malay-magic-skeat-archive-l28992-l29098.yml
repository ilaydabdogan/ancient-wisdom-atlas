  summary: The passage lists Malay terms and metaphorical names for weapons and war
    objects; describes taboos affecting an absent warrior, his family, and a stockade;
    notes charmed bullets and a claimed invulnerability broken only by a silver bullet;
    recounts a legend in which Magat Terawis's inscribed bullet wounds Tan Saban and
    leads to Magat receiving property, marriage, and service to the Raja; describes
    the kris; and adds notes on weapon-water oaths and a possible connection to Salivahana
    and Vikramaditya war legends.
