- id: obs:1
  text: Raja Kahar is described as being attacked by a familiar demon and then beginning
    to waste away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He said the demon sat in his skull at the back of his head and devoured everything
    he swallowed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: He stopped eating solid food, became skeletal, and begged people to split
    open his skull with a hatchet to extract the demon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Sultan, then Raja Muda, reported that Malays nearby had assembled to wail
