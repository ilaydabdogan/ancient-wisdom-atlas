canonical_text:
  quote: ''
  summary: The passage recounts Raja Kahar’s wasting illness, attributed by him to
    a familiar demon in the back of his skull that consumed his food, and a later
    cure attempt in which a priest cupped him and displayed seven mantises as if extracted
    from his head. It then describes directions for recalling a wandering soul using
    a dough image, cloth, green umbrella, green taper, incense, three kinds of rice,
    and a spoken charm invoking Flying Paper, Drunken Stars, and a full moon.
  language: English
  quote_policy: summarized
