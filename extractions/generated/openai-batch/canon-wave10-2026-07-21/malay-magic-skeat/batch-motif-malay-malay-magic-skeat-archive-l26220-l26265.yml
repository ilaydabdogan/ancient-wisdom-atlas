canonical_text:
  quote: ''
  summary: 'The passage describes rules and terminology for the Malay card game Main
    Chabut: players draw cards toward a target of thirty-one pips, may pass at certain
    totals, cannot draw more than seven cards, classify the first two cards as various
    kinds of lunas or “keels,” throw away tens, and use set phrases for equal totals
    and bluffing.'
