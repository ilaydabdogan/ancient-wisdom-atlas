canonical_text:
  quote: ''
  summary: 'The passage records deer and mouse-deer hunting charms and procedures:
    an appeal to spirits to turn deer back, a stick-and-triangle rite to bring a stag
    low, a characterization of the mouse-deer as a sagacious Malay animal figure,
    a tapping method with a King Solomon summons, and initial directions for setting
    a mouse-deer snare using tree-splinter omens and an exorcistic charm.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A charm appeals to spirits to turn back the speaker's deer and threatens them
    with no drink at sea and no food ashore if they do not comply; it concludes by
    invoking the word of God.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A stag charm directs the practitioner to measure three sticks by the distance
    from the roof of the mouth to the lower jaw teeth and lay the sticks in a triangle
    inside the stag's slot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same rite directs the practitioner to press the left thumb downward in
    the center of the triangle and humble the heart; the stated result is that the
    deer's heart will be humbled too.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mouse-deer or chevrotin is described as the Malay equivalent of “Brer
    Rabbit,” appears in proverbial sayings and romances, is credited with extraordinary
    sagacity, and is honored with the title “Mentri B’lukar.”
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The mouse-deer is generally taken with a snare called tapah pelandok, and
    sometimes by tapping the ground with sticks to imitate the rutting buck's fore-feet
    and attract the doe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the tapping method, a charm calls the animals to come in procession and
    says King Solomon comes to summon them; the phrase “This is his gong” is added
    at the end.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: For tapping, the stick may be any wood except a creeper, the preferred place
    is hollow-sounding ground, and three, five, or seven leaves must be laid down
    before tapping begins.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: For setting the mouse-deer snare, the practitioner first seeks a tree with
    viscid sap, chops it three times, and reads the fall of the splinters as an omen;
    for a snare the splinters should fall supine, while a mixed prone-and-supine fall
    is a bad sign.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The snare is to be set near the foot of a tree at about a fathom's distance,
    accompanied by a charm that compares motion to a coconut shell filled with clay
    and commands Jembalang and Badi to depart.
  category: sequence
  evidence_refs:
  - ev:8
