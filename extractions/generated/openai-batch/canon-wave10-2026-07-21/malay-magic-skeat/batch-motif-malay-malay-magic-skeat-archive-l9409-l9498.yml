canonical_text:
  quote: ''
  summary: The passage describes a Malay ceremony for a dead tiger, including its
    arrival with drums and gongs, presentation to the Sultan, posing of the carcass
    as if alive, and a sword dance by military chiefs. It notes that the ceremony
    was understood as a reception for the tiger as a powerful visiting champion. It
    also states that tiger claws, whiskers, and skin were used as charms, then begins
    a section on the Deer, saying Malays hold anthropomorphic ideas about the Deer
    and believe it sprang from a man with a leg ulcer or abscess.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ceremony for a dead tiger was described as a kind of reception by villagers
    for a live and powerful war-chief or champion, with dancing and fencing intended
    for his entertainment.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Jugra example, drums and gongs accompanied the approach by river, and
    Raja Yakob was said to have shot a tiger with a spring gun behind Jugra Hill and
    brought it in state to the Sultan.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The tiger's body was supported by posts, fastened in an attitude nearly resembling
    life, given an open mouth with the tongue to one side, and fitted with a rattan
    attached to the upper jaw over a pole.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two swords were placed crosswise, two Panglimas were chosen for the dance,
    drums and gongs were beaten quickly, and a man pulled the rattan to move the tiger's
    head up and down.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The two Panglimas made obeisance to the Sultan, took up swords, danced, thrust
    at the tiger, crawled and sprang around it, uttered defiant yells, parried supposed
    attacks, and finally taunted the dead animal unarmed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A note defines Panglimas as chiefs, especially in military functions.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The killed animal was identified as a tigress eight feet long and two feet
    eight inches high, and was distinguished from the feared 'Jugra pest.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Tiger claws and whiskers are described as greatly sought after as charms,
    often stolen from tigers killed by Europeans; the narrator also reports seeing
    a charm written on tiger skin at Klang.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage says Malays hold anthropomorphic ideas about the Deer and believe
    the Deer sprang from a man who suffered from a severe ulcer or abscess on the
    leg.
  category: relationship
  evidence_refs:
  - ev:9
