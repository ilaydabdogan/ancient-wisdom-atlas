canonical_text:
  quote: ''
  summary: A Malay rice-field planting ceremony includes diagonal throwing of ketupat,
    chanting of the kalimah, circumambulation of a turf patch while rice is spat into
    the field, scattering of raw tapioca and parched rice, sprinkling and planting
    of rice-shoots by the Pawang, distribution of sweetmeat, and Muslim prayers. The
    rite is explained as a propitiatory service in which blood and food are intended
    for a hantu, with a ladder provided for the spirit at the altar. The author notes
    tensions between the rite and stricter Muslim views, and compares it cautiously
    with sacrificial ceremonials of some Central Indian aboriginal groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four men stationed in the rice-field beyond the four corners of a turf patch
    threw ketupat diagonally to one another while the assembly, led by the Penghulu,
    chanted the kalimah three times.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man with a large bowl began just outside the north side of the turf patch,
    went around it first westward, put handfuls of rice into his mouth, and noisily
    spat or vomited them into the field as if imitating violent nausea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A second man followed closely with a bowl containing raw tapioca root and
    beras bertih, scattering these into the field while going around the grass plot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Pawang sprinkled bundled rice-shoots with tepong tawar, cut off their
    ends, spat to the right and left, and began planting them in the field.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other participants planted the remaining rice-plants; a coconut-and-sugar
    sweetmeat was handed around; Muslim prayers were said by an orang alim or lebei,
    concluding the ceremony.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator was told that blood and food were intended for the hantu, and
    that the ladder up to the altar was for the hantu's convenience.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The rite is explicitly described in the passage as a propitiatory service,
    while stricter Muslim observers are reported to disapprove of spirit invocation
    and propitiation by offerings.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
