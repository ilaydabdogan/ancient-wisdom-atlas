canonical_text:
  quote: ''
  summary: 'The passage gives Malay fishing-ceremony charms and instructions: a peace-offering
    invocation to named sea, current, sunset, and wizard figures; a Pawang''s charm
    for planting the first pole of a jermal fish-trap; a rod-and-line invocation directing
    the God of Mid-currents away from the hook; and alternative instructions for planting
    a seaward pole that invoke coastal guardians, kin relations, cosmic imagery, God,
    and Muhammad.'
  language: English
  quote_policy: summarized
