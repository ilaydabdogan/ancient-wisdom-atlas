canonical_text:
  quote: ''
  summary: 'The passage describes Jakun beliefs and practices connected with camphor
    gathering: a bisan or spirit is said to preside over camphor trees and must be
    propitiated; its shrill night cry marks nearby camphor trees; hunters make food
    offerings, observe food and salt restrictions, and use a special Camphor language
    or Pantang Kapur. The passage also describes camphor deposits inside older trees,
    signs for detecting them, extraction and sale, and an embedded note about a custom
    of taking a filled camphor gourd by force.'
  language: English
  quote_policy: summarized
