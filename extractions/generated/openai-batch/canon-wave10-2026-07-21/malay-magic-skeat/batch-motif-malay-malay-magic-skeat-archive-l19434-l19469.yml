canonical_text:
  quote: ''
  summary: 'The passage records Selangor variants of birth-related taboos and demon
    precautions: avoiding a creeper-indented house-post because it is thought to bring
    snakes, averting breach of the “Dividing the house” taboo by a water-ejection
    rite, requiring a guest to remain three nights to avoid “Insulting the Night,”
    using a foul fumigation at sunset to avert evil consequences, and, during an eclipse,
    placing a woman in a doorway with a basket-work pot stand as a demon trap and
    a wooden rice-spoon as a weapon.'
