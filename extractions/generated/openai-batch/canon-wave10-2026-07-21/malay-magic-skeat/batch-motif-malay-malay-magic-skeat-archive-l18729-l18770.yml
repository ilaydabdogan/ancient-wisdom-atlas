canonical_text:
  quote: ''
  summary: The passage describes a Malay birth ceremony in which ashes from burned
    household and vegetal materials are mixed with betel-water after a charm is recited,
    then used to mark a child and mother for protection. Boys and girls receive different
    forehead signs; girls may also have eyebrows shaved and curved marks drawn with
    manjakani and the mother’s breast milk. The stated purpose is protection from
    convulsions and evil spirits, including deceiving the Evil One into thinking the
    mother and child are his own.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ceremony of marking the forehead is described as intended to keep the
    child from starting, straining itself, convulsions, and evil spirits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The directions specify chips of wood from the threshold, house-ladder steps,
    and furniture, along with garlic skin, onion skin, asafoetida, a rattan cooking-pot
    stand, and fibre from an unfertile coconut.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The specified materials are burned together; the ashes are collected and mixed
    with a little betel-water using the forefinger.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After a charm is repeated, the finger is dipped in the mixture and the centre
    of the child’s forehead is marked differently according to whether the child is
    a boy or a girl.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Small daubs are also placed on the child’s nose, cheeks, chin, and shoulders.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mother is marked with a line from breast to breast and a daub on the end
    of the nose.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Langat Malay informant is reported as saying that, if the ritual is properly
