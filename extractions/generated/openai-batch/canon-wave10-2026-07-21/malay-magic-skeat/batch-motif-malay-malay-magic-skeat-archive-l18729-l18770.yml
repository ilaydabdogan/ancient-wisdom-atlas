  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: For a girl, the eyebrows are shaved and a curve is drawn in their place from
    the root of the nose to the ear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mixture for the eyebrow curves consists of manjakani mixed with milk from
    the mother’s breast.
