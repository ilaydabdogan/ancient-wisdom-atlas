canonical_text:
  quote: ''
  summary: The passage describes a rite for casting out mischief or poison by rubbing
    the patient with seven kinds of limes, fumigating the limes, and reciting a charm
    to the spirit Lelang. The treatment continues with timed washings and potions
    at sunrise, noon, and sundown, colored cosmetics, disposal of lime remains, and
    a taboo. A second Kelantan Malay rite is described as a substitute or scapegoat
    ceremony using dough images, a sacrificial tray, offerings, a taper, a silver
    dollar, and a thread held by the patient while a charm offers the substitutes
    as food, drink, and banquet to the addressed beings.
  language: English
  quote_policy: summarized
