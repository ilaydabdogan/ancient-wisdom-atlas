canonical_text:
  quote: ''
  summary: 'The passage describes wet rice cultivation: annual timing, preferred seasonal
    winds and water conditions, consultation between elders and a Pawang, ritual reading
    of Maulud prayers over mother-seed with incense, public mosque announcement by
    the Penghulu, preparation of food for prayer readers, required implements and
    buffalo, and the beginning of ploughing in nursery plots. A note contrasts this
    wet method with dry rice cultivation.'
  language: English
  quote_policy: summarized
