canonical_text:
  quote: ''
  summary: The passage describes Malay mining charms and taboos. A charm invokes the
    White Sheikh, ruler of the virgin jungle, asking assistance to open a mine. Perpetual
    and seven-day taboos include prohibitions on killing living creatures, wearing
    certain items, using an umbrella in the mine, killing living timber, lewdness,
    and praising tin ore, which must be called “grass seed.” A sacrifice of a white
    buffalo may be performed at the brink of the mine, with its head buried and representative
    portions deposited in an audience-chamber. Another account prescribes offerings
    of cooked and uncooked fowls, black rice, seeds, incense, a tray, and black cloth,
    followed by an invocation to Grandfather Batin the Elder and Younger to gather
    ores to the mining place.
  language: English
  quote_policy: summarized
