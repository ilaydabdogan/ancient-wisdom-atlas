canonical_text:
  quote: ''
  summary: The passage describes a lunar eclipse as a Moon-deliverance episode in
    which a hated Monster retreats after hearing a human war-cry. It then explains
    the spots on the moon as an inverted banyan tree with an aged hunchback beneath
    it making a bark fishing-line that would bring disaster or the end of the world
    if it reached the earth; a rat repeatedly gnaws the line, while the old man's
    cat waits for the rat. Notes add a Sanskrit etymology for bujang, a local explanation
    of the mountain-name Bujang Malaka, a Sanskrit moon-spot story involving a hare
    or antelope, and a Sumatran variant in which a man in the moon spins cotton while
    a rat gnaws the thread each night.
  language: English
  quote_policy: summarized
