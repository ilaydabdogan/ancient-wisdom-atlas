canonical_text:
  quote: ''
  summary: The passage describes Malay beliefs that royal regalia and rulers possess
    supernatural power. Kings in romances are said to have divine-like qualities,
    prodigious births, invulnerability, transformation, and revival powers. The passage
    then gives examples of royal dress and regalia with miraculous properties, including
    mirror-covered garments, a color-changing waistband, a specially dyed coat, a
    dagger made from sacred metal and fashioned by Adam’s son, and further sacred
    objects associated with Menangkabau and other sultans.
  language: English
  quote_policy: summarized
