canonical_text:
  quote: ''
  summary: The passage gives an origin account in which a boy is beaten with los wood
    and becomes a tiger. His master names and curses him, assigning him borderland
    hunting grounds and limiting him to prey shown as headless. The account explains
    tiger stripes as marks of the beating and says tigers divine with leaves to learn
    whether prey has been granted. A Labu anecdote describes a husband seeing a tiger
    divine the headless likeness of his wife on a leaf, the wife being killed despite
    an escort, and the husband later killing the tiger at the corpse. A note adds
    that los wood frightens tigers, and the passage closes by associating man- or
    were-tiger power with Korinchi Malays.
  language: English
  quote_policy: summarized
