canonical_text:
  quote: ''
  summary: The passage describes Malay ideas of universal animism, including souls
    in humans, animals, birds, vegetation, reptiles, fishes, minerals, and other objects.
    It also describes a theory of Human Origin in which some animals, birds, and trees
    were once human. The passage then begins the tale of Megat Sajobang, who leaves
    home, returns wealthy with a ship and entourage, and refuses to admit his humble
    parents aboard.
  language: English
