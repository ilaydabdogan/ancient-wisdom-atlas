canonical_text:
  quote: ''
  summary: The passage records Malay elephant-hunting directions attributed to Lebai
    Jamal. It describes collecting materials from an elephant or rhinoceros footprint,
    preparing them with breath and a charm to blind the quarry, masking the hunter’s
    scent with leaves and speech, removing badi or mischief from the carcass after
    the kill, observing payment and contact rules for the pawang, and drawing an impassable
    protective line against a charging elephant or rhinoceros. It also notes a belief
    that knowing a being’s origin can render it powerless.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Jawi-jawi is described as a forest tree that elephants are afraid to approach.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lebai Jamal is presented as a famous elephant hunter of Lingging who supplied
    the hunting directions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: On first finding elephant or rhinoceros spoor, the hunter is instructed to
    inspect the foot-hole, take dead wood if present, and take one or more balls of
    earth from the same foot-hole, with the number of balls corresponding to the number
    of hunters up to seven.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ball of earth and twig are rolled in a leaf, breathed upon, and accompanied
    by a charm intended to destroy or dim the quarry’s eyesight if it sees or looks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The charm for blinding the quarry invokes the help of God, the prophet, and
    the medicine-man who taught the charm.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The prepared ball of earth is placed in the waistband over the navel before
    the hunter attempts to destroy the scent of his body and gun.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The scenting procedure uses specified leaves; the hunter breaks their midribs
    with the left hand, shuts his eyes, and says that as the leaves smell, so may
    his body and gun be scented.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the animal is dead, it is beaten with an end of black cloth while a
    charm is repeated to drive badi or mischief away from the carcass.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The badi charm addresses Badiyu or Mother of Mischief, states knowledge of
    her origin, names three drops of Adam’s blood as that origin, commands forms of
    mischief to return to their domains, and forbids injury to the speaker and to
    humankind.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The pawang’s perquisites are stated to be a little black cloth and a little
    white cloth.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: A special taboo forbids letting naked human skin rub against the skin of the
    slain animal.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Raja Ja‘far reports that Lebai Jamal could draw a line on the ground with
    his finger when charged by an elephant or rhinoceros, and that the animal could
    not cross it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The protective line is called Baris Laksamana, translated as the Admiral’s
