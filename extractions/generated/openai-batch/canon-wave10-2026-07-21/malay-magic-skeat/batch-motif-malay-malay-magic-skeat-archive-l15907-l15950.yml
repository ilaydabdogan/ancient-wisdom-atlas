canonical_text:
  quote: ''
  summary: 'A woman calls the transformed being ''Toh Sarilang'' by name; he surfaces,
    now crocodile from the waist upward, eats an egg and plantain, and gives instructions
    for pacifying ferocious crocodiles by offerings and name-invocation. The passage
    then reports crocodile folklore: mother crocodiles spare hatchlings that go to
    water but eat those that run landward; escaped landward hatchlings become tigers;
    some crocodiles with tongues are especially dangerous; crocodiles swallow pebbles
    when entering rivers, and the stomach stones can be counted as records of rivers
    entered. A comparative note mentions an Orinoco explanation for alligators swallowing
    stones.'
  language: English
  quote_policy: summarized
