canonical_text:
  quote: ''
  summary: 'The passage describes Malay beliefs about several mythical or nocturnal
    birds: the chandrawasi, which lives in the air, gives birth without touching earth,
    and is considered lucky; an owl whose hoot near a house signals death; the punggok
    owl, imagined as longing for the moon; and the baberek or birik-birik, a nocturnal
    bird linked with misfortune, the Spectre Huntsman, ghostly dogs, and a household
    protective action. A note compares the baberek with a bird in a Harz Wild Huntsman
    tradition and records variant beliefs about the chandrawasi, including an egg
    becoming a snake called chintamani.'
  language: English
  quote_policy: summarized
