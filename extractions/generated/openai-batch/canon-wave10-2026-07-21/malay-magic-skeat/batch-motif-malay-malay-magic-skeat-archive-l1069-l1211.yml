canonical_text:
  quote: ''
  summary: 'The passage first recounts the discovery of a girl in river foam, her
    adoption as the daughter of the river, and the prosperity that follows. It then
    presents a Selangor charm-book account of human creation: God commands angels
    to obtain the Heart of the Earth; Azrael succeeds; Adam is formed from earth material
    modified with water, fire, and steel, receives life, and later obtains Eve through
    prayer. Eve bears repeated twins. A closing etiological note explains the length
    and Malay name of the middle finger through Azrael''s encounter with the Earth-spirit.'
  language: English
  quote_policy: summarized
