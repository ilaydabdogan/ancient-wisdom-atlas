canonical_text:
  quote: ''
  summary: The passage describes Malay and Chinese mining taboos, especially concerning
    limes; taboo substitute words for mine-related things; the distinctive posture,
    dress, and invocation practice of the mining pawang; the pawang's duties, dues,
    and fines; and larger mine rites involving invocations, buffalo slaughter, feasting,
    abstention from work, and restrictions on entry and clothing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Chinese mine towkay complained that men of a rival kongsi brought limes,
    squeezed juice into his head race, and rubbed their bodies with lime juice mixed
    with water from the head race; he treated this as a grave offence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among Malays, bringing limes onto a mine is presented as an important pantang
    rule; belachan is also excluded because lime juice is normally used with it for
    eating.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The passage lists substitute mine terms: grass-seed or grass-flower for tin
    sand, live creeper for snake, kunyit for centipede, and white stone for metallic
    tin.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pawang is expected to be visually marked, and only he may use certain
    body positions on the mine, including hands clasped behind the back and hands
    on the hips.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: During invocation of mine spirits, the pawang stands before the genggulang,
    waves a long white cloth over his shoulder three times, calls a named hantu, and
    keeps his left hand on his hip.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: During professional duty the pawang wears a black coat, which nobody else
    is allowed to wear on a mine.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The pawang's professional duties include carrying out ceremonies, collecting
    customary fees, enforcing rules, and levying customary fines for breaches.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the opening of a mine, the pawang has to erect a genggulang.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A note about Pa'Itam Dam says that if daily tin output suddenly decreased,
    the pawang should repeat invocations to induce the tin ore to remain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A major ceremony called puja besar is described as occurring every two or
    three years and involving the slaying of three buffaloes and a great feast paid
    for by the pawang.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: On the day of the puja besar, everyone in the district must abstain from work,
    including breaking ground, pulling weeds, or cutting wood.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A stranger whose home was three days' journey away could not enter a mine
    without penalty; in a mine where tin ore had not yet been removed, shoes, umbrellas,
    and for Malays a sarong were forbidden.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The pawang was entitled to a customary annual payment from mine owners for
    every sluice-box in work during the year.
  category: relationship
  evidence_refs:
  - ev:10
