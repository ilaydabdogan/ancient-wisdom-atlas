canonical_text:
  quote: ''
  summary: The passage describes a Malay Tiger or Tiger-and-Goat game compared to
    fox and goose, then gives terminology and rules for Malay card games, especially
    daun tiga lei as played in Perak, including card names, dealing, hand rankings,
    stakes, cutting the pack, and actions associated with luck.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tiger Game, also called the Tiger-and-Goat Game, is said to resemble fox
    and goose and usually uses four tigers against twelve goats.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cards are called Kertas sakopong, and the passage states that Malays are fond
    of card games.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage lists Malay terms for card suits, court ranks, ace, shuffling,
    dealing, cutting, and sweeping the board.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In daun tiga lei, three cards are dealt to each player, and the highest hand
    by pips is calculated after tens are deducted.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The best hand is three aces; next are three court-cards, then nine, then eight;
    these four hands are called terus.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A hand of three threes is described as a good hand worth nine, but it is considered
    a propitiation of good luck to throw it down without exposing it and announce
    that one is buta.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Each player may make two stakes, kapala and ekor; kapala must not be greater
    than ekor, and a single stake may be called podul.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Betting between players is called sorong, tuwi, or sorong tuwi; a pool is
    called tuwi tengah.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The ekor stake is paid to the dealer only if the dealer holds a terus hand;
    if a player holds a smaller hand, the dealer takes both kapala and ekor, called
    mengelong.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A player holding thirty exactly is said to be out, or buta, except when the
    hand consists of three court-cards.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Any player except the player on the dealer's right may cut; the cutter looks
    at the bottom card of the lifted portion and accepts the cut if it is thought
    lucky.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The dealer then places the rest of the pack on the cut, lifts a portion, and
    looks at the bottom card.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The cutter and dealer use names for different cards and combinations of cards
    with varying degrees of luck, declaring confidence in luck from cutting or lifting
    a particular card.
  category: speech
  evidence_refs:
  - ev:13
