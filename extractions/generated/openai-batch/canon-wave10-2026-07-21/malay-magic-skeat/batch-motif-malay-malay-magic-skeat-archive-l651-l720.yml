  quote: ''
  summary: The passage reports a Jugra/Langat tradition that a river bore formerly
    came up the Langat river and was eventually killed by a Langat Malay with a stick.
    It then describes Malay explanations of solar and lunar eclipses as signs that
    the sun or moon is being devoured by a gigantic dragon, Rahu, or dog, with notes
    comparing the belief to Hindu/Rahu and Chinese eclipse traditions.
