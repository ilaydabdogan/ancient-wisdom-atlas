canonical_text:
  quote: ''
  summary: 'The passage describes additional ceremonies connected with rice reaping:
    a daily charm to keep shadows and spectral reapers apart from the workers, rules
    for preventing shadows from falling on the rice, the first pounding and drying
    of the first padi, objects placed with the drying rice including water for the
    Rice-soul, a reported cat-birth omen, later pounding and winnowing rules, disposal
    of chaff at a three-path junction, and keeping sugar-cane in the mother-sheaf
    for use in the next year''s reaping.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the start of each day's reaping, reapers must repeat a charm that addresses
    Shadows and Spectral Reapers and asks that they not mingle with the reapers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: While reaping, the reapers must cover their heads and face the sun so that
    their own shadows do not fall on rice in the basket at their side.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first reapings from three baskets are emptied onto a new mat, with rice-ears
    tied to each corner, trodden out by the owner of the field, returned to two baskets,
    and the straw of the rice heads is plaited into a wreath.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two baskets of newly cut rice are carried from the house to an open part of
    the field and spread on a mat in the sun by the owner.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'During drying, objects are placed in the centre of the mat: a basket-work
    stand, a bowl of water for the Rice-soul, a big iron nail, a candle-nut, and six
    trodden-out rice heads tied at the corners of the matting.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A footnote reports that a cat gave birth to kittens the night before the ceremony;
    the Pawang called this a very good sign and stated a rule that God may substitute
    a cat when no one else can bear children at the time.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: After drying, the rice is gathered back into baskets, carried to the house,
    pounded and winnowed, with bunches of sambau dara grass tied to the upper ends
    of the wooden pestles.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: During winnowing, nothing of the male sex may stand or sit opposite the point
    of the sieve.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The chaff is placed by the owner in a heap where three paths meet, crowned
    with a wreath of empty rice-stalks, and covered with a big stone to keep it from
    being blown away.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: The sugar-cane is left to grow in the mother-sheaf until the wife of the owner
    reaps it; it is then carried back to the house and used for the next year's reaping.
  category: sequence
  evidence_refs:
  - ev:10
