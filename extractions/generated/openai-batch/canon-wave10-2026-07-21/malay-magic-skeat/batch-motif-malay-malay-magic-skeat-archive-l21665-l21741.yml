canonical_text:
  quote: ''
  summary: 'The passage describes Malay funeral customs: naming and arranging the
    corpse, shrouding it according to status, burial without a coffin in a side cavity,
    grave adornment with flowers, flags, shrubs, later ceremonies at the grave, a
    memorial buffalo feast, and reverence for ancient holy burial places.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A corpse is called Maiat, except in the case of a Raja, when it is called
    Jenaja or Jenazah.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The corpse is laid on its back with the feet toward Mecca and the hands crossed,
    with the right wrist resting on the left below the breast-bone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The corpse is shrouded from head to foot in fine new sarongs; peasant burials
    generally use three or four thicknesses, while a rich man may have seven long
    pieces.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The footnote states that the corpse is carried to burial on a broad public
    plank, rubbed with lime, and that no coffin is used.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The footnote states that the body is wrapped in white cloth and placed on
    its right side in a cavity cut into the side at the bottom of the grave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Flowers are strewn in the grave cavity, and two boards are placed angularly
    to protect the corpse before the outer excavation is filled.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Little white flags or streamers are stuck around the grave, and a white-flowered
    shrub, kumbangkamboja, is planted; in some places wild marjoram is also planted.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Women attending the funeral make a loud mourning noise compared by the source
    to the Irish howl.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Relations perform ceremonies at the grave on the third and seventh days, and
    after twelve months set long elliptical stones at the head and foot.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: At the twelve-month stone-setting, a buffalo is killed and eaten, and its
    head is left to decay at the site as a token of honour to the deceased.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Ancient burying places are called krammat, are associated with holy men credited
    with converting ancestors, and are treated as highly sacred ground.
  category: setting
  evidence_refs:
  - ev:10
