canonical_text:
  quote: ''
  summary: 'The passage describes Malay funerary preparation after washing the body:
    a ninefold water-pouring rite, stopping the bodily orifices with cotton, shrouding
    in white cotton cloth, the relatives’ last kiss without tears falling on the face,
    variations in shroud thickness, optional white powder for a child’s body, tying
    the shroud with five knots and triply wrapped strips, positioning the corpse toward
    Mecca, and prayers by several praying-men.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The washing rite named ayer sambilan uses fresh water scooped and poured three
    times to the right, three times to the left, and three times over the front of
    the corpse from head to foot; the completed ceremony is called bedara.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After washing, bodily orifices such as ears, nostrils, and eyes are generally
    stopped with cotton.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The body is carried back to its mattress and laid in a white cotton shroud
    about seven feet by four feet, with the edges meeting over the breast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The nearest relatives give a last kiss, but they are instructed not to disturb
    the corpse by letting tears fall on its features.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The shroud is usually three layers for poor people, while wealthier families
    use five or seven layers; in Selangor each shroud is usually a separate cloth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A dead child may additionally be covered with a fine white powder sprinkled
    over the face and arms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Five knots fasten the shroud, using torn selvage strips bound three times
    around the body at the breast, knees, and hips, and also above the head and below
    the feet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The corpse is laid on the mattress or mat with its head to the north and on
    its right side facing west toward Mecca, the position it will occupy in the grave.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Prayers are then offered by four or five praying-men.
  category: action
  evidence_refs:
  - ev:5
