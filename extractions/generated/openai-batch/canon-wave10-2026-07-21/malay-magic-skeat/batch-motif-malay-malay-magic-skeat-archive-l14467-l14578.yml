  text: The pawang may be called to cast out evil spirits from mines, convert amang
    into tin-ore, and invoke mine spirits before the first sod is broken in a new
    venture.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: These pawang ceremonies may involve slaughtering a buffalo, goat, or fowls
