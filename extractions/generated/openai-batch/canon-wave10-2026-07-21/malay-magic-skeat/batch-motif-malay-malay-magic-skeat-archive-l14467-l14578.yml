  text: Offerings are made on a platform described as similar to a genggulang-like
    structure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a death occurs at a mine, mourning involves abstention from work for
    three days for a neighbour or comrade, or seven days for the pawang, penghulu
    kelian, or feudal chief.
  category: action
  evidence_refs:
  - ev:2
