canonical_text:
  quote: ''
  summary: The passage defines several Malay tin-mining ritual terms and describes
    the mining pawang as a ritual specialist associated with offerings, censers, mourning
    taboos, spirit-expulsion, invocation of mine spirits, animal slaughter, food and
    incense offerings, spell-work, and attributed control over tin-ore abundance.
    It also notes similar or related practices among Chinese miners and in Javanese
    offering contexts.
  language: English
  quote_policy: summarized
