canonical_text:
  quote: ''
  summary: 'The passage describes a Malay adolescence or ceremonial hair-cutting rite:
    ritual objects are arranged, a headman scatters rice and applies rice-paste to
    a bride, cuts a lock of her hair with an attached ring into a prepared coconut
    vessel, other representatives repeat the cutting, and a young child is tonsured
    at the same time.'
