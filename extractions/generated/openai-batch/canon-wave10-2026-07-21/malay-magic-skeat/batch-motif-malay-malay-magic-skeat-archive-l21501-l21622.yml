candidate_motifs:
- id: motif:1
  label: Formal wedding rite and ritually staged conjugal union
  taxonomy_refs:
  - sacred_marriage
  basis: The passage presents a sequenced marriage ceremony with service, prayers,
    bathing, henna, procession, throne seating, mutual feeding, and entry into the
    bridal chamber.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The couple are human participants in an ethnographic wedding account;
    the taxonomy match to sacred_marriage is functional and ceremonial, not a claim
    of divine marriage.
- id: motif:2
  label: Marriage exchange through portions, food, gifts, and fines
  taxonomy_refs:
  - sacred_exchange
  basis: The wedding includes a marriage portion, rice offerings, red eggs, mutual
    saffron-rice feeding, and later the panjat account describes doubled dower, fines,
    and clothing gifts.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:12
  confidence: medium
  cautions: The passage describes customary and social exchanges; calling them sacred_exchange
    is interpretive and should be human-reviewed.
- id: motif:3
  label: Forcible securing of a refused bride
  taxonomy_refs:
  - stolen_beloved
  basis: The passage explicitly introduces customs regulating forcible abduction of
    a wife and defines panjat as forcible entry to secure as wife a woman refused
    by her relations.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  confidence: medium
  cautions: The account is customary/legal rather than mythic narrative; the woman’s
    consent or affection is not specified, so the taxonomy label stolen_beloved is
    only a broad abduction-marriage alignment.
- id: motif:4
  label: Armed domestic-boundary intrusion to compel marriage
  taxonomy_refs: []
  basis: In panjat angkara, the suitor enters a house armed, reaches the women’s apartment
    or door, and prevents the intended bride’s escape, while risking retaliation by
    her kin.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: No specific available taxonomy reference exactly matches this boundary-intrusion
    pattern.
- id: motif:5
  label: Customary conversion of violence into negotiated payment
  taxonomy_refs: []
  basis: The violent intrusion may be regularized if kin consent, after which fines,
    dower, and garments are doubled and larger fines may be imposed.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: This is extracted as a social-ritual pattern from the passage, not as
    a mythological motif family.
