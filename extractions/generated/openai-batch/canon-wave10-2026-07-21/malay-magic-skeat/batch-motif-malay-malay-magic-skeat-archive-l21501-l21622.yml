canonical_text:
  quote: ''
  summary: 'The passage describes Malay wedding ceremonies: marriage service, prayers,
    feasting, Bathing in State, henna-staining, procession, sprinkling with saffron-rice
    and rose-water, seating on a marriage throne, mutual feeding, red eggs, bridal
    chamber entry, music, fireworks, dancing, and singing. It then introduces Sir
    W. E. Maxwell’s account of panjat, a Malay custom regulating forcible entry into
    a house to secure a refused woman as wife, including violent and customary forms,
    risks, qualifications, payments, and fines.'
  language: English
  quote_policy: summarized
