  quote: ''
  summary: The passage describes Malay wedding ceremonies, especially private and
    public henna-staining of bride and bridegroom, attendants, ritual trays with rice,
    incense, eggs, candlesticks, and the application of neutralising paste believed
    to avert ill-luck.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first henna-staining occurs privately in the inner apartments at night
    and is called the “Stolen Henna-staining” or berhinei churi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Henna leaves are pounded with charcoal and applied to the fingernails of both
    hands except the middle or “Devil’s finger”; the palms and soles are also marked.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two child attendants called Pengapit sit to the right and left of the bridegroom.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bride has girl companions, but when company is present their place is
    taken by duennas called Tukang Andam and by a personal attendant or nurse called
    Mainang or Mak Inang.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the second day guests rest, reassemble in the evening, eat a meal, and
    resume games before the public henna-staining ceremony.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The bride and bridegroom make their first public appearance in wedding garments
    at their respective houses for public henna-staining.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: During the public ceremony the sitter is placed between two lighted candlesticks,
    and a tray contains rice-paste, washed rice, saffron rice, parched rice, and pounded
    henna leaves.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A censer is produced, and a brass tray called semurip holds saffron-stained
    glutinous rice with purple eggs set on decorated bamboo sprays.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The bride or bridegroom sits in a begging attitude with hands resting on a
    cushion in the lap.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A guest burns incense, fumigates mixed rice over it, and throws the rice toward
    the sitter’s right, left, and lap.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Neutralising Paste is applied with a leaf-brush to the sitter’s forehead and
    backs of the hands; a footnote states that the paste is believed to avert ill-luck.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
