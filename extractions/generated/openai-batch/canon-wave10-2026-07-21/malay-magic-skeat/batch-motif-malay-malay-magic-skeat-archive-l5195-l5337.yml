canonical_text:
  quote: ''
  summary: The passage describes Malay and pilgrimage-mediated classifications of
    genii, including a White Genie used for protection, divisions between Jin Islam
    and Jin Kafir, genii associated with Mecca, a mosque and lake of good genii, abduction
    and reform of certain mortals, tribute exacted by good genii, deformed malicious
    bad genii, genii attached to royal instruments and weapons, Jin Afrit as an origin
    figure for the White Man, and the near-convertibility of the terms Jin and Jembalang.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The White Genie is said to be mentioned less often than the Black Genie, to
    have no recorded harm attributed to him, and to be appealed to for protection.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Genii are sometimes subdivided into Faithful, called Jin Islam, and Infidel,
    called Jin Kafir.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:3
  text: Genii are said to be obtainable at Mecca from the Sheikh Jin for prices of
    about $90 to $100 each.
  category: action
  evidence_refs:
  - ev:2
  - ev:9
- id: obs:4
  text: The Jin Islam are described as shrinking from unclean things and as strongly
    repelled by Chinese people.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The good genii are described as perfectly human in form, impalpable as air,
    and possessing voices like mortals.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The good genii live in their own stone mosque beside the lake Kolam Yamani,
    never leave it, and continually pray there.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The lake Kolam Yamani receives waters from the surrounding country, overflows
    toward the sea, and is used by the good genii for bathing.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Wicked or childless mortals who bathe in the lake are carried off by the good
    genii, detained in the mosque, and returned home once they have shown prolonged
    moral reform.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Jin Islam exact tribute from the unfaithful; if tribute is not received,
    they steal the due amount and give it to a son of Islam.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Jin Kafir are described as deformed, with heads out of place or beneath
    their shoulders, and as filling the atmosphere from earth to sky.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The bad genii are said not to die before the great day of judgment, unlike
    the good genii they are dumb, and they increase by having children.
  category: attribute
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:12
  text: The bad genii are described as mischievous and malicious, and are said to
    assemble their legions during a rain shower after drought.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Some genii are connected with royal musical instruments, the State, and royal
