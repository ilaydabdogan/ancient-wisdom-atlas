comparison_claims:
- id: claim:1
  claim: The passage compares the Javanese division of Jin Islam and Jin Kafir with
    the good and bad genii of the Arabian Nights, saying the Javanese draw a stronger
    distinction.
  claim_level: same_function
  target: Good and bad genii in the Arabian Nights
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is mediated by the author’s quotation of a pilgrim’s
    account and does not establish direct textual dependence.
- id: claim:2
  claim: The passage associates Jin Afrit or Jin Rafrit with Arabian mythology and
    says it belongs there to a higher class than mere genii.
  claim_level: same_motif
  target: Arabian Afrit / Ifrit class of spirits
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The excerpt gives only a brief classificatory statement and no detailed
    Arabian source.
- id: claim:3
  claim: The passage states that Arabic Jin and Malay Jembalang are frequently juxtaposed
    and used largely as convertible terms, though the process is not complete.
  claim_level: linguistic_similarity
  target: Malay Jembalang spirit category
  evidence_refs:
  - ev:14
  counter_evidence_refs:
  - ev:14
  confidence: high
  limitations: The same evidence notes that the equivalence is incomplete, so the
    terms should not be treated as exact synonyms.
- id: claim:4
  claim: The passage presents Mecca pilgrimage as a context in which Malay pilgrims
    could encounter and receive ideas about genii.
  claim_level: historical_contact
  target: Mecca pilgrimage transmission context for Malay and Javanese jinn beliefs
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage indicates likely contact and dissemination but does not
    prove the origin of each belief described.
