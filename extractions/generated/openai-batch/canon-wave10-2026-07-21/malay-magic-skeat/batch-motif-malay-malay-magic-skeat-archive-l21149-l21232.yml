canonical_text:
  quote: ''
  summary: 'The passage describes Malay post-wedding rites: continued lustrations,
    a night ceremony in which the bridegroom’s relatives smoke him out and carry him
    to his parents’ house, a return procession with ritual foods and waters, a bathing
    rite for good luck and averting ill-luck, water-spraying with bamboo syringes,
    and concluding unbinding rites using a coconut frond slip-knot and a thread girdle.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lustrations continue for three days for the newly married pair, while friends
    and acquaintances come to pay respects, bathe, and receive largess.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A ceremony on the third day after the hari langsong is named mandi tolak bala
    or mandi ayer salamat, glossed as bathing for good luck.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At night the bridegroom’s relatives assemble in darkness and make a bonfire
    under the newly married couple’s house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Coconut husks and pepper are thrown into the fire to create unpleasant smoke
    for those inside the house.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the bridegroom comes down the steps, his relatives seize him and carry
    him bodily to his own parents’ house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The seizure and carrying away of the bridegroom is identified as the stealing
    of the bridegroom, churi pengantiri.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The next day a large procession escorts the bridegroom back to the bride’s
    house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The return procession carries Rice of the Presence with eggs, two kinds of
    holy water, flower vases with palm blossom elements, young coconut leaves shaped
    like palm blossom spikes, krisses, and bamboo water-bows.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The bride’s relatives prepare a similar set of objects and place them at the
    bathing site, where a bench is set for the bride and bridegroom.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the tepong tawar rite, two kinds of holy water are successively thrown
    over the bride and bridegroom.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Women of both parties gather around the bride and bridegroom behind a sheet
    while young men discharge bamboo water-bows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: When the water arrows are stopped by the sheet, the young men turn their syringes
    on one another until all are wet.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A young coconut frond twisted into a slip-knot with V-shaped ends is given
    to the bride and bridegroom.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: The bride and bridegroom each hold one end of the coconut-frond knot, blow
    on it three times, and pull until it comes undone; this concludes the lepas-lepas
    rite.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: A thread girdle is passed seven times over the heads and under the feet of
    the bride and bridegroom, after which the bridegroom breaks through the thread.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: After the thread is broken, the guests return home, change out of wet garments
    into wedding attire, and a feeding ceremony is performed.
  category: sequence
  evidence_refs:
  - ev:8
