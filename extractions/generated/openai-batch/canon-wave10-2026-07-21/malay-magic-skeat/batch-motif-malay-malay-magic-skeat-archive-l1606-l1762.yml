  quote: ''
  summary: The passage lists items of Malay royal regalia, especially musical instruments
    with extraordinary sound-producing powers, reports an informant’s account of their
    self-origin at a burning mountain in Menangkabau, describes their resistance to
    weather and dangerous contact, notes slaughter required before replacing the “Moving
    Mountains,” and explains the use of regalia in royal letters and solemn oaths.
    A cited Sumatran royal title-recital further enumerates supernatural possessions
    and titles surrounding Malay kingship.
  language: English
