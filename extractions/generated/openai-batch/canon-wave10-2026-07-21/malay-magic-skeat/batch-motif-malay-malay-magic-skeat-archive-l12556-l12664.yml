canonical_text:
  quote: ''
  summary: 'The passage gives instructions for reaping rice: the cultivator obtains
    the Pawang’s permission, burns benzoin in the field, prepares ritual implements,
    selects female and especially jointed stalks, cuts seven stems as the Soul of
    the Rice and another handful as mother-seed, wraps the Soul in white cloth like
    a swaddled child, fumigates and stores the baskets, observes a three-day restriction
    before further cutting, prepares and feasts on the first rice, then reaps, threshes,
    dries, stores, and allocates wages from the rest of the crop.'
  language: English
  quote_policy: summarized
