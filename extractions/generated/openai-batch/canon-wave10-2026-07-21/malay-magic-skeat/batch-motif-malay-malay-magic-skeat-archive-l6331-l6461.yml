canonical_text:
  quote: ''
  summary: A Perak Malay legend tells of a man at Katapang whose pregnant wife craves
    a precisely specified mouse-deer. After misunderstanding the request, he undertakes
    an impossible hunt with weapons and dogs, swears not to return unsuccessful, becomes
    a forest denizen, sends his dogs through the sky, and is physically altered by
    constant upward gazing and by a Si Limbak leaf that roots in his throat. The passage
    also includes an editorial comparison with English Gabriel's Hounds or Gabble-ratchet
    traditions and notes a Malay association of the night-jar with the Wild Huntsman.
  language: English
  quote_policy: summarized
