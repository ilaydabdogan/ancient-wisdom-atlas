canonical_text:
  quote: ''
  summary: The passage gives a Malay charm that disclaims personal ownership and agency,
    attributing materials, the neutralising charm, and its application to named ritual
    figures. It then explains badi as an evil or harmful principle that may enter
    a patient after contact with a dead animal or bird, or an encounter with the Wild
    Huntsman. The text describes badi as an influence attending living things and,
    from the Malay viewpoint, also animate-seen inert objects. It lists examples of
    harmful influence from animals, plants, saliva, actions, and morbid matter; discusses
    varying counts and origin accounts for badi; and notes that charms may request
    such mischiefs to return to their origins.
  language: English
  quote_policy: summarized
