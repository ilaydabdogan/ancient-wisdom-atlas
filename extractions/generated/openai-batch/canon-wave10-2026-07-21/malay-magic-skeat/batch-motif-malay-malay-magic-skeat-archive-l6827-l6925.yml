canonical_text:
  quote: ''
  summary: 'The passage gives Malay bird-lore explaining names, calls, and behaviors
    of several birds: a large hornbill associated with a man punished for destroying
    his mother-in-law''s house; the Night-jar associated with rice-husking sounds
    and a woman transformed after a quarrel with her mother; a honey-bird or bee-eater
    said to originate from the Moon Princess''s discarded betel-quid during the Owl''s
    failed courtship; and the Burong tinggal anak, a small bird linked with young
    rice and death after hatching its young.'
