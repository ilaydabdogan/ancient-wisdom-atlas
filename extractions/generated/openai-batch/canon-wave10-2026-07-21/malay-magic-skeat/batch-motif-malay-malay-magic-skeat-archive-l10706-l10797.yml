canonical_text:
  quote: ''
  summary: The passage records Malay beliefs about cats, including danger from a cat
    touching a corpse, rainmaking by soaking a cat, taboos on killing cats, and disposal
    of troublesome cats on rafts. It also reports animal-origin beliefs about a fish
    that was originally a cat and a mollusc that sprang from a mouse, an etiological
    story explaining why tigers cannot climb trees, omens involving rat- or mouse-nibbled
    clothing, charms addressed to Prophet Joseph for driving away rodents, and east-coast
    Fisher Folk beliefs about devils, sprites, and animal demons.
  language: English
  quote_policy: summarized
