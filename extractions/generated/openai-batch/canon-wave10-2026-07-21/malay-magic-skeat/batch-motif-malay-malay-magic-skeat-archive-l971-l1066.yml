canonical_text:
  quote: ''
  summary: The passage quotes a Malay Sri Rama narrative in which King Dasaratha and
    his minister encounter a gold-colored betong bamboo clump that regenerates when
    cut; after the king cuts it, a princess is revealed within and taken to the palace.
    Skeat then notes similar Malay legends and introduces a parallel Perak story in
    which flood foam around a river bathing-house conceals a female infant.
  language: English
  quote_policy: summarized
