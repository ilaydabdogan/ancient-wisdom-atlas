canonical_text:
  quote: ''
  summary: The passage describes Malay medical rites involving humoral and cosmological
    correspondences, divinatory diagnosis by smoke, coins, and rice in water, and
    therapeutic ceremonies of propitiation, neutralisation, expulsion, and soul-recall.
    It then details a water-jar ceremony using jars, water, coconut-leaf decorations,
    artificial flowers, incense, rice, tapers, and a smoke charm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says passages from the Koran are quoted against excess in eating
    or drinking, and it associates air, earth, heat, moisture, cold, and dryness with
    medical theory.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that human constitution and passions are assimilated to
    the twelve signs of the Zodiac and the seven planets.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author states that Aristotelian hygienic theory, borrowed by the Arabs,
    filtered through in some cases to the Malays, but that direct references to Greek
    theories are rare and not typical.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: 'Malay medicine-men''s important rites are described as having two main parts:
    ceremonial inspection or diagnosis, followed by a therapeutic ceremony determined
    by the inspection.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The diagnosis uses divination from the smoke of a burning censer, from the
    positions of coins thrown into water-jars, and from parched rice floating on the
    water surface.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage classifies therapeutic rites into propitiatory, neutralisatory,
    expulsory, and revivificatory ceremonies, the last involving recall of a sick
    person's soul.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A note says the Pawang may lure evil spirits out of a sick person's body into
    an egg, substituted image or scapegoat, Spirit-Hall, or spirit-boat, or may have
    a stronger spirit such as the Tiger Spirit enter his own person to assist in eviction.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: For the water-jar ceremony, three water jars are brought to the sick man's
    room and decorated with plaited coconut leaves called 'Centipedes' Feet'; a fourth
    jar contains artificial flowers to attract the sick man's soul.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The ceremony also requires a tray of magical accessories, including incense
    and three kinds of rice, and three wax tapers placed on the brims of the three
    jars.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: When incense is placed on embers, the practitioner addresses the rising smoke,
    asking it to rise toward him if in accord and across him to right or left if not
    in accord.
  category: speech
  evidence_refs:
  - ev:10
