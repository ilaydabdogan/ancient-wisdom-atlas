canonical_text:
  quote: ''
  summary: The passage describes the Bajang as a Malay familiar spirit or bottle-imp,
    usually private property, whose usual embodiment is a pole-cat. It notes a cautious,
    possibly confused report that the Bajang can take house-cricket form like the
    Pelesit. It says the Bajang is dangerous to children, who may wear a black-silk
    bajang bracelet for protection. A footnote classifies hantu as wild or domesticated
    spirits, compares domesticated ones to Western familiars, mentions a malignant
    familiar attacking sleepers, and describes charms at village borders to keep wild
    spirits out.
  language: English
  quote_policy: summarized
