canonical_text:
  quote: ''
  summary: 'The passage lists special prohibitions for Malay tin-mining under the
    authority of the pawang. It mentions a local hantu connected with assistance in
    the enterprise, ritual platforms or trays for offerings, the hanging of an ancha
    in the smelting-house, and a series of mine taboos with fines: prohibited cotton,
    clothing, vessels, quarrelling, gambling, chopping noise, taboo-language breaches,
    charcoal in water races, improper garments, broken measures, weapons and coats
    near the furnace posts, damage to posts, and a rice-related dispute adjudicated
    by the pawang.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hantu of the locality is described as assisting in the mining enterprise,
    with a fee of one karong of tin sand connected to this assistance.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the miners' request, a kapala nasi may be erected instead of a genggulang,
    with a fee of one gantang of tin sand.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: The pawang assists in hanging the ancha in the smelting-house, and the Panglima
    Klian draws the ancha up near the attaps.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Raw cotton and cotton stuffing are prohibited at the mine; the stated fine
    is hukum pawang of $12.50, and a miner's ordinary pillow is made of soft wood.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Black coats and attitudes called pakei pawang may not be assumed on the mine
    by anyone except the pawang.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A gourd water vessel, earthenware, glass, limes and lemons, and the outer
    husk of the coconut are prohibited on mines; coconut shell or wood vessels are
    preferred because the noise of earthenware and glass is said to offend the hantu.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Gambling and quarrelling are strictly forbidden on mines, with the fine claimed
    for the first offence.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Wooden aqueducts must be prepared in the jungle far from the mine, because
    the noise of chopping is said to offend the hantu.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A breach of the bahasa pantang is an offence, and charcoal must not be allowed
    to fall into the water races.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: A miner must not work while wearing another man's trousers; the note adds
    that the rule concerns working dress and that working in a sarong is also an offence.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: If the mine's chupak measure is broken, it must be renewed within three days.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Weapons and coats are prohibited within the four posts around the furnace
