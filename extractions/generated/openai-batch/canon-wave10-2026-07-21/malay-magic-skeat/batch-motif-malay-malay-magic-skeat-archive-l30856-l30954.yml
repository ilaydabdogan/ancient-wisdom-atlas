canonical_text:
  quote: "“the places usually occupied by the points of the compass are occupied by
    the names of certain things”"
  summary: 'The passage describes Malay charm-book diagrams called aspect-compasses,
    with opposed names placed at compass directions, and explains several divinatory
    uses: choosing a day to begin a journey, judging conflict with an enemy, predicting
    the return or capture of an absconder, and counting marked points on a human figure
    associated with Unggas Telang.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The common form of the aspect-compass is described as a compass-like drawing
    in which compass-point positions are occupied by names of things, usually animals
    or birds, that are supposed to be naturally opposed.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Examples of opposed placements include bird or kite opposed to fowl, crocodile
    opposed to fish, rat opposed to cat, tiger opposed to stag, new moon opposed to
    kite, and an alternate cape-and-bay arrangement.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A figure copied from a Selangor charm-book had the days of the month, from
    the 1st to the 30th, written around it in blue ink.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: For journey divination, the user starts from the north aspect and counts leftward,
    one day per aspect, until reaching the aspect corresponding to the day of the
    month on which the journey might begin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the counted aspect belongs to a weaker influence, the passage says starting
    the journey would be imprudent; if it belongs to a stronger influence, starting
    is favorable.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: For divining whether a man will get the better of his enemy, a double circle
    of human figures is used, with inner-circle figures representing the seeker and
    outer-circle figures representing the enemy.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the enemy-divination diagram, the counting is done as in the journey procedure,
    and the headless figure represents the man who will lose; in a drawn battle neither
    party loses his head.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'For an absconder, a single circle of figures is used: figures pointing toward
    the center signify that the absconding party will return or be caught, while figures
    pointing away signify the opposite.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: One absconder-related diagram has fourteen human figures in two opposing rows
    of seven, with every alternate figure headless; counting begins at the right-hand
    figure of the bottom row and proceeds leftward.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Another divinatory form uses a human figure with small red circles at salient
    points, counted downward to the left beginning at the head.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The human figure with red circles is said to represent one Unggas Telang.
  category: relationship
  evidence_refs:
  - ev:8
