  summary: The passage describes a Malay post-birth practice of compressing an infant's
    head with a tight yam-leaf cap if the head is considered too long, accompanied
    by sex-specific spoken formulae. It then describes a 'mouth-opener' rite using
    a split green coconut, salt, tamarind, counting to seven, and gold, silver, and
    amalgam rings touched to the infant's lips with an invocation. It notes a later
    saying about having tasted salt since infancy and mentions optional rock sugar.
  language: English
