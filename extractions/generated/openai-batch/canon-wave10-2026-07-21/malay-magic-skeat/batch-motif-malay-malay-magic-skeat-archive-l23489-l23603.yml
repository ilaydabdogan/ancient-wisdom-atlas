canonical_text:
  quote: ''
  summary: The passage describes a Malay healing and expulsion rite in which an evil
    spirit or mischief is drawn from a sick person into scapegoat objects or into
    a model vessel, especially a lanchang. The boat is furnished with offerings, connected
    to the patient by thread, addressed with charms, and set adrift on river or sea
    at ebb tide so that the spirits are carried away to another country. Notes describe
    regional offerings, launch gestures, returning small portions of food and water
    to the patient, and a spoken exchange in which the evil spirit is paid and told
    not to return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The evil spirit or mischief is supposed to leave the sick person's body and
    enter scapegoat objects in a tray, guided by a coloured thread held by the patient.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the spirit is considered to be in the tray, the medicine-man loosens
    three slip-knots, recites a charm, and throws the untied knots outside the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The original Selangor disease-boat was a model lanchang, described as a two-masted
    vessel with fore and aft galleries and cannon, associated with Malay Rajas on
    the Sumatran coast.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The model boat could be stained with turmeric or saffron because yellow is
    recognized as a Malay royal colour.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
