canonical_text:
  quote: ''
  summary: 'The passage gives rules and observations for Malay cock-fighting: spur
    placement, staking and ownership rules, procedures for runaway or refusing birds,
    restrictions on interference, named conditions such as Sri and Cheyma, beliefs
    about daily periods and cock colours, and an eyewitness account of a large contest
    between two Malayan states at the end of Ramazan involving game-cocks, a cock-pit,
    sharpened spurs, weight adjustment, deliberation by setters-to, and intense spectator
    interest.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Malays generally use one artificial spur, though two
    spurs may be used to match a weaker bird against a stronger one.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated rules give the dead bird to the winner and provide that in a drawn
    battle each side takes its own bird.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the cocks have been set to, no one except the holder may interfere without
    permission of the Juara or setter-to; unauthorized interference affects the owners'
    right to stakes if the cock wins.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: If a cock runs away and the wounded cock pursues it, both birds are caught
    and held by their Juaras; refusal to peck after repeated presentation can produce
    a drawn battle, while the cock that pecks wins.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The stakes on both sides must be deposited on the spot, and a cock is not
    to be taken up unless its spur is broken.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says that a cock's disposition changes after it has won, and that
    a cock is called Cheyma when it chooses round paddy grains, fights its shadow,
    or spurs or pecks at people.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage reports Malay belief that certain periods of the day influence
    breeds or colours of fighting cocks, with named Kutika periods favouring or disfavoring
    particular colour matchups.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: The narrator reports witnessing a large contest between two Malayan states
    at the breaking up of the Ramazan fast, with cock-fighters arriving at the Golongan
    or cock-pit carrying game-cocks.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the described contest, birds fought in full feather; the spurs were about
    two and a half inches long, scythe-shaped, sharpened on the spot, and capable
    of causing large gashes, with both cocks rarely surviving.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Cocks of the same colour were seldom matched, and setters-to adjusted weight
    differences by handling the birds and by placing the spur higher on the heavier
    cock's leg.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Before the battle, the birds were irritated by various methods, and during
    the fight the Malays showed strong excitement and interest.
  category: sequence
  evidence_refs:
  - ev:11
