canonical_text:
  quote: ''
  summary: The passage describes Malay rules for selecting a building site. The choice
    depends on the soil’s colour, taste, and smell; the surface formation; and the
    site’s aspect. Greenish-yellow, fragrant, tart-tasting loam is said to bring gold
    and silver to the third generation. A level site is preferred. Land low on the
    north and high on the south is said to bring peace. A note warns that a house-door
    must not face south, or the house will have no luck and things will go wrong.
