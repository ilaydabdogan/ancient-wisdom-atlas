canonical_text:
  quote: ''
  summary: The passage describes Malay wedding customs in which the bridegroom’s arrival
    at the bride’s house prompts a ritualized conflict called melawa. Barriers, fines,
    mock resistance, threshold defense by women, throwing of saffron rice or royal
    largess, and a formal marriage ceremony with priest, witnesses, and surety are
    described. A note adds older and widow-remarriage variations, including earrings
    identified as a symbol of virginity.
  language: English
  quote_policy: summarized
