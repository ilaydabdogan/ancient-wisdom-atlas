canonical_text:
  quote: ''
  summary: The passage states that among Malays certain parts of the body, especially
    the head and hair, are treated as possessing sanctity and requiring special ceremonies.
    It describes graded sacrificial reparation for bodily injury, comparative head
    taboos reported for Java and Polynesia, abstention from hair-cutting during special
    periods, child hair-cutting customs, and care in disposing of hair clippings because
    of a believed sympathetic connection.
  language: English
  quote_policy: summarized
