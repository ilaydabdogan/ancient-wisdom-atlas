- id: obs:3
  text: A Malay custom regulates the sacrifice owed by a person who commits assault
    or battery according to the part of the body injured.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If any part of the head is injured, the described reparation requires killing
    a goat and bathing both parties in its blood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the upper part of the body is injured, slaughtering a cock and disposing
    of it similarly is described as sufficient reparation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The value of the required sacrifice is described as decreasing as the injured
    part is farther from the head.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: A cited report about Java says people wear nothing on their heads, forbid
