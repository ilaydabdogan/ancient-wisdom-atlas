  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hair is sometimes left uncut throughout life or during special periods.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: During the forty days before a woman's purification after childbirth, the
    child's father is said to be forbidden to cut his hair.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Formerly, similar abstention from hair-cutting is said to have applied to
    persons undertaking a journey or engaging in war.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A boy's head may be shaven shortly after birth except for a single lock in
    the center of the head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The shaving operation may be postponed until puberty or marriage, often because
    of a vow made by the child's parents.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage says that great care is required in disposing of hair clippings,
