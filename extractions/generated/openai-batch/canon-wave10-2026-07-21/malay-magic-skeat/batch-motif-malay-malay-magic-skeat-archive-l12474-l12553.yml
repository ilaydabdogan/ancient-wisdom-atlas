  text: The passage says careful breaking up of the earth and daily treatment of plots
    help rice thrive and provide bodily sustenance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the nursery seedlings are ready and the fields are clean, around Safar
    or August, seedlings are pulled up and tied with dried palas leaf strips into
    sachekak-sized bundles.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Long roots and blades may be clipped, and the roots may be steeped in stock
    manure made from calcined buffalo bones and chaff, pounded, sieved, and mixed
    with mud.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage also allows the manure to be scattered in the field, or omitted
    where the soil is perennially rich.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After about two nights exposed to air, bundles are taken to the field, broken
    up, and planted as bunches of four or five plants at span intervals across the
    plots.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ten or fifteen female laborers may be hired to help pull and plant seedlings
    for a wage counted by the hundred bundles.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: After transplanting, the young rice regains green color at ten days, sends
    out young shoots at thirty days, increases during the second month, becomes even
    in the third month, and is styled bunting kechil in the fourth month.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the stage when the stalk has five joints, it must be fumigated daily until
    grain appears.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the stalk has six joints it is called bunting besar; later grain becomes
