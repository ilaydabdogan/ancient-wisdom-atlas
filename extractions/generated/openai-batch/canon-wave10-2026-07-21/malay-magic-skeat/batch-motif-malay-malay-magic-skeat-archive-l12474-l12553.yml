    quickly.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The time from transplanting to ripeness is reckoned as six months, excluding
    ploughing and nursery time.
  category: sequence
  evidence_refs:
  - ev:5
