  quote: ''
  summary: 'The passage gives practical instructions for rice cultivation: preparing
    fields, transplanting seedlings, tying and manuring seedling bundles, planting
    in bunches, hiring female laborers, tracking the rice through growth stages, fumigating
    at a specified stalk stage, draining water, and reckoning the time from transplanting
    to ripeness.'
  language: English
