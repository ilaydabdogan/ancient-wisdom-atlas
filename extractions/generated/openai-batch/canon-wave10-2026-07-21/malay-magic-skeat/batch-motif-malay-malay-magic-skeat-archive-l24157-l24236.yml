canonical_text:
  quote: ''
  summary: The passage describes spirits of different ranks, their associated Pawangs,
    and a royal ritual for a sick Sultan. A decorated sixteen-sided stand, candle,
    rice, delicacies, perfume, vessels, veil, and grass are used while minstrels call
    for the Jin Ka-raja-an. The Sultan shudders, the taper flares, and later the royal
    spirit is said to possess his body. The Pawang, possessed by Israng, falls when
    Israng sees a dish-cover. The ceremony ends after the Sultan recovers and cold
    water is poured over him; he later says he participated because it was an old
    custom and to please his people.
  language: English
  quote_policy: summarized
