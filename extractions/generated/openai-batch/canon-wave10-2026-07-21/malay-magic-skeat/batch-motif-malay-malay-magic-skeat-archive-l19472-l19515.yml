canonical_text:
  quote: ''
  summary: 'The passage describes Malay precautions for a pregnant woman during danger
    or when the Moon is said to be in trouble: a rice-spoon and its rattan binding
    are protective, a Bidan massages the woman and recites charms, and in a Pahang
    example Selema sits in the fireplace wearing a basket-work stand as a cap with
    a rice-spoon in her girdle. The passage then lists Malay adolescence ceremonies,
    especially filing the teeth and cutting the first locks of hair when postponed
    by parental vow until marriage.'
