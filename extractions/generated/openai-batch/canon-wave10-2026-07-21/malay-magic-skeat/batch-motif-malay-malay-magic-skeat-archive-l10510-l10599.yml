  summary: The passage describes transformations into fish and bear forms, explains
    white markings on bears and apes as remaining rice-cosmetic, reports Malay beliefs
    that some monkeys become fish, gives a fable behind the proverb about going to
    the monkey for justice, and records wild pig or wild boar superstitions involving
    brass changed into gold and a powerful boar-carried chain talisman.
  language: English
