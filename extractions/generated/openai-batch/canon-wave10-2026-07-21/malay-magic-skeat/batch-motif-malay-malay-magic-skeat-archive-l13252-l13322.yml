canonical_text:
  quote: ''
  summary: 'A Pawang performs actions before a mother-sheaf during a reaping ceremony:
    she veils her head with a white cloth, waves its ends in a repeated sequence,
    bends among the ears of the sheaf, applies tepong tawar to the roots, and works
    with a female bearer to plant sugar-cane in the sheaf. She sprinkles and fumigates
    the sugar-cane and recites words addressing Prophet ’Tap and the soul of S’ri
    Gading/Gemala Gading, saying the soul will be taken home to its palace and describing
    the plant’s parts as precious metals.'
  language: English with Malay ritual terms
  quote_policy: summarized
