canonical_text:
  quote: ''
  summary: 'The passage records several Malay bird-lore notes: a fever bird whose
    call is explained as the female calling to its mate because it cannot fetch food;
    a water-hen whose ground nest can make a person invisible and is said to be used
    for theft; a toucan or small hornbill explained as a murderer transformed into
    a bird after mistakenly carrying away his victim’s body; and the beginning of
    a tale in which the argus-pheasant and crow, friends in the days of King Solomon,
    agree to decorate one another’s feathers.'
  language: English
  quote_policy: summarized
