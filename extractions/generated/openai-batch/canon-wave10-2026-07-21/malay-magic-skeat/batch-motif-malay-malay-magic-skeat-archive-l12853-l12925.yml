canonical_text:
  quote: ''
  summary: The passage describes a planting-related rice-field ceremony at Sebatu.
    The village headman asks an observer to stop shooting because gunshots would irritate
    the hantu presiding over rice-lands and agricultural operations. At a small grass
    patch in the rice-fields, a raised wooden or bamboo altar with saplings, ketupats,
    cooked foods, goat flesh, buried goat remains, blood in coconut shells, an iron
    nail, incense fire, and tepong tawar sprinkling is used in a ritual conducted
    by the Pawang with villagers present.
  language: English
  quote_policy: summarized
