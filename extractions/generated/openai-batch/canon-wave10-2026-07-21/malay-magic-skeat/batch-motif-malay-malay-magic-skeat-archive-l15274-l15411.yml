canonical_text:
  quote: ''
  summary: 'The passage describes Malay and Bornean beliefs and practices concerning
    Bezoar stones, also called Guliga or Buntat: stones found in animals or trees
    are credited with magical and medicinal virtue, worn as charms, scraped into water
    for the sick, tested for authenticity, traded, imitated, and compared with rice-fed
    “breeding-pearls.” The narrator reports an attempted demonstration of a rice-fed
    stone’s movement and identifies the movement as trickery. The passage also notes
    that stone-age implements called thunderbolts are similarly assigned magical power
    and drunk in water after grating.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that extraordinary magical virtues are attached to Bezoar
    stones and that their gratings are mixed with water and administered to sick people.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cited note says Malays generally believe Guliga and Buntat stones, found
    in animals or contained in trees, have magical and medicinal virtue; they are
    worn as charms and scraped into water for medicine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An owner kept a small stone in cotton-wool inside a tin box, surrounded by
    grains of rice, and declared that the stone fed on the rice.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The owner claimed that a true Bezoar stone placed on an inverted tumbler would
