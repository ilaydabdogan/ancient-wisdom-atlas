canonical_text:
  quote: ''
  summary: 'Eyewitness description of a Malay tonsure rite called berchukor: after
    dancing and Koran-chanting in a decorated verandah, participants enter an inner
    room where a veiled bride stands on a wedding dais with seven long tresses, each
    ending in a metal ring. A Duenna supports the bride''s left hand while seven family
    representatives sprinkle it with Neutralising Ricepaste.'
