canonical_text:
  quote: ''
  summary: 'The passage reports Malay and Sumatran beliefs about tigers as human-like
    or spirit-inhabited beings: tigers may be men or demons in beast form, possess
    hidden settlements or enclosures, live in human-style houses with uncanny materials,
    return to their folds at night, and are addressed with respectful or propitiatory
    language. It also summarizes a fable of a strange foundling named Muhammad Yatim
    intended to explain tiger stripes, and notes comparisons with Ali''s lion title,
    elephant settlements, and a hair-and-bone hall on Gunong Ledang.'
  language: English
  quote_policy: summarized
