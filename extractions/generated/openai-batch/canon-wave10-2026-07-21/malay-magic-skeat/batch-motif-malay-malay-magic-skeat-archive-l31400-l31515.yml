  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The commentator says the image must resemble a corpse, be the length of the
    intended victim’s footstep, be pierced in the part to be affected, be wrapped
    in a shroud, and have the burial service read over it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A note states that usual ingredients such as hair clippings and nail parings
    would be worked into the wax, although they are not explicitly mentioned in the
    charm.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: In one variation, the wizard speaks during insertion of pins and says that
    he slays the liver, heart, and spleen of the named person, not the wax.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the same variation, the figure is waved in incense smoke, placed in the
