canonical_text:
  quote: ''
  summary: The passage describes Malay procedures for making and using a waxen image
    to cause sickness or death to an intended victim. The image is pierced in corresponding
    body parts, transfixed for death, treated like a corpse with shroud and burial
    prayers, and buried where the victim will cross it. Variants include spoken formulas
    denying that wax is being slain, offerings or a spirit banquet focused on the
    victim’s organs, incense smoke, a sacrificial tray, doorstep burial, and a sundown
    rite using rice, betel, a wax taper, an egg, and incense.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The wax image is described as made from an empty bees’ comb and as having
    the length of a footstep.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Piercing particular parts of the image is said to cause sickness in corresponding
    parts of the intended victim, such as the eye, waist or stomach, head, and breast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: To cause death, the image is transfixed from the head through to the buttocks
    with a gomuti-palm twig.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The image is enshrouded like a corpse, prayed over as if dead, and buried
    in the middle of the path to the target’s place so that the target may step across
    it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The burial charm addresses Prophet ’Tap as being in charge of the earth, names
