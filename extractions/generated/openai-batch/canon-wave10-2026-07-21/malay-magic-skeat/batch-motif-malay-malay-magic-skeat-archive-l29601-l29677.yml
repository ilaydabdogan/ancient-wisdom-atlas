canonical_text:
  quote: ''
  summary: The passage describes a Malay tilek divination rite using rice, fumigation,
    charms, a birch, and a suspended lemon believed to contain a spirit. The lemon
    answers questions by movement or stillness and can identify a thief by swinging
    toward a written name. A related eyewitness account by Sir Frank Swettenham describes
    consulting an Arab learned person who would fast, pray, and use water poured onto
    written paper as a mirror for seeing the robbery.
  language: English
  quote_policy: summarized
