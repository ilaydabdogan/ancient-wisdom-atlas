  summary: The passage gives a rule for judging a spearhead by proportional measurement,
    then describes a pawang drawing water from a kris, making the blade bendable,
    and restoring its hardness by passes. It concludes with commentary that weapons
    and warfare lore were declining, while warfare divination depended on minute observances,
    omens, and signs comparable in principle to divination in other areas of Malay
    life.
