canonical_text:
  quote: ''
  summary: The passage gives a Malay legend in which deer are connected with the body
    of a person who died from an abscess in the leg, including a report of the corpse
    rising from the grave and going into the forest as a deer. It notes that the Selangor
    version is practically identical to the Perak one. It then describes deer-hunting
    charms that address deer as human or royal beings and identify nooses as bracelets,
    rings, or King Solomon's necklace. A pawang may enter the toils first to mislead
    the stag. The passage also describes a deer-catching ceremony involving rattan
    rope coils, rice-pounders, burning incense, plant sprigs, circular beating, and
    muttering; omission of the ceremony is believed to cause failure, including demonic
    obstruction.
  language: English
  quote_policy: summarized
