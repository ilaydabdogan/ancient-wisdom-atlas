canonical_text:
  quote: ''
  summary: 'The passage presents Malay magical cosmogonic accounts: a pre-existent
    Creator or Eldest Magician creates earth and heaven, establishes a Ka''bah pillar
    or world-navel tree with four branches, commands Gabriel to kill the serpent Sakatimuna,
    and describes transformations of the serpent''s parts into spirits and natural
    phenomena. A second account describes divine utterances by God and Muhammad producing
    a seed that becomes a tree before heaven and earth are created.'
  language: English
  quote_policy: summarized
