canonical_text:
  quote: '"the great whirlpool which is called the Navel of the Seas"'
  summary: A Selangor Malay account tells of Haji Batu, a pilgrim whose finger joints
    were petrified, drifting by sea toward a region of flotsam and receiving a dream
    warning to use a hammer and seven nails on the Pauh Janggi tree before reaching
    the Navel of the Seas. A footnote quotes another narrative in which a magic prince
    or Golden Dragon reaches the Navel of the Seas, faces sea monsters and Raja Naga,
    and claims parentless incarnation from hollow bamboo.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A Selangor man named Haji Batu, also called the Petrified Pilgrim, is said
    to have had the first joints of all the fingers of one hand turned into stone.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Haji Batu determined to visit Mecca and set sail in a sailing vessel.
  category: action
  evidence_refs:
