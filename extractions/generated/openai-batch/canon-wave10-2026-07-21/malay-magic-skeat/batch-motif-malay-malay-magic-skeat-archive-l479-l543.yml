- id: obs:3
  text: After a long voyage and drifting off course, the ship reached a part of the
    sea containing floating tree trunks, rice-straw, and other flotsam.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: After seven more days of drifting, Haji Batu dreamed on the seventh night
    of a figure wearing pilgrim’s garb.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dream figure warned Haji Batu to carry a hammer and seven nails, drive
    the first nail into the stem of the Pauh Janggi tree, and cling to it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The next day the ship reached a great whirlpool called the Navel of the Seas.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The footnote says a magic prince arrived at the Navel of the Seas, where whales,
    monster fishes, colossal dragons, and magic dragons assembled to devour him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Raja Naga is described as superior to the assembled sea beings; he tried three
