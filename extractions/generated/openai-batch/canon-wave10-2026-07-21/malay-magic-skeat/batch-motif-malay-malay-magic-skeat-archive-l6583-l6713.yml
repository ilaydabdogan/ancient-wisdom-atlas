canonical_text:
  quote: ''
  summary: The passage gives a Malay charm used by Perak medicine-men against illness
    attributed to the hantu pemburu or Spectre Huntsman. The charm invokes God, addresses
    the spirit as Si Jidi, names his place, dogs, and weapons, threatens him with
    a knife from Maharaja Guru, claims knowledge of his origin, and commands him to
    return to the forest and not afflict the body. Prose notes describe symptoms caused
    by crossing his path or receiving his summons, protective written charms, his
    origin at Katapang in Sumatra, comparison with the European Wild Huntsman, taboos
    involving bamboo and poles, and the night call of the birik-birik bird as an omen
    of his approach.
  language: English with Malay charm text
  quote_policy: summarized
