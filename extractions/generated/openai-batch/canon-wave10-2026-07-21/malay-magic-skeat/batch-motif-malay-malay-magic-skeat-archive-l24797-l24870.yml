canonical_text:
  quote: ''
  summary: 'An observer describes the orchestra and setting for a Malay joget performance:
    musicians play chelempong, gambang, gong, drum, and chanang; dancers begin concealed
    behind fans, then drop the fans, perform Sembah, and move through slow, graceful
    dances. The narrator reports that five or six dances were said to be symbolical,
    including one representing agricultural tasks from tilling through winnowing.'
  language: English
  quote_policy: summarized
