canonical_text:
  quote: ''
  summary: The passage describes a Perak Malay ordeal by diving used to decide the
    truth of a disputed cause. Declarations are written, invoked with sacred names,
    sealed in indistinguishable bamboo tubes, assigned to two boys, and tested by
    simultaneous submersion at river stakes. The boy who remains under water longer
    determines the winning declaration. The passage explains the local belief that
    truth, backed by sacred invocation, enables endurance under water, and it briefly
    compares the rite with a similar Pegu water ordeal and other ordeal forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the appointed day the opposing parties attend at the Raja's balei with
    friends, and a krani writes a solemn declaration for each side.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The declarations invoke the name of God, the intercession of the Prophet,
    and the tombs of deceased Sultans of the country.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each paper is rolled by the krani, placed in a separate bamboo tube, and sealed
    so that the two tubes are indistinguishable and no one can tell which contains
    which declaration.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two boys are selected, each receives one bamboo tube, and they are led to
    the river where the Raja, Chiefs, and a crowd are present.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Two stakes are set in the bed of a selected river pool; the boys stand beside
    them neck-deep in water, and a horizontal pole is pressed down on their heads
    so that they sink at the same moment.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Each boy holds his post under water as long as he can; when one surfaces,
    his bamboo tube is taken and thrown into the stream, while the victor's bamboo
    is opened at the balei and the winner is declared.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'The passage states that Perak Malays regard the rite as an infallible truth
    test: the boy holding the false declaration is said to become half-drowned, while
    the champion of truth can remain below.'
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: The loser may be fined, loses his stakes, and must pay customary fees connected
    with the balei, the krani, and the boys.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage says the ordeal is not peculiar to Perak and cites a similar Pegu
    custom in which accuser and accused hold a river stake under water and the one
    who stays longest is credited.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: A note mentions other ordeals involving immersion of the hands in boiling
    oil or molten tin in connection with the old Johor Code of Laws.
  category: other
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage then turns to divinatory rites based on astrological calculations,
    times, seasons, numbers, and tables of lucky and unlucky periods.
  category: other
  evidence_refs:
  - ev:11
