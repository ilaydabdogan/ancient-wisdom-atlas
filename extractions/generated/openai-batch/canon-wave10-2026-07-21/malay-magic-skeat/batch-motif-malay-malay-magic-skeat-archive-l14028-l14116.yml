canonical_text:
  quote: ''
  summary: 'The passage describes Kinta as a mining district and explains the role
    of the Malay pawang in tin mining: he is paid for advice, divination, and dealings
    with mine spirits. It records mining-related taboo language, bans on naming or
    bringing certain animals and limes onto mines, and a legend of an enormous tiger
    named Ber-olak whose roar in the dry season predicts rain.'
  language: English
  quote_policy: summarized
