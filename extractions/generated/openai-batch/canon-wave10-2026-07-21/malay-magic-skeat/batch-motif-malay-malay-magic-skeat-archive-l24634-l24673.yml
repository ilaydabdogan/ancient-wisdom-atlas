  summary: The passage contains a moral statement that rulers depend on God for goodness
    and power, followed by a quoted letter from Haji Muhammad Abu Hassan asking the
    Resident about the Perak custom of ber-hantu. The letter describes ber-hantu as
    causing loss of reason, wasting substance, casting property into water or scattering
    it in the jungle, and requiring headmen to collect from common people for food
    and animal killing that is then thrown away. The writer condemns the practice
    as sinful and destructive according to Muhammadan religion. The passage then transitions
    to an account of Malay dance ceremonies and introduces the Joget.
