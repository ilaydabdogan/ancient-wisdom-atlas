  summary: The passage describes a Malay postpartum custom in which the mother is
    warmed or “roasted” on a heated couch and sometimes with a heated hearth-stone
    placed on her stomach. It reports a near-fatal case attributed to excessive heat,
    states that the custom continues through forty-four days of uncleanness, and lists
    associated birth taboos concerning food and fire. A cited comparison from Clifford
    mentions Selema nearly dying from practices considered necessary in Malay childbirth
    care.
