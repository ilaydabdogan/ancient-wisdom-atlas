canonical_text:
  quote: ''
  summary: 'The passage describes Malay war-related charms and observances: a charm
    attempted at full moon may be confirmed by a vision of a man; a spoken charm invokes
    God and asks a ''nerve of stone'' to pierce or destroy natural and cosmic obstacles;
    a concluding boast identifies the speaker as iron, copper-framed, and ''Tiger
    of God.'' Similar charms seek protection by Hell-fire and the pulverization of
    enemies, and actual warfare is said to require rules including a taboo language
    of war.'
  language: English
  quote_policy: summarized
