canonical_text:
  quote: ''
  summary: The passage describes a ritual in which sacrifices are sent by river toward
    Ollantay-tampu under command of the Lord Ynca, with torch-lit passage, coca thrown
    from a bridge, rejoicing, and an explanation that offerings repay the Creator
    for a good year. It then records ordinary farm work in January through March,
    and an April harvest rite involving maize from Sausiru, Mama-huaca as first maize-sower,
    chicha for her embalmed body, offerings of maize to named powers and dead lords,
    and a lamb sacrifice by Tarpuntay priests asking the Creator for good harvests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Lord Ynca, who was present, commanded Indians on both sides of the river
    to go with the sacrifices to Ollantay-tampu shortly before sunset.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Villagers along the route were stationed at intervals with torches to give
    light during the night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the bridge of Ollantay-tampu over a great river flowing to the North Sea,
    two bags of coca were thrown from the bridge as the sacrifices flowed past.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Those who had passed on the sacrifices danced, rejoiced, and performed the
    taqui chupay kuayllu during that day and the next.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The stated reason for the river sacrifices was that the Creator had granted
    a good year, and the people offered part of what he had given so as not to appear
    ungrateful, asking him to receive the offerings wherever he might be.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Participants who had gone furthest carried lances and falcons made of salt,
    while laggards carried toads made of salt, which marked their slowness and made
    people laugh at them.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: January was called Atun-pucuy, February Pacha-pucuy, and March Pancar-huara;
    no special festival is described for these months, and people attended to farm
    work.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: April was called Ayrihuay; crops were reaped, and youths who had received
    arms as knights went to the farm of Sausiru to fetch maize.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Sausiru farm was said to be where Mama-huaca, sister of Manco Ccapac,
    sowed the first maize; it was cultivated annually for her embalmed body, and chicha
    was made from its crop for that body’s service.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Maize from the harvests of the Creator, Sun, Moon, Thunder, Ynca, Huanacauri,
    and dead lords was brought in small baskets with singing and gay clothing; Tarpuntay
    priests offered a lamb and asked the Creator to grant good harvests.
  category: action
  evidence_refs:
  - ev:6
