canonical_text:
  quote: ''
  summary: 'Huathiacuri, appearing poor and ragged, offers to cure a sick god if he
    is given the sick man''s young daughter as wife. He reveals that the illness is
    connected with the wife''s adultery and hidden dangerous animals: two serpents
    above the house and a two-headed toad beneath a grindstone. The serpents are found
    and killed, the wife confesses, the toad goes to a spring said to cause madness
    and death, and the sick man recovers. Huathiacuri receives the girl and goes to
    Condor-coto, where five eggs and wind are associated with his father Pariacaca.
    A wealthy brother-in-law challenges Huathiacuri, who consults Pariacaca in one
    of the eggs.'
  language: English
  quote_policy: summarized
