canonical_text:
  quote: ''
  summary: The passage reports an ancient tradition about huacas or idols who walked
    in human form. Yananamca Intanamca were defeated by Huallallo Garuincho/Carrincho,
    who became lord and god of the land and demanded the sacrifice of one of every
    two children. In that time the dead and crops returned or matured on the fifth
    day, and the land was hot and fertile. Pariacaca later drove Huallallo and the
    people away. The passage then describes Coniraya, an idol invoked as Coniraya
    Uiracocha, lord of crops and people, to whom coca was offered when undertaking
    difficult work.
  language: English
  quote_policy: summarized
