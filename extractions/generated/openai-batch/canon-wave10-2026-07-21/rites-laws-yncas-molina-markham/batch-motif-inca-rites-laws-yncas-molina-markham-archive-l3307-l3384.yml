  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not explain whether the fragment is an image, relic,
    or embodied huaca beyond the reported ritual speech.
comparison_claims:
- id: claim:1
  claim: The passage supports a cautious same-motif comparison with a resurrection-and-return
    motif family because the huacas are explicitly said to resurrect and the times
    of the Yncas are said to be restored.
  claim_level: same_motif
  target: resurrection / return motif family
  evidence_refs:
  - ev:1
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The wording is mediated by an English translation of a colonial account,
    so the Christian term 'resurrection' may not reproduce an indigenous technical
    category.
- id: claim:2
  claim: 'The offerings and libations function like a sacrifice-and-sacred-exchange
    pattern: neglected offerings leave the huacas hungry, while restored offerings
    are associated with health, children, and food.'
  claim_level: same_function
  target: sacrifice / sacred_exchange motif family
  evidence_refs:
  - ev:1
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage reports the exchange through hostile colonial narration
    and reported speech rather than an indigenous liturgy.
- id: claim:3
  claim: The incorporation of huacas in men supports comparison to a human-medium
    or oracular-possession pattern, since the sacred power is said to enter bodies
    and cause speech.
  claim_level: same_function
  target: human medium / oracular possession pattern
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: This target is a descriptive pattern, not one of the supplied motif
    taxonomy IDs.
- id: claim:4
  claim: The restoration of Ync̄a times and return of huaca fragments to their former
    places supports a cautious comparison to an ancestral political-religious restoration
    pattern.
  claim_level: same_function
  target: return / royal_legitimacy pattern
  evidence_refs:
  - ev:4
  - ev:7
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not describe a restored ruler, genealogy, or formal
    royal rite; the comparison rests on restoration of 'the times of the Yncas' and
    the reported uprising context.
