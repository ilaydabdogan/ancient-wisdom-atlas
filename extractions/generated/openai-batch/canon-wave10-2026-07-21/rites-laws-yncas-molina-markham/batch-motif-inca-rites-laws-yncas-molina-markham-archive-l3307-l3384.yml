  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: The restoration of the fragment was done with many sacrifices.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: Wizards returned to their offices, remained with Indians said to be possessed
