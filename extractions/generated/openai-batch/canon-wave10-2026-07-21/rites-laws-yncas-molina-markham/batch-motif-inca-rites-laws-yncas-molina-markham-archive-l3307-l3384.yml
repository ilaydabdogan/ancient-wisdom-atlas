canonical_text:
  quote: declaring the resurrection of the huacas
  summary: The passage reports Indian preachers announcing the resurrection and hunger
    of the huacas, urging people to abandon Christian practices and return to older
    rites. It describes fasting, possession by huacas, offerings and festivals for
    possessed mediums, rituals over stone fragments of burnt huacas, and eventual
    colonial suppression of the movement.
  language: English
  quote_policy: quoted
literal_observations:
