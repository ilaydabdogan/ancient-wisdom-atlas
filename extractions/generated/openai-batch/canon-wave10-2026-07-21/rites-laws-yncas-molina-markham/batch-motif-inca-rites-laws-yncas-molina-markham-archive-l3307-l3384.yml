candidate_motifs:
- id: motif:1
  label: resurrection and return of sacred powers
  taxonomy_refs:
  - resurrection
  - return
  basis: The preachers explicitly announce the resurrection of the huacas and the
    restoration of the times of the Yncas.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: The passage is a colonial report and uses translated Christian vocabulary
    such as 'resurrection' and 'apostacy.'
- id: motif:2
  label: restoration of ancestral Inca order
  taxonomy_refs:
  - return
  - royal_legitimacy
  basis: The preached program says the old belief should be resumed, the times of
    the Yncas restored, and huaca fragments put back where they were in the days of
    the Yncas.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
  confidence: medium
  cautions: No specific king, lineage ritual, or enthronement is described in this
    passage; the royal-legitimacy reference is only a cautious fit to the restoration
    of Ync̄a times.
- id: motif:3
  label: sacrifice and libation in exchange for health, children, and food
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Huacas are said to suffer because sacrifices and chicha have ceased; worshippers
    offer animals and other goods; the stone fragment is said to give health, children,
    and food after libation and sacrifice.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The account does not present the participants' own explanation directly
    except through reported speech.
- id: motif:4
  label: divine anger and punitive threat against converts
  taxonomy_refs:
  - divine_judgment
  basis: The huacas are reported as enraged with baptized people and as threatening
    death unless people return to the old belief; worms are announced for Spaniards,
    animals, and Christian Indians.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The motif family is inferred from threats and anger; no formal judgment
