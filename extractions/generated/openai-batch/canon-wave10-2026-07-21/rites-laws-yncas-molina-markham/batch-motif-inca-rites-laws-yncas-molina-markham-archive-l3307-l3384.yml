  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The huacas were said to wander in the air, thirsty and hungry because sacrifices
    and chicha libations had ceased.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The preachers said worms were sown in fields to be planted in the hearts of
    Spaniards, Spanish sheep, horses, and Indians who remained Christians.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The huacas were said to be enraged with baptized people and to threaten death
    unless people returned to the old belief and renounced Christianity.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Those seeking the huacas' friendship were instructed to fast and avoid salt,
    aji, coloured maize, Spanish things, churches, priests' calls, and Christian names.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The preachers announced that the times of the Yncas would be restored.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The huacas were said no longer to enter stones or fountains to speak, but
    instead to be incorporated in men whom they would cause to speak.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: People were told to prepare their houses in case a huaca wished to lodge in
    one of them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some Indians trembled, fell to the ground, tore themselves, and made faces,
    then said a huaca had entered their bodies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A person said to be entered by a huaca was carried to a chosen spot, where
    a lodging was made with straw and cloaks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: People worshipped the huaca represented by the possessed man, offering sheep,
    colla-chicha, llijpta, mollo, and other things.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A festival of two or three days followed, with dancing, drinking, and invocation
    of the huaca represented by the possessed man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Possessed persons preached to the people, telling them not to serve God but
    the huacas and to renounce Christianity, Christian names, shirts, hats, and shoes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Possessed persons asked whether people had relics of burnt huacas; when a
