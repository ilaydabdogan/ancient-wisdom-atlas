canonical_text:
  quote: ''
  summary: 'The passage recounts episodes in the career of Pachacuti Ynca Yupanqui:
    tribute and the birth of his sons, reports of prodigious creatures and fiery signs
    near Cuzco, return festivals, the death and mourning of his father Uiraccocha
    Ynca Yupanqui, later conquests, an assassination attempt allegedly prompted by
    a huaca, collective punishment of the Capacuyos, and a miracle in which a huaca
    sends fire and a destructive serpent that is defeated by an eagle after the Inca
    prays.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pachacuti receives ychma, gold, and silver, travels near Villcas and Puma-cancha,
    and his eldest legitimate son Amaru Yupanqui is born there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: News arrives of a miracle at Cuzco involving a yauirca or amaru, described
    as a ferocious creature of great length, with ears, eye-teeth, and a beard, coming
    from the mountain of Pachatusan and entering the lake of Quichuipay.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two fiery sacacas come out of Ausancata and go toward Arequipa, and another
    goes toward snowy mountains near Huamanca; they are described as winged, four-legged,
    tailed animals with ears and spiked backs that appear fiery from a distance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pachacuti goes to Cuzco and finds his father Uiraccocha Ynca Yupanqui very
    old and infirm.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Festivals of Pachacuti's return and of the Ccapac Raymi of Pachayachachi are
    celebrated with rejoicing, and the Curacas and Mitmays of Caravaya bring a many-coloured
    chvquichinchay said to have been chief of the uturuncus.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Pachacuti orders deformed and idiotic persons to be employed in making clothes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When Uiraccocha dies, mourning uses white vicuna wool, and soldiers carry
    the old man's body with his arms and insignia through the city while singing a
    war-song and bearing shields, clubs, and lances.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Women form another mourning procession with shorn hair, black clothing, blackened
    faces, and self-flogging with thorn bushes; they mourn for a week and seek the
    dead Inca's body.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Pachacuti undertakes conquest of the Cunti-suyus and encounters the Collas
    and Camanchacas in the Collao, who are described as great sorcerers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A poor man carrying huiltis strikes Pachacuti on the head intending to kill
    him, is tortured, and confesses that he was a Cavina sent at the request of the
    Capacuyos.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Pachacuti orders the province of the Cavinas to be laid waste, but the blame
    is attributed to the Capacuyos; the Capacuyos are all put to death, and the murder
    attempt is said to have followed advice from the huaca Canacuay.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Pachacuti's second son, Tupac Ynca Yupanqui, is born, and Pachacuti undertakes
    the conquest of the Antisuyus with 100,000 men.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The huaca Canacuay sends forth fire and blocks the passage with a fierce serpent
    that destroys many people.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: Pachacuti raises his eyes to heaven and prays for help; a furious eagle descends,
    seizes the serpent's head, lifts it high, and hurls it to the ground.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: In memory of the miracle, Pachacuti orders a snake to be carved in stone on
    a terrace wall in the province called Anca-pirca.
  category: action
  evidence_refs:
  - ev:14
