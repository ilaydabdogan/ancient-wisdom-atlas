candidate_motifs:
- id: motif:1
  label: prodigious animal omens near a royal center
  taxonomy_refs: []
  basis: The passage reports a miracle at Cuzco involving a huge ferocious creature
    moving from mountain to lake and fiery animal-like sacacas crossing the landscape.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage calls the event a miracle but does not explicitly interpret
    the signs or their meaning.
- id: motif:2
  label: royal heir birth during movement and campaign narrative
  taxonomy_refs: []
  basis: Pachacuti's eldest legitimate son is born while he rests at Puma-cancha,
    and his second son is born before the Antisuyus campaign.
  evidence_refs:
  - ev:1
  - ev:11
  confidence: medium
  cautions: The births are royal and narratively placed, but the passage does not
    describe them as miraculous or divine births.
- id: motif:3
  label: royal funerary procession with insignia and marked mourning
  taxonomy_refs:
  - royal_legitimacy
  basis: The dead Inca's body is carried through the city with arms and insignia,
    while soldiers sing a war-song and women perform visible mourning actions.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage presents funerary mourning; any link to royal legitimacy is
    functional and should be reviewed.
- id: motif:4
  label: hostile huaca sends fire and serpent obstacle
  taxonomy_refs:
  - serpent
  basis: Canacuay is said to send fire and to block Pachacuti's passage with a fierce
    serpent that destroys many people.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The fire is localized as an obstacle and should not be treated as world-destroying
    fire.
- id: motif:5
  label: prayer answered by eagle defeating serpent
  taxonomy_refs:
  - serpent
  basis: After Pachacuti prays to heaven, an eagle descends, seizes the serpent's
    head, lifts it, and throws it to the ground.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The source does not name the eagle as a deity; it only reports its action
    after the prayer.
- id: motif:6
  label: memorial carving of defeated serpent
  taxonomy_refs:
  - serpent
  basis: Pachacuti orders a stone snake carved on a terrace wall in memory of the
    miracle.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The memorial function is explicit, but the passage gives no further ritual
    use for the carving.
