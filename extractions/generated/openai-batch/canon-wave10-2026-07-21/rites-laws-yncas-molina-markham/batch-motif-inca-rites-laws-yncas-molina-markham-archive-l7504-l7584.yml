canonical_text:
  quote: ''
  summary: 'The passage describes Inca sacrificial belief and tribute arrangements:
    sacrificed persons were said to enjoy infinite rest; cloth, animals, wool, food,
    idols, labor, and provincial products were sent to Cuzco for the Ynca, religion,
    huacas, deities, and embalmed royal bodies; conquered provinces maintained service
    to their principal idols in Cuzco; and red carved wood was burned in sacrificial
    fires before the Ynca and embalmed dead lords.'
  language: English
  quote_policy: summarized
