canonical_text:
  quote: ''
  summary: The passage describes Ynca Mayta Ccapac as a precocious ruler who cried
    in the womb, spoke soon after birth, fought at age ten, made moral laws, opposed
    huacas and idols, honored a Creator, and instituted ritual forms at Ccuricancha.
    It also recounts the burning of huacas, their escape in forms such as fire, wind,
    and birds, the renewal and later replacement of a golden plate representing the
    Creator, and a later Spaniard gambling for the plate in Cuzco.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mayta Ccapac is said to have cried many times while still in his mother's
    womb, spoken a few months after birth, and fought valiantly at ten years old.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mayta Ccapac is said to have governed well, made moral laws, forbidden evil
    customs, and foretold the coming of the holy gospel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: As a boy, he ordered huacas and idols to be brought to Cuzco under the promise
    of a great festival, then set them on fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Many of the huacas are said to have escaped in the forms of fire, wind, and
    birds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage calls this Ynca a great enemy of idols and says he ordered that
    no honors be paid to the sun and moon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: He declared that the sun, moon, and all elements were made for the service
    of men.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: He is described as a severe judge of enchanters, priests, sorcerers, idol-worshippers,
    and people who worked on the chief day of Ccapac-raymi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: On Ccapac-raymi he gave thanks to the Creator Tica-ccapac, also called Caprichay.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: He chastised people described as undutiful, liars, adulterers, fornicators,
    evil livers, thieves, murderers, and drunkards.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: He commanded that there be no unjust wars, ordered people to till the ground
    and build, set up landmarks in every village, punished those who moved them, and
    was credited with universal peace.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A brief reported utterance asks, "O Lord, where art Thou?" and the passage
    links it with longing to know the Creator.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Ynca is said to have appeared more noble than the others, renewed a plate
    set up by his great-grandfather, and rebuilt the house of Ccuricancha.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: He caused things to be placed around the plate, instituted new songs, and
    had very large drums made for the feast of Ccapac Raymi.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The feast is said to have been held only in honor of the Lord and Creator,
    while created things, including men, the sun, and the moon, were despised.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: Huascar Ynca removed the plate and substituted a round plate like the sun
    with rays, or an image of the sun in the place where the Creator's image had been.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Images of the sun and moon are described as placed on either side of the Creator's
    image or plate.
  category: object
  evidence_refs:
  - ev:7
- id: obs:17
  text: The plate is described as a plate of fine gold and as an image of the Creator
    and true Sun, called Uiiacocha-pachaya-chachic.
  category: object
  evidence_refs:
  - ev:8
- id: obs:18
  text: A Spaniard is said to have gambled for this plate of gold in Cuzco.
  category: action
  evidence_refs:
  - ev:9
