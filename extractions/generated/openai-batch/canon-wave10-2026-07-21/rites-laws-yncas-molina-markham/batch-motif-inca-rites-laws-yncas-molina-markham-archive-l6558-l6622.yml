canonical_text:
  quote: ''
  summary: Huathiacuri defeats a wealthy opponent in competitions, uses an oscollo
    to frighten the opponent's llamas, proposes a dance challenge, and causes or turns
    the opponent into a deer. The opponent's wife follows and is turned into an inverted
    stone that receives offerings. The passage then describes five eggs at Condorcoto
    opening into falcons who become men, and a storm and flood raised by Pariacaca
    and others that carries away a rich Indian who had pretended to be God, along
    with his household and surrounding landscape features.
  language: English
  quote_policy: summarized
