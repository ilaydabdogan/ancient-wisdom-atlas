canonical_text:
  quote: ''
  summary: 'The passage introduces traditions of Huarochiri after the deluge, including
    a leaderless period called Purunpacha, the appearance of five eggs on the mountain
    Condorcoto as the origin of Pariacaca, and Huathiacuri, a poor son of Pariacaca.
    It describes a wealthy lord at Anchicocha who claimed to be God and Creator, then
    became gravely ill. Huathiacuri, travelling toward the sea, overhears two foxes
    exchanging news: one reveals that the rich man''s illness is linked to his wife''s
    adultery involving a grain of maize, and that a serpent and a two-headed toad
    threaten the rich man''s house; the other mentions a chief''s daughter dying after
    connection with a man. Huathiacuri then goes to the sick rich man''s place.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the deluge, the people are said to have descended from one man; in the
    later period called Purunpacha, districts chose rich and valiant men as leaders
    because there was no king.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Five large eggs appeared on a mountain called Condorcoto between Huarochiri
    and Chorrillo, and the passage identifies this as the origin of Pariacaca.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Huathiacuri is described as a poor, ill-clad Indian, a son of Pariacaca, who
    learned many arts from his father and ate poorly cooked food called huatyasca.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A rich and great lord lived at Anchicocha in a house adorned with yellow and
    red feathers and owned many brightly coloured llamas and other riches.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The rich lord presented himself as very wise and said he was God and Creator,
    but later suffered a tedious and disgusting illness that his remedies and healers
    could not cure.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Huathiacuri travelled toward the sea, slept at the height called Latallaco,
    and saw two foxes moving in opposite directions between the sea/coast and Anchicocha.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: One fox reports that the real cause of the rich man's sickness is that his
    wife gave a toasted maize grain from her skirt to a man, who ate it, and then
    committed adultery with him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The same fox says that a serpent is hovering over the rich man's beautiful
    house to eat it and that a two-headed toad waits under his grinding-stone with
    the same purpose.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The other fox reports that a beautiful daughter of a great chief is dying
    after having had connection with a man; the narrator says this story will be told
    later.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: After hearing the foxes, Huathiacuri goes to the place where the rich man
    lies sick.
  category: sequence
  evidence_refs:
  - ev:9
