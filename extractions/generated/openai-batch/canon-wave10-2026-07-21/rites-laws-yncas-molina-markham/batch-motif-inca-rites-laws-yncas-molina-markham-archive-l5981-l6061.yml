canonical_text:
  quote: ''
  summary: Cavillaca enters the sea with her child and becomes a pair of rocks. Coniraya
    pursues her and asks successive animals whether they have seen her. Animals who
    say she is near receive blessings, while animals who say she is too far away receive
    curses. The lion receives an extended blessing involving fear, punishment of evildoers,
    preserved skin and head, festival use, llama sacrifice, dancing, and singing;
    the falcon episode begins before the passage cuts off.
  language: English
