  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage says that from that time all huacas feared the Yncas.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Yncas used yacarcay in the name of the Creator and, with these words,
