canonical_text:
  quote: ''
  summary: The passage describes Mayta Ccapac as wise and prophetic, his reflections
    on death during Ccapac Raymi, and his month-long fast. It then gives his sons
    and the succession of Ccapac Yupanqui. Under Ccapac Yupanqui, sacrifices are said
    to have been instituted. The young Ynca enters a dark ritual place to witness
    a huaca, orders light admitted, questions the being named Cana-chuap yauirca,
    declares belief in a Creator of all things, and causes the being to flee. The
    passage says huacas thereafter feared the Yncas, who used a yacarcay formula in
    the Creator's name while still continuing capacochacocuy.
  language: English translation with a Quechua ritual formula
  quote_policy: summarized
