    foresee future events.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A solemn Ccapac Raymi festival in honor of Uiracocha Pachayachachi lasted
    for a whole month.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mayta Ccapac spoke after festival days about the feast ending, death following
    like night after day, sleep as an image of death, and a true feast of eternity
    known by those who know the Creator's name.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mayta Ccapac fasted in Toco-cachi with great mourning for a month, eating
    one row of grains from a maize cob each day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mayta Ccapac had sons named Ccapac Yupanqui, Apu Urco Suaman Ynti Cunti Mayta,
    and Urco Huaranca; Ccapac Yupanqui was identified as heir and successful in arms.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: After Mayta Ccapac's death, many great Curacas and chiefs submitted to Ccapac
    Yupanqui.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Ccapac Yupanqui's time, the passage says sacrifices were invented involving
    the burial of virgin boys with silver and gold, and arpac offerings with human
    blood or white lambs, guinea pigs, and grease.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ccapac Yupanqui entered a selected place in Capacuyo to witness how huacas
    conversed with their friends.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The people in the place closed doors and windows to create darkness, said
    this would make the huaca come, and required silence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the being was called, it entered with a rush of wind that caused horror
    and cold sweat among those present.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ccapac Yupanqui ordered doors and windows opened so he could see the being's
    shape; when light entered, the being hid its face and gave its name as Cana-chuap
    yauirca.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ccapac Yupanqui challenged the being's claimed powers and called it a false
    deceiver, saying he felt there was another Creator of all things as his father
    Mayta Ccapac had told him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The being is described as ugly, foul-smelling, and having coarse matted hair;
