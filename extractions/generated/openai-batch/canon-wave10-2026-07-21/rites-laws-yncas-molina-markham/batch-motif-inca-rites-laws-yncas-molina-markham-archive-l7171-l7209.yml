canonical_text:
  quote: ''
  summary: 'The passage reports on Inca and colonial administration of llama flocks:
    contested taking of flocks from Aymaraes and other regions, royal claims to rights
    over them, portions left to districts and chiefs, classification of religious/Inca
    and other flocks as Ccapac-llama and Huachay-llama, prohibition of division and
    common enjoyment, preservation rules, highland dependence on flocks, wool-for-food
    exchange, and profits from taking flocks to Potosi.'
  language: English
  quote_policy: summarized
