canonical_text:
  quote: ''
  summary: The passage describes Tonapa or Thonapa as a wandering staff-bearing preacher
    and healer who teaches across the land, is rejected in several places, gives Apo-tampu
    a marked stick containing precepts, curses communities that refuse him, submerges
    one village under water, turns wedding celebrants into stones, destroys a hilltop
    female-form idol, carries a large cross to a mountain, and sprinkles a chief's
    daughter with water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man is described as long-haired, wearing a rather long shirt, somewhat
    past his prime, grey-haired, lean, and travelling with a staff.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: He travels through the land teaching the natives with love and calling them
    his sons and daughters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the sick were healed by his touch and that he spoke all languages
    better than the natives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: He is called Tonapa, Tarapaca, Thonapa, and by other names or titles; the
    passage glosses Tarapaca as meaning an eagle and other terms as servant or preacher.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Although he preached, people did not listen and thought little of him; the
    narrator asks whether he was the apostle St. Thomas.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Tonapa comes tired to the village of the chief Apo-tampu during a marriage
    feast; the chief listens with friendly feelings while his vassals listen unwillingly.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tonapa becomes Apo-tampu's guest and gives him a stick from his own staff;
    the people receive his preaching through the stick, marking and scoring on it
    chapters of his precepts.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Old men are reported as saying that Cagi-cagi were the commandments of God,
    especially seven precepts, with severe punishments for breaking them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Tonapa is said to visit the provinces of Colla-suyu, enter Yamquesupa, be
    treated with contempt, and be driven away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Tonapa is said to curse Yamquesupa so that it is covered with water; the site
    is described as a lake that had once been a village.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the high hill called Cacha-pucara there is said to have been an idol in
    the form of a woman, which Tonapa hated, burnt, and destroyed along with the hill.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In another town during a wedding festival and banquet, people refuse to listen
    to Tonapa and are cursed and turned into stones, said to be visible to the present
    day; the same is said to have happened in Pucara and other places.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the mountains of Caravaya, Tonapa erects a very large cross and carries
    it on his shoulders to the mountain of Carapucu, where he preaches loudly and
    sheds tears.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: A daughter of a chief of that province is sprinkled on the head with water
    while Indians observe it.
  category: action
  evidence_refs:
  - ev:9
