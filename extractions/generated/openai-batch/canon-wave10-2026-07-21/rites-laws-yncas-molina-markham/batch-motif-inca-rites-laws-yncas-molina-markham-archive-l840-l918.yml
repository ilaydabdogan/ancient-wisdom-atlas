canonical_text:
  quote: ''
  summary: The passage reports traditions in which nations trace their origins to
    places, ancestors, huacas, stones, birds, and animals; some groups remember a
    deluge survived by a few people in hills, caves, or trees. It then recounts a
    Creator at Tiahuanaco who makes the sun, moon, and stars, sends them to Titicaca
    and heaven, and whose command is linked with Manco Ccapac and his siblings emerging
    from the cave of Pacaritambo. The Sun addresses Manco Ccapac as a child, grants
    him lordship and insignia, and is worshipped as father. A further fable names
    two sons of the Creator and describes the Creator assigning dress and language
    to nations, inspecting their obedience, and turning rebels into stones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some nations made huacas and places of worship from places associated with
    the beginning of their lineage.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says some first-born or first lineage figures were turned into
    stones, while others were turned into falcons, condoles, and other animals and
    birds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some nations say that a deluge destroyed all people except a few who escaped
    on hills, in caves, or in trees.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The deluge survivors multiplied, and stone idols were made in memory of the
    first escaped ancestor, with the ancestor's name given to each huaca.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some nations had a tradition of a Creator of all things and made sacrifices
    to him, though with less quantity or veneration than to idols or huacas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Creator is said to have had his chief abode at Tiahuanaco, where edifices
    and human-shaped stones were associated with people changed into stone for disobeying
    him.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: In a dark condition, the Creator made the sun, moon, and stars, ordered them
    to the island of Titicaca, and from there to rise to heaven.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Sun, in the form of a man and ascending into heaven, called to the Yncas
    and to Manco Ccapac as their chief.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Sun declared that Manco Ccapac and his descendants would be lords, would
    subjugate many nations, and should regard and worship the Sun as father.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Sun gave Manco Ccapac the suntur-paucar, the champi, and other sceptre-like
    ensigns used by the Yncas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Manco Ccapac and his brothers and sisters, by command of the Creator, descended
    under the earth and came out again in the cave of Pacaritambo.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Other nations were also said to have come out of the same cave at the place
    where the Sun rose on the first day after the Creator divided night from day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Another fable says that the Creator had two sons named Ymaymana Viracocha
    and Tocapo Viracocha.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Creator completed tribes and nations and assigned dresses and languages
    to them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Creator traveled from Tiahuanaco by the road of the mountains, visited
    nations, examined their multiplication and obedience, and turned many rebellious
    nations into stones shaped like men and women wearing their same dress.
  category: sequence
  evidence_refs:
  - ev:9
