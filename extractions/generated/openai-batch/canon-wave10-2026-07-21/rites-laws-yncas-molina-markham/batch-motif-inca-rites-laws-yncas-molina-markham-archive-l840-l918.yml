- id: motif:2
  label: deluge survival and renewal
  taxonomy_refs:
  - flood_and_renewal
  basis: A deluge destroys almost all people, a few survive in refuges, and they later
    multiply.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives a brief report of variants among nations rather than
    a single extended flood narrative.
- id: motif:3
  label: petrification of ancestors or disobedient peoples
  taxonomy_refs:
  - divine_judgment
  basis: First lineage figures are said to become stones, and disobedient or rebellious
    peoples are turned by the Creator into stones shaped like men and women.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:9
  confidence: medium
  cautions: Only some stone transformations are explicitly punitive; the lineage-ancestor
    transformations are not clearly presented as judgment.
