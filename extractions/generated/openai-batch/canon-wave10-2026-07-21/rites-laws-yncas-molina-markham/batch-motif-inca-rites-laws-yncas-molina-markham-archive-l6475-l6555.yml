canonical_text:
  quote: ''
  summary: Huathiacuri repeatedly accepts challenges from his rich brother-in-law.
    He seeks help from his father Pariacaca, who provides strategies and supernatural
    objects. Through a dead-huanacu transformation, fox-carried chicha and instruments,
    earth-shaking music, an unfailing drink jar, a shirt of snow, a red lion-skin
    with a rainbow, and nocturnal animal builders, Huathiacuri wins successive contests
    in drinking, dancing, attire, lion-skin display, and house-building.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Huathiacuri accepts a challenge from his brother-in-law to compete in drinking
    and dancing, then goes to his father Pariacaca for instruction.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pariacaca tells Huathiacuri to go to a neighboring mountain, where he will
    turn into a dead huanacu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A fox and vixen are expected to arrive with chicha, a drum, and a many-piped
    flute, intended for drinking, playing, and dancing before Pariacaca.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the foxes stop to eat the dead huanacu, Huathiacuri is to return to his
    own shape, cry aloud, make them flee, and take the objects they leave behind.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the drinking and dancing gathering, Huathiacuri enters with his wife, who
    fills his cup and plays a drum; at the first sound, the earth begins to shake
    and dance with the music.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Huathiacuri drinks all that is given to him, and his wife fills cups from
    the fox's jug; the chicha does not run out, and each drinker falls intoxicated.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: For a festive-attire challenge, Pariacaca dresses Huathiacuri in a shirt of
    snow, and Huathiacuri defeats his brother-in-law again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: For a lion-skin dancing challenge, Pariacaca sends Huathiacuri to a fountain,
    where he finds a red lion-skin; when he enters the square, a rainbow is seen around
    the lion's head.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: For a house-building challenge, the rich man uses numerous vassals, while
    Huathiacuri has only his wife; during the night, birds, snakes, and lizards silently
    complete Huathiacuri's work.
  category: sequence
  evidence_refs:
  - ev:7
