canonical_text:
  quote: ''
  summary: 'The passage describes forms of apostasy involving claims that huacas were
    inside people''s bodies and self-offering to huacas, then details curative rites
    led by Indian sorcerers or witches: offerings of maize, shell, coca, gold, silver,
    food, and chicha to huacas, vilcas, celestial beings, the Creator, and the dead;
    washing at a junction of two rivers to leave illness behind; and confession called
    hichoco. It ends with comments on opposition to these practices, punishment of
    wizards, and the diversity of provincial rites before and under the Yncas.'
  language: English
  quote_policy: summarized
