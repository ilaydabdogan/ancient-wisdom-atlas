canonical_text:
  quote: ''
  summary: A ninth- and tenth-day rite for youths receiving knighthood is described.
    Participants assemble in ritual clothing, sacred images are brought out, the youths
    worship the huacas and seek permission to sacrifice, then fast, travel to Huanacauri,
    ascend to its huaca, offer sheep and lamb sacrifices through priests, blow wool
    into the air with prayer, and receive huaracas and chuspas as signs of valor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the ninth day, parents and relations of the youths assemble in the square
    wearing festival-specific dress with yellow mantles and black plumes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The youths who are to receive knighthood are shorn and then clothed in the
    described dress.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Selected maidens called Nusta-calli-sapa, from elite families and aged approximately
    eleven to fourteen, attend the feast and are assigned to carry small vases of
    chicha.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The assembled people go to the house of the Sun and Thunder and bring images
    to the square; the Ynca comes out and takes his place near the statue of the Sun.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The youths rise in order and make their mucha, described as their manner of
    worshipping the huacas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: A woman-shaped figure called Passat-mama, identified as the huaca of the moon,
    is brought out from the house of the Sun, carried on women’s shoulders, and kept
    in the charge of women because it was said to be a woman and resembled one.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: After further reverences at noon, the youths seek permission from the Ynca
    to make their sacrifices.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Each youth has a sheep prepared for sacrifice; the youths and their relations
    go to Huanacauri, sleep at Matahua at the foot of the hill, and at sunrise on
    the tenth day ascend fasting to the huaca Huanacauri.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Tarpuntays, identified as priests who make sacrifices, pull a small handful
    of wool from each sheep, then sacrifice five lambs before the huaca at the top
    of the hill.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The priests divide the wool among the youths and chiefs; the youths and chiefs
    blow the wool into the air while the sacrifices are being consumed and address
    a prayer to Huanacauri.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The prayer calls Huanacauri “our father” and asks that the Creator, the Sun,
    the Thunder, the Ynca, and the celebrants remain protected, youthful, prosperous,
    or in divine hands.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the sacrifices, huaracas and chuspas are placed in the youths’ hands;
    the huaracas are presented as a sign of valor, and the youths are told to live
    henceforth as brave men.
  category: action
  evidence_refs:
  - ev:6
