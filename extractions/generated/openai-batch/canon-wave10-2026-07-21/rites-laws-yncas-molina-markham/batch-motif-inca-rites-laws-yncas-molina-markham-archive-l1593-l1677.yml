canonical_text:
  quote: Such was the ceremony for driving the sicknesses out of Cuzco.
  summary: The passage describes a Cuzco ceremony in which cries are relayed by named
    lineages and mitimaes from the city to rivers, where participants bathe and wash.
    The rivers are said to carry evils toward the sea. In Cuzco, people cry out, shake
    garments, invoke the Creator for another year, dance with the Ynca, bathe at dawn,
    handle straw torches, and use maize pudding called sancu or elba on faces, houses,
    fountains, kin, dead bodies, and divine statues. The day includes feasting, avoidance
    of anger and debt claims, and offerings connected with the Creator, Sun, and Thunder.
  language: English
  quote_policy: quoted
