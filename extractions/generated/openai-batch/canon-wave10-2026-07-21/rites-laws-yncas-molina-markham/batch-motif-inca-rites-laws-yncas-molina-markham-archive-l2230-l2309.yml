canonical_text:
  quote: ''
  summary: 'The passage describes preparations for Inca ritual months associated with
    huarachicu and Ccapac Raymi: mothers and kin prepare clothing and drink chicha;
    youths go to the Huanacauri huaca to sacrifice, ask permission for knighthood,
    keep vigil on its hill, fast, and later receive arms, ear-piercing, breeches,
    shoes, slings, shirts, mantles, and headgear. The passage also describes daily
    sacrifices by priests to major deities and Huanacauri, and food and chicha offerings
    to embalmed bodies based on belief in the soul''s immortality.'
  language: English
  quote_policy: summarized
