canonical_text:
  quote: ''
  summary: The passage reports a coca-and-stone practice ordered by a wizard; Manco
    Ccapac's old-age prayer for his son, remembrance of Tonapa, and offerings to the
    Creator seeking a sign; the absence of an answer in Coricancha; and social rites
    that admit youths as men and soldiers, mark girls as women, assign marriage and
    gendered implements, and select priests to call on the Creator.
  language: English with embedded Quechua ritual formulas and terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Soldiers are described as throwing coca pallets on a heap and bringing stones
    because a wizard had ordered the practice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Manco Ccapac was very old, he knelt and prayed for the prosperity of
    his son.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the prayer, Manco Ccapac is said to have remembered Tonapa.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Manco Ccapac watched for a sign from the Creator.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A very white lamb was offered on an altar in a sacrifice called arpay.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After no answer was given, Manco Ccapac ordered one of his sons, about eight
    years old, to be offered by cutting off his head and sprinkling the blood over
    fire so that the smoke might reach the Maker of heaven and earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that no answer was ever given to these offerings in Coricancha.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Itaripanaca admitted many youths aged seventeen to eighteen among the men
    and soldiers and gave them white breeches.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A line was marked to the high, distant hill called Huanacauri, where birds
    and animals were placed for the youths to run toward and display swiftness or
    sluggishness.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Swift youths received huorachicuy and ccamantiras, while sluggish youths received
    black breeches; after clothing was distributed, the youths sat with the men and
    were thereafter called men.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Parents came to the newly recognized men with presents, and Manco Ccapac ordered
    them to be given food and drink so that they might remain vassals of him and of
    his son, Sinchi Ruca.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: Girls of sixteen were ordered to comb and plait their hair, a practice called
    quicuchicuy, and to be shod with llanquisi so that they would be known as women
    or tasqui huarmi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Young men of thirty years were ordered to take wives; arms were given to the
    men, and cooking and spinning gear were given to the women.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Certain men of holy lives were selected as priests to call upon the name of
    the Creator of heaven and earth.
  category: action
  evidence_refs:
  - ev:8
