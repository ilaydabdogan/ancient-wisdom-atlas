canonical_text:
  quote: ''
  summary: The passage narrates Huascar Ynca's denunciation of assembled huacas, his
    oath and hostility toward huacas, idols, and sorcerers, the summoning and arraying
    of armies, a multi-day battle against the captains Quisquis and Challcuchima,
    their retreat to hills, the use of fire against them, and their night escape with
    reduced survivors.
  language: English translation with Quechua speech excerpt
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Forty huacas are said to be assembled, and the Ynca addresses them with insulting
    words.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After speaking, the Ynca takes an oath by shaking his mantle and kissing a
    little earth, and from then is described as an enemy of huacas, idols, and sorcerers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ynca sends messengers through Ttahuantin-suyu to summon vassals from distant
    regions, and a countless multitude assembles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: News arrives that Quisquis and Challcuchima are encamped; Huanca Auqui is
    ordered to attack, is defeated, and Huascar sends a very large army against the
    enemy force.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Huanca Auqui reports his reverses, reconciles with the Ynca, and Huascar marches
    from Cuzco with named chiefs, guards, vanguard forces, and supports.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The two armies occupy broad plains and hills; Huascar ascends a high hill
    near the Apurimac and views warriors with gold, silver, colored plumes, war songs,
    and instruments.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The battle continues over several days, with reported heavy casualties, dead
    bodies covering the plains, and blood described across the field.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Quisquis and Chalcuchima retreat to three high hills, entrench themselves,
    and are surrounded and assaulted by Huascar's forces.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the enemy withdraws to the highest grassy hill with groves at its base,
    an Indian of the Canas suggests setting the vegetation on fire; Huascar orders
    it, and wind-driven fire burns enemy men while Huascar's troops kill them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Quisquis and Challcuchima flee under cover of night; Huascar delays pursuit,
    and they reach Cochacassa with a reduced group of survivors.
  category: sequence
  evidence_refs:
  - ev:10
