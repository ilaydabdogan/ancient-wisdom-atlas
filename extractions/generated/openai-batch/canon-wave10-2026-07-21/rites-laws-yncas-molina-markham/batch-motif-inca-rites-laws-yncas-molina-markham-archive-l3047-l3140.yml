canonical_text:
  quote: ''
  summary: The passage describes an Inca accession-related sacrificial distribution
    from Cuzco to provincial huacas. All sacred places, including trees, fountains,
    hills, and lakes, receive assigned portions so none are angered. In Cuzco, sacrifices
    are first offered to the Creator, then to the Sun, Thunder, Moon, Heaven, and
    Earth. Children and other victims are killed, hearts and blood are offered to
    huacas, bodies are buried at Chuquicancha, and prayers seek the Ynca's health,
    peace, prosperity, and victory.
  language: English with Quechua prayer text and English translation
  quote_policy: summarized
