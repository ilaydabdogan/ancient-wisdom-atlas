canonical_text:
  quote: ''
  summary: The passage recounts a warning dream about the child Huayna Ccapac, the
    exposure and suppression of Apu Hualpaya's rebellion, and the later coronation-marriage
    of Huayna Ccapac with his sister Ccoya Mama Cusirimay. The ceremonies include
    citywide adornment, processions, entry into the Creator's temple, gold footwear
    and ornaments, prayer, delivery of royal insignia, and an oath touching the ground.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed uncle dreams about the child Huayna Ccapac, rises as if the dream
    were true, goes to Cuys Manco's house, and has councillors assembled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The councillors make the uncle repeat the dream three times and order measures
    including seizure of the governor's friends and watching the roads.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A trusted favourite of Apu Hualpaya confesses that many Indians laden with
    coca are on the roads with concealed arms, ready to rebel.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Five hundred loyal councillors sworn to defend the royal house take the ccapac-uancha
    standard from the temple and go to the governor with the infant Huayna Ccapac.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Apu Hualpaya is seized with his followers, beheaded, and supporters from the
    provinces are flogged.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After three years, preparations begin for Huayna Ccapac's coronation, and
    his sister Ccoya Mama Cusirimay is assigned as his wife according to ancestral
    custom.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the coronation day, walls and roofs are covered with rich feather plumes,
    streets are paved with golden pebbles, and people are richly dressed.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Huayna Ccapac and Mama Cusirimay proceed from separate royal buildings with
    regional curacas and attendants, and they are carried in litters.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The Ynca and his spouse enter the temple of the Creator Tachayachachi by separate
    doors, wear gold llanques, and are considered married after a prayer from the
    platform.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After three days, royal insignia and martial objects are delivered to the
    Ynca, including the tupac-yauri, suntur-paucar, ccapac-llautu, unincha, royal
    standard, club, shields, and headgear.
  category: object
  evidence_refs:
  - ev:8
  - ev:10
- id: obs:11
  text: The Ynca takes an oath, touches the ground, and promises to emulate his forefathers
    and attend to the things of Pachayachachi.
  category: action
  evidence_refs:
  - ev:9
