canonical_text:
  quote: "“No living things survived except a man and a woman who remained in a box”"
  summary: Molina introduces his account of Inca rites and reports a painted origin
    tradition preserved near Cuzco. In the account associated with Manco Ccapac, a
    deluge destroys living things, while a man and woman survive in a box and are
    carried to Huanaco/Tiahuanaco. The Creator then makes nations from clay, differentiates
    their dress, hair, languages, songs, seeds, and food, gives them life and soul,
    sends them under the earth, and orders them to emerge from caves, hills, fountains,
    and tree trunks.
  language: English
  quote_policy: quoted
