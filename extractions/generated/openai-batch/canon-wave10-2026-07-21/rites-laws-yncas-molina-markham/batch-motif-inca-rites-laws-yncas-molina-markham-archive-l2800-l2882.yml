canonical_text:
  quote: ''
  summary: The passage describes Inca festival rites in Cuzco involving a ritual cable
    coiled like a snake, reverences to huacas and the Ynca, sacrifices and prayers
    for rain and winter waters, drinking with huacas and dead bodies, preservation
    of sacrificial ashes, and a river rite in which offerings and ashes are carried
    away by released dammed water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ritual participants came to the square, made reverences to the huacas and
    the Ynca, moved in circles until forming a spiral-shell shape, and left the huascar
    cable coiled on the ground like a snake.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cable was called Moro-urco, and those in charge returned it to its house
    after the rite.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: During this feast participants wore named clothing and white plumes, and a
    lamb was brought to be sacrificed for the cable, for rain, and for winter time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The winter was addressed in speech with the question, "Why hast thou rained?"
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: From noon until sunset the participants rejoiced and drank with the huacas
    and dead bodies; the passage notes that chicha was poured down pipes in the usual
    manner of drinking to huacas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before sunset the huacas were returned to their temples, the Ynca returned
    to his house, and the taqui with sacrifices and drinking lasted two days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the eighteenth day, a priest burned a lamb as a sacrifice and prayed to
    winter to send waters so that people might eat and drink.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Cinders and ashes from this and other yearly sacrifices were preserved so
    they could be thrown into the river.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The taqui chapay quenalo and other yearly ceremonies are attributed to Pachacutec
    Inca Yupanqui, with named exceptions attributed to the first Ynca.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the nineteenth day the Ynca and people went to Huacaypata in Cuzco, brought
    out the huacas and embalmed bodies of the dead, and began the sacrifice called
    mojocati.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A small river called Capi-mayu and Huaca-puncu-mayu flowed through the center
    of Cuzco, and dams were built in ravines above the town to confine water so it
    would carry away sacrifices with greater force.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: Offerings collected for the river rite included foods, ajis, coca, cloths,
    shoes, llautus, plumes, sheep, flowers, gold, silver, and preserved ashes and
    cinders.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: The collected offerings were thrown into the river; the first dam was thrown
    down, and the rushing water carried the other dams and the sacrifices away.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Many people assembled on both sides of the river outside Cuzco at Pumap-chupa,
    where the sacrifices were offered.
  category: setting
  evidence_refs:
  - ev:11
