canonical_text:
  quote: ''
  summary: The passage narrates fighting between forces aligned with Huascar Ynca
    and Atahuallpa. Atahuallpa takes up arms, receives obedience from Quito, assumes
    the title of Ynca, and uses a litter. Commanders on both sides fight repeated
    battles; Atoc is captured and blinded, Huanca Auqui is repeatedly defeated, and
    a large battle at Bombon lasts three days. Huanca Auqui, Quis-quis, and Huascar
    each seek favorable answers from the huaca at Pachacamac or from huacas and idols.
    Huascar orders ritual specialists to offer sacrifices and divine, and a later
    battle occurs at the river Ancoyacu, where a Cuzco captain is defeated.
  language: English
  quote_policy: summarized
