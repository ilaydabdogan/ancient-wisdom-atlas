canonical_text:
  quote: ''
  summary: 'The passage describes Inca military expansion and the strategic strength
    of Cuzco, then reports origin and conquest claims: after a deluge, seven men and
    women emerged from the cave Paccari-tampu and spread through the world; provinces
    had analogous emergence shrines. It also recounts Pachacuti Ynca Yupanqui’s conflict
    with the Chancas, his mother’s dream concerning proper veneration of Pachayachachie
    rather than the Sun, promised sacrifices and heavenly reinforcements, and the
    later teaching that Cuzco was the home of the gods with many huacas.'
  language: English
  quote_policy: summarized
