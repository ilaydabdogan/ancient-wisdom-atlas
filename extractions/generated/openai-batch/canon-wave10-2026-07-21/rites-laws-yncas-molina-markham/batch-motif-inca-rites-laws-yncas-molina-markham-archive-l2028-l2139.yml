canonical_text:
  quote: ''
  summary: The passage gives several prayers for the Ynca and the Yncas, addressed
    to the Creator, the Sun, and the Huacas. The prayers ask for peace, victory, long
    life, multiplication of subjects, prosperous farms, and nearness to the Creator.
    It then describes a festival in which flocks are distributed, many sheep are killed
    and eaten, chicha made from boiled white maize is brought into the square, taquis
    and drinking continue for four days, and named days are dedicated to the Creator,
    Sun, Thunder, Moon, and Earth with sacrifices and prayers.
  language: English with Quechua liturgical text
  quote_policy: summarized
