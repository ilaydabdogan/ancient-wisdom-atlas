candidate_motifs:
- id: motif:1
  label: Dawn release of a condemned prisoner
  taxonomy_refs: []
  basis: Tonapa is bound, guarded, condemned to death, and visited by a youth at daybreak
    who touches the cords before the escape.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not explicitly state the cords break or vanish, only
    that the youth touches them and Tonapa subsequently leaves.
- id: motif:2
  label: Mantle functioning as a boat during water escape
  taxonomy_refs:
  - ark_vessel
  basis: Tonapa enters the lake with the youth, and his mantle bears him up on the
    water and serves in place of a boat.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The taxonomy reference is approximate; the passage describes a mantle
    used as a boat, not an ark or flood vessel.
- id: motif:3
  label: Rejected preaching followed by punitive petrification
  taxonomy_refs:
  - divine_judgment
  basis: The people of Tiyahuanacu do not listen to Tonapa's preaching; after he angrily
    denounces them and leaves, the dancers are turned into stones.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage presents punishment-like transformation but does not explicitly
    call Tonapa divine.
- id: motif:4
  label: Sacralized royal succession through Tonapa-associated objects
  taxonomy_refs:
  - royal_legitimacy
  basis: Tonapa's staff is delivered to Apu-tampu, turns to gold at Manco's birth,
    and is later carried by Manco along with golden cups from which Tonapa drank.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage does not explicitly formulate a theory of legitimacy; the
    motif is inferred from the royal figure's possession of sacred or ancestral objects.
- id: motif:5
  label: Birth omen involving transformation of a staff into gold
  taxonomy_refs:
  - sacred_birth
  - royal_legitimacy
  basis: The staff delivered by Tonapa turns into fine gold on the birth of Manco
    Ccapac Ynca.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: Only the staff's transformation is described; no further miraculous birth
    details are given in this passage.
- id: motif:6
  label: Departure to seek new lands with siblings
  taxonomy_refs:
  - departure
  basis: Manco agrees with his brothers to seek new lands and sets out with them toward
    the sunrise hill.
  evidence_refs:
  - ev:10
  - ev:12
  confidence: high
  cautions: The sibling group is larger than a pair, so sibling-pair taxonomy is not
    applied.
- id: motif:7
  label: Ascent to a high sunrise hill and reception of an omen
  taxonomy_refs:
  - ascent
  - royal_legitimacy
  basis: Manco travels toward the hill over which the sun rose, reaches the highest
    point, is surrounded by a double rainbow, and interprets it as a sign of prosperity
    and victory.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage describes a high hill rather than using a technical term for
    a mountain.
- id: motif:8
  label: Mythic itinerary across named landscape
  taxonomy_refs: []
  basis: Tonapa's route includes the lake, the rock Titicaca, Tiquina, Chacamarca,
