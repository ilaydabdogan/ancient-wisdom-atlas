canonical_text:
  quote: ''
  summary: 'Tonapa is imprisoned and freed at dawn by a beautiful youth, crossing
    a lake with his mantle serving as a boat. An idol or huaca connected with Carapuco
    is found mourning after being thrown down and destroyed. Tonapa travels through
    named places, preaches at Tiyahuanacu, and people who do not listen are turned
    into stones. The passage then turns to Apu Manco Ccapac Ynca: Tonapa''s staff
    turns to gold at Manco''s birth, Manco grows up orphaned, takes Tonapa-associated
    objects, departs with his siblings toward the sunrise, receives a double-rainbow
    omen on a high hill, and encounters a fierce man-like form.'
  language: English
  quote_policy: summarized
