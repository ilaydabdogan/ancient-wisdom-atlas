  summary: 'The passage is a prefatory title and set of notes for a narrative collected
    by Francisco de Avila about condemned rites, false gods, and ritual practices
    in the provinces of Huarochiri, Mama, and Chaclla. It identifies several named
    persons or objects: Chauca-chiipita, clothing associated with Masnu-yauri or Carhua-yalli,
    conopa stone idols, the Uncuraya jar with a figure of the Devil used in the feast
    of Massiima, and the idol Chdlcascayn.'
