canonical_text:
  quote: ''
  summary: 'The passage describes public and secret confession before sorcerers connected
    with huacas, divinatory testing of confession, and punishments for false confession.
    It lists matters confessed by the Yncas and people of Cuzco, including failures
    of reverence toward the Sun, Moon, and huacas, failure to celebrate Raymi feasts,
    sexual violations of Inca law, murder, theft, and murmurs against the Ynca or
    Sun. It briefly states that people before the flood, with all other things, were
    made by the Creator. It then begins an account of monthly rites: the year starts
    around mid-May on the first day of the moon; the first month, Uauca or Llusque,
    includes Yutip-Raymi, festivals of the Sun, with sacrifices of many named colors
    of sheep and lambs. At Curicancha, sheep are brought morning, noon, and night
    and carried around the huacas or idols of the Sun, the Creator, and Thunder; the
    Thunder huaca is described with gold ornaments. Priests pray to the Creator, Sun,
    and Thunder to remain forever young and to let all things be at peace.'
  language: English
  quote_policy: summarized
