canonical_text:
  quote: ''
  summary: The passage describes rules for preserving and managing flocks, burying
    diseased animals, shearing and distributing wool, producing cloth for the Ynca,
    religion, sacrifices, attendants, and storehouses, and assessing tribute through
    community labor rather than private property. It also discusses perceived injustices
    in colonial taxation of sheep and transport obligations, especially for mitimaes,
    and closes by describing ancient tribute as sowing, reaping, and carrying harvests
    for the Ynca and religion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Females were not to be killed, and animals belonging to the Ynca or to religion
    were not killed except for sacrifices.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A beast attacked by the disease described as earache was not to be fed or
    cured, but buried deep in the ground because the disease was considered infectious.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The community flock was shorn at the proper season, and the wool was divided
    among people according to what each required for himself, his wife, and children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some flocks of the Ynca and of religion were shorn, and cloth made from the
    wool was taken to Cuzco for use by the Ynca and for sacrifices.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cloth was also used to clothe attendants of the Ynca or was stored in magazines.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Workmen called cumpicos wove rich cloth in villages, and storehouses were
