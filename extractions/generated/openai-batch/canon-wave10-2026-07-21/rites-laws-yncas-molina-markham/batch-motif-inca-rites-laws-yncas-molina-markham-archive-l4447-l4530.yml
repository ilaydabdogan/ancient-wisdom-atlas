  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The infant's father searched for someone to interpret the incident; many named
    classes of sorcerers, diviners, necromancers, wizards, and witches assembled,
    but he publicly dismissed them.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: After Ynca Euca died, Yahuar-huaccac inherited sovereignty, became liberal
    and then impoverished, levied tribute, faced rebellion, dissimulated, and received
    presents from the quieted people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Yahuar-huaccac ordered prisons to be built outside the town so that he would
    not see criminals punished.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In old age Yahuar-huaccac began conquests and ordered plumed dresses and gold,
