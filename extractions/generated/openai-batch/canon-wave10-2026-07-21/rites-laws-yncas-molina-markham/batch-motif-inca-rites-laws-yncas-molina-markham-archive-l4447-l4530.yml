canonical_text:
  quote: ''
  summary: The passage recounts the birth festival of Yahuar-huaccac Ynca Yupanqui,
    including feather decorations, music, thanksgiving to the Creator, and the reported
    miracle that the infant wept blood. His father seeks interpretation from ritual
    specialists but dismisses the assembled sorcerers and diviners. The passage then
    summarizes Yahuar-huaccac's rule, rebellion against him, prison placement, military
    regalia, the birth and succession of Uira-ccocha Ynca Yupanqui, and Uira-ccocha's
    marriage and coronation, where Chuchi-ccapac of the Hatun-Collas arrives with
    an adorned huaca and contrasts Cuzco and Colla lordship, gold and silver thrones,
    and worship of Uira-ccocha-Pachayachachi and the Sun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Yahuar-huaccac Ynca Yupanqui's birth there was a grand feast with feather
    arches, Curicancha covered in plumes, eight drums, ritual songs, and thanksgiving
    to the Creator.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: While people were singing in Huacay-pata, the infant reportedly wept blood;
