canonical_text:
  quote: ''
  summary: The passage recounts the Spanish encounter with Atahuallpa, the naming
    of Spaniards as Uiracocha, Atahuallpa's order to kill Huascar and his own baptism
    and execution, the journey of Francisco Pizarro and Friar Vicente toward Cuzco,
    Manco Ynca Yupanqui's reception and investiture with royal clothing and insignia,
    the formal entry into Cuzco, and Friar Vicente's preaching and baptisms at the
    Ccuricancha.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A large number of men were killed after the Spanish encounter involving Friar
    Vicente de Valverde, and the people thought the Spaniards were messengers of Pachayachachic
    Uiracocha; when the Spaniards fired guns, the gunfire was supposed to be Uiracocha.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: While Atahuallpa was in prison, a cock crowed; Atahuallpa said that even the
    birds knew his name, and the Spaniards were thereafter called Uiracocha while
    the cock was called Atahuallpa.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Spaniards were said to have told Atahuallpa that they brought the law
    of God.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Atahuallpa sent orders to Antamarca that Huascar should be killed and then
    pretended sadness before Francisco Pizarro.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Huascar Ynca was killed in Antamarca with his son, wife, and mother by order
    of Atahuallpa.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Atahuallpa was baptized and named Don Francisco, and afterward was put to
    death as a traitor.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Francisco Pizarro and Friar Vicente set out for Cuzco, taking a bastard son
    of Huayna Ccapac as Ynca; that man died in the valley of Xauxa.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the bridge of the Apurimac, Manco Ynca Yupanqui and Curacas met Pizarro
    and came to offer obedience and become Christians.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Sacsahuana, Friar Vicente and Francisco Pizarro asked Manco Ynca Yupanqui
    to show them the dresses of Huayna Ccapac, his father; after seeing them, Pizarro
    put richer dresses on Manco in the name of the Emperor.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Manco Ynca Yupanqui was borne toward Cuzco in a litter.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The party entered Cuzco with pomp; Pizarro represented Emperor Charles V,
    Friar Vicente personified the Pope, and Manco Ynca Yupanqui appeared with a feather-lined
    litter, sumptuous clothes, the suntur-pauqar, and the ccapac unancha.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Friar Vicente went to the Ccuricancha, described as a house erected by the
    ancient Yncas in honor of the Creator, and preached and baptized Curacas through
    an interpreter.
  category: action
  evidence_refs:
  - ev:7
