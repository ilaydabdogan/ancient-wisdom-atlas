candidate_motifs:
- id: motif:1
  label: royal succession legitimized through martial display and temple rite
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage links staged skirmishes, appointments of son and grandson, a
    mock battle, triumphal prayer at Ccuricancha, ordered seating with royal regalia,
    and transfer of administration.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage describes ritualized political action but does not explicitly
    explain its ideological meaning beyond the events narrated.
- id: motif:2
  label: mock conquest with symbolic blood treatment
  taxonomy_refs: []
  basis: The battle is explicitly called a representation or comedy; the conquered
    Cayambis and Pastus have their heads treated with llama blood and set on lances.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The text is not fully clear whether all actions are theatrical representation
    or whether any actual killing occurred in this scene.
- id: motif:3
  label: funerary retainers killed for service in the other life
  taxonomy_refs:
  - sacrifice
  basis: Old captains and pages are made drunk, put to death, and buried with Pachacuti
    because he is said to need them in the other life.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage reports the practice through the narrator's phrasing, including
    'it was said,' so the stated rationale is reported tradition.
- id: motif:4
  label: royal dead preserved and arranged as an ordered ancestral group
  taxonomy_refs:
  - royal_legitimacy
  basis: Pachacuti's body is placed in the house of dead bodies with embalmed Yncas
    and wives, each arranged in order in a recess.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The connection to royal legitimacy is inferred from ordered royal preservation;
    the passage itself only states the placement and arrangement.
- id: motif:5
  label: mourning redistribution to the poor
  taxonomy_refs:
  - sacred_exchange
  basis: At Pachacuti's death, food, wool, and clothing are distributed among the
    poor throughout the kingdom; the passage also notes a prior order that villages
    supply food for the poor.
  evidence_refs:
  - ev:1
  - ev:10
  confidence: medium
  cautions: The passage presents redistribution as royal or funerary action, but does
    not explicitly frame it as sacred exchange.
- id: motif:6
  label: rebellion following death of a ruler
  taxonomy_refs: []
  basis: The passage states that on Pachacuti's death several provinces rebel and
    Tupac Ynca Yupanqui assembles an army.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: This is a political sequence rather than a clearly mythic motif.
