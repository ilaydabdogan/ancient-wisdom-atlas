  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After breakfast and another performance of the huari taqui, fathers and parents
    flogged the youths and urged them to emulate ancestors and be valiant warriors.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage explains that, when Manco Ccapac came forth from the Cave of Tampu,
