canonical_text:
  quote: ''
  summary: 'The passage describes part of an Inca youth-knighting rite: participants
    worship at the Cuzco square, travel to and ascend Raurana hill, perform sacrifices
    and prayers at the Raurana huaca, receive clothing and insignia, undergo admonitory
    flogging, hear an explanation that the ritual taqui was given by the Creator to
    Manco Ccapac, and return to Cuzco to honor huacas and embalmed royal ancestors.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Cuzco square called Huaccty-pata, statues of the Creator, the Sun,
    the Thunder, and the Moon were present, and the Ynca sat near the statue of the
    Sun with his courtiers.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Entrants performed mucha to the huacas and the Ynca; Hanan Cuzco and Hurin
    Cuzco sat in assigned places while youths remained standing briefly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The taqui called huari was performed again, and the youths were flogged again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The youths, their fathers, and relations went to Raurana, spent the night
    at the foot of the hill, and ascended it at dawn.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Lord Ynca came to Raurana to grant favors and marks of distinction to
    the youths who had been armed as knights.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The huaca of Raurana consisted of two stone falcons placed on an altar at
    the summit of the hill.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Pachacutec Ynca Yupanqui instituted Raurana as the place where the youths
    should receive huara, and Huascar Ynca caused the falcons to be brought there.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The sacrifice at Raurana involved burning five lambs and pouring out chicha
    while beseeching the Creator, the Sun, the Moon, and the Thunder for the youths'
    valor, prosperity, and freedom from defeat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Priest of the huaca Raurana performed the sacrifice and also petitioned
