canonical_text:
  quote: ''
  summary: 'The passage describes part of an Inca knighting rite near Cuzco: newly
    armed youths, maidens, kin, priests, huacas, royal insignia, chicha, staves, wool
    offerings, animal sacrifices, flogging, dance-song, a strenuous race at Anahuarqui,
    and an ordered return toward Cuzco.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party sleeps in a desert called Haurani or Haurana, about a league from
    Cuzco.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those armed as knights bring tents for themselves and their relations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Maidens called Nusta-calli-sapa accompany the knights and bring small jars
    of chicha for drinking and for sacrifice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A sheep called tupa-huanacu or raymi-napa is brought with a red shirt and
    golden ears, and the suntur-paucar royal insignia is also carried.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: After the people leave the square, each huaca is carried back to its temple,
    and the Ynca returns to his palace.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: The next day the group goes to a ravine in the mountain Quilli-yacolca, fastens
    white wool to staves, secures ychu to topa-yauri handles, and continues toward
    Anahuarqui.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The hill Anahuarqui has a huaca on its summit associated with the villages
    of Choco and Cachona.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:8
  text: The passage says a tradition from the time of the deluge held that the huaca
    of Anahuarqui ran like a lion.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:9
  text: Before the huaca, the youths offer wool, and Tarpuntay priests sacrifice five
    lambs by burning them in the names of the Creator, the Sun, the Moon, and the
    Thunder.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Relations flog the newly knighted youths and urge them to value bodily valour
    and endurance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The people perform a taqui called haurita with huayllaquipas and shells while
    the knights stand holding yauri staves, some headed with gold and others with
    copper.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Nusta-calli-sapa maidens run back to the sleeping place, wait with chicha,
    and call for the youths to come quickly.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The youthful knights line up before the huaca, with arm-bearers behind them
    and another row to aid those who fall; a gaily dressed Indian gives the word to
    start the race.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The runners go at full speed; those who fall or faint are assisted, some die
    from falls, and those reaching the goal receive drink from the maidens.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The stated object of the race is to prove who is the best among those who
    have received knighthood.
  category: other
  evidence_refs:
  - ev:5
- id: obs:16
  text: On each occasion more than eight hundred knights are armed; later they again
    perform the huari taqui, flog the knights on arms and legs, and return toward
    Cuzco with the royal insignia and raymi-napa sheep in front.
  category: sequence
  evidence_refs:
  - ev:6
