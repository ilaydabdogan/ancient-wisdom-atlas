canonical_text:
  quote: ''
  summary: 'The passage opens with a Christian profession of belief in the triune
    creator God, Adam as first ancestor, the incarnation of Christ through the Virgin
    Mary, Christ''s death, descent, resurrection, ascension, and sending of the Holy
    Spirit. It then introduces traditions heard from native testimony: in the Purun-pacha
    or early/dark time, peoples of Ttahuantin-suyu migrated from beyond Potosi, settled
    districts, became crowded, built fortresses, and fought continually. At midnight
    the Hapi-nimos were heard departing with cries of defeat. The passage explicitly
    interprets this as devils being conquered by Christ on the cross at Mount Calvary,
    and describes the Hapi-nimus as visible night beings who carried off men, women,
    and children. It closes with the beginning of a notice that, after these devils
    were driven out, a bearded man arrived in Ttahuantin-suyu.'
  language: English
  quote_policy: summarized
