canonical_text:
  quote: ''
  summary: The passage opens the account with Don Juan de Santa Cruz Pachacuti-yamqui
    Salcamayhua identifying himself as a Christian native of specific Andean towns
    and listing his legitimate descent from named chiefly ancestors. He states that
    some ancestors were among the first chiefs to be made Christians at Caxamarca,
    renounced former rites and ceremonies, were instructed and baptized by apostolic
    priests, rejected the Devil and old idolatries, persecuted wizards, destroyed
    huacas and idols, denounced idolaters, and received divine preservation and blessing.
    He presents himself as a baptized descendant who remains firm in the Catholic
    faith and exhorts his family to Christian observance.
  language: English
  quote_policy: summarized
