canonical_text:
  quote: ''
  summary: The passage recounts the birth of Ynca Ruca, the use and later veneration
    of water associated with Tonapa at Titicaca, regional accounts of Tonapa as an
    old wise man who banished huacas and demons to snowy mountains, the preservation
    of Tonapa's house and stones linked to a transformed female huaca, Ccapac Yupanqui's
    encounters with huacas, and Ynca Ruca's succession and reign marked by dancing
    and increased huaca worship.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ccapac Yupanqui and his wife Mama Gorillpay-cahua had a son named Ynca Ruca,
    and his birth was marked by much festivity.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men were sent to the place called Titicaca, where Tonapa was said to have
    arrived, and water from there was brought to pour over the infant Ynca Ruca while
    praises of Tonapa were celebrated.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The water was associated with a spring on top of rocks and a basin called
    ccapacchama quispisutuc unu; later Yncas brought the water in a bowl called curi-ccacca
    and honored it in the square of Cuzco called Huacay-pata or Cusi-pata.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Curacas of Asillu and Hucuru described Tonapa Vihinquira as a poor, thin,
    old man with a beard, long hair, and a long shirt, and as a wise councillor in
    affairs of state.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tonapa was said to have banished idols, huacas, and hapi-nunu demons to snowy
    mountains, including named mountains such as Asancata, Quiyancatay, Sallcatay,
    and Apitosiray.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Huanca representatives said Tonapa Varivillca had been in their land, made
    a house there, and banished huacas and hapi-nunus of Hatun Sausa Huanca to snowy
    mountains in Pariacaca and Vallollo.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Before their banishment, the idols were said to have harmed the people and
    menaced Curacas to make them offer human sacrifices.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Ynca ordered that Tonapa's house be preserved; it was located at the foot
    of a small hill near the river on the road into Xauxa from Cuzco.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Near Tonapa's house were two stones where Tonapa was said to have turned a
    female huaca into stone for having fornicated with a man of the Huancas; later
    the stones declared themselves huacanqui coycoylla.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ccapac Yupanqui began building the fortress of Sacsahuaman, encountered several
    named huacas while extending his territory, lamented the number of false gods,
    and returned to Cuzco without further harming the huacas.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After Ccapac Yupanqui died, Ynca Ruca succeeded him, received named regalia,
    was associated with fine cloth and dancing, and during his time idolatrous rites
    and huaca worship increased.
  category: sequence
  evidence_refs:
  - ev:8
