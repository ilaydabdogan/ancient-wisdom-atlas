canonical_text:
  quote: ''
  summary: The passage describes an Inca feast or rite in which embalmed bodies of
    former lords and ladies, huaca figures, and images of the Creator, Sun, and Thunder
    are washed, warmed, adorned, brought into the great square of Cuzco, seated on
    gold benches, reverenced by ranked lineages, and honored with feasting, music,
    prayer, and a chicha offering poured into a gold-plated urn.
  language: English
  quote_policy: summarized
