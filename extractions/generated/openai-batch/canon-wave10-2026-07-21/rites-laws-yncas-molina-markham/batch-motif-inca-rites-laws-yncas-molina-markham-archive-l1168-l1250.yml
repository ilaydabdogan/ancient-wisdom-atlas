  summary: The passage describes an unnamed Ynca ordering conquered peoples to venerate
    and sacrifice to huacas, worship thunder, and maintain temples and ritual estates.
    It then lists several classes of ritual specialists and sorcerers who obtain answers
    or foretell events through animal sacrifice, fire, maize and dung lots, thunder-derived
    healing knowledge, herbal instruction, and a fire-and-tube oracle associated with
    the Yacarcaes of Huaro.
