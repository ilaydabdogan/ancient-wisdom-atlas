canonical_text:
  quote: ''
  summary: The passage reports a return by Indians from Catholic practice to earlier
    idolatries, suspicion that wizards kept by the Yncas in Uiscacabamba were involved,
    and a rumor that Spaniards killed Indians to extract an ointment from their bodies.
    It then describes beliefs that burnt and destroyed huacas had come back to life,
    divided into two groups joined to Pachacama and Titicaca, formed in the air for
    battle against God, and reversed the earlier conquest by God and the Spaniards.
    The passage ends with a belief that God and the Spaniards were conquered, Spaniards
    and their cities destroyed, and the sea would rise to consume them.
  language: English
  quote_policy: summarized
