canonical_text:
  quote: ''
  summary: The passage describes acts attributed to Manco Ccapac, including conquest,
    construction at his birthplace with three named windows, ancestral trees representing
    his parents, administrative distinctions among villages, the selection of pacariscas
    or origins by lineages, demonic deception at false pacariscas, infant head-pressing,
    succession by Sinchi Ruca Ynca, and the establishment of stone heaps called apachitas
    after a wizard's instruction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ruler conquered Tocay Ccapac, who is described as a great idolater.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the place of his birth, the ruler ordered a masonry wall with three named
    windows, treated as emblems of the house of his fathers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two trees typified Apu-tampu and Apachamama-achi, the ruler's father and mother,
    and were adorned with roots of gold and silver and golden fruit.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The explanation of the two trees states that the Yncas proceeded from the
    parents like fruit from trees, and that the trees were as roots and stems of the
    Yncas.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ruler ordered the dress of each village to be different so that people
    could be identified by village or tribe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tribes and lineages were ordered to choose whence they were descended and
    came, and selected pacariscas such as a lake, spring, rock, hills, or ravines.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The passage says devils or hapi-munus entered false pacariscas and made deceitful
    promises.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The stated cause for inventing the pacarimun was that Manco Ccapac was often
    unable to know to what village an Indian belonged.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Manco Ccapac ordered infant heads to be pressed so that the children would
    grow up foolish and without energy, because he feared audacious people might become
    disobedient.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Sinchi Ruca Ynca, the legitimate son, inherited all his father's dominions,
    while younger sons were called Chima-panaca-ayllu.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sinchi Ruca Ynca ruled the inherited territory and is described as a patron
    of agriculture, cloth weaving, and mining, while not being much addicted to warlike
    affairs.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: For conquests, Sinchi Ruca sent captains and men; in each ravine they took
    stones to make heaps called usnus.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: An Indian wizard appeared to an officer of war and said the heaps must be
