  quote: ''
  summary: The passage recounts a body buried in a hollowed tree whose fruit yields
    villca medicine, followed by Pachacuti Ynca Yupanqui's campaigns, his adoption
    of Yamqui-Pachacuti's name, the destruction or capture of huacas and idols, submissions
    by peoples and chiefs, gifts and rewards, wealth obtained on the coast, terrifying
    hail and thunder at Pachacamac, and two springs flowing with chicha found while
    soldiers were thirsty.
  language: English
  quote_policy: summarized
