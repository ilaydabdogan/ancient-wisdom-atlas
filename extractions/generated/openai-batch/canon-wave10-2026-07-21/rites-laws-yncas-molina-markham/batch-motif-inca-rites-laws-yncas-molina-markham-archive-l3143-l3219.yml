canonical_text:
  quote: ''
  summary: The passage describes sacrifices placed in Chiqui-cancha; offerings by
    priests of the principal huaca Yanacauri, associated with Ayar-cachi and Huanacauri;
    prayers for the Ynca's youth, victory, health, and peace; Ccapac-cocha sacrificial
    processions sent from Cuzco across ravines and hills to huacas throughout the
    empire; child sacrifice at chief huacas; and administrative accounting of huacas
    and offerings by Vilcacamayoc or Quipucamayoc officials.
  language: English
  quote_policy: summarized
