  quote: ''
  summary: 'The introduction describes Molina''s report on Inca fables and rites as
    a detailed account of ceremonies through the Inca year, including prayers, sacrifices,
    and festivities. It then identifies a key topic: the position of the Supreme Being
    or Creator in Inca religion, citing Garcilasso''s statement that the Incas worshipped
    both the Sun and a higher Creator called Pachacamac, understood as the animator
    of the universe, venerated inwardly but without temples.'
