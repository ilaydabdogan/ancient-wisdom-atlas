candidate_motifs:
- id: motif:1
  label: Ritual legitimation of a new ruler
  taxonomy_refs:
  - royal_legitimacy
  basis: The new sovereign is protected by prayer to the Creator, acclaimed by those
    present, and receives formal promises of obedience from chiefs and captains at
    the ccapae-usnu.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives the ritual sequence but does not explain its full theological
    meaning.
- id: motif:2
  label: Royal marriage and contested sister union
  taxonomy_refs:
  - sacred_marriage
  basis: The passage contrasts more elaborate ceremonies for the first wife with a
    later marriage and describes Huayna Ccapac’s failed attempt to marry his second
    sister.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: low
  cautions: The text does not explicitly state a sacred or cosmological meaning for
    the marriages; the motif assignment is based only on royal marriage ritual context.
- id: motif:3
  label: Omen blocks a ruler’s intended act
  taxonomy_refs:
  - divine_judgment
  basis: After Huayna Ccapac petitions his father’s body for approval to marry Mama
    Cuca, the dead body gives no answer and fearful heavenly signs appear, causing
    him to abandon the plan.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage calls the signs fearful and blood-portending but does not
    explicitly identify the sender of the signs.
- id: motif:4
  label: Offerings and commanded transfer of riches to a sacred recipient
  taxonomy_refs:
  - sacred_exchange
  basis: Huayna Ccapac brings presents and offerings to his father’s body, and later
    the Pachacamac huaca commands him to take riches to Chimu and give special honor.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: medium
  cautions: The two exchanges occur in different scenes and are not explicitly linked
    by the passage.
- id: motif:5
  label: Oracle privately instructs the ruler
  taxonomy_refs:
  - wisdom
  basis: The huaca of Pachacamac requests to see the Ynca and speaks to him alone
    with instructions about riches and honor.
  evidence_refs:
  - ev:7
  confidence: low
  cautions: The passage presents an oracle command, not a broader wisdom teaching.
comparison_claims:
- id: claim:1
  claim: 'The accession episode has the same function as a royal-legitimacy pattern:
    prayer, acclamation, and elite obedience publicly confirm the new sovereign.'
  claim_level: same_function
  target: royal_legitimacy motif family
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: This is a functional classification only; no historical comparison
    beyond the supplied passage is asserted.
- id: claim:2
  claim: The Pachacamac episode has the same function as an oracle-command pattern
    in which a sacred speaker privately directs a ruler’s ritual or political action.
  claim_level: same_function
  target: oracle-directed rulership pattern
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The available taxonomy does not include a specific oracle motif, and
    the passage does not provide a wider comparative frame.
- id: claim:3
  claim: The silent dead father and blood-portending heavenly signs can be cautiously
    compared to a divine-judgment or omen pattern in which a ruler’s intended action
    is checked by supernatural signs.
  claim_level: same_function
  target: divine_judgment motif family
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not explicitly name the signs as divine judgment,
    so the comparison remains cautious.
