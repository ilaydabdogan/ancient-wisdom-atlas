canonical_text:
  quote: ''
  summary: The passage describes Huayna Ccapac’s accession rites, prayers to the Creator,
    public obedience by chiefs, royal family relations and marriages, an attempted
    forced marriage to his sister and ominous heavenly signs, military preparations
    against Quito and the Cayambis, the Ccapac Raymi festival at Villcas, an oracle
    of Pachacamac commanding honor and riches for Chimu, and an engineering order
    to bring river water through a mountain into Tumipampa.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prayer is addressed to the Creator for the protection of the Ynca, followed
    by public acclamations and praise of Pachayachachi Uiracochan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Huacaypata, where the Ynca’s ccapae-usnu is located, chiefs and captains
    promise obedience to the new sovereign in order.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Huayna Ccapac is described as affable and knightly, and Ccoya Mama Cusirimay
    as beautiful.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage lists several sons of Huayna Ccapac and names their mothers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Huayna Ccapac seeks to marry his second sister Mama Cuca; she refuses, he
    ill-treats her and begins to use force, and he desists after her prayers and threats.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Huayna Ccapac takes presents and offerings to his father’s body and prays
    for approval of the marriage, but the dead body gives no answer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fearful signs appear in the heavens, described as portending blood and called
    Ccalla-sana.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Huayna Ccapac gives Mama Cuca to the old Curaca Hacaroca to shame her; she
    leaves him, enters the house of the Acllas, and becomes abbess without submitting
    to Hacaroca.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Huayna Ccapac marries Ccoya Chimpu Runtucay as a second wife, but with fewer
    ceremonies than with his first wife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Huayna Ccapac sets out toward Colla-suyu to assemble an army for a campaign
    against Quito and the Cayambis after reports of rebellion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At Puma-cancha the chiefs and army assemble; the Ynca distributes clothes,
    arms, and provisions, chiefs take oaths, and generals are appointed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The festival of Ccapac Raymi is celebrated at Villcas, where there is another
    plate of gold, and the chiefs remember the forgotten statute of Huayna Ccapac.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Messengers from Rimac report that the huaca in the Ccuricancha of Pachacamac
    desires to see the Ynca.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The huaca speaks to the Ynca alone, telling him to take riches to Chimu and
    honor him more than Uiracochan Pachayachachi; the Ynca consents and the wizards
    rejoice.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: At Tumipampa, the Ynca orders river water to be brought by boring through
    a mountain and directing a curving channel into the city.
  category: action
  evidence_refs:
  - ev:8
