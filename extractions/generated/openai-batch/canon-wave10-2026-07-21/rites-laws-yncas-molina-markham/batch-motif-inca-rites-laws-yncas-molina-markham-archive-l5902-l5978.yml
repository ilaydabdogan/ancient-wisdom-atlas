canonical_text:
  quote: '"She took it and ate it with much delight, and by it she was made pregnant
    without other contact with man."'
  summary: The passage tells how Coniraya, after performing acts involving irrigation
    and deceits concerning huacas, encounters Cavillaca, a beautiful virgin huaca.
    He changes into a bird, places his seed in the form of a ripe lucma fruit, and
    causes Cavillaca to eat it, making her pregnant while she remains a virgin. After
    a year she gathers the huacas and idols to identify the child's father. The child
    crawls to Coniraya, who is seated in beggar's rags. Cavillaca is ashamed, flees
    toward the seashore with the child, and Coniraya puts on golden robes and pursues
    her.
  language: English
