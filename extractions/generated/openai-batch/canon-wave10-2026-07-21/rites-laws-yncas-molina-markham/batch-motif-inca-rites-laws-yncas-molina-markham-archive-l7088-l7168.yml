canonical_text:
  quote: they ate and drank at the cost of the Ynca and of the Sun
  summary: 'Polo de Ondegardo describes Inca tribute administration: storehouses,
    agricultural labor for lands assigned to the Ynca and religion, ritualized communal
    work with exemptions, coca and flock tribute, and legal disputes over whether
    lands and flocks belonged to the Ynca, the Sun, or the people.'
  language: English
  quote_policy: quoted
