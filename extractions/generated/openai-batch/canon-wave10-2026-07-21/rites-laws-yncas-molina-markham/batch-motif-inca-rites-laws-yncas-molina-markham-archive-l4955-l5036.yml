canonical_text:
  quote: ''
  summary: 'The passage recounts military episodes under Tupac Ynca Yupanqui: a Quichua
    army carrying a huaca is defeated by the Collas; the Ynca besieges Llallahua-pucara,
    where the Collas sacrifice children and guinea pigs to the sun and receive an
    encouraging answer; defeated Colla chiefs and huacas are humiliated and thrown
    into Lake Urcos; the Ynca commemorates the wars with gold and silver darts. It
    then describes a later Andes campaign, including an all-women province, a difficult
    river crossing enabled by monkeys securing ropes, battles against the Escay-oyas,
    and the withdrawal of some troops after news about a banished captain.'
  language: English
  quote_policy: summarized
