canonical_text:
  quote: ''
  summary: The passage describes an Inca ruler reasoning that the Sun cannot be the
    ultimate creator because it moves, is obscured by clouds, and does not rest; he
    identifies a higher creator, Pacha-Yachachi, and establishes temples, statues,
    endowments, and sacrifices. It then recounts a fable in which Ynca Yupanqui, while
    traveling to visit his father Viracocha Ynca, sees a crystal fall into a fountain.
    Within it appears a richly adorned figure with solar rays, serpents, royal insignia,
    and lions. The apparition calls him son, identifies itself as the Sun his father,
    foretells his conquests, and commands reverence and sacrifices. The crystal remains
    and later serves him as a visionary object; he orders a statue of the Sun and
    widespread temples to the new deity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Inca ruler reflects on ancestral reverence for the Sun and argues that
    the Sun cannot be the creator because it moves daily, can be obscured by a cloud,
    and does not rest or illuminate the world from one place.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ruler concludes that someone directs the Sun and identifies this being
    as Pacha-Yachachi, the creator.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: He orders the houses and temple of Quisuar-cancha to be made and raises there
    a golden statue of the creator, shaped like a standing man or boy with the right
    arm raised and hand almost closed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the Yncas had previous knowledge of a creator and offered
    sacrifices to him, but that this creator received greater veneration after this
    Inca ordered provincial temples, flocks, servants, farms, and estates to provide
    sacrifices.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The same Inca is credited with making the house of the Sun at Cuzco sumptuous,
    whereas before it had been small and poor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before succeeding, Ynca Yupanqui travels to visit his father Viracocha Ynca
    at Sacsahuana and comes to the fountain called Susur-puquio.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the fountain he sees a piece of crystal fall into it and sees within the
    crystal the figure of an Indian.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The figure in the crystal has three brilliant rays like those of the Sun from
    the back of its head, serpents twined around its arms, a royal fringe, bored ears
    with ear-pieces, Inca clothing, lions positioned between the legs and over the
    shoulders, and another serpent over the shoulders.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ynca Yupanqui flees when he sees the figure, but the apparition calls him
    by name from within the fountain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The apparition tells Ynca Yupanqui not to fear, calls him son, identifies
    itself as the Sun his father, foretells that he will conquer many nations, and
    commands him to pay reverence and remember the Sun in sacrifices.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the apparition vanishes, the crystal remains; Ynca Yupanqui preserves
    it and later sees everything he wants in it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When he becomes lord, Ynca Yupanqui orders a statue of the Sun to be made
    resembling the figure seen in the crystal and commands provincial temple-building
    and worship of the new deity.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A note states that Quisuar is the name of a tree, that cancha means place,
    and that an ancient wall with carved serpents remained at the Quisuar-cancha site.
  category: other
  evidence_refs:
  - ev:8
