canonical_text:
  quote: ''
  summary: 'The passage describes the close of the Ccapac-raymi festival with a procession
    of the Sun statue to a hill shrine and sacrifices to major deities. It then describes
    December rites: a contest between newly armed youths of Hanan Cuzco and Hurin
    Cuzco, the Ynca restoring order, initiates ending a fast, huacas and dead Yncas
    being brought to drink and receive food, beliefs about immortal souls and afterlife
    reward or punishment, subsequent dancing, ploughing, full-moon all-night dance,
    and a morning rite involving huacas, dead bodies, the Ynca near the Sun, and a
    four-coloured cable held by men and women.'
  language: English
  quote_policy: summarized
