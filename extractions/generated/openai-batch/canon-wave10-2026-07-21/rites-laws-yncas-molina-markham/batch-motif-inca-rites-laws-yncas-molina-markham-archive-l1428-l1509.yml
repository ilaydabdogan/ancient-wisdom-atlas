canonical_text:
  quote: ''
  summary: The passage describes several monthly Inca rites. A festival with the Huayllina
    song worships the Creator and displays richly clothed female figures, gold and
    silver sheep figures, and feather ornaments before the Ynca proceeds to uacay-pata.
    June is devoted to irrigation and distribution of channel water. In July, during
    the sowing month, priests and households fast until maize emerges; common people
    sing and dance yahuayra prayers for a prosperous year; priests sacrifice animals
    and ritual materials to the Creator, Sun, and Thunder for harvest, warmth, water,
    and protection from hail. The opening of August describes the Situa, for which
    huaca figures from across the land are brought to Cuzco.
  language: English
  quote_policy: summarized
