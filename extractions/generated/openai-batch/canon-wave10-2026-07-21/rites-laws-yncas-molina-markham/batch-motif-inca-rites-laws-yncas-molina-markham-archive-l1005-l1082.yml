canonical_text:
  quote: ''
  summary: The passage recounts the end of a Cañari origin tale in which two guacamayos
    with women’s faces prepare food for two brothers, are trapped on a later return,
    and one becomes the progenitor of children from whom the Cañaris are said to descend;
    the hill and guacamayos are thereafter venerated. It then gives an Ancasmarca
    flood tale in which sheep read the stars, warn a shepherd that water will destroy
    the world, and the shepherd’s family survives on a mountain that rises with the
    flood, after which six children repopulate the province. The passage closes with
    comments on quipus as knotted-string records and on Ynca Yupanqui’s ordering of
    months and ceremonies.
  language: English
  quote_policy: summarized
