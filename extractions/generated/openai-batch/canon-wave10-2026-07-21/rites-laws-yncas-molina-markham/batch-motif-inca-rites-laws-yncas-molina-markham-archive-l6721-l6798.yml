canonical_text:
  quote: ''
  summary: Pariacaca encounters Choque-suso grieving over maize fields without water.
    He releases water and later constructs a larger irrigation channel with the labor
    of animals. A fox first serves as engineer but is distracted by a partridge and
    is replaced by a snake, explaining a defect in the channel. After Pariacaca and
    Choque-suso unite at Yanacaca, she remains at the channel head and is turned into
    stone at Cocochalla.
  language: English
  quote_policy: summarized
