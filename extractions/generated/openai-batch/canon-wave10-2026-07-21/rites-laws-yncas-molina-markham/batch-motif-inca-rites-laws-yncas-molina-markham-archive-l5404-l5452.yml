canonical_text:
  quote: ''
  summary: 'The passage recounts Cusi Huallpa’s garden at Sappi, a gold serpent-link
    chain later said to have been thrown into the lake of Molina, and several actions
    of Huascar Ynca: executions of captains, setting up and worshipping a golden sun
    image at Titicaca, public abuse of Acllas, granting and then reacting violently
    to Atahuallpa’s Quito title, burning gifts, and killing or humiliating messengers.'
  language: English
  quote_policy: summarized
