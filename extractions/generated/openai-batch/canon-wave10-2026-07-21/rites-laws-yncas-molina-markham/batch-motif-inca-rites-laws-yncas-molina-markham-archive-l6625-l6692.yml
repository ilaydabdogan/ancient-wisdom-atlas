canonical_text:
  quote: ''
  summary: Pariacaca, said to have come forth from five eggs with four brothers, travels
    toward Caruyuchu Huayallo. On the road he enters a festival village in the dress
    of a poor man and is ignored by the drinking inhabitants. A girl gives him chicha
    in a white calabash. Pariacaca thanks her, warns that the village will be destroyed
    in five days because of its neglect, and tells her to flee with her children without
    revealing the secret. She leaves with her relatives. Pariacaca ascends the mountain
    Matro-coto, and rain, hail, and colored stones carry the village away into the
    sea, leaving no inhabitants alive.
  language: English
  quote_policy: summarized
