canonical_text:
  quote: ''
  summary: 'The passage describes the Situa-related feast at Cuzco: subdued nations
    arrive with their huacas and costumes; priests carry the huacas on litters; participants
    reverence the Creator, Sun, Thunder, Huanacauri, and the Ynca; the High Priest
    of the Sun sprinkles sancu with blood; chiefs recite a prayer to the Creator;
    sacrifices are eaten and burned; nations dance according to their customs; formerly
    expelled deformed persons are admitted; visiting groups receive permission and
    rewards before returning; Ynca Yupanqui is credited with establishing the order
    of ceremonies, and similar celebrations occur in provincial centers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nations subdued by the Yncas came with their huacas and with rich costumes
    particular to their countries; priests responsible for the huacas carried them
    on litters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The groups entered the square from the direction of the four Suyus and made
    reverences to the Creator, the Sun, the Thunder, Huanacauri, and then the Ynca
    present in the square.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The families of Hanan-Cuzco and Hurin-Cuzco joined themselves into one group
    to make more room in the square.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the people had taken their places, the High Priest of the Sun sprinkled
    a large quantity of sancu with blood, and the Caciques rose in order to repeat
    a prayer to the Creator.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prayer addresses Viracocha as Creator, giver of being to men and women,
    and asks for health, peace, long life, and acceptance of the sacrifice.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Priest of the Sun distributed the sancu, and the people ate the flesh
    of sheep that had been sacrificed to the Creator, the Sun, and the Thunder.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each nation spent the rest of the day performing taqui, singing, and dancing
    according to the customs of its country before subjugation by the Yncas.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Deformed persons who had previously been expelled from Cuzco were allowed
    to join this part of the feast.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the conclusion of the two-day portion of the feast, a sheep and many-colored
    clothes were burned in sacrifice.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Those returning home sought permission from the Creator, the Sun, the Thunder,
    and the Ynca; they left the huacas brought that year in Cuzco and returned with
    huacas from the previous year.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Chiefs were given gold, silver, clothes, servants, and permission to travel
    in litters; the huacas were granted estates and attendants.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ynca Yupanqui is named as the inventor or organizer of the feast’s ceremonies,
    and the same feast called Situa was also celebrated in provincial chief places
    by Ynca governors with fewer sacrifices but without omitting any part.
  category: other
  evidence_refs:
  - ev:7
