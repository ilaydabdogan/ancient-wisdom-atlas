  summary: The passage describes instructions sent from Cuzco, the veneration shown
    to the Ccapacocha/Cachahuaca sacrifice during travel, the sacrifice of selected
    conquered people to the Sun after victory, the making of exceptionally beautiful
    things into huaca, offerings at mountain summits and passes called chupasitas,
    and an introduction to Luis de Olivera's report on taqui uncu and widespread apostasy.
