canonical_text:
  quote: ''
  summary: 'The passage reports several origin and ritual fables: people transformed
    into stone for disobedience, a destructive fire from heaven at Pucara, the Creator
    sending two sons to name and teach the uses of plants, rivers, and other features
    of the world before ascending to heaven, the creation and ordering of animals
    at Tiahuanaco, and a Canari flood tale in which two brothers survive on a rising
    mountain and later encounter mysterious food and two guacamayo birds dressed as
    Canaris.'
  language: English
  quote_policy: summarized
