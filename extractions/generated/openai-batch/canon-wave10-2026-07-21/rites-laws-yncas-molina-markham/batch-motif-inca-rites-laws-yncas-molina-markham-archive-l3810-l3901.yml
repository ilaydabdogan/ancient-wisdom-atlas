  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Goricancha they find a place suitable for settlement with good water from
    two springs named Hurinchacan and Hananchacan.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: A rock called Cuzco-cara-urumi is connected with the names Cuzco-pampa and
