  text: Manco Ccapac sends a sister to call his delayed brother, but both brother
    and sister remain away and are kept at the huaca of Sanuc.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Manco Ccapac goes to the huaca of Sanuc in wrath and finds the brother and
    sister nearly dead.
  category: action
  evidence_refs:
