canonical_text:
  quote: ''
  summary: Manco Ccapac finds his brother and sister detained near death at the huaca
    of Sanuc, strikes the speaking stone or huaca with his tupac-yauri, grieves, is
    strengthened by a rainbow, journeys with kin to the area of Goricancha/Cuzco,
    establishes settlement names and royal identity, marries his sister Mama Ocllo,
    enacts laws and conquests, receives tribute, and orders a gold plate made to signify
    the Creator of heaven and earth.
  language: English
  quote_policy: summarized
