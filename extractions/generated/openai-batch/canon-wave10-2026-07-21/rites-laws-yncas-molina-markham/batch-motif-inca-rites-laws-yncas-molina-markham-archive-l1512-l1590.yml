canonical_text:
  quote: ''
  summary: The passage describes the beginning of the Situa feast at the onset of
    rains, when sickness was expected. The Ynca, lords, and priests arrange the rites
    at the Sun temple, invoke the Creator to expel diseases and evils, remove certain
    people and dogs from the city, assemble armed men in Cuzco, and send four groups
    toward the four directions shouting that evils should depart. On one route the
    shouted formula is relayed to a river, where participants bathe themselves and
    their weapons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Situa feast is said to be celebrated in this month because the rains begin
    and sickness often accompanies the first rains.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people ask the Creator to shield Cuzco and the Inca-conquered territory
    from sickness during the year.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the conjunction of the moon, the Ynca, council chiefs, and principal lords
    go at noon to the Ccuricancha, the house and temple of the Sun, to decide how
    the festival will be celebrated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The High Priest addresses the assembly and states that the Situa ceremonies
    should be performed so that the Creator may drive diseases and evils from the
    land.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Armed men equipped as for war assemble in front of the temple with lances.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Figures glossed as Thunder and the Creator are brought from their own temples
    to the temple of the Sun, and their priests join the assembly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The priest of the Sun proclaims the feast with the concurrence of those present.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Strangers, people with broken ears, deformed persons, and unlucky persons
    are excluded from the ceremony; dogs are also driven out so that they will not
    howl.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Armed people go to the square of Cuzco and cry out for sicknesses, disasters,
    misfortunes, and dangers to leave the land.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: A gold urn shaped like a fountain, used for chicha sacrifice, stands in the
    middle of the square.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Four hundred men of war assemble in the square, divided into four groups of
    one hundred facing Collasuyu, Chinchasuyu, Antisuyu, and the south.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The four armed parties depart toward assigned places while crying that all
    evils should go forth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Along the Collasuyu road, the cry is passed from group to group until it reaches
    the river at Quiquisana, where participants bathe themselves and their arms.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A westward group toward Chinchasuyu shouts in the same manner and goes as
    far as Satpina.
  category: sequence
  evidence_refs:
  - ev:8
