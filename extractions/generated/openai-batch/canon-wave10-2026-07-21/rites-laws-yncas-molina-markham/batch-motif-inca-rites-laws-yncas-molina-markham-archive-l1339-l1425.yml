canonical_text:
  quote: ''
  summary: The passage describes Inca prayers to the Creator, Sun, and Thunder; burnt
    sheep sacrifices and offerings at Huanacauri, Coricancha, Achpiran, and other
    sacred places; a ritual route toward Vilcanota because the Sun was said to have
    been born there; and an elite Inca feast with dance, drink served by women of
    the Sun, restricted access, and gold utensils.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Prayers are addressed to the Creator; the Sun is treated as created by the
    Creator, and thunder and lightning are associated with rain by command of the
    Creator.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the morning a sheep is sent to Huanacauri, described as the principal huaca,
    where it is killed and burnt by the tarpuntaes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: While the sacrifice burns at sunrise, many Yncas and Caciques pull wool from
    it and walk around it holding the wool.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The spoken prayer at the burning sacrifice asks the Creator, Sun, and Thunder
    to remain young, multiply the people, and keep them at peace.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: At noon another sacrifice is burnt in the court of the Coricancha, and in
    the evening another is taken to Achpiran, a hill associated with sunset.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Offerings include baskets of coca, coca-like leaves, toasted maize, and red
    and yellow sea shells called mullu in the shape of maize.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: On every other day of the month, sheep and other offerings are burnt at a
    sequence of named hills, plains, and places.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The direction of the ritual route is explained by the statement that the Sun
    was born in that part.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The tarpuntaes travel out by one road and return by another.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Ynca and his lords remain at Mantucalla to drink, revel, and perform a
    taqui called Huallina four times in the day.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Only the Yncas celebrate this feast; the mama-cunas give drink to the performers,
    the wives remain outside in a court, and the eating, drinking, and cooking utensils
    are gold.
  category: relationship
  evidence_refs:
  - ev:6
