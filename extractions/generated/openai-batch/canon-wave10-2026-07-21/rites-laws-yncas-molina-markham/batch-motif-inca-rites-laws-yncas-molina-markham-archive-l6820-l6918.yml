canonical_text:
  quote: ''
  summary: The passage introduces Polo de Ondegardo's report on Inca lineage and expansion.
    It says the Inca lineage was divided into Hanan Cuzco and Hurin Cuzco, discusses
    whether the Yncas were native to Cuzco or came from elsewhere before the flood,
    describes memory preserved by quipus, recounts conquests around Cuzco including
    the defeat of the Chancas by Pachacutec Yupanqui Ynca, mentions Pururunas or huacas
    connected with that battle, and notes the worship of the lake of Villcañota as
    a huaca.
  language: English
  quote_policy: summarized
