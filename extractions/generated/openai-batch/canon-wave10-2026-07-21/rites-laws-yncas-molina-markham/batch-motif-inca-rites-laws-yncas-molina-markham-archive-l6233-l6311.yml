canonical_text:
  quote: ''
  summary: A Huarochiri flood tradition is recounted in which a man takes food for
    five days and a llama to the summit of Villca-coto. Birds and animals are gathered
    there while the sea rises over the valleys and hills except for that summit. A
    fox's tail is washed by the waves, explaining the black tips of foxes' tails.
    After five days the waters recede, and present people are said to descend from
    the solitary surviving man. The passage then gives hostile colonial commentary
    connecting and contrasting the tradition with the universal deluge, Noah's ark,
    a speaking llama, demon intercourse, Coniraya Uiracocha, former yunca conditions,
    five-day crop ripening, and terrace ruins.
  language: English
  quote_policy: summarized
