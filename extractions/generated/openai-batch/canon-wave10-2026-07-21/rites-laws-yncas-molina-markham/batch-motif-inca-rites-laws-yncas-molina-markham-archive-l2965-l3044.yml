  - ev:2
  - ev:3
- id: obs:2
  text: Ayuscay is associated with a woman conceiving; on the fourth day babies are
    put into a cradle called quirau, and uncles and other relations are invited to
    see it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rutuchico takes place when a child reaches one year; the child receives a
    name to bear until coming of age, is shorn, and the eldest uncle cuts the first
    hair.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: For a boy, the later name is given when he is armed as a knight and receives
    the huaraca; for a girl, the later name is given at puberty.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In quicuchica, girls reaching puberty fast for the first two days, receive
    a little raw maize on the third day, and are confined in a place within the house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the fourth day of quicuchica, girls are washed, dressed in clothes called
    ancalluasu, given white wool shoes, have their hair plaited, and receive a bag-like
    head covering.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the puberty rite, the girl sets food and drink before principal relations;
    the principal relation gives her the name she will bear thereafter and teaches
    her behavior and obedience to parents.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: When the Ynca gives women as wives, the woman is received because it is the
    Ynca's command; the man goes to the girl's father's house, seeks consent from
    her relations, and serves the parents-in-law by carrying fuel and straw for four
    or five days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A wife given by the Ynca is described as taken until death and never deserted.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Capac-cocha is said to have been instituted by Pachacutec Ynca Yupanqui; the
    four provinces bring male and female children about ten years old, along with
    cloth, flocks, gold, and silver, to the city.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Ynca sits in the Huacay-pata, the great square of Cuzco, while children
