canonical_text:
  quote: ''
  summary: 'The passage describes several Inca rites: ayuscay at conception and placement
    of babies in a cradle; rutuchico at a child''s first year with naming and hair
    cutting; quicuchica for girls at puberty with fasting, confinement, washing, special
    clothing, service to kin, renaming, and instruction; marriage when the Ynca gives
    women as wives; and Capac-cocha, in which provinces bring children and goods to
    Cuzco for offerings and sacrifice to huacas.'
  language: English
  quote_policy: summarized
