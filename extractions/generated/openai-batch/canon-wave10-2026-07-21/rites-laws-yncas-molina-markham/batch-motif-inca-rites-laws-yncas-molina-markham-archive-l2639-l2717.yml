canonical_text:
  quote: ''
  summary: 'The passage describes portions of an Inca rite for youths armed as knights:
    lion-skin and red-shirted taqui performance, repeated sacrifices, bathing and
    clothing change, presentation of war gear, kin offerings and admonitions, burnt
    offerings, ear-piercing as the final ceremony, and later flock-counting rites
    with sacrifices for multiplication.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Prepared lion skins included the heads, gold ear-pieces, golden teeth replacing
    removed real teeth, and gold ornaments in the paws called chipanas.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wearers of the lion skins put the lion head and neck over their own head
    and neck, with the body skin hanging from the shoulders.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Participants in the coyo taqui wore red shirts with red and white fringes,
    and the rite was performed with four drums associated with Hanan Cuzco and Hurin
    Cuzco.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The coyo taqui was performed twice a day for six days, during which sacrifices
    were offered to the Creator, the Sun, the Moon, and Thunder for the Ynca and the
    youths armed as knights.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: On the twenty-first day, the youths bathed in the fountain CalH-puquio, removed
    the clothes in which they had been armed as knights, and dressed in black and
    yellow nanaclla garments with a red cross in the center.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After bathing and changing clothes, the youths returned to the square, found
    the huacas there, made obeisances, and were placed according to their families.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The principal uncle presented each youth with a shield, a sling, and a club
    with a metal knob for going to war.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Relations and chiefs made offerings and prayers for the youths to be rich
    and fortunate, and each sacrificing relation flogged a youth and exhorted him
    to valor, loyalty to the Sun and the Ynca, devotion to the huacas, and imitation
    of his ancestors.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Priests brought fuel bundles dressed in the clothes of a man and a woman,
    offered them to the Creator, the Sun, and the Ynca, and burned them with a sheep
    and certain birds for the youths' fortune in war.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the twenty-second day, the knights were taken to relatives' houses and
    had their ears pierced as the last ceremony; the ear openings were enlarged with
    cotton, and a broken opening was considered unfortunate.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Priests and the shepherds of the Ynca counted the flocks of the huacas and
    the Ynca, after which feasts and sacrifices for flock multiplication began; shepherds
    were rewarded or punished according to flock increase.
  category: action
  evidence_refs:
  - ev:8
