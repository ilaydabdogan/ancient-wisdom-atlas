canonical_text:
  quote: ''
  summary: The passage describes stages of an Inca ceremony in which eligible youths
    are armed as knights. They are whipped and exhorted by kin and chiefs, participate
    in songs, dances, processions, huaca worship, drinking, and a sacrificial sheep
    meal. On the fourteenth day they assemble in Huacay-pata, where huacas of the
    Creator, Sun, Moon, and Thunder are placed near the Ynca; the youths and maidens
    receive ritual garments, the youths receive staves with knives and breeches, worship
    the images, bow to the Ynca, and depart by tribes and families.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The youths proceed to the ravine called Quiras-manta, where uncles, parents,
    and chiefs whip them on the arms and legs and exhort them to be brave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the song called Huarij, the armed knights stand holding handfuls of
    straw while the rest of the people are seated.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A shepherd connected with the dedicated Raymi-napa flock brings a sheep called
    napa, covered with red cloth and gold ear holes; attendants blow bored sea shells,
    and another person brings the suntur-paucar, described as an insignia of the Lord.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the plaza, the participants dance and lead the sheep and the suntur-paucar
    before them; they return toward Cuzco by families and tribes, with the newly knighted
    youths carrying huaracas on their heads and bundles of straw in their hands.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: At the square the participants worship the huacas; kin whip the youths again,
    the people perform the taqui called huari, the youths give drinks to the kin who
    flogged them, and the sacrificial sheep is eaten before the priests return the
    huacas to their temples.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After days of rest, the people and youths assemble on the fourteenth day in
    Huacay-pata, each youth coming with his father and relations.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Only youths who were descendants and relations of the Lord Yncas by direct
    line were admitted to receive arms; provincial Ynca governors with sons of suitable
    age performed comparable ceremonies in the provinces.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Huacas of the Creator, Sun, Moon, and Thunder are brought into the square
    and placed together near the Ynca, with priests stationed near their huacas.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The youths receive red-and-white striped shirts, white mantles with blue cords
    and red tassels, and usutas; the wider population makes the dresses as tribute,
    and relations provide the usutas.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Priest of the Sun gives red-and-white dresses and matching cloths to the
    maidens in the name of the Sun.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The youths receive staves with attached knives called yauri and breeches called
    huaraca; afterward they worship the images of the Creator, Sun, Moon, and Thunder
    and bow reverently to the Ynca.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The uncles and relations flog the youths and exhort them to be valiant and
    attentive to the worship of the Huacas and the Ynca; the youths then leave the
    square by tribes and families.
  category: speech
  evidence_refs:
  - ev:8
