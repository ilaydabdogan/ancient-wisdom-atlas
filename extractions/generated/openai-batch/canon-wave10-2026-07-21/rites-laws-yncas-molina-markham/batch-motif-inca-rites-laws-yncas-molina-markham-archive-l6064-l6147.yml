canonical_text:
  quote: ''
  summary: The passage continues a Huarochiri narrative in which Coniraya grants privileges
    to animals that please him and curses animals that displease him. At the sea-shore
    he finds Cavillaca and her child turned to stone, encounters daughters of Pachacamac
    guarding a serpent, causes sea fish to originate from Urpi-huachac's pond, evades
    Urpi-huachac's attempted revenge, and later wanders in Huarochiri playing tricks.
    The passage also reports contemporary local taboos and rituals concerning condors,
    the small fox, and lion skins.
  language: English
  quote_policy: summarized
