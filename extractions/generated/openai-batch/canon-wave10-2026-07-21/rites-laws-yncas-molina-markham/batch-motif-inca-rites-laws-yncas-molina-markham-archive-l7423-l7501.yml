canonical_text:
  quote: ''
  summary: 'The passage describes Inca regulations for hunts and forests, then explains
    the Aclla-huasi system: officials selected young girls, housed and trained them
    under Mama-cunas, sent them to Cuzco as virgins, and distributed them to service
    of the Sun or Pacha-mama, to sacrifices, or to the Ynca and people favored by
    him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After tribute for the Ynca and religion was paid, the remaining game could
    supply the people, and regular accounts of hunts were kept.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Forests called moyas of the Ynca were assigned for use by fuel-poor regions
    and neighboring districts, and cutting was regulated by order and license.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pastures, hunts, and forests are described as used in common under fixed regulations.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each province had an Aclla-huasi, translated in the passage as the house of
    the chosen ones.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: An official called Apu-panaca oversaw these houses and could select girls
    aged eight or nine without a numerical limit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The selected girls were placed with one hundred Mama-cunas and taught sewing,
    weaving, and making drinks used by the Indians.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The girls' work was taken to Cuzco at the feast of Raymi in February.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The girls were closely watched until about thirteen or fourteen years of age
    or older so that they would be virgins when they reached Cuzco in mid-March.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Some women were taken for the service of the Sun and placed in temples, where
    they were kept as virgins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Women were also given to the service of Pacha-mama and other things in the
    religion described by the report.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Others were selected for numerous sacrifices during the year; the report says
    the girls were killed and had to be virgins.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Special occasions for sacrifice included the health of the Ynca, his success
    in war, a total eclipse of the sun, earthquakes, and other occasions.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Other women were set apart for the service of the Ynca and for persons to
    whom he showed favor.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Parents could not excuse or redeem selected girls, and estates were assigned
    to support the houses of the chosen ones.
  category: relationship
  evidence_refs:
  - ev:7
