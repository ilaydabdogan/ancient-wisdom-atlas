  summary: The passage describes the Inca chasqui relay system, including road stations,
    message transmission from Cuzco, rapid transport of letters and fish, quipu records,
    and provisioning from Ynca storehouses. It then describes tribute labor for constructing
    Cuzco edifices and fortresses, emphasizing stone tools, precision masonry, transport
    of stones, large numbers of workers, and local quarry resources.
  language: English
