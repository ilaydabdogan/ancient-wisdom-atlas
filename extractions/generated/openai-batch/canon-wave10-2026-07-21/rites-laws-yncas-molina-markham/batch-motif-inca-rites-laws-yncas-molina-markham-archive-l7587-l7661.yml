literal_observations:
- id: obs:1
  text: Chasquis were stationed at intervals of one tupu on both coastal and mountain
    roads, housed in small buildings for two men, and relieved monthly while serving
    day and night.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chasquis' duty was to carry the Ynca's messages from Cuzco to other points
    and bring back messages from governors so that transactions and events of the
    empire were known.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A relay runner ran about a league and a half without stopping and passed the
    message to the next chasqui as soon as he was within hearing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The report gives examples of rapid communication and transport, including
    Cuzco to Quito and back in twenty days, Cuzco to Lima in three days, and fresh
    fish carried from the sea or from Tumbez, with quipu records noted for the latter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The chasquis' food came from the Ynca's storehouses, and the passage states
    that those who worked for the Ynca's service or for religion did not eat at their
    own expense.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A contribution or tribute required Indians to work on the edifices of Cuzco,
    a labor described as very toilsome because the buildings were masonry and the
    workers lacked iron or steel tools.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The masonry stones were fitted without lime and sand, transported from great
