canonical_text:
  quote: ''
  summary: The passage describes an Inca public ritual in which priests, Cuzco lineages,
    huacas, and embalmed ancestors are assembled; unblemished flocks from the four
    quarters are brought to the great square; four selected sheep are sacrificed to
    the Creator, Thunder, Sun, and Huanacauri; blood is sprinkled on sancu; participants
    swear loyalty and ritual fidelity before eating yahuar-sancu; sacrificial lungs
    are examined for omens of the coming year and burned; sacred portions of the sheep
    and wool are distributed and offered; and a prayer addresses the Creator/Uiracocha
    as giver of life and strength.
  language: English
  quote_policy: summarized
