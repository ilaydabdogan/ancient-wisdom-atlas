canonical_text:
  quote: ''
  summary: Challcuchima and Quisquis perform a midnight grease-fire omen using two
    lumps to represent the camps of Huascar Ynca and Atahuallpa. After interpreting
    the burning as favorable, they capture Huascar, summon leading people, humiliate
    him and his mother, and Quisquis orders killings within Huascar's household. Huascar
    and close companions are then sent under guard toward Atahuallpa. News of the
    Spaniards' landing produces alarm, and riches and royal goods are buried or concealed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At midnight Challcuchima and Quisquis light a fire on their left hands with
    grease, placing one lump of grease for Huascar Ynca's camp and another for Atahuallpa's
    camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grease representing Huascar burns high and goes out quickly, while the
    grease representing Atahuallpa continues burning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the burning, Challcuchima and Quisquis sing the haylli and tell their
    men that all will go well.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Challcuchima and Quisquis go to Utcu-pampa with six hundred and forty men,
    find Huascar asleep at sunset, and take him prisoner.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Rucanas who bear Huascar are routed, Huascar is carried to Sallcantay,
    and his army becomes terrified and disperses by tribe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After obtaining possession of Huascar, Quisquis and Challcuchima do not enter
    the city but post their men at Quepay-parapa and summon Apu-curacas, Auquis, Huascar's
    mother, Huanca Auqui, and captains.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Huascar is insulted by a rope tied around his neck, by names calling him a
    bastard and eater of coca, and by the substitution of chillca leaves for coca.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Quisquis and Challcuchima abuse Huascar's mother, and Huascar asks who they
    are to judge his descent.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: When Huascar is outraged, he raises his eyes and appeals to the Lord and Creator
    about the burdens and troubles sent to him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Quisquis orders all children of Huascar and all his servants within the palace
    of Puca-marca to be slain, up to fifteen hundred persons.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Huascar, his wife and mother, two children, Huanca Auqui, and the chief officers
    and councillors are sent with a guard of one hundred men to Atahuallpa.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: News that the Spaniards have landed brings great dismay.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: By Quisquis's advice great riches are buried in the earth, and the passage
    also reports that Huascar had ordered gold, silver, and rich dresses to be concealed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Barco and Candia arrive at Cuzco without meeting Huascar; Challcuchima is
    seized on the way to Caxamarca; Francisco Pizarro captures Atahuallpa.
  category: sequence
  evidence_refs:
  - ev:9
