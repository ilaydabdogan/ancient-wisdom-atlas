canonical_text:
  quote: ''
  summary: A threatened island community debates resistance to the Ynca, decides on
    feigned submission, and sends gifts and offers of obedience through Curaca Tumpalla.
    The Ynca Huayna Ccapac accepts, takes possession, crosses to the island with arrangements
    for the army, receives ceremonial praise, stays in newly built palaces, and begins
    arranging the government under his laws.
  language: English
  quote_policy: summarized
