  text: They judged their forces too small to resist and noted that mainland neighbours
    were unfriendly because of previous petty wars.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: They decided that armed resistance would lead to destruction and chose to
    submit to the Ynca with feigned devotion while waiting for an opportunity to throw
    off his yoke.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
