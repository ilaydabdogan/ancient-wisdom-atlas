canonical_text:
  quote: ''
  summary: The passage discusses Inca terms for cowardice and rejects a Spanish-derived
    chicken-hearted saying as native. It then corrects the word gualpa as a corruption
    of Ataliuallpa, identifying Ataliuallpa as the last Ynca of Peru. The narrator
    describes Ataliuallpa as an illegitimate and cruel ruler who killed his elder
    legitimate brother Huascar Ynca, usurped the kingdom, destroyed royal kin, ravaged
    service villages around Cuzco, and was then stopped and captured by Spaniards.
  language: English
