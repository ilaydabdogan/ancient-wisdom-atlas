canonical_text:
  quote: ''
  summary: The narrator explains that, after finishing the ninth book, he received
    notes from Peru concerning surviving descendants of the royal Inca bloodline.
    These descendants wrote in 1603 to several representatives asking them to petition
    the king for exemption from tribute and other vexations. They sent powers of representation,
    proofs of descent, and a painted royal genealogical tree on white Chinese silk
    showing the line from Manco Ccapac to Huayna Ccapac and Paullu. The painted Incas
    wear ancient dress, crimson fringe, ear ornaments, and hold partisans instead
    of royal sceptres. The narrator forwarded the documents to representatives at
    court.
  language: English
  quote_policy: summarized
