  quote: ''
  summary: The passage credits Francisco de Caravantes, a Toledan gentleman and early
    conqueror, with introducing the vine into Peru. The vine was brought via the Canary
    Islands, bore dark grapes, and produced red wine. The narrator compares this act
    to the honor given to Bacchus by ancient peoples, notes that Caravantes received
    little credit, says Indians preferred their older maize-and-water drink, and reports
    an experiment in germinating vine shoots from raisin pips.
