  quote: ''
  summary: The passage describes an Inca royal policy requiring heirs of subject lords
    to be raised at court until succession. The stated reasons are instruction in
    Inca customs, cultivation of loyalty, ennoblement of the court, and wider diffusion
    of the general language of Cuzco through attendants and local imitation.
