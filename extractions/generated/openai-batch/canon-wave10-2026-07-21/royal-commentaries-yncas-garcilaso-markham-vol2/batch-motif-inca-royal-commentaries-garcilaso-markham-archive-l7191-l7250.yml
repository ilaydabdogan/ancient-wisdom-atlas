canonical_text:
  quote: ''
  summary: The passage describes offerings to the Sun at a temple ceremony, including
    golden vessels from the Ynca, cups from his family, and gold and silver animal
    forms from Curacas. Priests then bring out a flock belonging to the Sun and select
    a black lamb, described as the preferred and more sacred color for sacrifice.
    The lamb is sacrificed for omens by examining its heart and lungs; the animal
    is placed with its head toward the east, cut open while alive, and its organs
    removed whole.
  language: English
  quote_policy: summarized
