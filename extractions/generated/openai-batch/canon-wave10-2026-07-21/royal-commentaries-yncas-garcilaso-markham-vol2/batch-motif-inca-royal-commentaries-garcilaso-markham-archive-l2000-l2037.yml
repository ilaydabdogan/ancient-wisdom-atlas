canonical_text:
  quote: ''
  summary: The passage describes an ordered Inca administrative system with officials
    for tribute accounts, herds, fields, public supplies, labor supervision, household
    duties, light work for old and blind people, and specialized trades. It presents
    the ruler called the Yuca as wishing to be regarded as a father and careful guardian
    rather than merely as king, and it ends by saying the system was confirmed by
    Emperor Charles Y and would have brought abundance if continued.
  language: English
  quote_policy: summarized
