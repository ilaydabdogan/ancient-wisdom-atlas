canonical_text:
  quote: to show himself to be a son of him who was his Father
  summary: After arranging the conquered provinces in Chile, King Ynca Yupanqui ends
    further conquest and devotes himself to ordering and ennobling his realm. He orders
    fortresses, temples of the Sun, houses, depots, irrigation works, and terraces;
    enriches the temple of the Sun at Cuzco; continues work on the Cuzco fortress
    left unfinished by his father; and visits provinces to address the needs of the
    people.
  language: English
