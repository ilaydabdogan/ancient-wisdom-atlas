  summary: The passage describes how peoples in the Inca capital retained regional
    costumes and head-dresses, allowing their country, nation, province, tribe, or
    lineage to be recognized. The Ynca kings preserved these distinguishing customs.
    The outer wards housed vassals from the empire, while Yncas and royal blood were
    distinguished from them. The city is then spatially described by a stream from
    Sacsahuaman to Pumap-chupan, a north-south street, cross streets, and royal or
    inner-city areas.
