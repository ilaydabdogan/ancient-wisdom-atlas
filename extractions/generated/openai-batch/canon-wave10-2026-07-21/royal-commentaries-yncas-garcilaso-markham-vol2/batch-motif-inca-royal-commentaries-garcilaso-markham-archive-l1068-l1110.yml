canonical_text:
  quote: ''
  summary: The passage describes an Ynca tribute system in which each province supplied
    goods native to its own district, including provisions, cloth, arms, and shoes.
    It emphasizes that demands were distributed according to local capacity, that
    subjects were not required to seek tribute goods outside their homes, and that
    this arrangement produced orderly service. The narrator cites Father José de Acosta
    as a corroborating Spanish historian.
