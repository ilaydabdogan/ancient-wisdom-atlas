  quote: "“it became tired, wept blood”"
  summary: The passage reports an Indigenous explanation that a great rough quarry
    stone became exhausted on the road to a fortress and wept blood. It then describes
    holes and reddish mud on the stone, gives the narrator’s natural explanation for
    the color, and presents an Amauta historical account in which more than twenty
    thousand people dragged the stone over steep mountains until it slipped and killed
    thousands before being raised and left where it now lies. The excerpt ends with
    an isolated description of an unidentified grooved object with holes.
