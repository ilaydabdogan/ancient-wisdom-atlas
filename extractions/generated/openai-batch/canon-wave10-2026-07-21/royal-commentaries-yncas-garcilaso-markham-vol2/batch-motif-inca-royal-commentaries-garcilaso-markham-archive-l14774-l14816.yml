  summary: The chapter describes the Ynca advance against three organized provinces,
    Cassa, Ayahuaca, and Callua. These communities have fortresses, villages, assemblies,
    elected peacetime governors, and war captains, but no permanent lord. The Ynca
    demands submission or war; they refuse, declaring a willingness to die for their
    liberty. War follows, with failed offers of peace and clemency, heavy resistance,
    and the Ynca pressing the campaign with destructive force.
