  summary: The passage describes the novitiate ordeal for Inca novices and for the
    eldest son of the Ynca, heir to the empire. The prince undergoes the same or greater
    austerities as others, with minimal privilege, so that his future kingship is
    grounded in discipline, warlike skill, endurance, and sympathy for the poor.
