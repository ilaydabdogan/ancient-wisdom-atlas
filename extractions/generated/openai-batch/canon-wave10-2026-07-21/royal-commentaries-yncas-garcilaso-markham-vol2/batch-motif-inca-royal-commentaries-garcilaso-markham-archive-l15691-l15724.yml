canonical_text:
  quote: ''
  summary: The passage describes Huayna Ccapac's northern conquests and administration.
    A group near Pastu is reduced to service and assigned teachers and a tribute of
    lice. The people of Otavallu resist but submit. The Caranques worship tigers,
    lions, and great serpents, offer human hearts and blood, wage war to capture people
    to kill and eat, resist the Ynca, and then submit. Huayna Ccapac appoints teachers
    for them and prohibits blood sacrifice and eating human flesh. A note identifies
    the Ancas-mayu river as the northern boundary of the empire at its greatest extension.
  language: English
