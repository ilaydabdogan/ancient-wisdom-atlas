  quote: ''
  summary: The passage presents Father Bias Yalera’s argument that divine grace can
    work without human aids, but that God also used the Yncas’ policy of making their
    subjects speak one language as a means of preparing people to receive Christian
    doctrine. The author adds that he inserted this material because he considered
    the language policy necessary for teaching Christianity, while omitting Valera’s
    further linguistic comparisons as unnecessary for that purpose.
