canonical_text:
  quote: ''
  summary: 'The passage describes royal obsequies for a deceased Ynca king: sacrifices
    were offered to godlike royal men called children of the sun; Cuzco and the provinces
    mourned with public cries, processions, banners, remaining clothes and arms, praise
    of the king’s deeds and benefits, repeated observances by lunar phases for a year,
    professional mourners, and veneration at places where the king had stayed.'
  language: English
  quote_policy: summarized
