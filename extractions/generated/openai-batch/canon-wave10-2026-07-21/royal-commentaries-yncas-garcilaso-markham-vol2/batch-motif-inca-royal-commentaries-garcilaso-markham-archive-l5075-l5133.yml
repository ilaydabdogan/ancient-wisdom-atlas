canonical_text:
  quote: ''
  summary: 'The passage describes Inca royal obsequies: kings were embalmed so that
    their bodies appeared alive; their internal organs were interred in a temple at
    Tampu near the Yucay River; Cieza is cited concerning buildings at Tampu and gold
    used as mortar; when an Inca or great Curaca died, favored servants and beloved
    wives were buried alive or killed, reportedly voluntarily, so they could serve
    their lord in a corporeal afterlife; officers sometimes limited the number of
    volunteers; embalmed royal bodies were placed before the figure of the sun in
    the temple.'
  language: English
  quote_policy: summarized
