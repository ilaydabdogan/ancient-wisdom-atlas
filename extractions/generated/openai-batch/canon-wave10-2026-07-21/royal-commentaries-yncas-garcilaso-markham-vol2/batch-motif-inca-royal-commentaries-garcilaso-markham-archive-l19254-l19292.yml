canonical_text:
  quote: ''
  summary: The passage describes the Ynca commanding submitted peoples to abandon
    their gods, human sacrifice, and eating human flesh, and to worship the Sun under
    imperial law. Tumpalla and his people agree, but the Curacas later resent the
    laws, conspire to kill the Ynca and his people, secretly restore and consult their
    gods, offer sacrifices and promises, and receive encouragement to persevere while
    waiting for a safer opportunity.
