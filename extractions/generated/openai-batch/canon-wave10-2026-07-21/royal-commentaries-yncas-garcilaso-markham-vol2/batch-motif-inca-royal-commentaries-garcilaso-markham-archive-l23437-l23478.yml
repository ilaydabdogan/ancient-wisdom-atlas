canonical_text:
  quote: ''
  summary: The passage quotes Gomara on Pedrarias founding settlements at Nombre de
    Dios and Panama and opening a road through difficult, animal-haunted country.
    It then reports a marginal anecdote that a monkey wounded the cross-bowman Villacastin
    with a stone while Villacastin killed it with an arrow. The narrator says he saw
    Villacastin’s broken front teeth and records the story as a remarkable, witnessed
    anecdote. The passage closes with brief references to Yucas and Pallas as children
    of Huayna Ccapac, to the narrator’s mother as his niece, and a footnote about
    Francisca, another daughter of Huayna Ccapac.
  language: English
  quote_policy: summarized
