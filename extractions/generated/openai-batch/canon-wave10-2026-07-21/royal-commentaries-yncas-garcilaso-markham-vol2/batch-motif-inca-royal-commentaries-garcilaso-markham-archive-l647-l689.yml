literal_observations:
- id: obs:1
  text: One tupu of land is described as sufficient to sustain one married peasant
    without children; additional land was granted for children, one tupu for each
    boy and half a tupu for each girl.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a boy married, the father handed over the tupu granted for the son's
    sustenance, because the father could not retain land assigned for the son's use
    after the son left home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Daughters did not take their half-tupus when they married, because the grants
    were for maintenance rather than dowers, and their husbands were to receive land.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says married women were not counted for land grants, while unmarried
    women and widows without husbands to maintain them were counted.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fathers retained lands granted for daughters if needed; otherwise those lands
    reverted to the State, and buying or selling land was not allowed.
  category: action
  evidence_refs:
  - ev:2
