canonical_text:
  quote: ''
  summary: 'The passage gives an alternate report about Pedro de Valdivia''s death
    after an Indigenous victory in Chile: Francisco de Fieros says the victors spent
    the night dancing, cutting and eating pieces from Valdivia and a tied priest while
    the captives confessed before dying. The narrator frames any eating as exceptional
    rage rather than custom. The passage then says the Indigenous forces adopted separate
    squadrons against Spaniards, citing Ercilla''s Araucana, notes the war lasted
    forty-nine years, and adds that Leocato rather than Caupolican was named as executioner.'
  language: English
  quote_policy: summarized
