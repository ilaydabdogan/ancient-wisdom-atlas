canonical_text:
  quote: ''
  summary: Priests and soothsayers are said to have prophesied Huayna Ccapac’s death,
    the destruction of the royal family, the loss of the kingdom, and other calamities,
    but these predictions were not publicized. While ill, Huayna Ccapac summons relatives,
    governors, and captains. He says he is going to rest in Heaven with father the
    Sun, who had revealed that he would be summoned from a river or lake. He gives
    instructions for the treatment and burial of his body, commends Atahuallpa as
    Ynca in Quitu and future conquests, orders obedience to him, and charges the audience
    to practice justice and act as children of the Sun.
  language: English
  quote_policy: summarized
