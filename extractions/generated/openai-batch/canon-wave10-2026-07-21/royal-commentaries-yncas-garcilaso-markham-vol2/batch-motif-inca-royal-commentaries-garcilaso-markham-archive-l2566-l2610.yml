canonical_text:
  quote: ''
  summary: Forces arrive at Sacsahuana near the Ynca position. Ynca Uira-ccocha sends
    messages to the Chancas offering peace, friendship, and pardon. The Chancas know
    that Yahuar-huaccac has fled while his son the Prince intends to defend the city,
    but they refuse to hear the messengers because they expect victory. The next morning
    they march toward Cuzco in battle order, halt before reaching the Prince's position
    by nightfall, and Uira-ccocha sends renewed offers.
  language: English
  quote_policy: summarized
