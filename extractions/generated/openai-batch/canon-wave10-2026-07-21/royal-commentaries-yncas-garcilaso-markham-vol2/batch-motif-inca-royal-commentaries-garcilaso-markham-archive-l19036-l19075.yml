canonical_text:
  quote: ''
  summary: Huayna Ccapac summons peoples accused of treachery and the murder of Ynca
    ministers. Leaders connected with the earlier embassy are assembled, accused by
    a master of the camp, and told that their crimes could justify the destruction
    of the whole nation. The Ynca is described as merciful and as bearing the title
    translated as Lover of the Poor; he pardons the common people and the leaders'
    families, but orders one-tenth of the culpable leaders to be selected by lot and
    executed as punishment and memorial of the treason.
  language: English
  quote_policy: summarized
