canonical_text:
  quote: ''
  summary: The passage describes monkeys crossing gaps and rivers by leaping or linking
    tails, then recounts a trained monkey at Carthagena that fetched wine, protected
    its money and pot, obeyed permission around wine, and allegedly attacked painted
    women. The narrator cautions against accepting fables, frames monkeys as creatures
    made for human amusement, and notes a disputed claim connecting them with Solomon
    and the Indies.
  language: English
