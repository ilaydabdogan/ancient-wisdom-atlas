canonical_text:
  quote: ''
  summary: 'The passage describes Ynca tribute administration: labor and tasks are
    reckoned by knots; depot goods are inventoried; duplicate accounts check errors;
    surplus tribute is stored for public welfare and scarcity; valuable gifts are
    controlled by the Ynca and redistributed; and occupations are assigned for royal
    and communal service.'
  language: English
  quote_policy: summarized
