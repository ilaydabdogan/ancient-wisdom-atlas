  text: Royal depots and village depots are named as places where goods are stored
    and reported.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A law requires the provincial Ynca governor to keep duplicate accounts in
    order to check errors by collectors or tribute payers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ninth law assigns surplus tribute, after royal wants are met, to the public
