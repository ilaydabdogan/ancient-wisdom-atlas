canonical_text:
  quote: ''
  summary: In this chapter segment, Inca forces confront the Chincha/Yunca defenders.
    The Yuncas resist in the valley, while the Yncas repeatedly offer peace, rotate
    troops to avoid the coastal climate, and then pressure the defenders by destroying
    crops and water-courses. The Yuncas continue resisting and pray with tears and
    sacrifices to Chincha Camac for deliverance. The narrator identifies Chincha Camac
    as a famous local idol or god made after the likeness of Pachacamac.
  language: English
