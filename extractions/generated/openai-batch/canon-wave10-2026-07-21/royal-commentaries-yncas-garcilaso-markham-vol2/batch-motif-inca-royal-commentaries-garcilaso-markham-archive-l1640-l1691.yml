canonical_text:
  quote: ''
  summary: 'The passage introduces Father Blas Valera’s account of Inca government.
    It states that from the time of Manco Ccapac and Inca Rocca the Indians of Peru
    moved from an earlier condition without laws or polity into ordered practices:
    instruction of children, communication, clothing, agriculture, judges, courteous
    speech, building, and law observance. Valera praises Inca lawmaking as remarkable
    because it was achieved without letters or human sciences, compares it with ancient
    and Asian lawgivers, and notes that laws were recorded by knots and colored threads
    and taught to descendants.'
  language: English
  quote_policy: summarized
