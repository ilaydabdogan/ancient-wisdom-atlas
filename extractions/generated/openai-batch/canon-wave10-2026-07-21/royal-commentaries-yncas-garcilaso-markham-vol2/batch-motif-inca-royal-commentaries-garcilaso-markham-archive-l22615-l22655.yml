canonical_text:
  quote: ''
  summary: Huascar Ynca, anxious that his brother Atahuallpa may grow powerful enough
    to seize the empire, sends a kinsman as messenger. His message invokes the ancient
    constitution of Manco Ccapac and asserts that Quitu and related provinces belong
    to the crown and empire of Cuzco. Huascar says he will tolerate the prior arrangement
    only if Atahuallpa does not expand his realm and acknowledges himself as vassal
    and feudatory. Atahuallpa receives the message humbly, deliberates for three days,
    and answers that he has always acknowledged the Sapa Ynca as lord, will not add
    to Quitu, and would renounce the kingdom if required. A note reports Velasco's
    different account of the first cause of the quarrel involving the Cañaris.
  language: English
  quote_policy: summarized
