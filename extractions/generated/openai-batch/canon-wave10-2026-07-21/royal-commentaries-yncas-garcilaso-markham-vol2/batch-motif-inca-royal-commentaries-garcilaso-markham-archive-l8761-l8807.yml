canonical_text:
  quote: ''
  summary: The passage recounts Prince Ynca Yupanqui receiving a favorable ritual
    reply, advancing to Huanan, and sending the customary choice of peace or war to
    the powerful lord Chimu. Chimu, ruler of several rich valleys and treated as a
    king, refuses submission, declaring that he will defend his home, laws, customs,
    and gods. The prince advances to Parmunca, where Chimu's skirmishers resist and
    lose ground after fighting. The prince then asks his father, the Ynca, to send
    twenty thousand warriors to end the campaign through overwhelming force.
  language: English
