canonical_text:
  quote: ''
  summary: The passage describes the usefulness and quality of llama meat, then recounts
    a severe contagious disease among llamas and related animals in Peru in 1544-1545.
    The disease spread from tame flocks to wild animals and foxes, caused major losses
    and terror, and led to desperate remedies such as killing and burying infected
    flocks. The narrator recalls seeing diseased foxes in Cuzco in 1548 and says Indians
    divined from them that Gonzalo Pizarro would be defeated and slain.
  language: English
  quote_policy: summarized
