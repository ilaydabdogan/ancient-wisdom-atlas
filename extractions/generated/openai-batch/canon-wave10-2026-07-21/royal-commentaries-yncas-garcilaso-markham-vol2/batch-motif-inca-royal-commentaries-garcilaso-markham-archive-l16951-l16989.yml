  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In 1544-1545, during the viceroyalty of Blasco Nunez Vela, llamas suffered
    a previously unknown disease called earache or itch.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The disease is described as beginning in the stomach, spreading over the body,
    producing thick scabs, deep scars, and flows of blood and matter.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The disease was very contagious, destroyed whole flocks quickly, caused terror
    among Indians and Spaniards, and led to the loss of two-thirds of paco and huanacu
    flocks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The disease spread from tame animals to wild huanacus and vicunas, but it
    was less fatal among them because of colder climate and less close congregation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The disease also afflicted foxes; the narrator recalls seeing diseased foxes
    entering Cuzco at night and being found alive and dead in streets and squares.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Indians are said to have divined from the foxes that Gonzalo Pizarro would
    be defeated and slain, and the narrator says this later occurred.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the beginning of the plague, one desperate remedy was to kill and bury
    the entire flock that had been attacked.
  category: action
  evidence_refs:
  - ev:5
