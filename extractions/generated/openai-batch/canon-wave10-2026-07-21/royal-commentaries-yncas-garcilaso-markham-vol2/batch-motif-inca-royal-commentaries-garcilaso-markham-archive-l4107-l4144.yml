canonical_text:
  quote: Pachacutec ... means “he who overturns” or “changes the world.”
  summary: The passage says that Ynca Uira-ccocha ordered in his will that his eldest
    legitimate son be renamed Pachacutec. The name is explained as meaning one who
    overturns or changes the world, and the narrator links it to Uira-ccocha’s restoration
    of the empire after crisis. The passage also reports Acosta’s statement that Uira-ccocha
    took his divine name because Uira-ccocha appeared to him in a vision and commanded
    it.
  language: English
  quote_policy: quoted
