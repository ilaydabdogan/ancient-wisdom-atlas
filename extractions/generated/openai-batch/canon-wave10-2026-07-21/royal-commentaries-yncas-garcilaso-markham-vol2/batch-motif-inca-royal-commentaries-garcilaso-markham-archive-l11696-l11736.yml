canonical_text:
  quote: ''
  summary: The passage describes King Ynca Yupanqui’s desire for a new eastern conquest,
    based on ancestral tradition about inhabited and uninhabitable regions. It identifies
    Musu or Moxos as a large inhabited area reachable by a great river system east
    of Cuzco, explains the confluence forming Amaru-mayu, discusses its possible relation
    to La Plata, recounts the Spanish naming of La Plata from reports of silver near
    river sources, and gives a tentative interpretation of the native name Parahuay
    as “Let me rain.”
