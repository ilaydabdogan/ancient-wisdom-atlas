  quote: ''
  summary: The passage reports that Inca accounts preserve a detailed account of a
    river expedition and conquest ordered by King Ynca Yupanqui, including battles,
    subjugated provinces, and deeds of ancestral prowess. The narrator declines to
    repeat details he considers doubtful, but notes that Spaniards have encountered
    vestiges of Yupanqui's expedition. The passage then introduces Diego Aleman, and
    an editorial note compares a later voyage into the Madera River with the earlier
    Inca voyage.
