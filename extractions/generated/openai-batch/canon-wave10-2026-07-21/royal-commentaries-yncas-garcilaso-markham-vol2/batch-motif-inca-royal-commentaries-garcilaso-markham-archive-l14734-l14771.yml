  summary: The passage describes peoples portrayed as lacking property and clothing,
    practicing warfare, abduction, cannibalism, and fragmented local worship. After
    their conquest or submission, King Tupac Ynca Yupanqui orders teachers, priests,
    and learned men to instruct them in settlement, cultivation, clothing, irrigation,
    Inca laws, and Sun worship, while idols and cannibalism are prohibited.
