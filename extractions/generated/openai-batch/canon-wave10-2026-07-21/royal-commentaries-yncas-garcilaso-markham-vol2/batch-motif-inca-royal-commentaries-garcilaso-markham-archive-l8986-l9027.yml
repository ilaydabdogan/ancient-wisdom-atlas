  quote: ''
  summary: A defeated chief seeks pardon for himself and his people. The Ynca prince
    receives the plea favorably, grants pardon, restores the chief’s estate, and requires
    him to cast down his idols, worship the Sun, and acknowledge Ynca sovereignty.
    Chimu accepts and promises obedience to the Ynca’s religion and customs.
