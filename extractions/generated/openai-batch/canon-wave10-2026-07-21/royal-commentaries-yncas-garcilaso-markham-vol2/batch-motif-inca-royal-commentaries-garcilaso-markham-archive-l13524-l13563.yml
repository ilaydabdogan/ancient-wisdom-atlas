canonical_text:
  quote: secret judgments of God
  summary: 'A report from Chile recounts attacks on Osorno and Villarica: sieges,
    destruction of sacred images, killing of sentries, children, monks, and clerics,
    carrying off of women and nuns as captives, rescue of some captives, and the burning
    and destruction of Villarica. The narrator frames these events as permitted by
    God and as divine judgments, before returning to the life of Ynca Yupanqui.'
  language: English
  quote_policy: quoted
