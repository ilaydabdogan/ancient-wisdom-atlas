  quote: ''
  summary: The passage reports a claim that Christians had found only a small visible
    portion of concealed treasure, while the rest remained hidden. It comments on
    Inca uses of gold as ornament, offering, and burial accompaniment, then identifies
    Paullu and his kin in relation to baptism and Spanish service. It ends by quoting
    Gomara on the precious-metal household service and gold statues of the Inca.
  language: English
