canonical_text:
  quote: ''
  summary: The passage reports confusion in Peru about Valdivia's defeat, then quotes
    news from Chile describing Valdivia's encounters with rebel Araucos. The Araucos
    avoid open ground because of Spanish cavalry, remain in hills and woods, refuse
    terms, and resolve to die rather than serve Spaniards. News reaches an old Arauco
    captain, formerly famous in war, who comes out of retirement to see how a small
    Spanish force can hold so many warriors in check and to determine whether the
    Spaniards are devils or immortals. He reaches a hilltop to observe.
  language: English
