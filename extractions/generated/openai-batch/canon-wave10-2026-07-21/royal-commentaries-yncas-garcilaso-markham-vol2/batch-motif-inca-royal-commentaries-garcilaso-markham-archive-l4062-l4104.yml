canonical_text:
  quote: ''
  summary: 'The passage describes the valley of Yucay near Cuzco: its mild climate,
    surrounding snowy mountains, streams, forests, pastures, cultivated farms, and
    river. It also states that invalids from Cuzco go there, that Spaniards value
    having property there, and that the Ynca Uira-Ccocha favored the valley, built
    edifices, enlarged the House of the Sun, increased its attendants, and was connected
    with a message concerning an apparition.'
