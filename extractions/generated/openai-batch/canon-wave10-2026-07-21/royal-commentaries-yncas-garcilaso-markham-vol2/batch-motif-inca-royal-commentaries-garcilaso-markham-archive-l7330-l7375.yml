canonical_text:
  quote: ''
  summary: The passage describes how festival fire for sacrifice was obtained by concentrating
    the Sun’s rays with a polished concave plate on a large chipana bracelet to ignite
    cotton. This fire consumed the sacrifice, roasted meat, and was carried to the
    temple of the Sun and convent of virgins to be kept all year; its extinction was
    an evil omen. If no sunlight was available, fire was made with friction sticks
    called Vyaca, but this was considered a bad omen because the Sun was thought to
    be angry. The feast meat and Canea bread were distributed publicly to all present.
  language: English
  quote_policy: summarized
