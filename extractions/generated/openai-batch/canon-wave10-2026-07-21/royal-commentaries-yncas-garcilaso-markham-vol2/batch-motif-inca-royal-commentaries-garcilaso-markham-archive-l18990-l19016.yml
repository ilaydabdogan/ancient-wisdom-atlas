canonical_text:
  quote: ''
  summary: After earlier subjugations, the Ynca returns to Quitu and spends two years
    building edifices, irrigation channels, and other public benefits. He then assembles
    a large army, descends to the coast near Tumpiz, and offers the people peace or
    war. The passage describes Tumpiz customs, including a head-garland mark, elite
    entertainers, worship of tigers and lions, and sacrifice of human hearts and blood.
    Tumpiz and other named districts submit without resistance because they fear the
    Ynca's power.
  language: English
  quote_policy: summarized
