  summary: The passage introduces the third of four annual solemn feasts celebrated
    by the Ynca court. Cusqui-raymi is held when maize begins to sprout. Lambs and
    ewes are offered to the Sun, with a prayer that frost not damage the maize. The
    passage also notes earlier and lesser festivals, including the feast of the Sun,
    a knighting feast for royal novices, and ceremonies held in the temple of the
    Sun.
