canonical_text:
  quote: ''
  summary: A matron identified as the Mama-cuna pleads with the Ynca Huayna Ccapac
    to spare a submitted province, invoking his descent from the Sun, his father,
    and his ancestors' mercy. She offers herself first to his justice if he refuses.
    Other women wail and ask mercy for their male relatives. The Ynca reflects, his
    anger is softened, and he raises his step-mother, calls her common mother, thanks
    her, and says she has redeemed the lives and villages of her people.
  language: English
  quote_policy: summarized
