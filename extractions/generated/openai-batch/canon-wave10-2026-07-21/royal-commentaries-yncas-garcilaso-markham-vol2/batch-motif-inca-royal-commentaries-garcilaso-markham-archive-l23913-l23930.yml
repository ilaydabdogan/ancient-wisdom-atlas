  summary: The passage reports a decision involving transfer to the royal crown and
    a prohibition on return to the Indies, notes correspondence from Valladolid and
    uncertainty about a petition, then transitions to the deeds of the Spaniards who
    conquered the empire. A footnote says Don Melchor Carlos Ynca apparently did not
    present his relatives' petition because knowledge of many persons of royal blood
    might injure his own claims; it also records his death and the death of his young
    son.
