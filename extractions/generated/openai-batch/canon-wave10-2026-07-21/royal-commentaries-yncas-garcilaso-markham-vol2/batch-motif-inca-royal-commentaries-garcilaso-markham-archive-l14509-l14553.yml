canonical_text:
  quote: ''
  summary: Tupac Yuca Yupanqui orders his army toward Chachapoya after reinforcements
    arrive. Following an Inca custom, he sends a messenger offering the Chachapuyas
    a choice between peace and war. They refuse vassalage and declare willingness
    to die defending their liberties. A fierce war follows, with deaths and wounds
    on both sides. The passage then explains that the Chachas had long prepared for
    Inca advance by building fortresses, closing narrow passes, and relying on a rugged
    landscape where some roads require descent by ropes.
