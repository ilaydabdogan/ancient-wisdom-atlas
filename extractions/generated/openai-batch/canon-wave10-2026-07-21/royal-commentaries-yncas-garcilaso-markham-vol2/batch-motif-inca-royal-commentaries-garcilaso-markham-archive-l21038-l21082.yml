canonical_text:
  quote: ''
  summary: The narrator recalls a punishment, then describes a terrace near the later
    convent of St. Francis where trained bullocks ploughed under Indian herdsmen.
    The site’s later church history is noted. The bullocks’ appearance in Cuzco is
    described as an admired public spectacle. The passage then gives falling prices
    for cows and other livestock as animals became abundant, and notes wild and herded
    cows in the windward islands kept partly for dairy products.
  language: English
  quote_policy: summarized
