canonical_text:
  quote: ''
  summary: The passage describes Inca public-service obligations imposed instead of
    tribute, including infrastructure repair, temple construction, agricultural work,
    chasqui service, and annual maintenance of roads, bridges, and irrigation channels.
    It says the work was regulated equally and performed for the common good. The
    narrator cites Father Bias Valera, challenges a historian who called the laws
    oppressive, notes Spanish royal confirmation of such laws, and returns to Prince
    Huira-ccocha defending ancestral and personal honour.
  language: English
