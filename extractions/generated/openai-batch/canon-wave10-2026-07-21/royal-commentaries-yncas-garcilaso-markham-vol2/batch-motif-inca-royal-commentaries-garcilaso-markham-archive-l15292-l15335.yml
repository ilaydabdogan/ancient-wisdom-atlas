  quote: ''
  summary: The passage describes the Ynca Tupac Yupanqui assembling an army at Tumipampa,
    conquering provinces near Quitu, encountering populations described as politically
    and ritually disorganized, teaching them crafts and agriculture, building storehouses
    on the royal road, withholding Sun temples because of local rudeness, exacting
    a tribute of lice, and receiving western ambassadors who ask to become his vassals
    with presents.
