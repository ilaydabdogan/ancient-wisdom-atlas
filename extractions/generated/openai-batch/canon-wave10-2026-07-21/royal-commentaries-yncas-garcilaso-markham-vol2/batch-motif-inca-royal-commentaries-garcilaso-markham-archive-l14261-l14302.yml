canonical_text:
  quote: ''
  summary: 'The passage describes the construction history of a great Inca fortress:
    Ynca Yupancjui is said to have commenced it, while some attribute its beginning
    to Pachacutec because he left plans, a model, and gathered stones. The work took
    fifty years and was associated with Huayna Ccapac''s time, though indigenous report
    says it was never finished because additional work, including the so-called “tired
    stone,” remained incomplete. The passage says these and other works were stopped
    by civil wars between Huáscar Ynca and Atahuallpa and by the arrival and destruction
    caused by the Spaniards.'
