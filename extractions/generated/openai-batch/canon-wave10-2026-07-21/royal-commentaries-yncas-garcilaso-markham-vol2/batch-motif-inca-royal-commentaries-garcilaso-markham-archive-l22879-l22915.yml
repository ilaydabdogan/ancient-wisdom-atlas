  summary: Atahuallpa's experienced troops march to engage Huascar before more forces
    can join him. They find him on a plain west of the city, fight an all-day battle,
    defeat his inexperienced troops, pursue and capture Huascar, and capture other
    elites. Huascar's chosen men die in his presence, some killed by the enemy and
    others killing themselves when he is taken.
