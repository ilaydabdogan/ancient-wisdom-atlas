canonical_text:
  quote: ''
  summary: 'The passage describes a method for smelting silver in Potocsi before quicksilver:
    a lead-like metal called surachec was found and used as a flux with silver; proportions
    were adjusted by experience; first melting used portable clay ovens placed on
    hillsides to catch suitable natural wind; later meltings in houses with copper
    pipes purified the silver and consumed the lead.'
  language: English
  quote_policy: summarized
