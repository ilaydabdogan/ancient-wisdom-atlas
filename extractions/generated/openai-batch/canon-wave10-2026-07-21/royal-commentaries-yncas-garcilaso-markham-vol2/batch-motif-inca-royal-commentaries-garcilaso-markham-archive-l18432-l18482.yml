  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Balboa’s version, Queen Mama Ocllo interceded for the accused group, who
    were spared on condition that they always work as servants of the Yuca/Ynca and
    the Sun and not be counted among the rest of the empire’s inhabitants.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The footnote says the amnesty was granted at Yanayacu and that Yanayacu-cuna
    was corrupted to Yanacona, later applied to palace servants and then to domestic
    servants, distinct from mitayos.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The editor doubts Balboa’s etymology and states that yana means both black
