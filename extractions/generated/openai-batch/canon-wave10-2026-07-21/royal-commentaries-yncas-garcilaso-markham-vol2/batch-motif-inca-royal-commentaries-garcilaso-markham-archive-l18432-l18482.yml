canonical_text:
  quote: ''
  summary: The passage describes the hill of Potocsi as an isolated, snow-touched
    mining hill; notes earlier ownership and Acosta’s account of metals and quicksilver;
    states that Yanacuna servants discovered the mines; and includes a footnote comparing
    explanations of the term Yanacuna/Yanacona, including a Balboa origin story involving
    rebellion, Queen Mama Ocllo’s intercession, and perpetual service to the Yuca/Ynca
    and the Sun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hill of Potocsi is described as sugar-loaf shaped, rising alone from a
    plain, with a round summit and occasional early-morning snow because of the cold
    situation.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The site is said to have belonged first to Gonzalo Pizarro and later to Pedro
    de Hinojosa, with an editorial note correcting the name to Alonzo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Father Acosta is cited as having written at length on the gold, silver, and
    mercury found in the empire.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator says he will briefly relate notable matters about how metal was
    fluxed before Spaniards discovered mercury.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mines of the hill of Potocsi are said to have been discovered by Indian
    servants of Spaniards called Yanacuna.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Yanacuna is defined in the passage as a man under obligation to perform the
    duties of a servant.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A footnote reports Balboa’s version in which a brother of Tupac Yuca Yupanqui
