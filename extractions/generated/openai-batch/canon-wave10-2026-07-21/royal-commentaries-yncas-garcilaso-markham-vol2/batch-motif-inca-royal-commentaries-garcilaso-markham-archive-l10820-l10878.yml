canonical_text:
  quote: In reality, they were all one, as the Indians give us to understand in calling
    them all Ccapac Ayllu
  summary: The passage explains that the Inca blood royal were divided by ayllus or
    lineages while still belonging to one royal descent from King Manco Ccapac. It
    corrects Spanish historians who treated the divisions as separate descents, glosses
    Ccapac Ayllu as the august lineage of royal blood, defines Ynca and Palla as male
    and female royal designations, and then lists later Spanish residents of the same
    space with footnote biographies.
  language: English
