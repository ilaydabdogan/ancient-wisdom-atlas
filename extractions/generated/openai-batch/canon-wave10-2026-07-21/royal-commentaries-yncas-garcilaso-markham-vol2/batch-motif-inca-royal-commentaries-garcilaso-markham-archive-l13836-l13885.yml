  summary: The passage describes masonry using sticky red clay mortar, then introduces
    a chapter on three enclosing walls. It states that, on the gradual slope before
    a hill and facing a wide plain where enemies might approach, three long walls
    were constructed one before another and were reported to form a half-moon joining
    another wall over the city. Editorial notes describe surviving walls, measurements,
    flanking walls, angles, heights, and later crosses visible from the city, while
    also correcting the half-moon description.
