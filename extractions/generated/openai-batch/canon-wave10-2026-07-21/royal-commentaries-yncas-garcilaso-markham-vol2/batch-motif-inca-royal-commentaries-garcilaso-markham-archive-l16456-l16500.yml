canonical_text:
  quote: ''
  summary: 'The passage describes the practical uses of the maguey tree and related
    plant materials: bitter sap for cleaning and medicinal washing; leaves for cordage,
    shoes, ropes, slings, cloth, thread, and bird nets; rain-water collected in curved
    leaves for medicine and beverages; and chuchan roots made into soap cakes. A note
    says the material is from Father Blas Valera, with the narrator adding the lengths
    of the nets.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sap is described as very bitter and useful for removing stains, curing
    sores and inflammations, and making a strengthening medicinal wash when boiled
    with roots in rain-water.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ripe dry leaves from the foot of the stem are used to make strong cordage,
    soles of shoes, ropes, and cables.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Leaves cut before drying are placed in a stream current and then spun into
    lighter string used for slings and cloth where wool or cotton are lacking.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A finer material from the leaves is made into delicate green thread for nets
    used to catch birds.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bird nets are placed in narrow defiles from rock to rock or from tree to tree
    while people watch birds from below.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The green color and fineness of the nets make them difficult for birds to
    distinguish from the ground and trees.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The nets are described as large, with lengths ranging from six to twenty brazas.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Curved maguey leaves collect rain-water that is said to be good for several
