canonical_text:
  quote: ''
  summary: 'The passage describes wards near the principal square: Huaca-puncu, translated
    as the gate of the sanctuary, and a large ward to its south identified as the
    ward of the schools. The schools were founded by King Ynca Rocca and called Yacha-huasi,
    the house of teaching. Amautas, described as wise men, masters, or philosophers,
    and Haravecs, described as poets, lived there with many disciples and were highly
    esteemed.'
