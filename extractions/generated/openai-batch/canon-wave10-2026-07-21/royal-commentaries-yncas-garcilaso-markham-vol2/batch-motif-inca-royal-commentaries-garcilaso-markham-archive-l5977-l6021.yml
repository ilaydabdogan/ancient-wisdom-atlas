  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The natives of the provinces regard these edifices as great favours because
    they make them citizens of Cuzco.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: He orders fortresses on the frontiers and royal palaces in pleasant valleys
