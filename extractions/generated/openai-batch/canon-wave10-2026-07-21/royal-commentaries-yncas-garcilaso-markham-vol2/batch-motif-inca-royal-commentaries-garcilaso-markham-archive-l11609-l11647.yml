canonical_text:
  quote: "“her soul might be cured”"
  summary: A royal Indian woman near death asks to be taken to a hospital because
    of indulgences and graces associated with dying there. In the hospital church
    she arranges her deathbed, grave, burial habit, funeral wax, and sacraments, prays
    for four days, dies, and receives a solemn public funeral attended by civic and
    ecclesiastical dignitaries as an example for other Indians. A footnote identifies
    a manuscript account by the hospital chaplain concerning Inca superstitions and
    rites.
  language: English
  quote_policy: quoted
