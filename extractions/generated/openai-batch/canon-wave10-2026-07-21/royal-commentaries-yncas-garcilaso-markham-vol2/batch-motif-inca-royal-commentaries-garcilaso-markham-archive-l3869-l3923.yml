canonical_text:
  quote: ''
  summary: During the Ynca's second circuit of the empire, news arrives that Hanco-huallu,
    king of the Chancas, cannot endure being a vassal under Ynca rule. Though treated
    favorably, he longs to abandon his hereditary lands, escape Ynca subordination,
    seek new lands, and become an independent chief or die attempting it. He secretly
    tells a few followers, and they move with wives and children in small parties
    toward the empire's limits.
  language: English
