canonical_text:
  quote: ''
  summary: A manager sends ten melons to his master on the backs of two Indians, along
    with a letter, warning the carriers that the letter will report any theft. The
    carriers hide the letter and eat one melon, then eat another to make the loads
    equal. When they deliver eight melons, Antonio Solar reads the letter, asks about
    the two missing melons, and says the letter reports that ten had been given. The
    passage explains that in those early days the Indians did not know what letters
    were and imagined written letters as messengers or spies that could speak and
    report what they saw.
  language: English
