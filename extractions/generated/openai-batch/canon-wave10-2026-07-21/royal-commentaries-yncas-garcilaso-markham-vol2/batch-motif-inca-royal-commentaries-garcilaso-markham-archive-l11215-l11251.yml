canonical_text:
  quote: ''
  summary: The passage describes buildings near the principal square and a stream,
    including three great Ynca halls used for festivals on new moons and solstices.
    It then recounts a general rising in which Indians burned the city, spared several
    named halls and sacred buildings, attacked the fourth hall occupied by Spaniards
    with burning arrows, and, in the narrator's Christian interpretation, failed to
    destroy it because God prevented it through miracles that allowed Catholic faith
    and Spanish rule to enter the empire.
