canonical_text:
  quote: ''
  summary: The passage recounts a lawful marriage involving Huayna Ccapac and his
    first cousin Mama Runtu, explains royal titles and names including Auqui and Amaru,
    describes an ordinance by Tupac Ynca Yupanqui and his Council declaring two women
    legitimate queens so that their sons could inherit, names Huascar and Manco Ynca
    in Huayna Ccapac’s family line, and ends with Tupa Ynca Yupanqui falling ill and
    summoning Prince Huayna Ccapac.
  language: English
  quote_policy: summarized
