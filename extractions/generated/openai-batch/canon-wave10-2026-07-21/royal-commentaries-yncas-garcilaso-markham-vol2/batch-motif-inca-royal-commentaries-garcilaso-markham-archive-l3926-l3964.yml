  quote: ''
  summary: Hanco-huallu seeks liberty without betraying or offending the generous
    Ynca Uira-ccoclia, gathers a large body of followers, and leads them away from
    their homeland. The group travels through desert places, avoids settling near
    the Ynca empire because they fear renewed subjection, turns toward the forests
    east of the Andes, and is later said to have settled by a great river and large
    lakes, where unspecified wonderful deeds were remembered in tradition.
