canonical_text:
  quote: ''
  summary: Huayna Ccapac addresses his step-mother as a good mother, authorizes her
    to return to her people with pardon and favors, and sends four Yncas without armed
    followers to establish peace and good government. The Ynca then returns with his
    army and orders the troops toward the coast. The Chachapuyas, moved by the Ynca's
    clemency, become loyal vassals and commemorate the conversation site by enclosing
    it as a sacred place with three walls. The remains are later said to have been
    destroyed by treasure seekers.
  language: English
  quote_policy: summarized
