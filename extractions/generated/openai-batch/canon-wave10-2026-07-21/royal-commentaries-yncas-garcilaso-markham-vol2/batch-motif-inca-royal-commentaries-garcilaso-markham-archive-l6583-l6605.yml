  summary: The chapter heading announces that the Yncas subdue two coast valleys and
    that the Chinchas answer their message defiantly. The paragraph says that after
    a festival the Yncas paused warfare for three or four years, improved and administered
    conquered provinces, then turned toward subjugating coast valleys beyond Hanasea.
    They held a council of war, ordered thirty thousand soldiers to march, and prepared
    another thirty thousand as a rotating reserve because the coast valleys were unhealthy
    and dangerous for people from the Sierra.
