canonical_text:
  quote: ''
  summary: A body of Indians, aided by spies, surprises a Spanish town at dawn while
    most residents are asleep. They surround houses, set them on fire, prevent escape,
    take the fort and artillery, kill many Spaniards, seize spoil, cut loose vessels
    in the river, and leave only a few survivors who escape in canoes. The narrator
    attributes the attack to vengeance for earlier deaths and the sale of women and
    children.
  language: English
