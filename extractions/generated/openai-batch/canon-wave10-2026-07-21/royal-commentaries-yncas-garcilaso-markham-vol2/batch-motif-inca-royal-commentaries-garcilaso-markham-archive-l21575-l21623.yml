canonical_text:
  quote: ''
  summary: The narrator reports that Indians interpreted Atahuallpa's death as divine
    punishment by the Sun carried out through the Spaniards, treated the Spaniards
    as sent by the Sun and associated with Uira-ccocha, and told children a fable
    that Spanish cocks crowed the name Atahuallpa to preserve the tyrant's disgrace.
    Children and the narrator's schoolfellows sang the name in imitation of a cock's
    crow.
  language: English
  quote_policy: summarized
