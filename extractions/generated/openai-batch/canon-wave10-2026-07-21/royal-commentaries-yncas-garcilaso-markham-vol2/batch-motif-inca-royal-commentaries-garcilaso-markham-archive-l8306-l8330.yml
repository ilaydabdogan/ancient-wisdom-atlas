    emphasizing gifts, promises, and hunger as instruments of subjugation. It then
    describes the Yncas treating this conquest as a major success and ordering a small
    but remarkable fortress at Huarcu as a lasting memorial. The narrator says he
    saw the structure in 1560, when it still showed traces of its former grandeur.
