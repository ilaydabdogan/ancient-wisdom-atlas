canonical_text:
  quote: ''
  summary: The passage describes how llamas are loaded without saddle or lasso, how
    merchants travel with tents and goods between Cuzco and Potocchi, and how cuca,
    cloth, llamas, and silver are valued or transported. The narrator states that
    he saw these practices and spoke with travelers. The passage emphasizes that Spaniards
    and Indians could travel and trade with valuable goods without fear of thieves,
    and that rents and dealings were secured by verbal promises rather than written
    deeds.
