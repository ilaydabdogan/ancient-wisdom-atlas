  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The narrator says he heard this explanation and sometimes saw the practice,
    but was told it was done more for joking than from belief.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Roots called batatas by Spaniards and apichu by the Indians of Peru are said
