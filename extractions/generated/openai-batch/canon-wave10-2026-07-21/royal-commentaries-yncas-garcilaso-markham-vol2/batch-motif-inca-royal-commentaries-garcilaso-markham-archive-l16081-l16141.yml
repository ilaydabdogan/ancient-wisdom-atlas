canonical_text:
  quote: ''
  summary: The passage describes several underground vegetables cultivated and eaten
    by the Indians of Peru, including papa, oca, anus, and apichu/batatas. It notes
    methods of cooking and preserving them, indigenous and Spanish names, and a reported
    joking practice of holding a wand or switch while eating anus because it was said
    to harm generative powers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Indians sow many vegetables grown under the ground,
    which sustain them especially where maize is absent.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Papa is described as an important root that serves instead of bread and is
    eaten boiled, roasted, or in stews.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Papas are exposed to sun and frost for preservation and are then called chume.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Oca is described as a valued root, about as large and thick as a man's middle
    finger, eaten raw because it is sweet, as well as boiled and in stews.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Oca is exposed to the sun for preservation and is then called cavi; the passage
    says it tastes like a conserve without added sweetener.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Anus is described as a root like oca in shape but not taste, and it can only
    be eaten cooked.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Indians say that anus injures the generative powers, and some men hold
