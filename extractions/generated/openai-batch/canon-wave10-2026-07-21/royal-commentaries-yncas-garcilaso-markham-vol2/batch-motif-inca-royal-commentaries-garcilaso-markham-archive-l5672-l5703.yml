  text: The same mnemonic system could set forth sacrifices, ceremonies for festivals,
    ordinances for widows and the poor, and other traditions preserved in memory.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each thread and knot was said to bring to mind the matter it had been arranged
    to suggest.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage compares this use of knots with remembering Catholic commandments,
    articles of faith, and works of mercy by their numbers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Indians remembered by knots what fathers and grandfathers had taught by tradition,
