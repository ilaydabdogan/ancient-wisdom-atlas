canonical_text:
  quote: ''
  summary: The passage explains how Quipus, threads, knots, and numbers served as
    mnemonic aids for laws, punishments, sacrifices, ceremonies, ordinances for widows
    and the poor, and inherited traditions. It says these matters were received with
    attention and veneration as sacred matters or as laws of the Yncas. The narrator
    recounts examining Quipus with Indians and Curacas at Cuzco when tribute was paid,
    comparing tribute accounts recorded on knots because the Curacas distrusted Spaniards.
  language: English
  quote_policy: summarized
