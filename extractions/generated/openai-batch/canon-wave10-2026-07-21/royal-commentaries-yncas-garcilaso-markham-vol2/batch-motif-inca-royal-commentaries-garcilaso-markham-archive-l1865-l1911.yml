canonical_text:
  quote: They might more properly be called diligent fathers of families, or careful
    stewards, than kings.
  summary: 'The passage says that records ordered by Viceroy Toledo show the Ynca
    kings treated conquered subjects benignly: local laws and customs were mostly
    retained, estates were restored, soldiers were forbidden to seize property, tributes
    were light, and the rulers distributed food, clothing, and gifts. The passage
    explains the honorific Ccapac Titu as denoting a powerful, liberal, magnanimous
    ruler and says the kings were beloved by their people.'
  language: English
