canonical_text:
  quote: ''
  summary: The passage describes preserved bodies of Inca kings kept in Cuzco chapels
    or oratories, their removal by the Marquis of Cañete to the City of the Kings
    to combat idolatry, and the author’s explanation that cold high-altitude drying
    and bitumen may have produced their incorrupt condition. It ends with the author
    recalling that Huayna Ccapac’s finger felt hard and rigid like wood.
  language: English
