canonical_text:
  quote: ''
  summary: 'The passage describes an Inca administrative ordering of property: estates,
    trees, flocks, arable land, yields, tribute, and labor obligations are counted
    and recorded. Public notice is given of required service to the Ynca, Curacas,
    and the public, while limits are placed on overwork by Curacas and officials.
    Boundary marks and names are assigned to provinces and natural features, with
    a note that such places later receive veneration and respect. Village lands are
    separated, and gold and silver mines are granted for use and adornment rather
    than treasury accumulation.'
  language: English
  quote_policy: summarized
