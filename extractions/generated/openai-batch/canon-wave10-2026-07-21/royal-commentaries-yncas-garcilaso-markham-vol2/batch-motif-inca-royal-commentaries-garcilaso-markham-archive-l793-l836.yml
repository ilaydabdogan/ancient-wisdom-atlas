  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The land in the hoyas is not ploughed; sowing is done by making holes with
    thick stakes and placing fish heads with two or three grains of maize in each
    hole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
