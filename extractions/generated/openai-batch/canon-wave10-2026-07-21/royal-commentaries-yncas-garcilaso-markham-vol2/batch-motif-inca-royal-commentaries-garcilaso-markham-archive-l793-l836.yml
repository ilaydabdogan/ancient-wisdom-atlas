canonical_text:
  quote: ''
  summary: The passage describes hot sandy coastal land where inhabitants dig hoyas
    down to sea moisture, plant maize in holes with fish heads as manure, and benefit
    from abundant small fish said to be provided by divine providence. It notes that
    the Indians do not know who invented the hoyas and attributes the practice to
    necessity, comparing it with agricultural terracing elsewhere.
