canonical_text:
  quote: ''
  summary: The passage describes Inca festival song and dance praising the ruler,
    royal ancestors, and famous members of the royal bloodline. It also reports that
    Huayna Ccapac ordered a gold chain so dancers could hold it instead of joining
    hands, increasing the solemnity and magnificence of a festival celebrating his
    son's birth. The chain is described through testimony as exceptionally large,
    measured against the great square of Cuzco, Huacaypata.
  language: English
