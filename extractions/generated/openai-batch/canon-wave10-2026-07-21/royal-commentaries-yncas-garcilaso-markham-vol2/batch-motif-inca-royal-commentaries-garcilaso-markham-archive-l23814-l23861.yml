  summary: The passage describes Huayna Ccapac's solemn feast in honor of the Sun
    on the Cañaris plain, the rich royal and sacred buildings there, the preservation
    of the feast-name in his Tumijpampa lineage, Atahuallpa's destruction of lineages
    nearest the royal tree, and footnote material listing Ynca lineages and later
    claims of descent from the children of the Sun.
