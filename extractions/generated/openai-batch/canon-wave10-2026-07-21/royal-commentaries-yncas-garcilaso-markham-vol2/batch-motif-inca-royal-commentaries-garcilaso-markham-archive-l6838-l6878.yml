canonical_text:
  quote: ''
  summary: The passage describes a valley near Chincha whose people set up Pachacamac
    and then invented Chincha Camac as a special sustainer of their valley. Their
    faith in this local god supports their resistance. Ynca forces try to avoid destroying
    the Yuncas while continuing military pressure. Ccapac Yupanqui, after delays and
    concern for his troops in a hot climate, sends an ultimatum demanding submission
    within eight days or threatening death and resettlement of the valley. The Yuncas
    are alarmed by the threat.
  language: English
