literal_observations:
- id: obs:1
  text: Buildings facing the Cassana are described as forming the palace of Huayna
    Ccapac; the narrator remembers a great hall and a beautiful round tower in the
    square before the building.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The round tower is identified as the first lodging the Spaniards had in the
    city, and the narrator says the rest of the palace had been pulled down by his
    time.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the first distribution, portions of the palace were assigned to Hernando
    Pizarro, other named people, and one part was used as a prison for Spaniards.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: East of the Amaru-cancha, with the Street of the Sun crossing it, was the
    Aclla-huasi, glossed as the house of chosen ones, where virgins dedicated to the
    Sun lived.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: During Manco Yaca's siege of the Spaniards in Cuzco, the Indians shot arrows
    into the town that were bound with burning tinder.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The attackers fired at the houses except for the temple of the Sun, the house
