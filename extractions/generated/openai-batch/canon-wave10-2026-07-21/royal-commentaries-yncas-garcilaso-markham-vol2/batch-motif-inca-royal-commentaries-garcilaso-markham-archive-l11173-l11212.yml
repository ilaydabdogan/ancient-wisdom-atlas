canonical_text:
  quote: ''
  summary: The passage describes remembered remains and later distribution of the
    palace of Huayna Ccapac in Cuzco, the location of the Aclla-huasi or house of
    chosen virgins dedicated to the Sun, and a note on Manco Yaca's siege in which
    fire arrows were used while certain sacred or royal buildings were spared and
    one Spanish-occupied hall was burned.
  language: English
