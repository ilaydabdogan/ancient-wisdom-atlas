canonical_text:
  quote: ''
  summary: 'The passage describes Inca preparations for the conquest of Chile: armies
    are sent toward Copayapu under named and royal officers, messengers demand submission
    to the Ynca as child of the Sun and Lord of the four quarters, the people of Copayapu
    resist, and they are portrayed as torn between fear of divine curse and attachment
    to liberty, ancestral gods, and inherited customs.'
