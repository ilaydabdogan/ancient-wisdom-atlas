canonical_text:
  quote: ''
  summary: The passage opens a chapter on further conquests and says the Ynca returned
    to Cuzco to administer his kingdoms. A footnote reports that Tupac Yupanqui enriched
    temples and palaces on the islands of Lake Titicaca, resettled loyal mitimae families
    from many tribes to serve the temple of the Sun, appointed Apu Ynca Sucsu as governor,
    names decorated temple doors, recounts a tradition that Titicaca's sanctity came
    from the sun rising behind the island after days of darkness, and notes a later
    Christian descendant who carved a miraculous Virgin image at Copacabana.
  language: English
  quote_policy: summarized
