canonical_text:
  quote: ''
  summary: The passage describes Tupac Ynca Yupanqui's advance through difficult mountain
    passes and fortified positions near Pias and Chirmac-cassa. At Pias, vulnerable
    old people and children left behind are treated kindly by order of the Ynca. At
    the snowy pass of Chirmac-cassa, three hundred advance scouts are killed by a
    sudden fall of snow, delaying the army; afterward the Ynca continues toward Cuntur-marca
    amid further fortified obstacles.
