canonical_text:
  quote: ''
  summary: 'The passage describes an Ynca campaign into Sausa/Xauxa and gives an ethnographic
    account of the Huanca/Huanea people: their claimed descent from a man and woman
    who emerged from a fountain, their treatment of war prisoners, fortified villages
    and land disputes, and their pre-Ynca worship of a dog figure with dog-meat feasts
    and dog-head trumpets used in festival and war.'
  language: English
  quote_policy: summarized
