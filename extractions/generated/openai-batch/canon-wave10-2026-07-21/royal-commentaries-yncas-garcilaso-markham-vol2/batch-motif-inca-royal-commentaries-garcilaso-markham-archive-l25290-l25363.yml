  quote: ''
  summary: An index section gives etymological notes on several Inca lineage names
    and lists named royal, political, military, architectural, and legendary figures
    with page references. It includes entries for Cuzco fortress architects, royal
    wives and descendants, chiefs, generals, Atahuallpa, Ccapac Yupanqui, and Ayar
    figures described as legendary brothers of Manco Ccapac.
  language: English
  quote_policy: summarized
