canonical_text:
  quote: ''
  summary: The passage describes the practical uses of the animals’ leather, especially
    for shoes and Spanish horse gear, and the use of large droves of the animals to
    carry goods between Cuzco and the Potocchi mines. It also describes their load
    limits, slow pace, tendency to lie down when over-urged, spitting as defense,
    and the practice of using spare unloaded animals to replace tired pack animals.
  language: English
  quote_policy: summarized
