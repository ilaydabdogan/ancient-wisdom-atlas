canonical_text:
  quote: ''
  summary: The passage reports that descendants of the Yncas living in Musu intended
    to return to Cuzco with their families, but after hearing that Huayna Ccapac had
    died and that Spaniards had seized the country and destroyed the Ynca empire,
    they decided to remain in Musu. The Musus respect them and take guidance from
    them in peace and war. The passage also describes a very wide river in the Musu
    country, crossed by canoe over two days, and includes an editorial geographical
    note about the Amaru-mayu or Madre de Dios river and later explorations.
  language: English
