canonical_text:
  quote: "“the mother and lady of the ancient empire”"
  summary: The author explains that memories of ancient deeds have been damaged by
    oral transmission, conquest, and changes of government, and states his aim to
    preserve surviving traditions by describing Cuzco. He recounts that King Manco
    Ccapac selected the Cuzco valley for its terrain, streams, salt-water fountain,
    fertility, and climate, and founded an imperial city there according to the will
    of the Sun, shown by the sign of a golden sceptre. The passage says the Sun desired
    to have his court there and to make the place the head of his empire.
  language: English
  quote_policy: quoted
