canonical_text:
  quote: ''
  summary: As Huayna Ccapac and his councillors arrange government for newly subdued
    peoples, royal-blood officers are to be sent to instruct them in Inca religion,
    laws, and customs and to organize garrisons. Native people are ordered to carry
    Inca captains by balsa over an arm of the sea to a river mouth. After the Inca
    returns to Tumpiz, conspiring Curacas plan to use the sea crossing to kill the
    captains by dividing the transport into two voyages.
  language: English
  quote_policy: summarized
