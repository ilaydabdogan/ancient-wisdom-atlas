canonical_text:
  quote: ''
  summary: The passage describes Inca and related cosmetic practices, including ychma
    powder applied near the eyes, occasional festive use by the Pallas, a nine-day
    milky facial treatment, and the rejection of claims that the Yncas and their vassals
    painted their faces in different colors for war or festivals. It then turns to
    silver extraction near Potocchi, explaining the naming of a smaller hill as Huayna
    Potocchi and the larger as Hatun Potocchi, likened to youth and elder or father
    and son, and noting early difficulty in fluxing silver before quicksilver was
    known.
  language: English
  quote_policy: summarized
