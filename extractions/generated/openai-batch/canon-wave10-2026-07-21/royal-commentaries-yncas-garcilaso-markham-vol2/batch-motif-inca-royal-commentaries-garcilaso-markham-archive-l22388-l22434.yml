canonical_text:
  quote: ''
  summary: 'The passage first notes that Indian girls spun and carded cotton and wool
    skillfully with their fingers, lacking teazels and spinning wheels. It then recounts
    the high value early Spaniards in Peru placed on ordinary items from Spain: Garcia
    de Melo sent three asparagus stalks to Garcilasso de la Vega in Cuzco as the first
    seen there; Garcilasso had them cooked in his apartment, divided the two largest
    among supper guests, kept the third for himself because it was from Spain, and
    the narrator received none. The passage ends by introducing Bartolomé de Terrazas
    bringing three carrots as a notable present.'
