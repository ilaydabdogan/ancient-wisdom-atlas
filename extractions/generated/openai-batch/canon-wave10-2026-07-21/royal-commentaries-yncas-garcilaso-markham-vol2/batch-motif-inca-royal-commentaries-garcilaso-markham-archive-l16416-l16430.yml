canonical_text:
  quote: ''
  summary: 'The passage describes a pepper called chinchi uchuj: it is small and round,
    very hot, grown in small quantities, and highly esteemed. Poisonous reptiles are
    said to flee from the pepper and its plant. A Spaniard from Mexico is reported
    as eating roasted capsicums at every meal, Spaniards returning from the Indies
    are said to prefer these peppers to the East Indies kind, and Indians are said
    to value them highly.'
