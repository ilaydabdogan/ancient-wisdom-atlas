canonical_text:
  quote: ''
  summary: The passage describes part of a solemn Inca investiture for a novice. After
    a rigorous ordeal, a senior royal Ynca removes the novice's raw matting shoes
    and gives him colored cloth shoes. The novice is kissed on the right shoulder
    and addressed as a child of the Sun. Other venerable Yncas invest him with breeches
    as tokens of manhood. The passage explains the relative importance of ear-boring,
    breeches, shoes, and garlands as insignia or honors.
  language: English
  quote_policy: summarized
