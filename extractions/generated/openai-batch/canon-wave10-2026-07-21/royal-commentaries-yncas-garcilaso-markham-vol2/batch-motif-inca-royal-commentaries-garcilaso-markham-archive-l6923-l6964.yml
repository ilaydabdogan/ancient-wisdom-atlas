canonical_text:
  quote: that there might be no memory left of them
  summary: The passage rejects Chincha/Yunca claims of former warlike conquests and
    raids into the Sierra, arguing from distance, terrain, and unfamiliarity with
    thunder. It then describes Ynca Ccapac Yupanqui administering Chincha, requesting
    replacement troops from his brother, introducing new laws and customs, seizing
    people called “sodoms,” burning them alive, destroying their houses, fields, and
    trees, and burning their women and children.
  language: English
  quote_policy: quoted
