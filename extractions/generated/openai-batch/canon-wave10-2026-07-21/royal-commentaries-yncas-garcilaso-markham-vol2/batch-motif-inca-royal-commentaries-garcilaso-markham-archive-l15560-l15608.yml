canonical_text:
  quote: ''
  summary: 'After a conquest, Huayna Ccapac receives the defeated people kindly, gives
    them cloth and presents, orders kind treatment, and commissions irrigation works,
    a temple of the Sun, and a convent. The passage adds that the land later received
    exceptional royal favor, which the narrator connects to the loss of the empire
    and extinction of royal blood. A footnote summarizes Velasco''s account of early
    Quito: Quitu inhabitants, Caras who arrived by river in balsas and conquered them,
    Sun and Moon religion, temples with astronomical columns and pillars, and burial
    in vaults under heaps called tola.'
  language: English
  quote_policy: summarized
