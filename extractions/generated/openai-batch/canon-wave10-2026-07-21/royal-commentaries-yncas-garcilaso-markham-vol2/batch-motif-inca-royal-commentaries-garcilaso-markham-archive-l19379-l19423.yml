canonical_text:
  quote: ''
  summary: After hearing that royal nobles and officers have been killed and left
    unburied, Huayna Ccapac mourns, then marches against rebellious mainland provinces
    and an island. The rebels are defeated, their leaders and chief soldiers are seized,
    denounced for treachery, and sentenced to death according to the manner of their
    earlier killings.
  language: English
  quote_policy: summarized
