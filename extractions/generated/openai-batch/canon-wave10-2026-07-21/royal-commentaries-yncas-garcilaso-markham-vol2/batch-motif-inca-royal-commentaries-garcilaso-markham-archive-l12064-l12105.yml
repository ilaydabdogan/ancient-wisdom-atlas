  quote: ''
  summary: The passage recounts a grant by Governor Castro to Gaspar de Sotelo for
    an expedition, Sotelo's planned cooperation with Ynca Tupac Amaru in Vilcapampa
    using canoes by river, the annulment of Sotelo's grant after rival lobbying in
    favor of Juan Alvarez Maldonado, and Maldonado's assembly of soldiers, horses,
    mares, and canoes. Footnotes identify Castro and give Tupac Amaru's royal lineage
    and later death.
