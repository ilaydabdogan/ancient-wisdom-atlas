    King of Quitu, who would have been heiress of that kingdom.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Atahuallpa is described as intelligent, sagacious, cautious, brave in war,
    noble in bearing, and handsome.
