canonical_text:
  quote: ''
  summary: Huayna Ccapac favors his son Atahuallpa, born of the daughter of the King
    of Quitu, but cannot disinherit his eldest legitimate son Huascar. He summons
    Huascar before an assembly and asks him to leave the kingdom of Quitu to Atahuallpa,
    invoking ancient custom, maternal ancestry, recompense, and fraternal service.
    Huascar agrees obediently.
  language: English
  quote_policy: summarized
