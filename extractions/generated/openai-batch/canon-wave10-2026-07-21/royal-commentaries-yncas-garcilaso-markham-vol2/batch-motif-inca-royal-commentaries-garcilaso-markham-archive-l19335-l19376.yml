canonical_text:
  quote: "“sacrificed the hearts and the blood to their gods”"
  summary: The passage describes islanders and coastal allies betraying Ynca officers
    at sea by dismantling balsas, casting them into the water, killing them with oars
    and captured weapons, then killing remaining officials on the island and in allied
    provinces. They display heads near temple doors and offer hearts and blood to
    their gods, fulfilling promises made for supernatural assistance in the rebellion.
  language: English
  quote_policy: quoted
