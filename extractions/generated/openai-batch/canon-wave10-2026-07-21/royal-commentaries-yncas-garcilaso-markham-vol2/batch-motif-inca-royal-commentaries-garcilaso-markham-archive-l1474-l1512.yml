canonical_text:
  quote: ''
  summary: The passage describes Indian self-sufficiency, moderation, and avoidance
    of begging; cites Father Acosta on a rule forbidding people to change the distinctive
    dress of their province; contrasts Indian views of fixed dress with Spanish changing
    fashions; and recounts the exceptional case of an old woman in Cuzco, Isabel,
    who begged from Spaniards and was despised by Indians.
  language: English
  quote_policy: summarized
