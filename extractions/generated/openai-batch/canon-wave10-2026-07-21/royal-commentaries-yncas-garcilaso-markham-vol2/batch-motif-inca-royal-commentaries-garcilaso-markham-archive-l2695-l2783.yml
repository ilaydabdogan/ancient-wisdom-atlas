- id: obs:2
  text: Pachacuti Yuca Yupauqui is described as reigning sixty years and as a great
    conqueror; an elder brother holding government during their father's lifetime
    was defeated by the Chancas and fled with few followers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ynca Yupanqui is said to have appeared after the defeat and reported that
    Uira-ccocha spoke to him while he was alone and deeply dejected.
  category: speech
  evidence_refs:
  - ev:3
