canonical_text:
  quote: ''
  summary: The narrator quotes Father Acosta's account of Pachacuti/Yupanqui, in which
    Ynca Yupanqui reports a revelation from Uira-ccocha, the universal creator, promising
    victory over the Chancas and royal lordship. After victory, Uira-ccocha is elevated
    above the sun, thunder, and other huacas, and bearded helpers said to have been
    sent by Uira-ccocha are said to have turned into stones called Pururaucas, worshipped
    as huacas and carried to war.
  language: English
  quote_policy: summarized
