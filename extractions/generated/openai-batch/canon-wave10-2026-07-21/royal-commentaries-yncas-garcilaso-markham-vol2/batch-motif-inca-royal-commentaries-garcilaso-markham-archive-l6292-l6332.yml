  summary: The passage describes the Yncas moving toward Casamarca after arranging
    matters with Huamachucu. They send a formal summons. The people of Casamarca prepare
    militarily, reject new gods, a new chief, and new laws, appeal to ancestral laws,
    and vow to defend their liberty. Ccapac Yupanqui advances to the frontier; both
    sides move toward difficult passes, making conflict difficult to avoid.
