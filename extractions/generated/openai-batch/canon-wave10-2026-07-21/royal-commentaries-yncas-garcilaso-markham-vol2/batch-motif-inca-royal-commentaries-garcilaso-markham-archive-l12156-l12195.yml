canonical_text:
  quote: ''
  summary: 'A Spanish force suffers heavy losses over several days of battle. The
    Chunchos, identified as Indians of the province, attack the weakened survivors
    and kill them, including Gomez de Tordoya. They capture three Spaniards: Juan
    Alvarez Maldonado, Friar Diego Martin Portugués, and Master Simon Lopez. Maldonado
    is released and guided toward Calla-uaya; the friar and smith are detained for
    more than two years. Simon is required to make copper hatchets and adzes. Diego
    Martin is venerated as a Christian priest and asked to remain and teach the Christian
    faith, but he refuses. The two detained Spaniards are later permitted to return
    and guided to Calla-uaya.'
  language: English
  quote_policy: summarized
