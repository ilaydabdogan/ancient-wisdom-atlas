  quote: ''
  summary: The passage describes useful herbs, seeds, and flowers of Spain that were
    formerly absent, then says they later became abundant in Peru, sometimes spreading
    so much that they changed valley names. It gives examples of extraordinary crop
    growth, especially wheat, and includes an anecdote in which Garci Vasquez tells
    the narrator about an exceptionally large wheat harvest in the Valley of Huarcu.
  language: English
