canonical_text:
  quote: ''
  summary: The passage narrates an Inca campaign against Chuquimancu and the Yuncas.
    The Ynca leaves a garrison at Runahuanac, advances to Huarcu, and wages a prolonged
    war. The Inca camp is named Cuzco as a sign of intended permanence. The narrator
    corrects a report attributed to Pedro de Cieza de Leon, saying the supposed new
    city was only the camp's name and the supposed four years were relief armies.
    Famine and fear of punishment lead some inhabitants to urge surrender and inform
    the Ynca. Chuquimancu and his officers kneel before the Inca leaders, ask mercy,
    declare themselves vassals, and cite the Sun's decree of Inca lordship; they are
    pardoned and given presents.
  language: English
