canonical_text:
  quote: ''
  summary: 'A wounded eagle is attacked by smaller raptors, falls among the Yncas,
    is cared for, and dies. The Ynca and his people treat this as a bad omen, and
    soothsayers foretell the loss of the empire and destruction of its polity and
    idolatry. Other portents follow: severe earthquakes, falling hills, abnormal sea
    movements, comets, and three colored circles around the moon. A diviner called
    Uayca tells Huayna Ccapac that the Moon, addressed as his mother, announces that
    Pachacamac threatens the royal family and empire with plagues.'
  language: English
  quote_policy: summarized
