canonical_text:
  quote: "“A thing so unquiet could not be a god.”"
  summary: 'The passage reports Father Acosta’s version of a saying attributed to
    an unnamed Inga king, identified here with Huayna Ccapac: because the Sun never
    rests from its course, it cannot be God. Garcilaso adds that the Indians treated
    the king’s saying and his gazing at the Sun as an evil omen, and that Huayna Ccapac
    derived the saying from his father Tupac Ynca Yupanqui.'
