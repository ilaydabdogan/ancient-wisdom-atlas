canonical_text:
  quote: ''
  summary: 'The passage describes Inca building practices, including adobe bricks
    of clay and straw, and explains that fire-damaged walls were not reused because
    they were believed to be weakened. It then describes royal mortuary customs: when
    a reigning king died, his sleeping room, with gold and silver ornaments, was closed
    and treated as sacred; this was done in every palace where he had slept. A new
    chamber was prepared for the succeeding Ynca, and the deceased king’s vessels,
    utensils, jewels, clothes, and other palace possessions were buried with him.'
  language: English
  quote_policy: summarized
