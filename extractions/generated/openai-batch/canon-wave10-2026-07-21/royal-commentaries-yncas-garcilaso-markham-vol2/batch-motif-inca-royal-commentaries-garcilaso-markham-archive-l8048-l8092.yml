canonical_text:
  quote: ''
  summary: The passage describes rare birds said to appear only as a male-and-female
    pair in a lake near snowy mountains at Vilcafiota. Their feathers were reserved
    for the Ynca as a sacred royal device because the solitary pair was said to resemble
    the first Yncas, a man and wife who came down from heaven. The narrator compares
    the account to the Phoenix, expresses skepticism about the birds' uniqueness,
    and notes later confusion of royal head-dress distinctions.
  language: English
