canonical_text:
  quote: ''
  summary: The passage describes a battle in which Spaniards confront many divided
    Indian squadrons. An old Indian captain orders each squadron to fight, withdraw
    behind the others when spent, and avoid mixing with the next units. A rear captain
    reforms fugitives into new thousand-man squadrons, supplies them with food and
    drink, and lets them rest before returning to combat. The repeated attacks wound
    Spaniards and horses and deprive them of rest over many hours.
