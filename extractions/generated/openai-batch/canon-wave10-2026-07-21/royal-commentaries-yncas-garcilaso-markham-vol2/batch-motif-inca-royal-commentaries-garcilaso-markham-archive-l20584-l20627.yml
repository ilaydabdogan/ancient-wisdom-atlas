  summary: The passage introduces a chapter on the will and death of Huayna Ccapac
    and prognostications concerning the Spaniards. It says Huayna Ccapac bathed in
    a lake in Quitu, emerged with chills and fever, and understood the illness as
    fatal because earlier auguries and omens had warned him. The Yncas are said to
    treat royal prognostications as revelations from their father the Sun. The passage
    also lists comets, a large green comet, a thunderbolt striking the Ynca’s house,
    and other signs that horrified the Amautas.
