canonical_text:
  quote: ''
  summary: 'A ritual expulsion of evils is described: a messenger tells four royal-blood
    Yncas with lances that the Sun has ordered them to act as messengers and drive
    evils from the city. They run down the four royal roads toward the four quarters
    of the world while inhabitants perform shouting, clothes-shaking, and washing-like
    gestures. The lances are relayed outward and finally set up as a boundary beyond
    which the banished evils may not return.'
  language: English
  quote_policy: summarized
