canonical_text:
  quote: ''
  summary: 'The passage describes the cuca leaf: its physical qualities, high value
    among Indians, careful cultivation and drying, non-swallowed use for flavor and
    juice, effects on laborers, medicinal applications, economic importance through
    tithes and trade, and controversy over its ritual offering to idols by ancient
    gentiles and modern wizards or diviners. The narrator argues that cuca should
    not be uniquely prohibited because many other goods are also sacrificed in such
    practices.'
  language: English
  quote_policy: summarized
