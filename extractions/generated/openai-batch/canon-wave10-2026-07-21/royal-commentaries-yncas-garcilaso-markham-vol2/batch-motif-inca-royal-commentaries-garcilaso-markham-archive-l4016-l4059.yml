canonical_text:
  quote: ''
  summary: The passage explains that Hanco-huallu spent his final days in his dominions
    at a fortress before leaving in exile. After the disturbance among the Chancas
    subsided, Uira-ccoca remained at Cuzco, governed the kingdom, issued laws to prevent
    future rebellion, sent ten thousand emigrants to resettle Chanca lands, and appointed
    privileged Yncas as chiefs. He then ordered grand buildings throughout his dominions,
    especially in Yucay and Tampu; Yucay is described as a favored royal garden and
    place of recreation for Inca kings.
