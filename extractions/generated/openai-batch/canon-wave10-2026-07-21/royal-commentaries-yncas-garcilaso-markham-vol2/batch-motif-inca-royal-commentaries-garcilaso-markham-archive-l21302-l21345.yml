canonical_text:
  quote: ''
  summary: The passage recounts that rabbits were absent locally until a clergyman,
    Andres Lopez, brought a male and female rabbit in a cage toward Cuzco. After a
    carrier rested near a stream by Chinchapucyu, the pregnant female escaped through
    a broken cage bar into a thicket, gave birth there, and the rabbits multiplied
    after Indians refrained from killing them. The narrator adds a climate description
    of the stream valley and says an Indian informant told him the story.
