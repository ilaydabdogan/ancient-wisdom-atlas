canonical_text:
  quote: ''
  summary: The passage describes the ordered ritual of drinking invitations between
    the Ynca, captains, Curacas, royal relations, and attendants. Invitations and
    return challenges follow rank and favor. The Ynca silently receives cups with
    signs of adoration, touches or drinks a little from them, has attendants drink
    for him, and the Curacas thereafter revere cups touched by the Ynca as sacred
    objects.
  language: English
