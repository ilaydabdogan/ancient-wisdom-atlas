canonical_text:
  quote: The word Huaraca ... signified the granting of the insignia of manhood to
    the youths of the blood royal.
  summary: The passage introduces the Huaraca ceremony, described as the arming of
    royal youths. It explains that royal youths received insignia of manhood and war-and-peace
    habiliments after a rigorous novitiate and examination in military labours and
    emergencies. The rite carried public rejoicing, Ynca honor, and family-wide consequences
    of honor or shame. The youths assembled in a purpose-built house in Collcampata
    under aged Ynca instructors experienced in peace and war.
  language: English
  quote_policy: quoted
