  summary: Prince Ynca Uira-ccocha stays on a plain near the city while allied forces
    gather. He receives reinforcements, rewards their leaders, hears that more men
    are approaching, and orders them to conceal themselves in nearby hills and ravines
    for a possible flank attack against the rebels. The enemy vanguard is then seen
    from the pass of Pmac-Tampu.
