  quote: ''
  summary: The passage describes the Fortress of Cuzco as the grandest work ordered
    by the Inca kings to show their power and majesty. Its massive stones, arranged
    in three circling lines, are said to inspire wonder, with some observers imagining
    that enchantment or demons were involved. The passage emphasizes that the builders
    lacked iron, steel, carts, and draft animals, and that the stones were hauled
    by human hands with cables across rugged mountains from long distances.
