canonical_text:
  quote: ''
  summary: During a solar temple ceremony, the Ynca or King rises, takes two gold
    cups of beverage, dedicates one to the Sun through a golden jar and conduit, drinks
    from the other and shares it with royal kin, while Curacas receive a different
    beverage. The procession then approaches the temple of the Sun with ritual shoe
    removal, and the Ynca and his relations enter to worship the image of the Sun
    as legitimate children of the deity.
  language: English
  quote_policy: summarized
