  quote: laws of men who were children of the Sun
  summary: The Ynca rewards chiefs and envoys with sacred royal goods, orders Inca
    instruction and agricultural works, hears envoys praise Inca laws as solar in
    origin, receives their report about Chili beyond snowy mountains, records it,
    and continues through Colla-suyu showing favor.
  language: English
