canonical_text:
  quote: ''
  summary: 'The passage describes Inca procedures after conquest: new elites learned
    Inca laws, language, rites, and ceremonies at court; the local chief was restored;
    banquets, festivals, hospitality, and gifts reconciled conquerors and conquered;
    local laws were confirmed except where opposed to imperial religion and law; some
    populations were resettled and supplied with property, while loyal emigrants acted
    as garrison-teachers. It closes by noting that such institutions were preserved
    by knots and traditions.'
  language: English
  quote_policy: summarized
