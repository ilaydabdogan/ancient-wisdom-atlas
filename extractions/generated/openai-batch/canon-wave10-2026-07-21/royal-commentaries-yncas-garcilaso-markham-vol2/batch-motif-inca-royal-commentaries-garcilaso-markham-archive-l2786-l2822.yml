canonical_text:
  quote: ''
  summary: The passage states that the Yncas recognized Pachacamac and the Sun as
    gods and held Uira-ccocha and the other Yncas to be children of the Sun. In Chapter
    XIX, after the Ynca forces invoke the apparition Yuca Uira-ccocha and rout the
    rebels, Prince Ynca Uira-ccocha orders the fleeing rebels spared, the wounded
    treated, the dead buried, and prisoners freed with pardon. The battle is described
    as bloody, and a plain is named Yalmar-pampa, “the field of blood,” after blood
    was said to flow in a dry stream bed there.
  language: English
  quote_policy: summarized
