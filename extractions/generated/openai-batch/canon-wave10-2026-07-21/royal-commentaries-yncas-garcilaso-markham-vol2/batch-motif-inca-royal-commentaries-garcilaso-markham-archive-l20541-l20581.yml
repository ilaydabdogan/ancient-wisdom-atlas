canonical_text:
  quote: ''
  summary: The passage describes military preparation, sacrifices to the Sun, and
    consultations with soothsayers, wizards, Pachacamac, and Rimac about strange portents
    seen in the sea and other elements. The answers are obscure, though many wizards
    issue evil prophecies, causing fear of calamity. The feared events do not occur
    for several years, and confidence returns until the death of Huayna Ccapac. The
    narrator then identifies oral sources for the account, including two elderly baptized
    captains of Huayna Ccapac's guard who wept when recounting the events, and other
    named informants for later events.
  language: English
  quote_policy: summarized
