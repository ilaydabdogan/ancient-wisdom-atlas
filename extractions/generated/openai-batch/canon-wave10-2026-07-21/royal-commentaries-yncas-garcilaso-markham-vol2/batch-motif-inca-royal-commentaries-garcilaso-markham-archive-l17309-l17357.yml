canonical_text:
  quote: ''
  summary: The passage catalogs animals of the Antis and adjacent regions, including
    a disputed animal name used by Father Acosta, hornless cow-like animals identified
    in a note as tapirs, wild boars, and many monkeys. The narrator then quotes Acosta’s
    account of monkeys as abundant in forests, varied in size and color, long-tailed,
    agile, and seemingly capable of speech, reason, and bird-like movement through
    trees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Father Acosta is said to give the name “Otoroncos” to the bear; the narrator
    says he does not know whether he or Acosta is mistaken, but believes Acosta is
    mistaken.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Antis are said to contain animals like very small hornless cows, with
    very thick skin useful for strong leather and claimed by some to resist blows
    better than a coat of mail.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A note identifies the hornless cow-like animals as tapirs, gives names including
    Anta, Danta, and “gran bestia,” and reports measurements and coloring for a Peruvian
    tapir.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wild boars similar to those hunted in Spain are said to exist in the region,
    but the narrator says few of these and other animals occur in the parts of the
    Antis bordering Peru.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator says there are many monkeys, both large and small, some with
    tails and some without tails.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator introduces Acosta’s discussion of monkeys because it agrees with
    what he heard from Spaniards and Indians and partly saw himself.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Acosta’s quoted account says innumerable monkeys live in forests of the islands,
    mainland, and Andes, and describes them as ape-like creatures with very long tails.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Acosta describes some monkeys as three or four times larger than ordinary
    monkeys, and says they may be black, bay, or grey.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Acosta describes the monkeys’ swiftness and agility as wonderful, says they
    seem able to speak and reason, and says that in moving along trees they seem to
    imitate birds.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Acosta reports seeing at Capira, on the route from Nombre de Dios to Panama,
    one of these monkeys leap from one tree.
  category: action
  evidence_refs:
  - ev:6
