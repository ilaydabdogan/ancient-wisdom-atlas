canonical_text:
  quote: ''
  summary: The passage describes Inca policies of moving colonists, called Mitimaes
    or Mitmac, to cultivate lands and supply products to chiefs, and of relocating
    conquered populations for state control. It also describes Yncas by privilege
    as governors and instructors of newly conquered peoples, and states that all vassals
    were required to learn the court or general language through teachers stationed
    in each province.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A certain number of Indians with their wives were taken from each village
    and stationed to cultivate lands selected by chiefs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The colonists sowed crops that would not grow in their own country and sent
    the fruits of their labor to their chiefs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: These colonists were called Mitimaes in the cited account.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mitimaes brought maize, coca, fruits, and honey to areas such as the Collao
    where maize could not be raised.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Colonists were also sent to other provinces for a reason of state after conquest
    of warlike kingdoms considered difficult to keep loyal or tranquil.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some or all inhabitants of such conquered kingdoms could be removed to a loyal
    district surrounded by faithful vassals of the Ynca.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The intended result of removal was that the relocated people would become
    loyal and submit to the yoke.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In forming colonies, the Yucas, by privilege of the first King Manco Ccapac,
    were sent to govern and instruct newly conquered people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: All Indians removed from one district to another were called Mitmac, meaning
    transplanted or colonised.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Kings Yncas established a rule that all vassals should learn the language
    of the court, known as the general language.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Teachers from among the Yncas by privilege were stationed in each province
    for language instruction.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Yncas also had another special language.
  category: attribute
  evidence_refs:
  - ev:7
