  summary: The passage presents Father Blas Valera’s argument against a theory that
    the Indians of the New World descend from Abraham’s descendants based on alleged
    sound resemblances between Peruvian and Hebrew words. Valera argues that the general
    language of Peru lacks certain letters and consonant clusters needed for the name
    Abraham, explains pronunciation rules for apparent consonant clusters in Peruvian
    words, and notes that Spaniards often alter Indigenous pronunciations.
