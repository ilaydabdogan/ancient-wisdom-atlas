canonical_text:
  quote: ''
  summary: The passage cites earlier chroniclers on Atahuallpa's cruelties and the
    Cañaris, then recounts an episode after the death of Don Francisco, son of Atahuallpa.
    An old Ynca rejoices rather than mourns, saying Pachacamac preserved him to see
    his enemies' end. When the narrator questions this because of kinship, the old
    Ynca angrily bites his mantle, calls the deceased an Auca descended from an Auca,
    accuses that line of destroying the empire and lineage, and imagines eating the
    corpse raw.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Francisco Lopez de Gomara states the same thing, while Pedro
    de Cieza treats the subject at greater length.
  category: speech
  evidence_refs:
