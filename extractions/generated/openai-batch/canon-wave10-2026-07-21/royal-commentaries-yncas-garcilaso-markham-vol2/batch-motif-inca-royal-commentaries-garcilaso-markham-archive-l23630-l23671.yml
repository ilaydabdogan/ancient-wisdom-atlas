- id: obs:2
  text: Pedro de Cieza is reported as mentioning a lack of men and excess of women
    among the Cañaris, and that during the Spaniards' wars they furnished girls instead
    of men to carry army baggage.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator states that the cruelties of Atahuallpa gave rise to a story
    concerning Don Francisco, son of Atahuallpa.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The day after Don Francisco's death, before the funeral, a few Ynca relations
    visited the narrator's mother, including an old Ynca previously mentioned by the
    narrator.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The old Ynca expressed joy rather than grief, saying Pachacamac had preserved
    him to see the death and end of all his enemies.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator asked why they should rejoice at Don Francisco's death, since
    Don Francisco was their relation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The old Ynca became enraged, took the end of his mantle, and bit it; the passage
