  summary: The passage discusses horse breeding, horse scarcity and prices in early
    conquest-era Peru, comparison with Spain and the islands, and an anecdote before
    the battle of Chuquinca in which a poor soldier refused a very high offer for
    a horse he intended to ride in battle; the horse was killed and the soldier wounded.
