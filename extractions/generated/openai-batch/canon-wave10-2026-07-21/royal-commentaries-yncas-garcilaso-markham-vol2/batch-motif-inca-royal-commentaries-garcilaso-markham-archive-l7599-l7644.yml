  summary: The passage describes Inca novices undergoing a severe fast with minimal
    food and water, kin fasting and praying to the Sun for them, expulsion for those
    weakened by the fast, a race from sacred Huanacauri to the city fortress with
    ranking and shame for failure, and a later division into two bodies for a fight.
