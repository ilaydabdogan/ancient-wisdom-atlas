canonical_text:
  quote: returned flying to defend Cuzco and the whole empire
  summary: 'The passage describes fierce condor-like birds and a painting ordered
    by the Ynca showing two contrasting condors: one in a hidden, drooping posture
    associated with his father fleeing from Cuzco to Collao, and another fierce, flying
    toward Cuzco, associated with Ynca Uira-ccocha returning to defend Cuzco and the
    empire. It then reports the later deterioration of the painting and describes
    Uira-ccocha consolidating rule, being revered by his subjects, and rewarding allies
    from the recent rebellion.'
