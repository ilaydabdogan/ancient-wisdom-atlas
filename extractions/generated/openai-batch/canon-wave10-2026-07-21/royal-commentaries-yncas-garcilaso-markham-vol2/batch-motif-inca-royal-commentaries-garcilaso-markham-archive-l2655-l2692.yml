canonical_text:
  quote: "“the very stones and bushes of the plain were turning into men”"
  summary: The passage describes a battle in which Chanca morale collapses after Inca
    reinforcements arrive. The Incas use the occasion to proclaim that stones and
    bushes of the plain are becoming men to fight for the Prince by command of the
    Sun and Uiraccocha. A cited chronicler reports that Indians continued to say the
    stones turned into men because the Sun fulfilled a promise to Pachacuti Ynca Yupanqui.
    Another chronicler is said to allude to Uiraccocha and the battle, though with
    confused details.
  language: English
  quote_policy: quoted
