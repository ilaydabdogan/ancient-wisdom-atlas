canonical_text:
  quote: ''
  summary: The passage gives a natural-history survey of pumas, bears, tigers, serpents,
    and other reptiles in Peru and the Antis. It includes an anecdote about a Spaniard
    killing a lioness near Cuzco and finding two spotted whelps in her belly, and
    it closes with the narrator’s reflection on forgetting and recalling the Peruvian
    name for tiger.
  language: English
