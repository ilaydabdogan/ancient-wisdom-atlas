canonical_text:
  quote: even the stones and shrubs were converted into men to fight for them
  summary: After a victory, rebel leaders are taken prisoner. An elder Ynca rebukes
    them for opposing the children of the Sun, claims that the Sun can command stones
    and shrubs to become men in battle, and presents clemency toward enemies as the
    Sun's command. The rebel Curacas give thanks and promise loyalty. Ynca Uira-ccocha
    sends a messenger to the temple of the Sun to announce the victory gained by the
    Sun's favour. The narrator adds that the Yncas treated the Sun as both god and
    man, including ritually drinking with him by pouring his drink into a golden jar
    placed in a festival court or temple.
  language: English
  quote_policy: quoted
