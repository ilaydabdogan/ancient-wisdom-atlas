canonical_text:
  quote: ''
  summary: The passage describes Ynca-era granaries, the separation of crops belonging
    to the Sun and the Ynca, the provision of seed and sustenance by the Sun or King
    as lord of the land, and a tribute system based on personal labor rather than
    payments from private crops. It cites Father Acosta on annual land distribution
    and service on the lands of the Ynca and Huacas. It then describes crops in cold
    Colla and the preservation of papa as chunu through frost, pressing, sun-drying,
    and storage.
