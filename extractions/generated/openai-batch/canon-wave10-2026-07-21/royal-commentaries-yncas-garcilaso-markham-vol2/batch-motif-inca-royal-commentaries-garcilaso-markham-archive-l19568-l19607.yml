  quote: Huacchacuyac, which is lover of the poor
  summary: Rebels fear the anger and punishment of Huayna Ccapac and flee toward the
    mountains, while aged and infirm residents send a Chachapuya matron and other
    women to beg the Ynca for pardon. The women meet him near Caxamarquilla, fall
    at his feet, and appeal to his clemency, inherited conquest, and title as lover
    of the poor.
