canonical_text:
  quote: ''
  summary: The passage reports the size and thickness of a famous gold cable or chain
    associated with Guaynacava's son. It quotes Agustín de Zarate saying that Guaynacava
    ordered the gold cable made at his son's birth, that two hundred Orejones could
    scarcely lift it, and that the son was called Huasca/Inga. The narrator adds that
    the Indians hid this jewel with other treasures after the Spaniards entered the
    country, that it was first used at the heir's shearing and naming, and that the
    name Huascar derives from Huasca, meaning cable or rope.
  language: English
  quote_policy: summarized
