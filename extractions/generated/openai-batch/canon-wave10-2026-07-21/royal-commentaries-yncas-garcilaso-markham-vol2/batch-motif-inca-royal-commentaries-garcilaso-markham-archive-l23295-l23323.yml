canonical_text:
  quote: ''
  summary: 'The passage explains battlefield place-names: Quepaypa is interpreted
    as meaning “of my trumpet,” referring to Atahuallpa’s trumpet, and Yahuar-pampa
    as “the field of blood.” The narrator recalls visiting the battlefield as a boy.
    It then states that the royal blood of the Yncas was extinguished over two and
    a half years, that the process was prolonged for cruelty, and that the name Yahuar-pampa
    was confirmed by the shedding of royal Inca blood, contrasted with earlier Chanca
    bloodshed and made more pitiful by the children and mothers involved.'
  language: English
  quote_policy: summarized
