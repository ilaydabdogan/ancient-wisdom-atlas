canonical_text:
  quote: ''
  summary: The passage introduces words from a 1601 letter by Diego de Alcobasa about
    Chile. The quoted report says Chile is in a bad condition, that the Indians are
    skilled in war, armed with lances and horses, and ready to attack Spanish soldiers.
    Troops are sent yearly from Peru, but many go and none return. The Indians have
    taken two Spanish towns, killed those found there, and carried off women and children
    after killing their fathers. A footnote identifies Alcobasa, his family background
    at Cuzco, his friendship and correspondence with the Ynca Garcilasso, and his
    later work as a Jesuit priest and provider of information.
