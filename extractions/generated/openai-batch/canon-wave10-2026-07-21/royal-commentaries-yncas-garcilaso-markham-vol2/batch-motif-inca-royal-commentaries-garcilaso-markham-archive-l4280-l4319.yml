canonical_text:
  quote: ''
  summary: The passage identifies Ccoya Mama Ocllo as mother of Huayna Ccapac and
    describes Inca treatment of dead husbands and wives as remaining together after
    death. It describes preserved bodies with complete hair and features, clothing,
    llautus, seated posture, crossed arms, and downcast eyes. Father Acosta is cited
    as saying one body appeared alive, was preserved with a kind of bitumen, and had
    gold pellets for eyes. The narrator says he failed to examine the bodies closely
    and notes uncertainty about the embalming method, which Spaniards had not learned
    and which may have been forgotten.
  language: English
  quote_policy: summarized
