canonical_text:
  quote: ''
  summary: The passage describes a chant composed for the feast of the holy sacrament
    that was likened to the haylli. Eight mestizo boys dressed as Indians, each holding
    a plough, represented the Haylli song in procession while the choir joined the
    refrain. The narrator says Spaniards used native songs and dances to solemnise
    the festival of the Lord God, called Pachacamac by the Indians. The narrator then
    explains that he had described an Inca ceremony of ploughing a terrace dedicated
    to the Sun, which he saw in childhood, and that this ceremony was a diminished
    remnant of older Inca ceremonies for ploughing the lands of the Sun and the Yncas.
  language: English
  quote_policy: summarized
