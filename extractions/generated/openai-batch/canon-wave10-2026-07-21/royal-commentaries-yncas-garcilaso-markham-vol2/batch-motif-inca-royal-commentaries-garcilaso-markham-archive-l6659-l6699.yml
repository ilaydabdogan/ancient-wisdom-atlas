canonical_text:
  quote: mamaccocha, which means “Mother sea”
  summary: The passage describes Inca irrigation works that redirected scarce water,
    enlarged cultivated land, and brought abundance, thereby winning affection for
    Inca government. It then describes coastal peoples worshipping the sea in the
    form of fish, calling it Mother Sea because it provided food, using fish for food
    and manure, worshipping the whale, and venerating locally useful fish before Inca
    dominion. The passage ends by noting that the Yncas, after acquiring Yea and Pisco,
    sent messengers to Chincha.
  language: English
