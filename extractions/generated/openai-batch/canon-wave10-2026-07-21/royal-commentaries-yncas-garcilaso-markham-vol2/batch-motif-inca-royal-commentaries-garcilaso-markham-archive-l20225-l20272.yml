canonical_text:
  quote: ''
  summary: The passage quotes Agustín de Zarate on Guaynacava, identified in a footnote
    as Huayna Ccapac, crediting him with territorial expansion, justice, and culture.
    It describes obedient service to the Inga through the construction of famous roads,
    especially a wide and level mountain road associated with Guaynacava’s campaign
    from Cuzco toward Quito and intended for his victorious return. The road is described
    as crossing mountains and ravines through rock-breaking and raised masonry, later
    damaged in wars to block passage.
