canonical_text:
  quote: ''
  summary: The passage describes an Inca demand that Cuismancu submit to Ynca Pachacutec,
    accept Inca rule, laws, customs, and solar worship, or face war. Cuismancu, prepared
    for war, rejects the demand, defends ancestral customs and local gods, and describes
    veneration of Pachacamac as creator and preserver, including temple offerings,
    human sacrifice, and ritual avoidance of looking upon the deity's image.
  language: English
  quote_policy: summarized
