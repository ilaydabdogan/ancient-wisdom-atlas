canonical_text:
  quote: ''
  summary: The passage describes the great increase of cattle in Spanish American
    islands and mainland regions, using hide shipments as evidence. It says bloodhounds
    and mastiffs introduced by Spaniards reduced cattle numbers and became dangerous
    to travelers. It then describes mounted Spaniards hunting cattle on savannas with
    half-moon houghing instruments, the dangers of the chase, the skill of expert
    hunters, and the waste of meat. Notes explain the houghing instrument and mention
    later Buccaneer meat-curing methods learned from Caribs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cattle are said to have multiplied greatly, with annual hides sent to Spain
    offered as evidence, including numerical totals from St. Domingo and New Spain.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In St. Domingo, Cuba, and other islands, cattle increase is said to have been
    limited by bloodhounds and mastiffs introduced by Spaniards.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dogs are described as so numerous that men cannot travel safely except
    in companies, and a reward is offered for killing them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Spaniards kill cattle by waiting for them to browse on savannas and then charging
    them on horseback with lances.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The lances use half-moon blades called desjaretaderas, with the edge inside,
    to cut the sinews of the hind leg and hough the beast.
  category: object
  evidence_refs:
  - ev:3
  - ev:7
- id: obs:6
  text: The horseman must wound the leg corresponding to the animal's turn, because
    the animal turns its head toward the wounded side; otherwise the hunter's horse
    may be caught on the horns.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some men are described as expert enough to throw over twenty to forty beasts
    in a course two arquebus shots long.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator says the wasted flesh in the islands could supply meat for all
