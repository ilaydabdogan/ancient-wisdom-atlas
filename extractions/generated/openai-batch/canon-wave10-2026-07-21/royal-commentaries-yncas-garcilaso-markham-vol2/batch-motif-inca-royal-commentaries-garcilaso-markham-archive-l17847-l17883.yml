  summary: The chapter opens an account of fish in the freshwater rivers of Peru and
    names large rivers. The passage describes the Rio Grande or Magdalena, its mouth,
    source in the Cordilleras of Peru, and forceful entry into the ocean. It then
    discusses the river of Orellana, variant reported measurements of its mouth, the
    narrator’s preference for navigators’ experiential measurements, and the river’s
    sources near Cunti-suyu and Cuzco.
