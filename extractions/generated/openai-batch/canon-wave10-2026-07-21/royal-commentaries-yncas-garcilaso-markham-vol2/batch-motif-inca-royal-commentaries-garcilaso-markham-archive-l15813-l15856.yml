canonical_text:
  quote: "“his father, the Sun, had called him to his rest”"
  summary: Tupac Ynca Yupanqui addresses his many children in a will-like final speech,
    counsels peace, justice, care for vassals, solar royal conduct, conquest for Sun
    worship and civilised life, and punishment of rebels who killed Inca emissaries.
    He says the Sun has called him to rest, dies, is remembered with honorific names,
    and his wife and sons are listed. His embalmed body is later said by the narrator
    to have looked alive.
  language: English
  quote_policy: quoted
