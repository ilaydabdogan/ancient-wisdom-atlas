  quote: ''
  summary: A second Inca army arrives, prompting Copayapu to submit and agree terms
    involving what they will receive and abandon in their idolatry. The Ynca is pleased
    that the province has become his by peaceful agreement and orders another army
    of ten thousand warriors to continue the conquest. Reinforced Inca forces advance
    to Cuquimpu, conquer it, and then subdue nations as far as the valley called Chile,
    from which the country takes its name.
