canonical_text:
  quote: ''
  summary: The passage describes rules for the order of land cultivation under the
    Yncas, including punishment of a Curaca who placed his own land before a widow's.
    It states that vassals' lands were to be cultivated before royal lands because
    the prosperity of subjects supported service to the King. The lands of the Ynca
    and the Sun were cultivated communally with festival dress, songs, and joy. A
    terrace near Cuzco called Collcampata is described as the first land dedicated
    to the Sun in the empire, worked only by persons of royal blood, Yncas and Pallas.
  language: English
  quote_policy: summarized
