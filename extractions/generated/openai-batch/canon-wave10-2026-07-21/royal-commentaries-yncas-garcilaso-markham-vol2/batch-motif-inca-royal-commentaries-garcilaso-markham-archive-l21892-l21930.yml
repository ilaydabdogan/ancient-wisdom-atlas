canonical_text:
  quote: he set apart twelve plots from which he gathered grapes each month
  summary: 'The passage reports vineyard cultivation and wine practices in Peru and
    Quitu: an unnamed Spaniard brought the vine from Rimac to Quitu, used divided
    plots and irrigation to produce grapes throughout the year, and similar staggered
    cultivation was observed in maize. It also states that, in Cuzco before 1560,
    wine was not normally served to ordinary guests except for health, because wine-drinking
    was treated more as a vice than a necessity.'
  language: English
