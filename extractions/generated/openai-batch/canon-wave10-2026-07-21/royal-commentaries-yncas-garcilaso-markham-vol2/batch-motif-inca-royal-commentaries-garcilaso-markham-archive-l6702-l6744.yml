canonical_text:
  quote: ''
  summary: At Chincha-suyu, an Inca demand for submission to Pachacutec, called Child
    of the Sun, is met by a Chincha refusal. The Chincha affirm their own lord and
    gods, privilege the sea over the sun as provider, name Chincha Camac as sustainer
    and creator of Chincha, and recount an ancestral migration and conquest of the
    valley.
  language: English
  quote_policy: summarized
