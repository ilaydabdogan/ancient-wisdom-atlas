  quote: ''
  summary: The narrator discusses the great quantity and value of pearls brought from
    the Indies. He says the finest pearls were set apart for the king as his fifth,
    passed to the royal chamber, and were then used in sacred Christian worship, including
    elaborate garments and altar ornaments for the image of Our Lady of Guadalupe.
    He praises the workmanship, the Christian king’s use of treasure, and the monarch’s
    vast wealth, then begins to relate a pearl seen at Seville in 1579 that had been
    brought from Panama.
