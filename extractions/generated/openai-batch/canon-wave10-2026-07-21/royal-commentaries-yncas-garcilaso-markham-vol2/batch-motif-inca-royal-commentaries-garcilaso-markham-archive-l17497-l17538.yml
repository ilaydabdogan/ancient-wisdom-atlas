canonical_text:
  quote: ''
  summary: 'The passage gives natural-historical descriptions of Peruvian birds: the
    condor or cuntur as very large and strong; the ccenti or hummingbird as very small,
    golden-blue, and nectar-feeding; and the suyuntu or gallinazo as a large black
    carrion bird that overeats, vomits to regain flight, and is useful chiefly for
    cleaning streets.'
