canonical_text:
  quote: the ambition to command will not brook an equal or even a second
  summary: Gomez de Tordoya, angered that a conquest concession was given to others,
    claims a right based on retaining the deed, gathers a small force, enters Cameta,
    crosses difficult terrain to the Amaru-mayu River, and fortifies the riverbank
    against Juan Alvarez Maldonado. Maldonado arrives by river, and the rival parties
    fight without parley, though the narrator says they might have united.
  language: English
  quote_policy: quoted
