canonical_text:
  quote: ''
  summary: The passage describes Inca agricultural songs of praise to the Sun and
    Kings, centered on the refrain Haylli and the idea of triumph over the earth through
    ploughing. It explains the form and use of a simple foot-driven plough, the coordinated
    work of male ploughers in rows, and the work of women following behind to break
    clods, remove roots, and join the refrain. It ends by noting that a Cuzco cathedral
    choir master found the songs and tune good.
