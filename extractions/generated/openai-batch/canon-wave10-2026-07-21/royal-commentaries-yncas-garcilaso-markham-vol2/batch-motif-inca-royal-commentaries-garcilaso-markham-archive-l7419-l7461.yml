canonical_text:
  quote: ''
  summary: 'The passage describes ranked privileges among chiefs associated with the
    Ynca name and explains a formal order for drinking: paired matching cups, rank-based
    presentation by right or left hand, reciprocal invitations marking favor and vassalage,
    and a royal invitation sent by the Ynca to captains or Curacas, who receive the
    cup reverently and raise their eyes to the Sun.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain chiefs were described as descendants of ancestors whom the first Ynca
    Manco Ccapac had reduced to service, and they held high rank because of the privilege
    of bearing the name Ynca.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The kings are said not to diminish privileges or favors granted by ancestors,
    but to confirm and increase them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During drinking bouts, participants held cups in pairs, with cups touching,
    and the paired cups were the same size, shape, and material.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The matching cups were used so that each participant would drink the same
    quantity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The inviter carried two cups and gave the left-hand cup to a lower-ranking
    invitee, but the right-hand cup to an invitee of equal or higher rank.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The degree of ceremony varied according to the social position of the participants.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The two participants drank together; then the inviter received his cup back
    and returned to his place.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The first invitation came from a superior to an inferior as a token of favor
    and kindness; the reciprocal invitation from the inferior to the superior acknowledged
    vassalage and duty.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ynca first sent invitations to his vassals, preferring captains before
    non-warriors within each nation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The envoy declared that the sole Ynca had sent him to invite the recipient
