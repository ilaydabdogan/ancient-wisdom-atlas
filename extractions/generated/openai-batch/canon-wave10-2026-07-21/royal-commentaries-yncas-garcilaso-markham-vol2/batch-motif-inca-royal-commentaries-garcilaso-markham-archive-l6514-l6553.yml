canonical_text:
  quote: ''
  summary: The passage describes a victory procession with music and praise songs
    for Ccapac Yupanqui and Ynca Yupanqui, followed by soldiers and royal Yncas. The
    king, Ynca Pachacutec, appears in a gold litter. The royal group proceeds to the
    Temple of the Sun, removes shoes according to rank, enters with only those of
    the blood-royal, worships, gives thanks for the victories, and returns to the
    city square for the festival.
  language: English
  quote_policy: summarized
