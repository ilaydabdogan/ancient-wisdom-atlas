canonical_text:
  quote: ''
  summary: Father Bias Valera is quoted as saying that after Ynca Hnira-ccocha died
    and was worshipped as a god, his son Titu, surnamed Manco Ccapac, succeeded him
    and received the name Pachacutec, meaning “Reformer of the World.” The passage
    says Pachacutec governed prudently, expanded the four quarters, enacted laws,
    enlarged the Cuzco schools, added masters, and required elite officeholders to
    know the language of Cuzco.
