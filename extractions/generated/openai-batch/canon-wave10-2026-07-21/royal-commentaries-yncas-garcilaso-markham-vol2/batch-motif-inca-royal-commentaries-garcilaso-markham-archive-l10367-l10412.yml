canonical_text:
  quote: ''
  summary: The passage recalls visible remnants of a nocturnal city-cleansing festival,
    including cancu bread, pancunca torches, and boys avoiding a discarded torch in
    a stream. It explains that in Ynca times torches and washing-water were carried
    outside the city and placed in streams so the evils removed by washing would be
    carried to the sea. It then describes a separate household festival after corn
    was stored in granaries, with burnt grease or guinea-pigs offered to the Sun in
    thanks and prayer.
  language: English
  quote_policy: summarized
