canonical_text:
  quote: ''
  summary: 'The passage describes Inca sacrificial omens at Raymi and related rites:
    lambs and sheep are sacrificed; unfavorable signs are read from the animal''s
    behavior and organs; repeated sacrifices are made if auguries are bad; bad omens
    are linked with fear of the Sun''s anger and future misfortunes; blood and hearts
    are offered to the Sun, bodies are burned, and the sacrificial fire must be new
    and solar in origin.'
  language: English
  quote_policy: summarized
