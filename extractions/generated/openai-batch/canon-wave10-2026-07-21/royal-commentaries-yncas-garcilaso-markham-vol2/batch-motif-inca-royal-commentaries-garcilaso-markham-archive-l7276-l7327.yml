- id: obs:4
  text: If the first sacrifice gives unfavorable auguries, another sheep is sacrificed,
    and this may be repeated up to a third sacrifice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Even after a third unlucky sacrifice, the festival continues, but with sorrow
