canonical_text:
  quote: ''
  summary: The chapter describes Don Antonio de Ribera returning to Peru in 1560 with
    olive seedlings from Seville. Only three of one hundred seedlings survived the
    voyage. He planted them in a walled garden in the valley of the Rimac and heavily
    guarded them so no one could take even a leaf. Unnamed persons nevertheless stole
    one plant, sent it to Chile, propagated it successfully for three years, and then
    secretly returned it to its original place without the owner learning who had
    done so.
  language: English
  quote_policy: summarized
