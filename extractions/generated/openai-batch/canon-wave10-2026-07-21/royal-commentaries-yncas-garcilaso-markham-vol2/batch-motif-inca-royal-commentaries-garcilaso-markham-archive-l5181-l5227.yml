canonical_text:
  quote: ''
  summary: 'The passage first identifies cries as the obsequies of the deceased chief
    Huamanpalpa. It then describes the Ynca royal hunting excursion called Ghacu:
    game-taking was generally prohibited except for limited small birds with permission,
    killing game could be punished by death, and the restriction produced abundant
    animals. People could still drive deer from corn fields because the Ynca said
    game was for the people, not people for the game. The hunt occurred at a chosen
    province after the breeding season.'
  language: English
  quote_policy: summarized
