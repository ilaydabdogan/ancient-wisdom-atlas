canonical_text:
  quote: ''
  summary: The passage recounts an Inca ruler’s attention to Cuzco fortification,
    his northern campaign into Huanucu, the condition and conquest of the Huanucu
    tribes, the ruler’s restraint of harsh military punishment by appeal to Manco
    Ccapac’s law of benevolent rule, and the later incorporation of Huanucu through
    villages, Inca government, a Sun temple, a convent of virgins, and large numbers
    appointed to service.
  language: English
  quote_policy: summarized
