canonical_text:
  quote: ''
  summary: The passage describes royal bodies of kings being carried wrapped in white
    sheets through public streets and squares, where Indians kneel and weep and some
    Spaniards remove their caps. The narrator laments that many deeds and sayings
    of Ynca Uira-ccocha are not fully remembered because they were not recorded in
    letters. Father Blas Valera is said to preserve one saying of Uira-ccocha on the
    education of children, warning against both excessive indulgence and excessive
    severity.
  language: English
