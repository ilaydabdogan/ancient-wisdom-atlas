canonical_text:
  quote: ''
  summary: The passage describes villages near Cuzco whose inhabitants were granted
    the name, insignia, and dress of Yncas by Manco Ccapac, then describes two Rucana
    provinces selected to provide trained bearers for the Yuca's golden litter. The
    bearers served in rotation as tribute, considered the duty an honor, and faced
    public punishment for stumbling. The passage then begins a note on large food
    consumption in the royal palace.
