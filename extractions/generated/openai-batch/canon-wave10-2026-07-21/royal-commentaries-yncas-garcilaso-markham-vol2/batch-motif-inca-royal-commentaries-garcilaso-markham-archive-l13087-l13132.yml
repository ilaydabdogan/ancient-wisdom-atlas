  quote: ''
  summary: The passage reports variant accounts of the killing of Governor Pedro de
    Valdivia after a battle in Chile. Some said his former servant Lautaru killed
    him while he was tied to a pole. Another account, presented as more probable,
    says an old captain killed him with a club to stop other captains from accepting
    Valdivia's promises to leave Chile with the Spaniards and never return.
  language: English
