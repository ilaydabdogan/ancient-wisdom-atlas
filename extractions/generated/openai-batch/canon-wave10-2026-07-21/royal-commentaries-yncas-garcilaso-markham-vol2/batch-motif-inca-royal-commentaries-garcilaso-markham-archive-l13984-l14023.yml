  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The second gate was called Acahuana-puncu because the chief architect was
    named Acahuana.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The third gate was called Uira-ccocha-puncu and was consecrated to the god
