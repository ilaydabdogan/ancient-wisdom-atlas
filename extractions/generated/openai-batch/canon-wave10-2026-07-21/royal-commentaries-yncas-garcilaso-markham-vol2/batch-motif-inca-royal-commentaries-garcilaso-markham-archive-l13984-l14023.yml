canonical_text:
  quote: ''
  summary: The passage contrasts the Inca fortress stonework with Old World monuments,
    describes massive fitted rocks and named gates in the walls, and explains one
    gate as consecrated to Uira-ccocha, who appeared to Prince Ynca Uira-ccocha, warned
    of the Chanca rising, and was invoked as guardian and defender of the fortress.
  language: English
