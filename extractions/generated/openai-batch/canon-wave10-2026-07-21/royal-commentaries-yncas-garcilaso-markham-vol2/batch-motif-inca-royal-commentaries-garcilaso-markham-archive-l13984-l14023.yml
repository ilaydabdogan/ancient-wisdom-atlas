literal_observations:
- id: obs:1
  text: The narrator compares the fortress work with the wall of Babylon, the Colossus
    of Rhodes, and the pyramids of Egypt, saying those works can be understood as
    the result of many people, materials, skill, and time.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the Indians worked, dressed, raised, lowered, and accurately
    fixed enormous rocks without proper engines or tools.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
