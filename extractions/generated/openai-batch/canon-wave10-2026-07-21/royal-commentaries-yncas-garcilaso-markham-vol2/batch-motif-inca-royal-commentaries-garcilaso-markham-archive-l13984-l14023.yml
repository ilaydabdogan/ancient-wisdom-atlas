    by the narrator with the people's alleged familiarity with devils.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: Each wall had a central opening and a raisable door matching the doorway's
    width and height.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The first gate was called Ttiu-puncu, translated as the gate of sand, because
