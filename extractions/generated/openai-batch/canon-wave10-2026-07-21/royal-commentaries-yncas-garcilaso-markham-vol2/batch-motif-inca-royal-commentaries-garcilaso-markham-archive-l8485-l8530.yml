canonical_text:
  quote: ''
  summary: Cuismancu describes the Yuncas' worship of Rimac, the fox, and the ocean,
    and asks the Ynca to leave his people free without a new government. The Yncas,
    finding that the Yuncas also venerate Pachacamac, resolve to avoid immediate war
    and seek subjection through reasoning and kindness. At Pachacamac, the Ynca general
    argues that both peoples worship Pachacamac, whom the Yncas regard as unseen creator
    and sustainer, and says shared worship should make them friends and brothers;
    he also states that the Yncas will regard Rimac as a sacred oracle.
  language: English
  quote_policy: summarized
