  quote: ''
  summary: The passage describes Atahuallpa’s killings of royal kin after defeating
    Huascar, compares the violence with an alluded custom of the house of Othman,
    lists methods of execution, and explains that Huascar was temporarily kept alive
    as a political safeguard before a footnote reports his ordered drowning.
  language: English
  quote_policy: summarized
literal_observations:
