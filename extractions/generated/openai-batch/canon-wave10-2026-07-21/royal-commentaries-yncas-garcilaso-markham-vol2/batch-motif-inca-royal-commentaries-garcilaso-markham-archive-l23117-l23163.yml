  text: Atahuallpa is said to have killed his own two hundred brothers, described
    as sons of Huayna Ccapac.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Atahuallpa’s killing is said to extend to nephews, uncles, and other relations
    within and beyond the fourth degree so that no royal blood would escape, whether
    legitimate or bastard.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The royal relatives are described as murdered by beheading, hanging, being
    thrown into lakes and rivers with weights around their necks, and being thrown
    from high rocks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
