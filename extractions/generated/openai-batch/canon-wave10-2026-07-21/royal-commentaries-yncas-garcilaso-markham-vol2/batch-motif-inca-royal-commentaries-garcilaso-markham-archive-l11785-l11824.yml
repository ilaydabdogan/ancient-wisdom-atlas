canonical_text:
  quote: "“a child of the Sun” and “sent from Heaven by his Father”"
  summary: The passage describes river-bank peoples resisting an Ynca landing, then
    being reduced to obedience and sending tribute presents to King Ynca Yupanqui.
    It notes a settlement near Tono founded by gift-bearers seeking proximity to Ynca
    service. The army then advances through Chunchu territory toward Musu, where the
    Yncas urge submission to a king described as child of the Sun and sent from Heaven
    by his Father to teach human conduct and Sun worship.
