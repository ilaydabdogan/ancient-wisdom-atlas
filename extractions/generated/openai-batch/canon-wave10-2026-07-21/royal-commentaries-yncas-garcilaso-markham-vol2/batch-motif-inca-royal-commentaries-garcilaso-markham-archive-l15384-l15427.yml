canonical_text:
  quote: ''
  summary: In the time of Tupac Ynca Yupanqui, captains from provincial garrisons
    persuaded some chiefs to enter his service. The chiefs brought presents and homage;
    the Ynca received them kindly and gave them rich woollen cloth from Cuzco. They
    later praised him, called him father, and honored him with titles. He visited
    the provinces to instruct them in government and left Cuzco-born governors to
    teach customs and agriculture. The local people refused instruction and killed
    the governors. Tupac Ynca heard of the killings but postponed punishment because
    other matters prevented him from chastising them. After completing the conquest,
    he returned to Cuzco.
  language: English
  quote_policy: summarized
