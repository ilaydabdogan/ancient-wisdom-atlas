canonical_text:
  quote: ''
  summary: The Curaca of Casamarca, after resistance, sends ambassadors and then comes
    with his chiefs to seek pardon from the Inca prince and general. Ccapac Yupanqui
    receives them kindly, pardons them in the name of the Inca and prince, accepts
    them as vassals, and instructs them to perform duties, become peaceful, live in
    villages, and ask for beneficial favors. The Inca rulers are described as merciful,
    powerful, and as children of the Sun.
  language: English
  quote_policy: summarized
