canonical_text:
  quote: ''
  summary: The passage gives genealogical notices about Inca royal descendants and
    their marriages or children with Spaniards, especially descendants of Atahuallpa
    and Huayna Ccapac. It also records childhood rivalry, travel of mixed-descended
    children to Spain, early deaths, and a footnote on the Ampuero family being respected
    as representatives of the Yncas.
  language: English
  quote_policy: summarized
