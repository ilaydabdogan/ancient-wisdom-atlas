  quote: ''
  summary: 'The passage describes a large organized hunt: an unnamed male-referenced
    authority orders thousands of people to form a vast circle, use rivers, brooks,
    and ravines as boundaries, drive animals inward, capture game by hand, kill harmful
    animals, and selectively release breeding females and some males. It also contrasts
    former abundance of deer, huanacu, and vicuñas with later destruction attributed
    to Spanish arquebuses.'
