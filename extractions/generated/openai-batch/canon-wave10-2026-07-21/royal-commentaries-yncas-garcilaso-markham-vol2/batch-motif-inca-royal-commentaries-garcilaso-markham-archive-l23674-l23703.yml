  quote: ''
  summary: An Ynca speaker rejects Atahuallpa's kinship and royal descent, contrasts
    him with an ancestral Ynca ethic of doing no harm, and the narrator reports rage,
    lamentation, and later social hatred directed toward Don Francisco and his sisters,
    including the repeated use of the word Auca as an emblem of tyranny and evil.
  language: English
