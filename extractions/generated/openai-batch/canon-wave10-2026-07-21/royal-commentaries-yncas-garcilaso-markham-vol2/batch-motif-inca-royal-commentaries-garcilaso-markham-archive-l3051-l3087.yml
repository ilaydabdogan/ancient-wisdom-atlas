canonical_text:
  quote: ''
  summary: 'The passage describes an Ynca called “Weep-blood,” deprived of his kingdom
    by his son and banished to live in the country with animals. It reports later
    Indian explanations: his childhood weeping of blood was an omen; poison might
    have prevented the dethronement; the prince may have saved the state; and poisoning
    sons would be unworthy of the Yncas, called children of the Sun.'
  language: English
  quote_policy: summarized
