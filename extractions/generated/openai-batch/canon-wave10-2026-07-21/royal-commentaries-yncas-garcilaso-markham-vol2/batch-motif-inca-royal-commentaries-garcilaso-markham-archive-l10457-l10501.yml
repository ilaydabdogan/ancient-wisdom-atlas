canonical_text:
  quote: ''
  summary: 'The passage compares Rome and Cuzco as imperial cities: both are said
    to have been founded by first kings, to have brought many nations under their
    sway, to have issued good laws for the public good, and to have produced great
    men through civil and military institutions. It then contrasts Rome''s use of
    letters to memorialize deeds with the narrator''s country''s lack of letters,
    and discusses the complementary prestige of warriors and writers, using Julius
    Caesar as an example. A fragmentary note maps several Inca and colonial figures
    onto Roman or European historical analogues.'
  language: English
  quote_policy: summarized
