  summary: The passage describes Ynca Uira-ccocha’s campaign route, his delegation
    of Cuzco’s governorship to his brother, the naming of the Chancas as traitors,
    his conciliatory treatment of the defeated Chancas, the submission of Huatara
    after his messengers arrive, and his onward march toward Pocra/Huamanca and other
    provinces.
