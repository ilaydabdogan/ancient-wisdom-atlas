canonical_text:
  quote: "“Perhaps I wish it, perhaps I do not”."
  summary: The passage gives genealogical notices about legitimate Ñustas or princesses,
    daughters of Huayna Ccapac, including Beatriz Coya and Leonor Ccoya, their marriages
    to Spanish men, and children named by the narrator. A footnote recounts an anecdote
    in which Beatriz, widowed after Martin de Mustincia, resists being married to
    Diego Hernandez because of his alleged former trade as a tailor; colonial and
    ecclesiastical figures press the match, her brother Paullu warns of Spanish anger
    against the royal family, and she gives an equivocal consent at the ceremony.
    An editorial note cautions that Garcilasso may have confused two Ñustas named
    Beatriz.
  language: English
  quote_policy: quoted
