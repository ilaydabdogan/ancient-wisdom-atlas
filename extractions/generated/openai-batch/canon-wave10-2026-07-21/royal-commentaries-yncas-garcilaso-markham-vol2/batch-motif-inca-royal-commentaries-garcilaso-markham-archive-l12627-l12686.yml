    proclaiming victory because they resisted Ynca arms. The Yncas decide to return
    to already conquered territory and set the river Maulli as the boundary of the
    Empire until further orders from Ynca Yupanqui. A footnote compares Ercilla's
    Araucana account of the same retreat and halted conquest south of the Maule.
