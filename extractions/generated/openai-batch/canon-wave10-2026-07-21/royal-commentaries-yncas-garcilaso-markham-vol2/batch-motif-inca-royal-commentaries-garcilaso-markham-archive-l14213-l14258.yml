canonical_text:
  quote: ''
  summary: The passage concludes an anecdote about a stone whose failure to reach
    its place in an edifice is explained through a fable of weeping blood and tiredness.
    It then says such fables were preserved as traditions to memorialize notable events.
    The author laments that Spaniards did not preserve the fortress, but dismantled
    its masonry for private houses in Cuzco, reusing stones from walls and subterranean
    passages. The narrator recalls seeing only ruins, notes that the largest outer
    walls remained because they were too massive to move, and reports that some larger
    stones were later damaged in a search for a gold chain or cable.
  language: English
