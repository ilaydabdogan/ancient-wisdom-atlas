canonical_text:
  quote: ''
  summary: The passage describes Tupac Ynca Yupanqui withdrawing from war to govern,
    visiting provinces, continuing the construction of the fortress of Cuzco with
    a large ordered labor force, and maintaining reciprocal exchanges with Chilean
    Curacas. It then describes Prince Huayna Ccapac completing northern conquests,
    returning to Cuzco in triumph, and marrying his second wife and sister Hava Ocllo
    because his first wife Pilca Huaco had produced no children and imperial succession
    required legitimacy through both parents.
  language: English
  quote_policy: summarized
