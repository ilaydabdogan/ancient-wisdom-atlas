canonical_text:
  quote: ''
  summary: 'The passage reports a destructive fall of sand or dust around Arequipa:
    crops and trees are damaged, livestock die or are buried, houses collapse unless
    roofs are cleared, thunder and lightning are heard across a wide area, and dust
    darkens the sun so that candles are used at midday. The narrator says he is summarizing
    written and oral reports from Peru. The passage then introduces further misfortunes
    in Chile connected with the Arauco Indians and the continuing insurrection begun
    in 1553. A footnote discusses fine dust near Arequipa and a suggestion that it
    may have come from volcanic ash ejected by Misti.'
  language: English
  quote_policy: summarized
