canonical_text:
  quote: ''
  summary: 'The passage reports a prophecy or testament attributed to Guayna/Huayna
    Ccapac: his successor should befriend the coming white and bearded people, who
    would become lords of the land. A claimant presents this prophecy when seeking
    the Christian captain’s help against Atabalipa. The narrator says the words were
    treated as Huayna Ccapac’s will and obeyed literally. An old Ynca explains that
    the empire submitted quickly because the Inca’s final words commanded obedience
    to the Spaniards, and that these words were more effective than Spanish arms.'
  language: English
  quote_policy: summarized
