  quote: ''
  summary: The passage reports Blas Valera's chapter heading about Yuca administrative
    appointments, labor, stores, and tribute. It then says that after subjugating
    a new province the Ynca sent its principal idol to Cuzco, pacified the new vassals,
    ordered all groups to worship Huira-ccocha/Pachacamac as the most powerful god
    and vanquisher of other gods, and decreed that the people accept the Ynca as king
    and supreme lord, with chiefs attending court periodically.
