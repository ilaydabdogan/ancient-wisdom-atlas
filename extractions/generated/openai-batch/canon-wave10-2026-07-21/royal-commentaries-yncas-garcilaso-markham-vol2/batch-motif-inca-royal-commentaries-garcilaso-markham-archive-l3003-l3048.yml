canonical_text:
  quote: ''
  summary: The passage describes a succession conflict between Prince Ynca Uira-ccocha
    and his father after the father abandoned Cuzco. After a public and private interview,
    Uira-ccocha resolves that his father should not return to Cuzco and deprives him
    of the throne. The court accepts this to avoid disorder and because resistance
    is considered useless. A palace is built for the father in a pleasant valley with
    gardens, hunting grounds, fish ponds, and nearby waters. Uira-ccocha then returns
    to the city, exchanges the yellow fringe for the red one, and allows his father
    to keep the outward red insignia while retaining actual dominion himself.
  language: English
