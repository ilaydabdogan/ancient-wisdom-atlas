  text: Some persons who might have escaped instead came to prison with the captured
    Ynca because of love and loyalty toward him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Atahuallpa's troops regarded the capture of Huascar Ynca and the chief officers
    of his army as a major victory and a rich prize.
  category: action
  evidence_refs:
  - ev:2
