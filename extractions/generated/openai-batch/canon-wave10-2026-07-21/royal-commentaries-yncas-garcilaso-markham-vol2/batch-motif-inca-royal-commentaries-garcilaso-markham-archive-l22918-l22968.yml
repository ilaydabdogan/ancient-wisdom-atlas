  text: Four captains and selected soldiers were appointed to watch Huascar day and
    night without losing sight of him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A proclamation was ordered to announce Huascar's capture throughout the empire
    so that reinforcements would abandon their plans.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: News of the victory and capture was sent to Atahuallpa by post.
