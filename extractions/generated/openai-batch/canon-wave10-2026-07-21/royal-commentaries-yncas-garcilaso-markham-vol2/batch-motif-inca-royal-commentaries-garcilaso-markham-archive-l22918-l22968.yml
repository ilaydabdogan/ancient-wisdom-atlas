canonical_text:
  quote: ''
  summary: Huascar Ynca is captured by Atahuallpa's forces. Some loyal persons join
    him in prison, guards are appointed to watch him continuously, a proclamation
    announces the capture, and news is sent to Atahuallpa. The passage frames this
    as the main result of the war between two royal brothers, with a footnote summarizing
    Balboa's fuller account of warnings, failed conciliation, envoys, and battles.
  language: English
  quote_policy: summarized
