canonical_text:
  quote: ''
  summary: 'The passage explains the Ynca rationale and organization of the Chacu
    hunts: game was preserved, increased, used profitably, and vermin removed; Pachacamac
    or the Sun is named as creator of the game. The hunts are described as evidence
    of royal order and good government. Provincial officials personally supervised
    hunts and distribution of flesh and wool so that the poor, sick, and aged received
    shares. Because common people generally lacked flocks, the Ynca ordered hunts
    to distribute meat, which was preserved as charqui until the next hunt.'
  language: English
  quote_policy: summarized
