  quote: ''
  summary: The passage describes instruction mandated for pupils in laws, governance,
    military art, timekeeping, knot-recording, household management, poetry, music,
    philosophy, and astrology. It identifies the Amautas as venerated philosophers
    or wise men, attributes the institution and expansion of these laws to Inca rulers,
    and reports sayings of Ynca Rocca about Pachacamac as a heavenly king and about
    the learned man as admirable but mortal and therefore not fit for worship.
