  quote: ''
  summary: The narrator discusses the uncertainty of explaining where the diverse
    peoples, animals, and crops of the New World came from, considers sea and land
    arrival hypotheses, then declines to resolve the issue. He states that his subject
    will be the origin, succession, conquests, laws, and government of the Kings Yncas,
    after first treating the discovery of the New World and Peru.
