  quote: ''
  summary: The chapter opens by saying that King Ynca Yupanqui, despite little gain
    from the conquest of the Chirihuanas, did not abandon larger ambitions. The passage
    states that the Yncas aimed to reduce new tribes and teach them the laws and customs
    of the children of the Sun. It describes continued conquest, vassal labor, annual
    provincial contributions of goods, gold and silver as offerings for royal and
    solar houses rather than tribute, and the king as beloved, obeyed, and powerful.
