canonical_text:
  quote: ''
  summary: The passage describes the Yncas explaining their laws, customs, kings,
    conquests, and the dream and deeds of Ynca Uira-cocha to the Musus. The Musus
    accept friendship, Inca religion and customs, and Sun worship, but refuse to become
    vassals because they had not been conquered. They allow surviving Yncas to settle
    among them, give daughters as wives, and send chiefs to Cuzco to honor the Ynca
    as child of the Sun and confirm the alliance. The Ynca receives the ambassadors
    kindly, orders instruction for them, and the friendship lasts until the arrival
    of the Spaniards.
  language: English
  quote_policy: summarized
