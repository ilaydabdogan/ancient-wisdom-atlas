canonical_text:
  quote: ''
  summary: 'The passage describes Inca hunting administration: huanacus and vicuñas
    are shorn or killed, game is recorded on quipus, wool and meat are distributed
    by social rank, fine vicuña wool is restricted to the Ynca and his household unless
    permission is granted, and hunts are scheduled in three-year rotations so fleeces
    and game can renew.'
