canonical_text:
  quote: ''
  summary: The chapter heading states that the Ynca flees from the capital and that
    the prince saves it. In the body of the passage, Yahuar-huaccac is alarmed by
    news of an approaching enemy, having previously refused reports and advice because
    no province had rebelled before and because he was angry at the Prince's prophecy.
    Unprepared to defend Cuzco, he retreats toward Colla-suyu with a few Yncas, halts
    at Angostura in Muyna, and waits for news while Cuzco is left deserted by its
    king and in confusion. A footnote identifies Angostura near Muyna as a traditional
    refuge station associated with this episode.
  language: English
