canonical_text:
  quote: ''
  summary: The passage describes the former abundance and later scarcity of useful
    trees in the valley of Cuzco because their wood made good charcoal. It then describes
    uchu, or Indian pepper, as an essential condiment in Indian food, notes its prohibition
    during fasts to increase rigor, and classifies several kinds, including one considered
    nobler and reserved for the royal family.
