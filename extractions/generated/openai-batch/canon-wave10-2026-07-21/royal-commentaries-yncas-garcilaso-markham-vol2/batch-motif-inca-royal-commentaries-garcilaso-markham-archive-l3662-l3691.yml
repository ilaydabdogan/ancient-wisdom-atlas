  summary: The passage describes large Inca irrigation channels cut through mountain
    rock and reinforced with hewn stone and earthwork. The narrator reports inspecting
    a channel in Cunti-suyu through the Quechua province and praises the works as
    grand. He says the Spaniards neglected, failed to understand, and allowed many
    of these public irrigation works to fall into ruin, though remains are still visible.
