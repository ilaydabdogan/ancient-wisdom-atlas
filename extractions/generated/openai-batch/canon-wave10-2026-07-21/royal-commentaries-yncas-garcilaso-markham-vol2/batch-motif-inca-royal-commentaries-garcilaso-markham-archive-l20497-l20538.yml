canonical_text:
  quote: ''
  summary: A soothsayer explains ominous circles as signs that, after the Ynca goes
    to rest with his father the Sun, civil war among his descendants will shed royal
    blood and destroy religion and policy. Huayna Ccapac publicly rejects the divination,
    views the signs, hears a Yauyu diviner confirm the interpretation, invokes Pachacamac
    and the Sun as reasons for disbelief, but privately connects the signs with an
    ancestral prophecy, prodigies in the four elements, and the arrival of an unknown
    ship, leaving him in grief and foreboding.
  language: English
  quote_policy: summarized
