canonical_text:
  quote: ''
  summary: 'The passage describes Ynca policy for conquering new territory: wars were
    framed as having sufficient causes, terms were offered before war, conquered provinces
    had their principal idol taken to Cuzco as a hostage, local people were instructed
    away from their gods and toward Ynca Sun worship, local idols were not immediately
    destroyed, and the principal chief with his sons was sent to Cuzco to receive
    favors.'
