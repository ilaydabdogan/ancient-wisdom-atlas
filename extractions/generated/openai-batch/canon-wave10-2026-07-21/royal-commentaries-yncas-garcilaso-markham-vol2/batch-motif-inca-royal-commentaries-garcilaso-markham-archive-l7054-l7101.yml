canonical_text:
  quote: ''
  summary: 'The passage describes preparations and participants for the Sun festival:
    Curacas and tribes arrive in distinctive costume with arms, instruments, musicians,
    paintings of their deeds, and retinues. Participants observe a three-day fast
    with limited food and water, no fires in the city, and sexual abstinence. On the
    evening before the feast, Ynca sacrificial priests prepare sheep, lambs, and food
    and drink offerings for the Sun, while the women of the Sun prepare maize pudding
    cakes called Canea.'
