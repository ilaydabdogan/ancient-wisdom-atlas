canonical_text:
  quote: ''
  summary: Huayna Ccapac addresses royal kin, Curacas, and captains. He reports a
    revelation from father the Sun that after twelve royal reigns a strange people
    would arrive, conquer, and rule the empire. He says the number of twelve Yncas
    is completed in him, orders obedience to the future rulers, and announces that
    he goes to rest with father the Sun. The passage then cites Cieza de Leon on the
    same prophecy concerning Spaniards and introduces a Gomara reference to Huascar
    Ynca's discourse with Spanish interlocutors.
  language: English
  quote_policy: summarized
