  quote: ''
  summary: The passage reports sayings attributed to Tupac Ynca Yupanqui, including
    an argument that the Sun is neither the maker of all things nor a living free
    being, a political maxim attributed to Ynca Rocca that sciences should be reserved
    for nobles and not taught to common people, and moral warnings against ambition
    and avarice. The narrator attributes these sayings to Father Bias Yalera and notes
    that the narrative is nearing the Spanish conquest.
