    as lances drove out daylight evils.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: They put the lighted torches and the water used for washing the previous day
    into streams so that the running water would carry the evils to the sea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If anyone later encountered one of these torches in the street, he fled from
