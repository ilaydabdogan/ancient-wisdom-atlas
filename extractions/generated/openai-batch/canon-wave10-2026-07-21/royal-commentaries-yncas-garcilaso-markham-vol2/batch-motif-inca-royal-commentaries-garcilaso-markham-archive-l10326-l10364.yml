canonical_text:
  quote: ''
  summary: The passage describes a nocturnal Inca festival in which people carried
    long-burning straw torches through the city to drive out nocturnal evils, put
    the torches and prior washing water into streams so the evils would be carried
    to the sea, avoided any remaining torch as dangerous, then celebrated with feasting,
    thanksgiving to the Sun, sacrifice of sheep and lambs, singing, and dancing. The
    narrator adds a childhood memory of seeing part of the related lance rite.
  language: English
  quote_policy: summarized
