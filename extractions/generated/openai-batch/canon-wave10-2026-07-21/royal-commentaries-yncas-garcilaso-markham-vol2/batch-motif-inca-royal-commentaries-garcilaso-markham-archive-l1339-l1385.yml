  summary: The passage cites Agustín de Zarate on Huayna Ccapac's road-side palaces
    and Tampu lodgings, which local districts stocked for armies. It then explains
    that royal estates and, when necessary, the estates of the Sun supplied war, surplus
    was stored for relief in scarcity, and priests were supported from the Sun's estates
    while serving in temples.
