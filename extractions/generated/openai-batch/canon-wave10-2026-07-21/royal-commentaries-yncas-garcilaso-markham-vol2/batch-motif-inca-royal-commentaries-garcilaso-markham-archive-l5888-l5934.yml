canonical_text:
  quote: ''
  summary: 'The passage describes two incorporations into Inca rule: an unnamed people
    who had lived without chiefs and then adopted Inca village life and laws, and
    the Chucurpu people, a warlike group said to worship a tiger. After fighting with
    Ynca Ccapac Yupanqui and suffering heavy casualties, the Chucurpu submit, accept
    the government of Ynca Pachacutec, adopt Inca laws and customs, adore the Sun,
    abandon the tiger cult, receive gifts, and are placed under governors and officials.'
  language: English
  quote_policy: summarized
