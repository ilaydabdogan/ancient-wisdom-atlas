canonical_text:
  quote: ''
  summary: The passage describes a triumphal Inca reception celebrated with songs,
    dances, eating, and drinking. Nations perform before the Ynca in order of seniority,
    accompanied by servants playing instruments and answering the chorus. The sequence
    of performances and drinking lasts all day and continues for a month; this reception
    for Ccapac Yupanqui is said to be the most solemn of such triumphs.
