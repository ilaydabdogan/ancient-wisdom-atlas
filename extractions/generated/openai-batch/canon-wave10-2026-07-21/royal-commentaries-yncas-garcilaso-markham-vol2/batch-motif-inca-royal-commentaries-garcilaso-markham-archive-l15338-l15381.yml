canonical_text:
  quote: ''
  summary: A Huancavillca-led embassy asks the Ynca to send captains or teachers to
    teach village building and cultivation, and promises loyalty. The Ynca grants
    the request, sending masters and engineers to teach religion, customs, irrigation,
    and village construction; those officers are later killed. The narrator frames
    the event as evidence of the kindness and clemency of the Ynca kings and cites
    Pedro de Cieza de Leon. A footnote reports Balboa’s account that Tupac Ynca Yupanqui
    reached the sea, sailed with balsas to distant islands, and brought back prisoners,
    precious metals, and a throne; the editor notes that a Galapagos identification
    is possible but not probable.
  language: English
  quote_policy: summarized
