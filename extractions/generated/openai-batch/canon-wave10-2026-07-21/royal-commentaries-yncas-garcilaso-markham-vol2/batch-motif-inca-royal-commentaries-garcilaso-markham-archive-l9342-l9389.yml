  quote: ''
  summary: The passage reports that Pachacutec made laws and was remembered with reverence;
    Toledo later changed or revoked many such laws and was called a second Pachacutec.
    The narrator then cites torn papers of Father Blas Valera and gives sententious
    sayings attributed to Pachacutec concerning obedience to the king, envy, drunkenness,
    anger, madness, and punishment for homicide.
