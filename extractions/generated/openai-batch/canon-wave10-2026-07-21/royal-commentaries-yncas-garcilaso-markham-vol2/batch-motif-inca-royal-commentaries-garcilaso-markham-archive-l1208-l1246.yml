  summary: The passage describes Curacas visiting the Ynca on major festivals, victories,
    the naming of the heir, audiences, and royal provincial visits. They present fruit,
    gold, silver, precious stones, woods, and skilled artisans to the Ynca and to
    the Sun, while common people are described as largely self-sufficient in ordinary
    necessities.
