canonical_text:
  quote: ''
  summary: A friar praises the bounty of Cuzco. Fray Antonio de San Miguel later preaches
    in Lent and urges the city to found a hospital for Indians under municipal patronage.
    He and the Corregidor go house to house among citizens who held Indians to record
    subscriptions, and the narrator totals the charitable promises at 28,500 dollars,
    or 34,200 ducats.
  language: English
  quote_policy: summarized
