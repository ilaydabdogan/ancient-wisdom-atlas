  text: The friar says he and others had not slept for two nights because of the porter’s
    repeated knocks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fray Antonio de San Miguel is described as succeeding the earlier friar, coming
    from a noble Salamanca family, being a theologian, living as a son of St. Francis,
    and later becoming Bishop of Chile.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fray Antonio preached on Wednesdays, Fridays, and Sundays in Lent in the cathedral
    church of Cuzco.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On one Sunday Fray Antonio proposed that the city establish a hospital for
    Indians, with the municipality as patron as it was for the hospital for Spaniards.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Fray Antonio states that the hospital should allow Spaniards, conquerors or
