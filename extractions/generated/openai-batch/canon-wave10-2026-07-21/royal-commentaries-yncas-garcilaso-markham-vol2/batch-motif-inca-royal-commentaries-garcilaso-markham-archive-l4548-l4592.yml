  quote: ''
  summary: The passage describes Ynca royal houses as fully supplied for the ruler,
    decorated with gold and silver, stocked with ornamental precious-metal granaries,
    clothing, and fine vicuña-wool bedclothes, and organized around abundant meals
    for royal kin and household servants. It also describes customs of dress, bedding,
    eating, drinking, and the differing sufficiency of rich and poor.
