canonical_text:
  quote: ''
  summary: 'The passage explains colonial names used to distinguish people by birthplace
    and mixed parentage: Creoles, Guineos, Mulattos, Cholos, Mestizos, and Montañés.
    It also reports how some names are treated as honorable, contemptuous, or insulting
    by different groups, and the narrator identifies proudly with the name Mestizo.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Children of a Spanish man and Spanish woman born in the country are called
    Creoles, meaning born in the country.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage attributes the invention of the name Creole to people it calls
    Negroes; among them it distinguishes a Negro born in the Indies from one born
    in Guinea.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Spaniards are said to have adopted the word Creole into their language for
    those born in the country, so that both Spaniards and Negroes born in the Indies
    are called Creoles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Negro who comes from Africa is called Negro or Guineo.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The child of a Negro and an Indian woman, or of an Indian and a Negress, is
    called a Mulatto.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says the children of that group are called Cholos; it says the
    word came from the Windward Islands and means dog, and that Spaniards use it as
    a term of contempt and reproach.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Children of a Spaniard and an Indian woman, or of an Indian and a Spanish
    woman, are called Mestizos, meaning a mixture of both nations.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator says the name Mestizo was given by the parents of such children
    and states that he calls himself by it proudly.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says Indians regard being called Mestizos as an insult and therefore
    adopted the name Montañés, which Spaniards had given them with other vituperative
    epithets.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says Montañés is honorable in Spain in connection with privileges
    of the mountaineers of Asturias and Biscay, but insulting when applied to someone
    not native to those provinces; its usual meaning is described as a thing of the
    mountains.
  category: attribute
  evidence_refs:
  - ev:6
