canonical_text:
  quote: ''
  summary: The passage explains Inca succession rules requiring legitimate royal descent,
    especially through a royal mother, and states that Atahuallpa lacked these qualifications.
    It then describes his fear that the empire might choose a qualified Inca and rebel,
    leading him to plan the destruction of the royal bloodline. The passage generalizes
    this as a remedy used by violent usurping kings to remove legitimate heirs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Succession to the kingdom of Cuzco is described as requiring the inheritor
    to be the son of a legitimate wife who is the king's sister, with inheritance
    derived from both mother and father.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the preferred requirement is not met, a king must at least be of legitimate
    royal blood and the son of a Palla of pure descent; sons of mixed blood are described
    as unable to succeed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Atahuallpa is described as lacking the necessary titles to be Ynca because
    he was not the son of a Ccoya or queen, nor of a Palla, and his mother was a native
    of Quitu.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Atahuallpa resolved to remove the difficulties to his rule and feared that,
    after the wars, the empire might demand and elect an Ynca with the necessary qualifications
    and rebel against him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that the Indians were deeply attached to their religion
    through the teaching of the first Ynca, Manco Ccapac, and the practice of his
    descendants.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Atahuallpa is said to have seen no solution except the cruel destruction of
    the whole royal bloodline, including both those capable of inheriting and those
    disqualified like himself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage generalizes this remedy as one usually used by kings who usurp
    power by violence, because without a legitimate heir the vassals have no one to
    turn to.
  category: other
  evidence_refs:
  - ev:4
