  summary: The passage opens a chapter on mares and horses, their first breeding,
    and their value, and says it may interest present and future readers to know what
    things did not exist. The included notes mention a proposed date for Huayna Ccapac’s
    death and describe his funeral procession with his widow, Huascar’s order to arrest
    the chiefs named as executors, their execution at Limatambo for allowing Atahuallpa
    to go free, and Huascar’s rebuke of his mother.
