canonical_text:
  quote: ''
  summary: The passage explains that Uira-ccocha was the name of an apparition that
    declared itself a child of the Sun. It discusses why Spaniards were also called
    Uira-ccocha and reports Father Bias Valera's explanation of the name through the
    godlike qualities ascribed to the apparition. It then states that Ynca Uira-ccocha,
    because of his vision and victory, was worshipped during life as a new god sent
    by the Sun to renew his lineage and save the imperial city, the house of the Sun,
    and the virgins; although he tried to direct worship to the apparition who had
    appeared to him, both were worshipped equally under the same name.
  language: English
  quote_policy: summarized
