canonical_text:
  quote: ''
  summary: 'The passage reports that a deceased Ynca was embalmed and succeeded by
    his legitimate son Yahuar-huaccac. It then introduces laws attributed by Blas
    Valera to Ynca Rocca: sciences were reserved for nobles, commoners were to learn
    their fathers'' occupations, severe criminals were to be executed, children were
    to serve parents until age twenty-five and then the state, and schools were established
    in Cuzco where Amautas instructed royal princes and nobles in religious rights,
    precepts, and ceremonies rather than letters.'
  language: English
  quote_policy: summarized
