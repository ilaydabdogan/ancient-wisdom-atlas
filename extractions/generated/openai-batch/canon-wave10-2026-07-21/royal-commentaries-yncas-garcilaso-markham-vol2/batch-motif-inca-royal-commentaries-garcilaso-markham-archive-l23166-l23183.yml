canonical_text:
  quote: ''
  summary: Chiefs loyal to Huascar are taken in manacles to a level space in the valley
    of Sacsahuana and formed into a lane. Huascar, dressed in mourning with his hands
    tied and a rope around his neck, is led through them. Those who lament, prostrate
    themselves, and worship him are killed with small axes called champi, so that
    nearly all the Curacas and captains die before their king.
