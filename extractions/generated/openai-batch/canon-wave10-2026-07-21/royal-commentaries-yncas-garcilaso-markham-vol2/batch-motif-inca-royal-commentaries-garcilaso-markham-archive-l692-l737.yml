  quote: ''
  summary: The passage describes agricultural manuring practices in Inca territories,
    especially the use of llama dung in the cold Collao and sea-bird droppings on
    the coast. It emphasizes legal protection of seabirds and the royal allocation
    of guano-producing islands and manure portions to provinces, villages, and individuals,
    with death penalties for disturbing birds or violating assigned limits.
