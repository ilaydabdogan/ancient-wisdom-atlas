canonical_text:
  quote: ''
  summary: The passage recounts an exchange between Huascar Ynca and Atahuallpa. Huascar
    is pleased by Atahuallpa’s answer, confirms a grant, and asks him to come to Cuzco
    to render homage. Atahuallpa agrees but requests permission to bring people from
    all provinces of his kingdom to celebrate the obsequies of Huayna Ccapac in Cuzco
    before taking an oath of submission with his vassals. Huascar grants the request.
    The narrator states that Huascar does not suspect Atahuallpa’s treasonous designs,
    while Atahuallpa acts cautiously to entrap him.
  language: English
  quote_policy: summarized
