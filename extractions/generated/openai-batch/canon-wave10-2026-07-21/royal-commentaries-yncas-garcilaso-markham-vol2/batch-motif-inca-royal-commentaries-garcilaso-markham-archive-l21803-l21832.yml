canonical_text:
  quote: ''
  summary: The passage describes early grape cultivation and wine-making in Peru,
    emphasizing Spanish efforts to transplant homeland goods to the Indies. It identifies
    Captain Bartolomé de Terrazas as the first person to bring grapes of his own gathering
    to Cuzco, after planting a vine at Achanquillo in Cunti-suyu. In 1555 he sent
    thirty Indians laden with grapes to Garcilasso de la Vega, asking that the grapes
    be shared with all the cavaliers of Cuzco. The narrator reports receiving grapes
    and delivering dishes of them to houses as Terrazas's ambassador, assisted by
    two Indian pages.
  language: English
