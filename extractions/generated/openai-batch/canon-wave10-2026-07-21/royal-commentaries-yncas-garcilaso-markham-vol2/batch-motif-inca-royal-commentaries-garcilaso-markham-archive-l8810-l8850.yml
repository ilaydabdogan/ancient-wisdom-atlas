  quote: ''
  summary: The passage describes an Ynca prince pressing a campaign against the powerful
    Chirnu. The Curacas of Runahuanac and Pachacamac, remembering earlier aggression,
    slavery, and forced vassalage, aid the Ynca and seek revenge. Yunca allies fight
    zealously, conquer Parmunca, and push Chimu forces through Huallmi toward Santa.
    The people of Santa defend bravely, while the Chimu chief hopes the prince and
    his warriors will tire of war and return home.
