canonical_text:
  quote: ''
  summary: The passage describes a halt to further Inca conquests in Chile, a policy
    of improving acquired provinces, fortified boundaries at the river Maulli, administration
    of justice and revenues for the Ynca and the Sun, and subject peoples living under
    Inca laws until the arrival of Spaniards. It then summarizes Spanish expeditions
    by Diego de Almagro and Pedro de Valdivia, including hardships, rebellions, civil
    wars, conquest, settlement, and Valdivia’s death by a vassal from Araucu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Orders were given that no further conquests should be made and that attention
    should be given to cultivating and improving already acquired provinces for the
    inhabitants’ good.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Neighbouring peoples were expected to submit voluntarily after seeing the
    advantages gained by tribes that had already submitted to the Ynca.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After receiving the orders, the Yncas of Chile stopped their conquests, fortified
    their boundaries, and fixed the river Maulli as the empire’s extreme limit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Attention was given to justice, revenues of the Ynca and the Sun, and benefits
    to people who became subjects under Inca laws and customs until the Spaniards
    arrived.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Don Diego de Almagro is described as the first Spaniard to discover Chile,
    but he only saw it and returned to Peru amid many hardships.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Almagro’s expedition is said to have led to a general rebellion of the Indians
