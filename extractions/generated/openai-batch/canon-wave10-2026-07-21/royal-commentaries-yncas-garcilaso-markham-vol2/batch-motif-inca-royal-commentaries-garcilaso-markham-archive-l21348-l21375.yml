  quote: ''
  summary: The passage describes rabbits in Quitu as similar to Spanish rabbits, notes
    the absence of hares, and explains that thorough-bred dogs and mastiffs were introduced
    by Spaniards into Peru. Mastiffs were valued by flock owners chiefly so that their
    folds would resemble those of Spain. The narrator recounts witnessing a Spaniard
    transport a young mastiff puppy from Cuzco toward the City of the Kings as a valuable
    present.
