canonical_text:
  quote: ''
  summary: During a campaign against the Huacrachucus, the Ynca judges that continued
    war would harm both sides and sends an offer of peace and friendship. The message
    promises preservation of lands, improvement of estates through irrigation and
    works, and continued lordship for local chiefs, while requiring worship of the
    Sun and abandonment of inhuman customs. The Huacrachucus debate the offer, but
    younger men oppose submission and the war continues. The Ynca then orders active
    attacks on many sides and divides his army into squadrons.
  language: English
  quote_policy: summarized
