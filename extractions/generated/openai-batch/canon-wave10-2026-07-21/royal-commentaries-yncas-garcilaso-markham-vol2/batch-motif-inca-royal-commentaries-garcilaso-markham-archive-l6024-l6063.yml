  quote: ''
  summary: After a three-year inspection tour, the Ynca returns to Cuzco, consults
    with his brother and councillors about further conquest in Chincha-suyu, appoints
    Ynca Ccapac Yupanqui to command an army, sends the young heir Ynca Yupanqui with
    him for martial experience after Huaracu initiation, and begins a campaign in
    which Pineu submits while neighboring districts rise in arms.
