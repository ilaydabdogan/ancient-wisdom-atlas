canonical_text:
  quote: ''
  summary: 'The passage describes major South American rivers associated with Peru:
    an unnamed great river south of the Orellana, its lake and snowy-cordillera sources,
    the joining of waters near the sea, and the naming confusion with Marañon. It
    then describes the River Plate, called Parahuay, whose floods cover fields and
    villages so that inhabitants live in canoes tied to tree stems until the waters
    fall. The broad river mouths are presented as a wonder connected with Peru.'
  language: English
  quote_policy: summarized
