canonical_text:
  quote: ''
  summary: The passage explains that Cuzco’s wards were arranged according to the
    four parts and directions of the Inca empire. Manco Ccapac is said to have ordered
    peoples brought into service to settle in city quarters corresponding to their
    places of origin. Curacas had court residences oriented toward their homelands.
    The city is described as making the whole empire visible as in a looking-glass
    or on a map. A preceding sentence also explains a city feature as the “tail of
    the lion,” interpreting the city as holy in law and religion and lion-like in
    arms.
  language: English
