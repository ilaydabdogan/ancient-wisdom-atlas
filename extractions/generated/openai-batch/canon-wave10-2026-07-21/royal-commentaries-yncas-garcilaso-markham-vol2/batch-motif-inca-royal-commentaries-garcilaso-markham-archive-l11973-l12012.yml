canonical_text:
  quote: ''
  summary: A small expedition guided by a Curaca sets out on foot in search of gold
    said to be in Musu, with the aim of discovering and marking a route for later
    conquest and settlement. After twenty-eight days through forests and swamps, the
    party reaches a village. The guide advises waiting and quietly capturing someone
    for intelligence, but the Spaniards rush in noisily at night. The villagers attack,
    kill ten, capture Diego Aleman, and two Spaniards escape. Francisco Moreno obtains
    a colored cotton mantle used as a hammock or child’s cradle and six small gold
    bells. At dawn the escapees and the Curaca observe armed villagers from a concealed
    hilltop.
  language: English
