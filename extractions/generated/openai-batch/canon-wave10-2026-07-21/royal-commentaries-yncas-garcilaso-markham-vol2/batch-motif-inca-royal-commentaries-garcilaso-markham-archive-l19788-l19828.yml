canonical_text:
  quote: ''
  summary: The passage describes several named peoples subdued by the Ynca, emphasizing
    their body modification, fishing and gathering, nudity, and worship practices.
    It then describes the Ynca moving through Saramissu to Passau on the equator,
    where the inhabitants are portrayed in strongly derogatory terms as lacking gods,
    houses, agriculture, and recognized family relations, living in hollow forest
    trees, decorating their faces, and wearing dishevelled hair. The first-person
    narrator claims to have seen people from this coast in 1560 when his ship stopped
    for wood and water; they came in reed balsas to trade fish killed with harpoons.
  language: English
  quote_policy: summarized
