canonical_text:
  quote: ''
  summary: The passage opens a chapter on Huayna Ccapac. Coastal caciques bring rich
    presents, including a fierce lion and tiger, which the Ynca values and guards.
    The narrator anticipates a later Christian miracle involving these animals. Huayna
    Ccapac then travels through parts of the empire, sends officers with royal gifts
    to Tucma and Chile, and visits the fortress at Cuzco, where he personally joins
    the work to encourage laborers. A footnote recounts Pedro de Candía landing at
    Tumbez with a cross, the animals crouching before him, and the Indians understanding
    the event as a miracle connected with the cross while worshipping the animals
    as children of the Sun.
  language: English
  quote_policy: summarized
