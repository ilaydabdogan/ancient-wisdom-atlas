canonical_text:
  quote: ''
  summary: 'The passage describes a first-person observation in the valley of Yucay:
    two kestrils pursue a little bird around a large shady tree regarded by the Indians
    as sacred because their kings sat beneath it to witness festivals. The birds repeat
    a coordinated hunting pattern four times before the little bird escapes toward
    the river among ancient ruins, pleasing Spanish onlookers. The passage then describes
    wild bees, their habitats, honey and wax in different climates, and Indian uses
    of honey for food and medicine.'
