canonical_text:
  quote: ''
  summary: Huayna Ccapac goes toward the sea-coast for conquest and reaches the Manta
    frontier. The passage describes Manta coastal worship of the sea, fishes, predatory
    animals, serpents, reptiles, and especially a large emerald displayed at festivals.
    People travel to worship and sacrifice to the emerald and offer smaller emeralds,
    said by priests and the chief to be the great emerald’s daughters. Later Spaniards
    find and break many emeralds, while the principal emerald worshipped as a goddess
    is hidden and never recovered.
  language: English
  quote_policy: summarized
