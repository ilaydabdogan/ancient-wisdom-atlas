canonical_text:
  quote: "“the kings went in by a private entrance to hear the lectures of the philosophers.”"
  summary: The passage describes two royal palaces in Cuzco near the principal square
    and the schools. Cora-cora is explained as “the pastures,” because the site had
    once been pasture and the square a swamp or morass before the Yncas arranged them.
    Ynca Rocca founded his palace there to be near the school. Cassana is explained
    as “the house for freezing,” a name attributed to admiration at the grandeur and
    beauty of the buildings. Pachacutec built his palace near the schools, entered
    by a private entrance to hear lectures, and also lectured on laws and statutes
    as a legislator.
