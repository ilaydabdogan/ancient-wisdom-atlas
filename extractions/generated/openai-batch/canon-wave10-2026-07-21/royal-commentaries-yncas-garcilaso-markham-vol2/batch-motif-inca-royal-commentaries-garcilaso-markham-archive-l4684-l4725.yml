canonical_text:
  quote: ''
  summary: The passage describes gold and silver objects representing granaries, people,
    animals, plants, clothing, belts, and firewood. It then says Don Francisco Pizarro
    chose a throne or stand from Atahualpa's ransom as a sign that the King of Spain
    would sit on that throne. The narrator briefly defers a fuller account of a gold
    chain connected with Huayna Ccapac. The passage quotes Pedro de Cieza on the vast
    amount of gold buried in Peru, especially in huacas described as burial places,
    and reports native informants comparing what the Spaniards had taken to a drop
    from a great vase of water.
