canonical_text:
  quote: ''
  summary: 'The passage describes Inca laws attributed to the first kings: municipal
    and agrarian regulation, measured land allotment, required public labor, reciprocal
    village labor, rotational service by family and village, restrictions on extravagance,
    and periodic communal feasts and games before Curacas to maintain friendship and
    relaxation.'
