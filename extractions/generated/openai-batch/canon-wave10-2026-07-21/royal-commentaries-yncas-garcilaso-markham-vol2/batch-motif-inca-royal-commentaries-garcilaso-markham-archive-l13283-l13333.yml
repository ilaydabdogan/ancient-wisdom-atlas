  summary: The passage introduces news from Chile transmitted to the narrator through
    letters, after describing forty-nine years of rebellion and warfare. It names
    Martin C—uago as an intermediary who served the Crown of Spain against rebels
    in Quitua. The quoted account begins with the loss and destruction of Valdivia
    in Chile on 24 November 1599, when five thousand neighbouring Indians attacked
    the city at dawn. A footnote explains the alcabala tax and its connection to tumults
    in Quito.
