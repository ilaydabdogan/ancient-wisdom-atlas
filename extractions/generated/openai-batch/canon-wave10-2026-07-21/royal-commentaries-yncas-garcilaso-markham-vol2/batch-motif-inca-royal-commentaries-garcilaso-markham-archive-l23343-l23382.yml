canonical_text:
  quote: ''
  summary: The passage describes young Inca royal survivors escaping a massacre by
    exchanging royal dress for common clothing. The narrator identifies relatives
    and other surviving princes, then traces Paullu’s mixed Spanish-Inca line to Don
    Melchior Carlos Ynca, who is in Spain awaiting favors grounded in his descent
    from Huayna Ccapac and his royal-house survival.
  language: English
  quote_policy: summarized
