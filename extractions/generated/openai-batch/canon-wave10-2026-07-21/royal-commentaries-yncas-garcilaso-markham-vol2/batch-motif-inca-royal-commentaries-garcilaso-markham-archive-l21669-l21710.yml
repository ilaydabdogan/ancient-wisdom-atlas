  quote: ''
  summary: The passage reports introduced birds in Peru after Spanish contact, especially
    hens whose breeding failed in cold Cuzco for decades but later succeeded. It also
    recounts Don Martin de Guzman bringing a caged canary to Cuzco, where people valued
