  summary: The passage describes cleansing ceremonies using paste and threshold marking,
    priestly performance of the rites in the house of the Sun and other sacred places,
    sunrise worship asking the Sun to drive evils from the city, communal breaking
    of the fast with bread kneaded without blood, and the appearance of a royal-blood
    Ynca as a warlike messenger of the Sun from the Sacsahuaman fortress with a feathered
    lance-banner.
  language: English
