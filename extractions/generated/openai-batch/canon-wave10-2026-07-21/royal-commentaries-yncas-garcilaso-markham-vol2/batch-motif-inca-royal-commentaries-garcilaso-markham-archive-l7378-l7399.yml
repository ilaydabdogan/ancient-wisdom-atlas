  quote: ''
  summary: The passage describes a grand and solemn banquet in which participants
    ate a large quantity of food without drinking, a custom attributed to Indians
    of Peru. It then reports that some Spaniards compared the custom to Christian
    communion, while the narrator leaves the similarity for readers to judge. After
    the eating, liquor was brought in quantity, followed by a moralizing comment about
    drunkenness, social disapproval, and Spanish example.
