canonical_text:
  quote: ''
  summary: The passage describes the Ynca campaign against Cuntur-marca and Caxamarquilla.
    Cuntur-marca resists for many days but submits after being overwhelmed. The Ynca
    receives the defeated people with clemency, gives presents, leaves ministers to
    administer the conquered area, and advances. Other villages submit by following
    this example. Caxamarquilla, reached by a rugged forest road, fights for a time
    but also submits after recognizing Ynca power and the conquest of much of the
    province.
