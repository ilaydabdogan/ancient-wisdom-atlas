literal_observations:
- id: obs:1
  text: A pearl called la peregrina is described as pear-shaped, comparable in circumference
    to a large pigeon’s egg at its widest part, and exceptionally valuable.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Jacomo de Trenco, a Milanese artist and lapidary in royal service, described
    the pearl as effectively priceless because it was unique.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: People went to see the pearl in Seville as a wonderful thing, and an Italian
    knight compared a string of selected pearls with it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Those knowledgeable about pearls and precious stones said the pearl had twenty-four
    carats more than any other previously found.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Negro lad, described as a slave whose master valued him at less than one
    hundred reals, found the pearl in a fishery.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The shell containing the pearl was so small and poor-looking that it was nearly
    thrown back into the sea as worthless.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The enslaved finder received liberty as a reward, and his master received
    the staff of chief magistrate of Panama as a reward for the jewel.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Pearls are not worked except for boring and are used as they come from their
    shells.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage lists pearl shapes including round, less round, oblong, flattened,
    and pear-shaped; pear-shaped pearls are said to be especially valued because they
    are rare.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: When a merchant obtains one excellent pearl and learns of a matching pearl
    held by someone else, he tries to buy it because matching pearls are each worth
    double what one would be singly.
  category: action
  evidence_refs:
  - ev:7
