canonical_text:
  quote: ''
  summary: 'The passage describes Inca methods for preserving historical memory without
    alphabetic letters: histories were shaped as allegories and verses by poets, sung
    or recited in ceremonial contexts, and retained through Quipus interpreted by
    appointed Quipu-camayus. These officers kept inherited registers of knots and
    thread colors, narrated ancestral and provincial events when consulted by chiefs,
    and also accounted for laws, ordinances, rites, and ceremonies.'
  language: English
  quote_policy: summarized
