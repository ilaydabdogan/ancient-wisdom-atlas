  summary: Huayna Ccapac rejoices at the birth of his son and holds extended festivities.
    He plans an unprecedented celebration for the child's weaning, first haircut,
    and naming, and orders a famous golden chain to be made for that occasion. The
    passage then explains fixed provincial dance customs and describes the Ynca male
    chain-like dance before a prince.
