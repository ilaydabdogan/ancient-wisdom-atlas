canonical_text:
  quote: ''
  summary: The passage describes laws providing sustenance for incapacitated poor
    people, guest-houses for strangers and travellers, public banquets for the poor,
    compulsory work under the law called Casera, open-door meals to permit inspection,
    and household inspections by Llacta-comayu officials who rewarded order and punished
    disorder. The narrator says these ordinances contributed to abundance of necessities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People described as blind, lame, aged, and infirm, if unable to till their
    lands for clothing and food, are to receive sustenance from public stores.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Strangers and travellers are to be treated as guests in public houses called
    corpa huasi and supplied with what they require.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The poor are to be invited to public banquets two or three times a month so
    that communal rejoicing may make them forget their misery.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The law called Casera contains a provision that no one should be idle, including
    light work for children of five years old.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Blind and lame people without other infirmity are given certain kinds of work,
    and healthy people are occupied at their own labor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Public chastisement for idleness is described as infamous and degrading among
    the people.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Indians are to dine and sup with open doors so judges can enter freely to
    visit them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Judges called Llacta-comayu are responsible for visiting temples, public buildings,
    and private houses.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Officials or their deputies inspect households to see that the man and wife
    keep order, discipline their children, and maintain cleanliness of clothes, furniture,
    and utensils.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Orderly people receive public commendation, while disorderly people are flogged
    on arms and legs or receive other legal chastisement.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The narrator states that these reasons made necessities for human life abundant
    and almost given away for nothing.
  category: relationship
  evidence_refs:
  - ev:8
