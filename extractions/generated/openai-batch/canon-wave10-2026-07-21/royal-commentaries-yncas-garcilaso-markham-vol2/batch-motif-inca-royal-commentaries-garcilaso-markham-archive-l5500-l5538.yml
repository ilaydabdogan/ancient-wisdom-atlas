canonical_text:
  quote: ''
  summary: The passage describes an ordered record system using strings and knots.
    Items are grouped under generic heads; arms and vassals are listed in fixed orders;
    people are counted by village, province, sex, and age. Finer strings of the same
    color mark supplements or exceptions, such as widowers. Knots on threads indicate
    numerical values from units to tens of thousands, with larger numbers possible
    but rarely needed.
  language: English
