canonical_text:
  quote: ''
  summary: The passage resumes the account of Inca Pachacutec’s conquests. After Ccapac
    Yupanqui reduces the Curaca Chincha to submission, he requests reinforcements
    for further conquest. The army is sent with officers, supplies, and Prince Ynca
    Yupanqui. The force reaches the valley of Runahuanac, whose name is explained
    as a warning to people because its deep, rapid river had drowned those who tried
    to ford it rather than use a bridge. The passage also explains the Quechua etymology
    and notes Spanish corruptions or alternate explanations of the name.
  language: English
