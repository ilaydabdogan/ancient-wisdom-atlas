  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: From Tumpiz, Huayna Ccapac sent the usual offers of peace or war to the natives
    of the island of Puna.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Puna is described as near the mainland, fertile and prolific, and twelve leagues
    around.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tumpalla, chief of Puna, is described as proud; neither he nor his ancestors
    had recognized a superior, and they claimed superiority over neighboring mainland
    chiefs.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Tumpalla and the people of Puna were in perpetual wars with neighboring chiefs,
    which weakened their ability to resist the Ynca.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tumpalla sacrificed human hearts and blood to idols described as tigers and
