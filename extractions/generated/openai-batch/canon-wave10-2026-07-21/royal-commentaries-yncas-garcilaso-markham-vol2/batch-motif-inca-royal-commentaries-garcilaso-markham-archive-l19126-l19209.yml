canonical_text:
  quote: ''
  summary: Huayna Ccapac inspects and prepares campaigns across his empire, visits
    coastal temples, consults Pachacamac and the speaking idol at Rimac, receives
    favorable oracular responses, and sends offers of peace or war to the island of
    Puna. The passage describes Puna, its proud chief Tumpalla, local sacrifices and
    coastal deities, and Tumpalla’s warning that submission to the Ynca would mean
    loss of liberty, property, customs, laws, and ancestral gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Huayna Ccapac punished and reduced provinces to his service, left a garrison,
    ascended to visit Quitu, and later travelled through the empire from Cuzco to
    Charcas.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Huayna Ccapac ordered 50,000 warriors from Chinchasuyu north of Cuzco to assemble
    and march toward the frontier of Tumpiz.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Huayna Ccapac descended to the coastal plains and visited temples of the Sun
    and the temple of Pachacamac.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Pachacamac, priests were commanded to consult the speaking power there
    about the planned conquest; the answer advised undertaking it and promised victory
    because Huayna Ccapac had been chosen as lord of the four quarters of the world.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Huayna Ccapac consulted the famous speaking idol in the valley of Rimac to
