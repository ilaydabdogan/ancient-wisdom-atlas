  summary: The passage describes sugar arriving from Peru to show that Peru had a
    surplus, the later establishment of many sugar estates, reported grafting of Spanish
    fruit trees onto Peruvian trees, and the astonishment of Indians at trees bearing
    several kinds of fruit. It also compares the Peruvian quishuar tree to the olive
    and recalls childhood play in Cuzco with young quishuar shoots because the climate
    was too cold for canes.
