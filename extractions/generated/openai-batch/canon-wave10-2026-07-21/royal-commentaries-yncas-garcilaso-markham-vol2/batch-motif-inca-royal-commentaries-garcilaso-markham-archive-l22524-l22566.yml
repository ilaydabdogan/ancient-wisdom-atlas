  summary: The passage explains labels applied to people and mixed-descent generations
    after the Spanish arrival in Peru. It discusses Sacha-runa and Montañeses as terms
    associated with savagery, criticizes relatives who accepted an insulting name,
    defines Cuatralvo and Tresalvo by proportions of Spanish and Indian ancestry,
    and includes a note listing additional caste or descent names.
