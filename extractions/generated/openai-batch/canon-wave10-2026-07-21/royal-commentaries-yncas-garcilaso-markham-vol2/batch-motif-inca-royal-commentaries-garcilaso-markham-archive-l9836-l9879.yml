canonical_text:
  quote: ''
  summary: The narrator argues that linguistic diversity prevents effective religious
    instruction in Peru. He rejects forcing Indians to learn Spanish, proposing instead
    that priests and Indians use the general court language of Cuzco. He says Viceroys
    and officials could restore the older system by ordering the sons of teachers
    appointed by the Ynca to resume instruction in the general language, and gives
    an example of a pious priest who tried to learn and promote it.
  language: English
