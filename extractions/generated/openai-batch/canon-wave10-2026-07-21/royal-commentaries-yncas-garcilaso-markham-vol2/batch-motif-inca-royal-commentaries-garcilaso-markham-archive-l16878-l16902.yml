  summary: The chapter passage describes tame Peruvian flock animals called llamas.
    Father Blas Valera is cited as saying that God gave these gentle domestic animals
    to the Indians of Peru in accordance with their gentle character. The passage
    distinguishes larger and smaller kinds, explains the term for a shepherd, compares
    the larger tame kind with the wild huanacu, describes differences in color, compares
    the animal’s form to stags and camels, and notes the use of the skin.
