  quote: ''
  summary: The passage describes Ynca Uira-ccocha ordering a temple at Cacha in honor
    of the phantom or apparition that had appeared to him. The temple is designed
    to imitate the apparition site, with an open roofless plan like a plain, a stone-covered
    chapel like an overhanging rock, an unusual upper storey, four directional doors
    with the eastern one used as the entrance, and stone supports forming lanes covered
    by slabs.
