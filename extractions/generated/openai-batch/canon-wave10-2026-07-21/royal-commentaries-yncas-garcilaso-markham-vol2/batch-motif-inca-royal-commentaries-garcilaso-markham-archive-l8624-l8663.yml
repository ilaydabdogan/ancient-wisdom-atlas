canonical_text:
  quote: ''
  summary: After a triumph, Cuismancu is honoured among royal-blood Yncas and sent
    home with favour. Those returning declare the Ynca to be the true child of the
    sun. The narrator says that after the Yncas subjugated Pachacamac and cleared
    its temple of idols, the Devil sought worship there as the unknown god, speaking
    from temple corners to high priests. This voice restricts direct answers to elite
    priests, kings, and great lords, while assigning the idol Rimac, called Speaker,
    to answer common people. Thereafter state matters are consulted at Pachacamac
    and popular inquiries at Rimac. The passage then notes that Ynca Pachacutec chose
    to pause new conquests and give his dominions rest.
  language: English
  quote_policy: summarized
