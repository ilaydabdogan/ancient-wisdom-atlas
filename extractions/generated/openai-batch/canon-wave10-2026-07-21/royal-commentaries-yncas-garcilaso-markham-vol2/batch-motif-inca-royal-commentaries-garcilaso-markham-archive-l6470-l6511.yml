canonical_text:
  quote: ''
  summary: At the borders of Yauyu, the Inca side sends the customary choice of peace
    or war. The Yauyus debate resistance versus submission, then receive the Yncas.
    The Inca general distributes cloth by social rank. The returning Inca commanders
    proceed to Cuzco, where Pachacutec receives them in triumph and orders them borne
    in litters by people from conquered provinces.
  language: English
  quote_policy: summarized
