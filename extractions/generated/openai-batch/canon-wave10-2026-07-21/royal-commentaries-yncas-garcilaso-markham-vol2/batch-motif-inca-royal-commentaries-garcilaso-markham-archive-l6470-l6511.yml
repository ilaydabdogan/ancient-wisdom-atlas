- id: obs:2
  text: The Yauyus assemble and debate; some advocate dying in defense of their gods
    and country, while others argue this would be rash.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The pro-submission argument says the Yncas have surrounded the province and
    stronger provinces have failed to resist them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pro-submission argument includes the statement that Inca treatment of
    vassals should make the Yauyus desire their arrival rather than detest their rule.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Yauyus accept the advice to submit and receive the Yncas joyfully.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The general gives fine cloth called Govipi to the Curaca, his relations, and
