canonical_text:
  quote: ''
  summary: The chapter heading frames the passage as the Ynca conquest of Quitu and
    the placement of Prince Huayna Ccapac. In the excerpt, Tupac Ynca Yupanqui resolves
    to conquer Quitu, assembles an army at Tumipampa, and sends the usual summons
    to the King of Quitu. The king refuses to recognize another lord, accept new laws,
    or abandon ancestral gods identified as deer and great trees. Tupac begins war
    while continuing conciliation; the conflict lasts many months and years. Seeing
    the conquest will take a long time, Tupac summons his son and heir Huayna Ccapac
    so that he may gain military experience.
