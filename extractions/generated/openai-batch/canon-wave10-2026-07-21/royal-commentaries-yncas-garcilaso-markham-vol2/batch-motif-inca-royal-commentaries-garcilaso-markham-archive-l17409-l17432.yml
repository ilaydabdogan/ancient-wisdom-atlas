canonical_text:
  quote: ''
  summary: 'The passage describes monkeys carrying their young on their backs, forming
    chains between trees to cross rivers, and coordinating by signals and cries. It
    also reports sayings attributed to Indians: that monkeys can speak but hide their
    speech from Spaniards to avoid being forced to get silver and gold, and that they
    carry children on their backs to help Indian women.'
