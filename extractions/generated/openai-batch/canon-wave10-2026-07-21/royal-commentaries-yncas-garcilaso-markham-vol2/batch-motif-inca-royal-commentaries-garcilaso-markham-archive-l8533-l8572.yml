canonical_text:
  quote: ''
  summary: 'The passage describes an Inca diplomatic appeal to the Yuncas: they are
    urged to worship the sun, obey the Ynca as child of the sun, and accept peace.
    King Cuismancu and his officers deliberate and agree to terms requiring solar
    worship, a separate temple for offerings, abolition of human sacrifice, removal
    of lesser idols from Pachacamac''s temple, and aniconic worship of Pachacamac
    in the heart.'
  language: English
  quote_policy: summarized
