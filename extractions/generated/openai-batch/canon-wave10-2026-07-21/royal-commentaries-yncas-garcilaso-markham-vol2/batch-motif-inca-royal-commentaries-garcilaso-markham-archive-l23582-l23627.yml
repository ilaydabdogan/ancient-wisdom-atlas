  summary: The passage describes Ataliuallpa extending violence against villages connected
    with palace service, with harsher treatment for those nearer the royal person.
    It reports killings, burning of houses and royal buildings, partial massacres,
    and wider violence around Cuzco and beyond. After hearing of Huascar's imprisonment,
    Ataliuallpa orders war by fire and sword against bordering provinces, especially
    the Cañaris, and a quoted passage from Agustín de Zárate reports mass killing
    and the desolation of Tumibamba.
