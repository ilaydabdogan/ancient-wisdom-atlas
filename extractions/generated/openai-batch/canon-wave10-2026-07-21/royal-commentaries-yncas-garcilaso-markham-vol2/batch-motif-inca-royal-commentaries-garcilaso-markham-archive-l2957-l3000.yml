canonical_text:
  quote: ''
  summary: After a victory, the Ynca Uira-ccocha enters Cuzco on foot in a military
    triumph with warriors, uncles, and prisoners. Crowds, old Yncas, his mother, female
    kin, and Pallas receive him with acclamation, obeisance, songs, care gestures,
    flowers, and herbs. He enters the house of the Sun barefoot to give thanks, visits
    the chosen virgins, and then goes to his father Yahuar-huaccac, who receives him
    gravely rather than joyfully.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Uira-ccocha entered Cuzco on foot after victory, and the passage says this
    was to show that he was more a soldier than a king.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He marched by the Carmenca descent, surrounded by warriors, with two uncles
    who were masters of the camp on either side, and with prisoners behind.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:3
  text: Crowds rejoiced loudly, and old Yncas came to meet him, made obeisance, and
    adored him as child of the Sun.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old Yncas declared that they wanted to be young again in order to fight
    under such a leader.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: His mother, female relatives, and many Pallas met him with festive songs and
    rejoicings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some women embraced him, some wiped sweat from his face, some brushed dust
