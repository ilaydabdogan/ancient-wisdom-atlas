canonical_text:
  quote: ''
  summary: 'The passage attributes to Pachacutec a program of state education and
    regulation: learned masters are appointed to teach sons of nobles and state servants
    the language of Cuzco; luxury ornaments are restricted to princes and their sons;
    common people may ornament themselves moderately on specified festival days; frugality,
    labor, and the judging of idleness are ordered for the population, including children,
    disabled persons able to work, and the aged.'
  language: English
