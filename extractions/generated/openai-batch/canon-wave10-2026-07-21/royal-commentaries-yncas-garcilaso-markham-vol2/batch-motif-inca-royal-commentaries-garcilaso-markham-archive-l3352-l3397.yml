canonical_text:
  quote: ''
  summary: The passage describes a stone statue associated with the god Uira-ccocha,
    including an unknown animal, and says the Ynca personally dressed as the figure
    for sculptors because they had not seen it and because no one else should represent
    the god. The narrator compares the statue to Christian images of St. Bartholomew
    with a chained demon. Spaniards speculated that St. Bartholomew had preached in
    Peru and that the statue commemorated him. Cuzco mestizos later formed a brotherhood,
    adopted St. Bartholomew as guardian, and were accused by some Spaniards of honoring
    Ynca Uira-ccocha instead. The passage also states that the reason for building
    the temple at Cacha is unknown except as the Ynca's will, and that Spaniards destroyed
    the temple.
  language: English
  quote_policy: summarized
