canonical_text:
  quote: ''
  summary: The passage comments on pronunciation and spelling in the general language
    of Peru, contrasts the former and present population of several valleys, and begins
    a narrative of the Ynca conquest of the Yuncas. It describes Chuquimancu as a
    chief treated as a king, his gathering of men to defend a river passage, encounters
    with deaths on both sides, the Yncas crossing by boat, and the Yuncas' intended
    stand in the valley of Huarcu.
