canonical_text:
  quote: ''
  summary: After an ordeal, royal youths are deemed worthy of royal insignia and identified
    as true Yncas, children of the Sun. Their mothers and sisters place reed shoes
    on their feet as a token of having passed military exercises. In the following
    investiture, the King exhorts the novices to treat the insignia as an incitement
    to ancestral virtues, justice, and mercy, and to resemble the Sun as their father.
    The novices kneel before the Ynca and receive ear-boring with golden pins as the
    principal sign of knighthood.
  language: English
