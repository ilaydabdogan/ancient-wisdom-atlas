canonical_text:
  quote: ''
  summary: 'The passage presents a sequence of moral, legal, and administrative maxims:
    thieves, adulterers, and corrupt judges should be treated as thieves and punished
    with death; noble character is shown by patience in adversity; governors should
    enforce the king''s laws and manage provincial affairs carefully; a man unable
    to govern his household should not rule a state; herbalist physicians must know
    useful and harmful plants; and a person who cannot count quipu knots should be
    mocked for trying to count the stars.'
  language: English
  quote_policy: summarized
