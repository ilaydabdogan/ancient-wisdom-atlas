  quote: our father the Sun must have another Lord more powerful than himself
  summary: Huayna Ccapac publicly looks at the Sun despite priestly objection, asks
    the High Priest about royal command and obedience, and reasons that the Sun must
    be subject to a more powerful Lord because it follows its daily course without
    rest. The passage then reports Spanish interpretations and transmission of this
    saying.
