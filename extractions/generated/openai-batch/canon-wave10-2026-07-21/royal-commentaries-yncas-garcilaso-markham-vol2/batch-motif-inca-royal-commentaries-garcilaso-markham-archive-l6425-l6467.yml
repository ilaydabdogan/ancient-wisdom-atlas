  quote: ''
  summary: A conquered group declares that the Ynca conquerors are children of the
    Sun and accepts vassalage. The Ynca general then organizes the conquered province
    by rebuilding villages, planning a temple of the Sun and a convent of chosen virgins,
    appointing religious, administrative, engineering, and military personnel, and
    preparing a return march toward Cuzco with a planned conquest of Yauyu using twelve
    thousand selected men.
