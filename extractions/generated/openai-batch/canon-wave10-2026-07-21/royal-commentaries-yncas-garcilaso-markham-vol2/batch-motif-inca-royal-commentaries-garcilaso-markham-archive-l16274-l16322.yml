canonical_text:
  quote: ''
  summary: 'The passage describes several fruits of larger trees: an unnamed sweet
    fruit with cotton-like white pulp and an inedible black pip; the palta, named
    by Indians from a province and compared by Spaniards to a pear; and the rucma,
    rendered by Spaniards as lucarna, with a chestnut-like but bitter kernel. It also
    notes Spanish misunderstandings or renamings of Indian fruits and names.'
  language: English
  quote_policy: summarized
