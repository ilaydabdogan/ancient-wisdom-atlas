  quote: ''
  summary: An unnamed ruler grants Atahuallpa possession of Quitu and other provinces,
    assigns captains and part of the army to him, and favors him even against the
    interests of the heir. He asks Atahuallpa to help rule Quitu and nearby provinces,
    both to establish Atahuallpa's power and to pacify recently conquered maritime
    provinces. The passage describes a policy of moving restive inhabitants elsewhere
    and replacing them with quieter groups, identified with the policy of Mitmac colonists.
