canonical_text:
  quote: ''
  summary: In districts with scarce irrigation water, water was distributed by fixed
    rule and measured time. In dry years the State supplied measured water; each cultivator
    received the hours needed for his land, in turn, without preference for wealth,
    rank, kinship, Curacas, ministers, or governors. A person who failed to irrigate
    within the allotted time was punished by blows with a stone or flogging with osier
    wands, and idle men were called Mizqui-tullu, meaning “sweet bones.” A footnote
    compares this with timed irrigation rules in Spanish valleys.
  language: English
  quote_policy: summarized
