canonical_text:
  quote: ''
  summary: The passage states that Peru had no flax when the narrator was there. Doña
    Catalina de Retes sent to Spain for linseed and a loom in 1560, but the narrator
    left Peru that year and did not know whether she received them. He later heard
    that much flax was gathered, while noting that, during his time in Peru, people
    worked and sewed with fine cotton rather than flax.
