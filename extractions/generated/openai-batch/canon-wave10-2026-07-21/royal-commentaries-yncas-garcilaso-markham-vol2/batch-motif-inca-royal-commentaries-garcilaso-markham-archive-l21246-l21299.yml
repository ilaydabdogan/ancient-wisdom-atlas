canonical_text:
  quote: ''
  summary: The passage distinguishes Castilian sheep from Peruvian llamas, recounts
    the arrival and falling prices of sheep in Cuzco and Peru, notes the absence of
    wolves, and explains that cats were unknown before the Spaniards. It also explains
    the Indian word misitu for cat as derived from Spanish calling sounds, and uses
    this to correct mistaken arguments that indigenous names prove pre-conquest presence,
    with a parallel case involving domestic fowls called Atahuallpa.
  language: English
  quote_policy: summarized
