canonical_text:
  quote: ''
  summary: 'The passage describes Cuzco terraces and wards: a stepped terrace with
    a palace attributed to Ynca Manco Ccapac and later occupied by Paullu; a surviving
    hall for solemn rainy-day festivals; Cantutpata, named for cantut flowers or bushes;
    Pumacurcu, named for lions fastened to beams; and Toco-cachi, whose compound meaning
    is uncertain. Notes identify the cantut plant and question the antiquity of the
    palace attribution.'
  language: English
  quote_policy: summarized
