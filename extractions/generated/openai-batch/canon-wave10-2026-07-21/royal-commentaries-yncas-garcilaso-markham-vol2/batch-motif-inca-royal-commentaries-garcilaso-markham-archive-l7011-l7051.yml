canonical_text:
  quote: ''
  summary: The passage describes attendance and opening ceremonies at a major Inca
    feast. Provincial lords, captains, and substitutes from noble kin attend; the
    ceremonies include worship of the Sun God and the Ynca king. The Ynca performs
    the opening rites as High Priest and as first born of the Sun. Curacas arrive
    in splendid dress, including gold and silver ornaments, lion-skin costumes associated
    with claimed lion descent, Cuntur-wing costumes associated with claimed Cuntur
    descent, and Yunca masks with grimacing performance.
  language: English
  quote_policy: summarized
