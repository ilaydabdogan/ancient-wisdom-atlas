canonical_text:
  quote: ''
  summary: Ataliuallpa advances against his brother Huascar with deceit rather than
    open war. The men of Quitu march a long distance toward Cuzco with a force that
    alarms experienced old Ynca governors. They judge the force excessive for obsequies
    and homage, suspect Ataliuallpa, and secretly warn King Huascar to be on guard.
    The warnings rouse Huascar from confidence, and he sends messengers toward Anti-suyu
    and Colla-suyu.
