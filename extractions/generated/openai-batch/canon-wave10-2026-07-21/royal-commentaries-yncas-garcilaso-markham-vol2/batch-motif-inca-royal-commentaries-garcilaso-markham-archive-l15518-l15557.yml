canonical_text:
  quote: ''
  summary: The passage describes Huayna Ccapac’s manner of granting petitions through
    kinship address and a shoulder gesture, then narrates his renewed campaign, Tupac
    Ynca Yupanqui’s return to Cuzco, Huayna Ccapac’s command, the gradual conquest
    of Quitu, variant timing attributed to the people of Quitu, and the death of the
    King of Quitu from sorrow after losing much of his dominion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prince addresses older, similar-aged, and younger petitioners with the
    kinship terms mother, sister, and daughter, respectively.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince places his right hand on each petitioner’s left shoulder as a sign
    of favor and as testimony that the prayer is granted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that this magnanimity was invariable, even in important
    matters and even when it worked against the prince’s interests.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: At about twenty years of age, the prince renews the war, gains territory gradually,
    and repeatedly offers peace and amity, which the enemy refuses.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tupac Ynca Yupanqui returns to Cuzco to govern the empire and leaves Huayna
    Ccapac with absolute military power.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Assisted by trained captains, Huayna Ccapac conquers the kingdom in three
    years according to the narrator, while the people of Quitu count five years by
    including the earlier fighting of Tupac Ynca Yupanqui.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Yncas are said to have avoided carrying on the war by fire and sword,
    instead occupying the country little by little as the natives withdrew.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The King of Quitu dies of sorrow after losing much of his dominion and believing
    he could not hope for the Ynca’s clemency or the terms offered.
  category: sequence
  evidence_refs:
  - ev:6
