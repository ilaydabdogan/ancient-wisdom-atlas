canonical_text:
  quote: ''
  summary: The Ynca resolves to conquer Chile, consults his Council, leaves ministers
    at court, and advances to Atacama. From there he sends royal-blood scouts with
    local guides into the desert to find a road, report conditions, mark the route,
    and arrange supplies. The scouts traverse the desert to Copayapu, return with
    information, and the Ynca orders an army of ten thousand men to be formed.
  language: English
