canonical_text:
  quote: ''
  summary: Allied people who had previously submitted to Inca rule gather and march
    toward Cuzco to aid the king against the Chancas. The arriving aid is interpreted
    by Uira-ccocha, the Prince, and the Yncas as fulfillment of a dream-promise made
    by an apparition in the form of the Prince's uncle and as favor from the god Uira-ccocha.
    Encouraged, the Yncas consider taking advantageous high passes between the Apurimac
    and Villacunca, but decide to await their friends' arrival.
  language: English
  quote_policy: summarized
