literal_observations:
- id: obs:1
  text: Calabashes called sapallu in Peru are grown like melons, eaten boiled or stewed,
    and are not good raw; another abundant calabash is used to make cups called mati.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The edible calabash kind like those in Spain was not known in Peru until the
    Spaniards came.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The underground vegetable called ynchic by the Indians is described as like
    marrow and tasting of almonds; Spaniards call it maní.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Spanish names for Peruvian fruits and vegetables belong to
    the language of the Antilles and were adopted by Spaniards as Spanish words.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Raw ynchic causes headache, while toasted ynchic is wholesome, good with treacle,
    used for sweetmeat, and yields an oil said to be good for many diseases.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The root called cuchuchu has no Spanish name in the author’s report, is said
    not to grow in the Antilles, and grows in the cold region of Collao.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cuchuchu is sweet, wholesome, edible raw, good for the stomach, and promotes
