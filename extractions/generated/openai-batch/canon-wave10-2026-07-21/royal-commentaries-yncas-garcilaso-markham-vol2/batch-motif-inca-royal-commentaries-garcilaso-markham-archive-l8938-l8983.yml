canonical_text:
  quote: ''
  summary: The Chimu leader dismisses his anxious relations, continues the war until
    the Ynca again sends offers of peace and friendship, and outwardly resists while
    inwardly inclining to submission. He consults his captains and relations, who
    urge acknowledging the merciful Ynca as lord. The Chimu then sends an embassy
    to Prince Ynca Yupanqui, asking that the clemency of the children of the Sun not
    be withdrawn and seeking pardon for rebellion.
