  summary: The passage argues that the general language of Peru can be learned readily
    and is useful for Christian teaching and government. It contrasts Inca administration
    with colonial Corregidores and gives an anecdote of a priest in Chuqui-apu who
    changes his opinion after hearing another priest preach to Indians in the general
    language.
