canonical_text:
  quote: ''
  summary: The passage introduces the ninth book and a chapter on Huayna Ccapac ordering
    a golden cable to be made. It describes Huayna Ccapac as absolute lord of the
    empire, spending a year on his father’s obsequies, then touring the provinces
    and receiving ceremonial welcomes from vassals. Curacas and Indians cover roads
    with flowers and boughs, build triumphal arches, and acclaim his titles. A cited
    passage from Father José de Acosta says Huayna Ccapac was adored by his people
    as God during his lifetime. During this progress, he receives news of the birth
    of a long-awaited son and heir, later named Huascar Ahica, and returns quickly
    to Cuzco for the birth festivities.
