  summary: The passage describes the preparation of sacred festival bread and other
    food. Bread intended for the Ynca and royal blood was made by chosen virgins of
    the Sun, so that it appeared as a gift from the Sun to his children. A separate
    large group of women prepared corn and food for the common people; this bread
    was treated as sacred and eaten only once each year at the feast.
