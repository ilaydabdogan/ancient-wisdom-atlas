  summary: The passage describes the death of Pachacutec after a long peaceful reign,
    his lamentation, deification, embalming, and year-long rites. It names Ynca Yupanqui
    as his heir through Ccoya Anahuarque, notes the king's many children, and explains
    how Spanish historians confused father and son because royal names and titles
    such as Ynca and Yupanqui were used repeatedly.
