canonical_text:
  quote: ''
  summary: 'The passage first continues a fragment about an unnamed woman asking for
    drink and cuca. It then describes Inca administration of royal roads: houses for
    travellers were built along the roads, supplied from royal stores, with care for
    the sick. Travel is described as official rather than private, ordered by rulers
    or officials; those travelling without just cause were punished as vagabonds.'
