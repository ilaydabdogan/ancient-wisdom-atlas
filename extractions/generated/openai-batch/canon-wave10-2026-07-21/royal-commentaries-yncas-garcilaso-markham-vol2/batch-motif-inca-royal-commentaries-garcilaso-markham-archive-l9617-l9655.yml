canonical_text:
  quote: ''
  summary: The passage describes a private language used among the Yncas that was
    not lawful for others to learn and is now lost. It then explains that Inca kings
    ordered the general language of Cuzco to be learned throughout the empire to reduce
    dependence on interpreters, allow direct communication with rulers, and make formerly
    hostile peoples love one another as kin. It adds that some neighboring provinces
    adopted the language and became allies, while under later government many provinces
    forgot it, causing harm according to Father Bias Yalera.
  language: English
  quote_policy: summarized
