  quote: ''
  summary: 'The passage explains an imperial storage system for tribute. It describes
    three kinds of storehouses: village storehouses for famine relief and for the
    crops of the Ynca and the Sun, plus storehouses along royal roads at three-league
    intervals that later served Spaniards as inns and taverns.'
