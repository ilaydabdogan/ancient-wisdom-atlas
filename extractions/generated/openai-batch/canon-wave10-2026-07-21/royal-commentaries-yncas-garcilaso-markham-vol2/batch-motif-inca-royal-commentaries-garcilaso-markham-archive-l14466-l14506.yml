canonical_text:
  quote: ''
  summary: The Ynca conquers the Huacra-chucus, receives their plea for mercy with
    clemency, orders them treated as brothers, distributes cloth and food, halts further
    advance because of terrain and rains, reinforces the frontier, and orders the
    newly subjugated people instructed in religion, law, morals, irrigation, and terrace
    agriculture.
