  quote: ''
  summary: The passage describes Peruvian domestic and wild animals before the arrival
    of the Spaniards. It says paco and huanacu were the only domestic animals, that
    other wild animals were treated as if tame, and that both a wild animal and a
    larger tame beast were called huanacu because of resemblance. Editorial notes
    describe the huanacu and an adjacent note on Canis Incæ.
