  quote: ''
  summary: The excerpt moves from a notice about ownerless cattle and fierce bulls
    in Peru to Chapter XVIII, whose heading concerns camels, asses, goats, their prices,
    and increase. It states that camels were formerly absent from Peru, that Juan
    de Reinaga brought one male and six female camels, and that Don Pedro Portocarrero
    paid him 7,000 pesos for them; the camels multiplied little or not at all. The
    narrator says he first saw a donkey in Cuzco in 1557, bought in Huamanca at a
    high price on Garcilasso de la Vega's order to breed mules. A footnote describes
    smoke-curing meat called toucan and the origin of the terms Boucaniers/Buccaneers.
  language: English
