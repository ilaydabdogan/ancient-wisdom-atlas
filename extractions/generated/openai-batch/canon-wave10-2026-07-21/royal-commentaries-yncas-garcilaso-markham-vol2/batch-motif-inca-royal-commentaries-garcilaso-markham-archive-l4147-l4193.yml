canonical_text:
  quote: ''
  summary: The passage corrects a reported succession error involving Uira-ccocha,
    Yahuar-huaccac, and Pachacutec; explains the queen Mama Runtu’s name as “Mother
    Egg” because of her fair complexion; and attributes to Uira-ccocha a vague prophecy
    that an unseen people would come after a number of Inca reigns and destroy the
    native religion and empire. It also states that, after a visionary apparition,
    Uira-ccocha was treated as an oracle, and priests and Amautas asked him about
    his dreams, alongside other signs such as comets and omens from animals.
  language: English
  quote_policy: summarized
