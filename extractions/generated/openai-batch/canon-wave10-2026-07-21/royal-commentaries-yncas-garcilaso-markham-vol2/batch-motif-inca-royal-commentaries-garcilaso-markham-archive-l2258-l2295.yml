canonical_text:
  quote: ''
  summary: 'The passage enumerates several laws governing Inca tribute: people are
    not to be forced into crafts other than their own except cultivation and military
    duties; tribute should be paid in products of one''s own province; craftsmen serving
    the Ynca or Curacas are supplied with materials and give only labor for a limited
    term; extra work is recorded on knot records; craftsmen and helping families receive
    provisions and care; tribute obligations are task-based, and the narrator rejects
    the claim that women and children worked as tribute.'
  language: English
  quote_policy: summarized
