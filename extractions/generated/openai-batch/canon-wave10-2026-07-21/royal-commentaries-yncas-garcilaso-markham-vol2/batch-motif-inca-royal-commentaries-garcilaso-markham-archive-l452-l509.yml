canonical_text:
  quote: ''
  summary: 'The passage describes an ordered system for cultivating land: the fields
    of the Sun were tilled first, then the fields of widows, orphans, the aged, the
    sick, and other distressed persons, followed by the people’s own lands and finally
    the fields of the Curaca. Village officers announced work obligations from towers
    using a trumpet or shell. Workers brought their own food, seed could be supplied
    from stores, and soldiers’ families received comparable support. The passage ends
    with the beginning of an incomplete anecdote about a superintendent punished in
    the time of Huayna Ccapac.'
  language: English
  quote_policy: summarized
