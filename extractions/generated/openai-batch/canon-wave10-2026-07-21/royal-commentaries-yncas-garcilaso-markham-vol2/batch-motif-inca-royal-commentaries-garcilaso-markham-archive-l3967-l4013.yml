canonical_text:
  quote: ''
  summary: The passage opens a chapter on colonies in the land of Hanco-huallu and
    describes the Ynca Uira-ccocha's reaction to Hanco-huallu's flight. Uira-ccocha
    first grieves, then is said to rejoice because a chief of such valor could make
    vassals formidable. He investigates the condition of the provinces, learns there
    has been no alteration, and sends his brother Paliuac Mayta, two council members,
    and soldiers to visit and pacify Chanca villages by gentle treatment. The delegates
    visit villages, adjacent provinces, and two ancestral fortresses of Hanco-huallu's
    line. A footnote cites Cieza de Leon's variant account of Hanco-huallu/Ancoallu
    and the Chancas fleeing from Ynca governors and settling near Moyobamba.
  language: English
  quote_policy: summarized
