  quote: ''
  summary: After a troublesome war, the Ynca courteously receives and pardons the
    great Yuncawitli, a Curaca described as grieved over his offense, and gives him
    and his people garments from the royal stores. The passage then reports that the
    Indians of Chincha later boasted that the Yncas required two invasions and many
    years to subdue them, and that their yielding was due more to presents and promises
    than to force of arms.
