  quote: ''
  summary: The passage explains the naming of Prince Huascar, whose proper name is
    glossed as “Huallpa, the Sun of Joy.” It says the Yncas gave him a name connected
    with the Sun, which they honored as a god. Huayna Ccapac orders ceremonial preparations
    for the prince’s shearing and naming, continues inspecting his dominions, and
    later returns to Cuzco for the weaning, festivals, and formal giving of the prince’s
    proper name and surname.
