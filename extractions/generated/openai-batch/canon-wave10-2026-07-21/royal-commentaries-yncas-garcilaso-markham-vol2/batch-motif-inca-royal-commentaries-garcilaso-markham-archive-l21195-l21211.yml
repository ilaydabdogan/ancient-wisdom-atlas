  quote: ''
  summary: The passage reports that sows were initially priced higher than goats in
    Peru. It cites Pedro de Cieza de Leon's account that Marshal Don Jorge Robledo
    bought a sow and a boar from the goods of Cristoval de Ayala for 1,600 pesos,
    that the same pig was later eaten at a banquet in Cali, and that unborn sucking
    pigs were bought at high prices.
