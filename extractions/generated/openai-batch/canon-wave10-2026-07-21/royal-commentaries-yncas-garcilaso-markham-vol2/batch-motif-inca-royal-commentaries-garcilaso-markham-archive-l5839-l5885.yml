canonical_text:
  quote: ''
  summary: The passage describes Ynca Ccapac Yupanqui subduing Tarma, Pumpu, and neighboring
    districts through management, gifts, promises, and limited fighting. It then records
    local customs concerning marriage kisses, widow mourning by head-shaving and delayed
    remarriage, fasting restrictions, year-long fasting for the dead by religious
    specialists, and a further eastward advance toward the Antis into districts described
    as lacking order and government.
