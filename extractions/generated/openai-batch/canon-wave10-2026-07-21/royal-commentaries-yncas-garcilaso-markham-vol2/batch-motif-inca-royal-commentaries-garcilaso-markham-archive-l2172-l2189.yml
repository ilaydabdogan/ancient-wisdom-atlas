canonical_text:
  quote: ''
  summary: The passage describes a distribution system in which Indians were not to
    be called upon for tribute from their own lands or goods because provision had
    already been made for chiefs, village stores, the King, and temples and priests
    of the Sun. Remaining royal crops were placed in village public stores. Surplus
    from the lands of the Sun was used for people unable to work after demands for
    sacrifices and temple personnel had been satisfied.
