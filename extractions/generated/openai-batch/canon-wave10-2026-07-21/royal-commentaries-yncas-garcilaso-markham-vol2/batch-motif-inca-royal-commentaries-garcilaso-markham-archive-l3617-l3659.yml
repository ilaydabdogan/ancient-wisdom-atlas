canonical_text:
  quote: ''
  summary: The passage describes provinces willingly entering the Inca empire because
    Ynca UireK ccocha’s rule was desired for his wonders. Afterward the Ynca orders
    provisions and major irrigation channels, including channels beginning near mountain
    springs and running for more than one hundred and fifty leagues to water pastures.
    The narrator praises such channels as grand and beneficent works of the Inca rulers,
    noting the engineering difficulty of cutting rock without iron tools. A footnote
    recounts an Ynca giving llama flesh to a falcon and explains the resulting place-name
    Huamanca, later Guamanga and Ayacucho.
  language: English
