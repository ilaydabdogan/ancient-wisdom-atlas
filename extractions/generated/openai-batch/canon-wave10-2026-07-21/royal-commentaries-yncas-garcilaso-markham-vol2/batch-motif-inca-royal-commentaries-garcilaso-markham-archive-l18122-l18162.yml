canonical_text:
  quote: ''
  summary: The passage describes emeralds seen at Cuzco, including one imperfect specimen
    whose removed section was criticized by connoisseurs because the whole stone could
    demonstrate gradual maturation. It notes that turquoise stones were blue and less
    valued by Indians than emeralds. It states that pearls were known but not used
    in Peru because the Yncas prohibited pearl gathering after considering the toil
    and danger of obtaining pearls from the sea, valuing the welfare of the people
    over riches. The passage then introduces a quotation from Father Acosta about
    pearls.
  language: English
  quote_policy: summarized
