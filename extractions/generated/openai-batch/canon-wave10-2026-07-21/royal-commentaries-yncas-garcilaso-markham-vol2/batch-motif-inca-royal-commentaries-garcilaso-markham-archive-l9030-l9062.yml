canonical_text:
  quote: ''
  summary: After Chimu is brought into peace and vassalage, the Ynca gives clothing
    presents to its chief and nobles. The Prince orders valleys improved with buildings,
    irrigation channels, and storehouses for the Sun, the Ynca, and relief in scarcity.
    He commands a fortress at Parmunca to memorialize victory over King Chimu; the
    narrator notes later destruction by strangers. The Prince leaves officials and
    a garrison, departs with the chief satisfied, and returns to Cuzco for a triumphal
    reception and month-long rejoicing.
  language: English
  quote_policy: summarized
