canonical_text:
  quote: ''
  summary: Atahuallpa publicly orders able-bodied men to march to Cuzco for Huayna
    Ccapac's obsequies and an oath of homage to Huáscar Ynca, with festive dress and
    ornaments. Secretly, he orders captains to assemble armed chosen bands, disguise
    them as servants, stagger their march, and converge near Cuzco. The passage reports
    that more than thirty thousand warriors, mostly veteran troops, were sent forward
    under experienced officers, including Challcuchima.
