canonical_text:
  quote: ''
  summary: A Spanish force is pursued by Indians toward a narrow pass. Finding the
    pass guarded, the Spaniards expect death and invoke Christ, the Virgin, and saints.
    The Indians attack the exhausted Spaniards and horses, kill many, and take Pedro
    Valdivia and a priest alive, fastening them to poles until the battle ends. The
    narrator states that this account comes from friendly Indians who were present,
    three of whom hid in bushes at night and escaped when the victors gathered to
    celebrate.
