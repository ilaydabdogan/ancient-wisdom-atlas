  quote: ''
  summary: 'The passage quotes Father Acosta on pearls in the Indies: their former
    association with royal use, their sources near Panama and the Rio de la Hacha,
    the difficult labor of divers who gather shellfish from cold deep water, the imposed
    dietary and sexual restraint of divers, and reported quantities of pearls received
    in 1587 for the King and private persons.'
