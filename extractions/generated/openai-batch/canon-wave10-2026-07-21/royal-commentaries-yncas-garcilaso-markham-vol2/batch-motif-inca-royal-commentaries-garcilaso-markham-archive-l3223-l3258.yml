canonical_text:
  quote: ''
  summary: The passage describes Uira-ccocha honoring an uncle-apparition with a temple,
    offers a Christian explanation that the devil may have caused the vision, reports
    uncertainty about whether the prince was asleep or awake, and states that the
    apparition claimed to be a child of the Sun and brother of the Ynca. The Chanca
    rebellion and defeat are said to have followed, increasing the Ynca's authority.
    The narrator disputes claims that Uira-ccocha was worshipped above the Sun and
    notes that chief Spaniards were also called children of the Sun or sons of Uira-ccocha
    to divinize them.
  language: English
  quote_policy: summarized
