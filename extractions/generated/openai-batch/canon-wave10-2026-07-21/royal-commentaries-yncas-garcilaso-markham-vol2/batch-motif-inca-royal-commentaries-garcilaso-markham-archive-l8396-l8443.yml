canonical_text:
  quote: ''
  summary: The passage mentions human-victim immolation at principal festivals before
    Inca conquest, then explains that the valley of Rimac was named for an anthropomorphic
    idol whose name means “He who speaks.” The idol was said to speak and answer questions,
    was venerated by Yuncas and later Yncas, and was kept in a rich temple consulted
    by envoys for important affairs. The author also corrects Spanish historians who
    confused the Rimac temple and speaking idol with Pachacamac.
  language: English
  quote_policy: summarized
