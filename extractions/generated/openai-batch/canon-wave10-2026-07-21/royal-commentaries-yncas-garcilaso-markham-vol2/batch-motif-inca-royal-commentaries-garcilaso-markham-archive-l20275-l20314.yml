canonical_text:
  quote: ''
  summary: The passage describes Guaynacava returning to Quito by the coast valleys
    and the Indians making a second great road along the coast. The road is described
    as wide, walled through valleys, marked by poles and stakes through deserts, and
    five hundred leagues long like the mountain road. It notes later damage to the
    poles by Spaniards, the survival of the valley walls, the strewing of branches
    and flowers along the ruler's route, and source attribution to Agustin de Zarate
    and Pedro de Cieza de Leon.
