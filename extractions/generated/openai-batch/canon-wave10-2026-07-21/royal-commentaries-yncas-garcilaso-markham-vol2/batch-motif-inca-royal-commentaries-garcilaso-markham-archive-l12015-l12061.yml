canonical_text:
  quote: ''
  summary: A guide tells Spaniards that a glittering sight is gold and compares the
    province's size to Peru using a mantle. Later reports say Diego Aleman was captured
    and made captain-general by local Indians in a war across the Amaru-mayu river.
    Francisco Moreno and a companion escaped hardship; the companion died after reaching
    a friendly province. Moreno's account encouraged a renewed expedition under Gomez
    de Tordoya, but authorities suspended it because of fear of mutiny.
  language: English
