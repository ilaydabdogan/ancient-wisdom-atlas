canonical_text:
  quote: ''
  summary: Envoys from Tucuman/Tucma address Sapa Ynca Uira-ccocha, praise the reputation
    of Inca justice, laws, care for subjects, and wonders worked by the Sun through
    him. They ask that their land be received into the empire as vassals and that
    royal-blood Yncas teach them religion and laws. They worship the Inca as child
    of the Sun, offer themselves and the products of their land as signs of submission,
    kneel and worship him as god and king, and receive a favorable response marked
    by shared drinking.
  language: English
  quote_policy: summarized
