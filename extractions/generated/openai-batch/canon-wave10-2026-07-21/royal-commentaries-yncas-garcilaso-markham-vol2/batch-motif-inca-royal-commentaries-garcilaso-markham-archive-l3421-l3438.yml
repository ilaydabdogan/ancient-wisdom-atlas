  quote: ''
  summary: The passage introduces a chapter on a famous painting. It says Ynca Uira-ccocha,
    proud of his deeds and of Indian devotion to him, made a graceful memorial that
    glorified himself and satirized his father. The Indians reportedly said it was
    made only after his father died. On a high rock near the place where his father
    stopped during his flight from Cuzco to escape the Chancas, Uira-ccocha ordered
    two birds called cuntur to be painted. A footnote notes Cieza de Leon’s different
    attribution of an ancient building at Cacha to Tupac Ynca Yupanqui.
