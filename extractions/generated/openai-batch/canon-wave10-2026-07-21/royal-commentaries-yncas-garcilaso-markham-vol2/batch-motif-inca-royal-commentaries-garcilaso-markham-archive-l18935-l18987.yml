canonical_text:
  quote: ''
  summary: The chapter recounts Huayna Ccapac assembling an army, marching to Quitu,
    taking the eldest daughter of the defeated king as a concubine, and having Atahuallpa
    and other sons by her. He then moves from Quitu to coastal valleys, offers nearby
    peoples a choice between peace and war, receives voluntary submission from several
    valleys, and spends two years improving cultivation and irrigation while rotating
    troops because of coastal and mountain climate differences.
  language: English
  quote_policy: summarized
