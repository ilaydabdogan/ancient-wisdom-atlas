canonical_text:
  quote: They found three hundred and eighty rats all round the bed and in every corner,
    which the sick man had killed with the spit.
  summary: A sick man left aboard an apparently empty ship is attacked by a multitude
    of rats. He defends himself for more than a day with a spit taken from the galley
    fire, killing many rats. After the crew returns, he recovers and recounts the
    battle. The passage then describes recurring rat plagues on the Peruvian coast
    that destroyed crops and fruit trees until God mercifully abated them.
  language: English
