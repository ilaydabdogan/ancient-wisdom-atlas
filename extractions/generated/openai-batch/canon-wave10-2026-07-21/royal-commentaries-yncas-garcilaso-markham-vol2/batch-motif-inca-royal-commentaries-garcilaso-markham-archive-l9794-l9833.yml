  quote: ''
  summary: After Inca rule ended, heirs of Cuzco language teachers lacked authority
    to require the general or court language. Many provinces forgot or corrupted it,
    multilingual confusion returned, and the narrator says this harmed concord and
    Christian preaching.
  language: English
