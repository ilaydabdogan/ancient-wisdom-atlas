  quote: ''
  summary: The passage briefly notes a red sweet cherry called ussun whose consumption
    reddens urine, then describes the mulli tree, its fruit, leaves, taste, preparation
    into drink, treacle, vinegar, and uses for wounds, skin ailments, sores, and tooth
    cleaning.
