literal_observations:
- id: obs:1
  text: A fruit called ussun is described as red and sweet; after it is eaten, urine
    becomes very red the next day, appearing as if mixed with blood.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mulli tree is said to grow by itself on plains, with fruit hanging in
    long racemes.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mulli berries are round grains about the size of dried coriander seeds,
    and the leaves are small and always green.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A ripe mulli berry is first pleasant and slightly sweet, then becomes very
    bitter after the sweetness passes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A drink is made by gently rubbing the mulli berries in hot water until sweetness
    is released but before bitterness enters; the water is strained and left standing
    for three or four days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The mulli drink is described as pleasant, wholesome, useful for kidney or
    liver diseases, and as improving maize beverage when mixed with it.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The same mulli water can be boiled until thick to make treacle, or placed
