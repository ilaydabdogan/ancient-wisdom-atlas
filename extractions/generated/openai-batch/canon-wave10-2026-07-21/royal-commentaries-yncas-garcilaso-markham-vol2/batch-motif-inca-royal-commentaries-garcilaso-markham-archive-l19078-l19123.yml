canonical_text:
  quote: ''
  summary: The passage describes punishments after treason or rebellion against the
    Ynca empire. A tooth-removal penalty is imposed as a memorial of broken promises
    of fidelity and submission. The Huancavillca accept the punishment humbly, then
    adopt tooth removal as an honourable collective distinction. The narrator also
    reports knowing an Indian informant from that nation and describes Huancavillca
    nose-jewel adornment.
  language: English
  quote_policy: summarized
