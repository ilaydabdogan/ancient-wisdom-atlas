  quote: ''
  summary: 'The passage describes areas near the temple of the Sun: a square of the
    Sun where non-Yncas could bring offerings but could not enter the temple; priests
    received these offerings and presented them to the image of the Sun worshipped
    as a god; the temple ward was called the golden ward because it contained gold,
    silver, and precious stones; another ward lay outside in the suburbs.'
