  quote: ''
  summary: The passage describes the aged Ynca Pachacutec ending further conquests
    after enlarging his empire, then devoting himself to laws, irrigation, town founding,
    temples of the Sun, convents, storehouses, famine relief, religious and military
    reforms, the enlargement of Cuzco, and the construction of a palace. It says that
    because of his deeds and benevolent government he was loved and worshipped as
    another Jupiter.
