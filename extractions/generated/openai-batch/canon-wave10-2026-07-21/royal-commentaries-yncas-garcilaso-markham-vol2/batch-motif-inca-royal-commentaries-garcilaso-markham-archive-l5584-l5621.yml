canonical_text:
  quote: "“the knots expressing numbers only, and not words”"
  summary: The passage explains that Quipu-Camayus used knots to record numerical
    accounts such as tribute, service, population, war deaths, battles, embassies,
    and counts of speeches. Because knots could not record words, reasoning, or full
    historical events, signs and memorized short sentences were used to preserve general
    meanings. These memories were transmitted to successors, especially in the local
    place where events occurred. Learned men called Amantas also turned events and
    embassies into brief fable-like narratives for children, youths, and common people.
  language: English
  quote_policy: quoted
