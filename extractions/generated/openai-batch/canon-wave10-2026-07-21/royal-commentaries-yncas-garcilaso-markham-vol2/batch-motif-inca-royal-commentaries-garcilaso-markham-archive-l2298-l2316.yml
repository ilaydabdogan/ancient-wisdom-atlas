canonical_text:
  quote: ''
  summary: The passage describes an Inca labor law concerning household work and tribute.
    A man could choose not to have his wife and children assist him, provided they
    were not idle at home; judges and decurions could not compel them. Large families
    were viewed as wealthy because they helped complete tribute tasks, while those
    without children could suffer from prolonged labor. A remedy required people with
    many children or completed tasks to help poorer brethren for one or two days,
    and the law was agreeable to all the Indians.
