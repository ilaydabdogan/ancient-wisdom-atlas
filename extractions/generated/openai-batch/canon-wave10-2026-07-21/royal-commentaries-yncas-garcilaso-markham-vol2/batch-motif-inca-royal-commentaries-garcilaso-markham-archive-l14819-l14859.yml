  quote: ''
  summary: The passage describes enemy peoples resisting Tupac Ynca Yupanqui’s campaign,
    being driven into a fortified corner, debating surrender, and finally submitting.
    Tupac Ynca Yupanqui receives them kindly, orders them treated as his children,
    repopulates the depopulated land with emigrants, returns to Cuzco, reflects on
    the suffering caused by resistance, and later visits and improves provinces with
    buildings, irrigation channels, and royal roads.
