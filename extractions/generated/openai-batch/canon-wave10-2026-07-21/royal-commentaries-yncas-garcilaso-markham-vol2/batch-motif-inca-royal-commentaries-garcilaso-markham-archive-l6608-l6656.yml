canonical_text:
  quote: ''
  summary: Ynca Pachacutec organizes troops for an invasion, leaves reserves nearby,
    and remains at Rucana and Hatan-rucana while Prince Ynca Yupanqui and General
    Ccapac Yupanqui continue toward Nanasca. Messages with the usual demands are sent
    to the valley of Yea, whose inhabitants accept the Ynca as lord because of the
    reputed gentleness and goodness of Inca government among their neighbors. Pisco
    gives a similar answer after deciding that aid from Chincha would not suffice
    for resistance; Pisco accepts Inca laws and customs and promises to worship the
    sun while abandoning old gods. The passage also says the fertile valley of Yea
    was enriched by a splendid aqueduct from the mountains, well supplied with water;
    an editorial footnote says Garcilaso was mistaken and places it in Nasca or Nanasca.
  language: English
  quote_policy: summarized
