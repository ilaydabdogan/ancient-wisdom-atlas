canonical_text:
  quote: ''
  summary: The passage explains why the prince was called Uira-ccocha Ynca and why
    the first Spaniards in Peru were also called Uira-ccocha. It links the name to
    the prince's vision, distinctive facial hair and clothing, the Spaniards' beards
    and full clothing, and the belief that the Spaniards were sons of the god Uira-ccocha
    sent from heaven to punish Atahualpa, avenge the Yncas, and liberate Cuzco and
    the empire.
  language: English
  quote_policy: summarized
