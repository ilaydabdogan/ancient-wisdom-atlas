  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first Spaniards who entered Peru were called Uira-ccocha because they
    wore beards and were clothed from head to foot.
  category: relationship
  evidence_refs:
  - ev:2
