canonical_text:
  quote: ''
  summary: The passage introduces Chapter XVII on the Chirihuana nation. It states
    that Ynca Yupanqui, motivated by imperial conquest, sent spies to investigate
    the Chirihuana province east of Charcas. The spies described the land as forested,
    marshy, and difficult to cultivate, and reported that the inhabitants lacked religion,
    laws, houses, and accepted customs; they were said to practice cannibalism, drink
    blood from beheaded captives, eat deceased relatives, bury reassembled bones in
    hollows of rocks and trees, go naked, and ignore kinship restrictions in cohabitation.
  language: English
  quote_policy: summarized
