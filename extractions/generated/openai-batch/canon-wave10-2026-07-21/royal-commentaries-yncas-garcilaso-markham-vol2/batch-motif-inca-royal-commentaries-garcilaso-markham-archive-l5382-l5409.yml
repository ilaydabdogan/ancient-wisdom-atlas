  summary: The passage describes the Chasqui runners stationed along roads to carry
    the king’s orders and provincial news by relay. Swift youths were placed at quarter-league
    intervals with paired huts, watched the roads in both directions, exchanged dispatches
    without delay, and used high, intervisible stations. The term Chasqui is explained
    as meaning to exchange, give, or take.
