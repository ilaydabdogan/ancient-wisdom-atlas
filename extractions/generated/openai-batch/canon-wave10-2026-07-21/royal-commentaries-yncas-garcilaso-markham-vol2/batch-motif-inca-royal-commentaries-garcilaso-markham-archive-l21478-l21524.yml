  quote: ''
  summary: The passage discusses introduced birds in Peru and evaluates an argument
    that fowls existed there before the conquest. A cited author appeals to Indigenous
    terms for fowl and egg and to a shared chicken/cowardice saying. The narrator
    replies that the egg term runtu is generic, that egg ownership is specified by
    naming the bird, and that the chicken-hearted saying was adopted by Indians from
    Spaniards through contact, analogous to Spaniards adopting foreign expressions
    abroad.
