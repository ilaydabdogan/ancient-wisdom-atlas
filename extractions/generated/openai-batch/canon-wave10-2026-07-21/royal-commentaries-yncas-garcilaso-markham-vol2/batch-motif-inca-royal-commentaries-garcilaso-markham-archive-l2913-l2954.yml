canonical_text:
  quote: "“Sole lord, child of the Sun, friend of the poor, have mercy upon us and
    pardon us.”"
  summary: After victory over rebel provinces, the Ynca prince sends prisoners home
    with a message of pardon, is met in Chanca territory by women and children carrying
    green boughs and asking mercy, orders charitable treatment for the people and
    special care for widows and orphans, installs governors and garrisons, and returns
    to the city within a month. The people are astonished by his clemency and some
    declare that his father the Sun changed his disposition.
  language: English
  quote_policy: quoted
