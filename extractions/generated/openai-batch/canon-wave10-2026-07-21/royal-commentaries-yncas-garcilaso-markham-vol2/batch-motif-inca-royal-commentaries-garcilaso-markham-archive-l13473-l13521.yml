  quote: ''
  summary: The passage reports the killing of Governor Loyola, his marriage into the
    Inca royal line, hardship at Arequipa, continuing damage attributed to all four
    elements, Jesuit reports on Chile, and an account of the Arauco rebellion in which
    six Spanish cities, houses, churches, and the faith are said to have been destroyed
    or overthrown. A footnote expands Loyola's Inca marriage lineage and the later
    title and marriage of his daughter.
