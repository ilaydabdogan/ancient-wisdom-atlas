canonical_text:
  quote: ''
  summary: The passage recounts Ngāi Tahu conflict with Ngāti Mamoe, Te-rua-hikihiki’s
    return to seek utu for Manawa, and later Ngāi Tahu expansion to the Arahura pounamu
    country. It gives a tradition about Nga-hue discovering pounamu, taking it to
    Hawaiki, and its later connection with migration canoes and an heirloom earring.
    It also recounts Rau-reka revealing a greenstone adze, Ngāi Tahu conquest of Ngāti
    Waerenga, settlement of the west coast branch, and later conflicts with Ngāti
    Tu-mata-kokiri over bird-catching rights.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Tuki-au had fled after murdering Manawa at Kaikoura,
    and that Ngāti Mamoe were killed, driven out, enslaved, and forced to retreat
    south beyond Tau-mutu.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The conquered lands were divided among Ngāi Tahu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Te-rua-hikihiki, a son of Manawa, returned from the North Island after raising
    forces among his relations to avenge his father, settled at Tau-mutu, and sought
    utu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fighting parties were repeatedly sent against Ngāti Mamoe, but for many years
    neither side gained advantage.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A division of Ngāi Tahu went to Arahura on the west coast to take possession
    of the pounamu or greenstone country.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports a tradition that Nga-hue was driven from Hawaiki through
    the jealousy of Hine-tu-a-olianga, discovered New Zealand, lived at Arahura, found
    a block of greenstone, and took it back to Hawaiki.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nga-hue’s people heard of the fame of the greenstone, wanted to emigrate because
    of a quarrel with a neighboring tribe, and embarked for New Zealand.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says axes made from Nga-hue’s pounamu were used in constructing
    the canoes Arawa and Tai-nui, and that a small piece was fashioned into a greenstone
    earring.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The earring Kai-tangata descended as an heirloom through several generations
    and was presented by Te Rangi-hae-ata to Sir George Grey in 1853 as an assurance
    of regard and esteem.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Rau-reka, visiting Kai-a-poi with Ngāti Waerenga, mocked Ngāi Tahu stone axes,
    displayed a greenstone adze, and the location of the material was learned by Ngāi
    Tahu representatives.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After learning of the Arahura greenstone, Ngāi Tahu crossed to the west coast,
    overcame Ngāti Waerenga, killed most of them, and spared some women and children
    who were incorporated into Ngāi Tahu.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A west coast branch called Pou-tini Ngāi Tahu settled there; later Ngāti Tu-mata-kokiri
    attacked them, and the groups had occasional fights over catching weka, kiwi,
    and kakapo.
  category: sequence
  evidence_refs:
  - ev:8
