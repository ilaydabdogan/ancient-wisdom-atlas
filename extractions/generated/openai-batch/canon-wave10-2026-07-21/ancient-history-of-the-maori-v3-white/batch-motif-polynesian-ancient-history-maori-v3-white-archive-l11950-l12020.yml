canonical_text:
  quote: ''
  summary: A woman and her children take refuge in a whata and are nearly captured,
    but Te-whaka-tuke blocks Taununu at the ladder. After the first attack on Tau-mutu
    ends, the Tau-mutu people seek retaliation, send Iline-haka to recruit allies,
    and assemble forces from the south and Kai-a-poi. The combined force marches on
    Wai-rewa with two guns, the first firearms used there. Tai-a-roa warns the inhabitants
    to flee because guns are being used; the place is deserted, panic spreads, and
    only Mihi-nui is shot. The passage then explains Tai-a-roa's mixed affiliations
    and chiefly standing.
  language: English
  quote_policy: summarized
