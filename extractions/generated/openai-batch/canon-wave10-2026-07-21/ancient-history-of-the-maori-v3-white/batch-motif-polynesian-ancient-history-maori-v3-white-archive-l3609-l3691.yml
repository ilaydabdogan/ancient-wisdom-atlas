  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: Various sorts of kumara are said to have been brought over in the Horo-uta,
    including Pohue-waha-roa and Koiwi.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: Ira lived at Turanga-nui-a-Rua, later built a house at Paka-rae, and Paikea
    came to Whanga-ra and lived there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Rua-wharo and Tu-pai travelled in the canoe Taki-tumu to see Paikea at Whanga-ra
    and to convey a propitiatory gift of kumara to him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Rua-wharo and Tu-pai conspired to kill Ira and use his body as a savoury accompaniment
