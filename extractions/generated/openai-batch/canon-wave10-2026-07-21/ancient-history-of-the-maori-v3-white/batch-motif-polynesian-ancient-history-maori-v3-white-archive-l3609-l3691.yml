canonical_text:
  quote: ''
  summary: A travelling party reaches the coast at Whanga-ra, revives one hundred
    and forty sick men of Pou-hei with warmed water, recognizes features resembling
    a homeland beyond the sea, settles and cultivates kumara brought by Iline-hakiri-rangi.
    Her kumara crop succeeds through proper knowledge, while relatives' plantings
    fail. Later Rua-wharo and Tu-pai bring kumara as a propitiatory gift to Paikea
    but plot to kill Ira in revenge for an old Hawa-iki grievance; Paikea rebukes
    them and saves Ira. Ira then builds a house at U-awa and ceremonially installs
    gods brought in the sacred canoe Horo-uta.
  language: English with Maori names
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: From a mountain the group proceeded toward the coast and came out at Whanga-ra.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Whanga-ra they found one hundred and forty men of Pou-hei, bearers of dogskin
    mats, lying in heaps on the coast with set teeth and near death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Nga-ti-ira put water in calabashes, warmed it on a fire, opened the sick
    men's mouths with sticks, and poured in the warm water; the men revived and joined
    Paikea's party.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Whero-whero they saw the canoe or locality called Te-pua, and at Whaka-manu
    the natural features reminded them of their home beyond the sea.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The people explicitly said the place was like their old country and named
    resemblances to Te-kuri, Te-whaka, and the old canoe Te-pua left high and dry.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: They took possession of the place, occupied it, began to cultivate, set kumara
    brought by Iline-hakiri-rangi, and named the planting place Manawa-ru.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: They did not plant the whole kumara; they preserved and cooked the inner end
    as food while planting the sprouting end.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The kumara brought by Iline-hakiri-rangi and set under her direction grew
    and yielded an abundant crop.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Iline-hakiri-rangi is described as having knowledge of kumara cultivation
