canonical_text:
  quote: ''
  summary: After Tumu-whakairihia teaches Rua-wharo, he warns him and his companion
    not to return by the sea-beach. The brothers ignore the warning, are attacked
    by Tumu-whakairihia's gods, and are spared when he commands the gods to be still.
    They then encounter people dragging the canoe Taki-tumu. Rua-wharo uses newly
    learned incantations to prevent the people from moving the canoe and seeks to
    take charge of it. After he chants, the canoe is moved, floats on the sea, and
    Rua-wharo becomes leader of those who embark. The passage then describes Taki-tumu
    as a fast emigrant canoe whose crew took possession of lands in New Zealand and
    lists chiefs and places associated with its crew.
  language: English
  quote_policy: summarized
