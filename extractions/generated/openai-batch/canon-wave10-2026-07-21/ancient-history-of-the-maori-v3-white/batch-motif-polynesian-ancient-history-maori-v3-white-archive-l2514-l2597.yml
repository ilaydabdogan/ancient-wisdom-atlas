canonical_text:
  quote: ''
  summary: Rua-wharo travels with his younger brother Tu-pai to Tumu-whakairihia to
    seek instruction in wananga ceremonies and incantations. After Rua-wharo insults
    Tumu-whakairihia's wife, Tumu-whakairihia lowers Rua-wharo's tapu by rubbing an
    item from him on the doorway and later retaliates through an oily meal. Tumu-whakairihia
    excludes Tu-pai from teaching, but Tu-pai secretly listens and remembers the whole
    wananga. Tumu-whakairihia also gives Rua-wharo Mahia beach gravel said to attract
    whales when sprinkled on the coast; Rua-wharo later brings it to New Zealand,
    where Te Mahia is named in remembrance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rua-wharo went with his younger brother Tu-pai toward the home of Tumu-whakairihia
    and met Tumu-whakairihia's wife away from her home while she was cutting toe-toe
    to cover an oven.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rua-wharo took liberties with Tumu-whakairihia's wife in the presence of korimako
    birds, and the birds flew to Tumu-whakairihia's courtyard.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tumu-whakairihia inferred that his wife had been insulted; she said she did
    not know the man but described him, and Tumu-whakairihia identified him as Rua-wharo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The wife gave Tumu-whakairihia something she had taken from Rua-wharo, and
    Tumu-whakairihia rubbed it over the upper sill of the house door through which
    Rua-wharo would enter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The stated purpose of rubbing the item on the doorway was to take tapu from
    Rua-wharo and lower his dignity; Rua-wharo is described as higher in rank than
    Tumu-whakairihia.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Tumu-whakairihia welcomed Rua-wharo and Tu-pai into the house and told his
    wife to prepare whale, hakura, and porpoise flesh, which the guests ate.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the night the two guests suffered bowel pain and their garments were
    soiled with whale-oil; Tumu-whakairihia accepted this as retribution and revenge
    for the insult to his wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The next day Tumu-whakairihia gave the guests less oily fish as sympathy for
    the mishap and to counteract the oily food they had eaten.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When asked their purpose, Tu-pai said they came in search of a wananga, and
    Rua-wharo said he had been insulted by being thrown into a fishing-net.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Rua-wharo falsely described Tu-pai as a distant, unrelated man, though the
    passage says Tu-pai was his brother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Tumu-whakairihia said Tu-pai must not stay in the house while Rua-wharo was
    being taught, but Rua-wharo whispered that Tu-pai should stay close outside and
    listen.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Tumu-whakairihia taught Rua-wharo the wananga ceremonies and incantations
    at night; Rua-wharo did not remember all of them, while Tu-pai heard, learned,
    and remembered the whole.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Tu-pai received the name Tu-pai-whakarongo-wananga, and the passage lists
