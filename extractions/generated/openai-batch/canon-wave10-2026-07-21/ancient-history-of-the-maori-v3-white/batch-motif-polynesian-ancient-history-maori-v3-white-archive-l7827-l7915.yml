canonical_text:
  quote: ''
  summary: Te-ahu weeps after Waro questions her division of good and poor fish. Her
    relatives are ashamed and, at her request, make spades after ritual action in
    the sacred forest of Tane. A maire tree is cut and used for a named weapon, and
    the people make wooden spades. Te-ahu’s side approaches Waro’s fortified place,
    hides a main body, and sends one hundred people to dig in Waro’s cultivation.
    After Waro’s people feed them and join the weeding, Te-ahu’s people attack with
    the wooden spades; pursuers from Waro’s pa are drawn into an ambush and killed.
    Waro later performs rites over the dead, gathers an army, defeats Raka-waha-kura’s
    pa, and speaks of small heaven and great darkness. Raka-waha-kura then uses ohonga
    connected with Waro and Waro’s weapons in hostile rites involving a pit, a stream,
    and the feet of the gods.
  language: English
  quote_policy: summarized
