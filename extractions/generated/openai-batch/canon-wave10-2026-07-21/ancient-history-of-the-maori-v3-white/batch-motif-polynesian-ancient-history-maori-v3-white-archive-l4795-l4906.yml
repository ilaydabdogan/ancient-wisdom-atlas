canonical_text:
  quote: ''
  summary: The passage recounts ritual preparation for Horo-uta’s voyage to Hawa-iki,
    Kahu-kura’s acquisition of kumara by chant from coastal cliffs, a priestly command
    that only sacred kumara be carried, the later breach of that rule when fern-root
    is brought aboard, divine anger expressed as a great wind, Kanawa being thrown
    overboard and the canoe capsizing, and the subsequent organization of parties
    to repair the damaged canoe.
  language: English
  quote_policy: summarized
