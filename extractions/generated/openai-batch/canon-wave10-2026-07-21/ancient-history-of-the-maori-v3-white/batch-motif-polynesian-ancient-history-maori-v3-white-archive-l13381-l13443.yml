canonical_text:
  quote: ''
  summary: The passage describes Nga-ti-mamoe as a formerly numerous and powerful
    Middle Island tribe reduced by wars with Nga-i-tahu and living in mountain refuge
    west of lakes Ilawea and Wanaka. It recounts reported sightings, the capture and
    escape of a Nga-ti-mamoe woman gathering shellfish, material traces found by hunters,
    and a catalogue of earlier tribal occupations and territories in the Middle Island.
  language: English
