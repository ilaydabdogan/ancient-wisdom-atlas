canonical_text:
  quote: ''
  summary: 'The passage first describes Te-kanapu placing his father''s corpse before
    Tu-ahu-riri, singing of being cooked, then killing Tu-ahu-riri''s people while
    sparing Tu-ahu-riri as a slave. It then recounts a siege at Waikouaiti: Te-rua-pu''s
    war-party surrounds Te-kanapu''s pa; an attacking priest performs rites for heavy
    rain; Te-rua-pu enters by water and steals the kept symbol of the god Rongo. The
    guardian priest Tara-i-tu dreams of the theft, discovers the god-symbol missing,
    chants, makes a small kumara-cultivation form in honor of Rongo, and calls after
    the departing besiegers.'
  language: English
  quote_policy: summarized
