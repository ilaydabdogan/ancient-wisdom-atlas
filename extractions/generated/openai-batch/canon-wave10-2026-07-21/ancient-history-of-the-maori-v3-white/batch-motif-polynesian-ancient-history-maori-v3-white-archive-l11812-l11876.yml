canonical_text:
  quote: ''
  summary: The passage presents Tama-i-hara-nui as a high ariki of Nga-i-tahu with
    concentrated ancestral rank and intense tapu, so that his shadow could render
    food stores unusable and fatal. It describes his character, travels, trade with
    Europeans at Takapu-neke, marriage and children, the long absence of one son,
    and Tama-i-hara-nui's later death by Rau-paraha. It then introduces the Kai-huanga
    feud, set against earlier prosperity from greenstone expeditions through a revealed
    mountain pass and trade with Europeans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tama-i-hara-nui is described as the upoko ariki, heir to ancestral honours
    of Nga-i-te-rangi-a-moa, and as a person in whom several noble lines met.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: As hereditary spiritual head of the tribe, Tama-i-hara-nui was regarded with
    special reverence; common people did not dare look at his face, and his equals
    experienced his sacred presence as restrictive.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: When Tama-i-hara-nui's shadow fell on a whata or rua containing food, the
    structure and its contents were destroyed because the food became tapu and fatal
    to those who ate it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage describes Tama-i-hara-nui as short, thick-set, dark-complexioned,
    forbidding in features, cowardly, cruel, capricious, energetic, and forceful in
    character.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In his early years Tama-i-hara-nui travelled frequently along the east coast
    of the South Island to visit his connections.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tama-i-hara-nui encouraged trade with Europeans, engaged in transactions with
    Sydney traders seeking flax-fibre, and took up residence at Takapu-neke in Akaroa
    Harbour.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tama-i-hara-nui married Te-whe and had two sons, Te-wera and Tu-te-hou-nuku,
    and a daughter, Nga-roimata.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: One son died as a child; another son went away on a whaling ship, was absent
    for many years, was mourned as dead, and returned after Tama-i-hara-nui had been
    carried off and killed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Rau-paraha is named as the person by whom Tama-i-hara-nui was put to death
    at Kapiti.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The peaceful course of Tama-i-hara-nui's life at Takapu-neke was interrupted
    by a terrible blood-feud among near relations, marked by atrocities.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Kai-huanga feud is described as the first serious outbreak among the Peninsula
    sub-tribes since their conquest of Nga-ti-mamoe.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Tu-te-kawa's son revealed a secret pass to the west coast, after which expeditions
    crossed the mountains annually to obtain greenstone for exchange with purchasers
    from north and south.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The feud is said to have disorganized the Maori communities of the district
    and nearly annihilated the population; its immediate cause seemed trivial to Europeans,
    though mutual jealousies and old grudges are mentioned.
  category: sequence
  evidence_refs:
  - ev:8
