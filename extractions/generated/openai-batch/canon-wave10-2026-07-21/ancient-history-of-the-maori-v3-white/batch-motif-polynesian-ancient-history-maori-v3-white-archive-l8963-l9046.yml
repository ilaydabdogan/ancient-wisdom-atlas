canonical_text:
  quote: ''
  summary: 'The passage recounts successive peoples on the Fish of Maui: Turehu arrive
    from across the ocean, attack and intermarry with Tutu-mai-ao, and are later replaced
    by Maori. Kui, Tutu-mai-ao, and Turehu are described as vanished, with Turehu
    connected to mountain voices and Patu-pai-a-rehe. A second tradition names Kahui-tipua
    as giant first occupants of the South Island, able to stride between mountains,
    swallow rivers, and transform themselves. At Matau, Te-rapu-wai hunting parties
    vanish. A sole survivor reports an ogre with ten two-headed dogs, captivity in
    a cave near a river, her escape by raupo raft, the ogre swallowing the river in
    rage, and the community’s attack on the ogre with fire and clubs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Turehu are described as coming from the other side of the ocean, landing on
    the Fish of Maui, attacking and intermarrying with Tutu-mai-ao, taking sole rule,
    and causing Tutu-mai-ao to become exterminated.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maori, described as descendants of the Maui line, came to seek the land of
    Maui and after ten generations acted toward Turehu as Turehu had acted toward
    Tutu-mai-ao; Turehu became extinct and Maori occupied the land for forty-six generations.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kui, Tutu-mai-ao, and Turehu are said to have disappeared, with no one remaining
    to welcome.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tutu-mai-ao is described as an indistinct being that disappears when looked
    at for some time.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Turehu are said to be represented by Patu-pai-a-rehe, wild men on the mountain
    whose heard language is understood as the voice of Turehu spirits.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Kahui-tipua are described as the first occupants of the South Island and as
    giants able to stride from mountain range to mountain range, swallow rivers, and
    transform themselves into anything animate or inanimate.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Small parties of ten Te-rapu-wai hunters went out to hunt weka and did not
    return.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A sole surviving woman reported that on the hills the party met a tipua accompanied
    by ten two-headed dogs; the tipua killed the men and carried her to his cave near
    the river.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: While captive in the cave, the woman became covered with scales from the ogre’s
    body and was fastened by a cord that the ogre jerked when she was out of sight.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The woman cut raupo near the cave entrance, made bundles into a mokihi raft,
    tied the cord to elastic rushes, and escaped down the river on the current.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After waking, the ogre called to Kai-a-mio, searched for footprints, smelled
    the water, discovered her escape, swallowed the river, and dried it from end to
    end after she had reached her village.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the woman cleaned the scales from her body and told her people about
