canonical_text:
  quote: a rainbow, which suddenly assumed the form of a man
  summary: The passage recounts Rongo-i-tua’s rapid return from Hawaiki and manifestation
    among the Kahui-tipua; explains offerings and ranked origins of kumara and aruhe
    from Rangi; describes Pani as a source and storehouse of food; lists named fern
    children hiding in different landscapes; names Toi, Rongo-i-tua, and Tu-kete as
    food-teaching or voyaging figures; and gives a Ngai-Porou account in which Rongo-marae-roa,
    identified as kumara, is killed and eaten by Tu-mata-uenga, identified as Man,
    after which a remnant of kumara enters Pani’s stomach.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Arai-te-uru is said to have capsized off Moe-raki, with the remains of her
    cargo visible as boulders on the beach at low water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rongo-i-tua returns from Hawaiki to Ao-tea-roa in one day; the Kahui-tipua
    see a rainbow become a man, and Rongo-i-tua stands among them and is thereafter
    called Rongo-tikei.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kumara and aruhe are offerings to Huruka and Pani; aruhe is described as senior
    because it descends from Rangi’s backbone, while kumara comes from Rangi’s front
    and is lower in rank.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pani’s husband observes her going into water, rubbing the lower part of her
    stomach, and filling baskets with kumara and fern-root.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: An old song associates fern-root with descent from behind or the back of Rangi,
    kumara with descent from the front, and nourishment in named mounds.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Huru-ki and Pani tell their children to hide, and named ferns go to mountains,
    forests, the sea-shore, and river-banks.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ancient men and old songs are cited as saying that Toi taught humans to eat
    fern-root and the ti stem, Rongo-i-tua introduced kumara, and Tu-kete in the canoe
    Huruhuru-manu became a great circumnavigator like Tama-tea and Kupe.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Rongo-marae-roa quarrels with his younger brother Tu-mata-uenga over a kumara
    cultivation or plantation called Pohutu-kawa.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Tu-mata-uenga goes to Ruru-tangi-akau to procure weapons, and Ruru-tangi-akau
    gives him the child Te-ake-rau-tangi, who has two mouths, four eyes, four ears,
    and four nostrils to two noses.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the battle Moenga-toto, Rongo-marae-roa and his people are killed; Tu-mata-uenga
    bakes his elder brother, identified as kumara, in an oven and eats him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage explicitly interprets Rongo-marae-roa as kumara and Tu-mata-uenga
