canonical_text:
  quote: ''
  summary: A haka or taunting chant uses images of battle, spears, vengeance, weakness,
    sea-billows, rocks, garments, and a comparison of woman to barracouta and man
    to a standing tree. After the haka, Tawhi-pari is distressed and interprets it
    as an insult and declaration of war against her people. She returns home with
    kumara bulbs and tells her husband. He prepares a return gift of mats and valuables,
    sends it with thirty people, and places warriors behind them to avenge the insult.
  language: English
  quote_policy: summarized
