canonical_text:
  quote: ''
  summary: 'The passage recounts local place-naming and territorial claims around
    Akaroa: combat with Oi-nako, Te-ake''s taking possession by planting a walking-stick
    and arranging a whalebone-weapon boundary marker, a beach named for Hine-pani''s
    shell, and the later arrival of a Nga-i-tahu section led by Te-wera. It also describes
    peacemaking with the high-ranking chief Manaia through passage under Te-wera''s
    arm and a marriage alliance with Ira-kehu, followed by Te-wera''s party moving
    south.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening section, under the heading naming Te-weea, describes a male actor
    encountering Oi-nako, a Ngati-maraoe chief and fugitive from Para-kaka-riki.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two engaged in mortal combat; Oi-nako was killed, and the stream was thereafter
    known by his name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Te-ake landed at the head of the bay, failed to reach Wai-nui because of the
    rough coast, retraced his steps, and became too tired to continue near grassy
    slopes between Duvauchelle and Robinson's Bay.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Te-ake took possession of the point and its surroundings by planting his walking-stick
    in the ground, giving the place the name O-toko-toko.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: To guard against dispute over his southern boundary, Te-ake asked Te-rangi-tau-rewa
    to cross by canoe to a headland and hold up a white whalebone weapon while Te-ake
    watched from O-toko-toko.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The named headland was afterward associated with Te-rangi-tau-rewa's whalebone
    weapon.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A beach below the point was called the shell of Hine-pani after a Maori lady
    who found and prized a shell there.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some years later, another section of Nga-i-tahu under Te-wera came in search
    of a new home, landed at Hiku-rangi, found it occupied, and sent for Manaia.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Manaia is described as a chief of very high distinction, an upoko ariki, and
    heir to family honours of more than one kapu in the tribe.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: A war-dance and speeches were held in Manaia's honour; Te-wera made rude remarks
    about Manaia's appearance, extended his right arm, and called on Manaia to pass
    under it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Manaia passed under Te-wera's arm, and the passage states that peace was thereby
    confirmed between them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: To strengthen the friendship, Ira-kehu, granddaughter of Te-rangi-whakaputa,
    was given in marriage to Manaia and became an ancestress of chiefs of rank.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Te-wera and his party sailed south, settled for a time near Wai-koua-iti,
    and were feared by other sections of their own tribe and by the Nga-ti-mamoe,
    whom they were trying to exterminate.
  category: sequence
  evidence_refs:
  - ev:8
