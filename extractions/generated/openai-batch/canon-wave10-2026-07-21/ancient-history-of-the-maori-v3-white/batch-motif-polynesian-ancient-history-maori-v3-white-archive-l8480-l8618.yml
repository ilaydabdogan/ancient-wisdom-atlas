canonical_text:
  quote: ''
  summary: 'The passage combines several tribal-historical accounts: Pu-hou abandons
    his greenstone after hearing of his son''s death; Rau-rika remains at Taumutu
    and marries Te-korari; Rangi-tama raids parts of the Middle Island and takes greenstone;
    Ue-roa asserts shared language and ancestry between Nga-ti-kahu-ngunu and Nga-i-tahu-potiki,
    with later separations attributed to disputes involving a woman and a dog; a welcome
    song is used for East Cape visitors; and the Rangi-tane, Nga-ti-kahu-ngunu, and
    related groups are described around Hataitai and O-rua-iti, ending with Kainga-kiore
    leaving his fort to fight and dying as his people win.'
  language: English
  quote_policy: summarized
