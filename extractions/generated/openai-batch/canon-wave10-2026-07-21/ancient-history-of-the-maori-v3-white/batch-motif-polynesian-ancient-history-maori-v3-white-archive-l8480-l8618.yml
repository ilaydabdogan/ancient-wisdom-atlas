candidate_motifs:
- id: motif:1
  label: Treasure abandoned after news of kin death
  taxonomy_refs: []
  basis: Pu-hou discards his greenstone after being told of the death of his son and
    the son's party, then returns home permanently.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives the sequence but does not explain Pu-hou's reason beyond
    the juxtaposition with the death report.
- id: motif:2
  label: War expedition for greenstone plunder
  taxonomy_refs: []
  basis: Rangi-tama kills or captures groups in the Middle Island, collects all the
    greenstone he can, and returns home.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: Greenstone is a valued object in the narrative, but the passage does not
    explicitly call it sacred.
- id: motif:3
  label: Tribal branching through dispute over woman and dog
  taxonomy_refs:
  - departure
  basis: The passage attributes later separation of descendants to a woman and a dog,
    and specifically says a dog quarrel led part of Nga-i-tahu-potiki to leave for
    the South Island as Nga-ti-kuri.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The causes are summarized rather than narrated in detail.
- id: motif:4
  label: Shared language and ancestry as basis for kinship recognition
  taxonomy_refs: []
  basis: Ue-roa asserts that Nga-ti-kahu-ngunu and Nga-ti-tahu-potiki have the same
    language and origins in ancestral figures who lived in the same districts.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is an internal genealogical-historical assertion in the passage.
- id: motif:5
  label: Formal welcome song naming visiting relatives
  taxonomy_refs: []
  basis: The hosts chant a welcome to visitors from East Cape and related places,
    call their names, and receive them as their own people.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage provides only one example of the welcome text and its use.
- id: motif:6
  label: Land transfer followed by migration
  taxonomy_refs:
  - departure
  basis: Te Rere-wa gives his lands to Nga-ti-kahu-ngunu and migrates to Aro-paoa
    on the Middle Island.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The stated transfer and migration are brief and not elaborated.
- id: motif:7
  label: Chief leaves fortified safety for open combat
  taxonomy_refs: []
  basis: Kainga-kiore's advisers oppose an attack outside the pa, but he rejects remaining
