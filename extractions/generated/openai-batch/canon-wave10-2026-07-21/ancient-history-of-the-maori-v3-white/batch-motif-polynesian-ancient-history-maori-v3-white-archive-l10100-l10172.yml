- id: obs:1
  text: The passage states that Tu-te-kawa had spared Tuahu-riri's life and therefore
    merited similar protection, while the killing of Tuahu-riri's wives required vengeance
    that could be satisfied by suffering imposed on a near blood-relation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Moki ordered a night watch around the camp because Te-rangi-tamau was away
    and might act to avenge his father's death, but the order was disregarded.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Te-rangi-tamau saw an unusually large amount of smoke from near his father's
    pa and went to Wai-kakahi after dark.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the camp became quiet, Te-rangi-tamau passed through sleeping warriors
    and reached his father's house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Inside the house Te-rangi-tamau saw a fire on the hearth and his wife Punahikoia
    sitting beside it with her back toward him.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Te-rangi-tamau touched Punahikoia gently, signaled silence with a finger to
