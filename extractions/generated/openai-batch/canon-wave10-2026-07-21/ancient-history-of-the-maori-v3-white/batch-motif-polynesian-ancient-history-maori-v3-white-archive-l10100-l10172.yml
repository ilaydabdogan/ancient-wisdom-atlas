canonical_text:
  quote: ''
  summary: The passage explains a feud custom in which a spared life creates a claim
    to reciprocal protection while blood vengeance may be satisfied through a near
    relative. It then narrates Te-rangi-tamau entering Moki's sleeping camp at night,
    sparing Moki after finding his wife and children well treated, leaving a dogskin
    mat as proof, and sending a message that Moki's life had been returned to him.
    Moki wakes, is mortified, utters a phrase that becomes proverbial, and peace is
    later restored. The passage also describes Nga-i-tahu chiefs acquiring land by
    first claim, acts of ownership, and traversing boundaries.
  language: English
  quote_policy: summarized
