  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After learning that Punahikoia and the children had been kindly treated, Te-rangi-tamau
    told her to wake Moki after he had gone and deliver the message that Moki's life
    had been in his hands but had been returned.
  category: speech
  evidence_refs:
  - ev:5
