canonical_text:
  quote: ''
  summary: The passage opens with a song honoring Wera/Te-wera, including his red
    sacred plume and battle success. The prose account says Te-wera moved residences,
    was accused of killing Tu-ki-taha-rangi by witchcraft, and settled at Puraka-nui.
    A Puke-kura war-party attacked at night; Te-wera’s younger brother Patuki was
    captured and killed while Te-wera escaped across a river. Te-wera gathered a war-party,
    voyaged by canoe at night, and a dog was caught and killed as a propitiatory sacred
    offering to Patuki’s manes. Te-wera performed incantations over the dog; its heart
    was roasted, offered to the gods by a priest, and eaten by the oldest man. The
    war-party then crossed toward Puke-kura and exchanged taunting words with the
    people there.
  language: English
  quote_policy: summarized
