canonical_text:
  quote: ''
  summary: Ue-nuku invokes his gods before his foes are destroyed, defeats Ta-wheta
    in sea and land fighting, and the battles receive names connected with sunsets,
    bloodied sea water, and a rising tide. The victors cook human flesh, and the passage
    states that the murders of Ue-nuku's children were avenged. Ue-nuku then takes
    Pai-mahutanga as wife, and their son Rua-tapu is introduced. Years later Hoe-ora
    makes a large decorated canoe for Ue-nuku. Ue-nuku dresses and ornaments the hair
    of selected chiefly youths for the canoe outing, but refuses Rua-tapu the same
    treatment and calls him a son of inferior birth. Shamed and grieving, Rua-tapu
    cuts and plugs a hole in the canoe, then takes the seventy young men far out to
    sea, removes his foot from the hole, hides the baler, and the canoe fills with
    water and upsets.
  language: English
  quote_policy: summarized
