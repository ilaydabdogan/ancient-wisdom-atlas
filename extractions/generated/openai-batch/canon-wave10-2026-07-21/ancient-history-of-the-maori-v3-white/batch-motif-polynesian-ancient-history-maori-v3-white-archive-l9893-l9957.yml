canonical_text:
  quote: ''
  summary: Tuahu-riri forewarns Tu-te-kawa and then invokes his atuas in the forest
    to raise a destructive wind against an enemy fleet in Cook Strait. Tu-te-kawa
    survives, settles in the South Island, and later becomes the target of a Nga-i-tahu
    war expedition led by Moki. The passage also narrates a dispute over acquiring
    land with karaka groves by being first ashore and making a spoken claim.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tuahu-riri calls to Tu-te-kawa to keep inshore, and the narration identifies
    this as a friendly warning meant to save him from coming destruction.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tuahu-riri retires into the forest, invokes his atuas for vengeance, and by
    their agency raises the wind called Te-hau-o-rongo-mai.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tempest disperses Hika-oro-roa's fleet; most canoes are upset and crews
    drown in the waters of Raukawa, while Tu-te-kawa survives by keeping close to
    the coast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After crossing the strait, Tu-te-kawa lands on the South Island and remains
    there among Nga-ti-mamoe kin on his mother's side.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tu-te-kawa uses the armed force with him against the remaining Wai-taha and
    employs spared Wai-taha to work an eel-fishery.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tu-te-kawa moves to Wai-hora for better eels, builds a pa at Wai-kakahi, and
    his son Te Rangi-tamau builds another at Taumutu.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Tu-te-kawa is old, his followers fear the southward advance of Nga-i-tahu
    and urge him to escape, but he refuses with a saying about a basket of flat-fish
    spread open there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The war-canoe Te-maka-whiu, commanded by Moki and crewed by Nga-i-tahu warriors,
    approaches with the stated intention of avenging Tuahu-riri's wives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Koukou-rarata a council debates whether to approach Wai-kakahi by land
    or sea; Moki cites a warning that Tu-te-kawa is like a wood-pigeon on a bough
    facing his foes, and the party chooses the sea route.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Near Okaiu's Bay, Moki sees karaka groves and instructs his slave to be first
    ashore and cry a claim, but Mahi-ao-tea reaches the beach first and proclaims
    a claim to the pa, karaka, and bay.
  category: action
  evidence_refs:
  - ev:6
