canonical_text:
  quote: ''
  summary: Ue-nuku spares frightened visitors, has them fed, and restrains his people
    from killing them as they leave by canoe. He exchanges threats with Ta-wheta,
    then prepares for war. Whati-ua advises timing the campaign around the ripening
    of kumara and karaka and leads a land party. Ue-nuku asks that Pou-ma-tangataiga
    or Pai-mahu-tanga be spared if captured so she may become his wife. A seventy-man
    party travels inland, surrounds a large house at night, overhears Hapopo consulting
    the god Te-kanawa through the medium Kahu-rangi, and hears the god deny any nearby
    war-party. At dawn the attackers rush the house, slaughter many of Ta-wheta's
    people, while Ta-wheta escapes.
  language: English
  quote_policy: summarized
