canonical_text:
  quote: ''
  summary: The passage recounts the killing of Te-pehi and other northern chiefs at
    Kai-a-poi after Haki Tara warns that treachery is planned. Rau-paraha withdraws,
    later devises revenge from Kapiti, and uses Captain Stewart's brig to transport
    concealed warriors to Aka-roa Harbour. Tama-i-hara-nui is lured aboard with his
    wife and daughter, seized below deck, and other visitors from shore are captured
    through the hatchway. Takapu-neke is then attacked, with many killed or taken
    prisoner. During the return voyage, Tama-i-hara-nui smothers his daughter; the
    passage breaks off before completing the stated reason.
  language: English
  quote_policy: summarized
