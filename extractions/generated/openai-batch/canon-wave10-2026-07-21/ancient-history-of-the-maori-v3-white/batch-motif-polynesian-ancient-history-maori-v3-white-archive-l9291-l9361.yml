canonical_text:
  quote: ''
  summary: The passage recounts a fishing party called “the Six” being driven out
    to sea and lost, followed by editorial discussion linking Ngati-mamoe, Moriori,
    and Chatham traditions. It then describes alliances between Ngai-tara and Ngati-mamoe,
    the Ngai-tahu at Ha-taitai, Tu-maro’s marriage, his wife’s improper intimacy during
    his absence, the child’s birth after confession, ritual purification and adornment,
    Tu-maro’s transfer of wife and child to Te-ao-hiku-raki, and his decision to leave
    with his kin across the strait.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group called “Nga toko ono” or “the Six” went fishing from Para-kaka-riki,
    were caught by a violent north-west wind, driven out to sea, and were never heard
    of again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage’s parenthetical note says it is “not at all improbable” that the
    canoe reached the Chathams and that the crew became progenitors of one section
    of the inhabitants.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The note states that Moriori preserved names of headlands around Aka-roa,
    counted Mamoa among their ancestors, and used many words said to be nearer to
    Rarotongan forms than Maori equivalents.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Ngati-mamoe, like Ngai-tahu, came from the east coast
    of the North Island and likely held the South Island for at least a hundred years
    before Ngai-tahu appear in the account.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A small tribe called Ngai-tara first made alliances with Ngati-mamoe and are
    described as the cause of Ngai-tahu crossing the strait.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ngai-tahu were located at Ha-taitai, where a band of warriors renowned for
