  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Kahu-kura-te-paku was an old chief connected with Ngai-tara, and his son Tu-maro
    was married to Ra-kai-te-kura, daughter of Tama-ihu-poru and descended from Tahu.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: During Tu-maro’s absence, his pregnant wife had an improper intimacy with
    Te-ao-hiku-raki.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When Tu-maro returned and his wife went into labour, he repeated customary
    delivery charms and ancestral genealogies, but the child was not born until after
    she named Te-ao-hiku-raki.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the birth, Tu-maro moved his wife from house to house until the purification
    of both mother and child was completed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Tu-maro instructed the woman to paint herself and the infant with red ochre,
