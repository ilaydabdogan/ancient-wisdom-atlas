canonical_text:
  quote: ''
  summary: 'The passage recounts movements around East Cape after Hine-kau-i-rangi
    goes inland: followers name places along her route; Pou-heni''s sacred coastal
    party travels without fire or food and is later revived when found near death;
    Awa-paka''s dead bird-preserving party and Pawa''s dog are seen as stones; the
    Horo-uta canoe, an ocean-brought bird-trap, and a search for haumi timber are
    described; Pawa makes water and chants, giving rise to named rivers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hine-kau-i-rangi had gone inland with vassals and friends; some priests say
    her party numbered two hundred and sixty.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: People following Hine-kau-i-rangi named places where she rested, took food,
    or sat on peaks or hills.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Tupa-roa, Pou-heni's one hundred and forty men, carrying several kinds
    of dog-skin or dog-hair mats and other mats, had not arrived.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pou-heni's party traveled by the coast and was sacred, so they did not carry
    fire or food and slept without shelter; their sleeping places were called Po-ure-tua.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The pursuing party reached Tai-harakeke, where Awa-paka's bird-preserving
    party had slept on the ground and died; their bodies are described as stones stretched
    on the ground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Ana-ura the pursuing party cooked food in ovens, and the ovens are said
    to remain visible.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Whanga-ra the pursuing party found Pou-heni's sacred party like dead men,
    covered with blowflies, weak from lack of food, and with clenched teeth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The pursuing party lit a sacred fire, heated urine in calabashes, opened the
    jaws of the apparently dead with sticks, poured the liquid into their mouths,
    and all recovered.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Pou-heni left fire and food and divided followers into groups responsible
    for dogs, weapons, bird-spears, sacred food offerings, eel-pots, and carrying
    gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Turanga they found Ira and Kei-wa living there and the canoe Horo-uta laid
    up at Te-muriwai.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Turanga they also found a bird-trap, a pole with a snare on top called
    whaka-manu, said to have been brought from the other side of the ocean, and they
    found Te-kuri-a-Pawa turned into stone.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: They returned along the same road to search for a haumi, a piece of timber
    to lengthen the canoe Horo-uta; when they found the timber on a mountain, they
    named the mountain Maunga-haumi.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: At Kai-kamakama, Pawa made water to float the haumi, stretched out his hands,
    and chanted over the water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The rivers Te-wai-roa and Te-motu are said to be from Pawa's water; the haumi
    timber was left because the canoe had already been brought to Te-wai-roa.
  category: relationship
  evidence_refs:
  - ev:9
