canonical_text:
  quote: ''
  summary: The passage recounts a feud said to begin when Muri-haka wore a dog-skin
    mat belonging to Tama-i-hara-nui, whose apparel was considered sacred. The act
    was treated as an insult, leading first to the killing of a servant-woman, then
    to retaliatory killings, a grieving widow's brothers organizing attacks, and finally
    Tama-i-hara-nui leading a war-party against Tau-mutu, where a battle caused many
    deaths and some women were protected by Kai-a-poi kin.
  language: English
  quote_policy: summarized
