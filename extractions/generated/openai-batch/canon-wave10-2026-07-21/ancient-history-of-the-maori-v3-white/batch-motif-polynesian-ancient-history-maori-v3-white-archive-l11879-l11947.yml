- id: obs:1
  text: Muri-haka, wife of Po-tahi, put on a dog-skin mat belonging to Tama-i-hara-nui
    that had been left in charge at Wai-kakahi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The act was regarded as an insult because apparel belonging to Tama-i-hara-nui
    was held to be exceedingly sacred.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: After consternation in the pā, exasperated men killed Rere-waka, a servant-woman
