canonical_text:
  quote: ''
  summary: The passage recounts a battlefield encounter in which Whare-kino is wounded
    and nearly killed but is spared when Tu-huru recognizes him as a cousin. It then
    describes joined forces attacking Nga-ti-tu-mata-kokiri, subsequent attacks and
    enslavements by Nga-ti-apa, the killing of the remaining Nga-ti-tu-mata-kokiri
    chiefs and followers, an attack on Tasman’s boat crew at Te Tai-tapu/Massacre
    Bay, and later movements and conquests involving Nga-ti-apa, Wai-kato, Nga-ti-toa
    and allies, and Rangi-tane.
  language: English
  quote_policy: summarized
