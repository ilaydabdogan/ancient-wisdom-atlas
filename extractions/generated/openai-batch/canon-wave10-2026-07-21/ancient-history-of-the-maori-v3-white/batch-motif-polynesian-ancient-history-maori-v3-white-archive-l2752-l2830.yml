canonical_text:
  quote: ''
  summary: The passage recounts a canoe foundering in the ocean, survival by Paikea
    and Rua-tapu, and a flood sent through oceanic power and tide-ruling ancestors,
    with Hiku-rangi remaining above the waters and a remnant saved. It then gives
    tribal variants in which Rua-tapu uses Ue-nuku's sacred comb, is rebuked as low-born
    in contrast to Ka-hutia-te-rangi/Ka-hutia-te-raki, becomes ashamed, and departs
    or is incited to further action.
  language: English
  quote_policy: summarized
