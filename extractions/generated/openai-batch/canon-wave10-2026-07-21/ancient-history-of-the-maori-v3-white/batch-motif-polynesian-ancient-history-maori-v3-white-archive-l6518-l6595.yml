canonical_text:
  quote: ''
  summary: Tu-whakairi-ora consents to fetch the daughter of Te-ao-mania as a wife,
    though she already has a husband, Tu-hau-anu. A party visits her village, receives
    hospitality, then seizes her near a litter they had prepared; Tu-hau-anu follows,
    mourns with her, and relinquishes both her and a valuable dogskin mat. The woman,
    named Ihiko-o-te-rangi, bears seven children to Tu-whakairi-ora. Later, Rua-taupare,
    the first wife, is distressed that her children are praised only under Tu-whakairi-ora’s
    name, returns by canoe to Toko-maru, is mocked there, asks her brother to fetch
    a child or grandchild, and that descendant builds a named house and summons tribes
    and chiefs to assemble.
  language: English
  quote_policy: summarized
