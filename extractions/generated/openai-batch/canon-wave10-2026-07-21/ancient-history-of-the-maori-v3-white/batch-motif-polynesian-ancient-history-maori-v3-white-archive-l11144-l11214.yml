canonical_text:
  quote: ''
  summary: A confidential warning about flax and a middle choice is followed by Manawa's
    visit to Pakihi for marriage consent. He and his followers are received, separated,
    ambushed, and trapped. Manawa tries to send word to Nga-i-tahu by messengers marked
    with his blood; the first attempts fail, but Tahua escapes by evading spears,
    climbing the outer fence, and leaping from a cliff to the beach. Nga-ti-mamoe
    kill and eat the captives. Nga-i-tahu delay revenge for a year until traces of
    Manawa's cooking-place are covered, then prepare a seaborne war-party.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker gives a confidential warning not to use green flax but whitau, and
    not to take the foremost or hindmost item but the middle one, named Kopupara-para,
    described as the star of the year.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Manawa returns to Pakihi with about one hundred followers to seek Tu-whakapau's
    formal consent for Tu-whakapau's daughter's marriage to Manawa's son.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Within the reception, Maru's brother and some relatives are led by Hine-uniu-tahi
    to her house, while the rest of Manawa's party are shown into a large house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: As Manawa enters the pa through a low gateway, Taki-auau strikes him with
    a stone axe, and Manawa receives another blow before reaching his companions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The door of the house is closed after Manawa enters, and Manawa tells his
    men that they are trapped, surrounded, and must prepare to die.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Manawa asks that news of their fate be carried to Nga-i-tahu; he smears a
    chosen messenger's forehead with blood from his wound and sends him out, but the
    messenger is killed by spears.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After repeated failed attempts, Tahua volunteers for a final attempt, is smeared
    with Manawa's blood, and is sent with Manawa's last message to his family and
    tribe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tahua evades spears and pursuers among the houses and enclosures of the pa,
    climbs the outer fence, leaps from a cliff to the beach, rises from the sand,
    and defies his pursuers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: While fleeing along the coast, Tahua explains to people he meets that he is
    returning for a forgotten item at the last camping-place, and he reaches Wai-papa.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Nga-ti-mamoe kill and eat the victims of the treachery.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Nga-i-tahu decide to wait a year before avenging Manawa, fearing the effect
    of fighting where blood sacred to them had recently been shed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Nga-i-tahu prefer to wait until grass has grown over the oven in which Manawa
    had been cooked and hidden the traces of his fate.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: When the waiting period ends, a war-party is summoned and decides to travel
    by sea; Te-kane is not ready at first and later launches his canoe to follow.
  category: action
  evidence_refs:
  - ev:8
