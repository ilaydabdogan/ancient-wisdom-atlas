- id: motif:2
  label: Named navigator creates enduring landscape feature through destructive water
    act
  taxonomy_refs:
  - culture_hero
  basis: Kupe, called the great navigator, is said to pour salt water on cultivations,
    destroying them and forming pools that remain.
  evidence_refs:
  - ev:3
