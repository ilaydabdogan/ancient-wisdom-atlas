canonical_text:
  quote: ''
  summary: The passage describes Nga-i-tahu-related migration and settlement at Wai-mea,
    the growth of separated sub-sections through alliance with Nga-ti-mamoe, other
    sound settlements from the west coast of the North Island, Kupe’s reported destruction
    of Te-hau’s cultivations with salt water and the resulting pools, west-coast spread
    by related groups, and the beginning of Tu-ahu-riri’s journey to find his father.
    Tu-ahu-riri crosses to Wai-mea with seventy men, is welcomed but not recognized,
    and the local people prepare to kill and cook the strangers before children observe
    them at the house entrance and window.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group sailed along Blind Bay to the mouth of the Wai-mea, landed, and built
    a pa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nga-itara, Nga-ti-whata, and Nga-ti-rua are described as sub-sections of Nga-i-tahu
    that separated from the main body at Ha-taitai and gained importance through alliance
    with Nga-ti-mamoe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Small settlements in the sounds are said to have come from the west coast
    of the North Island, including detachments of several named groups; Rangi-tane
    are described as the most important among them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Te-hau is named as chief of the Rangi-tane, and his cultivations at Te-karaka
    are said still to be pointed out.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kupe is said to have poured salt water on Te-hau’s cultivations to destroy
    them, forming pools that remained.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nga-ti-wairangi and Nga-ti-kopiha, described as descended from Tura in common
    with Nga-ti-mamoe and Nga-i-tahu, settled beyond Wai-mea and spread down the west
    coast.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: About twenty-five years after the secession of Kahukura-te-paku and his followers,
    communication with Hataitai was reopened.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tu-ahu-riri is described as deserted in infancy by Tu-maro and as an adult
    living with his wives on the south-east coast of the North Island.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: As a child, Tu-ahu-riri heard himself called a bastard, asked his mother whether
    it was true, and asked where his father was; his mother told him to look where
    the sun sets.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: After reaching manhood, Tu-ahu-riri decided to search for his father, left
    his wives behind, embarked with seventy men in a war-canoe, and crossed the straits
    to Wai-mea.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At Wai-mea, the inhabitants welcomed Tu-ahu-riri and his companions and invited
    him to occupy the residence of their chief; inside, Tu-ahu-riri lay near the door
    while his companions sat around the sides.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Because no one recognized the newcomers, preparations were made for their
    destruction; Kahu-kura-te-paku stationed armed men around the house, while women
    and slaves heated stones and prepared ovens to cook the bodies.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Children gathered near the entrance to look at the strangers, one child climbed
    to the window and reported what he saw, and Tu-ahu-riri looked up at the roof
    and began an incomplete remark about red battens.
  category: sequence
  evidence_refs:
  - ev:11
