canonical_text:
  quote: ''
  summary: A song addressed to Tu-te-aio-kangi uses imagery of burrows, enchantments,
    feathers, flight northward, divine presence, mountain climbing, sacred food offerings,
    named mountains, a comet sign, and battle violence. The passage then gives a genealogy
    of Raka-waha-kura and narrates his visit to his sister Te-ahu, wife of Waro; Waro
    catches fish, Te-ahu allocates good fish to her visiting brother and his companions,
    and Waro strikes her.
  language: English
  quote_policy: summarized
