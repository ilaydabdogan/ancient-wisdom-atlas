  - ev:5
- id: obs:10
  text: Raka-waha-kura is said to have belonged to the North Island; his named children
    include Raka/Ranga-wha-kata, Maruhou, and Tahu-mutu; Maruhou begat Kuri, Kuri
    begat Rangi-tawhio, and Rangi-tawhio’s descendants came to the South Island.
