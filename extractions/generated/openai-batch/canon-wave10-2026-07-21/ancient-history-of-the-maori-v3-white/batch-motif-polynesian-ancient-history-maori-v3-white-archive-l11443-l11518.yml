canonical_text:
  quote: ''
  summary: The passage first narrates Te-rangi-tamau's secret night return to a camp
    where Moki and his followers are sleeping, his silent meeting with his wife Puna-hikoia,
    his decision to spare Moki after learning his wife and children were treated kindly,
    and the restoration of peace. It then narrates Hau-reka's discovery of a route
    through mountain barriers to the east coast, her display of a sharp greenstone
    fragment to canoe makers with blunt tools, the spread of greenstone tools and
    weapons, an heirloom greenstone ornament claim, and conflict between Nga-ti-wairangi
    and Nga-i-tahu over greenstone.
  language: English
  quote_policy: summarized
