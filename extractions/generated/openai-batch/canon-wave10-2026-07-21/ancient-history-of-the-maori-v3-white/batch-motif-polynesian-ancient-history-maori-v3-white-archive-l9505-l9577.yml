canonical_text:
  quote: ''
  summary: 'Tu-ahu-riri escapes an attack, but Tu-te-kawa kills his two wives. Tu-ahu-riri
    recovers his waist-belt and weapons, threatens vengeance through his gods, invokes
    familiar spirits, and raises the gale Te-hau-o-Rongo-mai, which disperses Tu-te-kawa''s
    fleet and drowns many crews. Tu-te-kawa reaches the South Island and remains there
    to avoid vengeance. The passage then turns to events leading toward migration
    to the South Island: Te-hau-taki, driven from a fishing-ground by a gale, lands
    after dusk near the Nga-ti-kuri pa and tries to reach Tiotio''s house unobserved.
    A crew member guides the party to Tiotio''s house, where Tiotio''s wife greets
    him but is checked so the pa will not be roused.'
  language: English
  quote_policy: summarized
