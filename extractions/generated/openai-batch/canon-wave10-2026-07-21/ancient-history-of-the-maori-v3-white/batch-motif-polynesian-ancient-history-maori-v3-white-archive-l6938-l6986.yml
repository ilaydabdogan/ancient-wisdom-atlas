canonical_text:
  quote: ''
  summary: The passage introduces Nga-ti-ira traditions concerning a war at Pakau-rangi.
    A chief woman, Tawhi-pari, is sent to ask for kumara bulbs for planting. The subsequent
    war scatters Nga-ti-ira, with some fleeing and some remaining as servants cultivating
    kumara. Tawhi-pari and companions visit Pakau-rangi Pa, where sub-tribes perform
    a haka. The visitors interpret the words and attitudes of the haka as a challenge
    to war. The performers carry decorated tawa sapling sticks called toi, and the
    song mentions a sacred hill-top, the sun drawing up generative power, poi, dancing,
    and Pare-huia with a feather plume.
  language: English
  quote_policy: summarized
