canonical_text:
  quote: ''
  summary: 'The passage recounts conflict involving Nga-ti-mamoe and Nga-i-tahu: a
    high-ranking captive is killed; a warrior warns that the killers will be driven
    into forest refuges; remnants are pursued into dense south-western forests. Later
    anecdotes report a Nga-ti-mamoe woman killed and eaten, two men escaping near
    Apa-rima, smoke and a deserted cliff cave with goods, later smoke and footprints,
    and the possibility that survivors remain hidden. The passage then turns to renewed
    quarrels among Nga-i-tahu sections and a killing by Te-wera.'
  language: English
  quote_policy: summarized
