canonical_text:
  quote: ''
  summary: Nuku, also called Ue-nuku, forbids Rua-tapu to use the comb of his elder
    brother Kahu-tia-torangi, who is described with high-status birth and head-dress
    markers. Angered, Rua-tapu plans revenge by gathering one hundred and forty first-born
    sons of senior families and lords for a canoe expedition. He prepares hidden spears,
    secretly bores and plugs a hole in the canoe, then removes the plug at sea and
    hides the baler. The canoe fills, overturns, and the crew are cast into the sea.
    Rua-tapu keeps afloat with the baler and kills many of the exhausted men, by drowning
    some and using his weapon on others, until only Paikea and Hae-ora remain at the
    supplied passage ending.
  language: English
  quote_policy: summarized
