canonical_text:
  quote: ''
  summary: The passage recounts men in a fishing canoe being blown out to sea, then
    connects this with Chatham Islander accounts of ancestors arriving at Whare-kauri
    after being blown from their own coast. It describes Tira's people leaving after
    Tira's defeat and death, being received by Maru-po, abandoning fighting and cannibalism,
    and returning to New Zealand after kumara-seeds failed. It then describes the
    nearby pa Para-kaka-riki, Moki's conquest in the war-canoe Maka-whiu, and Kai-apu
    and Te Makino's reconnaissance, vengeance journey, and observations of fertile
    plains and abundant foods.
  language: English
  quote_policy: summarized
