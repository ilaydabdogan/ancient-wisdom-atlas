canonical_text:
  quote: ''
  summary: The passage recounts killings at Pakau-rangi, including the death and cannibalization
    of Hau-iti's wife and the survival of another woman who reports the event. Kahu-kura-nui,
    Hau-iti's son and the saved woman's husband, prepares revenge. An unnamed woman
    from Nga-ti-ira tells him the pa can be overcome by crawfish. Crawfish are collected
    and dried; the besieged Nga-ti-ira suffer from thirst because water lies outside
    the fort and is controlled by the besiegers. Some besieged people use soaked flax
    garments to carry water until guards stop them. A final assault takes Pakau-rangi,
    and the battle is remembered by a name referring to wetted garments. Survivors
    flee and become widely dispersed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At or near Pakau-rangi, people rushed out and killed Kakau-manawa-he, saved
    his companion, and cut up, cooked, and ate the wife of Hau-iti.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The saved woman returned to Hau-iti and related what had happened.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kahu-kura-nui, described as Hau-iti's son and the husband of the saved woman,
    became cast down and began assembling an armed band for revenge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A woman from the Nga-ti-ira came to Kahu-kura-nui out of sympathy and told
    him that the pa could be overcome by means of crawfish.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kahu-kura-nui ordered a large taking of crawfish; many people collected and
    dried crawfish from coastal fishing stations and other waters, and the crawfish
    were carried to Nga-ti-ira.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Nga-ti-ira in the fort suffered for want of water because the water source
    was outside the fort and came under the control of the besieging party.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Besieged people with relatives among the besiegers used thick flax garments
    instead of calabashes by soaking the garments in water, bringing them back, wringing
    water out for women and children, and sucking the wet fringes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The need for water increased because the besieged continued eating dried crawfish
    through hunger; later, suspicious armed guards stopped people from wetting garments
    at the water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: During the final assault, Kopara-kai-tarewarewa and his friends went outside
    and resisted the besiegers, but the Nga-ti-ira were faint from lack of water,
    were killed, and Pakau-rangi was taken.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The battle was remembered by names meaning the death in the wet or wetted
    garment, and the conquest was attributed to Kahu-kura-nui.
  category: other
  evidence_refs:
  - ev:9
  - ev:11
- id: obs:11
  text: The remnant of Nga-ti-ira fled in various directions, including Kai-ora, farther
    north, hills, mountains, cliffs, stream-sides, Wai-rarapa, and the South Island
    at Kai-koura.
  category: sequence
  evidence_refs:
  - ev:10
