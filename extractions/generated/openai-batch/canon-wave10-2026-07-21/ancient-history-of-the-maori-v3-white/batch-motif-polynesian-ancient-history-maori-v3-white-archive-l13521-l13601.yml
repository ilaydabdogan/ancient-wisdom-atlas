canonical_text:
  quote: ''
  summary: The passage describes intertribal conflict in the Middle Island, including
    disputes over bird-catching rights, Nga-i-tahu requests for aid, a peace offer
    by Nga-ti-mamoe, an ambush at a Nga-ti-mamoe pa, the capture and near killing
    of the chief Tara-whai, his escape, his nighttime recovery of a prized whalebone
    hoe-roa by impersonating another man, and his return to his people through a diversionary
    feigned attack.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nga-i-tahu and Nga-ti-tu-mata-kokiri sub-tribes were sometimes friendly and
    aided each other, but disputes and fights occurred over rights to catch weka,
    kiwi, and kakapo in the upper Grey and Buller districts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nga-i-tu-ahuriri sent an invitation to friends at Wai-rarapa for aid, and
    another group of Nga-i-tahu crossed the Strait and settled at O-takou.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nga-ti-mamoe, weary of war, offered peace, which Nga-i-tahu accepted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tara-whai, a Nga-i-tahu chief, was invited with some of his people to a Nga-ti-mamoe
    pa south of Ti-maru.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the way to the pa, Tara-whai's party was ambushed and murdered; Tara-whai
    alone escaped death but was captured after a struggle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Nga-ti-mamoe decided to cut Tara-whai to pieces while alive; four men held
    him on the ground while a fifth began cutting his stomach and chest with flint.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When strangers arrived at the pa, the attention of the men holding Tara-whai
    shifted, and he sprang up and escaped to the forest.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tara-whai had possessed a much-prized hoe-roa, described as a long whalebone
    spear, which his enemies took.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: At night Tara-whai approached the enemy camp and saw Nga-ti-mamoe people sitting
    around a fire examining his hoe-roa and speaking about the bravery of its former
    owner.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tara-whai noticed that a Nga-ti-mamoe man with defective speech was absent,
    sat in the outer circle, imitated that man's voice, and asked to look at the weapon.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Nga-ti-mamoe handed the hoe-roa to Tara-whai; he leapt up, struck two
