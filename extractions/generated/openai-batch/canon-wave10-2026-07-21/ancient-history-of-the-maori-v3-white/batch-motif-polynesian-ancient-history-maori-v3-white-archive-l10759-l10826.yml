canonical_text:
  quote: ''
  summary: Before a battle, Nga-ti-mamoe prepare ordinary weapons and spears tipped
    with poisonous ray stings. Alarm spreads among Nga-i-tahu until Maru calls on
    veterans to inspire courage; several decline, but Ra-kai-tau-wheke volunteers
    to lead the attack and calls on the seer Pohatu to prepare and read signs. Pohatu's
    omens support immediate attack. Nga-i-tahu advance over a hill but are met by
    Nga-ti-mamoe, who had been informed by Kiti. Ra-kai-tau-wheke leads from the front,
    reaches the ridge, and routs the enemy. In the aftermath Tu-te-ure-tira pursues
    Tu-matai-ao but is hindered by a foot injury, and they exchange boasts. Kana-te-pu,
    who had dreamed of catching a white crane and interpreted it as a sign of victory
    over a Nga-i-tahu warrior, performs rites at a stream to bind the omen and goes
    to war. He attacks Ra-kai-tau-wheke by jumping on his shoulders, but Ra-kai-tau-wheke
    mortally wounds him, and the narration identifies the fallen Kana-te-pu with the
    white crane.
  language: English
  quote_policy: summarized
