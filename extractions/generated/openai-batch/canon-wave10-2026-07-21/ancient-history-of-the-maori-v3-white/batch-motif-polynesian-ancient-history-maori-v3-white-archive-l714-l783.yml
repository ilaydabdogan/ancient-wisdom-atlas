canonical_text:
  quote: ''
  summary: After a genealogical introduction to Ue-nuku’s household, Ue-nuku’s children
    discover that their kumara is being stolen by Whena’s children. Ue-nuku sets up
    storage stages and owl watchers, who catch the thieves. Whena, urged by Pou, orders
    several of Ue-nuku’s children killed. Rongo-ue-roa survives wounded among the
    bodies, hides in a canoe, reaches Ue-nuku’s settlement, and warns his father.
    Ue-nuku conceals Rongo-ue-roa in a mat, confronts Whena’s false denial, and reveals
    the survivor before Whena’s party eats and prepares to depart by canoe.
  language: English
  quote_policy: summarized
