canonical_text:
  quote: ''
  summary: 'The passage recounts conflict and flight after Pakihi: fugitives hide
    in caves, Taki-auau flees with his son and followers, Koroki-whiti secretly meets
    Haki-te-kura, and Haki-te-kura dies while trying to join the departing canoe.
    Her father Tu-wiri-roa pursues Taki-auau, discovers his retreat by fire smoke,
    and kills his people. The passage then summarizes Wai-tai''s less decisive southern
    campaigns and describes Te-wera''s settlement at Rakiura, fear during an encounter
    with a morse, and deathbed advice to his family.'
  language: English
  quote_policy: summarized
