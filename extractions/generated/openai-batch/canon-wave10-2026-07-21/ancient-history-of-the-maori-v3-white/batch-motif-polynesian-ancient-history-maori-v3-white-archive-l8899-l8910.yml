canonical_text:
  quote: ''
  summary: A god or sacred war-weapon has been taken to Mua and left there. The god
    and its priest feel sorrow for one another. In a dream the god tells the priest
    Tara-i-tu to rise because the war-weapon has returned to its keeping-place. At
    daylight the priest finds it in its old place, and the people gather while he
    performs ceremonies and chants incantations welcoming the god’s return.
