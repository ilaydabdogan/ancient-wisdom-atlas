canonical_text:
  quote: ''
  summary: Apoka joins a fishing expedition at Wai-papa, catches the only two fish,
    and the poor catch is treated as an ill omen. He refuses hospitality, makes a
    fish offering to his atua, prepares for a journey, and carries a fish on a pole
    to Wai-rau, where his people read it as a sign of distress and support his proposed
    attack on the Nga-ti-mamoe. The war-party ambushes a pa at dawn; Uri-kore kills
    the chief Paua, and the pa is taken. Uri-kore later wears Paua's spoils as a message
    to Tu-te-ure-tira, after which Nga-ti-mamoe abandon a settlement. The passage
    ends with renewed hostilities, a siege, and an unnamed young man's proposed stratagem.
  language: English
  quote_policy: summarized
