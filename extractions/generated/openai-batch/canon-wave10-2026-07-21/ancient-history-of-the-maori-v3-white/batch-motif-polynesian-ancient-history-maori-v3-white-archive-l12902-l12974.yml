- id: obs:1
  text: Apoka went to Wai-papa with a slave carrying fishing-tackle to visit his father-in-law
    while a fishing expedition was preparing to depart.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief first ordered the canoes drawn up out of respect to Apoka, then
    allowed the expedition to proceed when Apoka said he wished to accompany them.
  category: sequence
  evidence_refs:
