canonical_text:
  quote: ''
  summary: The passage opens with a Ngati-kahungunu genealogy ending in Rata. It then
    recounts that Ta-whaki, Rata's grandfather, was killed by Matuku-tangotango and
    Pou-a-hao-kai. Rata resolves to avenge him, fells a tree for a canoe, finds it
    restored upright, fells it again, and watches as a host associated with Haku-turi,
    Roro-tini, and Pona-ua chants over the tree fragments so that the tree stands
    upright again. Rata asks why they restored the tree and says it is his.
  language: English
  quote_policy: summarized
