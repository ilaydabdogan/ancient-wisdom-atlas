canonical_text:
  quote: ''
  summary: Te-hau-taki and his party are protected after being fed as guests. A message
    is sent to Ra-kai-tauwheke, who accepts that the guest has eaten in his father-in-law's
    house. Warriors gather and attack the house with spears but stop when Tiotio remonstrates.
    Friendly speeches follow, and Tiotio's remaining daughters are married to Te-hau-taki.
    Nga-i-tahu chiefs ask about Te-hau-taki's South Island home, and many agree to
    accompany him when he returns, though the final migration happens later.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Food is ordered to be set before Te-hau-taki's party because they could not
    be killed after being entertained as guests by the tribe's chief tohunga.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A poha bowl of preserved koko is placed before the visitors, and they finish
    the meal.
  category: action
  evidence_refs:
