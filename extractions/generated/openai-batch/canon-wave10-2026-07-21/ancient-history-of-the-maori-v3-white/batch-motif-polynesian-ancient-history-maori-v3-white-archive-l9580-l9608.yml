- id: obs:3
  text: A woman carries a message from her husband to Ra-kai-tauwheke, who is married
    to two daughters named Tahupare and Rongo-pare.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ra-kai-tauwheke asks whether Te-hau-taki had been allowed to eat in his father-in-law's
    house; after hearing yes, he says that is enough and says he will visit in the
    morning.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
