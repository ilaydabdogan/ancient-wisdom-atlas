canonical_text:
  quote: ''
  summary: The passage recounts a sequence of intertribal conflicts. Te-rangi-tamau
    kills Te-ue-ka-nuka, later suffers defeat by Nga-ti-wairangi, and a further expedition
    avenges the loss. Tahuru and Te-pare later overcome Nga-ti-wairangi. The sons
    of Tura-kau-tahi, wishing to emulate Ha-taitai warriors, raid south against Nga-ti-mamoe
    under Kawe-riri. After tactical movement by inland and coastal routes, Kawe-riri
    is mortally wounded by Tu-te-makohu. Tu-te-makohu is pursued, warns a young relative,
    and then invokes his atua, which sends mist to hide him. Nga-ti-mamoe withdraw
    to a fortified river position but are defeated with great slaughter; survivors
    flee westward through forest and across Lake Te-anau.
  language: English
  quote_policy: summarized
