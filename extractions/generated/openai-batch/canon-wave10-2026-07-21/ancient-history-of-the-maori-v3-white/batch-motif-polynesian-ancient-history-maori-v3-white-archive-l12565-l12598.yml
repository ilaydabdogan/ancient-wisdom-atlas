  summary: The passage opens with a lament fragment naming a cooking-pit of Te-ao-kai
    and urging a son to go boldly into the house Tatau, identified as the house of
    Miru where old Kewa was ensnared. The prose then comments on the difficulty of
    acquiring Māori history and genealogy, the social dangers of false pedigrees,
    the connection between family history and land titles, and the way a chief's son
