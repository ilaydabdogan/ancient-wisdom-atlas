canonical_text:
  quote: ''
  summary: A war stratagem is attempted when Rakai-tau-wheke disguises himself in
    the surf as a sea creature to draw people out of a pa; he kills the first man
    who approaches, but the scheme fails. After a period of peace, Manawa raids O-mihi
    and unknowingly kills the elder Rakai-momona with a spear. The people evacuate
    the pa at night while leaving fires burning to mask their departure. Maru later
    persuades Taki-auau to stop and build at Pakihi while Taki-auau preserves his
    father’s head according to custom. A later dispute over Ra-kai-te-kura’s marriage
    against an infant betrothal leads Te-rangi-whakaputa to kill Maru’s servant, after
    which Maru seeks protection from Taki-auau.
  language: English
  quote_policy: summarized
