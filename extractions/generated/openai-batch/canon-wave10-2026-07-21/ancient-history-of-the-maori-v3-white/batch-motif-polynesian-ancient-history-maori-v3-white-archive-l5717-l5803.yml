canonical_text:
  quote: ''
  summary: A pair of twins are killed after being sent into an old kumara pit. Their
    parents use hawk-shaped kites to identify the killer, leading to an attack and
    subsequent cycles of flight, desecration of bones, revenge, and a tactical deception
    involving tattooed women, marked calabashes, and a haka.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The twins regularly went from their home to play whipping-top with children
    at Ra-kai-te-hiku-roa's pa, Maunga-puremu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ra-kai-te-hiku-roa knocked children's tops into an old kumara pit and told
    the twins to fetch them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the twins were in the pit, Ra-kai-te-hiku-roa covered them with rubbish,
    filled the pit, and smothered them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The parents searched for the missing children and made raupo-leaf kites in
    the form of hawks, covered with aute.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The kites hovered over Ra-kai-te-hiku-roa's house and nodded their heads,
    indicating who had killed the children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Kahu-tapere gathered his tribe, attacked Ra-kai-te-hiku-roa, took his pa,
    and killed Tu-purupuru and many others.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tu-purupuru's body was cooked in an umu called Whakatau-ai, using named stones
    and a mere-pounamu.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Kahu-paroro collected Tu-purupuru's bones, left the skull at Te-mahanga, and
    made fish-hooks from shoulder-blade bones at Nuku-tau-roa.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Kahu-paroro chanted a short incantation when casting a bone fish-hook into
    the sea, then caught a hapuku.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Tama-i-wiriwiri heard the chant and thought Tu-purupuru was fishing.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: After learning that Tu-purupuru's bones had been used by Hauhau to dig fern-root,
    war was declared to avenge the insult.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Ra-kai-te-hiku-roa ordered women's faces to be marked like men's tattooing
    and calabashes to be marked with moko to resemble men.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: During a haka led by Hine-kura, Wai-roa people gathered unarmed; Ra-kai-te-hiku-roa's
    party rushed on them and killed many.
  category: sequence
  evidence_refs:
  - ev:13
