canonical_text:
  quote: ''
  summary: An unnamed attacker tries to lure defenders from a beach-side pā by appearing
    like a stranded sea creature in the surf, but the scheme fails after he kills
    one man. After a short peace, Manawa of Nga-i-tahu seeks Ahua-rangi, daughter
    of Tuki-au of Nga-ti-mamoe, as wife for his son; the proposal is refused. Manawa
    later visits Kai-koura with followers, is ambushed by Tuki-au, and his party is
    trapped. Messengers smeared with Manawa's blood try to escape; the first is killed,
    but a young relative leaps from a cliff, survives, and carries news. The Nga-ti-mamoe
    kill and eat the trapped victims, while the Nga-i-tahu delay revenge because of
    fear connected with recent sacred bloodshed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed man, covered with mats and armed with a club, entered the surf
    before dawn and raised his arm so that it looked like a fish fin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sentinels saw the dark object in the water and concluded it was a seal or
    young whale; the cry of a stranded fish drew the people of the pā to the beach.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Because the stockade was close to the beach, the people opened the gate; the
    supposed fish rose and killed the first man who entered the surf, and the larger
    scheme failed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After ongoing strife, the two tribes made peace, but the peace did not last
    long.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Manawa, a chief of the Nga-i-tahu, demanded Ahua-rangi, daughter of Tuki-au
    of the Nga-ti-mamoe, as a wife for his son; the manner of the demand offended
    the tribe and they refused.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The next year Manawa renewed the proposal and came with one hundred followers
    to the Nga-ti-mamoe pā at Kai-koura, where his party was greeted and shown into
    a large house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: As Manawa entered, Tuki-au struck him at the gate with a stone axe and Manawa
    received another blow before reaching his companions; the house door was then
    closed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Manawa told his men that they were trapped and surrounded, and asked that
    someone try to carry news of their fate to the Nga-i-tahu.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: A chosen messenger had his forehead smeared with Manawa's blood and was committed
    to the care of the atua, but he was killed by spears before advancing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Repeated attempts to escape failed, and the imprisoned band became dispirited.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: A young relative of Manawa, smeared with the dying chief's blood and charged
    with his last message, escaped through the pā while warding off spears and evading
    pursuers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: When the path was blocked by spears, the youth leaped from the cliff to the
    beach, appeared to fall, then rose and defied his pursuers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Nga-ti-mamoe killed and ate the trapped victims.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The sole survivor reached Wai-papa with news; the Nga-i-tahu resolved to wait
    a year before revenge because they feared panic if they attacked where sacred
    blood had recently been shed.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
