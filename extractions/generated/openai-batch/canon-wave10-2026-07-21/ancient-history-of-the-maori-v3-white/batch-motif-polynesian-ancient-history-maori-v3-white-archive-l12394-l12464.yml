canonical_text:
  quote: ''
  summary: The passage recounts Te-whare-rakau’s anger after Kahu-roa leaves his camp
    secretly, his later killing of Kahu-roa despite Momo’s objection that Kahu-roa
    is kin, and the subsequent account of Rau-paraha’s capture of Tama-i-hara-nui
    as compensation for Te-pehi’s death, with background on Rau-paraha’s earlier armed
    expedition, retaliation for a threat, and stated pretext of friendly trade for
    greenstone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Te-whare-rakau, eldest son of Tau-pori, went with his eldest boy to Pigeon
    Bay to fell totara trees for canoes and was working on two named canoes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kahu-roa arrived with his wife and children, accepted Te-whare-rakau’s invitation
    to help, and then left quietly during the night without waking him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Te-whare-rakau became angry because he believed he had endangered himself
    and his son by hosting someone unfriendly who might have killed them or later
    claimed to have spared them.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: When Te-whare-rakau later saw Kahu-roa from a canoe, Momo questioned whether
    he would kill his own kinsman, but Te-whare-rakau pursued Kahu-roa and killed
    him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: About a year after the raid on Panau, Tama-i-hara-nui was captured in Aka-roa
    Harbour by Te-rau-paraha, who came with one hundred and seventy men in an English
    trading vessel to secure him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Rau-paraha sought to obtain a distinguished member of the Nga-i-tahu Tribe
    as payment for the death of his near relative Te-pehi.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The passage gives two views of Te-pehi’s death: Rau-paraha considered it
    treacherous killing, while those who killed Te-pehi regarded it as lawful execution
    for treacherous designs while being entertained as guests.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Rau-paraha had previously arrived before Kai-a-poi with a large armed force
    after slaughter at O-mihi, which followed a threat that his body would be ripped
    open with a barracouta-tooth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After accepting the challenge, Rau-paraha fitted out war-canoes, attacked
    and killed the threatening chief, destroyed nearby pa, sent many captives to Kapiti,
    and later claimed at Kai-a-poi that he came only to purchase greenstone.
  category: sequence
  evidence_refs:
  - ev:7
