canonical_text:
  quote: ''
  summary: Tu-a-kaka-riki finds a large totara tree cast up by the sea, but Rongo-i-tua
    claims it by pointing to his excrement mark on the butt and saying it followed
    him from Hawa-iki. The tree is split into two canoes, Manuka and Arai-te-uru.
    A Kahui-tipua crew first sails to Hawa-iki for kumara and returns with cargo,
    but the planted crop fails. Rongo-i-tua then sails in Arai-te-uru to Whanga-ra
    in Hawa-iki, where he has his crew listen to and learn kumara planting incantations.
    The passage describes three kumara plantation gods represented by posts, offerings
    made before them, and the fatal consequences of ritual error. Rongo-i-tua later
    sends the canoe back under Pakihiwi-tahi and Hape-ki-tu-a-raki while he remains
    in Hawa-iki.
  language: English
  quote_policy: summarized
