canonical_text:
  quote: ''
  summary: 'The excerpt first narrates a conflict over a pet bird: Tama-te-ra steals
    the bird, Iwi-ka-tere retaliates with allies, and many are killed, leading to
    migration, expulsion of earlier owners, and an aetiological place-name connected
    with an oven for cooking the slain. It then gives a genealogy in which Tane-nui-a-rangi’s
    wife Hine-ahu-one is linked to Te-rapu-wai, said by old priests to be ancestors
    of Europeans. A further account says the Kahui-tipua were giant shapeshifters
    in the South Island; Te-rapu-wai hunting parties vanished until Kai-a-moe, sole
    survivor, reported a tipua with ten two-headed dogs who killed the men, took her
    to a cave, fastened her with a cord, and kept her captive. She escaped by making
    a raupo raft, tying the cord to rushes as a decoy, floating down the river, after
    which the tipua detected the escape and swallowed the river in rage.'
  language: English
  quote_policy: summarized
