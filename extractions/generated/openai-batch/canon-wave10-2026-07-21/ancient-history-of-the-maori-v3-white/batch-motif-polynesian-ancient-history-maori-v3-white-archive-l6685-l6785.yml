canonical_text:
  quote: ''
  summary: Pukoro-au-ahi catches many pigeons at the stream Pou-turu by setting flax
    snares over water after pigeons mistake red pebbles for miro berries and become
    thirsty. His female cousin Puha-urc-roa helps gather the birds, dances and sings,
    and later prepares birds for her husband. The husband suspects the birds were
    stolen, but after seeing the snaring place he is ashamed. Pukoro-au-ahi instructs
    Puha-urc-roa to kindle a separate sacred fire for her husband and a common fire
    for herself, and to observe a preparatory ceremony before eating. When she tries
    again to rouse her husband, she sees blood on his mat and discovers that he is
    dead.
  language: English
  quote_policy: summarized
