canonical_text:
  quote: ''
  summary: 'The passage narrates episodes involving Kahu-ngunu: a quarrel between
    a host and wife that ends with the wife leaving and taking Kahu-ngunu as husband;
    a genealogy from their child to ancestors of Nga-ti-rau-kawa; a conflict with
    Kahu-ngunu''s sister Whaene over fish from her net, after which he leaves in shame
    and travels, naming places; an encounter in a cave with Pa-roa, whose daughter
    Hine-puariari takes him as husband; a proverb explaining the flax that bound Kahu-ngunu''s
    top-knot; and the beginning of another episode in which Kahu-ngunu goes toward
    Rongo-mai-wahine and her husband and tries to cause a quarrel.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Kahu-ngunu's meal, the host accused his wife of idleness over aromatic
    grasses and herbs, and the husband and wife quarreled, cursed, and struck at each
    other while Kahu-ngunu laughed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife left the house for her parents, who urged her to avenge herself by
    leaving her husband and taking Kahu-ngunu, praising Kahu-ngunu as brave and able
    to obtain food.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wife's mother combed and adorned her with feathers and a kaitaka mat,
    and the woman took Kahu-ngunu as husband; the narrative says the former husband
    lost his wife through Kahu-ngunu's deceit.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kahu-ngunu begat Kahu-kura-nui, and the passage lists descendants down to
    Rau-kawa, ancestors of the Nga-ti-rau-kawa tribe.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kahu-ngunu, his sister Whaene, and their people drew a net belonging to Whaene;
    Kahu-ngunu seized fish from it, and Whaene struck him with her hand.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ashamed after being struck, Kahu-ngunu left the people, went through a forest,
    ate or killed foods, named places, and entered a cave.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Pa-roa saw Kahu-ngunu in the cave, invited him to his settlement, later recognized
    him, and told his daughter Hine-puariari that Kahu-ngunu was a husband for her;
    she took him as husband.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hine-puariari praised Kahu-ngunu as more than she could wish, and Rongo-mai-wahine
    heard this and made a remark about the great river at Tata-pouri being ready to
    welcome him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Hine-puariari combed Kahu-ngunu's hair over two days, used oil from ten Haliotis
    shells, and finally used his Tauranga flax girdle to bind the top-knot.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A proverb is derived from the flax that bound Kahu-ngunu's top-knot and was
    left at Tauranga.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Kahu-ngunu left his wife and went to Nuku-tau-rua and Tawa-pata, where Rongo-mai-wahine
    and her husband Tama-taku-tai lived; Tama-taku-tai carved house ornaments but
    did not cultivate food, and Kahu-ngunu tried to cause a quarrel between them.
  category: sequence
  evidence_refs:
  - ev:11
