canonical_text:
  quote: ''
  summary: Ue-nuku makes a fishing-net while Rua-wharo and Tu-pai do not help. When
    fish are caught, Rua-wharo repeatedly takes the best fish. Ue-nuku warns him,
    then has Pou-tama close the net around him, leaving him covered in fish slime
    and ashamed. Rua-wharo's mother advises him to seek ritual chants from the elder
    brother Timu-whakairihia, so that he can call whales to the shore and overcome
    Ue-nuku. Rua-wharo and Tu-pai travel to Timu-whakairihia's settlement, where Timu-whakairihia
    begins speaking to his wife about coverings.
  language: English
  quote_policy: summarized
