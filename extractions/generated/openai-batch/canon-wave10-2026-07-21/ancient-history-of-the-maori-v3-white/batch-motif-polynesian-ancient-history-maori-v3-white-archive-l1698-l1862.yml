canonical_text:
  quote: '"I am a son of the sea"'
  summary: Rua-tapu pursues and drowns some of his brothers at sea, but Paikea evades
    him. Rua-tapu and Paikea speak about who will carry news of the disaster to land.
    Paikea claims capacity to do so through sea descent. Rua-tapu gives warnings,
    predicts later battle deaths, requests remembered songs, and sends Paikea onward.
    Paikea swims toward land while chanting a powerful spell that describes sea creatures,
    winds, cold, Tane, a great wave, an ancient axe, and Rongo-ma-rua-whatu beating
    back the wave.
  language: English
  quote_policy: quoted
