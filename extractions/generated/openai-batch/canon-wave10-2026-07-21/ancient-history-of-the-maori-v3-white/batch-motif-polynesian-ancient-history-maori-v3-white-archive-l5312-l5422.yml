canonical_text:
  quote: ''
  summary: Rongo-i-tua is associated with voyages to obtain kumara from Hawa-iki.
    One canoe returns with old kumara; Rongo-i-tua leads or directs further action
    toward the house of Kahui-rango, where people are killed and others escape. Shore
    shouts are interpreted as ceremonies over blood and stages of kumara planting.
    The gods hold the canoe in place because the crew ate some kumara, and Rongo-i-tua
    is struck and ritually treated before clinging to the clouds and returning to
    Hawa-iki under the name Rongo-tiki. A following account says Rongo-i-tua first
    arrived from Hawa-iki among the Kahui-tipua, declined their foods, secretly prepared
    dried kumara from his waist-belt with water and an incantation, and told his hosts
    that it came from across the sea.
  language: English with Maori names and terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An instruction is given not to take old kumara growing on coastal cliffs,
    but to go to the storehouse and take the Kahui-rango.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A canoe voyage obtains various kinds of kumara, but Rongo-i-tua later inspects
    Arai-te-uru and says its cargo is old kumara and old bulbs rather than all that
    was in the house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Rongo-i-tua goes to Hawa-iki and directs his crew to the house of Kahui-rango
    to take Te Roro and Te Matao.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The crew attacks the house and kills several named persons, while Kahu-kura,
    the Kahui-rango, and other inhabitants escape and come to attack Rongo-i-tua.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After slain persons are loaded into the canoe and it moves out to sea, shouts
    from shore are heard repeatedly.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Rongo-i-tua interprets the shore shouts as ceremonies over the blood of the
    slain and as successive acts in preparing, digging, setting, and ritually ensuring
    a kumara crop.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Rongo-i-tua and the canoe remain repeatedly in the same place because the
    gods hold them there to punish the crew for eating some of the kumara from Hawa-iki.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Rongo-i-tua asks some of the crew to strike him so that the evil will not
    continue; they strike him and perform sacred ceremonies over him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Rongo-i-tua clings to the clouds and swings himself back to Hawa-iki; when
    he reaches the clouds his name changes to Rongo-tiki.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The canoe proceeds, and the crew lands at their house at Ao-tea-rawa.
  category: sequence
  evidence_refs:
  - ev:8
