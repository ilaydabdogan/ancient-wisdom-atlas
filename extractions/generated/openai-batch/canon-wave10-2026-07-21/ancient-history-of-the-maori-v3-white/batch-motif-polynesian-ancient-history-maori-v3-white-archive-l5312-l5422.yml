  text: A following account says Rongo-i-tua was the first to arrive in these islands
    from Hawa-iki and found the country inhabited by the Kahui-tipua.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Kahui-tipua chiefs have foods set before the strangers, including mamaku,
