    the spirit of Te-mata-uira had entered it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the wind changed, Rahui and Tauira-ki-waho selected ten men to challenge
    the enemy with spears; the fighting initially wounded no one.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The ten men returned into the pa, were pursued to the gate, and a body of
    men from within met the pursuers; Rahui and Tauira-ki-waho gained victory, and
    Te-mata-uira was killed while leading the attacking party.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The enemy fled; the people of the pa pursued them, many were killed, and two
    hundred escaped.
  category: sequence
  evidence_refs:
