canonical_text:
  quote: ''
  summary: Korako is ordered to kill a prisoner, but the struck victim escapes through
    a stream, sprinkles his head, and flees by a long route to Kai-a-poi. A revenge
    expedition follows. At Moe-raki Pa, priests perform incantations over a sacred
    calabash and declare that the souls of the enemy and of the chief Te-mata-uira
    are inside it. A challenge and battle follow; Te-mata-uira is killed, many attackers
    die, fugitives escape, and Tu-ahu-riri is summoned after hearing of his father's
    death.
  language: English
  quote_policy: summarized
