canonical_text:
  quote: ''
  summary: The passage recounts Moko, a robber-chieftain whose cave stronghold near
    a trade route enables raids on carriers, and his killing of Tu-te-wai-mate after
    Tu honorably challenges rather than strikes him asleep. It then gives a Wai-taha
    account of Poua-kai, a gigantic bird of prey nesting on Tawera Mountain, which
    carries off people until Te-hau-o-tawera organizes a concealed manuka-sapling
    trap over a pool and fifty armed men kill it. The passage closes with notes on
    Wai-taha, Nga-ti-mamoe, and Nga-i-tahu succession and destruction.
  language: English
  quote_policy: summarized
