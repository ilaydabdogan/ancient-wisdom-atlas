canonical_text:
  quote: ''
  summary: The passage recounts an attack on Ri-papa, including a warning by Tai-a-roa,
    attempted escapes by canoe, and flight to hills where stones are rolled against
    pursuers. After Ri-papa is destroyed, O-takou and Muri-hiku warriors take the
    Tau-mutu population home with them. Tama-i-hara-nui then persuades most Tau-mutu
    people to return by assurances of peace, while some remain distrustful. He receives
    hospitality and potted birds at Te-wai-te-rua-ti, asks for porters to carry the
    gifts, then kills the carriers, cuts up their bodies, and sends portions to pa
    and hamlets. He also summons warriors from Kai-a-poi while Tawha and his people
    are returning home.
  language: English
  quote_policy: summarized
