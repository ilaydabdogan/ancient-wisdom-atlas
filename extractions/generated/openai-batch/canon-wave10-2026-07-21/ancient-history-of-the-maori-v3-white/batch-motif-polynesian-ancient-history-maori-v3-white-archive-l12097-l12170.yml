candidate_motifs:
- id: motif:1
  label: warning before an attack enables escape
  taxonomy_refs: []
  basis: Tai-a-roa, though connected to the attacking force, hurries ahead to warn
    the pa and give Tau-nunu a chance to escape; some inhabitants later escape with
    his connivance.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage presents this as a historical action rather than a mythic
    type; the warning only partially succeeds.
- id: motif:2
  label: two-pronged assault by water and land
  taxonomy_refs: []
  basis: The attacking force divides between canoe-borne musketeers and a land-side
    group crossing the hills to assault Ri-papa.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: This is a tactical pattern, not necessarily a mythological motif.
- id: motif:3
  label: refuge on heights defended by rolling stones
  taxonomy_refs: []
  basis: Escaping inhabitants reach the hills behind the pa and stop pursuit by rolling
    great stones down on those following them.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No wider symbolic interpretation is asserted.
- id: motif:4
  label: false assurances of peace before treachery
  taxonomy_refs: []
  basis: Tama-i-hara-nui is explicitly said to act with treacherous intent while assuring
    the Tau-mutu people that anger has subsided and urging them to return.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage does not itself compare this to other traditions.
- id: motif:5
  label: hospitality gift followed by betrayal of carriers
  taxonomy_refs:
  - sacred_exchange
  basis: Tama-i-hara-nui receives hospitality and potted birds, obtains porters to
    carry the pohas, and then kills the porters.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The available taxonomy ref is only approximate; the passage describes
