  cautions: The passage excerpt does not state the full prior relationship between
    Kai-a-moc and the tipua.
- id: motif:2
  label: supernatural being trapped and killed with fire at a cave
  taxonomy_refs: []
  basis: The people pile fern at the cave entrance, set it on fire, and kill the tipua
    as he tries to escape through the cave roof.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No named wider motif family is asserted in the passage.
- id: motif:3
  label: capsized canoe with scattered provisions
  taxonomy_refs: []
  basis: Arai-te-uru is upset off Moe-raki and its cargo is strewn over the beach.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: This excerpt does not state that the cargo becomes landmarks or has a
    transformation function.
- id: motif:4
  label: landscape catastrophe remembered in ancestral time
  taxonomy_refs: []
  basis: Old priests connect the time of Te-rapu-wai with land submergence and forest
    destruction by fire that nearly extinguishes moa locally.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The effects described are regional, not cosmic or universal.
- id: motif:5
  label: ancestral migration from Hawaiki and founding of a named tribe
  taxonomy_refs:
  - departure
  basis: Wai-taha is said to come from Hawaiki in Te-Arawa, migrate to the South Island,
    and found the tribe bearing his name.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The taxonomy reference is broad; the passage presents genealogy and migration
    more than a developed quest narrative.
- id: motif:6
  label: specialist knowledge for ruling winds and seasons
  taxonomy_refs:
  - wisdom
  basis: Whare-patari, an enchanter of winds, visits Nga-ti-rua-roa because they are
    reputed adepts at ruling the elements, winds, and seasons.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: Only the opening of the Whare-patari episode is present in the supplied
