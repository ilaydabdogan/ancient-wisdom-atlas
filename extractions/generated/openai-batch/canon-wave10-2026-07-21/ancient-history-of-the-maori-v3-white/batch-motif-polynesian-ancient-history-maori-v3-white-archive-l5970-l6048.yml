- id: motif:1
  label: vulnerability of a dangerous being revealed by an escaped captive or victim
  taxonomy_refs: []
  basis: Kai-a-moc escapes, reports what she knows, and reveals the condition under
    which the tipua sleeps long and soundly.
  evidence_refs:
  - ev:1
  - ev:2
