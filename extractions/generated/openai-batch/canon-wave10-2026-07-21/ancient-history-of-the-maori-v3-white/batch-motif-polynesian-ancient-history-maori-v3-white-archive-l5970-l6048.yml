canonical_text:
  quote: ''
  summary: Kai-a-moc escapes to a village, reveals when a tipua sleeps, and the people
    burn fern at the cave entrance and kill him as he tries to escape. The passage
    then recounts the upsetting of the canoe Arai-te-uru, succession and occupation
    traditions concerning Te-rapu-wai, Kahui-tipua, Wai-taha, Nga-ti-mamoe, and Nga-i-tahu,
    remembered landscape destruction by submergence and fire, remains of fortified
    places, and the beginning of a story about Whare-patari visiting Nga-ti-rua-roa
    to test knowledge of ruling winds and seasons.
  language: English
  quote_policy: summarized
