canonical_text:
  quote: ''
  summary: The passage describes the aftermath of a defeat, settlement at Wai-rau,
    and rising trouble for Nga-ti-mamoe. Two Nga-i-tahu cousin chiefs live among Nga-ti-mamoe
    through marriage. Apoka, poor and suspicious that his wives secretly eat better
    food, visits his cousin Tu-te-ure-tira. Tu is found supervising kumara planting,
    undergoes rites at a tuahu to remove tapu, blesses food, and offers hospitality.
    Apoka refuses to eat, astonished by the abundance, explains his suspicions, and
    receives advice to take the grievance to elders at Wai-rau, who may use it to
    dispossess Nga-ti-mamoe of Wai-papa.
  language: English
  quote_policy: summarized
