  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: After one summer, Ue-nuku sent his children and people to obtain fruit and
    products from preserves in the districts of Matiko-tai and Po-ranga-hau.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The visiting party arrived unarmed and unsuspecting at Ta-wheta's pa, where
    Ta-wheta killed all but one.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that this killing began the deadly feud between Ue-nuku
    and Ta-wheta.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Four named sons of Ue-nuku were slain, while the fifth, Rongo-ua-roa, survived
    after severe wounds and being left for dead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Rongo-ua-roa regained consciousness, saw his dead brothers and companions,
    crawled away, and hid among nearby bushes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: While hidden, Rongo-ua-roa heard Ta-wheta and his people boast and plan to
    deceive and kill Ue-nuku the next day.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ta-wheta's people dragged the slain bodies into the pa to cut them up for
