- id: obs:4
  text: Ta-wheta asked why Ue-nuku killed Taka-rita, and the news-bearer answered
    that she had committed adultery with two men.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ta-wheta said the act would be repaid and referred to food-preserves that
    would draw Ue-nuku's children and people when fruit came into season.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says Ta-wheta dwelt quietly for a long time while brooding over
