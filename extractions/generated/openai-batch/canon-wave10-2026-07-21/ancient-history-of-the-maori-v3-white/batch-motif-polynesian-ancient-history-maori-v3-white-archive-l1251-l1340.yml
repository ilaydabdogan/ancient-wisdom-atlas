canonical_text:
  quote: ''
  summary: After the death of Taka-rita, her brother Ta-wheta mourns and vows that
    Ue-nuku's act will be repaid. Ta-wheta anticipates that Ue-nuku's children and
    people will come for seasonal produce at nearby preserves. Later Ue-nuku sends
    them there unarmed; Ta-wheta kills all but one, including four named sons of Ue-nuku.
    The wounded survivor Rongo-ua-roa hides, overhears a plan to deceive and kill
    Ue-nuku, then conceals himself in a canoe with an incantation. Ta-wheta's party
    travels to Ue-nuku's pa and is welcomed.
  language: English
  quote_policy: summarized
