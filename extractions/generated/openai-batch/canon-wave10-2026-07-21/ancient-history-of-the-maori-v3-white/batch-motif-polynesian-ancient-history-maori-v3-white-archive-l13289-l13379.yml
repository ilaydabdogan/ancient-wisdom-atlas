canonical_text:
  quote: ''
  summary: Historical account of the defeat and hiding of Nga-ti-mamoe remnants, later
    conflicts among Nga-i-tahu, Nga-ti-tu-mata-kokiri, and Nga-ti-apa, two separate
    Ngai-tahu revenge parties that nearly fight each other through mistaken identity,
    their recognition and alliance, and subsequent attacks that leave Nga-ti-apa in
    possession of former Nga-ti-tu-mata-kokiri territory.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After repeated defeats by Nga-i-tahu, Nga-ti-mamoe ceased building pas, hid
    in caverns, and fled when strangers approached.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cave in Lyttelton Harbour and several caves near Ti-maru are described as
    former shelters; the Ti-maru caves have sides covered with rude images of men,
    fishes, and other forms.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Peace was later renewed between the Nga-ti-mamoe remnant and their conquerors,
    and the passage infers partial incorporation from a hapu name among present Nga-i-tahu.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bird-hunting and eel-fishing at the sources of several rivers led to frequent
    skirmishes between east and west coast Nga-i-tahu and Nga-ti-tu-mata-kokiri.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nga-ti-tu-mata-kokiri planned to avenge themselves on Nga-ti-apa at Kapiti,
    but many drowned while crossing the Strait and the smaller group that landed was
    killed by enemies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Nga-ti-apa later crossed to Massacre Bay during a war between Nga-i-tahu and
    Nga-ti-tu-mata-kokiri and again attacked Nga-ti-tu-mata-kokiri.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After Nga-ti-tu-mata-kokiri killed the Nga-i-tahu chief Pakeke at Ma-ruia,
    both Nga-ti-tu-ahuriri and Pou-tini Nga-i-tahu determined to take revenge.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Two fighting parties started almost simultaneously without knowing of each
    other, one from Kai-a-poi under Te-ware-kino and one from Ara-hura under Tuhuru.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Te-ware-kino’s party travelled inland to Karamea and remained there for several
    days eel-fishing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tuhuru’s coastal party saw tracks in the sand at Karamea and supposed they
    were footprints of Nga-ti-tu-mata-kokiri.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Tuhuru’s companion suddenly encountered Te-ware-kino baiting an eel-basket;
    each took the other for an enemy and a scuffle began.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Tuhuru wounded Te-ware-kino with a spear, pushed him down, seized his hair
    to strike him with a club, then recognized him as Te-ware-kino and as his own
    cousin.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the mistake was explained, the two groups joined forces under Tuhuru,
    attacked Nga-ti-tu-mata-kokiri at West Whanganui, killed many, and later retired.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Te-pau and Te-kokihi, named as two principal chiefs and among the last Nga-ti-tu-mata-kokiri
    with a few followers, were killed by Tuhuru and his people on the Papa-roha Range.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: After these events, Nga-ti-apa had entire possession of the country formerly
    occupied by Nga-ti-tu-mata-kokiri, though the passage says later North Island
    events would lead to their dispossession.
  category: sequence
  evidence_refs:
  - ev:11
