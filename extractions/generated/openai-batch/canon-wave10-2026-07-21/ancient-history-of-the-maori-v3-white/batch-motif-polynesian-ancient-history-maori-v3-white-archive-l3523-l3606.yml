canonical_text:
  quote: ''
  summary: A voyaging party ships food remains and young plants, sails with Pou-heni
    to O-hiwa, and grounds on the bar. Hine-kau-i-rangi, a female companion of supreme
    rank, goes inland with attendants; the people follow her track and name places
    after her actions and marks. The party later cooks food for absent coast travelers,
    encounters bird-catchers who die and are said to be visible as stone with their
    preserved birds, and proceeds to mountains where Pawa urinates and chants a song.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party shipped remains of food and young plants, sailed over the sea with
    Pou-heni, arrived at O-hiwa, and grounded on the bar at the mouth of the O-hiwa
    River.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: While the people were freeing the canoe, Hine-kau-i-rangi went inland with
    a few personal attendants; the others later left the canoe and followed her as
    their female companion of supreme rank.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The followers found Hine-kau-i-rangi’s track by marks left by her attendants
    and gave names to each marked place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Places were named for Hine-kau-i-rangi’s actions, including drying her maro,
    rubbing her hei, chanting an incantation for a strange locality, building a temporary
    hut or screen, leaving a foot impression, breaking trees in anger, sitting to
    view the country, and weeping.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Tupa-roa or Tipa-roa the party cooked food for themselves and for people
    traveling by the sea-coast; because the coast party did not arrive, the food was
    left in the oven and the place was called Umu-tao-roa.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Tai-harakeke, the people assigned to catch birds and preserve them in calabashes
    became exhausted, lay down, and died.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Wai-paka and his men, together with their calabashes of preserved birds, are
    described as still visible where they lay, all turned into stone.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The remaining party went on through the forest to Maunga-tapere and Maunga-haumi;
    on the mountain Pawa passed water and chanted a song.
  category: sequence
  evidence_refs:
  - ev:7
