candidate_motifs:
- id: motif:1
  label: House-based preservation of ancestral history
  taxonomy_refs:
  - wisdom
  basis: The passage presents a priestly house where history is kept, rehearsed, guarded,
    learned, and handed down.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage describes institutional transmission of history; it does not
    explicitly frame this as esoteric or divine wisdom beyond the presence of gods
    and priests.
- id: motif:2
  label: Homeland conflict causes ancestral departure
  taxonomy_refs:
  - departure
  basis: Wars in Hawa-iki are explicitly stated to be the reason the ancestors left
    and migrated to islands where they could live in peace.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives a migration cause but does not narrate a single hero's
    departure trial.
- id: motif:3
  label: Ancestral ocean migration by named canoe
  taxonomy_refs:
  - ark_vessel
  - departure
  basis: Taki-tumu/Horo-uta carries a commanded group over the ocean to Aotearoa and
    Te Ika-a-Maui, preserving the voyagers through famine until landfall.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:9
  confidence: medium
  cautions: The vessel is a migration canoe, not a flood ark; the ark_vessel reference
    is limited to the function of carrying a founding group to land.
- id: motif:4
  label: Substitutionary child sacrifice for survival at sea
  taxonomy_refs:
  - sacrifice
  basis: Adults selected for death give children in their stead; the children are
    killed and eaten, saving the adults and sustaining the crew.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage frames the acts as famine survival and substitution, not explicitly
    as ritual sacrifice to a deity.
- id: motif:5
  label: Settlement by leaving daughters and provisions at named places
  taxonomy_refs: []
  basis: Rua-wharo's daughters remain at named coastal locations as the canoe moves
    on, with food portions left for them.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: No available taxonomy reference exactly matches this place-settlement
    pattern.
- id: motif:6
  label: Voyager marks land with a named token
  taxonomy_refs: []
  basis: Kupe places a named token on the land at Rangi-whaka-oma during the canoe's
    coastal journey.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage gives the act and names but does not explicitly explain its
    legal, ritual, or territorial meaning.
- id: motif:7
  label: Human becomes stone while carrying water
  taxonomy_refs:
  - shapeshifter
  basis: Ma-iri-rangi is described as a man who stands on the seashore holding a calabash
    of water and becomes a stone still visible there.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The transformation is explicit, but the passage does not depict repeated
    shapeshifting or voluntary shape-changing.
