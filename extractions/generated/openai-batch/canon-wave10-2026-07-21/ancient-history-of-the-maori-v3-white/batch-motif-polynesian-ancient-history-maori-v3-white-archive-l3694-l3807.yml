canonical_text:
  quote: ''
  summary: The passage describes a house at U-awa where history and gods were guarded
    and recited; recounts ancestors from Hawa-iki whose wars led to migration; narrates
    the voyage of the Taki-tumu/Horo-uta canoe to Aotearoa and Te Ika-a-Maui, including
    starvation at sea and children killed and eaten as substitutes for adults; describes
    landings, settlement by Tama-tea and daughters of Rua-wharo, food portions left
    at coastal places, Kupe's land token, and Ma-iri-rangi becoming a stone while
    holding a calabash of water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At U-awa, history was rehearsed, a kit containing history was opened, priests
    occupied a house, and Ira appointed Whare-patari as high priest, guardian of gods
    in the house, and leader of those who rehearsed the history.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The named ancestors are said first to have lived in Hawa-iki: Rongo-kako,
    Tama-tea, Rua-wharo, Kupe, and Ngake.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Quarrels over lands and cultivations led to battle, deaths, mediated peace,
    and a later renewed war occasioned by a woman called Are.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The wars are given as the reason the ancestors left Hawa-iki and migrated
    to the islands in search of a peaceful place to live.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The canoe Taki-tumu carried seventy people of a sub-tribe commanded by Tata
    across the ocean to Ao-tea-roa and the Fish of Maui, and was also called Horo-uta
    because of its swift coastal sailing.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: During the sea voyage, the crew lacked food and agreed that some crew members
    should be killed so others could eat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Motoro, Te Angi, and Te-ao-maro each avoided death by giving children in their
    stead; the children were killed and eaten, keeping the crew alive until land was
    reached.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the killed children had not supplied enough food, Toi would have been required
    to give up his two children, Ti and Mamaku.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Taki-tumu landed at Tauranga, where Tama-tea stayed with Iwi-pupu and begat
    Kahu-ngunu; Kupe, Ngake, and Rua-wharo continued on to other places.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Several daughters of Rua-wharo stayed at named coastal locations, and portions
    of voyage food were left with them.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: At Rangi-whaka-oma, Kupe placed a token on the land, and Ma-iri-rangi, described
    as a man and associate chief of Kupe, became a stone while standing on the seashore
    holding a calabash of water.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Kupe continued in the canoe to the South Island, and the passage names other
    canoes that came to New Zealand.
  category: sequence
  evidence_refs:
  - ev:9
