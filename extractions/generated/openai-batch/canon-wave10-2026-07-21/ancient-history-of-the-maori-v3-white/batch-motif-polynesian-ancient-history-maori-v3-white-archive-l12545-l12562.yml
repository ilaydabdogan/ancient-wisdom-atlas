canonical_text:
  quote: ''
  summary: The passage describes the death of Tama-i-hara-nui after capture. His captors
    restrain him to prevent suicide, fasten him painfully by a hook under the chin
    to the cross-beams of the hold, and watch his suffering. At Kapiti he is handed
    to widows of chiefs killed at Kai-a-poi, who put him to death by slow torture.
    The narrator comments that, although the capture was base and the fate cruel,
    the punishment repeated cruelties Tama-i-hara-nui had committed against members
    of his own tribe.
  language: English
  quote_policy: summarized
