canonical_text:
  quote: ''
  summary: A Nga-ti-mamoe chief, Rangi-ihia, seeks lasting peace with Nga-i-tahu.
    Cross-group marriages are arranged to cement the treaty, and his son is intended
    to become chief of both groups. After returning south, Rangi-ihia kills two runaway
    attendants, is speared, is treated by Te-hau, and later dies after incantations
    are performed over dried blood and the spear. Before dying he charges Te-hau not
    to let his brothers live. Te-hau kills the brothers. Rangi-ihia is buried on a
    peak so his spirit can see his former haunts; years later his bones are exposed
    by a landslip, one bone is made into a fish-hook, and Nga-ti-mamoe hearers call
    for revenge over the posthumous dishonour.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a successful raid by Tura-kau-tahi's sons, Rangi-ihia, a noted Nga-ti-mamoe
    chief living at Matau, goes to Kai-apoi to make lasting peace with Nga-i-tahu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: To cement the treaty, Hine-hakiri of the Nga-i-tahu ruling family is given
    to Rangi-ihia in marriage, and Rangi-ihia's sister Kohi-wai is married to Hone-kai,
    son of Te-hau.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the birth of Rangi-ihia's son Pari, his wife's relations advise Rangi-ihia
    to return south because they wish to combine his hapu with their own and make
    Pari chief of both.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Te-hau and Tura-kau-tahi's sons escort Rangi-ihia south.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: On returning home, Rangi-ihia sees one of his sisters cooking food like a
    common slave and learns that her maids married and deserted her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rangi-ihia goes at night to the house of the runaway attendants and kills
    both women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: As Rangi-ihia leaves, one husband drives a spear into his shoulder; the point
    breaks off against the bone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Te-hau pulls the spear point out with his teeth and applies a toetoe plaster
    to the wound.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After Rangi-ihia sneers that the spear-thrust was weak, the injured men scrape
    dried blood from the spear and perform incantations over the blood and spear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The incantations over the blood and spear are said to produce symptoms of
    madness in Rangi-ihia, and he dies shortly afterward.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Before death, Rangi-ihia tells Te-hau not to let his brothers live, saying
    they are bitter men and will slay his children.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: After a suspicious answer about the patient, Nga-ti-mamoe enter the Nga-i-tahu
    camp, and Te-hau kills Rangi-ihia's brothers Tai-hua and Te-rangi-amohia.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Rangi-ihia is buried on the peak Te-raka-arunga-te-raki according to his wish,
    so that his spirit might see his old haunts to the south.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: Rangi-ihia's wife and children are sent back north, while Te-hau settles at
    Puke-kura.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Years after Rangi-ihia's death, a landslip carries his bones to the beach;
    a Nga-i-tahu person makes a fish-hook from one bone and makes an insulting remark
    while using it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: A Nga-ti-mamoe witness reports the insult, and his companions say the posthumous
    dishonour must be avenged.
  category: speech
  evidence_refs:
  - ev:9
