canonical_text:
  quote: ''
  summary: 'The passage recounts a sequence of conflicts between Nga-ti-ira and Nga-ti-hau-iti/Aitanga-a-hau-iti:
    battles fought in revenge, temporary peacemaking, renewed fighting after disputed
    leadership, a woman’s robbery of a preserve and killing of a pursuer, a killing
    that breaks peace after a visit involving food, an attack on Te-wai-au, and Paka-koriri’s
    tattooing request and combat at a river pa.'
  language: English
  quote_policy: summarized
