canonical_text:
  quote: ''
  summary: Apoka visits Wai-papa to join a fishing expedition, catches the only two
    fish, and the failed catch is treated as an ill omen. Returning home, he offers
    the fish at a tuahu to his atua, prepares for a journey, and carries a fish on
    a rod to Wai-rau, where his tribe recognizes it as a sign of a troubled mind.
    After hearing his grievances, they agree to attack Nga-ti-mamoe, sparing Apoka's
    wives because of kinship but seeking blood retaliation from their tribe. Apoka's
    force ambushes the pa at dawn; Uhi-kore kills Paua under the chief's canoe, the
    pa is taken, and survivors are killed, eaten, enslaved, or escape. Uhi-kore later
    wears Paua's spoils as a message to Tu-te-ure-tira; Paua's relations recognize
    the garments and lament. Nga-ti-mamoe flee, later fortify Peke-ta, fight Nga-i-tahu,
    suffer defeats, and endure a siege.
  language: English
  quote_policy: summarized
