    and swept gravel, pumice-stone, and shells high up on land.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speakers say they will tell what they know of the canoe Nuku-tere of the
    Nga-ti-porou or Porou-rangi people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Whiro-nui and his wife Arai-ara came from Hawa-iki to the islands in the canoe
    Nuku-tere.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Porou-rangi is said to descend from Whiro-nui and Arai-ara and therefore to
    have come in the canoe, although he was not yet born.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Many learned men came in Nuku-tere; two named learned men are Takataka-pu-tonga
