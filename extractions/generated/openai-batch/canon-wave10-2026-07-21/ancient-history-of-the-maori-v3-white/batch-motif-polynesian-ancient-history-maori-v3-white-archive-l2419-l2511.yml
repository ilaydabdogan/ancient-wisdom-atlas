  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Rua-wharo repeatedly came down and took the best fish out of the net.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The owners of the net grieved over the repeated plunder and the chiefs met
