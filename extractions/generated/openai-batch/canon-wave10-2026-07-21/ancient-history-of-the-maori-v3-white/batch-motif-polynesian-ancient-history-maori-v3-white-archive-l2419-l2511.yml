canonical_text:
  quote: ''
  summary: A fragment says a named figure came as a huge wave and swept sea materials
    inland. The Nuku-tere account states that Whiro-nui and Arai-ara came from Hawa-iki
    in the canoe Nuku-tere, with learned men, and gives a genealogy leading to Porou-rangi,
    from whom the tribe derives its name. A proverb blessing life and plenty is supplied.
    The Rua-wharo account describes Rua-wharo watching people fish with a net, repeatedly
    taking the best fish, and being trapped in the net and nearly drowned before being
    released and recognized as a noted chief.
  language: English
  quote_policy: summarized
