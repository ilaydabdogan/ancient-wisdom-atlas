canonical_text:
  quote: ''
  summary: Two travellers return at night to Moki's pa, are recognized by their sister
    Marewa through the fragrance of tara-mea, receive food and protection under Moki's
    roof, and report southern lands and food resources to chiefs. News that Tu-te-kawa
    is living at Wai-kakahi prompts preparation of the great war-canoe Te-maka-whiu.
    The passage also recounts the canoe's origin from an enormous totara tree, its
    later burial by landslip, and its status as a sacred treasure guarded by gods,
    with a man dying after chipping off a piece.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The travellers reach the outskirts of O-te-kauae at night, ask for Moki's
    house, and wait near the porch and breakwind without entering the pa openly.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Their sister comes out around midnight; a concealed parcel of tara-mea is
    opened, and its fragrance draws her to the crouching brothers before they identify
    themselves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Marewa tells Moki that his brothers-in-law have returned, and Moki orders
    that they be brought inside, fed, and not publicly announced until morning.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage explains that eating under Moki's roof would secure his protection
    in a setting where private revenge killings made unprotected people vulnerable.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Several chiefs question the travellers about southern lands and available
    foods, including fern-root, kauru, birds, rats, eels, flat-fish, and ducks.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
- id: obs:6
  text: Mango responds to the report with an inland-and-coast metaphor, and Te Rua-hiki-hiki
    declares that the reported place shall be his possession.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: The report that Tu-te-kawa is still living at Wai-kakahi leads Moki and other
    leading chiefs to order the great war-canoe Te-maka-whiu prepared for sea.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: Te-maka-whiu is described as a great war-canoe made from an enormous totara
    tree from the Wai-rarapa Valley.
  category: object
  evidence_refs:
