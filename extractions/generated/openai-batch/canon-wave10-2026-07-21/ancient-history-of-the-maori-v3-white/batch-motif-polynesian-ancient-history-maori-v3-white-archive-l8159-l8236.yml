canonical_text:
  quote: ''
  summary: After recovering from a chest wound, Tare-wai hides near water sources
    used by Nga-ti-mamao and kills solitary water-gatherers. Later, while Puke-kura
    Pa is besieged, he signals his kin from a tree and uses a haka as a diversion
    to reach the pa. He orders vengeance for insults, eats a cooked dog, has the men
    paint themselves, and goes to battle with Kata-ma-kuao. The passage describes
    sacred fire, the honored first slain enemy, the rout of Nga-ti-mamao, and Tare-wai’s
    encounters with hostile spirits and a man in a canoe on his return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tare-wai is described as recovered from a chest wound made by enemies with
    obsidian and as seeking a resting-place or home near Puke-kura Pa.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: He hides in the forest near streams used by Nga-ti-mamao for water and kills
    people who come alone, while not molesting groups who come together.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: He moves from one stream to another after blood from those killed is seen
    at the stream mouth or on the coast.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Because Nga-ti-mamao surround and besiege Puke-kura Pa, Tare-wai cannot enter
    it directly; he climbs a tree and beckons to his relatives inside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tare-wai asks his relatives to have the people of the pa perform a haka to
    divert Nga-ti-mamao; the besiegers gather on surrounding hills to watch.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: During the confusion caused by the haka, Tare-wai leaves the forest, goes
    down to the sea-beach, is seen by two canoe-menders, is chased, eludes pursuit,
    and enters the pa.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: After entering the pa, Tare-wai tells Nga-ti-mamao that they might have taken
    him just before but will not now, and challenges them to hand-to-hand battle the
    next day.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: Tare-wai tells Maru and Apa-rangi to kill Rangi-moa as satisfaction for insults
    offered to him; Rangi-moa, identified as a chief of Nga-ti-mamao, is killed in
    Puke-kura Pa.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A dog is killed and cooked for Tare-wai; he eats it without cutting it to
    pieces, then tells the men to paint themselves, and those besmeared with red ochre
    go out to battle at dawn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Tare-wai and Kata-ma-kuao each take hold of sacred fire before meeting the
    enemy.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Tare-wai wards off an opponent’s spear-thrust, kills that opponent with his
    spear, and declares that he has the first slain enemy, called the first fish.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the first kill, Tare-wai wounds opponents and leaves people behind him
    to kill them; Nga-ti-mamao break and flee, and many are killed in pursuit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: On his return, spirits of those killed by Tare-wai attempt to frighten him,
    but he kills them; he also kills a man in a canoe who tries to intimidate him.
  category: action
  evidence_refs:
  - ev:6
