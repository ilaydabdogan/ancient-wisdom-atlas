canonical_text:
  quote: ''
  summary: 'A chant addresses Rangi and Papa, laments a beloved who has gone, recalls
    an angry curse, and says help from western and southern hosts is vain. The prose
    narrative begins the Ue-nuku account: Rua-tapu is ashamed after his father Ue-nuku
    comments on a sacred comb that Rua-tapu had used and says that KaThutia-terangi
    may rightly use it. Rua-tapu leaves home for his mother. She tells him to board
    the canoe Nuku-te-pcwa-raki, also called Te-o-te-poa-raki, and go to distant ancestors
    on the open ocean. Rua-tapu and companions put to sea, and he keeps his foot on
    a hole in the canoe bottom as the excerpt ends.'
  language: English
  quote_policy: summarized
