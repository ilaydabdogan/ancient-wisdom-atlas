canonical_text:
  quote: ''
  summary: An attacking force associated with Moki advances after testing whether
    fishers notice them. Wha-kuku scouts above a pa, imitates bird cries as signals,
    and hides in a cave. The force delays until dawn and storms the pa. Moki mistakes
    upright stones for enemies, while other warriors take prisoners and kill named
    opponents. Wha-kuku later ambushes Uruhanga from a cave above a cliff path. The
    passage ends with Moki reaching Tu-te-kawa, an old chief, and an avenger killing
    him despite attempts by Tu-ahu-riri's sons to shield him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Moki fastened a white whalebone weapon to his foot and dangled it over a cliff;
    when fishers did not notice it, he concluded that the enemy were unaware of his
    approach and continued without waiting for darkness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The force reached woods on the south side of Long Bay, arranged the attack,
    found concealment, and waited for the scout's promised signals.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wha-kuku reached a place overlooking the pa and imitated a wood-hen cry; women
    in the pa interpreted the sound as a female weka.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wha-kuku climbed higher, gave another cry that the women interpreted as a
    male weka, then descended and hid in a shallow cave near the pa.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wha-kuku's companions interpreted the signals to mean that the pa contained
    many women but was not entirely unprotected, so the assault was delayed until
    dawn.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the first light in the eastern sky, the warriors rushed from concealment
    and took the pa by storm.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Moki sought the distinction of killing the first foe, rushed in front, and
    struck two shapes he thought were enemies, but they were upright stone blocks
    later known as Moki's pair.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Moki's failure was attributed to his omission to remove a spell that Turangi-po
    had cast on him.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: Turangi-po captured two women, Te-maeke and Ta-whera, as prisoners.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Te-ao-tu-tahi, the principal chief of the pa, was killed by Mahi-ao-tea.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Uruhanga tried to escape by a cliff path, but Wha-kuku, hidden in a cave above
    him, speared his shoulder and hurled him down the cliff toward a pursuer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Wha-kuku and the pursuer exchanged words about whose man Uruhanga was, and
    Wha-kuku asked that his name not be concealed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the fall of Para-kaka-riki, Moki returned to Koukou-rarata with prisoners,
    drew up his canoe, set a guard over the prisoners, and marched over the hills
    to Wai-kakahi.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Moki's shadow across Tu-te-kawa's threshold announced the arrival of Ngai-tahu;
    Tu-te-kawa was found infirm in his mats, Tu-ahu-riri's sons tried to shield him
    in memory of their father's words, and an avenger of blood killed him with a spear.
  category: sequence
  evidence_refs:
  - ev:8
