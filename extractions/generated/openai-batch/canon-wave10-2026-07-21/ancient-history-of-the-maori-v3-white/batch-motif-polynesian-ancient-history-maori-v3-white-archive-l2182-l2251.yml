canonical_text:
  quote: ''
  summary: 'The passage describes a place compared to Whanga-ra, Paikea living and
    dying there, and his burial in a cave kept sacred for tribal burials. It then
    gives Ue-nuku traditions: Ue-nuku’s children lose a red plume found and withheld
    by Mahina; Whena kills Ue-nuku’s children; Ue-nuku uses effigies in war-canoes
    and defeats Whena; a captive woman becomes Ue-nuku’s wife and Rua-tapu is born
    on a scalp mat. A second Ue-nuku account describes two wives of different rank,
    their sons Ka-hutia-te-rangi and Rua-tapu, Rua-tapu killing Ka-hutia-te-rangi’s
    dog, Ue-nuku insulting Rua-tapu’s low birth, and Rua-tapu preparing a sabotaged
    canoe and inviting first-born sons on a voyage.'
  language: English
  quote_policy: summarized
