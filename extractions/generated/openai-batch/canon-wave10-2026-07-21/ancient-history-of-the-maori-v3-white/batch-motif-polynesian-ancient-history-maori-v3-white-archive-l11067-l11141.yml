canonical_text:
  quote: ''
  summary: A preserved-food vessel is reserved for a return but is later proposed
    for use on a war expedition. Maru leads Nga-i-tahu against Kura-te-au, captures
    Hine-maka, and spares her by giving her in marriage to his son so that the avenging
    of his slave’s death will be remembered. Te-rangi-tau-neke challenges Manawa to
    spear combat; Maru takes the challenge and wins without killing him. Later Te-rangi-tau-neke
    is reportedly killed, but his guardian gods lick up his blood and he recovers,
    retakes a captured pā, sets it on fire, and withdraws south. In a later peace,
    Manawa visits Taki-auau to view Te-ahua-rangi as a prospective bride for his son,
    intending the marriage to subordinate her hapū.
  language: English
  quote_policy: summarized
