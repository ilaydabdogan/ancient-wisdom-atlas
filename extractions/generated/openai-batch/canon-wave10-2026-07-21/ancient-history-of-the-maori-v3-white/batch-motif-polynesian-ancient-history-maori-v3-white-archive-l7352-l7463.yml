canonical_text:
  quote: ''
  summary: The passage recounts intertribal revenge, flight, protection, killing of
    refugees, Whango’s escape to a cave, an attack involving Nga-ti-ira, a peace settlement
    with land and people transferred to Nga-ti-ira, a proverb and deathbed instruction
    about protection, and a later conflict caused by repeated plundering of fish from
    a fishing-net. Nga-ti-hau-iti messengers consult Maru-ka-koa about killing relations;
    he gives a harsh enacted demonstration with half-raw birds and suffocating smoke,
    then instructs them to act with eyes shut until the enemy is beaten. The passage
    ends with preparations involving a fence, a net, an invitation to witness the
    net being put into the sea, and removal of women and children to a pa before the
    guests arrive.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nga-ti-porou rose to avenge Tau-tini’s death, attacked and took the pa O-toi-roa,
    and survivors fled to Te-uru-akoura to seek protection from Nga-ti-ira.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tu-te-rangi-kati-pu commanded Nga-ti-ira to kill Nga-ti-hau-iti refugees;
    Nga-ti-ira killed sixty at Te-aruhe, while Whango escaped and hid in a cave on
    the sea-beach near a crawfish place, where Tu-te-kohi fed him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: An approaching group identified itself as Waikawa, a sub-tribe of Nga-ti-ira;
    after Whango reported this, the group cooked food at a distance and then attacked
    Tu-te-kohi’s pa after the Nga-ti-hau-iti occupants had fled.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Peace was later made between Nga-ti-ira and Nga-ti-hau-iti after the battle
    called Hau-peke-nui.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the peace settlement, Tu-te-rangi-ka-tipu gave specified lands and the
    people occupying them to Nga-ti-ira, after which Nga-ti-ira joined their former
    enemy in seeking satisfaction for earlier insults and defeats.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A proverb described Nga-ti-ira in battle-array as the pukura of Toko-rakau,
    and Toko-rakau gave a deathbed instruction to protect Nga-ti-ira, Nga-ti-maru,
    and Nga-ti-hau as a means of overcoming assailants.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A fishing-net belonging to Nga-ti-hau-iti was identified as the cause of a
    battle in which named leaders and many of their people were killed.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Aitanga-a-mahaki repeatedly drew the Nga-ti-hau-iti fishing-net without catching
    fish, then plundered the fish caught by Nga-ti-hau-iti with the same net.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Nga-ti-hau-iti messengers asked Maru-ka-koa how they might kill their relations;
    he answered through an enacted demonstration using half-raw kaka-riki birds, totara
    chips on a fire, a closed house, and smoke that nearly suffocated the messengers.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Maru-ka-koa instructed the messengers to shut their eyes and act, then open
    their eyes when they thought the enemy had been beaten.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The messengers returned, the tribe built a fence and made a net, and a messenger
    invited Tau-ira, Taotao, and their people to witness the net being put into the
    sea; before the guests arrived, women and children were sent to Puia-manuka so
    the Nga-ti-hau-iti could act freely.
  category: sequence
  evidence_refs:
  - ev:11
