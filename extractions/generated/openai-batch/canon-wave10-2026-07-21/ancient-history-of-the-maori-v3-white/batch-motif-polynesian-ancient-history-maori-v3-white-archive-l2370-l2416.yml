canonical_text:
  quote: ''
  summary: Hoe-ora is lost in the sea after teaching Paikea sacred lore. Paikea alone
    escapes death and reaches land. Rua-tapu seeks revenge for insults connected with
    his father, kills others, pursues Paikea, announces a future arrival in the eighth
    moon, and tells people to live at Puke-hapopo and Rangi-toto so some may escape
    destruction. Rua-tapu departs on a baler and becomes an ocean bore or rushing
    wave, while Paikea lands alive. Whiro-nui arrives in the canoe Nuku-tere with
    insects and lizards, recognizes Paikea, and hears that Rua-tapu's expected return
    is fulfilled.
  language: English
  quote_policy: summarized
