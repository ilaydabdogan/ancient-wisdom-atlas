canonical_text:
  quote: ''
  summary: Kane hides near the Nga-ti-mamoe pa, attacks fishers, captures a canoe,
    kills those aboard except a chief, and brings the prisoner back. Maru recognizes
    the prisoner Tu-karoua as his brother-in-law and covers him with a chief's garment,
    which should make him sacred and protect his life, but Kane mutilates and eats
    the prisoner's ears in revenge for Manawa and Maru gives him up to be eaten. Nga-i-tahu
    then besiege Pakihi. Tu-te-rangi-apiapi pretends to seek peace with the besieged,
    waits for a favorable wind, and sets fire to the thatch with a heated stone; smoke
    allows Nga-i-tahu to enter and massacre the pa. Tu-matai-ao is caught, briefly
    made to think he is safe beside Maru on a mat, then killed and eaten. The Nga-ti-mamoe
    retreat south after repeated defeats.
  language: English
  quote_policy: summarized
