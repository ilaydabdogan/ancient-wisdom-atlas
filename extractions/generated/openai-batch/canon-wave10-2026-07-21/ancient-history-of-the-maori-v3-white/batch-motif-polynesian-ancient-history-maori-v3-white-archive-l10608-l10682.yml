canonical_text:
  quote: ''
  summary: The passage recounts escalating conflict between Nga-i-tahu and Nga-i-tara
    after the eating of a Nga-i-tahu corpse and the retaliatory use of a Nga-i-tara
    chief's bones as fishing-hooks. The dispute leads to killings of flax-gathering
    women, an ambush and death of Pu-raho, the relocation and fortification of Nga-i-tahu,
    and later disagreement over sparing a captive intended as utu.
  language: English
  quote_policy: summarized
