    and collects beneath her with her hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Patatai hides on the stream bank, makes a loud lip-noise, and startles Pani
    while she is collecting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After being seen, Pani is ashamed and returns to the village; the passage
