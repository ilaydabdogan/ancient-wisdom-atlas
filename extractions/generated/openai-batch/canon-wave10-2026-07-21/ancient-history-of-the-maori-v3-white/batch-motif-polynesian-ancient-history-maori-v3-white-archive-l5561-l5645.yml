canonical_text:
  quote: ''
  summary: The passage recounts Pani’s repeated provisioning of food, her being seen
    collecting in a stream, and the resulting securing of kumara for humans. It describes
    kumara as ritually distinct from fern-root, associated with Rongo-marae-roa, agricultural
    incantations, and martial taboo rites. A second account tells of Pou-ranga-hua
    seeking better food for his son Kahu-kura, losing his canoe to his brothers-in-law,
    surviving at sea by means of a feather canoe, incantations, and a whale, then
    obtaining two kumara roots and planting them with rites so the country is supplied.
  language: English with Maori names and terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pani repeatedly fills baskets, cooks the food in an oven, and distributes
    it in equal parts to her people morning and evening.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies wartime vegetable food as roasted, pounded fern-root
    made into cakes called Te-akatu-whenua.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
