canonical_text:
  quote: ''
  summary: The passage gives related accounts in which Rua-tapu leads a canoe voyage,
    sabotages the canoe by uncovering a hole, and causes the deaths of chiefly passengers.
    Paikea survives through incantations, divine power, fish aid, or transformation
    into a fish. A flood later sweeps over the land and drowns people except those
    who go to Hiku-rangi; Moa-kura drinks the flood so it recedes. A Te Arawa variant
    explains Rua-tapu's revenge as a response to his father's rebuke of his lower
    maternal rank, and says east coast tribes claim Paikea as progenitor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A canoe named Tu-te-poa-raki is obtained and taken to sea on a voyage with
    many young chiefs, ostensibly to visit ancestors far out in the ocean.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Paikea jumps aboard the canoe without being invited.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In mid-ocean Rua-tapu turns the canoe south, lifts his foot from a hole in
    the canoe bottom, and the canoe fills with water and upsets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: All aboard perish except Paikea and Rua-tapu; Paikea saves himself by chanting
    incantations to his god.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rua-tapu tells Paikea to go to Hiku-rangi so that a remnant may escape destruction,
