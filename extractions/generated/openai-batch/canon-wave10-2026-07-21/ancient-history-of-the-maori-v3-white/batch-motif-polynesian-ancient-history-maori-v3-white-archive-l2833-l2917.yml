candidate_motifs:
- id: motif:1
  label: Sabotaged canoe voyage kills passengers
  taxonomy_refs: []
  basis: Both accounts describe Rua-tapu using a canoe with a hidden or covered hole
    so that it fills with water and the passengers perish.
  evidence_refs:
  - ev:2
  - ev:8
  - ev:9
  confidence: high
  cautions: This is a passage-level pattern; no supplied taxonomy family exactly names
    canoe sabotage.
- id: motif:2
  label: Flood survived by mountain refuge
  taxonomy_refs:
  - flood_and_renewal
  basis: A flood-like sea inundation drowns people on the land, while those who go
    to Hiku-rangi survive and the flood later recedes.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The renewal element is limited to remnant survival and flood recession;
    the passage does not describe creation of a new world.
- id: motif:3
  label: Human survivor becomes fish
  taxonomy_refs:
  - shapeshifter
  basis: The Te Arawa account says Paikea is empowered by the gods, transforms himself
    into a fish, crosses the ocean, lands, and resumes human form.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The self-transformation appears in the Te Arawa account; the preceding
    account instead mentions incantations and a fish carrying Paikea.
- id: motif:4
  label: Fish helper returns survivor to land
  taxonomy_refs:
  - return
  basis: The fish Rua-mano carries Paikea back to land after he parts from Rua-tapu.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: This is a brief note and differs from the later variant where Paikea himself
    becomes a fish.
- id: motif:5
  label: Survivor pair after canoe destruction
  taxonomy_refs:
  - survivor_pair
  basis: The first account states that all perish except Paikea and Rua-tapu.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The surviving pair is not presented as a cooperative founding couple;
    one survivor is the destroyer of the canoe.
- id: motif:6
  label: Destruction of unbelievers by flood
  taxonomy_refs:
  - divine_judgment
  basis: The passage says the people who disbelieved Ue-nuku's injunctions perished
    when the sea swept over the land.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage states a moral cause for death, but does not explicitly describe
    a god pronouncing judgment.
- id: motif:7
  label: Status insult leads to revenge against chiefly sons
  taxonomy_refs: []
  basis: In the Te Arawa account, Rua-tapu is rebuked as low degree because of his
