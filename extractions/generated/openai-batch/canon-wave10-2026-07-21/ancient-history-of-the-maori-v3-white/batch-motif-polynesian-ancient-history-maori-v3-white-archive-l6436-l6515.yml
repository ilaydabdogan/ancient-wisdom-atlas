  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Apa-nui came with his daughter Rongo-mai-hua-tahi and all his people to the
    house, and Kahu-kura-nui ordered abundant food for a feast, including eels, codfish,
    taro, and other dainties.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: On the following morning the hosts pretended to cook food for the guests,
