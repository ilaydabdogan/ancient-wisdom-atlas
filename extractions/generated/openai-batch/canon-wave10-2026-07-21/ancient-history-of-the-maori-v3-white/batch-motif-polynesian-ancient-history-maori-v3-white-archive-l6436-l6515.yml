canonical_text:
  quote: ''
  summary: The passage recounts battles in which Hau-iti defeats his elder brothers
    and their followers, followed by temporary peace. Their descendants later feud
    after Apa-nui insults Kahu-kura-nui because of his white hair. Kahu-kura-nui conceals
    his anger, arranges a marriage between his son and Apa-nui's daughter, builds
    a carved house, hosts a feast, and then has his tribe present false food and kill
    Apa-nui and his people. The district of Hina in U-awa passes from the elder line
    to Hau-iti's line. A new tale begins with Rua-tau-pare, a woman of rank, wife
    of Tu-whakairi-ora and mother of six children; after the birth of Wehiwehi she
    is seriously injured, lives apart in a tapu sick-house, and is visited by her
    husband.
  language: English
  quote_policy: summarized
