- id: obs:1
  text: Hau-iti was overtaken by his brothers at the pa of Tama-tauira at Rangi-ta-wahi-kura,
    and he defeated them in a battle called Kau-neke.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hau-iti's friends came to aid him, and another battle took place in which
    his elder brothers were worsted; this battle was called Te-ngaere-nuku or Te-ngaere-rangi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After being reinforced, Hau-iti pursued his brothers and their followers and
    again defeated them in a final battle called Te-rangi-hi-wera or Para-wera-nui.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the brothers' wrath subsided they stopped fighting and lived together
    peaceably, but their descendants later fought again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Taua, the eldest brother, had a son named Apa-nui, and Hau-iti, the youngest
    brother, had a son named Kahu-kura-nui.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Apa-nui called “Moi” to Kahu-kura-nui in the manner of calling to a dog, because
