canonical_text:
  quote: ''
  summary: A warfare narrative recounts an ambush at a stream, the siege of a pa,
    Hine-tau-piri's advice to use crawfish to induce thirst and to cover the water
    springs, the fall of the pa, deaths from thirst, exhumation of bodies, flight
    and renewed fighting, revenge killings and cannibal consumption of slain enemies,
    and a plan to move women and children to Huia-rua mountain for safety.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People from the pa followed strangers down to a stream, where concealed warriors
    attacked and killed them and then besieged the pa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hine-tau-piri is described as a high-ranking woman from U-awa of the Hau-iti
    people, related to Aitanga-a-hau-iti, and wife of one of those in the pa.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hine-tau-piri told the attackers to catch crawfish, send them as a present
    to the pa, and cover and guard the springs because the people would become thirsty
    after eating the crawfish.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The attackers caught crawfish, covered the springs, sent the fish, and then
    attacked and took the pa when the defenders had no water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two named warriors of the pa, Pua-roa and Whakataua-rehu, died from lack of
    water and were buried in the forest before the pa was taken.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hine-tau-piri kept the attacking warriors informed about events in the pa
    and told them at night where two bodies had been buried.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Those in the pa heard enemies dancing a war-dance and understood from the
    song that the dead had been exhumed; the body of Te-ao-puhara, buried in a sacred
    place, had also been taken.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Some people fled to the forest; seventy under Tu-a-koto and Raparapa hid in
    a cave, while one thousand built another pa that was attacked and taken before
    completion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mahora gathered the remnant of his people, attacked Aitanga-a-hau-iti, killed
    many, captured Hine-tau-piri, and the Nga-ti-ira killed and ate her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The place where Hine-tau-piri was killed later became associated with bird-spearing,
    and bird-spears used there were called Hine-tau-piri.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Nga-ti-ira ate the dead after killing enemies, were attacked by Nga-ti-hauiti,
    won again, ate the slain, and named the battle Taro-whakawiri.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Nga-ti-ira decided to take their women and children to Huia-rua mountain
    for safety; the passage notes a narrow path near the summit.
  category: action
  evidence_refs:
  - ev:8
