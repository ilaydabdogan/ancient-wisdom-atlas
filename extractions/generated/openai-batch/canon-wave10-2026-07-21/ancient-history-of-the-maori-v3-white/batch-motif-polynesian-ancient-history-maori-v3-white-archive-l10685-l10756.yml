literal_observations:
- id: obs:1
  text: After Wai-tai’s secession, Nga-i-tahu still wished to continue the war, while
    Maru opposed this because of kinship with Nga-i-tara.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Te-kane and Tau-hiku went out in canoes to fish in response to their grandchildren’s
    cries for different food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A fog enveloped both canoes; the crews could hear each other’s paddles but
    could not see each other.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Te-kane realized the paddling sounds came from Nga-ti-mamoe canoes pursuing
    them; he turned toward shore, while Tau-hiku was surrounded and captured.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: A running fight took place between Te-kane’s canoe and Nga-ti-mamoe, while
    the fog kept the shore people from seeing what was happening.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Te-kane repeatedly seized the nearest enemy when they came close, pulled him
    into his canoe, killed him by cleaving his skull, and gained distance when the
    enemy drew back from the spurting blood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the fog lifted near shore, the people saw Tau-hiku bound in the Nga-ti-mamoe
    canoe; the Nga-i-tahu wailed farewell, and Tau-hiku raised two fingers in response.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nga-i-tahu considered themselves deprived of their wisest tohunga, who had
    read omens, identified propitious times for attack, and warned of danger.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tau-hiku’s daughter advised the chiefs to summon Pohatu, but they initially
    dismissed him as talentless, slave-associated, and defiled.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chiefs stripped Pohatu, washed him in water, and performed ceremonies
    and incantations to consecrate him and make him tapu.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Pohatu interpreted Tau-hiku’s two raised fingers as meaning two years, instructing
