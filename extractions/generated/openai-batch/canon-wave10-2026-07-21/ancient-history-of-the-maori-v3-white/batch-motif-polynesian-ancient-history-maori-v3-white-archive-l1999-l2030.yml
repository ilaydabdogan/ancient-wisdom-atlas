canonical_text:
  quote: ''
  summary: Ue-nuku returns from a visit and finds his comb has been used. Rua-tapu
    names Paikea as the user, and Ue-nuku insults Paikea over birth status. Paikea,
    hurt, voyages south, swamps the canoe by pulling its plug, causing three named
    people to drown while Paikea and Rua-tapu escape. Rua-tapu gives Paikea the sacred
    power of life to carry to those on shore and instructs him about where the people
    should live. Rua-tapu then swims to named cloud places, signals in the heavens,
    and chants sacred incantations.
  language: English
  quote_policy: summarized
