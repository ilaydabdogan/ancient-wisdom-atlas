canonical_text:
  quote: ''
  summary: The passage recounts an animal or being printed as a 'clog' running into
    water and becoming a taniwha, a Whanganui place-name origin linked to Tama-tea-pokai-whenua
    combing and tying his hair, genealogical wives and children of Tama-tea, Kahu-ngunu's
    departure from Tauranga after a dispute, his migration and marriages, his journey
    after hearing of Rongo-mai-wahine, his provisioning of fern-root for a settlement,
    and the beginning of an episode in which paua is desired as a relish and Kahu-ngunu
    tests breath-holding while watching a diving kawau.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An animal or being printed as a 'clog' ran into the water and became a taniwha
    while the traveler continued to Whanganui.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Whanganui, Tama-tea-pokai-whenua sat down, combed his hair, tied it into
    a top-knot, and the place was named from that circumstance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tama-tea-pokai-whenua is given two wives, Iwi-rau and Mahaki-roa, with named
    children and descendants attached to them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kahu-ngunu left Tauranga because of a dispute involving himself against Paoa
    and Whaene; Ira-nui accompanied him on the migration.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kahu-ngunu took Hinga-roa as wife at U-awa, later came to Titi-rangi, asked
    about a visible fire, was told it belonged to Rua-pani, was taken to Rua-pani's
    pa, and took Rua-rere-tai as wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kahu-ngunu heard of the fame of Rongo-mai-wahine, described as a woman of
    supreme rank, and travelled toward Te-wai-roa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the way, Kahu-ngunu stayed at Te-mahanga, took Hine-pu-ari-ari as wife,
    and soon forsook her.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Rongo-mai-wahine is reported as saying that if Kahu-ngunu came there, they
    would receive him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Kahu-tara, Rongo-mai-wahine lived with her husband Tama-taku-tai, along
    with other named chiefs and wives.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: After two days at Kahu-tara, Kahu-ngunu told his thirty followers to dig fern-root
    and directed them to tie all of it into one large bundle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The bundled fern-root was rolled down the hill in front of the houses, untied,
    and gathered by women and children into storehouses sufficient for all the people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The women praised Kahu-ngunu for his kindness to them and their children.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: While eating fern-root, the people wanted a kinaki or savoury morsel, but
