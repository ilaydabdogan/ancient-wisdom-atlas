canonical_text:
  quote: ''
  summary: A fishing net is placed in water and plundered of fish by Te Aitanga-amahaki.
    A Nga-ti-ira chief orders the net thrown over the plunderers, who are killed.
    Hau-iti receives eight spear-thrusts. The slain are laid out at Kau-neke for intended
    cooking, but an approaching war-party interrupts. A Nga-ti-ira chief calls for
    his taiaha, recites a challenge proverb, and instructs his son Rongo-te-uhu to
    pursue the enemy. The enemy is beaten and pursued to O-hae, where Ra-kai-whakairia
    is killed. A later sentence begins an episode in which Mahine-tu-ki-te-rangi is
    captured at Para-riki and not recognized by his enemies.
  language: English
  quote_policy: summarized
