canonical_text:
  quote: ''
  summary: The passage gives a genealogy and migration account of Paikea. He marries
    Manawa-tina at Whaka-tane, later marries Hutu-rangi at Wai-apu, migrates with
    Hutu-rangi and her kin to Ana-ura, gives land and a protected dwelling to her
    people and parents, stocks a lake with an eel, provides firewood, then travels
    south to Whanga-ra and identifies local places as resembling places from his old
    home.
  language: English
  quote_policy: summarized
