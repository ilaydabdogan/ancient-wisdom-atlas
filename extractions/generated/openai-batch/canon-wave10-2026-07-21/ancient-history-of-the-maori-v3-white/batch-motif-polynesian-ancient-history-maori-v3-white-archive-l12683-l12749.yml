canonical_text:
  quote: ''
  summary: 'The passage recounts movements and conflicts among tribes in the South
    Island: settlement after crossing Cook Strait, gifts of food followed by conquest,
    intermarriage after warfare, arrival of Ngai-tara and Ngati-kuri, the burial and
    desecration of Ao-marire''s bones, retaliation against Ngati-kuri, later reinforcements
    by Turakau-tahi and Moko, and southward expansion connected with forest clearing
    by fire.'
  language: English
  quote_policy: summarized
