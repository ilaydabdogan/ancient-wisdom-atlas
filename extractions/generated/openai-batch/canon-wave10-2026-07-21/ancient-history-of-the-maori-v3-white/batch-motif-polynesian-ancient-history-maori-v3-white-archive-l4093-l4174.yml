canonical_text:
  quote: ''
  summary: The passage tells how Whaene insults Kahu-ngunu over a fish portion, after
    which Kahu-ngunu and his followers leave. Kahu-ngunu later lives among Nga-ti-porou,
    has children who become ancestors and leaders there, then travels to another settlement.
    He is hosted by a chief whose wife is Rongo-mai-wahine, whom Kahu-ngunu desires.
    He impresses the hungry settlement by gathering a huge quantity of fern-root and
    then by learning from a diving shag how long he can hold his breath before diving
    into deep water with a net and obtaining many paua.
  language: English
  quote_policy: summarized
