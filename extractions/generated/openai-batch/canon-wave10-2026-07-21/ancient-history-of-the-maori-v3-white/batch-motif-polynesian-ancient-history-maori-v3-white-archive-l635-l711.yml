canonical_text:
  quote: ''
  summary: Rata is rebuked for cutting the ancestral tree Tane-mahuta without consultation,
    is instructed how to proceed, builds a canoe, and sails with an army to avenge
    his grandfather. He counters Pou-a-hao-kai’s calls, enters Pou-a-hao-kai’s house
    with his host, uses an incantation involving water and rain, and kills Pou-a-hao-kai
    by throwing hot stones into his mouth. Rata then takes Tama-uri-uri as his god.
    Tama-uri-uri deceives Matuku-tango-tango into climbing from a cave, prepares ropes
    and named fences, and signals Rata’s people to trap him; Matuku’s wings are broken
    and Rata kills him. Afterward people can travel safely without fear of these monsters.
  language: English
  quote_policy: summarized
