canonical_text:
  quote: ''
  summary: The passage recounts a feud involving Tu-te-kawa, Tuahu-riri, Hika-oro-roa,
    and the ruling family of Nga-i-tahu. During an attack on Tuahu-riri's pa, the
    youth Turuki is taunted for rushing ahead, then urges Tu-te-kawa to attack from
    another side. Tu-te-kawa succeeds, has Turuki warn Tuahu-riri to flee, enters
    the pa, and kills Tuahu-riri's two high-status wives. The narrator suggests possible
    motives of family honor and fear of Hika-oro-roa's revenge. Later, Tuahu-riri
    calls from the forest edge asking for the return of his clothing, belt, and weapons.
  language: English
  quote_policy: summarized
