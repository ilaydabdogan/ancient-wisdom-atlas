canonical_text:
  quote: ''
  summary: A poetic address to Bupe/Kupe reports an ancient saying about alternating
    years of scarcity and eventual plenty. Kupe is said to have power over valued
    gifts of earth, land, sea, and hidden darkness. In sleep, a spirit-medium conveys
    what a staff of life or omen-staff says. The omen-staff announces heaven’s decree
    of famine and universal death, with Rehua casting humans into the grave or cooking-pits
    of misery.
