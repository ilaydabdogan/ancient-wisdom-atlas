canonical_text:
  quote: ''
  summary: Te-wera performs offerings involving a dog at Wai-koua-iti, then leads
    successive night war expeditions by canoe. A woman from Puke-kura is ambushed,
    killed, ritually offered to the gods, and her corpse is displayed before her people
    while Te-wera exchanges taunts with them. Later Te-wera attacks Kikiwa's party
    after they mistake his canoe for friendly people, kills ten, and again boasts
    near Puke-kura. He then assembles a larger force; spies see the fires of a Nga-ti-mamoe
    war-party, which camps in rain and fog under temporary spear-framed shelters while
    Te-wera's party advances at night. The passage ends mid-action.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wai-koua-iti, Te-wera had the dog body hung up, cut and cooked one hind
    leg, held it up as an offering to the gods and to appease the manes of Patuki,
    after which an officiating priest ate it and the rest of the dog was hung up again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Te-wera called his people together in the evening and told them to be ready
    for a night war-expedition by canoe toward O-takou.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The canoes arrived in darkness, were dragged away and hidden in the forest,
    and the party slept.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A woman from Puke-kura Pa travelled along the sea-beach toward Papa-nui to
    visit people killing seals, without knowing of the ambush.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman was captured by the enemy, killed, and the usual ceremonies were
    performed over her corpse as an offering to the gods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman's body was placed in a canoe, and the fleet paddled in open daylight
    to Puke-kura and stopped below the pa in sight of its people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The people of Puke-kura came to the beach and repeated a taunt to Te-wera
    about what an old man could do or kill.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Te-wera answered with threats and figurative insults, including that a female
    bird had crossed his trap and that the opposing warriors would soon weep and be
    cooked.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Te-wera ordered the canoe with the murdered woman's corpse to be tilted so
    the people of the pa could see the body, and the crowd on shore wailed loudly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After some time, Te-wera organized another night war-party that reached O-takou,
    where Kikiwa and his followers mistook them for their own people coming by sea
    from Puke-kura.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Te-wera attacked Kikiwa's party, killed ten, put the bodies into the canoe,
    and later announced near Puke-kura that he had caught ten of them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Te-wera later ordered a great force to assemble, started at night, landed
    at Pori-a-haumia, and sent spies who saw fires of a Nga-ti-mamoe war-party on
    the east coast.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Nga-ti-mamoe party camped at Te-apiti during rain and dense fog, made
    temporary shelters from war-spears and grass, lit fires beneath them, slept, and
    left one man keeping watch.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: Te-wera and his party moved on at night with the usual ceremonies performed
    on occasions of attack; the supplied passage breaks off before the attack outcome.
  category: sequence
  evidence_refs:
  - ev:7
