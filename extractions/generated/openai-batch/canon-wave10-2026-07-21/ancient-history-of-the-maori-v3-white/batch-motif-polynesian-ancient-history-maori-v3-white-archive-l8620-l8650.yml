canonical_text:
  quote: ''
  summary: The passage recounts post-battle occupation of a district by family tribes
    of the Kahvi-ngunu, the building of Mau-puia under Te-rahui, later battles in
    the Harbour of Tara area in which Nga-ti-apa were beaten, and the seasonal use
    of a Te-mahanga village and nearby cave. The cave is said to have formerly been
    the home of a sea-monster in Tara’s time. A pa named Tapu-te-rangi was built,
    major battles ceased, many people left Hataitai over seven generations, Nga-ti-puku
    remained until Te Rau-paraha and Nga-ti-toa visited, and a new section begins
    with the parentage of Tuahu-riri.
  language: English
  quote_policy: summarized
