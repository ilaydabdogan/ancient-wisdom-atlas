  quote: ''
  summary: The passage frames Maori landscape names as indexes of history, then gives
    a sequence of traditions about groups and chiefs who migrated to or settled parts
    of the Middle Island/South Island, including canoe traditions, named settlements,
    tribal origins, an affray with Tasman's boat crew, occupation evidence, and the
    ancestry and southward movement of Wai-taha descendants.
  language: English
  quote_policy: summarized
