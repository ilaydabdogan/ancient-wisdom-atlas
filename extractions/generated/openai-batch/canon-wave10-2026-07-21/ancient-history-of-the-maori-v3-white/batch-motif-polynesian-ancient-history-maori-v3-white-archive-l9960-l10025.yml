canonical_text:
  quote: ''
  summary: The passage recounts Mahi-ao-tea's forest march and encounters with enchanted
    trees, his reunion with a war expedition preparing to advance on Para-kaka-riki,
    a meal incident involving dried barracouta and the naming of a cave, a taboo verbal
    exchange between Moki and Turangi-po interpreted as spell and counter-spell, and
    Wha-kuku's scouting plan as the force approaches the coast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mahi-ao-tea travelled with a few followers from Okain's to Gough's Bay through
    forests.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the forests he encountered Te-aitanga-a-hine-mate-roa, described as a wild
    race thought to be enchanted black-pine trees, and he overcame and destroyed them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: He encountered Te-ti-atau-whete-ku, described as enchanted cabbage-trees that
    moved about and embraced each other like human beings.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: He also encountered Te-papa-tu-a-mau-heke, described as an enchanted broadleaf-tree.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: Mahi-ao-tea rejoined the expedition at Karuru, where the canoe was already
    drawn up on land and preparations were being made for an advance on Para-kaka-riki.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: At O-tu-tahu-ao, a leading chief presented dried barracouta for distribution;
    those nearest the stern received first portions, while those at the bows received
    only fine fragments.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wha-kuku reacted to the fragments by telling his companions to hold tight
    to the fish-dust and named the cave of their meal the Cave of Fish-dust Eating.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: During discussion of the attack plan, Moki told Turangi-po that he might eat
    the head of his Lady Paramount.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Turangi-po interpreted Moki's words as an attempt to cast a spell on him and
    answered Moki with the same statement.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The warriors regarded allusions to the sacred head of a person of rank as
    blasphemous.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Moki asked who would act as scout, and Wha-kuku volunteered.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Wha-kuku explained that a voice from high on the hill would mean the pa was
    guarded, while a voice from low down would mean it was not guarded.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: As Wha-kuku reconnoitred and the main body followed, the warriors saw several
    canoes anchored off the coast opposite the mouth of Long Bay.
  category: action
  evidence_refs:
  - ev:7
