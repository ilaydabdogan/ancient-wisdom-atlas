  text: Maru and Apa-rangi command the people in the pa to perform a haka so that
    Nga-ti-mamoe will look on from nearby hills.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: While the haka is taking place, Tare-wai comes from the forest to the beach,
    is seen and pursued by the enemy, and escapes into the pa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The elders in the pa order dogs killed for Tare-wai, and he eats the body
    of one dog without it being cut into joints.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Maru and Apa-rangi assemble the people into companies, challenge Nga-ti-mamoe
    to battle, and defeat them; the defeated flee to Puke-kura.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Te-rangi-a-moa sings a rebuke to the fugitives, drives them out of his fort,
    and they make another pa called Rangi-piki-kao.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After learning the only water places used by the enemy, Tare-wai lays an ambush
    there and kills lone water-carriers while leaving pairs unmolested.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tare-wai is seen at Taki-haruru by Nga-pa-teketeke and companions mending
    a canoe; he is pursued, escapes into his pa, and challenges the enemies to battle
    on the next day.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tare-wai asks his elders to kill Te-rangi-a-moa in revenge, and Maru kills
    Te-rangi-a-moa in a house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The next battle begins with single combats and then becomes a general engagement;
    Tare-wai calls that he has the first slain, and Nga-tama-kuao calls that he has
    the second.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: As the enemy flees, Tare-wai overtakes and fells enemies with his weapon until
    darkness on a winter day prevents further pursuit.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: On Tare-wai's return, the spirits of the slain hover near him or meddle with
    him, but they flee or are driven away.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: On the following day the slain are viewed lying about like reperepe fish thrown
