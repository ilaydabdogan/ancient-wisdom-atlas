canonical_text:
  quote: ''
  summary: Tare-wai signals to his allies from a tree, escapes into a fortified pa
    while a haka distracts the enemy, is provisioned with dog meat, and joins his
    allies in warfare against Nga-ti-mamoe. The enemies flee, are rebuked by Te-rangi-a-moa,
    establish another pa near scarce water sources, and Tare-wai ambushes lone water-carriers.
    Tare-wai later exposes himself on the beach, escapes pursuit, taunts his enemies,
    orders vengeance on Te-rangi-a-moa, and fights in the following battle with Nga-tama-kuao.
    He pursues and fells enemies until dark, encounters spirits of the slain, and
    later the dead are viewed like fish on the shore. A god of Whaka-taka-newha laments
    the defeat with a saying about a withheld battle-axe, and Te-whaka-taka-newha
    answers.
  language: English
  quote_policy: summarized
literal_observations:
