canonical_text:
  quote: ''
  summary: A genealogy from people at the extreme south traces origin to Awa-topa.
    Awa-topa and his brother Rauru build houses at the same time; Rauru finishes first,
    performs purification ceremonies, and announces a voyage. Awa-topa asks him to
    wait, Rauru refuses, and Awa-topa kills him. The tribe kills Awa-topa in revenge,
    leading three named families of the elder brother to secede to the South Island
    while the rest remain in the North Island. The passage also records claimed relationships
    with Waikato and Nga-puhi, then begins an account of a canoe of unnamed chiefs
    connected by the text to the origin of the Chatham Islanders.
  language: English
  quote_policy: summarized
