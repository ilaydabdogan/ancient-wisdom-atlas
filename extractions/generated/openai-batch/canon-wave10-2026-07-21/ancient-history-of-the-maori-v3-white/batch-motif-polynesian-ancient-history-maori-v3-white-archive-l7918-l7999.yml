canonical_text:
  quote: ''
  summary: The passage first recounts Raka-waha-kura assembling warriors, performing
    omen ceremonies, and killing Waro. It then gives genealogical and migratory traditions
    for Tane-nui-a-rangi, Rangi-tane, Tiki, Wha-tonga, Kahu-ngunu, Apa-related ancestors,
    Hamua, and Te-rangi-whakaewa, linking tribal and hapu names to ancestors, migration
    from Hawa-iki by canoe, settlement locations, and later divisions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raka-waha-kura took seventy warriors, each with a weapon, and the weapons
    were tied into one bundle and covered with a chiefly sitting mat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raka-waha-kura performed ceremonies to discover omens, saw omens connected
    with spears, man, and Waro's fear, then killed Waro, ending the war.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tane-nui-a-rangi is named as the ancestor of Rangi-tane at Hawa-iki, and the
    Rangi-tane tribe is said to take its name from Rangi-tane.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The descendants of Rangi-tane increased down to Wha-tonga, about the twentieth
    generation from Tane-nui-a-rangi.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tama-tea, Apa-nui, Apa-roa, Apa-tika, Apa-koki, and Apa-hapai-takitaki are
    described as contemporaries of Wha-tonga and as sharing Tane-nui-a-rangi as common
    ancestor.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tiki is described as descended from the upper heavens; because there was no
    wife for Tiki, a wife was fashioned for him from the soil of the earth, and this
    is said to be the source of Tane-nui-a-rangi.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wha-tonga, Kahu-ngunu, the Apa-named ancestors, and their people sailed from
    Hawa-iki in canoes to the North Island and landed at Tu-ranga.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The migrant groups had been at war in Hawa-iki and continued fighting during
    the ocean voyage until landing at Tu-ranga, where they separated.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tama-tea remained at Tu-ranga, and the Nga-ti-kahu-ngunu tribe is said to
    have sprung from his son Kahu-ngunu.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Wha-tonga and the Rangi-tane tribe traveled from Tu-ranga to Tamaki and Manawa-tu,
    where they settled in a district said to have had no inhabitants at that time.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some Rangi-tane went to Ara-paoa on Long Island in Queen Charlotte Sound,
    and their descendants are described as residing there with the Nga-i-tahu people.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Apa-hapai-takitaki and his people went to Rangi-tikei and lived there; the
    people of that place are called Nga-ti-apa from Apa, while some descendants of
    Apa remained at Tu-ranga.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the time of Hamua, son of Ue-nga-raho-pango and sixth generation from Wha-tonga,
    a division occurred and Hamua became progenitor and leader of a hapu called Hamua.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Rangi-tane remained intact until Te-rangi-whakaewa, fifth generation from
    Hamua; from him sprang another hapu called Nga-i-te-rangi-whakaewa, whose descendants
    are placed at Tamaki and Puehu-tai.
  category: relationship
  evidence_refs:
  - ev:10
