canonical_text:
  quote: ''
  summary: The passage recounts aftermath and renewed warfare involving Ue-nuku, Ta-wheta,
    Whati-ua, and their people. Hapopo is killed and his dying words become a proverb.
    Pai-mahutanga, daughter of Ta-wheta, is spared and later given as wife to Ue-nuku,
    while the slain are cooked and eaten. Ue-nuku then prepares another revenge expedition,
    taking ancestral sacred garments as armour. At Ta-wheta's coast, Ue-nuku's people
    capture Putua-ki-te-rangi, remove and roast his heart over a sacred fire, cover
    the heart and fire with the sacred garments, and Ue-nuku calls on the mist of
    Tiri-kawa. Darkness falls, Ta-wheta's people fight and kill one another, and after
    repeated commands to the mist the sea is seen covered with bodies and blood.
  language: English
  quote_policy: summarized
