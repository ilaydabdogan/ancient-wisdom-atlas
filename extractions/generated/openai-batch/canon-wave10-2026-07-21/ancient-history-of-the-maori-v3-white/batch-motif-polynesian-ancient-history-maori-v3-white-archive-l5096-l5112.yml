  summary: The passage identifies fern-root, Ariki-noanoa, as a god of Tumata-uenga.
    Cut hair is burned with fern-root; the roasted fern-root is kept as a protective
    charm. Rongo-marae-roa is said to remain disgusted with fern-root because of its
    bitter raw taste. A series of proverbs names bitter or astringent things, and
    the passage says the tongue warns humans of such harmful bitterness.
