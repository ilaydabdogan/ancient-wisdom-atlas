canonical_text:
  quote: ''
  summary: 'The passage recounts traditions about a great tide associated with Rua-tapu
    that divided land into islands, describes New Zealand geography in relation to
    Maui’s fishing-up of land, reports variant priestly accounts of Maui’s vessel
    and hook, and narrates Rua-tapu’s revenge after Ue-nuku insults his birth status:
    Rua-tapu builds a canoe, invites seventy high-ranking youths, sinks it, drowns
    many, and a survivor exchange involving Hae-ora and Paikea is followed by a proverb
    about Tanga-roa and shore vengeance.'
  language: English
  quote_policy: summarized
