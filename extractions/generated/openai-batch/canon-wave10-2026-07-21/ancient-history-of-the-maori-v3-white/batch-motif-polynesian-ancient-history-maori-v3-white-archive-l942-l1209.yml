candidate_motifs:
- id: motif:1
  label: lone survivor returns over the sea with marine aid
  taxonomy_refs:
  - return
  basis: Paikea says he will return to land by the aid of sea beings, escapes as the
    only one left, travels over the sea on an ancestor, and lands at Ahu-ahu.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage does not explain whether the marine aids and the ancestor
    are identical or distinct, so they are kept literal.
- id: motif:2
  label: bodily transmission of survival instructions
  taxonomy_refs:
  - wisdom
  - initiation
  basis: Hae-ora has Paikea bow down and blows instructions into his bowels before
    Paikea's escape and return to land.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage does not explicitly call this an initiation; the taxonomy
    link is a broad functional reading.
- id: motif:3
  label: future seasonal threat with mountain refuge for a remnant
  taxonomy_refs:
  - flood_and_renewal
  basis: Rua-tapu announces a future coming in the long winter nights or eighth moon
    and says the remnant should live on Hiku-rangi Mountain so that he and they escape
    destruction.
  evidence_refs:
  - ev:4
  confidence: low
  cautions: The passage names destruction and a mountain refuge but does not explicitly
    state that the destruction is a flood or describe renewal.
- id: motif:4
  label: rank and legitimacy insult after failed pursuit
  taxonomy_refs:
  - royal_legitimacy
  basis: Rua-tapu says that if he does not come, Paikea can call him a stray child
    of their parents and born of their father by a woman of no rank.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage preserves the insult but does not narrate the full social
    context of the legitimacy dispute in this excerpt.
- id: motif:5
  label: ritualized vengeance through heart and sacred fire
  taxonomy_refs:
  - sacrifice
  basis: Ue-nuku kills Taka-rita and the two men, removes Taka-rita's heart, broils
    it on a sacred fire, and chants a fire incantation.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The scene is framed as punishment for adultery; it is not explicitly described
    as an offering or sacrifice.
- id: motif:6
  label: sacred fire kindled by friction in an incantation
  taxonomy_refs:
  - fire
  basis: The incantation describes a holy fire newly kindled by friction and repeatedly
    calls for the fire to burn.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The available taxonomy list treats fire as a symbol rather than a motif
    family; this candidate is mainly symbolic.
