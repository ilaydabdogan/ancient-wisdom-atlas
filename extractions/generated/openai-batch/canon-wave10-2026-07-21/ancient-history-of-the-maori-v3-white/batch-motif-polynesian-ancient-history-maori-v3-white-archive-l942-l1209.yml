canonical_text:
  quote: ''
  summary: 'In the Rua-tapu and Paikea episode, Paikea says he will return to land
    with the aid of sea beings. Hae-ora transmits instructions to him and is then
    killed by Rua-tapu. Rua-tapu pursues Paikea, warns of a future return in the long
    winter nights or eighth moon, and says a remnant should live on Hiku-rangi Mountain
    to escape destruction. Paikea travels over the sea on an ancestor, chants, and
    lands at Ahu-ahu. The passage then begins another reading concerning Ue-nuku:
    Ue-nuku, a great chief, kills his wife Taka-rita and two men because of adultery,
    removes Taka-rita''s heart, broils it on a sacred fire at the carved centre-post
    of his assembly-house, and chants over the fire.'
  language: English
  quote_policy: summarized
