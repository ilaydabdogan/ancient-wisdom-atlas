canonical_text:
  quote: ''
  summary: The passage first gives named genealogical descents, then mentions a canoe
    wrecked near Wai-taki with named cargo. In the Tu-ahu-riri narrative, people travel
    to see related people and chiefs; Tu-ahu-riri invites visitors, secretly gathers
    a war-party, and signals an ambush after the visitors depart. Most of the party
    are killed, with a few enslaved. Chiefs at Moe-raki hear the news, assemble warriors,
    enter the pa at night, kill one man, take prisoners, and remove Ku-whare as an
    intended sacred first victim for Korako.
  language: English
  quote_policy: summarized
