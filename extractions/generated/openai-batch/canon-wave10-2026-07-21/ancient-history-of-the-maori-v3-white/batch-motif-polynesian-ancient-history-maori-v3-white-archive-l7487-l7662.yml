canonical_text:
  quote: ''
  summary: A captured high-ranking chief, Mahine-tu-ki-te-rangi, looks back toward
    his home and speaks a proverb, revealing his identity to enemies who then kill
    him. In revenge, Nga-ti-ira attack the pa at Puke-tawai. At that pa, the wife
    and children of Tu-te-aio-rangi are taken prisoner while Tu-te-aio-rangi escapes.
    Enemy warriors sing a long song intended to attract his attention and entrap him;
    the song includes images of battle, places, wind, water, birds, grief, escape,
    and the god of war.
  language: English
  quote_policy: summarized
