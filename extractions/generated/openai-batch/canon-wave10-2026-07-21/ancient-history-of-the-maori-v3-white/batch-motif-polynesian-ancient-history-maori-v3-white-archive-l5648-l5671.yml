  summary: The passage states that Kahu-kura and the people were supplied with good
    vegetable food. Pou-ranga-hua travels to Hawaiki after his brother-in-law when
    his canoe is gone, using two pet birds lent by the chief Rua-ka-panga. In Hawaiki
    he obtains seven varieties of kumara from two named cliffs; his kumara flourish,
    while those procured by his brothers-in-law do not grow.
