canonical_text:
  quote: ''
  summary: 'Kahu-ngunu performs feats of food gathering: he distributes a large bundle
    of food over a settlement, prepares for paua diving by observing shags, dives
    at low water to fill heavy nets with paua, and sends some paua as offerings to
    the gods. The people feast, praise him, contrast him with Tama-taku-tai, and give
    Tama-taku-tai''s wife to him; their descendants are named as ancestors of Ngati-kahu-ngunu.
    The passage then recounts Tama-tea''s ancestry and voyage from Hawaiki, his journey
    through named places, escaping pet lizards, Kahu-ngunu''s return after seeing
    sea-gulls, and Tama-tea''s placement of firebrand ends in the Moa-whanga River
    so they should become taniwhas.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kahu-ngunu ties all the roi into one bundle, carries it to the precipice Tawa-pata
    above the village, unties it, and lets it scatter throughout the pa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The settlement people collect, roast, and feast on the food, and praise Kahu-ngunu
    as a strong and able chief who can procure food for them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kahu-ngunu proposes collecting paua and instructs his companions to prepare
    flax ropes, nets, and sticks for prizing paua from rocks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kahu-ngunu watches shags diving, holds his breath while counting, and concludes
    that he can dive long enough to obtain much paua.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: At low water Kahu-ngunu swims to the farthest rock, dives, fills nets tightly
    with paua, and returns with some paua adhering to his body and head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The paua from Kahu-ngunu's body and head are taken to the sacred place as
    offerings to the gods; the heavy nets require assistance from neighboring pas
    before the people feast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After seeing Kahu-ngunu's feats, the people contrast him with Tama-taku-tai,
    take Tama-taku-tai's wife, and give her to Kahu-ngunu.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kahu-ngunu begets Kahu-kura-nui, Tu-puru-puru, Rangi-tu-ehu, Hiri-ao, and
    Huhuti, who are described as ancestors of principal Ngati-kahu-ngunu tribes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Rongo-kako is named as Tama-tea's father, and Tama-tea is said to have come
    from Hawaiki in a canoe called Taki-tumu or Horo-uta.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tama-tea travels by land near the coast; his pet lizard Tapu-te-ranga flees
    inland at Ahu-riri.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At Te-onepu, Tama-tea sets up a pole called Rakau-taonga to mark the place
    where Kahu-ngunu turned back after seeing and hearing sea-gulls.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: Tama-tea continues onward, loses another pet lizard called Poho-kura, retains
    one called Puke-o-kahu, and places unburnt firewood ends in the Moa-whanga River
    so they should become taniwhas.
  category: sequence
  evidence_refs:
  - ev:10
