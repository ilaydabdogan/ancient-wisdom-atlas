canonical_text:
  quote: ''
  summary: Hau-iti and his elder brothers make large fishing nets. Hau-iti's net produces
    the greater catch, and his elder brothers repeatedly plunder it. Hau-iti consults
    the priest Maru-ka-koa, who instructs him in ways to overcome a relative, including
    closed eyes and fire. Hau-iti returns, organizes his people, resists the plunderers,
    traps fish and men in a net, and later leaves his pa by night after his brothers
    summon a larger force. The brothers pursue him, and a battle occurs at Whanga-paraoa.
  language: English
  quote_policy: summarized
