- id: motif:2
  label: Wrecked vessel righted by binding and chant
  taxonomy_refs:
  - ark_vessel
  basis: 'Horo-uta is repaired after a mishap: it is bound with titoki wood, righted
    during a chant, dragged beyond the tide, mended, and resumes carrying kumara cargo.'
  evidence_refs:
  - ev:5
  - ev:6
