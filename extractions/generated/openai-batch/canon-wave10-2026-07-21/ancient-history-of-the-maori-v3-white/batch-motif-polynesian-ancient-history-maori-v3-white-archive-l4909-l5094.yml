canonical_text:
  quote: ''
  summary: 'The passage recounts the aftermath of the Horo-uta canoe''s wreck: preserved
    birds are carried and offered, some calabashes become stone landmarks, the canoe
    is righted and repaired through binding and chants, kumara cargo is reloaded and
    distributed at named places, and later ritual uses of kumara are explained in
    relation to gods, war, crop protection, and planting ceremonies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A messenger from those mending Horo-uta tells Awa-paka that the canoe has
    been mended, has sailed again, and will meet him at Wai-apu.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Awa-paka and his party eat some preserved birds at Tau-mata, name the hill
    after eating fat there, perform ceremonies and incantations, and offer a calabash
    named Toetoe as a thank-offering to the gods for Horo-uta's recovery.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Awa-nui, Horo-uta has already passed; the crew has left an anchor, baler,
    sinker, and kumara for future occupants of Wai-apu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A calabash of preserved birds left at Awa-nui turns into stone and is described
    as still visible.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other calabashes of preserved birds left between Wai-piro and Mata-ahu also
    turn into stone and are said to remain there.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Pawa's party cannot return to assist in mending Horo-uta and does not obtain
    a haumi for the canoe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Rangi-tu-roua rights the canoe by binding titoki wood around it and turning
    it over while a chant is performed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the chant ceases, the canoe recovers its upright position and is dragged
    beyond the tide for repair; another loud chant accompanies the dragging.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After Horo-uta is mended, the kumara cargo is put back on board, and kumara
    are left at several named places along the journey.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The leaving of kumara at the named places is given as the origin of words
    in a kumara-planting incantation used by descendants of Horo-uta and by some descendants
    of other canoes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The kumara is called Rongo-marae-roa and fern-root is called Ariki-noanoa;
    both are described as children of Rangi and Papa.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Rongo-marae-roa is ordained as god of Tu-mata-uenga, while Ariki-noanoa is
    assigned as food for people in time of war.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: When an enemy is coming to attack a pa, the inhabitants place kumara on the
    road, chant over them, and leave them there.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: If the enemy war-party comes near the ritually treated kumara, a panic caused
    by the incantation's power makes the war-party flee home.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Priests take kumara intended for planting to a stream, place them in it, and
    offer them to Kahu-kura, described as supreme god of crops.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: After preliminary ceremonies over some planting kumara, priests consult Mua;
    if Kahu-kura's small wooden image trembles or shakes, this indicates assent that
    gods, an enemy, or flood will not destroy the crop.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: After the favorable sign, the people put the whole crop into the ground.
  category: action
  evidence_refs:
  - ev:9
