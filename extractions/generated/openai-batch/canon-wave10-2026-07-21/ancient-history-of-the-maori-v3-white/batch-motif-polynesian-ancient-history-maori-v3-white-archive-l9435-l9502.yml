canonical_text:
  quote: ''
  summary: Tu-ahu-riri is identified by his birth-name as Kahu-kura-te-paku's grandson,
    which prevents a plan to cook him; Kahu-kura-te-paku directs him to exit through
    a window so tapu can be removed from the cooking materials. Tu-ahu-riri later
    retaliates against the people of Wai-mea by visiting when their stores are empty
    and consuming their food. After the house he had occupied burns, wild cabbage
    grows on the tapu site; hungry people eat it and die. The passage then introduces
    Hika-oro-roa's dawn attack on Tu-ahu-riri's pa, Turuki's shame after a taunt,
    and Tu-te-kawa's tactical assault from another side.
  language: English
  quote_policy: summarized
