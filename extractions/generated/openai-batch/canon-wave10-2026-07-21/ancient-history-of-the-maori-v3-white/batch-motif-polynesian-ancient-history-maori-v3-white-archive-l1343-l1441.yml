canonical_text:
  quote: ''
  summary: Ta-wheta and his party are welcomed by Ue-nuku with food, while the narration
    states that they intend to murder and eat Ue-nuku and his tribe. Ta-wheta falsely
    says the children and young people are safe at play. Rongo-ua-roa, wounded and
    hidden near toetoe grass, is found by female cooks and reports the massacre. Ue-nuku
    has him brought in, first taking him to the tuahu for sacred ceremonies involving
    blood and an incantation. Ue-nuku then confronts Ta-wheta and publicly reveals
    Rongo-ua-roa as the only survivor.
  language: English
  quote_policy: summarized
