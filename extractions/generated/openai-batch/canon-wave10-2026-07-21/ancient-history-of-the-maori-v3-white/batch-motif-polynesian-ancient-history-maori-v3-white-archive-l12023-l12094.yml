canonical_text:
  quote: ''
  summary: 'The passage recounts a sequence in the Kai-huanga feud: after an earlier
    attack on Wai-rewa is thwarted, Kai-a-poi warriors kill Iri-toro rather than return
    without a victim. Tau-nunu, Iri-toro''s kin, avenges him by secretly attacking
    Whaka-epa and killing its people. Kai-a-poi then allies with Tai-a-roa and armed
    men, attacks Wai-rewa, kills several named people, pursues fugitives in canoes,
    and takes part in a cannibal feast remembered as especially atrocious because
    of close kinship between the parties. The expedition then moves onward, where
    scouts kill the elderly chief Te-ha-nui-o-rangi while his companions sleep nearby.'
  language: English
  quote_policy: summarized
