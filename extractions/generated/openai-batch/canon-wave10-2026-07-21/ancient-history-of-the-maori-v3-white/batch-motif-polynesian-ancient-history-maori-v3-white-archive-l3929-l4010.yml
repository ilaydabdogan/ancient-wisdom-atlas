canonical_text:
  quote: ''
  summary: The passage gives accounts of Tama-tea-pokai-whenua, his descent from Rongo-kako
    and Maui, his canoe arrival from Hawaiki, his travels through named places, the
    escape of pet lizards, markers left in the landscape, Kahu-ngunu's return because
    of longing stirred by sea-gulls, a song by Tama-tea, and a variant Nga-ti-mahuta
    itinerary. A preceding fragment states that a canoe named Ua-piko turned into
    stone.
  language: English
  quote_policy: summarized
