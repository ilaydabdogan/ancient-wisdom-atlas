  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tama-tea asked Kahu-ngunu whether he felt love for home; after Kahu-ngunu
    spoke of regret, Tama-tea said he was right to go back, and Kahu-ngunu returned
    while Tama-tea continued.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: At a great mountain another pet lizard, Poho-kura, escaped; Tama-tea still
    had another pet lizard, Puke-o-kahu.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the Moa-whanga or Moe-whanga river, Tama-tea left the ends of his firebrands
    on the river bank so that they might turn into water-gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Whanga-nui, Tama-tea rested, combed his hair, and tied it in tufts, which
