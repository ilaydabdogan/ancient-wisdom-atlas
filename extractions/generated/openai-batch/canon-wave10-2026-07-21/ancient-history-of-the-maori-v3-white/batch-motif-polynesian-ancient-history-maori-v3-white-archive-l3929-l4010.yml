- id: obs:2
  text: Rongo-kako is named as the father of Tama-tea-pokai-whenua, who is described
    as progenitor of tribes on Ao-tearoa and Wai-pounamu.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tama-tea-pokai-whenua is said to have come from Hawaiki in the canoe Taki-tumu,
    also called Horo-uta, and to have landed at Tu-ranga on the fish pulled up by
    Maui.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tama-tea travelled along the sea-coast to Ahu-riri, where his pet lizard Tapu-te-rangi
    fled into the harbour.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the Rua-hine Mountains he stuck up his staff Raka-taonga at Te-onepu to
    mark where Kahu-ngunu left him and returned to Ahu-riri.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sea-gulls followed Tama-tea and Kahu-ngunu along the Rua-hine and hovered
