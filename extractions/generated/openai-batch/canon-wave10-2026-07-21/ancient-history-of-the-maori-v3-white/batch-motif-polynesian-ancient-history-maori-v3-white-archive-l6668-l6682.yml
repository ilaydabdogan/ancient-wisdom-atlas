  summary: The passage introduces a chief, his wife, and the wife's male cousin living
    together. The cousin snares birds for food, while the husband and wife remain
    at home. Each day the husband takes the choice fat birds and leaves lean birds
    for the cousin who caught them. The cousin sets these aside and secretly eats
    them by the light of the cooking-fire; the final sentence is incomplete after
    noting his eyes were made sore there.
