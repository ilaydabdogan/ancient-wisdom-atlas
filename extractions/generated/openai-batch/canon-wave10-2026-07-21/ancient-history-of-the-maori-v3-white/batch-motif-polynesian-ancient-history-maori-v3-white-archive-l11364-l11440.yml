canonical_text:
  quote: ''
  summary: A party of young Ngā-i-tahu chiefs arrives at Kai-apoi, learns the names
    of localities, and divides unallotted land. Highly valued kākāpō-skin preserves
    motivate claims to mountain peaks. Several chiefs claim peaks for daughters’ garments,
    while Moki’s servant uses a tree lookout and a pretext about firewood to identify
    Kura-tawhiti, which Moki claims and whose hunting rights are recognized for his
    descendants. The passage then recounts renewed hostilities against Ngāti-mamoe,
    Moki’s expedition and destruction of a pā, and the pursuit and spearing of the
    aged Tu-te-kawa by an avenger of blood despite an attempted kinship shield.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A party of young chiefs known as Wharaunga-pu-raho-nui arrives at Kai-apoi;
    they include sons of principal Ngā-i-tahu chiefs and some sons of Tura-kau-tahi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tura-kau-tahi had selected Kai-apoi as his residence and was remembered for
    hospitality, which he enjoined his descendants to practice.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young chiefs obtain locality names from knowledgeable people and divide
    the unallotted country among themselves; the narrator presents this as a method
    by which Māori acquired title to land.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kākāpō skins are described as highly prized, and each member of the party
    wants a preserve of those birds.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Near Whata-a-rama, Mold, Tane-tiki, and Hika-tutae each claim a peak so that
    kākāpō skins may be made into garments for their daughters.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Moki’s servant tells him to wait, climbs a tree, and says he is only breaking
    dry branches for fires.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The servant is actually looking for the mountain said by Tura-kau-tahi to
    have abundant kākāpō; he identifies Kura-tawhiti, claims it, and Moki answers
    with a collective claim.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The claim to Kura-tawhiti is recognized by the other explorers, and Moki’s
    descendants are said to have held the exclusive right to hunt kākāpō there ever
    since.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hostilities against Ngāti-mamoe are renewed after the young chiefs arrive
    and add new influence to Ngā-i-tahu war councils.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: An expedition commanded by Moki travels in the canoe Maka-whiua against Para-kaka-riki
    and destroys that pā.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Moki proceeds to Wai-kakahi, where the aged Tu-te-kawa is living; Tu-te-kawa
    is identified as the one who killed his grandfather’s wives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Tu-te-kawa had settled first at Oko-hana for eels, later moved to Wai-hora,
    built a pā at Wai-kakahi, and had a son who built another pā at Tau-mutu.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Although Tu-te-kawa thinks himself safe among allies and far from enemies,
    an avenger of blood is already pursuing him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The first warning of danger to the Wai-kakahi people is Moki’s shadow falling
    across the threshold.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:15
  text: The old chief is found coiled in mats in a corner of his house; Moki and his
    brothers try to shield him, but the avenger thrusts a spear between them and into
