literal_observations:
- id: obs:1
  text: Taranga-kahu-tai calls for Taraia to stand forth; Taraia is wearing a feather
    mat, and Taranga-kahu-tai threatens to eat Taraia's heart.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Taraia repeats a Tipi-hou-mea incantation over a stone, throws it at Taranga-kahu-tai,
    and knocks the feather plume or head-dress from his head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the battle, Hine-pare sees her side draw back, takes the calabash in
