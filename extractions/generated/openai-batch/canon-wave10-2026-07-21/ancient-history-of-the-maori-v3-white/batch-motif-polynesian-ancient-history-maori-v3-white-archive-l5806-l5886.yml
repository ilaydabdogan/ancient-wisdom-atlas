    curse and lament.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hine-pare's brothers hear the crash and lament, think a skull of one of their
    people has been struck, rally under Taraia, charge again, and kill Taranga-kahu-tai,
    Ra-kai-weriweri, and others; Wai-kari and some of Ra-kai-te-hiku-roa's party also
    die.
  category: sequence
  evidence_refs:
  - ev:2
