  summary: The passage recounts a battle episode involving Taraia and Taranga-kahu-tai,
    Hine-pare breaking a calabash containing gods, a renewed charge and killings,
    divination by toe-toe lots over Ra-kai-weriweri's body, later territorial movements
    and marriage alliance, and the opening of a story about a trained tui that recites
    planting incantations.
  language: English
