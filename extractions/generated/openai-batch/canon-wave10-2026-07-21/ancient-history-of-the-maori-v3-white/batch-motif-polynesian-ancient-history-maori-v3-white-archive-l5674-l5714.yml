canonical_text:
  quote: ''
  summary: A chapter opening dirge expresses distress, ominous foreboding, and desire
    for solitude. The prose narrative introduces Tara-ki-uta and Tara-ki-tai, twin
    children of Kahu-tapere and Rongo-mai-tara. The Nga-ti-kahu-ngunu are said to
    have been driven from Turanga because of the murder of these twins. Their names
    are glossed as the inland side and the side toward the sea. Rakai-te-hiku-roa
    becomes angry because preserved birds in calabashes are given to the twins rather
    than kept for his son Tu-purupuru, and he determines to destroy them. The passage
    also gives Rakai-te-hiku-roa's genealogy back to Kahu-ngunu and to voyagers from
    Hawaiki in the canoe Taki-tumu.
  language: English
  quote_policy: summarized
