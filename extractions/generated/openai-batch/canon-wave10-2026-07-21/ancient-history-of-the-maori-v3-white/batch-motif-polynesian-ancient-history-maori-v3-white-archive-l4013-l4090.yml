canonical_text:
  quote: ''
  summary: The passage recounts Tama-tea-pokai-whenua travelling through named places,
    planting seeds, bending a stone to moor his canoe, and drowning at a river fall.
    A Nga-i-tahu account says his three wives deserted him, causing him to sail around
    the islands searching for them while he and Kupe named coastal features. At Ara-hura
    he fails to recognize his wives in enchanted stones after their canoe has capsized
    and its crew has become stones. His servant Tumuaki violates tapu while cooking
    birds and is transformed into a mountain; the wives’ bodies are later said to
    have become greenstone. A following Nga-ti-mahuta section introduces E-ongo-kako,
    Tama-tea, Whaene, and Kahu-ngunu, contrasting Whaene’s selfish food-taking with
    Kahu-ngunu’s fishing and distribution.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tama-tea travels through named places, combs and ties up his hair at Whanga-nui,
    and gives a place-name connected with that act.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He paddles up the Whanga-nui River, throws Phormium tenax and kotukutuku seeds
    onto a cliff, and the seeds grow beneath trees.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At O-maka he bends a stone so he can moor his canoe, and the place is named
    Te-kowhatu-piko, meaning bent stone in the passage gloss.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: After reaching Tau-po, he takes a canoe down the Wai-kato River, is carried
    over a fall, and drowns.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Nga-i-tahu account, Tama-tea is deserted by three named wives and sails
    around the islands searching for them; he and Kupe are credited with naming rivers,
