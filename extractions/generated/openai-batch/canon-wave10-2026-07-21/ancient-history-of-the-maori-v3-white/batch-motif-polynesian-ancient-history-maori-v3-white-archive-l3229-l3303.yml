canonical_text:
  quote: ''
  summary: A woman gathering bedding material for expected guests is insulted by the
    two arriving men, while two pet miro-miro birds witness the act and report it
    to their master. Her husband, Timu-whakairihia, receives proof of the insult,
    ritually degrades the visitors at the doorway, and avenges his wife through a
    shame-producing meal. The visitors, Rua-wharo and Tu-pai, seek power to call whales
    and use that power against Ue-nuku. Ue-nuku performs counter-ceremonies. Timu-whakairihia
    teaches sacred ceremonies and incantations in a sacred house; Rua-wharo errs in
    recitation, while Tu-pai repeats the lessons correctly after listening. Timu-whakairihia
    gives tests of the acquired power, and after leaving Tu-pai proposes killing him;
    Rua-wharo refuses, and they instead kill an oii bird as a first offering to the
    gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman went to get grass for sleeping mats for two expected guests and met
    two men who took liberties with her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two pet miro-miro birds named Hine-pipi-wai and Hine-papa-wai accompanied
    the woman, witnessed the insult, and went home to inform their master.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman reported the meeting to her husband and produced strings from one
    of the men's garments as proof of the insult.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Timu-whakairihia placed the garment strings on the upper sill of the door
    so that the visitors' heads would pass beneath them, lowering their chiefly dignity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The visitors entered the house, ate cooked fish, and were made ashamed; Timu-whakairihia
    stated that evil had overtaken them as punishment for the insult.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tu-pai said that he and Rua-wharo had come to obtain power to call whales
