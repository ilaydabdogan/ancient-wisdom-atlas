    stomach if he came for blubber.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Timu-whakairihia said they could return home with gravel that would draw whales
    near the coast.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ue-nuku, informed of the purpose of Rua-wharo and Tu-pai's visit, performed
    ceremonies and chanted incantations to prevent them from obtaining the desired
    power.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Rua-wharo and Tu-pai stayed with Timu-whakairihia and were taken to the sacred
    house for instruction in sacred ceremonies and incantations; only Timu-whakairihia
    and Rua-wharo entered at first, while Tu-pai guarded outside.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After Timu-whakairihia taught Rua-wharo all day, Tu-pai entered at sunset
    to listen; Rua-wharo made a mistake in recitation, but Tu-pai repeated the lessons
    correctly.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Timu-whakairihia instructed them to test the power of the lessons by killing
    a dog or bird and by making a great tree wither or fall.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: After departing, Tu-pai suggested killing Timu-whakairihia, but Rua-wharo
    refused to kill their elder brother and teacher; Tu-pai then suggested killing
    an oii as a first offering to the gods.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: They killed an oii near Timu-whakairihia's settlement; Timu-whakairihia heard
