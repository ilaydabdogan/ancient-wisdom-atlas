canonical_text:
  quote: ''
  summary: Rongo-i-tua visits the Kahui-tupua, who live on ti-root, and demonstrates
    a preferred dried food softened in water. He later measures a drifted tree to
    make named canoes. In one canoe, the Kahui-tupua travel with Rongo-i-tua to Hawa-iki,
    raid a house at night, capture named men whose names are associated with kumara
    varieties, and depart while shore people chant incantations over blood and slain
    companions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage is headed “Rongo-i-tua and Kahui-tupua” and is attributed to Nga-i-tahu.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rongo-i-tua is said to have come from Hawa-iki and landed where the Kahui-tupua
    lived on ti-root.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A later sentence says Rongo-i-tua came from Ao-tea-roa and that his appearance
    was like a rainbow.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Kahui-tupua prepared old and mouldy food for Rongo-i-tua, and he did not
    eat it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rongo-i-tua requested water in a calabash, took kao from his waist-belt, softened
    it in the water, and gave it to people in the house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The people liked the taste of the food and asked what it was; Rongo-i-tua
    said it was the food people ought to live on and that ti-root was not as good.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The next day Rongo-i-tua saw a tree drifted from Hawa-iki, measured it, and
    planned to cut it into two lengths for two named canoes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: One canoe was made by the Kahui-tupua, who embarked in it with Rongo-i-tua
    as leader and went to Hawa-iki.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Hawa-iki the crew went ashore while Rongo-i-tua stayed aboard; at night
    the Kahui-tupua surrounded a house and captured people of Kawakawa-pakiaka.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The named captives are described as men, and their names are said to be given
    to different sorts of kumara.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Rongo-i-tua asked where the slain were; the crew answered that they were lying
    in a heap, and Rongo-i-tua said the principal family had escaped.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: After embarking and going some distance to sea, the voyagers heard shore people
    shouting and chanting sacred incantations over the blood of Kahu-kura and his
    slain companions.
  category: sequence
  evidence_refs:
  - ev:9
