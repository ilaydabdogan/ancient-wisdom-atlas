  quote: ''
  summary: A migration account explains that Tapu, a Kahu-iigunu chief, heard praise
    of Ra-kai-tau-wheke's house at Ha-taitai and jealously compared it with his own
    kopapa canoe. Ra-kai-tau-wheke interpreted Tapu's words as a curse. When Tapu
    later visited Ha-taitai with friends, Ra-kai-tau-wheke killed Tapu but spared
    the companions. Fearing vengeance from Tapu's tribe, Nga-i-tahu began to abandon
    Ha-taitai, though the provided passage breaks off mid-word.
