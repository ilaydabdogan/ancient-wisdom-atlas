canonical_text:
  quote: ''
  summary: The passage opens with a revenge chant concerned with bloodshed, a spear
    at dawn, Rangi's bleeding nose, and the tide of Paoa. In a Ngā-i-Tahu account,
    Rongo-i-tua brings kumara from Hawaiki in his waist-belt after slaying the Po-tiki
    sub-tribe and taking kumara from them; survivors escape into trees and some flee
    to the sky to live with A-niwa-niwa. In a Ngā-i-Porou account, Rongo-i-tua breaks
    a drying stage for kumara at Hawaiki, leaves by sea on a log carried by wind,
    reaches O-tea-rawa and the Kahui-tupu settlement, rejects local foods, secretly
    mixes dried kumara from his belt with water in calabashes, gives it to the people,
    points toward the sunrise heavens as the kumara source, and directs them to make
    a canoe from a tree. They make the canoe Arai-te-uru and embark to obtain kumara.
  language: English
  quote_policy: summarized
