canonical_text:
  quote: ''
  summary: The passage gives genealogical notes on hapu descent and then opens the
    account of Tare-wai. It describes two rival stockades, their chiefs and warriors,
    a fishing dispute in which Whaka-taka-anewha uses incantations to raise a storm,
    failed attempts by the opposing side to calm the sea, the disabling of canoes,
    a restrained response to calls for revenge, and the beginning of a house-building
    episode in which Whaka-taka-anewha's god objects to inadequate axes and warns
    of death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening paragraphs connect named persons and hapu through descent, including
    Kauwhata as descended from Tane-nui-a-rangi, Wehiwehi as the source of Nga-ti-te-ihiihi,
    and E-auru as progenitor of Nga-rauru.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Two stockades are named: Puke-kura, owned by Ka-i-tahu, and Papa-nui, owned
    by Nga-ti-mamao.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Maru and Te-apa-rangi are named as head chiefs at Puke-kura, Tare-wai as its
    great warrior, Rangi-amoa as head chief at Papa-nui, and Whaka-taka-anewha as
    another leader there.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Whaka-taka-anewha goes out to fish on a calm sea, and people from Puke-kura
    infer that his anchored spot must have many fish.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Whaka-taka-anewha uses incantations to cause a storm that prevents the men
    of Maru and Apa-rangi from going out to fish.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The men of Maru and Apa-rangi chant incantations and perform ceremonies to
    calm the storm, but the storm continues and they return with their fishing gear.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: On a later attempt, they collect moss and kelp, roast them in a brushwood
    fire, scatter the ashes on the sea, but the sea remains too rough for fishing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: After the failed attempt, they break the fastenings holding the side-boards
    of the canoes, leaving the canoes unfit for sea use.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Whaka-taka-anewha refuses his people's request to kill those who disabled
    the canoes, saying the canoes can be mended because they have hands.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Whaka-taka-anewha later reflects on the insult, decides to build a house,
    orders timber to be shaped, and his god objects to the use of common and small
    axes, saying they will cause death.
  category: sequence
  evidence_refs:
  - ev:9
