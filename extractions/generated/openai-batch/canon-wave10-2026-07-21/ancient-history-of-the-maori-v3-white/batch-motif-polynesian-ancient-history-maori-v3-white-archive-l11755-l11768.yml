canonical_text:
  quote: cooked and ate the heretical teacher
  summary: 'Under the heading of the continued Kai-huanga war, Te-wera is said to
    have used an extreme method to stop a heretical teacher''s doctrine and spirit
    from surviving: he prepared an oven, blocked the teacher''s bodily openings, and
    cooked and ate him. The passage then states that later Nga-i-tahu history until
    the taking of Kai-a-poi by Te-rau-paraha in 1827 repeated, on a smaller scale,
    earlier scenes from the Nga-i-tahu struggle with Nga-ti-mamoe.'
