  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the wreck, Horo-uta is made seaworthy again, the cargo is replaced,
    and the crew sails along New Zealand's east coast leaving kumara at landing places.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: When Kahu-kura lands in New Zealand, he finds Toi and Toi's people living
    there; Toi's people cook local foods for Kahu-kura and his friend, and Kahu-kura's
    people cook food brought from Hawa-iki in return.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Rongo-i-amo pours dried kumara from his waist-belt; it is placed in seventy
