canonical_text:
  quote: This canoe was that in which the first kumara was brought to these islands
    from Hawa-iki.
  summary: The passage recounts Horo-uta as the ancestral canoe associated with bringing
    kumara from Hawa-iki to New Zealand. Kahu-kura warns the crew not to mingle Rongo-marae-roa,
    the kumara god, with Ariki-noanoa, the fern-root god. After fern-root is brought
    aboard, Rongo-marae-roa causes a storm and the canoe is upset, then repaired,
    and kumara is left along the east coast. A second account describes Kahu-kura,
    Toi, Rongo-i-amo, food exchange, tasting of dried kumara, and the decision to
    bring kumara by Horo-uta from Hawa-iki.
  language: English
  quote_policy: quoted
