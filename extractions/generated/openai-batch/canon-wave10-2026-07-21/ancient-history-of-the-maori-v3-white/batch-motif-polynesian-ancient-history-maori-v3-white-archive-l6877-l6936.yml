  quote: ''
  summary: A nursery-song or lullaby addresses a child, invites the child to travel
    through named places, instructs the child to declare a sky-related name so noble
    birth will be recognized, invokes descent from Te-wai-rere-wha and Whaka-tau-potiki,
    describes an ancestress welcoming and adorning the child’s sacred head with bird
    plumes, and recalls ancestors who sailed near Raukawa Sea and paddled back to
    old Hawa-iki.
