canonical_text:
  quote: ''
  summary: The passage recounts that Te-puhi-rere’s atua asked for eel on its shrine
    before a journey. His wife gave only a small thin eel, angering the atua, which
    avenged the slight by allowing Te-puhi-rere and companions to proceed unwarned
    into an ambush near Kai-a-poi. Hape and Te-puhi-rere were killed, while some escaped
    into a swamp and found shelter. Later, survivors took and used the dead chiefs’
    mats, provoking Tama-i-hara-nui to avenge the insult by attacking refugee settlements
    and taking captives. Two runaway prisoners were brought before Tau-pori, who threatened
    them for passing him by, but their replies soothed him and their lives were spared.
  language: English
  quote_policy: summarized
