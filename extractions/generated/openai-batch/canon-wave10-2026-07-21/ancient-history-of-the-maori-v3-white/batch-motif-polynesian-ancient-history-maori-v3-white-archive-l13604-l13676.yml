canonical_text:
  quote: ''
  summary: 'The passage recounts retaliatory warfare among Middle Island tribes: Nga-i-tahu
    revenge against Nga-ti-mamoe, the survival of a small fugitive remnant, conflicts
    involving Nga-ti-tu-mata-kokiri and Nga-ti-apa, a failed crossing to Kapiti, and
    a later Nga-i-tahu revenge expedition in which two allied parties nearly fight
    each other through mistaken identity.'
  language: English
  quote_policy: summarized
literal_observations:
