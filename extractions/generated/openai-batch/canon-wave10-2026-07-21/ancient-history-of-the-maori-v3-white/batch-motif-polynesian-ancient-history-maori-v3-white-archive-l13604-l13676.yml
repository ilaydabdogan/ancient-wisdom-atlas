  text: Messengers were sent to other sections of Nga-i-tahu to announce the fate
    of Tara-whai and his party and to urge immediate revenge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nga-i-tahu groups joined together, attacked Nga-ti-mamoe, and indiscriminately
