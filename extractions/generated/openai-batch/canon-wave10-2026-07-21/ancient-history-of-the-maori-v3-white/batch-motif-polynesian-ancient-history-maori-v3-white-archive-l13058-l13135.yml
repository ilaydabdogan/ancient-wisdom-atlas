canonical_text:
  quote: "“Under the cover of the smoke the Nga-i-tahu entered, and a general massacre
    ensued.”"
  summary: The passage recounts retaliation for Manawa’s killing and cooking. Kauae,
    delayed behind the war party, pursues by canoe, captures an enemy chief, and prevents
    the captive from being spared by mutilating him and invoking Manawa’s death. The
    Nga-i-tahu then besiege a Nga-ti-mamoe pa. Tu-te-rangi-apiapi enters the pa under
    the appearance of peace negotiations and, when a north-westerly wind blows, sets
    fire to thatch with a red-hot stone; smoke allows the Nga-i-tahu to enter and
    massacre the inhabitants. The passage then summarizes Nga-ti-mamoe retreats and
    later defeats.
  language: English
  quote_policy: quoted
