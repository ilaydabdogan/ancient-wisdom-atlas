canonical_text:
  quote: ''
  summary: Kahu-ngunu dives into the sea with a net to gather paua and provides a
    feast, eating only the roe himself. A domestic dispute involving Tama-taku-tai
    and Rongo-mai-wahine leads Rongo-mai-wahine to leave Tama-taku-tai and take Kahu-ngunu
    as husband; their children and her earlier children are named. Tama-tea travels
    from Tauranga with followers, suffers hunger, names places after events on the
    route, and names Hine-rau-wiri in honor of Kahu-ngunu's fish-net. Later, Tama-tea
    and his son Rangi-nui miss each other while traveling by different routes; Tama-tea
    dies in sorrow. The excerpt ends with Rangi-nui at a house-building scene involving
    Ha-moko-rau and Tama-tea-a-moa.
  language: English
  quote_policy: summarized
