canonical_text:
  quote: ''
  summary: The passage gives a fragment about slain spirits and then narrates how
    Whaka-taka-newha prevents a fishing expedition with incantations, invites people
    of Maru and Apa-rangi to collect reeds for a house, feasts them, and attacks them.
    Tare-wai is captured but escapes, later returns by night to recover his whalebone
    weapon, heals in the forest, and takes revenge by ambushing solitary water-carriers
    near a stream.
  language: English
  quote_policy: summarized
