canonical_text:
  quote: ''
  summary: An introductory song presents an old man addressing youths who mocked his
    grey hair, saying he must travel a road they too will tread and that age and death
    are near. The narrative then says Ao-tea-roa was fished up by Maui and called
    the Fish of Maui. Maui left Kui in charge of the land, and Nga-ti-kui descend
    from Kui. After many years, Tutu-mai-ao voyaged from across the ocean, landed
    on the Fish of Maui, killed and dominated the resident people, intermarried with
    them, and the people of Kui were eventually annihilated; Kui went beneath the
    earth to live there. The final sentence is cut off in the supplied excerpt.
  language: English
  quote_policy: summarized
