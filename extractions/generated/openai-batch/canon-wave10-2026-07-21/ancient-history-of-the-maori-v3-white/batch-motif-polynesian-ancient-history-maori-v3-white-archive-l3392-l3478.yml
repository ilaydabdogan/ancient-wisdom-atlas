canonical_text:
  quote: ''
  summary: The passage describes the sacred canoe Taki-tumu among other sea-crossing
    canoes, its voyage and settlement movements, the use of homeland earth and gravel
    in ritual possession of Te-mahia, a stranded whale as a settlement sign, conflicts
    involving Rua-wharo, his son, and descendants, a storm raised by incantation,
    and a later plot by Rua-wharo and Tu-pai to kill Ira that Paikea condemns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several named canoes are said to have crossed the sea; unlike the others,
    Taki-tumu is described as entirely sacred.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The crew of Taki-tumu lived on fish caught during the sea voyage, which is
    given as a reason for the canoe's fame.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Taki-tumu landed at Muriwhenua and later sailed along the east coast looking
    for a place resembling Te-mahia-mai-tawhiti, a place in the old home across the
    sea.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the place identified as Te-mahia, the voyagers examined the land, judged
    it not exactly like the old Mahia, but nevertheless took possession of it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Earth and gravel from the beach of Te-mahia-mai-tawhiti had been kept in a
    basket; after ceremonies and incantations, the voyagers poured it into the sea.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A whale was found stranded on the shore the next morning, fulfilling the mother's
    instruction that Rua-wharo and Tu-pai should settle wherever they found such a
    whale.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Rua-wharo beat his son Ngotu-a-rangi, after which the son left, took a wife,
    and begat Rangatira.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Rangatira died before Rua-wharo reached Ahu-riri; Rua-wharo and his son cast
    the corpse into the harbour, and Rua-wharo left mussels as food for the district
    in honour of the child.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: After refusing to return with his father, Ngongo-tu-a-rangi performed rites
    and incantations to bring winds against Rua-wharo's canoe, but Rua-wharo escaped
    the storm because he also knew how to command the elements.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Rua-wharo later lived at the south end of the North Island and left the Te-mahia
    district for his children called Mati-u and Makaro, also described as names of
    two islands in Port Nicholson.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Rua-wharo and Tu-pai planted kumara at Te-mahia with the intention of killing
    Ira and eating him at a kumara feast for Paikea.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Paikea condemned the plan to kill Ira, calling Ira their elder brother and
    warning against carrying old wrongs from Hawa-iki into the new land.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: After the condemned murder plan, Rua-wharo and Tu-pai performed rites and
    incantations to prevent evil from falling on them and returned to several named
    places; Taki-tumu was kept at the south end of the North Island.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The stated reason for Rua-wharo and Tu-pai's wish to kill Ira is that Rua-wharo
    had been thrown into the body of a fishing-net and sought revenge for the insult.
  category: relationship
  evidence_refs:
  - ev:12
