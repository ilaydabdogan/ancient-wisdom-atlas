canonical_text:
  quote: ''
  summary: Whare-patari prepares a marked tawa sapling with twelve divisions, places
    it in a house before the fire, and before dawn chants an incantation concerning
    seasonal knowledge. The chant invokes winds, dawn, red sky, prolific season, flowers,
    birds, and the failure of false incantations. After the chant, the people recognize
    him as the famed knowledgeable man and ask him about the number of months in the
    year. He gives them the marked sapling; they count twelve divisions and question
    the excess over their reckoning of ten months. He answers by analogy to the feathers
    in birds' wings and states that the year has two more months than ten.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: He went into the forest, obtained a young tawa sapling, pinched off bark in
    places to make it speckled, and marked it into twelve divisions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He set the marked sapling upright in the house before the fire and then went
    to sleep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Early in the morning, while it was still dark, he chanted an incantation described
    as showing his knowledge of the seasons of the year.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The incantation includes images of faint light, first life, procreative power,
    heaven heaving, winds sleeping, dawn on the ocean-face, long dark nights, and
    red brightness over sky, earth, coast, and the aged.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Within the chant, Whare-patari is named as the enchanter of the winds and
    is asked to say when the warm, calm, prolific season will be.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The chant gives seasonal signs including the blooming of kowhai and the voices
    of birds such as toriwai, pigeon, and miromiro.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The chant addresses a man of evil deeds and false incantations and declares
    that his acts and incantations should fail and turn back on him by Whare-patari's
    power.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: He chanted before people who had not recognized him and ended the chant by
    inserting his own name in the final line.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The people asked whether he was Whare-patari and then expressed shame because
    they had heard of his name and great knowledge but had not recognized him in person.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some people proposed questioning him so that he might teach them some of his
    wisdom, and they decided to ask how many months he said were in the year.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When asked about the months in the year, he gave them the marked tawa sapling;
    they counted twelve divisions and said there were two more marks than they allowed
    for the months in a year.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: He answered that birds have more than ten feathers in each wing and that likewise
    there are two more months than ten in the year.
  category: speech
  evidence_refs:
  - ev:9
