canonical_text:
  quote: ''
  summary: The passage recounts pursuit after a leader’s death, the killing of Upoko-hina
    and three children by his kinsman Tama-i-hara-nui, the aftermath of the O-rehu
    slaughter and Kai-huanga feud, later refuge settlements at Panau and nearby bays,
    and a journey toward Kai-a-poi marked by conflicting warnings from familiar spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the Tan-mntu people saw that their leader was killed, they fled, and
    the speaker’s side pursued and killed them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Upoko-hina, described as a first cousin of Tama-i-hara-nui, tried to escape
    while carrying one child and leading two others.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Upoko-hina begged the pursuing man not to kill him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Te-whakatu-ka ordered that Upoko-hina be kept for him as payment for Toko-maru,
    in order to avenge an insult to Te-rehe and himself.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tama-i-hara-nui called out to spare his cousin; Upoko-hina sat down, and pursuers
    stood around him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tama-i-hara-nui rubbed noses with Upoko-hina and each child, then killed Upoko-hina
    and the children with a hatchet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tama-i-hara-nui said he would otherwise have spared them, but that family
    honour required their deaths at his hands rather than allowing Te-whakatu-ka to
    claim he had slain or spared them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The slaughter at O-rehu was described as very great, followed by cannibal
    feasts lasting several days, and as the last great encounter of the Kai-huanga
    feud.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tau-nunu and Takapan-hikihiki were tomahawked by Kai-Awhata and Kau-rehe at
    O-tokitoki near Lake Forsyth, and the murder was never avenged.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Rau-paraha’s appearance at Kai-a-poi stopped internal quarrels and forced
    Nga-i-tahu to combine against a common foe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: People escaping destroyed pas took refuge in difficult-to-access bays on the
    north-east side of the Peninsula, where settlements such as Panau and Oka-ruru
    grew.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says hostilities were renewed after some inhabitants repeated
    an act similar to the act that began the Kai-huanga quarrel.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Hape, Te-puhi-rere, and others, including people from Panau and nearby bays,
    traveled to visit friends at Kai-a-poi.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Te-whare-rimu said her familiar spirits told her that the path was obstructed
