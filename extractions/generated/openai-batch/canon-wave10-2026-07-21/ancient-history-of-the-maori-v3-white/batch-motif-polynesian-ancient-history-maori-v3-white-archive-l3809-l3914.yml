canonical_text:
  quote: ''
  summary: The passage recounts Tama-tea, his canoe Taki-tumu, the departure from
    Hawaiki, canoe-making with divine assistance, hunger during the sea voyage, landfall
    in Aotearoa, later travels with Kahu-ngunu, place-naming episodes, pet lizards
    with continuing mana, and a final quarrel that separates father and son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies Tama-tea as father of Kahu-ngunu, from whom Nga-ti-Kahu-ngunu
    take their tribal name, and lists Tama-tea's companions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The party left Hawaiki because of quarrels and had learned from other chiefs
    the direction to steer toward New Zealand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: They searched the forest Tawhiti-nui, felled six trees for canoes, made and
    named several canoes, and dragged them down the Hau-hau stream to the sea; the
    passage says gods assist great work when incantations and offerings have been
    made.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the sea voyage, food ran out; Tama-tea repeatedly chanted a mata-ara
    and glared at the crew, who then produced preserved birds, preserved fish, and
    other food until the canoe reached Aotearoa.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The canoes landed at Whanga-paraoa, later reached Tauranga, and then separated,
    with Kupe and Ngake departing again in Taki-tumu while Tama-tea and Kahu-ngunu
    remained at Tauranga.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: While making a net, Tama-tea braided some of Iwi's hair into it, an act described
    as a severe insult to Iwi and Kahu-ngunu; afterward Tama-tea moved to Whare-patari's
    pa, married Rua-tai, and later travelled with Kahu-ngunu while carrying pet lizards
    fed with tawa berries.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: As Tama-tea and Kahu-ngunu travelled, they observed local food practices,
    named places from events, lost one lizard at Poka, consulted the gods at Wai-tio,
    and looked back toward coastal places and foods.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: One lizard scratched inside a calabash; a greenstone hei-tiki was tied around
    its neck, it was placed in a cave among rocks, and a tree called Poho-kura was
    planted there. The passage says the lizard still lives there, retains mana, and
    its roar indicates bad weather.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: The travellers used a cave at Turanga-kira as a sheltering place; the passage
    also notes a later traveller who died there from frost and snow, and says Tama-tea
    and Kahu-ngunu ascended mountains and left a lizard at Ao-rangi.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:10
  text: At Tari-nuku near Whanga-nui, food was offered to the travellers, including
    preserved birds; Tama-tea ate all the birds, angering Kahu-ngunu and causing a
    quarrel and separation, after which Kahu-ngunu returned to Tauranga by a named
    route.
  category: sequence
  evidence_refs:
  - ev:11
