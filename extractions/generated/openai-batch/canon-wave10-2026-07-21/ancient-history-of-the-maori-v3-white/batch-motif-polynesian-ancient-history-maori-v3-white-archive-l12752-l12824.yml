canonical_text:
  quote: ''
  summary: The passage recounts a South Island account in which Tu-te-wai-mate, a
    Wai-taha chief, responds to Ngati-kuri encroachment and the murder of a relative
    by Moko. Moko lives in a cave by a highway and robs travelers. Tu-te-wai-mate
    destroys Ngati-kuri settlements, then confronts Moko in his cave, refuses to kill
    him while asleep, issues a challenge, and is killed by Moko’s sudden blow. The
    narrator explains Moko’s shark allusion as a Maori proverbial image of being hard
    to catch and kill. The passage then summarizes prolonged warfare, absorption of
    survivors by Nga-ti-mamoe, and a later migration and descent claim involving Nga-ti-kahu-hunu
    and the canoe Kura-hau-po.
  language: English
  quote_policy: summarized
