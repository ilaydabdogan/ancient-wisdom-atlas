canonical_text:
  quote: ''
  summary: Whaka-taka-anewha arranges house-building work and summons people from
    Puke-kura. His people are seen forming for battle, then hold a feast and games
    during which they attack the people of Maru and Apa-rangi. Tare-wai is captured
    and cut with obsidian, but escapes to the forest and a cave. He later recovers
    his war-weapon from enemies gathered around a fire, heals in the forest, and takes
    revenge by killing isolated people who come for water. After further losses, a
    Nga-ti-mamao/Nga-ti-mamoe group moves from Papa-nui to Puke-kura, is rebuked and
    expelled by Rangi-a-moa, and builds a new pa named Rangi-pipi-kao on an opposite
    ridge.
  language: English with Maori names and terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Whaka-taka-anewha orders rafters, battens, and posts for a house and asks
    the people of Puke-kura to help obtain the house requisites.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people of Puke-kura initially send aged and feeble people, but Whaka-taka-anewha's
    people tell them to stay home and ask that only able and strong people assist.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the helpers go to the plain to collect house material, Whaka-taka-anewha's
    people are found forming into battle-array; Tare-wai asks what it means and is
    told it is nothing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people cut kahaho reed-grass and return to the settlement, where Whaka-taka-anewha's
    people make a feast for them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the feast, young people and children begin sports, elders join the games,
    and Whaka-taka-anewha's people attack the people of Maru and Apa-rangi, killing
    most and taking some alive.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tare-wai is held by several men and cut once with obsidian; he shakes off
    his captors, flees to the forest, enters a cave, and finds mats there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At dusk Tare-wai goes to where his enemies are sitting around a blazing fire
    and admiring the war-weapon taken from him, and he sits on the shady side of the
    group.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tare-wai asks to handle the weapon, receives it, announces that he is there,
    and disappears into the surrounding darkness with the weapon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tare-wai lives in the forest, bandages the chest gash with a mat, makes a
    fire, and remains quiet until the scar is healed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At a place where his enemies come for water, Tare-wai kills solitary men or
    women but does not molest groups of two or more; he cooks and eats those he kills.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: After their people are killed, the Nga-ti-mamao/Nga-ti-mamoe leave Papa-nui
    and go to the pa at Puke-kura, where Rangi-a-moa resides.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Rangi-a-moa rebukes the arrivals with a proverb-like comparison to a perpendicular
    cliff and the mountain Tihi-o-aiari, and the group is expelled from that pa.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The expelled group builds a pa on an opposite ridge and names it Rangi-pipi-kao,
    where they take up permanent residence.
  category: action
  evidence_refs:
  - ev:10
