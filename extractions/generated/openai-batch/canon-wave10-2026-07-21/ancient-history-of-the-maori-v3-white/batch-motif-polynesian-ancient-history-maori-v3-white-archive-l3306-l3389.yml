canonical_text:
  quote: ''
  summary: Rua-wharo and Tu-pai insult Timu-whakairihia, seek the swift canoe Taki-tumu,
    load mats and whale-attracting gravel, seize the guarded god Kahu-kura by killing
    its guardians, and sail away. Rua-wharo chants an incantation at sea. The crew
    becomes cold and hungry after leaving land behind; threatened killings are avoided
    when selected victims produce food. The passage ends by distinguishing sacred
    and non-sacred parts of canoes and stating that Taki-tumu is sacred in every part.
  language: English
  quote_policy: summarized
