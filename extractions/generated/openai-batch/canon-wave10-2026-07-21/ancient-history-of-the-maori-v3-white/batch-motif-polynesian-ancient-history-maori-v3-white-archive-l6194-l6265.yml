canonical_text:
  quote: ''
  summary: 'The excerpt first concludes an account of a man teaching kumara cultivation:
    broken pieces are left in the ground, a later harvest is abundant, and Nga-ti-rua-roa
    continue the custom. It then recounts Rangi-whaka-oma at his kumara-store, where
    the boy Tawake-ariki comes to look at kumara. Rangi-whaka-oma directs him toward
    the lower unseen world; Tawake-ariki goes below, admires the kumara, and is killed
    when the piled stack falls on him. Tawake-ariki’s father Te-ao-tata sends a revenge
    force. The force takes Rangi-whaka-oma’s place, kills Rangi-whaka-oma and others,
    and spares three high-ranking women, including Rangi-whaka-oma’s daughter Rakau-manawa-he.
    Hau-iti takes Rakau-manawa-he as wife. Two other captive women are shamed after
    men taunt them while they bathe; they leave by the sea-coast to O-rere-wa and
    marry there. Rakau-manawa-he later bears two children, and Hau-iti sends her with
    Tahi-pare to obtain seed-kumara from Nga-ti-ira; the passage ends as they arrive.'
  language: English
  quote_policy: summarized
