comparison_claims:
- id: claim:1
  claim: 'The opening account and the later Ngati-kahu-nounu account present the same
    core episode: Rua-tapu takes a canoe far out, lets water enter through a hole,
    the canoe overturns or fills, and he spears companions, while Paikea is linked
    with survival.'
  claim_level: same_motif
  target: Two Rua-tapu canoe-revenge accounts within this passage
  evidence_refs:
  - ev:1
  - ev:7
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The two accounts vary in details, including named victims, the baler
    episode, and the phrasing of Paikea's survival.
- id: claim:2
  claim: The passage connects Rua-tapu's destructive actions and later tide with revenge
    for words spoken by his father about Rua-tapu's lesser birth status.
  claim_level: same_function
  target: Revenge function linking insult, canoe killing, and inundation within the
    passage
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The first account states the revenge connection directly; the second
    account supplies fuller cause but does not repeat the later tide in the same section.
