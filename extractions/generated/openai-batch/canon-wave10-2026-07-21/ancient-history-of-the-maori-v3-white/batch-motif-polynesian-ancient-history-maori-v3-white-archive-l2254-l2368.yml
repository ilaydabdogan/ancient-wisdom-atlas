canonical_text:
  quote: ''
  summary: The passage recounts Rua-tapu sabotaging a canoe at sea, killing companions
    with spears after it overturns, and Paikea surviving. Rua-tapu sends Paikea with
    messages, and later a tide associated with Rua-tapu covers low land and Hiku-rangi
    before being made to recede. A second account explains Rua-tapu's grievance after
    Ue-nuku denies him use of a sacred comb because of lower birth status; Rua-tapu
    borrows Hoe-ora's canoe, bores a hole in it, invites high-ranking first-born youths,
    and repeats the drowning and spearing episode. Paikea says he can return to land
    with heavenly or sea-creature aid, and Hoe-ora sends instructions for transmitting
    knowledge about seasons and fishing.
  language: English
  quote_policy: summarized
