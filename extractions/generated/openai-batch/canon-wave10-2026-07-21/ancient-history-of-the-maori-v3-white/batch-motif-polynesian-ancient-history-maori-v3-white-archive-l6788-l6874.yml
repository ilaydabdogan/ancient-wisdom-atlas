canonical_text:
  quote: ''
  summary: 'The passage begins with the end of a prior episode: a woman reports a
    death to Pukoro-au-ahi, the house containing the dead body is burned, birds are
    prepared and stored, and a cousin marriage produces a child named Tapora-riroi.
    The main episode tells of Hotu-ngakau, who repeatedly steals taro at night from
    Tama-tea-titaka. Tama watches the field, wounds Hotu with a spear, and later confronts
    him, but Hotu denies the theft while suffering from the wound. Hotu dies at dawn.
    His father Rongo-mai-ko-hina wraps the corpse, removes it by canoe, and leaves
    a deadly spell on the settlement in revenge. A herald asks how survivors may escape,
    and Rongo says the spell can be destroyed by ritually kindling fire by friction
    while a female treads on the lower stick.'
  language: English
  quote_policy: summarized
