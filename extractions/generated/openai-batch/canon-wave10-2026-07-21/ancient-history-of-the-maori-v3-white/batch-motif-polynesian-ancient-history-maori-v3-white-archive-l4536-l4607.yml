canonical_text:
  quote: ''
  summary: 'The passage recounts episodes in canoe-voyage traditions: Kupe and Ngake
    compete in making canoes; Taki-tumu travels to named places where Kupe''s children
    are left with food; Kupe hangs a stone axe at Port Nicholson and throws a stone
    into Cook Strait, explaining difficult passage there. A second account says Pawa
    obtained the canoe Horo-uta to voyage to New Zealand, lists many passengers including
    high-ranking women, and describes Horo-uta landing at O-hiwa, becoming stuck on
    a named rock, and the discovery that Hine-kau-i-rangi had left her companions
    before the supplied passage breaks off.'
  language: English
  quote_policy: summarized
