canonical_text:
  quote: ''
  summary: The passage recounts attacks and killings connected with Te-wera, the naming
    of Kaitangata, Te-wera’s death at Hekia after disease caused by whale blubber,
    a deathbed speech favoring death by enemies and being eaten over rotting, migration
    and treachery under Te-taho, an ambush of garment-carriers, and a later account
    of the heretical teacher Kiri-mahi-na-hina, whose body is cooked and entirely
    eaten to prevent the survival of his teaching or spirit. It ends by describing
    long peaceful occupation and seasonal work on the Peninsula.
  language: English
  quote_policy: summarized
