canonical_text:
  quote: '"The brave Tara-whai has recovered his weapon"'
  summary: The passage recounts renewed fighting between Nga-i-tahu and Nga-ti-mamoe,
    a peace followed by the ambush and capture of the chief Tara-whai, his escape
    from attempted killing, his deceptive recovery of his whalebone club from an enemy
    camp, his return to his own pa, and the subsequent revenge attack that drives
    Nga-ti-mamoe south into forest refuges.
