canonical_text:
  quote: ''
  summary: Rau-rika, a woman from Pou-tini on the west coast, ascends inland mountains,
    sees the eastern ocean, and comes down to Pu-hou's settlement near the mouth of
    the Ra-kaia. She shows Pu-hou superior named greenstone axes and points out the
    road to the greenstone country. Pu-hou's people set out in two groups; at a stream
    confluence the groups divide, and Whaka-ariki's party perishes. Pu-hou reaches
    the west coast with Rau-rika's dog, meets her parents, reassures them that she
    is alive, and receives greenstone they have obtained.
  language: English
  quote_policy: summarized
