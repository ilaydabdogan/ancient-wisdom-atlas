canonical_text:
  quote: ''
  summary: After confronting Whena, Ue-nuku mourns and seeks oracular information.
    His messenger Mahi-rua is overcome by Pawa's divine power and restored to life
    with a fish tail. Further messengers obtain hidden information at a central fire-pit,
    after which Ue-nuku prepares a war expedition. Whatuia and Paikea lead warriors,
    capture Pai-mahu-tanga, and later Ue-nuku uses fog and dogs in battle against
    Whena's people. A prisoner is killed, his heart cooked and placed in a named calabash.
    Whena's host is destroyed, and Ue-nuku returns to Ao-tea, takes Pai-mahu-tanga
    as wife, and has a son, Rua-tapu.
  language: English
  quote_policy: summarized
