canonical_text:
  quote: ''
  summary: A male worker completes required rafters while using one axe for every
    four rafters. Tama-tea-a-moa is reported as calling for men to be killed and dragged
    to the settlement, but others advise delay and inspection of Rangi-nui's work.
    Rangi-nui and his followers leave the settlement and refuse an invitation to return.
    Tama-tea-a-moa sends Kura-pori, Rangi-nui's sister, to call them back. Kura-pori
    later takes a husband and bears Ue-nuku-whare-kuta. Tama-tea senior sends named
    men as vassals and food-providers for the child and his descendants; they cultivate
    named kumara varieties at Rata-nui, north of Wai-apu.
  language: English
  quote_policy: summarized
