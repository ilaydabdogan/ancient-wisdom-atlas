canonical_text:
  quote: ''
  summary: 'The passage first describes wind, sea waves, and a storm destroying named
    places and threatening Hiku-rangi, which is saved by Marere-ao''s incantations
    and ceremonies; Hine-makura drinks the tide and humanity is saved. It then gives
    a Paikea genealogy: Paikea lands on Ahuahu, marries Ahuru-moa-i-raka, begets sons,
    and the descent lines continue through many named descendants, including a pair
    of twins who are murdered, with a variant murderer named.'
  language: English with Māori names and glosses
  quote_policy: summarized
