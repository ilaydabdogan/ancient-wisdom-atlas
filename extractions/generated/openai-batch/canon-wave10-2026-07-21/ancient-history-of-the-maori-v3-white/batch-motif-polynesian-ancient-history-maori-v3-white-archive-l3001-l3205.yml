canonical_text:
  quote: ''
  summary: Hae-ora tells Paikea to go and transmit knowledge of agriculture and seasonal
    signs. Rua-tapu pursues Paikea but fails to overtake him, then instructs him to
    gather people on Ao-tea-roa at Puke-hapopo because a destructive wave will come.
    The narrative explains that Rua-tapu’s death and burst entrails produce great
    waves, pumice, gravel, and jellyfish. Paikea gathers people at Puke-hapopo, saves
    those present, and uses ceremonies, incantations, and a pere-hia reed to break
    the power of the waves so mountain peaks are not submerged. He later performs
    washing and anointing rites, calls on sea-god progenitors to bring him ashore,
    lands, names Ahu-ahu, marries Hotu-rangi, and becomes an ancestor in the Nga-i-porou
    genealogy. The passage then gives a genealogy involving Ue-nuku and related figures.
  language: English
  quote_policy: summarized
