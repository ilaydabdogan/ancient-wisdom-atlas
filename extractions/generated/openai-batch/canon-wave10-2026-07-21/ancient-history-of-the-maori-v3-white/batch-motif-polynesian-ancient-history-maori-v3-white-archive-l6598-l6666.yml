canonical_text:
  quote: ''
  summary: The passage first concludes a war connected with Rua-tau-pare's ancestral
    lands, listing five battles and the clearance of occupants from those lands. It
    then narrates a quarrel between Tu-ere, Tangi-haere, and Te-awa-riki that begins
    during kite-flying, escalates into battle, and leads to Te-awa-riki's death. After
    Tu-ere dies, his sons exhume his body, make his bones into fishing-hooks, catch
    fish, and send the canoe adrift so coastal people will eat the fish and die through
    the god-power in the bones. Tu-ere's descendants gain victory and later migrate
    northward.
  language: English
  quote_policy: summarized
