canonical_text:
  quote: ''
  summary: Ethnographic procedural passage describing preparation of raw sea-eggs
    by washing, soaking overnight in river water, and serving them to the host's numaym;
    a note on hardening and avoiding drinking water after river-soaked sea-eggs; methods
    for obtaining, cutting, eating, and handling flat sea-eggs; and the beginning
    of a procedure for picking flat sea-eggs at spring-tide under the full moon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A new dish is set on the beach near salt water; edible sea-egg insides are
    removed, washed in salt water, and put into the dish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dish is carried up the beach and river; water is poured in, stirred with
    the right hand, poured off, and the dish is submerged in the river with stones
    placed on both ends.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sea-eggs remain in the river for one night and are taken out at noon the
    following day, drained, carried back, and taken into the house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The host calls his numaym to the house, portions the clean sea-eggs into many
    dishes, distributes spoons, places one dish before each four guests, and the guests
    eat with spoons and leave.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Cold-water soaking is described as making sea-eggs stiff or hard; people are
    afraid to drink water after eating river-soaked sea-eggs because they get heart-burn.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Flat sea-eggs are not often speared because spearing breaks them; instead,
    a scraping-net is used with a small canoe, scraping paddle, and bailer.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Flat sea-eggs are said to be found on sandy, level bottom without eelgrass;
    the collector pushes the scraping-net to the bottom, moves the canoe stern first,
    fills the net, and empties it until the canoe is almost full.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: After returning home with flat sea-eggs, the collector calls the tribe; men,
    wives, and children bring shells, carry sea-eggs ashore in blanket folds, and
    sit on the beach to cut them.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The flat sea-eggs are cut around the edge with shells; the mouth side is discarded,
    the remaining side is turned in salt water so the entrails come out, and the edible
    back part is eaten.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: When someone gets a milky sea-egg, he gives it to one who gathers them; after
    eating, people rinse their mouths and drink a little water.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: The woman treats milky flat sea-eggs as she treated milky large sea-eggs roasted
    by the side of the fire.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: At spring-tide during the full moon, the man launches a sea-egg-picking canoe,
    takes baskets and a paddle, and goes to a place protected from winter southeast-wind
    swell.
  category: setting
  evidence_refs:
  - ev:11
