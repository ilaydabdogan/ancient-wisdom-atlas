  quote: ''
  summary: 'The passage describes the preparation and sequence of a crabapple-and-water
    feast: the naming and value of crabapples in water, preparation of dishes and
    firewood, invitation of guests, ordered seating and singing by tribes, distribution
    of crabapples with oil in house-dishes, fourfold shouts during serving, and identification
    of a prior feast-giver whom the host is repaying.'
