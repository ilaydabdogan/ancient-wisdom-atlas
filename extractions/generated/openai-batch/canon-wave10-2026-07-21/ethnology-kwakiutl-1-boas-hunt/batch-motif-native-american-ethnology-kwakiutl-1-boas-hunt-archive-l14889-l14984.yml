canonical_text:
  quote: ''
  summary: 'The passage describes construction and use of a Kwakiutl/Nak!wax*da£xu
    cradle apparatus, including cedar-bark, deer-skin strips, a forehead-presser,
    head-cover, lacing rope, suspension rope, and pulling-rope. It then describes
    infant treatment: a kelp head-band is removed, oiled, and replaced; for a girl,
    a good-looking mother of twins is called after eight days to remove the child
    from the cradle, touch the child''s face, wash the child with warmed rain-water,
    utter blessings for health and high-status marriage, and apply or mix a hidden
    urine substance described as protective against sickness, danger, and spirits.'
  language: English
  quote_policy: summarized
