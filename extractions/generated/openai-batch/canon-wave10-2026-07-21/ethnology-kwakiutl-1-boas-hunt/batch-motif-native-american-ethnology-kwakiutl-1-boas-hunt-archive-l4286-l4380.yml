canonical_text:
  quote: ''
  summary: 'The passage gives procedural descriptions for processing dog-salmon: splitting
    and drying salmon for winter food, preparing fresh roasted backbones with wooden
    tongs and house fire, and cutting off pectoral and anal fins for basket storage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman removes the gills and head of a dog-salmon, cuts along the back near
    the dorsal fin toward the tail, breaks off the tail, and sets down the cut fish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman removes meat from the backbone on both sides, discards the bare
    bone, and leaves a divided piece with an upper-end portion called tail-holding-together;
    the processed piece is called split-down.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The split-down is hung on an outside frame, or on indoor staging during bad
    weather, and is later straightened and rehung after partial drying.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Remaining short bones are pulled out of the split-down; the woman rubs it
    like washing clothes, making it soft and white, then hangs it until fully dry.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The dried split-down is put on a mat, separated into tail-holding-together
    pieces and rubbed split-down pieces, placed in two cedar-bark baskets, stored
    under staging, and kept as winter food.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: For fresh roasted backbones, a dog-salmon is placed on an old mat, its gills
    and head are removed, and cutting leaves thick meat on the backbone.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Straight-splitting pinewood is made into four-span roasting-tongs, rubbed
    with salmon intestines, tied with cedar-bark, and filled with backbones arranged
    in groups of four.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Filled roasting-tongs are reinforced with split pine, set beside the house
    fire, then placed over the fire until blackened; the finished pieces are called
    roasted backbones.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: After removing gills, the woman cuts around the salmon neck, cuts off the
    pectoral and anal fins, and puts the fins into a basket.
  category: action
  evidence_refs:
  - ev:9
