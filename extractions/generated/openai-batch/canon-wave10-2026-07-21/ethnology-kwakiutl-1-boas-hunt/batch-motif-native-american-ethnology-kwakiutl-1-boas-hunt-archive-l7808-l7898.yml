canonical_text:
  quote: ''
  summary: The passage gives procedural recipes and rules for eating dried halibut-head,
    dried halibut-stomach, and dried halibut-fins. It describes soaking dried parts
    in bilge-water, boiling and washing them, using cedar implements, eating within
    the household, and excluding some foods from feasts and oil dipping.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dried halibut-head remains may stay in water in the kettle and be put back
    on the fire repeatedly when the woman is hungry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dried halibut-head is not used for inviting people to a feast; only the woman,
    her husband, and her children eat it, and it is not dipped in oil.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dried halibut-stomach is soaked for four days in the bilge-water of the fisherman’s
    fishing-canoe, and it swells up there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman retrieves the soaked stomach with a small basket, takes it into
    the house, cleans a small kettle, adds water, and heats it slowly from morning
    until noon.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: After the first boiling, the woman uses tongs, a small dish, a thin cedar-board,
    and a fish-knife to handle and cut the boiled stomach into mouth-sized pieces.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The woman pours the first liquid outside the house, washes the kettle, washes
    the pieces of stomach until the soot is gone and they are white outside, and puts
    them back into the kettle with fresh water.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The woman makes a strong fire for the second cooking of the stomach, watches
    the boiling for a long time, adds fresh water when the water is nearly gone, and
    finishes it in the evening.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the evening the woman calls her husband to sit down; they drink water,
    and she eats the dried stomach with pointed cedar-sticks used like forks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After eating, the woman returns leftovers to the kettle, washes the kettle,
    adds water for washing hands, and they drink fresh water again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Dried halibut-stomach is not used at feasts and is not dipped into oil because
    it is described as already fat.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Dried halibut-fins are soaked for six days in bilge-water because they are
    thick; they are soaked until they swell.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: For dried fins, the woman washes off soot, puts the fins in a basket, sets
    split cedar-sticks crosswise in the bottom of the kettle as a grating to prevent
    burning, places the fins on them, and adds water.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
