canonical_text:
  quote: ''
  summary: The passage gives procedural descriptions of preparing roots and cedar-withes.
    A woman heats, peels, splits, scrapes, coils, gathers, and ties roots and cedar-withes
    for basketry-related work. A man prepares cedar-withes by warming, stripping,
    twisting, and soaking them in urine overnight, after which they turn red like
    blood and are said not to rot quickly.
  language: English
  quote_policy: summarized
