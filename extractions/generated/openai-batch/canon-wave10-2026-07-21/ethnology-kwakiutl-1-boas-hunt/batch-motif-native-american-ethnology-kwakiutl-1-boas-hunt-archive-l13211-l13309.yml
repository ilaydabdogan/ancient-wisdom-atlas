canonical_text:
  quote: ''
  summary: The passage describes procedures for cleaning gooseberries by wind, boiling
    them into jam with heated stones, cooling the jam, and serving it with oil to
    invited friends or a numaym. It then contrasts this prepared gooseberry dish with
    raw gooseberries, currants, and Solomon's Seal berries, which are eaten from plants
    or in the house and are not used for invitations or feasts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman places a mat where the wind is strongest and supports its edges with
    four pieces of firewood so that the inside forms a nest-like space.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman slowly pours gooseberries from a basket into the prepared mat-space;
    wind blows the leaves away while the gooseberries fall onto the mat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After cleaning, the woman returns the gooseberries to a basket, carries them
    home, pours them into a large dish, gathers more, and repeats the process.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When there are many gooseberries, the woman uses a low-sided box made for
    this purpose and pours the berries into it until it is nearly full.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman builds a fire, heats stones, draws water, and uses tongs to dip
    red-hot stones into water so ash comes off before putting the stones into the
    gooseberries.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hot stones are placed close together in the gooseberries, the container is
    covered with a mat for a time, cooled stones are removed, and the berry jam is
    stirred with a cedar stick; more hot stones are added if the berries are not boiled
    to pieces.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the jam is done, it is ladled into a large dish and placed in a cool
    place to cool quickly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the jam is cold, the woman sends her husband to invite his friends or
    numaym and later sends him to bring the gooseberry-jam dish to her seat.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The woman portions jam into small dishes, pours much oil on it, gives each
    guest a spoon, and sets one dish before each three men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Guests eat the gooseberry jam and then leave; the passage states that they
    never drink water after it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Raw gooseberries, currants, and Solomon's Seal berries are described as eaten
    from plants or in the house without inviting friends, many people, relatives,
    or tribes; Solomon's Seal berries are not boiled.
  category: sequence
  evidence_refs:
  - ev:7
