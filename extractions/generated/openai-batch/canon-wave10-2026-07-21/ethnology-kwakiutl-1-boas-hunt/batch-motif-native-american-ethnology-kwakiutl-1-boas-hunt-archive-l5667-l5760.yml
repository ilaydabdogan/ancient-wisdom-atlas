canonical_text:
  quote: ''
  summary: A procedural description of preserving viburnum-berries and beginning the
    preparation of crabapples. A man heats stones in a fire and transfers them with
    tongs into water for steaming. A woman and her husband fill baskets, watch berry
    color during cooking, and store steamed berries in oil-boxes with added water
    and a board cover until winter ceremonial time. The woman and her husband also
    clean crabapples, after which the husband gathers driftwood and stones and prepares
    another fire-and-water setup.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man wets long tongs, picks red-hot stones out of the fire, and puts them
    into water in the steaming-box; he wets the tongs again when their end catches
    fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man tries to make the water very hot but stops before it boils up.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Viburnum-berries are transferred through baskets into a cooking-basket, which
    the man places in the hot water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman watches the submerged berries, checks them repeatedly, and treats
    color change to red or sometimes whitish yellow as the point when they are done.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Steamed viburnum-berries are poured into oil-boxes, with four basketfuls placed
    in each box before water is added.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A couple may fill many oil-boxes with viburnum-berries because they help each
    other when they want a large supply.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The filled oil-boxes receive fresh water, are covered with a board, and are
