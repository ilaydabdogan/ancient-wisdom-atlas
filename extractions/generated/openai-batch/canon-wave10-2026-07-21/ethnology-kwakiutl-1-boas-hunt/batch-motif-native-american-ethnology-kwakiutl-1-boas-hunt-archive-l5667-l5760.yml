  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: For crabapples, the woman pours the fruit onto a mat, and she and her husband
    sit by baskets and pinch off the stems by hand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Cleaned crabapples are put into smaller baskets and then combined into a large
    basket, dish, or box.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The husband gathers driftwood, builds a fire arrangement, gathers stones from
    the beach, and heats the stones in the fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The man places an empty oil-box near the fire, draws water in buckets, fills
