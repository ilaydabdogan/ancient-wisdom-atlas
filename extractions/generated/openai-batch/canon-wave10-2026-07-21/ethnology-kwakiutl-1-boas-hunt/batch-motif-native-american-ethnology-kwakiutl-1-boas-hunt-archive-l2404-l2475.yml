canonical_text:
  quote: ''
  summary: Technical description of making two digging-sticks, one for clover and
    one for roots or carrots. The process includes measuring and carving wood, drying
    and heating it by the house fire, rubbing it with tallow, perch-oil, and cedar-bark,
    selecting yew wood, and blackening a point in hot ashes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A digging-stick is shaped by measuring its grip and handle, adzing its back
    and belly toward the point, cutting notches, hollowing parts, and shaving it smooth
    with knives.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The clover digging-stick is dried over the house fire for four days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ends of the clover digging-stick are heated until blackened or scorched,
    then rubbed with tallow, perch-oil, and shredded cedar-bark, with repeated heating.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After oiling and heating, the clover digging-stick is stood upright in a cool
    corner of the house and is considered finished.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: For a root or carrot digging-stick, the man looks for a yew-tree near spring,
    chooses a bent knotless branch about two finger-widths thick, cuts it close to
    the trunk, and measures off three spans.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The yew-wood stick has its bark and sap shaved off, is smoothed, and is given
    a flat end and a knob.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The knob on the root or carrot digging-stick is named the top handle.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The root or carrot digging-stick is heated by the fire, rubbed with deer-tallow,
    placed in hot ashes until the point is blackened, and the handle is pushed into
    tallow.
  category: sequence
  evidence_refs:
  - ev:6
