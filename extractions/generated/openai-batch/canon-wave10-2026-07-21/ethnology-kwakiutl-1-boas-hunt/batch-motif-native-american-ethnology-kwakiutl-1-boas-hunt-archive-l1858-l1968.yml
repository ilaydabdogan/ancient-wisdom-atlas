canonical_text:
  quote: ''
  summary: The passage describes cedar-bark working. A woman prepares a yew-wood paddle
    and stake apparatus, heats and shreds cedar-bark, saves rough shreds for towels,
    and stores the folded bark. For yellow cedar-bark, she dries it, soaks it in warm
    calm salt water, returns after twelve days with a bone beater and stone, beats
    and dries it, and stores it. A later section describes selecting a young cedar-tree
    and peeling a narrow strip called “making a road” before peeling a broader strip
    upward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman places an old yew-wood paddle edgewise on the house fire, burns one
    edge, sprinkles water on it to put the fire out, and rubs off charcoal with wet
    sandstone to make a sharp edge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: She measures a punting-pole, burns it off, drives it into the floor near the
    fire, and ties the paddle to the top of the stake with cedar-bark rope.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Dry brittle cedar-bark is spread over the fire, then held in a split cedar-stick
    tool called a cedar-bark holder.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The woman sits with her leg over the paddle, holds the shredding implement
    and the cedar-bark holder, strikes the bark, advances it gradually, and coils
    each piece when she reaches the end.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After shredding, she removes rough strips, stores the shredded-off material
    in a small box for use as rubbed towels after face-washing, folds the cedar-bark,
    and puts it into her box.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Yellow cedar-bark is peeled like red cedar-bark and dried outside in sun and
    wind for six or eight days because it is thick.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The woman takes yellow cedar-bark by small canoe to a calm, warm salt-water
    bay, places it lengthwise at low-water mark, weights both ends with stones, and
    goes home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Her husband looks for a whale-rib, works it into a cedar-bark beater, and
    gives the finished tool to his wife.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the yellow cedar-bark has soaked for twelve days, the woman returns
    by small canoe carrying a bone beater and a flat diabase pebble.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Facing the sea, she pulls the soaked bark slowly from the water, lays it over
    the flat stone, beats it with the bone beater starting at the broad end, and coils
    it into the canoe.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: At home she hangs the beaten yellow cedar-bark on halibut drying-poles, covers
    it in the evening with a new mat, dries it for four days, folds it, and stores
    it in a basket.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The yellow cedar-bark work is stated to be done in winter-time.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: The woman goes into the woods to look for young cedar-trees and chooses one
    with untwisted, not-thick bark.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: She cuts around the bottom of the young cedar while leaving a strip uncut,
    peels a narrow strip called “making a road,” and then peels a broader one-span
    strip upward.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
