canonical_text:
  quote: ''
  summary: 'The passage describes practices involving a child’s navel-string: it is
    kept by parents and placed with skilled people, tools, clothing rings, or body
    parts so that boys or girls may grow into desired occupations or performance abilities.
    It then describes a maturing princess of the Maamtag''ila: her name, still posture
    in a house for the maturing girl, measured food, and controlled drinking through
    an eagle-bone tube under the direction of an attendant shaman-woman.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Parents keep the navel-string of a child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If one of twins is a boy, the mother wraps the navel-string in cedar-bark
    and gives it to a near relative who is a seal-hunter so that the boy may become
    a seal-hunter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The seal-hunter places the navel-string between the prongs of his harpoon-shaft,
    or at the end of his paddle under a wrapping of helpline.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: For a boy intended to be a canoe-maker, the navel-string is put under the
    deer-skin lashing of a canoe-builder’s adz.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The navel-string may be placed in the neck-ring of a canoe-maker, seal-hunter,
    salmon-fisherman, or halibut-fisherman.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:6
  text: For a boy intended to be a song-leader, the navel-string is folded, inserted
    into a drilled hole in the end of a song-leader’s baton, and sealed with a cedar-wood
    plug.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Another method for making a boy a song-leader is to seat him in a drum while
    a song-leader sings and beats the drum softly four times.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Expert workmen are said to wear boys’ navel-strings around their necks.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Girls’ navel-strings may be worn around the wrist by a mat-maker or basket-maker,
    or around the neck by women skilled in drying halibut, cutting salmon, or digging
    clams.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A girl’s or boy’s navel-string may be put on the body of an expert dancer
    so that the child may become a good dancer.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The princess K'!edele£laku is described as the princess of the real chief
    of the Maamtag'ila, who is head chief of the numayms.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: When the princess becomes mature, she sits in the house for the maturing girl,
    remaining still with her knees pressed against her breasts.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: The maturing princess is given four small pieces of broken dried salmon and
    a little oil, but she only looks at the dish placed before her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The princess’s attendant is always a shaman, and the attendant shaman-woman
    brings the dish and later handles water and a drinking-tube made from an eagle
    wing bone.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:15
  text: The attendant instructs the princess to drink carefully through the tube,
    take only a small mouthful, and swallow four times.
  category: speech
  evidence_refs:
  - ev:8
