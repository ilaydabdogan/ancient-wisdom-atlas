  text: House-dishes, small dishes, and crabapple boxes are placed before chiefs and
    common people before eating begins.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young men build up a fire with dead cedarwood in the middle of the feasting-house
