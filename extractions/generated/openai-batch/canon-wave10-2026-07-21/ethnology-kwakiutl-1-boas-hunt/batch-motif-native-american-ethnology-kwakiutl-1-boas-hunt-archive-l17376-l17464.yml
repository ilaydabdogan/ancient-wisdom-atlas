canonical_text:
  quote: ''
  summary: 'The passage describes procedures for crabapple and mixed salal-berry/crabapple
    feasts: dishes are distributed, guests eat, a fire is built, new feasting songs
    are sung, the host''s daughter dances, men serve chiefs from long-handled ladles,
    leftovers are poured into the fire, compliments are exchanged, and preparations
    begin for a larger competitive feast using canoes as soaking and serving vessels.'
  language: English
  quote_policy: summarized
literal_observations:
