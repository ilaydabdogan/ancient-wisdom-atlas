  quote: ''
  summary: The passage explains names for kelp-fish and gives a step-by-step account
    of delaying, heating, scraping, beating, cutting, boiling, emulsifying, and serving
    kelp-fish to guests, with references to precedent set by the first people and
    to household reputation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The kelp-fish is identified with xii'ldzos; its names are explained by heating
    and hot water used to loosen scales, and by its quick swimming when frightened.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fish are not cooked fresh but may be kept for five days or more to acquire
    a strong smell; the passage says this is done because the first people said so
    and recent people imitate them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A woman places a kettle by the house fire, draws fresh water, fills the kettle
    half full, and sets fish and implements near the fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The woman holds a kelp-fish by the head, puts its body into the fire, turns
    it, and scrapes off loosened scales on a mat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After scaling, the fish is placed on a canoe stern-seat, beaten with a short
    wedge until soft, and cut crosswise.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The fish is put head first into the kettle water, and the head is not cut
    off because the fat of the eyeballs and brain is said to give good taste to the
    meat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: During boiling, the woman stirs and repeatedly dips up the cooking liquid
    and pours it back until the liquid becomes milky, showing that fish fat is mixed
    with the liquid.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: If the kelp-fish liquid is not milky when served, guests may whisper that
    the woman is lazy, even if she is of chiefly status or a chief's wife.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The cooked meat and liquid are ladled into dishes, spoons are distributed,
    and one dish is placed before every four men.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Before eating, guests drink cold water, and the host warns them to think of
    their throats and not swallow the bones.
  category: speech
  evidence_refs:
  - ev:10
