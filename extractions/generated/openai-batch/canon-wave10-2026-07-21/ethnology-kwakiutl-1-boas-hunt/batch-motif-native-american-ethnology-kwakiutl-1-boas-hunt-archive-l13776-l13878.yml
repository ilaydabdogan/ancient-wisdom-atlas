canonical_text:
  quote: ''
  summary: The passage contains a departure prayer to a house followed by a prohibition
    on looking back until the house is hidden; a prayer addressed to a young cedar
    before taking its bark for a basket; and a weather charm narrated by Haemiskienis
    involving four crabs, cedar-bark strips, fire, clam-shells, a tree hollow, sea
    bathing, and a mythic explanation in which Myth people, Great-Inventor, and Crab
    establish the procedure for calling the northwest wind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker addresses a house as a friend, asks it for protection, and wishes
    to return to live in it happily the next year when digging cinquefoil.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the farewell to the house, the speaker sits in the stern of a travelling-canoe
    and paddles away; he must not look back at the house until after passing a point
    that hides it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A woman who has found a young cedar takes an adz, stands under the tree, looks
    upward, and prays to it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The prayer asks the cedar for its “dress,” says the cedar can be used for
    many things, and states that the woman will make a basket for lily roots from
    it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The cedar prayer asks the tree not to be angry, to tell its friends about
    the request, and to keep sickness and death in war away from the speaker.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that this cedar prayer is used by those who peel cedar
    bark from young and old cedar trees.
  category: other
  evidence_refs:
  - ev:2
- id: obs:7
  text: Haemiskienis reports that, during a journey south toward Victoria, a strong
    southeast wind blew all day and all night.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the weather charm, four small crabs are found under stones; four cedar-bark
    strips are tied to their right claws; the crabs are hung over a fire from leaning
    poles until their shells begin to redden.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Each crab is placed in a large clam-shell, and each shell is tied shut with
    the same cedar-bark strips used to hang the crabs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The shell bundles are carried into the woods; three are put into a hole at
    the base of a hemlock tree, and the last is addressed and told to warn its friends
    to call the northwest wind and the east wind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: After leaving the shells, the practitioner bathes in the sea, sits on the
    beach to be dried by the wind, dresses, warms himself by the campfire, and waits
    for the northwest wind at noon.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Haemiskienis explains that in the time of the Myth people, quadrupeds, birds,
    crabs, trees, and plants were all like men.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Myth people made war against the southeast wind, and Great-Inventor asked
    his younger brothers who among them controlled the weather.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Crab, described as a short man, answers Great-Inventor and gives instructions
    for using crabs, cedar-bark, fire, clam-shells, and a tree hole when the northwest
    wind is wanted.
  category: speech
  evidence_refs:
  - ev:5
