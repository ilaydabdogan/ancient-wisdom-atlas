canonical_text:
  quote: ''
  summary: 'The passage gives procedural descriptions for preparing and eating fern-root,
    including pounding, cutting, roasting, dipping or covering with oil, chewing,
    drinking water, and non-food uses while hunting or for vomiting blood. It then
    begins a procedure for cooking clover-root for a feast: a man gathers firewood
    and stones, builds a fire for heating stones, sends messengers to invite people,
    arranges baskets and steaming equipment, and has fresh water fetched for pouring
    over clover on the hot stones.'
  language: English
  quote_policy: summarized
