  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The currant baskets are carried into the house one by one and placed together
    in a cool corner.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The huckleberry section begins with the woman preparing in the morning after
