canonical_text:
  quote: ''
  summary: The passage describes procedures for gathering salal berries, currants,
    and the beginning of huckleberry gathering. A woman equips herself with baskets,
    cedar-bark items, paddle, and canoe; travels to berry areas; fills baskets by
    transferring berries from a front-basket to larger baskets; secures full baskets
    with plant materials; returns the harvest to the house; and stores the baskets
    in specified places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman puts on a salal-picking cedar-bark hat, carries baskets on her back,
    takes a paddle, goes to the beach, launches a canoe, and goes aboard.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: She paddles to an island where salal berries grow well.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the island she ties a stone to the small canoe, carries the baskets on
    her back, and goes into the woods to pick salal berries.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: She uses a front-basket for picking salal berries and pours its contents into
    larger baskets, including the swallowing-basket and a medium-sized basket.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: When the salal baskets are full, she covers their openings with hemlock branches
    and ties the branches down with cedar-bark rope.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: She loads the salal baskets into the canoe, paddles home, carries them into
    the house, and places the largest basket in a place not too near the fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: For currants, women use the same three baskets used for salal berries, along
    with a cedar-bark belt and cedar-bark hat.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: In currant picking, the woman hangs the front-basket before her chest, pinches
    currants off their stems, fills the front-basket, and pours them into larger baskets.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Full currant baskets are covered with skunk-cabbage leaves and secured by
