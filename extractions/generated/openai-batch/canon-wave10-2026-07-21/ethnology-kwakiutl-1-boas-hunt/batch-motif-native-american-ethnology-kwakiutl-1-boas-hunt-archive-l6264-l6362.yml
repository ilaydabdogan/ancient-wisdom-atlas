canonical_text:
  quote: ''
  summary: 'The passage gives procedural descriptions for preparing and eating several
    forms of salmon: blistered green salmon, scorched dried salmon, preserved brittle
    roasted salmon, and dry roasted salmon-backs fed to young men. Recurrent actions
    include softening with water, scorching or roasting by fire, pounding or breaking
    salmon, placing food on mats or in dishes, serving oil in oil-dishes for dipping
    or drinking, rinsing mouths, drinking water, and managing guests during a meal.'
  language: English
  quote_policy: summarized
