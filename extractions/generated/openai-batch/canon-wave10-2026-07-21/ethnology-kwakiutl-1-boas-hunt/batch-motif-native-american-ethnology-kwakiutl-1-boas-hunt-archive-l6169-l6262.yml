canonical_text:
  quote: ''
  summary: The passage gives recipes and procedures for roasted dog-salmon and blistered
    green salmon. It describes catching or spearing salmon, a wife carrying and cutting
    salmon, fastening salmon in roasting-tongs with cedar materials, roasting it by
    the house fire, inviting and feeding guests, rules about when fatty phosphorescent
    dog-salmon is eaten, disposal of bones and skin into the sea, and blistering almost
    dried green salmon by the fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dog-salmon are caught at night up the river for drying for winter; dog-salmon
    speared at the river mouth while still phosphorescent are described as fat and
    not suitable for long keeping after roasting.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the man spears a salmon at the river mouth, he returns home as soon as
    he has speared it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wife puts an old mat over her back, secures it with a belt, takes a carrying-basket,
    goes to her husband's canoe, and carries four dog-salmon to the cutting place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman places the salmon on an old mat outside the house, sharpens her
    fish-knife, removes the gills, cuts around the neck, and cuts out the backbone
    while leaving flesh attached.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman rubs salmon slime on the roasting-tongs, winds cedar-bark around
    them, places cut salmon in the tongs, ties them with cedar-bark, and secures them
    with slender cedar-wood pieces called locks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The woman places the tongs by the house fire, first turning the meat side
    toward the fire and then turning the salmon to the skin side.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The man asks his wife for permission to invite his friends to eat the warm
    roasted salmon; after she tells him to do so, he invites them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The wife spreads mats for her husband's guests, lays roasted salmon skin-down
    on the food-mat, and the guests break and eat the salmon themselves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: No dipping oil is used because the phosphorescent dog-salmon is very fat;
    it is eaten in the afternoon and evening, not in the morning, because morning
    eating is said to make eaters sleepy all day.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the guests finish, the man eats what remains with his wife, while the
    guests drink freshly drawn water, leave, and wash their hands in their own houses.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The man gathers the bones and skin left by the guests on a mat and throws
    them into the sea on the beach.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: For blistered salmon, the woman takes almost dried green salmon from where
    it hangs, blisters the meat side by the fire, turns it to blister the skin side,
    and places it on a dish-mat when done.
  category: action
  evidence_refs:
  - ev:10
