canonical_text:
  quote: ''
  summary: A man recognized as Qleged arrives with the great wolf G'ilalalit and many
    wolves. The people purify themselves, try unsuccessfully to capture him, and then
    make him secular by burning cedar-bark napkins so that the smoke reaches him and
    his fire-bringer and death-bringer disappear. Qleged recounts that wolves reassembled
    his body after four grizzly bears had scattered it, restored a buried leg, and
    sprinkled him with water of life. He also recounts an animal-house ceremony with
    wolf masks, songs, a granted name and privilege, and the fire-bringer and death-bringer.
    The passage closes by saying this is imitated in a winter dance and explains ownership
    of the named privilege.
  language: English
  quote_policy: summarized
