canonical_text:
  quote: He looks at his clover-digging house and prays to it.
  summary: The passage describes conditions for long and short cinquefoil-roots, the
    careful digging, drying, bundling, packing, canoe transport, prayer to the digging-house,
    arrival at a winter house, and storage of roots in separate places.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Long cinquefoil-roots are said to grow well where the soil is half sand and
    half light clay, while many small pebbles prevent long roots from occurring at
    Nimkish River.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The short cinquefoil-roots are described as being above the long roots; the
    two do not hold together although they belong to one stem.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman uses a digging-stick slowly so that the long roots do not break,
    then places the long roots in their basket.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the evening the woman makes separate piles of short and long roots and
    covers them with mats; the digging of one garden may take four days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The short roots are dried, put into baskets, covered with dry grass, and tied
    shut with split cedar-bark.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The long roots are gathered with their ends together, tied firmly in the middle
    with split cedar-bark, and put into baskets with grass and cedar-bark covering.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The woman and her husband load a canoe in an ordered way: roof-boards are
    placed on the bottom, then baskets of short roots, then baskets of long roots,
    then bedding and provisions, and finally mats over the load.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The man stands in the stern to steer and looks at the clover-digging house
    and prays to it.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: At the beach of the winter house the man backs the canoe in, unloads at high
    tide, or anchors the canoe with a cedar-bark rope and stone if the tide is low.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Relatives invite the couple to eat, with timing depending on whether the cargo
    has already been carried up the beach.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Baskets with long roots and short roots are stored in two different cool places
    in the house, long roots on the right and short roots on the left; long-root baskets
    are later put across beams or staging.
  category: sequence
  evidence_refs:
  - ev:9
