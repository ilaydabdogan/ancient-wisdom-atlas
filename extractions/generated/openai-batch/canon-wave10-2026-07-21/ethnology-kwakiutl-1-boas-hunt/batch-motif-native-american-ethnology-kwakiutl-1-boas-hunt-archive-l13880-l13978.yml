candidate_motifs:
- id: motif:1
  label: Weather calling through ritual handling of nonhuman persons
  taxonomy_refs: []
  basis: The passage presents crab, fern, and snail procedures in which nonhuman beings
    or their kinds are placed by fire, hidden, prayed to, or sung over in order to
    call northwest wind or calm southeast wind and rain.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage is both procedural and mythic-origin material; no exact available
    taxonomy family directly names weather-control rites.
- id: motif:2
  label: Mythic origin of later ritual practice
  taxonomy_refs:
  - culture_hero
  basis: Kwa'gwaeno says the practice is not recent, recounts Great-Inventor and the
    Myth people receiving instructions from nonhuman weather controllers, and the
    passage states that later humans imitate these procedures.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: 'The culture_hero taxonomy link is provisional: the named Great-Inventor
    frames and receives the procedures, while Crab, Fern, and Snail supply the specific
    techniques.'
- id: motif:3
  label: War against a personified wind
  taxonomy_refs: []
  basis: The origin story says the Myth people went to make war against Southeast-Wind,
    and Snail describes conditions of strong southeast wind and rain that his rite
    can calm.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: high
  cautions: The excerpt ends before the broader war narrative is completed.
- id: motif:4
  label: Mimetic weather action
  taxonomy_refs: []
  basis: 'The desired weather change is linked to ritual actions: warming the fern
    begins northwest wind, reddening crabs precedes a northwest-wind rite, and Snail''s
    tongue is sung as sweeping clouds from Clear-Sky.'
  evidence_refs:
  - ev:4
  - ev:6
  - ev:8
  confidence: medium
  cautions: The passage gives the ritual acts and results; the label 'mimetic' is
    an analytical description rather than a term used in the passage.
- id: motif:5
  label: Prayer to an enclosed or placed ritual being
  taxonomy_refs: []
  basis: The opening fragment instructs prayer to a shell placed in a hole, and Crab's
    method says to remove a crab from a tree hole, pray to it, and return it if the
    northwest wind is not made.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: medium
  cautions: The opening fragment is incomplete, so the identity of the shell and its
    relation to the later crab method are uncertain.
