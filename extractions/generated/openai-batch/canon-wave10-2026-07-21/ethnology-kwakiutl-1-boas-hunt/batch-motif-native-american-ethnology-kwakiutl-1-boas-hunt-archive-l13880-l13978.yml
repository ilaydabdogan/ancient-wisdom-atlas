  text: The narrator goes to Kwa'gwaeno and asks to be taught the strongest way of
    calling the northwest wind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kwa'gwaeno instructs the narrator to find a fern and dig out four roots without
    breaking them from the leafy stems.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The fern rite uses twenty dentalia, red ochre, and four split pine sticks;
    the fern is turned upside down, pierced with the sharpened sticks, fitted with
    dentalia on both sides and on its nose, tied, and painted red.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The prepared fern is placed by the house fire or on the south side of the
