canonical_text:
  quote: ''
  summary: The passage gives instructions for calling the northwest wind, especially
    through a fern rite taught by Kwa'gwaeno, and then explains the mythic origin
    of these weather-control methods. In the origin account, the Myth people prepare
    for war against Southeast-Wind. Great-Inventor asks who controls the weather,
    and personified Crab, Fern, Snail, and Land-Otter each give ritual procedures
    involving fire, shells, tree holes, song, tongues, soil, and the sea. The passage
    says later generations imitate these procedures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment instructs someone to put shells into a hole, pray to
    one shell, tell it to warn its friends to call the northwest and east winds, and
    says the northwest wind will come at once.
  category: action
  evidence_refs:
  - ev:1
