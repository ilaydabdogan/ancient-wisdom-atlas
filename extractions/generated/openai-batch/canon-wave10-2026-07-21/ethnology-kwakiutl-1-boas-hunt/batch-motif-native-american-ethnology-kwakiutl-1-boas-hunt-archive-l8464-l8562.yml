canonical_text:
  quote: ''
  summary: 'The passage gives procedural descriptions for preparing kelp-fish: drying
    it over the house fire, cutting and boiling it, serving it with oil and water,
    broiling half-dried fish over the fire, tendering it with water from the mouth,
    splitting fresh kelp-fish after a fish-trap catch, drying the split fish, boiling
    it, eating the meat while avoiding the scaled skin, washing hands, and limiting
    one preparation to household or invited groups.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kelp-fish are hung over the fire for four days until they are half dried.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For boiling, the woman uses a small kettle over the fire, cuts each dried
    kelp-fish into four pieces, and puts the pieces into boiling water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boiled fish is placed in a dish; oil is poured into an oil-dish for dipping,
    and the eaters drink water before eating.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The eaters eat the meat of the boiled fish and do not eat the skin because
    the scales remain on it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After eating, water in a bucket is used by mouth to wash the hands, and then
    water is drunk.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: For broiling half-dried kelp-fish, the woman holds the fish in tongs over
    the fire with the flesh side down first, then turns it to broil the skin side
    until it becomes black.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Broiled half-dried kelp-fish is eaten without oil because this kind is described
    as fat; the meat is taken from the skin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After broiling, the woman takes water into her mouth and blows it over the
    flesh side of the cooked fish, making it tender.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Old women and old men are said to be fond of broiled half-dried kelp-fish
    because it is tender.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: When a man returns home after catching many kelp-fish with a fish-trap, the
    woman cuts off the head, opens the fish, removes the intestines, removes and discards
    the backbone, and leaves the tail on the split fish.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The split kelp-fish is cut lengthwise, hung over the house fire, and cooked
    when half dried.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The split kelp-fish is boiled in pieces; the tail is thrown away, and the
    fish remains on the fire for more than half an hour before being eaten.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The split-kelp-fish preparation is described as not being given at a feast
    to many tribes, but eaten by husband and wife, invited friends, or the numaym.
  category: relationship
  evidence_refs:
  - ev:8
