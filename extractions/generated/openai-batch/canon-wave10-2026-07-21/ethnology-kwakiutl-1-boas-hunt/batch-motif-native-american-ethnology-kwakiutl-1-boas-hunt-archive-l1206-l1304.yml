canonical_text:
  quote: ''
  summary: 'The passage finishes a technical description of canoe mast-hole construction,
    then describes methods for making black horn spoons from mountain-goat horns:
    warming a goat head near the fire, removing horns loosened by steam, shaping and
    smoothing the horn, boiling and bending the spoon with cedar-stick supports, setting
    it in cold water, and polishing it with dog-fish skin. A second account begins
    by saying that the spoon-maker asks the mountain-goat hunter for horns because
    the hunter wants the meat and fat rather than the bones and horns.'
  language: English
  quote_policy: summarized
