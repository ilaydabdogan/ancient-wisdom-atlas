    hole with more leaves, a mat, and soil.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that this completes the steaming of viburnum-berries.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The next day, near evening, she washes the large dish, sets it by the steaming-hole,
