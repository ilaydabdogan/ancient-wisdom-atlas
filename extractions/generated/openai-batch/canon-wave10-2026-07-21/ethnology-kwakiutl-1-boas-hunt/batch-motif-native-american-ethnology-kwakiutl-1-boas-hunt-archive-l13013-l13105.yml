canonical_text:
  quote: ''
  summary: A procedural account describes how a woman steams pounded viburnum-berries
    in a plant-lined steaming-hole with red-hot stones, water, leaves, mats, and soil;
    uncovers and cools the berries the next day; then has her husband invite friends
    or numaym members while she portions the berries with oil and distributes spoons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman takes a basket to the back of the house and gathers alder-tree branch
    tips and old alder leaves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: She prepares tongs, a bucket of water, and a mat near the place where she
    will steam the pounded green viburnum-berries.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Firewood burns down while stones become red-hot; she removes remaining charcoal,
    levels the stones, and sprinkles water so ash comes off them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: She places alder tips, alder leaves, fern leaves, and skunk-cabbage leaves
    in layers in the steaming-hole, arranging the skunk-cabbage leaves so they do
    not leak.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: She pours the pounded viburnum-berries into the steaming-hole, covers them
