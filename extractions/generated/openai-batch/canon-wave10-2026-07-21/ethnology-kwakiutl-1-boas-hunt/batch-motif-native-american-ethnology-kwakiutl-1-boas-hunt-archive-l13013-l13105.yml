  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the wrapping is peeled off, the steamed viburnum-berries are described
    as reddish and looking like thick dirty water.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: She ladles all the steamed berries into a large dish, puts the dish in a cool
    place, and covers it with a mat to keep soot from falling into it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: She washes medium-sized dishes, prepares a spoon basket, and sends her husband
    to invite friends or members of his numaym to eat steamed crushed berries.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: When the invited people come in, she places dishes, oil, and the berry dish
