canonical_text:
  quote: ''
  summary: The passage gives practical recipes and food-use notes for chitons and
    the beginning of a sea-egg harvesting recipe. It describes returning by canoe
    with chitons and driftwood, cleaning chitons by cutting, removing entrails, scraping
    and washing, then preparing them raw/roasted, baked in hot ashes, or boiled. It
    also notes that chitons are normally poor people’s food but may be eaten by chiefs
    and young people in bad-weather or capsizing emergencies, when shellfish can save
    lives. The passage ends with a man preparing to spear sea-eggs at calm low tide.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man returns by canoe to his beach, throws driftwood ashore, gets a basket
    and knife from his house, and puts the basket into the chiton-catching canoe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chitons are cleaned by placing them on their backs, cutting along the belly,
    removing entrails, throwing the entrails into the water, scraping off red coloration,
    washing in salt water, and placing them in a basket.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cleaned chitons are carried into the house, and driftwood is brought inside
    and put by or on the fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: One raw or roasted method cuts the chiton into pieces, puts pieces in water,
    briefly places them in the fire with tongs, washes them, and eats them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After eating some chiton preparations, the eater rinses the mouth and drinks
    water to remove the salt taste; after the boiled preparation, very little water
    is drunk.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
- id: obs:6
  text: In the baked method, a woman uses tongs to dig a hole in hot ashes, places
    the gutted chiton in the hole, covers it with ashes, later lifts it into water,
    scrapes off ashes, removes the shell, changes the water, and washes off red-looking
    residue.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the boiled method, a woman puts a kettle of water on the fire, cleans and
    washes chitons, places them in boiling water, stirs them with tongs, and boils
    them for more than an hour.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: For boiled chitons, the woman calls friends to eat, ladles the cooked chitons
    and liquid into dishes, sets them before guests, and distributes spoons.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Chitons are described as food eaten by poor people who cannot get what the
    passage calls real good food.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Chiefs, young men, and young women are said not to eat chitons often, except
    when caught in bad weather, strong winds, long absence, or capsized canoes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: In such emergency situations, people gather chitons, large chitons, winkles,
    small mussels, large mussels, and other shellfish, and these foods are said often
    to save their lives.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The next recipe begins with a man whose spear is finished waiting for calm
    low tide in the morning and launching a sea-egg spearing canoe.
  category: sequence
  evidence_refs:
  - ev:8
