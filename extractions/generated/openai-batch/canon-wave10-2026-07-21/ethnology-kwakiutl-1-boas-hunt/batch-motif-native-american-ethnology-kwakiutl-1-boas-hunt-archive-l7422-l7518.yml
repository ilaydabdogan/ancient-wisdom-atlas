canonical_text:
  quote: ''
  summary: The passage records food-preparation and eating procedures for salmon heads
    and stomachs, fresh halibut heads and backbone, halibut tips, and dried halibut.
    It describes who prepares and serves the food, how guests eat it, handling of
    bones, use of water, oil, dishes, spoons, and food-mats, and rules about suitable
    times or manners of eating particular foods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says people do not sing while eating steamed salmon-heads, boiled
    salmon-heads, or boiled stomachs, because these foods are eaten quickly when silver-salmon
    are first trolled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stomach of dog-salmon is not eaten when first caught at the river mouth
    or when caught in the upper river; dog-salmon heads and humpback-salmon heads
    are boiled when caught in the upper river.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For fresh halibut-heads and backbone, the woman or wife prepares the heads,
    chops them on a log, breaks the backbone, places the pieces in a kettle with water,
    and boils them on the fire for a long time.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wife serves the boiled halibut in dishes with spoons and spreads a food-mat
    in front of the guests.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Guests place bones into small dishes called receptacles for the bones, later
    move those dishes to where the large dish had been, and chew and suck the bones
    for fat.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: After the halibut-head meal, the woman washes the small dishes, gives water
    for handwashing, the guests drink, and then they leave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Halibut-heads are described as unsuitable for morning eating because they
    are very fat and are said to make a person sleepy; they are eaten at noon or in
    the evening.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Halibut-tips are boiled with a little water, stirred and broken while boiling,
    boiled for a long time, and then mixed with oil either in the kettle or in dishes
    depending on how they are served.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: For halibut-tips, people drink water before and after eating with spoons;
    the food-mat is used when the boiled halibut meat is given at a feast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Halibut-tips are described as morning, noon, and evening food because they
    are not fat; a little oil is used in the morning, while at noon and evening the
    food is covered with oil.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Dried halibut is used for breakfast when there is no dried salmon; the quantity
    and number of dishes vary with the number of guests.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: During dried-halibut service, the woman sets out an oil-dish, gives fresh
    water for mouth-rinsing and drinking, and the highest-ranking guest begins by
    folding, chewing, softening, dipping the halibut in oil, and eating it; the other
    guests do the same.
  category: sequence
  evidence_refs:
  - ev:6
