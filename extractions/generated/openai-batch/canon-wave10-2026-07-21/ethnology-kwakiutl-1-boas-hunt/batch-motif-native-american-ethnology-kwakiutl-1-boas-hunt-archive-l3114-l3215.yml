canonical_text:
  quote: ''
  summary: A procedural account contrasts inexperienced and expert seal hunting, including
    night hunting at seal sleeping-rocks, then describes flounder fishing with bait
    prepared from clams and cockles, a fishing-line fitted with cross-bones and hair-lines,
    stone anchors, a cedar-wood float, later retrieval, rebaiting, and driftwood collection
    for steaming the catch.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An inexperienced seal hunter lets the harpoon-line run out; the seal hauls
    the canoe and the line becomes tangled in kelp.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An expert hunter uses the harpoon to steer the seal seaward and acts when
    the seal's breath is nearly spent.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The expert hunter hauls the seal aboard by holding its nose and fore-flipper,
    lays it across the stern, then cleans and replaces the harpoon-heads.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: At night, hunters approach known seal sleeping-rocks; when seals enter the
    water, the hunter spears them underwater where they are visible by phosphorescence.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The wife gathers clams and cockles, removes their shells, throws the shells
    into the water, and keeps the edible parts in a basket for bait.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The husband prepares a flounder-fishing line by tying cross-bones with hair-lines
    at measured intervals and baiting them with cleaned clams and cockles.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The fisherman uses elongated stones as anchors and a round cedar-wood float
    to place and mark the fishing-line in water about three fathoms deep.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: In the evening, the fisherman retrieves the float and line, removes flounders
    from the hooks, and rebaits the line.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: After rebaiting, the fisherman lets the line run out again and resets the
    stone anchor and cedar float.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The fisherman gathers dry driftwood considered sufficient to steam the flounder
    and later throws it on the beach at high water.
  category: action
  evidence_refs:
  - ev:10
