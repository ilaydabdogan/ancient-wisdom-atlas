canonical_text:
  quote: ''
  summary: The passage gives procedural accounts of steaming flounders, serving them
    to a numaym, preparing fresh cedar-branch herring-spawn, soaking and cleaning
    herring-spawn, boiling and serving it with oil, and making half-soaked herring-spawn
    into hand-sized balls for distribution.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fresh water is poured over flounders standing on edge on stones, and old mats
    are thrown over them until the flounders are done.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the flounders are uncovered, the man calls his numaym to sit around
    the steaming place and eat the steamed flounders.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After eating flounders, the men go home, wash their hands, rinse their mouths,
    and drink only a little water because they are afraid that drinking much water
    after first tasting the flounders would make them always want water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Cedar branches are put into the sea at the spawning place; the herring-spawn
    on them is eaten raw and fresh, and is not cooked in kettles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: For soaked herring-spawn, a steaming-box is placed on the left-hand side of
    the house, filled with spawn, and covered with fresh water from morning until
    noon.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Old women sit by the steaming-boxes, rub the herring-spawn, shake and draw
    it so that hemlock leaves move to the far side, skim the leaves off, and repeat
    until the leaves are removed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The cleaned herring-spawn is put into a kettle, the man calls his tribe, guests
    first eat scorched dried salmon, young men stir the kettle on the fire until boiling
    begins, and the spawn is served in dishes with oil poured over it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Guests eat the cooked herring-spawn with spoons, do not drink water beforehand
    because they have eaten dried salmon, and cool themselves afterward with fresh
    water.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Half-soaked herring-spawn is not left long in the steaming-box; it is rubbed
    before swelling, made into hand-sized balls, and portioned as two balls for each
    man, with eight balls in each dish for four men.
  category: sequence
  evidence_refs:
  - ev:5
