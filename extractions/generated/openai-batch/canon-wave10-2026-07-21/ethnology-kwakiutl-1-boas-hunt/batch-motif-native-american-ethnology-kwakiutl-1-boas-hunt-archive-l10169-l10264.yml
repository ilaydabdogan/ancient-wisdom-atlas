canonical_text:
  quote: ''
  summary: Procedural ethnographic passage describing preparation and serving of whale-tail
    and dorsal-fin blubber, capture and boiling of devil-fish, restricted invitation
    to eat devil-fish, and scorched preparation of female devil-fish arms because
    female devil-fish are not boiled or washed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Whale-tail blubber is cooked in a kettle with water over the house fire; the
    liquid is poured off, and the food is eaten while hot or reheated later.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The boiled whale-tail is restricted: not many tribes are invited, and the
    passage says only the owner eats it.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Blubber from the whale dorsal fin is cut like tail-blubber, put into boiling
    water, drained, and becomes shriveled.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman does not need to eat dorsal-fin blubber at once because it remains
    tender when cold; she stores and eats it later.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A devil-fish hunter goes at low tide, finds a devil-fish hole, probes it with
    a spear or harpoon, and waits for the implement to stop moving.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The hunter jerks the devil-fish out, strikes it on a rock, removes the entrails
    described in the passage as phosphorescence, and strikes it again to kill it completely
    and make it tender.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: For boiled devil-fish, the cook places the devil-fish in a kettle of boiling
    water over the house fire, stirs it with tongs, and boils it for about an hour.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After boiling, the devil-fish is transferred to a dish with fresh water, cut
    around the arms and stomach, stripped of loose skin, and divided into strips for
    guests.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The cook looks for four shells on each side of the devil-fish stomach, pulls
    them out, and throws them away.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Only the numaym are invited to eat devil-fish; the passage says many tribes
    are not invited.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: For scorched devil-fish, the hunter cuts off an arm, scorches both sides by
    the fire, pulls off the loose skin, and eats the arm.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Only female devil-fish are prepared by scorching in this way, because boiling
    female devil-fish is feared to cause an itchy eruption wherever the liquid touches
    the skin; female devil-fish are not washed or boiled, and the body and stomach
    are thrown out after the roasted arms are eaten.
  category: sequence
  evidence_refs:
  - ev:8
