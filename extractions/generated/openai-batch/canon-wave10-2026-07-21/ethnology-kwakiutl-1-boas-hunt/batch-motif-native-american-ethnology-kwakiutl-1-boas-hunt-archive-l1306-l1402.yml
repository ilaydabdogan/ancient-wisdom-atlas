canonical_text:
  quote: ''
  summary: A procedural account describes how mountain-goat horns are obtained by
    a hunter and then worked by a spoon-maker into horn spoons through heating, boiling
    with red-hot stones, hollowing, measuring, adzing, molding with split pine and
    spruce-root, greasing with tallow, quenching in cold water, and polishing with
    dogfish-skin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hunter kills mountain-goats, removes tallow, kidney-fat, meat, and horns,
    and carries the horns down from the mountain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hunter gives the horns to the spoon-maker.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The spoon-maker gathers stones, builds up a fire, places stones on it, sets
    a steaming-box beside the fire, and half-fills it with water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Red-hot stones are put into the water in the steaming-box until the water
    boils.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The horns are put into the boiling water, then handled with tongs and cedar-bark,
    struck against firewood, and the inner core is removed so that the horn becomes
    hollow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The hollow horn is measured by finger-widths, notched, and adzed into a rounded,
    hollow spoon shape.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Red-pine sticks are split, cut to one span in length, and prepared with soaked
    split spruce-root as spoon-moulds.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The adzed horns are reheated in boiling water and placed between the legs
    of the spoon-moulds while pliable.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The molded spoons are boiled, rubbed with mountain-goat tallow, and thrown
    into cold water because the maker wants them to become brittle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The roots are untied from the moulds, and dogfish-skin is used to polish the
    spoons inside and outside until finished.
  category: action
  evidence_refs:
  - ev:7
