canonical_text:
  quote: ''
  summary: The passage gives procedural descriptions for cooking and serving salmon-heads,
    making mush of boiled salmon-heads, preparing milky salmon-spawn, and beginning
    a description of winter-aged salmon-spawn called clayey. It describes household
    preparation, invited guests, serving portions, eating practices, handwashing,
    water drinking, boiling, stirring, use of oil, and storage-related change in salmon-spawn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies dog-salmon, humpback-salmon, silver-salmon, and other
    salmon as fish whose heads are cooked when first caught.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: For boiled salmon-heads, a husband/man puts water in a kettle while the wife
    removes gills, places salmon-heads in the kettle, covers them with an old mat,
    and puts the kettle over the fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Guests chosen from the tribe are invited while the salmon-heads are cooking.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman serves dishes and spoons, and the salmon-heads are counted so that
    each man receives two heads, with eight heads in a dish for four men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The guests eat the skin of the salmon-heads, suck the bones, throw the sucked
    bones into an empty dish, and then eat the edible part of the heads by hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the meal, the man removes the dish of bones, pours the bones into the
    kettle, washes the dishes, provides water for handwashing, draws water for drinking,
    and the guests leave.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mush of boiled salmon-heads differs from the earlier preparation by omitting
    the old mat cover and by boiling and stirring the heads for a long time until
    they fall apart.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mush of boiled salmon-heads is served in a dish with spoons; there are hardly
    any bones to blow out because the heads have been boiled to pieces, and no oil
    is taken with it.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Milky salmon-spawn is made by putting salmon-spawn into a kettle, adding water,
    stirring until the liquid is milky, warming and boiling it while stirring with
    a long-handled ladle, and then serving it with oil.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Diners drink fresh water before and after eating milky salmon-spawn; the food
    is eaten at noon and in the evening, not in the morning, because it is said to
    make people sleepy due to its fat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: When milky salmon-spawn lasts until winter it is called clayey, and old men
    are invited at noon or in the evening by the owner.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: For the winter clayey spawn, the owner cleans a kettle, sets it by the storage
    box, and uses a large clam-shell to dip rotten-smelling spawn into the kettle
    until it is half full.
  category: action
  evidence_refs:
  - ev:6
