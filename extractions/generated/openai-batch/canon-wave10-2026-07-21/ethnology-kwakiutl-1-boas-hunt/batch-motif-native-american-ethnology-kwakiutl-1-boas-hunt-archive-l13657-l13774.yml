canonical_text:
  quote: ''
  summary: The passage records several Kwakiutl customs and prohibitions concerning
    food, canoe-building, root and berry gathering, cedar-bark harvesting, tree felling,
    and a prayer after digging cinquefoil roots. It describes avoidance of a dangerous
    sea creature, abstinence and protective painting during canoe-building, age restrictions
    for digging fern roots, rules for eating currants, partial stripping of cedar
    bark, ritual speech and chip-throwing before felling a cedar for a canoe, and
    a canoe steersman's prayer to his digging-house.
  language: English
  quote_policy: summarized
