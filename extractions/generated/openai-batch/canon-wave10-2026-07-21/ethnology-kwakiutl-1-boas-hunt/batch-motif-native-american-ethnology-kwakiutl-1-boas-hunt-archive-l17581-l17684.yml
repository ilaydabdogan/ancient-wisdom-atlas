canonical_text:
  quote: ''
  summary: 'The passage describes several Kwakiutl social customs: a destructive fire-related
    feast ending with oil-soaked floors and returned feast-dishes; the winter Feast
    of Qot!xole, in which berries mixed with oil are prepared, served, and partly
    eaten; and chiefly marriage customs involving a princess, status names, marriage
    debt, canoes, coppers, abalone regalia, and the public dressing of a son-in-law.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A feast episode includes a nearly burned house, burned roof-boards, and scorched
    house-dishes, described as occurring when chiefs are very angry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the fire-related feast action, people go out, the floor is soaked with
    oil, and the host's numaym returns house-dishes and a small canoe used as a feast-dish
    to their owners.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In winter, the owner of the qot!xole intends to give his people a feast of
    berries mixed with oil and sends young men of his numaym to call guests.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The host's wife places dishes, spoons, and shredded cedar-bark near her place
    and wipes out the dishes and spoons while the husband clears the house, spreads
    mats, and brings out the box of berries and oil.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young men call four times; the guests enter and sing four ordinary songs
    rather than feast-songs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Young men place small portions of oil and berries in dishes, set one dish
    before each four men, and distribute spoons.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The guests begin to eat the oil and berries, but they never eat all of it
    because it is difficult to eat and swallow; afterward they go out.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The princess of Chief £maxuyalidze is described as marrying when K' !edele£laku
    comes out from the place where she has been sitting still.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: If the princess becomes wife of a real chief, she has the name modzll/modzil;
    if her husband is a common man, she remains her father's princess and is not called
    modzil as the common man's wife.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the princess marries a chief, her father pays the marriage debt and gives
    the husband a name, food, and canoes; the practice is called paying-the-marriage-debt
    and sitting-in-the-canoe-of-the-princess.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The princess appears beside her father wearing an abalone-covered blanket
    and an abalone-covered hat, both described as heavy.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The chief refers to a weight from family history, mentions the chieftainess
    carrying the copper, and tells his son-in-law that he will dress him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The father-in-law gives or promises the son-in-law the chieftainess's abalone-covered
    blanket, hat, and copper, and places abalone ear-ornaments and a nose-ornament
    on him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The chief tells the son-in-law that he has changed his chief's dress and that
    the chieftainess is his wife.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: The son-in-law tells his numaym that his whole chief's dress has been changed
    by his father-in-law and that his wife now has no dress; the property paid as
    marriage debt is carried into his house and later given away to all the tribes.
  category: sequence
  evidence_refs:
  - ev:11
