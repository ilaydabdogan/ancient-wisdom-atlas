canonical_text:
  quote: ''
  summary: 'The passage describes a called-in woman dancing before her father promises
    a feast, followed by procedures for huckleberry and viburnum-berry feasts: preparation
    of dishes, spoons, mats, berry and oil containers; repeated invitations; singing
    by guests; serving berries mixed with oil; use of named house-dishes; and ranked
    distribution to chiefs and tribes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Guests announce that a woman has been called in; she enters and stands at
    the rear of the house between the feasters and the central fire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman's father asks the songleader to sing his daughter's song; the guests
    sing, the woman dances, and her father promises a feast to his tribe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For the huckleberry feast, the husband and wife place huckleberry dishes and
    spoons at the left-hand side of the door, while the husband clears the house and
    spreads mats.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The huckleberry-feast host calls the tribe; two young men from his numaym
    make another call; the calling formula names the huckleberries of Breakfast-Food-Giver;
    four calls are required.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the huckleberry feast, dishes are filled half with huckleberries and half
    with oil; spoons are distributed, dishes are set before six men, and the guests
    eat until all berries and oil are gone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The viburnum-berry feast is described as next in greatness to the oil feast,
    and above the seal feast; it uses named house-dishes including killer-whale, hair-seal,
    whale, sea-lion, beaver, grizzly-bear, wolf, Dzo'noq!wa, and double-headed serpent
    dishes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The viburnum-berry feast is connected with a winter dance where all tribes
    gather and are invited by the person who will give the feast.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: For the viburnum-berry feast, berry boxes and oil boxes are placed inside
    at the left-hand side of the door; house-dishes are left outside; small dishes,
    spoon baskets, and mats are arranged for the guests.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: After four calls, viburnum-berry guests enter and sing great feasting-songs;
    members of the host's numaym sit together and young men bring in four house-dishes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Viburnum-berries are poured into house-dishes and small dishes, oil is poured
    over them, chiefs receive large spoons, the host's speaker asks chiefs to eat
    all the berries, and young men carry house-dishes to the first-ranked tribe.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
