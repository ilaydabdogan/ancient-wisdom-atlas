canonical_text:
  quote: ''
  summary: The passage reports deaths associated with Yayaxiiyega and her statements
    about souls, explains the soul as like a shadow that sits on the head and travels
    during sleep, and describes Qasnomalas diagnosing a sick princess as having no
    soul and preparing a communal shamanic rite to recover it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yayaxiiyega's brother MamEnlayee, whom she referred to as her lover, is asleep
    and depressed; after being called to the roof by his father, he slips, falls through
    the roof, and is killed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After MamEnlayee's death, Yayaxiiyega says that his soul had gone home long
    before, and she herself dies not long afterward.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yayaxiiyega tells the narrator that the soul is like a person's shadow on
    the ground in sunlight; it is small when seated on the head during the day and
    big when it travels during sleep.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yayaxiiyega tells her mother Laexas that she will go home and take the souls
    of her three elder sisters; she dies three days later, the sisters die within
    less than one winter, and the parents soon follow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Qasnomalas is introduced as a great shaman and as a chief of the numaym SisEiiL!e£
    of the Nak!wax'da£xu.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Lanax'lanag'Eku, princess of Tslageyos, is very sick; her grave-box has already
    been made, and people are about to wrap her body.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Qasnomalas feels the top of the sick woman's head and says she has no soul
    because it flew away long ago; he says he will try to get it back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Qasnomalas instructs that the house be cleared, four kinds of sweet food and
    four pretty dishes be obtained, some of the sick woman's clothing be put with
    them, and young women not be allowed to come because they might be menstruating.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Adult men and women of the Gosg'imuxu and Nak!wax'da£xu are called into the
    cleared house, while young men and young women are excluded because their condition
    as lovers or menstruating persons is said to make the sick woman worse.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A long narrow board is placed between two facing rows of men, batons are distributed,
    eagle-down is placed on the rows, and the sick woman is put on a new mat in front
    of the outer row.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The participants beat fast time four times; Qasnomalas then enters carrying
    his rattle, stands silently, looks at the sick woman, and calls named helpers
    to aid him.
  category: sequence
  evidence_refs:
  - ev:8
