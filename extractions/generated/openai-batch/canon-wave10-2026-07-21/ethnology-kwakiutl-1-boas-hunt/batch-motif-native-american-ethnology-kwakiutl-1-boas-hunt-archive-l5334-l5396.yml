canonical_text:
  quote: ''
  summary: 'The passage describes a woman processing salal-berries: cleaned berries
    are placed in a mortar-box, pounded with a stone hammer until they burst, poured
    into a dish, left covered for two nights, and then prepared as long dried strips
    on a drying-frame lined with heated skunk-cabbage leaves and shaped with a clam-shell,
    spoon, and cedar crosspieces.'
  language: English
  quote_policy: summarized
