  summary: A procedural account describes butchering a seal, collecting and preparing
    its organs, blubber, intestines, and blood, and cooking the parts in kettles by
    the fire. The passage ends by naming the prepared blood dish “blood-soup” and
    noting that an expert cook removes it before it boils.
