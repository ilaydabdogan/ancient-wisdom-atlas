canonical_text:
  quote: ''
  summary: The passage gives procedural accounts of preparing, steaming, serving,
    boiling, and gathering chitons. It describes soaking and scraping chitons, building
    a steam-cooking arrangement with driftwood, stones, kelp, fern, skunk-cabbage,
    and mats, serving spitted chitons in limited portions, inviting a numaym for boiled
    chitons, and gathering large chitons by canoe at low water. It also states which
    named groups eat chitons and that the Kwakiutl do not.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman puts chitons into fresh water, leaves them four days, scrapes off
    the green covering with a fish-knife until they are white, and leaves them overnight
    in fresh water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For steaming, the woman gathers driftwood, stones, kelp, skunk-cabbage, and
    old fern; her husband cuts red-pine sticks into pointed spits.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each chiton is put on its own red-pine spit before steaming.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man removes unburned driftwood, layers kelp, old fern, and skunk-cabbage
    over red-hot stones, puts the spitted chitons on top, makes holes, pours water
    on, and covers the whole with leaves and mats.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After about four hours the steamed chitons are served to people who are called
    to eat; each person receives one spit, and no one receives two because the chitons
    are salty and may cause diarrhoea if many are eaten.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says chitons are not eaten by the Kwakiutl and are eaten only
    by the Seaward-Dwellers, Koskimo, Gwats!enoxu, G'ap!enoxu, and L!asq!enoxu.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: For boiled chitons, the woman sends her husband to invite his numaym, boils
    the chitons until the skin comes off, serves them in a dish with fresh water,
    and does not include the boiling liquid.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Guests eating boiled chitons use their hands, peel off shells and guts into
    the dish, wash their hands in the food water, and then go out.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A man who wants large chitons launches a small canoe at low water, goes to
    a known chiton place, lands on a stony beach, gathers chitons into the canoe,
    paddles back, and gathers driftwood.
  category: sequence
  evidence_refs:
  - ev:8
