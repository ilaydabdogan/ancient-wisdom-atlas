canonical_text:
  quote: ''
  summary: 'The passage describes a woman processing speared salmon: she places cut
    salmon in a basket, carries it to the beach and house, hangs it on drying-poles,
    shields it from heat with boards, checks it until half dry, then hangs it again
    spread out. It also distinguishes fat salmon speared at the river mouth from less
    fat upper-river salmon and says that the woman gathers salmon slime and other
    byproducts and pours them into the water at the river mouth.'
  language: English
  quote_policy: summarized
