canonical_text:
  quote: ''
  summary: 'The passage describes a mountain-goat marriage-feast: dried brisket, sides,
    and stomach-fat are given in a marriage-present context, soaked in a canoe, cooked
    for assembled guests using red-hot stones in water-filled oil-boxes, eaten with
    singing, and followed by distribution of stomach-fat on cedar sticks for guests
    to take to their wives and melt at home. The feast is described as important to
    many tribes and connected with a myth about it and the seal.'
  language: English
  quote_policy: summarized
