canonical_text:
  quote: ''
  summary: A procedural description explains how an unnamed maker measures, marks,
    cuts, and prepares a cedar oil-box, then collects stones from the beach, places
    them by and on the fire, positions the box near the fire, and begins digging a
    ground hole with his wife's clam-digging stick.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The maker splits a cedar stick to about little-finger thickness, squares one
    end, measures three spans, and cuts it to length for use as a measure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maker uses the cedar measure and a straight-edge to mark the oil-box board,
    then adzes and cuts along the marks so the board edges are straight and the width
    is three spans.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The maker prepares a two-span cedar measure, finds the center of an end of
    the box, checks the slant with a beveled stick, and cuts off a slanting end with
    a straight knife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The maker prepares thin flat cedar measures, including one three spans long
    and another described as two spans and two finger-widths, for marking the box.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The maker alternates short and long cedar measures with a straight-edge to
    mark where short sides and long sides are to be bent and where the two ends of
    the oil-box will meet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The maker uses a straight knife to cut out the marks for bending the sides
    and to cut out the ends.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The maker takes a basket to the beach of the house, fills it with stones,
    carries them on his back into the house, pours them beside the fire, and repeats
    until he has enough stones.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The maker rakes up the fire, puts the stones on top of it, and places the
    box he is making close to the fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: After marking points on the floor near the corner marks of the oil-box, the
    maker uses his wife's clam-digging stick to dig soil; the hole is as long as the
    box is wide and one span wide.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage explicitly relates the clam-digging stick to the maker's wife
    by possession.
  category: relationship
  evidence_refs:
  - ev:8
