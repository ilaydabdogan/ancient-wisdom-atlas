canonical_text:
  quote: ''
  summary: The passage describes preparation and serving of seal insides and blood-soup,
    ranked distribution of seal blubber and body parts at seal-feasts, rapid eating
    of long blubber strips by common people, and a method for boiling seal blubber
    with heated stones in oil-boxes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boiled seal blood is prepared as a thick soup when cooked properly, and is
    served with seal insides.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cook removes seal insides from a kettle with tongs, places them on boards,
    and portions pieces of blubber, tongue, kidney, liver, lungs, heart, and braided
    intestines for the diners.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Only chiefs are invited to eat the insides of seals, and blood-soup is generally
    given with them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A smaller seal-feast may involve four to ten seals, while a great seal-feast
    may involve eighty to one hundred seals and many tribes.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Specific seal portions are assigned by rank: hind-flippers to young chiefs,
    fore-flippers to the next ones, the chest to head chiefs, and long strips of blubber
    to common people.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Recipients of long strips of blubber put a strip around the neck, bite the
    blubber from the skin, swallow it quickly, discard the skin, and may ask for another
    strip.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: People considered expert at this eating can consume six long strips of blubber
    and are proud of the amount eaten.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Chiefs do not eat fast in the same way as the common people because they eat
    the limbs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the feast of long strips of blubber, those who bolted seal blubber wash
    themselves because they are covered with oil from wearing the blubber around the
    neck.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Seal may also be boiled with stones; unlike the horse-clam method, no hole
    is dug for heating the stones when steaming seal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Oil-boxes are placed near heated stones, partly filled with water, and prepared
    with tongs and mats before red-hot stones are used.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: Young men of the owner's numaym use tongs to put red-hot stones into the water,
    add long strips of blubber, place stones on top, and cover the boxes with mats
    so that the water does not boil over.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: After boiling, the mats are removed, the blubber is taken out with tongs onto
    cutting-boards, and the eaters are called.
  category: sequence
  evidence_refs:
  - ev:6
