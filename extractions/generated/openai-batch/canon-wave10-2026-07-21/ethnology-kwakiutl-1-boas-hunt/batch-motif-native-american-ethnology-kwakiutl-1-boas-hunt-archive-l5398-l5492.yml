canonical_text:
  quote: ''
  summary: The passage gives a procedural account of drying pounded salal-berries
    into cakes on frames over an alder-wood fire, turning and drying them, packing
    the dried strips into a small box with prepared skunk-cabbage leaves, storing
    them until winter, and noting their ceremonial and feast consumption. It then
    begins a section on currants, describing cleaning currants and gathering twelve
    stones from the beach.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman lays or works pounded salal-berries on drying-frames and may have
    many frames when salal-berries grow well in summer and she has picked industriously.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman asks her husband to help place the salal-berry cakes on frames just
    over the fire; each takes one end of the frame.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The husband builds up the fire with very dry alder-wood, which is said to
    give no sparks and to make a hot fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The drying-frames are watched so that they do not catch fire, and the cakes
    are left over the fire for no more than about two hours at this stage.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The cakes are stacked, turned over onto empty drying-frames, placed again
    over the fire, and heated skunk-cabbage leaves that stick to the frames are peeled
    off and discarded.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: All the salal-berry cakes are said to dry in one day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The woman dries the inside of a small square box beside the fire, puts out
    the fire, and folds strips of salal-berry cake into the box.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: New skunk-cabbage leaves are heated, their thick middle veins are cut out
    with the husband’s crooked knife, and the leaves are dried further before being
    tucked tightly over the salal-berry cakes in the box.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The box is covered, tied down, placed where heat from the fire reaches it,
    and left there until winter.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Cannibal dancers and head chiefs are described as wishing to eat long salal-berry
    cakes in connection with a winter ceremonial.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Poor people of the tribe are said to eat salal-berries mixed with elderberries
    when these are given at a feast.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The currant section begins with the woman removing branches and skunk-cabbage
    covering from currant baskets, spreading a mat, cleaning currants into a dish,
    and then gathering twelve stones from the beach.
  category: sequence
  evidence_refs:
  - ev:7
