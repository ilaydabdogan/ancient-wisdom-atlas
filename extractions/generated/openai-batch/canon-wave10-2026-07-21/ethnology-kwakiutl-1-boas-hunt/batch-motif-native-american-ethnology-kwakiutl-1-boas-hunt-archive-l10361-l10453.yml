canonical_text:
  quote: ''
  summary: The passage gives procedural recipes for boiled, roasted, and baked sea-slugs,
    including cleaning, soaking, cooking with water, fire, ashes, and implements,
    serving to guests, and seasonal comments. It then begins a procedure for gathering
    and roasting chitons using baskets, hemlock branches, and a peeling instrument.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman cleans sea-slugs by squeezing out their insides, puts them into a
    basket, carries them into the house, and places them in a corner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sea-slugs are placed in a low steaming-box with fresh water over them and
    left there for two nights before boiling.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man prepares a kettle half full of water over the fire, brings hemlock branches,
    and sets the steaming-box and tongs by the fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wife squeezes liquid from each sea-slug before putting it into boiling
    water, while the husband stirs with tongs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the sea-slug water begins to boil over, the man throws handfuls of dirt
    from the house floor into the kettle to stop it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cooked sea-slugs can be held with tongs and have rough or stiff skin; raw
    sea-slugs are slippery and difficult to grasp.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The man washes the boiled sea-slugs and gives them to guests to eat; after
    enough are eaten, portions are taken to the guests' wives.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that sea-slugs are eaten in winter when they are good,
    and are bad in summer.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: For roasted sea-slugs, the woman places soaked sea-slugs by the house fire,
    turns them until stiff, removes them with fire-tongs, scrapes off ashes with a
    cedar-stick, squeezes out water, and gives them to eaters.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: For baked sea-slugs, the woman places sea-slugs in a hole dug in hot ashes,
    covers them, waits about half an hour, removes them with fire-tongs, and then
    follows the roasting procedure.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The chiton section begins with a woman taking a basket, flat-pointed hemlock
    branches, and a peeling instrument to lift chitons from rocks into her basket.
  category: action
  evidence_refs:
  - ev:7
