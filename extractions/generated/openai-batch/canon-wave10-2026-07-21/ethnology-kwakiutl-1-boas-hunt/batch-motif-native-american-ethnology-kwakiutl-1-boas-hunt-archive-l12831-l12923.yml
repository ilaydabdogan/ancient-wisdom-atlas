canonical_text:
  quote: ''
  summary: The passage gives procedural descriptions of cleaning huckleberries, preparing
    and serving mashed huckleberries at an invited feast, cleaning small amounts of
    huckleberries by blowing, and serving preserved viburnum-berries mixed with water
    and oil in a household setting followed by dry roasted salmon and water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman pours huckleberries onto a wet cleaning-board; the berries roll down
    to a mat while leaves stick to the board.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After huckleberries are cleaned, the woman calls her husband; they carry the
    board outside and lay it flat to dry so the leaves fall off and are blown away
    by wind.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: For mashed huckleberries, a woman asks her husband to invite many people of
    different tribes, and two young men are sent to call the guests repeatedly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The house for the mashed-huckleberry meal is cleaned, mats are spread, oil,
    dishes, and spoons are set ready, guests enter, feast songs are sung, and the
    host's numaym helps put huckleberries into dishes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dishes are half-filled with huckleberries, the berries are mashed by hand,
    oil is poured over them, spoons are distributed, and dishes are placed before
    groups of six men who eat until the food is finished.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the mashed-huckleberry feast, the guests leave the house and do not
    drink water afterwards.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: When a woman has only a half-full basket of huckleberries, she asks men seated
    outside to blow at the berries; they take handfuls, move the berries from hand
    to hand, blow off leaves, and eat them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Blown huckleberries are described as cooling when eaten on a warm day.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Viburnum-berries mixed with water and oil are described as food for a household
    rather than a large invited gathering.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In winter, when the oil has thickened, a woman opens the berry box, dips through
    the water-and-oil layer to reach the viburnum-berries, and serves the mixture
    in a small dish with spoons.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The viburnum-berries stick together in clumps because of the thick oil, and
    nothing is blown out while eating because the berries have been cleaned well beforehand.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: After eating viburnum-berries with oil and water, the woman roasts dry salmon
