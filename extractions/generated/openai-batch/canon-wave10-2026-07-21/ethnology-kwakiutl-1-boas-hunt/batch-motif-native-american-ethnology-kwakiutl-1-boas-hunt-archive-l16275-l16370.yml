canonical_text:
  quote: the body is the house of the soul
  summary: The passage describes a shamanic soul-recovery rite led by Qasnomalas.
    Four women are ritually adorned and placed at the corners of the house. A grave-box,
    blankets, clothing of the sick woman, and dishes of sweet food are brought and
    burned in the central fire while the shaman sings, rattles, and is accompanied
    by time-beaters. Qasnomalas identifies and catches the correct soul among other
    waiting souls, places it on the sick woman's head, blows and presses the head,
    and the woman comes back to life. In a later conversation, he explains that supernatural
    power directed him and that souls are small, mobile, house-less beings whose resting
    place is the body.
  language: English
  quote_policy: quoted
