canonical_text:
  quote: '"the feast-name is like the winter-name"'
  summary: 'The passage describes Kwakiutl feast customs: ceremonial name changes,
    oil-feast status names, shame when names are not called, breaking coppers, marriage
    and family-name rules, inherited privileges, formal speeches, ancestral seating,
    drum-led songs, food distribution, and guest thanks to the host chief.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: During the winter ceremonial, men and women change their names; the passage
    says the feast-name is like the winter-name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At an oil feast, the chief's speaker calls the feast-names of chiefs who have
    given an oil feast and does not call those without feast-names.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chiefs whose names are not called are said to be ashamed, and chiefs who are
    guests generally break coppers to cover their shame.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The breaking of coppers in this context is called "extinguishing the fire
    of the oil feast."
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: After the feast, men go out and no longer have their feast-names; they are
    then called by their potlatch-names, described as true family names.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Names obtained in marriage are put away after blankets have been given away;
    the passage gives the example of the chief again having the name YaqoLadze.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A name given in marriage can be passed to the husband of a princess, but family
    names and privileges are kept for the eldest son.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: When the chief of the numaym SenLtem invites other Kwag'ul numayms, his speaker
    faces his own numaym and then the guests while delivering formal words of welcome.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The guests are invited to sit in seats described as the seats of their late
    fathers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The speaker says the speech practice in the chief's house was marked out by
    ancestors and asks that a drum be given to the chiefs so they may sing.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: Young men carry the drum to the rear of the feasting-house, several numayms
    sing feasting-songs in sequence, and the drum is later put down inside the door.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Young men prepare food, put dishes before the guests, and the guests begin
    eating.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: A guest-side speaker thanks the host chief, asks him not to let the fire of
    his house go out, and says the guests are treated with sweet food.
  category: speech
  evidence_refs:
  - ev:5
