canonical_text:
  quote: ''
  summary: The passage describes preparation and eating procedures for carrots, sea-milkwort
    roots, and the beginning of a lily-bulb feast preparation. It contrasts old-time
    carrot steaming with present kettle boiling, details washing and stone-assisted
    steaming of sea-milkwort roots, notes their sleep-inducing effect and household-only
    use, and describes a winter-dance context in which an owner of lily-bulbs promises
    a lily-bulb feast to the Sparrow Society and prepares stones, fire, water, dishes,
    tongs, and baskets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the old-style carrot meal, steamed carrots are placed into many dishes,
    oil is poured over them, and no more than four men eat from each dish.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Carrot diners take the carrots with the right hand, put them into the mouth,
    take leftover portions to their wives when satisfied, and later drink water after
    washing their hands.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage contrasts old-time carrot steaming with present-day boiling in
    kettles on the house fire, and says carrots are not eaten raw because of strong
    taste and diarrhea.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sea-milkwort roots are brought home in a basket, washed in a dish of water
    to remove sand, and placed on a small mat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: For sea-milkwort cooking, pebbles are collected from the beach, placed in
