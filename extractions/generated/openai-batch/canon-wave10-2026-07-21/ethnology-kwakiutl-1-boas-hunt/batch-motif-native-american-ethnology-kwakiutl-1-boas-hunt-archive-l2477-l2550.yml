literal_observations:
- id: obs:1
  text: A carrot digging-stick is completed by treating the end with melted tallow,
    dipping it in cold water, and making the end brittle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a cryptochiton digging-stick, a man obtains a curved yew branch, cuts
    it to a measured length, flattens and thins one side, removes bark and sap, and
    smooths a rounded point.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The cryptochiton digging-stick is further treated by warming its flat end
    in ashes, rubbing deer-tallow on both sides, heating it by the house fire, and
    cooling it in a house corner until the point is brittle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A devil-fish hunter makes a hook or pole from a long young hemlock, removes
    branches and bark, measures the wood, sharpens an end, and cuts a notch near the
    thick end.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A separate hemlock piece is shaped for the devil-fish hook and fitted into
    the notch with split spruce-root.
  category: action
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:6
  text: The second devil-fish hook account describes a long hemlock pole and a shorter
