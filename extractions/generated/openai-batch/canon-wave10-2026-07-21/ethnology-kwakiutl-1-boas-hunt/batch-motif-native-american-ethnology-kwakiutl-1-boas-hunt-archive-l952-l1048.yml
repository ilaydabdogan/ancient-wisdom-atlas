canonical_text:
  quote: ''
  summary: The passage gives practical instructions for finishing an oil-box, sewing
    split boards with cedar-withes, and caring for canoes. It describes drilling,
    pegging, oil-sealing, seasonal use for berries, cooperative board sewing, canoe
    treatment with water, urine, red-hot stones, charcoal, perch-oil, cedar supports,
    and protective wetting or covering against sun and cold wind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A box maker drills slanting holes through the side and bottom boards, wets
    pegs with saliva, and drives the pegs into the holes with a stone hammer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The peg holes are made around the bottom of the oil-box, with each new hole
    placed about three finger-widths from the previous one.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The oil-box is made when winter is over and just before the olachen run in
    Knight Inlet.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Oil is put into the oil-box first so that oil fills the pegged edge of the
    bottom and makes the box tight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the time for picking viburnum berries comes, the oil-box is empty and
    berries are put into it; the berry juice does not run out even if left in the
    box for a whole winter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: For sewing with cedar-withes, a man drills slanting holes through the edges
    of two split boards placed side by side and cuts grooves for the withes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The cedar-withe is pulled, twisted, passed through successive holes, and hammered
    into grooves with a diabase pebble while another man pulls it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The text states that working at boards always requires two men.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In caring for a canoe, the canoe-builder pours eight buckets of water and
    two buckets of urine into a small canoe, then puts red-hot stones into it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The stated reason for putting urine into the canoe is to keep it from splitting
    from the heat of the sun after the canoe-builder finishes it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The canoe-builder burns a rush mat, lets charcoal fall into a steaming-box,
    crushes the charcoal to dust, mixes it with perch-oil into a thick paste, and
    rubs the mixture over the outside of the canoe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says that a canoe blackened outside with oil mixed with charcoal
    does not need an outside sun-protector because the heat of the sun does not go
    through.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: After blackening, the canoe is turned right-side up, cedar supports and short
    cedar boards are placed on it, and fresh water is poured in to keep the inside
    cool.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: When the weather is hot, the canoe owner sprinkles water inside the canoe
    in the morning; if short boards are absent, young cedar branches are placed along
    the seats.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The cedar boards or young cedar branches are used so that sun and cold winter
    winds do not pass through, since cold wind cracks the inside of the canoe.
  category: attribute
  evidence_refs:
  - ev:7
