canonical_text:
  quote: ''
  summary: The passage describes a procedure for steaming barnacle-stones on red-hot
    stones with driftwood, salt water, and old mats; removing the barnacles into baskets;
    carrying them home by canoe; and serving them at a household feast where invited
    people use cedar sticks to extract and eat the edible parts. It also begins a
    second method of preparing barnacles by burning them on level sandstone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman gathers many barnacle-stones, prepares driftwood pieces, removes firebrands
    from red-hot stones, and builds a driftwood enclosure around the steaming place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman levels the red-hot stones, places barnacle-stones on them, heaps
    the barnacle-stones thickly, pours salt water over them, and covers the steaming
    pile with old mats.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: After the steaming period, the woman removes the mat covering, lets the contents
    dry and cool, washes large baskets in salt water, and removes barnacles from the
    stones into the baskets.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The passage notes that this method is slow enough that the tide often rises
    to the place where the barnacle-stones are being steamed.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman carries the baskets of barnacles, mats, and bucket aboard her old
    barnacle-canoe, returns to her house, lands the canoe stern first, and ties the
    anchor-line to a beach stone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Her husband clears the house, spreads mats on the floor, invites his tribe
    to eat the barnacles, prepares narrow eating mats, and distributes short cedar-stick
    pieces to the eaters.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The host carries the baskets of barnacles into the house and pours the barnacles
    along the mats in front of those who will eat them.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The barnacle-eaters hold barnacles in the left hand, use a cedar-stick in
    the right hand to push at the barnacle eye, bite off and eat the lower end, then
    rinse their mouths with water to remove the salt taste.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: After the feasters leave, the host gathers empty shells into a mat and throws
    them out of the house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A second method begins by describing burning barnacles on level sandstone;
    the woman prepares a large basket, split cedar-sticks tied with cedar-bark, a
    yew-wood clam-digging stick, and matches.
  category: sequence
  evidence_refs:
  - ev:8
