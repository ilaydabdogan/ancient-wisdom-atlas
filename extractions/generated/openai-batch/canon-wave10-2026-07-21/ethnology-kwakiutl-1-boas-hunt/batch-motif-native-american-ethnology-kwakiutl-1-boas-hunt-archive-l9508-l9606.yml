canonical_text:
  quote: ''
  summary: 'The passage gives procedural accounts of steaming cut skin underground
    with skunk-cabbage, boiling mountain-goat meat for guests, and processing porpoise
    after hunting: landing the porpoises, washing blood from the canoe, butchering,
    assigning the head and tail to the steersman, boiling organs and blubber for fellow
    hunters and the steersman, and the steersman boiling head and tail for other steersmen.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cut skin is placed in an underground hole with hemlock branches and skunk-cabbage
    leaves; holes are poked through the leaves, water is poured in, the pit is covered
    with soil, and the food is left overnight and eaten hot in the morning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fresh mountain-goat hind-leg meat is cut into pieces, put in a kettle with
    water, boiled over a fire, and served to guests on boards.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Guests skim boiled blood from the mountain-goat kettle with spoons and eat
    it before the meat is served.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After porpoises are brought to the beach, the hunter removes items from the
    canoe, washes blood out of the canoe, and places it above high-water mark.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The hunter cuts the porpoise, removes organs including kidney, tongue, lungs,
    and liver, and throws the intestines into the sea.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The porpoise head and tail are given to the steersman as his return for steering.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tongue, kidney, liver, stomach, and strips of blubber are boiled as “boiled
    insides” and served to fellow hunters and the steersman.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: After eating porpoise portions, participants leave and wash their hands in
    their houses.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The steersman boils the porpoise head and tail for his friends, the steersmen
    of the other hunters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the butchered porpoise has remained in the house for one night, it is
    cut into pieces and the blubber is removed.
  category: sequence
  evidence_refs:
  - ev:7
