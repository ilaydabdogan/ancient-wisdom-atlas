canonical_text:
  quote: ''
  summary: 'The passage gives procedural accounts of women gathering roots and bulbs:
    carrying and cooling roots, digging lupine roots in spring, washing and eating
    them with family, experiencing intoxication-like effects from eating too many,
    digging carrots from grassy rocks, and digging lily-bulbs from beach sand with
    specialized tools.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A filled basket of roots is carried home and set inside the house door to
    keep the roots cool and prevent them from drying.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lupine-root gathering is timed to spring, when salmon-berries begin to bud
    and olachen first arrive at Knight Inlet, a period described as hungry for the
    tribes arriving there.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman takes a digging-stick, basket, woven cedar-bark belt, and back-protecting
    mat to the flats behind the olachen fishermen’s houses.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: For lupine roots, the woman fastens the back-protecting mat with a belt, sits
    on the mat, pries the roots from clay with the digging-stick, and puts the roots
    into her basket.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the lupine-root basket is full, she carries the basket home in one hand
    and the digging-stick in the other, then puts the stick upright beside the door.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: At home, she washes lupine roots in fresh water in a small dish before eating
    them with her husband and children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Eating lupine roots for some time causes dizziness described as like drunkenness;
    eating too much causes heavy eyes, sleepiness, bodies like dead, sleep, and later
    recovery on waking.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Carrots are gathered on grassy rocks at points of land, especially where the
    woman knows many carrots grew in the previous season.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: For carrots, the woman uses a yew-wood digging-stick, also called a peeling-stick
    by some women, to peel grass and roots from the rock and expose carrots, which
    she puts into her basket.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After filling the carrot basket, she carries it on her back, uses the peeling-stick
    as a walking-stick, returns home, and puts the load on the floor beside the fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A man gives a finished lily-bulb digging-stick to his wife before she goes
    out to dig lily-bulbs.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: For lily-bulbs, the woman eats before leaving, takes a back-protector, cedar-bark
    belt, new basket, and digging-stick, and goes to a beach flat with soft sand where
    lilies grow.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: At the lily plants, she cuts into the sand around the plant with a flat-edged
    digging-stick, pries out the plant and bulb, breaks the soil, removes the bulb,
    breaks off the stem, and throws the stem away.
  category: action
  evidence_refs:
  - ev:8
