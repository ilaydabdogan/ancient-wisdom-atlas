  text: A woman cooks dried fins in a kettle on the fire for a long time and removes
    the kettle with tongs when the food is done.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the dried fins are placed in a small dish, the woman calls her children
