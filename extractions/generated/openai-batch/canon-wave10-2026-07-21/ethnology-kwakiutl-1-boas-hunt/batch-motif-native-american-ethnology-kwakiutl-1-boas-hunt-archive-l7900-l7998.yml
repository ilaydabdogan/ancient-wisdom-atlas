canonical_text:
  quote: ''
  summary: The passage gives procedural descriptions of preparing and eating dried
    fins, halibut spawn, the middle piece of halibut, and fresh codfish stomachs.
    It also records rules about drinking water before and after eating, rinsing the
    mouth in the morning, ownership-restricted consumption of dried fins, and a bad-luck
    consequence if halibut spawn from a husband's catch is not boiled.
  language: English
  quote_policy: summarized
literal_observations:
