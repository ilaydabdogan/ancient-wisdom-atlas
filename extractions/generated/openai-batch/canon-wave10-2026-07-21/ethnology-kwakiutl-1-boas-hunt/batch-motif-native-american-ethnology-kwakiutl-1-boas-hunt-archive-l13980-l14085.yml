canonical_text:
  quote: ''
  summary: The passage records several procedures for calling Northwest-Wind or changing
    southeast wind into northwest wind, including instructions attributed to Land-Otter,
    the use of otter-slide soil, crab, fern, snail, kelp, and star-fishes, repeated
    fourfold actions, prayers or calls, fire, water, canoe paddling, and deposition
    or hiding of ritual objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Land-Otter tells Great Inventor that four men and their leader may call Northwest-Wind,
    throw soil into water, and ask the wind to help by blowing them to their destination
    for four days.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator says later generations follow Land-Otter’s words by taking soil
    from an otter-slide, turning right, throwing it into water, and praying to Northwest-Wind
    while the canoe crew beats time and speaks about the charm.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the soil procedure is done four times, the canoe crew takes paddles,
    pulls them through the water four times, begins paddling, and says Northwest-Wind
    is coming behind them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The passage summarizes four ways of calling Northwest-Wind: a crab over fire
    and hidden in tree holes; four ferns painted with red ochre and fitted with dentalia
    and a split pine stick; four snails placed by fire; and otter-slide soil thrown
    into water on the north side of the slide.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In a Kwag'ul method, a fresh piece of kelp is used as a tube; the caller faces
    north, shouts to Northwest-Wind, turns right at each cry of “wo,” places the kelp
    end in the sea so bubbles rise, repeats the cry four times, lets the kelp sink,
    and then paddles.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In a Koskimo method, four star-fishes are gathered at low tide, placed by
    the house fire, daubed with red ochre, tied with cedar-bark strips, and hung over
    the fire to be smoked and dried.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Koskimo man prays to Owner-of-the-Weather and Supernatural-One to make
    the weather right and to call Northwest-Wind, East-Wind, and Clear-Weather-Above;
    he then answers “Yes” himself, pretending the star-fish says it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: After speaking, the Koskimo man breaks the cedar strings holding the star-fishes,
    carries them into the woods, and hides them under a tree stump; the passage adds
    that some people say he returns them to the beach where they were taken.
  category: sequence
  evidence_refs:
  - ev:8
