canonical_text:
  quote: ''
  summary: 'The passage describes procedures for serving and eating a fish dish called
    bull-head, including water service, spoon use, handling of stomachs, washing,
    restrictions on who may attend, and a rule against leaving fish guts in the body
    overnight. It then describes preparation of fresh codfish for a feast: cutting,
    removing the head and backbone, tying the flesh with cedar rope, calling guests,
    preparing fire, water, kettles, mats, dried salmon, oil, dishes, and briefly boiling
    codfish in a basket.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Guests are given water in a bucket, drink from its corner, and then eat from
    a kettle with spoons.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When stomachs are found with spoons, they are put into small dishes; after
    gills and liquid are eaten, the stomachs are taken by hand and bitten off.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman pours leftovers back into the kettle, washes the dish, gives fresh
    water for handwashing, moves the kettle to the outer end of the fire, and gives
    the guests water again before they leave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bull-head food is not for morning, has no oil poured into it, is not used
    at large feasts, and the numaym is not invited; only four or six friends of the
    codfish catcher eat it.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The inviter says, "We will eat bull-head to-morrow."
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The fisherman does not allow guts of codfish and halibut to remain in the
    body overnight; the passage says that if his wife failed to act accordingly, he
    would not again get bites from several named fish.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: For fresh codfish, the woman cuts both sides of the neck, around the back
    of the head, down the back toward the tail, and close to the backbone until cuts
    meet at the belly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The woman pulls off the head with the backbone, places it on an old mat, and
    ties the codfish flesh with cedar rope so the flesh side is outside and the scales
    are inside.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: For a feast, the woman sends her husband to call his tribe, sets out kettles,
    buckets, long-handled tongs, and a basket, and asks young men of her husband's
    numaym to build a fire and draw water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The woman spreads mats, sets out dried salmon, oil, food dishes, and oil dishes;
    dried salmon is the first course, followed by briefly boiling tied codfish meat
    in a basket in a kettle.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
