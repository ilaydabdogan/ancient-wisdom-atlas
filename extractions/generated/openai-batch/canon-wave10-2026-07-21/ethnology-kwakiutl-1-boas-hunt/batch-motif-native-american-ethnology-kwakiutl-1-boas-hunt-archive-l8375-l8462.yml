canonical_text:
  quote: ''
  summary: The passage describes Kwakiutl practices for eating boiled kelp-fish, preparing
    and roasting kelp-fish, serving roasted kelp-fish to a restricted group, and beginning
    the description of wind-dried kelp-fish. It includes details on kin and numaym
    invitations, household labor by husband and wife, fish cutting, red-pine roasting
    tongs, cedar-bark bindings, roasting by fire, oil and water served with the meal,
    and a brief parenthetical note linking the mussel-shell knife to first people,
    Deer, and Q!a'neqe£lak.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boiled kelp-fish is eaten slowly with spoons because of fear of being hurt
    by fish-bones, and the eaters cool themselves with fresh cold water before leaving
    the feasting-house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kelp-fish is not given to many people because not many are obtained; the invited
    group is limited to the numaym, a family of single origin, and friends of the
    owner.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man brings line-caught kelp-fish from the beach in his wife's small basket
    and enters the house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The wife spreads an old mat, places the fish-basket beside it, sits beside
    it, and removes the intestines and gills from the fish.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fish-knife is also called a mussel-shell knife; the passage notes that
    first people used mussel-shell as a knife and that Deer sharpened it when he met
    Q!a'neqe£lak.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The woman cuts off each fish head and opens the fish along the back down to
    the tail, along the upper side of the backbone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The husband makes red-pine roasting-tongs, and the wife binds them with split
    cedar-bark to keep them from splitting.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Cut-open fish are placed crosswise in the roasting-tongs with tails alternating
    in direction, with cedar-bark tied between and above them; four or six fish may
    be placed in one pair of tongs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The fish are roasted by the house fire, first on the flesh side and then on
    the skin side, until the surfaces are blackened; the tongs are then set near the
    fire to keep the fish hot.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The man calls friends or the numaym to eat; the woman lays food-mats, removes
    the fish from the tongs, sets them skin-side down, and provides oil-dishes.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The feasters break the roasted fish, dip it in oil because roasting has made
    it dry, drink fresh water afterward, and then go out.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Roasted kelp-fish is not given at a feast to many tribes; the text lists friends,
    husband and wife, the numaym, or strangers as possible eaters.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Wind-dried kelp-fish is cut like roasted kelp-fish, but the backbone is removed;
    scales are left on, and the skin of roasted kelp-fish is not eaten.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: For wind-dried kelp-fish, the woman splits thin cedar sticks and spreads the
    fish open with two of them.
  category: action
  evidence_refs:
  - ev:10
