literal_observations:
- id: obs:1
  text: Boiled clover-roots are placed before a husband, wife, and children with oil;
    they dip the roots in oil, eat them, and drink water afterward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that boiled clover is eaten only by the married couple
    and their children and is not given at feasts to many tribes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Baked clover-root is described for a camping situation in bad weather when
    the woman and her husband have no food and no kettle.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman finds clover leaves, digs out roots, carries them to water, washes
    off sand, and returns to camp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The husband is sent inland to get skunk-cabbage leaves, or dry fern-fronds
    if skunk-cabbage is unavailable, and brings the leaves to his wife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman wraps clover-roots in skunk-cabbage leaves, puts the bundle into
    a hole in the hot ashes under the fire, covers it with ashes, and piles fire over
    it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After baking, the woman removes the wrapped clover, opens the leaves, spreads
    them on the floor, and uses the leaf as a dish for the baked roots.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Baked clover-root is eaten without oil by the woman and her husband, followed
    by drinking water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Raw clover-root is eaten by a woman digging it when she is hungry and does
    not want to lose time by returning to the house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A man who cooks cinquefoil-roots for his tribe begins by preparing a large
    square box and cedar materials inside the house near the door.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The man makes a cedar frame for red-hot stones, places it in the square box,
    gathers dry fern-fronds, wets a cedar-bark rope in beach water, and ties the rope
    around the box to prevent bursting when red-hot stones are added.
  category: sequence
  evidence_refs:
  - ev:5
