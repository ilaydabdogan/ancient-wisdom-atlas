  summary: The passage gives procedural accounts of eating boiled clover-roots with
    oil in a household setting, baking clover-roots in hot ashes during camp scarcity,
    eating raw clover-root while digging, and beginning the preparation of equipment
    for cooking cinquefoil-roots for a tribe.
  language: English
