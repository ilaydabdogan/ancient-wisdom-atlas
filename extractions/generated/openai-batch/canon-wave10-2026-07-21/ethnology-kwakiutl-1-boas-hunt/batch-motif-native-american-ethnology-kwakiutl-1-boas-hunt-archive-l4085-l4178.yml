canonical_text:
  quote: ''
  summary: The passage gives procedural descriptions of gathering qotlxole, dogwood-berries,
    and gooseberries. It describes women carrying baskets by canoe or on foot, using
    cedar-bark work gear, mats, poles, and baskets, and returning berries to houses
    or to a man organizing a feast. It also notes DEnax-da£xu and Kwakiutl terms for
    qotlxole and for picking it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Qotlxole are described as nearly ripe when it is nearly winter; the gathering
    uses flat-bottomed baskets and is associated with the upper course of the Knight
    Inlet River.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives DEnax-da£xu and Kwakiutl names for qotlxole and for the
    act of picking it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A woman carries nested baskets to the beach, puts them in a small canoe, stands
    in the bow with a punting-pole, and poles stern-first up the Knight Inlet River.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When she reaches the berry place, she ties the canoe's anchor-line to a tree
    on the river bank.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the berry patch, the woman puts on a cedar-bark belt and cedar-bark hat,
    places baskets among the plants, sits between the baskets, and fills the nearest
    basket as she picks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the qotlxole baskets are full, she carries them to the canoe, returns
    downriver, carries the baskets up the beach, and eats a little.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: For dogwood-berries, a man who intends a feast engages many old women to pick
    berries.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The dogwood-berry pickers carry three baskets, use a front-basket while picking,
    and repeatedly pour its contents into a large basket.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the man's house, he pours the dogwood-berries into an oil-box, returns
    the emptied large baskets, and the women keep the berries in their front-baskets.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The women tell the man where medium-sized baskets were left, and young men
    of his numaym are engaged to bring them out of the woods.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Gooseberries are gathered by spreading a large mat under a bush, striking
    the bush with a short piece of punting-pole so berries fall on the mat, and pouring
    the berries into a large basket.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: For gooseberry gathering, the woman uses a large basket, cedar-bark belt,
    cedar-bark hat, large mat, and short pole, then carries the filled basket home.
  category: object
  evidence_refs:
  - ev:7
