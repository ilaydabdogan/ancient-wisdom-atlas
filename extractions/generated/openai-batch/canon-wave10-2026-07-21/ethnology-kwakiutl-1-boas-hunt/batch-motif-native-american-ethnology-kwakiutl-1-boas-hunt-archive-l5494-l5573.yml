canonical_text:
  quote: ''
  summary: A woman preserves currants by preparing skunk-cabbage leaves, heating stones
    in a fire, steaming currants with hot stones and water, gathering additional leaves
    and spruce-roots, skimming and thickening the boiled currants, then spreading
    and pressing them into berry-cakes on drying-frames over the fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Stones are put into the fire, and a square box, tongs, and a large long-handled
    ladle are placed near the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skunk-cabbage leaves formerly used for covering berries have their midribs
    removed, are heated over the fire until brittle, and are broken into pieces as
    fine as flour.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A small steaming-box is filled halfway with water and placed between the square
    box and the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The woman transfers cleaned currants into the square box with a large long-handled
    ladle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: She uses tongs to dip red-hot stones quickly into water in the steaming-box
    and then places the stones into the currants; six stones are placed in at a time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The currants being steamed are covered with a mat and left all day and all
    night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The woman goes into the woods, gathers broad skunk-cabbage leaves, digs spruce-roots,
    splits and ties the roots, and carries the materials home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: She uses her husband's crooked knife to cut the spruce-root tying and to remove
    leaf midribs so the leaves have even thickness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Prepared skunk-cabbage leaves are heated by the fire until soft and thin and
    then placed on a mat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: She sets out drying-frames, a cellar measure, four cedar-sticks, and a large
    horse-clam shell.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: After removing the mat from the steaming-box, she skims juice from the boiled
    currants into a dish until the currants are dry.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: She searches for stones in the box with tongs, removes them, adds powdered
    skunk-cabbage to the boiled currants, and stirs until the mixture is thick.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Heated skunk-cabbage leaves are spread along the drying-frame, and cedar-stick
    measures are arranged on the frame.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Using the large shell, she pours boiled currants inside the measures, spreads
    them, and presses them into the corners of the mould to make berry-cakes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: When cakes have been made to the end of the frame, the frame is placed just
    over the fire, and another drying-frame is prepared in the same way.
  category: sequence
  evidence_refs:
  - ev:6
