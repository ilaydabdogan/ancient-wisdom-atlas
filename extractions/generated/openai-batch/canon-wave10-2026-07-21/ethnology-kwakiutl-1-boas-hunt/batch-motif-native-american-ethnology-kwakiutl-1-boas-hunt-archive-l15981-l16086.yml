canonical_text:
  quote: ''
  summary: 'The passage first describes funeral and mourning practices when a noble
    child dies: removal of the body through the house wall, burial, burning food and
    clothes, pulling down roof-boards, and non-relatives cutting mourners'' hair.
    It then narrates “The Ghost Country”: a dead man returns for his sweetheart, leads
    her across a river to the ghosts'' house, where gifts are received through fire.
    The woman bears a child there, visits her parents, and returns permanently to
    the ghosts after her mother rejects the ghostly child.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The dead body is taken through a hole made by pulling planks from the side
    of the house, placed in a coffin, and buried.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother of the dead one gives best food and clothes to other women to burn
    behind the village and throws food into her house fire for four days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a noble child dies, the roof-boards of the father's house are pulled
    down, an act named as craziness caused by the beloved one's death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Four days after the death, people not related to the deceased are called to
    cut the hair of the mother, father, and brothers; relatives cutting the hair is
    called bad luck and compared to cutting throats.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before dying, the man tells his sweetheart he will return to take her if his
    destination is good, and gives the necklace beads as the sign by which she may
    recognize him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the man dies and is buried, the woman waits awake; he returns, she feels
    the necklace, and they start out together.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The pair arrive at a river; the woman calls to be fetched, children first
    ignore them, the man yawns, and the children take them across.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the ghost house, the man's sisters recognize the couple; the woman offers
    spoons, but the sisters-in-law take them only after the spoons are thrown onto
    the house fire and burned.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The woman becomes pregnant in the ghost country and gives birth to a boy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the woman visits her parents with her husband and child, her mother sees
    that the child's eyes are holes, the face is somewhat green, and moss is on the
    side of its face.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The woman's mother throws the child away, after which the woman says she came
    only out of pity and will not return to her parents.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The woman goes back to her husband and to the ghosts, stays there, and does
    not come back.
  category: sequence
  evidence_refs:
  - ev:8
