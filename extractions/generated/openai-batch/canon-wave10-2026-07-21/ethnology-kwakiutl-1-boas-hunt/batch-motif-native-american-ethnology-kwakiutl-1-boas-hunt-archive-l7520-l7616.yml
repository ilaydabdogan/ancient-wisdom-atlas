canonical_text:
  quote: ''
  summary: The passage gives procedural descriptions for serving dried halibut, preparing
    and serving rolled halibut skin with half-dried halibut, preparing blistered half-dried
    halibut for high-ranking men, and boiling aged dried halibut. It repeatedly notes
    oil, water, mats, kettles, fire, mouth-rinsing, drinking, second courses, and
    rank-restricted consumption.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Broken dried halibut is chewed soft and dipped into oil because it is very
    dry and has little fat; guests drink fresh water after eating and wait for a second
    course.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman cuts half-dried halibut and halibut skin into narrow strips, places
    one strip of skin with one strip of halibut, rolls them into sea-gull-egg-sized
    balls, and briefly boils them in a half-filled kettle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The rolled skin and halibut are removed from the kettle without gravy and
    served in a dish on a food-mat before guests.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At breakfast, guests rinse their mouths before drinking; at noon or evening,
    they drink water before eating without rinsing their mouths.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Guests eat the rolled skin and halibut by hand; after eating, leftovers are
    poured back into the kettle, water is added, and the dish is set before them again
    for handwashing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: No second course is served after the rolled skin and dried halibut, and it
    is not dipped into oil because the skin is described as very fat.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Only the men highest in rank of the various tribes eat the rolled skin and
    dried halibut preparation.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: For blistered half-dried halibut, high-ranking men enter the fisherman's house
    in the morning and sit in the rear of the house; the woman spreads a mat and seats
    them on it.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The woman blisters half-dried halibut by the fire, blows a mouthful of water
    on it, breaks it on a food-mat, scatters the pieces, and provides an oil-dish
    and water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Guests eat blistered half-dried halibut by dipping it into oil rather than
    chewing it first, because it is described as brittle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Dried halibut that has been in the house a long time turns red, hard, and
    tough; the woman folds it into a ball, submerges it under water with a flat sandstone,
    and boils it for a long time.
  category: sequence
  evidence_refs:
  - ev:6
