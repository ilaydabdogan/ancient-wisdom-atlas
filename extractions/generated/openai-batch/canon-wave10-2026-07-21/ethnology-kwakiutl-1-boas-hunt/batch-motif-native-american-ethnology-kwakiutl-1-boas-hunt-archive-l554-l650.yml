canonical_text:
  quote: ''
  summary: 'The passage gives a technical account of making a cedar box: tying it
    with cedar-bark rope, drilling and pegging joints with saliva-wetted cedar pegs
    driven by stone, contrasting earlier pegging with later cedar-withe sewing, smoothing
    the bottom board, checking the box for squareness with split cedar-stick measures,
    and marking and cutting the bottom board.'
