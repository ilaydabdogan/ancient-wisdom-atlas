canonical_text:
  quote: ''
  summary: The passage gives procedural recipes and serving rules for blistered sun-dried
    salmon, boiled silver-salmon, and boiled salmon-guts, including preparation, cooking,
    drinking or rinsing with water, use or avoidance of oil, sharing with family or
    guests, and disposal of leftovers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman rinses her mouth, drinks water, breaks pieces from blistered sun-dried
    salmon lying on its back, dips the pieces in oil, eats until nearly all is gone,
    then drinks and washes her hands with water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For boiled silver-salmon, the fish has its head, backbone, and tail cut off,
    is split open, placed near the house fire, cut crosswise on the outer skin side,
    and put into boiling water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman watches for the kettle to boil again, breaks up the salmon meat
    with a spoon, stirs it briefly, and removes it without letting it boil a long
    time.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After cooking boiled silver-salmon, the woman calls her husband and children,
    gives them spoons and water, and they eat with spoons and drink cold water afterward,
    which is called cooling down.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the boiled silver-salmon meal, the man gathers leftovers into the kettle,
    takes it to the beach, pours the contents into the sea, and washes the kettle
    clean.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: No oil is poured into boiled silver-salmon; first-caught sockeye-salmon is
    treated the same way, while lean dog-salmon from the upper river receives much
    oil and its leftovers are poured outside the house.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: For boiled salmon-guts, the woman cleans the silver-salmon stomachs, turns
    them inside out, places them in a half-full kettle of water, puts the kettle on
    the fire, and stirs with tongs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that stirring the salmon stomachs before the water gets
    hot makes them hard; if not stirred, they remain soft and tough.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: The woman tests a salmon stomach with tongs; if it can be held it is done,
    while slipperiness means it is not done or has stayed on the fire too long.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Overboiled salmon stomachs are poured away outside the house because they
    are not good and would cause vomiting if eaten.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: For the salmon-guts meal, the husband invites guests; the wife ladles liquid
    and boiled stomachs into dishes, sets food-mats before guests, provides one dish
    for every four guests, and gives each guest a spoon.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Water and oil are not given with boiled salmon-guts before eating; after eating,
    the host gives water so guests can rinse their mouths because of the salty taste,
    and then drink.
  category: sequence
  evidence_refs:
  - ev:5
