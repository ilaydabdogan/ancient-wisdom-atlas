canonical_text:
  quote: ''
  summary: Procedural ethnographic passage describing the staging and covering of
    harvested cinquefoil-root baskets, distinctions in who eats long and short roots,
    and methods for gathering sea-milkwort, bracken-root, fern-roots, and erythronium
    with digging-sticks, baskets, mats, belts, shells, and other tools.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Baskets of long cinquefoil roots are placed on a stage and covered with mats
    so frost will not reach them or freeze them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Baskets of short roots are also placed on the stage and covered with mats.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When there are many people, four baskets of short cinquefoil roots may be
    kept out for cooking, but more than one basket of long cinquefoil roots is not
    kept out.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that chiefs eat the long cinquefoil roots and common people
    eat the short roots.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: For sea-milkwort, a woman takes a clam digging-stick and small basket, goes
    to a known place, digs in sand even when nothing is visible, collects roots in
    the basket, and carries it home when full.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: For bracken-root, a woman uses a back-protecting mat, cedar-bark belt, and
    digging-stick, follows the long root, breaks off the soft end, may coil it, bundles
    the roots with spruce-root, and carries them home on her back.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: For another fern-root, a woman uses a yew-wood digging-stick and large back
    basket, pries up large roots, plucks off the leaves, fills the basket, covers
    it with slim hemlock branches, and carries it home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Fern-roots are gathered when tribes are hungry, cannot obtain other food,
    or must camp for a long time in bad weather.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: A man makes a bent, flat-pointed stick for gathering fern-roots; it is described
    as like a hemlock-bark peeling stick and generally four spans long.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: A woman gathers fern-roots from loose moss on rocks by prying moss from the
    rock with the peeling-stick, pulling out the roots, putting them in a basket,
    carrying them home, and setting them beside the fire.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Erythronium is said to grow only on the river bank, and the woman gathers
    it when the leaves first come out of the ground.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: For erythronium, a woman uses the digging-stick used for short cinquefoil
    roots, a back-protecting mat, cedar-bark belt, small-meshed flat-bottomed basket,
    and a horse-clam shell.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The erythronium gatherer pries up sod with the digging-stick, scrapes soil
    with the clam shell, picks plants into the basket, and the basket fills quickly
    if many plants are present.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Multiple root-gathering sections identify women as the persons who perform
    the digging or gathering.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  - ev:8
