canonical_text:
  quote: ''
  summary: The passage gives procedural accounts of preparing and preserving salmon
    heads, dog-salmon spawn, quarter-dried dog-salmon, silver-salmon and sockeye-salmon
    spawn, and begins a section on old white sockeye-salmon. It describes cutting,
    drying, smoking, boxing, hanging, burying in sand and clay, storage for winter,
    and storage until spring plant growth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Roasted heads are dried over a hot fire, placed in a large cedar-bark basket,
    and put away for winter use.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman cutting dog-salmon collected by her husband scoops scattered spawn
    into a tall box placed at her left side.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the tall box of scattered spawn is full, the husband places it in a corner
    of the house and boards are laid over it to reduce rain dripping into it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men may take some spawn from the covered box because the cover is not water-tight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sticky dog-salmon spawn is washed, dipped into a dish, pounded with a smooth
    stone until burst, put into a seal-bladder, tied with cedar-bark rope, and hung
    in the rear of the house not very near the fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The seal-bladder of sticky spawn remains hanging until fern and salmon-berries
    begin to sprout.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The juice from the sticky spawn is used by painters to make paint adhere.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Quarter-dried dog-salmon is cut by the wife of the spearer, spread with split-cedar
    sticks, and hung in the house smoke until half dried.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Half-dried salmon are layered in a river-bank hole with grass and a sand-clay
    mixture, sometimes as many as one hundred in one hole, and are left there until
    winter.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Silver-salmon and sockeye-salmon spawn are small and are prepared in a similar
    manner after being taken from fish caught by trolling or in salmon-weirs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Silver-salmon and sockeye-salmon spawn are put on a drying-rack, smoked over
    the fire until dry, placed in an open-weave spoon-basket, and hung behind the
    fire for heat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Old white sockeye-salmon in the upper river are called ugly sockeye-salmon
    and are speared at their spawning place by people who live on the rivers.
  category: action
  evidence_refs:
  - ev:7
