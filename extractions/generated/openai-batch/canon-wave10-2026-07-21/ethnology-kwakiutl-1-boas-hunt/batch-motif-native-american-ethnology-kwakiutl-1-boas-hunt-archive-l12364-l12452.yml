canonical_text:
  quote: ''
  summary: The passage gives procedural descriptions of preparing and serving lily-bulbs.
    In the first method, members of the Sparrow Society call attendees and dancers,
    lily-bulbs are washed, boiled by adding red-hot stones to water, mixed with much
    oil, and served to guests. In the second method, washed lily-bulbs are boiled
    in a kettle under an old mat covering, drained, mashed, mixed with oil, and eaten
    with a spoon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four members of the Sparrow Society connected with the host's friends are
    sent to call people again, and the dancers are later called and led in.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the attendees sit down, the top of the lily-box is untied; lily-leaves
    are taken out and thrown on the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Plants are taken from the box by hand, placed into a small-meshed flat-bottomed
    basket, washed in a large dish with water, and moved by hand until the soil comes
    off.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two men use long tongs to pick up red-hot stones, dip them in water to remove
    ashes, and place them into water in a square box until the water boils.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The basket of lily-bulbs is put into boiling water, more red-hot stones are
    added so that the water boils hard, and the process is repeated until all lily-bulbs
    are taken from the box.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The wife of the host brings out dishes, spoon-baskets, and oil; two men use
    ladles to place cooked lily-bulbs into empty dishes set inside the door.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Much oil is poured on the cooked lily-bulbs, they are stirred, spoons are
    distributed, and the guests eat; afterward they drink a little water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage explains that much oil is added because a small amount of oil
    leaves the lily-bulbs tasting bitter.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: In another method, washed lily-bulbs are put into a small kettle, covered
    with an old mat tucked in around the inside so steam cannot come through, wetted,
    and put on the fire.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the second method, the cooked lily-bulbs are drained into small dishes,
    pressed with the back of a spoon until mashed like wet flour, mixed with much
    oil, and eaten with a spoon.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that lily-bulbs are never baked in ashes because they are
    very soft when cooked.
  category: attribute
  evidence_refs:
  - ev:5
