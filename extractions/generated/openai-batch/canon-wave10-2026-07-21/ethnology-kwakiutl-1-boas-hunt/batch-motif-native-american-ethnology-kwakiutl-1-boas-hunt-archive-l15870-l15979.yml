canonical_text:
  quote: ''
  summary: 'The passage first describes a bodily treatment for sickness using blue
    hellebore mixed with water, silver-perch oil, shredded cedar-bark, and steam baths.
    It then describes rites performed when a beloved child is dying: the parents burn
    the child’s clothes and food offerings in the house fire as payment to Sitting-on-Fire,
    ask that spirit to intercede with ancestral spirits and Long-Life-Maker, enlist
    a shaman for dream diagnosis and possible soul retrieval, and, if the child dies,
    dress the body and have the mother kick the dead child four times while instructing
    the child not to return and to protect the parents from sickness.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sick person is treated with blue hellebore mixed with water, silver-perch
    oil rubbed on the body, soft shredded cedar-bark used to wipe it off, and steam
    baths used as medicine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a beloved child is dying, the parents pray to Sitting-on-Fire and put
    the child’s clothes on the fire as payment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father prepares dry salmon, cinquefoil roots, dried berry-cakes, and viburnum
    berries in fourfold portions and places or pours them into the fire while the
    parents petition Sitting-on-Fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The parents ask Sitting-on-Fire to pray to ancestral spirits and Long-Life-Maker
    so that the child may be protected and the sickness removed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the offerings, the shaman is asked to think about the matter in sleep
    and goes into the woods to meet the source of his supernatural power; the sick
    child and parents are also told to attend to what the spirits and Sitting-on-Fire
    may say in sleep.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'An object belonging to the sick child is hung over the head of the bed, and
    dream signs are used: laughing in sleep indicates survival, while hair hanging
    over the face indicates death.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: If the favorable dream occurs, the shaman sings his sacred song and goes into
    the woods to search for the sick child’s soul and bring it back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the shaman does not sing, the parents understand that the child will die;
    after the child’s breath stops, the parents dress the body in the best clothing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The mother kicks the dead child four times and speaks instructions: not to
    turn back, not to return, to go straight ahead, and to protect the parents from
    sickness.'
  category: speech
  evidence_refs:
  - ev:6
