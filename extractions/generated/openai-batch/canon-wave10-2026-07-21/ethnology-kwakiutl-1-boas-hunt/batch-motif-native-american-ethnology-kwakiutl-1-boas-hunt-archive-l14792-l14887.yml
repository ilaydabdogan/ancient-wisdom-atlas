  summary: The passage gives a procedural account of preparing a child's cradle with
    mountain-goat wool, mountain-goat kid skin, cedar-bark padding, a pillow, face
    cushions, a forehead-presser, drilled holes, a hair rope, deer-skin strips, and
    cedar sticks. Several items are described as shaping the child's neck, face, forehead,
    nose, and eyes according to desired bodily form.
