canonical_text:
  quote: ''
  summary: The passage describes a viburnum-berry feast in which young men lift and
    place large house-dishes before ranked guest tribes, chiefs and common people
    eat from assigned dishes, the host's numaym sings while the host's daughter dances,
    and two male relatives serve berry juice to chiefs with long-handled ladles. It
    then describes the salmon-berry feast as following much the same procedure, with
    salmon-berries and oil, and with distribution primarily to the host's own tribe.
  language: English
  quote_policy: summarized
