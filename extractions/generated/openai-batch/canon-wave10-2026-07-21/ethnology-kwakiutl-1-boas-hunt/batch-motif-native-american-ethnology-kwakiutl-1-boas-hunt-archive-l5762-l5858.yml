  quote: ''
  summary: The passage describes procedures for boiling and storing crabapples and
    qotlxole berries, using red-hot stones, water, oil, baskets, boxes, and cooling
    or winter storage. It also notes eating berries with oil, avoiding water afterward,
    and the possible use of crabapples in winter ceremonial feasts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man uses tongs to pick up red-hot stones, dips them in water to remove ashes,
    and puts them into the steaming-box until the water boils.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cleaned crabapples in several baskets are placed on a rack in boiling water,
    covered with hot water, and boiled further with additional red-hot stones.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife watches the crabapples, tests their softness with a ladle, and calls
    her husband when they are cooked.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Boiled crabapples are poured into a washed oil-box; additional batches may
    be boiled, water is added in a stated proportion, and a board is placed on top
    for storage until winter.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The passage says chiefs may give a crabapple-feast and describes this as one
    of the great feasts of the tribes.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Qotlxole berries are put in a dish with much oil, and a woman calls her husband
    and children, gives them spoons, and sets the dish before them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage contrasts inexperienced and experienced ways of eating the oiled
    berries and says water is not drunk afterward so the oil will not rise into the
    throat.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: For winter use, berries are put into square boxes, covered, tied down, and
    placed in a cool corner of the house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: For qotlxole mixed with oil, the woman asks her husband to prepare non-leaking
    high boxes; he builds up a fire, heats many stones, draws water, and sets down
    tongs and an oil-box.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The man boils oil with red-hot stones, skims off froth with a horse-clam shell,
    ladles hot oil over the berries until they are covered, and leaves them to thicken
    and cool for two days.
  category: sequence
  evidence_refs:
  - ev:7
