canonical_text:
  quote: ''
  summary: The passage gives procedural descriptions for eating elderberries, preparing
    and serving long salal-berry cakes, eating raw ripe salal-berries with oil, and
    beginning the setup for currant-cakes. It includes washing, soaking, serving arrangements,
    use of oil and horn spoons, restrictions on drinking water after certain foods,
    and burning berry stems to prevent witchcraft use of breath-bearing remnants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman eating boiled elderberries sucks juice from berries mixed with stems,
    blows out stems and seeds, later rinses her mouth, drinks a little water, and
    eats roasted salmon with oil to avoid stomach-ache.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For long salal-berry cakes, the woman sets dishes in a row, fills them with
    water, and washes them with shredded cedar-bark to remove dirt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman removes long salal-berry cakes from a covered box, removes a skunk-cabbage
    covering, breaks each cake lengthwise into five pieces, puts one piece in each
    of five dishes, adds water, covers the dishes with a mat, and leaves them overnight.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the morning, young men call the people four times to eat the long salal-berry
    cakes, and the people come in.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Young men stand or sit by the dishes, put both hands into the soaked berry-cake,
    squeeze handfuls into balls, and continue squeezing until the cake is dissolved
    and the liquid is thick.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman pours much oil onto the prepared salal-berry cakes and gives horn
    spoons to the guests; horn spoons are preferred because wooden spoons turn black
    when used with these cakes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Six men eat from each dish of squeezed salal-berry cake with horn spoons;
    afterward the dishes are placed at the left-hand side of the door, the guests
    leave, and they do not drink water after the feast.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: For raw ripe salal-berries, after the woman returns from picking them, her
    husband calls chosen guests to eat.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The woman spreads a long narrow mat in front of the guests, and her husband
    pours the salal-berries along the mat before them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The wife pours oil into oil-dishes, and the husband places the oil-dishes
    on the salal-berries so that four men share each oil-dish.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Guests take bunches of salal-berries, dip them in oil, shake off the oil,
    eat the berries one at a time, and throw the stems into the fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After eating raw salal-berries, the guests do not drink water because they
    do not want to remove the sweetness from the mouth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The stem or branch is thrown into the fire because the eater’s breath remains
    on it and people fear someone might take it for witchcraft.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: At the beginning of the currant-cake section, a woman places dishes, oil,
    a horn-spoon basket, water-buckets, and long mats on the floor on the left-hand
    side of the house door.
  category: setting
  evidence_refs:
  - ev:6
