  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: A woman who owns a cinquefoil-garden harvests in autumn, bringing a cedar-bark
    belt, mat, two baskets, and a digging-stick.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: At the cinquefoil-garden, the woman fastens the mat with a woven cedar-bark
    belt, sits on the back-protector mat, pries up roots, and places short curly roots
    into the larger basket at her right side.
  category: sequence
  evidence_refs:
  - ev:7
