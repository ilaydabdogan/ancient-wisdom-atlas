  quote: ''
  summary: The passage describes methods for gathering seaweed, digging and drying
    clover roots, storing clover for winter, serving clover when the winter ceremonial
    begins, and beginning the description of digging cinquefoil roots with related
    tools and baskets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman gathers seaweed from rocks, using wet or dry conditions to pluck or
    peel it, puts it in a basket, transfers it to a canoe, covers short boards with
    a mat, and goes home when the canoe is full.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Clover digging begins when frost kills the clover leaves and winter is approaching.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: For clover digging, the woman takes a digging-stick, flat-bottomed basket,
    back-protector, and cedar-bark belt to the clover-garden.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman places her tools toward sunrise so that the rising sun is at her
    back and does not shine into her eyes while she digs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The clover digger uses a mat as a back-protector, fastens it with a cedar-bark
    belt and rope, sits on the lower end of the mat, and works while sitting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: She pushes the digging-stick about one span into the ground, pries up the
    clover without breaking the roots, picks the roots out, and throws them into a
    flat-bottomed basket.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Clover digging may continue daily for several days in a large clover-garden.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The clover roots are covered with mats overnight and dried outdoors in fine
    weather at the place where they were dug.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says clover should not be dried in the house because it is said
    to shrink there, while it does not shrink when dried where it was dug.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: When dry, the clover roots are put into baskets, covered with dry grass, tied
    with cedar-bark rope, placed in a canoe, and taken to the winter house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the winter house, the clover basket is placed in a cool corner rather than
    near the fire.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: The clover roots are not cooked until winter; when the winter ceremonial begins,
    people are invited to eat the clover.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Cinquefoil roots are dug with the same digging-stick used for clover, or with
    a smaller stick made for the thinner roots.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage distinguishes baskets for cinquefoil roots, including a basket
