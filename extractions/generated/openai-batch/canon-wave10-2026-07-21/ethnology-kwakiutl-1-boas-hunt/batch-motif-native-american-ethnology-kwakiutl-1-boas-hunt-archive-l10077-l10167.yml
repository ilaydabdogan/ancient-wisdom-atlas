canonical_text:
  quote: ''
  summary: The passage gives procedural descriptions for distributing, cutting, boiling,
    skimming, tying, drying, reheating, and eating whale blubber and whale-tail. It
    includes ranked allocation of whale portions at the shore and household preservation
    recipes involving fire, water, kettles, cedar-bark ties, baskets, boxes, and clam-shell
    skimming.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A named chief, Place-of-Property, is addressed as having the dorsal fin for
    his dish when the Seaward-Dwellers are invited.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The common people or tribe go ashore and stand at the right-hand side of the
    whale according to their feast seats, while Place-of-Property stands near the
    dorsal fin.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The whale lies on its belly, and the head chief uses two butcher-knives to
    measure and cut along the whale toward the tail.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The neck is cut around, a next-ranked person cuts a first blubber piece, and
    the men receive blubber pieces of the same width as they cut downward crosswise.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Women cut into the thin side of the whale, remove inside fat, and put it aboard
    canoes; a piece of tail is also cut off before the people return home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The blubber is unloaded above the high-water mark and cut on a board into
    measured strips and thin crosswise pieces.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Cut blubber is boiled in a kettle on a beach fire, stirred with tongs, and
    whale-oil is skimmed off with a large horse-clam shell into a box.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Boiled blubber is placed in a basket, tied in the middle with split cedar-bark
    strips, and then receives the name "tied in the middle."
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The tied blubber is hung over the house fire to dry for one month and later
    boiled with water; it is eaten hot because it is tender hot and tough when cold.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Leftover tied blubber is reheated in hot water whenever more is wanted and
    is eaten before it gets cold.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Fresh whale-tail is cut into square pieces, stretched by biting and pulling,
    and put quickly into boiling water in a house kettle.
  category: action
  evidence_refs:
  - ev:11
