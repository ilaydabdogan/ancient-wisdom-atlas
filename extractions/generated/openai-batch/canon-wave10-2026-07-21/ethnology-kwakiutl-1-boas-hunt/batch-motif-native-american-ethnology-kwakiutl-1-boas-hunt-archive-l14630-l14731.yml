canonical_text:
  quote: ''
  summary: 'The passage describes procedures after childbirth: concealment and burial
    of the afterbirth, care of the mother, handling of blood-soaked cedar-bark, storage
    of the child’s umbilical cord with copper for future wealth, washing of the newborn
    by a midwife with cedar-bark and water heated by four red-hot stones, prayers
    addressed to the stones as Supernatural-One for health and protection, oiling
    and binding of the child’s head with kelp, and the beginning of cradle preparation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man wraps the tied afterbirth in an old mat, buries it in a one-span-deep
    hole where men walk on the street, covers and levels the soil, and pours water
    over it so the moved soil cannot be seen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the woman gives birth, the man heats water, adds a little oil, gives
    it to his wife to drink, and keeps hot water and oil before her so that the two
    “pillows” and blood of the womb may come off.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Soft cedar-bark is used for the wife to sit on and to wipe her body; blood-soaked
    cedar-bark is placed in a basket and later hung behind a house post to dry.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the child is four days old, the man washes his wife in hot water and
    later cuts her hair down to her neck.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the child’s umbilical cord comes off, the man may tie it and place it
    in a box containing expensive copper so the child will be able to obtain coppers
    easily when grown.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The midwife takes the newborn from the birth hole, ties and cuts the navel-string
    with twisted yellow cedar-bark, and prepares cold water in a wash-basin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The midwife places four stones in the fire, picks up each red-hot stone with
    tongs, speaks to it as Supernatural-One, and prays for the child’s health, protection
    from curses, freedom from trouble, and strength.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The red-hot stones are put into the child’s wash-basin; after the water is
    warm, the midwife places the child on the instep of her left foot and washes the
    child with rubbed yellow cedar-bark to remove “tallow” and blood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After drying the child, the midwife rubs oil of silver-perch on the child’s
    body, face, and head, then wraps an oiled kelp strip around the child’s head four
    times above the ears.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Cradling begins with a soft mountain-goat kid skin, long cedar-withes placed
    lengthwise on the cradle, and the husband drilling holes in the cradle.
  category: action
  evidence_refs:
  - ev:8
