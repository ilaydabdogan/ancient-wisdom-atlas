canonical_text:
  quote: ''
  summary: The passage gives procedural descriptions of preparing cryptochitons, gathering
    and cooking winkles, rank-restricted eating of winkles, and twisting eel-grass
    in spring at spring tide. It describes tools, tides, cooking methods, washing,
    breaking shells, disposing of shells, and inviting the tribe to peel eel-grass.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Roasted cryptochitons are put into a dish with water, stirred by hand, rinsed
    by repeated water changes, and peeled from the shell on the back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman gathers winkles at the rocky beach of her house at low tide during
    the time when winkles gather to spawn.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The gathered winkles are put in a kettle with a little water and an old piece
    of matting, then boiled on the fire for about four hours.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The woman uses two stones and a mat to break the winkle shells, removes the
    edible part, and eats it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After eating the winkles, she rinses her mouth, drinks water, gathers the
    broken shells in the mat, and throws them away outside the house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Winkles, cryptochitons, and chitons are not given at a feast to many tribes,
    and only chiefs and their children eat winkles; the narrator states that the reason
    is not known.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In spring, after winter has passed, women prepare to twist eel-grass.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The eel-grass gatherer takes a twisting paddle, cedar-bark anchor-line, twisting
    hat, bailer, twisting-stick, and a small old canoe.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The twisting hat is worn because sea-water splashes into the women's faces
    while pulling up and washing eel-grass.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The woman paddles to a place known for thick eel-grass growing in soft sand
    and anchors the canoe with a stone tied to cedar-bark rope.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: She pushes the twisting-stick down into sea-water, strikes the sandy bottom,
    twists eel-grass around the stick, pulls it up, removes it, squeezes it, washes
    it in saltwater, measures it, and breaks off the lower end.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: She repeats the eel-grass twisting until much is gathered, stops when the
    tide rises, returns home, and sends her husband to invite his tribe to peel eel-grass.
  category: sequence
  evidence_refs:
  - ev:8
