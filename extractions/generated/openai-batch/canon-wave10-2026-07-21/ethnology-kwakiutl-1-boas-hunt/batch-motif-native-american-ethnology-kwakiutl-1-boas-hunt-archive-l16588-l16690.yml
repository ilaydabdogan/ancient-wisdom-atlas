canonical_text:
  quote: ''
  summary: The passage first describes a shaman’s diagnosis by pressing, sucking,
    and watching color changes on a sick person’s body. It then tells of Qlade, chief
    of the Nak!wax'da£xu at Tegiixstei, whose sister Qlwalanenega disappears to a
    mountain place, becomes gravely ill, and is brought into the winter-dance house.
    Shamans explain that menstruation frightened away woodland supernatural powers,
    prescribe moving her to the winter-dance house, and later instruct Qlade to prepare
    a new enclosed bed with matting, cedar, red cedar-bark, eagle-down, and a four-day
    prohibition against visiting. After two nights she is heard speaking with Helemil
    and saying that she has no sacred song.
  language: English
  quote_policy: summarized
