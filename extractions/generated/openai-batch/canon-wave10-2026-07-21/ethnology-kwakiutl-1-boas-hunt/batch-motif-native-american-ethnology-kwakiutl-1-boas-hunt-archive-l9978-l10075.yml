canonical_text:
  quote: ''
  summary: The passage describes competitive seal-feast blubber eating, steaming seal
    or porpoise meat, distribution and eating of seal-heads, and the announcement
    and organization of a whale-feast after a dead whale is found on the beach.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two rival chiefs of one tribe try to give great seal-feasts to outdo one another,
    and a long strip of blubber is given to the speaker of the rival chief.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A whole length of blubber is coiled into a feast-dish, olachen-oil is poured
    on it, and the rival chief's speaker puts one end around his neck, bites off blubber
    from the skin, and swallows it.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: An expert at bolting blubber can eat almost three fathoms, while a non-expert
    can eat no more than about half a fathom before giving up.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: People who do not belong to the rival chief receive lengthwise strips of blubber,
    put them around their necks, and bolt them, but oil is not poured on their portions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: After finishing the blubber eating, participants go behind the house to vomit
    and then wash themselves in hot water and urine.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Seal and porpoise are steamed with red-hot stones, hemlock branches, skunk-cabbage,
    seal-meat pieces, cedar-stick holes, blubber strips, fresh water, and a mat covering.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Four young men pour large buckets of fresh water over the cut seal-meat, other
    young men cover it with mats, and after about three hours the cooked meat is cooled,
    put on boards, and eaten.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The seal-head is normally given to the seal-hunter's steersman; when there
    are many seals, the hunter pays the steersman in blankets instead, and when a
    chief buys the seal, the head is given to old people and is not included with
    the meat of a seal-feast.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Old people remove the blubber from the seal-head, cut it into strips, boil
    the head, remove the boiled blubber, and eat it with dried halibut or dried salmon;
    the practice is called eating seal-heads.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When a hunter finds a dead whale, he returns home, stands in the bow of his
    canoe, promises a whale-feast, gives his daughter the name Place-of-cutting-Blubber,
    and invites people on her behalf.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The tribe sharpens butcher-knives, launches small canoes for whale-blubber,
    and travels to the whale; wives steer the canoes when they start.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: At the whale, the finder's father, if present, stands with the daughter behind
    the whale's neck and invites the tribe to cut the blubber of the 'salmon of Place-of-cutting-Blubber,'
    then calls the head chief.
  category: speech
  evidence_refs:
  - ev:7
