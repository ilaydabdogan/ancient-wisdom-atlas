canonical_text:
  quote: ''
  summary: The passage records part of a maturing-princess procedure involving regulated
    drinking and eating, abalone clothing, conditional copper placement, seclusion,
    washing, removal of straps, hair and eyebrow treatment, and deposition of ritual
    materials on a yew-tree and in a cave. It then describes sweat-bath treatments
    for sickness using a steaming-box, heated stones, seaweed, cedar materials, water,
    silver-perch oil, and blue hellebore.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The princess drinks water through a bone drinking-tube, swallows water four
    times, and is watched by an attendant shaman-woman so that she does not drink
    too much.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The princess eats thirty broken pieces of dried salmon dipped in oil, chews
    slowly, and stops after swallowing food four times.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The attendant removes the dish and oil-dish and draws water for the princess
    after eating.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Straps are put around the princess's body; she wears a tasselled hat and a
    blanket with abalone shells, named as an abalone-hat and abalone-blanket of the
    maturing princess.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: If her father owns a copper, it stands at the right side of the maturing princess
    so she may get coppers to carry on her back to her future husband.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The maturing princess sits in the house for a month and washes four times
    every fourth day before the straps are removed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the straps are removed, the attendant shaman-woman pulls out the princess's
    eyebrows and cuts off her hair.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The attendant takes the straps and the princess's soft cedar-bark seat into
    the woods, places the straps on a good yew-tree, and puts the cedar-bark in a
    cave where cedar-bark is hidden.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: For a sick man or woman, a long steaming-box is made, stones are heated on
    the house fire, seaweed is gathered from low water, and yellow cedar-tips are
    placed nearby.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The steaming-box is layered with seaweed, red-hot stones, more seaweed, and
    yellow cedar-tips; water is poured in and an old blanket is spread over it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The sick person lies naked in the steaming-box, covered so that only the head
    shows, and the heat may be adjusted by removing hot stones.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: After steaming, the sick person is washed to remove the cedar smell, rubbed
    with silver-perch oil while still perspiring, and wiped with soft shredded cedar-bark
    to prevent hard and painful skin.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: Another sweat-bath method uses cold-water washing, cedar-bark wiping, and
    a mixture made by rubbing blue hellebore root on rough sandstone in water, which
    the sick person sprinkles on the body after steaming.
  category: sequence
  evidence_refs:
  - ev:9
