canonical_text:
  quote: ''
  summary: The passage gives procedural accounts of mountain-goat hunting with a cedar-withe
    snare set on a trail near a precipice, followed by retrieving and carrying the
    goat, and of seal hunting by night from a small canoe using harpoon equipment,
    a bladder on the line, phosphorescence, and tactics to keep the seal from reaching
    kelp or seaweed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mountain-goat hunter searches for thick, long, branchless cedar-withes
    and twists them along their length.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The goat snare is set on a goat trail near a precipice, using a tree at the
    outer side of the trail as the tying point.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: After four days, the hunter checks the snare and may see a dead goat hanging
    below the trail.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The hunter pulls the goat up, removes the snare from its neck, and sets the
    snare again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The hunter cuts open the goat, removes the intestines, keeps the tallow, ties
    the legs, puts the tallow into the belly, sews the belly, and carries the goat
    down the mountain on his back.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Seal hunting is described as being done in the same way as porpoise hunting,
    with the same hunting-canoe type.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: At dark during the new moon, the hunter launches a small hunting-canoe and
    brings a canoe-box containing harpoon-points, harpoon-line, plant materials, and
    sinew.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The harpoon-shaft, harpoon-points, line, guide-rope, and prongs are arranged
    in the canoe; the prongs and points are put into sea-water so the prongs swell
    and hold the points better.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A bladder is moistened in sea-water and tied to the middle of the harpoon-line
    with two half-hitches.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The canoe keeps close to the island shore while the hunter watches for a diving
    seal, recognized by phosphorescence.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: If the seal is frightened away, the steersman moves his paddle edgewise in
    the water to produce phosphorescence, and the seal returns to look at it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The harpooneer spears the seal as it swims along the left side of the canoe,
    then hauls in the line.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A harpooned seal is said to seek seaweed or a kelp patch, where the line may
    break or the points may pull out; an expert hunter hauls in the line and turns
    the seal away from kelp.
  category: action
  evidence_refs:
  - ev:9
