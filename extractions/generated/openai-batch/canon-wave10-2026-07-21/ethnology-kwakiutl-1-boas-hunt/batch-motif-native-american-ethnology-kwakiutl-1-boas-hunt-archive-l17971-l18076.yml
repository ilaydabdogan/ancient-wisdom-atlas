literal_observations:
- id: obs:1
  text: The speaker affirms earlier words and cites the instruction to keep walking
    the trail of the chief-maker as applying to the speaker's chief, £nEmogwis.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: "£nEmogwis is described as walking the road of his grandfather Henak'!alasoe,
    who is said to have known how to invite great chiefs, give oil-feasts, and break
    coppers."
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker announces that he will press down the food eaten by the invited
    chiefs, turns to the guests, and speaks again as they finish eating.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker calls several guest chiefs by name and tells them and their people
    that what they were invited for by his chief is now well prepared.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker turns to his numaym, the SenLlEin, and says that what was marked
    out by the ancestors as proper speech has gone to the floor; then the speech is
    ended.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The commentary states that, at a SenLlEin feast, the names of the chiefs of
    the numaym are called out first, beginning with the head chief and proceeding
    by rank from elder to younger brothers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Even when a common man gives a feast, the three chiefs are always named, while
    the common man's own name is not called by the host speaker in the notice and
    food-pressing speeches.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After finishing the speech to his own numaym, the host speaker calls the head
    chief of each guest numaym by name and never names common men.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker of the guests praises the common man who gives the feast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The listed swear-words include death expressions used in friendly banter,
    friendly discussion, serious quarrels, arguments, and reproach after a person
    has broken an object or hurt someone.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Some swear-words are assigned to specific social contexts, including use by
    women in friendly banter, use by men of high rank in quarrels over social matters,
    and forms said never to be used by women but particularly by chiefs.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
- id: obs:12
  text: Some swear-words use images of skull teeth and eye-orbits, biting the floor,
    dying on the ground, and lying dead on the floor of the house.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
