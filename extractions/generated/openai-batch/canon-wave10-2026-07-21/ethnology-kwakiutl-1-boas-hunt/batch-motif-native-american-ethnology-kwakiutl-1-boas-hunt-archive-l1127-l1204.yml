  quote: ''
  summary: 'The passage describes canoe sail construction and use: a board sail made
    from short boards sewed with twisted cedar-withes, its short mast and handling
    in wind or calm, and a woven cedar-bark mat sail for small canoes with holes,
    sprit, mast, sheet, and cedar-bark ropes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A worker drills holes along a cross end-piece and cuts grooves between alternating
    pairs of drill-holes, then turns the sewed boards over and cuts grooves on the
    opposite side where grooves were not cut before.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The worker uses twisted cedar-withes to sew short boards together and repeats
    the process at several indicated positions until the end is reached.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The board sail is identified as the sail used by ancient people before white
    people came, and it is described as short boards sewed together.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The canoe mast for the board sail is short and stands in the bow, just showing
    above the top edge of the board sail.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the canoe runs before the wind, the wind presses the board sail against
    the mast; when calm comes, the sail and mast are taken down and stowed flat in
    the bow.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A woven mat sail for small canoes is made from the middle part of cedar-bark
    in narrow strips.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The mat sail is described as one fathom and two spans long and one fathom
