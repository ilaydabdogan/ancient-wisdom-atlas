  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A young cedar-tree is peeled for the mast, another young cedar-tree is used
    for the sprit, and twisted cedar-bark rope is used to hold the sail and sprit
    to the mast.
  category: action
  evidence_refs:
  - ev:4
