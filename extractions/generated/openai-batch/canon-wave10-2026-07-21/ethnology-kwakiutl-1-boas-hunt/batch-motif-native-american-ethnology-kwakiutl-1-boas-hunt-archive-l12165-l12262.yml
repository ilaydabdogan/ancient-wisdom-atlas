canonical_text:
  quote: ''
  summary: 'The passage describes serving steamed lupine roots with oil and water,
    then gives a procedure for preparing carrots: a woman heats stones in a fire,
    gathers eel-grass and fern, washes carrots, arranges the carrots in a basket over
    hot stones with plant material, pours water over the steaming place, covers it
    with mats, and later prepares dishes and oil while people are invited to eat.'
