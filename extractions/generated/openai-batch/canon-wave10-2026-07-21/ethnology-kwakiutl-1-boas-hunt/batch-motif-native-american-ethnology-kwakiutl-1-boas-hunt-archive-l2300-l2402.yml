canonical_text:
  quote: ''
  summary: The passage gives procedural descriptions for making a cedar-bark belt
    used in clover digging, a pine-branch bark-lifter for peeling cedar-bark, a yew-wood
    spade for digging lily-bulbs, and the beginning of instructions for a yew-wood
    digging-stick for clover. It includes repeated use of fire and tallow to harden
    wooden tools and identifies the bark-lifter as one used by the first people for
    peeling cedar-bark for blankets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman splits cedar-bark into narrow strips, weaves a belt three fingers
    wide, tapers the end, adds a bark rope, and uses the completed belt when digging
    clover.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person preparing to peel cedar-bark takes a small ax, a pine branch, and
    a rough sandstone, then burns and rubs the branch end to make it flat, rounded,
    and sharp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mountain-goat tallow is chewed, placed on the heated flat end of the bark-lifter,
    allowed to soak in near the fire, and cooled until hard.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bark-lifter is described as the bark-lifter of the first people, used
    when they peeled red and yellow cedar-bark for blankets before the arrival of
    white men.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A husband makes a spade for digging lily-bulbs from yew-wood by felling, measuring,
    splitting, and shaping the wood into a point, middle handle, and top crosspiece.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The lily-bulb spade is carried home, adzed, shaved smooth with a crooked knife,
    and hardened with fire and tallow in the same manner as a clover digging-stick.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: For a clover digging-stick, a man looks for a branchless yew-tree, cuts it
    down, measures and splits the wood through the heart, shapes it, carries it home,
    and begins work with an adz.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'The passage assigns some tasks relationally or generically: a woman makes
    the cedar-bark belt, her husband makes the lily-bulb spade, and a man searches
    for wood for the clover digging-stick.'
  category: relationship
  evidence_refs:
  - ev:1
  - ev:5
  - ev:7
