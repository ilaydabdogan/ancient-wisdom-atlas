canonical_text:
  quote: ''
  summary: 'The passage gives procedural descriptions for cooking and eating flounder:
    whole boiled flounder eaten by hand, boiled flounder eaten with spoons, and the
    beginning of a method for steaming flounders upright on heated stones using driftwood,
    cedar sticks, water, tongs, baskets, and mats.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman removes boiled whole flounders from a kettle and places them in dishes
    before the people who will eat them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The whole boiled flounders are eaten with the hands; the eaters suck the bones,
    head, and gills, then receive water to rinse their mouths and drink.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the spoon-eating preparation, flounder is boiled until it breaks and the
    meat comes away from the bones; oil is poured into the kettle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman distributes spoons, places dishes by the kettle, and serves liquid
    and meat into the dishes before the eaters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The eaters consume the spoon-served flounder with spoons, drink a little water
    afterward, and go out.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: For steaming flounders on stones, a man arranges driftwood above high-water
    mark, adds cedar kindling and crosswise wood, covers the arrangement with fresh
    stones, and lights fires beneath the stones.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man carries flounders from the fishing canoe to the beach, pours them
    onto an old mat, and brings tongs, a bucket, old mats for covering, and cedar
    wood from the house area.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The man removes red-hot stones with long tongs, sets them on a level place
    without moving his feet, levels them, and sprinkles fresh water on them to remove
    ashes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Cedar sticks are broken to a measured length and set upright among the red-hot
    stones at regular spacing.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The upright cedar sticks are named as holders for steamed flounders, and the
    red-hot stones are named as the steaming-place for flounders standing on edge
    on stones.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The man does not cut the flounders to remove intestines; he lays each flounder
    flat on the cedar sticks so that it stands on edge over the hot stones and leans
    against a cedar stick.
  category: action
  evidence_refs:
  - ev:7
