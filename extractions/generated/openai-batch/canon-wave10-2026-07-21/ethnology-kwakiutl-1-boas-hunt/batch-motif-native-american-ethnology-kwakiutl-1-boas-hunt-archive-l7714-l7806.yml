canonical_text:
  quote: ''
  summary: Procedural descriptions of preparing and eating boiled halibut-edges for
    chiefs, household roasted halibut-edges, and winter dried halibut-head. The passage
    includes invitation into a house, cooking by fire with water and cedar-bark bindings,
    singing during boiling, serving on food-mats, drinking and washing with water,
    carrying away leftovers, making roasting-tongs, and soaking dried heads in fishing-canoe
    bilge-water before boiling.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A house owner invites chiefs into the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman places a kettle by the fire nearest the door, puts tied bundles of
    halibut-edges into it, adds water, covers it with an old mat, and sets it on the
    fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chiefs sing songs of olden times while the kettle boils, and they stop
    after four songs have been sung.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The woman removes the mat, lifts the bundles with tongs into dishes, unties
    the cedar-bark bindings, and divides the food among the dishes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A food-mat is spread before the guests; water is given; the guests drink,
    eat by hand, bite off the ends of long pieces, drink again, and carry leftovers
    home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boiled halibut-edges are described as valuable and costly feast food,
    and they are not dipped in oil because they are very fat.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: For roasted halibut-edges, half-dried skin edges are torn off, tied in the
    middle with narrow cedar-bark strips, and hung in the rear of the house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the roasted-edges recipe, a woman asks her husband to make roasting-tongs,
    and he shaves and splits red pine to make them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The woman places half-dried edges in coils in the roasting-tongs, ties the
    tongs with cedar-bark, adds cedar sticks, puts the tool by the fire, and turns
    it while roasting.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Roasted edges are eaten after drinking water; hands are washed afterward,
    leftovers are put away, and the food is not dipped in oil or served to the tribe
    at a feast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In winter, when halibut cannot be caught, the fisherman's wife soaks dried
    halibut-head in bilge-water from her husband's fishing-canoe for four days.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The fisherman's wife carries soaked dried heads from the canoe to the house
    in a basket, places them in a kettle with water, and boils them for a long time.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After boiling dried heads, the woman ladles them into a dish, drinks water,
    eats them with her hands, throws remaining bones into the fire, returns leftovers
    to the kettle, and washes the used dish.
  category: sequence
  evidence_refs:
  - ev:7
