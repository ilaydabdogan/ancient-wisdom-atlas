canonical_text:
  quote: ''
  summary: The passage describes hunting taboos involving secrecy about a hunter's
    route, the controlled conduct of a hunter's wife, ritual bathing, restrictions
    on eating and movement, and blanket exchanges connected with a hunter's sweetheart.
    The conduct of women at home or in bathing sequences is said to affect the behavior
    of hunted animals and hunting success.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hunter avoids telling his wife which way he will go because women may tell
    one another; the animals are said to hear this talk, become shy, and be hunted
    in vain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An experienced hunter's wife watches him prepare, does not ask where he is
    going, goes to the beach after he leaves, returns slowly, sits quietly, and eats
    only a little.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The animals hunted by the husband are said to act as the wife does: they
    do not run about and do not eat to satiation.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wife of a sea-hunter lies in bed covered with a new mat so that sea-otters
    and fur-seals may be asleep when hunted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that land-hunters and sea-hunters get game easily if their
    wives sit at home well.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: An inexperienced young wife who walks around all the time is not told the
    hunting route and may be sent away by her husband after an unsuccessful hunt.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: An expert hunter's wife and her husband go to a river area, cohabit in the
    woods, enter the water together, step with right and left feet together, sit in
    the water together, sprinkle themselves, and wash.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the river washing, the hunter leaves for the hunt while the wife remains,
    then slowly returns home, sits still, and eats little so that the hunted animals
    may do the same; this is called ts!Egwelka and is described as purifying herself.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: When a hunter has a sweetheart and his wife knows it, the wife may give blankets
    to the sweetheart and to the sweetheart's husband, making the relationship publicly
    known.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: After four days the hunter cohabits with his sweetheart; at daylight they
    bathe in sea-water together, dive four times, rub their bodies, dry, put on blankets,
    and return slowly to their respective houses.
  category: sequence
  evidence_refs:
  - ev:8
