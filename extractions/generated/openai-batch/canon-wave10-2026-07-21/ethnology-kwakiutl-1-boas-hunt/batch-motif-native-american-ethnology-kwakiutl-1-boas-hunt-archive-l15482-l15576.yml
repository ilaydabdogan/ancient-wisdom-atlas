canonical_text:
  quote: ''
  summary: 'The passage describes placing burial-boxes in a twin burial-tree, followed
    by the departure of Salmon people and climbers. It then describes public procedures
    around parents of twins deciding whether to observe taboos: a delegated speaker
    asks them, the mother refuses, the parents emerge in work clothing with tools
    while men beat time, and a potlatch of blankets follows. A contrasting account
    describes parents who obey taboos during a later pregnancy, using ochre, cedar-bark
    rings, and an eagle feather, naming the next child Salmon-Tail or Salmon-Tail-Woman,
    and using cradles associated with the twins. The passage closes with a note about
    ten-month-old twins recognized as olachens and named by an older twin.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A burial-box is hoisted by rope to a board in a tree, placed above another
    burial-box, and tied to the twin burial-tree by the two climbers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the climbers descend, eight Salmon people rise and go home with the
    two climbers, while the parents of the dead twins do not go along.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Three days after the twins are born, the men of the tribe sit outside; the
    chiefs use a non-chief speaker because they fear the parents of twins and their
    ill wishes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The delegated speaker says he will ask the parents of twins whether they intend
    to keep the taboos.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The mother of the twins says they will not observe the taboos, will dress
    in work-clothes in the morning, and wants rapid time beaten when they leave the
    house.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: At daybreak, men assemble outside the house, receive batons, and beat rapidly
    on boards when told to do so.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The father of the twins comes out carrying a wedge-bag with wedges and a stone
    hammer, a paddle, and a mat.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The mother of the twins comes out carrying a clam-digging basket with a berrying
    basket inside, a paddle, a digging-stick, a mat, and a horse-clam-shell bailer;
    an old mat is over her back, and both parents wear belts.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The speaker announces that the parents will not obey the taboos, will continue
    to work as before, and have come in working-dresses.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A potlatch is promised, blankets are given to the tribe, and the parents are
    allowed to work when the mother is strong enough.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: When a mother of twins and her husband obey taboos during a later pregnancy,
    they paint their faces with ochre and wear red cedar-bark head-rings with a white
    eagle tail-feather during the pregnancy.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: The child born after the taboo-observing pregnancy is named Salmon-Tail if
    male and Salmon-Tail-Woman if female.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A cradle with a notched headboard belonging to the twin brothers is used for
    Salmon-Tail, and Salmon-Tail is treated as the elder twins were treated.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: When Salmon-Tail is ten months old, the child is taken out of the cradle and
    the cradles with notched headboards are taken to the cedar-bark cave.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: When twins are ten months old, an old man who is one of twins may recognize
    them as olachens, leg-rings and arm-rings are put on them, and an older twin is
    called to give an olachen-derived name.
  category: action
  evidence_refs:
  - ev:11
