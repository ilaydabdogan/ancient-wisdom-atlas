canonical_text:
  quote: ''
  summary: The passage describes rain-calling procedures using castorium dipped into
    a river with a spoken formula addressed to weather beings and winds. It also gives
    blue hellebore as a substitute substance placed in the river, though the associated
    speech is incomplete. A food rule says blue sea-eggs are kept four days before
    eating because immediate eating is said to cause bad weather and southeast wind;
    blue sea-eggs are called the grandfather of the southeast wind.
  language: English
  quote_policy: summarized
