canonical_text:
  quote: ''
  summary: 'The passage gives procedural recipes for salmon-spawn and sockeye salmon:
    roasting spawn by fire or on a hot stone, boiling silver-salmon spawn for household
    eating, soaking winter split sockeye under stones, boiling and serving it with
    oil and water to guests, and quick-scorching split salmon for a hungry owner.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When salmon are first caught by trolling, a woman takes whole salmon-spawn,
    places it in roasting-tongs, sets it by the fire until it turns white, and it
    is eaten hot at once.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Roasted salmon-spawn is not eaten cold, is not dipped in oil, and much water
    is drunk after it is eaten.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Another preparation heats a flat stone, lays whole salmon-spawn on it, sets
    it edgewise by the fire, waits until the spawn turns white, scrapes it off, and
    eats it hot.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hot-stone preparation is called "stuck-on-the-stone" and is not used for
    inviting people from another house; only the owner eats it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Silver-salmon spawn is put in a kettle, covered with water, placed on the
    fire, and boiled only until it becomes white.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman gives spoons to her children and husband and sets the kettle of
    boiled spawn before them; they eat it quickly at noon and in the evening, not
    in the morning because it makes one sleepy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In winter, split sockeye salmon are soaked in a water-filled soaking-box and
    held under water with two large stones for four or six days until soft.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The softened split salmon are cut into pieces, put in a kettle, covered with
    an old mat, given a little water, boiled, and the cover is struck with tongs so
    that steam will not come through.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: For guests, the woman places cooked split salmon in a dish, prepares an oil-dish,
    spreads a food-mat, and sets the food and oil before those who are to eat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Before eating the guest meal, the eaters rinse their mouths and drink water;
    they then break the split salmon, dip it in oil, and eat it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the guest meal, the woman clears and washes the dish, provides water
    for hand-washing, and the husband draws fresh water for the guests to drink before
    a second course.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the owner is hungry, she takes split salmon from the soaking-box, scorches
    it by the fire with tongs until steam comes through, and eats it dipped in oil;
    this is called "cooked quickly for those who are hungry."
  category: sequence
  evidence_refs:
  - ev:8
