canonical_text:
  quote: ''
  summary: 'The passage gives procedural accounts of preparing viburnum-berries: ripe
    berries are gathered by a woman, served to invited guests with oil, sucked, and
    their stems discarded in the fire; green berries are cleaned, stored, and prepared
    for steaming by gathering leaves, measuring and digging a pit, making a fire with
    stones, washing a dish, and pounding the berries with a stone hammer.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman gathers ripe viburnum-berries in a front-basket and returns home when
    the basket is full.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After returning home, the woman calls anyone who wants to come and gives them
    ripe viburnum-berries to suck.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman spreads a new mat before the guests, pours the berries onto it,
    and scatters the berries along the mat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An oil-dish is placed beside the berries, and the men dip bunches of berries
    into the oil before putting them in the mouth.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The berries are pressed against the tongue and palate until they burst, and
    the stems are thrown into the fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some participants stop eating sooner because their tongues cannot endure the
    rubbing; these are described as people who have not eaten sucked viburnum-berries
    before.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: For steamed viburnum-berries, green berries are picked, cleaned of stems,
    placed in a large basket, and kept in a cool corner of the house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The woman goes into the woods to collect broad skunk-cabbage leaves and fern-fronds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Inside the house, the woman uses a clam-digging stick, a large horse-clam
    shell, and cedar-stick measurements to mark and dig a hole.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The dug hole is filled with dry driftwood, crossed with small driftwood pieces,
    covered with stones, and lit from underneath for steaming.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The woman washes a large dish with water and pounds handfuls of green berries
    with her husband's stone hammer until all the berries are crushed.
  category: action
  evidence_refs:
  - ev:7
