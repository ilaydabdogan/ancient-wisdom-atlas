canonical_text:
  quote: ''
  summary: The passage describes Kwakiutl social customs concerning food distribution
    by rank and the procedures for a currant-cake feast. It details how salmon, porpoise,
    seal, and cinquefoil roots are apportioned according to social position, then
    describes invitations, water drawing, dish preparation, mats, firewood, repeated
    calls, seasonal calling formulas, treatment of late high-status guests, feast-song
    requests, counter-feast promises, and winter-dance-season involvement of cannibal
    dancers and the Seal Society.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The size of salmon pieces differs between a chieftainess giving food to a
    chief and the wife of a common man, who breaks larger pieces.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At great feasts, porpoise dorsal and side fins are given to chiefs, the chest
    to the head chief, and the body to common people.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Hair-seal portions are distributed by rank: chiefs receive the chest, chiefs
    next in rank receive limbs, common people receive body pieces, and the lowest-ranked
    people receive the tail.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Trouble may follow seal-feasts and feasts of short and long cinquefoil roots
    when a person of noble descent is given a low-status portion.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: For the currant feast, a woman sends two young men to invite her husband’s
    tribe; the same young men draw water and pour a little into each dish.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The two young men call guests, spread long mats, and later put firewood on
    the fire at the host’s direction.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: On the fourth call, the messengers use different speech in winter-dance season
    and in the secular summer season.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A late person is generally described as the son or daughter of a chief and
    is ashamed; this person asks for a feast-song and then has a speaker promise a
    feast, often by saying a canoe will be sold for it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: During winter-dance season, if an awaited chief’s beloved daughter stays away
    too long, the hosts stop waiting and call the cannibal dancers and the Seal Society.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the absent woman arrives by paddling to the beach, the messengers call
    her in; she puts on a good blanket, enters with the callers, and is announced
    at the door of the feast-house.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
