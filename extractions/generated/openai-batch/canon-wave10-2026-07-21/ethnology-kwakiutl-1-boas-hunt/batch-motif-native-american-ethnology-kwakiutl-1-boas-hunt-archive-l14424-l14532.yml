canonical_text:
  quote: ''
  summary: 'The passage reports accounts of a fertility medicine using lizard feet
    chewed with food or biscuit and fed to a wife, followed by cohabitation, restrictions
    on the wife’s movement, and subsequent pregnancy. A second account repeats a similar
    procedure with a male and female lizard and explains girls as resulting from the
    husband’s left-side position. The passage then describes pregnancy and birth precautions:
    spouses are careful when a woman is with child; the husband treats blood or signs
    from injured animals with cedar-bark, passes it down the wife’s back four times
    with a spoken warning, hides it under a cedar-tree, and keeps specified animal
    parts to pass over the wife during childbirth.'
  language: English, with Latin passages embedded
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A first speaker describes taking the fore-feet and hind-feet of lizards, chewing
    them with food, and placing four mouthfuls on the house floor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first speaker calls his wife to eat the chewed food; after cohabitation,
    she is told not to move and to lie supine, later stops menstruating, becomes pregnant,
    and has a boy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A second speaker finds a female and a male lizard, ties them together chest
    to chest, ties them to his belt on his right side, and keeps them on his waist
    for four days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The second speaker notes that his wife is menstruating and avoids cohabitation
    during that time.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The second speaker cuts off the fore-legs and hind-feet of the male and female
    lizards, chews each set with biscuit, and makes four piles of chewed biscuit on
    the floor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The second speaker’s wife eats the four biscuit pieces; after cohabitation
    she is instructed to lie on her back with legs extended, later stops menstruating,
    becomes pregnant, and bears a girl; the account links the girl to the husband’s
    left-side position.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The second speaker states that after eight winters without children, the couple
    has children for the next eight winters, all girls.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: When a woman is with child, both spouses are said to be careful; the husband
    avoids or treats things he sees that are hurt by a man, birds with blood on the
    head, and seals with blood on the head or singed hair.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The husband wipes blood with soft shredded cedar-bark, passes the bloody cedar-bark
    down his wife’s back four times while saying a warning formula, and hides it in
    a dry place under a cedar-tree.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The husband keeps a deer tail, the ends of four octopus arms, the tip of a
    snake tail, and toad feet, and passes them over his wife when she gives birth.
  category: action
  evidence_refs:
  - ev:7
