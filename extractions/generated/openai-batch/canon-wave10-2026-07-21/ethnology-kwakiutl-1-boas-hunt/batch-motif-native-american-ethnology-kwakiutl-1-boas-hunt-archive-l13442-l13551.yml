canonical_text:
  quote: ''
  summary: The passage records customs and taboos concerning new baskets and huckleberry
    picking, sealing, porpoise-hunting, first dog-salmon rites, and first silver-salmon
    preparation. It includes bad-luck rules, an omen involving a raven, protective
    use of fire and plant substances, prayer to salmon as supernatural swimmers, and
    return of salmon remains to water so that salmon come to life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a new basket is finished, women prepare immediately to pick huckleberries
    because not putting huckleberries into a new basket at once is said to bring bad
    luck.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Singed hair from seal flippers is knocked off with tongs; hunters do not allow
    it to be scraped off, because otherwise the seal would escape when the hunter
    goes hunting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A raven hanging down while holding the end of a branch in its beak is said
    to mean that a man's head will be cut off in war.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: A hunter pushes his paddle over the fire to make it black and restricts young
    women, young men, and menstruating women from stepping over it because they may
    bring bad luck.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The hunter keeps his canoe-box in a house corner, places two sitting mats
    over the fire, leaves the harpoon-shaft in the hunting-canoe, and hangs the bladder-float
    where the canoe-box is kept.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A porpoise-hunter keeps blue-hellebore root, peucedanum seeds, and dried porpoise
    back-sinew in the canoe-box.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: If a sea-monster appears at night during porpoise spearing, hellebore root
    and peucedanum seeds are chewed and spat overboard on both sides of the hunting-canoe;
    the sea-monster sinks when it smells the hellebore root.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: When the first dog-salmon of the season has been caught, the fisherman's wife
    meets him, sees the catch, and prays to the salmon as Supernatural-Ones and Swimmers,
    thanking them for coming as food and asking protection.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: After speared salmon are cut up, the woman gathers slime and other salmon
    remains into a basket and pours them into the water at the river mouth because
    the salmon are said to come to life when the intestines are put there.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The intestines are broken off at the anal fin for speared salmon, but cut
    off at the anal fin for hook-caught salmon; doing it wrongly for hook-caught fish
    is said to make the fisherman's line break.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: When a man first goes trolling for silver-salmon and catches four, his wife
    meets him, prays to the silver-salmon, carries the four fish up, cuts them, and
    begins preparing them with roasting-tongs.
  category: action
  evidence_refs:
  - ev:10
