canonical_text:
  quote: ''
  summary: The passage gives practical food-preparation instructions for kelp-fish
    and perch. It describes who eats quickly roasted kelp-fish, why scales are feared,
    one Kwakiutl method for boiling cleaned perch and serving it, and a Koskimo method
    for boiling whole perch with internal parts and serving the fish and liquid.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After eating kelp-fish, the eater drinks only a little water because it tastes
    salty and she expects to keep drinking water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The person who caught the kelp-fish may roast one by the fire while it lies
    on its belly when she is very hungry after fishing with a fish-trap.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Old women eat kelp-fish roasted by the fire with intestines, gills, and scales
    still present; young women avoid this because scales may stick in the throat and
    are said to kill those who eat them with the meat.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the first perch method, the wife cuts the perch open, removes gills and
    intestines, throws them out of the house, scrapes off the scales, cuts across
    the body, and puts the fish in boiling water in a kettle over the fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the first perch method, a man stirs the boiling perch with tongs, and the
    fish stays over the fire for about half an hour before being taken off.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the first perch method, spoons are given to the eaters; they remove backbones
    and ribs, suck heads, eyes, and brains, throw sucked head-bones into the fire,
    eat liquid with meat, drink a little water, and then go out.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Koskimo perch method, the fish is cut and scaled similarly, but the
    woman squeezes out the stomach, guts, and gill slime, then later boils the whole
    perch together with the squeezed intestines, stomach, and gills.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the Koskimo method, the perch is not stirred because it is called whole
    perch; the woman uses a rib-strainer to lift the boiled perch into a dish and
    lays the fish crosswise.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the Koskimo method, men pick meat from the fish, the host gives spoons
    and pours boiling liquid over what remains, and the men eat the liquid with gills,
    stomach, and intestines.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Koskimo method ends with the statement that the eaters do not drink water
    immediately, but drink later when the salty taste makes them wish to drink.
  category: sequence
  evidence_refs:
  - ev:9
