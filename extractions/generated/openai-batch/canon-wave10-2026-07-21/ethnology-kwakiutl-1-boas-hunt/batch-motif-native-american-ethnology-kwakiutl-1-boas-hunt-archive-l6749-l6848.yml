canonical_text:
  quote: ''
  summary: The passage describes procedures for serving and eating several salmon
    parts, including fins and tails, roasted salmon-tails and backbones, winter-prepared
    salmon-cheeks, fresh salmon-heads, and the opening of a section on preserved salmon-heads.
    It records invitations, ranked guests, food-mats, water before and after eating,
    cooking over fire, handwashing, omitted second courses, omitted oil, and a stated
    ancestral warning that silver-salmon would disappear if certain forbidden serving
    practices were used.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After eating pectoral fins, anal fins, and tails, guests wash their hands,
    are given water to drink, often receive no second course, and leave the house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old people are said to eat the three fish parts under discussion, while only
    poor people have these three kinds as food.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When there are many roasted salmon-tails, the owner invites friends early
    in the morning to eat breakfast in his house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For roasted salmon-tails, the host spreads a food-mat before the guests, places
    the tails lengthwise on it, gives water before eating, draws fresh water during
    the meal, and gives water after eating.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: No oil, dish, or mouth-rinsing is used with roasted salmon-tails, because
    the first people said silver-salmon would disappear if those three things were
    done.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A new food-mat is used for roasted salmon-tails, and guests do not wipe their
    hands but may rub them to dry off the fat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The owner of the salmon-tails later eats some leftovers when hungry and follows
    the same procedure with roasted backbones.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In winter, a woman fills a soaking-box halfway with water, pours in preserved
    plucked salmon-cheeks, and soaks them four days in the house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the salmon-cheeks have soaked four days, the woman asks her husband
    to invite old chiefs, because only chiefs eat this kind of food.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The wife spreads mats for the invited chiefs, who enter and sit on the mats.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The husband puts a kettle of water on the house fire; the wife places the
    salmon-cheeks into the boiling kettle, then removes them with tongs and serves
    them in dishes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: One dish of salmon-cheeks is placed before each four men, and a bucket of
    water is placed before the guests before they begin to eat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The liquid from the salmon-cheeks is served in a dish, with one spoon counted
    for each guest, and is eaten with spoons while the cheeks are eaten.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: After eating salmon-cheeks, the serving dish is emptied and refilled with
    good water for handwashing; the guests then drink from a bucket and leave.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: No second course and no oil are served after salmon-cheeks; only the liquid
    of the cheeks is drunk while they are eaten.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: Fresh salmon-heads may be eaten when soft, and old people come to the owner
    of this food asking to be invited.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Fresh salmon-heads are put on a food-mat for those who ask to be invited;
    they are eaten at noon or evening, not in the morning, and the eaters do not rinse
    their mouths.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: Eaters of fresh roasted salmon-heads drink water before and after eating,
    then take a mouthful of water and squirt it over their hands to wash off grease
    from holding the whole heads.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: No second course is served after fresh roasted salmon-heads.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:20
  text: The next section begins by saying that in winter common people are invited
    to the house of the owner for roasted preserved salmon-heads.
  category: setting
  evidence_refs:
  - ev:10
