canonical_text:
  quote: ''
  summary: The passage describes practical procedures for gathering and eating flat
    sea-eggs, blue sea-eggs, and barnacles. It includes household distribution, cutting
    and washing sea-eggs, fire-related handling of shells, a note about a ghost eating
    sea-eggs if a disposal action is omitted, lunar-tidal timing for blue sea-eggs,
    a four-day delay before eating them, and barnacle gathering by canoe with beach-fire
    preparation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed picker selects large flat sea-eggs, puts them in a basket, pours
    them into a canoe, repeats until he has enough, and returns home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the sea-egg canoe reaches the beach of the house, its anchor is put into
    the water before the picker goes into the house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife carries sea-eggs from the beach into the house, puts them by the
    fire, and sends children to call the men to carry up more sea-eggs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men take baskets to the canoe, fill them with sea-eggs, and carry the baskets
    on their backs into their houses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sea-eggs are cut with knives; one half is thrown toward the fire, and the
