literal_observations:
- id: obs:1
  text: The passage gives several tribal terms for “soul,” with glosses such as “man
    on body,” “manhood,” “means of life,” “bird,” “man's mask,” and “means of healing.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person called “head shaman” in the winter ceremonial is described as not
    actually being a shaman; red cedar-bark is placed on his head, and he never dances
    in the winter ceremonial.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The “head shaman” is also identified as the head man of the Sparrow Society,
    and the title applies only during the winter ceremonial.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker rejects claims that shamans use spies to locate sick people, name
    the price to be paid, bite their tongues and vomit blood, or bite the sick person
    to create a blue mark.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: K'!eso£yak'ilis is said to have had his soul restored by HelagolsEla, a female
    shaman of the Nimkish; he claimed the object called his soul was dried berries,
    but the speaker says people did not believe him and describes him as a liar and
    mocker of shamans.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: HelagolsEla is described as a shaman whom people believe in, and she goes
    into houses of sick people to cure them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A shaman who cures a sick person does not ask for pay; poor people may not
    pay, common people may pay blankets, and chiefs pay according to their rank and
    shame obligations.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the described cure procedure, the shaman sits at the sick person's right
    side, asks where the sickness is felt, washes his hands in water, presses the
    indicated spot with his first finger, and reads a red color as recovery and persistent
    whiteness as a sign the patient will not live long.
  category: sequence
  evidence_refs:
  - ev:7
