canonical_text:
  quote: ''
  summary: The passage describes Kwakiutl procedures for preparing and eating codfish
    heads, roasted codfish, another form of roasted codfish, red cod, and black cod.
    It gives details about boiling, roasting by the fire, use of water, oil, mats,
    tongs, disposal of bones or skin into the fire, household or family-only consumption,
    and black cod as a food for inviting many people when other preserved fish are
    unavailable.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman pours water over an old mat so that it will not catch fire when the
    kettle is put on the fire, then keeps the kettle boiling for a long time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After boiling, the woman removes whole codfish heads from the kettle into
    a dish and calls her house-mates to eat them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The house-mates drink water, eat the codfish heads, first the eyes and then
    the fat of the skull, suck the bones, and throw the bones into the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the codfish-head meal, the woman cleans the kettle with water, pours
    fresh water for the guests, and the guests wash their hands and mouths before
    drinking fresh water again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Codfish heads are not used to invite many men or the numaym; only the house-mates
    of the owner eat them, and no oil is added because the food is already fat.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: For roasted codfish, a woman cuts the fish, makes split pine roasting-tongs,
    places four codfish in each pair, ties them with cedar-bark strips, and roasts
    them by the side of the fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Roasted codfish is first roasted on the flesh side and then on the skin side;
    when the skin side is blackened, it is removed from the fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Hot roasted codfish is not dipped into oil because it is still moist with
    fat; when cold and dry, it may be dipped into oil.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:9
  text: One roasted codfish preparation is eaten only by the married couple and their
    children, not by many invited people; water is drunk before and after eating.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:10
  text: In another roasted-codfish procedure, the woman roasts the belly and both
    sides by the fire, then places the fish on a food-mat and calls her husband to
    eat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: In the second roasted-codfish procedure, the woman removes the skin and throws
    it into the fire, breaks the meat into pieces, and later shakes the remains and
    bones into the fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: After the second roasted-codfish meal, the husband squirts four mouthfuls
    of water over his hands while his wife places her hands under his, and they wash
    their hands together.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:13
  text: Red cod and several named fish are treated in the same way, except that the
    xuldzos and kelp-fish are not dried because they are very small.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:14
  text: Black cod is treated like dried salmon when dried, scorched for morning eating,
    soaked and boiled when long kept, dipped into oil, and used for inviting many
    people when the host lacks dried salmon and dried halibut.
  category: relationship
  evidence_refs:
  - ev:5
