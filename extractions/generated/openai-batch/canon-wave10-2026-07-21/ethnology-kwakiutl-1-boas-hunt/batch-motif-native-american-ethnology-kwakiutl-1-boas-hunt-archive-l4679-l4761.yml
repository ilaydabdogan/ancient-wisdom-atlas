canonical_text:
  quote: ''
  summary: 'The passage describes a woman processing a halibut: cutting off skin and
    meat, separating parts, tying and hanging ribs, preparing fins, making a driftwood
    fire, heating stones, steaming fish parts with grasses, water, and mats, disposing
    of guts and slime in the sea, spreading and covering fresh pieces for later splitting,
    and inviting people to eat while collecting leftover bones on a mat.'
