canonical_text:
  quote: ''
  summary: 'The passage gives procedural descriptions of four food-gathering practices:
    fishing kelp-fish with baited traps in eel-grass, taking perch from tide-exposed
    traps, collecting herring spawn on hemlock branches anchored in the water, and
    catching devil-fish by probing its underwater hole and spearing it when it emerges.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman equips a small fishing canoe with a harpoon for sea-eggs, a yew-wood
    prying-stick for mussels, and a fish-trap.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sea-egg harpoon is a thin red-pine rod, sometimes three fathoms long,
    with two tough-wood points tied on with split spruce-root.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mussel prying-stick is made from a broken paddle; it is four spans long,
    with a flat end four fingers wide and a round handle.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sea-eggs, or mussels when sea-eggs are unavailable, are broken and put into
    the fish-trap as bait.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The kelp-fish trap is placed on the bottom among eel-grass in about two fathoms
    of water so that the fish do not clearly see it as a trap.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Kelp-fish enter the trap for the bait; after a time the woman hauls up the
    trap, removes the fish, and carries them home in a small basket.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: Perch enter a trap at high tide, and the trap becomes dry on the beach when
    the ebb tide is very low.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The perch fisherman watches for splashing, removes ballast stones, hemlock
    branches, and the roof of the trap, takes out the fish, removes old clam-shell
    bait, rebaits with broken clams, and reassembles the trap.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The herring-spawn gatherer seeks hemlock branches with smooth leaves and waits
    until the sea looks milky as a sign of spawning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Hemlock branches are tied to long cedar poles with thin rope, weighted and
    anchored with stones, and left in the water at the spawning place for four days.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After four days, the herring-spawn gatherer cleans his canoe, goes to the
    submerged hemlock, unties it, and puts the spawn-covered branches into the canoe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The devil-fish fisherman uses a long pole without a hook and probes the devil-fish
    in its hole, which is called its stone house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the fisherman thrusts at the hard part of the devil-fish, the animal
    comes out of its hole and is speared and lifted into the canoe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The devil-fish’s intestines are removed immediately, and it is not struck
    on a rock because the fisherman wants it to be hard.
  category: action
  evidence_refs:
  - ev:6
