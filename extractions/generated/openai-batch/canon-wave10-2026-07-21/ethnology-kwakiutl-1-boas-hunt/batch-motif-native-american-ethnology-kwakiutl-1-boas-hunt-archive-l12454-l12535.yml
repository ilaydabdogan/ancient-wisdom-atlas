canonical_text:
  quote: ''
  summary: The passage describes procedures for eating elderberry cakes at a winter-dance
    feast and for gathering and cooking unripe elderberries. It gives details about
    invitation timing, house preparation, water, dishes, soaking, singing, rubbing
    cakes with water and oil, serving and eating, rinsing afterward, seasonal ripening,
    picking green elderberries, boiling them with gravel in a kettle, and using cedar
    implements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Elderberry cakes are eaten in connection with a winter dance, and the host
    invites people at noon rather than in the morning because they are said to cause
    stomach-ache in the morning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Messengers call the invitees, while the host's wife clears the house and sets
    out dishes, water-buckets, elderberry boxes, and oil near the door.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Water is drawn and placed in large buckets before the guests enter and wash
    the dishes.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The woman opens the elderberry box, unties cedar-bark strings, places two
    elderberry cakes in each dish, and pours fresh water over them to soak while the
    feasters begin singing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After four winter-dance songs, young men of the host's numaym rub the soaked
    cakes into pieces and mix them with water until thick.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Oil is poured into all the dishes before spoons are distributed to the guests.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The elderberry dishes are carried out one dish for each six men, and the guests
    eat by sucking out juice and blowing out seeds; old people swallow the seeds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After eating, water is passed around so the eaters can rinse their mouths,
    drink a little water, and leave.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Elderberries are described as ripening before the other kinds of berries and
    therefore being picked first.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Old women are said to like boiled elderberries before they are red, and a
    woman picks green elderberries in bunches with a small, small-meshed basket.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: For cooking unripe elderberries, the woman puts clean gravel into a small
    kettle, adds the berries and a little water, covers it with old matting, places
    it on the fire, and watches until it boils.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After boiling, the woman uses a spoon to lift and press the elderberries,
    adds oil, licks juice from the spoon, and makes a split cedar-stick implement
    used like a fork.
  category: sequence
  evidence_refs:
  - ev:9
