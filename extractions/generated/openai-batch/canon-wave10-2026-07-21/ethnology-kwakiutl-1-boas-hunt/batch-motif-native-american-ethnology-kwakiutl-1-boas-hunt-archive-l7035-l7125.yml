canonical_text:
  quote: ''
  summary: A procedural ethnographic passage describes preparing salmon-spawn in kettles,
    serving it to guests with oil and a fixed order of eating and drinking, eating
    dried or sticky salmon-spawn with salmon-berry sprouts and fern-root, using dried
    salmon-spawn for lost voices during winter dance activity, using chewed salmon-spawn
    and cedar-bark in black paint preparation, and processing fern-root with fire,
    beating, measuring, and serving with sticky spawn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man heats a kettle of salmon-spawn over the fire, uses a long-handled ladle
    to dip up and pour back the salmon-spawn and liquid, and does not stir it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The salmon-spawn is taken off the fire as soon as it begins to boil over and
    is poured into a cold kettle so that the spawn does not separate from the liquid
    and remains mushy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man puts the clayey spawn into dishes, pours much oil into it, and places
    it before the guests.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The wife distributes spoons to the guests, who eat before drinking water;
    the man provides fresh water for drinking after they finish eating.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Those who eat salmon-spawn do not eat anything before it and do not eat a
    second course with it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Dried salmon-spawn is eaten with salmon-berry sprouts or fern-root, not with
    oil; the passage says it can make one feel sick when eaten alone and not when
    eaten with those two foods.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the winter dance setting, dried salmon-spawn is passed to people who have
    lost their voices; they chew it for a long time and swallow the juice, after which
    they no longer have lost voices.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A painter chews rubbed cedar-bark with dried salmon-spawn, spits the gum-like
    and milk-like liquid into a paint-dish, and rubs coal in it until the paint is
    very black.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In spring, a bladder containing salmon-spawn is taken down, broken open, and
    sticky spawn is eaten with peeled salmon-berry sprouts when oil is not wanted.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Women dig fern-root, roast it under the fire until the bark is blackened,
    beat it with a wedge on firewood until flattened, measure four-finger-width lengths,
    and place the pieces on a food-mat.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: Roasted fern-root is eaten with sticky spawn when sticky spawn is available.
  category: relationship
  evidence_refs:
  - ev:10
