canonical_text:
  quote: ''
  summary: The passage records Kwakiutl interpretations of bodily twitching and itching
    as signs of future death, mourning acts, illness, weather, food, visitors, and
    war. It also describes a practice by which a person whose afterbirth is pecked
    or eaten by ravens is believed to understand raven cries, followed by a list of
    raven calls and their meanings. A short eating note says that finishing all food
    given to a person is a bad sign.
  language: English, with some Latin passages
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Twitching of the crown of the head is described as a sign that a man will
    cut off his hair for a relative who is going to die; hair is cut four days after
    a near relative's death.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Several facial or upper-body sensations are linked to mourning actions: nose
    twitching to blowing the nose while crying, upper-lip twitching to tears running
    down, cheek twitching or itching to face-scratching while crying, stomach twitching
    to heaving while wailing, and thumb twitching to wiping the eyes.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Genital tremors are described in Latin as signs of the death of a woman's
    infant, a man's wife, or a man's female partner.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Twitching and itching of the feet are described as a sign that a woman, and
    likewise a man, will spend a long time sitting in a widow's house after the spouse
    dies.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A woman's shoulder-joint twitching is described as a sign that one of her
    children will die, because the child lies there when sleeping with its mother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A woman's sides twitching is described as a sign that she will lie sick in
    bed.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'A man''s whole body twitching is described as a sequence of signs that one
    of his children will die: arms, chest, upper lip, and stomach are each tied to
    carrying the child or to crying.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Eyelid twitching is described as a sign that it will rain that day, because
    rain-water runs down at the eye.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Twitching of the small of the back of a hunter is described as a sign of calm
    fine weather, when he will sit for a long time in a small hunting canoe.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: Twitching of a sea hunter's under-lip is described as a sign that he will
    eat many kinds of meat, because fat passes that place.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Twitching toes are described as a sign that a visitor will come, and neck
    twitching as a sign that a man's head will be cut off in war.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: To make a person understand raven cries, the person's afterbirth is placed
    on the beach for ravens to peck at or eat.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: A grown person whose afterbirth has been eaten by ravens is said to understand
    raven cries; such persons are described as few in number.
  category: attribute
  evidence_refs:
  - ev:12
  - ev:14
- id: obs:14
  text: Ravens are described as reporting the arrival of warriors who come to make
    war, and people consult someone who understands raven cries when ravens tumble
    about and cry.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:15
  text: Raven tumbling and falling feathers are described as bad news.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: The listed raven cries predict events including attack by warriors, bodies
    from drowned canoe victims, successful hunters bringing meat, a death, a woman's
    death, calm weather, sunshine, heavy rain, a stranger's visit, poor salmon run,
    and bad news when ravens cry while fighting in the air.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:17
  text: In the eating note, a person folds a morsel, chews the end, dips it into oil,
    and stops before eating all of what has been given, because eating all is called
    a bad sign.
  category: action
  evidence_refs:
  - ev:16
