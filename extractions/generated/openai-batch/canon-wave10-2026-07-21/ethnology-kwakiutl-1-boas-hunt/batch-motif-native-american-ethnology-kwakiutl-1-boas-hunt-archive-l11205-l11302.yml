literal_observations:
- id: obs:1
  text: A man hosting the eel-grass feast clears his house, spreads mats, and prepares
    oil-dishes and oil before the peelers enter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young men of the host's numaym carry eel-grass into the house and place it
    before those who will peel it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Oil is poured into dishes, with four men assigned to each oil-dish, and eel-grass
    is scattered in front of the peelers.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The peelers take four pieces of eel-grass, remove small roots and leaves,
    break roots to uniform length, tie eight pieces together with leaves, dip the
    bundle into oil, and eat it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After eating, participants take uneaten eel-grass out of the house and place
    it before their wives at home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Participants are said not to drink water before going out of the feast house
    and when entering their own houses.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The eel-grass feast is described as a valuable feast, and eel-grass is identified
    as food of the first people in the mythical period.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: For seaweed, after visitors finish dried salmon, a woman tears seaweed into
    strips and gives it to young men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Some young men cut seaweed with an adz on a purpose-made hemlock-wood block,
    while others chew seaweed and place it into a large dish.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Chewed seaweed is cooked in a kettle with water over fire, stirred with a
    long-handled ladle, mixed with oil, and served with spoons on a food-mat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Seaweed guests do not drink water before eating the seaweed, but drink fresh
    water afterward to cool themselves.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Powdered seaweed is kept warm with red-hot stones in a small kettle and is
    not served from a dish because it is considered good only when hot.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Salmon-spawn with seaweed is prepared by boiling dog-salmon spawn, adding
    cold water and chopped seaweed, boiling again, adding oil, and eating it with
    spoons.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Clams with seaweed are prepared by opening clams, removing sand, placing them
    in a kettle, and adding water.
  category: sequence
  evidence_refs:
  - ev:9
