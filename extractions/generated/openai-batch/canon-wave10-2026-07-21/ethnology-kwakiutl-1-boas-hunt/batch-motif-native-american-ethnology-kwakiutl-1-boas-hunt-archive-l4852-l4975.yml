canonical_text:
  quote: ''
  summary: The passage describes procedures for preparing and preserving halibut,
    codfish, and herring-spawn. A woman cuts halibut into long thin pieces, dries
    it on poles, covers it at night against dew, reopens and dries it again, folds,
    presses, baskets, and stores it. Codfish is processed similarly, with sun- and
    smoke-drying variants. Herring-spawn is brought by a man in a canoe, dried on
    hemlock branches set on poles at a windy rocky place, then removed from the branches
    by his wife.
  language: English
  quote_policy: summarized
