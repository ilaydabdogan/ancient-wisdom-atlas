canonical_text:
  quote: ''
  summary: The passage describes eating melted tallow from a fat-stick, then gives
    procedures and social setting for a mountain-goat brisket feast involving rival
    chiefs, sons-in-law who are mountain-goat hunters, public invitation, singing,
    distribution of boiled brisket and fat, name-giving, and reciprocal feasting.
    It then begins a recipe for steaming fresh mountain-goat meat with hemlock branches,
    heated stones, water, and mats.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A knob on a fat-stick is reheated in the fire and sucked until the melted
    tallow is gone, continuing until only skin remains at the end of the stick.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two rival chiefs in one tribe each have a son-in-law who is a mountain-goat
    hunter, and the rival sides watch each other when feasts are given.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ten boxes of dried briskets, sides, and stomach-fat are treated as a quantity
    that the rival mountain-goat hunter tries to match.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mountain-goat hunter gives mountain-goat food as a marriage-present to
    his chief father-in-law.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The meat is soaked in a small canoe for three days; afterward the tribes are
    called and a fire is built in the chief's house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Young men draw water, fill large kettles, put soaked briskets into them, place
    them on the fire, and invite the tribes again when the water begins to boil.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The rival chief enters first with his numaym and sits in his seat so that
    the rival chief will not be able to say he was afraid to attend.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Feast-songs of the host's rival are sung; the rival rises when his song is
    sung and promises a feast.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Stomach-fat is cut into pieces and put into the boiling liquid of the cooked
    goat-briskets; dishes, spoons, and tongs are used to distribute one brisket per
    dish and one dish for each two guests.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A kettle is placed before the rival of the host, and a young man tells him
    to eat; the chief answers that he will do so.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The guests eat tallow from the top of the cooking liquid and then eat boiled
    brisket; they eat little, leave, and do not drink water afterward.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The host gives names to his children on account of this food, and the rival
    chief later gives the same kind of feast.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Fresh mountain-goat meat is prepared for steaming by skinning the goat, gathering
    hemlock branches, collecting beach stones, building a wood structure for heating
    stones, slicing the meat, drawing water, preparing mats, and laying hemlock branches
    over white-hot stones.
  category: sequence
  evidence_refs:
  - ev:9
