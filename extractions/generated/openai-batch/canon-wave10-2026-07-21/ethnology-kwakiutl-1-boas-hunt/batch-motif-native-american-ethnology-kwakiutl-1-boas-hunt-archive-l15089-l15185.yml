canonical_text:
  quote: ''
  summary: 'The passage describes a birth and cradling procedure for twins: special
    notched cradles are made, eagle tail feathers are placed on the head-boards, the
    twins are wrapped in cedar-bark and painted red with their parents, the father
    is restricted from ordinary work, and an experienced mother of twins performs
    fourth-day cradle rites with split kelp head-bands, prayers addressing Salmon
    or Supernatural-One, bedding, and right-left placement near the mother.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cradle is changed only when a woman has twins; a wood-worker is asked to
    make cradles with notched head-pieces for the twins before they are four days
    old.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four eagle tail feathers are associated with the notched head-boards of the
    twin cradles.
  category: object
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:3
  text: The twins are wrapped in soft yellow cedar-bark and red cedar-bark.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The faces of the twins and of their mother and father are painted red, and
    this painting is repeated every fourth day until the twins are ten months old.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:5
  text: The father of twins must sit still and is not allowed to fetch firewood or
    water; relatives sit nearby to obtain firewood, water, and food for the couple
    and the twins.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The twins are described as belonging to the Salmon and as not allowed to have
    misfortune.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the twins are four days old and the navel-string comes off, the two notched
    cradles are placed to the right and left of a woman who has previously borne twins.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The experienced mother of twins arranges bedding, takes up the first-born
    child belonging to the Salmon, removes cedar-bark wrappings, places split kelp
    around the child's head, and recites a prayer.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The first prayer says that the addressee has come to benefit the parents,
    make them rich, and defend them against sickness; it addresses Salmon as Supernatural-One.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: For the second twin, the experienced mother places split kelp around the head,
    presses her left hand on the child's chest, and recites another prayer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The second prayer asks the addressee to grow up with the brother, not leave,
    make the parents happy, avoid bringing misfortune, do good, bring wealth, and
    is said to have come from the sea with the brother Supernatural-Salmon.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the prayers, bedding of yellow cedar-bark, red cedar-bark, and wool
    is put on; a cedar-bark forehead-presser and pillow are added; the two cradles
    are placed on the right and left sides of the mother's bed.
  category: sequence
  evidence_refs:
  - ev:7
