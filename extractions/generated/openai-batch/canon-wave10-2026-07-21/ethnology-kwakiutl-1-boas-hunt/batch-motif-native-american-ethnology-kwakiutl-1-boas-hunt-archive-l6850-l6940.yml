canonical_text:
  quote: ''
  summary: The passage describes two salmon-head preparations. In a house, guests
    are seated on mats, roasted salmon-heads are boiled in a kettle, ancestral songs
    are sung, the food is served, eaten by hand, and followed by washing, drinking,
    praise of the host, and thanks. A second section describes steaming salmon-heads
    on hot stones in a beach hole with firewood, eel-grass, skunk-cabbage leaves,
    sea-water, mats, and invited friends who eat at the steaming place.
  language: English
  quote_policy: summarized
