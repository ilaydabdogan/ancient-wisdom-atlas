canonical_text:
  quote: ''
  summary: The passage records Kwakwaka'wakw procedures involving mothers, fathers,
    or children who are twins in rites for wind, fog, snow, rain, and good weather.
    It also begins a further procedure for low-river conditions affecting salmon,
    using castorium and a virgin at a river.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents a way to call the wind and to make winds calm, including
    named winds from several directions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a canoe party is far away and there is no wind, a mother or father of
    twins may turn, raise a hand, call Northwest-Wind four times, and then tell the
    paddlers to paddle away from it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In fog, a mother or father of twins uses a hat or blanket to draw or catch
    fog four times; the passage says the fog is put in a hat, stomach, or, according
    to some, the womb of the mother of twins.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: For snow, twin children are called, eagle-down is placed on their heads, and
    the petitioner asks them to call down snow, identifying the down with winter-dance
    down and snowflakes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: For rain, twin children are called, perch-oil kept in kelp bottles is rubbed
    on the hands, and the oil is applied to opposite sides of the twins' faces and
    heads four times.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the rain rite, the petitioner addresses the twins as Supernatural-Ones,
    says they can control the weather, and asks that their world become wet so rivers
    rise and salmon jump at the river mouth.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: For good weather, twins are seated by a cooking-box of water warmed with four
    red-hot stones; a woman washes and wipes their heads and faces with shredded cedar-bark,
    tallow, and red ocher.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the good-weather rite, the man prays to the twins as Supernatural-Ones
    to make good weather and summer, says he pays them with tallow, red ocher, and
    eagle-tails, and places four eagle-feathers on each child.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage reports that twins may cry after the snow and rain rites and look
    downhearted after the good-weather rite.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:6
  - ev:8
- id: obs:10
  text: A note states that twins are considered to be salmon.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: When there is no rain, rivers are low, and salmon cannot ascend, castorium
    of beaver is given to a virgin to dip into the river four times for four days.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The number four recurs in multiple procedures, including calling the wind,
    catching fog, oiling twins, using red-hot stones, placing eagle-feathers, and
    dipping castorium in the river.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:7
  - ev:8
  - ev:10
