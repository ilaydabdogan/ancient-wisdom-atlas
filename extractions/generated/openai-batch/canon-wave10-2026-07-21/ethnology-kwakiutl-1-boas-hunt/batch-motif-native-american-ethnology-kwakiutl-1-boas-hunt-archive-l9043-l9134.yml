canonical_text:
  quote: ''
  summary: The passage gives procedural accounts for serving and eating herring-spawn
    in several forms, including half-soaked spawn, dried spawn with oil, spawn with
    kelp, and spawn with salmon-berry shoots. It also describes cutting and hanging
    mountain-goat brisket and rib pieces over the house fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Half-soaked spawn is served with fresh water in a dish; guests eat it with
    spoons, dried salmon may be eaten before it, and no oil accompanies it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who wants herring-spawn enters the house of a man who owns good dried
    spawn and sits down; the wife of the owner is told that spawn is wanted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman spreads a food-mat, pours and scatters herring-spawn on it, sets
    out oil, and the men dip the spawn in oil before eating; afterward they drink
    fresh water and leave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: For herring-spawn with kelp, the wife puts fresh water into a steaming-box,
    unties a bundle of kelp with spawn, and soaks it in the house overnight.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before the guests arrive, the wife clears the house, spreads mats, and sets
    kettles, dishes, oil, a spoon-basket, and buckets near the door.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The husband starts a fire in the middle of the house; young men are sent to
    call the guests, scorch dried salmon, and draw fresh water for the guests.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Young men break the kelp into mouth-sized pieces, put it into kettles, cover
    it with fresh water, place the kettles on the fire, and stir until it has boiled
    for a long time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The cooked kelp is ladled into dishes, oil is poured over it until the liquid
    is covered, spoons are distributed, guests eat, drink fresh water, and the dishes
    are taken to the guests' wives.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kelp with herring-spawn is said not to be eaten dry, but only soaked and boiled
    for a long time.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Herring-spawn is also eaten dry with salmon-berry shoots and is dipped into
    oil with salmon-berry shoots.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Mountain-goat brisket is cut off from the soft place near the lower ribs and
    breast-bone and hung over the house fire; if very fat, side-ribs are cut from
    the backbone to the flanks and also hung over the fire.
  category: sequence
  evidence_refs:
  - ev:8
