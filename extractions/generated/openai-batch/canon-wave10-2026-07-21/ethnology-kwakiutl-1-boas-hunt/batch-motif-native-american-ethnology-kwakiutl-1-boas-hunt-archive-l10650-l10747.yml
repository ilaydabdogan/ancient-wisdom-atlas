canonical_text:
  quote: ''
  summary: The passage describes procedures for gathering sea-eggs by canoe, distributing
    and eating raw sea-eggs at the beach, preparing discarded milky sea-eggs by roasting
    them in shells near the fire, and preparing boiled sea-eggs in a house for invited
    numaym guests. It also notes an avoidance of drinking water soon after eating
    boiled sea-eggs because of feared heartburn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person paddles a sea-egg spearing-canoe to a place with many sea-eggs, spears
    them, places them in the canoe, and returns home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After arrival at the beach, the gatherer calls the tribe to break and eat
    the sea-eggs.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men, women, and children go down to the beach, and men distribute two sea-eggs
    each to their wives and take two each for themselves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: People break the mouth-side of each sea-egg with a stone, remove the edible
    insides, wash them in sea-water, squeeze out the sea-water, and eat them raw.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage distinguishes good female sea-eggs from bad male or milky sea-eggs;
    the milky sea-eggs are not eaten raw.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A woman gathers the discarded milky sea-eggs, washes empty sea-egg shells,
    removes and washes the edible insides, squeezes out water, and puts the insides
    back into empty shells.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Filled sea-egg shells are carried into the house, placed by the fire, roasted
    near the side-logs until burnt black, and then served to invited numaym guests.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: For boiled sea-eggs, a man and his wife break shells in the canoe, wash the
    edible insides, and place them in a large dish.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Cleaned sea-eggs are boiled in fresh water over the house fire for a long
    time, until evening.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The man invites his numaym to eat boiled sea-eggs, drains off liquid, serves
    portions in dishes, and gives guests cedar sticks for eating.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: People avoid drinking water soon after eating boiled sea-eggs because they
    fear heartburn.
  category: attribute
  evidence_refs:
  - ev:10
