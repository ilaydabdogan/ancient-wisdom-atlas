literal_observations:
- id: obs:1
  text: A woman uses kettles, fire, a long-handled ladle, and dishes while finishing
    boiled codfish and separating or handling liquid and scales from the cooking process.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cooking liquid is repeatedly dipped up and poured back into the boiling
