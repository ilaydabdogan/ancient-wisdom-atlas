  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: For tainted codfish, the woman soaks and warms the body, removes scales, spreads
    an old mat by the fire, scrapes the scales with cedar sticks, beats the fish with
    a wedge until soft, cuts it crosswise, boils it, stirs it, removes bones, and
    throws the bones into the fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: In the tainted codfish preparation, the head is not removed from the kettle,
    and the liquid is ladled until it becomes milky.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Tainted codfish is described as household food for a married couple and their
    children rather than food used to invite many people.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: After the household eats the tainted codfish with spoons, the man takes the
    head, eats the eyes first, breaks the head, and eats the fat of the skull.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Water is drunk before eating and is also used for cooling after eating in
    the tainted codfish meal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: At the beginning of the codfish-head procedure, tainted heads kept for a long
