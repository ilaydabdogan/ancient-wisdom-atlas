  quote: ''
  summary: The passage gives procedural descriptions for drying, sorting, selling,
    and storing herring-spawn; anchoring kelp in a herring spawning-place, drying
    and bundling it, and storing it for winter; stripping and covering elderberries;
    collecting driftwood; preparing a measured pit with wood and stones; gathering
    fern and skunk-cabbage leaves; and preparing fire, tongs, ladle, and dishes for
    further elderberry processing.
  language: English
