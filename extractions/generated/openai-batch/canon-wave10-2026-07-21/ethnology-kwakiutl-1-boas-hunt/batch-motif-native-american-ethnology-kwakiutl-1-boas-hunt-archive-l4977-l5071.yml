  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The elderberries are covered overnight with a mat so that soot from the roof
    cannot drop on them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The woman uses a paddle and small canoe to collect driftwood, and her husband
    carries the driftwood into the house at her request.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The wife digs a measured hole in the middle of the house floor with a clam-digging
