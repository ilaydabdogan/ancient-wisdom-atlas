  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hair of the kelp is pulled from its stem, hung on wind-exposed poles,
    and repeatedly turned by the woman until dry.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dry kelp stems are counted in lots of ten, stacked, tied in the middle with
