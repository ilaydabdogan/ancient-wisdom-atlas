canonical_text:
  quote: ''
  summary: The passage gives procedural accounts of eating currants, preparing mashed
    salal-berries with currants for chiefs and their wives, serving the food with
    oil in paired portions, avoiding water after eating it, and beginning a huckleberry-cleaning
    procedure using a board, mat, basket coverings, and water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After raw currants and oil are consumed, the eaters leave; the passage notes
    that currants are not given at a feast to many tribes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman picks ripe salal-berries and ripe currants, keeping them in separate
    baskets, covers the baskets with hemlock branches, ties them down, carries them
    home, and places them by her seat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman strips salal-berries and currants into a large dish and throws hemlock
    coverings and stripped stems into the fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The woman pounds the mixed salal-berries and currants with her husband's stone
    hammer until the berries have burst and are mixed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The woman tells her husband to invite chiefs; the passage states that only
    chiefs eat the food of salal-berries mixed with currants, while the woman, her
    husband, and their children also eat it as owners of the food.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The husband invites chiefs and their wives, and the wife prepares a mat, small
    dishes, oil, and a horn-spoon basket for the guests.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Chiefs and wives sit as husband-wife pairs, and the host's wife counts the
    married couples and prepares one small dish for each couple.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The host's wife wipes small dishes with soft shredded cedar-bark, ladles in
    the berry mixture, and pours oil over it until the top is covered.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The husband distributes spoons and places one dish before each husband-wife
    pair.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The guests try to eat all the food, then leave, and they do not drink water
    afterward because they want to keep the taste of salal-berries in their mouths.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The huckleberry section begins with a woman setting up a board, log, mat,
    supports, a bucket of water, and huckleberry baskets, removing skunk-cabbage coverings,
    and pouring water over the cleaning-board.
  category: action
  evidence_refs:
  - ev:9
