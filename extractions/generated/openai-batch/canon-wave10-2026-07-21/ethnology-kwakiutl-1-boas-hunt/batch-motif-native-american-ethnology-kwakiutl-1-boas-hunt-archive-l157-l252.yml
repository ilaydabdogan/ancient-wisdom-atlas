canonical_text:
  quote: ''
  summary: A procedural description explains how a workman splits cedar into boards
    with graduated wedges, smooths and sizes the boards, prepares a box board with
    measures, straight-edge, knife, and adz, finds the middle of the board, and drills
    through an end piece.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The workman measures eight spans from the chopped place, chops down to the
    heart of the tree, and widens the opening so wedges can be inserted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Seven wedges are driven into the tree end in graduated order, with the longest
    at the far side and the shortest nearest the workman.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The workman strikes the wedges with a stone hammer, splitting the wood and
    prying off the split piece.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: After splitting, he marks a thickness of two fingers, repeats the wedge process,
    and notes that the first board is thick while later boards may be one finger-width
    thick if the cedar is good.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: He carries the boards out while going home, adzes both sides smooth, makes
    them the same thickness, and sets them on edge when they are half a finger-width
    thick.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: He cuts a thin cedar-stick measure one span and a short span long and uses
    it for the width of the box he is making.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: He marks, adzes, splits, and shaves the board with a knife, adz, and straight-edge
    so that its width is greater than the intended box height.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: He uses a three-span cedar-stick measure slanting across the board to find
    and mark the middle, then cuts a one-finger-width cedar-stick and drills through
    the end.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A source note refers to an illustration of the wedge order and states that
    the split in the illustration is vertical rather than horizontal as described
    in the passage.
  category: other
  evidence_refs:
  - ev:8
