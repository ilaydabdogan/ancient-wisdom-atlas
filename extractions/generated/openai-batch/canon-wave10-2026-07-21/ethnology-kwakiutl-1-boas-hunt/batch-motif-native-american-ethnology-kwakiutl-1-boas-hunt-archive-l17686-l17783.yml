canonical_text:
  quote: ''
  summary: The passage describes chiefly kinship titles for a princess, the status
    term modzil for a chief's wife, a public visit to inspect a newly married chieftainess,
    and examples of chiefly endogamous marriage said to preserve privileges within
    a family.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a princess's father dies, her eldest brother may have her as his princess
    and is then described as no longer merely her brother but as her father in this
    title relation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A chief's daughter is still called princess unless she becomes a chieftainess;
    when she becomes chieftainess, the name princess is given to her daughter.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The term modzil is applied to a woman when her husband is a chief, and it
    ceases if she separates from him unless she marries another real chief.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: After Emaxuyalidze has been married four days, men go into the house to see
    the chieftainess of their chief.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The visitors' leader says that they have come to see the back of the chieftainess.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A good chieftainess arises, takes her belt, lifts her blanket to below her
    knees, puts on the belt, spreads mats, and gets food for the visitors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A bad chieftainess is described as sitting down and asking her husband's young
    men to take care of the food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The chief may tell the chieftainess to go away if she does not lead his tribe
    to their places when they enter his house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: LalellLla, head chief of the DzedzEmeleqala numaym of the Nak!wax'da£xu, had
    as wife Ha£meLas, daughter of his younger brother YaxLEn.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: LalellLla also married XwelageLas, princess of Hayalk'En, chief of the SesEnL!e£
    numaym of the Gwa£sEla.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Descendants in the example intermarry with close relatives, including Sewid
    marrying Llaqwag'ilayugwa and Helamas marrying his cousin Ha£yosdesElas.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: An informant explains that relatives descended from LalellLla and many chiefs
    do this because they do not want their privileges to go out of the family.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage names a form of marrying a chief's princess from another tribe
    as taking a wife outside, while the wife is said to take a husband outside.
  category: speech
  evidence_refs:
  - ev:8
