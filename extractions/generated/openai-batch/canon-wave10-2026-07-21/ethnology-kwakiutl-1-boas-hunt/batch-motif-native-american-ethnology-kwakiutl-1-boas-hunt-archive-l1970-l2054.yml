literal_observations:
- id: obs:1
  text: A woman peels cedar-bark while moving backward and holding the loosened bark
    slack until it falls back, then pulls it off.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bark being peeled narrows upward, runs into a point, and breaks off high
    above.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After removal, the woman lays the bark on the ground with the inner side downward
    and the outer bark outside.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: She peels twenty additional pieces and stops when a strip four fingers wide
    is left on the young cedar-tree.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that people of olden times described the remaining strip
    as leaving the young cedar-tree clothed and alive.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman removes outer bark from the broad end toward the narrow end, folds
    the bark to measured lengths, and keeps the outer side outside.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: She ties the folded bark in the middle and adds end ropes and packing-straps
    for carrying.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: She carries the bundle on her back by the packing-straps, carries an adz in
    her hands, and goes home.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: For shredding, she hangs cedar-bark over the fire and prepares a beater, paddle,
    and wedge fixed into the floor.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the cedar-bark has blackened from heat, she takes it down and prepares
    a small split stick holder described as like tongs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: She coils the cedar-bark on a paddle, holds the tied holder in her left hand,
    takes the beater in her right hand, sits on the paddle, and beats the bark while
    pushing it forward.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After beating the full length, she peels and plucks off the beaten material
    and splits it into one-finger-wide strips.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: 'The open-work basket begins with split cedar-withes: four corner pieces,
