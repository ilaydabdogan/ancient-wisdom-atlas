canonical_text:
  quote: ''
  summary: A woman prepares elderberries for preservation by steaming them over red-hot
    stones with fern-fronds and skunk-cabbage leaves, cooling and thickening them,
    preparing cedar measuring sticks and softened skunk-cabbage leaves, and then shaping
    the cooked berries into cakes on a drying-frame with cedar-stick moulds and a
    horse-clam shell.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman removes remaining drift-wood and charcoal from red-hot stones and
    levels the stones in the steaming hole.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: She dampens dead fern-fronds with a little water, places them over the red-hot
    stones, and covers them with multiple layers of skunk-cabbage leaves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: She pours elderberries over the skunk-cabbage leaves, covers them with more
    skunk-cabbage leaves, and waits for the berries to cook.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the evening she removes the leaf covering, ladles the cooked elderberries
    into large dishes, covers the dishes with skunk-cabbage leaves to keep soot out,
    and leaves them overnight to cool and thicken.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the morning she cuts cedar sticks into measured lengths to determine the
    width of rectangular elderberry cakes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: She prepares broad skunk-cabbage leaves by cutting out the middle vein with
    her husband's crooked knife and warming the leaves briefly on the house fire to
    soften them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The elderberries may be left in the house for three days so that they become
    very thick before being made into cakes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: She places heated skunk-cabbage leaves smoothly on the drying-frame, trims
    overhanging leaves, and positions measuring sticks, a dish of cooked elderberries,
    a ladle, and a horse-clam shell.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: She pours cooked elderberries into a cedar-stick mould and presses them with
    the back of a horse-clam shell so that they settle to an even thickness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: She removes and repositions moulding sticks and repeats the filling and pressing
    process for additional elderberry cakes.
  category: sequence
  evidence_refs:
  - ev:7
