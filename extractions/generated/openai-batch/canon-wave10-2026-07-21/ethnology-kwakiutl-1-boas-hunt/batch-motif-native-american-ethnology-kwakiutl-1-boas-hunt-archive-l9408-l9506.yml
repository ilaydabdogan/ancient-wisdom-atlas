  quote: ''
  summary: The passage gives procedural descriptions for steaming, boiling, and roasting
    mountain-goat meat, and for processing mountain-goat skin as food and material,
    including the use of water, fire, red-hot stones, hemlock and cedar materials,
    baskets, boards, tongs, and communal eating arrangements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cut goat meat is spread over hemlock branches and cedar pieces, covered with
    mats, and steamed after water is poured over the prepared place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men are invited to sit around the steamed meat; after eating enough, they
    carry the rest home for their wives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For boiled mountain-goat meat, the goat is skinned and cut into strips, placed
    in a basket, and cooked in a water-filled cooking-box heated with red-hot stones.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cooked mountain-goat meat is lifted out with tongs, placed on boards before
    diners, and eaten after the diners drink water; they drink water again after eating.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Roasted mountain-goat meat is cut from the hind legs, sliced thin, held in
    roasting-tongs with cedar-bark and split cedar supports, placed by the fire, and
    turned after blackening.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The roasted mountain-goat meat is eaten entirely, and water is not drunk with
    this food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mountain-goat skin is described as an important food of the ancestors of the
    DEnax-da£xu during long stays on the upper course of Knight Inlet.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wool is plucked from the mountain-goat skin with part of an eagle collar-bone
    and placed in a basket for the wife to make blankets; long hair is removed with
    a bone hook.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The prepared skin is singed over the fire, thickens from heat, is cut into
    strips with a stone or bone knife, and then a hole near the fire is prepared with
    red-hot stones and hemlock branches.
  category: sequence
  evidence_refs:
  - ev:5
