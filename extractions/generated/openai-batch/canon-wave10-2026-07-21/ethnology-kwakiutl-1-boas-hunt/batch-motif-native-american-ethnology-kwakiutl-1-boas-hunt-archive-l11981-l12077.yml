canonical_text:
  quote: ''
  summary: 'The passage describes former and present ways of preparing Erythronium
    roots: washing roots, boiling them by means of heated stones or in a kettle, mixing
    the boiled roots with oil, serving them to diners or guests, and using the food
    for feasts or invitations involving many tribes. It also notes that some women
    and men eat the roots raw on hot days.'
  language: English
  quote_policy: summarized
