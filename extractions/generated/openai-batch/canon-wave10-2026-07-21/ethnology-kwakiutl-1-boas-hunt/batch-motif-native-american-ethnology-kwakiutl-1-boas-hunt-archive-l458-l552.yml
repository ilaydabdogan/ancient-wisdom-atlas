canonical_text:
  quote: ''
  summary: 'A procedural account describes how a box-maker prepares a cedar box-board:
    marking and digging three steaming trenches, filling them with red-hot stones,
    dulee, eel-grass, and water to produce steam, preparing pegs and cedar-bark rope,
    then using a board-protector and bending-tool to bend three kerfed corners of
    the box-board.'
