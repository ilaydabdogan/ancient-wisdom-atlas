  summary: The passage describes methods for cutting, drying, storing, and roasting
    salmon, and begins an account of how a wife processes halibut after her husband
    has returned from fishing. It emphasizes sun and wind drying, protection from
    dew and rain, warming and storage near the fire, use of cedar materials, named
    fish-knives, and a division of labor between fishing men and processing women.
