  summary: The passage gives procedural instructions for cutting, boiling, and steaming
    porpoise meat and blubber; lists names for parts of the porpoise body; and begins
    a detailed account of seal butchering, including landing hair-seals, cleaning
    and moving the canoe, gathering driftwood, singeing seal hair over a beach fire,
    and preparing a cutting board with blocks and a dish.
