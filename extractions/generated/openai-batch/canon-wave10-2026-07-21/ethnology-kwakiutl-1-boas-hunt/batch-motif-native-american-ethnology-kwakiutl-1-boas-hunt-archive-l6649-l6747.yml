canonical_text:
  quote: ''
  summary: 'Procedural ethnographic description of preparing and serving preserved
    salmon foods: soaked middle parts, split-backs, soaked backbones, and dog-salmon
    fins and tails. The passage describes soaking boxes with water, kettles, fire,
    dishes, oil-dishes, tongs, division of labor between woman and man, invited eaters,
    singing or lack of singing, and differences between boiled and blistered preparations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A soaking-box stands in the corner of the house and is kept filled with water;
    dried middle parts of salmon are placed in it and replaced as soaked pieces are
    removed.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a serving of soaked salmon middle parts, the woman counts two pieces for
    each man, makes twelve pieces, and puts them into the kettle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The husband puts the kettle on the fire, pours water into it, later uses tongs
    to remove the soaked salmon pieces, and breaks them into mouth-sized pieces.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The woman sets out dishes and oil-dishes and pours oil into the oil-dishes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Guests finish singing before the next course, and they wait for the next course.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Split-backs are eaten without being boiled or blistered; the split-down is
    folded, dipped into oil, and put into the mouth without chewing before dipping.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Split-down is not soaked because it remains soft even when old, due to being
    worked thoroughly.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: For boiled soaked backbones, the woman takes backbones from the soaking-box,
    the man breaks them into three pieces, puts them in the kettle, sets the kettle
    on the fire, and pours water into it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Boiled soaked backbones are served in dishes with oil-dishes after the man
    removes them with tongs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Soaked backbone may also be blistered by the house fire when only a few people
    are invited, or when the house owner is given it by his wife.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Blistered soaked backbone is served on a food-mat with an oil-dish and is
    eaten by one man, his wife, and his children; old people may desire it because
    it tastes different from boiled soaked backbone.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that people do not sing when the food is to be soaked backbone,
    and that this kind of cooking is eaten by few people, in the morning.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Pectoral fins, anal fins, and tails of dog-salmon are described as eaten at
    noon and in the evening.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Pectoral fins are soaked in water for four days, then boiled in a kettle until
    the bones are soft or boiled to pieces.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The woman ladles boiled fins and tails into a dish, places it before the eater,
    gives water to drink, and no oil is dipped with this food.
  category: action
  evidence_refs:
  - ev:10
