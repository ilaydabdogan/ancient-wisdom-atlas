canonical_text:
  quote: ''
  summary: A woman who has previously had twins prepares and decorates a special bed
    or house for a new mother of twins and her Salmon children, using posts, an olachen-net,
    red cedar-bark, eagle feathers and down, mats, and other items. She washes and
    hangs the afterbirth, stores the children's wrapping, instructs the parents to
    care properly and equally for the supernatural twin children, and warns that mistreatment
    can cause sickness, death, or return to the Salmon tribe. The parents carry the
    cradled twins to the prepared bed. Thereafter the experienced woman repeatedly
    changes kelp head-bands, oils the twins, and paints the twins and parents; other
    twin-experienced and kin-group participants are then called.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An experienced woman prepares a bed or house for the mother of twins by driving
    points into the floor, hanging an olachen-net, adding red cedar-bark strips, eagle
    feathers, poles, mats, and eagle-down.
  category: action
  evidence_refs:
