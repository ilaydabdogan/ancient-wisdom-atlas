- id: obs:4
  text: The children's wrapping is put into a cedar-bark box placed outside the head
    of the prepared bed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman who has had twins before addresses the mother and her husband while
    the mother is still sitting near the house fire where she gave birth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker tells the parents to take up the cradles containing the supernatural
    ones and to take good care of the children obtained by good luck.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The speaker says the Salmon children are jealous and that unequal treatment
    can kill one twin or cause the less-treated twin to weaken, go away, and return
    to the Salmon tribe from which he came.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the speech, the mother and father rise together and carry the cradles
    with notched head-boards to the prepared bed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the prepared bed, the cradles are set on each side of the mother's lying
    place; the mother lies between the twins and her husband sits nearby.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Every four days, the experienced woman unties the twins' kelp head-bands,
    oils their heads and bodies with perch-oil, replaces the head-bands, and paints
    their faces.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The same face painting is applied to both twins and also to the mother and
    father.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The four-day head-band and oiling procedure continues for four months; ochre
    face painting continues until the twins are ten months old, and often later into
    adulthood.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: When the twins are first placed in the cradles with notched head-boards at
    four days old, a man who has had twins, the father's numaym, and the chief of
    that numaym are called into the house.
  category: action
  evidence_refs:
  - ev:8
