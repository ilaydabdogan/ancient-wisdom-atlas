canonical_text:
  quote: ''
  summary: The passage describes procedures for preparing and serving currant-cakes
    and raw currants. Currant-cakes are soaked, broken up, rubbed into a thick mixture,
    mixed with oil, distributed in dishes, and eaten at the feast-house. Guests are
    told to eat all of the berries because taking them home is said to bring bad luck.
    A second procedure describes stripping raw currants, throwing stems into the fire,
    inviting relatives or a numaym, serving currants in oil, and eating them with
    horn spoons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The wife of the host opens the box of currant-cakes, unties the bundles, and
    gives the cakes to two messengers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The messengers put two cakes in each dish and pour a little more water on
    them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Young men break soaked currant-cakes into small pieces, make balls, squeeze
    and flatten them, and rub them until the mixture becomes thick and pasty.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The wife of the host brings oil-bottles, and the messengers open a kelp oil-bottle
    and squeeze oil onto the rubbed currant-cakes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the oil is thick in cold weather, the messengers warm the kelp bottle by
    pulling it back and forth over the central fire until the oil melts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After oil is poured on the dishes, horn spoons are distributed and one currant-dish
    is set before each group of six men.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The guests are told to eat everything in the dish; the berries are not taken
    home because people of olden times say that doing so brings bad luck.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: For raw currants, the woman and her husband strip currants from the stems,
    and the stems are thrown into the fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The husband calls relatives or his numaym to eat the raw currants.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The woman wipes dishes with shredded cedar-bark, fills medium-sized dishes
