    horn spoons to the eaters.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Raw currants are eaten three men to a dish, with more oil than currants because
    currants without oil are said to cause constipation.
  category: sequence
  evidence_refs:
  - ev:5
