canonical_text:
  quote: ''
  summary: 'The passage describes Kwakwaka''wakw-related infant care customs: washing
    and shaping a child with cedar-bark, spoken wishes for bodily form and attractiveness,
    oiling and applying a kelp head-band, preserving birth and infant materials in
    a cedar-bark box, payments to attendants, later removal and concealment of materials,
    variants among named groups, Koskimo cradle-lacing methods, and different treatment
    of cradle items depending on whether a child dies or grows up healthy.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman identified as the mother of twins dips yellow cedar-bark in urine
    and water, washes the child beginning on the right side, then washes the left
    side, and wipes the body with soft yellow cedar-bark.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The child is laid face down across the caretaker's knees, and the caretaker
    pulls the lower back toward the middle while speaking about the child's future
    waist and appetite.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The pulling motion and the associated words are repeated four times.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The caretaker wets two fingers in her mouth, presses the child's face into
    shape, licks the child's eyes, and says she gives the child her good looks and
    the power of her eyes.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The child's body and head are oiled with silver-perch oil, and a kelp band
    and head-related bedding are placed around or on the child's head.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Used cedar-bark, cedar-bark on which the mother sat after birth, the child's
    first excrement, and wiping materials are placed in a water-tight cedar-bark box.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The mother of twins and the midwife each receive four pairs of blankets as
    payment.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The kelp head-band is periodically removed, the child's head is oiled, and
    the band is replaced; after four moons it is stopped and placed in the cedar-bark
    box.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the child is ten months old, bedding and cedar-bark are placed in the
    cedar-bark box; the child's hair is singed; anklets and arm-rings are put on;
    and the box is hidden under a rock.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage names several groups as sharing the custom and then describes
    differences among other named groups in the length of time a kelp head-band is
    kept on girls and boys.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: Koskimo cradle equipment is described as having the same bedding as Kwag'ul
    cradle equipment, while the lacing uses narrow deerskin strips attached to a back-rest
    with cedar-withes.
  category: object
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:12
  text: If a child dies, the cradle and clothing are taken to the cedar-bark cave;
    if the child grows up healthy, the cradle and back-rest are kept while clothing
    and the cedar-bark forehead-presser are hidden in the cave.
  category: sequence
  evidence_refs:
  - ev:12
