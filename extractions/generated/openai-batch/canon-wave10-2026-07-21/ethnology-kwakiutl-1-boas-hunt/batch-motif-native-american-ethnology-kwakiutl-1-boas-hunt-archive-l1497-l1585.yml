canonical_text:
  quote: ''
  summary: 'A procedural ethnographic passage describes a woman preparing cedar-withes,
    cedar-branches, and spruce-roots for basketry: splitting, tying, drying, burning
    bark over fire, stripping bark with tongs, scraping moisture out with a knife
    and heel, and gathering materials in the woods. A man or husband is mentioned
    as making a digging-stick and as the owner of a straight knife used in scraping.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman strips branches from cedar-withes, splits the withes, separates pieces
    containing sap, ties the remaining parts, and lays them over the fire to dry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Roots are untied and straightened before further processing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An implement for stripping root bark is made from straight-splitting red-pine
    wood, tied with a thin root, and sharpened at one end.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stripping implement is set into the floor close to the fire, with its
    split end upward and its sharp end in the ground.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A long piece of root is coiled, put on the middle of the fire, held with tongs,
    and turned until the bark is burnt black.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The burnt root is pulled through the stripping tongs; the bark peels off and
    sap comes out, and the process continues until the root is white all over.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Prepared roots are split lengthwise into halves, then into quarters, and then
    scraped.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The woman uses her husband's straight knife and the heel of her left foot
    to scrape the split root until the knife no longer gets wet; the root is then
    white, dry, and pliable.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The prepared root is intended for making a well-made basket into which huckleberries
    will be shaken.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: While the man makes a digging-stick for digging clover, his wife goes into
    the woods to gather long, straight-splitting cedar-branches and carries them home
    to a cool corner of the house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The cedar-branches are split through the heart repeatedly; an expert splitter
    may split branches into twenty pieces before putting them away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Spruce-roots are sought in soft ground where young spruce-trees grow, because
    such roots are described as long, thin, and branchless.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Roots showing partly on the ground are pulled out whole and bitten off where
    they divide.
  category: action
  evidence_refs:
  - ev:7
