canonical_text:
  quote: ''
  summary: 'The passage describes preparing a child’s cradle: holes are drilled and
    cedar-withes are sewn in with deer-skin strips; cedar-wood back-holders and a
    cedar-withe back-rest are installed; the back-rest is positioned below the back
    of the child’s head so the child’s neck will grow long rather than short; layers
    of cedar-bark bedding and mountain-goat wool are added.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man drills holes four finger-widths apart toward the foot-end of the cradle
    and uses strips of deer-skin to sew long cedar-withes in place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cedar-withe element is named the “strip for holding in the child.”
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man cuts thin cedar-wood pieces and places four of them in the cradle;
    these are called “back-holders.”
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The midwife splits cedar-withes, ties them to four thin cedar sticks, places
    the assembly on the back-holder, and this assembly is called the “back-rest.”
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The back-rest is placed so it does not reach the back of the child’s head;
    the stated purpose is that the child may have a long neck when grown, while a
    back-rest reaching the occiput would produce a short neck.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The midwife measures shredded cedar-bark to the length of the inside of the
    cradle and lays four layers of un-rubbed cedar-bark as under-bedding.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The midwife adds four layers of well-rubbed cedar-bark over the under-bedding;
    this is called “soft bedding.”
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The midwife spreads well-spun mountain-goat wool over the soft bedding.
  category: action
  evidence_refs:
  - ev:8
