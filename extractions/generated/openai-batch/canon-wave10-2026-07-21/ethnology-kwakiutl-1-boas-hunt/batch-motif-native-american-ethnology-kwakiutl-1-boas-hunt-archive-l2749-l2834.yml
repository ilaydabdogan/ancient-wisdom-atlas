- id: obs:1
  text: The worker ties parts of a perch-trap together and covers it by continuing
    to tie on additional pieces.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The worker goes from the beach to the woods to break off hemlock branches
    and carries them back to the trap-making place.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Small clams are gathered for bait, their shells are broken, and the clams
