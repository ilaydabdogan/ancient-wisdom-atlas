canonical_text:
  quote: ''
  summary: The passage gives procedural instructions for finishing a perch-trap and
    for making a net for flat sea-eggs. It describes tying trap parts, gathering hemlock
    branches and clams, baiting and covering the trap, weighting it underwater, netting
    a basket-like sea-egg net from nettle-bark twine, preparing yellow-cedar root
    as a hoop, steaming and bending the hoop with hot stones, dulce, water, mats,
    fire, and tallow, drilling holes, sewing the net to the hoop, and attaching a
    hemlock handle with spruce-root binding.
  language: English
  quote_policy: summarized
