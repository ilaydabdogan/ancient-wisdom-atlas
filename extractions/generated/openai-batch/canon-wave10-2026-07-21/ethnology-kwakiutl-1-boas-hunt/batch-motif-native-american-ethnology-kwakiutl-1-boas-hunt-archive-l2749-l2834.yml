  evidence_refs:
  - ev:3
- id: obs:6
  text: The sea-egg net is netted to form a mouth three spans around and a basket-like
    body two spans long, with the bottom netted together.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The worker looks in the woods for yellow-cedar root, digs out a moderately
    thick root, measures five spans, cuts it, splits it through the heart, and trims
    it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The yellow-cedar piece is shaved with a crooked knife until its sides and
    edges are shaped and smoothed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Stones are gathered from the beach, carried to the house, placed by the fire,
    and heated on the fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A hole is dug beside the fire for steaming the yellow-cedar stick, and red-hot
    stones, dulce, the cedar stick, water, and mats are used in the steaming process.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After steaming, the yellow-cedar wood is bent around a round billet, tied
    with cedar-bark rope, heated until burnt black, rubbed with tallow while warm,
    cooled, drilled with ten holes, and sewn to the mouth of the net.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A small hemlock tree two fathoms long is stripped and shaped to serve as the
    handle for the sea-egg scraping-net, and split spruce-root is used to tie the
    net to the handle.
  category: action
  evidence_refs:
  - ev:7
