canonical_text:
  quote: ''
  summary: The passage gives procedures for cutting and preserving dog-salmon; describes
    Nimkish night fishing for lean spawned salmon at traditional canoe-tying places
    and conflicts over those places; and details drying, tying with cedar-bark, basket
    storage, and winter use of salmon flesh, middle pieces, tails, and backbones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman removes the gills and head from dog-salmon, cuts along the dorsal
    fin and backbone from neck toward tail, turns the fish, and cuts again from tail
    toward neck.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The outer side of the cut salmon is set aside to be made into preserved salmon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Nimkish are described as going to Prairie above Gwane to catch dog-salmon
    that are not fat when they arrive there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: River people have traditional canoe-tying places for night dog-salmon fishing,
    and these places are said to belong to ancestors.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: When an owner finds someone tied at such a canoe place, fighting may begin,
    and people club one another with punting-poles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At dark a fisher feels about with a hook tied to a long shaft and may fill
    the canoe when many salmon are present.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: At daybreak the wife puts an old mat and belt over her back, takes a carrying-basket,
    and goes to her husband's salmon-canoe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The best dog-salmon, whose skin is not white, are carried first and made into
    preserved salmon; white-skinned salmon are carried and processed afterward.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: White-skinned lean salmon are roasted and dried over the house fire, then
    put away where winter food is kept; the passage says they keep without mould or
    bad taste because they are not fat.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: Middle pieces of salmon are cut, hung on a drying stage, taken down when half
    dried, bound with split cedar-bark, rehung, dried, and put into a basket under
    the stage.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Salmon backbones are paired at the tails, tied with cedar-bark, and hung where
    they receive the full heat of the fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: After drying, tails are broken from the backbones and placed in one basket,
    while backbones are placed in another basket; the passage names these receptacles
    and identifies the contents as winter food.
  category: object
  evidence_refs:
  - ev:5
