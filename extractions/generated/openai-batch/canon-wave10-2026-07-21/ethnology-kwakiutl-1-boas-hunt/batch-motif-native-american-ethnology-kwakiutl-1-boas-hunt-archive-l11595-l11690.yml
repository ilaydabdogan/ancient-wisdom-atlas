canonical_text:
  quote: ''
  summary: The passage gives two procedural descriptions for cooking clover roots.
    In the first, guests sit in the house, eat dried salmon, and clover roots are
    washed, steamed in a basket over red-hot stones, covered with mats, tested, cooled,
    mixed with oil, and served at a great feast. In the second, a woman lines a small
    kettle with cedar sticks, washes clover roots, covers them with wet cedar-bark,
    adds water, cooks the kettle by the house fire, and removes the steamed clover
    with tongs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People go to the rear of the house, sit down, and first eat scorched dried
    salmon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two men of the host's numaym use tongs to dip red-hot stones into water to
    wash off ashes, then put the stones into the steaming-box.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A woman wets a large basket, puts fresh water in a square box, washes sand
    from clover roots, and transfers the roots to the steaming basket.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The two men place the clover on the red-hot stones and press the roots down
    close to the stones.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Old mats are spread and then used to cover the steaming clover after fresh
    water is poured over it; the steam is not allowed to blow out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The woman tests the clover by lifting the covering, taking some roots, and
    pinching them; if they break in two, they are done.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Two men use clam digging-sticks to lift the clover basket out of the steaming-box
    and empty the clover onto mats.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The woman spreads the hot clover to cool it; the roots are put into dishes,
    broken by hand, covered with oil, and mixed until like mush.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Four men eat from one dish of clover, taking it with their hands.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After eating, each eater receives soft cedar-bark to wipe oil from the hands,
    drinks fresh water, and goes out.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that steamed clover is given at a great feast to many tribes,
    and that those who eat it try to eat it all.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: In another cooking method, a woman lines the bottom of a small kettle with
    split cedar-sticks arranged in layers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: For the kettle method, the woman unties the clover basket, removes clover
    roots, washes sand from them, and places them loosely on the cedar-sticks so steam
    can pass through.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The woman covers the roots with wet soft cedar-bark, adds a small amount of
    water, places the kettle on the house fire, then lets it stand while steam passes
    through it.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: When steaming stops, the woman removes the top covering and uses tongs to
    take the boiled clover out into a small dish.
  category: action
  evidence_refs:
  - ev:11
