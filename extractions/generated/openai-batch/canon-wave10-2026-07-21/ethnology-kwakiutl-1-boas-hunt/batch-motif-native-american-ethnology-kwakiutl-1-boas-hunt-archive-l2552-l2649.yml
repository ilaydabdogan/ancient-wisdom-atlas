canonical_text:
  quote: ''
  summary: 'The passage gives procedural descriptions for making and using several
    implements: devil-fish pulling poles, a sea-egg spear, an elderberry hook, an
    eel-grass gathering pole, a flounder spear, and flounder fishing tackle. Materials
    include hemlock, yew, spruce-root, bird-cherry bark, cedar-bark, deer tallow,
    deer bone, sandstone, water, and women''s hair.'
  language: English
  quote_policy: summarized
