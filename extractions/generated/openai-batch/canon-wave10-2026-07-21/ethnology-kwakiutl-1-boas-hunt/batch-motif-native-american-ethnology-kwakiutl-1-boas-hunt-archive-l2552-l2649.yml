  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The elderberry hook is made from two hemlock pieces that are notched together
    and tied with split spruce-root soaked in water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The eel-grass pole is cut from a bent young hemlock tree and shaped with a
    more curved tip and knobs at both ends.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The eel-grass pole is warmed over a fire, rubbed repeatedly with deer tallow,
