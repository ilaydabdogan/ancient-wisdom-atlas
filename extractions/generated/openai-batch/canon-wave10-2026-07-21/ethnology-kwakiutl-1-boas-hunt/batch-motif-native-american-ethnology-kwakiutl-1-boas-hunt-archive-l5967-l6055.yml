canonical_text:
  quote: ''
  summary: A procedural account describes boiling huckleberries with salmon-spawn
    by means of red-hot stones, then sealing the cooked mixture in a high box with
    olachen-fat and skunk-cabbage leaves for storage until the winter-ceremonial season.
    The narrator adds a correction about the placement of leaves and states that the
    same treatment applies to several other berry kinds, before beginning a new section
    on viburnum-berries with oil.
  language: English
  quote_policy: summarized
