  quote: ''
  summary: A technical ethnographic passage describes how a drying-frame is made from
    measured cedar components, soaked cedar-bark strips, and tied middle sticks, with
    work divided between a husband and wife. It then describes how the wife makes
    a rack for holding baskets by splitting and measuring cedar-wood, soaking and
    splitting cedar-bark, and tying cross-sticks at equal distances.
  language: English
