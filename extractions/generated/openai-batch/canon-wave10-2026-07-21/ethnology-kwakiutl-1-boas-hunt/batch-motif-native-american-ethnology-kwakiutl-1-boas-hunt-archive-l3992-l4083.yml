  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: When there are very many viburnum-berries, she spreads a blanket in the bow
    of the canoe and pours berries from the baskets onto it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the viburnum-berry baskets are loaded, she unties the anchor-line, goes
    aboard, drifts downstream, and returns home, where her husband carries baskets
    up to a cool place in the house.
  category: sequence
  evidence_refs:
  - ev:6
