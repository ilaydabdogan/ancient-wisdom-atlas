canonical_text:
  quote: ''
  summary: The passage gives procedural accounts of gathering crabapples and viburnum-berries.
    A woman uses nested baskets and a small canoe, gathers fruit from trees into a
    front-basket, transfers it into larger baskets or into the canoe, returns downstream,
    and is met by her husband, who carries baskets into the house and helps with handling
    the harvest.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman carries three baskets on her back, nested one inside another, while
    looking for crabapple trees with many crabapples.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: She wears or carries a front-basket in front of her body, picks crabapples
    in bunches into it, and empties it into larger baskets when it is full.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When baskets are full and fruit is abundant, she transfers crabapples into
    the small canoe and continues picking.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After loading the baskets into the canoe, she pushes off, paddles, and drifts
    down the river stern first toward her house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Her husband meets her at the beach, carries baskets of crabapples into the
    house, spreads a new mat, and pours crabapples onto it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the crabapples are brought in, the woman asks her husband to help clean
    off the stems.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The viburnum-berry picking season is described as toward the end of summer,
    when it is nearly autumn.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: For viburnum-berries, the woman takes the same three baskets, puts them in
    a small canoe, and punts up the river of Knight Inlet with a hemlock punting-pole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the berry place, she backs the stern toward shore, leaves the canoe, and
    ties the anchor-line to a stake.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: She plucks viburnum-berries a bunch at a time into the front-basket and repeatedly
