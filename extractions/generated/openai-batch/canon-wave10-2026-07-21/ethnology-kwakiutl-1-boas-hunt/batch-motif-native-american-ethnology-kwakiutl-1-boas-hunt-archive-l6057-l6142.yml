canonical_text:
  quote: ''
  summary: 'The passage describes a procedure in which a woman prepares viburnum berries
    with an oil-and-water mixture made using heated stones, after which her husband
    seals the berry box with red-pine pegs. It then begins a section on the first
    dog-salmon of the season: a man prepares harpoon gear and spears salmon at the
    river mouth; notes refer to prayers to the salmon; a woman carries salmon to mats
    on the beach and begins cutting them open for preparation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman sets down a box with a tight-fitting cover, places a large dish near
    her seat, and pours oil into the dish until it is half full.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman gathers six stones from the beach, brings them into the house, places
    them by the fire, and heats them until they are a little red.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman uses tongs to dip the hot stones in water to remove ashes, puts
    them into the oil, pours water on the melted oil, and stirs the oil and water
    with a ladle until the mixture looks white.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The woman fills a high box with viburnum berries and slowly pours the oil-and-water
    mixture over them until the berries are covered.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The husband makes red-pine pegs, drills through the cover and edge of the
    box, wets each peg with saliva, drives pegs into the holes, and puts the box in
    a cool corner of the house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: When dog-salmon are seen jumping at the mouth of the river, a man prepares
    harpoon points, a harpoon shaft, and prongs, goes by canoe, and spears salmon
    swimming in the mouth of the slough.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage notes that prayers to the salmon occur around the fishing episode,
    and the woman replies “Yes”; a note says she answers her own prayer.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The woman spreads an old mat on the beach seaward from the high-water mark,
    carries four salmon by their gills from the canoe area, and places them on the
    mat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The woman sharpens fish-knives on a whetstone, spreads a small mat beside
    her, places salmon on it, and cuts the salmon open with thin cuts along the skin.
  category: action
  evidence_refs:
  - ev:9
