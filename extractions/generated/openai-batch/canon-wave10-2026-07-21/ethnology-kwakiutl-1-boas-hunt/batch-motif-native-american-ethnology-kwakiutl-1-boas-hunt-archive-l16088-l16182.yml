canonical_text:
  quote: ''
  summary: A questioner reports Yayaxuyega's statements about souls. She identifies
    herself as a Salmon child and twin, explains a scar as a spear mark from when
    she was a sockeye-salmon, and describes soul homes for twins, salmon, sea-hunters,
    and common people. She says souls sit on the head, leave during sleep, cause dreams
    by traveling, return before waking, and may cause death if they do not return.
    She finally fears she has harmed herself by revealing the ways of the Salmon people.
  language: English
  quote_policy: summarized
