canonical_text:
  quote: ''
  summary: 'The passage gives a procedural account of making clover or cinquefoil
    baskets from cedar sticks and split cedar-bark: measured stiff bottoms standardize
    basket size; the woman splits and weaves cedar-bark over the bottom, ties strips
    through the corners, hangs the work from a pole in the house, weaves with woof
    strands, twists in warp-strands, and may make many baskets for a large cinquefoil
    garden.'
  language: English
  quote_policy: summarized
