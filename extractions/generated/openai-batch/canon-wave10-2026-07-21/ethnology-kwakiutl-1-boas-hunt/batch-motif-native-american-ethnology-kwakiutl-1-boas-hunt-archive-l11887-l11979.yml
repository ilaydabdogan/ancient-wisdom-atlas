canonical_text:
  quote: ''
  summary: A procedural ethnographic passage describes the preparation, serving, and
    eating of long and short cinquefoil-roots at feasts and in a household setting,
    including oil, water, fire-tongs, cedar-wood supports, and a mat cover. It also
    states that long roots are served to chiefs and short roots to common men at feasts,
    and begins a separate recipe for washing Erythronium roots.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two men handle the short cinquefoil-roots by shaking steam out of them, while
    a woman does the same with the long cinquefoil-roots.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The long and short roots are put into dishes, and oil from bottles is measured
    and poured into the dishes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the feast, dishes of long roots are placed before chiefs, with one dish
    for each six, and dishes are also placed before groups of common people.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:8
- id: obs:4
  text: The eaters take roots with the right hand, fold or press the roots into a
    ball with the thumb, and put the ball into the mouth.
  category: action
  evidence_refs:
  - ev:3
  - ev:7
- id: obs:5
  text: After eating enough at the feast, people take remaining roots home to their
    wives and drink water in their houses.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that long and short cinquefoil-roots are given at great
    feasts to many tribes and are counted by chiefs in feast rivalry.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: For another cooking method, a woman prepares a small kettle by placing six
    split cedar-wood sticks in the bottom and six more crosswise over them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The woman washes long roots in water, places them on the cedar frame in the
    kettle, adds a small amount of water, covers the kettle tightly with an old mat,
    and puts it on the fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The woman tests the cooking by striking the mat cover with fire-tongs; when
    it stays down, she removes the kettle from the fire and takes out the roots with
    the tongs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: For the household boiled roots, the diners make a ball of roots, dip it into
    oil, eat until they have had enough, and then drink water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage explicitly says that serving long roots to chiefs and short roots
    to common men at a feast teaches common people their low station.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the Erythronium subsection, a woman pours roots into a large dish, adds
    water, washes off earth by moving the roots with her hands, cleans the basket,
    and pours dirty water outside the house.
  category: action
  evidence_refs:
  - ev:9
