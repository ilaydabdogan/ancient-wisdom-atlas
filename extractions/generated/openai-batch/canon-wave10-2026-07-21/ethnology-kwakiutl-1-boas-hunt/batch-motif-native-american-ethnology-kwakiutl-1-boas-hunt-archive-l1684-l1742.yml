canonical_text:
  quote: ''
  summary: A procedural description explains how a bark-peeler selects a suitable
    young cedar, ties twisted cedar-withes around it to control splitting, uses a
    bark-lifter to remove broad strips of cedar-bark, judges suitable bark by tree
    size and bark color, and separates the outer bark from the inner bark.
  language: English
  quote_policy: summarized
