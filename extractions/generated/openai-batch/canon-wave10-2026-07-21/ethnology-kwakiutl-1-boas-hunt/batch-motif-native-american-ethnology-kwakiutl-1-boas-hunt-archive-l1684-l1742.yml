  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The actor removes cedar-withes from another young cedar-tree and twists them
    from end to end.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The twisted cedar-withes are tied tightly around the butt of the selected
    young cedar-tree about half a fathom above the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The bark-lifter is pushed beneath the twisted withes, and the bark is lifted
