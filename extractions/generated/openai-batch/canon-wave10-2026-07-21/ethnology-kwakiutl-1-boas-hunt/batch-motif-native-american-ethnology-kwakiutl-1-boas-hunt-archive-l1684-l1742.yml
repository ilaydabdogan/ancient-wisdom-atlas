  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The removed bark is turned over so that its inner or sap side faces downward,
    and another strip is pulled off in the same way.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The best young cedar for bark is said to be two spans in diameter at the butt-end,
    with outside bark of a mouldy color; black outside bark is described as tough
    and good for shredding.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Mats and halibut fishing-lines made from young cedar bark are said to last
    a long time, while bark from a large cedar-tree is described as brittle and unused.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: After enough bark is peeled, the bark-peeler measures long strips, folds them
