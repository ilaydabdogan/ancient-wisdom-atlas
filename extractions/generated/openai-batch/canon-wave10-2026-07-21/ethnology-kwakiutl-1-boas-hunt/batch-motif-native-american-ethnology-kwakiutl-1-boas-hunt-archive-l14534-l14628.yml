canonical_text:
  quote: ''
  summary: 'The passage describes childbirth care and associated practices: a husband
    summons an old woman as midwife; the midwife examines and treats the laboring
    woman with oil, fire-treated animal materials, water mixtures, and cedar-bark;
    she assists delivery and afterbirth expulsion; the newborn is washed, treated
    with red ocher, named, and later undergoes a ten-month ceremony involving hair
    singeing, limb straps, ocher painting, gifts, and renaming. A later note describes
    keeping the afterbirth for four days and fastening it with a yew-wood peg and
    black-bear sinew.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The husband moves about during the labor context, entering a house slowly
    and going out quickly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When his wife is about to give birth, the husband asks an old woman to act
    as midwife and caretaker.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old woman positions the woman, feels her abdomen to determine the child's
    position, and rubs the abdomen with perch-oil.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old woman gathers octopus tentacle ends, a deer-tail, a snake-tail, toad-feet,
    four chitons, and clam shells next to the fire.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The old woman burns the deer-tail, places burnt hair in a clam shell, passes
    the deer-tail up and down the woman's back four times, says a formula four times,
    and throws it into the fire; she then does similarly with the other materials.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The woman drinks water mixed with burnt deer-tail remains and water mixed
    with burnt octopus tentacles.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Burnt snake-tail and burnt toad-feet are mixed with perch-oil into a paste
    and rubbed on the woman's stomach; chiton water is given to drink when pains become
    frequent.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: For delivery, the old woman sits with soft shredded cedar-bark between her
    knees, has the woman sit on her knees, holds her around the waist, and blows down
    each side of her neck as birth approaches.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: If the afterbirth does not come quickly, a dish is placed before the woman
    and the old woman induces vomiting; then the afterbirth comes out.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The umbilical cord is tied and cut; the child is washed in a washtub while
    seated on the old woman's left foot, wiped with cedar-bark, given red ocher in
    the mouth, wrapped in an old blanket, and, if a boy born at Tsaxis, called Tsaxis.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: When the child is ten months old, the father invites the tribe's men to watch
    the child's hair being singed off; straps are put around the knees, ankles, arms,
    and wrists.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the ten-month ceremony, red ocher is put on the child's head, the men paint
    themselves with ocher, and the father gives each man a silk handkerchief, saying
    it is given by his child Deyad; the child is no longer called Tsaxis.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The afterbirth is kept in the house for four days; the man makes a sharpened
    yew-wood peg and ties it into the hollow end of the afterbirth with twisted black-bear
    sinew.
  category: sequence
  evidence_refs:
  - ev:10
