literal_observations:
- id: obs:1
  text: Llaqwag'ilayugwa, described as a princess, is taken as wife from outside by
    mEinogwis, and the designation "obtained from far off outside" is applied only
    to the woman in this situation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Llaqwag'ilayugwa wants her husband to give a feast, she tells him to
    go to his father-in-law Gwex'se£sElasEine£ to get something from his house because
    she was taken from far away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gwex'se£sElasEine£ is described as a head chief who cannot avoid giving a
    food marriage gift to his son-in-law; failure to recognize his princess would
    bring ridicule and imply that he does not love her.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage introduces an explanation of how eagles were obtained by the ancestor
    of the Maamtag'ila, connected with Llaqwag'ila and £maxuyalidze.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: "£maxuyalidze is said to have been first to make a potlatch and to have regarded
    the eagle as the head chief and feared leader among birds; on that basis he would
    be the eagle."
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The text compares eagle precedence in eating from carrion or prey before other
    birds to the precedence imitated by £maxuyalidze, who is described as head eagle
    of the Kwakiutl numayms.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The DzEndzEuxq!ayu say Doqwayis first got the eagle, while the Maamtag'ila
    say they had the first eagle and that Llaqwag'ila remains first among the eagles
    of the tribes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: When YaqoLas began to be a prince and had a man's name, £maxuyalidze gave
    a potlatch and transferred the eagle-seat, the eagle-name Llaqwag'ila, and related
    privileges to him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The transferred privileges include a house with carved posts, two speaking-posts
    in the form of men, grizzly bear forms, eagles, large coppers, and a copper painted
    on the house front.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage locates the ancestors of Chief £maxuyalidze at K'lodagala inside
    Gwadze£ and identifies dull-white Seagulls as ancestors of Chief £maxuyalidze,
    with MatmatEla or Matag'ila linked to the Maamtag'ila name.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: YaqoLadze of the numaym Kiikwak him is said to have repeatedly changed wives;
    each father-in-law gave him names, which he used for a short time as feast-names
    when giving potlatches or oil feasts with marriage gifts.
  category: sequence
  evidence_refs:
  - ev:11
