canonical_text:
  quote: ''
  summary: 'The passage gives procedural descriptions of specialized gathering and
    carrying equipment: baskets for viburnum-berries, wild carrots, lily-bulbs, and
    huckleberries; a hooked box for salmon-berries; a cedar-bark tump-line or forehead-strap;
    and a cedar-bark back-protector for digging clover. It emphasizes materials, measurements,
    shapes, weaving, twisting, soaking, tying, and uses.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The viburnum-berry cooking-basket differs from other baskets by having straight
    sides, a flat square-bent bottom, and two handles, and it is sized to fit loosely
    into a box for steaming viburnum-berries.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the viburnum-berry cooking-basket is finished, it is placed in a damp
    place so the loose weaving will not come undone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife makes a cedar-bark basket for wild carrots; it is like the cinquefoil-basket
    but shallower and made of broad strips.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lily-bulb basket is woven flat and low, has no rim holes for lashing,
    and has the tops of its sides bent backward.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The huckleberry-basket has a wide mouth, low sides, and a narrow bottom; after
    it is finished, a smaller basket of similar type is made.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The hooked box for picking salmon-berries is made from good cedar wood, made
    light, shaped like an oil-box, measured by spans and fingers, and grooved with
    fine grooves.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The wife of the box-maker makes a cedar-bark packing-strap by splitting bark
    into narrow strips, twisting ends into rope, weaving the middle like a mat, and
    fastening it around the hooked box with loops, turns, and half-hitches.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The tump-line is made from cedar-bark measured to length, soaked in water,
    split into narrow strips, twisted into rope, and plaited into a forehead-strap
    tied to the huckleberry-basket.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The back-protector is woven from split cedar-bark, worked from the middle
    toward the ends, finished with selvage, trimmed with a knife, and used as a back-protecting
    mat for digging clover.
  category: action
  evidence_refs:
  - ev:8
