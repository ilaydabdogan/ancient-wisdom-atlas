canonical_text:
  quote: ''
  summary: The passage records customs concerning twins associated with Salmon, their
    names, cradles, siblings, and taboos. It then describes how a mother of twins
    keeps dried afterbirth as medicine and uses it with nettle-bark, cedar wood, and
    fire in cauterization. It ends by saying that certain children with bodily marks
    or impairments are also said to belong to the Salmon and are treated according
    to twin-child rules and taboos.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Twin children receive names associated with olachen, Silver-Salmon, and Sockeye-Salmon
    categories.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cradles with notched head-boards used for twins and later for Salmon-Tail
    are taken to a cedar-bark cave; the mother of twins does not keep the cradles.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a woman expects another child, the cradle is not made before the child
    is born, because the child may be dead at birth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A later singleton child of a mother who had given birth to twins is described
    as ordinary and not belonging to the Salmon.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A preceding child is named Salmon-Head; if twins are born when he is ten months
    old, his cradle is put away and two notched cradles are made for the twins.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The mother of twins keeps dried afterbirth, rubbed nettle-bark, and a piece
    of cedar-wood with a burnt-through hole in her workbox as medicine.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sick men or women go to the mother of twins to be cauterized, often on the
    knees, chest, head, back, temples, neck, or collar-bone area.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: For cauterizing, the mother of twins mixes afterbirth and nettle-bark in the
    hole of the cauterizing-stick, ignites it with burning cedar-wood, and presses
    the ashes into the skin.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mother of twins is paid one pair of blankets for each place she has cauterized.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Children with a single eye, a red forehead spot, a bent leg, a face white
    on one side, scars, or a missing finger are said to belong to the Salmon, and
    their parents observe the taboos for twin-children.
  category: relationship
  evidence_refs:
  - ev:7
