- id: obs:3
  text: A square box is placed by the fire in the middle of the house, and another
    man draws freshwater in two large buckets.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A cedar-bark rope is wound around the square box so that it will not burst
    when red-hot stones are put into it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The men wet the ends of the tongs in buckets of water while moving red-hot
    stones into the square box.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The host's wife spreads new mats, opens baskets of roots, loosens short roots
