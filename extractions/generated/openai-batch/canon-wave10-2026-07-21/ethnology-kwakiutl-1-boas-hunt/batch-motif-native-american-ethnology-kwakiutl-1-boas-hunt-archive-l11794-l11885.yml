canonical_text:
  quote: ''
  summary: The passage gives a procedural account of preparing a feast of cinquefoil-roots.
    Two men invite the tribe and prepare a square cooking box with red-hot stones,
    water, cedar-bark rope, fern leaves, and mats. The host's wife arranges short
    and long roots separately. The roots are layered in the box, divided by split
    cedar-bark, steamed under old mats, and checked for doneness before being removed
    onto new mats. Dishes and oil bottles are counted out for groups of guests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two men use long pairs of tongs as walking-sticks, go through the village,
    enter houses, and invite the tribe to eat cinquefoil-roots.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After returning to the cooking house, the two men spread mats for guests,
    and the guests come in.
  category: sequence
  evidence_refs:
