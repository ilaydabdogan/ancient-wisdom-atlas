  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Dry fern leaves are placed on the red-hot stones, a frame is set on the leaves,
    short roots are put in, and long roots are placed above them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Four pieces of split cedar-bark are placed between the short and long roots
    as a mark separating the layers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Two men pour water over the long roots and cover the box with many old mats
    so that steam cannot come through.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Dishes are counted with one dish for each group of six guests, and one kelp
    bottle of oil is set out for every two dishes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A man strikes the mat covering with fire-tongs to test whether the roots are
    done; if the cover sinks, they are done, and if it springs back, they are not
    done.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: When the roots are done, the mat covering is removed, the long roots are lifted
    out by the cedar-bark strips, and the short roots are removed with tongs onto
    another mat.
  category: sequence
  evidence_refs:
  - ev:8
