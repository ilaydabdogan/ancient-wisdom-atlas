  quote: ''
  summary: The passage gives a technical sequence for finishing a cedar box for lily
    bulbs and beginning the making of oil-boxes. It describes marking, cutting, drilling,
    pegging, splitting, adzing, grooving, tying with cedar-bark rope, selecting a
    fallen cedar tree, chopping notches, measuring boards, and splitting and smoothing
    cedar boards with wedges, hammer, adz, and other tools.
