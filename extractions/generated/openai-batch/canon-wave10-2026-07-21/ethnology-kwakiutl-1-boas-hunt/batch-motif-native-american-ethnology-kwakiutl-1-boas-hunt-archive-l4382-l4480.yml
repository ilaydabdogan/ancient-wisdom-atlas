canonical_text:
  quote: ''
  summary: 'The passage describes practical procedures for preserving salmon and dog-salmon
    heads: sliced salmon, fins, tails, cheeks, and heads are cut, hung, placed on
    racks or red-pine roasting-tongs, roasted or dried by fire, shared in part with
    villagers, and stored in baskets for winter use.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sliced salmon is hung up to dry, and anal fins, pectoral fins, and tails are
    separately dried on racks or in baskets near the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dried salmon parts are put away as food for the winter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When many dog-salmon are caught at the river Gwane, the woman cuts off the
    heads.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Red-pine wood that splits readily is made into many short roasting-tongs,
    sometimes one hundred or two hundred.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Salmon heads are placed on open roasting-tongs so that the tong points reach
    toward the eyes; the tongs are not tied with cedar-bark.
  category: action
  evidence_refs:
  - ev:3
  - ev:7
- id: obs:6
  text: The husband makes a fire on the beach, and the salmon heads on tongs are placed
    around it and turned as the throat and nape blacken.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: For plucked cheeks, the woman removes the roasted heads from the tongs, breaks
    open the jaws, spreads them flat, and removes the edible interior so that skin
    and bones remain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The plucked cheeks are arranged close together on a long drying-rack and placed
    over the hot house fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The husband is asked to call men, women, children, and weak old women from
    the village to eat the edible parts taken from the salmon heads.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The invited people sit around the heap of roasted edible insides, eat, and
    carry away what they cannot eat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the plucked cheeks are dry enough, they are put into a large basket
    and stored for winter.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A second procedure for roasted dog-salmon heads uses similar short roasting-tongs,
    roasts the jaws first, turns the nape toward the fire, and then brings the heads
    into the house.
  category: sequence
  evidence_refs:
  - ev:7
