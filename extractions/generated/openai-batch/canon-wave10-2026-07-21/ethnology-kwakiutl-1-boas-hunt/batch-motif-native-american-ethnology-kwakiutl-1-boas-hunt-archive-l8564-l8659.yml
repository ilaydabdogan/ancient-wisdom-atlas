canonical_text:
  quote: ''
  summary: The passage gives procedural recipes for kelp-fish. In one preparation,
    a wife receives kelp-fish from a fishing canoe, carries them home, cleans them,
    washes the intestines, stomachs, and gills in salt water, boils the cooked gills
    in a kettle by the fire, and hosts people who eat the soup with spoons and are
    given water before and after eating. The text notes that this is not a large feast
    because the fish are not caught in sufficient quantity. A second recipe describes
    roasting a single kelp-fish near the fire, turning it when steam emerges, scraping
    it, and eating it without grease because it is fatty.
  language: English
  quote_policy: summarized
