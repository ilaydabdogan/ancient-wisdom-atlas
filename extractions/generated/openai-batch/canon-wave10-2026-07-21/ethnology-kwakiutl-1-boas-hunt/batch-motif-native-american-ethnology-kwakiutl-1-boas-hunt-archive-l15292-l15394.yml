canonical_text:
  quote: ''
  summary: The passage describes a ceremony for newborn twins associated with Salmon.
    A prior father and mother of twins are called to act ritually, adornment with
    ochre, red cedar-bark, eagle feathers, and eagle-down is performed, the twins
    are carried in notched cradles in a procession around houses, and a copper marriage
    gift, potlatch preparation, and special twin-naming rights are mentioned.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A facial marking is described as vertical lines on each side of the face,
    running from the eyebrows toward the mouth level.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A speech identifies the children as belonging to Salmon, as supernatural ones,
    and as coming from the sea and the house of Swimmer, the Salmon.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man and a woman who have previously had twins are called, and for a short
    time they act as though they were husband and wife.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The man who previously had twins asks for ochre and eight eagle tail-feathers,
    and he calls Salmon-Head to sit beside him and the woman acting as his wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The elder child born before twins is named Salmon-Head if male and Salmon-Head-Woman
    if female.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ritual participants are painted with ochre, fitted with red cedar-bark
    head-rings and eagle feathers, and dusted with eagle-down.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The newborn twins are carried in cradles with notched head-boards by the man
    and woman who had twins before.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A procession leaves the twins' house, led by Salmon-Head and followed by the
    parents, cradle-bearers, and others.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The procession turns right from the house, proceeds through passages, goes
    around four houses toward the left, comes along the rear of the houses, and returns
    inside.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The father-in-law of the father of the young twins gives a copper plate as
    a marriage gift to his son-in-law to give away to his tribe.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage states that names are not given at this point because the right
    to name twins belongs to a grown male twin, and often to a grown twin-woman.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The invited tribe comes to see the two twin-children and mentions the copper
    until potlatch property is ready.
  category: sequence
  evidence_refs:
  - ev:11
