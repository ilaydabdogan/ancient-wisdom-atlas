canonical_text:
  quote: ''
  summary: The passage gives procedural instructions for baking fern-roots in an earth-covered
    baking place, including the use of mats, seaweed, hemlock, hot stones, water,
    fire, and soil. A specially qualified woman stamps the covering soil, and household
    members are asked to abstain from sexual intercourse overnight. The cooked roots
    are later served to invited guests, including chiefs, with oil or dried salmon
    spawn. Chiefs avoid eating the inner part of the fern-root because it is said
    to affect their willingness to give away blankets. Guests receive additional roots
    to take home to their wives. A following recipe begins by charring fern-roots
    over a fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The preparer covers the baking contents with an old mat, pierces the middle
    with a yew-wood digging-stick, scrapes soil with a clam-shell, and throws soil
    on top of the mat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman with one living husband, no widowhood, and a menstrual period ended
    at least eight days earlier is called to stamp down the soil until it is hard.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The owner uses tongs to place four red-hot stones from the house fire into
    each bucket, making the water hot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The root-digger is removed, two buckets of hot water are poured into the hole,
    the hole is covered with soil, and firebrands with wet firewood are placed on
    top for the night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After finishing the evening preparation, the woman asks the other people in
    the house to abstain from sexual intercourse during the night.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the morning, the woman waits for the fire and soil to be safe, lifts away
    the mat and covering materials, removes the fern-roots into a basket, fills the
    hole with earth, and throws the used seaweed, hemlock branches, and wet leaves
    outside.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Four days after the cooked fern-roots have been in the house, people are invited
    to eat them, and chiefs of the tribes often participate because the food is described
    as valuable.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: For the meal, the woman spreads a food-mat, pours oil into dishes, sets out
    dried silversalmon spawn, places oil dishes before guests, and gives two fern-roots
    to each man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Guests peel off the black bark from a fern-root and eat it either dipped in
    oil or mixed with dried spawn.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The inner part of the fern-root is often held by the chief and given to someone
    else; head chiefs do not eat it because it is said to make a chief waver about
    giving away blankets.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the guests have eaten two fern-roots each and drunk water, the woman
    gives each man two fern-roots to take home to his wife.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A following fern-root recipe begins with a bundle set beside the fire, a large
    fire built, roots untied and straightened, and the outer sides of the roots charred
    over the fire.
  category: sequence
  evidence_refs:
  - ev:8
