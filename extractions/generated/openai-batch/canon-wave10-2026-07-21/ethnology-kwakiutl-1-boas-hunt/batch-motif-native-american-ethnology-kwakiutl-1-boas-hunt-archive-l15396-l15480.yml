canonical_text:
  quote: ''
  summary: 'The passage describes customs concerning twin children: copper purchase
    and naming, parents wearing abalone-shell blankets and carrying coppers, abstention
    from work, purification in water and painting with ochre. It also describes a
    case in which a mother without supporting relatives asks a midwife to strangle
    newborn twins so they may go back home, followed by handling of the afterbirth,
    preparation of burial boxes, and placement of the boxes in a burial tree by tree-climbers
    and Salmon people.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The father-in-law of the father of the young twins buys his own copper so
    that the twin children may have a name connected with the copper sold when they
    were born.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father of the twins and his wife are dressed in blankets set with abalone
    shells, carry coppers, and go around four houses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the parents do no work for four years and that the
    chief's daughter or beloved one must not do any work.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Relatives are said to urge the parents of twins to follow the rules; the passage
    reports a belief that all relatives will die if the customs are not followed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the twins are four days old, the twins and the married couple purify
    themselves every fourth day in water and paint themselves with ochre until the
    twins are ten months old.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the case of a mother without relatives, she may ask the midwife to choke
    the twin children so that they may go back home to where they came from.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The midwife is described as not allowed to disobey the mother and as strangling
    the twins that belong to the Salmon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The father of the twins is asked to tell his relatives that his wife has given
    birth to two dead twins.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The midwife washes the afterbirth and hangs it up to dry.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Two men who climb the burial tree are asked to bury the twins and quickly
    make two burial boxes of exactly the same size.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A board is taken from the right-hand wall of the house to take the twins out;
    the boxes are made outside because the passage reports a belief that putting bodies
    into boxes inside the parents' house brings short life to those who make the box.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The dead children's faces are painted with ochre, they are wrapped, placed
    in boxes, and cedar-bark ropes are put around the burial boxes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Eight Salmon people stand beside the burial boxes, with four people carrying
    each box.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The two tree-climbers go ahead with short boards, find a tree with good branches,
    place the boards in the tree, and the burial boxes are later hoisted up and set
    on the boards.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
