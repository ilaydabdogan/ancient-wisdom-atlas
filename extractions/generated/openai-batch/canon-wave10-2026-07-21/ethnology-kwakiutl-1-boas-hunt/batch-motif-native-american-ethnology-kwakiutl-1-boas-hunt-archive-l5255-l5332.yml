- id: obs:2
  text: Layers of salal-berries and red-hot stones are added repeatedly, and a mat
    is spread over the box when the contents boil up.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Elderberry-cakes are placed on edge by the fire until they become brittle.
  category: action
  evidence_refs:
