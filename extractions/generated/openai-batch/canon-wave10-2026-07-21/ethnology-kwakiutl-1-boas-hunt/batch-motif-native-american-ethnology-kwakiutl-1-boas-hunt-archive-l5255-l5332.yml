- id: obs:4
  text: A flat sandstone and the husband's stone hammer are used to break elderberry-cakes,
    and the pieces are rubbed into a flour-like powder; the passage says generally
    ten elderberry-cakes are broken for salal-berry cakes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the salal-berries stop boiling, the stones are removed from the bottom,
