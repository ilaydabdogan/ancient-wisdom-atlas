canonical_text:
  quote: ''
  summary: The passage gives a procedural account of making salal-berry cakes mixed
    with elderberries. Red-hot stones are dipped in water and layered into salal-berries
    to boil them; elderberry cakes are made brittle near a fire, pounded on sandstone
    with a stone hammer into powder, and mixed into the boiled berries. The mixture
    is formed into cakes, dried, tied in shredded cedar-bark bundles, and boxed. The
    passage distinguishes cheaper mixed cakes made for sale or feasts from more carefully
    made cakes prepared by women for household and relatives' food.
  language: English
  quote_policy: summarized
