canonical_text:
  quote: ''
  summary: The passage gives procedural descriptions for eating or serving steamed
    viburnum-berries, brittle crabapples, crabapples with oil, mashed steamed crabapples,
    salal-berries mixed with crabapples, and bunch-berries. It describes gathering,
    pounding, soaking, mixing with oil, distributing mats and spoons, inviting family
    or guests, rules about rinsing or drinking water, and the distinction between
    household foods and a bunch-berry tribal feast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Steamed viburnum-berries are served in medium-sized dishes, one dish for each
    three men; guests eat with spoons, drink a little water to rinse their mouths,
    and then leave.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For brittle crabapples, the woman gathers large still-green crabapples in
    a small basket, brings them home, spreads a food-mat, and the husband and children
    eat the crabapples from the stems.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that brittle crabapples are not given at a feast to many
    tribes, and that only the married couple and their children eat them.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: For mashed steamed crabapples, the woman takes crabapples and water from a
    box, pounds the crabapples with her husband's stone hammer, mashes them with both
    hands, adds much oil, distributes spoons to the family, and the family eats until
    the dish is finished.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After eating mashed steamed crabapples, the family does not drink water.
  category: attribute
  evidence_refs:
