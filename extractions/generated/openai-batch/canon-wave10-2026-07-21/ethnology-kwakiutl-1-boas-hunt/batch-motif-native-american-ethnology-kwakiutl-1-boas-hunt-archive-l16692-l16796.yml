canonical_text:
  quote: ''
  summary: A woman named Q Iwalanenega sings a sacred song to Helemil, asking for
    revival, healing, mercy, and power to become a healer. After thanking Helemil
    for bringing her to life and promising obedience, she disappears. Her brother
    Qliide is troubled until her sacred song is heard again in the woods and near
    the settlement. The community, guided by the great shaman Fool, attempts to summon
    her with board-beating in the dance-house. She returns with a sacred song and
    cannibal cry, is identified as hamdzEdzEwe£/oneqwa, turns into a shaman, bites
    four men, and receives a new song addressed to Helemil of Cannibal-at-North-End-of-World.
  language: English with transcribed Indigenous names and ritual terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Q Iwalanenega sings a sacred song addressed to Helemil, asking to be revived,
    made well, made right, and helped by Helemil's life-bringer, healing means, and
    magic power.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Q Iwalanenega thanks Helemil for mercy, says Helemil brought her to life,
    calls him Long-Life-Giver and supernatural one, and says she will do as he tells
    her that night.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At night Q Iwalanenega is heard singing behind Teguxste, and the narration
    states that she has disappeared.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Qliide is troubled about his sister because no one knows where she has gone;
    sixteen days after she left the dance-house, her sacred song is heard in the woods
    and near the settlement, and Qliide concludes she is alive.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Qliide wants three people who stayed in the woods and Q Iwalanenega to be
    captured; men and women of the Nak!wax'da£xu go to catch the three in the woods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the three return to the dance-house, songs of the war-dancer, tamer-dancer,
    and fire-dancer are sung, and the three enter their sacred room.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The great shaman Fool instructs participants to beat quickly on boards, keep
    silence, and repeat this four times while thinking of Q Iwalanenega and hoping
    she may enter the winter dance-house.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After two nights of unsuccessful attempts, Q Iwalanenega's sacred song is
    heard from the rear of the dance-house, followed by a cannibal cry and no whistles.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narration identifies Q Iwalanenega as hamdzEdzEwe£, called oneqwa by the
    Kwakiutl, and says she is partly a great shaman and partly hamshamts!es, made
    so by Helemil's wish.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage adds that people who disappear to become shamans use different
    dances when they show themselves, according to the order of spirits.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: Q Iwalanenega utters the cannibal cry at the door, enters the dance-house,
    turns into a shaman, sings her sacred song, utters the cannibal cry again, and
    bites four men.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The song-leaders say they will sing a new song for Q Iwalanenega; the song
    asks who is getting food for the Giver-of-Supernatural-Power and names Helemil
    of Cannibal-at-North-End-of-World.
  category: speech
  evidence_refs:
  - ev:9
