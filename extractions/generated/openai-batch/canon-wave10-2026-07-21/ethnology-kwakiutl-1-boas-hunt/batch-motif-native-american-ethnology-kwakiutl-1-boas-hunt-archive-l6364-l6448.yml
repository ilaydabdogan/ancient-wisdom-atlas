canonical_text:
  quote: ''
  summary: 'The passage gives recipes and serving procedures for several salmon foods:
    roasted old salmon, boiled speared salmon, old dried salmon, and fresh dried salmon.
    It describes cooking with water and fire, serving with oil, giving water for mouth-rinsing
    and drinking, washing oily hands, and a Koskimo variant in which soaked-salmon
    liquid is drunk because oil is lacking.'
