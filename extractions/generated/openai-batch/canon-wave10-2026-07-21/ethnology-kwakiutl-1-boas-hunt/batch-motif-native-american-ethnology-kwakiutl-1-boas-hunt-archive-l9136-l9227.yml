canonical_text:
  quote: ''
  summary: The passage gives procedural details for preparing mountain-goat kidney-fat
    into hard white tallow used for greasing the face, including washing, chewing,
    heating with hot stones, skimming into a kelp bottle, cooling, wrapping, and storing.
    It also notes gendered and specialized knowledge of handling the fat, states that
    kidney-fat is not eaten, and begins a section on edible mountain-goat stomach-fat,
    including storage, chiefly feasts, and a marriage-present to a father-in-law.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Suet is spread near the fire, kidney-fat is cut out, washed in water, placed
    on a mat, chewed in pieces, and put into a dish.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fresh stones from the beach are heated on the house fire, rinsed in water
    to remove ashes, and placed into the chewed kidney-fat until the water boils and
    the fat melts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A piece of kelp is cut and used as a bottle-like container for skimmed fat,
    which is set in a house corner to stiffen.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Remaining melted fat is poured into a small dish, cooled into an even tallow
    cake, loosened by warming, wrapped in soft white cedar-bark, and stored in boxes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Men and women rub the tallow on their faces in summer and winter; the face
