canonical_text:
  quote: ''
  summary: 'A Kwakiutl feast procedure is described: members of a numaym prepare salal-berries,
    crabapples, oil, dishes, seating, songs, and distributions. The host''s daughter
    dances with a copper while young men handle oil-ladles. Chiefs are served oil,
    and a rival chief is provoked with an overflowing ladle. The rival sends for blankets
    to put out the host''s fire, while the host feeds and addresses the fire and counters
    by adding food, copper, and oil to it. A brief anecdote names Nolis as someone
    who tried to put out a fire with canoes and had oil poured on his face.'
  language: English
  quote_policy: summarized
