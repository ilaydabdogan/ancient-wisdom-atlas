canonical_text:
  quote: ''
  summary: The passage describes procedures for the first seasonal silver-salmon meal,
    including invitation of chiefs, boiling salmon, distribution with new spoons and
    dishes, prayer by the highest-ranked man, water drinking, and related rules for
    dog-salmon. It then describes winter and spring preparation of sun-dried salmon
    using tongs, fire, water, oil, mats, and soaking when hard.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first silver-salmon of the season is caught by trolling, cut in a ceremonial
    manner with head and tail left attached to the backbone, and its meat is boiled.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the evening, a man invites chiefs to eat fresh silver-salmon with spoons
    and places a kettle of water on the fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wife slices four fresh split silver-salmon crosswise, puts them in boiling
    water, and later stirs them to break the meat into pieces.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: For twelve men, three dishes, twelve new spoons, and a dipping-ladle are prepared;
    the meat is placed in dishes, and each dish is set before four men.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The guests drink water before eating; the highest-ranked man says the same
    prayer used when roasted eyes were first eaten, and then the men eat with spoons.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: While the guests eat, the host draws fresh water; after they finish, they
    drink again, and the host returns the dishes and spoons to the place where his
    wife sits.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The same procedure is stated to be used for dog-salmon when it is first caught
    and when dog-salmon is dried for winter.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Fat salmon is avoided in the morning because those who eat it are said to
    become sleepy or not strong; dry upriver dog-salmon receives much oil and may
    be eaten morning, noon, and evening.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: In winter, a woman prepares sun-dried salmon by blistering the skin and flesh
    sides by the fire, wetting the flesh side with water from her mouth, folding it
    skin-side out, placing it under a mat, stepping on it, rubbing it, and striking
    it so scorched scales fall off.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The woman breaks scorched sun-dried salmon into small dishes, uses oil-dishes,
    rinses and drinks water, chews the salmon, dips it into oil, eats it, and drinks
    water after finishing.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: When sun-dried salmon is very hard near spring, it may be soaked; sometimes
    the woman and her husband take it from the soaking-box, and wet salmon is blistered
    by the fire without blistering off the scales.
  category: sequence
  evidence_refs:
  - ev:11
