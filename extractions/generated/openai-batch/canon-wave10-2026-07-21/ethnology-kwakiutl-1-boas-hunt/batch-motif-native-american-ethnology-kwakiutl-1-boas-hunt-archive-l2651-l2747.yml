canonical_text:
  quote: ''
  summary: 'The passage gives procedural instructions for making fishing gear: cedar-bark
    is soaked, split, twisted, stretched, dried, coiled, and combined with bone, hair-thread,
    and sinew; then a perch-trap is built from hemlock pieces, roots, cedar-bark lashings,
    posts, side-stops, back-stops, and entrance pieces placed on a sandy beach at
    half tide.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man gives cedar-bark to his wife, and she soaks it in water overnight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman removes the cedar-bark from the water, splits it into long narrow
    strips, and twists it until it reaches moderate thickness and a length of forty
    fathoms.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man stretches the twisted cedar-bark outside the house for four days,
    then coils it and puts it inside the house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man shreds dried deer back-sinew, twists it like thread, and ties twisted
    hair to round bones or crosspieces.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The gathered hair-thread ends are tied with twisted sinew and hung in a corner
    of the house with round cross-bones hanging downward.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: For the perch-trap, the man soaks cedar-bark in the river and cuts straight
    young hemlock trees into measured pieces.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some trap pieces are sharpened to serve as posts, and sixteen shorter sharpened
    pieces are identified as the entrance.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The trap materials are tied together with roots and carried home before being
    taken to the beach at half tide with a stone hammer and soaked cedar-bark.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The trap is set where the beach is sandy and not very steep, and one four-span
    piece is used as a measuring guide for marking the layout.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Twelve posts are driven into marked positions with a stone hammer, forming
    the posts of the perch-trap.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Soaked cedar-bark is split into long strips and used to tie stops, side-stops,
    back-stops, entrance pieces, and rows to the posts.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: The described perch-trap construction reaches completion when eight rows have
    been tied.
  category: sequence
  evidence_refs:
  - ev:10
