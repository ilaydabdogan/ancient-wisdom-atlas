canonical_text:
  quote: ''
  summary: 'The passage first gives a dancer''s song and speech about near-death,
    a sacred room, an opened stomach, supernatural power bestowed by Helemil, revival,
    renaming, ten-year restrictions, unpaid curing, and later shamanic status. It
    then begins a tale titled as an initiation of one of the TslotslEna of the Awa£ilela:
    Qleged, a common grizzly-bear hunter, quarrels with his wife, leaves with his
    gun, disappears, is later represented by one recovered leg and broken gun parts,
    and in the following autumn many wolves howl around the village and approach.'
  language: English
  quote_policy: summarized
