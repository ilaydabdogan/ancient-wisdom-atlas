  quote: ''
  summary: The passage gives procedural recipes for preparing Erythronium roots baked
    in ashes, lupine roots boiled in a kettle over stones and grass, and lupine roots
    steamed over red-hot stones with grass and skunk-cabbage leaves. It also describes
    serving the roots with oil and drinking or using water afterward.
  language: English
