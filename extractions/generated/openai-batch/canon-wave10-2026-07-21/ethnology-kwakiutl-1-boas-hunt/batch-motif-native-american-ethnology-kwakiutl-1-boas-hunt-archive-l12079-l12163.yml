literal_observations:
- id: obs:1
  text: Erythronium roots are baked by placing unwashed roots in a hole dug under
    the side-pieces of the fire and covering them with ashes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The baked roots are placed on a mat and eaten with oil; the eater rubs off
    adhering ashes with oil, dips the roots in oil, eats them, drinks water, and washes
    the hands with water from the mouth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: For boiled lupine roots, the woman collects fresh medium-sized stones from
    the beach, puts them in a small kettle, places roots on them, covers the roots
    with dead grass, adds water using horse-clam shells, and boils the kettle on the
    fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boiled lupine roots are steamed after boiling, then removed with tongs,
    placed in a dish with oil, and eaten by dipping one end in oil and biting it off.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that after eating lupine roots, the eaters drink water
    and do not get drunk or sleepy.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: For steamed lupine roots, red-hot stones are placed in a steaming-box, covered
