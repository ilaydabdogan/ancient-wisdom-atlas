canonical_text:
  quote: ''
  summary: The passage gives procedural descriptions for gathering, cooking, and eating
    barnacles and cryptochitons. A woman prepares barnacles on a rocky beach with
    eel-grass, cedar-sticks, and fire, then serves them at home with stones for cracking
    shells. It also describes collecting cryptochitons at low tide, boiling them in
    freshwater, cleaning and eating them, and the beginning of a baked-cryptochiton
    method using hot ashes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman goes to the rocky beach at Fort Rupert, finds a large patch or sheet
    of barnacles, leaves cedar-sticks and a clam-digging stick on the rock, and gathers
    eel-grass at the high-water mark in a basket.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman scatters eel-grass over the barnacles, starts a fire with cedar-sticks
    and matches, waits for the fuel to burn, sweeps away eel-grass and ashes, and
    pries off cooked barnacles in cakes with her digging-stick.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After carrying the cooked barnacles home, the woman calls her husband and
    children, or friends if she has no children, spreads mats, gives each diner two
    stones, and pours out the barnacles for them to crack and eat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: At low tide the woman takes a small basket and a cryptochiton digging-stick,
    looks under stones on the rocky beach, turns cryptochitons over with the stick,
    and puts them into the basket until it is full.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: For boiled cryptochiton, the woman washes a kettle, half-fills it with freshwater,
    sets it over the fire, adds cryptochitons when the water boils, stirs them with
    tongs, removes the kettle when boiling resumes, and transfers the cooked cryptochitons
    into a dish of water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The husband sits by the dish of boiled cryptochitons, peels off the shell,
    removes entrails, eats the red soft parts described as berries, washes the cleaned
    cryptochitons, eats them, rinses his mouth, drinks a little water, and sits still.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: For baked cryptochiton, the woman throws a handful of cryptochitons under
    the fire into hot ashes near the side-logs, stirs the ashes with tongs, removes
    the cryptochitons when they are burnt black, and prepares a small dish half full
    of water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage refers back to a previously described barnacle-feast procedure
    when describing what happens after the guests finish eating barnacles.
  category: speech
  evidence_refs:
  - ev:3
