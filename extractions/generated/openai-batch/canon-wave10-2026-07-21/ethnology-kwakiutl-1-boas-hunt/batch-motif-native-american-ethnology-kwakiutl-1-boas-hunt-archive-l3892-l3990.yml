canonical_text:
  quote: ''
  summary: The passage gives procedural descriptions of gathering huckleberries, salmon-berries,
    and crabapples. Women travel by canoe to appropriate gathering places, use specialized
    baskets, boxes, hats, belts, paddles, poles, and anchor-lines, harvest and pack
    the fruit, and return. The salmon-berry section adds that a man planning a feast
    hires many women, receives the gathered berries, and pours them into an oil box.
  language: English
  quote_policy: summarized
