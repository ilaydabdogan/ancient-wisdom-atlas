canonical_text:
  quote: ''
  summary: The passage explains dreams as reports brought back by souls returning
    to their owners. A soul may return crosswise or upside down, causing sickness;
    a shaman diagnoses this by feeling the head and performs a night cure using a
    hemlock-branch ring, eagle-down, time-beating, rightward movement, four repetitions,
    and burning the ring in the central fire. Qasnomalas lists places to which souls
    go and distinguishes ghosts from souls. The passage then notes differing uses
    of the term “head shaman” among Kwag'ul and Nakwaxda'xw groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dreams are described as news told by souls when they return to the owners
    of the souls after going around the world.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A soul may return to its owner the wrong way, quickly, crosswise, or upside
    down, and this makes the owner look sick and weak.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The shaman feels the sides, back, and top of the sick person's head and diagnoses
    that the soul is in the wrong way.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For the cure, the shaman breaks off tops of hemlock branches in the woods,
    makes them into a ring, and hangs the ring under the shelter of a thick tree until
    night.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Elderly men are called to beat time; batons are given to them, eagle-down
    is put on them, and a new mat is spread toward the fire for the naked sick man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Qasnomalas enters singing his sacred song while holding the large ring, and
    another shaman places eagle-down on the ring.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ring is lowered over the man from head toward the floor; he steps out
    with his right foot, turns to the right, sits again, and repeats the action four
    times.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After checking the top of the man's head, the shaman says the man has been
    set right, goes around the central fire with the ring, throws the ring into the
    fire, and the man becomes well.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Qasnomalas names several places to which souls go: the sea-hunters'' place
    at sea, the hunters'' place in the woods, the salmon country, and the owl mask;
    notes associate these with killer whales, wolves, twins, and common people becoming
    owls.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The ghost is said not to be a soul; it is seen as notice to those who are
    going to die and has a human body and bones of long-dead people.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Souls are said to have no bones or blood, to be like smoke or shadows, and
    to have no house except the body of the soul-owner.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage distinguishes Kwag'ul and Nakwaxda'xw uses of the name “head shaman,”
    saying the Kwag'ul apply it to the headman of the Sparrow Society while the Nakwaxda'xw
    use it for the headman or head chief of shamans.
  category: relationship
  evidence_refs:
  - ev:8
