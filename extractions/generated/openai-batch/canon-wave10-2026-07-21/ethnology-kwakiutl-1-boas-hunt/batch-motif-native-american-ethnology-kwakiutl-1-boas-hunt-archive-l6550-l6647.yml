canonical_text:
  quote: ''
  summary: The passage describes feast preparation and serving procedures centered
    on salmon, including clearing the house, calling guests, singing feast-songs,
    cooking salmon, distributing dishes, rinsing, drinking, eating, washing, and waiting
    for courses. It then describes preserved salmon from cellars, including washing,
    soaking, cutting, boiling, adding oil, and serving, with a note that one preparation
    is the way of the Denax'da£xu in Knight Inlet. A final section describes serving
    middle parts of salmon from a basket, removing cedar-bark bindings, portioning,
    dipping in oil, and eating.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The house is cleared before the feast arrangement is prepared; a kettle is
    placed before the fire, and the woman places dishes, oil-dishes, and oil at her
    sitting place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man calls the guests again; the men enter one by one, a drum is placed
    on the right-hand side of the guests, and the song-leader begins new songs and
    a feast-song.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The host puts soaked salmon into a large kettle, places it over the fire,
    pours in water, and removes it after the guests finish singing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man spreads a mat, uses long tongs to remove the cooked salmon, and the
    woman places one salmon in each dish, breaks it into mouth-sized pieces, and pours
    oil into an oil-dish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man places the drum by the door, distributes dishes so that each two men
    receive one dish, and sets a bucket before the highest-ranking guests for mouth-rinsing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After rinsing and drinking, the guests eat; afterward the man brings water
    again, removes dishes, gives drink to the highest-ranking guest, and the woman
    washes dishes for hand-washing before the next course.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: When salmon are no longer in the rivers, salmon stored in cellars are dug
    up, washed until clay and sand are removed, soaked in the river overnight, and
    taken out by the woman in the morning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Quarter-dried green salmon are described as thick and like fresh salmon; the
    woman cuts them into twelve pieces, boils and stirs them until they become a mush,
    adds oil, and serves them with spoons.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: For this spoon-eaten quarter-dried salmon, the passage states that a second
    course is not given.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Another preparation boils green salmon briefly, cuts them to pieces, places
    them in a dish without water, pours oil over them, and has the man eat them by
    hand.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage identifies the briefly boiled, oiled green salmon preparation
    as the way of the Denax'da£xu in Knight Inlet.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: For middle parts of salmon, the woman opens a basket, removes cedar-bark bindings,
    and, when there are four men, places eight middle parts into two dishes, four
    pieces per dish.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Diners fold over pieces of the middle salmon, chew them to soften them, dip
    them in oil, put them in their mouths, and wait for the second course.
  category: sequence
  evidence_refs:
  - ev:8
