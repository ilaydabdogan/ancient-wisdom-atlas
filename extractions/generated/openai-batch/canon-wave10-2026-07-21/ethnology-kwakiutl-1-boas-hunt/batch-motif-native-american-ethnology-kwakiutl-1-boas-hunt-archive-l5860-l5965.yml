canonical_text:
  quote: ''
  summary: 'The passage describes practical food-preservation procedures: boxes of
    berries and oil are covered and stored until winter; seaweed is cured by covering,
    drying, wetting with chiton liquid and water, layering with cedar, pressing with
    stones, repeated beach drying, and storage; a second method browns seaweed by
    a fire, beats it into powder, and stores it in a small covered box.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boxes containing berries and oil are placed in a cool corner of the house,
    covered, tied down, covered with an old mat, and left until winter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An inexperienced woman spreads seaweed on the beach at once to dry, and the
    text says seaweed treated that way is tough.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An experienced woman piles seaweed on the beach, covers it with a mat even
    on a fine day, and leaves it covered for four days so that it will rot before
    drying.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The experienced woman dries seaweed on a broad split-cedar drying rack in
    the sun and wind, turning it over at noon on a fine day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After drying, seaweed is rolled up, rolled in a mat, and put away in the house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The woman goes by canoe to gather chitons; after men eat the chitons and drink
    water, she uses the eating dish, a small box, and cedar-branch tips at the seaweed
    work place.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: The woman folds seaweed on a box-cover, adds liquid from chitons, blows water
    from her mouth over it, and blows four mouthfuls of dirty water onto it before
    folding it again.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: Soft cedar-branch tips are placed in the bottom of a small box, seaweed is
    layered on them, more cedar branches are placed over it, and the process is repeated
    until the seaweed is boxed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: The boxed seaweed is tied with rope, weighted with boards and many stones,
    left for about a month, dried on the beach, returned to the box with cedar branches
    and stones, and this is done four times before final covered storage.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:10
  text: In a second curing method, poles and split cedar sticks form a rack by the
    fire, and pieces of seaweed are browned, turned over, and browned again.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:11
  text: Fire-browned seaweed is placed on dressed deer-skin, made into a bunch, beaten
    with a wedge on a board until powder-like, shaken into a small box, covered tightly,
    and placed in a dry part of the house.
  category: sequence
  evidence_refs:
  - ev:12
