canonical_text:
  quote: ''
  summary: 'The passage describes food-related customs and beliefs: preparation and
    communal eating of first salmon eyes with prayer to the salmon as Supernatural-Ones;
    disposal of salmon slime, bones, and skin into the sea; an origin anecdote for
    a sockeye-salmon food name; a coal test for fish-trap luck; fire placed on sea-egg
    refuse to keep spirits from eating it; and avoidance of a large devil-fish called
    the bear of the rocks.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman prepares salmon-head eyes with roasting-tongs, gathers slime, and
    throws the slime into the sea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four roasting-tongs with salmon eyes are placed by the house fire and watched
    until the skin of the head blackens.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The husband invites his numaym to eat the roasted eyes and avoids keeping
    them in the house overnight because the first people said the salmon would disappear
    from the sea if they were kept overnight when first caught.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The highest-ranking guest prays before eating, addressing the food as Supernatural-Ones
    and asking protection from danger or evil.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prayer states that the bodies of the Supernatural-Ones are dead there,
    but their souls come to watch over the people while they eat what has been given
    to them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the feast, the wife collects pieces of bone and skin on a food-mat and
    throws them into the sea; guests dry fat from their hands without washing or wiping
    with cedar-bark.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A sun-dried sockeye-salmon name is explained by an anecdote in which a woman
    is seen by her husband while her lover cohabits with her as she cuts salmon, leading
    the husband to name the food in order to shame her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A fish-trap is tested by placing a coal inside it and shaking it; crumbling
    or extinguished coal means the trap will be lucky, while coal jumping out through
    the entrance means it will be unlucky.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sea-egg shells are carried out with a firebrand placed on them so that spirits
    will not eat the refuse; if spirits eat it, a person eating from those shells
    is said to become sick.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The largest kind of devil-fish is called the bear of the rocks, may be nearly
    three fathoms long, and is not eaten by Indians according to the passage.
  category: attribute
  evidence_refs:
  - ev:7
