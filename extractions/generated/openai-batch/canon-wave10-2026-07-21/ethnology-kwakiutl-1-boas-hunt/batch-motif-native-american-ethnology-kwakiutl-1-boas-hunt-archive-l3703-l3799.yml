canonical_text:
  quote: ''
  summary: The passage gives procedural accounts of gathering and preserving lily-bulbs,
    picking elderberries, and beginning a description of picking salal-berries. A
    woman digs lily-bulbs, dries them on mats, protects them from dew or rain, packs
    them in boxes, transports them by canoe to the winter village, and stores them
    in a cool part of the house until winter ceremonial time. Separate sections describe
    elderberry-picking with baskets, belt, and hook near river banks, and salal-berry
    picking preparations with nested baskets and goat-tallow rubbed on the face against
    mosquitoes.
  language: English
  quote_policy: summarized
