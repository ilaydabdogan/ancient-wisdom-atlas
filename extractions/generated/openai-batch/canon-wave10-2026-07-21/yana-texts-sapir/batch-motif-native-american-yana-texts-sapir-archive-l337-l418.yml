canonical_text:
  quote: I shall come to life again from my spittle.
  summary: Grizzly Bears kill the Flint people, leaving Rock Woman alone in the sweat-house.
    A Flint person has left spittle and a strong bow behind with instructions that
    he will return to life from the spittle. At night the spittle becomes a boy, who
    rapidly grows up, tests the bows, takes the strong bow, and goes outside despite
    warnings of Grizzly Bears.
  language: English
  quote_policy: quoted
