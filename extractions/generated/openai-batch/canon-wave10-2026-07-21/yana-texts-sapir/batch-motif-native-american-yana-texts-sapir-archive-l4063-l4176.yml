canonical_text:
  quote: ''
  summary: In the myth of the lost brother, Lizard steals Weasel from Pine Marten's
    home. Pine Marten searches, ascends to the sky by means of Mouse's long tule arrow,
    and learns from Moon where Weasel is held. With Coyote's deception and Pine Marten's
    powers of cold and heaviness, Lizard is trapped beneath the ground. Pine Marten
    wears Lizard's skin to enter Lizard's house, rescues Weasel by leaving a shadow
    substitute, puts the household to sleep, and burns the house; one duck woman survives.
  language: English
  quote_policy: summarized
