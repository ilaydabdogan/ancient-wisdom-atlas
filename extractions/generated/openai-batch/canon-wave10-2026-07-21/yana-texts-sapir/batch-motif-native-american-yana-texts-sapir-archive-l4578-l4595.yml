  quote: Do not use this game in summer, use it in the fall and winter.
  summary: 'Coyote proposes gambling with Cottontail Rabbit, prepares sticks and grass
    bundles for a guessing game, explains the rules for locating a short stick, and
    gives a seasonal restriction: the game is for fall and winter and should stop
    when oak leaves appear, or there will be no acorns.'
