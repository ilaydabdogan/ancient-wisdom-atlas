canonical_text:
  quote: ''
  summary: Silver Fox and Coyote go rabbit hunting. A milkweed net fails when Coyote
    breaks through it, but a sinew net made from deer-skin catches Coyote, and Silver
    Fox kills him with a live-oak stick. Silver Fox says that because Coyote did not
    believe him, food will not be effortlessly available to people. After Silver Fox
    searches for traces of Coyote, Coyote returns angry and starts fire all around.
    He is diverted by grasshoppers, plums, and cherries, says he will not kill people,
    fills a sack with food, and returns. Silver Fox, covered with pitch, says he is
    sorry to have lost Coyote, refuses to eat, and remains silent while Coyote asks
    what they will do and notes that it looks like spring.
  language: English
  quote_policy: summarized
