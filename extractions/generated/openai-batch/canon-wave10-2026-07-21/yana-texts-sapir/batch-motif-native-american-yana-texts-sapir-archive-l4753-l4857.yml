canonical_text:
  quote: ''
  summary: 'The passage continues a Loon episode in which Eagle escapes Loon by putting
    her to sleep and substituting a log. The people try to flee upward in Spider''s
    rope-lifted sack, but Coyote tears a peephole and the sack breaks, dropping them
    into a fire set by Loon. Some eyes escape and remain alive. Diver later traps
    and kills Loon. A following episode begins Pine Marten''s quest for Moon''s daughter:
    Moon kills earlier suitors with smoke and tobacco, while Pine Marten, aided by
    Weasel, withstands the ordeals.'
  language: English
  quote_policy: summarized
