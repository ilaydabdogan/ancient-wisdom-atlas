canonical_text:
  quote: ''
  summary: Rabbit Woman, living at Ba'wa in spring, entrusts her baby to another woman
    while gathering clover. After returning and eating roots and meat, she searches
    from house to house for the child and learns the people killed him and gave her
    some of him as meat. Later, with another sick baby, she seeks a northern medicine-man.
    Coyote claims to be that medicine-man, takes her to his house, performs doctoring,
    tells her to sleep, then kills her and the baby for meat.
  language: English
  quote_policy: summarized
