canonical_text:
  quote: ''
  summary: Coyote returns home muddy and bruised and offers roots to Heron Woman,
    who refuses them. Heron Woman secretly catches and prepares salmon, hides evidence
    of it because of a food taboo, and pretends to have swollen cheeks and a toothache
    by placing raw acorns in her mouth. She asks Coyote to prepare remedies and hot
    water, then secretly attends a night dance in a buckskin skirt, telling Coyote
    not to build a fire. Returning before dawn, she denies knowing about the dance.
    Coyote eventually learns of her conduct when Lizard, who is holding the dance,
    calls her Coyote's widow. Coyote angrily confronts her about rejecting his food
    and goes away; the passage ends with Lizard going for kindling and Coyote coming
    downhill crying.
  language: English
  quote_policy: summarized
