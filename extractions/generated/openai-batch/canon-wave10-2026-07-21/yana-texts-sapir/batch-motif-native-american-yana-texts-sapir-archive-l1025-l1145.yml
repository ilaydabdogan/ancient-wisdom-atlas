canonical_text:
  quote: ''
  summary: In the first episode, people trapped in a dark flint sweat-house are hungry,
    thirsty, and without fire or daylight. Ma'ldama and Bopedidju's-i use flint-working
    tools to chip through the flint wall, allowing daylight in and the people to come
    out. The next titled myth begins with Bluejay, his wife Wildcat Woman, the birth
    of their son, Bluejay's abstention from hunting around childbirth, and the child's
    early growth and play on a hill. Editorial notes identify the myth as a northern
    California suitor tale and as a variant of a Curtin text.
  language: English
  quote_policy: summarized
