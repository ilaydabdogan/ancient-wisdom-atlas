- id: obs:2
  text: An unnamed man looks in different directions, sees no fire to the west, but
    sees light and sparks from fire in the south, then reports this to the gathered
    people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The gathered people propose stealing the distant fire; the chief asks who
    can run well, and Fox and 'A'iwicauna are named as good runners.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Five men depart, circle the village, decide to go south under the ground,
