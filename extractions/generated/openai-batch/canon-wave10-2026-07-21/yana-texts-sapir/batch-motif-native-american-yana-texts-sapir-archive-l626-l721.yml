canonical_text:
  quote: ''
  summary: The passage begins with an editorial note locating and comparing a Yana
    fire myth. The narrative portion describes an unnamed man seeing fire far to the
    south, the people deciding to steal it, Fox and 'A'iwicauna being named as good
    runners, five men traveling south underground at night, Coyote learning their
    route from speaking objects and catching up, and Fox with 'A'iwicauna stealing
    a burning coal from a sweat-house while the owners sleep and fleeing north with
    it.
  language: English
  quote_policy: summarized
