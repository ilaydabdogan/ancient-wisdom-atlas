canonical_text:
  quote: ''
  summary: Grizzly Bear Woman coerces Deer into cutting off and roasting her own flesh,
    then kills and eats Deer and many deer and elk people. Deer's two surviving children
    kill Grizzly Bear's children in a smoke-game, hide the bodies, and flee to a rock.
    Grizzly Bear Woman tracks them and gnaws the rock while the fawns sing for it
    to rise; the rock rises and she dies. The fawns dismember her and command her
    to become a grizzly bear that eats people.
  language: English
