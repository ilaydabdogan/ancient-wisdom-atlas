canonical_text:
  quote: ''
  summary: Flint Boy leaves his grandmother with a lump of acorn bread that is identified
    in a note as ground flint. He encounters twenty Grizzly Bear women at a fire,
    takes their teeth while they are digging earthworms, feeds them the flint bread,
    and they die. Later, his grandmother finds a newborn child while digging sprouting
    roots; the child is washed, grows quickly, names himself Little Gray Squirrel,
    and is made into a dog whose bark shakes the earth and travels in all directions.
    Flint Boy then takes a wife and has the dog tied while he goes hunting.
  language: English
  quote_policy: summarized
