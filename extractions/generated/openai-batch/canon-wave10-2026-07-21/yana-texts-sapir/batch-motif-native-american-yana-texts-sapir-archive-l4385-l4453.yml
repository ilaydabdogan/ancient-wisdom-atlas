canonical_text:
  quote: Tlhat'aina lives in the black clouds still. When he barks, it thunders.
  summary: Flint Boy makes or establishes a dog from his nephew, has him bark, travels
    west with him, marries a dreamed-of girl at Bally mountain, and repeatedly warns
    that the dog must not be touched or released. The wife and others handle or release
    the dog, whose bark frightens people and is heard worldwide. A black cloud comes
    down over the dog and carries him upward; he remains in black clouds, and his
    barking is identified with thunder.
  language: English
  quote_policy: quoted
