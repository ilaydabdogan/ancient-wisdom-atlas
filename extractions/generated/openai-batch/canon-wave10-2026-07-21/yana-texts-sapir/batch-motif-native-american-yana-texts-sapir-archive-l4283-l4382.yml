canonical_text:
  quote: ''
  summary: A boy uses little birds to find and drive out bears, kills many bears,
    spares two Bear women who claim him as husband, and follows them toward their
    father in the west. Warned that fire and acorns may blind him, he collects poisonous
    air from a spring in his pipe. At Moon’s sweat-house, Moon and his people try
    to blind and overpower him, but he kills them with pipe smoke, declares that he
    cannot die, and later revives his slain people from their eyelashes with hot rocks
    before dawn. A following fragment begins with Flint Boy dreaming of a woman and
    her father at Yallo Bally mountain, asking Djuwa'lklaina about them, and planning
    a marriage journey with his nephew.
  language: English
  quote_policy: summarized
