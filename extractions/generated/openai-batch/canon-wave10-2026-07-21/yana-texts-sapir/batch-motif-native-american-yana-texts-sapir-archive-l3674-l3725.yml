  summary: Wildcat has a bad dream, climbs a digger pine, tears off his body parts,
    and becomes a human skull. The skull rolls or bounds through several directions
    and houses, causing people to die. Coyote hears the skull singing, becomes a woman
    with associated objects and foods, persuades Wildcat to be roasted in a hot-rock
    pit, holds him down, then carries the skull west and throws it into a creek where
    future bathers will become medicine-men.
