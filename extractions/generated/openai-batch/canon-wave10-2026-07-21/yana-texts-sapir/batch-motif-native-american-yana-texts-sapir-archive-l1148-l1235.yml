canonical_text:
  quote: ''
  summary: In this Yana narrative segment, Bluejay’s wife Wildcat Woman gives birth
    to another child. Bluejay rejects the baby as not his own, citing bodily differences,
    throws the baby out through the smoke-hole toward the north, and drives Wildcat
    Woman outside, where she builds a bark house. Young Bluejay later takes the rejected
    child, young Wildcat, away to play; the two proceed west through named places
    while their parents search and grieve. At Tcli'yu, Silkworm is living alone and
    is referred to as their uncle.
  language: English
  quote_policy: summarized
