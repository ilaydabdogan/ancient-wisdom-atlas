canonical_text:
  quote: ''
  summary: A pregnant woman becomes ill. Her husband and mother discuss advice about
    pregnancy, including not looking back when going outside and not eating too much.
    After four days, a medicine-man is called but says he does not know what to do.
    The woman is dry and asks for water. She is made to sit on supporting sticks and
    walk around the house. A fox gives a bad omen before daybreak. The mother sends
    the husband to the mountain to build a fire and gather spruce twigs and pine needles.
    He returns at midnight and is told the woman is about to die; she then dies.
  language: English
  quote_policy: summarized
