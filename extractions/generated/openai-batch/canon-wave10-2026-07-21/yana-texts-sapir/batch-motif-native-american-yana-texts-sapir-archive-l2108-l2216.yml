canonical_text:
  quote: Blood was dripping down from the pine tree.
  summary: Wildcat's wife gives birth, and Wildcat leads his wife and child east to
    gather pine nuts. While in a tree, he speaks of a bad dream in which he threw
    down his own body parts and became only a rolling skull. The woman sees blood
    dripping from the tree, flees home, and warns the people. The people run south
    and hide in a sweathouse at Wama'rawi. Wildcat, now a bounding human skull, swallows
    the child, follows the people's tracks, destroys trees and rocks, and repeatedly
    tries to break into the sweathouse.
  language: English
  quote_policy: quoted
