canonical_text:
  quote: ''
  summary: A medicine-man reports that a dream instructed him to doctor a sick woman
    for three nights and predicted her recovery. He describes ritual behavior around
    the house, requests quiet, speaks about roots soaked in water, vows not to leave
    until the woman recovers, and invokes his supernatural power or guardian spirit.
    He describes blood flowing from his body, says he will find the disease-causing
    pain, contrasts himself with women doctors, and explains that his dream brought
    him there to help.
  language: English
  quote_policy: summarized
