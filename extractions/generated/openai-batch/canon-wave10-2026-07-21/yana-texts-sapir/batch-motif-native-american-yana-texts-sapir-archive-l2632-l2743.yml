canonical_text:
  quote: ''
  summary: The passage opens with editorial notes, then narrates how the chief of
    the Geese people orders a northward journey for a dance, with preparations of
    food and dance regalia. Lizard has summoned people to a dance, welcomes the Geese,
    mentions that he has killed a person, and arranges firewood, cooking, a sweathouse,
    and salmon. Heron Woman, wife of Coyote, hears of the event. Coyote asks her to
    spear salmon for him, but she sends him to search for gopher holes. At the river
    she rejects sucker fish, spears salmon, cooks and eats it herself, hides the remains
    so Coyote will not smell them, cleans the place, and then makes clothing and basket-caps.
  language: English
  quote_policy: summarized
