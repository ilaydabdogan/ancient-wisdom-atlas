canonical_text:
  quote: ''
  summary: 'The supplied range first describes people creating and placing a rattlesnake
    to kill Coyote''s son, followed by Coyote''s mourning and appeal for the dead
    son to return to life. It then shifts to a Coyote-and-sister episode: Coyote lives
    alone with his sister, reports a Killdeer person''s news of a dance, feigns illness
    by putting stones in his mouth, and induces his sister to step over him at the
    doorway.'
  language: English
  quote_policy: summarized
