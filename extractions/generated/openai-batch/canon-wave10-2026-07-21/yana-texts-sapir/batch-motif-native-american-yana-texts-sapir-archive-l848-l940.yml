canonical_text:
  quote: ''
  summary: The passage gives explanatory notes on flint-working tools and on beings
    that never die or return after death. It then begins the myth of Flint Rock Chief
    at Mount Shasta, who plans a dance and sends Humming-bird south to invite bird
    peoples. Humming-bird’s speech is not understood, so the southern peoples summon
    Coyote, who claims to understand northern speech and reports both the invitation
    and an invented instruction about peeling bark for string.
  language: English
  quote_policy: summarized
