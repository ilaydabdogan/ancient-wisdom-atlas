canonical_text:
  quote: ''
  summary: Coyote deceives visiting sisters by using stolen black-bear skins and feeding
    them flesh cut from his own body. They discover Pine Marten's true house to the
    east and are received there. In anger Coyote causes winter-like rain and high
    water, sets Pine Marten's sweat-house on fire, and joins an attempted basket ascent
    to the sky pulled by Spider Woman. Coyote damages the basket, which breaks and
    falls. An old gray-haired woman, Bo"miyaup!a, survives, goes north for help, obtains
    a bead necklace from the slain Loon Woman, and restores the burned people to life
    by striking the hearts contained in the beads.
  language: English
  quote_policy: summarized
