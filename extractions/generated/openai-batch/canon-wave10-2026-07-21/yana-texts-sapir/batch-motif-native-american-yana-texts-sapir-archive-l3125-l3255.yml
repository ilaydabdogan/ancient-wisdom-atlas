candidate_motifs:
- id: motif:1
  label: theft, pursuit, and partial recovery of fire
  taxonomy_refs:
  - sacred_theft
  basis: The passage calls the fire carriers robbers, depicts a chase by pursuers,
    and describes fire being quenched and recovered in pieces, while one hidden piece
    remains with Old Shushu.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: medium
  cautions: The excerpt does not show the original stealing act; the taxonomy label
    uses 'sacred' while the passage itself simply calls the pursued figures robbers
    carrying fire.
- id: motif:2
  label: old woman as successful provider of fire to the community
  taxonomy_refs:
  - culture_hero
  basis: Old Shushu, despite age and exhaustion, preserves a piece of fire in her
    ear, releases it in the sweat-house, warms the people, and enables fire to spread
    through the country.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage does not explicitly call Old Shushu a hero; the role is inferred
    from her successful delivery of fire and its communal consequences.
- id: motif:3
  label: fire hidden in the body
  taxonomy_refs: []
  basis: Fire is literally carried in ears; Metsi loses fire from both ears, Old Shushu
    guards one ear, and later releases a large piece from it.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: No broader taxonomy reference is assigned because the available symbol
    list includes fire but not bodily containment.
- id: motif:4
  label: first communal use of fire for cooking and feasting
  taxonomy_refs: []
  basis: After Old Shushu releases fire, the chief roasts venison, people praise its
    taste, and a feast follows before fire is shared more widely.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage presents communal testing and adoption of roasted food, but
    does not explicitly say this is the first cooked food ever.
- id: motif:5
  label: healing through dream instruction and ritual prescription
  taxonomy_refs: []
  basis: The medicine-man reports dreams that prescribe speech to water, fasting,
    bathing, mountain vigil, questioning natural objects, birds speaking, tobacco
    smoking, and collecting luck stones.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives the ritual instructions but does not narrate the final
    outcome of the cure in this supplied range.
- id: motif:6
  label: communal singing as healing support
  taxonomy_refs: []
  basis: The medicine-man or speaker requires people to wake, enter the house, and
    sing, and sends for absent people to help sing.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The text emphasizes social participation, but does not detail the songs
    or their efficacy.
- id: motif:7
  label: healer payment and prestige tension
  taxonomy_refs: []
  basis: Payment in shell beads and dentalia is offered or discussed, the medicine-man
    rejects some items, and the speaker complains about people failing to assist unless
    food is available.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: medium
  cautions: The payer's identity is grammatically ambiguous in the excerpt, and the
    social critique is embedded in conversational narrative.
