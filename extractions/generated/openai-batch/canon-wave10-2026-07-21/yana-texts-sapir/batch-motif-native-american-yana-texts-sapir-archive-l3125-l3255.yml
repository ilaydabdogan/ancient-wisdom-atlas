canonical_text:
  quote: ''
  summary: 'In the end of a fire-finding narrative, Ahalamila, Metsi, and Old Shushu
    flee with fire while pursuers chill, quench, and recover pieces of it. Ahalamila
    and Metsi return home without fire, but Old Shushu later arrives, opens her ear
    over wood-dust, and releases a large piece of fire that warms the sweat-house.
    The people test fire by roasting venison, hold a feast, and fire spreads to other
    communities. The passage then shifts to an account of medicine-men: a sick woman
    has been treated for four days, a medicine-man is summoned, payment is offered,
    and he prescribes dream-guided ritual actions involving water, fasting, mountain
    vigil, singing, tobacco, birds, and luck stones.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Juwaju and Au Mujaupa's people chase three robbers; Chil Wareko drenches and
    chills them, and Jukami and Patcha nearly freeze them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Metsi is almost dead and loses the fire in both ears; Ahalamila also loses
    his fire when the pursuers quench it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Old Shushu runs behind the others while keeping one hand on one ear; fire
    falls from her other ear, breaks in two, and falls apart.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chil Wareko picks up six pieces of fire, thinks he has all of it, and the
    pursuers stop following.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ahalamila and Metsi return home wet, cold, tired, and without fire; the chief
    and people are sorry and think Old Shushu may be frozen dead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At sundown Old Shushu returns to the sweat-house slowly, wet, cold, tired,
    and courageous.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Old Shushu gathers wood-dust, opens her ear over it, and a large piece of
    fire comes out, after which wood is brought and the sweat-house becomes warm.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The chief roasts venison, people taste it and praise it, and a feast follows;
    a chief from another place receives fire and carries it home, after which people
    throughout the country have fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A medicine woman says she has doctored a sick woman for four days and fears
    the patient may not recover; the sick woman's husband sends for a man who claims
    to be a great medicine-man.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The medicine-man arrives, asks that water be put on the ground, and rejects
    some offered shell and dentalium payment in favor of p!ale"si shell beads.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The medicine-man says the sick woman will recover and reports dream instructions
