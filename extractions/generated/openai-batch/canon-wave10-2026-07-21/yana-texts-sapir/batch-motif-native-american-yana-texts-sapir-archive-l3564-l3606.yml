canonical_text:
  quote: ''
  summary: A first-person dream narrative describes travel east across a dried creek
    and north along a trail to a house-like place of ice. The dreamer is invited in,
    seated on ice, pulled up, sees a rock medicine-man, meets her mother and a woman
    named Mary, hears that the place is good and green with flowers, and is then told
    to go back by a different route.
  language: English
  quote_policy: summarized
