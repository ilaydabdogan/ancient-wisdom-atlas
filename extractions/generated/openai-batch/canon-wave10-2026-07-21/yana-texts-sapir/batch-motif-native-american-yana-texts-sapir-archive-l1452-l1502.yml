canonical_text:
  quote: "“There are no people here. Let us make people!”"
  summary: Lizard and Cottontail Rabbit say that neither has a father and that there
    are no people. They mark a ring on the ground and arrange sticks by the four directions,
    repeatedly noting that no sticks remain for the center. The passage describes
    good sticks being carried or placed toward distant directions across mountains,
    future directional peoples as tall and handsome, and an agreement to put bad sticks
    in the center because no good sticks remain. Editorial notes mention another published
    Yana creation-from-sticks version credited to Jupka and caution against a primeval-watery-waste
    attribution for this narrator.
  language: English
  quote_policy: quoted
