canonical_text:
  quote: ''
  summary: Animal-person groups identified as Crow, Blue Fly, and Buzzard look for
    deer carcasses rather than truly hunt deer. Blue Fly wins a dispute with Crow
    over a long-dead deer carcass by pointing to excrement as a claim marker. In a
    rainy camp, Coyote complains that his sleeping place leaks and tries to sleep
    near his mother-in-law, Mountain-Quail Woman, who carries a large vulva while
    Coyote's wife does not. After arranging a rock acorn-mortar between them and addressing
    the rain, Coyote causes Mountain-Quail Woman to sleep and copulates with her.
    At dawn he runs home to his wife; Mountain-Quail Woman follows, becomes pregnant,
    accuses him, throws the children into water, and Coyote does not follow them.
  language: English
  quote_policy: summarized
