  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Pine Marten skins the bear caught by the tree, hangs up the hide at Moon's
    house, and Moon is frightened when he sees it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Drifting Rain and Blue Racer race Pine Marten toward the south; Pine Marten
