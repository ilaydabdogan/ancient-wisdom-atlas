  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Moon sends Pine Marten north for wood; a big horned snake catches him, Pine
    Marten tells it he is its uncle, kills and skins it, and brings back the skin
    with the wood.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:4
  text: Moon tells Pine Marten to hunt on a mountain; Big Rain, Hail, and Buzzard
