  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Pine Marten then puts Moon on the tree, gives him a large swing, and snaps
    him into the sky, where Moon says he will remain and watch what people do.
  category: action
  evidence_refs:
  - ev:7
