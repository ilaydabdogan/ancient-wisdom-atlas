canonical_text:
  quote: ''
  summary: Pine Marten, repeatedly addressed by Moon as son-in-law, survives a series
    of dangerous errands and contests involving sweating wood, a water grizzly, a
    horned snake, grizzly bears, a race, and a digger-pine snapping game. He repeatedly
    brings back skins or spoils that frighten Moon. In the final reversal, Pine Marten
    snaps Moon into the sky, where Moon remains as the moon and observer of people;
    he then sends Prog and two girls upward as well. An editorial note compares the
    suitor tale generally to Curtin's "The Winning of Halai Auna" and notes that the
    water-grizzly fight recalls the Damha'udju story.
  language: English
  quote_policy: summarized
