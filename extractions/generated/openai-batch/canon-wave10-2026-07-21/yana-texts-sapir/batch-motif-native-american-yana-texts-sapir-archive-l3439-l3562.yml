canonical_text:
  quote: ''
  summary: The passage describes a fatal illness, the summoning and failure of a medicine-man,
    death at daybreak, preparation of the body with valuables and personal items,
    communal mourning, burial in a grave, graveside actions including placing water
    on the ground, post-burial burning of house goods and food, movement to another
    place, continued mourning and eating, an order to kill the medicine-man suspected
    in connection with the death, and later offerings at the grave including annual
    burning of food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A very sick man is expected possibly to die; if four days pass without recovery,
    a medicine-man is to be summoned and offered perforated white beads as pay.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The messenger places the beads at the medicine-man's house; the medicine-man
    smells them and says he will not be able to make the sick man recover, while still
    going to see him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The medicine-man doctors the sick man, says he is beaten and does not know
    what to do, and states that the sick man will die; the family begins to weep and
    summons others.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the following day at daybreak, the sick man has died.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A grave is to be dug; valuables, blankets, baskets, trinkets, and a coarse-rope
    burial net are prepared; the body is washed and the hair combed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: People gather, including women, men, and children; they dance and weep while
    the dead man's parents mourn, and the mourners do not eat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bereaved speech refers to poison and to the medicine-man; a source note
    explains that the father suspects the medicine-man of magically poisoning his
    son.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A man from the south, described in the source note as a brave warrior, says
    he does not intend to cry and speaks of poison while possessing flint arrowheads.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The dead man is carried with belongings including arrows, bows, and blankets,
    brought to the grave, and put into it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The dead man's brother lies down in the grave and is pulled out again; someone
    tells him not to weep because he will soon follow him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Women dance and cry at the grave and put water on the ground to the east of
    the dead man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The dead man's mother stays all night near the grave.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The house, ropes, belongings, and food are set on fire, and the people move
