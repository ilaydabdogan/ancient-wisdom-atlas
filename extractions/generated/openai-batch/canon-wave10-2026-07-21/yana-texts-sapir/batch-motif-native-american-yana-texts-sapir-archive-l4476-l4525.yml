  summary: Red-headed Woodpecker and Woodrat Woman live where people are hungry. Woodpecker
    has acorn stores and withholds food from others, including his sick brother-in-law
    Woodrat, while Woodrat Woman secretly feeds her brother. Woodrat later catches
    salmon, eats with his sister, then shares salmon with Woodpecker, after which
    Woodpecker stops taking food away from him.
