canonical_text:
  quote: ''
  summary: Silver Fox and Coyote live at a sweat-house in Cedar Creek valley during
    heavy snow. They withhold food from one another, argue over whether winter should
    last two or five moons, and repeat several food-gathering episodes in which Silver
    Fox succeeds while Coyote imitates him and is hurt or obtains little. Coyote discovers
    Silver Fox's hidden wife, described as his shadow, and she disappears. Silver
    Fox then prepares a milkweed rope net while Coyote sleeps.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Silver Fox has a sweat-house at Di'yurik' dilla or Di'yurimadu in Cedar Creek
    valley, and Coyote also lives there.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Silver Fox hunts deer, kills some, does not bring them home, and eats alone
    at night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Coyote is hungry during a big snow, goes out for gophers, kills about twenty,
    cooks them, and eats them all himself while Silver Fox expects a share.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For six days Silver Fox does not go out because he has several kinds of food;
    the snow falls for seven days and becomes too deep for Coyote to go out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Silver Fox says he wants two moons of winter, while Coyote says he wants five
    moons of winter and argues that it is better for widows to be hungry.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Silver Fox makes another big snow come and brings home sweet roots from cedar
