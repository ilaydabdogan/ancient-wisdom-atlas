  evidence_refs:
  - ev:4
- id: obs:8
  text: Coyote tries to repeat Silver Fox's root-gathering and grouse-catching methods,
    looks up or stops the process, and returns sick or with only four grouse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Silver Fox tells Coyote he catches yellow-jackets by smoking them out and
    digging up the nest with his penis; Coyote imitates this and is bitten painfully.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Silver Fox has a wife described as his shadow and keeps her in the space between
    the edge of the sweat-house roof and the ground.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Coyote hears Silver Fox and his wife talking, searches, is directed by the
    main post, tries to hold her, and she disappears permanently.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Silver Fox considers catching Coyote in a net, chews milkweed string, rolls
    a rope on his thigh, measures Coyote's head while he sleeps, and finishes the
