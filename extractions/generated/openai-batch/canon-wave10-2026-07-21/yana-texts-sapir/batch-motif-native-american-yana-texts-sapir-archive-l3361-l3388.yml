  summary: 'A dialogue titled "A Lovers'' Quarrel" presents a courtship dispute: a
    lover comes to a young woman, declares long-standing love, proposes visits and
    eventual marriage, while she says she is not yet grown and fears abandonment.
    He answers with assurances, promises good clothing, and then boasts that he could
    pursue other women with help from his kin.'
