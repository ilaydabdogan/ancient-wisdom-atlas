canonical_text:
  quote: ''
  summary: Meadow-lark Woman interprets Humming-bird's message from Flint Rock Chief
    inviting the Geese people to a dance. Goose Chief orders dance regalia prepared,
    and the group travels north. Coyote insists on leading despite contested status;
    the winged Geese fly upward and continue dancing north, leaving wingless Coyote
    behind. Coyote runs after them, injured, and dies from exhaustion and hunger.
    The Geese arrive at Mount Shasta, enter Flint Rock's sweat-house, and are shut
    in darkness for three days and nights while the house owners remain outside.
  language: English
  quote_policy: summarized
