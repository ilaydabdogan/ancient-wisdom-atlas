canonical_text:
  quote: ''
  summary: Fox and 'A'iwieauna return from the south with stolen fire and give it
    to Coyote. Coyote burns his hand, drops the fire, and the fire spreads in all
    directions, burning land, water, mountains, river area, and people. At Eagle's
    village, Eagle calls for action; Spider uses a strong rope and a large tule basket
    tied to the sky to pull the people upward. Coyote tears a hole in the basket to
    look down at the fire and falls. Fire-Drill Woman sees people falling; the people
    burn, Black Bear's eyes scatter in four directions, and Spider remains in the
    sky. Editorial notes compare one exclamation with a Takelma text and compare the
    sky episode with a Loon Woman story.
  language: English
  quote_policy: summarized
