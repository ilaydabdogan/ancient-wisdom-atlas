canonical_text:
  quote: ''
  summary: Coyote, disguised as an old woman carrying his penis wrapped as a baby,
    deceives Lizard during preparations for a dance. He makes Lizard's wood burden
    heavy, uses a hidden sharp flint to kill him, puts on Lizard's skin, and returns
    to the sweat-house in Lizard's appearance. After the people sleep, Coyote smears
    pitch around the sweat-house and on the people and burns them in revenge. Duck,
    Goose, Ground Squirrel, and Gray Squirrel survive or are with the survivors; Duck
    and Goose enter a lake and discuss where to go, naming northern, eastern, and
    southern destinations.
  language: English
  quote_policy: summarized
