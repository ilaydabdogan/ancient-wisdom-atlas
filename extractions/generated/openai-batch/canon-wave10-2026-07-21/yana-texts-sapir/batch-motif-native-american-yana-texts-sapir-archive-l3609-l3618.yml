  quote: ''
  summary: A spell spoken by a girl who wants a husband asks that the desired man
    think of her, turn back to look, and be visible to her every day. The speaker
    describes crying, dreaming of him, looking for him at daylight, feeling her heart
    flutter when she sees him, looking at him modestly, and receiving and wearing
    trinkets from him until they wear out.
