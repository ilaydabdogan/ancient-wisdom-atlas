canonical_text:
  quote: ''
  summary: 'The passage gives pronunciation and transcription conventions, then introduces
    nine Central Yana myths collected in December 1907 from Sam Bat''wi near Redding.
    It notes dialect and gendered speech forms. The myth titled “Flint Boy” begins:
    Flint people live at Djo''djanu, quarrel with Grizzly Bear people, have a sweat-house,
    go deer hunting, and repeatedly return with four people missing because Grizzly
    Bears lie in wait. Editorial notes compare the myth with Curtin''s “The Hakas
    and the Tennas,” reject Curtin''s nature-allegory explanation, and identify Djo''djanu
    as a mountain.'
  language: English
  quote_policy: summarized
