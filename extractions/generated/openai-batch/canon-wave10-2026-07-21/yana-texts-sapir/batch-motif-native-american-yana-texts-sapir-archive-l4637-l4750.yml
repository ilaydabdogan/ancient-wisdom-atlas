canonical_text:
  quote: ''
  summary: Loon Woman lives alone by a lake and has killed ten men, making their hearts
    into necklace beads. After dreaming of Eagle's son, she adorns herself and goes
    to Eagle's settlement, where people are dancing and sweating in a sweat-house.
    She joins the women, looks in at the men, is recognized and warned against, is
    teased by men, demands that her husband come out, rejects several men, searches
    the creek for a hair matching her own, identifies Eagle's hidden son, and takes
    him away after Eagle gives him up to spare his people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Loon Woman lives at Hak!a'leimadu, a lake near Hat Creek, and has no husband.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Loon Woman tells men that she loves them, lets them stay, cuts out their hearts,
    dries and strings the hearts, and wears ten hearts as a necklace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Loon Woman dreams of Eagle's son, dresses in a beaded apron and basket-cap,
    paints her face, and travels to Eagle's settlement.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Eagle lives at Ci'p!a with many people and a large sweat-house; Coyote is
    also said to live there.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Meadow Lark Woman lives alone east of the sweat-house and takes up a long
    spear when Loon Woman enters, but stops when Loon identifies herself and calls
    her aunt.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: People are sweating and dancing about a fire in the sweat-house, while young
    women dance outside in moonlight.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The girls notice Loon Woman's strange neck beads, described as looking like
