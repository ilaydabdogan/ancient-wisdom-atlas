  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Eagle keeps his son from dancing by placing him near the wall, rolled in a
    black-bear skin.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: An old man in the sweat-house identifies the stranger as Hak!a'lisimariemi
    and warns the people not to play with her, saying he has seen her make trouble
    in five places.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: A vagrant man and five stranger men tease and pull Loon Woman; after they
    stop, she becomes angry and calls for one of the men in the sweat-house to come
    out as her husband.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Several men come out in response to Loon Woman's call, and she rejects each
    one as not being the desired husband.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Loon Woman searches the creek where the men swam, finds lost hairs, measures
    each against one of her own hairs, and accepts the hair that matches her length.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: When only Eagle's son remains inside, Eagle says he will give up his son's
