canonical_text:
  quote: ''
  summary: A curse formula addresses people who wish harm to the speaker. It asks
    that they speak so as to make the speaker happy, that the harm with which they
    curse the speaker fall on them, that they die or perish suddenly, and identifies
    them as those who drink the speaker's blood. It closes with the speaker's wish
    to be happy and free from sickness. Editorial notes discuss an uncertain formulaic
    word and the blood-drinking expression.
