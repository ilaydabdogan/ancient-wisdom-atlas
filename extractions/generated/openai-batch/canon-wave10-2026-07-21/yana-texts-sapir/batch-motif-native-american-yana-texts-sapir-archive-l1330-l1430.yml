canonical_text:
  quote: ''
  summary: 'A Ya''ewi group on the west side of a river sends people eastward after
    hearing happiness among New Moon''s people. Rivalry follows: Ya''ewi chiefs summon
    the eastern people to fish, seize salmon, and are beaten when Bluejay pulls a
    shared salmon and Fish Hawk''s pole to the east bank. The Ya''ewi then arrange
    a seine-net fishing event and place a water grizzly underwater to seize Bluejay.
    Bluejay is pulled below and mourned by New Moon''s people, but the water grizzly
    spares him, gives him its hide, and Bluejay returns home to hang the hide outside
    the sweat-house. The Ya''ewi discover this, mourn the water grizzly, and begin
    planning a deer hunt with a rattlesnake placed on the trail.'
  language: English
  quote_policy: summarized
