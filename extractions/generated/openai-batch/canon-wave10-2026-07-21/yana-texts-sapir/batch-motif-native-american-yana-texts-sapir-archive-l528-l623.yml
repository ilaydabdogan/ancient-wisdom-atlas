canonical_text:
  quote: ''
  summary: 'The passage contains editorial notes and portions of Yana narratives.
    One note reports that a newly dug-up child knew its own name without having been
    named. A dog commanded to bark shakes the earth and is heard in all four directions;
    after Flint Boy goes hunting, two women release the dog, and it barks with a thunder-like
    voice, seeks Flint Boy, enters fog, and rises into the sky, where people still
    hear it. The next section opens a narrative titled “The Theft of Fire and the
    Burning of the World”: people possess only ineffective, non-hot fire, cannot cook
    food properly, meet in council to look for real fire, and appoint a man to watch
    from a northern mountain at night.'
  language: English
  quote_policy: summarized
