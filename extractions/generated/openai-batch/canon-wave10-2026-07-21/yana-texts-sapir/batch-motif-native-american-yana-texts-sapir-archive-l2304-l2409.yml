canonical_text:
  quote: ''
  summary: 'The passage first describes a human skull becoming a person again through
    heating with hot rocks, while Wildcat undergoes the same process under Coyote
    and dies. Coyote boasts, resumes his equipment, travels south, announces that
    he has killed the human skull, and the people in a sweat-house disperse. The passage
    then begins the story of Coyote, Pine Marten, and Loon: Coyote sees two girls,
    changes his appearance, sends them to his house, and Bull-Frog Woman warns them
    that Pine Marten is elsewhere and that Coyote has stolen black-bear skins. The
    girls enter anyway, and Coyote claims to be a distributor of deer meat and orders
    a fire made. An editorial note compares the episode to known Northern California
    tale patterns.'
  language: English
  quote_policy: summarized
