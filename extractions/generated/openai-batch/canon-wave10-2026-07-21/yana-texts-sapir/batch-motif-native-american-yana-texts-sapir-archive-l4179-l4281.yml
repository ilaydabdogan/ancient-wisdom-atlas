canonical_text:
  quote: ''
  summary: The passage narrates conflict between the Bear people and the Flint people,
    Lizard's use of flints against Bear women, the mutual destruction of the groups,
    and the emergence of Tsawa'tdikapsu from the promised living spittle of Striped
    Flint. Raised by Flint Woman, the child grows rapidly, proves himself as a hunter
    and bowman, and kills two bears associated with the killers of his kin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bears have a house in Bear valley and are enemies of the Flint people;
    Lizard lives with the Flint people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lizard warns young hunters that they may have to fight the Bears, but on that
    day the parties do not fight and the young people bring home deer.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lizard is identified as chief of the Flint people and summons the Bears to
    a fire he has built.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bear women claim the small flints cannot harm them, put flints into their
    hearts, cannot remove them, go away, and fall dead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Flint people and Bears fight for two days; all Flint people are killed
    except Lizard, and all Grizzly Bears are killed except two old women.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The two old Bear women catch and kill Lizard.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Striped Flint had told the old Flint Woman that his spittle would come to
    life again.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Flint Woman survives, cries continually, and places so much pitch on her head
    that it sticks out of the sweat-house; the old Bear women bite off some of it
    in the mornings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Flint Woman hears a small cry, picks something up, cleans and washes it with
    warm water, and places the child on a black-bear hide.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'The child rapidly develops: after two nights and days he crawls, after four
    days and nights he is nearly standing, and then he speaks and asks his grandmother
    for food.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Tsawa'tdikapsu asks for a bow, shoots a mountain quail, is struck with the
    quail as a first-game custom, later kills a rabbit, and describes larger animals
    to his grandmother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The bows of the dead people hang around the sweat-house; the boy breaks many
    of them while trying them, but cannot break the western bow and claims it as his
    own.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The boy chooses the best flints, kills an elk despite his grandmother's doubts,
    and shoots through an oak tree.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:14
  text: The boy asks where the people who killed his brothers live, and his grandmother
    points north.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The boy consults his flints about which is strongest, uses a little bird as
    a lure, shoots two bears through the mouth and out the anus, skins them, carries
    them home, and hangs the hides outside.
  category: sequence
  evidence_refs:
  - ev:8
