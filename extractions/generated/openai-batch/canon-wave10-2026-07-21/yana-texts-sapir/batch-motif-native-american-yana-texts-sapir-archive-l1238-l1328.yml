canonical_text:
  quote: ''
  summary: Young Bluejay and Young Wildcat obtain bows, arrows, and quivers, compete
    in shooting, and travel west. They visit Silkworm, who warns that the New Moon
    Chief of the West kills men who come to woo his daughter by making them smoke
    a pipe filled with the remains of dead people. Silkworm accompanies them, hides
    in Bluejay's hair, and secretly smokes the deadly pipe when New Moon offers it
    to Bluejay, so Bluejay does not die. Later Bluejay hides Silkworm near the sweat-house
    ladder and provides deer fat when asked for fresh meat.
  language: English
  quote_policy: summarized
