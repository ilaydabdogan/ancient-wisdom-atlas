canonical_text:
  quote: ''
  summary: Lizard, Gray Squirrel, and Coyote live together at Wama'rawi. Coyote wants
    to make people; Lizard agrees and prepares sticks for several peoples, including
    broken pieces for the Yana. The three prepare a basket with boiling water heated
    by hot rocks, place the sticks in it, cover it on the roof, and sleep after Lizard
    warns them to keep still. In the morning people emerge; after Coyote judges their
    speech acceptable, the door is opened and the people enter the sweat-house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lizard, Gray Squirrel, and Coyote lived in a large sweat-house at Wama'rawi
    and had no wives or children.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote wanted to make people, while the others initially considered themselves
    sufficient; Lizard finally agreed to make different kinds of people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lizard cut three sticks like gambling sticks and assigned them to the Hat
    Creeks, the Wintun, and the Pit Rivers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After saying something was lacking, Lizard identified the Yana as left out
    and made a pile of small pieces from another stick for them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stick for the Hat Creeks was placed in the east, the stick for the Wintun
    in the west, and the stick for the Pit Rivers in the north.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Lizard, Gray Squirrel, and Coyote made a large basket and used heated rocks
    to heat water in it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Lizard put the sticks into the boiling water and added more hot rocks to boil
    them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The basket was set outside on the roof and covered, and Lizard instructed
    the others to remain still when they heard it turn over because there would be
    people.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the morning they heard the basket turn over, people falling down, and then
    people walking outside.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: They blocked the sweat-house door with a large rock and stayed silent while
    people outside spoke.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Coyote first said the outside speech did not sound right, then later said
    it sounded right, after which the door was opened.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: All the people crowded into the sweat-house, and the three said that it was
    well because there were people.
  category: sequence
  evidence_refs:
  - ev:8
