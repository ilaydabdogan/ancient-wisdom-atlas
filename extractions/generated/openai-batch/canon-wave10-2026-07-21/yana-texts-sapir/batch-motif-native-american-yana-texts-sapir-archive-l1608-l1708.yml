  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: Coyote argues that the dead should remain dead and describes people weeping
    for kin, putting pitch on their eyes, putting on white clay, and mourning.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: While snow covers the trees and people stay inside the crowded sweat-house,
    Lizard makes a man sick and the man dies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Because there is too much snow outside, the dead man is buried shallowly on
    the south side of the sweat-house floor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: After burial, the grave moves as the dead man tries to come back to life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Coyote jumps on the dead man, pushes and tramples him down into the grave,
