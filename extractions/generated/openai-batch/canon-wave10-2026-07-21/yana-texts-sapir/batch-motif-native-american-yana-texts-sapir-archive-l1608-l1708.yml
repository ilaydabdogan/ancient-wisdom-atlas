canonical_text:
  quote: ''
  summary: Lizard privately cuts his hands with flint to make fingers, displays them
    to the people, and then cuts fingers for the people while refusing Coyote. The
    new fingers enable hunting, bow use, pounding with pestles, and future children
    being born with fingers. Later, when people do not yet die, Coyote argues that
    people should die and mourn, while Lizard, Cottontail Rabbit, and Gray Squirrel
    prefer that the dead return to life after shallow burial. A first man dies and
    is buried shallowly inside the sweat-house during snow; when the grave moves and
    the dead man begins to return, Coyote tramples him down and commands permanent
    death and mourning.
  language: English
  quote_policy: summarized
