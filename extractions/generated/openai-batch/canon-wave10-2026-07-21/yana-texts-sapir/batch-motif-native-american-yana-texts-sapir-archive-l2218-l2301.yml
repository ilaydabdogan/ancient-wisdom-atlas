canonical_text:
  quote: ''
  summary: A dangerous human skull, identified in the passage with Wildcat, attempts
    to break into a sweat-house, kills people while rushing north, and encounters
    Coyote. Coyote disguises himself as an old, crying traveler, questions the skull,
    hears the skull's dream explanation for its bodiless state, and describes a fire-and-hot-rock
    treatment by which he claims he can restore such a skull to personhood.
  language: English
  quote_policy: summarized
