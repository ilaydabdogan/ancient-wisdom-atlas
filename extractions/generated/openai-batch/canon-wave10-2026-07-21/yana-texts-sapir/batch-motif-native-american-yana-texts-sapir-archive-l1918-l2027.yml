canonical_text:
  quote: ''
  summary: Coyote brings floating little coyotes to shore, where they become grown
    young men and are directed to hunt gophers. Coyote then meets Frost, trades his
    real feathered cap, bow, and arrows for Frost's snow-made equivalents, and discovers
    that the snow objects melt. A new episode begins in which Crow announces a deer
    hunt; Coyote, married to Mountain-Quail Woman, insists that his mother-in-law
    rather than his wife camp with him, and the women build camp houses.
  language: English
