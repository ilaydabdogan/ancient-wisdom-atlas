canonical_text:
  quote: ''
  summary: In a time when people lacked cooking fire, Ahalamila searches from mountain
    lookouts, brings Siwegi to confirm a distant southern fire, and leads an expedition
    toward Au Mujaupa’s guarded village beyond a great river. Only Ahalamila, Metsi,
    and old Shushu Marimi remain. They cross a narrow bridge, enter the sweat-house
    where the fire is kept under ashes, take coals, carry them in their ears, and
    flee. Au Mujaupa discovers the theft and calls his wind people, who pursue with
    storm and rain until the country is covered with water.
  language: English
  quote_policy: summarized
