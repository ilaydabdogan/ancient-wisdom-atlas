canonical_text:
  quote: ''
  summary: The passage recounts an origin narrative in which early gendered roles
    and bodies are changed, hunters encounter a fire with heated stones that alter
    their sexual anatomy, people become numerous and do not die, Coyote objects to
    this condition, and Lizard argues for making fingers so people can hunt and work
    effectively.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the opening, a group described as women, with a parenthetical note that
    they were formerly men, went deer hunting and returned without killing anything,
    while another group stayed home making acorn meal and acorn bread.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people lacked fresh meat because the men did not kill deer; the passage
    states that there were thirty men and thirty women.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gray Squirrel and Cottontail Rabbit speak about the bad situation and propose
    making men out of women; after the men return angry and whip their wives, a counter-proposal
    is made to make women out of men and men out of women.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: At daybreak the hunters come upon a person building a fire on the ground,
    placing smooth round stones in it; the hunters sit around the fire in a circle
    but do not see the fire or stones.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The heated stones burst from the fire in every direction and cleave the private
    parts of those who had previously been men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the event at the fire, one group becomes men and those who had formerly
    been men become women; the latter stay home, pound acorns, make acorn bread, and
    watch while deer are killed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The people do not die and are very numerous; Coyote says he does not want
    the people to be so numerous and notes that there is no one to cry in winter.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Cottontail Rabbit, Gray Squirrel, and Lizard are said to know about death,
    while there is otherwise nobody who knows about death.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: People's hands are described as round and not divided into fingers; Lizard
    proposes cutting through the hands and making fingers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Coyote objects to making fingers and says the hands are already good; Lizard
    argues that fingers are needed for shooting arrows, hunting, pounding acorns,
    and holding the pestle.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Coyote sits to the north, while Cottontail Rabbit, Lizard, and Gray Squirrel
    sit to the south during the discussion about hands.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Coyote proposes that women use their elbows as pestles and hold mortars down
    with their legs; Lizard and Cottontail Rabbit reject this as bad or harmful.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: 'An editorial note describes the narrative as containing three episodes: mutual
    change of sex, fashioning of hands by Lizard, and introduction of death through
    Coyote''s willfulness.'
  category: other
  evidence_refs:
  - ev:7
