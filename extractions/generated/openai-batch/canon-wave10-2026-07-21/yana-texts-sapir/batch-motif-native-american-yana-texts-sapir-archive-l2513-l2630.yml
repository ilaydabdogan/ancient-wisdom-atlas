canonical_text:
  quote: ''
  summary: During a communal expedition for sugar-pine nuts and other foods at Silver
    Lake, Buzzard's son warns his wife not to go into the water. She insists on entering
    and swimming, sinks between two logs, and is not recovered despite efforts to
    drain the water by a ditch. The community returns home in mourning, lies in ashes,
    and burns gathered pine-nuts. A retrospective passage reports the wife's dream
    and farewell before departure, including her request that her things be burned
    and an omen that her hair would return by wind if she died.
  language: English
  quote_policy: summarized
