canonical_text:
  quote: ''
  summary: Na Kimanaueze sends his son na Nzua to Loanda. In his absence the Ma-kishi
    destroy the home. Na Nzua returns, finds his wife in the fields, and she gives
    birth to two speaking sons, Sudika-mbambi and Kabundungulu, who emerge requesting
    weapons and other objects. The brothers build houses by causing poles, cords,
    and thatch to complete themselves. Sudika-mbambi leaves to fight the Ma-kishi,
    instructing his younger brother to watch a planted kilembe as a sign of his life
    or death. On the road he gathers four named Kipalende companions, encounters Kijandala-midi,
    builds a camp, exposes one Kipalende's failed boast, and later perceives from
    afar that a Kipalende left at home has been defeated by an old woman and trapped
    under a stone.
  language: English
  quote_policy: summarized
