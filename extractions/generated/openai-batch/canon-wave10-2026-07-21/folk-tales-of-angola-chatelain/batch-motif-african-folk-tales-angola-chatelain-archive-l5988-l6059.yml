canonical_text:
  quote: ''
  summary: Mr. Leopard repeatedly sends Mr. Antelope to fetch water with a fish-trap,
    leaving Antelope hungry while Leopard eats. At night Leopard and Antelope join
    a dance. Later Leopard tells Antelope to sleep on a shelf, changes from a man
    into a wild beast, kills sheep and goats in his father-in-law’s fold, throws their
    blood on the sleeping Antelope, and then implies that Antelope killed the animals.
    Antelope is found blood-covered, declared a thief, killed, skinned, and part of
    his meat is given to Leopard. Leopard later brings some of Antelope’s meat to
    Antelope’s wife, saying her husband sent it; a child notices that the meat smells
    like papa.
  language: English
  quote_policy: summarized
