canonical_text:
  quote: ''
  summary: 'A young goat repeatedly visits his young leopard friend. The leopard''s
    father instructs his child to trap the goat in a sack and kill him as food, but
    the goat twice escapes by threatening to soil the sack. After overhearing renewed
    instructions, the goat reverses the trap: he gets the young leopard into the sack,
    kills him, impersonates him under a bed-sheet, causes the leopard parents to cook
    the body, receives food, reveals the deception, and escapes.'
  language: English translation with brief Kimbundu fragments
  quote_policy: summarized
