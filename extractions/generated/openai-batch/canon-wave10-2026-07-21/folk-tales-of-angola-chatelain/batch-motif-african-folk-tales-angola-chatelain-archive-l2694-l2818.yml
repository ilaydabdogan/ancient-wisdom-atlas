canonical_text:
  quote: ''
  summary: 'A pregnant queen craves only fish from the Lukala river. The servant Katumua
    repeatedly catches fish there until he draws up Lukala, a river-being who says
    the fish are his people and demands the queen''s child: a girl as wife, or a boy
    as friend or namesake. A son is born and raised. When the son reaches marriageable
    age, Lukala sends dreams demanding him and threatening death if he is not brought.
    The father gives the son paired servants and animals, food for the road, and instructs
    him not to cross rivers but to go around by their springs.'
  language: English
  quote_policy: summarized
