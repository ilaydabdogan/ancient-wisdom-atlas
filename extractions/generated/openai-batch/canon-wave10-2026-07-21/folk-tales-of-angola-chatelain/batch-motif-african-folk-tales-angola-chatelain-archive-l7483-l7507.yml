canonical_text:
  quote: ''
  summary: Jackal sends his kinsman Dog from the bush to the houses to fetch fire,
    intending to burn grass and catch locusts. Dog reaches a village house, receives
    mush from a woman, decides village food is better than hunger in the bush, and
    stays there. Jackal waits for Dog and later his howl is explained as speech complaining
    that Dog was seduced by mush and stayed for good.
