canonical_text:
  quote: ''
  summary: A blacksmith forges hoes and goes to sell them. In a village, the Blackbirds
    accept the hoes and tell him to return in the third month for wax after they empty
    the hives. When he returns, they demand that he name the specific individual who
    received the hoes, saying all Blackbirds have alike faces and color. Distressed,
    the Blacksmith summons them before Lord Katete, who sends for them; the Blacksmith
    repeats that they must pay for his hoes.
