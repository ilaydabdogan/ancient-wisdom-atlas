  quote: ''
  summary: 'Editorial and comparative notes for tale No. 11: the passage identifies
    the informant and later recorder, describes dialect context, compares the tale
    to Cenerentola/Cinderella traditions in Portugal, Madeira, Brazil, and a Brazilian
    printed version, and explains local Angolan connections through Kimalauezu kia
    Tumb''a Ndala, Ma-kishi, a governor''s child marriage, and terms such as maocila/maxila
    and nguvulu.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The informant is named as Piolho, described as a rope-maker at Bom-Jesus on
    the Kuanza River and as having been crippled after service as a Portuguese soldier.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The editor says Piolho dictated folk tales for small remuneration, interrupted
    dictation when offended, left the present story incomplete, and the final portion
    was later obtained by letter from Domingos de Lemos.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dialect is identified as that of the lower Kuanza around Bom-Jesus, differing
    only slightly from that of Loanda, with some expressions peculiar to the informant.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The editor explicitly identifies the story as originally that of Cenerentola
    and says versions are current in Portugal, Madeira, and Brazil, with the nearest
    related version in Sylvio Romero's Contos populares do Brazil.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The editor says the story's exotic origin has been covered with Angolan features
    so thoroughly that natives would regard the mu-soso as entirely Angolan.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The editor says the heroine is the daughter of Kimalauezu kia Tumb'a Ndala,
    that an episode of the Ma-kishi connects the story with tales where Kimalauezu
    or the Ma-kishi are important, and that marriage with the child of the governor
    relates the story to No. III.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kimalauezu/Kinoueza kia Tumb'a Ndala is described with Loanda and inland name
    variants, as a purely mythic figure who may once have been historical, and as
    a figure whose name carries no reverence.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The maocila or maxila is described as a palanquin, and the note says Nzud's
    use of a maxila indicates residence near Loanda.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nguvulu is explained as deriving from the Portuguese governador and as applying
