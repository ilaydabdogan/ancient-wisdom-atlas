canonical_text:
  quote: ''
  summary: A man goes away while a woman follows him singing to him as her husband;
    heavenly people answer. The man enters a rock with a door and disappears from
    the woman's sight. After the woman returns to her mother's home, she, her mother,
    and all the people die, leaving one woman. A Di-kishi carries off the remaining
    woman, lives with her, and she bears a one-headed child and then a two-headed
    child after a threat. She flees with the one-headed child, but another Di-kishi
    smells humans, finds them asleep, eats them, and the house becomes a house of
    Ma-kishi.
  language: English with Ki-mbundu title/fragments
  quote_policy: summarized
