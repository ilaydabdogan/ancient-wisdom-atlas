canonical_text:
  quote: ''
  summary: The passage describes Angolan political offices and titles, female chiefly
    authority and the power of a chief's head-wife, matrilineal kinship and succession,
    polygamy and marriage pledges, funeral and mourning customs, slavery, and adjudication
    by umpires, chiefs, and poison test in witchcraft cases.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Angolan chiefs have accessory officers who carry out orders and report on
    conditions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In some tribes a chief may be female, and in most tribes the chief's head-wife
    has great power even under the successor's reign.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chiefly titles include Soba, Kilamba for a vassal chief, and Jaka or Ndembu
    for a suzerain; the independent Ndembu form a federation.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Ngola tribe is described as still having one great head and an elective
    and hereditary nobility.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says motherhood, not fatherhood, determines consanguinity, kinship,
    succession, and heredity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The closest relation is described as mother and child, followed by nephew
    or niece and uncle or aunt; the uncle owns nephews and nieces, and they are his
    heirs, including in chiefship if he is a chief.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Polygamy is honored; numerous wives, children, and blood connections are treated
    as wealth and influence.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Each wife has a separate house and fields, provides the husband with food
    and tobacco, and receives house-building and clothing from him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Marriage gifts from the suitor to the girl's parents are described as a pledge
    and symbol of the contract, not as the girl's price.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: At death, people in or entering the house raise a wail, repeated at stated
    hours for weeks or months by near relatives.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The corpse is wrapped in a mat and carried on a pole to the grave, followed
    by howling men and women moving quickly.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Broken pottery and other objects are placed on the grave; a hunter's grave
    may receive a mound of stones or wild-animal skulls on trimmed limbs of a dead
    tree.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: In Loanda, the nearest relative of the deceased may remain for months unwashed
    and unkempt in the bed just vacated, with closed windows, an unswept room, and
    silence broken only by the funeral wail.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Relatives and friends gather from afar for a mourning dance, and the passage
    compares the gatherings to Irish wakes held at the expense of the successor and
    next of kin.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Slavery is described as based on the uncle's right to dispose of nephews and
    nieces, the absence of penitentiaries, and war; debtors, criminals unable to pay
    fines, and prisoners of war may be sold or enslaved.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: Quarrels may be settled by old men as umpires; important cases may go before
    the chief, and witchcraft cases may be decided by poison test with the medicine-man
    acting as judge and often executioner.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: Circumcision is widely practiced but obligatory only among a few tribes.
  category: action
  evidence_refs:
  - ev:11
