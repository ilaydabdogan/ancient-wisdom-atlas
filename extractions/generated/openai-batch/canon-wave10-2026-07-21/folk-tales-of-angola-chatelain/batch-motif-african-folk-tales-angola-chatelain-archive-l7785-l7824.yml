canonical_text:
  quote: ''
  summary: A man recounts that his dogs gave him the power to hear animal speech,
    with an injunction not to tell anyone or he would die. After hearing fowls whispering
    with a goat, he laughs; his wife demands an explanation and forces him to reveal
    the matter. He tells assembled people that he is going to die, enters his house,
    and is found dead. His kinsmen blame the wife and require her uncles to pay six
    cattle. A closing recap says the dogs saved his life, warned him not to tell,
    and died together with their master.
  language: English with Kimbundu heading
  quote_policy: summarized
