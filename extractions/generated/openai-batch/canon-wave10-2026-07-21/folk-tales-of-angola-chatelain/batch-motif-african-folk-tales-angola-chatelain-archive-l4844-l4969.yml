canonical_text:
  quote: ''
  summary: A son of Kimanaueze refuses to marry any woman on earth and seeks the daughter
    of Lord Sun and Moon. Several animals refuse to carry his marriage letter to heaven.
    Frog volunteers, hides in water jugs used by the heavenly water-carriers, delivers
    letters by placing them on a table in the water room, and returns through the
    same route. Lord Sun eventually sends a reply agreeing to the marriage if the
    young man comes in person with his first-present.
  language: English
  quote_policy: summarized
