  quote: ''
  summary: 'Editorial notes describe motifs and linguistic details connected with
    the tale: a guarding lion whose jaws contain a palace key, a sequence of rooms
    with prisoners and wonders, Fele Milanda discovering Fenda Maria in secret practices
    and then marrying her, a comparison with a Zulu tale involving conjuring by a
    brass rod, and the claim that Fele Milanda’s journey to Europe is an Angolan addition.
    Further notes explain Ki-mbundu expressions, titles, idioms, and place-name usage.'
