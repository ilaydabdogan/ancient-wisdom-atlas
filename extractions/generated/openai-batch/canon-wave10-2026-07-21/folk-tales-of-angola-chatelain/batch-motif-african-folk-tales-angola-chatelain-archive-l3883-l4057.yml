canonical_text:
  quote: ''
  summary: Three elder girls regularly visit their friends, the Ma-kishi. A younger
    sister insists on joining despite warnings about a large river. After the four
    girls arrive, the Ma-kishi host them but secretly plan to kill and eat them. At
    night the child stays awake, hears the Ma-kishi asking whether the girls are asleep,
    puts out the fire, and answers with a song saying they are in bed but not asleep.
    Her responses cause the Ma-kishi to bring beer, mush, palm-wine, and cloth, while
    she remains awake until cockcrow. The next day the elders disbelieve her until
    a second night, when they hear the Ma-kishi themselves and discuss how to escape.
  language: English translation with incidental Kimbundu text fragments
  quote_policy: summarized
