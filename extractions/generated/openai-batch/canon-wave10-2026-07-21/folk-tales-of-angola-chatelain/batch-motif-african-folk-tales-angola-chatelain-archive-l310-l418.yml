canonical_text:
  quote: ''
  summary: The passage surveys Angolan peoples, regions, and linguistic groupings;
    identifies the tales in the volume as belonging to the Ki-mbundu group and mainly
    written in the Loanda and Mbaka dialects; and describes Ki-mbundu social organization,
    including village government by an elected chief controlled by elders, succession
    rules, new-community formation, and the offices of premier and secretary.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several tribes are located between the Longa River and Egito, including the
    Mbwiyi, Ba-sumbe, Ba-sele, and Kibala.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ovi-mbundu are described as the Highlanders of Angola and include the
    Mbalundu and Viye as principal tribes of one linguistic stock.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fourth climatic or political zone is described as containing multiple
    nations and tribes, including Ma-Xinji, Lunda, Minungu, Ma-Kioko, Ngangela, A-mbuela,
    Ba-rotse, and Ma-mbunda.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the described natural state, nationality is said to depend less on political
    organization than on language.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The ethnologic division into nations and tribes is said to correspond to
    languages and dialects: people speaking one language form a nation, and each tribe
    has its dialect.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A politically predominant tribe can make its dialect the basis of a national
    literary language.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Angola proper is bounded by the ocean, the Daride/Ndanji and Susa rivers,
    the Kuangu, the Longa River, and a boundary between the Lubolo and Mbalundu tribes.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Ki-mbundu dialects named include Kisama, Lubolo, Songo, Mbondo, Ndongo
    or Ngola, Mbaka, and Loanda, with additional intermediate border dialects.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: All stories in the work are said to belong to the Ki-mbundu group and are
    written in the Loanda and Mbaka dialects.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Every native community inhabiting one place, whether village or town, is governed
    by a chief elected and controlled by the elders.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: In an old community, the chief is generally chosen from one family under tribal
    succession law if the lawful heir is considered fit; otherwise the dignity passes
    to the next heir.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: New communities may be formed by fugitives meeting in the bush and organizing
    themselves by mutual consent according to needs, preferences, and superstitions.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The government is described as a combination of monarchic, oligarchic, and
    democratic forms.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The council of elders is composed of adult and free males who show ability
    and functions as legislative and controlling power.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The council delegates executive power to a chief, whose choice is determined
    by traditions and rules and who must consult leading elders on important matters.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: Within tribal constitution or traditional laws, the chief or king has absolute
    power over subjects' lives and property.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: The chief's premier is called Ngolambole and may be presumptive successor,
    representative in absence, and regent between a chief's death and successor's
    inauguration.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:18
  text: The secretary is called Tandala, Muzumbu, or Sakata and publishes the chief's
    orders, receives and introduces strangers, and handles official correspondence
    when able to write.
  category: relationship
  evidence_refs:
  - ev:8
