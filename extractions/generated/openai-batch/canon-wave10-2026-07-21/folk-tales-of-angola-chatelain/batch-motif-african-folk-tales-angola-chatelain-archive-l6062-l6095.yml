canonical_text:
  quote: ''
  summary: Leopard has the meat cooked and eaten, then tells Antelope's wife that
    Antelope was killed after stealing goats and that the meat they ate was her husband.
    The child had recognized the smell as that of his father. The household mourns
    Antelope. Monkey later says he will go with Leopard to see whether Leopard can
    do the same to him, and the group continues remembering Antelope's unexplained
    death.
  language: English
  quote_policy: summarized
