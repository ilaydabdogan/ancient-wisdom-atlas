canonical_text:
  quote: ''
  summary: 'The passage describes Angolan religious beliefs and practices as understood
    by the author: belief in one invisible creator God who has withdrawn after being
    offended, use of charms rather than idols, inferior spirits associated with natural
    forces and propitiated by offerings and sacrifices, human ritual specialists and
    possessed persons acting as media, named spirits with domains over water, woodland
    and paths, and generation and childhood, and mortal shades propitiated by similar
    rites. The passage then briefly describes native arts and trades including medicine,
    divining, hunting, fishing, wood-carving, and pottery.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that Angolans have the same religious system as the Bantu
    generally and are not, in his terminology, strict idolaters, atheists, fetishists,
    or polytheists.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Angolans believe in one great invisible God who made and
    controls all things, while knowing little about his character.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A tradition reported in the passage says that men offended God and that God
    withdrew his affection from them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says this God is not formally worshipped, visibly represented,
    or thought to be contained in a fetish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wooden images called gods are described as crucifix-shaped and as representing
    the god or fetish of the whites rather than the Angolans' own invisible God.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Other figures used by the natives are described as charms, amulets, or talismans
    to which a medicine-man has imparted virtues by incantations from an inferior
    spirit.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The inferior spirits, called ma-bamba in the passage, are said to represent
    forces of nature and to deal with people in friendly or unfriendly ways according
    to capricious passions.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The friendship of the demons is said to be secured and maintained by presents,
    offerings, and sacrifices, forming the visible cult described by the author.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Medicine-men or women, diviners, and individuals with possession or inspiration
    are described as media between demons and people.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: These media are described as a kind of secret order with individual influence,
    but not as an organized hierarchy.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Kituta or Kianda is described as ruling over the water and being fond of great
