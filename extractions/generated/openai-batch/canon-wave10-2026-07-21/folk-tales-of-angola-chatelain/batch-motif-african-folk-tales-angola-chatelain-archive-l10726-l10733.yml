  summary: Editorial notes explain that an order attributed to Nzud is deliberately
    ambiguous in writing and translation, depending on spoken intonation. A boy was
    probably instructed to deliver the message in a flat tone so that each wife had
    to infer its correct meaning. The notes also mention a pun involving ki-oua and
    uoua, and gloss Mud as meaning “in the house, or place, or town, of.”
