canonical_text:
  quote: ''
  summary: In the closing episode of “The Children of the Widow,” Hawk rescues a remaining
    child from a tree being felled by the Ma-kishi, sets her with the others on the
    far side, later asks the girls for payment, and is told to take fowls. The narrator
    explains this as the origin of Hawk catching fowls, though formerly he ate locusts
    and small birds.
