canonical_text:
  quote: "“the bundle, which the wise bound, let a fool untie it”"
  summary: A boy, acting for his master, delivers separate bundles to four Uoua women
    with instructions not to tell the others. The first three store their bundles
    unopened. The youngest opens hers, finds rats, cleans and cooks them, and dries
    them on a spit. After ten days Na Nzua returns from hunting and asks each woman
    for her bundle. The first three bundles contain rotten rats and maggots; the youngest
    produces dried rats. Na Nzua publicly declares the elder three foolish and unintelligent
    and says he will marry the youngest.
  language: English
  quote_policy: quoted
