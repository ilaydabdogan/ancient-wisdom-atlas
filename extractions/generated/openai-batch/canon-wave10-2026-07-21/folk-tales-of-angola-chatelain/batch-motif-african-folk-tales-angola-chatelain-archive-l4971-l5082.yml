canonical_text:
  quote: ''
  summary: Mainu the Frog serves as a hidden courier between the son of na Kimanaueze
    on earth and Lord Sun and Lady Moon in heaven. He transports letters and marriage
    payments by hiding in water jugs carried from a well up to heaven by the cobweb
    of Spider. Lord Sun and Lady Moon accept the presents, feed the unseen messenger,
    and request or receive the wooing-present. After the wooing-present is accepted,
    Frog offers to bring the bride down from heaven despite the son’s doubts.
  language: English
  quote_policy: summarized
