canonical_text:
  quote: ''
  summary: Editorial notes identify No. XXIV as a Mbaka-dialect story. The notes compare
    it with other numbered tales in which the Young Leopard and the Young Goat begin
    as friends, describe the Leopard as wicked and crafty but less shrewd than the
    Goat, classify the conclusion as etiological because it explains leopard-goat
    hatred, and mention a deceit in which some are made to eat a kinsman’s flesh.
    Lexical notes define ngubu as a large covering cloth, mantle, or shield, and explain
    a phrase as meaning a whining voice.
