canonical_text:
  quote: ''
  summary: Editorial notes define umbanda as healing, divination, spirit influence,
    and charm objects; explain the proverb that wits or wisdom surpass charms; describe
    louse-catching as friendship and reciprocal service, including use of a louse-crushing
    worm; add notes on local moral standards, vocabulary, trade terms, and leave-taking
    formulas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Umbanda is defined as the faculty, science, art, office, or business of healing
    by natural or supernatural medicines, divining the unknown by consulting shades
    or other spirits, and inducing spirits to influence humans and nature.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Umbanda can also denote the forces at work in healing, divination, and spirit
    influence, and the charm objects thought to connect spirits with the physical
    world.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Natural remedies for sickness are distinguished from maumbanda charms and
    are called mi-longo.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A cited proverb states that wits are greater or stronger and medicines or
    charms are smaller or weaker.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The note interprets the proverb as meaning that natural or acquired ability
    protects and exalts a person more than charms, and that a wise person without
    charms is better off than a foolish person with many charms.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The note paraphrases the phrase in the source tale as a struggle with contrary
    influences in which the addressee will eventually conquer.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Catching another person's lice is described as a token of friendship, often
    performed with the expectation of reciprocal kindness; among non-friends compensation
    may be given.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A schoolboy complains that another pupil refuses to catch his lice, treating
    the refusal as a breach of school-fellowship.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: A worm called katotola-jina, glossed as the lice-crusher, is placed on the
    hair to find and devour lice and is then cast back into the bush.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The note states that lying in self-defense, limited cheating, and stealing
    trifles for a friend are not condemned by the described native standard, though
    being caught may bring shame for lack of shrewdness.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Several later notes explain vocabulary, loanwords, trade terms, kinship forms,
    and terms for wax, ivory, rubber, soldiers, and a military band.
  category: other
  evidence_refs:
  - ev:5
- id: obs:12
  text: On taking leave, the person who goes says a formula meaning remain or stay,
    while the person who stays replies with a formula meaning arrive safely at your
    destination.
  category: speech
  evidence_refs:
  - ev:6
