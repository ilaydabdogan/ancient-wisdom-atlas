canonical_text:
  quote: ''
  summary: In this passage from the tale of Ngana Fenda Maria, Fele Milanda’s mother
    warns him that Kamasoxi has deceived him and that Fenda Maria is the true mistress.
    Fele returns to Portugal to buy Fenda Maria’s forgotten requested objects. At
    home Fenda Maria performs a night rite with costly objects that threaten to kill
    her if she lies; self-moving implements animate, but dolls stop them. An old woman
    reports the rite to Fele, who secretly observes. Fenda Maria accuses Kamasoxi
    of failing to deliver a silver key and asserts that she saved Fele’s life. Fele
    later questions Kamasoxi before breakfast guests, and she cannot answer.
  language: English with Ki-mbundu terms
  quote_policy: summarized
