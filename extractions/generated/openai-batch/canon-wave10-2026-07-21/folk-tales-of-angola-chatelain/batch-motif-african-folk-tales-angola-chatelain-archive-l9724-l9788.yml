canonical_text:
  quote: ''
  summary: Editorial notes explain Ki-mbundu and Portuguese-derived terms, including
    ngonge as both proclamation and bell-like instrument, saku as a sack-based money
    amount, several loanwords and idioms, a note on story transmission, a saying about
    women and marriage payment, and the term kikusu for a freshwater fish.
  language: English with Ki-mbundu and Portuguese terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ngonge is described as both an instrument used for proclamation and the proclamation,
    order, or command itself.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: In native towns, a herald shouts proclamations in principal thoroughfares
    and may first attract attention by striking a native bell or sounding a bull's
    horn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ngonge bell is described as an iron, U-shaped double bell without clappers,
    played by striking each cup alternately with a piece of iron.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The note gives regional names for the horn or bell, including ngonge among
    Kisama people, kipanana at Malange, and mbinga or mbungu at Loanda.
  category: other
  evidence_refs:
  - ev:1
- id: obs:5
  text: Saku is identified as deriving from Portuguese sacco and as representing thirty
    Portuguese dollars, a man-load of Angolan copper money usually put in a sack for
    remittances to the interior.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The two sacks promised by the Governor are valued by comparison with the purchase
    price of enslaved persons in Loanda and in the interior, despite legal abolition
    of slavery in Portuguese dominions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage lists several Portuguese-derived terms and Ki-mbundu equivalents
    or idioms, including terms for ensign, arms, jail or chains, deception, and hanging.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: One note says Piolho's dictation ends at that point and that the remainder
    was sent to the editor in America by Domingos de Lemos, formerly a Loanda pupil
    and then employed at Bom-Jesus.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The editor glosses a saying as meaning that women must be paid for before
    marriage because their bodies are treated as merchandise that can be sold owing
    to demand.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kikusu is defined as a relished freshwater fish with many bones.
  category: object
  evidence_refs:
  - ev:6
