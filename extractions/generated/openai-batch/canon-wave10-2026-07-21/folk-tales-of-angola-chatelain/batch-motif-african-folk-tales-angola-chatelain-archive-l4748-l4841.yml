canonical_text:
  quote: ''
  summary: Two men, an elder and a younger, go hunting with the younger man's two
    dogs, Mutelembe and Ngunga. The younger man succeeds in killing game while the
    elder does not. Fearing shame, the elder kills the younger man, offers his bowels
    to the dogs, and tries repeatedly to kill or bury the dogs when they sing about
    the murder. The dogs return and sing at the village, leading the people to accuse
    the elder and mourn.
  language: English
  quote_policy: summarized
