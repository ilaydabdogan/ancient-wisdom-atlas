canonical_text:
  quote: "“If thou tell it to any one else, thou shalt die.”"
  summary: Nianga dia Ngenga, a hunter with two wives and two dogs, receives hunting
    medicine and rules from a medicine-man. After forgetting a rule, he is trapped
    in a tree-seat while hunting. His dogs speak, use his hatchet and a tree to rescue
    him, and tell him he will hear the speech of animals and other things but must
    not disclose it or he will die. Later he hears fowls and a goat speak, laughs,
    and is accused by his wife of laughing at her rag-wearing mother. Under pressure
    to explain, he gathers the village and says he is going to die before beginning
    to recount the events.
  language: English translation with Kimbundu title and textual artifacts
  quote_policy: quoted
