canonical_text:
  quote: "“This meat is smelling of father.”"
  summary: Leopard kills a goat at night, marks Antelope with the goat's blood, and
    accuses him of theft. Antelope is killed, and Leopard receives one of his legs.
    Leopard returns home, lies to Antelope's wife about Antelope's absence, gives
    her the leg, and she cooks it for the children. One child says the meat smells
    of father, but the mother rejects the statement and they finish eating.
  language: English
  quote_policy: quoted
