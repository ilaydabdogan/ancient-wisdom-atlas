canonical_text:
  quote: ''
  summary: In the closing episode of a tale involving Leopard, Antelope, and Monkey,
    Monkey uses deception around Leopard’s whereabouts and death. Leopard is killed
    at his father-in-law’s place. Monkey is given meat from Leopard and brings it
    to Leopard’s household, falsely saying Leopard sent it from a hunt. Leopard’s
    family cooks and eats it; a child remarks that it smells like the father. Monkey
    then reveals Leopard was killed after killing others’ goats, escapes pursuit,
    and the household remains wailing a funeral.
  language: English
  quote_policy: summarized
