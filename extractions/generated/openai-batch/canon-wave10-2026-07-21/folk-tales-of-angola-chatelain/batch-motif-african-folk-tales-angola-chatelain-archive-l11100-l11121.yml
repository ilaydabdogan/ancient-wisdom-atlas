canonical_text:
  quote: ''
  summary: The passage identifies No. XIX as a Mbaka dialect text and gives comparative
    editorial notes classing Nos. XVIII, XIX, XX, and XXXIX as hunter-stories, while
    noting that No. XXXIX is elsewhere classed as tnaka by the informant. The notes
    explain a pregnancy and newborn practice involving consultation of spirits, first
    solid foods called ji-haku, and the formal bringing of a child from the dark hut
    into the world. Additional notes identify Mudia-mbambi as the coffee-tree and
    define Ki-sumbula/nzambi as a hunter’s stick placed in a tree fork for watching
    game.
