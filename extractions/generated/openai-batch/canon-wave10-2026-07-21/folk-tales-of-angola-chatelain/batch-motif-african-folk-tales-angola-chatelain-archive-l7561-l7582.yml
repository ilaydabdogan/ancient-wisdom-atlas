  summary: Partridge and Turtle argue about which of them can escape burning when
    fire comes into the land. Partridge says wings allow flight while Turtle cannot
    fly or run. Later, in the dry season, fires begin across the country, the bush
    where they are is set on fire, and Turtle enters an incomplete ant- location as
    the fire approaches.
