  quote: ''
  summary: During a war with the Ma-kishi, an old woman repeatedly challenges the
    Kipalendes left at home, beats them, and weights them down with stone. Sudika-mbambi
    defeats and kills the old woman, marries the young woman she had confined, is
    betrayed by the Kipalendes and dropped into a covered hole, and then travels along
    a road where he receives guidance from another old woman before arriving at na
    Kalunga-ngombe’s place to seek a daughter in marriage.
  language: English
