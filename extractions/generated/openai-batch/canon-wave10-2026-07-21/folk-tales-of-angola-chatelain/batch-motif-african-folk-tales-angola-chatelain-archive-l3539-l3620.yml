canonical_text:
  quote: ''
  summary: Sudika-mbambi asks Na Kalunga-ngombe for his daughter, learns that she
    was taken by Kinioka, defeats hostile swarms and successive heads of Kinioka,
    and brings the daughter back. Na Kalunga-ngombe then sends him against Kimbiji,
    a water-dwelling creature that has been taking goats and pigs; Sudika-mbambi baits
    a hook with a suckling pig, falls into the water, and is swallowed. His younger
    brother Kabundungulu sees a dry kilembe, concludes that his elder brother is dead,
    follows his path, learns that Kimbiji swallowed him, hooks and lands Kimbiji,
    cuts it open, gathers Sudika-mbambi's bones, commands him to arise, and Sudika-mbambi
    arises. Na Kalunga-ngombe gives Sudika-mbambi his daughter. Later the brothers
    quarrel over women, fight without being able to kill or cut one another, and separate,
    one going east and the other west.
  language: English
  quote_policy: summarized
