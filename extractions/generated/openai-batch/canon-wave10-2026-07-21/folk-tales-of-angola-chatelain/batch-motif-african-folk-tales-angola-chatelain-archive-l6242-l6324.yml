  text: Mr. Leopard asks Mr. Antelope to accompany him to his parents-in-law, and
    Mr. Antelope agrees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the road, Mr. Leopard calls driver-ants the girdle of their wife and tells
    Mr. Antelope to pick them up.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mr. Antelope gathers the driver-ants into his bosom, is bitten, and throws
    them down; Mr. Leopard laughs and calls him a fool.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mr. Leopard repeats a similar instruction with red ants, describing them as
    the wife’s girdle of red cloth; Mr. Antelope is bitten again, and Mr. Leopard
    laughs at him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a field, Mr. Leopard tells Mr. Antelope to pluck unripe egg-plants and
    unripe cassada, while Leopard himself gathers ripe egg-plants and large cassada
    tubers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When they meet again, Mr. Leopard mocks Mr. Antelope for having gathered green
    fruits.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: At a river, they drink water and find a fish-trap; Mr. Leopard says Antelope
    should later fetch water in the fish-trap.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the house, mats are spread for the travelers in the guest-house, and mush
    and chicken are cooked in the evening.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Mr. Antelope tries to carry water in the fish-trap, but the water runs out
    each time, so he throws the fish-trap into the water angrily.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: While Mr. Antelope is away, Mr. Leopard eats the mush and leaves only a little
    for him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Mr. Leopard tells Mr. Antelope that fish-traps are not used for drawing water
    and says that dogs ate the mush.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Mr. Antelope eats the small portion left to him; afterward they have evening
    chat and sleep.
  category: sequence
  evidence_refs:
  - ev:10
