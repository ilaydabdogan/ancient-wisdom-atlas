canonical_text:
  quote: ''
  summary: 'Mr. Leopard invites Mr. Antelope to accompany him to his parents-in-law.
    Along the road Leopard repeatedly gives Antelope misleading instructions: to gather
    biting ants as a wife’s girdle, to harvest unripe produce while Leopard takes
    ripe produce, and later to fetch water in a fish-trap. Antelope obeys, suffers
    or fails, and Leopard laughs at him and eats most of the food while Antelope is
    away.'
  language: English
  quote_policy: summarized
