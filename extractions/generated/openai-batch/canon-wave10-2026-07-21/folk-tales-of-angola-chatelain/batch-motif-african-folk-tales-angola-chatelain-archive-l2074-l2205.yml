canonical_text:
  quote: ''
  summary: A named lady, Ngana Fenda Maria, hears from a shepherd that Ngana Vidiji
    Milanda has been bewitched and can be revived by a long journey and by filling
    jugs with tears. She travels, weeps, buys a slave named Kamasoxi with a jug of
    tears, and asks the slave to finish weeping while she rests. When Vidiji Milanda
    wakes, Kamasoxi claims to be his wife, and Fenda Maria is reduced to the status
    of a slave called Kamaria. Later, when Vidiji Milanda travels to Portugal and
    asks what gifts to bring, Kamaria requests self-acting objects and a truth-speaking
    stone. At night she uses the objects and recounts the true story, invoking them
    to cut her to pieces if she lies.
  language: English
  quote_policy: summarized
