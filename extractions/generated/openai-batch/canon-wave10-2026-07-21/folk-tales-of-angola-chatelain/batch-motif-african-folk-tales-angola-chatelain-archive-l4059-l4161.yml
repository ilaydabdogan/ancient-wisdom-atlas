canonical_text:
  quote: ''
  summary: The girls delay the Ma-kishi, plan a nighttime escape, and flee by moonlight
    with their little sister. A full river blocks them, so they climb a large tree.
    The Ma-kishi burn the empty house expecting to find the girls as meat, discover
    they are gone, track them to the river, and begin cutting down the tree. The girls
    sing to the hatchet and ask a circling Hawk to save them, promising payment; the
    Hawk agrees and begins carrying them to the other side.
  language: English with Kimbundu fragments
  quote_policy: summarized
