canonical_text:
  quote: ''
  summary: Na Nzua travels through the bush with animals, slaves, and goods. He encounters
    a vast assembly of animals gathered around a killed deer that no one can divide
    equally. The animals require him to divide food until he has killed and distributed
    his dog, bulls, and slaves, leaving only himself. The animals then summon him
    one by one, spit into his opened mouth, and teach him Teleji formulas to speak
    in distress. After leaving alone, he uses the formulas to become a hawk, return
    to human form, become a njinji, catch two cocks near a village, escape pursuit,
    and become a man again.
  language: English translation with embedded Ki-mbundu fragments
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Na Nzua sets out with things given to him, rides a bull, and is followed by
    slaves through grass, bush, and around rivers for several days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the fifth day he reaches an open circle of a tree where game, insects,
    water beasts, and birds are gathered because a deer has been killed and cannot
    be divided among them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The animals tell Na Nzua to divide the deer so that all may eat equally, but
    the deer is exhausted before the crowd has been supplied.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Na Nzua kills and distributes his male dog, bulls, and slaves; even hair and
    small bones are given out, and he is left alone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The animals say they are satisfied after the distribution, noting that only
    Na Nzua remains.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Several named animals summon Na Nzua, tell him to open his mouth, spit into
    it, and give him Teleji phrases to speak when distress or hardship presses him.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: All the beasts and insects do the same and then tell Na Nzua to go.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Na Nzua leaves alone with his staff; when his feet hurt, he speaks the hawk
    formula and becomes a hawk moving through the sky.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: When hungry near a camp, Na Nzua speaks a formula to become a man, then speaks
    the njinji formula, becomes a njinji, and catches two cocks near a village.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: People hear the fowls shrieking, chase the njinji, abandon the chase, and
    Na Nzua speaks the man formula again, becomes a man, ties the two cocks together,
    and hangs them on his staff.
  category: sequence
  evidence_refs:
  - ev:10
