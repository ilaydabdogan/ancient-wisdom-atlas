canonical_text:
  quote: ''
  summary: Kamaria, also called Fenda Maria or Nga Maria, flees into the forest, nurses
    an old leprous woman, and receives boxes of wealth and magical provisions. She
    visits the Ma-kishi of Lumba, whose diviners announce her arrival, and is hosted
    with magical furnishings and additional boxes. Longing for her elder brother Nga
    Nzua, she returns to his house, where she is seized and flogged while he remains
    silent. She secretly uses her box to produce splendid clothing, attendants, a
    carriage, music, and a chair, appears at church as a beautiful white lady unrecognized
    by Nzuana and Nzua, and then makes the things return into the box. The Lord Governor
    issues a proclamation rewarding anyone who can show him the white lady or remove
    a shoe from her foot.
  language: English
  quote_policy: summarized
