  quote: ''
  summary: Mr. Elephant and Mr. Frog court at the same house. Frog tells Elephant's
    sweetheart that Elephant is his horse, denies the claim when challenged, then
    persuades Elephant on the way to the sweetheart's house to carry him, let his
    mouth be bound with cords, and allow Frog to carry a twig. When they arrive, the
    girls declare that Elephant is indeed Frog's horse.
  language: English, with Kimbundu headings
