canonical_text:
  quote: "“Thou didst fool Antelope, Whether also Monkey?”"
  summary: In the tale of Leopard and Monkey, Leopard travels with Monkey to visit
    his parents-in-law and repeatedly tests or tries to deceive him. Monkey recognizes
    biting ants, gathers good crops despite Leopard's instructions, refuses to draw
    water with a fish-trap, and prevents Leopard from smearing him with goat blood.
    Monkey publicly exposes Leopard, whose in-laws kill and skin him. Monkey returns
    home with Leopard's leg as meat, deceives Leopard's wife about its origin, and
    later reveals that she has eaten her husband's leg.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Mr. Leopard tells Monkey they will go to visit Leopard's parents-in-law, and
    they start together.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the road, Leopard twice commands Monkey to pick up the “girdle of our wife”
    when they encounter driver-ants and red ants; Monkey answers that the ants bite.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Monkey refuses the ant commands, Leopard laughs and calls Monkey shrewd.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a field said to belong to others, Leopard tells Monkey to gather green
    egg-plants and unripe cassada, but Monkey gathers ripe egg-plants and large cassada;
    Leopard does the same, and they eat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At a river they drink water, and Leopard tells Monkey that later he must fetch
    water in a gourd, while showing him a fish-trap.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Near the house of Leopard's parents-in-law, Leopard tells Monkey to hang their
    ngolamata on a staff, and Monkey does so.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the guest-house, Leopard orders Monkey to fetch water; Monkey returns and
    says the object is a fish-trap and will not dip water.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The house-people tell Leopard that the boy he brought is shrewd.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: At night, Leopard kills a goat, lets its blood run into a piece of gourd,
    and tries to pour the blood over Monkey.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Monkey pushes Leopard's hand back, so the blood spills on Leopard himself.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the morning, Monkey takes Leopard's banjo and sings that Leopard fooled
    Antelope, asking whether he also fooled Monkey.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The house-people find Leopard covered up in bed with his head ugly with blood,
    and they find that one of the goats has been killed.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: Monkey says that Leopard fooled Antelope and also wanted to fool him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Leopard's parents-in-law kill Leopard, call him a wild beast, tell Monkey
    he shall marry the girl, skin Leopard, and give Monkey a leg.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Monkey returns home with a boy carrying Leopard's leg and tells Leopard's
    household that Leopard went to recover a debt and gave them the meat.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: Leopard's wife cooks and serves the meat; a child says it smells like father,
    and the woman beats the child.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: Monkey climbs a tree, tells Leopard's wife that she has eaten her lord's leg,
    runs into the bush, and the wife cries and they wail the funeral.
  category: sequence
  evidence_refs:
  - ev:12
