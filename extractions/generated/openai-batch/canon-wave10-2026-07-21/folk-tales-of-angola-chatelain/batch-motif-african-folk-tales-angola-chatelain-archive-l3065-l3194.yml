canonical_text:
  quote: ''
  summary: A little bird in Na Maria's house repeatedly uses the word “Teleji” to
    become an ant and then a man who eats the food set on the table. Servant girls
    discover the transformed man, and Na Maria recognizes him as Na Nzua dia Kimanaueze.
    Na Nzua seeks to marry Na Maria, but the Lord Governor requires him to fetch another
    daughter who was carried off to Portugal. Na Nzua transforms into hawk and eagle
    forms, finds the young woman by the sign of throwing ashes on a refuse heap, carries
    her back to Loanda, and receives the promised governorship. He and Na Maria live
    together.
  language: English
  quote_policy: summarized
