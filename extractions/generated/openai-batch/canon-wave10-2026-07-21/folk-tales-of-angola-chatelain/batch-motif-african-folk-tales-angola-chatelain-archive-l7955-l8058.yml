canonical_text:
  quote: ''
  summary: A young man pledged into bondship by his uncle remains unredeemed after
    his relatives die. In dreams, the River tells him to go early to the landing and
    choose among three floating things, identifying the basket as best. He takes the
    small basket, finds medicine-things in it, and receives further instruction in
    dreams about medicinal plants and cures. He then cures patients, receives heifers
    as payment, and becomes known as a true doctor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man is given as a pledge by his uncle for an ox; after his uncle,
    father, and relatives die, no one redeems him from bondship.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In bondship, the young man hoes, cuts wood, gets water, is beaten, is not
    properly clothed, and cries in the bush over lacking a redeeming relative.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The River speaks to him in a dream, telling him to go early to the landing
    and choose among three things, with the ngonga-basket described as the best.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After he does not go, the River appears again in a dream and asks why he failed
    to go to the landing as instructed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At dawn, before others are awake, the young man goes to the landing and stands
    by the water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A bundle of guns and two bales of cotton cloth come on top of the water and
    pass by; a small basket comes to where he stands and stops.
