  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The basket contains complete medicine-things.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: In sleep, the young man is shown medicinal plants and methods for treating
    diseases, sores, and chiefs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Two persons come seeking a doctor; the young man asks what sickness is involved
    and requests a calling-fee.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The master of bondship doubts the young man’s knowledge and tells the visitors
    to beat him if he does not master the cure.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: At the patient’s house, the young man says he can cure him and doctors him
    every day; when the cure fails him, he is shown help in sleep.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After twenty days the patient is safe, and the young man receives a heifer
