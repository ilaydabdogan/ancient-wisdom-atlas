canonical_text:
  quote: ''
  summary: 'Editorial notes explain Kimbundu words, social terms, objects, landscape
    features, and comparisons: a proverb about liberality, wood gathering, the canoe-shaped
    vessel ngamela and miniature canoe charms consecrated to the river spirit Ngiji
    for breeding, river landing places made safer from crocodiles, the Mulemba tree,
    the interjection aiue, terms for wives in polygamous households, and the status
    term u-ngana.'
  language: English with Kimbundu terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note says the governor refuses a present and explains that generosity
    is considered becoming for the white man, citing a proverb that fame comes from
    liberality rather than whiteness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ku-xanga is explained as a sequence of going to the bush, cutting wood, binding
    it into a bundle, and carrying it home; the task is described as laborious because
    of poor cutting tools.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ngamela is described as a smaller, sometimes shallow, canoe-shaped wooden
    vessel used for washing clothes, feeding pigs, carrying fish, and holding various
    things.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Very small canoe imitations are described as medicinal charms consecrated
    to the spirit Ngiji, identified with River, for breeding in cases of barren or
    not sufficiently prolific women.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tabu is described as a cleared place on the edge of a river or lagoon where
    canoes can land and women can bail water and wash; such places are relatively
    safer because crocodiles in tall grass may be detected before striking.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mulemba is identified as Ficus psilopoga, a shade tree that thrives in dry
    sandy soil and is said to be much like the banyan-tree of India.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Aiue is described as an interjection of pain, sorrow, or mourning, comparable
    to German “ach,” and not as a threat.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The notes distinguish a slave-wife, free wife, first or head-wife, later wives,
    and titles within a polygamist household; the first wife has authority over the
    others.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: U-ngana is explained as the quality or office of being a free person with
    authority, with extended meanings including chiefship, honor, glory, freedom,
    kingdom, reign, government, and body politic.
  category: attribute
  evidence_refs:
  - ev:8
