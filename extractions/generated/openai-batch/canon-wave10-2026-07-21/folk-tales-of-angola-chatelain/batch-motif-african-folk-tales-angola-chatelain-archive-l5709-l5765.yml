canonical_text:
  quote: "“Thou, Nianga, art unwise. Mr. Leopard is a wild beast, he is wont to catch
    people.”"
  summary: Nianga dia Ngenga goes hunting and returns without game. He finds Leopard
    stuck in the fork of a tree, frees him, and gives him two dogs and a cartridge-box
    to eat. Leopard still demands more. Hare arrives, has Leopard return to the tree
    so he can see the situation, then tells Nianga that Leopard would have devoured
    him and advises him to shoot. Nianga shoots Leopard.
  language: English
  quote_policy: quoted
