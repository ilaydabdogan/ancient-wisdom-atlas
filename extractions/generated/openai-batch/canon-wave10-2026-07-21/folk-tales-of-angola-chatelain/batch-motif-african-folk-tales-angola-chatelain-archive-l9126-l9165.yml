canonical_text:
  quote: ''
  summary: 'Editorial notes explain Ki-mbundu expressions and performance conventions:
    an answer of “no” to “where?” can deny an implied accusation about a key; pi means
    silence or hush; an imperative meaning “laugh ye” marks audience reaction and
    storyteller concurrence; a verb means charred or burnt; anointing oneself with
    charcoal of burnt flesh or bone is described as a protective African custom; marriage
    terms distinguish Christian and native forms; a Ki-mbundu saying denotes plenty
    and happiness; and a customary closing formula invites audience judgment of the
    tale.'
  language: English with Ki-mbundu lexical items
