canonical_text:
  quote: ''
  summary: A pregnant woman longs only for fish. Her husband catches a large speaking
    fish after a voice from under the water tells him to wait and then pull. The fish
    sings while being scaled and cooked. The woman eats it alone after others refuse.
    The fish speaks from inside her belly, rejects exits through her feet and mouth,
    then exits through her middle; the woman bursts and the fish goes away.
  language: English
  quote_policy: summarized
