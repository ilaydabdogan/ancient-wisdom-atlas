  summary: 'The passage consists of explanatory notes on Kimbundu words, idioms, loanwords,
    social practices, objects, and cultural references: tobacco as something ''drunk,''
    terms for buildings and cleared spaces, water vessels, slave naming practices,
    the word diabu for bad spirit or insult, children''s dolls and imitated childbirth
    rites, and fictitious objects with supposed magic powers.'
