canonical_text:
  quote: ''
  summary: King Kitamba kia Xiba mourns the death of his head-wife Queen Muhongo and
    forbids ordinary village noise and work unless she is fetched back. The head-men
    summon a medicine-man, who enters a grave at a fireplace with his child and travels
    by a road to Kalunga-ngombe's place. He finds Queen Muhongo, receives her arm-ring
    as proof, is warned not to eat there, and returns through the fireplace. The king
    accepts the report, resumes eating and drinking, and dies after some years.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Kitamba kia Xiba is described as a chief at Kasanji whose head-wife,
    Queen Muhongo, dies and is buried.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the funeral mourning, the king declares that he will continue mourning
    and that no one in the village shall shout, pound, or speak; he also says he will
    not eat, drink, or speak unless Queen Muhongo is brought to him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The head-men consult and summon a medicine-man to fetch the head-queen from
    Kalunga so that the people may rejoice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The medicine-man gathers herbs, sets a medicine-mortar outside, has the king
    and the people wash, and orders a grave dug in his guest-hut at the fireplace.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The medicine-man enters the grave with his little child, instructs his wife
    to keep putting water on the fireplace every day, and is covered and tamped down
    under the fireplace with the child.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Inside the grave a large road opens; the medicine-man and child travel along
    it and arrive at Kalunga-ngombe's village, where Queen Muhongo is sewing a basket.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Queen Muhongo identifies Lord Kalunga-ngombe as one who consumes them all
    and identifies a chained figure who looks like King Kitamba as King Kitamba, saying
    the chief will die after some years.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Queen Muhongo says that those who come to Kalunga do not return, gives the
    medicine-man her buried arm-ring as proof, warns him not to tell the chief that
    he was already found in Kalunga, and says eating there would prevent return.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The fireplace cracks, the medicine-man emerges, pulls out the child, and the
    child faints after seeing the sun; the medicine-man gathers herbs, washes the
    child, and the child comes to.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The medicine-man reports to the head-men, is paid two slaves, and the head-men
    present the arm-ring to the king, who recognizes it as true; after some days the
    king eats and drinks again, and after some years he dies.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
