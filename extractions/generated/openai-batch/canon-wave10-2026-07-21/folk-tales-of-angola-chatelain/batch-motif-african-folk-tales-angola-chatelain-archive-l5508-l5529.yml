  quote: ''
  summary: A woman turns into a lioness and tries to catch Kimona-ngombe. Kimona-ngombe
    believes Ndala's warning, removes Ndala by night to his mother's house, and summons
    the village and his slaves to burn the house. The woman is killed in the burning
    house. The closing statement says that Ndala, Kimona-ngombe's child, saved his
    life.
