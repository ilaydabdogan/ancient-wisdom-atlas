canonical_text:
  quote: ''
  summary: A traveler repeatedly uses a spoken formula to change form. After eating
    at camps, he becomes a wolf and steals suckling pigs, later becomes a man again
    and carries the meat. Villagers suspect him and armed men confront him; he becomes
    a young lion and scatters them. Perplexed about going to Loanda without kin or
    friends, he becomes a hawk, then a unique little bird with gold-like wings and
    bill. Na Maria, daughter of the Lord Governor, sees, admires, catches, cages,
    and shows the bird to her father; the bird refuses food.
  language: English translation with brief Ki-mbundu fragments
  quote_policy: summarized
