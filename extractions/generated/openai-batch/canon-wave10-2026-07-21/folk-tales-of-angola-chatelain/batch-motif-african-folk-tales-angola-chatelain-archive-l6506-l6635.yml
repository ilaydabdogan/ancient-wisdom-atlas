canonical_text:
  quote: ''
  summary: In a famine, Mr. Leopard's ripe muzondo is eaten by Monkey and Hare. Leopard
    consults an old charm-maker, first using pits and later carved, adorned girl-images
    as traps. The pit plan fails; Monkey and Hare escape. They later bring food to
    the silent images and leave; Leopard eats the food and hides again. The supplied
    passage ends before a final resolution.
  language: English with Kimbundu title and fragments
  quote_policy: summarized
