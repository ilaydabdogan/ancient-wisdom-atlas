canonical_text:
  quote: "“I, foolishness has killed me; thou, smartness has killed thee.”"
  summary: A young man finds a skull on a path and strikes it, saying foolishness
    killed it. The skull replies that foolishness killed it, but smartness will soon
    kill him. The young man reports the speaking skull to others and stakes his own
    head on proving it. When the crowd returns with him, the skull remains silent,
    so they behead him. Afterward the skull speaks again, and the people realize they
    killed him unjustly. The closing moral says wits and foolishness are equal, and
    the young man's wits killed him.
  language: English
  quote_policy: quoted
