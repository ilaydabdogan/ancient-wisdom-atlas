  quote: ''
  summary: Editorial and comparative notes for No. XII describe its Mbaka dialect
    and Mbamba origin; compare a fratricide revealed by reviving animal witnesses
    with Sechuana and Sierra Leone variants; note an accidental resemblance to Cain
    and Abel; discuss conscience and punishment in a related Ki-mbundu story; and
    classify surrounding tales as Bantu animal stories. Lexical notes identify Ngunga
    and mutelembe as bells and explain a verb of setting out with a load.
  language: English
  quote_policy: summarized
