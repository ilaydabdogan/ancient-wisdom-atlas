canonical_text:
  quote: ''
  summary: A beautiful woman named Ngana Fenda Maria has a still more beautiful daughter
    of the same name. A speaking mirror reveals the daughter's superior beauty, and
    the mother confines the daughter with a nurse. After a sugar-cane incident, a
    passerby tells the daughter of the even more beautiful Fele Milanda, hidden by
    demons in Ikandu. The daughter leaves at night to seek him. On the road she aids
    two afflicted old women, receiving instructions about passing dangerous beasts,
    taking twelve keys from a lion's mouth, filling twelve jugs, and thereby reviving
    Fele Milanda.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mother named Ngana Fenda Maria has a daughter also named Ngana Fenda Maria;
    the daughter is described as more beautiful than the mother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother obtains a speaking mirror from Portugal and repeatedly asks it
    whether she is beautiful.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the daughter enters the mirror room and looks at herself, the mirror
    tells the mother that the daughter surpasses her in beauty.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mother says the daughter may take the men from her, then has a house made,
    places the daughter and nurse inside, blocks doors and windows, and leaves only
    a small hole for food and water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The daughter craves sugar-cane; a hole is made in the wall so the nurse can
    go buy it, and while eating it the daughter cuts her finger with a knife.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The daughter declares that her blood is beautiful like her face; a passing
    young man answers that Fele Milanda is so beautiful that demons have hidden him
    in Ikandu.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: After hearing about Fele Milanda, the daughter stops eating, gathers her belongings
    in her kalubungu, has the nurse buy kola-nuts and ginger, and leaves at night
    for Fele Milanda.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: After ten months of walking, the daughter meets an old woman with leprosy,
    washes and treats her wounds, cooks fish and mush for her, and receives instructions.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The first old woman says the daughter has two months left to travel and instructs
    her not to fear lions, leopards, elephants, and other wild beasts sleeping at
    the door.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The first old woman instructs the daughter to take twelve keys from the mouth
    of a great lion, use them for twelve rooms, bring up twelve jugs, and cry and
    fan until the twelfth jug overflows, after which Fele Milanda will revive.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: The daughter meets a second old woman with one arm, one leg, and one side
    of face and body; she helps the old woman pound and sift cassava, receives thanks,
    and is given the same instructions as before.
  category: sequence
  evidence_refs:
  - ev:11
