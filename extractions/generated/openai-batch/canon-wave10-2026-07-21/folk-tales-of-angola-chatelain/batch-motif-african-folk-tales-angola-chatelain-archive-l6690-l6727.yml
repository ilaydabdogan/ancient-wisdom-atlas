  summary: In the concluding episode, Monkey causes Leopard to stir boiling mush with
    his hands; Leopard is injured, Monkey and Hare reveal that they have escaped him
    and flee, and the narrator explains the present sleeping habits of Monkey and
    Hare and the spots of Leopard.
