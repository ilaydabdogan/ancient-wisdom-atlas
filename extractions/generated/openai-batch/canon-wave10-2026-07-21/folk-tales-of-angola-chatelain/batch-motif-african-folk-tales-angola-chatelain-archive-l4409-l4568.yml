canonical_text:
  quote: ''
  summary: A man named Na Kimanaueze has four daughters, all by one mother, and each
    calls herself Uoua. A suitor, Na Nzua, comes for the eldest, but she requires
    that he marry all four sisters. The bridewealth is arranged with four cows, the
    brides are fetched and placed in separate houses, but the groom delays entering
    their houses out of shame because he has not yet provided them fine food. He goes
    hunting with a boy, traps forty rats, and orders them made into four bundles for
    his wives.
  language: English
  quote_policy: summarized
