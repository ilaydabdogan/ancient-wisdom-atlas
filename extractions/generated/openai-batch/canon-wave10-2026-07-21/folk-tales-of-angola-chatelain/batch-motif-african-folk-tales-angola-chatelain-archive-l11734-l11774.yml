canonical_text:
  quote: ''
  summary: The passage consists of editorial and comparative notes for tales XXXVI
    and XXXVII. It identifies Kiombo as a wild pig/warthog term and comments on pig
    coloration. For tale XXXVII it describes the tortoise or turtle as a shrewd animal
    prominent in Bantu folklore, says the turtle wins a dispute with the Partridge,
    cautions that turtles do not always survive prairie fires, lists comparative references,
    compares African turtle trick feats with Brazilian Jabuti tales including a bone-flute
    episode, and gives grammatical and lexical notes on the Partridge and horn terms.
  language: English
  quote_policy: summarized
