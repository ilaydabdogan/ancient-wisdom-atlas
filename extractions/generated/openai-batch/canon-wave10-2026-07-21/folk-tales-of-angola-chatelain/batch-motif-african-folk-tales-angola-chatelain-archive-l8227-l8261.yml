canonical_text:
  quote: ''
  summary: In a tale titled “A Father-in-Law and his Son-in-Law,” two men are contrasted
    after a deer chase connected with seeking a daughter in marriage. One man catches
    and binds the deer; the other gives up, saying the chase might cost his life and
    that he only accompanied his comrade. The aged men choose the man who gave up
    as their son-in-law, explaining that the successful deer-catcher is too quick
    to kill and too unwilling to heed advice or pleas, while the man who stopped would
    listen when they came to pacify him.
  language: English with Ki-mbundu title
  quote_policy: summarized
