canonical_text:
  quote: ''
  summary: 'The passage contains a brief account explaining why dogs came to live
    with people: Jackal sent Dog to fetch fire in the village, Dog found pleasing
    food there, and stayed. It then tells of Hog and his kinsman Boar in the forest.
    Hog decides to go to the village for human food despite Boar''s warning that people
    hate animals. In the village Hog is kept in a sty, breeds, and is then seized
    and killed; his squealing is interpreted as speech recalling Boar''s warning.
    The tale closes by explaining that hogs came to human habitations because people''s
    food is good.'
  language: English with Kimbundu headings/fragments
  quote_policy: summarized
