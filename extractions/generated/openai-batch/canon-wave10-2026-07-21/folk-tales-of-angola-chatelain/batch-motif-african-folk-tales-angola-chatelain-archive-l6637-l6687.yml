canonical_text:
  quote: ''
  summary: Hare and Monkey try to make the girls dance, but each becomes stuck to
    gum. Leopard captures them, beats them, puts them in a side-bag, and tells his
    wife they will be cooked. When Leopard leaves for a funeral, the captives deceive
    his wife into releasing them and giving them trunk keys. They dress as officers,
    go to the funeral, have Leopard bound by invoking the Lord Governor, accept offerings,
    make Leopard’s in-laws carry him home on a tree pole, and demand food from Leopard.
  language: English translation with a brief Kimbundu phrase at the end
  quote_policy: summarized
