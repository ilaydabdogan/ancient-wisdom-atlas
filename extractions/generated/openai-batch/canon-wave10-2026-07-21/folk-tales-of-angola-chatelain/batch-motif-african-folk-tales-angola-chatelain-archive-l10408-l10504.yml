  summary: Editorial notes identify the tale as Mbaka dialect but Mbamba story, compare
    the Ma-kishi to Ba-tua stripped of fabulous additions, classify the conclusion
    as aetiologic, and note that adults are saved through the obstinacy of an innocent
    child. Other notes explain language substitution for Ma-kishi/Ba-tua speech, the
    little girl's song, nocturnal entertainment, Ma-kishi concern about sick meat,
    the party's dispersal, a bosom-as-container image, and an appeal to Hawk for rescue
    in exchange for a reward.
