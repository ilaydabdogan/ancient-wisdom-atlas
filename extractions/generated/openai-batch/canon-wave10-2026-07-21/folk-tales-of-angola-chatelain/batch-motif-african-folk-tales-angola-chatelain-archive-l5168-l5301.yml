canonical_text:
  quote: ''
  summary: A young bride repeatedly cooks mush for her husband and four brothers-in-law,
    but the brothers-in-law refuse to eat unless she can tell their names. She does
    not know them. While she pounds mbombo at a mortar near a tree, a little bird
    sings that it will tell her the brothers-in-law's names and recites them, but
    she drives the bird away. The refusal of her food continues, and the bird appears
    again the next morning.
  language: English
  quote_policy: summarized
