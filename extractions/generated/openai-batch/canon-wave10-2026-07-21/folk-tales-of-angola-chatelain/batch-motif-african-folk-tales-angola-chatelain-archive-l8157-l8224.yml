canonical_text:
  quote: ''
  summary: An elderly father has one daughter, nga Samba, whom many men want to marry.
    He requires any suitor to bring him a living deer. Two men seek her; both go hunting,
    but one stops pursuing the deer while the other captures one alive. The father
    summons elders, explains that he wants a gentle-hearted son-in-law, and asks them
    to choose between the two suitors. The passage ends while the suitors are beginning
    to answer the elders' question.
  language: English
