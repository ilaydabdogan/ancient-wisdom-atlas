canonical_text:
  quote: ''
  summary: 'Editorial paratext for tale No. VIII identifies the informant and dialect,
    then gives comparative notes on the tale: a Ma-kishi king with more than one head,
    hunters, a swallowed hero, captive ladies and hidden treasures, a stratagem killing
    an old woman, parallels in Sechuana, Brazilian, and Portuguese folklore, and an
    analysis of the tale’s second part as combining a hydra element with an intending
    murderer dying by his own trick. Further notes explain terms and objects including
    a kisanji instrument, a pakasa buffalo, hunting from a tree, a pygmy associated
    with buffalo meat-loads, and a term for inner organs.'
  language: English
  quote_policy: summarized
