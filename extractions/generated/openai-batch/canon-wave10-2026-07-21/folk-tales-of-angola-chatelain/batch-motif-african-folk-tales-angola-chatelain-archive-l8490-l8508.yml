  quote: ''
  summary: Two men both call themselves Ndala, one identifying as the builder of ability
    and the other as the builder of haste. While traveling to trade, they encounter
    a storm and decide to build grass-huts. The builder of haste finishes quickly
    and enters his hut. The builder of ability builds carefully but is killed outside
    by the storm. The hasty builder survives because his completed hut shelters him.
