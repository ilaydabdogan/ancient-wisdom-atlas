canonical_text:
  quote: ''
  summary: The passage includes the heading “Lion and Wolf” and an animal-court episode.
    Deer brings Philantomba before Lord Elephant, who has him bound for passing without
    lowering his cap. Philantomba claims haste because his father is giving birth
    and his mother is away at war. Lord Lion, Lord Elephant, and the beasts reject
    the possibility of a male giving birth. Philantomba then asks about the lawsuit
    between Antelope and Leopard, and Elephant and Lion decide the goat-breeding dispute
    by the same principle that the male does not give birth.
  language: English translation with Ki-mbundu headings
  quote_policy: summarized
