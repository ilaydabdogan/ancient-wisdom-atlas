canonical_text:
  quote: ''
  summary: During dry-season prairie work, Samba remains behind digging for a rat.
    A Di-kishi finds her, takes her to the Ma-kishi, and marries her despite the Ma-kishi
    being described as man-eaters. After Samba bears three sons, the Ma-kishi plot
    to eat a child. Samba feigns illness, flees with her children and seeds, delays
    her pursuing husband by throwing down grain, crosses a full river that he cannot
    cross, and returns to her home village, where her kin receive her.
  language: English
  quote_policy: summarized
