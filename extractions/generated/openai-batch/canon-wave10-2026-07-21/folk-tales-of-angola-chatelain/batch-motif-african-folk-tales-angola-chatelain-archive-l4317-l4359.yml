canonical_text:
  quote: ''
  summary: A skull seeks to marry a younger daughter. The elder daughter fills the
    skull with ashes and throws it into a lagoon. Under water it becomes Kianda, asks
    the mother for the daughter, carries the young woman under water, adorns her,
    and gives wine and cloth to her mother. The couple lives together. The husband
    uses a kalubungu to produce slaves and houses. After their child dies, he forbids
    the wife’s mother to attend the funeral. She comes anyway, and he strikes the
    kalubungu again, after which the houses go back into it or into the named object
    as printed.
  language: English
  quote_policy: summarized
