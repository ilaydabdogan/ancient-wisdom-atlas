canonical_text:
  quote: ''
  summary: Antelope borrows Leopard's he-goat to breed with his she-goat under an
    agreement to return the he-goat and a young she-goat after three gestations. Leopard
    repeatedly refuses the return because he says he has no corral, then later demands
    a division when Antelope's herd has grown. Lord Elephant summons Antelope and
    the goats to court. Philantomba offers to plead for Antelope but is dismissed,
    then later passes the court wearing a cap and greeting from a distance, prompting
    Elephant to order Deer to catch him.
  language: English
  quote_policy: summarized
