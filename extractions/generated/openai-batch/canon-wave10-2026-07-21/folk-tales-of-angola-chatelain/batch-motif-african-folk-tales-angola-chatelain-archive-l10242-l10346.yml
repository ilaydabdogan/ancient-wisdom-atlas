- id: obs:3
  text: Kijandala-midi is glossed as a name meaning one who eats a thousand, with
    an accompanying statement that a hundred only rinse the mouth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kipalendes are described as not killed, but held on the ground by a stone
    too heavy to roll off.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sudika-mbimbi is said to have the gift of second sight.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
