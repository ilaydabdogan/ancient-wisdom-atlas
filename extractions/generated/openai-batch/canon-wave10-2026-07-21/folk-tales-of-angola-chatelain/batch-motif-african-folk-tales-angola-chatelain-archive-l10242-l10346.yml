canonical_text:
  quote: ''
  summary: 'Editorial notes explain Kimbundu terms and cultural objects, including
    house-building, landscape categories, mats, baskets, ants, fish, crocodiles, and
    several story-motif comments: a voracious named being, people held under a stone,
    second sight, saving as ''giving life,'' a half-person able to separate body parts,
    a narrow path and wide path with opposite outcomes, an Angolan Pluto with Cerberus,
    and a crocodile-catching episode involving Sudika-mbambi.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Native house-building is described as a sequence of cutting poles, erecting
    them, tying cross-poles, thatching the roof, and filling wall holes; wall poles
    require a deep foundation ditch.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The notes distinguish open tall-grass country from thick forest found along
    rivers, damp hollows, and moist slopes.
  category: setting
  evidence_refs:
