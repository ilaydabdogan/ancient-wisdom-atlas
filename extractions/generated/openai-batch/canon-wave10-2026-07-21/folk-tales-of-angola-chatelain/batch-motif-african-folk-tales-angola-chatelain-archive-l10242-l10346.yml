  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A half-person is described as one able to separate the upper part of the body
    from the part below the waist.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The editor explicitly compares the half-person to a halfwoman in No. I.
  category: relationship
  evidence_refs:
