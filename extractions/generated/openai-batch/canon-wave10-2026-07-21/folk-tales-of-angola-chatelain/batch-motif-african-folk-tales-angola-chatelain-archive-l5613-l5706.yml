canonical_text:
  quote: ''
  summary: A man catches a turtle and brings it to a village, where the people discuss
    ways to kill it. The turtle says that hatchets, stones, fire, and knives will
    not kill it, but pretends that being thrown into deep water will kill it. The
    people throw it into the river; it dives, emerges, swims, and sings that water
    is its home. The people realize they have been fooled, and the narrator explains
    this as the reason the turtle lives in water.
  language: English
