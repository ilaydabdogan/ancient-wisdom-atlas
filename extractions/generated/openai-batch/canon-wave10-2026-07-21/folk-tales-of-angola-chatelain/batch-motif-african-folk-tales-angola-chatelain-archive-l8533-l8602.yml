canonical_text:
  quote: ''
  summary: Ngunza Kilundu kia Ngunza learns through a dream and then from his mother
    that his younger brother Maka has died and that Ngana Kalunga-ngombe is named
    as the killer. Ngunza traps Kalunga-ngombe, who denies killing wantonly and tells
    him to fetch Maka from Kalunga. In Kalunga, dead people explain causes of their
    deaths, and Ngunza is sent to Milunga, where Maka refuses to return to earth because
    Kalunga is better. Ngunza departs with many seeds and plants given by Kalunga-ngombe
    for planting on earth. When Kalunga-ngombe later visits, Ngunza has fled east;
    after pursuit and a fragmentary final encounter, the text says this caused Ngunza
    to become a Kituta spirit.
  language: English with Kimbundu names and headings
  quote_policy: summarized
