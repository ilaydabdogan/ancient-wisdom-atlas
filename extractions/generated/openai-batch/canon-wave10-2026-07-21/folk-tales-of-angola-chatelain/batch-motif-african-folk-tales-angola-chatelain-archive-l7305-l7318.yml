  quote: ''
  summary: In the tale opening, Cock visits his friend Fox every day. During one visit,
    Fox asks whether the object in the middle of Cock's head can wound someone in
    a struggle. Cock says it is only flesh and cannot wound. Fox says he had feared
    being hurt by it, then Cock laughs, they play, Cock returns home, and Fox returns
    to his ant-hill.
