  summary: Two male friends discuss the danger of nearby lions. One says a lion cannot
    enter his house because he has a gun and spear, while the other doubts that a
    lion can be fought. Later the man with lion-man medicine goes at night to the
    doubting friend’s house, becomes a lion, roars, breaks into and destroys the house,
    throws the sleeping friend outside, then returns home and becomes a man again.
