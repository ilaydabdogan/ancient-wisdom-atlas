canonical_text:
  quote: ''
  summary: 'A father-in-law and son-in-law exchange indirect insults: the father-in-law
    compares darkness to a blind eye, offending the one-eyed son-in-law; later the
    son-in-law compares moonlight to a bald head, offending the bald father-in-law.
    The father-in-law summons elders to judge the insult. The son-in-law explains
    that he was answering an earlier insult. The elders say the father-in-law began
    the offense, advise reconciliation, call for rum, and the two remain friends.'
  language: English
  quote_policy: summarized
