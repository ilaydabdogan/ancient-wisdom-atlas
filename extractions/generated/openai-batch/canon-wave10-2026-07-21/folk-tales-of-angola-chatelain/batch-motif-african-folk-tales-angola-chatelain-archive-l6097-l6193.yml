canonical_text:
  quote: ''
  summary: Leopard asks Monkey to accompany him to Leopard's father-in-law. Along
    the road Leopard gives Monkey a series of impractical or misleading instructions
    involving driver-ants, corn, fire, sugar-cane, and a fish-trap for water; Monkey
    repeatedly resists or contradicts him. At the father-in-law's house they are received,
    fed, and join night-chat and dancing. During the night Leopard kills goats, collects
    blood in a pot, and tries to pour it on Monkey, but Monkey pushes him so the blood
    spills on Leopard. In the morning the father-in-law finds the goats killed; the
    passage then breaks off with Monkey entering the house.
  language: English
  quote_policy: summarized
