canonical_text:
  quote: ''
  summary: 'Editorial and comparative notes for Story No. III describe the informant
    Jeremias Alvares da Costa/Jelemfa dia Sabatelu, identify the story as Mbaka in
    dialect and origin, and summarize comparative features: Kimanaueze’s wife wants
    only fish and overtaxes the River’s kindness; animal metamorphoses occur; Kimanaueze’s
    son marries the Governor’s daughter; and parallels are drawn with Loanda, Temne,
    Zulu, Du Chaillu, and Portuguese tale materials. Lexical notes explain terms for
    a popular man/non-human spirit, marriage and household prosperity, the chief’s
    head-wife, fish as “water-meat,” fishing methods, and a narrative opening formula.'
  language: English
  quote_policy: summarized
