canonical_text:
  quote: ''
  summary: After the wives of Hunter and Deer each give birth, each newborn requires
    a particular first-food. Hunter waits in a mudia-mbambi tree to kill Deer for
    liver for his child, but Deer asks to be spared until it can take mudia-mbambi
    for its own child. Deer promises to return the next day to be shot. Hunter agrees.
    The next morning Deer returns, Hunter kills and skins it, and the liver is used
    for Hunter's child.
  language: English with Kimbundu title and terms
  quote_policy: summarized
