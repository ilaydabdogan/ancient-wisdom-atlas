canonical_text:
  quote: ''
  summary: Fenda Maria recounts weeping measured jugs of tears to awaken the bewitched
    Vidiji Milanda, buying Kamasoxi with tears, and instructing her not to claim the
    wife's place. Kamasoxi answers Vidiji as if she were his wife. Fenda invokes self-acting
    objects and a truth-speaking stone; the objects act and the stone speaks truth.
    Vidiji and Fenda faint and are revived by an old woman. Vidiji orders Kamasoxi
    punished in a barrel of coal-tar, and a bone from the barrel becomes white clay
    for the couple to smear themselves.
  language: English
  quote_policy: summarized
