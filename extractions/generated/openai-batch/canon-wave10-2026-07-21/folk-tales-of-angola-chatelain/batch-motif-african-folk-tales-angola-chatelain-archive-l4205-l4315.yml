canonical_text:
  quote: ''
  summary: A woman’s children grow up after their father dies. Two elder children
    take up hunting, enter a Ma-kishi house during rain, fight Ma-kishi beings and
    their chief, use a fish transformation to recover keys from inside the chief,
    open rooms containing captives, and settle there. In a later episode, the mother
    is in another country with two little children; those children wander to an old
    woman’s house, and the elder receives instructions from the deceased father to
    kill the old woman with boiling water before taking money and returning to the
    mother.
  language: English
  quote_policy: summarized
