canonical_text:
  quote: ''
  summary: In a brief tale titled “The Past and the Future,” two men meet a palm-wine
    tapper while walking on a road. The tapper demands their names before giving palm-wine.
    One man names himself “Whence-we-come,” and the other “Where-we-go.” A dispute
    follows, and an adjudicator declares Where-we-go right, reasoning that nothing
    more can be obtained from where one has already left; what will be found lies
    where one is going.
