canonical_text:
  quote: ''
  summary: Editorial notes define Kimbundu and Mbaka terms and customs, including
    meanings of mbanza, Kiximbi, Kalunga, formal approach to a chief, prayer/speech
    closure, royal offices, seating rank, childbirth in the bush, and a tree-location
    idiom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mbanza is defined as the chief's residence or court, also as the capital village,
    and in many inland dialects as the chief himself.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kiximbi is described as a spirit or genius, masculine or feminine, who is
    lord of a river or lagoon; in Loanda the same genius is called Ki-anda or Ki-tuta.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A subject or stranger approaching a chief sits on the ground, lies flat on
    the back, bows forward, and touches the ground with the chin; some groups also
    rub dust on chest and chin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kalunga is defined with several meanings, including death, personified death
    as king of the nether world, the world of shades, the ocean, an interjection of
    wonder, and a respectful title.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mahezu is described as an amen-like word placed after prayer or at the full
    stop of speech, answered by the phrase a Nzambi, meaning of God.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ngolambole means Lord of the hunt and is the title of the chief's prime minister
    and possible successor if he has royal blood; elders form a legislative council,
    while the king and cabinet exercise executive power.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'Seating is ranked: chiefs and certain Mbaka men may sit on European chairs,
    elders on native stools, and plebeians and slaves on mats or bare ground.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: When a woman is going to give birth, she generally goes into the bush with
    female assistants and delivers out of sight of men.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The phrase bu kota dia muxi is glossed as at the foot of a tree, meaning the
    space and ground around the tree as far as its shade reaches when the sun is high.
  category: setting
  evidence_refs:
  - ev:9
