canonical_text:
  quote: ''
  summary: 'Opening episode of an animal tale in English translation: Leopard takes
    Antelope, described as his grandson, to visit Leopard''s father-in-law. Antelope
    carries three demijohns of rum. Along the road Leopard repeatedly gives Antelope
    instructions that lead to harm or loss, while Leopard benefits or avoids the harm.
    Antelope is bitten by driver-ants, wounds his mouth on wild cane, fails to roast
    maize properly, is beaten after repeating an insulting greeting to women, and
    breaks one rum demijohn at a brook. The pair arrives at the father-in-law''s house
    with two bottles remaining and receives hospitality.'
  language: English
  quote_policy: summarized
