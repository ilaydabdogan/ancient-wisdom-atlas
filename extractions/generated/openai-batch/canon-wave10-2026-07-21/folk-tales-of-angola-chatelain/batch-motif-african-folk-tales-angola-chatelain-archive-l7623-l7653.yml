  quote: "“I am in trouble !”"
  summary: Frog Kumboto has two wives housed in opposite directions while he stays
    in the middle. Both wives cook mush and send messengers for him at the same time.
    Unable to decide which wife to visit first without offending the other, Frog sings
    that he is in trouble; the tale explains that what people hear as frog-croaking
    is actually this speech.
