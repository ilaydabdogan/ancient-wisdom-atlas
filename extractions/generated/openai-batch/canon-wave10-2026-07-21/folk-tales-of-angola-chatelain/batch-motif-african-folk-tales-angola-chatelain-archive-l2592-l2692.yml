canonical_text:
  quote: ''
  summary: Ngana Fenda Maria appears publicly at church and later at the Governor's
    palace in high-status dress, using a box that produces chairs, carriage-related
    display, and later houses and wealth. The Governor investigates her brother, who
    says she is his sister; Maria says she has been made his slave. After a confrontation,
    the brother is jailed briefly, reflects that a woman beguiled him into causing
    Maria's slavery, and is released. Maria asks the Governor to let her and her elder
    brother live together, and then creates a house, servants, livestock, nurses,
    cloth, and money from the box for her brother. The tale ends with the siblings
    living on together.
  language: English
  quote_policy: summarized
