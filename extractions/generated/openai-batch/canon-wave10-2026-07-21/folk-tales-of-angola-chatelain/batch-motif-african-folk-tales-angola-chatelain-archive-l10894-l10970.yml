canonical_text:
  quote: ''
  summary: Editorial and comparative notes identify No. XIV as Mbaka dialect with
    Songo tribal and song material, compare bridal customs, and state that birds commonly
    reveal, warn, or incite by worded song in folklore. Notes then explain terms and
    song dialect features. For No. XV, the notes state that the tale comes from Ambaca,
    compare lion-human metamorphoses in African folklore, mention transformed lion
    suitors marrying girls in a Herero example, compare a father saved by a child's
    obstinacy with another tale, and compare killing an enemy in a burning hut with
    other narratives. Later notes discuss idioms, parental leniency toward a crying
    child, a proverb about children as blessings, and broad editorial comparisons
    involving women and child-saviors.
  language: English
