canonical_text:
  quote: ''
  summary: Blacksmith brings a debt dispute against the Blackbirds before Na Katete.
    The Blackbirds deny owing him and demand that he identify the individual debtor.
    Na Katete cannot decide. Turtle-dove arrives, asks about the dispute, thinks,
    leaves and returns, then tells Blacksmith to bind particular birds. The bound
    birds confess or point toward the debtor, payment is made, and the narrator explains
    that Dove's cooing is really her judging Blacksmith's case.
  language: English
