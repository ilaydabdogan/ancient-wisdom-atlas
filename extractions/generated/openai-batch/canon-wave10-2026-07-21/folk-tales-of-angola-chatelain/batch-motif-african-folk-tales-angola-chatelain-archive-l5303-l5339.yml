canonical_text:
  quote: ''
  summary: A woman preparing food learns from a little bird the names of her husband's
    four brothers. When the brothers-in-law say they will eat her mush only if she
    tells their names, she recites the four names. They laugh, accept the food, and
    eat. A closing summary states that the wife had not known the brothers' names
    until the little bird told her while she went to pound.
  language: English with Kimbundu title and names
