canonical_text:
  quote: ''
  summary: Fele Milanda recounts the events to his friends, summons Fenda Maria, and
    asks her for a key. Fenda Maria first refers the matter to Kamasoxi, then produces
    the key and tells what happened with Kamasoxi and how she rescued Fele Milanda
    from Ikandu. Kamasoxi is publicly shamed and burned in a barrel of coal-tar; a
    small bone from her falls on Fenda Maria. Fenda Maria rubs herself with it, marries
    Fele Milanda, travels with him to Portugal to visit his kinsmen, and returns.
    The tale closes with a formulaic ending.
  language: English literal translation from Ki-mbundu
  quote_policy: summarized
