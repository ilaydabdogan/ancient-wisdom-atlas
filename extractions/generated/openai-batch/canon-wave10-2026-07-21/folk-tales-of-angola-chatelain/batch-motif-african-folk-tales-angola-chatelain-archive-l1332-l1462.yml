- id: obs:7
  text: The syllabization rules given are that all syllables are open, m- and n- are
    pronounced with the following letter, and every syllable has only one vowel though
    it may contain a preceding semivowel.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The general rule for tonic accent is that it rests on the penult; exceptions
    are indicated by an acute accent.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that final-syllable accent in a genuine Ki-mbundu word
