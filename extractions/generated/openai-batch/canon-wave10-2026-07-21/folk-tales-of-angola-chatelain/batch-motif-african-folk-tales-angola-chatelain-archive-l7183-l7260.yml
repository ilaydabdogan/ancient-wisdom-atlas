canonical_text:
  quote: ''
  summary: Fox and Mole become eating companions. Fox regularly catches fowls, while
    Mole carries off flour from the women’s pounding-place. After food is cooked and
    left in the house, bathing at the river gives Mole the chance to use his tunnel
    from river to house, eat the shared food, return through the tunnel, and deny
    knowing who ate it. The same pattern is repeated, and Fox complains that the victuals
    are again gone.
  language: English
  quote_policy: summarized
