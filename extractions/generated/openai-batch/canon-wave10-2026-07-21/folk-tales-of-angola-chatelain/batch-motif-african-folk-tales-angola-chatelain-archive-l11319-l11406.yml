  summary: Editorial and ethnographic notes for No. XXII identify the tale as aetiological
    because its conclusion explains Monkey and Hare habits and Leopard spots; compare
    Leopard tree-traps, gum-covered dolls, safe-distance revelation of mischief, and
    animal marking episodes with Kafir, Hausa, African American, Brazilian, and Portuguese
    tale materials; and define several Ki-mbundu terms and cultural practices.
  language: English
  quote_policy: summarized
