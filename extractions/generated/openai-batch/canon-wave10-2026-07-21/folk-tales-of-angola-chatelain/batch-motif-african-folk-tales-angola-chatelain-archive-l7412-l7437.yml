  summary: Mr. Dog is to be invested with kingship. Royal objects are gathered, headmen
    and musicians attend, and a ceremonial seating place is prepared. During the distribution
    of food, Dog steals the breast of a fowl and runs into the bush. Because of this
    thievery, he loses the kingship.
