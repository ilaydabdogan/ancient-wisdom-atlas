  summary: Dog and Lizard are friends. Lizard says that dogs, being with men and hunting
    game, must eat much meat. Dog says dogs do not often eat meat and tells Lizard
    to watch from a tree when game is divided. After a hunt, Dog lifts a small bit
    of meat and is clubbed; Lizard nods that Dog’s statement was true.
