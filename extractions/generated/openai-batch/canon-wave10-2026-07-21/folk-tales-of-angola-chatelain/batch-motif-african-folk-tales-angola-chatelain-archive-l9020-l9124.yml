canonical_text:
  quote: ''
  summary: Editorial notes explain Ki-mbundu grammar and loanwords, the social meaning
    of mundele, the sandu namesake relationship combining Catholic saint-day naming
    with spirit-associated birth naming, and a practice of seeking redress through
    judges, chiefs, or spirits and their mediums, including a distinction between
    lawful spirit-mediated self-defense and forbidden witchcraft.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note on mundele says the term originally means white or light-colored
    but may be used respectfully for light mulattoes and even blacks who dress in
    European style; Fenda Maria is specifically said to be a mulatto, not a white
    woman.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note on sandu says Catholic saint-day naming is combined with native naming
    after a di-hamba or di-bamba spirit to whose influence a birth is ascribed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The note states that children born under the same spirit are considered related
    in that spirit, and that two namesakes are morally bound to treat one another
    as brothers or cousins.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The note states that a person who has suffered wrong may lodge a complaint
    before a chosen judge, before a chief, or may resort to spirits for redress and
    punishment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The spirit case may be laid before a person possessed by a spirit, through
    whom the matter is presented to the spirit represented by that medium.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The spirit may be asked to restore a stolen object, compel a debtor to pay,
