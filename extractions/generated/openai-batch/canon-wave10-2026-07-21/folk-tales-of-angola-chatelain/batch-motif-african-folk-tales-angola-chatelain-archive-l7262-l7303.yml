canonical_text:
  quote: ''
  summary: In an animal tale, Fox plans to catch a fowl, while Mole goes out earlier.
    Fox suspects Mole may be eating the victuals, finds Mole’s underground route from
    the house to the river, and sets a trap in the tunnel. Fox catches a cock, and
    the companions cook. When they go to bathe, Mole dives under the water, enters
    his tunnel, and dies in the trap near the house. Fox returns, finds Mole dead,
    says Mole had been eating his fowls, eats him, and lives on. The closing moral
    states that Mole’s underground thievery to eat the food killed him.
  language: English translation with Kimbundu title/opening
