canonical_text:
  quote: ''
  summary: During a famine, lions plan to obtain the cattle of Ngana Kimona-ngombe
    kia na Mbua by sending a young lioness disguised as a woman. She courts and marries
    him, enters her bride-house, and at night repeatedly turns back into a lioness
    to attack him. Kimona-ngombe’s young son Ndala insists on sleeping with his father,
    sees the transformation, repeatedly wakes him, and finally persuades him to feign
    sleep and watch. The bride answers calls from her own country with a song listing
    Kimona-ngombe’s household as asleep while Ndala remains awake.
  language: English with Kimbundu fragments
  quote_policy: summarized
