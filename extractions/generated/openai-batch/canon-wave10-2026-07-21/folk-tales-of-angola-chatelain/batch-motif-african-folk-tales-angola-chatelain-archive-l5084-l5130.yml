canonical_text:
  quote: ''
  summary: Frog hides in a well and then in water jugs carried to heaven. In heaven
    he hides in the water room, goes at night to the room of Lord Sun's sleeping daughter,
    removes both her eyes, wraps them in a handkerchief, and hides again. The next
    morning the daughter cannot see. Lord Sun sends messengers to a Ngombo diviner,
    who says the unmarried chosen woman is afflicted in the eyes because her betrothed
    master sent a spell demanding that she come to him. Lord Sun decides she will
    be taken down to earth the next day. Frog overhears and returns to earth hidden
    in a jug, coming out at the well.
  language: English
  quote_policy: summarized
