canonical_text:
  quote: ''
  summary: The passage tells of the orphaned siblings Fenda Maria and her elder brother
    nga Nzua. Fenda Maria inherits a goat from her dying mother, who identifies it
    as both mother and father to her. Nga Nzua marries nga Nzuana, daughter of the
    Governor, after Nzuana demands that Fenda Maria become her slave and be included
    among the wooing-presents. Nzuana renames Fenda Maria as Kamaria and sets her
    to servant tasks. When Kamaria cries while washing clothes at the landing under
    a fig-tree, the goat speaks to her, comforts her, and performs the washing. Later
    Nzuana’s son demands Kamaria’s goat; the goat is killed, and Kamaria is ordered
    to wash its tripes and stomach. Fish and water carry these things away, and Kamaria
    is beaten after reporting the loss.
  language: English translation with Ki-mbundu names and fragments
  quote_policy: summarized
