  summary: 'Editorial note for No. IX identifying its informant and dialect, then
    summarizing comparative elements: Kianda as a Loanda water-genius with offerings
    and rites; variant names of the water-genius; a Di-kishi husband episode involving
    multiple heads, flight, scenting a refuge, speaking skulls, and calamities from
    the woman''s disobedience.'
