canonical_text:
  quote: ''
  summary: 'The supplied range contains the ending of one tale explaining a saying
    that an elder and younger should not marry one man because the youngest took the
    man from her elder through shrewdness. It then begins the tale of Mr. Carry-me-not
    and Mr. Tell-me-not: two traders travel with carriers to Loanda and return via
    Kifuangondo; Carry-me-not becomes unable to walk, the carriers are sent home,
    and Tell-me-not remains. Carry-me-not warns that being carried is against his
    family law; Tell-me-not carries him anyway, after which Carry-me-not refuses to
    get down at Bengo River, during the night, at a halt, and at Pulungo.'
  language: English
  quote_policy: summarized
