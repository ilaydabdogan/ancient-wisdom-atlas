canonical_text:
  quote: ''
  summary: In a night sequence, Kamaria uses a kalubungu and self-acting objects,
    calls on God, and speaks about a journey, tears, and a slave who took the place
    of a wife. An old woman observes these events, reports her suspicions to Ngana
    Vidiji Milanda, and helps him spy. Fenda Maria orders Kamaria to bring water and
    wash her feet; later, when alone, Kamaria summons attendants, a bath, fine clothing,
    and a dress of stars while Vidiji Milanda watches.
  language: English with Ki-mbundu names and terms
  quote_policy: summarized
