canonical_text:
  quote: ''
  summary: Lord Sun orders Spider to weave a large cobweb down to earth for the descent
    of his daughter. Frog comes from the well to tell the son of na Kimanaueze that
    his bride will arrive, returns to the well, and later guides the daughter of Lord
    Sun to the groom after she is brought down and left at the well. Frog restores
    her eyes, presents her to the son of na Kimanaueze, and the son marries the daughter
    of Lord Sun and Lady Moon. The passage concludes that all others had given up
    going to heaven, but Mainu the Frog could do it.
  language: English
  quote_policy: summarized
