canonical_text:
  quote: ''
  summary: Fenda Maria nears Fele Milanda and hears a heavenly voice that identifies
    itself as the Lord God, reveals that two old women were divine testing forms,
    and gives her instructions and a magic box. She reaches a lake and receives a
    dream warning from a bird. At Fele Milanda's palace she retrieves twelve keys
    from a lion's mouth, finds Fele asleep, fills jugs with tears while fanning him,
    buys a slave named Kamasoxi with tears, and falls asleep. Kamasoxi completes the
    last jug, receives credit when Fele revives, and treats Fenda Maria as a slave
    called Kamaria. Later Fele travels to Portugal, after Fenda Maria gives him a
    list of magical objects to buy.
  language: English
  quote_policy: summarized
