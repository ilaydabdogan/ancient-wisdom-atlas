canonical_text:
  quote: ''
  summary: 'The passage describes Tikopia kinship relations and marriage rules: the
    father''s sister''s authority over a nephew''s marriage, the mother''s brother''s
    ritual and funerary functions, affinal avoidance and tapu relations, marriage
    prohibitions by status and kinship, former polygyny, bride seizure with controlled
    fighting and gift-giving, and delayed consummation after staged co-residence and
    food preparation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The masikitanga, or father's sister, has the deciding voice in her nephew's
    marriage, usually choosing his wife and being able to forbid a match he chooses.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The masikitanga and nephew may give one another goods, but each is constrained
    from taking or asking for them; the nephew may visit, talk, and eat at his aunt's
    house.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tuatina, or mother's brother, incises his nephew, and when the maromaro
    is first put on there is an exchange of presents between the uncle and the child's
    father.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tuatina of a dead man takes a leading part in digging the grave, and mutual
    taking of possessions is described without special regulations.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man and his tangata, the wife's brother or reciprocally the sister's husband,
    avoid saying one another's names, avoid taking things from above the other's head,
    keep distance, and do not bathe in a stream at the same time.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The same avoidance rules apply to the relationship between a wife's sister
    and a sister's husband, who call one another taina.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The wife's mother is described as very tapu, requiring avoidance of taking
    things from above her head and a wide detour when passing; similar but less important
    rules apply to the wife's father.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Husband and wife address one another by name, while the terms for their relationship
    are used only when speaking about the relationship.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Marriage is prohibited between ordinary people and chiefs, is regulated within
    each class by kinship, excludes those called kave, excludes a wife's sister, and
    is not affected by social divisions if two persons are unrelated.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Chiefs formerly had several wives and ordinary people more rarely did so,
    but polygyny is described as no longer practiced at the time of the account.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: When a man is old enough to marry, his father's sister chooses or ratifies
    the wife, after which his relatives decide on a day to seize the woman while the
    bridegroom remains in the house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The seizure of the woman is resisted with clubs and bows and arrows; no one
    is killed, though some may be badly wounded, and afterward presents are given
    to the woman's father and maternal uncle before she is taken to the future husband's
    house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The pair sleep together without consummating the marriage on the first and
    succeeding nights; on the next day the husband gives presents to his wife's brother,
    and on the fifth day the wife brings food from her father's house before consummation
    occurs.
  category: sequence
  evidence_refs:
  - ev:9
