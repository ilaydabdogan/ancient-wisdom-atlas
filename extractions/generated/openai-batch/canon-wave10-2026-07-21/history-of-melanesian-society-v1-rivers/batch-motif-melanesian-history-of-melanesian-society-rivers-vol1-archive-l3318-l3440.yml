literal_observations:
- id: obs:1
  text: An important Sukwe man stands within the gamal and blows a conch-shell with
    three continuous and two interrupted blasts as a signal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the signal, Mark takes up the end of the money, another important Sukwe
    member tells John to let Mark give him the money, and John takes it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each person present in the gamal gives John half a fathom called som veni;
    John adds a full fathom, and each man takes back the half fathom with the added
    fathom.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the money distribution, ovens are opened and food is distributed generally.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The general population's food is cooked in a big village oven, while food
    for Sukwe members is cooked in ovens of the gamal; lower-division ovens are not
    used for an initiation into one division.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The money may be paid either in the gamal or in the house; if paid in the
    house, it is not regarded as strict ceremonial and women may be present.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ceremony of initiation is said to be of the same kind for all Sukwe ranks,
    with eating by the ntele tree and distribution of money in every case.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Different ranks have different money amounts and distribution details, including
    Avtagataga, Luwaiav, and Tamatsiria.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: For Tavatsukwe and higher ranks, participation expands beyond the village
    or district of the initiate to the whole island, and fighting was formerly put
    aside.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In Tavatsukwe distributions, men put down money and the introducer adds an
    equivalent amount; members of the initiate's own village also receive larger additional
    distributions.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that the defining feature of the distributions is giving
    something to receive it back with an addition; the giving is called veni and the
    receiving back is sar.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: The introducer is usually of the same veve as the initiate and is often the
    initiate's mother's brother.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Mota account was given by John Pantutun and is explicitly stated not to
    be based on actual observation.
  category: other
  evidence_refs:
  - ev:10
- id: obs:14
  text: Mr Durrad supplied an account of Charles Wunau of Vanua Lava passing from
    Kworokworolava to Wometeloa at Vatrata; the upper end of the gamal had been renovated
    before the ceremony.
  category: sequence
  evidence_refs:
  - ev:11
