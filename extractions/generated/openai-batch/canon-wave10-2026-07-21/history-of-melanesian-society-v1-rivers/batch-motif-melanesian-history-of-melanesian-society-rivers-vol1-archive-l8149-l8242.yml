canonical_text:
  quote: ''
  summary: The passage describes a Banks Islands harmful magical procedure using a
    victim's yam fragment, a prepared package, fire, burial, sea-water exposure, bone
    powder, coral, chants, and a final coconut rite said to cause death. It then describes
    beneficent rites for increasing food crops, pigs, fish, flying foxes, and the
    beginning of a rainmaking rite using a clam-shell and stones representing clouds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A victim is deceived about a yam piece so that the real other half of the
    victim's yam can be kept for a magical rite.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The yam fragment is called niliao; it is crumbled, mixed with scrapings from
    scented nurnem bark, made into a lakwor mixture, wrapped in a leaf, roasted over
    fire, and buried in sand where the sea will flow over it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After later exhumation, additional leaves are mixed in; a dead man's bone
    is roasted, broken with a stick without hand contact, powdered, and mixed into
    the package while words are chanted.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The package is buried inside the practitioner's house with a fire over it,
    and during the following four months the victim first begins to feel ill.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Fragments of nerlam, described as probably red branching coral with a reputation
    for mana, are mixed into the package; it is hung in the house with a fire under
    it while words are chanted, and it is hidden from strangers.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: For the final rite, the magician takes five coconuts from a special coconut
    tree with mana; the contents of the coconuts are poured into a depression in the
    package in a process called halmat.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The text states that the victim dies when the halmat process is done, but
    remains indefinitely enfeebled if the final rite is not performed; the whole process
    lasts at least seven months.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the serwehigi crop-increase rite, a petitioner pays measured amounts of
    money to a man whose power depends on a stone with mana; the worker addresses
    the vui residing in the stone to bless the petitioner's crops.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: Similar increase rites use special stones for pigs, fish, and flying foxes;
    the fish stone is placed in the surf with formulas, and leaf juice is squeezed
    over a flying-fox-shaped stone with formulas.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The rainmaking rite begins in a house with a great clam-shell called nabeng
    in the middle and large stones set on either side to represent big horizon clouds
    called gerger.
  category: setting
  evidence_refs:
  - ev:10
