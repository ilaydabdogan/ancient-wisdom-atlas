canonical_text:
  quote: ''
  summary: 'The passage describes kava preparation and ceremonial distribution in
    Vanikolo and Utupua, then gives ethnographic notes on the Reef Islands: language
    and population observations, exogamous matrilineal groups called mata, group-specific
    animal food prohibitions, evidence that some restrictions are weakening, men''s
    eating and sleeping houses called afalau, dispute separation and compensation,
    and one Pileni kinship term report.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four or five youths chew kava root, place the chewed mass in a large bowl,
    add water, stir with a stick, let it settle, and do not strain it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The kava bowl is called wumeto; it has no legs and is placed on a stand so
    it does not touch the ground.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The liquid is taken out in a coconut cup and handed first to chiefs and then
    to ordinary people; in Vanikolo kava is drunk only on ceremonial occasions, and
    Utupua is said to use it in the same manner.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author notes that the kava information came from a native of another island,
    while also stating confidence in the essential accuracy of the account.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author visited Matema and Nukapu and reports that Reef Islands languages
