canonical_text:
  quote: ''
  summary: The passage describes purchase and first performance of a man's song, dance
    gestures tied to song topics, the importance of having a song for reception after
    death, and details of an Avtagataga initiation in Motlav involving women, a pig's
    head, money exchange, conch blasts, stones, entry and seclusion in the gamal,
    body painting, drums, stepping over women, feasting, later modifications, and
    ritual kin terms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A composer teaches a newly ordered song to people; the song's new owner pays
    the composer with fathoms of money, provides food, and the singers first perform
    the song to its owner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The account states that every man must have a song because his reception after
    death by the ghosts of the dead depends on whether he has one.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'During dance singing, gestures correspond to song topics: money, clouds,
    rain, sun, shooting, and speaking.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author reports being told that in Mota, eating beside a cycas tree took
    place for every step in the Sukwe, probably on the night before the distribution
    of money.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Avtagataga initiation described for Motlav is performed in the village
    at sunset, with the child seated on mats and women seated around him.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: A pig's head with tusks is placed before the child, women give money to the
    child, the child gives back larger money amounts, and the child gives a piece
    of money to his mother's brother.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: An old man blows a conch-shell four times; after each blast, the child puts
    a stone on top of the pig's head.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The boy is carried into the gamal on the back of his father's sister, followed
    by the women with their mats.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The child remains in the gamal for five days, is given mats for sleeping,
    and is painted on face and body with red and black stripes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: When the child comes out of the gamal, chief men beat drums; twenty men take
    the boy to the drums and receive money from him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The women kneel so the boy can pass by and step over each of them; he then
    sits on a stone while drums are beaten and songs are sung by chief men.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: After the drum ceremony, men feast in the gamal while women feast in their
    houses.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: 'The passage states present-day modifications: initiation is no longer customarily
    in childhood, the father''s sister leads rather than carries the initiate, and
    the gamal stay is reduced to one day under missionary influence.'
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: Women who took part call the child or man nat or natui, meaning child; he
    calls them terms glossed as mother strike or kill hermaphrodite pig.
  category: speech
  evidence_refs:
  - ev:14
