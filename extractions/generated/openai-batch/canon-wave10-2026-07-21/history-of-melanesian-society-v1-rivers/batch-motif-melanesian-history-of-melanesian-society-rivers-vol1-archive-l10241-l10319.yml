canonical_text:
  quote: ''
  summary: 'Ethnographic account of a Pentecost marriage ceremony reported by John
    Pantutun: the marriage is arranged between a man and the girl''s parents, pigs
    and days are counted, the girl is kept uninformed, a mat is prepared and used
    to wrap her after a sudden announcement, ritualized fighting accompanies her removal,
    she kills a pig given by her father, the pig is retrieved and distributed, and
    the pig''s head is passed to a bachelor with consequences for his own future marriage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The account was obtained from John Pantutun, a native of Mota who had spent
    time on Pentecost and witnessed the proceedings; the narrator notes that his account
    was that of a stranger and was not corroborated by islanders.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A marriage is arranged between the would-be husband and the girl's parents,
    and the girl is not consulted; the man settles with the parents how many pigs
    he will give and when he will have them ready.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The future husband plucks one leaflet each day from a leaf of the male cycas
    to keep a tally of the days until the marriage preparations.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: When two leaflets remain, the girl's parents prepare a large bag of property
    for the girl, send her to the gardens so she will not suspect the event, and the
    future husband brings a new mat that her mother hides.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: On the next morning the father keeps the girl in the house; the future husband
    comes with his people, and a chosen man enters pretending to fetch fire, seizes
    the girl by the wrists, and says, "Marry."
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The girl cries and is quickly wrapped in the new mat by the bridegroom's sister;
    the passage says this is done quickly because the girl may resist once she realizes
    what is happening.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The man who announced the marriage leaves the house with a stick and is struck
    with a thorned club by a man of the girl's father's moiety; then the village men
    take prepared sticks and fight the party that has come to fetch the girl.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: While the fighting is taking place, the bridegroom's sister takes the girl
    out of the house, wrapped so completely in the mat that she can see nothing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The girl is unwrapped, her father gives her one of his pigs to kill as a sign
    that it is the last of his property with which she will have anything to do, she
    kills it with a club, and is wrapped again.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A member of the husband's party is deputed to fetch the pig; a relative of
    the father resists until the man's touch on the pig ends resistance, after which
    the pig is cut up and distributed.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The bridegroom takes the pig's head and gives it to a bachelor of his own
    party; the recipient is then expected to marry a previously unmarried girl rather
    than a widow, making young bachelors reluctant to receive it.
  category: relationship
  evidence_refs:
  - ev:11
