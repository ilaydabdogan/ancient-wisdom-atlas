canonical_text:
  quote: ''
  summary: The author constructs a theoretical Pentecost kinship system based on a
    man's marriage with his daughter's daughter, then checks whether the resulting
    affinal and grandparental relationships match the terms he had recorded. He notes
    that the actual case probably concerns the granddaughter of a classificatory brother
    rather than a man's own granddaughter, but for simplicity works through the latter
    case. The passage lists resulting equivalences between wife’s relatives and the
    man's descendants, with several Pentecost terms given.
  language: English
