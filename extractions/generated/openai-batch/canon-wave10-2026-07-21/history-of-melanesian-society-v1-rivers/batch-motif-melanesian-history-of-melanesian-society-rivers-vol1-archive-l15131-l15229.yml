canonical_text:
  quote: ''
  summary: The passage describes Tikopian chiefly authority, severe punishments including
    sending offenders to sea, details of male and female sea-expulsion practices,
    rescue and exchange after rescue, non-human handling of theft by atua, and a classificatory
    kinship terminology.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chiefs are described as rulers of the island with a deciding voice in social
    disputes and a leading ceremonial role.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chiefs decide whether strangers are killed or treated as guests and determine
    punishments for breaches of island custom.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'For severe offences the penalty is death, sometimes by hanging or strangling,
    but more commonly by sending the offender to sea: a man in a canoe and a woman
    by swimming from shore.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief stated offence for which men are sent away is an ordinary man being
    discovered in an intrigue with a chief's daughter.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man sent adrift is placed in a canoe at night with food supplied by his
    father.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The male victim's clubs, paddles, bows, and arrows are placed in the canoe,
    and he is decorated with armlets and a bark-cloth fillet like those worn in dancing.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The expected procedure is that, after the canoe drifts out of sight of land,
    the victim breaks the bottom of the canoe with his club, sinks, and drowns.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Relatives wail as the victim drifts away and observe mourning rules as if
    he had died naturally on the island.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: John, when sent adrift, was given a mat-sail, sailed to Vanikolo in three
    days, and lived on twelve coconuts provided as food.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The customary food for a man sent adrift is usually only two or three coconuts,
    and John's case also differed by occurring at midday rather than at night.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Unmarried women may be driven to the sea and made to swim away, chiefly for
    looseness in sexual relations, while married women are not treated this way because
    of the respect paid to them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Men or women sent away may be rescued by another division, become members
    of that division, and be returned to their own people only if presents are given
    in exchange.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Stealing is the only other offence named, and it is said to receive no human
    punishment but to be dealt with by the atua in a manner described elsewhere.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The relationship system is described as classificatory, with pa, nau, and
    tania used for grouped parental and child categories.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The terms taina and kave are used for siblings and cousins in specified ways,
    and terms are also given for mother's brother, sister's son, father's sister,
    and reciprocal relations.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: All four grandparents are called tupuna and all grandchildren makupuna; husband
    is matua and wife is nofine; pa and nau are also used for certain in-law relations.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: 'Additional affinal terms are listed: taina for a man and wife''s sister or
    a woman and husband''s brother, tangata for certain male affines, and fine or
    ma for certain female affines.'
  category: relationship
  evidence_refs:
  - ev:9
