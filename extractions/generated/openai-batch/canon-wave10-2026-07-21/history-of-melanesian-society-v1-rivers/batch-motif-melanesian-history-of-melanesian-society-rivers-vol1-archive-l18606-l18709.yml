canonical_text:
  quote: ''
  summary: The passage defines several Tongan kinship terms, then describes features
    and functions of the mother's brother. The mother's brother is said to honor and
    serve his sister's son, permit sister's children to take goods from his house,
    and have no special obedience, conversation, or name restrictions imposed on them.
    The passage also notes limited ceremonial prominence for the maternal uncle and
    higher honor for the ilamutu eiki, who receives the larger pig when two pigs are
    available.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The term ilamutu is applied by a man to his sister's child, whether son or
    daughter; if the sister is older, her child may be called ilamutu eiki or tama
    eiki, with eiki glossed as chief.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ilamutu is also used classificatorily for the children of any woman who would
    be called sister; ilamutu eiki may apply to the child of a woman descended from
    an older branch of the family.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mehikitanga denotes the father's sister and women whom the father would call
    sister; fakafotu is the reciprocal term used by a woman for her brother's child.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage lists additional kin terms for grandparents, grandchildren, spouses,
    affinal relatives, co-wives, and chief wife.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The system has special terms for the mother's brother and father's sister,
    each with a reciprocal, while the spouses of these relatives are not distinguished
    from mother and father respectively.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that each parent uses a special term for a son, both parents
    share a term for daughter, brother and sister use different reciprocal terms,
    and parents-in-law are not distinguished from parents.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In Tonga the tuasina, or mother's brother, is described as being like a servant
    for his sister's son and as having to listen to the boy.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The sister's son is especially honored by his uncle and may take a pig, canoe,
    or other goods from the uncle's place without objection.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A maternal uncle looks after his sister's son while young; at the uncle's
    house the boy may do as he chooses and is not especially required to obey the
    uncle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: There are no restrictions on conversation with the tuasina or on use of his
    personal name, and the passage says personal names are customarily used in address
    for relationships generally.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The author could not discover that the tuasina had a special role in naming,
    incision, or marriage ceremonies for his nephew, though he might assist with feasts.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: A woman has the same rights and privileges as her brother in being able to
    take anything from the house of her maternal uncle.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The ilamutu eiki is more highly honored than other ilamutu; if the uncle has
    one large and one small pig, the large pig goes to the ilamutu eiki.
  category: sequence
  evidence_refs:
  - ev:11
