canonical_text:
  quote: ''
  summary: The passage records Merlav traditions about the origins of several tagataga
    social groups, including accounts of women or parties arriving from other islands,
    a woman floating from Maewo on a pudding dish, repeated requests for fire from
    an old woman, animal births of girl children, and descent from a pig. It then
    transitions to an ethnographic discussion of relationship terms in the Banks Islands,
    especially Mota.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some tagataga are exogamous, and the origins of some are ascribed to women
    who came from other places; the Mweo, Sarana, and Dungdung ancestors are said
    to have come from Maewo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Sarana woman from Maewo was driven away, floated to Merlav on a dish used
    for making large puddings, landed at Ngerungara, and made a garden at Visangut.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: While working in the garden, the Sarana woman heard a crying child she could
    not see, found a girl by long grass, cared for her, and the Sarana people are
    said to descend from this child, named Tangerungana.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Mweo and Sarana people believe themselves closely related and call one
    another tasi, glossed in the passage as brothers.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Dungdung group is said to descend from a Maewo party that came to Merlav
    by canoe, lived on the beach, and found an old woman alone in a house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Members of the Maewo party asked the old woman for fire; she gave it silently,
    and after they extinguished it twice and returned, she spoke on the third request.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After the old woman spoke, the people concluded that she must be their sogoi
    and went to live at Dungdung, the place where she had been found.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Ronalung group is connected with Merig through a woman who saw a bird
    give birth to a girl child in a nut tree and cared for that girl.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: One of the Merig woman's own children came to Merlav and married at Vanmisi;
    one of her sows went to Ronalung and gave birth to a girl who is the ancestress
    of the Ronalung division, whose descent is ascribed to the pig rather than to
    the Merig woman.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Luwe and Bule groups are said to descend from women of Santa Maria, but
    no stories connected with them were known.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The origins of Ondoa, Kwerivia, Voslav, and Maketuk are described as doubtful,
    though they are believed to descend from people appointed to start new groups.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The author states that the Merlav tagataga traditions suggest the island was
    populated by small immigrations, with each small party becoming the starting point
    of a social group.
  category: other
  evidence_refs:
  - ev:12
- id: obs:13
  text: The passage states that Banks Islands differ considerably in systems of naming
    relationships, and that the author's Mota information generally agrees with Dr.
    Codrington's account.
  category: other
  evidence_refs:
  - ev:13
- id: obs:14
  text: The Mota term Tamai is given for father, father's brother, mother's sister's
    husband, and also the father's sister's son.
  category: relationship
  evidence_refs:
  - ev:14
