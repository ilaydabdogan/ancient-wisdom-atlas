canonical_text:
  quote: ''
  summary: The passage introduces ethnographic sources for Tikopia and Banks Islands
    material, then explains the author’s view of classificatory relationship systems.
    It argues that such systems are socially significant, are founded on clans or
    similar social groups rather than the family, extend kinship terms across wider
    social categories, and may survive after clan organization has disappeared. A
    footnote defines a clan as an exogamous group bound by common descent from a real
    or mythical ancestor or by a shared totem.
  language: English
  quote_policy: summarized
