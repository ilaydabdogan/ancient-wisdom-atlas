canonical_text:
  quote: ''
  summary: 'The passage describes Banks Islands kinship roles: the sister''s son inherits
    magical objects, assists the maternal uncle, and can impose food taboos after
    a man''s death; the father''s sister holds a highly respected role in initiation,
    marriage decisions, warnings, birth ceremonies, property relations, and name avoidance,
    with variants reported from Mota, Merlav, Rowa, Motlav, and Vanua Lava.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Objects possessing power connected with kinds of magic are usually inherited
    by the sister's son, who may help in rituals carried out by his uncle.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a man's death, his sister's son may taboo any food he chooses, and the
    widow may neither eat nor cook that food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Merlav, the relation between a man and his wife's brother is described
    as closer than that with the mother's brother; a man and his sister's son help
    one another, and a man must obey his mother's brother.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Rowa, a man is said to have a duty to give food to the children of his
    mother's brother.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The father's sister's relation to her brother's child is described as of utmost
    importance in the Banks Islands; she is called veve vus rawe in Mota and by corresponding
    terms elsewhere.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: In initiation into the Avtagataga division of the Sukwe, women assist; the
    initiate strikes the head of a tusked pig called rawe, and the father's sister
    takes the leading part.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The father's sister may be called maranaga, a term associated with high rank
    and now used for king or queen; her nephew greatly respects her and will not say
    her name, although he may take food from her and eat with her from the same dish.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: If there is rumor or danger concerning a man, his father's sister tells him
    and keeps alert for news affecting her brother's child.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The father's sister ordinarily arranges her nephew's marriage and may forbid
    a match he chooses; a man would not marry against her will.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A woman plays a large part in ceremonies following the birth of her brother's
    children.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: There is some community of goods between a man and his father's sister; she
    may take certain things of his, and he customarily asks her son before taking
    her possessions.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: In Motlav, Rowa, Merlav, and Vanua Lava, variants are reported concerning
    respectful speech to the father's sister, her marriage veto or arrangement role,
    poroporo obligations, feasting expenses, and contribution to marriage payment.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: A woman calls her brother's child natui vus rawe, or nat wuhe rau in Motlav,
    and will never say the child's name.
  category: speech
  evidence_refs:
  - ev:13
