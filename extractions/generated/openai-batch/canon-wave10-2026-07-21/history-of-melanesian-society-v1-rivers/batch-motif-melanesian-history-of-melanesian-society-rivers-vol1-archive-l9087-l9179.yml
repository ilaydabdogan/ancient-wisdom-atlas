canonical_text:
  quote: ''
  summary: The passage records Loh and Torres Islands regulations for conduct among
    affinal relatives, including avoidance of parents-in-law, restrictions on names
    and address terms, implications of personal-name use for sexual or marital relations,
    widow remarriage rules involving a deceased husband's brothers, conduct between
    a woman and her husband's sister, and a mutual-aid relationship compared by the
    author to a Banks Islands gasala relation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Loh, a son-in-law and his wife's father observe avoidance and deference
    in sitting, passing, speaking, and the transfer of a load from the shoulder via
    the ground rather than hand-to-hand.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man must keep distance from his wife's mother, must not say her name, may
    speak to her only from several yards away, and uses a crouching posture if he
    must pass her closely; she goes on hands and knees if passing him and will not
    pass if he is sitting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that formerly a man might marry his wife's mother, but
    such an event would occasion a fight.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A wife's sister may be addressed as chiochiok or by her personal name; using
    the personal name is said to imply suspicion or certainty of sexual relations,
    while chiochiok excludes that possibility.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Calling the mother-in-law by her personal name or failing to observe avoidance
    rules is said to indicate sexual relations; after actual relations, a man would
    use her personal name instead of tivina for life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The word cha or ja is described as a word a man should use only to his wife
    and as having the same significance as personal-name use in the relevant contexts.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A man may call his brother's wife by name, but does not speak familiarly to
    her or use cha; in this case personal-name use did not appear to imply sexual
    relations.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: People who call one another wuluk may say each other's names but remain very
    respectful to one another.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: After a husband's death, a widow calls the husband's elder brother kwiliga
    and he calls her tivina; they may not marry, while she may marry any of the younger
    brothers.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: A woman must not take a basket from the head of her husband's sister, and
    either woman rises when the other approaches.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Those who call one another tukwutog and retukivu are mutually helpful, bringing
    food or necessities when one is sick or unable to leave the house.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The author states that the tukwutog and retukivu relationship resembles the
    Banks Islands gasala relationship between the respective parents of a married
    couple, but is one generation farther back.
  category: relationship
  evidence_refs:
  - ev:10
