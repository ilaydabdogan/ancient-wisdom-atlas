canonical_text:
  quote: ''
  summary: The passage describes Tikopian rites and sanctions involving first taro
    planting and first eating, coconut tapu imposed by chiefs, general tapu signs
    and ancestral invocation, sickness after tapu infringement, and a theft-detection
    practice in which an ancestral atua is invoked to enter an aku fish that wounds
    the culprit, followed by mourning, a feast, abstinence rules, and pity for the
    sufferer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first taro is planted by the chief of the Taumako in a named part of a
    garden.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The koso tapu stick is stuck upright near the first taro, remains there until
    covered by weeds, and is later stored in the chief's house after kava is offered.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the taro is ready, the crop is taken to the chief's house; the first
    planted taro is cooked with others as pudding, and the chief eats first after
    kava and prayer.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The chief of the Tafua can place a tapu on coconuts by putting signs beside
    selected coconut trees and offering prayer and kava.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: While the coconut tapu lasts, no one may eat coconuts; when it is removed,
    food and coconuts are distributed to other chiefs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A general Tikopian tapu sign consists of a bough stuck in the ground near
    a tree, with a longlong or cycas leaf bound to it by a coconut leaf.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: An ancestral atua is invoked, implicitly or explicitly, when a tapu is imposed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: A person who infringes such a tapu is expected to fall sick, possibly with
    widespread pain or swelling.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The sick man sends his brother to the person who imposed the tapu; that person
    offers food on an ancestor's grave and prays.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: After recovery, the sick man makes presents to the person to whom he attributes
    the recovery.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: When coconuts are believed stolen, the owner may invoke his ancestral atua
    to enter an aku fish before a night fishing expedition.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: If the guilty man is in the fishing party, the aku is believed to jump into
    the canoe and pierce his leg with its pointed snout.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: After the wound, people call out about blood in the sea, the canoes go ashore,
    and the injured man is carried into his house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Men beat their foreheads and women tear their cheeks until blood flows outside
    the injured man's house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: A feast follows in which the wounding fish is eaten, but the injured man,
    his relatives, and the owner of the stolen coconuts may not eat it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The people are described as feeling pity rather than anger toward the injured
    man after the wound.
  category: attribute
  evidence_refs:
  - ev:7
