canonical_text:
  quote: ''
  summary: The passage describes the Banks Islands kolekole performances as public
    ceremonies connected with the Sukwe and Tamate societies. It explains objects
    that may be ceremonially treated, links such performances and initiations to prestige,
    payment, and access privileges, and describes women’s house-related kolekole ceremonies
    that determine whether they may approach certain houses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kolekole performances are described as ceremonies participated in by the whole
    population, including male and female, young and old, initiated and uninitiated
    people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The examples described are closely connected with the Sukwe and Tamate societies,
    and some ceremonial features can only be performed by people belonging to one
    of those organisations.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Objects that may be kole include ornaments, especially Sukwe hats or masks,
    houses, trees, and stones.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man’s prestige and general social position are said to rise with the number
    of things he has been able to kole.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A kolekole may be carried out by a man on behalf of a daughter or other female
    relative, while the woman is then said to kole.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some objects are a man’s privilege to kole, while houses especially become
    objects of kolekole on behalf of women.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Important objects for a man to kole include articles connected with the Sukwe,
    especially hats or masks, and some features of these performances are only open
    to people initiated into certain ritual departments of the Sukwe and Tamate societies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Various objects worn at kolekole performances and several head-decorating
    methods can only be used after special initiation.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Payments of pigs, money, or both are described as the most important feature
    of these initiations.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Initiation into the less important Tamate societies is often the occasion
    of a kolekole, and holding one increases the importance of the occasion and the
    new member.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The house is described as a chief object for a woman to kole, and the ceremony
    is incumbent on women if they are to avoid inconvenience.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: A house submitted to one ceremony is called gavur lava, and a woman who has
    not performed such a ceremony is prohibited from entering or approaching such
    a house.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: A more elaborate ceremony gives a house the name tamate woroworo, and only
    women whose own houses have that status may approach such a house.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: A woman who had not performed the relevant ceremonies would be unable to use
    a path passing by a house she was not permitted to enter.
  category: action
  evidence_refs:
  - ev:5
