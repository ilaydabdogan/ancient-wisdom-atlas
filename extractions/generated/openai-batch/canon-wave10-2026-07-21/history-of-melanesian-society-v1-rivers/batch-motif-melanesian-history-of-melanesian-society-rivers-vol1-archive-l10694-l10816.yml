canonical_text:
  quote: ''
  summary: The passage introduces Santa Cruz Islands ethnographic material and summarizes
    three accounts of nau social groups. These groups are named after animals or plants,
    restrict marriage within the group, and impose food, use, speech, or identification
    rules connected with the namesake beings or plants. One account includes an origin
    story in which a taklai bird's brood is carried by water to the sea and fishes
    take charge of the young birds, beginning different groups. The author notes both
    strong agreement on the animal/plant-linked exogamous pattern and important discrepancies
    between accounts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that the Santa Cruz material is scanty and in some respects
    contradictory, and that he has three sources for the island account.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: One account describes four social groups called nau, each named after a fish,
    shark, red fish, or papaya.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Members of each nau may not eat the animal or plant after which the group
    is named, and additional animals or plants are also forbidden to specific groups.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a man catches a fish that he may not eat, he gives it to a man of another
    group.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: People of the same nau are not allowed to marry, while a man may marry a woman
    of another nau.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Temotu boys' account, a man was said to belong to the same nau as his
    father.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: People of a nau are reported to believe in descent from the animal that gives
    the group its name, and the mbembla people are said to be recognized by red eyes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Durrad's account describes nine social groups named after animals including
    a bird, fishes, eels, a dolphin or porpoise, a pigeon, and a bush-fowl.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In Durrad's account, a man belongs to the group of his mother.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A story says that the taklai bird hatched a brood by a stream; the stream
    carried the nestlings to the sea; fishes took charge of them and began the different
    groups.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Joest's account describes twelve nau named after sea animals, land animals,
    and fruits, with marriage required outside one's own nau.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Joest reports that eating certain named animals causes the eater to fall to
    pieces beginning with the teeth; plant-group members may not eat or dig the plant;
    and dog-group members may not give food to a dog.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Joest reports that a person may not utter a word forming part of the name
    of the animal or plant of his nau, and that nau membership can be told by inspecting
    folds on the palm of the hand.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The author concludes that the three accounts establish a connection between
    exogamous social groups and animals or plants whose use as food or otherwise is
    restricted, while also noting discrepancies and likely local differences.
  category: other
  evidence_refs:
  - ev:11
