canonical_text:
  quote: ''
  summary: The passage describes and compares kinship terminology and marriage-related
    categories in Ulawa, Saa, and Lau/Malaita, emphasizing reciprocal terms, classificatory
    relatives, marriage restrictions, affinal terminology, and distinctions involving
    cross-cousins, mother's brother, father's sister, grandparents, and in-laws.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The described system is presented as exceptionally simple, with broad terms
    for relatives of the generation above, same-generation relatives, and relatives
    by marriage.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Reciprocity is emphasized for parent-in-law and child-in-law, and for grandparent
    and grandchild relationships.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Saa, the system is said to be the same except that brothers and sisters
    are both called asiku without a distinction based on the speaker's sex or age.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Saa, akaro is a reciprocal term used by the parents of a man and the parents
    of the man's wife, and it is also a general term for relatives by marriage.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Ulawa, the prefix rohai is used to refer collectively to reciprocal pairs
    such as mother and child, wife and child, parent-in-law and child-in-law, and
    same-generation affinal relatives.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Marriage is regulated by kinship: a man will not marry a person called iniaku
    in Ulawa or asiku in Saa, including certain classificatory cousin categories.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Lau list gives named terms for father, mother, child, siblings differentiated
    by sex and age in some cases, brother-sister relations, father's sister, mother's
    brother, cross-cousin, husband, wife, in-laws, affines, friends, and co-wives
    of brothers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Lau term ko nau is used reciprocally for mother's brother, certain affinal
    cross-relatives, all four kinds of grandparent, and corresponding grandchild or
    sister's-child categories.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Lau term di nau is identified as a term for cross-cousin, referring to
    the child of the mother's brother and the father's sister.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'The Lau system is explicitly compared with Ulawa and Saa: it resembles them
    in having few affinal terms but differs by having a term for father''s sister
    and by distinguishing cross-cousins from the children of two brothers or two sisters.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: 'Bara nau is reported with uncertainty: one account gives it for brother-
    and sister-in-law, while Mr Hopkins heard it as a general term for blood relatives,
    with bara explained as the fence marking off the group or village.'
  category: speech
  evidence_refs:
  - ev:9
