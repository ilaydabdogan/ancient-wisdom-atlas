  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The highest chiefly marriage grade is described as a union between a brother
    and sister of the same father and mother and of the highest rank; its offspring
    were called niau-pio or branch of the pio.
  category: relationship
