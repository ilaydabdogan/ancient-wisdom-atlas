canonical_text:
  quote: ''
  summary: The passage discusses Hawaiian kinship terminology, limits on applying
    relationship terms, adoption and artificial brotherhood, genealogical recognition,
    and chiefly marriage. It distinguishes chiefly marriage customs from those of
    ordinary people, reports a nine-grade system of chiefly marriage on Oahu, and
    describes the highest grade as a full brother-sister union of highest rank, producing
    niau-pio offspring treated as highly sacred. Named chiefly examples are given.
  language: English
  quote_policy: summarized
