canonical_text:
  quote: ''
  summary: An ethnographic account describes how land cleared by Takwale and his brother
    was divided, how Takwale allotted plots to children through planting customs involving
    a child on the father's left shoulder or a coconut representing an absent child,
    and how later rights of inheritance, common land use, tree ownership, produce-taking,
    and kin payments operated among descendants and related persons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Land reclaimed from bush was divided into two equal portions, one for Takwale
    and one for his brother; the account follows Takwale's portion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: As Takwale's children were born, land was portioned out by planting a plot
    for each child.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The usual custom for assigning a plot to a young child involved the father
    planting while carrying the child on his left shoulder.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For a grown son, the father plants while the son walks behind him with his
    right hand on the father's left shoulder.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: For an unborn child, the father plants with a dried coconut under his left
    arm or fixed on his left shoulder; the coconut is said to represent the child
    or an absent person.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Named portions were planted for Leveveg, Rivlava, Tapermaro, unnamed children,
    and Matthias, while the remainder was left common to the whole family.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:11
- id: obs:7
  text: While Takwale lived, allotted plots were treated as common property of father
    and child, while the unallotted portion was treated as Takwale's alone.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: After Takwale died, the unallotted portion became common to all his children,
    and the children of Takwale's brother could also plant there.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Coconuts planted by the children of Takwale's brother on the common land would
    be recognized as theirs, while the land remained the property of Takwale's descendants.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: When a descendant of Takwale died, the owner of a tree on the land paid money
    to the senior representative of Takwale's surviving family.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage reports that quarrels about common land were unknown, while disputes
    about land assigned by fathers to individuals were frequent.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Leveveg later divided his own plot among his children by the same shoulder-carrying
    planting procedure.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: After Leveveg died without surviving descendants, Rivlava took Leveveg's land;
    after Rivlava died, his adopted son Matthew took his adoptive father's land, subject
    to a payment obligation.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: The payment owed by Matthew was not attributed to his being adopted; the same
    claim would have existed if he had been Rivlava's biological son.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: John, Agnes, Agnes's children, and John's son had specified rights to take
    coconuts or breadfruit or to use land for a yam garden, while John's wife was
    not allowed to take coconuts.
  category: relationship
  evidence_refs:
  - ev:10
