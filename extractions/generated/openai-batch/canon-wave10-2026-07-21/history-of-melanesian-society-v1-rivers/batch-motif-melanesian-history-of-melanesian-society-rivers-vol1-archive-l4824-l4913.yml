canonical_text:
  quote: "“only its members may make the sound called werewere”"
  summary: The passage describes the Tamate liwoa or Tamate werewere society, its
    initiation requirements, ritual house and restricted spaces, badges and representations,
    subsidiary societies or hats, and the secret method of producing the werewere
    sound with a stick, stone, shell, and rhythmic rubbing.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Tamate liwoa, also called Tamate werewere, is described as the chief or great
    Tamate society; the second name is derived from a special sound restricted to
    long-initiated members.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Initiation into Tamate liwoa is necessary for progress in the Sukwe beyond
    the rank of Tamatsiria.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Veverau district of Mota, the salagoro of Tamate liwoa is a fine house
    built like an ordinary village house except for a diamond-shaped door said to
    resemble the face of a tamate.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In front of the house is an open space with a platform for two men to sit
    and make the werewere sound, and a large oven for food cooked for a feast at the
    end of the seclusion period following initiation.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Cycas trees grow around the salagoro-house area and mark spots also called
    salagoro, which are sites of minor Tamate societies connected with Tamate liwoa.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Access to each minor salagoro is limited to persons specially initiated into
    that Tamate, and membership in minor societies affects how far a person may enter
    the main building.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The badges of Tamate liwoa include gasor fruit, leaves of several named trees,
    five varieties of croton, and a stripped hibiscus stem about six feet long.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Three representations of Tamate liwoa are shown in the cited plate; they appear
    upside down and represent a human face with definite eyes and mouth, while other
    features are unexplained by the author.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wis and Kwatwasawasa are described as subsidiary societies or different hats
    of Tamate liwoa, and membership in Tamate liwoa automatically includes initiation
    into them without separate initiation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Only members of Tamate liwoa may make the werewere sound, and the method of
    making it is a secret revealed to a new member at initiation.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The werewere sound is made by rubbing a stick called sur on a stone; two large
    stones in the Veverau salagoro are named Lova and Kwasematika.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Smaller stones may be removed from the salagoro for learning the werewere
    technique, and they may have names derived from their places of origin.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The sur sticks are made from several kinds of wood and are bound and covered
    with palm, ugava, and nokaria leaves.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: A heated univalve shell, ordinarily called lata and in the salagoro called
    wokwasa, is rubbed over the stone before the stick is moved back and forth on
    it in varying rhythms.
  category: action
  evidence_refs:
  - ev:10
