canonical_text:
  quote: ''
  summary: While her parents are away, the motar remains in the village weaving. She
    hears a noise three times, sees a rainbow and light over an open pit, and encounters
    Wetmatliwo sinking down. She declares him her husband, performs the preparations
    he orders, plays a drumming-board and sings while he dances into the house, and
    they lie together. When her parents return, she reveals the screened room; lifting
    the partition, his glory as a great light fills the house, and the parents accept
    the beautiful youth as their kwaltga. The couple then remain together in the room.
  language: English
  quote_policy: summarized
