canonical_text:
  quote: ''
  summary: The passage describes kolekole ceremonies associated with women and girls,
    house access, status competition, pig-killing, dances, payments, and house markers.
    It then describes tamate belt designs worn by women at kolekole, especially the
    tamate worawora, including purchase and resale of wearing privileges, manufacture
    with pandanus leaf, bark patterns, dye, fire, and water, fasting by women makers,
    and the division of the design between belt and wrist tattoo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ceremony is often performed for children, and a girl who has not performed
    it may live in her parents' gavur lava but may not go to another house of that
    kind.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some people keep two houses, one that has been subject to this kolekole and
    one that has not, for those who have not gone through the ceremony.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A pointed bamboo purlin cut into a mouth and called valvalai marks a house
    that has been subject to a kolekole; multiple valvalai may correspond to multiple
    ceremonies performed for different women.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: People compete in kolekole performances through the dance, the number of pigs
    killed, and the scale of payments to participants.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Certain tamate designs imprinted on women's belts at kolekole performances
