canonical_text:
  quote: ''
  summary: The passage describes Tikopian games, including a boys' stick game and
    a game in which a stone is said to represent a woman, fishing with bow and arrow
    on a lake, and an extended comparison between John Maresere's account and Mr Durrad's
    notes on kinship, animal atua associated with social divisions, burial, fishing,
    and bark-cloth preparation. It also mentions earlier accounts by Dillon, d'Urville,
    and Gaimard as possible evidence of continuity and change.
  language: English
  quote_policy: summarized
