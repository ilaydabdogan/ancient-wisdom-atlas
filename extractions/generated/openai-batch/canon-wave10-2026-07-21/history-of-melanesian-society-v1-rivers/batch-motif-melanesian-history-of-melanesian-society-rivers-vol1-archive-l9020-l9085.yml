canonical_text:
  quote: ''
  summary: Ethnographic discussion of Torres Islands kinship terminology and functions
    of relatives, especially terms around cross-cousins, affines, father's sister,
    mother's brother, and differences between Hiw and Loh. The passage also notes
    that frequent marriage between relatives creates double relationships that complicate
    genealogical collection of kinship terms.
  language: English
