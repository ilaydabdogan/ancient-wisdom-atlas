literal_observations:
- id: obs:1
  text: Woiuk is described as a term for a husband's sister, reciprocally for a woman's
    brother's wife, and also for the husband of the mother's sister.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that weyuk and woiuk are probably variants of the same word,
    which would extend one term across certain cross-cousin and affinal relationships.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife's sister and husband's brother are addressed by personal name, and
    personal names may also be used for children of the mother's brother and father's
    sister who are otherwise called weyuk.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: There is ordinarily no relationship term for the father's sister; she is addressed
    by personal name except in a specified marriage circumstance involving her brother's
    son and her daughter.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Hiw system is said to differ from Loh by distinguishing the children of
    mother's brother and father's sister from other cousins, a distinction absent
    in Loh.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Hiw, no distinction is made between grandparents of different sexes or
    between parents- and children-in-law of different sexes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says cross-cousin marriage can affect kinship terminology, including
    the application of a parent-in-law term to the wife of the mother's brother.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Frequent marriages between relatives mean that two persons are often related
    in more than one way, producing double relationships and complicating the use
    of pedigrees for collecting terms.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: If a man marries the daughter of his mother's brother, the uncle and the uncle's
    wife may receive different kinship terms than before.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The mother's brother is said to stand in a close relation to his nephew, and
    the nephew may take any of the possessions of his uncle.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: In Loh, the father's sister can forbid the marriage of her nephew.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: In Hiw, marriage between the father's sister and nephew may occur and formerly
