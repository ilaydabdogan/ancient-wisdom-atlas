canonical_text:
  quote: ''
  summary: The passage reports Mr Durrad's account from John Patita about Wallis and
    Tongan castaways who fled after a killing, stole a cutter, attempted several island
    destinations, and were wrecked on Tikopia, where they were adopted by local men
    and chiefs. It then discusses later removal of three men by a ketch, time markers
    for the castaways' long residence, and Rivers's assessment of John Maresere's
    reliability as an outside but long-term observer of Tikopian life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mr Durrad obtained from John Patita, also called Virikeka, an account of the
    castaways' journey to Tikopia.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The castaways are named as John Maresere, John Patita, Moses Tongare, Pongi,
    Zephaniah, Muri, and Antonio.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the three men last named had killed a man in Tonga, fled
    to Wallis Island, heard that people were looking for them, and stole a trader's
    cutter while taking the others with them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The voyagers took yams, taro, coconuts, and tomagoes, failed to reach Samoa
    because of the wind, tried several other destinations, and finally reached Tikopia,
    where the cutter was wrecked in the surf.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: After arrival on Tikopia, the castaways were received and adopted by named
    local men or chiefs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A ketch later came to Tikopia and took away Zephaniah, Muri, and Antonio;
    the passage reports that this was believed to be connected with the earlier killing
    in Tonga, while also suggesting the possibility that the captain used their guilty
    consciences to obtain recruits.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: John Patita could point out men who had been children when he landed and a
    large coconut tree that he had planted soon after arriving.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The author says John Maresere acknowledged ignorance where he lacked knowledge,
    including folk-tales and prayers or formulas, and that few inconsistencies were
    detected in his long account.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Mr Durrad later confirmed the general correctness of John's narrative and
    supplied further accounts, illustrations, and pedigrees.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: John's account was given in the Mota language, and the author altered only
    the spelling when recording it after receiving Mr Durrad's material.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage characterizes John's record as the account of a person from an
    alien though allied culture who had lived many years on Tikopia.
  category: attribute
  evidence_refs:
  - ev:9
