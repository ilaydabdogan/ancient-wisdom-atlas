canonical_text:
  quote: ''
  summary: The passage analyzes anomalies in Pentecost kinship terminology, especially
    cases where people two generations apart use terms otherwise applied to same-generation
    relatives. The author reports John Pantutun's remark that Pentecost people married
    their granddaughters, and proposes that marriage with a granddaughter, specifically
    a daughter's daughter under dual moiety organization, could explain these anomalous
    reciprocal terms.
  language: English
