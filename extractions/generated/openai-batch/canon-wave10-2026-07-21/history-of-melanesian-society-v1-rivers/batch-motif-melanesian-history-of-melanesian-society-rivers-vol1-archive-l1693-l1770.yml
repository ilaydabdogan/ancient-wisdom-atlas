canonical_text:
  quote: the use of terms ordinarily denoting the relationship of parent and child
    by persons of the same generation
  summary: 'The passage describes exceptional Banks Islands kinship terminology: cross-cousins
    may use parent-child terms for one another; grandparent-grandchild terms vary
    by sex and descent line; parent-in-law terms distinguish sex and reciprocal terms;
    some affinal relatives are addressed as brother-sister; and Rivers connects these
    patterns with a marriage regulation involving a man and the wife or widow of his
    mother''s brother.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage reports a departure from usual Banks Islands practice in which
    the child of the father's sister and the child of the mother's brother are both
    called natuk, so that two cross-cousins call one another by a term also used for
    a child.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The informant explained the father's sister's child being called natuk by
    saying that this person is the child of a morui; Rivers interprets this as a generalization
    from the mother's brother's son, who is also the son of a morui.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: All four grandparents are addressed as tumbuk, and tumbuk is also used by
    men and women for the children of a daughter.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Except for familiar speech, imbua is used between two persons of the same
    sex who are grandparent and grandchild through a son.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wife's father is called kwaleg, the wife's mother rombu, and the reciprocal
    term to both is welag; the husband's parents are similarly kwaleg and rombu, but
    the reciprocal term is tawarig.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says this is the only known Banks Islands example in which a distinction
    is made according to the sex of a parent-in-law, and that the Mota term welag
    is used in a new sense for the husband of a daughter.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The terms walus and waluk or nawal are said to be used in the same sense as
    similar Mota terms.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wife's sister and husband's brother are addressed either by name or as tatak,
    the term for the brother-sister relation.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage contrasts this with Vanua Lava, where the corresponding relatives
    call one another by the same names as husband and wife.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Rivers identifies a characteristic feature of most island systems as the use
    of parent-child terms by persons of the same generation, specifically cross-cousins
    who are children of brother and sister.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The child of the daughter of the mother's brother may be regarded as tupui,
    because the daughter of the mother's brother is natui, or child, making her child
    analogous to a grandchild.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Merlav is presented as the only known island in the group where the designation
    of cross-cousins as parent and child does not exist, though Rivers says its nomenclature
    is probably a modification of the characteristic Banks feature.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Rivers states that the special Banks relationship feature is to be connected
    later with a marriage regulation by which a man marries the wife or widow of his
    mother's brother.
  category: relationship
  evidence_refs:
  - ev:6
