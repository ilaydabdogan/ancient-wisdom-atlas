canonical_text:
  quote: ''
  summary: The passage describes Temotu kinship terms, marriage and avoidance regulations,
    house forms, and men's houses. It then gives an account of Vanikolo exogamous
    groups named after fish, animals, grass, water, fire, and a bowl; maternal group
    membership; group-specific prohibitions; origin beliefs tracing descent from the
    named object or being; and kinship terms recorded from an informant.
  language: English
  quote_policy: summarized
