canonical_text:
  quote: the word for adoption, raiho, seems to have primarily the meaning of "snatch."
  summary: The passage describes Banks Islands, especially Mota, adoption customs
    in which a newborn may become the child of the person who makes required payments
    to the birth helper or midwife. It gives examples of contested claims, explains
    later payments and concealment from the child, and describes why recovery by the
    real parents becomes financially difficult or impossible.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Adoption of others' children is described as frequent in the Banks Islands,
    and the term for adoption, raiho, is said to have a primary meaning of "snatch."
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Mota, a newborn infant becomes the child of the man who pays the chief
    helper or midwife at the birth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father's sister chooses the midwife, giving the father usual priority
    of information, but another claimant may prevail if the father lacks money or
    is absent.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: John Pantutun paid the assisting woman after Matthew's wife gave birth and
    thereby became the father of Matthew's child; he attributed his success to arriving
    before other claimants.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When John was away, he gave money to his sister Agnes to pay the midwife for
    his expected child, but Luke later paid Agnes, claimed equivalence to direct payment,
    and John could not overturn Luke's claim.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the initial payment, further payments occur, including a payment to
    the real father when he takes the next Sukwe step and a final payment called vat
    ngorag sasai, or "name concealment."
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The change of parentage is carefully concealed from the child, and this concealment
    becomes imperative after the "name concealment" payment.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The real father could reportedly recover the child only by repaying the adopting
    father's expenditures with cent per cent interest, and later payments or Sukwe
    initiation usually make repayment impossible.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: If the child has been initiated into the Sukwe, recovery would also require
    repayment of relatives' contributions and other payments; planted land and consumed
    food would also require redemption or compensation.
  category: object
  evidence_refs:
  - ev:7
