canonical_text:
  quote: ''
  summary: The passage describes Banks Islands shell-money exchange rates, units of
    measurement, preferences for new money in Sukwe/Stikwe ceremonial contexts, ambiguity
    in counting fathoms and loops of money, doubling in loans and ceremonial payments,
    and a post-mortuary ceremony in which shell-money is drawn away from a corpse,
    with the ceremony name suggesting an older use of mats as money.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman working from sunrise to sunset is said to be able to make a fathom
    of money in one day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lengths of money called chiregi are used in exchange for yams and are measured
    from one shoulder to the outstretched fingers of the other hand.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: People sometimes prefer new money and may give double the quantity of old
    money to obtain it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: New money is said to be preferred for making an impression in ceremonial connected
    with the Sukwe/Stikwe, though the author reports uncertainty about whether it
    is used while new or kept until old.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Shell-money is measured by placing two pegs a fathom apart and winding the
    money around them; one loop is called a tal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In some Sukwe transactions, a stated rova or fathom may involve giving a doubled
    length, with only one side counted.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: In monetary transactions outside the Sukwe, tal is described as a definite
    double fathom.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Loans may be repaid with cent per cent interest, producing a doubling of the
    amount of money.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Several body-based measures are named, including shoulder-to-fingertips, elbow-to-fingertips,
    and a shorter wrist-to-fingers measure.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: In a ceremony after death, strings of shell-money are drawn away from the
    corpse.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The name of the post-mortuary ceremony, rave epa or “draw mat,” is said to
    suggest a survival from a time when mats were money in the Banks Islands.
  category: speech
  evidence_refs:
  - ev:10
