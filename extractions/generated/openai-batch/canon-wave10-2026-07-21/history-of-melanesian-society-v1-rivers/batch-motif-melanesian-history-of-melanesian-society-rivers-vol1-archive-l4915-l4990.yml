canonical_text:
  quote: ''
  summary: 'The passage describes the werewere ritual sound performance connected
    with Tamate liwoa initiation in Mota: paired rhythmic performance, restricted
    training, status effects, penalties for errors, and exchanges of pigs and shell-money
    during entry into the society.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On special occasions such as the talasa feast, two men make the werewere sound
    together while sitting on the platform outside the salagoro building.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The performance begins with ten movements of increasing rhythmic complexity,
    followed by ten corresponding movements in reverse order, decreasing in complexity.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the initial ordered movements, one performer carries a comparatively
    regular series while the other makes variation sounds described as decorating
    the regular series.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The complex rhythms take a long time to learn and execute, and only two elderly
    men in Mota were said to know how to perform them properly in concert.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man who knows how to perform werewere completely is said to attain a very
    high position in the Sukwe, even above persons of superior Sukwe grades.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man must be initiated into Tamate liwoa for five or six years before learning
    to make the sounds; during initiation he may carry the stones to the platform
    but may not touch the stick called sur.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The werewere sound is described as piercing and far-carrying, audible over
    Mota and possibly as far as Motlav and Vanua Lava.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A mistake in producing the werewere sound is punished by payment of a tusked
    pig; if the performer cannot provide it, his relatives must do so, and in earlier
    times failure to expiate the offence could lead to hanging in the salagoro.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Initiation into Tamate liwoa or werewere is required before a man can progress
    beyond Tamatsiria in the gamal or enter Tavatsukwe.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A candidate gives a pig to an already initiated person, smacks the animal
    on the back, and the act is publicly announced by a conch-shell blower in the
    village.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The introducer returns an ordinary pig as an answer, and the candidate then
    gives six additional pigs to six initiated men who represent six districts of
    the island.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: Initiated men and the candidate participate in exchanges of shell-money with
    the introducer, including returned payments with additions.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:13
  text: The actual initiation need not immediately follow the pig-smacking; an interval
    may be allowed for collecting the necessary money.
  category: sequence
  evidence_refs:
  - ev:11
