canonical_text:
  quote: ''
  summary: The passage records Solomon Islands kinship terminology, compares the structure
    and possessive forms of Vella Lavella terms with Eddystone and Savo, then surveys
    social functions of kin relations including name avoidance, touch avoidance, sibling
    avoidance, in-law restrictions, and marriage rules such as kinship regulation,
    local exogamy, and probable but untested cross-cousin marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists Vella Lavella kinship terms for mother's brother, sister's
    son, grandparents, grandchild, parents- and children-in-law, and several affinal
    relations.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author reports uncertainty about proper terms for a husband's brother,
    wife's sister, and their reciprocals, especially the distribution of niania and
    menggora by relative age and relation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Vella Lavella system is described as structurally like Eddystone, with
    exceptions including definite terms for mother's brother and sister's son, and
    terms for grandparents and grandchildren.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Vella Lavella relationship terms use a possessive prefix a that is closely
    blended with the relationship term and may alter the initial consonant.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author was unable to obtain an account of social functions tied to relationships
    in the Malaita and San Cristoval region, but cites Codrington for a close relation
    between mother's brother and nephew.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: In Guadalcanar, a man may not say the name of his mother's brother, father's
    sister, or brother's wife.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: In Guadalcanar, the father's sister may not be touched, and brother and sister
    may not say each other's names, enter the same house when the other is inside,
    or transfer an object directly; a man giving something to his sister must put
    it down and go away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In Savo, there is no prohibition on the name of the wife's mother, but brother
    and sister may not touch one another.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In Ysabel, a man must not say the name of his wife's mother, and a woman must
    not say the name of her husband's father; these relatives may be present together
    and talk, but may not touch.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: For Florida, Codrington is reported as saying there is no difficulty about
    meeting or naming parents-in-law or the wife's kindred.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the Western British Solomons, the investigators found no relationship-specific
    restrictions or duties except in Eddystone, where a man must not go too close
    to or swear at his wife's mother.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The marriage section states that marriage in Ulawa and parts of Malaita and
    San Cristoval is regulated by kinship; Lau may have local exogamy, and Guadalcanar
    probably still practises cross-cousin marriage, though the matters could not be
    fully tested genealogically.
  category: relationship
  evidence_refs:
  - ev:10
