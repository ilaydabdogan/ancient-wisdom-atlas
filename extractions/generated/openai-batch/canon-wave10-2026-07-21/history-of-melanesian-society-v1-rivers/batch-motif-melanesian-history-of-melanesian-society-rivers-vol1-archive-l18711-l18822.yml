canonical_text:
  quote: ''
  summary: The passage describes the special authority and restrictions surrounding
    the father's sister, or mehikitanga, in relation to her brother's children; her
    role in arranging marriages and in a niece's first-menstruation feast; and Samoan
    sacred animals or objects called atua, including district and family examples
    such as octopus, owl, shell, stone, shark, garfish, and tree. It also begins a
    cautious record of Samoan relationship terms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mehikitanga, or father's sister, is described as related to her fakafotu,
    or brother's child, in a way that requires the brother's child to honor her and
    permits her to take anything from the brother's child.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a man honors his father's sister more than any other
    relative, and that in former times it was believed that someone who offended his
    father's sister would die.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mehikitanga usually arranged her nephew's marriage and could veto a marriage
    arranged by his parents or by the man himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man could speak to and name his father's sister, but he could not eat in
    the same place with her, eat anything she had carried, sit on her bed, or remain
    in a house when she entered.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mehikitanga arranged her brother's daughter's marriage, could take her
    possessions, and took the chief part at a feast for the niece's first menstruation,
    where the menstrual blood was given to her in bark-cloth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The husband of a mehikitanga shared in his wife's rights, but the passage
    explains this as deriving from the wife's privileges rather than from his own
    relationship.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Samoa, certain animals were regarded as sacred and called atua; examples
    given for districts include an octopus, an owl, and a large shell.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: In former times people did not eat the animal that was their atua, and the
    informant was said to deny any belief in descent from it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In former war times the atua, whether octopus, owl, or shell, called out so
    that people could hear and know there was going to be a fight; the owl flew in
    front of its people as they went to battle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Another Samoan informant spoke of each family having an atua, giving a large
    stone called Kalinga i as his own atua and naming shark, garfish, and tree as
    further examples.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that in former times those who had the shark for an atua
    were believed to be in no danger of being troubled by a shark when they entered
    the sea.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The author records hesitation and uncertainty about the Samoan relationship
    system and gives terms including tama, tina, matua, tupunga, and atalii.
  category: speech
  evidence_refs:
  - ev:8
