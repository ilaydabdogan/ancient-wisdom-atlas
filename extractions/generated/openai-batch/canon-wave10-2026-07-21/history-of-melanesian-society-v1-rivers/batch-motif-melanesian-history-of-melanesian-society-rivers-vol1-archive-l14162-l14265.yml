canonical_text:
  quote: ''
  summary: The passage records Fijian kinship terminology and comparisons with Nandrau
    and mountain groups, then describes tambu animals, plants, and stones associated
    with named matanggali. Some groups claim descent from an owl or snake and avoid
    eating those beings; one snake taboo is linked with swelling of offenders. Other
    groups possess protective stones touched only by priests. The passage then summarizes
    Tavua social divisions, a war-displaced Kaimbila group, chiefly offices, men’s
    houses, and the statement that all four Tavua groups have snakes as tambu animals,
    with uncertainty about whether the snakes are real or mythical.
  language: English
  quote_policy: summarized
