canonical_text:
  quote: ''
  summary: 'The passage describes Tamate society practices in Banks Islands disputes:
    tiu tatas curses or prohibitions in quarrels, breadfruit property assigned to
    a society, insults that pressure an offender to join the relevant society, possible
    armed conflict and intervention, rivalry-driven initiations, changing society
    sizes, revival of extinct societies by a deceased member''s son, and the disappearance
    of masks or other tamate objects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tiu tatas may be used in quarrels between members of the same society, and
    the person who starts the quarrel invokes the name of another Tamate society to
    which he belongs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People cursed in the name of a society may respond by declaring that they
    will become members of that society, thereby increasing its membership.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In a breadfruit dispute, an owner belonging to Viov may say a tiu tatas formula
    over the breadfruit, assigning it to the Viov society and its members only.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states uncertainty about whether this breadfruit procedure is an
    alternative to soloi or another way of expressing a prohibition.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The owner may curse the offender in the offender's absence by telling others
    to say that the offender is a man of Viov; this is treated as an insult that can
    make the offender wish to join Tamate viov.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the owner curses the offender face to face as a man of Viov, the pair may
    draw bows to fight, while bystanders intervene to prevent them killing one another;
    a killing would involve the whole community in the fight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Rivalry between the districts of Veverau and Luwai in Mota can lead one district
    to imitate the other, so an initiation in one may stimulate a similar accession
    in the corresponding society of the other.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'The author describes society size as fluctuating: small societies may become
    popular because they are small, become large, then become unpopular until few
    new members join.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: For more important societies, motives for joining include honour, rights in
    portions of kolekole performances, and in at least one case progress in the Sukwe.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: A Tamate society may become wholly extinct and later be revived by the son
    of a deceased member, who is described as being initiated into the property of
    the deceased.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Masks or other tamate objects are said to be disappearing; in some cases members
    have not worn or seen them, and in other cases mask-making secrets may be lost
    or known only to one man.
  category: sequence
  evidence_refs:
  - ev:8
