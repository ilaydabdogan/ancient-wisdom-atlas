canonical_text:
  quote: ''
  summary: The passage first lists kinship terms from the Nggao district of Ysabel,
    then describes Savo social organization, including five matrilineal clans called
    ravu, their associated objects or beings called manjali, related food prohibitions,
    and comparisons with Guadalcanar tindao. It also outlines Savo linguistic and
    kinship terminology, especially sex-conditioned possessive prefixes and classificatory
    sibling, cousin, and affinal terms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Savo social organization is described as resembling that of three other islands
    in the region, especially Guadalcanar, and five matrilineal clans called ravu
    are named.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each Savo ravu is said to possess objects called manjali, which are described
    as corresponding to the tindao of Guadalcanar.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Lakwili ravu do not eat a small monitor lizard called sangavulu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Gaumbata ravu reverence an image and a ghost-woman and do not eat a monitor
    lizard called vava.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Dhonggo ravu have as manjali a ghost-man and a bird called tambu koso,
    glossed as sacred bird and identified with the manuhutu of Ysabel.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'The Kikiga ravu have three animals forbidden as food: the shark, a large
    flat-fish called limanibarava, and a pigeon called kurau.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The animal manjali of Savo are described as less sacred than the tindao of
    Guadalcanar; the informant denied that they were worshipped and said they were
    tambu and not eaten.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Savo is described as having a language divergent from the general Melanesian
    type, with relationship possessives formed as separable prefixes varying with
    the sex of the person addressed.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Savo sibling terms distinguish age and sex, and the same terms are used for
    cousins of all kinds with corresponding distinctions.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage includes reciprocal and affinal kinship terms in the Nggao and
    Savo materials, including terms for grandparents and grandchildren, spouses, in-laws,
    mother's brother, and sister's child.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:5
