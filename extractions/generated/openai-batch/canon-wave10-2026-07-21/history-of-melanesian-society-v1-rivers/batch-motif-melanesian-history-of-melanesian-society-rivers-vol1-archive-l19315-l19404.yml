canonical_text:
  quote: ''
  summary: The passage describes named grades of chiefly marriage in the Hawaiian
    Islands, especially marriages arranged by degrees of kinship and rank. It gives
    a Naha example involving half-sibling marriage, lists further ranked marriage
    categories, describes simple marriage ceremonies involving bark-cloth, public
    acclamation, presents, and possible sacrifices, and states that high chiefly consanguineous
    marriages aimed to maintain royal blood purity and secure successors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Naha is described as a marriage grade in which husband and wife are half brother
    and sister, commonly arising from a woman having two husbands whose male and female
    children marry one another.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Naha arrangement described, a third child would not be royal and would
    be given away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: People had to sit in the presence of chiefs of Naha rank.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'Kalola-nui is given as an example: she had Kiwalao by Kalaniopuu, then had
    Keikuipoiwa or Liliha by Kaoua, and Kiwalao married Keikuipoiwa in a Naha marriage.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Wohi is described as a marriage in which a niau-pio chiefess married a Naha
    chief, with the issue receiving the same name.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Several other marriage grades are defined by combinations of chiefly rank,
    local origin, taboo status, or commoner status, including Lo alii, Alii papa,
    Lokea alii, Lda-uli alii, Kaukau alii, and Lepo-popolo or kukae-popolo.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: For lower-grade marriages, the pair came together and lay under bark-cloth
    while those present called out a formula three times; presents were exchanged
    and sacrifices might occur.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The number of presents and sacrifices increased with the rank of the newly
    married pair.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: For a marriage of the highest grade, a large gathering was present and the
    pair united in a bark-cloth tent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: High-grade marriages of chiefs are said to have involved very close blood
    kinship between husband and wife; marriage between own brother and sister was
    described as the most desirable union, and father-daughter marriage was said might
    also occur.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that these consanguineous marriages were carried out to
    maintain the purity of royal blood.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that, for the highest chiefs, marriage functioned to obtain
    offspring and might be dissolved after two children of different sex had been
    obtained.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The author notes uncertainty about the exact nature of one marriage and says
    another account of chiefly marriage grades differs in some details.
  category: other
  evidence_refs:
  - ev:7
