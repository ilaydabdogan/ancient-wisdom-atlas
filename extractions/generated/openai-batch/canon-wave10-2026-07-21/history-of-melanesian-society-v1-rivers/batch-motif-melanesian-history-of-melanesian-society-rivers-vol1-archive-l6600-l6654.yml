canonical_text:
  quote: ''
  summary: Rivers discusses uncertain expressions about the birth and death of the
    Tamate. In the account of the Tamate roropei, a dragon-fly image called the tamate
    is made at a boy’s initiation, carried in a dance, and then burned; the burning
    is called the tamate’s death. Rivers then discusses the large number of Tamate
    societies in the Banks Islands, possible inter-island introduction, possible derivation
    from the Torres Islands or New Hebrides, and examples of new societies formed
    from a strange Norfolk Island bird and from a woman’s random design adopted as
    a society name and hat.
  language: English
  quote_policy: summarized
