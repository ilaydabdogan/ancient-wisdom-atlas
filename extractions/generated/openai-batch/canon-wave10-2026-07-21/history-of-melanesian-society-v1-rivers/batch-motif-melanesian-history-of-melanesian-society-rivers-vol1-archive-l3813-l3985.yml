canonical_text:
  quote: the sign that a man has ascended in the Sukwe
  summary: 'The passage describes evening actions after a Sukwe rank step: red-painted
    trees and cycas are set up, women leave, men play instruments and blow conch-shells,
    rank-marking trees and tabooed places are established, and payments and a pig
    feast can remove the tapu. It then gives translated songs sung on the occasion,
    including a war-song and rain-songs, and describes how men obtain personal songs
    from song-makers using formulas and mana-bearing objects.'
  language: English, with Banks Islands song texts and English translations
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Prepared and red-painted trees are set up in the evening.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the trees are set up, all women leave the village while men play the
    meretang and six conch-shells are blown with two short and two long blasts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cycas trees are planted near the door of the gamal, where they are expected
    to take root and grow, and are stated to be the sign that a man has ascended in
    the Sukwe.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Red-painted saplings now called balak are placed wherever the man who has
    taken the step wishes, usually in his garden or at the shore place where he bathes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The balak tapu the place, and only the owner may go there unless a visitor
    pays money; payment removes the tapu and requires the owner to kill a pig and
    make a feast for Sukwe members of the same rank.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Songs are sung by the dancing party on this occasion; the first is identified
    as an old war-song composed by Ristan of Santa Maria, and the second as a rain-song.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The war-song includes translated lines about speech, agreement for a fight,
    two equals, shooting a dead man in youth, sacred fame, and the fame of a bow spreading
    abroad.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: One translated rain-song includes a messenger, a day of rain flooding, sacred
    anointed lips, foam splashing as rain, the North West wind, calm on the harbour,
    and charming or piercing clouds.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Another translated song presents a speaker as the only one born there, forsaken
    and without a companion except his son Wegamal, and compares the speaker to a
    floating cloud whose voice reaches the shore.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that every man must possess a song; a man may pay a song-maker,
    who retires alone and composes with formulas and mana-bearing objects such as
    tree sprigs and sea-water, revising the song until it is perfect.
  category: sequence
  evidence_refs:
  - ev:8
