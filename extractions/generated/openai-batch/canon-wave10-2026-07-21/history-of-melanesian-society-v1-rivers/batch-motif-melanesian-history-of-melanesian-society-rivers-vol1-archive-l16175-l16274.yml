literal_observations:
- id: obs:1
  text: A canoe is named vaka, with named parts including body, outrigger connection,
    outrigger float, end decks, bow, stern, cavity, and an added plank for small canoes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Turmeric-making is described as hereditary like canoe-building, but it can
    also be learned by others; makers are called tufunga and may also be canoe-makers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The turmeric dye ango is made from turmeric root in a special house near fresh
    water, where the dyers live during the work.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The turmeric root is scraped into bowls, mixed with fresh water, settled,
    heated in smaller bowls, hardened into cakes, wrapped in bark-cloth, and later
    powdered in water with coconut-cream for dyeing cloth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: During turmeric-making, dyers must eat hot food, must not eat mammy apples
    or ripe bananas, and must not cohabit with their wives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the prepared turmeric is watery or otherwise turns out badly, the makers
    investigate whether a restriction was broken; after confession the turmeric is
    thrown away and remade.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Turmeric that is not a good dye colour may be eaten as food or used as medicine,
    and coconut-cream makes the dye redder than the pure substance.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tattooers are another class called tufunga, and the occupation may be combined
    with canoe-making and dyeing or practised separately.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tattoo pigment is made by burning fallen fua fruit so that soot collects on
    a stone; the soot powder is called refu and is kept in hollow bamboo.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A tattoo recipient chooses body parts, but the tufunga chooses the pattern
    and performs the operation with paste, a gull-bone pricker, and a light coconut-leaf
    midrib hammer.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The same men tattoo both men and women, but the patterns differ; Tikopians
    do not tattoo thighs and hips.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: Forearm tattoo patterns are described as conventionalized mango tree forms
    with lines representing a wooden pillow; other described images include an iron
    saw, fish, lofa birds, rows of elliptical patches, and lines on the back.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: Women’s forearms have the same pattern as men’s forearms, but women’s backs
    have transverse lines and additional lines from the ears along the jaws and from
    the lower lip to the navel.
  category: attribute
  evidence_refs:
  - ev:10
