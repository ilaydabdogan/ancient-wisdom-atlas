canonical_text:
  quote: ''
  summary: The passage describes a rain-making rite using stones, a shell, leaves,
    bark, water, fruit, a thunder-stone, and a chant; notes that rain stones and formulas
    in Motlav require proper purchase for mana; and records accounts of illness attributed
    to possession by ghosts or spirits, including treatments by a ritual expert and
    a dream-soul search to recover a captured soul.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rain-making rite places umbrella-palm leaves between stones and a shell
    to represent a sky full of clouds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rain-maker scrapes bark from the dirbini tree, mixes it with water, and
    puts it in a clam shell with rolemblemb leaves; these materials signify rain-clouds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A red fruit called vil is placed in the shell to represent lightning, and
    a special stone is used to represent thunder.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The rain-maker covers the shell with umbrella-palm leaves, leaves an opening,
    chants into the shell, and then completely closes the opening.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Stopping the rain is described as removing the umbrella-palm leaves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: In Motlav the stones used in the rite may be sold, with the appropriate formula
    taught at the same time; the stone is said to have no mana unless bought.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Certain forms of illness are attributed to possession by a tamate, possession
    by a vui, or capture of the atai or soul by a vui.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A hostile tamate may enter a person; if several enter, the man becomes raving
    mad, extremely strong, and swift, and must be caught and held down by several
    men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: For adult tamate possession, fire is lit, bunches of the scented shrub sav
    are heated and placed over the sick man's nose, and the patient calls out the
    names of the tamate while convulsed before becoming calm and recovering.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A possessed child is treated by a gismana, who strokes the child's body, blows
    on its eyes, spits, yawns, calls out the tamate's name, and extracts it the same
    day.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: For possession by a vui, the gismana finds the place inhabited by the vui
    and asks the man whose sacrificing place it is to call the vui back to its usual
    haunt, after which the sick person recovers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: If the atai or soul has been taken by a vui, the gismana makes and drinks
    a leaf potion before sleep; dreaming indicates that his own atai has left his
    body to search for the vui.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The sick person's soul may be hidden on a tree branch or in a hole in a rock,
    while the vui attempts to keep it by blocking the way with stones or another obstacle.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: The gismana's soul tries to seize the sick person's soul and may be helped
    by a friendly vui that takes the soul from the hostile spirit and hands it over.
  category: action
  evidence_refs:
  - ev:7
