  summary: The passage surveys marriage regulations and kinship terminology in several
    Solomon Islands and Bougainville contexts. It discusses the presence, absence,
    or inferred former presence of cross-cousin marriage; a Ysabel rule barring marriage
    with a woman from whom a man has received food; regional prohibitions based on
    genealogical relationship; and recurrent kinship-term correspondences interpreted
    by the author as results or survivals of cross-cousin marriage. It then begins
    an account of the Buin relationship system of Bougainville.
  language: English
