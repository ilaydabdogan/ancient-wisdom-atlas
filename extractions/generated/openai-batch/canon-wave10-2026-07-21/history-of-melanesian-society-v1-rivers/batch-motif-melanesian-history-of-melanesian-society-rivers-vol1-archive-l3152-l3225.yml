canonical_text:
  quote: ''
  summary: The passage describes Banks Islands Sukwe/gamal rank restrictions and initiation.
    It explains former penalties for entering a higher compartment, the ages and expenses
    of initiation, the need for an introducer, a prerequisite Tamate society initiation
    for higher rank advancement, and a specific initiation example in which John Pantutun
    introduces Mark to Kwatagiav through pig presentation, conch-shell blasts, a smacking
    gesture, transfer of the pig, and collection of money.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Use of each gamal compartment was formerly limited to members of its proper
    rank; a man entering a compartment even one degree above his own would have been
    trampled to death, though the restriction is described as becoming lax.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: First initiation may occur in infancy, at entrance into manhood, or later;
    in infant initiation, essential ceremonies are performed by the introducer.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man who cannot enter the Sukwe must feed with women; a friend may act as
    introducer for him, despite the large expense and likely loss involved.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Initiation need not proceed through every rank from the lowest, but direct
    entry into a higher rank requires difficult and expensive conditions, so entry
    usually occurs low down.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: No one can pass beyond the rank of Tamatsiria without first being initiated
    into the Tamate society called Tamate Iwoa or Tamate Izwoa.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the example, John Pantutun proposes to introduce Mark to Kwatagiav; Mark
    is saddened because he lacks enough money and may refuse.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: If Mark consents, John announces the action for Kwatagiav; Mark brings a pig
    and ties it to a stake near the gamal door.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A man blows a conch-shell five times, with three long continuous blasts and
    two interrupted blasts; Mark then smacks the pig on the back while a bystander
    states the ritual action.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the smacking action, the pig becomes John's property; if Mark does not
    have enough money, initiation is delayed while he collects the necessary sum.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: For Kwatagiav, the candidate is said to produce sixty fathoms; Mark may distribute
    ten fathoms to ten friends and later receive two fathoms back from each, doubling
    the amount.
  category: action
  evidence_refs:
  - ev:10
