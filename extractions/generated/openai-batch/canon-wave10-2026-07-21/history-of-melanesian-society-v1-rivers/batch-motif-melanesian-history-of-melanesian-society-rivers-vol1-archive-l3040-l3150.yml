canonical_text:
  quote: ''
  summary: The passage introduces the Banks Islands Sukwe organization, distinguishing
    a village-based men's ranked organization from bush-based ghost societies. It
    describes the gamal men's house with rank compartments and ovens, a restricted
    marked path leading to a bush lodge called salagoro, decorated stone platforms
    called wona associated with kolekole dance ceremonies, and named Sukwe ranks whose
    names correspond to tamate images carried or worn as hats or masks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The Banks Islands Sukwe organization is described as having two main divisions:
    the village Sukwe and bush-based Taniate or ghost societies.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In every village there is a gamal, a building generally used by men only,
    where men sleep and eat.
  category: setting
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:3
  text: The gamal is divided into compartments connected with divisions or ranks of
    the Sukwe.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each gamal compartment has an oven, and fires of these ovens are used to prepare
    men's food on important occasions.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A less-used bush path at a fork is marked or decorated with a cycas tree,
    hibiscus tree, or decorated stake to indicate prohibition to everyone except initiated
    persons.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The restricted bush path leads to a building or clearing called a salagoro,
    described as the lodge of one or more Tamaie societies.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Decorated stone platforms called wona may have decaying remains of masks or
    other objects on them.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The decorations of a wona may be relics of a kolekole ceremony, whose most
    obvious feature is a dance.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Kolekole ceremonies are described as connected with the Sukwe and Tamate societies
    and as public affairs involving both initiated and uninitiated participants.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: In Mota, named divisions or ranks of the Sukwe are listed, and their names
    are said to correspond with images called tamate, which may be carried or worn
    as hats or masks.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The size and condition of a gamal can reflect how many Sukwe ranks have members
    in that village.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Each man sleeps and eats either in the compartment of his own rank or in one
    belonging to a lower rank.
  category: action
  evidence_refs:
  - ev:7
