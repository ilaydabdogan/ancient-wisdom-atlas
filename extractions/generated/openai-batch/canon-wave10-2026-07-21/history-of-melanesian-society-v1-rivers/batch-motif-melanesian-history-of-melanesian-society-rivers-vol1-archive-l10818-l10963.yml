canonical_text:
  quote: ''
  summary: 'The passage discusses Santa Cruz descent reports, animal and plant names
    of social groups, and a kinship terminology collected by Durrad. It then describes
    functions of relatives: the father''s sister takes a newborn on the third day
    and contributes to child feasts, arranges a nephew''s wife with feather-money,
    and avoidance rules require a man and his mother''s brother''s wife not to see
    each other. A widow may not marry her husband''s elder brother, whom she may neither
    speak to nor see, but may marry a younger brother.'
  language: English
  quote_policy: summarized
