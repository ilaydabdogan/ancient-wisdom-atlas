canonical_text:
  quote: ''
  summary: 'The passage describes Banks Islands childbirth customs: restricted attendance
    by classificatory female kin, secrecy around birth, cutting and treatment of the
    umbilical cord, burial of the afterbirth under the house fireplace, infant and
    parental seclusion, kin obligations involving the cord and nail-parings, attitudes
    toward twins, labor-opening actions by the husband, food taboos related to entanglement,
    and restrictions on the father and visitors after birth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman’s own mother and sisters and the husband’s own mother or sister
    do not attend childbirth; women called mother or sister through the classificatory
    system attend, and the husband’s own sister chooses one as midwife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An impending birth is kept quiet to limit visitors who would require payment
    and because adoption customs can make secrecy desirable.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The umbilical cord, called gaputoi, is divided with a bamboo knife, and a
    steel knife would not be used for this purpose.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The afterbirth is buried under the house fireplace, a fire is kept burning
    above it, and the fire is extinguished if the child’s navel becomes inflamed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The child is kept in the house until strong because the afterbirth is considered
    part of the child and remains in the house; the fireplace area is called nigina,
    or nest, and the afterbirth is regarded as the child’s house before birth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the remaining cord separates, it is wrapped in umbrella-palm leaf, offered
    by the father to his own sister, then given to a classificatory sister who wears
    it around her neck until the child is about two years old, after which the father
    must give a feast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the feast, the wrapped cord is hung in the rafters of the house above
    the fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The father’s sister may keep the child’s or later adult nephew’s nail-parings
    around her neck, and this may require the father or nephew to provide a feast.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Same-sex twins are regarded as good; boy-and-girl twins are regarded as man
    and wife, but the informant did not know what was done, and the author says they
    were probably killed in old days.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before birth, firewood, torches, and coconuts are brought into the house;
    when labor pains begin, the husband opens covered things, removes strings from
    bowls and doors, and takes down hanging objects.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: During pregnancy, the woman must not eat fish caught with a net or hook, but
    may eat fish shot with an arrow; the stated rationale is that the child might
    otherwise be entangled and not come forth freely.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After childbirth, the parents remain in the house; the father does no work
    for five days, avoids hard work for one hundred days, and avoids food or places
    connected with an oloolo rite because of danger to the child.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Visitors coming from the beach or from a distance must wait outside before
    entering the house after childbirth.
  category: action
  evidence_refs:
  - ev:11
