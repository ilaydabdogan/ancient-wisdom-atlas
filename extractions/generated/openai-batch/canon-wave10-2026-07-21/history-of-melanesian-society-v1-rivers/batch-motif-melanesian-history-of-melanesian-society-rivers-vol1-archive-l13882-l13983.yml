canonical_text:
  quote: ''
  summary: The passage defines several kinship terms, describes changes in address
    after parenthood, compares Navatusila and Dhawanisa relationship systems with
    Nandrau, and records Navatusila sacred animals, food prohibitions, and beliefs
    in descent from animal ancestors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raivanggu is used reciprocally by women for a brother's wife and a husband's
    sister; the passage says it has the same meaning as the Mbau ndaiivenggu for marriage
    relationship.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kawa means descendant and is used by a man for persons descended from himself,
    especially where the separation is great.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a man is vasu to a matanggali, he calls all members of that matanggali
    vakuvu.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Karu is applied reciprocally by the two wives of one man.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: A son or daughter's designation changes after he or she becomes a parent;
    a son with a child is called luverau by both parents, and the passage gives examples
    in which a man is called the son of his own child.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Navatusila and Dhawanisa relationship systems were investigated by the
    genealogical method and are said to have the same general characters as Nandrau,
    although many actual terms differ.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Navatusila information came from one interview with an old man, and the
    author states that the account has many omissions and likely inaccuracies.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sacred animal of the whole Navatusila people is the nganivatu, a fish-hawk,
    and no member of the tribe may eat it.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Several Navatusila matanggali have specific forbidden animals: Tuivandrasinga
    may not eat the dhongge pigeon; Ivisi, Nanoko, and Yasawa may not eat dog; Naremba
    may not eat the remba bird; Namarama may not eat fowl; Naviaraki and Tambaivunanggumu
    have no separate forbidden animal beyond the common tribal one.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Navatusila as a whole believe they are descended from the nganivatu, and
    matanggali with sacred animals also trace descent from those animals.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The author could not find Navatusila matanggali subdivisions corresponding
    to the itokatoka of some tribes.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: Navatusila kinship terminology includes momo for father and father's brother,
    nene for mother, tadhinggu for son's son and younger brother, koko for mother's
    brother, tamdani for mother's brother's wife, ngwanita for father's sister, and
    vasu for sister's children.
  category: speech
  evidence_refs:
  - ev:8
