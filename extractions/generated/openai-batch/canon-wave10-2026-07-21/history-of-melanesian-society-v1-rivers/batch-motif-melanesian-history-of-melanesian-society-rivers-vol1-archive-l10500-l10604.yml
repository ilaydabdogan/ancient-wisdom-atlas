canonical_text:
  quote: ''
  summary: The passage describes kava-drinking rules and practices in Pentecost, including
    food abstention, reciprocal preparation, a rich man's sugar-cane display, mortuary
    use, and an origin story in which a man imitates a rat that repeatedly collapses
    and revives after eating kava root. It then describes brother-sister avoidance
    in Lepers' Island/Oba after the sister's puberty tattoo, related avoidance gestures
    and death observances, possible brother-brother respect, conjectured reasons for
    avoidance, relations with a sister's son, paternal-aunt mediation in sexual and
    marital matters, and the beginning of an Anaiteum kinship terminology section.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man must not eat before drinking kava; food may be kept until afterward,
    and putting food into a basket can indicate an intention to drink kava.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kava may be made by one man for himself, but more commonly two men prepare
    it for one another; groups may form pairs, and the paired action is called a fight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stated purpose of the paired kava-making called a fight is for each man
    to make his companion incapable and unable to eat.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: After drinking, a rich man takes sugar-cane in his mouth, spits or shoots
    it out, and gives a long cry that signals his wealth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: People in Pentecost drink kava daily without special ceremony, and kava is
    also used at post-death feasts, especially on the tenth and hundredth days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Pentecost story says a man saw a rat nibble kava root, fall down, and later
    come to life again several times; the man then tried the root, beginning kava-drinking.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Lepers' Island, also called Oba or Omba, is identified as the only known part
    of southern Melanesia with definite brother-sister avoidance, according to information
    from John Pantutun.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: In Lepers' Island a brother and sister do not see one another after the girl
    is tattooed around puberty; if she has a brother, the girl leaves her parents'
    house and lives with her mother's brother.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: If brother and sister meet on a path after separation, the girl gets out of
    the way and both look down to avoid seeing one another.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Brother and sister do not say each other's names or speak of one another.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: If a brother wants to visit his sister's house to see his nephew, the boy's
    mother leaves the house before her brother enters.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'Brother-sister avoidance continues after death: if one dies, the other does
    not enter the house where the corpse lies but mourns outside.'
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: 'A possible trace of similar avoidance or respect between brothers is reported:
    a man stops laughing and becomes quiet when his brother arrives.'
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: John Pantutun reported that he asked why brother and sister avoided one another
    but received no explanation; he conjectured that the purpose was to avoid possible
    sexual relations.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: The relations between a man and his sister's son in Lepers' Island are said
    to be of the same kind as in the Banks Islands.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:16
  text: A report from Mota says a woman in Lepers' Island seeking illicit intercourse
    with a man first approaches the man's paternal aunt for consent; the father's
    sister also chooses a wife for her nephew and arranges more transient relations.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:17
  text: The Anaiteum kinship terms in the passage were collected from three boys at
    Vila, compared with forms given by Inglis, and include terms for father/father's
    brother and mother-related categories.
  category: other
  evidence_refs:
  - ev:14
