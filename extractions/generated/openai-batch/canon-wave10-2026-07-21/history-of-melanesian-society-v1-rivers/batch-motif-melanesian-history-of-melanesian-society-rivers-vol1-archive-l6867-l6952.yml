canonical_text:
  quote: ''
  summary: 'The passage first notes named decorative belt patterns, including a modern
    tamate design copied from lantern glass and a gapagapa pattern also used in head
    decoration. It then describes a kolekole ceremony connected with Sukwe rank hats:
    preparation and abstinence, commissioning and making the hat, exclusion of women
    and uninitiated persons during an initiated procession, pig and money payments,
    return and reopening of movement, permitted tree-cutting, and the next day''s
    public singing, dancing, hidden decorated men, and pig-bladder performance.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A leaf-belt design is described as a modern tamate called tironin or glass,
    said to have been copied from the glass of a lantern.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The word gapagapa is reported to denote both a design on a plaited belt and
    a swallow-form pattern used in head decoration.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The described kolekole concerned the hat of the Kworokworolava rank of the
    Sukwe, and the passage says a man might kole the hat of any division, including
    a superior one, or all hats at once.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before a kolekole, objects and decorations are prepared, and men abstain from
    sexual intercourse while engaged in that preparation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man who decides to kole a hat orders it from a mao, specifying whether it
    should have a carrying handle or be hollowed so it can be worn on the head; the
    hat is made in the salagoro.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the hat is ready, the werewere sound is made, and women and uninitiated
    persons leave the dance region for a place near the beach beyond a boundary path.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The procession begins at the salagoro and is ordered with the werewere sound-maker
    first, the hat-carrier next, initiated persons following, and the hat-maker at
    the rear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The man giving the kolekole waits in the village; when the procession arrives,
    a pig is killed for participants, and a live pig and money are given to the hat-maker.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The hat is put in the gamal, the procession returns to the salagoro with the
    werewere sound, and after the sound ends the covering of the stick called sur
    is burned and uninitiated persons are told they may move freely again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: During the procession, members may cut down coconuts, breadfruit, or bananas,
    but not yams or taro; owners do not complain and profess to regard the destruction
    as a joke.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the following day proceedings are open to all; people assemble, men have
    decorated heads in various colors, and the preparation of hair and decorations
    may take all night and use secret processes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The kolekole giver orders bamboo drums to be beaten; people sing, and a woman
    dances around the singers until a hundred songs have been sung.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Decorated men remain hidden until after the hundred songs and women's dances;
    then they emerge in pairs from different directions carrying inflated pig bladders,
    dash the bladders against a tree, stand in a row, and dance.
  category: sequence
  evidence_refs:
  - ev:8
