canonical_text:
  quote: ''
  summary: The passage describes Banks Islands inheritance and property rules through
    examples involving garden plots, kinship-defined payment duties, common land among
    descendants, separate ownership of trees and land, a dispute over a ngai or nut
    tree, letting land for money, non-land property inheritance, and the after-death
    ceremony called rave epa in which money strings are drawn from the corpse and
    assigned to possessions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several named garden plots are described as passing to, being used by, or
    being partly owned by relatives, with money payments affecting some claims.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: John may pay money for Alice because he is regarded as Alice's brother, while
    Robert is regarded as the father of Alice; the passage says these relationship
    terms carry duties and responsibilities.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A common patch left after Takwale's children received portions remains common
    and is used by all living descendants of Takwale.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ownership of trees is described as distinct from ownership of the land on
    which the trees stand.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A planter on unrelated land uses a tree's produce, but his son can inherit
    the tree right only by paying the landowner; otherwise the tree becomes the landowner's
    property.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A dispute is reported over a ngai or nut tree, with Rorolea claiming possession
    and demanding money if Robert and John are to continue as its owners.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Land may be let by its owner to another person in return for money, especially
    when the land is distant from the owner's home.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: For property other than land, children are said to inherit at the present
    time, but the sister's son retains or formerly held strong succession rights.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the rave epa ceremony after death, the corpse is covered with strings of
    money, and a child of the deceased draws them away one by one while naming possessions
    such as the garden and pigs.
  category: action
  evidence_refs:
  - ev:8
