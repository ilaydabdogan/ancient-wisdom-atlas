  text: Tikopia has sacred places called ngange, where women may not go, and these
    places contain graves of ancestors.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other restricted places bar common people, some may be visited by chiefs,
    and some places with bones and skulls on the ground may not be visited even by
    chiefs.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: No ceremony is performed at these sacred or tabooed places, and John is said
    to have visited some of them without evil effects; some islanders then followed
    his example.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Tikopians are described as becoming possessed by atua or ancestral ghosts;
