canonical_text:
  quote: ''
  summary: The passage describes Tikopian sacred and taboo places associated with
    ancestral graves and remains; rules of possession by atua or ancestral ghosts;
    possession as a means of learning the fate of absent people, questioning the dead,
    and foretelling events; a case involving revenge for deaths in the Reef Islands;
    intervention by John and Motlav teachers to prevent a later killing; and a betel-feeding
    procedure before questioning a possessed person.
  language: English
  quote_policy: summarized
