canonical_text:
  quote: ''
  summary: The passage introduces Fijian relationship systems from Viti Levu and contrasts
    coastal and interior forms. It tentatively describes interior tribes divided into
    matanggali and sometimes itokatoka, with chiefs, endogamy, dialects, past warfare,
    shared sacred animal or bird objects that members may not eat, men's houses, common-ancestor
    beliefs, and some chiefly/commoner or occupational differentiation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Relationship systems were obtained from coastal and interior parts of Viti
    Levu; previously recorded Fijian systems were described as classificatory and
    connected with cross-cousin marriage.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author reports that some mountainous north-eastern Viti Levu systems differ
    fundamentally from previously recorded systems, while coastal systems also vary
    by locality.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The coastal organization, especially in the Mbau and Rewa districts, is described
    as highly developed through the welding together of formerly separate elements,
    probably influenced by European contact.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The description of interior organization is explicitly presented as tentative
    and incomplete because of limited time.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: People of the mountainous interior are divided into small independent bodies
    with the same names as their districts; examples include Nandrau or Navuta, Navatusila,
    and Dhawanisa.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Each primary body is divided into matanggali, and in some cases matanggali
    are divided into smaller itokatoka.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:13
- id: obs:7
  text: Each primary body has a chief or chiefs and is bound together by common possession
    of a more or less sacred object, usually an animal and often a bird, which members
    may not eat.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Primary bodies are described as largely endogamous, often having their own
    dialects, and formerly engaging habitually in warfare with one another.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Matanggali are also described as largely endogamous, and some have a sacred
    animal object that members may not eat although other tribal members may eat it.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Men of a matanggali slept in the same mbure, or men's house, and each matanggali
    had its own mbure.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: There is usually a belief that members of a matanggali descend from a common
    ancestor; the Talandrau, chief matanggali of the Nandrau, trace descent to a light-coloured
    man named Talandrau who came to Viti Levu from another place.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: Some matanggali have different functions, including a distinction between
    chiefly and ordinary matanggali and sometimes special occupations among ordinary
    matanggali.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: A cited note reports that such tribes often take their names from trees and
    less often from animals.
  category: attribute
  evidence_refs:
  - ev:12
