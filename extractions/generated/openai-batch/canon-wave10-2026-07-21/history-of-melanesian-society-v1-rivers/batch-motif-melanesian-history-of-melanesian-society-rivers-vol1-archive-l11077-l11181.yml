canonical_text:
  quote: ''
  summary: The passage describes Vanikolo kinship and affinal obligations, property-taking
    rights among relatives, life-cycle practices involving trees and weapons, and
    an annual male ritual directed to the moon, the heads of the dead, and the mountain
    for protection and agricultural abundance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Offenses against rules of relationship by marriage require payment of turtle-shell
    and pigs; turtle-shell is described as Vanikolo money, with rings valued more
    highly than flat pieces.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A mother's brother helps his nephew buy a wife and cooperates with him in
    gardens, compensation payments, fighting, canoe-making, and fishing; the nephew
    accompanies and strictly obeys him and may take his belongings.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man respects and obeys his father's sister; she helps pay the wife's people
    and may exchange property-taking rights with him, though to a lesser extent than
    his right over her property.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person is said to mould life on that of the mother's parents, including
    sacrificing and planting gardens where they did.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the death of a person's parents, nearly all coconut trees possessed by
    them are cut down, and bows and arrows of the dead parents and of the surviving
    person are destroyed and remade.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: At the birth of a child, the parents plant many coconut and Canarium nut trees.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The moon is identified as the Vanikolans' leno'i or vui, is worshipped, and
    is credited with creating them and the whole world.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Moon worship takes place in a special large, high house about a hundred yards
    from the village; only men and boys gather there, and women are excluded.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The ritual house door faces the mountainous interior because the dead go to
    the mountain and the door gives worshippers the direction of their future home.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Inside the ritual house are a platform, red-painted wood pieces, coconut leaves,
    red pointed posts, three round stones, rows of skulls, and cold food offerings.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: Chiefs build or lead the rite, pray before the platform, and address the heads
    of the dead, the moon, and the mountain for protection from enemies and for abundant
    gardens and goods.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The offered food is distributed and eaten after the prayers; the ceremony
    is annual, occurs when taro is ready for digging, and the skulls are later kept
    in bowls in houses.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: After the feast, each man drinks kava, pours out the dregs, and prays to the
    heads of the dead, the moon, and the mountain for a plentiful kava crop.
  category: action
  evidence_refs:
  - ev:11
