  summary: The passage describes Rivers's collection of Fijian relationship terms
    and pedigrees, difficulties caused by the spread of the Mbau dialect, comparison
    with earlier fieldwork among the Todas, features of mountain pedigrees, the need
    to record possessive forms, and the beginning of a list of Mbau coastal kinship
    terms.
