literal_observations:
- id: obs:1
  text: Kaikunane and kaikuhine are terms used between persons of opposite sex within
    the same generation; a woman applies kaikunane to her brother and related men
    of her generation, while a man applies kaikuhine to his sister and related women
    of his generation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kupuna denotes grandparents and others of their generation with traceable
    relationship, and it also extends to more remote ancestors with added generational
    markers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sex distinctions for grandfather and grandmother are made by adding kane and
    wahine or hine.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Moopuna denotes grandchild and others of that generation and is the reciprocal
    of kupuna; it also extends to more remote descendants with added generational
    markers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that the listed terms are the only terms for blood relatives,
    with one term for each older or younger generation except makua, and four same-generation
    terms depending on sex and seniority.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kane is used for husband and also by a woman for her husband’s brothers and
    for her sister’s husband.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Wahine is used for wife, the wife’s sisters, and the brother’s wife.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hunoai or makua hunoai denotes parent-in-law, with sex distinguished by kane
    and wahine; hunona denotes son-in-law or daughter-in-law.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Punalua is used reciprocally by husbands of two sisters or wives of two brothers,
    and also for co-husbands of a woman and for a wife’s paramour.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Kaikoeke is used for certain in-law relationships involving a spouse’s sibling
    or a sibling’s spouse, with brother and sister used in a wide sense.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Punalua and kaikoeke are applied reciprocally by persons of the same sex,
    while kane and wahine are used between persons of opposite sex.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: On Oahu, brothers-in-law and sisters-in-law may be distinguished as makua
