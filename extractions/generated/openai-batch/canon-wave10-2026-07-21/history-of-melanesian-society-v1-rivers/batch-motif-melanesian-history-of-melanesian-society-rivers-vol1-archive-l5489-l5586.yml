canonical_text:
  quote: ''
  summary: A narrative recounts how Weav, glossed as fire, discovers and repeatedly
    sleeps beside the motar, causing her to embrace him. Wetmatliwo discovers this,
    asks the motar to sweep and sing while he dances, then withdraws into the pit
    from which he came. The motar gives him a pig and a rawe, but he sinks into Panoi;
    the passage explains this as the reason initiates into Tamate liwoa must give
    both a pig and a rawe. It then identifies a black volcanic stone at Petanpatapata
    as Tamate liwoa and begins an ethnographic list of Tamate societies, their initiations,
    hats, masks, and badges.
  language: English
  quote_policy: summarized
