canonical_text:
  quote: ''
  summary: The passage describes Tikopian rules for passing and visiting houses, gendered
    occupations, limited male crafts called tufunga, and the making of canoes, including
    selection of a tree, feeding and payment of craftsmen, launching and fishing sequences,
    reciprocal food distributions, a chiefly kava offering, hereditary craft transmission,
    and trial manufacture by a novice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People passing others who are sitting ask leave to pass with a greeting formula;
    several men going together do the same.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man passes upright, while a woman passing bends down slightly with her hands
    between her thighs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a man passes without the proper greeting, others suppose he is angry; he
    must return, sit near those passed, explain carelessness, and have his apology
    accepted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When passing a chief, a man goes by on his hands and knees.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A visitor calls the house occupant’s name from a distance and enters only
    if invited; if only the wife is at home he goes away, while near relatives may
    enter without invitation.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women usually cook, make bark-cloth and fine mats, do most garden work, carry
    much garden produce, and collect firewood; loads are carried on the shoulder,
    not on the head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Men build houses and catch most fish; canoe-building, turmeric-making, and
    tattooing are limited crafts performed by craftsmen called tufunga.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A man wanting a canoe goes to two tufunga, who recruit helpers, inspect the
    chosen fetau tree, and if it is suitable have it hewn down and hollowed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: While the canoe is made, the future owner feeds the tufunga and workers three
    meals a day, catches fish for them, and gives them coconuts and betel; when the
    canoe is ready, the makers are paid.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The canoe builders launch the canoe first without the owner, catch flying
    fish, roast and eat the catch, polish the canoe with coral, and later exchange
    food distributions with the owner.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The owner’s first trip in the new canoe is with the tufunga; they catch flying
    fish, beach the canoe at the owner’s village, and the owner divides the catch
    among those who accompanied him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: When a chief wants a canoe, he chooses two of the best tufunga and twenty
    men; at the chosen tree all sit around it while the chief makes a kava offering.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Canoe-making is usually hereditary from father to son, though others may learn;
    a prospective maker first makes a model canoe and, if approved, makes a real canoe
    alone in the bush.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: A man making a canoe on trial must cut down the tree single-handed; canoe-makers
    also make paddles and bowls for kava.
  category: action
  evidence_refs:
  - ev:8
