canonical_text:
  quote: ''
  summary: The passage records kinship terms and affinal terms for several Fijian
    mountain groups, then describes the Dhawanisa, including named matanggali, descent
    from a small aquatic animal called the ndravindravi that the tribe may not eat,
    a doubtful restriction involving unripe wild banana, and variations in kinship
    terminology compared with Nandrau, Navatusila, and a closely allied Nggaliyalatini
    dialect.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the preceding kinship account, father's father is called tutua, father's
    mother and mother's mother are called tatai, and reciprocal or affinal terms include
    tavale, vikila, nonggu vitambui, and vunonggu.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Dhawanisa are reported to include matanggali named Leiekumba, Nakorosovivi,
    Votualevu, Nambetongondrongondro, Nambelanga, Nandala, Numbu, and Keti.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The whole Dhawanisa tribe traces its descent from a small aquatic animal called
    the ndravindravi, which they may not eat.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author could not discover animals peculiar to individual Dhawanisa matanggali.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Dhawanisa were said not to eat the soanga or wild banana when it was not
    fully ripe, but the author considered it very doubtful that this was due to sacred
    character.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Among the Dhawanisa, chiefs call the father momo, while ordinary people call
    the father vava.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Momo is also used for the mother's brother and for the father of a chief,
    with the mother's brother sometimes distinguished as momo ngwandi.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Dhawai is applied both to the husband of the father's sister and to spouses
    of male or female vasu, which the author identifies as another case of a term
    applied to alternate generations.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Informants differed about Dhawanisa grandparent terms, possibly because one
    used the closely allied Nggaliyalatini dialect; the author inferred a tendency
    to use tatai or nggu tai for grandparents and viangonggu for grandchildren, except
    in one male line case.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The term tavale is used for the child of the mother's brother or father's
    sister, for the reciprocal relationship between sister's husband and wife's brother,
    and for the wife's sister.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Brother's wife and husband's brother call one another langgu vitambui, and
    a man calls his wife langgu alewa; a reported husband term was uncertainly attributed
    and may belong to the Nggaliyalatini dialect.
  category: speech
  evidence_refs:
  - ev:5
