canonical_text:
  quote: ''
  summary: The passage describes Tikopian ceremonial kava offerings at graves and
    for rain, healing, journeys, agriculture, canoe-making, and fishing. It explains
    kava preparation and recounts a hurricane and drought interpreted by some Tikopians
    as caused by angered atua because kava had not been sufficiently offered. It then
    describes plant atua associated with Tikopian divisions and yam-garden planting
    and harvest rites involving kava, sacred patches, chiefs, and first-yam pudding.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women are not present at ceremonial kava offerings made at graves of men and
    women.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kava is offered for rain in the same manner as other offerings, with prayers
    adapted to that purpose, though the exact words were not known to John.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kava is also offered before a boy is incised, when a chief attempts to cure
    a sick person, before a journey, in agricultural contexts, before cutting a tree
    for a chief's canoe, and at the cooking of the first catch of certain fish.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kava root is chewed by a man other than the chief who will make the offering,
    strained, and prepared in a bowl called a kumete.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The kava plant is grown on the island, but the prepared kava is used only
    ceremonially and is not drunk.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: After a hurricane destroyed or damaged coconut trees and houses, people thought
    the atua had sent the storm because they were angry about insufficient kava offerings.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A drought followed the hurricane, daily kava offerings were made to bring
    rain without immediate result, and John prayed for rain after being asked for
    help.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Rain fell three days after John's prayer, and taro and yams grew again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: People disagreed about whether the rain resulted from John's intervention
    or from the atua accepting the prolonged kava offerings.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Certain plants are called atua and are associated with different Tikopian
    divisions.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Yams are sacred to the Kafika, and the top of the yam is especially regarded
    as an atua; yam skin is removed with a shell rather than a knife.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Taro is sacred to the Taumako, whose members regard the eye of the tuber as
    especially the atua and object to using a knife in preparing it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Tafua have the coconut as their atua and open it with a stone rather than
    a knife.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Fangarere have no corresponding sacred object but join the Kafika in yam
    ceremonies.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: When a new yam-garden is made, kava is offered at an ancestor's grave, and
    Kafika and Fangarere people cut bush and burn undergrowth at night.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: In a special patch called puke tapu, the chief of the Kafika plants the first
    yam, the chief of the Fangarere the second, and the chief of the Kafika the third;
    afterward others plant.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The yam-stick or koso used for digging is kept in the chief's house for the
    following year.
  category: object
  evidence_refs:
  - ev:10
- id: obs:18
  text: When yams are ready for digging, the Kafika chief offers kava at the puke
    tapu before the crop is taken from the ground.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:19
  text: A pudding is made from the first-planted yams; after the Kafika and Fangarere
    chiefs offer kava and pray, the chiefs eat part of it and the people follow.
  category: sequence
  evidence_refs:
  - ev:11
