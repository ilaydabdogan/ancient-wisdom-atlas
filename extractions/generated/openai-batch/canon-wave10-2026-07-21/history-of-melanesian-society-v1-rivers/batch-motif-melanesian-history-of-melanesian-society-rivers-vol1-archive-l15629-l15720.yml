candidate_motifs:
- id: motif:1
  label: Ceremonial offering as exchange with sacred recipients
  taxonomy_refs:
  - sacred_exchange
  basis: Kava is repeatedly offered at graves, to bring rain, and in agricultural
    rites; people debate whether rain came because the atua finally accepted the long-continued
    kava offerings.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage is ethnographic ritual description rather than a mythic narrative;
    the recipient of every offering is not always specified.
- id: motif:2
  label: Rainmaking through offering and prayer
  taxonomy_refs:
  - water
  basis: Kava offerings are made when rain is desired; during drought daily offerings
    are made for rain, and John prays for rain that falls three days later.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage reports differing Tikopian interpretations and does not resolve
    causation.
- id: motif:3
  label: Sacred anger expressed through storm and drought
  taxonomy_refs:
  - divine_judgment
  basis: People thought the atua sent the hurricane because they were angry that not
    enough kava had been given, and drought followed.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: This is explicitly presented as what the people thought; the passage does
    not present a full judgment myth.
- id: motif:4
  label: Agricultural seasonal rite from planting to first-fruits eating
  taxonomy_refs:
  - seasonal_cycle
  - sacred_exchange
  basis: The yam cycle includes kava at an ancestor's grave, first planting in a sacred
    patch, preserving the yam-stick for the next year, kava at harvest, and ceremonial
    eating of pudding from first-planted yams.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The described cycle is localized to yam agriculture and associated divisions.
- id: motif:5
  label: Plant atua as social-division sacred affiliations
  taxonomy_refs: []
  basis: Yam, taro, and coconut are called atua or have parts especially regarded
    as atua for Kafika, Taumako, and Tafua divisions, with rules for preparation.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: No supplied taxonomy ref directly matches this plant-affiliation pattern.
- id: motif:6
  label: Ritual action before liminal undertakings
  taxonomy_refs:
  - initiation
  - departure
  basis: Kava is offered before a boy is incised and before a Tikopian undertakes
    a journey.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage only briefly lists these occasions and gives few details about
    the incision or journey rites.
- id: motif:7
  label: Avoidance of knives for sacred plant foods
  taxonomy_refs: []
  basis: Yams are prepared with a shell, taro is not to be prepared with a knife,
    and coconuts are opened with a stone.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The text records an objection to knives but does not explain its rationale
    beyond the plants' atua status.
