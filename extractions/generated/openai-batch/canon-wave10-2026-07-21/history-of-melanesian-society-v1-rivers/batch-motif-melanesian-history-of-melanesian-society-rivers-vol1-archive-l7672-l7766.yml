  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'In Motlav, a similar belief is reported: if a mother has found an animal
    before childbirth, the child is identified with that animal, may not eat it, and
    has its characters.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: In Motlav, a woman who wants her child to have certain characters may frequent
