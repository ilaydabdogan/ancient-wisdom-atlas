canonical_text:
  quote: ''
  summary: The passage describes Banks Islands and Motlav beliefs linking a child
    with an animal or fruit found by the mother before childbirth. The identified
    child must avoid eating that animal or fruit, and in some cases must avoid touching
    the tree. Violation may cause illness or madness. The passage explains the prohibition
    as grounded in the idea that eating the animal would be like eating oneself. It
    also describes beliefs that children take on physical or mental characteristics
    of the associated animal or fruit, notes that these prohibitions do not regulate
    marriage or pass to descendants, and distinguishes them from other individual
    food abstinences connected with magic, medicine, and mourning.
  language: English
  quote_policy: summarized
