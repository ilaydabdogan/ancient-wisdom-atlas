canonical_text:
  quote: ''
  summary: The passage describes Tikopian mourning practices, offerings at graves,
    the reported absence of magic, categories of sacred beings called atua, an atua
    who drew Tikopia up from the sea and named it, and offerings to ancestral atua
    associated with fish and graves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A widow marks her loss by fasting, burning her face with a brand from the
    fire, cutting off and wearing her husband's hair, breaking her ear lobes, keeping
    her hair short, remaining in the house for a year, and not remarrying.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A widower cuts his hair and keeps it short for one or two years.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: For the first ten days after death, food and kava offerings are made daily
    at the grave, with betel usually offered as well.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Food offerings and occasional betel offerings continue indefinitely, while
    kava offerings become less frequent and then occur every six months after six
    months have passed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator reports that Tikopian culture, according to John, lacked practices
    that could be called magic, unlike the malignant magic John knew from the Banks
    Islands.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: All sacred beings are called atua; many are described as ghosts of ancestors,
    while others are animals connected with social divisions or plants.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: One atua is said to have produced the island of Tikopia from the depths of
    the sea by letting down a line and drawing it up, and to have given the island
    its name.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Atua are said to enter into fishes, and offerings made at sea during canoe
    journeys are said to be directed to ancestral atua that enter fish, especially
    the shark and the one.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Offerings to ancestral atua after death are associated with feasts twice a
    year.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At a grave rite, food is placed on the grave, kava is prepared, and a chief
    pours the kava over the grave while praying softly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The kava is poured twice over the grave that is the focus of the celebration,
    and then may be poured over other graves in the same house.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A chief throws food three times on the grave and also throws areca nut, using
    phrases glossed as food or areca nut of the atua.
  category: speech
  evidence_refs:
  - ev:8
