canonical_text:
  quote: ''
  summary: The passage describes a Banks Islands joking episode involving Charles,
    his maraui, Nicholas's wife, and Charles's sister, then explains poroporo as an
    established custom of mocking certain relatives. It also discusses Banks Islands
    marriage regulation by moiety, additional kinship prohibitions, former or occasional
    father’s-sister marriage in Merlav and Mota, and abnormal but not unknown marriages
    across generations twice removed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Charles's arms are seized by his maraui, Walter puts a mat on Charles's head,
    and the people laugh.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife of Nicholas mocks Charles by asking him for fish and garden work.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Charles's sister joins the mockery by saying there is no food for Charles
    and Nicholas; after they answer that they have plenty, she ends the joking with
    the word rendered as “Shut up.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage reports Mr Durrad's view that the joke centered on treating Nicholas's
    wife as also Charles's wife, and on recognition of a possible relationship between
    Charles and the wife of one he would call brother.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Chaffing or mocking certain relatives is described as an established custom
    and regular social institution among Banks Islanders.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage distinguishes poroporo involving people of the same moiety from
    a form involving different moieties, called poroporo tavale ima.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Reported restrictions say that a person should not poroporo someone of the
    opposite veve and that brother and sister should not poroporo one another, while
    the husband of the father's sister is named as a high-intensity case.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Examples are given of a man mocking the children of his mother's brother and
    a distant maraui, and of a woman mocking her husband's maternal uncle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Dual moiety grouping is described as an obvious means of regulating marriage,
    but the passage says other relationship-based prohibitions or duties also apply.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Marriage with the father's sister is said to be contrary to present custom
    in most of the group, though Merlav and Mota preserve reports of former or classificatory
    forms of this marriage.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Marriages across generations twice removed, such as with a brother's daughter's
    daughter, are described as not definitely prohibited and not unknown, but abnormal
    and a sign of mental weakness.
  category: relationship
  evidence_refs:
  - ev:7
