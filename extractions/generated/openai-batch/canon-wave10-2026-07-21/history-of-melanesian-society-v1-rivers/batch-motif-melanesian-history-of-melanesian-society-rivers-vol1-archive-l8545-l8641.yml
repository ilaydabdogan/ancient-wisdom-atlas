canonical_text:
  quote: ''
  summary: The passage describes Banks Islands canoe manufacture, launch ceremonies,
    a trial voyage in which the canoe is attacked at village landing-places and then
    fed, naming and command practices, sea-going equality, kinship rules for voyages,
    and limits on travel and navigation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People from any part of the island may help cut down the tree for a canoe,
    draw it to the village, and receive a feast for assisting.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The canoe body is hollowed in the village, moved to the beach, fitted with
    outrigger yoke-pieces, outrigger, and platform, and then launched.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The men who made the canoe wade into the sea with it until the water reaches
    their waists and turn it round three times.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two rows of men push the canoe back and forth three times; the passage states
    these rows are not arranged by the two veve moieties.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The men stand around the canoe, each places his hand on it and passes the
    hand-contact on to his neighbor around the circle, repeating this three times.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator notes a striking similarity between the canoe hand-passing ceremony
    and handing round a newly born child in Motlav.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sand is placed on leaves on the canoe platform, and a fire is lit on the sand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the canoe's trial journey, people at the next village landing-place assemble
    with bows, arrows, or stones.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When one crew member raises a paddle as a sign, the crew paddles hard toward
    land while the people on shore shoot arrows and throw stones at the canoe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The attack stops as soon as land is reached, and the people on shore give
    food to the men in the canoe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The canoe is taken around the island to other landing-places where the attack-and-food
    sequence is repeated, ending at the starting village.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The stated object of the attacks is to make the canoe sink in order to test
    its strength, but the narrator says this explanation should be received with caution.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Canoes are generally named after the trees from which they are made, and the
    stern steer-paddle man acts as captain.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: 'At sea, land status is suspended: a chief or big man is described as no more
    important than anyone else.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: For a long voyage, a man takes only his own sogoi, because harm to a member
    of the other veve while away could lead to compensation demands.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: The sister's or daughter's husband is an exception and is expected to go in
    the canoe of his wife's brother or father.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: The described fighting occurs only at the island to which the canoe belongs
    and not on a first visit to another island.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:18
  text: The passage says long canoe journeys were not made, travel was not by night,
    and stars were not used in navigation.
  category: setting
  evidence_refs:
  - ev:11
