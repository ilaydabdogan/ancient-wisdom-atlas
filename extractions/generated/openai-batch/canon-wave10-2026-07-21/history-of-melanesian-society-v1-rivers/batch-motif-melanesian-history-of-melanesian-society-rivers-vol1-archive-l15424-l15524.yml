canonical_text:
  quote: ''
  summary: 'Ethnographic description of Tikopian life-cycle and death customs: assumption
    of the perineal cloth, ear boring, male incision with kava offering, kin self-wounding
    and feasts, turmeric marking, female puberty and tattooing, infanticide and treatment
    of twins, burial practices, and prolonged mourning with fasting, abstentions,
    hair cutting, and ritual ending of a father''s fast.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A child assumes the maromaro or perineal cloth during a feast with an exchange
    of presents between the child's father and maternal uncle; ear boring may occur
    at any time and by anyone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A boy's incision takes place at about twelve years of age; the prepuce is
    slit, but no part is removed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before the incision, the chief of the division offers kava to the dead and
    prays that the boy will pass through the ordeal successfully.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Relatives assemble inside the house while the maternal uncle performs the
    incision just outside the house.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the incision, relatives cry; male relatives on both father's and mother's
    sides cut their foreheads so that blood flows over the face, while female relatives
    tear their cheeks with their nails.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the operation the boy enters the house where relatives are gashing or
    scratching themselves; a small feast follows, relatives stay in the house that
    night, and a larger feast with presents to the uncle and chief occurs the next
    day.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: After incision, the boy is smeared with turmeric mixed with coconut cream
    by his mother or maternal uncle on specified front-facing parts of the body; the
    mixture appears very red.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Girls have the same ceremonies as boys up to puberty, but no rite corresponding
    to incision; the account reports no known first-menstruation custom or seclusion,
    and tattooing occurs after first menstruation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Tikopian family is usually limited to four children, and excess children
    are killed by being buried alive in or near the house; if the first four children
    are all girls, one or more may be killed in hope of later sons.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the case of twins, called masanga, one or both are usually killed, with
    the decision resting with the mother; the passage reports that Tikopians said
    mixed-sex twins had not been known among them.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The dead are usually interred in the house where they died; a chief may be
    buried outside with a shed over the grave.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: Burial takes place the day after death while relatives cry and gash themselves;
    the maternal uncle and other relatives dig a deep grave, wrap the body in barkcloth
    and mats, and lay it extended on its back.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: At the death of a chief, another chief makes a kava offering before burial;
    the passage says this offering was probably also made for ordinary people.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Mourning involves long dietary restrictions, including water and mammy apples
    for four or five months and abstention from some foods for as long as a year;
    mourners also cut their hair short.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The father of the deceased observes especially prolonged mourning, may eat
    only mammy apples for a year, avoids fishing and daytime outings, bathes only
    at night, and drinks water in a different place from where he drank with his son.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: A man's brought cooked food can end the father's long fast; after reluctance,
    the father wails for his son one last time, eats the food, and later gives a present
    to the food-bringer.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: Other relatives resume usual food after about eight months, brothers of the
    dead man begin fishing again around that time, and all relatives abstain from
    betel for about two months.
  category: sequence
  evidence_refs:
  - ev:10
