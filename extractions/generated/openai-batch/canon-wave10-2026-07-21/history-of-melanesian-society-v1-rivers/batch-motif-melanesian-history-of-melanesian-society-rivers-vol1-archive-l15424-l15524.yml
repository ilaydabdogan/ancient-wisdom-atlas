candidate_motifs:
- id: motif:1
  label: Male puberty incision as initiation ordeal
  taxonomy_refs:
  - initiation
  basis: The boy undergoes a defined puberty operation preceded by prayer, framed
    as an ordeal, followed by kin responses, feasts, gifts, and body marking.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage is an ethnographic description and does not itself use the
    term initiation; the taxonomy match is based on rite-of-passage features in the
    described sequence.
- id: motif:2
  label: Ritualized exchange around life-cycle rites
  taxonomy_refs:
  - sacred_exchange
  basis: Present exchange accompanies the maromaro ceremony, and presents are made
    to the uncle and chief after incision; a mourner later gives a present to the
    man who brought food to end his fast.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:10
  confidence: medium
  cautions: The passage describes human gift-giving and ritual offerings but does
    not explicitly interpret them as a single sacred-exchange system.
- id: motif:3
  label: Kin self-wounding and visible blood in ritual crisis
  taxonomy_refs: []
  basis: Relatives self-injure during the boy's incision, and relatives also cry and
    gash themselves before burial.
  evidence_refs:
  - ev:3
  - ev:8
  confidence: high
  cautions: The passage gives actions but not a symbolic explanation for the blood
    or wounds.
- id: motif:4
  label: Post-rite red body marking
  taxonomy_refs:
  - initiation
  basis: After incision, the boy is smeared with a turmeric-coconut mixture that appears
    red on specified parts of the body.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The text records the marking but does not explain its meaning; the initiation
    link depends on its placement after the incision rite.
- id: motif:5
  label: Socially regulated infanticide and twin killing
  taxonomy_refs: []
  basis: The passage states a usual family limit of four children, burial alive of
    excess children, possible killing of girls to obtain sons, and killing of one
    or both twins.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: No comparative or mythic interpretation is supplied by the passage.
- id: motif:6
  label: Domestic burial and kava offering before burial
  taxonomy_refs: []
  basis: The dead are usually interred in the house of death, a chief may be buried
    outside under a shed, and kava is offered before burial at least for a chief.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage says the offering is probable for ordinary people, so that
    part is less certain.
- id: motif:7
  label: Prolonged mourning fast and ritual resumption of eating
  taxonomy_refs: []
  basis: Relatives restrict foods and cut hair; the father observes especially long
    fasting and restrictions, then ends the fast when a man brings cooked food and
    he wails one last time.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The account describes a mourning sequence but does not connect it to an
    afterlife journey or death-rebirth motif.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the Tikopian incision procedure to Tonga,
    saying it is done in the same fashion, with the prepuce slit and no part removed.
  claim_level: same_function
  target: Tongan incision practice
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the stated surgical form; the passage
    does not support claims about origin, diffusion, historical contact, or equivalence
    of the surrounding rites.
