canonical_text:
  quote: ''
  summary: Ethnographic account of Tikopian fishing techniques and food customs, including
    canoe fishing, nets, women’s prawn catching, fish poisoning, ritual distribution
    of shark, varu, and bonito, gender rules for canoe use, and groove-method fire-making
    by men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The varu and fangomea are described as large fish caught with a hook, and
    John says Tikopian canoes must be large and strong to catch them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bonito are caught with a turtle-shell hook baited with a white feather, which
    is moved to and fro on the water from a rod in the stern of the canoe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bonito are said to visit the island during the first three months of the year.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Small fish are angled from the beach or rocks and also driven by people walking
    in a circle toward a long net called fangota.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fresh-water fish are caught in the island lake with a net called hipenga,
    which has a triangular opening and is left in the water for a short interval.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Women catch prawns and small fish with little nets, lifting stones and catching
    prawns as they dart out; the catch is cooked wrapped in teti leaves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Except for the fresh-water fish net, fish-traps and fish-spears are not used;
    fish are sometimes poisoned in tide pools with crushed nauari stem mixed with
    sand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After catching a shark, the catchers sleep on reaching shore while others
    cook the fish and collect food for a large feast.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the shark feast is ready, the sleepers are awakened, kava is usually
    offered by a chief, and the shark flesh is distributed only to members of the
    successful fisherman’s division.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A man who catches a varu does not eat it but presents it to the chief of his
    division and receives a present in return; numbered catches determine how many
    fish go to the chief and to the catcher.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bonito are given to chiefs; at the first catch of the season the chief offers
    kava before cooking and again when the oven is opened, and the catch is distributed
    to chiefs of the four divisions.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the first bonito catch of the season, later bonito may be eaten by those
    who catch them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Only unmarried women may go in canoes with men when fishing, while married
    women may go in canoes when a journey is undertaken.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Fire is made by the groove method, and John says the method is the same as
    that practiced in Motlav, Uvea, and other places he knew.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Fire-making is restricted to men, who sit on a log called sika and use a smaller
    piece of the same kind of wood called kaunatu to make the groove.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: In fire-making, wood dust gathers in the groove, begins to smoke and glow,
    is dropped onto dried coconut husk, and is blown into flame.
  category: sequence
  evidence_refs:
  - ev:7
