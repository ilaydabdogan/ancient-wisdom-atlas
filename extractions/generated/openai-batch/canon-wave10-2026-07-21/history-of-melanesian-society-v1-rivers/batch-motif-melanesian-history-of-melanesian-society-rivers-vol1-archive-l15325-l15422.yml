canonical_text:
  quote: '"When the injured husband sees the blood, his anger will go."'
  summary: The passage describes Tikopia rules and sanctions concerning adultery,
    premarital intercourse, cross-status unions, widowhood, illegitimacy, and childbirth.
    It also records birth practices involving sea or house delivery, bathing in sea
    and fresh water, turmeric smearing, cord cutting, gift exchange between father
    and maternal uncle, naming, and a postnatal visit to the maternal grandfather's
    house.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A married woman is described as treated with great respect, while adultery
    is said to be rare.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: If adultery is discovered, the husband attempts to kill the offending man;
    the woman is chastised but not killed, and a child suspected to result from adultery
    is killed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A severe wound that makes blood flow can end a fight, because the injured
    husband's anger is said to go when he sees blood.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Adultery between members of different divisions does not lead to formal fighting
    between the divisions; if there is a fight, it is described as being only "with
    the lips."
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A girl repeatedly found guilty of premarital sexual misconduct may be killed
    by being made to swim out to sea until she drowns.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If an unmarried youth and girl of the ordinary people have a child, they usually
    marry, and in that case there is no slur on the child; if the man refuses, the
    child is killed at birth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cross-status sexual relations involving the chiefs' class are described as
    preventing marriage and leading to the killing or destruction of the child; an
    ordinary man with a chief's daughter is said to die.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Widows are expected not to remarry; an ordinary widow who offends is rebuked
    by her brother, while a chief's widow is beaten by her son and receives kin-related
    compensation through the mother's brother.
  category: relationship
  evidence_refs:
  - ev:5
