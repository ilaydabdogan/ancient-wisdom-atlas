  text: A widow in a prolonged intrigue may live with her lover if pregnant, but the
    union is not regarded as legitimate and is named with terms used for adultery
    or sexual intercourse.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The woman in such a union is not allowed to return to her own relatives and
    is called taringa motu, "broken ear," referring to a sign of widowhood.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The child of such a widow-lover union is called tamai te ara, "child of the
    pathway," and initially may go only to the father's land.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: After incision by the mother's brother, this child may go to the mother's
