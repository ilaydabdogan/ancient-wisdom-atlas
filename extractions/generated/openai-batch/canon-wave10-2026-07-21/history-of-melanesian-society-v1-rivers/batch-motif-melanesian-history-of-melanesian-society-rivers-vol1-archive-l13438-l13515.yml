canonical_text:
  quote: ''
  summary: 'The passage reports a case in which illness among children is attributed
    to indirect contact with snakes that were tambu to their mother: their food was
    cooked in pots formerly used to cook snakes. The father leaves his wife and takes
    another woman to escape continual trouble. The passage then turns to the investigation
    of the Nandrau kinship system through pedigrees and relationship terms, with a
    note on possessive pronouns.'
