canonical_text:
  quote: ''
  summary: The passage describes restrictions on eating or wearing certain foods and
    objects associated with Tamate societies; narrates a recent story in which Clement
    arranges Carpenter’s initiation so Carpenter can make a society hat; reports inter-island
    origins or borrowings of some societies and materials; and summarizes common features
    of Tamate societies, including initiation, badges, property protection, and objects
    called tamate.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A kind of taro called tamate liwoa and the bird called menme7iule may only
    be eaten by members of the great Tamate.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The owl is not eaten by anyone, but its feathers may be worn as decoration
    by members of the Tamate wis and by certain women connected with a kolekole for
    a house.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Certain fish limited to members of societies may be eaten by women of full
    age, but not by unmarried women or girls; a wife may eat the pepe fish even when
    her husband may not.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Clement began making a hat for the Tamate matawonowo7io, found the task beyond
    him, and asked Carpenter for help at the salagoro.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Carpenter refused at first because he was not a member of the relevant society;
    Clement then arranged for him to become a member by giving the necessary initiation
    money and telling him to tiro to a small boy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After Carpenter made the hat, other men questioned him, he confessed what
    had happened, and they ridiculed him for having to tiro to a small boy for an
    insignificant Tamate.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Many Tamate societies now found on Mota are said to have been introduced from
    elsewhere, especially Vanua Lava; Tamate liwoa is said to have come from Ureparapara,
    and a black pigment for hats may have come from the Torres Islands.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:7
- id: obs:8
  text: All the societies are entered by initiation ceremonies, which vary from simple
    acts such as giving tobacco and making an object to the complex ceremony described
    elsewhere for Tamate liwoa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Nearly all the societies possess one or more badges, and the passage says
    the badges apparently have the same efficacy in protecting property.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Most societies possess an object called a tamate, such as a mask, hat, or
    other object; other tamate objects may be worn by women after initiation and are
    distinguished from those of Tamate societies.
  category: object
  evidence_refs:
  - ev:6
