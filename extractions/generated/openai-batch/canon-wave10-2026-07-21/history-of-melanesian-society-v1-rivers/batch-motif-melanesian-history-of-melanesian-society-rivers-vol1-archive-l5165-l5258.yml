canonical_text:
  quote: ''
  summary: 'The passage describes stages following initiation into a Banks Islands
    society: money is placed on a stone and distributed, the neophyte enters or remains
    in the salagoro under seclusion rules, undergoes a hundred-day probation with
    food obligations, fines, ordeals, and restrictions, participates in periodic feasts
    culminating in the talasa feast, hears the double werewere or tamate cry, and
    then exits seclusion decorated with prescribed leaves, flowers, powder, charcoal,
    and pandanus. It also notes infant initiation, in which a father or maternal uncle
    undergoes the process.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A father or mother's brother places three or four fathoms of money on a stone
    for the person who carries it, and the group goes to the salagoro with the neophyte
    or substitute carrying the stone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A distribution of money called kere may occur before people disperse; if it
    has already occurred, the neophyte keeps the money in the bag carried on his right
    shoulder.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the people have gone to the salagoro, the island becomes free again
    and people may return to the village where the ceremony occurred.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The newly initiated member is expected to stay in the salagoro for a hundred
    days, not wash, not leave, and give food to all who come.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Friends provide food, and the father or mother's brother brings it into the
    building; the last previously initiated member fetches water.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A mat is laid in the salagoro for the neophyte to sleep on, and no one else
    may touch it during the probation period.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: During and after the hundred days, the neophyte undergoes trials of patience
    and can be fined a pig or money for breaking salagoro rules.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A cycas tree thrown down in front of the building is the sign that a fine
    has been imposed.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Visitors may demand food, damage possessions, throw yams into the fire, make
    the neophyte scrape coconuts until his hands bleed, discard the prepared food,
    or rub it on his head; complaint leads to fines.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some tormentors come from another district, and a man who has undergone such
    treatment may later impose similar tasks at an initiation in their salagoro.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: An infant may be initiated; in that case the father or maternal uncle goes
    through the initiation process.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Throughout the hundred days after initiation there is a feast every five days
    in the salagoro; the fiftieth-day feast is larger and more important.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: At the end of the hundred days, or later when payment is complete, the main
    feast called talasa occurs, with food cooked in a large oven in front of the salagoro.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: On talasa day the double werewere sound, described as the linge tamate or
    cry of the tamate, is made in the morning, when the oven is opened, and in the
    evening.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: When people hear the sound on talasa day, they say, "Let the tamate die."
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The neophyte leaves the salagoro on the day of the talasa feast or the following
    day, becoming free after the feast if he leaves the same day.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: Before leaving or at release, the neophyte is elaborately decorated with white
    powder in the hair, a coconut-leaf and black banana-leaf fillet, hibiscus flowers,
    a belt, hanging coconut leaves, charcoal marks, and bleached pandanus bindings.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
