canonical_text:
  quote: ''
  summary: The passage describes the social functions of the Sukwe and Tamate societies
    in the Banks Islands. It says they protect property through taboo-like mechanisms,
    but that the Tamate may also destroy property on certain occasions, including
    the house of a candidate for Tamate liwoa, which the author interprets as probably
    symbolic of ceremonial death. It also recounts a father using a Tamate saka member
    to punish a disobedient child, and concludes that these societies help maintain
    property rights, social order, patience, restraint, and authority.
  language: English
  quote_policy: summarized
