  quote: ''
  summary: The passage describes Paefakofe's exceptional judicial and specialist status
    in Tikopia, his intervention on behalf of strangers, his instruction of his son
    Paevatere, and a detailed account of Tikopian kinship terminology based on genealogical
    data collected by Mr Durrad. It emphasizes broad classificatory use of kin terms
    across direct and indirect relations.
