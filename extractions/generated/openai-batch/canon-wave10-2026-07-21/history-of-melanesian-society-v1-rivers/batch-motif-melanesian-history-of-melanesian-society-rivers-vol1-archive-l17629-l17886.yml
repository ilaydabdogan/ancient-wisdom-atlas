canonical_text:
  quote: ''
  summary: The passage describes remedies attributed to John Maresere in Tikopia,
    including treatments for headache, abdominal pain, injuries from falls, bleeding,
    and childbirth. It emphasizes that some remedies came from John’s parents, Tonga,
    Wallis Island, or possible European influence, and presents the account as an
    example of cultural transmission.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: John Maresere used remedies taught by his parents; some were from his own
    island and some from Tonga, where his parents had learned them during a visit.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After arriving in Tikopia, John was seriously ill, drank an infusion from
    leaves of a tree his parents had used as a remedy, recovered, and thereafter Tikopians
    sought his treatment when their own methods failed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The headache treatment uses maire leaves chewed, wrapped in barkcloth, squeezed,
    and dropped into the ears; the forehead and upper nose are pressed, leaves are
    bound on the forehead, and the patient is told to sleep.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If headache pain lessens, the treatment is repeated on successive days up
    to five times; after recovery on the fifth day the patient washes in hot water
    and pays, while no further treatment is given if the first treatment fails.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The abdominal-pain treatment uses nonu leaves and mangare bark wrapped in
    coconut fibre, soaked, squeezed into water, and drunk five times, followed by
    dietary restrictions during convalescence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: For injury from falling from a tree, coconut cream is mixed with boiling sea-water,
    the painful place is examined, something out of place is put back, orange or lime
    leaves are prepared in coconut fibre, and liquid from the preparation is drunk.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the fall-injury treatment, the patient is told to urinate; passing blood
    is said to carry off the pain, while failure to pass blood is said to cause the
    blood to thicken, corrupt, and lead to death in five days.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Bleeding is performed by binding the arm, fixing a shark’s tooth in the cleft
    end of an arrow reed, driving it into the vein before the elbow, collecting two
    coconut cups of blood, and then stopping the flow by pressure and loosening the
    bindings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author states that this arm-bleeding method closely resembles European
    bleeding and was probably learned from Europeans; John also used back cutting,
    and he had received abdominal cutting as a child in Wallis Island.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: To hasten childbirth, hibiscus leaves are pounded, their juice is squeezed
    into water, and the woman drinks the liquid as quickly as possible.
  category: action
  evidence_refs:
  - ev:6
