  text: The author defines succession as the transmission of chiefly rank or another
    special social position to a man from his father, while inheritance is reserved
    for property.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that in Melanesia matrilineal descent may coexist with
    patrilineal succession and inheritance, or succession may be patrilineal while
    descent and inheritance are matrilineal.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage identifies a form in which property and rank are transmitted to
    a man from his mother's brother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The author generally uses relationship rather than kinship, reserving kinship
    for genealogically demonstrable non-marital relationship, whether real or conventional.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author defines correspondences as cases where two or more relationships
