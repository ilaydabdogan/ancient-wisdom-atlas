canonical_text:
  quote: ''
  summary: 'The passage defines terms for succession, inheritance, relationship, kinship,
    correspondences, and geographical units, then describes dual organisation in Melanesian
    communities: two exogamous moieties, female-line descent, membership in the mother''s
    moiety, and classificatory consequences for children, sister''s children, and
    grandchildren.'
  language: English
  quote_policy: summarized
literal_observations:
