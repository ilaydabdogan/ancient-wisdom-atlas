canonical_text:
  quote: ''
  summary: 'The passage describes kava drinking in the Banks Islands, especially Mota:
    gender and rank restrictions, the maker''s preparation of kava by chewing root,
    the use and handling of four cups, serving order, drinking technique, disposal
    and memorial storage of chewed root in the gamal thatch, and recent changes in
    custom among younger men and women.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kava drinking is reported as increasingly occurring in the house, with women
    allowed to be present; men of high Sukwe rank are said to have secretly given
    kava to their wives.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Banks Islands the act of drinking kava is called woana, and a special
    feature is that one man prepares it by chewing Piper methysticum root for each
    member of the circle in turn.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'In Mota four small cups called lasa are used, each with a named function:
    squeezing juice, drinking, dregs, and water.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The maker should be of Tavatsukwe rank, sits cross-legged, washes his hands,
    claps to signal that kava is being made, chews root with water, rolls the chewed
    mass into a ball, and squeezes juice into a cup.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Water is added and the liquid is repeatedly poured between vessels from a
    height while dregs are separated into the dregs cup.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The prepared mixture is stirred with the thumb and handed to the oldest man
    present; if a higher-ranking Sukwe man is present, the oldest man may pass the
    cup to him, though it is usually returned for the oldest man to drink first.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The same chewed mass of kava root may be reused for several persons until
    it becomes weak, after which a fresh piece may be taken.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: When drinking is finished or the kava is exhausted, the maker rinses his mouth,
    places the chewed root in the gamal thatch as a memorial, and receives a piece
    of root as reward.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The cup is handed on the maker's outstretched right hand, taken with the drinker's
    right hand, and the liquid is sucked up without putting lips to the cup edge;
    younger men are said now often to drink from the edge.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: On the observed occasion the maker poured some liquid on the ground before
    handing the cup to the first drinker.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Kava vessels are usually kept in a basket in the dwelling-house and should
    not be put on the ground, but kept on a basket-framework or coconut-shell ring.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Young men ridicule elders' care that kava cups not touch the ground.
  category: speech
  evidence_refs:
  - ev:12
