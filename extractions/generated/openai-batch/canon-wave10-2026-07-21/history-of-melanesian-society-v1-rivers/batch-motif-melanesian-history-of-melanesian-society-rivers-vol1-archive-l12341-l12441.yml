  summary: The passage records kinship possessives and terms, discusses simplification
    in related Solomon Islands kinship systems, describes the exceptional Savo possessive-pronoun
    pattern, compares clan correspondences and marriage restrictions across islands,
    reports a belief that clan identity can be read from palm lines, and notes a Western
    British Solomons pattern of marriage regulation by genealogical kinship rather
    than clans.
