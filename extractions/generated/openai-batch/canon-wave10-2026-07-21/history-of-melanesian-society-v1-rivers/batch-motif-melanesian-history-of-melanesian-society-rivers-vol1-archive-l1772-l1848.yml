canonical_text:
  quote: ''
  summary: The passage compares Banks Islands kinship terminology for relatives by
    marriage, including Mota mateima and welag, Vanua Lava spouse-classed in-laws,
    Merlav and Rowa naming practices, the obscure term tawarig and its relation to
    veve membership, grandparent-grandchild terms, Mota gasala for parents of a married
    couple, and the importance of regulations governing relatives' behavior.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Mota, the wife's sister, the brother's wife for a male speaker, and the
    wife of the mother's brother are grouped together as mateima, with welag as the
    reciprocal term.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that the three relatives called mateima are people whom
    a man may or should marry, making mateima a term for a potential wife and welag
    a corresponding term for a potential husband.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Vanua Lava, the wife's sister and brother's wife receive the same name
    as the actual wife, while a woman calls her husband's brother and sister's husband
    by the same word as her actual husband.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author did not obtain the Vanua Lava term for the wife of the mother's
    brother and therefore does not know whether she is also classed with the wife.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Merlav, the wife's sister and brother's wife, if not addressed by name,
    are denoted by the same term as the actual sister; in Rowa these relatives are
    always addressed by name.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The passage lists four ways of designating same-generation relatives by marriage
    of different sex: by name, as wives, as potential wives, and as sisters.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tawarig is described as applied primarily to the son's wife and to wives of
    many other direct or collateral descendants.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The use of tawarig is discussed in relation to whether certain relatives belong
    to the same veve as the woman or to the veve of her husband, with noted exceptions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Grandparent-grandchild terms differ across islands, with some systems distinguishing
    speaker sex and some using terms generally that elsewhere are used only in address.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Vanua Lava and Rowa term popo is said to correspond closely with a Mota
    vocative term.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mota has the term gasala, applied to each other by the parents of a married
    couple, and the author reports no special term for this relationship in other
    islands as far as he could discover.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Banks Islands are described as rich in regulations governing relatives'
    behavior, with breaches treated as important matters, and the custom poroporo
    is named as especially important.
  category: attribute
  evidence_refs:
