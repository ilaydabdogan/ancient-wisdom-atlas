canonical_text:
  quote: ''
  summary: 'The passage describes Banks Islands and Motlav birth customs: a fifth-day
    feast, a twenty-day women''s festival, payment and circulation of the baby around
    a ring of women, a later bush ceremony with a little house and ashes, a Motlav
    custom compared with Mota kalo vagalo, and a prenatal first-child feast involving
    equal food exchange between parental groups.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the fifth day after birth there is a feast in which men eat in the gamal,
    yam puddings are made, cut up, and placed in two baskets, one for men and one
    for women.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women may sleep in the house of the newly delivered woman for twenty days,
    treated as a festival period with daily food and coordinated decoration or clothing
    colour.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: During this period the women may dig yams anywhere, including another village,
    and this is not treated as stealing; the custom is called tigtigopur.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the twentieth day the husband pays the women with short pieces of money,
    and four special helpers receive longer measured pieces; money is placed on pieces
    of pudding.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The women sit in a ring outside the house; the father's sister brings out
    the baby, passes it to the first woman, the baby goes around the circle, and then
    the father's sister carries it around the circle four times before returning it
    to the mother.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the distribution, each woman takes her mat home and eats the pudding
    portion she has received.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: When the mother can go about, a young man builds a little bush house called
    paito; the mother goes there with the child and a little girl carrying leaf-wrapped
    packets of ashes in a basket.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the paito, the mother and little girl pass the child through the little
    house, and then scatter packets of ashes at intervals along the path toward the
    garden-ground before returning to the village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage says that handing through the little house is only for a first-born
    male child, that no house is made for a girl, and that the act was said to signify
    the boy later going through the Sukwe.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: 'In Motlav, the virep virep custom is described as similar to Mota kalo vagalo
    but with differences: the child has no bow and remains in the house, the father
    stands at the door and is pelted with fruit, uncles receive measured money, and
    there is no corresponding father''s-sister tawarig formula ceremony.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: A Motlav feast called sau occurs before the birth of a first child; nuts are
    scraped in sea water, breadfruit is cut, food is prepared after sunset, cooked
    during the night, and eaten in the morning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: For the sau feast, the whole village contributes, and food from the father
    and his sogoi must equal food from the mother and her sogoi; the two sides exchange
    food in an exchange called ravaleitleit and then eat it in their houses.
  category: relationship
  evidence_refs:
  - ev:5
