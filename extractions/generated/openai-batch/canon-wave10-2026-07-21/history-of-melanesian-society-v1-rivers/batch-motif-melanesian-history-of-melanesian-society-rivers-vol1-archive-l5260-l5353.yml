canonical_text:
  quote: ''
  summary: The passage describes a salagoro initiation-related procession, rules for
    talasa feast food and pig-remains memorials, and a story in which a secluded man
    is led by a black lizard to hidden shell-money that can secure his release.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Single croton leaves are placed in a head fillet, and already initiated men
    decorate themselves similarly but less elaborately.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two men sit on a platform outside the salagoro and prepare to perform werewere
    while a procession is formed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each man in the procession carries a bamboo on his left shoulder and a stripped
    white hibiscus-wood stick in his right hand.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The procession places the neophyte in the middle, with senior members arranged
    so that the whole order is described as a concave-upward curve.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The procession proceeds to the village where women and uninitiated persons
    are assembled, passes through in silence, then resumes shouting after passing
    through.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The participants time their return to the salagoro to coincide exactly with
    the end of the werewere; failure requires payment of a fine.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: All food cooked for the talasa feast must be eaten, and dropping it from the
    hand incurs a heavy fine of a pig or money.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Salagoro food is not given to pigs; surplus is recooked, and if it becomes
    dry and shrivelled it is burnt, with ashes kept in a special place until an appointed
    removal day.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Skulls or jawbones of pigs killed for the talasa feast are placed in trees
    or on stakes called palako as memorials.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A man who entered the salagoro without the necessary money could remain there
    for life if he lacked friends able to help him pay.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: In the story, a black lizard bites a sleeping secluded man’s foot and then
    slowly leads him out of the building into the bush.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The lizard leads the man to a small tree-fern, goes around it several times,
    and the man uproots the plant, uncovering a flat stone.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Under the flat stone the man finds a large amount of shell-money whose string
    has rotted.
  category: object
  evidence_refs:
  - ev:13
- id: obs:14
  text: The man prepares new string, retrieves the money at night, strings it, and
    hides it behind his pillow, protected by the rule that no one may touch his sleeping
    place.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: After stringing the money, the man tells people to prepare for the talasa
    feast at the end of the seclusion period.
  category: speech
  evidence_refs:
  - ev:15
