canonical_text:
  quote: ''
  summary: 'The passage describes ceremonial relationships and restrictions associated
    with the Banks Islands gamal and Sukwe ranks: reciprocal obligations between a
    male participant and women, ranked masks or hats called tamate, special igot knives,
    a malo-saru initiation dancing dress, and male/rank-restricted kava drinking.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man may not marry the women involved in the ceremony, and sexual relations
    with them would be regarded severely.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The women are described as obligated to help the man and give him food; he
    is described as obligated to respect and obey them and help in their gardens.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The father's sister is chief among the women in the ceremony and receives
    more money than the others.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The ceremony is described as the sole occasion on which women go into the
    gamal, and it establishes a close relationship between the child and the participating
    women.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:5
  text: Each rank of the Sukwe has an associated hat or mask with the same name as
    the division to which it belongs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The hats or masks are made either with handles for carrying or hollowed so
    they can be worn on the head.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: A man may pass through the Sukwe ranks without using these hats, but may also
    have a hat made for a kolekole ceremony, even one belonging to a division higher
    than his own.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When used for a kolekole ceremony, the hats are made in the salagoro of a
    Tamate society, taken to the gamal, and later brought out for public viewing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that these Sukwe hats resemble the masks or hats of the
    Tamate societies and, like them, are called tamate.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Special knives called igot are used in some islands to cut puddings made from
    breadfruit or other materials.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Most described igot knife handles represent the human figure in varying degrees
    of conventionalization, while two examples derive from the til or swordfish.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Some igot knives are used only by specified Sukwe ranks or by those ranks
    and higher ones.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The dancing dress called malo-saru is connected with the Sukwe, had almost
    disappeared by the time of description, and was formerly worn in the dance connected
    with initiation.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Kava, called gea, is drunk only by men and is closely connected with the Sukwe.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: At one time, only men of the rank of Tavatsukwe and above could drink kava;
    at the time described, lower ranks still could not drink it in the gamal, though
    they could in the salagoro of a Tamate society.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: Women should never drink kava or take part in the ceremonial connected with
    its use.
  category: action
  evidence_refs:
  - ev:10
