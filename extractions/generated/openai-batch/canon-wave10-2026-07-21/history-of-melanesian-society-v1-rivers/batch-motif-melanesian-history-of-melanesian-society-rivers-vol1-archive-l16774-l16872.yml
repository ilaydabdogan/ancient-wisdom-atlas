canonical_text:
  quote: ''
  summary: The passage describes Tikopian sacred stones regarded as male and female
    atua, a creation legend in which two atua fish the stones from the sea, the stones'
    union gives birth to Tikopia, and the stones also give birth to a boy and girl
    whose marriage begins the people of Tikopia. It also describes sacred shell axes,
    sacred canoes, a sacred house with chiefly burial mounds and ritual sacrifice,
    and Tikopian ranks, succession, and food obligations to chiefs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A stone named Te atua takaretoa is regarded as male, treated reverently, and
    spoken of as a living being; a female stone called Te vatu mai'u is located at
    Ravenga.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Tikopia creation legend, two atua named Tafiki and Metikitiki fish
    from a canoe; Metikitiki sits in the bows and paddles, while Tafiki lets down
    a line and draws up both stones from the sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stones give birth to Tikopia, which is regarded as the child of their
    union; afterward the stones are separated and taken to different parts of the
    island.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The male stone is at Faea and is called the god of the sea and landing place;
    the female stone is called the goddess of the garden-ground and is buried beneath
    the floor of Paevatmaru's hut.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The two stone atua find four clam-shells, make two into axes, use the axes
    to make two canoes, and consecrate the canoes to themselves as te vaka tapu, the
    sacred canoes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The sacred axes remain in the possession of chiefs, and the two other shells
    are said to be in the sacred house of the Kafika chief, though they may be taken
    by another chief for ceremonial purposes.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The two stone atua give birth to a boy and a girl; the boy and girl marry,
    and the people of Tikopia begin.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A Fangarere sacred house in the most sacred part of Tikopia contains burial
    mounds of chiefs and strips of bark-cloth suspended from the roof.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Fangarere chief sacrifices first in the sacred house and then again in
    a larger nearby house.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A suggested interpretation states that roof carving may represent the iofa,
    described as the most important animal atua of the division and as moving like
    a flying fox.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Each of the four divisions has a chief who takes the name of the group he
    rules, with succession normally passing to the eldest son, or to a brother if
    the son is too young.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The chief's brothers are called te paito ariki; this title does not pass to
    the paito ariki's son but to the son of the reigning chief, and the paito ariki
    sees that the chief's orders are carried out.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: Those called te pure matua are hereditary counsellors and protectors of the
    chief, provide him with food in turn, and receive presents or surplus food from
    him.
  category: relationship
  evidence_refs:
  - ev:13
