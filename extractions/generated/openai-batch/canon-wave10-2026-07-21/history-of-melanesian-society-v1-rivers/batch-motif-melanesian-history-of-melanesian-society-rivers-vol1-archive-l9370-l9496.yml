canonical_text:
  quote: The social structure is that of the dual organisation with matrilineal descent.
  summary: The passage introduces New Hebrides kinship data, especially from northern
    Pentecost Island. It describes a matrilineal dual organisation with Tagaro and
    Malau/Subwe moieties, notes uncertain verana groupings that affect marriage, reports
    an unconfirmed account of moiety subdivisions, and gives a pedigree example showing
    forbidden marriages across moiety lines.
  language: English
  quote_policy: quoted
