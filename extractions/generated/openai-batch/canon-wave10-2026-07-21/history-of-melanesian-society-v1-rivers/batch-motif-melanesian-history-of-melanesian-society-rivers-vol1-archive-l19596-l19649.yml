canonical_text:
  quote: ''
  summary: The passage argues that Hawaiian consanguineous marriage should not be
    taken as evidence for general promiscuity, since such marriages were apparently
    chiefly and perhaps special-purpose, while wide kinship-based marriage restrictions
    existed. It then describes lax sexual relations alongside individual marriage,
    including chiefly claims over lower-status persons, a chief’s claim over virgins
    of his district, and the punalua system of recognized paramours, especially the
    husband’s brothers and wife’s sisters.
