canonical_text:
  quote: ''
  summary: The passage reports Pentecost animal associations, including a story in
    which a father associated with a shark appears in shark form to frighten and instruct
    his son after disobedience. It then describes Loli ranks, women's rank prefixes,
    pig-killing as a means of rank acquisition, ornaments restricted to higher female
    ranks, the disappearance of rank distinctions at sea, and the preparation and
    etiquette of kava, called maloku, using coral, bowls, cups, coconut-fibre strainers,
    froth-making, posture rules, and restrictions during drinking.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: John Pantutun said that people of Pentecost associated themselves with animals,
    which he understood as corresponding to the tamaniu of his own island.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A father whose animal was a shark became angry with his son after the son
    refused to roast a yam for him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the son went out for flying fish, a large shark circled his canoe, made
    the sea rough, put its nose over the outrigger, and upset the canoe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The son feared being eaten but was allowed to swim away; the father, in shark
    form, took the canoe ashore and placed the paddle, fishing line, and fish over
    the door of his house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At home the father told the son that he had been the shark and had given him
    a lesson not to disobey in future.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Loli is described as corresponding to the Banks Sukwe, with named ranks
    in order of importance, though only some were said to remain.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women's names had rank prefixes; women's rank was said to be acquired by killing
    pigs and not connected with an organization resembling the Loli or Sukwe.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Only the three highest women's ranks were permitted to wear certain ornaments,
    and the passage suggests women preserved rank distinctions more fully than men.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: In Pentecost, as in the Banks, differences of rank disappear when at sea.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Kava, called maloku on Pentecost, was made by washing the root and grating
    it on a long piece of coral into a large wooden bowl; it should be drunk in the
    men's house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Kava juice was squeezed through damp coconut fibre into cups, the scrapings
    were washed with water and squeezed again, and old scrapings formed a heap from
    previous drinkings.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The strainer was washed and folded into a bag shape, sometimes like a flying
    fox or a bird's head; kava was poured through it from a height to make froth above
    the cup.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The drinker took the cup in both hands, blew off froth, drank with eyes shut,
    and during drinking no one could pass behind him or walk about.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The maker and drinker squatted, remained seated after drinking, and the drinker
    might clean his mouth with sugar-cane; before drinking a man loosened tight clothing
    and stretched until his joints cracked.
  category: sequence
  evidence_refs:
  - ev:11
