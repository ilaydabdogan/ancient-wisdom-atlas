canonical_text:
  quote: ''
  summary: The passage discusses links between the Sukwe rank system and Tamate societies
    in the Banks Islands. It notes required admission to Tamate liwoa for certain
    Sukwe ranks, ritual and badge connections between Lano and Viov, and interprets
    Tamate initiation practices as representing ceremonial death and return to life
    through beating, house destruction, mourning, seclusion, feasts, washing restrictions,
    and sleeping-place taboo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Admission to the Tamate liwoa is described as necessary for entry into the
    Tavatsukwe division and for progress to higher ranks of the Sukwe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Tavatsukwe and higher ranks were formerly the only
    ranks allowed to drink kava at all, and that they remain the only ranks permitted
    to drink it in the gamal.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Luwai in Mota, bright red marakwarakwa fruit was seen in decorations for
    a Lano-rank Sukwe initiation.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The marakwarakwa fruit is identified as one badge of the Viov and of other
    Tamate societies.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: When asked about the fruit used in the Lano initiation, an explanation was
    given that Lano belongs to Viov.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The word tamate is said to mean ghost or dead man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The initiation sequence includes beating the novice, destroying his house,
    and wailing by his female relatives when he leaves them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage reports seclusion and feasts during and at the end of initiation,
    and compares them to Melanesian feasts held periodically after a death up to the
    hundredth day.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: During the initiate’s seclusion, washing is absent and touching the initiate’s
    sleeping-place is taboo.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The initiate is said to carry out duties of feeding the members during the
    period in which he is treated as if dead.
  category: action
  evidence_refs:
  - ev:5
