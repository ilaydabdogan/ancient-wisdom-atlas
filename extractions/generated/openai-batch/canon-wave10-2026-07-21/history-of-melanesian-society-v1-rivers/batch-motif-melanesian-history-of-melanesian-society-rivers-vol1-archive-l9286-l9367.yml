canonical_text:
  quote: ''
  summary: 'The passage describes Torres Islands kava procedure and its ritual use:
    men sit by ranked initiation order, prepare kava with shell, water, and cups,
    address dead people or ghosts for protection, discard dregs or sediment with formulas
    to avert evil, and use kava in childbirth, childhood, male-house introduction,
    adult acts, and funerary rites.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men sit cross-legged in divisions according to the order in which they were
    initiated into the rank, and the arrival of men of highest rank is announced by
    loud blowing of a conch-shell.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each man receives kava root, scrapes it with a shell called koli, and speaks
    a formula asking that his soul be scraped from the holy place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chewed kava root is mixed with water in a shallow cup, poured between
    shallow and tall cups to remove sediment, and the tall cup is raised higher each
    time until held above the head.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before drinking, the man calls to a rich and powerful dead person or to the
    ghosts of the dead in general, offers them drink, asks them to take care of him,
    and drinks the kava in one draught.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The cup is not completely drained; dregs and sediment are thrown away with
    words that ask evil things or malignant influence to depart.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says that men only should drink kava, while women are beginning
    to make it secretly.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Hukwa man may tap the ganiel roof to signal that he wants kava, and a cup
    is passed out to him in return for an arrow, mat, or other object used in business
    transactions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At childbirth the husband drinks kava while praying to a departed ancestor
    to aid his wife, and the cry of Tuf when throwing away dregs indicates an appeal
    that harm may be averted from her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the child is one hundred days old, kava cups are placed in a miniature
    gamel; when a boy is first introduced into the gamel, he sits beside his father
    and sips water from the water-bowl.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the boy is fully grown, every important act of his life is preceded by
    drinking kava.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Soon after death the body is laid at the threshold of the gamel and then in
    its lowest division, while present men drink kava; kava is also used at fifth-day
    and tenth-day funerary rites.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: On the tenth day after death, the men lift cups together, throw away dregs
    together while speaking a formula about throwing away the thing that made the
    man die, drink together, spit out the last drops together, and then an offering
    of coconut, yam, and kava is made to the dead.
  category: action
  evidence_refs:
  - ev:6
