canonical_text:
  quote: ''
  summary: The passage describes speech and name restrictions among kin and affinal
    relatives in Tavua and Mbau, including communication through intermediaries. It
    then analyzes cross-cousin marriage as a source of Mbau and related coastal kinship
    terminology, contrasts this with weaker evidence among mountain tribes, and notes
    counter-evidence from grandparent terms and pedigrees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Tavua, a man would not speak to his brother's wife, and the restriction
    was said to be like that between brother and sister.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Tavua, a man could not talk to or utter the name of his wife's sister;
    communication with her required an intermediary.
  category: speech
  evidence_refs:
  - ev:1
