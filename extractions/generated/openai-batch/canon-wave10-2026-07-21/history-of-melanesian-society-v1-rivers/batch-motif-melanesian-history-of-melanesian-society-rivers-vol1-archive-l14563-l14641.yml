  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: In Mbau, veivungoni were said not to talk to one another, though a footnote
    qualifies that this may have meant avoiding casual talk while allowing business
    speech.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The Mbau examples describe communication with an uncle or aunt through a father,
