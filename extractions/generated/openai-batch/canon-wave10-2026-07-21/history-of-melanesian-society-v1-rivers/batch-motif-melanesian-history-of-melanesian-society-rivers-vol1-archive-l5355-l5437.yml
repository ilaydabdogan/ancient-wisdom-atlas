canonical_text:
  quote: ''
  summary: The passage opens with the end of a prior story mentioning hanging in the
    salagoro, a feast, and a remembered hero. It then introduces a story of the Tamate
    liwoa of Petanpatapata, told to Mr Durrad. A very lovely girl called a motar is
    sought by chiefs from Merlav, Gaua, Mota, Motlav, Rowa, Ureparapara, Ravenga,
    and Kwakea. Each chief hears of her, arrives with valuables such as pigs, rawe,
    and money or purchase-money, asks through her father to buy her, and is refused
    because the girl is unwilling. Footnotes explain uncertainty about whether motar
    is a personal name or high-rank women’s Sukwe status, and define rawe as a special
    tusked pig.
  language: English
  quote_policy: summarized
