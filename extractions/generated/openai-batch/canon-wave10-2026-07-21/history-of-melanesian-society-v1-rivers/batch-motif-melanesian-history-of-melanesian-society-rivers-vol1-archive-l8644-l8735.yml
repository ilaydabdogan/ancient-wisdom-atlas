  summary: The passage analyzes Banks Islands decorative art, especially pudding-knife
    designs associated with Sukwe and Tamate societies. It describes anthropomorphic
    and zoomorphic patterns, possible conventionalization from human forms, rank-related
    head-coverings, similarities with belts and stone figures, and a sword-fish representation
    on certain knives.
  language: English
