canonical_text:
  quote: ''
  summary: The passage lists kinship and affinal terms, including terms for grandparents,
    grandchildren, general relatives, parents-in-law, children-in-law, wives, husbands,
    and several collateral affines. It notes uncertainty about some usages, a possible
    comparison with Turner's Samoan vocabulary, a marriage prohibition involving makakitanga,
    and the custom of addressing relatives by personal name rather than by relationship
    terms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Matua tupuna is described as a general term for grandparents and other relatives
    of their generation; female persons in this class are called matua tupuna fifine.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mokopuna is described as the corresponding term for grandchildren, though
    mangafaua is also often used for them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Matakainanga and mangafaua are described as terms applied to relatives in
    general, not only to specific relatives first identified by the informants.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Matua vungavai is the term for father-in-law, mother-in-law, and the brothers
    and sisters of these persons.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Fingona is described as reciprocal to vungavai and is used for a son's wife
    or daughter's husband; female persons are distinguished as fingona fifine.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hoana is applied to a wife and may also be used by a man for a brother's wife;
    the author could not ascertain that it would be used for a wife's sister.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Kane is used generally to distinguish a male relative and is also the term
    for a husband.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Maa may be used for a brother's wife and is also applied to a wife's sister,
    a sister's husband, and a brother's wife in specified speaker contexts; the author
    thought it was probably also used reciprocally by husbands of two sisters and
    by wives of two brothers.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The author could not discover any term for the relationship between the parents
    of a man and the parents of his wife.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The author notes that Turner gives mata keinanga as the Samoan word for brother
    and suggests Turner may have been misled by the broad use of a similar relative
    term.
  category: other
  evidence_refs:
  - ev:10
- id: obs:11
  text: 'The marriage rule is summarized as a man not being permitted to marry his
    makakitanga: the daughter of his father''s brother, mother''s brother, father''s
    sister, or mother''s sister.'
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The author found no restrictions on the use of personal names and states that
    relatives were usually addressed by name rather than by relationship terms.
  category: speech
  evidence_refs:
  - ev:12
