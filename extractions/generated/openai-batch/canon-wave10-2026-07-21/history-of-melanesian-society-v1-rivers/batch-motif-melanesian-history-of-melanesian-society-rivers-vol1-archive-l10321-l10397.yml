canonical_text:
  quote: ''
  summary: The passage describes a New Hebrides marriage procedure involving a pig's
    head, a bag of property, a yam, armed fighting or resistance during the bride's
    removal, gifts of pigs and mats, unwrapping of the bride, redistribution of property,
    residence in the husband's mother's house, and a period in which the wife does
    not speak to the husband until marital cohabitation begins. It then describes
    former and current property rules, including verana ownership, canoe ownership
    by the verana, and inheritance by the sister's son, with a comparison to Mota.
  language: English
  quote_policy: summarized
