canonical_text:
  quote: ''
  summary: 'The passage describes Tikopian procedures around sickness: invoking an
    ancestor or atua, waiting for a person to become possessed, asking the possessed
    person for a prognosis, touching the patient with the so-called hand of the ghost,
    consulting further atua after adverse answers, and giving food or payment after
    recovery. It also describes chiefly healing with leaves, kava, prayer, sea-bathing
    after recovery, simple remedies using hot water, leaves, and a hot stone, reports
    of diseases, and the beginning of a section on greeting etiquette.'
  language: English with Tikopian terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An invocation asks to call on an ancestor in connection with seeing or assessing
    a sickness, with the possibility of calling on another person or being if needed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: When an atua is invoked, the people present do not know in advance who will
    be inspired; they wait until a selected person begins to shake.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Betel is presented to the inspired person, and questions are asked about whether
    the sick person will recover.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The possessed person approaches the patient, asks where the pain is, and touches
    that place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The possessed person's hand is called te rima te atua, translated in the passage
    as the hand of the ghost.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The possessed person gives a delayed prognosis and, if invoked again, gives
    a definite answer about whether the patient will die or recover; the ghost is
    said not to come more than twice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: An unfavorable prognosis may be rejected, after which another atua, and sometimes
    several more, are invoked; a favorable answer is accepted without further advice.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: When a favorable verdict is given, the patient is reported to recover and
    gives a large present of food to the man entered by the ghost.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: John is consulted after several atua give adverse prognoses or after chiefly
    efforts fail, and he uses remedies learned from his parents.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The passage characterizes the possession procedure mainly as divination to
    discover whether the invalid will recover, not as treatment except possibly for
    the laying on of the hand of the ghost.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: For another sickness procedure, a father or other relative goes to a chief,
    who lays leaves of certain trees on the patient's breast while offering kava and
    praying.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The chief makes two visits on successive days; if unsuccessful, another chief
    may be called.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: After recovery in the chiefly procedure, the patient pays the chief credited
    with the cure and bathes in the sea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Simple remedies include bathing cuts in hot water, binding kavakava leaves
    on the wound, and applying a hot stone to back pain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage reports observations or statements about ringworm, catarrh and
    shortness of breath after the return of labour-vessel workers, deaths, mosquitoes,
    and fever.
  category: other
  evidence_refs:
  - ev:8
- id: obs:16
  text: The Tikopians are said to attach importance to respectful forms in interaction,
    including asking permission or speaking when passing or approaching others.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: A man wishing to pass someone who is sitting calls out a formula containing
    mata, and the seated person answers with a formula beginning Poi, erau.
  category: speech
  evidence_refs:
  - ev:9
