canonical_text:
  quote: ''
  summary: 'The passage describes conditions affecting admission to Banks Islands
    Tamate societies: the protective usefulness of badges, initiation payments, debt
    requirements, mistakes involving badges, the need for an introducer who gives
    pigs, disputes over admission, and the tiu tatas curse procedure in food quarrels.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that badges are more useful for protecting property when
    the society is smaller in number.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Members have an interest in excluding new members, while initiation payments,
    interest, and honour encourage admitting them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When one initiation is begun, other men may apply to be initiated at the same
    time; companions reduce a candidate's payment but later share the badge's protective
    power.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A man must liquidate his debts before Tamate initiation, and this must be
    done with money rather than pigs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Debt may hinder entrance into Tamate societies, but debt or need for initiation
    money may also motivate a man to induce others to join societies to which he already
    belongs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Wrong use of a badge may create a fine and an obstacle to initiation, but
    may also lead a man to enter the society whose badge he used wrongfully.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A candidate must obtain an existing member as introducer, giving him money;
    the introducer must give a pig, or pigs if more than one man is initiated.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A man with only one good pig will not act as introducer, while a man with
    a troublesome pig may welcome the role in order to dispose of it with profit.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Disputes may arise from reluctance to admit new members; objectors usually
    prevail, but disagreement may set the tiu tatas process in action.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In a tiu tatas quarrel, one man may pronounce that the other is bound under
    the curse of a society; the other may end the dispute if afraid or answer with
    a counter-curse naming another society.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A tiu tatas dispute may involve the whole island, with men coming from all
    parts, and disputers must pay pig fines to societies whose names have been taken
    in vain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Tiu tatas curses may be used only in disputes about food and not in quarrels
    about women; the food causing such a quarrel must not be eaten and is left to
    rot on the trees.
  category: sequence
  evidence_refs:
  - ev:6
