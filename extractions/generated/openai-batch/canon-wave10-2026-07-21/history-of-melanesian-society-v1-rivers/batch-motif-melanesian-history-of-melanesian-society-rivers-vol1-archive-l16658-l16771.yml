candidate_motifs:
- id: motif:1
  label: Protective sacrifice to aquatic atua
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The chief explicitly frames the rite as a sacrifice to the red sting-ray
    and black sea-eel so that they will protect the Southern Cross and the Bishop;
    food, kava, and betel offerings are then made.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage describes an ethnographic ritual rather than a myth narrative;
    the motif label should not imply a wider mythic cycle beyond the passage.
- id: motif:2
  label: Offering for return of health or life
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: Offerings to Te iofa are made to induce the atua to give back a sick man's
    health and life, and the stone prayers also ask for good health to be restored.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: high
  cautions: The passage equates health and life but does not describe death, resurrection,
    or rebirth.
- id: motif:3
  label: Sacred stone petitioned for communal welfare and weather
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The Kafika sacrificial stone receives food, kava, turmeric, scented water,
    and prayers for sickness, famine, drought, and excessive rain.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage does not identify the stone as a deity or world center; it
    should be recorded literally as a powerful sacrificial stone.
- id: motif:4
  label: Ritual restriction and secrecy around a powerful object
  taxonomy_refs: []
  basis: Women and children remain indoors during offerings to the stone, and the
