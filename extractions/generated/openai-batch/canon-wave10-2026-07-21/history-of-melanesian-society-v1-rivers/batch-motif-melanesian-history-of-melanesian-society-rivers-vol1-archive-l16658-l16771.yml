canonical_text:
  quote: ''
  summary: The passage describes Tikopia ritual offerings to named atua in animal
    forms, including a 1910 ceremony for the Southern Cross and the Bishop addressed
    to a red sting-ray and a black sea-eel; a Fangarere healing rite involving Te
    iofa and bark-cloth; and a Kafika ceremony centered on a buried sacrificial stone
    that receives food, kava, turmeric, scented water, and prayers for health, food,
    rain, or sunshine. A footnote notes that the stone ceremony was reported secretly
    by an informant who had not personally seen it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists named animal forms, including fish and birds, with some
    Mota equivalents supplied in parentheses.
  category: object
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:2
  text: On June 8, 1910, while the Southern Cross was expected and the sea was rough,
    the chief announced an intention to sacrifice to the red sting-ray and the black
    sea-eel so that they would care for the Southern Cross and the Bishop.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Taro roots were cooked, pounded in a food-bowl, and covered with coconut cream;
    turmeric, scented water, areca nut, betel leaf, and lime were placed near the
    bowl.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Raniniu, the chief sat near one end of the house, the bowl was placed in
    the middle, and the rest of the people sat at the other end.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Paevatere wrapped small portions of each offering object in a leaf, and the
    chief held the packet above his head twice while praying in a low voice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: One packet was placed beneath a yellow bark-cloth canopy behind young white
    coconut leaves for Riringo, and another packet was offered similarly to the black
    sea-eel.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Paetearikitonga made kava; the chief held kava above his head with prayer
    and poured it over the packets, then added a pounded mixture of betel leaf, areca
    nut, and lime.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the sea-protection offerings, everyone remained silent for a long time
    until food was brought and the ceremony ended.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Te iofa is described as an important Fangarere atua in the form of a fish
    with a large head whose movement is compared to a flying fox flapping.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: When invoking Te iofa, the chief lays bark-cloth on one side of the house
    as the property of the atua for five days and makes food offerings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Te iofa offering is said to induce the atua to give back the health of
    a sick man whose life is supposed to have been taken away.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Kafika people possess a sacrificial stone of great virtue at Potima-tuang;
    it is buried, protected by stones, and receives offerings on important occasions
    while women and children remain indoors.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the stone ceremony, food is prepared throughout the Kafika division, the
    stone is unearthed, carried in a basket to the beach, washed, returned, and anointed
    by chiefs with turmeric and scented water.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Food and kava are laid on the stone with prayers requesting restored health,
    food, rain, or sunshine, and the stone is later reburied wrapped in cloths.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: A footnote states that Ernest Wirit had not seen the stone ceremony and that
    it was described to him secretly at night by a man who covered his mouth to avoid
    being overheard.
  category: other
  evidence_refs:
  - ev:11
