canonical_text:
  quote: ''
  summary: The passage describes the preparation and performance of a Banks Islands
    Sukwe initiation into the Kwatagiav division. The candidate gathers money, food
    and firewood are prepared, women are temporarily excluded, a cycas/mele tree is
    brought into the gamal, ritual sounds and chants occur, money is paid to Kwatagiav
    men, a special pudding is eaten at the tree, the tree is planted outside as a
    public sign, and further money and food distributions follow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prospective initiate must have enough money before a day is fixed for the
    initiation, and repayment of money may form part of the ceremony.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Collecting firewood on the preceding Wednesday is described as a sign to all
    that an initiation is about to take place.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Food is prepared before the rite, with fires in women’s ovens in the houses
    and men’s ovens in the gamal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men of the Kwatagiav division make a pudding and then all women are sent away
    from the village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Kwatagiav man brings a cycas tree into the gamal and places it just inside
    the door when no women are near.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: At night, initiated ikeretang participants make noise with the ikeretang,
    while others blow conch-shells and make whistling sounds with dracaena leaves;
    afterward silence follows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kwatagiav men sit by the tree, Mark places half-fathoms of money on the tree,
    and John gives a half-fathom to each man while saying a formula involving Mark
    eating Kwatagiav to him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Pieces of the special pudding are held before the mouth while John chants
    words; at the end each man puts the pudding in his mouth and eats.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The tree is planted outside the gamal door as a sign of Kwatagiav, after which
    women may return to the village.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that eating at the mele tree makes the initiate a member
    of the Kwatagiav division of the Sukwe.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: On the following day, food distribution occurs after a money distribution
    involving money owed to Mark and contributions from relatives, friends, and, if
    applicable, wife or mother.
  category: sequence
  evidence_refs:
  - ev:8
