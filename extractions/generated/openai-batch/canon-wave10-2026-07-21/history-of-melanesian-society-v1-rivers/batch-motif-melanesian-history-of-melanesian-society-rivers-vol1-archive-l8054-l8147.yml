canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Banks Islands parmal associations: admission
    by drinking coconut milk from the same young coconut, disclosure or concealment
    of member names, payment and head-man authority, rules of magical protection within
    the association, membership patterns by veve or island, mutual assistance among
    members, and a Motlav analogue with an injury-magic procedure using personal materials
    from a target.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An initiate is taken to the head man and drinks the milk of a young coconut;
    the head man or another existing member drinks from the same coconut, and multiple
    initiates drink from one coconut in a practice called oloolo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Initiates learn the magical method belonging to the association, such as garatai
    or talamatai, and may use it only against people outside the same association
    or who have not drunk from the same coconut.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Drinking from the same coconut is treated as a bar to harmful action among
    those admitted by that rite.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Old members learn the names of initiates, and initiates are told the names
    of other members of the band.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man may ask that his name not be revealed to new members in order to hide
    that he has magical power, accepting the risk that new members may act magically
    against him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The reported punishment for attempting to use magical powers against a member
    of one's own parmal is death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: An initiate makes an entrance payment to the man who admits him, and the head
    man decides the amount.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: If a member's attempt at the magical rite is unsuccessful, he may ask the
    head man to try; the head man is therefore first suspected when people think they
    suffer from that special magic.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Members of a parmal are usually related and belong to the same veve or moiety;
    a man may join more than one parmal, including associations on other islands,
    to widen his protection.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: When a second parmal on an island is entered across the usual veve boundary,
    the entrance fee is larger; the passage gives the brother of Virsal entering the
    parmal of Leveveg and Rivlava as an example.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: There are many varieties of parmal, each linked to a special kind of magic;
    a man's associates in one variety need not be exactly the same as in another.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Members of the same parmal help each other in ways beyond protection from
    magic, forming a band for mutual assistance.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that the protective associations are independent of the
    Sukwe and Tamate societies, while allowing that their formation and growth may
    have been suggested or promoted by those organizations.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: On Motlav, similar mutual-protection associations are called vivtig leva karat,
    and people from one island may belong to associations on another island.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: In the Motlav procedure, a member who wants to injure an enemy goes to the
    head man, who commissions a follower to obtain food fragments, hair, nail-parings,
    or excrement from the intended victim; the supplied passage begins a food method
    involving roasting and halving a yam.
  category: sequence
  evidence_refs:
  - ev:9
