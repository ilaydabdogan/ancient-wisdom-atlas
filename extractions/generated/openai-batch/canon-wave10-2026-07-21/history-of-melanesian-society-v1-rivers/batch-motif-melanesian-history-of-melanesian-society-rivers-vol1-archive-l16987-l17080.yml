canonical_text:
  quote: ''
  summary: The passage describes Tikopian rules concerning cross-cousins called taina
    fakapariki, including prohibitions on striking or speaking evil of one another,
    supernatural punishment through an atua and ancestral ghosts, apology and food
    offerings for healing, possible ghostly revenge after death, and related kinship
    rules involving affines, marriage taboos, extended family households, and house-based
    naming.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cross-cousins who call one another taina fakapariki may not strike, injure,
    or speak evil of one another, while those called taina fakalau may do so.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A father's sister may warn a child not to strike her child, identified as
    the child's taina fakapariki.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the child strikes the cousin, the father's sister may call on her atua
    to injure the child's hand, and a sore forms.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The child's father prays for the atua to stop, and the atua appears to the
    father's sister in a dream to report this prohibition.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father's sister prays to the ghosts of her father and mother, calling
    them pae and naue, and asks them to worsen the child's hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Contrary prayers from the father's sister and the child's father anger the
    ghosts, and the child's hand becomes worse.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The father and child cook food and take it to the father's sister; the child
    apologizes, asks her to make the hand well, and asks her to blow on the hand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The father's sister offers food to her father and mother and prays for them
    to heal the child; they again come in a dream and do what she asks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the child dies, a quarrel follows between the dead child's father and his
    sister, and the father curses her and forbids her from his house or garden-ground.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If the quarrel lasts until the father's sister dies, her ghost may kill all
    the remaining children of her brother or spare one so that the family may continue.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the originally struck cousin dies, his ghost wants to kill the remaining
    child, but the ghosts of his father, mother, and grandparents embrace and kiss
    him and ask him to desist from revenge.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that the nature of the original atua is doubtful; Mr. Durrad
    thought it might be an animal atua connected with a social group, though later
    the matter is said to be in the hands of ancestral atua.
  category: other
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage notes a similarity between names for cross-cousins and sons- or
    daughters-in-law called tautau pariki, and says the similarity of name carries
    similar conduct ideas.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Cousins of both fakalau and fakapariki kinds are not allowed to marry and
    are considered tapu to one another.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The extended family is called te ganua paito, may spread into nearby houses
    as it grows, and married people customarily take names from the house in which
    they live.
  category: relationship
  evidence_refs:
  - ev:10
