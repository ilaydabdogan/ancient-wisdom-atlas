canonical_text:
  quote: ''
  summary: The passage describes rules for society hats or masks, including the prohibition
    against letting them fall to the ground during wear or initiation. It describes
    the ivis, or owl, mask of Tamate liwoa and names several materials and decorative
    parts. It then explains society badges, often croton leaves called soloi, used
    to protect property and gardens, with protection depending on society membership.
    Disregarding a badge requires pig payment to members of the disregarded society,
    apparently enforced by custom rather than formal machinery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hat or mask must not fall to the ground while being worn; the passage says
    this was formerly punishable by death, and even a baby's initiation hat is tied
    tightly to prevent falling.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a man is initiated into a society, its mask or other special object need
    not be manufactured; if he wants it made, he pays someone with the necessary knowledge,
    and the hat-making has no special ceremonial.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mask shown in Plate X is called ivis, or owl, and is one of the tamate
    of Tamate liwoa.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ivis mask has white hour-glass-shaped objects representing teeth and white
    bands made from the pith of the weslaui tree.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The eye-bearing surface is glistening black, admired by Banks Islands people,
    and is known as pei ta Vava, or the water of the Torres Islands; the surface itself
    is called lama, or sea.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Other mask materials include Abrus precatorius on bands, fowl feathers at
    the back, and pandanus roots for the general framework.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Society badges are usually objects such as croton leaves and are used to protect
    members' property, especially gardens; when used this way they are called soloi.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: A Banks Islands badge protects property only from people who are not members
    of the society whose badge it is.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: A man can combine badges from multiple societies to protect property against
    a wider part of the population; small societies are useful for this purpose, while
    very large societies are not useful for this protective function.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: A person who takes property protected by a badge of a society to which he
    does not belong must give a pig to members of the disregarded Tamate; multiple
    badges may require multiple pigs.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage reports no discovered machinery for enforcing these punishments
    and says respect for custom appears to remove the need for a tribunal.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: A man may disregard a soloi inadvertently because many croton species are
    used as badges and one may be mistaken for another.
  category: action
  evidence_refs:
  - ev:11
