canonical_text:
  quote: '"two chief social groups or moieties, called veve or vev"'
  summary: The passage introduces the Banks Islands and Mota, then describes dual
    social organization in most Banks Islands. It gives local names and reported attributes
    for moieties, especially in Mota, and recounts an ancient long club-house whose
    opposite ends were associated with the two divisions. Crossing from one end to
    the other is said to have changed a man's division and disposition.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Banks Islands are described as lying north of the New Hebrides, with Mota
    identified as the island chiefly discussed.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mota is described as little more than two miles in diameter, with inhabitants
    on a raised coral base around a central volcanic cone.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: All the islands except Merlav are said to possess a dual organization of society
    with two chief social groups or moieties called veve or vev.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The term veve or vev is also said to mean mother, and members of the same
    moiety are called sogoi to one another.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The moieties generally have no special names and are spoken of as belonging
    to the same side or the other side of the house.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Lakon district of Santa Maria, one veve is called Atealoa and is believed
    to have been created by the sun.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Mota, one moiety is called Takwong, explained as belonging to night; one
    informant gave Tatalai as the name of the other moiety, with talai identified
    as the giant clam-shell.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Takwong are reported as ignorant, quarrelsome, and unable to manage affairs,
    while the Tatalai are reported as versed in social lore, peaceable, and capable
    of governing.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says there was formerly enmity between the two Mota moieties and
    that some feeling of enmity remained.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: An ancient very long gamal or club-house is said to have had the Takwong at
    one end and the other moiety at the other end.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: A man is said sometimes to have changed division by crossing from one end
    of the gamal to the other, and in doing so changed his disposition.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A Tatalai man crossing to the Takwong side is said to have risked being killed
    by those he attempted to join.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The site of the ancient building is said still to be visible, and stones said
    to be part of it are described as cut unlike any others on the island.
  category: object
  evidence_refs:
  - ev:6
