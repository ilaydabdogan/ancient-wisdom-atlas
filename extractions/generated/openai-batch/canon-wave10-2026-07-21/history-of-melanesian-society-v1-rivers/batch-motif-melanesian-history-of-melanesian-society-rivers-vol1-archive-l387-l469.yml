  quote: the terms of these systems denote relationships rather than relatives
  summary: 'The passage describes features of classificatory kinship systems: broad
    grouping of relatives, distinctions between paternal and maternal relatives, links
    to clan organisation and exogamy, reciprocal kin terms, sibling terms differentiated
    by sex relation, early separation of brothers and sisters, and age-differentiated
    sibling terms.'
