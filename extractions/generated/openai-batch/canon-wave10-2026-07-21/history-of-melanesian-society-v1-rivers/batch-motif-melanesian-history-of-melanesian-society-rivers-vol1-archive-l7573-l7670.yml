canonical_text:
  quote: ''
  summary: 'The passage describes Banks Islands pregnancy and childbirth customs:
    pre-delivery gifts, food and action taboos, remedies for safe delivery, practices
    for influencing a child''s sex, first-born rites, and Mota/Motlav beliefs that
    prenatal encounters with animals or plants can establish a child''s identity,
    fortunes, and lifelong prohibitions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before expected delivery, the husband gives two fathoms of money to the wife's
    brother, with the stated idea that the woman's womb may be large and the child
    strong; this is done only for the first-born.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the husband catches an octopus during his wife's pregnancy, neither husband
    nor wife eats it, because it is believed the child would cling to the womb and
    not come out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mother must not eat fish caught with a hook, because it is believed the
    child would be held back as with a hook.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A pregnant woman roasting breadfruit or yams in the bush puts the fire on
    a platform of stones rather than on the ground, with the stated idea that the
    child may grow tall.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: For safe delivery, the woman's mother pounds romlis tree leaves in a wumeto
    bowl, rubs the juice on the abdomen, and gives a draught to drink.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If delivery is delayed, people check whether the husband has bound items such
    as a belt or armlets on him, and he removes them if present.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A woman who wants a boy or a girl is believed able to produce the desired
    sex by eating fruit from specific trees, one associated with a boy and another
    with a girl.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: It is believed that boys stay in the womb longer than girls, so delayed birth
    after the expected time indicates to them that the child will be a boy.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: After birth, the father does not work or go far away until the child is strong,
    with the stated motive that he should be at hand to help his wife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The described first-born ceremonies are performed whether the child is male
    or female, and are performed only once.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The author introduces Mota and Motlav customs in which events before childbirth
    affect the child's life and fortune and create a definite relation between the
    child and an animal or plant.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In Mota, many persons are prohibited by custom from eating certain animals,
    eating certain fruits, or touching certain trees.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The stated ground for many prohibitions is that the person is believed to
    be the animal or fruit in question, because the mother received influence from
    that animal or plant before birth.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The usual course begins when a woman sitting in her garden, in the bush, or
    on the shore finds an animal in or near her loin-cloth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The woman carries the animal to the village, asks about the appearance, and
    the people say she will give birth to a child who will have the animal's characters
    or will be the animal.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The woman returns the creature to its proper home, builds a wall around it,
    and visits and feeds it every day.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: When the animal disappears, it is believed to have entered the woman at the
    time of disappearance.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: The author states that this was not understood as physical impregnation by
    the animal or as a material animal entering the womb, but as involving a more
    or less supernatural or spirit animal.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:19
  text: In a remembered case, a woman carried an animal in her closed hands from the
    bush to the village, but it had vanished when she opened her hands; people believed
    entry had occurred on the way.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:20
  text: The author states that childbirth following the appearance of an animal or
    plant was not regarded as exceptional with respect to the relation between sexual
    intercourse and pregnancy.
  category: other
  evidence_refs:
  - ev:11
