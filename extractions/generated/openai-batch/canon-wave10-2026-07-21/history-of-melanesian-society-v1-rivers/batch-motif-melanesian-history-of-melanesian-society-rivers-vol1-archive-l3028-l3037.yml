canonical_text:
  quote: ''
  summary: The passage describes ownership and inheritance of a village gamal or club-house.
    When connected with a known founder, the gamal belongs to a descendant, and inheritance
    is described as passing to a brother or sister's son rather than to a child. A
    specific case gives Rivlava's gamal passing to his brother Matthias instead of
    to his adopted son Matthew, and later expected to pass to Robert, son of the sister
    of Rivlava and Matthias.
  language: English
  quote_policy: summarized
