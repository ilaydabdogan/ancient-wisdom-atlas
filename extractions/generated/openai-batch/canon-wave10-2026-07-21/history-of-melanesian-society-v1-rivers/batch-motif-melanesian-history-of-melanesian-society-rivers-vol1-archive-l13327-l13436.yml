  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some Nandrau-related divisions have animal-eating restrictions, including
    prohibitions on dog, ndabea fish, snake, and human flesh for specified groups.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Some Nandrau-related groups have plant-food restrictions, including giant
