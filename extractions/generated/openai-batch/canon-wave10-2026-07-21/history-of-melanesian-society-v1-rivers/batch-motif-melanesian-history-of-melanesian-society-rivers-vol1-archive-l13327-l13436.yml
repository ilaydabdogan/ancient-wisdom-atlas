  evidence_refs:
  - ev:6
- id: obs:8
  text: The tambu or sacred animal of the whole Nandrau tribe is identified as the
    nggiliyango, a small black bird with a long beak, called ngginggi in the Mbau
    dialect.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Nandrau people are said to believe they are descended from the nggiliyango
    bird.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The bird is said to have told the Nandrau not to steal women, glossed by the
