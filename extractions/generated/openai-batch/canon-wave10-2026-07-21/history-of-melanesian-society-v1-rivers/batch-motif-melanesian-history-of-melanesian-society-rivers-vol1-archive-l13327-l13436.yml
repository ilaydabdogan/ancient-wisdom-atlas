  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The Nandrau tribe is said to have many matanggali divided into three ranks:
    chiefly, ordinary people, and one vanua group supplying heralds and intermediaries.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Four chiefly matanggali are named after four brothers from whom members trace
