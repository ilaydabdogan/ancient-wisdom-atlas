  quote: ''
  summary: Rivers discusses relationship terminology and inland Fijian tribal systems,
    especially the Nandrau. He records ranked matanggali divisions, chiefly descent
    traditions, special group functions and privileges, associated groups, and taboos
    surrounding a sacred bird ancestor and restricted animals or foods.
  language: English
  quote_policy: summarized
