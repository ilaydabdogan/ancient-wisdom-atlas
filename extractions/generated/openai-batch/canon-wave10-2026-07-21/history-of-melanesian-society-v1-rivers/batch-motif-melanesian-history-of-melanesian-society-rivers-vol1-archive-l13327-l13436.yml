    in Samoa.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The author reports obtaining three systems from mountainous interior tribes:
    Nandrau, Navatusila, and Dhawanisa.'
  category: setting
  evidence_refs:
