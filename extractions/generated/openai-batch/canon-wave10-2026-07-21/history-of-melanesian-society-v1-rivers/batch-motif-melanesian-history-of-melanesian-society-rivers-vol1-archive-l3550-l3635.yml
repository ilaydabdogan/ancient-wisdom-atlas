canonical_text:
  quote: ''
  summary: The passage describes monetary and pig contributions connected with Charles
    Wunau, interpreting many of them as reciprocal returns from distant relatives
    or members of the opposite veve. It then describes a night sequence of money measuring,
    bamboo drumming, singing, women’s dancing, kava drinking, fire-heated oven preparation
    in the gamal, sleeping in adjacent divisions, morning food preparation, meretang
    playing in the woods, preparation of plant decorations, and payments to assistants.
  language: English
  quote_policy: summarized
