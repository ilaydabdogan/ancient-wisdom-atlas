canonical_text:
  quote: ''
  summary: The passage introduces Tikopia, describes a brief missionary-steamer visit,
    and explains how Rivers and Mr Durrad obtained information from John Maresere,
    a Wallis Island man who had drifted to Tikopia by canoe, lived there for twenty
    years, was later sent away in a canoe as punishment, and eventually returned and
    left again. A footnote notes a similar earlier report of another Wallis Island
    native driven to Tikopia.
