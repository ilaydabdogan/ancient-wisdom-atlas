canonical_text:
  quote: ''
  summary: The passage describes Banks Islands marriage rules and kinship classifications,
    including prescribed marriage with a mother's brother's widow, usual levirate
    with a brother's widow, marriage with a wife's sister, the Mota category mateima
    for these potential wives, inter-island marriage restrictions, bridewealth negotiation,
    the father's sister's veto, and sanctions for same-veve marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the usual Banks relationship system, cross-cousins stand to one another
    in a relation corresponding to parent and child; one Merlav case of cross-cousin
    marriage is noted as exceptional or specially conditioned.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Marriage with the widow of the mother's brother is described as a prominent
    orthodox marriage in the Banks Islands.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In older polygynous practice, a man could take the wife or wives of his dead
    maternal uncle, and a maternal uncle could hand over one or more wives to his
    sister's son during his lifetime.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a man marries his mother's brother's wife, he comes to stand as father
    to his uncle's children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage describes a usual levirate form in which a man may marry the widow
    of his deceased brother, whether he is the elder or younger brother of the late
    husband.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A third orthodox marriage form is marriage with the wife's sister, including
    marriage to a deceased wife's sister or polygynous marriage to sisters.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In Mota, the widow of the mother's brother, the brother's wife, and the wife's
    sister are all classed together as mateima because of their position as potential
    wives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Inter-island marriages within the Banks group are said to follow the same
    moiety restrictions as marriages within a single island.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The author reports possible asymmetric inter-island marriage customs involving
    Mota, Motlav, Vanua Lava, and Ureparapara, but states that exact genealogical
    data are lacking.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Marriage arrangement is described as having little or no ceremony and usually
    being negotiated by a third party.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The bridegroom pays an amount negotiated by a third party to the bride's relatives;
    one Rowa example gives sixty fathoms of shell-money and two pigs.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Payment is said not to be made when a man marries his mother's brother's widow,
    and a man receives nothing if that widow marries elsewhere.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The man's father's sister has a power of choice or veto over marriage, described
    as absolute in some islands.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: A girl may occasionally be married before she is old enough to live with her
    husband.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: In the old days, a man and woman who married within the same veve were publicly
    killed by their relatives, usually with bows and arrows and less often by clubbing;
    in the present, they are subject to island-wide scorn and derision.
  category: action
  evidence_refs:
  - ev:10
