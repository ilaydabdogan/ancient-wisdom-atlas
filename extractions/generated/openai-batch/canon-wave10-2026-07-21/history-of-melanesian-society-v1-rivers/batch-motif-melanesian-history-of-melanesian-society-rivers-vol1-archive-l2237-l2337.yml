canonical_text:
  quote: ''
  summary: The passage gives Banks Islands ethnographic examples of affinal relationship
    obligations. A woman invokes the head of her husband's wului to compel him to
    fetch stones for a mat; another relative's head is then invoked, requiring compensation
    before the mat can be finished. Further examples describe the same formula stopping
    wife-beating and quarrels, with sanctions of money payment or tree destruction.
    The passage then discusses wife's sister and brother's wife as possible wives,
    compares terminology and poroporo joking customs across Rowa, Mota, and Vanua
    Lava, and begins an anecdote in which Charles jokes about Nicholas's wife and
    Walter Woser responds by fetching an old leaf-mat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Georgina is making a mat and asks her husband Katlavi to fetch two stones
    to hold down a corner; after he refuses, she invokes the head of his wului, identified
    in the passage as Charles, and Katlavi goes to fetch the stones.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Katlavi brings the stones wet and dirty, so they are not fit to put on the
    mat.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Charles becomes angry and says that if Georgina continues making the mat,
    it is the head of Mabel; Georgina can only finish after paying compensation to
    Mabel.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that Charles and Mabel are distant relatives in the example,
    and that the duties connected with these relationship ties are not limited to
    immediate siblings' spouses.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In another example, a wife who is beaten may warn her husband by saying that
    she is the head of his wului; if he persists, her brothers, described as her husband's
    wului, demand twenty fathoms of money or cut down some of his trees.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: If two men quarrel, others may invoke the head of their kwaliga or wului;
    if the men disobey, they must pay money or have their trees destroyed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage describes the wife's sister and brother's wife as possible wives
    for a man, with different terms and address practices in different Banks Islands.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Mota, these relatives share the name mateima with another potential wife,
    while women have the reciprocal term welag for potential husbands; in Vanua Lava
    they call each other by the same names as real husband and wife.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'Poroporo custom differs by island: in Rowa a man would not poroporo his wife''s
    sister or brother''s wife; in Mota he might do so respectfully, avoiding definite
    sexual references.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage reports that if a woman carries poroporo too far, she would have
    to be taken as wife by her sister's husband.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the final anecdote, Charles sees Nicholas's wife and jokes that she is
    the wife of both Nicholas and himself; those present laugh, including Nicholas's
    wife.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Walter Woser retorts to Charles, the people laugh again, and Walter runs to
    get an old stinking leaf-mat used as an oven covering; the supplied passage ends
    before the action is completed.
  category: sequence
  evidence_refs:
  - ev:6
