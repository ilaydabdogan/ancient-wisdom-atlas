canonical_text:
  quote: ''
  summary: The passage enumerates several Banks Islands Tamate societies, many named
    after birds, fish, insects, shells, or other natural items, and records their
    hats, masks, badges, and membership notes. It then summarizes rules about animal
    namesakes, sacredness, food or object restrictions, speech avoidance, initiation,
    and member-limited use of animals, plants, and badges, including examples from
    Motlav.
  language: English
  quote_policy: summarized
