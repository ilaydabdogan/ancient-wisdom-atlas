canonical_text:
  quote: ''
  summary: The passage lists and compares several Melanesian kinship terminologies,
    especially Mbau, Nausori, Narambula, and Nokanoka variants. It emphasizes how
    cross-cousin marriage and affinal relations shape terms for mother's brother,
    father's sister, cross-cousins, spouses, in-laws, grandparents, and grandchildren,
    and it compares the author's records with earlier accounts by Thomson, Fison,
    and Morgan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One variant differs from Mbau by using ngandinanggu for mother's brother and
    husband of father's sister, nganeitamanggu or nganei for father's sister and wife
    of mother's brother, natunggu for sister's son, and vunonggu for that son's wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the same variant, avalenggu is limited to relatives by marriage, including
    wife's sister and wife's brother; husbands of two sisters are avalenggu, while
    wives of two brothers are ndauvenggu.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Narambula variant gives manggu for father, nau for mother, ngandi for
    mother's brother, nganei for father's sister, vunonggu for a man's sister's children
    and their spouses, tumbunggu for grandparents, and makumbunggu for grandchildren.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Narambula variant uses karuanggu for sons and watinggu for daughters of
    mother's brother or father's sister, limits tavalenggu to relatives by marriage
    as among the Nokanoka, and applies it to brother's wife, sister's husband, and
    wife's brother.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that the author's Mbau system agrees closely with Thomson's
    account and that the author's Nausori system agrees even more closely with Fison's
    1869 system as recorded by Morgan.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage also names specific differences from Thomson's and Fison's accounts,
    including differences involving vungo, ngandina, tumbu, wati, nonggu ndaku, and
    watinggu.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author says the close agreement over nearly forty years gives some assurance
    that the inland systems he recorded are broadly correct in their main features.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that the Mbau and Nausori systems are clearly based on
    cross-cousin marriage.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Mbau system, mother's brother is classed with the father of the consort,
    father's sister with the mother of the consort, and cross-cousin with wife's sister,
    husband's brother, and their reciprocals.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Nausori system gives the cross-cousin of different sex the same designation
    used for husband or wife.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'The Mbau system is described as exceptional because it has three separate
    terms for categories of cross-cousin and brother-in-law or sister-in-law: one
    between men, one between women, and one between persons of different sex.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage describes a transition from Mbau, where wife's sister and husband's
    brother are classed with the cross-cousin, to Nausori, where they receive the
    same designation as the actual wife.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: 'The Mbau system has multiple terms for mother''s brother: momo, vungo, and
    ngandi; the author links vungo to the mother''s brother''s position as father-in-law
    through cross-cousin marriage and identifies ngandi as an abbreviation of ngandinanggu.'
  category: relationship
  evidence_refs:
  - ev:8
