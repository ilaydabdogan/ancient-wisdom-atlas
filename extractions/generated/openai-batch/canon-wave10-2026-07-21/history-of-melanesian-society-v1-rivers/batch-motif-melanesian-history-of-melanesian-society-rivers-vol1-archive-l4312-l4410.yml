canonical_text:
  quote: ''
  summary: The passage describes kava preparation and drinking practices in the Banks
    Islands context, including rank restrictions, use of special cups, a Mota prayer
    accompanied by pouring a small amount on the ground, Pek vessel etiquette, breath-blowing
    after drinking, an unusual scraped-root method used during a rank-taking dance
    and identified as Fijian in manner, and notes on the recent or limited distribution
    of kava use across islands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dregs poured into a special cup are not discarded and may be drunk by anyone
    of Tavatsukwe rank; before drinking they are strained through coconut fibre into
    a cup.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On Mota, kava is especially drunk on days when something is occurring in the
    Sukwe, and the narrator was not told of its use with other ceremonial activities.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A prayer formula connected with kava drinking is recorded; it refers to kava
    and ghosts, is said when the kava is ready, and is accompanied by pouring a very
    small quantity on the ground.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Pek in Vanua Lava, kava may be prepared with one shallow wooden handled
    cup or with a second coconut cup, with liquid transferred between vessels before
    drinking.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'Cup material is described as rank-linked: a wooden cup is used low in the
    Sukwe, while higher ranks use coconut cups.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The vessels should not touch the ground, and the liquid should be sucked up
    without putting the lips to the edge of the cup.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After drinking, the breath is blown out strongly so that some kava is blown
    out; the stated motive is to clear fragments of kava root from the teeth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: During the dance for Charles Wunau taking the step to Wometeloa rank, men
    sat outside the lower end of the gamal while the kava maker scraped kava root,
    moistened it with water, squeezed juice into a small coconut cup, mixed it in
    a larger cup, and passed it to a man to drink.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the Wometeloa dance procedure, the drinker put a hollowed part of the cup
    to his lips, drank with a prolonged sucking noise, and poured the last drops on
    the ground.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The scraped-root and pudding-dish procedure was said to be made in the Fijian
    manner, recently brought by people who had been to Fiji, but the narrator says
    characteristic Fijian ceremonial features seemed absent.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage reports differing views on whether kava was recently introduced
    into the Banks Islands and whether its use had spread to, been abandoned in, or
    never occurred on specific islands.
  category: other
  evidence_refs:
  - ev:9
