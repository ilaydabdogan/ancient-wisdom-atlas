canonical_text:
  quote: ''
  summary: The passage gives an ethnographic account of Tavua-related social divisions
    and their associated animals, including named snake ancestors, a crab descent
    belief with food avoidance, friendly snakes connected with people, a note on joking
    reputations, and Tavua relationship terminology compared with other Fijian systems.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kainavauvau and Kainambuna are said to possess red snakes descended from
    a mother snake named Tunandal.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kainavanuakula are associated with snakes that have broken tails and are
    descended from a broken-tailed snake named Mundu.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Kainambila snake lives on a banana called nakukoto or matadhawaka and
    is descended from a female ancestor named Tunavuni.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Oimua subdivision of the Kainambila formerly avoided eating the nggarau
    or crab, and people believed they descended from that animal.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Snakes of the Tavua people are believed to be friendly to the people of divisions
    connected with them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Kainambila person encountering one of his snakes on its banana could address
    it as Vakawali, after which the snake would crawl along his arm, climb onto his
    shoulder, and twine around his neck.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A footnote reports that some families or social groups have special reputations
    as jokers, and says the Mondelau division of the Naiavusambalavu itokatoka had
    this reputation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A note says the common origin of the snakes of two divisions confirms evidence
    that their relationship to one another is closer than to other matanggali.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:9
  text: In Tavua relationship terms, ta, nau, and luvenggu are used for father/mother/child
    categories in a way described as like the Mbau system.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tavua children of the mother's brother and father's sister are called tuakanggu
    or tadhinggu according to age, terms also used for brother and sister.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that, unlike other recorded Fijian systems, Tavua cross-cousins
    are classed with brothers and sisters rather than given special designations.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Tavua term tavale, generally used in Fiji for cross-cousins, is here used
    for a brother's wife, a sister's husband, and the relationship between men married
    to two sisters.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Grandparents are called tai and grandchildren viangonggu; the terms are said
    to resemble hill tribes while their method of use is closer to the Mbau system.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: For cousins, the use of tuaka and tadhi depends on the relative ages of the
    fathers rather than on the relative ages of the people using the terms.
  category: relationship
  evidence_refs:
  - ev:11
