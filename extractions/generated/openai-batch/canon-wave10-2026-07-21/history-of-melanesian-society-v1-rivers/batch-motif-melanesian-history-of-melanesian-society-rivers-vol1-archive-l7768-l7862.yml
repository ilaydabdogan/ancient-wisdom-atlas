canonical_text:
  quote: "“This is myself; hide me.”"
  summary: The passage describes the Banks Islands tamaniu, an individual animal obtained
    through a rite and treated as a personal counterpart or life-token. The animal
    is hidden, may be consulted during illness, can be used to injure enemies, and
    is believed to share or signal its owner’s fate. A case of a blind man’s lizard
    tamaniu in the roots of a banyan tree is given as an example.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The tamaniu relation is described as a relation between a person and an individual
    animal, not a relation with an entire species; a person with a given tamaniu does
    not eat animals of that kind.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A tamaniu is obtained through a definite rite performed by a man with special
    mana, or possibly by a man who owns a stone or object with such mana.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The rite includes pounding leaves from several kinds of trees into pulp, rubbing
    the pulp on the seeker or giving juice to drink, then placing the pulp in a rock
    cleft protected from salt water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After five days the place is examined; whatever creature has appeared becomes
    the tamaniu of the person for whom the rite was performed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The tamaniu is given to the owner’s father, mother, or grandparent to hide
    in a secret place, and the owner identifies it as himself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Animals known as tamaniu include crab, rat, eel, sea-snake, fishes, shark,
    sting-ray, octopus, turtle, centipede, black lizard, coconut crab, and two sea
    birds.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tamaniu are said sometimes to grow very large, to be tame toward their owners,
    and not to harm their owners even when ordinarily dangerous.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A tamaniu can be directed to injure an enemy in a manner specific to its animal
    form, such as biting or swallowing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The tamaniu is described as a life-token and representative of the owner,
    allowing the owner to learn whether he is ill, likely to recover, or likely to
    die.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
- id: obs:10
  text: During illness, a son may call the tamaniu out, inspect it for injury, remove
    an object from its skin if found, or ask it whether it will live or die; a nod
    means death and a head-shake means recovery.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: If the owner dies, the tamaniu is said to die too.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the example, a blind man obtained a puasa lizard tamaniu from Merig, brought
    it to Mota, and placed it in the roots of a large banyan tree where it grew very
    large.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: When the blind man became ill, a helper called the lizard by name; the lizard
    emerged sluggishly, nodded when asked if it was ill, and returned to the banyan
    roots.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The blind man died not long afterward, and the fall of the banyan tree was
    taken as a sign that the tamaniu had also died.
  category: sequence
  evidence_refs:
  - ev:12
