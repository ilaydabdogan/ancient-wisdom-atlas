    father or other relatives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Tawarig is described as probably denoting status rather than relationship
    and as used especially for the son’s wife and for women who should help on certain
    occasions.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: Wulus is reciprocal between men for wife’s brother and sister’s husband; walui
    is reciprocal between women for husband’s sister and brother’s wife; gasala is
    used between the parents of a married couple.
  category: relationship
  evidence_refs:
