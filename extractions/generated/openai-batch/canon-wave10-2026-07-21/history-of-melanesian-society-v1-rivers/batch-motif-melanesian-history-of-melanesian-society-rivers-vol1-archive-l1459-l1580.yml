canonical_text:
  quote: ''
  summary: The passage lists and explains Banks Islands kinship terms, including terms
    for mother, father’s sister, children and siblings, maternal uncle and sister’s
    son, spouses, grandparents, affines, and parents of a married couple. It also
    notes an honorific prefix, reciprocal kin terms, classificatory extensions, and
    a ceremony in which the father’s sister and other women are called veve vus rawe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Veve is used for the mother, the mother’s sister, and the wife of the father’s
    brother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father’s sister is also called veve but is distinguished by forms including
    raveve, veve vus rawe, and vevegae; the passage says she is not of the same veve
    as her nephew.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Natui is described as generally reciprocal to the preceding terms and is used
    for children, certain brothers’ or sisters’ children, and the children of the
    mother’s brother.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tugui, tasiu, and tutuai are sibling terms, with tugui associated with elder
    same-sex siblings, tasiu with younger same-sex siblings and sometimes siblings
    generally, and tutuai used between brother and sister.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sibling terms tugui, tasiu, and tutuai are extended beyond own siblings
    to children of the father’s brother and mother’s sister and generally to people
    of the same moiety or veve in the corresponding generation.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Veve vus rawe is the term for the father’s sister and is also given to other
    women who take part in a certain ceremony; the father’s sister is described as
    always the most important among them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Usur is used only for the husband of the father’s sister, who may also sometimes
    be called maraui.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Maraui is the mother’s brother, and vanangoi is the reciprocal term given
    by a man to his sister’s son.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mateima and welag are reciprocal affinal terms used for several relationships,
    including relationships one generation removed and relationships within the same
    generation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Tupui, with pupua in address, is used for the four grandparents and reciprocally
    for the four kinds of grandchild, with classificatory extension.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Rasoai is a reciprocal term for husband and wife; amin or amai is also used.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Kwaliga is generally a reciprocal term for parents of husband or wife and
    for the consort of son or daughter; the wife’s mother is distinguished as rakwaliga
    with the honorific prefix.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The author reports hearing itata, with tata in address, applied to the husband’s
