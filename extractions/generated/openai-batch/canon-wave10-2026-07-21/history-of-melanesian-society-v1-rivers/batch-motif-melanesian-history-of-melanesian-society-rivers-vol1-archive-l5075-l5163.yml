canonical_text:
  quote: ''
  summary: The passage describes a Banks Islands salagoro or Tamate initiation. A
    candidate is separated from female kin, decorated in the bush, brought into a
    prepared village space, led around six stakes, made to give money, moved stake
    by stake as the werewere sound is made, instructed in duties, and finally shown
    that the secret Tamate cry is made with a stick and stone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Six stakes of var or hibiscus wood are set in the village center opposite
    the gamal door, arranged east to west and called mategawoso.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the candidate leaves his mother, sisters, and other female relatives,
    they cry as if he were leaving for a long time; the account says that formerly
    such candidates were sometimes not seen again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The candidate is taken into the bush and decorated with hibiscus flowers,
    leaves, a waist belt called kworotal, and croton leaves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A stone judged suitable for the candidate to lift is placed in the open village
    space and covered with a plaited mat called tapangau.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The gamal door is covered with a plaited mat; a leaf-bound stick used for
    making the werewere sound is put through a hole in the mat, and a man waits inside
    with a small werewere stone.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Money is bound around the candidate’s arm and neck, placed in a shoulder bag,
    and hung on his outstretched left hand.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The senior member leads a procession, followed by the candidate; the procession
    passes around the stakes five times.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The candidate hangs two fathoms of money on the projecting stick without knowing
    what the object is; another member says the act buys the eye of the Tamate for
    the last initiated member, who takes the money.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The neophyte stands by successive stakes while a man inside the gamal makes
    the werewere sound and spoken formulas name several initiations, including Tamate
    ta Ureparapara, Kwat wasawasa, wan, Kwaskwasoroa, pei ta Vava, and Tamate werewere.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A speaker instructs the neophyte in salagoro rules, including keeping the
    path clean, fetching water, scraping coconuts, inviting fellow members to eat,
    and not touching things seen inside the salagoro.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The mat is removed from the central stone, and the neophyte is told that what
    he had thought was something good is only a stone.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The man from inside the gamal rushes out, makes the werewere sound on the
    stone, and the account says the secret cry of the Tamate is revealed to the novice.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the revelation, the neophyte lifts the stone, or attempts to do so.
  category: action
  evidence_refs:
  - ev:9
