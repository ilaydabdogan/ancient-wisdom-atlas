canonical_text:
  quote: ''
  summary: The passage describes Tikopian food, water vessels, mourning food, betel
    and kava practices, island geography and districts, reported Tongan descent among
    some inhabitants, and the atua or sacred objects associated with Kafika, Tafua,
    and Taumako divisions, including sting-rays, eels, fish, crocodile, flying fox,
    taro, sword-fish, and chiefly ritual restrictions or decorations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The staple foods named for Tikopia include fish, coconuts, yams, taro, sago,
    banana, and mammy apple; pigs are absent and turtle eating is described as recent.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coconut cream is made by grating coconut flesh and expressing the juice, and
    coconut shells are used as water-vessels.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Mammy apple is described as the only food allowed in mourning, although it
    is also described as a recent importation.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Betel-mixture is widely used; lime is kept in undecorated gourds, and an elderly
    Taumako chief was seen preparing betel-mixture in a cylindrical vessel with a
    spatula.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kava is said to be used extensively in ceremonial but never drunk.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The island has a large lake at the north-east end, hills surrounding it, swampy
    level ground south-west of it, widespread cultivation, and no uncleared forest.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tikopia is divided into Faea and Ravenga districts, whose people are described
    as having an inveterate feud; a big rock at Tufenua marks the division.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Certain islanders are said to be descended from men who came to Tikopia from
    Tonga some generations earlier.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The atua are defined in this passage as sacred objects of the four divisions,
    with the source noting that Mr Durrad gives them as chiefs' atua but that most
    probably also belong to all members of each division.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Kafika atua include a very large black sting-ray called Te riringo, two small
    fish called Te kuku and Te panoko, and the crocodile.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: When a Taumako chief's canoe overturned near the steamer Southern Cross, people
    saw a huge black sting-ray, shouted that Kafika was coming, threw four coconuts
    into the sea, and the sting-ray went away.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Tafua atua include a very large lake eel called Te atua Tafua; at the
    installation of the present Tafua chief, offerings were made to the eel at a sacred
    place beside the lake.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Other Tafua atua or related sacred restrictions include a large sea eel, the
    flying fox, a sting-ray, a kind of taro that the Tafua chief may not look at,
    and a sword-fish or garfish that the chief and eldest son may not eat.
  category: object
  evidence_refs:
  - ev:12
- id: obs:14
  text: The Tafua chief's distinctive decoration is a twisted leaf of te katafa worn
    around the neck.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:15
  text: The Taumako atua listed are the flying fox, a red sting-ray, and a white eel
    of the sea.
  category: object
  evidence_refs:
  - ev:13
