candidate_motifs:
- id: motif:1
  label: mourning restricted to a single permitted food
  taxonomy_refs: []
  basis: Mammy apple is identified as the only food allowed in mourning.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage also states that mammy apple is a recent importation, so the
    antiquity of the restriction is not established here.
- id: motif:2
  label: sacred objects or animal atua associated with social divisions
  taxonomy_refs: []
  basis: The passage defines atua as sacred objects of divisions or chiefs and lists
    distinct atua for Kafika, Tafua, and Taumako.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage calls them atua or sacred objects; no additional mythic narratives
    for most listed objects are provided in this excerpt.
- id: motif:3
  label: coconut act turns away sacred sting-ray
  taxonomy_refs:
  - sacred_exchange
  basis: During the Southern Cross incident, people saw a huge black sting-ray, called
    out that Kafika was coming, threw four coconuts into the sea, and the sting-ray
    went away.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage does not explicitly call the four coconuts an offering, though
    the act occurs in relation to an atua-associated sting-ray.
- id: motif:4
  label: chiefly installation with offerings to an eel at a sacred lake place
  taxonomy_refs:
  - royal_legitimacy
  - sacred_exchange
  basis: The present Tafua chief's installation took place at a sacred place beside
    the lake, where the chief made offerings to the eel called Te atua Tafua.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage links installation and offerings but does not explain the
    ritual logic or explicitly state that the eel confers legitimacy.
- id: motif:5
  label: chiefly food and sight taboo
  taxonomy_refs: []
  basis: The Tafua chief may not look at a kind of taro; the chief and eldest son
    may not eat sword-fish or garfish, while younger children may.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The reason for the taboos is not explained in the passage.
- id: motif:6
  label: rock boundary between feuding districts
  taxonomy_refs: []
  basis: The passage states that a big rock at Tufenua marks the division between
    Faea and Ravenga, whose people are in an inveterate feud.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: This is a social-geographic pattern in the excerpt rather than a narrated
    mythic episode.
