- id: claim:1
  claim: The passage explicitly compares the Taumako chief's betel-mixture preparation
    with the method used by elderly men in the Solomon Islands.
  claim_level: same_function
  target: Solomon Islands elderly men's betel-mixture preparation
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison concerns an observed cultural practice, not a mythic
    motif; the passage gives one Tikopian observation.
- id: claim:2
  claim: The passage reports historical contact or origin from Tonga for certain Tikopians,
    stating they descend from men who came from Tonga some generations earlier.
  claim_level: historical_contact
  target: Tonga-Tikopia population connection
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: No migration narrative, dates, names, or corroborating details are
    provided in this excerpt.
