canonical_text:
  quote: ''
  summary: The passage describes adoption practices in Motlav and Merlav in the Banks
    Islands, including feeding, suckling rules, cycas-leaf marking, payments, transfer
    timing, later-life adoption disputes, stated motives for adoption, and brief inheritance
    rules concerning land and trees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Motlav, a man wishing to adopt a newborn or unborn child sends his wife
    to the mother to give food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Motlav, some food is chewed and given to the child by the woman wishing
    to adopt it, and this giving of food seals the transaction.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Motlav, the adopting parents take the child at once; the adopting mother
    may suckle the child or give it to another woman, while the real mother is not
    allowed to suckle the child.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: In Merlav, a man wishing to adopt a child about to be born waits for the birth,
    then runs to plant a cycas leaf in front of the door; the first man to plant a
    leaf is counted as father of the child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Merlav, the cycas leaf remains in front of the house for ten days, the
    adopting father pays money to the midwife, and later pays money to the father
    when the child begins cutting teeth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A child may also be adopted later in life, including after the death of a
    woman who leaves a young child.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In a recent case, a real father who had remarried tried with his wife to entice
    an adopted boy back after the boy had become a capable youth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In that case, the father's sister was accused of telling the boy his real
    parentage, and the parties were in continual conflict about the matter.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The adopting father in the disputed case had been responsible for the boy's
    initiation into the Stikive, had supplied money for contributions involving the
    boy's sogoi, and had supported him through trees planted for him and years of
    food supply.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'Several motives for adoption are reported: childless persons lack honour,
    may be ridiculed, and desire a child as a tano loglog, a ''place of calling.'''
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Childless people are described as kind and generous toward village children
    so that children will obey them, bring fish and food, and help them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Adoption is also said to help prevent property from passing out of the family.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: 'The passage reports an inheritance distinction: ancient hereditary cultivated
    ground goes to the sister''s son, while recently reclaimed bush land goes to the
    children of the man who cleared it; property in trees goes to the children of
    the planter.'
  category: relationship
  evidence_refs:
  - ev:6
