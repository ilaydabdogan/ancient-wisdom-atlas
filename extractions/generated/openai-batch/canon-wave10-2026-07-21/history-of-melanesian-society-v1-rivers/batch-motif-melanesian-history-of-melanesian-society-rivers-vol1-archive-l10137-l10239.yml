canonical_text:
  quote: ''
  summary: Ethnographic description of Pentecost kinship functions, including death-related
    food prohibitions, paternal aunt authority, grave digging by cross-moiety relatives,
    avoidance rules among affines, and marriage regulations involving widows, wives'
    sisters, and other relatives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a dying man gives food to his sister's son, that kind of food is temporarily
    prohibited to the sister's son, to the dead man's brother, and optionally to others
    of the moiety.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The duration of the food prohibition is connected with an observance of Loli,
    corresponding to Banks Sukive, and probably ends when the sister's son takes his
    next step in that body.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A father's sister chooses a wife for her nephew, and her requests or orders
    to her brother's child must be obeyed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man may eat with his father's sister but normally may not address her by
    her personal name; a limited exception is described when they are alone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A father's sister's husband is obeyed by his wife's nephew, but the two may
    eat together and talk familiarly.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The father's sister's son, or sometimes the father's brother, may dig the
    grave for the son of his mother's brother; the grave digger and deceased belong
    to opposite moieties.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A man may not touch the head of his sister's husband or go behind his back,
    while the reverse restrictions are not reciprocal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The terms bulena and sibi are used non-reciprocally for wife’s brother and
    sister’s husband, and the passage connects the distinct terms with different duties
    and restrictions.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A man may not speak to his wife's sister or use her personal name.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: If a woman is in a breadfruit or coconut tree and sees her sister's husband
    coming, she must descend at once.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A wife's sister and her sister's husband must not touch each other's heads.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A woman may speak to her husband's brother except when her husband is dead;
    then the brother must not speak to the widow unless he is going to take her as
    his wife.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Marriage restrictions in Pentecost include ordinary restrictions from the
    dual division and an additional mechanism prohibiting marriage with some women
    of the opposite moiety.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage reports positive regulations enjoining marriage with certain relatives,
    including the wife or widow of the mother's brother.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage reports probable or usual marriage with the classificatory daughter's
    daughter, the wife's sister, and the brother's widow; the brother has first claim
    on the widow, though the practice is not obligatory.
  category: relationship
  evidence_refs:
  - ev:9
