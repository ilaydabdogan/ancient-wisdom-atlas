  quote: ''
  summary: The passage describes the Banks Islands Sukwe and Tamate societies as organizations
    closely tied to rank, chiefly authority, initiation payments, wealth circulation,
    obligations of redistribution, shell-money transactions, and property protection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Social rank and importance are described as closely connected with rank in
    the Sukwe and Tamate societies; a chief without membership or with low rank would
    have relatively little authority.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Initiation into a Sukwe rank or a Tamate society is described as involving
    money passing from the new member to already initiated persons and from relatives
    or certain initiated members to others.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Contributions toward the price of initiation are described as largely, or
    perhaps altogether, returns for previous gifts or payments.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man who has spent large sums to rise high in the Sukwe may later receive
    money from subsequent initiates and use acquired wealth to help children and relatives
    follow the same path.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that only the rich, or those with rich friends, can advance
    far in these bodies, thereby perpetuating or accentuating rank differences dependent
    on wealth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wealth derived from high Sukwe position is described as a means for further
    advance, with highest ranks often empty and further advance involving great expense.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A high-ranking man who hoards his gains is described as losing respect, while
    retaining influence requires distributing money through garden work payments and
    kolekole performances.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The monetary transactions of the Sukwe are said to take place in native shell-money,
    and increased use of European money is suggested as a possible cause of organizational
    decay.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Tamate societies are stated to have a role in the protection of property,
    with two opposed kinds of influence, though the passage ends before detailing
    them.
  category: relationship
  evidence_refs:
  - ev:6
