  quote: ''
  summary: Ethnographic discussion of Tikopia adoption, marriage patterns, prohibitions,
    divorce, funeral preparation and mourning, suicide cases in pedigrees, and name
    changes at marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Children are said to be adopted, but probably not often; Tarangarua was adopted
    by Paemarinua for a stated household reason, and John Maresere and Patita are
    noted as exceptional stranger cases.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pedigree analysis reports marriages within and between Kafika, Tafua, and
    Taumako, but no recorded marriages between Fangarere and the other three divisions
    in nine pedigrees.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fangarere are not given as inhabitants of any village on Durrad's map, and
    the passage suggests the division may be nearly extinct.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Children have terms for the unmarried sister of their mother, and such a woman
    helps her married sister care for children.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Marriage with the brother of a deceased husband is described as forbidden,
    with a belief that the dead husband's ghost would injure the brother who took
    his place.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Divorce is sometimes practiced in cases of sterility.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The pedigrees include a case in which a brother and sister married a sister
    and brother, and another case involving marriage to a woman classified as mesakztanga.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A dead man’s body is dressed and decorated with bark-cloth, leaves, a mat,
    scented leaves, turmeric, and a bent-knee posture for interment.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: During wailing, relatives kneel one by one, place their cheeks beside the
    corpse’s cheek or forehead, and tear their own cheeks so blood drips onto the
    dead face.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Funeral songs called fuatanga are sung in a deep tone, rising at times to
    a high note and ending in a wail using the word seauwe.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Four persons in the pedigrees are reported to have committed suicide; two
    women’s motives are stated, and two victims are said to have hanged themselves.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: On marriage, both man and woman change names and assume a common house-based
    name element, distinguished by father and mother prefixes.
  category: attribute
  evidence_refs:
  - ev:11
