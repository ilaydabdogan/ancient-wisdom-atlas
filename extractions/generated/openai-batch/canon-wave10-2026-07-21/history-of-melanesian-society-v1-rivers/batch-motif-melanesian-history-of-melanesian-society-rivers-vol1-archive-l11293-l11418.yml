canonical_text:
  quote: ''
  summary: The passage records Pileni and Reef Islands kinship terms and relationship
    rules, including special roles for the mother's brother, father's sister, ngane
    affines, joking partners, and marriage prohibitions. It then describes Reef Islands
    fale atua houses containing named wooden stocks called atua, rituals of installing
    and feeding these stocks, supplication to atua during canoe storms, and other
    beings or objects called atua, including animals, ghosts, and stones used in a
    former rite against an enemy. It ends by noting that kava was not found to be
    drunk in the Reef Islands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several sibling terms are also used for cousins of all kinds, including children
    of the mother's brother and father's sister.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Pileni, terms for grandparent are also used for the father's sister, and
    the father's sister addresses her brother's child as a grandchild.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: People may be referred to as the parents of their children, such as a father
    and mother being called by reference to the child Leposia.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The mother's brother is compared by an informant to a schoolmaster; he scolds
    his sister's son for wrongdoing, and uncle and nephew share possessions.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The father's sister is highly respected and can forbid or help arrange a marriage,
    though the passage questions whether her power exceeds that of other respected
    relatives.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ngane includes wife's brother and sister's husband; people in this relation
    honor and avoid each other, avoid speaking each other's names, pass aside, speak
    from a distance, obey each other's bidding, and share possessions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Vakada joking or chaffing is practiced with certain male kin called toga and
    is said to correspond to Banks Islands poroporo; women are not chaffed, and joking
    between a man and woman would imply suspected sexual relations.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A man may not marry the daughter of his mother's brother because she is called
    tukutuahine and regarded as a sister.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Reef Islands village has a house called fale atua containing wooden stocks
    called atua; each stock has a special name, and one large Pileni stock is called
    Tangteala, glossed as crying in the pathway.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: A stock is made, painted, carried on a man's shoulders along the beach, run
    into the fale atua, set in place, and followed by drumming, feasting, dancing,
    and food laid before the stock with an address asking for affection and protection
    from sickness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A canoe traveler who meets a storm calls on an atua by name, asks for pity
    and a good wind, and throws food onto the top of the canoe house; if the wind
    changes, thanks and a feast follow on return home.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The term atua is also applied to the flying fox, the nakatc described as probably
    a large sting-ray, ghosts of the dead, and certain stones in unvisited places.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: A particular stone called atua was about two feet high and surrounded by a
    low stone fence.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: Formerly, a chief performed a ceremony at such a stone by burying food left
    by an enemy and asking the stone to make the enemy die.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: The author reports that, so far as he could discover, kava is not drunk in
    the Reef Islands.
  category: other
  evidence_refs:
  - ev:12
