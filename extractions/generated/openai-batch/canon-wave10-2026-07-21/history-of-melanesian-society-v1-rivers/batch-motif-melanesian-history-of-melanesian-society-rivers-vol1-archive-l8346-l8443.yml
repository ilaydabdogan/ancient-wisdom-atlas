canonical_text:
  quote: ''
  summary: The passage first completes an account of a gismana whose soul retrieves
    a sick person's soul from a hostile vui while the gismana sleeps, with a warning
    not to wake him. It then describes Banks Islands shell-money, its materials, gendered
    stages of manufacture, tools, drying, grinding, stringing on hibiscus fibre, an
    alternate method reported by Codrington, and exchange of Rowa-made money for vegetable
    foods from other islands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If the gismana succeeds, the sick person's soul is brought back to the village
    and returned to the sick person.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: No one must disturb the sleeping gismana because waking him would cause his
    atai to release its hold, letting the sick person's soul return to the hostile
    vui.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the sick person's soul slips away, the gismana drinks the potion again
    on the following night and his soul goes directly to the known hiding-place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Banks Islands money consists of shell-discs strung on hibiscus fibre, with
    a finer rare kind and a coarser kind in general use.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The discs are made from a small shell called som, and the money itself is
    also called som.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Shell-money is manufactured chiefly on Rowa, with some also made on Saddle
    Island or Motlav.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Men gather the shells, basket them, take them to the village, and dry them
    in the sun until the molluscs are dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Women carry out the actual manufacture after the men's part of the work is
    finished.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Women break the shells with a piece of giant clam-shell, dry selected fragments,
    wash them in fresh water, and chip them into small pointed and hollow pieces.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The pointed shell surface is rubbed down on a polished ribbed stone sprinkled
    with water and black volcanic sand from Vanua Lava.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A hibiscus stem is used to hold and rub a shell fragment until it becomes
    a disc with a central hole.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Finished discs are dipped in water and placed in a coconut cup until dry enough
    to string together.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The string for the discs is called gavw and is made from the fibre of a hibiscus
    variety called vir.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: The narrator saw the later part of the manufacturing process at Rowa and contrasts
    it with a more elaborate method described by Dr Codrington.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Rowa-made money is exchanged for yams and taro from Vanua Lava and other islands,
    except Merlav, Merig, and Santa Maria.
  category: action
  evidence_refs:
  - ev:8
