canonical_text:
  quote: ''
  summary: 'Ethnographic description of Banks Islands Tamate societies: their name
    from the word for ghost or dead man, categories of membership, connections with
    Sukwe and salagoro, gendered hats or societies, violent Tamate kiskislag behavior,
    initiation procedures involving payment, pig or pigeon killing and eating, seclusion
    after mask-making, door drawings, and the multiple meanings of the term tamate.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tamate societies take their collective name from the word for ghost or
    dead man and are described as numerous, with 77 societies recorded from Mota alone.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Tamate societies may be entered by boys not yet initiated into the Sukwe;
    at least one girl became a member, and these societies are called Tamate matawonowono,
    glossed as having their eyes closed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A second group is described as open only to Sukwe members, not specially connected
    with a salagoro, and of uncertain nature; the Kwat is noted as resembling Tamate
    societies while its classification is disputed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A third group is marked by definite connection with a salagoro, and membership
    in Tamate liwoa is required before initiation into the wangarai Tamate.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some societies, or possibly their hats or masks, are regarded as male and
    others as female; associated societies may share privileges.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Members of Tamate kiskislag chase, injure, and terrify people; they pelt uninitiated
    persons with stones, may shoot at them, and formerly killed people until this
    was stopped.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Initiation is called tiro; a candidate pays an introducer, the introducer
    provides a pig, candidates stamp once on the pig's breast before it is killed
    and eaten, pigeons may substitute in less important societies, and seclusion follows
    if a hat or mask is made.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Some societies allow multiple men to be initiated at once by shared contributions,
    while more important societies require one man at a time to pay the whole amount.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: A plate caption describes drawings of Tamate liwoa and viov on a building
    door, distinguishing simpler lozenge-shaped figures from larger, more elaborate
    figures.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The word tamate denotes societies, individual members, hats or masks, beings
    probably understood as ghosts, Sukwe hats, and ordinary hats under later usage;
    it is also the usual term for a dead man or ghost.
  category: attribute
  evidence_refs:
  - ev:10
