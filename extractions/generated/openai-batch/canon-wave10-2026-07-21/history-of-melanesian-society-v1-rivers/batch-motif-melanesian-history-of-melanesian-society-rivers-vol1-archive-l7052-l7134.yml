canonical_text:
  quote: ''
  summary: The passage describes Banks Islands ritual procedures around pigments,
    cycas fruit, patterns, hair treatment, kolekole performances, women's limited
    ritual participation, and the social importance of the Sukwe and Tamate societies
    in rank and chiefly status.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A white pigment called urai gara is made on the seashore, while other pigments
    are prepared in the salagoro; pigments made outside the salagoro may only be taken
    into it by a man who can werewere.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cycas fruit for urai salagoro is kept ready; if the tree belongs to a man
    who can werewere, he is asked for it, but otherwise the fruit is stolen and the
    taker's identity is not disclosed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The gapagapa pattern is used only with red and yellow pigments, and yellow
    use is restricted to one initiated into tirai kwat after prior privilege with
    red pigment.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Before the dance, people using different pigments sit in prescribed separations;
    after the dance they wash pigments off in different places depending on the pigment.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Hair is coloured and shaped by cutting and pressing by skilled persons, but
    no special initiation is required for this work.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The author states uncertainty about whether kolekole performances are integral
    to Sukwe and Tamate societies, but says their association is probably close and
    allows the general population some participation in ceremonial.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Some ritual features especially concern women; objects central to some ceremonies
    are called tamate, and the author raises the possibility of a women's organization
    analogous to the men's Sukwe.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Women have no place in the Sukwe and Tamate societies and are excluded from
    parts of kolekole involving men's ritual, but women and other uninitiated persons
    participate freely in other parts and may see the hats of the Sukwe.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Social rank and importance depend largely on the Sukwe and Tamate societies,
    on rising in the Sukwe, on accomplishments such as complete werewere sounds, and
    on lavish kolekole performances.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The role of Sukwe and Tamate societies in social importance makes it difficult
    to distinguish hereditary chiefs from men called great because of high Sukwe rank.
  category: relationship
  evidence_refs:
  - ev:10
