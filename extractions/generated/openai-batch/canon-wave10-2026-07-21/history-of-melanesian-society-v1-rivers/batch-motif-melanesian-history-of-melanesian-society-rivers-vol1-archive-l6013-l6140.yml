- id: motif:2
  label: Origin of a ritual badge from leftover adornments
  taxonomy_refs: []
  basis: The origin story explains Menmenule’s unripe fruit and black body-painting
    as resulting from arriving after women had used the bright fruit and other pigments.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: Only a fragment of a longer tale is reported in the passage.
- id: motif:3
  label: Esoteric ritual object manufacture
  taxonomy_refs:
