canonical_text:
  quote: ''
  summary: The passage records Banks Islands Tamate society rules, badges, hats, and
    remembered origin explanations. It includes a fish-eating rule connected with
    Tamate pepe; an origin story explaining Menmenule/Menmetiule use of unripe marakwarakwa
    fruit and black pigment; and a list of societies whose badges include crotons,
    leaves, fruits, reeds, fish, birds, a rat, and distinctive hats. Several entries
    emphasize initiation limits, companion societies that eat together, concealed
    or locally restricted hat manufacture, and cases where recent initiates did not
    wear hats.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If the fish associated with Tamate pepe is caught by others while members
    of that society are present, it is given to those members to eat; if no members
    are present, the catchers eat it without embarrassment.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four societies use marakwarakwa fruit as a badge in different ways, and Menmenule/Menmetiule
    people use it unripe.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the remembered origin story, three women had used the bright marakwarakwa
    fruits and most pigments before Menmenule arrived, so he used green unripe fruits
    and painted his whole body black with the remaining black pigment.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gasoso can only be entered by one man at a time and has crotons and another
    leaf as badges.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tamatpilagi is companion to Gasoso; members of both eat together, and the
    Tamatpilagi hat is speckled in imitation of the pilagi bird.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Lakto hat is made from split reed pith bound together, and the passage
    says the word conceals the nature and construction of the hat from the uninitiated.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mesigolo has white and red crotons, pawiira and tawora leaves, and a shortened
    thick hibiscus stem as badges; Igtawosor is described as a fish of a place on
    Vanua Lava or perhaps Ureparapara and has a red croton badge.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Igtavalpei is interpreted as the fish of the other side of the water; its
    female hat is decorated with a fish and its badge consists of several kinds of
    croton.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Seglama is associated with a long-snouted fish and perhaps a seabird, but
    its hat follows the bird in shape; it can be entered by only one man at a time,
    and only two named living men are said to belong to it.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Igagangan is a fish-named society whose hat follows the fish in pattern; Matthias
    is said to be its only living member, and it cannot be entered by more than one
    man at a time.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Wiriu is described as a mischievous Tamate whose members shoot people; John’s
    father and Carpenter are said to be the only ones left, and John wishes to be
    initiated.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Gasuwe has an imitation rat on top of the hat, but the rat is described as
    common and not sacred; anyone, male or female, may speak the word or kill the
    rat.
  category: attribute
  evidence_refs:
  - ev:10
