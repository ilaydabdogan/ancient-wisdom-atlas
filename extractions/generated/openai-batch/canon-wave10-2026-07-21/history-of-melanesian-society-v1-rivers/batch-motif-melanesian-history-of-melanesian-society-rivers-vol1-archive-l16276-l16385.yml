canonical_text:
  quote: ''
  summary: The passage gives an ethnographic description of Tikopian bark-cloth and
    string-making, limited ceremonial fighting and weapons, exchange without money,
    and several fishing methods, including coordinated moonless-night canoe fishing
    for flying fish, netting of aku, hook-fishing of ika tapu, and shark capture by
    hook, rope loop, outrigger, and clubbing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tikopian bark-cloth is made from the bark of a tree called mdmi, and the same
    name is used for the tree and the cloth.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bark-cloth is usually made by women through drying bark in the sun, beating
    it with a hammer on a log, drying it again, and optionally staining it with turmeric.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: String is made by both men and women from coconut husk fibres that have been
    soaked in salt water, stripped, beaten, rolled, and plaited.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Three-strand kafa string is used in house-building, canoe lashings, and shark-catching
    rope; two-strand uka is used for fishing lines.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women make a very fine coconut-fibre cord for girdles.
  category: action
  evidence_refs:
  - ev:3
