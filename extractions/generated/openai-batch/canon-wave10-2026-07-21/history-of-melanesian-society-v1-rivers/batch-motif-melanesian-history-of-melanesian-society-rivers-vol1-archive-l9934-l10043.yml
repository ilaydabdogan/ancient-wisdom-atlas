  summary: The passage analyzes New Hebrides kinship nomenclature by considering the
    theoretical effects of a man marrying his own granddaughter or his brother's granddaughter.
    It compares expected relationship terms with terms reported for the wife, her
    siblings, the husband's relatives, and paternal grandparents, and notes that some
    terms are better explained by another local marriage form, marriage with the wife
    of the mother's brother.
