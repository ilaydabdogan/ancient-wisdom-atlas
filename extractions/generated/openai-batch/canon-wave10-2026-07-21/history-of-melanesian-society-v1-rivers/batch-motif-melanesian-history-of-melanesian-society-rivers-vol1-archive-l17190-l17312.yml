  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A man's loin-cloth fold may be long enough to pass between the legs and rest
    on the ground so that the wearer can sit on it.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: A woman's cloth girdle can help carry an infant, who stands on the girdle
    while clinging to the mother's shoulders.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When a man dies, his loin-cloth and hair are worn by his wife or sisters;
    the loin-cloth is twisted around the neck and can serve as a secret pocket.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Men's hair is described as sacred and is cut only at mourning; cut or shaved
    hair from mourning may also be worn.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Some fishing lines of a dead man are cut up and worn by his relatives.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: People wear dropped or decayed teeth of elderly relatives, with stated reasons
    connected to the relatives' feeding or nurturing roles.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Boys wear hair in tufts, often reddened with lime; in mourning these tufts
