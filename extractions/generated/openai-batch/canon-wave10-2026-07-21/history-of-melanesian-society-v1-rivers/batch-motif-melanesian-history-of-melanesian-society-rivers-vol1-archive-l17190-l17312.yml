canonical_text:
  quote: ''
  summary: The passage describes Tikopia practices of chiefly and family name transfer,
    widow name change after a husband's death, bark-cloth dress and its uses, mourning
    practices involving the wearing of a dead man's cloth, hair, fishing lines, and
    relatives' teeth, boys' hair customs, and a popular mock stick-fight game.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a chief succeeds, he takes the name of his division; a son may also take
    his father's former name.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A chief or father can assign a name that differs from the ordinary expected
    name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A widow is no longer denoted by the name she assumed on marriage after her
    husband has died.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a deceased office-holder's son is too young to succeed, the deceased man's
    brother may succeed and take the brother's name.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Names previously borne by dead family members may be reused for children,
