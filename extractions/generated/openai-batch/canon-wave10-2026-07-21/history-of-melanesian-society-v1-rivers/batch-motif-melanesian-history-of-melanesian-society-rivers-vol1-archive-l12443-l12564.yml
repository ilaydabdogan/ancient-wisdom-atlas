  summary: The passage describes kinship terminology from Eddystone Island/Mandegusu
    and Vella Lavella, listing terms for parents, children, siblings, cousins, in-laws,
    spouses, and reciprocal collective relationship forms. It notes that the Eddystone
    system is unusually simple and that Vella Lavella differs from other Solomon Islands
    systems in language form and possessive prefixes.
  language: English
  quote_policy: summarized
