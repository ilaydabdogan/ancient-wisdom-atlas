  text: The passage states that Vella Lavella differs greatly from other island systems
    in both kin terms and possessive prefixes, and that its language departs from
    the usual Melanesian type.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Eddystone Island/Mandegusu system uses tammiggu for father and several
