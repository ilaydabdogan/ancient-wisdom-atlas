canonical_text:
  quote: ''
  summary: 'The passage describes Mota adoption customs: the adoptive father’s strong
    claim over the child, concealment of biological parentage, payments connected
    with adoption and silence, two adoption forms involving moiety or veve status,
    suckling and weaning arrangements, and a case in which grieving parents took back
    a child at night but were compelled by custom to return it.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The adopting father is described as rarely relaxing his hold on the adopted
    child, and attempts by the real father to regain the child may lead to anger,
    quarrels, or bloodshed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An adoptive father may feign consent to return the child, especially if he
    fears the real father’s magical power, while secretly initiating a process to
    kill the adopted son rather than allow the return.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The child’s real parentage is carefully kept from the adopted child, and approaches
    by the real father are resented because they may reveal the truth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The payment called vat ngorag sasai may be made earlier than usual to prevent
    revelation of parentage, and after it is made the true father regards himself
    as unable to speak about the parentage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A third person may reveal a child’s real parentage, often during a quarrel,
    and the passage reports that Mota men may have uncertainty about their real parentage.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Two forms of Mota adoption are described: one in which a child of a different
    moiety is adopted without changing division, and another in which a child of the
    adopter’s own division must change veve.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The second form of adoption may create danger of consanguineous marriage;
    relatives of a girl may intervene, forbid the match, and thereby arouse the adopted
    child’s suspicions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The man who makes the necessary payment to the midwife is regarded as the
    child’s father, but the true mother suckles the child until weaning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: During suckling, the adopting father supplies food for the child and mother,
    repayment is required if the real parents resume the child, and the adopting father
    supplies the customary weaning feast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The adopting father decides the time of weaning and usually tries to hasten
    it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In one reported case, grieving parents rose at night, the father went to the
    house where the child had been taken, found the new mother asleep, and carried
    off the child.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The adoptive father discovered the loss, recovered the child from the parents,
    and the parents were said to have been in great trouble with the community for
    breaching Mota custom.
  category: sequence
  evidence_refs:
  - ev:6
