canonical_text:
  quote: ''
  summary: The passage describes Banks Islands society badges made from plants, especially
    croton and coconut leaves. Unauthorized cutting or use of another society's badge
    brings a pig fine, though initiation into the society may substitute for payment.
    It gives cases of mistaken badge use, deliberate unauthorized use to seek entry,
    rules against women or non-members destroying badge plants, an exception for the
    Malop coconut-leaf badge, garden disputes mediated by badge signs, and a Tamate
    liwoa yam-harvest feast involving selected yams, coconuts, a decorated enclosure,
    and a red taboo-marking stake near a coconut tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man may not cut or use a plant badge of a society to which he does not belong;
    the stated penalty is a pig fine to that society's members.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man of the Viov society mistakenly used the croton of the Tamatpilagi society
    as a soloi and was told he would have to pay the usual fine because he was not
    initiated into Tamatpilagi.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the fine can be avoided by initiation into the society whose
    badge was wrongly used, and that some men deliberately use unauthorized croton
    to gain admission, although members may refuse entry.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Society subdivisions may have their own badges; a man from one branch of Tamate
    nivat had to pay a pig fine for using another branch's leaf by mistake.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A person may not destroy a badge plant of a society to which he does not belong,
    and because no woman is initiated into any society, women may not destroy such
    plants at all.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: John Pantutun refused to cut a croton badge plant for a society to which he
    did not belong, and an initiated little boy present was called to cut it instead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'The Malop society is described as an exception: its green coconut leaf badge,
    stuck upright as a soloi, may be used and carried by uninitiated men and women.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Society badges are used as protective signs in garden disputes; disputants
    may put up badges belonging to societies from which the opponent is excluded,
    and a friend from the relevant society may remove the sign temporarily.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: When the yam crop in Mota is ready for digging, the Tamate liwoa holds a feast,
    collects food including large yams and many coconuts, and eats and drinks in the
    salagoro.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Coconut shells and husks from the feast are placed in a decorated enclosure
    near a good coconut tree; a red-painted palako stake with coconuts marks the tree's
    fruit as taboo for a time.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The stated explanation for the ceremony is that the Tamate should always have
    the best of everything.
  category: speech
  evidence_refs:
  - ev:11
