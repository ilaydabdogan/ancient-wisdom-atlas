canonical_text:
  quote: ''
  summary: The passage lists Mbau and nearby village kinship terms, including terms
    for mother's brother, father's sister, grandparents, cross-cousins, spouses, affines,
    and descendants. It notes direct-address versus reference usage, reciprocal kin
    terms, a custom of identifying parents through a child, and lexical variants in
    Tokatoka, Nausori, and Nokanoka.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The terms ngandinanggu, ngandi, momo, and vungonggu are given for the mother's
    brother and related persons; momo is restricted to direct address, while vungonggu
    is used when speaking of these relatives.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ngandinanggu and ngandi are also used for the father of husband or wife, and
    vungonggu is used reciprocally between a man and the consort of his daughter or
    son.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nganeitamanggu or nganei denotes the father's sister, the wife of the mother's
    brother, and the mother of husband or wife; vungonggu may also be used for these
    relatives in reciprocal relations.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sister's son is called koya na ngoma in address and is also called vasu
    or nonggu vasu in conversation.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Distinct terms are listed for grandparents, grandchildren, great-grandfather,
    husband or wife, and several cross-cousin and spouse-sibling relationships, with
    some terms dependent on the sex of the speaker.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man may be spoken of as the father of his son; the passage says this was
    not habitual but could be used as a compliment. A similar parent-through-child
    usage is noted again at Nausori.
  category: speech
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:7
  text: Groups of people in reciprocal relationships are denoted by prefixing a reciprocal
    particle to the relationship term, as in veinganeni, veindavolani, and veivungoni.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage identifies variants of the Mbau system in Mata Levu, Tokatoka,
    and Nausori, including different terms for grandparents, parents, mother's brother,
    sister's son, cross-cousins, and affinal relatives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Although ngane is the proper term for the brother-sister relationship, a woman
    is often called by a man tuaka or tadhi according to her age.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A Nokanoka variant is described as characterized by elision of the letter
    l in some, but not all, cases, with examples such as tama becoming ama and tina
    becoming ina.
  category: attribute
  evidence_refs:
  - ev:8
