canonical_text:
  quote: ''
  summary: 'The passage describes the Fijian vasu relationship between a man and his
    mother''s brother or sister''s son: the mother''s brother directs ceremonies and
    moral instruction, the sister''s son formerly had strong privileges over the uncle''s
    property, and these rights extend through classificatory kinship. It also describes
    incision ceremonial, use of an uncle''s pig in a feast, post-incision ordeal and
    secrecy, vasu itaukei, tambu animal and plant restrictions, Rewa speech etiquette,
    and limited or absent duties for some other affinal relatives.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mother's brother is said to take the chief part in directing his nephew's
    life, arranging ceremonies connected with him, and formerly teaching warfare.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a man dies, the mother's brother does not act as guardian; guardianship
    falls to the father's brothers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the old days, a sister's son could take his uncle's possessions and kill
    his pigs; the passage says this custom is no longer followed and could now be
    treated as larceny.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the coast, the vasu of a chief was said to be able to go to that chief's
    town and take any woman desired; the author says this seemed once also true inland.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author did not find a special power of the uncle to stop a nephew in fighting,
    but records that a man would kill anyone who was fighting with his sister's son.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The same rights were said to apply to an actual sister's son and to persons
    classed as such through classificatory kinship; the rights also extended to a
    matanggah member and to the husband of the father's sister as a classed mother's-brother
    equivalent.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In incision ceremonial, the mother's brother takes a leading part; the boy's
    father gives the feast, while the boy takes one of his uncle's pigs and gives
    it to his father.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Among inland tribes, after incision the boy runs a gauntlet, may be beaten
    on the way home, keeps the dressing on until the wound heals, and then buries
    it in an absolutely secret place.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Because marriage now takes place within the matanggali, a man may be vasu
    to his own matanggali; this was regarded as the highest kind of vasu and called
    vasu itaukei, though related terms were not fully understood by the author.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A man will not eat the tambu animal of the tribe to which he is vasu, and
    the same restriction applies to tambu plants.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the Rewa district, a man and his mother's brother are said always to speak
    to one another slowly and gently, and the uncle instructs the nephew in the code
    of morality.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The author made no special inquiries into the father's sister and could not
    learn that the wife's brother or sister's husband had special duties or privileges.
  category: other
  evidence_refs:
  - ev:10
  - ev:11
