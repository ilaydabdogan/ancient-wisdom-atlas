canonical_text:
  quote: ''
  summary: A Banks Islands ceremonial sequence is described in which Charles, Abraham,
    Alfred, dancers, women, conch-shell blowers, and village participants handle pigs,
    money, a tree-fern leaf, bow and arrow, kava roots, measuring rods, food, water,
    and fire. The passage includes dancing, distribution and placement of goods, a
    peace symbol, a deferred pig killing for a feast, conch-blowing for pigs and money,
    the first fire in the Wometeloa division, and communal eating.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Three additional pigs are brought out; two are tied to stakes set up by Abraham
    and the third is tied to a cycas tree near the gamal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Abraham places a tree-fern leaf in the thatch above the doorway, receives
    a bow and arrow from a dancer, and carries them into the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Charles dances holding four fathoms of money and a pig's jawbone, then lays
    the money over the head of a boy whom he calls mak; the boy is said to receive
    part of the money as interest on his outlay for hiring dancers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dancers call for water, two women bring a large pudding on a dish, and dancers
    take, cut, and eat slices while continuing to dance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Abraham, with legs smeared in red pigment, joins Charles in dancing while
    holding a tree-fern leaf, bow, and arrow; men outside the gamal blow three blasts
    on conch-shells.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Abraham, referred to in the sequence as the old man, addresses Charles and
    throws the fern leaf at his feet; the passage states that the leaf signifies peace
    and no destruction of Charles's property.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Abraham and Charles stand by pigs numbered 7 and 8, and Abraham slaps the
    pigs on the back in succession while speaking to Charles.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Abraham fits an arrow to his bow and draws it to shoot pig number 9, but Charles
    stops him; the pig is to be killed later for a feast because the next day is Sunday.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Charles dances with the jawbone and measuring rods, brings out kava roots,
    places them beside pig number 2, then brings two baskets of measured money and
    lays them by the kava roots.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Firewood gathered by the community is used as two men prepare a fire in the
    Wometeloa division of the gamal; conch-shells are blown for the pigs and money.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Charles and his father Alfred stand by a numbered sequence of pigs and both
    smack their backs; later they touch the baskets of money and Charles lays the
    measuring rods on the baskets.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Charles hands another pig to Abraham, Abraham carries money and measuring
    rods into the house, several pigs are taken away, and dancers exit behind the
    pig kept for the feast.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A fire is lit for the first time in the Wometeloa division; Charles eats food
    cooked on it, Abraham takes remaining pigs as his property, and village men and
    dancers eat food cooked in the Tavatsukwe division.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: A footnote points to Codrington for a speech on a similar occasion, and another
    footnote says the Sunday deferral is a modification of ancient ritual due to Christian
    influence.
  category: other
  evidence_refs:
  - ev:12
  - ev:13
