canonical_text:
  quote: ''
  summary: The passage first summarizes classificatory marriage restrictions involving
    generation, moiety, and kin-status categories. It then explains the author's phonetic
    notation for Melanesian languages, contrasting missionary spelling conventions
    with his attempt to record actual heard sounds and noting possible ethnological
    significance of phonetic distinctions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Marriage is described as confined to members of the same community and, normally,
    to persons of the same generation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man marrying within his own generation is said to marry a woman classed
    both as his mother's brother's daughter and his father's sister's daughter.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a man marries into lower generations, the passage says the permissible
    woman is defined by classificatory daughter or daughter's daughter status, with
    moiety membership limiting alternatives.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that missionaries used simplified signs for Melanesian sounds,
    but these signs were not used uniformly across Melanesia or even within one mission
    area.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The letter q is described as used in Fiji for the ng sound of English "finger"
    and by the Melanesian Mission for several different consonant clusters.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author rejects the use of q and says he tries to write sounds as nearly
    as possible as he heard them, while acknowledging uncertainty in correctness and
    local universality.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The author notes that existing spelling systems often do not distinguish b
    from mb or d from nd, though he considers such differences potentially ethnologically
    significant.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage lists several phonetic conventions used by the author, including
    m or Mw, ng, ngg, dh, zh, ch, f, and a special Melanesian g.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: For vowels, the author follows Codrington and other missionaries as far as
    practicable, while noting local variation and limited time for close study.
  category: action
  evidence_refs:
  - ev:9
