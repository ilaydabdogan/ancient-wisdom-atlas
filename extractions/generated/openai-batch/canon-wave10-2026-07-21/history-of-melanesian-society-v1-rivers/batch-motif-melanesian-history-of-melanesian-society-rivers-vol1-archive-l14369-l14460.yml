canonical_text:
  quote: ''
  summary: The passage compares coastal and inland or mountain Fijian kinship terminologies,
    noting differences in relationship terms, possessive forms, alternate-generation
    naming, and certain special functions of relatives. It then describes the vasu
    relation of a sister's son to his uncle and former brother-sister avoidance rules,
    including name avoidance, indirect communication, shared-activity prohibitions,
    and severe sanctions for non-observance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mountain systems are described as generally richer in relationship terms,
    especially for grandparents and grandchildren, while the coastal Mbau system is
    described as richer in terms for cousins who may be potential spouses in connection
    with cross-cousin marriage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The inland systems distinguish parents-in-law from the mother's brother and
    father's sister, and include special terms for spouses of those relatives; the
    Mbau system usually gives these relatives the same names as the father's sister
    and mother's brother respectively.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that mountain systems apply the same term to members of
    alternate generations, while coastal systems show no clear evidence of this apart
    from a possible survival in similar grandfather and elder-brother terms.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Coastal terms generally use suffixed pronouns, while interior systems frequently
    use possessive nouns; some inland terms have alternatives, and terms with possessive
    nouns are said to be peculiar to the interior apart from named exceptions.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage reports that no alternative was used for a term that included
    both the son's son and the younger brother, a sense said to be limited to the
    mountains.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Fiji is said to have two striking special functions of relatives: the relation
    of a sister''s son to his uncle in the vasu institution, and avoidance between
    brother and sister.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The author states that he lacked enough concrete examples for firm conclusions,
    but had the impression that the vasu relation and brother-sister avoidance were
    less developed among inland tribes.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says that brother-sister avoidance had largely or entirely disappeared
    at the time of writing, but formerly a man could not utter his sister's name.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Former restrictions included that brother and sister might not speak to one
    another, play together, eat together, or wear the same loin-cloth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A man wishing to communicate with his sister used an intermediary; in Tavua
    this communication was said to pass through his mother.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The man did not utter his sister's personal name but addressed or referred
    to her with a plural expression translated as "those women."
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: If the restrictions were not observed, a man would be regarded as mad and
    killed either with a club or by strangling.
  category: action
  evidence_refs:
  - ev:7
