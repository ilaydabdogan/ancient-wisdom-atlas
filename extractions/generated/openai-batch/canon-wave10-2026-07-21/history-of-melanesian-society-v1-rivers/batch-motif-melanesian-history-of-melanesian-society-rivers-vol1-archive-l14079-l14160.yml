  summary: The passage reports Dhawanisa ancestry terms, compares the Nandrau, Navatusila,
    and Dhawanisa kinship systems, emphasizes their use of the same terms for alternate
    generations, notes the Nandrau system’s unusually differentiated grandparent and
    grandchild terminology, and introduces Nambombudho kinship data from Malakanauatu
    of Nasonggo with comparisons to Mbau and mountain systems.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Dhawanisa informant, described parenthetically as a chief, could trace his
    direct-line pedigree for five generations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the reported Dhawanisa terminology, the great-grandfather was called momo
    vakarua, while more remote ancestors were called tumbunggu with ordinal modifiers
    such as vakarua and vakatolu.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Nandrau, Navatusila, and Dhawanisa systems are described as essentially
    on the same plan, though the Navatusila and Dhawanisa data are said to be scantier
    than the Nandrau data.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage identifies the use of the same terms for members of alternate
    generations as the most novel and important feature of the three systems.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man gives the same term to his son's son as to his younger brother, and
    the grandson gives the same term to his grandfather as to his elder brother.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the Nandrau, a son's wife is called nau, the same term applied to the
    mother; the author adds that this classification probably also occurs in the other
    two systems.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Among the Nandrau, the son of a vasu, glossed as a sister's son's son, is
    classed in nomenclature with a brother.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Among the Nandrau and Dhawanisa, and probably the Navatusila, the father's
    grandfather receives the same name as the father, and the grandfather's grandfather
    and the grandfather are similarly designated.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Among the Dhawanisa, the husband of the father's sister and the husband of
    the sister's daughter receive the same name; a footnote says the term is also
    applied to the wife of a sister's son.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The author states that the four alternate-generation features point to a former
    social regulation grouping alternate generations in the same category, but says
    the purpose remains for later consideration.
  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Nandrau system is described as having four distinct terms for the four
    grandparents and four reciprocal terms for grandchildren, distinguishing the child
    of a son from the child of a daughter irrespective of sex.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Nambombudho system was obtained from one informant, Malakanauatu, identified
    as the mbuli of Nasonggo.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Nasonggo is described as a village on the chief road to Suva; the Nambombudho
    system is said to fall into line in its chief features with the Mbau system while
    also showing evidence of community with mountain systems.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the reported Nambombudho terminology, the father is tamanggu, the husband
    of the mother's sister is nonggu ikau, mother and child are iinanggu and luvenggu,
    the mother's brother has several reported terms, the father's sister is nganeitamanggu,
    and the sister's son is nonggu vatuvu.
  category: attribute
  evidence_refs:
  - ev:7
