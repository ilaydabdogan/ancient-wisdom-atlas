canonical_text:
  quote: ''
  summary: The passage describes Banks Islands moieties, named subdivisions, sacred
    rocks and other subdivision emblems, attributed traits of certain divisions, exogamous
    marriage rules across islands, local district groupings, and a contrasting Merlav
    tagataga organization said not to be linked with sacred objects or restrictions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each of the two moieties has multiple named subdivisions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The subdivisions are often called veve, the same term used for the moieties.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Many subdivision names are said to come from rocks, and at least some of these
    rocks are regarded as sacred and inhabited by spirits called vui.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Tasalaima and Maligo divisions possess rocks called O pagoa, translated
    as “the shark”; at the Maligo rock a sacred owl inhabits a banyan tree.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Talogapmarus have the giant clam-shell as a sign or mark, and the Lisaveve
    have a sacred creeper which they must not cut or break.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some lesser divisions are described as having special characters; Talvatvat
    and Gatava are called veve kwakwae, or eccentric divisions.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The eccentric divisions are described as eating a meal in reverse order and
    as hacking off a canoe outrigger when drawing up a canoe is difficult; Tasalaima
    members are said to be unable to sing songs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Talosara division performs definite rites at its sacred rock or rocks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In islands with dual organization, the two moieties are exogamous, and equivalent
    moiety relations are recognized across islands and in dealings with some New Hebrides
    natives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Mota, moiety subdivisions do not regulate marriage; men of any subdivision
    of one moiety may marry women of any subdivision of the other moiety.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The islands also have local districts, often with different dialects; some
    Mota district names match names of moiety subdivisions, but the relation is left
    undetermined.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: In Merlav, ten named groups called tagataga are listed, and these groups are
    said not to be connected with sacred objects such as animals or plants and to
    have no restrictions.
  category: relationship
  evidence_refs:
  - ev:9
