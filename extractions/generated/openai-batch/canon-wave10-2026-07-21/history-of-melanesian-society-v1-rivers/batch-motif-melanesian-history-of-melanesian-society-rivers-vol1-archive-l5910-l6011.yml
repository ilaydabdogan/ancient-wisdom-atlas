canonical_text:
  quote: ''
  summary: The passage gives an ethnographic account of Banks Islands Tamate societies.
    It explains paired origin stories for the names Pegveng/Viov and Ngirveng/Pir
    through burnt breadfruit and burnt nuts during dances, notes restricted salagoro
    vocabulary and shell obligations for initiates, and then lists several Tamate
    societies with badges, names, gendered descriptions, eating restrictions, and
    dispositions such as chasing, fighting, devouring, or gentleness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before Viov was born, the skin of the breadfruit, described as one of Viov's
    badges, was not important.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tariaka, a man of Vanua Lava, took Viov as his own, while an unnamed friend
    took Pir.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: At a dance arranged by Tariaka and his people, the friend who owned Pir forgot
    a roasting breadfruit while watching the dancers, and the breadfruit became badly
    burnt.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The friend called to Tariaka, who was inside the tamate, and named Tariaka's
    tamate Pegveng after the burnt breadfruit.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Pegveng is said to be a Vanua Lava word and a salagoro word for burnt breadfruit;
    only members of the Viov society may use the word veng for burnt, and only among
    themselves.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: If someone uses the ordinary word vingo for a burnt breadfruit, no one may
    eat that breadfruit except a member of Viov.
  category: action
  evidence_refs:
  - ev:1
- id: obs:7
  text: In a reciprocal episode, Tariaka prepared breadfruit pudding and Canarium
    nuts, watched Pir come out, forgot the nuts on the fire, and found them badly
    burnt after the dance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Tariaka called to his friend within Pir and named the friend's tamate Ngirveng,
    with ngir identified as the salagoro word for the nuts.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: Viov took fifty conch-shells and Pir took a hundred; initiates into Viov must
    bring fifty shells, and initiates into Pir must bring a hundred.
  category: action
  evidence_refs:
  - ev:2
- id: obs:10
  text: Pegveng may be used instead of Viov as the name of the tamate, and Ngirveng
    instead of Pir.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:11
  text: Manvusvusmala is listed as a society about which nothing was known in the
    passage.
  category: other
  evidence_refs:
  - ev:4
- id: obs:12
  text: Mantelel takes its name from a shore-bird, and its hat has the form of this
    bird; its badge is a very small croton.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: Tamate liwoa or werewere has connected minor societies named Wis, Kwatwasawasa,
    Saka, and Serekor, all described as Tamate that chase people.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: 'Tamate saka may be a separate Tamate and has special badges: a small red
    croton and a sprig of long grass.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:15
  text: Tamate nivat is described as the four Tamate and includes Menmenide, Kwatgatotapanoi,
    Novnau, and Pepe.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:16
  text: Menmenide is described as a male Tamate with green unripe marakwarakwa fruit
    and a kwagkwage leaf as badges.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:17
  text: Kwatgatotapanoi is described as a female tamate, and the passage explains
    the name as the crayfish of Panoi, a great devourer of men.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:18
  text: Novnau and Pepe are described as female Tamate with specified fruit, leaf,
    and croton badges; Pepe takes its name from a fish.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:19
  text: The four Tamate nivat societies have one common salagoro and one common badge,
    a croton called tamatpaso.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:20
  text: Members of the Tamate nivat societies may eat at each other's ovens, except
