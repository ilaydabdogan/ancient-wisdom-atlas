candidate_motifs:
- id: motif:1
  label: Reciprocal ritual naming through burnt food
  taxonomy_refs: []
  basis: 'Two paired episodes explain Tamate names through burnt food at dances: burnt
    breadfruit produces Pegveng, and burnt nuts produce Ngirveng.'
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents these as society-name explanations, not as a fully
    narrated myth cycle.
- id: motif:2
  label: Restricted ritual vocabulary controlling food access
  taxonomy_refs: []
  basis: The word veng for burnt is restricted to Viov members, and ordinary naming
    of a burnt breadfruit makes it edible only by Viov members.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage describes a local salagoro rule; broader symbolic meaning
    is not stated.
- id: motif:3
  label: Initiation obligation paid in fixed shell numbers
  taxonomy_refs:
  - initiation
  - sacred_exchange
  basis: Initiates into Viov bring fifty conch-shells, and initiates into Pir bring
    a hundred.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not explain the later use or recipients of the shells
    beyond the obligation.
- id: motif:4
  label: Badge-bearing Tamate societies
  taxonomy_refs:
  - initiation
  basis: The passage repeatedly identifies societies and Tamate by badges made from
    breadfruit skin, crotons, fruit, leaves, grasses, flowers, hats, and other markers.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage lists badges ethnographically; it does not explicitly state
    all badge functions.
- id: motif:5
  label: Personified Tamate dispositions
  taxonomy_refs: []
  basis: Different Tamate are described as chasing people, fighting with bow and arrow,
    eating people, or being gentle.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: medium
  cautions: The passage does not clarify whether the dispositions describe masked
    performances, named beings, society behavior, or all of these.
- id: motif:6
  label: Devourer associated with the abode of the dead
  taxonomy_refs: []
  basis: Kwatgatotapanoi is explained as the crayfish of Panoi, a great devourer of
    men, and Panoi is noted as the abode of the dead.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: medium
  cautions: The passage gives only a brief name explanation and footnote, with no
    afterlife journey narrative.
- id: motif:7
  label: Shared ritual grouping with internal food restrictions
  taxonomy_refs: []
  basis: The four Tamate nivat societies share one salagoro and common badge, and
    members may eat at each other's ovens except that Tamate pepe members can eat
    only at their own.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives the rule but not its rationale.
comparison_claims:
- id: claim:1
  claim: 'The Pegveng/Viov and Ngirveng/Pir episodes form a close internal parallel:
    each involves a dance, a distracted food-preparer, burnt food, and the naming
    of the other person''s Tamate.'
  claim_level: same_motif
  target: Paired Viov/Pir naming episodes within this passage
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal structural comparison only, not a claim about historical
    contact or external parallels.
- id: claim:2
  claim: The four Tamate nivat societies are presented as sharing a group identity
    or function through a common salagoro, common badge, and partial reciprocal eating
    rights.
  claim_level: same_function
  target: Menmenide, Kwatgatotapanoi, Novnau, and Pepe as Tamate nivat
  evidence_refs:
  - ev:8
  counter_evidence_refs:
  - ev:8
  confidence: high
  limitations: The Pepe oven exception limits the claim of full reciprocity.
- id: claim:3
  claim: Several Tamate figures or societies share a chasing or threatening function,
    including the minor Tamate connected with liwoa/werewere and Kwatgatotapanoi.
  claim_level: same_function
  target: Chasing Tamate in the Salagoro section
  evidence_refs:
  - ev:5
  - ev:9
  counter_evidence_refs:
  - ev:9
  confidence: medium
  limitations: Novnau and Pepe are explicitly gentle, so the threatening function
    is not general to all Tamate listed.
