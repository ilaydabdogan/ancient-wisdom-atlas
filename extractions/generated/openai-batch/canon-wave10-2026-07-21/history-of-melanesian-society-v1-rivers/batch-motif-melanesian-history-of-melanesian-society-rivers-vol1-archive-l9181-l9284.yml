canonical_text:
  quote: ''
  summary: The passage describes Hiw rules of kwiiga avoidance, fines, and sacredness
    of the head; marriage regulation in the Torres Islands, including exogamous divisions
    and several permitted or restricted close-kin marriages in Hiw and Loh; and male
    kava preparation in the Hukwa gamel, with named coconut-shell cups, ranks, and
    a protected mouth-rinsing strip.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Hiw, a man does not say the name of anyone he calls kiviiga or kwiiga.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who wishes to pass a kwiiga asks permission, and the kwiiga turns his
    or her head aside as he goes by.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Infringement of the kwiiga rules is punished by a fine of arrows, pigs' jawbones,
    and kava.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The wife’s mother will not eat anything carried on her son-in-law’s shoulder,
    but the restriction does not apply if it was carried in his hand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: If anyone touches a man’s head, his kwiiga objects and says that the head
    of his kwiiga is sacred.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: The three main social divisions, Teriiar, Gameljat, and Gameltemata, are exogamous;
    the passage states no evidence that the metaviv regulate marriage.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: In Hiw, marriage with the father’s sister and marriage with her daughter are
    connected, with cross-cousin marriage described as a substitute when the father’s
    sister is not young enough.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In Hiw, a man who marries the daughter of his mother’s brother pays nothing
    for her, and a man especially desires his sister’s son as a son-in-law without
    seeking payment.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: In Hiw, marriage with the daughter of a brother is described as an orthodox
    custom if the brother’s daughter is old enough.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Marriage to the daughter of the father’s sister makes the father’s sister
    a kwiiga, and marriage to the daughter of a brother makes the brother a kwiiga,
    with similar restrictions following.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In Loh, father’s-sister marriage is no longer allowed though said to have
    been practiced formerly; cross-cousin marriage exists but is restricted, and artificial
    brotherhood can prohibit marriage with the other man’s sister.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the Torres Islands, kava is called gi and making and drinking it is called
    wiena; only men may drink it in the Hukwa gamel, and each man prepares kava for
    himself.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Three kinds of cup are used in kava preparation, including polished coconut-shell
    cups and an unpolished water bowl called rung, and the cups stand on coconut-shell
    rings and should not touch the ground.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Men of each Hukwa rank prepare and drink kava in their own gamel compartment,
    and no one steps across the tema komkom mouth-rinsing strip.
  category: setting
  evidence_refs:
  - ev:9
