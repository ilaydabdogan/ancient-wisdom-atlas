canonical_text:
  quote: ''
  summary: 'The passage describes Banks Islands rules and practices concerning relatives
    by marriage: ritualized chaffing of the husband of a father''s sister, spousal
    naming and address conventions, and name-avoidance with substitution vocabulary
    for parents-in-law and their sons- or daughters-in-law.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The husband of the father's sister is called usur and is continually subject
    to chaff from his wife's nephew, including special words called usur-gae.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the example given, John or his sister could refer to Virsal through teasing
    statements involving a pig wallowing, a flying fox heard at night, or a kingfisher.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: John could tease Virsal by saying he was going to the beach to eat manvat
    or sea-slug, or by saying he was in Panoi or in a named sacred place.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: At a dance, John could rush up to Virsal, threaten him with a club, seize
    him, and release him only after receiving money from him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The informant explained the chaff and usur-gae as emphasizing the importance
    of the father's sister and as continuing premarital opprobrious conduct after
    the marriage.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The usur is sometimes also called marazik and is thereby classed with the
    mother's brother.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A man may address his wife by her personal name, but a wife should not address
    her husband by name; doing so is described as showing lack of respect or flouting
    him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A wife may be referred to by name, as Ro gene, as mother of her child, as
    equivalent to the children through irananatuk, or as the wife of her husband.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The informant explained one usage for referring to a wife as showing the superiority
    of the husband, with the wife subject to his command while he is responsible for
    her behaviour.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Certain parents-in-law, including a kwaliga and an itata, may not be addressed
    by name, and sons- or daughters-in-law may not use words forming part of those
    names.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Substitution words are used when the proper name of an object is forbidden;
    these are called un words in Mota and siem words in Rowa.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: One way of avoiding forbidden names is to address or speak of a relative by
    marriage as the father or mother of his or her child.
  category: speech
  evidence_refs:
  - ev:10
