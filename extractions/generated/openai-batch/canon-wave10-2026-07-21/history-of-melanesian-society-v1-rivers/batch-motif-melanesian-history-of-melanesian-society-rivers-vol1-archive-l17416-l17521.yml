  quote: ''
  summary: The passage reviews older and more recent accounts of Tikopia concerning
    sex ratios, reported infanticide and family limitation, changes in polygyny, vegetarian
    habits and avoidance of animal food, and Gaimard's account of four villages and
    four chiefs. The author treats discrepancies among accounts as evidence of possible
    changes in custom while cautioning against overinterpreting sex-ratio data.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dillon is reported as saying women were more numerous than men and that male
    children after the first two of each female were strangled at birth; three Englishmen
    found by Dumont d'Urville denied this, and Gaimard reported families with three
    to eight children.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: John Maresere's account says family size was limited to four and that children
    beyond that number were generally buried alive; he also says one or more girls
    might be killed after four girls in succession in the hope of later boys.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mr Durrad's records are said to show large families, including families of
    eight and nine children, and 42 recorded families with 96 males and 55 females.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that the discrepancies most likely indicate a change in
    custom, but he cautions against concluding that female infanticide replaced male
    infanticide because biological causes of sex-ratio disproportion are not well
    known.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dillon and Gaimard describe plurality of wives as a Tikopia custom, while
    John Maresere says ancient polygyny had disappeared and that even a chief then
    had only one wife.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author says the disappearance of polygyny was probably a natural result
    of a change in the proportion of the sexes rather than external influence.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Older accounts describe vegetarian habits and say pigs and fowls had formerly
    existed but were destroyed because they harmed gardens; the passage also reports
    that turtle was formerly not eaten and that animal food was mainly limited to
    some fish.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Gaimard describes the population as distributed in four villages and names
    four chiefs in order of importance, while the author notes a possible mistake
    in the order or district assignment.
  category: relationship
  evidence_refs:
  - ev:6
