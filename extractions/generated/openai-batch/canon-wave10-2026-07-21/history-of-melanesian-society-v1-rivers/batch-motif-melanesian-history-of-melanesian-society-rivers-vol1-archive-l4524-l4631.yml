canonical_text:
  quote: ''
  summary: The passage describes the salagoro of Banks Islands Tamate societies as
    a men's meeting place, clearing, building, or marked site associated with society
    objects. It details cycas markers, lozenge-shaped representations of the face
    of a tamate, special vocabulary, masks and hats called tamate, restrictions on
    women and uninitiated persons seeing them, gendered mask shapes, and the saka
    stick used by a blackened, disguised man to frighten women and children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A salagoro may be a building, a bush clearing, or a spot near a salagoro building
    rather than necessarily a definite structure.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cycas trees can mark salagoro sites, and a planted cycas in a garden can indicate
    that the place is saretamate, described as the lodge or resting place of a tamate;
    the place can later be made free by a new owner after sale of the land.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Every salagoro building has a special lozenge- or diamond-shaped door, described
    as the conventional representation of the face of a tamate.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The salagoro is a men's meeting place in addition to the gamal and is used
    for manufacturing and keeping special objects connected with the societies.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Certain objects and processes in the salagoro have special terms, indicating
    a special salagoro vocabulary.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Most Tamate societies possess objects worn as hats or masks or carried in
    the left hand; these objects often take the shape of the animal or other object
    from which the society takes its name, and all are called tamate.
  category: object
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:7
  text: When members go around the island, uninitiated persons may see the tamate
    objects only when they cannot closely observe them; the objects are carried in
    the left hand so the right hand is free to strike people in the way.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The stated purpose of the tamate object is partly disguise and partly producing
    fear among the uninitiated and increasing the mystery of the societies.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Outside such expeditions, tamate objects may not be seen by women or other
    uninitiated persons, and women should not come into relation with them even when
    the objects are hidden.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'Male and female tamate objects differ in shape: male hats are lozenge-shaped,
    tall, or oblong, while female hats are rounded; the passage also states that large
    or long things are regarded as male and short things as female.'
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Some Tamate societies have ceased making their masks because people no longer
    know the exact forms, so some men may join a society without ever wearing its
    mask.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The saka stick is used to frighten women and children; a man blackens his
    face and body with charcoal, carries the saka in his left hand, wields a club
    in his right, strikes people who do not move away, and keeps the saka moving so
    it cannot be seen distinctly.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The saka bears a representation of the face of a tamate, with two eyes shown
    definitely.
  category: object
  evidence_refs:
  - ev:10
