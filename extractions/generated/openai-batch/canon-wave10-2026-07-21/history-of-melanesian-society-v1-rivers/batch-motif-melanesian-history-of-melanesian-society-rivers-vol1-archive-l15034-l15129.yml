canonical_text:
  quote: ''
  summary: The passage describes Tikopian prohibitions on eating or killing certain
    animals and plants called atua, sanctions for killing sacred animals, descent
    traditions in which men became animals after death, and social rules around chiefs,
    including class separation, ranked ariki, deferential conduct, taboo canoe use,
    chiefly privileges, and succession.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Some food prohibitions are division-specific: the Fangarere do not eat the
    one or omi fish or the moko bird, while the sting-ray may be eaten by no one and
    is not assigned to a single division in the passage.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who may not eat an animal may also not kill it; a Fangarere person
    catching an one fish would usually return it to the water, though he might give
    it to a member of another division.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Killing another division’s sacred animal is said to make the killer sick,
    and a man of the animal’s division can make him well by calling on his atua.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: If anyone kills a flying fox, coconut trees are said to cease bearing; if
    the fresh-water eel sacred to the Tafua is killed, the spring feeding its pool
    is said to become dry.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sacred animals are described as having the same name as ancestors and
    as being regarded as such, but descent is traced from men who turned into animals
    rather than from the animals themselves.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Kafika and Taumako trace descent from men who became an octopus and an
    eel after death; the Tafua trace descent from a man who became a flying fox and
    also have a tradition of a second man who became a fresh-water eel; two Fangarere
    men changed into the one fish and the moko bird.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'Three divisions are also prohibited from eating certain plants: yam, taro,
    and coconut; these plants are also called atua in the passage.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Chiefs or ariki are sharply distinguished from ordinary people, and marriage
    between the two classes is not allowed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: If a youth of the ordinary people has an intrigue with a chief’s daughter,
    the man is hanged or sent adrift in a canoe; the woman is not punished, but any
    child would be killed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each of the four divisions has a head chief; members of the chief’s family
    are also called ariki, and the head chiefs are ranked, with Kafika highest and
    Fangarere last.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A visitor to a chief kneels at the door, approaches on hands and knees, touches
    noses with the chief, withdraws, sits cross-legged, eats and talks, asks permission
    to leave, and withdraws without turning his back.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A man wishing to pass a chief requests permission, receives the chief’s spoken
    permission, and then goes by on hands and knees.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: In a chief’s presence, Tikopians remove a bark-cloth fillet worn on the head;
    a chief’s name is not uttered, and he is addressed by title.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: No woman may go in a chief’s tapu canoe, and the chief receives certain highly
    prized fish or the first caught fish when there are several.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: A chief is succeeded by his son, or by his younger brother or brother’s son
    if he has no son; he is not succeeded by his sister’s son.
  category: sequence
  evidence_refs:
  - ev:10
