  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: A Viov man may decorate himself with the red croton kariura only if he has
    also been initiated into Tamate liwoa; if he belongs only to Viov, he may not
    touch it.
  category: relationship
  evidence_refs:
  - ev:7
