canonical_text:
  quote: ''
  summary: 'The passage describes practices and emblems of Banks Islands Tamate societies:
    capture and binding during initiation, staged dances by new members, animal-shaped
    hats, costly initiation, named sub-societies with badges, and the closely associated
    Viov and Pir societies, understood as male and female and possibly as husband
    and wife. The author records uncertainty about some names and interpretations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A captured person is treated gently if submissive but not if he struggles;
    John helped catch his brother Henry by luring him to gather breadfruit, pinning
    him, and allowing the party to bind him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'New members do not organize a separate dance, but dance at a kolekole in
    three stages: first with tall black hats, second without hats or decorations,
    and third with special hats.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Special hats may be chosen from subsidiary divisions and are shaped to represent
    animals, fish, or similar named forms; the pagoa shark form is said to be popular,
    and a former bowl form has recently been made into a boat model.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mautereteremake initiation requires much money and pigs; its hat decoration
    is like a bird head, and its badge is a long red and white croton.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Viov or Oviov is described as a very important and expensive Tamate, entered
    one man at a time and by those whose relatives are powerful and rich; Viov and
    Liwoa are described as rivals.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Viov is described as a male Tamate with a tall mask and a long beard, and
    it contains minor societies into which a man may be separately initiated.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Named Viov sub-societies include forms associated with a flat-fish, Tamates
    that chase people, a shrub, a pigeon, and a crayfish; their badges include a cuttle-fish
    shell on a reed, a shrub sprig, and crayfish antennae.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Togotil is connected with Viov and is called the companion of Viov; its mask
