canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Banks Islands kinship customs: father-son
    commensality avoidance, brother-sister restriction on chaffing, grandparental
    rights in land inheritance, and the unusually close and authoritative relationship
    between a man and his mother''s brother, including inheritance claims, respect
    rules, initiation into the Sukwe, access to the gamal, and canoe obligations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man and his father do not eat together because it is thought that the child
    might acquire the father's character.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men eat in the gamal or club-house, and father and son are said usually not
    to be in the same division of this institution.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Members of the two veve or moieties are believed to have different characters,
    and father and son belong to different veve.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that ordinary affection between parents and children is
    present, while noting that Christian influence may have strengthened that bond.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Brother-sister avoidance found elsewhere in Melanesia is said not to be present
    in the Banks Islands, but brother and sister do not poroporo or chaff one another.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The prohibition on chaffing between brother and sister is presented as significant
    because poroporo is especially frequent among members of the same veve.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: On Rowa, if a man with children dies while his parents are still alive, the
    children do not succeed to his land until they buy off the rights of the grandparents
    with money and pigs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The relationship between a man and his mother's brother is described as very
    close throughout the Banks Islands.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In former times, the sister's son is said to have been the heir of his maternal
    uncle and to have taken all his property, including magical objects; the custom
    is now described as modified.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Payments from the children of a dead man to his sister's children are still
    required, after which the sister's children have no further right to the uncle's
    property.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A sister's son may take goods belonging to his maternal uncle during the uncle's
    lifetime; the passage says this right could include valuable possessions such
    as pigs or canoes, though it is treated as prescriptive rather than usually practiced.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: If a mother's brother imposes a difficult task on his sister's son and the
    task causes death or injury, compensation cannot be demanded; if a father does
    this to his own son, compensation may be demanded by the boy's mother's brother.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: A man who is fighting will stop at once if ordered by his mother's brother;
    if ordered by his father, he stops only if inclined.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: A man treats his mother's brother with greater respect than his father and
    may not put his hand above the uncle's head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: If an object wanted by a sister's son is hanging above a seated maternal uncle's
    head, the nephew waits until the uncle has gone rather than taking it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: A man is usually initiated into the Sukwe by his mother's brother.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: After the birth of a first child, a ceremony occurs in which the child's maternal
    uncles take part.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: Before a child has been initiated into the Sukwe, he may enter the gamal of
    his uncle but not the gamal of his father.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:19
  text: The sister's son normally goes in his uncle's canoe without needing to be
    asked; refusal makes him despised and, if young, liable to be thrashed by his
    uncle.
  category: action
  evidence_refs:
  - ev:8
