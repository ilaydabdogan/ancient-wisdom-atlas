canonical_text:
  quote: ''
  summary: 'The passage discusses Hawaiian royal succession, marriage grades, uncertainty
    over descent and property inheritance, and evidence for individual marriage. It
    then records Naonohielua''s account of his mother Kekaula''s parentage: Kikipani
    and Malai were childless, so Maluai, the husband of Kikipani''s sister, was called
    upon, resulting in Kekaula''s birth. Naonohielua used sandals to represent the
    people involved while explaining the kinship relations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among chiefs, royal succession is described as counted in both parental lines,
    and the highest chieftainship depended on both parents being of royal rank.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When only the mother had chiefly rank, the offspring was described as belonging
    to the chiefs, though the rank was said to be stained by the father's plebeian
    condition.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When only the father was of higher rank in a mixed marriage, the offspring
    was described as not counted as a chief, with the reason attributed to uncertainty
    of male parentage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage names the royal marriage types laa-uli alii and kaukau alii and
    notes that their order might imply the husband's rank determined placement in
    the marriage series, though the author is unsure.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: For ordinary people, the passage reports no clans, little or no individual
    property, and land and goods at the disposal of chiefs.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author states that ancient Hawaian society had individual marriage, accompanied
