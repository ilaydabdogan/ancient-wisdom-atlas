canonical_text:
  quote: ''
  summary: The passage describes Banks Islands and Merlav rules for relatives by marriage,
    including avoidance of names and familiar speech, restrictions involving heads,
    spatial avoidance, indirect requests through intermediaries, payments for infringements,
    daughter-in-law service obligations, and special duties between men related through
    marriage, including support at death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man must not take anything from above his wife's father's head or pass him
    while he is sitting; if necessary he waits until the father-in-law rises.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man does not poroporo or address his wife's father familiarly.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Avoidance of the wife''s mother is described as more thorough: the man avoids
    entering when she is near the door, sits far away if he enters, and detours widely
    if he meets her in the bush.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a man has climbed a tree, his mother-in-law must turn aside to pass him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mother-in-law may not drink water from a bamboo carried by the man, and
    requests for his work are made first to her daughter, who then speaks to her husband.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Infringements of avoidance and naming rules require payments of money.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
- id: obs:7
  text: When a forbidden name is uttered, the money paid by the offender is divided
    among the injured recipient's brothers and sisters rather than kept by the recipient.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:8
  text: The same rules apply between a woman and her husband's father, called itata
    in Mota and Motlav and kwaliga in most other islands.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The daughter-in-law, called tawarig, is expected to help her itata, especially
    by getting firewood and working in their gardens.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A daughter-in-law may not take anything from above the heads of her parents-in-law
    while they are sitting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The daughter-in-law may not eat a bird that has flown over the head of the
    itata, and an object becomes uneatable for her if the itata says it is his head.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: The itata may not say the daughter-in-law's name and must call her ratawarig.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: After the birth of a first-born child, the father's sister holds the newborn
    nephew and makes a speech mentioning the child's future wife as her tawarig.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: In Merlav, terms kwaleg and rombu are used, the same rules are said to apply,
    and these relatives must be spoken to softly.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: In Merlav, food must not be taken from the heads or shoulders of these relatives,
    though food carried by them may be eaten.
  category: object
  evidence_refs:
  - ev:7
- id: obs:16
  text: The wulus and walui or wuluk relationships are same-generation relatives by
    marriage, with wulus used between men and walui or wuluk between women.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: Wulus and walui or wuluk relatives do not say each other's names or poroporo
    one another, and people object to hearing others poroporo their kwaliga or wulus.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:18
  text: Wulus and walui or wuluk relatives have regard to each other's heads, but
    avoidance of names corresponding to natural objects is not treated as important.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:19
  text: In Merlav, a man and his wife's brother may say each other's names and largely
    have their possessions in common.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:20
  text: In Merlav, a wife's brother is expected to help, warn, accompany in a canoe,
    and if necessary die with the man.
  category: action
  evidence_refs:
  - ev:9
- id: obs:21
  text: When a man dies in Merlav, his wife's brother gives money and pigs to the
    dead man's relatives, helps support the widow, fasts from certain foods, and is
    socially judged if he does not maintain restraint.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:22
  text: The passage states that reference to the head plays the same part in wului
    or walui relations as in kwaliga and itata relations.
  category: relationship
  evidence_refs:
  - ev:10
