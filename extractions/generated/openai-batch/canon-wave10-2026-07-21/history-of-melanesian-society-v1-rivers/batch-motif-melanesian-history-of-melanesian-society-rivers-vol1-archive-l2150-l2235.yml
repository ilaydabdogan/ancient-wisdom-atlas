candidate_motifs:
- id: motif:1
  label: affinal name avoidance
  taxonomy_refs: []
  basis: Several relatives by marriage must not say one another's names or must use
    alternative terms, though Merlav wife's-brother relations are an exception.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  - ev:8
  - ev:9
  confidence: high
  cautions: This is an ethnographic kinship pattern, not a narrative mythic motif;
    local exceptions are stated.
- id: motif:2
  label: affinal spatial avoidance and indirect communication
  taxonomy_refs: []
  basis: The man keeps distance from his mother-in-law, avoids her at doors and on
    paths, and work requests are routed through the daughter.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage presents social regulations rather than mythic action.
- id: motif:3
  label: head-associated taboo for food and objects
  taxonomy_refs: []
  basis: Objects above heads, food over heads, food from heads or shoulders, and things
    identified as the itata's head are restricted in affinal relations.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: The meaning of the head reference is not fully explained in this passage.
- id: motif:4
  label: compensatory payment for breached taboo
  taxonomy_refs: []
  basis: Infringements of rules are condoned by money payments, and name-rule payments
    are distributed to siblings of the injured recipient.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage does not define the broader ritual or legal status of the
    payments.
- id: motif:5
  label: tawarig as affinal helper
  taxonomy_refs: []
  basis: The daughter-in-law called tawarig is expected to help those who give her
    this name, especially with firewood and gardens; the term is also projected onto
    a child's future wife in a birth speech.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: medium
  cautions: The passage gives only a brief explanation of the term and refers to another
    page for fuller context.
- id: motif:6
  label: brother-in-law as life-risking ally
  taxonomy_refs: []
  basis: In Merlav, a wife's brother should help, warn, accompany in a canoe, and
    if necessary die with the man.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This pattern is specifically described for Merlav and said to differ from
    Mota customs.
- id: motif:7
  label: affinal mourning support and food restraint
  taxonomy_refs: []
  basis: After a man's death, the wife's brother gives money and pigs, supports the
    widow, fasts from certain foods, and is watched for proper restraint.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not list the foods or describe the duration of fasting.
comparison_claims:
- id: claim:1
  claim: The passage directly compares Merlav kwaleg and rombu with the preceding
    affinal avoidance rules, stating that the same rules apply while adding soft speech
    and food-from-head-or-shoulder restrictions.
  claim_level: same_function
  target: Merlav kwaleg/rombu compared with the preceding Banks Islands affinal avoidance
    rules
  evidence_refs:
  - ev:7
  - ev:1
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is internal to the ethnographic account; it does not
    prove identical practice in every island.
- id: claim:2
  claim: For wulus and walui or wuluk relations, the passage supports a cautious cross-island
    comparison because it says the stated name and head customs are certainly so in
    Rowa and probably throughout the group.
  claim_level: same_function
  target: Rowa and probable wider Banks Islands wulus/walui customs
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: low
  limitations: The author explicitly marks the wider distribution as probable rather
    than certain.
- id: claim:3
  claim: The passage compares Merlav man-and-wife's-brother customs with Mota, describing
    an analogous affinal relationship but contrasting Merlav's permission to use names
    and emphasis on shared possessions and mutual aid.
  claim_level: same_function
  target: Merlav walus pattern compared with Mota same-generation male affinal relations
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs:
  - ev:8
  confidence: medium
  limitations: This is mainly a contrast within analogous kin categories, not a same-motif
    identity claim.
