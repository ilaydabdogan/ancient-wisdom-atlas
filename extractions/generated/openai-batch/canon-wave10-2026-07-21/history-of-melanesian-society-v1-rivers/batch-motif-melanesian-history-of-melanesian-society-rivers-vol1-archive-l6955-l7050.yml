canonical_text:
  quote: ''
  summary: 'An ethnographic account describes closing kolekole actions for Sukwe hats:
    removal of decorations, payment and feasting, drum-accompanied hat display and
    dance, killing of food animals, placing the hat on a decorated platform until
    it decays, subsequent tapu restrictions, the sponsor''s seclusion and surf bathing,
    variation in hat rites by rank, and restricted knowledge and preparation of head
    decorations and pigments.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Participants remove their decorations at their respective salagoro, while
    those decorated in white go to the seashore to wash powder from their hair; afterward
    they return and receive payment or a feast from the man giving the kolekole.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The assembled people wait for the hat, which has remained in the gamal; the
    big drum called kore, made from a hollowed tree trunk, is beaten by three men
    while people dance and sing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Those connected with the hat bring it out from the gamal, either worn on a
    head or carried by a handle; drums are beaten, pigs' bladders are dashed against
    trees, and people use bows and arrows to kill fowls or other animals for food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man with the hat dances round and round with it, the hat is put on a decorated
    wona or platform, and the people feast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The hat is left on the platform until it rots; if its maker breaks up an unsightly
    image, the debris must remain there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The day after the kolekole is tapu: no one may enter or leave the village,
    people must eat food already present, strangers are excluded for an additional
    five days, certain coconut and pandanus materials may not be brought in, and women
    may not make mats.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man who gave the kolekole remains in the gamal for ten days, then bathes
    in the surf; the bathing place becomes tapu for one or two years, though he may
    remove the tapu for payment if fish are present there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Kolekole proceedings for different Sukwe hats are described as having the
    same general character and differing chiefly in decorations and in the sounds
    made.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Knowledge of head-decoration procedures belongs to certain people; anyone
    wishing to learn a procedure must undergo a ceremony called tiro, and no woman
    can obtain this knowledge.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The red pigment urai kwat is prepared from tatamera using lemons or limes,
    sea-water heated over fire, chewed plant material, a via leaf, and fine mamalau
    inner-bark fragments, and it is smeared over the head with unadorned areas shaped
    like a bird.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Other head pigments described include dull-gold urai salagoro made from powdered
    unripe cycas husk, yellow urai ango whose preparation was unknown to the informant,
    and green urai mantap made from green bamboo bark mixed with heated coconut cream.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
