canonical_text:
  quote: ''
  summary: The passage describes the tamaniu as a secret animal counterpart whose
    injury or death affects its owner, then surveys Banks Islands magic, especially
    Mota practices involving oloolo rites, mana-bearing objects, increase magic, rain-making
    by imitation, and a Talosara long-life rite at rocks associated with the spirit
    Togaul.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The abode of the tamaniu is kept secret because an enemy who found it could
    kill the tamaniu and thereby kill the owner.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that if a tamaniu is killed, its owner dies at the same time;
    the killer can tell the enemy he has shot him dead, after which the addressed
    man dies instantly.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tamaniu is addressed or spoken of as if it were the man himself, and the
    passage states that injury or death of one entails illness or death of the other.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author describes special associations as bodies of men who learn a magical
    method and also protect themselves against the magic of others.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In both Mota and Motlav, the rites producing magical effects are called oloolo,
    and both beneficent and harmful forms of magic are said to exist.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Mota, beneficent forms of magic are usually inherited from the maternal
    uncle and only exceptionally from the father.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The efficacy or mana of Mota beneficent magic is described as belonging to
    objects such as stones rather than primarily to their possessor; stealing such
    a stone may enable the thief to perform the rite effectively.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Fish supply is increased by shaped stones placed on the reef, sometimes with
    leaves; yams are promoted by burying yam-shaped stones in the garden; Vanua Lava
    is said to have similar stones for turtles.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Rain-making uses a clam-shell in the ground, orange fruit on a creeper to
    imitate the rainbow, a glittering shell to imitate lightning, a coconut shell
    beaten for thunder, and fire-smoke to represent clouds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: There are also methods for producing sunshine and a large surf, with the surf
    method activated when someone from another island comes to collect debts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Beneficent magical methods are said to be performed without material reward
    in order to increase the practitioner's reputation for mana and the attribute
    called rongo.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: A Talosara sacred place contains two rocks, one called I Togaul and another
    called Tangil, and a nearby pit said to have been dug by Togaul.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Talosara long-life rite required the seeker to pay five fathoms of money,
    stand by Togaul, and place the payment on the creeper covering the rock.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: The owner of the place uncovered the rock, gazed at the seeker, and pronounced
    that he would become old and would not be killed or hit in battle.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: In one case, a man for whom the long-life rite had been performed was told
    that a fungus called kwero would grow where he lit a fire, as a sign to strengthen
    his faith.
  category: sequence
  evidence_refs:
  - ev:11
