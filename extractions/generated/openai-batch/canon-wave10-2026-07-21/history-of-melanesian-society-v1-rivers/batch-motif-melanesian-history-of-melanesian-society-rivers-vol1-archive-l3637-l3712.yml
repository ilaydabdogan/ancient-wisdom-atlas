canonical_text:
  quote: ''
  summary: 'An ethnographic passage describes a Banks Islands ceremonial dance: women
    prepare the dancing ground; a neighboring dancing party arrives with men associated
    with the drum; dancers sing, stamp, throw leaves, and brandish bows and arrows;
    conch shells are blown; Charles Wunau performs with money-measuring rods, a packet
    containing a wealth-increasing stone, posts, pigs, a pig jawbone, and fathoms
    of money, some of which he gives to a woman from the visiting party’s village.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some women swept the dancing ground before the arrival of the dancing party.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dancing party from a neighboring village, numbering about twenty or thirty,
    was announced as “bringing the drum,” meaning that they would dance to the existing
    large drum.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The visiting party approached in single file from the wood while the Vatrata
    people remained silent.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Three men described as “the drum” preceded the rest of the party and took
    seats at the drum.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Each dancer carried a bow and arrow in the right hand and broken leaves in
    the left hand, and the dancers were decorated with hibiscus blossoms, scented
    leaves, and in some cases head fillets.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: At a signal the drum began, the dancers rose together, threw up the broken
    leaves, brandished their bows and arrows, shouted, sang, and stamped rhythmically.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Seven men with conch shells assembled in the Wometeloa division of the gamal
    and blew two long and two short blasts together.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Charles Wunau, with his legs painted red, ran leaping from his house to the
    dancing ground while carrying two money-measuring rods tied with a band and a
    leaf packet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The packet tied to the measuring rods contained a small stone wrapped in leaves
    and was said to possess virtue for increasing wealth.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Charles Wunau set up posts and tied pigs to them, returning at intervals to
    dance.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Charles Wunau later danced with a pig jawbone in his left hand and the measuring
    rods in his right hand.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Abraham, described as the old man who was “making the Sukwe,” set up two stakes
    near the gamal.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Charles Wunau came out with seven fathoms of money, danced with the pig jawbone,
