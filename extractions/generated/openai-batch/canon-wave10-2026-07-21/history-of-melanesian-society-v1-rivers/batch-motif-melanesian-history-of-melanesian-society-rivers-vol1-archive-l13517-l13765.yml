  summary: The passage describes Nandrau kinship terminology, including terms for
    father, mother, child, siblings, and cross-sex siblings. It explains ordinary
    classificatory uses, exceptional uses across alternate generations, named pedigree
    examples, and comparisons with Mbau, coastal, and ordinary Fijian forms.
  language: English
