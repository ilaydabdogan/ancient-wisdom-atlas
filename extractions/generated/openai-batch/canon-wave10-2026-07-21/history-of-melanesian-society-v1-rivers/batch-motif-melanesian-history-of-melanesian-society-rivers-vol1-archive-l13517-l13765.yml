  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nau is described as primarily a mother term, extended to the mother's sister,
    the wife of the father's brother, sometimes the wife of the mother's brother,
    and also to wives of certain younger-generation male relatives.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:10
- id: obs:6
  text: Luvenggu is applied to children without regard to sex, to a brother's child,
    to the child of a woman's sister, and apparently in some additional related cases.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tutua or tuakanggu are elder-sibling terms and tadhinggu is a younger-sibling
