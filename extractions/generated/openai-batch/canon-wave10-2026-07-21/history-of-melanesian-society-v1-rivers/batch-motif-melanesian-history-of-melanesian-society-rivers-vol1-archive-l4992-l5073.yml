canonical_text:
  quote: ''
  summary: 'Ethnographic description of proceedings surrounding initiation into Tamate
    liwoa: demolition of a house, ritual beating and pursuit of the candidate, exemptions
    for women and certain men, a story of a man escaping threatened clubbing, and
    the initiation-day sequence involving exclusion of the uninitiated, money and
    pigs, an ancient stone, werewere sounds made with stones, coconut gathering and
    consumption, all-night ritual noise, dawn cleaning, and continued avoidance of
    the district by the uninitiated.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before a new member is initiated into Tamate liwoa, a house chosen by the
    candidate's father is pulled down by society members; some members wear masks
    and carry an object called saka to frighten women and the uninitiated.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The candidate's father asks members of the society to beat the candidate and
    pays them money for doing so.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The candidate expects the beating and avoids the tamate, who search for him
    and also beat certain Sukwe members up to the rank of Tavatsukwe when encountered.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tamate do not beat men outside the Sukwe or women, and a man who would
    otherwise be beaten is not touched if he is with women.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: An informant was spared by a party of tamate when a woman seized him by the
    hand while he was walking with women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A story tells of a man from Tasmate who avoided the beating entirely; the
    tamate planned to catch and club him near a waterhole, but he leapt, was surrounded,
    and escaped by wriggling between them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the initiation day is announced, all uninitiated people, including women
    and children, leave the village.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Men who have been given pigs take three yards of money to the salagoro they
    represent and return when the ceremony begins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In Veverau the ceremony occurs in a village containing an ancient stone taken
    from the site of the old long gamal.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the assembled initiated hear the werewere, someone secretly goes to
    the candidate, tells him to climb a coconut, takes him into the bush, and has
    him pluck many coconuts from his own trees for the assembled people.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The coconuts are eaten and the milk drunk; those who have eaten may not leave
    until each receives a fathom of money from the recipients of the pigs.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: People of other salagoro leave, while district people remain, cook food supplied
    by the candidate, roast yams, and make the werewere sound with small stones rather
    than the large sacred stones of the salagoro.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Only those initiated for some years may werewere, and the sound-making continues
    through the night until morning.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the morning, signs of the fires and feast are removed, the village is swept
    clean, and the island remains gona so that the uninitiated must avoid the district
    where ceremonies are occurring.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: A note glosses one term as indicating that something secret is made known
    and glosses gona as 'tied up,' with proceedings restricted from all except the
    initiated.
  category: speech
  evidence_refs:
  - ev:11
