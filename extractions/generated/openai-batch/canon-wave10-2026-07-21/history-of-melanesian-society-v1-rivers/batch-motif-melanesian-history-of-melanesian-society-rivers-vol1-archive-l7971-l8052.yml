canonical_text:
  quote: ''
  summary: 'The passage describes several Banks Islands magical practices: harmful
    rites using food remnants, objects placed on a path, wind-borne mixtures, and
    contact mixtures; counter-rites using coconuts, coconut milk, leaf juice, and
    delegated intermediaries; ritual handling of payment; and the beginning of a description
    of magical associations called parmal.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A form of maleficent magic called garatai is said to depend on fragments of
    the intended victim's food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A form called talmnatai is said to depend on placing an object on a path so
    that the intended victim steps over it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man seeking to injure a woman who refused to marry him combined tree leaves,
    a lizard, human bones, and something from the sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mixture was crushed together, placed in bamboo, and held in a tree so
    wind from Merlav would pass over it toward the woman's village; sickness began
    afterward.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: To stop the epidemic, the man prepared very young coconuts, imparted mana
    to them, and instructed his sister's son to pour and blow their juice in specified
    places.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A method for killing an adopted child returning to his real father uses sea-slug
    fluid, dead man's bone scrapings, a crustacean, and leaves sealed in bamboo.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After protecting his hands with leaf juice, the man touches the boy's shoulders
    or cheek with the mixture; sores appear at the touched places and kill the boy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A man who has performed a killing spell may repent and send a brother or other
    male family member to give the dying man a drink made from coconut milk and leaf
    juice.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sick man drinks the mixture and recovers, but then knows the cause of
    his illness and seeks to learn who caused it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The intermediary must not disclose who sent him and may claim to be the spell-worker
    himself, even at risk of injury or death.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: After recovery, the sick man's relatives give money to the intermediary, who
    may share it with the spell-worker and must buy and eat food with a small piece
    that same night; otherwise the money is buried and called som tamate, the money
    of the dead man.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Associations called parmal are named after kinds of magic and have a head
    man, usually the oldest member.
  category: relationship
  evidence_refs:
  - ev:7
