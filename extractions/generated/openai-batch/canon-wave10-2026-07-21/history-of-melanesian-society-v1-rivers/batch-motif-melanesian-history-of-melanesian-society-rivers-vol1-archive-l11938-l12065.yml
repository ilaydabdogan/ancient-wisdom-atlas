canonical_text:
  quote: ''
  summary: The passage gives Guadalcanar kinship and social-organization notes, especially
    the kema exogamous groups and their tindao sacred objects or beings. It lists
    clan-associated animals, ancestral figures, sun and moon, and a sacred fire; describes
    food prohibitions and illness following violation; and records offerings made
    to sacred animals, the sun and moon, and fire in order to obtain mana or remedy
    harm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Guadalcanar account, exogamous groups are generally called kema and
    their sacred objects are called tindao; six kema are named.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lakwili tindao include first men of the clan, images, an eel called mauvo,
    and a small fish called kohe; the two fish are not eaten by group members.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Kindapalei tindao include their first man, a snake called choholisi, the
    moon and sun together called vulamanaso, and a sacred fire called lake tambu.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Haumbata tindao include first men, a shark called baheanapombo, and a
    pigeon called naroha; the shark and pigeon are not eaten.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The information about other groups is less definite, but Kakau and Kiki are
    said to be unable to eat shark, while Simbo people are forbidden the monitor lizard.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The tindao are described as much reverenced, and the informant said they were
    worshipped.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Haumbata man seeking to kill an enemy on land goes to a place belonging
    to the naroha bird, calls on it for mana and strength, and offers pudding, fish,
    pork, and tobacco.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Haumbata man seeking to kill an enemy at sea makes offerings to baheanapombo;
    the shark is said to break the enemy's canoe and eat him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sacred snake choholisi is described as a very large creature living on
    a rock by Koli; the place is forbidden to all except Kindapalei people, who go
    there to worship it.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Kindapalei people take offerings to the snake and obtain mana from it; they
    also obtain mana from the sun and moon and from lake tambu.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Lake tambu is described as a fire springing out of rock; offerings are burnt
    in it, and the tongue and lips of a killed man are taken to it as an offering.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Eating animal tindao causes illness; examples include blood from the mouth
    and nose after eating naroha and sores after eating baheanapombo, with offerings
    to the bird given as a possible remedy.
  category: sequence
  evidence_refs:
  - ev:8
