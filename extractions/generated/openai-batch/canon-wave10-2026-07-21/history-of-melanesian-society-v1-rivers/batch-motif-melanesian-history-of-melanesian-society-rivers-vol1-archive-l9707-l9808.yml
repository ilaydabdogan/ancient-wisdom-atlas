canonical_text:
  quote: ''
  summary: The passage lists and analyzes Pentecost kinship terms, especially terms
    for wives, potential wives, co-wives, moiety members, sons by birth order, affinal
    relatives, cross-cousins, and husband's parents. It emphasizes anomalies in which
    same-generation terms are applied to adjacent generations, connecting some of
    these patterns to marriage with the wife or widow of the mother's brother and
    comparing them with Banks Islands and Mota terminology.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tasalana is given as a term for wife, and a man may refer to his wife as a
    ghost, rubbish, or excrement; others may use the same depreciatory usage when
    addressing him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lalagi is used only in address for the brother's wife, the mother's brother's
    wife, and the wife's sister; the passage identifies these relatives as potential
    wives, and one account also applies the term to the wife of the sister's son.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Havana is a term for all those of the same tavalui or moiety.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Waruena is applied mutually by the different wives of a polygynous marriage.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: When a man has three or more sons, the eldest is called tuagai, the youngest
    vabwehui, and the intermediate son or sons lologi.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Pentecost system is described as anomalous because sibi and mabi, apparently
    proper between persons of different sex, are also used between persons of the
    same sex.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage suggests that bulena, used by a man for his wife's brother, and
    habwe, used between women, may be the correct terms for some same-generation affinal
    relationships, while use of sibi and mabi for them may be an innovation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage proposes that primarily sibi is used by a woman for her husband's
    brother and sister's husband, while mabi is used by a man for his wife's sister
    and brother's wife.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Cross-cousins are described as standing to one another in a parent-child
    relation: the child of the father''s sister is the parent, and the child of the
    mother''s brother is the child.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The cross-cousin parent-child relation is said to correspond exactly with
    the Banks Islands condition and to originate in a marriage regulation making the
    wife or widow of the maternal uncle the proper wife of a man.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The mother's brother's wife is called mabi, a term also used for the brother's
    wife and wife's sister; the passage says these three relatives are potential wives
    and that mabi is the equivalent of Mota maieima for them.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The three relatives called mabi are distinguished in address by lalagi; according
    to one account, lalagi is also used for the wife of the sister's son, who would
    thereby appear to be a potential wife.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Marriage with the wife of the mother's brother would make the wife of the
    father's sister's son a rataki, classed with the mother and possibly even the
    actual mother of the speaker.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that the special anomaly in these examples is that terms
    applied to same-generation persons are also applied to persons in the generation
    immediately above or below.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: A woman calls her husband's father kogosi, otherwise used for her brother,
    and possibly sibi; her husband's mother is certainly called sibi.
  category: speech
  evidence_refs:
  - ev:9
