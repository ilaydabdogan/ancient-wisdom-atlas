  quote: ''
  summary: The passage describes Tang-era influence on Shinra/Corea, the spread of
    Buddhism, the credited invention of the Nido syllabary by Chul-chong, the preservation
    of older Chinese pronunciations through Korean and Japanese phonetic writing,
    diplomatic and cultural exchanges with China and Japan, Arab/Mussulman commercial
    contact, and Kion-chiu as a learned and sacred capital later burned by Japanese
    forces.
