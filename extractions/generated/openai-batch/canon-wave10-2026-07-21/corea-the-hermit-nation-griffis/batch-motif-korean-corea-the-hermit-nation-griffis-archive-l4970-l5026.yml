canonical_text:
  quote: ''
  summary: The passage describes Nan-on castle, its walls, gates, towers, dry ditch,
    and defenses. During the second invasion, Japanese forces under Konishi attack
    by night, using green rice sheaves, bamboo poles, and ladders to build a mound
    that overtops a lightly guarded wall. Fire-arrows reveal the work, but the attackers
    enter and fight inside. Some Chinese defenders open gates in panic, while another
    Japanese force from Kato's army enters by a rear mountain path after bribing Corean
    prisoners to guide them.
  language: English
