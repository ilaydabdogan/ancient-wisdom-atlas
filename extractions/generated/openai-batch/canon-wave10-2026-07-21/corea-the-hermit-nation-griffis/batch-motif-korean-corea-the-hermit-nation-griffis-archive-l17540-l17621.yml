canonical_text:
  quote: ''
  summary: 'A historical account of the 1884 Korean Liberal coup attempt: Liberal
    leaders, fearing a pro-Chinese Conservative government, planned to kill Conservative
    rivals, seize the government, claim royal sanction, and enact reforms. A banquet
    and fire alarm preceded an attempted assassination; Conservatives summoned to
    the palace were beheaded at the gates. Japanese guards and reform ministers held
    the palace briefly amid city unrest, anti-Japanese violence, refuge at the American
    Legation, Chinese and Korean military action, and a Japanese retreat toward the
    sea.'
  language: English
  quote_policy: summarized
