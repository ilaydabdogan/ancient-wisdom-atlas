canonical_text:
  quote: ''
  summary: The passage recounts the revival of French Catholic missionary efforts
    toward Corea, the appointment and death of Brugiere, the clandestine entrances
    of Maubant, Chastan, and Imbert, the growth of Christian communities, the 1839
    persecution, Imbert's surrender to prevent further bloodshed, the trial and torture
    of the three missionaries, and the beginning of their execution-ground humiliation
    near a river.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After European political upheavals, Catholic missionary activity revived,
    and a mission in Corea was planned under the Holy See and the Society of Foreign
    Missions of Paris.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Barthelemy Brugiere volunteered, was nominated apostolic Vicar of Corea, reached
    Shing-king, and died of sudden illness in 1835.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pierre Philibert Maubant and five Corean Christians crossed the neutral strip
    and the Yalu River on ice, avoided sentinels, crawled through a water-drain in
    a wall, and reached Seoul.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Jacques Honore Chastan passed the custom-house at Ai-chiu at night while disguised
    as a Corean widower in mourning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Laurent Marie-Joseph Imbert crossed wilderness, ice, and guards and took up
    residence near the king's palace.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Missionary visits, masses, and preaching are said to have increased the number
    of Christians to 6,000 in 1837 and 9,000 in 1838.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In 1839 a court party favoring the extirpation of Christianity gained power,
    police action was ordered, groups of five houses were to be visited, and many
    suspects were seized.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After a new decree, three native lay leaders were beheaded and about twenty
    women and children suffered death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Bishop Imbert came out of hiding and surrendered himself to stop further bloodshed,
    ordering Maubant and Chastan to surrender also.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The three missionaries met in chains, were tried and tortured for three days,
    transferred to a state prison, beaten with sixty-six paddle strokes, and sentenced
    to die by the sword.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: At the execution ground near a river, a flag bearing the death-sentence was
    displayed, the prisoners were pinioned and stripped of upper clothing, arrows
    were put through their ears, their faces were wetted and chalked, and soldiers
    mocked and struck them.
  category: action
  evidence_refs:
  - ev:10
