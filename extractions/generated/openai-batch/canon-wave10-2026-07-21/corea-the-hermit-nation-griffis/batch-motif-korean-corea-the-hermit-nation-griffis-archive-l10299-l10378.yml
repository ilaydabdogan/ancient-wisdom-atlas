canonical_text:
  quote: ''
  summary: The passage describes Korean headgear, clothing, colors, ornaments, and
    accessories by class, office, gender, season, and occasion. Hats are presented
    as etiquette markers and indicators of marriage and mourning. Court noble headgear
    may bear pa-kwa diagrams described as sacred Confucian symbols used by fortune-tellers.
    Official robes use bird and animal embroidery to distinguish civil and military
    officers. Women carry girdle bags containing personal objects, including a tiger's
    claw for luck. Costume colors and materials mark status groups, and the author
    compares the general costume type to Ming-dynasty Chinese dress.
  language: English
  quote_policy: summarized
