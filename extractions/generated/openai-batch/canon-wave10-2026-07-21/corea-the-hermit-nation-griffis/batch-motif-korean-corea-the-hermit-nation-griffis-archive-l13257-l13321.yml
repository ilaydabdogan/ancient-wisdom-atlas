canonical_text:
  quote: ''
  summary: The passage describes Korean classical education for boys seeking government
    service, beginning with memorization and writing practice, advancing to critical
    study and literary composition, and culminating in provincial and national examinations.
    It also describes candidates’ journey to Seoul, the examination setting, success
    and failure, celebratory visits by successful candidates, and a compulsory initiation
    compared by the author to European and American hazing-like customs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy aspiring to government service begins early study of the “true letters”
    or “great writing,” with the Thousand Character Classic as the first book placed
    in his hands.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Thousand Character Classic is said to have been composed by a sage in
    one night, and that labor is said to have turned the composer’s hair and beard
    white.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Children’s copies are printed from wooden blocks in large type, with Korean
    pronunciation and Korean equivalents supplied beside each character.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Learning proceeds through sounds, meanings, syntax, sense, repeated brush-pen
    use, and mastery by eye, ear, hand, and memory.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Early education is described as reading, writing, memorizing, and etiquette,
    while arithmetic, mathematics, and science receive little attention.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: After memory and pen practice, passages are expounded by a teacher, commentaries
    are consulted, and students write literary essays in prose and verse.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Government-appointed examiners give certificates to those who pass literary
    examinations in the capital and provinces.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Those who pass provincial tests may pursue subordinate local employment, while
    aspirants to higher honors travel to Seoul with diplomas for the national examination.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Young men from the same district or town travel together on foot with servants,
    behaving noisily and insolently, and villagers are glad to see them depart.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Examination candidates include young bachelors, married and middle-aged men,
    gray-headed repeat applicants, and occasionally grandfather, father, and son together.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the appointed day, several thousand or more competitors assemble with provisions;
    before themes are assigned, the setting is noisy and smoky with study, review,
    declamation, eating, drinking, chatting, or sleeping.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: The examination includes essays and oral and written answers; during silent
    work each candidate occupies a stall or cell.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage notes a large vocabulary, student slang, and folklore concerning
    examination work, success, failure, and honest or dishonest methods of securing
    success.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the examination, disappointed candidates return home, while successful
    candidates ride on horseback with musicians, visit patrons and authorities, receive
    congratulations, return thanks, and undergo an unavoidable initiation.
  category: sequence
  evidence_refs:
  - ev:7
