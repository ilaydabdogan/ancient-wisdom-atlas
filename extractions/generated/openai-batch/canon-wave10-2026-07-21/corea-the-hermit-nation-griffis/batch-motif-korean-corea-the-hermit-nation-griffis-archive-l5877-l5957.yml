canonical_text:
  quote: ''
  summary: The passage describes the Ever-White Mountains and Paik-tu as a northern
    boundary and source of major rivers; recounts belief in a white-robed virgin mountain
    spirit with white animal and bird servants; explains that Buddhism absorbed such
    local deities under new names; gives a Manchiu origin legend in which heaven-born
    virgins bathe near the mountains, a magpie drops a blood-red fruit that causes
    the youngest to conceive, and her son Ai-sin Ghioro later travels by boat down
    the Hurka River and is acclaimed ruler by warring families; and then summarizes
    Manchiu homeland, migration, conflict with the Ming, depopulation of a border
    strip, and later hostilities.
  language: English
  quote_policy: summarized
