canonical_text:
  quote: ''
  summary: The passage describes Yamato conquest and subjugation of northern, eastern,
    and Kiushiu-related peoples; resistance and revolt aided by Shinra emissaries
    and Corean mainland adventurers; the Japanese belief, dated to Jingu, that Corea
    was a tributary dependency; repeated expeditions and claims of national honor;
    cultural and military exchange between Coreans and Japanese; an episode in which
    a Corean ambassador's iron shield is pierced by a Japanese archer; tribute enforcement,
    famine relief, and war; and the beginning of a notice about Japanese aid to Hiaksai
    and famous participants Satg-hiko and Kasi-wadé.
  language: English
  quote_policy: summarized
