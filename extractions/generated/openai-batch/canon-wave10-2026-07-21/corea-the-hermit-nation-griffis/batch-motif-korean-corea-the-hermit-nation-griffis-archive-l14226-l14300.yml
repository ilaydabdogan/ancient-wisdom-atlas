canonical_text:
  quote: ''
  summary: 'The passage recounts attempted Catholic missionary and French naval approaches
    to Corea: overland and maritime routes are tested, documents and maps are seized,
    Andrew Kim is imprisoned and executed for communicating with Westerners, French
    ships are wrecked and their crews secluded on an island, and rumors of foreign
    ships spread inland.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thomas Tsoi and Maistre attempted to travel through Manchuria toward Hun-chun,
    but after a seventeen-day march Manchiu officers seized them, reprimanded them,
    and sent them back to Mukden.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Andrew Kim was ordered by Bishop Ferreol to go by water to Whang-hai and examine
    whether the province could serve as a gateway of entrance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Whang-hai coast is described as crowded with Chinese junks, marked by
    hill watch-towers, and patrolled by soldiers to prevent shore communication.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Andrew Kim came under the appearance of buying fish, sailed among islands,
    located rocks and sandspits, and made a chart of the coast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Andrew Kim entrusted a mission mail-bag containing charts and maps to a Chinese
    junk captain; the documents were seized by spies, and Andrew was arrested and
    sent to Seoul.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: French ships were trying to locate the mouth of the Han River and the channel
    to the capital while Bishop Ferreol wrote from hiding to Captain Cecile.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The French visit aimed to confer with the king's ministers and demand satisfaction
    for the killing of Imbert, Chastan, and Maubant in 1839; after surveys and a threatening
    letter, the ships withdrew.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: While imprisoned, Andrew Kim colored, copied, and translated two English maps
    of the world, prepared a geographical summary, and wrote a Latin letter to Ferreol
    recounting his capture and trial.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Andrew Kim was led to trial and executed under a sentence-flag stating that
    he was to be put to death for communicating with Western barbarians.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Four women and four men were put to death in the persecution that followed
    Andrew Kim's sentence.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Maistre and Thomas Tsoi boarded French frigates at Macao; near islands off
    Chulla both vessels grounded simultaneously and became total wrecks as the tides
    fell.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: About six hundred Frenchmen camped at Kokun Island, received provisions, but
    were rigidly secluded; at night boats with lanterns guarded against communication
    with the mainland.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Thomas Tsoi acted as a silent interpreter by writing in Chinese with a pencil;
    he heard the Corean magistrates but was not recognized by them.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The Corean government sent an answer by way of Peking and explained why shipwrecked
    Frenchmen were treated kindly while disguised Frenchmen were sent to execution.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: A note states that foreign ships became a subject of everyday talk, with reports
    growing into stories of whole fleets off the coast in northern provinces.
  category: speech
  evidence_refs:
  - ev:13
