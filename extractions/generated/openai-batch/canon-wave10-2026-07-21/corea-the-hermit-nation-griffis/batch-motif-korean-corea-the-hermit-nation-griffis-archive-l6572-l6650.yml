canonical_text:
  quote: ''
  summary: 'The passage describes Dutch captives in seventeenth-century Korea: their
    relocation and duties, Korean geographical ideas, alarm over comets interpreted
    as signs of war, Dutch marine observations and conjectures about northern straits,
    the later separation of the captives, occasional visits among them, and a failed
    attempt by a governor to use their skills for clay or ceramic work.'
  language: English
  quote_policy: summarized
