- id: obs:1
  text: Land endowments supported Buddhist institutions, and the four centuries of
    Korai are described as prosperous days for Corean Buddhism.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sung China is described as sending an impulse toward scholastic activity and
    popular education.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Nido syllabary entered general use; Chinese literature and Buddhist sacred
    books were studied, and popular works were written in Corean vernacular syllables.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Printing by cut wooden blocks was introduced; the passage says Japan adopted
    printing from Corea by the twelfth century, and later notes Corean printed books,
    metal type, and the Unmun alphabet.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: After the unifier of Corea died, his son Wu succeeded him, and Korai formed
    an alliance of friendship with the imperial Sung through tribute.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The royal line of united Corea traced descent from ancient Kokorai kings and
    claimed relationship with Puhai princes as grounds for asserting rights to Liao
    Tung.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Korai sent homage to the Kitan emperor, but the Kitan ruler demanded the Corean
    king appear in person for obeisance; the refusal led to feud, war, and loss of
    territory west of the Yalu River.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: A village called Gauli-chan, identified as Korai village, is cited as a surviving
    place-name witness to former Corean possession west of the Yalu.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Kitans crossed the river and invaded Korai; Korai allied with the Nujun
    or Mnchi, and with their aid drove back the invaders.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Corea's boundaries are said to have remained stationary afterward, while peace,
