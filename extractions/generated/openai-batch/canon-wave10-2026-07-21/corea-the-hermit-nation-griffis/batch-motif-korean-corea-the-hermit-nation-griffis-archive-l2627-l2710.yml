  summary: The passage describes Korai-era Buddhist prosperity, literacy and printing,
    diplomatic alliance with Sung China, a lineage-based claim to Liao Tung, conflict
    with the Kitans, alliance with the Nujun, stabilized borders, trade, and the later
    rise of Kitan and Kin power.
  language: English
  quote_policy: summarized
