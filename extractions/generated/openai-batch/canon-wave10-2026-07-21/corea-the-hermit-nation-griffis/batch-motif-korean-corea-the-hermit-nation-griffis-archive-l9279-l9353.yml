  quote: ''
  summary: 'The passage describes Korean wedding etiquette and ritual objects: the
    bride''s required silence, household eavesdropping, a stock anecdote about a groom
    who provokes his bride into speech and is insulted in return, marriage-related
    language and status markers, the role of the middle-man and bridesmaids, the goose
