canonical_text:
  quote: ''
  summary: King Cheng-chong of Cho-sen, praised for goodness, goes out at night disguised
    as a countryman to learn about his subjects. He observes a poor household where
    an old man weeps, a man in mourning sings, and a bare-headed woman dances. The
    householder explains that the family is destitute and that his wife has sold her
    hair to buy bean soup for his father; the singing and dancing were meant to console
    the ashamed old man. The king is impressed by the son's and daughter-in-law's
    devotion and asks about presenting the man at the examination the next day.
  language: English
  quote_policy: summarized
