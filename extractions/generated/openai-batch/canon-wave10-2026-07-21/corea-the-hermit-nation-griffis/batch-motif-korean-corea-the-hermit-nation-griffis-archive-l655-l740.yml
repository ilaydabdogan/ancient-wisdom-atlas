canonical_text:
  quote: ''
  summary: The passage reviews doubts about the early Ki Tsze tradition, outlines
    early northern and southern divisions of Korean history, recounts the consolidation
    and collapse of Qin power in China, and narrates conflict involving Yen, Cho-sen,
    Han, Kijun, and Wei-man. Wei-man enters Cho-sen with followers under disguise
    and false pretenses, is welcomed and given frontier authority by Kijun, then uses
    a false invasion warning to approach the capital, attack the royal castle, defeat
    Kijun, and proclaim himself king.
  language: English
  quote_policy: summarized
