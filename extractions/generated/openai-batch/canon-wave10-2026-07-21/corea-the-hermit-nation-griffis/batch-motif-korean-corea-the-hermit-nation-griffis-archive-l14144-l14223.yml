  quote: '"turned toward the land of martyrdom."'
  summary: The passage narrates clandestine efforts by Andrew Kim and other Korean
    Christians to bring French Catholic missionaries into Korea despite tightened
    border controls. It describes recognition tokens, passports and inspections, a
    dangerous sea route in an improvised boat, Andrew's ordination in Shanghai, warning
    beacon fires along the coast, the return voyage with Ferreol and Daveluy, their
    night landing in disguise, and their dispersal into hidden missionary work.
  language: English
