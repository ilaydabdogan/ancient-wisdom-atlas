canonical_text:
  quote: ''
  summary: The passage describes the Amur and Sungari region as a recurring source
    of southward population movements, using geyser, flood, hive, swarm, seasonal,
    and tree imagery. It outlines a pattern in which a northern tribe grows, follows
    a powerful chief, conquers China, founds a dynasty, weakens through peace and
    luxury, and is replaced by another northern movement. It then introduces the eighth-
    to tenth-century kingdom of Puhai, its boundaries, its resistance to Tang China,
    and its relations with Koraians and Japanese.
  language: English
