canonical_text:
  quote: ''
  summary: The passage recounts Jesuit cartographic work under Kang Hi, including
    a Korean map obtained from Seoul and survey observations from Eastern Manchuria.
    The missionaries view Korea across the Tumen River, see cultivated land and walled
    towns, but are forbidden to cross. The passage then describes a tightly controlled
    northern border fair, harsh penalties for suspected aliens south of the Tumen,
    and the later use of the border as an escape route for Korean slaves and Christians
    toward Russian territory.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Under Emperor Kang Hi, Jesuits in Peking began a geographical survey of the
    Chinese Empire and its outlying vassal kingdoms.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kang Hi's envoy obtained a map of Korea from the king's palace at Seoul, and
    the map was reduced, drawn, sent to Europe, engraved, and printed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Because no Korean interpreter was available, Jesuit cartographers rendered
    local names with Chinese sounds, creating discrepancies with later vernacular
    reports.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In 1709, missionaries surveying Eastern Manchuria looked across the Tumen
    River after passing forests and mountains, seeing woods and wild beasts on one
    side and cultivated land with walled cities on the other.
  category: setting
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The surveyors placed instruments on neighboring heights and determined the
    locations of four Korean towns on the northern border.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Hun-chun, interpreters supplied the names of Korean towns after the Koreans
    could not understand the Tartar or Chinese companions of the Frenchmen.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The French priests wanted to cross the river and enter Korea, but imperial
    orders forbade them, so they turned back.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A fair was formerly held alternately at Hun-chun and Kion-wen, where Korean
    and Chinese merchants exchanged goods.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The border trade lasted only half a day, after which people of each country
    were ordered back across the border and laggards were driven at spear point.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A foreigner, or even a Korean suspected of being an alien, found on the south
    side of the Tumen was put to death.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The northern border's only gate of parley is described as resembling an embrasure
    or muzzle.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: After Russian presence appeared beyond the Tumen, the gateway became the terminus
    of an 'underground railroad' for Korean slaves and Korean Christians seeking freedom.
  category: sequence
  evidence_refs:
  - ev:10
