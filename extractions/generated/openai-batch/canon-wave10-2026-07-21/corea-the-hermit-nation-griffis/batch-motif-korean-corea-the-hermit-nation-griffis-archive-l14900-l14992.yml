canonical_text:
  quote: ''
  summary: A historical account of the French expedition describes assaults on Korean
    fortified positions, Korean defensive tactics including straw decoys, written
    and diplomatic refusals of peace, the garrisoning of a fortified monastery by
    northern tiger-hunters, and a failed French advance met by concealed fire from
    the walls.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A village fortification near the way to the capital is centered on a great
    gate with a pointed stone arch, a tortoise figure, and a pagoda.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the French disembarkation, Korean fire killed two and wounded twenty-five
    Frenchmen; the French nevertheless stormed and seized the place before returning
    to the ships.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: French ships fired shells at a Korean party, causing them to flee first to
    hill-tops and then to more distant ravines and plains.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Koreans made straw men and placed them within artillery range to draw
    French fire, but the French detected the deception and did not expend ammunition
    on them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A proclamation on palace gate-posts threatened execution for anyone proposing
    peace with the French.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ni, the Korean commanding general, sent a letter using quotations from Chinese
    classics and asserting that outsiders who broke through another kingdom’s frontiers
    deserved death.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The French admiral demanded the surrender of three high ministers and threatened
    to hold the Korean government responsible for the war’s miseries.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Korean forces drilled raw troops and received soldiers from various quarters,
    including eight hundred northern tiger-hunters described as accurate shots with
    bow or matchlock.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The tiger-hunters garrisoned a fortified monastery in a valley encircled by
    hills and walls, approached by a single foot-path through a ravine.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: After an attack on a French survey boat, the admiral sent 160 men without
    artillery to capture the monastery; the force advanced casually despite signs
    of Korean movement and a warning that the monastery was full of soldiers.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Near the monastery gate, the interior was silent before a sudden burst of
    fire from the wall shattered the French columns and drove survivors into cover.
  category: sequence
  evidence_refs:
  - ev:9
