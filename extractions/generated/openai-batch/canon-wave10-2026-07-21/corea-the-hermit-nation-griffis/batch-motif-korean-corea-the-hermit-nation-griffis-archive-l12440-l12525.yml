canonical_text:
  quote: ''
  summary: 'The passage describes the cultural, proverbial, religious, practical,
    and artistic significance of the tiger in Corea: tiger body parts serve as charms,
    ornaments, prestige goods, and military emblems; sayings and proverbs use the
    tiger to express fear, danger, courage, excess, deception, and moral lessons;
    the tiger is described as an ancient object of worship; villagers invoke the fabulous
    tu-e as a charm against tigers; and Corean art is said to depict tigers with accuracy
    and vigor.'
  language: English
  quote_policy: summarized
