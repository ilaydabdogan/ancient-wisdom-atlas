canonical_text:
  quote: ''
  summary: 'The passage describes diplomatic exchanges before Hideyoshi''s invasion
    plans: Korean envoys receive gifts and an insolent letter; Portuguese firearms
    enter Japan and are later sent as gifts to Chosen; Yoshitoshi attempts but fails
    to mediate peace; Hideyoshi prepares for war and is named in several traditions;
    Korea informs China of Japan''s intentions, while China initially doubts the warning.'
  language: English
  quote_policy: summarized
