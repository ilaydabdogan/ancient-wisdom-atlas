canonical_text:
  quote: ''
  summary: 'The passage narrates a United States naval expedition near Korean islands
    in 1871: survey boats return safely, local Koreans interact peacefully with landing
    parties, Korean messengers visit a ship and are photographed with bottles and
    a newspaper, and later low-ranking Korean officers meet American representatives
    without credentials or authority. The narrator interprets the bottles, trademark,
    and newspaper image symbolically, then describes the American decision to proceed
    with river surveys after receiving no explicit Korean dissent.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Palos and four steam-launches were placed under Captain Homer C. Blake
    to examine the channel beyond Boisée Island, and returned safely after four days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: American boat parties landed, were treated in a friendly manner by local people,
    and received an unsigned official paper asking who the visitors were, whence they
    came, and why they came.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Americans answered the official questions with “Americans,” “Friendly,”
    and “Interview” in Chinese, and announced that the fleet would remain for some
    time.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Korean men approached the squadron in a junk, made signs of friendship, came
    aboard, and carried a missive acknowledging receipt of the Americans’ letter and
    saying three nobles had been appointed for conference.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The junk-men were treated hospitably, shown around the ship, fed and given
    wine, and photographed on deck.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: One Korean visitor was photographed holding empty Bass pale ale bottles and
    a copy of Every Saturday; the narrator notes the red triangle trade-mark and the
    front-page image of Charles Sumner.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A delegation of eight Korean officers of the third and fifth rank came aboard,
    apparently seeking to see the American minister and admiral, but they had little
    or no authority and no credentials.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mr. Low and Admiral Rodgers did not see the delegation; Mr. Drew received
    them, and they remained non-committal in response to questions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A footnote states that low-ranking officials without authority were used to
    delay, test, or tire foreigners, and compares this alleged practice with diplomatic
    experience in Japan and China.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Korean envoys were told that American soundings and shore surveys would
    begin after twenty-four hours; the Americans interpreted the absence of a dissenting
    reply as permitting survey work, and sent an expedition to examine and survey
    the Han River.
  category: sequence
  evidence_refs:
  - ev:7
