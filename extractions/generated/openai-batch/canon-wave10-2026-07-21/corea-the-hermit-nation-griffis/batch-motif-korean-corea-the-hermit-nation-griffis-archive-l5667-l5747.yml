  quote: ''
  summary: 'The passage describes post-invasion Japanese-Corean relations: a Japanese
    ruler''s use of the title Tai-kun, a 1624 Corean embassy and audience ritual in
    Yedo, the presentation of a gohei as a sign of vassalage, Japanese control and
    commerce at Fusan, arrangements for shipwrecked Coreans in Nagasaki, and a Corean
    explanatory account that recasts the Japanese presence at coastal ports.'
