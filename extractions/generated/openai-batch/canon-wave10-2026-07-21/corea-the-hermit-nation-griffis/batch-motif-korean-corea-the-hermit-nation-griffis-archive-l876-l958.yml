canonical_text:
  quote: ''
  summary: The passage opens with a legendary episode in which an unnamed figure crosses
    a stream with companions, escapes pursuers when a bridge of fishes dissolves,
    is guided by three differently dressed companions, arrives at a city, and becomes
    king of Fuyu. It then describes Fuyu geography, agriculture, social customs, justice,
    Heaven worship, an eleventh-month festival of reconciliation and prisoner release,
    ox sacrifice and hoof divination before military expeditions, animal-named rulers,
    royal jade coffin burial, and a historical conjecture about Fuyu feudal organization
    and Ki Tsze.
  language: English
  quote_policy: summarized
