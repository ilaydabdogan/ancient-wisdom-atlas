literal_observations:
- id: obs:1
  text: A young noble of Kiung-sang province is preparing to travel to Seoul when
    his wife calls him back and asks him to bring an object she has heard about.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife describes the desired object as looking like glass and pretty metal,
    and says that looking into it reveals a curious thing.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: After finishing business in Seoul, the husband remembers the request, asks
    the object's name, purchases a mirror through a friend, and puts it in his wallet
    without looking at it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the wife takes out the mirror, she sees a woman in it, weeps, berates
    her husband, and accuses him of bringing a concubine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The husband looks in the mirror, sees a man beside his wife, becomes angry,
    accuses her of bringing a libertine, and is about to murder her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The husband's old mother enters after hearing the quarrel; she looks in the
    mirror, sees a woman, laughs, and identifies the image as the widow Pak who has
    come to get fire, but the widow is not there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old woman calls her husband to see the object; the venerable gentleman
    enters, sees an aged man in the mirror, and identifies him as a fee-collector
    connected with teacher Tsoi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The villagers look at the mirror one by one and in pairs, cannot comprehend
    it, make a tumult, and carry it to the magistrate.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The magistrate sees the mirror, interprets what he sees as a new officer,
    calls policemen, orders preparations for men and horses, and believes he has lost
    his position.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A young policeman carefully examines the mirror and points out that each individual's
    visage is being reflected.
  category: action
  evidence_refs:
  - ev:6
