canonical_text:
  quote: ''
  summary: A young noble buys a mirror in Seoul for his wife without understanding
    it. At home, his wife, he, his mother, an elderly man, villagers, and a magistrate
    each mistake their reflections for other people, causing jealousy, confusion,
    and official alarm. A young policeman finally examines the mirror and explains
    that each person is seeing a reflected visage.
  language: English
