  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Four former palace-attendant women and an artist condemned for painting Christian
    subjects were beheaded at the Little Western Gate of Seoul.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that the government targeted Christians of rank and education
    while letting poor and humble Christians go free.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Alexander Wang wrote a silk letter in sympathetic ink to the Bishop of Peking;
