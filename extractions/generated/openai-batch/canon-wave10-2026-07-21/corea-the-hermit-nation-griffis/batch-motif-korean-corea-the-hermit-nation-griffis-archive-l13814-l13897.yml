canonical_text:
  quote: ''
  summary: The passage recounts executions and punishments of Corean Christians and
    accused associates around 1801, including Colombe, Alexander Wang, and other victims;
    official rhetoric and edicts against Christianity; secret letters written or carried
    on silk to church authorities; poor conditions among scattered converts; a brief
    1808 Muscovite-Corean diplomatic exchange; and unsuccessful 1811 appeals by Corean
    converts to the Pope for aid.
  language: English
  quote_policy: summarized
