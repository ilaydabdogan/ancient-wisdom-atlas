canonical_text:
  quote: ''
  summary: 'The passage introduces a chapter on Korean legends and folklore by arguing
    that a people''s beliefs and traditions are important for understanding its history.
    It then summarizes a Korean origin tradition: before there were rulers, a Divine
    Being descended from heaven to the foot of a sandal-wood tree on the Ever-White
    Mountains; the people made him sovereign, called him Dan Kun, and named his realm
    Cho-sen. His descendants reigned for more than a thousand years before the later
    occupation associated with the Chinese noble Ki Tsze. The passage also begins
    a Shinra origin legend in which displaced inhabitants settle on the east coast,
    and a village headman hears horses neighing toward a mountain and goes in that
    direction.'
