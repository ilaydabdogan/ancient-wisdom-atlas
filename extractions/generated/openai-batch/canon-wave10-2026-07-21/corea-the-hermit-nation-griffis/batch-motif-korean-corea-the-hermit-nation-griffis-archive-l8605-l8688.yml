  text: Each of eight provinces is directed by a governor called a kam-sa; cities
    and towns are governed through ranked officers and magistrates.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In theory, any male Korean who passes government examinations can hold office,
    but the passage says many desirable positions are secured by nobles and their
    friends.
  category: relationship
  evidence_refs:
  - ev:1
