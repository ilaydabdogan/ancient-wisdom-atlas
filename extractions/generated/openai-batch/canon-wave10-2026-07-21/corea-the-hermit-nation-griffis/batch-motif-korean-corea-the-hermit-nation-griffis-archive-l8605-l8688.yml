  text: The gate is described as prominent in public economy and family relationships,
    with etiquette visible at entrances.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the royal palace entrance there were formerly two large red-painted wooden
    horse effigies, and only high officials could pass them.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Persons riding past the palace were required to dismount and walk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Houses of men of rank commonly have two or three gates, and different people
    use or are received at different gates according to rank or relationship.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: At a magistrate office gateway, spears and tridents are displayed as symbols
    of authority.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Gates are opened and closed daily with cries or instrumental sounds; porters
    at sunset and dawn play trumpets for an extended period.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Seating orientation varies by rank and host-guest relation; bows, wine, and
    music follow in social entertainments.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Sumptuary laws regulate what may be worn or sat upon, including chairs, benches,
    silk, cotton, and official robes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Officials are called "blue clouds" because of blue-tinted garments, and assistants
    are called "crooked backs" because they bend low when speaking to employers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: When magistrates travel, servants command riders to dismount, an umbrella-shaped
