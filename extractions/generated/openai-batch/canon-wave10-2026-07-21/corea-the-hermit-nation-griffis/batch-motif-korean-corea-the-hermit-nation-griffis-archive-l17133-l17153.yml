canonical_text:
  quote: ''
  summary: 'The passage narrates reports and warnings received by the Japanese legation
    during a riot: crowds assemble, informants warn of an impending attack, Japanese-associated
    troops and students are reported attacked, Hanabusa and his suite plan a defense,
    policemen are sent to aid students and disappear, a Corean officer advises escape
    to a hill and seeking soldiers, and the mob attacks the legation with projectiles
    and fire while armed police resist.'
