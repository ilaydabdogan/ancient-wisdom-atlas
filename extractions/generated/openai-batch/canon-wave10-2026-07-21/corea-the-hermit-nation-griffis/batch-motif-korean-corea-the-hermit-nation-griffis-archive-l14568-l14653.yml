  summary: The passage narrates the imprisonment, torture, public execution, hiding,
    escape, and aftermath of Catholic missionaries and Korean converts during persecutions
    in Cho-sen, followed by the author's evaluation of missionary methods and martyrdom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed bishop is described as tortured with a club, paddle, and pointed
    sticks, then moved from a higher-class prison to a common dungeon where missionaries
    and converts joined him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On March 8, condemned prisoners were taken to a sandy plain near a river,
    accompanied by a crowd and four hundred soldiers; the prisoners were tied by the
    hair to chairs, tortured and insulted, and four heads were presented for inspection.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two French missionaries and twelve students for the priesthood were led into
    Seoul marked with a red cord and yellow caps that indicated prisoners soon to
    die, and they were executed on March 11.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Daveluy, two other priests, and two faithful natives were seized and decapitated
    on March 30, Good Friday.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The executioner in Daveluy's case is described as pausing after one blow to
    bargain with the official about payment while the victim bled.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Within a little over a month, missionary operations had stopped; scores of
    natives had been put to death, hundreds were imprisoned, and Eidel hid between
    two walls while writing to Peking.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Eidel reached the sea-coast, escaped patrols, departed in a boat made without
    iron and crewed by eleven Christian fishermen, reached Chifu, and informed French
    Admiral Roze at Tien-tsin.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Feron and Calais later reached the coast, went to sea on a Chinese smuggler,
    and arrived at Chifu while the French expedition was in Corea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that no foreign priest remained in the peninsula, that
    no Christian dared openly confess his faith, and that thousands were banished,
    imprisoned, or killed.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator summarizes that the church was stripped of pastors, counts fourteen
    martyrs, and says four other clergy died from toils and dangers.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The narrator says the priests entered the country in disguise as nobles in
    mourning, defied local laws, carried out conversion work, and were ready for the
    crown of martyrdom.
  category: speech
  evidence_refs:
  - ev:8
