canonical_text:
  quote: ''
  summary: 'The passage recounts events in Korea in 1882: an accidental fire in the
    royal palace, debate over foreign alignments and treaty rights, the suppression
    of an anti-foreign advocate and a conspiracy against the king, the rise of the
    Progressionists, missions to inform Americans and Chinese that treaties were possible,
    military and technical reforms influenced by Japan, the near-simultaneous arrival
    of Japanese, American, and Chinese vessels, and Commodore E. W. Shufeldt’s formulation
    and signing of a treaty with Korea near Chimulpo.'
  language: English
  quote_policy: summarized
