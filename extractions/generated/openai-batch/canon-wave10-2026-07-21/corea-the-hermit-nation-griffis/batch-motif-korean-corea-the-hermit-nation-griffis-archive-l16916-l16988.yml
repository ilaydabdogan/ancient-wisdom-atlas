  text: Kozaikai argued for expelling foreigners, was accused of reproaching the sovereign,
    and was put to death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A conspiracy against the king involving forty persons was discovered; some
    conspirators were exiled, ringleaders were sentenced to execution on the wheel,
    six condemned persons were spared by ministerial intercession, and the king’s
    cousin was pardoned on grounds of insanity.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the Progressionists gained the upper hand, Gio Inchiu and Eiosen went
