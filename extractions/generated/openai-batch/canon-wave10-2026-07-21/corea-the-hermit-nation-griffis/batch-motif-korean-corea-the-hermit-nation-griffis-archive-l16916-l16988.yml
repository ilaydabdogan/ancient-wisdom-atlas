- id: obs:1
  text: A fire broke out in the royal palace in Seoul on January 27, burning two nearly
    completed buildings intended for the heir apparent; it was first suspected to
    have political significance but was later shown to be accidental.
  category: sequence
  evidence_refs:
  - ev:1
