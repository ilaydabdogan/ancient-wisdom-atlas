canonical_text:
  quote: ''
  summary: The passage narrates opposition to early Buddhism, including a burned temple
    and Buddha images thrown into a river; a later Buddha image brought from Corea
    and enshrined by Umako; Corean priests, a nun, and a festival supporting Buddhist
    growth; peninsular fugitives welcomed in Japan as bearers of industry, learning,
    and skill; Hiaksai's weakening and conquest; and a footnote describing colossal
    stone Buddha or miryek figures in former Hiaksai, including paired capped figures
    and the Un-jin granite Buddha.
  language: English
  quote_policy: summarized
