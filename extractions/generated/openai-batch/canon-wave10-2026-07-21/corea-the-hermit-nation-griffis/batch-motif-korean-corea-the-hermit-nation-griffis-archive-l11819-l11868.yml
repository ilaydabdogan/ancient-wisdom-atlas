  summary: A poor childless old couple pray to Heaven after lamenting winter hardship.
    An angel appears and grants them three things to ask for, warning them to reflect
    and choose. While they debate riches, health, long life, and a child, the old
    woman idly wishes for pudding to toast at the brazier; food appears. The husband
    angrily wishes the pudding onto her nose, and it attaches there.
