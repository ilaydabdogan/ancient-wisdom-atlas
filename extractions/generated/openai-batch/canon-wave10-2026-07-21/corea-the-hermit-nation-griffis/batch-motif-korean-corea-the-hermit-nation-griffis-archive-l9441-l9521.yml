canonical_text:
  quote: ''
  summary: The passage describes marriage and household customs attributed to Korea,
    including the ritual salutation that makes marriage legitimate, legal and social
    powers of husbands, concubinage, expectations placed on wives, punishments for
    wives judged rebellious or unfaithful, and an anecdote from a Korean moral treatise
    about a deserted wife who publicly asserts her status at her husband's sixtieth-birthday
    celebration.
  language: English
  quote_policy: summarized
