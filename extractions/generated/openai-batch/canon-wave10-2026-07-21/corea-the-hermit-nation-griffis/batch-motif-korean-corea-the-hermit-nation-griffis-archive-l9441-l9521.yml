  text: A reciprocal salutation before witnesses on the wedding dais is described
    as the act that constitutes legitimate marriage.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the marriage salutation, the husband may claim the woman as his wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A husband who repudiates or divorces his wife is described as unable to marry
    another woman while the former wife lives, but able to take as many concubines
    as he can support.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Proof of intimate relations with a maiden or widow is described as making
    her the man's legal property, and he may use force to return her if she escapes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Conjugal fidelity is described as obligatory for the woman but not required
    of the husband.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Among nobles, a young bridegroom is described as spending only three or four
    days with his bride and then absenting himself to show that he does not esteem
    her too highly.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that a wife may be left in a condition compared to widowhood
    while the husband spends leisure time with concubines.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Men who visibly grieve at their wives' deaths are described as subject to
    mockery by companions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Most women are described as submitting to their lot, becoming obedient wives,
    and enduring mothers-in-law, though some households experience rebellion and quarrels.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: In lower-class households, blows with a stick or fist are described as means
    used to subdue a rebellious wife.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In higher-class households, where striking a woman is described as improper,
    divorce is presented as the husband's alternative.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A wife accused of unfaithfulness or deserting the husband's bed may be taken
    before a magistrate, beaten with paddles, and given as a concubine to an underling.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The anecdote presents an elderly high-ranking noble widower whose second marriage
    is arranged with the daughter of a poor noble in Kiung-sang.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:14
  text: At the marriage ceremony, the groom sees the bride, is described as thunderstruck
    by her appearance, but completes his ceremonial role.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:15
  text: After the customary stay at the father-in-law's house, the husband returns
    to the capital and pays no further attention to his new relatives.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The deserted wife remains at her father's house, gathers news about her husband,
    and later travels to the capital despite her parents' objections.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: At the husband's house, the wife announces herself as his wife, enters, sits
