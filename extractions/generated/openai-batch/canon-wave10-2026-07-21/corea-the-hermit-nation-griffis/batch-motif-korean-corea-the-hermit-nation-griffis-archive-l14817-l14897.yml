  summary: 'The passage narrates the French expedition against Kang-wa: Bellonet dispatches
    a squadron, French forces land and reconnoiter, Kang-wa is described as a fortified
    and fertile river island with a royal refuge, the city is attacked and occupied,
    weapons, archives, valuables, books, and manuscripts are seized, Korean cannon
    and gunpowder are described, and a later reconnaissance is sent toward Tong-cHn.'
