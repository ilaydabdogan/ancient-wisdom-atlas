canonical_text:
  quote: ''
  summary: 'The passage describes Korean outdoor sportsmen and leisure: bird, deer,
    and bear hunting methods; kite fighting and gambling; indoor games including cards
    and chess; holiday observances; and birthday customs centered on the sixty-first
    year in the Chinese calendrical cycle.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bird-hunters do not shoot birds on the wing; they disguise themselves in skins,
    feathers, straw, and similar materials, then wait in a vantage place for game
    to come within range.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A skilled fowler imitates bird cries, especially the cry of a pheasant calling
    its mate, and uses an iron whistle shaped like an apricot-stone; the passage says
    this captures many female pheasants.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Deer hunters seek developing deer-horn in June and July, form parties of three
    or four, beat up mountain sides for several days, track the game, and usually
    reach it on the third day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The deer is shot, and its horn is sold to native physicians or exported to
    China and Japan for hartshorn and medicines; the passage says successful deer
    hunting can yield substantial profit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bear hunters wait for a mother bear to lead cubs to the seashore to eat crabs;
    when she lifts a heavy rock, the hunters rush forward, causing her to drop it
    so that it crushes a cub.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bear hide, flesh, fat, sinews, liver, and gall are sold, and the liver and
    gall are described as medicinally potent and worth their weight in silver.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Winter north-wind months are described as kite time; crowds watch large kites
    fight in the air, with one kite trying to destroy, tear, or saw off another kite's
    string, and gambling accompanies the activity.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Indoor amusements include gossip, story-telling, smoking, lounging, chess,
    checkers, backgammon, and other games of hazard; card-playing is illegal but habitual
    among common people and viewed by nobles as vulgar.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Soldiers, especially guards and frontier soldiers, are said to be allowed
    to play cards because it keeps them awake and alert against night attacks; hand
    and finger games are also known.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: National and religious holidays are listed as occasions associated with China,
    seasonal planting and harvest feasts, Buddhist saints' anniversaries, the king's
    birthday, and the new year.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Poorer families celebrate only the birthday of the family head, while noble
    and wealthy families honor each family member with gifts and a gathering of friends.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Certain years of destiny receive special congratulations, with the sixty-first
    year treated as the chief event because it follows a full sixty-year cycle.
  category: sequence
  evidence_refs:
  - ev:12
