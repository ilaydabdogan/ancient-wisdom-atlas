canonical_text:
  quote: ''
  summary: 'The passage describes Korean outdoor travel and road life: many travelers
    move on foot, by palanquin, horse, ox, snowshoes, or pack transport; roads contain
    students, officials, pilgrims, invalids, entertainers, traders, postal workers,
    beggars, corpses, and famine dead; government relay stations support official
    travel; inns are scarce but local hospitality provides lodging, cooking, and loans
    of oxen.'
  language: English
  quote_policy: summarized
