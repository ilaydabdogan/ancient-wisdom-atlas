- id: obs:1
  text: Sumptuary laws are said to prevent humbler classes from traveling on horseback,
    while better classes and wealthy people use palanquins.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The roads are described as lively with foot-passengers and many kinds of travelers
    connected with trade, examinations, government service, and pilgrimage.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Students travel toward the capital or provincial literary examinations, including
    young roistering students and older solemn candidates.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Functionaries ride on horseback with noisy attendants, and ordinary people
    dismount, kneel, or bow before them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pilgrims in pious garb travel to holy mountains or famous shrines; men pray
    for business success and women ask the gods for offspring.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Lame, rheumatic, or invalid travelers are described as hobbling or being carried
