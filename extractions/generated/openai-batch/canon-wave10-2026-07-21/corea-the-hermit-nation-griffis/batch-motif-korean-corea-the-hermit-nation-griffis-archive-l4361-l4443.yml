canonical_text:
  quote: ''
  summary: The passage narrates the Japanese retreat and concentration in Seoul, the
    allied Chinese-Corean advance, a Japanese council debating evacuation, the burning
    and forced clearing of Seoul with massacre of civilians, later monastic penance
    by some Japanese soldiers, and a battle outside Seoul in which Kobayekawa's reserve
    charge and Japanese swords and spears prove decisive.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Japanese retreat and concentration in Seoul left the four northern provinces
    virtually lost to them, and the fall of Ping-an is described as the pivot of the
    war.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The allied forces prepared their commissariat, marched toward Seoul around
    mid-February, and their light cavalry formed the advance guard.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In an early skirmish near Seoul, the allies drove back the Japanese advance
    detachment with heavy loss, after which Li-yo-sun ordered a move against the capital.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a Japanese council of war, Ishida advised evacuating Seoul, Kato objected
    angrily, and Otani with others restored peace between the rival generals.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Japanese commanders concluded that Coreans in the capital should be removed;
    portions of the city were set on fire, people were driven out at lance point,
    many civilians were murdered, and only some strong men were spared for labor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Years later, the memory of the slaughter is said to have driven many Japanese
    soldiers into monasteries as penitent supplicants, with shaven heads, priestly
    robes, fasting, vigils, and prayers for pardon while seeking Nirvana with the
    Eternal Buddha.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Fortification continued while the Chinese advance guard approached within
    a few miles of Seoul and daily skirmishes took place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kobayekawa arranged the Japanese order of battle and led the main body; after
    the first two Japanese divisions were driven back, the allied pursuit became disordered
    and exhausted, and Kobayekawa charged them.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The battle became a large hand-to-hand fight; the Chinese used mainly short,
    heavy, double-edged swords, while the Japanese advantage is attributed to longer
    swords, strong armor, veteran coolness, and effective cross-bladed spears.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The passage states that the Japanese prided themselves on their blades, called
    their land the country ruled by a slender sword, and possessed many legends, literary
    works, and histories concerning ken and katana.
  category: attribute
  evidence_refs:
  - ev:8
