canonical_text:
  quote: ''
  summary: 'The passage describes La Perouse''s 1787 voyage along Korea''s eastern
    coast, coastal signal-fires reporting his ships, and early Korean Christianity
    from 1790 to 1793: Korean believers request a priest, receive Catholic ritual
    objects through Paul and John the Baptist, confront a prohibition against ancestor
    worship, and suffer trials, executions, preserved blood relics, imprisonment,
    torture, exile, and deaths while invoking Christian names.'
  language: English
  quote_policy: summarized
