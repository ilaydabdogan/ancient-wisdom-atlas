canonical_text:
  quote: ''
  summary: The passage recounts episodes in early nineteenth-century Korea involving
    suspicion of foreign ships, Korean Christians seeking a foreign priest, reports
    about Japanese adherents of an interdicted Jesus sect, a local persecution in
    Chulla, a royal recall of exiles during a year of floods, and Charles Gutzlaff’s
    1832 visit with books, medicines, potatoes, and religious texts. It ends with
    the author’s polemical interpretation linking Catholic mission activity with political
    treason and later French military intervention.
