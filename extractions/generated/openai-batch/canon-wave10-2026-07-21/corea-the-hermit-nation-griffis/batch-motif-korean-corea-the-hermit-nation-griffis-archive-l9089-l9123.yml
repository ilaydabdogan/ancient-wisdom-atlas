canonical_text:
  quote: ''
  summary: The passage describes the organization, authority, labor practices, and
    social power of porter and pedler guilds in Korea. Porters are presented as a
    large, internally governed transport guild with women members, their own rules
    and language, and the ability to halt commerce through collective withdrawal.
    Pedlers and hucksters are described as a large mobile class useful to the government
    as informants, messengers, and soldiers.
  language: English
  quote_policy: summarized
