  evidence_refs:
  - ev:1
- id: obs:2
  text: The porters are said to number about ten thousand and to be divided by province
    and district under chiefs, sub-chiefs, censors, inspectors, and similar officers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A large number of porters are women, including poor widows or women unable
