canonical_text:
  quote: ''
  summary: 'The passage recounts events after a soldiers'' revolt in July 1882: Min
    Thai Ho''s ration cuts, Tai Wen Kun''s short seizure of power, Corean nobles negotiating
    amid Chinese and Japanese intervention, Kim Ok Kiun''s disguised entry into the
    capital, Chinese forces abducting the regent and occupying Seoul, Min Yong Ik''s
    flight in bonze disguise and return, the queen''s re-entry after a palace-maid''s
    vicarious death, Japanese and Chinese military presence, efforts to train native
    troops and students abroad, and the ratification and diplomatic aftermath of the
    United States-Corea treaty.'
  language: English
  quote_policy: summarized
