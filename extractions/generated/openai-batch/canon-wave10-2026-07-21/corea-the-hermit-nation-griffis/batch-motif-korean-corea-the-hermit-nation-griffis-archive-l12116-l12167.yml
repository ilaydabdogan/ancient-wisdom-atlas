canonical_text:
  quote: ''
  summary: Cheug-chong, identified as the king, tells a poor householder to attend
    an examination that has not yet been announced. After returning to the palace
    and hearing the great clock-bell, the king orders the examination proclaimed.
    The householder attends, uniquely understands a cryptic topic because of experiences
    in his own house, and submits a successful essay. The king reveals himself as
    the earlier adviser, grants the man a doctoral degree and office, and rewards
    the filial piety of the son and daughter-in-law toward the old father.
  language: English
