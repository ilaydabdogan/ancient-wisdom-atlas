canonical_text:
  quote: ''
  summary: 'The passage recounts American-related maritime incidents in Korea in 1866:
    the wrecked schooner Surprise and its crew are examined, aided, and escorted out;
    the General Sherman expedition enters Korean waters as a heavily armed commercial
    venture, becomes suspected, and is later reported destroyed; Ernest Oppert also
    enters the Han River and contacts local Christians before the appearance of French
    war-vessels.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The American schooner Surprise was wrecked off the coast in June 1866; its
    captain, men, and Chinese cook were questioned by Korean officials, then fed,
    clothed, given medicines and tobacco, escorted, feasted, and conducted safely
    to the Border Gate.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A letter of the Korean government is said to imply that the crew of another
    American ship was also treated hospitably after shipwreck, though the passage
    says the circumstances are unknown.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The General Sherman was an American schooner owned by Mr. Preston, consigned
    to a British firm at Tien-tsin, and loaded with goods such as cotton cloth, glass,
    and tin-plate for an experimental commercial voyage to Korea.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Chifu, the General Sherman took aboard Mr. Hogarth and a Chinese shroff;
    the complement included five white foreigners and nineteen Malay and Chinese sailors,
    and the Rev. Mr. Thomas joined as a passenger to improve his Korean language knowledge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The expedition was suspected from the beginning because the men were described
    as too heavily armed for peaceful trade, and a rumor connected the expedition
    with gold royal coffins in the tombs of Ping-an.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The schooner sailed toward the mouth of the Ta Tong River, took aboard a Chinese
    junk captain as pilot for four tides or two days, and after the pilot left no
    further direct intelligence was received from the party.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: The passage states that the voyage occurred when Korea was excited over expected
    French invasion, and that foreign-clothed men or an armed vessel would likely
    be taken for French.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:8
  text: 'Two reports of the General Sherman party’s end are given: one says the crew
    were driven below, the hatches fastened, and the schooner set on fire; another
    says all were decapitated.'
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: The Koreans are said to have burned the woodwork of the schooner for its iron
    and taken the cannon for models.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: During the same month, Ernest Oppert entered the Han River in the steamer
