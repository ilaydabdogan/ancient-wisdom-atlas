canonical_text:
  quote: ''
  summary: 'The passage recounts the end of the siege of Uru-san Castle in 1598: Japanese
    defenders infer an enemy camp is empty from wild birds, receive relief after extreme
    hunger and thirst, count battlefield dead, report mutilated trophies, and later
    return home after Hideyoshi orders the recall of troops from Cho-sen. It also
    describes lingering war dreams and the later tally of body parts associated with
    an ear-tomb mound in Kioto.'
  language: English
  quote_policy: summarized
