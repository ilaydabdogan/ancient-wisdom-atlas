  quote: Both actually and ideally the tiger is the symbol of power and fierceness.
  summary: The passage presents the tiger as the royal quadruped associated with Corea,
    describes it as a northern mountain animal, and treats it as a symbol of power
    and fierceness. It also describes a captured tiger-hunters' battle-flag showing
    a winged tiger spitting fire and holding lightning, interpreted as embodying powers
    of earth, air, and heaven, and compares this image to the winged leopard in Daniel.
    The tiger is also described as a tutelary genius linked to aboriginal tiger worshippers.
