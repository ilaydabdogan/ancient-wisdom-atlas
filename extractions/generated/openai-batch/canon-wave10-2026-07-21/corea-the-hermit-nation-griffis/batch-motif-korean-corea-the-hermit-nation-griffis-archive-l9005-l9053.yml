canonical_text:
  quote: ''
  summary: 'The passage describes feudalism and serfdom in Cho-sen/Corea: dynastic
    change in 1392 impoverishes the old Korai nobility and rewards supporters of the
    new royal house with land and aristocratic privileges; common people and occupational
    groups gradually gain some social and economic liberty, while political freedom
    remains absent. The author compares this feudal pattern to medieval Europe and
    hopes for a future liberator analogous to figures in Russia, America, and Japan.'
  language: English
  quote_policy: summarized
