canonical_text:
  quote: ''
  summary: The passage describes Quelpart island, its cultivation, towns, lack of
    harbors, use as a place of banishment, products, livestock, earlier status as
    Tam-na, tribute to a mainland state, and an islander account of the origin of
    Mount Auckland as a mountain emerging from the sea after seven days and nights
    of clouds, fog, tremors, thunder, opened waves, smoke, and sulphur. It also says
    a learned Korean examined the mountain and published an account and sketch, and
    that navigators' ideas about its origin coincide with the account.
  language: English
