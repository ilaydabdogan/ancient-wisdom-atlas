  summary: The passage recounts the execution and burial of Christian martyrs, secret
    attempts to recover their bodies, the deaths of missionaries and converts, later
    misfortunes of persecution instigators, French naval plans connected with Corea,
    and Andrew Kim’s attempts to cross or explore border routes for renewed missionary
    entry.
