literal_observations:
- id: obs:1
  text: Executioners decapitated victims; their heads were presented to an inspector
    on a board, and their corpses were exposed publicly for three days before burial
    in sand by river banks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three Christians attempted to remove the buried bodies and were caught by
    government spies lying in wait.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: About twenty days after the first attempt, seven or eight men succeeded in
    carrying the martyrs’ bodies to Noku, north of Seoul.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage identifies the dead foreign leaders as the first European missionaries
    who entered the “forbidden land.”
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: With the foreign leaders, one hundred and thirty converts died; seventy were
    decapitated and the rest died by strangulation, torture, or wounds.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A new vernacular edict was posted throughout the country in November 1839,
    and six years passed before the Christians again had a foreign pastor.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A note says the chief instigators of the persecution later came to bad ends,
    including forced poisoning, exile and death, and execution after a local uprising.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: French war vessels Erigone and Favorite were sent with strategic, commercial,
