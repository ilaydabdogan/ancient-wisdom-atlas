  category: sequence
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:9
  text: Andrew Kim was on the Erigone as a Corean student and interpreter, while Thomas
    Tsoi was his companion on the Favorite.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Andrew Kim set out for the Border Gate and met an outward-bound embassy whose
    three hundred persons each carried a passport at the girdle; one Christian in
    the embassy carried letters.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Andrew Kim mingled among drovers and cattle to run the blockade at Ai-chiu,
    was later recognized as a stranger at an inn, fled, recrossed the Yalu, and rejoined
    his friends at Mukden.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Jean Joseph Ferreol was consecrated Bishop of Corea and resolved to cross
