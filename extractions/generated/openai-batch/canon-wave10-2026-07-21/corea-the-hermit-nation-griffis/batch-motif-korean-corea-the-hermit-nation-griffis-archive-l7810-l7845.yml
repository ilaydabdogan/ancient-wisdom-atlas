  quote: ''
  summary: The passage describes scenic places in Kang-wen, including a steep valley
    with floating islands, Three Days Bay, and the Rock-loving Chamber at Tsu-sen.
    It then describes the province’s people, banditry during hardship, winter travel,
    tests of strength, women reputed for beauty, Christianity’s limited presence,
    and ancient occupation or rule by Chinhan, Kokorai/Korai, and Shinra.
  language: English
  quote_policy: summarized
