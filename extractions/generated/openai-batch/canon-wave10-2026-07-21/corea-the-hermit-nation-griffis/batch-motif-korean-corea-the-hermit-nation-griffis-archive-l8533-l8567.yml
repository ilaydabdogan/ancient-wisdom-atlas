canonical_text:
  quote: "“Cho-sen is represented as a human being, of whom the king is the head,
    the nobles the body, and the people the legs and feet.”"
  summary: 'The passage analyzes Korean politics through a native caricature that
    personifies Cho-sen as an unhealthy human body: nobles dominate the central body,
    while king and people are weakened. It compares this condition with Japan’s former
    feudal over-officialism, describes Japan’s revolution as a purgation of the body
    politic, and states that Korea’s future reform requires closer union of king and
    people, curtailment of noble power, and the formation of Progressionist and Obstructionist
    parties under foreign pressure.'
