canonical_text:
  quote: ''
  summary: After news of Chiun-chiu castle's fall, Seoul panics and empties. Soldiers
    and courtiers desert, people flee to the mountains, and the king resolves to go
    with his court toward Liao Tung while sending royal princes north. The royal party
    departs hurriedly without food, suffers heavy rain, hunger, and fatigue, hears
    complaints of abandonment from roadside people, and crosses the Ein-yin River
    by the light of a conflagration kindled behind them at the king's order.
  language: English
  quote_policy: summarized
