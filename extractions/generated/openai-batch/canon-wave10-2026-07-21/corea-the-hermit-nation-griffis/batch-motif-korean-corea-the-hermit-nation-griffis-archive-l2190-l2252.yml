canonical_text:
  quote: ''
  summary: 'The passage recounts a Japanese tradition of Empress Jingu’s expedition
    to Corea: plunder is forbidden, a king is restored as vassal, tribute and hostages
    are collected, and Hiaksai submits voluntarily. It then notes later results and
    Japanese acceptance of the story, while identifying legendary elements rejected
    by critics: tide jewels used to control waves and drown the Shinra army, and a
    magic stone delaying Jingu’s childbirth. The unborn child is later deified as
    Ojin/Hachiman, and temples are dedicated to Jingu. The passage also begins a description
    of early Japanese political geography.'
  language: English
  quote_policy: summarized
