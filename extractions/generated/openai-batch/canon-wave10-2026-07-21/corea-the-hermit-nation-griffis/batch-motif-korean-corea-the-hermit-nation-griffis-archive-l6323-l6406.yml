canonical_text:
  quote: ''
  summary: The passage introduces the chapter by noting that travelers' truthful reports
    are often disbelieved, then says that the first European travelers in Korea experienced
    similar doubt. It describes Dutch maritime activity in East Asian waters, the
    wreck or forced landing of the Dutch ship Hollandra, and John Wetterree's capture
    after he and companions landed on the Korean coast to obtain water. It further
    states that Koreans valued such a Western foreigner for practical use, compares
    this to other examples of societies retaining foreigners, and mentions Will Adams
    as a foreigner detained and employed in Japan.
  language: English
