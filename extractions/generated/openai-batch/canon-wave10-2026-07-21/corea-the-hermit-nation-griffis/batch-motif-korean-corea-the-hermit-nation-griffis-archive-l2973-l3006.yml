  quote: ''
  summary: The passage explains the name Cho-sen as first given by Ki Tsze, a Chinese
    settler and civilizer, to a peaceful eastern dwelling-place after violence and
    war. It then traces later names of the Korean peninsula, including Korai, and
    states that Cho-sen was restored in 1392. The first naming is described as poetic
    and peaceful, while the second restoration is linked to political revolution and
    bloodshed. The passage then describes the decline of the Wang dynasty, popular
    hatred of a cruel monarch, expectation of a deliverer, and the introduction of
    Ni Taijo as virtuous, intelligent, skilled, and fond of falcon hunting. The excerpt
    ends during the beginning of a hunting episode.
