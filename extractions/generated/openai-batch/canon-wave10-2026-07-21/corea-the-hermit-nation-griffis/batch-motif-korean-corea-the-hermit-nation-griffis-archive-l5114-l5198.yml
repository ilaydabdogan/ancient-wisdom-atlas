canonical_text:
  quote: ''
  summary: 'A historical account of Japanese forces during the second invasion of
    Korea: after skirmishes and a tiger hunt, the Japanese retreat toward the coast,
    plunder houses and temples, admire and then burn the old sacred cities of Kion-chiu
    and Koku-shiu, and reach Uru-san on the sea-coast.'
  language: English
  quote_policy: summarized
