  summary: Historical narrative describing early Catholic missionary attempts to enter
    Corea/Cho-sen, persecution of Christians, the secret entry and hidden ministry
    of Jacques Tsiu, the torture and death of three Christians who refused to betray
    him, covert correspondence with Peking, and later foreign naval contact that provoked
    official suspicion.
