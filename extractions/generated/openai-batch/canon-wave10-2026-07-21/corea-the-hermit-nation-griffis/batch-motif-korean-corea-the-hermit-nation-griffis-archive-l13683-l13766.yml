  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jean dos Remedios, a Portuguese priest from Macao, attempted to enter Corea
    from the west in February 1791 but did not meet the expected Christian contacts
    at the frontier.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Corean Christians stayed away from the border because of persecution, and
    Jean dos Remedios returned to Peking, where he later died.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bishop of Peking wrote to the Pope about the origin, development, and
    condition of the new church in Corea.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jacques Tsiu, a young Chinese priest, was selected for a perilous mission,
    traveled from Peking, waited near the border, crossed the Yalu at night, reached
    Seoul, and began his work.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A treacherous visitor caused official spies to track Jacques Tsiu.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Three Christians connected with Jacques Tsiu were seized, tortured, refused
    to betray him, were killed in prison, and their bodies were thrown into the Han
    River.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Christian lady hid Jacques Tsiu under a wood-pile and then sheltered him
    in her house for three years after gaining her mother-in-law’s cooperation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Letters in Latin and Chinese were copied on silk, sewn into the garments of
    two believers, and carried to Peking by men who had bought positions as embassy
    servants.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Jacques Tsiu proposed that the King of Portugal send an embassy to the King
