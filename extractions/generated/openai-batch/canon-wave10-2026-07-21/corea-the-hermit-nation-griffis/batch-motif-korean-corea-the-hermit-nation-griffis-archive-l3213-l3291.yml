canonical_text:
  quote: ''
  summary: 'The passage describes two Korean customs said to be rooted in superstition:
    burying old men alive and offering human sacrifices, especially in relation to
    mountain and sea gods. It then narrates early Chosŏn royal administration, including
    Hetai-jong''s petition box, diplomatic complaints about Japanese buccaneers, fortification
    and frontier issues, depopulated border territory, and Japanese maritime raiding
    aided by the compass.'
  language: English
  quote_policy: summarized
