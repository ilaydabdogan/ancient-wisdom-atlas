canonical_text:
  quote: the founder of their social order
  summary: The passage presents Ki Tsze as a remembered founder and civilizer connected
    with early Cho-sen. It recounts his role as a sage counsellor under the tyrant
    Chow Sin, the death of Pi Kan, the overthrow and fiery death of Chow Sin, Ki Tsze's
    refusal to serve the conqueror Wu Wang, his migration northeast with Chinese exiles,
    and his ordering of a new realm whose earlier inhabitants are described as cave-dwellers
    partially civilized by Dan Kun.
  language: English
  quote_policy: quoted
