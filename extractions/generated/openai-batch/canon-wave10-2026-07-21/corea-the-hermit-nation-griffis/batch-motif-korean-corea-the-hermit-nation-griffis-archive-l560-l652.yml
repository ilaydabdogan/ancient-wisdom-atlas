canonical_text:
  quote: ''
  summary: The passage describes the traditional account of Ki Tsze, also called Kishi,
    Kei-tsa, or Kysse, as founder, civilizer, and lawgiver of ancient Cho-sen. It
    summarizes his teaching of writing, medicine, arts, and Chinese feudal political
    principles, the naming and territorial extent of Cho-sen, the claimed royal descent
    from him, Korean official reverence for him, and the qualification that modern
    Koreans are not presented as directly descended from the ancient Cho-senese. It
    also states that Japanese and Korean ancient traditions agree because they rest
    on Chinese writings, and that Ki Tsze and his colonists found earlier inhabitants
    already in the land.
  language: English
  quote_policy: summarized
