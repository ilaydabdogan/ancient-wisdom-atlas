  summary: The passage reviews and condemns an expedition associated with Oppert that
    attempted to remove venerated buried relics from a royal tomb in Korea. It reports
    that a French priest suggested the grave-robbing project; that the expedition
    involved landing, marching, excavation, and retreat; that a later encounter near
    Tricault Island escalated after a German sailor stole a calf; and that a retrospective
    letter described the raid as an attack on the King's tomb and a piratical fiasco.
