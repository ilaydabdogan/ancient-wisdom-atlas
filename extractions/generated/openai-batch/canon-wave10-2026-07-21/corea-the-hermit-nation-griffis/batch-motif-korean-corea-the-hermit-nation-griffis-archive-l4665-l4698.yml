  summary: The passage recounts Vincent’s failed attempt to enter Corea through Peking,
    his later recall to Japan and martyrdom, the absence of renewed Christian patronage
    in Corea, and the conversion, enslavement, social advancement, and martyrdom of
    many Corean prisoners in Japan during anti-Christian persecutions.
