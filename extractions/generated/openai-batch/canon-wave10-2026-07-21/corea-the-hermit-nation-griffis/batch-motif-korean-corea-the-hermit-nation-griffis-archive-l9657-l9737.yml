  summary: The passage describes Korean children's toys, games, shore play, indoor
    games, festivals, and school customs. It includes imitative toys and dinner play,
    a rain-making mouth gesture, coastal collecting and fishing, the festivals of
    Treading the Bridges, the Meeting of the Star Lovers, and Mouse Fire, and school
    study practices with marks and rewards.
