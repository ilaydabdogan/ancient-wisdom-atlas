canonical_text:
  quote: ''
  summary: 'The passage reports nineteenth-century descriptions of Korean social life
    concerning women and the family: women are described as socially unnamed and subordinated,
    lower-class women perform heavy labor, higher-class households separate male and
    female children and confine women to interior quarters, marriage intensifies seclusion,
    female honor is linked to avoidance of male contact, and women nevertheless receive
    some exterior forms of honorific address and street deference.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports missionary opinions that a Korean woman is not treated
    as a man's companion or equal and is described as lacking an independent moral
    existence.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman is described as being identified by kinship, place, or motherhood
    terms rather than by a stable personal name; before a magistrate she may receive
    a temporary name for the proceeding.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women below the middle class are described as doing hard work, including farm
    labor, applying manure, carrying food to field laborers, eating what remains,
    and carrying heavier market loads.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women are described as using rouge, white powders, hair oil, shaved eyebrow
    lines, and added hair switches for large coiffures.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: In higher-class households, boys and girls are separated after about eight
    or ten years of age; boys live in men's apartments, while girls remain in women's
    quarters.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Boys are taught that entering the female part of the house is shameful, and
    girls are taught that being seen by males is disgraceful.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says these customs separate husband and wife under the same roof;
    a husband rarely converses with or consults his wife on serious matters.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Female apartments in higher-class households are compared by the author to
    Indian zenanas; men occupy outer rooms, while women receive parents and friends
    in interior apartments.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: A marriageable young woman of the higher classes may be seen or addressed
    only by nearest kin, and after marriage women are described as inaccessible and
    confined to their apartments.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that fathers have killed daughters, husbands have killed
    wives, and wives have committed suicide when strangers touched them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that romances or novels praise figures described as 'Corean
    Lucretia.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: If a male intruder secretly enters a noblewoman's apartment, the passage says
