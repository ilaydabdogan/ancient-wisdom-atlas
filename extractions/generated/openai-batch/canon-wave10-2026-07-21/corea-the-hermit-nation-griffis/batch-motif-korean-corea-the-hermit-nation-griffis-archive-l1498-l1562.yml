  summary: The passage recounts internal conflict among Hiaksai leaders, Japanese
    military aid, a surprise Tang-Chinese attack near the Han River, the defeat and
    dispersal of Japanese and Hiaksai forces, devastation of Hiaksai, refugee migrations
    to Japan, and the later transmission of Hiaksai crafts, books, Buddhist learning,
    schools, and Chinese-character pronunciation into Japan.
