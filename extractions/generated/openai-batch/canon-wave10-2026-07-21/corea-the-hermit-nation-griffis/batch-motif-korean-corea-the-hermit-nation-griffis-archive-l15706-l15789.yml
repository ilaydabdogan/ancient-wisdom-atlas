canonical_text:
  quote: ''
  summary: The passage recounts how United States officials considered an expedition
    to Korea after reports concerning the General Sherman and related China affairs.
    Frederick F. Low and Rear-Admiral John Rodgers were assigned to pursue a possible
    commercial treaty and protection for shipwrecked mariners while avoiding force
    if possible. The passage also describes regional anti-foreign agitation in Korea,
    Japan, and China, Rodgers's naval preparations, and Low's letter to the King of
    Korea through the Chinese Tribunal of Rites, which reached the regent at Seoul
    but received no answer before the expedition sailed.
