canonical_text:
  quote: ''
  summary: 'The passage describes Korean dietary and drinking practices: strong drink,
    limited tea use, rice-boiling water and other infusions called cha, meat and fish
    consumption, the entire fowl as a sign of liberal hospitality, a first-month prohibition
    on dog meat for religious scruples, ceremonial banquet display dishes, the evening
    star as a supper signal, funeral feasts with yum-pok or sacrificial wine, and
    ice storage for food preservation.'
  language: English
