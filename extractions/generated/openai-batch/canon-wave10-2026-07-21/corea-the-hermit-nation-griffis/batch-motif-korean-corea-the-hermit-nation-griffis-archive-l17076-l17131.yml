canonical_text:
  quote: The spirits, displeased at the intrusion of the Western devils, were angry
    and were cursing the land.
  summary: 'Historical account of anti-foreign agitation in Seoul in 1882: Tai-wen
    Kun and anti-foreign factions spread slogans against Japanese and Western outsiders;
    drought and rice scarcity were framed by diviners and sorcerers as supernatural
    anger; the king prayed for rain; rumors and grievances contributed to attacks
    on Japanese persons, legation buildings, and pro-foreign ministers'' houses.'
  language: English
  quote_policy: quoted
