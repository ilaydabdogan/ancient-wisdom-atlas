canonical_text:
  quote: ''
  summary: 'The passage describes post-invasion memorial, commercial, missionary,
    and political developments involving Japan and Corea: war-junk timber reused in
    a Buddhist hall, English visitors in Japan being mocked as Coreans, failed attempts
    to open or enter Corea, a Dominican missionary’s imprisonment and relic preservation,
    and later Japanese claims or actions concerning tributary relations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Hall of the Founder in a Kyoto Buddhist temple, rebuilt by Taiko’s widow,
    was ceiled with wood from a war junk built for Taiko.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: English merchants considered establishing a trading station in Japan and possibly
    in Corea, which was believed by some to be an island.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Captain Saris arrived off Hirado in 1613 with English goods and traveled with
    seventeen Englishmen toward Yedo by way of Suruga, stopping at Hakata.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Hakata, boys, children, and idle people called the Englishmen Coreans or
    Kokorai men, made loud noise, and in some places threw stones at them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that Hakata had been a stopping place for the Seoul embassy
    and interprets the taunting as connected with remembered Corean perfidy and with
    assumptions about unfamiliar non-Portuguese foreigners.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Saris did not, so far as the passage knows, explore or open Corea to Western
    commerce, though his Japanese license allowed discovery of regions around the
    empire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Vincent (Caun), educated and sent by Jesuits to plant Christianity among his
    countrymen, reached Peking and waited four years, but was blocked by the hostile
    Manchus in Liao Tung.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Dominican friars attempted to enter the sealed land; Juan de Saint Dominique
    was selected because of his missionary experience and language ability, and he
    embarked with two other friars for the shores of Morning Calm.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Juan de Saint Dominique and the two friars could not land in Corea and passed
    to Japan, where Dominique later died in prison after persecution.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Dominique’s ashes were cast into the sea after cremation, while followers
    saved a hand and a foot from the fire and kept them as holy relics.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that relations between Japan and Cho-sen were not definitely
    fixed until the Taiko line became extinct, and it rejects a claim that Japan exacted
    thirty human hides as annual tribute.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that Iyeyasu unified Japan, restored the dual system of
    mikado and shogun, and prepared the way for his grandson to summon the Coreans
    to renew tributary relations.
  category: action
  evidence_refs:
  - ev:9
