canonical_text:
  quote: ''
  summary: A historical narrative describes Korean appeals to Peking, the arrival
    and defeat of a Ming relief force at Ping-an, Chin Ikei's unauthorized negotiations
    with Japanese commanders, Kato Kiyomasa's northern campaign with captures of royal
    and noble prisoners, dangerous travel through mountains and forests with tiger
    attacks, and an episode in which Korean prisoners falsely identify Dagelet as
    Fujiyama, prompting Japanese soldiers to uncover their heads reverently.
  language: English
  quote_policy: summarized
