canonical_text:
  quote: ''
  summary: The passage recounts the Dutch captives' overland movement to Seoul, their
    public display and service at the Korean court, Korean reactions to their accounts
    of the wider world, their removal to a mountain fort during a Manchu embassy,
    a failed escape attempt by appealing to the envoy, and later concern over additional
    shipwrecked foreigners.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Dutchmen traveled through multiple towns, crossed a high mountain with
    a fortress, crossed the Han River, and entered Seoul after a journey computed
    at seventy-five leagues.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage defines San-siang as a fortified mountain stronghold where neighboring
    villagers may flee in time of war.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Seoul and along the road, crowds gathered to look at the Dutchmen's appearance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage reports a local belief that the Dutchmen moved their noses when
    drinking, and states that some observers learned they ate ordinary food.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the palace, the Dutchmen laughed, sang, danced, leaped, and performed before
    the king, then received drink and refreshments.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Dutchmen were assigned to the king's body-guard as petty officers and
    received a rice allowance; Chinese and Dutchmen drilled and commanded palace troops.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: During their residence in Seoul, the Hollanders learned about the country
    and people and began to speak the local language.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Korean interlocutors in the passage reject the captives' claims about the
    size of the earth and the number of countries, and the passage says they placed
    Korea near China, described as the earth's center.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage reports severe cold in November, when the river froze so that
    three hundred loaded horses crossed on the ice.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: When a Manchu ambassador visited Seoul after the Dutchmen had been there three
    years, the captives were sent to a mountain fort called Numma until the ambassador
    left.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Numma fort stood on a mountain, required three hours to ascend, served
    as a wartime royal shelter, and was provisioned for three years.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: Some prisoners put Dutch clothes under Korean dress, seized the envoy's horse
    bridle, showed the Dutch clothing, and begged to be taken to Peking; the attempt
    failed, and they were imprisoned and believed dead.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: After another shipwreck off Quelpart Island, Wetterree was considered too
    old to travel, so three Hollanders were sent as interpreters.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: When the Manchu ambassador came again, nobles urged the king to kill the Hollanders,
    but the king refused.
  category: speech
  evidence_refs:
  - ev:11
