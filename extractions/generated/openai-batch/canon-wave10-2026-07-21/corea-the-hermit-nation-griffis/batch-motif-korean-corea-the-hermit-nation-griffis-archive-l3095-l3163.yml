canonical_text:
  quote: ''
  summary: 'Historical account of early New Cho-sen: the dynasty reckoned from Ni
    Taijo''s accession, moved the capital to Han Yang/Seoul, fortified and administratively
    reorganized the realm into eight provinces, carried out reforms influenced by
    Ming China, disestablished Buddhism, elevated Confucian teachings as state religion,
    and later suppressed Christianity.'
  language: English
  quote_policy: summarized
