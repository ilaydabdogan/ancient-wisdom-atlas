  summary: A condemned Chulla official who owes a large debt to the government persuades
    a jailer to release him briefly, petitions the governor at night to spare his
    life so he can repay the debt, obtains the governor's seal on a sketch of a human
    nose, and then travels with accomplices to a coastal village where they investigate
    a rich noble's mansion and begin a secret approach to the noble's son.
