canonical_text:
  quote: ''
  summary: A foreign expedition travels inland while locals watch, reaches a burial
    mound believed to contain treasure or remains, attempts unsuccessfully to dig
    into the tomb, returns under threat from local Coreans, later proceeds to Kang-wa
    Island where a landing party is fired upon, and is later described in legal and
    diplomatic terms as an attempted removal of royal remains for ransom.
  language: English
  quote_policy: summarized
