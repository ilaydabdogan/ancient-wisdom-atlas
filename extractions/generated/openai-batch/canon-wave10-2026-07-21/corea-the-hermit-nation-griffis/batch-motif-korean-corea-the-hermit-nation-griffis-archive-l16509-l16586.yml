canonical_text:
  quote: ''
  summary: The passage narrates the 1876 Japanese expedition to Kanghwa, treaty negotiations
    with Korean commissioners, a title dispute over sovereign status, the signing
    of a treaty recognizing Cho-sen as independent, and the first Korean embassy to
    the mikado's court. It describes ceremonial procession objects, diplomatic regalia,
    Japanese displays of modern military and industrial power, and later British surveying
    and shipwreck-related contact on the Korean coast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kuroda arranged his fleet in an imposing display, made transports look like
    warships by painting port-holes on them, and landed uniformed marines, sailors,
    and officers for a march to the treaty-house on Kanghwa Island.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two Seoul commissioners, Ji Shinken and In Jisho, awaited Kuroda at the treaty-house
    on Kanghwa Island.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The negotiations included ceremony, a written Korean apology for the Kanghwa
    affair, difficulty over official titles, a delay for consultation at the capital,
    and eventual treaty signing on February 27.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The signed treaty recognized Cho-sen as an independent nation; afterward the
    Japanese gave presents, were feasted, and departed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A footnote explains that the Japanese insisted on a title for the Mikado showing
    parity with the Emperor of China, while the Koreans resisted language that would
    rank their sovereign below the Mikado; the final document avoided naming or titling
    either ruler.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The first Korean embassy to the mikado's court since the twelfth century sailed
    from Pusan in May 1876 and landed at Yokohama.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The embassy procession included two trident-bearing braves, a band with metal
    horns, conch-shells, flutes, whistles, cymbals, and drums, pages carrying treaty
    documents, a chief envoy on a tiger-skin-covered platform, and an umbrella of
    state.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Japan the Korean guests were shown war ships, arsenals, artillery, torpedoes,
    schools, buildings, factories, and offices equipped with steam and electricity.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Korean visitors rejected attempts by foreigners to communicate with them,
    returned homeward on June 28, and the ambassador's official diary was later published
    in Seoul.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: British vessels later surveyed parts of the coast of Kiung-sang province,
    and a British legation attache was sent to Fusan after an English shipwreck to
    thank Korean authorities for kind treatment of the crew.
  category: action
  evidence_refs:
  - ev:6
