canonical_text:
  quote: ''
  summary: The passage describes Korai after war with China, including burial of the
    slain, sacrificial fires for the dead, diplomacy among the three Korean kingdoms
    and China, tribute, study at the Chinese capital, regional borders, and tensions
    with Shinra and Pu-hai. It then narrates Chinese ambition for territory west of
    the Yalu, Korai's feudal political structure, a powerful liegeman's killing of
    the king and installation of the king's nephew, a diplomatic rupture over Shinra,
    and a Chinese punitive invasion across sea and land into Liao Tung toward the
    Yalu.
  language: English
  quote_policy: summarized
