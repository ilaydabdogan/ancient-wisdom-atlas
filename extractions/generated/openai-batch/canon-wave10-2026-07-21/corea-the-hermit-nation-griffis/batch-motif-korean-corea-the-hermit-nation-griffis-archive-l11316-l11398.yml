canonical_text:
  quote: ''
  summary: 'The passage surveys Korean calendrical festivals and observances: lantern
    viewing, royal gifts of fans and seed, grave offerings and tomb repair, chrysanthemum
    displays, festive rice foods, a straw-effigy rite for critical years, inauspicious
    “broken days,” seasonal door mottoes, bridge crossing under the moon to avert
    calamity, and memorial rites and temples for slain soldiers. It ends with population
    estimates and a reported census.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the eighth day of the fourth month, large cities are illuminated with many-colored
    paper lanterns, and people go out on hills and rivers to view scenery.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the fifth day of the fifth month, the king presents fans to his courtiers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the fifteenth day of the seventh month, the king gives officials one hundred
    kinds of seed for next year’s crops.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: On the fifteenth day of the eighth month, sacrifices are offered at ancestors’
    graves and broken tombs are repaired.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: On the ninth day of the ninth month, chrysanthemum growers display perfected
    blossoms, invite friends to feast, and picnic parties view scenery from bridges
    and mountains.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Rice paste called mochi by the Japanese is described as important in offerings
    to the dead, temple use, household festal decoration, New Year observance, and
    equinoctial days; red rice and beans are also festive, and poor red coloring is
    considered bad luck.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: A person entering a critical year makes a straw effigy, dresses it in his
    own clothing in the evening, casts it onto the road, and feasts through the night.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Whatever happens to the expelled straw man is supposed to happen to the person’s
    former self, while Fate is believed to regard the newly clothed individual as
    another man.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The fifth, fifteenth, and twenty-fifth days of each month are called broken
    days, on which people avoid beginning anything new; at the start of each season,
    motto slips are posted on house doors.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Certain years in a person’s life are considered critical and require special
    care regarding health, food, clothing, and new ventures.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: On the fifteenth day of the first month, called Stepping on the Bridge, a
    man and woman go over a bridge at moonrise, and crossing seven bridges that night
    is believed to free a person from calamities for the year.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Annual memorial festivals are held for soldiers slain on famous battlefields,
    and temples are erected to soothe the spirits of the slain.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage concludes by discussing estimates of Korea’s population and citing
    a reported census.
  category: other
  evidence_refs:
  - ev:11
