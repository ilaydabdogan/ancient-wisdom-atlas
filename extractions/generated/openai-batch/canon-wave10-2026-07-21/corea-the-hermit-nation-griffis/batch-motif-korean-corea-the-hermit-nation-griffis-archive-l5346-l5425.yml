canonical_text:
  quote: ''
  summary: During the siege of Uru-san Castle, the Japanese garrison endures cold,
    famine, thirst, and renewed assaults. A Japanese-born commander in the Chinese
    army warns the garrison of a plan to lure its leaders to an oath before Heaven
    and then capture them. Relief forces approach from Fusan while the Chinese renew
    the attack.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During a lull, the Japanese made fires from broken arrows and lances, stripped
    armor from dead horses, ate hot horse-meat, and stacked fallen shafts for possible
    fuel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On February 6th, intense cold killed worn-out garrison soldiers; some were
    found frozen while sitting for warmth, while others continued jesting and showing
    defiance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A council at Fusan sent a messenger to encourage the garrison, and the leaders
    listened with helmets off and promised to hold out longer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Chinese plan described in the passage was to lure the Japanese leaders
    out of the citadel without horses or weapons, have them swear before Heaven at
    an altar to keep peace, and then surround and capture them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Okomoto, described as a native of Japan who had long lived in China and commanded
    a Chinese division, entered the citadel at night and warned the Japanese leaders
    of the plot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Japanese leaders swore by all the gods to reward Okomoto and also his
    sons and daughters in Japan, after which Okomoto wept and spoke of his family.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Chinese officer came to the foot of the wall, signaled with a standard,
    and offered the same terms; the Japanese leaders declined on the plea of sickness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Because the castle had no well, the Japanese had obtained water from mountain
    brooks at night until Chinese archers blocked access to the streams.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: As famine and thirst worsened, soldiers licked wounds of slain enemies, chewed
    raw flesh from corpses, chewed paper, trapped and ate mice, killed and ate horses,
    and searched corpses for grains of rice.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Chinese troops captured one hundred garrison members who were prowling among
    corpses; afterward commanders forbade soldiers to leave the castle, while dead
    from starvation and freezing accumulated within.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: After news of the garrison’s condition reached other Japanese commanders,
    Nabeshima and Kuroda marched to relieve them, and the Chinese general Eijobai
    set out to attack the relief force.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Chinese commander-in-chief ordered a renewed attack with fresh detachments,
    guns, arrows, flags, and scaling ladders; the defenders resisted in armor iced
    with frozen sweat until they saw the Chinese retreating as reinforcements attacked.
  category: sequence
  evidence_refs:
  - ev:11
