canonical_text:
  quote: ''
  summary: A historical account describes war-weariness among Ming, Japanese, and
    Korean actors; contrasts Japanese warriors with priestly literate aides; recounts
    Chin Ikei's deception of Konishi; summarizes opposition to peace, rivalry between
    Kato and Konishi, Japanese sickness and supply problems, and the orderly Japanese
    evacuation of Seoul on May 22, 1593, followed by retreat to coastal camps and
    Chinese/allied movements.
  language: English
  quote_policy: summarized
