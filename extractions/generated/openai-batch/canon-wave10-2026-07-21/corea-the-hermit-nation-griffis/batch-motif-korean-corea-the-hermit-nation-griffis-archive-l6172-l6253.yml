canonical_text:
  quote: ''
  summary: The passage recounts Russian expansion eastward, a 1645 Japanese trading
    voyage blown by storm to Tartary, the party's attack, captivity, safe-conduct
    return through Peking, Liao Tung, Seoul, Fusan, and Japan, and their observations
    of Korean courtly hospitality, civic customs, trade restrictions, military archery
    examinations, and images used in houses or palaces. It also notes a Japanese report
    of a portrait of Yoshitsune in Peking and the belief held by some Japanese that
    Yoshitsune fled Japan and became Genghis Khan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cossacks are described as discovering, exploring, conquering, and settling
    territory until Russia's boundaries reached those of Korea, Japan, and British
    America.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Japanese party left Mikuni in Echizen on April 26, 1645, in three large
    junks with crews numbering fifty-eight men on a trading voyage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A storm off Sado drove the Japanese vessels to the mountain coast of Tartary,
    where the party landed to repair and obtain fresh water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Local people first traded ginseng for Japanese sake, but later attacked the
    Japanese, killed twenty-five, and sent the remainder to Peking.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The survivors were acquitted, given safe conduct by the Chinese emperor Shun-chi,
    crossed snow-covered mountains and frozen rivers, and reached Seoul after twenty-eight
    days' travel.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Seoul, the Japanese were entertained in a royal house with banquets, servants,
    presents, and an officer named Kan-shun who showed them the city.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Japanese observed palace wall paintings, tiger-skin rugs, bound books,
    New Year's festivities, evergreen trees, and scenery in Seoul.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: In one city, trumpeters called laborers to begin and cease work at sunrise
    and sunset.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Officials inscribed the names and reign and death dates of the royal line
    on walls, from the dynasty's founder to the father of the ruling sovereign, as
    a history lesson for the young.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Merchants kept in their houses a picture of Tao-jo-kung, described as a famous
    figure who gained fortunes through trade and spent them among friends.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Along the Nak-tong River, the Japanese saw an annual archery trial for military
    examinations, using straw mannikins set on boats in the river as targets.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At Fusan, the Japanese settlement was outside the town gates, Japanese residents
    were restricted to their quarters except for two annual temple visits, while Koreans
    could enter the Japanese concession to visit or trade.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Japanese travelers stayed in the house of the daimio of Tsushima, sailed
    to Tsushima, obtained Japanese clothes, reached Osaka, and returned to Echizen;
    one wrote an account of the adventures.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: One traveler stated that he saw a portrait of Yoshitsune in the palace at
    Peking, and the passage reports that some Japanese believed Yoshitsune fled Japan,
    landed in Manchuria, and became Genghis Khan.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage disputes a later claim that these men found a Japanese commercial
    factory in the capital, stating instead that the trading mart was at Fusan.
  category: speech
  evidence_refs:
  - ev:9
