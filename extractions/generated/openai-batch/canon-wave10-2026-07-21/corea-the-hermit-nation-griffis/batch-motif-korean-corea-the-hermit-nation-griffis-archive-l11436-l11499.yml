canonical_text:
  quote: ''
  summary: The passage describes beliefs and artistic imagery associated with the
    tiger and, at greater length, the riong or dragon. The tiger is credited with
    supernatural powers and appears on war-flags and objects. The dragon is described
    as a supernatural, transforming, water-associated creature connected with clouds,
    jewels, seasonal movement, rain, rivers, hidden treasures, undersea dragon-kings,
    and a pearl of healing and power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tiger is attributed powers of flying, emitting fire, and hurling lightning.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tiger is described as a symbol of strength and ubiquity, a standard of
    comparison for dangers and dreadful forces, and a paragon of human courage.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tiger is painted or embroidered on war-flags in many postures, appears
    on works of art and weapons, is associated with four supernatural beings, and
    was worshipped in ancient time.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The riong or dragon is described as one of four supernatural or spiritually
    endowed creatures.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dragon is described as embodying motion, change, offensive and defensive
    power, animal features such as fin, wing, tusk, horn, and claws, and attributes
    of the serpent.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dragon has many varieties, is called the chief of scaly monsters, and
    can transform or make itself visible or invisible at will.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The dragon ascends to the skies in spring and buries itself in watery depths
    in autumn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Corean artists depict the dragon in connection with water, clouds, or a sacred
    jewel guarded by the dragon and fought over by it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage links the dragon in Chinese philosophy with the third of four
    creative influences, the East, and springtime; it also identifies the blue dragon
    as guardian of the East.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The dragon can change size from that of a silkworm to filling heaven and earth,
    and can rise to the clouds or sink below the fountains of the deep.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The dragon is described as the embodiment of the watery principle of the atmosphere
    and as symbolizing moisture in fertilizing and destructive forms, from dew to
    tempest and from rill to tidal wave.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: 'Different dragon functions are listed: a celestial dragon guards heavenly
    mansions of the gods, a spiritual dragon makes wind and rain, a terrestrial dragon
    marks river and stream courses, and another dragon watches hidden treasures.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The treasure-associated dragon presides over mines and gems, and mortals must
    propitiate or overcome it to obtain metals and minerals from the earth.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Belief in the dragon is given as one reason that mines in Chosen are little
    worked and metals are little disturbed.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: Dragons pursuing invaders of their sanctuaries or fighting each other for
    jewel balls or sacred crystals are described as a favorite subject in art of Chinese
    parentage.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Four dragon-kings have palaces under the sea, each ruling one of the northern,
    eastern, southern, and western seas.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:17
  text: The ministers and messengers of the four dragon-kings are terrible dragons
    whose battles in air and deep cause commotion of the elements.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: The passage mentions a hornless dragon, a dragon that never ascends to the
    skies, and the yellow dragon as the most honorable of its tribe.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:19
  text: In common belief the dragon carries on its forehead a pear-shaped pearl with
    wondrous virtues of healing and power; whoever possesses these jewels will be
    invincible and the power of his descendants will endure.
  category: object
  evidence_refs:
  - ev:12
