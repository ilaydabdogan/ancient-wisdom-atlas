canonical_text:
  quote: ''
  summary: The passage describes Korean Buddhist temple settings, architecture, ritual
    objects, Buddha images, localized deity images, protective figures on battle flags,
    priestly roles, and the influence of Pung-sui on death and burial practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Korean Buddhist temples and monasteries are described as often situated on
    hills, rising ground, or high mountains, surrounded by venerable trees.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Temple approaches may include an imposing gateway, Chinese-character temple
    names, occasional Sanskrit letters or monograms, a prayer drum, a cash coffer,
    a well for ablutions, donor boards, and nearby houses for neophytes and bonzes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief idol in the temple is identified as Shaka Muni or Buddha, the founder
    of the religion.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Buddha image is described with a seated Nirvana posture, touching hands,
    a forehead mark, snails on the crown, pierced ears, and a lotus-flower throne
    called a symbol of eternity.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Indigenous heroes, sages, and gods are said to have been renamed and accepted
    by Buddhists as avatars or incarnations of Buddha in countries reached by Buddhism.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The god of war in Cho-sen is described as holding a double-bladed sword, wearing
    Chino-Corean armor and helmet, and having three fiery revolving thunder-clouds
    in the aureole around the head.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Battle-flags captured by American forces in 1871 had protecting deities painted
    or embroidered on them.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: One protective figure on a battle flag is described as riding a stunted piebald
    Hamkiung pony and may represent either a Buddha or a deified local hero such as
    Dan Kun or Ki Tsze.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The tutelary god on the horse is described with a winged head-dress, frilled
    collar, scaled or wave-pattern armor, Chinese-type shoes and saddle, and conventional
    clouds.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that Buddha and Shaka Muni's saints are portrayed according
    to strict orthodox canons, while indigenous deities allow artistic license and
    local color.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Priests or monks are said to produce much temple art and sculpture, and priests
    attend the sick or dying but have little to do with burial because of Pung-sui
    beliefs.
  category: action
  evidence_refs:
  - ev:8
