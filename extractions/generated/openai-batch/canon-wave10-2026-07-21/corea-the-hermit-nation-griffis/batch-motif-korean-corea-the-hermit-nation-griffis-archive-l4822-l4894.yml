  summary: A Chinese imperial letter is translated literally for Taiko despite Konishi's
    attempt to soften it, and its wording is received as an insult. Negotiations collapse,
    embassies return in disgrace, Korean and Chinese forces prepare against renewed
    Japanese invasion, and Japanese armies sail again. Chin Ikei, suspected of acting
    as a bribed intermediary for the Japanese, is trapped by Genkai's spies, imprisoned,
    and his household wealth is confiscated. The passage ends by stating that further
    negotiations cease and the war is decided by combat and siege.
  language: English
  quote_policy: summarized
