canonical_text:
  quote: ''
  summary: 'The passage gives two reported accounts of the General Sherman affair
    near Ping-an: one learned by Commander Febiger, describing insults, unlawful entry,
    seizure, robbery, local attack, fire-rafts, and the ship’s explosion; and another
    learned by Lieutenant Bernadon from native Christians, describing the Sherman’s
    arrival during rains, warning shots, grounding, fire-rafts, a white flag, drownings,
    and public execution of surviving prisoners.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Commander Febiger, in the U.S. steamship Shenandoah, surveyed the “Ping Yang
    Inlet” and learned a version of an earlier affair.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the version Febiger learned, a foreign vessel had arrived in the river
    two years before, and local officials boarded it and addressed two foreign officers
    respectfully.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The same version says the foreign officers insulted the local dignitaries
    by turning around and going to sleep, and a man identified as “Tonj,” a Frenchman,
    used violent and impolite language toward them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Coreans in the first account said they treated the visitors kindly but
    warned them of danger and of the unlawfulness of penetrating into or trading in
    the country.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the first account, the foreigners went up the river to Ping-an city, seized
    the adjutant-general’s ship, chained him, and robbed junks and their crews.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The first account says the people of the city attacked the foreign ship with
    firearms, cannon, fire-rafts, and hand weapons, and that the ship caught fire
    and blew up.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The narrator says American officers did not believe the first story, but also
    says suspicion of cruelty or insult by members of the General Sherman party could
    not be stifled.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: In Bernadon’s later account from native Christians, the Sherman arrived during
    heavy midsummer rains, was seen from the city walls, and caused great excitement.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Bernadon’s account, after waters subsided the governor sent officers to
    inquire about the ship’s mission, while common people also set out in many boats;
    the Sherman’s crew mistook this for hostility and fired guns in the air as a warning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In Bernadon’s account, when the river fell the Sherman grounded and careened;
    boats then approached with hostile intent, the ship fired on them, and enraged
    officers and people started fire-rafts.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bernadon’s account says the vessel burned while a white flag was hoisted;
    most who leaped into the river drowned.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Bernadon’s account says Tchoi-nan-un, identified as Rev. Mr. Thomas, explained
    the white flag and asked to be surrendered to China, but the request failed and
    all prisoners were later publicly executed.
  category: speech
  evidence_refs:
  - ev:5
