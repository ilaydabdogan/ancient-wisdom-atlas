canonical_text:
  quote: ''
  summary: Chinese ambassadors, accompanied by Chin Ikei, travel from Fusan to Nagoya,
    where Taiko receives them with lavish hospitality and a naval review. The mission
    has limited result, but Taiko orders Kato to release Corean princes and nobles;
    the Chinese envoys return to Peking with a Japanese ambassador. Taiko still intends
    to attack Cho-sen and orders the capture of Chin-chiu castle. Coreans try to provision
    and defend the fortress and attack the invaders, but are routed with heavy slaughter.
  language: English
  quote_policy: summarized
