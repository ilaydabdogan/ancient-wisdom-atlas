canonical_text:
  quote: ''
  summary: The passage frames China and Japan as mutually jealous neighboring powers.
    China is said to regard Japan as a young subordinate pupil or child, while Japan
    regards China as old and decayed and rejects Chinese claims of superiority. Japan
    is described as refusing vassal or tributary status, condemning a Japanese usurper
    who accepted the title King of Japan from the Chinese emperor, honoring the mikado
    with imperial and divine appellations, and nurturing ambitions to humble China.
    Hideyoshi is singled out as the Japanese figure who attempted this, planning to
    use Corea as a route into China after the Mongols had earlier used Corea as a
    departure point against Japan.
  language: English
  quote_policy: summarized
