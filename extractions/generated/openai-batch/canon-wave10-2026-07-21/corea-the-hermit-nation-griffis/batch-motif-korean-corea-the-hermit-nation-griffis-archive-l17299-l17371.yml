  summary: The passage describes Korea in 1888 as long shaped by China, with weak
    but emerging patriotic sentiment, political factions divided over Chinese influence
    and Western reform, reform-minded nobles risking death for new ideas, and the
    old regent plotting against treaties he associated with Christianity.
  language: English
