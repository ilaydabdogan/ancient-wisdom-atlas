canonical_text:
  quote: ''
  summary: 'The passage describes prescribed Korean mourning and burial practices:
    a corpse kept in a coffin and death-chamber, regulated mourning clothing and lamentation,
    offerings at the coffin, prolonged filial mourning at tombs, different practices
    among poor households, usual inhumation with known cremation, adult preparation
    rites including spirit-calling and offerings, funeral procession objects used
    to frighten spirits, and geomantic tomb-site selection. It also states that ancient
    Chinese rites survived in Korea and compares old Shanghai painted coffins to Korean
    coffins.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An official guide prescribes when and where mourners should weep, and the
    corpse is placed in a thick wooden coffin kept for many months in a prepared death-chamber.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before entering the death-chamber, the mourner puts on special mourning clothes,
    including a soiled gray cotton coat, rope-like girdle, head cord, dirty linen,
    sandals, and a knotty stick.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mourner enters the death-chamber at set times, places food beside the
    coffin, is prostrate and struck by the stick, and utters prescribed groans; public
    opinion is linked to the sound and length of mourning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Relatives are expected to join ceremonies at the new and full moon, and mourning
    practices may continue after burial for years, including kneeling at the tomb
    or building a small house before the grave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Poor households that cannot provide a death-chamber keep the coffin outside
    the house covered with mats until burial.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Cremation is known, but inhumation is described as the usual disposal of the
    dead; children and unmarried persons are buried wrapped in the clothes and bedding
    in which they died.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: For married adults, the passage describes washing, combing, nail-paring, robing,
    laying out in state, calling of spirits, screens, lights, offerings, and Confucian
    ritual.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says that some ancient Chinese rites survived in Korea after becoming
    obsolete in China, and that old painted coffins found near Shanghai are much like
    Korean coffins.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The coffin is made airtight with wax, resin, or varnish, borne on a bier by
    professional carriers, and sometimes consists of two coffins nested together;
    sons follow on foot and relatives ride.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A red funeral standard bears the titles, honors, or name of the deceased;
    its two points are said to frighten spirits, and at a high officer's funeral a
    masked man may serve the same purpose.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: A tomb site is selected with concern for time and money; geomancers are consulted,
    pung-sui is invoked for the comfort of living and dead, and burial is commonly
    associated with hillsides or mountains.
  category: setting
  evidence_refs:
  - ev:11
