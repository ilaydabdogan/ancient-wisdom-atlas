canonical_text:
  quote: The pivot of the future history of Eastern Asia is Corea.
  summary: A reported telegram lists conditions imposed on the Corean Government after
    unrest, including punishment of insurgents, indemnities, Japanese military presence,
    apology, and travel privileges. The passage then describes Chinese troop movement,
    the removal of the Tai-wen Kun to Tien-tsin, Japanese offers of volunteers and
    money, and the author's closing reflection that Corea is becoming central to the
    rivalry among China, Japan, and Russia.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Corean Government is reported to have pledged to arrest insurgents, punish
    them with Japanese delegates present at trial, bury murdered persons, compensate
    families, pay Japan indemnity, allow Japanese troops in Seoul, send an apology
    embassy, and expand privileges for Japanese residents, traders, and officials.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Chinese envoy, previously inactive with an escort, called a larger body
    of roughly three or four thousand troops to the capital.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Tai-wen Kun is described as the chief rebel and assassin and is reported
    to have been taken aboard a Chinese ship and carried to Tien-tsin; the passage
    says his departure was allegedly not voluntary.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The passage reports two explanations for the removal of the Tai-wen Kun:
    rescue from danger, or maintenance of a theory of sovereign control over Corea''s
    rulers.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Japanese Government is said to have received offers of military service
    from twenty thousand volunteers and money gifts worth 300,000 yen.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The narrator states that Corea ceases to be a 'hermit nation' and stands in
    the world's attention.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The narrator calls Corea the pivot of Eastern Asia's future history and says
    supremacy will be contested on Corean soil by China, Japan, and Russia.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says China has called Corea both her 'right arm of defense' and
    her 'gloved hand,' with the former image directed against Russia and the latter
    against Japan.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The narrator raises the possibility that China and Russia may collide, using
    the images of a dragon and a bear tearing each other in war in Corean valleys.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The narrator expresses hope that the integrity of the little kingdom will
    be preserved and that Christianity, science, education, and human brotherhood
    will replace paganism, bigotry, and superstition in Corea and Asia.
  category: speech
  evidence_refs:
  - ev:10
