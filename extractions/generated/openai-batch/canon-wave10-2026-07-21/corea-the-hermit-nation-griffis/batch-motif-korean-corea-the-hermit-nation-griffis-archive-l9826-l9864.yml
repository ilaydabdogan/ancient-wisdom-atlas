canonical_text:
  quote: ''
  summary: 'The passage describes Korean kinship and naming customs: the family is
    presented as part of a broader clan system, marriage is regulated by clan cognomen
    and place-origin name, men may have several personal names and aliases, women
    are described as having one lifelong name, common people often use nicknames,
    and etiquette forbids saying the names of certain close elders.'
