canonical_text:
  quote: ''
  summary: An officer and companions claim that the sick king can be healed only by
    a remedy made from a nose matching a sketch. They say the father of a son has
    such a nose and threaten to cut it off under government order. The son offers
    wealth to spare his father. The officer accepts a large sum, gives a receipt,
    warns the son to keep the matter secret, and departs. The son remains silent until
    his father's death, then says he bought his father's nose. The narrator adds that
    Cheng-chong was the Harun al Raschid of Corea.
  language: English
  quote_policy: summarized
