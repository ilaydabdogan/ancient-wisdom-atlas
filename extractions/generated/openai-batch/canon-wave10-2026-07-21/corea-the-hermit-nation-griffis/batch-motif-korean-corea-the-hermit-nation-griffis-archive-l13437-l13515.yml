canonical_text:
  quote: ''
  summary: The passage narrates the beginnings of Christianity in Corea as arriving
    from Rome and Peking rather than Japan. A student called Stonewall and other students
    encounter Jesuit writings during a secluded Confucian study gathering, begin prayer,
    fasting, and meditation, and seek further instruction from Peking. Senghuni travels
    to Peking, is baptized and named Peter, returns with religious materials, and
    Stonewall begins preaching in Seoul. Early converts receive baptismal names, and
    a note describes missionary texts and visual devotional objects brought back for
    different audiences.
  language: English
  quote_policy: summarized
