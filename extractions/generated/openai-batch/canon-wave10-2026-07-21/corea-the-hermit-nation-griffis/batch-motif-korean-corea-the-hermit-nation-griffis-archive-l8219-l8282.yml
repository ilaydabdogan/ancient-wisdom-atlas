canonical_text:
  quote: ''
  summary: The passage describes palace books and an ornate marble-tablet volume,
    the capital's curfew and night-watch signals, holidays when curfew is suspended,
    and a royal communication and espionage system involving commissioners, sealed
    orders, disguises, and a second night messenger who monitors the inspector. It
    also compares the curfew to England's old curfew and the spy system to Japan's
    ometsuke.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The palace collection includes illustrated books, an ancient history of Corea
    in sixty volumes, and a marble-tablet book with gold characters, silk protections,
    and nested copper and wooden cases.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The marble-tablet volume is said by some to contain moral laws, while a more
    probable opinion says it records honors accorded to kings of Corea by the Emperor
    of China; the Coreans value it highly.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A castle bell is struck at sunset, after which male citizens are not allowed
    to go out of their houses; those caught at night risk bastinado on their legs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Additional bell strokes, drum strikes, and brass cymbal sounds mark night
    hours when palace watchmen or guards are relieved, and sentinels change after
    giving the password.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The city garrison is divided into five portions, described as a modern form
    of the old division of Kokorai into five tribes or clans.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: On several listed holidays, the curfew law is suspended and people may be
    out freely at night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The monarch hears subjects' complaints, and communication between palace and
    populace is maintained through court pages, officers, and royal spies sent through
    the country.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: An Usa, also called the Messenger on the Dark Path, may be sent to a distant
    province to learn popular feeling or report on officials; he receives sealed orders
    that he must not open until beyond the city walls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Usa carries a silver commission plate engraved with a horse and may in
    some cases hold power of life and death.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A yashi, or Night Messenger, follows the royal inspector as his double and
