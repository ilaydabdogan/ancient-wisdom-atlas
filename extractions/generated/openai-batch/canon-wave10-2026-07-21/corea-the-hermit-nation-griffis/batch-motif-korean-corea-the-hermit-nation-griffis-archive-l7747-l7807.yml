canonical_text:
  quote: ''
  summary: 'The passage describes Korean appreciation of notable marine and mountain
    scenery, including picnics, travel to scenic sites, scholarly and poetic viewing,
    and monasteries or temples on mountain heights. It then lists several famed coastal
    views in Kang-wen/River-meadow province: sunrise from the ocean at Uru-chin, moonlit
    islands at Hion-hai, snow on pine or bamboo near San-cho, spring mist and greenery
    near Kan-nun, and sunset-tinted river scenery at An-an.'
  language: English
  quote_policy: summarized
