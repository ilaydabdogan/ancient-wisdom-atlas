canonical_text:
  quote: ''
  summary: A Dutch exile in Korea, Wetterree, survives long imprisonment and later
    interprets for Dutch survivors of the ship Sparwehr after it is wrecked off Quelpart
    Island. The survivors are received, guarded, punished for attempted escape after
    dogs betray them, and ordered toward Seoul. The narrator adds a comparative travel
    anecdote about dogs detecting Europeans in Tibet, China, Japan, and Korea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wetterree was treated with relative kindness and honor while kept prisoner;
    after his companions were killed during the Manchu invasion, he lived alone and
    nearly forgot his native speech before meeting other Hollanders after twenty-seven
    years of exile.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Dutch ship Sparwehr left Texel Island in January 1653 bound for Nagasaki,
    with Hendrik Hamel among the crew.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A storm off Quelpart Island wrecked the ship, and thirty-six of sixty-four
    crew members reached shore alive.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A local magistrate, described as an elderly man who knew a little Dutch, met
    the survivors and learned who they were; the Hollanders were refreshed with rice-water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Coreans collected pieces of the broken ship and burned them for metal; a loaded
    cannon discharged during the burning, and liquor casks from the wreck were emptied
    by wreckers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old leader punished some thieves by having them seized, spanked, or bambooed
    on the soles of their feet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Officials brought the survivors to be examined by Wetterree; he recognized
    them as countrymen by their physical appearance and recovered his native language
    after about a month with them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The captives wanted to escape and attempted at night to reach the sea-shore,
    but dogs barked and alarmed the guards.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrator reports similar incidents in which dogs barked at Europeans in
    disguise or at night in Tibet, China, Japan, and Korea.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the failed escape, the Hollanders were caught, punished severely, and
    ordered to proceed to Seoul.
  category: sequence
  evidence_refs:
  - ev:8
