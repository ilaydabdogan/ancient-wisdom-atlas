canonical_text:
  quote: ''
  summary: 'The passage describes Japanese preparations for the 1592 invasion of Korea:
    armies and fleets assemble at Nagoya/Karatsu; weapons, ships, banners, heraldic
    devices, Buddhist inscriptions, and provisions are detailed; the fleet sails westward;
    Taiko remains in Japan and appoints Konishi Yukinaga and Kato Kiyomasa as leaders,
    giving them a war horse and a battle flag.'
  language: English
  quote_policy: summarized
