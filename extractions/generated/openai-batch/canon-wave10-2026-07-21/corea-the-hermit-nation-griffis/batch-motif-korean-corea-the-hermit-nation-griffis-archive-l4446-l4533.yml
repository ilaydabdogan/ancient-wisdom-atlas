canonical_text:
  quote: ''
  summary: 'The passage narrates fighting during the retreat from Seoul: a conspicuous
    Japanese helmet is noted, the Chinese and Corean allies are beaten back, Li-yo-sun
    withdraws, and the Japanese occupy positions while wintering in the capital. It
    then describes the assault on the Corean stronghold of An-am, where defenders
    use the steep, narrow approach to rain arrows and stones on the Japanese before
    abandoning the castle at night. The narrative next describes famine, civilian
    deaths, an emaciated infant rescued by a Chinese captain, pestilence and hardship
    in the Japanese camp, guerilla raids, and the opening of peace negotiations involving
    captive princes, Konishi, Chin Ikei, and proposed terms for peace and withdrawal.'
  language: English
  quote_policy: summarized
