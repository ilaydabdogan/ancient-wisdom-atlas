canonical_text:
  quote: Corea was left the Issachar among nations.
  summary: The passage recounts the Manchu defeat of Ming-era rebels, the enthronement
    of a new emperor at Peking, and the annual tribute imposed on Cho-sen. It describes
    Korea as burdened between Manchu and Japanese demands, discusses the Manchu queue
    as a sign of loyalty imposed on Chinese subjects but not on Koreans, and narrates
    later reductions and exactions of tribute, investiture costs, ritual honors for
    a Manchu general, and a memorial gate for a Korean minister who resisted the Manchus.
  language: English
  quote_policy: quoted
