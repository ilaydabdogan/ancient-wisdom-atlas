canonical_text:
  quote: ''
  summary: The passage introduces the preliminaries of the 1866 French expedition
    to Korea through correspondence between M. de Bellonet and Prince Kung. Bellonet
    reports the killing of French bishops, missionaries, Korean priests, and Korean
    Christians, declares that France will punish Korea and treat the Korean throne
    as vacant, and rejects Chinese authority over Korea. The narrator criticizes Bellonet’s
    rhetoric, contrasts it with Prince Kung’s diplomacy, notes the burning of Kang-wa
    and the repulse of the invaders, and describes French reconnaissance up the Han
    River.
  language: English
  quote_policy: summarized
