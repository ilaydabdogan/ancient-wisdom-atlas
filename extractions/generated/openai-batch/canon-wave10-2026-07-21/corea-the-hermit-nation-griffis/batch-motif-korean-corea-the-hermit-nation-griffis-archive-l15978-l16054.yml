  summary: A U.S. survey fleet with armed steam-launches advances up a Korean river.
    The narrator argues that patience was needed and that Koreans could interpret
    the movement as invasion and treachery after peaceful assurances, especially because
    it resembled a prior French precedent. The fleet passes peaceful banks before
    forts, flags, troops, concealed guns, and a dangerous river bend appear at Kang-wa
    Island. After an ominous pause, a signal gun is fired and Korean batteries open
    fire on the boats.
