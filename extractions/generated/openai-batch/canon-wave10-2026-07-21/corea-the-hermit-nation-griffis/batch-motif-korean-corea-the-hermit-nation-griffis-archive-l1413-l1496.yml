canonical_text:
  quote: ''
  summary: 'The passage summarizes Hiaksai during the era of the Three Kingdoms: shifting
    warfare among peninsular states; Hiaksai''s rise as a center of Chinese letters
    and Buddhism; cultural transmission to Japan; conflict with Chinese dynasties,
    Kokorai/Korai, and Shinra; Tang conquest in 660; and a later restoration attempt
    led by a Buddhist priest, Fuku-shin, Japanese aid, and the royal heir Hosho.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes early peninsular state history as almost continuous
    civil war or border fighting, with boundaries changing through raids, reprisals,
    victories, and defeats.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hiaksai is described as having become the leading state in the peninsula in
    literary culture until it was crushed by China.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the classics of Confucius and Mencius, letters, and writing
    were first introduced to the peninsula in Hiaksai, and Ko-ken was appointed a
    teacher of Chinese literature in 374.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Buddhism was established in Hiaksai, including Marananda's establishment of
    temples and monasteries in 384, with women as well as men becoming scholastics.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says Hiaksai's literary and Buddhist influence reached Japan through
    Corean intermediaries, including Wani and a first missionary carrying Buddhist
    images and sutras across the Sea of Japan.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hiaksai defeated a Chinese army sent by a Wei emperor to enforce tribute,
    after which the emperor offered the King of Hiaksai the title of Great Protector
    of the Eastern Frontier.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In 660, Tang China sent a fleet and army in answer to Shinra's request for
    aid; Hiaksai was defeated, its capital surrendered, Tang banners appeared on the
    walls, and the state was absorbed into the Chinese empire.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In 670, a Buddhist priest raised an army of monks and priests and joined Fuku-shin
    to besiege a city held by a Chinese garrison.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The restoration leaders appealed to the emperor of Japan for aid and asked
    that Hosho, the youthful son of the late king and a hostage-pupil at the mikado's
    court, be invested with royal title and sent home.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The mikado sent a fleet of 400 junks and soldiers to escort Hosho home, and
    Hosho was proclaimed king on arrival.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The priest-army and Fuku-shin's forces reconquered nearly all their territory
