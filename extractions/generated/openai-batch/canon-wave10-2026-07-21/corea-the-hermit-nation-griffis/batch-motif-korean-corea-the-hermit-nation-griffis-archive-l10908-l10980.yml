canonical_text:
  quote: Hospitality is considered as one of the most sacred duties.
  summary: The passage describes Korean mutual aid, hospitality to strangers and travelers,
    communal rebuilding after disasters, and the social consequences of such generosity,
    including exploitation by beggars, itinerants, and wandering opportunists.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage attributes to Koreans an innate respect for human brotherhood,
    mutual assistance, and generous hospitality.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: At marriages and funerals, community members assist the affected family by
    making purchases, arranging ceremonies, or carrying messages without pay.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a house is destroyed by fire, flood, or another accident, neighbors contribute
    materials and several days of unpaid labor to rebuild; strangers entering a village
    are also assisted in building a dwelling.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hospitality is described as a sacred duty; refusing to share a meal with a
    person who appears at eating-time is said to be shameful, and even poor roadside
    laborers share food with passers-by.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A poor traveler with a simple outfit may enter an open exterior room of a
    house and receive rice, lodging, floor space, and a log used as a pillow; a short
    delay in departure is not strongly blamed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says this hospitable system produces or attracts beggars, tramps,
    blackmailers, and idle dependents who eat at rich families' tables, demand clothing,
    and may injure reputations if refused.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Peddlers, strolling players, astrologers, and similar itinerants are said
    to take advantage of hospitality, sometimes in bands large enough that government
    authority is invoked to protect villages.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Some men are described as spending money quickly when they have it, then wandering
    roads and villages in search of luck, treasure, ginseng, gold ore, crystal, or
    new ways to make money.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Strolling companies of mountebanks, players, and musicians, numbering five,
    six, or more, are described as wandering through the eight circuits in spring
    and summer.
  category: action
  evidence_refs:
  - ev:7
