canonical_text:
  quote: ''
  summary: A military narrative describes an allied army finding an evacuated castle,
    Japanese forces regrouping at Seoul, a surrender summons answered by Kato's defiance
    and killing of a Korean girl prisoner, Korean patriot detachments using explosive
    poison bombs to force a Japanese evacuation, a Japanese officer's suicide during
    a siege, and Kato's disciplined march to Seoul across rivers using felled trees
    and logs.
