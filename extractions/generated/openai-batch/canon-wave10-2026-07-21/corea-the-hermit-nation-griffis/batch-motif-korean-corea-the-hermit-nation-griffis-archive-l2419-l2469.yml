canonical_text:
  quote: ''
  summary: The passage describes violence and pursuit in Japan, then contrasts Korean
    voluntary immigrants who integrated into Japanese society with prisoners and impressed
    laborers who were segregated and associated with the Eta outcast group. It then
    summarizes Korea-Japan relations from the ninth to nineteenth centuries, portraying
    Korea as a former bridge for civilization from China to Japan and as a likely
    migration pathway for ancestors connected with Puyu, the Sungari, and the Ever-White
    Mountains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed group killed many Japanese, seized rice from storehouses, put to
    sea, and was pursued and attacked by people from Musashi and Sagami.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Korean voluntary immigrants in peacetime are described as mostly skilled workmen
    or farmers who settled on granted lands or in villages and were placed on political
    and social equality with the mikado's subjects.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same voluntary immigrants are said to have founded industries, intermarried
    with natives, and lost separate identity within the Japanese population.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Prisoners taken in war and laborers impressed into service were carried off
    by force and set apart in villages by themselves, without social equality with
    the people.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage connects this segregated group with menial work, the feeding of
    imperial falcons, butchery, skinning, leather-making, and handling corpses or
    other defiling things.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: An 1868 edict of the mikado is said to have granted the Eta group rights of
    citizenship and improved their social condition.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: From the ninth to sixteenth centuries, the passage says Korea-Japan relations
    were comparatively unimportant while Japan turned northward and toward direct
    political and religious intercourse with China.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage portrays nineteenth-century Japan as recognizing its former condition
    in Korea and extending help to Korea in return for what Korea had earlier done
    for Japan.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Korea is described as the bridge by which civilization crossed from China
    to the Japanese archipelago and as the probable migration pathway by which ancestors
