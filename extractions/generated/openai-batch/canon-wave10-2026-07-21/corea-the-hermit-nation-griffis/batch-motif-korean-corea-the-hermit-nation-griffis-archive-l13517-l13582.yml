  summary: The passage describes early Korean Roman Catholic converts adopting foreign
    Christian names, opposition from literati, the spread of the faith through teachers
    and copied or translated books, the first persecution and martyrdom narrative,
    a lay-created hierarchy modeled on Peking, and later correction of that hierarchy
    after inquiry to Peking.
