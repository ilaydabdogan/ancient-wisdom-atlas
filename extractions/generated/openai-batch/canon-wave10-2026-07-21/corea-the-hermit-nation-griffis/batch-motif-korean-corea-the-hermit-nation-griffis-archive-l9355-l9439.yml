canonical_text:
  quote: ''
  summary: The passage describes Korean marriage customs, including the wedding feast,
    a written certificate of wedlock, hand-tracing as a signature, prostrations and
    oaths of fidelity, birds and monuments as models or memorials of conjugal constancy,
    women's nighttime freedom in Seoul, and protected women's quarters. It then recounts
    an anecdote in which a noble substitutes his niece for his daughter in a wedding
    after unfavorable divination about the groom, later substitutes his daughter after
    finding the groom desirable, confesses the deception, and is outmaneuvered when
    the groom claims both women under marriage and concubinage rules.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wedding feast begins after the marriage rites, and the hon-se-chi certifying
    wedlock is signed by both parties.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a woman cannot write, she makes a mark by tracing the outline of her
    hand, wrist, palm, and fingers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A groom may make four prostrations signifying fidelity to the bride and may
    give the father-in-law a written oath of constancy to his daughter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The pong-hang bird is held up to a wife as a model of conjugal fidelity, and
    the ching-Mong bird is said never to remate after its consort dies.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Widows are expected to imitate the ching-Mong bird, and vermilion arches or
    gateways are erected for widows remembered for marrying only once.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Married women wear two rings on the ring finger, and a golden wedding is celebrated
    after sixty years, described as a cycle and ideal length of marital life.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: In Seoul, a curfew forbids males from being outside after eight o'clock in
    the evening, while women may be abroad until one a.m.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Violation of the curfew brings severe penalty, and violation of the privacy
    of women's quarters indoors is punishable by exile or severe flagellation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A noble wished to marry both his own daughter and his deceased brother's daughter,
    but especially wished his own daughter to marry well.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the noble had pledged his word for a marriage, diviners reported that
    the chosen young man was silly, ugly, and ignorant; the noble believed he could
    not withdraw because the law was inflexible once his word was given.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: On the marriage day, the noble ordered his niece rather than his daughter
    to wear the marriage coiffure and wedding dress and mount the nuptial platform.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The bride substitution was easy because the cousins were about the same height,
    and the ceremony proceeded according to usual forms.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: After meeting the groom, the noble found him good-looking, well formed, intelligent,
    highly educated, and amiable, contrary to the diviners' report.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: The noble then secretly ordered that his own daughter, not his niece, be introduced
    as the bride, relying on the fact that brides were muffled in dress and ornaments
    during salutations.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The noble later revealed the diviners' reports and the successive substitutions
    of niece and daughter to the young man.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: 'The young man answered that both young women belonged to him: the niece as
    lawful wife because she made the legal salute, and the daughter as concubine because
    the noble introduced her into the marriage chamber.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: The two young women were conducted to the house of the new husband, and the
    old noble was mocked for lack of address and bad faith.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
