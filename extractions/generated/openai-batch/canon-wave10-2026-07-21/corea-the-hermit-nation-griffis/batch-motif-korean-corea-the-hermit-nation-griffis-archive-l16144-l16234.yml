  quote: ''
  summary: A historical military narrative describes a night attack on American pickets,
    a secret approach by native Christians seeking missionaries and later burning
    their boat to avoid detection, the American destruction and dismantling of Korean
    forts, a difficult march through hills and rice fields, and preparations to assault
    a key hilltop citadel held by determined defenders described as tiger-hunters.
  language: English
