  summary: A historical account describes U.S., Chinese, Japanese, and Korean actors
    during efforts to open Korean ports and reform Korean policy in 1881-1882. It
    contrasts reformist study missions and foreign training with anti-foreign Confucian
    protest, including symbolic mourning, an axe-token of risk, petitions, palace
    placards, and authorial classical comparisons to Cerberus, Hades, and Peter the
    Great.
  language: English
