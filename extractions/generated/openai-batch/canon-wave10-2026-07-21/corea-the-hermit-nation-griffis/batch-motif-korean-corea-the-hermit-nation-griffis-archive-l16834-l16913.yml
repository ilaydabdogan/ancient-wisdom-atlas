- id: obs:3
  text: A group of thirty-four prominent men of the civilization party, led by Gio
    Inchiu and Kio Yeichoku, left Seoul to visit Japan and study whether Western ideas
    suited an eastern state.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ultra-Confucianists headed by Ni Mansun opposed opening a port near the capital
    to Japanese commerce and treating with Americans.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ni Mansun gathered seven hundred followers, dressed in mourning, bore an axe-figure
    on his shoulders, presented a memorial to the king, sat seven days before the
    palace, and demanded that In-chiiin not be opened, the two Bin be deposed, and
    innovations cease.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Country people came to Seoul with petitions and protestations, and placards
    near palace gates predicted harmful effects of the West on a country described
    as favored by spirits.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Two thousand literary men assembled at Cho-rio to go to Seoul against progressive
