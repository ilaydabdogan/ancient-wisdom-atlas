canonical_text:
  quote: ''
  summary: 'Historical narrative of a Chinese campaign against Korai: a large Koraian
    field army is defeated, but the fortified city of Anchiu continues resistance.
    The passage generalizes that Coreans are weak in open battle but exceptionally
    brave behind walls, explains a defensive policy based on fortified cities and
    difficult terrain, recounts the Chinese retreat, notes an honor gift of silk to
    the Koraian commander, and describes the collection and native burial of Chinese
    soldiers'' bones with sacrificial rites.'
  language: English
  quote_policy: summarized
