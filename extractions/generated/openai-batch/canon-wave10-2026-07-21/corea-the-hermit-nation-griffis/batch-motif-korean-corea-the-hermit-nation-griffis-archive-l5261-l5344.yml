canonical_text:
  quote: ''
  summary: A warning announces the approach of a Ming army to Uru-san Castle. The
    Japanese defenders prepare while one captain secretly flees. The Ming attack uses
    a decoy retreat to lure a sortie into encirclement, followed by repeated assaults
    on the castle. Japanese leaders continue organizing defense despite wounds and
    starvation; one commander burns outside camps, and Kato enters by sea after an
    oath-bound appeal for aid. The besiegers repeatedly attack with shields, weapons,
    arrows, ladders, and bamboo hurdles. The defenders suffer heavy casualties, severe
    cold, hunger, and emaciation, with one warrior compared to a hungry demon from
    temple pictures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A board warns that the Chinese are near and will soon attack Uru-san; after
    receiving it, a captain declares himself sick and secretly goes to Fusan, while
    Japanese forces gather near or inside the castle and sentinels are doubled.
  category: sequence
  evidence_refs:
  - ev:1
