  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Asano sends to Kato for help; a messenger rides for two days, and Kato, recalling
    an oath to Asano's father, enters the castle by sea with seventy picked companions
    in seven boats.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: On January 31 the war-conch sounds in the Ming camp as an attack signal, followed
    by the yells of the besiegers, clouds of dust, and ranks of men twenty deep visible
    around the castle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Attackers use shields shaped like fowls' wings, then throw the shields away
    in the ditch and use axe, knife, sword, and lance; seven attacks are repulsed,
    but the wall is breached, the outer works are gained, and the garrison is driven
    into the inner enclosure.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Subsequent assaults use showers of arrows, ladders, and bamboo hurdles; seven
