- id: obs:3
  text: A small detachment, described as a decoy and forlorn hope, attempts to scale
    the walls, is driven back by matchlock men, and begins to retreat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Japanese open the barbican gate and pursue, then discover that they have
    been lured into encirclement by a large host.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Black and yellow standards and tactics identify the enemy as Ming soldiers;
