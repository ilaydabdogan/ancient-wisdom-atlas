canonical_text:
  quote: ''
  summary: At the close of a three-wish tale, an old couple cannot pull a sausage
    from the woman's nose. After the woman attempts to strangle herself, the husband
    lets her choose the final wish; she wishes the sausage loose. It falls, an angry
    voice from heaven rebukes their vain wishes and teaches contentment, and the couple
    eats the pudding. The next day they find and adopt an orphan child and live happily
    to old age.
  language: English
  quote_policy: summarized
