  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Father Gregorio de Cespedes and the Japanese convert Foucan Eion were dispatched
    to the army in Cho-sen, wintered in Tsushima, and reached Corea in spring 1594
    at Camp Comangai, Konishi's headquarters.
  category: sequence
  evidence_refs:
  - ev:2
