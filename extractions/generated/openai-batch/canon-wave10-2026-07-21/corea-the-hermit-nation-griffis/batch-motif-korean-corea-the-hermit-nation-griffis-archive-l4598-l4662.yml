canonical_text:
  quote: ''
  summary: The passage describes Konishi requesting a Jesuit chaplain during the Japanese
    campaign in Corea, the dispatch of Father Gregorio de Cespedes and a Japanese
    convert, their preaching and sacramental work among Japanese soldiers, the deathbed
    use of crucifix and Christian consolation, Kato's denunciation of the mission
    as conspiracy, Konishi's return to clear himself, and the later Christian education
    and baptism of a Corean youth named Vincent.
  language: English
  quote_policy: summarized
