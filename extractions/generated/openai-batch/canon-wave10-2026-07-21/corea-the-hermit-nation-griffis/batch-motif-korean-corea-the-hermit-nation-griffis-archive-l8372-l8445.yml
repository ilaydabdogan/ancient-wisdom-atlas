    historical relationship or mythological comparison.
- id: claim:2
  claim: The passage compares the stated purposes and office-seeking motives of Korean
    factions with parties in European countries and the United States.
  claim_level: same_function
  target: European and United States political-party patterns
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is functional and political; it does not establish shared
    origin, direct contact, or a mythic motif.
- id: claim:3
  claim: The passage invokes a Romeo-and-Juliet analogy only to say that this political
    dispute does not become a hereditary feud that prevents marriage.
  claim_level: same_motif
  target: Romeo-and-Juliet family feud and obstructed lovers pattern
  evidence_refs:
  - ev:8
  counter_evidence_refs:
  - ev:8
  confidence: low
  limitations: This is a negative literary allusion; the passage states that Korean
    holders of opposing views may marry without danger, so the target pattern is explicitly
    not operative.
