canonical_text:
  quote: ''
  summary: The passage describes the emergence and persistence of Korean political
    factions, their relation to succession politics, a contested royal accession involving
    a murdered courier, allegations against Yeng-chong, and the death of Prince Sato
    in a sealed wooden chest by royal command, followed by ongoing factional dispute
    over his posthumous status.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a Western party noble named Yun died, a young man composed an epitaph;
    his tutor disliked it and proposed another, producing a literary controversy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Western party split into the Sho-ron and No-ron, connected with adherents
    of the pupil and master; the terms are glossed as old and young, or conservative
    and progressive/radical, and the total number of parties became four.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The four parties, called Shi-seik, are said to continue in existence; nobles
    are attached to parties, while some trimmers change sides with political advantage.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The factions nominally aim to advance the country, but are also described
    as seeking offices, appointments, and dignities for their adherents.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The parties rally around actual or possible heirs to the throne, and political
    activity intensifies during uncertain succession, selection of a queen or concubine,
    or ministerial vacancies.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: During King Suk-chong's reign, with no son to succeed him, the four parties
    coalesced into Opposition and Court/royal parties backing different succession
    claims.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Opposition secretly sent a courier to Peking to obtain imperial investiture
    for the king's brother, while the other party sent assassins who murdered the
    courier before he crossed the frontier.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Yeng-chong, the Opposition nominee and brother of the childless king, mounted
    the throne after his brother's death and reigned from 1724 to 1776.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Yeng-chong is described as an able ruler who abolished many legal tortures,
    especially branding, while also being characterized as personally cruel and unscrupulous.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Public rumor credited Yeng-chong with using drugs to prevent his brother from
    having an heir and then poisoning him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: After becoming sovereign, Yeng-chong sent many members of the opposite party,
    whom he knew as enemies, to execution at the block.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After his eldest son died, Yeng-chong nominated his second son, Sato, as heir
    and associated him with himself in the government.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Prince Sato urged his father to forget hatred against the Si-pai party, proclaim
    general amnesty, and adopt reconciliation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The king, irritated by Sato and encouraged by his partisans, resolved to remove
    him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: By royal command, a huge wooden chest was made; Sato was ordered to sleep
    in it, the lid was placed on during one of his sleeps and sealed with the royal
    seal, the chest was covered with leaves and boughs, and Sato was smothered.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The prince's party demanded that his name be enrolled among sovereigns; opponents
    refused, and the question is described as still politically active.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: The dispute over the smothered prince is said not to function as a hereditary
    feud or prevent marriage between people holding different views.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:18
  text: The Piek-pai are characterized as radical and fiery, while the Si-pai are
    characterized as conservative and conciliatory.
  category: attribute
  evidence_refs:
  - ev:8
