candidate_motifs:
- id: motif:1
  label: minor literary dispute becomes lasting political factional division
  taxonomy_refs: []
  basis: The passage traces a dispute over an epitaph to the splitting of the Western
    party into Sho-ron and No-ron and the existence of four political parties.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is a political-historical pattern, not a mythic or ritual episode.
- id: motif:2
  label: factions rally around uncertain royal succession
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage states that parties rally around actual or possible heirs and
    become especially active when succession is uncertain.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The evidence is descriptive political history rather than mythic narrative.
- id: motif:3
  label: external investiture sought to secure contested throne
  taxonomy_refs:
  - royal_legitimacy
  basis: The Opposition secretly sends a courier to Peking to obtain imperial investiture
    for its nominee, while the opposing faction attempts to prevent this by assassination.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The episode concerns diplomacy and succession; no sacred investiture rite
    is described beyond the political authorization.
- id: motif:4
  label: dynastic violence attributed to the path to kingship
  taxonomy_refs:
  - royal_legitimacy
  basis: Public rumor credits Yeng-chong with preventing his brother from having an
    heir and poisoning him before mounting the throne.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage explicitly frames the accusation as public rumor, so the event
    is not presented as confirmed fact.
- id: motif:5
  label: royal heir killed by confinement in a sealed chest
  taxonomy_refs: []
  basis: Prince Sato is ordered into a wooden chest, sealed under the royal seal while
    sleeping, covered, and smothered by royal command.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage presents this as political murder; no rebirth, sacrifice,
    or initiation function is stated.
- id: motif:6
  label: posthumous recognition of a dead prince as factional legitimacy dispute
  taxonomy_refs:
  - royal_legitimacy
  basis: Sato's supporters demand that his name be enrolled among sovereigns, while
    opponents refuse, making the issue a continuing political dividing point.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is a historical legitimacy dispute; the passage does not present
    a supernatural claim.
