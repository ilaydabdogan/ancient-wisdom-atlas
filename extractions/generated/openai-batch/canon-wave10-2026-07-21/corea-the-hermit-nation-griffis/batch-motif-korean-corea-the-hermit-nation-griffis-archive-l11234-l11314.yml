canonical_text:
  quote: ''
  summary: 'The passage describes Korean lifecycle and calendrical observances: the
    sixty-first birthday feast called Wan-kap, rare sixty-first wedding anniversary
    celebrations, royal birthday ceremonies, New Year cessation of work and ancestor
    sacrifices, annual house-cleaning and tomb-cleaning days, and spring outings on
    the third day of the third month.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wan-kap is described as a sixty-first birthday observance kept by all social
    classes and as the point at which old age definitely begins.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sixty-first wedding anniversary with both spouses alive is described as
    rare and marked by extraordinary rejoicing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Children and friends of the honored aged person are expected to provide clothing,
    wine, food, entertainment, and hospitality for all comers, even at great financial
    cost.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A royal sixty-first birthday is described as involving amnesty, examinations
    for degrees, gifts and homage before the king, rural prostrations before the king's
    picture or effigy, court gifts to soldiers, and a national holiday.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says officials use festivals as means of extortion and oppression
    to provide resources for the capital and court.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: New Year's day is described as the greatest Korean feast, a period when regular
    employments cease, debts and accounts are settled, absent people return, children
    rejoin the family, tribunals close, arrests cease, and some prisoners receive
    temporary leave.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: On New Year's morning, calls are made on friends, acquaintances, and superiors,
    and the chief ceremony is sacrifice at ancestral tablets, tombs, or a household
    place, with family prostrations and incense ceremonies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the ancestral sacrifices, presents enclosed in New Year's boxes are
    distributed, and festivities continue for five days before ordinary labor resumes
    on the sixth day for many people.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The tenth day of the second month is described as the annual house-cleaning
    day, when mats, vessels, and clothing are cleaned or renovated.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Tomb-cleaning day in the third month includes food offerings to ancestors
    and cleaning of tombs, tablets, monuments, and idols.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The third day of the third month is described as a spring merrymaking day,
    with people feasting on the river, viewing peach blossoms, and composing poetry.
  category: action
  evidence_refs:
  - ev:10
