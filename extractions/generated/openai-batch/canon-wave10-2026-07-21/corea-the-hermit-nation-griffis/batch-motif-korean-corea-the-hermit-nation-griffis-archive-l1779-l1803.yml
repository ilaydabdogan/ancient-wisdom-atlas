  summary: The passage recounts the Chinese conquest of Korai after the fall of Hiaksai,
    the death of Korai's powerful prime minister, a succession dispute in which a
    brother fled to China and guided invading forces, the defeat and surrender of
    Korai, the end of its royal line, annexation to the Chinese empire, refugee flight
    to neighboring regions, devastation of the land, and the resulting supremacy of
    Shinra in the peninsula.
