canonical_text:
  quote: ''
  summary: The passage describes shamanism as involving fetishes, ancestral images,
    spirits of earth and air, sorcery, and sacrificial propitiation of evil spirits.
    It says malignant beings are believed to inhabit earth, clouds, and air, cause
    many human ills, and appear in animal or composite animal forms. It identifies
    certain gentle mythic creatures as auspicious apparitions, names phoenix, kirin,
    dragon, tortoise, and demons, compares Korean mythology with Chinese Asia, and
    introduces the tiger as a real animal idealized by Koreans with supernatural powers.
  language: English
  quote_policy: summarized
