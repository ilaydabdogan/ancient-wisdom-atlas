canonical_text:
  quote: ''
  summary: 'The passage surveys Korean popular religious practices and beliefs: worship
    of natural and local deities, mountain pilgrimage with stone piles, tree/rain/harvest/kitchen
    spirits, a spirit-filled atmosphere with demons and sorcery, unlucky days and
    sacrifices, Pung-siu geomancy with bells and mounds, and ancestor worship using
    tablets, incense, and sacrifice.'
