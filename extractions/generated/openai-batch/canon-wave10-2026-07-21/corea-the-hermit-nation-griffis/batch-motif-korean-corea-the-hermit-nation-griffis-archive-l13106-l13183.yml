  quote: CoREA  received  her  culture  from  China,  and  gave  it  freely  to Japan.
  summary: The passage describes the transmission of Chinese culture and learning
    to Corea and from Corea to Japan; the restriction of education to elites; the
    role of Buddhism in spreading learning among common people through vernacular
    preaching, images, scrolls, and religious literature; and the attributed development
    of Korean writing systems, including Nido and Unmun, with Sanskrit and Buddhist
    missionary influence noted.
