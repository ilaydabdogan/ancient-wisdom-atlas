canonical_text:
  quote: ''
  summary: 'The passage describes post-invasion changes in Korea: embassies to Japan
    became costly ceremonial visits funded by the Japanese hosts; tobacco became a
    widespread habit after Japanese introduction; cotton cultivation and clothing
    are discussed, including a tradition that cotton seeds were secretly obtained
    from China by a Korean embassy member and concealed in a hat feather. The narrator
    explicitly compares this seed-concealment story to a traditional account of silkworm
    eggs carried from China to Constantinople inside a staff.'
  language: English
  quote_policy: summarized
