canonical_text:
  quote: ''
  summary: The passage recounts an anecdote in which a legally married wife asserts
    household rank, compels recognition from servants and male kin, and is later praised
    by the king, after which her husband grants her court dignity. It then explains
    social consequences of legal marriage, kinship rank, widow remarriage prohibitions,
    stigma on children of remarried widows, dangers faced by young widows, widow suicide
    to preserve honor, royal memorials for such women, and Christian widows asking
    missionaries about suicide under threat of violation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The lady calls the household slaves, declares herself the mistress, faults
    them for failing to receive her, and pardons them for that occasion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two daughters-in-law present themselves ashamedly, make excuses, are gently
    rebuked, and are exhorted to perform their duties more scrupulously.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The lady summons male household kin from the men's apartments, rebukes them
    for not saluting her, and orders a slave to strike their legs with a rod.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The minister is obliged to salute his wife; later the king judges that the
    minister treated her unjustly, praises her conduct, and the minister confers a
    high court dignity on her.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: A legally espoused woman, whether previously a widow or slave, is said to
    enter and share her husband's entire social estate, and her children share that
    resulting status.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that marriage relations can alter elder and younger sister
    status, and that this distinction affects life, position, and treatment in Chinese
    Asia.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Widow remarriage is described as improper and infamous in higher classes,
    and children of remarried widows are described as excluded from examinations and
    official employment and regarded as illegitimate.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Young noble widows who cannot remarry are described as sometimes becoming
    concubines, being drugged, being abducted at night by hired bandits, or becoming
    victims of violence without remedy.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Some young widows are described as committing suicide after a husband's death
    to prove fidelity and preserve honor; such women are praised and may receive royal
    memorials.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Christian widows are described as asking missionary fathers for permission
