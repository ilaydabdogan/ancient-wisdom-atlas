canonical_text:
  quote: ''
  summary: Historical account of the end of a short-lived Liberal Government, reprisals
    after the December affair, diplomatic settlements among Corea, Japan, and China,
    withdrawal of troops, Tai Wen Kun's return, and the later establishment of American
    medical, educational, and Protestant Christian institutions in Seoul, framed by
    the author as a providential opening.
  language: English
  quote_policy: summarized
