canonical_text:
  quote: ''
  summary: The passage recounts Khublai Khan’s attempted conquest of Japan through
    diplomacy and two Mongol-led invasions involving Chinese, Mongol, and Corean forces.
    Both invasions fail amid Japanese resistance, operational disorder, and destructive
    tempests; the aftermath includes intensified Corean-Japanese hostility, Japanese
    piracy, coastal defenses, and a national fire-signal warning system.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that communications between Europe and East Asia ceased
    after Islam closed the overland route, and Cathay, Zipangu, and Corea disappeared
    from European view.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Khublai Khan resolved in 1266 to conquer Japan and sent diplomatic approaches
    before preparing military expeditions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A first armada of 300 vessels and 15,000 Chinese, Mongol, and Corean men sailed
    to Japan, with some ships built on Quelpart Island.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first expedition was met off Iki by Japanese defenders and was almost
    entirely lost, with the passage attributing the loss more to a tempest than to
    Japanese valor.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A later embassy reached the shogun’s court rather than the mikado’s court;
    threatening letters were ignored, and another ambassador was imprisoned for years
    and beheaded.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Khublai prepared a much larger 1281 invasion whose fleets and contingents
    rendezvoused on the Corean coast and included large war junks and catapults.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The 1281 enterprise failed after the commander became ill, forces separated,
    Japanese defenders drove back a landing force with sword and fire, and a tempest
    nearly annihilated the Chinese division.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says Mongol rule or civilization left little recognizable influence
    on Corea, while forced Corean assistance to the Mongols intensified Corean-Japanese
    hatred.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the Mongol invasion period, Japanese adventurers and pirates captured
    Corean vessels, raided coasts, robbed and murdered coastal people, and reached
    the Yellow Sea, China, and Liao Tung.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Fire-signals formerly used on headlands in the Three Kingdoms period were
    made into a national service converging at Sunto to warn of coastal danger.
  category: object
  evidence_refs:
  - ev:8
