canonical_text:
  quote: ''
  summary: The passage recounts U.S. attempts in 1867 to investigate the General Sherman
    affair in Korea. The Wachusett anchors at the wrong estuary, sends a demand for
    the accused killers, surveys the area, hears local accounts that the crew was
    killed by common people rather than officials, and leaves after a fruitless interview
    with a Korean officer. Additional accounts gathered by S. Wells Williams describe
    the Sherman grounding, an altercation, a mob attack, and later reports of the
    wrecked hull. A footnote proposes that prior Chinese pirate attacks may have influenced
    Korean reactions to Chinese crewmen aboard an armed foreign vessel. Rumors of
    surviving imprisoned crewmen lead to another dispatched vessel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Wachusett left Chifu on January 21 and anchored on January 23 at a large
    inlet opposite the Sir James Hall group.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The expedition mistook that estuary for the Ta Tong River leading to Ping-an
    city, but the passage states that the vessel was half a degree too far south.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A letter was sent through the official of Cow Island to a nearby city prefect,
    demanding that the murderers from the Sherman affair be produced on the deck of
    the Wachusett.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the five-day wait for an answer, surveying boats met natives who reportedly
    said the Sherman's crew had been murdered by the people and not through official
    instigation.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A footnote states that Chinese pirates frequently raided the coast, that several
    natives had been killed by such pirates near the Wachusett's anchorage the previous
    year, and that the presence of Canton Chinese crewmen on an armed vessel may have
    inflamed Korean revenge.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: An officer from a village in the district appeared and held an interview with
    Commander Shufeldt; the passage says the officer's presence inspired dread among
    the people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The interview produced neither information nor satisfaction for the American
    side; the Korean message is summarized as an instruction to go away as soon as
    possible, after which Shufeldt departed under orders and because of weather.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A member of the Korean embassy told S. Wells Williams that the Sherman grounded,
    careened as the tide receded, the crew landed, natives gathered, an altercation
    led to blows and bloodshed, and a general attack killed every foreigner and about
    twenty natives.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Williams commented that the evidence supported the presumption that the Sherman
    crew brought on their fate through some rash or violent act toward the natives.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Yu Wautai, described as a Chinese pilot, reported seeing the hull of a foreign
    vessel on the south bank of the river about ten miles from the sea; the hull was
    full of water.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: A Korean from Sparrow Island reportedly told Yu Wautai that the killing of
    the Sherman's crew was the work of the people and farmers, not magistrates or
    soldiers.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Because reports circulated that two or more members of the Sherman crew were
    still alive and in prison, Admiral Kowan dispatched another vessel in May 1867;
    this vessel entered the correct river.
  category: action
  evidence_refs:
  - ev:8
