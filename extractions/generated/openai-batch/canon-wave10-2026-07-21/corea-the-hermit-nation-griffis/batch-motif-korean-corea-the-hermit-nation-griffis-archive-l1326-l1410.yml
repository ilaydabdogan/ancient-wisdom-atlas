  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage lists Shin-han practices including mulberry cultivation, silkworm
    rearing, silk weaving, use of wagons and draught animals, ceremonial marriage,
    dancing, drinking, singing, lute and drum music, iron working, iron money, and
    trade.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A custom of flattening the heads of newborn infants is noted among the Shin-han
    people.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage states that Chinese history and Japanese tradition do not explain
