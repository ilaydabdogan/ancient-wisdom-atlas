- id: obs:1
  text: After the fall of the Tsin dynasty, a small group of refugees left China,
    crossed the Yellow Sea toward the Sea of Japan, passed beyond a great mountain
    chain, and settled in valleys and on the sea-coast.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The settlers are described as initially preserving their blood and language
    and forming one of twelve clans or tribes in the country.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The Shin tribe is said to have extended its authority and boundaries and,
    under its twenty-second hereditary chief or king, changed the country’s name to
    Shinra, also rendered Sinlo in Chinese pronunciation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Between 29 and 70 CE, according to Japanese histories, an envoy from Shinra
    came to Japan and presented the mikado with mirrors, swords, jade, and other skilled
    works.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage reports Chinese historical notices of refined manners, hereditary
    aristocracy, and fortified strongholds among the Shinra people.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Shin-han people are described as living in palisaded cities and in houses
