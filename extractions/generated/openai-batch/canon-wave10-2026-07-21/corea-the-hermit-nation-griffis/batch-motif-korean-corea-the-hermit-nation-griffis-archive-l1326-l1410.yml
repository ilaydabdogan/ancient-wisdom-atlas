canonical_text:
  quote: ''
  summary: The passage describes Shin-han/Shinra as arising from Chinese refugees
    or colonists who crossed the sea into the Korean peninsula, settled in valleys
    and along coasts, expanded into a powerful polity, exchanged prestige goods with
    Japan, and developed urban, textile, musical, metallurgical, commercial, and social
    customs. It also discusses the unclear origin of the peninsula’s aborigines, the
    terminology of Sam-han and the Three Kingdoms, and an analogy between the Korean
    Three Kingdoms and Britain’s historic kingdoms.
  language: English
  quote_policy: summarized
