  summary: The passage describes United States efforts in 1878-1880 to pursue a peace
    and commerce treaty with Corea, with Japan offering assistance. Senator Sargent
    proposed a resolution for President Hayes to appoint a commissioner, but no action
    followed. Later, Commodore Shufeldt on the U.S. steamship Ticonderoga sought to
    advance treaty papers through the Japanese consul at Fusan toward Seoul.
