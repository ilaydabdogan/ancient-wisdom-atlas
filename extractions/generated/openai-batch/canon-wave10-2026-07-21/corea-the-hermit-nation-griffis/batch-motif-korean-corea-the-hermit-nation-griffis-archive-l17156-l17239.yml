  summary: The passage narrates Hanabusa and a Japanese party escaping attacks in
    Seoul, crossing a river in stormy weather, receiving temporary aid at In-chittn,
    enduring another attack, fleeing by road and sea, being taken aboard the British
    gunboat Flying Fish, commemorating slain comrades, and later returning under Japanese
    military and diplomatic pressure to obtain apologies and agreement to demands.
