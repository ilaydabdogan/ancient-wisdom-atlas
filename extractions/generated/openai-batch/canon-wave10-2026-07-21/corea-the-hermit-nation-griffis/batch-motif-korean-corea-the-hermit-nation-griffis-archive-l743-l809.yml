canonical_text:
  quote: ''
  summary: A Chinese envoy demands that Yukio of Cho-sen render homage to the Chinese
    emperor. After failed diplomacy, the envoy kills the chief of Yukio's escort and
    is rewarded. Yukio raises an army, kills the envoy, and prepares for Chinese invasion.
    Chinese forces attack by land and sea, suffer setbacks, attempt negotiation, then
    besiege Yukio's capital. Four Cho-sen men kill Yukio during the fighting, open
    the citadel gates, and Chinese forces enter. Han banners are planted on the city
    walls, ending the kingdom of Cho-sen and leading to provincial division under
    China.
  language: English
