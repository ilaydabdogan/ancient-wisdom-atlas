canonical_text:
  quote: ''
  summary: The passage recounts the death of Chief Doqwayis, the controversial marriage
    of his daughter Maxulayugwa to the lower-ranked Hayalk'in, and a sequence of copper
    transfers, name acquisitions, and public feasts by which Hayalk'in becomes known
    as Wanuk, then Wag'ides, and receives further status. The narrator explains this
    to Boas as an example of a local category translated as a newly made chief.
  language: English
  quote_policy: summarized
