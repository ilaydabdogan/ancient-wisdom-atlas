- id: obs:1
  text: Chief Doqwayis becomes sick, dies after a short illness, and leaves behind
    the high-priced copper Lobelila.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: People in Fort Rupert discuss Maxulayugwa and Hayalk'in secretly, and the
    passage states that Hayalk'in is considered too low in rank to marry the princess.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Maxulayugwa gives property to the Kwag'ul, takes the name Doqwayis, retains
    her princess name, marries Hayalk'in, and gives birth to a boy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Maxulayugwa's name was disgraced because her husband
    was a common man without chiefly ancestors, and it comments on the status of their
