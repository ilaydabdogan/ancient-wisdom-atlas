- id: motif:2
  label: Invented names explaining reduced status
  taxonomy_refs:
  - royal_legitimacy
  basis: Both Laxsa and Elgunwe accounts emphasize made-up or invented names, and
    the Laxsa are said to lack privileges in connection with name and marriage history.
  evidence_refs:
