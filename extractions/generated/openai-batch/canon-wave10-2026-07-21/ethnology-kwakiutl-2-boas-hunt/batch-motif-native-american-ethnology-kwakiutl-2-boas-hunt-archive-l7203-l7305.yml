canonical_text:
  quote: ''
  summary: The passage recounts name transfers, invented names, marriages, and descent
    claims associated with the Laxsa and Elgunwe numayms. A chief dies of shame after
    a status-violating marriage; names are transferred or invented; Tslag'iłak obtains
    a true name for his grandchild; later traditions explain Elgunwe ancestry through
    invented names and a relationship with a slave woman. Ma'nakula marries Alag'imil,
    and their daughter receives a name made by dividing the dead Tslag'iłak's name.
    The storyteller comments on shame, omission, and forgotten portions of the story.
  language: English
  quote_policy: summarized
