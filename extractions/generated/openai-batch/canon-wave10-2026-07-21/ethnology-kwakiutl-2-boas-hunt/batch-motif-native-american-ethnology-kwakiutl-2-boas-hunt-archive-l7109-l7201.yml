canonical_text:
  quote: ''
  summary: Tslag'i-lak makes fire and gives names to children born to Alak'ilayugwa.
    After the family moves, a visiting chief, later identified as Tslag'i-lak's elder
    brother, asks to marry ALe'stalidzEmga without recognizing his kin. A son is born
    and receives the visiting chief's name. The family travels by canoe to the visitor's
    village, where HaxuyosEme questions the names and origins of the father-in-law
    before the assembled numaym.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A male actor takes out a burning slow-match, makes a fire, extinguishes the
    slow-match, stores it in a box, and is said to be making fires wherever he went.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tslag'i-lak asks Alak'ilayugwa that their child have the name Ma'nakula, connected
    in his speech with moving goods to Wadzilis.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The son is described as an illegitimate child, and Tslag'i-lak is said to
    have invented the son's name.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage identifies these figures as ancestors of the numaym Laxsa and
    states that people of the numaym are ashamed of the name Laxsa.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Alak'ilayugwa gives birth to a girl, and Tslag'i-lak invents and gives her
    the name ALe'stalidzEmga.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tslag'i-lak and Alak'ilayugwa have two children, Ma'nakula and ALe'stalidzEmga;
    Tslag'i-lak moves to G'Eyox, where the children grow up.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A canoe comes from the south to the beach of Tslag'i-lak's house, and Tslag'i-lak
    and his two children go to meet the arrival.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The visitor sees ALe'stalidzEmga, guesses she is Tslag'i-lak's daughter, asks
    to marry the princess, and identifies himself as ^maxuyalisEme, head chief of
    the Haayalikawe, son of HaxuyosEme.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The visitor does not recognize Tslag'i-lak as his younger brother; Tslag'i-lak
    tells him to go to his wife, and the passage states that ALe'stalidzEmga had her
    uncle for her husband.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: ALe'stalidzEmga gives birth to a boy, and the former ^maxuyalisEme is glad
    because he has a son.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The former ^maxuyalisEme does not know his father-in-law's name because the
