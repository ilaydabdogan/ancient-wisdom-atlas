canonical_text:
  quote: ''
  summary: At Qalogwis, named leaders convene potlatches, redistribute skins, blankets,
    slaves, and a copper, and announce name changes connected with marriage, children,
    and chiefly status. After the death of MEled's father and the sudden death of
    ^maxwa's father, ^maxwa asks that the two fathers be buried together, remains
    with the Mamaleleqala, is accepted as successor to his father-in-law, and receives
    his father-in-law's seat and house through MEled.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kwagul arrive at Qalogwis by canoe and take many dressed skins ashore.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aodzagalas, now called ^maxulagilis, orders his house cleared and has speakers
    invite the Kwagul to a potlatch on behalf of Awllgalas, now called ^maxwa.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The passage explicitly reports name changes for Aodzagalas to ^maxulagilis
    and for Awllgalas to ^maxwa.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Property is given away for ^maxwa, including dressed skins, MEled's marriage
    mat, slaves to chiefs of four numayms, and the copper SEwa, which is sold.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The copper SEwa is bought for forty elk-skins and one hundred twenty cedar-bark
    blankets, and ^maxwa gives it away for the weight of his father's name; additional
    dressed skins and blankets are distributed to chiefs and common people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: "^maxwa and MEled have children, and MEled's father ^maxuyalidze repeatedly
    gives marriage presents and child names."
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: For the child ^maxwaq!oiEla, a speaker invites the four numayms, the name
    is announced as a marriage gift, and dressed skins and cedar-bark blankets are
    given away.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: When MEled is again pregnant, her father ^maxuyalidze becomes ill and dies
    before she arrives at Memkumlis.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: When ^maxulagilis hears that ^maxuyalidze has died, he faints and also dies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: "^maxwa asks MEled that his father be buried together with her father, and
    says he will stay with the Mamaleleqala."
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The passage states that ^maxwa leaves his numaym, the SenL!em, because he
    is ashamed of what happened to his father.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: MEled asks the Mamaleleqala to let ^maxwa take her father's place; they agree,
    ^maxwa gives them a potlatch, and later he is treated as a chief who does not
    return to the Kwagul.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: MEled gives her father's seat and the house called Q'.aats'.e to her husband
    ^maxwa as marriage presents.
  category: object
  evidence_refs:
  - ev:9
