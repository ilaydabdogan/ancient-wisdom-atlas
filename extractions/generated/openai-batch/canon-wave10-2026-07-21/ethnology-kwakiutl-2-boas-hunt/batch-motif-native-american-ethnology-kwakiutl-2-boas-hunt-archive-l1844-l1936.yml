canonical_text:
  quote: ''
  summary: The passage describes chiefly marriage-gift exchanges among A^maxulal,
    Amax'ag'ila, the L!aL!asiqwala, and the ancestors of the Gwa'sEla. Ceremonial
    dances and names are transferred along with wealth goods. A son is born to A^maxulal
    and ^nax'nag'Em, is named PEngwid, and his name prompts further redistribution.
    The passage then begins a next-generation marriage and birth involving PEngwid,
    LaxsElelEmga, and HaqElal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After giving a marriage gift, A^maxulal invited the L!aL!asiqwala to GweqElis
    and wanted them to take care of the winter dance they were going to give.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The L!aL!asiqwala wanted the four dancers to disappear that evening; the dancers
    stayed away four nights, were caught, and danced for four evenings.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A^maxulal gave away wealth goods, a name, and named dances, and the text says
    he obtained the winter dance of the L!aL!asiqwala at that time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A^maxulal and his wife ^nax'nag'Em had a son, and A^maxulal sent word to Amax'ag'ila
    that the son had been born.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Amax'ag'ila called his tribe into his house, announced the birth, and asked
    them to give him property for a marriage gift to his son-in-law A^maxulal.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Members of the L!aL!asiqwala brought sea-otter skins, slaves, large canoes,
    and cedar-bark blankets as property for the gift.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Amax'ag'ila said that the grandchild's name was to be PEngwid, and the people
    prepared the marriage gifts on four large canoes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Amax'ag'ila and the L!aL!asiqwala traveled to GweqElis and gave the marriage
    gift to A^maxulal before stepping out of their canoes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A^maxulal invited his father-in-law and tribe ashore and fed the L!aL!asiqwala
    roasted sockeye-salmon and dried mountain-goat meat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A^maxulal gave part of the received wealth to the chiefs and common people
    of the L!aL!asiqwala and part to the chiefs and common people of the Gwa'sEla.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The text states that A^maxulal intended to divide the marriage gift equally
    between the L!aL!asiqwala and the Gwa'sEla because of the highness of the name
    of his prince PEngwid.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: When PEngwid grew up, he married LaxsElelEmga; after they had a son, HaqElal
    called his tribe and said he would give a marriage gift to his son-in-law.
  category: sequence
  evidence_refs:
  - ev:6
