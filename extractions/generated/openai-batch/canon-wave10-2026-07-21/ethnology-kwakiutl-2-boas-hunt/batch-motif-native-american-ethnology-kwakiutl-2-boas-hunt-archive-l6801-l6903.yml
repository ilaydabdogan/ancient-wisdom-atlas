canonical_text:
  quote: ''
  summary: The passage recounts marriages, name changes, payments of marriage debt,
    deaths, inheritance of rank, distribution of property, and the seating and comforting
    of an heiress after her father’s death. A valuable copper named Lobilila and the
    transfer of names, seats, and blankets are central to succession events involving
    Doqwayis, her parents, children, and chiefs from several groups.
  language: English
  quote_policy: summarized
