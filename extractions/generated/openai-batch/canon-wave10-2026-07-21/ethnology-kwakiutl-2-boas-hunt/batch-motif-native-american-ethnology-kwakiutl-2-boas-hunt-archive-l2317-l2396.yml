canonical_text:
  quote: ''
  summary: The passage describes marriage-linked transfer of names, winter-dance names,
    dance privileges, and food from Gwex'sesElasEme and the Lawetsles to Copper-Dancer/Potlatch-Dancer.
    Potlatch-Dancer announces a winter dance, his children disappear, winter-dance
    whistles sound, the house is prepared with a central fire, and four ritual speakers
    dress and call people into the house while speaking of supernatural power taking
    the children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A name, Nap lElEme^, is described as having been given in marriage to Copper-Dancer
    and then given to his youngest child.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Copper-Dancer married ^nax'nag'Em, the eldest daughter of Gwex'sesElasEme,
    who is described as head of a Lawetsles numaym.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After ^nax'nag'Em had a son, the name Potlatch-Dancer was given as a marriage
    present when the son was ten months old; Copper-Dancer then took the name Potlatch-Dancer,
    and another name, Overhanging-Mountain, is associated with his son.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Gwex''sesElasEme gave four dance privileges with associated names: the great
    frog war-dance, the ghost-dancer, the war-dance, and the speaker-dance.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gwex'sesElasEme and the Lawetsles lived at Ai-EgEmala, while Potlatch-Dancer
    and the Kwakiutl lived at Qalogwis.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gwex'sesElasEme and his group came to Qalogwis bringing privileges and much
    food, stayed four days, and then returned to Ai-EgEmala.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Potlatch-Dancer invited his numaym and head men from several numayms and said
    he would hold a winter dance with the food from his father-in-law and show the
    four winter dances given to him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The chiefs told Potlatch-Dancer to proceed; that night his children disappeared
    and many winter-dance whistles sounded.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the seated people had gone out, Potlatch-Dancer's house was cleared
    and a fire was built in the middle.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Four speakers of Potlatch-Dancer put red cedar-bark on their heads and necks,
    rubbed mountain-goat tallow on their faces, blackened their faces with charcoal,
    put eagle-down on their heads, cut cedar-bark rope for belts, and took Sparrow
    Society canes.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The speakers went to call men, women, children, and Sparrow Society members
    into the house of ^widzeq !walaso^, Potlatch-Dancer's winter-dance name.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: Wren said that supernatural power would come into the chief's house, and Goose
    said that shamans should see what the supernatural power would do with the chief's
    children because they had been taken by it.
  category: speech
  evidence_refs:
  - ev:10
