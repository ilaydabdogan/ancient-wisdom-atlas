    described as his dancer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Q!umx'ilag'ilis gives thirty-five blankets and a grandson's name, Omagihs,
    as a marriage-gift; Q!umxod gives the blankets to his numaym, the Walas, and Omagihs
    dances.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Q!umx'ilag'ilis is annoyed by Q!umxod's redistribution of the blankets, interprets
    it as implying that the marriage gift was insufficient, and takes Q!ex'sesElas
    home with her two children.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
