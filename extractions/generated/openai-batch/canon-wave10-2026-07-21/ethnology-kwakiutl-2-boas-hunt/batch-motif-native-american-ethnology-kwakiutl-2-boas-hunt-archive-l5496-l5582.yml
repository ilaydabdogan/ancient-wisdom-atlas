canonical_text:
  quote: ''
  summary: The passage narrates exchanges of blankets, names, marriage payments, and
    chiefly privileges. After offense over redistributed marriage gifts, Q!umx'ilag'ilis
    takes back his daughter Q!ex'sesElas and her children. Q!umxod's head wife urges
    him to seek another marriage with Tlagwisilayugwa, princess of Qwaxila of the
    Koskimo. Q!umxod's numaym contributes property, and a party travels by canoe to
    pay marriage money. Qwaxila transfers the bride, skins, house-dishes, names, a
    named house, and several dances with their names. The passage states that the
    nonlEm came from the Koskimo through this marriage and was later explained secretly
    to the Nak!wax'daxw.
  language: English
  quote_policy: summarized
