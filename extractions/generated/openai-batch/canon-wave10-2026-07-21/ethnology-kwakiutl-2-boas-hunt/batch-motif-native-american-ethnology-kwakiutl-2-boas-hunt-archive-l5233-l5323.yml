canonical_text:
  quote: ''
  summary: The passage describes marriages, name changes, marriage gifts, transfer
    and withholding of winter-dance prerogatives, feasts and potlatches, naming of
    children, succession to seats in numayms, and the beginning of another marriage
    negotiation ending with a sham-battle reception.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: K!ade, identified as a prince and chief, marries Llaqwag'ilayugwa, a princess,
    and both spouses are later referred to by changed names.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sesaxalas gives K!ade a large carved box that had been obtained in marriage
    from Llaqwag'ila of the Awik!enox.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The large carved box contains a named cannibal-dance, several head-masks,
    cedar-bark rings or head-rings, and named dancer prerogatives with cedar-bark.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage identifies the transferred contents as the first winter dance
    from the Awik!enox that went to the DzawadEenox.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When winter comes, K!ade gives a winter dance, opens the large carved box,
    and shows four dances in it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: K!ade is said to have made a mistake in handling the cannibal-dance, and mEmx'ayugwa
    becomes angry, leaves him, and returns home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: mEmx'ayugwa later marries K!wamaxElasogwi'lak; Sesaxalas gives names to the
    new son-in-law and to the son-in-law's sister, but does not speak about the winter
    dance to him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the new marriage, Sesaxalas gives food, three house-dishes, and a name
    for mEmx'ayugwa's newborn child; a feast follows, and several names are changed
    or confirmed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When a second son is born, KIwamaxElas gives potlatches to ancestral and numaym
    groups and gives the child a name because the child is to take his seat after
    his death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the two sons are grown, the elder takes the head seat in the numaym G'exsEm,
    and the younger takes the third seat, identified as the seat of his grandfather
    KIwamaxElas.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the next account, Sesaxalas wishes his son Nanagwas to marry WawalaxElag
    i'lakw, daughter of Kwax'Uanokume'; the Nak!wax'da'x set out to pay the marriage
    money.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Nanagwas takes Sesaxalas's former first seat because Sesaxalas is old and
    weak; the visiting Nak!wax'da'x are met by the Mamaleleqala in sham-battle.
  category: sequence
  evidence_refs:
  - ev:9
