canonical_text:
  quote: ''
  summary: Ai.otEmdalag'ils is summoned to cure the sick chief L!aqwag'ila. He enters
    with cedar-bark rings, sings a sacred shaman-song while the people beat time,
    removes the sickness, and is compensated with two slaves and Alag'imil as wife.
    He announces a four-year abstinence and a four-winter dance cycle ending in the
    burning of forty masks. At the final dawn the masks and hemlock sacred room are
    burned, the long-kept central fire goes out, and he joins his wife. The passage
    explains the Awik'!enox custom of burning masks and adds that spectators he saw
    were souls of plants, birds, and creeping animals, all human beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four noblemen are sent to call Ai.otEmdalag'ils, and he says he knows they
    have come because chief L!aqwag'ila is sick.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ai.otEmdalag'ils wears a neck-ring of red plaited cedar-bark and a head-ring
    not mixed with white.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: When he enters the house, the men and women beat fast time; his body becomes
    numb, and he sings his sacred shaman-song while moving squatting toward the sick
    chief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief lies on a new mat; Ai.otEmdalag'ils takes hold of the sickness,
    takes it out, throws it away, and the chief becomes well.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ai.otEmdalag'ils receives two slaves and the princess Alag'imil as his wife.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: He says a supernatural power told him not to lie with his wife for four years,
    or misfortune would happen; he also forbids others to woo her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: He says that for four winters the people will dance his great dance aLaq!Em
    and that afterward he will burn the forty masks so they will go home to their
    owners.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: In his dancing-house, he places his wife at the right-hand side of the door
    and the two slaves at the left-hand side.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: He is repeatedly called to cure sick people among the Awik'!enox, is paid
    much for it, and gives property to his tribe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: He dances four times in each winter, each time for four nights, with his masks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: After four winters, on the final fourth night, Ai.otEmdalag'ils and his forty
    masks dance; near daylight he comes out of a sacred room of hemlock branches and
    asks the song-leaders to beat fast time before the masks are put in the fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Masked men, women, and two children put their masks into the fire in the middle
    of the dancing-house; the hemlock of the sacred room is also put on the fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The central fire, which had not gone out during the four winters, goes out
    after everything is burned; at daylight Ai.otEmdalag'ils and Alag'imil come together
    and he lies with her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The narrator states that the Awik'!enox burn the forty masks after using them
    four times for four winters, and that this is why white people cannot get them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Spectators sitting on the floor of the winter dancing-house are identified
    as souls of trees, bushes, birds, and small creeping animals, and the passage
    says they are all human beings.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: A song stanza says Ai.otEmdalag'ils was led farther into the woods by magic
    power to the place where the magic power walks about; another sacred song sung
    before and after dancing has no words.
  category: speech
  evidence_refs:
  - ev:8
