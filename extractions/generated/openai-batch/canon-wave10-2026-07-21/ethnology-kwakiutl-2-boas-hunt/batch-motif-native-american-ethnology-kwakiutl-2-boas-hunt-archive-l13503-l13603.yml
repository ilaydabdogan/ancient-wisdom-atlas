canonical_text:
  quote: ''
  summary: 'The passage describes procedures in which a chief''s speaker organizes
    men to roll four cedar trees to the chief''s house, blankets are distributed,
    a carver is hired and paid to make the cedars into house posts, and inadequate
    payment to artisans would disgrace the chief and his descendants. It then begins
    a related potlatch procedure: a chief with five hundred blankets summons his numaym,
    asks them to contribute property for a potlatch in their collective name, and
    the second-ranked man initiates a ranked process of contribution.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief's speaker tells common men to roll up four cedar trees, while chiefs
    sit outside and watch the tribe roll the trees in front of the chief's house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The carver shows where the four cedar trees are to be placed on the ground
    or beach.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Young men of the chief's numaym bring out blankets, and the chief's speaker
    gives blanket pairs to chiefs and groups of common men; the action is named as
    something obtained by rolling up the cedar tree.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The chief's speaker asks the carver to carve the four cedars into posts for
    the chief's house and promises fifty blankets for each post, making two hundred
    blankets for four posts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the posts are finished, the chief invites numayms to sit outside, pays
    two hundred blankets to the carver, and gives each man one blanket for coming
    to watch.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that if the chief does not pay the carver and other house
    workers well, the chief, his children, and their children are disgraced.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A following procedure for a chief who wants to give a potlatch is called giving
    property into the house of the chief.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A chief with five hundred blankets sends two speakers to call his numaym into
    his house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The men infer that the chief wants help for his potlatch, talk with their
    wives before entering, and do not initially bring the blankets that are ready
    in their houses.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The chief thanks the numaym, says he depends on them when contending with
    chiefs of the tribes, says he wants to give a potlatch, and asks them to contribute
    property because five hundred blankets may not be enough.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The chief says the potlatch property will be in the numaym's name and that
    they will become famous among the tribes.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The assembled men remain silent while waiting for the chief next in rank under
    the head chief to speak, because contributions begin by rank from the head of
    the numaym down to the lowest rank.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: The man next in rank tells the numaym to open their boxes to give property
    for the potlatch and asks the chief to spread out a mat on which the property
    can be piled.
  category: speech
  evidence_refs:
  - ev:12
