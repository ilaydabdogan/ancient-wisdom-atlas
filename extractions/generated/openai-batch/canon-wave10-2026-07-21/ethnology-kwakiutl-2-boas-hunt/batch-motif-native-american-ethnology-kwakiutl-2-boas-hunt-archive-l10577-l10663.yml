- id: obs:3
  text: The Cannibal wears a black-bear-skin blanket with cedar-bark elements, a red
    cedar-bark neck-ring, and a head-ring with a mask named Tooth-Mask.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tooth-Mask is described as having an open dog-like mouth with large teeth,
    a human face on the lower jaw, skulls on both sides, and a skull at the back of
    the neck.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rich-Woman dances around the fire, cries while looking upward, takes a great
    round rattle that comes through the roof, swings it, sings, and then the rattle
    goes back up through the roof.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Grizzly-Bear-of-the-Door cries from a sacred room, is accompanied by two whistles,
    dances around the fire with palms downward, and imitates the way of the Cannibal-Dancer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Fire-Dancer comes backward out of the sacred room in a squatting position,
    circles the fire, reaches toward it trembling, throws firebrands about, and continues
    until the house fire is extinguished.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the house fire is rebuilt, Fire-Dancer comes out again standing upright,
    wearing a black-bear skin, and returns to the sacred room after four songs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tamer dances around the fire with red cedar-bark neck-ring and head-ring and
    returns to her sacred room after two songs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: One-Who-Presses-Down dances while holding her left hand flat over her eyes
    and feeling the floor with her right hand, singing as she dances.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The dances are said to have been performed four times each winter for four
    winters; after the four winters, the masks are burned.
  category: sequence
  evidence_refs:
  - ev:7
