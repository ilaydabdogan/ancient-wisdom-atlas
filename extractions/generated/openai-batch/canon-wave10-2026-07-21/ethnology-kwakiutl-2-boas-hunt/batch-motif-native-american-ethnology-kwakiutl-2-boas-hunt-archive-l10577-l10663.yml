canonical_text:
  quote: ''
  summary: The passage describes a sequence of ceremonial dances in a house. Named
    dancers emerge from sacred rooms, circle the fire in the middle of the house,
    wear cedar-bark ornaments, masks, bear-skin blankets, or other regalia, and return
    to sacred rooms. Rich-Woman summons or receives a great rattle through the roof,
    uses it while singing, and it rises back through the roof. Fire-Dancer handles
    firebrands until the house fire is extinguished, after which the fire is rebuilt
    and he dances again. The passage ends by saying the dances were repeated for four
    winters and that the masks were burned afterward.
  language: English
  quote_policy: summarized
