  text: Hoxhok-of-the-Sky, Crooked-Beak-of-the-Sky, and Raven-at-North-End-of-World
    alternate positions between the sacred room, the door, and the rear of the house
    while dancing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Cannibal dances around the fire in the middle of the house and returns
    to a red cedar-bark sacred room.
  category: action
  evidence_refs:
