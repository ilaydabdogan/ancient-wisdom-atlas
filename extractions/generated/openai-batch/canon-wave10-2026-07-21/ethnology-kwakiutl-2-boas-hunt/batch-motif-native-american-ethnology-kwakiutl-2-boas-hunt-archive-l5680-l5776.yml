canonical_text:
  quote: ''
  summary: After Walalag'ilak dies from grief and illness, his son succeeds him, mourns
    him, and is encouraged by his group to marry Omaeli^lak, a chief's princess. The
    Nak!wax'da^x prepare and pay marriage money. The bride's father and uncle transfer
    the princess with six slaves, house-dishes, chiefly names, a named wolf house,
    dance prerogatives, food, seals, and a feast name.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Walalag'ilak feels badly because his wife has gone home, becomes ill, and
    dies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: LelElgEmlilas, identified as Walalag'ilak's son, takes his father's seat,
    distributes property to the Nak!wax'da^x, and takes the name Qlumxod while grieving
    over earlier events involving Qwax'ila and Tlagwisilayugwa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Nak!wax'da^x reject the earlier marriage names associated with Qwax'ila,
    but keep four house-dishes and the nonlEm, which Qlumxod's relatives use.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The numaym walas want Qlumxod to marry Omaeli^lak, the princess of LEk'Emaxod,
    so that he may forget his grief over his father's death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Members of the five Nak!wax'da^x numaym give pairs of blankets to Qlumxod,
    described as if he would wipe away his tears with them, and prepare to pay marriage
    money.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Nak!wax'da^x arrive at HegEms in twenty-two large traveling canoes and
    pay the marriage money while sitting in their canoes.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: LEk'Emaxod and his younger brother PEnqOlas bring slaves, and Omaeli^lak stands
    between her father and uncle with two female slaves; the slaves are arranged facing
    seaward.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: PEnqOlas addresses Qlumxod as son-in-law and asks him to come to his wife;
    three slaves go first, Omaeli^lak follows, and three slaves follow her into Qlumxod's
    canoe.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: PEnqOlas identifies the six slaves as the princess's marriage mat so that
    she will not sit on the floor of Qlumxod's house.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: PEnqOlas announces that Dzonoq!wa, wolf, grizzly-bear, and beaver house-dishes
    will go with Omaeli^lak as house-dishes for her food.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: PEnqOlas gives Qlumxod the name Qlomoqa, gives Qwaxilal the name TslEiulRgEmgi^lak,
    gives the named house Wlwax'sEm, and states that its beam ends and four posts
    are wolves.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: PEnqOlas says Qlumxod's dance shall be the great dance from above and that
    in the winter dance his name shall be GilgEmalis.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Nak!wax'da^x go ashore and enter LEk'Emaxod's house; Qlumxod and Omaeli^lak
    sit in the rear of the house while the six slaves remain in the canoe watching
    it.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: LEk'Emaxod feeds Qlumxod and his crew dried salmon and cinquefoil roots, asks
    the Nak!wax'da^x to stay four days, sends hunters for seals, and later gives Qlumxod
    110 seals and the feast name MEnlesid.
  category: sequence
  evidence_refs:
  - ev:10
