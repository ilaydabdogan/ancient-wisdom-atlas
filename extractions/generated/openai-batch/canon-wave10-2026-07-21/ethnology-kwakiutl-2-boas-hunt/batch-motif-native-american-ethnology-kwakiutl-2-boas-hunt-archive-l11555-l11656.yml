canonical_text:
  quote: ''
  summary: Hayalk'En enters Pearl-Shell-Maker's house, asks to see and buy pearl and
    abalone shells, then kills Pearl-Shell-Maker and his son and takes the shells
    and associated names. Kwax'ilanokilme, a Nak!waxda'xw chief with nine younger
    brothers, learns of this, leads an armed canoe party, kills Hayalk'En and his
    wife, and takes the shells and names, which are said to have been obtained in
    war. The passage then begins a speaker's song about a chief giving a great potlatch,
    inviting tribes, giving property, and deriving wealth from an ancestor's supernatural
    treasure.
  language: English
  quote_policy: summarized
