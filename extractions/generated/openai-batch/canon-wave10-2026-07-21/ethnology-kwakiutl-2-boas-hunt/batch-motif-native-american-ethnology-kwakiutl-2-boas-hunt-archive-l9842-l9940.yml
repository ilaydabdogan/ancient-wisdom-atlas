canonical_text:
  quote: ''
  summary: A supernatural speaker explains dance powers and distinctions, including
    scalp removal, fire immunity, salmon-dancing, and whistle use. At daybreak ALotEmdalag'ils
    is left with masks, cedar-bark rings, and a death-bringing baton. The Awik'lenox
    cross by canoe to the winter dancing-house, where Chief Ewuitlala discovers ALotEmdalag'ils
    seated among masks in a hemlock-branch sacred room. ALotEmdalag'ils names the
    new dance ataq lEm and instructs the chiefs to recruit forty mask wearers, later
    specifying twenty-four young men, sixteen young women, a boy, and a girl.
  language: English
  quote_policy: summarized
