    all around and from the far edge of the world. The speaker exalts the chief over
    other chiefs, names gifts such as sea-otters, coppers, and canoes, stresses giving
    that is not returned, and warns or challenges subordinate and guest chiefs. A
    following song section says the chief will utter a Dzonoq!wa sound, terrifying
    the invited tribes.
