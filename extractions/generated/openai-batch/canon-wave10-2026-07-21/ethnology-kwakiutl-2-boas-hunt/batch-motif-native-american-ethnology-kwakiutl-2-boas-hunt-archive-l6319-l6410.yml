canonical_text:
  quote: ''
  summary: The passage describes a formal marriage-payment and bride-transfer ceremony
    involving Kwag'ul chiefs and the Nak'waxda'x. Blankets are paid and carried into
    the bride-side chief's house; canoes arrive in ceremonial formation; ancestral-style
    wooing speeches are made; the bride appears in abalone-shell regalia carrying
    a named copper; marriage gifts include objects and names; and the bride is escorted
    back to sit beside her husband.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker announces that he has come to pay marriage-money for the princess
    LlaL lElEwedzEmga.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Qasnomalas, identified as the uncle of K'ladalag'ilis, gives blankets to the
    three chiefs and says that the blankets are the wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The three chiefs leave in a canoe, paddle back, stand holding blankets in
    their arms, and sing sacred songs when they arrive near the waiting canoes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Strong young men board one canoe because the Nak'waxda'x are said to have
    a sham-fight whenever someone from another tribe marries their princess.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The marriage canoes are put in line and arrive in front of K'ladalag'ilis's
    house, where a climbing-board is standing and no one is walking outside.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: PlasElal says he will speak as the ancestors used to speak when wooing, then
    addresses the Nak'waxda'x and K'ladalag'ilis and says he comes to woo the princess.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: PlasElal counts blankets in successive groups; nEmogwis and young men carry
    blankets into K'ladalag'ilis's house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After announcing totals including one thousand and eleven hundred blankets,
    PlasElal says that with another hundred blankets he lifts the princess and wants
    her to come into his canoe.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Qasnomalas calls K'ladalag'ilis and his tribe to come out and take the princess
    to her husband, maxulag'ilis.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Nak'waxda'x come out of K'ladalag'ilis's house and stand in a row; K'ladalag'ilis
    and the princess follow them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The princess wears a hat and a blue blanket covered with abalone shells and
    carries a copper named Looking-Sideways.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Qasnomalas announces that the bride's marriage mat is the copper Looking-Sideways,
    that the copper is valued at fourteen hundred blankets, that the dress has sixty
    abalone shells, and that names are given as marriage gifts.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: PlasElal, Nolis, and Kwaxse'staladze go ashore to the place where the princess
    is standing; K'ladalag'ilis gives blankets to each of them, and the princess walks
    back with them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The princess sits down beside her husband, and the passage states that they
    did not run up the standing climbing-board.
  category: sequence
  evidence_refs:
  - ev:7
