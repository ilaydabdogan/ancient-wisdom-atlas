canonical_text:
  quote: ''
  summary: A rooted woman tells the three brothers to go on without her. The brothers
    follow rainbow-colored smoke to a house at the foot of a mountain, where they
    find their sister Qux'Elal, her blood-hungry son, dried bodies over a fire, and
    the household of Cannibal-at-North-End-of-World. They escape by an arrow ruse.
    Qux'Elal summons and directs the cannibal, who pursues them. Wak'as and the brothers
    delay him with objects that become underbrush, a mountain, a cedar-log, and a
    lake. Near home, Powedzid calls to his father NEnwaqawa to tie up the house.
  language: English
  quote_policy: summarized
