canonical_text:
  quote: ''
  summary: The passage explains a cannibal-pole associated with Cannibal-at-North-End-of-World,
    including a grizzly bear, wolf, and eagle with named functions, and says it should
    be shown during a winter dance. It then shifts to a chiefly genealogy emphasizing
    marriages among chiefs and princesses, sons named by maternal chiefs or grandfathers,
    feasts, winter dances received through marriage, and a later marriage gift to
    Helamas that includes blankets, slaves, canoes, a named copper, and the cannibal-dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The cannibal-pole is described with a grizzly bear at the door of the house
    of Cannibal-at-North-End-of-World, a wolf underneath, and an eagle sitting on
    the head of the man on top of the pole.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wolf is identified as the scent-taker at the door of the house of Cannibal-at-North-End-of-World.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The eagle is identified as the watchman of Cannibal-at-North-End-of-World
    and looks out for meat for his food.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speaker instructs the son-in-law to show the cannibal-pole whenever he
    gives a winter dance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: After the explanation, L!aqwag'ila (III 6) goes home with his brother Amaxulal
    (III 1) and wife Allig'imil (III 10) to GweqElis; Amaxulal later goes home to
    Padzo with his mother K'limaxalas (II 2).
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The narrator states that his chiefly ancestors married among chiefs all around
    the world and contrasts this with the ancestors of lower chiefs.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The genealogy repeatedly describes chiefly marriages, the birth of sons, and
    names given to sons or grandsons by chiefs connected to the mother's side.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The narrator says that all the named ancestors invited tribes and gave great
    feasts, and that almost all gave winter dances that had been given to them in
    marriage by the fathers of their wives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Helamas brought one hundred dressed skin blankets, four slaves, four large
    canoes, and a copper named Sea-Lion; these, along with the cannibal-dance, were
    given as a marriage gift by Chief Wigwilba Wakas to Helamas.
  category: object
  evidence_refs:
  - ev:6
