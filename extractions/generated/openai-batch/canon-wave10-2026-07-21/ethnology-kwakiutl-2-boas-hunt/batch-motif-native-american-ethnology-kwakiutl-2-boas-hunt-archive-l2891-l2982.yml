canonical_text:
  quote: ''
  summary: At night, chiefs and Whale Society participants repeatedly call people
    from the village houses into the dancing-house. HoLehd addresses the assembled
    group and directs song-leaders and Whale Society members around the ghost-dancer
    Supernatural-Power-coming-up. Songs and healing sounds are performed, but the
    ghost-dancer does not emerge; Yox'yagwas says she seems to be going down into
    the ground and held by something invisible. The sacred room front descends, revealing
    her partly in the ground. A rope or lasso is placed around her waist and pulled,
    with a hidden strong man and the ghost-dancer pulling from a dug hole. An uninitiated
    poor man’s son is enlisted to pull, and his father gives cedar-bark blankets to
    the Maamtag'ila.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After dark, chiefs dressed, called in the Whale Society, and the group went
    from the dancing-house through houses at the north and south ends of the village.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yox'yagwas followed Chiton's instructions about what he was to say while entering
    houses.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The callers made repeated rounds through the village and used spoken calls
    such as coming back to call, telling people to get up, and saying they were looking
    for a face.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: On the fourth round, the callers did not leave a house until the house-owner
    went out; they followed him and barred the door behind him, and later barred the
    dancing-house door.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: HoLehd addressed the assembled friends, asked them to carry out the plan carefully,
    and told those who held possession of the breath, meaning the song-leaders, to
    get ready.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Whale Society members were sent to sit next to the ghost-dancer and went behind
    her sacred room; a sound of healing was uttered, and the song-leaders sang the
    ghost-dancer's song with fast and then slow beating.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
- id: obs:7
  text: Supernatural-Power-coming-up did not come out to dance while the song-leaders
    sang.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Yox'yagwas addressed the shamans and said the ghost-dancer seemed to want
    to go down into the ground and seemed to be held by something invisible.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The front of the sacred room went down, and the Sparrow Society saw Supernatural-Power-coming-up
    with her legs up to her loins in the ground.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Yox'yagwas and his friends told HoLehd to get a long rope and put a noose
    around the ghost-dancer's waist before she went too deep; HoLehd put the lasso
    around her waist and passed an end under poles in the dug hole.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Whale Society members pulled the lasso but were not strong enough; a strong
    man hidden in the hole, together with Supernatural-Power-coming-up, pulled the
    lasso over a crosspiece where it was tied with oily split kelp.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: HoLehd called the rope magical and asked an uninitiated poor man to take hold
    of it; the son of a man of the Laalax's-Endayo numaym took the lasso and pulled
    part of it out of the floor.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the boy pulled, his father gave cedar-bark blankets to the Maamtag'ila,
    one to each, and then called his son to sit down.
  category: action
  evidence_refs:
  - ev:9
