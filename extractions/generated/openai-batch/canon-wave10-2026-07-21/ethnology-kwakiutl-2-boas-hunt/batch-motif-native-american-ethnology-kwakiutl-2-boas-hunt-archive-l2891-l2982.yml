candidate_motifs:
- id: motif:1
  label: Repeated ritual summons through the village
  taxonomy_refs: []
  basis: The passage describes repeated rounds through all houses of the village,
    with escalating spoken calls and pressure for householders to leave.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage gives a ritual sequence but does not explain the social meaning
    of the phrase 'looking for a face.'
- id: motif:2
  label: Secret-society initiation setting
  taxonomy_refs:
  - initiation
  basis: Named societies assemble in a winter-dancing-house, a sacred room is used,
    song-leaders and shamans are invoked, and an uninitiated poor man is explicitly
    engaged during the rite.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:9
  confidence: medium
  cautions: The passage does not state that the uninitiated participant is initiated
    or that an initiation is completed; the taxonomy link is contextual and should
    be reviewed.
- id: motif:3
  label: Song and breath as ritual operation
  taxonomy_refs: []
  basis: HoLehd identifies song-leaders as holders of breath or songs, a healing sound
    is uttered, and songs with fast and slow beating are used to try to affect the
    ghost-dancer's emergence.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The effectiveness or theological meaning of the songs is not explained
    in the passage.
- id: motif:4
  label: Ghost-dancer descends into the ground
  taxonomy_refs: []
  basis: Yox'yagwas says the ghost-dancer seems to be going down into the ground;
    the sacred room front goes down and she is seen with her legs up to her loins
    in the ground.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage presents a ritualized performance and later describes a dug-hole
    mechanism; it does not narrate a journey beneath the earth.
- id: motif:5
  label: Invisible force holds the central figure
  taxonomy_refs: []
  basis: Yox'yagwas says the ghost-dancer seems to be held by something invisible.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This is reported speech within the ritual, not an independent narrative
    explanation.
- id: motif:6
  label: Restraint or rescue by magical rope
  taxonomy_refs: []
  basis: A long rope or lasso is noosed around the ghost-dancer's waist before she
    goes too deep, passed through the dug-hole structure, and later called a magical
    rope.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage also explains concealed pulling mechanics, so the action should
