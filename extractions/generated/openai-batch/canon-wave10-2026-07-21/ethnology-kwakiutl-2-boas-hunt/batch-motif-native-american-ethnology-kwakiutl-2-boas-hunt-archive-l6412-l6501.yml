canonical_text:
  quote: ''
  summary: A Kwakwaka'wakw narrative passage describes a winter-dance episode connected
    with marriage privileges. Qasnomalas directs ritual sounds, causes winter-dance
    power to affect the Kwag'ul, and arranges the pacification of Yagwis. A carved
    privilege-box, cedar-bark rings, a cannibal-dance name, a copper named Looking-Sideways,
    and fourteen hundred blankets are transferred through feast, sale, dance, naming,
    and marriage-debt prestations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cannibal, q!a,inin&gfis, frog war-dancer, and fire-dancer whistles sound in
    or near the house of K'!adalag'ilis before stopping.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Qasnomalas comes out swinging the rattle of the assistant of the cannibal
    and orders the Nak!wax'da^x to beat time fast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Qasnomalas catches the supernatural power of the winter dance in his hand
    and throws it upon the Kwag'ul.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: L!aL!ElEwedzEmga tells Yagwis to get excited; Yagwis utters the cannibal cry,
    becomes excited, goes ashore, and enters the house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Qasnomalas invites the Kwag'ul into the house on behalf of his son-in-law
    'maxulag'ilis so that Yagwis may be pacified.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Nak!wax'da^x sing four songs, after which Yagwis is pacified and seated
    at the seat of 'maxulag'ilis.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Qasnomalas brings a carved privilege-box with a red cedar-bark neck-ring on
    top.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Qasnomalas says the privilege-box is what the late 'maxwa obtained in marriage
    from the Awik'enox and that it shall go to his son-in-law 'maxulag'ilis.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Qasnomalas says the cannibal's name shall be Hamtse^stasElag'ilis and that
    names for three other dancers will be given later when he pays the marriage debt.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: After food is given and eaten, Yagwis carries the carved box away, and the
    Kwag'ul return by canoe to Fort Rupert.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The next morning 'maxulag'ilis invites the Kwag'ul to a feast, and 'nEmogwis
    takes the copper Looking-Sideways and says he will sell it.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Chief ^walas asks for the copper and says he will buy it for fourteen hundred
    blankets; the Kwag'ul men then pay blanket debts toward the price.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the copper is bought, Yagwis becomes excited again, is pacified in the
    evening, dances with cedar-bark rings and a bear-skin blanket, and is pacified
    after four songs.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The name Hamtse^stasElag'ilis is said to have been given in marriage by K'!adalag'ilis;
    after this Yagwis is no longer called Yagwis.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: Fourteen hundred blankets are given away to the four Kwag'ul tribes and described
    as the marriage mat given by L!aL!ElEwedzEmga to her husband.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: K'!adalag'ilis is said to be going to pay the marriage debt to his brother-in-law
    'maxulag'ilis the coming winter.
  category: relationship
  evidence_refs:
  - ev:11
