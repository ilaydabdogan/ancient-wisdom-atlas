canonical_text:
  quote: ''
  summary: Xaxosenaso hears and repeats a sacred song, is summoned by a small man
    to a large winter-dance house, and is seated to witness the proceedings. He sees
    One-Man-Eater emerge from a head-shaped sacred room, dance, re-enter, return with
    a revolving mask, circle the fire, and dance again. The speaker says that this
    dance, mask or face-dress, sacred room, and name will become Xaxosenaso's treasure.
    A hemlock-clad woman war-dancer then enters, sings and dances, and invites someone
    to cut off her limbs and head in order to obtain her dance, treasure, name, and
    magic power. Xaxosenaso agrees, receives a shell knife, and cuts off her arms,
    legs, and head according to her instructions.
  language: English
  quote_policy: summarized
