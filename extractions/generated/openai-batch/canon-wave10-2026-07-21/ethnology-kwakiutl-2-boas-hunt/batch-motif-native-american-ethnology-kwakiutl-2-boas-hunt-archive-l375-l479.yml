canonical_text:
  quote: ''
  summary: The passage gives the LeqlEin account of HaeLEkume, a sea-hunter and first
    chief, who sees a large supernatural house with a killer-whale front painting,
    enters it, receives instruction from killer-whale men, obtains the house, a harpoon,
    four house dishes, and a new name, remains there four days, and later becomes
    chief after his tribe moves around the house. It then describes the LeLEged house
    front of Chief Lalep!alas, with a double-headed serpent, a wolf, a man, and a
    raven doorway, followed by a list of Kwag'ul Eagle names and numaym affiliations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The front painting of the LeqlEin house is the killer-whale, said to have
    been obtained as supernatural treasure by the first chief HaeLEkume, who was a
    sea-hunter.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: While hunting seal at night at OsEq, HaeLEkume sees a large house on the upper
    side of OsEq with sparks coming out of its roof.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: HaeLEkume goes ashore, sees killer whales painted on the house front, looks
    through a hole at the door, and hears men discussing his sea-hunting behavior.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: One man says HaeLEkume should be advised not to head off the hunters and that
    he will get more game if he keeps behind them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: HaeLEkume jumps through the door, stands at the fire in the middle of the
    house, and identifies himself as the person they wished to instruct.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: An old man says HaeLEkume has obtained the house, its harpoon, and four house
    dishes as supernatural treasure, and gives him the name Llaqwag'ila.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The old man also says HaeLEkume should stay for four days in the house he
    obtained as supernatural treasure.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The men leave the house, go into the water at the beach, spout, and turn into
    killer-whales.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: HaeLEkume's steersman has seen and heard the events and tells others not to
    talk about HaeLEkume.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: After four days, the steersman goes to the large house, sees the killer-whale
    painted on its front, meets HaeLEkume, and enters at HaeLEkume's invitation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Inside the house are four posts carved in the form of sea-lions, sea-lions
    at the ends of the two beams, and sea-lion heads showing outside at the front
