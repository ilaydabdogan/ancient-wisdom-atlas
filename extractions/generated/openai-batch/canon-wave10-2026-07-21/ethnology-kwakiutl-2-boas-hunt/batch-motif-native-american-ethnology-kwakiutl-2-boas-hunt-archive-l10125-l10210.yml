canonical_text:
  quote: ''
  summary: The passage first describes Kwexagila encountering LlaLlaxwas on the water
    in self-paddling canoes; LlaLlaxwas is covered with eagle-down, has feathers rising
    from his head, and shouts. Kwexagila goes ashore, folds up his self-paddling canoe,
    enters a rock at its foot, emerges at the top, and returns to his fort. A second
    narrative begins with the SomxolidEx people, whose members disappear and whose
    chief PlasElal goes armed to seek the cause but does not return. Three brothers
    follow his tracks into the woods, meet an elderly woman, and receive warnings
    about three houses identified by the colors of their smoke, along with a comb,
    stone, cedar-wood, and hair-oil for use if pursued.
  language: English
  quote_policy: summarized
