canonical_text:
  quote: ''
  summary: The passage describes a winter dance-house sequence in which a newly returned
    hamatsla, initially treated as wild or not in his senses, is restrained, subjected
    to a face-burning rite using white cedar-bark on tongs, dances repeatedly around
    the central fire, loses his hemlock-branch rings, enters and exits a sacred room,
    dances with cannibal masks, later appears in a black bearskin blanket with red
    cedar-bark ornaments, and is declared tamed. The passage adds that after four
    winters of four dances he ceases to be hamatsla and becomes olala.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hamatsla has a head-ring and neck-ring of hemlock branches and dances
    to songs with fast and slow beating of time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the slow song ends, the hamatsla does not try to dance and is said to
    pretend that he is not in his senses while attendants try to hold him as he runs
    about.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker of the winter dance-house instructs the song-leaders and attendants
    to secure and tame the hamatsla and calls K!wak!waxsdala to perform his office.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: K!wak!waxsdala comes carrying long tongs with white cedar-bark tied to the
    end; the object is called the face-burner of the newly returned hamatsla.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: K!wak!waxsdala says he will burn the face of the great supernatural one with
    white cedar-bark napkins of the four beloved ones, identified parenthetically
    as princesses.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The white cedar-bark tied to the tongs is put into the fire in the middle
    of the winter dance-house and catches fire before K!wak!waxsdala approaches the
    hamatsla.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The burner jumps, swings the burning cedar-bark over the hamatsla four times,
    and utters the cannibal cry; the hamatsla cries out during the action.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The new hamatsla utters the cannibal cry, goes around the central fire four
    times, and his hemlock branches drop off as he runs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the hemlock branches drop off, the hamatsla enters his sacred room and
    his cannibal headmask shuts its mouth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The hamatsla comes out wearing a cannibal forehead-mask, dances, sits outside
    the sacred room, shakes himself, turns around four times, and the jaws of the
    mask snap.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Later the hamatsla comes out naked, goes around the fire in the middle of
    the house, and returns to his sacred room.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After a slow-time song begins, the hamatsla comes out wearing a black bearskin
    blanket, red cedar-bark rings on neck and head, anklets, and arm-rings; the k
    inqalaLEla dances near him, and the passage says the hamatsla is not wild.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage states that he is now tamed, and that after dancing four times
    for four winters he ceases being hamatsla and becomes olala.
  category: sequence
  evidence_refs:
  - ev:10
