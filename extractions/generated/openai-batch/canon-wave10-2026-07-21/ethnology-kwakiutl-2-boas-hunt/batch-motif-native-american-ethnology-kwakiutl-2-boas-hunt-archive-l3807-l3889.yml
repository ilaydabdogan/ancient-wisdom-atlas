canonical_text:
  quote: ''
  summary: A chief announces a changed name obtained through a father-in-law, hosts
    a feast from a Dzonoq!wa house-dish, and later holds a winter dance during which
    his children disappear and return as named dancers. He publicly explains the dances,
    names, mask, and house obtained through kin and marriage connections. After separating
    from his wife, he enters another marriage negotiation involving wooing-canoes,
    marriage payment, hospitality, bride transfer, goods, and further naming.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yaqoklwalagilis calls his numaym into his house and says he has changed his
    name because he obtained a name from his father-in-law.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: He says he will invite named Kwakiutl groups to eat out of the Dzonoq!wa house-dish;
    dried mountain-goat meat is put into the dish and the guests eat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the winter-dance period, Smoke-All-Round disappears first, and then
    YaqoLeqElas, HamesElal, and HamalaqalEmega disappear; after a long absence they
    are caught and pacified.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The returned children are identified as a cannibal-dancer, a frog war-dancer,
    a double-headed serpent dancer, and a ghost-dancer.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Yaqoklwalagilis tells his tribe that he obtained dances and names through
    father-in-law and kin connections, including a cannibal dance, a frog war-dance,
    a double-headed serpent dance, and a ghost-dance.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The double-headed serpent dance is described as being shown in the way of
    the double-headed serpent mask of YaqalEnala and as also shown by TsIExed to the
    Comox.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Yaqoklwalagilis also says he obtained a house with four steps from his father-in-law
    YaqalEnala.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Yaqoklwalagilis and Gag'golElaga separate; she goes home with two sons, while
    he keeps the eldest son and the youngest daughter.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At her own place, Gag'golElaga imitates what she had seen in the Kwakiutl
    winter dance at Qalogwis.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Yaqoklwalagilis's numaym wants him to marry Ringing-Copper, and the group
    travels in wooing-canoes and pays the marriage price.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Odze^stalis welcomes the wooing party, tells them to take the chief's wife
    aboard their canoe, feeds Yaqoklwalagilis, gives goods associated with the bride's
    mat, and assigns new names to the son-in-law and children.
  category: sequence
  evidence_refs:
  - ev:6
