canonical_text:
  quote: ''
  summary: A supernatural being in heaven seeks to capture the hunter Ex'sokwi^lak"
    by transforming a slave into a grizzly bear and sending him upriver. The hunter
    pursues the bear up a steep mountain and dangerous cliff to a large house where
    people are singing, but he cannot enter and loses the bear because he has transgressed
    rules laid down by his father. He later seeks marriage with Leader-of-all-Warriors,
    daughter of the chief of the DzawadEenox", and receives the chief's consent.
  language: English
