candidate_motifs:
- id: motif:1
  label: Publicly witnessed domestic quarrel resolved by loss of household goods
  taxonomy_refs: []
  basis: The quarrel becomes public, and Nolis commands the community witnesses to
    remove his household property and roof boards, leaving the couple only blankets.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage presents this as an explanatory anecdote about fear of quarreling;
    it does not state a formal ritual pattern.
- id: motif:2
  label: Kin-group blood revenge for homicide
  taxonomy_refs: []
  basis: The passage states that in earlier practice a killing by someone from another
    numaym led to a meeting, and the victim's numaym is urged to kill the killer in
    return.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: high
  cautions: This is a social-legal pattern in the passage, not a supernatural mythic
    episode.
- id: motif:3
  label: Disgrace washed away with blood
  taxonomy_refs: []
  basis: GwEVEmdze explicitly says the warriors should stab MEled so that the disgrace
    brought on G'exsEm may be washed off with blood.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The wording is preserved as reported speech; symbolic force should be
    reviewed against the source language/OCR.
- id: motif:4
  label: Substitute kin as revenge target
  taxonomy_refs: []
  basis: If MEled is not seen, the warriors are instructed to kill his elder brother
    Lalep lamias instead.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives only this single substitute target and does not elaborate
    a broader rule.
- id: motif:5
  label: Compensation payment as shameful alternative to reciprocal killing
  taxonomy_refs: []
  basis: The narrator says copper payment or daughter-marriage payment would disgrace
    the killer's numaym because payment would be made to avoid being killed in return.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The copper and daughter-marriage examples are hypothetical explanations
    in the narrator's commentary.
- id: motif:6
  label: Improper delegation of revenge increases dishonor
  taxonomy_refs: []
  basis: MEled is killed by Gwa^wina, an outside warrior, and the narrator says this
    disgraces G'exsEm because the shooter did not belong to the victim's numaym and
    was paid a slave.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: The judgment is the narrator's evaluative explanation within this case.
- id: motif:7
  label: Chief as head of the kin group
  taxonomy_refs: []
  basis: Gwek'i^lak says G'exsEm has no chief because its head has been taken away,
    and the narrator calls YaqoLElasEm the head chief.
  evidence_refs:
  - ev:5
  - ev:10
  confidence: medium
  cautions: This is an image in speech and status language rather than a full narrative
