    because payment would show avoidance of return killing.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The narrator says that if a G'exsEm man had killed MEled, the talk would have
    stopped and G'exsEm would not have been disgraced; instead, a head chief and a
