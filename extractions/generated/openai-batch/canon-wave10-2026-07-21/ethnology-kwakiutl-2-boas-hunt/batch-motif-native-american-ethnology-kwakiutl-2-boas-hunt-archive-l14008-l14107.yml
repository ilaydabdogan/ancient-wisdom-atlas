canonical_text:
  quote: ''
  summary: 'The passage first recounts a domestic quarrel in which Chief Nolis, after
    being observed by many Kwakiutl men, orders all goods and roof boards removed
    from his house, leaving himself and his wife only their blankets. It then explains
    a case of blood revenge: YaqoLElasEm, head chief of the G''exsEm, is killed by
    MEled of another numaym; the victim''s mother and chiefs call for retaliation
    to remove disgrace; an outside warrior kills MEled and is paid, which the narrator
    judges as further disgrace because the victim''s own numaym did not carry out
    the revenge.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Many Kwakiutl men come to look at Nolis and his wife during their quarrel;
    Nolis stops quarreling and addresses the visitors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nolis tells the men to take away everything in the house and all the roof
    boards.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The men remove the house contents, roof boards, boxes, bedding, pillows, and
    bed covers; Nolis and his wife retain only the blankets on their bodies and move
    to another house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator says that husbands and wives among the Indians are afraid to
    quarrel because of this example, and states that he has seen what he is describing.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator contrasts newer Kwakiutl-speaking practices with earlier practices,
    stating that the early Indians had no courthouse, judges, or witnesses, and that
    a killing by someone from another numaym was followed by a meeting.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: YaqoLElasEm, chief of the G'exsEm numaym, is killed by MEled of the Yaex'agEme^
    numaym; YaqoLElasEm's mother Gwek'i^lak invites the G'exsEm after MEled's whereabouts
    are unknown.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gwek'i^lak tells the G'exsEm that their chiefly head has been taken away,
    that their numaym is disgraced by Yaex'agEme^, and asks whether they will kill
    the killer in return.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: GwEVEmdze, the second chief after YaqoLElasEm, instructs warriors and young
    men to hide knives, stab MEled, and wash off the disgrace with blood; if they
    do not see MEled, they are to kill his elder brother Lalep lamias.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the revenge speech, G'exsEm members keep knives ready and hide small
    axes, while MEled keeps the door of his house bolted.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The tribes know MEled killed YaqoLElasEm; chiefs pity Gwek'i^lak; warriors
    watch for MEled; Gwa^wina shoots MEled at Dzawade and is paid a slave by Gwek'i^lak.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The narrator says Gwek'i^lak's payment to Gwa^wina was wrong and disgraced
    G'exsEm because the shooter did not belong to G'exsEm.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The narrator explains that if MEled had paid a copper or arranged his daughter
