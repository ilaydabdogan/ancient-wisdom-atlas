  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: "^wllEnkiilag'ihs goes before daylight to the river ^wagEla, walks upriver
    toward its lake, enters the water, rubs his body with hemlock branches, sleeps
    under a cedar tree, washes again, builds a house of hemlock branches at the lake,
    and enters the water morning and evening for almost four months."
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: In a dream, ^wllEnkiilag'ihs sees Head-without-Body open its mouth; the hamshamts.!es
    comes out, cries “Wip,” bites his left hand so that a piece comes off, and returns
    into the mouth before Head-without-Body disappears.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After waking, ^wllEnkiilag'ihs enters the water, travels downriver, sleeps
    under a cedar tree, reaches the river mouth, waits for evening, walks along the
    beach, and cries “Wip” loudly for his father to hear.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Waxap !alaso^ hears the cry, plans to invite the tribe to surround him at
