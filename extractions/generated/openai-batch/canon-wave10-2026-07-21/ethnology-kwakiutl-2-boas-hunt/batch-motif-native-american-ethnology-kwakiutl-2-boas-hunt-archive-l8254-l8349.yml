canonical_text:
  quote: ''
  summary: After a song and storm, canoes are changed into rock islands and Head-Winter-Dancer
    and his crew die. ^wllEnkiilag'ihs becomes feared and chiefly because of supernatural
    treasure. He tells his father Waxap !alaso^ that his treasures include flooding-waters,
    cutting-off limbs, and named dances, and asks for a winter dance to display further
    sacred dance objects. His father directs him to disappear. He goes upriver, repeatedly
    enters the water, uses hemlock branches, shelters under cedar, builds a hemlock-branch
    house by a lake, and remains away for almost four months. In a dream, Head-without-Body
    opens its mouth, a being comes out and bites his left hand, then returns into
    the head. He returns downriver, cries “Wip” for his father, and the tribe and
    Sparrow Society respond at the winter-dance-house. A parenthetical note compares
    changing names for the winter-dance-house among Kwakiutl and neighboring groups.
  language: English
  quote_policy: summarized
literal_observations:
