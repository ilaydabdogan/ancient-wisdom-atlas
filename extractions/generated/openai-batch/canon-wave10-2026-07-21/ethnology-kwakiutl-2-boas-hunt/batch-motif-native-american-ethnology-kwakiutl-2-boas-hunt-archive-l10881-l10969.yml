canonical_text:
  quote: ''
  summary: A young hunter receives improved snowshoes, a name, magical red and black
    dog-helpers kept as snail-like objects in a cedar-bark basket, and a quartz-pointed
    climbing pole from his father. He proves his hunting power in an encounter with
    Grouse, then later supplies meat and property to others and becomes a head chief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In deep winter snow, the father made snowshoes for his son and sent him to
    hunt bears; after an initial failure caused by faulty snowshoes, the son killed
    a bear and brought home its skin and one leg.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother said it was time to name her son and named him Ex'sokwi'lax"sa
    'naxwa ham, !enox", translated in the passage as Prettiest-Hunter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father opened a cedar-bark basket and took out two snail-like objects,
    one red and one black, which grew into large dogs when he called their colors
    four times and became small again when slapped.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The father instructed his son to use the red dog for mountain-goats, the black
    dog for bears, and both dogs for many goats, saying they would drive the goats
    into the water.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The father gave the son a pole with quartz or crystal at its point and said
    that striking rock with the crystal would make a hole where footing was impossible.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the mountains, the young man met Grouse, described as a great man who seemed
    friendly, and they discussed how each hunted mountain-goats.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Grouse killed mountain-goats by chewing a root, spitting on his palms, and
    clapping them together four times, after which the goats rolled down the mountain
    dead.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The young man used the red and black dogs to drive mountain-goats into the
    river and kill them, then climbed the cliff with his snowshoes; Grouse became
    frightened and left.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The father knew his son had met Grouse, heard the account, and praised him
    for bravery.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The father foresaw that his wife's brothers were coming, hid in the woods,
    and later told his wife they would part and warned her that breaking his rules
    would bring trouble.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The wife's brothers found the house full of meat, ate mountain-goat meat,
    and later returned with other people; the family went to XEkwek'En with loads
    of meat.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: People without food brought elk-skin blankets, slaves, and canoes to buy mountain-goat
    meat, and chiefs sold their daughters for food.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The young man continued hunting bears and mountain-goats, became rich, gave
    property to his people, and became a head chief of the tribe.
  category: sequence
  evidence_refs:
  - ev:13
