canonical_text:
  quote: '"We are walking to capture the supernatural power."'
  summary: In a winter dance-house, dancers, song-leaders, rattles, and beating-boards
    accompany Qlayaxstalas. A shaman called Listener goes out to search and listen
    for the supernatural power, returns reporting its cries, and later two Listeners
    hear whistling sounds associated with the supernatural power and ghost-dancer.
    Certain half-initiates and dancer groups leave because they are not allowed to
    see painters and preparers working on the sacred room and supernatural treasure.
    Before daylight, the sacred room is painted and put up; four Sparrow Society members
    are painted with charcoal, given eagle-down, belts, and Sparrow canes, then go
    through the village calling dancers back for an action described as capturing
    the supernatural power.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A cry of "Wip, wip, wip!" is heard at the door of the house, followed by simultaneous
    rattling and beating time on a beating-board.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hamshamstslEs come with fast steps to the dancing-place in the rear of
    the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Four songs are sung by song-leaders on behalf of Qlayaxstalas before Qlayaxstalas
    stands still.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The house speaker says that nobody can overcome the group's great friend and
    calls for a full-initiate shaman to act as Listener.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The shaman says he is Quick-Spark, is described as pretending to be Mouse-Woman
    in the story, and says he will go around the world looking for what they came
    for in the winter dance-house.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Listener turns to the right in the rear of the house, turns right again
    at the door, and goes outside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Listener returns and reports that he has been all around the world and
    has learned the different cries of the one sought.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The dancing-house speaker says the supernatural power is approaching because
    Qlayaxstalas's dance cannot be excelled and Listener has heard it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Two Listeners bring the supernatural power, described as the ghost-dancer,
    after almost all the women dancers are in the house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After dancing, the supernatural power whistles at a place where those who
    had disappeared are called, named Supernatural-Power-Place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Two Listeners go out, hear the supernatural power sounding like whistles,
    and report that they have obtained it because they have heard it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Sparrows, fool-dancers, grizzly-bear dancers, and named half-initiate groups
    go out because they are not allowed to see the painters of the sacred room and
    the preparers of the supernatural treasure of the tox'wid.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The sacred room is quickly painted and put up before daylight.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Four members of the Sparrow Society are called in, paint their faces with
