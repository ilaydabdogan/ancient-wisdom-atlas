canonical_text:
  quote: "“we will go to catch our great friend”"
  summary: 'The passage describes a winter-dance ritual sequence: initiates and Sparrow
    Society participants receive instructions, leave the dance house to catch a figure
    called hamshamts!es at a river mouth, four Sparrows are bitten and become attendants,
    and the group returns to the beach of the winter-dance house where board-beating,
    dancing, and songs meet the caught figure or novice.'
  language: English
  quote_policy: quoted
