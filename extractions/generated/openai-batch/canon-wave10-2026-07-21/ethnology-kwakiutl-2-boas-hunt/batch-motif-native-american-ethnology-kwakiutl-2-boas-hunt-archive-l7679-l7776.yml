canonical_text:
  quote: ''
  summary: Xaxosenaso' finds water-filled holes identified as the eyes of a Dzonoq!wa.
    An unseen speaker tells him to enter the eyes, wash with hemlock bunches, and
    dive repeatedly to obtain strength. After a final prolonged underwater dive, he
    is described as having been dead and returning to his senses. A handsome man,
    later identifying himself as Workman, tests his strength by having him twist a
    spruce tree, advises him to purify himself in a river morning and evening, and
    disappears. Xaxosenaso' then travels upriver and encounters Head-without-Body,
    a bodiless angry head that changes its face, opens its mouth, and gives a cannibal
    cry likened to that of the hamshSmtslcs of Kwakiutl ancestors.
  language: English
  quote_policy: summarized
