canonical_text:
  quote: ''
  summary: The passage records several chiefly marriages and their associated transfers
    of names, seats, gifts, potlatch goods, and ritual privileges. Sesaxalas receives
    names, oil, and seats connected with Llasotiwahs and his wife. Q!umx'od marries
    Wayats!oli-'lakw, receives a copper and name from Sewid, converts the copper into
    blankets, and gives a potlatch. A brief rank distinction is expressed through
    long and short cinquefoil roots. The beginning of the history of the DzEndzEnx'q!ayo
    describes 'max'mEwIsagEme^ marrying LEyulag'ilayugwa, paying dressed elk-skins,
    being feasted, and receiving a privilege-box containing winter-dance privileges,
    regalia, and names from Q!aed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Llasotiwahs treated Sesaxalas like his own son because Llasotiwahs had no
    child of his own, and Sesaxalas is described as prince of Llasotiwahs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sesaxalas's wife LlalEvig'ilis gave him much oil as a marriage present and
    gave him the feast name Kwax'ilanokum; Sesaxalas then gave a feast with the oil
    to his tribe and named numayms.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'After Llasotiwahs died, Sesaxalas gave a potlatch, received the name Llasotiwahs,
    and is said to have two seats: his own and that of Llasotiwahs.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Q!umx'od married Wayats!oli-'lakw after asking her uncle Sewid; Sewid had
    taken Wayats!oli-'lakw as his princess because her father died early and Sewid
    had no daughter.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sewid gave Q!umx'od a copper as a marriage present and gave him the name K'!adalag'ihs;
    Q!umx'od sold the copper named Angwala for three thousand blankets and gave a
    potlatch with the blankets.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that Eagle and head chief are those who eat long cinquefoil
    roots, while common people, low people, and speakers eat short cinquefoil roots.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: "'max'mEwIsagEme^ went to marry LEyulag'ilayugwa, princess of Q!aed; the marriage
    party paid fifty dressed elk-skins, which were put ashore from the marriage canoe,
    and the parties ate in Q!aed's house."
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Q!aed's four speakers announced that Q!aed would give a box with privileges
    to his son-in-law; the box included the cannibal dance, the tamer of the cannibal-dancer,
    the rattle, the rich-woman, and the fire dance.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The privilege-box held red cedar-bark neck-rings, head-rings, leg-rings, wrist-rings,
    and the cannibal-tamer's rattle; it was brought out by Q!aed's cannibal-dancer
    and given to 'max'mEwIsagEme^ with privilege names and secular names.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
