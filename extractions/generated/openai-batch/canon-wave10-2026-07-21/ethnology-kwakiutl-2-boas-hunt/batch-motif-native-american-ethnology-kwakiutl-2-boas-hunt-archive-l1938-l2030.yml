candidate_motifs:
- id: motif:1
  label: Marriage alliance through gift exchange and redistribution
  taxonomy_refs:
  - sacred_exchange
  basis: The passage repeatedly describes marriage gifts of blankets, slaves, canoes,
    coppers, and names, followed by public redistribution to chiefs, common people,
    tribes, or all tribes.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:6
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage is an ethnographic genealogy and social record; the taxonomy
    label should be understood as a functional comparison to formalized exchange,
    not as evidence of a supernatural exchange myth.
- id: motif:2
  label: Transferred names as descent and chiefly legitimacy
  taxonomy_refs:
  - royal_legitimacy
  basis: Names are given to sons-in-law, children, and grandchildren in marriage-gift
    contexts, and the passage explicitly links one naming dispute to whether a husband
    is truly chiefly from his ancestors.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:7
  - ev:9
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage concerns chiefs and numaym rank rather than kingship; the
    legitimacy motif is inferred from the social function of names and ancestry.
- id: motif:3
  label: Boy-and-girl twin descendants receive lineage names
  taxonomy_refs:
  - sibling_pair
  basis: The birth of twins, one boy and one girl, triggers a gift-giving and naming
    sequence in which both children receive names.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: No supernatural or cosmological function for the twins is stated in this
    passage; the evidence supports a sibling/twin pattern only at a literal social-genealogical
    level.
- id: motif:4
  label: Animal ancestor in genealogy
  taxonomy_refs: []
  basis: The narrator says the ancestral account began with the whale YaqalEiilis
    and came down to the present child Gwevosdedzas.
  evidence_refs:
  - ev:12
  confidence: low
  cautions: Only the closing reference to the whale ancestor appears in this passage
    range; details of the ancestor narrative are outside the provided passage.
