canonical_text:
  quote: ''
  summary: The passage records successive chiefly marriages, marriage gifts, transfer
    of names, distribution of property, sale of named coppers, birth of boy-and-girl
    twins, a contested naming after marriage, and a closing genealogical statement
    from the whale ancestor YaqalEiilis to the child Gwevosdedzas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group travels by canoe to GweqEhs, unloads a marriage gift for PEngwid,
    and gives it the next morning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The marriage gift for PEngwid includes slaves, canoes, black-bear blankets,
    mink blankets, cedar-bark blankets, and a name; another name is given for the
    child of PEngwid and Lax'sElelEmga.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: After receiving the marriage gift, T!at!Endzid gives slaves, canoes, and blankets
    to chiefs and common people of the Nak!waxda^x and Gwa'sEla.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: K'imged grows up and marries Llaqwal, the princess of Hayogwis, who is chief
    of a named numaym of the Nak!waxda^x.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: K'imged and Llaqwal have twins, one boy and one girl; Hayogwis and his numaym
    prepare a marriage gift for K'imged and load eight canoes with blankets and slaves.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hayogwis gives K'imged property and the name Yaxi.En, and gives names to the
    twin son and twin daughter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: K'imged invites Hayogwis and his crew into his house, feeds them dried mountain-goat
    meat, and distributes canoes, slaves, and blankets to chiefs and common people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: K'ladalag'ilis grows up, marries K!wak hvabalas, and receives the copper Long-Top
    from Chief YaqalEiihs/YaciajEiilis, who also gives a name for his grandson.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: P!adzEse ^maxwa sells the copper Long-Top to Anxnved for nine thousand woolen
    blankets and gives the blankets away to all the tribes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: P!adzEse ^maxwa marries MElned, they have a daughter, and Sewid gives the
    valuable copper Sea-Lion and the name !laqwaga for the daughter.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: "!laqwaga gives away seven thousand woolen blankets that were paid for the
    copper Sea-Lion."
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: "!laqwaga marries Hewak'Ehs and has a son; Hewak'Ehs names the child Gwevosdedzas
    because P!adzEse ^maxwa is angry about the marriage and does not give the name."
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The narrator states that the genealogy began with the whale YaqalEiilis and
    came down to Gwevosdedzas, who is three years old.
  category: speech
  evidence_refs:
  - ev:12
