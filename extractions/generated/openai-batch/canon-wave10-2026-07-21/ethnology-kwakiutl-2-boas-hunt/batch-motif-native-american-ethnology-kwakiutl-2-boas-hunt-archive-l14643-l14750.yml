candidate_motifs:
- id: motif:1
  label: Hospitality setting transformed into armed ambush
  taxonomy_refs: []
  basis: The visitors are invited to eat in NEngEmahs's house, then prepare guns and
    shoot members of the host household.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage does not explicitly interpret the event as a violation of
    hospitality; the motif label only describes the sequence.
- id: motif:2
  label: Living persons killed to accompany or answer for a newly dead person
  taxonomy_refs:
  - sacrifice
  basis: QasElas says his prince died and that the chief will go with him; the narrator
    later says the action is called 'to die with those who are dead' and that two
    were shot on account of QasElas's child.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: high
  cautions: The passage explicitly says the act is not war; the 'sacrifice' taxonomy
    reference is approximate and should be reviewed.
- id: motif:3
  label: Widow requests death to go where her husband went
  taxonomy_refs:
  - death_rebirth
  basis: NEngEmahs's wife asks ^maxwa to shoot her also so she may go to where her
    husband went, after which she is shot and dies.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage states a wish to follow the husband after death but does not
    describe rebirth or the afterlife in detail; taxonomy reference is approximate.
- id: motif:4
  label: Survivors spared amid intended multiple deaths
  taxonomy_refs:
  - survivor_pair
  basis: Hankwaso^gwi^lak" and his wife are missed by the shooters and survive; the
    boy is also not shot.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: This is a literal survival sequence, not necessarily a formal survivor-pair
    motif; three survivors are named or indicated.
- id: motif:5
  label: Migration in canoes to found a new village site
  taxonomy_refs:
  - departure
  basis: "^maxuyalidze leaves K'lodagala with a large kin group in four canoes to
    seek a good village place, chooses Qalogwis, unloads cargo, and builds houses."
  evidence_refs:
