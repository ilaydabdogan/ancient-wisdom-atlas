canonical_text:
  quote: ''
  summary: 'The passage first recounts a visit to NEngEmahs''s house in which guests
    prepare their guns and shoot NEngEmahs, his wife, and intended additional targets
    after QasElas says his prince has died and others will go with him. NEngEmahs
    and later his wife are killed; Hankwaso^gwi^lak", his wife, and NEngEmahs''s son
    survive. The narrator states that this action is not called war, but is called
    dying with the dead. The passage then begins an account of why the Kwakiutl lived
    at Qalogwis: a former myth-people village site is described, ^maxuyalidze migrates
    with his family in canoes in search of a good village site with water, settles
    at Qalogwis, builds houses, invites other groups, and the origin of named numaym
    descent groups is explained through elder and younger brothers.'
  language: English
  quote_policy: summarized
