canonical_text:
  quote: ''
  summary: A speaker instructs a son-in-law and tribe about winter-dance objects,
    names, painted sacred rooms, and the handling of four winter dances. A cannibal-dancer
    emerges from a sacred room, dances around the central fire, is followed by four
    head-masks, brings in and eats a corpse with the rich-woman dancer while a woman-shaman
    sings, has the remaining bones removed, is dragged to the river and ducked four
    times for purification, then returns and appears again with bear-skin and cedar-bark
    regalia while other dancers cry and dance.
  language: English
  quote_policy: summarized
