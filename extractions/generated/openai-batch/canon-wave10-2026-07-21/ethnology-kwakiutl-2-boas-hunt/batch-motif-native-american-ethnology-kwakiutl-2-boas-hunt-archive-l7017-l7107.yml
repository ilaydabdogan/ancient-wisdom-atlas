canonical_text:
  quote: ''
  summary: The passage recounts invented and changed personal and tribal names; the
    formation of the Elgunwe tribe from NEnologEme and his children; status disgrace
    attached to slave ancestry; Gexk'Enis's unsuccessful attempt to marry a princess;
    births and naming of children; and Alak'ilayugwa's relationship with Ts!agi-lak,
    her pregnancy, expulsion by her brother, cave residence, birth of a boy in the
    cave, and later travel by canoe to Wadzolis.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lalaxs^Endayo invented the names NEnologEme^ and iJespIegaak for LloLlotsa
    and his child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsele, wife of NEnologEme^, gave birth to a boy named BawEle, and the children
    are described as illegitimate children.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lalaxs^Endayo changed Tsele's name to Lalaxs^aq!anak and treated her as his
    own daughter because NEnologEme^, his wife, and his children helped with work.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Lalaxs^aq!anak gave birth to a girl, and Lalaxs^Endayo named her Alak'ilayugwa;
    the passage says this name was also made up and was connected with dressed skins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: L!esp!egaak, the eldest child of NEnologEme^, is described as wise and as
    taking care of property.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: L!esp!egaak invited people from K!aq!a to a potlatch, and ^walas Kwaxilanokume^
    felt sick at heart when he saw LloLlotsa, now called NEnologEme^, with a great
    tribe of children.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Lalaxs^Endayo said that NEnologEme^ and his children should form another tribe,
    named Elgunwe^ from that day.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: L!esp!egaak gave away property to his guests and then changed his name to
    Gexk'Enis, a name the passage says he did not get from any place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that Gexk'Enis's father LloLlotsa and mother Tsele had
    been slaves, and that this was called not-noble stock because both sides were
    slaves.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: Gexk'Enis tried in vain to marry the princess DzEnxq!ayugwa, and Hayalk'EngEme^
    mocked him and called him his slave.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: DzEnxq!ayugwa left for the house of Lalaxs^Endayo, who had changed his name
    to Llaqwalal; she was with child and gave birth to a girl named Alagimul and later
    to a boy named Ek'lawigi^lak.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Alak'ilayugwa became the sweetheart of Ts!agi-lak, described as a foolish
    youngest son of the chief HaxiyosEme^, and the youngest son is said not to be
    taken care of by his father.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Ts!agi-lak came as a stranger from south of Tsaxis and stayed at the house
    of Llaqwalal.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: Alak'ilayugwa did not heed Gexk'Enis's warning not to make Ts!agi-lak known
    as her lover; she said she was proud to have the prince of HaxiyosEme^ for her
    lover.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: When Alak'ilayugwa was with child, her brother Gexk'Enis drove her away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Ts!agi-lak asked Alak'ilayugwa to carry their goods to a cave near K!aq!a;
    the lovers stayed there, and she gave birth to a boy in the cave.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: After living in the cave for a long time, Alak'ilayugwa asked Ts!agi-lak to
    go with their goods to Wadzolis; he loaded a small canoe and they went there.
  category: sequence
  evidence_refs:
  - ev:8
