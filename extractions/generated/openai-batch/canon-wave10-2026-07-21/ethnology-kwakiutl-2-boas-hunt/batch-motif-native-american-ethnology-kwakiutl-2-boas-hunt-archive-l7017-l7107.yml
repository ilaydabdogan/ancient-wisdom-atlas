candidate_motifs:
- id: motif:1
  label: invented names and name changes marking social relations
  taxonomy_refs: []
  basis: Multiple figures receive invented or changed names, including marriage names,
    child names, a chief-like personal name, and a tribal name.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage presents the names as social acts, but does not state a supernatural
    or ritual explanation beyond invention and naming.
- id: motif:2
  label: new tribe formed from a household line
  taxonomy_refs: []
  basis: Lalaxs^Endayo declares that NEnologEme^ and his children should form another
    tribe called Elgunwe^ from that day.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives a social origin account for the named tribe, not a cosmological
    creation episode.
- id: motif:3
  label: status and marriage blocked by slave ancestry
  taxonomy_refs:
  - royal_legitimacy
  basis: Gexk'Enis thinks of himself as a chief and seeks a princess, but is mocked
    as a slave; the passage emphasizes that both his parents had been slaves and calls
    this not-noble stock.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The available taxonomy reference is broad; the passage concerns chiefly
    status and marriage eligibility rather than royal kingship in a narrow sense.
- id: motif:4
  label: pregnancy leading to expulsion and relocation with lover
  taxonomy_refs:
  - departure
  basis: When Alak'ilayugwa is found to be with child, her brother drives her away,
    and she and Ts!agi-lak carry their goods to a cave.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The departure is domestic and social; the passage does not frame it as
    a formal quest or heroic departure.
- id: motif:5
  label: birth in a cave after lovers' exile
  taxonomy_refs: []
  basis: Alak'ilayugwa and Ts!agi-lak remain in a cave for a long time, and she gives
    birth to a boy there.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No miraculous or sacred qualities are stated for the birth; it should
    not be classified as sacred birth without further context.
- id: motif:6
  label: neglected youngest son as lover
  taxonomy_refs: []
  basis: Ts!agi-lak is introduced as the foolish youngest of five sons of a chief
    and is said to be neglected by his father, yet Alak'ilayugwa is proud to have
    him as lover.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage segment does not yet show a reversal of fortune or heroic
    role for the youngest son.
