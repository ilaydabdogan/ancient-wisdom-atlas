canonical_text:
  quote: '"I wish to become a real man in this place"'
  summary: A Nak!wax'da'xw woman's wail recounts the origins and prestige of her house
    and numaym. She traces descent from L!aqwag'ila/Hele'stes, a prince connected
    with the Killer-Whales who travels to Blunden Harbor, builds a house, receives
    visitors, marries into another chiefly line, and becomes the root ancestor of
    named chiefs. The passage continues through successive marriages, births, marriage
    gifts, names, feasts, distributions of property, and a final assertion that others
    have stolen ancestral names.
  language: English
  quote_policy: quoted
