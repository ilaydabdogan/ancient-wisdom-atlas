canonical_text:
  quote: ''
  summary: The passage gives songs and ritual instructions for catching, pacifying,
    and returning cannibal-, throwing-, and frog-war-dancers during a winter dance.
    Chiton teaches songs to the song-leaders, instructs the Whale Society, and prescribes
    words for shamans to pacify named dancers. The dancers are caught, brought into
    the dancing-house, placed in a sacred room, made to dance with songs, kept there
    for four days, purified, and associated ritual objects and gifts are distributed.
    The passage also states that this winter dance came through a marriage alliance
    and was used once by the Kwag'ul.
  language: English
  quote_policy: summarized
