canonical_text:
  quote: ''
  summary: QuxElal gives NEnwaqawa water of life, which revives dried bodies and restores
    his tribe. NEnwaqawa gathers masks, cedar-bark, skins, and meat from sacred rooms
    and returns home with the revived people. QuxElal instructs him to institute a
    winter dance with named roles, including Cannibal, Rich-Woman, Fire-Dancer, Grizzly-Bear-of-the-Door,
    Tamer, and One-Who-Presses-Down. Six persons disappear, are away four months,
    and are captured. A ritual procession follows, involving a carried body, sacred
    songs, corpse-eating by some roles, retirement to sacred rooms, and a later snapping
    Raven-at-North-End-of-World head-mask.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: QuxElal gives her father a filled mountain-goat object and instructs him to
    sprinkle the water of life over dried bodies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When NEnwaqawa sprinkles the water of life on the dried bodies, they sit up,
    rub their eyes, say they had been asleep, and the whole tribe comes back to life.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: NEnwaqawa takes masks and red cedar-bark from eleven sacred rooms and has
    the revived tribesmen carry dressed elk-skins, masks, and dried goat-meat home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: QuxElal tells NEnwaqawa to give a winter dance, to have her three elder brothers
    disappear, and to assign named dance roles to herself, her brothers, and accompanying
    offices.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: NEnwaqawa calls chiefs into his house at night and reports QuxElal's plan
    that six persons should disappear according to the way of Cannibal-at-North-End-of-World.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: PlasElal, who had come to life again, questions NEnwaqawa about Cannibal-at-North-End-of-World
