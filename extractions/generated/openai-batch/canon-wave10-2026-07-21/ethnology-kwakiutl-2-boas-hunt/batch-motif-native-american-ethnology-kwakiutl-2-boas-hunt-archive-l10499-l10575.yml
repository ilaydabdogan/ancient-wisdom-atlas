  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first winter dance begins that night; six persons disappear, QuxElal secretly
    advises NEnwaqawa about the dance, and after four months the six are captured.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the capture, QuxElal as Rich-Woman carries a body and leads the Cannibal,
