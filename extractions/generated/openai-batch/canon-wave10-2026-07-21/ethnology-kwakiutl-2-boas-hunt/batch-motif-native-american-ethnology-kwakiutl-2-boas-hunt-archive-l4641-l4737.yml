canonical_text:
  quote: ''
  summary: 'The passage recounts a sequence of Kwakiutl kin-group ceremonies around
    Lalep!alas: his grandfather Ewanux"dze gives him a high-rank name with blankets,
    the father summons witnesses and distributes gifts, later marriage-debt goods
    are paid, Lalep!alas undergoes winter-dance and society-name changes, and his
    father plans a potlatch to obtain for him the name of a past chief.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ewanux"dze counted sixty blankets, placed them on young men of his numaym,
    and sent them to the house of his son-in-law GwE'yimdze.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ewanux"dze told GwE'yimdze that his grandson lacked a high-rank name, gave
    him the name Lalep!alas, and gave sixty blankets.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: GwE'yimdze thanked his father-in-law for the name and marriage gift, then
    called his numaym and sent speakers to invite named numayms to witness the child's
    dance.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The four invited numayms came in, and GwE'yimdze distributed the sixty blankets
    to them after stating his plan for the child to have the high-rank name Lalep!alas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lalep!alas is described as having multiple names, beginning from his birth
    by his mother Qlex'Lala.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:6
  text: Before a winter dance, Ewanux"dze paid a marriage debt consisting of blankets,
    oil, dried salmon, and cinquefoil-root baskets.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the marriage-debt payment, Lalep!alas disappeared, GwE'yimdze gave a
    winter dance, Lalep!alas was later caught, and he received the name AmyaxElaso.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After another winter, Lalep!alas became a member of the Sparrow Society and
    is also associated with a Whale Society winter-dance name and a secular-season
    name from his grandfather.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: GwE'yimdze wanted Lalep!alas to give a potlatch to the Kwagul in order to
    obtain the name HamesElal, identified as the name of a past chief belonging to
    the SenL!Em numaym.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: GwE'yimdze and Ewanux"dze helped Lalep!alas with four hundred blankets, after
    which speakers and guests were summoned and Qlex'Lala was named as the dancer.
  category: sequence
  evidence_refs:
  - ev:7
