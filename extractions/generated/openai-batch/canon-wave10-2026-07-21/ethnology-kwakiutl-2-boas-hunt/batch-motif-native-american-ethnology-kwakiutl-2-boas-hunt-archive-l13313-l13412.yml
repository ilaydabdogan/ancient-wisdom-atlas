canonical_text:
  quote: ''
  summary: The passage describes a feast practice in which dried salmon is broken
    into four pieces, dipped in oil, and thrown onto the fire for The-One-Sitting-on-the-Fire,
    who is asked for protection and help. It then explains The-One-Sitting-on-the-Fire
    as the man of the house fire and Lletsaphlanaga, Heat-Under-the-Fire-Woman, as
    his wife; variant views identify them as helping spirits or souls. A second section
    describes tribute obligations of seal hunters, goat hunters, and salmon fishers
    to chiefs of their numaym, including good and bad relations and possible violence
    over disputed shares.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a feast, the person who puts down the dishes takes dried salmon, breaks
    it into four pieces, dips the pieces in oil, and throws them on the fire of the
    feasting house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ritual speaker prays to The-One-Sitting-on-the-Fire, asking him to eat
    first, protect the people from harm, and help them obtain what they are working
    for.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man himself answers on behalf of The-One-Sitting-on-the-Fire, saying that
    he will do so, and afterward the feasters are told to eat the dried salmon.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A guest asks whether The-One-Sitting-on-the-Fire is a man or a bird, and the
    answer given is that he is the man of the house fire.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The heat is described as a woman, the wife of The-One-Sitting-on-the-Fire,
    named Lletsaphlanaga, Heat-Under-the-Fire-Woman.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says that fires in the house and on the ground have heat, and
    that firewood cannot burn unless The-One-Sitting-on-the-Fire and Lletsaphlanaga
    are near it.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The-One-Sitting-on-the-Fire and Lletsaphlanaga are called the life of the
    house fire and are described as a real man and a real woman.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Different Indians are said to identify the two fire beings as helping spirits
    or as souls of dead persons; shamans are said to identify both as souls.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: No numaym of the tribes is said to own The-One-Sitting-on-the-Fire and Lletsaphlanaga.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A seal hunter gives a seal as a present to the head chief of his numaym, and
    compliant hunters are treated well by the chief.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: If a hunter gives too much of his catch to another chief because of a price
    offered by that other chief, the hunter's own chief may try to kill him; the passage
    states that chiefs own hunters.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: A mountain-goat hunter who obtains ten goats gives five to the chief and keeps
    five; the chief may redistribute or dry the goat meat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A bad chief may demand more than half the goats, take them by force, or kill
    the goat hunter; the goat hunter may kill the bad chief if the chief overdoes
    his demands.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: A salmon fisher gives a portion of dry salmon to the chief, with the amount
    varying according to whether the chief and fisher are described as good-minded
    or bad.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: When the chief thinks he has not been given enough salmon, the chief and fisherman
    may quarrel and fight until one is killed.
  category: action
  evidence_refs:
  - ev:9
