  summary: The passage describes Kwag'ul handling of a newly returned hamats!a, related
    Awlk!enox and Bellabolla washing practices, repeated four-day winter-dance procedures,
    herald calls, the display of masks behind a curtain, an Awlk!enox invitation formula
    naming Four-Man-eater, and the opening of a GesxEm legend about Chief Ts!Exed
    and Prince K!wak!wabalas.
  language: English
