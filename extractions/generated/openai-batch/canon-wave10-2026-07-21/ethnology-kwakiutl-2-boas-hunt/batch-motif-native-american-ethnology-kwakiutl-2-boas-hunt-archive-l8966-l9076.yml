literal_observations:
- id: obs:1
  text: Among the Kwag'ul, certain hamats!a performers perform only once in winter
    and quickly give up the hamats!a, after which they become members of the Sparrow
    Society.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hamats!a with a strong mind remains a hamatala for a long time; the passage
    associates this with noble descent.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the recently returned hamats!a is brought back to his senses in the
    evening, Sparrow Society members, women, and children go out, while those with
    the office of purifying him remain inside until toward daylight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Awlk!enox and Bellabolla wash the newly returned hamats!a four days after
    he comes out of the woods, after he has danced four nights.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The new dancer does not take off his red cedar-bark ring for four years, does
    no work for four years, and is to be given food first in houses.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: If the new hamats!a is not given food first, he becomes excited and bites
    those who give food to guests; the passage says he is feared even in summer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Kwag'ul heralds call half-initiates who have no hamats!a with a sequence of
    first-person plural statements addressed to shamans.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Four heralds of the Sparrow Society beat time four times when the novice first
    disappears, and later four-day intervals structure assembly, giving red cedar,
    and repeated board-beating for those who have disappeared.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Different winter dance masks are brought into the winter dance-house and placed
    behind a curtain stretched across the rear of the house.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Song-leaders sing and boards are beaten for women; a woman comes in dancing
    and then goes back behind the rear curtain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the last dance, the fool-dancer, the bear-of-the-house, and the masks behind
    the curtain cry out; fast time is beaten, the curtain is let down, and the masks
    show themselves four times.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the masks are shown, Sparrow Society members and dance owners leave,
    the winter dance is finished, and at day they have secular names and sing secular
    songs at a feast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: An Awlk!enox invitation formula asks winter dancers to come, says the damdamxala
    will be tamed, names the Sparrow Society as those looking out for danger, and
    refers to the name Four-Man-eater as a supernatural treasure.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The opening of the GesxEm legend says the ancestors of the numaym GesxEm of
    the Nak!waxdax lived at Wawale, with Ts!Exed as chief and K!wak!wabalas as prince.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Ts!Exed is described as a bad man hated by his tribe, and he struck K!wak!wabalas;
