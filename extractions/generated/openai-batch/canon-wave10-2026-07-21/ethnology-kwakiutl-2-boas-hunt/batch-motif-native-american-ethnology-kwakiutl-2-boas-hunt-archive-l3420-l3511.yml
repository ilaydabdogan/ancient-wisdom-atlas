canonical_text:
  quote: ''
  summary: Llaqwagila repeatedly bathes and sprinkles water on both sides of his neck,
    hears the cry “Wip, wip, wip,” and is instructed to go upriver and remove human
    smell. After further bathing, he sees a painted house with coppers by the door.
    Four red-cedar-bark-wearing Sparrows call him inside to watch Hamsbe being tamed.
    Songs and a dance follow. An old man declares that Llaqwagila has obtained the
    dance, names, and a winter-dance house; after Llaqwagila looks at everything,
    the house disappears.
  language: English
  quote_policy: summarized
