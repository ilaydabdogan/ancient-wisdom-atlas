canonical_text:
  quote: ''
  summary: The passage gives a first-salmon prayer in which a fisher addresses the
    salmon as Swimmer, thanks it for returning, asks it to bring other salmon and
    wealth, and asks it to remove sickness. It then describes a halibut-fisher preparing
    octopus bait and hooks called younger brothers, praying to the hooks to call named
    halibut addressees, urging the halibut to take the bait, striking a caught halibut,
    sending its soul to tell its relatives the fishing canoe was a good place, touching
    the hook to its eyes four times, washing the hooks, and sending them down again.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A salmon-fisher prays when catching the first salmon with a hook or by trolling,
    welcoming the salmon as Swimmer and thanking it for coming back while he is alive.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The salmon-fisher asks Swimmer to go home, tell its friends that it had good
    luck coming there, bring them with their wealth-bringer, and take away the fisher's
    sickness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that wise salmon-fishermen have different prayers, that
    some salmon-fishermen do not care about the salmon they catch, and that the prayers
    belong to those who work on salmon rather than to numayms.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The halibut-fisher prepares bait from skinned octopus tentacles by cutting,
    splitting, spreading, and lightly pounding them on a paddle across the fishing
    canoe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The halibut-fisher calls the halibut hooks his younger brothers, baits them,
    ties them to a crosspiece, attaches a sinker, and prays to them.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: 'In the halibut prayer, the hooks are told that they are dressed and will
    go call or invite named addressees: Old-Woman, Smelling-Woman, Born-to-be-Giver-of-the-House,
    and Flabby-Skin-in-Mouth.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: While lowering the line into the water, the halibut-fisher prays downward,
    urging the named addressees not to watch for a long time and to take the sweet-tasting
    food promptly.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: When he gets a bite and hauls the line, the halibut-fisher says to hold on
    to the younger brother.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the halibut's head comes out of the water, the fisher strikes it on the
    nose with a club and addresses it by the named halibut titles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After striking the halibut, the fisher tells it to report to its father, mother,
    uncle, aunt, elder brothers, and younger brothers that it had good luck because
    it came into his fishing canoe.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage explicitly says the fisher is sending away the soul of the halibut
    to tell its relatives that the place where it lay dead in the fishing canoe was
    good.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The fisher removes the hook from the halibut and puts the hook into the halibut's
    eyes four times, telling it to look well at the hook's sweet-smelling dress and
    tell its tribe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The fisher washes blood from the hooks, holds them up, tells the younger brother
    that its dress has been washed, and sends it back into the water to call the named
    halibut addressees again.
  category: sequence
  evidence_refs:
  - ev:9
