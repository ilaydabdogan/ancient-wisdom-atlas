canonical_text:
  quote: ''
  summary: The passage contains several songs and addenda. A workingman's daughter
    song describes a female speaker preparing for a future husband while gathering
    roots and berries for her mother and an old dog or slave. A chief's daughter song
    describes marriage to chiefs' sons or princes, with the bride's father giving
    status, names, privileges, dishes, food, and marriage-feast goods to the future
    husband; the bride is associated with coppers and a belt woven by her mother.
    Wake-up songs addressed by parents to sons and daughters refer to paddles, harpoons,
    digging-sticks, baskets, water, birds, tide, and beach work. An addendum describes
    the long-haired dog Qalakwa, explains its name through an oil-and-water comparison,
    and describes cutting, washing, spinning, and weaving dog hair into cedar-bark
    blankets; a dog-hair braid marks a chief, while mountain-goat wool marks a common
    man. The passage ends with the beginning of a salmon-fisher prayer scene.
  language: English
  quote_policy: summarized
