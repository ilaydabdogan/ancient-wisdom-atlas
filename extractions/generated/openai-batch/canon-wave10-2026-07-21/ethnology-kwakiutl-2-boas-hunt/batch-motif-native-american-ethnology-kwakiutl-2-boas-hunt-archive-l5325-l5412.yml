canonical_text:
  quote: ''
  summary: A conflict between Naklwax'da'x and Mamaleleqala people nearly becomes
    a real fight, but is followed by marriage payment, transfer of a wife with a named
    copper and feast goods, purchase of the copper from its owner, return to Nanagwas's
    village, a feast for four numayms with named house-dishes and oil and berries,
    ceremonial singing and dancing with name changes, and a subsequent sale of the
    copper to another chief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Naklwax'da'x and the Mamaleleqala threw stones at each other on the beach,
    and many people on both sides were hurt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says there was nearly a real fight between warriors of the two
    groups, including K'ilEm and K'ilEmalag'ilis, and that K'ilEm was hurt by K'ilEmalag'ilis.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chief Kwaxilanokume put a large canoe on as medicine for K'ilEm's hurt, after
    which the encounter did not become a real fight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Noh, a Mamaleleqala warrior, challenged Nandze, a Naklwax'da'x warrior, and
    neither won.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the fighting, marriage money was paid, and Nanagwas and his crew were
    invited into his father-in-law's house and fed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kwaxilanokume announced that WawalaxElagilak would go to Nanagwas carrying
    the copper Causing-Quarrels, with boxes of oil and berries, four house-dishes,
    two ladles, and names assigned for a dancer and for Nanagwas.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nanagwas's father Sesaxalas thanked Kwaxilanokume, and Nanagwas was asked
    to stay four days until the goods and copper were ready.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The copper Causing-Quarrels was bought from nEmokulagihdze for two slaves,
    forty sewed blankets, one hundred and twenty new cedar-bark blankets, and two
    canoes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Naklwax'da'x loaded canoes with oil, berries, house-dishes, and ladles;
    WawalaxElagilak carried the copper on her back; Sesaxalas sang a sacred song of
    the secular season; and the party traveled to Teguxste.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Nanagwas said he would feast his tribe with the oil and berries, and four
    numayms were invited into his house WadoftsEm.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Berries and oil were placed in house-dishes and distributed to named numayms;
    remaining berries and oil were distributed to people of low rank and holders of
    first seats.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Nanagwas's numaym sang, his sister danced, the sister's name became MElnas,
    and Nanagwas changed his name to a form rendered in the passage as maxQyahdze.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: After the feast, Nanagwas showed the copper Causing-Quarrels, asked chiefs
    of the four numayms to buy it, and LElak'Enxwid bought it.
  category: action
  evidence_refs:
  - ev:11
