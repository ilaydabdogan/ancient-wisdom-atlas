canonical_text:
  quote: ''
  summary: The passage narrates a birth in the household of ^maxwa and MEled, a potlatch
    hosted for the Kwagul, a public transfer of chiefly name and seat to ^maxwa among
    the Mamaleleqala, negotiations over which of his children will hold positions
    among the Kwagul/SenL!Em, a visit to white settlers at Tsaxis followed by relocation
    to Fort Rupert, and Gayosdas's later succession and proposed marriage alliance.
  language: English
  quote_policy: summarized
