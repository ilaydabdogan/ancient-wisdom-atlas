canonical_text:
  quote: ''
  summary: The passage describes LaleliLla's encounter with a great house that rises
    from the sea, his acquisition of sea-otters and house dishes as supernatural treasures,
    his return and transfer of these goods to his elder brother, and the imitation
    of the sea-house as a numaym house style. It then records several numaym house
    properties, marriage transfers of houses, animal paintings and house dishes, an
    oil-feast apparatus involving a carved vomiter on a roof beam, and the HaanaLena
    double-headed serpent house and canoe emblem.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'LaleliLla sees a great house that has come up from the sea, with four house
    dishes in the rear: whale, killer-whale, sea-lion, and seal dishes.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: LaleliLla hears speech stating that he has obtained the sea-house and four
    dishes as supernatural treasure and instructing him to club sea-otters as supernatural
    treasure.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: LaleliLla clubs many sea-otters in the house, fills his canoe, the sea floods
    the house, the house disappears, and the canoe floats on the open sea.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: LaleliLla returns to his village with sea-otters, reports the event to his
    elder brother Llaqwalal, and gives the sea-otters and four house dishes to him.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: A house like the sea-house is built in Qalogwis, with imitations of the whale,
    killer-whale, sea-lion, and seal dishes, and with birds on the upper edge of the
    house front, including an eagle at the crosspieces.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The numaym Laalax's^Endayu are said to own the bird figures sitting on the
    upper edge of the front outside of their house.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: QlEmxod marries O'magasEme, princess of HaeLEkum, and HaeLEkum gives his house
    in marriage to his son-in-law; the house has flat posts with wolf and grizzly-bear
    paintings.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Elgonwe are said to have kept together with the Laalax's^Endayu from the
    beginning and to have no different house; Wanuk builds a house for himself, but
    nothing is in it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Kakwaktum are said to have sprung from one source with the Kakwaktum of
    the GwetEla and to have no painting on the outside front boards of the house.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'YaqoLadze''s marriage to O''masqwapElagilis is associated with a house that
    has a whale painting on the outside front and four house dishes: sea-otter, killer-whale,
    beaver, and whale dishes.'
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: YaqoLadze's marriage to Ts!Ets!alal is associated with a house whose front
    painting is a sea-grizzly bear split across the two sides of the door, with the
    heads touching at the door, and with a carved vomiter on top of the house.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: During YaqoLadze's oil feast, oil is poured into a gutter on a roof beam and
    runs out behind the carved vomiter's head as if vomited, then runs into the fire
    in the middle of the feast house.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The HaanaLena have a double-headed serpent on the crosspiece at the top of
    the house front and a double-headed serpent painting on their canoe; the narrator
