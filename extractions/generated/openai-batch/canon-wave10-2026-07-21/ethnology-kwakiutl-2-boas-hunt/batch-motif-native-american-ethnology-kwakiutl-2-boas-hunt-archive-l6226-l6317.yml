canonical_text:
  quote: ''
  summary: The passage describes a feast with individual dishes, an announced change
    of names, and the distribution of one hundred and twenty blankets as a marriage
    mat used to wipe chiefs' mouths. It then recounts the separation of TslEndEgEmg'ilak
    from her husband, her later name change to LaLlElEwedzEmga after being made to
    dance by her uncle, and a new marriage proposal from maxulag'ilis. The suitor
    consults Kwagul chiefs, counts twelve hundred blankets as marriage wealth, travels
    by canoe toward Baas, and sends three chiefs to speak formally to K'ladalag'ilis
    about marrying his sister.
  language: English
  quote_policy: summarized
