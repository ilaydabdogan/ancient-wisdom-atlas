canonical_text:
  quote: ''
  summary: 'The passage closes a preceding family-history account with statements
    about name changes, chiefs, and a call to Cannibal-at-North-End-of-World, then
    gives house-plan captions. It then begins a legend: during famine, a young virgin
    travels to her married sister seeking food, purifies herself by bathing, encounters
    a handsome man who becomes her husband and provides salmon and game, and later
    gives birth to a boy who grows into a young man within four days through repeated
    washing and pulling.'
  language: English
  quote_policy: summarized
