- id: obs:4
  text: During a famine in Ilada, many people die; a young virgin survivor has a sister
    married in a distant village and sets out to visit her for food.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The young woman walks day and night, bathes every morning to purify herself,
