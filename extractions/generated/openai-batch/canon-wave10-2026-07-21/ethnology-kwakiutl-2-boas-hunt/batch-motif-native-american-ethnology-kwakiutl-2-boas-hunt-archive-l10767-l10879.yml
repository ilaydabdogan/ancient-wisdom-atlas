  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The elder sister asks for food; the younger sister shares a small piece of
    dried salmon-spawn, and the sisters eat it with dry salal-berries while both report
    starvation in their villages.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: At night the younger sister sees a handsome man who asks about the starvation,
    pities her, promises to make a salmon-weir, and becomes her husband.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The handsome man makes a salmon-trap from small sticks tied with spruce-roots,
