    into a great house where he is told to sit on the right-hand side.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old man addresses the supernatural ones and asks why the visitor has come
    to their supernatural place and winter dancing-place.
  category: speech
