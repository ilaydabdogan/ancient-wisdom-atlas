canonical_text:
  quote: ''
  summary: K!wak!wabalas washes in a lake, eats berries, and sleeps in a house of
    hemlock branches. A laughing woman, DalElsa-'naga, summons him to a great winter-dance
    house. She lifts the edge of moss, and they go under it into a great house where
    supernatural hosts question his purpose. Qoqwadestlla identifies his wish to obtain
    the winter dance, the dance-house, and names. Gwa-'wayeia'na, called Raven, orders
    the dancers to perform the great dance aLaq!Em so that he may know its use. A
    sacred room of hemlock, red cedar-bark, and eagle-down is shown, and named figures
    perform or are called in a sequence involving beating time, singing, masks, a
    rattle, laughter, and dancing around the central fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: K!wak!wabalas washes himself in a lake, gathers berries, returns in the evening,
    washes again, enters his house, and lies down to sleep.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A laughing woman named DalElsa-'naga says she has been sent by friends to
    call K!wak!wabalas into the great winter-dance house.
