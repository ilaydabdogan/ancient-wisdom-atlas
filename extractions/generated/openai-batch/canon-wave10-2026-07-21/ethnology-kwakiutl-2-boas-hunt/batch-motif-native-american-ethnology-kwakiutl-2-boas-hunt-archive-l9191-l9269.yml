    know how the ways are used.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sacred room of the great dance is made with hemlock-trees or hemlock-branches,
    narrow split red cedar-bark strips, and eagle-down.
  category: setting
  evidence_refs:
