canonical_text:
  quote: ''
  summary: 'The passage contains several song texts: farewell songs addressed to siblings,
    friends, and a lover who is leaving for New York; a workingman''s song imagining
    his first-born son as a future hunter, harpooneer, canoe-builder, board-maker,
    and provider; a warrior''s song imagining his first-born son as Hellebore, a future
    war leader who takes heads and names; a chief''s son''s song about future chiefly
    status gained through marriage to princesses and associated coppers, names, and
    crests; and a workingman''s daughter''s song about gathering clams, plants, and
    berries for her mother and old slave.'
  language: English with song vocables and transliterated Kwak'wala forms
  quote_policy: summarized
