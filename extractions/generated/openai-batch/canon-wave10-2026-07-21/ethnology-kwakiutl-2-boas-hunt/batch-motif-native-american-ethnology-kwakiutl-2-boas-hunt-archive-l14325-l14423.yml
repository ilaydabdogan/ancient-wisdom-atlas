canonical_text:
  quote: ''
  summary: A war party launches canoes with fixed seating and a shore ceremony in
    which breath-containing kelp neck rings are transferred to wives and hung near
    beds. The party travels south, sights a fire at the Sanetch coast, plans a night
    stabbing attack on sleeping southern people, kills them under a canoe sail, takes
    an unhurt girl as a slave, cuts off heads with dance-specific cries, and one warrior
    is shot in the shoulder.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men carried the war canoe into deep water so that it did not touch the beach,
    boarded it, and were not to change seats while away at war.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who was not going to war stood outside Q!6mogwa's house with a baton,
    shouted, and beat time on the front boards of the house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The warriors wore kelp neck rings described as containing their breaths.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The wives of the warriors came out with blackened faces and belts, while the
    wives of the crew came out wearing belts but without blackened faces.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The warriors or husbands threw the breath-containing kelp neck rings onto
    their wives; the women ran home and hung the rings at the head ends of their beds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The war party did not ask other tribes to join and intended that none of the
    southern people they saw should live.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Four days after leaving Fort Rupert, the warriors reached the Sanetch coast,
    saw a fire on the beach at the head of a bay, and recognized people there as southern
    people.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: GwaxwaLEylg'ilis told the warriors not to shoot in the dark and said they
    should stab the sleeping targets; he carried a small axe and a large knife, and
    the others had knives.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Q!6mogwa exhorted the warriors not to hesitate, said they had found their
    salmon, and the warriors paddled stealthily to a sandy beach with daggers in their
    mouths.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The people to be killed were sleeping under the sail of a canoe; the passage
    states there were seven of them and two children.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The warriors lowered the mast, spread the sail over the sleepers, sat on the
    sail, and stabbed through it.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: GwaxwaLEylg'ilis found a girl alive and unhurt and took her as a slave.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Several named warriors cut off heads of those killed and uttered cries associated
    with their dances.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: After the head-taking, a gun was fired and G'exk'Enis was shot in the shoulder,
    though he did not feel pain in the wound.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The crew carried property of those killed aboard the warriors' canoes.
  category: action
  evidence_refs:
  - ev:11
