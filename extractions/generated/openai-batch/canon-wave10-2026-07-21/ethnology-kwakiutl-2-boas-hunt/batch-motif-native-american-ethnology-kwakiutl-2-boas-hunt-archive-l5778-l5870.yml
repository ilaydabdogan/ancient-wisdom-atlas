canonical_text:
  quote: ''
  summary: Qlumxod and his wife return with the Naklwaxda'x to their village with
    house-dishes and one hundred ten seals. Qlumxod calls his numaym to plan a seal
    feast. Young men gather firewood and stones; harpooneers cut seals for cooking
    and distribution according to rank. Boxes of water, red-pine tongs, hot stones,
    mats, and a feasting-song are prepared. Young men invite the four numayms on behalf
    of Qlumxod under his feast name, MEiilesid; the guests enter in ranked order.
  language: English
  quote_policy: summarized
