  summary: The passage gives a genealogical and ceremonial account involving named
    dances, the naming of Q!aed, winter-dance events, Heiamas's gift-giving and death
    by bewitching, Q!aed's burial-box renunciation of certain dances, marriage alliance
    with HameLas, transfer of the name and seat L!aqwag'ila, redistribution of marriage
    gifts, and subsequent births, namings, marriages, and gift exchanges.
  language: English with Kwak'wala names and terms
  quote_policy: summarized
