canonical_text:
  quote: ''
  summary: A Kwakiutl winter-dance sequence is organized around marriage-transferred
    privileges. HoLelid, Q!omogwe/Yoxuyagwas, and Head-Princess/Chiton discuss instructions,
    dress the chiefs, invite participants with a formula about washing the eyes and
    entering the winter-dance season, and arrange for Chiton to teach ghost-dancer
    songs to song-leaders at the Supernatural Place. The songs mention being carried
    or led downward by a ghost-woman and accompanied or taken into a house by a supernatural
    watcher.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: HoLelid states that the winter-dance instructions were connected with a marriage
    gift and that his father-in-law is speaking in his house.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Q!omogwe says that the Kwakiutl have not previously done the ghost-dance in
    this manner and that the LlaLlasiqwala do it differently.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Q!omogwe says the privileges were obtained in marriage and calls them a treasure
    from the great chief K'!ade.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At daylight Q!omogwe is identified as using the winter name Yoxuyagwas.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Yoxuyagwas tells the chiefs to dress, wake the tribe, and go to HoLelid's
    winter-dance house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Yoxuyagwas names red cedar-bark for head and neck rings, tallow for faces,
