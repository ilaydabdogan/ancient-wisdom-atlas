  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The named objects are brought and placed next to Head-Princess.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Head-Princess changes to her winter-dance name Chiton and says the name came
