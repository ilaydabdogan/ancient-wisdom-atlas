canonical_text:
  quote: ''
  summary: 'The passage describes repeated LEWElaxa dance nights in which the hehkilal
    appears in regalia, dances around the house fire to songs, returns to a sacred
    room, and is accompanied by distributions of blankets. On the third night the
    event is called the taming of the hehkilal: the dancer runs outside, attendants
    return with his regalia, a whistle is heard from the beach, and the dancer is
    announced as transformed into Q!omogwa. The passage then identifies this as the
    first LEWElaxa in the southern country and turns to Sewid’s marriage, marriage
    gifts, and transfer of winter-dance privileges and names.'
  language: English
  quote_policy: summarized
literal_observations:
