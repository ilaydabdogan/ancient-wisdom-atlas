- id: obs:2
  text: The hehkilal appears wearing a grizzly-bear skin blanket, cedar-bark neck-ring,
    head-mask with ermines, and dancing-apron, and shakes a rattle while dancing around
    the fire in the middle of the house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Llaqwagila and LlaqwasgEm serve as attendants while the Awik'!enox sing four
    songs for the hehkilal’s dance.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the first dance sequence the hehkilal returns to the sacred room and
    LlaqwasgEm distributes one hundred mountain-goat blankets to the Nak!wax'da'x
    and Awik'!enox.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The invited groups return on the following evening, the same dance is repeated,
    and LlaqwasgEm distributes mink and lynx blankets.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: On the third evening the callers announce that the event will be the taming
    of the hehkilal.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: During the third dance sequence, the hehkilal sings two sacred songs, comes
    out dancing, then runs out of the dancing-house near the end of the fourth song
    while Llaqwagila and LlaqwasgEm pursue him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Llaqwagila and LlaqwasgEm return carrying the dancer’s mask, grizzly-bear
