canonical_text:
  quote: ''
  summary: At Ts!EqQl6tEn, a house associated with YaqalEnala is described, and YaqalEnala
    announces that his princess may be married by a son of a chief. Gayosdas, chief
    of the SenL!Em numaym, travels with his group to seek the marriage. Messengers
    report acceptance and connect the visit with entering the winter dance because
    TslExed has disappeared. Gayosdas pays the marriage price, receives the princess
    Gag'aolElaga, and is given a house, names, the winter dance, and four xwexwe.
    During the winter dance TslExed is caught and identified as a cannibal-dancer.
    Gag'aolElaga bears four children, who receive names belonging to the SenL!Em and
    Wiwiiqe lines. The family later departs northward with the Dzonoq!wa house-dish.
  language: English
  quote_policy: summarized
