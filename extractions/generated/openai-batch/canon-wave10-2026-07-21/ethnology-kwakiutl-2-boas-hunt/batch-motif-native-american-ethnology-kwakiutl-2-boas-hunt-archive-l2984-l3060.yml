- id: obs:3
  text: Yox'yagwas calls Lalep!alas, described as never initiated, to take hold of
    the lasso; Lalep!alas pulls it until it nearly comes out, then stops, and his
    father Hanag'ats!e gives cedar-bark blankets.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
