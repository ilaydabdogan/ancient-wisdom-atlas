    lasso, and a father gives away property to the G'exsEm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yox'yagwas says HoLehd should not be the only one to take charge of the magical
    lasso, says he passed through the magical power of the ghost-dance, and takes
    hold of the rope.
  category: speech
  evidence_refs:
