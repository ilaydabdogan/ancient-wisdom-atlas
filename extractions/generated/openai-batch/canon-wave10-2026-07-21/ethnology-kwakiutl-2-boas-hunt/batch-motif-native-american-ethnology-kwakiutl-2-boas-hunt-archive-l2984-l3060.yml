canonical_text:
  quote: ''
  summary: During a ghost-dance ritual, HoLehd and Yox'yagwas direct participants
    to take hold of a magical lasso. Several uninitiated or chiefly participants pull
    the rope, and their fathers or related chiefs distribute property, especially
    cedar-bark blankets. Yox'yagwas calls his son Ts!agEyos, who pulls strongly, after
    which the ghost-dancer Supernatural-Power-coming-up appears and is later carried
    back to a sacred room by the Whale Society. The ritual is closed by barring the
    door, returning soil from boxes into a hole, filling the hole, and describing
    the dancer's cedar-bark and eagle-feather costume. The passage then notes that
    HoLehd's three children had been missing for a month and Chiton asks him to call
    the Whale Society.
  language: English
  quote_policy: summarized
