canonical_text:
  quote: ''
  summary: The passage describes an ordered Kwakiutl family-history dance in a great
    dancing-house. Forty masked dancers, led by XimsEhlEla, dance around the central
    fire to songs of changing tempo, shout together, and return to a sacred room of
    hemlock branches. A woman named ALotEmdalagils then emerges from the sacred room,
    sings and dances around the fire, and returns. Her plant-based ornaments and similar
    ornaments worn by the mask-wearers are described.
  language: English
  quote_policy: summarized
