canonical_text:
  quote: ''
  summary: The passage contains love-songs and parting songs. An absent lover tells
    a beloved not to cry because he is working for her, returning, and paddling toward
    her. After his return, a song says Tsak'edek/Tsakeuek has deserted him, and he
    reproaches her cruelty and indifference, then considers a new beloved. A love-song
    of the dead heard on Shell Island has a dead speaker address a hard-hearted beloved
    and say he will go down to the lower world. A death-bed parting song attributed
    to Ts!esqwane has him farewell friends and kin, ask them not to grieve too much,
    and report that the one who takes care of him said he would not stay away long
    and would come back.
  language: English with song vocables and OCR artifacts
  quote_policy: summarized
