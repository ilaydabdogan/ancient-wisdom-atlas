canonical_text:
  quote: ''
  summary: A speaker warns K!wak!wabalas not to leave the supernatural place and then
    disappears. K!wak!wabalas wakes, washes in the lake, spends the day eating berries,
    returns near evening, washes again, and sleeps in a house of hemlock-branches.
    In a dream a short man appears, asks why he came to the supernatural place, hears
    that he came to obtain supernatural power, identifies himself as Ts!Eqomei.Elsa-na,
    says K!wak!wabalas will obtain a great treasure, and tells him to keep washing
    in the supernatural lake before disappearing.
  language: English
