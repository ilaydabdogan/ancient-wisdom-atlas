canonical_text:
  quote: ''
  summary: The passage recounts chiefly marriages, marriage gifts, inherited names,
    and an origin-story reflection, followed by the opening of a Maamtag'ila history
    in which Q!omogwe^ seeks marriage with Qwaesogut of the Comox. The Maamtag'ila
    travel by canoe, make a marriage payment, and Qwaesogut is ceremonially led with
    masks, rattles, and sacred song into her husband's canoe before an invitation
    to eat.
  language: English with Kwak'wala names and terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Q!umx'Elag'ilis, called the Great-One who came down, marries L!aqwag'ilayugwa,
    a princess connected with Q!EyokwetElasogwi^lak.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Q!umx'Elag'ilis and L!aqwag'ilayugwa have a son, after which Q!EyokwetElasogwi^lak
    prepares a marriage gift for his son-in-law.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first marriage gift includes a named copper, shovel-nosed canoes, slaves
    for bailing, animal-skin blankets, goat-horn spoons used as an anchor-line, and
    a marriage name for a prince.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: K'!adalagilis grows up, marries Gwex'sesElas, and has a son with her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: K!wamaxalas prepares a second marriage gift, including the copper Crane, canoes,
    blankets, seven slaves, goat-horn spoons, and the marriage name GwE^yimdze.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The narrator identifies the preceding actions as deeds of ancestral chiefs
    in a story of origin, and the passage says this ends the wailing of l!aL laqoL,
    the female Nak!wax'da^x.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Maamtag'ila history, Q!omogwe^ calls his numaym into his house, and
    his speaker Da'lEwek'Eme^ explains that Q!omogwe^ wishes to marry Qwaesogut, princess
    of Chief Down-Dancer of the Comox.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Maamtag'ila travel to the Comox village at Puntlatch and make a marriage
    payment out of two canoes before going ashore.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Before Qwaesogut enters the canoe, the Comox beat the front boards of Down-Dancer's
    house, a thundering noise is heard, the men say Hum, and shell rattles sound.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Qwaesogut is led by four men wearing xwexwe masks, sings her sacred song,
    goes into Q!omogwe^'s canoe, and then Down-Dancer invites his son-in-law and crew
    to eat.
  category: sequence
  evidence_refs:
  - ev:7
