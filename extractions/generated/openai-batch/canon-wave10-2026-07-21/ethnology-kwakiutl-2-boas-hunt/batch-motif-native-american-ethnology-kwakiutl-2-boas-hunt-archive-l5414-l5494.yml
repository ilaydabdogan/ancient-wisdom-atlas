canonical_text:
  quote: ''
  summary: The passage describes a great feast in which ranked groups receive slaves,
    canoes, and blankets; subsequent births in the family of Maxuyalidze and WawalaxElag'ilak;
    marriage gifts of blankets and names; the son's dance; the arrangement of a second
    marriage to QlexsesElas, a princess of Qlumxod; payment of marriage money; a marriage
    mat and further names; redistribution of blankets; name changes; and the birth
    and naming of QlexsesElas's son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maxuyalidze gives four slaves and four large canoes to holders of first seats
    in four named numayms.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the first-seat gifts, Maxuyalidze gives eighty sewed blankets to chiefs
    of second rank and their children, and two hundred and forty cedar-bark blankets
    to lower-rank people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The distribution is described as a kind of great feast called giving away
    at the time of the great feast, and the passage says very few give this kind of
    feast.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kwax'ilanokume gives marriage gifts of blankets, cedar-bark blankets, and
