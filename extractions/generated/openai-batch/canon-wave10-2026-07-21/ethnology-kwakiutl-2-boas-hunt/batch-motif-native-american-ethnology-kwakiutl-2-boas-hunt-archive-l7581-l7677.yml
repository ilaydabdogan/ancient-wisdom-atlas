canonical_text:
  quote: ''
  summary: The passage recounts Lalep !alas's soul being taken from his sickbed by
    canoe to a large house identified as a gathering-place of the souls of the dead.
    He sees house-front figures including a raven, a double-headed serpent, a wolf,
    and a man, is warned to flee and imitate the house, dies again, is buried on a
    tree, and is carried home by Bluejay over a mountain. His soul re-enters his dead
    body, he revives, and people later build a house like the one he saw. The passage
    then begins another account involving Yix'agEme, Waxap !alaso, Xaxosenaso, a remembered
    warning about Head-Winter-Dancer, and Xaxosenaso's departure upriver to a cascade
    and a hole in the rock.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man enters the sick man's hut, takes the soul of Lalep !alas, and brings
    it aboard a canoe; Lalep !alas hears people in the hut say he is dead and hears
    women wail.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After paddling, the canoe party arrives at many houses with many people, and
    they enter a large house.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the large house, Lalep !alas is seated near the door and sees a great raven
    in the doorway, a double-headed serpent on the front outside of the house, and
    a wolf standing on the head of a man in the middle of the serpent.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A handsome man tells spirits to stand, be happy, and dance; the passage explains
    that this concerns the salmon speared by Lalep !alas and says the bright salmon
    was a double-headed serpent.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man tells Lalep !alas to run away or he might stay away, tells him to look
    at the house and imitate it, and says the house is the gathering-place of the
    souls of the dead.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: When the spirits begin to sing, Lalep !alas runs out of the house and along
    the beach to a place where eagle-down is thick; his breath gives out and he dies
    again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Lalep !alas is taken and buried on a tree without a coffin at the village
    of Winalag'ilis.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Bluejay asks Lalep !alas whether he wants to go home, offers to carry him,
    and Lalep !alas sits on Bluejay's back.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bluejay flies inland over a great mountain and brings Lalep !alas near his
    home.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Lalep !alas enters his hut, sees his dead body, and his soul enters it; the
    body becomes warm, and the next morning people find him alive when they come to
    wail and bury him.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: People make a house like the house where Lalep !alas had been, and the passage
    states that the numaym own the house.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Yix'agEme and Waxap !alaso are said to have claimed XndzEdzalis as their property;
    Waxap !alaso moves away with his prince Xaxosenaso and builds a house elsewhere.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Waxap !alaso remembers an unnamed visitor from Xoxopla who warned about Head-Winter-Dancer,
    described as having a great treasure and going around the world to play with people
    of supernatural power.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Waxap !alaso stays awake at night, scolds his prince in the morning for sleeping
    and for not thinking of Head-Winter-Dancer, and tells him to wash in the river
    TslElgwad.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage states that tongs were taken up and a prince was struck with them;
    the wording is difficult because of the text condition.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Xaxosenaso leaves the house wanting to kill himself, goes upriver to the cascade
    of TslElgwad, and sees a hole in the rock on the river bank.
  category: sequence
  evidence_refs:
  - ev:11
