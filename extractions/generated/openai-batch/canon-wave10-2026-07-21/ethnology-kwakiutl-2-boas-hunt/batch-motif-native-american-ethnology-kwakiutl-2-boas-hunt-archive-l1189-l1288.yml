canonical_text:
  quote: ''
  summary: Chief TslEx-ed gives XosEmdaas names, dances, a cedar-bark box, blankets,
    mats, a named house, animal-form dishes, and feast/chiefly names as marriage gifts.
    The narrator emphasizes ancestral names and pride. XosEmdaas and relatives disappear
    into the woods for four months; dancer figures are then captured, fed with two
    killed slaves, and dressed with blankets, cedar-bark rings, masks, and rattles.
    The account identifies this as the first winter dance of the Gwa'sEla. TslEx-ed
    dies after asking XosEmdaas to take his place; XosEmdaas becomes TslEx-ed and
    is treated as chief. Yaqoklwalag'ilis later travels north, builds a house at GweqElis
    with his family, dies, and is succeeded by his youngest prince, who receives canoe
    visitors, feeds them, and exchanges lineage identities with them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: TslEx-ed tells XosEmdaas that names and the great dance will go to him, including
    the cannibal-dancer role, the rich-woman dance, the fire dance, and the attendant
    of the cannibal-dancer.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gifts include a carved box containing red cedar-bark for the great dances,
    mountain-goat blankets, grizzly-bear blankets, lynx blankets, dressed elk-skin
    blankets, and mats.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: TslEx-ed also gives XosEmdaas the named house K'!awats!e, house-dishes in
    grizzly-bear, wolf, eagle, and double-headed serpent forms, a great feast name,
    and additional chief names.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The narrator says the names come from his ancestor and states that he feels
    proud rather than ashamed of what the chiefs, his ancestors, did.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At night XosEmdaas, his sister 'max'mEwidzEmga, Laqilayugwa, and 'maxuyalidze
    disappear and stay in the woods for four months.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the four-month stay, the cannibal-dancer, rich-woman-dancer, fire-dancer,
    and attendant of the cannibal-dancer are captured by ancestors of the Nak!wax'da-x.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: TslEx-ed gives two slaves as a marriage gift to serve as food for the cannibal-dancer
    and rich-woman-dancer, and the two slaves are killed to be eaten.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the cannibal-dancer and rich-woman-dancer finish eating, black-bear
    blankets, cedar-bark neck rings, and thick headrings are placed on them; the rich-woman-dancer's
    red cedar-bark is thinner than the cannibal-dancer's.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The cannibal-dancer has a double-headed mask with a crooked-nose mask in front
    and a raven-mask in back; the rich-woman-dancer has a large rattle; the fire-dancer
    and attendant have thin red cedar-bark.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: The passage calls this the first winter dance of the Gwa'sEla and links it
    to the narrator's ancestor, who married daughters of chiefs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Before dying, TslEx-ed asks XosEmdaas to take his place; after TslEx-ed dies,
    XosEmdaas takes his place, receives the name TslEx-ed, and is considered a chief
    by the ancestors of the Nak!wax'da-x.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Yaqoklwalag'ilis goes north, arrives at GweqElis, builds a house there with
    his children and wife, and later dies; his youngest prince 'maxuyalidze takes
    his father's place.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A canoe comes to the beach of 'maxuyalidze's house; the visitor's children
    enter, are fed roasted sockeye-salmon and seal-blubber, and the host and visitor
    ask each other who they are.
  category: sequence
  evidence_refs:
  - ev:6
