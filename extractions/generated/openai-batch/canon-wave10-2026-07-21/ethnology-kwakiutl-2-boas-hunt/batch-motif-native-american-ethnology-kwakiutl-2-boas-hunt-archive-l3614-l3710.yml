canonical_text:
  quote: ''
  summary: 'The passage first recounts LEnslEndzEm leaving his elder brothers by canoe,
    landing at a bay with killer-whales, naming the bay, building a house, and becoming
    connected with Madilbe ancestry and privileges said to have been taken from Llaqwagila.
    It then recounts a Comox marriage alliance: HeklutEn’s son is married to Calling-Woman,
    receives a new name, seat, ceremonial property, and the double-headed serpent
    winter-dance privilege; a serpent mask is carved, the son performs the winter
    dance, and the mask is taken to Comox, where the passage identifies this as the
    first Comox winter dance.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: LEnslEndzEm considers leaving his elder brothers because they make him angry,
    rises near daylight, goes to the beach, boards his father’s small canoe, and paddles
    away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: LEnslEndzEm passes Tsaxis at daylight, travels through the day, lands at a
    good beach, sees many killer-whales, and the killer-whales leave the bay after
    he lands.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: LEnslEndzEm names the bay Maxiis and builds a house there like the house of
    his elder brother Llaqwagila at K'!6dagala.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage identifies LEnslEndzEm as ancestor of the Madilbe and says the
    relevant privileges were obtained by theft from his master Llaqwagila.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator states that the tribe and name of LEnslEndzEm’s wife are unknown,
    but says he had four children and that there are four Madilbe numayms.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: HeklutEn, chief of the Comox ancestors at PEntlatch, marries the princess
    Teseila; their son is born, blankets are given away, and the child is named NEmnEmEm.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: HeklutEn and Ts!ananamex seek a wife for NEmnEmEm, travel to YaqoLElas of
    the Wiwiiqe, and HeklutEn pays marriage money for Calling-Woman.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: YaqoLElas gives his son-in-law a new name, YaqalEnala, and gives him the seat
    of YaqoLElas’s deceased father.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: YaqalEnala gives a potlatch using his wife’s marriage mat, which consists
    of mountain-goat skins and dressed skins, to the ancestors of the Wiwiiqe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The double-headed serpent, the name of the double-headed serpent dancer, and
    the Sparrow Society name Ts!aq!wa are given in connection with the marriage and
    winter dance.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: YaqoLElas asks a carver to go into the woods and make a double-headed serpent
    mask; the carver makes it without HeklutEn and his son knowing what he is doing
    for them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: In winter, YaqalEnala disappears, is caught by the ancestors of the Wiwiiqe,
    is instructed, is taken into the dancing-house, and dances wearing the double-headed
    serpent mask.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: HeklutEn asks to take the double-headed serpent mask home so that his Comox
    tribe may see it, and YaqoLElas sends him home with the mask.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: The passage states that this was the first winter dance of the Comox and that
    it came from the Wiwiiqe of the Gigilgam numaym of the Legwilda'x.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: Calling-Woman gives birth to a daughter, Gag'ołElaga, and a son, TslEX'ed;
    later YaqoLElas gives his house to his son-in-law as a marriage gift.
  category: sequence
  evidence_refs:
  - ev:12
