canonical_text:
  quote: ''
  summary: The passage describes a Kwakiutl winter-dance calling procedure, succession
    after Potlatch-Dancer's death, Copper-Dancer's marriage to Head-Princess, the
    transfer of a winter-dance box and copper, name changes and potlatches, and a
    later winter-dance event in which the house trembles, ghost-cries are heard, and
    Qlex'sesElas runs out after circling the fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four speakers call from house to house, and the men, wives, and children come
    into the house with them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described calling procedure is called “single call” by the ancestors of
    the Kwakiutl and is associated with the first appearance of the supernatural power
    of the winter dance entering the house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A winter-dance whistle continues sounding behind a curtain in the rear of
    the house while the assembled people follow winter-dance rules.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: After Potlatch-Dancer dies, Qlomx'od takes his father’s place, gives a potlatch,
    and has the name Copper-Dancer.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Copper-Dancer seeks to marry Head-Princess, and the Kwakiutl travel by canoe
    to the village at Pieleuis to make the marriage payment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: K'!ade comes out carrying a winter-dance box, and Head-Princess comes out
    carrying a named copper.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: K'!ade calls Copper-Dancer from his traveling-canoe to receive both the winter-dance
    box and Head-Princess.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'K''!ade tells Copper-Dancer that the box contains four dances: a war-dance
    with a bird in its belly, a throwing-dance, the hamshamts!es, and a ghost-dance
    named Supernatural-Power-coming-up.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Head-Princess goes with her husband while still carrying the copper, and K'!ade
    changes Copper-Dancer’s names.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Copper-Dancer, now named YaqEyalisEm, takes the copper, thanks his father-in-law,
    promises a potlatch with the copper, and later names his younger brother Hamisk'Enis.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: YaqEyalisEm clears his house floor, sends four speakers to call the Kwakiutl,
    gathers the men, and makes a potlatch while it is still the secular season.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: YaqEyalisEm bars the door so that his tribe cannot leave, after which the
    house trembles and rumbles four times and the cause is unknown to the Kwakiutl.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: After the rumbling, a ghost-cry is heard four times as though many men were
    shouting.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Qlex'sesElas comes from the rear of the house, goes around the central fire,
    and runs out when YaqEyalisEm opens the door; the ghost-cry is heard again.
  category: action
  evidence_refs:
  - ev:8
