canonical_text:
  quote: ''
  summary: The passage recounts marriages and exchanges through which houses, carved
    posts, food, coppers, names, and several winter-dance privileges are transmitted
    among Bellabella, Kwakiutl, DzEndzEnx'q!ayo, Mamalaleqala, and Q!omoya'ye families
    and groups. It includes a secret planning meeting, ritual disappearances before
    dance roles, and named origins or transfers of dance names and privileges.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Q!aed, described as father-in-law, gives carved house posts and the house
    to ^max'mEwisagEme^ after a speech ends.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: "^max'mEwisagEme^ lives with a Bellabella wife and has four children named
    LaLeliL!a, K'anelk'as, Llaqwael, and Gweno."
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: When LaLeliL!a and K'anelk'as are grown, ^max'mEwisagEme^ returns to Tslade
    with them, leaving his wife and the two younger children with their mother among
    the AwIl!edEx.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: "^max'mEwisagEme^ brings a privilege-box, many kinds of food, and two expensive
    coppers named Leta and Sea-Lion."
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: After returning near winter-time, ^max'mEwisagEme^ arranges a secret meeting
    after midnight with chiefs of the DzEndzEnx'q!ayo.
  category: setting
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: At the meeting he says he will give a winter dance using the food and coppers
    and that LaLeliL!a will disappear to become a cannibal-dancer while K'anelk'as
    will disappear to become a rich-woman dancer.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: LaLeliL!a disappears near daylight, K'anelk'as disappears in the evening,
    and two young male relatives are selected to disappear as a fire-dancer and a
    cannibal-tamer.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: "^max'mEwisagEme^ gives the winter dance with what he received in marriage
    from the AwIl!edEx of the Bellabella, and new dance names are assigned."
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that Bellabella dances and names came first to the Kwakiutl
    through this sequence.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: LaLeliL!a, later called DoqulasEla, marries LElEndzEwek'e, the princess of
    Lalak'ots!a, and their children receive names from the Mamalaleqala father-in-law
    side.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Lalak'ots!a pays a marriage debt to DoqulasEla and gives him dance privileges
    including the speaker's dance, the great dance from above, the war-dance, and
    the double-headed-serpent dance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: K'anelk'as marries Yaqok!walag'ilis, chief of the Q!omoya'ye, who receives
    the house, several dances, and names; the passage states that the Q!omoya'ye therefore
    have Bellabella names.
  category: relationship
  evidence_refs:
  - ev:8
