canonical_text:
  quote: ''
  summary: A ceremonial sequence describes XimsEhlEla calling named beings or dancers
    from a sacred room of hemlock branches. Song-leaders keep time and sing; called
    figures answer with the spirit shout “Hoho,” emerge wearing masks according to
    their kind, dance, and take places in order. Several masks have distinctive materials
    or forms, including moss, stone, and a crooked beak. One dancer circles the fire
    in the middle of the house. A Woman-giving-Birth figure performs a birth scene;
    a masked child rises and dances, and a Midwife figure emerges and dances around
    her. Further named figures are then called to dance.
  language: English
  quote_policy: summarized
