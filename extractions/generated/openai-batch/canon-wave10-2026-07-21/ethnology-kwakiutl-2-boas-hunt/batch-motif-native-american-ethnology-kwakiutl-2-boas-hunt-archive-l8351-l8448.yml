canonical_text:
  quote: ''
  summary: Waxaplalaso instructs the Sparrow Society about learning four songs associated
    with Kanogwis and seeing supernatural treasures. Men are invited to a wooded sitting-place
    where songs are secretly taught. A common man is summoned and required by the
    chief of the Sparrows to take up a red cedar-bark head-ring in order to remain
    alive and give a winter dance the following year; this act is called Begging-for-One's-Life.
    An explanatory episode describes a winter dance in which those who are to disappear
    go into the woods where whistles sound, while the child Ts!ox"ts!aes is held back
    by the chief of the Sparrow Society, adorned with red cedar-bark rings, given
    a rope belt and Sparrow cane, and declared a member of the Sparrow Society.
  language: English
  quote_policy: summarized
