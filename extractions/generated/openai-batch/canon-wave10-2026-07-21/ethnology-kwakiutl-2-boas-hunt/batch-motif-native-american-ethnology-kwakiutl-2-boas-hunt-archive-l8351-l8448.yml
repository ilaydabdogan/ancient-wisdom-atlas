  text: Waxaplalaso tells the Sparrow Society that they will sit at a chosen place
    and learn four songs associated with Kanogwis or Nalogwis.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Waxaplalaso says the group will see the supernatural treasures of his unnamed
    prince when he comes out of the woods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man sent by Waxaplalaso whispers invitations for men to go to the sitting-place,
    which is also described as a place in the woods where songs are secretly taught.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Waxaplalaso sings songs of Kanogwis, described as a hamshamts!es who has Head-without-Body
    for his sacred room.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the song leaders know the four songs, four men are sent to summon an
    unnamed man belonging to the common people.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief of the Sparrows asks the common man to sit apart and says that no
