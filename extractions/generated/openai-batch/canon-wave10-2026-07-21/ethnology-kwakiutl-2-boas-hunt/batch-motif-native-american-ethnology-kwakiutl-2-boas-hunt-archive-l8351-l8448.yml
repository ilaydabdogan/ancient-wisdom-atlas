  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The chief of the Sparrows removes his red cedar-bark head-ring, places it
    on the ground, and tells the man to take it up if he wishes to remain alive and
    give a winter dance the next year.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The common man takes up the red cedar-bark, hides it in his armpit, and is
    said to have saved his life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The procedure of taking up red cedar-bark placed on the sitting-place is called
    Begging-for-One's-Life and is connected with disobeying the chief of the Sparrow
    Society.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the winter-dance explanatory episode, people who are to disappear are placed
    in a row, viewed, and then go into the woods where whistles sound.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ts!ox"ts!aes goes backward and is taken and held by the chief of the Sparrow
    Society while the supernatural spirit and those who had disappeared are frightened
    away.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The chief places red cedar-bark rings on Ts!ox"ts!aes, gives him a rope belt
    and thin Sparrow cane, and says he now has a name and is a member of the Sparrow
    Society.
  category: action
  evidence_refs:
