- id: obs:1
  text: A chief who held the name Q!umx'od gave that name in marriage to his son-in-law
    and then took another of his own family names.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The transfer of names is accompanied by property given to the tribe and by
