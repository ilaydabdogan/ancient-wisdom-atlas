canonical_text:
  quote: ''
  summary: The passage describes hereditary names, chiefly names, and feast names
    transferred through marriage, potlatch, property, and kinship succession. It also
    describes an unformalized marriage whose children were socially disfavored but
    later taken as dancers by their uncle, a shamanic name associated with washing
    a child in water for purification, maternal and paternal name inheritance, and
    a levirate marriage in which a widow's son receives names and feast privileges.
  language: English
  quote_policy: summarized
