  text: The chief is described as having multiple family names, including names described
    as derived from mountain names.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The chief's numaym did not object to his taking another family name because
    the names were his own family names.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Agwila and Alak'ilayugwa are described as not having performed the formal
    marriage ceremony, and the passage calls this an irregular marriage.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The children of Agwila and Alak'ilayugwa are described as not counted and
    not well treated because of their parents' marriage status.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Q!umx'od pitied his two nephews and took them as his dancers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The name Qasnomalas is described as a shaman's name and as an old name for
    a great shaman.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: A son or daughter connected with the Qasnomalas name was to be washed in water
    for purification, with the wish that the child would become a shaman and bear
    the name.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Lalep!alas made a potlatch for her son P!asElal and gave him a name from her
    side.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage says some chiefly couples both give potlatches so that their son
