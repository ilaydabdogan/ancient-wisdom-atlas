  evidence_refs:
  - ev:4
- id: obs:12
  text: Names, seats, and privileges are described as being kept within the family
    through this dual-sided naming practice.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: After Sesaxalas died, Llasotiwalis married the widow of his elder brother;
