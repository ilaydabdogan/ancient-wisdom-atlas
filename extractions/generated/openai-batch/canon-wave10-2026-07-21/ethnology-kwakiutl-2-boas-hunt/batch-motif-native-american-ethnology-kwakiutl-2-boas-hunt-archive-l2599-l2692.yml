canonical_text:
  quote: ''
  summary: 'Head-Princess seats chiefs and Qlex''sesElas in the winter-dance house
    near a dug hole, explains the ancestral lasso used to catch the ghost-dancer,
    and describes the ritual sequence: seating of dance groups, rattles and secret
    songs around the central fire, cedar-bark given to cannibal-dancers, a procession
    toward the ghost cry, participants falling as if dead, revival by sprinkling urine,
    return to the house, secret rooms, property giving, name change, and transfer
    of the cedar-rope lasso to HoLelid.'
  language: English
  quote_policy: summarized
