canonical_text:
  quote: ''
  summary: A chiefly marriage is arranged between G'ayosdas and Klamaxalas, involving
    approval by his numaym, marriage payments, blankets as marriage mats, name transfers,
    and winter-dance privileges. After receiving the name Yaqostod, he asserts his
    father's head seat and places his younger brother next to him, distributing blankets.
    A daughter is born and receives a name through the maternal grandfather. Later
    Yaqostod seeks a second wife; Klamaxalas approves if the bride is the high-ranking
    princess Alak'ilayugwa. The second marriage brings twenty-five blankets, woman
    slaves, another name for the son-in-law, and further dancer privileges.
  language: English
  quote_policy: summarized
