canonical_text:
  quote: ''
  summary: 'The passage describes part of a winter-dance procedure involving the Sparrow
    Society: a man is named and associated with future leadership, red cedar-bark
    is treated as a powerful ritual object for purification, leaders plan to surround
    a novice, hereditary heralds are dressed in cedar-bark regalia and sent to call
    participants, and uninitiated people are invited to witness from near the door
    of the dance-house.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker says the man should no longer be called Ts lox'ts!aes but Q!Emtq!adas,
    and says that when old he will be chief of the Sparrow Society.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the men take up red cedar-bark, a speaker calls it their master and
    says he will put it away in his box so that it may help in purification until
    next winter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief of the Sparrow Society says they have acted correctly because their
    friend has taken the red cedar-bark to make them happy next winter.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The chief of the Sparrow Society discusses an attempt to surround the novice
    during the night and names categories of performers who will enter or wipe the
    floor.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The same speech places the ghost dancer, described as supernatural, at daylight
    in the morning; a note says the ghost dancer will finally succeed in bringing
    back the novice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Four men whose hereditary office is to walk and call participants are summoned
    when it is getting dark.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Waxaplalaso' gives each of the four callers a cedar-bark blanket, gives them
    new flat red cedar-bark, and places broad or spread cedar-bark around their necks
    and heads.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The callers put on cedar-bark rings and eagle down, blacken their faces with
    charcoal, and carry a shaved round cedar stick called the cane of the Sparrows.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The four callers leave the winter-dance house, go to the east end of the village,
    enter houses, stand inside the door, and recite formal calls.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The callers make repeated rounds through the houses, distinguishing earlier
    calls from the later statement that they now really go back to call.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Sparrows and their wives arise and go to the house in which the novice
    is to be surrounded.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The four heralds say they will look for a face, invite a man sitting in a
