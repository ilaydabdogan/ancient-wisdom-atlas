canonical_text:
  quote: ''
  summary: The passage describes a potlatch contribution in which blankets are gathered
    for a chief and redistributed, a rule forbidding marriage between same-mother
    siblings, and property-right rules for hunting grounds, mountain-goat hunting
    grounds, and berry-picking grounds owned by numayms and defended with violence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man next to the chief says he is annoyed that the chief asks too often for
    property, and proposes giving one hundred blankets while asking others for smaller
    blanket contributions.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The blankets are carried in, piled up, and the contributing men sit beside
    the blankets they are going to contribute.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man next to the chief stands beside his one hundred blankets and asks
    the numaym to treat the chief as a chief.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker tells the chief that the people came with good hearts and are
    giving property for the chief's potlatch.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker connects the gift to his name and to the rank of his child's new
    name, then calls for a count.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the contributions are put down, the chief asks for five hundred blankets
    from his room to be piled on top of the contributed blankets.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The numaym fellows do not expect the chief to return what is given for the
    potlatch, and the chief gives the blankets away in the potlatch.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A man cannot marry his sister when they have the same mother, even if their
    fathers are different men.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hunters of one numaym cannot hunt on the hunting grounds of another numaym
    because hunters own their hunting grounds.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: When a hunter sees another hunter on his hunting ground, they fight, and often
    one or both are killed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mountain-goat hunters of different numayms fight when they meet, and a beaten
    hunter may be pushed down the mountain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In an example at Dzawade, a Madiibe' man sees two mountain goats, leaves his
    canoe and wife, and afterward his wife hears sounds like men quarreling; he does
    not return and is found below as blood on rocks.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Each numaym owns berry-picking grounds for several kinds of berries and fruit
    used for food and counted in feasts.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Owners watch berry-picking grounds against other numayms, and people who come
    to steal berries are fought, with deaths often resulting.
  category: action
  evidence_refs:
  - ev:7
