canonical_text:
  quote: ''
  summary: A winter dance-house ritual is described. The hamshamts!Es, later named
    Nanogwis, cries out, dances with fast and slow song-beating, circles the central
    fire, and repeatedly enters the mouth of the sacred room with the Head-without-Body.
    Four bitten companions become his assistants. Four heralds call members of the
    Sparrow Society to help restore, tame, quiet, and heal Nanogwis. He emerges wearing
    a cannibal-mask with a revolving top, later appears with red cedar-bark head-
    and neck-rings, and finally enters the sacred room after which he is quieted.
    The passage adds that tongs and white cedar-bark were not used in this case as
    in a modern hamats!a practice.
  language: English
  quote_policy: summarized
