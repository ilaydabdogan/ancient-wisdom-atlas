canonical_text:
  quote: ''
  summary: 'At a chiefs'' feast, Wagides boasts that he is not afraid of anyone. Several
    chiefs respond by breaking valuable coppers on his account and disposing of or
    giving away copper pieces. Wagides cannot match the three coppers and is ashamed;
    the text says he becomes a slave again. A later note describes the death of the
    eldest child of Wagides and his wife and the placement and naming of younger children
    within named numaym affiliations. The passage then begins a tale explaining why
    a double-headed serpent is on the outer front of Lalep!alas''s house at Q!Eg''es:
    young men fail to spear a bright salmon, Lalep!alas spears it, becomes sick after
    hiding it, and hears a canoe arrive with a summons.'
  language: English
  quote_policy: summarized
