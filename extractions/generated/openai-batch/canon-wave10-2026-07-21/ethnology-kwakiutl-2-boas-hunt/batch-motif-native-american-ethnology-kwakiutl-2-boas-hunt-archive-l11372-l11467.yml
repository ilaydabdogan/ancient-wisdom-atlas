canonical_text:
  quote: ''
  summary: A younger sister opens a carved box after hearing a voice from inside.
    A handsome man associated with abalone shells emerges, names her Qwexagas and
    ExtslEmga, marries her, folds the box small, and brings it to her father AlnEkwala.
    The man identifies himself as Yamadzalas, son of LEg'ex, and displays the box
    as a privilege containing all winter dances. A second origin section begins with
    XwelageLas, a common hunter and salmon-fisher of the Gwa'sEla, who sees water
    squirting from the beach, digs at the spot, and finds four pearl shells.
  language: English
  quote_policy: summarized
