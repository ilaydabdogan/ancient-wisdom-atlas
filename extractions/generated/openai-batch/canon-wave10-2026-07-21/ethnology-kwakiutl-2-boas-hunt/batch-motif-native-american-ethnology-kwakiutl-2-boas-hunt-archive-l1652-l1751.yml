canonical_text:
  quote: ''
  summary: The passage describes the transfer and public establishment of the LEWElaxa
    dance. LlaqwasgEm receives the dance but assigns it to his prince Sewid, who is
    to take ceremonial names and become a helik'ilal. Gifts are distributed to chiefs
    and tribes. Llaqwag'ila teaches songs, orders a sacred room with a moon and toad
    image, explains the dance's marriage-gift provenance from the OyalaidEx of Bella
    Bella, has a mask of Q!omogwa made, sends speakers to summon dancers, appoints
    LlaqwasgEm as future assistant, and introduces sacred songs about escaped supernatural
    power.
  language: English
  quote_policy: summarized
