canonical_text:
  quote: ''
  summary: The passage recounts a sequence of marriage gifts, name transfers, invitations
    to guests, seal feasts, and blanket distributions. Hex'hak'in gives names and
    property to his son-in-law, who hosts the ^nenelk'!enox, feeds them seals from
    house-dishes, and gives away blankets. The narrator frames these actions as an
    ancestral precedent for rank, family identity, and later name inheritance through
    both marital sides.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hex'hak'in gives his son-in-law the name ^walas ^nEmogwis, house-associated
    items or beings, two slaves, and blankets as property connected with the house
    and wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hex'hak'in sends slaves to hunt seals, and he and ^walas ^nEmogwis go to invite
    the ^nenelk'!enox, who live upriver near the lake of Gwane^.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The slaves return with fifty seals, which Hex'hak'in gives as a wedding-feast
    for his son-in-law to feed the invited ^nenelk'!enox guests.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fifty seals are placed in four house-dishes before the guests, and after
    the guests eat, sea-otter, marten, and black-bear blankets are given away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage explicitly states that this was the first time property was given
    away with a seal feast in house-dishes and the first time the Gwa^'sEla made a
    potlatch at a feast.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The speaker mocks lower chiefs' claims to higher rank and says his ancestor
    was a chief who gave away property at a feast.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After a girl child is born, Hex'hak'in arranges another marriage gift of blankets
    and a renewed invitation to the ^nenelk'!enox because of the child's high rank.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The girl is given one name from the father-in-law's side and another name
    from ^walas ^nEmogwis's side.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a son is born, Hex'hak'in gives additional blankets, gives the son-in-law
    a new name, and gives a name to the boy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: LaleliL!adze gives his son a name from his own side, gives away more blankets
    to the ^nenelk'!enox, and publicly announces his own changed name and the son's
    names from the mother's and father's sides.
  category: sequence
  evidence_refs:
  - ev:7
