canonical_text:
  quote: ''
  summary: The passage describes ranked Eagles among Kwakiutl tribes, the fixed order
    of seats maintained by name-keepers, hereditary succession rules for Eagle seats
    and head-chief names, restrictions on transferring names and privileges through
    marriage, and the life-stage names and gift-giving practices associated with one
    GwetEla numaym head chief.
  language: English with Kwak'wala names and transliterations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two named persons or title-holders are identified as Eagles of specific numayms,
    and the passage states that the Eagles belong to three tribes while the Q!omk'!ut!Es
    have no Eagle.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The order of the Eagles is not changed when property is given to invited tribes.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:3
  text: If a name-keeper places one Eagle over another by mistake, the Eagle quarrels
    with the one named before him and may break his copper and give the broken piece
    to the name-keeper.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a name-keeper becomes weak from old age, he gives the office to his eldest
    son, and the passage states that the name-keeper is not a nobleman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Four name-keepers are named, each with a seat in a specified numaym.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: An Eagle gives his seat to his eldest son; if the eldest child is a girl,
    she takes her father's Eagle seat even when she has a younger brother.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The younger brother of the eldest child receives an Eagle seat only when the
    eldest child dies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The non-changing of names and seats is traced to the time when O^maxt!alaLe^,
    ancestor of the numaym G"Ig'ilgam of the Q!omoya^ye, made the seats of the Eagles.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Names of head chiefs are said not to leave the family of the head chiefs of
    the numayms and to pass only to the eldest child; the passage calls these names
    myth names.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The names and privileges that a head chief obtains in marriage from fathers-in-law
    may be given in marriage, but he cannot give his own privileges to his son-in-law.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: If a head chief has no son but has a daughter, she takes her father's place
    as head chief; if he has no child, he may place the eldest child of his younger
    brother in his seat, even if that child is a girl.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: For the Matimtag'ila numaym, the head chief is named ^maxuyahdze, with earlier
    life-stage names given as YaqoLas, L!esdaq, and Wawalk'ine^.
  category: attribute
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
- id: obs:13
  text: The young man's name L!esdaq is associated with giving property among young
    men; the passage contrasts earlier paddles and mats with recent shirts and kerchiefs.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The ten-month child name Wawalk'ine^ is associated with singeing the hair
    of the head, painting with ocher, putting on thunderbird straps of dressed deer-skin,
    and the whole tribe painting themselves.
  category: action
  evidence_refs:
  - ev:11
