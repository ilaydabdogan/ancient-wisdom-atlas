candidate_motifs:
- id: motif:1
  label: Marriage transfer of ceremonial prerogatives
  taxonomy_refs:
  - sacred_exchange
  basis: The xwexwe, personal or ceremonial names, and camas-roots are explicitly
    given as a marriage present to Q!omogwe; later the xwexwe and name Hek!utEn are
    given to Copper-Dancer through marriage.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:10
  confidence: high
  cautions: The passage presents this as genealogical and ceremonial transfer; broader
    ritual meaning should not be inferred beyond the text.
- id: motif:2
  label: Ritual pacification and containment of masked supernatural dancers
  taxonomy_refs: []
  basis: Four xwexwe masked dancers perform, are addressed as supernatural ones to
    be driven into their room, and withdraw behind the curtain after shouts and goat-skin
    strips are used.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The text does not explain the full symbolism of the curtain, goat-skins,
    or masks.
- id: motif:3
  label: First encounter with camas through feast and exchange
  taxonomy_refs: []
  basis: 'The passage twice marks camas as new to Kwakiutl ancestors: first tasting
    during the initial event and first seeing when Q!omogwe gives a feast with twenty
    boxes of camas-roots.'
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage identifies first tasting and first seeing but does not frame
    Q!omogwe as a culture hero.
- id: motif:4
  label: Descent and marriage validate names and dances
  taxonomy_refs:
  - royal_legitimacy
  - sacred_exchange
  basis: Names and dances move through marriages, children, property distributions,
    chiefs, a princess, and numaym affiliation.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The royal-legitimacy taxonomy is approximate; the passage uses chiefly
    and numaym status rather than a monarchy.
- id: motif:5
  label: Return carrying ritual repertoire to another group
  taxonomy_refs:
  - return
  basis: Qwaesogut returns home to Comox with two children and takes four dances,
    songs, and names that had been used at Qalogwis.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The return is domestic and genealogical, not a heroic return journey.
