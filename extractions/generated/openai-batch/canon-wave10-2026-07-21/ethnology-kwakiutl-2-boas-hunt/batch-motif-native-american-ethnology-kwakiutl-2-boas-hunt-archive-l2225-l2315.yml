canonical_text:
  quote: ''
  summary: Q!omogwe and his Comox wife are present while the xwexwe is sounded and
    ritually pacified. Down-Dancer arranges for the xwexwe to be given to Q!omogwe
    as a marriage gift, along with names and twenty boxes of camas-roots. Q!omogwe
    returns to Crooked-Beach, feasts the Kwakiutl ancestors with camas, has children,
    changes his own name, and establishes dance names and roles. After separating,
    Qwaesogut returns to Comox with two children and takes four dances, using the
    same songs and names. Later Hek!utEn/YaxLEn marries K'anelk'as, receives another
    name, names daughters through property distribution, and gives the xwexwe and
    the name Hek!utEn to Copper-Dancer through his daughter's marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Q!omogwe and his wife sat near the rear curtain before the xwexwe and ate
    steamed camas; the passage states this was the first time the ancestors of the
    Kwakiutl tasted camas.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Down-Dancer told his people, the ancestors of the Comox, to pacify the xwexwe
    and instructed his son-in-law to watch the xwexwe dancers because he intended
    to give it to him as a marriage gift.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Comox song-leader NEmuEniEm shouted, the Comox shouted with him, and they
    beat time on upside-down boxes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Four naked dancers came out with ochre-painted bodies and xwexwe masks; four
    songs were sung for them, and the dancers moved with quick steps.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: LEnolalai called for something to drive the supernatural ones into their room;
    goat-skins were cut into strips and laid down, the people shouted four times,
    and the dancers went behind the curtain.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the xwexwe was pacified, LEnolalai announced that the xwexwe, several
    names, and twenty boxes of camas-roots were given to Q!omogwe as a marriage present.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Q!omogwe stayed four days, returned to Crooked-Beach with his Comox wife,
    and immediately gave a feast to the Kwakiutl ancestors using the twenty boxes
    of camas-roots; the passage says they had not seen steamed camas-roots before.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Q!omogwe and his wife had children; names were given to the children, property
    was distributed for a child, and Q!omogwe changed his own name to Hek!utEn.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: When Hek!utEn's children were grown, he showed the xwexwe dance, gave a winter
    dance and a salmon-dance, and assigned or named cannibal-dancer, dog-dancer, salmon-dancer,
    and grizzly-bear-dancer roles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hek!utEn and Qwaesogut separated; she returned to Comox with Hag'as and PEngwed,
    took four dances she had seen, and used the same songs and names that had been
    used at Qalogwis.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that Kwakiutl names went to Comox for the first time because
    two children of Hek!utEn went home with their mother.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Hek!utEn later married K'anelk'as, described as a princess; after a daughter
    was born, he gave away property for the child and received the name YaxLEn from
    max'mEwesagEme.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: YaxLEn gave property when another daughter was born and named her LElelElg'awe,
    a name belonging to his numaym.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Calling-Woman married Copper-Dancer, a head chief, and YaxLEn gave him the
    xwexwe dance and the name Hek!utEn.
  category: relationship
  evidence_refs:
  - ev:10
