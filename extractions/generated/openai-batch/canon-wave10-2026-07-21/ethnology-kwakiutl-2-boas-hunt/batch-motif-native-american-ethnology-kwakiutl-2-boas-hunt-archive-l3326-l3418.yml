canonical_text:
  quote: ''
  summary: 'The passage first closes a genealogical account in which several named
    relatives die and Overhanging-Mountain succeeds to HoLelid''s seat and name, holding
    three seats through different affiliations. It then begins an account of the Maamtagila:
    Matag''ila, called the Grey Seagull, flies within Gwadze'', rests at K''lodagala,
    removes his bird mask, becomes a man, and builds a small house. He travels to
    Malmano after seeing smoke, meets Odzestalis, is received in the house, asks to
    marry Aomol, and is accepted. Odzestalis gives him the name ^maxuyalidze. After
    Matag''ila and Aomol have a son, Odzestalis gives the child the name L!aqwagila.
    The child grows quickly, asks for a yew-wood bow and four arrows, places them
    at the head of his bed, disappears before morning, and is later described as walking
    up the river before dawn, removing his blanket, and sitting in the water.'
  language: English
  quote_policy: summarized
