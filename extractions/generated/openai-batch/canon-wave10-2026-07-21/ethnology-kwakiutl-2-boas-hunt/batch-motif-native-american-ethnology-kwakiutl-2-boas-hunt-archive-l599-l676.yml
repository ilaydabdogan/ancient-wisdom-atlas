canonical_text:
  quote: ''
  summary: The passage lists names and name sequences for several numaym head chiefs.
    It describes birthplace names, unchanging head-chief names from family myth, property-giving
    before chiefship, young men's reciprocal gifts, child naming at ten months with
    body treatment and thunderbird straps, winter ceremonial sparrow names, and myth-time
    origins for some ceremonial names.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A first name may be taken from the place where the mother gives birth; at
    Tsaxis a son is named Tsaxisadze and a girl Tsaxisga.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says there are seven names for the head chiefs of the numaym Maamtag'ila,
    that these names do not change, and that they come from the family myth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: For the numaym Loyalahxwa or Loyalala^wa, TslEx^ed is the head-chief name
    used when he becomes head chief and when he invites all the tribes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before becoming head chief of the Loyalala^wa, the man's name is given as
    iJaqusdesElas, and in that status he gives property to the GwetEla.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Loyalala^wa young man's name is associated with the spider-crab name K'!Enwes
    and with young men giving one another paddles and mats for the greatness of the
    name.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At ten months old, the Loyalala^wa child name WahxganEm is used after the
    hair is singed off, ocher is applied, and thunderbird straps of dressed deer-skin
    are put on.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Loyalala^wa first name may be ^yilis if that is the place of birth, and
    that name lasts until the child is ten months old.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hanag'ats!e is identified as a sparrow name and is explained by saying that
    Hanag'ats!e was a song-leader in the beginning of the winter ceremonial, from
    the time when the myth people first became human beings.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Hanag'ats!e name is said to be given only to eldest-born children of the
    first TslEx^ed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The head-chief name of the Loyalala^wa is said never to change, except for
    a short time when a marriage name is received.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: For the numaym G'exsEm, K'imkEciEwId is the head-chief name used when he is
    head chief and when he invites all the tribes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Before becoming head chief of G'exsEm, the man's name is GaySLElas, and in
    that status he gives property to the GwetEla.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The G'exsEm young man's name Q!omas is glossed as crab and is linked with
    young men giving one another shirts and kerchiefs for the greatness of the name.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The G'exsEm child name Wagcdaj'o is used at ten months old with thunderbird
    straps, ocher, and singed hair; a child born in Ts!amas or Victoria is named Ts!amas.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The G'exsEm sparrow name is X'awaatsle, the hamshamts!es name is Ages, and
    the warrior name KilEmalagilis is explained by saying he has been a warrior since
    the myth people became human beings.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: For the numaym Kukwaklum, XE(iap lEuk'Eni is the head-chief name used when
    he invites all tribes and takes the place of his father; before head chiefship
    the man's name is TsEx'wid, and he gives property to the GwetEla.
  category: sequence
  evidence_refs:
  - ev:9
