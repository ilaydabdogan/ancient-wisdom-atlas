canonical_text:
  quote: ''
  summary: A marriage alliance is publicly marked by sacred songs, house-dishes, canoe
    transport, name changes obtained through marriage, feasts, and distributions of
    dressed skins and oil. In winter, Odze'stalis and the Lawets!es bring return marriage
    payments, including valuables, food, a named copper, canoes, and a carved box
    said to contain supernatural power and the winter dance. The son-in-law is told
    to purify and begin the winter dance, whose contents are named as ritual dance
    figures or roles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Odze'stalis assigns winter names and gives four house-dishes identified as
    grizzly-bear, wolf, beaver, and killer-whale dishes to be taken aboard the canoe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yaqok!walag'ilis calls four speakers; the speakers and Yaqok!walag'ilis sing
    sacred songs before the goods are loaded onto the wooing-canoe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yaqok!walag'ilis leaves his father-in-law's house with his wife Ringing-Copper
    and returns to Qalogwis.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speakers report to the Kwakiutl that Yaqok!walag'ilis has married Ringing-Copper,
    the princess of Odze'stalis.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dressed skins and boxes of oil are promised or distributed in connection with
    name changes described as obtained in marriage from Odze'stalis.
  category: action
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:6
  text: Oil is poured into the four animal house-dishes, and each dish is placed before
    a named group or numaym.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In winter, Odze'stalis comes with the Lawets!es to pay a marriage debt to
    his son-in-law Aodzagalas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The winter marriage return includes dressed skins, cedar-bark blankets, baskets
    of clover-roots, boxes of oil, dried clams, dried salmon, the copper named Leta,
    and ten canoes.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Odze'stalis carries a carved box into the rear of his son-in-law's house and
    says that their supernatural power has entered the house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Odze'stalis identifies the box as containing the winter dance and instructs
    his son-in-law to purify for its sake.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the feast, L!aqwadze urges Aodzagalas to see what is in the crest-box,
    and Odze'stalis tells the Kwag'ul to begin the winter dance that evening.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The box is said to contain the hamatsa named Tslaxtixstala, the thrower-dance,
    and the chief fool-dance.
  category: object
  evidence_refs:
  - ev:8
