canonical_text:
  quote: ''
  summary: The passage lists Kwakwaka'wakw numaym and tribal names, especially chiefly
    names, life-stage names, ceremonial names, warrior names, birthplace-derived names,
    rules for hereditary transmission of head-chief names, and explanations of tribal
    renaming after the killing of the chief ^maxwa.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man's name, Wabido, is associated with young men giving one another
    paddles and mats in an old practice connected with the greatness of the name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The warrior name Yag'is is taken only after killing a man and keeping the
    killed man's scalp; ancestors of the chiefs Nsqap lEuk'Em are said to have done
    this, filling boxes with scalps.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same name-holder is assigned different names for feast, child stage, winter
    ceremonial sparrow name, hamats'a status, and birthplace before ten months of
    age.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The name ^uEniogwis is used when its bearer invites all the tribes and serves
    as head chief of the numaym SeuLlEm.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Llaqwalat is named as head chief of Lardaxs^Endayo when he invites the tribes
    and tells the chiefs that he takes the place of his father Llaqwalal.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: After Llaqwalat takes his father's place, the father Llaqwalal changes his
    name to P lasElal and has a seat at the end of the numaym.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A grizzly bear dance is assigned to the Lardaxs^Endayo head chief, with the
    name ^val.as nan, and a Qalogwis birthplace name Qalogwidze is also given.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The seven numayms of the GwetEla formerly had the name Kwexamot, and the new
    tribal name GwetEla is dated from the time when ^maxwa was killed by the Q!omoya^ye.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that head-chief names of the numayms do not change and
    cannot be given to sons-in-law, including the husbands of princesses.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Head chiefs are said to keep their names and to give them only to the eldest
    among their children.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A warrior killed ^maxwa at Eg'isbaUs; ^maxwa is described as the head chief
    of the great head numaym of the GwetEla, the Maamtag'ila.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After ^maxwa's death, the Q!omoya^ye changed their tribal name to Kwexa, and
    the Kwag'ul changed their tribal name to Kwexamot because their chief ^maxwa had
    been killed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The name Kwexa is explained as connected with striking with walking-sticks,
    a sword, or a pole, as ^maxwa was struck when he was killed.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Q!omoya^ye are said to have seven numayms, including the head numaym Kukwak!um,
    and lists of chiefly and life-stage names are provided.
  category: other
  evidence_refs:
  - ev:10
