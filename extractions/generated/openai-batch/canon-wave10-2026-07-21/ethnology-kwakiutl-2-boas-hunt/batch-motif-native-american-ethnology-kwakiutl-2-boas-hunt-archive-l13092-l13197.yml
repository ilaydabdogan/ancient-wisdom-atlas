canonical_text:
  quote: ''
  summary: The passage describes procedures for handling halibut and fishing gear
    after a catch, taboos concerning halibut heads and blood, the search for luck-bringing
    objects in a halibut stomach, and prayers spoken to newly made halibut hooks,
    spruce crosspiece materials, and spruce roots.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After fishing, the fisherman returns to his house, unties bait from the halibut
    hooks, hangs the bait on the side of the canoe, coils and hangs the fishing line,
    and puts the hooks into a hook box.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fisherman hauls the halibut from the canoe belly-up and avoids letting
    the halibut heads be covered by water, because the first Indians said this would
    bring bad weather and rain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fisherman puts the hook box in a place where nobody walks, and his wife
    gives him food before preparing to cut open the halibut on the beach.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The woman turns the halibut stomach inside out and looks for cedar sticks,
    hemlock sticks, or a stone, which are said to bring good luck to the fisherman.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The woman pours saltwater over halibut blood on the beach so the blood goes
    down into the gravel, because the first Indians said a dog licking the blood would
    stop halibut from biting the fisherman's hook.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A newly made halibut hook includes a bone tooth, line attachment, bait string,
    devil's club bark wrapped near the bone tooth, and a bait holder; the fisherman
    holds the hook up and prays to it.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: In prayer, the fisherman addresses the hook as a younger brother, says its
    dress has been put on, and says it will go to the village of named beings including
    Smelling-Woman, Born-to-be-Giver-in-House, Old-Woman, and Flabby-Skin-in-Mouth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The fisherman tells the hooks to purify themselves, not let go when the named
    beings take hold of them, and says he will blacken them with spruce branches so
    they smell good and will be smelled when first put into the water.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The fisherman burns spruce branches in the house fire and beats the halibut
    hooks with the burning branches while speaking about putting a sweet smell on
    them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the hooks are black, the fisherman hangs them in a corner of the house,
    goes into the woods, finds a small spruce tree, and cuts four straight pieces
    for hook crosspieces.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The fisherman prays to the spruce crosspiece materials as friends, saying
    they called him, asking them to care for his younger brothers, spread their sweet
    smell, call the named beings, and not break apart.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The fisherman finds a long straight spruce root and prays to it as a friend,
    asking it to hold the crosspieces together with uncommon supernatural power and
    not break apart when the hooks are taken hold of.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: After praying to the young spruce trees and spruce roots, the fisherman carries
    them home.
  category: sequence
  evidence_refs:
  - ev:12
