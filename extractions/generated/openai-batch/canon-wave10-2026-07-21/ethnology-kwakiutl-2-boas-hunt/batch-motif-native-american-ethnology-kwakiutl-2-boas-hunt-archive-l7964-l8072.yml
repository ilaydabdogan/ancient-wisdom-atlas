canonical_text:
  quote: ''
  summary: A supernatural woman or Head-Winter-Dancer figure reassembles severed body
    parts, sings, directs rapid board-beating, and manifests power that floods the
    winter-dance house and extinguishes its fire. A speaker tells Xaxosenaso^ that
    he has obtained sacred treasures and the magic power of being cut to pieces and
    restored. The supernatural house and its people disappear. Xaxosenaso^ then travels
    downriver, sings a sacred song about being taken to the other side of the world
    and receiving everything from supernatural power, returns near his father's house,
    and is brought ashore by his tribe while they beat time. He conceals his treasure
    while the community discusses the expected coming of Head-Winter-Dancer and later
    goes into the water at the river mouth.
  language: English
  quote_policy: summarized
