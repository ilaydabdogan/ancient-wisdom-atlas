candidate_motifs:
- id: motif:1
  label: ritual catching of disappeared dancers
  taxonomy_refs:
  - initiation
  basis: The passage describes a winter-dance sequence in which three disappeared
    persons are to be caught, with dancers, songs, rattles, a cannibal-dancer's excitement,
    and pursuit by the Sparrow Society.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives a ceremonial procedure but does not explicitly define
    the caught persons' status as initiates; the initiation taxonomy is therefore
    tentative.
- id: motif:2
  label: secluded transmission of sacred songs
  taxonomy_refs:
  - departure
  basis: Yox'yagwas asks that the songs not be sung in the house, and the group leaves
    at night for Supernatural Place in the woods, where Chiton teaches the song-leaders.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The movement is a ritual relocation for secrecy; the broader departure
    motif is only weakly applicable.
- id: motif:3
  label: supernatural cannibal as giver of power and ritual gifts
  taxonomy_refs:
  - sacred_exchange
  basis: The songs identify Cannibal-at-North-End-of-World as the one who gave supernatural
    power and describe the speaker receiving red cedar-bark, the hoxhok-cry, and the
    cannibal-cry from him.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage names gifts and power but does not narrate a full reciprocal
    exchange in prose.
- id: motif:4
  label: world-edge cannibal seeking human flesh and carrying bodies
