canonical_text:
  quote: ''
  summary: In a dancing-house, Chiton explains the L!aL!asiqwala procedure for a winter-dance
    catching of three disappeared persons, contrasting it with Kwag'ul practice. The
    plan includes calling the tribe, groups of dancers with sacred songs and rattles,
    the excitement of a cannibal-dancer, and pursuit by the Sparrow Society. Yox'yagwas
    accepts her instruction, says he obtained the practice by marriage from the supernatural
    L!aL!asiqwala, and asks that the songs be learned secretly at Supernatural Place.
    Chiton and the song-leaders go there at night, where she teaches cannibal songs
    associated with her father. The songs mention food, human flesh, skulls, corpses,
    Cannibal-at-North-End-of-World, supernatural power, a sacred room, red cedar-bark,
    ritual cries, and bodies carried by the supernatural cannibal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chiton addresses chiefs in the dancing-house and states that the winter dance
    belongs to the L!aL!asiqwala while explaining how her tribe handles the dance
    for three who have disappeared.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chiton proposes going the next day to catch the disappeared persons and says
    her tribe does not dance the whole night before catching them, unlike the Kwag'ul
    practice she mentions.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chiton says HoLeUd will call the tribe in the morning and that there will
    be four war-dancers, four frog-dancers, four throwing-dancers, sacred songs, and
    four rattles.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Chiton says that after each dancer has sung a sacred song, the cannibal-dancer
    will become excited; the twelve dancers will go ahead singing, and the Sparrow
    Society members will run after them toward the place where the persons to be caught
    will sing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Yox'yagwas thanks Chiton, says he obtained the dance by marriage from the
    great supernatural tribe L!aL!asiqwala, and agrees to follow Chiton's words.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Chiton takes batons and gives one to each song-leader.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Yox'yagwas asks that they not sing in the house so the tribe will not hear
    them, and proposes going to Supernatural Place that night.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The group leaves the dancing-house, feels its way into the woods, reaches
    Supernatural Place, and sits down there.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Chiton sits in the middle of the song-leaders and says she will sing the songs
    of her father from when he was a cannibal-dancer, because he has four cannibal
    songs.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The first fast-beating song says that no one is looking for food, human flesh,
    skulls, or corpses all around the world.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: A slow-beating song asks where food and skulls will be found for the one who
    gave supernatural power and names Cannibal-at-North-End-of-World.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The slow-beating song says the speaker was almost brought into trouble, almost
    kept, and taken into the sacred room of Cannibal-at-North-End-of-World.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The song says red cedar-bark was put on the speaker by Cannibal-at-North-End-of-World
    and that the speaker was given the hoxhok-cry and the cannibal-cry.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: A later slow-beating song says the real supernatural Cannibal-at-North-End-of-World
    searched for food and human flesh and came carrying a body, then bodies, in his
    arms.
  category: speech
  evidence_refs:
  - ev:7
