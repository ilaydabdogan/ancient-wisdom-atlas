- id: obs:6
  text: Boiled seal and blubber are placed in the eight house-dishes, and Q!umxod
    assigns two dishes to each of the four numayms.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Helamas tells the chiefs to stand up and show that they have sweet food to
    eat; the chiefs, described as naked, eat a long strip of blubber, and lower-ranking
    men also stand and eat seal blubber.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the eating, the dishes are carried outside, raw seals are distributed,
