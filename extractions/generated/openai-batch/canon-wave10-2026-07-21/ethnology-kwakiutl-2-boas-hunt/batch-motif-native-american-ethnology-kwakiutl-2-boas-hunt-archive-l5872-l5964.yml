canonical_text:
  quote: ''
  summary: Four numayms assemble for a great seal-feast, sing feasting-songs, and
    are shown eight animal-form house-dishes said to have been obtained as marriage
    gifts. The dishes are filled with seal and blubber and assigned in pairs to the
    numayms. Chiefs and lower-ranking men eat blubber standing, raw seals are distributed,
    new feasting-songs and a dance follow, and Ha'mid announces new names for Qwax'ilal
    and Q!umxod. In the next episode, chiefs and princes seek marriage with Qwax'ilal
    after seeing the eight house-dishes.
  language: English
  quote_policy: summarized
