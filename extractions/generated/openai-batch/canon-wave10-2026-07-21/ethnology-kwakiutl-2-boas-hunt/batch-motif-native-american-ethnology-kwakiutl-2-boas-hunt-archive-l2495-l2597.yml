canonical_text:
  quote: ''
  summary: YaqEyalisEm addresses the tribe after QlexsesElas has been taken by ghosts
    or supernatural power associated with the L!aL!asiqwala. He orders washing with
    hemlock branches, assigns dance societies in sequence, and says this begins the
    winter dance and a change of names. Amaxwa responds, acknowledging the new supernatural
    power. YaqEyalisEm and Head-Princess then prepare a concealed hole in the house
    floor with poles and a split kelp oil-bottle, while Head-Princess keeps a basketed
    item secret and orders head chiefs summoned to watch the working of the hole.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: YaqEyalisEm says that the supernatural power came from the place where he
    got his wife, and that QlexsesElas has been taken by ghosts or supernatural power
    of the L!aL!asiqwala.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: YaqEyalisEm tells the tribe, including wives and children, to wash with hemlock
    branches during the night and to try to catch QlexsesElas in the morning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'YaqEyalisEm gives an ordered role to dance groups: cannibal dancers first,
    then ghost-dancers, then war-dancers, followed by the Sparrow Society.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: YaqEyalisEm says the people are imitating what his wife told him from her
    father's instruction, and identifies the action as the beginning of the winter
    dance of the L!aL!asiqwala.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: YaqEyalisEm announces that names will be changed in the morning.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Amaxwa, chief of the numaym Maamtag'ila, says the tribe has heard YaqEyalisEm
    and now has another kind of supernatural power, different from the power received
    in war-marriage from a father-in-law.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: YaqEyalisEm and Head-Princess dig a hole in the middle rear of their house,
    oriented toward the door, and hide the excavated soil in boxes as is done for
    the L!aL!asiqwala ghost-dance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The hole is made deep enough for a tall man to stand in it while half of his
    body remains visible.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: YaqEyalisEm obtains a two-fathom stick, cuts it in two, sharpens the ends,
    and drives the pieces slanting into the hole under Head-Princess's direction.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Head-Princess splits an empty kelp oil-bottle lengthwise and ties it to the
    poles with the greasy, slippery inner side facing outward.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Head-Princess brings out something kept secretly in a basket, and even YaqEyalisEm
    does not know what is in it.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Head-Princess instructs YaqEyalisEm to summon one head chief from each numaym
    to watch how the hole is worked, to keep the callers from being seen by wives,
    and to have QlexsesElas come try what she is to do.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: YaqEyalisEm goes out to wake and call named head chiefs of several numayms.
  category: action
  evidence_refs:
  - ev:10
