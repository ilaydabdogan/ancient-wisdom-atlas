canonical_text:
  quote: ''
  summary: A chiefly ancestor associated with a stranded whale builds a ten-step house,
    closes a river mouth, and receives a new name. Visitors arrive by canoe from the
    world above, and a princess marries the chief; names are given as a marriage present.
    Their child receives names from both sides and inherits the house. The ancestor
    travels south, leaves whale food for his father-in-law, receives a canoe, and
    is later hosted at Odzalas by Hex'hak'in, whose princess he also marries by giving
    a traveling canoe; the host promises speaking-posts of his house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief ancestor builds a house ten steps deep after seeing a place associated
    with a whale, and he closes the mouth of the river at EtnsdElis, after which the
    river is named EmxsdElis.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief’s name is changed to TsExtsExulis, glossed as stranded-whale, because
    the whale went ashore at Padzo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A canoe arrives with a man, his wife, and a young woman; TsExtsExulis meets
    them, invites them in, feeds them, and asks who they are.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The male visitor identifies himself as SenLle, says his village is in the
    world above, and identifies the young woman as his princess SenLlegas and the
    other woman as his wife.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: TsExtsExulis identifies himself as coming from the North-End-of-our-World
    and asks to marry SenLle's princess so that their names may be together.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: SenLle has the princess sit beside TsExtsExulis, they are married, and SenLle
    gives the names Sesaxalas and Sewid as marriage presents.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: When SenLlegas has a boy, SenLle names his grandson Anx-wld; Sesaxalas names
    his child YaqalEnlis and gives his ten-step house to the son.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The narrator states Kwakiutl descent on one side because of the chief ancestor.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Sesaxalas departs to see the southern regions, while SenLle, his wife, SenLlegas,
    and the child stay at home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Sesaxalas leaves the whale as food for his father-in-law SenLle, and SenLle
    gives him a flat-bowed canoe for travel.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: SenLle cuts blubber from the whale, obtains a new name from that action, and
    the princess is renamed Klamaxalas.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Sesaxalas reaches Odzalas, where the houses of Nimkish ancestors associated
