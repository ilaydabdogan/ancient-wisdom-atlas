canonical_text:
  quote: ''
  summary: 'A first-person speaker grounds status in many inherited names and chiefly
    ancestors. The passage recounts the children of LaleliLladze and Gaaxtstalas,
    then describes two chiefly marriage transactions: the marriage of LaleliLladze''s
    daughter to L!aqwag''ilagEme, including large gifts, reciprocal return gifts,
    and bestowal of new names; and LaleliLladze''s canoe journey to Sagumbala to obtain
    TslEx''ed''s princess and name for his son through another marriage gift.'
  language: English
  quote_policy: summarized
