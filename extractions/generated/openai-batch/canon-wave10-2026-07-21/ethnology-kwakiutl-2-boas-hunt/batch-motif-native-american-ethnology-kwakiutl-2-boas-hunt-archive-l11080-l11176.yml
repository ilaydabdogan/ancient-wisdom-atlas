canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which Exsokwi-lak uses life-restoring
    water, establishes a house and chiefly status in a village, and hunts hair-seals
    with a spear that becomes a serpent. It then begins the story of the Naensxa of
    the Koskimo: Waned, a chief''s son, delights in his dog NEsa injuring other dogs.
    Waned and the dog are summoned to wounded men in a thicket, where an old man exchanges
    Waned''s human body with the dog''s body, causing the dog to become the apparent
    Waned and Waned to become a dog who cannot speak to his parents.'
  language: English
  quote_policy: summarized
