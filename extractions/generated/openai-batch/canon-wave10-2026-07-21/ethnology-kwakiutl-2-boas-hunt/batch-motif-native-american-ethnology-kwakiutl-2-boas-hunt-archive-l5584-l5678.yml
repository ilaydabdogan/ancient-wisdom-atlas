- id: claim:2
  claim: The passage explicitly states that the Scattering-Dancer in the nonlEm is
    the same as the mamaqla in the winter dance and links it with chiefs of high rank.
  claim_level: same_function
  target: mamaqla in the winter dance
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the functions named in the passage and
    does not establish equivalence in all ritual details.
- id: claim:3
  claim: The passage compares nonlEm name-changing with winter-dance name-changing,
    stating that people change names when the winter dance begins and do the same
    with the nonlEm.
  claim_level: same_function
  target: winter-dance name-changing practice
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The claim concerns a named ceremonial practice in the passage, not
    a universal pattern of ritual naming.
