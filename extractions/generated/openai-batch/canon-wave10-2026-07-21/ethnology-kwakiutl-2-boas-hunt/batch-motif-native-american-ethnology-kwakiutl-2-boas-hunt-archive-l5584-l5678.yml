candidate_motifs:
- id: motif:1
  label: initiation through disappearance and return as named dancers
  taxonomy_refs:
  - initiation
  basis: Participants disappear after the nonlEm roof sound, are absent for four days,
    return or are caught, and receive dancer roles, regalia, and nonlEm names.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage presents ritual actions ethnographically; no inner symbolic
    meaning beyond the described initiation pattern is inferred.
- id: motif:2
  label: ceremonial name transformation by ritual season
  taxonomy_refs:
  - initiation
  basis: Qlumx'od receives and uses nonlEm names only in the nonlEm context, and the
    narrator states that winter-dance, nonlEm, and secular names are different.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
  confidence: high
  cautions: The passage describes formal name changes, not bodily transformation or
    shapeshifting.
- id: motif:3
  label: ritual exchange of valuables and food
  taxonomy_refs:
  - sacred_exchange
  basis: Marriage gifts of dentalia and cedar-bark blankets are given and redistributed;
    later sea-otter skins and seals in house-dishes are given in the nonlEm context.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: medium
  cautions: The passage explicitly calls some gifts marriage gifts; their classification
    as sacred exchange rests on their placement within the nonlEm ritual sequence.
- id: motif:4
  label: ranked ceremonial privilege for prince and princess
  taxonomy_refs:
  - royal_legitimacy
  basis: The scattering dance is said to be cared for by high-ranking chiefs, and
    Qlumx'od wants his princess to have it; his prince is also named in the planned
    disappearances.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  confidence: medium
  cautions: The text supports high-rank ceremonial privilege, but broader royal-legitimacy
    interpretation should be reviewed by a specialist.
- id: motif:5
  label: ritual transmission by patterned repetition
  taxonomy_refs: []
  basis: Qlumx'od's later nonlEm is described as doing what had been seen done by
    the Koskimo, including the roof sound, four disappearances, nonlEm names, and
    gifts.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: This is a local ritual replication pattern, not evidence by itself of
    historical diffusion beyond the passage.
comparison_claims:
- id: claim:1
  claim: The passage explicitly states that the Land-Otter-Dance in the nonlEm has
    the same standing or function as the hamatsa in the winter dance.
  claim_level: same_function
  target: hamatsa in the winter dance
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
