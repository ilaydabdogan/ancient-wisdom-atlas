canonical_text:
  quote: ''
  summary: Qwax'ila summons the Koskimo and arranges the coming of the supernatural
    power of the nonlEm; a roof sound is heard, four persons disappear, return after
    four days, and receive dancer roles and nonlEm names. Cedar-bark regalia, marriage
    gifts, and name changes are described. Qlumx'od later returns home, arranges a
    similar nonlEm for his children and nephews, and gives gifts while changing ceremonial
    names.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Qwax'ila called the Koskimo into his house and spoke to his son-in-law Qlumx'od
    and to the Naklwax'da^x" about taking care of the supernatural power of the nonlEm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Qwax'ila spoke, a whistling sound appeared on the roof of the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: K'!esoyak'ihs, the nephew of Qlumx'od, and three others disappeared; the Koskimo
    sang four nonlEm songs, and the absent persons were away for four days before
    being caught.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The returned or named participants were assigned dancer identities including
    Mosquito-Dancer, Land-Otter-Dancer, Scattering-Dancer, and Grizzly-Bear-Dancer.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dancers and the Koskimo wore white shredded cedar-bark head-rings and
    neck-rings, and they wore cedar-bark on their heads for four days before removing
    it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Qwax'ila gave Qlumx'od nonlEm and secular names and also gave dentalia and
    cedar-bark blankets as marriage gifts, which LlalEWElsEla distributed to the Koskimo.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narration explains that Qlumx'od was called LlalEWElsEla only when his
    people showed the nonlEm, and that nonlEm, winter-dance, and secular-season names
    differ.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After returning to Teguxste, Qlumx'od told his wives that he wanted the nonlEm
    to come into his house and wanted his children and nephews to disappear.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Qlumx'od called his numaym, the Gwalas, named four persons to disappear, received
    their approval, and then the supernatural power of the nonlEm sounded on the roof
    as the four disappeared.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Qlumx'od gave ten sea-otter skins to the Naklwax'da^x", placed seals in four
    house-dishes for them, and changed Qwax'ilal's name and his own name.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: T!agwisilayugwa had no children with Walalag'i^lak", did not remain long as
    his wife, and went home.
  category: relationship
  evidence_refs:
  - ev:8
