canonical_text:
  quote: ''
  summary: A woman called bad has her son help tie an abalone-covered carved box to
    a large stone and cast it into the sea, then they fabricate a story that the canoe
    upset and the stepson was lost. The Bellabella suspect wrongdoing, and Chief LEg'ex
    orders chiefs and tribes to search for his son and the carved box, described as
    his son's crest. Elsewhere, AhiElavala's wife sends her two daughters to purify
    themselves and search for the box. The younger daughter repeatedly notices a sun-like
    object at sea and later finds the great abalone-covered box on the beach, unties
    it, hears movement inside, and runs away in fear.
  language: English
  quote_policy: summarized
