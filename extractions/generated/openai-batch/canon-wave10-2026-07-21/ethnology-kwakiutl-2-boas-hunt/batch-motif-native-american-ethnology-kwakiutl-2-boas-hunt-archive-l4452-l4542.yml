canonical_text:
  quote: ''
  summary: 'The passage narrates a sequence of chiefly marriage and naming events:
    groups enter and receive blankets; wives or princesses are taken away from YaqoLElas
    in earlier relationships; YaqoLElas arranges marriage with QlexLala, pays blankets
    as marriage money, receives her with a large blanket marriage mat, and is given
    a new name by Ewanuxdze. He publicly announces the name and redistributes blankets.
    Later, a son is born, named, and given another name and food gifts through the
    maternal grandfather, followed by invitations to community groups.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ^walas Kwagul and Q!omk'!ut!Es enter the house and sit in specified positions
    before YaqoLElasEme speaks to his son-in-law YaqoLElas and gives away thirty-five
    blankets.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narration says A^walask'inis takes away Kliimaxalas, wife of YaqoLElas,
    and later says YaqoLElasEme takes away Alak'ilayugwa after YaqoLElas becomes proud
    and beats his wife; YaqoLElas still retains the house and seat because of their
    child nEmnasalayugwa.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: YaqoLElas asks to marry QlexLala, daughter or princess of Chief Ewanuxdze,
    and consults his numaym SenL'.Em, whose speaker urges quick payment of marriage
    money.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: YaqoLElas takes fifty blankets from his room, and the SenL'.Em carry them
    to Ewanuxdze's house as marriage money.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ewanuxdze's speaker tells the SenL'.Em to wait while QlexLala prepares her
    marriage mat so she will not sit on the floor without a mat in her husband's house.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The SenL'.Em come out carrying one hundred blankets on their shoulders, with
    QlexLala walking among them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: At the doorway, Ewanuxdze gives YaqoLElas the name GwE^yimdze, gives a dancer
    name, and calls the hundred blankets the marriage mat of the wife.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: At his own house, YaqoLElas, now addressed as GwE^yimdze, has the house cleared,
    summons the Q!omoya'ye, ^walas Kwag'ul, and Q!omk'!ut!Es, publicly states his
    new name, and gives away the hundred blankets to those groups.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: After GwE^yimdze and QlexLala live together, they have a son named Tsaxis
    because he was born there; four days after birth, when the navel-string comes
    off, Ewanuxdze gives oil, clover-roots, and the name Wawalk'ine for the newborn.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: GwE^yimdze sends speakers to invite people from all houses on behalf of Wawalk'ine,
    and one response in the passage says that the fire is burning low.
  category: speech
  evidence_refs:
  - ev:10
