canonical_text:
  quote: ''
  summary: The passage describes songs and procedures for a winter-dance episode centered
    on Q!ex"sesElas, whose name is changed to Supernatural-Power-coming-up. Groups
    go out toward a point of land and fall on the rocks when a cry is heard. Ghost-dancers
    lead Q!ex"sesElas into a sacred rear room near a hidden hole, sprinkle those struck
    by ghosts with urine, and return to the dancing-house. Songs of supernatural power
    are performed. Chiefs, song-leaders, Sparrow Society members, shamans, and uninitiated
    children are instructed to pacify, capture, and restore the ghost-dancer so that
    she becomes secular, and copper bracelets are distributed to Sparrow Society members.
  language: English
  quote_policy: summarized
