canonical_text:
  quote: ''
  summary: In Waxaplalaso's house, Head-Winter-Dancer and ^wilEnkulagilis display
    supernatural powers before assembled groups. Each produces water from the floor
    that extinguishes the central fire and then recedes. Head-Winter-Dancer is beheaded
    and restored; ^wilEnkulagilis is dismembered and reassembled. Head-Winter-Dancer's
    party flees, and ^wilEnkulagilis prepares a roof song obtained from the thunderbird,
    invoking burning of the world and hailstorm.
  language: English
  quote_policy: summarized
