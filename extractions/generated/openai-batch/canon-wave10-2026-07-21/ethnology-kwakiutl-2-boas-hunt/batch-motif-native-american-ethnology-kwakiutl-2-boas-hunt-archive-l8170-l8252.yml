- id: obs:1
  text: Head-Winter-Dancer throws his supernatural power onto the house floor; water
    wells up, floods the house, extinguishes the central fire, recedes, and leaves
    the floor dry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Waxaplalaso and his tribe remain in place while waist-deep in water, then
    rearrange the central fire so that it blazes again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Head-Winter-Dancer asks that his head be cut off; an unnamed member of his
    tribe uses a shell knife, carries the head around the fire four times, replaces
    it, and Head-Winter-Dancer arises whole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Head-Winter-Dancer's restoration, a man calls on his side's friends
