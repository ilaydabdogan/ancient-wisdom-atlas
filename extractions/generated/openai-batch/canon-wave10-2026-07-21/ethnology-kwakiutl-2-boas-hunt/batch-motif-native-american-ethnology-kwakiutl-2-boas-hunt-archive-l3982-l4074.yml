canonical_text:
  quote: ''
  summary: The passage recounts a winter-dance sequence in which named persons disappear,
    are caught again, and receive dancer roles and names. It then describes births
    to Ringing-Copper, repeated transfers of names and goods by Odze'stalis, succession
    to seats after his death, and potlatches. The passage ends with Aodzagalas arranging
    Awilgalas's marriage to MEled, collective payment of marriage money, a sham-fight
    at Memkumlis, the bride's procession with slaves, skins, copper, and canoe, and
    further name transfers by Chief ^maxuyalidze.
  language: English
  quote_policy: summarized
