canonical_text:
  quote: ''
  summary: The passage contains a sequence of songs and chiefly boasts. Speakers praise
    chiefs associated with giving property and coppers, hereditary names, crests,
    senior rank, fear or terror, Dzonoqwa sound, and the breaking, cutting, making,
    gathering, or throwing away of coppers. Rival lower-ranking figures are mocked
    for lacking ancestral names and for trying to equal or appropriate the chief's
    crest and names.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A figure is said to have given or apportioned goods to all tribes and to have
    made the tribes satiated; the speaker then gives self-names connected with giving
    and copper-giving.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker contrasts a great real chief with people described as having no
    chiefly ancestors or inherited names from grandfathers.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: The great real chief is repeatedly expected to utter a Dzonoqwa sound.
  category: speech
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:4
  text: Lower-ranking chiefs or claimants are described as receiving leavings, echoing
    the chief's names, trying to equal the speaker's great crest, and trying to steal
    or bite off pieces of that crest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the song of Ewanux-dze, property and copper are asked to remain alive or
    unbroken under attack by a reckless chief.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A reckless chief is described as a copper-breaker dancer, copper-cutter, and
    one who throws coppers into the sea.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A rich chief or maker of coppers is said to bring forth coppers in the house,
    with coppers around the great house, while the tribe gathers coppers brought by
    him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the song of TsExwiu, Dzonoqwa is addressed and told to terrorize chiefs
    under the speaker's great names.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the song of Q'umxod, the group says they fear the chief, should calm the
    chief, and receive property from a prince who feeds them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The great chief is compared in speech to a great overhanging mountain.
  category: attribute
  evidence_refs:
  - ev:4
