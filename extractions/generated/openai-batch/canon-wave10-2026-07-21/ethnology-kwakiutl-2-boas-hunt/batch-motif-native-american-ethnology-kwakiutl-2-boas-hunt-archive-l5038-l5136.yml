canonical_text:
  quote: ''
  summary: A ritual performance extinguishes the house fire and proceeds in darkness
    before the fire is rebuilt. Llaqwag'ila gives his son-in-law 'maxwa a box of ceremonial
    privileges, including four dances, together with food, skins, blankets, and other
    goods. 'maxwa returns home, consults the Nak!waxda'x numayms, gives a winter dance,
    displays the dances obtained through marriage, and distributes wealth. Later names
    are given to his children, and he seeks a further marriage with a Bellacoola princess
    in order to obtain property, names, and winter dances; the Bellacoola chief gives
    blankets and names, but does not invite him inside.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed male dancer puts out the fire in the middle of the house; two songs
    are sung in the dark, and the dancer goes back into the sacred room before the
    fire is rebuilt.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Llaqwag'ila tells his son-in-law 'maxwa to carry home a box containing privileges
    and to take the four dances seen that night.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage identifies the transferred prerogatives as the first cannibal-dancer
    with whistles for the Nak!waxda'x, along with the fire-dance, rich-woman dance,
    shaman-dance, and four head-masks, which they did not previously have.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: At departure, 'maxwa, his wife, and crew load four canoes, and Llaqwag'ila
    supplies the privilege box, smoked mountain-goat meat, mountain-goat tallow, black-bear
    blankets, lynx-skin blankets, and dressed skins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After returning to Tegdxste, 'maxwa asks his father Amaxulal to call in the
    five numayms of the Nak!waxda'x quietly, and then has the door barred.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: "'maxwa reports the four dances and other goods obtained for his tribe and
    asks whether he should give a winter dance; those present agree."
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: He shows the four dances obtained in marriage from the Awik'!enox and gives
    a feast and giveaway using goat meat, tallow, bear-skin blankets, lynx-skin blankets,
    and dressed skins.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A son is born and receives the name Nanagwas as a marriage gift from the father-in-law;
    a daughter is later named Llaqwag'ilayugwa.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Llaqwag'ila later wants to marry BElxanaga, princess of Goxolane, for property,
    names, and winter dances; the passage note defines Xwesa as a mock marriage performed
    to obtain prerogatives.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: After Llaqwag'ila pays marriage money, Goxolane and BElxanaga appear wearing
    marten blankets, old men carry lynx-skin blankets, and Goxolane gives the blankets
    and names to Llaqwag'ila.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Llaqwag'ila and his crew are not invited into Goxolane's house, and Llaqwag'ila
    becomes angry.
  category: sequence
  evidence_refs:
  - ev:10
