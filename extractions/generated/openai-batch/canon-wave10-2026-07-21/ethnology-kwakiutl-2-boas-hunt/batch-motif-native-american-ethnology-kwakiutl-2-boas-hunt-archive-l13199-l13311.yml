canonical_text:
  quote: ''
  summary: The passage records a prayer used by a person who thinks he has been bewitched,
    seeking help from supernatural tree spirits and a healing dream; a prayer to a
    lark seen for the first time, asking protection and aid; and rules and witnessed
    practices for disposing of a deceased salmon-fisher's property, including burning
    goods by the grave, avoiding the dead person's catch, replacing household water,
    and providing for the widow and children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who thinks he has been bewitched by an enemy goes into woods with different
    kinds of trees, sits in the middle of the patch, and prays.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the prayer, the man addresses the beings as friends, Supernatural-Ones,
    and Life-Bringers, asking them to remove witchcraft and let him dream a good dream.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the prayer, the sick man returns home, lies on his bed, does not eat,
    and intends to dream only of what the tree spirits told him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that many men say the dream comes from the spirits of the
    trees, who instruct the bewitched man how to cure himself, and that he generally
    gets well afterward.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says the Kwakiutl believe in witchcraft and in a good dream connected
    with the sayings of the supernatural spirits of the woods.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: When a lark is first seen sitting on a bush by a wise man or woman, the person
    prays to the bird.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The lark prayer welcomes the bird as a friend and asks the Supernatural-One
    for protection from evil, sickness, and hostile people, as well as aid in work
    and care for children.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage identifies the lark prayer as a prayer of the ancestors of the
    Kwakiutl.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the salmon-fisher dies, his wife directs men of his numaym to carry out
    bundles of dried salmon, load them on his canoe, place them outside his grave,
    and burn them as travelling provisions, along with oil, fishhooks, clothing, and
    the canoe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the named example, no dried salmon is kept for the widow's two children;
    the passage says the salmon caught by the deceased belongs to the dead and brings
    bad luck to those who eat it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage distinguishes between property made or caught by a deceased person,
    which is burned, and purchased items such as a bought canoe or bought dried salmon,
    which may be inherited or spared under stated conditions.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When a person dies, people in the village pour out the water in their buckets
    and draw fresh water from the spring or river.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Members of the deceased person's numaym go to the chief's house, break one
    side of the house, carry out dry salmon given to the chief, burn it near the grave,
    and then give food and clothing to the widow and children.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The narrator says he saw these practices when he was young, but that current
    Indian ways are different.
  category: speech
  evidence_refs:
  - ev:10
