literal_observations:
- id: obs:1
  text: X'ilx^ed, formerly called Q!eq!Ex'Lala, returned to GweqElis with his wife
    K'ledelEme^ and their child YaqEwId and distributed blankets, seals, and food
    during a feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The distributed seals were placed in animal-named house-dishes, and the act
    is identified in the passage as giving away during a feast.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: YaqEwId married the princess of Llaqwadze, and Llaqwadze gave him slaves,
    canoes, blankets, and a new name, LlaqwasgEm, as marriage gifts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Llaqwadze also gave a name for his granddaughter, and after a later boy child
    was born he gave further gifts, the name Sewid, and a house for the grandson.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: LlaqwasgEm sent canoes to invite the Nak!wax'da^x and the Awik'!enox to come
