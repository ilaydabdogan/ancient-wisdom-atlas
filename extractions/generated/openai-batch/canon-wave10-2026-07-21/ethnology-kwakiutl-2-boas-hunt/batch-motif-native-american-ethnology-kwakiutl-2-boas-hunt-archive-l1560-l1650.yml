  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Awik'!enox sang the LEWElaxa song, and Llaqwag'ila, chief of the Awik'!enox,
    danced in LlaqwasgEm's house.
  category: action
  evidence_refs:
  - ev:5
