  summary: The passage recounts chiefly marriages, the distribution of marriage gifts
    and feast wealth, name changes, the birth and naming of children, invitations
    to neighboring groups, and the transfer and first Gwa'sEla performance of the
    LEWElaxa dance with songs, regalia, a rattle, and a fire in the dancing-house.
  language: English
