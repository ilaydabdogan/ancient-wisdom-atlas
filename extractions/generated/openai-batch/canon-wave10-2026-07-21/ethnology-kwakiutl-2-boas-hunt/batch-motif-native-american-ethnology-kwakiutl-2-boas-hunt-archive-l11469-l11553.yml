canonical_text:
  quote: ''
  summary: XwelageLas reports finding pearl shells by good luck and refuses immediate
    sale to Chief Hayalk'En. After hiding the shells and entering the sea-water, he
    dreams of a shell-adorned man called Pearl-Shell-Maker and Abalone-Maker-of-the-World,
    who directs him to paddle to GEyaxste to obtain his dress and tells him not to
    sell what he receives. XwelageLas journeys by canoe, finds four large abalone
    shells by a stone at low water, cooks them, returns home, and again refuses the
    chief immediate access because the shells are not yet secular. The passage then
    says XwelageLas is now named Pearl-Shell-Maker and gives his son the name Abalone-Shell-of-the-World.
  language: English
  quote_policy: summarized
