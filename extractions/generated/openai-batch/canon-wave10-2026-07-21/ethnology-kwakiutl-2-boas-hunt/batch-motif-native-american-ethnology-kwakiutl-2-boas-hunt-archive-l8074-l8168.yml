canonical_text:
  quote: ''
  summary: Xaxosenaso tells his father Chief Waxaplalaso to clear the house floor
    because his friend Head-Winter-Dancer is coming. A canoe messenger announces the
    powerful Head-Winter-Dancer and tells the people to purify themselves. Waxaplalaso's
    people and Xaxosenaso go into the water at the river mouth. The tribe discusses
    Xaxosenaso's four years in the woods, his sacred song, and the treasure they believe
    he has obtained. The shaman Ex'agid announces that Xaxosenaso, also called WlEnkulagilis
    in the passage, has great magic power and that Head-Winter-Dancer will perform
    first. WlEnkulagilis returns to the woods. Canoes arrive with Head-Winter-Dancer's
    party, who wear red cedar-bark rings; seating is arranged to prevent escape if
    people are frightened by the playing, and batons are requested and distributed
    as Head-Winter-Dancer rises.
  language: English, with Kwak'wala names in OCR transcription
  quote_policy: summarized
