canonical_text:
  quote: ''
  summary: Xaxosenaso is bitten by a cannibal being emerging from the mouth of Head-without-Body,
    receives unseen instruction about a treasure and healing, performs river washing
    and fourfold diving, then meets Thunderbird, who carries him to see the world
    and teaches him a sacred song for use against Head-Winter-Dancer and his men.
    Thunderbird disappears, and Xaxosenaso learns that more time has passed than he
    perceived.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A being described as hamshamtsles came in a squatting position out of the
    mouth of Head-without-Body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hamshamtsles bit a wide piece out of Xaxosenaso's right arm, and Xaxosenaso
    did not move.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The hamshamtsles returned into the mouth while making a cannibal cry, and
    Head-without-Body disappeared after the being entered.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: An unseen speaker told Xaxosenaso that he had obtained as treasure what he
    had seen, including the hamshamtsles and the name One-Man-Eater.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The unseen speaker said that the front of the sacred room was Head-without-Body
    and was the head of their world.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The unseen speaker told Xaxosenaso that he would do among his tribe what One-Man-Eater
    had done to him, and that he would eat human flesh.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The unseen speaker instructed Xaxosenaso to spit on his right arm and press
    the bitten place so that it would heal.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: Xaxosenaso washed in the river and slept under cedar branches near the house
    of his father.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: In the morning Xaxosenaso rubbed both sides of his body with four bunches
    of hemlock branches and dived four times, staying under water a long time each
    time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: After the four dives, an unseen man praised what Xaxosenaso had done and said
    he would soon see his treasure.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Xaxosenaso went upriver and saw a large bird, identified as Thunderbird, sitting
    on a rock.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Xaxosenaso told Thunderbird that he had come to obtain him, the Great-Supernatural-One,
    as a treasure.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Thunderbird invited Xaxosenaso to sit among the feathers at the base of his
    wings, flew up, and had Xaxosenaso look at what was going on in the world.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:14
  text: After four days, Thunderbird returned to the rock where Xaxosenaso had first
    met him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Thunderbird gave Xaxosenaso advice about a possible attack by Head-Winter-Dancer
    and taught him a sacred song to call for help.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:16
  text: Thunderbird said the sacred song could be used so that attackers would die
    or turn into stone or ice.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: Thunderbird disappeared, Xaxosenaso went into the river, and Xaxosenaso did
    not know he had been away from his house for four years.
  category: sequence
  evidence_refs:
  - ev:8
