canonical_text:
  quote: ''
  summary: 'The passage concludes an account in which Waned is connected with a great
    dog: his mother suspects the dog is her son, shamans are summoned, a great shaman
    identifies the dog with Waned, and at dawn Waned announces that supernatural power
    has pitied him and that he is Waned again. The community then treats dogs carefully
    because they are understood as men like themselves. The passage then begins an
    origin account for the Abalone names of AwiKlENOx women. Chief LEgex favors his
    second wife and her son; his first wife becomes angry, plans harm, gains the stepson''s
    trust, takes him and her eldest son by canoe to an island, and has the stepson
    trapped in a large box.'
  language: English
  quote_policy: summarized
