canonical_text:
  quote: '"Now, listen to the supernatural power of your wife, son-in-law ^maxwa (II
    1)!"'
  summary: The passage closes one inheritance notice in which property, names, and
    dances pass to a successor, then gives a family-history account of ^maxwa's arranged
    marriage with L!aqwag'ilayugwa. AmaxQlal seeks a chiefly bride for his son in
    order to obtain crests. The marriage party travels to the Awlk!enox village, makes
    a formal proposal, pays sewed blankets as marriage money, and enters a house where
    winter dances, whistles, eagle-down, cedar-bark regalia, masks, and named dancer
    privileges are presented as the supernatural power of the wife.
  language: English
  quote_policy: quoted
