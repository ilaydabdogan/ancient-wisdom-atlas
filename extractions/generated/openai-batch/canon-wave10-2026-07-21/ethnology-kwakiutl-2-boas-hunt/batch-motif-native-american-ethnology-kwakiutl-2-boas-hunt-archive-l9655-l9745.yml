canonical_text:
  quote: ''
  summary: The passage describes spirits ritually killing and transforming Gwaexsdaas,
    purifying his body, giving him shamanistic power, relocating his great winter
    dancing-house to the Awik'!enox village, teaching songs through a nocturnal performance,
    and giving him a dance name while explaining his genealogy and the ennobling of
    his mother's side.
  language: English
  quote_policy: summarized
