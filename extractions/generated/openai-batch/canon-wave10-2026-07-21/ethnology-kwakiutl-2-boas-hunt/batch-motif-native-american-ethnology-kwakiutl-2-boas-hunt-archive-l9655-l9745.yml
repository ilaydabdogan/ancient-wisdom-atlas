  locator: lines 9655-9745
  quote_or_summary: X'imsElilEla tells the spirits not to take their masks and to
    help Gwaexsdaas learn the ways of the great dance, which he obtained from them
    as a treasure; they are to go after four days at night.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/ethnology-kwakiutl-2-boas-hunt.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 9655-9745
  quote_or_summary: After four days, late at night, the dancing-house is already standing
    where Gwaexsdaas wanted it, and Gwaexsdaas keeps his death-bringing baton.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/ethnology-kwakiutl-2-boas-hunt.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 9655-9745
  quote_or_summary: The Awik'!enox ancestors see the great dancing-house, see sparks
    coming through its roof, hear singing, and are afraid to look at it.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/ethnology-kwakiutl-2-boas-hunt.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 9655-9745
  quote_or_summary: The song-leaders of the Awik'!enox ancestors sit outside Chief
    Ewultlala's house and repeat the songs they hear; X'imsElilEla wants them to learn
    the songs because they hear them distinctly.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/ethnology-kwakiutl-2-boas-hunt.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 9655-9745
  quote_or_summary: After the forty masked spirits finish, Gwaexsdaas dances wearing
    cedar-bark rings mixed with white and performs four songs.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/ethnology-kwakiutl-2-boas-hunt.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 9655-9745
  quote_or_summary: X'imsElilEla says Gwaexsdaas's name in the great dance aLaqism
    shall be ALotEmdalag'ils.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/ethnology-kwakiutl-2-boas-hunt.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: lines 9655-9745
  quote_or_summary: X'imsElilEla says Gwaexsdaas was beaten by his father TslEx'ed
    of Wawale, wanted to commit suicide, had an Awik'!enox mother named TslEqala,
    and that the spirits will ennoble his mother's side.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/ethnology-kwakiutl-2-boas-hunt.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: lines 9655-9745
  quote_or_summary: X'imsElilEla says the spirits will sing for three nights, the
    tribe will sing on the fourth night, the spirits will become invisible and secretly
    instruct the tribe, and all masks will be left in the sacred room.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/ethnology-kwakiutl-2-boas-hunt.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: lines 9655-9745
  quote_or_summary: When daylight comes, the spirits remain around the fire in the
    middle of the dancing-house, and the Awik'!enox ancestors are frightened because
    they do not know what it is.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/ethnology-kwakiutl-2-boas-hunt.md
  rights_note: Public domain source; summarized.
