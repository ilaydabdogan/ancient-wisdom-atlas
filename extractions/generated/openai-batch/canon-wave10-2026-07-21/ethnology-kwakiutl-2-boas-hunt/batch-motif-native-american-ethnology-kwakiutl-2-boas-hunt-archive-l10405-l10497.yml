canonical_text:
  quote: ''
  summary: After Cannibal-at-North-End-of-World is killed, NEnwaqawa uses a spruce-root
    hat over the corpse-hole and the ashes become mosquitoes that are told to eat
    people in later generations. QuxElal, the cannibal's wife and NEnwaqawa's daughter,
    explains that her husband had intended to give marriage-price and ceremonial property,
    including skins, a cannibal-dance, a name, masks, red cedar-bark, and whistles.
    The family later travels to the cannibal's house, where NEnwaqawa sees many of
    his tribesmen drying over the fire and has his sons take the bodies down.
  language: English
  quote_policy: summarized
