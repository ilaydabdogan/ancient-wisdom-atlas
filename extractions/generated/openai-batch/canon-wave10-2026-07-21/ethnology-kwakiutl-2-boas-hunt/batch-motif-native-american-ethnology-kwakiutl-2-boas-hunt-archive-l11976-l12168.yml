canonical_text:
  quote: ''
  summary: 'The passage contains notes and song texts: a mourning song for Moda^na
    and his sister, who drowned at Virgin Rock; feast songs linked to an ancestor
    and a flooded house at Fort Rupert, with imagery of overfeeding, vomiting, and
    burning; and several shaman''s songs describing acquisition of power from Killer
    Whale or other supernatural powers, an undersea journey, life-bringing objects,
    extraction of sickness, purification with a hemlock ring, return of the patient''s
    soul, and a curing action involving fire and Fire Spirit Woman.'
  language: English
  quote_policy: summarized
