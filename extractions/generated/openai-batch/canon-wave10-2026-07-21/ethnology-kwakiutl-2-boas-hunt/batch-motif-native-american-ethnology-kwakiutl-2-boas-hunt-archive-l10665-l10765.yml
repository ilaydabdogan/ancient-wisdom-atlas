canonical_text:
  quote: ''
  summary: The passage describes the arrangement, materials, paintings, and ritual
    objects of several sacred rooms in a house, including rooms associated with Cannibal-at-North-End-of-World,
    Rich-Woman, Raven-at-North-End-of-World, various dancer or supernatural figures,
    and named symbolic images. It then gives a song sung by NEnwaqawa to make Cannibal
    sleep and adds ethnographic notes on disputed family affiliations, names of NEnwaqawa’s
    wife, and names or name changes of his sons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage opens by referring to rooms, a cannibal-pole, black-bear skin
    blankets, and retained head-rings and neck-rings of red cedar-bark.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sacred room of Cannibal-at-North-End-of-World and Rich-Woman is covered
    across its front with red cedar-bark, stands in the middle rear of the house,
    and has a cannibal-pole standing before it that reaches through the roof.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sacred room of Raven-at-North-End-of-World is made of broad short boards,
    painted with the whole body of a raven, and placed near the door because Raven
    eats the eyes from animals and men caught by Cannibal-at-North-End-of-World.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The rooms of Hox"hok-of-the-Sky and Crooked-Beak-of-Heaven are board-fronted,
    painted with the bodies of their respective figures, placed on either side of
    the Cannibal room, and associated with use of the cannibal head-mask.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The sacred room of Grizzly-Bear-of-the-Door is near the right side of the
    house door and is painted with a man who has grizzly-bear paws for hands and very
    long claws.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Fire-Dancer’s sacred room is made of short broad boards, painted with
    a kingfisher, and placed in the middle of the left-hand side of the house.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Beggar-Dancer’s sacred room is made of broad short boards, painted with
    a man with a raven on each side, and placed in the middle of the right-hand side
    of the house.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Turner or Tamer sacred room is made only of hemlock branches and is placed
    toward the back of the middle left-hand side of the house.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The room of One-Who-Presses-Down has a large red cedar-bark neck-ring hanging
    on it and is placed toward the back of the middle right-hand side of the house.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The sacred room of Copper-Sound-Woman is painted with the moon containing
    a great frog, while the room of the Mamaq!a has red cedar-bark spread over it
    and a human figure of hemlock branches standing on it.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: A song is said to have been sung by NEnwaqawa before telling the story, in
    order to make Cannibal-at-North-End-of-World sleep; the song addresses grandchildren
    and mentions someone walking under mountain trees with a cloud hanging halfway
    up the mountain.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage reports disagreement among Awik-!enox people and chiefs over which
    mimaym NEnwaqawa belongs to, then lists the names and name changes of his wife
    and sons.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: A footnote explains the right-left orientation used in the house description
    and states that the water of life is in the right rear corner.
  category: setting
  evidence_refs:
  - ev:10
