- id: obs:1
  text: The wives of the warriors and of the crew entering the war discussion each
    carried a dried kelp stem, sat on the right-hand side, and did not laugh.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Qlomogwa told the warrior women to give the kelp stems to their husbands so
    the husbands could blow into them.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The men blew into the kelp stems, tied the mouths shut, twisted and tied the
    stems to keep the air inside, cut them, bent them into rings, and put the finished
    neck rings on their necks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Qlomogwa instructed the women to rub their bodies with hemlock branches morning
    and evening while the men were away.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Qlomogwa instructed the women to put the breath-holding kelp rings around
    their necks at the beach, not to look back as the men paddled away, and then to
    hang the rings at the head ends of their beds without touching them again while
    the men were away.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Qlomogwa said that if one of the kelp rings burst, the women would know that
    the man whose breath was in that ring had been killed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The crew prepared two war canoes by lifting them, putting crosspieces under
    them, burning the bottoms, rubbing off charcoal, applying tallow to the waterline,
    and adding short bottom boards.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The warriors went into the woods, rubbed their bodies with hemlock branches,
    purified themselves, and later bathed in the river with their wives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After bathing, the men and their wives slept in different beds.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: At daybreak Qlomogwa called for departure, brought his gun, paddle, ammunition
    box, mat, and blankets to the war canoes, and the other warriors brought similar
    equipment and provisions.
  category: sequence
  evidence_refs:
  - ev:6
