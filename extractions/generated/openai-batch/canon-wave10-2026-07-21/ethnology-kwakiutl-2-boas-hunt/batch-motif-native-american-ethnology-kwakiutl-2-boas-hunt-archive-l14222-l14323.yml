canonical_text:
  quote: ''
  summary: In a secret meeting about going to war, Qlomogwa summons the wives of warriors
    and crew. The women bring dried kelp stems, which their husbands blow into, seal,
    twist, cut, and form into neck rings containing their breath. Qlomogwa instructs
    the women to rub themselves with hemlock branches, wear the breath-holding kelp
    rings at the beach, not look back as the men paddle away, then hang the rings
    at the head of their beds; if a ring bursts, the husband whose breath it holds
    has been killed. The crew prepares war canoes, purifies with hemlock and river
    bathing, and departs in the morning with weapons, paddles, blankets, and provisions.
  language: English
  quote_policy: summarized
