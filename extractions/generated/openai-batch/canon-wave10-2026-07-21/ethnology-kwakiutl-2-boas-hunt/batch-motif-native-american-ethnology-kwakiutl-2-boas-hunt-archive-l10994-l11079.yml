canonical_text:
  quote: ''
  summary: Ex'sokwi'lak accompanies his sea-otter-hunting brother-in-law to Moving-Island,
    kills all the sea-otters, and is abandoned there without food or water. After
    repeated invisible summonses, he sees a small messenger emerge when the top of
    the island opens and follows him into the house of the great chief of the sea.
    In the chief's house, animal servants attend the chief and a listener hears Ex'sokwi'lak's
    thoughts. Ex'sokwi'lak claims shamanic ability, removes a spear point from the
    chief's sick Sea-Lion hunter, and receives supernatural gifts, a house, and a
    chiefly name. Homesick, he is returned toward the upper world in a self-paddling
    canoe with his face covered, arrives near an enemy village, and uses a death-club
    or baton to set the houses on fire before the passage breaks off.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ex'sokwi'lak asks to accompany his wife's brother, Born-to-be-a-Spearsman,
    on a sea-otter hunt to Moving-Island.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the island, Ex'sokwi'lak finds a fine club that his father had put there
    and kills every sea-otter at their sleeping place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Born-to-be-a-Spearsman, who has not killed any sea-otters, becomes angry and
    deserts Ex'sokwi'lak on the island without food and water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the fourth day, while Ex'sokwi'lak is trying to sleep, a soft unseen voice
    repeatedly says it has been sent by the chief to call him into the chief's house.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ex'sokwi'lak bites a hole in his cedar-bark cape to look through it, then
    sees the top of the island open and a small man come out toward him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The small man identifies himself as sent by the chief, named in the passage
    as QIomogwe, and Ex'sokwi'lak follows him into the house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Inside the house, Ex'sokwi'lak sees the great chief of the sea seated in the
    rear, with many seals and sea-lions crawling about as servants and hair-seals
    as dogs of the house.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: A house listener can hear Ex'sokwi'lak's thoughts, including his wish to eat
    seal and his thought that he will say he is a shaman.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Ex'sokwi'lak sees a bone point of a spear in the side of the sick Sea-Lion
    or hunter and thinks he wants a canoe and spear as payment for healing him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The great chief says he values his hunter more highly than the canoe and spear
    and promises them, with more besides, if Ex'sokwi'lak cures the hunter.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ex'sokwi'lak pretends to feel for and suck out the sickness, then bites and
    pulls out the spear point on the fourth attempt; the Sea-Lion says he felt the
    sickness leave his body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The great chief gives Ex'sokwi'lak a hunting-canoe, serpent-spear, paddle,
    inexhaustible food-box, death-club, water of life, house, and the name Chief-of-the-Open-Sea.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: When Ex'sokwi'lak becomes homesick, the listener reports this thought, and
    the chief orders the gifts and house put aboard the canoe, with the house made
    small enough to fit aboard.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Before going to the upper world, Ex'sokwi'lak is told to cover his face so
    that he will not see the trail.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:15
  text: The Sea-Lion he cured enters the canoe, commands it to paddle, and Ex'sokwi'lak
    hears paddling on the sides of the canoe.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: After looking up, Ex'sokwi'lak finds himself near the village of his enemy
    and tests the death-club or baton by extending it toward the village, causing
    the houses to catch fire.
  category: action
  evidence_refs:
  - ev:10
