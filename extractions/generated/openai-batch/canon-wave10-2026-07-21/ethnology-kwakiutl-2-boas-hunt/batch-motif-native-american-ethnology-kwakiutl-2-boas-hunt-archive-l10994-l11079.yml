candidate_motifs:
- id: motif:1
  label: Abandoned hunter on a remote island after excessive success
  taxonomy_refs:
  - departure
  basis: A sea-otter hunt becomes a separation episode when the successful hunter
    is deserted by his angry brother-in-law without food and water.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage presents abandonment literally; assigning it to a broader
    departure pattern is interpretive.
- id: motif:2
  label: Summons into a hidden supernatural house through an opening island
  taxonomy_refs:
  - hero_descent
  basis: The stranded man is summoned by an unseen voice, sees the top of the island
    open, and follows a small messenger into the great chief's hidden house.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The movement is into an island and sea chief's house; the passage does
    not explicitly call it an underworld descent.
- id: motif:3
  label: Thought-hearing attendant in a supernatural household
  taxonomy_refs: []
  basis: The listener of the house repeatedly hears and announces Ex'sokwi'lak's unspoken
    thoughts.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:8
  confidence: high
  cautions: No supplied taxonomy reference directly matches this literal pattern.
- id: motif:4
  label: Shamanic cure by extracting a hidden spear point
  taxonomy_refs:
  - initiation
  basis: Ex'sokwi'lak claims or intends to claim shamanic status, removes a spear
    point from the Sea-Lion's side, and is declared a true shaman by the patient.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage says he pretends to feel for the sickness; it does not describe
    a formal initiation ceremony.
- id: motif:5
  label: Healing exchanged for supernatural gifts
  taxonomy_refs:
  - sacred_exchange
  basis: The great chief promises canoe and spear, and more, if his hunter is cured;
    after the cure, he gives Ex'sokwi'lak multiple powerful objects.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The exchange is explicit, though the sacred status of the exchange is
    inferred from the supernatural chief and objects.
