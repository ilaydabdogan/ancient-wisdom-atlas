- id: ev:6
  type: summary
  locator: lines 335-342
  quote_or_summary: 'DzEudzEnx''q!ayu: the house front is Qolos because Qolos is their
    ancestor. The ancestor YaxLEii''s four house dishes include Qolos, Thunderbird
    as elder brother of Qolos, whale, and beaver.'
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/ethnology-kwakiutl-2-boas-hunt.md
  rights_note: Public domain; source metadata indicates full text allowed.
- id: ev:7
  type: summary
  locator: lines 343-354
  quote_or_summary: 'Wawallibaye: the house front is whale because the chief''s ancestor
    was a whale; the name Yaqal-Euala is given and the origin is painted on the house
    front. Four dishes are whale, killerwhale, bullhead, and Dzonoq!wa-of-the-sea.
    Hemasxdo keep with Wawallibaye because they lack a noble ancestor, like Elguiwe
    and Laxsa.'
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/ethnology-kwakiutl-2-boas-hunt.md
  rights_note: Public domain; source metadata indicates full text allowed.
- id: ev:8
  type: summary
  locator: lines 355-366
  quote_or_summary: 'G''exsEm: LaLeliLla''s house-front painting is said to be the
    same as that of K''Emk''EqEwed, except for the listed house dishes: two grizzly-bear
    dishes, one wolf dish, and one beaver dish. LaLeliLla obtained these in marriage
    from chief K"Emged through the princess MEledzas.'
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/ethnology-kwakiutl-2-boas-hunt.md
  rights_note: Public domain; source metadata indicates full text allowed.
- id: ev:9
  type: summary
  locator: lines 367-373
  quote_or_summary: 'G''exsEm: the marriage-obtained house has a crosspiece on the
    front outside representing a double-headed serpent, with Thunderbird between the
