candidate_motifs:
- id: motif:1
  label: Marriage transfer of crest-bearing house and feast dishes
  taxonomy_refs:
  - sacred_exchange
  basis: Multiple entries describe houses and house dishes given or obtained in marriage,
    with the transferred property carrying exterior paintings or animal and being
    forms.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage states marriage transfer and feast-property exchange, but
    it does not explicitly call the exchange sacred.
- id: motif:2
  label: Ancestral being or animal displayed as house origin and noble status
  taxonomy_refs:
  - royal_legitimacy
  basis: Qolos is painted because he is an ancestor, the whale is painted because
    the chief's ancestor was a whale, and groups without noble ancestors are described
    as residing with other groups or being ashamed.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage connects ancestry, house imagery, and status, but the broader
    category of royal legitimacy is an analytical taxonomy label.
- id: motif:3
  label: Effigies of guests made after a feast
  taxonomy_refs: []
  basis: Omaxtlalai.e places carved men at the seats of chiefs after they had eaten
    seal and departed; the passage says this was as though he made fun of the chiefs.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The function is limited to this passage's explanation; no wider ritual
    meaning is supplied here.
- id: motif:4
  label: Animal-form dish linked to kill and postmortem destination
  taxonomy_refs:
  - afterlife_journey_map
  basis: Omaxtlalai.e makes a seal dish in imitation of the seal he killed and a killerwhale
    dish because he thought he would go to the killerwhales after death.
  evidence_refs:
  - ev:5
  confidence: low
  cautions: The passage mentions a postmortem destination but does not provide a detailed
    afterlife journey or map.
- id: motif:5
  label: Double-headed serpent and Thunderbird house-front emblem
  taxonomy_refs:
  - serpent
  basis: A marriage-obtained house front is described as having a crosspiece representing
    a double-headed serpent, with Thunderbird positioned between the serpent's eyes
    and on the head of a man in the middle.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage describes the image but gives no narrative episode for the
    serpent or Thunderbird in this section.
- id: motif:6
  label: Lack of noble ancestor causing dependent residence
  taxonomy_refs:
  - royal_legitimacy
  basis: The Laxsa stay with Haayalik'awe because they have no noble ancestor, and
    the Hemasxdo keep with Wawallibaye for the same stated reason.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: medium
  cautions: The passage gives social consequences of lacking a noble ancestor but
    does not elaborate a mythic origin narrative for these groups.
