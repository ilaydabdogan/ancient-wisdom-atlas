canonical_text:
  quote: ''
  summary: The passage catalogs several Kwakwaka'wakw numaym houses, their exterior
    paintings, marriage transfers, house dishes, ancestral beings, and cases of groups
    lacking noble ancestors. It describes killerwhale and whale house-front paintings,
    animal- and being-shaped feast dishes, interior carved men made after a seal feast,
    Qolos and Thunderbird ancestral dishes, a whale-origin house painting, and a marriage-obtained
    house-front design with a double-headed serpent and Thunderbird.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Yaex'agEine house front has killerwhales facing each other, and the house
    was given in marriage after Llaqolas married L'alEinaxodalayugwa.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Yaex''agEine marriage gift included four house or feasting dishes: whale,
    killerwhale, bullhead, and Dzonoqlwa.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Haayalik'awe house front is painted with a whale, and the house was given
    in marriage by Wag'ides; its dishes include Dzonoqlwa, whale, eagle, and beaver
    forms.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Laxsa are said to live with the Haayalik'awe because they have no noble
    ancestor.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The G'ig'Ugam have no front-house painting; their chief has carved men set
    around the interior of the house on chest-high boards, one fathom apart.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Omaxtlalai.e carved the men at the places where invited chiefs had sat after
    they had gone out from eating seal at K!aqa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The G'ig'Ugam house dishes are seal and killerwhale forms; Omaxtlalai.e imitated
    a seal he had killed and a killerwhale because he thought he would go to the killerwhales
    after death.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The DzEudzEnx'q!ayu house front is painted with Qolos because Qolos is named
    as their ancestor; their ancestor YaxLEii has house dishes including Qolos, Thunderbird,
    whale, and beaver forms.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Wawallibaye house front is painted with a whale because the ancestor of
    their chief was a whale; the chief is named Yaqal-Euala, and he painted his origin
    on the front of the house.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Hemasxdo keep together with the Wawallibaye because they are said to have
    no noble ancestor, like Elguiwe and Laxsa, and are ashamed to speak about it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The G'exsEm chief LaLeliLla obtained in marriage a house whose front crosspiece
    represents a double-headed serpent, with Thunderbird between the serpent's eyes
    and on the head of a man in the middle.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The G'exsEm dishes are two grizzly-bear dishes, one wolf house dish, and one
    beaver house dish.
  category: object
  evidence_refs:
  - ev:8
