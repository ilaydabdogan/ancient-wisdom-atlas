canonical_text:
  quote: ''
  summary: A GwasEla marriage party plans to pay marriage-money and anticipates a
    sham-fight for a princess. Chiefs travel by canoe to Chief Q!umxod's house, ask
    for the princess TslEndEgEmg'i^lak in marriage for the prince Sesaxalas, and receive
    acceptance because the two are of the same rank. Q!umxod gives the envoys blankets,
    which they carry back while singing sacred songs. The party prepares young men
    for the sham-fight. At the beach they see an upright roof-board called Climbing-Board,
    which Hayalkin explains represents a mountain; the princess will sit on top, and
    the young men must climb to her in order for the marriage claim to succeed.
  language: English
  quote_policy: summarized
