canonical_text:
  quote: ''
  summary: The passage describes rules for chiefly names, the LEWElaxa dance, houses,
    house contents, privileges, marriage debt, and inheritance connected with ^mEmx'o
    ^maxwa and his younger brother. It explains when a younger brother may borrow
    or inherit privileges, how a dying chief's last word can authorize transfer, how
    children and wives affect succession, how widow remarriage may occur, and why
    it is said that a younger brother may bewitch an elder brother to obtain his seat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: ^mEmx'o ^maxwa is described as receiving rank names such as "chief all around,"
    "prince all around," and, as a child, "Lord all around."
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger brother may show or borrow the LEWElaxa only if he has a strong
    heart and can obtain as much property as the elder brother gave away to the tribes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The name obtained in marriage by ^mEmx'o ^maxwa does not pass to the younger
    brother with the LEWElaxa, because the passage says this name belongs only to
    first children of chiefs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the younger brother finishes giving property to the tribes, he gives
    the LEWElaxa dance back to his elder brother because he cannot keep it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The LEWElaxa, family history, house, house contents, privileges, and names
    can be given to the younger brother only if ^mEmx'o ^maxwa says so when dying.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The tribe or numaym cannot object to the last word of ^mEmx'o ^maxwa if he
    speaks it before he dies.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:7
  text: "^mEmx'o ^maxwa cannot give the privileges to his younger brother if he has
    the child Wawalk'ine; if that child dies and there is no other child, the wife
    may be sent away after the marriage debt has been paid."
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After seven winters of marriage with O^mag'ilis without a child, ^mEmx'o ^maxwa
    gives up expecting to have a child with her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After ^mEmx'o ^maxwa dies, his younger brother takes his privileges, house,
    carved posts, house dishes, carved settee, and crest box because this was the
    elder brother's last word.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The younger brother may marry the widow of his elder brother if the father-in-law
    has not paid the marriage debt before the elder brother dies, and only if the
    widow is considered sensible.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Family history, core privileges, names, the house, and house contents are
    not given away in marriage to a son-in-law; only privileges obtained in marriage
    pass through marriage to the daughter or princess's husband.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says that a younger brother is often said to bewitch his elder
    brother so that the elder brother may die quickly and the younger brother may
    take his seat.
  category: speech
  evidence_refs:
  - ev:9
