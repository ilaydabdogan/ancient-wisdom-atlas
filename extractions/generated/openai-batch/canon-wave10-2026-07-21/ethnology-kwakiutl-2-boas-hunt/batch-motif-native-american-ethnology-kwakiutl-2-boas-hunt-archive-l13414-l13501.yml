canonical_text:
  quote: ''
  summary: The passage describes customary distribution of foods and goods within
    a chief's numaym. Women dig and sort cinquefoil roots, with long roots bundled
    and presented to the chief while short roots are kept for common people. Berry
    cakes and shellfish are given in portions to the chief's wife. Hunters and sea
    hunters give one of three animals to the chief, and canoes are generally given
    to him. The passage also describes the chief's wood carvers, who know the carvings
    belonging to the chief, and the procurement of cedar trees for carved house posts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman and her husband go to dig cinquefoil roots; the woman uses a digging
    stick and two baskets at the garden bed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman separates short and long cinquefoil roots, places them in different
    baskets, counts long roots by hundreds, and ties long roots into bundles with
    cedar bark.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Baskets of long cinquefoil roots intended for the chief are placed separately
    in a canoe and brought to the beach of the house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband calls the chief, shows him the baskets of long roots, and says
    they are given by his wife; the chief thanks him and calls young men to carry
    the baskets from the beach.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that chiefs eat only the long cinquefoil roots, while common
    men eat the short roots.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A woman who makes berry cakes gives a bundle to the chief's wife; if the chief's
    wife considers the amount insufficient, quarrels may occur.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When a berry picker has many dried berry-cake bundles, she gives forty bundles
    to the chief's wife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women who dig shellfish give a small amount of clams, mussels, small mussels,
    and horse clams to the chief's wife.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A hunter who has shot three bears gives one to the chief of his numaym, and
    a sea hunter who has killed three sea otters gives one to the chief of his numaym.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage generalizes the giving practice to goods obtained by hunters,
    sea hunters, and canoe builders, stating that the canoe is generally given to
    the chief.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The chief and his carvers generally live together in one house.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the chief wants carved posts for his house, he tells his carver; the
    carver already knows the carvings that belong to the chief.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Another man of the chief's numaym obtains cedar trees to be carved by the
    wood carver, and the trees are placed on the beach of the chief's house.
  category: action
  evidence_refs:
  - ev:8
