canonical_text:
  quote: ''
  summary: Gwa'sEla chiefs arrive in canoes to seek Ts!EndEgEmg'i^lak" in marriage
    and distribute blankets. Qasnomalas, her uncle, calls a sham-fight between the
    Nak!wax'da^x" and the Gwa'sEla. During the fighting the princess climbs to a platform
    at the top of a climbing-board, later described as the top of a mountain. Qasnomalas
    stops the fight, announces names for a possible future child of the princess and
    Chief Sesaxalas, and challenges Gwa'sEla young men to climb to her. After failed
    attempts, the skilled young man Gwayosdedzas wets his feet, climbs the board,
    reaches the princess, receives blankets, and descends with her into Q!umx'od's
    house.
  language: English
  quote_policy: summarized
