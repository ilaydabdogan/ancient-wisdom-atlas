canonical_text:
  quote: ''
  summary: News reaches NEqap lEnk'Em that his brother-in-law Qlomoxs^ala, sister
    LEJelElgawe, and niece K'!6x"se'stili^lak" have died after travel from Victoria
    under uncertain circumstances. NEqap lEnk'Em clears his house, summons Kwagul
    men, gathers hemlock branches, and asks who will wail. A warrior says the chief
    should not wail and calls for a cedar pole. Warriors place hemlock wreaths or
    branches on the pole as skull-promises and call for war. NEqap, under the warrior
    name Yag'is, adds two wreaths as skulls for his sister and niece; common men volunteer
    as crew, and Chief Q!omogwa tells the tribe to summon warrior women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A news-bearer reports deaths among NEqap lEnk'Em's relatives and says the
    cause is not known, suggesting capsizing or drink as possibilities.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: NEqap lEnk'Em leaves the news-bearer's house, goes to his own house, and tells
    Hamdzid to clear it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: NEqap lEnk'Em asks Hamdzid to go into the woods and break off many good hemlock
    branches.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: NEqap lEnk'Em sends TslagEyos to call the full-grown men of the Kwagul to
    his house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The called Kwagul men come into the house, and Hamdzid brings many hemlock
    branches and places them before NEqap lEnk'Em.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: NEqap lEnk'Em addresses the tribe and asks who shall wail because of the news
    about Qlomoxs^ala, LEJelElgawe, and K'!6x"se'stili^lak".
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The warrior H6x"hox"dze replies that the chief should not wail and says to
    put up the cedar pole.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hamdzid takes a sharpened cedar pole and drives it into the floor as a holder
    for a hemlock wreath to be used by warriors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Two warriors, GwaxwaLEYigilis and K'ilEm, enter carrying hemlock wreaths.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: GwaxwaLEYigilis asks Yag'is to go to war so someone else may wail, and he
    places a wreath on the post as one skull and as a promise.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: GwaxwaLEYigilis says that a great raven is very hungry for men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: K'ilEm says he will sit in front of the steersman of Yag'is's war canoe, says
    he is not afraid, and places his hemlock wreath on the post as one skull promise.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Lix'Elag'ilis says he wants to eat men and that a great cannibal is hungry
    for men; he hangs a hemlock branch on the post and says it is one skull he will
    get in war.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: NEqap lEnk'Em, called Yag'is in this warrior context, has Hamdzid make two
    hemlock wreaths, calls them his two skulls for his sister and niece, and places
    them on the cedar post.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Common men volunteer one by one to be the crew and friends of Yag'is.
  category: speech
  evidence_refs:
