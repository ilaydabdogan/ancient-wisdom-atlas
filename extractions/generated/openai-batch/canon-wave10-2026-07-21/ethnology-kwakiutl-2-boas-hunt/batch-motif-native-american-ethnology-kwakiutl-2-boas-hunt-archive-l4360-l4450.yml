canonical_text:
  quote: ''
  summary: The passage narrates public gatherings around marriage gifts, childbirth,
    naming, and chiefly status. Blankets are carried and distributed; speakers invite
    named numayms; a child’s dance and name change are announced; a newborn girl receives
    the name of a deceased sister; and house, seat, and numaym affiliations are transferred
    or affirmed amid stated rivalry over wife-status.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The numaym SeniJEm arose, took twenty-five blankets, and went out of the house
    while Alak'ilayugwa walked among them with her slaves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yaqostod, now called Kwaxilanokume, sent speakers to invite four numayms to
    see the dance of his child ^maxillayugwa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kwaxilanokume stated that the twenty-five blankets came from YaqoLElasEme,
    announced that LalelFlak had changed her name to ^maxillayugwa, and gave away
    the blankets.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Alak'ilayugwa, described as the second wife of Kwaxilanokume, gave birth to
    a girl; YaqoLElasEme then invited his numaym, the YaexagEme, into his house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: YaqoLElasEme announced thirty-five blankets as a marriage gift to his son-in-law,
    together with a house, a seat of his deceased younger brother, and a name for
    his granddaughter.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: At his son-in-law’s house, YaqoLElasEme said the thirty-five blankets were
    to wipe off the blood of his granddaughter and that the name of his deceased sister
    ^nEmnasalayugwa would belong to the child.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narration states that YaqoLElasEme acted because he wished to rival A-walaskinis
    and had resolved that Alak'ilayugwa should be head wife.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kwaxilanokume thanked YaqoLElasEme, asked him to speak on his behalf, promised
    thirty-five blankets to named groups for ^nEmnasalayugwa, and was described as
    having a name from a new numaym and two seats.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Speakers called the GwetEla, 'walas Kwagul, and Q!omk!ut!Es; the house was
    cleared, the YaexagEme were invited, and the GwetEla entered and sat on the right-hand
    side of the house.
  category: sequence
  evidence_refs:
  - ev:8
