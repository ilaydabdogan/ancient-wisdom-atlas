canonical_text:
  quote: ''
  summary: The passage describes chiefly name succession among numayms, the gathering
    of seven numayms, relationships and pregnancies outside formal marriage across
    two generations, the naming of children by grandfathers, the death of one son
    by canoe upset, and Hayalk'in's later connection with the house of Doqwayis.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: G'exk'Enis remained head chief, and the name G'exk'Enis was given to the eldest
    son whenever the father died.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ElgOnwe^ numaym kept together with the Laalax's^Endayo, whose chief Llaqwalal
    followed a similar name-succession rule; even an eldest daughter could take the
    father's place, and younger brothers could not take it from her.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: All seven numayms gathered at Qalogwis; G'exk'Enis had many children, including
    the youngest son Hawas, and Wag'ides had a youngest daughter named Llax'LlEledzEmga.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hawas went to Llax'LlEledzEmga every night; when her changed body showed pregnancy,
    she told her father that Hawas lay with her and that she loved only him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wag'ides told his daughter to show herself with Hawas as if he were her husband,
    and Hawas and Llax'LlEledzEmga lived together as illegitimate husband and wife
    from different numayms.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Llax'LlEledzEmga bore two boys by Hawas; Wag'ides named them LElbEx'salag'ihs
    and K'!as6^, and the passage says the latter was improperly given a true name
    because the mother had not been properly married.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After the father of Hawas died, Hawas took his father's place and name, becoming
    G'exk'Enis.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When LElbEx'salag'ihs grew up, he became the lover of another Llax'LlEledzEmga,
    daughter of the common man Q!omledEnol and belonging to the Hemasxdo numaym; the
    passage links their movements with Tsaxis and Fort Rupert.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The second Llax'LlEledzEmga became pregnant without a husband, was mocked
    by men and women, and went into LElbEx'salag'ihs's house to live as his illegitimate
    wife; the passage calls this a new disgrace to the Elgunwe^ numaym.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The second Llax'LlEledzEmga bore WawungEnol, an unnamed boy who died young,
    and Hayalk'in; Q!omledEnol named WawungEnol and Hayalk'in.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: WawungEnol died when his canoe upset while he was paddling and hunting at
    the lower end of LE^lad.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: After WawungEnol's death, Hayalk'in was the only son of Llax'LlEledzEmga and
    LElbEx'salag'ihs, and he often went to the house of Doqwayis because his mother
    said she was a near relative of the past chief Doqwa^as.
  category: relationship
  evidence_refs:
  - ev:10
