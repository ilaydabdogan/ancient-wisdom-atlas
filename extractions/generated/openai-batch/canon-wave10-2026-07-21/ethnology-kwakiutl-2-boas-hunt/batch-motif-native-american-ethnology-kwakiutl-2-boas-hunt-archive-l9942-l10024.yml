canonical_text:
  quote: ''
  summary: A ceremonial sequence gathers selected young men, young women, and two
    children into a sacred room of hemlock-branches where forty masks are named, arranged,
    and worn. X'imsElilEla, named as chief of the masks, calls other masks to dance,
    and the forty masks dance for ALotEmdalag'ils over four nights. Afterward ALotEmdalag'ils
    becomes angry with his parents, uses a death-bringing baton to turn them into
    stone, is feared, and is then described as a great shaman when Llaqwag'ila becomes
    gravely ill.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: L!aqwag'ila asks for twenty-four strong young men, sixteen strong young women,
    one boy, and one girl; four men are sent to get the women and children, and the
    young men enter the sacred room of hemlock-branches.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: ALotEmdalag'ils identifies the chief of the masks as the mask of X'imsElilEla,
    names forty masks, and has them placed in their proper positions in the sacred
    room.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Awik'!enox are instructed about MamayoLEmalaga, who gives birth to a boy
    and a girl, and about children who dance immediately after they are born.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women, men, and the two children sit outside the masks they are to wear, and
    the wearer of X'imsElilEla's mask is told not to fear mistakes because the owner
    of the masks will advise him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Awik'!enox enter the great dancing-house, the song-leaders sit at the
    rear, and X'imsElilEla shouts and dances out of the sacred room carrying a rattle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: X'imsElilEla calls HoxhoxtilsEla to dance, HoxhoxtilsEla comes out dancing,
    and the same calling-and-dancing sequence is repeated down to the last of the
    forty masks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The forty masks of the spirits and ALotEmdalag'ils dance without mistakes;
    the dancing continues until daylight and is performed for ALotEmdalag'ils over
    four nights.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: ALotEmdalag'ils becomes sick at heart and angry against his parents because
    his father is angry with him; he has shown his great treasure to the Awik'!enox
    but not to the Naklwax'da'xw living at Tegiixste that winter.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: ALotEmdalag'ils hears that Ts!Ex^ed and Ts!Eqala are paddling from K'!etet
    to his house, takes his death-bringing baton, and waits in the doorway with Llaqwag'ila
    and P5Las beside him.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: ALotEmdalag'ils says he will take revenge for the ill will of his father and
    mother, strikes the death-bringing baton toward them, and they become stone.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the petrification, the Awik'!enox fear ALotEmdalag'ils, no one dares
    go near his great house, and he lives alone.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Awik'!enox have not yet discovered that ALotEmdalag'ils is a great shaman,
    although they hear him singing sacred shaman-songs; when Chief Llaqwag'ila becomes
    gravely sick, a man proposes sending four noblemen to call ALotEmdalag'ils to
    cure him.
  category: sequence
  evidence_refs:
  - ev:7
