canonical_text:
  quote: ''
  summary: NEnwaqawa secures his house after his children return and report seeing
    QuxElal and her child in the house of Cannibal-at-North-End-of-World. When the
    cannibal arrives at the roof, NEnwaqawa delays him until morning, then prepares
    a concealed fire pit and a feigned-death display using dog intestines on his sons.
    The next day he seats the cannibal as a guest, tells a story until the cannibal
    and his family become sleepy, and the sons throw the cannibal and his son into
    the fire pit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A long cedar-bark rope is tied around the house, and the three children help
    before the household enters and bars the door.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wak'as reports seeing QuxElal with her son in the house of Cannibal-at-North-End-of-World.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wak'as says QuxElal's child cried for blood scraped from his knee, licked
    it, and that bodies of tribesmen were drying over the house fire.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cannibal-at-North-End-of-World comes to the roof, utters a cannibal-cry, opens
    the roof, and shows his head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: NEnwaqawa addresses the cannibal as son-in-law and tells him to return in
    the morning with his wife and grandson, when he may cut the three sons.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: NEnwaqawa sits apart to devise what to do and assigns his sons to dig a hole,
    gather firewood, and gather stones.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: A fire is put into the hole in the floor, many stones are placed on it, and
    boards are arranged near the hole.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The sons are instructed to kill dogs, remove the intestines, hide the dog
    bodies, and lie on their backs with the intestines on their stomachs so the cannibal
    will believe they are dead.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: In the morning NEnwaqawa covers the fire pit, arranges a settee and mats,
    and has the three sons lie motionless on boards.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Cannibal-at-North-End-of-World enters first, followed by his son and then
    QuxElal; he sees the sons lying on boards and wants to eat them immediately.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: NEnwaqawa stops the cannibal by invoking guest custom, seats him on mats,
    and says a story is told first for guests.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: While NEnwaqawa tells the story, the cannibal, QuxElal, and the son become
    sleepy; NEnwaqawa tests the cannibal by pressing his knee against him and hears
    him snore.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The three sons uncover the fire pit and throw the cannibal and his son, on
    the mat where they lie, into the fire; NEnwaqawa and Kanelk'as cover the pit.
  category: action
  evidence_refs:
  - ev:9
