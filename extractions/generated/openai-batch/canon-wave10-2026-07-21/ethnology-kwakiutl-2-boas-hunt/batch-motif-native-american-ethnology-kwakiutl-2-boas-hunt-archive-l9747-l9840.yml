canonical_text:
  quote: ''
  summary: TslEx-ed and his wife visit the Awik'!enox. Their song-leaders discuss
    unfamiliar songs heard from a great house, and TslEx-ed and Chief Ewultlala suspect
    the songs concern K!wak!wabalas, TslEx-ed's son, who had gone to commit suicide.
    The Awik'!enox sit outside at night to learn the songs and dance procedures, hearing
    X'imsElilEla, head chief of the spirits, call names from a sacred room of hemlock
    branches while forty masks or dancers appear. ALotEmdalagils sings inside the
    sacred room, and his parents recognize him by his voice. The passage then describes
    dance powers and repertoires associated with Hamase'na, Wuqagas, and QIaminagas,
    including cannibal-song masks, frog war-dance, frogs entering a dancer's stomach,
    internal whistles, and instruction of qaminagas dancers.
  language: English
  quote_policy: summarized
