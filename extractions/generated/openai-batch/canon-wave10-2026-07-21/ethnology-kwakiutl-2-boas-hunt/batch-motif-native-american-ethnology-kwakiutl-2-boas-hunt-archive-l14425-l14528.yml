canonical_text:
  quote: ''
  summary: A war party returns to Fort Rupert after eleven days, singing and displaying
    scalps. A near-conflict follows because Tslagayos had shot G'exk'Enis in a marriage
    rivalry over L!aqwax'sa. G'exk'Enis convenes a feast and asks the chiefs what
    should be done. NEqaplEnk'Em offers a war canoe and blankets as compensation,
    preventing retaliatory shooting and restoring peace between G'exk'Enis and Tslagayos.
    Later L!aqwax'sa marries another man, and young men are sent to cut poles and
    cedar materials for tying up the heads taken in war.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The warriors traveled in war canoes, used sails in favorable weather, alternated
    sleep, carried canoes into the woods in bad weather, and kept watch for passing
    canoes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that during war they would kill anyone seen paddling by,
    even relatives, and that people avoided paddling when warriors were traveling.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After eleven days away, the warriors returned to Fort Rupert in the morning
    while singing the war song.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the beach by the house of Yagis, Q lomogwa' stood up in a war canoe and
    announced the result of the war expedition.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The warriors held up the heads, described as scalps taken off, so that people
    who had stayed at home could see them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After leaving the war canoes, the warriors carried the heads in their hands,
    and a girl slave followed her master GwaxwaLEjIgJlis.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The people were called together in the house of Chief Ts!Ex"ts!aes; the narrator
    says he was not allowed by his father to listen to the speeches.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: A near-fight occurred after the warriors returned because it was learned that
    Tslagayos had shot G'exk'Enis in connection with a marriage rivalry over L!aqwax'sa.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: L!aqwax'sa had refused Tslagayos, was wanted by G'exk'Enis, and was expected
    to marry G'exk'Enis after his return from war.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: G'exk'Enis called the GwetEla to a feast; Tslagayos was initially absent and
    was summoned, and the guests ate dried salmon and crab apples.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the feast, G'exk'Enis said there was nothing bad in his heart and asked
    the chiefs to decide what should be done about the shooting.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: NEqaplEnk'Em offered a war canoe valued at sixty blankets and forty additional
    blankets to buy off the offense.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The chiefs accepted the settlement; the passage notes that G'exk'Enis had
    hidden a pistol and that the compensation prevented Tslagayos from being shot.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: After the settlement, G'exk'Enis and Tslagayos are said to have had one heart.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: L!aqwax'sa later married Le^lenox" of the numaym DzEudzEnx'qlayo of the 'walas
    Kwag'ul.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Four young men, sons of warriors, were sent into the woods to cut seven poles,
    two shorter forked poles, a young cedar tree, and twisted cedar for tying up the
    severed heads.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The cut poles and cedar materials were to be placed northeast of the fort
    near the houses of the white men at Fort Rupert.
  category: setting
  evidence_refs:
  - ev:8
