canonical_text:
  quote: ''
  summary: A ritual dance is performed around the central fire before a sacred room
    of hemlock branches. XimsElilEla emerges, identifies the dance and its regalia
    as a treasure to be transferred to K!wak!wabalas, gives him new names and ritual
    obligations, instructs him about showing and burning forty masks, and calls the
    spirits to purify him. A magical mat is spread, and named persons carry Gwaexsdaas
    to it for further ritual work.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: ALotEmdalag'ils dances repeatedly around the fire in the middle of the house
    and pauses or dances outside the sacred room of hemlock branches while song-leaders
    sing with slow time-beating.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the dance, XimsElilEla comes out of the sacred room of hemlock branches
    carrying red cedar-bark ornaments associated with ALotEmdalag'ils's last dance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: XimsElilEla tells K!wak!wabalas that the great winter-dance house, the dance
    called m.aqlEm, the name ALotEmdalag'ils in a specific ritual context, and a change
    of name to Gwaexsdaas will belong to him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The instructed ritual dress includes hemlock branches for the first appearance
    and red cedar-bark mixed with white for a later evening dance.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: XimsElilEla instructs Gwaexsdaas to give winter dances for four successive
    years, show the masks of forty friends, and then burn the masks so that the friends
    may return.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that not burning the masks will bring misfortune.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: XimsElilEla says Gwaexsdaas will receive a death-bringing baton for use against
    those in his tribe who hate or envy him because of the treasure.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: XimsElilEla says the treasure comes from the supernatural place where he lives
    with his friends and is going for the first time to the seaside hero; he also
    says it is not related to Cannibal-at-North-End-of-World, who lives inland.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: XimsElilEla calls his friends to purify Gwaexsdaas so no harm will come to
    him because of the treasure.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Forty spirits come out of the sacred room of hemlock branches and sit in the
    rear of the great dancing-house; the new dancer also sits there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ts!EqomeLElsa=na brings a magical mat from the sacred room of hemlock branches
