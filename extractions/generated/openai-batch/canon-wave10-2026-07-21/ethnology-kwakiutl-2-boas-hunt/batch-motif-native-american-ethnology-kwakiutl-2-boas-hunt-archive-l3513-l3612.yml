canonical_text:
  quote: ''
  summary: Llaqwagila remains apart, performs repeated water-sprinkling acts, dreams
    of the old speaker of the winter-dance house, and is told that the house disappeared
    as a test. Over four nights Hamsbe/hamshamtslEs is tamed in connection with the
    sacred room and songs. Llaqwagila returns toward his father's village with the
    supernatural treasure, a great named winter-dance house and dance. He explains
    the treasure to his father, gives him winter-dance and chief names, and the passage
    then states related house, numaym, and family genealogy details.
  language: English
  quote_policy: summarized
