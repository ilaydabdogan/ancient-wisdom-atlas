canonical_text:
  quote: ''
  summary: The passage describes a feast held for the child Wawalk'ine, with invited
    groups seated in the feasting-house, four named house-dishes filled with raw cinquefoil
    roots and assigned to guest groups, and oil served according to rank. Later, when
    the child is ten months old, young men singe his hair, bind his limbs with straps,
    apply red ochre, receive gifts, and the father renames him AxauEm (Wolf). The
    grandfather Ewanux"dze then proposes giving blankets and a high-rank name, Laleplalas,
    for the child.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Groups are called on behalf of Wawalk'ine, the child of GwE^yimdze, and invited
    guests sit in designated areas of the feasting-house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ewanux"dze asks GwE^yimdze to send his numaym to get four house-dishes from
    Ewanux"dze's house.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The four house-dishes are identified as killer-whale, whale, seal, and double-headed
    serpent.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Young men of the numaym SenL!Em bring the four house-dishes and two ladles
    into the feasting-house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Raw cinquefoil roots are placed into the house-dishes until the dishes are
    full.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The double-headed serpent, killer-whale, seal, and whale dishes are placed
    before named guest groups.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Oil is brought as a second course, ladled out, and drunk first by chiefs and
    head men and afterward by men of lower rank.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the oil drinking, the guests take cinquefoil roots from the house-dishes,
    carry them in blankets, and leave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The child is called Wawalk'ine until he is ten months old.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: At ten months, young men singe off the child's hair, put straps around his
    legs and arms, and apply red ochre to his head and face.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The young men also paint their own faces and each receives a handkerchief
    or shirt from GwE^yimdze.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: GwE^yimdze instructs the young men to stop calling the child Wawalk'ine and
    to call him AxauEm, glossed as Wolf.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage identifies this as an ochre-name or ochre-giving custom, distinct
    from names of high rank.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Ewanux"dze feels sorry that his grandson has no name of high rank and proposes
    giving sixty blankets and the name Laleplalas as a marriage gift to his son-in-law.
  category: action
  evidence_refs:
  - ev:8
