canonical_text:
  quote: ''
  summary: The passage gives a genealogical and ceremonial account of HamesElal acquiring,
    holding, and transmitting names, seats, and dance prerogatives through speeches,
    numaym consent, blanket distributions, marriages, marriage gifts, and later appointment
    of replacement heirs because he has no children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker announces that a named person will take a seat associated with a
    past holder; the Kwagul agree, and four hundred blankets are distributed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the death of HamesElal's grandfather Ewanuxdze, Q!ex'Lala calls the
    LaalaxsEndayo numaym, presents her son, asks that he take the grandfather's seat,
    and the men agree.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: HamesElal is given the name Ewanuxdze in the LaalaxsEndayo numaym, becomes
    head man of that numaym, and also retains a seat in SenL!Em, so that he holds
    two seats.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Through successive marriages, HamesElal obtains secular and winter names,
    including named dance prerogatives such as beggar-dance, war-dance, fool-dance,
    and rattle-dance names.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the marriage with Hek'inedzEmga, the gifts include the cannibal-dance,
    a cannibal-mask called tooth-mask, hoxhok and crooked-beak head-masks, and several
    other named dances.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage repeatedly states that HamesElal has no child, despite several
    marriages.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:7
  text: HamesElal later takes NuEmogwis to replace him in SenL!Em and K!wak!wabalasEme
    to replace him in LaalaxsEndayo; these successors receive names and seats.
  category: action
  evidence_refs:
  - ev:7
