canonical_text:
  quote: ''
  summary: After being struck with tongs by his father TslExed, K!wak!wabalas leaves
    the house and goes into the woods. His people search unsuccessfully. He travels
    inland up the Wawale River, repeatedly washes in river and lake water, sleeps
    under cedar, and after four nights dreams of a supernatural visitor who tells
    him to remain four more nights. He builds a shelter of hemlock branches, eats
    berries, and dreams of another visitor, HoxhoxulsEla, who says X'imsEllEla had
    visited first and instructs him to keep washing in the supernatural lake until
    the human smell comes off.
  language: English
  quote_policy: summarized
