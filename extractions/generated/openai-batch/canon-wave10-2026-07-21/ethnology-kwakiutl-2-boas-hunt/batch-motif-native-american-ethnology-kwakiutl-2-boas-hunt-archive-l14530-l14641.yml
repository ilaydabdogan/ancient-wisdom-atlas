- id: motif:5
  label: War song of fire-bearing destruction and name power
  taxonomy_refs:
  - world_destroying_fire
  basis: The song boasts of setting fire to tribes everywhere with a fire bringer
    and of the speaker’s name killing them.
  evidence_refs:
