candidate_motifs:
- id: motif:1
  label: Killing others to accompany a dead chief or child
  taxonomy_refs:
  - sacrifice
  basis: The passage explicitly names “pulling under” as killing to die with a dead
    chief, and QasElas’s people infer that the canoe party seeks to kill someone to
    die with the child.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:9
  confidence: medium
  cautions: The available taxonomy term “sacrifice” is approximate; the passage frames
    the act as killing to accompany the dead, not as an offering to a deity.
- id: motif:2
  label: Trophy heads displayed after war
  taxonomy_refs: []
  basis: Cut-off heads are set on sharpened poles, treated with eagle-down, named
    as a display, and left visible to visitors.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No provided taxonomy family closely matches this display.
- id: motif:3
  label: Bereavement redirected into revenge or substitute killing expedition
  taxonomy_refs: []
  basis: After QasElas’s son dies, QasElas threatens his relatives and then joins
    an armed canoe trip that others interpret as an attempt to kill someone to die
    with the child.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The excerpt ends before any killing at Omanis is narrated.
- id: motif:4
  label: Changed object linked to absent or wounded person
  taxonomy_refs: []
  basis: L!aqwamaga’s seaweed neck ring becomes flabby three days after the warriors
    leave, and the change provokes crying.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage does not explicitly explain the meaning of the neck ring’s
