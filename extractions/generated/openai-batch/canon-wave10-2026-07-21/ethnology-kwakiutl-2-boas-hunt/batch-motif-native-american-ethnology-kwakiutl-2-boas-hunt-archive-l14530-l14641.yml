  confidence: low
  cautions: The “world_destroying_fire” taxonomy reference is uncertain because the
    fire appears in a war-song boast about tribes, not an explicit destruction of
    the world.
- id: motif:6
  label: Deceptive pretext for hostile travel
  taxonomy_refs: []
  basis: The men say they are sea-otter hunting and later claim wind-driven refuge,
    while their people guess their purpose is to kill someone to die with the child.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The excerpt does not confirm the final outcome of the concealed purpose.
