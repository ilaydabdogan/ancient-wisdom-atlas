canonical_text:
  quote: ''
  summary: The passage describes a postwar display of severed heads, explains a practice
    called “pulling under” or killing someone to die with a dead chief, gives war-song
    verses attributed to NEqap!EnkEm, and begins another account in which QasElas,
    after his son’s death, nearly targets his brother and uncle before traveling armed
    toward Omanis under a hunting/refuge pretext.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four young men cut wood behind the fort and placed it northeast of the fort;
    warriors made a frame with sharpened poles and placed cut-off heads on it after
    scalps had been removed and eagle-down added.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The displayed heads were called “cut off heads hung up” and were left until
    they fell down, where visitors from various tribes could see them.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage names a practice “pulling under,” also called killing “to die
    with the dead chief,” and connects it with NEqap!EnkEm’s killing of WaxEldEk,
    WaxEldEk’s wife, and two children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: WaxEldEk and his crew are described as having been killed without cause, and
    the Sanetch are said not to have made war on the Kwag'ul.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Three days after warriors left for war, L!aqwamaga’s seaweed neck ring became
    flabby, and iJaqwaxsa cried continually.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: War-song verses speak of beginning at the upper end of the tribes, setting
    fire to tribes with a fire bringer, and a name that killed them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: QasElas’s son died; QasElas’s brother maxwa and uncle L!aqwagidEk came in,
    the boy was put into a coffin, and he was buried immediately.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the burial, QasElas took a gun and said he would follow his thoughts
    and “pull under” both maxwa and L!aqwagidEk under his prince.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: maxwa objected and pointed to smoke and people at Omanis, after which QasElas
    agreed to go there.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: QasElas, maxwa, and L!aqwagidEk left in a small canoe carrying guns and spears,
    while saying they were going to hunt sea otters; their people guessed they intended
    to kill someone to die with the child.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: At Kawaq they tied blanket strips over the locks of their guns to keep powder
    dry, loaded the guns, hoisted sail in a northwest wind, and traveled to Omanis.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: At Omanis, NEugEmahs questioned them, and maxwa answered that they had failed
    to hunt sea otters and had come there because of the north wind.
  category: speech
  evidence_refs:
  - ev:11
