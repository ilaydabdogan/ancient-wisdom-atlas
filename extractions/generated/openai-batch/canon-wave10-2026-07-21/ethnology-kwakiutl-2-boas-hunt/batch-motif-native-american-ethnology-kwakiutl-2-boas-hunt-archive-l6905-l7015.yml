canonical_text:
  quote: ''
  summary: The passage records chiefly succession, marriage alliances, naming, and
    the scattering of inherited names through descendants. It also begins a narrative
    of LloLotsa, a poor helper of Omax!alaLe, who gives away a supernatural canoe,
    serves as steersman, visits the slave woman Tsele, and has a child with her outside
    a formal marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: YaqoLas has another son; YaqoLas and Wag'idis give blankets to the Ximkish,
    and the child takes the seat and name Hamisk'Enis in his numaym.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wag'idis woos Hamdzid, the princess and daughter of chief 'maxwa, on behalf
    of his eldest son Doqwayis; Doqwayis marries Hamdzid.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Doqwayis and Hamdzid have a son, Wawalk'ine, who receives a name from his
    mother's side.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When chief 'maxwa becomes fatally ill, he summons his numaym and asks that
    his grandchild Wawalk'ine take his place and later bear his name.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After 'maxwa dies and is buried, NEg'a calls the Mamaleleqala together to
    comfort Hamdzid and Wawalk'ine.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: HawasElal promises to give away blankets to all the tribes on Wawalk'ine's
    behalf; Wawalk'ine's name is changed to 'maxwa, and he is said to be highest among
    the Mamaleleqala although still a child.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gweno marries the princess of Wak'as, and their son GwayolElas receives a
    name connected with 'max'mEwIsagEme.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Llaqwael marries chief TslEse; her children receive names from the DzEndzEnxq!ayo,
    and winter dances are given in marriage to her husband.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage explains that DzEndzEnxq!ayo names are scattered because 'max'mEwIsagEme
    went far away to marry and because of his children and grandchildren.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: LloLotsa is introduced as a poor helper of Omax!alaLe, with unknown origin,
    who would have been chief because of a supernatural treasure canoe found on the
    river G'Eyox but gives it to Omax!alaLe.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: LloLotsa is described as foolish, unlucky because of the hunting-canoe, and
    serving as steersman for Omax!alaLe while skinning sea-otters that Omax!alaLe
    spears.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: LloLotsa repeatedly goes to Tayagol to visit Tsele, a pretty slave woman of
    unknown origin; Tsele becomes pregnant, and LloLotsa takes her as wife without
    a formal marriage.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Tsele gives birth to a boy, and Lalaxs'Endayo is ashamed of what his slave
    Tsele has done.
  category: sequence
  evidence_refs:
  - ev:10
