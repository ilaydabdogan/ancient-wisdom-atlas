  claim: The Wawalk'ine succession episode performs the same function as a royal_legitimacy
    pattern by grounding authority in blood descent, public naming, and group acknowledgment.
  claim_level: same_function
  target: royal_legitimacy motif family
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage is ethnographic-genealogical and does not present a separate
    mythic ordeal or divine sanction.
- id: claim:2
  claim: The passage itself explains the distribution of DzEndzEnxq!ayo names among
    northern tribes as a result of distant marriage and descendants, supporting comparison
    to an intra-corpus pattern of name diffusion through alliance.
  claim_level: same_function
  target: name diffusion through marriage among nearby/northern tribes
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal explanatory comparison, not evidence for external
    historical contact beyond the named groups in the passage.
