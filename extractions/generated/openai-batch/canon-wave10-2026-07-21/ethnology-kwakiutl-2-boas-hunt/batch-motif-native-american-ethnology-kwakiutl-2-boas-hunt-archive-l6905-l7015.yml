candidate_motifs:
- id: motif:1
  label: Child successor legitimized by inherited name and public acknowledgment
  taxonomy_refs:
  - royal_legitimacy
  basis: A dying chief publicly names his grandchild as successor, the community later
    comforts the child and mother, blankets are promised, and the child's name is
    changed to the chief's name.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage records chiefly social procedure rather than a supernatural
    kingship myth.
- id: motif:2
  label: Name and privilege transmission through marriage and descent
  taxonomy_refs:
  - royal_legitimacy
  basis: Children receive names from the mother's side or from DzEndzEnxq!ayo names,
    and the passage explains the wider scattering of these names through distant marriages
    and descendants.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  confidence: high
  cautions: The motif is genealogical and institutional; it should not be treated
    as a narrative adventure pattern.
- id: motif:3
  label: Prestige exchange with blankets at status transition
  taxonomy_refs:
  - sacred_exchange
  basis: Blankets are given when Hamisk'Enis takes a seat, and a blanket distribution
    is promised when Wawalk'ine takes the name and position of 'maxwa.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: medium
  cautions: The passage supports ritualized exchange, but the taxonomy label 'sacred_exchange'
    may be broader than the literal evidence.
- id: motif:4
  label: Supernatural treasure lost through transfer
  taxonomy_refs:
  - sacred_exchange
  basis: LloLotsa has a supernatural treasure canoe that could have made him chief
    but gives it to Omax!alaLe and remains poor and subordinate.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage calls the canoe supernatural treasure, but does not describe
    a formal ritual exchange.
- id: motif:5
  label: Non-formal union with socially marginal woman produces a child
  taxonomy_refs: []
  basis: LloLotsa repeatedly visits Tsele, a slave woman of unknown origin; she becomes
    pregnant, he takes her as wife without formal marriage, and she gives birth to
    a boy.
  evidence_refs:
