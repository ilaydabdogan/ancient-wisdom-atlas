canonical_text:
  quote: ''
  summary: 'The passage describes a winter dance-house ceremony: Sparrow heralds invite
    and announce arriving dancer groups, songkeepers and children receive instructions,
    named dancer groups enter and sit in ordered places, and the ceremony distinguishes
    half-initiated and fully initiated winter dancers. It describes floor-wiping or
    floor-cleaning performers, disappearance or being driven into the woods for fully
    initiated dancers, and the summoning of individual women dancers such as HamasEwid
    and QIayaxstalas through heralds, rattles, songs, and boards.'
  language: English
  quote_policy: summarized
