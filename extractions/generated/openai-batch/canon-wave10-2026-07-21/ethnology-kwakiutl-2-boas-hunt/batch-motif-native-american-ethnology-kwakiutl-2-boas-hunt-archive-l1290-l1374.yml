canonical_text:
  quote: ''
  summary: A chiefly kinship and marriage narrative recounts names inherited or received
    in marriage, identifies relatives and spouses from high-ranking houses, urges
    a younger brother to marry northward, then describes a journey to Rivers Inlet,
    ritual precedence given to a cannibal-dancer before a meal, a marriage request
    for a princess, a blanket payment, and reciprocal transfer of a name, copper,
    slaves, dances, cedar-bark, and a carved pole with figures.
  language: English
  quote_policy: summarized
