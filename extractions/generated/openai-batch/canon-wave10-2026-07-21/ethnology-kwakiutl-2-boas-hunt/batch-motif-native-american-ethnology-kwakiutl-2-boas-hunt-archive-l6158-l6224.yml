canonical_text:
  quote: ''
  summary: A marriage-related speech announces that Sesaxalas has obtained the princess
    TslEndEgEmg'i^lak and will receive named house-dishes, blankets, boxes of crabapples,
    oil, a house name, and a dancer name. The Gwa'sEla are hosted, fed, and depart
    by canoe with the bride and goods. At Gwek'ilis, Llasotiwalis orders a feast,
    displays the goods, has feasting-songs sung, fills the house-dishes and small
    dishes with crabapples and oil, and distributes the four animal-named house-dishes
    to named numayms and their chiefs or princes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker says that Sesaxalas has obtained the princess TslEndEgEmg'i^lak
    and will receive four house-dishes named for sea otter, sea lion, whale, and sea
    monster.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The four house-dishes are said to have been given in marriage to Qlumxod's
    dead father by Chief Qwax'ila of the Koskimo.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speech assigns Sesaxalas a name, a marriage mat of one hundred and twenty
    blankets, ten boxes of crabapples, five boxes of oil, a house called Aurora-Face,
    and a dancer name.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Gwa'sEla are invited to warm themselves in Qlumxod's house, where the
    fire is burning; they enter the house and are given dried salmon to eat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Qlumxod tells Sesaxalas to stay overnight so that TslEndEgEmg'i^lak can get
    ready what she will take along.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the morning the Gwa'sEla load canoes with crabapple boxes, oil boxes, and
    the four house-dishes; TslEndEgEmg'i^lak boards her husband's canoe, and the party
    paddles home to Gwek'ilis.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the party arrives at Gwek'ilis, Llasotiwalis orders the house cleared
    for an immediate feast because he is proud of the four house-dishes obtained in
    marriage.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The numayms Gig'ilgam and SisEnLle are invited, and the crabapples, oil, and
    house-dishes are placed inside the door of the house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Llasotiwalis speaks about obtaining the crabapples and oil in connection with
    marrying TslEndEgEmg'i^lak and asks the invited numayms to sing feasting-songs.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Crabapples and oil are placed into the four house-dishes and into many small
    dishes; the passage says all were wet with oil.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Llasotiwalis distributes the sea-otter and sea-monster house-dishes to the
