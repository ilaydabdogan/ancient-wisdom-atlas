canonical_text:
  quote: ''
  summary: 'The passage first describes numaym ownership of rivers and fishing or
    trapping places, with violent conflict when outsiders fish or set traps there.
    It then narrates an inheritance case: LaleliLla''s former wife bears a son, Wawalk''ine/HayosdesElas,
    after leaving him for Awaxalag''ihs; later, after LaleliLla has no child with
    Jalaga, he invites tribes, distributes blankets, publicly identifies HayosdesElas
    as his son, and transfers property, privileges, names, a seat, house front, house
    dishes, and a feast name to him. HayosdesElas stores these privileges until a
    future feast, and LaleliLla receives property in a lesser seat after giving over
    his own seat.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The numayms of the tribes are described as owning rivers and prohibiting men
    of other numayms from using their river to catch salmon.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Disobedience of river-use restrictions can lead to fights in which one or
    both men may die.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Owners of salmon or olachen trap places fight when another man drives trap
    poles into the owner’s trapping place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The real owner of a fish-trap place is said generally to kill the thief by
    clubbing or spearing him from behind while the river noise prevents the thief
    from hearing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: LaleliLla is identified as next to the head chief of the numaym GexsEm and
    as the husband of Ts!alalili'lak, a princess of Gwex'sesElasEme.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ts!alalili'lak becomes pregnant, has Awaxalag'ihs as her lover, leaves LaleliLla,
    marries Awaxalag'ihs, and gives birth to a boy named Wawalk'ine by Awaxalag'ihs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: LaleliLla later marries Jalaga, a princess of Yuxi.En, and after about five
    years thinks she will not have a child.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: LaleliLla invites the tribes to Fort Rupert and gives seven thousand blankets
    to them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: LaleliLla tells the chiefs to call HayosdesElas the son of Ts!alalili'lak
    and to give property for his son in his place in the GexsEm numaym.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: LaleliLla gives HayosdesElas property, privileges, names, his house with a
    double-headed serpent front, several animal house dishes, and the feast name Kwax'se'stala.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage explains LaleliLla’s authority to transfer privileges by saying
    he was the eldest son of Xax'El layogwi'lak and therefore owned all of his father’s
    privileges.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: No one objects to LaleliLla’s transfer because HayosdesElas is said to be
    his only son.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: HayosdesElas puts away the house dishes, feast name, and other gifts until
