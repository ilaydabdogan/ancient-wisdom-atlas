canonical_text:
  quote: ''
  summary: At an assembly of chiefs and tribes, Awaxalag'ilis transfers chiefly position,
    names, house privileges, dance-associated red cedar bark, copper, and other valuables
    to his prince Llaqwag'ila. Llaqwag'ila later marries HiimEntsag'ilayugwa, receives
    marriage-debt privileges from K'!ade, separates hereditary family privileges from
    marriage-obtained privileges, performs the LEWElaxa dance cycle, and receives
    a status title.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Awaxalag'ilis addresses assembled chiefs of different tribes and says that
    the invitation came from his prince, Llaqwag'ila.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Awaxalag'ilis says his seat at the head of the eagles and tribes, his house,
    the red cedar bark associated with dances, his chief's position, a copper, and
    other valuables will go to Llaqwag'ila.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The listed valuables include a copper valued in blankets, canoes, button blankets,
    silver bracelets, gold-backed bracelets, earrings, sewing machines, phonographs,
    and masks.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Llaqwag'ila is to give goods to the tribes, and the tribes are to give property
    to Awaxalag'ilis in the last seat of the Maamtagila numaym.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Awaxalag'ilis gives his position, privileges, and names to Llaqwag'ila, whom
    he considers his own son; afterwards Awaxalag'ilis is described as a common man
    or speaker of Llaqwag'ila's house.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Llaqwag'ila marries HiimEntsag'ilayugwa, the princess of K'!ade, head chief
    of the LelEwag'ila numaym of the DzawadEenox.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Llaqwag'ila and HiimEntsag'ilayugwa have a son, and Llaqwag'ila gives the
    child the name Wawalk'ine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After four winters, K'!ade pays the marriage debt with the copper named "whale
    body," LEWElaxa masks, the Qlomogwa mask, the war dance, chieftain dance masks
    with women's faces, the DogwedEno mask, and names.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Llaqwag'ila changes to the marriage-obtained name ^mEmx'o 'maxwa and puts
    away the name Llaqwag'ila, his cannibal dance, and other names and privileges.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that family-origin names, houses, and privileges could
    not be given away to a younger brother or in marriage because they belonged to
    the beginning of the family history and to the power of chiefs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: After showing the LEWElaxa dance, ^mEmx'o 'maxwa puts away the privileges
    received from Awaxalag'ilis and LaleliL!a; other chiefs say these were put into
    another crest box.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage says family privileges and marriage-obtained privileges are not
    intermingled, and that the LEWElaxa dance is not allowed to enter the winter ceremonial
    house.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: "^mEmx'o 'maxwa dances the LEWElaxa dance four times over four nights, later
    puts it away, gives the marriage-debt property to the tribes, sings the LEWElaxa
    song for four nights in each of four winters, and is then called La^wElqo."
  category: sequence
  evidence_refs:
  - ev:6
