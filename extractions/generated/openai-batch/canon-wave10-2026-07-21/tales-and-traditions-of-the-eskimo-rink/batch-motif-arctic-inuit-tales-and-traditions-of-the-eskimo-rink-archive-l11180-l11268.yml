canonical_text:
  quote: ''
  summary: A solitary seal hunter repeatedly meets a northern neighbor at his usual
    hunting place. The neighbor becomes silent because his wife is ill, asks for a
    visit if he is absent, and later is found mourning after her death. When the visitor
    attempts to console him, the widower kills him; a widow's son kills the widower;
    and a general knife slaughter follows. Only the widow, her son, and an adopted
    daughter escape to a storehouse, where severe winter scarcity forces rationing
    of dried fish and blubber. The son later goes out to look from nearby heights.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The kayaker has one habitual hunting-place, goes there alone, is skilled,
    and usually brings home many seals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A group of people live north of the kayaker's habitation in a large house
    with three windows.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The kayaker finds his solitary hunting-place occupied by another hunter, whom
    he recognizes as one of his northern neighbors; the neighbor is talkative.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The kayaker tries to arrive earlier on following days, but the other man is
    already at the hunting-place; both men catch seals on one occasion.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The neighbor becomes silent until daybreak or sunrise, then says his wife
    is sick and worsening; he asks the kayaker to visit if he is absent the next day.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the kayaker visits the house, all the men are indoors, his former companion
    sits on the ledge staring ahead, and the man's wife has died and been buried.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The visitor says he has come to give solace and offers to speak with the widower
    during the unhappy time.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The widower utters unintelligible words, looks fierce and angry, seizes the
    visitor by the throat, throws him into the doorway, and then thrusts him against
    the doorposts, breaking his spine and causing death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A youth, the son of a widow, sharpens his knife, cuts the widower on both
    sides of the back, and the widower dies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the widower is killed, those present become infuriated, take knives,
    and a terrible slaughter follows; the widow, her son, and an adopted daughter
    alone remain unhurt and escape through the window to the storehouse.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A severe winter and keen frost force the widow's son to stop hunting; the
    remaining provisions are a few small dried fish and a small bag of blubber, which
    the widow rations so that the three survive badly but do not starve.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After three days of rationing, the young man disappears, but he has gone out
    to look around from neighboring heights.
  category: action
  evidence_refs:
  - ev:7
