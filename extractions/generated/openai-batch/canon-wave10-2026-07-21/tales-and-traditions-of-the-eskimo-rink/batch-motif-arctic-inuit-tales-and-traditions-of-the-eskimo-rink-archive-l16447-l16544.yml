candidate_motifs:
- id: motif:1
  label: shamanic flight after ritual preparation
  taxonomy_refs:
  - ascent
  - mystical_quest
  basis: The angakok binds himself for conjuration, is lifted up after the lamps are
    extinguished, and flies through the roof to the inland.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage summarizes the act rather than explaining its ritual meaning.
- id: motif:2
  label: journey to inland otherworld or hidden people with return-token
  taxonomy_refs:
  - departure
  - return
  - mystical_quest
  basis: The angakok repeatedly flies inland, encounters nonordinary households and
    inlanders, and receives reindeer-skin as a token to prove his visit to his missing
    sister.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The inland is literal in wording; interpreting it as an otherworld should
    remain cautious.
- id: motif:3
  label: spirit helper rescues endangered shaman
  taxonomy_refs:
  - mystical_quest
  basis: When the angakok is nearly killed by inlanders, he calls his tornak, which
    rescues him quickly.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not describe the tornak’s form or method of rescue.
- id: motif:4
  label: fertility quest and gendered edible charm
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: A childless husband journeys far and receives male and female dried fish
    from an old woman as means to obtain a son or daughter.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage presents the means as practical tale-magic; it does not call
    the fish sacred.
- id: motif:5
  label: male pregnancy after eating fertility substance
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: The husband eats one of the dried fish, becomes enlarged, and is delivered
    of a daughter by a charm.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The text includes an editorial note that the rest of the tale is of doubtful
    genuine Eskimo origin.
- id: motif:6
  label: dead son restored to life by angakok
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Kanginguak retrieves Tunerak’s buried body and brings it to an angakok who
    restores it to life.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not describe the resurrection procedure.
- id: motif:7
  label: quest for an amulet that empowers a boat
  taxonomy_refs:
  - mystical_quest
  - sacred_exchange
  basis: Kigdlinararsuk seeks a specialist old woman and receives a dried merganser
    amulet that makes his boat exceptionally swift.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The exchange terms are not described; the sacred_exchange taxonomy reference
