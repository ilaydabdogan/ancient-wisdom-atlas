  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: No broader taxonomy reference is supplied for this exact pattern.
- id: motif:9
  label: invisible supernatural kayak companion
  taxonomy_refs: []
  basis: The ingnersuak companion is associated with an extra kayak seen only from
    a distance, follows the hunter, and takes care of him.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: high
