canonical_text:
  quote: ''
  summary: 'The passage contains several short numbered Greenlandic Inuit tale summaries:
    an angakok flies inland through a roof-opening and encounters women, hostile inlanders,
    a tornak rescuer, and his long-missing sister; a childless couple obtains gendered
    dried fish as a means for children, but the husband eats one and gives birth to
    a daughter; Kanginguak’s son Tunerak is killed and restored to life by an angakok;
    Kigdlinararsuk obtains a dried merganser amulet to make a boat swift for revenge;
    and a Karusuic hunter is accompanied and protected by an ingnersuak spirit companion,
    with a note that many kayakers have such companions visible only at a distance.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A great angakok prepares for conjuration by using a seal-skin thong with one
    end fastened to his toe and the other to his head, twisted around his body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the lamps are extinguished, the angakok is lifted up, soars about the
    house, and escapes through an opening in the roof toward the inland.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In an inland house inhabited only by women, a house-pillar identified as their
    enchanted husband emits sparks of fire and lead when the angakok tries to approach
    them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On a later inland flight, inlanders seize the angakok and hurl him back and
    forth as if playing ball until he is nearly dead; his tornak rescues him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: On a third visit, the angakok finds his long-missing sister married to an
    inlander, and she gives him a piece of reindeer-skin as proof for people at home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A childless married man travels far north and south seeking a means for himself
    and his wife to have children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: An old woman gives the man two small dried fish, one male and one female,
    with instructions that his wife should eat one or the other depending on whether
    a son or daughter is desired.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: While hungry on the journey home, the man eats one of the dried fish, becomes
    ill and enlarged, and is later delivered of a daughter by a skilful old woman
    using a charm.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tunerak, son of Kanginguak, is described as an expert rower who can overtake
    falcons in flight and kill them with his paddle-oar; he is later killed by a rival.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Kanginguak retrieves Tunerak’s body from its burial place and carries it until
    he finds an angakok who restores the body to life.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kigdlinararsuk seeks help from old women in order to obtain an amulet that
    can give swiftness to a boat, so that he may avenge his sister’s murder.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: An old woman gives Kigdlinararsuk a small bit of dried merganser; he inserts
    it into the boat’s prow, after which the boat becomes swift enough to run down
    a flying merganser.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:13
  text: A man living on Karusuic travels daily to Kangek to hunt auks and has an ingnersuak
    as companion; this ingnersuak is also the tornak of an angakok at Tukak.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: 'The passage says many kayakers have ingnersuak companions: two kayaks may
    be seen at a distance, but only one is found nearby, because ingnersuit are invisible
    except from far away.'
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:15
  text: The particular ingnersuak waits for the Karusuic man, follows him, and takes
    care of him during the day.
  category: action
  evidence_refs:
  - ev:13
