  claim: The passage itself presents the ingnersuak companion as both a specific helper
    of one Karusuic hunter and a recurring pattern among many kayakers, marked by
    a second kayak visible only from far away.
  claim_level: same_motif
  target: ingnersuak companions of many kayakers within the same passage and local
    Greenlandic Inuit tradition
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal comparison supported by the passage’s own generalizing
    statement; it does not establish external diffusion, historical contact, or wider
    cross-cultural identity.
