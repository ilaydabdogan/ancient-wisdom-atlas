  text: Aterfio reports the killing at home and says he may flee south because Sukalassok's
    relatives might pursue him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: Aterfio's mother tells him not to fear his new enemies, and he remains in
    the old place.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Aterfio marries and has a son named Akeralik.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: An old man reports that Sukalassok's relatives are hostile toward Aterfio.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: Aterfio replies that he, his little son, and the household are ready to receive
    them whenever they choose.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:18
  text: Many strange boats appear off the coast; Aterfio removes his jacket, goes
