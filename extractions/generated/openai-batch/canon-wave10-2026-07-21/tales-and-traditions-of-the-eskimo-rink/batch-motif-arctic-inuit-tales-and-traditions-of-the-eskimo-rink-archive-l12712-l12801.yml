canonical_text:
  quote: ''
  summary: Two widows and their sons live near prosperous neighbors but suffer want.
    The sons Aterfio and Sukallassok grow into strong hunters who provide for orphan
    children. Sukallassok repeatedly attacks Aterfio while hunting; after twice sparing
    him and following his mother's advice to avoid revenge, Aterfio kills him after
    a third attack. Sukallassok's relatives later arrive by kayak to retaliate, but
    their harpoons break harmlessly against Aterfio. They challenge him on land; he
    overpowers and kills the attackers. Aterfio later trains his son Akeralik, who
    becomes even stronger and more fearless.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two widows, each with a son, live in winter quarters near each other and near
    prosperous neighbors who do not assist the poor orphans.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The widows advise their young sons to be wise and kind toward other children
    so that they will not lose the little help they receive.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Relatives eventually provide the orphan sons with kayaks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The southern son is named Aterfio, and the northern son is called Sukallassok.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Aterfio and Sukallassok become renowned for strength and vigor and hunt far
    from the coast, even in severe weather.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: On returning from hunts, they give orphan children abundant food and keep
    special stores of provisions for them in hard times.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: While Aterfio is hunting beyond skerries and islands, Sukalassok raises a
    harpoon against him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Aterfio capsizes his kayak toward Sukalassok so that the harpoon only touches
    the side of the kayak.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Aterfio thinks of revenge after the first harpoon attack but gives up the
    idea and goes home without mentioning it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: After a second similar attack, Aterfio reports that Sukalassok has twice attempted
    to kill him, and his mother tells him not to take revenge but to avoid Sukalassok's
    companionship.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Sukalassok later shoots an arrow that grazes Aterfio and falls into the water
    beside him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Aterfio responds to the arrow attack by throwing his harpoon at Sukalassok
    and killing him.
  category: action
  evidence_refs:
  - ev:5
