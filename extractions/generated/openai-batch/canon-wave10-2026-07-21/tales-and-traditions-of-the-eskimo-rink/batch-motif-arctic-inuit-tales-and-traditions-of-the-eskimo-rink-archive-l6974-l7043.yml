canonical_text:
  quote: ''
  summary: Two sisters live on a seal-rich coast, are taken as wives by two kayakers,
    bear daughters, and flee after the younger sister reports a death threat if she
    bears another daughter. They secretly prepare during the forming of the ice, escape
    during a dance night with their babies, are pursued by sledge tracks across the
    ice, abandon the babies after they freeze, and return to their former winter station
    and their brother Malaise.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The coast is dry and has many spotted seals and other seals; the girls kill
    as many as they need with big stones.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two kayakers hunting spotted seals see the girls, declare that the first ashore
    will marry the prettiest, race to shore, and touch one sister each.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The kayakers stop hunting, fetch a boat with crew, take the girls to their
    house, and the women live there happily for a time.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each sister has a daughter.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The younger sister says her husband threatened to kill her if she next bore
    him a daughter.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The elder sister advises the younger to hide her distress, pack clothes, and
    return to their old home once the ice forms.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sisters make new clothes and hide them in bags beneath the boat while
    the sea becomes covered with ice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When seal-hunting stops, the men visit a nearby large house for dancing, creating
    an opportunity for the sisters to escape.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: On a dance night, the sisters lull their children outside and avoid immediate
    suspicion; child-nurses follow them but are drawn back inside by singing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The sisters go to the boat, dress, place the babies in their amowts, and begin
    traveling first along shore and then out on the ice.
  category: action
  evidence_refs:
  - ev:5
  - ev:10
- id: obs:11
  text: At daybreak the sisters hide behind blocks of ice; sledges follow their tracks,
    and pursuers call out that their children are crying for them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The sisters remain hidden until evening, continue their journey, let the babies
    freeze to death, put them down on the snow, and leave them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The sisters reach land, recognize their former winter station, and find their
    own small house as they had left it.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: Malaise is astonished by his sisters' return and asks about Akilinek and the
    hunting there, but they tell him nothing.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: After the sisters return, Malaise becomes energetic in fishing and hunting
    and comes in wearing a kayak-jacket, saying it is a fine day to go kayaking.
  category: action
  evidence_refs:
  - ev:9
