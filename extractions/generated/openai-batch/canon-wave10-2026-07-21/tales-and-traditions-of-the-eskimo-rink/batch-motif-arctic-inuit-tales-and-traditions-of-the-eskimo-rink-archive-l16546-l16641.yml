  category: sequence
  evidence_refs:
  - ev:18
- id: obs:26
  text: The tale says Atungak and his wife travelled over the whole world without
    changing or getting old.
  category: attribute
  evidence_refs:
  - ev:18
- id: obs:27
  text: Caves and clefts in the northern rocks are said to be places where Atungak
    and his wife rested.
  category: setting
  evidence_refs:
  - ev:19
