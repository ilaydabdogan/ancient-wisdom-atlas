canonical_text:
  quote: ''
  summary: 'The passage contains several short traditions: Atarsuatsiak and his brothers
    are described as murderers with tattoo marks for each killing; two angakut obtain
    food through an opening made in the ground and erase a child''s memory with a
    small fish; Kuvatsiak learns by conjuring that his missing brother was seized
    by ingnersuit and later sees him unable to return from the under-world because
    of a black object on his kayak; Atungak and his wife travel through dangerous
    lands of cannibals, lame people, fighting bears, and a self-boiling pot, eventually
    recognizing Atungak''s son and being said to have crossed the whole world without
    aging.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Atarsuatsiak and his brothers are described as fearful manslayers living near
    Upernivik, Greenland.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The manslayers' heads are tattooed with separate marks for each murder, and
    Atarsuatsiak has a row of such marks across his forehead.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Neighboring people decide to have Atarsuatsiak killed at a place where he
    visits his concubine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kapiarsuk and Avangnanersuak go out together throughout winter, claiming to
    catch partridges, but bring none home and are not seen eating.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A child accompanies the pair and observes that they do not search for partridges.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kapiarsuk strikes a flat rock with his staff and murmurs words, causing an
    opening to appear in the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Through the ground opening, Kapiarsuk and Avangnanersuak angle and haul up
    different kinds of food, which the child also eats.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the way home, the pair give the child a small fish to swallow, after which
    the child loses memory of the event until adulthood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Usuinak goes kayaking and disappears without returning.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The missing brother's clothes are later seen moving by themselves.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Kuvatsiak conjures and learns that Usuinak has been seized by the ingnersuit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When Kuvatsiak grows old, he often meets his deceased brother at sea.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: A black object lies on the top of the brother's kayak and is said to prevent
    him from leaving the under-world people and returning to the living.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Kuvatsiak has a dream when the first missionary arrives, and the dream induces
    him to be baptized.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Atungak has two wives; one runs away, and he pursues and overtakes her in
    his sledge.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Atungak and his wife come to cannibals, whose chief offers them dishes containing
    human and animal flesh or brains; they refuse the first two dishes and eat dried
    reindeer flesh.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: The cannibal people kill children while pretending to pet them and suck out
    their brains.
  category: action
  evidence_refs:
  - ev:12
- id: obs:18
  text: A young lad named Ajajusek carries a sling intended to entangle strangers,
    but Atungak strikes him with a pyrites stone.
  category: action
  evidence_refs:
  - ev:13
- id: obs:19
  text: Ajajusek's mother later finds one of his booted legs under a bench and identifies
    it.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:20
  text: Atungak and his wife reach a country where all the people are lame; the chief
    warns them that his people are ill-natured.
  category: setting
  evidence_refs:
  - ev:15
- id: obs:21
  text: Atungak's wife laughs at the lame people's ball-playing and compares their
    hopping to ravens.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:22
  text: Atungak cuts the lashings of the lame people's sledges so that they cannot
    pursue him and his wife.
  category: action
  evidence_refs:
  - ev:16
- id: obs:23
  text: The travelers pass between two fighting black bears because no other way is
    available.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:24
  text: The travelers cross over a pot boiling by itself.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:25
  text: The travelers meet a man watching at a seal breathing-hole and recognize him
