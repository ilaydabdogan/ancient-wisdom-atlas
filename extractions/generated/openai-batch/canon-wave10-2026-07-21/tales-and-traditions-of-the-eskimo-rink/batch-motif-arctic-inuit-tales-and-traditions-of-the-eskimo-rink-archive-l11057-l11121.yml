canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which Iliarsorkik is pursued
    by a great ice-covered bear, makes a cave in an iceberg, kills the bear with an
    ice tool, and shares news of the meat; starving people die trying to reach or
    return from the bear. A new tale then begins: men disappear while kayaking up
    a fiord. Of two remaining brothers, the elder searches, is drawn ashore by two
    old people, has his kayak smashed by their sons, refuses berries containing part
    of a human hand, and survives a hook-and-crook contest because no one can conquer
    him.'
  language: English
  quote_policy: summarized
