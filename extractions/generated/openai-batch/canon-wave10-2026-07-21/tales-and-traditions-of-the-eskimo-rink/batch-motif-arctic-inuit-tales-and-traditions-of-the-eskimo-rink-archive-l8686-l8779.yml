  text: A young maiden breaks her elder sister’s precious reindeer-horn needle, and
    the elder sister tells her to leave and keep away from the coast-people.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The expelled girl wanders for many days and cries while sitting on a stone.
  category: action
