canonical_text:
  quote: ''
  summary: A young coast-woman is driven away after breaking her elder sister’s reindeer-horn
    needle. She meets a tall inlander who has also been expelled for damaging a brother’s
    snare; he gives her deer-skins and marries her. During visits among inlanders
    and inuarutligaks, the coast-woman is revealed as a stranger. Guests exchange
    gifts, feast, sing, and perform dangerous or marvelous dances involving transformations
    into animals, bodily alteration, the tilting of a house, travel by stone boat
    under a closed-eye prohibition, enlargement of a small house, and transformations
    into stones.
  language: English
  quote_policy: summarized
literal_observations:
