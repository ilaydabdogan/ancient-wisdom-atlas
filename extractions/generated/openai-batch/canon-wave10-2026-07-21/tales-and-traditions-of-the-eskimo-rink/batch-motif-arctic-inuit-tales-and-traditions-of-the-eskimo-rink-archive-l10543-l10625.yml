canonical_text:
  quote: ''
  summary: An editor's note introduces three obscure tales connected with angakok
    practice and identifies Akilinek as a fabulous country beyond the ocean. In the
    first tale, an experienced angakok repeatedly attempts spirit-flight across the
    sea but cannot pass a boundary before dawn. He trains his son in angakok knowledge,
    then takes him to a grave, where the son must put his hand into a corpse and endure
    a dangerous sunset trial. After this, the son practices flight, crosses the sea
    farther than his father, passes great perpendicular rocks, reaches an extensive
    country, and enters a small house where unusual residents are observed, including
    a squint-eyed person whose breath is like fire and a hairy-bodied woman.
  language: English
  quote_policy: summarized
