canonical_text:
  quote: ''
  summary: A widow and her foster-daughter are abandoned by their housemates, find
    shelter in a deserted hut, survive briefly on scraps, and face starvation. The
    widow has the girl dig and fill a hole with sea water, then performs repeated
    incantations that bring forth food animals, from a small fish to larger sea mammals,
    until provisions accumulate. The passage ends as the daughter notices what seems
    to be a kayak approaching.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The master leaps into the boat, shoves off, and tells the widow and child
    that they will not be taken along because they only eat the others' food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The housemates turn their backs, depart by boat, and leave the widow and child
    on shore with most of their belongings already in the boat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After crying, the widow tells the child they must do without the departing
    people and look for a house to live in.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The widow and child inspect deserted huts and choose a windowless hut where
    skins still hang on the walls.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The widow partitions off a room in the southern corner of the hut with skins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: They search the flensing-place and eat small bits of blubber and skin, later
    finding seal entrails to live on.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the entrails are nearly exhausted, the widow directs the more active
    child to dig a hole beneath the window-ledge and fill it with sea water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After their last food is eaten, the widow says she will try to procure something
    by magic and instructs the child to listen carefully to her repeated incantation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the incantation the child hears a splash and sees a little frog-fish
    moving in the water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The widow tells the child to kill the frog-fish with the old grindstone; the
    fish is then boiled, divided, and half set aside for the evening meal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: On successive days the widow repeats the incantation and obtains a nepisak-fish,
    an eider-duck, a firth-seal, a saddleback-seal, a small dolphin, a white whale,
    and finally a narwhal.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After flensing the captured animals, large quantities of provisions are heaped
    outside the house.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The widow and child go to the top of a south-sloping rock to cut flesh into
    thin slices for drying.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: While cutting flesh, the daughter says she almost thinks she sees a kayak
    coming in.
  category: speech
  evidence_refs:
  - ev:8
