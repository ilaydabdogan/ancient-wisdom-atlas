canonical_text:
  quote: '"walking on the water as if it had been solid ice"'
  summary: The passage recounts a husband's repeated return to a dangerous wife, her
    pursuit over water, her retreat at a streak of ripples, and her later death in
    a cave. It then shifts to an orphan boy and his dog in the abandoned house, where
    the dog warns him before a shrouded ghost appears and pursues them onto the ice;
    the boy hides in a cave in an iceberg until day.
  language: English
  quote_policy: quoted
