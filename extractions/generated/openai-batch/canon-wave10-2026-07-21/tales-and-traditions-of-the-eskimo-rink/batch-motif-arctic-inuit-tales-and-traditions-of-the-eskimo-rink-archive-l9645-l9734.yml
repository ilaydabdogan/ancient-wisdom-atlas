canonical_text:
  quote: he secretly planned to return to his own country
  summary: Nivnitak is first abused during a ball game but later wins a return match
    decisively. Remembering his poor relatives, he prepares tight clothing, escapes
    secretly at night, makes misleading circular tracks, constructs a stuffed-coat
    decoy in a snow-hut, and hides on a rock while pursuers spear the decoy and leave
    satisfied.
  language: English
  quote_policy: quoted
