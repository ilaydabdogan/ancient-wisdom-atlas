canonical_text:
  quote: ''
  summary: An old man in South Greenland learns from his cousin that his only son
    has been killed by the middle brother among a nearby group. He prepares weapons,
    ambushes and kills the murderer, then announces the deed to the brothers. When
    the brothers and relatives plan revenge, he first repels kayakers with bow and
    arrows placed at three landing points. In a later attack he uses a magic song
    to enlarge his face until it resembles the full moon, frightens the attackers
    away, and then sings a counteracting lay to restore his face. The supplied passage
    ends as he prepares large bladder-arrows after hearing of another seal hunt by
    his enemies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man lived near Agdluitsok in South Greenland with his only son, who
    was described as a dexterous and able sportsman and supplied their needs.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The son failed to return during the hooded-seal season, and the old man's
    cousin reported that the son had been killed by the middlemost of the brothers
    in a nearby tent settlement.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old man made heavy tools, including a harpoon and lance, from driftwood,
    obtained a new bladder, and resumed kayaking while seeking revenge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At sea he encountered the murderer towing a seal, approached while the murderer
    was blinded by sunlight, struck him dead, and fastened the body to an iceberg.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The old man paddled to the brothers and publicly declared that he had done
    away with their brother's life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The brothers mourned and retrieved the dead man; afterward the old man again
    stopped kayaking and hunting.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After being warned that the brothers were gathering relatives to attack him,
    the old man made many arrows and stayed at home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: When attacking kayakers crossed the bay, the old man divided arrows among
    three beach points and used his bow to prevent landings at each point, causing
    the attackers to withdraw.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Before a later and larger attack, the old man said he would use no weapons
    and would only show his face.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: At full tide, inside his tent just above the water-mark, he sang a magic song
    that enlarged his face until it resembled the full moon, then hid among skin curtains
    near the entrance.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Attackers who approached the tent entrance saw the enlarged face, cried out
    in fear, and rowed away; the old man then sang a counteracting lay to restore
    his face.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage ends after the old man hears that his enemies and others are chasing
    spotted seals and begins making two very large bladder-arrows.
  category: sequence
  evidence_refs:
  - ev:12
