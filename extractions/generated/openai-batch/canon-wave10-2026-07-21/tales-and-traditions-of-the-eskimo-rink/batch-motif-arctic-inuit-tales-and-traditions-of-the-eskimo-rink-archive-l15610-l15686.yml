canonical_text:
  quote: ''
  summary: A fragment recounts two visiting brothers arriving at Kangek, where local
    men mockingly direct them to land through dangerous surf. Each brother completes
    the hazardous landing, astonishing the mockers, who then invite them in. The elder
    brother says their absent younger brother is even more suited to such dangers,
    describing him crossing glacier surf for seals. The visitors are hosted, eat auks,
    go auk-catching, and return home. A new tale then begins with a lonely woman and
    her foster-daughter living at a great seal-hunter's house; when the others leave
    for fishing, the hunter remains behind with wicked intentions and tells them to
    pack for departure.
  language: English
  quote_policy: summarized
