canonical_text:
  quote: ''
  summary: A disarmed man, later identified as Angutisugsuk, is attacked, hamstrung,
    and killed by his invalid brother with a spear. The surviving brother laments
    killing a former provider, asks to be killed, then orders the man's second wife
    killed because she is blamed for beginning the trouble. Her possessions and clothes
    are to be placed with her and her burial closed with stones. Later the invalid
    brother recovers and feels remorse, while an old magician approves of Angutisugsuk
    having been killed by his brother.
  language: English
