canonical_text:
  quote: ''
  summary: After brothers kill an old woman while Ernersiak is away, a strong man
    warns and adopts him, gives him a backbone amulet, and trains him in strength.
    Ernersiak is struck by another boy, retaliates violently, and is then attacked
    by the wounded boy's father and others. Their lances break while Ernersiak remains
    unhurt, and he overpowers the crowd. His foster-father restrains him; the neighbours
    leave by boat, and Ernersiak later receives a kayak and learns paddling and hunting.
  language: English
  quote_policy: summarized
