canonical_text:
  quote: ''
  summary: Kagsagsuk is offered clothing and water, then kills the girl who fetched
    water, kills boys and other house inmates, and spares only poor people who had
    been kind to him. He uses their stores, trains with a kayak, travels along the
    coast, and is linked by the narrator and note to coastal marks, ruins, and variant
    names in Labrador and Greenland. The next tale begins with a widow, her son and
    daughter, a dispute over a thong-seal skin, the mother’s witchcraft against the
    skin, and the son’s blinding when a blister from the prepared skin strikes his
    eyes.
  language: English
  quote_policy: summarized
