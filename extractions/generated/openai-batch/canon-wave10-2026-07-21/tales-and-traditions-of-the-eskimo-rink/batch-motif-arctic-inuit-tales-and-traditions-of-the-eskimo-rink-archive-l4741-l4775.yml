canonical_text:
  quote: ''
  summary: A woman fleeing Igimarasugsuk hides during her journey, reaches berry-gathering
    people, identifies herself as his wife, and warns them that he eats his wives
    and has eaten his brother-in-law. The people receive Igimarasugsuk politely, feed
    him, offer a drum performance, and a singer publicly names him as a cruel wife-eater.
    When the song says the wife was forced to eat her brother’s arm, she reveals she
    hid her portion in the ashes. The people seize Igimarasugsuk, and the wife kills
    him with a lance while recalling his earlier lance-thrust into her stuffed jacket.
  language: English
  quote_policy: summarized
