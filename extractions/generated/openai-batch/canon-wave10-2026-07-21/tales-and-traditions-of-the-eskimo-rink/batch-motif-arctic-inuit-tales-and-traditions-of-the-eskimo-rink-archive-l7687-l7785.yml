canonical_text:
  quote: ''
  summary: In a severe winter, Angutisugsuk and his two brothers have enough food
    while neighbours are in need. Two old men are offended by Angutisugsuk’s wife
    and later bewitch the empty house to create discord. After the family returns,
    a dispute over a wooden plate and spoon and the mending of a fur jacket leads
    Angutisugsuk to strike his second wife; his brother intervenes and is injured.
    Angutisugsuk moves away with the second wife, repeatedly attempts to kill the
    injured brother, and pursues his nephew. The injured brother gathers neighbours
    to kill Angutisugsuk. A stranger uses a spell and a hand-position omen to confirm
    success. Angutisugsuk arrives armed with a flensing-knife, threatens his brother,
    and is seized.
  language: English
  quote_policy: summarized
