canonical_text:
  quote: ''
  summary: Isigarsigak and his younger brother travel north, winter with friendly
    people, join a seaward voyage to Akilinek after preparing boats with extra coverings,
    reach a reindeer-rich shore, encounter a singing match, and later separate when
    the younger brother marries there. Before leaving, Isigarsigak divides a healing
    amulet with his brother and watches him disappear from sight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Isigarsigak and his younger brother set out northward, stopped for winter
    because of frost, and reached their destination in the following summer among
    friendly people.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: People at the destination spoke of seeing the dark stripe at midsummer and
    intending to voyage seaward to Akilinek, described parenthetically as the country
    beyond the ocean.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man advised Isigarsigak to gather skins for a double coating for his boat.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The inhabitants repeatedly climbed a hill to survey the ocean and delayed
    departure until they judged the risk acceptable.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the boats went to sea, wet outer covers were cut loose and cast off after
    they slowed the boats.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Isigarsigak fell slightly astern, heard land-shouts ahead, heard the words
    about the broad dark stripe, and then saw a broad expanse of land.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The opposite shore was described as abounding with reindeer, and Isigarsigak
    and his brother killed the greatest number.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: After boats arrived from the north, Isigarsigak and his brother were called
    out for a singing match involving satirical songs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The younger brother danced first, and Isigarsigak then proposed that his wife
    advance because she was described as smart, clever, and unmatched.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The younger brother married in that place, and his brothers-in-law would not
    allow him to leave because they liked him very much.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Isigarsigak wished to return toward his own land because he wanted to die
    in his own country.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Isigarsigak returned from the start of the crossing, opened an old box, took
    out a coal-like healing amulet, broke it in two, and gave one piece to his brother.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: As the boat left again, Isigarsigak watched his brother standing on the beach
    in a white reindeer jacket until he disappeared from sight, and the narration
    says they would never meet again.
  category: sequence
  evidence_refs:
  - ev:7
