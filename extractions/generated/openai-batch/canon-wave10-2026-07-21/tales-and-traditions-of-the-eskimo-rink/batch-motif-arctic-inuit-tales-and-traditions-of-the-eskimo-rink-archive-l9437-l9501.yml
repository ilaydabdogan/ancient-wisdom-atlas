  summary: The passage introduces Nivnitak, an exceptionally capable hunter who lives
    far north with descendants. During a severe winter, younger hunters stop going
    out, while Nivnitak climbs mountains to survey the sea, locates open water and
    seal holes, repeatedly brings home seals, leads younger men to the hunting place,
