canonical_text:
  quote: ''
  summary: An angakok from near Kakortok travels north with his family to seek a pleasant
    country, consults another angakok, and settles at Ilulissat. His daughter Kakamak
    is secretly courted and reportedly secretly married, but her father removes her
    southward. At Alangok she secretly gives birth and kills the child. Later, near
    Nook, her father gives her to a kayaker husband who provides seals and tobacco.
    She later has a son who suddenly bleeds from the mouth and nostrils and dies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An angakok with a winter station north of Kakortok decides to seek a pleasant
    country and travels to Nook with his daughter Kakamak and a son.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Pisugfik the travelers meet Kajuernek, another angakok described as the
    only person who had been far to the north; he says Ilulissat is finer than the
    other northern country.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Southlander goes to Ilulissat, arrives when the ground is hard with frost,
    and the party builds a very small house because the turf is frozen.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A fine young man courts Kakamak without her parents' knowledge.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kakamak is described as proud and presumptuous, while her brother's wife is
    described as modest and timid; Kakamak often abuses the sister-in-law, and the
    parents do not interfere.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Another woman tells Kakamak's mother that Kakamak is secretly married to the
    young man; the mother tells the angakok in the evening.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The angakok prepares a boat, orders Kakamak into it, and resolves to return
    south.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The young man says Kakamak is his and that he wants her; her father replies
    that no man shall have his daughter and that he will fetch her back if anyone
    takes her by force.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the island Alangok, Kakamak secretly gives birth to a child and afterwards
    kills the child.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Near Nook, the angakok meets a little manly kayaker and proposes that he marry
    Kakamak; the kayaker mentions that women say he is dark-skinned.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The angakok presents the kayaker to Kakamak as a good provider and husband;
    Kakamak does not reject him, and he becomes her husband.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The husband brings home three seals, but when he sits beside Kakamak without
    offering tobacco, she pushes him so that he falls to the floor.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Kakamak is exceedingly fond of snuff, and her husband sometimes barters goods
