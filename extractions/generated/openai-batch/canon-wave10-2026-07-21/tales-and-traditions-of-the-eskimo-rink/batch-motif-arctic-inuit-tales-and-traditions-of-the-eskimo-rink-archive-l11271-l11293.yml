  quote: ''
  summary: A son returns with a large white whale. While the women cut it up, the
    daughter becomes cold because blood has filled her boots, sees the mountains double,
    and dies when entering the house. The son performs a spell, is revealed to be
    an angakok, calls spirits after the lamps are extinguished, and restores her to
    life. They remain there; he later marries his adopted sister, and they eventually
    die without further mishap.
