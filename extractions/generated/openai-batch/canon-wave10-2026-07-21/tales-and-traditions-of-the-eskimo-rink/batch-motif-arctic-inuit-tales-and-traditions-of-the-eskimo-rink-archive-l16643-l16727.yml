canonical_text:
  quote: ''
  summary: 'The passage gives an editorial note about similarities between imperfect
    Eskimo tale fragments, followed by short tale summaries: Malarsuak searches for
    a lost sister among cannibals and later escapes after his child is stolen; an
    overlarge strong man named Sikuliarsiujuitsok is killed after being trapped in
    a snowhut; Aklaujak''s brothers steal his wife, who is returned through his mother''s
    intervention; a son using angakok science avenges his father by killing a giant
    champion at Kangersuak; brothers attempting to kidnap a girl are destroyed by
    the girl''s mother''s magic lay and later identified as dolphins; three visitors
    to a grieving old man''s house leave in animal forms; and Avigiatsiak is taken
    by a whale, becomes a seal, is killed, and is born anew from the hunter''s wife.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The editorial note says two imperfect fragments from widely separated Eskimo
    countries contain curious similarities.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Malarsuak starts out by sledge in search of his lost sister and finds her
    living in a cannibal household.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Malarsuak kills a hideous-looking youth with a bear tooth fastened into a
    stick, and the body is put under a bench.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Malarsuak later returns with his wife and child; the cannibals rob them of
    the child, and Malarsuak escapes after cutting sledge lashings, except for one
    pursuing sledge whose driver he kills.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sikuliarsiujuitsok is described as very large and strong enough to catch a
    whale from his kayak, but he is killed after being persuaded to sleep in a snowhut
    with his feet tied together.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sikuliarsiujuitsok has sisters and powerful nephews who keep a stone-fenced
    enclosure used to entice people they intend to kill.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Aklaujak is immensely strong; while he is away hunting reindeer, his brothers
    rob him of his wife, but his mother persuades the wife to return after seeing
    Aklaujak drown two large reindeer from his kayak.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Kangersuak tale, a son practices angakok science and revenges his killed
    father by leading the giant champion onto a marshy plain, piercing the giant's
    feet from beneath, and killing him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A band of brothers tries to carry off a girl by force, but her mother uses
    a magic lay that causes them to perish in a sudden gale.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: An angakok later sees dolphins and, by listening to their speech, identifies
    them as the transformed brothers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: An old man mourning his dead son remains near the son's grave and receives
    three male visitors who later depart in the forms of a reindeer, a fox, and a
    hare.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The visiting animal-men ask for sole-leather and walrus-tooth before leaving,
    and the hare is said to need material for a new tooth.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Avigiatsiak is taken by a whale while grinding her knife, lives with whales,
    flees and becomes a seal, is killed and cut apart except for her head, and is
    later born anew from the hunter's wife.
  category: sequence
  evidence_refs:
  - ev:8
