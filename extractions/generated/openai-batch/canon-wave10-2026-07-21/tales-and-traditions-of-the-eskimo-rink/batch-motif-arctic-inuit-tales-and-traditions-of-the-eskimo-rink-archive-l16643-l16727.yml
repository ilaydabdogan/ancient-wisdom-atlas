candidate_motifs:
- id: motif:1
  label: Search for lost sister among cannibals
  taxonomy_refs:
  - sibling_pair
  basis: Malarsuak's action is framed as a brother's search for his lost sister, whom
    he finds in a cannibal household.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The fragment is summarized and does not explain how the sister was lost
    or why she is in the household.
- id: motif:2
  label: Abducted or stolen family member
  taxonomy_refs:
  - stolen_beloved
  basis: 'The passage includes multiple kin-abduction or robbery episodes: Malarsuak''s
    child is stolen, Aklaujak''s wife is stolen by brothers, kidnappers try to seize
    a girl, and Avigiatsiak is taken by a whale.'
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  - ev:8
  confidence: medium
  cautions: The taxonomy label is approximate because the abducted figures include
    a child, wife, girl, and young woman, and the circumstances differ.
- id: motif:3
  label: Powerful overlarge man killed by stratagem
  taxonomy_refs: []
  basis: Sikuliarsiujuitsok is feared and immensely large, yet is killed after being
    persuaded to sleep in a cramped snowhut with his feet tied.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage does not state whether Sikuliarsiujuitsok is a giant in the
    same sense as the Kangersuak champion.
- id: motif:4
  label: Giant champion slain by magical or shamanic stratagem
  taxonomy_refs:
  - wisdom
  basis: The avenging son practices angakok science and defeats the giant by leading
    him onto a marshy plain, attacking from beneath, and killing him.
  evidence_refs:
