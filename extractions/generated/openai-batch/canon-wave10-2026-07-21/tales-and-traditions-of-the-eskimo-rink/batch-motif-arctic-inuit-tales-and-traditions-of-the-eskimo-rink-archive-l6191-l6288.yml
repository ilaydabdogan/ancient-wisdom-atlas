canonical_text:
  quote: ''
  summary: A childless man seeks help from an old magician to obtain a child. After
    offerings and prescribed objects, his wife bears Kujavarsuk, who becomes an exceptional
    seal hunter and provider. When the sea freezes and game is withheld, a young angakok
    practitioner descends into the ocean, confronts and conciliates the old woman
    who detains sea animals, and returns after three days.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An editorial note says the tale was popular and collated from three copies
    agreeing in essential particulars.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man has a wife who has borne him no children, and he envies people who have
    children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The husband sends his wife, dressed in her best, to the fishing-place of an
    old man who has given up seal-hunting and is described as a great magician.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband promises the old man half of his catch if he can devise a way
    for them to get children, and afterwards sets aside half of his seals for him.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: After the wife becomes pregnant, the old man predicts she will bear a son
    and tells the husband to obtain a bird for an amulet, a black hollow stone never
    touched by sunlight, and the collar-bone from the grandmother’s grave.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wife bears a son named Kujavarsuk by the old man; the stone is placed
    near the child’s feet and the bird above the window.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The old man tells the father to prepare a fully fitted kayak for the boy and
    predicts that the boy will capture ten seals on his first outing and on future
    outings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The boy is launched in the kayak, harpoons a seal, and begins hunting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When grown, Kujavarsuk takes two wives and becomes useful to his housefellows
    and neighbours, especially as a provider in need.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: During one winter the sea freezes early; Kujavarsuk continues to get ten seals
    daily from a shrinking opening until the sea closes completely with ice.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The people consider calling an angakok, and someone reports that widow Igdlutsialik’s
    daughter had been seen practising angakok art in a lake.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Kujavarsuk offers the young woman a large seal-skin to break the ice; after
    refusing several offers, she accepts beads and asks for her summer dress.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After putting on the summer dress, the young woman walks to the water-side,
    disappears among the ice-blocks, and remains in the ocean depths for three days.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: At the sea bottom she struggles with the old woman identified parenthetically
    as the arnarkuagssax of Eskimo mythology, who detains the sea animals under her
    lamp.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: After conciliating the old woman, the young woman returns to earth, reappears
    among the ice-blocks on the third evening, and tells the people she wants every
    other seal.
  category: sequence
  evidence_refs:
  - ev:8
