canonical_text:
  quote: ''
  summary: A one-eyed man leads his companion inland, makes him shout toward the interior,
    and kills the bears and armed enemies that appear. The companion hides behind
    the one-eyed protector during an arrow attack, and the two later pursue and kill
    the enemies. The inlander trades for the companion's unfamiliar weapon and repays
    him with prized sea-hare skins, which a little woman carries swiftly to his house.
    An editorial note connects the tale with Greenlandic variants and with a belief
    that overhunted seals avenge themselves as armed people in a solid-ice boat.
  language: English
  quote_policy: summarized
