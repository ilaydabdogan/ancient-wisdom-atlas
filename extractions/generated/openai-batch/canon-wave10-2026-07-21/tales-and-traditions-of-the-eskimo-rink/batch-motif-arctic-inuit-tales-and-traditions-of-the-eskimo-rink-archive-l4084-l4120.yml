canonical_text:
  quote: ''
  summary: 'The passage discusses difficulties in collecting Inuit traditions: leading
    questions may distort answers; collectors should instead ask people to recount
    stories told in their own assemblies; some narrators feared accusations of superstition;
    some European investigators wrongly inferred that few traditions existed; manuscripts
    were sometimes incomplete or illegible; and principal tales were collated from
    multiple versions to approximate common oral tellings.'
  language: English
  quote_policy: summarized
