canonical_text:
  quote: ''
  summary: A clairvoyant fool detects Kumagdlat's passing boat, though others see
    only a spotted seal, and Asalok's company connects this to Kumagdlat's amulet.
    Kumagdlat travels with rowing girls to a settlement, hears from an old boatbuilder
    about rich and dangerous inland erkileks who possess knives, makes weapons, and
    sets out alone. Asalok and Merak separately find the erkileks' camp, nearly shoot
    a burdened tall man before recognizing him as Kumagdlat, reunite with him, and
    choose an island across a lake as refuge.
  language: English
  quote_policy: summarized
