  text: Kumagdlat travels night and day by boat with rowing girls, resting briefly
    without going ashore, until reaching a well-peopled place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the well-peopled place Kumagdlat meets a very old man making a boat, with
    white hair, and a bearded young man standing beside him.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The old man says he began the boat before the young man was born and has only
    just finished the hull; shells are described as his only tools, and the place
