  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kumagdlat says he wants to search for the erkileks; after being warned about
    their deadly swiftness and agility, he makes a small bow, arrows, and a seal-skin
    quiver and departs alone.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The brothers Asalok and Merak wander, find an extensive plain where the erkileks
    live in many tents, and hide while waiting for night and the hunters' return.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Asalok and Merak see a tall burdened man at sunset and are about to shoot
    him, then recognize him as Kumagdlat and reunite with him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After dark the cousins seek a secure place, choose a small island opposite
