canonical_text:
  quote: ''
  summary: An old woman’s daughter leaves home and later returns carrying a reptile-like
    child in her hood, saying her husband is not human and lives far away in a large
    valley. Her two brothers find her dwelling, kill the reptile child, then ambush
    and kill her huge reptile husband and bring her home. Afterward she again changes,
    carries a small growing worm or reptile, disappears a second time, and the family’s
    renewed search ends in loss and failure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman lives with two sons and a daughter; the sons are good hunters
    and love their sister.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The daughter’s behavior changes, she goes out alone and remains away, and
    her brothers search widely before giving up.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: While the mother is alone in the house, the long-lost daughter appears wearing
    an amowt or hood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A cry is heard from the hood; the daughter says what she carries is not a
    human being and tells her mother to hide under the skin coverlet.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mother sees the daughter produce a large reptile, let it bite her lips
