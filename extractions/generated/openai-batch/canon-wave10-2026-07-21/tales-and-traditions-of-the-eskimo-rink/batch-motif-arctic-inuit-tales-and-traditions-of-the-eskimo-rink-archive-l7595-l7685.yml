  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The brothers enter, kill the reptile offspring, tear it to pieces, and throw
    it outside.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A huge reptile husband approaches carrying a large reindeer in its mouth,
    enters the house, and coils closely around the sister.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The brothers make noise to draw the reptile husband out, shoot it with arrows
    from both sides, and finish killing it with spears.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The brothers bring their sister home with her belongings and dried reindeer,
    and the family warns her to stop her former habits.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The sister’s behavior changes again; she carries a small black-streaked worm
