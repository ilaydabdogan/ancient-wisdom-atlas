canonical_text:
  quote: ''
  summary: A hunter kills his companion during a kayak encounter, then begins to sink
    and calls on his guardian spirits among the under-world people. Three kayakers
    rescue him, repair his kayak, and bring him to a high island house ruled by a
    very old man. Other related hosts arrive, including the killed companion, who
    has been restored to life. After a wrestling contest and rebuke, the quarrelling
    men are told to be friends. The rescued man stays five days, leaves on the sixth,
    meets his restored companion at the hunting-place, and they are reconciled.
  language: English
  quote_policy: summarized
