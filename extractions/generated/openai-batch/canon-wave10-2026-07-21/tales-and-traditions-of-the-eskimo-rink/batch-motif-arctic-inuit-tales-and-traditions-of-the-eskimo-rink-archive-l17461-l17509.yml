canonical_text:
  quote: ''
  summary: The passage gives three short traditions. In the first, a woman mated with
    a dog has ten children, orders them to devour her father, divides them, and sends
    them away; five become erkileks inland, while five depart by sea in a ship formed
    from an old boot sole and become Europeans. An editorial note says this origin
    idea has analogies elsewhere and compares it with a Japanese popular tradition
    about the Ainos of the Kurile Islands. In the second, Katigagse disbelieves angakut
    and disrupts conjurations until he sees a fiery tornak, is terrified, and never
    again attends an angakok service. In the third, Ordlavarsuk first despises angakut,
    then tries to become an angakok; a giant-like tornak appears, but he flees through
    shallow water to an island where the demon cannot follow, and he never succeeds
    in calling a tornak again.
  language: English
  quote_policy: summarized
