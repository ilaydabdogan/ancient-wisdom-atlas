  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the conjuration was finished and the fire was kept off, Katigagse was
    found under the ledge covered with filth, left the house, and never attended an
    angakok service again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Ordlavarsuk despised the angakut and did not attend their conjurations, but
    after hearing women’s song during an angakok performance he wanted to become an
    angakok himself.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ordlavarsuk went to lonely places and called for a tornak; a giant-like man
