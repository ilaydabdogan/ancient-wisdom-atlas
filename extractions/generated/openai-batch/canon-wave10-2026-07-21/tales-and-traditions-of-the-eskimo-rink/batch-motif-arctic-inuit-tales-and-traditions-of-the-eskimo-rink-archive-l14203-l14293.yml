canonical_text:
  quote: ''
  summary: The excerpt closes one tale in which an angakok and his son use an oversized
    kayak under a prohibition against looking inside it; an unbeliever looks, after
    which the son becomes lame and the onlooker is found dead. The angakok then witnesses
    a big man blow a hidden pipe toward the four quarters of the horizon, and the
    angakok survives storms before returning home. The excerpt then begins the tale
    of Kigutikak and his brother, who are warned about hostile whalers, seized with
    their kayaks, carried away by ship, and brought ashore among crowds in the whalers'
    country.
  language: English
