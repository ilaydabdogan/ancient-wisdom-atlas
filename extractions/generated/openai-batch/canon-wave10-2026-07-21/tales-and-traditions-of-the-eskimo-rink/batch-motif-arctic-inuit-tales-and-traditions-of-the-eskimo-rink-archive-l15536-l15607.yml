canonical_text:
  quote: ''
  summary: An unnamed man is overtaken by calving icebergs, driven under water, and
    loses consciousness. On reviving beneath the waves, he is aided by companions
    later identified as his grandparents, who protect him and warn him not to drink
    from a fountain intended for those perishing at sea. He reaches a large house
    inhabited by dogs in human shape, collapses, revives as a sick man dies, is cared
    for for five days, recovers his intact kayak and goods, returns home, and is thereafter
    wiser and unaffected by witchcraft. The passage then begins a new tale about three
    brothers from the head of a firth who plan to visit Kangek for auks, though the
    youngest withdraws.
  language: English
  quote_policy: summarized
