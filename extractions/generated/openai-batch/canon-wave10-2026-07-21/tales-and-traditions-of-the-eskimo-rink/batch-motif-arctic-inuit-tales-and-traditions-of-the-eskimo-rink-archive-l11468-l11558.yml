literal_observations:
- id: obs:1
  text: Kasiagsak travels by kayak to a neighboring station and enters a house where
    people are mourning a little daughter named Nepisanguak.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kasiagsak claims that he has a little daughter at home with the same name,
    Nepisanguak.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mourners thank him, weep, and later give him food and gifts, including
    beads, a plate, seal-paws, and a pot connected with a kayak exchange.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Kasiagsak pretends to weep while peeping through his fingers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: At home Kasiagsak falsely says that the goods came from a boat accident and
    were found on the ice.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kasiagsak’s wife destroys her old pot, discards shoulder-blades used as plates,
    and decorates her coat with beads.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kayakers arrive, learn that Kasiagsak has no daughter and no new kayak, and
    take back their gifts, including cutting beaded flaps from the wife’s jacket.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Kasiagsak finds a small bit of whale-skin on the water and claims that he
    has found a whale carcass.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: After following him a long way without finding a whale, the others kill Kasiagsak.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A husband and wife with an only son live with an old childless couple; the
    younger couple loses the son at a fishing-place and leaves before five mourning
    days are over.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Because they do not know how to get food without help, the old couple goes
    to the tomb.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The old woman removes the top-stone, the old man opens the grave, and they
    take out the corpse and chant over it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The corpse begins to move, rises, runs against the old man, and the old man,
    old woman, and youth fall down.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:14
  text: The old man invites the revived youth to stay with them; the youth goes home
    with them, gets a kayak, and becomes their provider.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The youth’s real father later returns, expecting the old people to have starved,
    and observes blood on beach stones and seal-flensing marks.
  category: action
  evidence_refs:
  - ev:8
