canonical_text:
  quote: ''
  summary: An aged male relative visits an abandoned woman, expecting to find her
    dead, but finds her and another woman processing abundant flesh. They feed him
    and load his kayak with provisions. Afterward the woman again chants and invokes
    her art, while the daughter watches, but no response is heard. The passage explains
    that the unseen responders have taken offense because she gave the gifts to other
    people, and her spell no longer works. After the flesh is dried, the old relative
    takes her to his homestead, where she remains.
  language: English
  quote_policy: summarized
