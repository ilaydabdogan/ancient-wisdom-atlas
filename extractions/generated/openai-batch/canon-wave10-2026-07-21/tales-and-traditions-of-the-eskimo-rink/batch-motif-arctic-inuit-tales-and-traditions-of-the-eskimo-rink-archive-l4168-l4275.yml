canonical_text:
  quote: ''
  summary: The passage opens the tale of Kagsagsuk. An editor's note says the tale
    was constructed from several Greenland and Labrador copies and presents a moral
    theme of protection for the helpless and vengeance on cruelty. Kagsagsuk is a
    poor orphan boy excluded from the main room, forced to sleep near dogs, and abused
    by adults and children. His foster-mother gives him equipment and has taught him
    how to seek strength. He goes alone between high mountains and calls on the Lord
    of Strength. A large amarok-shaped animal appears, throws him down with its tail,
    and causes small seal-bones to fall from his body, explaining that these had stopped
    his growth. Through repeated encounters, Kagsagsuk becomes strong; the amarok
    tells him to keep his old habits until winter, when three great bears will appear
    and be killed by him. The passage then begins a driftwood episode in which Kagsagsuk
    secretly lifts and carries a heavy timber that others had left on the beach.
  language: English
  quote_policy: summarized
