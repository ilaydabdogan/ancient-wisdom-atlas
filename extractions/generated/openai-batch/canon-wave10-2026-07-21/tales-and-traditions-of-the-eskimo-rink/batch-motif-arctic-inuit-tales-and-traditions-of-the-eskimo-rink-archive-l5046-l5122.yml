canonical_text:
  quote: ''
  summary: The passage gives an editorial note on the tale of Akigsiak and then narrates
    how Akigsiak, son of a coastal woman carried off by an inland man, becomes a strong
    hunter. During famine, after ignoring his father’s signal to return, he is lost
    in a storm and encounters a dangerous northern reptile. He flees, strikes it with
    a lance, collapses, awakens to find it motionless at his feet, and returns home
    after four days. His community later finds the reptile’s fatty body and uses it
    for winter food, though many die while trying to reach it.
  language: English
  quote_policy: summarized
