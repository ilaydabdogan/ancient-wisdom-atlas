canonical_text:
  quote: ''
  summary: 'The passage summarizes Greenlandic Inuit religious concepts: inua as supernatural
    owners or rulers of places, objects, and qualities; a layered cosmos with earth,
    sea, underworld, upper world, solid sky, and a far northern mountain; contrasting
    afterlife destinations; aurora explained by upper-world dead playing ball with
    a walrus head; absence of a direct doctrine of a supreme ruler; and doubtful reports
    about human origins, Kallak, a woman made from sod, and a Deluge tradition.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A deceased person is said to be able to pass into another man and cause a
    likeness to the deceased person.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The visible world is described as ruled by supernatural powers or owners called
    inua, each ruling within certain limits.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Almost any physical or spiritual object, combination of objects, or separate
    idea may be conceived as having an inua.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The notion of inua is said to be commonly limited to localities or to human
    qualities and passions, with mountains, lakes, strength, and eating given as examples.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: An owner or ruler conveys the idea of a person or soul, though not necessarily
    of a body; the dead soul is said to have been considered the inua of the bodily
    remains.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The earth and the sea supported by it rest on pillars and cover an underworld
    accessible through entrances from the sea and from mountain clefts.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: An upper world is located above the earth, and the blue sky is described as
    solid, vaulted like an outer shell, and, according to some, revolving around a
    high mountain-top in the far north.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The upper world is described as a real land with mountains, valleys, and lakes.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: After death, human souls go either to the upper world or to the underworld.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The underworld is preferred because it is warm and rich in food, and it contains
    the dwellings of the happy dead called arsissut.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Those who go to the upper world suffer from cold and famine and are called
    arssartut or ball-players; their ball-play with a walrus head gives rise to the
    aurora borealis.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The upper world is treated as a continuation of the earth upward; visitors
    or temporarily disembodied souls mostly pass through the air, while the road upward
    from the mountain foot is too distant or steep.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: One tale mentions a man in a kayak going to the border of the ocean where
    the sky comes down to meet it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage says Greenlandic mythology contains no direct doctrine organizing
    the invisible rulers under one supreme head.
  category: other
  evidence_refs:
  - ev:6
- id: obs:15
  text: The passage says there are scanty traces of explanations of world origins
    or qualities, and it treats reported claims about first humans, Kallak, a woman
    made from sod, and a Deluge tradition as doubtful.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
