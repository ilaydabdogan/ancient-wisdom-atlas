canonical_text:
  quote: ''
  summary: Kaisape prepares a hollow driftwood boat covered with white seal skins
    so it resembles an iceberg. After selecting a helper and testing the craft, he
    and his companions use it to approach Kakortok under cover of broken ice. The
    occupants mistake it for ice. Kaisape's party surrounds a house with juniper fuel
    and burns it in revenge. Ungortok escapes with his small son; during the pursuit
    the father throws the child into a lake so that the child will die unwounded,
    and Ungortok reaches Igaliko.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The principal actor searches in different places for a pair of brothers, examines
    the inside fur of their boots for lice, and finds a younger brother who is entirely
    without lice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger brother without lice is persuaded to assist and returns with the
    principal actor to Kangermiutsiak.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The principal actor catches seals and has the hair removed from the skins
    so that they can be used as white skins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A large piece of driftwood is hollowed with a knife into a tube-like form,
    fitted with a tight cover at one end, and given side holes with wooden stoppers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: White skins are placed inside the hollow wood, the openings are closed, and
    kayakers tow it down the inlet to Pingiviarnek.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The skins are attached with strings and spread like sails, making the boat
    look like a somewhat dirty iceberg; people on shore are astonished by the likeness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kaisape orders the skins to be spread, views the craft from shore, reloads
    it, dries the skins in the sun, and says he has not forgotten his brother.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The party waits at Arpatsivik for favorable wind before going to Kakortok
    for revenge; the inlet fills with broken ice of varied forms and sizes.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kaisape and his helpers hide in the hollow wood, watch through peep-holes,
    and drift toward the house while other crews gather juniper fagots north of Kakortok.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Kavdlunait come out after hearing that Greenlanders are coming, but the
    master reassures them that it is only ice, and they go back inside.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Kaisape's party lands, surrounds the house with juniper fagots, fills the
    doorway with fuel, and sets fire to it, burning the people inside and those trying
    to escape through the passage.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Kaisape is chiefly concerned with Ungortok, and a helper tells him that the
    man he seeks is above them.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Ungortok, described as the chief, leaves the burning house through a window
    and flees with his little son in his arms while Kaisape pursues him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: At a lake, the father throws his child into the water so that the child may
    die unwounded; Kaisape cannot overtake Ungortok and returns to his crew.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Ungortok reaches Igaliko and establishes himself with another chief.
  category: sequence
  evidence_refs:
  - ev:10
