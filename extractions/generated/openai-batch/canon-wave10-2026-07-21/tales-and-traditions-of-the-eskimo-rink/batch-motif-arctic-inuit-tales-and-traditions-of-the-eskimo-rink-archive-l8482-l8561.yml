canonical_text:
  quote: ''
  summary: Two visiting brothers undergo strength contests among local people. The
    elder defeats a giant-framed champion, after which the crowd declares the visitors
    to be their masters. The brothers then stay at the new settlement and observe
    an unfamiliar seal-hunting method using walrus teeth as windlasses at openings
    in the sea ice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A strength game involving pulling an opponent's arm ends with the visitor
    gaining the advantage; the opponent's arms are injured in the attempt to pull
    back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The host says the visitors are strong friends and warns them about another
    very strong man among the local people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The next morning the visitors are summoned outside to fight, follow people
    up to a plain, and see a crowd encircling a giant-framed man.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elder brother tells the younger brother not to fight first and then rushes
    at the champion.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The fight lasts from sunrise to sunset; the elder visitor lifts the champion,
    avoids throwing him against a pole, and hurls him into the spectators, where he
    falls with blood coming from his mouth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the champion falls, some people rejoice and others weep; many gather
    around the elder visitor to touch him, some offer him a windlass, and the crowd
    declares the visitors their masters.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The brothers remain for a time at the new station, kayak, and are always together.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: When frost sets in and sea ice forms, the local men prepare hunting and fishing
    implements, while the brothers do not join because this hunting method is unfamiliar
    to them.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: At openings in the ice, walrus teeth are fixed down and used as windlasses
    for winding harpoon strings after small seals are harpooned.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the seal slaughter, the hunting leader tells the others to go as they
    like and then travels home very quickly, while the others arrive late.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: On the following day the visitors each catch a large seal, and the chief says
    they will not get home with them by the next morning.
  category: sequence
  evidence_refs:
  - ev:8
