canonical_text:
  quote: ''
  summary: Several brothers live near a widow and her beautiful daughter. The youngest
    brother becomes the daughter’s lover and is murdered by the angakok Inugtujusok,
    who hides in a snow cave and forces the girl to assist in the pursuit. The brothers
    learn what happened, grieve, and plan revenge but delay because of Inugtujusok’s
    power. Inugtujusok flees north, raises a highly skilled son, and later returns
    south. The brothers prepare to confront him, including making a strong whalebone
    girdle. When a little daughter of one brother becomes ill, they plan to summon
    Inugtujusok to treat her and then kill him.
  language: English
  quote_policy: summarized
