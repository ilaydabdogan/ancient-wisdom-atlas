canonical_text:
  quote: ''
  summary: A woman enters a hill dwelling, becomes the man's wife, and bears a son
    named Imitlungnarsunguak. When she returns with the child to her former people,
    the husband claims the son's first catch. The grown son receives hunting tools
    after his mother calls for them, catches a seal, and the seal vanishes at the
    threshold, with the father said to have taken it. On a later hunt the son disappears.
    His mother follows his flying garments beneath lifted coast-ice to an underground
    house of the ingnersuit, where she frees her bound son and brings him away. Her
    name is Nagguanguak.
  language: English
  quote_policy: summarized
