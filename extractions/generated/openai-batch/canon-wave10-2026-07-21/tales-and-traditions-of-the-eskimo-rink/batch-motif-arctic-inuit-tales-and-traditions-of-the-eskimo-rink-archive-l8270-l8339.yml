  evidence_refs:
  - ev:4
- id: obs:7
  text: Namak and his son took winter-quarters at that place; Namak initially advised
    his son to watch the people closely, but later they became less suspicious.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: On a winter morning with a south-west gale, kayakers stayed home and a message
    announced that everyone wanted to see Namak; Namak and his son went to visit the
    enemies for the first time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Only meat for two was set out; the son ate little, while Namak continued until
    the dish was nearly empty, and the visitors did not speak.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: One of the other party proposed sports and a strength test at the pulling-thong;
    a string fitted with walrus teeth was placed on a skin for champions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Namak called the pulling-thong test child’s-play, tore the thong apart with
    one hand, and threw it down.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Another opponent proposed an arm-hooking strength contest; challengers tried
    one after another, but none could move Namak’s arm.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the challengers departed, the son went home, but Namak remained and
    later put on his outer coat slowly, expecting an attack.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:14
  text: In spring, when leaving southward, Namak let his house-fellows enter the boat
    first and stayed back expecting an attack; when no attack came, he left.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The note says a native writer added that Namak’s foster-father’s continual
