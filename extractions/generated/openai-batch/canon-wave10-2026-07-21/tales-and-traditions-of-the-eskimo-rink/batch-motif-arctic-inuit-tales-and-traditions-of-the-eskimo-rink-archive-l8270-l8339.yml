canonical_text:
  quote: ''
  summary: Namak teaches his son kayak-paddling, and the son becomes an excellent
    kayaker with a boat and tent. After reports that Namak’s enemies are numerous
    and strong, Namak and his son travel north by boat to find them, winter at their
    settlement, and remain wary. The enemies summon Namak and his son, set out food,
    and propose strength contests. Namak tears apart a walrus-tooth pulling-thong
    and cannot be moved in an arm-hooking contest. He later leaves the place cautiously,
    expecting an attack that does not come. A note reports a native writer’s explanation
    that continual provocation by a foster-father and pre-Christian bad consciences
    were thought to cultivate great strength.
  language: English
  quote_policy: summarized
