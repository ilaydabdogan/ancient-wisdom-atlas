canonical_text:
  quote: ''
  summary: The passage recounts an old man, his daughter, and her concealed atliarusek
    husband. After the father accepts the husband, the son-in-law brings seal catches
    and later guides or joins the family in a voyage involving boats that pass beneath
    the sea. The son-in-law’s hunting brings prosperity. The old man then aids former
    suitors who had abused him and, while feeding them, reminds them of their earlier
    scorn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old man sets off without answering hostile remarks, lands at an outer
    islet, builds a house there with his household, and stays for the winter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man first thinks he has seen a man gliding through the doorway, then
    later sees a real man slip out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When questioned, the daughter confesses that she is married to an atliarusek
    who has kept out of sight because she feared her father would not like him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the father gives permission, he sees a stout man sitting beneath the
    daughter’s lamp, though the man is later not visible when the father looks again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The daughter returns with a hunting-line and says her husband has returned
    with the produce of his hunt, while taking part of it to his relatives.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The parents see many seals on the beach and rejoice at sudden prosperity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The son-in-law later comes inside, makes himself at home, and is treated civilly
    by the parents.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: In spring the son-in-law says he must join his parents and protect his sisters
    because he is their only son.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A second boat appears from the beach; the two boats travel together, and the
    head-man of the atliaruseks tells the human boat to keep close in his wake.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The atliarusek boat sinks beneath the surface, the old man’s boat dives in
    the same manner without damage, the travelers continue beneath the waves, and
    then rise to the surface after passing inhabited places.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At the destination they hunt reindeer and load the boats; afterward the son-in-law
    provides amply for the old people.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the old man learns that the men who had scorned and abused him are in
    want, he loads his kayak with matak and brings it to them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The old man brings the former suitors back in a train of kayaks, receives
    them hospitably, feeds them, and reminds them of their earlier abuse and prediction
    that his daughter would not get a clever husband.
  category: speech
  evidence_refs:
  - ev:9
