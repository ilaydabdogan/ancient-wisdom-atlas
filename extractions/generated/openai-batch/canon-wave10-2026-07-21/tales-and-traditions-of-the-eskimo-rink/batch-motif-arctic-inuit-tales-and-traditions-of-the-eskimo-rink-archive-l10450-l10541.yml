canonical_text:
  quote: ''
  summary: Tungnerdluk, a hunter living by a firth, loses his only child when inlanders
    take the boy while his wife gathers berries. With aid from angakok figures and
    a helper from the coast people, he regains the child's body; after the child falls
    ill, another angakok retrieves the child's spirit from the inlanders and restores
    him. A note reports a similar variant in which a mountain-top monster replaces
    the inlanders and is defeated by summoned helper beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tungnerdluk has a fixed home by a firth, hunts reindeer in the highlands,
    and hunts seals at the mouth of the firth in winter.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: During Tungnerdluk's absence, his wife goes berry-gathering with their only
    child, sets the boy down briefly, and returns to find him gone while hearing his
    cries from far away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wife reports that she allowed the child to be taken by the inlanders and
    says she fears her husband's anger.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tungnerdluk asks his wife to put new soles on his boots and goes to consult
    his cousin, who is an angakok.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The cousin angakok identifies where the boy has been taken, accompanies Tungnerdluk
    part of the way, and then tells him to approach a large house alone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Inside the large house, two terrible women quarrel and fight over the weeping
    child, and they pass the child back and forth whenever Tungnerdluk tries to take
    him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A huge man enters, says he has sprung from the coast people, tells Tungnerdluk
    to run ahead, and says he will come after with the child while house-fellows pursue
    them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tungnerdluk returns to his tent, orders immediate departure, and the helper
    arrives with the child.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The group folds tents, loads the boat, pushes from shore, sees enemies descending
    the hills, and Tungnerdluk kills one enemy with his harpoon before leaving the
    firth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the rescue, Tungnerdluk's son becomes sick; one angakok cannot determine
    the cause.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Another angakok, renowned for headlifting, conjures and calls up spirits,
    interrupts and resumes his breathing, and says the child's spirit is still with
    the inlanders.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: At the father's request, the angakok flies to the inlanders, brings back the
    child's spirit, restores it to the child, and the baby recovers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Tungnerdluk pays the angakok with different kinds of food and promises future
    help if the angakok is in distress.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Two visitors come to mock Tungnerdluk with an offer of whalebones, but after
    he shows his store of whalebones and walrus-teeth they leave respectfully.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: A note says a very similar story exists in another manuscript and verbal narration,
    with the inlanders replaced by the amarsiniook, a fabulous monster living on a
    mountain-top emerging from the inland ice.
  category: other
  evidence_refs:
  - ev:11
- id: obs:16
  text: In the noted variant, an old k'elaumassok retrieves the child, is overtaken
    with the child by the amarsiniook, summons torjiaks called the slinghitter and
    the falcon, and the falcon defeats the monster.
  category: sequence
  evidence_refs:
  - ev:12
