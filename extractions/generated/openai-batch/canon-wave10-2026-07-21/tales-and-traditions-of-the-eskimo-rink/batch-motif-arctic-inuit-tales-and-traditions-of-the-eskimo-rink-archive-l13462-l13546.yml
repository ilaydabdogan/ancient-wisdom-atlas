canonical_text:
  quote: ''
  summary: A South Greenland tale describes two skilled hunter-friends, Naujarsuak
    and Kukajak. After Naujarsuak becomes jealous of Kukajak's larger dried-meat stores
    and makes holes that let foxes empty them, Kukajak visits him and then kills him
    from behind with a harpoon, witnessed by Naujarsuak's young son. Naujarsuak's
    old father buries him, raises the son at Amerdlok under constant admonition, and
    later prepares him to seek revenge. The grandfather and grandson travel south
    with valuable whalebones, return to their former home, and the son asks for a
    large harpoon with a strong line.
  language: English
  quote_policy: summarized
