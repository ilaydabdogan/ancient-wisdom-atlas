canonical_text:
  quote: ''
  summary: 'The passage closes one orphan-related story with a young man forcing an
    old man to drink boiling train-oil, causing his death. A note summarizes other
    orphan legends involving destitute orphans receiving animals, a girl helped by
    kayakers who become gulls, an inextinguishable fire given by a small woman, and
    an orphan who learns to walk on the ocean. A new tale begins: Lekatokak and her
    brother Asuvina go to set fox-traps; Asuvina disappears while seeking a flat stone,
    and Lekatokak is accused and threatened by her father. Her mother urges her to
    flee. Lekatokak wanders inland, escapes a threatening giant-like man, is hosted
    by invisible shadows, and later reaches the sea near many tents.'
  language: English
  quote_policy: summarized
