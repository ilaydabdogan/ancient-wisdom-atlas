canonical_text:
  quote: ''
  summary: The passage describes the training, recognition, powers, spirit helpers,
    social authority, healing and divining practices, conjuring rites, and grade elevation
    ordeals of angakut, including cave or dried-lake ordeals, summoning tornaks, spirit-flight,
    and a bear-and-walrus episode in which an angakok is killed or consumed and returns
    to life from bones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some accounts say inferior angakut perfected themselves in caves, while a
    higher grade was obtained in a dried-up lake by allowing vermin to suck the apprentice's
    blood until unconsciousness came on.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After returning to people following a meeting with tornarsuk, the candidate
    had to show power by calling forth his tornak before becoming an acknowledged
    angakok.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the interval before recognition, the candidate's feet might sink into
    rocky ground as if into snow, and some accounts say he could die if he did not
    manifest himself within a certain time.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Clairvoyants could detect angakut by their breathing fire like witches, though
    the angakut did not have black arms like the witches.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: If an incipient angakok failed ten times in succession to call forth his tornak,
    he had to give up the claim to become an angakok, though he remained a peculiarly
    gifted person.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: An angakok had more than one tornak; inue of land and sea, souls of kivigtut,
    souls of the dead, and souls of animals could become tornaks.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tornaks are described as advising and informing spirits, helpers in danger,
    or revenging and destructive powers.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: One kind of tornak, called eKungassoK, was valued for skill but lacked strength
    and was ridiculed for boasting of bravery.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: According to early authors, an angakok became poolik, a higher grade, by invoking
    or conjuring a bear and a walrus.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the poolik episode, the bear seizes the angakok and throws him into the
    sea; the walrus devours both and later throws the angakok's bones onto the beach,
    from which he comes to life again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The angakut were acknowledged teachers and judges concerning religious belief,
    and are described as becoming a kind of civil magistrate because belief affected
    customs and social life.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The angakut taught others how to obtain supernatural help and also provided
    such help directly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: 'Their practices included ordinary medical remedies and a special angakut
    means: summoning their tornaks.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Named acts include angmainek, taking out a sick person's entrails and replacing
    them after cleaning, repairing a soul, and divining from a tub of water about
    missing people or lost articles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Conjuring could involve summoning a tornak for counsel, undertaking a spirit-flight
    to examine or accomplish what was required, or calling forth evil spirits such
    as witches and anghiaks to defeat and destroy them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Torninek was ordinarily performed before auditors in a completely dark house,
    with the angakok tied with hands behind his back and head between his legs, placed
    on the floor beside a drum and suspended skin, while auditors sang before the
    invocation.
  category: setting
  evidence_refs:
  - ev:9
