canonical_text:
  quote: ''
  summary: Utereetsok travels north along the ice, finds an empty house built with
    narwhal-horn beams and strange tallow objects, winters among skilled ball-players
    who use an enchanted heavy seal-skin ball, and later reports these northern adventures
    to Kepigsuak. Northern visitors arrive to barter skins for firearms but refuse
    to sell their dogs. Utereetsok plans to revisit the strange house. Kepigsuak later
    travels to Kakortok, where Sakak has captured a fin-whale. Sakak's greedy wife
    Igpak insults an invited old guest, eats excessively, declares that she is becoming
    matak, and dies. People say a noxious whale-monster that appeared whenever she
    left the house is not seen after her death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Utereetsok travels farther north along the margin of the solid ice, where
    white whales are abundant along the coast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The travelers cannot get ashore, pitch tents on the ice, and sometimes use
    an unstripped white-whale skin as a sleeping floor before leaving it behind.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Near a steep, craggy coast and the only practicable landing place, the travelers
    find a little house with no people present.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Inside the house, Utereetsok sees ceiling beams made of narwhal horn, no wood,
    a strange tallow head, and instruments with points wrapped in tallow and skin.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Because they see no people, the travelers become uneasy and leave the house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: During winter among excellent ball-players, an immense heavy ball is made
    from a whole seal-skin stuffed with sand and other heavy materials.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Old crones sit on the ball and enchant it with magic spells before the game.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The ball is brought onto the ice on a sledge; the players push one another
    until the winners drive it ashore and through a house window.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: An old hag seizes the ball and sits on it after it goes through the window.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The victorious party gives entertainments, and amusement continues through
    the season of increasing daylight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Utereetsok returns to Ilulissat and tells his northern adventures to Kepigsuak.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Two sledgers from the north arrive after traveling from one full moon to the
    next, clothed head to foot in reindeer-skin suits.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The northern visitors say reindeer lie close to houses and on roofs in their
    home, and that they have brought fox and reindeer skins to barter with Europeans
    for firearms.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: A merchant offers powder and lead in exchange for the visitors' dogs, but
    the strangers refuse to spare them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: Utereetsok plans another far-northern journey to revisit the house with narwhal-horn
    beams and approach from land to see whether it is occupied and what the people
    are like.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Kepigsuak later travels south to Kakortok, where Sakak captures a k'epokak,
    identified as a fin-whale.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: Sakak has four wives, and the last wife, Igpak, is described as haughty and
    greedy.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:18
  text: When visitors come after news of the whale, Igpak has nothing to spare; she
    insults an old man invited by Sakak.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:19
  text: Igpak gives the old man a piece of matak and a knife to cut it, but he rejects
    the knife and says he wants only to take the food home.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: Igpak continues eating, says the food seems to draw her on, develops a sore
    and twisted tongue, cries that she is growing matak herself, and dies.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:21
  text: People say that while Igpak lived, a noxious whale-monster appeared above
    the water whenever she left the house, and that after her death it was no longer
    seen.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:22
  text: After Igpak's death, Sakak's other wives are at liberty to share out as they
    like.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:23
  text: Kepigsuak returns to Kangamiut, is later baptized and called Egede, and is
    buried at Kangamiut.
  category: sequence
  evidence_refs:
  - ev:10
