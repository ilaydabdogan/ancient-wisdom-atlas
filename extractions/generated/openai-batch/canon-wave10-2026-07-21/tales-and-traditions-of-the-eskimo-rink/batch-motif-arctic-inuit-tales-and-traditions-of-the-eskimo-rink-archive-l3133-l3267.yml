canonical_text:
  quote: ''
  summary: The passage presents two nith-songs. The first, concerning Kukook, includes
    Greenlandic song text and an English translation in which Kukook is described
    as a bad hunter seeking European friendship and is made to speak of leaving by
    ship, obtaining beads, returning, beating relatives, and marrying two women. The
    second is a mutual nith-song from East Greenland between Savdlat and Pulangitsissok,
    with reciprocal mockery involving regional speech, halibut eating, kayaking, fear
    of capsizing, and towing.
  language: English translation with Greenlandic song text
  quote_policy: summarized
