canonical_text:
  quote: ''
  summary: The passage recounts Ipisanguak’s repeated spirit-assisted journeys to
    Akilinek, where he exchanges places with another angakok-like substitute while
    tied during conjurations. Witnesses from Kagsimiut observe the exchange. Later,
    at Kagsimiut, Ipisanguak is asked to improve seal hunting, notices a young woman,
    conjures spirits, and an immense iceberg advances and destroys a house after he
    escapes underground. A Kagsimiut angakok tries to avenge the people but is driven
    back. The destruction is linked to a girl with a new topknot who possessed an
    anghiak. A following fragment describes another angakok forcing his frightened
    son to attend conjurations, during which the boy sees stars dropping into an old
    grave on a hill and hears that the shining grave will enlighten him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man with eyes described as like the blackest berries invites the angakok
    inside, and the household welcomes him to a meal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The angakok asks for another person to fill his place at home so his relatives
    will believe he has visited the other place.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A dim-eyed man says he would like to be the substitute, though he is slow.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The substitute is tied, lifted within the house, and then soars into the open
    air.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ipisanguak spends the night with the hosts and leaves at dawn, crossing the
    sea.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: While crossing the sea, Ipisanguak sees a glare like a great fire, apparently
    from his substitute, who is also returning home; the two meet and aim at each
    other.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ipisanguak repeats the visit to Akilinek, and the substitute again recognizes
    his coming, leaves, and meets him on the way; they smile and return at daybreak.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: People from Kagsimiut report that Ipisanguak has become an angakok and exchanges
    places almost every day with an angakok from Akilinek.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Many kayakers and boat crews come to hear Ipisanguak; when he is tied and
    leaves for Akilinek, his comrade replaces him and entertains the guests all night.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: At Kagsimiut, a seal-hunter says seals are scarce and asks Ipisanguak to bring
    on the seals to improve hunting.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Ipisanguak notices a handsome young woman outside the house and takes a liking
    to her.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: In the evening Ipisanguak conjures spirits, and an immense iceberg appears,
    approaching the beach.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Ipisanguak has women advance one by one, but the woman he likes does not come.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: When a woman with a new ribbon around her topknot appears, the iceberg begins
    to waver and shake.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: Ipisanguak sinks beneath the floor, reaches his own house by an underground
    way, and has all the lamps lit.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: The iceberg rolls across the beach and crushes the house to atoms.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: An angakok from Kagsimiut appears to avenge his people, but is hit with stones,
    driven back, and his voice becomes inaudible.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: The next day Ipisanguak sees that no trace remains of the destroyed house.
  category: setting
  evidence_refs:
  - ev:18
- id: obs:19
  text: The girl with the new topknot is said to possess an anghiak, explained in
    the passage as the ghost of an abortion or a child born in concealment.
  category: attribute
  evidence_refs:
  - ev:19
- id: obs:20
  text: A later fragment says a great angakok regularly told auditors during conjurations
    that he had been to Akilinek, and they believed him.
  category: speech
  evidence_refs:
  - ev:20
- id: obs:21
  text: The great angakok forces his little son to attend conjurations while sitting
    on his knee.
  category: action
