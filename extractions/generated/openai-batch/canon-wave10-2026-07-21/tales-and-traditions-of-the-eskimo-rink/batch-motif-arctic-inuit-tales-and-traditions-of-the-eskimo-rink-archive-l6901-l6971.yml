  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The sisters see high land, drift toward it, land safely but hungry, and see
    that their ice-floe has turned into foam.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Each sister has part of a gull for an amulet.
