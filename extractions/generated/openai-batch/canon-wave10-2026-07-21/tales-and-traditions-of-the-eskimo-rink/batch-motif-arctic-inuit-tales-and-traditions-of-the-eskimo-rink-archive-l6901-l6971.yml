canonical_text:
  quote: ''
  summary: The passage ends a Tiggak episode in which Tiggak questions his companions
    about their amulets, leads them into the sea, and they transform into bears while
    the adopted son becomes a snow-bunting; they return near their old homestead and
    shed animal skins. The passage then begins the story of Malaise, who lives with
    two younger sisters; the sisters are swept out to sea on broken ice, reach a distant
    land, and find salmon at a river mouth, where they make fire and cook fish.
  language: English
  quote_policy: summarized
