canonical_text:
  quote: ''
  summary: A first-person speaker flees into the interior, survives by snaring birds,
    builds a winter house, and kills a reindeer during a snowstorm to secure food.
    Later he becomes skilled at hunting reindeer but seeks more dangerous excitement.
    He ascends to highlands and a glacier, sees a distant dark form that appears successively
    like several animals and then like an amarok-like monster, and is pursued across
    ice clefts. He escapes by crossing a wide crevice; the monster hangs on the icy
    edge and falls down the precipice. The speaker later fills storehouses at the
    beginning of winter, remembering his earlier hunger.
  language: English
  quote_policy: summarized
