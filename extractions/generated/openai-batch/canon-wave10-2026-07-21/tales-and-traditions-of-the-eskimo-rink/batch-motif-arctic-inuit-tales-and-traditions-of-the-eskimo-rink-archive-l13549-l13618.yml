canonical_text:
  quote: ''
  summary: The passage first concludes an episode in which Kukajak visits after being
    encouraged by reports of gifts, receives hospitality and whalebones, but is pursued
    and killed by Naujarsuak’s son, who says he has repaid the treatment of his father.
    The passage then begins a new tale about two widows’ sons who are close friends;
    one goes kayaking to the hunting-place alone, and his friend unexpectedly throws
    a harpoon at him, which he avoids by overturning his kayak and rising again with
    his paddle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People nearby tell Kukajak that if he goes he will receive gifts, and that
    an old man has said he longs to see him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kukajak goes the next day, receives a friendly welcome and a plentiful meal,
    but repeatedly thinks that the murder may return to the hosts’ minds during silences.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: At daybreak, Naujarsuak’s son goes outside, remembers that his father was
    killed on such a day, and feels his former wrath return, while appearing guileless
    when he re-enters the house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At his departure, Kukajak is given whalebones and looks back because he fears
    that some evil may follow him.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Naujarsuak’s son uses a new weapon by taking a bone-point made by his grandfather,
    bringing it down, and fixing it with a loud jerk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kukajak hears the sound and recognizes its meaning as a charm, sees his enemy
    pursuing him, and finds his strength failing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Near Kukajak’s own house, his adversary takes aim and sends a lance into Kukajak’s
    body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After killing Kukajak, Naujarsuak’s son tells bystanders that he saw Kukajak
    treat his father the same way and that he has paid him back.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Naujarsuak’s son tells the bystanders that they may take Kukajak’s corpse
    if they care for it, then leaves for home.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: One widow lives alone with her son at a winter station, and another widow
    lives farther south with her only son.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The two young men are fast friends and usually go kayaking and perform tasks
    together.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: One morning, the northern young man sees clear weather and an east breeze
    and goes alone to the hunting-place without waiting for his friend.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: At the hunting-ground, the northern young man hears a noise, turns, and sees
