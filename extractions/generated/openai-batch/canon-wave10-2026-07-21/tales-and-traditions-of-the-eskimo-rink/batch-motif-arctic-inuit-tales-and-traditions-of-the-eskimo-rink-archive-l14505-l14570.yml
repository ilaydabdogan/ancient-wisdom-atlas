canonical_text:
  quote: "“It is I ; I am the thief !”"
  summary: After Kenake's murder, a woman asks her kin not to avenge him, but relatives
    use the dead body in a charm to make the son unbearable for Europeans to look
    at and proof against weapons. As an adult seal-hunter, the son, called the eye-me-not,
    repeatedly visits whaling ships at Umanak, steals goods while sailors pretend
    not to see, and later confronts attacking sailors. His mother sits on the roof
    casting spells; when sailors land, their noses bleed, and the eye-me-not taunts
    them to look at him and shoot him, but they turn away.
  language: English
  quote_policy: quoted
