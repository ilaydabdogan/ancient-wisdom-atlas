canonical_text:
  quote: ''
  summary: An old angakok is carried seawards to a new land under a warning that seal
    blood must not fall to earth. He is revived and feasted, then asked to examine
    a sick young hunter. During conjuration he sees the sick man's aunt, described
    as her soul or ghost and as a witch, approaching to touch him. She admits that
    she harmed the youth because he had failed to give her food from a successful
    hunt. Ataitsiak attacks her with a harpoon while others hold the strings; she
    escapes beneath the floor but is wounded in the foot. The living aunt is found
    nearby with a bleeding foot, later dies, and the healed youth brings gifts to
    Ataitsiak.
  language: English
  quote_policy: summarized
