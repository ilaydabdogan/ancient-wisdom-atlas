canonical_text:
  quote: "“Why, yes ; I wanted to play you a trick, you see.”"
  summary: 'Kasiagsak repeatedly reports impressive or disastrous events that are
    contradicted by later evidence or witnesses: a claimed walrus hunt, a claimed
    iceberg accident, and a claim of abundant stored meat made to hungry in-laws.
    He later catches only a raven while his visiting brother-in-law receives provisions
    from others.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Kasiagsak tells others that a walrus has gone down with his bladder and that
    he will go home to say he has lanced a walrus.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: His wife reacts to the reported hunt by hurrying into the house, breaking
    her knife handle, and saying she can get a walrus-tooth handle and a new kettle
    hook.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A later kayaker brings a harpoon-line and bladder, says it appears to be Kasiagsak’s,
    and Kasiagsak answers his wife that he wanted to play a trick.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two berry-gathering women watch Kasiagsak fill his kayak with broken ice,
    wade into the water up to his neck, hammer his kayak with stones, and stuff his
    coat with ice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kasiagsak cries that a calving iceberg came down on him, while pieces of ice
    fall out of his clothes and he laments as if in pain.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The two women later identify him as the person they saw stuffing his clothes
    with ice, and his wife asks whether he has again been lying.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: At his father-in-law’s house, lamps are not burning and dog flesh is being
    boiled because the little son was hungry and there was nothing else to eat.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Kasiagsak says his home has heaps of seals and walruses and two storehouses
    full of them; the father-in-law calls him a poor little orphan boy turned rich,
    cries, and Kasiagsak feigns crying.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Kasiagsak brings his little brother-in-law home for promised victuals, makes
    a trap with string and blubber bait for ravens, catches one raven, and the brother-in-law
    receives food and presents from other people rather than from Kasiagsak.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
