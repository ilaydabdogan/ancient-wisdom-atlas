canonical_text:
  quote: ''
  summary: An editorial note frames the tale as partly historical and variant-rich.
    At winter quarters near a fiord, two helpful boys, Kunuk and his younger brother,
    serve the hunters and practice archery. While fetching water by moonlight, they
    see armed men approaching in the water, but the household dismisses their warnings.
    After a third sighting, the brothers hide their little sister under chips and
    hide themselves in the rafters. Seven armed assailants enter, kill the household,
    and throw spears; the sister is found pierced by a lance. The brothers flee at
    night carrying her, but she dies near a frozen firth and is buried in a rocky
    cave. During their wandering, the brothers train their bodies and become strong
    before seeing a man on the ice beside a large piece of wood.
  language: English
  quote_policy: summarized
