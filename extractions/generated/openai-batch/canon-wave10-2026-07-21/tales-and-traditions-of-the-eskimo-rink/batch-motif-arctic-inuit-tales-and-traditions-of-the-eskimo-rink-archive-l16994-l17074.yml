candidate_motifs:
- id: motif:1
  label: Shamanic healing by confronting a witch's ghost
  taxonomy_refs:
  - wisdom
  basis: The angakok-man uses conjuration to detect and attack the ghost of the witch
    causing a youth's sickness; the aunt dies and is revealed as the witch.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The available taxonomy has no specific shaman-healing or witchcraft category;
    'wisdom' is used because the passage frames angakok powers and knowledge.
- id: motif:2
  label: Children as namesakes of those taken by monster birds
  taxonomy_refs: []
  basis: Boys present in the house are said to be namesakes of people whom monster-gulls
    carried away as food for their young.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage gives the statement briefly and does not narrate the original
    carrying-off episode.
- id: motif:3
  label: Grief mirrored through killing another father's son
  taxonomy_refs: []
  basis: The grieving old man kills an inlander and later realizes that the victim
    was probably another grieving father's lost son.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The recognition is described as the old man's inference, not as an explicitly
    confirmed revelation by a narrator.
- id: motif:4
  label: Boastful angakok humbled in a power contest
  taxonomy_refs:
  - wisdom
  basis: Angakorsiak prides himself on angakok wisdom, challenges another angakok,
    is surpassed in a public contest, and resolves to abandon emulation.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The motif label summarizes the action; the passage itself uses 'wisdom'
    and 'emulating' rather than a formal motif term.
- id: motif:5
  label: Transformation into a reindeer through shame and return to human form
  taxonomy_refs:
  - shapeshifter
  basis: The text states that shame transformed Angakorsiak into a reindeer after
    he sank, and that he later turned into a man again.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The cause is specifically shame in this passage; no broader shapeshifter
    cycle is described.
- id: motif:6
  label: Acquisition of angakok power during flight and ordeal
  taxonomy_refs:
  - departure
  - initiation
  basis: Tuagtuanguak flees persecution, travels north through repeated hardship,
    swoons, sees a black spot, and during this process acquires angakok power.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage does not explicitly call the ordeal an initiation; that taxonomy
    link is interpretive and should be reviewed.
- id: motif:7
  label: Supernatural gifts return to their owners
  taxonomy_refs:
  - sacred_exchange
  basis: Tuagtuanguak receives presents from the ingnersuit, but while she carries
    them home the gifts fly back to their first owners.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage does not explain whether the exchange failed because of a
    rule, taboo, or property of the gifts.
