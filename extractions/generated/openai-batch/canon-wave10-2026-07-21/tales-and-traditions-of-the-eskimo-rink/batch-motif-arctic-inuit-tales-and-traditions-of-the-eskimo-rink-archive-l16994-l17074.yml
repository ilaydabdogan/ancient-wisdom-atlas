canonical_text:
  quote: ''
  summary: 'The passage contains several short traditions: a husband and wife connected
    with angakok power find a sick youth and the angakok-man exposes the youth''s
    aunt as the witch causing the sickness; visitors learn that children present are
    namesakes of boys taken by monster-gulls; an old man grieving his son kills an
    inlander and later learns that the slain inlander was another father''s lost son;
    Angakorsiak challenges another angakok, is humbled in a contest, transforms into
    a reindeer from shame, returns to human form, and renounces emulation; Tuagtuanguak
    flees persecution, gains angakok power during a northern ordeal, settles and marries,
    and later receives gifts from ingnersuit that fly back to their owners.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A husband and wife habitually went kayaking together and came to a foreign
    place where a young man was nearly dying.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The angakok-man performed a conjuration, detected the ghost of the witch approaching
    the sick youth with black hands, and struck at the ghost's heel with a harpoon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At nearly the same moment, the sick youth's aunt died in the next house and
    was identified as the witch.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The visitors noticed boys playing on the floor and were told that the boys
    were namesakes of people whom monster-gulls had carried off as food for their
    young.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the explanation about the monster-gulls and the namesake boys, the assembly
    became silent.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: An old man lost his only son during reindeer-hunting and repeatedly visited
    the son's grave after returning home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The old man saw an inlander moving through the water without a kayak, described
    parenthetically as using the fog as a kayak, and killed him after angry words.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: On a later grave visit, another inlander asked about the old man's grief and
    said that he too had lost a son who had been seal-hunting.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The old man concluded that the inlander's lost son was the person he himself
    had killed, then left and never again visited his son's grave.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Angakorsiak was proud of his angakok wisdom and sought chances to emulate
    other angakut, mocking them when he surpassed them.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Angakorsiak challenged a northern angakok to a public contest in daylight.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Angakorsiak's performance included cutting off and replacing his arm, drinking
    blood from the wound, swallowing and making reappear an arrow-point, and opening
    his stomach with a knife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The rival angakok repeated the feats and then proposed a kayak-race.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:14
  text: The rival angakok threw a harpoon into a rock so that blood sprang from the
    stone; Angakorsiak failed at the same act and lost his broken harpoon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: Angakorsiak lowered his head from shame, capsized, and sank; soon afterward
    a reindeer emerged from the water and ran onto the beach.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: The passage states that shame transformed Angakorsiak into a reindeer, that
    he later became a man again, and that he resolved to stop emulating others.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:17
  text: A note states that several variants of the Angakorsiak tale exist and that
    traditions about the deeds of angakut are numerous.
  category: other
  evidence_refs:
  - ev:6
- id: obs:18
  text: Tuagtuanguak fled from her persecuting brother-in-law, ran across ice, fell
    through, got up, and continued northward while seeing a black spot before her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:19
  text: Tuagtuanguak swooned several times and, during this process, acquired angakok
    power.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:20
  text: After five days she reached a precipice and repeatedly leaped from its edge,
    only to be wafted back through the air to the same place for five days.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:21
  text: Tuagtuanguak continued north, reached an inhabited place, lived there, and
    later married.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:22
  text: Tuagtuanguak visited the ingnersuit and received presents from them, but the
    gifts flew back to their original owners while she carried them home.
  category: sequence
  evidence_refs:
  - ev:7
