canonical_text:
  quote: ''
  summary: 'The passage closes the Kagsuk episode: Kagsuk feeds two visitors, sends
    them home with provisions, and warns that future visitors may be killed. Their
    people ignore the warning; some disappear. Two old men skilled in magic avenge
    their lost sons by evading Kagsuk’s bird amulet and shooting him, after which
    kayakers kill his household except for an absent son. A note records an alternate
    extension linking Kagsuk with Kagsagsuk and describing a walrus-tooth rattling
    entry alarm. The next tradition begins with Akamalik grieving a dead cousin, seeking
    a namesake child for him, mistreating his wife, rejoicing in a named child elsewhere,
    and beginning to dream.'
  language: English
  quote_policy: summarized
