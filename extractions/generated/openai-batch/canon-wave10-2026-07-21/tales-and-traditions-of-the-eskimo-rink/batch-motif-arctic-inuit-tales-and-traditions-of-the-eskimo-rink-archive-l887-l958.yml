canonical_text:
  quote: ''
  summary: The passage introduces the author's view that laws, customs, religion,
    art, and science are largely embodied in traditional tales. It states that Greenlanders,
    especially West Greenlanders at the time of European settlement in 1721, are used
    as an illustrative case for Eskimo groups generally, with caution that tribes
    are not identical. It then describes subsistence from seals and cetaceous animals,
    sea-shore habitation, kayaks, waterproof skin coverings, hunting from kayaks,
    ice, and shore, air bladders attached to harpoons or javelins, and fitted weapon
    points.
  language: English
  quote_policy: summarized
