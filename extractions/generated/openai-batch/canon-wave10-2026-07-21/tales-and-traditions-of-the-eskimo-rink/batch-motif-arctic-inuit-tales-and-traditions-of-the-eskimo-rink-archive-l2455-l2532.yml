canonical_text:
  quote: ''
  summary: The passage describes Greenlandic Inuit religious ideas about dangerous
    contact with the dead, extraordinary human states, transformed or vengeful beings,
    animal spirits, a supernatural boat crew, and upper and lower ingnersuit who respectively
    protect or persecute kayakers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A slain man is said to be able to avenge himself on the murderer by rushing
    into him; this can be prevented by eating a piece of the slain man's liver.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Things connected with dead bodies or funerals are described as dangerous,
    with invisible rulers sometimes taking offence and causing bad weather and bad
    hunting.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A kivigtok is described as a man who fled human society to live alone with
    nature, generally in the interior, gaining great agility, knowledge of animal
    speech, and information about the world-pillars.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person could become kivigtok after unjust treatment or scolding, and the
    relatives or housemates involved were said to be in danger of the fugitive's vengeance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: An anghiak is described as an abortion or concealed birth child transformed
    into an evil spirit to revenge himself on relatives.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Related beings are described as newborn or older persons converted into monsters
    that devour their former housemates.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: An angherdlartugsiak is a man raised in a special manner so that, if drowned
    while kayaking, he may be called to life again and returned to land.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The preparation of an angherdlartugsiak includes the mother's strict fast,
    the child's habituation to the smell of urine, instruction never to hurt a dog,
    and the father's prayer to deceased parents or grandparents for protection.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: When the angherdlartugsiak comes back to shore, certain things may scare him,
    while dogs protect and care for him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Animals in tales may speak, take human shape, show themselves in a supernatural
    form, appear as ghosts, or be treated as inue of their kind with power to avenge
    their destruction.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The umiarissat are described as a supernatural women's boat and crew, sometimes
    represented as seals transformed into rowers.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: The ingnersuit have abodes beneath the earth's surface and in cliffs along
    the seashore, with ordinarily invisible entrances, and have also been noticed
    entering through turf mounds.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:13
  text: The upper ingnersuit are benevolent spirits who protect kayakers and have
    human shape, white skin, small noses, and reddish eyes.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: The upper ingnersuit often accompany and assist the kayaker invisibly to him,
    though others may see them from a distance.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: The lower ingnersuit have no noses and persecute skilled kayakers by dragging
    them down to their home in the deep and keeping them in painful captivity.
  category: action
  evidence_refs:
  - ev:15
