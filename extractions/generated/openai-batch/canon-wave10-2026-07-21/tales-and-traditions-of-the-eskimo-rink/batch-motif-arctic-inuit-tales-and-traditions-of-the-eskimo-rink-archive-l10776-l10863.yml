canonical_text:
  quote: ''
  summary: The passage first describes a boy fetched by a grave-ghost, awakening naked
    in a grave with altered perception and angakok wisdom. As an angakok he travels
    to Akilinek, recognizes another angakok by clairvoyant sense, and later summons
    an iceberg-shaped tornak to bring seals; the event becomes deadly when a woman
    with an anghiak is present, and only two angakut escape. A following story, introduced
    as a variation on a popular theme of angakut facing Ingnersuit dangers, tells
    how Kuvitsina enters a self-opening rock, is captured and mutilated by Ingnersuit,
    calls benevolent Ingnersuit tornaks, escapes with an amulet, has his kayak repaired
    by breath, and has his severed nose return and reattach.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A father holds a son while a ghost from a grave, called by an angakok, enters
    the house to fetch the boy; the boy smells maggots and faints.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After recovering, the boy finds himself naked in a grave; his nature is altered
    and he can survey the country to the far north with nothing concealed from him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy sees his father’s tracks across the sea to Akilinek, then observes
    his clothes flying through the air and covering him again when he extends his
    hands and feet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On entering the house after the grave episode, the boy appears very pale because
    of the angakok wisdom acquired in the old grave.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: After becoming an angakok, he travels in flight to Akilinek and, by angakok
    sense, recognizes a dim-eyed man as another angakok with bone-chips at his feet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The bone-chips are explained as arising from work begun before mourning days
    had passed, thereby provoking invisible rulers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The visiting angakok is asked to make a conjuration for plentiful seal-hunting
    and summons a tornak called a kivingak, described as an iceberg covered with seals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A woman with an anghiak is among those on the floor; this makes the iceberg
    turn to its steep side, fall with a roar, crush the house, and kill all inside
    except the two angakut.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kuvitsina leaves his companions, travels alone in a kayak along the shore,
    and enters a low steep rock that opens by itself.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Inside the opened rock, Ingnersuit surround Kuvitsina, tear away and smash
    his kayak, take him into a house, and an old housewife cuts off his nose and ties
    him to a pillar.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kuvitsina first calls tornaks that the Ingnersuit do not notice, then calls
    two benevolent Ingnersuit tornaks named Nepingasuak and Napatarak.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Napatarak arrives first, cuts Kuvitsina’s bonds, gives him an amulet, and
    tells him to leave quickly.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Nepingasuak breathes on Kuvitsina’s ruined kayak and repairs it; Napatarak
    warns the Ingnersuit not to harm people living on the face of the earth.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: On Kuvitsina’s way home, his severed nose comes whirling through the air and
    settles back in place, though somewhat awry.
  category: sequence
  evidence_refs:
  - ev:12
