  claim: The passage explicitly likens the one-bladed paddles of the kayarissat to
    those of 'the Indians' and connects bark from American canoes with names for kayarissat
    and umiarissat.
  claim_level: visual_similarity
  target: Indian one-bladed paddles and American canoe bark, as described in the passage
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison uses the source's broad terminology and gives no specific
    Indigenous group, region, or historical mechanism.
- id: claim:2
  claim: 'The passage states an intra-Eskimo contrast in the term amarok: elsewhere
    it signifies a wolf, while in Greenland it represents an enormous fabulous animal.'
  claim_level: linguistic_similarity
  target: Amarok as wolf in other Eskimo countries versus Greenlandic fabulous animal
  evidence_refs:
