literal_observations:
- id: obs:1
  text: The kayarissat are extraordinary-sized kayakmen encountered far from land
    beyond usual hunting grounds; they are skilled in sorcery connected with storms
    and bad weather and use one-bladed paddles.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The kungusutarissat, or mermen, are described as the proper inue of the sea;
    fox-flesh and fox-tails are sacrificed to them for good hunting, and they are
    enemies of petulant or disobedient children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The inugpait are giants living in a country beyond the sea where things are
    proportionally large and one-eyed people are also found.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The tornit are prominent inue of the interior with hidden entrances to their
    dwellings; they are larger than humans, hunt at sea in fog without kayaks, and
    know human thoughts before they are spoken.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The igaligdlit are inlanders who carry a pot on their shoulders and cook meat
    in it while wandering.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The isseikat are inlanders said to blink or twinkle their eyes lengthwise.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The erkigdlit have human-shaped upper bodies and dog-shaped lower limbs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
