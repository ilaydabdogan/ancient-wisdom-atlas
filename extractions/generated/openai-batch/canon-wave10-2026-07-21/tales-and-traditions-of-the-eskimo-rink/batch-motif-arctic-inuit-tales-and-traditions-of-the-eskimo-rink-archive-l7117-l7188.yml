canonical_text:
  quote: ''
  summary: An editorial note frames the Navaranak/Javraganak material as variant historical
    traditions localized in different regions. In the first narrative, Navaranak serves
    as an exchange messenger between inlanders and coast-people, then deceives both
    sides by claiming each plans to attack the other. The inlanders raid the coast-people
    while the men are away, killing most women and children. Surviving coast-people
    inform the returning men, who later prepare arrows, travel inland for revenge,
    capture and kill Navaranak, and massacre the inlanders at a lake encampment. The
    excerpt ends with the opening of a Labrador version naming an Indian woman Javraganak.
  language: English
  quote_policy: summarized
