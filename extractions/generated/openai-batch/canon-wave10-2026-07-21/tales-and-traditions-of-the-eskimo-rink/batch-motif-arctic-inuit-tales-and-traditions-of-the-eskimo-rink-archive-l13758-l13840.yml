canonical_text:
  quote: ''
  summary: Niakunguak, a quiet younger brother, leaves his boisterous brothers by
    kayak and travels south. He is welcomed by a settlement, marries an old man’s
    youngest daughter, and becomes the old man’s provider. Later, after Southlanders
    winter among them, a boastful stranger accompanies Niakunguak on a severe winter
    seal hunt, retreats in the storm, and tells Niakunguak’s son that his father will
    not return. Niakunguak returns through dangerous surf with two seals, hears what
    was said, and speaks modestly before a communal meal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A number of brothers have fixed winter quarters; several older brothers are
    married, while Niakunguak, one of the younger brothers, has no wife at the start.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Niakunguak is described as differing from his brothers, who are wild and boisterous,
    and he refuses to join their noisy pastimes and tricks.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: After growing weary of his brothers’ company, Niakunguak waits until they
    leave on an excursion, takes his kayak, puts out from land, and coasts south for
    many days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Niakunguak reaches a bay with many tents, is called ashore, and is welcomed
    by men of the place; an old man invites him into his tent.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The old man offers Niakunguak a choice of one of his two daughters; Niakunguak
    chooses the youngest as wife and becomes the old man’s support and provider.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The people become fond of Niakunguak for his modesty, and their gatherings
    are described as lacking boasting and boisterous manners.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Niakunguak’s wife bears a son, and during the son’s childhood a boat’s crew
    of Southlanders comes to winter among the settlement.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: One Southlander is described as presumptuous and conceited, while Niakunguak
    is reluctant to contradict him.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: In severe cold after the winter solstice, Niakunguak is the only local man
    who starts out; the bragging stranger offers to go with him, and both go to sea
    for seals.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: As the wind rises, Niakunguak lances a seal and expects help, but the companion
    turns home frightened by the gale; Niakunguak fastens the first seal and gets
    another.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After reaching shore, the companion tells Niakunguak’s son that his father
    will never return and that there is no kayaking in such weather; the son goes
    inside quiet and silent while other men watch for the kayak.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Observers see two seals with spears in the foaming surf and then see Niakunguak
    himself carried across the heavy seas; he reaches shore and goes to his house.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Niakunguak’s son reports the companion’s words; Niakunguak replies that in
    such weather one might go out even in a poor kayak, and later begins a public
    remark about having found no kayaker to assist him.
  category: speech
  evidence_refs:
  - ev:8
