canonical_text:
  quote: ''
  summary: Ussungussak, an unsuccessful hunter scolded by his wife, leaves home and
    is drawn inland by an inlander. After a dangerous crossing at the gulf of the
    earth, he stays at the inlander’s house and later receives access to seals with
    a warning not to be greedy. He returns home with seals, exhausts the lot, returns
    again to the inlander, and is strangled at the precipice. A searching kayaker
    later confronts and kills the inlander.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A number of people live together in a large house; Ussungussak commonly returns
    empty-handed while others return with catches, and his wife scolds him.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: After worse-than-usual scolding, Ussungussak disappears in the morning, kayaks
    along shore, and sees a man standing on the beach after rounding a point.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ussungussak is initially afraid but resolves to lead a solitary life by himself.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man on shore calls Ussungussak, throws out a trap, draws him in, and orders
    him to follow inland.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The two travel to the gulf of the earth; the inlander puts a cord around Ussungussak’s
    neck and tightens it until he is nearly choked, after which they have safely passed
    the precipice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: They cross a beautiful meadow and reach the inlander’s house, where the inlander
    has a wife but no children.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: For several days Ussungussak stays at the house while the master goes out
    and returns noisily in the evening with what he has taken.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When Ussungussak wants to see his home, the inlander accompanies him; this
    time they do not see the precipice.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the coast they see many killed seals on the beach, identified as those
    the inlander had caught in his trap while standing on shore.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The inlander tells Ussungussak he may take seals henceforth, warns him not
    to be too greedy, and limits him first to one at a time and later to two.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ussungussak returns to his homestead; the next day he disappears and returns
    in the evening with two seals, and the following day he brings three.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Other people ask where he obtained the seals, and he answers that he got them
    at the most seaward place.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: After carrying away the last of the seals, Ussungussak returns one night with
    nothing and is again scolded by his wife.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Ussungussak again kayaks along shore, rounds a point, sees the inlander, willingly
    approaches when called, and goes with him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: At the precipice on the second journey, Ussungussak does not get over and
    is strangled.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: After Ussungussak’s relations and housemates wait five days, a kayaker goes
    out searching and encounters the inlander, who says he killed Ussungussak himself.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:17
  text: The searching kayaker attacks the inlander with hunting weapons, pursues him
    while the hunting-bladder drags and flies behind, and finally kills him with an
    arrow.
  category: action
  evidence_refs:
  - ev:12
- id: obs:18
  text: After the inlander dies, the pursuer cuts him up and puts his knee on the
    nape of the inlander’s neck.
  category: action
  evidence_refs:
  - ev:12
