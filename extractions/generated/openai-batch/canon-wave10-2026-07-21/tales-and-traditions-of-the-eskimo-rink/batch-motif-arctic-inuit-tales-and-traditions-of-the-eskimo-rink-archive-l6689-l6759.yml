canonical_text:
  quote: ''
  summary: The passage presents an abstracted Greenlandic tale of Tiggak, a famous
    angakok and sorcerer. After being criticized by his wife's brothers for neglecting
    hunting, he later proves able to obtain seals during severe winter weather and
    provides for the household. In a later winter, after adopting a boy, he leads
    the brothers and the boy onto the sea ice, reads signs in the water and current,
    predicts a gale, and attempts to return before the ice breaks; when the boy cannot
    cross a broad cleft, Tiggak returns to him and the group drifts seaward.
  language: English
  quote_policy: summarized
