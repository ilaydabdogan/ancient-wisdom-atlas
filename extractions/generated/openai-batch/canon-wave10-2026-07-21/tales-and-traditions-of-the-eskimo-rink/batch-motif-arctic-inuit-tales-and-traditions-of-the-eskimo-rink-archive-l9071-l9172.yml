canonical_text:
  quote: ''
  summary: The supplied passage first tells of a family whose two strong hunter-sons
    are killed by inlanders; the mother adopts and nurses a magically powerful dog,
    which kills the inlanders by a face-scratching charm, obtains food for the foster
    parents, and is later abandoned, giving an origin for dogs howling after departing
    boats. The passage then begins a second tale in which a widow’s son, Kujanguak,
    is denied customary food by wealthy neighboring brothers; the widow uses charms
    to produce food and a kayak, trains her son, and he pursues a bear onto an iceberg.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old married couple has two sons and a little daughter; the sons are strong
    and able hunters who tow home many seals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two sons do not return, and a report says they are hanging by their feet,
    head downward, on an inaccessible rock after an act done by inlanders.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother sends the daughter to fetch a whelp, adopts it, keeps it beside
    her, and nurses it with her own milk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dog is described as endowed with magic power; it scratches its face and
    speaks, asking how it looks.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: During winter want, after the family has lost its protectors, the dog says
    it will go for a walk into the country.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The inlanders are busy conjuring spirits when the dog approaches, and an angakok
    foretells the dog’s coming and cries out about fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The dog scratches its face, hides in a passage, and frightens the inlanders
    to death when they come out with lights.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dog finds the inlanders’ storehouse, brings victuals to its foster parents,
    and shows them where the remaining food is.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The foster mother begins to fear the dog and later sends it back to the house
    for a forgotten item while the boat leaves.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The dog follows along the shore as far as it can, then remains whining and
    howling at the last point of land.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The tale states that this is the origin of dogs following departing boats
    along the coast and howling from the last point of land.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: A widow and her son Kujanguak live near well-off brothers who are skilled
    at their profession.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: When the widow sends Kujanguak to ask for a customary little bit of blubber,
    the brothers insult him and refuse to give him anything.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the brothers catch a mamartok, they again mistreat Kujanguak; the widow
    becomes angry, takes a boot, sits in a corner of the ledge, and practices a charm.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: After the widow’s charms, an eider-duck appears in the pot and a small seal
    appears in the water-tub.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: A fully furnished kayak appears, and the widow trains Kujanguak at paddling,
    capsizing, and righting until he is expert.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Kujanguak is seen attacking a bear that takes refuge on an iceberg; after
    the eldest brother cannot climb the iceberg, Kujanguak climbs it and reaches the
    bear.
  category: action
  evidence_refs:
  - ev:11
