  quote: ''
  summary: A brother-in-law from Akilinek stays indoors out of fear of sledge animals
    and because he is too tall for the ledge. When he later goes outside, his wife's
    cousin sets the kukissook on him and he is torn to pieces. The cousin also kills
    the child, saying it is not of real human descent and might grow like its father.
    The two cousins resume their former roaming life, and their bones are said to
    rest at their home.
