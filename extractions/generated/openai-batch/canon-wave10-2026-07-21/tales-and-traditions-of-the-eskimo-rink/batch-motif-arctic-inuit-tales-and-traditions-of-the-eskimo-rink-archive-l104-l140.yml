  summary: The preface explains that the abridgment is meant to make Eskimo and especially
    Greenlandic accounts more available to archaeological and comparative studies
    of early human history. It argues that folklore may preserve relics of prehistoric
    spiritual life comparable in value to material remains, presents the Eskimo as
    isolated and as a link between aboriginal peoples of the New and Old World, and
    notes that illustrations were made by Greenlandic natives from blocks supplied
    by the author.
