canonical_text:
  quote: ''
  summary: Kujavarsuk rests despite news that a whale is blowing. A young friend challenges
    him over making whale-catching bladders, and Kujavarsuk succeeds in getting seals
    for that purpose. When whales appear, Kujavarsuk lacks women to row his boat and
    instead takes children as crew. Other hunters go farther out to sea and urge him
    to join them, but he stays near shore because his mother told him he was conceived
    there. A whale appears near him; he pursues, harpoons, and kills it alone. In
    spring he returns to his former home and gives reserved whalebone to an old fisherman.
  language: English
  quote_policy: summarized
