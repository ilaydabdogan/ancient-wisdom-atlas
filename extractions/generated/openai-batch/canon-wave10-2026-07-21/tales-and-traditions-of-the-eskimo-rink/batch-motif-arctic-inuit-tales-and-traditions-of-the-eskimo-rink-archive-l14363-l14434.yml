canonical_text:
  quote: ''
  summary: A master warns a man to be vigilant while cutting trees and to flee if
    he hears danger. The man ignores warning signs until a wild beast appears, then
    escapes into a cave that opens and closes by itself, where women keep him for
    a time and reward him with money. Later, after Kigutikak's brother dies when a
    ship is ready for departure, Kigutikak burns the ship, buries stores in the sea,
    travels with his master across several lakes by boat, and finally boards the last
    departing whaling ship while his master asks the sailors to watch over him.
  language: English
  quote_policy: summarized
