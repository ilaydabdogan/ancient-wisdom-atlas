canonical_text:
  quote: ''
  summary: 'An angakok investigates repeated deaths of children and, with Kajuernek,
    identifies an anghiak, the ghost of a child, as the killer of its younger brothers.
    The ghost speaks, enters with difficulty, and escapes through an opening near
    the roof-beams. Kakamak is distressed, her family relocates, and later a son is
    killed by jealous hunting companions. A new tale begins: Utereetsok travels far
    north, encounters people without wooden tent-poles, resists repeated pushes by
    knocking down the offender, and learns that holes in infants'' jacket hoods are
    attributed to the moon looking down on them.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After several children die at about the same age and in the same manner, an
    angakok performs conjuration but cannot first determine the cause.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kajuernek is summoned by boat and conducts conjuration in the evening.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kajuernek states that Kakamak's sister-in-law had accused Kakamak of having
    an anghiak, described parenthetically as the ghost of a child, which killed the
    children.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the conjuration, Kajuernek describes a kayak approaching from the north,
    shaped like a dog's head, reaching the doorway, and failing to get through the
    inner entrance.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: An infant's voice answers the angakok, names Kakamak as its mother, says it
    was born on Alangok, and says it caused the death of all its younger brothers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Kajuernek orders the anghiak to pass the threshold; after entering, it is
    pursued but escapes through a hole near a roof-beam.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Kajuernek says the anghiak is difficult to catch because it has already killed
    several individuals.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Kakamak is found crying in a far corner, and her sister-in-law rebukes and
    scolds her.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Kajuernek tries again the following day to catch the anghiak, but it escapes
    through a small opening, and he gives up.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Kakamak becomes meek and submissive; her father, depressed, moves the family
    to Niakungunak with another family of many brothers.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: During a deer-hunting trip, the father's son has the greatest luck shooting,
    and the others kill him out of jealousy.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Utereetsok travels north from Ilulissat past Umanak and Upernivik, visiting
    inhabited places.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: In the far north he reaches people who lack wood for tent-poles and use stiff
    dried seal-skins set upright as a tent, sleeping on bare ground.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:14
  text: Utereetsok is pushed from behind and responds by striking the offender so
    that the offender rolls along the ground; after repetition, the inhabitants fear
    him and leave him in peace.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: Infants in the northern place have holes in the hoods of their jackets, which
