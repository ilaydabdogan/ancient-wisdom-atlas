canonical_text:
  quote: ''
  summary: A monster is born during childbirth and kills most of the household. Three
    siblings escape, survive hostile hosts, and are taken in by a giant hunter. After
    the younger brother is killed by a dangerous fabulous bird, the sister kills the
    bird with a boot, recovers her brother’s bones from its pouch, and he revives.
    A note links the tale to other child-monster stories, including a variant in which
    an ill-treated child becomes a devourer and spares kind orphans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During childbirth, the midwife reports that the newborn is a monster with
    large teeth and that it is tearing her arm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The household flees to an upturned boat and a great rock, while two boys and
    their sister take refuge in the provision-house because there is no room elsewhere.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The monster appears dragging its mother, cannot climb to the boat, eats away
    the supporting pillars, and devours the people who fall.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the rock, the refugees push against each other in fear; after most fall,
    the monster orders the rock to upset and kills the last person there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The monster repeatedly turns toward the provision-house but enters the main
    house instead, staying longer each time; during the last interval the children
    flee inland.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At a later house, the sister remains awake at midnight and hears someone propose
    killing the siblings in the morning because they may have killed their own housemates.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The siblings flee again, reach another house, encounter the same threat, and
    after leaving the second night the sister presses one brother’s boot against the
    door while pronouncing a spell that the people inside may perish.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The siblings meet an extraordinarily large man carrying half a reindeer; after
    the youngest brother explains their situation, the man takes them to his furnished
    house and gives them dry meat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The sister repeatedly asks what would make the current food better, prompting
    the acquisition of partridges, hares, and other game or fowls.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the sister mentions young serdlernaks and then large ones, the huge man
    says he has misgivings about hunting that bird because it is dangerous while hatching
    eggs and catching seals.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A large serdlernak is seen on a rock and rises to snatch at the group; after
    the others retire, the younger brother remains and is torn apart by the bird.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The sister pulls out her boot, strikes the bird with it, and kills it.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The sister cuts up the bird and finds its pouch filled with seal-bones, including
    her brother’s bones.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: After the sister carries the brother’s bones, they move; near the house she
    puts them down, and the brother revives unharmed.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: The note states that several stories treat the same subject and often present
    the monster as avenging atrocity, misbehavior, or injustice.
  category: other
  evidence_refs:
  - ev:13
- id: obs:16
  text: The note gives a variant in which an ill-treated imbecile child named Tungavik
    gains speech, eats its mother’s breast, devours its parents and housemates, and
    spares two kind orphan children.
  category: sequence
  evidence_refs:
  - ev:14
