canonical_text:
  quote: ''
  summary: A group drifting on an ice-floe fears the sea. Tiggak sings a short song
    connected with ocean foam, after which an iceberg refuge appears, and later sings
    a water charm that brings a spring from the iceberg. He warns the group not to
    look toward the sea until all have landed; after the last landing he looks back
    and the refuge becomes foam. In the new country they are hosted, summoned to another
    house, and confronted by a giant-like man who challenges them to wrestle. One
    brother is crushed to death and hoisted to the roof, while Tiggak prepares to
    wrestle next.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The group stands on an ice-floe washed by waves, grows fearful, and one person
    says Tiggak is learned in magic as they drift toward the wild sea.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tiggak says he knows only a short song about ocean foam, sings it, and the
    group sees an iceberg with an easy ascent ahead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Because the iceberg moves up and down, the group waits for the right moment;
    Tiggak jumps first and the others follow.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When thirst threatens, Tiggak says he knows one little song to get water,
    performs an incantation, and a small spring bubbles from the center of the iceberg.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tiggak stops the brothers from drinking immediately, tastes the water first,
    and then permits them to drink so that the water will not dry up or change.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Before landing, Tiggak tells the group that anyone who reaches shore must
    not look toward the sea while others remain behind, or the refuge will break up
    and be annihilated.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After everyone has landed, Tiggak turns toward the sea and points out that
    their refuge has become only a heap of foam.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The travelers cross an isthmus, see many houses, are invited into one house,
    and are later summoned by a squint-eyed, shaggy-haired youth as strangers from
    the east.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In another house, a giant-like man sits on the main ledge beside a similar
    old woman who gnaws a large shoulder-bone.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The giant-like man spreads a sealskin on the ground and calls for a wrestling
    match; the old woman fastens the door with a shoulder-blade after the other guests
    are ordered away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: One brother hooks arms with the giant-like man, cannot overcome him, and is
    crushed to death when the giant catches his lower parts and falls over him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The giant calls for a rope, fastens it around the dead man's body, and has
    the body hoisted to the roof, where knives are heard and a voice says the dead
    man's eye is to be kept for their master.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Tiggak thinks he may lose all his brothers-in-law and asks to take a turn
    wrestling; when he and the giant hook arms, the giant nearly pulls Tiggak's arm
    across.
  category: action
  evidence_refs:
  - ev:7
