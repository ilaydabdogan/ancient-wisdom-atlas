  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The tupilak turns against its maker, emerges beneath his kayak near the fishing-place,
    upsets it, devours him, flees to the ocean, and Kujavarsuk remains unmolested
    until old age.
  category: sequence
  evidence_refs:
  - ev:5
