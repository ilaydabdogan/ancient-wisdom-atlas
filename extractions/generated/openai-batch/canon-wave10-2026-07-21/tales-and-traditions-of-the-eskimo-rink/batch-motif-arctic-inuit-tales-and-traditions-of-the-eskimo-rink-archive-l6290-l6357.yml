canonical_text:
  quote: ''
  summary: The passage recounts Kujavarsuk’s exceptional seal hunting, the jealousy
    and offense that lead a kinsman to create a shapeshifting tupilak against him,
    the tupilak’s failed attacks, its defeat by Kujavarsuk’s amulet-bird, and its
    killing of its own maker. A following Kujavarsuk episode begins with his travel
    north, rivalry over detecting whales, and instruction from an old man about whale
    breathing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the sea ice breaks and an opening appears near the houses, men launch
    kayaks and hunt seals.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each of the other men catches two seals, while Kujavarsuk catches ten, causing
    jealousy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kujavarsuk’s wives reserve a piece of the back rather than briskets for his
    mother’s brother, and the kinsman is offended.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The offended kinsman gathers bones of various animals, fashions a tupilak
    able to assume animal, bird, and seal forms, animates it, and orders it to persecute
    Kujavarsuk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tupilak dives into the sea and appears to Kujavarsuk as a seal, but Kujavarsuk
    is already returning home; the same failure occurs on three days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The tupilak transforms into a toogdlik and shrieks outside the house, but
