canonical_text:
  quote: ''
  summary: An orphaned boy, Iliarsorkik, is passed among foster families and rejected,
    then taken in by a widow. During a harsh season of frozen sea, hunger, and unlit
    lamps, the widow rations her remaining food while Iliarsorkik trains and hunts.
    He catches sandpipers and later partridges in increasing numbers, and the widow
    distributes the food to the starving household, whose men regret having cast him
    off. The passage ends as he sees mist above the waters while hunting in the mountains.
  language: English
  quote_policy: summarized
