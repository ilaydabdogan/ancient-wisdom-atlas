canonical_text:
  quote: ''
  summary: The passage introduces Igimarasugsuk as a man who secretly kills and eats
    his wives and children. After murdering his wife's younger brother and forcing
    her to prepare the body, he fattens his wife and confines her in a tent. She escapes
    by cutting the fastenings, drinking water, making a decoy from her jacket, and
    hiding first inside magically opened driftwood and then in a fox-hole while her
    husband follows her tracks and laments not killing her sooner.
  language: English
  quote_policy: summarized
