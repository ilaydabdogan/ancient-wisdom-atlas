canonical_text:
  quote: ''
  summary: 'The passage describes angakok practices: spirit-summoning with drum and
    skin, signs of a tornak''s arrival, answering voices, possible ritual flight through
    a roof opening, release from bonds, post-rite restrictions, dangers that can make
    conjuration fail, social and ritual functions of angakut, their special language,
    deathbed consolation, death phenomena of an angakok, and the role of religion
    and angakut in linking scattered communities.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The arrival of a tornak is said to be known by a peculiar sound and by the
    appearance of light or fire; questions and answering voices may be heard from
    outside, and the answer is often ambiguous.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the angakok must make a flight, an opening appears by itself in the roof;
    the passage says accounts differ on whether the flight is bodily or by the spirit
    alone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The house is not to be lighted again until the torninek is finished; afterward
    the angakok shows himself released from his bands, and work is forbidden in the
    house for following days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Evil spirits may exceptionally be summoned in daylight and open air, and an
    angakok may invoke his tornaks whenever he requires their assistance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Witchcraft and the presence of a woman having an anghiak can make the conjuration
    fail and can make it fatal to the conjuror and audience.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The craft includes giving supernatural counsel, discovering causes of disasters,
    denouncing people as guilty of witchcraft or rule violations, discovering the
    whereabouts and fate of missing persons, and defeating enemies including anghiaks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The craft also includes instructions about abstinence, life, travel, hunting,
    sustenance, procuring favorable weather, and procuring hunting success by conciliating
    arnarkucigsa or invoking kivingak.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: An angakok called to a hopelessly sick person of renown consoles him by solemnly
    praising the happiness of the life to come in low-keyed song with drum-playing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The angakut use a peculiar official language made chiefly of allegorical expressions
    and transformations of ordinary Greenlandish words.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'The death of an angakok is believed to involve strange phenomena: his soul
    has difficulty disengaging from the body, he may lie half-dead and revive at intervals,
    and after five days he may reappear as a ghost.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Religious traditions are described as a connecting link between scattered
    tribes, and angakut are described as connecting smaller communities.
  category: relationship
  evidence_refs:
  - ev:9
