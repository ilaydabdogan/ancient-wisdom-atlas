  text: Far from land, the father hears strange voices not belonging to his countrymen
    and then sees an immense kayak belonging to a kayariak, described as a fabulous
    kayaker.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The first kayariak has one of the son's arms lashed to the after-part of his
    kayak; the father kills him with a harpoon.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The father encounters a second kayaker carrying the son's second arm and kills
    him also.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A third, great kayaker is identified as the father of the two already killed;
    he carries the son's body behind him on his kayak.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The angakok does not throw his lance at the great kayaker but rows alongside
