canonical_text:
  quote: ''
  summary: A famed strong angakok and hunter on Umanak trains his son. When the son
    disappears at sea, the father searches southward, encounters fabulous kayakers
    carrying the son's severed parts, kills two of them, and confronts their father,
    who carries the son's body. The great kayariak revives the two killed kayakers
    and, on floating ice, joins and revives the angakok's son; the passage ends as
    a kayak is being loaned.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The action is set on the isle of Umanak in the Isortok firth of South Greenland,
    where a strong man lives among many other people.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The strong man is described as extraordinarily strong, a first-rate hunter,
    a skilled angakok, and a principal provider for the place.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The angakok takes his little son on his knee during conjuring to teach him
    the art.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the winter solstice, the angakok hunts alone on the open sea, catches
    two large seals, and fastens them on the front and back of his kayak with a harpoon-line.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At meals after returning from hunting, the angakok says he was caught in a
    heavy snowstorm from the north, although the shore weather was fine and only a
    small mist-band was seen far out at sea.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: When grown, the son also goes far out to sea in all weathers and brings home
    large seals.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the son fails to return at night, the father sets out at daybreak to
