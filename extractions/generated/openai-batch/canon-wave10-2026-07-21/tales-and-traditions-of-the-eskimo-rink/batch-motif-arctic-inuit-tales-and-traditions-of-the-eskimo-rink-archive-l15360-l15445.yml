canonical_text:
  quote: ''
  summary: In the first segment, Arnarsarsuak is admitted warily into a household,
    proves industrious, marries the brother, and gives birth to both human children
    and bear cubs. The bears are treated as children, travel with the family, are
    initially feared by settlement people, and later serve as hunters. The family
    eventually returns to the old home with companions. In the second segment, the
    younger Avatarsuak is raised by his wise grandfather, who gives moral admonitions
    and speaks strange words while launching the youth’s kayak.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Arnarsarsuak says she ran into the interior to give birth to a kingulerak
    that adhered to her body, and asks to stay with the household.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The household allows Arnarsarsuak room at the farthest end of the ledge, keeps
    a wide space from her, and cannot sleep.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sister first persuades her brother not to hunt because of concern about
    the new housemate; on a later day he hunts near enough to keep the house in sight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the brother returns with two seals, Arnarsarsuak flenses them, makes
    a fire, cooks, and sews at the same time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: As fear subsides, the brother resolves to marry Arnarsarsuak; when she becomes
    pregnant, the sister fears she may bear non-human offspring.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Arnarsarsuak gives birth to a little bear cub and a human child, nurses them
    together, and later bears another human child and another little bear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The father gives kayaks to his boys, while the bears go out for provender;
    the family later travels north, with sons in kayaks and bears swimming beside
    the boat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Near a populated place, the bears stay close to the boat and show only their
    muzzles above water; the father tells them not to be ashamed because they are
    also of human extraction.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: People at the settlement run for weapons when they see the two large bears,
    but stop when the father says the bears are his children.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The newcomers winter at the settlement, the sons marry there, and the bears
    hunt when the men cannot go out; afterward the family returns to the old home
    with several companions.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The older Avatarsuak is described as a wise man who takes charge of his younger
    namesake and admonishes him not to harm even the meanest dog or be uncivil toward
    old people.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: When pushing the youth’s kayak from the beach, the grandfather speaks strange
    words and uncovers his head; the youth listens but cannot understand the words.
  category: action
  evidence_refs:
  - ev:9
