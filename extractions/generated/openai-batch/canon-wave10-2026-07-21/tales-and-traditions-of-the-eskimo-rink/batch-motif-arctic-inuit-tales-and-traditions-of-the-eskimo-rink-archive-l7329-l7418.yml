canonical_text:
  quote: ''
  summary: During winter scarcity, Avarunguak joins a huge house-master and his party
    on a journey over mountains to a distant sea rich in white whales. Although warned
    to take only small prey, he kills a huge white whale and struggles home with it.
    Later, the huge man and his wife examine a litter of puppies and select the perfect
    seventh whelp after Avarunguak offers it to them. The huge man then tests Avarunguak’s
    capacity by making him lick oil from lamps before allowing him to join a visit
    to enemies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Avarunguak catches plenty at the beginning of winter, but hunting ceases when
    the sea freezes; the big man has no kayak of his own.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The master of the house says that there is good hunting behind their country
    and that the household intends to go there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Avarunguak asks to accompany the party and says he can run a race with any
    quadruped; the man is reluctant but eventually consents.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The travelers carry sealskin cords around their necks, cross neighboring mountains,
    and are told of a sea behind distant lofty mountains where white whales are abundant.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The leader tells Avarunguak to aim only at small white whales because he will
    not be expert enough to bring home a larger one.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The daughters help Avarunguak along by his arms because he cannot keep up
    with the party.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At a cleft in the ice, Avarunguak sees a huge white whale rise, kills it,
    and is scolded for disobeying the leader’s instruction.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The other hunters each bring up two fish and propose tying Avarunguak’s fish
    to theirs and dragging him home on top of it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Avarunguak refuses to have others carry his game and insists he will bring
    home the fish he caught himself.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The party disappears from Avarunguak’s sight very quickly; he takes until
    the fourth day to get home and eats all the matak of his dolphin or whale on the
    way.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Avarunguak’s relatives are anxious and think his companion may have killed
    him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: A dog belonging to Avarunguak’s people gives birth; the huge man and his wife
    examine the joints of each newborn whelp.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The seventh and last whelp is declared perfect, with no limb wanting; Avarunguak
    offers them a dog, and they choose the last-born.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:14
  text: The chosen dog sleeps beside the huge man and his wife, and Avarunguak becomes
    a favorite among the other housefellows.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: The huge man says they will visit their enemies, first refuses Avarunguak
    because of appetite, clumsiness, and lack of speed, then tests him by making him
    lick oil from all the lamps.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: After Avarunguak succeeds in the lamp-oil test, the leader allows him to accompany
    the party and gives instructions about licking oil and cutting into a large white
    fish during the enemy visit.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
