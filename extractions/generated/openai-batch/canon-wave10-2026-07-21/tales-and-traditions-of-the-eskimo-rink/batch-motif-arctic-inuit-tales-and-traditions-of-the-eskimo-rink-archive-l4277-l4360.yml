canonical_text:
  quote: ''
  summary: In this passage from the Kagsagsuk tale, a hidden feat involving a driftwood
    spar leads the community to suspect an unknown strong man. Later, while Kagsagsuk
    is still mistreated by his housemates, three bears appear on an iceberg after
    the sea has frozen. Kagsagsuk borrows his foster-mother's boots, runs through
    a mocking crowd, ascends the iceberg, uses a charm for invulnerability, kills
    the bears, and turns one bear against his former tormentors. He gives two bear-skins
    to his foster-mother as she had mockingly requested, orders the flesh cooked,
    and is treated with new respect while still taking his old side-ledge place.
  language: English
  quote_policy: summarized
