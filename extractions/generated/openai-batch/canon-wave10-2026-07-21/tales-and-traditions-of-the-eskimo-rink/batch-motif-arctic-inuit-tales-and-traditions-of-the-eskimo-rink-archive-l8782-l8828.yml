canonical_text:
  quote: ''
  summary: A coast-woman living among inlanders is mocked for lack of agility, undergoes
    a painful vermin-filled boot ordeal that causes her old skin to fall away and
    new skin to grow, and becomes swift. Later she and her inlander husband visit
    her coastal relatives. The husband proves able to trap eider-ducks after being
    disparaged, is ridiculed by local men about seal-hunting, then returns to his
    own people after reporting that their son has died.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The inlanders lose one of their people and leave on the following day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In summer, preparations are made for reindeer-hunting, and the coast-woman
    is to accompany the inlanders.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two girls are hostile to the coast-woman because she married early, mock her
    as less nimble than the inlanders, and one claims to have overtaken a young deer.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old woman fills a pair of boots with vermin, orders the coast-woman to
    wear them, and tightens them around her legs while the husband encourages endurance
    for agility.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The coast-woman swoons; the skin drops from her feet and legs; when she revives,
    new flesh and skin are growing, and she has become swift and nimble.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the reindeer-hunt, the woman longs to see her relatives, and the next
    summer her husband accompanies her toward the coast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Near the coast, they hail a kayaker for a boat; once aboard, the inlander
    is very afraid and lies face down until landing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: During a winter stay with the woman’s parents, her father says he wishes for
    a son-in-law who can trap eider-ducks; the inlander asks for a trap and later
    returns covered with ducks.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Other local men ridicule the inlander in winter and try to persuade him to
    join them on the ice for seal-hunting by breathing-holes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: In summer, the inlander goes to visit his countrymen, returns the next spring
    reporting that their son has died, then leaves for his own people and is not seen
    again.
  category: sequence
  evidence_refs:
  - ev:8
