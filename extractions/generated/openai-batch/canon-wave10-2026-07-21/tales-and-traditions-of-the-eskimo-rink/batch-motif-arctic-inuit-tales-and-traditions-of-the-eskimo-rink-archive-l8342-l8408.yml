canonical_text:
  quote: ''
  summary: Two brothers live alone at a fiord. They encounter a woman by the shore;
    she flees from the elder but accepts the younger. She vanishes from their kayaks,
    reappears at their tent, stays with them, works in the household, bears a son,
    and later asks that the child visit her brothers. The group prepares and begins
    a cross-country journey, with the woman and child moving ahead of the brothers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two brothers live alone at a fiord and do their own cooking and garment-making
    because they have no female assistance.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:2
  text: While kayaking, the brothers see a woman standing on a beach near a small
    rocky point.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: The elder brother goes ashore to fetch the woman, but she flees and increases
    her speed when he runs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The younger brother approaches the woman, and she remains still and allows
    him to take her down to the kayaks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman says she fled from the elder brother because she perceived his intention
    as bad, while the younger brother had a better disposition.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the brothers stop watching the woman briefly during the return by kayak,
    they hear a clattering noise and find that she has disappeared without trace.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The brothers conclude that the woman may not have been a real woman, and the
    passage explains this as a Kivigtox with supernatural swiftness.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The woman is later found outside the brothers' tent mending their boots and
    says she does not want to leave them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the woman stays, the brothers can devote more time to hunting because
    she cooks and sews, and they become more prosperous.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The woman bears a male child and afterward becomes restrained and silent.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The woman explains that she wants the baby boy to visit his mother's brothers
    and that longing for those relatives has made her silent.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The group prepares boots, soles, and necessities, then begins crossing the
    country; the woman carries the child in her hood, goes ahead of the others, and
    recognizes mountain-hills near her old home region.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
