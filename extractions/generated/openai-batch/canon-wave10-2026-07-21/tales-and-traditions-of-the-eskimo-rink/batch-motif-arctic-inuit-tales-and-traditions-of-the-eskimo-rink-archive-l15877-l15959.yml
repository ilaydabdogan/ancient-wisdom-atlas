canonical_text:
  quote: ''
  summary: 'The passage concludes Isigarsigak’s life: he reaches home safely, outlives
    successive generations, delights descendants with songs and bird-calls at a favorite
    gull cliff, becomes childlike in extreme old age, and dies. It then tells of Atalianguak,
    a seal-hunter who marries a mysterious little woman; after her non-human nature
    is suggested by smell and revealed by a fox-tail, he follows her to a fox-hole
    or cave, is sung to sleep by insects and reptiles until spring, wakes, makes urine
    that becomes a river, and gives up women.'
  language: English
  quote_policy: summarized
