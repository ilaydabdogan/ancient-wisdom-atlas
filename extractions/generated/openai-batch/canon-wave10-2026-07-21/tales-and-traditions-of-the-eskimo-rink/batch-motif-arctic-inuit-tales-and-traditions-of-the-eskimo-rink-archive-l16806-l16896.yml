canonical_text:
  quote: ''
  summary: 'The passage gives brief tale summaries: Singajuk’s weakly born descendant
    Mangilak becomes powerful, learns a calm-making spell from a gull, and receives
    angakok wisdom from his dead wife; an angakok in the tale of The Cousins invokes
    spirit helpers and destroys a house by fire; Manik abducts women for a boat crew,
    travels north, encounters a ghost and magic feasting, and returns; kayakers lost
    in fog visit the land of the isarukitsok bird and escape monstrous gulls; Kakortuliak
    has a supernatural hunting encounter involving ravens with human features, disappearing
    tallow, aerial transport, and a senseless return home.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Singajuk is described as a celebrated hunter, and his wife miscarries a weak
    child, Mangilak, who is swaddled in eider-duck skin and later becomes very powerful.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mangilak kills an ingnersuak and later learns a spell for procuring calm by
    listening to the voice of a gull in a solitary spot of smooth water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mangilak visits his deceased wife’s grave, speaks with her, and receives from
    her a mussel-shell containing a drink that gives angakok wisdom.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage traces Mangilak’s descendants to the storyteller and states that
    Mangilak was baptized Moses but remained only a nominal Christian because of his
    angakok wisdom.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In The Cousins, an angakok assists the cousins, invokes the tornak toolik,
    and the toolik’s red-hot weapon destroys a house and its inhabitants by fire;
    an erkungasok later announces that it also assisted.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Manik refuses marriage until he carries away a chief hunter’s daughter, then
    abducts additional women from inhabited places until he has a boat crew of rowing
    girls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Manik winters in the far north, encounters the ghost of a deceased woman,
    finds people feasting on meats hauled from the ground by magic lays, and later
    returns the abducted women except the first, whom he keeps as wife.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two young men and an elder companion are lost kayaking in fog, reach a steep
    cliff inhabited by isarukitsoks, eat birds and fill their kayaks with them, then
    pass near monstrous gulls but reach home safely.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kakortuliak pursues a wounded reindeer into a lake, secures it with a line,
    takes tallow, then later sees two ravens with human features, loses most of the
    tallow, is lifted through the air, rubs himself with the remaining tallow, and
    returns home nearly lifeless and senseless.
  category: sequence
  evidence_refs:
  - ev:7
