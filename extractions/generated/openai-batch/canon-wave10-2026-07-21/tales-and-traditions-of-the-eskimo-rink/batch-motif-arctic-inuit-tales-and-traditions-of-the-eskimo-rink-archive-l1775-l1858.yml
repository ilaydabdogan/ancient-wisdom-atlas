canonical_text:
  quote: ''
  summary: 'The passage describes local social order and customary law: no chief has
    command over place-mates; folklore treats undue authority as usurpation; settlement
    by outsiders requires general consent. It then summarizes rules for distributing
    seal meat and blubber, access to hunting and fishing places, ownership of found
    goods, claims to wounded or jointly struck animals, and communal use of rare or
    unusual game.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person belonging to a local place was not considered a chief or endowed
    with authority to command the other place-mates.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says folklore often shows men who acquired such power as usurpers
    of undue authority, and says vanquishing or killing them was ranked as a benefit
    to the community.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person from a distance could not settle permanently at a place without the
    general consent of its inhabitants.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the winter-house season, small pieces of flesh and proportional blubber
    from every seal caught at a winter station were distributed among all inhabitants,
    or first among housemates if there was not enough for all.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says nobody was omitted from seal distribution, so the poorest
    could have food and lamp-oil as long as the usual seal catch did not fail.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Besides general distribution, a man who caught a seal invited the others to
    share a meal with him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Where population was large or seals were plentiful, sharing flesh and blubber
    could be limited to nearer houses or relatives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Beyond inhabited places, anyone could build a house and hunt or fish where
    he chose.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Even if others had established a fishing-place by making river weirs, other
    parties could use or injure those weirs without objection.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A person who picked up driftwood or goods lost at sea or on land was considered
    the rightful owner after carrying them above the high-water mark and putting stones
    on them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: If a harpooned seal escaped with the harpoon in it, the first striker lost
    the claim when the hunting-bladder detached; the seal then belonged to whoever
    found and finally killed it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: If the animal ran far away with the bladder-arrow, the first hunter also lost
    the claim; weapons attached to the animal were restored to the proper owner when
    he announced himself.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Other found goods were considered the property of the finder.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: If two hunters simultaneously hit a bird or seal, the animal was divided equally
    with the skin attached.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: If two hunters simultaneously hit a reindeer, the animal belonged to the hunter
    whose arrow reached nearest the heart, while the other hunter received part of
    the flesh.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:16
  text: Rare or unusually large game animals were treated more than ordinary species
    as common property.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:17
  text: For walrus and smaller cetaceous animals in places where they were rare, the
    killer kept only the head and tail, while the rest was given to public use.
  category: action
  evidence_refs:
  - ev:13
