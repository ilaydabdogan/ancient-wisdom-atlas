canonical_text:
  quote: they had been wintering among bears in human shape.
  summary: Avarunguak follows advice while visiting enemy hosts, flees after a meal,
    is pursued by beings who become bears, and escapes through the aid of a salmon
    amulet. His bear-like housemates warn him not to let people kill bears and are
    later revealed as bears in human shape. The passage then begins a new tale about
    a girl with many suitors, selfish parents, and a suitor who fights for her; a
    note identifies atliaruseks as rock-dwelling elves or gnomes probably identical
    with ingnexsuaks.
  language: English
  quote_policy: quoted
