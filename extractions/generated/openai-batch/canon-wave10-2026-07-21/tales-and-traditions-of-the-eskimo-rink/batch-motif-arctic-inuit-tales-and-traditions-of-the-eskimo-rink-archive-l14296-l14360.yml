canonical_text:
  quote: ''
  summary: In a crowded landing-place, Kigutikak and his brother are warned to keep
    close, but the brother is separated and taken in by another great man. Kigutikak
    stays with the captain or master, whose jealous wife is appeased with a doll.
    Kigutikak is menaced by armed Europeans and, following his master's advice, drives
    them off with a knobbed rope. On later outings he kills and conceals hostile Europeans,
    then nearly attacks his own brother before recognizing him. The brothers weep,
    compare their experiences and money, and plan to combine their wealth to acquire
    a ship; Kigutikak begins arranging materials, workers, and masts.
  language: English
  quote_policy: summarized
