canonical_text:
  quote: ''
  summary: A visiting angakok is warned by his guardian-spirit that his friend has
    served him dangerous meat. He avoids most of it, then later serves the friend
    similarly treated reindeer meat. The friend becomes raving mad and cannibalistic,
    pursues him, and repeatedly tries to lure him back. The passage ends with the
    angakok returning again despite warnings.
  language: English
  quote_policy: summarized
