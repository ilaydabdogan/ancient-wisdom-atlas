canonical_text:
  quote: ''
  summary: A Greenlandic Inuit tale passage describes an autumn attack by Kavdlunait
    on a Kaladlit household in icy conditions. Some escape through a window by sorcery,
    while others are killed. A house-master sees his wounded mother dragged across
    a frozen lake, sends two girls onto the ice toward the sea to draw the enemy out,
    and then kills the pursuing enemies with a spear before returning to find the
    household inmates dead.
