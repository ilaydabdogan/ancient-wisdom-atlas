canonical_text:
  quote: ''
  summary: An old man who watches weather from a mountain-top leads Sitliarnat and
    companions to the shore, dives into the sea, and becomes a bear. Sitliarnat's
    gull amulet enables him and two brothers to travel on an iceberg pushed by the
    bear, while a fourth companion with a raven amulet cannot return. The bear asks
    future protection and food instead of payment. After the brothers return home,
    they later prevent people from hunting the bear and feed him seals; he departs
    into the sea and Sitliarnat's descendants prosper.
  language: English
  quote_policy: summarized
