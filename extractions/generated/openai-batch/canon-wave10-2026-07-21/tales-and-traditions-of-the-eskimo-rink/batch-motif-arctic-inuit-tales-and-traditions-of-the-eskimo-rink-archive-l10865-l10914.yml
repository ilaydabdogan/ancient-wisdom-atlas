canonical_text:
  quote: ''
  summary: Two brief episodes are presented. Katauk, a skilful seal hunter, is capsized
    and near drowning when malignant ingnersuit capture him, mutilate him, and bind
    him. He summons three tornaks, revives his killed erkungassok by breathing on
    him, has his severed nose returned, and later turns a remaining binding thong
    into amulets for young kayakers. Ulajok, while looking for seals, is drawn by
    a bright white kayak toward a rock that lifts to reveal houses and people inside;
    he is taken ashore and led into a large house, with the rest said to resemble
    preceding stories.
  language: English
  quote_policy: summarized
