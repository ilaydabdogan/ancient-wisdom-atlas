canonical_text:
  quote: ''
  summary: During a meal at the sister's home, the host secretly has his children
    cut the lashings of neighboring sledges. After the visiting brothers depart, the
    host shouts that the visitors are leaving; people rush to pursue them, but most
    sledges break down. One sledge follows, and the brother-in-law kills its driver
    and others, then returns with human limbs. The brothers reach home and report
    that their sister had become a cannibal and that they escaped through their brother-in-law's
    help.
  language: English
  quote_policy: summarized
