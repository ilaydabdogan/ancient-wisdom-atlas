canonical_text:
  quote: ''
  summary: A man repeatedly tries to visit his friend despite attempts to detain him.
    The friend is found in a worsening, unnatural condition, pursues him while saying
    he is starving and wants him for food, and later walks on the water toward his
    kayak. The visitor escapes by rocking the kayak to make ripples. On a final visit
    he follows footprints to a cave, finds the friend dead, seals the cave entrance,
    and is left friendless.
  language: English
  quote_policy: summarized
