canonical_text:
  quote: ''
  summary: Aterfio and his son Akeralik are far from shore in kayaks after catching
    seals when Aterfio sees a cloud and urges a return. A gale overtakes them, but
    they avoid the sea by holding their breath and rowing underwater. Akeralik then
    speeds away across the surface like a falcon, and both reach home. Southlanders
    hear of Aterfio’s strength and Akeralik’s speed, and the strong man Tajarnek comes
    with others to challenge them. Aterfio invites the visitors to land and rest,
    then a contest takes place on level ground. Tajarnek and others are thrown; Akeralik
    joins in, and eventually Tajarnek and all the Southlanders, including women and
    children, are killed. After this, Aterfio roams the coast; father and son remain
    renowned and die unwounded.
  language: English
  quote_policy: summarized
