canonical_text:
  quote: ''
  summary: Two grown brothers learn from their mother that they have a sister married
    far to the south beyond high mountains, among cannibals, and identifiable by white
    hair on one side of her head. Despite warnings, they travel to find her, locate
    houses by observing ravens, approach at night, recognize her through a roof vent,
    and are admitted by her armed husband. Inside, they are offered berries and blubber
    containing a severed human hand; they refuse while the sister and her children
    eat it. The sister says her husband made her a cannibal, and he orders separate
    food for the guests.
  language: English
  quote_policy: summarized
