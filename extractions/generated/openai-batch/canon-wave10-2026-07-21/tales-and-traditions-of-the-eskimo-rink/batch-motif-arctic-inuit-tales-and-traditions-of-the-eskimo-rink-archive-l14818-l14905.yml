canonical_text:
  quote: ''
  summary: A South Greenland story tells of Niumak and Kujapigak seeking a wife for
    their only son, choosing Savanguak, and later of Niumak finding a deserted ship
    whose cargo is partly taken and partly discarded. After Savanguak bears children,
    visiting Southlanders arrive; her younger baby dies, an old woman mocks her grief,
    and Savanguak is later found dead in a lake. Niumak tries unsuccessfully to revive
    her, and her husband Taterak returns from hunting to learn she has drowned herself.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Near Kangerdlugsuatsiak, Niumak lived with his wife Kujapigak, and both wanted
    a suitable wife for their only son.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Niumak avoided singing and dancing entertainments but paid attention to wrestling
    matches and trials of strength.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Niumak chose Savanguak as the wife of his son and became fond of her as his
    daughter-in-law.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: While out kayaking in summer, Niumak saw an approaching ship, boarded it after
    receiving no answer to his calls, and found it deserted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Niumak returned with a boat, established himself and his people on the ship,
    and found the cargo uninjured.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The people took beads from the cabin, discarded unfamiliar cargo such as peas,
    sugar, and molasses into the sea, tore down the sails for tent covers, and gave
    the finest beads to Savanguak.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After Savanguak had several children, Southlanders were invited to stay at
    Niumak's house, and Savanguak's younger baby died at the beginning of winter.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: An old woman from among the Southlanders mocked the bereaved Savanguak by
    holding up her own grandchild, and this made Savanguak suspicious of her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: While others were occupied with reindeer-skins, Savanguak went outside; her
    tracks were followed over a hill, and she was found at the bottom of a small lake.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Others could not draw Savanguak out of the lake; Niumak arrived, drew her
    out, and tried unsuccessfully to revive her.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Taterak returned announcing that he had caught a white whale, but a servant-maid
    silently and hurriedly helped him with his kayak, making him suspect trouble.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Niumak told Taterak that his wife had drowned herself, and father and son
    deliberated about how to find the cause of her death while others whispered.
  category: sequence
  evidence_refs:
  - ev:10
