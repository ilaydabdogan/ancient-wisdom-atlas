canonical_text:
  quote: ''
  summary: The passage first concludes a pursuit narrative in which Kaisape obtains
    a spell-treated piece of wood from an Eastlander, makes it into a charmed arrow,
    and uses it after ordinary arrows fail against Ungortok. Kaisape kills Ungortok’s
    wife, later kills Ungortok with the charmed arrow, mutilates the corpse, kills
    the orphan child, and supports the old Eastlander. The passage then begins an
    account of a boat crew of Kaladlit/Greenlanders unexpectedly encountering Kavdlunak
    settlers in Greenland; the settlers treat them kindly, but the Greenlanders fear
    them and leave.
  language: English
