  quote: ''
  summary: A solitary exceptional kayaker living on K’erka is driven by a winter gale
    to Ukevik, where he overhears an adversary practicing a satirical song against
    him. He memorizes it, returns home, and later defeats the adversary in a singing
    match. In summer, southern enemies pursue him by kayak; he hides in a cave in
    a large iceberg, spears the attackers one by one, and leaves two alive to report
    what happened.
  language: English
