canonical_text:
  quote: ''
  summary: The passage classifies general religious means into spoken prayers or invocations,
    amulets, and actions or observances. It describes prayer-spells as formulae with
    tunes, possessing efficacy independent of the user, often hereditary, bartered,
    and connected with deceased kin or ancestors. Invocations are commonly addressed
    to grandparents' souls for protection against being frightened to death. The passage
    also describes amulets as material objects carried, worn, inserted in weapons,
    or acquired for special occasions, with efficacy tied to their origin, contact
    with persons or supernatural beings, resemblance, or the continuing action of
    an object's inua.
  language: English
  quote_policy: summarized
