canonical_text:
  quote: ''
  summary: Iliarsorkik and his companions identify signs of breathing-holes in the
    ice. His foster-brother prepares hunting tools for him, and Iliarsorkik finds
    an ice aperture with seals, harpoons one, and brings it home to starving people.
    He continues bringing seals. Later, while towing two large seals, a snowstorm
    and shifting wind cause him to lose his way; he finds another house with hungry
    people and offers one of his seals before returning home.
  language: English
  quote_policy: summarized
