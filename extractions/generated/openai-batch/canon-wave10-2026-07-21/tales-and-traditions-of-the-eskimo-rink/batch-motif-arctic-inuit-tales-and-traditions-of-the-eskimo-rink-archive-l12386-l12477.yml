canonical_text:
  quote: ''
  summary: An editorial note frames the tale as referring to the process of becoming
    angakok poolik. Tugtutsiak, an orphaned child, attempts spirit-conjuring, producing
    supernatural effects in the house. Later, during poor hunting, elders make him
    call a bear and a walrus, which carry him to a lower new land. He enters a dark
    house past a snarling dog and a knife-edge bridge, encounters a suffering female
    owner, removes filth from her face openings, arranges her hair, and witnesses
    the brightening of a lamp and the emergence of many small wall-creatures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The editorial note says the tale was included because it refers to the process
    of being angakok poolik, mentioned by older authors in connection with Greenlanders.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tugtutsiak and his sister are described as orphans living in a great house,
    while grown-ups go berry-gathering and leave the children at home.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tugtutsiak, the eldest among the children, proposes conjuring spirits, undresses,
    covers the door with his jacket, ties the sleeve openings, and begins an invocation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The other children become frightened and try to flee; floor slabs lift into
    the air and rush after them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tugtutsiak sticks fast to the floor until he makes the children return, uncover
    the door, and open the window; after light returns to the room, he can get up.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Some younger children tell the returning adults that Tugtutsiak played at
    angakok and that the floor slabs rose and followed them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: When hunting becomes bad, the adults make Tugtutsiak sit down and call forth
    a bear and a walrus, which soon roar outside the house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The bear and walrus alternately hurl Tugtutsiak between them until he loses
    sight of his homeland, reaches a lower new land, and is thrown onto a beach.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Near the beach Tugtutsiak sees a house with a terrible dog on the roof above
    the passage; the dog shows its teeth, howls, and snarls at him.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tugtutsiak sees a bridge as narrow as a knife’s edge leading into a totally
    dark inner room, and he proceeds into the house.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The female owner of the house lies on the ledge in great pain, with loose
    dishevelled hair and her face turned to the wall; she tells him he cannot remove
    what makes her suffer.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Tugtutsiak seizes the woman by the hair and throws her against the door-post,
    but his hands become entangled in her hair; she then says he may be capable of
    removing her sufferings.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Tugtutsiak finds her eyes, nostrils, and mouth stuffed with dirt and filth,
    cleans it away, throws it outside, and later arranges her hair in the usual tuft.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: After the cleaning, the woman becomes somewhat composed, takes eagles’ wings
    from a wall nail, and stirs the smoking lamp so that it burns brightly.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:15
  text: A little man with a very short nose, followed by many similar creatures and
    later other nose-varieties, emerges from the wall and exits the doorway, crying
    like auks until the woman tells them to stop.
  category: sequence
  evidence_refs:
  - ev:11
