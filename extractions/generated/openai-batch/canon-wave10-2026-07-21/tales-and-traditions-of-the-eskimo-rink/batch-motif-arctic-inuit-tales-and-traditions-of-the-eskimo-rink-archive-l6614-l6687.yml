canonical_text:
  quote: The father left him a weeping child, and now beheld him a great hunter, standing
    on a whale’s back.
  summary: Giviok escapes a hostile mother and daughter after the mother’s tail is
    broken and he kills the daughter. He then reaches another house occupied by a
    mother and daughter who use hunting bladders in low-water fishing. He helps recover
    their floating halibut after the rising tide. Later he remembers his son, travels
    back through earlier dangers, and finds his son grown into a whale-hunting man.
  language: English
  quote_policy: quoted
