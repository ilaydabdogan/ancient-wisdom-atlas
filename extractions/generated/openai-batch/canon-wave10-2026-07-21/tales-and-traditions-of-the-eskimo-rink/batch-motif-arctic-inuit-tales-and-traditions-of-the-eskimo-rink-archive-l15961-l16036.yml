canonical_text:
  quote: ''
  summary: An orphan boy, Inoosarsuk, is pressured by his foster-mother to use his
    foster-father’s kayak and is beaten by the foster-father. On a later errand he
    loses part of the kayak equipment, fears punishment, and rows out to sea. He uses
    a quannek stalk as a weather charm, travels toward Akilinek, meets cannibals and
    hospitable fish-catching women, then flees south. A giant kayaker captures him
    and brings him home as an amulet for his daughter. After the daughter nearly eats
    him by mistake, the giant covers him with a cloak and causes him to grow to giant
    size. Inoosarsuk returns intending revenge, finds his foster-parents dead beneath
    the ruins of their house, and goes back to Akilinek.
  language: English
  quote_policy: summarized
