  quote: ''
  summary: The introduction explains that inherited tales were localized as tribes
    settled in different places, with heroes made inhabitants of Greenland or particular
    districts according to narrator and audience. It also states that foreign nations
    and animals unknown in Greenland were transformed over time into supernatural
    beings imagined as inhabiting the interior land and adjacent sea. The passage
    then characterizes the tales as religion, history, and poetry, emphasizing struggle
    for existence, admiration of courage and strength, limited emphasis on property,
    and little room for love themes.
