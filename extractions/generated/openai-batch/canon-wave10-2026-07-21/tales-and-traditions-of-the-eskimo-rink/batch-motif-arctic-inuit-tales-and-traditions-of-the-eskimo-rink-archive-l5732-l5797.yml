canonical_text:
  quote: ''
  summary: Two brothers, later named as Kunuk and his brother, are adopted by an old
    couple and trained to keep strengthening themselves. They become able to hunt
    animals and even kill a bear without weapons. They travel north to a sea inlet
    where kayakers hunt under the control of a chief called the strong man, who monopolizes
    the use of weapons. The brothers see a poor old man receive only walrus entrails
    while others receive large shares. They visit him out of pity, and he offers his
    two daughters as wives; Kunuk marries the younger and his brother the elder. The
    brothers also take the strong man's hand-thrown javelin and hide it deeply in
    the ground near a spring. While they are lying in the tent, someone runs up, lifts
    the curtain, drops it, and is identified as the strong man's mother, an old gossip.
  language: English
  quote_policy: summarized
