canonical_text:
  quote: ''
  summary: During winter scarcity, a blind young man kills a bear with his sister's
    help, but his mother withholds the meat and tries to starve him while the sister
    secretly feeds him. In spring, the siblings go out together. While he lies on
    a plain beside a lake, wild geese notice his blindness, apply their excrement
    to his eyes, instruct him to keep them shut until their wings are no longer heard,
    and his sight is restored. He tells his sister, who verifies the healing, and
    they agree to hide it from their mother.
  language: English
  quote_policy: summarized
