canonical_text:
  quote: ''
  summary: Avarunguak, a solitary stranger who marries into a household and becomes
    a hunter, is enticed by reports of abundant southern game. On the voyage south
    he ignores warnings to avoid a large tent and stays with a huge man. The huge
    man gives hunting instructions for catching auks, which Avarunguak partly disobeys,
    and later the huge man and his family take walruses that Avarunguak has hunted.
    The passage ends during a proposal that both households live together in one house
    with windows counted by persons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a well-peopled place, pinching was a favored amusement, and a girl who
    was the only sister of several brothers reported that someone was pursuing and
    courting her.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl's household advised her to bring the pursuer into the house; the
    man was unknown to them and was named Avarunguak.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Avarunguak had grown up in solitary places, married the girl, learned to manage
    a kayak, and became an excellent hunter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: An old woman among visitors from the south spoke of good hunting and many
    auks there; after hearing this, Avarunguak could not sleep and ordered preparations
    for a southward voyage the next morning.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: During the voyage, the travelers asked people whether the destination was
    far away and received route directions that included a very large tent to shun,
    a little white point, and many people beyond it whom they should approach.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Avarunguak steered toward the large tent despite his companions' advice, and
    a huge man came out, received them civilly, and invited them to stay and winter
    with him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each morning Avarunguak woke early, but the huge housemate was already out
    before him; on a lookout hill the huge man told him that the time of the auks
    would soon come.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the auks came, the huge man instructed Avarunguak to close the tent curtain
    so only one bird could enter at a time and not to begin catching them until the
    tent was full.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Avarunguak began catching the auks too soon; the birds left, and the huge
    man scolded him, though Avarunguak still had many birds for food.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The huge man said the red walrus was ferocious and that he did not venture
    out when those animals appeared.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Avarunguak lanced his first walrus; the huge man came to the beach, took half
    of it with one hand, carried it to his own tent, and ate it by himself while his
    wife and daughter looked on.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: On later walrus hunts, the huge man's wife and then his three daughters carried
    off Avarunguak's prizes in turn until each had received a walrus.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The huge man proposed that the two groups live together in his house and noted
    that his five-person household had five windows; Avarunguak answered that travelers
    with one boat used only two or three windows regardless of number.
  category: speech
  evidence_refs:
  - ev:11
