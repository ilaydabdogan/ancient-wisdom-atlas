  quote: ''
  summary: An old man kayaks toward a group of enemies or hunters. When a wounded
    seal surfaces before him, he pierces it with his large arrows, returns another
    hunter’s arrow contemptuously, lifts the seal onto his kayak with one hand, and
    leaves the others amazed. They never attack him afterward, and he dies peacefully.
