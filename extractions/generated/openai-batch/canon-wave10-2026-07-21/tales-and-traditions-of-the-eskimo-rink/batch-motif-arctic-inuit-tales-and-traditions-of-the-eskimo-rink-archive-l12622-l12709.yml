canonical_text:
  quote: ''
  summary: Two old kayakers set out despite danger, approach a giant-like manslayer
    while keeping in the sunlight, use charms, and kill him with coordinated weapons
    after an initial missed harpoon. They tow his body to shore and meet his daughter,
    who acknowledges the revenge but invites them to her house. Fearing her strength,
    they depart; she follows, exposes herself at the water-edge, then prepares a boat
    and angrily threatens to kill them while crushing wood. The men return home and
    report that they have avenged their sons.
  language: English
  quote_policy: summarized
