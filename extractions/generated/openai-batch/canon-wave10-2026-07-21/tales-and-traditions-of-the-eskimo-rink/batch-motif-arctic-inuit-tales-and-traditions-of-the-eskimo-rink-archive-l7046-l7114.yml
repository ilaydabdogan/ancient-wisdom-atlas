canonical_text:
  quote: ''
  summary: Malaise hears of Akilinek as a better hunting country, prepares a women’s
    boat with three coverings, and sets out westward with his wife and sisters. After
    a sea crossing, they reach a bay where the sisters recognize former husbands approaching
    to attack. Malaise uses water mixed with dust and hairs from reindeer-skin stockings
    taken from a relative’s grave; those who drink are transformed into reindeer and
    killed. He spares one adversary, later loads the boat with valuables, and returns
    home.
  language: English
  quote_policy: summarized
