canonical_text:
  quote: ''
  summary: Uvikiak travels north with his family. His son, who usually kayaks ahead
    to wait ashore, is found murdered and mutilated. Uvikiak follows reports of a
    boat crew singing about the killing, reaches the murderers’ dwelling-place, conceals
    his boat and wife, and goes with his daughters to investigate. After hearing a
    song about the slain son and questioning two young men, Uvikiak and his daughters
    kill the two and arrange their bodies like the son’s body, then escape and return
    south.
  language: English
  quote_policy: summarized
