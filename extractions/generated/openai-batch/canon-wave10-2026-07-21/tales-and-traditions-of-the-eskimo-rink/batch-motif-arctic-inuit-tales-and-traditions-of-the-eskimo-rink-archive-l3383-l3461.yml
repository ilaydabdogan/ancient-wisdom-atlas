  summary: The passage presents the author's conjecture that the coastal people originated
    from North American riverine hunting groups who moved toward the polar sea, adopted
    marine hunting, and became sharply separated from hostile inland tribes. It then
    lists tale subjects involving inlanders, metal knives, mixed descent, cannibal
    marriage, survivor children, women moving between groups, animal-assisted frozen-sea
    travel, and journeys to Akilinek, and argues that these subjects suggest an American
    rather than Asian setting.
