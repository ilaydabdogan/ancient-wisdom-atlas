canonical_text:
  quote: ''
  summary: An English prose section discusses the probable origin and history of the
    Eskimo/Inuit, weighing Asiatic and American affinities, noting language and religious
    comparisons, proposing possible early intercontinental contact, and summarizing
    Icelandic saga notices of encounters, conflict, barter, baptism, and Greenlandic
    settlement boundaries.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage mentions an opposite shore perhaps identical with the fabulous
    country of Akilinek, and says an interior-Asia-to-polar-shore-to-America migration
    theory has very little probability.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Eskimo physical complexion seems to point to an Asiatic
    origin, while recent investigations also indicate a transitional link with other
    American nations and the possibility of common origin on the same continent.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says Eskimo mode of life resembles American neighbours, while
    northern Old World peoples are mostly pastoral, with the coastal Asiatic Eskimo
    called Tschoukschees noted as an exception in friendly relation with pastoral
    Tschoukschees.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says Eskimo religion is allied to Americans and differs from Asiatic
    nations described as having deities, idols, and sacrifices as principal rites.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says the Eskimo language appears akin to American nations through
    its polysynthetic structure, but also has similarities with Siberian Altaic or
    Finnish-group languages in suffixing and dual/plural formation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that the origin of the Eskimo people remains obscure and
    that early intercourse and mutual influence between northernmost peoples of the
    two continents may have existed.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says Eskimo numbers likely increased in early periods and that
    feuds among families or bands probably helped disperse them toward far eastern
    Greenland and Labrador.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: According to the passage's account of Icelandic sagas, Eskimo were met on
    east Greenland and in Vinland around the year 1000; Thorvald was killed in a fight,
    while later travellers bartered with the same natives and brought back two young
    Eskimo who were baptized and reported parental names.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage says that between 1000 and 1300 the Eskimo did not seem to occupy
    west Greenland south of 65° N.L.; Scandinavian colonists knew of them farther
    north, feared attack, and sent a 1266 expedition to explore the abodes of the
    Skrcelings.
  category: sequence
  evidence_refs:
  - ev:9
