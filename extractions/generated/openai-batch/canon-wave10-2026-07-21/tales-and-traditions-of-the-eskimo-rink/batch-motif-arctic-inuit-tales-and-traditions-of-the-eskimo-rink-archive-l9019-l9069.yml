canonical_text:
  quote: ''
  summary: A woman finds her lost brother Asuvina at another settlement. He hides
    her from a clairvoyant fool who dreams of her arrival. She later goes disguised
    to a ball-play, heals the chief after his feet are crushed by a round stone, marries,
    bears a son, and follows a local custom of swallowing fox entrails to benefit
    the newborn child.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People call out that a kayaker is coming towing a seal, and they identify
    him as Asuvina; the woman concludes she has found her lost brother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The settlement has a chief whose tent is larger than the others, and beyond
    it is a plain used for ball-playing.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman's brother is ordered to lift a large round stone; when he cannot
    do it, others throw him down.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Asuvina tells the woman that he lost his way while seeking a slab for her
    fox-trap, and that he is now married.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Asuvina warns that an idiot or fool at the place has clairvoyant knowledge
    and may soon know of her arrival; he advises her to hide behind wall skin-hangings.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The fool says he dreamt that a woman from the coast-side, sister to Asuvina,
    had come among them; Asuvina denies having a sister.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The woman goes to the ball-play disguised in the clothes of her sister-in-law.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The chief lifts the round stone, makes a false hit, and lets it fall on his
    own feet, crushing them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Alekatokak asks for a little dog; when none is available, she brings a young
    deer, cuts it open, and cures the chief by placing his sore feet among its entrails.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After Alekatokak marries and bears a son, she is given fox entrails in an
    oblong dish and ordered to swallow them with closed eyes as a custom intended
    to make the newborn clever and dexterous; she recovers health, and the boy becomes
    a swift runner.
  category: sequence
  evidence_refs:
  - ev:7
