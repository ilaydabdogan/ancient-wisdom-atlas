  quote: ''
  summary: At the summit of a steep mountain-side, the kivigtok loosens cords from
    a stone. A cry follows, and the Kavdlunait are swallowed by the sea, with none
    escaping. Later an old woman dies of old age. Pisagsak longs for home, receives
    from his master a warning message for the Kavdlunait not to attack him, returns
    to his relatives, delivers the message, and remains home thereafter.
