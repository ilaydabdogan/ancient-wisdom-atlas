canonical_text:
  quote: ''
  summary: Two brothers live on opposite sides of a fiord. A servant of the younger
    brother sees a glittering supernatural boat approach, is unable to move or speak,
    and watches armed strangers attack a tent. She later finds the inmates killed
    and reports to the brother on the opposite shore. After suspicion and inspection,
    the surviving brother asks an angakok to locate the attackers. The angakok sees
    them far inland after the lamps are put out. The surviving brother travels by
    kayak and on foot into the interior, finds a house, and is received by a one-eyed
    man and strange big-bellied women who bring meat. The passage breaks off as the
    host says he will help the visitor.
  language: English
  quote_policy: summarized
