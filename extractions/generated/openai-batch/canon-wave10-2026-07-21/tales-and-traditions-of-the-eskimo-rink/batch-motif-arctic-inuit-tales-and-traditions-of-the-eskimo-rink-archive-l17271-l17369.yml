canonical_text:
  quote: ''
  summary: 'A sequence of short Greenlandic Inuit tale summaries: a man dies from
    overwhelming joy at seeing the sunrise at home; an angakok descends to the sea-bottom
    old woman to secure seal hunting; Saugak is forced to eat in a vast house; two
    youths encounter a rotating bloody mountain; Isigarsigak and his sister flee,
    and he is healed by an old woman before reaching a low sky with holes and a sea
    beyond; Arnasugaussak and her daughter flee inland and undergo encounters ending
    in petrification; cousins contend with a man-killing dog; and an abandoned sick
    child is visited by dead parents from the graves.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man from Greenland's east coast loves his home and enjoys watching the sun
    rise from the ocean; after travelling west with his son, he returns home and dies
    after again seeing the sunrise.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An angakok performs a conjuration for good seal hunting and goes down to the
    old woman at the bottom of the sea, where she displays bloody clothes and a crying
    baby before being propitiated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Saugak quarrels with his brother, flees, reaches an extremely long house,
    and is forced by the master to continue eating until dried human flesh is served.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: At a wintering place men disappear; two youths find a continually turning
    bloody mountain, one dies on the bloody path, and the other climbs safely when
    the bloody side turns away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The surviving youth reaches a house on the mountain summit, assists a man
    who hunts eider-ducks in a lake, and returns home safely.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Isigarsigak and his sister flee from home because of their mother's angakok
    tricks and travel south for three years.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Isigarsigak's stomach swells; two ravens that look like women catch seals
    and lead him inland to a house where an old woman cures him by cutting open his
    stomach and removing forgotten hunting bladders.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A knife-armed woman appears at the entrance, and Isigarsigak is warned that
    she killed the men of the house; he escapes back to his sister.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Isigarsigak later follows the autumn passage of birds by kayak until the sky
    is low enough to touch with his paddle, and he sees two large holes with a sea
    beyond them before turning back.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Arnasugaussak breaks her mother's precious needle, is scolded, flees inland
    with her daughter, lives among people transformed into partridges and others changed
    into reindeer, and finally she and her daughter are converted into stones near
    men flensing a whale.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Two cousins love each other, but one becomes jealous of the other's marriage,
    son, and hunting success; the jealous cousin's son trains a dog to tear men apart
    by feeding it food that touched human bones.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The dangerous dog devours travellers until the other cousin and his son attack
    and kill it together.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A despised widow dies, leaving her sick child Kongajuk alone; the child hears
    grave bones rattling, and the dead mother enters with another child, followed
    by the father.
  category: sequence
  evidence_refs:
  - ev:9
