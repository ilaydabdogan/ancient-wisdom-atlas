canonical_text:
  quote: ''
  summary: An old bachelor who usually avoids singing hears a singing boat crew whose
    vessel moves against wind, rises into the air, and advances without rowing. He
    follows them after his kayak is tied to their boat, travels through the air, visits
    their house, and learns their magic song. On returning home with food, he stops
    on a steep mountain, forgets the song, nearly falls, remembers it just before
    hitting the stones below, and flies safely home, where his household recognizes
    him descending from above.
  language: English
  quote_policy: summarized
