canonical_text:
  quote: ''
  summary: The passage describes Greenlandic Inuit household organization, including
    adoption of dependents, domestic hierarchy, marriage and divorce rules, providers
    and household heads, inheritance of boat and tent as obligations, foster-care
    arrangements, shared houses occupied by several families, and place-fellows living
    in the same hamlet or wintering place.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Brothers or sisters without providers and widows of brothers could be adopted
    by a family as circumstances required.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a mother-in-law belonged to the family, the daughter-in-law or wife of
    the master of the house was subordinate to her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that a husband had the right to punish his wife by striking
    her face enough to leave visible traces, while children and servants were not
    subjected to corporal punishment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: If a man had two wives, the later wife was considered a concubine and succeeded
    the first wife if the first died; in divorce cases, the son followed the mother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Families generally had more than one provider, and widows or unmarried women
    with children were usually provided for by housemates or kindred rather than maintaining
    separate households.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Younger sons could leave home and establish separate households after acquiring
    a boat and tent.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The owner of a boat or tent was considered the chief or head of the family
    and was called the igtuat of the others.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: The author compares Point Barrow chiefs called Oomeliks with Greenlandic umialik,
    glossed as owner of a boat.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: When a man died, the oldest son inherited the boat and tent together with
    provider duties; if no grown son existed, the nearest relative took his place
    and adopted the children as foster-children.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Inheritance is described as a matter of obligations and burdens rather than
    personal gain, partly because boat and tent required annual repair and new skins.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:11
  text: Even when families were divided by distant winter-quarters, kinship ties were
    respected when mutual assistance was required.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:12
  text: Housemates were multiple families who agreed to inhabit the same house, while
    each family mainly maintained its own household.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:13
  text: In the shared house, each married couple with children had its own room on
    the main ledge with a lamp before it; unmarried people and guests slept on window
    and side ledges.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:14
  text: The shared house was built and repaired by joint labor and is described as
    having no clear owner, or an owner with burdens and obligations but no real possessory
    rights.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:15
  text: Among heads of several families in a shared house, one was generally more
    esteemed by the housemates, though not as much as an igtuat was respected within
    a family.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:16
  text: Place-fellows are defined as inhabitants of the same hamlet or wintering place,
    where a single house was exceptional.
  category: setting
  evidence_refs:
  - ev:5
