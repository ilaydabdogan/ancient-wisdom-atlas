canonical_text:
  quote: ''
  summary: The passage first recounts Akamalik being led by a woman through a bright
    otherworld where he sees dead people, ascends steps, crosses an abyss with fires,
    hears the Saviour preach, is reproached for his sins, returns to his body, repents,
    and is baptized. It then gives fragmentary tales of Sangiak, miraculously born
    after a worm enters his mother, becoming an extraordinary seal-hunter, killing
    a rival, and escaping in a damaged kayak; and of Atlunguak, a mocked poor hunter
    who undertakes dangerous feats and kills fabulous animals.
  language: English
  quote_policy: summarized
