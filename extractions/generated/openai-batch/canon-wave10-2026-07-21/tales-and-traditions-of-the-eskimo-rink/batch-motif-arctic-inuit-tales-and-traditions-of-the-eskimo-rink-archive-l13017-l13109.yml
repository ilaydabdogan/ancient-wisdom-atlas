canonical_text:
  quote: ''
  summary: After finding their mother’s tomb disturbed, brothers hide and see an old
    neighbour at the grave. They accuse and kill him, and the eldest brother takes
    the old man’s daughter as wife. The daughter later kills the husband, flees with
    her household by boat to another shore, and the remaining brothers fail in pursuit
    and settle elsewhere.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The brothers discover that their mother’s tomb has been disturbed and hide
    near it after concealing their kayaks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At daylight they see a kayaker, recognized as their old neighbour, go to the
    grave and rummage there.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The brothers identify the old neighbour as the offender and say they will
    kill him the next day.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The eldest brother confronts the old man in his tent; the old man denies being
    able to have done it, and the eldest brother kills him outside the tent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After killing the old man, the eldest brother takes the old man’s eldest daughter
    home as his wife and says her father will recompense him through her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The younger brothers are assigned to watch the woman so that she does not
    escape; she remains unwilling and stays sitting until dawn.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The husband habitually places his knife in front of the lamp at night; while
    all sleep, the woman takes the knife after fastening her boots.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The woman thinks of her father’s death, stabs her husband in the chest, and
    leaves without drawing the knife back.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The woman tells her mother to pack quickly because she has killed the eldest
    brother; the boat is loaded that night and the group leaves.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The woman advises the steersman to steer out to sea because she fears pursuers
    may search north and south along the coast.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the boat turns away from land, a foremost woman-rower breaks oars one
    after another until only one oar remains, while the steersman uses a kayak-paddle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A mother in the boat tells her son, the steersman, that land will soon be
    visible and instructs him to steer toward the sun and then southward along the
    coast.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The fugitives see a great looming land, land near a house, and enter after
    being invited by inhabitants described as one man and otherwise women.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: The murdered man’s brothers find him stabbed and bloody, find the neighbours’
    house empty, and pursue north and then south without success.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The following summer the brothers cross the sea toward Akilinek, go north
    instead of south after reaching the other side, abandon the chase, and settle
    there.
  category: sequence
  evidence_refs:
  - ev:9
