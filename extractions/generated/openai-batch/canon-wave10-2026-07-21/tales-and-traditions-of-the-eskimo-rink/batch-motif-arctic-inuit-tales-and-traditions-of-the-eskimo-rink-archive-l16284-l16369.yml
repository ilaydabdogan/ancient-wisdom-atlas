  label: Swallowed combatant kills animal from inside and emerges injured
  taxonomy_refs:
  - death_rebirth
  - return
  basis: Nakasungnak is swallowed by the bear, the bear dies with his knife protruding
    between its ribs, and he emerges through the widened hole with severe bodily damage.
  evidence_refs:
