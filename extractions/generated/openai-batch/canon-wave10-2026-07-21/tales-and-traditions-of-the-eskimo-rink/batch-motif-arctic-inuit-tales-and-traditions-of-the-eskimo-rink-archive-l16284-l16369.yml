canonical_text:
  quote: ''
  summary: 'The passage contains three short narrative units: Nakasungnak disregards
    repeated warnings in the far north, survives being swallowed by an ice-covered
    bear but later dies when giant gnats strip him to a skeleton; an unborn or miscarried
    child becomes an anghiak, uses bone objects as boat gear, kills its maternal uncles,
    and dies when its mother confesses; Kanak flees mankind, is lifted along the way
    of the dead to the moon spirit’s house, is healed by the moon-man, and is shown
    another route toward earth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nakasungnak travels far north and settles with people who use boats but not
    kayaks; he is described as presumptuous and obstinate.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The northern people warn Nakasungnak that an ice-covered bear is dangerous
    and impracticable for ordinary men to kill.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nakasungnak ignores the warning, attacks the bear with only a knife, and disappears
    into its open mouth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bear falls dead; a knife is seen between its ribs; Nakasungnak emerges
    from an enlarged hole with hair and face skin gone and runs shivering to the house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The bear’s flesh feeds the people for much of the winter.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Nakasungnak is advised how to catch speaking birds and small fishes with both
    eyes on one side, but he disregards the advice and catches none.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The people warn that gnats as large as sea-fowls, with arrow-point-like stings,
    are approaching in cloud-like swarms.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: When the giant gnats arrive, the people close themselves inside tents; Nakasungnak
    remains outside and is later found as a skeleton beneath a boat.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A group of brothers has a single sister and will not allow her to marry.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The sister becomes pregnant, secretly has a miscarriage because of her brothers’
    reproaches, and the child gains intellect and becomes an anghiak.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The anghiak uses a dog’s skull as a kayak and a man’s arm bone as a paddle.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: At night the anghiak enters the house and suckles at its mother’s breasts;
    by day it pursues the brothers while they kayak, capsizing and killing them one
    by one.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: After taking revenge, the anghiak repents, flees north, enters a house where
    conjuration is taking place, and is detected by an angakok’s second sight.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: When people in the conjuration house obtain a light and look for the anghiak,
    they are frightened to death; the anghiak becomes more powerful and returns to
    its mother’s dwelling, hiding in rubbish.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: A local angakok performs conjuration to discover the cause of the brothers’
    destruction; when the sister confesses that what she bore was not a real child,
    the anghiak develops head pain, loses its senses, and dies.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The passage introduces several stories about people travelling to the moon.
  category: other
  evidence_refs:
  - ev:16
- id: obs:17
  text: Kanak flees mankind, is lifted from the ground, follows the way of the dead,
    loses consciousness, and wakes before the house of the moon spirit or owner.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:18
  text: The moon-man helps Kanak enter a dangerous house entrance guarded by a terrible
    dog.
  category: action
  evidence_refs:
  - ev:18
- id: obs:19
  text: The moon-man breathes on Kanak to relieve pain in his limbs and restore his
    health.
  category: action
  evidence_refs:
  - ev:19
- id: obs:20
  text: The moon-man tells Kanak that no one returned by the way he came, opens a
    door, and points out a hole in the floor from which Kanak can see the earth and
    human dwellings.
  category: speech
  evidence_refs:
  - ev:20
- id: obs:21
  text: Kanak is served food by a woman whose back is like that of a skeleton, and
    he becomes afraid on seeing her.
  category: sequence
  evidence_refs:
  - ev:21
