canonical_text:
  quote: ''
  summary: The passage introduces Kagsuk of the Karsit islands and his son, both described
    as strong and feared. After a quarrel between the son and his wife, her brothers
    attack him with a knife, but his wounds heal when he rubs them, and he knocks
    them down. He later flees to his father. Kagsuk insists on immediate revenge,
    and father and son kill the people of Satok, sparing only a boy and a girl. Kagsuk
    becomes more feared, and he and his son adopt a suspicious routine of not going
    out together except in very bad weather. Two Amerdlok kayakers lose their way
    in a snowstorm and arrive at Kagsuk’s house, where he receives them and later
    speaks of his son’s kayak and return with a walrus; the son appears at the entrance
    with his bow bent.
  language: English
  quote_policy: summarized
