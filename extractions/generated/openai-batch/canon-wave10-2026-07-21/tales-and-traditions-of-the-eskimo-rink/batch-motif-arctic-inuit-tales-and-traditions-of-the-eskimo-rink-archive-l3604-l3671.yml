canonical_text:
  quote: ''
  summary: The passage discusses European influence in Greenland, including intermarriage,
    the weakening of native authority and the angakut, the survival of language and
    folklore as national treasures, and the reinterpretation of older spirit beliefs
    through Christian categories. It states that Tornarsuk was converted into the
    devil by missionaries, that inue and ingnersuit continued to be considered real,
    that Christian heaven was placed above the ancestral upper world beyond the blue
    sky, and that kayakers still believed invisible ingnersuit protected them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Europeans of the working classes intermarried with native women and formed
    households largely after the Greenland model; the mixed offspring became numerous
    and generally grew up as Greenlanders.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first Europeans were seen by natives as approaching from the sea in great
    ships with wonderful things, and the passage says the natives could hardly have
    failed to connect something supernatural with them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After settling in the country, Europeans abolished native authority, especially
    that of the angakut, and suppressed national meetings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: European religious zeal, social aims, and national prejudice led to the denunciation
    of native customs and institutions as heathenish, and European authority increasingly
    became the principal law.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage identifies language and folklore as two remaining national treasures
    through which natives maintained independence and national feeling.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Through tales, natives preserved knowledge of ancient religious opinions combined
    with the Christian faith.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tornarsuk was converted into the devil by the first missionaries, which the
    passage describes as a degradation but also as a confirmation of Tornarsuk's real
    existence.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Because Tornarsuk was partly acknowledged, the company of inue or spirits
    was also regarded as still existing.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Egede expressly charged the ingnersuit with being the devil's servants.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: When Christian heaven came into collision with the upper world of the ancestors,
    natives placed Christian heaven above the ancestral upper world, beyond the blue
    sky.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Making Tornarsuk the principle of evil changed notions of good and evil so
    that good was identified with conformity to European authority.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Greenlanders continued to believe in aid from the world of spirits; kayakers
    in hazardous work believed they were cared for by invisible ingnersuit.
  category: relationship
  evidence_refs:
  - ev:9
