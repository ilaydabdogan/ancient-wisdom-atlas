canonical_text:
  quote: ''
  summary: In a public contest, Kunuk avoids two spear throws from Ungilagtake, seizes
    the spear, exchanges positions, and kills Ungilagtake. He is then seized by Tajangiarsuk
    and wrestles him on an icy, stony field, defeating him. A stronger champion nearly
    overcomes Kunuk, but Kunuk kills him as well. A final immense, lame-legged champion
    arrives carried across three boats; Kunuk whirls and throws him so that his skull
    is crushed. The people rejoice that they will have no masters, and those whose
    wives had been taken get them back.
  language: English
