canonical_text:
  quote: "“myths of observation”"
  summary: The passage explains that Greenlandic Inuit tales transmit knowledge of
    ancestral superstitions and customs from childhood through storytelling. It states
    that recent tales contain only limited historical material, mostly family matters
    within a few generations, and that inquiries about events such as early European
    ship arrivals and the 1733-34 smallpox epidemic produced little result. It concludes
    that present tribes lack knowledge of a common original home or ancestral migrations,
    though some oldest tales may derive from true historical events.
