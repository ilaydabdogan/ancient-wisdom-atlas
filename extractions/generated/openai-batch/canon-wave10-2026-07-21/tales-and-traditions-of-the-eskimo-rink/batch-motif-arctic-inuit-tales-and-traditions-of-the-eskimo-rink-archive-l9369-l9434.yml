canonical_text:
  quote: "“my brother’s light was extinguished, but mine remained burning, and I had
    become a sun.”"
  summary: An old wife, alone while her husband is kayaking, is visited first by birds
    and then by a beautiful woman. The woman narrates that during nighttime games
    she marked an unknown suitor with soot and discovered he was her brother. She
    cut off her breasts and gave them to him, then fled while both carried lit moss.
    They were lifted into the air; his light went out, hers kept burning, and she
    became a sun going higher in the sky to bring warmth and summer. As the visitor
    leaves, the old wife sees that her back is a skeleton. An editorial note reports
    a Point Barrow version with closely corresponding wording.
  language: English
  quote_policy: quoted
