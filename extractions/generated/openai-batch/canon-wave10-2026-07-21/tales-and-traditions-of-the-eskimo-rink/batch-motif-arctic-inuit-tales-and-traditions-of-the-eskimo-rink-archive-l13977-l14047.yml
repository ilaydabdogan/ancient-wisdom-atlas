canonical_text:
  quote: ''
  summary: The passage contains the end of one tale, in which Augpilagtok’s son survives
    repeated harpoon attacks, kills his attacker, signals the killing by placing a
    seal tail-foremost on his kayak, faces the deceased man’s brothers, and witnesses
    an episode of cutting and instant healing. It then begins tale 69, where the angakok
    Ataitsiak hunts alone, summons tornaks of the ingnersuit, is capsized by a harpooned
    seal, and is rescued and reclothed by the summoned beings.
  language: English
  quote_policy: summarized
