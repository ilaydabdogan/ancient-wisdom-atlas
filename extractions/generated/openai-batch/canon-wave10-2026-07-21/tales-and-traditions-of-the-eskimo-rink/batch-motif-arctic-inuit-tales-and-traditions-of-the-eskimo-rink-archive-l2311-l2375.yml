canonical_text:
  quote: ''
  summary: The passage distinguishes secret harmful witchcraft, called kusuinek or
    iliseenek, from sanctioned supernatural aid associated with Tornarsuk. It discusses
    an obscure tradition about two men disputing death and immortality, connects unexpected
    sickness and death with witchcraft, describes witches as persecuted by angakut,
    compares that persecution with Christian settlers' persecution of angakut, notes
    the missionary reclassification of Tornarsuk as the Christian devil, and summarizes
    older reports about afterlife destinations for witches, bad people, heroes, and
    those who suffered severely.
  language: English
  quote_policy: summarized
