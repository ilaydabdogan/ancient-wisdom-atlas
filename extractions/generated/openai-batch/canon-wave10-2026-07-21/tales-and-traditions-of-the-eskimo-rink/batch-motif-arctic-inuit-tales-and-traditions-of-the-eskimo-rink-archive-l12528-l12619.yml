canonical_text:
  quote: ''
  summary: The passage tells how Kulange receives witchcraft materials taken from
    a corpse, tests them against a successful hunter and his daughter-in-law, is exposed
    by an angakok, and sees the objects sunk in the sea while the friend who supplied
    them is killed. The supplied range also begins the next tale, in which two old
    men become idle, their sons are killed by a powerful man-slayer, and the old men
    resume using kayaks and weapons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kulange has no kayak of his own and works around the fishing implements, tools,
    and arms of kayakers while roaming the country.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kulange sees his only friend opening a new grave, cutting flesh from a dead
    body, and taking a bladder.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The friend says the corpse materials are for witchcraft and instructs Kulange
    to dry the flesh and place it beneath a hunter's harpoon point to make a good
    hunter unsuccessful.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The friend instructs Kulange to dry the bladder, blow it up, and press its
    air onto a sleeping enemy.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kulange hides a bit of the corpse flesh beneath a successful house-fellow's
    harpoon point while the owner sleeps; the hunter becomes unsuccessful until Kulange
    removes the flesh and cleans the point.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: After his daughter-in-law insults him, Kulange fills the bladder with air
    during a south gale and releases the air upon her while she sleeps; she later
    swells in her side and then all over.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: The daughter-in-law's husband fetches an angakok, who performs incantations
    in a darkened room and identifies Kulange as the culprit.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: Kulange confesses and says the implements were given by his friend; the bewitching
    objects are sunk deep in the sea, and the friend is put to death.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: In the beginning of the next tale, two men live together, each with a son;
    the old men stop hunting after their sons begin providing for them.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:10
  text: The two sons do not return because they have been killed by a man of unusual
    strength known as a formidable man-slayer; the old men then have to take to their
    kayaks again.
  category: sequence
  evidence_refs:
  - ev:11
