canonical_text:
  quote: ''
  summary: The passage describes increasing contact between Kaladlit and Kavdlunait,
    including a close friendship between a Kavdlunak and a Kalalek that ends in a
    fatal archery wager on a mountain later named Pisigsarfik. An editorial note explains
    that related stories are compiled from mixed manuscripts and localized around
    different Greenland coastlands and ruins. A following tale tells of a kayaker
    who frightens Kavdlunait in a tent to death, and of Kavdlunait at Ikat fleeing
    onto thin ice, drowning, and later serving as a death omen when visible at the
    sea bottom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: News of an encounter with foreigners spreads, many boats reach Kangersunek,
    and Kaladlit and Kavdlunait begin intercourse while the foreigners start learning
    the Kaladlit language.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Kapisilik, one Kavdlunak and one Kalalek become close friends and remain
    constantly together.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The two friends try to excel each other in games and dexterity feats, and
    their arrows fall side by side because both are skilled archers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kavdlunak proposes that they climb a lofty hill, set a stretched skin
    as a target on a small islet, and throw the one who misses down the precipice.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Kalalek first refuses the wager because they are friends and neither should
    die, but the Kavdlunak persists until the Kalalek agrees and they climb the mountain
    with spectators.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The Kavdlunak shoots first and misses; the Kalalek then pierces the centre
    of the skin target.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Kavdlunak is hurled down the precipice according to his own proposed terms,
    and the mountain is thereafter called Pisigsarfik, the shooting-place.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The note says the two preceding stories are compiled from six manuscripts
    in which contents are mixed, with the same events localized for two coastal districts
