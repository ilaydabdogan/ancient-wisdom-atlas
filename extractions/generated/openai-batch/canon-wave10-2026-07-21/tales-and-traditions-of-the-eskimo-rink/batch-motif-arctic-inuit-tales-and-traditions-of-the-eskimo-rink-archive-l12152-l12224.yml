  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: A kayaker hunting thong-seals at Iminguit observes a Kavdlunait tent and hears
    people jesting and talking inside.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The kayaker leaves his kayak, strikes the tent sides, and continues after
