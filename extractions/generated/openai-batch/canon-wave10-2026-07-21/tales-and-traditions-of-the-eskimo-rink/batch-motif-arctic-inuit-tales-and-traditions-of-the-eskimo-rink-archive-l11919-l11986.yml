canonical_text:
  quote: ''
  summary: A kayaker kills a shell-gathering Kavdlunak after repeated urging and Ungortok's
    permission. Later he kills another Kavdlunak secretly. A girl drawing water sees
    a red reflection and then a crowd of Kavdlunait, who attack the house, kill the
    inmates, and pursue the two surviving brothers across the ice. Kaisape, the elder
    brother, escapes; his younger brother falls and is overtaken, and Ungortok cuts
    off the younger brother's left arm and shows it to Kaisape. Kaisape flees to his
    father-in-law, receives a kayak, and later travels to seek a magic lay against
    his enemies and then a companion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A kayaker is repeatedly asked to hit a shell-gatherer with a lance and at
    first refuses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ungortok, called the master of the place, tells the kayaker to take good aim;
    the kayaker kills the shell-gatherer with a spear, and Ungortok says the act is
    not the kayaker's fault because he did as he was bidden.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When winter comes, people generally believe the Kavdlunait will avenge the
    death, but two summers pass.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the beginning of the third winter, the same kayaker returns to Kakortok
    with hunting tools, sees another Kavdlunak gathering shells, and kills him with
    a spear from the sunlit side of the water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The kayaker returns home unobserved and tells others he has killed one of
    the Kavdlunait; they reproach him for not informing their chief.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A girl sent to draw water in the evening sees a red reflection in the water,
    turns around, sees a large crowd of Kavdlunait, leaves the pail, and runs inside
    to report it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The enemies post themselves before the door and windows; one inmate runs out,
    is killed with an axe, and the others are killed in the same way except for two
    brothers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The two brothers escape onto the ice, and the Kavdlunait identify them as
    the last survivors and pursue them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The younger brother is slowed because new soles on his boots are slippery;
    Kaisape, the elder, reaches and climbs the opposite icy shore, while the younger
    falls and is overtaken.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: Ungortok cuts off the younger brother's left arm, holds it up before Kaisape,
    and tells him he will not forget his brother as long as he lives.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kaisape is unarmed, cannot help his brother, flees across country to Kangermiutsiak,
