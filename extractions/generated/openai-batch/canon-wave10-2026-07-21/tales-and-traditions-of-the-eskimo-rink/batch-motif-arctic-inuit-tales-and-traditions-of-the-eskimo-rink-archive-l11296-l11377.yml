canonical_text:
  quote: ''
  summary: Kasiagsak, an unsuccessful kayaker among skilled seal-hunters, fails to
    catch a little seal after hesitating and shouting at it. On another day he steals
    an unnamed hunter's seal from the beach, lies to his wife Kitlagsuak about the
    decorated towing-line, and is exposed when a boy asks for the line's return. In
    a following incomplete episode, he mistakes a stone on ice for a seal, then stages
    a false chase and rolls the stone into the sea to make a splash.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kasiagsak lives with many skilful seal-hunters but usually returns in the
    evening without a catch of his own.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: His wife Kitlagsuak restlessly watches for his return and hopes he will bring
    something home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kasiagsak sees a little seal on ice, decides not to harpoon it immediately,
    shouts at it, and loses it after it dives and reappears at increasing distance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kasiagsak sees another kayaker harpoon a seal and fasten it to a beach rock;
