  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: When asked about the beautiful towing-line, Kasiagsak says he brought it from
    storage because he expected to catch something.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kitlagsuak flenses and carves the seal, sets aside the head, back, and skin,
    prepares the rest and the blubber for a feast, and tells returning people that
    a seal has been brought home.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A boy enters during supper to ask for the towing-line, saying the seal itself
    is no matter; Kitlagsuak asks whether Kasiagsak told an untruth, and he admits
    that he did.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kitlagsuak calls Kasiagsak's behavior shameful; he makes a wry face, says
    “Bah,” frightens her, and later pinches her and whistles until they fall asleep.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: On another day, Kasiagsak sees a black spot on ice that proves to be a stone,
    then feigns rowing hard toward a seal, hides behind the ice, climbs up, and rolls
    the stone into the sea to make splash, froth, and foam.
  category: sequence
  evidence_refs:
  - ev:6
