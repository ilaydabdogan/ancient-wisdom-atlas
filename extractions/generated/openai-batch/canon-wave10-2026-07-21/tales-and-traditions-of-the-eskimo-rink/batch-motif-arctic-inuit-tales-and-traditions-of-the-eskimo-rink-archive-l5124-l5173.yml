canonical_text:
  quote: ''
  summary: 'Akigsiak recounts several episodes: luring and killing a whale with the
    aid of a learned magic lay; contesting a huge salmon-shaped fish with other inlanders;
    killing a fabulous pot-bearing inlander; being persuaded by an inorusek to kill
    a passing kayaker and then slaying the inorusek; and later visiting a coast man
    for a boxing-match and race. The passage also describes Akigsiak as larger than
    ordinary people.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Akigsiak says he was once on an excursion with his father near the sea-shore,
    where they saw a whale offshore and coast people on the beach.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At his father's order, Akigsiak made an old man teach him a magic lay for
    luring the whale up the river.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the whale entered the river and inlanders tried to harpoon it, Akigsiak
    fetched his weapons, returned, and killed the whale.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Akigsiak distributed shares of the whale to everyone, remembered the old coast
    man, and protected him against the inlanders.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Akigsiak heard that other inlanders had caught an immense fish shaped like
    a salmon, went to the river-side, and threw his harpoon into it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Because Akigsiak's companions were too few, the inlanders on the opposite
    side hauled the fish away from them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Akigsiak jumped across a narrower part of the river head over heels, landed
    on the opposite shore, frightened away the other inlanders, took his share of
    the fish, threw it back to his people, and jumped back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Akigsiak recounts a quarrel with an igalilik, described as a pot-bearer and
    one of the fabulous inlanders carrying boiling pots on their shoulders.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Akigsiak pushed the igalilik down a precipice and crushed him to death against
    the rocks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Akigsiak met an inorusek, described as another kind of gigantic inlander,
    on the high banks of a river.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: While Akigsiak and the inorusek were throwing stones, the inorusek persuaded
    him to try to hit a kayaker passing below, and Akigsiak killed the kayaker on
    the spot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Akigsiak repented of killing the kayaker, then slew the inorusek, and thereafter
    is said not to have ventured among the coast people because of the murder.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: Only once after this did Akigsiak visit a certain coast man living on a riverbank,
    in order to try a boxing-match and a race with him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Akigsiak is described as smaller than the other inlanders but larger than
