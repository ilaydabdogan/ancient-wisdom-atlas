canonical_text:
  quote: ''
  summary: A fragmentary opening mentions an unnamed man throwing a head into the
    sea. The main tale segment tells of a lonely bachelor who steals the clothes of
    a bathing bird-woman, marries her, has two sons with her, and later loses wife
    and children when she gives the boys wings and all three fly away as sea-fowl.
    The husband searches, meets an axe-working man who directs him to travel on a
    salmon tail with his eyes shut, and reaches a house where his wife rejects a pug-nosed
    suitor. When the husband tries to reclaim her, the wife, the other women, the
    suitor, and the house transform into birds or a gulls-hill.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment has an unnamed male speaker throwing one of the heads
    into the sea and speaking as if a little brother had fallen into the water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sad and lonely bachelor goes far inland and finds many women bathing in
    a lake.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bachelor secretly takes the clothes belonging to the woman he considers
    the prettiest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the women put on their clothes, they change into birds and fly away;
    the woman whose clothes were stolen remains behind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The remaining woman says he may take her as wife if he gives back her clothes;
    he returns them but holds her so she cannot fly, then takes her home and marries
    her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The husband initially avoids going out in his kayak because he fears the wife
    will fly away; after she says she loves him and can be trusted, he resumes seal-hunting.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The wife bears two sons, and later tells the children to gather bird wings
    and feathers because they are akin to birds.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The mother fastens wings on each boy, changing them into sea-fowl, then puts
    on wings herself and follows them in sea-fowl form.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The husband returns and finds neither wife nor children; he is sad and continues
    kayaking, though he no longer chases seals.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After landing near a sand-hill and walking inland, the husband meets a man
    working timber with an axe whose lower body trembles.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The axe-working man asks from which side the husband approaches and says he
    would have killed him if he had come from behind.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The husband offers a new kayak, then a new axe, for information about three
    persons; after the axe offer, the man instructs him to sit on a salmon tail in
    a river and keep his eyes shut when he hears children.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: The husband sits on the salmon tail, is carried by a rapid current, hears
    the children say their father is near, and hears the mother answer that they left
    him without a way to come.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The husband reaches a house with fine windows whose inmates are all women;
    his wife sits near the back wall opposite a pug-nosed man who asks her to marry
    him.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:15
  text: The wife refuses the pug-nosed man's marriage request, saying she already
    has another husband.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: When the husband tries to take his wife back, she follows the pug-nosed man
    out; while being pursued she becomes a gull, the other women also become gulls,
    the pug-nosed man becomes a wild-duck, and the house becomes a gulls-hill.
  category: sequence
  evidence_refs:
  - ev:10
