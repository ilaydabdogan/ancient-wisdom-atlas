canonical_text:
  quote: ''
  summary: The passage closes one story with an aged man returning, settling, seeing
    descendants, and dying. It then begins the tale of a skilled hunter whose elder
    sister disappears near the outer islets; he finds a sledge track, has his father
    make a sledge, and begins capturing and training powerful animals, including a
    bear and an amarok, to pull it. A bracketed note frames the tale as widely known
    in Greenland and possibly connected with the invention of dog-sledging or the
    training of wild animals.
  language: English
