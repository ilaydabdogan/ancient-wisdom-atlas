canonical_text:
  quote: ''
  summary: A novice angakok visitor performs in a dark festivity house and summons
    a large iceberg. During the ritual, participants are called to the floor, but
    when the hairy or ugly woman missteps, the iceberg overturns and crushes the house,
    leaving only the visitor and a squint-eyed man alive. The visitor returns by flight
    with ravens and mourns his error. The squint-eyed man then claims to be an angakok
    and flies out of a lit house while tied. A second tale begins about the novice
    angakok Ipisanguak, who flies in search of a little house and a bloody sword at
    Akilinek, where a dim-eyed man emerges.
  language: English
  quote_policy: summarized
