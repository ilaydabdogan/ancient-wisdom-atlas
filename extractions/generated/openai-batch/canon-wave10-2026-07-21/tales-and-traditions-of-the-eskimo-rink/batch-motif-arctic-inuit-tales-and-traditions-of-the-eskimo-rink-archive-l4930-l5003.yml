canonical_text:
  quote: ''
  summary: Kumagdlat, Asalok, Merak, and their companions use an island as a hiding-place
    while attacking an erkilek encampment. Kumagdlat shoots a pregnant woman in a
    tent, later restores Merak after an arrow wound by murmuring a spell, and the
    group then kills many erkileks, kills most of the children while leaving one boy
    and one girl alive, examines the camp goods, and carries away knives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The group reaches an island, deposits most of its arrows there, keeps two
    arrows each, returns to the mainland, and approaches the tents.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kumagdlat plans to jump onto the cross-beam above the tent entrance while
    the others pass through the fore-room and look through the skin curtain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Inside the largest tent, an old married couple is awake; the woman is pregnant,
    and the man howls like a dog, licks her belly, and receives reindeer-tallow from
    her.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Kumagdlat shoots the pregnant woman through the body while the man is licking
    her, after which a yell is heard and the attackers flee back to the island.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The cousins lie in a row on the island while the erkileks shoot arrows at
    them from shore; the passage says the women shoot more quickly than the men because
    of how they draw arrows from their quivers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Merak is dangerously hit in the throat after raising his head during the arrow
    attack.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Asalok asks whether Kumagdlat knows a spell for restoring life; Kumagdlat
    murmurs words, the arrow comes out of Merak’s throat, and Merak is alive and unhurt
    after the third utterance.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the erkileks use up their arrows, the cousins shoot many of them and
    pursue the rest along a river to a waterfall, where Kumagdlat kills them with
    stones as they emerge from a hiding-place.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Children in the tents remain terrified and feign death, but the cousins kill
    them by piercing their ears, leaving only one boy and one girl alive.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The attackers examine the erkileks’ furniture, find copper pots, boxes of
    clothes, and knives with beautiful handles, and take away as many knives as they
    can carry.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: While Kumagdlat is away, the people with whom he left his family mock them.
  category: relationship
  evidence_refs:
  - ev:9
