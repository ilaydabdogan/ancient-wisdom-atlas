canonical_text:
  quote: ''
  summary: 'The passage gives three brief tales: a father and son escape a kayariak,
    enter a strange house later seen as a cave of birds; Kuanak, an angakok, undergoes
    flights, sea/earth travel, near-death return, and revival; another angakok visits
    his sister’s household, finds most people dead and the sister threatening, then
    learns through angakok flight that a funeral kayak skin-cover frightened them
    to death.'
  language: English
  quote_policy: summarized
