  summary: The passage describes Greenlandic Inuit and related Eskimo social customs
    concerning shared hunting spoils, property rules, mutual obligations, adoption
    and housemate agreements, consent for settlement by newcomers, the duty of men
    and sons to hunt at sea, norms against quarrelling, local variation in property
    rules, and enforcement of law through angakoks, relatives, and public opinion
    rather than a formal court.
