canonical_text:
  quote: ''
  summary: A man wintering near Kangek exhausts his stored seals, searches unsuccessfully
    for seal breathing holes, kills and eats his dog, then finds an ice opening and
    reaches Kangek, where he is welcomed and provisioned. Later he and his son hunt
    from kayaks; when other men surround the son's kayak, the father uses an amulet
    with a spoken command, and the men are overturned and drowned except for father
    and son. The family then moves north, and the father urges the son to become strong
    enough to meet future enemies.
  language: English
  quote_policy: summarized
