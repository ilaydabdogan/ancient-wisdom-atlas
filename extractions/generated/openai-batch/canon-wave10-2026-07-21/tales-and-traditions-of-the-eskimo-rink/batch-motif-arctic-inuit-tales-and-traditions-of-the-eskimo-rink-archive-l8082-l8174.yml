canonical_text:
  quote: ''
  summary: The passage concludes an episode in which Merkisalik’s son surpasses other
    hunters, the visitors’ father obtains a knuckle and later is said to have bewitched
    the son’s knee, causing his death. After mourning, Merkisalik creates a tupilak
    from animal bones and boat-skin hairs, rejects several forms, accepts its small-whale
    form, and sends it against the many brothers, who are then reported to disappear
    one after another.
  language: English
