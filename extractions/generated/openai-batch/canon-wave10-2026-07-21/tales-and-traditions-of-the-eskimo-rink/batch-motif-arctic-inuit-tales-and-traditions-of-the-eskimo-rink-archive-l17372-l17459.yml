- id: claim:1
  claim: The note to “The Swimmer” reports a somewhat similar East Greenland tale
    involving three sons brought up as swimmers.
  claim_level: same_motif
  target: East Greenland tale of three sons brought up as swimmers
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
