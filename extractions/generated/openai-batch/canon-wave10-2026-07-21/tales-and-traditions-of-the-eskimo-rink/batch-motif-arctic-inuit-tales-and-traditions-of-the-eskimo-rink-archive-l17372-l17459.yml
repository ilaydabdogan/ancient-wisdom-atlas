canonical_text:
  quote: ''
  summary: 'The passage contains the end of a tale in which deceased people take Kongajuk
    to their abodes, followed by short Labrador and Greenlandic traditions: a mother
    trains her last son to live in water like a seal and destroys pursuing enemies
    by whipping the water into a storm; Labrador traditions describe the tunnit/tunneks
    as strong former inhabitants who fled north; a shark provides for and transports
    an abandoned mother and daughter; Alekakukiak flees murderous in-laws and disables
    dangerous animals with a string; and a kayaker narrowly escapes an ocean-spider
    whose body appears like a false shoal.'
  language: English
  quote_policy: summarized
