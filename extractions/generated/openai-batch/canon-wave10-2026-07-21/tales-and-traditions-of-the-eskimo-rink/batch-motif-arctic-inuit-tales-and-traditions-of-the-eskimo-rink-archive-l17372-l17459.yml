    East Greenland tale.
- id: claim:2
  claim: The note cautiously identifies the Labrador tunnit with Greenlandic tornit
    or inlanders and also mentions Cumberland Inlet tunudlermiut as people living
    inland.
  claim_level: linguistic_similarity
  target: Greenlandic tornit / inlanders and Cumberland Inlet tunudlermiut
  evidence_refs:
  - ev:5
  counter_evidence_refs:
  - ev:5
  confidence: medium
  limitations: The same note warns of possible misunderstanding and highlights the
    incongruity of tunnit abodes being on islands, which complicates the identification.
- id: claim:3
  claim: The note to Alekakukiak states that a very similar fragment was received
