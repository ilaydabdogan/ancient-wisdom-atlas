canonical_text:
  quote: ''
  summary: 'During a boat journey, Kunuk retaliates after an old woman mocks his wife.
    His brother recognizes the burial-place of their little sister, grieves intensely,
    becomes ill, and dies before they arrive at Ungilagtake. In winter, Kunuk is hosted
    by an enemy of Ungilagtake, who demonstrates tests associated with Ungilagtake:
    lifting a sand-stuffed sealskin and surviving a lance throw with drum-song. Kunuk
    passes these demonstrations. He is warned about Ungilagtake and the strong companion
    Tajangiarsuk. Kunuk and his wife are then summoned to Ungilagtake’s large house,
    where Ungilagtake’s many stolen wives are present, and another spear-and-drum
    ordeal begins.'
  language: English
  quote_policy: summarized
