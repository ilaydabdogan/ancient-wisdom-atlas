canonical_text:
  quote: ''
  summary: The passage gives a complete Kivigtok tale in which a second son flees
    human society, lives alone in a cave, is found by his father and brothers, promises
    to return, but escapes again and later appears on an inaccessible rock. It then
    begins a second tale in which a woman separates from two hunting companions after
    being scolded and encounters a man emerging from a gull's mound, connected by
    the title and footnote with the Ingnersuit or under-world people.
  language: English
  quote_policy: summarized
