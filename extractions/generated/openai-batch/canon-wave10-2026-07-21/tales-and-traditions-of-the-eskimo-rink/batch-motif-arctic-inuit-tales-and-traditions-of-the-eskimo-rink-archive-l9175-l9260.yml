  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The brothers challenge a race past foaming breakers and later secretly consult
    to surround Kujanguak, but he crosses the surf and escapes them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kujanguak’s mother misses a lock of hair, understands it as a bad omen for
    her son, and is reassured when it returns to its proper place on her forehead.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The widow cuts a piece of seal loin, pronounces a spell over it, and gives
    it as a present to the resentful mother of the many sons; Sanak is suffocated
    and dies, while the old mother recovers after receiving water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The eldest brother accuses the widow, rushes against the house-pillars to
    shake the house down over her, and then snatches the front and back points from
    her jacket.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The widow takes filth from beneath the place where her dead mother put dirty
    refuse and throws it at the enemies’ house; sickness follows, and all die except
    the sister, who turns kivigtok.
  category: sequence
  evidence_refs:
  - ev:8
