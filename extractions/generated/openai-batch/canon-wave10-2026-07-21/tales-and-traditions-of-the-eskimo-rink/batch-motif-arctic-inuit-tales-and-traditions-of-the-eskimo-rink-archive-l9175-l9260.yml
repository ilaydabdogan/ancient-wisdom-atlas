canonical_text:
  quote: ''
  summary: Kujanguak brings home a bear and later a seal. His mother shares bear meat
    with the sister of the brothers and later gives Kujanguak protective advice involving
    sea water. Rival brothers attack and pursue him, but he escapes. His mother notices
    a lock of hair as an omen concerning him. After the enemy household envies the
    seal meat, the widow gives a spelled piece of loin; Sanak dies. The eldest brother
    accuses and attacks the widow, attempting to bring down the house and tearing
    points from her jacket. The widow later throws filth from the refuse place of
    her dead mother at the enemies’ house, causing sickness that kills all except
    the sister, who becomes kivigtok, one who has fled from mankind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kujanguak fastens a towing-line to a bear, paddles home with it, and brings
    it to the beach while Sanak has cried out that he has got a bear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kujanguak’s mother divides the bear into two equal parts, gives one part and
    the skin to the other woman, boils the flesh, and invites the party to eat.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The woman visitor says she had been longing for bear meat, eats with the others,
    and thanks the hostess for the meal.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The next day Kujanguak catches a large seal; before the brothers attack him,
    his mother has advised him to take sea water with his left hand and moisten his
    lips if persecuted.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The eldest brother seizes Kujanguak’s kayak point and tries to upset it; after
