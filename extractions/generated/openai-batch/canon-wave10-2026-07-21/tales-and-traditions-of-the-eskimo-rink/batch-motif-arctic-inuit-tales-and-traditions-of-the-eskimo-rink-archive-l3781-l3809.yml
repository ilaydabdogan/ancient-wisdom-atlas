  quote: ''
  summary: The introduction states that tales and traditions are a major amusement
    of Greenlanders and may help the study of the origin and development of traditions.
    It reports that native narrators classify tales into ancient tales, considered
    common property of much of the nation, and more recent tales, limited to regions
    or kin groups as family records. It also notes the wide geographic spread of the
    Eskimo and their relative lack of influence from alien settlers.
  language: English
