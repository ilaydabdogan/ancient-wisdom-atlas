  quote: ''
  summary: The passage recounts episodes involving Kanak, the moon-man, a dangerous
    old hag, a barren wife taken to the moon-man's home, Manguarak's encounter with
    the moon-man after catching a reserved white whale, and Arnarkuak, a woman who
    disguises herself as a man and takes her daughter-in-law as wife before being
    killed by her son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kanak is warned that a woman will appear who removes the entrails of anyone
    she can tempt to laugh, and he is told to rub his leg below the knee with the
    nail of his little finger if he cannot withhold smiling.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old hag enters dancing, whirling, licking her own back, and making ridiculous
    gestures; when Kanak rubs his leg, she starts, and the moon-man seizes her and
    throws her down the entrance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A voice says the old hag left her knife and platter and threatens to overthrow
    the pillars of heaven if she does not get them; the moon-man throws the knife
    and platter down the entrance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The moon-man opens a hatch in the floor, blows through a great pipe, and shows
    Kanak how he makes snow fall on the earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The moon-man pushes Kanak down through the opening; Kanak swoons, hears the
    voice of his grandmother's spirit, reaches the earth's surface, goes home, and
    later becomes a celebrated angakok.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A barren wife treated badly by her husband leaves on a winter night, is taken
    by the moon-man to his home, returns in spring, becomes pregnant, gives birth
    to a son, and the son is later taken away by the moon-man.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Manguarak ignores his father's warnings and catches a white whale with a black
    spot, identified as belonging to animals of chase set apart for the spirit of
    the moon.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The moon-man calls Manguarak outside, challenges him to fight on the ice,
    and proposes that they first name all the animals of chase they have caught.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: After Manguarak names a fish that the moon-man feared to catch, the moon-man
    decides not to harm him and invites him to see his place.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Manguarak gets his father's permission, rides with the moon-man on a sledge
    drawn by a single dog, rises from the ground, and travels through the air to a
    high land, a snowy valley, and a dark cliff where the old hag lives.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Arnarkuak scolds her son for lack of hunting skill and other manly pursuits,
    forces her daughter-in-law Ukuamak to flee by threatening death, disguises herself
    like a man, and has Ukuamak for a wife.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Arnarkuak's son finds the refuge of Arnarkuak and Ukuamak and kills his mother.
  category: action
  evidence_refs:
  - ev:12
