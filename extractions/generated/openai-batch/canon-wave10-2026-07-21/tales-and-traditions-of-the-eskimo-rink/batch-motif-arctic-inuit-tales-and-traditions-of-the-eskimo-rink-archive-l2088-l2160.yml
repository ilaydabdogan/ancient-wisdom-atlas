canonical_text:
  quote: ''
  summary: The passage first describes forms of punishment for murder, witchcraft,
    and certain ambiguous cases of manslaughter. It then introduces an account of
    Eskimo religious belief, stating that there are only scant traces of speculation
    about the world's origin, early history, or deities, while attention is given
    to still-acting powers concealed in nature. It describes men and animals as having
    soul and body; the soul is allied with breathing, can leave and return to the
    body, can be perceived only by specially qualified persons, appears in the shape
    of the body but subtle and ethereal, continues after death, may migrate between
    humans and animals, and may be hurt, destroyed, or repaired.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Murder and certain cases of witchcraft are described as generally punished
    by death, either through blood-revenge or through deliberation by inhabitants
    of one or more stations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Blood-revenge is described as the duty of the nearest relative, who must denounce
    himself to the relatives of the person he has killed after carrying it out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Capital punishment by deliberation and decree is described as applied to witches
    and to individuals considered or suspected to be dangerous to the community.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some killings are described as neither clearly admissible nor wholly unlawful,
    including killing an infant likely to starve after the mother's loss, killing
    insane persons, responding to threats against housemates, and extended blood-revenge
    against kin or place-fellows of a murderer.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: The account of religious belief is said to be founded chiefly on traditions,
    inquiries among natives, and older authors.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says that only scant traces exist of ideas about the origin and
    early history of the world and about ruling powers or deities.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Existence is described as accepted without speculation about its primitive
    origin, while still-acting powers concealed in nature are taken into consideration.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Men and animals are said to have both soul and body.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The soul is said to perform breathing, to be independent of the body, and
    to be able to leave the body temporarily and return.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The soul is said to be imperceptible to common senses and perceptible only
    through a special sense belonging to certain persons.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: When viewed by those persons, the soul is said to have the same shape as its
    body but to be of a more subtle and ethereal nature.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The human soul is said to continue to live after death in the same manner
    as before, and animal souls are also described as continuing after death to some
    degree.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The passage reports traces of belief in migration of souls between dead and
    living humans and between humans and animals, while also stating uncertainty about
