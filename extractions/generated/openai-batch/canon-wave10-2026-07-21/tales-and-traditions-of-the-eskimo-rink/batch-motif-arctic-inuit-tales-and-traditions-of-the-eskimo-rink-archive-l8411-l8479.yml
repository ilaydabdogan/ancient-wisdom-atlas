canonical_text:
  quote: ''
  summary: A woman guides her companions back toward her relatives near open water,
    delays descent until morning, and goes first to a large family tent. A child recognizes
    her as his aunt before an old woman does. Her brothers joyfully greet her, bring
    down her fellow-travellers from the mountainside, and later begin a strength contest
    called “hook and crook.”
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The travelling group wanders through the next day, sights open water toward
    evening, cries for joy, and stops briefly.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife says they should wait until morning because her brothers would otherwise
    be out kayaking; the group sleeps and descends the hillside in the morning.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Many tents appear in the valley, and the woman identifies one larger tent
    as belonging to her relatives; she asks to go down alone while the others remain
    behind.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old woman comes out of a tent holding a child and carrying a large seal-skin
    intended for drying as sole-leather.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The child says the approaching woman is his aunt, but the old woman initially
    rejects this, saying the aunt had fled away and would not return because of quarrels
    and fights for her sake.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the child continues speaking, the old woman looks up, recognizes the
    woman, says the child was right, and caresses him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The brothers learn what has happened, each declares his longing for the sister,
    run toward her, and allow the eldest to greet her first out of reverence.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The woman reports that the men are waiting on the mountainside; the brothers
    run to bring them down, and neighbours crowd the tent entrance to see the travellers
    who crossed the breadth of the country.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The brothers remain at home during the day, sitting together and regarding
    one another lovingly because of the joy of the meeting.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the evening the eldest proposes amusements, and a strength contest called
    “hook and crook” begins with participants sitting on a skin and hooking arms.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
