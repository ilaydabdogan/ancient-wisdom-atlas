canonical_text:
  quote: ''
  summary: Tiggak and his companions defeat a giant/adversary by turning the enemy's
    rope-and-flensing process against him. When trapped by water poured down from
    above, Tiggak uses an amulet hidden in his coat lining to take revenge on those
    outside. A youth reports that Apiak is cooking the brains, hands, and feet of
    her son; after a brother explains how to handle the dangerous dish, Tiggak follows
    the instructions and the old woman goes mad and dies. The group then leaves the
    place and begins moving homeward, stopping near a snow-covered hill by the water
    where Tiggak asks the eldest brother about his chosen amulet.
  language: English
  quote_policy: summarized
