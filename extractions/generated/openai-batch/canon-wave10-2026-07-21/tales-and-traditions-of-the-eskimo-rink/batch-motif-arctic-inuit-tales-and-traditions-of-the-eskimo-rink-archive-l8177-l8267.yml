canonical_text:
  quote: ''
  summary: Namak’s parents are killed by their house-fellows, and he is adopted while
    still a weak child. His foster-father repeatedly frightens and provokes him about
    his enemies and his parents’ murder, gives him a sling, and tells him to practice.
    Namak becomes skilled, hides his strength, and prepares stronger slings from sealskin.
    When his enemies are departing by boat, Namak ambushes them near beach stone-heaps
    and uses sling-thrown stones to sink or cleave three boats, killing their crews;
    one boat escapes by heading out to sea.
  language: English
