canonical_text:
  quote: ''
  summary: The passage summarizes beliefs about supernatural agencies, inue, ghosts,
    soul separation, postmortem influence, and the ability of some gifted humans or
    animals to perceive or exercise supernatural powers. It also describes ghosts
    as requesting food, dangerous bodily apparitions, owners of graves and possessions,
    and possible guardian spirits for descendants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some tales are said to hint that the survivors’ treatment of a deceased body
    influences the condition of the deceased person’s soul.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes this belief as akin to punishment and reward corresponding
    to actions performed in life.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Supernatural agencies are described as working outside usual natural laws
    and as usually imperceptible to ordinary senses.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Such agencies may manifest to gifted individuals and, in some cases, to animals
    with a special sense called nalussaerunek; the possessor is called nalussaerutok
    and is glossed as nearly clairvoyant.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The supernatural agencies are divided into those performed by the inue of
    nature and those belonging to witchcraft.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The inue, when perceptible to ordinary senses, generally appear as fire or
    bright light, and seeing them is described as dangerous.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Seeing the inue may frighten a person to death or foreshadow the death of
    a relative.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some supernatural powers are said to be able to sever the soul from the body
    at a distance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Heavy grief may produce a state in which a sufferer deliberately seeks horrors
    and dangers to drown grief in excitement.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Supernatural rulers are described both as inue of special domains and as independent
    individual beings.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that humans, and in some cases animals, may practice supernatural
    power from some motive.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Some supernatural beings are described as originating from real beings transfigured
    through traditional tales.
  category: other
  evidence_refs:
  - ev:5
- id: obs:13
  text: Humans are said to be free after death to reappear as ghosts, though some
    persons’ ghosts are more dangerous than others.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: The dead man is considered the inua of his grave and of the personal properties
    he left.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: Belongings of absent persons can announce by signs that their owners have
    died or are in distress.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The soul is said to appear to remain in the grave during the first days after
    death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: A ghost may manifest harmlessly by whistling or by singing in the ears, and
    the ear-singing is described as a request for food.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: When singing in the ear is perceived, the customary response is to say that
    the ghost may take from one’s stores as it likes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:19
  text: Ghosts that appear in true bodily shape are more dangerous, especially those
    of delirious people and angakut.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:20
  text: The deceased are described as able to recompense benefits given to them in
    life and as guardian spirits to children and grandchildren.
  category: relationship
  evidence_refs:
  - ev:7
