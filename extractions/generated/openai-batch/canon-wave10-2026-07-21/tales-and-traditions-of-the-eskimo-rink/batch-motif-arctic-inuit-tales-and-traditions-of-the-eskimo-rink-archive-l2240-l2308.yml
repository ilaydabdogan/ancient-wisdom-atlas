  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The angakok then passes a boiling kettle with seals in it and reaches a house
    guarded by terrible animals described either as seals or dogs.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Inside the house-passage, the angakok must cross an abyss by a bridge as narrow
    as a knife's edge.
  category: sequence
  evidence_refs:
  - ev:12
