canonical_text:
  quote: ''
  summary: The passage describes Greenlandic Inuit religious views as involving a
    ruling power, shamanic access to invisible rulers and guardian spirits, Tornarsuk
    as a supreme ruler associated with the underworld and happy deceased, and Arnarkuagsak
    as a female ocean-depth being who controls food animals. It recounts the angakok's
    task of reaching Arnarkuagsak, removing parasites from her head, and persuading
    her to release animals, after passing dangerous obstacles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that certain means enabled a person to enter communion
    with invisible rulers and make them helpers or servants.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men called angakut acquired angakoonek by calling on a more exalted power,
    which made rulers become their helping or guardian spirits, called tornat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tornarsuk is described as a supreme ruler able to dispose of minor powers
    and force them to serve the angakut.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tornarsuk is said to have an abode with the happy deceased in the underworld,
    though the passage calls the belief vague.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Arnarkuagsak is described as a female supernatural power associated with nourishment
    and with an abode in the depths of the ocean.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Arnarkuagsak sits in her dwelling before a lamp with a vessel below it receiving
    oil flowing from the lamp.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Arnarkuagsak sends out food animals from the vessel or from the dark interior
    of her house, and in some cases withholds them, causing want and famine.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Her withholding of animals is ascribed to filthy and noxious parasites fastened
    around her head.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The angakok's task is to remove the parasites from Arnarkuagsak and induce
    her to release animals again for humans.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: On the way to Arnarkuagsak, the angakok must pass the arsissut and cross an
