canonical_text:
  quote: ''
  summary: 'The supplied passage contains five short tales and a note: an old man
    receives secret food aid from an ingnersuak until he hints at its source; old
    men move an island by magic song, child’s hair, and a sealskin thong; a mourner
    kills the young of an amarok and has his soul taken; an old bachelor fails in
    a marriage request and is comically trapped by a rock while drinking; a note groups
    such bachelor tales as ridicule stories; and Isserfik loves an eagle, is taken
    inland, is brought back after the eagle is killed by an amulet, gives birth to
    a half-human half-eagle child, and dies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man met an ingnersuak, was invited to its house, and received a private
    offer of food help whenever he was in want.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the old man began hinting to other people about the source of his riches,
    the ingnersuak stopped assisting him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some mainland inhabitants disliked an island off southern Greenland because
    it cut them off from the open sea.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nevingasilernak and Nivfigfarsuk tried to remove the island with a magic lay
    and a child’s hair, while Kiviaritajak tried to keep it in place with a sealskin
    thong.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The two kayakers chanted, tugged the hair, broke the thong, floated the island,
    pulled it north, placed it before Ilulissat, and the passage says the sea bottom
    rose along their route.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A man mourning a relative went with another relative to encounter an amarok
    after hearing that one had roared near Nook.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The mourner found and killed the young amarok, and he and his frightened companion
    took refuge in a cave.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The old amarok arrived holding a whole reindeer, searched for its young, went
    to a lake, and the passage says it discovered the mourner and took the soul out
    of his body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A successful old bachelor was pressed to marry, sought the only sister of
    several brothers, offered a boat and new tent, was refused, and gave up marrying.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: While thirsty in his kayak, the old bachelor let water from a rock run into
    his open mouth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The bachelor’s mouth clung to the rock and lengthened as the tide fell, leaving
    him hanging until the next tide could float him off.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The note says there are a number of stories ridiculing bachelors, with examples
    involving gulls, stones, dwarfs, women without breasts, and a little ice island.
  category: other
  evidence_refs:
  - ev:5
- id: obs:13
  text: Isserfik preferred animals to men, fell in love with an eagle, and the eagle
    carried her inland.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: A man pursued Isserfik and the eagle; Isserfik incited the eagle against him,
    the man hid beneath a stone, and the eagle pecked at it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The man sent out his amulet, killed the eagle, brought Isserfik home, and
    she later gave birth to a child half man and half eagle before losing her mind
    and dying.
  category: sequence
  evidence_refs:
  - ev:6
