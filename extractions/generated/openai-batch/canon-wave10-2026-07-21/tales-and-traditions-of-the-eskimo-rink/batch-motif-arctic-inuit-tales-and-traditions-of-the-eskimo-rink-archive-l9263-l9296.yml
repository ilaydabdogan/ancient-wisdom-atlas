canonical_text:
  quote: ''
  summary: An old seal-hunter loses his chance to spear a seal when playing children
    shout. In anger he orders the mountain-cleft where they are playing to close;
    it traps the children and infants in a cavern. The older girls try to comfort
    thirsty babies, mothers pour water down from above but cannot reach them, and
    all of the trapped children starve.
  language: English
