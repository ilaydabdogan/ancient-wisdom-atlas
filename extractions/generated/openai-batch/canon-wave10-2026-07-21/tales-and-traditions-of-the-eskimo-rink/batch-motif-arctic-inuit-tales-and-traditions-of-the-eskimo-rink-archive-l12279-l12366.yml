canonical_text:
  quote: ''
  summary: An editorial note marks the tale as doubtful. Pisagsak is carried far from
    home while kayaking, crosses mountain-walls by ladder, and finds an old kivigtok
    in a remote house. The old man keeps him as a companion, feeds him, and teaches
    him domestic and hunting work. The two watch Kavdlunait women fetching water at
    a spring; the old man abducts a young woman and later Pisagsak abducts an old
    woman. Both women remain in the house. The passage ends as Kavdlunait attackers
    approach by boat and begin climbing a cliff ladder that the old man plans to loosen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An introductory note says the tale was received from one narrator and is considered
    too doubtful for inclusion among tales about the ancient Kavdlunait.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pisagsak goes kayaking to try a new bird-javelin and is carried far away from
    his homestead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pisagsak reaches a steep mountain-wall with a long suspended ladder, climbs
    it, crosses a small cotton-grass plain, climbs another mountain-wall, and sees
    a little house below.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Inside the house, Pisagsak finds one old kivigtok, who says he has seen him,
    invites him in, asks him to remain as a companion, and feeds him dried meat, tallow,
    and boiled reindeer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pisagsak later sees many boots hanging under the roof, dries them, cooks,
    skins bucks, manages household work, learns to snare partridges and shoot reindeer,
    and becomes a skillful sportsman.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The old kivigtok says Kavdlunait women come to fetch water; he and Pisagsak
    hide behind large stones near a spring while women and girls fill pails.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When a young beautiful woman comes to the spring, the old kivigtok becomes
    excited, springs on her, stuffs her mouth to keep her from calling out, and carries
    her away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the house, the captors take away the young woman's boots to prevent her
    from running away and hunt by turns so that one can watch her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The young woman eventually gives up the idea of flight, and when the men return
    from hunting they find housework done and clothes and boots mended.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: On another visit to the spring, the old kivigtok orders Pisagsak to catch
    a nice woman, but Pisagsak waits for an old wrinkled woman, captures her, and
    brings her home.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: After one day with them, the old woman likes the household and does not care
    to return; the house then has two women.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The old kivigtok says the Kavdlunait will attack from the sea-side; he and
    Pisagsak watch boats approach from the cliff-top where the ladder is fastened.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The old kivigtok plans to loosen the ladder when the attackers have climbed
    onto it; the supplied passage ends as the first attacker appears with a lance.
  category: sequence
  evidence_refs:
  - ev:9
