canonical_text:
  quote: ''
  summary: 'The passage introduces a famous Greenland story about two lifelong friends,
    one living on an outer island and the other at the head of a fiord. They regularly
    visit and exchange prized foods: reindeer and tallow from the hunter, and preserved
    seal meat from the islander. When the hunter is delayed in the interior one autumn,
    the islander becomes angry as stored seals begin to spoil. Hearing of the hunter''s
    return, he cuts fat from a dead body in a grave and rubs it on a seal meant for
    his friend, intending harm. The hunter arrives, explains his delay as difficulty
    finding the desired reindeer, and the islander proposes serving the last preserved
    seal as a cold dish.'
  language: English
  quote_policy: summarized
