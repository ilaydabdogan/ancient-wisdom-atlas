canonical_text:
  quote: ''
  summary: The passage describes customary rules concerning hunted animals, shared
    meals, borrowed tools and weapons, bargains, surplus property, personal belongings,
    family goods, housemate goods, and goods shared within a hamlet. It emphasizes
    communal claims on large animals and surplus possessions, while also noting a
    special relation between a person and personal clothes, weapons, and tools.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A captured large animal, especially a whale, is treated as common property
    for anyone who comes to help flense it, regardless of residence or role in the
    capture.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During whale flensing, there is said to be no formal order or control, and
    an accidental wounding during the work is not treated as punishable responsibility.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In South Greenland, when a bear is killed, ownership is attributed to the
    person who first discovered it rather than to the person who killed it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When no seals or larger animals are brought home, better-provisioned families
    invite housemates, but not place-fellows, to share the principal daily meal, or
    families jointly contribute to the meal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A borrower who loses or damages another person's tools or weapons is not bound
    to compensate the owner.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: If unused fox-traps are set and tended by another person, that person becomes
    owner of the game caught in them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A person may retract a bargain after repenting of it, and goods are not sold
    on credit except with very prompt payment.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator concludes that excess property is watched by the community and
    effectively transferred to those with less according to custom or tradition.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Personal clothes, weapons, tools, and other special-use items are described
    as belonging to a single person and as having a kind of supernatural relation
    to the owner.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says lending personal belongings is not customary, but public
    opinion may compel lending when a person owns more suits than usual.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that superfluous garments or implements rarely exist because
    spare items are treated as shareable or loseable through lending.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: A hunter with three kayaks may be obliged to lend one to a relative or housemate
    and eventually lose it.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage classifies property into individual goods, family goods, housemate
    goods, and goods shared with the hamlet.
  category: relationship
  evidence_refs:
  - ev:9
