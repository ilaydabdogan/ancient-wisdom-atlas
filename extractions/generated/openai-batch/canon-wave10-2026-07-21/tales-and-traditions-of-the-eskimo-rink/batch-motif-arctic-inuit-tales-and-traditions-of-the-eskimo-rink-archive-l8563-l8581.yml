canonical_text:
  quote: "“I will rather return with you.”"
  summary: The brothers hurry to arrive before others, serve supper to the master
    of the house, and are praised as able helpmates. In spring they long for home,
    ask their former companion whether she will stay or go, and she chooses to return
    with them. Her parents do not object, and the departing group is never again seen
    or heard of by their kinsmen.
