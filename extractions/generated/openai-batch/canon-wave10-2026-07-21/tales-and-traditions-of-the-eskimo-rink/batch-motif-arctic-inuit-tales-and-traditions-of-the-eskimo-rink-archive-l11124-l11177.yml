canonical_text:
  quote: ''
  summary: A stranded young man is unable to return after his kayak is destroyed.
    His brother follows, is likewise drawn to the shore, and secretly protects him.
    At night the brother lets him escape, delays the pursuit by breaking oars, and
    the fugitive reaches home to gather allies. In winter the allies attack the fiord
    people. The brother advises the fiord people to hide in a cave, then reveals the
    hiding place to the attackers. The attackers shoot arrows into the cave, killing
    all but one; a bird flies out and is shot with an arrow obtained from an orphan
    boy. The bird is found to have been one of the men, is cut apart, and its entrails
    are divided between the ocean depths and a sunless place. A note describes two
    related variants involving revenge for vanished men and a sorcerer who attacks
    like a bird from a mountain before being killed by a trained boy's arrow.
  language: English
  quote_policy: summarized
