canonical_text:
  quote: ''
  summary: In the tale of Sitliarnat, three brothers and an unrelated companion are
    driven from the frozen sea by a south-east storm, survive by mounting an iceberg,
    and drift to an unknown shore. They find an old couple in a small hut, are questioned
    and fed, and later witness the return and recovery of the couple's pale, haggard
    son, who resumes provisioning the household without visible weapons. After several
    years, the old man asks about Sitliarnat's birth amulet; Sitliarnat names a carrion-gull,
    which the old man says assures eventual return home, while the unrelated companion
    has a raven amulet.
  language: English
  quote_policy: summarized
