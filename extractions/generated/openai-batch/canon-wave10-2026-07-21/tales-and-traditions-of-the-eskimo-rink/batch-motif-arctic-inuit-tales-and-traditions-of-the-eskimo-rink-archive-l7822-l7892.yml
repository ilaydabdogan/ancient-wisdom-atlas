  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nearly starving, the group reached an unknown shore, searched for people,
    and observed a small one-window hut on an isthmus.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sitliarnat said, “Let them make me their first prize,” and crossed the threshold
    before his companions.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Inside the house the visitors found only an old couple; the old man breathed
