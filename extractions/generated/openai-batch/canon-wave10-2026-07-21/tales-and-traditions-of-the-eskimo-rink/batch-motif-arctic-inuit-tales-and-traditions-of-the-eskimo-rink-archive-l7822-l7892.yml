  text: Three brothers, including the eldest named Sitliarnat, went hunting on the
    frozen sea with an unrelated person.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A south-east storm broke the ice beneath them; they mounted an iceberg and
