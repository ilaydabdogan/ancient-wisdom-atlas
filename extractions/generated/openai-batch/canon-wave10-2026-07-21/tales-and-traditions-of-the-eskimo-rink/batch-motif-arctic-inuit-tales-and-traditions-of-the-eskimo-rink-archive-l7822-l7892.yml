  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sitliarnat told the old man that the group came from land on the other side
    of the ocean, had gone to catch seals, and had been drifted across by a south-east
    gale.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The old wife boiled blubber in a pan and served it in a wooden dish; the hungry
    visitors tasted little, and a proper meal was later set before them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The old man said the household's only provider had gone hunting, had been
    absent for a month, and might have encountered wicked people.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A voice outside asked to enter; the old man went out and returned holding
    his pale, haggard son by the hand.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The son lay on the side ledge for several days, then recovered health, strength,
    appetite, and former appearance.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: After recovering, the son again served as provider of the household, though
    he was never seen carrying weapons.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: The visitors stayed for several years before the old man asked Sitliarnat
    what he had received as a birth amulet.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Sitliarnat said his childhood amulet was a carrion-gull that seeks carrion
    farthest out to sea; the old man replied that this meant he could be sure of returning
    to his country.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: One brother said the brothers all had the same bird amulet, while the unrelated
