canonical_text:
  quote: ''
  summary: Two girls playing with eagle-bones and whale-bones declare that they will
    have an eagle and a whale as husbands. An eagle carries one girl to a cliff, but
    she makes a sinew string, signals a kayaker, descends to a rescue boat, and returns
    home; the eagle is later shot. A whale takes the other girl to the bottom of the
    sea and binds her there. Her two brothers build increasingly swift boats, rescue
    her, and flee while she delays the pursuing whale by throwing garments into the
    water. When the whale reaches shore, he becomes a piece of whalebone.
  language: English
  quote_policy: summarized
