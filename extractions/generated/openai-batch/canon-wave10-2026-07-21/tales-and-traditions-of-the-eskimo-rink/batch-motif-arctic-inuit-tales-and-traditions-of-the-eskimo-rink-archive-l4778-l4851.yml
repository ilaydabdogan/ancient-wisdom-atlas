canonical_text:
  quote: ''
  summary: An editorial note presents the story as widespread in Greenland and as
    having a historical appearance. The narrative begins with three affectionate cousins,
    Kumagdlat, Asalok, and Merak. An old crone living with Kumagdlat falsely claims
    that his cousins intend to kill him. Kumagdlat becomes afraid, avoids them, prepares
    to leave secretly, departs by boat with a misleading message, and is not found
    by Asalok and Merak when they follow. The passage ends by noting that Kumagdlat
    uses a seal-skull amulet on the prow of his boat so that people at inhabited places
    think it is a spotted seal diving.
  language: English
  quote_policy: summarized
