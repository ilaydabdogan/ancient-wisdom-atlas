canonical_text:
  quote: THE GIRL WHO WAS STOLEN BY AN INLANDER.
  summary: A brother takes his sister to a salmon river. An inorusek seizes her and
    carries her inland to huts, intending to marry her. She is offered food, threatened
    with vermin-filled boots, warned by a skeletal former captive, and watched by
    the giant. She deceives him, escapes to her parents’ tent, and the family moves
    to a distant islet to avoid the inlanders.
  language: English
  quote_policy: quoted
