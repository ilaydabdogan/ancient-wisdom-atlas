canonical_text:
  quote: ''
  summary: 'The passage first gives the aftermath of an orphan boy''s night in a haunted
    house: he denies seeing anything, explains that he wanted to barter his dog for
    boots, receives gifts, and obtains a kayak. It then begins the tale of Arnarsarsuak,
    a pregnant woman who flees inland after hearing insults about her unborn child,
    gives birth to a kingulerak, and later is summoned from afar when an orphan brother
    sings her song despite his sister''s warning.'
  language: English
  quote_policy: summarized
