canonical_text:
  quote: ''
  summary: The passage closes one tale with the angakok Inugtujusok being summoned,
    performing an invocation for a little girl, then being ambushed and killed; his
    son attempts revenge but is persuaded to desist, and reconciliation is reported.
    A new tale begins with many brothers living with their old mother, moving for
    provisions, losing their mother, and repeatedly visiting her grave while the youngest
    brother performs household work.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Inugtujusok, identified as an angakok, accepts a message and accompanies the
    bachelor back, while thinking that earlier thoughts of revenge may have softened.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The brothers greet Inugtujusok as aged, give him a good meal, and an evening
    invocation begins; the little girl is said to improve at once.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The brothers thank Inugtujusok and tell him he may sleep without fear and
    return the next day.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Inugtujusok wakes alone, he suspects evil; at the door-sill of the outer
    entrance he meets a man who speaks about the fine weather and dark daybreak, causing
    him to tremble.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The man strikes Inugtujusok on the head, and others rush in and beat him until
    his head is bruised and his brain gushes forth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The son of Inugtujusok arrives in a kayak, rowing so hard that the prow rises
    out of the water, and asks whether they have done for his father.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: People on land threaten the son of Inugtujusok if he approaches; he rushes
    forward in anger but cannot get ashore and declares that they will be his spoil
    the next day.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: The old bachelor warns the son to give up revenge, saying his father was paid
    back according to his deserts because he had been a man-slayer.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The son agrees to desist, saying that carrying out vengeance may create new
    foes and that people who seem to lack relatives may later have avengers appear;
    report says the parties were reconciled.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: A new tale begins with many brothers living together with only one female,
    their old mother; nearby lives an old couple whose children are only girls who
    never leave their parents.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: The brothers move to the other side of the fiord for provender, the old people
    follow and settle farther down the coast, and the brothers' mother dies there.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: After the mother's death, the youngest brother does general work, while the
    elder brothers alternate between kayaking or hunting and visiting their mother's
    grave to mourn.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:13
  text: After returning to their usual winter station, the brothers continue the alternation
    of hunting and grave-visiting, and one day they notice the top-stones at the grave.
  category: sequence
  evidence_refs:
  - ev:12
  - ev:13
