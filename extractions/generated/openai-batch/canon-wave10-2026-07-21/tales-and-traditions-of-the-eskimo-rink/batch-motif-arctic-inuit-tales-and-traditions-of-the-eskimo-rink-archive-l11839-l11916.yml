canonical_text:
  quote: ''
  summary: A first-person story-teller recounts visits from two pairs of little women,
    the first later recognized as hares in women's form. The visitors share berries
    and comment jokingly on foxes and hares. The story-teller claims great speed and
    hearing, receives a knife from Salik in return for the tale, and runs swiftly
    out of sight over a high hill. The passage then introduces a section on ancient
    Kavdlunait and begins a tale of a kayaker approaching Kakortok while trying a
    new bird-javelin.
  language: English
