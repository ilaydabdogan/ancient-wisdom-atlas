canonical_text:
  quote: ''
  summary: After a frightening deed, a brother and sister flee far inland, live without
    friends, and become extremely old. The man, associated with the kivigtok category
    of inland fugitives, later approaches people gathered with an angakok. He identifies
    himself as the one who used his mother as a hunting-bladder, is seen with striking
    aged features, reports that his sister is immobile and that seal-headed beings
    live with them, then leaves and is never seen again. Editorial notes mention Greenlandic
    and Labrador variants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After becoming terrified at their deed, the pair fled eastward to the large
    continent and roamed in the interior parts of the country.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man initially refused to kill birds because he pitied them for restoring
    the use of his eyes; later he killed one swan because his sister wanted it, and
    this was said to be the only bird he caught for the rest of his life.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Far from the coast, the pair built a house, became immensely old, and remained
    without friends.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The man decided to show himself among other people and sought a place where
    there was an angakok, waiting for the time when the angakok would conjure spirits.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before the man reached the house, the angakok complained that a large fire
    was outside and said he would send a spirit out; the passage glosses this as a
    kivigtok-like flame or brightness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The stranger asked whether the people knew of the man who used his mother
    for a hunting-bladder; an old woman recalled hearing of a brother and sister who
    fastened their mother as a bladder to a white whale.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The stranger identified himself as that very man and said he had come to denounce
    himself.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The angakok and his auditors went out and saw the man standing in bright moonlight
    beside a boat, with snowy white hair, a black face, and reindeer-skin clothing.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The man said his sister could no longer move because of old age and that their
    hut was far inland.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The man said their house-fellows were terrible beings with heads like seals.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: After saying he would not show himself again to human creatures, the man turned
    away and was never seen afterwards.
  category: sequence
