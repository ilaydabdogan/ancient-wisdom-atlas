canonical_text:
  quote: ''
  summary: After the death and burial of his wife, Giviok repeatedly tries to leave
    his young son but hesitates. The boy reports seeing his mother with a stranger;
    Giviok sees her in another man's arms, kills both, and places them in the stone
    grave. He then abandons the sleeping child and travels by kayak across a dangerous
    sea, escaping a whirlpool, devouring sea-lice, compact seaweed, and two closing
    icebergs. He reaches land, finds signs of habitation, and enters the house of
    an old hag named Usorsak and her daughter. The hag serves berries mixed with human
    fat; Giviok sees human heads beneath the ledge and prepares a flat stone as protection
    before pretending to sleep.
  language: English
  quote_policy: summarized
