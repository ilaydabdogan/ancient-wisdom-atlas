canonical_text:
  quote: ''
  summary: The passage first concludes an episode in which Kigutikak returns toward
    his own country after voyaging with Europeans, escapes the sailors watching him,
    discards carried iron while descending a steep rock, reaches tents, and is reunited
    with information about his family, rewarding an old bachelor who had provided
    for them. It then begins a South Greenland tale about Kenake, who is killed after
    a dispute while trading with whalers; his grieving wife places his corpse in the
    boat, rejects goods thrown in by the ship's master, while her son secretly keeps
    a knife.
  language: English
  quote_policy: summarized
