  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A great angakok takes all the eggs from a merganser’s nest and later harpoons
    a seal.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The seals speak among themselves about getting a piece of ice and returning
    as umiarissat.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The angakok orders filthy material thrown on the beach to frighten the umiarissat
    away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A boat manned with seals arrives; after scenting the filth, the seals jump
    into the water and the boat appears as a piece of ice.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: A gooseander’s head appears at the entrance with enlarged eyes and scolds
    the angakok for robbing it of its descendants.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The gooseander says it used a charm to make the angakok forget the eggs in
    his kayak so it could retrieve them.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: A note adds that another angakok in a similar case lost his angakok power
