canonical_text:
  quote: ''
  summary: 'The passage contains several brief Greenlandic Inuit traditions: clairvoyant
    spirit travel by Kakortuliak; Uvnek’s encounter with an amarsiniook and explanation
    of a kuinasarinook killing; rival angakok wisdom gained in a cave and dried-up
    lake; revenging animals after an angakok takes eggs and harpoons a seal; an uncanny
    half-bodied guest identified as an igdlokok; and Iviangersook’s journey around
    the Greenland coast.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kakortuliak gives up hunting, becomes clairvoyant, and his soul leaves his
    body to travel inland and along the east coast before returning with reports.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Uvnek, an angakok, narrowly escapes being taken by an amarsiniook during a
    spirit-flight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During Uvnek’s conjuration, brightness is seen and a voice from above the
    house explains that Uvnek escaped because he was an angakok.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The voice says it killed a kuinasarinook, described as a mountain-dwelling
    monster, because it had torn a man to pieces.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Ajagutarsuk gains angakok wisdom in a cave, while Ularpana gains it in a dried-up
    lake.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ajagutarsuk summons tornaks belonging to inlanders, and Ularpana summons upper
