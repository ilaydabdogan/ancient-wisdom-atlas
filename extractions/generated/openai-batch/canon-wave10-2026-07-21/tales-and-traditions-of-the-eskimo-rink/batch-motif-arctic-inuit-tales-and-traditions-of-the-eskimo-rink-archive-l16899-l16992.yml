  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: A man whose cousin and friend was torn apart by a sorcery-made bear seeks
    danger and kills an amarok.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: A stranger visits the man, says he has lost his brother, and shares an evening
