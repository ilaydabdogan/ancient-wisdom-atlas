  locator: 16935-16941
  quote_or_summary: Ularpana flies as an angakok to Ajagutarsuk; Ajagutarsuk summons
    inlanders’ tornaks, while Ularpana summons upper ingnersuit tornaks who defeat
    the inlanders.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; summary supplied instead of extended quotation.
- id: ev:7
  type: summary
  locator: 16943-16951
  quote_or_summary: A great angakok lands on an island, takes all the eggs from a
    merganser’s nest, and on his way home harpoons a seal.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; summary supplied instead of extended quotation.
- id: ev:8
  type: summary
  locator: 16951-16958
  quote_or_summary: The angakok hears seals encourage one another to get a piece of
    ice and return as umiarissat; at home he orders filth thrown on the beach to frighten
    them away.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; summary supplied instead of extended quotation.
- id: ev:9
  type: summary
  locator: 16958-16963
  quote_or_summary: In the evening a boat manned by seals arrives; when they scent
    the filth they jump into the water, and the boat appears as a piece of ice.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; summary supplied instead of extended quotation.
- id: ev:10
  type: summary
  locator: 16963-16973
  quote_or_summary: Later a gooseander’s head with enlarged eyes appears at the entrance,
    scolds the angakok for robbing it of descendants, and says a charm made him leave
    the eggs in the kayak so it could fetch them back.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; summary supplied instead of extended quotation.
- id: ev:11
  type: summary
  locator: 16973-16976
  quote_or_summary: The tale adds that, in another similar case, a merganser deprived
    an angakok of his angakok power.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; summary supplied instead of extended quotation.
- id: ev:12
  type: summary
  locator: 16978-16986
  quote_or_summary: A man loses his beloved cousin and friend, who is torn apart in
    his sight by a bear made by sorcery; in despair he seeks danger and first kills
    an amarok.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; summary supplied instead of extended quotation.
- id: ev:13
  type: summary
  locator: 16986-16996
  quote_or_summary: A stranger visits the lonely house, says he too has lost his brother
    and roams for excitement, and spends the evening there until the hostess serves
    boiled amarok flesh.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; summary supplied instead of extended quotation.
- id: ev:14
  type: summary
  locator: 16996-17005
  quote_or_summary: Before eating, the guest says that the dish is all aslope, then
    vanishes through the entrance; the host follows and examines tracks in the snow.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; summary supplied instead of extended quotation.
- id: ev:15
  type: summary
  locator: 17005-17009
  quote_or_summary: The tracks are made by only one foot, leading the host to conclude
    the guest was an igdlokok, whose body is one half of a human body cut in two.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; summary supplied instead of extended quotation.
- id: ev:16
  type: summary
  locator: 17011-17014
  quote_or_summary: A note says another similar story has two guests who vanish and
    reveal themselves as certain stars, with the same mysterious words about the sloping
    dish.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; summary supplied instead of extended quotation.
- id: ev:17
  type: summary
  locator: 17016-17025
  quote_or_summary: Iviangersook travels south around Greenland, passes Cape Farewell,
    comes eastward to light-haired people of European complexion, and returns through
    a formerly open sound near Ilulissat.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; summary supplied instead of extended quotation.
- id: ev:18
  type: summary
  locator: 17025-17029
  quote_or_summary: Approaching home near Godthaab, Iviangersook loses his brother,
    who is buried on a small island named Uviarniak after the travelers.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; summary supplied instead of extended quotation.
