canonical_text:
  quote: ''
  summary: Nivnitak arrives at a foreign coast and enters a house near frozen water.
    A woman admits him; he sees two young girls and later meets their father, a hunter
    who returns dragging two seals. The host challenges him to a first-meeting contest
    on a bear-skin, then has the women serve food. The girls process seal parts and
    make their father a jacket of seal entrails. The host offers Nivnitak one daughter
    as wife and takes him hunting at seal breathing-holes. Nivnitak imitates the father-in-law
    by catching two seals; the father-in-law leaves him to follow home, and Nivnitak
    returns late.
  language: English
  quote_policy: summarized
