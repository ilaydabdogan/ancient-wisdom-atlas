canonical_text:
  quote: ''
  summary: Several brothers guard their only sister. Akutak and Inuinak visit the
    household while the men are away; Inuinak obtains a bed beside the sister, while
    Akutak is refused. Akutak leaves and is said to bewitch the sister against her
    new husband. The next day Inuinak hunts seals, but the wife becomes violently
    and unnaturally attached to him, eats a piece of grindstone, and pursues him until
    he escapes toward his kayak at dawn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several brothers have one sister, love her dearly, and are reluctant to part
    with her; Akutak and Inuinak live in a northern hamlet.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Akutak proposes that he and Inuinak visit the brothers; Inuinak expects an
    unfriendly reception, but they travel by kayak anyway.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The women of the household cannot welcome the visitors because their husbands
    have ordered them not to receive unmarried men during the husbands' absence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The visitors enter the house, find the sister seated on the southern side
    near her bedding, and choose seats facing her rather than the seats offered at
    the northern end.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: After removing jackets, Akutak is described as fair and soft like a white
    whale, while Inuinak is described as black like a raven.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The men return with seals, the middle brother remarks on the visitors, meat
    is served, and the visitors keep looking at the maiden sister during the evening.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Inuinak calls for the young girl to make a bed for him; she complies, and
    he lies beside her while the brothers ultimately do not interfere.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Akutak asks for a bed as well, but the brothers tell him to lie down by himself;
    in the morning he is gone.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrative states that Akutak, in anger, bewitched the sister to set her
    against her new husband.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The next morning the brothers go out in kayaks; Inuinak later goes out, returns
    with two seals, and his young wife flenses and cuts them up.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After preparing the seals, the wife continually caresses her husband and will
    not leave him alone.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The husband becomes afraid, moves behind a lamp, and tries to keep the wife
    away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The wife catches hold of him and eats a piece of grindstone as if it were
    ice; the brothers say their sister has gone mad and flee after cutting the lashings
    of their boat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Inuinak refuses the brothers' invitation to flee, stays for one night, is
    pursued by his wife until dawn, and escapes toward his kayak as the supplied passage
    breaks off.
  category: sequence
  evidence_refs:
  - ev:9
