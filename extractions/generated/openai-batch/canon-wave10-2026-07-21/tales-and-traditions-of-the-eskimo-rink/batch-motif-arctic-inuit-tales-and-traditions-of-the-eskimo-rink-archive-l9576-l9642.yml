canonical_text:
  quote: ''
  summary: In this passage, Nivnitak is tested within his father-in-law's household.
    After earlier trouble with entrails intended for clothing, he wishes to race the
    father-in-law, finds his burden lightened, and reaches home first with seals swinging
    in the air behind him. A jacket is made for him, and the father-in-law is pleased.
    Later, at the crescent moon, neighbours arrive for ball-playing. The father-in-law
    prepares walrus shoulder-blade implements and instructs the household team. A
    seal-shaped ball of stuffed seal-skin is brought out; during play, the ball strikes
    Nivnitak and knocks him down while the opposing side celebrates.
  language: English
  quote_policy: summarized
