canonical_text:
  quote: ''
  summary: Sikutluk kills his cousin after the cousin induces him to shoot the cousin’s
    dog and then takes offense. Sikutluk leaves with his wife, wanders while killing
    animals and fabulous beasts, reaches foreign inlanders, later departs to seek
    kinsmen, and does not return. An angakok reports that a male beast devoured him,
    while his wife remains among the foreigners.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sikutluk and his cousin live together and are described as loving each other
    dearly; the cousin is the only person in the settlement who possesses a dog.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cousin repeatedly asks Sikutluk to shoot his dog and assures him that
    he will not become angry; Sikutluk then kills the dog.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the dog is killed, the cousin takes offense and challenges Sikutluk,
    saying he means to kill him; Sikutluk shoots the cousin through the breast and
    the cousin dies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sikutluk covers his dead cousin’s boat and tent with heavy stones and leaves
    the place with his wife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrative states that the murder makes Sikutluk thirst for blood and that
    he intends to kill whatever he meets; he begins by killing ptarmigan and reindeer.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Sikutluk and his wife encounter an aviarok or amarok family with young ones;
    the mother and the male each return carrying a young buck, and Sikutluk kills
    both parent beasts after lamenting his murdered cousin.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
  - ev:8
- id: obs:7
  text: A footnote identifies the aviarok as a fabulous animal connected with wolf
    traditions.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sikutluk’s wife sees a kilivfak scratching the earth; Sikutluk hides her in
    a hole or cave, shoots the beast, and the beast falls into the cave opening before
    they get out again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: While crossing glaciers, Sikutluk carries his wife across crevasses and eventually
    reaches the sea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A kayaker offers to bring a boat for Sikutluk and his wife; the boat crew
    are all men, and Sikutluk and his wife learn that they are among erkileks, glossed
    as fabulous inlanders.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sikutluk later leaves to seek kinsmen, gives an expected time of return, and
    does not come back by that time.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: An angakok is promised a reward to tell what happened to Sikutluk; after meditation
