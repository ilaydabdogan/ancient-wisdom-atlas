canonical_text:
  quote: ''
  summary: Two orphaned siblings are neglected, shut into an empty house, and escape
    through a hole in the roof. After finding a seal head, the sister prepares a skin
    with a magic song so the brother can look like a young seal. The brother lures
    kayakers, raises a gale by song, and some hunters drown. The siblings are then
    fetched back by the community. Later they are mistreated again during a deer-hunting
    trip, leave with another party, train to become strong, and eventually return
    south, where the brother has become an excellent seal-hunter.
  language: English
  quote_policy: summarized
literal_observations:
