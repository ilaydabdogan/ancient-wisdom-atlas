canonical_text:
  quote: ''
  summary: A lone kayaker later named Avatarsuak is suspected after two travelling
    kayakers disappear. While hunting, a tupilak, described as a monster made by sorcery,
    emerges from the water, climbs onto his kayak, threatens to eat his entrails,
    and cannot detach after recognizing him as a person of unusual angakok power.
    Women in a boat help pry the creature loose, cut it open, find it filled with
    animal bones, and dispose of its remains in the sea and old tombs. The community
    then attributes the earlier disappearances to the tupilak. The passage ends with
    Avatarsuak beginning another dangerous journey through storm, drift ice, and an
    approaching iceberg.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After his grandfather died, the main man was left alone and took winter quarters
    at a place passed by Southlanders travelling to Pamiut.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two kayakers passed his residence, did not return, and later were reported
    missing; he was suspected of having killed them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: While seeking a firth-seal skin for a hunting bladder in calm weather, he
    went farther into the bay without seeing small firth-seals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A tupilak emerged from the water close behind him, beat the top of his kayak,
    and spoke of wanting entrails.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The tupilak crept onto the back of the kayak, repeated its threat, and pressed
    the stern down so the prow rose.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When he tried to capsize the kayak to either side, his oar struck a hard substance
    below despite the deep water; afterward he slowly righted himself and regained
    strength.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The kayak would not go straight and turned toward uninhabited places; the
    tupilak said it had climbed onto a man of uncommon kind and struggled unsuccessfully
    to detach itself.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Near the beach, women in a boat were called to help; he warned them not to
    attack the creature from the front, and after first fleeing they returned with
    oars to use as levers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The creature stuck fast as if glued to the kayak and came loose with a cracking
    noise; it was about the size of a large firth-seal.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The oldest woman cut open the tupilak and found it stuffed with bones of birds,
    walruses, and seals; the group destroyed it by sinking part in the sea and hiding
    the rest in old tombs.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The man thanked the women and promised repayment; after he told the story
    at home, people believed the tupilak had killed the two missing traders, travellers
    were thereafter unmolested, and the women were paid by Avatarsuak.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Later in spring he went to Pamiut for lead, powder, and tobacco; on the return
    he faced a storming land wind, threatening sky, drift ice, and an iceberg drifting
    toward him.
  category: sequence
  evidence_refs:
  - ev:9
