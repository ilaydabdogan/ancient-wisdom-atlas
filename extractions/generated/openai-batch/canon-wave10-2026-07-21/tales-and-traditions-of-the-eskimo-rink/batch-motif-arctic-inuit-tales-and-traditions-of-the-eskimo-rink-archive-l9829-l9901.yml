canonical_text:
  quote: ''
  summary: An unnamed son trains powerful creatures, obtains a sledge from his father,
    and tests a fast animal team over the frozen sea. Remembering that his sister
    vanished on the ice and that he once saw sledge marks leading seaward, he rejects
    his parents' warnings and crosses the ice toward Akilinek. He reaches another
    shore, finds houses, enters a large house, and recognizes his sister sitting with
    a baby. She tells him that a man in a sledge carried her away that day, that she
    is married, and that her husband is expected home.
  language: English
  quote_policy: summarized
