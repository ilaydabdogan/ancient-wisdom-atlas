candidate_motifs:
- id: motif:1
  label: under-world access to obtain hunting luck
  taxonomy_refs:
  - hero_descent
  basis: A stone-covered opening leads to the under-world, where the old bachelor
    reaches a lake and receives luck-giving matak from the second boat.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage calls the place the under-world, but it is not described as
    an afterlife realm and the protagonist is not characterized as a formal hero.
- id: motif:2
  label: wrong choice among paired supernatural boats reverses fortune
  taxonomy_refs: []
  basis: 'The first and second boats yield opposite hunting outcomes: the second grants
    the old bachelor good luck, while the younger man is misdirected to the first
    and receives bad luck.'
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage does not explain the boats or their occupants, so the contrast
    is limited to stated outcomes.
- id: motif:3
  label: jealous rival’s magical monster turns back on its maker
  taxonomy_refs: []
  basis: A jealous brother creates a tupilak to take Nikook; when exposed, the maker
    dies and the monster remains with the dead body until destroyed.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage names the being as a tupilak but gives few details about its
    making beyond secrecy and sucking the maker’s body.
- id: motif:4
  label: grateful animal repays food with subsistence gifts
  taxonomy_refs:
  - sacred_exchange
  basis: The starving woman gives a partridge to a bear, and later newly killed seals
    drift to her hut as gifts from the grateful bear.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage describes repayment by the bear, but no explicit ritual or
    sacred exchange framework is stated.
- id: motif:5
  label: remote people encountered across an ice boundary
  taxonomy_refs: []
  basis: Travelers crossing ice reach a crevice and speak with people on the opposite
    side who identify themselves as descendants in Akilinek.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: medium
  cautions: The passage gives no further supernatural explanation for the crevice
    or distant people.
- id: motif:6
  label: flight from unwanted marriage into inland solitary life
