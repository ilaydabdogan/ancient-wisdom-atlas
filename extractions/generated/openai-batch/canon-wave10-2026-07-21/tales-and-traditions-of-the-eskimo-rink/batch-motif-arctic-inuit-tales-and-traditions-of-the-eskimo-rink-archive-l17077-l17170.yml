canonical_text:
  quote: ''
  summary: 'The passage contains five short tales: an old bachelor obtains hunting
    luck from the under-world through his mother’s directions; Nikook exposes and
    destroys a jealous man’s tupilak; a starving woman gives a partridge to a bear
    and later receives seals from it; travelers speak across an ice crevice with descendants
    in Akilinek; and a widow and son live inland as Kivigtut until the son dies, revives
    repeatedly, and later appears as a fiery ghost.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old bachelor envies a younger man’s hunting success and favor with women,
    and asks his mother for counsel and aid.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother directs the old bachelor to move a large stone, find an opening
    to the under-world, go to a lake, let the first boat pass, and apply to the second
    boat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old bachelor receives a piece of matak from the second boat, eats it,
    and gains exceptional hunting luck.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The old bachelor tells the younger man about the method but substitutes the
    first boat for the second, and the younger man’s matak brings poor hunting luck.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: When the old bachelor returns for more matak, he can no longer move the stone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Nikook unexpectedly brings home a walrus after having given up seal-hunting,
    and a middle brother becomes jealous.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The jealous brother secretly works on a tupilak, lets the monster suck his
    body, and repeats that it shall take Nikook.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Nikook confronts the tupilak-maker, who falls lifeless; the brothers find
    the tupilak still sucking the dead man.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The brothers kill the tupilak with stones and sink both it and its maker into
    the sea; Nikook then hears bubbling for five nights.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A hunter sees what appears to be his wife naked near his snow-hut, but on
    returning home finds her indoors with their baby.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: After the husband goes mad, the wife flees with her child and, near starvation,
    gives a caught partridge to an approaching bald-headed bear.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: After the woman builds a shore hut, newly killed seals drift in as gifts from
    the grateful bear.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Iviangersook settles in Akilinek and leaves descendants there.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Later travelers from the far north cross ice, reach a crevice, and speak with
    people opposite them who identify themselves as Iviangersook’s descendants in
    Akilinek.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: A persecuted widow flees inland with her little son, educates him to hate
    males, and lives near the inland glacier.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The widow’s brother studies angakok science to discover her retreat and then
    remains with her and her son.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: After the mother dies, the son dies and revives three times after burial;
    on the fourth occasion the mother’s brother pulls the house down over him.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:18
  text: While the mother’s brother spends the night in a cave, the dead son’s ghost
    appears in the shape of a fire and speaks about his upbringing to hate males.
  category: sequence
  evidence_refs:
  - ev:18
