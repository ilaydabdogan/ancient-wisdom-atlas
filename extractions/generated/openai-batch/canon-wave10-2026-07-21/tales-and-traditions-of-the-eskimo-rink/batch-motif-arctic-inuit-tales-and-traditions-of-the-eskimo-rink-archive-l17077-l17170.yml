- id: ev:6
  type: summary
  locator: No. 126, within supplied lines 17077-17170
  quote_or_summary: Nikook, an old man who had stopped seal-hunting, happens to bring
    home a walrus, and the middle of some brothers becomes jealous.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; concise summary.
- id: ev:7
  type: quote
  locator: No. 126, within supplied lines 17077-17170
  quote_or_summary: The jealous brother secretly works at a tupilak and repeats, “Thou
    shalt take Nikook.”
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; short quotation.
- id: ev:8
  type: summary
  locator: No. 126, within supplied lines 17077-17170
  quote_or_summary: Nikook seizes the tupilak-maker, who falls lifeless; the brothers
    later find the tupilak still sucking the dead man.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; concise summary.
- id: ev:9
  type: summary
  locator: No. 126, within supplied lines 17077-17170
  quote_or_summary: The brothers kill the tupilak with stones and sink it and its
    maker into the sea; Nikook hears bubbling for five nights before it stops.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; concise summary.
- id: ev:10
  type: summary
  locator: No. 127, within supplied lines 17077-17170
  quote_or_summary: A hunter at a snow-hut sees his wife naked outside, rushes home,
    and finds her inside with the baby; he then goes mad.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; concise summary.
- id: ev:11
  type: summary
  locator: No. 127, within supplied lines 17077-17170
  quote_or_summary: The wife flees with her child, catches a partridge when near starvation,
    and throws it to an approaching bald-headed bear.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; concise summary.
- id: ev:12
  type: summary
  locator: No. 127, within supplied lines 17077-17170
  quote_or_summary: After she builds a hut on the shore, newly killed seals drift
