  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; concise summary.
- id: ev:13
  type: summary
  locator: No. 128, within supplied lines 17077-17170
  quote_or_summary: Iviangersook travels widely, settles in Akilinek, and leaves descendants
    there.
  source_text_path: texts/public-domain/inuit/project-gutenberg/tales-and-traditions-of-the-eskimo-rink.md
  rights_note: Public domain source; concise summary.
- id: ev:14
  type: summary
  locator: No. 128, within supplied lines 17077-17170
  quote_or_summary: People from the farthest north cross the ice, come to a crevice,
