canonical_text:
  quote: ''
  summary: Salik travels north, is cut off from home by frost, winters alone, and
    later returns to a deserted house for an axe. There he meets a stranger who also
    says his name is Salik and who claims unusual awareness and speed. The stranger
    narrates his childhood in a large family, including daily feeding, an evening
    of household tension marked by unlit overturned lamps and harsh words, spring
    fishing and salmon-catching work, and his own growing depression. At the end of
    the supplied passage, the narrator uses a partridge as a pretext to make his youngest
    brother take his salmon load while he darts away.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Salik goes north; frost cuts off his passage home, so he spends the winter
    in a solitary place and travels still farther north the following spring.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Salik remembers an axe left in a cross-beam of a deserted house, returns,
    and enters the dark house through an open window.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: As Salik reaches for the axe, he hears movement near the ledge on the floor
    and sees a man, who whistles aloud before speaking.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stranger says he is usually aware of what is going to happen, has been
    surprised this once, and moves quickly from place to place collecting scraps and
    leavings after people move away.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Salik gives his name, and the stranger replies that his own name is also Salik;
    the stranger then says he will tell his life story because Salik has outdone him
    by surprising him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the stranger’s childhood account, ten children spent days outside with
    their father, practiced bow-shooting and stone-throwing, and ate meat from a large
    plate filled three times by their mother.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: One evening after twilight the children find the lamps unlit and overturned,
    and the parents exchange tense remarks including a reference to a relative or
    relatives who fled from mankind after being scolded by a wife.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Although the family resumes eating and conversation, the narrating Salik cannot
    forget his mother’s harsh words, eats only a little, and continues thinking about
    the speech through winter.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In spring the family goes to the firth for angmagsat fishing, dries fish,
    builds dykes at mountain-brook outlets to stop salmon, and catches salmon using
    a kayak, stones, and spears.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The narrating Salik remains depressed, asks his brothers to do his salmon
    work, then tells his youngest brother he sees a partridge and asks him to take
    his salmon while he pursues it; the brother agrees and Salik darts off.
  category: action
  evidence_refs:
  - ev:8
