canonical_text:
  quote: ''
  summary: Ernersiak, now an active kayaker, leaves his father behind, visits a tent
    settlement with another kayaker, kills the companion from behind, and returns
    home. His father warns him about making enemies, threatens the settlement, and
    directs him toward northern hunting grounds. Ernersiak and his father travel north,
    are hosted for the winter, and Ernersiak kills a watched red walrus before later
    returning south and never revisiting the north.
  language: English
  quote_policy: summarized
