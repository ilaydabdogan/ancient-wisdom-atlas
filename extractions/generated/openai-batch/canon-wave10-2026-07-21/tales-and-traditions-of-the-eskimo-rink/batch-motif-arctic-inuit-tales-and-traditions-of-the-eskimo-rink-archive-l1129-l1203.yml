literal_observations:
- id: obs:1
  text: Property conditions are described as broadly similar, except that western
    Eskimo timber houses are of greater value; most movable goods are carried in the
    boat during summer travel and carried over land together with the boat when necessary.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Eskimos are said to have maintained internal trade despite limited accumulation
    of property, with some distant journeys made for barter and perhaps also from
    a desire to travel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Trade goods include locally available materials and manufactured items such
    as soapstone, lamps and vessels, whalebone, narwal and walrus teeth, skins, sometimes
    finished boats and kayaks, rarely food, and especially metal or other foreign
    materials.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that in remote ages Eskimo trading expeditions appear to
    have passed their present southern limits, inferred from Eskimo words in southern
    languages and from Scandinavian sagas.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A more modern internal trading communication is described as moving certain
    articles from Asia to middle Eskimo territories and possibly to Davis Strait or
    Hudson Bay, while other articles moved toward Behring Strait.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: No similar communication is said to have existed between those western or
    middle tracts and Greenland, though different parts of Greenland generally maintained
    intercommunication except for the northernmost tribes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: European settlements are said to have altered or annihilated native intercourse,
    while native trade did not substantially organize labor or develop manufacturing
    industries.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Every kindred community possessing a boat and tent is described as needing
    to provide most necessities for a comfortable life, apart from a few principal
    trade articles.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Greenlandic is described as minutely studied lexicographically and grammatically;
    Labrador is also relatively well known, while the western Behring Strait dialect
    is known mainly through imperfect word lists from travelers.
  category: speech
  evidence_refs:
  - ev:6
