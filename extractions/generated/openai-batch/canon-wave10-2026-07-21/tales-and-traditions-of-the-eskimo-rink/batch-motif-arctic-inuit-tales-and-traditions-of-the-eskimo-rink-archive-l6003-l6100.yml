canonical_text:
  quote: ''
  summary: The passage gives an editorial note on multiple manuscript witnesses, then
    narrates a man discovering his wife secretly meeting a masculine being in a lake,
    killing her, taking a transformed fox-woman as a new wife, losing her after his
    cousin comments on her smell, pursuing her to a cave, burning her, and finally
    killing himself. The passage also begins the next tale with an old bachelor pretending
    seal skulls are his children.
  language: English
