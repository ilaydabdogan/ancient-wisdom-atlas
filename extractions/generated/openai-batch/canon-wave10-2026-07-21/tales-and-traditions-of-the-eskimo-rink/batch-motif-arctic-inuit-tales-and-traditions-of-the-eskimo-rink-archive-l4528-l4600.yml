canonical_text:
  quote: ''
  summary: The son reveals that his sight has returned by naming bear remains he has
    seen. He resumes hunting, uses his sister as a human substitute for a hunting-bladder
    when catching white whales, then plots with her to make their mother serve the
    same function in revenge for having blinded him. He harpoons a large whale, lets
    it drag the mother into the sea, and she disappears after crying for her woman's
    knife and reminding him that she nursed him. The passage says she was afterwards
    transformed into a fish and that her spreading hair became the long horny teeth
    from which narwhals originated. Brother and sister return home and lament her
    loss.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The son sees a bear-skin behind the house, bear bones by the entrance, and
    bear paws under the couch, then pretends to wake from dreams in which he saw these
    things.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother repeatedly answers that he must have been thinking about someone
    who hurt him; when he points to the paws, she realizes he has regained the use
    of his eyes and tells him to eat them.
  category: speech
  evidence_refs:
