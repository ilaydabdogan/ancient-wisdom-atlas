  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Real festivals were commonly held in midwinter and also occurred in summer,
    when guests could be more numerous.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Festival entertainments included games, strength and agility matches, singing,
