canonical_text:
  quote: ''
  summary: The passage describes public meetings, meals, festivals, games, songs,
    and nith-songs as institutions of social order. Public shaming, communal censure,
    song contests, and assembly approval or dissent are presented as mechanisms for
    resolving quarrels and punishing breaches of custom, with blood-revenge noted
    as an exception for offences expiated by death. It also briefly mentions violence,
    murder, witchcraft accusations, and angakoks as adversaries of witches.
  language: English
  quote_policy: summarized
