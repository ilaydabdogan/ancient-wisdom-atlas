canonical_text:
  quote: ''
  summary: A visiting brother finds his long-missed sister living with a husband,
    children, and good provisions. He invites them to visit their parents across the
    shore, but the husband hesitates. The brother returns home with children’s clothes
    as gifts; later the sister’s visiting party approaches by sledge over the ice
    but turns back after seeing the brother’s animals and the younger sister’s wild
    jumping. The distressed parents weep, and the brother releases a furious agshik
    to pursue the fugitives; it returns bloody, and the narrator supposes it devoured
    them. A note records alternate versions in which a cousin replaces the brother
    and an old man’s story leads to the capture of a kukissook, a fabulous fanged
    animal.
  language: English
  quote_policy: summarized
