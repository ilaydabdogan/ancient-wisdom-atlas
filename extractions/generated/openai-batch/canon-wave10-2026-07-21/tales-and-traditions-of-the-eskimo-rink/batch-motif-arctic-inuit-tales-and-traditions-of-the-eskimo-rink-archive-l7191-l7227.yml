canonical_text:
  quote: ''
  summary: Javraganak, a servant and stranger among the coast-people, is taunted after
    speaking of food among her own people. She leaves at night to warn her countrymen,
    who later come in number and kill the inhabitants while the men are away hunting.
    Survivors are killed or suffocated in a cave. Returning men, aided by an angakok
    who makes a road through a mountain, destroy Javraganak’s countrymen. Javraganak
    hides, appears when a man calls out that he wishes she would serve him again,
    and is bound with a cord and dragged until she dies.
  language: English
  quote_policy: summarized
