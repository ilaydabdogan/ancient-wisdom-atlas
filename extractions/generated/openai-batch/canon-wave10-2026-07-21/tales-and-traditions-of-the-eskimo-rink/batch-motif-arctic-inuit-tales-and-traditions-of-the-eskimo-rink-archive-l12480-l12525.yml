canonical_text:
  quote: ''
  summary: Tugtutsiak marks some beings that are transfigured as they pass a doorway.
    After strange creatures pass, the lamp and passage change and a dog becomes friendly.
    Tugtutsiak returns home after being thrown and wounded by a bear and a walrus.
    His relatives sing for him until he revives and heals. When he heals, wind, receding
    ice, birds, and later seals appear; hunters give him first seals, and marked seals
    are reported caught far away.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tugtutsiak scratches some passing beings on the forehead after noticing that
    they are transfigured when they pass the doorway, so he may recognize them if
    he later catches them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Additional curious creatures appear, including some with large heads and great
    beards; when they become too numerous, a female speaker again cries, “Stop!”
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the creatures pass, the lamp burns brighter, the passage becomes smooth
    and wide enough, and the dog wags its tail amicably at Tugtutsiak.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the same time, Tugtutsiak’s house-fellows at home observe his belongings
    shaking.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the way home, Tugtutsiak is alternately thrown along by a bear and a walrus;
    the last throw is by the bear, and he reaches his homestead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tugtutsiak’s relatives sit singing for him on his return, and a great man
    orders that a lamp be lit for him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the lamp is lit, Tugtutsiak’s body is seen to be completely wounded from
    the teeth of the bear and walrus, and those present cannot hear him breathe.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The lamps are extinguished and singing begins again; after some time Tugtutsiak
    revives a little, but by daybreak his wounds are still unhealed, so the singing
    continues.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: An ostentatious fellow predicts a meagre hunt, while Tugtutsiak says to wait
    until his wounds heal.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: When Tugtutsiak’s wounds begin healing, a south-east gale suddenly starts;
    a man reports that the ice is rapidly receding from the shore.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Auks and dovekies appear in numbers, and the inhabitants fill their kayaks
    with birds using fowling-spears before evening; the boaster gets only one bird.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When seals are caught, the people give the angakok the first seal of each
    variety; he examines them for his marks but does not find them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A later report says that at Illulissat a thong-seal and a spotted seal were
    caught, each with a mark between the eyes.
  category: sequence
  evidence_refs:
  - ev:8
