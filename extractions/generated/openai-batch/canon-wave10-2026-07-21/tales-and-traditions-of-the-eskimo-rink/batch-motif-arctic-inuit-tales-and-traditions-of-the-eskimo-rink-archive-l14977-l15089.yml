canonical_text:
  quote: ''
  summary: The passage describes Inuarutligaks, also called gnomes or elves, becoming
    enemies of humans, making a small lethal pointing weapon from a willow root and
    stones, journeying north with named family members, encountering half-human half-dog
    beings and a six-legged beast, contracting distances by gesture, changing size
    with clothing and cave-entry, exchanging the youngest son for goods, and renewing
    youth by falling from a precipice five times.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A lasting enmity begins after a man kills an Inuarutligak; afterward the gnomes
    are said to live in deserted places, make hollows in the earth for abodes, and
    avoid human society.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gnomes, desiring vengeance, kill a man whom they meet during an excursion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Because they lack proper arms, they make a fist-sized, pistol-shaped weapon
    from a root of a human-shaped willow-bush and add a black stone with a red stone
    on top; they call it the pointing weapon.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pointing weapon is said to have killing powers, and the Inuarutligaks
    carry it in their hands because they fear its power against their own kin.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father is named Malerke, and his sons are named Kinavina, Kook, Asarfe,
    and Sersok, the fourth son.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The parents and relatives travel north for several years, spending winters
    in hollows in the earth and starting again in early spring.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The travelers meet singular people whose upper limbs are human but whose bodies
    below the waist are shaped like dogs; these beings carry bows and can scent humans
    and animals against the wind.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: One winter the inside of the underground abode is covered with the single
    skin of a six-legged kilivfak; after its flesh is eaten, the bones are covered
    with flesh again up to the sixth time, and it is killed by merely pointing the
    weapon at it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Inuarutligaks can diminish distance by kneeling together, spreading their
    arms toward mountain-tops, and having the foremost cross contracted parts with
    one long stride; false steps leave some of them behind for a long time.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After years of travel they reach Ikerasarsuak, where Inuarutligaks and Inoruseks
    live, wait for frost to make crossing possible, and later reach relatives at Noosak.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: People say that at the beginning of the northern journey the high mountains
    were still without ice and Ikerasarsuak had no glacier.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The elves have clothing for their natural size and larger clothing for human
    size; by beating themselves they can reach human size, and by bending into their
    cave and striking their heads on the roof they return to smallness.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: A Noosak angakok with a childless wife offers three knives, a piece of bearskin,
    and twisted whalebone fishing-lines for a child; Malerke accepts the goods, gives
    the knives to three sons, and sells the fourth and youngest son.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The new father takes the child home and hides him behind the house, but at
    night the child enters the house and slips into the womb of his mother; the child
    is said to be fully conscious while in the womb.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The elves renew youth five times by falling headlong down a precipice; a sixth
    attempt is useless, and they die only after five separate ages except when killed
    by snowslips.
  category: sequence
  evidence_refs:
  - ev:11
