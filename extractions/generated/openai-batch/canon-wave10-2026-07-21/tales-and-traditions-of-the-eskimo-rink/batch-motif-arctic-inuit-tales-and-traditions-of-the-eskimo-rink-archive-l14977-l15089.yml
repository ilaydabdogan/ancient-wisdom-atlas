- id: motif:2
  label: magic pointing weapon made from a human-shaped willow root
  taxonomy_refs: []
  basis: The gnomes create a small weapon from a root of a kneeling human-shaped willow-bush,
    fit it with stones, name it the pointing weapon, and kill the kilivfak by pointing
    it.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: high
