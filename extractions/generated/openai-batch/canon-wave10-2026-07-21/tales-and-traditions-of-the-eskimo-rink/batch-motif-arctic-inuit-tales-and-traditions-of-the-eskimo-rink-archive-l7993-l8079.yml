canonical_text:
  quote: ''
  summary: Merkisalik, grown old and unable to hunt, depends on his only son. While
    camped by a fiord, he and his wife welcome a boat and several kayakers, offer
    food, and hope the visitors will become hunting companions for their son. The
    visitors and Merkisalik’s son go reindeer hunting together, but the strangers
    repeatedly place the son last or far from the best shooting positions, take the
    game themselves, and mock him during meals. Angered, the son deliberately moves
    so that the reindeer are alarmed. The herd flees, but he pursues it over the hills
    and is later found seated and refreshed near many deer he has already killed,
    while the other hunters arrive heated and angry.
  language: English
  quote_policy: summarized
