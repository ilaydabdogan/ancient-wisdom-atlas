canonical_text:
  quote: ''
  summary: The passage recounts how Kunuk demonstrates exceptional strength by removing
    a stuck javelin, how the brothers learn that a powerful man murdered their father-in-law's
    son, and how they defeat that man in a public contest involving a whip and stuffed
    hare. The people ask the brothers to become leaders, but the brothers refuse mastery
    and tell them to hunt freely. The brothers then display hunting prowess and depart
    with others to seek the giant Ungilagtake for revenge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A crowd gathers around the tent to see the strangers, and the chief announces
    a good day for walrus hunting before repeatedly saying his javelin has been taken
    away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The missing javelin is found near the rock leading to the spring; many people
    fail to pull it from the earth, but Kunuk removes it with two fingers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father-in-law tells the brothers that two fully equipped kayaks and weapons
    of his dead son lie under the great boat, and says the strong man murdered that
    son out of envy.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The brothers are summoned to a boxing and fighting match on a plain where
    a pole, a walrus-skin whip with a knot, and a stuffed white hare are set up.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kunuk steps on the stuffed hare, hardens his limbs by charm, is struck by
    the strong man, and comes away unhurt.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Kunuk's brother takes the whip, strikes the strong man when he steps on the
    hare, and kills him on the spot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: After the strong man's death, his inferiors rejoice, ask the brothers to be
    their leaders, and are told by the brothers that they should have no masters and
    should hunt freely.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The brothers practice kayaking and seal-hunting; Kunuk kills a very large
    she-walrus from an unusually great distance and is praised for his dexterity.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The brothers hear of the giant Ungilagtake, who has a huge sword and kills
    even valiant men, and they decide to seek him for revenge connected to attacks
    from their childhood.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The brothers leave in two boats, accompanied by many kayaks, to make war against
    Ungilagtake.
  category: action
  evidence_refs:
  - ev:8
