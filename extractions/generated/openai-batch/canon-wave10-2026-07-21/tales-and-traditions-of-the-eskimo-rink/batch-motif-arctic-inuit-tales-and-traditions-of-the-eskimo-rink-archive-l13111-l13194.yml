canonical_text:
  quote: ''
  summary: A surviving family establishes marriages and a son is named after a deceased
    father. A grandmother protects the child by rubbing him with a mountain-elves'
    whetstone and commanding him to be hard like stone. Later the family travels north,
    encounters a related adversarial group, and a revenge attempt against the child
    fails when a knife cannot pierce him. The parties separate, with the fugitives
    settling permanently. The passage then begins the tale of Ernersiak, whose stepmother
    is suspected after a youngest brother dies.
  language: English
  quote_policy: summarized
