canonical_text:
  quote: ''
  summary: Katerparsuk, a poor orphan boy, tries to make a kayak without help and
    is mocked by a man who frightens him while disguised in a bear-skin. Katerparsuk
    later studies angakok science, becomes a hunter, devises an incantation that makes
    a walrus shed its skin, enters the walrus-skin, and uses it to trick and embarrass
    the former tormentor by taking and then publicly displaying his hunting gear.
  language: English
  quote_policy: summarized
