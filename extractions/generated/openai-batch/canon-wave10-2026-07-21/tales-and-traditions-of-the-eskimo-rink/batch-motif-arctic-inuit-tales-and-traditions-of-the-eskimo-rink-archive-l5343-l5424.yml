    and becomes able to hunt seals.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Katerparsuk sees a walrus dive from the top of a hill, wishes he could make
    it throw off its skin, and develops an incantation after an initial failure.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Katerparsuk tests the incantation on a hare, and the test proves successful.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: At a remote place, Katerparsuk ascends a high hill overlooking the sea, sings
    his magic lay to a walrus, and the walrus comes to the beach and throws off its
    skin.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Katerparsuk creeps into the walrus-skin, swims and dives in it, and can harden
    the skin so harpoons cannot pierce it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The former tormentor has become old and decrepit, has stopped seal-hunting,
    and now goes fishing.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Katerparsuk, wearing the walrus-skin, appears near the old man's fishing place
