  text: Other house-fellows see Katerparsuk's shell and stone implements, are moved
    by them, and later laugh after hearing the wicked man's explanation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After being mocked and embarrassed, Katerparsuk becomes deeply vexed and thinks
