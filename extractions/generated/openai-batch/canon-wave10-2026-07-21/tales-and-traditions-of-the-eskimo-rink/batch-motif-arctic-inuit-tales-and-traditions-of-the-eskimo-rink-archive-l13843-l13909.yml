canonical_text:
  quote: ''
  summary: Niakunguak is drawn into a ball-playing gathering, attacked by a grudging
    kayaker, and reluctantly kills him in a struggle. He warns and trains his son
    for strength and kayaking. Later, two sons of the slain man arrive with Southlanders;
    one declares enmity and tries unsuccessfully to crush a very hard piece of dried
    liver. Niakunguak’s son crushes it to dust, after which the potential enemies
    depart peacefully. The passage then begins a new section introducing Augpilagtok
    and Kangek as a seal-hunting destination.
  language: English
  quote_policy: summarized
