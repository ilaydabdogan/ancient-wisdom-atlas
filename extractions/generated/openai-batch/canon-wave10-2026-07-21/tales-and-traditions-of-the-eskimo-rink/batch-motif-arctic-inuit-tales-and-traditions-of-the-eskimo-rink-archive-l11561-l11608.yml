canonical_text:
  quote: ''
  summary: A restored son appears, dies again when touched too soon by his father,
    and is revived again by old people singing a magic lay. The youth refuses to return
    to his parents because they left him before the mourning period ended, choosing
    instead to stay with those who revived him. Later he says he has married an ingnersuak-woman.
    The old people wish to accompany him to the ingnersuit abode inside a rock, but
    are warned not to look back. When the cliff opens and reveals a rich country,
    they turn around in joy; the vision disappears, their boat strikes the rock, and
    they must live apart, though the ingnersuit provide them with food.
  language: English
  quote_policy: summarized
