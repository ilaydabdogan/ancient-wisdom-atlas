  summary: The passage says that recognizing and confessing one's defects hastens
    the way to Perfection, while imagining oneself perfect prevents advance toward
    the Almighty. It contrasts sensory, outward forms with what is hidden from the
    senses, describes the lover's love as visible while the Beloved or Friend is hidden
    or absent, and urges the lover to renounce attachment to outward forms. It concludes
    with an image of sunlight reflected by a wall and instructs the addressee to seek
    the always-shining Source of Light rather than stones or borrowed light.
