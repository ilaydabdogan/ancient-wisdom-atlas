  quote: ''
  summary: The speaker addresses the Beloved and says the Beloved's own beauty exceeds
    spiritual beauty and description. Imagination of Him increases light in the eye,
    but the presence of His Union dims it. The speaker venerates that beauty, while
    the heart is described as desiring the Beloved, being fed by that desire, being
    unworthy of such Love, and becoming like radiant day after dwelling in the Beloved's
    air.
