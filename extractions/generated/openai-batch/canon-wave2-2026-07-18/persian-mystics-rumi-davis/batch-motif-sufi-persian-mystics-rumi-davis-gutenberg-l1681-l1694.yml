  quote: With thee, my love, hell itself were heaven.
  summary: A damsel asks her lover which city from his travels he finds most delightful.
    He answers that the best place is wherever his beloved dwells or appears, because
    her presence makes narrow, low, or harsh places seem spacious, paradisal, heavenly,
    or garden-like, while her absence makes flowers seem fiery.
