  summary: An editorial note states that the editors intend the book series to promote
    goodwill and understanding between East and West. It frames the East as an old
    world of Thought and the West as a new world of Action, and expresses hope that
    deeper knowledge of Oriental ideals and philosophy may revive a charitable spirit
    toward people of other creeds and colours. The note is signed by L. Cranmer-Byng
    and S. A. Kapadia, with a Northbrook Society address.
