canonical_text:
  quote: ''
  summary: 'The passage gives a biographical account of Jalálu''d-Dín Rúmí: his birth
    at Balkh, his father''s departure from Balkh, an early encounter with Farídu''d-Dín
    ''Attár, childhood marvel stories, later teaching and founding of the Maulavi
    dervish order, his authorization of music and dance, an explanation of funeral
    dancing as the spirit''s release from the body, reports of ecstatic whirling around
    a pillar while composing poetry, and his marriages.'
  language: English
  quote_policy: summarized
