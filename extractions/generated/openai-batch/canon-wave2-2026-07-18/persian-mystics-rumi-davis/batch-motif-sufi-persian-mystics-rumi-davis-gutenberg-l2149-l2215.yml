  quote: ''
  summary: The passage presents devotional separation from God as bitter, contrasts
    sense-bound earthly light with God's heavenward light, describes love of God as
    an inward flame, locates God in the believer's heart by a prophetic saying, warns
    against self-satisfaction through the example of Iblis, distinguishes burdensome
    knowledge from true knowledge from God, and contrasts formal ritual lovers with
    those whose hearts burn with Love.
