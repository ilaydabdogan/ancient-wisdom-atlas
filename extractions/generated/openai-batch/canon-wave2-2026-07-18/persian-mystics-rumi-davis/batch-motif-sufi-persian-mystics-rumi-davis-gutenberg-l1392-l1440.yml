  quote: ''
  summary: A sequence of lyric stanzas presents a first-person speaker as “Thy Rose”
    transformed by an addressed “Thou,” then describes winter, spring, Time, and a
    worm as weavers; God’s likeness set on all things; Love as both enclosing and
    freeing the soul; the world as God’s mirror; and love-moved souls circling like
    streams toward an Ocean King while nature longs for the addressee.
  language: English
