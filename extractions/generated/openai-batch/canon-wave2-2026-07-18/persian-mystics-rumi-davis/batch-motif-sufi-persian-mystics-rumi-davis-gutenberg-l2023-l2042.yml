  summary: The passage says that each night the divine addressee frees spirits from
    the body's snare and cage, making them pure and unaware of worldly rank. It then
    describes the kingly soul as destroying and rebuilding the body, giving up family
    and possessions for love of God, finding a Hidden Treasure by destroying its house,
    and cleansing a channel for a fresh stream.
