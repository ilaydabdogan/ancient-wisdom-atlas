    mirrors through which men hear words whose real source is Universal Reason or
    the Word of God. It describes earthly forms as shadows of the Sun of Truth and
    says self-negation prepares apprehension that only the One exists; spiritual intoxication
    lifts people to the beatific vision of eternal Truth.
