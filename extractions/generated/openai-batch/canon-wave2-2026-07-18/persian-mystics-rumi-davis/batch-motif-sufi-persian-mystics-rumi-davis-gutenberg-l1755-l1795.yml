    jewels, wine, and silk, but Iblis wants stronger aids. When God shows him the
    beauty of women, Iblis rejoices and says he will prevail. The passage then states
    that lovers, beloveds, and their love perish, while God alone moves nonentities
    into love. A final speaker commands angels to bring someone back and says his
    sins are erased because the eyes of his heart were set on Hope.
