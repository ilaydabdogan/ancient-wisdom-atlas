canonical_text:
  quote: Without the dealing of Love there is no entrance to the Beloved.
  summary: The passage contrasts earthly attachment with divine Love. It says Love
    is necessary for entrance to the Beloved, that Love and the Lover endure eternally,
    that other objects of attachment are borrowed or dead, and that the Soul receives
    the beloved image like a mirror. The House of Love is described as boundless,
    and the passage invokes Joseph and women cutting their hands in his presence.
  language: English
