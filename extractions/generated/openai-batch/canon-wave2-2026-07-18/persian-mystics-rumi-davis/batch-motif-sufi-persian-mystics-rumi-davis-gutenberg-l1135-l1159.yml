canonical_text:
  quote: When I looked at myself, I saw myself no more
  summary: The passage states that only God contemplates God's beauty, then describes
    two lights becoming indistinguishable. In a visionary scene, a moon descends,
    snatches up the speaker, and carries the speaker through the sky. The speaker
    loses self-perception, becomes soul-like in the moon, sees only the moon, and
    receives revelation of the Eternal Theophany. The heavens merge in the moon, the
    speaker's being is hidden in the sea, Wisdom rises with a voice, and bodily foam-forms
    dissolve into spirit in the ocean.
  language: English
  quote_policy: quoted
