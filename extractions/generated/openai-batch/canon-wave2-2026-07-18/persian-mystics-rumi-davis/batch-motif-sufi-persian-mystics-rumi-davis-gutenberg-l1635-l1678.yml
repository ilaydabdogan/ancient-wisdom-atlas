literal_observations:
- id: obs:1
  text: The passage says that if spiritual manifestations alone were sufficient, creation
    of the world would have been needless, and if spiritual thought equaled love of
    God, outward temples and prayers would not exist.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Speakers say they bow before His edict, stake precious life to gain His favor,
    keep thought of the Beloved in their hearts, and devote their work and life to
    serving Him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Beloved is said to kindle a destructive torch that burns myriads of lovers'
    souls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Lovers dwelling within the sanctuary are compared to moths burnt by the torch
    of the Beloved's face.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The heart is urged to hasten to God, who will shine upon it and appear as
    a sweet garden rather than as a terror.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: God is said to infuse a new Soul into the addressee's soul and fill the addressee
    like a goblet with wine.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The addressee is told to take abode in His Soul and in heaven, and He is compared
    to a heavenly Scribe who opens the heart's book to reveal mysteries.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage distinguishes sea from foam and tells the addressee to neglect
