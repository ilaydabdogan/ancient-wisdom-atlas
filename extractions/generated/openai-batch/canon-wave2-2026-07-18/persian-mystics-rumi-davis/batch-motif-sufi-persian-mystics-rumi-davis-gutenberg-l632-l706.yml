canonical_text:
  quote: ''
  summary: An editorial analysis presents Sufism as the religion of Love. It treats
    earthly love as a limited manifestation of divine Love, describes Love as unseen
    because God is unseen, gives the image of a child burying a butterfly prompted
    by Love, and culminates in self-loss in God, encounter with the Beloved, and the
    image of God's light shining through human lanterns.
  language: English
  quote_policy: summarized
