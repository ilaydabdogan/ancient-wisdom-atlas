  summary: The passage joins a resurrection stanza with a stanza on the Beloved's
    return. It describes public tumult and lights, the world giving birth to the World
    Everlasting, transformation from dust and ignorance into spirit and wisdom, guidance
    through divinely caused pain, the Beloved returning at night, instructions to
    abstain from opium, food, speech, tangled thoughts, life, and the world, an invitation
    into the cup-bearer's circle, and images of wide earth, prison, Paradise, and
    the Life of the world.
