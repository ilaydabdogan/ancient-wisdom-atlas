  summary: The passage is an editorial introduction to Al Ghazzali. It gives his birth
    in Tus, early loss of his father, care by a Sufi, studies, appointment at Bagdad,
    renown, pursuit of truth, escape from skepticism through a divine flash of light,
    review of theologians, philosophers, and Sufis, turn toward Sufi intuition, renunciation
    of his professorship, devotional retirement, pilgrimage to Mecca, return to Tus,
    death as reported by his brother Ahmad, and later assessments of his service to
    Sufism and Islam.
