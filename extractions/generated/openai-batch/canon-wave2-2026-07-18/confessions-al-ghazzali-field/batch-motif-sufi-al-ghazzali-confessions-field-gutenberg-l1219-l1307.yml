  quote: ''
  summary: The passage explains how certitude about prophetic inspiration is to be
    gained through evidence, reliable tradition, study, and repeated experiential
    verification rather than isolated miracles alone. It contrasts miracle-signs with
    magic, describes Sufi transport as a direct apprehension of truth, addresses causes
    of unbelief, and argues that inspiration belongs to a sphere beyond ordinary intelligence,
    illustrated by dreams and by the hidden destructive power of fire.
  language: English
  quote_policy: summarized
