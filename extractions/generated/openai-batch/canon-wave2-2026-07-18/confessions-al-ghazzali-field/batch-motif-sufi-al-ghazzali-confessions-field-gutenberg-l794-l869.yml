canonical_text:
  quote: truth does not cease to be true because it is found among them.
  summary: Al-Ghazzali warns against rejecting true doctrines merely because they
    come from suspect teachers or groups. He contrasts weak minds that judge truth
    by its professors with wise discerners who first seek truth, then recognize its
    followers. He uses images of gold in earth, coin-assaying, dangerous swimming
    or serpent-handling, and honey in a cupping glass to argue that truth can be separated
    from error or impurity.
  language: English
  quote_policy: quoted
