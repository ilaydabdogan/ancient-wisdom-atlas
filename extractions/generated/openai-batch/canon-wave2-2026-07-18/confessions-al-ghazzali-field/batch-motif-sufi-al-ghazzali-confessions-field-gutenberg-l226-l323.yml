canonical_text:
  quote: ''
  summary: Ghazzali opens with praise of God and blessings on Muhammad, then answers
    a brother who asks about his search for truth among religious sciences, doctrines,
    sects, philosophy, and Sufism. He describes divergent sects as a dangerous ocean,
    recounts his lifelong examination of doctrines, reflects on inherited religion
    and innate disposition, defines certitude as knowledge immune to doubt, and uses
    a hypothetical rod-to-serpent miracle to illustrate that wonder should not overturn
    certain knowledge.
  language: English
  quote_policy: summarized
