canonical_text:
  quote: ''
  summary: The passage warns that logic may be abused in religious matters, describes
    physics as the study of bodies and natural elements while affirming nature’s dependence
    on God, criticizes metaphysical propositions attributed to philosophers, and contrasts
    philosophical moral doctrine with teachings said to be borrowed from Sufis. It
    presents Sufis as devout figures who invoke God, combat desire, renounce worldly
    pleasures, receive ecstatic revelations about the soul, and draw heavenly blessings
    such as rain and subsistence to the world, with the Companions of the Cave named
    as ancient examples.
  language: English
  quote_policy: summarized
