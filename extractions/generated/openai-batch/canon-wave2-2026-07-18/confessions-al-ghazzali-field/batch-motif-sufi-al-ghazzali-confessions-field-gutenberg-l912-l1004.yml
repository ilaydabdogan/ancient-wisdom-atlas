canonical_text:
  quote: ''
  summary: The narrator turns to Sufism after studying other doctrines. He distinguishes
    doctrinal knowledge from lived spiritual experience, concludes that salvation
    requires renunciation of passions and worldly attachments, and describes an extended
    inner conflict between religious aspiration and worldly ambition. A divine impediment
    then prevents him from lecturing, bringing bodily weakness and a medical diagnosis
    that his illness originates in the heart and sadness.
