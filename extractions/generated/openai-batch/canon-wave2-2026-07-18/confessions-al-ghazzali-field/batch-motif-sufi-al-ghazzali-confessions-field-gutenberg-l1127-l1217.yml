canonical_text:
  quote: "“inspiration is a special state in which the inner eye discovers, revealed
    by a celestial light, mysteries out of the reach of reason.”"
  summary: The passage presents human knowledge as developing through senses, discrimination,
    reason, and a higher faculty called inspiration. Sleep is described as a divinely
    given glimpse of inspiration, in which invisible things may be perceived clearly
    or allegorically. Denial of inspiration is compared to ignorance of color by a
    person blind from birth. Inspiration is said to be revealed more fully to Sufi
    adepts through ecstatic transport and reflected in Sufi initiation.
  language: English
  quote_policy: quoted
