canonical_text:
  quote: ''
  summary: 'The passage classifies the philosophic sciences, then discusses mathematics
    and logic in relation to religion. Mathematics is described as demonstratively
    certain and religiously neutral, but capable of causing two harms: overextending
    confidence in mathematicians into unbelief, and ignorant religious rejection of
    exact sciences such as eclipse calculations. The passage cites prophetic words
    about eclipses as signs of God and states that logic is also religiously neutral
    and used by both theologians and philosophers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The philosophic sciences are divided into six sections: mathematics, logic,
    physics, metaphysics, politics, and moral philosophy.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mathematics is said to include calculation, geometry, and cosmography, and
    to prove nothing for or against religion.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says mathematics may produce two bad results despite resting on
    proofs that cannot be refuted once understood.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: One described result is that a student impressed by mathematical proofs may
    extend confidence to all philosophy and judge rejection of religion to be reasonable.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The passage presents an objection that excellence in one branch of knowledge
    does not imply excellence in every branch, and that ancient philosophers are demonstrative
    in mathematics but conjectural in religious questions.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Those called “apes of unbelief” are described as rejecting the objection,
    following passion and vanity, and maintaining the pre-eminence of mathematicians
    in all branches of knowledge.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
