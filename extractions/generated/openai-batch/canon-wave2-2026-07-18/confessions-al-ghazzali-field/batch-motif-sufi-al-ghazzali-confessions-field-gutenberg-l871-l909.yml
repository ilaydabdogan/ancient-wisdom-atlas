- id: obs:2
  text: The passage says that reading philosophic writings full of vain and delusive
    ideas should be forbidden, comparing this to forbidding slippery riverbanks to
    someone who cannot swim.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says children should be prevented from touching serpents, and
    that a snake-charmer avoids touching snakes in front of his young child to prevent
    imitation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A snake-charmer is described as taking a serpent, separating venom from antidote,
    setting the antidote aside, and destroying the venom.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A skilled coin-assayer is described as taking good coins from the bag of a
