canonical_text:
  quote: ''
  summary: The passage warns that philosophical writings may mix respected prophetic
    and Sufi sayings with errors, causing readers to trust and accept falsehood. It
    argues that such writings should be kept from the unprepared, like slippery riverbanks
    from non-swimmers or serpents from children. It then says a wise learned person
    should distinguish harmful from beneficial content, as a snake-charmer separates
    venom from antidote or a coin-assayer separates good coins from bad, and should
    not withhold what is truly useful.
  language: English
  quote_policy: summarized
