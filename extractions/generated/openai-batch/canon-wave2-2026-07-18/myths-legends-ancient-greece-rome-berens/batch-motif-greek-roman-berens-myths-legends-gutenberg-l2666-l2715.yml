  summary: The passage describes the later and less central Roman worship of Apollo,
    temples dedicated to him in response to plague and by Augustus, the placement
    of Sibylline oracles in gilt chests in Apollo's Palatine temple, the Cumaean Sibyl's
    sale of prophetic books to Tarquinius Superbus, and the provenance and iconography
    of the Apollo Belvedere statue.
