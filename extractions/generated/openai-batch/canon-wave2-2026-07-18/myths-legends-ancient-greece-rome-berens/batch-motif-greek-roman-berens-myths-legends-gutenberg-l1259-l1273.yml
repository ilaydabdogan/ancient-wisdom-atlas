  quote: turned Lycaon into a wolf
  summary: Zeus journeys through Arcadia to verify reports of human wickedness. The
    Arcadians honor him, but King Lycaon doubts his divinity, plans to murder him,
    and serves him human flesh as a test. Zeus is not deceived; he overturns the table,
    transforms Lycaon into a wolf, and destroys Lycaon's sons by lightning except
    for Nyctimus, who is saved by Gaea.
