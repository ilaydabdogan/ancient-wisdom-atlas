- id: obs:1
  text: Stress of weather keeps Odysseus and his companions at Trinacria for a month,
    their provisions from Circe are exhausted, and they suffer hunger.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: While Odysseus sleeps, Eurylochus persuades the hungry men to break their
    vows and kill some sacred oxen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Helios becomes angry after the slaughter; the hides creep, the joints on spits
    bellow like living cattle, and Helios threatens to withdraw his light unless Zeus
    punishes the crew.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Zeus promises Helios vengeance and later causes a storm in which lightning
    strikes the ship, the ship breaks apart, and all the crew drown except Odysseus.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Odysseus survives by clinging to a mast, drifts for nine days, escapes Charybdis
