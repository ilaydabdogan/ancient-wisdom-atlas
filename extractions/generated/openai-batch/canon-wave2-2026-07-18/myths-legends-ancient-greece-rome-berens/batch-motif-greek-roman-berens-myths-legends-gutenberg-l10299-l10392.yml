  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Calypso welcomes and cares for the shipwrecked Odysseus, becomes attached
    to him, and offers him immortality and eternal youth if he will remain with her
    forever.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Odysseus refuses Calypso's offer because he longs for Penelope, his young
    son, and home; he is nevertheless detained on Ogygia for seven years against his
    will.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Athena intercedes with Zeus for Odysseus, and Zeus sends Hermes to command
