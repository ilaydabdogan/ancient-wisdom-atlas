candidate_motifs:
- id: motif:1
  label: Violation of sacred cattle followed by divine punishment
  taxonomy_refs:
  - divine_judgment
  basis: The crew kill sacred oxen belonging to Helios; Helios demands punishment,
    and Zeus destroys the ship, drowning the crew.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage frames the killing as impious vow-breaking, not as a formal
    sacrifice.
- id: motif:2
  label: Lone survivor of shipwreck continues the homeward return
  taxonomy_refs:
  - return
  basis: After Zeus destroys the ship, only Odysseus survives by clinging to a mast,
    reaches Ogygia, later departs on a raft for his native land, and survives another
    wreck before Scheria.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The motif is extracted from a segment of a larger return narrative; the
    final homecoming is not included in this passage.
- id: motif:3
  label: Divine detention on an island and commanded release
  taxonomy_refs:
  - departure
  - divine_beloved
  basis: Calypso detains Odysseus for seven years, offers immortality and eternal
    youth if he remains, and releases him only after Zeus sends Hermes with a command.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage states Calypso is attached to Odysseus, but it does not narrate
    a full marriage or formal union.
