canonical_text:
  quote: ''
  summary: Odysseus and his men are trapped by weather at Trinacria, exhaust their
    provisions, and the men kill sacred cattle of Helios. Helios demands punishment,
    Zeus destroys the ship with storm and lightning, and only Odysseus survives, reaching
    Ogygia. Calypso receives him, offers immortality and eternal youth, but detains
    him seven years until Athena intercedes and Zeus sends Hermes to order his release.
    Odysseus departs on a raft, is wrecked again by Poseidon, receives aid from Leucothea,
    and reaches Scheria. Nausicaa and her attendants find him, provide food and clothing,
    and invite him toward the palace, where Alcinous and Arete receive him hospitably
    and hear his account.
  language: English
  quote_policy: summarized
