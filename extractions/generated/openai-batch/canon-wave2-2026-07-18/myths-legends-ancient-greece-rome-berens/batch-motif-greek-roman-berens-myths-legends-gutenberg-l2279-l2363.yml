canonical_text:
  quote: ''
  summary: The passage describes Apollo as a light-bringing god associated with music,
    poetry, the arts, the Muses, and prophecy. It narrates his descent to earth to
    found an oracle near Parnassus and Crissa, his slaying of the serpent Python,
    the building of his temple, his dolphin-shaped diversion of a Cretan ship whose
    crew become his priests, the establishment and influence of the Delphic oracle,
    and his later moral role as a pardoner and protector of those undergoing expiation.
  language: English
  quote_policy: summarized
