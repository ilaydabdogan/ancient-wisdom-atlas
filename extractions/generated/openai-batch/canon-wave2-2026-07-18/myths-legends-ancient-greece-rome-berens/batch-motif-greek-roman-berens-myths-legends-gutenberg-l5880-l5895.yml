  summary: The passage identifies Picumnus and Pilumnus as Roman household divinities
    presiding over newborn infants. It describes Silvanus as a woodland deity resembling
    Faunus and the Greek Pan, presiding over plantations and forests and protecting
    field boundaries. Silvanus is represented as an old man carrying a cypress tree,
