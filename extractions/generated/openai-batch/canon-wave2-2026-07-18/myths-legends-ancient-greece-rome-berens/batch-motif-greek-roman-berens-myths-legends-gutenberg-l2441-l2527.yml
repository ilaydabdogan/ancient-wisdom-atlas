canonical_text:
  quote: ''
  summary: The passage recounts Asclepius' power to heal and revive the dead, Zeus'
    killing of him, Apollo's revenge and punishment, Apollo's service to Admetus,
    Alcestis' substitutionary death and Heracles' rescue of her from Death, the deaths
    and plant transformations of Hyacinthus and Cyparissus, Apollo and Poseidon's
    service to Laomedon with miraculous wall-building by music, and Marsyas' musical
    contest with Apollo ending in flaying and the formation of a river from mourners'
    tears.
  language: English
  quote_policy: summarized
