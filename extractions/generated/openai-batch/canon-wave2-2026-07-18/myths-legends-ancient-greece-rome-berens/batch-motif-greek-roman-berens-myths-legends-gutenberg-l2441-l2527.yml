candidate_motifs:
- id: motif:1
  label: restoration of the dead challenges divine order
  taxonomy_refs:
  - death_rebirth
  - resurrection
  - divine_judgment
  basis: Asclepius restores the dead to life; Aides complains; Zeus kills Asclepius
    to prevent humans from defying the gods.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage describes Asclepius' power to restore others, not Asclepius'
    own resurrection.
- id: motif:2
  label: divine revenge followed by punitive servitude
  taxonomy_refs:
  - divine_judgment
  - divine_parent_child
  basis: Apollo destroys the Cyclops after Zeus kills his son Asclepius, and Zeus
    punishes Apollo with loss of power and servitude to Admetus.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage presents the servitude as punishment but gives no ritual or
    legal context beyond Zeus' sentence.
- id: motif:3
  label: bride won through impossible animal-yoking task with divine aid
  taxonomy_refs: []
  basis: Pelias will give Alcestis only to the suitor who yokes a lion and wild boar
    to a chariot; Apollo helps Admetus accomplish this.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No available taxonomy reference precisely matches the bride-task pattern.
- id: motif:4
  label: life-for-life substitute sacrifice
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  - death_rebirth
  basis: Admetus can live if a family member dies for him; Alcestis secretly accepts
    death and dies as he recovers.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage frames the exchange through the Fates' condition and Alcestis'
    devotion; it does not describe a formal sacrificial rite.
- id: motif:5
  label: hero descends into a tomb and compels Death to restore the beloved
  taxonomy_refs:
  - hero_descent
  - resurrection
  - return
  basis: Heracles descends into Alcestis' tomb, restrains Death, and secures the promise
    that she will be restored to her family.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The descent is specifically into a tomb, not an extended underworld journey
    in this passage.
- id: motif:6
  label: dead beloved transformed into plant
  taxonomy_refs:
  - death_rebirth
  - seasonal_cycle
  basis: Hyacinthus is changed into a flower after death, and Cyparissus is changed
    into a cypress-tree after dying of grief.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The plant changes preserve names and forms after death, but the passage
    does not describe literal return to human life or seasonal recurrence.
- id: motif:7
  label: exiled gods in mortal service
  taxonomy_refs:
  - divine_judgment
  basis: Apollo is forced into Admetus' service, and later Apollo and Poseidon are
