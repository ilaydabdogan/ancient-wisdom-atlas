canonical_text:
  quote: ''
  summary: The passage describes Hephaestus/Vulcan as son of Zeus and Hera, god of
    beneficial fire, workmanship, mechanical arts, and the hearth. It recounts his
    fall from heaven to Lemnos, his lameness, his teaching of metalwork, his revenge
    on Hera with a trapping golden throne, his return and reconciliation through Dionysus,
    his Olympian craftsmanship, his marriage to Aphrodite, his crafted works for gods
    and mortals, the guarded temple on Mount Etna, and his usual artistic representation
    as a smith.
  language: English
  quote_policy: summarized
