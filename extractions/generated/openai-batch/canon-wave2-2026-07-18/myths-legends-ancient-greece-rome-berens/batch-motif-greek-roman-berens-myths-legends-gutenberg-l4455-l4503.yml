canonical_text:
  quote: ''
  summary: A handbook passage describes the Moirae or Fates as three sister-goddesses
    who regulate mortal destiny through the image of a life-thread, contrasts them
    with Homer’s single Moira, summarizes their artistic representations, and notes
    associations with punishment, prophecy, Persephone’s return, and birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The duration of human existence and the destinies of mortals are described
    as regulated by three sister-goddesses: Clotho, Lachesis, and Atropos, daughters
    of Zeus and Themis.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The power of the Moirae over human fate is represented as a thread spun for
    each human life from birth to the grave.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage divides the thread-work among the sisters: Clotho winds flax
    on the distaff, Lachesis spins the thread of life, and Atropos cuts it with scissors
    when a life is about to end.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Homer speaks of one Moira, daughter of Night, as a
    moral force governing the universe and compelling submission from both mortals
    and immortals, including Zeus.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says later poets amplified the conception of one inexorable fate
    into the three Moirae as deities presiding over mortal life and death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Poets are said to represent the Moirae as stern, inexorable, aged, hideous,
    and lame, while painters and sculptors depict them as beautiful maidens with grave
    but kindly aspects.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A representation of Lachesis shows her young and beautiful, seated spinning,
    with one comic and one tragic mask at her feet.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: When represented at the feet of Aides in the lower world, the Moirae wear
    dark robes; when appearing in Olympus, they wear bright star-bespangled garments,
    sit on radiant thrones, and wear crowns.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Moirae are described as indicating to the Furies the precise torture that
    the wicked should undergo for their crimes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Moirae are described as prophetic divinities with sanctuaries in many
    parts of Greece.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Moirae are mentioned as assisting the Charites in conducting Persephone
    to the upper world for reunion with Demeter, and as appearing with Eileithyia,
    goddess of birth.
  category: action
  evidence_refs:
  - ev:9
