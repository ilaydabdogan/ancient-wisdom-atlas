canonical_text:
  quote: ''
  summary: 'The passage describes the introduction of Aesculapius'' worship to Rome
    during a pestilence and the building of his temple near the Tiber. It then summarizes
    Roman traditions about Janus: his high rank, mediation of prayers, rule over beginnings,
    gates, entrances, and the home, his protection of Rome through a hot spring against
    the Sabines, his wartime sanctuary, New Year and monthly rites, two-faced iconography,
    and a tradition that he was once a wise Italian king deified after death and given
    knowledge of past and future by Saturn/Cronus.'
  language: English
  quote_policy: summarized
