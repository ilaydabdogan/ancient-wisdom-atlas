canonical_text:
  quote: ''
  summary: Hermes sees Herse in a procession from the temple of Pallas-Athene, seeks
    access to her through her sister Agraulos, pays the demanded money, and then confronts
    Agraulos after Athene causes envy to possess her. Hermes turns Agraulos into black
    stone and persuades Herse to become his wife. The passage then describes Hermes'
    statuary attributes, a Hermes-and-infant-Bacchus marble group by Praxiteles, and
    sacrifices offered to Hermes.
  language: English
  quote_policy: summarized
