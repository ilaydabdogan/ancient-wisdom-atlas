  summary: The passage describes the Cerealia, a women-only festival for Ceres in
    which women in white carried torches to represent Ceres' search for Proserpine,
    and games in the Circus Maximus requiring white clothing. It then describes the
    Vestalia, a women-only festival for Vesta marked by barefoot procession to her
    temple, and summarizes the Vestal Virgins' selection, thirty-year term, duty to
    maintain Vesta's ever-burning flame, privileges, chastity vow, and punishment
    for violation.
