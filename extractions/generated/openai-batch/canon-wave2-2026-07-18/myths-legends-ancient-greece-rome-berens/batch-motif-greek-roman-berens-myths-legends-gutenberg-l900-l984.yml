canonical_text:
  quote: ''
  summary: The passage describes Zeus/Jupiter as ruler of heaven and earth, god of
    aerial phenomena, personification of natural and moral order, patron of state-life,
    and father of gods and men. It also describes Olympus as his divine home, gives
    standard visual attributes of Zeus, and recounts the celebrated Olympian statue
    by Phidias and its lightning sign of divine approval.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Zeus is presented as the presiding deity of the universe and ruler of heaven
    and earth, with four chief aspects: aerial phenomena, laws of nature, state-life,
    and fatherhood of gods and men.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:2
  text: Zeus can produce storms, tempests, and darkness by shaking his aegis, and
    thunder, lightning, clouds, and rain act at his command.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: Zeus is associated with natural and moral order, regulated time, changing
    seasons, and the succession of day and night; Cronus is contrasted as representing
    time absolutely or eternity.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:4
  text: Zeus is described as founder of kingly power, patron of princes, protector
    of assemblies, and guardian of the community's welfare.
  category: action
  evidence_refs:
  - ev:5
- id: obs:5
  text: As father of the gods, Zeus ensures that deities perform their duties, punishes
    misdeeds, settles disputes, and counsels them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: As father of men, Zeus rewards truth, charity, and uprightness, punishes perjury,
    cruelty, and inhospitality, and advocates for poor wanderers and the needy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: The home of Zeus is placed on Mount Olympus, a high mountain between Thessaly
    and Macedon whose summit is hidden in cloud and mist and extends into Aether.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:8
  text: Zeus and Hera have a palace on the cloud-capped summit of Olympus; other gods
    live lower down, and Heroes or Demi-gods live below them in other palaces.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Zeus is commonly represented as a majestic bearded man accompanied by an eagle,
    bearing thunderbolts and lightning, and sometimes wearing an oak-leaf wreath.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The statue by Phidias at Olympia is described as a forty-foot ivory-and-gold
    seated Zeus holding an image of Nike and a sceptre with an eagle; a flash of lightning
    is interpreted as Zeus's approval of the work.
  category: sequence
  evidence_refs:
  - ev:10
