  quote: ''
  summary: The passage recounts Dionysus's capture by Tyrrhenian pirates and their
    miraculous punishment, his meeting and marriage with Ariadne at Naxos, his descent
    to retrieve his mother from the realm of shades, the Midas golden-touch episode,
    and common representations and companions of Dionysus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tyrrhenian pirates see Dionysus in the form of a beautiful youth, seize and
    bind him, place him on their vessel, and intend to sell him as a slave in Asia.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fetters drop from Dionysus's limbs, and the pilot identifies the event
    as a miracle, calls the youth a god, and urges the crew to return him to shore.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the pirates refuse to release Dionysus, the ship stands still; vines,
    ivy, streams of wine, and heavenly music appear around the vessel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dionysus assumes the form of a lion; a bear appears and kills the captain;
    the sailors leap overboard and are changed into dolphins, while the pilot is spared.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dionysus resumes his true form, speaks kindly to the steersman, announces
    his name and dignity, and asks to be landed at Naxos.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Naxos, Dionysus finds Ariadne, daughter of Minos, abandoned by Theseus,
    asleep on a rock after sorrow and weeping; he reveals himself and she consents
    to become his wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dionysus descends to the realm of shades in search of his mother, conducts
    her to Olympus, and she is admitted among the immortal gods under the name Thyone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Silenus, intoxicated, strays into Midas's rose-gardens, is bound with roses
    by attendants, is hospitably entertained by Midas for ten days, and is led back
    to Dionysus.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Dionysus offers Midas any favor because of his treatment of Silenus, and Midas
    asks that everything he touches turn to gold.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Midas's food, wine, and couch turn to gold; he repents and implores Dionysus
    to remove the gift; Dionysus tells him to bathe in the river Pactolus, after which
    the power leaves him and the river sands contain grains of gold.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Early representations show Dionysus as a grave, bearded, dignified man in
    Eastern royal dress; later ones show him as a beautiful youth with long curls,
    a vine or ivy wreath, a thyrsus, and a two-handled drinking cup.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Dionysus is represented riding on a panther or in a chariot drawn by lions,
    tigers, panthers, or lynxes, and he is usually accompanied by Bacchantes, satyrs,
    and mountain-nymphs.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
