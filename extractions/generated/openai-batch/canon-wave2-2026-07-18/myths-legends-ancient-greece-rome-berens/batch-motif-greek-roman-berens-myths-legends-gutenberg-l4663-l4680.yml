canonical_text:
  quote: ''
  summary: The passage describes the Graeae as three sisters and servants of the Gorgons,
    named Pephredo, Enyo, and Dino. It contrasts an earlier conception of them as
    kindly personifications of venerable old age with a later depiction as misshapen
    old women sharing one eye, one tooth, and one gray wig. Perseus visits their far-western
    abode during his expedition against Medusa, takes their shared eye, tooth, and
    wig when they refuse information, and restores them only after receiving directions
    to the Gorgons.
  language: English
