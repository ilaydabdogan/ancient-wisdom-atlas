  summary: Nyx, daughter of Chaos and personification of Night, is described as mother
    of mysterious and inexplicable things including death, sleep, and dreams. United
    with Erebus, she has Aether and Hemera as children, presented as a poetic indication
    that darkness precedes light. She dwells in a palace in the dark lower world and
    is depicted as a beautiful veiled woman in dark robes, seated in a chariot drawn
    by two black horses, accompanied by stars.
