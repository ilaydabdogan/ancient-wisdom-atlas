candidate_motifs:
- id: motif:1
  label: Heroic single combat ending in death and prophecy
  taxonomy_refs: []
  basis: Hector stands against Achilles in single combat, dies at the Scaean gate,
    and foretells Achilles' death at the same place.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives a battlefield prophecy but does not describe its later
    fulfillment in this excerpt.
- id: motif:2
  label: Desecration of a fallen enemy's body
  taxonomy_refs: []
  basis: Achilles drags Hector's corpse behind his chariot, and Thersites later pierces
    Penthesilea's corpse with a lance.
  evidence_refs:
  - ev:2
  - ev:9
  confidence: high
  cautions: 'The two corpse-desecration acts differ in context: Achilles acts against
    an enemy he killed, while Thersites attacks a corpse Achilles is prepared to return.'
- id: motif:3
  label: Funerary sacrifice and provision for the dead in the afterlife
  taxonomy_refs:
  - sacrifice
  - afterlife_journey_map
  basis: Dogs and horses are slain to accompany Patroclus in the realm of shades,
    and twelve Trojan captives are slaughtered and placed on the funeral pyre.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage states the afterlife purpose for the animals; it does not
    explicitly state the same purpose for the human captives beyond their placement
    in the funeral rites.
- id: motif:4
  label: Funeral games for a fallen hero
  taxonomy_refs: []
  basis: After Patroclus' cremation and burial of bones, the heroes compete in chariot-races,
    boxing, wrestling, foot-races, and armed single combats for prizes.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No available taxonomy reference directly names funeral games.
- id: motif:5
  label: Warrior queen seeks vengeance and falls to the hero
  taxonomy_refs: []
  basis: Penthesilea leads Amazons to aid the Trojans, intends to avenge Hector, challenges
    Achilles, and is killed in single combat.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage frames Penthesilea as a maiden-warrior and daughter of Ares,
    but this extraction avoids broader Amazonian interpretation beyond the excerpt.
- id: motif:6
  label: Mercy or honor toward the fallen adversary
  taxonomy_refs: []
  basis: Penthesilea asks Achilles for forbearance; Achilles lifts her as she dies,
    praises her valor, and offers to return her body.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: This motif contrasts with Achilles' earlier treatment of Hector, so it
    should not be generalized to all defeated enemies in the passage.
- id: motif:7
  label: Divine parentage and god-made armour as heroic equivalence
  taxonomy_refs:
  - divine_parent_child
  basis: Memnon is described as son of a goddess and equipped with armour by Hephaestus,
    making him comparable to Achilles, who is likewise described as goddess-born and
    divinely armed; Penthesilea is also identified as daughter of Ares.
  evidence_refs:
  - ev:5
  - ev:11
  confidence: high
  cautions: The equivalence is explicitly made for Memnon and Achilles; Penthesilea's
    divine parentage is stated but not used in the passage to establish equal footing.
- id: motif:8
  label: Heroic withdrawal and mediated return
  taxonomy_refs:
  - departure
  - return
  basis: Achilles abandons the Greek army after the dispute over Thersites and later
    returns when Odysseus persuades him.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is a limited military withdrawal and return within the war narrative,
    not a full quest departure-return cycle.
