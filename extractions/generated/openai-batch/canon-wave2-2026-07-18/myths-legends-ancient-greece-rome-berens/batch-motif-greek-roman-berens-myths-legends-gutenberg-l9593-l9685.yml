canonical_text:
  quote: ''
  summary: Achilles pursues and kills Hector, abuses Hector's corpse, conducts funeral
    rites and games for Patroclus, fights and kills Penthesilea while honoring her
    body, kills Thersites for desecrating Penthesilea's corpse, withdraws after a
    dispute, returns through Odysseus' persuasion, and faces the arrival of Memnon,
    a divinely descended and divinely armed Trojan ally.
  language: English
  quote_policy: summarized
