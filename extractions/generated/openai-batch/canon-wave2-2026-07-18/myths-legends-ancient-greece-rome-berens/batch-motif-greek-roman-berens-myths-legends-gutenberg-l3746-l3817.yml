canonical_text:
  quote: ''
  summary: The passage describes Hermes/Mercury as messenger, ambassador, conductor
    of shades, patron of eloquence, herds, merchants, cunning, thieves, travellers,
    roads, wealth, good luck, and dice. It then recounts his birth to Zeus and Maia
    in a cave on Mount Cyllene and narrates his precocious theft of Apollo's cattle,
    invention of the lyre from a tortoise shell, deception and punishment of Battus,
    sacrifice of stolen oxen, concealment of evidence, and return to Cyllene.
  language: English
  quote_policy: summarized
