canonical_text:
  quote: ''
  summary: During the Argonauts' return, a hippocamp leads them through the desert
    while they carry the Argo, and they reach the sea after twelve days. At Crete,
    Medea uses magic to put the brass giant Talus to sleep, causing his vulnerable
    ankle to be wounded and killing him. The heroes return to Iolcus; the Argo is
    consecrated to Poseidon and later placed among the constellations. Jason brings
    Medea and the Golden Fleece to Pelias, who refuses to abdicate. Medea tricks Pelias's
    daughters with a rejuvenated ram/lamb demonstration, leading them to kill their
    father. Jason and Medea flee to Corinth, have three children, and Jason later
    seeks to marry Glauce. Medea sends Glauce a poisoned robe that kills her.
  language: English
  quote_policy: summarized
