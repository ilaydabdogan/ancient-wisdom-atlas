canonical_text:
  quote: ''
  summary: 'The passage describes the Panathenaea at Athens in honour of Athene-Polias.
    It distinguishes annual Lesser and quadrennial Greater festivals, then details
    the Greater Panathenaea: Athenian maidens weave a gold-embroidered Peplus showing
    Athene''s victory over the Giants; the Peplus is carried on the mast of a mechanically
    moved ship in a public procession with olive branches to Athene''s temple, where
    it is placed on the goddess''s statue. The festival also includes poetry recitation,
    literary presentation, music, athletic and horse contests, wrestling, armoured
    dances by boys, public golden crowns for civic benefactors, and prizes of oil
    from Athene''s sacred olive-tree.'
  language: English
  quote_policy: summarized
