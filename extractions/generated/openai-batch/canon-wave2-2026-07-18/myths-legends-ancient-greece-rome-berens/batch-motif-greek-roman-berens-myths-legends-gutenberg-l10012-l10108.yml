canonical_text:
  quote: ''
  summary: Odysseus and twelve companions enter the cave of the Cyclops Polyphemus,
    who traps them with a stone, refuses their plea for Zeus-protected hospitality,
    and eats several men. Odysseus gives Polyphemus wine, identifies himself as Noman,
    blinds him with a heated olive-staff, and escapes with the survivors hidden under
    sheep. After Odysseus reveals his real name, Polyphemus hurls a rock at the ship
    and calls on Poseidon to curse Odysseus's return. The passage then begins the
    next episode, in which Odysseus reaches Aeolus, king of the Winds.
  language: English
  quote_policy: summarized
