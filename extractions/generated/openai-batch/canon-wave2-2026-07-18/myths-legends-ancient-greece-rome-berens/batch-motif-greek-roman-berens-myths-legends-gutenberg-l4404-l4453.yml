canonical_text:
  quote: ''
  summary: The passage describes the Erinyes or Furies as female divinities of conscience,
    remorse, vengeance, and punishment; gives their names and variant origins; describes
    their underworld and earthly punitive functions, terrifying iconography, pursuit
    of Orestes, propitiatory naming as Eumenides, later beneficent interpretation,
    sacrifices, and Athenian temple.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Erinyes or Furies are described as female divinities who personify the
    pangs of an evil conscience and remorse after wrong-doing.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Their named members are Alecto, Megaera, and Tisiphone.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: One origin account says they sprang from the blood of Uranus when Cronus wounded
    him; another says they were daughters of Night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Their abode is placed in the lower world, where Aides and Persephone employ
    them to chastise and torment shades who committed crimes and were not reconciled
    to the gods before Hades.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: They also appear on earth as avenging deities who pursue and punish murderers,
    perjurers, and those who fail in duties to parents, strangers, or old age.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says no remote place is beyond their reach and no mortal dares
    to offer asylum to their victims.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: They are represented with wings, black bodies, blood dripping from their eyes,
    snakes in their hair, and a dagger, scourge, torch, or serpent in their hands.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: When pursuing Orestes, they hold up a mirror in which he sees the face of
    his murdered mother.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: They are also called Eumenides, meaning the well-meaning or soothed goddesses,
    because people feared to call them by their proper title and hoped to propitiate
    them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: In later times they are described as salutary agencies who punish sin and
    uphold morality and social order.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: In later Athenian representation they appear as earnest maidens in short tunics
    like Artemis, while retaining a snake-shaped wand of office.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Their sacrifices consist of black sheep and a honey-and-water libation called
    Nephalia, and a temple to the Eumenides stood at Athens near the Areopagus.
  category: object
  evidence_refs:
  - ev:9
