canonical_text:
  quote: ''
  summary: Theseus seeks public favor at Athens by capturing and sacrificing the Marathonian
    bull, then undertakes the voyage to Crete to kill the Minotaur and end the periodic
    Athenian tribute. Ariadne, inspired by Aphrodite, gives him a sword and thread
    for the labyrinth; he kills the Minotaur and escapes with his companions. At Naxos,
    Dionysus appears in a dream and claims Ariadne as his destined bride, so Theseus
    leaves her. The returning ship keeps its black sails, causing Aegeus to believe
    Theseus dead and throw himself into the sea. Theseus then becomes king and unifies
    Attica, renewing games and festivals.
  language: English
  quote_policy: summarized
