candidate_motifs:
- id: motif:1
  label: Monster-subduing hero as public benefactor
  taxonomy_refs:
  - culture_hero
  basis: Theseus wins public favor by capturing the Marathonian bull, ends the Minotaur
    tribute, saves companions, and later becomes a civic organizer and ruler.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:7
  - ev:10
  confidence: high
  cautions: The passage is a later handbook-style summary; it presents heroic and
    civic actions without extended ritual interpretation.
- id: motif:2
  label: Labyrinth ordeal with monster and guiding thread
  taxonomy_refs:
  - labyrinth_initiation
  basis: Theseus enters Daedalus's labyrinth, confronts the Minotaur, and escapes
    by following Ariadne's thread.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage gives a literal labyrinth episode; any initiatory reading
    beyond the ordeal structure is not stated by the passage.
- id: motif:3
  label: Periodic human tribute to a monster
  taxonomy_refs: []
  basis: Athens is compelled every nine years to send seven youths and seven maidens
    of noble families to become prey of the Minotaur.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The text calls the offering a tribute and the victims prey; it does not
    explicitly frame this as ritual sacrifice.
- id: motif:4
  label: Divine-assisted heroic quest
  taxonomy_refs:
  - mystical_quest
  basis: An oracle directs Theseus to Aphrodite, Aphrodite inspires Ariadne's aid,
    and Ariadne supplies the sword and thread that enable Theseus's success.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The taxonomy reference is broad; the passage frames the episode chiefly
    as heroic daring rather than a formal mystical quest.
- id: motif:5
  label: Failed return signal causing death
  taxonomy_refs:
  - return
  basis: Theseus promises white sails as a sign of safe return, but the ship keeps
    its black sails, causing Aegeus to think Theseus dead and leap into the sea.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: medium
  cautions: The link to the return motif is limited to the homecoming and mistaken
    sign element.
- id: motif:6
  label: Mortal woman decreed as divine bride
  taxonomy_refs:
  - divine_beloved
  - sacred_marriage
  basis: Dionysus tells Theseus in a dream that the Fates have decreed Ariadne as
    his bride, and Ariadne is later found and wooed by the god.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage states decreed bridehood and wooing but does not narrate wedding
    ritual or married life.
- id: motif:7
  label: Sacrifice to deities around heroic action
  taxonomy_refs:
  - sacrifice
  basis: Theseus sacrifices the Marathonian bull to Apollo and, before the Cretan
    voyage, sacrifices to Aphrodite as guardian and protectress.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: high
  cautions: Only these explicit sacrifices are included; the human tribute is not
    classified here as sacrifice because the passage describes it as tribute and prey.
- id: motif:8
  label: Heroic succession and civic unification
  taxonomy_refs:
  - royal_legitimacy
  - culture_hero
  basis: After Aegeus's death, Theseus ascends the vacant throne with Athenian approval,
    centralizes Attic government, strengthens Athens, and institutes civic festivals.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The royal-legitimacy link rests on accession and approval rather than
