canonical_text:
  quote: ''
  summary: The passage describes Pegasus as a winged horse who sprang from Medusa
    after Perseus slew her, flew to Olympus, and was received by the immortals. Zeus
    housed Pegasus and used him to carry thunder and lightning. Pegasus normally allowed
    only gods to mount him, except Bellerophon, whom he carried at Athene's command
    to fight the Chimaera. The passage then relates Pegasus to the Muses, poetic inspiration,
    and the fountain Hippocrene, including a story in which Pegasus stops Mount Helicon
    from rising and creates the spring by stamping the ground.
  language: English
  quote_policy: summarized
