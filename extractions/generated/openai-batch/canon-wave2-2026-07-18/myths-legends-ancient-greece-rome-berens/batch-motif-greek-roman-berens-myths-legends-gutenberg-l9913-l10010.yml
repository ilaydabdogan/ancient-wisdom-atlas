canonical_text:
  quote: ''
  summary: After the sack of Troy, Greek homecomings are affected by divine wrath,
    storms, shipwreck, delayed wandering, murder at home, vengeance, divine pursuit,
    expiatory travel, and the lotus episode in which Odysseus must force forgetful
    companions back to their ships.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Greeks committed desecration and cruelty during the sack of Troy, and
    the passage states that the gods' wrath made their homeward voyage dangerous and
    deadly for many.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nestor, Diomedes, Philoctetes, and Neoptolemus reached Greece safely, while
    Menelaus and Helen were driven by storms to Egypt and reached Sparta only after
    years of wandering.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ajax the Lesser desecrated Athena's temple, was shipwrecked near Cape Caphareus,
    clung to a rock, boasted that he did not need divine help, and was overwhelmed
    after Poseidon split the rock with his trident.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Clytemnestra, seeking revenge for the sacrifice of Iphigenia, allied secretly
    with Aegisthus during Agamemnon's absence and plotted Agamemnon's death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Clytemnestra pretended joy at Agamemnon's return, prepared a warm bath, and
    at her signal Aegisthus came from a concealed adjoining chamber and killed the
    defenceless Agamemnon despite Cassandra's warnings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: During the following massacre, Electra saved her young brother Orestes, who
    was taken in by Strophius and raised with Pylades; the friendship of Orestes and
    Pylades is described as proverbial.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: As an adult, Orestes sought to avenge Agamemnon, returned to Mycenae in disguise
    with Pylades, and sent Clytemnestra a false report that Orestes had died in a
    chariot-race at Delphi.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Orestes revealed himself to Electra, learned of her treatment and Clytemnestra's
    joy at his reported death, then killed Clytemnestra and afterward Aegisthus.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the matricide, the Furies pursued Orestes; at Delphi, Apollo commanded
    him to go to Taurica-Chersonnesus and bring the statue of Artemis to Attica, which
    he accomplished with Iphigenia's aid.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Athena's interposition finally freed Orestes from the Furies; Orestes then
    ruled Argos, married Hermione, and gave Electra in marriage to Pylades.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Odysseus sailed from Troy toward Ithaca with twelve treasure-laden ships,
    but the passage says ten more years would pass before he could embrace his wife
    and child.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Odysseus's fleet reached the lotus-eaters' land; the lotus was sweet as honey,
    caused oblivion of home and country, and made his companions unwilling to leave
    until Odysseus forced them back to the ships.
  category: sequence
  evidence_refs:
  - ev:11
