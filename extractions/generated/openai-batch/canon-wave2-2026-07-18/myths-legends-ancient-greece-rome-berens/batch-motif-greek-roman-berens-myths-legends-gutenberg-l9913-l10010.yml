candidate_motifs:
- id: motif:1
  label: Divine punishment after desecration and impiety
  taxonomy_refs:
  - divine_judgment
  basis: The Greeks' desecrations call down divine wrath, Ajax is destroyed after
    temple desecration and an impious boast, and Orestes is pursued by divine avengers
    after matricide.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:8
  confidence: high
  cautions: The passage combines different offenses and punishments rather than presenting
    a single unified ritual judgment scene.
- id: motif:2
  label: Perilous and delayed return from war
  taxonomy_refs:
  - return
  basis: The section frames the Greeks' homeward voyages as dangerous; Menelaus and
    Helen wander for years, Ajax dies at sea, and Odysseus is delayed for ten further
    years.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage summarizes multiple returns and only begins Odysseus's longer
    homecoming.
- id: motif:3
  label: Return home to domestic betrayal
  taxonomy_refs:
  - return
  basis: Agamemnon's homeward voyage is successful, but murder by Clytemnestra and
    Aegisthus awaits him on arrival at Mycenae.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is a return-related motif here, but the passage's emphasis is on
    murder and revenge rather than travel difficulty.
- id: motif:4
  label: Child sacrifice as cause of revenge
  taxonomy_refs:
  - sacrifice
  basis: Clytemnestra's conspiracy against Agamemnon is explicitly motivated by revenge
    for the sacrifice of Iphigenia.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The sacrifice itself is only referenced as prior background and not narrated
    in this passage.
- id: motif:5
  label: Hidden avenging son returns in disguise
  taxonomy_refs:
  - return
  - royal_legitimacy
  basis: Orestes, saved as a child and raised away from home, returns in disguise
    with Pylades, deceives Clytemnestra with a false death report, kills the usurping
    pair, and later assumes Argos's rule.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:9
  confidence: high
  cautions: Royal legitimacy is inferred only from Orestes's later assumption of Argos;
    the passage does not give a formal succession argument.
- id: motif:6
  label: Blood-guilt pursuit and expiatory sacred mission
  taxonomy_refs:
  - divine_judgment
  - mystical_quest
  basis: After killing his mother, Orestes is pursued by the Furies and receives Apollo's
    command to undertake a perilous mission involving Artemis's statue.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage states that Orestes must convey the statue; it does not describe
    the full expedition in detail here.
- id: motif:7
  label: Oblivion-producing food that threatens homecoming
  taxonomy_refs:
  - return
  basis: The lotus causes forgetfulness of home and country and makes Odysseus's companions
    want to remain, so Odysseus forces them back to continue the voyage.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage describes the plant's effects but does not call the plant
