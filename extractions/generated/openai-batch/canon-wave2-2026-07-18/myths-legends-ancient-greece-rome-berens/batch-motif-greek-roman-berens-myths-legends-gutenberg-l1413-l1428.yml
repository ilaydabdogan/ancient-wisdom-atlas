  quote: ''
  summary: 'The passage describes Juno as a Roman divinity associated with Greek Hera
    but portrayed differently: Juno is honored as a matron, housewife, and protectress
    of married women and is believed to guard every woman throughout life. It lists
    Roman temples and the title Juno Moneta, notes a public mint near that shrine,
    and describes the Matronalia festival celebrated by married women on March 1.'
