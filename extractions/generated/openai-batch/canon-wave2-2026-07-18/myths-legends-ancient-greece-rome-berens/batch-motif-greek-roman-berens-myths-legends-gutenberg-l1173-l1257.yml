canonical_text:
  quote: ''
  summary: The passage recounts several unions or attempted unions between Zeus and
    mortal women, with transformations, disguises, jealous actions by Hera, births,
    death, and astral or animal changes. It then describes a Greek belief that Zeus
    sometimes visited humans in disguise to punish or reward them, followed by the
    story of Zeus and Hermes testing hospitality in Phrygia and rewarding Philemon
    and Baucis while their village is destroyed by water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Callisto is described as the daughter of Lycaon, a huntress in Artemis's train,
    and as having vowed never to marry.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Zeus takes the form of the huntress-goddess and obtains Callisto's affections.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hera changes Callisto into a bear; Artemis fails to recognize her and kills
    her in the chase; Zeus places Callisto among the stars as Arctos, the bear.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Alcmene is betrothed to Amphytrion; while he is absent, Zeus assumes his form
    and obtains her affections; Heracles is named as the son of Alcmene and Zeus.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hera disguises herself as Beroe, Semele's nurse, and persuades Semele to ask
    Zeus to appear in full divine glory; bound by his oath, Zeus does so, and Semele
    is consumed in flames amid thunder and lightning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Io is a priestess of Hera; Zeus transforms her into a white cow; Hera obtains
    the cow and places her under Argus-Panoptes's guard at an olive-tree in Hera's
    grove.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Argus-Panoptes has a hundred eyes and keeps watch; Hermes, by Zeus's command,
    puts all the eyes to sleep with a magic lyre and kills him; Hera places Argus's
    eyes on the peacock's tail.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hera sends a gadfly to torment Io, who wanders until she reaches Egypt, resumes
    her original form by the Nile, and gives birth to Epaphus, later king of Egypt
    and builder of Memphis.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Zeus appears to Danae as a shower of gold.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that Greeks supposed Zeus sometimes assumed human form
    and descended from heaven to visit people, generally to punish the guilty or reward
    the deserving.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: Zeus and Hermes travel through Phrygia seeking hospitality and are welcomed
    only by Philemon and Baucis; during the meal, the wine bowl is miraculously replenished.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The gods tell Philemon and Baucis that their native place is doomed because
    of wickedness, lead them to a hill, and the couple see a watery plain where the
    village had been, with only their cottage remaining and changing into a temple.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Philemon and Baucis ask to serve the gods in the temple and to end life together;
    after a life of worship, they die at the same instant and are transformed by Zeus
    into trees standing side by side.
  category: sequence
  evidence_refs:
  - ev:8
