- id: motif:2
  label: Jealous goddess persecutes mortal beloveds of Zeus
  taxonomy_refs:
  - divine_beloved
  basis: Hera changes Callisto into a bear, deceives Semele into a fatal request,
    and obtains, guards, and torments Io.
  evidence_refs:
