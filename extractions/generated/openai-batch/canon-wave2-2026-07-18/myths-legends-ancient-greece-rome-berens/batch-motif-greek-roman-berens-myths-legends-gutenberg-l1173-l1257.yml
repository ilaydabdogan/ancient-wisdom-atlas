- id: motif:1
  label: Divine lover assumes altered form to approach a mortal woman
  taxonomy_refs:
  - divine_beloved
  - shapeshifter
  basis: Zeus appears in the form of Artemis to Callisto, assumes Amphytrion's form
    with Alcmene, and appears to Danae as a shower of gold.
  evidence_refs:
