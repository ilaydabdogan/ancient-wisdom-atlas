comparison_claims:
- id: claim:1
  claim: The passage identifies Roman Liber with Greek Dionysus and says Liber was
    worshipped under the name Bacchus.
  claim_level: same_function
  target: Greek Dionysus / Roman Liber-Bacchus identification
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives the identification and vegetation function but does
    not compare myths or rites in detail.
- id: claim:2
  claim: The passage attributes later Greek doctrines of future reward and punishment
    to Egyptian theories entering Greece through expanded foreign contact, with Eleusinian
    teachers helping inculcate the doctrine.
  claim_level: historical_contact
  target: Egyptian future-state theories and later Greek/Eleusinian afterlife belief
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: This is reported by the handbook passage; no primary evidence or detailed
    mechanism is provided here.
- id: claim:3
  claim: The passage says Aides later takes over functions of Plutus, the god of riches,
    and becomes regarded as giver of wealth from metals concealed in the earth.
  claim_level: same_function
  target: Aides/Pluto and Plutus as wealth-giving divinity
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The passage frames Plutus as a distinct divinity and describes a later
    functional overlap, not a complete identity.
