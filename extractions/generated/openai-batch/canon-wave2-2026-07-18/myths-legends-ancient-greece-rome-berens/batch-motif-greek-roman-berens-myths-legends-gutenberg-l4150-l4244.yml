candidate_motifs:
- id: motif:1
  label: mapped journey through the afterlife realm
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage lists entrances to Erebus, underworld rivers, the Styx crossing,
    Charon’s ferry, Minos’s tribunal, and Cerberus as guardian.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage is a handbook synthesis rather than a single continuous mythic
    narrative.
- id: motif:2
  label: postmortem divine judgment
  taxonomy_refs:
  - divine_judgment
  basis: All shades appear before Minos, confess earthly actions, and receive a sentence
    of happiness or misery according to their deeds.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The judge is Minos; the passage does not state that Aides himself pronounces
    judgment.
- id: motif:3
  label: funerary toll required for afterlife passage
  taxonomy_refs:
  - afterlife_journey_map
  - sacred_exchange
  basis: Charon ferries only shades whose bodies received funereal rites and who carry
    an obolus toll; others wander for a hundred years.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The exchange is specifically a ferry toll in the described afterlife geography.
- id: motif:4
  label: heroic descent or visit to the lower world
  taxonomy_refs:
  - hero_descent
  basis: Odysseus is said to visit the lower world at Circe’s command and commune
    with shades of Trojan War heroes.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage only alludes to the Odyssey episode and does not narrate the
    full descent.
- id: motif:5
  label: sacrificial blood revives the dead shade’s awareness
  taxonomy_refs:
  - sacrifice
  basis: The shades’ intellect can be roused to full activity by drinking blood from
    sacrifices offered by living friends.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The restoration is temporary mental vigor, not bodily resurrection.
- id: motif:6
  label: underworld threshold guardian prevents return
  taxonomy_refs:
  - afterlife_journey_map
  basis: Cerberus guards the tribunal and permits all shades to enter but none to
    return.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: No separate taxonomy reference for a threshold-guardian motif was supplied.
- id: motif:7
  label: vegetation divinity and dated festival
  taxonomy_refs:
  - seasonal_cycle
  basis: Liber presides over vegetation and has the Liberalia festival on March 17.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not explicitly interpret the festival as a seasonal-cycle
