canonical_text:
  quote: ''
  summary: The passage identifies Roman Liber with Greek Dionysus/Bacchus and notes
    the Liberalia. It then describes Aides/Hades/Pluto as ruler of Erebus, early Greek
    fear of him, Homeric conceptions of shades, later doctrines of afterlife reward
    and punishment, underworld entrances, rivers, Charon’s ferry and toll, Minos’s
    tribunal, and Cerberus as guardian.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Liber is described as a Roman divinity presiding over vegetation, identified
    with Greek Dionysus, worshipped under the name Bacchus, and honored at the Liberalia
    on March 17.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aides, Aidoneus, or Hades is described as the son of Cronus and Rhea and youngest
    brother of Zeus and Poseidon.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aides rules the subterranean region called Erebus, inhabited by shades or
    spirits of the dead and by dethroned, exiled deities defeated by Zeus and his
    allies.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aides is called the successor of the primeval divinity Erebus, after whom
    the realms were named.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Early Greeks are said to have regarded Aides as a feared enemy; his name was
    not mentioned, invokers struck the earth, and sacrificers turned away their faces.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Homeric-age belief described here, a dead mortal’s spirit occupied
    a shadowy outline of the human form and was driven by Aides into his dominions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The shades are described as semi-conscious; drinking sacrificial blood offered
    by living friends could temporarily restore their former mental vigor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Heroes are said to be the only beings supposed to enjoy any happiness in a
    future state, though even they longed for earthly activity.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Odysseus is said to have visited the lower world at Circe’s command and communed
    with shades of Trojan War heroes, including Achilles.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Homer’s Odyssey is described as placing the entrance to Erebus beyond the
    furthermost edge of Oceanus in the far west, near the Cimmerians in eternal mists
    and darkness.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says later Greek ideas of future reward and punishment were influenced
    by Egyptian theories and taught especially by teachers of the Eleusinian Mysteries.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the later description, Aides receives shades with hospitality, Hermes conducts
    shades to Hades, and Aides is regarded as a giver of wealth in the form of metals
    hidden in the earth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Later poets are said to mention multiple entrances to Erebus, mostly caves
    and fissures, including places at Taenarum, Thesprotia, and near Lake Avernus
    in Italy.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: Aides’ dominions contain four great rivers; three crossed by all shades are
    Acheron, Cocytus, and Styx, with Styx flowing nine times around the realms.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: Charon ferries shades over the Styx only if their bodies received funerary
    rites and they have an obolus toll, usually placed under the tongue of the dead
    person.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Shades lacking the required rites or toll are left to wander along the banks
    for a hundred years as restless spirits.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: On the opposite bank of the Styx stands the tribunal of Minos, where all shades
    appear, confess their earthly actions, and receive a sentence of happiness or
    misery.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:18
  text: The tribunal is guarded by Cerberus, a triple-headed dog with three necks
    bristling with snakes, who allows shades to enter but not return.
  category: action
  evidence_refs:
  - ev:10
