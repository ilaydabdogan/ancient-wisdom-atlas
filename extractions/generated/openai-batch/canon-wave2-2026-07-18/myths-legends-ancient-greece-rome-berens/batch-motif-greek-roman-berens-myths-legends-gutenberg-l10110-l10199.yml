canonical_text:
  quote: ''
  summary: Odysseus receives a sealed ox-skin containing contrary winds, but his companions
    open it near Ithaca and release the winds, delaying the return. The voyagers then
    encounter the cannibal Laestrygones, who kill a herald and destroy all but Odysseus's
    ship. On Aeaea, Circe drugs and transforms Odysseus's companions into swine; Hermes
    gives Odysseus the herb Moly and instructions, enabling him to resist Circe and
    secure the restoration of his men.
  language: English
  quote_policy: summarized
