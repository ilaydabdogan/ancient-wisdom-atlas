canonical_text:
  quote: ''
  summary: The passage describes the Horae as three maiden divinities, daughters of
    Zeus and Themis, associated with the seasons, hours, order, justice, vegetation,
    clouds, and the daily yoking and unyoking of the sun's celestial horses. It also
    notes a two-Horae variant in parts of Greece.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Horae are described as closely allied to the Graces and represented as
    three beautiful maidens.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Horae are said to be daughters of Zeus and Themis, named Eunomia, Dice,
    and Irene.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage explains the number three by saying ancient Greeks recognized
    spring, summer, and autumn as seasons, while winter was imagined as a time when
    nature was in death or slumber.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'In some parts of Greece there were said to be two Horae: Thallo, goddess
    of bloom, and Carpo, goddess of the corn and fruit-bearing season.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Horae are characterized as friendly toward mankind, without guile, joyous
    but gentle, crowned with flowers, and holding hands in a round dance.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: When depicted as separate seasonal personifications, the spring Hora carries
    flowers, the summer Hora carries a sheaf of corn, and the autumn Hora carries
    grapes and other fruits.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Horae appear with the Graces in the train of Aphrodite and are also seen
    with Apollo and the Muses.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Because seasonal alternation demands order and regularity, and because they
    are daughters of Themis, the Horae are presented as representatives of order and
    just administration in human communities.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Eunomia presides over state life, Dice guards individual interests, and Irene
    is described as the light-hearted companion of Dionysus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Horae also preside over the fast-fleeting hours and over smaller and larger
    divisions of time.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Each morning the Horae assist in yoking celestial horses to the chariot of
    the sun and help unyoke them when the sun rests.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: In their original conception, the Horae are described as personifications
    of clouds who open and close the gates of heaven and pour refreshing, life-giving
    streams on fruits and flowers.
  category: action
  evidence_refs:
  - ev:6
