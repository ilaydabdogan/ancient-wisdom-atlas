canonical_text:
  quote: ''
  summary: Pales is described as an ancient Italian divinity represented as either
    male or female. In male form Pales is connected with shepherds and flocks; in
    female form with husbandry and the fruitfulness of herds. The Palilia festival
    on April 21 involved shepherds igniting straw and rushing through it with their
    flocks for purification. The name Palatine is derived from Pales, and offerings
    to the deity were cakes and milk.
