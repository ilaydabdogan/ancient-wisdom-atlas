canonical_text:
  quote: ''
  summary: The passage describes Arcadian Artemis as daughter of Zeus and Leto, twin
    sister of Apollo, goddess of hunting and chastity, a maiden deity associated with
    bow, quiver, mountains, nymph attendants, sacred animals, and rites of maidenhood.
    It then recounts Artemis' anger at Oeneus for omitting her from a harvest sacrifice,
    the sending of the Calydonian boar, Atalanta's animal-nursed upbringing, and the
    boar hunt that leads to a trophy dispute and kin-slaying.
  language: English
  quote_policy: summarized
