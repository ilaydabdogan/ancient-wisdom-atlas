canonical_text:
  quote: ''
  summary: The passage recounts Demeter's grief after the loss of Persephone, the
    resulting barrenness of the earth, Zeus's failed attempts to appease her, Hermes'
    mission to Aides, Persephone's pomegranate-seed bond to the lower world, and the
    compromise by which she spends part of the year above and part below. It then
    explains the myth as a seasonal allegory, connects it with the Eleusinian Mysteries
    and later ideas of soul immortality, describes Celeus and his family as initiates
    and ritual functionaries, presents Triptolemus as an agricultural teacher sent
    by Demeter, and gives Stellio's punishment by transformation into a spotted lizard.
  language: English
  quote_policy: summarized
