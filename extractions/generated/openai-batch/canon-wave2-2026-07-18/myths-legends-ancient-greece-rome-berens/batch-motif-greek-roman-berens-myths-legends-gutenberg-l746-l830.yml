  summary: 'The passage surveys accounts of the origin and early history of humanity:
    an early belief in humans springing from earth; civilization by gods and heroes;
    destruction by flood with Deucalion and Pyrrha as survivors; restoration of humanity
    from stones; and a later doctrine of successive Golden, Silver, Brazen, and Iron
    Ages ending in another flood judgment.'
