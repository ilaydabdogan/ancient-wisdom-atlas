canonical_text:
  quote: ''
  summary: Heracles accidentally kills Iphitus during a fit of madness, seeks purification,
    quarrels with Apollo at Delphi after seizing the tripod, and is commanded to serve
    as a slave to Omphale in expiation. After his bondage and role reversal in Omphale's
    palace, he resumes action, takes vengeance on Laomedon and Augeas, arranges ransom
    and marriage events connected with Hesione and Podarces/Priam, wins Deianeira
    by defeating the shapeshifting river-god Achelous, and later banishes himself
    after accidentally killing a serving youth.
  language: English
  quote_policy: summarized
