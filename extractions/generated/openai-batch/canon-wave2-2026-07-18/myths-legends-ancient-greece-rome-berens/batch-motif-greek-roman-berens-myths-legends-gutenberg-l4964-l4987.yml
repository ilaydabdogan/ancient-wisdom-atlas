  quote: Hymen or Hymenaeus ... presided over marriage and nuptial solemnities
  summary: The passage identifies Hymen as a son of Apollo and Urania and as the god
    of marriage. It then narrates a myth in which Hymen, a poor youth in love with
    a wealthy maiden, disguises himself as a girl, joins maidens traveling to a festival
    of Demeter, rescues them from pirates on a desert island, secures marriage to
    his beloved as the condition for their restoration, and becomes associated with
    conjugal felicity.
