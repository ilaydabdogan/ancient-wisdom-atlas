- id: motif:5
  label: Speaking severed head carried by water
  taxonomy_refs: []
  basis: Orpheus's head is thrown into the Hebrus and continues murmuring Eurydice's
    name as it floats downstream.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No supplied motif-family taxonomy directly matches this image.
- id: motif:6
  label: Sacred world center confirmed by converging divine birds
  taxonomy_refs:
  - world_center
  basis: Delphi is believed to be the earth's central point because two eagles sent
    by Zeus from opposite directions arrive there simultaneously.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives this as a Greek belief associated with Delphi, not as
