canonical_text:
  quote: ''
  summary: The passage recounts Orpheus descending into Hades with his lyre to seek
    Eurydice, gaining a conditional release from Aides and Persephone, losing her
    again by looking back, withdrawing into grief, being killed by Thracian women
    during Dionysiac rites, and receiving burial and lament. It then describes Apollo’s
    worship at Delphi and Delos, including oracles, games, sacred sites, offerings,
    sacrifices, and sacred birds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Orpheus longs to see Eurydice again and descends into the lower world with
    a golden lyre to ask Aides to restore her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Orpheus''s music temporarily arrests underworld torments: Sisyphus''s stone
    stops, Tantalus forgets thirst, Ixion''s wheel stops, and the Furies weep and
    suspend persecution.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Orpheus arrives at the palace of Aides and recounts his woes before Aides
    and Persephone to the sound of his lyre.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aides and Persephone agree to release Eurydice on the condition that Orpheus
    not look at her until they reach the upper world.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Orpheus ascends with Eurydice behind him, looks back near the limits of Hades,
    and Eurydice is caught back and vanishes.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: After losing Eurydice again, Orpheus avoids human society, wanders alone in
    secluded places, and uses music as his only consolation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Thracian women performing rites of Dionysus attack Orpheus and tear him in
    pieces after he refuses to join them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Muses collect and bury Orpheus's remains at the foot of Mount Olympus;
    a nightingale sings over the grave; his head floats in the Hebrus while still
    murmuring Eurydice's name.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Delphi is described as Apollo's chief seat of worship, with a wealthy temple
    and oracle.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Greeks believed Delphi was the central point of the earth because two
    eagles sent by Zeus from east and west arrived there simultaneously.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Pythian games at Delphi honor Apollo's victory over Python and were celebrated
    every four years; later prizes were laurel wreaths.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Delos is consecrated to Apollo as his birthplace, forbids burial, has a temple
    and oracle at Mount Cynthus, receives offerings, and hosts the Delia games instituted
    by Theseus.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: At Sparta, the Gymnopedaea honors Apollo; boys sing praises of the gods and
