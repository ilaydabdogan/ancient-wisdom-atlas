candidate_motifs:
- id: motif:1
  label: Descent to the lower world to recover a beloved wife
  taxonomy_refs:
  - hero_descent
  - afterlife_journey_map
  basis: Orpheus descends into Hades to entreat Aides to restore Eurydice and travels
    through lower-world spaces.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage does not explicitly label Orpheus a hero; the motif label
    is assigned from the described descent action.
- id: motif:2
  label: Conditional return from the underworld failed by looking back
  taxonomy_refs:
  - return
  basis: Eurydice's release depends on Orpheus not looking at her until the upper
    world; he looks back near the boundary and loses her.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: This is a failed or interrupted return rather than a completed return.
- id: motif:3
  label: Music that suspends punishments and moves underworld powers
  taxonomy_refs: []
  basis: Orpheus's lyre stops punishments, affects the Furies, and moves Aides and
    Persephone to pity.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: No supplied taxonomy reference directly matches this music-power pattern.
- id: motif:4
  label: Death of the solitary singer by ritual frenzy
  taxonomy_refs: []
  basis: After withdrawing into solitary music, Orpheus refuses to join Thracian women
    performing Dionysian rites and is torn apart by them.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The killing is not described as a formal sacrifice, so the sacrifice taxonomy
