canonical_text:
  quote: ''
  summary: The passage describes Greek sacrificial motives, types of offerings, distinctions
    among recipients, ritual materials, priestly procedure, omens from the victim,
    hymns and dances for aerial divinities, and the concluding feast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sacrifice is presented as arising from gratitude to gods for protection and
    abundance.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Greek sacrifices are described as including free-will offerings, propitiatory
    offerings, offerings for success in an undertaking, offerings in fulfilment of
    a vow, and offerings commanded by an oracle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Free-will offerings consisted of first-fruits or the finest unblemished animals
    from flocks and herds; propitiatory offerings aimed to appease divine anger.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Every sacrifice was accompanied by salt and a libation; the usual libation
    was wine in a brim-filled cup, while sacrifices to infernal gods used blood in
    the libation cup.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: White animals were offered to Olympian divinities, and black animals were
    offered to gods of the lower world.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Special sacrifices by individuals reflected the offerer’s occupation, while
    public sacrifices considered the individuality of the deity, such as a sow for
    Demeter and a goat for Dionysus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The acceptability of an offering was described as depending on the offerer’s
    position: a rich person’s poor offering was contemptuous, while a poor person’s
    small oblation was acceptable.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hecatombs consisted of one hundred animals and were offered by communities
    or wealthy individuals in connection with special divine favour.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: A sacrificial fire was kindled on the altar, and wine and frankincense were
    poured into it to increase the flame.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says that in very ancient times the whole victim was burned, but
    after the time of Prometheus only portions such as shoulders, thighs, and entrails
    were sacrificed, with the remainder becoming priestly perquisites.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Officiating priests wore crowns made from leaves of the tree sacred to the
    deity invoked, such as laurel for Apollo and poplar for Heracles.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: On especially solemn occasions, the victim’s horns were overlaid with gold
    and altars were decorated with flowers and sacred herbs.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: A young maiden carried a basket containing a salt cake, sacrificial knife,
    and crowns to the sanctuary before the victim was brought into the temple.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Small victims were driven loose to the altar, while large victims were led
    by a long trailing rope to indicate that the animal was not an unwilling sacrifice.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The priest circled the altar, sprinkled it and the worshippers with meal and
    holy water, led prayer, tasted and distributed the libation, poured the rest between
    the victim’s horns, added frankincense and meal-water to the animal, and then
    killed it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: If the victim escaped the blow or became restless, this was regarded as an
    evil omen; if it died without struggle, it was considered auspicious.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: Sacrifices to aerial divinities included music, dances around the altar, sacred
    hymns recounting divine actions and gifts, invocation for continued favour, and
    a feast after the service.
  category: sequence
  evidence_refs:
  - ev:11
