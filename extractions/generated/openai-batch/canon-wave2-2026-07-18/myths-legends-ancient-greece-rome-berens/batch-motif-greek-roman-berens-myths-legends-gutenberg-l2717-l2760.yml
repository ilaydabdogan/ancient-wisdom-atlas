  summary: The passage describes Hecate as originally a Thracian moon-goddess later
    identified with Selene and Persephone. It gives her parentage, three-realm sway,
    triple-bodied representation, later lower-world and witchcraft associations, apparition-controlling
    powers, serpent-marked and torch-bearing appearance, nocturnal sacrifices, crossroads
    offerings, and an authorial link to later superstitions about spectres and witchcraft.
  language: English
