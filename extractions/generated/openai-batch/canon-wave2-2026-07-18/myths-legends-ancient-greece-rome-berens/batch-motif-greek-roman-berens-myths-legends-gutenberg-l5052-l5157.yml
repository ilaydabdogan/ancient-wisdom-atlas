  quote: ''
  summary: The passage describes the Muses as nine daughters of Zeus and Mnemosyne
    who preside over music, song, dance, and later arts and sciences. They inspire
    mortals, receive libations, punish challengers such as Thamyris, the Pierides,
    and the Sirens, dwell on sacred mountains and near springs, possess individual
    functions and emblems, and are said to have been created by Zeus after the Titan
    war to commemorate Olympian deeds in song.
  language: English
  quote_policy: summarized
