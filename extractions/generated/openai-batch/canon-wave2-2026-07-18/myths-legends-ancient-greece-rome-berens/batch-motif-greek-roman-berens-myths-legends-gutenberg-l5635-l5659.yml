canonical_text:
  quote: ''
  summary: The passage describes Priapus as son of Dionysus and Aphrodite, a deity
    of fruitfulness and protector of animals and produce. It describes his garden
    and vineyard statues, recounts that Hera sent him as a misshapen child to punish
    Aphrodite and that Aphrodite exposed him on mountains where shepherds saved him,
    then notes his worship at Lampsacus with sacrifices and offerings and his Roman
    identification with Mutunus.
  language: English
  quote_policy: summarized
