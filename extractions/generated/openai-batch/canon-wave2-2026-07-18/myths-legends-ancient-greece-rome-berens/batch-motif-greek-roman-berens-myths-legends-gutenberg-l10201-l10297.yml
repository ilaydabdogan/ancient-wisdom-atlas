canonical_text:
  quote: ''
  summary: Odysseus remains with Circe for a year, then receives her warning and instructions
    to consult Tiresias in Hades. He sails to the Cimmerian land beyond Oceanus, sacrifices
    a black ram and ewe at the entrance to the lower world, and speaks with Tiresias
    and other shades. He then escapes the crowding dead, sails past the Sirens by
    stopping his crew's ears with wax and being bound to the mast, loses six men to
    Scylla, and reaches Trinacria, where he makes his crew swear not to touch Helios'
    sacred herds.
  language: English
  quote_policy: summarized
