canonical_text:
  quote: ''
  summary: 'After Zeus and his brothers defeat their enemies, the conquered world
    is divided by lot: Zeus receives Heaven, Aides the Lower World, and Poseidon the
    Sea, while Zeus''s supremacy is recognized across all realms. The passage then
    recounts the Giants'' war against the Olympian deities, Gaea''s protection of
    her earth-born children while their feet remain on the ground, their defeat through
    being knocked from contact with mother-earth, and Typhon''s later conflict with
    Zeus, ending with Typhon''s destruction by thunderbolt after the gods flee to
    Egypt in animal forms.'
  language: English
  quote_policy: summarized
