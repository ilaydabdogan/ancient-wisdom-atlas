canonical_text:
  quote: ''
  summary: 'The passage describes Hera''s parentage, upbringing, marriage to Zeus,
    heavenly status, moral attributes, jealousy, and several mythic episodes: the
    golden apple and judgment of Paris, Hera''s hostility to Paris and the Trojans,
    her punishment by Zeus after a storm against Heracles, her reconciliation with
    Zeus through a deceptive bridal-image stratagem, her children, favored Greek cities,
    and temples.'
  language: English
  quote_policy: summarized
