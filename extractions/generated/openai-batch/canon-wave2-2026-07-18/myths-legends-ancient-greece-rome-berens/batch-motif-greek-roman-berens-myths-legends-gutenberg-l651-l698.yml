  quote: ''
  summary: The passage describes Rhea as wife of Cronus, mother of Zeus and the Olympian
    gods, and as an earth, vegetation, animal, and Great Mother figure. It summarizes
    her Cretan worship, her Phrygian form as Cybele, an Atys narrative used to express
    seasonal loss, the Corybantes' yearly mourning and search, and the Roman identification
    of Rhea with Ops/Cybele.
