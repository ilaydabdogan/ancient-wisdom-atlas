canonical_text:
  quote: ''
  summary: Alcmaeon kills his mother Eriphyle to avenge Amphiaraus, is punished with
    madness and pursuit by a Fury, wanders under a curse, finds purification in a
    newly formed island of Achelous, deceives Arsinoe to recover Harmonia's necklace
    and veil for Calirrhoe, is killed by Arsinoe's brothers, and is avenged by Calirrhoe's
    sons after Zeus miraculously transforms them to manhood; the necklace and veil
    are finally dedicated at Delphi.
  language: English
  quote_policy: summarized
