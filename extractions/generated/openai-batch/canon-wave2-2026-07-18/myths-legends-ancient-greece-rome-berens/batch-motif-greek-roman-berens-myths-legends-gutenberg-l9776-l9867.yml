canonical_text:
  quote: ''
  summary: During the final phase of the siege of Troy, Odysseus infiltrates the city
    in disguise, discovers and removes the Palladium with Diomedes' help, and then
    directs the wooden-horse stratagem. The Greeks feign departure while hidden warriors
    remain inside the horse. Laocoon warns the Trojans, but serpents kill him and
    his sons, and the Trojans interpret this as divine punishment. Sinon then deceives
    Priam with a false explanation, leading the Trojans to breach their walls and
    bring the horse into the city.
  language: English
  quote_policy: summarized
