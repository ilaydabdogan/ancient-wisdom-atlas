canonical_text:
  quote: ''
  summary: The passage recounts the Epigoni's renewed expedition against Thebes. Alcmaeon
    is named commander by the Delphic oracle but is induced through his mother Eriphyle,
    whom Thersander bribes with Harmonia's veil. Alcmaeon defeats the Theban leader
    Laodamas. Tiresias advises the Thebans to evacuate, and the Argives plunder Thebes
    and place Thersander on the throne.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ten years after earlier events, the sons of the slain heroes, called Epigoni
    or descendants, resolve to avenge their fathers by making a new expedition against
    Thebes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Delphic oracle advises that command of the expedition be entrusted to
    Alcmaeon, son of Amphiaraus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Alcmaeon hesitates to accept command because he remembers his father's injunction
    and has not yet taken vengeance on his mother Eriphyle.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Thersander, son of Polynices, bribes Eriphyle with the veil of Harmonia in
    order to induce Alcmaeon and Amphilochus to join the second war against Thebes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Eriphyle is described as possessing rare fascination, and Alcmaeon yields
    to her representations, accepts command, and advances on Thebes with a large army.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before the gates of Thebes, Alcmaeon meets the Thebans under Laodamas; in
    the battle Laodamas dies by Alcmaeon's hand.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the Thebans lose their chief and much of their army, they retreat behind
    the city walls and consult the blind old seer Tiresias.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tiresias tells the Thebans that they can save their lives only by abandoning
    the city with their wives and families; they evacuate during the night while negotiations
    delay the enemy.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The next morning the Argives enter and plunder Thebes, then place Thersander,
    son of Polynices and descendant of Cadmus, on the throne previously contested
    by his father.
  category: sequence
  evidence_refs:
  - ev:7
