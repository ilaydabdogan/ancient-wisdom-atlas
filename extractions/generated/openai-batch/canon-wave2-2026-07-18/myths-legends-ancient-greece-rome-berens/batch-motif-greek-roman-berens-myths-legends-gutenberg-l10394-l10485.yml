canonical_text:
  quote: ''
  summary: Alcinous sends Odysseus home to Ithaca with gifts. Odysseus arrives asleep
    and is placed under an olive-tree. Athena conceals him, informs him of conditions
    at home, helps hide the gifts in a cave, and changes him into an aged beggar so
    he can approach his household unrecognized. Eumaeus receives him hospitably. Telemachus
    returns and, after Athena restores Odysseus's appearance, recognizes and embraces
    his father. Odysseus and Telemachus plan to use the famous bow of Odysseus against
    the suitors. At the palace Argo recognizes Odysseus and dies; Penelope treats
    the disguised stranger kindly; Euryclea recognizes him by a scar, but he prevents
    her from revealing him.
  language: English
  quote_policy: summarized
