canonical_text:
  quote: ''
  summary: 'The passage describes Eros first as the Hesiodic spirit of Love springing
    from Chaos and ordering the elements, then as the later small son of Aphrodite
    whose growth depends on the companionship of Anteros. It then recounts the myth
    of Psyche: her beauty provokes Aphrodite''s jealousy; an oracle leads her father
    to expose her at a precipice as if for burial; Zephyrus carries her to Eros''s
    palace; Eros remains unseen and forbids her to behold him; her sisters deceive
    her into approaching him at night with lamp and dagger; she sees him and accidentally
    burns him with lamp oil, causing him to depart; Psyche is saved by river waters
    and Pan; her sisters die at the chasm; Psyche wanders in search of Eros and receives
    hard tasks from Aphrodite with hidden aid sent by Eros.'
  language: English
  quote_policy: summarized
