canonical_text:
  quote: ''
  summary: 'The passage narrates the birth and early career of Theseus: Aegeus secretly
    marries Aethra, hides sword and sandals under a rock as future identity tokens,
    and later Theseus retrieves them, chooses the dangerous road to Athens, defeats
    a series of robbers and monsters, is recognized by Aegeus through the sword, escapes
    Medea''s poisoning plot, is declared heir, and defeats rival claimants.'
  language: English
  quote_policy: summarized
