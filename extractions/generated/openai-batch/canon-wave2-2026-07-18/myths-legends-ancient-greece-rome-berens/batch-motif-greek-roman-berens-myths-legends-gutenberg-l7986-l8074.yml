canonical_text:
  quote: ''
  summary: The passage recounts Heracles’ tenth labour, the capture of Geryones’ cattle,
    including his western journey, aid from Helios, combats with the guardians and
    Geryones, and delivery of the cattle to Eurystheus. It then begins the eleventh
    labour, the quest for the golden apples of the Hesperides, describing the guarded
    sacred tree, Heracles’ search for the garden, encounters with Cycnus, Ares, Nereus,
    Anteos, Busiris, and Prometheus, and Prometheus’ advice to seek Atlas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Heracles’ tenth labour is the capture of the oxen of Geryones on Erythia;
    Geryones has three bodies, three heads, six hands, and six feet, and his cattle
    are guarded by Eurytion and the two-headed dog Orthrus.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eurystheus selects the dangerous cattle-capture task in the hope of ridding
    himself of Heracles.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Heracles reaches the western coast of Africa and erects the Pillars of Hercules
    on either side of the Straits of Gibraltar.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Because of the intense heat, Heracles threatens the sun-god with his bow;
    Helios responds by lending him a golden boat, enabling him to cross safely to
    Erythia.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Eurytion and Orthrus attack Heracles after he lands; Heracles kills the dog,
    Eurytion, and then Geryones, and collects the herd.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Heracles drives the cattle through the sea and across several regions to Mycenae,
    where he delivers them to Eurystheus, who sacrifices them to Hera.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the ten tasks, Eurystheus refuses to count the slaying of the Hydra
    and the cleansing of the Augean stables, and requires two additional labours.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The eleventh task is to bring Eurystheus the golden apples of the Hesperides
    from a sacred tree given by Gaea to Hera at Hera’s marriage with Zeus.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The sacred tree is guarded by the Hesperides and by a sleepless hundred-headed
    dragon whose hissing warns off intruders.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Heracles initially does not know the garden’s location and must make many
    journeys and undergo trials before finding it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Cycnus challenges Heracles to single combat and is killed; Ares then appears
    to avenge Cycnus, but Zeus stops the struggle by hurling a thunderbolt between
    them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Nymphs at the Eridanus direct Heracles to Nereus; Heracles restrains Nereus
    through his metamorphoses until Nereus gives the needed information.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: In Libya, Heracles wrestles Anteos, and the match ends with Anteos’ death.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: In Egypt, Busiris sacrifices strangers to Zeus; Heracles is seized and taken
