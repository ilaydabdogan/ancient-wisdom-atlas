candidate_motifs:
- id: motif:1
  label: Heroic labour imposed as a dangerous quest
  taxonomy_refs:
  - mystical_quest
  basis: Eurystheus assigns perilous labours to Heracles, including the capture of
    Geryones’ cattle and the quest for the golden apples, requiring distant travel
    and trials.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage presents these as labours rather than using the term quest.
- id: motif:2
  label: Capture of guarded cattle from a monstrous owner
  taxonomy_refs:
  - sacred_theft
  basis: Heracles is ordered to capture cattle belonging to Geryones; the herd is
    guarded by a giant and a two-headed dog, and Heracles takes it after killing the
    guardians and owner.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage says capture rather than theft, and the cattle are later sacrificed
    to Hera by Eurystheus.
- id: motif:3
  label: Divine vehicle enables passage to a remote island
  taxonomy_refs:
  - departure
  basis: Helios lends Heracles the golden boat used for nocturnal transit, and Heracles
    crosses safely to the island of Erythia.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The taxonomy reference is broad; the passage does not frame the crossing
    as an initiatory departure.
- id: motif:4
  label: Guarded sacred tree with golden fruit
  taxonomy_refs:
  - sacred_tree_axis
  - mystical_quest
  basis: The golden apples grow on a sacred tree given by Gaea to Hera and guarded
    by the Hesperides and a sleepless hundred-headed dragon; Heracles must find and
    obtain the fruit.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage segment ends before the apples are actually obtained.
- id: motif:5
  label: Dragon guardian of sacred fruit
  taxonomy_refs:
  - serpent
  basis: A hundred-headed dragon guards the tree of the golden apples and deters intruders
    by constant hissing.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage calls the guardian a dragon, not explicitly a serpent.
- id: motif:6
  label: Shapeshifting informant compelled to reveal hidden route knowledge
  taxonomy_refs:
  - shapeshifter
  - wisdom
  basis: Heracles seizes Nereus and holds him through various metamorphoses until
    Nereus gives the information needed to reach the Garden of the Hesperides.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The information concerns a route; the passage does not call it forbidden
    knowledge.
- id: motif:7
  label: Hero escapes intended sacrifice
  taxonomy_refs:
  - sacrifice
  basis: Busiris sacrifices strangers to Zeus; Heracles is seized and dragged to the
    altar, but bursts his bonds and kills Busiris and his son.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The sacrificial rite is described briefly and only as background to Heracles’
    escape.
- id: motif:8
  label: Rescue of a tormented benefactor followed by guidance
  taxonomy_refs:
  - sacred_exchange
  - wisdom
  basis: Heracles kills the eagle tormenting Prometheus; Prometheus, grateful for
    deliverance, instructs Heracles about the route to Atlas and the proper way to
    obtain the apples.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The exchange is implicit in the sequence of rescue, gratitude, and instruction.
