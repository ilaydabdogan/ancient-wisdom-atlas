  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: At Mount Caucasus, Heracles shoots the eagle tormenting Prometheus; Prometheus,
    grateful for deliverance, tells Heracles how to find Atlas and advises him to
    send Atlas for the apples.
  category: sequence
  evidence_refs:
  - ev:11
