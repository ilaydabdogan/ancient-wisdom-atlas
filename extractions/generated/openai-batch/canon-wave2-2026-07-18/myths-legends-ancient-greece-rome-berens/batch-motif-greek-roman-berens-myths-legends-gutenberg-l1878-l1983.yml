candidate_motifs:
- id: motif:1
  label: Greek-Roman divine identification and cult transfer
  taxonomy_refs: []
  basis: Ceres is identified as Greek Demeter under another name, and her Roman worship
    is said to have been introduced through Sicily by Greek colonists.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is a handbook identification and cult-history statement, not a narrative
    episode.
- id: motif:2
  label: Sea-born goddess
  taxonomy_refs:
  - sacred_birth
  basis: Aphrodite is born beneath the waves in one account and, in another, arises
    from sea-foam after Uranus' blood mingles with the sea.
  evidence_refs:
  - ev:3
  - ev:10
  confidence: high
  cautions: The passage gives multiple birth traditions rather than a single harmonized
    version.
- id: motif:3
  label: Ascent from watery depths to divine mountain
  taxonomy_refs:
  - ascent
  basis: Aphrodite ascends from ocean-depths to the snow-capped summits of Olympus
    after birth beneath the waves.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage frames the ascent as movement to the atmosphere of celestial
    gods, not as an initiation or heroic ascent.
- id: motif:4
  label: Divine parent and protected heroic child
  taxonomy_refs:
  - divine_parent_child
  basis: Aphrodite is mother of Aeneas and comes to assist him in battle, being wounded
    while attempting to save him.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage summarizes an Iliad episode without giving the full narrative
    context.
- id: motif:5
  label: Beloved divided between goddess and underworld
  taxonomy_refs:
  - divine_beloved
  - dying_and_returning
  - seasonal_cycle
  basis: Adonis is beloved by Aphrodite, claimed by Persephone, killed by a boar,
    and then allowed to spend six months each year with Aphrodite and half in the
    lower world.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The yearly alternation is explicit; the passage does not explicitly interpret
    it as seasonal vegetation symbolism.
- id: motif:6
  label: Love-compelling magical garment
  taxonomy_refs:
  - sacred_exchange
  basis: Aphrodite's magic girdle is lent to unhappy maidens and has the power to
    inspire affection for the wearer.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The object is exchanged by lending, but the passage does not describe
    a ritual exchange or bargain.
- id: motif:7
  label: Divine adornment before reception and marriage
  taxonomy_refs:
  - sacred_marriage
  basis: The Seasons adorn Aphrodite, nymphs escort her to Olympus, the gods compete
    for her hand, and Hephaestus becomes her husband.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage describes a divine marriage outcome but not a formal sacred-marriage
    rite.
- id: motif:8
  label: Foreign goddess equivalence
  taxonomy_refs: []
  basis: The passage states that Aphrodite's worship was introduced into Greece from
    Central Asia and that she was originally identical with Astarte/Ashtoreth.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: The claim reflects the source's statement and requires historical review
    before reuse as a scholarly conclusion.
comparison_claims:
- id: claim:1
  claim: The passage explicitly presents Roman Ceres and Greek Demeter as the same
    divinity under different names with identical attributes, worship, and festivals.
  claim_level: same_function
  target: Greek Demeter and Roman Ceres
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is an assertion in the passage; it does not analyze
    regional variation in Demeter/Ceres cults.
- id: claim:2
  claim: The passage links Roman worship of Ceres to Sicilian Greek colonists, supporting
    a cautious historical-contact claim within the source's account.
  claim_level: historical_contact
  target: Sicilian Greek colonists and Roman Ceres worship
  evidence_refs:
  - ev:2
