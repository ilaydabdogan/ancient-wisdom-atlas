canonical_text:
  quote: ''
  summary: The passage identifies Roman Ceres with Greek Demeter and briefly describes
    the Cerealia. It then describes Aphrodite/Venus as goddess of Love and Beauty,
    her parentage and sea birth, her motherhood of Eros and Aeneas, her attachment
    to Adonis and his divided yearly presence between Aphrodite and the lower world,
    her magic girdle, attendants, alternate sea-foam origin, arrival and adornment,
    marriage to Hephaestus, visual representations, sacred animals and plants, and
    an asserted identification with Astarte/Ashtoreth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Roman Ceres is Greek Demeter under another name, with
    identical attributes, worship, and festivals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Ceres' worship came to the Romans through Sicily and
    Greek colonists, and that the Cerealia began on April 12 and lasted several days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aphrodite, also named Venus in the heading, is described as daughter of Zeus
    and the sea-nymph Dione and as goddess of Love and Beauty.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dione gives birth to Aphrodite beneath the waves, and Aphrodite ascends from
    the ocean-depths to the summits of Olympus.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Aphrodite is described as mother of Eros and Aeneas, and she assists the wounded
    Aeneas in battle at personal risk.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Aphrodite takes pity on the motherless Adonis, places him in a chest, and
    entrusts him to Persephone, who refuses to part with him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Zeus decides that Adonis is to spend four months yearly with Persephone, four
    with Aphrodite, and four at his own disposal; Adonis gives his own time to Aphrodite.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Adonis is killed during the chase by a wild boar; after Aphrodite's persistent
    mourning, Aides permits him to spend six months of each year with her and the
    remaining half in the lower world.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Aphrodite owns a magic girdle, the cestus, which she lends to unhappy maidens
    and which inspires affection for the wearer while bestowing grace, beauty, and
    fascination.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Charites or Graces are named as Aphrodite's usual attendants and are represented
    undraped and intertwined in a loving embrace.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says that in Hesiod's Theogony Aphrodite belongs to the more ancient
    divinities and has an independent origin.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the poetic birth account, Uranus is wounded by Cronus, his blood mingles
    with sea-foam, the waters turn rosy, and Aphrodite arises from the depths in a
    sea-shell while water-drops become pearls.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Aphrodite is carried to Cythera and Cyprus; when she steps ashore, dry sand
    becomes a meadow and Cyprus becomes verdant.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The Seasons receive Aphrodite, dress and adorn her, and nymphs escort her
    to Olympus, where gods and goddesses receive her enthusiastically.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: The gods compete for Aphrodite's hand, Hephaestus becomes her husband, and
    the passage says she later prefers other gods and mortal men.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:16
  text: The passage describes the Venus of Milo as a statue of Aphrodite and also
    notes representations of Aphrodite tying her dripping hair while nymphs veil her.
  category: attribute
  evidence_refs:
  - ev:13
  - ev:14
- id: obs:17
  text: The dove, swan, swallow, and sparrow are named as sacred to Aphrodite; her
    favourite plants are myrtle, apple-tree, rose, and poppy.
  category: object
  evidence_refs:
  - ev:15
- id: obs:18
  text: The passage states that Aphrodite's worship was introduced into Greece from
    Central Asia and that she was originally identical with Astarte, the Ashtoreth
    of the Bible.
  category: relationship
  evidence_refs:
  - ev:16
