canonical_text:
  quote: ''
  summary: The passage describes Pan/Faunus as a rural fertility god, patron of shepherds
    and huntsmen, son of Hermes and a wood nymph, born with goat-like features. It
    recounts Hermes bringing him to Olympus, his delight in grottoes, mountains, music,
    dancing, and the syrinx, the myth of Syrinx's transformation into a reed and the
    origin of Pan's pipe, his protection of flocks and association with caves, his
    afternoon sleep and required silence, his patronage of the chase, his panic-causing
    voice, prophetic power and oracle, later artistic attributes, offerings and sacrifices,
    and relation to Dionysus, Panisci, and Satyrs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pan is described as the god of fertility, patron of shepherds and huntsmen,
    presider over rural occupations, chief of the Satyrs, and head of rural divinities.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pan is said to be the son of Hermes and a wood nymph and to have been born
    with horns, a goat's beard, pointed ears, and a goat's tail and feet; his mother
    fled at the sight of him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hermes wrapped the infant Pan in a hare skin, carried him to Olympus, and
    the immortals delighted in him and named him Pan because he delighted them all.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pan's favourite haunts are grottoes, rocks, and mountains, and he is associated
    with noisy wandering, music, singing, dancing, and nymphs dancing to his syrinx.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Pan pursued the nymph Syrinx to the river Ladon; when escape seemed impossible,
    she prayed to the gods and was transformed into a reed before Pan seized her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: After hearing reeds moved by the wind, Pan cut seven unequal reeds, joined
    them, and made the pipe called the syrinx in memory of Syrinx.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Shepherds regarded Pan as protector of flocks from wolves, and mountain caves
    used to shelter flocks were consecrated to him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Pan is represented as enjoying afternoon sleep in the cool shelter of a tree
    or cave, and shepherds kept silence during those hours to avoid disturbing him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Huntsmen regarded Pan as patron of the chase and beat a wooden image of Pan
    after an unsuccessful day's sport.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sudden unaccountable sounds in lonely places were attributed to Pan's discordant
