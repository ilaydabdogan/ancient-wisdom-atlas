canonical_text:
  quote: ''
  summary: The passage describes the Camenae as four prophetic nymphs venerated by
    ancient Italians, especially Carmenta and Egeria. Carmenta is named as mother
    of Evander, who brought an Arcadian colony to Italy and introduced Greek art,
    civilization, and worship. A temple and festival honored Carmenta. Egeria instructed
    Numa Pompilius in religious worship, was regarded as giver of life, and was invoked
    by women before childbirth. Roman writers often identified the Camenae with the
    Muses.
  language: English
