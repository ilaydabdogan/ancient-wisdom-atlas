canonical_text:
  quote: ''
  summary: After Oedipus abdicates, Eteocles expels Polynices from Thebes. Polynices
    reaches Argos, where Adrastus interprets the lion and boar emblems on the shields
    of Polynices and Tydeus as the fulfillment of an oracle about his daughters' marriages.
    Adrastus marries his daughters to the two men and promises military aid. Amphiaraus
    foresees disaster and hides, but Eriphyle is bribed with Harmonia's necklace to
    reveal him, causing him to join the expedition. Seven leaders march; at Nemea,
    Hypsipile guides them to water, and a serpent kills the infant she had been nursing.
    The army reaches Thebes, where Tiresias declares that the city cannot be saved
    unless the youngest descendant of Cadmus voluntarily sacrifices himself.
  language: English
  quote_policy: summarized
