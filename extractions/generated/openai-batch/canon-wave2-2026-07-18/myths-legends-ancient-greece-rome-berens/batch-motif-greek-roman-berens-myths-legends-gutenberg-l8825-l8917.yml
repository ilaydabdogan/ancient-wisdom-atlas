candidate_motifs:
- id: motif:1
  label: rival brothers contest kingship
  taxonomy_refs:
  - sibling_pair
  - royal_legitimacy
  basis: The sons of Oedipus jointly take the crown, after which Eteocles seizes sole
    rule and expels Polynices.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents rivalry and expulsion but does not yet narrate the
    brothers' later deaths or resolution.
- id: motif:2
  label: oracle fulfilled through animal emblems
  taxonomy_refs: []
  basis: Adrastus connects the lion and boar shown on the shields of Polynices and
    Tydeus with an oracle that his daughters would marry a lion and a boar.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives the oracle's interpretation in this episode only; no
    broader taxonomy reference is supplied.
- id: motif:3
  label: marriage alliance used to restore lost patrimony
  taxonomy_refs:
  - royal_legitimacy
  basis: Adrastus gives his daughters to Polynices and Tydeus and promises to help
    both sons-in-law regain their rightful patrimony.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The restoration promise is explicit, but the passage gives more detail
    about Polynices' claim than Tydeus's.
- id: motif:4
  label: seer foresees doomed expedition but is compelled to join
  taxonomy_refs:
  - wisdom
  basis: Amphiaraus foresees that the enterprise will end disastrously, hides to avoid
    it, and is forced to join after Eriphyle is bribed.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage identifies prophetic foresight and compulsion, but the full
    outcome lies beyond this passage.
- id: motif:5
  label: precious object bribe causing betrayal of kin
  taxonomy_refs:
  - sacred_exchange
  basis: Polynices uses Harmonia's necklace to bribe Eriphyle into revealing or influencing
    Amphiaraus, resulting in his compulsory participation.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage treats the necklace as a tempting object and bribe; it does
    not describe any curse or supernatural property of the object.
- id: motif:6
  label: vengeance oath against a treacherous mother
  taxonomy_refs: []
  basis: Amphiaraus makes Alcmaeon promise that if he dies in battle, Alcmaeon will
    avenge him on Eriphyle.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The vengeance itself is not narrated in this passage.
- id: motif:7
  label: seven champions arrayed against seven gates
  taxonomy_refs: []
  basis: Seven leaders are named, and each is later placed before one of Thebes' seven
    gates for the attack.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: high
  cautions: The passage describes the arrangement before battle but not the actual
    fighting.
- id: motif:8
  label: water quest interrupted by infant death from serpent
  taxonomy_refs:
  - serpent
  basis: The army's search for water leads Hypsipile to leave the infant while guiding
    the warriors to a secret spring, and a serpent kills the child during the absence.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage gives a direct sequence but does not state a divine cause
    for the serpent attack.
- id: motif:9
  label: voluntary sacrifice required to save a city
  taxonomy_refs:
  - sacrifice
  basis: Tiresias declares that defense of Thebes will fail unless the youngest descendant
    of Cadmus offers himself as a voluntary sacrifice for the good of the state.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage states the required sacrifice but ends before any person performs
    it.
