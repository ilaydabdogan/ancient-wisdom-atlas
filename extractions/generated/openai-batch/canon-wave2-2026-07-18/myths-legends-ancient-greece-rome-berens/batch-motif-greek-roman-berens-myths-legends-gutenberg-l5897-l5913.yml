  quote: ''
  summary: The passage describes Terminus as a Roman god of boundaries and landmarks,
    represented by a stone marker and honored with altars and the Terminalia festival.
    It recounts that Numa promoted boundary stones to protect property divisions,
    and that Terminus and Juventas later refused displacement when Tarquin planned
    a new temple, an event interpreted as a favorable omen for Rome's enduring boundaries
    and vigor.
