canonical_text:
  quote: ''
  summary: The passage recounts Phaethon's disputed claim to be the son of Helios,
    his visit to the sun-god, his request to drive the solar chariot, the disastrous
    loss of control that nearly burns the world, Zeus's thunderbolt intervention,
    and the mourning transformations that follow. It then gives myths and cultic material
    concerning Helios and Rhodes, including the island rising from the sea after a
    divine oath and the Colossus of Rhodes.
  language: English
  quote_policy: summarized
