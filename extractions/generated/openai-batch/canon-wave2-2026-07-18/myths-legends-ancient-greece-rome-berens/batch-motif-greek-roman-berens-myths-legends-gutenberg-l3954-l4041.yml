canonical_text:
  quote: ''
  summary: The passage identifies Dionysus/Bacchus as god of wine and blessings of
    nature, recounts his rescue from Semele’s death, foster care, discovery of the
    vine and dissemination of wine cultivation, his civilizing expedition, and episodes
    in which Lycurgus and Pentheus oppose his rites and suffer violent punishments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dionysus, also called Bacchus, is identified as the god of wine and as a personification
    of the blessings of Nature.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the worship of Dionysus is supposed to have been introduced
    into Greece from Asia, probably India, first taking root in Thrace before spreading
    elsewhere in Greece.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dionysus is described as the son of Zeus and Semele; Zeus snatches him from
    flames in which Semele perishes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The motherless child is given to Hermes, conveyed to Ino, threatened after
    Hera visits Athamas with madness, and then transferred to the nymphs of Mount
    Nysa; Silenus becomes his guardian and preceptor.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Dionysus passes childhood roaming through woods and forests, surrounded by
    nymphs, satyrs, and shepherds.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: During a ramble, Dionysus finds the vine and learns to extract from it an
    exhilarating beverage.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After companions drink the beverage, they experience pleasurable excitement
    and respond with shouting, singing, and dancing; others gather to taste it and
    join his worship.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Dionysus resolves to extend the benefit of wine to mankind and travels with
    followers, planting the vine and teaching its cultivation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Dionysus leads a large retinue of men, women, fauns, and satyrs bearing thyrsi
    and musical instruments; he rides in a panther-drawn chariot through several eastern
    regions, conquering, founding cities, and establishing more civilized and sociable
    life.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Lycurgus opposes the wild revels, drives the nymphs of Nysa from the mountain,
    and frightens Dionysus into the sea, where Thetis receives him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Lycurgus is punished with loss of reason and, in madness, kills his son Dryas
    after mistaking him for a vine.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Pentheus prohibits Bacchanalian revels; Dionysus appears in the form of a
    youth to warn him, is imprisoned by Pentheus, and escapes when the prison doors
    open and his chains burst.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Agave and her sisters, inspired with Bacchanalian fury, go to women-only orgies
