  quote: ''
  summary: The passage recounts Pelops' exile from Phrygia, his love for Hippodamia,
    Oenomaus' oracle-driven lethal chariot-race condition for suitors, Poseidon's
    aid to Pelops through a winged-horse chariot and intervention in the race, Oenomaus'
    death, Hippodamia's rescue from a burning palace, and Pelops' later marriage and
    rule in Pisa.
