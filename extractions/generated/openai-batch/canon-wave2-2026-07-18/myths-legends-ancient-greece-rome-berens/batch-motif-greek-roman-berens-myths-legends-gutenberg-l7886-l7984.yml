canonical_text:
  quote: ''
  summary: 'The passage recounts several labours and adventures of Heracles: the Cretan
    bull sent by Poseidon after Minos breaks a sacrificial vow; the capture of Diomedes''
    man-eating mares; the quest for Hippolyte''s girdle among the Amazons; and the
    rescue of Hesione from a sea monster after Laomedon''s breach of faith with Apollo
    and Poseidon.'
  language: English
  quote_policy: summarized
