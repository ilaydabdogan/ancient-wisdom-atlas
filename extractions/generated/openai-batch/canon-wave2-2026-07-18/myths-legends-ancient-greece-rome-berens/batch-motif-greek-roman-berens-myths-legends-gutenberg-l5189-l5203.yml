  quote: ''
  summary: The passage identifies the Hesperides as daughters of Atlas living on a
    far-western island. Hera appoints them to guard a tree with golden apples given
    to her by Gaea at her marriage to Zeus. After the Hesperides fail to resist tasting
    the fruit, they are deprived of the office, and the dragon Ladon becomes the ever-watchful
    sentinel of the treasures. The Hesperides are named as Aegle, Arethusa, and Hesperia.
