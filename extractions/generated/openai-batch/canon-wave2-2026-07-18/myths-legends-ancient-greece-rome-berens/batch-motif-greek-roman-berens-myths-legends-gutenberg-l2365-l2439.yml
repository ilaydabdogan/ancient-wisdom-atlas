canonical_text:
  quote: ''
  summary: 'The passage describes Apollo’s youthful appearance and recounts several
    unsuccessful or disastrous loves: Daphne is made averse to him by Eros and is
    transformed into a laurel-bush; Marpessa chooses the mortal Idas over Apollo after
    Zeus intervenes; Cassandra gains prophecy from Apollo but is cursed not to be
    believed after breaking her promise; Coronis is killed by Apollo after a crow
    reports her infidelity, and the crow is punished by being turned black.'
  language: English
  quote_policy: summarized
