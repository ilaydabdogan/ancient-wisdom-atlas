canonical_text:
  quote: ''
  summary: The passage describes the Harpies as three female divinities, daughters
    of Thaumas and Electra, named Aello, Ocypete, and Celaeno. They are said to serve
    the gods, like the Furies, as punishers of the guilty. They have the head of a
    fair-haired maiden and the body of a vulture, suffer insatiable hunger, rob or
    defile victims' food, fly with extraordinary speed, carry off mortals, and are
    interpreted as personifications of sudden destructive tempests.
