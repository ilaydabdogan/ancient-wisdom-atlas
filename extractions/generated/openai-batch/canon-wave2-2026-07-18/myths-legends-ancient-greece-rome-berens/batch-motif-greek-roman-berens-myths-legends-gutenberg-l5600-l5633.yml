canonical_text:
  quote: ''
  summary: The passage describes Satyrs as wild woodland spirits with goat-like and
    grotesque features, devoted to pleasure, hunting, music, dancing, wine, and sleep
    after drinking. It places them in Dionysus's train, names Silenus as their chief
    and Dionysus's tutor, distinguishes older Satyrs called Silens and little Satyrs
    resembling Panisci, reports a rural Dionysian animal-skin disguise custom as a
    proposed source for the Satyr conception, and states that Roman Fauns were identified
    with Satyrs.
  language: English
  quote_policy: summarized
