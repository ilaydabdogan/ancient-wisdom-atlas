canonical_text:
  quote: ''
  summary: The passage recounts a Hesiodic account in which Prometheus forms humans
    from clay, Athene gives them soul, Prometheus teaches them useful arts, tricks
    Zeus in the division of a sacrificial ox, steals fire for mortals, and is punished.
    Zeus retaliates against mankind by having Pandora made and sent to Epimetheus;
    she opens a forbidden jar from which blessings fly away, though Hope remains.
    Prometheus is chained on Mount Caucasus, tormented by an eagle, and finally released
    when Heracles kills the eagle.
  language: English
  quote_policy: summarized
