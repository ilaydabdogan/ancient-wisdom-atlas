canonical_text:
  quote: ''
  summary: The passage describes the Ephesian Artemis as an ancient Asiatic divinity
    of Persian origin called Metra, identified by Greek settlers with Artemis because
    of a shared association with celestial light. It describes Metra as a twofold
    divinity of all-pervading love and heavenly light, assigns her a role in the Realm
    of Shades where departed spirits may return to warn loved ones, and describes
    the temple, statue, destruction by Herostratus, and Ephesian response.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ephesian Artemis, also called “Diana of the Ephesians,” is described as
    an ancient Asiatic divinity of Persian origin named Metra, whose worship Greek
    colonists found already established in Asia Minor and identified with Greek Artemis.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Metra is described as a twofold divinity: one phase represents all-pervading
    love, and the other represents the light of heaven.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Greek settlers identified Metra with Artemis because Artemis, in the character
    of Selene, represented celestial light.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In her aspect as love pervading nature, Ephesian Artemis was believed to be
    present in the Realm of Shades, where she exercised benign sway and partly displaced
    Hecate and Persephone in lower-world roles.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: She was believed to permit departed spirits to revisit the earth to communicate
    with loved ones and warn them of coming evil.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage describes the all-pervading love embodied in Ephesian Artemis
    as the ruling spirit of the universe and attributes beneficent workings of nature
    to her influence.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A magnificent temple at Ephesus was erected to the goddess, ranked among the
    seven wonders of the world, and contained statues, paintings, 127 columns sixty
    feet high, and great wealth.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Inside the temple stood an ebony statue of the goddess with lions on her arms,
    turrets on her head, and multiple breasts indicating the fruitfulness of the earth
    and nature.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ctesiphon is named as principal architect of the temple, which was completed
    220 years after the foundation-stone was laid.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Herostratus set fire to the temple and completely destroyed it because he
    wanted his name to be famous to later generations.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Ephesians responded by enacting a law forbidding Herostratus’s name to
    be mentioned, but the passage states that this helped transmit his name to posterity.
  category: sequence
  evidence_refs:
  - ev:7
