canonical_text:
  quote: ''
  summary: The passage describes an older account in which Zeus gives Aeolus command
    over winds kept in a deep cave, a later account in which the winds are distinct
    winged divinities, the four principal winds and their parentage, unions involving
    Zephyrus and Boreas, Boreas carrying off Oreithyia, their children Zetes and Calais,
    and Athenian cult and architectural honors for Boreas and the winds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aeolus is described in the oldest accounts as king of the Aeolian Islands,
    given command of the winds by Zeus, keeping them shut in a deep cave and freeing
    them at will or by command of the gods.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In later times the winds are described as distinct divinities depicted as
    winged youths flying through the air.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The principal winds are Boreas, Eurus, Zephyrus, and Notus, identified respectively
    with north, east, west, and south winds, and said to be children of Eos and Astraeus.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Zephyrus is said to be united to Chloris, also called Flora, the goddess of
    flowers.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Boreas, while flying over the river Ilissus, sees Oreithyia on the banks,
