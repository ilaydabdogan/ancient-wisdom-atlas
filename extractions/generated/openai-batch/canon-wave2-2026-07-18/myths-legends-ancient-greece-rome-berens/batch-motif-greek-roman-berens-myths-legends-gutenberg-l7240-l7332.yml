canonical_text:
  quote: ''
  summary: Aetes assigns Jason a deadly task involving fire-breathing oxen, the field
    of Ares, dragon teeth, and armed men rising from the furrows. Medea gives Jason
    protective magic and tactical counsel, enabling him to complete the task. After
    Aetes refuses to surrender the Golden Fleece, Medea warns the Argonauts, leads
    Jason to the sacred grove, puts the sleepless dragon to sleep, and Jason takes
    the Fleece before the Argo departs.
  language: English
  quote_policy: summarized
