canonical_text:
  quote: Proteus, more familiarly known as "The Old Man of the Sea," was a son of
    Poseidon, and gifted with prophetic power.
  summary: The passage describes Proteus as a prophetic son of Poseidon who tends
    seals under the sea, comes to Pharos at noon, resists consultation by changing
    forms when seized, and gives information after being held until he resumes his
    true form. It then describes Triton as the son of Poseidon and Amphitrite, a minor
    sea divinity who precedes Poseidon as trumpeter with a conch shell, lives beneath
    the sea, rides over the waves, and is represented as half man and half fish.
  language: English
  quote_policy: quoted
