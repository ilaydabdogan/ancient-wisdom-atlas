canonical_text:
  quote: ''
  summary: Fugitives carry the image of the Taurian Artemis to Brauron in Attica,
    where the goddess is thereafter known as Brauronian Artemis. Rites associated
    with Taurica, including human sacrifice, are introduced in Greece. Lycurgus later
    ends the human sacrifices by substituting the scourging of youths at the goddess’s
    altars; some youths die, and their mothers are said to regard such deaths as honorable.
  language: English
