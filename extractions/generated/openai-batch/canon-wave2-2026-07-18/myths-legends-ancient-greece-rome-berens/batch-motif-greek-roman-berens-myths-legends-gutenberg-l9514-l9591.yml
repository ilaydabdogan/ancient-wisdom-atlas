canonical_text:
  quote: ''
  summary: During the Trojan War, Agamemnon quarrels with Achilles after insulting
    Calchas and taking Briseis from Achilles. Achilles withdraws from battle, calls
    upon his divine mother Thetis, and she promises to seek Zeus's aid in avenging
    him through Trojan success. The Trojans press the Greeks hard. Agamemnon sends
    envoys offering restitution, but Achilles refuses. Patroclus later borrows Achilles'
    armor and leads the Myrmidons; after ignoring Achilles' warning not to advance
    too far, he is killed by Hector. Achilles mourns Patroclus, vows revenge and funeral
    sacrifice, reconciles with Agamemnon, rejoins the Greeks, and receives new armor
    forged by Hephaestus at Thetis's request.
  language: English
  quote_policy: summarized
