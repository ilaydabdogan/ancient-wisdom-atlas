comparison_claims:
- id: claim:1
  claim: 'The Aeneas episode is explicitly linked by the passage to a Roman ancestral-hero
    tradition: a divine-born Trojan survivor departs from destroyed Troy and becomes
    ancestor of the Roman people.'
  claim_level: same_function
  target: culture_hero and royal-ancestry pattern in Roman tradition
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states Aeneas's later Roman ancestral role but does not
    narrate the Roman foundation cycle in detail.
- id: claim:2
  claim: The Trojan horse episode functions as a concealed-entry or boundary-crossing
    stratagem, since warriors hidden in the admitted horse are released at night to
    open the way for the returning army.
  claim_level: same_motif
  target: hidden warriors in deceptive object / trickster-boundary motif pattern
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The immediate passage refers to admission and release but does not
    describe the construction of the horse or the full deception speech.
