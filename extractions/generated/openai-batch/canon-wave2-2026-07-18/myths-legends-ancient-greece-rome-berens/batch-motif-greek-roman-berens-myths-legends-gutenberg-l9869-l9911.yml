candidate_motifs:
- id: motif:1
  label: unheeded true prophecy before catastrophe
  taxonomy_refs:
  - wisdom
  basis: Cassandra foresees the danger of the wooden horse and warns the Trojans,
    but her prediction is not believed before Troy falls.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: medium
  cautions: The available taxonomy has no specific Cassandra-style 'unbelieved prophecy'
    category; 'wisdom' is a broad fit.
- id: motif:2
  label: hidden warriors released from deceptive horse at night
  taxonomy_refs:
  - trickster_boundary
  basis: The passage presents the wooden horse as containing heroes in voluntary imprisonment,
    released by Sinon at night after its admission into the city.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage does not narrate the full deception by which the horse entered
    Troy; the boundary-crossing trick is inferred only from admission and concealed
    release.
- id: motif:3
  label: city destroyed by fire after nocturnal infiltration
  taxonomy_refs: []
  basis: After the hidden heroes are released and the army lands silently, Troy is
    entered, slaughtered, and wrapped in flames.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No available taxonomy family exactly covers the sack of a city; 'world_destroying_fire'
    is not used because the passage describes a city, not the world.
- id: motif:4
  label: king slain while supplicating at an altar
  taxonomy_refs:
  - divine_judgment
  basis: Priam is killed by Neoptolemus while prostrate before the altar of Zeus and
    praying for divine assistance.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage states the altar setting and prayer but does not explicitly
    frame the death as divine judgment.
- id: motif:5
  label: heir killed to prevent future vengeance
  taxonomy_refs:
  - royal_legitimacy
  basis: Astyanax is killed because the victors fear that Hector's son may one day
    rise against them to avenge his father.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage emphasizes vengeance and descent rather than formal kingship;
    the taxonomy reference is approximate.
- id: motif:6
  label: divine-born survivor ancestor departs from a destroyed city
  taxonomy_refs:
  - departure
  - culture_hero
  - divine_parent_child
  - royal_legitimacy
  basis: Aeneas, son of Aphrodite, escapes Troy with his son and father, flees to
    Italy, and becomes ancestral hero of the Roman people.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives only a compressed account of Aeneas's later role and
    does not narrate his Italian exploits.
- id: motif:7
  label: family line preserved through escape with child and elder
  taxonomy_refs:
  - survivor_pair
  - divine_parent_child
  basis: Aeneas alone escapes the carnage with his son and his old father Anchises,
    whom he carries on his shoulders.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: "'Survivor_pair' is approximate because the scene includes three generations
    rather than only a pair."
- id: motif:8
  label: reconciliation with recovered spouse after war
  taxonomy_refs:
  - return
  basis: Menelaus seeks Helen in the palace; reconciliation takes place, and she accompanies
