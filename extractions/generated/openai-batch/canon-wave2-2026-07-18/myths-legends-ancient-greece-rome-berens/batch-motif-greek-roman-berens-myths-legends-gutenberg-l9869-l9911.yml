canonical_text:
  quote: ''
  summary: Cassandra warns against admitting the wooden horse but is not believed.
    At night Sinon releases the Greek heroes hidden in the horse and signals the Greek
    fleet, leading to the sack and burning of Troy. Priam is killed at Zeus's altar;
    Astyanax is thrown from a tower; Aeneas escapes with his son and father and later
    becomes ancestral hero of the Romans. Helen is reconciled with Menelaus, Trojan
    royal women are allotted to Greek victors, and Troy is levelled before the Greeks
    prepare to sail home.
  language: English
  quote_policy: summarized
