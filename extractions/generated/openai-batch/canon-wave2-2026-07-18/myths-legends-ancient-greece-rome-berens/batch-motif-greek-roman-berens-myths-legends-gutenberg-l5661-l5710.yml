  quote: ''
  summary: The passage describes Asclepias/Aesculapius as a son of Apollo and Coronis,
    trained by Chiron in knowledge of herbs, able to cure disease, avert death, and
    restore the dead. It describes his shrines as healing sites where sufferers slept
    for dream-revealed cures, and notes his Epidaurus temple, serpent-associated statue,
    usual attributes, and healer children.
