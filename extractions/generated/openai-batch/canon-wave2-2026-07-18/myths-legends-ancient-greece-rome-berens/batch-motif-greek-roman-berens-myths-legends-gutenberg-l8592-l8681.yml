canonical_text:
  quote: ''
  summary: 'The passage recounts several episodes in the career of Theseus: his abduction
    of Hippolyte and the resulting Amazon attack on Athens; his participation in famous
    heroic undertakings; his sworn friendship with Pirithoeus; the attempted abduction
    of Hippodamia and other women by Centaurs at Pirithoeus'' wedding; Phaedra''s
    rejected passion for Hippolytus, her false accusation, and Hippolytus'' death
    through Theseus'' curse and Poseidon''s sea monster; and the later abduction of
    the child Helen from the temple of Artemis by Theseus and Pirithoeus.'
  language: English
  quote_policy: summarized
