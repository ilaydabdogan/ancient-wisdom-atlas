canonical_text:
  quote: ''
  summary: Apollo discovers that Hermes has stolen his cattle and brings the child
    before Zeus. Hermes denies guilt, but Zeus orders him to reveal the herd hidden
    in a cave. Hermes plays his lyre, which Apollo accepts in exchange for the cattle,
    bringing reconciliation. Apollo gives Hermes the caduceus, whose power is shown
    when it reconciles two fighting snakes. Zeus then appoints Hermes herald of the
    gods and conductor of shades to Hades. The passage also lists later messenger
    duties and playful thefts by Hermes.
  language: English
  quote_policy: summarized
