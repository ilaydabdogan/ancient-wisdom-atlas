canonical_text:
  quote: ''
  summary: Penelope sets a bow-and-rings test for her suitors. The disguised Odysseus
    succeeds, kills Antinous, and with Telemachus kills the suitors. Penelope tests
    him with knowledge of their immovable olive-tree bed and recognizes him. Odysseus
    then reveals himself to Laertes, and after a brief rebellion by the suitors' kin,
    he is reconciled with his subjects and continues to reign.
  language: English
  quote_policy: summarized
