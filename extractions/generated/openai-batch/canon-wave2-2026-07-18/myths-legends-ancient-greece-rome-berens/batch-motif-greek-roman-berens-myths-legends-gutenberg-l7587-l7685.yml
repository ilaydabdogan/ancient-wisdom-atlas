canonical_text:
  quote: ''
  summary: 'The passage recounts the early life of Heracles: his divine and mortal
    parentage, exposure as an infant, Hera''s accidental nursing of him, Hera''s later
    attempt to kill him with snakes, his education and youthful strength, his killing
    of Linus, his moral choice between Vice and Virtue, and his slaying of the lion
    on Mount Cithaeron.'
  language: English
  quote_policy: summarized
