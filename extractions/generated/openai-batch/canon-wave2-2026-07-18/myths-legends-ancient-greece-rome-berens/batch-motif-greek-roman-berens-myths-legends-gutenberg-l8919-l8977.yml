canonical_text:
  quote: ''
  summary: The passage recounts Menoeceus’ self-sacrifice on the walls of Thebes,
    the Argive-Theban battle, the mutual death of Eteocles and Polynices in single
    combat, Creon’s prohibition of burial and Antigone’s defiance, Antigone’s entombment
    and the suicides of Haemon and Eurydice, and Theseus’ later campaign to restore
    the Argive dead for funeral rites.
  language: English
  quote_policy: summarized
