canonical_text:
  quote: ''
  summary: The passage recounts Cadmus’s search for Europa, the Delphic oracle directing
    him to found a city marked by an unyoked heifer, the slaying of Ares’ dragon,
    the sowing of the dragon’s teeth and emergence of earth-born warriors, the founding
    of Thebes, Cadmus’s punishment and marriage to Harmonia, the fatal necklace, and
    the final transformation of Cadmus and Harmonia into serpents and transfer to
    Elysium.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Agenor, king of Phoenicia, sends Cadmus to search for Europa after Zeus abducts
    her and tells him not to return without his sister.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After searching unsuccessfully for years, Cadmus consults the oracle of Apollo
    at Delphi, which tells him to stop searching and found a city at a site indicated
    by an unyoked heifer.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A heifer without marks of servitude walks before Cadmus and lies down on the
    later site of Thebes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Cadmus plans to sacrifice the heifer and sends followers to bring water for
    the libation from a neighboring spring sacred to Ares.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A fierce dragon guards the spring and kills Cadmus’s retainers when they approach.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cadmus finds the remains of his followers, attacks the dragon, and kills it
    by fixing his spear within its jaws.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Pallas-Athene appears to Cadmus and commands him to sow the teeth of the dead
    dragon in the ground.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Armed men arise from the furrows and fight one another until only five remain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The five surviving warriors make peace with one another, help Cadmus build
    Thebes, and are later claimed as ancestors by noble Theban families.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ares becomes angry because Cadmus killed his dragon; Zeus intervenes and Cadmus’s
    punishment is reduced to eight years of servitude.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: After the period of servitude, Ares reconciles with Cadmus and gives him Harmonia
    in marriage.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The gods attend the wedding of Cadmus and Harmonia and bring gifts and congratulations.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Cadmus gives Harmonia a necklace fashioned by Hephaestus, which later proves
