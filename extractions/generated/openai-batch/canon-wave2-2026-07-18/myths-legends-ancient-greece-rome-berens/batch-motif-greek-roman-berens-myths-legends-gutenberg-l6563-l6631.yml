comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the nuptials of Cadmus and Harmonia with
    those of Peleus and Thetis in terms of their celebrated status; within the same
    sentence group, it also notes divine attendance and gifts at Cadmus and Harmonia’s
    wedding.
  claim_level: same_function
  target: Nuptials of Peleus and Thetis in Greek mythic tradition
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives no details about the Peleus and Thetis wedding beyond
    the comparison of fame, so the claim should be limited to a cautious parallel
    in celebrated divine-attended heroic weddings.
