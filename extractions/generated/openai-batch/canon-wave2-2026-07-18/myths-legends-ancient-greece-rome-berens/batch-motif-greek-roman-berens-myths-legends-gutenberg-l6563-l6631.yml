  cautions: The available taxonomy term 'stolen_beloved' is broader than the passage’s
    specific sister/daughter relationship.
- id: motif:2
  label: oracle-directed city foundation
  taxonomy_refs:
  - culture_hero
  basis: Apollo’s oracle redirects Cadmus from his search to the duty of founding
    a city, with the site to be shown by a heifer.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
  confidence: high
  cautions: The passage presents the founding in handbook form and does not elaborate
    ritual or civic institutions beyond the founding itself.
- id: motif:3
  label: site-marking sacrificial heifer
  taxonomy_refs:
  - sacrifice
  basis: The heifer marks the future site of Thebes by lying down, after which Cadmus
    resolves to sacrifice it and sends for libation water.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage states Cadmus intends the sacrifice but does not narrate the
    completed sacrifice.
- id: motif:4
  label: dragon guardian slain by hero
  taxonomy_refs:
