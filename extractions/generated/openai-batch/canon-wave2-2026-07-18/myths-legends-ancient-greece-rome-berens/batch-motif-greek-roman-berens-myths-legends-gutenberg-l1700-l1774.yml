canonical_text:
  quote: ''
  summary: Demeter loses Persephone when Aides abducts her from a flower meadow into
    the lower world with Zeus's permission. Demeter searches with torches, learns
    the truth from Hecate and Helios, leaves Olympus in grief, and wanders earth disguised
    as an old woman. At Eleusis she is received into the household of Celeus and Metaneira
    as nurse to their infant son. She secretly anoints the child with ambrosia and
    places him in fire to make him immortal, but Metaneira interrupts. Demeter reveals
    herself, declares the immortalization impossible, promises honor for the child,
    and commands that a temple, altar, and rites be established for her at Eleusis.
  language: English
  quote_policy: summarized
