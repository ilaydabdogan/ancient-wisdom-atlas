canonical_text:
  quote: ''
  summary: 'Introductory passage describing the supposed nature of Greek gods: anthropomorphic
    but superior and immortal, capable of passions, punishment, union with mortals,
    rapid movement, invisibility, shapeshifting, and transformation of humans. It
    also describes their Olympian residence, worship and sacrifice, the personification
    of natural phenomena, giants connected with convulsions of nature, and the possible
    posthumous deification of distinguished humans.'
