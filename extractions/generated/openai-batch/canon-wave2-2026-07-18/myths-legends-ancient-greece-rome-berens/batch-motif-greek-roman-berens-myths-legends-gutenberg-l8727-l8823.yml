candidate_motifs:
- id: motif:1
  label: fatal oracle resisted but fulfilled
  taxonomy_refs: []
  basis: The oracle to Laius prompts the attempted destruction of the infant, while
    the later oracle to Oedipus prompts his avoidance of Corinth; the events nonetheless
    lead to Laius's death and Oedipus's marriage to Jocaste.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:6
  - ev:7
  - ev:11
  - ev:14
  confidence: high
  cautions: The available taxonomy list does not include a specific fate-oracle motif
    family.
- id: motif:2
  label: exposed royal infant survives through transfer and adoption
  taxonomy_refs: []
  basis: The infant marked for death on Mount Cithaeron is spared by a servant, transferred
    to a shepherd, named, and adopted by Polybus and Merope.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The child's survival is not described as miraculous or divine in this
    passage.
- id: motif:3
  label: riddle contest defeats lethal monster
  taxonomy_refs:
  - wisdom
  basis: The Sphinx kills those who fail her riddles, but Oedipus solves one and thereby
    brings about the monster's death.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage does not provide the wording of the riddle.
- id: motif:4
  label: deliverer gains throne and royal marriage
  taxonomy_refs:
  - royal_legitimacy
  basis: Creon offers the kingdom and Jocaste's hand to the solver of the Sphinx's
    riddle, and Oedipus receives that reward after solving it.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The legitimacy is presented as a proclaimed reward rather than a detailed
    succession ritual.
- id: motif:5
  label: hidden blood-guilt brings communal pollution
  taxonomy_refs:
  - divine_judgment
  basis: The gods afflict the country with pestilence, and the oracle says the plague
    will continue until Laius's blood is purified and the murderer punished.
  evidence_refs:
  - ev:13
