canonical_text:
  quote: ''
  summary: 'The passage recounts the story of Oedipus: an oracle warns Laius that
    his son will kill him; the infant is exposed but rescued and adopted in Corinth;
    Oedipus later hears an oracle that he will kill his father and marry his mother,
    leaves Corinth, unknowingly kills Laius, solves the Sphinx''s riddle, becomes
    king of Thebes and marries Jocaste, later learns the truth after a plague and
    prophetic inquiry, blinds himself, and goes into exile accompanied by Antigone,
    eventually finding refuge at Colonus.'
  language: English
  quote_policy: summarized
literal_observations:
