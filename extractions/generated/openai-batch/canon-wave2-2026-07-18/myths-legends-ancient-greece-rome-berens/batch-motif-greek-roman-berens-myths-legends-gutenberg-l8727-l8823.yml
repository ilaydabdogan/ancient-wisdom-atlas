  text: The shepherd unbinds the infant's swollen feet, names him Oedipus, and brings
    him to Polybus, who arranges his adoption by Polybus and Merope.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After being taunted about his parentage, Oedipus consults Delphi and is told
    that he is fated to kill his father and marry his mother.
