canonical_text:
  quote: ''
  summary: 'The passage recounts several labours of Heracles: capturing the horned
    hind sacred to Artemis, capturing the Erymantian boar after a Centaur episode
    that causes the deaths of Chiron and Pholus, cleansing Augeas''s stables by diverting
    rivers, driving away the Stymphalides with Athene''s aid, and introducing the
    labour of capturing the Cretan bull.'
  language: English
  quote_policy: summarized
