literal_observations:
- id: obs:1
  text: Greek settlers in Taurica found that the Scythian inhabitants had a native
    divinity resembling Artemis and identified that divinity with the Greek huntress-goddess.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The worship of Taurian Artemis required all male or female strangers landing
    or shipwrecked on her shores to be sacrificed on her altars.
