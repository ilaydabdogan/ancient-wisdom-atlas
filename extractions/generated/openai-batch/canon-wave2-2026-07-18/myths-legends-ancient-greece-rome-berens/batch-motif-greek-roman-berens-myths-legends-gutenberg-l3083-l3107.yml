canonical_text:
  quote: ''
  summary: The passage identifies Roman Diana with Greek Artemis and describes Diana's
    heavenly, earthly, and lower-world aspects. It explains her title Trivia through
    statues at three-road meeting points, notes a temple on the Aventine hill associated
    with Servius Tullius, and describes the Nemoralia at Lacus Nemorensis, where the
    priest was a fugitive slave who gained office by killing his predecessor and remained
    armed against new challengers.
  language: English
  quote_policy: summarized
