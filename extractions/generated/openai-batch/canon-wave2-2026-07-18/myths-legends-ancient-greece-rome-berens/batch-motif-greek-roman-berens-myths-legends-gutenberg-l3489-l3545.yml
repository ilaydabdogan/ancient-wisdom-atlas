canonical_text:
  quote: ''
  summary: The passage describes Thetis as a beautiful sea-related goddess or nymph
    pursued by Zeus, Poseidon, and Peleus; her shapeshifting resistance to Peleus;
    their divine wedding; her later aid to Achilles; and her transformation of Halcyone
    and Ceyx into kingfishers. It then presents Thaumas, Phorcys, and Ceto as personifications
    of sea phenomena, with Thaumas linked to wonder and reflective sea surfaces, Electra
    to amber tears, and Phorcys and Ceto to ocean perils and monstrous offspring.
  language: English
  quote_policy: summarized
