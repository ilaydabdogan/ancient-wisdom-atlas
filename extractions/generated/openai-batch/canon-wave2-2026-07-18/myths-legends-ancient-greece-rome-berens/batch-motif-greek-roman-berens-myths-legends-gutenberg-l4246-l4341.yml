  summary: The passage describes the route of blessed spirits to Elysium, the river
    Lethe and transmigration, the judgment and punishment of guilty souls in Hades
    and Tartarus, several exemplary underworld punishments, and the conventional representation
    and worship of Aides.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Blessed spirits pass out on the right, visit the golden palace where Aides
    and Persephone hold court, receive a greeting, and proceed to the Elysian Fields.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Elysium is described as a pleasant region with fragrant air, brooks, meadows,
    flowers, groves, birdsong, and continuations of earthly occupations and amusements.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lethe is a gentle, silent stream in a secluded vale of Elysium whose waters
    dispel care and produce forgetfulness of former events.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: According to the passage's account of Pythagorean doctrine, shades dwell in
    Elysium for a thousand years, then animate other bodies on earth after drinking
    from Lethe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Guilty souls leave Minos, are conducted to the judgment-hall of Hades, and
    encounter the fire-bearing river Phlegethon around adamant walls.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rhadamanthus declares the torments awaiting each guilty soul in Tartarus;
    the Furies scourge the sinners and drag them to the gate of Tartarus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tartarus is described as a vast gloomy expanse far below Hades, containing
    Titans, Otus, Ephialtes, and named sufferers including Tityus, Tantalus, Sisyphus,
    Ixion, and the Danaides.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tityus is punished in Tartarus by two vultures that continually gnaw his liver
    after he insulted Hera.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tantalus is punished in Tartarus with unreachable water and fruit after offenses
    including insulting Zeus, stealing divine food and drink, and killing and serving
    Pelops to the gods.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sisyphus is condemned to roll a huge stone up a hill repeatedly, with the
    stone always rolling back down.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ixion is struck by Zeus, thrown into Tartarus by Hermes, and bound to an ever-revolving
    wheel after aspiring to Hera's favour.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Danaides, except Hypermnestra, kill their husbands in one night and are
    punished by filling with water a vessel full of holes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Aides is represented as a stern mature man seated with Persephone on an ebony
    throne, holding either a two-pronged fork or the keys of the lower world, with
    Cerberus at his feet.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: Aides is also sometimes shown in a golden chariot drawn by four black horses
    and wearing an invisibility helmet made by the Cyclops.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: Aides is said to have been worshipped throughout Greece, with temples in Elis,
    Olympia, and Athens.
  category: setting
  evidence_refs:
  - ev:11
