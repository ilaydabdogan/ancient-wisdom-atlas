candidate_motifs:
- id: motif:1
  label: Mapped afterlife with divergent routes for blessed and guilty souls
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage lays out rightward passage to Elysium, royal underworld reception,
    Lethe, judgment-hall, Phlegethon, gate, and Tartarus.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage is a handbook summary rather than a single narrative episode.
- id: motif:2
  label: Afterlife judgment assigning punishments
  taxonomy_refs:
  - divine_judgment
  basis: Guilty souls leave Minos, appear before Rhadamanthus, and receive declared
    torments before being sent to Tartarus.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: Minos's role is only indirectly indicated in this excerpt.
- id: motif:3
  label: Forgetfulness water before rebirth
  taxonomy_refs:
  - death_rebirth
  basis: The passage says shades drink from Lethe to forget the past before animating
    other bodies on earth under the Pythagorean doctrine of transmigration.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The motif is framed as a doctrinal account rather than an individualized
    mythic action.
- id: motif:4
  label: Sacred theft of divine food and drink
  taxonomy_refs:
  - sacred_theft
  basis: Tantalus steals nectar and ambrosia from the table of the gods and shares
    them with friends.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is one offense among several attributed to Tantalus in the passage.
- id: motif:5
  label: Banquet test of divine omniscience through slain child
  taxonomy_refs:
  - sacrifice
  basis: Tantalus kills his son Pelops and serves him to the gods at a banquet to
    test their omniscience.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage does not call the act a sacrifice; the taxonomy link is approximate
    because the literal action is killing and serving at a divine banquet.
- id: motif:6
  label: Endless futile task as underworld punishment
  taxonomy_refs: []
  basis: Sisyphus repeatedly rolls a stone that falls back, and the Danaides endlessly
    try to fill a vessel full of holes.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: No supplied taxonomy family exactly names futile labor.
- id: motif:7
  label: Unattainable sustenance as punishment
  taxonomy_refs: []
