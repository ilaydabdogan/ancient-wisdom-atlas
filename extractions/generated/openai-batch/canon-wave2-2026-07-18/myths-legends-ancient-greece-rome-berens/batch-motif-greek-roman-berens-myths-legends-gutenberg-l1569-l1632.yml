  quote: ''
  summary: The passage describes Themis as a goddess of justice, order, assemblies,
    hospitality, ritual, wisdom, and prophecy, including her iconography with sword,
    scales, and bandaged eyes and her relation to an older prophetic Themis. It then
    describes Hestia as goddess of fire and the domestic hearth, explains the sacred
    household and civic functions of the hearth-fire, and notes the transfer of sacred
    fire by emigrants to new colonies.
