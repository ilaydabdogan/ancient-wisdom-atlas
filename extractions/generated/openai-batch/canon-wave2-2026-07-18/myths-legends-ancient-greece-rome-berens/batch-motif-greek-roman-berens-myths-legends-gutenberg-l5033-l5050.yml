  summary: The passage describes Juventas as the Roman divinity identified with Hebe,
    with Roman emphasis on the state's imperishable vigour and immortal glory, and
    notes temples to her in Rome. It then describes Ganymedes, son of Tros of Troy,
    being seen by Zeus while drawing water on Mount Ida; Zeus sends his eagle to carry
    him to Olympus, where Ganymedes receives immortality and becomes cup-bearer to
    the gods. His youthful beauty is also described.
