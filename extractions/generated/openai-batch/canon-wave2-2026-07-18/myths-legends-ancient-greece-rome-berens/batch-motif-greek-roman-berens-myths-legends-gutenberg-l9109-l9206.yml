canonical_text:
  quote: ''
  summary: The passage recounts the persecution and asylum of the children of Heracles,
    Macaria's voluntary sacrifice for Athenian victory, Iolaus's temporary restoration
    to youthful strength in battle, the death of Eurystheus, and successive failed
    attempts by the Heraclidae and their descendants to reclaim the Peloponnesus under
    oracular directions, ending with lightning, a mistaken killing of a soothsayer,
    divine storms, famine, and pestilence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Heracles' apotheosis, his children are persecuted by Eurystheus, flee
    first to Ceyx at Trachin with Iolaus as guide and protector, and then seek refuge
    at Athens with Demophoon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An oracle announces that the sacrifice of a noble-born maiden is necessary
    for Athenian victory, and Macaria voluntarily offers herself to death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hyllus arrives with a large army to assist his brothers, and Demophoon joins
    his forces to Hyllus's army.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: During battle, Iolaus borrows Hyllus's chariot and prays to Zeus and Hebe
    to restore his youthful vigor for one day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A cloud descends from heaven and envelops the chariot; after it disappears,
    Iolaus appears restored to manly vigor, leads warriors, and the enemy flees.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Eurystheus is taken prisoner and put to death by Demophoon's command.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hyllus and the Heraclidae invade the Peloponnesus as their lawful patrimony,
    which the passage links to Zeus's will for Heracles and Hera's earlier interference.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: After twelve months in the Peloponnesus, a pestilence spreads through the
    peninsula and compels the Heraclidae to evacuate and return to Attica.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hyllus consults Delphi and receives the instruction to wait for the third
    fruit; he interprets it as the third summer and invades again after three years.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the isthmus of Corinth, Hyllus proposes single combat to decide the claim;
    Echemon accepts and kills Hyllus, after which the Heraclidae withdraw to Marathon
    according to the agreement.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Cleodaeus later invades the Peloponnesus and perishes there with all his forces.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Aristomachus consults an oracle promising victory by way of the defile, but
    the Heraclidae are defeated and Aristomachus dies in battle.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The sons of Aristomachus receive an explanation that the third fruit means
    the third generation and the defile means the straits on the right of the isthmus.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: As Temenus prepares an army and war fleet, Aristodemus is struck by lightning,
    Hippolytes kills a soothsayer whom he mistakes for a spy, and the gods send tempests,
    famine, and pestilence against the expedition.
  category: sequence
  evidence_refs:
  - ev:12
