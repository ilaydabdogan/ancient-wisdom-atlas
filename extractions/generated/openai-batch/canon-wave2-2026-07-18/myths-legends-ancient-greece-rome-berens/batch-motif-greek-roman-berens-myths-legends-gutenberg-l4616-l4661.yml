canonical_text:
  quote: ''
  summary: The passage describes the Gorgons as three daughters of Phorcys and Ceto,
    terrifying serpent-haired monsters dwelling in the far West and serving Aides
    by frightening punished shades. It then narrates Medusa’s original beauty, vow
    as priestess of Athene, union with Poseidon, punishment by Athene through monstrous
    transformation, exile, snake-generating wanderings, petrifying gaze, death by
    Perseus, and descendants.
  language: English
  quote_policy: summarized
