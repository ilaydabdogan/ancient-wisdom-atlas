canonical_text:
  quote: ''
  summary: The passage describes the worship of Zeus at Dodona and Olympia; the Dodona
    oak oracle and its priests; Olympic worship and games as a unifying Greek institution;
    sacred animals, trees, mountains, and sacrifices of Zeus; Zeus's seven immortal
    wives; the swallowing of Metis and the birth of Athene from Zeus's head; brief
    attributes of Themis, Eurynome, Demeter, and Mnemosyne; Leto's persecution by
    Hera and Python, Zeus's creation of Delos as a refuge, the birth of Apollo and
    Artemis there, and a variant in which Leto becomes a quail.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Zeus is described as first worshipped at Dodona in Epirus, at the foot of
    Mount Tomarus on the shore of Lake Joanina.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Dodona, the voice of the god was supposed to be heard in the rustling leaves
    of a giant oak, and the priests called Selli interpreted the revelations.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lead plates found at Dodona contained inquiries to the oracle about health,
    fortune, a child, and a proposed sheep speculation with a promised gift.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Olympia in Elis is described as the great national seat of Zeus's worship,
    with a temple, a colossal statue, worshippers from across Greece, and games held
    every four years.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Olympic gatherings are described as temporarily uniting Greeks from many
    states in common festivities.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Zeus is represented with an eagle; the eagle, the oak-tree, and mountain summits
