canonical_text:
  quote: ''
  summary: 'The passage describes the women-only Thesmophoria for Demeter, then several
    festivals of Dionysus: the Greater Dionysia at Athens with public decoration,
    processions, music, costumes, wine, dramatic contests, and revelry; the Lesser
    Dionysia as rural vintage festivals; nocturnal mystic rites of initiated Maenads
    or Bacchantes involving fawn-skins, torches, thyrsi, ecstatic dancing, and the
    tearing apart of a sacrificial animal; and the later Roman Bacchanalia, which
    included men and was eventually prohibited by state authorities.'
  language: English
  quote_policy: summarized
