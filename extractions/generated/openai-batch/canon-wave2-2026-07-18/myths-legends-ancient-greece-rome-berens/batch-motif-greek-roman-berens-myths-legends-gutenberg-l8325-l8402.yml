- id: motif:5
  label: Divine aid provides magical equipment and mount
  taxonomy_refs: []
  basis: After Bellerophon invokes the gods, Pegasus is sent to aid him, and Pallas-Athene
    gives him a magic bridle in a dream so he can capture the winged horse.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not explicitly call the episode an initiation or quest,
