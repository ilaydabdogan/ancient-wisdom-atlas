candidate_motifs:
- id: motif:1
  label: False accusation after rejected desire
  taxonomy_refs: []
  basis: Antea loves Bellerophon, he does not return her affection, and she retaliates
    by slandering him to Proetus, setting the lethal sequence in motion.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage reports the accusation and its consequence but does not provide
    Antea's speech or detailed legal setting.
- id: motif:2
  label: Death-bearing message entrusted to the intended victim
  taxonomy_refs: []
  basis: Proetus sends Bellerophon to Iobates with mysterious signs indicating that
    the bearer should be put to death.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The signs are described generally, not quoted or decoded in detail.
- id: motif:3
  label: Hospitality delaying or redirecting violence
  taxonomy_refs: []
  basis: Iobates hospitably entertains Bellerophon before reading the message and
    then avoids direct murder by assigning dangerous enterprises.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage frames the behavior through Greek hospitality, but no ritual
    terminology beyond hospitality is supplied.
- id: motif:4
  label: Composite fire-breathing monster slain by mounted hero
  taxonomy_refs: []
  basis: The Chimaera is a lion-goat-dragon composite with flames from its jaws, and
    Bellerophon kills it from Pegasus with arrows.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: No external monster-slaying taxonomy reference is supplied in the available
