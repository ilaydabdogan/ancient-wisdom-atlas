canonical_text:
  quote: ''
  summary: The passage recounts Bellerophon's lineage, flight and purification, Antea's
    accusation, Proetus' death-bearing message to Iobates, Iobates' hospitality and
    lethal tasks, Bellerophon's slaying of the Chimaera with Pegasus and divine help,
    his victories over further opponents, his reward with rule and marriage, his later
    attempt to reach heaven on Pegasus, Zeus' punishment, his melancholy wandering,
    and posthumous hero honors at Corinth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bellerophon, also called Bellerophontes, is identified as the son of Glaucus,
    king of Corinth, and grandson of Sisyphus.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After an unpremeditated murder, Bellerophon fled to Tiryns, where Proetus
    received him and purified him from the crime.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Antea, wife of Proetus, fell in love with Bellerophon; after he did not return
    her affection, she slandered him to Proetus.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Proetus wished Bellerophon dead but avoided killing him directly and sent
    him to Iobates with a tablet or letter bearing mysterious signs requesting the
    bearer's death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Iobates hosted Bellerophon in a princely manner for nine days before asking
    his name and errand on the tenth morning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After reading the message, Iobates decided not to murder his guest directly
    but to send him on dangerous enterprises likely to kill him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The first enterprise was to kill the Chimaera, a monster devastating the country.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Chimaera is described as having the front part of a lion, the middle of
    a goat, the hind part of a dragon, and flames issuing from its jaws.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Before the task, Bellerophon invoked the gods, who sent Pegasus, the immortal
    winged horse, to aid him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the sacred spring Pirene, Pallas-Athene appeared to Bellerophon in a dream
    and gave him a magic bridle; on waking, he found the bridle beside him and Pegasus
    drinking nearby.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bellerophon put the bridle on Pegasus, mounted him, rose into the air, and
    slew the Chimaera with arrows.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: Iobates next sent Bellerophon against the Solymans and then the Amazons; Bellerophon
    returned victorious from both expeditions.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Iobates then placed Lycians in ambush against Bellerophon, but Bellerophon
    slew them all, and Iobates concluded that the gods had protected him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Iobates admitted Bellerophon to a share in government and gave him his daughter
    in marriage.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: After attaining prosperity, Bellerophon tried to mount to heaven on Pegasus;
    Zeus sent a gadfly to sting the horse, and Pegasus threw Bellerophon to the earth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: After the fall, Bellerophon was remorseful, became deeply melancholy, and
    wandered in lonely and desolate places for the rest of his life.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: After death, Bellerophon was honored in Corinth as a hero, and an altar was
    erected to him in the grove of Poseidon.
  category: action
  evidence_refs:
  - ev:9
