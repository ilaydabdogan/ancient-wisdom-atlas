canonical_text:
  quote: ''
  summary: The passage recounts Cronus's rule, his marriage to Rhea, his swallowing
    of their children to avoid a prophecy, Rhea's concealment of Zeus through a stone-substitution
    trick, Zeus's secret nurture in Crete, the restoration of Zeus's siblings, the
    Titanomachia between Zeus and Cronus, Cronus's defeat and loss of power, and Cronus's
    later iconography as Time with scythe and hour-glass.
  language: English
  quote_policy: summarized
