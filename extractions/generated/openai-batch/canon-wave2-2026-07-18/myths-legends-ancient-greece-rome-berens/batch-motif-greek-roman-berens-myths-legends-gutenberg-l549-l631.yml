candidate_motifs:
- id: motif:1
  label: Father attempts to prevent succession by consuming children
  taxonomy_refs:
  - divine_parent_child
  basis: Cronus fears that his children will rise against him and swallows each child
    at birth to make the prophecy impossible.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage presents the action as prophecy avoidance; it does not elaborate
    a broader ritual or symbolic meaning.
- id: motif:2
  label: Hidden rescued divine child
  taxonomy_refs:
  - miraculous_child
  basis: Zeus is saved by a stone-substitution, sent secretly to Crete, hidden in
    a cave, nourished by special helpers, and grows rapidly in power and wisdom.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage emphasizes rescue, concealment, and nurture more than miraculous
    birth itself.
- id: motif:3
  label: Maternal protection through deceptive substitute
  taxonomy_refs:
  - mother_goddess
  basis: Rhea acts to save Zeus, with advice from Uranus and Gaea, by giving Cronus
    a stone wrapped as a baby.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The available taxonomy label is broad; the passage specifically describes
    a mother using deception to protect a child.
- id: motif:4
  label: Swallowed beings restored to light
  taxonomy_refs:
  - return
  basis: Zeus seeks to compel Cronus to restore his brothers and sisters, and Metis's
    potion causes Cronus to give back the swallowed children.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The text says the children are restored from being swallowed, but it does
    not describe an afterlife journey or full death-and-rebirth sequence.
- id: motif:5
  label: Divine succession war and transfer of sovereignty
  taxonomy_refs:
  - divine_parent_child
  - royal_legitimacy
  basis: War between Cronus and Zeus becomes inevitable; Zeus defeats Cronus and supreme
    power becomes vested in Zeus.
  evidence_refs:
  - ev:9
  - ev:12
  confidence: high
  cautions: Royal legitimacy is inferred only from the passage's language of supreme
    power and succession.
- id: motif:6
  label: Cosmic upheaval during divine battle
  taxonomy_refs:
  - chaos
  basis: The battle causes all nature to throb, with sea upheaval, earthquakes, thunder,
    lightning, and blinding mist.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage describes violent natural disorder during battle, not primordial
    creation chaos.
