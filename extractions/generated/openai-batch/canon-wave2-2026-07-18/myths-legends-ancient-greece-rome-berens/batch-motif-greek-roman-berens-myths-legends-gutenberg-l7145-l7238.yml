canonical_text:
  quote: ''
  summary: The passage recounts the Argonauts receiving Phineus's guidance, passing
    safely between the Symplegades by releasing a dove, driving away feather-shooting
    birds on Aretias, meeting the sons of Phryxus, arriving at Colchis, seeing the
    Golden Fleece in the sacred grove of Ares, and beginning negotiations with king
    Aetes, who conditionally promises the Fleece if the heroes prove divine origin
    through a superhuman task.
  language: English
  quote_policy: summarized
