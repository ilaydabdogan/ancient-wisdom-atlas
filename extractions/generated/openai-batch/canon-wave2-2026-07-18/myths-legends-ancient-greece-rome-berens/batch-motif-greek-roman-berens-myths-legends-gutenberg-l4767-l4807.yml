canonical_text:
  quote: ''
  summary: The passage describes Ananke/Necessitas as Tyche in the character of inevitable
    natural law, represented at Athens with bronze hands and implements or fetters.
    It then describes Ker as an individual divinity appointed at birth whose balance-weighing
    can determine life or death, Keres as battlefield slaughter goddesses, and Ate
    as a daughter of Zeus and Eris who causes evil, is expelled from Olympus, and
    wanders among humans causing dissension.
  language: English
  quote_policy: summarized
