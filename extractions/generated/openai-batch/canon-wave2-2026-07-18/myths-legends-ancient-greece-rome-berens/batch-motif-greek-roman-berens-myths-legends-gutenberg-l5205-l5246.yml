canonical_text:
  quote: ''
  summary: The passage describes the Charites, or Graces, as three sister personifications
    of graceful and refining qualities. It gives their names, alternate divine parentage,
    iconographic representation, powers over beauty and enjoyment, cult honors, association
    with the Muses, service to Aphrodite with the Seasons, and attendance on other
    divinities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Greeks are said to have personified gentler attributes as three lovely
    sisters named Euphrosyne, Aglaia, and Thalia.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The three sisters are described as daughters of Zeus and Eurynome, with a
    later alternative parentage from Dionysus and Aphrodite.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: They are represented as beautiful slender maidens in youth, with hands and
    arms intertwined, either undraped or wearing a transparent ethereal garment.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: They are said to preside over grace, modesty, beauty, gentleness, kindliness,
    innocent joy, purity, and eternal youth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: They are said to possess perfect beauty and to confer beauty upon others;
    pleasures and enjoyments are described as incomplete without their presence.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Temples and altars were erected for them; incense was burned, they were invoked
    at banquets, and libations were poured to them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Their influence is described as moderating the exciting effects of wine.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Music, eloquence, poetry, and art are described as the direct work of the
    Muses but as receiving added refinement and beauty from the Graces.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Graces are described as friends of the Muses and as living with them on
    Mount Olympus.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Their special function is said to be attendance, with the Seasons, upon Aphrodite,
    whom they adorn with wreaths of flowers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Aphrodite is described as emerging from their hands like the Queen of Spring,
    perfumed with roses, violets, and other sweet-scented blossoms.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Graces are described as attending other divinities, carrying music for
    Apollo, myrtles for Aphrodite, and accompanying the Muses, Eros, or Dionysus.
  category: action
  evidence_refs:
  - ev:8
