canonical_text:
  quote: ''
  summary: Pirithoeus persuades Theseus to accompany him into the lower world to carry
    off Persephone. Hades has them seized and bound at the entrance of his realm;
    Heracles later releases Theseus but Pirithoeus remains punished. During Theseus'
    absence, Castor and Pollux recover Helen from Athens with Academus' help, and
    Menesthius leads a revolt. Theseus briefly restores order, abdicates, retires
    to Scyros, and is treacherously killed by Lycomedes. Centuries later Cimon returns
    Theseus' remains to Athens by Delphic command, and a temple is erected in his
    honor.
  language: English
  quote_policy: summarized
