comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Apollo with Helios by stating that Apollo
    inherited Helios's sun-god function and that the two were later identified, merged,
    or confounded, including the name Helios-Apollo among Ionians.
  claim_level: same_function
  target: Helios as sun-god / Helios-Apollo identification
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This is based only on the supplied handbook passage; no independent
    Helios passage is provided here.
- id: claim:2
  claim: The passage presents Apollo and Artemis as complementary divine siblings
    with a shared death-dealing function divided by gendered targets.
  claim_level: same_function
  target: Artemis as moon-goddess death-dealer
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to this functional pairing; the passage does
    not give a separate Artemis myth.
- id: claim:3
  claim: The passage connects Apollo's death-bringing arrows with a nearby Greek epic
    tradition by citing the Iliad example of Apollo sending pestilence into the Greek
    camp.
  claim_level: same_motif
  target: Iliad episode of Apollo's plague against the Greek camp
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The passage summarizes the Iliadic episode rather than quoting or analyzing
    the underlying epic passage.
