canonical_text:
  quote: ''
  summary: The passage introduces Phoebus-Apollo as a major Greek deity of light,
    prophecy, music, poetry, arts, and sciences; recounts his birth on Delos to Zeus
    and Leto, his miraculous growth after Themis feeds him divine food, his claim
    to lyre, bow, and prophecy, and his ascent to Olympus. It then describes Apollo's
    identification with Helios as sun-god, his life-giving and death-dealing solar
    powers, his shared death function with Artemis, an Iliadic plague episode, and
    his roles as protector of shepherds and god of healing.
  language: English
  quote_policy: summarized
