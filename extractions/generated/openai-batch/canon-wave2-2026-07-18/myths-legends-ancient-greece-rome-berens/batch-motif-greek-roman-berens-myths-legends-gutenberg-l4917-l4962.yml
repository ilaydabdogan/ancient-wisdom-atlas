canonical_text:
  quote: ''
  summary: Psyche is ordered by Aphrodite to descend to the underworld and obtain
    from Persephone a box of beauty charms. An unnamed voice instructs her in precautions
    for the journey, including Charon's toll, a cake for Cerberus, avoiding underworld
    banquets, and returning the box unopened. Psyche opens the box after leaving the
    lower world, falls into a death-like sleep from black vapour, and is awakened
    by Eros, who secures reconciliation with Aphrodite and Zeus's admission of Psyche
    among the immortal gods. The passage then describes the Olympian celebration of
    their reunion, offers an allegorical reading of the myth, and gives iconographic
    and Roman-name information for Eros.
  language: English
  quote_policy: summarized
