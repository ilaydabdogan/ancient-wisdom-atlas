- id: motif:1
  label: Coalition departure for a foreign war to recover a woman
  taxonomy_refs:
  - departure
  - stolen_beloved
  basis: The passage presents a Greek-wide mobilization and departure toward Troy
    in order to regain Helen after Menelaus' home is violated and Priam rejects her
    surrender.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage does not narrate Helen's initial removal in detail; the 'stolen_beloved'
    taxonomy is inferred from the stated need to regain Helen and demand her surrender.
- id: motif:2
  label: Reluctant hero compelled into war after a failed evasion ruse
  taxonomy_refs: []
  basis: Odysseus feigns madness to avoid the expedition, but Palamedes exposes the
    deception and Odysseus must join.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No supplied taxonomy reference precisely matches this ruse pattern.
- id: motif:3
  label: Divine mother attempts to avert son's heroic death
  taxonomy_refs:
  - divine_parent_child
  basis: Thetis, a sea-goddess and mother of Achilles, tries to prolong his life by
    hiding him after a prophecy offers either long obscurity or brief heroic glory.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The motif is grounded in the parent-child relationship and prophecy; broader
    heroic-fate interpretations require external comparison.
