canonical_text:
  quote: ''
  summary: Menelaus and Agamemnon seek Greek support to recover Helen from Troy. Odysseus
    is compelled to join after a feigned-madness ruse is exposed. Achilles, hidden
    by Thetis on Scyros to avoid a short heroic life, is discovered by Odysseus through
    his response to weapons and war music. The Greeks assemble at Aulis, reject a
    failed embassy to Priam, receive a serpent omen interpreted by Calchas as predicting
    a ten-year war, and depart, first mistakenly attacking Mysia, where Telephus and
    Patroclus are wounded and Achilles heals Patroclus.
  language: English
  quote_policy: summarized
