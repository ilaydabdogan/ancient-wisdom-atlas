canonical_text:
  quote: ''
  summary: 'The passage describes the Daphnephoria at Thebes as a festival held every
    ninth year in honor of Apollo. Its main feature is a procession to Apollo’s temple:
    a noble young priest called the Daphnephorus, crowned in gold and splendidly dressed,
    is preceded by a youth carrying an emblem of celestial and calendrical bodies
    and followed by maidens carrying laurel branches and singing hymns.'
