canonical_text:
  quote: ''
  summary: The passage concludes the Ion episode with an attempted poisoning exposed,
    divine intervention, recognition by infant tokens, reconciliation between Creusa
    and Ion, and prophecies about the Ionians and Dorians. It then recounts Daedalus
    as a master craftsman who kills his talented pupil Talus, flees to Crete, constructs
    the labyrinth for Minos and the Minotaur, escapes imprisonment by artificial wings
    with Icarus, loses Icarus when the youth flies too near the sun and falls into
    the sea, reaches Sicily, and is protected by Cocalus, who has Minos killed.
  language: English
  quote_policy: summarized
