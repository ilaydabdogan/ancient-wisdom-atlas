canonical_text:
  quote: ''
  summary: The passage explains allegorical meanings assigned to several marriages
    of Zeus with immortal wives, then recounts episodes involving mortal consorts.
    Zeus visits mortal women in disguises. Antiope bears Amphion and Zethus, who are
    exposed on Mount Cithaeron, rescued by a shepherd, and later avenge their mother.
    Amphion is associated with a lyre that moves stones for Thebes' walls. Leda's
    twin sons Castor and Pollux are linked to heroic exploits, combat, death, and
    shared immortality on alternate days. Europa is approached by Zeus as a white
    bull, carried over the sea to Crete, and becomes mother of Minos, Aeacus, and
    Rhadamanthus, later judges of the lower world.
  language: English
  quote_policy: summarized
