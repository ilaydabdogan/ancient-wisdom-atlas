canonical_text:
  quote: ''
  summary: Aetes sends Absyrtus and a Colchian fleet after Medea and the Golden Fleece.
    Medea and Jason lure Absyrtus to a night meeting in Artemis' temple, where Jason
    kills him and signals the Argonauts to attack. A prophetic Dodonean oak board
    warns that the Erinyes saw the murder and that Zeus' wrath will remain until Circe
    purifies the killers. Jason and Medea supplicate Circe, who performs rites involving
    altar fire, a dog sacrifice, and sacred cakes. The Argonauts continue their return
    voyage, evade the Sirens through Orpheus' music, pass Charybdis and Scylla with
    Hera's and Thetis' help, receive protection from Alcinous and Arete among the
    Phaeaces, and are later stranded on the Libyan Syrtes amid snakes said to have
    sprung from Medusa's blood. A Libyan prophetess tells Jason that a divine sea-horse
    guide will be sent.
  language: English
  quote_policy: summarized
