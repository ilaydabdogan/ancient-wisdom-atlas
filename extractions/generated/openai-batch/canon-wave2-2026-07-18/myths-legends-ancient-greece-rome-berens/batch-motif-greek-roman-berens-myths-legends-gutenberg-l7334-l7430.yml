candidate_motifs:
- id: motif:1
  label: pursuit after loss of a sacred object and woman
  taxonomy_refs:
  - sacred_theft
  - stolen_beloved
  basis: Aetes' pursuers demand Medea and the Golden Fleece, and later Colchians again
    demand Medea's restoration.
  evidence_refs:
  - ev:1
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage states loss and demanded restoration; the broader taxonomy
    labels are approximate because the passage itself does not explicitly call the
    Fleece sacred or frame Medea primarily as a beloved stolen from Jason.
- id: motif:2
  label: deceptive sibling meeting leading to murder
  taxonomy_refs:
  - sibling_pair
  basis: Medea lures her brother Absyrtus through a false promise, and Jason kills
    him while Medea keeps him in conversation.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The sibling relationship and deception are explicit; wider moral or ritual
    interpretation should be reviewed.
- id: motif:3
  label: blood guilt requiring divine purification
  taxonomy_refs:
  - divine_judgment
  - sacrifice
  basis: The prophetic board warns of the Erinyes and Zeus' wrath until Circe purifies
    Jason and Medea; Circe performs rites involving sacrifice and burned offerings.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage gives ritual details but does not explain their full cultic
    meaning.
- id: motif:4
  label: speaking sacred wood gives guidance
  taxonomy_refs:
  - wisdom
  - sacred_tree_axis
  basis: A prophetic board from the Dodonean oak speaks and directs the heroes to
    seek Circe's purification.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The object is explicitly wooden and prophetic, but the sacred-tree taxonomy
    is broad and should be checked against the wider Argonaut tradition.
- id: motif:5
  label: music counters deadly enchantment
  taxonomy_refs: []
  basis: The Sirens' enticing music endangers the Argonauts, while Orpheus' magic
    lyre and song absorb the listeners and allow the ship to pass safely.
  evidence_refs:
