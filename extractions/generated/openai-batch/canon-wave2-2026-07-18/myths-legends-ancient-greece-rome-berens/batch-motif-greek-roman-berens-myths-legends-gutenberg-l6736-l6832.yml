canonical_text:
  quote: ''
  summary: 'The passage recounts Perseus rescuing Andromeda from a sea dragon by using
    Medusa''s head, defeating Phineus and his warriors at the wedding feast, accidentally
    killing Acrisius in funeral games, founding cities, and giving Medusa''s head
    to Pallas-Athene. It then begins the legend of Ion: Creusa bears Apollo''s child,
    hides him in a basket in a cave, Hermes carries him to Delphi, a priestess raises
    him, Xuthus adopts him after an oracle, and a poisoned drink meant for Ion is
    exposed when a dove drinks from the libation and dies.'
  language: English
  quote_policy: summarized
