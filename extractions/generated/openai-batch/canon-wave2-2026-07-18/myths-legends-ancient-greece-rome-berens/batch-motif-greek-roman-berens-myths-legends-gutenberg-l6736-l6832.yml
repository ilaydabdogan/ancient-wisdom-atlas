candidate_motifs:
- id: motif:1
  label: Hero rescues maiden from dragon or sea monster
  taxonomy_refs:
  - serpent
  basis: Andromeda is presented as the dragon's victim; Perseus agrees to slay the
    dragon, confronts the sea monster, and delivers her.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage does not include the earlier cause of Andromeda's exposure,
    so any sacrificial reading should be treated cautiously.
- id: motif:2
  label: Petrifying head used as a weapon
  taxonomy_refs: []
  basis: Perseus uses Medusa's head to turn both the sea dragon and Phineus with his
    warriors into stone.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No supplied taxonomy family directly names this object-weapon pattern.
- id: motif:3
  label: Contested bride at wedding feast
  taxonomy_refs: []
  basis: Phineus, Andromeda's former betrothed, interrupts the nuptial banquet with
    armed followers to claim her from Perseus.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage frames the episode as a rivalry over a prior betrothal, not
    as an abduction.
- id: motif:4
  label: Oracle fulfilled through accidental killing
  taxonomy_refs: []
  basis: Acrisius flees because he fears the oracular prediction, but Perseus later
    accidentally kills him with a discus during funeral games.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The exact wording of the oracle is not given in this passage.
- id: motif:5
  label: Exposed divine child conveyed to sanctuary and fostered
  taxonomy_refs:
  - miraculous_child
  - ark_vessel
  - divine_parent_child
  basis: Ion, child of Creusa and Apollo, is placed in a wicker basket, hidden in
    a cave, carried by Hermes to Delphi, and adopted by a priestess.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage presents divine parentage and preservation, but does not describe
    overt miraculous birth circumstances beyond Apollo's paternity.
- id: motif:6
  label: Oracle-designated adoptive son
  taxonomy_refs: []
  basis: The oracle instructs Xuthus to regard the first person he meets after leaving
    the sanctuary as his son, and he accepts Ion accordingly.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage emphasizes adoption by oracle rather than biological recognition
    by Xuthus.
- id: motif:7
  label: Poisoned drink averted by ritual libation and animal death
  taxonomy_refs: []
  basis: Ion pours a libation before drinking; a dove drinks the poured wine and dies,
    revealing the poisoned drink's danger.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage says the event occurs as if by a miracle, but does not specify
    which deity causes the dove's intervention.
