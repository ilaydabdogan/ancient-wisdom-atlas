canonical_text:
  quote: ''
  summary: The passage identifies Roman Venus with Greek Aphrodite and summarizes
    Venus's Roman festivals, April association, and epithets. It then describes Helios/Sol
    as a life-giving sun-god introduced from Asia, gives his parentage, daily journey
    with Eos and Selene, later poetic return by a winged boat or cup, all-seeing oath-witness
    role, loves of Clytie and Leucothea, plant transformations, and family with Perse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Roman Venus is identified with Greek Aphrodite; Veneralia festivals are held
    for her, April is sacred to her, and she is worshipped as Venus Cloacina and Venus
    Myrtea.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The myrtle is stated to be the emblem of Love in connection with Venus Myrtea.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Helios worship is said to have been introduced into Greece from Asia, and
    Helios is described as sun-god and personification of life and life-giving power.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Helios is the son of the Titans Hyperion and Theia.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Eos precedes Helios at dawn, paints mountain tips, and draws aside a misty
    veil before his appearance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Helios drives a burnished-gold, flame-darting chariot drawn by four fire-breathing
    steeds; he stands with rays around his head and holds the reins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the evening Helios descends toward the deep sea, Selene follows to illuminate
    night, and sea-nymphs prepare a couch where Helios rests.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Later poets describe a winged boat or cup made by Hephaestus that conveys
    Helios and his equipage from the west back to the east.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Helios is invoked as witness to solemn oaths because nothing escapes his all-seeing
    eye; this enabled him to inform Demeter of her daughter's fate.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Helios is said to possess flocks and herds in various localities, which the
    passage says may possibly represent days and nights of the year or stars.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Helios loved Clytie, then transferred his devotion to Leucothea; Clytie informed
    Orchamus, who buried Leucothea alive.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Helios tried unsuccessfully to restore Leucothea to life, sprinkled her grave
    with heavenly nectar, and a frankincense shoot grew there.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Clytie refused sustenance for nine days, faced Helios as he crossed the heavens,
    became rooted in the ground, and was transformed into a flower that turns toward
    the sun.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Helios married Perse, daughter of Oceanus; their children were Aetes, king
    of Colchis and possessor of the Golden Fleece, and Circe, a sorceress.
  category: relationship
  evidence_refs:
  - ev:10
