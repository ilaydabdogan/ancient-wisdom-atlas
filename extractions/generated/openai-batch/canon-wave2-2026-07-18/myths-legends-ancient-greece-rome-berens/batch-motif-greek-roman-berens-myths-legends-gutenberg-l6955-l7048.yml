  label: Nephele's children escape on the golden ram
  summary: Ino threatens Helle and Phryxus; Nephele gets them out of the palace and
    places them on Hermes' winged ram with the golden fleece. During the flight Helle
    falls into the sea and drowns, while Phryxus continues toward safety.
