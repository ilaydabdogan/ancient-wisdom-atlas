canonical_text:
  quote: ''
  summary: 'The passage recounts the origin of the Golden Fleece: Nephele saves Helle
    and Phryxus from Ino by placing them on a winged golden ram; Helle drowns in the
    sea, while Phryxus reaches Colchis, sacrifices the ram to Zeus, and gives the
    fleece to Aetes, who guards it in the Grove of Ares with a sleepless dragon because
    an oracle links his life to its safety. The passage then describes Jason organizing
    the Argonautic expedition, the divinely guided building of the Argo with a prophetic
    oak board, the assignment of heroes to the ship, sacrifices and auspicious augury
    before departure, and the first arrival at Lemnos, where armed women led by Hypsipyle
    decide to receive the Argonauts.'
  language: English
  quote_policy: summarized
