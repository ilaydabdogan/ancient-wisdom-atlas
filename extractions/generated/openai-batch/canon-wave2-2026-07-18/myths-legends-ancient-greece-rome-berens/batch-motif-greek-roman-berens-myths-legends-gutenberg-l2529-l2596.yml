canonical_text:
  quote: ''
  summary: 'The passage recounts Apollo-related episodes: Pan challenges Apollo in
    music and Midas is punished for dissenting from Apollo''s victory; Niobe insults
    Leto and loses her children before being changed into a tear-shedding stone; Orpheus
    is described as Apollo and Calliope''s gifted musical son, whose wife Eurydice
    dies after fleeing Aristaeus and being bitten by a snake.'
  language: English
  quote_policy: summarized
