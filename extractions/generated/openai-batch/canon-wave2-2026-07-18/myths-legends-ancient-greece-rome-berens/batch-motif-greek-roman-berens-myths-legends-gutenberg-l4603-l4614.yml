  summary: 'The passage identifies Morpheus as the son of Hypnus and the god of Dreams.
    It describes him as winged, appearing either as a youth or an old man, carrying
    poppies, and scattering sleep-producing seeds over weary mortals. It also reports
    Homer''s description of the House of Dreams with two gates: ivory for deceptive
    and flattering visions, and horn for dreams that are fulfilled.'
