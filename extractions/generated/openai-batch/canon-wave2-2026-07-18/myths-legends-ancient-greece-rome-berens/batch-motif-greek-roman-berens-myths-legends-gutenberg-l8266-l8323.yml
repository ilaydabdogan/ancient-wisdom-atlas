canonical_text:
  quote: ''
  summary: Heracles and Deianeira cross the river Evenus, where the Centaur Nessus
    attempts to carry Deianeira off and is shot by Heracles. Dying, Nessus tells Deianeira
    to preserve his blood as a charm for retaining Heracles' affection. Later, after
    Heracles captures Iole from Oechalia, Deianeira fears displacement and sends Heracles
    a sacrificial robe treated with Nessus' blood. The robe poisons Heracles during
    sacrifice. In torment, he is brought to Trachin; Deianeira hangs herself; Heracles
    orders a funeral pyre and Philoctetes lights it, receiving Heracles' bow and arrows.
    Athena bears Heracles to Olympus, where he is admitted among the immortals and
    receives Hebe from Hera in reconciliation.
  language: English
  quote_policy: summarized
