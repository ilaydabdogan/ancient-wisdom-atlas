canonical_text:
  quote: ''
  summary: 'The passage concludes Heracles'' labour involving the golden apples, then
    narrates the twelfth labour: Heracles descends to the lower world after initiation,
    encounters shades and bound figures, gains permission from Aides to take Cerberus
    if unarmed, wrestles the monster and brings him to the upper world, then restores
    him. The passage then begins the episode leading to the murder of Iphitus, describing
    Heracles'' return to Thebes, his separation from Megara, his unsuccessful courtship
    of Iole, and suspicion after Eurytus'' cattle are stolen.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Atlas puts the dragon to sleep, outwits the Hesperides, and brings three golden
    apples to Heracles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Atlas refuses to resume bearing the heavens after experiencing freedom, but
    Heracles tricks him into taking up the load again by asking him to hold it while
    he prepares a pad for his head.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Heracles gives the golden apples to Eurystheus; Eurystheus presents them back
    to Heracles, who places them on the altar of Pallas-Athene; Athene restores them
    to the garden of the Hesperides.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Eurystheus imposes as the twelfth and last labour that Heracles bring Cerberus
    up from the lower world, expecting the task to destroy him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Cerberus is described as a three-headed monster dog with poisonous jaws, snake-like
    hair, and a dragon tail.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Before descending, Heracles is initiated into the Eleusinian Mysteries and
    obtains information from priests for his task.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Heracles descends through an opening at Taenarum, guided by Hermes, and shades
    flee from him except Meleager and Medusa.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hermes stops Heracles from striking Medusa, explaining that she is only a
    shadow and cannot be harmed by a weapon.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Heracles finds Theseus and Pirithoeus fixed to an enchanted rock by Aides;
    he frees Theseus but cannot free Pirithoeus because the earth shakes violently.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Heracles removes the huge rock under which Ascalaphus is groaning, releasing
    him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Aides bars Heracles' entrance at the palace gates; Heracles shoots him in
    the shoulder, causing the god to experience mortal suffering.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Aides permits Heracles to take Cerberus to the upper world on the condition
    that Heracles secure him unarmed.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Heracles finds Cerberus at the mouth of the river Acheron, seizes him despite
    his barking and dragon-tail bite, and conducts him to the upper world through
    an opening near Troezen.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Eurystheus is aghast at Cerberus and returns the hell-hound to Heracles, who
    restores him to Aides; this ends Heracles' subjection to Eurystheus.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: After gaining freedom, Heracles returns to Thebes, gives Megara in marriage
    to Iolaus with her consent, and seeks to marry Iole, daughter of Eurytus.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: Heracles wins the archery contest for Iole but Eurytus refuses the marriage,
    fearing Iole may suffer a fate like Megara's.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: After Eurytus' oxen are stolen by Autolycus, Eurytus suspects Heracles, while
    Iphitus defends him and proposes to seek him out to recover the cattle.
  category: sequence
  evidence_refs:
  - ev:17
