candidate_motifs:
- id: motif:1
  label: hero descends to the lower world and returns
  taxonomy_refs:
  - hero_descent
  basis: Heracles descends through an opening to the under-world, encounters shades
    and underworld figures, captures Cerberus, and brings him to the upper world.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage is a handbook retelling; it gives the descent episode in summary
    form.
- id: motif:2
  label: initiation before perilous underworld task
  taxonomy_refs:
  - initiation
  basis: Heracles is initiated into the Eleusinian Mysteries and receives necessary
    priestly information before setting out for the lower world.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not describe the content of the Mysteries or the information
    received.
- id: motif:3
  label: quest for guarded sacred fruit
  taxonomy_refs:
  - mystical_quest
  - sacred_theft
  basis: Atlas puts a dragon to sleep, outwits the Hesperides, and carries off three
    golden apples, later treated as sacred fruit and restored by Athene.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: medium
  cautions: The passage describes Atlas rather than Heracles physically taking the
    apples, and the fruit is ultimately restored.
