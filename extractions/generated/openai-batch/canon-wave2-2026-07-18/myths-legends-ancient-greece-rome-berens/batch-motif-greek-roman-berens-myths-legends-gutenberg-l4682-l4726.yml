canonical_text:
  quote: ''
  summary: The passage describes the Egyptian Sphinx as a wisdom and fertility divinity
    with a lion-woman form, then contrasts the Greek Sphinx as a malignant monster,
    genealogically descended from Typhon and Echidna, sent by Hera against Thebes.
    The Sphinx sits near a Theban pass, poses a lethal riddle, and is destroyed when
    Oedipus gives the correct answer. The passage also notes visual differences between
    Greek and Egyptian Sphinx forms.
  language: English
  quote_policy: summarized
