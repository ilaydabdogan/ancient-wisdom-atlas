canonical_text:
  quote: ''
  summary: The passage describes Eos/Aurora as the deified Dawn and sister of Helios,
    her daily chariot movement before and after the sun, her western palace and attendants,
    her poetic attributes, her marriages and children, and the story of Tithonus receiving
    immortality without eternal youth and eventually being changed into a grasshopper.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eos is identified as the Dawn, sister of Helios, and the one who announces
    Helios's arrival.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eos has a chariot and drives it across the horizon in the morning and at night,
    before and after the sun-god.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Eos is said to personify both the rosy morning and twilight, and her palace
    is placed in the west on the island AEaea.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Eos's abode is described as surrounded by flowery meadows and lawns where
    nymphs and other immortal beings dance to music.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Poets describe Eos as a beautiful maiden with rosy arms and fingers, large
    changing wings, a star on her forehead, and a torch in her hand.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before daybreak Eos wraps herself in a violet-tinged mantle and yokes the
    horses Lampetus and Phaethon to her chariot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Eos opens the gates of heaven in order to herald her brother, the god of day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Plants and flowers revived by morning dew lift their heads as Eos passes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Eos first marries the Titan Astraeus, and their children are Heosphorus or
    Hesperus, the evening star, and the winds.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Eos later becomes united to Tithonus, son of Laomedon, king of Troy, because
