canonical_text:
  quote: ''
  summary: 'Opening of the Argonauts narrative: Jason, son of the dispossessed Aeson,
    is trained by Chiron, leaves to reclaim Iolcus, helps Hera in disguise across
    a river and loses a sandal; Pelias recognizes the one-sandal oracle and offers
    Jason the throne only if he retrieves Phryxus''s remains and the Golden Fleece
    from Colchis.'
  language: English
