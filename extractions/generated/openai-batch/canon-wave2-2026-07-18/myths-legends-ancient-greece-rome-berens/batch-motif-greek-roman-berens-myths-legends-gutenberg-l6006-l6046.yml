canonical_text:
  quote: ''
  summary: The passage defines the Manes as spirits of the departed, divided into
    Lemures or Larvae and Lares. Lemures are feared spirits haunting former homes
    at night and propitiated at the Lemuralia. Lares Familiares are ancestral spirits
    protecting a family, represented by a household statue honored at meals, departures,
    returns, weddings, and family events. Public Lares guard the state, roads, countryside,
    and sea, and receive public sacrifices.
  language: English
  quote_policy: summarized
