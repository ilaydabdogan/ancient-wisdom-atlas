canonical_text:
  quote: ''
  summary: Among the Phaeacians, the queen, Echeneus, and Alcinous discuss honoring
    Ulysses with gifts and escort. Alcinous asks Ulysses to continue his account of
    the dead. Ulysses recounts the ghost of Agamemnon approaching after Proserpine
    dismisses female ghosts. Agamemnon recognizes him after tasting blood, tries unsuccessfully
    to embrace him, and tells how Aegisthus and Clytemnestra murdered him and his
    companions during a feast, with Cassandra also killed nearby. Agamemnon warns
    Ulysses to be cautious even with his wife, contrasts Penelope favorably, urges
    a secret return to Ithaca, and asks about Orestes.
  language: English
  quote_policy: summarized
