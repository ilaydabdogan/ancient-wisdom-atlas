  summary: During the fight in Ulysses’ house, Melanthius supplies armor to the suitors
    from the store-room. Ulysses orders Eumaeus and Philoetius to bind him and suspend
    him near the rafters. Minerva appears in the voice and form of Mentor, rebukes
    Ulysses, withholds full victory to test him and Telemachus, and perches in the
    cloister roof in the form of a swallow.
