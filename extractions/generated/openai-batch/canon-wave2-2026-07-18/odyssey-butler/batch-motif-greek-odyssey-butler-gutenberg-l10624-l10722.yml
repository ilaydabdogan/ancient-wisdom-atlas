canonical_text:
  quote: ''
  summary: Ulysses proves his identity to Laertes by naming his scar and the orchard
    trees Laertes once gave him. Laertes accepts the proofs, embraces him, and fears
    retaliation for the slain suitors. Ulysses leads him to the house, where retainers
    prepare a meal. The Sicel woman washes and clothes Laertes, and Minerva makes
    him taller and more imposing. Dolius and his sons greet Ulysses. Rumour spreads
    the suitors’ deaths; the Ithacans bury the dead and meet in assembly. Eupeithes
    urges revenge, while Medon testifies that an immortal god in Mentor’s form aided
    Ulysses.
  language: English
  quote_policy: summarized
