  quote: ''
  summary: At dawn Alcinous leads Ulysses to the Phaeacian assembly. Minerva, disguised
    as a servant, summons the citizens and enhances Ulysses' appearance. Alcinous
    orders an escort ship and a banquet. The blind bard Demodocus, beloved by the
    Muse, sings of heroic quarrels connected with the Trojan War; Ulysses hides his
    face and weeps. Alcinous notices and turns the gathering toward athletic games.
  language: English
  quote_policy: summarized
