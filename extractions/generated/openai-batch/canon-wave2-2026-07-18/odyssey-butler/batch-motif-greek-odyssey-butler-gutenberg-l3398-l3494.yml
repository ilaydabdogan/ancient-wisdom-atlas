canonical_text:
  quote: ''
  summary: At the Phaeacian games, several athletes win events. Laodamas invites the
    stranger Ulysses to compete, noting his strong body but sea-worn condition. Ulysses
    says he is more concerned with trouble and returning home as a suppliant. Euryalus
    insults him as unathletic, provoking Ulysses to rebuke him and demonstrate his
    ability by throwing an unusually heavy disc farther than all previous marks. Minerva,
    disguised as a man, marks the throw and affirms its superiority. Ulysses then
    challenges others, while exempting Laodamas because of guest-host friendship,
    and describes his prowess in archery and other sports, while acknowledging mythic
    archers and his weakness from hardship at sea.
  language: English
  quote_policy: summarized
