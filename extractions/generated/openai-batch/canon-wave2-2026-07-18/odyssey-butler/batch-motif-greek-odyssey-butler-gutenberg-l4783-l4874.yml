canonical_text:
  quote: ''
  summary: Ulysses and his men leave Circe's shore with sacrificial sheep, sail by
    a wind sent by Circe to the waters of Oceanus and the dark land of the Cimmerians,
    and perform a ritual for the dead. Ulysses digs a trench, pours offerings, sacrifices
    sheep so their blood enters the trench, and keeps the shades from the blood until
    Teiresias can answer him. Elpenor asks for burial rites; Anticlea appears but
    is held back; Teiresias arrives, drinks the blood, and begins his prophecy.
  language: English
  quote_policy: summarized
