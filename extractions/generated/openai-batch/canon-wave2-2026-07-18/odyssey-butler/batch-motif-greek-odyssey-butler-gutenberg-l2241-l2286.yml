canonical_text:
  quote: ''
  summary: Minerva sends a dream-vision in the likeness of Penelope’s sister Iphthime
    to reassure Penelope about Telemachus. Penelope expresses grief over Ulysses and
    fear for her son. The vision says Minerva protects Telemachus but refuses to say
    whether Ulysses is alive or dead. Penelope wakes comforted. Meanwhile the suitors
    sail to the rocky islet Asteris and set an ambush for Telemachus.
  language: English
