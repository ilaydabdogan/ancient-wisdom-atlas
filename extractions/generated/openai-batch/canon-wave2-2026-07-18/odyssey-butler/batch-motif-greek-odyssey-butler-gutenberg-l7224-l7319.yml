canonical_text:
  quote: ''
  summary: Ulysses tells Telemachus how the Phaeacians brought him back to Ithaca
    and hid his gifts in a cave. Father and son discuss the number of suitors, divine
    help from Minerva and Jove, a plan for Ulysses to enter the city disguised as
    a beggar, the hiding of household weapons, secrecy about Ulysses' presence, and
    testing household loyalty. Meanwhile Telemachus' ship reaches Ithaca, Penelope
    is informed of his return, and the suitors angrily hold council after learning
    their ambush failed.
  language: English
  quote_policy: summarized
