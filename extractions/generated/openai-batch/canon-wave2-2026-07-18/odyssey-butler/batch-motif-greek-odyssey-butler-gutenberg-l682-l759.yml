canonical_text:
  quote: ''
  summary: Telemachus tells his mother to accept the bard's song and withdraw to household
    duties, while asserting his own authority. She mourns Ulysses until Minerva sends
    sleep. Telemachus rebukes the suitors, warns them to leave his house, and invokes
    Jove's reckoning. The suitors challenge or qualify his claim to rule, and Telemachus
    identifies the recent stranger as Mentes while privately knowing him to have been
    the goddess. After the suitors leave for the night, Euryclea lights Telemachus
    to his tower room, and he lies awake thinking of his intended voyage and Minerva's
    counsel.
  language: English
  quote_policy: summarized
