canonical_text:
  quote: ''
  summary: A homeward-bound speaker recounts being detained by the gods at Pharos
    after unsatisfactory offerings. The goddess Idothea tells him how to ambush and
    hold Proteus, the old man of the sea, so that Proteus will reveal the cause of
    the divine obstruction and the route home. Idothea disguises the speaker and three
    men with seal skins, and they seize Proteus after he counts his seals and sleeps;
    Proteus changes form repeatedly before addressing the speaker.
  language: English
