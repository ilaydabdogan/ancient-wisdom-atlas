canonical_text:
  quote: ''
  summary: During a meal, offerings are made to the immortal gods and the group eats.
    On a stormy, moonless night, Ulysses tests whether Eumaeus will provide him with
    a cloak by telling a story about a cold night before Troy when a ruse secured
    a cloak. Eumaeus praises the story, promises clothing and aid, prepares a bed
    by the fire, covers Ulysses with a heavy cloak, and then goes outside armed to
    sleep near the pigs under a sheltered rock.
  language: English
  quote_policy: summarized
