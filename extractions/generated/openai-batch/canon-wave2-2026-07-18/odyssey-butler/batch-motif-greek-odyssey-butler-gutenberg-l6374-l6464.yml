canonical_text:
  quote: ''
  summary: Ulysses tells Eumaeus a story of being nearly sold as a slave, stripped,
    bound, divinely released, and brought to a good man's door. Eumaeus doubts the
    report about Ulysses' return but says he will treat the stranger kindly out of
    reverence for Jove as god of hospitality. Ulysses proposes a god-witnessed bargain
    about his prediction of the master's return. Eumaeus refuses to harm a guest,
    orders a pig sacrificed, performs offerings and prayers for Ulysses' return, distributes
    the meal, and honors the stranger with a special portion.
  language: English
  quote_policy: summarized
