canonical_text:
  quote: ''
  summary: The suitors speculate about Telemachus' journey and possible death. Telemachus
    secretly obtains wine and barley meal from Euryclea for a voyage to Pylos and
    Sparta to seek news of his father. Minerva arranges a ship and crew, puts the
    suitors to sleep, appears in Mentor's form, leads Telemachus to the ship, sends
    a favorable west wind, and the ship sails through the night after offerings to
    the gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some suitors say Telemachus may seek helpers from Pylos or Sparta, or poison
    from Ephyra; another imagines him perishing at sea and the suitors dividing his
    property.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Telemachus goes to a store-room containing his father's gold, bronze, linens,
    spare clothes, olive oil, and old wine kept in case Ulysses returns.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Euryclea, an old house-keeper and nurse, is in charge of the store-room night
    and day.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Telemachus asks Euryclea for twelve lidded jars of wine and about twenty measures
    of barley meal in well-sewn leather bags.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Telemachus says the supplies are to be taken away in the evening after his
    mother has gone upstairs, and that he is going to Sparta and Pylos to seek news
    of his father's return.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Euryclea weeps and warns Telemachus that he is the one hope of the house and
    that the suitors will scheme against him and divide his possessions if he leaves.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Telemachus replies that his plan has heaven's sanction and asks Euryclea to
    swear not to tell his mother for ten or twelve days unless she asks.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Euryclea swears the oath, draws off wine into jars, and prepares barley meal
    in bags while Telemachus returns to the suitors.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Minerva takes Telemachus' shape, summons crew members around the town, and
    asks Noemon son of Phronius for a ship.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After sunset, Minerva gets the ship into the water, puts tackle aboard, places
    it at the end of the harbor, and encourages the assembled crew.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Minerva puts the suitors into deep slumber, fuddles their drink, makes them
    drop their cups, and sends them back into town to sleep.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Minerva takes the form and voice of Mentor and calls Telemachus outside to
    join the crew at the ship.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Telemachus tells the crew to help load the stores, noting that his mother
    and the maid servants do not know except for one servant.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Telemachus boards the ship after the stores are loaded; Minerva goes before
    him and sits in the stern, while Telemachus sits beside her.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:15
  text: The crew loosens the hawsers, takes places on the benches, raises the mast
    and white sails, and the ship moves through deep blue water under a west wind
    sent by Minerva.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The men fill mixing bowls and make drink offerings to the immortal gods, especially
    to the grey-eyed daughter of Jove, before the ship continues through the night
    until dawn.
  category: action
  evidence_refs:
  - ev:10
