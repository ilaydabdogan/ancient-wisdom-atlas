canonical_text:
  quote: ''
  summary: At the opening of Book XXII, Ulysses casts off his rags, takes up his bow,
    invokes Apollo, and kills Antinous. The suitors panic, still thinking the killing
    accidental, until Ulysses accuses them of wasting his goods, abusing his servants,
    and wooing his wife. Eurymachus offers restitution and blames Antinous, but Ulysses
    refuses. Eurymachus and Amphinomus attack and are killed by Ulysses and Telemachus.
    Telemachus fetches armor for himself, his father, the swineherd, and the stockman;
    when Ulysses' arrows run out, he arms himself with shield, helmet, and spears.
  language: English
  quote_policy: summarized
