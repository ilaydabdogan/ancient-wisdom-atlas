canonical_text:
  quote: ''
  summary: In Book XVIII, the beggar Irus challenges the disguised Ulysses at the
    doorway of Ulysses' own house. Antinous and the suitors turn the quarrel into
    sport with a food prize, while Telemachus guarantees the stranger's safety. Ulysses
    reveals his hidden strength, is strengthened by Minerva, defeats Irus with a deliberately
    moderated blow, drags him to the gate-house, gives him a staff, and warns him
    not to claim rule among beggars again.
  language: English
  quote_policy: summarized
