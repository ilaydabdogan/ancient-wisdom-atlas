canonical_text:
  quote: "“Any ghost that you let taste of the blood will talk with you...”"
  summary: Teiresias foretells Odysseus’s difficult return, warns him not to harm
    the Sun’s flocks, predicts loss and trouble at home if the warning is violated,
    and gives instructions for a later inland oar rite and sacrifices. Odysseus asks
    how to make his mother’s ghost recognize him; Teiresias explains that ghosts who
    taste blood can speak. Odysseus’s mother tastes the blood, recognizes him, describes
    the barrier between living and dead, reports on his family and household, explains
    that longing for him caused her death, and cannot be physically embraced.
  language: English
  quote_policy: quoted
