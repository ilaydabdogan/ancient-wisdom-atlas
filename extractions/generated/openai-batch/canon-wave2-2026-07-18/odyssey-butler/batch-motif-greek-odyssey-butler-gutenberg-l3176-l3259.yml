canonical_text:
  quote: ''
  summary: Ulysses denies that he is immortal, asks to eat despite sorrow, and requests
    help returning home. After supper, Arete recognizes his clothes and asks who he
    is and how he obtained them. Ulysses recounts shipwreck, arrival at Calypso's
    Ogygian island, her kindness and offer of immortality, his seven-year stay, his
    departure by raft with provisions, a storm raised by Neptune, his landing near
    a river, sleep in leaves, and aid from Nausicaa. Alcinous criticizes his daughter
    for not bringing him directly, and Ulysses defends her conduct.
  language: English
  quote_policy: summarized
