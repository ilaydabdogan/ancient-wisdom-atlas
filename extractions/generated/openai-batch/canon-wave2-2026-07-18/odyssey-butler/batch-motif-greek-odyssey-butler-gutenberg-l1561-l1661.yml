canonical_text:
  quote: ''
  summary: At Lacedaemon, Menelaus is hosting a wedding feast when Telemachus and
    Pisistratus arrive. Menelaus orders that the strangers be received, their horses
    tended, and the guests bathed, clothed, seated, and fed before their identity
    is asked. Telemachus admires the wealth and splendor of Menelaus' house and compares
    it to the palace of Olympian Jove. Menelaus replies that no mortal can equal Jove,
    recounts his long travels and wealth-gathering, then turns to grief over his murdered
    brother, the dead of Troy, and especially an absent Achaean whose family, including
    Penelope and Telemachus, mourns him.
  language: English
  quote_policy: summarized
