canonical_text:
  quote: ''
  summary: Nausicaa’s maids assist Ulysses with clothing, oil, washing, and food.
    Ulysses washes in the stream, and Minerva enhances his appearance. Nausicaa admires
    him, plans how he should enter the Phaeacian town without provoking gossip, describes
    the seafaring city, and instructs him to wait in Minerva’s grove before going
    to Alcinous’ house and supplicating her mother for help returning home.
  language: English
  quote_policy: summarized
