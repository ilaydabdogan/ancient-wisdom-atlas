canonical_text:
  quote: ''
  summary: The narrator prepares a sharpened olive-wood beam, gives Polyphemus wine,
    names himself “Noman,” and blinds the drunken sleeping Cyclops with his companions.
    When neighboring Cyclopes answer Polyphemus’ cries, the false name makes them
    think no one is attacking him, and they leave. Polyphemus then removes the door-stone
    and guards the cave entrance by touch.
  language: English
  quote_policy: summarized
