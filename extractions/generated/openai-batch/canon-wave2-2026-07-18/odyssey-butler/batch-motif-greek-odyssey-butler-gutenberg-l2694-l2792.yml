canonical_text:
  quote: ''
  summary: Ulysses sleeps while Minerva goes to the Phaeacian city in Scheria to aid
    his return. She enters Nausicaa’s bedroom in the form of Nausicaa’s friend and
    urges her in a dream to arrange a washing day because marriage is near. In the
    morning Nausicaa asks Alcinous for a wagon, prepares with her household and maids,
    goes to the washing place by the water, washes clothes, bathes, anoints herself,
    eats, and plays ball while she is compared to Diana among nymphs.
  language: English
  quote_policy: summarized
