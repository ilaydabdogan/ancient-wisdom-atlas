canonical_text:
  quote: ''
  summary: Antinous insults the disguised Ulysses as a beggar, refuses him food, and
    strikes him with a footstool. Ulysses endures the blow silently and prays for
    Antinous' ruin before marriage. Other suitors warn that gods sometimes travel
    disguised to judge human conduct. Telemachus and Penelope react with anger. Penelope
    asks Eumaeus to summon the stranger for news of Ulysses; Eumaeus praises the stranger's
    story and reports that he claims Ulysses is alive and near. Penelope laments the
    suitors' waste of the household and interprets Telemachus' loud sneeze as a sign
    that the suitors will be killed, promising clothing if the stranger speaks truthfully.
  language: English
  quote_policy: summarized
