candidate_motifs:
- id: motif:1
  label: abused disguised stranger at a feast
  taxonomy_refs:
  - sacred_exchange
  - divine_judgment
  basis: Ulysses is treated as a beggar seeking food; Antinous refuses, insults, and
    strikes him, while other suitors warn that gods may travel disguised to observe
    righteousness and wrongdoing.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:6
  confidence: high
  cautions: The passage's warning about disguised gods is voiced by suitors; the assaulted
    figure is identified by the narrator as Ulysses, not as a god.
- id: motif:2
  label: returning lord concealed among those wasting his house
  taxonomy_refs:
  - return
  - royal_legitimacy
  basis: The narrator names Ulysses as present in beggar form while Penelope and Eumaeus
    discuss Ulysses as absent or near; Penelope says that if he came again, he and
    his son would take revenge on the suitors consuming his household.
  evidence_refs:
  - ev:3
  - ev:10
  - ev:11
  - ev:13
  confidence: high
  cautions: The passage does not include a revelation scene; concealment is indicated
    by the contrast between the narrator's naming of Ulysses and the characters' treatment
    of him as a stranger.
- id: motif:3
  label: vengeance prayed upon the violator of the poor
  taxonomy_refs:
  - divine_judgment
  basis: Ulysses invokes gods and avenging deities of the poor against Antinous; Penelope
    invokes Apollo against Antinous; Eurynome extends the wish to all suitors.
  evidence_refs:
  - ev:4
  - ev:8
  confidence: medium
  cautions: The passage records prayers and wishes, not an immediate divine act.
- id: motif:4
  label: omen confirming a spoken prediction of destruction
  taxonomy_refs: []
  basis: As Penelope speaks about Ulysses and revenge, Telemachus sneezes loudly;
    Penelope laughs and interprets the sneeze as meaning that all suitors will be
    killed and none will escape.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The meaning of the omen is Penelope's interpretation within the passage.
- id: motif:5
  label: wasting the absent ruler's estate
  taxonomy_refs:
  - royal_legitimacy
  basis: Penelope says the suitors remain around the house day after day, sacrificing
    oxen, sheep, and goats for banquets and consuming wine while no Ulysses protects
    the estate.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage describes household waste and absence of protection; broader
    political implications require context beyond this passage.
