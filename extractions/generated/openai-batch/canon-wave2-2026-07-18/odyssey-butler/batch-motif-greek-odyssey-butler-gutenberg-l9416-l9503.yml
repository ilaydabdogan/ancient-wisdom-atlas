canonical_text:
  quote: ''
  summary: Ulysses gives private instructions to Eumaeus and Philoetius about bringing
    him the bow and securing doors. Inside, Eurymachus fails to string Ulysses' bow
    and laments the suitors' inferiority. Antinous proposes postponing the contest
    because it is Apollo's feast and suggests offerings. After libations, Ulysses
    asks to try the bow. The suitors react angrily and fear he may string it. Antinous
    rebukes him with a warning tale about the drunken Centaur Eurytion and threatens
    to send him to King Echetus. Penelope objects to mistreating a guest, while Eurymachus
    says the suitors fear public shame if the stranger succeeds.
  language: English
  quote_policy: summarized
