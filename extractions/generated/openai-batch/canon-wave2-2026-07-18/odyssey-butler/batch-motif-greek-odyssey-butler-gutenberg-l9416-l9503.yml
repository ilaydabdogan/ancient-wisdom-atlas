comparison_claims:
- id: claim:1
  claim: Antinous explicitly compares Ulysses' request to try the bow, which he attributes
    to wine, with the cautionary case of the Centaur Eurytion's drunken violence and
    punishment among Peirithous and the Lapithae.
  claim_level: same_function
  target: Centaur Eurytion exemplum among Peirithous and the Lapithae
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is made by Antinous as a hostile rhetorical warning;
    the passage does not establish that Ulysses actually is drunk or comparable in
    conduct to Eurytion.
- id: claim:2
  claim: The passage links the bow contest with Apollo as 'mighty archer' through
    Antinous's proposal to defer the trial and make offerings to him before trying
    again.
  claim_level: same_function
  target: archer deity associated with bow contest and sacrifice
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The association is made through Antinous's speech about feast and offerings;
    no divine intervention by Apollo occurs in this excerpt.
