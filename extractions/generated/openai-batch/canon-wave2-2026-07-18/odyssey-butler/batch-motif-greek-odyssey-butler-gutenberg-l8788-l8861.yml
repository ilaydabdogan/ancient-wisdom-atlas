canonical_text:
  quote: ''
  summary: Penelope speaks to the stranger about her grief, uncertainty over remarriage,
    and a dream in which an eagle kills her twenty geese and then explains itself
    as her returned husband destroying the suitors. Ulysses interprets the dream as
    portending the suitors' deaths. Penelope describes the gates of horn and ivory
    for dreams, announces a bow-and-axes contest for the suitors, and then withdraws
    to lament until Minerva grants her sleep.
  language: English
  quote_policy: summarized
