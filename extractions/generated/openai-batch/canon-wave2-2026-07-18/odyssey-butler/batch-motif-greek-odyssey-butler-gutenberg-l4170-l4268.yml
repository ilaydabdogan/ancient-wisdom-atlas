  summary: Ulysses recounts how he and surviving companions escaped Polyphemus by
    hiding beneath sheep, reached their ship, and departed. Ulysses taunted the Cyclops,
    who hurled rocks at the ship. Ulysses then revealed his name, after which Polyphemus
    recognized an old prophecy and prayed to Neptune that Ulysses might never return
    home, or return late after losses and trouble.
