canonical_text:
  quote: ''
  summary: 'After Ulysses prays, Jove thunders from Olympus. A miller-woman interprets
    the thunder as a sign and prays that the suitors have their last meal in Ulysses''
    house. Ulysses takes the woman''s speech and the thunder as omens of vengeance.
    The household prepares for a feast day: maids light the hearth, clean, and fetch
    water; Telemachus arms himself and leaves for assembly; animals are brought for
    the suitors'' meal. The swineherd speaks kindly to Ulysses, Melanthius insults
    him, and Philoetius observes that the stranger looks like someone formerly great,
    noting that gods can give sorrow even to kings.'
  language: English
  quote_policy: summarized
