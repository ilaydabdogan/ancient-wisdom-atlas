canonical_text:
  quote: ''
  summary: Minerva prompts Penelope to bring out Ulysses' bow and the iron axes as
    a contest for the suitors. The passage recounts the bow's provenance through Iphitus
    and its contrast with Hercules' killing of a guest. Penelope retrieves the bow
    from the store-room, announces that whoever strings it and shoots through twelve
    axes may marry her, while servants weep, Antinous rebukes them, and Telemachus
    says he will also try.
  language: English
  quote_policy: summarized
