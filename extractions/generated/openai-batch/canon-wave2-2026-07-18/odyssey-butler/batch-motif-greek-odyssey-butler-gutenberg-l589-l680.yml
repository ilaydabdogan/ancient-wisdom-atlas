canonical_text:
  quote: ''
  summary: Telemachus tells the visitor that his father has vanished and that suitors
    are consuming his household while courting his mother. Minerva urges him to address
    the assembly, order the suitors away, voyage to Pylos and Sparta for news of Ulysses,
    perform funeral rites if Ulysses is dead, and consider revenge against the suitors.
    Telemachus offers hospitality and a gift; Minerva postpones the gift exchange,
    flies away, and Telemachus recognizes divine influence. Penelope hears Phemius
    singing of the Achaeans’ painful return from Troy, descends veiled and weeping,
    and asks him to stop because the song renews grief for her lost husband.
  language: English
  quote_policy: summarized
