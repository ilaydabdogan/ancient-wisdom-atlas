  quote: "“it is decreed that he shall not perish here, far from his own people, but
    shall return to his house and country and see his friends again.”"
  summary: At a divine council, Minerva speaks of Ulysses’ suffering in Calypso’s
    island dwelling and the danger to Telemachus. Jove orders Mercury to command Calypso
    to release Ulysses. Mercury travels over sea to Calypso’s cave, described as a
    fragrant, watered, wooded place. Ulysses is found apart on the shore grieving
    for home. Calypso welcomes Mercury with divine food and drink, and Mercury relays
    Jove’s decree that Ulysses must leave and return to his people.
