  summary: Ulysses builds a raft with Calypso’s tools and materials, departs her island
    with supplies and a fair wind, navigates by the stars, is seen by Neptune, suffers
    a divinely raised storm, is thrown into the sea and regains the raft, and is then
    seen with compassion by Ino/Leucothea, a marine goddess.
  language: English
