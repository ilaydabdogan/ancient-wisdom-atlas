  summary: Ulysses asks that Penelope wait until sundown to question him privately
    by the fire about her husband’s return, because he fears the violent suitors.
    Eumaeus relays the request, then warns Telemachus of danger and returns to his
    pigs. Telemachus asks him to bring sacrificial victims in the morning. The suitors
    continue feasting with singing and dancing toward evening.
