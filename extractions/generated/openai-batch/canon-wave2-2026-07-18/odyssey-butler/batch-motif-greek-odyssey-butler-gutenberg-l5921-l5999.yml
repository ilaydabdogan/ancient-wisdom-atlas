canonical_text:
  quote: ''
  summary: Ulysses, newly landed, supplicates an apparent stranger and asks what land
    he has reached. Minerva describes Ithaca; Ulysses is glad but responds with a
    fabricated Cretan exile story. Minerva then smiles, changes form, identifies herself,
    praises his craft and their shared capacity for deception, says she has aided
    him, and instructs him to hide his treasure, keep his return secret, and endure
    troubles in his house. Ulysses says her changing appearances make her difficult
    to recognize and asks whether he has truly returned to Ithaca.
  language: English
  quote_policy: summarized
