canonical_text:
  quote: ''
  summary: Minerva arranges for Ulysses to wake near Nausicaa and her maids. Ulysses
    emerges from a leafy shelter, covers his nakedness, and asks Nausicaa for pity,
    clothing, and directions. Nausicaa promises aid, identifies herself and the Phaeacians,
    and orders her maids to feed, drink, and wash the distressed stranger because
    strangers are under Jove’s protection.
  language: English
