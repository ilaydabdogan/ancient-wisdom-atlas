canonical_text:
  quote: "“there are tokens with which we two are alone acquainted”"
  summary: Penelope hesitates to accept the returned Ulysses, saying that she and
    he possess private tokens. Ulysses plans to conceal the killing of the suitors
    by staging dance and wedding sounds. After he is washed, clothed, and beautified
    by Minerva, Penelope tests him by ordering his bed moved. Ulysses reveals that
    the bed is immovable because he built it around an olive tree within the house.
  language: English
  quote_policy: quoted
