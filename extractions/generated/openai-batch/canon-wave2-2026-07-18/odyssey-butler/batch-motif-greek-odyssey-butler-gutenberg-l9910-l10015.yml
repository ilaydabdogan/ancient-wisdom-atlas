  summary: After the killing of the suitors, Ulysses spares an unnamed man and the
    bard, surveys the dead, calls Euryclea, identifies maidservants judged guilty,
    orders the hall cleaned, oversees further executions and mutilation, and requests
    sulphur and fire to purify the cloisters.
  language: English
  quote_policy: summarized
