  text: An unnamed man asks that Telemachus stay his hand and tell his father, fearing
    that Ulysses will kill him in anger against the suitors.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ulysses says Telemachus has saved the unnamed man's life, says good deeds
    prosper more than evil ones, and sends the man and the bard outside while he finishes
    inside.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The spared pair sit by Jove's great altar in the outer court and continue
    to fear being killed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ulysses searches the court and finds the suitors lying in dust and blood;
    the passage compares them to fish netted from the sea and left gasping on the
    beach.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Euryclea finds Ulysses bloodied among corpses; the passage compares him to
    a lion after devouring an ox.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: When Euryclea begins to cry out for joy, Ulysses tells her to rejoice silently
    and says it is unholy to vaunt over dead men.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ulysses says Heaven's doom and the suitors' own evil deeds have brought them
    to destruction, and asks which women in the house have misconducted themselves.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Euryclea says there are fifty women in the house and that twelve have misbehaved
    and lacked respect toward her and Penelope, while Penelope is asleep.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ulysses tells Euryclea not to wake Penelope yet, but to summon the women who
    misconducted themselves.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ulysses orders Telemachus, the stockman, and the swineherd to remove the dead,
