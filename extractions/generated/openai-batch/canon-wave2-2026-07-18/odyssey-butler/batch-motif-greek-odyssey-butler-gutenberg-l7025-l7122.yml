canonical_text:
  quote: ''
  summary: At daybreak Ulysses and Eumaeus prepare breakfast in the swineherd's hut.
    Telemachus arrives, and the dogs fawn rather than bark. Eumaeus greets him with
    tears and joy, as though he had returned from the dead. Telemachus asks about
    his mother and learns she remains at home grieving. Ulysses, treated as a stranger,
    is hosted in the hut. Eumaeus reports that the stranger claims to be a Cretan
    fugitive and suppliant. Telemachus offers provisions but fears taking him to the
    suitors. Ulysses condemns the suitors' abuses and says he would rather die fighting
    them than tolerate such disgrace in his own house.
  language: English
  quote_policy: summarized
