canonical_text:
  quote: ''
  summary: Ulysses lies awake in his house, restraining his anger while planning against
    the suitors. Minerva appears in the likeness of a woman, reassures him, and gives
    him sleep. Penelope wakes and prays to Diana for death or removal, invoking the
    fate of the daughters of Pandareus and describing a dream of Ulysses. At daybreak
    Ulysses hears her weeping and prays to Jove for signs from inside and outside
    the house.
  language: English
  quote_policy: summarized
