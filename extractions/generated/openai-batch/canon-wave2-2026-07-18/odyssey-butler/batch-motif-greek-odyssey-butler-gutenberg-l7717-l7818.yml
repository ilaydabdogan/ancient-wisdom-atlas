canonical_text:
  quote: ''
  summary: Telemachus receives Eumaeus, then Ulysses enters the house in the appearance
    of a poor old beggar and sits at the threshold. Telemachus sends him food and
    directs him to beg from the suitors. Minerva prompts Ulysses to beg from each
    suitor so that he may distinguish good from bad. Some suitors give, while Antinous
    abuses Eumaeus, refuses generosity, and threatens Ulysses with a stool. Ulysses
    appeals to Antinous and recounts a tale of former wealth, a voyage to Egypt, raiding
    by his men, defeat, enslavement, and transport to Cyprus.
  language: English
  quote_policy: summarized
