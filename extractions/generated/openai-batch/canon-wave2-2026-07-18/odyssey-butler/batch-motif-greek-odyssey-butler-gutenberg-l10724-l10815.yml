canonical_text:
  quote: ''
  summary: After Ulysses has taken revenge on the suitors, Halitherses warns the men
    of Ithaca not to attack him. Some leave the assembly, while others follow Eupeithes
    in arms. Minerva asks Jove whether war or peace will follow, and Jove proposes
    a solemn covenant by which Ulysses will continue to rule and the bereaved families
    will forgive. Minerva descends, appears in Mentor’s form, strengthens Laertes,
    halts the fighting with divine command, and, after Jove sends a fiery thunderbolt,
    makes a covenant of peace between the contending parties.
  language: English
  quote_policy: summarized
