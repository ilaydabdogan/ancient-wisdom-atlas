canonical_text:
  quote: ''
  summary: A loyal stockman greets the ragged Ulysses, laments his absent master,
    and expresses hope for Ulysses' return. Ulysses swears by Jove and the hearth
    that Ulysses will return and kill the suitors. The suitors abandon a plot against
    Telemachus after seeing an eagle with a dove. Sacrificial meals proceed, Telemachus
    protects the stranger's place at table, Minerva keeps the suitors insolent, Ctesippus
    throws a heifer's foot at Ulysses, and Telemachus angrily threatens retaliation
    and condemns the suitors' conduct.
  language: English
  quote_policy: summarized
