canonical_text:
  quote: ''
  summary: At the opening of Book II, Telemachus rises at dawn, convenes the Ithacan
    assembly, and appears with divinely enhanced presence. Aegyptius speaks first
    and recalls the death of his son Antiphus in the Cyclops episode. Telemachus states
    that he called the assembly because his father is absent and the suitors are ruining
    his household while pressing his mother to marry. He appeals to public conscience
    and divine wrath. After Telemachus weeps, Antinous answers by blaming Telemachus's
    mother and recounting her delaying stratagem with a funeral pall for Laertes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At dawn Telemachus rises, dresses, binds on sandals, girds on a sword, leaves
    his room, and sends criers to call the people to assembly.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Telemachus goes to the assembly with a spear and two hounds; Minerva gives
    him divine comeliness, and the oldest councillors make way when he sits in his
    father's seat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aegyptius is described as aged and experienced; he speaks first while still
    grieving for his son Antiphus, who went with Ulysses to Ilius and was killed by
    the Cyclops in a cave.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Aegyptius says there has been no council meeting since Ulysses left and asks
    whether the convener has news of an approaching host or another public matter.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'Telemachus identifies himself as the convener and says his grievances are
    personal: the loss of his father and the threatened ruin of his estate.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Telemachus says the suitors, sons of leading men, are pressuring his mother
    to marry against her will, avoiding her father Icarius and the giving of marriage
    gifts, and consuming livestock and wine in his father's house.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Telemachus says Ulysses is no longer present to ward off harm and appeals
    to conscience, public opinion, fear of divine displeasure, Jove, and Themis.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: After speaking, Telemachus throws his staff to the ground and bursts into
    tears; the assembly feels pity but remains silent until Antinous replies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Antinous answers by calling Telemachus insolent and blaming Telemachus's mother,
    whom he describes as artful and as having encouraged the suitors without intending
    her messages.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Antinous recounts that Telemachus's mother set up a tambour frame, began a
    large piece of fine needlework, and asked the suitors to wait for marriage until
    she completed a pall for Laertes.
  category: speech
  evidence_refs:
  - ev:10
