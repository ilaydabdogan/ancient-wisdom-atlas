- id: obs:1
  text: Telemachus says Nestor received him hospitably, as though he were Nestor's
    own son, but had no news about whether Ulysses was alive or dead.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Telemachus reports that Menelaus told him Ulysses was sorrowing on an island
    in Calypso's house and could not reach home because he had no ships or sailors.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Menelaus compares the suitors to young animals placed in a lion's lair and
    says Ulysses would make short work of them if he came near them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Theoclymenus tells Penelope that Ulysses is already in Ithaca, learning of
    the suitors' evil deeds and preparing a day of reckoning for them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Penelope answers that if Theoclymenus' words come true, she will give him
    gifts and good will.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The suitors throw discs and aim spears in front of the house, while behaving
    with their usual insolence.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Medon calls the suitors inside for dinner, and they sacrifice fat, well-grown
    sheep, goats, pigs, and a heifer for their meal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Eumaeus and Ulysses prepare to go to town, and Ulysses asks for a stick to
    help him on the rough road.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ulysses carries a shabby tattered wallet, receives a staff from Eumaeus, and
