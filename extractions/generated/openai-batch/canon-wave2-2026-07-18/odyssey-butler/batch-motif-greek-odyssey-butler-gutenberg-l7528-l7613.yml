canonical_text:
  quote: ''
  summary: Telemachus reports his journey to Pylos and Lacedaemon and relays Menelaus'
    news that Ulysses had been held by Calypso. Theoclymenus tells Penelope that Ulysses
    is already in Ithaca and preparing punishment for the suitors. The suitors prepare
    a meal after sport. Ulysses and Eumaeus set out for town, passing a sacred fountain,
    where Melanthius approaches with goats for the suitors and insults them.
  language: English
  quote_policy: summarized
