canonical_text:
  quote: ''
  summary: Odysseus recounts reaching Aeolus' floating island, receiving hospitality
    and a sealed ox-hide sack of winds, nearly reaching home, and then being driven
    back when his men open the sack. Aeolus refuses further aid, interpreting Odysseus
    as hated by heaven. The fleet rows to the Laestrygonian city of Telepylus, enters
    a calm enclosed harbor while Odysseus keeps his ship outside, and scouts meet
    a young woman at a fountain who directs them to her father's house, where they
    see a mountain-sized giantess.
  language: English
  quote_policy: summarized
