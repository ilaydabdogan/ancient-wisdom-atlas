  quote: ''
  summary: A woman driving a waggon guides the mules away from the river at a pace
    suitable for Ulysses and the maids on foot. At sunset they reach Minerva's sacred
    grove, where Ulysses prays for pity, friends, and hospitable reception among the
    Phaeacians. Minerva hears him but does not appear openly because Neptune remains
    angry and seeks to stop Ulysses from returning home.
