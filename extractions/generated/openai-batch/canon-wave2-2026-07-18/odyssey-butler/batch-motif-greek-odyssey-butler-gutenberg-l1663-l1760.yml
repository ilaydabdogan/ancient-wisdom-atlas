candidate_motifs:
- id: motif:1
  label: Recognition of a son by resemblance to his father
  taxonomy_refs: []
  basis: Helen and Menelaus identify Telemachus through his likeness to Ulysses, and
    Pisistratus confirms the identification.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage gives recognition through resemblance, not a hidden-token
    or formal recognition scene.
- id: motif:2
  label: Absent father and son seeking counsel
  taxonomy_refs:
  - wisdom
  basis: Telemachus is described as troubled at home because his father is absent
    and has come, through Nestor’s arrangement, to seek counsel or suggestion from
    Menelaus.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The available taxonomy ref 'wisdom' is broad; the passage specifically
    concerns practical counsel.
- id: motif:3
  label: Blocked homecoming of the absent hero
  taxonomy_refs:
  - return
  basis: Menelaus says he had hoped to renew friendship with Ulysses after return
    from overseas, but heaven prevented Ulysses from getting home.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This passage reports the blocked return indirectly through Menelaus’ speech
    rather than narrating the journey itself.
- id: motif:4
  label: Guest-friendship extended to a friend’s son
  taxonomy_refs:
  - sacred_exchange
  basis: Menelaus receives Telemachus as the son of Ulysses, whom he calls a dear
    friend, and recalls the honors and settlement he wished to provide Ulysses.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage emphasizes hospitality and intended honors; it does not describe
    a completed formal gift exchange with Telemachus.
- id: motif:5
  label: Mourning interrupted by meal and social restraint
  taxonomy_refs: []
  basis: The company weeps for Ulysses and Antilochus, but Pisistratus urges that
    crying cease during supper, and Menelaus agrees to resume eating and postpone
    fuller talk.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: This is a social and ritual pattern in the passage; no taxonomy ref supplied
    directly matches it.
- id: motif:6
  label: Grief-banishing medicinal drink
  taxonomy_refs: []
  basis: Helen mixes the wine with an herb that banishes sorrow and prevents tears,
    a drug said to come from Egypt through Polydamna.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage gives the drug’s effect and origin, but does not frame it
    as magic versus medicine beyond calling it a drug and herb.
