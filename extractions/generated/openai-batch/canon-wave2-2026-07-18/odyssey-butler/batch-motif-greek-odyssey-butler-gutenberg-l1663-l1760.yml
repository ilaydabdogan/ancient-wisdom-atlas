canonical_text:
  quote: ''
  summary: In Menelaus’ house, Telemachus weeps when Ulysses is mentioned. Helen enters
    with attendants and Egyptian luxury objects, recognizes Telemachus by his resemblance
    to Ulysses, and Menelaus agrees. Pisistratus confirms Telemachus’ identity and
    explains that Nestor sent him to seek counsel because his father is absent. Menelaus
    laments Ulysses’ failure to return and recalls the friendship he wished to renew.
    The company weeps, including Pisistratus for his dead brother Antilochus, but
    then they stop mourning to eat. Asphalion pours water over their hands. Helen
    drugs the wine with an Egyptian herb that banishes sorrow and tears.
  language: English
  quote_policy: summarized
