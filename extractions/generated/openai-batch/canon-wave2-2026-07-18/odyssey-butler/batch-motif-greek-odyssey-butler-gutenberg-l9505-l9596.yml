canonical_text:
  quote: ''
  summary: Penelope says the stranger may attempt the bow and promises him clothing,
    weapons, sandals, and safe escort if Apollo grants him success. Telemachus asserts
    authority over the bow. Eumaeus brings the bow to Ulysses while Euryclea closes
    the women’s doors and Philoetius fastens the outer gates. Ulysses examines and
    strings the bow, hears a thunder omen from Jove, shoots an arrow through the axe
    handle-holes, and signals Telemachus, who arms himself beside his father.
  language: English
  quote_policy: summarized
