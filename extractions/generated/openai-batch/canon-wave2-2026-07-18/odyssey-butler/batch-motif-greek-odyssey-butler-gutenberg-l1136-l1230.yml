canonical_text:
  quote: ''
  summary: Telemachus and his crew arrive at Pylos at sunrise while the Pylians are
    sacrificing black bulls to Neptune. Minerva leads and encourages Telemachus to
    approach Nestor for truthful news about his missing father Ulysses. Nestor's son
    Pisistratus welcomes the strangers, seats them, gives them food and wine, and
    asks them to pray to Neptune. Minerva prays, Telemachus prays, the meal concludes,
    and Nestor asks the guests who they are. Telemachus identifies himself as from
    Ithaca and asks Nestor, as a suppliant, to tell plainly what he knows of Ulysses'
    fate.
  language: English
  quote_policy: summarized
