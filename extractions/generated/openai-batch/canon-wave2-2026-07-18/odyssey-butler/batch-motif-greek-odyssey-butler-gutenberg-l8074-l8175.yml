canonical_text:
  quote: ''
  summary: Ulysses, in the position of a poor stranger, receives mockery and food
    from the suitors, warns Amphinomus that the absent householder will soon return
    and bring bloodshed, and performs a drink-offering. Amphinomus forebodes evil
    but remains doomed by Minerva. Minerva then prompts Penelope to appear before
    the suitors, sends her sleep, enhances her beauty, and Penelope appears veiled
    with attendants, causing the suitors to desire her before she rebukes Telemachus
    for allowing a stranger-suppliant to be mistreated.
  language: English
  quote_policy: summarized
