canonical_text:
  quote: ''
  summary: After prayer and barley sprinkling, a heifer is slaughtered, ritual portions
    are burned with wine, and the meat is roasted and eaten. Polycaste washes, anoints,
    and clothes Telemachus; the diners feast. Nestor has Telemachus's horses yoked,
    provisions are packed, and Telemachus and Pisistratus leave Pylos by chariot.
    They stay with Diocles at Pherae, resume travel at dawn, and complete the journey.
  language: English
  quote_policy: summarized
