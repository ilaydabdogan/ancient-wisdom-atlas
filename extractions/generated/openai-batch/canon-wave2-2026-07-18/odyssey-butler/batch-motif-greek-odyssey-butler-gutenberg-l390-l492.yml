candidate_motifs:
- id: motif:1
  label: Obstructed homecoming arranged by divine council
  taxonomy_refs:
  - return
  basis: Ulysses longs to return to wife, country, and Ithaca, is detained by Calypso,
    blocked by Neptune, and then made the subject of a divine plan for return.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage begins the return plot but does not narrate Ulysses’ actual
    arrival home.
- id: motif:2
  label: Hero’s companions perish through violation of divine cattle
  taxonomy_refs:
  - sacred_theft
  - divine_judgment
  basis: The companions eat the cattle of the Sun-god Hyperion and perish, with the
    passage attributing their loss to their own folly and divine prevention of homecoming.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: Only a brief retrospective summary is present here; the full episode is
    not narrated in this passage.
- id: motif:3
  label: Divine beloved detains mortal hero
  taxonomy_refs:
  - divine_beloved
  basis: Calypso, a goddess, keeps Ulysses in a cave, wants to marry him, and tries
    to make him forget home.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: medium
  cautions: The passage describes detention and proposed marriage but not the origin
    of Calypso’s relationship with Ulysses.
- id: motif:4
  label: Mortal wrongdoing punished after ignored divine warning
  taxonomy_refs:
  - divine_judgment
  basis: Jove cites Aegisthus as warned by Mercury not to seduce Agamemnon’s wife
    or kill Agamemnon, yet Aegisthus ignores the warning and is killed by Orestes.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This motif appears as a divine speech-example rather than the central
    action of the passage.
- id: motif:5
  label: Divine parent-child bonds affecting conflict
  taxonomy_refs:
  - divine_parent_child
  basis: The passage explains Neptune’s opposition through Polyphemus’ descent from
    Neptune and Thoosa, and also identifies Calypso as daughter of Atlas and Minerva
    as child of Jove.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: Genealogies are explanatory details; the passage does not develop all
    parent-child relationships equally.
- id: motif:6
  label: Cosmic support separating heaven and earth
  taxonomy_refs:
  - world_center
  basis: Atlas is described as carrying great columns that keep heaven and earth apart.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The image is brief and attached to Atlas’s description, not expanded into
    a full cosmological episode.
- id: motif:7
  label: Divine disguise as a human visitor
  taxonomy_refs:
  - shapeshifter
  basis: Minerva descends to Ithaca disguised as Mentes, chief of the Taphians.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The disguise is stated directly; no further transformation process is
    described.
- id: motif:8
  label: Young son’s prompted departure for news of absent father
  taxonomy_refs:
  - departure
  - initiation
  basis: Minerva intends to put heart into Telemachus, have him call assembly, confront
    the suitors, and conduct him to Sparta and Pylos to hear news of Ulysses.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This is a proposed plan within the passage; the journey itself is not
    yet narrated.
- id: motif:9
  label: Sacrifice and offerings in divine-human exchange
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Neptune receives a hecatomb from the Ethiopians, and Minerva recalls Ulysses’
    burnt sacrifices before Troy.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The passage mentions sacrifices as context and argument, not as a fully
    described ritual.
