canonical_text:
  quote: ''
  summary: The passage opens Book I by invoking the Muse to recount Ulysses’ travels
    after Troy, his companions’ destruction after eating the cattle of Hyperion, and
    Ulysses’ delayed return. The gods meet while Neptune is away; Jove discusses Aegisthus’
    punishment, Minerva pleads for Ulysses, Jove explains Neptune’s anger over Polyphemus,
    and Minerva proposes sending Mercury to Calypso while she goes to Ithaca to rouse
    Telemachus. Minerva then descends from Olympus disguised as Mentes and finds the
    suitors feasting at Ulysses’ house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator invokes the Muse to tell of a hero who travelled after sacking
    Troy, visited many cities and peoples, suffered at sea, and tried to save himself
    and his men.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ulysses’ men perish after eating the cattle of the Sun-god Hyperion, and the
    god prevents them from reaching home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ulysses is the only survivor not safely home; he longs for his wife and country
    but is detained by Calypso in a large cave because she wants to marry him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods decide that Ulysses should return to Ithaca, but Neptune continues
    persecuting him and blocking his homecoming.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:5
  text: Neptune is away among the Ethiopians at the world’s end to receive a hecatomb,
    while the other gods meet in the house of Olympian Jove.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Jove says that mortals blame the gods for consequences caused by their own
    folly, using Aegisthus’ killing of Agamemnon and subsequent death by Orestes as
    an example.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Minerva asks Jove to pity Ulysses, describes him on a lonely sea-girt forest
    island held by Calypso, and says he longs to see the smoke of his own chimneys.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Jove says Neptune is angry because Ulysses blinded Polyphemus, son of Neptune
    by Thoosa, and that Neptune prevents Ulysses from getting home without killing
    him outright.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Minerva proposes sending Mercury to the Ogygian island to tell Calypso the
    gods’ decision, while she goes to Ithaca to strengthen Telemachus and direct him
    toward assembly and travel to Sparta and Pylos.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Minerva puts on golden sandals, takes a bronze-shod spear, descends from Olympus
    to Ithaca, and appears at Ulysses’ gateway disguised as Mentes, chief of the Taphians.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The suitors are seated on hides of oxen they have killed and eaten, playing
    draughts, while servants and pages mix wine, clean tables, and cut meat.
  category: setting
  evidence_refs:
  - ev:9
