  summary: Ulysses, addressed by Penelope as a stranger, praises her and resists questions
    about his lineage. Penelope describes her grief over Ulysses' absence, the suitors
    wasting her estate, her weaving-and-unweaving stratagem to delay remarriage, and
    its betrayal by her maids. Ulysses then answers with a claimed Cretan identity
    and a story in which he hosted Ulysses after storm-winds drove him to Crete.
  language: English
