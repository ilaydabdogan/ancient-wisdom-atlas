canonical_text:
  quote: ''
  summary: After offerings at Pylos, Nestor prevents Telemachus and Minerva from sleeping
    on the ship and offers hospitality. Minerva directs that Telemachus stay with
    Nestor and be sent to Lacedaemon with a chariot, a son of Nestor, and swift horses.
    She departs in eagle form, prompting Nestor to recognize her divine presence and
    vow a gilded-horn heifer sacrifice. At Nestor’s house further libations are made
    and Telemachus sleeps with Pisistratus. At dawn Nestor gathers his sons, orders
    preparations for a sacrifice to Minerva, and begins the rite with water, barley
    meal, prayer, and fire.
  language: English
  quote_policy: summarized
