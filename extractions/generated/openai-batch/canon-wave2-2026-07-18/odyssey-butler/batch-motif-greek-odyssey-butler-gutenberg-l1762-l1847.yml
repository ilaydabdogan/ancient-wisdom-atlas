candidate_motifs:
- id: motif:1
  label: hero enters enemy city in beggar disguise
  taxonomy_refs:
  - trickster_boundary
  basis: Ulysses alters his appearance with wounds, bruises, and rags, enters Troy
    as if he were a menial or beggar, and obtains military information.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The passage frames this as cunning disguise and infiltration, not as a
    full trickster tale independent of warfare.
- id: motif:2
  label: recognition of disguised hero by one woman
  taxonomy_refs: []
  basis: Helen says she alone recognized Ulysses in his disguise and questioned him.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage does not make recognition the main plot resolution; it is
    part of a recollected episode.
- id: motif:3
  label: oath securing secret knowledge
  taxonomy_refs:
  - covenant
  basis: Only after Helen washes, anoints, clothes Ulysses, and swears not to betray
    him does he disclose the Achaeans’ plans.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The available taxonomy term is broad; the passage specifically describes
    an oath of non-betrayal rather than a larger covenant.
- id: motif:4
  label: warriors hidden inside deceptive vessel or object
  taxonomy_refs:
  - trickster_boundary
  basis: The bravest Argives lie hidden in the wooden horse as a stratagem against
    the Trojans.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage names the wooden horse but does not narrate the whole stratagem’s
    outcome.
- id: motif:5
  label: temptation of hidden warriors by familiar voices
  taxonomy_refs: []
  basis: Helen calls the hidden chiefs by name and mimics their wives, nearly provoking
    an answer from Anticlus.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: No supplied taxonomy family directly matches this speech-based test.
- id: motif:6
  label: leader preserves companions by enforced silence
  taxonomy_refs: []
  basis: Ulysses keeps the hidden men from answering and physically covers Anticlus’s
    mouth, which Menelaus says saved them all.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a specific episode-level motif without a supplied taxonomy match.
- id: motif:7
  label: son’s journey to learn father’s fate
  taxonomy_refs:
  - departure
  basis: Telemachus makes a long sea voyage to Lacedaemon to ask Menelaus for truthful
    news of Ulysses.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The taxonomy label 'departure' is general; the passage emphasizes inquiry
    rather than the start of a complete quest arc.
- id: motif:8
  label: usurpers wasting absent hero’s household
  taxonomy_refs:
  - royal_legitimacy
  - return
  basis: Telemachus reports suitors consuming his estate and courting his mother;
    Menelaus frames them as cowards trying to usurp a brave man’s bed and imagines
    Ulysses returning to destroy them.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The revenge and return are predicted in speech here, not enacted in this
    passage.
- id: motif:9
  label: returning lion destroys intruders in lair
  taxonomy_refs:
  - return
  basis: Menelaus uses a lion returning to its lair as a simile for Ulysses returning
    to the suitors.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The lion is a rhetorical comparison, not an actual animal actor in the
    narrative.
