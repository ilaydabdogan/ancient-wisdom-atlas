canonical_text:
  quote: he entered the enemy’s city looking like a menial or a beggar
  summary: Helen recounts Ulysses entering Troy in disguise, being recognized only
    by her, receiving care and an oath of secrecy, and returning with information
    after killing Trojans. Menelaus recalls Ulysses restraining the hidden Achaeans
    inside the wooden horse when Helen tested them by calling their names in their
    wives’ voices. Telemachus asks Menelaus for news of his father and describes the
    suitors wasting his household; Menelaus condemns them and predicts their destruction
    if Ulysses returns.
  language: English
  quote_policy: quoted
