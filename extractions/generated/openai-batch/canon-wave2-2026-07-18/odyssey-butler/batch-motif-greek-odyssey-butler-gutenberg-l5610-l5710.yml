canonical_text:
  quote: ''
  summary: Eurylochus persuades Ulysses' hungry crew to kill the Sun's cattle and
    offer a makeshift sacrifice. Lampetie reports the killing to the Sun, who demands
    vengeance; Jove promises to destroy the ship with lightning. After ominous signs
    from the slaughtered cattle and six days of feasting, the crew sails, the ship
    is wrecked by storm and thunderbolt, and the men are lost. Ulysses survives by
    lashing wreckage into a raft, is driven toward Charybdis and Scylla, clings to
    a fig tree over the whirlpool, and escapes when his raft resurfaces.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eurylochus addresses the men and proposes driving in the best cows, sacrificing
    them to the immortal gods, and later building a temple to the sun-god if they
    reach Ithaca.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The men approve Eurylochus' words, drive in the best cattle, pray, use oak-shoots
    instead of barley, kill the cows, prepare the carcasses, and pour water because
    they have no wine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ulysses wakes from deep sleep, returns toward the ship and shore, smells roast
    meat, and prays to Jove and the other gods about what his men have done in his
    absence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Lampetie goes to the Sun and reports that Ulysses' crew has been killing his
    cows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Sun becomes angry, asks the immortals for vengeance on Ulysses' crew,
    and says the cows were the one thing he loved to look upon.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Sun threatens to go down to Hades and shine among the dead if compensation
    is not made for his cows.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Jove tells the Sun to keep shining on gods and humans and says he will shatter
    the crew's ship with white lightning once it is at sea.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ulysses says Calypso told him this divine exchange after hearing it from Mercury.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ulysses rebukes his men, but the cows are already dead; signs appear as hides
