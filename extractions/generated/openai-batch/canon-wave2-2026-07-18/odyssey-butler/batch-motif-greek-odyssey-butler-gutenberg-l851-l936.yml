canonical_text:
  quote: ''
  summary: A suitor recounts Penelope’s web stratagem and demands that Telemachus
    send her away to marry. Telemachus refuses, citing family obligations and divine
    punishment. Jove sends two eagles over the assembly; Halitherses interprets them
    as an omen of Ulysses’s imminent return and destruction of the suitors. Eurymachus
    rejects the omen and renews the suitors’ threat to consume Telemachus’s estate
    until Penelope chooses a husband.
  language: English
  quote_policy: summarized
