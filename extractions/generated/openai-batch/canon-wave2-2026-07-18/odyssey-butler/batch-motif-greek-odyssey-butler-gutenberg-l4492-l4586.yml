canonical_text:
  quote: ''
  summary: Circe invites Ulysses' companions into her house, gives them drugged food
    and drink, turns them into pigs with her wand, and confines them in pigsties while
    their minds remain human. Eurylochus, who stayed outside, reports the event. Ulysses
    goes to Circe's house to confront her, meets Mercury, receives the protective
    herb Moly and instructions, drinks Circe's drugged mixture without being charmed,
    threatens her with his sword, and is recognized by her as Ulysses.
  language: English
  quote_policy: summarized
