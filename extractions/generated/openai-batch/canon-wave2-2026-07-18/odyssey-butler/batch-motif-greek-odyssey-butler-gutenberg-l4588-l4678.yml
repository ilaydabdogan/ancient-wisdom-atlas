canonical_text:
  quote: ''
  summary: Ulysses refuses friendliness and intimacy with Circe unless she swears
    not to harm him. After her oath, her servants prepare a bath, clothing, table,
    and food, but he refuses to eat until his companions are freed. Circe opens the
    pigsty, anoints the transformed men with another drug, and restores them to human
    form, younger and better-looking. Ulysses returns to the ship, tells the remaining
    crew to secure the ship and property in a cave, and urges them to come to Circe’s
    house. Eurylochus warns against going, recalling the Cyclops episode; Ulysses
    nearly attacks him, but the men intervene and Eurylochus comes along.
  language: English
  quote_policy: summarized
