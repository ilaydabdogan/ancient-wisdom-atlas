canonical_text:
  quote: ''
  summary: After the killing of the suitors, Ulysses purifies the household spaces
    with fire and sulphur. The women of the house greet him with torches and embraces.
    Euryclea wakes Penelope and reports that Ulysses has returned and killed the suitors.
    Penelope doubts the report, then hears Euryclea’s account of the slaughter and
    the scar by which she recognized him. Penelope goes down to the hall, sits opposite
    Ulysses by the fire, and remains silent, not yet recognizing him because of his
    shabby clothing.
  language: English
  quote_policy: summarized
