canonical_text:
  quote: ''
  summary: Circe warns Ulysses about Scylla, the cattle and sheep of the sun-god on
    Thrinacia, and the Sirens. Ulysses departs, prepares his men against the Sirens
    by using wax and having himself bound to the mast, hears their song, is restrained
    by his crew, and then approaches another dangerous sea passage marked by waves,
    roaring water, and steaming rapids.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The goddess describes Scylla as not mortal, savage, cruel, invincible, and
    able to seize men with six heads.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The goddess advises Ulysses to pass Scylla's rock as fast as possible and
    to call on Crataiis to stop Scylla from making a second raid.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Thrinacian island contains seven herds of cattle and seven flocks of sheep
    belonging to the sun-god, with fifty animals in each flock, and their number neither
    increases nor decreases.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Phaethusa and Lampetie tend the sun-god's flocks and herds; they are children
    of the sun-god by Neaera.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The goddess warns that if the flocks are left unharmed Ulysses may reach Ithaca
    after hardship, but if they are harmed his ship and comrades will be destroyed,
    while he may return late and in bad condition after losing his men.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the goddess finishes speaking, dawn appears, the goddess goes inland,
    Ulysses boards the ship, and his men loose it from its moorings.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Circe sends a fair following wind that keeps the sails filled as the ship
    proceeds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ulysses tells his men that all of them should know Circe's prophecies so that
    they may live or die with awareness of them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ulysses reports that Circe told them to keep clear of the Sirens, who sit
    and sing beautifully in a field of flowers, while he alone may hear them under
    restraint.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ulysses instructs the crew to bind him upright to the mast and to bind him
    more tightly if he asks to be released.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Near the island of the two Sirens, the wind falls calm; the crew furls the
    sails and rows.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ulysses cuts and kneads wax, softens it, stops the ears of all his men, and
    is bound hands and feet to the mast while the crew continues rowing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Sirens call Ulysses by name and say that no one passes without hearing
    their song; they claim that a listener will go away charmed and wiser, because
    they know events at Troy and future happenings over the world.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Ulysses longs to hear more and signals that he should be set free, but the
    men row faster and Eurylochus and Perimedes bind him more strongly until the ship
    is out of hearing.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: After the ship passes the Sirens' island, Ulysses sees a great wave with rising
