canonical_text:
  quote: ''
  summary: Penelope weeps while Ulysses, addressed as a stranger, restrains his own
    tears. She tests him by asking for details about Ulysses’ clothing and companions.
    He describes a purple mantle, gold brooch, shirt, gifts, and the servant Eurybates.
    Penelope confirms that she herself gave Ulysses the clothing and brooch. Ulysses
    then reports that Ulysses is alive, has survived the loss of his crew after the
    slaughter of the sun-god’s cattle, has gathered treasure, has gone to Dodona to
    learn Jove’s will from the high oak, and will soon return; he swears this by Jove
    and by Ulysses’ hearth.
  language: English
  quote_policy: summarized
