canonical_text:
  quote: ''
  summary: Nestor answers Telemachus by recalling Achaean suffering at Troy and during
    the homeward voyage, including divine displeasure, quarrels among leaders, sacrifices,
    route-seeking by divine sign, and varied reports of returns and deaths. He presents
    Orestes’ vengeance for Agamemnon as an example for Telemachus, who laments the
    suitors’ violence; Nestor then suggests Ulysses may yet return and that Minerva’s
    favor would protect Telemachus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nestor recalls that the Achaeans suffered both at sea and before Priam’s city,
    and he lists major fallen warriors, including his own son Antilochus.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nestor says no one surpassed Telemachus’ father in subtlety, that Telemachus
    speaks like him, and that Nestor and Ulysses once advised the Argives in agreement.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Priam’s city was sacked and the Achaeans began sailing home, Jove vexed
    the Argives, and Minerva’s displeasure brought about a quarrel between the two
    sons of Atreus.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Menelaus wanted the Achaeans to sail home immediately, while Agamemnon wanted
    them to wait and offer hecatombs to appease Minerva; the army divided in opinion.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the morning part of the army embarked; at Tenedos they offered sacrifices,
    but Jove raised a second quarrel, after which some ships returned under Ulysses
    while Nestor pressed onward.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Lesbos the leaders asked heaven for a sign about their route, were shown
    to cross the open sea toward Euboea, received a fair wind, and later sacrificed
    to Neptune at Geraestus.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Nestor says he returned without knowing the fate of all the others, then reports
    safe returns for several leaders and recounts Agamemnon’s death at Aegisthus’
    hands.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Nestor says Orestes killed Aegisthus, his father’s murderer, and urges Telemachus
    to show his mettle and make himself a name in story.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Telemachus praises Orestes’ vengeance and wishes heaven would grant him similar
    vengeance against the suitors, who mistreat him and plot his ruin, but says the
    gods have not granted this happiness.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Nestor says he has heard of suitors harming Telemachus’ estate, asks whether
    Telemachus submits or lacks public and divine support, and suggests Ulysses may
    return to punish them, especially if Minerva favors Telemachus as she favored
    Ulysses.
  category: speech
  evidence_refs:
  - ev:10
