canonical_text:
  quote: ''
  summary: At dawn Telemachus leaves the swineherd’s place for town, instructing that
    the stranger be brought later to beg. Ulysses, in beggar condition, agrees to
    go after warming himself. Telemachus returns home, is welcomed by Euryclea, the
    maids, and Penelope, and asks Penelope to vow hecatombs for divine help against
    the suitors. He then appears publicly with divine comeliness from Minerva, avoids
    the hostile suitors, arranges matters with Piraeus and Theoclymenus, and brings
    Theoclymenus home for bathing and a meal. Penelope, still grieving for Ulysses,
    asks Telemachus whether he has news of his father’s return.
  language: English
  quote_policy: summarized
