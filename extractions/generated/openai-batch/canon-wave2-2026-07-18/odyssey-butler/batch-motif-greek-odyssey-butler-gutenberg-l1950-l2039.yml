canonical_text:
  quote: ''
  summary: 'Menelaus recounts Proteus telling him that sacrifices in Egypt are required
    before he can complete his voyage home. Proteus reports the return-fates of Achaean
    leaders: Ajax drowned after boasting against the gods, Agamemnon reached home
    but was killed by Aegisthus through an ambush at a banquet, and Ulysses remains
    captive with Calypso. Proteus also foretells that Menelaus will be taken by the
    gods to the Elysian plain at the ends of the world because of his marriage to
    Helen and relation to Jove.'
  language: English
  quote_policy: summarized
