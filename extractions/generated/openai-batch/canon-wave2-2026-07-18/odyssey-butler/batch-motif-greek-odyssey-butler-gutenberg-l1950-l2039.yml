candidate_motifs:
- id: motif:1
  label: Sacrifice required before safe homecoming voyage
  taxonomy_refs:
  - sacrifice
  - return
  basis: Proteus states that Menelaus must offer sacrifices and holy hecatombs to
    the gods before they let him finish his voyage home.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage presents a specific ritual condition for Menelaus rather than
    a generalized ritual system.
- id: motif:2
  label: Divine punishment for boast against the gods
  taxonomy_refs:
  - divine_judgment
  basis: Ajax boasts that even the gods cannot drown him; Neptune responds by splitting
    the rock and Ajax drowns.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage explicitly links Ajax's death to his boast and Neptune's action,
    but does not frame it with an abstract term such as hubris.
- id: motif:3
  label: Obstructed return by sea
  taxonomy_refs:
  - return
  basis: Menelaus is hindered from returning, Ajax dies during return, Agamemnon is
    storm-driven before reaching home, and Ulysses remains unable to return across
    the sea.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:6
  - ev:10
  confidence: high
  cautions: The examples have different causes and outcomes; they share the broad
    function of delayed, dangerous, or failed return.
- id: motif:4
  label: Treachery at a feast after homecoming
  taxonomy_refs:
  - return
  basis: Aegisthus lures the newly returned Agamemnon to a banquet and kills him after
    the feast, with followers killed in the cloisters.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: medium
  cautions: The available taxonomy lacks a precise banquet-treachery motif; relation
    to 'return' is broad.
- id: motif:5
  label: Island captivity preventing homecoming
  taxonomy_refs:
  - return
  basis: Ulysses is alive on an island in Calypso's house, kept prisoner and unable
    to reach home because he lacks ships and sailors.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage states captivity and lack of conveyance but does not elaborate
    Calypso's motives here.
- id: motif:6
  label: Blessed otherworld destination at the world's edge
  taxonomy_refs:
  - afterlife_journey_map
  basis: Menelaus will not die in Argos but will be taken by the gods to the Elysian
    plain at the ends of the world, where life is easier and Rhadamanthus reigns.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage describes the destination and transport, but not an extended
    afterlife journey or map.
- id: motif:7
  label: Revelation of hidden fates by sea figure
  taxonomy_refs:
  - wisdom
  basis: Proteus, the old man of the sea, provides knowledge of divine hindrance,
    ritual remedy, Achaean deaths, Ulysses's location, and Menelaus's future.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:10
  - ev:11
  confidence: medium
  cautions: The taxonomy reference 'wisdom' is broad; the passage emphasizes disclosure
    of knowledge rather than a named wisdom quest.
comparison_claims:
- id: claim:1
  claim: 'Within the passage, the accounts of Menelaus, Ajax, Agamemnon, and Ulysses
    can be cautiously compared as variants of a shared homecoming-function: each is
    defined by a return from Troy or a voyage home that is delayed, endangered, redirected,
    or made fatal.'
  claim_level: same_function
  target: 'Achaean return/homecoming pattern within the passage; available motif family:
    return'
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an internal functional comparison only; the passage does not
    itself make an explicit external comparative claim or assign a formal motif category.
