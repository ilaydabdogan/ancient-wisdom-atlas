canonical_text:
  quote: ''
  summary: At Alcinous's feast, Ulysses honors the bard Demodocus with food and asks
    him to sing of the wooden horse at Troy. Demodocus sings how the horse entered
    Troy, concealed Achaean warriors, and led to the city's sack. Ulysses weeps at
    the song; Alcinous notices, stops the performance, and asks the guest to reveal
    his name and homeland so Phaeacian ships can carry him home. Alcinous describes
    the Phaeacian ships as thought-guided and recalls a prophecy or threat that Neptune
    may punish their escorts by wrecking a returning ship and burying their city under
    a mountain.
  language: English
  quote_policy: summarized
