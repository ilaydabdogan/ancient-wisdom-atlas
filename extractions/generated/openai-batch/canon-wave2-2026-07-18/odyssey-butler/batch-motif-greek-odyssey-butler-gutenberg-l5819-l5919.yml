canonical_text:
  quote: ''
  summary: The Phaeacians land the sleeping Ulysses in Ithaca, place his gifts by
    an olive tree, and return home. Neptune complains to Jove that the Phaeacians
    have escorted Ulysses despite his anger, receives leave to punish them, and turns
    their returning ship into stone near Scheria. Alcinous recalls an old prophecy
    that Neptune would punish Phaeacian escorts and orders sacrifices. Meanwhile Ulysses
    wakes on his own soil, does not recognize it because Minerva has made it foggy,
    laments, counts his goods, and meets Minerva disguised as a young shepherd.
  language: English
  quote_policy: summarized
