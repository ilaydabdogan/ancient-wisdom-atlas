canonical_text:
  quote: ''
  summary: Ulysses recounts leading his ship through the straits between Scylla and
    Charybdis, where Scylla seizes and eats six men. The survivors reach the island
    of the sun-god's cattle and sheep. Ulysses recalls warnings from Teiresias and
    Circe, urges avoidance, but Eurylochus persuades the exhausted crew to land. The
    men swear not to harm the cattle or sheep. A divinely sent storm and contrary
    winds keep them on the island until provisions fail; Ulysses goes inland to pray
    and falls asleep.
  language: English
  quote_policy: summarized
