canonical_text:
  quote: ''
  summary: Ulysses waits and then goes toward the Phaeacian town. Minerva hides him
    in mist, appears as a little girl with a pitcher, and guides him to the house
    of Alcinous, warning him about the Phaeacians' distrust of strangers and advising
    him to seek Queen Arete first. Minerva recounts Arete's divine-related ancestry
    and influence. Ulysses approaches the radiant palace, whose metalwork, immortal
    mastiffs, torch-bearing golden figures, abundance, and skilled women workers are
    described.
  language: English
  quote_policy: summarized
