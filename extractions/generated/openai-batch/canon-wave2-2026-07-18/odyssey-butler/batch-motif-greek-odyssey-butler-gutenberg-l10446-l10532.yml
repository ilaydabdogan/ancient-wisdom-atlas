canonical_text:
  quote: ''
  summary: In Hades, Agamemnon asks Amphimedon why the suitors have died. Amphimedon
    recounts Penelope’s weaving stratagem, Ulysses’ disguised return, the bow contest,
    and the slaughter of the suitors with divine aid. Agamemnon praises Penelope’s
    constancy and contrasts her with the daughter of Tyndareus. The scene then shifts
    to Ulysses reaching Laertes’ farm and planning to test whether his father recognizes
    him.
  language: English
