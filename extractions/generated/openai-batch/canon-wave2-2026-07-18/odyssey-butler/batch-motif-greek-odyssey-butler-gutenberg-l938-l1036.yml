canonical_text:
  quote: "“Give me, then, a ship and a crew of twenty men”"
  summary: Telemachus asks the suitors and Ithacan assembly for a ship and crew so
    he can seek news of his missing father at Sparta and Pylos. Mentor rebukes the
    Ithacans for tolerating the suitors, but Leiocritus dismisses him and breaks up
    the assembly. Telemachus prays by the sea to Minerva, who appears in Mentor’s
    likeness, encourages him, warns of the suitors’ doom, and promises to arrange
    a ship and volunteers. Telemachus returns home, confronts Antinous, and refuses
    friendly fellowship with the suitors.
  language: English
  quote_policy: quoted
