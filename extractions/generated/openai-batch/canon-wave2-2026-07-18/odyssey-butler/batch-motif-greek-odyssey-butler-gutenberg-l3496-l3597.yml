canonical_text:
  quote: ''
  summary: King Alcinous praises Phaeacian excellence in sailing, running, dancing,
    and song, and orders a lyre fetched for Demodocus while dancers perform for Ulysses.
    Demodocus sings of Mars and Venus, whose affair in Vulcan’s house is reported
    by the sun. Vulcan forges invisible unbreakable chains, traps the pair on his
    bed, summons the gods to witness them, and negotiates Mars’s release after Neptune
    guarantees payment of damages.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Alcinous says his people are not especially distinguished at boxing or
    wrestling, but are fleet-footed, excellent sailors, and fond of dinners, music,
    dancing, linen, baths, and beds.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Alcinous asks the best dancers to dance so the guest may later tell others
    of Phaeacian excellence, and he orders Demodocus’s lyre fetched from his house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A servant retrieves the lyre, nine stewards prepare and mark a wide dancing
    space, and young dancers perform in a way that delights Ulysses.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Demodocus sings that Mars and Venus began an intrigue in Vulcan’s house; Mars
    gave Venus presents and defiled Vulcan’s marriage bed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sun sees Mars and Venus and tells Vulcan what has happened.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Vulcan goes to his smithy, sets his anvil, and forges chains that cannot be
    loosened or broken.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Vulcan spreads fine, hard-to-see chains around the bedposts and from the ceiling
    beam, then pretends to leave for Lemnos.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mars, seeing Vulcan depart, goes to Venus and invites her to Vulcan’s couch
    because Vulcan is away in Lemnos.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mars and Venus go to the couch and are caught in Vulcan’s toils, unable to
    rise or move hand or foot.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Vulcan returns after the sun tells him what is happening, stands in the vestibule,
    and loudly summons the gods to see the sight.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Vulcan complains that Venus dishonours him because he is lame, says she loves
    handsome Mars, and says the pair will stay trapped until her father repays him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Neptune, Mercury, Apollo, and other gods gather at Vulcan’s house, while the
    goddesses remain at home for shame.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The gods laugh at Vulcan’s cunning and state that ill deeds do not prosper
    and that lame Vulcan has caught the fleetest god in heaven.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Apollo asks Mercury whether he would sleep with Venus despite the chains,
