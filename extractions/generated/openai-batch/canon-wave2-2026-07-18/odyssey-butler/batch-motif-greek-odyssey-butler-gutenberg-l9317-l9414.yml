canonical_text:
  quote: ''
  summary: A bow contest is prepared with axes set in line. An unnamed young man and
    then Leiodes fail to string the bow; Antinous directs the order of trial and has
    Melanthius warm and grease the bow, but the suitors still fail. Outside, Ulysses
    privately tests the loyalty of the swineherd and stockman, reveals himself as
    Ulysses returned in the twentieth year, promises rewards, and proves his identity
    by showing the scar from a boar’s tooth received on Mt. Parnassus.
  language: English
  quote_policy: summarized
