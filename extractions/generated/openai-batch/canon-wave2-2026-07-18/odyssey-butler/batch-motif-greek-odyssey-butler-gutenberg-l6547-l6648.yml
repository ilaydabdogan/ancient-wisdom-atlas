canonical_text:
  quote: ''
  summary: At the opening of Book XV, Minerva goes to Lacedaemon and urges Telemachus
    to return home, warning him about the suitors, his mother’s possible remarriage,
    and an ambush by sea. She instructs him to avoid the islands, land in Ithaca,
    go to the swineherd, and send word to Penelope. Telemachus prepares to leave with
    Pisistratus. Menelaus observes proper host-guest conduct, prepares food, and gives
    Telemachus rich departure gifts with Helen and Megapenthes present.
  language: English
