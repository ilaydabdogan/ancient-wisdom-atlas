canonical_text:
  quote: ''
  summary: Penelope addresses the disguised Ulysses as a guest, orders hospitable
    care for him, and reflects on righteous conduct. Ulysses refuses bedding and foot-washing
    by young women but accepts service from an old woman. Penelope summons Euryclea,
    Ulysses' former nurse. Euryclea laments Ulysses' absence, notes the guest's resemblance
    to him, and prepares to wash his feet. Ulysses turns away from the firelight to
    hide a scar, but Euryclea recognizes it as the scar from a wild boar wound received
    during a hunt on Mt. Parnassus. The passage then recalls Autolycus, Ulysses' grandfather,
    and the naming of infant Ulysses as the child of anger.
  language: English
  quote_policy: summarized
