- id: motif:6
  label: bird omen of royal household power
  taxonomy_refs:
  - royal_legitimacy
  basis: A hawk with a dove flies on Telemachus’s right hand and Theoclymenus says
    it is a god-sent omen that Telemachus will remain powerful and that no house in
    Ithaca will be more royal than his.
  evidence_refs:
