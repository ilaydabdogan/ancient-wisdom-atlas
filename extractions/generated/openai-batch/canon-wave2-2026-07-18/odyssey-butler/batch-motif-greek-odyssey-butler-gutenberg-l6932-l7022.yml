canonical_text:
  quote: ''
  summary: Eumaeus recounts how Phoenicians and a woman lured him from his father’s
    house, stole cups, and carried him by ship; the woman dies after Diana strikes
    her, and Eumaeus reaches Ithaca, where Laertes acquires him. Ulysses responds
    with pity. Telemachus reaches Ithaca, arranges for Theoclymenus to receive hospitality,
    sees a hawk omen interpreted as a sign of his house’s future power, and proceeds
    toward the swineherd’s homestead while the ship goes to town.
  language: English
  quote_policy: summarized
