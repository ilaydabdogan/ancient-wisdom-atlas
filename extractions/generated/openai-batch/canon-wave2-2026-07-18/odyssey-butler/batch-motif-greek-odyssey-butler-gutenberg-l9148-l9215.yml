canonical_text:
  quote: ''
  summary: Agelaus advises that the stranger and servants should stop being mistreated,
    and urges Telemachus to have Penelope remarry because Ulysses will not return.
    Telemachus says he will not force his mother from the house. Minerva makes the
    suitors laugh unnaturally, and Theoclymenus describes a vision of darkness, blood,
    ghosts, and impending ruin. The suitors mock him and the other guest. Telemachus
    silently watches his father, while Penelope listens from a seat; the narrator
    foreshadows a gruesome supper and the suitors' self-brought doom.
  language: English
  quote_policy: summarized
