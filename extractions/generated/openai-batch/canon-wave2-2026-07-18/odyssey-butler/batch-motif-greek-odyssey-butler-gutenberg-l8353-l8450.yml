canonical_text:
  quote: ''
  summary: In Book XIX, Ulysses remains in the cloister and plans, with Minerva’s
    help, to kill the suitors. He and Telemachus secretly remove the palace armour
    under a prepared excuse. Minerva lights their work with a gold lamp, and Telemachus
    perceives a fire-like divine glow. Penelope later descends, sits near the fire,
    rebukes Melantho for abusing the stranger, and prepares to question Ulysses about
    his identity and her husband.
  language: English
  quote_policy: summarized
