canonical_text:
  quote: ''
  summary: The passage recounts Ulysses’ youthful visit to Parnassus, a feast with
    Autolycus’ household, a boar hunt in which he receives the scar above his knee,
    and the later recognition of that scar by Euryclea while washing him. Ulysses
    prevents Euryclea from revealing him to Penelope, whose attention Minerva has
    diverted, and commands secrecy while he remains concealed under rags.
