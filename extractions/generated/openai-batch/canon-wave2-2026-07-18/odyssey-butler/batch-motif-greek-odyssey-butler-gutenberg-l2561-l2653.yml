canonical_text:
  quote: ''
  summary: Ino gives Ulysses an enchanted veil and instructs him to abandon his raft
    and swim toward the Phaeacians. Ulysses hesitates, Neptune destroys the raft,
    and Ulysses uses the veil while swimming. Minerva calms the winds and helps him
    survive the surf and rocks. After seeing a river mouth, Ulysses prays to the river
    as a suppliant for rescue from Neptune's anger.
  language: English
