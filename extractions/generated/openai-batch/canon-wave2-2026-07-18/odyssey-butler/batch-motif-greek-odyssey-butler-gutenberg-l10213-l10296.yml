canonical_text:
  quote: ''
  summary: 'Penelope accepts Ulysses after he proves knowledge of their private bed,
    embraces him, and explains her fear of deception. Ulysses weeps with her. Minerva
    prolongs the night. Ulysses tells Penelope of Teiresias''s prophecy: he must travel
    inland carrying an oar until it is mistaken for a winnowing shovel, plant it,
    sacrifice to Neptune, return home, sacrifice to the gods, and later die gently
    from the sea in old age. Servants prepare the bed by torchlight; Ulysses and Penelope
    reunite there and then exchange accounts of their sufferings.'
  language: English
  quote_policy: summarized
