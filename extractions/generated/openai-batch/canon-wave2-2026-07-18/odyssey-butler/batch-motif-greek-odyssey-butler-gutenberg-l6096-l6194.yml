  quote: "“all strangers and beggars are from Jove”"
  summary: Ulysses reaches the swineherd Eumaeus’s hut and fenced pig yards. The hounds
    attack him, but Eumaeus rescues him and receives him as a guest with bedding,
    bread, wine, and pork. Eumaeus states that strangers and beggars come from Jove,
