canonical_text:
  quote: ''
  summary: Penelope learns from Medon that the suitors are plotting to murder Telemachus
    as he returns from Pylos and Lacedaemon. She grieves, rebukes the household women,
    considers informing Laertes, and is advised by Euryclea to pray to Minerva. Penelope
    makes a ritual prayer for her son, while Antinous organizes twenty men and prepares
    a ship for the ambush. Penelope remains upstairs in distress and falls asleep.
  language: English
  quote_policy: summarized
