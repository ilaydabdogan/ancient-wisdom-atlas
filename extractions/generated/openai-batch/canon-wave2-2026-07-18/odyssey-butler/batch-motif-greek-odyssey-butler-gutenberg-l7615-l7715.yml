canonical_text:
  quote: Argos died as soon as he had recognised his master.
  summary: Melanthius insults and kicks Ulysses while Eumaeus escorts him, and Eumaeus
    prays to the fountain nymphs for Ulysses' return. At Ulysses' house, the pair
    hear the suitors feasting inside and discuss how to enter. Argos, Ulysses' neglected
    old hound, recognizes his master and dies.
  language: English
  quote_policy: quoted
