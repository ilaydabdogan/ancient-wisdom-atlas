canonical_text:
  quote: ''
  summary: Ulysses recounts his wanderings and losses to Penelope, including the visit
    to Hades, Calypso’s cave, divine punishment of his crew, and his return through
    the Phaeacians. After sleep, Minerva brings Dawn; Ulysses instructs Penelope about
    household matters and leaves armed with Telemachus, Philoetius, and Eumaeus while
    Minerva hides them in darkness.
  language: English
  quote_policy: summarized
