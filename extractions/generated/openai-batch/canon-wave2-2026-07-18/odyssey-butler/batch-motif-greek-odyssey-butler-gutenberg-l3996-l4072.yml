canonical_text:
  quote: ''
  summary: The narrating Achaean speaker and his companions wait in the Cyclops's
    cave. The Cyclops returns with his flock, blocks the cave with a huge stone, milks
    his animals, and questions the strangers. The speaker asks for hospitality under
    Jove's protection, but the Cyclops rejects concern for the gods and asks where
    their ship is. The speaker lies that Neptune wrecked it. The Cyclops kills and
    eats two men, drinks milk, and sleeps. At dawn he repeats his chores, eats two
    more men, moves the stone to let the sheep out, replaces it, and leaves the speaker
    planning revenge.
  language: English
  quote_policy: summarized
