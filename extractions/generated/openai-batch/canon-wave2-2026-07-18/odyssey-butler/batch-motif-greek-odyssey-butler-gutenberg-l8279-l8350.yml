canonical_text:
  quote: ''
  summary: Ulysses stands near firelight in the house while Minerva incites the suitors'
    insolence. Eurymachus mocks and threatens him, and Ulysses answers with claims
    of strength in labor and war and a warning about Ulysses' return. Eurymachus throws
    a footstool, which hits a cupbearer. Telemachus and Amphinomus restrain the suitors,
    who make drink-offerings to the gods and depart.
  language: English
  quote_policy: summarized
