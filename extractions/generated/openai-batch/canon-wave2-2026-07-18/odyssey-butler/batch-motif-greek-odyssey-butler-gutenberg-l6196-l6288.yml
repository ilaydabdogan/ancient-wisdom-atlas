  quote: "“Ulysses will return in this self same year...”"
  summary: In Eumaeus’s hut, Ulysses eats and drinks as an old guest, asks about Eumaeus’s
    absent master, hears Eumaeus mourn Ulysses and reject travelers’ reports, swears
    that Ulysses will return and take vengeance, and then begins a first-person account
    claiming Cretan birth and a life of war and sea expeditions.
  language: English
  quote_policy: quoted
