canonical_text:
  quote: ''
  summary: Calypso protests that the gods resent goddesses who love mortal men, citing
    Dawn with Orion and Ceres with Iasion. She recounts rescuing Ulysses after Jove
    destroyed his ship, but accepts that she must release him. She finds Ulysses grieving
    on the shore, instructs him to build a raft, and swears by heaven, earth, and
    the Styx that she means him no harm. In her cave she offers food, warns him of
    suffering, and offers immortality if he stays, but Ulysses chooses home and Penelope
    despite future hardship.
  language: English
  quote_policy: summarized
