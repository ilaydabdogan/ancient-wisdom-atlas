candidate_motifs:
- id: motif:1
  label: Psychopomp-led journey of the dead through named underworld thresholds
  taxonomy_refs:
  - afterlife_journey_map
  basis: Mercury leads the suitors’ ghosts into death through Oceanus, Leucas, gates
    of the sun, the land of dreams, and the asphodel meadow.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage concerns dead suitors escorted by a god, not a living hero’s
    voluntary descent.
- id: motif:2
  label: Assembly of heroic shades in an afterlife meadow
  taxonomy_refs:
  - afterlife_journey_map
  basis: Named heroic ghosts gather in the meadow of asphodel, described as a dwelling
    place of souls and shadows.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage names an afterlife setting but does not provide a complete
    cosmology beyond this route and meadow.
- id: motif:3
  label: Heroic funeral honors with washing, lament, cremation, bones, tomb, and games
  taxonomy_refs: []
  basis: Agamemnon recounts the preparation of Achilles’ body, divine and mortal mourning,
    cremation, bone collection in a golden vase, tomb building, and prize contests.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: No supplied taxonomy family exactly names this full funerary sequence.
- id: motif:4
  label: Funerary animal sacrifice at the cremation pyre
  taxonomy_refs:
  - sacrifice
  basis: Many sheep and oxen are slain in sacrifice around Achilles during the cremation
    rites.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is specifically funerary sacrifice; the passage does not frame it
    as substitutionary or expiatory sacrifice.
- id: motif:5
  label: Divine mother mourns and honors a dead son
  taxonomy_refs:
  - divine_parent_child
  basis: Achilles’ mother comes from the sea with immortal nymphs to view his body,
    later brings the golden vase and secures prizes from the gods.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The extraction uses the parent-child relation explicitly in the passage;
    broader goddess-mother interpretation is not asserted.
- id: motif:6
  label: Lasting heroic fame secured by tomb and public contests
  taxonomy_refs: []
  basis: The tomb is built where it can be seen from the sea, funeral prizes are offered,
    and Agamemnon says Achilles’ name lives evermore among mankind.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage emphasizes fame and memorialization, but does not explicitly
    describe cult practice.
- id: motif:7
  label: Fatal homecoming after war
  taxonomy_refs:
  - return
  basis: Agamemnon states that Jove willed his destruction on his return by the hands
    of Aegisthus and his wife.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This motif is referenced in speech rather than narrated in the present
    action of the passage.
