canonical_text:
  quote: ''
  summary: Mercury summons and guides the ghosts of the slain suitors into Hades.
    They pass named thresholds and arrive at the asphodel meadow, where the shades
    of Greek heroes converse. Achilles and Agamemnon discuss their deaths; Agamemnon
    recounts the mourning, cremation, burial, and funeral honors of Achilles, then
    Mercury arrives with the suitors' ghosts and Agamemnon recognizes Amphimedon.
  language: English
  quote_policy: summarized
