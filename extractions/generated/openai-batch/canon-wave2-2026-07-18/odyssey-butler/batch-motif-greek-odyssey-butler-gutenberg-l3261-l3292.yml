canonical_text:
  quote: ''
  summary: Alcinous offers Ulysses a non-compulsory stay, marriage to his daughter,
    a house and estate, and a promised escort by Phaeacian ship to his home or any
    chosen destination. He praises the speed and excellence of his ships and sailors.
    Ulysses prays to Father Jove that Alcinous may fulfill the promise so that Ulysses
    may return to his country. Arete orders maids to prepare a bed for Ulysses in
    the gatehouse; the maids do so with torches, and Ulysses sleeps there while Alcinous
    sleeps inside with the queen.
  language: English
  quote_policy: summarized
