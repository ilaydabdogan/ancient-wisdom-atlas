  summary: In the underworld, Ulysses sees Tantalus unable to drink or reach fruit,
    Sisyphus endlessly rolling a stone uphill, and the phantom of Hercules, who speaks
    of his earthly sufferings and his mission to bring the hound from Hades. Ulysses
    is then frightened by the crowding ghosts and the possible appearance of the Gorgon’s
    head, so he returns to his ship and departs on Oceanus.
