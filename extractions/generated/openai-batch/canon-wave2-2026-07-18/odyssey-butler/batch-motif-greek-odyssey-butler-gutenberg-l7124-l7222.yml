canonical_text:
  quote: ''
  summary: Telemachus describes his endangered household and sends Eumaeus secretly
    to Penelope. After Eumaeus departs, Minerva appears privately to Ulysses, instructs
    him to reveal himself to Telemachus, and transforms his appearance with a golden
    wand. Telemachus first thinks the transformed stranger may be a god and doubts
    the claim of fatherhood, but Ulysses identifies himself, explains Minerva's role,
    and father and son embrace and weep together.
  language: English
  quote_policy: summarized
