  summary: Telemachus sacrifices to Minerva at his ship, receives the fugitive seer
    Theoclymenus as a suppliant, and sails with divine wind. The passage recounts
    Theoclymenus’ prophetic ancestry. Meanwhile Ulysses eats with Eumaeus in the hut
    and tests the swineherd by proposing to go beg among the suitors; Eumaeus warns
    him to remain away from them.
