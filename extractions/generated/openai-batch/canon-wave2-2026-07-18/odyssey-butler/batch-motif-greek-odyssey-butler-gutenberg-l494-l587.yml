canonical_text:
  quote: ''
  summary: Telemachus notices Minerva before the suitors do, welcomes her as a stranger,
    seats her apart from the suitors, and has servants provide washing water, food,
    and wine. The suitors feast, demand music, and compel Phemius to sing. Telemachus
    quietly tells Minerva of his absent father Ulysses and asks the visitor’s identity.
    Minerva answers under the identity of Mentes, describes a trading voyage and former
    friendship with Ulysses’ family, says Ulysses is not dead and will return, comments
    on Telemachus’ resemblance to him, and asks about the riotous suitors.
  language: English
  quote_policy: summarized
