canonical_text:
  quote: ''
  summary: 'After returning from the house of Hades to Aeaea, Ulysses and his men
    perform funeral rites for Elpenor. Circe arrives, feeds them, and privately instructs
    Ulysses about the next stages of the voyage: the Sirens and precautions against
    their song, the dangerous Wandering Rocks with an allusion to the Argo, Scylla
    in her high cave, and Charybdis beneath a fig tree. Ulysses asks whether he can
    avoid Charybdis while also defending his men from Scylla.'
  language: English
  quote_policy: summarized
