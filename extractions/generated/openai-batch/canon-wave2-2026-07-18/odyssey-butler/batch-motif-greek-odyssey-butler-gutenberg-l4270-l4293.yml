canonical_text:
  quote: ''
  summary: After a prayer heard by Neptune, an unnamed figure hurls a large rock near
    the ship, raising a wave that drives the voyagers toward shore. The first-person
    narrator and companions return to the island where other ships and comrades wait,
    land and divide the Cyclops’ sheep, and sacrifice a ram to Jove, who does not
    heed the sacrifice. After feasting and camping on the beach, they depart at dawn,
    rowing away sorrowfully but relieved to have escaped death despite losing comrades.
