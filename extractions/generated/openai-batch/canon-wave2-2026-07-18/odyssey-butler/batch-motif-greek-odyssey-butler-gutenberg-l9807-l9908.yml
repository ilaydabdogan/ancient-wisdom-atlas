canonical_text:
  quote: ''
  summary: During the fighting in Ulysses' house, Agelaus urges the suitors to throw
    spears, but Minerva repeatedly makes their weapons ineffective. Ulysses, Telemachus,
    Eumaeus, and the stockman kill multiple suitors. Minerva displays the aegis from
    the rafter, terrifying the remaining suitors, who are slaughtered. Leiodes begs
    for mercy as a sacrificing priest but is killed by Ulysses. Phemius the bard begs
    for mercy, and Telemachus asks Ulysses to spare both Phemius and Medon. Medon
    emerges from hiding beneath a heifer hide and grasps Telemachus' knees.
  language: English
  quote_policy: summarized
