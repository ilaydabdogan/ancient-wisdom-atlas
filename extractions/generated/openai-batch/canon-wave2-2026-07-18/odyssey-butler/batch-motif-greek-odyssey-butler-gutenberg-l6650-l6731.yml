canonical_text:
  quote: ''
  summary: Helen gives Telemachus a robe as a keepsake for his future bride. Menelaus
    hosts Telemachus and Pisistratus, offers farewell with wine for a drink-offering,
    and they depart by chariot. An eagle carrying a white goose flies on their right,
    and Helen interprets it as a sign that Ulysses will return and take revenge on
    the suitors. Telemachus promises vows if this proves true. The travelers reach
    Pherae and Pylos; Telemachus asks Pisistratus to leave him at his ship so he can
    go home at once, and then orders his men to prepare for departure.
  language: English
  quote_policy: summarized
