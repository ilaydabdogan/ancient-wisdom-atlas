canonical_text:
  quote: ''
  summary: Ulysses goes to the vineyard to test his father Laertes, finds him aged,
    poorly clothed, and grieving, and first speaks to him under a false identity.
    Laertes laments his presumed-dead son and the lack of proper mourning. Ulysses
    then embraces him, reveals that he has returned after twenty years and killed
    the suitors, and Laertes asks for proof of identity.
  language: English
  quote_policy: summarized
