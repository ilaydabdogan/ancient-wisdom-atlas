canonical_text:
  quote: ''
  summary: Ulysses, while among the dead in Hades, speaks with Achilles about death,
    homecoming, Neoptolemus, and Peleus. Achilles is consoled by news of his son's
    prowess. Ajax remains angry over the award of Achilles' armour and refuses to
    speak. Ulysses then sees Minos judging the dead, Orion driving ghosts of beasts,
    and Tityus punished by vultures for violating Leto.
  language: English
  quote_policy: summarized
