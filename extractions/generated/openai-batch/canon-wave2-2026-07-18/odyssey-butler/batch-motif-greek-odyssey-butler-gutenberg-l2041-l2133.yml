candidate_motifs:
- id: motif:1
  label: Sacrificial appeasement before safe return
  taxonomy_refs:
  - sacrifice
  - return
  basis: Menelaus offers hecatombs to appease heaven's anger and then receives a fair
    wind for a quick passage home.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents sacrifice and divine assistance directly, but does
    not elaborate a full ritual system.
- id: motif:2
  label: Memorial barrow preserving a hero's name
  taxonomy_refs: []
  basis: Menelaus raises a barrow to Agamemnon's memory so that his name may live
    forever.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No supplied taxonomy reference directly matches the memorial-barrows motif.
- id: motif:3
  label: Guest-host gift exchange
  taxonomy_refs:
  - sacred_exchange
  basis: Menelaus offers Telemachus hospitality and gifts, including a chalice associated
    with drink-offerings and a crafted mixing bowl with a prior royal gift history.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The exchange is primarily social hospitality; the sacred element is clearest
    in the chalice's use for drink-offerings.
- id: motif:4
  label: Divine or ambiguous double as mortal captain
  taxonomy_refs:
  - shapeshifter
  basis: Noemon reports seeing Mentor go aboard as captain, or else a god exactly
    like Mentor.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The report is explicitly uncertain and does not identify the god within
    this passage.
- id: motif:5
  label: Departure to seek news of an absent father
  taxonomy_refs:
  - departure
  basis: Antinous says Telemachus set out to try to get news of his father, and the
    suitors learn he has gone to Pylos with a ship and crew.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The departure itself is reported retrospectively rather than narrated
    at the moment of leaving.
- id: motif:6
  label: Ambush planned at a strait during the hero's return
  taxonomy_refs:
  - return
  basis: Antinous calls for a ship and twenty men to lie in wait for Telemachus in
    the straits between Ithaca and Samos when he returns.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The ambush is planned but not enacted within this passage.
