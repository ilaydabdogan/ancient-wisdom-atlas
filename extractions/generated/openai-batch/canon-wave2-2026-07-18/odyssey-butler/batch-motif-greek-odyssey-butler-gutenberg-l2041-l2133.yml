  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Noemon reports seeing Mentor go aboard as captain, or else some god exactly
    like Mentor.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: Antinous and Eurymachus become very angry and call the other suitors away
