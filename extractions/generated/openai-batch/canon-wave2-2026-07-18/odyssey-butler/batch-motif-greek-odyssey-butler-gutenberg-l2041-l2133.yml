canonical_text:
  quote: ''
  summary: Menelaus recounts returning to his ships, sailing, making offerings, raising
    a memorial barrow for Agamemnon, and receiving a fair wind home. He offers Telemachus
    hospitality and gifts; Telemachus asks instead for plate rather than horses, and
    Menelaus offers a silver-and-gold mixing bowl. Meanwhile, at Ithaca, the suitors
    learn from Noemon that Telemachus has sailed to Pylos with Noemon's ship and a
    crew, reportedly captained by Mentor or a god like him. Antinous and Eurymachus
    become angry, and Antinous proposes an ambush in the straits between Ithaca and
    Samos.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed preceding speaker dives under the waves, after which the narrator
    returns to the ships with companions and care in his heart.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The companions prepare supper as night falls and camp on the beach.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At dawn the ships are drawn into the water, equipped with masts and sails,
    boarded, and rowed across the sea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The narrator stations his ships in the stream of Egypt, offers hecatombs to
    appease heaven's anger, raises a barrow for Agamemnon's memory, and receives a
    fair wind from the gods for the home passage.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Menelaus asks Telemachus to stay ten or twelve more days and offers him a
    chariot, three horses, and a chalice for drink-offerings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Telemachus declines a longer stay, saying his crew at Pylos is already impatient.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Telemachus prefers a piece of plate to horses, explaining that Ithaca lacks
    open fields and racecourses and is more suited to goats than horses.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Menelaus smiles, takes Telemachus's hand, praises his family, and agrees to
    exchange the gift.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Menelaus offers a silver mixing bowl with a gold-inlaid rim, said to be made
    by Vulcan and previously given by Phaedimus, king of the Sidonians.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Guests come to the king's house bringing sheep and wine, while their wives
    have prepared bread; people cook dinners in the courts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The suitors throw discs and aim spears at a mark on level ground before Ulysses'
    house and are described as insolent.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Noemon son of Phronius asks Antinous when Telemachus will return from Pylos
    because Telemachus has Noemon's ship.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The suitors are astounded because they had thought Telemachus had not gone
    to Pylos but was somewhere on the farms.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Antinous asks when Telemachus went, whom he took, and whether Noemon lent
