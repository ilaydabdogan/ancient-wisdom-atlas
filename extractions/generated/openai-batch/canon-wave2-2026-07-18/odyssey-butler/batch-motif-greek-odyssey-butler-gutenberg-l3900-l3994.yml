  summary: Ulysses describes an uninhabited fertile island near the Cyclopes, a night
    landing, a dawn goat hunt, and his decision to explore the nearby Cyclopes. He
    approaches a great cave belonging to a huge solitary shepherd-monster, brings
    potent wine received from Maron, and enters the absent owner's cave, where his
    men urge theft and departure but he waits for the owner in hope of a gift.
