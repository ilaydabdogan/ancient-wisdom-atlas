  quote: ''
  summary: The narrator describes the Laestrygonians killing and eating his men and
    destroying the ships, while his own ship escapes. The surviving crew reaches Aeaea,
    associated with Circe, rests, scouts the island, finds a stag for food, and then
    sends a lot-chosen party under Eurylochus toward Circe’s forest house, where enchanted
    wolves and lions fawn around the entrance and Circe is heard singing at her loom.
  language: English
