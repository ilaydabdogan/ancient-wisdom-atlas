canonical_text:
  quote: ''
  summary: Telemachus doubts that his father can return. Minerva, addressed as Mentor,
    answers with reflections on divine rescue, safe homecoming, and unavoidable death.
    Telemachus asks Nestor how Agamemnon died and whether Menelaus was absent. Nestor
    recounts Aegisthus' seduction of Clytemnestra, the removal of her bard-guardian,
    Agamemnon's murder, Menelaus' delayed and storm-driven return, Orestes' return
    and vengeance, and Menelaus' eventual arrival with treasure. Nestor advises Telemachus
    not to stay away from home too long but to visit Menelaus for truthful news. At
    dusk Minerva directs ritual offerings to Neptune and the immortals before bed.
  language: English
  quote_policy: summarized
