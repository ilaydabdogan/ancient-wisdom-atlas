canonical_text:
  quote: ''
  summary: 'In Eumaeus''s hut, Ulysses asks about Ulysses'' parents. Eumaeus reports
    Laertes'' grief, the death of Ulysses'' mother, and his own upbringing in the
    household. He then begins his origin tale: Syra is a prosperous island ruled by
    his father Ctesius; Phoenician traders arrive by ship and seduce a Phoenician
    servant from Sidon who had earlier been seized and sold by pirates. She agrees
    under oath to leave with the traders, steal gold, and carry off the child she
    nurses for sale abroad.'
  language: English
  quote_policy: summarized
