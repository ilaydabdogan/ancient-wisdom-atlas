canonical_text:
  quote: ''
  summary: 'Ulysses responds to King Alcinous, praises the bard and feast, names himself
    as Ulysses son of Laertes of Ithaca, recalls divine detentions by Calypso and
    Circe, and begins recounting his hazardous return from Troy: the sack of Ismarus,
    defeat by the Cicons, storm-driven wandering, the Lotus-eaters whose food causes
    forgetfulness of home, and the land of the lawless cave-dwelling Cyclopes.'
  language: English
  quote_policy: summarized
