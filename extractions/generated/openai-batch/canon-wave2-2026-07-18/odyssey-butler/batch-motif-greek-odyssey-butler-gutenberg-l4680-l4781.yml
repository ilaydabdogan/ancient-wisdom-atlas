canonical_text:
  quote: "“You must go to the house of Hades and of dread Proserpine to consult the
    ghost of the blind Theban prophet Teiresias”"
  summary: Circe restores and hosts Ulysses’ men for a year. When they press to resume
    the homeward voyage, Ulysses asks Circe to fulfill her promise to send them on.
    Circe says they must first travel to the house of Hades and Proserpine to consult
    the dead prophet Teiresias. She gives a route by Oceanus and detailed rites of
    offerings, sacrifice, and guarding the blood. At daybreak Ulysses rouses his men,
    but Elpenor dies accidentally by falling from Circe’s roof. Ulysses then tells
    the crew that they must go to Hades before returning home.
  language: English
  quote_policy: quoted
