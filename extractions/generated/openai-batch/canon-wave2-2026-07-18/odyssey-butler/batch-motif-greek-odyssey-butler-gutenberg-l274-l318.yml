canonical_text:
  quote: ''
  summary: 'The preface argues that the Odyssey comprises two distinct poems: one
    concerning the Return of Ulysses, including the Phaeacian episode and Ulysses’
    self-narrated adventures, and another concerning Penelope and the suitors, including
    Telemachus’ voyage to Pylos. It also discusses compositional changes intended
    to create unity, including a new council of the gods, and closes with remarks
    on punctuation and capitalization in an edition of the text.'
  language: English
  quote_policy: summarized
