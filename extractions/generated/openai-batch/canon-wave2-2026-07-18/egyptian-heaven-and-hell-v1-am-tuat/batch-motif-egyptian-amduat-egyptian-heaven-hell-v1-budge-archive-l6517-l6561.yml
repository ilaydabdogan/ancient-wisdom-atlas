canonical_text:
  quote: ''
  summary: A speech of a great god addresses gods whose posture, motion, souls, shades,
    flesh, and members are described. They live through the god's voice and watch
    the two comings of Khuti. A second address concerns nine serpents, also called
    male gods or nine forms of divine spirits, with flame faces and knives. They are
    commanded to burn Khepera's enemies and hack their shades, are called warders
    of the Hidden Flesh made of Nu, dwell in the Water of Ta-tiienex, live from the
    word of Ea, and work in the Tuat to hack the dead and destroy spirits.
  language: English
