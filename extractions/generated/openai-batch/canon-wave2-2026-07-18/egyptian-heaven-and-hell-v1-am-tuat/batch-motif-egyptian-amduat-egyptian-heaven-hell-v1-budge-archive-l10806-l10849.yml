canonical_text:
  quote: Speed ye your arrows, make ready your javelins, bend your bows, and destroy
    ye for me my enemies who are in darkness
  summary: A speech attributed to a great god addresses armed beings with arrows,
    javelins, and bows. He commands them to prepare their weapons, destroy his enemies
    in darkness, stand at the portal of their horizon, and follow in his train when
    he unites with beings who adore his flesh in the Mantit Boat. The armed beings
    are said to drive back the Sebi serpent of Neha-hra in thick darkness and to travel
    with the god when he passes into the Eastern Hall of the horizon.
  language: English
  quote_policy: quoted
