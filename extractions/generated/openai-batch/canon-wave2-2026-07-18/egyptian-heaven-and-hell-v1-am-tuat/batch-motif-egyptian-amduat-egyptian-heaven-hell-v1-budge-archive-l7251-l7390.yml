  summary: 'A portion of the Book of Am-Tuat catalogue describes groups in the seventh
    division: bound enemies of Osiris, a cat- or lynx-headed armed god, Anku restraining
    foes, three crowned human-faced hawks, and Afu-Tem seated on a serpent who attacks
    rebels with flame and consumes enemy souls.'
