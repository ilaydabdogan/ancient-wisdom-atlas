canonical_text:
  quote: ''
  summary: 'The passage describes beings seated on weaving instruments set on sand
    according to a mystery made by Horus. An unnamed god cries out to their souls,
    and voices of those shut in a Circle are heard; this Circle is named Hetemet-khemiu.
    The passage then introduces another Circle, Hap-SEMU-S, entered through a door
    named Tes-sekhem-aeu, containing four mummied gods with weaving instruments: Hebset,
    Senket, Tebat, and Temtet.'
