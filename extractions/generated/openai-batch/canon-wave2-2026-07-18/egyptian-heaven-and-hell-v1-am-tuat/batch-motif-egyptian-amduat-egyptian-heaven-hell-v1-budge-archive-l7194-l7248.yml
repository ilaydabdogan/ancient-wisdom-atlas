  summary: An unnamed god addresses Osiris, who dwells in or under the serpent Mehen.
    Osiris is hailed as governor of the Tuat, lord of life, ruler of Amentet, and
    possessor of magical power. His followers are exalted before him, his enemies
    are beneath his feet, and those enemies are burned, hacked, chopped, and counted.
    The speaker asks to pass over in peace.
