  summary: The passage describes goddesses who emerge from a double serpent and from
    an axe, gather souls on earth, purify spirits in the Tuat by hidden figures, and
    then swallow their own spirits after a great god has passed. It also describes
    eight upright goddesses facing an ape god who holds the utchat, or eye of the
    sun; the first four goddesses have lioness heads and are named, while the remaining
    visible entries are woman-headed goddesses with two names preserved in the excerpt.
