canonical_text:
  quote: ''
  summary: In the Second Division, Urnes, unnamed beings give seasons and years to
    a great god, answer his speech, receive life and breath through his voice, and
    are assigned tasks and green herbs in their field. They supply green herbs to
    the gods in Ra's following, offer water to spirits, kindle fire to burn Ra's enemies,
    lament after the great god passes, and the Field is guarded by Am-nebaui. Knowledge
    of this is said to equip and protect a spirit.
  language: English
  quote_policy: summarized
