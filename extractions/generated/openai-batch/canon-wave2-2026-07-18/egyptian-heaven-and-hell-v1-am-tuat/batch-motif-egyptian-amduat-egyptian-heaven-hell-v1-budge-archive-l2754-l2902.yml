canonical_text:
  quote: '"Traverse thou this Field... bind thou with fetters the Hau serpent, and
    smite thou the serpent Neha-hra."'
  summary: The passage describes the great god entering and travelling through the
    Tuat region called Urnes by boat. The gods of the Tuat greet him, urge him to
    overcome serpents and darkness, and affirm the opening of hidden doors and his
    coming into being as Khepera in the East. The great god addresses the underworld
    inhabitants, commands the opening of doors, grants them water, bread, wind, movement,
    and continued souls, and asks their help against Apep during his night journey.
    The passage ends with rowing the god's boat to rest and states that written knowledge
    of these scenes and words acts as magical protection for a man on earth.
  language: English
  quote_policy: quoted
