    palace concerning souls, gods, shadows, and spirits in Ament and the Tuat. It
    says the work contains knowledge of the souls, secret souls, doors, ways, hours
    and their gods, the journeyings of the great god and of the hours, formulae addressed
    to him, speeches he makes, gods who praise him, and beings who effect destruction.
