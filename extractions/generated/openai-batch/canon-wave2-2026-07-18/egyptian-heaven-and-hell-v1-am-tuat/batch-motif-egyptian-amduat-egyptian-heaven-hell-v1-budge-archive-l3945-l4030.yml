canonical_text:
  quote: ''
  summary: The passage lists named beings and Nebt-ankh, then explains that the beings
    in the picture are hidden travellers on the way of a holy country with hidden
    secrets. They are guardians of the way for those entering the hidden place of
    the Tuat, and they keep watch over Anpu as he tows them into the holy land. The
    upper register includes a goddess wearing the crown of the North, a human-headed
    serpent with human feet and legs, and three serpents moving side by side on their
    bellies.
