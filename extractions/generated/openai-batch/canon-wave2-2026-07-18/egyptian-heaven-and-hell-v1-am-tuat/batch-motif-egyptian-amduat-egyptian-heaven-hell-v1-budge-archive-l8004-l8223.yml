canonical_text:
  quote: ''
  summary: In the Eighth Division, a god identified in the prose as Ra enters a City
    of the Tuat in the hidden form of Mehen while being towed by gods. He cries out
    to the regions and circles of the City and hears responding voices. Figures associated
    with dead bodies remain under sand; their gates open to the god's voice each day
    and they hide after he passes. The towing gods bring Ra into a Hall and petition
    him to unite with his hidden image and with the sepulchres of Khenti-Amenti, and
    to lighten the darkness of those on their sands. The passage then identifies eight
    gods who tow the boat of Ra and describes nine servant or follower forms furnished
    with knives and suspended human heads.
  language: English
  quote_policy: summarized
