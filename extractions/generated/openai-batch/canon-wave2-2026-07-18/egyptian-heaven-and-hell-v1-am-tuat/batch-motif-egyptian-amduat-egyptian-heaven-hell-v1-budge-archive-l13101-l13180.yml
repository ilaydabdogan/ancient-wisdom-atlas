canonical_text:
  quote: ''
  summary: A divine decree orders the cutting apart and destruction of enemies and
    inverted dead beings associated with Osiris. Their bodies, spirits, souls, shadows,
    and heads are dismembered; they are cast headlong into pits of fire and cannot
    flee the flames in the serpent Set-heh. Named fiery powers oppose and attack them.
    A note explains that Heru-Tuati orders their daily slaughter in the Tuat, and
    that beings in the picture live by the voices and cries of the punished souls
    and shadows in fire pits.
  language: English
  quote_policy: summarized
