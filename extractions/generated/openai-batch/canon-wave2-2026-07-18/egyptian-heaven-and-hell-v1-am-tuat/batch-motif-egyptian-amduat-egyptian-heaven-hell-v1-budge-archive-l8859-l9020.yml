  summary: The passage describes the Circle Hetepet-neb-s, whose occupants are seated
    on weaving instruments set on sand according to a mystery made by Horus. A great
    god enters the city of gods upon their sand and cries out to the occupants' souls;
    the sound of those shut in the Circle is compared to male cats, and their souls
    cry out to Ka. The passage then introduces the Circle Hetemet-khemiu, entered
    through a door named Tes-Ea-kheftiu-f, and lists Nut, Ta, and Sebeq-hk with their
    bodily attributes.
