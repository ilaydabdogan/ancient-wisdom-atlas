canonical_text:
  quote: ''
  summary: In a section of the Ninth Division of the Tuat, a group of swathed and
    garmented divine beings are described as seated on weaving instruments in forms
    made by Horus. Ea addresses them, telling them to uncover their heads and faces,
    perform duties for Osiris, praise the lord of Amentet, and make their word maat
    against Osiris's enemies. The passage identifies these beings as divine sovereign
    chiefs who avenge Osiris by words and overthrow his enemies in the Tuat. It then
    lists twelve goddesses by name.
