canonical_text:
  quote: ''
  summary: 'The passage describes beings shown in the Tuat: they possess their own
    flesh, their souls speak over them, and their shadows are united with them. After
    a great god addresses them, they answer, praise him, and weep after he passes.
    Their work in Amentet includes vengeance on the Seba fiend of Ea, causing Nu to
    come into being, and making Hap, identified as the Nile, flow. Knowledge of these
    things protects a passerby from their roarings and caverns. The lower register
    then lists Khnemu, ram-headed, and Nerta, a bearded male figure with hands raised
    in adoration.'
  language: English
  quote_policy: summarized
