canonical_text:
  quote: ''
  summary: 'The passage describes iconographic elements in the second division of
    the Am-Tuat: a third boat associated with a lizard-god, Osiris, southern and northern
    crowns, and jackal-headed gods; a fourth boat associated with Neper, grain, vegetation,
    uraei, and armless figures; and several upper-register gods with distinctive attributes.'
  language: English
  quote_policy: summarized
