canonical_text:
  quote: ''
  summary: The passage describes part of the Eighth Division of the Tuat. Hidden swathed
    beings answer a god with voices; after the god passes and night covers them, they
    receive diadems of Ra and the soul of Tathenen unites with the earth. The upper
    register is described as a set of named Circles of the Tuat entered through named
    doors. Several circles contain named divine images seated on instruments for weaving,
    while the god cries to their souls and their enclosed voices are compared to bees,
    swathed ones, or lamenting men.
  language: English
  quote_policy: summarized
