  quote: ''
  summary: 'The passage catalogues parts of the Third Hour upper register of the Am-Tuat:
    a papyrus sceptre called Uk-hekau surmounted by flesh; four named gods; four mummied
    forms with differing head ornaments; four goddesses identified as professional
    mourners; the god Heru-kheti followed by the Hennu standard, described as the
    hawk of Seker on a standard; and the gods Meh-Maat and Neter-neferu.'
