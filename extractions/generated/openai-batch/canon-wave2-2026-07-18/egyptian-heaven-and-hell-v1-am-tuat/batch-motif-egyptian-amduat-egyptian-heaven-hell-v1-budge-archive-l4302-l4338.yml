canonical_text:
  quote: ''
  summary: The passage describes a three-headed serpent named Menmenut, associated
    with the Aheth chamber of Seker and with the daily birth of Khepera. The serpent
    bears six stars and fourteen disk-crowned human heads, interpreted as gods of
    the first fourteen days of the month, and carries them to the Utchat, which Thoth
    and Horus carry. The same figures are said to appear again in the next Division
    of the Tuat. The passage also describes the winged disk of Khepera with the envoy
    of heaven and the goddess Maat beneath or behind it.
  language: English
