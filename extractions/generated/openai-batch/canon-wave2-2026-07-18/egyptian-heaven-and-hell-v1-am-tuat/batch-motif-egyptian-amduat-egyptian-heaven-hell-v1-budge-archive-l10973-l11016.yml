  summary: 'The passage describes a scene from the Book of Am-Tuat: an axe, identified
    as a symbol of “god,” stands on its handle with a disk resting on the side edge
    of its head. A goddess on the left steadies the axe, and a goddess on the right
    steadies the disk. The goddesses are named ISTetheth and Kexat. Each is shown
    in a sitting posture, though without a seat or throne. A hieroglyphic text is
    then introduced as referring to the scenes.'
