canonical_text:
  quote: ''
  summary: A section of the Book of Am-Tuat describes words spoken by the Majesty
    of a great god to royal and divine beings in the Tuat, promising offerings, life,
    food, rising souls, knives, and protection from violence. The passage then enumerates
    figures including the couchant lion Ka-hemhemet with Utchats above his back, a
    seated form of Isis, the gods Hetchefu and Thath-neteru, and a chamber of Ra with
    a fire-belching snake and an image of Ra in leonine hind-quarters form.
  language: English
  quote_policy: summarized
