canonical_text:
  quote: ''
  summary: The passage describes a dark horizon image associated with Sekri/Sekki,
    where dawn and light issue from the great god. Serpents stand to the left and
    right of the horizon, one presenting offerings and one protecting the horizon
    with mouth-flames. Four seated gods hold secret forms and divine regalia. Behind
    a serpent are fiery bearded heads emerging from Lake Netu, and gods weep when
    the boat passes toward the Tuat; the waters are described as like fire to those
    within them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The image in the picture is said to be in thick darkness, while dawn in the
    horizon comes from the eyes of the heads of the great god, whose flesh sends forth
    light and whose legs are bent round.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The great god is described as keeping ward over the flesh of Sekki, who is
    on his sand and is his own image.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The voice of the horizon is heard after the great god has passed by, and it
    is compared to roaring in the heights of heaven during a storm.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the left of the horizon of Sekri is the serpent Tepazst, who lives by the
    voice of the primeval gods of the earth, comes forth and goes in, and presents
    daily offerings to the great god unseeing and unseen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the right of the horizon is the serpent Ankh-aa-pau, who lives upon flames
    issuing from his mouth, protects the horizon, and never enters any house of the
    Tuat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Immediately in front of the serpent are four seated gods; the heads of two
    are turned behind them, and the group is described as holding the secret forms
    of Sekki on his sand.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The four seated gods hold the White Crown, the Red Crown, the head of the
    ram of Heru-shefshefit, and the plumes of Shu or another god of light and dryness.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: A legend over the four seated gods says their forms are in the place among
    them in their own bodies, and that they follow after the great god unseeing and
    unseen.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Behind the serpent Tepax are four human bearded heads, each with a mass of
    fire on top, projecting from the long narrow lake called Netu; they are called
    the Blazing heads.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The gods in the Ammahet weep when the boat has passed them on its way to the
    Tuat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The waters in this place are said to be like fire to those who are in them.
  category: attribute
  evidence_refs:
  - ev:7
