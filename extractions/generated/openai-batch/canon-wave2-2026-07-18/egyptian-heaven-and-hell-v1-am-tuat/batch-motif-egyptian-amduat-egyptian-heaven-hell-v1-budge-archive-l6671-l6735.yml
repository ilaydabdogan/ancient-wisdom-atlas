canonical_text:
  quote: ''
  summary: The passage describes a great god journeying in a city along the Circle
    of Sar/Osiris by means of words of power associated with Isis and Ser. If these
    words are uttered, Apep/Neha-hra is repulsed and shut in the hidden place of the
    Tuat; the one who utters them becomes one of those in the boat of Ka in heaven
    and on earth, while one who does not know the figures cannot repulse Neha-hra.
    A following caption identifies the serpent Neha-hra transfixed to the ground by
    six knives, with the goddess Serqet standing with a band around his neck.
