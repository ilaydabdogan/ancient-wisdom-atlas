canonical_text:
  quote: ''
  summary: 'A great god addresses gods over a Field in the Tuat, including the Heteptin,
    describes their offerings, powers, and possessions, commands them to protect Osiris
    from violent wrongdoers, and states that their work is to give offerings to gods
    of the Tuat. The passage then lists three groups of three sceptres: one group
    surmounted by White Crowns, one by Red Crowns, and one by uraei; each sceptre
    has a knife projecting from its base.'
  language: English
  quote_policy: summarized
