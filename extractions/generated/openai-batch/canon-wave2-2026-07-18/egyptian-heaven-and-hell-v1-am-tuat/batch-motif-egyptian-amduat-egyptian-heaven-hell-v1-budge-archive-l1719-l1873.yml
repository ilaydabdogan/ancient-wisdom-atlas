canonical_text:
  quote: ''
  summary: The passage describes the Second Division of the Tuat, called Uenes, traversed
    by the Sun-god during the Second Hour of night. The ram-headed god Af travels
    in a boat along a stream, accompanied by crew gods and preceded by four other
    boats. The boat includes two serpents named Isis and Nephthys at the front. The
    first leading boat carries the full moon disk in a crescent and includes a kneeling
    god supporting Maat as a feather. The second leading boat is associated with Hathor
    or Hathor-Isis through a sistrum, includes two goddesses, and bears a beetle described
    as the great god Neper.
  language: English
  quote_policy: summarized
