canonical_text:
  quote: ''
  summary: 'A prose explanation describes figures in the Tuat whose forms were made
    by Horus. A great god arrives, cries out to them, and they come to life and hear
    his voice. Their work is verbal and ritual: praising Osiris, embracing the hidden
    Soul with words, bringing life and strength to the risings of the god of the Tuat,
    and speaking daily in the chamber. A lower register contains twelve uraei on weaving
    instruments, each pouring fire from its mouth; a fragmentary list gives some names.'
  language: English
  quote_policy: summarized
