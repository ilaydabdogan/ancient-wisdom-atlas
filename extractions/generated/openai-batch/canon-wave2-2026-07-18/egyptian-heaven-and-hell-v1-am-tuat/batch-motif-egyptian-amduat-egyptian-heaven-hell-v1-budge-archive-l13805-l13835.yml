  quote: ''
  summary: A group shown with their own bodies and emerging uraei follows a great
    god as he sets out for a City. Emissions from their mouths drive away Apep on
    behalf of Kii into the Hall of the East of the Horizon. They journey through the
    upper heavens, restore gods after the great god passes the hidden chamber of the
    sky, return to their abodes, and give pleasure to the gods of Amentet through
    Ra-Heru-khut.
