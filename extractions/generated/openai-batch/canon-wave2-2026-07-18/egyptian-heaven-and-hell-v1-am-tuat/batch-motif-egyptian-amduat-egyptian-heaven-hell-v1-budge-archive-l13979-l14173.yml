  quote: Those who are in this picture sing praises unto this great god from dawn...
  summary: The passage describes beings in a picture praising Ra at dawn when he takes
    his place in the eastern sky. Their speech addresses Ra as self-generating, assigns
    heaven to his soul and earth to his body, and describes his sailing over the horizon
    and taking his place in a shrine. It then lists figures in the lower register,
    including Nu, Nut, Hehu, Hehut, paddle-bearing gods, a serpent deity that pours
    fire from its mouth, and ten gods with hands raised in adoration.
  language: English
  quote_policy: quoted
