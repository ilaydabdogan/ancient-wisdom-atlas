  summary: The passage describes figures on a path where a god is towed. The god calls
    living figures by name; their task is to seize the enemies of Ea throughout a
    City and put their heads under swords after the god has passed. A separate depicted
    form is a ram with a solar disk between its horns and a symbol of linen bandages
    in front of it; the ram is identified as an image or first form of Tathenen.
