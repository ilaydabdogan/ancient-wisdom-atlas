canonical_text:
  quote: ''
  summary: 'The passage describes the Twelfth Division scene: a great god takes position
    in a Circle at the uttermost limit of thick darkness, is born there in the form
    of Khepera, with Nut and Nu present for the birth, comes forth from the Tuat,
    enters the Matet Boat, and rises from the thighs of Nut. It also gives names for
    the gate, city, and hour of the night connected with this divine coming-into-being.'
