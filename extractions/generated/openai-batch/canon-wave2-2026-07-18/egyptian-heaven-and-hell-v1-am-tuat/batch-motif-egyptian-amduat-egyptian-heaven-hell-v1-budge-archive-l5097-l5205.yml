canonical_text:
  quote: ''
  summary: The passage describes a portion of the Fifth Division, Ament, in the Kingdom
    of Seker. It lists an underworld form with hawks and an emerging scarab, a huge
    two-headed serpent named Ter addressed by the deity printed as Ea, several named
    gods with animal-headed or other attributes, their fiery annihilation of the dead
    in the Tuat, and a goddess before whom a kneeling man cuts open his head.
  language: English
