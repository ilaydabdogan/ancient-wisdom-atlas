  quote: ''
  summary: The passage describes the third boat, Pa-khet, translated as “The Branch,”
    with lion-headed ends. In it stands a form of Osiris called Shefshef, with ram’s
    horns and swathed upper body; Am-ta stands behind him, Keb-uast before him, and
    a named steersman and upright serpent are mentioned. The procession of boats is
    then met by four swathed forms of Osiris named Neb-net, Meni, Ai;i-tcheeu, and
    Maa-tcheru.
