  summary: In the seventh division, a speech addresses starry gods and asks them to
    follow and guide the god Ea through the Beautiful Ament. The Twelve Goddesses
    of the Hours are described with stars on their heads and instructed to defend
    and guide Ea into Amentet. The passage also identifies gods and goddesses who
    guide the great god along a hidden way, and introduces an enormous crocodile named
    Ab-sha-am-Tuat, described as Osiris and the Eye of Ea.
