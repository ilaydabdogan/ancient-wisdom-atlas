canonical_text:
  quote: Horus saith unto those who have plunged themselves beneath the waters...
  summary: Horus addresses beings who are under, swimming in, or floating in the waters
    of Nu in the Tuat. He describes their watery condition, lack of heavenly air,
    and movement in the waters, commands them to proceed through Nu, and promises
    that their members and flesh will not perish, that they will have dominion over
    their water and abundance, and that their souls have life. The passage also labels
    a lake of water and includes the standalone names Iletemit, Tchetmit, and Senthes.
