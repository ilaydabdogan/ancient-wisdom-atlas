  summary: The passage introduces the Third Division of the Tuat, named Net-Neb-Ua-Kheper-Aut,
    and describes the dead Sun-god Af traveling by boat over the underworld river
    during the Third Hour of the night. Af stands in a shrine in ram-headed form.
