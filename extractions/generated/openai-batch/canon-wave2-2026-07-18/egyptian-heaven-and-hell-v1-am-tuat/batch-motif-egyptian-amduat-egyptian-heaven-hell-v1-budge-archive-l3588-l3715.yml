canonical_text:
  quote: ''
  summary: 'The passage describes beings in a picture and in the house of Tet who
    praise a great god. When the god speaks to them, they come to life, receive water
    and their due, and perform underworld work in Ament: cutting souls, restraining
    shadows, and destroying doomed beings in a fiery place of destruction. They emit
    flames, enemies are associated with knives over their heads, and they wail when
    the god passes. The warder of the field is named Khetra, and knowledge of this
    grants a spirit dominion over its legs. A cited Maspero extract summarizes a related
    speech of the Sun-god to inhabitants of Net-neb-ua-kheper-aut, including mysterious
    souls following Osiris, defense of Osiris and his images, offerings, night-traversal,
    and avoidance of annihilation; the editor notes that the copies are mutilated
    and cannot be fully reconstructed.'
  language: English with a French cited extract
  quote_policy: summarized
