canonical_text:
  quote: ''
  summary: The passage presents a speech by the great god to kings, Heteptiu, and
    Spirits, granting crowns, offerings, rites, peace, and command over Apep. It then
    describes figures in a picture hearing the god's voice, the Serpent of Many Faces
    with its tail in its mouth journeying through the Tuat, and a hidden path of Amentet
    where the great god is transported by water in a boat. Knowledge or accurate representation
    of the hidden forms, names, hours, and figure of this region grants food and offerings
    in the Tuat.
  language: English
  quote_policy: summarized
