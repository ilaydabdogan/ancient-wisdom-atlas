  quote: ''
  summary: In the Tenth Division of the Book of Am-Tuat, four named female figures
    are described as bearing serpents on their heads and shoulders. A text states
    that the figures live by their heads and shed light on the road of Ea in thick
    darkness. It also says that when Ea comes forth into the Hall of the East, Set
    awakens and travels with him. A separate emblem is a sceptre surmounted by the
    head of Set and named Set-nehes, meaning “Set who wakens.”
