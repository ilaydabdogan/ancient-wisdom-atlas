canonical_text:
  quote: ''
  summary: The passage describes the Boat of the Sun in the Fourth Division/Kingdom
    of Seker. The great god and his crew transfer from their former boat to a serpent-headed
    boat drawn by four named gods. Flames from the mouth of the boat guide the god
    through pools while he calls to unseen forms who hear his voice. The passage then
    lists divine figures and emblems positioned in front of the towing gods, including
    Em-ankhti, the crook of Osiris, Thoth and Horus with the Utchat, Sethen-hat, Her-tebat-f,
    Uatch-hra, and Hetep.
  language: English
  quote_policy: summarized
