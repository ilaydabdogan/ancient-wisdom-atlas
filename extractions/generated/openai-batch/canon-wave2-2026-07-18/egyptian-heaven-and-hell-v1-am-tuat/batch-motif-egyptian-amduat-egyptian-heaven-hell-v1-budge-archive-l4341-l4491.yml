canonical_text:
  quote: ''
  summary: The passage describes the Fifth Division of the Tuat, called Ament, which
    the Sun-god passes through during the fifth hour of the night. The sun boat is
    towed by seven gods and seven goddesses. Four named gods under the guidance of
    Isis of Amentet march before the goddesses and are described as sovereign chiefs
    who provide food in the Circle. A damaged dialogue states that the great god journeys
    in his boat with the help of those who tow him, and the responding gods speak
    of opened earth, roads, the Land of Seker, Horus, Khepera, the cord, and the hidden
    ways of Ea/Ra.
  language: English
  quote_policy: summarized
