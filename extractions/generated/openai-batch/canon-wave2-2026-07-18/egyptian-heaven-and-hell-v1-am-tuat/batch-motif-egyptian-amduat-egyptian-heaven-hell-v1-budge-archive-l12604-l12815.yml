canonical_text:
  quote: ''
  summary: 'The passage describes figures in the Eleventh Division of the Am-Tuat:
    a great god addresses beings in a picture and gives them life through his hidden
    appearances, utterances, boat, and water of Nu; four named goddesses sit on serpents
    with feet and legs in darkness; the lower register contains Horus, a huge serpent
    called the Everlasting Set, and a named pit of fire consuming the enemies of Ra.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A great god calls those in the picture by their names and says his hidden
    appearances and secret radiance cause their life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressed beings are described as having breaths from the utterances of
    the great god's mouth, offerings on his boat where their souls live, and water
    at the source of Nu where dwellers in the Tuat wash with joy.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The work of the addressed beings in the Tuat is to make the hidden things
    of the great god advance to the hidden House each day when they appear with him
    in the upper heaven.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A goddess named Nebt-ankhiu is seated on the backs of two side-by-side serpents
    that appear to issue from her feet; her left hand grasps one serpent and her right
    hand is held before her face.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Three other goddesses named Nebt-khu, Nert-abui, and Mer-ent-neteru are seated
    in the same way in front of Nebt-ankhiu.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The figures in the goddesses' picture have arms on the earth and feet and
    legs in darkness; when the great god cries to them, they utter cries and do not
    leave their places.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Their souls live in the word of forms that come forth from their feet every
    day, and when shades appear, winds in the Tuat cease from the faces of the goddesses.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the lower register, Horus is hawk-headed, wears a disk, leans his right
    shoulder on a long staff, and holds a boomerang whose one end has the form of
    a serpent's head.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: A huge serpent called the Everlasting Set stands upon its tail.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: A large vaulted pit named Hatet-ketits is filled with fire, and the enemies
