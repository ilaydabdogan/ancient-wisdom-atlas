canonical_text:
  quote: ''
  summary: The passage describes the hidden road of Ament, over which a great god
    travels in a holy boat despite the road having no water and no one to tow it.
    His passage is accomplished through words of power associated with Isis, Semsu,
    and the god himself; these utterances protect magically and enact the slaughter
    of Apep in the Tuat. The text also states that correctly copied images from the
    hidden palace in the Tuat protect their maker in heaven and earth, and that knowledge
    of them makes one like the spirits with Ra. The passage then catalogs figures
    in the scene, including Neb-Uast, Seth-ab, Shepes, Atii, Ankhuithit, Afu-Asar,
    and a monster serpent forming a canopy over Afu-Asar, followed by a speech about
    coming forth on a path, opening a fold, illuminating darkness, and embracing one
    in Mehen.
  language: English
  quote_policy: summarized
