canonical_text:
  quote: ''
  summary: A passage in the Seventh Division describes the serpent Neha-hra/Apep being
    restrained by divine figures. The text identifies the district Tchau in the Tuat,
    gives its dimensions, describes Apep’s voice guiding gods to him, and states that
    Serqet/Seeqet is at Apep’s head while Her-tesu-f places a deadly fetter around
    his feet after Isis obtains words of power. Knowledge of the picture and text
    protects a person on earth from becoming one whose water Neha-hra drinks. The
    following list names four goddesses armed with knives.
  language: English
  quote_policy: summarized
