canonical_text:
  quote: ''
  summary: The passage describes figures before a great god carrying the serpent Mehen-ta
    into a city and onward toward the Eastern Horizon. The god calls them by name,
    assigns their duties, and speaks about guarding serpent-figures, journeying, offerings,
    and habitations after the god passes through darkness. The passage then describes
    named serpents bearing the Red and White Crowns, hidden images or heads of Horus
    at a second door of thick darkness on the holy road to Sais, and several crowned
    forms of Neith.
  language: English
  quote_policy: summarized
