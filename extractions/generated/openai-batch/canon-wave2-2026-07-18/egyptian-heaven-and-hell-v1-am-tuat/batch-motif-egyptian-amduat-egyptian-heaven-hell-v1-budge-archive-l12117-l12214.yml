- id: obs:3
  text: The speaker addresses them as keepers of serpent-figures with their two hands
    and commands them to lift their heads, continue their journeys, lengthen their
    steps, and unite with offerings in the Hall of the Eastern Horizon.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Their assigned work is to make the serpent Mehen travel to the Eastern Hall
    of the Horizon, and they return or unite with their habitations after the great
    god passes through darkness and takes his place in the horizon.
  category: sequence
  evidence_refs:
  - ev:3
