canonical_text:
  quote: ''
  summary: 'The passage describes a god addressing a Hall of gods, performing rites
    for entry, and advancing against Apep by words of power attributed to Isis and
    the Sovereign God. It names the gate, city, and guiding hour of the night. It
    then describes the middle register of the Seventh Hour: the Boat of Af, the dead
    Sun-god, with a ram-headed disk-wearing deity named Afu under a canopy formed
    by the serpent Mehen, attended by named figures; Isis recites words of power to
    make the boat advance.'
  language: English
  quote_policy: summarized
