canonical_text:
  quote: ''
  summary: The passage describes the great god journeying over Net-neb-ua-kheper-aut,
    resting in a city, addressing Osiris and his followers, and being guided by hidden
    boats through a field toward an hour and a district. It states that knowing these
    things grants habitation and bread with Ra. The passage then lists figures in
    the upper register, including dog-headed apes, jackal-headed gods, a man and woman
    holding pupils of the Eye of Horus or Ra, a ram, a mummied form, Anubis as a jackal
    on a pylon, and a kneeling man holding a pupil of the Eye of Ra.
  language: English
  quote_policy: summarized
