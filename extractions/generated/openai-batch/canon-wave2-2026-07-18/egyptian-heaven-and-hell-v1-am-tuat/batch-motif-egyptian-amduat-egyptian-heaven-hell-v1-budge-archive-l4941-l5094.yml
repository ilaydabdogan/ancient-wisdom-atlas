  text: A mutilated speech above the axes asks Amentet for a hand or help and describes
    good water that leads to the tomb where the gods rest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The same speech addresses nine gods who came into being from the speaker's
