  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Five gods are listed: an unnamed or unclear guardian figure, Satiu, Ankh-ab
    who is hawk-headed, Bath-resth (?) who is crocodile-headed, and Axp-heni who is
    jackal-headed.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The five gods are said to act as guardians of Net and of those submerged in
