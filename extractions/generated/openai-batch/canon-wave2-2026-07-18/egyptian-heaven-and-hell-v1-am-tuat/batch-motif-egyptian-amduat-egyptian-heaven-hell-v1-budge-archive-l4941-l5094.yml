canonical_text:
  quote: ''
  summary: 'The passage describes figures and objects in the upper register: the goddess
    Amentit, nine large axes with northern and southern crowns, five named or partly
    named gods who act as guardians, an address by the Sun-god concerning waters and
    passage through the Tuat, and an unidentified sand-filled chamber-like object
    marked with a night or darkness sign.'
  language: English
  quote_policy: summarized
