  text: The upper register includes the goddess Amentit standing with her arms stretched
    forward at right angles to her body and wearing the feather of Maat on her head.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The upper register includes nine large axes, four of which are broken away;
    the foremost axe is surmounted by the Crown of the North and the hindmost by the
