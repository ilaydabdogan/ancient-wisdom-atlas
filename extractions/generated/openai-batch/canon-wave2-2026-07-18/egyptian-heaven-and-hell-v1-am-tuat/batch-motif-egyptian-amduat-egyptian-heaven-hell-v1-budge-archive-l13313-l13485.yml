canonical_text:
  quote: ''
  summary: The passage describes a hidden circle in the Tuat where the great god is
    born, comes forth into the pool of Xu, and takes his place in the body of Xut.
    It states that copying and knowing this material gives magical protection. In
    the middle register, the boat of the Sun carries the god under a canopy formed
    by the serpent Mehen, with the beetle of Khepera at the front. The god is drawn
    through the city by gods and servants, passes through a tail-and-mouth sequence,
    comes to birth as Khepera, seals the Tuat, reaches the Eastern Horizon, is received
    by Shu, and comes into being in the East. Twelve named gods tow the solar boat.
  language: English
  quote_policy: summarized
