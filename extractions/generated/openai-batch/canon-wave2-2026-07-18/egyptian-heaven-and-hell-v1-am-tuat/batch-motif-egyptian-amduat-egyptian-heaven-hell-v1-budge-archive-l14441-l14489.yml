canonical_text:
  quote: ''
  summary: The passage describes a hidden image in the invisible form of “Horns” in
    thick darkness, lifted by Shu beneath the sky, with Keb-ur coming forth in the
    earth. It then describes the end of the Tuat as a semi-circular border with a
    sun disk about to rise, the image of Shu stretched along the border, a beetle
    symbolizing Khep[er] emerging from the Sun-god’s boat, and the image of Af, the
    body of the night Sun-god, cast away below.
