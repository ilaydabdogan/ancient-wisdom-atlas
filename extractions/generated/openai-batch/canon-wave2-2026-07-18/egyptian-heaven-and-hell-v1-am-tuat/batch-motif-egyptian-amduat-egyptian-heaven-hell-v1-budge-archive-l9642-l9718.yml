canonical_text:
  quote: ''
  summary: 'The passage describes a great god being transported through a City in
    the Tuat by divine sailors in a boat, his hidden form being Mehen. These gods
    stand by the stream, transport the deity daily, give water to spirits, sing hymns
    to the Lord of the Disk, and make his Soul arise by hidden words. The passage
    then lists several named divine figures: a man-headed hawk, a ram-god, a cow-goddess,
    and a mummiform bearded god.'
