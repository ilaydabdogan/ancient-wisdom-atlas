canonical_text:
  quote: ''
  summary: 'The passage describes part of the Eighth Division of the Am-Tuat: beings
    confined in a named Circle sit on weaving instruments on sand; a god calls to
    their souls, whose voices are compared to terrified supplication as they cry to
    Ra. It then lists an open door with a goddess beyond it, and a lower-register
    Circle entered through a named door, containing a standing goddess, a serpent,
    three arrows of Ra, and a seated lion-headed god.'
  language: English
  quote_policy: summarized
