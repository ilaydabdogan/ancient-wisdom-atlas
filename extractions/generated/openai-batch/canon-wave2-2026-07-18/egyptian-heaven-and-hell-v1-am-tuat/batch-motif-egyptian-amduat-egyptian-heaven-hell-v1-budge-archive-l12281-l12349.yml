canonical_text:
  quote: ''
  summary: The passage describes a hidden Circle of the Tuat through which a god journeys
    to reach the Eastern Horizon. The Circle eternally swallows its images or forms
    before the god Eekh, who dwells in the City, and then gives them to beings born
    on earth. It states that one who makes an exact copy of these forms and knows
    them becomes a well-equipped spirit in heaven and earth. The passage then begins
    a list of figures in the upper register, naming the god Aper-hi!a-neb-tchetta
    and describing his disk, two human heads with White and Red Crowns, sceptre, and
    emblem of life.
