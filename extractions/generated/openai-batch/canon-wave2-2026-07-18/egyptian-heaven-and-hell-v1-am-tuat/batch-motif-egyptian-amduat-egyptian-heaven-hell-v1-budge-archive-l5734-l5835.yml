  summary: 'The passage describes the upper register of a division of the Book of
    Am-Tuat: a seated company of nine gods and goddesses whose thrones are invisible.
    It enumerates named deities and iconographic attributes, including mummiform or
    bandaged bodies, animal heads, head signs, crowns, and three goddesses at the
    end of the group.'
