  quote: ''
  summary: The passage describes figures in a named Circle who have weaving instruments
    before them and are set on sand according to a mystery made by Horus. A god cries
    out to their souls in the two Ateeti, and voices are heard from those shut in
    the Circle, compared to cries from the battlefield of Nu toward Ea. The Circle
    is named Hap-semu-s. A further Circle, Sehert-baiu-s, is entered through a named
    door, Tes-sept-nesut, and contains four mummied gods.
  language: English
  quote_policy: summarized
