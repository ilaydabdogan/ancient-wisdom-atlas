  summary: The passage describes the Sixth Division of the Tuat, named Metchet-mu-nebt-Tuat,
    through which the dead Sun-god Afu-Ra passes during the sixth hour of the night.
    He travels in his boat on water toward the body of Osiris, accompanied by gods,
    with Thoth and Ament-semu-set before the boat. The god addresses hidden forms
    in houses containing the image of Osiris, and the abode of Osiris contains sixteen
    mummied gods in groups.
