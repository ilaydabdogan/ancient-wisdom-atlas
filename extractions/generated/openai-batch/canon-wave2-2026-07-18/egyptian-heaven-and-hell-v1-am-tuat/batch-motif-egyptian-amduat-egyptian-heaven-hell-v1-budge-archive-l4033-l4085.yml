canonical_text:
  quote: ''
  summary: 'The passage describes figures in an underworld picture: unnamed figures
    make passage to every place each day; the scorpion Ankhet and a large uraeus stand
    at Ke-stau at the head of a way to guard it; a god behind them offers two libation
    vases to the serpent and is called guide of the holy way; a three-headed serpent
    with hawk wings and human legs is called the warder of the holy way of Ee-stau
    and lives on abundance from its wings, body, and heads.'
