  quote: ''
  summary: The passage describes two divine boats in a division of the Book of Am-Tuat.
    The first is glossed as the boat which capsizes and contains hawk-headed forms
    of the god named Horns in the supplied text, the hawk-god Bak, the hawk-goddess
    Baket, steering figures, and serpents. The second is Uaa-herer, the Boat of Rest,
    with an Osiris god in mummy form, cynocephalus-headed ends, steering beings, flanking
    gods, and a serpent standing on its tail.
