canonical_text:
  quote: ''
  summary: The passage addresses divine beings in the Tuat who follow the Scarab,
    send light in darkness, hear the voice of Ea, and help souls, shades, and spirits
    with passage, provisions, and water. It then describes the monster serpent Am-khu,
    whose raised head has a life symbol beneath it and whose four body undulations
    bear bearded heads identified as the four children of Horus. The serpent is said
    to be invisible to the great god, while the forms in his folds hear the god's
    voice; his work in the Tuat is to devour shades, consume enemy spirits, and overthrow
    hostile beings. The next item begins by naming the god Kai.
  language: English
  quote_policy: summarized
