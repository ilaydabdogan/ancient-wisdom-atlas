canonical_text:
  quote: ''
  summary: A great god addresses beings stationed at torture-blocks and the destruction
    of the dead. He describes their powers, hymns, vengeance, and dismembering actions,
    commands them to take slaughtering knives and bind a figure so that he may pass
    in peace, and states that one who knows this will pass the goddess in peace. The
    passage then describes the entrance into the Sixth Division of the Tuat through
    a lower-register door guarded by a self-opening serpent, and notes a large five-rayed
    star symbolizing Venus as a journeying living god.
  language: English
  quote_policy: summarized
