canonical_text:
  quote: ''
  summary: 'The passage presents speeches and actions around the passage of Ea/Ra
    through a Court of the Tuat: doors and portals are opened, Apes and serpents perform
    service, the goddess of the hour and two Soul-Goddesses assist him, he takes possession
    of night and brings day, receives acclamation, acts against enemies and the condemned,
    and passes on while the gods wail.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A first-person speaker refers to enchantments, vengeance for the blood of
    members that rose up against him, destruction, and making Osiris Khenti Amenti
    perfect.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker asks Apes to open doors, unfold portals of the Courts, and welcome
    gods or goddesses who came into being from divine Souls.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Addressed beings are told to stand in Urnes, establish themselves on secret
    banks, work for the gods of Tuat in a guarded Court, and possess their seats,
    domains, and fields.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods of the Court tell Ea that doors and portals of secret Ament and the
    doors of Nut are open, and they call on him to illuminate darkness and approach
    the place of Osiris Khenti Amenti.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Apes open doors and unfold portals for Ea; serpents sing and exalt him, and
    divine serpents lighten his darkness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The goddess of the hour comes to Ea, and two Soul-Goddesses tow him along
    in his form as he takes position in the Field of the land.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ea takes possession of the night, brings in the day, lengthens the hours,
    and his boat comes to rest.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ea seizes the grain of the god Henbet, opens Net-Ea, uncovers the god Tcheba,
