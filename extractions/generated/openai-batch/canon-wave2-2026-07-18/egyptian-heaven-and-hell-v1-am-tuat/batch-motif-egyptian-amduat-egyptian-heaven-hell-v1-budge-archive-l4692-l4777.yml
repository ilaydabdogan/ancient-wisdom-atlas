  summary: The passage describes the Land of Sekri/Sekor as a sandy oval island in
    the river of the Tuat beneath a mound of earth. A legend identifies it as the
    hidden country of Sekri that guards a hidden body. The oval rests on two tail-to-tail
    man-headed lion sphinxes named Af, whose work is to keep ward over an image. Within
    the oval lies a multi-headed, winged monster serpent; Sekri appears as a hawk-headed
    man standing between the serpent’s wings, and the serpent lives on magical protection
    issuing from its mouth.
