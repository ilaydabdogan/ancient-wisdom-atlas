canonical_text:
  quote: ''
  summary: The passage introduces the Fourth Division of the Tuat, called Ankhet-Kheperu.
    During the Fourth Hour of the night the Sun-god enters a distinct region, where
    the route of the Boat of the Sun differs from previous divisions and passes over
    the kingdom of Seker. The usually traversed route of the dead is described as
    a diagonal corridor called Re-stau, with an open door called Mates-sma-ta and
    a road of secret things; the god does not pass through the door leaves, though
    they hear his voice.
