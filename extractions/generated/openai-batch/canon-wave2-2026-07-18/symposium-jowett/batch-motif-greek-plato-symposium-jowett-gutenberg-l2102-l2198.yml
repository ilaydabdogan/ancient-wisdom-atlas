canonical_text:
  quote: Love wants and has not beauty
  summary: Socrates argues with Agathon that desire seeks what it lacks, so Love lacks
    beauty and good. Socrates then recounts Diotima's teaching that Love is neither
    simply fair and good nor foul and evil, but lies in a mean; she also argues that
    Love cannot be a god if gods possess good and fair things while Love desires them.
  language: English
