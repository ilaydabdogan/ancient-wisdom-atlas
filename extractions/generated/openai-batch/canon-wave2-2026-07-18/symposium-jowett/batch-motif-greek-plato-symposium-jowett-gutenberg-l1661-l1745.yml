canonical_text:
  quote: ''
  summary: Aristophanes begins a speech praising Love by recounting an origin story
    of human nature. Primeval humans had three sex-types, round bodies, multiple limbs
    and faces, and cosmic parentage from sun, earth, and moon. Because they attacked
    the gods, Zeus chose not to destroy them but to cut them in two, after which Apollo
    reshaped and healed their bodies. The separated halves longed for one another,
    nearly perished from clinging together, and Zeus altered reproduction so the race
    could continue. Aristophanes explains present desire as a search for one's other
    half and an attempt to restore original unity.
  language: English
  quote_policy: summarized
