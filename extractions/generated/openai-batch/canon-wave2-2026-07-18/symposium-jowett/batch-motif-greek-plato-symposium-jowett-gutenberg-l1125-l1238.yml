canonical_text:
  quote: '"How I wish," said Socrates, "that wisdom could be infused by touch"'
  summary: At Agathon's banquet, Socrates lags behind in abstraction and stands in
    a neighboring portico before joining the meal. Agathon jokes that by touching
    Socrates he might benefit from the thought Socrates found there; Socrates replies
    with an image of wisdom flowing like water from a fuller to an emptier vessel.
    After supper, libations, hymn, and ceremonies, the guests agree to avoid compulsory
    heavy drinking, dismiss the flute-girl, and turn to conversation.
  language: English
  quote_policy: quoted
