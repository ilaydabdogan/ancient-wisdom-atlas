canonical_text:
  quote: ''
  summary: Diotima explains to Socrates that human beings desire immortality through
    fame, bodily offspring, and especially the soul’s offspring of wisdom, virtue,
    laws, poetry, and noble works. She then distinguishes lesser and greater mysteries
    of love and describes a staged progress from love of one beautiful body to contemplation
    of beauty in forms, souls, laws, sciences, and finally a revealed science of beauty
    everywhere.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Socrates says he was astonished and addresses Diotima as wise; Diotima answers
    with the authority of an accomplished sophist.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Diotima says people are moved by the love of immortal fame and are willing
    to risk, toil, spend money, and die to leave an eternal name.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Diotima names Alcestis, Achilles, and Codrus as examples of people whose acts
    are linked to the imagined immortality of virtuous memory.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Those pregnant in body seek women and beget children, hoping offspring will
    preserve memory and bring future blessedness and immortality.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Those pregnant in soul conceive wisdom and virtue; poets, artists, inventors,
    and those concerned with states and families are described as creators of such
    offspring.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The inspired person seeks beauty, embraces a fair and noble soul, speaks about
    virtue, educates, and brings forth what was previously conceived.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Diotima says such companions have a nearer tie and closer friendship than
    parents of mortal children because their common offspring are fairer and more
    immortal.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Homer, Hesiod, Lycurgus, Solon, and others are described as having left enduring
    children in the form of works, laws, and virtue.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Diotima calls the preceding teaching the lesser mysteries of love and introduces
    greater, more hidden mysteries as their crown.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The instructed lover begins in youth with beautiful forms, first loving one
    form, then recognizing beauty across all forms.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The lover next values beauty of mind above outward form, tends a virtuous
    soul, and brings to birth thoughts that may improve the young.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The lover then contemplates the beauty of laws, institutions, and sciences,
    and finally reaches a vision of a single science of beauty everywhere.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
