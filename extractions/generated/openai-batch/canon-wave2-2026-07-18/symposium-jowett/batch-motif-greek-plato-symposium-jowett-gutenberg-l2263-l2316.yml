canonical_text:
  quote: "“love ... may be described generally as the love of the everlasting possession
    of the good”"
  summary: Socrates asks Diotima what use Love has for human beings. Through questioning,
    Diotima moves from beauty to the good, argues that all people desire possession
    of the good and happiness, explains why only one part of love receives the name
    of the whole, compares this with poetry, rejects the claim that lovers seek simply
    their other half, and concludes that love is the desire for everlasting possession
    of the good.
  language: English
  quote_policy: quoted
