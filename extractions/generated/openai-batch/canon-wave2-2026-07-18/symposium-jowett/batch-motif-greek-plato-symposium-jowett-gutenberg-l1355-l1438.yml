canonical_text:
  quote: ''
  summary: Pausanias begins his speech by arguing that Love should not be praised
    indiscriminately. Because Aphrodite has two forms, heavenly and common, there
    are two corresponding Loves. He distinguishes common Love as bodily and undiscriminating,
    and heavenly Love as oriented toward intelligent and valiant young men, faithful
    companionship, and noble purpose. He then discusses civic customs around such
    attachments in several Greek regions and argues that strong bonds of love and
    friendship can be hostile to tyranny, citing Aristogeiton and Harmodius.
  language: English
  quote_policy: summarized
