canonical_text:
  quote: ''
  summary: A speech explains love as the desire of divided human beings to recover
    an original wholeness. It imagines Hephaestus offering to melt lovers into one
    being, says human wickedness caused divine dispersal, urges piety toward the gods
    and Love, and then shifts to dialogue among Eryximachus, Socrates, and Agathon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes a class of people who love youth, are not naturally
    inclined to marry or beget children, and prefer to live together unwedded.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When one person meets an actual other half, the pair is said to be amazed
    by love, friendship, and intimacy and unwilling to be out of one another's sight.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the pair cannot explain what they desire from one another;
    the soul has an obscure presentiment beyond ordinary lover's intercourse.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A hypothetical scene has Hephaestus arrive with instruments and ask the pair
    whether they want to become wholly one.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hephaestus hypothetically offers to melt the two into one, let them grow together,
    live one common life, and after death be one departed soul instead of two.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker states that human nature was originally one and whole, and that
    love is the desire and pursuit of the whole.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker says God dispersed humans because of human wickedness and warns
    that disobedience to the gods may bring further splitting.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The speaker exhorts people to piety, calls Love lord and minister, and says
    one who opposes Love is an enemy of the gods.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker broadens the argument to men and women everywhere and says that
    finding original true love and returning to primeval nature would make the race
    happy.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Love is praised as a benefactor who leads people back to their own nature
