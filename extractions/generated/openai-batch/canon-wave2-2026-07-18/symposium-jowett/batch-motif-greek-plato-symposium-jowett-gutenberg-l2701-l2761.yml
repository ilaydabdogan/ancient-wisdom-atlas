  summary: A speaker praises Socrates by comparing him to a flute-playing satyr and
    to a Silenus figure whose outward mask hides temperance and divine golden images.
    The speaker recounts attempts to draw Socrates into erotic intimacy and claims
    to have been painfully affected by philosophy like one bitten by a serpent. The
    speaker addresses fellow lovers of wisdom and asks profane listeners to close
    their ears.
