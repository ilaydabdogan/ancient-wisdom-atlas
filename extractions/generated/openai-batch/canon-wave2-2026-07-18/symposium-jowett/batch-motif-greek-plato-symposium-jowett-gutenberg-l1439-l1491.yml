  quote: whether such practices are honourable or whether they are dishonourable is
    not a simple question
  summary: 'The passage describes conflicting customs around lover and beloved in
    Athens: lovers are granted unusual social liberty, yet youths may be guarded and
    reproached. It distinguishes dishonourable bodily or self-interested love from
    honourable, lasting attachment grounded in noble disposition and virtue, and describes
    testing both lover and beloved through time, pursuit, flight, contests, and trials.'
  language: English
