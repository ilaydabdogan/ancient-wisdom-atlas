canonical_text:
  quote: ''
  summary: At a symposium, Socrates asks Agathon for protection from Alcibiades' jealous
    passion. Alcibiades refuses reconciliation for the moment, crowns Socrates with
    ribands, imposes drinking, and is then directed by Eryximachus to give a speech
    in praise of love or Socrates. Alcibiades agrees to praise Socrates truthfully,
    despite being drunk and unable to enumerate Socrates' singularities in orderly
    fashion.
  language: English
  quote_policy: summarized
