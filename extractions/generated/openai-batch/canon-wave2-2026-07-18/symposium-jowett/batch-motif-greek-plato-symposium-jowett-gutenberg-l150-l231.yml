canonical_text:
  quote: ''
  summary: Pausanias distinguishes heavenly and earthly love through two Aphrodites,
    treating noble love as directed toward intelligence, virtue, and lasting improvement,
    while vulgar love is bodily, unstable, or interested in power and wealth. Aristophanes’
    hiccough shifts the turn to Eryximachus, who extends the twofold love to bodies,
    arts, plants, animals, seasons, astronomy, and divination, describing good love
    as reconciliatory and just love as a source of happiness and friendship with gods
    and humans.
  language: English
  quote_policy: summarized
