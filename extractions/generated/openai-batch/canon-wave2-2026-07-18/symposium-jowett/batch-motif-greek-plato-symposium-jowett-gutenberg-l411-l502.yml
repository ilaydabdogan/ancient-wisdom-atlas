canonical_text:
  quote: ''
  summary: 'The passage first summarizes the close of the Symposium: after Alcibiades''
    speech, dispute, revelry, sleep, and dawn leave Socrates still awake with Aristophanes
    and Agathon, discussing tragedy and comedy before resuming daily activities. The
    introduction then comments on the Symposium''s layered, poetic, mythological,
    and philosophical character; describes Love as a force through nature, gender,
    plants, elemental affinities, and creation; presents love as a human and philosophical
    mystery capable of ascent toward beauty, goodness, truth, and abstraction; and
    reviews how the speeches in praise of Love prepare for Socrates while mixing jest
    and seriousness.'
  language: English
  quote_policy: summarized
