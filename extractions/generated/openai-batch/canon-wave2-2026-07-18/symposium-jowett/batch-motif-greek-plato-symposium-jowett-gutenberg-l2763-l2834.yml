canonical_text:
  quote: ''
  summary: Alcibiades recounts a night when, after the lamp was put out and the servants
    had left, he offered himself and his resources to Socrates in exchange for help
    in virtue. Socrates answered by questioning whether Alcibiades was mistaking apparent
    beauty for true beauty. Alcibiades lay beside Socrates through the night, but
    Socrates remained self-restrained. Alcibiades then praises Socrates' temperance,
    resistance to money and attraction, and exceptional endurance during the expedition
    to Potidaea, including hunger, drinking, and severe cold.
  language: English
  quote_policy: summarized
