canonical_text:
  quote: ''
  summary: Pausanias argues that yielding to a lover is honorable only when lover
    and beloved unite the customs of love, philosophy, and virtue so that both seek
    improvement. He contrasts this heavenly love with other loves associated with
    the common goddess, then the symposium order shifts when Aristophanes' hiccough
    causes him to exchange turns with Eryximachus, who offers medical advice.
  language: English
  quote_policy: summarized
