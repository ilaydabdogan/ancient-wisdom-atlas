canonical_text:
  quote: ''
  summary: The speaker describes Love as operating in seasons, elements, astronomy,
    sacrifice, and divination. Harmonious love among hot, cold, moist, and dry brings
    health and plenty, while disordered love brings pestilence, disease, frost, hail,
    and blight. Divination and sacrifice are described as mediating between gods and
    humans by preserving good love and curing evil love. The passage then shifts to
    Aristophanes, whose hiccough has been cured by sneezing, followed by playful exchange
    with Eryximachus.
  language: English
  quote_policy: summarized
