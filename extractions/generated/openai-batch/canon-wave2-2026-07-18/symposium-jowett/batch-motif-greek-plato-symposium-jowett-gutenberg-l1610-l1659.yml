  text: When hot and cold, moist and dry attain harmonious love and blend in temperance
    and harmony, they bring health and plenty to humans, animals, and plants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When wanton love gets the upper hand in the seasons, it is destructive and
    injurious, producing pestilence, diseases, hoar-frost, hail, and blight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Knowledge of these loves in relation to heavenly revolutions and the seasons
