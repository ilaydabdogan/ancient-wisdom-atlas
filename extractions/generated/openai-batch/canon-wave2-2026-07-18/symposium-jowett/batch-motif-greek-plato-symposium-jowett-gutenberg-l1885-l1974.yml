canonical_text:
  quote: ''
  summary: Agathon's encomium describes Love as a tender, beautiful, just, temperate,
    courageous, and wise god who dwells in soft hearts and souls, inspires poetry
    and arts, orders divine rule, brings peace and affection, and is praised at the
    banquet before Socrates and Eryximachus respond.
  language: English
  quote_policy: summarized
