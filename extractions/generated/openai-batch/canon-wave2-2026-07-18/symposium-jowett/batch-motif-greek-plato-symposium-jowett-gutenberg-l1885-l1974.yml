  text: Love is said to walk and dwell in the hearts and souls of gods and humans,
    departing from hardness and remaining where there is softness.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Love is described as tender, young, flexible, graceful, fair, and as inhabiting
    places of flowers and scents rather than fading or bloomless beauty.
