canonical_text:
  quote: Love is young and also tender
  summary: Socrates questions Agathon about shame before the wise and before the many.
    Phaedrus interrupts to preserve the plan of encomia to Love. Agathon begins his
    speech by saying that he will praise the god Love before naming his gifts, then
    characterizes Love as fairest, best, youngest, opposed to Age, not older than
    Iapetus and Kronos, not responsible for ancient divine violence, and tender like
    Homer’s description of Ate.
  language: English
  quote_policy: quoted
