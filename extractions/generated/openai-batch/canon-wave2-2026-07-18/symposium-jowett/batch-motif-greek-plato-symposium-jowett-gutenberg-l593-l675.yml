  summary: The passage summarizes and interprets several speeches in Plato's Symposium.
    It characterizes Phaedrus and Pausanias in relation to sophistic rhetoric; describes
    Pausanias' appeal to mythology and distinction between elder and younger love;
    presents Eryximachus as treating Love through medicine, physical law, and harmony;
    presents Aristophanes' comic account of divided human nature seeking reunion;
    and presents Agathon's poetic praise of youthful Love among Olympian gods as creator,
    artist, and lover of beauty.
