canonical_text:
  quote: ''
  summary: Eryximachus reports Phaedrus's complaint that Love has been neglected by
    poets and prose writers, and proposes that the company make speeches in praise
    of Love. Socrates and the company assent. The narrator notes incomplete recollection
    of the speeches. Phaedrus begins by presenting Love as a mighty and especially
    ancient god, citing Hesiod, Parmenides, and Acusilaus on Love's primordial status.
    He then argues that Love benefits humans by implanting honor, shame, and courage
    in lovers and beloveds, even imagining an army or city of such pairs as exceptionally
    brave and honorable.
  language: English
  quote_policy: summarized
