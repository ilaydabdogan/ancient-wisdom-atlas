  summary: The passage summarizes the movement from earlier speeches on Love to Socrates'
    dialogue with Diotima. It presents Diotima as teaching Socrates that Love is tied
    to want, philosophy, intellectual desire, and the ascent from earthly beauty to
    eternal beauty or truth. The commentary compares this pattern with Christian,
    medieval, Dantean, Neoplatonic, Eastern, and Platonic parallels, and describes
    symbolic images of ascent, summit, ladder, vision, and union.
