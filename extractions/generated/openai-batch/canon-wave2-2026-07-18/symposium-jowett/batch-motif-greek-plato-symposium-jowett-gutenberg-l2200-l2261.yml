canonical_text:
  quote: ''
  summary: Diotima explains to Socrates that Love is neither mortal nor immortal but
    an intermediate daimon who mediates between gods and humans. She narrates Love’s
    conception from Poros/Plenty and Penia/Poverty at Aphrodite’s birthday feast and
    describes Love as poor yet resourceful, neither wise nor ignorant, and therefore
    a philosopher or lover of wisdom.
  language: English
  quote_policy: summarized
