canonical_text:
  quote: ''
  summary: 'Diotima''s reported teaching describes an instructed lover''s ordered
    ascent from earthly beauties to the knowledge and contemplation of absolute, divine
    beauty. Socrates endorses this account and praises Love as the best helper toward
    this end. The scene then shifts to the symposium: Alcibiades arrives drunkenly
    with a flute-girl and attendants, wearing a garland and ribbons, intending to
    crown Agathon; after entering he crowns Agathon and suddenly notices Socrates
    beside him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person instructed in the things of love learns to see the beautiful in due
    order and, near the end, suddenly perceives a wondrous beauty.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The perceived beauty is described as everlasting, separate, simple, unchanged,
    and imparted to the growing and perishing beauties of other things.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The instructed person begins from earthly beauties and mounts upward, using
    them as steps from one to two, then to all fair forms, fair practices, fair notions,
    and finally the notion and essence of absolute beauty.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The life recommended is the contemplation of absolute beauty, contrasted with
    attachment to gold, garments, and fair boys and youths.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A person with eyes to see true divine beauty, beholding it with the eye of
    the mind, is said to bring forth and nourish true virtue and become the friend
    of God and immortal, if a mortal may.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Socrates says these were Diotima's words, says he is persuaded by them, and
    says he tries to persuade others that Love is the best helper in attaining this
    end.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After Socrates finishes, the company applauds, Aristophanes begins to respond,
    and a great knocking at the door is heard along with the sound of a flute-girl.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Agathon instructs attendants to admit the newcomers if they are friends, but
    otherwise to say that the drinking is over.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Alcibiades is heard in the court in a state of intoxication, calls for Agathon,
    and enters supported by the flute-girl and attendants, wearing a garland of ivy
    and violets and ribbons on his head.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Alcibiades says he has come to crown Agathon, whom he calls the fairest and
    wisest of men, and asks whether the company will drink with him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Alcibiades is led in, holds the ribbons before his eyes, fails at first to
    see Socrates, sits between Agathon and Socrates, embraces Agathon, and crowns
    him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When Alcibiades catches sight of Socrates, he starts up and says that Socrates
    is always lying in wait for him and appearing in unexpected places.
  category: speech
  evidence_refs:
  - ev:7
