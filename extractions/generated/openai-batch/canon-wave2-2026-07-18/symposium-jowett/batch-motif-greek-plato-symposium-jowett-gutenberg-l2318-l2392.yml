canonical_text:
  quote: The object which they have in view is birth in beauty, whether of body or
    soul.
  summary: Diotima teaches Socrates that love aims at generation and birth in beauty.
    She describes procreation as a divine element in mortal life, presents beauty
    as presiding over birth, and explains that mortal beings seek immortality through
    offspring, succession, and renewal. She extends this pattern to animals, bodies,
    souls, knowledge, and recollection.
  language: English
  quote_policy: quoted
