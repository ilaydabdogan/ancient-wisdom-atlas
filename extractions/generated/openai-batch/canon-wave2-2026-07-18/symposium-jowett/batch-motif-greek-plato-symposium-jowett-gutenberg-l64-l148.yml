canonical_text:
  quote: ''
  summary: The introduction characterizes Plato's Symposium as especially Greek and
    non-mystical, then summarizes the dialogue's framed report of speeches on love
    at Agathon's banquet. It describes Apollodorus transmitting Aristodemus' account,
    the banquet arrangements, Phaedrus' opening praise of love, and Phaedrus' mythic
    examples of Alcestis, Orpheus, and Achilles as judged or rewarded by the gods
    according to the quality of their love.
  language: English
  quote_policy: summarized
