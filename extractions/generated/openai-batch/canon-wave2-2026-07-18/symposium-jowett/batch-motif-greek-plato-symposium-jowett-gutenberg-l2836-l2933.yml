canonical_text:
  quote: ''
  summary: Alcibiades praises Socrates by recounting his prolonged fixed contemplation
    ending in prayer to the sun, his courage and rescue of Alcibiades in battle, and
    his calm conduct during retreat at Delium. Alcibiades then compares Socrates and
    his speech to Silenus and satyr figures whose comic exterior conceals divine wisdom.
    He warns Agathon that Socrates reverses the role of lover and beloved. Socrates
    replies that Alcibiades' praise is a Satyric or Silenic drama meant to set Socrates
    and Agathon at odds, after which the three dispute who will lie near whom on the
    couch.
  language: English
  quote_policy: summarized
