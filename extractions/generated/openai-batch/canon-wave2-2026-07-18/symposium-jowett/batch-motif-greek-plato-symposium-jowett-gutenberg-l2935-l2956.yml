canonical_text:
  quote: ''
  summary: A group of revellers interrupts the banquet, causing confusion and heavy
    drinking. Several participants leave or fall asleep. Near daybreak only Socrates,
    Aristophanes, and Agathon remain drinking from a shared goblet while Socrates
    argues that comedy and tragedy belong to the same artistic genius. Aristophanes
    and Agathon fall asleep; Socrates departs, bathes at the Lyceum, spends the day
    as usual, and later rests at home.
