  quote: ''
  summary: 'The passage opens the dialogue frame: Apollodorus is asked to recount
    speeches on love from Agathon''s supper, explains his sources and distance from
    the original event, then begins Aristodemus''s account of meeting Socrates on
    the way to Agathon''s banquet. Socrates invites Aristodemus to come unasked and
    supports the idea with a proverb and Homeric examples of banquet attendance.'
  language: English
  quote_policy: summarized
