canonical_text:
  quote: "“he who desires something is in want of something”"
  summary: Socrates responds to Agathon’s ornate praise of Love by rejecting praise
    that ignores truth. He asks to speak in his own manner and questions Agathon.
    Through agreed examples of relational terms and possession, Socrates argues that
    Love is of something, desires what it is of, and desire implies lack or a wish
    to preserve what one has into the future.
  language: English
  quote_policy: quoted
