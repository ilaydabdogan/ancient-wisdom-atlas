canonical_text:
  quote: ''
  summary: After the deluge, the gods gather over an offering. The queen of the gods
    vows to remember the event and excludes Enlil from the offering because he caused
    the flood. Enlil sees the vessel and is angry that mortals survived. Ninurta identifies
    Ea as the likely planner, and Ea rebukes Enlil for an indiscriminate flood, proposing
    more limited punishments. Ea says he gave a dream to the one called Abounding
    in Wisdom. Enlil then comes to the Ark, raises Uta-Napishtim and his wife, touches
    their foreheads, blesses them, and declares them equal to the gods, assigning
    them a distant dwelling at the mouth of the rivers.
  language: English
  quote_policy: summarized
