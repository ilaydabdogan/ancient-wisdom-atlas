  summary: Fragmentary lines describe an unnamed female subject whose shoulders are
    no longer veiled with a mantle. A following speech concerns Enkidu ascending out
    of the earth and states that he was not seized by Namtar, fever, Nergal, or mortal
    battle, but by the earth. The offspring of Nin-sun sorrowed for Enkidu. Editorial
    notes describe the poem as possibly a professional mourner’s lament and note textual
    uncertainty.
