canonical_text:
  quote: ''
  summary: Gilgamish leaves the Scorpion-man and takes the Road of the Sun through
    repeated periods of darkness until he reaches full sunlight and sees the Tree
    of the Gods. The tree is described as bearing ruby-like fruit, tendrils, azure
    growth, and desirable fruits. In a fragmentary Old Babylonian portion, Shamash
    takes pity on Gilgamish and tells him that he will not find the life he seeks.
    Gilgamish answers by contrasting death as sleep in the earth with his desire to
    see the sun and brightness.
  language: English
  quote_policy: summarized
