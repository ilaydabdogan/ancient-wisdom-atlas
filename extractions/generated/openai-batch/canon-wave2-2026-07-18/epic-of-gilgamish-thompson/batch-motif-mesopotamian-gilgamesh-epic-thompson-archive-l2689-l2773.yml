  summary: Tablet X is framed as the episode in which Gilgamish reaches Uta-Napishtim.
    In this passage Gilgamish, wearing pelts and marked by signs of long travel and
    grief, approaches Siduri the wine-maker. Siduri sees him from a distance, fears
    him, and bars her doors. Gilgamish addresses her through the barred threshold
    and threatens the portal. After a mutilated section, Siduri questions his wasted
    appearance and desert wandering, and Gilgamish begins to answer.
