canonical_text:
  quote: ''
  summary: Enkidu, formerly accustomed to the milk of wild animals and unfamiliar
    with bread and mead, is instructed by the woman to eat and drink human foods.
    After eating bread, drinking seven bumpers of mead, rubbing himself, anointing
    his body hair with oil, and donning a garment, the text says he becomes human.
    He then takes a weapon and protects shepherds by hunting lions and catching jackals.
    Later he sees a fellow, asks the woman to bring him, and hears that Gilgamish
    calls him to the House of Community.
  language: English
  quote_policy: summarized
