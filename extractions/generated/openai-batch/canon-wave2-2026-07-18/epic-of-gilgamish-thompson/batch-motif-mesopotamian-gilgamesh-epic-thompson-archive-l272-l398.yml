canonical_text:
  quote: ''
  summary: The fragmentary opening of Tablet I praises Gilgamish as a possessor and
    transmitter of wisdom, a distant traveler, recorder on stone, and builder of Erech
    and E-Anna. It then describes complaints against his tyranny in Erech. The gods
    hear the wailing, Anu summons Aruru, and Aruru creates Enkidu from clay in the
    desert as a counterpart who will contend with Gilgamish and bring relief to Erech.
  language: English
