canonical_text:
  quote: ''
  summary: The passage recounts how the hunter reports Enkidu to Gilgamish as a powerful
    mountain-dwelling figure who lives with cattle and disrupts hunting traps. Gilgamish
    instructs the hunter to take a courtesan to the watering place, where she is to
    reveal her beauty so that Enkidu will embrace her and his animal companions will
    reject him. The hunter and courtesan travel for three days and wait by the drinking
    place until the cattle arrive. An editorial note associates the episode with a
    belief in loss of innocence.
