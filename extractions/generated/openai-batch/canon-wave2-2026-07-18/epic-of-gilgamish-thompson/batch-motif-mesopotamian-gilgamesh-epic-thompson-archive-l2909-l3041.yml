canonical_text:
  quote: ''
  summary: In this fragmentary passage Gilgamish meets Ur-Shanabi, states that he
    has come from Erech after traversing the Mountains, and asks for the way to far
    Uta-Napishtim. Ur-Shanabi says Gilgamish has hindered the sea crossing by destroying
    the vessel’s sails or tackle, then instructs him to cut long poles fitted with
    bitumen and sockets. Gilgamish makes the poles, boards the vessel with Ur-Shanabi,
    and reaches the Waters of Death, where he is told not to let the waters touch
    his hand. Uta-Napishtim sees the approaching vessel and wonders at its damaged
    sails and unfamiliar rider.
  language: English
  quote_policy: summarized
