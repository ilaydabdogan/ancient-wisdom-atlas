canonical_text:
  quote: ''
  summary: Enkidu lives among animals at a watering place. A courtesan is directed
    to seduce him; after six days and seven nights with her, the animals flee him,
    his former speed fails, and his wisdom broadens. The woman invites him to high-walled
    Erech and the temple of Anu and Ishtar, where Gilgamish is preeminent. Enkidu
    accepts, desiring a companion and intending to challenge Gilgamish. The woman
    describes Erech’s revels and Gilgamish’s strength and divine favor. Gilgamish
    has already dreamed of Enkidu as a powerful heavenly object that falls upon him
    while the people of Erech gather around.
  language: English
  quote_policy: summarized
