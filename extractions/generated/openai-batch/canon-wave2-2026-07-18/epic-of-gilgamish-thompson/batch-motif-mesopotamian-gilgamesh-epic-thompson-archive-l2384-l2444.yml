canonical_text:
  quote: ''
  summary: 'A fragmentary dream or vision attributed by the editorial note to Enkidu
    presents an underworld scene: the speaker is seized and led to the Dwelling of
    Darkness, a no-return house whose inhabitants lack daylight, eat dust and mud,
    and wear feather-like garments. The fragment names underworld figures and personnel,
    including Ereshkigal and Belit-seri, before breaking off. The next tablet heading
    and editorial summary introduce Gilgamish mourning Enkidu and recalling their
    exploits.'
  language: English
  quote_policy: summarized
