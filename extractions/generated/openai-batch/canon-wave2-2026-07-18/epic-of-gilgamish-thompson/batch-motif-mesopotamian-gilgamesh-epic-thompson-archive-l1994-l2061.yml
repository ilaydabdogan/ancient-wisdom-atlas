canonical_text:
  quote: ''
  summary: Gilgamish recounts how Ishullanu refused Ishtar and was punished by being
    made a spider-like creature. Gilgamish says Ishtar would treat him similarly.
    Ishtar, angered, goes to Heaven to complain to Anu and Antu that Gilgamish insults
    her. Anu replies that Ishtar provoked the accusation by asking Gilgamish for sexual
    favor. Ishtar asks Anu to make a Heavenly Bull to defeat Gilgamish; Anu warns
    that the Bull’s onslaught would bring seven years of scarcity and asks about provisions
    for humans and cattle. Editorial notes compare a fragmentary threat to the Descent
    of Ishtar and mention a Boghaz Keui fragment of the Bull episode.
  language: English
  quote_policy: summarized
