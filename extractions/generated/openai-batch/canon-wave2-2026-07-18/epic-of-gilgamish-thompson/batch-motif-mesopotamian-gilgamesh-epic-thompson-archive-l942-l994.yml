canonical_text:
  quote: ''
  summary: Enkidu grieves over the loss or farewell of his beloved, and he and Gilgamish
    clasp hands like brothers. Gilgamish declares his intent to go to the Forest of
    Cedars, where Humbaba is named, and to cut cedar. Enkidu warns that he has approached
    the forest before and describes Humbaba as a terrifying opponent with whirlwind-like
    roar, fire in his jaws, and deathly breath. Gilgamish answers that he goes for
    the rich yield of the mountains; mutilated lines are said to mention a divine
    dwelling and an axe.
  language: English
  quote_policy: summarized
