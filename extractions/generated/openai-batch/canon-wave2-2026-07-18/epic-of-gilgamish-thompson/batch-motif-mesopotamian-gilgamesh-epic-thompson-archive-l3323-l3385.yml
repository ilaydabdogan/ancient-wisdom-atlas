canonical_text:
  quote: ''
  summary: After six days and seven nights of hurricane, deluge, and tempest, the
    storm ceases on the seventh day. The narrator opens a hatchway, weeps, sees land,
    and the ark grounds on the Mountain of Nisir. After days on the mountain, the
    narrator releases a dove, a swallow, and a raven; the first two return, while
    the raven does not. The narrator frees the beasts, sacrifices, pours a libation,
    and devotes offerings on the mountain peak.
