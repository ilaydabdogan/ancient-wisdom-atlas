candidate_motifs:
- id: motif:1
  label: Combat with and slaying of a heavenly bull
  taxonomy_refs: []
  basis: The passage presents a fight with the Heavenly Bull in Erech, its destruction
    of attacking men, Enkidu's seizure of it, and the later statement that Gilgamish
    and Enkidu killed the Bull of the Heavens.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The actual killing occurs in a gap summarized by the editor, so details
    of the slaying are fragmentary.
- id: motif:2
  label: Sacrifice of a slain heavenly animal to a god
  taxonomy_refs:
  - sacrifice
  basis: After the Bull is killed, its heart is removed and offered in sacrifice to
    the Sun-god, with libation.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: Only the heart offering and libation are visible in this passage; broader
    ritual context is not supplied.
- id: motif:3
  label: Votive trophy dedication after victory
  taxonomy_refs: []
  basis: Gilgamish displays the Bull's horns to craftsmen, devotes unguent to Lugal-banda,
    and hangs the horns in the shrine of his forebears.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage describes dedication and display but does not explain its
    theological meaning.
- id: motif:4
  label: Ritual lament over a slain divine beast's body part
  taxonomy_refs: []
  basis: Ishtar laments the Bull's killing and assembles women to lament over the
    torn-out member of the Bull.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: medium
  cautions: The lament is clear, but the status of the Bull as a divine or heavenly
    being is inferred from its name and context, not explicitly explained here.
- id: motif:5
  label: Heroic public triumph and acclaim after combat
  taxonomy_refs:
  - culture_hero
  basis: After the Bull's death and dedication of the horns, Gilgamish and Enkidu
    wash, process through Erech, are seen by the heroes of Erech, and are praised
    as foremost hero and giant.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The culture-hero taxonomy fit is tentative; the passage gives public heroic
    acclaim, not an explicit culture-founding act.
- id: motif:6
  label: Ominous dream of a divine council
  taxonomy_refs:
  - divine_judgment
  basis: Enkidu sees a vision and asks why the great gods are taking counsel together;
    a supplied note connects the damaged dream scene with named deities.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: medium
  cautions: The column is damaged and the outcome of the divine counsel is outside
    or only implied by the fragment; the divine-judgment taxonomy is therefore cautious.
- id: motif:7
  label: River washing after violent action
  taxonomy_refs: []
  basis: After the Bull's death and dedication sequence, Gilgamish and Enkidu wash
    their hands in the River Euphrates before moving through Erech.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The act is literal washing; purification as an interpretation is not stated
    in the passage.
