canonical_text:
  quote: ''
  summary: A fragmentary passage describes Ishtar speaking to Anu about grain and
    fodder, the Heavenly Bull's fight in Erech, Enkidu and Gilgamish killing the Bull,
    offering its heart to the Sun-god, Ishtar's lament and Enkidu's insult, Gilgamish's
    public triumph and dedication of the Bull's horns to Lugal-banda, and the beginning
    of Enkidu's dream of the great gods taking counsel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ishtar answers Anu, identified as her father, and speaks about hoarded or
    gathered corn for mankind and fodder for cattle; the fragment also mentions seven
    years of husks after an onslaught.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A fight with the Heavenly Bull is about to take place in Erech; successive
    groups of men descend upon the Bull and are annihilated by its fiery breath, according
    to the editorial summary of mutilated lines.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Enkidu girds himself, leaps, and seizes the Heavenly Bull by the horns; later
    fragments also have him chasing the Bull and seizing it by the tail.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the Bull of the Heavens is killed, its heart is removed, offered in
    sacrifice to the Sun-god, and accompanied by a libation; the two brothers then
    sit down.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ishtar mounts the ramparts and rooftop of high-walled Erech and laments that
    Gilgamish killed the Bull of the Heavens.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Enkidu hears Ishtar's shrieking, tears a member from the Bull, tosses it before
    her, and speaks a threat against her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ishtar assembles girl-devotees, hetaerae, and harlots, and leads lamenting
    over the torn-out member from the Bull.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Gilgamish calls masters of craft, artists, and guilds to admire the size of
    the Bull's horns; the horns are described with azure settings and as holding measures
    of oil.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Gilgamish devotes unguent to his god Lugal-banda and hangs the Bull's horns
    in the shrine of his forebears.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Gilgamish and Enkidu wash their hands in the River Euphrates, proceed along
    the highway of Erech, and are seen by the assembled heroes of Erech.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Gilgamish addresses a riddle-like declaration to the notables, naming himself
    as the most splendid of heroes and Enkidu as the most famous of giants.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Gilgamish holds high revel in his palace; while the heroes sleep, Enkidu sleeps,
    sees a vision, and comes to reveal his dream to Gilgamish.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: At the beginning of the Seventh Tablet, Enkidu asks why the great gods are
    taking counsel together.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: Gilgamish and Enkidu are called the two brothers after the sacrifice, and
    Enkidu later addresses Gilgamish as his friend and comrade.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:11
  - ev:12
- id: obs:15
  text: A supplied Hittite-version note says the lost column can be partially supplemented
    with Enkidu telling Gilgamish of a night dream involving Enlil, Ea, and the Sun-god
    of heaven, though the text remains fragmentary.
  category: other
  evidence_refs:
  - ev:13
