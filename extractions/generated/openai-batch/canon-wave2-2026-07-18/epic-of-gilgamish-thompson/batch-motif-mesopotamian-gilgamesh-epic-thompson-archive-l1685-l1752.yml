canonical_text:
  quote: ''
  summary: Gilgamish sleeps after a frightening dream involving a mountain and wind,
    wakes at midnight afraid, questions Enkidu, and recounts a third awesome dream
    of roaring sky and earth, darkness, lightning, flames, pestilence, death, and
    ashes. He proposes going down to the desert to counsel together, and Enkidu begins
    to interpret before the column breaks. A source note gives a fragmentary Boghaz
    Keui variant in which a night halt, frightened waking, mountain ordeal, beautiful
    man, and water-giving helper appear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dream includes a mountain that breathes on Gilgamish, followed by a chill
    wind-blast and gust that make him cower and sway.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gilgamish bends his knees, supports his haunches, falls asleep, and wakes
    suddenly at midnight.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gilgamish asks his friend whether he called or touched him, why he is fearful,
    whether a spirit has passed, and why his flesh quivers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gilgamish tells his comrade that he has beheld a third awesome dream.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The third dream contains roaring firmament, resounding earth, darkened day,
    lightning, flames, Pestilence, Death, fading glare, fading fires, and brands turned
    to ashes.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Gilgamish proposes that he and his comrade go down to the desert to counsel
    together.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Enkidu begins to interpret Gilgamish's dream, after which the remainder of
    the column is broken away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The cited variant says the heroes halt for the night, the hero wakes at midnight
    after sleep departs, and he tells his dream to Enkidu after asking why he is frightened.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the variant dream, a mountain casts the hero down and seizes his feet;
    brilliance increases; a very beautiful man draws him beneath the mountain, gives
    him water to drink, assuages his desire, and sets his feet on earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A parenthetical source note calls the dream a volcano dream and says it probably
    represents Humbaba.
  category: other
  evidence_refs:
