canonical_text:
  quote: ''
  summary: 'Uta-Napishtim tells Gilgamish the hidden divine story of Shurippak: the
    gods planned a deluge, Ea secretly warned him to build a vessel and preserve life,
    he constructed and loaded the ship with possessions, kin, animals, and living
    seed, entered at the appointed storm hour, and the divine storm devastated the
    land while the gods became afraid and Ishtar lamented the destruction.'
  language: English
  quote_policy: summarized
