canonical_text:
  quote: ''
  summary: Ur-Shanabi leads Gilgamish to bathe, wash away stains, discard pelts, renew
    his fillet, and put on a mantle whose freshness will not show age before his return.
    Gilgamish and Ur-Shanabi embark in a vessel. Uta-Napishtim’s wife asks what gift
    Gilgamish will receive for his return. Uta-Napishtim reveals a hidden thorn-like
    plant rooted deep in the ocean that can bring everlasting life if reached. Gilgamish
    binds heavy stones to his feet, descends to the sea-deeps, finds the plant, and
    is scratched by its prickles.
  language: English
