canonical_text:
  quote: ''
  summary: Gilgamish and Enkidu grapple violently until Gilgamish's fury abates. Enkidu
    addresses Gilgamish, naming Nin-sun as his mother and saying Enlil gave him kingship.
    The passage then introduces the Third Tablet and the expedition to the Cedar Forest
    against Humbaba, with editorial notes that Gilgamish and Enkidu have become devoted
    friends. A fragmentary fight account describes Enkidu as unequalled, unkempt,
    and born in the desert.
