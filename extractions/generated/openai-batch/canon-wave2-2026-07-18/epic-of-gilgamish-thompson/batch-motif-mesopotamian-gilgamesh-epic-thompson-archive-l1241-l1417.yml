canonical_text:
  quote: ''
  summary: In a fragmentary section of the Gilgamish epic, ritual water instructions
    are given before Gilgamish and Enkidu set out toward Humbaba. Enkidu encourages
    Gilgamish, an unnamed man directs the way, and the Elders advise Gilgamish not
    to rely only on his own strength but to let Enkidu go before him because Enkidu
    knows the road to the Cedar Forest and can guard a companion. Gilgamish and Enkidu
    go to Ninsun, who is described as wise and all-knowing, so that she may prescribe
    a pathway. Gilgamish tells Ninsun that he is undertaking a distant journey to
    Humbaba, involving an unknown road and unknown warfare, until he reaches the Cedar
    Forest and overthrows Humbaba. Ninsun dresses in festal attire, ascends to the
    roof, offers incense and sacrifice to Shamash, and prays about the restlessness
    given to her son, asking for divine remembrance during the journey. Later columns
    are badly mutilated and editorially note related fragments about Humbaba, the
    Anunnaki, the journey, incense, and a repetition of the Elders' counsel.
  language: English
  quote_policy: summarized
