canonical_text:
  quote: ''
  summary: 'Gilgamish plans to bring a wondrous rejuvenating plant to Erech, but while
    he bathes in a pool a serpent smells and snatches the plant. Gilgamish laments
    the loss to Ur-Shanabi, returns to high-walled Erech, and calls attention to its
    ramparts and brickwork. The following tablet turns to the dead: instructions describe
    mourning restrictions that prevent ghosts from gathering, and Gilgamish deliberately
    violates them in an attempt, identified by the heading and note, to bring back
    Enkidu or summon the dead.'
  language: English
  quote_policy: summarized
