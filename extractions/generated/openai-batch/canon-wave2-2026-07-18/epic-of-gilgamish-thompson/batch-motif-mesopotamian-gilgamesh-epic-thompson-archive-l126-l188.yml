- id: claim:1
  claim: The passage itself identifies Uta-Napishtim parenthetically with Noah and
    assigns him the function of Flood survivor who was saved and granted eternal life.
  claim_level: same_function
  target: Noah / flood-survivor figure
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The identification is made in the preface as a parenthetical equivalence;
    the passage does not provide a detailed comparison of the two flood narratives.
- id: claim:2
  claim: The preface links the Epic and its Deluge material to a Sumerian Deluge text
    and suggests Sumerian origin for the tradition.
  claim_level: common_inheritance
  target: Sumerian Deluge tradition
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an editorial source-history statement in the preface, not an
    internal mythic comparison developed by the narrative.
