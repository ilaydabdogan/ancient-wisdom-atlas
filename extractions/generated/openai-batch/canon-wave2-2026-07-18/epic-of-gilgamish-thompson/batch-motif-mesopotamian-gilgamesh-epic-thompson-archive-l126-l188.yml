canonical_text:
  quote: ''
  summary: 'The preface describes the textual transmission and antiquity of the Epic
    of Gilgamish, then summarizes the narrative: Gilgamish, king of Erech, oppresses
    the city; Enkidu is created, becomes his friend, and joins him in the cedar-forest
    expedition; Ishtar''s rejected proposal leads to the divine bull and Enkidu''s
    death; Gilgamish seeks eternal life, hears of the Flood from Uta-Napishtim, gains
    and loses a rejuvenating plant to a snake, and finally summons Enkidu from the
    Underworld.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The preface presents the Epic as a cuneiform work on Assyrian and Babylonian
    clay tablets and mentions a Sumerian Deluge fragment and later editions in several
    languages and places.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The seventh-century edition is described as divided into twelve tablets, each
    containing about three hundred metrical lines.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Legend of Gilgamish is described as a composite story around Gilgamish,
    an early king of Erech whose mother was Nin-sun.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The inhabitants of Erech appeal to the gods for relief from Gilgamish's tyranny,
    and Enkidu is created to aid them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Enkidu is enticed into the city by a dancing girl of the Temple of Ishtar;
    after a fight, Gilgamish and Enkidu become firm friends.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Gilgamish and Enkidu travel to the Forest of Cedars, encounter the guardian
    Humbaba, receive aid from winds sent by the Sun-god, and cut off Humbaba's head.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ishtar falls in love with Gilgamish, he rejects her proposal, and she asks
    Anu to make a divine bull; Enkidu overcomes the bull, and the gods decree that
    Enkidu must die.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After Enkidu's death, Gilgamish fears a similar extinction and searches for
    eternal life, meeting Siduri, Ur-Shanabi, and Uta-Napishtim.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Uta-Napishtim tells Gilgamish the story of the Flood and how the gods gave
    him, as the one saved man, eternal life; Gilgamish is characterized as too human
    and overcome by sleep.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Gilgamish obtains a youth-renewing plant from the bottom of the sea by diving
    with stones tied to his feet, but a snake snatches it while he washes at a pool.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Gilgamish attempts to summon Enkidu from Hades by transgressing mourning taboos;
    Enkidu comes forth at the bidding of the God of the Underworld and describes the
    fate of the dead.
  category: sequence
  evidence_refs:
  - ev:9
