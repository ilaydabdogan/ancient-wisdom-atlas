canonical_text:
  quote: ''
  summary: Gilgamish speaks of Enkidu’s death, his mourning, and his fear that he
    too will become like dust. An inserted Old Babylonian version repeats the complaint.
    The Wine-maker answers that the gods allotted death to mortals and retained life,
    and counsels ordinary human joys. Gilgamish then asks the way to Uta-Napishtim
    and declares willingness to cross the Ocean. The Wine-maker warns that the Ocean
    and Waters of Death are impassable except for Shamash, but names Ur-Shanabi, boatman
    to Uta-Napishtim, as a possible aid.
  language: English
  quote_policy: summarized
