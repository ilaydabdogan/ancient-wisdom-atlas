canonical_text:
  quote: ''
  summary: Gilgamish and Enkidu view the cedar forest, Humbaba's path, and the Mount
    of the Cedar, described as the home of the Immortals and shrine of Irnini. Gilgamish
    recounts a dream of standing with his comrade on a mountain peak that topples.
    Enkidu interprets the dream as an omen that Humbaba will be captured and cast
    down. The travelers then break their fast, rest, hollow a pit, and Gilgamish pours
    out meal for the mountain while asking it to grant a dream.
