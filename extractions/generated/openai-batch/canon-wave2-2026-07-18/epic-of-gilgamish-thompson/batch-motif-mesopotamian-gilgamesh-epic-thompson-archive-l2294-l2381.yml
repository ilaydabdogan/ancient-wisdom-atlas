canonical_text:
  quote: ''
  summary: Shamash speaks to Enkidu, reminding him that the Hetaera brought him bread,
    wine, clothing, and Gilgamish as companion, and that Gilgamish will honor him
    after death. Enkidu’s anger is appeased; he then regrets his curse and blesses
    the Hetaera. Near death, Enkidu sleeps alone and tells Gilgamish of a night dream
    in which the heavens and earth resound and a dark-faced man with lion-like claws
    overcomes him.
  language: English
  quote_policy: summarized
