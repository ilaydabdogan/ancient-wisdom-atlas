canonical_text:
  quote: ''
  summary: 'In an address to Ishtar, the speaker compares her to treacherous or damaging
    objects and asks which husband or lord she ever loved faithfully. He then lists
    former beloveds or consorts: Tammuz, a Roller bird, a lion, a stallion, a shepherd
    or neatherd, and Ishullanu the gardener. The list associates them with wailing,
    injury, entrapment, exhausting control, transformation into a jackal, rejection
    by attendants and dogs, or erotic pursuit. A note links Tammuz with annual wailing,
    vegetation death, Ishtar''s descent to the Underworld, and spring return.'
  language: English
  quote_policy: summarized
