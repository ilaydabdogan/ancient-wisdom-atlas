canonical_text:
  quote: ''
  summary: Gilgamish prays to Shamash for protection and safe return to Erech, weeps
    over an unknown road, arms himself, and with Enkidu offers gifts to the Sun-god
    before departure. The Elders bless him, counsel that Enkidu go ahead as pathfinder,
    describe Humbaba's sway over the Forest passes, and invoke divine help from the
    Sun-god and Lugal-banda for the journey and the overthrow of Humbaba.
  language: English
  quote_policy: summarized
