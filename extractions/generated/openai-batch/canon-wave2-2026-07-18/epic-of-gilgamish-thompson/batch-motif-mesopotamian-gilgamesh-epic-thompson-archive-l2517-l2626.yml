canonical_text:
  quote: ''
  summary: 'Fragmentary passage moving from a speech promising Gilgamish underworld
    honors and public mourning, through possible ritual or funerary preparations,
    to the Ninth Tablet: Gilgamish mourns Enkidu, fears death, resolves to seek Uta-Napishtim,
    faces dangers in desert darkness, reaches the cosmic Mountains of Mashu guarded
    by scorpion-men, and is warned about the unprecedented Road of the Sun through
    darkness.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unidentified speaker addresses Gilgamish and promises him a handsome couch,
    a large throne at the speaker's left hand, and homage from the princes of Hades.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same speaker says the people of Erech will lament for Gilgamish, that
    damsels and heroes will be constrained to his service, and that the speaker will
    stain the body, put on a lion skin, and range over the desert for his sake.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In a fragmentary later column, Gilgamish hears something, forms a concept
    of slaying, and prepares wooden and precious bowls filled with honey and cream
    while Shamash is mentioned as instructing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gilgamish weeps bitterly for his comrade Enkidu and says fear of death has
    entered his heart.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gilgamish says he will travel quickly on the road to Uta-Napishtim, who is
    identified as offspring of Ubara-Tutu.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Gilgamish anticipates arriving in darkness at the Gates of the Mountains,
    meeting lions, and praying to the Moon-god or gods for deliverance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A fragmentary dream or vision describes Gilgamish seeing beings rejoicing
    in life and attacking among them with axe and sword-like weapon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Mountains of Mashu are described as watching the Sun-god's rising and
    setting; their summits reach the zenith of heaven and their lower parts reach
    down to Hell.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Scorpion-men stand sentry at the portals of Mashu as wardens of Shamash, with
    terrifying presence and a death-dealing glance.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: When Gilgamish sees the scorpion-men, his face pales from alarm and dismay,
    and he grovels senseless before them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Scorpion-man tells his wife that the newcomer has flesh of the gods; his
    wife answers that Gilgamish is two parts god-like and one third human.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The broken continuation reports that the Scorpion-man questions Gilgamish
    about his long journey, warns that the crossing has never been made, and describes
    the Road of the Sun as a twenty-four-hour journey beginning in deep darkness;
    Gilgamish accepts the trial.
  category: sequence
  evidence_refs:
  - ev:9
