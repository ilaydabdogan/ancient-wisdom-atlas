canonical_text:
  quote: ''
  summary: 'Craftsmen prepare exceptionally heavy weapons for Gilgamish and Enkidu.
    Gilgamish consults the Elders of broad-marketed Erech and announces that he will
    go against Humbaba in the Forest of Cedars, fell the cedars, and gain lasting
    fame. The Elders warn that Gilgamish is young and does not understand the danger:
    Humbaba is fearsome, with a whirlwind roar, flame in his jaws, and deathly breath.
    Gilgamish listens, ponders, says he fears Humbaba, and nevertheless resolves to
    go into the forest depths; an editorial note says missing lines contained the
    Elders’ farewell blessing.'
  language: English
  quote_policy: summarized
