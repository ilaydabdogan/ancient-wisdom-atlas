canonical_text:
  quote: ''
  summary: An unnamed petitioner seeks help from Enlil, the Moon-god, and Ea to raise
    Enkidu from the earth. Enlil and the Moon-god give no answer; Ea instructs Nergal
    to open a hole in the earth. Enkidu's spirit rises, embraces and mourns with his
    brother/friend, and is asked to report what he has seen of the laws of the Underworld.
    The report describes decay and several conditions of the dead, including a rested
    dead person, a warrior mourned by family, a corpse in the desert, and an untended
    ghost.
  language: English
  quote_policy: summarized
