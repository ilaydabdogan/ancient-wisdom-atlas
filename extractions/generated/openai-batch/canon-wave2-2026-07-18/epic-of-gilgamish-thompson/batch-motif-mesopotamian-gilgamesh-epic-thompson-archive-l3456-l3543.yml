canonical_text:
  quote: "“Come, fall not asleep for six days, aye, a se'nnight!”"
  summary: The passage presents Gilgamish seeking life from Uta-Napishtim. Uta-Napishtim
    challenges him not to sleep for six days and seven nights, but Gilgamish falls
    asleep. Uta-Napishtim has his wife prepare flour or bread and mark the duration
    of his sleep on the wall; on the seventh count he touches Gilgamish awake. Gilgamish
    then laments that Death is present in his chamber and wherever he listens, and
    Uta-Napishtim addresses the boatman Ur-Shanabi.
  language: English
  quote_policy: quoted
