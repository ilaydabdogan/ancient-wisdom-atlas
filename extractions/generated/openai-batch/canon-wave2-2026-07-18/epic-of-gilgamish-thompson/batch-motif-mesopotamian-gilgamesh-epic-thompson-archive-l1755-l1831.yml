canonical_text:
  quote: ''
  summary: A heavily fragmentary section introduces the fight with Humbaba. Gilgamish
    prays to the Sun-god in heaven after starting on a road. The Sun-god hears and
    raises multiple winds against Humbaba, preventing him from moving. Humbaba surrenders
    and offers to serve Gilgamish, but Enkidu advises Gilgamish not to accept the
    plea. The preserved outcome states that Humbaba's head is cut off. Editorial notes
    say the fight passage is reconstructed from a Hittite version because major columns
    are lost, while the Assyrian version is also badly mutilated at the end.
  language: English
  quote_policy: summarized
