canonical_text:
  quote: ''
  summary: 'Gilgamish recounts dreams to his all-wise mother, who interprets a heavenly/fallen
    sign and an axe as a powerful loyal friend and equal. The passage then shifts
    to Enkidu with the courtesan: after their sexual union, she urges him to leave
    the beasts and desert for Erech and the temple of Anu, where Gilgamish lives;
    she clothes him and leads him toward shepherds.'
  language: English
  quote_policy: summarized
