candidate_motifs:
- id: motif:1
  label: Hidden saint and concealed miraculous power
  taxonomy_refs: []
  basis: The passage explicitly states that prophets and saints hide miraculous powers;
    Jelāl’s powers are described as hidden, and Shems later conceals his identity
    until suspected of being a saint in disguise.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: high
  cautions: The passage asserts saintly hiddenness, but details of specific miraculous
    powers are limited.
- id: motif:2
  label: Ascetic seclusion of spiritual companions
  taxonomy_refs:
  - mystical_quest
  basis: Jelāl and Shems withdraw together into a college room for six months without
    food, drink, ordinary entry, or exit.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not describe inner experiences during the seclusion.
- id: motif:3
  label: Miraculous transmission of learning
  taxonomy_refs:
  - wisdom
  basis: Shems teaches a supposedly nearly unteachable prince’s son to recite the
    entire Qur’ān by heart and gain other accomplishments within one month.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The word miraculous is not used in this episode, but the achievement is
    presented as extraordinary and leads to suspicion that Shems is a saint.
- id: motif:4
  label: Summoning and return of the absent spiritual companion
  taxonomy_refs:
  - return
  - mystical_quest
  basis: Jelāl sends Sultan Veled to Damascus to bring Shems back, accurately names
    the place and circumstances where Shems will be found, and Shems returns to Qonya.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The absent figure is a human spiritual companion; the passage does not
    frame him as a divine beloved in this scene.
- id: motif:5
  label: Martyr’s hidden body revealed through dream
  taxonomy_refs: []
  basis: After Shems is killed and his corpse thrown into a well, Sultan Veled dreams
    of Shems, learns where the body is, and recovers and buries it.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage reports the dream revelation but does not elaborate on afterlife
    geography or resurrection.
- id: motif:6
  label: Ritual dance disrupted by offense and violence
  taxonomy_refs: []
  basis: A religious music and dance gathering becomes the setting for collisions
    involving Shems, Jelāl’s indignation, the arrival of police, and Shems’s execution.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The causality between the dance offense and execution is narrated in sequence
    but not explained through legal or political motives.
- id: motif:7
  label: External search ending in inward discovery
  taxonomy_refs:
  - mystical_quest
  basis: Jelāl travels to Damascus to seek Shems, fails to find him in the flesh,
    but is said to find within himself something still greater.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The inward discovery is stated briefly; any doctrine of union or annihilation
    would require evidence outside this passage.
- id: motif:8
  label: Disappearing body and variant burial tradition
  taxonomy_refs: []
  basis: After an account of private burial in the college grounds, the passage adds
    that Shems’s body disappeared and that he was buried beside Jelāl’s father.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: uncertain
  cautions: The passage gives potentially conflicting traditions about the body and
    burial location.
