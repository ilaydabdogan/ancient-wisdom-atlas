canonical_text:
  quote: ''
  summary: 'The passage presents a sequence of anecdotes about Jelāl, Shemsu-’d-Dīn,
    Sultan Veled, and others: hidden saintly powers, Kimiyā Khātūn’s illness and death,
    a six-month seclusion, Shems’s harsh preaching and miraculous instruction, Shems’s
    return from Damascus, his seizure and execution after a dance gathering, the dream-guided
    recovery of his body from a well, and Jelāl’s later search for Shems in Damascus
    and inward finding.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator states that prophets and saints have hidden their miraculous
    powers from ordinary view, and that Jelāl’s powers remained hidden through his
    secret pursuit of mystic love.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kimiyā Khātūn, wife of Shemsu-’d-Dīn, went with the grandmother of Sultan
    Veled and attendant ladies to city vineyards without Shems’s permission or knowledge;
    after Shems became annoyed at her absence, she returned, became stiff and motionless,
    screamed and moaned for three days, and died.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shems and Jelāl shut themselves in Jelāl’s college room for six months without
    eating or drinking, with no one entering or either coming out except Sultan Veled
    and one other disciple.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Shems addressed learned audiences in Qonya harshly, likening them to oxen
    and asses and reproaching them as far from the path of living love.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Erzen-of-Rome, Shems concealed who he was, opened a children’s school,
    and undertook to teach the prince’s son to recite the whole Qur’ān by heart in
    one month.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The prince’s son learned to recite the Qur’ān by heart and gained handwriting
    and other accomplishments within the promised month; after people suspected Shems
    was a saint in disguise, he quietly left the city.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Jelāl sent Sultan Veled with money and disciples to Damascus to request Shems’s
    return, saying Shems would be found in a certain inn playing backgammon with a
    young Firengī who was also one of God’s saints.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sultan Veled found Shems as Jelāl had described, brought Shems back to Qonya,
    and the Firengī youth returned to his own country to preach Jelāl’s doctrines
    as vicar.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sultan Veled walked from Damascus to Qonya at Shems’s stirrup; the city received
    them, Jelāl and Shems embraced, and Jelāl’s disciples resented Jelāl’s renewed
    devotion to Shems.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At a college entertainment hosted by the Vazīr of Qonya, the Qur’ān was recited
    in its entirety before religious music and dancing began; the Vazīr and Shems
    both danced, and repeated collisions or skirt contact occurred.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Jelāl became indignant at the discourtesy toward Shems and took Shems by the
    hand to lead him away; after efforts to appease him failed, the Sultan’s police
    seized Shems and put him to death without further inquiry or formality.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: After Shems was killed, his executioners threw his corpse down a well; Sultan
    Veled saw Shems in a dream, learned where the body was, recovered it at midnight
    with friends, washed it, and privately buried it in the college grounds.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Forty days after Shems’s disappearance, Jelāl appointed Husāmu-’d-Dīn as local
    deputy and traveled to Damascus for a third time to seek Shems.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Jelāl did not find Shems in the flesh at Damascus but found something greater
    within himself; he wrote in red ink on the door of Shems’s lodging that it was
    the station of the beloved one of Elias.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: A tradition in the passage says Shems’s body disappeared and that he was buried
    beside Jelāl’s father, Sultan Bahā Veled the Elder.
  category: other
  evidence_refs:
  - ev:11
