canonical_text:
  quote: "“Thou threwst not, when thou threwst” the sand."
  summary: A group continues pleading with the Vazir, describing their dependence
    on him through images of infants, instruments, echoes, chess players, lions on
    weathercocks, pictures before painters, and creation before divine power. The
    narrator then cites the Qur’an and discusses divine agency, free will, shame,
    sickness as an awakening of conscience, and the contrasting choices of prophets
    and miscreants.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speakers insist to the Vazir that their remonstrance is a piteous cry
    and say they weep and sigh because they cannot see him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speakers compare themselves to an infant with a nurse, harps struck by
    the Vazir’s hand, reed flutes, a mountain vale echo, and chess players whose check
    and mate come from him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speakers say the Vazir is their “life of life,” that they are “nothings,”
    and that their being is in him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speakers use the image of lions standing on weathercock vanes, visibly
    moving while the wind is unseen, and state that the Great Unseen, the Almighty
    One, is behind the screen.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speakers say the Vazir taught them to value life, made them lovers of
    the Allwise, and gave them cup, wine, relish, and other gifts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The speakers compare themselves or creation to pictures before a painter,
    an unborn babe in the womb, canvas before an embroiderer’s needle, and beings
    commanded to exist.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator tells the listener to ponder the Qur’an and quotes God as saying
    that the thrower did not throw when he threw the sand.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The narrator says the bow, arrow, and shooter are from God, while also saying
    there is no compulsion even though God can compel.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The narrator says complaints of need and feelings of shame are signs of free
    will, and asks why a master chides a disciple and teaches trust in Providence.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The narrator describes a sick man confined to bed who counts his sins, asks
    for grace, vows repentance, and promises to pursue righteousness.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: An aphorism states that the most awake person has the most pain and that a
    pricking conscience brings greater sadness.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The narrator uses captive, prisoner, bonds, fetters, jailer, and guardsmen
