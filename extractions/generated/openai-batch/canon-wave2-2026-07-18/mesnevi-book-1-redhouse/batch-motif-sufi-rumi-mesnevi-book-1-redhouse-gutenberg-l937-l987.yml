canonical_text:
  quote: ''
  summary: A Seyyid thinks of secretly leaving for Qaysariyya during a ride, but his
    mount throws him and breaks his leg. Jelāl heals the crushed limb by touch and
    breath and then permits the journey. Later the Seyyid prepares for death with
    water and ablution, announces his departure to the other world, calls celestial
    beings to receive back entrusted secrets, sings to beloved God, dies, and is buried.
    A disciple raises a mausoleum, but its dome twice falls in earthquakes and is
    forbidden in a dream. After forty days Jelāl visits and prays at the tomb.
  language: English
  quote_policy: summarized
