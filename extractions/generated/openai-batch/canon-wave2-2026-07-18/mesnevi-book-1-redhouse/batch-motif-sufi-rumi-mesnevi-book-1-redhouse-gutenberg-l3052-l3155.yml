canonical_text:
  quote: "“Jelāl is the key of heaven.”"
  summary: The passage presents testimonies and sayings about Jelāl’s prophetic qualities,
    spiritual authority, learning, power to correct opponents, teachings on speech
    and remembrance, disciple-devotion, prophetic substitution for God, noble descent,
    and the circumcision of Sultan Veled and his brother.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Superior swears that qualities described of the Messiah and in the books
    of Abraham and Moses, along with prophetic grandeur and mien, are found in Jelāl.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shemsu-’d-Dīn of Tebrīz says that whoever wishes to see the prophets again
    should look on Jelāl, who possesses their qualifications, especially those linked
    with revelation, visions, serenity, and inward confidence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shemsu-’d-Dīn says Jelāl’s approbation is heaven, his displeasure is hell,
    and Jelāl is the key of heaven.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Shemsu-’d-Dīn describes Jelāl as having more learning in every science than
    anyone else on earth and as explaining matters better and more exhaustively than
    others.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A teacher in Qonya, lecturing on a terraced roof, hears a lute and declares
    lutes an innovation against prophetic usages that must be interdicted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The form of Jelāl appears before the teacher and answers, “That must not be”;
    the teacher then faints.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After regaining consciousness, the teacher sends an apology and recantation
    through Sultan Veled; Jelāl initially rejects it, but later is appeased by his
    son and permits the teacher and pupils to become disciples.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Jelāl tells his son that to love an enemy and be loved by him, one should
    speak well of him and extol his virtues, because there is a road between heart
    and tongue and also from tongue to heart.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Jelāl says that the love of God may be found by hearing God’s comely names,
    that frequent commemoration brings sincerity, and that greater sincerity lets
    rays of the light of truth shine into the heart.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Jelāl compares spiritual warmth to a baker’s oven, saying a hotter oven bakes
    more bread and a cool oven bakes none.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Sultan Veled reports Jelāl’s saying that a true disciple holds his teacher
    to be superior to all others, illustrated by answers about Bāyezīd, Abū-Hanīfa,
    Abū-Bekr, Muhammed, and God.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Jelāl says that since God does not walk in the world of sensible objects,
    prophets are substitutes of God, and that treating substitutes and their principal
    as two different things is erroneous.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Sultan Veled reports that the Great Master advised disciples to honor Jelāl
    for noble extraction and descent connected with Imām Sarakhsī, Huseyn, ‘Alī, and
    the Prophet.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Sultan Veled reports that he was seven and his brother ‘Alā’u-’d-Dīn eight
    when Bedru-’d-Dīn Guhertāsh had them circumcised at Qara-Hisār.
  category: action
  evidence_refs:
  - ev:9
