candidate_motifs:
- id: motif:1
  label: sage as heir and embodiment of prophetic qualities
  taxonomy_refs:
  - wisdom
  basis: The passage repeatedly claims that prophetic qualifications and exceptional
    learning are found in Jelāl, and cites the saying that the learned are heirs of
    the prophets.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:7
  confidence: high
  cautions: The taxonomy reference to wisdom is broad; the passage is specifically
    Sufi hagiographical praise rather than a generic wisdom tale.
- id: motif:2
  label: spiritual master as gatekeeper of salvation and perdition
  taxonomy_refs:
  - divine_judgment
  basis: Shemsu-’d-Dīn identifies Jelāl’s approval with heaven, his displeasure with
    hell, and Jelāl as the key of heaven.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The judgment language is applied to Jelāl’s spiritual authority, not directly
    to a formal divine judgment scene.
- id: motif:3
  label: miraculous appearance of master correcting a critic
  taxonomy_refs: []
  basis: Jelāl’s form appears before a teacher who condemns lutes, contradicts him,
    and causes him to faint; the teacher is later reconciled and accepted as a disciple.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not explain the mechanics of the appearance or explicitly
    label it a miracle.
- id: motif:4
  label: transformative power of speech between tongue and heart
  taxonomy_refs:
  - wisdom
  basis: Jelāl teaches that praising an enemy can turn him into a friend and explains
    a reciprocal road between the tongue and the heart.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The teaching is framed as ethical and devotional instruction, not as a
    narrative quest episode.
- id: motif:5
  label: true disciple’s total allegiance to the teacher
  taxonomy_refs:
  - initiation
  basis: Jelāl defines a true disciple as one who holds the teacher superior to all
    others, illustrated by escalating comparisons involving Bāyezīd and major authorities.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage gives an illustrative teaching on discipleship; it does not
    narrate a formal initiation rite in this section.
- id: motif:6
  label: prophets as substitutes of God in the visible world
  taxonomy_refs: []
  basis: Jelāl states that because God does not walk in the sensible world, prophets
    are substitutes of God, while also warning against treating substitute and principal
    as two different things.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No available taxonomy ref exactly captures this substitution/non-separation
    doctrine.
- id: motif:7
  label: sacred ancestry legitimizing spiritual honor
  taxonomy_refs: []
  basis: The Great Master’s recommendation to honor Jelāl is grounded in noble extraction
    and descent connected with Huseyn, ‘Alī, and the Prophet.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The available royal_legitimacy taxonomy is not used because the passage
    concerns spiritual and genealogical honor rather than kingship.
- id: motif:8
  label: circumcision as childhood rite
  taxonomy_refs:
  - initiation
  basis: Sultan Veled reports that he and his brother were circumcised at ages seven
    and eight by Bedru-’d-Dīn Guhertāsh at Qara-Hisār.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage only records the rite; it does not interpret its symbolic
    or initiatory meaning.
comparison_claims:
- id: claim:1
  claim: The passage explicitly aligns Jelāl with a prophetic-heir pattern by stating
    that prophetic qualifications and sacred learning are found in him and by invoking
    the saying that the learned are heirs of the prophets.
  claim_level: same_function
  target: Islamic/Sufi prophetic-heir and wisdom-teacher pattern
  evidence_refs:
  - ev:1
  - ev:2
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This is an intra-tradition comparison supported by the passage itself;
    it does not establish historical contact with any external tradition.
- id: claim:2
  claim: The teaching on the true disciple supports comparison to a disciple-master
    allegiance pattern in which the teacher is treated as supreme for the disciple’s
    spiritual orientation.
  claim_level: same_function
  target: disciple-master devotion pattern
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage presents examples and sayings, not a full initiation narrative
    or institutional rule.
- id: claim:3
  claim: The statement that prophets are substitutes of God, while not finally separate
    from their principal, supports a cautious comparison to mediator or divine-representative
    patterns.
  claim_level: same_function
  target: prophet or saint as divine representative pattern
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage’s doctrinal formulation is specific; broader archetypal
    or cross-cultural claims would require evidence outside this passage.
