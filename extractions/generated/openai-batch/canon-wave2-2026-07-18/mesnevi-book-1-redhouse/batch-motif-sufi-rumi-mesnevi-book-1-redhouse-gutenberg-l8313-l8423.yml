canonical_text:
  quote: ''
  summary: A hare claims to be paralyzed by fear and gives a long speech on signs
    of inner states, natural change, and the discord of opposites. He tells a lion
    that a foe rests in a well. The lion carries the hare to the well, sees his own
    reflection in the water, mistakes it for another lion with a hare, and leaps in.
    The narrator moralizes that unjust tyrants fall into the pits they make, and that
    the weak may flee to God as Protector.
  language: English
  quote_policy: summarized
