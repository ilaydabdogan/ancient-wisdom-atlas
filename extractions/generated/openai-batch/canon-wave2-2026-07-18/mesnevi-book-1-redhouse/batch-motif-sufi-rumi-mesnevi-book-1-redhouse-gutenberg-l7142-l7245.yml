canonical_text:
  quote: ''
  summary: The passage contrasts divine baptism and divine curse, then narrates a
    persecutor who sets an idol beside a fire and commands worship under threat of
    burning. It allegorizes external idolatry as arising from inward fleshly pride.
    A Christian mother and her infant are brought to the idol and fire; the infant
    is thrown into the flame but speaks miraculously, saying the fire is cool, merciful,
    and a doorway to divine reality. The child invites the mother and the faithful
    to enter, and the crowd willingly enters the fire until guards say it is full.
  language: English
  quote_policy: summarized
