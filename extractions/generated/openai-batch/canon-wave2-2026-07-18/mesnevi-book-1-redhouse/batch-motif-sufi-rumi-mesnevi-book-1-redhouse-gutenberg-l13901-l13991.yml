canonical_text:
  quote: ''
  summary: A speaker addresses ‘Alī as a possessor of inward knowledge and asks him
    to disclose what he saw when he gave up his rights and forgave an enemy. The speaker
    describes ‘Alī through images of sword-like calmness, fountains of wisdom, falcon-like
    heavenly vision, moonlight, and a gate to prophetic knowledge. The passage then
    turns to images of seekers, treasures, pearls, fragrance, spiritual rebirth as
    a babe, and hidden celestial channels linking the sun, planets, minerals, fruits,
    lightning, and wit.
