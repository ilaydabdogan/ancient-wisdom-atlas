canonical_text:
  quote: ''
  summary: The passage opens by praising God's power to transform harms into benefits,
    including poison into healing and fire into safety. It then narrates how the Vazir
    withdraws into a cell for more than forty days, causing his followers and twelve
    captains to plead for his return. The Vazir instructs them to turn away from outward
    senses and hear God's inward voice, while the disciples answer with images of
    infants, birds, water, and gardens to express their dependence on him. He finally
    refuses to leave solitude, saying he is communing with God.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A divine agent is said to change crafty wiles into welfare, poisons into healing,
    uncertainty into confession, and plotted hatred into true love.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same divine agent is said to carry a chosen friend safely through fire
    and to turn fear of death into peace of mind.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says treasures are hidden beneath ruins, thorns yield roses, and
    bodies foretaste joys of the soul.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Vazir conceives another stratagem and withdraws from public life into
    solitude for more than forty days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Followers mourn the Vazir's absence, miss his example, speech, and zeal to
    pray, and describe themselves as a pastorless flock, blind beggars, and infants
    needing a feeder and tutor.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Vazir answers that his spirit is present with his friends, but that leaving
    the hermitage exceeds his power.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Twelve captains and grieving disciples intercede; the disciples call themselves
    orphans, sob, beat their breasts, compare themselves to fishes out of water, and
    praise the Vazir as the phoenix of the age.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Vazir tells the listeners to stop their outward ears, remove the mote
    from their eyes, discard outward sense, thought, and reflection, and hear God's
    voice within.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Vazir contrasts outward words, acts, and senses with the inward man, and
    says the soul, like Jesus, walks the sea without turmoil.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Vazir asks how the Fount of Life can be found while chasing mundane things,
    contrasts death's billows with life-rills, and names abnegation and self-denial
    as life-rills.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The disciples answer that the burden is too heavy for them and use images
    of infants needing milk before bread and unfledged chicks needing grown wings
    before flight.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The disciples say the Vazir's voice stills howling imps, his words bring joy,
    deserts become gardens through his freshness, and his presence makes earth a foretaste
    of heaven.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Vazir replies that their prayer is of no avail, asks them to trust his
    word even if he says black is white or earth is sky, and states that he is not
    designed to leave solitude because he is communing with God.
  category: speech
  evidence_refs:
  - ev:6
