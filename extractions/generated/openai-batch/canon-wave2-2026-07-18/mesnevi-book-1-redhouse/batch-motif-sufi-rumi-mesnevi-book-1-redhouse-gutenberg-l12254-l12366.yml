canonical_text:
  quote: ''
  summary: The passage opens with didactic couplets urging the hearer to humble and
    annihilate the self, to quit 'I' and 'We,' and to let existence be enrolled in
    God's essence. It then tells a fable in which a lion, wolf, and fox hunt together,
    take three animals as prey, and face the division of the spoil. The lion perceives
    the wolf and fox's desire for shares, asks the wolf to divide the prey, and kills
    the wolf after the wolf assigns portions to the lion, himself, and the fox. The
    passage closes by applying the lesson to loss of self before God and warning that
    those who speak of 'me' and 'thee' in God's court are cut off.
  language: English
  quote_policy: summarized
