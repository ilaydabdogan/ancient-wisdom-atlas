canonical_text:
  quote: ''
  summary: The passage gives a didactic account of words and actions as released causes
    whose consequences cannot ordinarily be recalled, while affirming God as maker
    and humans as accountable for effects. It then describes saints as divinely empowered
    to interrupt cause and consequence and discusses remembrance, forgetfulness, thoughts,
    talents, and return to source under divine control. The narrative resumes with
    a bird or parrot collapsing after hearing of another parrot’s sad state, and the
    merchant lamenting it as a beloved companion.
