  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The addressee is told not to stuff the mind’s ear with doubt’s cotton-wool,
    so as to solve God’s riddles and receive inspiration in the heart.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The ear and eye of the soul are stated to be organs not of sense.
  category: attribute
  evidence_refs:
  - ev:1
