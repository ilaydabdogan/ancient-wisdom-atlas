canonical_text:
  quote: ''
  summary: 'The Prophet counsels Ali to trust in God rather than courage alone, to
    obey a chosen Teacher without questioning, and to endure corrective hardship.
    A comic Qazwin tattoo tale follows: a bully asks for a blue lion tattoo but cannot
    bear the needle for tail, ear, or body, leading the artist to abandon the impossible
    design. The narrator applies the tale as an exhortation to patience, conquest
    of bodily pride, and spiritual elevation.'
  language: English
  quote_policy: summarized
