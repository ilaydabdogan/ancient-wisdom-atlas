canonical_text:
  quote: ''
  summary: A healer discerns that a woman's illness is caused by concealed love rather
    than bodily disorder. The passage then reflects on love as a force beyond speech
    that draws people heavenward, on God as an eternal soul-sun, and on reunion with
    God. The healer asks the prince to clear the room, questions the patient privately
    while feeling her pulse, and the text compares hidden mental pain to a thorn that
    is hard to find and can be worsened by unreasoning agitation.
  language: English
