  text: The king of Qonya invited Bahā’u-’d-Dīn to the capital, installed him in a
    college, and professed himself a disciple.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bahā’u-’d-Dīn died at Qonya; the Sultan erected a marble mausoleum over his
    tomb, and miracles are said to have continued at the sanctuary.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jelāl reportedly said that he and his disciples would be under the protection
    and guidance of the Great Master on the day of resurrection and would be pardoned
    for his sake.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Jelāl reportedly said he would need Shemsu-’d-Dīn of Tebrīz and compared this
