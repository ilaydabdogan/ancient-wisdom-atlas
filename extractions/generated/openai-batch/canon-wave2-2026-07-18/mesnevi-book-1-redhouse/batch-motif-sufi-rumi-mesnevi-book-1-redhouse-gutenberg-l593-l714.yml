- id: obs:1
  text: Jelālu-’d-Dīn Muhammed is described as reaching manhood at eighteen, marrying
    Gevher Khātūn, and becoming father of ‘Alā’u-’d-Dīn.
  category: sequence
  evidence_refs:
  - ev:1
