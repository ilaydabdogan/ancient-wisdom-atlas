canonical_text:
  quote: ''
  summary: The passage recounts biographical and hagiographical anecdotes concerning
    Jelālu-’d-Dīn Muhammed, his father Bahā’u-’d-Dīn Veled, the Sultan of Qonya, and
    later disciples. It describes marriage and succession, miracles at Bahā Veled’s
    tomb, claims of protection at resurrection, a dream-warning by the deceased saint
    that saves the Sultan during a military episode, answered prayers at the shrine,
    and a vision of glory spreading from the mausoleum over the world.
  language: English
  quote_policy: summarized
