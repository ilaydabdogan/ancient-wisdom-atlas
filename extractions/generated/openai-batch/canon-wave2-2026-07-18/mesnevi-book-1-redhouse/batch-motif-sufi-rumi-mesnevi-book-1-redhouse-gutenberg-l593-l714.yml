    saint’s tomb.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Sultan put on a disguise, went with a few followers to the Kh’ārezmian
    camp, claimed to be a local nomad Turk, and was received with tents and rations.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: King Jelālu-’d-Dīn Kh’ārezm-Shāh became doubtful about the newcomers’ story
    and postponed further inquiry until morning.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At midnight the deceased saint Bahā Veled appeared in the Sultan’s dream and
    warned him to flee; in a second dream he struck the Sultan on the breast with
    a staff and told him to arise.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Sultan awoke, gathered his people, saddled horses, and left the camp;
    later the strangers’ tents were found empty and pursuit failed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: After the two armies fought, the Sultan of Qonya was victorious and afterwards
