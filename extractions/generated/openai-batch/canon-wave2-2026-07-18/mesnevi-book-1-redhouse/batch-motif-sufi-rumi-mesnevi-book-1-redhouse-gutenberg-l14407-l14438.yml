canonical_text:
  quote: ''
  summary: The Prince of all Believers explains to a Magian opponent that he did not
    act violently after being spat upon because zeal for God had become mixed with
    personal anger. He says the opponent belongs to God and that defacing God's work
    must be by God's decree. The Magian receives this as illumination, renounces misbelief,
    praises the Prince as just and guiding, asks to learn his creed, and fifty members
    of his household embrace Islam. The narrator concludes that wisdom averted death,
    broke fetters, and is sharper than steel.
