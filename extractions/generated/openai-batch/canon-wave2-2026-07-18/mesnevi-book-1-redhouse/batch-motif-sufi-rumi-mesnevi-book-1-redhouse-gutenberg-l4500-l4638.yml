candidate_motifs:
- id: motif:1
  label: saintly succession and authorized companionship
  taxonomy_refs: []
  basis: Husām is appointed after a deceased saint and is described as working in
    unity with Jelāl, supported by honorific titles.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is primarily a hagiographic succession pattern rather than a mythic
    succession narrative.
- id: motif:2
  label: supernatural guardians enforce reverence for sacred words
  taxonomy_refs:
  - divine_judgment
  basis: Invisible armed beings guard the Mesnevī recitation and punish listeners
    who lack reverence and belief with hell-fire.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage frames the event as Husām’s reported vision confirmed by Jelāl;
    no external comparison is asserted.
- id: motif:3
  label: saint reads hidden desire
  taxonomy_refs:
  - wisdom
  basis: Husām perceives the disciples’ unspoken wish for honey and acts on it.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The broad taxonomy reference to wisdom is used for hidden knowledge; the
    passage does not label this as a formal wisdom motif.
- id: motif:4
  label: inexhaustible miraculous food supply
  taxonomy_refs: []
  basis: The hive provides repeated honeycomb until all are satisfied and continues
    supplying needs for a long time.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The item supplied is honey rather than a meal or grain; no taxonomy ref
    among the provided motif families exactly matches it.
- id: motif:5
  label: rain brought by saintly intercession
  taxonomy_refs: []
  basis: After drought and failed public prayers, Husām prays at Jelāl’s tomb and
    abundant rain follows.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The available motif-family list has no direct rainmaking category; the
    water symbol is recorded separately.
- id: motif:6
  label: hidden sanctity versus outward piety
  taxonomy_refs:
  - wisdom
  - divine_judgment
  basis: Jelāl explains that God looks to the heart, reversing the disciples’ assumptions
    about people with bad reputations and outwardly pious lives.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: This is a moral-discernment teaching embedded in hagiography; taxonomy
    mapping is approximate.
- id: motif:7
  label: prophetic warning averts destruction
  taxonomy_refs:
  - divine_judgment
  basis: Husām sends a warning to the queen to avoid impending destruction from God’s
    decree; the building collapses after she leaves.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The destructive event is a building collapse, not a cosmic or communal
    judgment.
- id: motif:8
  label: contested sacred office and institutional prophecy
  taxonomy_refs: []
  basis: Husām’s installation is opposed through seizure of the carpet, followed by
    Jelāl’s prediction that the opposing college will not prosper and the Mevlevī
    order will increase.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: This concerns institutional legitimacy within the narrative; it should
    not be equated with royal legitimacy.
- id: motif:9
  label: returning scholar recognized by elder woman
  taxonomy_refs:
  - return
  basis: In Jelāl’s anecdote, Abū-’l-Lays returns after about twenty years of study
    travels and is recognized by an old woman at the riverside.
  evidence_refs:
  - ev:10
  confidence: low
  cautions: The anecdote is incomplete in the supplied passage, so the function of
    the return remains uncertain.
