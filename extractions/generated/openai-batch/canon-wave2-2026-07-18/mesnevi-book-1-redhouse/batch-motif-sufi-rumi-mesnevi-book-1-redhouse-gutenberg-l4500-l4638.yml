canonical_text:
  quote: ''
  summary: 'The passage presents accounts of Chelebī Husāmu-’d-Dīn after his appointment
    as Jelāl’s assistant: his titles, piety, charity, miracles of protection, provisioning,
    rainmaking, discernment, warning, and his contested installation as rector, followed
    by the beginning of Jelāl’s anecdote about Abū-’l-Lays of Samarqand.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Sheykh Ferīdūn’s death, Chelebī Husāmu-’d-Dīn was appointed Jelāl’s
    assistant, and the two worked together for ten years as superior and assistant.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Husāmu-’d-Dīn is given multiple honorific titles, including titles linking
    him with Juneyd, Bāyezīd, God’s throne, and God’s friendship.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Husām reports seeing invisible armed beings guarding disciples while they
    recited the Mesnevī poetry and became entranced.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Those who do not listen to the sacred words with reverence and belief are
    described as being struck by clubs and swords and hurled into hell-fire; Jelāl
    confirms Husām’s report.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Husām is described as eloquent, pious, and God-fearing; he avoids using college
    water and distributes the college revenues among the disciples.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Husām reads the disciples’ unspoken wish for honey, orders honeycomb from
    a hive, and the hive continues to supply their needs for a long time.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: During a severe drought near Qonya, public prayers fail; Husām prays at Jelāl’s
    tomb, the disciples say amen, clouds gather, and abundant rain follows.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When disciples are troubled by Husām’s praise of ill-reputed people and disparagement
    of outwardly pious people, Jelāl says God looks only to the heart.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Husām sends a disciple to warn the queen to leave an apartment to avoid impending
    destruction; after she moves and the furniture is removed, the building collapses.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A prince appoints Husām rector of a college, and Jelāl says he will carry
    and spread Husām’s carpet at the new seat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Akhī Ahmed snatches Husām’s carpet and refuses his installation; armed nobles
    draw weapons, and Jelāl reproaches the crowd and predicts the Akhī college will
    not prosper while the Mevlevī order will increase.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Jelāl begins an anecdote about Abū-’l-Lays of Samarqand, who travels for about
    twenty years for study and is recognized by an old woman at the riverside on his
    return.
  category: sequence
  evidence_refs:
  - ev:10
