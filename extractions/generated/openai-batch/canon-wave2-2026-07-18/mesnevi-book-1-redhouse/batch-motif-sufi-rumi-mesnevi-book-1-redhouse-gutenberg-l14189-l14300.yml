  summary: The passage admonishes restraint from appetite, describes God as the one
    who can break and mend, destroy and restore, recounts Adam's proud disdain toward
    a demon and repentance after divine rebuke, offers a prayer for guidance and union
    with God, uses seasonal and plant images for renewal, and returns to ‘Alī facing
    his destined murderer without anger while speaking of death and resurrection.
