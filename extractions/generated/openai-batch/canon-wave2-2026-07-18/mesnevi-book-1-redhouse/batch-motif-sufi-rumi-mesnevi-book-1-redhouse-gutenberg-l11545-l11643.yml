canonical_text:
  quote: "“Thus, likewise, are our intellects, our thoughts, our sense; / A drop compared
    with God’s boundless omniscience!”"
  summary: An impoverished Arab man doubts he can gain access to the Caliph without
    introduction or proof of need. His wife argues that grief and poverty are enough
    introduction and proposes that he offer the Caliph a pot of rain-water, their
    only wealth. She interprets the pot and water as emblems of life, senses, purity,
    and value. The narrator notes that Baghdad contains the Tigris, abundant like
    an ocean, and compares human intellect to a drop before God’s omniscience. The
    man accepts the plan, praises the water, travels with the pot, and guards it while
    his wife prays that God protect him and the pot.
  language: English
  quote_policy: quoted
