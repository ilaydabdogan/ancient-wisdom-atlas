canonical_text:
  quote: ''
  summary: After earlier remedies fail, the prince goes barefoot to a sacred worship-house,
    bows at the altar, weeps, and prays to God for mercy and guidance. In sleep he
    hears heavenly tones promising that a heaven-sent healer will arrive at dawn and
    that God alone can make the maiden well. At dawn the prince sees and recognizes
    a radiant stranger, welcomes him, and later brings him to the maiden. The narration
    includes moral exempla about humility, heavenly food given and withdrawn, punishment
    for sin and presumption, and celestial obedience. The healer examines the maiden
    and states that earlier treatments were harmful because the case was misunderstood.
  language: English
  quote_policy: summarized
