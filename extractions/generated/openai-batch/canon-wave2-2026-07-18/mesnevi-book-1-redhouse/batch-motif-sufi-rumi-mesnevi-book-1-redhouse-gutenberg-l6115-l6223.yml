canonical_text:
  quote: "“There was but one; his eyes were cause that he saw two.”"
  summary: The passage warns against disguised deceivers through images of demons
    in human form, a fowler luring birds, false piety, and false prophetic claims.
    It then begins the tale of a Jewish king who persecutes Christians because of
    hatred for Jesus, explains his distorted sight through a squint-eyed slave parable,
    and narrates the vazir’s plan to be publicly mutilated and exiled so he can infiltrate
    the Christians as a false martyr and teacher.
  language: English
  quote_policy: quoted
