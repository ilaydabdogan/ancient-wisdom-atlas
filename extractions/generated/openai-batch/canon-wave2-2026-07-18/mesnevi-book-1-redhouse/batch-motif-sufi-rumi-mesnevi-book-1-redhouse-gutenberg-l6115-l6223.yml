candidate_motifs:
- id: motif:1
  label: deceptive lure under familiar or pious appearance
  taxonomy_refs:
  - trickster_boundary
  basis: 'The passage repeatedly presents deception as something that appears familiar,
    pious, or trustworthy: demons in human form, the fowler’s mate-like whistle, the
    sinner’s pious cant, and the vazir’s false Christian persona.'
  evidence_refs:
  - ev:1
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The taxonomy label is a broad motif-family fit; the passage itself frames
    these as moral and religious warnings rather than as a separate trickster tale.
- id: motif:2
  label: false doubleness caused by distorted perception
  taxonomy_refs:
  - duality
  basis: The king is said to be squint-eyed, the slave sees one bottle as two, and
    the passage states that desire, rage, and passion make people see double and blind
    reason.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The duality is explicitly treated as an error of perception, not as an
    ontological cosmic dualism.
- id: motif:3
  label: infiltration by staged suffering and false martyrdom
  taxonomy_refs:
  - trickster_boundary
  basis: The vazir proposes mutilation, gallows, intercession, exile, and a fabricated
    confession of secret Christian faith to gain acceptance among Christians and preach
    as a saintlike teacher.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The suffering is staged as deception; it should not be coded as genuine
    martyrdom or sacrifice without review.
- id: motif:4
  label: divine love as spiritual wine
  taxonomy_refs:
  - divine_beloved
  basis: Muhammed is described as nourished by the wine of God’s love, while ordinary
    intoxicating wine is rejected.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: This is a brief devotional image in the introductory warning section,
    not the central action of the narrative passage.
- id: motif:5
  label: concealed faith and hidden identity
  taxonomy_refs: []
  basis: The Christians are said to keep their faith hidden to save their lives, while
    the vazir proposes to conceal and counterfeit religious identity in order to be
    received by them.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: This candidate overlaps with the deception and infiltration motifs; human
    review should decide whether to merge it with motif:1 or motif:3.
