canonical_text:
  quote: ''
  summary: A prophet hears mournful sounds, weeps, addresses the dead, recalls God’s
    instruction to continue counsel, and then reproaches himself for grieving over
    violent and obstinate people. God’s judgment by smoke and fire is described. The
    passage then sets the damned and blessed in one scene separated by an impassable
    gulf, develops metaphors of mixed but inwardly distinct substances and waters,
    and closes with reflections on discernment, hidden poison in sweet pleasures,
    grave-penalty, and resurrection disclosure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prophet hears sad sounds, weeps, groans responsively, and addresses the
    dead as people who had been reproved in vain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lord is reported as telling the prophet to have patience with the people’s
    misdeeds and to continue giving counsel; the Lord later grants grace and soothes
    the wounds caused by their rancor.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prophet’s counsel is compared to milk from love’s pure source; when he
    counsels again, the milk is said to flow mixed with honey from his lips.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The recipients’ ears and nature are described as turning the counsel into
    venom and rejecting goodness like poisonous plants.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prophet turns reproachfully upon himself for weeping over the violent
    people, and his conscience questions why he mourns them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The condemned people are described with poisonous and dangerous animal imagery,
    including adderlike tongues, tails, fangs, scorpion claws, and a sting.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: God sends His servants, identified as smoke and fire, from heaven to chase
    the miscreants to a hell-pit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The damned and blessed are shown together in one scene, but an impassable
    gulf or barrier is fixed between them; sons of fire and light seem together yet
    remain unmixed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage uses images of golden ore embedded in soil, pearls and jet beads
    on one necklace, and an estuary divided between sweet clear water and foul salty
    water to describe co-presence with separation.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The movement of gentle waves and rough warlike billows is used to describe
    friendship, contention, love, and hatred among spirits.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The outward eye is said not to discern pure hearts from tainted hearts, while
    the eye of true sagacity can see the distinction when futurity’s lattice opens
    and the curtain parts.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Pleasures that seem sweet can contain hidden poison; discerning people know
    them by smell, while others learn by tasting or by later bodily effects.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: The consequences of indulgence may be suffered after months or years, in the
    tomb, or at the resurrection trumpet when disclosure cannot be avoided.
  category: sequence
  evidence_refs:
  - ev:8
