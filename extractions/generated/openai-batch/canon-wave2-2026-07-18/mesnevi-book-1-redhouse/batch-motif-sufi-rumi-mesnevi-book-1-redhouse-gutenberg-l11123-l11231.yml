canonical_text:
  quote: ''
  summary: The passage presents prophets and saints as guides hidden under ordinary
    forms, then recounts Sālih’s people hamstringing and denying water to God’s camel.
    It interprets the camel as an image of the saint’s vulnerable bodily form joined
    to an invulnerable soul. Sālih warns the people of a three-day judgment marked
    by changing face colors and the escaped foal; the warning is fulfilled, the people
    crouch in fear, and Sālih later sees the town destroyed in smoke and blaze.
  language: English
  quote_policy: summarized
