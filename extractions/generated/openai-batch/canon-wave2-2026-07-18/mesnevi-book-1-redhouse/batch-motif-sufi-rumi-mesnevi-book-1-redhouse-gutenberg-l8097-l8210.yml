    to lead him to a well. The passage then offers moral reflections on enemies, traps,
    divine judgment, prayer, and distorted discernment. A second narrative begins
    with Solomon receiving birds who speak to him; the hoopoe explains its power to
    find hidden underground water, and Solomon appoints it to serve his armies in
    deserts.
