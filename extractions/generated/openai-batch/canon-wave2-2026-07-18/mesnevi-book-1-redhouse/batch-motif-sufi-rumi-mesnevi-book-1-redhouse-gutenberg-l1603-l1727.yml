canonical_text:
  quote: ''
  summary: Jelāl reveals to a merchant that his misfortunes resulted from insulting
    a hidden European saint, miraculously shows that saint through a wall, and sends
    the merchant to seek reconciliation. The saint receives the merchant and shows
    him Jelāl in ecstatic dance; the merchant later joins Jelāl’s fraternity. Subsequent
    anecdotes show Jelāl reconciling quarrelling men, instructing students through
    a story about a grammarian trapped in a well, and interpreting the well as self-worship.
    A governor of Qonya is then introduced as Jelāl’s disciple and friend of dervishes
    and scholars.
  language: English
  quote_policy: summarized
