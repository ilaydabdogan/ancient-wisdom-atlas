  quote: ''
  summary: A didactic passage contrasts harsh counsel for hard hearts with submission
    to God, secrecy, hope, fear, veiled knowledge, and belief in the unseen. It includes
    an exemplum of a youth uncertain whether a fisherman is Solomon until Solomon's
    signet-ring and authority are restored, and another exemplum of a loyal frontier
    warden rewarded for hidden service. The passage closes by emphasizing God as witness
    and comparing human inability to bear full light to a bat seeking darkness.
