  summary: 'The passage gives anecdotes about Jelāl and the Mevlevī lineage: Jelāl
    turns a market cry into a devotional wordplay and ecstatic dance; a young descendant
    of the Prophet explains a turban form by recounting Muhammad’s heavenly vision
    of Jelāl’s future portrait; Abu-Bekr responds to that prophecy and later receives
    a consoling posthumous appearance; and a merchant reports a fisherman’s tale of
    a speaking sea being whose underwater nation follows Mevlānā’s teachings.'
  language: English
  quote_policy: quoted
