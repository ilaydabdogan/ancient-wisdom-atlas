canonical_text:
  quote: A beggar is a mirror wherein bounty shines.
  summary: The passage describes the Arab man’s arrival near Baghdad after his pot
    reaches safely, presents Baghdad as a place where worldly favors are distributed,
    teaches that beggars reveal bounty and divine grace, contrasts sincere God-centered
    poverty with sham poverty and greed, warns against prejudice and empty outward
    forms, and ends with Baghdad gate officials receiving the Arab man kindly.
  language: English
