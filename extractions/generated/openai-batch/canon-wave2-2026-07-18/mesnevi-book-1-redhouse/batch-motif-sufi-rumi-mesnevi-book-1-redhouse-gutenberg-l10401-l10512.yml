canonical_text:
  quote: ''
  summary: The passage continues the story of an old harper frightened by ‘Umer. ‘Umer
    consoles him with a divine message of praise and a small gift. The harper responds
    with shame, tears, and destruction of his harp, lamenting a wasted life. ‘Umer
    teaches him to go beyond contrition, past and future, and dividedness. The harper
    receives enlightenment, enters ecstatic immersion in God, and falls silent. The
    narrator then prays for divine life to be infused into the world and cites a prophetic
    report about two angels blessing dispensers and calling loss upon hoarders.
  language: English
  quote_policy: summarized
