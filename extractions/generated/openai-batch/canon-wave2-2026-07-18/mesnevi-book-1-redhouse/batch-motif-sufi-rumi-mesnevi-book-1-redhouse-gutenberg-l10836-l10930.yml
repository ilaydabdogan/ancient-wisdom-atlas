  quote: ''
  summary: Ahmed affirms both Abu-Jahl's insulting description and Abu-Bekr's praise,
    then explains to the assembled company that he is a polished mirror in which different
    observers see their own reflection. A husband addresses his wife about poverty,
    contentment, speech and listening, divine creation, and the danger of household
    contention. He threatens separation if contention continues. The wife weeps, submits
    herself to him, and says her complaints about poverty arose from concern for him
    rather than for herself.
