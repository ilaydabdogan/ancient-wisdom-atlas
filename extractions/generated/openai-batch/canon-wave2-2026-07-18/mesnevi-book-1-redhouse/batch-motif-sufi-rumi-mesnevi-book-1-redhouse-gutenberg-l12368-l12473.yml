canonical_text:
  quote: "“My cot’s too small for two selves to find room therein.”"
  summary: A man is rejected from a friend's door after answering as an independent
    “I,” undergoes a year of absence and suffering, and is admitted when he returns
    as the friend's “second self.” The passage expands this into reflections on divine
    power, resurrection, creation by the command “Be,” apparent opposition serving
    one aim, diverse rites tending to God, streams of speech and spirit, unity beyond
    the senses, and a return to the tale of the lion, wolf, and fox.
  language: English
  quote_policy: quoted
