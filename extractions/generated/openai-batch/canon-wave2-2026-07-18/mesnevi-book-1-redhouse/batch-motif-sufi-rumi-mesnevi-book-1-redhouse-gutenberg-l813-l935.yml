canonical_text:
  quote: ''
  summary: Chapter II presents Seyyid Burhānu-’d-Dīn Sirr-Dān as a spiritual teacher
    and confidant. It recounts his distant announcement of Bahā Veled’s death, his
    mourning disciples, his journey and summons to Jelālu-’d-Dīn, the transmission
    of inner spiritual knowledge, and a later prediction of the Sheykhu-’l-Islām’s
    assassination that is said to occur as foretold.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Seyyid Burhānu-’d-Dīn was known as Sirr-Dān in several cities, and his discourse
    concerned spiritual and mental phenomena and mysteries of earth and heaven.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Bahā Veled left Balkh, the Seyyid went to Termīz, secluded himself as
    a hermit, and later resumed public lectures on knowledge.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: On a specified Friday morning, the Seyyid wept and declared that his master
    had passed from the earthly body to an abode of sincerity; the recorded date was
    later said to match Bahā Veled’s death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The disciples at Termīz mourned Bahā Veled’s death for forty days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the mourning period, the Seyyid said Bahā Veled’s son and successor,
    Jelālu-’d-Dīn Muhammed, was alone and wished to see him, and that he must go to
    serve him and deliver a trust from his teacher.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Qonya, the Seyyid practiced devotional seclusion in a mosque and sent Jelāl
    a letter by two mendicants, summoning him to his father’s resting-place and warning
    that fire would shower down from the hill onto Qonya.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After reading the letter, Jelāl returned quickly to Qonya, went to visit the
    Seyyid, and the two embraced and conversed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Seyyid kissed the soles of Jelāl’s feet, praised Jelāl’s learning, and
    urged him to acquire the mysteries of mute reality and ecstasy, called the Science
    of Divine Intuition.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Jelāl complied with the Seyyid, took him to his college, and received instruction
    from him for nine years.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Husāmu-’d-Dīn is named as the transmitter of an occurrence that Jelāl had
    reported about the Seyyid’s visit to Sāmānek.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: In Sāmānek, the Seyyid warned the Sheykhu-’l-Islām that on the tenth day of
    the next month, Ramazān, he would be assassinated on his way to a hot-bath by
    emissaries of the Old Man of the Mountain, and told him to set his affairs in
    order and repent.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: When the Sheykhu-’l-Islām fell at the Seyyid’s feet wailing, the Seyyid said
    the matter was in God’s hands, but added that the man would die in the faith and
    not be cut off from divine mercy and grace.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The assassins are said to have taken the Sheykhu-’l-Islām’s life on the day
    foretold by the Seyyid.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Later, the Seyyid asked Jelāl for permission to go to Qaysariyya, but Jelāl
    could not spare him, so he remained at Qonya.
  category: sequence
  evidence_refs:
  - ev:10
