canonical_text:
  quote: ''
  summary: A Jewish king is shamed when the faithful are preserved from fire. A separate
    example tells of an offender against Ahmed/Muhammed who is humbled and seeks forgiveness.
    The passage teaches that tears, contrition, mercy, and prayer draw grace. The
    king questions why fire has not burned the Christians; the fire answers that it
    remains unchanged but acts only within the limit set by its Lord. The narrator
    explains that fire, air, earth, and water are servants of God, that visible causes
    depend on higher causes, and that divine command can make elements protect or
    destroy, as in Hūd’s saving circle during the wind of ‘Ād.
  language: English
  quote_policy: summarized
