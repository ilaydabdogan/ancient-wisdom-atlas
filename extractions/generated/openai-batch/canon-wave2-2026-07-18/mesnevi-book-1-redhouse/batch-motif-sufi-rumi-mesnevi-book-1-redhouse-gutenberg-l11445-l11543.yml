canonical_text:
  quote: ''
  summary: A husband tells his wife he has abandoned dispute and submits to her authority.
    When she questions his sincerity, he swears by God and recounts Adam’s divine
    instruction in names and mysteries, Adam’s teaching of angels, God’s uncontainability
    except in the believer’s heart, the angels’ reflections on earth, Adam’s clay
    body and transcendent spirit, and God’s merciful answer to angelic objection.
    The speaker then invites heart-disclosure, and the wife urges recourse to the
    Caliph in Baghdad, using Ahmed’s elevation of Abu-Bekr as an example.
  language: English
  quote_policy: summarized
