canonical_text:
  quote: ''
  summary: A Vazir is absent from the king for six years while appearing to follow
    Jesus’s faith. The people trust and obey him, though he secretly plots with the
    king. Christians are organized into twelve legions with captains, all devoted
    to the Vazir. He prepares separate forged volumes for them, each teaching different
    and mutually contradictory doctrines about fasting, charity, works, law, weakness
    and power, light and darkness, renunciation, possessions, wisdom, and unity. The
    narrator concludes that the volumes are paradoxical antitheses, likening one to
    honey and another to poison, and urges adherence to scripture.
  language: English
  quote_policy: summarized
