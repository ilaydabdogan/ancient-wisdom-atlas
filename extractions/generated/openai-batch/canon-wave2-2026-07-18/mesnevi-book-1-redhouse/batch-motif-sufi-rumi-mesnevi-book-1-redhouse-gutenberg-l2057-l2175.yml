canonical_text:
  quote: ''
  summary: 'The passage recounts several anecdotes about Jelāl: a physician witnesses
    him consume seventeen purgative draughts, ice, and then sing and dance for three
    days without harm; the Perwāna criticizes Jelāl’s disciples and is reconciled
    after Jelāl explains their reform; another critic is answered by Jelāl’s defense
    of his followers; and a young merchant disobeys Jelāl’s travel prohibition, is
    captured, receives dream guidance from Jelāl, heals a Firengī prince, and becomes
    a philosopher through Jelāl’s favor.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A great physician in Qonya occasionally visits Jelāl, and Jelāl asks him to
    prepare seventeen purgative draughts for a specified medicinal time.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jelāl receives the seventeen draughts and drinks all seventeen in succession
    in the physician’s presence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The physician follows Jelāl expecting to assist him, but finds him seated,
    healthy, and lecturing; after being advised to abstain from water, Jelāl orders
    ice and swallows a large amount of it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jelāl goes to a hot bath and afterward sings and dances for three whole days
    and nights without interruption.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The physician declares the event the greatest miracle of any prophet or saint
    and joins Jelāl’s disciples with his family and many leading medical professionals.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Perwāna publicly says that Jelāl is a matchless monarch but that his disciples
    are disreputable.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Jelāl replies in a note that he accepted bad disciples so that they might
    reform and become righteous, after God had made Himself responsible for their
    attainment of mercy and grace.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: After reading Jelāl’s words, the Perwāna becomes more attached to him, asks
    pardon, prays for forgiveness, and distributes bounty among the disciples.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Another man calls Jelāl a great saint and sovereign but says he should be
    dragged away from his disciples; Jelāl answers that his followers are beloved
    of God and says they alone remained after he sifted humankind.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A young merchant near Jelāl’s college, already a sincere disciple, desires
    a voyage to Egypt; friends try to dissuade him, and Jelāl strictly prohibits the
    voyage.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The merchant secretly leaves by night, travels to Syria, embarks at Antioch,
    is captured by Firengī pirates, and is confined in a deep dungeon with meagre
    daily food.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The merchant remains imprisoned forty days, weeps, and reproaches himself
    for disobeying Jelāl’s command.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: On the fortieth night the merchant dreams of Jelāl, who tells him to answer
    any questions from the misbelievers with the words, “I know,” and says this will
    release him.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: Firengī people ask through an interpreter whether the merchant knows philosophy
    and therapeutics for their sick prince; he answers, “I know,” and is taken from
    the pit, bathed, dressed in a vestment of honour, and led to the sick man.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: Inspired of God, the merchant prepares seven fruits with scammony into a draught,
    administers it, and the prince recovers after two or three visits; the passage
    says Jelāl’s favor made the illiterate merchant a philosopher.
  category: action
  evidence_refs:
  - ev:14
