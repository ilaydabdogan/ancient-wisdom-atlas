canonical_text:
  quote: ''
  summary: Animal speakers argue about reliance on means, Providence, and human exertion.
    A frightened man asks Solomon to send him to Hindūstān after seeing the angel
    of death; the angel later explains that God had commanded him to take the man's
    soul there. The narrator states that earthly events are ordained by God. The lion
    counters that exertion can itself be commanded by Providence, using images of
    prison, sea, ship, jar, poverty, and wisdom; the other animals abandon the compulsionist
    position.
  language: English
  quote_policy: summarized
