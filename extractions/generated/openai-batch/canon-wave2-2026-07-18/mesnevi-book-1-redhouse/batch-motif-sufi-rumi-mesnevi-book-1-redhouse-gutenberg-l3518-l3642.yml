- id: motif:4
  label: Fire ordeal differentiates saint and questioner
  taxonomy_refs:
  - divine_judgment
  - fire
  basis: Jelāl responds to the monk’s question about hell-fire by placing a cloak
    and cassock in an oven; the cloak emerges clean while the cassock is destroyed,
    and Jelāl interprets this as different ways of entering the fire.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The event is presented as a saintly demonstration, not as a formal trial
