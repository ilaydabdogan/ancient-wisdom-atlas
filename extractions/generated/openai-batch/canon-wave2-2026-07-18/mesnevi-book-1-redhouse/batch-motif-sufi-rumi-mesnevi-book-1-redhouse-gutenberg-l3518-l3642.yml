  summary: The passage presents a lyric image of sighs placed in a deep well becoming
    reeds and moaning flutes; recounts Siddīqa’s visions and Jelāl’s explanation of
    differing spiritual experiences; narrates a monk’s conversion after Jelāl demonstrates
    a fire ordeal with a cloak and cassock; and explains Husāmu-’d-Dīn’s role in prompting
    and recording the Mesnevī.
