  label: Visionary access to heavenly beings and departed souls
  taxonomy_refs:
  - mystical_quest
  basis: Siddīqa sees heavenly lights and is visited by angels and souls of the departed;
    Jelāl explains visions as part of differing paths toward or away from divine nearness.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
