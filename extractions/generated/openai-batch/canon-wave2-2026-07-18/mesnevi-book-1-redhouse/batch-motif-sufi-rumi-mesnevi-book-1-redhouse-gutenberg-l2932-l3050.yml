comparison_claims:
- id: claim:1
  claim: The Sheykh explicitly connects Jelāl’s silence to the Qur’anic phrase rendered
    in the passage as “Hold ye your peace,” using the citation to interpret silence
    as the proper spiritual response.
  claim_level: same_function
  target: Qur’ān xlvi. 28 as cited in the passage
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the citation and function of silence as
    presented by the Sheykh.
- id: claim:2
  claim: 'The Cubical House vision uses the pilgrimage/circumambulation pattern but
    reverses the expected spatial relation: the sacred house circles Jelāl rather
    than the pilgrim circling the sacred house.'
  claim_level: same_function
  target: Mekka pilgrimage and circumambulation pattern within the passage
  evidence_refs:
  - ev:9
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not describe ordinary circumambulation practice in
    detail; the reversal is inferred from the stated pilgrimage context and the House’s
    circling action.
- id: claim:3
  claim: The passage itself makes a visual comparison between the Cubical House’s
    spinning motion and a dervish in his waltz.
  claim_level: visual_similarity
  target: dervish waltz or spinning
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: This is a visual simile within the passage, not a claim of historical
    origin.
- id: claim:4
  claim: The students’ question explicitly invokes the dog of the Seven Sleepers tradition,
