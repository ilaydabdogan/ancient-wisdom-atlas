canonical_text:
  quote: ''
  summary: 'The passage recounts several legends about Jelāl: a new-year new-moon
    prayer, a fever cure using an invocation washed into water and drunk, a silent
    response to a dervish’s question and the dervish’s subsequent death, Fakhru-’n-Nisā’s
    vision of the Cubical House of Mekka circling Jelāl, Jelāl’s answer about the
    dog of the Seven Sleepers, and Jelāl’s seven-day retreat in cold water inside
    a cavern.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jelāl customarily looked for the new moon of the Arabian new year and prayed
    to God for steadfastness against Satan and the rebellious spirit, occupation in
    what would bring him near to God, and avoidance of what would distance him from
    God.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jelāl cured a disciple’s intermittent fever by writing an invocation on paper,
    washing the ink into water, and giving the water to the patient to drink; the
    patient was immediately relieved under God’s favour.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The healing invocation addresses the fever as a named female figure, commands
    it not to harm the patient’s head, throat, flesh, or blood, and tells it to depart
    from the patient.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Jelāl visited a great Sheykh; they sat on the same carpet and entered ecstatic
    heart-communion with the world of spirits.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A dervish repeatedly asked Jelāl, “What is poverty?”, and Jelāl gave no spoken
    answer.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The great Sheykh later told the dervish that Jelāl had answered by silence,
    explaining that one who has known God has his tongue tied and does not speak in
    the presence of saints, neither with tongue nor heart.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Sheykh warned the dervish to prepare for his end, saying he had been struck
    by a shaft from heaven; three days later, a gang attacked and killed the dervish
    and took his possessions.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: Fakhru-’n-Nisā is described as a lady-saint in Qonya, known to holy men, associated
    with many miracles, and connected with Jelāl’s meetings and visits.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Before Fakhru-’n-Nisā spoke about her possible pilgrimage to Mekka, Jelāl
    addressed her intention and said the journey would be prosperous and that they
    would be together.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: After a night vigil on the roof, Jelāl entered ecstasy, summoned Fakhru-’n-Nisā
    upward, and told her to look up.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Fakhru-’n-Nisā saw the Cubical House of Mekka in the air, circling Jelāl’s
    head and spinning like a dervish; she screamed, swooned, and afterward abandoned
    the idea of making the pilgrimage.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: A company of students tested Jelāl by asking the color of the dog of the Seven
    Sleepers; Jelāl answered that it was yellow because a lover is sallow, and the
    students then became disciples.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: At the monastery of Plato, which stood at the foot of a hill with a cavern
    and a cold stream, Jelāl entered the cavern, stayed seven days and nights seated
    in the cold water, and emerged singing with no visible change in his features
    or eyes.
  category: sequence
  evidence_refs:
  - ev:13
