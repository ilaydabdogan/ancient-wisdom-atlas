- id: motif:4
  label: Saintly silence as spiritual answer
  taxonomy_refs:
  - wisdom
  basis: Jelāl’s silence in response to the dervish’s repeated question is interpreted
    by the Sheykh as the full answer to what poverty is.
  evidence_refs:
