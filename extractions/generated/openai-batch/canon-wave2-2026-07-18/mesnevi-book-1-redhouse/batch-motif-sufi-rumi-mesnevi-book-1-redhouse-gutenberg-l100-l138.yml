canonical_text:
  quote: ''
  summary: Front matter identifies the collector-historian, translator, publisher,
    and date. A French bibliographic notice attributed to D'Herbelot describes the
    Mathnaoui/Methnevi/Mesnevī as a famous Oriental book in Persian verse on religion,
    history, morals, and politics; attributes it to Gelaleddin Mohammed, son of Mohammed,
    Al Balkhi, Al Konoui, around AH 600; explains his Balkhi and Konoui names by birthplace
    and settlement; says he instituted the Mevlevi dervish order; and notes the order's
    reverence for the work, many commentaries, and the esteem of its verses.
  language: English and French
