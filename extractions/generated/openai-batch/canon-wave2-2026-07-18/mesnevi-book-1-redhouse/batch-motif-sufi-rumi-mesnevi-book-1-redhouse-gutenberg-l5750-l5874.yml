canonical_text:
  quote: ''
  summary: A physician questions a sick maiden about places and acquaintances while
    monitoring her pulse, discovers her hidden love for a goldsmith in Samarqand,
    and counsels secrecy. He tells the prince to summon the goldsmith with honors
    and gold. The goldsmith comes, is appointed to offices, and is united with the
    maiden, whose health improves. Later the physician gives the goldsmith a potion
    that causes wasting and loss of beauty, after which the passage adds moral examples
    of beings harmed for valued attributes such as plumage, musk, fur, and ivory.
  language: English
  quote_policy: summarized
