canonical_text:
  quote: ''
  summary: 'A speaker attributes success to God''s grace and warns against boasting
    in transient prosperity. The passage then teaches the Greater Spiritual Warfare:
    the external foe has been defeated, but the inner foe of fleshly lust remains.
    Flesh is compared to hell and a fiery dragon, insatiable until God restrains it.
    The speaker exhorts trust in God, conquering one''s own flesh, and purification
    of perception. A tale begins in which Caesar''s ambassador seeks Caliph ‘Umer''s
    palace, but the people say ‘Umer has no palace except an enlightened mind and
    a humble hut. Further examples describe a cleansed heart seeing God''s countenance,
    vices blocking sight like fingertips over the eyes, Noah rebuking people whose
    covered heads prevent sight, and the true eye striving to see the Friend.'
  language: English
  quote_policy: summarized
