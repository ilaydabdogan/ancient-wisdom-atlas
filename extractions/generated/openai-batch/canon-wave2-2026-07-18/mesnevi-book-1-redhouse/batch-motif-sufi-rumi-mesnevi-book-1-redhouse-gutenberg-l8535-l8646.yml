- id: motif:2
  label: Renunciation of transient world for eternal bliss
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: The passage urges abandoning worldly ease and earthly pomp in exchange for
    eternal rest and the soul's enjoyment of heaven's cup.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The motif is expressed didactically, not through an extended quest episode.
- id: motif:3
  label: Greater warfare against the inner foe
  taxonomy_refs:
  - mystical_quest
  - initiation
  - wisdom
  basis: The passage explicitly names the Greater Spiritual Warfare, contrasts outward
    warfare with inner life, and identifies the conquest of flesh as the mark of a
    true lion.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The taxonomy labels are broad; the passage's own wording is specifically
    moral and Sufi-Islamic.
