candidate_motifs:
- id: motif:1
  label: Respect for an elder rewarded by divine accommodation
  taxonomy_refs:
  - wisdom
  basis: "‘Alī refuses to pass an old man out of respect for age, and Gabriel stops
    the Prophet by God’s command so ‘Alī will not lose the merit of dawn worship."
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage presents this as a didactic religious anecdote; it does not
    describe a broader myth cycle beyond this exemplum.
- id: motif:2
  label: Attachment to spiritual elders as source of blessing
  taxonomy_refs:
  - wisdom
  - initiation
  basis: Jelāl urges hearers to hold fast to spiritual elders and says their blessing
    is necessary for a young man to reach old age and the station of spiritual elder.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The link to initiation is interpretive and limited to spiritual progression
    language in the passage.
- id: motif:3
  label: Universal praise through creaturely voices
  taxonomy_refs:
  - wisdom
  basis: Jelāl states that animals, angels, genii, and humans each have cries, lessons,
    doxologies, or worship commemorating their Maker and Provider.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage lists examples rather than developing a full cosmological
    account of all beings.
- id: motif:4
  label: Animal appetite as moral mirror for humans
  taxonomy_refs:
  - wisdom
  basis: The ass’s bray is explained as arising from hunger or sexual desire, and
    Jelāl says a human without inner doxology and love is less than an ass in God’s
    esteem.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The motif is moralizing and sermonic; it should not be treated as zoological
    description.
- id: motif:5
  label: Ass as humble mount of prophets and righteous persons
  taxonomy_refs:
  - wisdom
  basis: Jelāl calls the ass the saddle-beast of the righteous and says several prophets,
    including Seth, Ezra, Jesus, and Muhammed, rode asses.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage supplies a list of prophetic examples but no extended narrative
    for each prophet.
- id: motif:6
  label: Compassionate reversal between rider and burden-bearing beast
  taxonomy_refs:
  - wisdom
  basis: Jelāl asks the disciple to give thanks for being the rider rather than the
    vehicle and rebukes him for striking the animal that bears his burden; the disciple
    then shows remorse toward the ass.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: The reversal is posed rhetorically by Jelāl and does not literally occur.
