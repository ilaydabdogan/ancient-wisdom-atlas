canonical_text:
  quote: ''
  summary: Jelāl teaches that respect for elders is divinely valued, illustrates this
    with a story in which ‘Alī delays rather than pass an old Jewish man and Gabriel
    halts the Prophet’s dawn worship so ‘Alī will not lose its merit, then urges attachment
    to spiritual elders. He next expounds Qur’anic references to the ass, contrasting
    creaturely doxologies with the ass’s bray and with humans lacking inner remembrance.
    A final anecdote shows Jelāl riding an ass, rebuking a disciple for striking a
    braying ass, and prompting the disciple to show remorse toward the animal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jelāl states that, in former days, a young man who took precedence over an
    elder was subject to divine punishment by being swallowed by the earth, and he
    also mentions fear of transformation into apes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: "‘Alī, while going to dawn devotions in the Prophet’s mosque, overtakes an
    old Jewish man but does not pass him because of respect for his age."
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gabriel descends by God’s command, lays his hand on the Prophet’s shoulder,
    and stops him before the opening portion of the dawn service so that ‘Alī will
    not lose its merit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After worship, the Prophet asks Gabriel why he interrupted him, and Gabriel
    explains that God did not wish ‘Alī to be deprived of merit because of his respect
    for the old Jew.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Jelāl concludes that if respect shown to an old Jewish man was so favorably
    regarded, then honor shown to an elderly saint of approved piety will receive
    reward, and he quotes Qur’ān lxiii. 8.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Jelāl tells his hearers to take fast hold of the skirts of their spiritual
    elders and says a young man without their blessing will not attain old age or
    the station of spiritual elder.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Jelāl quotes Qur’ān xxxi. 18 about the voice of asses and asks his friends
    what it signifies; the congregation asks him to explain.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Jelāl says other animals, as well as angels, genii, and humans, have cries,
    lessons, doxologies, or forms of worship by which they commemorate their Maker
    and Provider.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Jelāl says the ass has only its bray, sounded when it desires its female or
    feels hunger, and compares a human without inward doxology, love, secret, and
    care to something less than an ass in God’s esteem.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Jelāl relates an anecdote in which one monarch asks another sovereign for
    the worst food, worst-dispositioned thing, and worst animal, and receives cheese,
    an Armenian slave, and an ass.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Jelāl goes to the country residence of Husāmu-’d-Dīn riding on an ass and
    calls the ass the saddle-beast of the righteous, naming several prophets who rode
    asses.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: A disciple riding another ass becomes annoyed when it brays and strikes it
    several times on the head.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Jelāl rebukes the disciple for striking the burden-bearing animal, asks whether
    he gives thanks for being the rider rather than the vehicle, and says the ass’s
    cry comes from gullet or lust, conditions shared by creatures.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: The disciple is abashed, dismounts, kisses the hoof of his ass, and caresses
    it.
  category: action
  evidence_refs:
  - ev:14
