canonical_text:
  quote: ''
  summary: The passage presents death as outward loss but inward life, union, and
    return. A servant asks ‘Alī to kill him to escape sin; ‘Alī replies that providence
    governs the event and promises intercession. The passage praises bodily detachment,
    denies worldly motives in the Prophet’s conquest of Mecca, warns against tainted
    perception and Satanic envy, contrasts worldly and eternal lionhood, presents
    wishing for death as a test the recusants refuse, and ends by exhorting hearers
    to leave doubt and darkness for bliss, light, and heaven’s gate.
  language: English
  quote_policy: summarized
