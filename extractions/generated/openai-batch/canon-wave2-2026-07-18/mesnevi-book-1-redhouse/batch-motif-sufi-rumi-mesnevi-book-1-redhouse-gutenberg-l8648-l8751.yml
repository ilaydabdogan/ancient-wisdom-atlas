  quote: ''
  summary: Rome’s ambassador seeks ‘Umer, is directed by a desert-Arab woman to find
    him sleeping beneath a date-palm, and is overcome by awe before the weaponless
    Caliph. ‘Umer wakes, greets and reassures him, then teaches about divine attributes,
    saintly ecstasy, spiritual stations, the soul’s descent, and God’s creative command
    by which nonexistence, matter, flowers, stones, sun, eclipse, and clouds are transformed.
  language: English
  quote_policy: summarized
