canonical_text:
  quote: ''
  summary: The passage contrasts outward wakefulness with spiritual sleep, depicts
    people wasting life by chasing dreamlike phantoms and shadows, urges reliance
    on God and saintly guides, warns against envy through the examples of Satan and
    a deceitful Vazir, and closes with didactic warnings about deceptive appearances,
    corrupt speech, fire, lightning, and lack of sense.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that a person can seem awake while being spiritually asleep
    if not awake to God's truth, and that such a soul is enslaved to fancy and worldly
    anxieties.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sleeper sees a demon and takes it for an angel, experiences sensual pleasure
    in a dream, and wakes to find no harvest from seed sown in barren land.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A bird flies in the air while its shadow moves on earth; a fool treats the
    shadow as another bird, pursues it, shoots arrows at it, and returns empty-handed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Human life is compared to a quiver, and years spent chasing phantoms are said
    to end in grief.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: God's protection is invoked so that fancies and phantoms may be exposed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: God's servants and saints are described as God's shadows on earth, dead to
    this world but living in a second birth; the addressee is told to cling to them
    and accept their guidance.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The passage warns not to thread the maze without saintly guidance, cites Abraham's
    rejection of fading things, and names Tebrīz' Sun and Husāmu-’d-Dīn as sources
    of consolation or direction.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Envy is described as Satan's sin; Satan envied Adam's rise, and envy is portrayed
    as a heavy burden on the steep mountain-pass of life.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The flesh is called a hot-bed of envy and strife; if envy seeks to kill the
    soul, the addressee is told to invoke the merciful Lord.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A divine command to clean God's house is applied to the human frame, described
    as a house of glory made of clay.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Vazīr of the Jewish king is described as envy itself; he sacrifices his
    nose and ears and is warned against as a killer of men's faith and a sham pastor
    of truth.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Discerners detect the Vazīr's knavish plan in honeyed phrases; his speech
    is compared to sweet syrup or jam mixed with bitter or poisonous matter.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Evil-minded speech is said not to be good because the hearts behind it are
    dead and putrid.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: "‘Ali is cited as saying foolish words grow like weeds on dunghills and quickly
    fade; the passage also says pollution must be washed away for worship to be valid."
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Vazīr's speech urges diligence in prayer, while his actions proclaim neglect
