canonical_text:
  quote: ''
  summary: The passage gives a genealogy of Jelālu-’d-Dīn Rūmī, tracing paternal ancestry
    through Abū-Bekr, Quraysh, Ishmael, and Abraham; noting settlement at Balkh, royal
    marriages, Bahā Veled’s departure before the Mongol devastation, Rūmī’s children,
    and successors in the Mevlevī line. It then distinguishes this natural dynasty
    from a spiritual series in which dervish mysteries are transmitted from Muhammed
    through ‘Ālī and successive teachers to figures in Rūmī’s family and order.
  language: English
  quote_policy: summarized
