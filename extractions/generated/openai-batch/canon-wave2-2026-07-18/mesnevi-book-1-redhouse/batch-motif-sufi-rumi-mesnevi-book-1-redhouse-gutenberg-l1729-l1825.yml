canonical_text:
  quote: ''
  summary: Jelāl responds to praise of the Perwāna with a parable of a fallen camel
    protected by an amulet and interprets himself as a world-protecting amulet whose
    removal will precede disorder. A later exposition explains that God comprises
    all things and convinces an objecting dervish. In another episode, Jelāl redirects
    a grieving father from the search for a lost son toward seeking God; the son is
    then reported found. The passage ends as a young man enters a lecture and takes
    a higher seat than an elder.
  language: English
  quote_policy: summarized
