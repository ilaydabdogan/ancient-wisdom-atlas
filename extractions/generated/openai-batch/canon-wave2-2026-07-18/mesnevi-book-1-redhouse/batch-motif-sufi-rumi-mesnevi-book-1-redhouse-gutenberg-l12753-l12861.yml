canonical_text:
  quote: ''
  summary: A former amanuensis of the Prophet writes down revelations, receives illumination
    from them, and wrongly attributes that illumination to his own genius. His pride
    leads to apostasy and spiritual bondage. The narrator turns the episode into counsel
    against presumption, using images of borrowed light, reflected fire, journey stages,
    bodily decay after the spirit departs, and humility before divine judgment.
  language: English
  quote_policy: summarized
