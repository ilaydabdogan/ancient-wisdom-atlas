canonical_text:
  quote: |-
    The heart is never lonesome in that vast abode;
    Its green trees never wither, frosts no leaves corrode.
  summary: The passage moves from a description of an old royal court arrangement
    and holy teachers as polished mirrors, to Joseph receiving a childhood friend
    and interpreting his sufferings through images of constrained nobility and transformation.
    It then develops the theme of arriving with gifts, applying it to divine judgment
    and afterlife preparation, and closes with sleep, saints, the Sleepers Seven,
    right- and left-hand registers, and the saintly state beyond ordinary good and
    evil accounting.
  language: English
  quote_policy: quoted
