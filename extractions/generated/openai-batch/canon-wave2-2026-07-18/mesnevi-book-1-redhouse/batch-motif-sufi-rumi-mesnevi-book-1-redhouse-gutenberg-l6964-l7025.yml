canonical_text:
  quote: ''
  summary: The speaker pauses a difficult argument, warning that abstract disputation
    cuts like a sword, then resumes a tale in which rival captains use scrolls to
    claim succession after a dead Vazīr, leading to factional violence and mass slaughter.
    The passage then moralizes that spirit and sense give value to words and life,
    contrasts wooden and adamant swords, and directs the reader toward spirit-seekers
    and saints.
