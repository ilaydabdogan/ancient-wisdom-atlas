canonical_text:
  quote: ''
  summary: "‘Alī answers that he fights only for truth and God, describing himself
    as God’s servant, instrument, shadow, and sword rather than an agent of passion.
    He contrasts divine steadiness with anger, lust, greed, slavery, and self-caused
    falling into a bottomless pit. He then addresses his opponent as freed by God’s
    grace and transformed from flint to pearl and from blasphemy’s desert to faith’s
    garden, citing ‘Umer and Pharaoh’s magicians as examples of transgression becoming
    an occasion for conversion."
  language: English
  quote_policy: summarized
