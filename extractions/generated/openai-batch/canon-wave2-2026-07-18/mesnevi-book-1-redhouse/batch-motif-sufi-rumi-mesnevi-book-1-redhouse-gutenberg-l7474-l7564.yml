canonical_text:
  quote: ''
  summary: A lion and unnamed respondents debate trust in Providence, caution, compulsion,
    and work. The respondents urge reliance on divine decree and cite self-defeating
    stratagems and Pharaoh's failure to avoid Moses. The lion replies that trust in
    God must be joined to practical means, responsibility, gratitude, and action,
    using images of a bound camel, ladder, spade, Tree of Life, hell-fire, and sowing
    before harvest.
  language: English
  quote_policy: summarized
