canonical_text:
  quote: ''
  summary: A group of beasts make a treaty with a lion, agreeing to send him a daily
    victim by lot. When the lot falls on the hare, he asks for a delay and promises
    to use a stratagem to save them all. The beasts doubt him because he is small,
    but he argues that God can place wisdom in small creatures and in unexpected forms.
    The passage then expands into reflections on Adam's knowledge, inner life over
    outward form, the honored dog of the Seven Sleepers, Solomon's wisdom, hidden
    dangers, patience, and saintly guidance.
  language: English
  quote_policy: summarized
