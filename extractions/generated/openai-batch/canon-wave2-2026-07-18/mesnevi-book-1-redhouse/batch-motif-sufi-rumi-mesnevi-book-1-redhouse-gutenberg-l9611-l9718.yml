canonical_text:
  quote: ''
  summary: A departing speaker bids farewell to a master, gives advice to a merchant,
    and flies away; the merchant treats the event as a lesson. The passage then moralizes
    through images of the body as a cage for the soul, the danger of flattery, the
    mortification of flesh, Satan’s relation to human vice, dependence on divine grace,
    the drop from the sea of God’s knowledge, creation from nonentity, and nightly
    sleep followed by morning renewal.
  language: English
  quote_policy: summarized
