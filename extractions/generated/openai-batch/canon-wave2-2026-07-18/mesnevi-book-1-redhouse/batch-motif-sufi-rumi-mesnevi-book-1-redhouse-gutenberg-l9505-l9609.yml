canonical_text:
  quote: ''
  summary: 'The passage opens with a devotional lyric addressed to Beauty or a beloved
    Thou as the source of love’s pain, dawn, light, life, and spiritual wine. It then
    returns to the story of a merchant and his parrot: the merchant casts the apparently
    dead parrot from its cage, the parrot flies to a tree, and explains that another
    bird taught it to gain freedom by counterfeiting death. The passage closes with
    moral aphorisms about vulnerability, timing, and seeking refuge in God’s mercy,
    followed by compressed examples in which water, fire, and mountain protect or
    defeat named figures.'
