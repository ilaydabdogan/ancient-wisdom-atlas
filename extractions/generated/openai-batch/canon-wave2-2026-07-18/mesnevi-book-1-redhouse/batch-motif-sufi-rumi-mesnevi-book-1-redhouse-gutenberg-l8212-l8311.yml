canonical_text:
  quote: ''
  summary: A crow challenges the hoopoe’s claim before Solomon by pointing to traps
    that catch the hoopoe. Solomon questions the hoopoe, who defends himself and accuses
    the crow of denying Providence. The narrator reflects on divine decree, blindness,
    snares, Adam’s knowledge of names, the difference between human and divine naming,
    Adam’s prohibition and eating of wheat, repentance, and Providence as both threatening
    and saving. The passage then returns to the lion and hare, who arrive at a well
    where the hare hesitates and the lion urges him onward.
  language: English
  quote_policy: summarized
