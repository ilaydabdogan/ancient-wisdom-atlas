canonical_text:
  quote: ''
  summary: A lion mistakes its own reflection in a well for an enemy and destroys
    itself. The passage draws a moral lesson about seeing one’s own faults in others,
    uses mirror and colored-glass imagery for perception, prays for divine mercy to
    transform sinful fire into light, and narrates the hare’s joyful return to the
    beasts after the lion’s death. Plant growth, imprisoned souls rising, and the
    beasts’ praise of the hare and God are used as further images of deliverance and
    joy.
  language: English
  quote_policy: summarized
