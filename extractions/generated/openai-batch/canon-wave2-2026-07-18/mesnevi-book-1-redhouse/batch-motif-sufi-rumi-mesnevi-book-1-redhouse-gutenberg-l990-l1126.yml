  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sultan Veled related that a paper in Bahā Veled’s handwriting described Jelāl
    at age six on a terraced roof, reciting the Qur’ān with other children present.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: One child proposed jumping from the roof to a neighboring terrace and wagering
    on the result.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Jelāl rejected terrace-jumping as fit for animals and proposed springing to
    the firmament and visiting the regions of God’s realm.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: As he spoke, Jelāl vanished from the children’s sight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The children cried out in fear; Jelāl then reappeared among them with changed
    expression and blanched cheeks.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The other children uncovered, fell to the earth in humility, and declared
    themselves his disciples.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Jelāl said that visible forms in green raiment had led him away, conducted
    him through concentric celestial orbs and zodiacal signs, shown him wonders of
