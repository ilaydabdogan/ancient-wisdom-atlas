canonical_text:
  quote: ''
  summary: 'The passage recounts childhood and youth traditions about Jelālu-’d-Dīn:
    his birth at Balkh; childhood visions of beings from the invisible world; his
    father’s explanation of these beings and bestowal of the title Khudāvendgār; a
    rooftop episode in which the six-year-old vanishes and later reports being guided
    through celestial spheres; accounts of fasting, exalted lineage, a divine vision
    at age seven, and a later Aleppo study episode involving jealousy and investigation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jelālu-’d-Dīn is said to have been born at Balkh on 6 Rebī’u-’l-evvel A.H.
    604, corresponding to 29 September 1207.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: At age five he sometimes became very uneasy and restless, and attendants gathered
    around him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that spiritual forms and shapes from the absent or invisible
    world appeared before his sight in bodily shape.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The appearing beings are described as angelic messengers, righteous genii,
    and saintly men, called concealed ones of the bowers of the True One.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: His father Bahā’u-’d-Dīn Veled soothed him by saying that these were Occult
    Existences presenting gifts from the invisible world.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: His father conferred or used the honorific title Khudāvendgār, interpreted
