  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: At age seven Jelāl recited Qur’ān chapter cviii every morning and wept while
    reciting it.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: The passage says that God appeared visibly to Jelāl, after which he fainted
