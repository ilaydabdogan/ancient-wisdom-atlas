canonical_text:
  quote: ''
  summary: 'The Prophet teaches through images of perception, command, and obedience:
    small things may obscure great lights; the sea, rivers, senses, and limbs are
    made obedient by divine command or by the heart. The heart is compared to Solomon
    ruling by a seal, with warning that a demon may steal the seal if the heart acts
    fraudulently. A story follows in which Luqman is falsely accused by other slaves
    of eating fruit; he proposes a hot-water and running ordeal that makes the guilty
    vomit the stolen fruit while he produces only clear water. The passage closes
    by linking this disclosure to the final revealing of hearts’ secrets, scalding
    water, and hell-fire.'
  language: English
  quote_policy: summarized
