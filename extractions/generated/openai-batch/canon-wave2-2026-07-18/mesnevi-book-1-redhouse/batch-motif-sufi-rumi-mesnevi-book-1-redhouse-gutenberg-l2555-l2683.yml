canonical_text:
  quote: ''
  summary: 'The passage recounts several episodes concerning Jelāl: he admonishes
    the Perwāna, who reforms and becomes a disciple; pilgrims from Mekka recognize
    Jelāl as having been with them during pilgrimage rites despite his presence in
    Qonya; Jelāl sends a bowl of sweetmeat to an absent pilgrim at ‘Arafāt; he silences
    frogs during a discourse and later permits them to croak again; and he protects
    a heifer from slaughter, then uses the event to teach that a human who turns to
    God will be saved from hell-fire and led to heaven.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jelāl tells the Perwāna that he knows the Word of God and the reported words
    and acts of the Apostle but does not act according to them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Perwāna is abashed, weeps, begins to execute justice, and is accepted
    by Jelāl as a disciple.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A company of pilgrims arriving from Mekka to Qonya faint when they see Jelāl
    seated in his college.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pilgrims state that Jelāl was with them at Mekka, ‘Arafāt, and Medina,
    wearing the same dress, and that he never ate or drank with them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A disciple’s wife sends Jelāl a china bowl of sweetmeat and asks that he remember,
    pray for, and bless her absent husband during pilgrimage.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Jelāl’s disciples eat the sweetmeat to repletion, but the bowl remains full.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Jelāl takes the bowl to the terraced roof and returns without it, saying he
    has handed it to the woman’s husband.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When the pilgrims return, the same china bowl is found in the merchant’s baggage;
    the husband reports that an arm placed the dish before him in his tent at ‘Arafāt
    and that no bringer was found.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Jelāl says the event occurred through the couple’s trust and belief, and that
    God used his hand to manifest divine power.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the Hot Waters near Qonya, frogs make Jelāl’s discourse inaudible until
    he commands them either to deliver a discourse or allow him to speak.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The frogs immediately become silent and are not heard to croak again while
    Jelāl remains there; when he later gives permission, their croaking resumes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: A heifer being led to slaughter breaks loose, becomes furious, then becomes
    calm on seeing Jelāl and comes gently toward him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Jelāl caresses the heifer and asks the butchers to spare her because she has
    placed herself under his protection; they agree and release her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Jelāl tells his disciples that if a brute beast taking refuge with him receives
    immunity, then a human turning to God with heart and soul will be saved from hell-fire
    and led to heaven.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: After Jelāl’s teaching about the heifer, the disciples begin a musical festival
