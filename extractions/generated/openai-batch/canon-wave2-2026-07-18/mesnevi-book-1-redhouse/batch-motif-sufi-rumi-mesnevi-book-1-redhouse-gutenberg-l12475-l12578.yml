canonical_text:
  quote: ''
  summary: A lion asks a fox to divide seized prey. The fox assigns the ox, ibex,
    and hare to the lion, saying he learned from the dead wolf. The lion praises the
    fox, grants him all the prey, and treats his self-effacement as unity with the
    lion. The narrator turns the fable into a lesson about learning from past divine
    judgments. Noah speaks as one who has sacrificed self and whose light, mind, sight,
    and breath are from God; hidden lion power is said to dwell in his fox-like form.
    The passage warns against pride toward saints, counsels abandoning “I” and “We”
    before God, and describes the pure heart as a mirror known and tested by God.
  language: English
  quote_policy: summarized
