canonical_text:
  quote: ''
  summary: A woman rebukes her husband for speaking of contentment and honor while
    they are cold, hungry, poorly clothed, and living in a hole-ridden tent. She likens
    his wisdom to venom and tells a parable of a snake-charmer ensnared by the snake
    and by greed. The husband answers by defending poverty as spiritual pride, presenting
    wealth and clothing as coverings for defects, describing dervishes as reliant
    on God rather than wealth, and claiming that contentment has overcome greed in
    him.
  language: English
  quote_policy: summarized
