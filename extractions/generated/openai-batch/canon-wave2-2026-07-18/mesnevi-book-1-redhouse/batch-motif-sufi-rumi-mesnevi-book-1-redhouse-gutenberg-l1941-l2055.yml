canonical_text:
  quote: ''
  summary: The passage presents admonitory anecdotes about poverty, love of the Prophet,
    and the moral use of wealth, followed by an account of Jelāl entering the Perwāna’s
    assembly, sitting on the floor despite a seating hierarchy, defining the chief
    seat as where the beloved is found, and being followed by ecstatic singing. It
    also reports the later blindness and repentance of the interlocutor, plus a variant
    in which Jelāl identifies Shems of Tebrīz by embracing him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A disciple complains to Jelāl about limited means and many needs; Jelāl tells
    him not to count Jelāl as a friend so that wealth may perhaps come to him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Jelāl’s anecdote, a disciple tells the Prophet that he loves him; the Prophet
    tells him to put on a steel breastplate, face misfortunes, and endure straitness
    as a special gift for friends and lovers of God and the Apostle.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Gnostic adept asks a rich man whether he loves riches or sin more, and then
    argues that the man loves sin and calamity because he leaves riches behind while
    carrying sin and calamity with him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Gnostic adept instructs the rich man to send his riches to God before
    going before God himself, citing good works found with God.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Perwāna holds a large palace assembly with Doctors of the Law, Sheykhs,
    pious men, recluses, and strangers; the chiefs of the law occupy the highest seats.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Some chiefs of the law become suspicious about where Jelāl would sit if he
    came and agree that they are already in their proper places.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mejdu-’d-Dīn, the Perwāna’s son-in-law and a disciple of Jelāl, invites Jelāl
    to the assembly; Jelāl sets out with Husāmu-’d-Dīn and other disciples.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Husāmu-’d-Dīn enters first and is received with room in the upper seats; Jelāl
    enters later and is received with honor by the Perwāna and courtiers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Seeing the sofa occupied end to end, Jelāl salutes and prays for the assembly,
    then seats himself in the middle of the floor; Husāmu-’d-Dīn leaves his seat and
    sits beside him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Many grandees leave the sofa and sit on the floor, while some who had formed
    the earlier confederacy remain seated.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: An interlocutor asks where the chief seat is according to Jelāl’s rule; Jelāl
    answers that the chief seat is where one’s beloved is found, and when asked where
    his beloved is, replies that the questioner must be blind not to see.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Jelāl rises and sings; many join, and the singing becomes so enthusiastic
    that nobles tear their garments.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: After Jelāl’s death, the interlocutor goes to Damascus and becomes blind;
    he says that at the moment of Jelāl’s answer a black veil seemed to fall over
    his eyes, and he hopes for Jelāl’s pardon.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: In a reported variation, Shemsu-’d-Dīn of Tebrīz accompanies Jelāl, sits near
    him on the floor, and Jelāl casts himself on Shems’s breast when asked where his
    beloved is.
  category: sequence
  evidence_refs:
  - ev:10
