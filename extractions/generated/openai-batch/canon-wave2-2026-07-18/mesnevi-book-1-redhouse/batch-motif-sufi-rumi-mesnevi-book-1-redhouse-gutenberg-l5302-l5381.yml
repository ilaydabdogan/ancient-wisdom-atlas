canonical_text:
  quote: ''
  summary: The preface identifies the Mesnevi as a book of rhymed couplets containing
    religious roots, mysteries of reunion, and sure knowledge. It praises the book
    through images of divine light, paradise, springs, Salsabil, the Nile, spiritual
    nourishment, Qur'anic exposition, purified touch, and divine preservation. The
    authorial speaker says he enlarged the book at the request of Sheykh Hasan, praises
    Hasan as a spiritual guide and heir to saintly exemplars, and closes with blessings
    and prayer.
  language: English
  quote_policy: summarized
