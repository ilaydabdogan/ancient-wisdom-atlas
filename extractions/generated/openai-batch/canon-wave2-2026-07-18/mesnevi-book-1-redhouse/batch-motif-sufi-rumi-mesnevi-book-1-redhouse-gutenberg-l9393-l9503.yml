  quote: ''
  summary: The speaker counsels silence before love, describes union with God as drowning
    like a wave in the sea, and portrays the lover’s life as self-sacrifice. He reflects
    on concealed meanings, divine jealousy, and courtly analogies of rank. The speaker
    then laments love’s chastening, valuing pain and tears when they please the beloved
    God, and prays to God as the source of justice. The passage closes by contrasting
    “I” and “we” with divine oneness and by placing love beyond pleasure and pain,
    spring and autumn.
