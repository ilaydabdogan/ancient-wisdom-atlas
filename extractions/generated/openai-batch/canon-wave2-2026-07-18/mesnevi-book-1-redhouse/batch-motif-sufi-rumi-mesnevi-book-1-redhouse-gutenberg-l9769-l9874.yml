canonical_text:
  quote: ''
  summary: 'The section titled “The Harper” introduces a gifted minstrel in the days
    of ‘Umer, then expands into reflections on sacred sound: Isrāfīl’s trumpet, prophets
    and saints as musicians of hearts, the voice of God raising the spiritually dead,
    divine speech through Ahmed, Adam receiving the true names, and the transmission
    of light and knowledge through disciples, teachers, vessels, stars, and lamps.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A talented harper or minstrel is introduced as living in the days of good
    ‘Umer; his harpings, voice, and songs move hearers and gladden gatherings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The harper’s voice is compared to the voice of Isrāfīl, whose trumpet on judgment
    day wakes the dead to life.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Isrāfīl is said to recall souls to old bones, and prophets are described as
    musicians upon hearts whose strains outward ears do not hear.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Men and fairies are described as prisoners in an earthly cage and as subject
    to sinful ignorance.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The hearts of saints are said to sing an inward hymn that begins from “NOT”
