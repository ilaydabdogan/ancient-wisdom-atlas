  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker says that if one stave from the saints’ blessed song were recited,
    living souls would rise from tombs, though permission to tell it has not yet been
    given.
  category: speech
  evidence_refs:
  - ev:5
