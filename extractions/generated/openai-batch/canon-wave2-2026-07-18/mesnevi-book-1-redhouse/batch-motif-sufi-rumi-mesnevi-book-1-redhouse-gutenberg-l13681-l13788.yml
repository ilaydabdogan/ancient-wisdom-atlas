canonical_text:
  quote: ''
  summary: The passage describes angels and prophetic disciples as graded bearers
    of divine light for weaker human sight; the moon speaks as a lesser light made
    luminous by revelation. It then turns to the purified heart, Zeyd’s disappearance
    in overwhelming divine brightness, resurrection and judgment, divine command over
    nonentity, demons, and Solomon, exhortation to seek wisdom and life, and a final
    analogy of hostile fire and water.
  language: English
  quote_policy: summarized
