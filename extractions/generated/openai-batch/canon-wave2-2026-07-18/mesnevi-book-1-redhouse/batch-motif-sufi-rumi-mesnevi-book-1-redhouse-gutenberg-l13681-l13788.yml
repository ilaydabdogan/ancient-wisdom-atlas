- id: motif:1
  label: Mediated divine light for limited human sight
  taxonomy_refs:
  - wisdom
  basis: Angels, disciples, moon, stars, tapers, and lamps all function as lesser
    or reflected lights for beings unable to face the sun directly.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage presents this primarily as didactic imagery; the available
    taxonomy has only the broad category of wisdom for this pattern.
- id: motif:2
  label: Resurrection before divine judgment
  taxonomy_refs:
  - resurrection
  - divine_judgment
  basis: The dead are restored, stand before God, praise Him for raising them, cast
    off mortal remains, and pass from nullity to entity on judgment day.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage is poetic and exhortative, but the resurrection and judgment
    language is explicit.
- id: motif:3
  label: Disappearance of the self in overwhelming divine light
  taxonomy_refs:
  - annihilation_union
  basis: Zeyd leaves no sign like stars extinguished in sunlight, and human senses
    and reasoning are lost in the splendour of divine wisdom.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage supports disappearance and loss in divine brightness; union
    is not explicitly named in this excerpt.
- id: motif:4
  label: Quest for life and wisdom through night or gloom
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: The addressee is told to employ the night to seek everlasting day, increase
    knowledge, and find wisdom’s light; the Fount of Life is located in gloom.
  evidence_refs:
  - ev:18
  - ev:19
  confidence: medium
  cautions: This is an exhortation rather than a full narrative journey.
- id: motif:5
  label: Divine command over nonentity and supernatural beings
  taxonomy_refs: []
  basis: Nonentity obeys God’s command, and God rules the hand of both demon and Solomon;
