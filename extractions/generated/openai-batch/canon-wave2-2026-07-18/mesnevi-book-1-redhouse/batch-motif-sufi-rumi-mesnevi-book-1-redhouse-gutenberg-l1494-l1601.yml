  quote: ''
  summary: The passage recounts Jelālu-’d-Dīn repeatedly taking horses from a butcher
    and later being reported as having aided the forces of Islam against the Mongols
    at Damascus. It then narrates a Tebrīz merchant’s failed visit to a wealthy legal
    dignitary and his subsequent visit to Jelāl, who reveals knowledge of the merchant’s
    hidden offering, losses, and an averted divine trial.
