literal_observations:
- id: obs:1
  text: When judgment is the matter, ‘Umer and Abū-Jahl are placed in one predicament;
    ‘Umer gives up his judgment, while Abū-Jahl is said to have received his name
    through lack of self-control and to have fallen into ignorance as to soul.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says sense and reason concern cause and effect, while miracles
    and wonders show that soul is a fact, and that soul-enlightenment cannot be silenced
    by school logic.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Souls are described as chained in God’s prison in ignorance and as regaining
    liberty in wisdom by God’s help.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Human states including sleep, waking, weeping, laughter, anger, and amity
    are described in relation to God’s lethargy, hands, mercy, lightning, wrath, and
    favour.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Caesar’s ambassador hears ‘Umer; light breaks on his heart, and questions,
    answers, and the sense of right and wrong leave his mind.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ambassador asks why a thing of light is shut in a dark house and why the
    pure soul is combined with flesh and blood.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: "‘Umer answers by speaking of a sense or spirit paraphrased by the letter,
    of the free spirit made prisoner, and of partial and universal explanation."
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: "‘Umer says thanks are incumbent on mortals, contention and sour looks are
    not bread, vinegar must become oxymel with honey to reach hearts, and verse is
    like a sling."
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ambassador loses his senses from one cup of spiritual wine, gives up his
    mission, falls overwhelmed with wonder at the power of God, and is described as
    having come as an ambassador but now being sovereign as well.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'The passage lists transformations: an overflooded river constitutes a lake;
    grains sown in earth make a field of corn; bread eaten by a human takes life and
    reason; wood or candle made victim to fire becomes a source of light; black stibium
    placed in the eye expands vision.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Taking refuge in the Qur’an is said to lead to an exchange of looks with the
    spirit of Muhammed; the Qur’an is called the essence of all prophets, who are
    described as whales swimming in the ocean of God’s might.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Reading and studying the Qur’an, saints, and prophets is said to make the
    soul like a bird in a cage longing to break its rails; a bird shut in a cage that
    does not seek to get out is called ignorant.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: Souls freed from cages of the flesh are called worthy fellow-travellers with
    prophets and lift their voices to proclaim religion as the way of sure deliverance.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Respect from mortal people is called a heavy fetter and the gravest bond within
    religion’s path.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: The new tale begins with a merchant who owns a wise parrot confined in a cage,
    prepares to journey to Hindustan for rich wares, asks slaves what gifts they want,
    and asks the parrot what he should bring from Hind.
  category: sequence
  evidence_refs:
  - ev:11
