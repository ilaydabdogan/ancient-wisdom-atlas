canonical_text:
  quote: ''
  summary: A caged parrot asks a merchant to convey his love, distress, and request
    for advice to free parrots in Hind. The narrator turns the parrot’s tale into
    a comparison for the soul’s longing for the One and God’s hearing of the afflicted.
    The merchant reaches Hind, delivers the message to a flock, and one bird falls
    as if dead, causing the merchant to regret his words. The passage then gives didactic
    reflections on the danger and power of speech, patience, saintly immunity to poison,
    and prophetic warning against rashness.
  language: English
  quote_policy: summarized
