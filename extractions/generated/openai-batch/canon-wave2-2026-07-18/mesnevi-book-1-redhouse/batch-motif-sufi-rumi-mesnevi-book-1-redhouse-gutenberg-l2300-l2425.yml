canonical_text:
  quote: ''
  summary: 'The passage presents several anecdotes about Jelāl/Jelālu-’d-Dīn: his
    claim to spiritual precedence over a visitor from Bagdād; the visitor’s son becoming
    his disciple; an attendant fainting after Jelāl’s rebuke and recovering after
    forgiveness; a sick Sultan Ruknu-’d-Dīn becoming a disciple after witnessing signs;
    and the Sultan’s later adoption of Sheykh Bāba as spiritual father, Jelāl’s jealous
    departure, the Sultan’s ignored consultation, strangulation, and Jelāl’s simultaneous
    ecstatic response and funeral service.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jelāl says he has returned from the Bagdād of nulliquity and from the world
    of spirits, where he had been hymning the canticle “I am the Truth.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The disciples agree with Jelāl’s explanation and rejoice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sheykh’s son visits Jelāl on foot with uncovered head, acknowledges Jelāl’s
    rightness, declares himself Jelāl’s disciple, and reports that his father instructed
    him to seek and reverence Jelāl with ironed sandals and an iron-shod staff.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jelāl commands an attendant to arrange a matter; when the attendant answers
    “God willing,” Jelāl rebukes him, after which the attendant faints and foams at
    the mouth, then recovers after intercession and forgiveness.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At a religious commemoration at the house of the Perwāna in the Sultan’s presence,
    the Sultan becomes unwell, the exercises are suspended, and one disciple continues
    singing and shouting.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Sultan criticizes the singing disciple as ill-behaved, and Jelāl replies
    by contrasting the Sultan’s inability to endure fever with the singer’s overwhelming
    enthusiasm.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After witnessing signs wrought by Jelāl, the Sultan makes obeisance to him
    and becomes a disciple.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Sultan had adopted Jelāl as spiritual father, but later visits Sheykh
    Bāba and holds a palace revival in Bāba’s honour.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sheykh Bāba is formally introduced, installed on the throne, and seated with
    the Sultan beside him, while Jelāl sits in a corner as Qur’ān recitation, exhortations,
    and hymns occur.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Sultan publicly declares Sheykh Bāba to be his spiritual father and himself
    Bāba’s dutiful son, and the assembly approves and prays for blessing.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Jelāl responds with a jealousy saying attributed in the passage to the prophet
    Muhammed, declares that he will make another person his son, gives an ecstatic
    shout, and leaves; Husāmu-’d-Dīn reports that the Sultan turned pale.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: State officers arrange for the Sultan to go to another city in connection
    with measures against Sheykh Bāba; the Sultan asks Jelāl for a blessing, and Jelāl
    advises him not to go, but arrangements proceed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Upon reaching the other town, the Sultan is taken to a private apartment and
    strangled with a bowstring while invoking Jelāl’s name.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: At that moment Jelāl is at his college in a musical service, places his forefingers
    in his ears, orders trumpets and chorus to join, shouts, and recites odes including
    one warning “Go not” and calling himself “the Fount of Life.”
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: After the service, Jelāl removes his cloak, calls for the burial service,
    acts as precentor, and announces that Sultan Ruknu-’d-Dīn has been strangled,
    called on him, and will fare better in the other world.
  category: sequence
  evidence_refs:
  - ev:10
