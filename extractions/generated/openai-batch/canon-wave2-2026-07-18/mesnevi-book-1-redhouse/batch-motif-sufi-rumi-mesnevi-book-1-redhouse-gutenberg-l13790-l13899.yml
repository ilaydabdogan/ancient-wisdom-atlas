canonical_text:
  quote: Religion’s light, alone, can quench lust’s fiercest flame,—
  summary: 'The passage teaches that lust is a hell-born fire not quenched by water
    but by divine or religious light and piety. It recounts a conflagration in Medina
    during ‘Umer’s time, which he interprets as arising from avarice and misdirected
    almsgiving, and he instructs the people to distribute bread sincerely to proper
    recipients. It then introduces ‘Alī’s forbearance: after a defeated champion spits
    in his face, ‘Alī drops his sword and spares him, prompting the foe’s astonished
    praise. The passage further invokes Moses’ cloud, manna, quails, and divine promise
    as images of provision, then exhorts Ahmed’s people to trust the Lord and accept
    divine wording without distortion.'
  language: English
  quote_policy: quoted
