  summary: The passage first gives a didactic discourse on knowing things through
    their opposites, the limits of perceiving God, the relation of thought to words,
    emergence from formlessness and return, and the world’s moment-by-moment renewal.
    It then resumes a lion-and-hare narrative in which a hungry lion angrily confronts
    a confident hare, and the hare pleads for mercy while reporting a second hare
    and an invading lion encountered on the road.
