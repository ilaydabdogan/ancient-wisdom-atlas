canonical_text:
  quote: ''
  summary: 'The passage presents three hagiographic anecdotes: a holy man sees Kirā
    Khātūn in heaven and learns that her intercession for a stoned man and woman delayed
    a funeral; Satan appears to Husāmu-’d-Dīn to complain that Jelāl’s pious practices
    torment him and to seek eventual intercession; and Qonya grandees obtain mediated
    audiences with Shemsu-’d-Dīn through Husām and Jelāl, with silver payments later
    used for communal relief.'
  language: English
  quote_policy: summarized
