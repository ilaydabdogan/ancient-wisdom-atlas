canonical_text:
  quote: ''
  summary: 'A sequence of hagiographic anecdotes about Jelāl and Shemsu-’d-Dīn: locked
    gates open for Jelāl during a midnight journey to Abraham’s tomb; a pursuing governor
    is lost and later converts; a parallel tale is noted about self-opening gates
    when Jelāl fetched water as a child. Seyyid Burhānu-’d-Dīn recalls carrying child
    Jelāl to the empyrean and later being carried by him. Jelāl encounters Christian
    monks in a cave whose levitating child becomes fixed in the air until the monks
    and child accept Islam. Jelāl undertakes repeated forty-day fasts and is pronounced
    perfected in open and hidden sciences. Shemsu-’d-Dīn, a wandering seeker of spiritual
    teachers, is divinely directed to Jelāl; he meets Jelāl at Qonya, poses a paradoxical
    question about Muhammed and Bāyezīd, and Jelāl faints before entering private
    spiritual converse with him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At midnight Jelāl leaves his room and passes through a locked college gate
    and a locked city gate, both of which open of themselves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jelāl and the governor reach Abraham’s tomb at Hebron, where a domed edifice
    and a company of forms in green raiment appear.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The forms in green raiment come out to meet Jelāl and conduct him into the
    building.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The governor loses consciousness from fright and later sees no domed edifice
    or people.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The governor wanders hungry, thirsty, and footsore on a trackless plain for
    three days and three nights until he collapses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A search party, directed by Jelāl, finds the governor nearly dead and brings
    him home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The governor becomes a sincere convert and disciple of Jelāl.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage explicitly notes a parallel tale in which gates opened of themselves
    for child Jelāl while he fetched water from the Tigris for his father at night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Seyyid Burhānu-’d-Dīn says he formerly carried child Jelāl on his shoulder
    to the empyrean, but now Jelāl carries him up.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Jelāl confirms Seyyid Burhānu-’d-Dīn’s statements and praises his services.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Sīs in Upper Cilicia, forty Christian monks dwell in a cave and are described
    as reputedly holy but actually jugglers.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: The monks cause a little boy to ascend into the air and stand between heaven
    and earth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: When Jelāl falls into a reverie, the child weeps, says he is frightened, and
    reports being fixed in place and unable to move.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The monks ask Jelāl to release the child, and Jelāl says the child can be
    saved only if the monks and child accept Islam.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: The monks and child embrace Islam; Jelāl tells the monks to remain in their
    cave, stop jugglery, and serve God sincerely.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: At Qaysariyya, under Seyyid Burhānu-’d-Dīn’s supervision, Jelāl fasts three
    consecutive periods of forty days with only water and barley bread and shows no
    signs of suffering.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: Burhān declares Jelāl perfect in patent and occult, human and spiritual sciences.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:18
  text: Shemsu-’d-Dīn gains the nickname Perenda after traveling through many lands
    in search of the best spiritual teachers.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:19
  text: Shemsu-’d-Dīn prays to be shown the most occult of God’s favored ones, and
    Jelāl is designated to him.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:20
  text: At Qonya, Shems lodges at an inn, appears to be a merchant, but his room contains
