canonical_text:
  quote: ''
  summary: 'The passage contrasts crippled or blind reliance on mere reason with faith
    and prophetic miracle. It recalls Moses’ staff becoming a serpent and Ahmed’s
    post moaning, then narrates Abū-Jahl challenging Muhammed with hidden stones that
    speak a confession of God’s unity and Muhammed’s prophethood. It then returns
    to the minstrel tale: a heavenly voice commands Caliph ‘Umer to take seven hundred
    golden sequins from the public treasury to a highly esteemed servant in the public
    burial-ground. ‘Umer goes there, finds only an ancient minstrel, struggles with
    doubt, and approaches him as the harper wakes.'
  language: English
  quote_policy: summarized
