canonical_text:
  quote: ''
  summary: 'The passage gives several short narratives about Jelāl and related sacred
    figures: a heifer is said to disappear from Qonya; Jelāl performs a candle-light
    miracle at the Perwāna’s palace; he rebukes Qāni’ī for disparaging Sanā’ī and
    gains him as a disciple; he comments on an oath using Sanā’ī’s Ilāhī-nāma; he
    transmits a narrative in which Adam receives the inseparable pearls of wisdom,
    faith, and modesty; he temporarily raises the dead flute-player Hamza, prompting
    conversions; and an ecstatic hunchback tambourine-player moves Jelāl in a festival
    dance.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A heifer is reported never to have been seen again in the meadows of Qonya.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a meeting in the Perwāna’s palace, guests bring large waxlights while Jelāl
    brings a small wax-taper.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The grandees smile at Jelāl’s taper, and he says their larger candles depend
    on his taper for light.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When Jelāl blows out his taper, all the candles are extinguished and the company
    is left in darkness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After a short interval, Jelāl sighs; his taper catches fire, the other candles
    burn again, and conversions result.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Qāni’ī, a poet-laureate accompanied by noble admirers, visits Jelāl at his
    college.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Qāni’ī says he dislikes Sanā’ī’s writings and calls Sanā’ī not a Muslim because
    Sanā’ī quoted Qur’ānic passages in poetry and used them as rhymes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Jelāl rebukes Qāni’ī, praises Sanā’ī’s poetry as an exposition of Qur’ānic
    mysteries, warns against denying the saints, and speaks of intercession on the
    day of judgment.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Qāni’ī rises uncovered, asks forgiveness, confesses contrition, and becomes
    one of Jelāl’s disciples.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A disciple of Husāmu-’d-Dīn wishes to vow not to do acts unauthorized by Islamic
    Canon Law, and a covered copy of Sanā’ī’s Ilāhī-nāma is placed on a lectern as
    the book for the oath.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Jelāl says the Ilāhī-nāma would bring a more severe chastisement on a forswearer
    than the Qur’ān, and compares the Word of God to milk and the Ilāhī-nāma to cream
    and butter.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: When Adam is created, God commands Gabriel to offer Adam three precious pearls
    from the divine treasury in a golden salver.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The three pearls are identified as wisdom, faith, and modesty, and Adam chooses
    wisdom.
  category: object
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:14
  text: Gabriel cannot lift the salver containing the remaining pearls, and those
    pearls state that they will not separate from beloved wisdom.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: A voice from the divine presence instructs Gabriel to leave the pearls, after
    which wisdom is seated in Adam’s brain, faith in his heart, and modesty in his
    countenance.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:16
  text: Hamza, a flute-player beloved by Jelāl, dies; Jelāl sends disciples to prepare
    him in grave-clothes and then goes to the house of the deceased.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:17
  text: Jelāl addresses Hamza’s dead body and commands him to arise; Hamza arises,
    answers, takes his flute, and a three-day-and-night religious festival follows.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:18
  text: More than a hundred Roman misbelievers are converted, and when Jelāl leaves
    the house, life also departs from the corpse.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:19
  text: A hunchback disciple who plays the tambourine beats it and shouts in ecstasy
    at a festival, and Jelāl is moved in spirit with the holy dance.
  category: sequence
  evidence_refs:
  - ev:17
