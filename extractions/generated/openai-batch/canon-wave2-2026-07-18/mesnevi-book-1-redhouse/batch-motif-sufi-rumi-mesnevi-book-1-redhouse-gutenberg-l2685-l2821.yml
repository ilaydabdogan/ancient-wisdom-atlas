candidate_motifs:
- id: motif:1
  label: Miraculous control of communal light
  taxonomy_refs: []
  basis: 'Jelāl’s small taper is presented as governing the light of larger candles:
    when he extinguishes it all candles go dark, and when it catches fire again they
    burn.'
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The available taxonomy list has no direct light-miracle motif family;
    the motif is described at the passage level only.
- id: motif:2
  label: Miracle followed by religious conversion
  taxonomy_refs: []
  basis: The candle miracle is explicitly followed by numerous conversions.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not identify the individual converts in the palace episode.
- id: motif:3
  label: Saintly rebuke produces repentance and discipleship
  taxonomy_refs:
  - wisdom
  basis: Jelāl rebukes Qāni’ī’s misunderstanding of Sanā’ī and the saints; Qāni’ī
    asks forgiveness and becomes a disciple.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The wisdom taxonomy applies broadly to instruction and discernment; the
    passage does not label the episode as a formal wisdom contest.
- id: motif:4
  label: Vow before a sacred book with threatened chastisement
  taxonomy_refs:
  - covenant
  basis: A disciple prepares a vow against backsliding using the Ilāhī-nāma as the
    oath book, and Jelāl says forswearing on it would bring severe chastisement.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage concerns a vow/oath rather than a reciprocal covenant between
    parties.
- id: motif:5
  label: Inseparable divine virtues bestowed on the first human
  taxonomy_refs:
  - wisdom
  basis: Adam is offered the pearls of wisdom, faith, and modesty; when he chooses
    wisdom, the other two refuse separation and all three remain with Adam and his
    chosen descendants.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: Only wisdom appears in the available motif taxonomy; faith and modesty
    are passage-specific virtues here.
- id: motif:6
  label: Temporary resurrection of a beloved musician
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Hamza dies, rises at Jelāl’s command, plays flute for three days and nights,
    and life leaves his corpse when Jelāl departs.
  evidence_refs:
  - ev:14
  - ev:15
  - ev:16
  confidence: high
  cautions: The revival is explicitly temporary, so the broader death-rebirth label
    should be used cautiously.
- id: motif:7
  label: Devotional music and ecstatic holy dance
  taxonomy_refs: []
  basis: A devout hunchback disciple plays tambourine and shouts in ecstasy at a festival,
    while Jelāl is moved in spirit with the holy dance.
  evidence_refs:
  - ev:17
  confidence: medium
  cautions: The passage fragment ends before any further result or explanation of
    the dance is given.
- id: motif:8
  label: Disappearance of an animal after an earlier event
  taxonomy_refs: []
  basis: The only available statement says the heifer was never seen again in Qonya’s
    meadows.
  evidence_refs:
  - ev:1
  confidence: low
  cautions: The preceding context for the heifer is outside the supplied passage,
    so no fuller motif can be assigned.
