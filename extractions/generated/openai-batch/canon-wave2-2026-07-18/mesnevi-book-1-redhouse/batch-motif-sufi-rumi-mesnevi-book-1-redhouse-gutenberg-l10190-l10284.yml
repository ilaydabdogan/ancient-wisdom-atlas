canonical_text:
  quote: ''
  summary: The passage describes a sleeping minstrel whose soul is freed into heavenly
    fields, then turns to ‘Umer receiving divinely sent sleep and a dream-voice. It
    reflects on God's voice as the source of all sound and on all beings answering
    the divine call. A prophetic tradition is narrated in which a wooden post in Mustafà’s
    house sobs when the Prophet no longer leans on it; the Prophet offers it earthly
    fruitfulness or heavenly permanence, and the post chooses what does not decay.
    The passage ends with lessons about divine calling, faith, heavenly knowledge,
    doubt, Satan, and judgment.
  language: English
  quote_policy: summarized
