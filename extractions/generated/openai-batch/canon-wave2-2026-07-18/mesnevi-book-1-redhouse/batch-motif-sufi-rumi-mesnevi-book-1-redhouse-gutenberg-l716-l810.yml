canonical_text:
  quote: ''
  summary: 'A sequence of anecdotes concerning Bahā Veled, Sultan ‘Alā’u-’d-Dīn, Sheykh
    Hajjāj, Jelālu-’d-Dīn, and the Dizdār: Bahā’s rebuke kills a man; Bahā counsels
    the Sultan that justice and subjects’ blessings are stronger than fortifications;
    Bahā reads the Sultan’s thoughts; Sheykh Hajjāj lives ascetically and secretly
    supports Jelālu-’d-Dīn; Hajjāj’s corpse grips a washer until Jelālu-’d-Dīn intercedes;
    the Dizdār recites Qur’ānic verses, becomes Bahā’s disciple, and endows a college;
    and Bahā interprets the Sultan’s dream of a body made from metals as a prophecy
    of dynastic decline.'
  language: English
  quote_policy: summarized
