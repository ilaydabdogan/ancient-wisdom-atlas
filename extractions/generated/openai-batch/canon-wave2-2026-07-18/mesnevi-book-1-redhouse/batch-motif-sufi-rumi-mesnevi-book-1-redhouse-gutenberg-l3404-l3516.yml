canonical_text:
  quote: ''
  summary: The passage recounts a freed water-associated figure returning with pearls
    and precious stones, leading to the rise of the Sons of the Fisherman; a learned
    man’s vision of Jelāl near God’s throne and Jelāl’s immediate knowledge of that
    vision; and a narrative in which the Prophet entrusts mysteries to ‘Alī, who releases
    them into a well, from which a reed grows and becomes a flute whose music conveys
    the mysteries and produces ecstatic responses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker’s father immediately told an unnamed figure that he was free;
    the figure returned into the water and disappeared from sight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two days later, the freed figure returned with innumerable pearls and precious
    stones, asked whether he had kept his promise, and then took leave.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The family became wealthy merchant princes known as the Sons of the Fisherman,
    and the father went to Qonya to pay respects to the Mevlānā.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says this narrative caused him to visit the son of the great saint,
    and the narrative is said to have been transmitted among Qonya merchants.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: A learned man of Qonya told the Perwāna that he had been taken to the highest
    heaven and had learned many mysteries there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The learned man reported seeing Jelāl in a station of proximity to God above
    any other saint, standing level with God’s throne.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Perwāna visited Jelāl with reverence; before the Perwāna spoke, Jelāl
    said the learned man’s vision was true in its main facts, though Jelāl had not
    seen him there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Jelāl extemporized an ode questioning whether the visionary witness could
    report details of what he had seen and heard.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A musical service was arranged with the ode chanted; the Perwāna was bewildered,
    said nothing, bowed, and left.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Prophet privately recited to ‘Alī the secrets and mysteries of the Brethren
    of Sincerity, instructing him not to disclose them to the uninitiated and to obey
    implicit submission.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: For forty days ‘Alī kept the secret in his breast, became sick at heart, and
    his abdomen swelled so that he could not breathe freely.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: "‘Alī fled to the wilderness, found a well, and confided the mysteries one
    by one into the bowels of the earth; froth and foam from his mouth were spat into
    the water until he felt relieved."
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A single reed grew in the well; a youth who was miraculously enlightened noticed
    it, cut it down, drilled holes in it, and played airs on it while pasturing sheep.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Camels and sheep gathered around the shepherd’s flute-playing and stopped
    pasturing; desert Arabs and nomads came from different directions, entered ecstasies,
    wept, and rejoiced.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: The Prophet ordered the piper brought before him; when the flute was played,
    the holy disciples were moved to tears, transports, shouts, exclamations, and
    loss of consciousness.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:16
  text: The Prophet declared that the shepherd’s flute notes were the interpretation
    of the holy mysteries privately entrusted to ‘Alī.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:17
  text: The concluding statement says that only one who acquires the sincere devotion
    of the flute-reed can hear the mysteries of the Brethren of Sincerity in its notes.
  category: speech
  evidence_refs:
  - ev:14
