  summary: A deaf man visits a sick neighbor after memorizing imagined answers, but
    his replies offend the patient. The narrator turns the episode into warnings about
    hypocrisy, misjudgment, sense-based reasoning, literal interpretation of sacred
    language, spiritual pride, and the superiority of divine guidance over faulty
    surmise.
