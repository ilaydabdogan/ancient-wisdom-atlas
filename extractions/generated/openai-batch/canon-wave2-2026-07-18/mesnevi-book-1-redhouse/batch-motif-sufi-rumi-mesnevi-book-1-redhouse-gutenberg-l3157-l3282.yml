candidate_motifs:
- id: motif:1
  label: Wholehearted small offering outweighs larger partial gifts
  taxonomy_refs:
  - sacred_exchange
  basis: The poor woman’s three dates and cake, described as all she had, outweigh
    the community’s large offerings because other donors kept part of their possessions.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The weighing occurs within a narrated anecdote inside Jelāl’s teaching,
    not as a direct event in the outer frame.
- id: motif:2
  label: Alms entrusted to God multiply like a seed becoming a tree
  taxonomy_refs:
  - sacred_exchange
  basis: The teaching compares giving alms to entrusting a date-stone to God, who
    makes it become a fruit-bearing tree, and says alms reach God’s hand before the
    poor.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The tree image is explicitly didactic and metaphorical in the passage.
- id: motif:3
  label: Hidden saintly visitor at a sermon
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: A stranger praises Jelāl’s sermon on Moses and Elias, is suspected by a disciple
    to be Elias, redirects the disciple to Jelāl, and disappears.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage says the disciple surmised the stranger might be Elias; it
    does not explicitly confirm the stranger’s identity.
- id: motif:4
  label: Saint recognized by occult saints and prophets
  taxonomy_refs:
  - wisdom
  basis: The stranger says every occult saint of God is Jelāl’s loving and admiring
    friend, and Jelāl says Elias, Moses, and the prophets are all his friends.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This is a hagiographical status claim rather than a developed narrative
    motif.
- id: motif:5
  label: Heavenly beings attend and mourn the saint’s funeral
  taxonomy_refs: []
  basis: The precentor reports spiritual saints or angels present at Jelāl’s burial
    service, reciting prayers for the dead, wearing blue robes, and weeping.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The report is mediated through the precentor’s vision.
- id: motif:6
  label: Forty-day devotional visitation at the grave
  taxonomy_refs: []
  basis: The passage says the precentor and others visited Jelāl’s grave daily for
    forty days after the burial service.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage gives the practice but does not explain the number forty.
- id: motif:7
  label: Saintly walking in the air
  taxonomy_refs:
  - ascent
  basis: Jelāl is repeatedly seen in Damascus walking several arrow-flights’ distance
    in the air and returning to a terraced roof.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The available taxonomy term 'ascent' only partially captures horizontal
    aerial movement and levitation.
- id: motif:8
  label: Saintly remote appearance explained through ocean-fish imagery
  taxonomy_refs:
  - mystical_quest
  basis: A friend finds Jelāl in Damascus after leaving him in Qonya, and Jelāl says
    men of God are like fishes in the ocean, appearing here and there as they please.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage reports the phenomenon and Jelāl’s metaphor but does not provide
    a doctrinal explanation beyond the analogy.
comparison_claims:
- id: claim:1
  claim: The sermon episode explicitly links Jelāl’s teaching to the Qur’anic Moses-and-Elias
    passage, and the stranger’s statement that Jelāl might have been the third with
    the two creates a cautious same-motif comparison with that nearby Islamic scriptural
    narrative frame.
  claim_level: same_motif
  target: Qur’ān xviii. 59-81, identified in the passage as concerning Moses and Elias
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage names the Qur’anic locator and reports the disciple’s suspicion,
    but it does not definitively identify the stranger as Elias or retell the Qur’anic
    episode in full.
