canonical_text:
  quote: ''
  summary: 'The passage contains biographical and hagiographical anecdotes about Jelāl/Rumi:
    a note on Sultan Veled’s birth account; two poor Turkish students whose lentil
    offering prompts Jelāl to recount Muhammad’s teaching on wholehearted almsgiving;
    a sermon on Moses and Elias interrupted by a mysterious stranger; a funeral vision
    of spiritual saints or angels mourning Jelāl; and reports of Jelāl walking in
    the air and appearing in Damascus after being left in Qonya.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sultan Veled is reported to have said that his grandfather was invited to
    Qonya, then to Larenda, where his father married and where Sultan Veled was born;
    the editorial note says this account conflicts with other reported details.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two poor Turkish law-students brought Jelāl a small offering of lentils and
    excused its smallness by their poverty.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Jelāl narrated that God revealed to Mustafa/Muhammed that believers should
    contribute what they could spare for God’s service; some gave portions, Abū-Bekr
    gave all he possessed, and a poor woman gave three dates and a cake of bread,
    all she had.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Mustafa/Muhammed’s reported vision, angels placed the believers’ large
    offerings in one scale of a balance and the poor woman’s three dates and cake
    in the other; the poor woman’s offering outweighed the rest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mustafa/Muhammed explained that the poor woman’s gift outweighed the others
    because she gave all she possessed, while the others kept some back; he also described
    alms as reaching God’s hand before the poor and compared a date-stone entrusted
    to God with a tree that bears many fruits.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: After hearing Jelāl’s anecdote, the two Turkish students professed themselves
    his disciples.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: While young Jelāl preached on Moses and Elias, a stranger sat in a corner,
    listened attentively, affirmed the sermon, and said that Jelāl might have been
    the third with the two.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A disciple thought the stranger might be Elias, seized the stranger’s skirt,
    and asked for spiritual aid; the stranger told him to seek assistance from Jelāl,
    said occult saints admired Jelāl, disengaged himself, and disappeared.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Jelāl then told the disciple that Elias, Moses, and the prophets were all
    his friends, and the disciple became more devoted to him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Jelāl’s burial service, the precentor shrieked, swooned, recovered, and
    performed his office while weeping bitterly.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The precentor said he saw noble spiritual saints of the spiritual world, described
    also as angels of heaven, present and reciting prayers for Jelāl; they wore blue
    robes and wept.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: For forty days, the precentor and others visited Jelāl’s grave daily.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: At Damascus, when Jelāl was a young student, others frequently saw him walk
    several arrow-flights’ distance in the air and return calmly to the terraced roof
    where they stood.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: A friend who left Jelāl at Qonya later found him seated in a room at Damascus;
    Jelāl explained that men of God are like fishes in the ocean, appearing on the
    surface wherever they please.
  category: action
  evidence_refs:
  - ev:11
