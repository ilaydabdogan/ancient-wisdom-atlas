canonical_text:
  quote: ''
  summary: 'The passage closes a story by describing the goldsmith’s final reflection,
    death by lethal drugs, and a theological defense of the doctor and prince as acting
    under divine command. It then begins the tale of an oilman’s talking parrot: a
    cat chasing a mouse frightens the parrot, she spills oil, is struck by the master,
    falls silent, and later breaks silence by mistakenly assuming a shaved mendicant
    has also upset an oil jar.'
