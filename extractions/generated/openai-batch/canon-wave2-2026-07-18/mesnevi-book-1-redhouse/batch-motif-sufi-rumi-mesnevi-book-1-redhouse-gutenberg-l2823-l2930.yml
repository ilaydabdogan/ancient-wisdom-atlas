canonical_text:
  quote: ''
  summary: 'The passage recounts several hagiographic episodes about Jelāl: he restores
    a hunchback to upright form; he defends singing hymns at burial by interpreting
    the saint’s death as the soul’s liberation and return to the Eternal; he appears
    in the Arabian desert to aid a lost pilgrim and return him instantly to his caravan;
    and he answers a learned man’s theological questions, after which the questioner
    becomes his disciple.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jelāl approaches a hunchback, asks why he is not upright, pats and strokes
    his back, and the man immediately rises erect and graceful.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The healed man’s wife initially refuses him entry and denies he is her husband;
    companions testify to what happened, and she accepts him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: People question Jelāl about his introduction of hymn-singing during burial
    processions, which canonists had called a harmful innovation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Jelāl says ordinary reciters attest that the deceased lived as a Muslim, while
    his singers attest that the deceased was a Muslim, believer, and lover of God.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Jelāl describes the human spirit as imprisoned in the cage and dungeon of
    the body until death sets it free to fly to its source and to the presence of
    the Eternal.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Jelāl compares the death of a saint to a prisoner being released from a dungeon
    and clothed with honour, saying rejoicing, thanks, and dancing are proper.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A young pilgrim from Qonya falls asleep while traveling in the Arabian desert,
    is left behind by the caravan, and finds himself alone and exhausted in trackless
    sands.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: The lost pilgrim sees a large tent with smoke rising near it, meets a formidable
    host, and finds inside a kettle of sweetmeat and cool clear water.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The host says he is a disciple of Jelāl and prepares the tent and food daily
    in hope that Jelāl will visit and accept hospitality.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Jelāl enters the tent, eats a small morsel, gives some to the pilgrim, and
    tells him to close his eyes; when the pilgrim opens them, he is among his caravan
    companions.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The young pilgrim returns safely, thanks Jelāl for the miraculous kindness,
    and professes himself a disciple.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: A learned man tests Jelāl with questions about whether God can be called a
    living soul or a thing, citing Qur’ānic passages and a saying attributed to Jesus.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Jelāl answers by interpreting the cited language through knowledge, secrecy,
    and the distinction between created things and the Creator.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: The learned man immediately becomes Jelāl’s disciple and composes a panegyric
    on him.
  category: sequence
  evidence_refs:
  - ev:14
