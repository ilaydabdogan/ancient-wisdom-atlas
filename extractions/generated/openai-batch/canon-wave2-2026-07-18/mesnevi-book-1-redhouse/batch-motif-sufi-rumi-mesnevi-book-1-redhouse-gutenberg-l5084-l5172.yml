canonical_text:
  quote: ''
  summary: 'The passage narrates the final illness and death of ‘Ārif: he speaks of
    death as departure to the future state, chooses his burial place at the mausoleum,
    experiences cosmic disturbances and deathbed visions, reassures disciples of his
    continued spiritual presence, gives final instructions, dies after recitations,
    and is buried beside his grandfather.'
  language: English
  quote_policy: summarized
