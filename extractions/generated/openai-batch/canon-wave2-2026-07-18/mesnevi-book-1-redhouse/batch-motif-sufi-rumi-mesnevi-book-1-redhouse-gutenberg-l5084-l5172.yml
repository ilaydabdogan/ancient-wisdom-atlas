  evidence_refs:
  - ev:1
- id: obs:2
  text: "‘Ārif says the body has impeded his investigation, that he wants to go to
    the future state, and that he longs to be with his father and grandfather."
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After crying and moaning, ‘Ārif attends Friday congregational worship, goes
    to the mausoleum, kisses the shrine, sings a hymn, performs a holy dance, utters
    ecstatic cries, lies on the floor, and asks to be buried there.
  category: sequence
  evidence_refs:
  - ev:2
