canonical_text:
  quote: ''
  summary: The passage contrasts formal sciences with the poverty or self-emptying
    needed at death. It tells of a syntax-teacher in a boat who mocks a skipper for
    not knowing grammar, then is himself exposed as helpless when a storm threatens
    and he cannot swim. The narrator compares human learning to an Arab’s water-pot
    brought before the Tigris and to a Caliph who generously rewards the poor man’s
    small offering. The world is then described as a great water-pot, only a drop
    from the ocean of divine grace, while God-seers regard the pot-like world as a
    fallacy. The passage ends by urging the listener to fly like a falcon rather than
    remain weighed down by clay-like sustenance.
  language: English
  quote_policy: summarized
