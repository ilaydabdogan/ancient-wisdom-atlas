candidate_motifs:
- id: motif:1
  label: Separation from origin and longing for return
  taxonomy_refs:
  - departure
  - return
  basis: The reed-flute says it was torn from its jungle-bed, and the passage states
    that one snatched far from home longs to return.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents this literally through the reed-flute’s voice; broader
    metaphysical interpretation should be reviewed.
- id: motif:2
  label: Love as burning force and healer
  taxonomy_refs:
  - divine_beloved
  basis: The flute’s wail is called the flame of love, and love is addressed as physician
    and cure; the same section connects love with ascent and God’s descent at Sinai.
  evidence_refs:
  - ev:4
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage clearly personifies love, but whether every beloved reference
    is divine is not stated explicitly in every line.
