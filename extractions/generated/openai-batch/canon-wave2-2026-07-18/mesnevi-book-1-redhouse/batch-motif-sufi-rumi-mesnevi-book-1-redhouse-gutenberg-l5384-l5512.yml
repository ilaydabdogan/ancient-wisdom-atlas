canonical_text:
  quote: ''
  summary: The passage opens with an invocation and the proem of the reed-flute, in
    which the flute laments being torn from its reed-bed and speaks of absence, longing,
    love as flame, love as healer, ascent through love, Sinai shaking at God’s descent,
    and the need to cleanse the mirror of the heart. It then begins the tale of a
    powerful prince who falls in love with a fair handmaid, purchases her, and grieves
    when she becomes ill. Physicians boast of their healing power without saying “God
    willing,” and their remedies fail or worsen the illness.
  language: English
  quote_policy: summarized
