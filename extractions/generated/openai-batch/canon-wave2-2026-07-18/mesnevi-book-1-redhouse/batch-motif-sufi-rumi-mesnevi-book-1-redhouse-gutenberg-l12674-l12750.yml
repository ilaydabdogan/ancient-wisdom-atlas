canonical_text:
  quote: Defect is thus the mirror whence perfection’s seen;
  summary: Joseph asks his friend what offering he has brought. The friend says no
    ordinary rarity is worthy of Joseph and presents a bright mirror so Joseph may
    behold his own beauty. The passage then develops the mirror image into a teaching
    that want, defect, suffering, and contrast reveal perfection and occasion craft,
    healing, and transformation. It condemns self-conceit as a Satanic disease hidden
    in human beings and concludes with images of muddy water, wounds covered by flies,
    and a teacher applying salve.
