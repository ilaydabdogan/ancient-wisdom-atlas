canonical_text:
  quote: ''
  summary: The passage moves from prophetic instruction about spring breezes and autumn
    chills to an allegorical application about wisdom, fleshly lust, and the perfected
    teacher. Aisha asks the Prophet about rain as mercy or menace, and he explains
    it as a soothing sprinkle against human care. The narrator then returns to an
    aged, impoverished minstrel whose former art has decayed; the minstrel prays to
    God, goes with his harp to the burial-ground of Yathrab, plays, weeps, and sleeps
    upon a grave with the harp as his pillow.
  language: English
  quote_policy: summarized
