candidate_motifs:
- id: motif:1
  label: Mysterious departure of a spiritual companion followed by ritualized mourning
  taxonomy_refs:
  - departure
  basis: Shemsu-’d-Dīn mysteriously disappears, and Jelāl adopts specific garments
    as mourning signs that become associated with the dervish order.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage presents a hagiographic biographical event, not an elaborated
    mythic journey or quest.
- id: motif:2
  label: Otherworldly visitors bring a sacred offering
  taxonomy_refs:
  - sacred_exchange
  basis: Six occult saints enter through a miraculously opened wall and place a nosegay
    at Jelāl’s feet; Jelāl later says it came from the lost earthly paradise as a
    special offering.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
  confidence: high
  cautions: The taxonomy fit is based on the explicit offering; the passage does not
    describe a reciprocal exchange.
- id: motif:3
  label: Miraculous flowers from paradise retain freshness and heal
  taxonomy_refs: []
  basis: The nosegay is said to come from the lost earthly paradise, to cure eye disease
    with one leaf, and never to lose fragrance or freshness.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: No specific available symbol taxonomy directly matches flowers or healing
    plants.
- id: motif:4
  label: Holy adept demonstrates life sustained by divine will rather than blood
  taxonomy_refs: []
  basis: Jelāl has his veins opened until they stop bleeding, produces no moisture
    from further incisions, and then proceeds to purification and sacred dance to
    prove life is through God’s will alone.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No available motif family precisely names bodily invulnerability or divine
    sustenance in this form.
- id: motif:5
  label: Corpse returned directly to mother earth
  taxonomy_refs: []
  basis: Kerīmu-’d-Dīn teaches that earth is the mother of the human race and that
    a corpse should be committed to mother earth rather than to a coffin made from
    earth’s child, wood.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage emphasizes burial doctrine and kinship metaphor; it does not
    explicitly describe rebirth.
- id: motif:6
  label: Music and dance as initiatory medicine for spiritual truth
  taxonomy_refs:
  - initiation
  - wisdom
  - mystical_quest
  basis: Jelāl explains metrical exhortations, music, and dance as attractive arts
    used to lead the Romans toward spiritual truth, comparing the method to coaxing
    a sick child to take medicine.
  evidence_refs:
  - ev:12
  - ev:14
  confidence: medium
  cautions: The passage supports spiritual instruction through ritual art; broader
    initiation or quest categories require reviewer confirmation.
- id: motif:7
  label: Spiritual alchemy by divine grace
  taxonomy_refs:
  - initiation
  basis: Jelāl describes the elixir of God’s grace transmuting the copper of people’s
    existences into gold and philosopher-stone and receiving them into the communion
    of saints.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The alchemical language is explicit, but assigning it to the available
    initiation family is interpretive.
