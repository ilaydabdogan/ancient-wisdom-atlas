canonical_text:
  quote: ''
  summary: 'The passage recounts anecdotes about Jelāl: Shemsu-’d-Dīn’s disappearance
    and Jelāl’s mourning garb; the institution and defense of musical and dancing
    services; a miraculous visit by six occult saints who bring a healing nosegay
    from the lost earthly paradise; Jelāl’s demonstration that life depends on God
    rather than blood; a disciple’s teaching that a corpse should be buried directly
    in mother earth; and Jelāl’s explanation of music and art as a means to lead the
    Roman people toward spiritual truth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a threatening tumult by Jelāl’s disciples, Shemsu-’d-Dīn mysteriously
    disappeared, and Jelāl adopted a drab hat and wide cloak as mourning attire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jelāl instituted musical services with a distinctive waltzing practice, and
    people took up music and dancing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Opponents objected to Jelāl’s music and dancing, said he was mad, and attributed
    the condition to Shemsu-’d-Dīn’s influence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kirā or Girā Khātūn is said to have seen through a door chink that, while
    Jelāl and Shems were in spiritual communion, a wall opened and six majestic men
    entered through the cleft.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The six strangers are described as occult saints; they saluted, bowed, and
    placed a nosegay at Jelāl’s feet in midwinter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Near dawn worship the strangers motioned for Shemsu-’d-Dīn to lead; he excused
    himself, Jelāl led the service, and the strangers departed through the same wall
    cleft.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Jelāl came out with the nosegay and gave it to his wife, saying that the strangers
    had brought it as an offering for her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kirā Khātūn sent leaves from the nosegay to the perfumers’ mart; local merchants
    were astonished, and an Indian spice merchant identified the leaves as petals
    from a flower growing in south India near Ceylon.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Jelāl instructed his wife to care for the nosegay and said it had been sent
    by florists of the lost earthly paradise through Indian saints as a special offering.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The nosegay was preserved during Kirā Khātūn’s life; leaves from it were used
    to cure eye disease, and the flowers never lost fragrance or freshness.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the presence of physicians and philosophers, Jelāl had veins in both arms
    opened until bleeding ceased, then had other incisions made from which no moisture
    was obtained.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After the bloodletting demonstration, Jelāl went to a hot bath, washed, performed
    an ablution, and began the sacred dance.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: When a disciple died, the group consulted about burial with or without a coffin;
    another disciple argued for burial without a coffin because the earth is the mother
    of the human race and coffin wood is also the earth’s child.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Jelāl admired the burial teaching, and the speaker is named as Kerīmu-’d-Dīn,
    son of Begh-Tīmūr.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: Jelāl’s chief disciples reported that he explained music and dancing as practices
    arranged to attract the Romans toward inner spiritual life and spiritual truth.
  category: speech
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
