canonical_text:
  quote: ''
  summary: The passage recounts the lineage, dream-sanctioned marriage, birth, learning,
    title, preaching, departure, travels, and prophetic warnings attributed to Bahā’u-’d-Dīn
    Veled. It describes dreams involving Muhammad, the conferral of the title Sultānu-’l-‘Ulemā,
    rejection of kingship and gifts, prophecies of Mongol destruction, the fall of
    Balkh, pilgrimage to Mecca, and later residence in colleges in Asia Minor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king of Khurāsān gives his daughter Melika’i-Jihān in marriage to Jelālu-’d-Dīn
    Huseyn el Khatībī.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrative says the bridegroom, the king, the king’s daughter, and the
    king’s vazīr are all warned in a dream by Muhammad that the marriage should take
    place.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nine months after the marriage, a son is born and named Bahā’u-’d-Dīn Muhammed,
    commonly called Bahā’u-’d-Dīn Veled.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: As an adolescent, Bahā’u-’d-Dīn Veled is described as extremely learned, and
    his mother’s family wishes to raise him to the throne; he rejects this.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says three hundred learned men of Balkh receive an identical dream
    in the same night and confer on him the title Sultānu-’l-‘Ulemā; they become his
    disciples.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that many miracles and prodigies were attributed to Bahā’u-’d-Dīn
    Veled, and that some men became jealous of his reputation and influence.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bahā’u-’d-Dīn Veled preaches against the innovations of the king and courtiers,
    speaks against philosophers and rationalists, and urges study and practice of
    Islam.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Courtiers accuse Bahā’u-’d-Dīn Veled of designs on the throne; the king offers
    him sovereignty, and he answers that he has no concern with earthly greatness
    and will leave the country.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Before leaving Balkh, Bahā’u-’d-Dīn Veled publicly foretells that the Moguls
    will overturn the kingdom, possess the country, destroy Balkh, drive out the king,
    and that the king will later be killed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Bahā’u-’d-Dīn Veled leaves Balkh with about forty souls; the passage explicitly
    compares his departure to Muhammad’s flight from Mecca to Medina.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: People on the road, either hearing of his approach or being forewarned in
    dreams, come to meet and honor Bahā’u-’d-Dīn Veled.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: In Baghdad, Sheykh Shahābu-’d-Dīn ‘Umer Suherverdī meets Bahā’u-’d-Dīn Veled
    as the Caliph’s deputy and becomes his host.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Caliph sends money and later rich gifts to Bahā’u-’d-Dīn Veled; he refuses
    them, preaches in the mosque, reproaches the Caliph, and warns him of approaching
    slaughter by the Moguls.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: News reaches Baghdad that Balkh has been besieged, captured, and destroyed
