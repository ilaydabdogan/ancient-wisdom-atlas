canonical_text:
  quote: ''
  summary: 'The passage presents biographical and miracle anecdotes about Sultan Veled:
    his childhood interpretation of Moses'' rod through the image of a taper dispelling
    darkness; his later leadership and writings; Husamu-''d-Din''s promise to guide
    him after bodily death through visions; Sultan Veled''s teaching that God speaks
    through inward promptings, illustrated by a preacher, a dervish, and a hesitant
    merchant; and the birth and miraculous infant speech of Chelebi Emir ''Arif, followed
    by a prophecy of his sanctity and succession.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jelalu-'d-Din discoursed on the miracle of Moses' rod swallowing the rods
    and engines of Pharaoh's magicians while itself becoming no thicker or longer.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
