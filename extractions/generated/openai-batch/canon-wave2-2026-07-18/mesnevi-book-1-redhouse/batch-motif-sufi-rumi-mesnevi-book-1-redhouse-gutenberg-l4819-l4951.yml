    Veled compared it to a lighted taper brought into a dark room, devouring the darkness
    while remaining small.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Jelalu-'d-Din embraced and kissed Sultan Veled, blessed him, and praised his
    illustration as a pearl of the first water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sultan Veled's elder brother 'Alau-'d-Din was killed in the tumult associated
    with the execution of Sheykh Shemsu-'d-Din of Tebriz by the Qonya police authorities.
  category: sequence
  evidence_refs:
  - ev:4
