candidate_motifs:
- id: motif:1
  label: holy boundary protects a fold
  taxonomy_refs: []
  basis: The shepherd’s drawn circle functions as a boundary that keeps wolves out
    and sheep in.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents the circle as saintly protection, but no supplied
    taxonomy family directly matches the boundary motif.
- id: motif:2
  label: elements selectively obey divine protection and judgment
  taxonomy_refs:
  - divine_judgment
  basis: Fire, sea, and earth are depicted as sparing chosen or righteous figures
    while destroying adversaries.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
  confidence: high
  cautions: The examples are compressed allusions; the extraction uses only the passage’s
    brief statements.
- id: motif:3
  label: breath animates lifeless clay
  taxonomy_refs:
  - resurrection
  basis: Jesus’s breath makes clay birds become living birds that fly away.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage describes animation of clay rather than resurrection of a
    dead being; taxonomy link is approximate.
- id: motif:4
  label: sincere praise ascends and mercy descends
  taxonomy_refs:
  - ascent
  - sacred_exchange
  basis: Breathings and words of praise rise to God, and rewards descend in showers
    of mercy.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The exchange is devotional rather than transactional in a narrow material
    sense.
- id: motif:5
  label: return to source through hidden ascent
  taxonomy_refs:
  - return
  - ascent
  basis: Water is restored to its source by air, and breath/soul is described as moving
    upward from the house of clay toward God’s throne.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage uses analogy and doctrine-like reflection, not a full narrative
    journey.
- id: motif:6
  label: ruler rejects counsel and increases injustice
  taxonomy_refs: []
  basis: The king dismisses the accounts, ignores counsel urging restraint, and imprisons
    the councillors.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a short episode within a larger polemical sequence.
- id: motif:7
  label: persecutory fire recoils on perpetrators
  taxonomy_refs:
  - divine_judgment
  basis: The passage says fire burns the mob and that their fire recoiled upon themselves
    as justice.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The source passage contains hostile anti-Jewish polemic; the motif label
