  quote: ''
  summary: The passage presents a chain of exempla about saintly protection, divine
    control of fire, sea, earth, breath, clay, rock, praise, and punishment; it then
    reflects on affinity, return to source, and delusive counterfeits before opening
    the fable of the lion and the beasts from Kalīla and Dimna.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shaybān the shepherd draws a circle around his fold before going to the Friday
    midday congregation so that a wolf will not seize the sheep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: No wolf breaks the spell, and the sheep do not stray beyond the marked limit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The circle traced by a saint is described as a stone-like barrier against
    wind, wolf, sheep, and lusts.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: For the Gnostic, death is described as a harmless, mild, summer-like breeze.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fire is said to be fangless and unable to harm Abraham, who is called God’s
    Chosen Friend.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Red Sea waves are said to know the host of Israel but to drown Pharaoh’s
    armies by divine command.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The earth is said to gape at Jehovah’s word and devour Korah and his wealth
    while sparing Moses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In Jesus’s hand, clay warmed with his breath becomes living birds that rise,
    spread wings, and fly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Human praises are compared to breath from the body; sincerity vivifies them
    and they mount to heaven.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The rock of Sion is said to dance at the sight of Moses’s God and to have
    its faults removed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Jewish king expresses surprise, calls the preceding things mockeries and
    lies, is urged by his councillors to be calmer, and then has those councillors
    fettered and imprisoned.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A shout from heaven threatens vengeance; fire blazes and burns the mob identified
    in the passage as Jews, and the narrator says their fire recoils upon themselves.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Water enclosed in a tank is described as being absorbed by air and gradually
    restored to its source.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Breath is described as gradually stealing the soul from the body, called a
    house of clay, through words of praise ascending to God’s throne.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Breathings and praise rise in sincerity, while rewards and mercy descend;
    the passage describes this as an alternating rising and descending.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage says each person turns toward a place where joy was once tasted,
    and that pleasures are strongest among things of their own kind or class.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: Examples of mistaken attraction include birds taking a whistle for a mate’s
    note, a thirsty man taking pleasure in wine, and a pauper being amused by counterfeit
    coin.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: The speaker warns not to be misled by a gilded counterfeit, saying delusion
    will plunge a person into hell’s pit.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:19
  text: The passage introduces a tale called “The Lion and the Beasts” and states
    that Kalīla and Dimna’s book relates it.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:20
  text: Four-footed game in a sheltered vale tremble because a lion repeatedly carries
    off victims, making the vale like a prison.
  category: action
  evidence_refs:
  - ev:12
- id: obs:21
  text: The beasts hold a consultation and propose to satisfy the lion’s hunger by
