canonical_text:
  quote: ''
  summary: The passage teaches through images of storms, trees, reeds, axes, fire,
    water, and breath that outer forms yield to inward spiritual force. It describes
    God sending the same vital air as destruction to ‘Ād and as gentle benefit to
    the faithful, then turns to angels who scorn human sin while not seeing their
    own defect. God rebukes them by saying their chastity and purity are derived from
    Him. Further analogies concern an ugly man angered by his mirror, a self-important
    prophetic scribe, bird-songs that cannot be understood by imitation alone, and
    a deaf man planning a visit to a sick neighbor by guessing the expected replies.
  language: English
  quote_policy: summarized
