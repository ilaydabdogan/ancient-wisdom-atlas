  summary: The passage gives didactic counsel through images of Abraham and fire,
    sea-diving, saintly and sinful transformation, Moses and the Egyptian magicians,
    the need to listen before speaking, Adam’s tearful repentance after expulsion
    from Eden, reform of appetite and livelihood, and the resumed tale in which a
    merchant tells his parrot that a green parrot died after hearing its message.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressee is told that a Nimrod is within him, warned not to approach
    fire unless he aspires to Abraham, and warned not to wade into the deep sea if
    he is neither swimmer nor seaman.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Abraham is said to have brought a fresh red rose from fire; a diver can choose
    pearls from the sea-bottom; a saint handles earth and turns it to gold; a sinner
    by touch turns this to earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage contrasts a just or perfect man accepted by God with an imperfect
    one whose hand is called Satan’s limb and whose wisdom or science becomes misguidance
    or ignorance.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Egypt’s magicians in Pharaoh’s days contend against Moses, acknowledge his
    superiority, invite him to cast down his rod first, and are told by Moses to cast
    down their wands first.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The perfect man is described as free to eat and speak, while the imperfect
    person is told to eat but not speak and is compared to an ear rather than a tongue.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A newly born infant is speechless while sucking the breast and must hear before
    learning to speak; one who cannot hear remains mute.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The addressee is instructed to listen to teachers; God’s voice is said to
    need no ear, and God is said to have learned from no one, while all others require
    instruction and patterns.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The addressee is told to adopt the dervish frock and weep; Adam is said to
    have been saved from blame by tears after coming down to the nether world and
    being shut out from paradise.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Those sprung from Adam are urged to seek God’s pardon with burnings of heart
    and moisture of eyes, compared to sun and rain raising sorrow’s fruit.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The addressee is told to empty the stomach of greedy bread, find the heart
    filled with love for Godhead, wean the infant soul from the gross milk of greed,
    and teach it an angelic creed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: An honestly earned morsel is said to bring light to the soul and wisdom; oil
    that extinguishes a lamp is said to be water rather than oil.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: A morsel when eaten is compared to a seed whose fruit is thought, and when
    swallowed is compared to a sea that brings pearls; good morsels are said to produce
    good works and firm striving.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The merchant completes his trading, returns home joyfully, and brings presents
