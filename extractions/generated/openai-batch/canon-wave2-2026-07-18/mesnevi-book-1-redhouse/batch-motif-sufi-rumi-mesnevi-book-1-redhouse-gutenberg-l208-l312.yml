canonical_text:
  quote: ''
  summary: 'The translator’s preface gives a biographical and historical account of
    El Eflaki, the Mevlevi order, and Jelalu-''d-Din Rumi: his family lineage, departure
    from Balkh, travels, marriages, children, studies, teaching posts, spiritual teachers
    and companions, the conflict around Shemsu-''d-Din of Tebriz, and the later assistance
    of Salah-ud-Din Feridun.'
  language: English
  quote_policy: summarized
