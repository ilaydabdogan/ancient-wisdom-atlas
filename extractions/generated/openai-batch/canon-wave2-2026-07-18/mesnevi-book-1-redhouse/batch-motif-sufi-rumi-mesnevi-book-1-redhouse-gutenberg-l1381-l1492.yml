candidate_motifs:
- id: motif:1
  label: Revered poem discloses spiritual authority
  taxonomy_refs:
  - wisdom
  basis: Jelāl’s ode captivates cultured men, is selected by Sa’dī as the requested
    sublime ode, and causes both Sa’dī and the Bakharz Sheykh to praise Jelāl highly.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents hagiographic praise of a poem rather than a complete
    mythic narrative.
- id: motif:2
  label: Pilgrimage to behold the sacred teacher
  taxonomy_refs:
  - mystical_quest
  - departure
  basis: Sa’dī travels to Qonya to meet Jelāl, the Bakharz Sheykh urges capable friends
    to set out to visit him, and Muzahhiru-’d-Dīn later travels to see him and convey
    greetings.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  confidence: high
  cautions: The journeys are devotional visits within a saintly biography; the passage
    does not describe a full quest cycle.
- id: motif:3
  label: Holy person as cosmic pole
  taxonomy_refs:
  - world_center
  basis: The Bakharz Sheykh explicitly calls Jelāl the pole of the heavens and of
    the earth and a wonderful Sultan appearing on earth.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is reported speech by an admirer; the passage does not independently
    narrate cosmological action.
- id: motif:4
  label: Saint converts threatening genii into disciples
  taxonomy_refs: []
  basis: Genii complain that Jelāl’s practice harms them and threaten mischief, but
    Jelāl later says he has converted them all and that they will harm no friend or
    dependent of their teacher.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The episode is reported through Kirā Khātūn and Jelāl’s later statement;
    no detailed conversion scene is narrated.
- id: motif:5
  label: Nocturnal vigil of study before a light-bearing object
  taxonomy_refs:
  - wisdom
  - mystical_quest
  basis: Jelāl stands all night until daybreak before a man-height candlestick studying
    his father’s writings, a practice strong enough in the narrative to disturb the
    genii.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage does not explicitly call the vigil ascetic or initiatory;
    that function is inferred from the devotional context.
- id: motif:6
  label: Forty-day visionary alteration followed by an arduous ride
  taxonomy_refs:
  - mystical_quest
  - initiation
  basis: Jelāl is described as exercised by visions from the spiritual world for forty
    days, appearing beside himself, and then undertaking a sudden ride on an unbroken
    horse that returns nearly exhausted.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: The meaning, destination, and result of the ride are not explained in
    the passage.
- id: motif:7
  label: Sanctity supported by spiritual ancestry
  taxonomy_refs: []
  basis: The Bakharz Sheykh links Jelāl’s greatness to Bahā Veled and his ancestors,
    describing them as great Sheykhs and tracing the line to Abū-Bekr.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: This is a lineage claim embedded in praise, not a narrated ancestral episode.
