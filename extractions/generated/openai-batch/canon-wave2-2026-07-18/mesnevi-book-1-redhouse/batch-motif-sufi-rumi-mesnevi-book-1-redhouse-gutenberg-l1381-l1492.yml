canonical_text:
  quote: ''
  summary: Anecdotes recount the reception of a Persian ode by Jelāl, the admiration
    of Sa’dī and a Sheykh of Bakharz, journeys to meet Jelāl, Jelāl’s nocturnal study
    by a tall candlestick, the complaint and later conversion of college-dwelling
    genii, and a forty-day visionary state followed by Jelāl’s demanding ride on an
    unbroken horse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shemsu-’d-Dīn Hindī asks Sa’dī to select the best Persian ode he knows for
    presentation to the great Khān of the Moguls.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sa’dī selects a recently known ode by Jelāl, praises its words, and expresses
    a wish to go to Rome and place his face in the dust under Jelāl’s feet.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prince thanks Sa’dī with valuable presents, and Sa’dī later goes to Qonya,
    kisses Jelāl’s hand, and is received by the dervish circle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The prince sends a copy of the ode to his own Sheykh at Bakharz, and learned
    men gather while the Sheykh reads it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After reading the ode, the Bakharz Sheykh shows intense delight, rends his
    garments, and praises Jelāl with exalted titles including champion of the Faith,
    pole of heaven and earth, and Sultan.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bakharz Sheykh urges those able to travel to visit Jelāl, whom he calls
    a great light, and says his own age and infirmity prevent him from going.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Bakharz Sheykh describes Jelāl’s father and ancestors as great Sheykhs
    and traces their progenitor to Abū-Bekr.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Sheykh asks his eldest son Muzahhiru-’d-Dīn to convey greetings to Jelāl
    if he sees him; after the old man’s death, the son travels to Rome, sees Jelāl,
    delivers the message, and returns to Bakharz.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kirā Khātūn reports that a candlestick as tall as a man stood in the household
    and that Jelāl stood before it all night until daybreak studying his father’s
    writings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A company of genii living in the college appears to Kirā Khātūn to complain
    that Jelāl’s practice causes them suffering and to warn that they may do mischief.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Kirā Khātūn tells Jelāl about the genii’s complaint; he smiles, later says
    he has converted them all, and says they have become his disciples and will not
    harm his friends or dependents.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: A chief disciple, described as a butcher, dog trainer, and horse purveyor,
    relates that Jelāl was affected by spiritual visions for forty days and passed
    through the streets bareheaded with his turban around his neck.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Jelāl comes to the butcher sweating, asks for an unbroken horse to be saddled,
    mounts it after the butcher and three stable-men saddle it with difficulty, and
    sets off southward after asking for prayers and holy wishes.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Jelāl returns in the evening covered with dust, and the large horse is nearly
    exhausted, reduced to skin and bone and almost broken-backed with fatigue.
  category: sequence
  evidence_refs:
  - ev:11
