canonical_text:
  quote: ''
  summary: The passage condemns a false spiritual pretender who uses Gnostic language,
    claims divine authority, invites followers to a false table of bounty, and wastes
    pupils' lives. It then presents the woman's husband counseling his wife toward
    silence, contentment, trust in God's provision, acceptance of suffering as a portion
    and herald of death, and harmonious partnership through analogies of matched shoes,
    balanced camel loads, and the path to contentment.
  language: English
