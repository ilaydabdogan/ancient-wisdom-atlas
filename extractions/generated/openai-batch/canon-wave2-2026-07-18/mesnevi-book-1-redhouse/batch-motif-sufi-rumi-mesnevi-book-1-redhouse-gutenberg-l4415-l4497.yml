canonical_text:
  quote: "“A saint, however, knows not only the solution of so paltry a trick as this”"
  summary: The passage introduces Sheykh Salāhu-’d-Dīn Ferīdūn, his association with
    Jelāl, and his appointment as Jelāl’s assistant. It then recounts a royal test
    in which the king seals a young snake inside a gold box and asks religious authorities
    to identify the hidden contents; Ferīdūn exposes the trick and asserts saintly
    knowledge of hidden things. The king becomes a disciple. The passage also describes
    Fātima’s marriage to Sultan Veled, angelic attendance at the wedding, and Fātima’s
    saintly ascetic and charitable conduct.
  language: English
  quote_policy: quoted
