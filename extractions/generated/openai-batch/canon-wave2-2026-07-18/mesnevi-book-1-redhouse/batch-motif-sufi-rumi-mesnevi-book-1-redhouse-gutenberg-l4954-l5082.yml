canonical_text:
  quote: ''
  summary: 'The passage recounts hagiographic anecdotes about Emir Arif: a spirit-visit
    to an ancestral tomb during which his shout stops two quarrelling dervishes, later
    verified by notes and witnesses; then a final journey episode in which Arif dreams
    of a paradise-like garden, is summoned by Jelaluddin, announces a journey to heaven,
    becomes ill, and speaks of ascending beyond the sun and stars.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the eve of the Festival of Sacrifices in A.H. 717, Emir Arif and Eflaki
    were at Sheikh Suhrab's convent in Sultaniyya with friends and saints; others
    studied books while Arif slept.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:2
  text: Arif suddenly raised his head, made a loud shout that caused those present
    to tremble, and then went back to sleep without speaking.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: After waking, Arif said he had gone in spirit to his great-grandfather's tomb,
    saw Nasiruddin and Shujauddin seizing each other by the collar in a dispute, called
    out for them to desist, and said two men and one pious woman saw him there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:4
  text: Eflaki made a note of Arif's account with the date and hour.
  category: action
  evidence_refs:
  - ev:5
- id: obs:5
  text: Later at Ladik, Nasiruddin reported that on the same festival eve he and Shujauddin
    quarrelled in the mausoleum, heard Arif's voice from the direction of the feet
    of holy Baha Veled, trembled, embraced, and bowed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:6
  text: Eflaki produced his memorandum-book and showed the dated entry; the friends
    marvelled and rejoiced.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: Arif said he disliked displaying miraculous power but that such scenes sometimes
    occurred for his disciples' edification; the passage names such miracles as manifestations
    and ekstasis of the spirit.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:8
  text: At Qonya, three friends, one a lady, testified that they had seen Arif at
    the tomb on that day and heard him shout.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:9
  text: During Arif's last journey, at Aq-Seray, he wept, moaned, and sobbed in his
    sleep, and in the morning said he had seen a strange dream.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: In the dream, Arif was seated in a vaulted chamber with windows looking onto
    a paradise-like garden containing flowering shrubs, fruit-bearing trees, heavenly
    youths and maidens, and melodious voices.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:11
  text: In the dream flower-garden, Arif saw his grandfather Jelaluddin; Jelaluddin
    looked toward him, beckoned him to approach, and told him that his time and term
    had come and that he must come to him.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:12
  text: Arif explained that he had wept from joy at his grandfather's invitation and
    said it was time for him to make his journey to heaven and drink of the cup of
    God's might.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:13
  text: After continuing toward Qonya, Arif's indisposition grew more severe; at Qonya
    he stood silently in the gateway of his great-grandfather's mausoleum at sunrise,
    contemplated the sun, and smiled.
  category: sequence
  evidence_refs:
  - ev:13
  - ev:14
- id: obs:14
  text: Arif told his disciples that he was tired of the lower world and that the
    time had come to trample on the stars, mount beyond the sun, occupy himself with
    the mysteries of the heavenly choir, and be delivered from worldly change; his
    disciples wept.
  category: speech
  evidence_refs:
  - ev:15
