canonical_text:
  quote: ''
  summary: The Vazir, secluded in a cell, tells his disciples that Jesus commanded
    him to withdraw from human company and that he is departing for heaven. He secretly
    tells each legion-captain that he alone is the appointed successor, gives each
    a different doctrinal scroll, and orders secrecy until his death. After forty
    days the Vazir kills himself. The people mourn him intensely and later seek the
    successor he appointed. The passage then turns to a teaching on God’s invisibility,
    prophets as manifestations of divine unity, the insufficiency of bodily perception,
    the union of many lights into one light, spirit over letter, bodily mortification,
    and the recovery of primordial unity beyond divided fleshly forms.
  language: English
  quote_policy: summarized
