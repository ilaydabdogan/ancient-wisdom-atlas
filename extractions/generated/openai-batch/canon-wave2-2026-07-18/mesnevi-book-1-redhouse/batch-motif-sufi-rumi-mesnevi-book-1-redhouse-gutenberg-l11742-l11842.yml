canonical_text:
  quote: ''
  summary: A poor desert stranger praises court officials and says he has come to
    the Caliph’s capital seeking favor. He compares his quest for bread, water, or
    advancement to examples in which ordinary pursuits lead to unexpected elevation
    or spiritual discovery, including Joseph, Moses, Jesus, Adam, a falcon, a schoolchild,
    and Abbās. The passage then moralizes on lovers of the Infinite versus finite
    attachments and on prophets as mediators. The Arab presents a small green-glazed
    pot of fresh rain-and-dew water to the Caliph; the guards laugh privately but
    receive it politely because the Caliph’s kindness has shaped his court. The passage
    closes with an analogy of a king as a reservoir and servants as channels of bounty
    or corruption.
  language: English
  quote_policy: summarized
