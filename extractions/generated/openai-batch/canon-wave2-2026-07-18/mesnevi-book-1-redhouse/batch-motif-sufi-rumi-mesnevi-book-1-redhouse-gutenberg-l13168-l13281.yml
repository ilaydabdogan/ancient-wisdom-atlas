canonical_text:
  quote: ''
  summary: The passage first describes angels who verbally acknowledge God's rule
    but inwardly grow proud and propose descending to earth, ruling justly, commanding
    worship, and returning nightly to heaven. It then opens the section titled “The
    Chinese and Roman Artists” with counsel about drunkenness, children, worldly people
    as infants around saints, worldly quarrels as toy battles, false imagination as
    a failed steed, saintly ascent on fiery steeds, and the contrast between burdensome
    worldly learning and heart-born wisdom. It urges drinking God's cup, following
    names and attributes toward union, seeking reality rather than reflected names,
    purging the self, burnishing the mind like a mirror, and receiving wisdom directly
    in the heart. It quotes the Prophet on soul-to-soul recognition and introduces
    a riddle of overnight transformation from Kurd to Arab before announcing the contest
    of Chinese and Roman art.
  language: English
  quote_policy: summarized
