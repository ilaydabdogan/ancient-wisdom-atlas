canonical_text:
  quote: Death’s but the throes that launch the spirit to its goal.
  summary: The passage describes saints seeing future blessedness or woe before birth,
    the body as a mother bearing the soul and death as birth of the spirit, and a
    visionary disclosure by Zeyd of judgment-day separation, hell, heaven, the gulf
    between them, Kawthar, and the grief or joy of souls. The Prophet responds with
    images of the mirror and balance as instruments that do not conceal truth, and
    Zeyd concludes that human beings cannot grasp the sun of truth.
  language: English
  quote_policy: quoted
