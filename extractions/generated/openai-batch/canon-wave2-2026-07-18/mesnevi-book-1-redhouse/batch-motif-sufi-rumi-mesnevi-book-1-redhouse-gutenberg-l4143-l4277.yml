canonical_text:
  quote: ''
  summary: A series of anecdotes presents Shemsu-’d-Dīn recognizing a headsman as
    a saint, testing Husāmu-’d-Dīn through the surrender of possessions, departing
    Qonya, protecting himself from palace assailants, punishing and pardoning a disciple,
    and prompting Jelāl to pray for the sleeping inhabitants of Qonya to awaken through
    a storm and rain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shemsu-’d-Dīn is seated with disciples when a public executioner passes, and
    Shems calls him one of God’s saints.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shems explains that the executioner killed a man of God, released his soul
    from bodily bondage, and received the saint’s saintship as a bequest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The next day the executioner gives up his office, vows repentance, bows to
    Shemsu-’d-Dīn, and professes himself a disciple.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Husāmu-’d-Dīn shows respect, humility, and service toward Shemsu-’d-Dīn; Shems
    tells him to give coin and offer service to the Lord in order to rise in the order.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Husām collects valuables, money, his wife’s jewels, provisions, and proceeds
    from a vineyard and country-seat, and lays them at Shems’s feet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Shems says the surrender of worldly possessions tests sincerity and that advancement
    comes through service and spending in God’s cause.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Shems restores Husām’s goods, keeps one piece of silver, later gives him nine
    times as much, and Husām eventually becomes ruler of God’s saints and keeper of
    God’s treasury.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Shemsu-’d-Dīn leaves Qonya for Damascus after his first visit, and his departure
    leaves Jelāl uneasy and excited.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In a palace at Bagdād, a eunuch signals slaves to drive Shems away; the slaves
    raise swords but become incapacitated, and the eunuch dies two days later.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Shemsu-’d-Dīn punishes a disciple of Bahā Veled with deafness, later pardons
    him and restores his hearing, but the disciple continues to bear rancor.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: In a market, the disciple proclaims Shemsu-’d-Dīn the apostle of God; market-people
    seek to kill him, but Shems’s shout causes an attacker to fall dead and the rest
    to bow and submit.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: On a moonlit night, Shems and Jelāl stand on the college roof while Qonya’s
    inhabitants sleep on housetops; Shems asks Jelāl to wake them for the night’s
    blessings.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:13
  text: Jelāl faces toward Mekka and prays to God for wakefulness for the people,
    invoking love for Shemsu-’d-Dīn.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: A black cloud, thunder, lightning, and heavy rain follow; sleepers take refuge
    indoors, and disciples gather at daylight.
  category: sequence
  evidence_refs:
  - ev:14
