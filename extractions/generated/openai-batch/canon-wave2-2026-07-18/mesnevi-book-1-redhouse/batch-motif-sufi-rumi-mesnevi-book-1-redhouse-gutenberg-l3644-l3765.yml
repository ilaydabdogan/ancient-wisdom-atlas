canonical_text:
  quote: ''
  summary: 'The passage contains a poetic address to Husāmu-’d-Dīn and several anecdotes
    about Jelāl: opposition to his music and dancing is rejected by a legal authority;
    Jelāl explains music, song, and dance as necessary for saints facing overwhelming
    divine manifestations; a painter-disciple steals a tablet with portraits of Mary
    and Jesus and is rebuked into repentance; and, near death, Jelāl tells disciples
    not to fear because he may continue to guide them after death, while his friends
    and wife mourn.'
  language: English
  quote_policy: summarized
