candidate_motifs:
- id: motif:1
  label: Contested sacred innovation vindicated by authority
  taxonomy_refs:
  - wisdom
  basis: Music and dancing are challenged as innovations, but the Mufti’s legal answer
    and the Perwāna’s decision protect Jelāl’s institutions.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The available taxonomy reference 'wisdom' is broad; the passage frames
    the episode mainly as legal and institutional judgment.
- id: motif:2
  label: Ecstatic practice preserves saints before overwhelming divine manifestation
  taxonomy_refs:
  - mystical_quest
  - annihilation_union
  basis: Jelāl says men of God require song, music, and dance because otherwise the
    majesty of divine manifestations would cause their bodies to melt away.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage describes danger and bodily dissolution imagery; it does not
    explicitly use technical language of union.
- id: motif:3
  label: Sacred image theft followed by rebuke and repentance
  taxonomy_refs:
  - sacred_theft
  - initiation
  basis: The artist steals a tablet with portraits of Mary and Jesus from a great
    church, then repents and professes himself Muslim after Jelāl’s rebuke.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  confidence: medium
  cautions: The theft concerns a religious image, but the passage treats it as sin
    and misplaced devotion rather than as a successful acquisition of sacred power.
- id: motif:4
  label: Lifeless image contrasted with the living creature made by the divine artist
  taxonomy_refs:
  - wisdom
  basis: Jelāl uses the artist’s admission that the portraits are lifeless to teach
    that the living human is the handiwork of a maker who framed the universe.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: This is a didactic motif within the passage; broader iconological implications
    should not be inferred from this excerpt alone.
- id: motif:5
  label: Posthumous spiritual guidance by saint or master
  taxonomy_refs:
  - return
  - wisdom
  basis: Jelāl says disciples should remember him so he may show himself in whatever
    form and inspire them, using Mansūr’s posthumous guidance of ‘Attār as precedent.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: For Jelāl, the passage records a promise or assurance rather than narrating
    a later apparition.
- id: motif:6
  label: Death as continued blessing to disciples
  taxonomy_refs:
  - return
  basis: Jelāl cites Muhammed’s saying that life and death are both blessings, and
    tells disciples not to fear his approaching death.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The 'return' taxonomy reference is approximate; the passage emphasizes
    continuing blessing and guidance rather than a full return narrative.
comparison_claims:
- id: claim:1
  claim: The passage explicitly presents Jelāl’s promised posthumous presence as functionally
    comparable to Mansūr’s spirit appearing after death to guide Ferīdu-’d-Dīn ‘Attār.
  claim_level: same_function
  target: Mansūr’s posthumous guidance of Ferīdu-’d-Dīn ‘Attār
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is internal to the passage; it does not provide independent
    details about Mansūr, ‘Attār, or the historical circumstances.
- id: claim:2
  claim: The passage aligns Jelāl’s life and death as sources of blessing with the
    saying attributed to Muhammed that both his life and his death bless his disciples.
  claim_level: same_function
  target: Muhammed’s saying about life and death as blessings
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The saying is cited as authority; the passage does not narrate a specific
    posthumous appearance by Muhammed.
- id: claim:3
  claim: The Mufti’s answer compares a laudable innovation by a perfect follower of
    the prophets to the customary practices of the prophets themselves.
  claim_level: same_function
  target: Prophetic custom as a model for laudable innovation
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a legal-religious analogy rather than a developed mythic narrative
    comparison.
