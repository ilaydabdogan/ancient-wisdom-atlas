  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Shemsu-’d-Dīn is described as seeking the beloved object of the soul, identified
    as God, while clothing his body in coarse felt that concealed his spiritual greatness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Damascus, Shemsu-’d-Dīn first saw Jelālu-’d-Dīn by chance in a crowded
    marketplace, and Jelāl avoided him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Shemsu-’d-Dīn later followed Jelāl to Qonya; after three months of seclusion
    in religious, scientific, and spiritual inquiry, he concluded that he had never
    met Jelāl’s equal.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: When worn out by divine manifestations and ecstasies, Shemsu-’d-Dīn would
    withdraw, hide himself, and work as a day-laborer at the water-wheels of the Damascus
    gardens until his equanimity returned.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Shemsu-’d-Dīn prayed to know whether either the corporeal or spiritual world
    contained a saint who could keep him company; an answer from the unseen world
    named Jelālu-’d-Dīn of Rome, after which he set out for Asia Minor.
  category: speech
  evidence_refs:
  - ev:3
