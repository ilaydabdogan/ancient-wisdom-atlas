canonical_text:
  quote: ''
  summary: The passage begins with an unnamed woman leaving and the branch returning
    from Bran's hand to hers. Bran then goes to sea with his company. After two days
    and nights he sees a chariot-rider on the sea, who sings to him and identifies
    himself as Manannan son of Ler. Manannan describes the same sea as a happy flowering
    plain, Mag Mon, land, and the land of Manannan, where rivers pour honey and sea
    creatures appear as peaceful domestic animals. He also speaks of a later coming
    to Ireland and a son named Mongan son of Fiachnai.
  language: Old Irish with English translation and editorial notes
  quote_policy: summarized
