canonical_text:
  quote: ''
  summary: 'The passage summarizes the tale of Connla: a damsel from a deathless land
    approaches him at Uisnech, invites him to the Plain of Delight, leaves him an
    inexhaustible apple, returns after a month, and departs with him in a glass currach
    across the sea. It then comments on Connla’s legendary genealogy and contrasts
    him with Bran.'
