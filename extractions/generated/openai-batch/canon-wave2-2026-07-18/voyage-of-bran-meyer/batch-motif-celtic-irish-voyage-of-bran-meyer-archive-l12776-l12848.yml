canonical_text:
  quote: ''
  summary: 'The passage summarizes Virgilian ideas of Elysium: Aeneas sees a bright
    realm of the blessed after Tartarus, where worthy persons sing, dance, feast,
    and are associated with Orpheus and Apollo. Anchises explains a cosmic spiritual
    principle, purification in Hades and Elysium, Lethe, and the return of souls to
    new bodies after a thousand-year cycle. The author then compares classical Elysium
    materials with Irish non-Christian otherworld traditions, arguing that Christian
    or late classical literature is insufficient to explain Irish legends of Manannan’s
    realm, the sid of Mider or Angus, and a land a favored mortal may reach without
    dying.'
  language: English
  quote_policy: summarized
