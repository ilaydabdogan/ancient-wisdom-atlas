canonical_text:
  quote: ''
  summary: The passage narrates Mongán’s encounter involving Dubh-Lacha and the King
    of Leinster, his refusal to recover his wife by battle, and his later plan with
    Mac an Daim to enter the Leinster fort through magical transformation and assumed
    identities.
  language: Irish, with English editorial heading
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A golden fidchell board is brought, and Mongán and the girl are playing; Dubh-Lacha
    exposes her breast to Mongán, he looks at her, desire for the girl comes upon
    him, and Dubh-Lacha notices this.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The King of Leinster calls with his hosts around the fort; the fort is opened,
    and he asks the girl whether Mongán is inside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The girl answers that Mongán is inside, and the King of Leinster asks for
    a request: if Mongán’s mind is with her, she should tell the king, because when
    Mongán moves his mind will be with her.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the end of a quarter, Mongán comes, his mind is upon her, the host of the
    town is present, and Mongán turns away from the fort and returns to his house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: During that quarter Mongán is in a long wasting sickness, and the nobles of
    Ulster gather and offer that he come with them to give battle on account of his
    wife.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mongán says the woman was taken from him through his own lack of cleverness,
    and that no Ulster man should fall over bringing her out until he himself brings
    her by his own cleverness.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the year has passed, Mongán and Mac an Daim go toward the house of the
    King of Leinster, where the nobles of Leinster are gathering and a great feast
    is being prepared in connection with Dubh-Lacha.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mac an Daim asks Mongán in what form they will go; nearby they see Cuimne,
    the old woman of the mill, with a large dog named Brother tied to her and licking
    the millstone, and they also see an old saddle or worn riding gear on an animal
    drawing grain and meal from the mill.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Mongán says he has a form in which they will go, and if it is destined for
    him to get his wife, he will get her by this trick; he has Mac an Daim summon
    Cuimne, and she agrees to his counsel.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Mongán strikes the dog with a magic wand and makes it into a beautiful small
    white lapdog with a silver chain and golden bell.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Mongán strikes the old woman with the wand and makes her into a beautiful
    young girl, identified in the passage as Ibhell Gruadhsolus, daughter of the King
    of Munster.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Mongán takes the form of Aedh, son of the King of Connacht, makes Mac an Daim
    take the form of his servant, prepares splendid clothing and riding gear, and
    the group goes in that likeness to the fort.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The doorkeepers report to the King of Leinster that Aedh Alaind, his servant,
    and his wife Ibhell Gruadhsolus have come in exile and under the king’s protection;
    the king comes out, welcomes them, and calls the supposed son of the King of Connacht
    to his shoulder.
  category: sequence
  evidence_refs:
  - ev:11
