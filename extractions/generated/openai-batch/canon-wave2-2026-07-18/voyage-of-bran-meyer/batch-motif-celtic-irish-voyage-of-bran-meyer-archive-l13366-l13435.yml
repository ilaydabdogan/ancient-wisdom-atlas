canonical_text:
  quote: ''
  summary: A scholarly comparison of Norse and Irish romance traditions argues that
    Irish wonderlands are associated with divine kin, while Scandinavian wonderlands
    are associated with beings alien or hostile to the Asgard god clan. The passage
    contrasts Irish Elysium-like wonderlands with Scandinavian paired Elysium and
    Tartarus realms, rejects simple derivation in either direction, and cautiously
    suggests possible sporadic Norse influence on some Maelduin episodes involving
    a guarded deserted island-palace, punished theft, and companions left behind on
    the Isles of Imitation.
  language: English
  quote_policy: summarized
