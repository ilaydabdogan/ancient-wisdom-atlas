- id: obs:1
  text: The travelers advance to a wide smooth plain covered with flowering cloves
    and honey, where three prominent hills are each crowned with a fort.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the nearest fort, a white-bodied lady greets Teigue by name, promises victuals
    and supply, and identifies the fort as the fort of Ireland's kings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same lady names the land Inis locha and says two sons of Bodbh reign over
    it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the next, golden-colored fort, a golden-clad queen greets Teigue and says
    his journey had long been foretold.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The queen identifies herself as Cesair, daughter of Bethra son of Noah, and
    says she and her companions abide there in everlasting life.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cesair describes a red loch island with a gold-palisaded island containing
    saints and righteous people, and a golden-rampart fort housing kings, rulers,
