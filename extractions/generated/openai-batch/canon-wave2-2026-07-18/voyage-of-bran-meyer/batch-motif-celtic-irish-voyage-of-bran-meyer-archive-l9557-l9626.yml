  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the third hill is a beautiful seat and a gentle youthful couple wearing
    green garments, red-gold chains, and golden torques.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Veniusa says she is a daughter of Adam and one of four daughters placed in
