canonical_text:
  quote: ''
  summary: Teigue and his company proceed through a honeyed flowering plain with three
    fort-crowned hills. Female figures at successive forts identify paradisal lands
    and their inhabitants, including Irish kings, saints, righteous people, and Adam's
    descendants. On the third hill Veniusa and Connla are sustained by an undiminishing
    golden apple; Connla says Veniusa brought him there. Teigue is told that a future
    dwelling is prepared for righteous kings and that he may obtain it through belief.
  language: English
  quote_policy: summarized
