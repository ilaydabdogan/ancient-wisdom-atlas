  summary: The passage is a scholarly discussion of the difficulty of dating Irish
    romance. It argues that annalistic dating is not an unerring guide, notes that
    early historical settings could be used to contain floating folk tales, contrasts
    the tragic Ultonian cycle with more playful Irish romance, distinguishes Christian
    from Pagan forms of the marvellous in kings' lives, and states a methodological
    distinction between written forms of tales and their underlying oral traditions.
