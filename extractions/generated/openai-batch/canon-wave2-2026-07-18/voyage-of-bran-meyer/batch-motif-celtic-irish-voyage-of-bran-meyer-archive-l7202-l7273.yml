canonical_text:
  quote: ''
  summary: 'The passage argues that the preserved form of Bran''s Voyage is unlikely
    to predate the late seventh century and is more likely eighth-century, partly
    on the basis of Latin loan words and borrowing from Latin Christian culture. It
    describes the tale as partly Pagan but retold with Christian allusions. It then
    frames Bran''s Voyage as one example of a wider Irish romantic narrative class
    and summarizes its Happy Otherworld: mortals may reach it when summoned by denizens
    of that land; the summons comes from a damsel whose approach is marked by magically
    sweet music and who bears a magic apple-branch.'
  language: English
  quote_policy: summarized
