canonical_text:
  quote: ''
  summary: 'The passage first discusses giant-being traditions associated with Finn
    and the continuing Irish motif of the Happy Otherworld. It then summarizes the
    opening of The Adventures of Teigue, son of Cian: Cathmann raids Munster and carries
    off Teigue''s wife, kin, and people; Teigue builds a large currach and sails with
    warriors to recover them; the voyage includes marvelous islands, giant animals,
    transformative bird eggs, loss of direction, and arrival at a delightful land
    where fragrant branches satisfy hunger.'
  language: English
  quote_policy: summarized
