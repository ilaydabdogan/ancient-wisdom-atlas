canonical_text:
  quote: ''
  summary: 'The passage first discusses the use of Irish Otherworld personages and
    scenery in a prophecy involving Lug''s palace, including their adaptation into
    Christianized and historicized frameworks. It then introduces the Adventures of
    Cormac in Faery: on a May morning at Tara, Cormac Mac Airt meets an aged grey-haired
    knight carrying a silver branch with three golden apples whose music induces sleep.
    The stranger says he comes from a land without age, sin, sorrow, or other afflictions,
    and gives Cormac the branch in exchange for three future wishes. Over time he
    claims Cormac''s daughter, son, and wife. Cormac pursues him, is separated from
    his men by a thick mist, reaches a great plain and a palace, finds a noble couple
    there, and is mysteriously bathed.'
  language: English
  quote_policy: summarized
