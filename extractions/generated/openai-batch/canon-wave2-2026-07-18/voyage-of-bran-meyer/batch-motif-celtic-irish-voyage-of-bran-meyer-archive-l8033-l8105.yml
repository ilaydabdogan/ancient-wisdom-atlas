canonical_text:
  quote: ''
  summary: 'The passage gives a scholarly outline of Maelduin''s voyage: he sails
    to seek his father''s murderers, violates a wizard''s instruction about the exact
    number of companions by taking in three foster-brothers, wanders among many unknown
    islands, and eventually completes his quest and returns. It then identifies two
    points of contact between the Voyages of Bran and Maelduin: an amorous queen who
    welcomes and detains a mortal visitor, and a land whose inhabitants compel a mortal
    visitor to act like them and forget his companions. The passage begins the detailed
    account of Maelduin''s twenty-seventh island, where a queen, her seventeen daughters,
    bathing, feasting, pairing, and promises of ageless lasting life are described.'
  language: English
  quote_policy: summarized
