canonical_text:
  quote: ''
  summary: Mongán desires the king of Leinster’s white red-eared cattle and obtains
    them through a binding agreement of friendship without refusal. The king of Leinster
    later comes to claim Dubh-Lacha. Dubh-Lacha urges Mongán to preserve honour by
    yielding her, but secures a one-year condition preventing cohabitation with the
    king of Leinster. Mongán suffers wasting sickness; Mac an Daimh complains that
    his own wife, Dubh-Lacha’s attendant, has also gone to Leinster, and Mongán instructs
    him to go to a cave where a basket and sods from Ireland and Scotland were left.
  language: English
  quote_policy: summarized
