canonical_text:
  quote: ''
  summary: A scholarly discussion of Rohde's view that Homeric epic interrupted an
    older Greek belief in powerful departed souls. The passage summarizes Hesiod's
    five ages by their after-death status, distinguishes Homeric Hades from cultic
    ghost-beliefs, and interprets Elysium or the islands of the blessed as a divinely
    granted alternative to ordinary death.
  language: English
  quote_policy: summarized
