canonical_text:
  quote: ''
  summary: The passage recounts Manannan’s connection with Fann, his approach over
    the sea, Fann’s choice to leave Cuchulinn and go with Manannan, Cuchulinn’s grief,
    the Druids’ drink of forgetfulness, and Manannan’s cloak separating Cuchulinn
    and Fann forever. It then gives a Christianizing explanation of the Sid and an
    editorial discussion comparing Cuchulinn’s Sick Bed with Bran and Connla and treating
    the text as a fusion of versions.
