canonical_text:
  quote: ''
  summary: Bran and his company reach the Land of Women, where a leading woman invites
    Bran ashore, uses a clew or ball with thread to draw the coracle to harbor, and
    hosts them with abundant food in a house. Their stay seems short to them but many
    years pass. Later Nechtan son of Collbran becomes homesick and the group returns
    toward Ireland despite the woman's warning that they will regret going and must
    not touch land. At Srub Brain, local men know Bran only from ancient stories.
    Nechtan leaps from the coracle, touches Irish earth, and immediately becomes a
    heap of ashes.
  language: English translation with edited Old/Middle Irish passage text
  quote_policy: summarized
