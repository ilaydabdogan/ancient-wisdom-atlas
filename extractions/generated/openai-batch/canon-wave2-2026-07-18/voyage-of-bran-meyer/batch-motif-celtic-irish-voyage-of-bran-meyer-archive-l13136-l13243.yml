canonical_text:
  quote: ''
  summary: The passage summarizes several Norse stories, chiefly Erik's search for
    Odainsakr, Helge Thoreson's encounters with Ingeborg and Gudmund's realm, and
    Gorm's expedition with Thorkill toward Geirrod's land. It frames these marvel-land
    stories as having points of contact with Irish legends and records otherworld
    routes, guarded thresholds, luminous or dark lands, supernatural hospitality,
    gifts, prohibitions, Christian reinterpretation, and return from otherworldly
    realms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that certain Norse stories about a marvel land of delights
    and riches have many points of contact with Irish legends previously cited and
    discussed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Erik, son of a petty Norse king, vows on Christmas Eve to seek Odainsakr,
    becomes Christian at Constantinople, and is told by the emperor that Odainsakr
    is Paradise beyond India encircled by a fire wall.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Erik reaches a dark forest country where stars are visible all day, crosses
    toward a river and a bridge guarded by a dragon, and he and one companion rush
    into the dragon's mouth and come through unharmed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After passing the dragon, Erik and his companion see a sunlit, flower-covered
    plain with honey rivers, fragrant still air, no darkness, and no shadows cast
    by objects.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Erik and his companion find a tower hanging in the air without foundations
    or pillars; a ladder gives entry to a velvet-carpeted room with food in silver
    dishes and wine in golden goblets.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: While Erik sleeps, a beautiful lad described as one of the guardian angels
    of Paradise and Erik's own guardian angel tells him that he has reached Odainsakr,
    the earth of living men, not Paradise; Erik later returns to Constantinople and
    Norway.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Helge, lost in a far-northern forest, meets twelve red-clad maidens on horseback;
    Ingeborg, daughter of Gudmund of the Glittering Plains, is their chief, and Helge
    stays with her for three days before receiving two chests of gold and silver.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: At the next Yule night, a storm comes and two men carry Helge away; a year
    later he returns with two strangers bearing two gold-plated horns from Gudmund
    to King Olaf Tryggwason.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Olaf fills the horns with drink and has his bishop bless them; Gudmund's messengers
    cast the horns away, noise and confusion follow, the fire is extinguished, and
    Helge and his companions disappear.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Helge later returns blind and says he had happy days in Gudmund's realm, but
    Olaf's prayers forced his host and love to release him; Ingeborg blinded him so
    that Norway's daughters would not fall in love with his eyes.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: King Gorm hears of Geirrod's mysterious rich land and is told that he must
    sail across the ocean, leave sun and stars behind, descend into Chaos, and pass
    into a land without light; he sails with Thorkill as guide in three ships.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Gorm's party reaches a land of herds after hunger; despite Thorkill's injunctions,
    sailors kill more beasts than they need, and Gorm gives up three men chosen by
    lot to appease giant inhabitants.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: In Geirrod's land, Gudmund, the king's brother, greets the travellers; Thorkill
    forbids his companions to speak, prevents access to a gold bridge over a river,
    and brings them to Gudmund's hall.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: At Gudmund's hall, Thorkill warns against food, drink, contact with hosts,
    servants, and cups; Gudmund, who has twelve sons and twelve daughters, offers
    women to the guests to undermine their chastity, and all but four resist.
  category: action
  evidence_refs:
  - ev:14
