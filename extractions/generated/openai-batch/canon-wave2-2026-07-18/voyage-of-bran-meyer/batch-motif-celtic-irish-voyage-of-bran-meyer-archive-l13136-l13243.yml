candidate_motifs:
- id: motif:1
  label: Quest for a distant marvel land
  taxonomy_refs:
  - mystical_quest
  - departure
  basis: Erik vows to seek Odainsakr, and Gorm resolves to seek Geirrod's mysterious
    rich land; both narratives involve travel toward extraordinary lands.
  evidence_refs:
  - ev:2
  - ev:11
  confidence: high
  cautions: The passage is a secondary summary rather than the primary saga text.
- id: motif:2
  label: Otherworld or afterlife land distinguished from Paradise
  taxonomy_refs:
  - afterlife_journey_map
  - duality
  basis: Odainsakr is first identified with Paradise, but the guardian angel says
    Erik has reached the earth of living men, while Paradise is reserved for spirits.
  evidence_refs:
  - ev:2
  - ev:6
  confidence: high
  cautions: The passage reports both an identification and a correction; the exact
    theological status of Odainsakr remains mediated by the summary.
- id: motif:3
  label: Guarded threshold into a luminous otherworld
  taxonomy_refs:
  - hero_descent
  basis: Erik passes through a river-bridge threshold guarded by a dragon and emerges
    into a bright, flowered, fragrant plain where there is no darkness or shadow.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The taxonomy label is approximate; the passage describes threshold crossing
    but not a full descent in the Erik episode.
- id: motif:4
  label: Abundant paradisal landscape
  taxonomy_refs:
  - afterlife_journey_map
  basis: The land beyond the dragon has flowers, rivers of honey, fragrant still air,
    perpetual light, and no shadows.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage itself later distinguishes Odainsakr from Paradise, so 'paradisal'
    is descriptive rather than an identification with Paradise.
- id: motif:5
  label: Otherworld woman as host and beloved with enforced return
  taxonomy_refs:
  - divine_beloved
  - return
  basis: Helge stays with Ingeborg, later spends happy days in Gudmund's realm, and
    is released only because Olaf's prayers force his host and love to let him depart.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: medium
  cautions: Ingeborg is not explicitly called divine in the passage; the taxonomy
    reference reflects her otherworldly role in the summarized narrative.
- id: motif:6
  label: Otherworld gifts challenged by Christian blessing
  taxonomy_refs:
  - sacred_exchange
  basis: Helge receives treasure; later messengers bring gold-plated horns from Gudmund
    to Olaf, and when the horns are blessed, the messengers reject them and the scene
    collapses into confusion and disappearance.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage does not state the messengers' motive beyond their reaction
    to the blessing.
- id: motif:7
  label: Return from otherworld marked by blindness
  taxonomy_refs:
  - return
  basis: Helge is brought back blind, and Ingeborg is said to have blinded him so
    local women would not love his eyes.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage does not specify whether the blindness has broader ritual
    or moral meaning.
- id: motif:8
  label: Oceanic journey into Chaos and darkness
  taxonomy_refs:
  - chaos
  - hero_descent
  basis: Gorm is told to sail across the ocean, leave sun and stars behind, descend
    into Chaos, and pass into a land without light.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The account is summarized and framed as directions given before the expedition.
- id: motif:9
  label: Appeasement after violation of a guide's injunction
  taxonomy_refs:
  - sacrifice
  basis: After sailors kill more beasts than needed despite Thorkill's warnings, Gorm
    must give up three men by lot to appease giant inhabitants.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage says the men are delivered up but does not describe their
    subsequent fate in the provided excerpt.
- id: motif:10
  label: Otherworld hospitality taboo and chastity test
  taxonomy_refs:
  - initiation
  basis: Thorkill forbids speech, food, drink, contact, servants, and cups; Gudmund
    then offers daughters and household women to test the travellers' chastity.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage ends before fully describing the fate of the four who fail
    to resist.
