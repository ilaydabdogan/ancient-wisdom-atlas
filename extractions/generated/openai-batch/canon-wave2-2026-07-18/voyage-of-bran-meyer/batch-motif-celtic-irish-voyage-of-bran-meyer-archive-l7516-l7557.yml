canonical_text:
  quote: Death nor decay shalt thou see.
  summary: The passage summarizes an Oisin episode in which Niam, daughter of the
    king of the fairy Land of the Living, entreats and carries the hero across the
    western waves to the Land of Youth. The land is described as abundant and free
    from aging, death, and decay. Oisin stays there three hundred years, then wishes
    to see Ireland, Fionn, and the host again. Niam warns him not to set foot on the
    ground or alight from the steed, because he would become old, withered, and blind
    and would not return to her land.
  language: English
  quote_policy: quoted
