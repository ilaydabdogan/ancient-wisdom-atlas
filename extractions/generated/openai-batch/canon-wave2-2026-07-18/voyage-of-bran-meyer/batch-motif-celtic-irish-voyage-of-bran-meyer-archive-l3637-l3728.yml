canonical_text:
  quote: ''
  summary: In this Irish appendix passage, Mongan and Mac an Daimh use a confession
    pretext to enter and control a private space where Dubh-Lacha is. Mongan takes
    Dubh-Lacha into a bed, deceives and kills an old woman witness, and later creates
    confusion by appearing in Tibraide's form. The household kills clerics who are
    said to be in clerical forms connected with Mongan; Tibraide is pursued and escapes
    to a temple. Mongan later returns home ill or languishing, while Dubh-Lacha sends
    word that he should come to her while the king is away and Ceibhin Cochlach is
    urging her to elope.
  language: Irish
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mongan comes to the door of the fortress where Dubh-Lacha is, and Dubh-Lacha
    recognizes him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mac an Daimh orders everyone to leave the house so that the queen may make
    confession; a woman who tries to remain is put out, and he says only the woman
    who came with him may be beside the queen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The gríanán is shut behind them, a glass door is fastened, a glass window
    is opened, and a woman is brought into the bed.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mongan takes Dubh-Lacha, gives her three kisses, brings her into the bed,
    and acts with her according to his will and desire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: An old woman guarding valuables in a corner speaks after having gone unnoticed;
    Mongan casts a magical or druidic effect on her so that she cannot see what she
    had seen before, and she describes the experience as false visions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mongan summons the old woman for confession, forms or places a stake or staff
    in the chair, and the old woman falls on or around it and dies; the queen blesses
    Mongan for killing her because she would have reported what had happened.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tibraide arrives with three groups of nine companions; the doorkeepers remark
    that Tibraide seems to be both inside and outside.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The figure inside says that Mongan came in his form, pardons the household,
    and tells them to kill the clerics with them because they are Mongan's beloved
    followers set in clerical forms.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The household goes out and kills the clerics; some of their own number fall.
    When they meet the king of Leinster, they say Mongan came in Tibraide's form and
    that Tibraide is in the settlement. Tibraide is pursued and reaches the temple
    of Cill Camain, while the others are wounded.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: After the king of Leinster returns home, a young woman or daughter says the
    person present was not Tibraide but Mongan, and that she had been with Mongan.
    Tibraide is summoned, and Mongan returns home and remains ill or languishing for
    a quarter.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Mac an Daimh complains that his wife has been absent; Mongan sends him for
    news to Rath Deiscirt m-Bregh where Dubh-Lacha Laimghel is, saying he cannot travel
    himself.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: 'Dubh-Lacha says Mongan should come to her: the king of Leinster is away,
