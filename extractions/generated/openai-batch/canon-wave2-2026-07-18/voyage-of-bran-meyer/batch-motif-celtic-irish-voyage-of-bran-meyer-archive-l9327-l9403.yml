canonical_text:
  quote: ''
  summary: The passage recounts the Clidna dinnshenchas, in which Clidna leaves the
    Land of Promise with Iuchna to reach Mac ind Oc, is lulled to sleep in a bronze
    boat, diverted around Ireland, and drowned by a great flood. It then cites the
    Tuag Inbir story, in which Tuag is guarded at Tara, visited by Manannan's messenger
    Fer Figail in a woman's shape, placed under a sleep spell, carried away, and drowned
    by a flood-tide wave while the messenger seeks a boat. A stanza groups Clidna's
    Wave with other waves of Erin, and a variant doubts Tuag's death by suggesting
    the wave may have been Manannan carrying her off.
  language: English
  quote_policy: summarized
