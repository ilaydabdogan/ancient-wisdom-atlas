  summary: The passage surveys Platonic, pseudo-Platonic, and comic Greek accounts
    of blessed postmortem regions, especially Elysium as an underworld locale. It
    then compares these Greek developments with Irish accounts in which a blissful
    land may lie across the western sea, within a hollow hill, or beneath lake waters,
    while cautioning against treating such developments as merely forced or artificial
    transfers.
