  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Phaedo reference contrasts the uninitiated, who pass into the world below
    and live in a slough, with those who arrive after initiation and purification
    and dwell with the gods.
  category: relationship
  evidence_refs:
  - ev:3
