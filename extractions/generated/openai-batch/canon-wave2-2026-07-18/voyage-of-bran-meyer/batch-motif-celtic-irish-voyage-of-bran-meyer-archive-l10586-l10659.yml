canonical_text:
  quote: ''
  summary: A scholarly discussion traces the development of Irish Happy Otherworld
    types. It distinguishes an Oversea type, continued and Christianized in imrama
    literature, from a fairy-hill or sid type prominent in heroic sagas. It notes
    shared or divergent features across tales, including immortality, warfare, supernatural
    lapse of time, mortal return to earth, amorous Faery women, and association of
    the magic land with water.
  language: English
