canonical_text:
  quote: ''
  summary: A scholarly passage compares Christian apocalyptic Otherworld descriptions,
    the Phoenix legend, Irish Otherworld narratives, and Jewish apocalyptic sources.
    It proposes that Irish Otherworld conceptions may have adapted or de-Christianised
    a Christian Heaven ideal, then traces Christian Otherworld imagery back to Jewish
    Messianic apocalyptic, especially Enoch, with motifs including final judgment,
    Paradise, a wondrous nourishing tree, Sheol in the West, and the triumph of righteousness.
  language: English
  quote_policy: summarized
