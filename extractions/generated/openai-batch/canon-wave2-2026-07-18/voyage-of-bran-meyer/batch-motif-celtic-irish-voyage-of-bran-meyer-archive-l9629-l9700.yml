canonical_text:
  quote: ''
  summary: Teigue and his companions enter a splendid gem-lit house beyond whose doorway
    stands an apple-tree bearing fruit and blossom together. A woman named Cleena
    Fair-head of the Tuatha Dé Danann greets Teigue, identifies herself as Ciaban's
    sweetheart, and says she lives on the apple-tree's fruit. Three colored birds
    enter, perch in the tree, and sing a sleep-giving melody; they are to accompany
    the wanderers and prevent grief. Cleena gives the company an emerald-hued cup
    that changes water into wine, gives other gifts and counsels, and leads them to
    their boat. When she asks how long they have been in the country, they answer
    one day; she replies that a whole year has passed and that hunger, thirst, and
    cold would not afflict them there. They sail away, gladdened by the birds' chorus,
    and the land behind them disappears under a magic veil. A following summary states
    that Teigue and his men complete their quest, rescue captives, and slay ravishers.
  language: English
  quote_policy: summarized
