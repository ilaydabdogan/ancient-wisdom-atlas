canonical_text:
  quote: ''
  summary: A poem praises Colum Cille’s virtues, charity, appearance, and voice. A
    first-person speaker says God sent him from afar to Colum Cille, from the Land
    of Promise of the blessed, and describes many vast islands set by a bright King.
    The speaker says the Son of God directed him from his own land to Carraic Eolairg
    at the edge of Lough Foyle. The passage closes by saying that one who does not
    help the weak is no friend of Colum.
