    Irish island Elysium may reflect a change in myth from an older sun-god pattern;
    it presents the happy western land as connected with the sun’s daily rising and
    return. The passage compares Manannan with an early Hellenic deity associated
    with the Hesperides, distinguishes this from later Hades theology, and summarizes
    claims about Irish, Christian, Greek, Teutonic, and Vedic mythic relationships.
