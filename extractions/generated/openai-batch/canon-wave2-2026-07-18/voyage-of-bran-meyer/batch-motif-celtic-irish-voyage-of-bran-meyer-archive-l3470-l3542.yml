canonical_text:
  quote: ''
  summary: The passage reports conflict over Ulster involving Fiachna Dubh, Mongan,
    Manannan, Dubh-Lacha, and the king of Leinster. Fiachna Dubh seizes kingship;
    Manannan delays bringing Mongan to the Ulstermen; a settlement grants Mongan half
    of Ulster and Dubh-Lacha. Later, while Mongan and Dubh-Lacha play fidchell, a
    dark little cleric appears, urges vengeance on Fiachna Dubh, and is later identified
    as powerful Manannan. Mongan kills Fiachna Dubh and takes the kingship. Mongan
    then seeks gifts through Ireland, receives a splendid herd of white cows with
    red ears and white calves from Brandubh of Leinster, and Brandubh comes to claim
    Dubh-Lacha.
  language: Irish
  quote_policy: summarized
