canonical_text:
  quote: ''
  summary: The passage is a scholarly synthesis of the development of the happy Otherworld
    in Irish legend. It distinguishes an Oversea type and a Hollow Hill type, describes
    their settings, inhabitants, attractions, and limits on return, and relates the
    Oversea type to the later imrama while noting Christian influence and non-Christian
    narrative machinery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage distinguishes two main types of the Irish Elysium conception:
    the Oversea type and the Hollow Hill type.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Oversea type, the magic land lies across the western main.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Oversea land is described as having natural beauty, natural riches, animals,
    fish, birds, and fruit.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The inhabitants of the Oversea land are described as beautiful and joyful,
    and a portion of the land is inhabited by women alone.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Oversea land, physical and moral ills are absent; age does not bring
    decay or death; love does not bring strife, satiety, or remorse.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The lord of the Oversea land is identified as Manannan in connection with
    Bran, or Boadag in connection with Connla.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The inhabitants of the Oversea land can summon mortals by the magic music
    of fairy tree-branches or by inexhaustibly satisfying fruit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Oversea type, time passes with supernatural rapidity, and a mortal
    who has entered may not return to earth unscathed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Hollow Hill type, the wonderland is figured as within the sid or fairy
    hills rather than across the sea.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Hollow Hill type, women do not play the same important role as in the
