canonical_text:
  quote: '"For the space of nine waves he would be submerged in the sea, but would
    rise on the crest of the tenth without wetting chest or breast."'
  summary: Ciabhan leaves the Fianna, meets Lodan and Solus in a currach, and voyages
    over the sea. A knight on a dark grey horse guides them to the Land of Promise
    and Manannan's fort, where they receive entertainment. Three daughters of Manannan's
    arch-ollave fall in love with the strangers and elope with them to Ireland. At
    Teite's Strand, while Ciabhan hunts, Clidna is drowned by the outer swell, along
    with three pursuers from Manannan's land. The passage then introduces an earlier
    Dinnshenchas version of the Clidna story and comments on the Dinnshenchas as place-name
    tradition.
  language: English
  quote_policy: quoted
