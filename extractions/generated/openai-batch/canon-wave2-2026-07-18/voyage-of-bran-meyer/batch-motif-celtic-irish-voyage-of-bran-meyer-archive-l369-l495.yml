    Bran. It discusses scribal alteration and corrupt manuscript readings, the relationship
    of six manuscripts to a common source, the editor's critical reconstruction, the
    mixture of Old Irish and Middle Irish forms, and the proposed dating of the text
    by comparison with continental and Würzburg glosses. It also gives an Old Irish
    quatrain containing Bran, a water/sea phrase, Mag Mell, and a two-wheeled chariot
    as an example of manuscript handling.
