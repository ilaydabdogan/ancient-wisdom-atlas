  summary: The excerpt begins with Old Irish verse and critical apparatus. In the
    translated portion, a male figure is foretold to have a short time in the world
    and to be killed by a dragonstone from the sea. A white host then takes him under
    a wheel of clouds to a gathering without sorrow. Bran is instructed to row toward
    the Land of Women, Emne, before sunset. Bran leaves the speaker, encounters an
    island of laughing and gaping people who will not converse, and sends one companion
    ashore; the companion joins the islanders and imitates their behavior.
