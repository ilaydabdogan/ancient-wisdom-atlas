canonical_text:
  quote: ''
  summary: 'The passage first narrates an instructed journey on behalf of Mongán:
    an unnamed man is told to visit several fairy knolls, retrieve a precious stone
    and gold, and keep silver for himself. He receives hospitality from couples at
    each stop, obtains a key to a chamber, takes only the permitted items, and returns
    to Mongán with the stone and gold. The passage then begins an Irish-language section
    concerning Mongán: Findtigernd, Mongán''s wife, asks about his wanderings; after
    a seven-year delay, an assembly at Uisnech and a great storm are described, followed
    by Mongán, his queen, and the senchaid Cairthide entering a remarkable enclosure
    and chamber where welcome is made to Mongán.'
  language: English; Middle Irish
  quote_policy: summarized
