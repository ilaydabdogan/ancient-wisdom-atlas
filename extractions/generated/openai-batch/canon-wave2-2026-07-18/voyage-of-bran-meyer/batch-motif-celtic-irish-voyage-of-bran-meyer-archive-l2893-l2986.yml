canonical_text:
  quote: ''
  summary: In Rathmore of Moylinny, King Mongan hosts Forgoll the poet, who tells
    stories nightly over a seasonal span. Mongan disputes Forgoll's account of Fothad
    Airgdech's death. Forgoll threatens satirical and magical harm against Mongan,
    his kin, and the fertility of waters, woods, and plains. To preserve honour, Mongan
    agrees to a bond involving his wife Breothigernd unless redemption comes within
    three days. As the deadline approaches, Breothigernd weeps, while Mongan repeatedly
    says that a helper is coming and that he can hear the helper's feet in named rivers
    and waters.
  language: English
  quote_policy: summarized
