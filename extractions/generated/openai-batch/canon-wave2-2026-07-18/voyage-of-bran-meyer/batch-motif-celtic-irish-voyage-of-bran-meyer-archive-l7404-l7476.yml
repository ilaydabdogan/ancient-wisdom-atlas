canonical_text:
  quote: ''
  summary: The passage is a scholarly discussion of the age and character of the Echtra
    Condla and its relation to Bran's Voyage. It discusses rival explanations for
    Art's epithet 'the Lone One,' notes the deaths or disappearance of Connla and
    Crinna in different accounts, and compares Connla and Bran with respect to incoherence,
    Christian interpolation, a fairy damsel or messenger, a currach, the Isle of Joy,
    the Isle of Fair Women, love motive, disappearance into a mysterious land, and
    possible penalties attached to departure from that land.
  language: English
  quote_policy: summarized
