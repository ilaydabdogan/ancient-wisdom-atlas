canonical_text:
  quote: ''
  summary: 'The passage comments on Dinnshenchas versions of the Clidna material,
    naming Otherworld designations and suggesting that Clidna''s drowning may substitute
    for divine abduction. It then summarizes the Bebind episode: Finn and the Fianna
    meet a giant, beautiful woman from the Maiden''s Land in the West who seeks Finn''s
    protection after fleeing a husband from the Land of Men; during hospitality, the
    husband kills her and escapes westward in a galley.'
  language: English
