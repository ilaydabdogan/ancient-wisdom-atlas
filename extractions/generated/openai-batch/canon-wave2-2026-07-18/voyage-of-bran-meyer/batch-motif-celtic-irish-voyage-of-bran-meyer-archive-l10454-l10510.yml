canonical_text:
  quote: ''
  summary: The passage discusses the Irish term tir tairngiri, 'land of promise,'
    in Latin-Irish Christian commentary and compares it with tir innambeo, 'land of
    the living ones.' It notes Christian associations with Canaan and the heavenly
    kingdom, the use of the term in biblical glosses, its connection with the summoning
    damsel in Echtra Condla, and later references to Connla's seafaring and Cormac's
    adventures at Manannan's court. The author reports Professor Zimmer's view that
    Christian and pre-Christian happy-land conceptions became identified, while cautioning
    that the interpretation is not entirely self-evident.
  language: English
  quote_policy: summarized
