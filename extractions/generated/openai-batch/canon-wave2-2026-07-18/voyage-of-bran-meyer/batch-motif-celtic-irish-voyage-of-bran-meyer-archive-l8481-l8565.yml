canonical_text:
  quote: ''
  summary: 'The passage introduces the aes side or folk of the mound as beings connected
    with an oversea Elysium and then summarizes the Wooing of Etain: Etain, once wife
    of Mider, is reborn as a mortal and marries Eochaid Airem; Mider wins a game for
    her and sings of a wonder-land or Great Plain of beauty, drink, food, youth, and
    invisibility. The commentary compares this Happy Otherworld with Bran and Connla
    and notes a casual Christian element and a connection with rebirth.'
  language: English
  quote_policy: summarized
