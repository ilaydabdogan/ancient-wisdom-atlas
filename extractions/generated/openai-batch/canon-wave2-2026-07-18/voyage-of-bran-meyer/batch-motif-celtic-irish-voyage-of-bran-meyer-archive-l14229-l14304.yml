canonical_text:
  quote: ''
  summary: The passage describes Uttara Kuru as a northern land beyond the Himalayas,
    temperate, free from sickness, care, and sorrow, with fragrant earth and streams
    in golden beds carrying pearls and jewels. It notes later Greek knowledge and
    identification with Hyperboreans, compares the Indian story with the Avestic story
    of Yima's first realm as northern lands beyond mountains, and then outlines a
    tentative chronological development of Indo-Germanic Elysium concepts involving
    Yama, Indra, Greek divine realms, Elysium, heaven, and penal afterlife ideas.
  language: English
