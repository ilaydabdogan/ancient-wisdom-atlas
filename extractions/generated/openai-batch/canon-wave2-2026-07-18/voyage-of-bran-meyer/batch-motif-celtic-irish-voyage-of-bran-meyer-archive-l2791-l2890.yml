canonical_text:
  quote: ''
  summary: 'Old Irish appendix passage: an opening exchange addresses a woman and
    speaks of a man coming to aid, with his course marked through named waters and
    places. The passage then describes Mongán in his royal house at night with his
    wife, a dispute with the poet Forgoll about the death of Fothad Airgthech, the
    sudden arrival of a visitor, the visitor''s eyewitness account of Fothad''s death
    and burial signs, the discovery of the stated evidence, and the final identification
    of the visitor as Cáilte, fosterling of Find, while Mongán is identified as Find.'
  language: Old Irish with editorial English headings and notes
  quote_policy: summarized
