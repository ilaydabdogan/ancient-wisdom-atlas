canonical_text:
  quote: Elijah under the tree of life in Paradise, and a gospel in his hand to preach
    to the souls there.
  summary: The passage discusses a fourfold postmortem world in Irish Christian visionary
    literature, relating it to the native Happy Otherworld and to Christian heaven
    and hell. It cites a Paradise scene with Elijah under the tree of life, birds
    eating its berries, and souls receiving preaching; it also cites the Voyage of
    Snegdus and Mac Riagla, where travellers reach an isle of Enoch, Elijah, and sinless
    Gaels awaiting Judgment, distinct from a Christian heavenly island with a king,
    altars, and priests.
  language: English
