    who sees a bardic scholar learning near his stronghold. Mongán speaks to the student
    about his sackcloth cloak and the eventual end of his studies, pities him, and
    tests whether he can be a truthful messenger. In the Irish narrative, Mongán sends
    the man through named places, where he receives hospitality, obtains access by
    a key, retrieves a stone and precious metal, and returns to Mongán.
