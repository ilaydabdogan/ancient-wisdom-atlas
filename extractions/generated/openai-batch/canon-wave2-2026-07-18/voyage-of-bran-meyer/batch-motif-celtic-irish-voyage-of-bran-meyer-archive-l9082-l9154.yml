canonical_text:
  quote: ''
  summary: 'The passage summarizes Cormac''s stay in Faery: true tales make a quartered
    swine cook, marvels of inexhaustible food and clothing are recounted, Cormac''s
    lost family is restored, and the host reveals himself as Manannan, lord of the
    Land of Promise, giving Cormac a truth-testing golden goblet and a soothing silver
    branch before returning him to Tara. The following commentary treats the tale
    as a later rewritten Irish romance preserving older images of otherworld abundance.'
  language: English
  quote_policy: summarized
