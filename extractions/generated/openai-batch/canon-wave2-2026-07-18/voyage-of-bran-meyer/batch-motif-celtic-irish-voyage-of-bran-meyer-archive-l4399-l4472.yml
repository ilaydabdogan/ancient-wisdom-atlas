canonical_text:
  quote: ''
  summary: Mongan says he has a form in which he and Mac an Daimh can go and hopes
    to obtain his wife. He calls out Cuimne of the mill, transforms her dog into a
    white lap-dog and Cuimne into the young woman Ibhell, assumes the shape of Aedh
    himself, transforms Mac an Daimh into an attendant, and creates royal-looking
    riding equipment. They enter the fortress under these appearances, are welcomed
    by the king of Leinster, and later Mongan places a love-charm in the transformed
    woman's cheeks so that the king desires her and sends an attendant with a message.
  language: English
  quote_policy: summarized
