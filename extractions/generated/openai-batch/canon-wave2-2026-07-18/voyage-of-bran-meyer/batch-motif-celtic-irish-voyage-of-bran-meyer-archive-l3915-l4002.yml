canonical_text:
  quote: ''
  summary: A sickness afflicts the king of Lochlann, and his physicians say only a
    red-eared shining-white cow can help him. The cow belongs to Caillech Dub, who
    accepts Fiachna as security for compensation. After the king of Lochlann fails
    to pay, the hag demands that Fiachna make war on him. Fiachna leads Ulster forces
    to Lochlann, where venomous sheep kill many Irish warriors. A richly dressed warrior
    arrives, offers to stop the sheep, and asks for Fiachna's gold ring as a token
    allowing him to go to Fiachna's wife in Ireland. He promises to beget Mongan in
    Fiachna's name, to go in Fiachna's shape, identifies himself as Manannan son of
    Ler, and foretells Fiachna's seizure of Lochlann's kingship.
  language: English
  quote_policy: summarized
