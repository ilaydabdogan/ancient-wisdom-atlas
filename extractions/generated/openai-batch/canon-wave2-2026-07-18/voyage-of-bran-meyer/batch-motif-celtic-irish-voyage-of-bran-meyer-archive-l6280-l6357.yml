    describing them as mythic material shaped into pseudo-history and affected by
    Biblical and classical culture. It then surveys the Milesian and heroic periods,
    mentioning the sons of Mil, Macha’s foundation of Emania, Connaire Mor’s death
    in the tale of Da Derga’s fort, and the Ulster cycle centered on Conchobor Mac
    Nessa and Cuchulinn.
