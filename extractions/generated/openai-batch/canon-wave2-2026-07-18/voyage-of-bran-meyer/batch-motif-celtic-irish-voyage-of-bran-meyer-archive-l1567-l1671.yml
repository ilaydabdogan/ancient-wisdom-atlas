canonical_text:
  quote: ''
  summary: 'The passage first gives Irish verse describing Maig Meld/Mag Mell as an
    abundant beautiful place with flowers, horses or hosts, shining colors, a white
    or silver stream, gold, games, men and women, and fruitful woodland imagery without
    sin or defect. The English verse then speaks in a collective voice: from creation
    the speakers lacked old age and sin; the Serpent went to the father, glossed as
    Adam in Paradise, and brought decay; Adam’s greed and lust ruined his race and
    led to torment; worldly pride, creature-worship, and forgetting God lead to disease,
    old age, and soul destruction; salvation will come from the creator King, described
    as both God and man, with a white law over seas.'
  language: Middle Irish/Old Irish and English
  quote_policy: summarized
