  summary: A chronological synopsis traces the development of Elysium, heaven, and
    hell motifs across Iranian, Indian, Greek, Jewish, Christian, Irish, and Scandinavian
    materials, with special attention to Irish non-Christian Elysium texts, Yima's
    grove, the growth of hell, and Christian influence on transmission.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The synopsis describes a golden-age or cosmological Elysium associated with
    Yima's realm and Yima's grove, where human and animal life is stored against a
    great natural catastrophe.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same opening note says heaven is elaborated and hell is developed and
    systematized.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: For India from 600 B.C. to A.D., the synopsis notes a Buddhist revolt against
    the outcome of Brahminical eschatology and romantic or epic use of heaven and
    Elysium ideals.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: For Greece from 500-300 B.C., the synopsis notes elaboration and systematization
    of Greek eschatology under Orphic-Pythagorean influence and use of the Elysium
    ideal in Utopia literature.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: For the Hellenistic period, the synopsis states that Greek eschatology influenced
    Jewish eschatology, that Greece contacted Persia and India, and that Greek-Jewish
    eschatological literature formed with further elaboration of hell.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: For the Hellenistic Christian period, the synopsis says Greek-Jewish eschatological
    literature was transformed into Christian eschatological literature, with Jewish
    and Christian use of the Elysium ideal and transformation of hell.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: For Ireland in 700-800 A.D., the synopsis describes non-Christian Elysium
    texts in which Elysium is a land mortals may enter by special favor of divine
    beings and is also the gods' land; it says there is no trace of heaven or hell.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: For Ireland from 800-1100 A.D., the synopsis notes romantic and didactic development
    of Irish Elysium and Christian transformation of it in the Navigatio S. Brendani.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: For Scandinavia from 800-1200 A.D., the synopsis says heaven and hell are
    clearly developed and mentions a possible cosmological myth corresponding to the
    Avestic myth of Yima's grove.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: For Scandinavia from 1200-1400 A.D., the synopsis mentions romantic versions
    of a voyage to Elysium.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The concluding discussion says Christianity disturbed the development of Northern
    and Western European future-world conceptions.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The concluding discussion says hell is absent from the oldest strata of Greek,
    Indian, and Persian future-world texts but gradually becomes prominent enough
    to overshadow heaven.
  category: sequence
  evidence_refs:
  - ev:10
