canonical_text:
  quote: ''
  summary: The passage discusses Rohde’s view of Greek afterlife belief, contrasting
    Homeric Hades with Elysium as a happy land of immortal youth for a favoured few.
    It then challenges whether Achilles’ bleak afterlife should be taken as representative
    of Greek belief, arguing that tragic literary convention may explain it. As a
    parallel, the passage cites Irish heroic literature, where happy otherworld visions
    are associated with Bran, Connla, and Oisin rather than the greatest tragic heroes.
    Cuchulinn is presented as a divine son and goddess-beloved who could have been
    imagined as rescued to the Land of Promise, but instead must meet his heroic doom
    standing at a pillar-stone.
  language: English
  quote_policy: summarized
