canonical_text:
  quote: ''
  summary: The passage contains Irish narrative sections in which Mongan causes the
    King of Leinster to desire the old woman Cuimne, directs Cuimne to demand gifts,
    obtains a cup and a protective belt through Mac an Daimh, proposes an exchange
    involving Dubh-Lacha, and then escapes with Dubh-Lacha on wind-swift horses. The
    following English opening introduces Fiachna Finn leaving Ireland for Lochlann,
    where Eolgarg Mor is king and Fiachna receives honor.
  language: Irish and English
  quote_policy: summarized
