- id: obs:1
  text: Mongan places a love-effect in the old woman's cheeks, and when the King of
    Leinster looks at her he is filled with love for her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The King of Leinster sends a servant with a love message to the woman identified
    as the wife of the son of the King of Connacht, and Mongan tells Cuimne how to
    respond by asking for recognizable gifts or goods.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A messenger presents a noble cup; the King of Leinster orders it given despite
