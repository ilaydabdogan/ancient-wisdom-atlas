canonical_text:
  quote: ''
  summary: 'The passage discusses an episode shared by Bran and Maelduin involving
    a mysterious island where a mortal visitor is compelled to imitate its inhabitants.
    It then summarizes Maelduin episodes: unauthorized companions must be removed;
    one is killed after stealing a necklace from a richly supplied fort watched by
    a cat; another island causes visitors to join its black-clad wailing inhabitants,
    requiring a rescue attempt with precautions against looking at or breathing the
    island air.'
