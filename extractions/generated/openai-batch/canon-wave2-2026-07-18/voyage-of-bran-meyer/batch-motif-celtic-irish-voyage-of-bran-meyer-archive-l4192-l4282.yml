canonical_text:
  quote: ''
  summary: Mongan and Mac an Daimh set out during the feast of Moy-Liffey, see the
    king of Leinster and the cleric Tibraide, and use magical deception to enter the
    fortress where Dubh-Lacha is. Mongan creates a river and bridge, disrupts Tibraide,
    takes Tibraide's form, and gives Mac an Daimh the form of a cleric. Under this
    disguise they are welcomed by the king. In the fortress, Dubh-Lacha recognizes
    Mongan; Mac an Daimh clears the chamber, and Mongan joins Dubh-Lacha. A hag guarding
    jewels witnesses or suspects what happened; Mongan uses magical breath to confuse
    her perception and then shapes a spike on which she dies.
  language: English
  quote_policy: summarized
