canonical_text:
  quote: ''
  summary: The passage introduces Ossianic-cycle stories as containing glimpses of
    the Happy Otherworld, discusses the relatively late literary form of Fenian romances,
    and describes the Agallamh na Senorach as a framework tale reconciling Fenian
    traditions with Christian legend. It then summarizes an episode in which Caoilte
    and Oisin survive from the Fenian age; Oisin goes to the sidh where his mother
    Blai is, while Caoilte meets Patrick. Patrick's clerics fear Caoilte's party and
    wolf-dogs, Patrick sprinkles holy water, demons depart, and Patrick and Caoilte
    travel through Ireland while landscape features prompt questions and stories,
    including the beginning of a tale explaining Tonn Clidna.
  language: English
  quote_policy: summarized
