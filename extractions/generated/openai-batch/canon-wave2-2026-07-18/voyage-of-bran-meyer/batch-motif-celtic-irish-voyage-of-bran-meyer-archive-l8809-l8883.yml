canonical_text:
  quote: ''
  summary: 'The passage ends Laegaire''s speech about the pleasures of sid life: drinking,
    beloved companionship, Sun-tear as wife, wives for his fifty men, goods from the
    Pleasant Plain, a sea-plaint daughter, a blue sword, and the value of one sid
    night above a kingdom. He then re-enters the sid and rules jointly with Fiachna.
    The surrounding commentary discusses the tale''s date, its Otherworld pleasures,
    similarities to other Irish Otherworld narratives, its distinctive location beneath
    the waves, and possible mixture of Irish and Viking-period or Valhalla-like elements.'
  language: English
  quote_policy: summarized
