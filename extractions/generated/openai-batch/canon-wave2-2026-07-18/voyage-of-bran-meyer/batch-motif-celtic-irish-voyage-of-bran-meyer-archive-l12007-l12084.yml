canonical_text:
  quote: ''
  summary: A scholarly passage compares Greek, Irish, and Norse heroic traditions.
    It states that Irish translated heroes, like Menelaus and related Greek figures,
    are not worshipped and do not affect mortal affairs; it rejects a simple literary-influence
    explanation for the Greek-Irish parallel; it notes a Christianized addition in
    which Cuchulinn's soul appears in a spirit chariot; and it introduces the Norse
    Helge-Sigrun episode, where a dead hero comes from the barrow rather than from
    Walhalla and Sigrun follows him into the barrow.
  language: English
  quote_policy: summarized
