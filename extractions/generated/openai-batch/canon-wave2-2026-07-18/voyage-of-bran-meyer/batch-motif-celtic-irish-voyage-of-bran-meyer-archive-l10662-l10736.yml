  summary: A scholarly passage discusses how Irish tradition historicized the Tuatha
    De Danann while also preserving them as immortal superhuman beings of an enchanted
    land. It identifies Happy Otherworld traces in the Dinnshenchas, including sea-connected
    beings, Angus's fairy mound and palace, magic food and drink, and fairy music.
    It also comments on the continuity of Irish Otherworld types in later romances
    and Ossianic materials.
