canonical_text:
  quote: ''
  summary: A lamenting speaker remembers the dead Goll son of Dolb and says she now
    goes to Fiachna mac Retach. Laegaire brings her to Fiachna, after which Fiachna's
    daughter Sun-tear is coupled with Laegaire and fifty women with his fifty warriors.
    After a year Laegaire seeks news of his own land; Fiachna tells the group to take
    horses and not dismount if they wish to return. They find Connaught mourning them.
    Laegaire bids farewell despite Crimthann's plea and offer of kingship, wealth,
    horses, and women. Laegaire answers with marvels including beer-rain, vast hosts
    moving among kingdoms, and the music of the sid.
  language: English
  quote_policy: summarized
