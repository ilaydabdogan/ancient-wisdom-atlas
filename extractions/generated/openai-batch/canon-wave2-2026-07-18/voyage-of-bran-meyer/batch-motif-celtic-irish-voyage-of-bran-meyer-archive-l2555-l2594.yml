  summary: The appendix opens an Old Irish passage headed “Compert Mongain.” It names
    Fiachnae Lurga as father of Mongán and connected with kingship, introduces Aedan
    mac Gabrain in Alba, describes a conflict involving Saxons and Fiachnae’s departure
    to assist, and then describes an unnamed distinguished man visiting Fiachnae’s
    wife or queen in her fort at Rath Mór Maige Line while few are present. In dialogue,
    the woman rejects treasure or wealth as a reason to dishonor her husband, but
    the visitor asks whether she would act for the aid of her husband’s life; the
    excerpt ends before the outcome.
  language: Old Irish with English editorial apparatus
