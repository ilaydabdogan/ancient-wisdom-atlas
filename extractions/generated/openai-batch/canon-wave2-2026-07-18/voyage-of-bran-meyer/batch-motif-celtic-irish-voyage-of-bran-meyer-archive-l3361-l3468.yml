canonical_text:
  quote: ''
  summary: A woman from Lochlann comes to Fiachna seeking redress against the king
    of Lochlann. Fiachna leads Ulster forces to battle, where venomous sheep kill
    his men. A splendid warrior appears, offers to defeat the sheep, and demands Fiachna's
    gold ring as a token to Fiachna's wife so that he may sleep with her. The warrior
    identifies himself as Manannán mac Lir, foretells the birth of Mongán, takes Fiachna's
    shape, and later takes Mongán to Tír Tairngire for fosterage. Fiachna gains foreign
    kingships, rewards the woman, and Mongán is paired with Dubh-Lacha, born the same
    night.
  language: Middle Irish / Early Modern Irish with English editorial headings and
    notes
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman from Lochlann arrives at Fiachna's stronghold after he has ruled Ulster
    for a year, and Fiachna recognizes and welcomes her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman says the king of Lochlann has wronged her concerning cows; Fiachna
    offers cows as compensation, but she refuses compensation unless Fiachna himself
    comes to fight the king of Lochlann.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fiachna gathers the nobles and forces of Ulster and goes against Lochlann.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the battle, venomous sheep from the king of Lochlann's tent kill three
    hundred of Fiachna's warriors on each of three days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fiachna declares that he will personally enter combat with the sheep, saying
    that fate cannot be avoided.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A large martial young man appears, wearing a green mantle, a silver brooch,
    a silk tunic, gold around his hair, and gold under his feet.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The young man asks what reward would be given to whoever removed the sheep
    from Fiachna.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The young man asks for Fiachna's gold ring as a token to bring to Fiachna's
    wife in Ireland so that he may have intercourse with her.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The young man says a victorious child will be conceived by him, named Mongán
    Find mac Fiachna Finn, and that he will go in Fiachna's form so the wife will
    not perceive the deception.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The young man identifies himself as Manannán mac Lir and says Fiachna will
    take the kingship of Lochlann, Saxon-land, and Britain.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Manannán releases a hound with a chain; the hound kills the sheep and three
    hundred nobles of Lochlann, and Fiachna gains the named kingships.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Manannán goes to Ireland in Fiachna's form and sleeps with Fiachna's wife,
    who becomes pregnant that night.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Fiachna gives the Black Hag seven castles with their territory and land, and
    a hundred of each kind of livestock.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Fiachna returns to Ireland, finds his wife pregnant, and she bears a son when
    her time comes.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: A servant of Fiachna named Dam has a wife who bears a son on the same night;
    the two boys are baptized together and named Mongán and Mac an Daimh.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Fiachna Dubh mac Demáin has a daughter born on the same night, named Dubh-Lacha
