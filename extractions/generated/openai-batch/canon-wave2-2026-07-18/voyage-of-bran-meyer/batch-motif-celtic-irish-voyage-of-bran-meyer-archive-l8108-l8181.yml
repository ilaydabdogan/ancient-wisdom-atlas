canonical_text:
  quote: ''
  summary: 'The passage summarizes episodes from Maelduin’s voyage: an amorous queen
    prevents departure with a clew until the voyagers sever the hand that it grips;
    other island episodes feature maidens or women who welcome the voyagers, give
    desired food and drink, induce sleep, and vanish with their islands or fortresses.
    The commentary treats these as variants of a damsel-land or wonderland episode
    comparable to Bran’s Voyage, emphasizing ageless delight, desired food, love,
    and the supernatural disappearance of the land.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The men murmur, urge Maelduin to leave, and reproach him for his love for
    the queen after a stay described as three months being three years.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the men attempt to take out the boat and sail away, the queen rides after
    them and throws a clew that Maelduin catches; it adheres to his hand and draws
    them back to land.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The queen’s use of the clew happens three times; after another man is set
    to handle the clew, his hand is cut off by one of the sea-farers, allowing the
    voyagers to escape.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: One island is described as lofty and divided by four fences of gold, silver,
    brass, and crystal, with kings, queens, warriors, and maidens in the divisions.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A maiden meets the voyagers on the lofty island, brings them ashore, gives
    them food with whatever taste each desires, and gives liquor from a little vessel
    so that they sleep three days and three nights.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the sleep on the lofty island, the voyagers awake in their boat at sea
    and see neither the island nor the maiden.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Another island has a fortress with a brazen door and a glass bridge; when
    the voyagers go onto the bridge, they fall backward.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: A woman comes from the fortress with a pail, takes water, returns, scorns
    the men, and the brazen door makes soothing music when struck, sending the men
    to sleep until morning for three days and three nights.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: On the fourth day the woman appears richly dressed, greets each man by name,
    says their coming has long been known, brings them inside, and gives them food
    with the desired savour.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Maelduin’s men urge him to offer himself to the woman and propose that she
    show affection and sleep with him; she replies that she does not know and has
    never known sin, leaves, and promises an answer for the next day.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The voyagers awake in their boat on a crag and no longer see the island, fortress,
    lady, or place where they had been.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The commentary states that the Maelduin narrative includes variant forms of
    the same episode and uses them to reconstruct the idea of a damsel-land.
  category: other
  evidence_refs:
  - ev:5
- id: obs:13
  text: The commentary characterizes the damsel-land as a supernatural land where
    the mortal visitor receives simple sensuous delights, does not age or decay, receives
    food with whatever savour pleases him, enjoys love without labour, and where the
    land withdraws from mortal sight in a night.
  category: attribute
  evidence_refs:
  - ev:6
