canonical_text:
  quote: ''
  summary: 'The excerpt is a scholarly comparison arguing that Irish Otherworld literature
    aligns more closely with early or Homeric Greek Elysium patterns than with later
    Virgilian or post-Homeric ethical underworld conceptions. It lists shared traits:
    island Elysium, mountain home of gods, divinely favored mortal access, amorous
    goddesses, deathlessness, and sensuous non-ethical delights; it contrasts a later
    underground Elysium near Tartarus with a hell counterpart and an ethical cosmic
    scheme; and it notes a quatrain of Bran''s Voyage portraying island Elysium through
    a holiday-like image.'
  language: English
