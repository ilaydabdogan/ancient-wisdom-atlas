canonical_text:
  quote: ''
  summary: In this Middle Irish excerpt, Dubh-Lacha obtains an oath and delay from
    the King of Leinster before being taken to his house. Mongan languishes until
    Mac an Daimh rebukes him, mentioning Mongan's journey to the Land of Promise and
    Manannán's house. Mongan and Mac an Daimh travel toward a Leinster assembly, encounter
    the cleric Tibraide with gospel books, and Mongan creates an apparent river and
    bridge. When the bridge collapses, Mongan takes the gospels and sends them downstream.
    He then assumes Tibraide's form and gives Mac an Daimh the form of a cleric before
    approaching the King of Leinster.
  language: Middle Irish with English editorial apparatus
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dubh-Lacha privately addresses the King of Leinster and requires him to give
    his word before she states the decision she wants from him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dubh-Lacha asks that she not be taken for a year and that, if the king visits
    her in one house, he sit in a chair opposite her rather than approach her couch.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The King of Leinster grants the condition, takes Dubh-Lacha to his house,
    and Mongan is described as suffering during that period.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mac an Daimh rebukes Mongan, saying his journey to Tír Tairngire and the house
    of Manannán has not helped him recover the women taken to Leinster.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mongan tells Mac an Daimh to go to the cave-door and says that he himself
    will go on Mac an Daimh's back.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mongan says the King of Leinster will ask his druids about Mongan's condition,
    and that they will report him as being in both Ireland and Scotland.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mongan and Mac an Daimh travel to Leinster at the time of an assembly of Mag
    Life and see crowds and the King of Leinster there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: They see Tibraide, priest of Cill Camain, carrying four gospels, with another
    cleric following him while they perform their hours.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mac an Daimh asks what the cleric has said; Mongan calls it learning, while
    Mac an Daimh says he understands only the repeated 'amen, amen.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mongan fashions a great river through the middle of the plain and a great
    bridge over it in front of Tibraide.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Tibraide marvels at the sudden river and bridge, approaches the bridge, and
    the bridge falls beneath the clerics when they reach its middle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Mongan takes the gospels from Tibraide's hand, releases them with the stream,
    and says they will not drown but will drift for a mile to serve his purpose in
    the camp.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Mongan shapes himself into Tibraide's form and puts Mac an Daimh into the
    form of the other cleric before they go toward the King of Leinster.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The King of Leinster welcomes the disguised figure as Tibraide, kisses him,
    and remarks that he has not seen him for a long time.
  category: speech
  evidence_refs:
  - ev:7
