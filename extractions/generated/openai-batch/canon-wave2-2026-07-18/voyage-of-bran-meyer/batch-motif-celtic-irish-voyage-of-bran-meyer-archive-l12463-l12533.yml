canonical_text:
  quote: "“The hero of the fantastic journey comes to the Isle of the Blessed”"
  summary: 'The passage first summarizes scholarly points about the Hyperboreans as
    remote blessed people connected with Apollo, song, didactic example, and later
    localization in India. It then introduces Lucian’s True Story as a satirical synthesis
    of prior Greek literary developments and quotes a description of the Isle of the
    Blessed: fragrant air, harbours, rivers, meadows, guardians, Rhadamanthus, a precious
    city, unaging inhabitants, perpetual spring, abundant fountains and rivers, and
    the Elysian Field.'
  language: English
