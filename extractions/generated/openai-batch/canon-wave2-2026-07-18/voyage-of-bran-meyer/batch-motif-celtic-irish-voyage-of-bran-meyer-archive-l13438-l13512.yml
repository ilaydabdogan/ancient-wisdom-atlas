canonical_text:
  quote: ''
  summary: 'The passage discusses possible Scandinavian influence on Irish Otherworld
    voyage narratives, especially incidents of Otherworld treasure theft, punishment,
    and abandonment of an allured companion. It then summarizes, with caution, Rydberg''s
    theory connecting Odainsakr to Norse myth: the Volospa''s cosmic history, the
    seclusion of Lif and Leifthraser in a deathless land, their later role in repopulating
    the universe, and the guardianship of Odainsakr by the seven sleeping sons of
    Mimer.'
  language: English
  quote_policy: summarized
