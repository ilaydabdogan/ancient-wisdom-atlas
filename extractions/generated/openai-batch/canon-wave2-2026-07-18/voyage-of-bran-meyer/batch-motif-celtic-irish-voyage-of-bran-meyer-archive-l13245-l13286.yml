canonical_text:
  quote: ''
  summary: 'The passage notes similarities between certain episodes and the Odyssey,
    with possible direct literary influence. It then summarizes an episode involving
    Gorm, Thorkill, and Gudmund: Gudmund praises his garden, but Gorm refuses to enter
    after Thorkill warns him. The travellers cross a river to Geirrod''s land, enter
    a gloomy cavern, and find Geirrod and his daughter punished by Thor. The cavern
    contains treasures; when Gorm''s men seize them, the treasures become serpents
    and swords. Thorkill seizes further garments and a belt, after which the cavern
    shakes, its inmates attack, and only twenty survive through the skill of Broder
    and Buchi. Gudmund ferries the survivors back; Buchi later embraces one of Gudmund''s
    daughters and loses recollection.'
  language: English
  quote_policy: summarized
