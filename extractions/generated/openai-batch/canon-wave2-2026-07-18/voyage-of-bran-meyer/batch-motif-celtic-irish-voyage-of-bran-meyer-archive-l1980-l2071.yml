  summary: Bran and his company visit the Island of Joy, where a man sent ashore becomes
    unable or unwilling to converse and is left behind. They then reach the Land of
    Women. The chief woman welcomes Bran, draws his coracle to shore by a ball of
    thread that sticks to his hand, and the company enters a large house with many
    beds, inexhaustible food, and altered experience of time.
