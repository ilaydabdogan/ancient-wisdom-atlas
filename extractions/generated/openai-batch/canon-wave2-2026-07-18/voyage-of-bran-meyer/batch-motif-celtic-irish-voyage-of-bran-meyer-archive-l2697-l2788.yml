canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which a noble-looking man appears
    before the armies of Aeddn and Fiachna, tells Fiachna that Fiachna''s wife sent
    him to help, defeats an opposing soldier, and secures the rout of the enemy. Fiachna
    returns home; his wife bears Mongán, who is said to be Manannán mac Lir''s son
    though called Fiachna''s son. The passage then begins an Irish appendix section:
    it introduces a story explaining why Mongán is said to be Find mac Cumaill and
    concerning the death of Fothad Airgdech. In that story, Mongán, as king at Ráith
    Mór Maige Lini, hosts the poet Forgoll; they dispute how Fothad died. Forgoll
    threatens destructive satire and imposes a high-stakes pledge with a three-day
    deadline, causing Mongán''s wife Breothigern to grieve while Mongán assures her
    that help will come.'
  language: English and Old/Middle Irish with editorial manuscript notes
  quote_policy: summarized
