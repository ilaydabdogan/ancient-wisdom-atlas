  summary: The passage frames the circumstances leading to the telling of “Mongan’s
    Frenzy.” Findtigern, Mongan’s wife, asks him to tell the truth about his adventures;
    he asks for and receives a seven-year delay. At the end of that period, the men
    of Ireland gather at Usnech in Meath. A great hail-storm strikes, leaving twelve
    chief streams in Ireland. Mongan and a small company leave the cairn and see a
    prominent stronghold.
