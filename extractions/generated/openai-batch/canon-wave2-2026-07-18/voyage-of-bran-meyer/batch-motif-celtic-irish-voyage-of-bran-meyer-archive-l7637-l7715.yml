  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the place of the earlier adventure, Cuchulinn again sees the woman in green
    and learns that she is Liban.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Liban tells Cuchulinn that Fann, abandoned by Manannan Mac Lir, has conceived
