canonical_text:
  quote: ''
  summary: 'The passage summarizes the opening of Cuchulinn''s Sick Bed: supernatural
    birds appear at Samhain; Cuchulinn fails against a linked bird pair whose song
    induces sleep; two women afflict him in a dreamlike encounter; after a year of
    silence, messages from Liban and others invite him toward Fann, Labraid, and the
    Plain of Delight. Laeg scouts the otherworldly island by bronze boat, and Liban
    praises Labraid''s land and house.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ultonians are assembled for the Fair of Samhain when a beautiful flock
    of birds alights on a lake.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:2
  text: The king's wife and other court women ask for the birds, and Cuchulinn kills
    and distributes birds to the women except Emer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cuchulinn promises Emer that the next time birds come she will receive the
    two most beautiful ones.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two birds later appear on the lake linked together by a chain of red gold
    and sing a melody that brings sleep on the assembly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cuchulinn tries unsuccessfully to kill the two linked birds, leaves in bad
    spirits, and falls asleep.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the sleep episode, two women, one in green and one in a five-folded crimson
    cloak, smile and strike Cuchulinn with a horse-switch until he is nearly dead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cuchulinn lies for a year without speaking to anyone.
  category: sequence
  evidence_refs:
  - ev:4
