canonical_text:
  quote: And from that hour his wanderings are not known.
  summary: Nechtan mac Collbrain desires to go with Bran to Ireland. An unnamed woman
    warns against the journey and says that no one should touch the land. The company
    comes to a gathering at Sruib Brain, where Bran identifies himself but is not
    recognized; the people say that the Voyage of Bran is already in their old stories.
    A man associated with Nechtan reaches the earth of Ireland and immediately becomes
    ash, as if he had lain in the earth for many hundreds of years. Bran then tells
    his wanderings, writes quatrains in Ogam, bids farewell, and thereafter his wanderings
    are unknown.
  language: Old Irish with English translation in part of the passage
  quote_policy: quoted
