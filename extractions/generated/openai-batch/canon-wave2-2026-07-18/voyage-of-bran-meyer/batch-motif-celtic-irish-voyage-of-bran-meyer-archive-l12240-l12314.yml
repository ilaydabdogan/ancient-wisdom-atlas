  quote: ''
  summary: A scholarly discussion traces a Greek otherworld conception from non-ethical
    mythic material toward didactic and ethical afterlife reward in Hesiod, Pindar,
    and Sophocles. It summarizes Pindaric images of Elysium, the blest, and Hyperboreans,
    compares one Pindaric otherworld description to Manannan's isle or Midir's sid,
    and notes a heroine-led rapture to the Underworld or Land of Youth in an embedded
    discussion.
  language: English
  quote_policy: summarized
literal_observations:
