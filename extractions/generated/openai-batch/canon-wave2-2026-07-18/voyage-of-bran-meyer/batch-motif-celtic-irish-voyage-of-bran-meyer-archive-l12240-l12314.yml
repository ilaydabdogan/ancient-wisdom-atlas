  text: The passage says earlier Greek mythic vision lingered without ethical intent,
    while Hesiod shows beginnings of a didactic use of the conception.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Pindaric account, access to Elysium is not limited to old-time heroes
    but is also granted to those who remain steadfast through repeated lives and keep
    their souls from envy.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Pindaric blessed pursue the road of Zeus to the castle of Kronos, over
    the isles of the blest, where ocean breezes blow and golden flowers gleam.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The commentator reads the Pindaric passage as religious because it makes worth
    in this life a condition of bliss in the next and links the transformation to
    Pythagorean metempsychosis.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another Pindaric description places the blest where the sun shines below,
    with rose meadows, incense trees, golden-fruit orchards, wrestling, draught-playing,
    lyres, spices, and an altar flame.
  category: setting
  evidence_refs:
  - ev:4
