canonical_text:
  quote: ''
  summary: An unnamed woman leaves Bran and his companions, taking a branch that moves
    from Bran's hand into hers despite his inability to hold it. The next morning
    Bran goes to sea with three companies of nine men, each led by one of his foster-brothers
    or mates. After two days and nights at sea he sees a man in a chariot coming over
    the sea. The man sings, identifies himself as Manannan son of Ler, speaks of a
    future journey to Ireland after long ages, and foretells the birth of a son named
    Mongan son of Fiachna. In the following song, Bran's view from a coracle on the
    clear sea is contrasted with Manannan's view of a flowery plain.
  language: English and Old Irish
  quote_policy: summarized
