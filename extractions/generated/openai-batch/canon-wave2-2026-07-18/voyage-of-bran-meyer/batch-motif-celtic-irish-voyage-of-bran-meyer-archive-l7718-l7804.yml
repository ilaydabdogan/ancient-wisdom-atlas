canonical_text:
  quote: ''
  summary: In a summarized portion of Cuchulinn's Sick Bed, Cuchulinn sends Laeg to
    Labraid's land, and Laeg describes a marvelous household with steeds, jewel-like
    trees, singing birds, a silver tree, and an ever-full mead vat. Laeg praises Fann
    and the place. Cuchulinn later goes with Laeg, overthrows Labraid's enemies, remains
    with Fann for a month, and arranges a meeting. Emer, Cuchulinn's wife, comes armed
    with fifty maidens, rebukes him, and a contest arises between Emer and Fann over
    which will give him up. Fann yields to Emer. Manannan then comes seeking Fann,
    visible only to her; the editor's note interprets her response as remorse and
    voluntary return to her immortal husband.
  language: English
  quote_policy: summarized
