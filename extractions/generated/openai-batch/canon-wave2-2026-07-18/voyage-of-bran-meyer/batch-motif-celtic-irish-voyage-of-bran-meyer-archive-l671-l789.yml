  summary: The passage opens the tale of Bran son of Febal. A woman from unknown lands
    sings in Bran's royal house. Before this, Bran hears sweet music while alone near
    his stronghold, falls asleep, and wakes to find a silver blossoming branch. He
    brings the branch to the royal house, where the strange woman appears and sings
    of an apple-tree branch from Emain, a distant isle amid the sea, and a fair plain
    where games are held.
