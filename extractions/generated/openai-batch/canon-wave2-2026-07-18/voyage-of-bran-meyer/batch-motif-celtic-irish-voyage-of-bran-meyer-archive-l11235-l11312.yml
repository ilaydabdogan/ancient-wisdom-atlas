canonical_text:
  quote: ''
  summary: The passage discusses Christian apocalyptic comparanda for descriptions
    of a beautiful otherworld or paradise. It cautions that similar idyllic portrayals
    of millennial hope, Utopia, fairy land, or the Phoenix legend do not by themselves
    prove dependence. It then notes that canonical Revelation offers only general
    comparisons, while the apocryphal Revelation of Peter contains a mountain vision
    in which Christ shows the twelve radiant men and an extra-worldly luminous land
    with unfading flowers, blessed fruit, perfumes, angelic clothing, and later a
    contrasting description of Hell. The passage also states that Revelation of Peter
    became a model and source for later apocalyptic visions, and begins a note on
    the Vision of Saturus describing Heaven as a garden with rose trees.
  language: English
  quote_policy: summarized
