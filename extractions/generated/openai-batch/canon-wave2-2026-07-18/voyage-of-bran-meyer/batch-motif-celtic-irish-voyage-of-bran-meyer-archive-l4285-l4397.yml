canonical_text:
  quote: ''
  summary: Mongan is said to have appeared in Tibraide's shape, causing confusion
    and violence. After the king of Leinster learns that Mongan, not Tibraide, was
    with the woman, Mongan leaves and suffers wasting sickness. Mac an Daimh carries
    messages to Dubh-Lacha, who is held near the king of Leinster and urged by Ceibhin
    to escape. Mongan visits Dubh-Lacha, plays chess with her, desires her, and is
    constrained by the king's year-long condition. After further longing and sickness,
    Mongan refuses to win her back by battle, preferring his own craftiness. At the
    year's end he and Mac an Daimh approach the king's house, where a marriage feast
    is being prepared, and they consider what shape to take after seeing Cuimne the
    mill-hag, her dog Brothar, and a pack-mare.
  language: English
  quote_policy: summarized
