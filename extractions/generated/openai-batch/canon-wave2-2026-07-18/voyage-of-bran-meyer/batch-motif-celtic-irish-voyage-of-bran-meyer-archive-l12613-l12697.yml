  summary: The passage discusses Roman development of Greek Otherworld conceptions,
    stating that Latin writers largely repeat Greek models of Hades and emphasize
    an ethical afterworld of rewards and punishments. It then compares the ancient
    Elysium or Fortunate Islands tradition with later Irish belief in blessed western
    islands associated with Brendan, and cites Sertorius' desire to live on the Isles
    of the Blessed. A Plutarch passage describes the Fortunate Islands as fertile,
    temperate, and identified with the Elysian fields and seats of the blessed.
