canonical_text:
  quote: ''
  summary: A warrior gives a venomous hound that destroys Lochlann's sheep and nobles,
    then assumes Fiachna's shape and sleeps with Fiachna's wife, who becomes pregnant.
    Fiachna rewards Cailleach Dubh, and several children are born, including Mongan,
    Mac an Daimh, and Dubh-Lacha. Manannan takes infant Mongan to the Land of Promise
    and later returns him. Fiachna the Black kills Fiachna the Fair and takes Ulster,
    but after Mongan's return Manannan appears as a little cleric, urges revenge,
    and Mongan kills Fiachna the Black and gains the kingship. Mongan then sets out
    to seek boons from the provincial kings.
  language: English
  quote_policy: summarized
