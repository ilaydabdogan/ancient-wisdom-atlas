canonical_text:
  quote: ''
  summary: A scholarly discussion of Professor Zimmer's account of the Irish sid belief
    contrasts oversea Elysium with the hollow hill or fairy mound. The passage describes
    Zimmer's theory that Christianization transformed older divine beings into local
    mound-dwelling powers and that attributes of the oversea Elysium were transferred
    to the hollow-hill conception. The author partly accepts the textual mixture but
    argues that similar divine lands need not imply chronological priority or conscious
    transfer, and proposes natural-feature veneration and ancestor-mound worship as
    two elements in the sid belief.
  language: English
  quote_policy: summarized
