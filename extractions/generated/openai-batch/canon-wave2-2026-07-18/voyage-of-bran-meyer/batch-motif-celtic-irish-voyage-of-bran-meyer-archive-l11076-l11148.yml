  summary: A Latin Phoenix passage describes a place without disease, old age, death,
    fear, crime, greed, grief, poverty, hunger, storms, frost, clouds, or rain. At
    its center is a living spring that periodically waters the whole grove, where
    trees rise and bear lasting mild fruits. The surrounding commentary says the Latin
    Phoenix poem was attributed to Lactantius, later expanded and Christian-allegorized
    in an Anglo-Saxon version, and that its happy eastern land where the Phoenix dwells
    in the grove of the sun resembles Irish western wonder-realms associated with
    Manannan and Midir.
