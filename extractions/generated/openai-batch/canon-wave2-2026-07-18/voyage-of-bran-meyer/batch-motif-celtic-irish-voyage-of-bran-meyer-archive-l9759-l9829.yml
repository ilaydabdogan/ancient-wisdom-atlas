canonical_text:
  quote: ''
  summary: The passage introduces Nera's Expedition into the Otherworld as a tale
    outside the strict Voyage-to-the-Otherworld type but useful for glimpses of the
    marvel land. On Halloween, Ailill and Medb challenge someone to put a withe around
    the foot of a hanged captive. Nera succeeds after the hanged man speaks to him,
    then carries the thirsty hanged man in search of drink. They enter the sid of
    Cruachan. Nera receives a wife from the king of the sid; she warns him that her
    people plan to attack Ailill's court next Halloween and tells him to bring summer
    fruits as proof of his visit. Later, the hosts of Connaught destroy the sid and
    take three wonderful gifts. A footnote compares the speaking-corpse episode with
    later Irish folk-tale variants.
  language: English
  quote_policy: summarized
