  summary: A prophetic sequence describes a male figure who will take several animal
    forms, have long ages and a hundred years of kingship, fight battles, be known
    as a valiant hero, receive an appointed end from Islay, be overcome by an opponent,
    and have Moninnan son of Ler as father and tutor. Editorial notes identify the
    death as Mongan's death at the hands of Artur mac Bicoir and compare Islay/Cantire
    death traditions.
