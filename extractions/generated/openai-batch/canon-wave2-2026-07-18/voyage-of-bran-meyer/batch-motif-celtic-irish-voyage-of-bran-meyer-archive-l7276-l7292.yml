canonical_text:
  quote: ''
  summary: 'The passage summarizes Bran’s voyage to western otherworld islands: a
    deathless land among thrice fifty isles guarded by Manannan; visits to the Island
    of Joy and the Land of Women; Bran’s attraction to shore by the women’s chief
    with a magic clew; a return to Ireland after an apparently short stay that proves
    to have lasted centuries; a warning not to touch land; the fatal reduction to
    ashes of one who touches earth; and Bran’s final disappearance after recounting
    the adventure.'
