canonical_text:
  quote: ''
  summary: The passage summarizes an episode in which Conn the Hundred Fighter ascends
    the royal rath at Tara with three druids. A stone under his feet screams, and
    the druids identify it as Fal, whose screams correspond to future kings from Conn's
    seed. A mist and darkness surround the party; a horseman approaches, throws a
    spear three times, welcomes Conn, and leads them to a beautiful plain with a kingly
    rath, a golden tree, and a splendid house. Inside are a diademed young woman with
    ale vessels and the champion Lug son of Ethlenn, who says he has come after death
    to reveal Conn's sovereignty and future Tara sovereigns. The maiden is identified
    as the sovereignty of Erin and gives Conn an ox rib and a hog rib. A note also
    links the stone with later Scottish and British coronation traditions.
  language: English
  quote_policy: summarized
