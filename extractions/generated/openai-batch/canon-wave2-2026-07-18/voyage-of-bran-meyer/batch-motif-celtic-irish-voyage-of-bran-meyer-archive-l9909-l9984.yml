canonical_text:
  quote: ''
  summary: The passage surveys dinnshenchas material about the Otherworld as deathless,
    as a source of marvellous domestic animals and gifts of civilisation, and as the
    origin of wisdom and poetry. It summarizes traditions concerning Dil, Tulchine,
    the Morrigan, Falga or the Land of Promise, Manannan, Sinend at Connla's Well,
    and Boand at the Secret Well, while adding cautious authorial comparisons to Elysium,
    Nera-type stories, contemporary Irish belief, Connla traditions, and Odin's winning
    of the mead of knowledge and poesy.
  language: English
  quote_policy: summarized
