canonical_text:
  quote: ''
  summary: 'The passage first describes Mongan and others entering an enclosure and
    a marvellous bronze-covered house with ancient trees, seven men, rich covers and
    jewels, and seven vats of wine. Mongan is welcomed, becomes intoxicated, and sings
    the ''Frenzy'' to his wife after promising to tell of his adventures. Although
    the stay seems to them only one night, the text says they were there a full year,
    and they awaken at Rathmore of Moy-Linny, identified in a note as Mongan''s own
    palace. The following Irish-language section begins another tale: Fiachna Find
    travels from Ireland to Lochlann, is honoured there by Eolgharg Mor, king of Lochlann,
    and the king later falls ill. Healers say he can be cured only by a bright white
    red-eared cow boiled for him. The cow is found with the Black Hag, who refuses
    an offered replacement cow; the passage then breaks off mid-sentence.'
  language: English and Irish
  quote_policy: summarized
