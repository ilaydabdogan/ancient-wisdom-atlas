canonical_text:
  quote: ''
  summary: 'The passage is a scholarly comparison of Irish, Scandinavian, Greek, and
    Iranian mythic material concerning a god''s land or land of delights. It describes
    such a land as deathless, sensuous, and welcoming to mortal visitors. It then
    summarizes the Avestan account of Yima: Ahura Mazda entrusts humanity to Yima,
    gives him imperial tokens, and later commands him to build an underground enclosure
    to preserve selected seeds, animals, humans, fires, plants, and fruits from a
    deadly winter. The enclosure lacks sun, moon, and stars, producing a supernatural
    time relation in which a year passes as a day. A note compares this to Faery or
    Otherworld time-lapse motifs while warning against deriving all such examples
    from the Avestan myth.'
  language: English
  quote_policy: summarized
