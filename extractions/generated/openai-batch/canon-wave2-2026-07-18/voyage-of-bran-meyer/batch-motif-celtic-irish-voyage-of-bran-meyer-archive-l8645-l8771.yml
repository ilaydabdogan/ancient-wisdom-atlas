canonical_text:
  quote: ''
  summary: 'The passage discusses theories about Irish sid, Faery, Tuatha De Danann,
    and Happy Otherworld beliefs, including their possible relation to Bran-type oversea
    Elysium stories and a cautious possible Scandinavian-contact hypothesis. It then
    summarizes the tale of Laegaire mac Crimthainn''s visit to Mag Mell: a sid man,
    Fiachna mac Retach, appears through mist to the assembled Connaught men, asks
    Laegaire for aid because his wife has been carried off by Goll son of Dolb, describes
    the martial hosts of Faery, and Laegaire with fifty men dives into the loch, fights
    to the fort of Mag Mell, and secures the queen''s release.'
