canonical_text:
  quote: They look for neither decay nor death.
  summary: 'The passage describes marvelous sea-lands: a fair man appears at sunrise
    over a sea-washed plain; a host crosses the clear sea to a music-giving stone;
    Emne contains many motley women; bird and other music accompany movement to plains
    and lands of joy; the host is repeatedly said not to expect decay or death; distant
    western ocean isles are numbered and compared in size to Erin.'
  language: English translation with Old Irish text and critical apparatus present
    in the supplied passage.
  quote_policy: quoted
