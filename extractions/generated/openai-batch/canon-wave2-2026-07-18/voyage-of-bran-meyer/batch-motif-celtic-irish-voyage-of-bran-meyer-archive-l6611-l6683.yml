  summary: 'A scholarly discussion of the manuscript tradition of Irish literature:
    it describes a revival of Irish letters, the preservation of tales and heroic
    sagas in manuscripts from the eleventh century onward, likely earlier oral tradition,
    evidence for older written forms through glosses and language, and the need to
    combine linguistic and subject-matter criticism when dating texts.'
  language: English
