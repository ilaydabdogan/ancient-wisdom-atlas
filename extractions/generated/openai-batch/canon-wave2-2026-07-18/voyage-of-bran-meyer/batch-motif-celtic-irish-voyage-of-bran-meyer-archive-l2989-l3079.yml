canonical_text:
  quote: ''
  summary: The passage lists waterways, then narrates a night scene in Mongán's palace
    in which a poet presses a wager about the death of Fothad Airgdech. A warrior
    enters the rath with a headless spear-shaft, rejects the poet's claim, and gives
    eyewitness testimony from a battle near the Larne river. He describes buried material
    signs that will prove his account. The signs are found; the visitor is identified
    as Cáilte, foster-son of Find, and Mongán is stated to be Find, though he kept
    it secret. A following Irish-language section headed as a story of Mongán begins
    with manuscript apparatus.
  language: English, with Old/Middle Irish and editorial apparatus in the final section
  quote_policy: summarized
