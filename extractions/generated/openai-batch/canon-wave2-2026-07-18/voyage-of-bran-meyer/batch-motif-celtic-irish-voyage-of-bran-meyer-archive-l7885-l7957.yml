canonical_text:
  quote: ''
  summary: 'The passage is a scholarly comparison of Otherworld motifs in Bran, Cuchulinn''s
    Sick Bed, and related tales. It notes shared features: a hero summoned by a loving
    fairy woman, a land over water, inexhaustible magic food, optional invisibility
    of inhabitants, Manannan''s connection with the land, and trees with sweet-singing
    birds. It then emphasizes differences in Cuchulinn''s Sick Bed: Cuchulinn and
    Laeg enter and return unharmed, deathlessness and supernatural time lapse are
    absent, Cuchulinn kills Labraid''s enemies, and Labraid''s Otherworld is martial
    rather than peaceful. The author suggests possible Irish antiquity, possible Scandinavian
    Valhalla influence, and narrative modifications caused by fitting an Otherworld
    episode into the Cuchulinn saga and Imrama-type voyage traditions.'
