canonical_text:
  quote: ''
  summary: 'The passage surveys Homeric descriptions of blessed or remote otherworld-like
    places: Menelaus is to be conveyed alive to the Elysian plain; Syria, Phoeacia,
    and Calypso’s isle are treated as fertile or delightful remote lands; Calypso’s
    speech gives examples of goddesses desiring mortal lovers and offering deathlessness.
    The author then explicitly compares Greek and Irish immortal women, divine authority
    over such unions, and Greek Olympus with Irish sid as set-apart regions for immortals
    associated with mountains.'
