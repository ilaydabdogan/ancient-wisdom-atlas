canonical_text:
  quote: ''
  summary: Mongan instructs Cuimne to obtain gifts from the king of Leinster, including
    a drinking-horn and a protective girdle. Mac an Daimh takes the treasures. A woman-for-woman
    exchange involving Dubh-Lacha is made, after which Mongan and Mac an Daimh escape
    on the best steeds, magically made wind-swift. In the morning the king of Leinster’s
    household discovers a hag, a dog, a hack mare, and a pack-saddle, and the king
    recognizes the woman beside him as Cuimne, the grey-backed hag of the mill. The
    passage then gives an annalistic notice of Mongan son of Fiachna Lurgan being
    killed by a stone by Arthur son of Bicor the Briton, with a verse attributed to
    Bec Boirche.
  language: English with Latin/Irish annal material
  quote_policy: summarized
