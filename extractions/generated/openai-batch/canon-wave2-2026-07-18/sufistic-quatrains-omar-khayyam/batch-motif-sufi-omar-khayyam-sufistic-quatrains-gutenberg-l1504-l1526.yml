canonical_text:
  quote: ''
  summary: In LXVI, personified vessels speak; one notices a little crescent that
    all had sought, and the vessels alert one another to the creaking of a porter’s
    shoulder-knot. In LXVII, the speaker asks the grape to sustain his fading life,
    to wash his dead body, to wrap him in a vine-leaf winding-sheet, and to bury him
    by a garden. In LXVIII, the speaker imagines his buried ashes sending perfume
    into the air so that any passing true believer is overtaken unaware.
  language: English
