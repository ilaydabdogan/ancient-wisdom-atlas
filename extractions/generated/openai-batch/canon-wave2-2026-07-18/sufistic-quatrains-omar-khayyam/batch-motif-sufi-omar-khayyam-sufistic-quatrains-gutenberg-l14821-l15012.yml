- id: ev:7
  type: summary
  locator: lines 14821-15012; quatrain 417
  quote_or_summary: Ruby lips, wine, drum, harp, and flute are called trifles; one
    is nothing until breaking the bonds of the dark world.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain; Project Gutenberg source metadata indicates full text
