- id: ev:11
  type: summary
  locator: lines 14821-15012; quatrain 421
  quote_or_summary: The addressee is told to follow the Kalendar, seek the tavern,
    occupy himself with wine, song, and the friend [the Divinity], hold a cup, carry
    a gourd, drink, and avoid foolish talk.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain; Project Gutenberg source metadata indicates full text
