canonical_text:
  quote: ''
  summary: A sequence of quatrains offers counsel on grief, poverty, destiny, worldly
    impermanence, wine, the tavern, the cupbearer, the Kalendar's way, Paradise and
    Koocer, ethical restraint, natural transformation, dawn as a reminder of passing
    life, and death as the common end of wise men, rulers, kings, and beggars. It
    closes with a potter shaping pitchers whose forms resemble royal heads and beggars'
    feet.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage counsels resignation to grief and suffering, gratitude to Providence
    in poverty, and endurance of sorrow without seeking remedy from others.
  category: speech
  evidence_refs:
  - ev:1
  - ev:13
- id: obs:2
  text: A wise man in the house of a drunken man advises the speaker to drink wine,
    saying many have gone out and never returned.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker values ruby wine, a book of verse, brief peace, bread, a lone
    place, and a friend above a Sultan's joy.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The cupbearer is addressed repeatedly and is asked to bring wine, strike the
    harp, stop speaking of religious observances, and provide a tavern treatise.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
