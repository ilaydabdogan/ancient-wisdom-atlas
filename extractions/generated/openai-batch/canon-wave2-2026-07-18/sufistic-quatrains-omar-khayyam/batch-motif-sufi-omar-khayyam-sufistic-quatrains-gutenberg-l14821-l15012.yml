- id: ev:12
  type: summary
  locator: lines 14821-15012; quatrain 422
  quote_or_summary: The quatrain asks whether life should rest on a rock or be free
    from grief; it says that after dwelling one instant without wine, each breath
    will hold a new attraction.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain; Project Gutenberg source metadata indicates full text
