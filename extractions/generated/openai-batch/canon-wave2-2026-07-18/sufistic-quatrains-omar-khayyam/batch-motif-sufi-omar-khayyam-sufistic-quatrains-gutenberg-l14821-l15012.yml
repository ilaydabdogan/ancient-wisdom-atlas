- id: ev:8
  type: summary
  locator: lines 14821-15012; quatrain 418
  quote_or_summary: Under the tyrannic vault in a world that is a seat of woe, the
    addressee is told to drink wine and, being earth from beginning to end, act as
    one on earth rather than beneath it.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain; Project Gutenberg source metadata indicates full text
