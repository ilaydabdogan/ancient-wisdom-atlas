- id: ev:14
  type: summary
  locator: lines 14821-15012; quatrain 424
  quote_or_summary: 'Two foundations of wisdom are named: not eating anything that
    eats other things and keeping oneself unsullied by all that lives.'
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain; Project Gutenberg source metadata indicates full text
