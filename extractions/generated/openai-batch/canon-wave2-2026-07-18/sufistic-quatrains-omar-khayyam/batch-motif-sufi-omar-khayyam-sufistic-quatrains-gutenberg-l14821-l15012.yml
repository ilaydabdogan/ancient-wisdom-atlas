- id: ev:10
  type: summary
  locator: lines 14821-15012; quatrain 420
  quote_or_summary: The speaker sees Paradise's sod and Koocer's brook, and says a
    field outside Hell is transformed into a celestial sojourn near a celestial fair.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain; Project Gutenberg source metadata indicates full text
