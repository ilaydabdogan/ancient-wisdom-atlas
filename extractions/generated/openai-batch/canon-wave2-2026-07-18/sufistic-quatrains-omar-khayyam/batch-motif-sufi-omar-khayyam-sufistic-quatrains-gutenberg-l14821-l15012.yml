- id: ev:9
  type: summary
  locator: lines 14821-15012; quatrain 419
  quote_or_summary: A friend who knows all secrets is asked why he suffers vain torments;
    while breathing, he can at least be gay.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain; Project Gutenberg source metadata indicates full text
