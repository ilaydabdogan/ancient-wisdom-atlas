candidate_motifs:
- id: motif:1
  label: Wine, cupbearer, and tavern as chosen path
  taxonomy_refs:
  - mystical_quest
  basis: The passage repeatedly instructs the addressee to seek wine, the cupbearer,
    the tavern, song, the Kalendar's way, and the friend glossed as the Divinity.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:11
  - ev:18
  - ev:19
  confidence: medium
  cautions: The language can be read literally as wine poetry; the passage itself
    supplies only one explicit gloss identifying the friend as the Divinity.
- id: motif:2
  label: Divine friend or beloved
  taxonomy_refs:
  - divine_beloved
  basis: The friend is included among the central pursuits of the Kalendar's way and
    is explicitly bracketed as the Divinity.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The divine identification is brief and appears as a bracketed gloss within
    the passage.
- id: motif:3
  label: Worldly impermanence and common mortality
  taxonomy_refs:
  - wisdom
  basis: The passage says many depart and do not return, humans are earth and wind,
    another night slips away from existence, and even philosophers, rulers, and Bahram
    end in tomb or coffin.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:8
  - ev:16
  - ev:20
  confidence: high
  cautions: The available taxonomy has no exact memento-mori category; 'wisdom' is
    used because the mortality images function as counsel.
- id: motif:4
  label: Breaking the bonds of the dark world
  taxonomy_refs:
  - annihilation_union
  - mystical_quest
  basis: The passage contrasts ordinary pleasures with breaking the bonds of the dark
    world and asks for wine that may make the speaker a stranger to himself and free
    him briefly from worldly vicissitudes.
  evidence_refs:
  - ev:7
  - ev:18
  confidence: medium
  cautions: The text supports self-estrangement and liberation language, but does
    not explicitly describe union.
- id: motif:5
  label: Potter's vessels as leveling image of kings and beggars
  taxonomy_refs: []
  basis: The potter forms pitcher parts like the heads of kings and feet of beggars
    after a quatrain emphasizing that even powerful and learned figures end in tomb
    or coffin.
  evidence_refs:
  - ev:20
  - ev:21
  confidence: high
  cautions: The passage does not explicitly state that the pitchers are made from
    human remains; the extraction is limited to the visible leveling of royal and
    beggarly forms.
- id: motif:6
  label: Resigned endurance as wisdom
  taxonomy_refs:
  - wisdom
  basis: The passage counsels resignation to grief, gratitude in poverty, bearing
    suffering privately, and being happy in sorrows.
  evidence_refs:
  - ev:1
  - ev:13
  confidence: high
  cautions: This is an ethical-didactic motif rather than a narrative mythic episode.
- id: motif:7
  label: Celestial afterlife landscape
  taxonomy_refs:
  - afterlife_journey_map
  basis: Paradise, the brook of Koocer, Hell, and a celestial sojourn are named in
    a single quatrain.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage describes locations but does not narrate an actual journey
    through them.
- id: motif:8
  label: Seasonal and material transformation
  taxonomy_refs:
  - seasonal_cycle
  basis: Spring vine-juice changes from sharp to sweet and wine becomes bitter; wood
    can become viols or flutes by the same cutting process.
  evidence_refs:
  - ev:15
  confidence: medium
  cautions: Only spring is explicitly mentioned; the larger seasonal cycle is implied
    by transformation rather than fully narrated.
- id: motif:9
  label: Non-harm and unsullied life as hidden wisdom
  taxonomy_refs:
  - wisdom
  basis: 'Two foundations of wisdom are named: not eating what eats other things and
    keeping oneself unsullied by all that lives.'
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The passage states the rule aphoristically without narrative context.
