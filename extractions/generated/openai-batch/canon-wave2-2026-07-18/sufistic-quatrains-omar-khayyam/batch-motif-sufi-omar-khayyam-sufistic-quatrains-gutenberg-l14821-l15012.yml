- id: ev:13
  type: summary
  locator: lines 14821-15012; quatrain 423
  quote_or_summary: The world is called a house of pilferers; the addressee is advised
    not to count on a friend, to bear suffering, seek no remedy, and be happy in sorrows.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain; Project Gutenberg source metadata indicates full text
