  summary: The passage introduces Sufism as necessary background for understanding
    Omar Khayyam. It discusses proposed etymologies of the name, describes Sufi doctrine
    in terms of emanation, divine unity, self-abandonment, the soul's confinement
    in the body and return to God, and explains the Sufi path as a voyage through
    successive stages toward knowledge, extinction, or absorption in the Deity.
  language: English
  quote_policy: summarized
