canonical_text:
  quote: There was a Door to which I found no Key
  summary: In three quatrains, a first-person speaker describes a door without a key
    and a veil past which he cannot see; a brief talk of “ME and THEE” appears and
    then vanishes; the speaker asks Heaven what lamp Destiny used to guide children
    stumbling in darkness and receives the reply “A blind Understanding”; finally
    the speaker consults an earthen bowl about the secret Well of Life and receives
    the counsel to drink while alive because the dead do not return.
  language: English
