canonical_text:
  quote: ''
  summary: A sequence of quatrains reflects on sacred months, wine, passing time,
    ruined royal splendor, green growth from human dust, the body's temporary nature,
    the soul's departure, fate, uncertainty about Hell and Paradise, and the speaker's
    dispute with religious critics. Recurrent counsel urges drinking, joy, and awareness
    that life cannot be held.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage links named months with abstinence, consecration to Allah and
    his Prophet, Ramazan, wine pots, and waiting houris.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The world is described as a rolling hostelry where light and darkness alternate,
    and as a ruin or memento of former royal entertainments and hunters.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker tells a friend to fill and drink the cup because time does not
    willingly repeat a day like the present one.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bahram's former drinking palace is now occupied by gazelles and lions, and
    Time is said to have snared Bahram.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Clouds weep on the earth, green growth gladdens eyes, and the speaker asks
    whose sight will be pleased by green growth arising from human dust.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The heart is told to sit on field verdure before verdure springs from its
    own dust, while pure souls leave the tenement of clay.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Wine is said to take many forms, including animal and plant forms, while its
    imperishable self continues after forms disappear.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The speaker calls the veil of flesh, the ninefold heaven, life, and the world
    naught, and recommends giving oneself to joy in the disordered world.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The speaker asks for dancers, wine, a houri, or a brook, and says not to think
    of Hell's hot penalties or of a Paradise fairer than the scene he names.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: An old man comes from the tavern drunk, with a prayer-rug on his shoulders
    and a bowl of wine in hand, and tells the speaker to drink because the world is
    wind.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A nightingale in a rose garden sees laughing roses with a cup of wine and
    warns the speaker that life slips away and cannot be held.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Khayyam's body is compared to a tent, his soul to its inhabitant, and annihilation
    to the soul's last long home.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: When the soul leaves the tent, slaves are said to strike it and pitch it for
    an oncoming soul.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: Khayyam is described as engulfed in a crucible of grief and burned; Fate's
    shears cut his thread, and the Auctioneer of Life sells him for a song.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: The speaker says the person addressed will soon be separated from the soul,
    go behind the curtain of God's secrecy, and remain ignorant of origin and destination.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The speaker addresses a devotee and Men of Holiness, praises wine, contrasts
    their relation to wisdom with his own, and acknowledges accusations of contravening
    Koranic law.
  category: speech
  evidence_refs:
  - ev:16
