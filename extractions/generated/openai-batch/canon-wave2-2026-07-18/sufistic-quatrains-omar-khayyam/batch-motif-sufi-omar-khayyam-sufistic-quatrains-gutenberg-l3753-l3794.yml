  quote: ''
  summary: The passage presents quatrains and editorial notes. One quatrain describes
    the first clay of earth, the last man, a final harvest seed, and a first creation-morning
    writing what the last dawn of reckoning will read. A parallel quatrain addresses
    the heart, advising resignation to destiny because what the Pen has written will
    not be rewritten. Another quatrain says yesterday prepared today's madness and
    tomorrow's silence, triumph, or despair, then urges drinking because one does
    not know whence one came, why one came, why one goes, or where. Editorial notes
    connect these quatrains to cited Omar Khayyam source numbers.
