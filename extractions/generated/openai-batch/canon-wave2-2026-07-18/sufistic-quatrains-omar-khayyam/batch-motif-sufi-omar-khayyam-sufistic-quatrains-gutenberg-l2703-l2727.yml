  summary: The passage presents quatrains in which saints and sages who discussed
    the Two Worlds are rejected, their words scattered and their mouths stopped with
    dust. A speaker addresses the Saki, saying predecessors have fallen asleep in
    the dust of self-esteem, urging wine and truth while dismissing earlier sayings
    as wind. Another quatrain describes the finest of mankind spurring the Burak of
    thought to the highest heaven, yet becoming turned, overset, and spinning in the
    study of an addressed being.
