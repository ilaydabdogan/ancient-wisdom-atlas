canonical_text:
  quote: ''
  summary: A sequence of quatrains presents images of vain labor, spring and wine,
    inwardized heaven and hell, certitude, miraculous spring renewal, love, cosmic
    order, historical transience, divine decree, the creator as maker of vessels,
    ethical kindness, mystical love through heaven or hell, an irreversible pilgrimage,
    sin and mercy, and the self as belonging to Another.
  language: English
  quote_policy: summarized
