candidate_motifs:
- id: motif:1
  label: Internalized divine judgment and decree
  taxonomy_refs:
  - divine_judgment
  basis: The passage presents pen, tablet, heaven, and hell as sought above the skies
    but taught to be within the self, and also states that Truth decrees all things.
  evidence_refs:
  - ev:3
  - ev:11
  confidence: high
  cautions: The passage is aphoristic and inwardizing; it does not narrate a formal
    judgment scene.
- id: motif:2
  label: Mystical quest for certitude and wisdom
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: The speaker seeks cosmic realities, receives instruction from a master sage,
    and certitude is framed as a fruit reached by effort on a path.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The quatrains are discrete lyric units rather than one continuous quest
    narrative.
- id: motif:3
  label: Seasonal renewal as resurrection
  taxonomy_refs:
  - seasonal_cycle
  - resurrection
  - death_rebirth
  basis: Spring showers renew the land, Jesus' breath wakes the dead earth to life,
    and trees bloom white like Moses' hand.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The resurrection language is applied to earth in spring rather than to
    an explicit human resurrection event.
- id: motif:4
  label: Divine or mystical beloved pursued through heaven and hell
  taxonomy_refs:
  - divine_beloved
  - annihilation_union
  basis: The beloved draws the heart away from the speaker, and the true lover seeks
    the loved one even in heaven or hell; the note says the quatrain is probably mystical.
  evidence_refs:
  - ev:6
  - ev:15
  confidence: medium
  cautions: Some beloved imagery can be read literally as courtly or erotic lyric;
    the source note marks mysticism as probable, not certain.
- id: motif:5
  label: Irreversible departure and human transience
  taxonomy_refs:
  - departure
  basis: Many past figures have died or passed away, humans come briefly and pass,
    and the pilgrim who goes does not return.
  evidence_refs:
  - ev:9
  - ev:12
  - ev:16
  confidence: medium
  cautions: The passage stresses no-return and mortality, but it gives little detail
    about a mapped afterlife journey.
- id: motif:6
  label: Creator as maker of vessels and question of blame
  taxonomy_refs:
  - divine_judgment
  basis: The Master frames vessels and is questioned about why he would shame or break
    what he made; another quatrain links sin with mercy.
  evidence_refs:
  - ev:13
  - ev:17
  confidence: medium
  cautions: The vessel-maker image is present, but the passage leaves the theological
    conclusion in rhetorical questions.
- id: motif:7
  label: Selfhood belonging to Another
  taxonomy_refs:
  - annihilation_union
  basis: The final quatrain says the addressee's being and passion are those of Another
    and the hand is only that Other's cover.
  evidence_refs:
  - ev:18
  confidence: medium
  cautions: The passage does not explicitly name the Other here; Sufi interpretation
    is suggested by context but should be reviewed.
comparison_claims:
- id: claim:1
  claim: The passage explicitly aligns the pen and tablet with an Islamic divine-decree
    pattern by noting that Allah writes decrees with the pen on the tablet.
  claim_level: same_motif
  target: Qur'anic/Islamic motif of the pen and tablet of decree
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The extracted passage supplies the note but does not reproduce a full
    Qur'anic narrative context.
- id: claim:2
  claim: The spring-renewal quatrain explicitly uses Jesus' life-giving breath and
    Moses' white hand as miracle allusions.
  claim_level: same_function
  target: Jesus life-giving miracle and Moses white-hand miracle in Islamic/Biblical
    reception
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is based on named allusions and the editor's note; it
    does not establish broader historical transmission beyond the cited tradition.
- id: claim:3
  claim: The note reports that the sin-and-mercy sentiment resembles passages in Nizami
    and Hafiz, supporting cautious comparison within Persian poetic and Sufi reception.
  claim_level: same_function
  target: Persian poetic/Sufi reflections on sin as occasion for divine mercy
  evidence_refs:
  - ev:17
  counter_evidence_refs: []
  confidence: medium
  limitations: The note names similar sentiments but the compared passages are not
    included in the supplied text.
