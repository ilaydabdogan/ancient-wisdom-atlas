candidate_motifs:
- id: motif:1
  label: Heart or soul ascends after release from matter
  taxonomy_refs:
  - ascent
  basis: The heart is told that freedom from matter will make it a pure soul whose
    residence is the firmament.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage states ascent imagery directly but does not narrate an actual
    completed journey.
- id: motif:2
  label: Search for being and annihilation
  taxonomy_refs:
  - annihilation_union
  basis: The passage explicitly names the search for being and annihilation and associates
    attachment to the world with sorrow and loss.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The text names annihilation, but union is not explicitly narrated in this
    line range.
- id: motif:3
  label: Divine beloved or divine friend encountered with wine
  taxonomy_refs:
  - divine_beloved
  basis: The friend is identified in brackets as the Divinity, and the heart is told
    to enjoy the friend’s presence in the garden with wine.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: high
  cautions: The extraction follows the supplied translation’s bracketed identification
    of the friend as Divinity.
- id: motif:4
  label: Seasonal fading and renewed birth
  taxonomy_refs:
  - seasonal_cycle
  - death_rebirth
  basis: Spring and autumn make the leaves of existence disappear, while the speaker
    hopes for a new birth of heart like green turf born again.
  evidence_refs:
  - ev:11
  - ev:13
  confidence: high
  cautions: The renewed birth is expressed as a wish and analogy, not as an enacted
    resurrection narrative.
- id: motif:5
  label: Mortal body returned to clay or vessel
  taxonomy_refs:
  - death_rebirth
  basis: The potter molds human clay, a cup says the speaker will become like it,
    and skulls are imagined as future pitchers.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The motif concerns bodily transformation and mortality; explicit rebirth
    is material or metaphorical rather than personal resurrection.
- id: motif:6
  label: Mystical quest for the safe way opened by the eternal divine
  taxonomy_refs:
  - mystical_quest
  basis: The speaker asks the divine to open the door and show the way of safety,
    refusing perishable human guides.
  evidence_refs:
  - ev:18
  confidence: high
  cautions: The passage offers a prayer for guidance rather than a full quest narrative.
- id: motif:7
  label: Divine judgment, death, and reliance on pity
  taxonomy_refs:
  - divine_judgment
  basis: The divine is accused of catching people in snares, giving them to death,
    calling them rebels, and yet being the one whose pity the speaker counts on.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage challenges or questions divine judgment more than it describes
    a formal judgment scene.
- id: motif:8
  label: Wise counsel on grief, mortality, and wine
  taxonomy_refs:
  - wisdom
  basis: Wise men or sages provide counsel about happiness, grief as poison, and wine
    as antidote; the passage also instructs the reader to examine beginning and end.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:17
  confidence: medium
  cautions: The motif is aphoristic wisdom rather than a narrative wisdom contest
    or revelation.
