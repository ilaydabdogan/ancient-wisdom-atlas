canonical_text:
  quote: ''
  summary: A sequence of quatrains addresses human mortality, divine mystery, cosmic
    affliction, the heart’s possible release from matter, pottery and cups as reminders
    that bodies return to clay, wine as comfort against grief, the divine friend,
    seasonal fading and renewal, religious hypocrisy, and the speaker’s appeal for
    the eternal divine to open a safe way.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A human addressee is described as the result of four elements and seven heavens,
    perplexed among them, and told to drink wine because after departure there is
    no return.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The divine addressee is said to raise ambushes and snares, warn of death,
    catch those who enter, give them to death, and call them rebels.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker addresses the divine essence as impenetrable to intelligence and
    says he is drunk with sin but relies on divine pity.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Wheel of Heaven is addressed as filling the speaker’s heart with woe,
    killing joy, altering air with water, and changing drinking water into mud.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The heart is told that if it frees itself from the grief inherent in matter,
    it will become a pure soul and mount to the heavens and firmament.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A potter is warned to be attentive while molding clay, because the clay is
    identified with human remains and with the finger and hand of named royal figures.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A broken china cup speaks to the speaker, saying it has been like him and
    that he will in turn become like it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The cupbearer is urged to pour wine before pitchers are made from human skulls.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The world is described as giving only smoke and loss to those attached to
    it, while searching for being and annihilation is linked with sorrow.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: The speaker says not to torment sleeping people into midnight cries and warns
    that riches and beauty vanish during the night.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The speaker wishes for a place of repose, a settled end to the road, and a
    new birth of heart on earth like green turf born again after a very long time.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: While drawing a horoscope in the book of love, the speaker hears words from
    the burning heart of a wise man about happiness with a moonlike friend and a night
    as long as a year.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Spring and autumn are said to make the leaves of existence disappear; wine
    is presented as an antidote to grief.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: The heart is told to drink wine in a garden, enjoy the friend identified in
    the text as the Divinity, renounce hypocrisy, and receive wine associated with
    Ahmed and Ali.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: The cupbearer is asked to bring wine among blossoming flowers before the angel
    of death places a watch over the speakers.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: Hypocrisy is said to weary the speaker’s heart, and the cupbearer is asked
    to pawn the prayer-rug and turban to procure wine.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:17
  text: The reader is told to examine what was brought at the beginning and what will
    be carried away at the end, and that death is necessary whether one drinks or
    does not drink.
  category: speech
  evidence_refs:
  - ev:17
- id: obs:18
  text: The speaker asks the divine to open the door and show a safe way, refusing
    other guides because they are perishable while the divine is eternal.
  category: speech
  evidence_refs:
  - ev:18
- id: obs:19
  text: A mullah is addressed as accusing the speaker of atheism and lack of religion;
