candidate_motifs:
- id: motif:1
  label: memento mori through bodily dust becoming building material or vessels
  taxonomy_refs:
  - death_rebirth
  basis: Several quatrains imagine the dead body or dust becoming bricks, a skull-cup,
    or a jug, pitcher, or cup.
  evidence_refs:
  - ev:1
  - ev:17
  - ev:23
  confidence: medium
  cautions: The passage emphasizes mortality and material transformation; assigning
    it to death_rebirth is approximate because no full rebirth narrative occurs.
- id: motif:2
  label: ruined royal grandeur and vanished kings
  taxonomy_refs:
  - wisdom
  basis: A palace once used by kings is now a ruin where a bird cries 'Where are they?',
    presenting reflection on the disappearance of worldly power.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: This is a reflective wisdom motif rather than a narrative mythic episode.
- id: motif:3
  label: forgetting of the dead and loss of trace
  taxonomy_refs:
  - wisdom
  basis: The passage asks where the gain of life is and where the smoke or trace of
    righteous people remains after death.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The motif is aphoristic and existential, not tied to a named mythic cycle.
- id: motif:4
  label: divine mercy tested against human sin
  taxonomy_refs:
  - divine_judgment
  basis: The speaker contrasts personal sins with God's mercy and asks that evil not
    be repaid with evil; another quatrain warns that good undone and evil done cannot
    be undone.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:16
  confidence: medium
  cautions: The passage raises judgment and mercy themes without depicting a formal
    judgment scene.
- id: motif:5
  label: annihilation or union in the divine
  taxonomy_refs:
  - annihilation_union
  basis: The speaker says 'I am lost in Thee,' and the drop-sea image declares the
    sea and Truth to be all while plurality is only apparent.
  evidence_refs:
  - ev:10
  - ev:20
  confidence: high
  cautions: The Sufi interpretation is supported by the passage's language and editorial
    comparison, but the extraction remains passage-level.
- id: motif:6
  label: wine and tavern as counter-values to worldly and religious concern
  taxonomy_refs:
  - mystical_quest
  basis: The speaker repeatedly asks for wine, rejects concern over afterlife destination,
    dismisses preaching about mosque, prayer, and fast, and humbles himself at the
    tavern threshold.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:19
  - ev:23
  confidence: medium
  cautions: The mystical function of wine and tavern is suggested by the anthology
    context and Kalendar note, but some lines can also be read literally.
- id: motif:7
  label: human helplessness under fate
  taxonomy_refs:
  - duality
  basis: Man is compared to a ball driven by fate's bat, while God knows what drives
    him.
  evidence_refs:
  - ev:11
  confidence: low
  cautions: The available taxonomy does not include a specific fate motif; 'duality'
    is only a loose fit between human helplessness and divine knowledge.
- id: motif:8
  label: cosmic cup imagery
  taxonomy_refs:
  - wisdom
  basis: The heavens are compared to an inverted cup and linked to the cup and bottle
    imagery used elsewhere in the passage.
  evidence_refs:
  - ev:18
  confidence: medium
  cautions: This is a symbolic image within a lyric quatrain rather than a developed
    cosmological myth.
comparison_claims:
- id: claim:1
  claim: The quatrain on loss of remembrance is explicitly compared in the note to
    Ecclesiastes' statement that the wise are not remembered more than the fool.
  claim_level: same_function
  target: Ecclesiastes on lack of remembrance of wise and fool
  evidence_refs:
  - ev:3
  - ev:24
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage note supports thematic comparison only; it does not establish
    historical contact or dependence.
- id: claim:2
  claim: The statement that body, soul, spirit, and being are from God is explicitly
    glossed with the biblical phrase 'In him we live and move, and have our being.'
  claim_level: same_function
  target: Biblical/Acts phrase 'In him we live and move, and have our being' as quoted
    in the note
  evidence_refs:
  - ev:10
  - ev:25
  counter_evidence_refs: []
  confidence: medium
  limitations: The note gives a parallel phrase but not a detailed argument for borrowing
    or shared source.
- id: claim:3
  claim: The drop and sea image is explicitly marked for comparison with Gulshan i
    Raz, line 710.
  claim_level: same_motif
  target: Gulshan i Raz, line 710
  evidence_refs:
  - ev:20
  - ev:26
  counter_evidence_refs: []
  confidence: medium
  limitations: The note names a comparison but the target text is not provided here,
    so the exact scope of similarity cannot be verified from this passage alone.
- id: claim:4
  claim: The transformation of human remains into utilitarian material is compared
    in the note to the cited line about Caesar's clay stopping a hole.
  claim_level: same_function
  target: 'Quoted line in note: ''Imperial Cæsar, dead, and turned to clay Might stop
    a hole to keep the wind away.'''
  evidence_refs:
  - ev:23
  - ev:27
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage note supports a thematic parallel in mortality imagery,
    not a historical-contact claim.
