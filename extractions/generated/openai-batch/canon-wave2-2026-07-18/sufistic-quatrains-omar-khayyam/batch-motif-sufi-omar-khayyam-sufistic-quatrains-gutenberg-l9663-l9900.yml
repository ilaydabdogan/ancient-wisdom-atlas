canonical_text:
  quote: ''
  summary: A sequence of quatrains reflects on death, bodily dissolution into bricks
    or vessels, ruined kingship, forgotten lives, wine, beloved lips, divine creation
    and mercy, fate, divine attributes, ascetic counsel, tavern imagery, and mystical
    union expressed through the drop and the sea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The dead are imagined resting in a tomb marked by bricks; later their dust
    is molded into bricks for another person's tomb.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A ruined palace once associated with kings and homage is now occupied by a
    ringdove whose cry is glossed as asking where they are.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker asks what gain comes from human coming and going, and where the
    trace of righteous people remains after they have burned to dust.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A beloved's lip is described as containing life's well-spring, and the cup's
    lip is warned not to touch it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A speaker addresses God as creator and keeper, and asks whether the speaker's
    sins or God's mercy are greater.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A speaker urges Love to take a cup and goblet to a river bank and grassy glade.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker asks whether anyone knows where they will go after death, then
    asks for wine.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A speaker asks whether any mortal has passed a sinless day and asks that evil
    not be repaid with evil.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The speaker asks for wine called a ruby gem of Badakhshan and questions where
    a true Musulman can be found if drinking is forbidden to Musulmen.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: A speaker says body, soul, spirit, and being proceed from God and that the
    speaker is lost in God.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Man is compared to a ball driven by fate's bat, while God is said to know
    what drives him.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: God is addressed as giving sight to ants and strength to feeble flies.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The passage counsels against avarice and ambition, urging sharpness like fire
    and swiftness like running water rather than passivity like dust in wind.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Kalendars are described in the note as bibulous Sufis, and their raptures
    are said to surpass all things from moon to fish.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:15
  text: Life's vesture is said to crumble into dust, making stains of word or deed
    matter little.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: One quatrain warns that good left undone cannot be done and evil done cannot
    be undone.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:17
  text: The skull is imagined as eventually being turned into a cup, so the speaker
    urges holding wine-cups before that happens.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:18
  text: The heavens are compared to an inverted cup, and the bottle is personified
    as stooping over the cup and giving blood to drink.
  category: attribute
  evidence_refs:
  - ev:18
- id: obs:19
  text: The speaker says he sweeps the tavern threshold with his hair and would sell
    both worlds for a small coin when drunk.
  category: action
  evidence_refs:
  - ev:19
- id: obs:20
  text: A drop weeps over separation from the sea; the sea says that it is all, that
