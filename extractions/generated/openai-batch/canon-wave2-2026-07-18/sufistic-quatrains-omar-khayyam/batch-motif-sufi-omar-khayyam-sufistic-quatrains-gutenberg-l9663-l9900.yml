  category: speech
  evidence_refs:
  - ev:20
- id: obs:21
  text: The speaker asks whether to sigh over what is lacking, then asks to fill the
    cup because the present breath may be the last.
  category: speech
  evidence_refs:
  - ev:21
- id: obs:22
  text: The speaker counsels against grief over fortune or parted friends and advises
    devotion to lips and wine.
  category: speech
  evidence_refs:
  - ev:22
- id: obs:23
  text: The speaker rejects preaching about mosque, prayer, and fast, urges drinking,
    and says Khayyam's dust may soon become a jug, pitcher, or cup.
  category: speech
  evidence_refs:
  - ev:23
