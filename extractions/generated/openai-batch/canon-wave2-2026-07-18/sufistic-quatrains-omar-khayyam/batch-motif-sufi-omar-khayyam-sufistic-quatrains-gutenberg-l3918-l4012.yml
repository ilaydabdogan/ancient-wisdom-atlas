canonical_text:
  quote: ''
  summary: The passage presents a quatrain addressing God as maker of humanity from
    earth and deviser of the Snake in Paradise, asking for human forgiveness. Editorial
    notes connect the snake image to a Mantik ut-tair apologue about Snake/Iblis in
    Paradise at Adam's creation, and cite related ruba'iyat on mercy, repentance,
    sin, and divine creatorship. The passage then gives quatrains in which Ramazan
    departs and the speaker stands in a potter's house among clay shapes and vessels,
    some speaking and some silent; commentary connects these to an original potter-workshop
    ruba'i and to a Ramadan-and-wine ruba'i.
  language: English
  quote_policy: summarized
