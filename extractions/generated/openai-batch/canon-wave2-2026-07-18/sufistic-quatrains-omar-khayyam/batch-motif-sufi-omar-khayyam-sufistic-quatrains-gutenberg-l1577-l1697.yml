canonical_text:
  quote: turn down an empty Glass!
  summary: The quatrain imagines a future joyful gathering after the speaker is absent
    and asks that an empty glass be turned down at the place where he once sat. The
    accompanying notes explain images of dawn, New Year and spring, Moses and Jesus,
    Iram, Jamshyd's cup, Persian heroes and ruins, sevenfold heavenly symbolism, a
    lamenting ringdove, blood-grown flowers, planetary and heavenly order, divided
    selfhood, and a tale in which a bowl made from human clay makes water taste bitter
    with mortality.
  language: English
  quote_policy: quoted
