candidate_motifs:
- id: motif:1
  label: Absent companion remembered by an empty vessel
  taxonomy_refs: []
  basis: The quatrain presents a future feast-like gathering where the speaker's former
    place is marked by turning down an empty glass.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The quatrain does not explicitly state death, memorial rite, or funerary
    setting; absence is inferred from the speaker's former place and the empty glass.
- id: motif:2
  label: False dawn preceding true dawn
  taxonomy_refs: []
  basis: The note explicitly defines false dawn as a transient light before true dawn.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The note is explanatory rather than narrative.
- id: motif:3
  label: Spring New Year renewal
  taxonomy_refs:
  - seasonal_cycle
  basis: New Year begins with the Vernal Equinox, and the note describes rapid spring
    blossoming after snow.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage is a note on imagery rather than a mythic episode.
- id: motif:4
  label: Miraculous bodily sign and healing breath
  taxonomy_refs: []
  basis: Moses' white hand and Jesus' healing breath are both presented as sacred
    or miraculous powers.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage only gives brief explanatory allusions.
- id: motif:5
  label: Lost or sunken city in the sands
  taxonomy_refs: []
  basis: Iram is described as planted by King Shaddad and now sunk somewhere in Arabian
    sands.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not narrate the city's sinking, only reports its state.
- id: motif:6
  label: Cosmic divining cup
  taxonomy_refs:
  - wisdom
  basis: Jamshyd's cup is seven-ringed, corresponds to seven heavens, planets, and
    seas, and is called a divining cup.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The taxonomy reference is broad; the passage does not elaborate a full
    wisdom quest.
- id: motif:7
  label: Primeval royal ruin built by culture or spirit kings
  taxonomy_refs: []
  basis: Persepolis is linked to Jamshyd and alternatively to Jan Ibn Jan, a Genie
    King said to have built it before Adam.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The note records competing attributions rather than one stable mythic
    narrative.
- id: motif:8
  label: Sevenfold palaces as heavenly map
  taxonomy_refs:
  - ascent
  - afterlife_journey_map
  basis: Bahram Gur's seven coloured castles are said to figure the seven heavens,
    with a possible eighth transcendent book-space.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage states this as an Eastern mystical reading; it does not narrate
    an ascent through the heavens in detail.
- id: motif:9
