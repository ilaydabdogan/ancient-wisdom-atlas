canonical_text:
  quote: ''
  summary: A sequence of quatrains counsels wine and tavern over formal religious
    practice, reflects on mortality, dust, flowers, and vanished predecessors, addresses
    the cupbearer and God, values wine above empire and future paradise, describes
    a hellish shape breaking a wine flask, and presents the heart at the banquet of
    the Divinity tasting the wine of annihilation.
  language: English
  quote_policy: summarized
