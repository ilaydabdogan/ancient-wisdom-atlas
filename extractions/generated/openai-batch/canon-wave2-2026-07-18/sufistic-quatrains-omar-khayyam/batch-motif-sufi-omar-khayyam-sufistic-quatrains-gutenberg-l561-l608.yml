  quote: ''
  summary: The passage is an introductory interpretation of Omar Khayyam as a Sufi
    figure whose use of doubt and protest is said to portray the awakening of the
    soul. It presents Omar as an awakener, healer, God-seeker, and apostle of protest,
    and connects his teaching on purification and unity with God to Vedantic philosophy
    and Sufi practice.
  language: English
