canonical_text:
  quote: ''
  summary: A sequence of quatrains advises the listener to abandon worldly anxiety,
    accept impermanence, drink wine, prefer sincerity to hypocrisy, and contemplate
    a universe governed by Heaven, time, and divine love. The passage includes a cosmological
    image of the universe as a body, a tavern scene in which the beloved identified
    as God offers a cup, dawn imagery beside a brook, a veiled voice denying ordinary
    paths of belief and doubt, cosmic bulls above and below the earth, reflections
    on Hell and Paradise, and a final prayer to God for pity and pardon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressee is told not to be troubled by the Wheel of Heaven and to observe
    the destined games of men as a peaceable spectator.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Khayyam is named as giving counsel to please drinkers, reject the bases of
    prayer and fasting, drink wine, and do good.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The universe is described as a body whose soul is justice, whose wit is the
    angels, whose elements are the heavens, and whose members are creatures; this
    is called eternal unity.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: In a tavern, the object of the speaker's heart, glossed as God, presents a
    cup and tells the speaker to drink for love.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker recommends fortifying the soul by drinking wine and not taking
    on worldly cares.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sages who have considered the dusty and inconstant world find wine in ruby
    cups and beautiful countenances agreeable.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Wheel of Heaven and periodic time are blamed for favoring the abject;
    the speaker compares hollow cheeks to a cup filled with tears and the heart to
    a flask full of blood.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Before dawn, the speaker sits with a charming friend and rose-colored wine
    beside a brook; the cup is compared to a shell whose pearl-like light announces
    Dawn.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The speaker advises forgetting the past day, not being disturbed by tomorrow,
    and living happily for one instant.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A man is described as going to sterile soil while belonging to neither heretic
