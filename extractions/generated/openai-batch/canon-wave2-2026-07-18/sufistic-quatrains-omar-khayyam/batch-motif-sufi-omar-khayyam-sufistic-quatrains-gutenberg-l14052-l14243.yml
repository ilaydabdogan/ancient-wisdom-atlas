candidate_motifs:
- id: motif:1
  label: Divine beloved as cup-giver
  taxonomy_refs:
  - divine_beloved
  basis: The beloved or friend is explicitly glossed as God or Divinity and is connected
    to offering the cup, justifying wine, and being the object of passion.
  evidence_refs:
  - ev:4
  - ev:12
  - ev:14
  - ev:16
  confidence: high
  cautions: The Sufi identification depends partly on bracketed glosses present in
    the provided translation; human review should confirm how to treat those glosses.
- id: motif:2
  label: Wine as mystical or ethical counsel
  taxonomy_refs:
  - wisdom
  - mystical_quest
  basis: Wine is repeatedly recommended over worldly cares, hypocrisy, and anxious
    devotion, and is paired with counsel attributed to Khayyam and with the divine
    beloved.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:12
  - ev:15
  confidence: medium
  cautions: The passage uses wine language literally and symbolically; classification
    as mystical quest should remain cautious.
- id: motif:3
  label: Cosmic wheel and impermanent fortune
  taxonomy_refs: []
  basis: The Wheel of Heaven and periodic time are described as unstable powers that
    distribute favors and cause grief, while the speaker advises detachment and present
    joy.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:8
  confidence: medium
  cautions: No available taxonomy family directly names fate, fortune, or cosmic wheel.
- id: motif:4
  label: Universe as unified body
  taxonomy_refs: []
  basis: The passage identifies justice as the universe's soul and maps angels, heavens,
    and creatures onto body functions, then calls this eternal unity.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: Although the language of unity is explicit, the passage does not describe
    a narrative of union or annihilation.
- id: motif:5
  label: Hidden voice denying ordinary paths
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: Seekers move among belief, doubt, and certainty, but a voice behind a veil
    says the way sought is neither here nor there.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is an aphoristic scene, not a full journey narrative.
- id: motif:6
  label: Afterlife inversion for lovers and drinkers
  taxonomy_refs: []
  basis: The passage says that if Hell exists for lovers and drinkers, no one would
    wish for Paradise, and elsewhere says none who appear in the world are seen to
    come back.
  evidence_refs:
  - ev:15
  - ev:16
  confidence: medium
  cautions: The passage mentions Hell and Paradise rhetorically rather than narrating
    judgment or an afterlife journey.
- id: motif:7
  label: Imagined destruction and recreation of humanity
  taxonomy_refs: []
  basis: The speaker imagines holding God's power, destroying the people of the world,
    and making others who could attain their desires.
  evidence_refs:
  - ev:13
  confidence: low
  cautions: No world-destroying fire or explicit renewal cycle is described; this
    is a hypothetical utterance rather than a developed mythic episode.
