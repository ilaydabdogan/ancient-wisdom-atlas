  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage criticizes those who adore the prayer-rug and says devotees and
    hypocrites preach piety while being worse than idolaters.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker asks that, after the tree of existence is cut down and the members
