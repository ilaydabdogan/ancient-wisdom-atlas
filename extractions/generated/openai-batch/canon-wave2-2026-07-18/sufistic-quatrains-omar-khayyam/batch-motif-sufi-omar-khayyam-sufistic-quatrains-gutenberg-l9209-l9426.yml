canonical_text:
  quote: ''
  summary: A sequence of attributed quatrains and notes treats wine, religious law,
    mystical self-loss, divine will, death, beauty imagery, Jamshid's world-reflecting
    bowl, chess-courtship imagery, the dread day of doom, detachment from worldly
    and otherworldly concerns, fortune's wheel, and advice to join revellers while
    remaining kind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker asks Mustafa why pure wine is forbidden while acid whey is allowed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A reply addressed to Khayyam says wine is lawful for the wise but not for
    fools.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker denies being properly called a philosopher and says he does not
    know what he is or why he is a sojourner on earth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker says that dying to self increases life, abasement makes him soar
    higher, and drinking Being's wine makes him more sane and sober.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A rose speaks, calls itself the Yusuf flower, points to golden gems in its
    mouth, and presents its blood-stained vesture as proof.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker says he studied with masters, mastered their knowledge, came from
    earth, and goes like the wind.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A quatrain says death finds humans soiled though pure at birth, watered with
    tears, burned with fires of woe, and finally resting in earth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The speaker searches sea and land for Jamshid's world-reflecting bowl, but
    a wary sage says the bowl is the speaker's own body and soul.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A cruel Queen is addressed as one who captivates the speaker, translates him
