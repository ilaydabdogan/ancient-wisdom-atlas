  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The speaker says he cannot endure the world without wine and cups and is enslaved
    to the moment when another goblet is offered.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: A human addressee is warned not to pursue the world day and night while avoiding
