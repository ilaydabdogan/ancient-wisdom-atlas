candidate_motifs:
- id: motif:1
  label: Wine as wisdom and mystical sobriety
  taxonomy_refs:
  - wisdom
  basis: The passage distinguishes wine as lawful for the wise but not fools, speaks
    of Being's wine making the speaker more sober, and names the Etern Cupbearer's
    wine as freeing the addressee from both worlds.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:14
  confidence: high
  cautions: The passage includes both legal-satirical and mystical uses of wine; the
    evidence supports the repeated wine pattern but not a single exclusive meaning.
- id: motif:2
  label: Dying to self and existence from Him
  taxonomy_refs:
  - annihilation_union
  basis: The speaker says he lives more as he dies to self and says his being is not
    himself but of Him; an editorial note calls quatrain 351 clearly mystical.
  evidence_refs:
  - ev:4
  - ev:11
  confidence: high
  cautions: The passage states self-negation and divine derivation but does not narrate
    a full union episode.
- id: motif:3
  label: Outer quest reveals inner world-reflecting vessel
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: The speaker searches sea and land for Jamshid's bowl, but the sage identifies
    it as the speaker's own body and soul; the note glosses this as microcosm.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The microcosm interpretation is explicitly supplied by the editorial note
    rather than only by the quatrain.
- id: motif:4
  label: Death as return to elements
  taxonomy_refs: []
  basis: The speaker says he came from earth and goes like wind, and another quatrain
    describes tears, fires of woe, and resting in earth.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage emphasizes death and dissolution, not resurrection or rebirth.
- id: motif:5
  label: Flower proves beloved beauty through Yusuf imagery
  taxonomy_refs: []
  basis: The rose claims to be the Yusuf flower and offers visible signs; the note
    identifies Yusuf as a type of manly beauty and compares the imagery to Jami.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: This is a compact lyric image rather than a developed mythic narrative.
- id: motif:6
  label: Divine determination of human will
  taxonomy_refs: []
  basis: The speaker argues that he cannot will aright unless Allah wills it, because
    only Allah has power to will aright.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage frames the issue as a theological argument, not as a plotted
    mythic episode.
- id: motif:7
  label: Warning of final doom
  taxonomy_refs:
  - divine_judgment
  basis: The addressee is told not to avoid thought of the dread day of doom and to
    consider the latter end.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage names doom but does not describe judgment procedures, judges,
    or afterlife geography.
- id: motif:8
  label: Freedom from troubles of both worlds
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: The addressee is told to drink the Etern Cupbearer's wine and thereby become
    free from troubles of both worlds; the note relates this to rejecting worldliness
    and other-worldliness for disinterested godliness.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The doctrinal framing is largely in the editorial note.
- id: motif:9
  label: Fortune's revolving wheel
  taxonomy_refs: []
  basis: The passage refers to an eternally revolving zone, fortune's passing favors,
    and heaven's treacherous wheel playing games.
  evidence_refs:
  - ev:15
  - ev:17
  confidence: medium
  cautions: The wheel is a recurring image in the quatrains, but the passage does
    not personify it into a full mythic agent.
- id: motif:10
  label: Antinomian revelling joined to kindness
  taxonomy_refs: []
  basis: The final advice tells the hearer to consort with revellers, cast down abstinence
    and prayer, drink and even rob, yet be kind.
  evidence_refs:
  - ev:18
  confidence: medium
  cautions: The passage presents paradoxical ethical advice; it does not identify
    a trickster figure or ritual setting.
comparison_claims:
- id: claim:1
  claim: The editorial note explicitly compares King Jamshid's world-reflecting cup
    to the Holy Grail of Persian poetry, suggesting a shared function as a wondrous
    revelatory vessel.
  claim_level: same_function
  target: Holy Grail as a poetic analogue for Jamshid's world-reflecting cup
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an editorial literary analogy within the passage, not evidence
    of historical contact or direct borrowing.
- id: claim:2
  claim: The editorial note links the rose's Yusuf imagery to Jami's Yusuf wa Zulaikha,
    supporting a cautious intertextual comparison of the flower's beauty signs with
    Yusuf's beauty tradition.
  claim_level: visual_similarity
  target: Jami, Yusuf wa Zulaikha
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The note gives a literary comparison, but the passage does not quote
    Jami or detail the parallel beyond teeth/stamens and Yusuf as beauty type.
- id: claim:3
  claim: The editorial note reports Fitzgerald's comparison between the line about
    going like the wind and Nizam ul-Mulk's dying exclamation as cited from Mantik
    ut Tair.
  claim_level: linguistic_similarity
  target: Nizam ul-Mulk's dying exclamation in Mantik ut Tair
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: low
  limitations: The comparison is secondhand through the note and rests on a brief
    phrase rather than a shared narrative structure.
- id: claim:4
  claim: The note compares the quatrain's release from troubles of both worlds to
    Sufi disinterested godliness and to Madame Guyon's Holy Indifference.
  claim_level: same_function
  target: Holy Indifference as a comparative mystical-detachment pattern
  evidence_refs:
  - ev:14
  counter_evidence_refs: []
  confidence: low
  limitations: The comparison crosses traditions and is editorial; the quatrain itself
    only names freedom from both worlds through the Etern Cupbearer's wine.
