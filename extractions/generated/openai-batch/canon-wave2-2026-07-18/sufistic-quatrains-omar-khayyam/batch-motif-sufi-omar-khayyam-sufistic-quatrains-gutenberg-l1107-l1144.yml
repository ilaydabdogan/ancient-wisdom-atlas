canonical_text:
  quote: ''
  summary: Five quatrains contrast former royal or beloved human lives with present
    animal occupation, burial, plant growth, drinking, and silent rest. Jamshyd’s
    courts are kept by lion and lizard; Bahram lies asleep while a wild ass stamps
    above him. Roses, hyacinths, and herbs are imagined as growing from buried or
    once-lovely human bodies. The speaker urges the Beloved to fill the Cup for today,
    while noting that loved ones have already drunk and gone silently to rest.
  language: English
  quote_policy: summarized
