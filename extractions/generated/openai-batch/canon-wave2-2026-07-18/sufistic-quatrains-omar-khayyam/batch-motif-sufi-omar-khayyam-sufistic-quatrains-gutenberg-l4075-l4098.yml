  summary: A speaker reports that some people describe a figure who threatens to cast
    unlucky, flawed pots into Hell, but the speaker dismisses the threat and expects
    all to be well. Editorial notes link this quatrain, and possibly No. 86, to verses
    asking why a divine Director would create and then disperse forms, and to verses
    saying that resurrection will involve searching but that the excellent Friend,
    identified with unalloyed goodness, will make the outcome right.
