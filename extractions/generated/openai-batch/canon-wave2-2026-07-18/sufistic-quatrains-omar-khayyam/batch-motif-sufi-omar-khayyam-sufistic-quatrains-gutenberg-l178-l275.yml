canonical_text:
  quote: ''
  summary: The passage gives an introductory biographical account of Omar Khayyam
    from Shahrazuri and later editorial commentary. It presents Omar as a Nishapuri
    scholar, philosopher, authority on Koran readings, master of mathematics and philosophy,
    and a reserved figure connected with Avicenna, Ghazzali, rulers, and later Sufi
    reception. It narrates scenes of scholarly consultation, a visit to the ill child
    Sultan Sanjar, Omar's death while studying Avicenna's Book of Healing and praying
    to God, and later interpretation of him as a Sufistic mystic, critic of hypocrisy,
    and figure read beside other Sufi mystics.
  language: English
  quote_policy: summarized
