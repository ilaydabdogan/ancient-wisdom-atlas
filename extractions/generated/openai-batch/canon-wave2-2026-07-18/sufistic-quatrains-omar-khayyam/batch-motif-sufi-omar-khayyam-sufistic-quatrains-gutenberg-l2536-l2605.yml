  summary: The passage presents four analyzed quatrains and their cited originals.
    A ruined royal court or palace is now occupied by animals, while Bahram the hunter
    is overtaken by death. Garden flowers and riverbank verdure are imagined as arising
    from the blood or remains of dead rulers and beautiful persons. The speaker urges
    gentle contact with the grass and asks the beloved or friend to fill the cup and
    use the present before death and equality with the ancient dead.
