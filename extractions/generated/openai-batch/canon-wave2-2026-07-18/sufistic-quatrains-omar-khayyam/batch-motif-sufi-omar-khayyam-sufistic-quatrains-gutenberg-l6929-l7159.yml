- id: ev:20
  type: summary
  locator: quatrain 150
  quote_or_summary: The world will last after Khayyam's fame and name pass away; before
    he existed none heeded, and after death it will be the same.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:21
  type: summary
  locator: quatrain 151
  quote_or_summary: Sages who travel sea and land to search out a secret are doubted
