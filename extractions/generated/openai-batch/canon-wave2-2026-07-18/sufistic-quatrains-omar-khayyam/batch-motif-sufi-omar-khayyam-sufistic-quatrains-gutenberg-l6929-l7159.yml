  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:22
  type: summary
  locator: quatrain 152
  quote_or_summary: Wealth takes wings, death tears hearts, and none escapes from
    the nether world to bring news of the poor pilgrims there.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:23
  type: summary
  locator: quatrain 153
  quote_or_summary: Titled noblemen find their own lives burdensome but scarcely reckon
