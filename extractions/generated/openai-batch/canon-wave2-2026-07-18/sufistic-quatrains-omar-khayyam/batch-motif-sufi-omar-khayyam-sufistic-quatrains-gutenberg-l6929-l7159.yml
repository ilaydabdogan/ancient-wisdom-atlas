candidate_motifs:
- id: motif:1
  label: Sacred or paradisal wine contrasted with earthly prohibition
  taxonomy_refs: []
  basis: The passage repeatedly names wine as the desired drink, identifies Kausar
    as a river of wine in Paradise, and asks why earthly wine is vice if Allah promises
    wine in Paradise.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:19
  - ev:24
  confidence: high
  cautions: The taxonomy list has no specific wine motif; the extraction preserves
    the passage's own imagery without assigning an external wine taxonomy.
- id: motif:2
  label: Rejection of book-learning for immediate experiential pleasure
  taxonomy_refs:
  - wisdom
  basis: The speaker commands turning from learning to the cup, later says old wisdom
    shows life is spent and lore is nothing, and presents sages as unable to solve
    divine or cosmic mysteries.
  evidence_refs:
  - ev:2
  - ev:12
  - ev:17
  - ev:21
  confidence: medium
  cautions: The passage criticizes learning and displays wisdom-language; the exact
    taxonomy relation to 'wisdom' is broad rather than exact.
- id: motif:3
  label: Mortality and the vanishing of fame
  taxonomy_refs: []
  basis: Quatrains describe life passing, future moons continuing after death, burial
    in clay, and Khayyam's name and fame disappearing.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:20
  confidence: high
  cautions: The passage emphasizes death and impermanence but does not present rebirth
    or resurrection.
- id: motif:4
  label: Divine agency, fate, and moral responsibility
  taxonomy_refs:
  - divine_judgment
  basis: God is identified as the only real agent; Allah fixes the speaker's lot in
    fate; another quatrain distinguishes God's prescience from causing sin; the speaker
    seeks pardon for sin.
  evidence_refs:
  - ev:1
  - ev:11
  - ev:14
  - ev:16
  confidence: medium
  cautions: The passage raises divine agency and sin, but it does not narrate a formal
    judgment scene.
- id: motif:5
  label: Ascent toward heaven that fails to achieve knowledge of God
  taxonomy_refs:
  - ascent
  - mystical_quest
  basis: Sages' thoughts are raised like Borak toward heaven, but they strive in vain
    to know God and become dazed.
  evidence_refs:
  - ev:17
  - ev:18
  confidence: medium
  cautions: The ascent occurs as simile and intellectual aspiration, not as a full
    narrated journey by the sages.
- id: motif:6
  label: Afterlife realm from which no traveler returns with news
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage says none escapes from the nether world to bring news of the
    poor pilgrims there, while other quatrains mention Paradise wine.
  evidence_refs:
  - ev:3
  - ev:19
  - ev:22
  confidence: medium
  cautions: The passage names afterlife places but does not provide a detailed map
    or journey itinerary.
- id: motif:7
  label: Repentant servant seeking lordly pardon
  taxonomy_refs:
  - divine_judgment
  basis: The speaker recalls sins and asks whether a repentant slave should be pardoned
    and treated kindly by his lord.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: The slave and lord may be metaphorical; the passage does not explicitly
    identify the lord in this quatrain as God.
- id: motif:8
  label: World as deceiver
  taxonomy_refs: []
  basis: The world is described as insidious and full of tricks and guiles, and hearers
    are warned not to be beguiled by it.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The image is brief and not attached to a named mythic deceiver figure.
comparison_claims:
- id: claim:1
  claim: The note on Borak explicitly links the quatrain's heavenward imagery to the
    Islamic Mi'raj tradition of Muhammad's nocturnal ascent.
  claim_level: same_function
  target: Islamic Mi'raj / ascent-to-heaven tradition
  evidence_refs:
  - ev:17
  - ev:18
  counter_evidence_refs: []
  confidence: high
  limitations: The quatrain uses Borak as a simile for sages' thoughts rather than
    narrating Muhammad's ascent itself.
- id: claim:2
  claim: The editor's note compares the complaint against the world-founder with a
    passage from Job, suggesting a shared protest pattern directed toward the divine
    maker.
  claim_level: same_function
  target: Joban complaint against divine oppression
  evidence_refs:
  - ev:8
  - ev:25
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is editorial and limited to a cited parallel, not an
    argued historical relationship.
- id: claim:3
  claim: The note on the Turki maid explicitly connects the beloved imagery to Hafiz's
    well-known Turki maid of Shiraz line, indicating a nearby Persian lyric convention.
  claim_level: visual_similarity
  target: Hafiz's Turki maid lyric convention
