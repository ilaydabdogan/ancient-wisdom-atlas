  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; short excerpt quoted.
- id: ev:4
  type: summary
  locator: quatrain 133
  quote_or_summary: The speaker asks what profit or fruit remains from life and what
    use Jamshid's goblet has once crushed or pleasure's torch once its light has waned.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: quatrain 134
  quote_or_summary: The speaker asks what Balkh or Nishapur matter when life is spent
    and says many moons will wax and wane after the present people are gone.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: quatrain 135
  quote_or_summary: A fair figure's cheeks are compared to red eglantine; one glance
    against the king of Babil takes his pawns, knights, rooks, and queen.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: quatrain 136
  quote_or_summary: Life's caravan hastens; hearers are told not to brood on coming
    troubles but to fill the wine-cup before night passes.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: quatrain 137
  quote_or_summary: The one who laid the world's foundations bruises many bosoms and
    buries ruby lips and musky tresses in earth and clay.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: quatrain 138
  quote_or_summary: The world is called insidious and deceptive; hearers are told
    not to waste life but to seek wine and a sweetheart's smile.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: quatrain 139
  quote_or_summary: The speaker asks comrades to treat him with wine, make his pale
    face ruby-like, wash his corpse with wine, and build a coffin from vine planks.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: quatrain 140
  quote_or_summary: Allah yokes the sun's courses and launches the Pleiades; the speaker
    says his lot was fixed in fate's chancery and asks why he is blamed for fate's
    wrong.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: quatrain 142
  quote_or_summary: The speaker once thought he had answers to all life's problems,
    but in age sees that life is spent and lore is nothing.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: quatrain 143
  quote_or_summary: Those who display prayer-mats are called fools under hypocrisy's
    sway, living like heathen beneath saintly show and betraying faith.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: quote
  locator: quatrain 144
  quote_or_summary: '"To call God''s prescience the cause of sin / In wisdom''s purview
    is but folly''s prate."'
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; short excerpt quoted.
- id: ev:15
  type: summary
  locator: quatrain 145
  quote_or_summary: The speaker says he was brought here, gathers only a dark surmise
    from life, and goes against his will, leaving coming, living, and going as mysteries.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: quatrain 146
  quote_or_summary: Recalling sins burns the speaker's breast and blinds his vision
    with tears; he asks whether a lord should pardon a repentant slave.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: quatrain 147
  quote_or_summary: World-amazing learned ones raise high thoughts like Borak to heaven
    but strive in vain to know God; like heaven's wheel, their heads turn and brains
    are dazed.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: quatrain 147 note
