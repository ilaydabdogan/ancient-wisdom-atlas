canonical_text:
  quote: ''
  summary: A sequence of quatrains and notes presents wine, the cup, Paradise wine,
    fate, divine agency, mortality, failed learning, repentance, hypocritical piety,
    beloved beauty, and the unknowability of God and the universe. The passage also
    includes notes identifying Kausar as the river of wine in Paradise, Borak as Muhammad's
    ascent steed, and allusions to Job, Hafiz, and Hamzah.
