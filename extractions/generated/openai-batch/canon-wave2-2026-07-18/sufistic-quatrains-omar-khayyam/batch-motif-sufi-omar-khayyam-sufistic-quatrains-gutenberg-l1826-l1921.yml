  text: The stated purpose of the volume is to determine whether FitzGerald's poem
    is a translation of Persian originals, an adaptation, or an original work.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The preface refers to prior discussion of the history of FitzGerald's poem
    and Oriental works traceable in it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Doubts about FitzGerald's liberties with the original are attributed to the
    changing circumstances of the source materials he used for the first edition.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Prof. Cowell made or obtained copies of the Ouseley manuscript and a Bengal
