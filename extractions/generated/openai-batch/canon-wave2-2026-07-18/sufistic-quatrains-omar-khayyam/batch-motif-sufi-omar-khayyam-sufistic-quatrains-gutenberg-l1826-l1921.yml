canonical_text:
  quote: ''
  summary: Edward Heron-Allen introduces an analysis intended to settle how far Edward
    FitzGerald's Rubaiyat may be regarded as translation, adaptation, or original
    work. He summarizes the textual materials FitzGerald used, including the Ouseley
    manuscript, a Calcutta manuscript, and a rare 1836 Calcutta printed edition; recounts
    the loss of the Calcutta manuscript and the recovery of the printed edition in
    Calcutta; and identifies unresolved questions about marginal and appended quatrains.
  language: English
  quote_policy: summarized
