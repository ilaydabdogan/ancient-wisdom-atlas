canonical_text:
  quote: ''
  summary: A sequence of quatrains addresses wine, the beloved or divine Thou, tavern
    and mosque, wisdom and ignorance, transience, annihilation, the hidden fate of
    the dead, ascent toward a higher world, divine mercy, and the vanished glory of
    Kai-Kawous represented by a skull questioned by a bird.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker names every day of the week as a day when wine rejoices the soul.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker addresses an enticing being, mentions a fire of torments, and
    compares the prohibition against looking with the contradiction of inclining a
    cup while forbidding its contents to spill.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says it is better to be with the addressed Thou in a tavern and
    tell secret thoughts than to go without Thou and pray in a mosque.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker advises consorting with intelligent people and fleeing from the
    ignorant, even preferring poison from a person of mind to an antidote from an
    ignorant person.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Clouds are described as spread over roses like a veil, and the soul is urged
    to drink wine while the sun remains on the horizon.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker compares himself to a sparrow-hawk flying from a world of mysteries
    toward a higher world, but says he falls below and exits by the door through which
    he entered.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker says the addressed Thou has placed an irresistible passion in
    human beings while also forbidding them to yield to it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Those who have gone away are said not to have returned to disclose secrets
    hidden behind a curtain.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
  - ev:13
- id: obs:9
  text: Humility is presented as the effective condition for spiritual affairs, while
    prayer without sincerity and humility is questioned.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The speaker describes himself as lacking the pearl of submission on a necklace
    of duty, yet still hoping to reach the sill of the throne of pity.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Human beings are described as puppets and playthings of the Wheel of Heaven
    on a human checkerboard, eventually entering the coffin of annihilation one by
    one.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: The things of this lower world are described as a fantastic image emerging
    from a vast sea and later re-entering that sea.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: The speaker says that, in love and inebriation within the temple of idols,
    they will be separate from their being and attain the step of the eternal throne.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: At dawn, the addressed Source of all Delight is urged to rise, drink wine,
    and listen to the harp because sleepers' lives are brief and none of the dead
    return.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:15
  text: God is addressed as knower of hidden heart-secrets, raiser of those who fall
    in distress, giver of renunciation, and accepter of excuses.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:16
  text: A bird is seen hovering before the skull of Kai-Kawous on the city walls of
    Thous and asking what has become of the noise of his glory and clarion.
  category: action
  evidence_refs:
  - ev:17
- id: obs:17
  text: The speaker counsels against questioning worldly vicissitudes, the past, or
    the future, and urges attention to the present moment.
  category: speech
  evidence_refs:
  - ev:18
- id: obs:18
  text: The speaker warns against putting on the mantle of hypocrisy and contrasts
    the instant of this world with the empire of eternity.
  category: speech
  evidence_refs:
  - ev:20
