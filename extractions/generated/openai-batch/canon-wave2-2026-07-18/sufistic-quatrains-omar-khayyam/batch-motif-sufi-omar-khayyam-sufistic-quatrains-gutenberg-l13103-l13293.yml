candidate_motifs:
- id: motif:1
  label: wine-tavern devotion over formal prayer
  taxonomy_refs:
  - divine_beloved
  - mystical_quest
  basis: The passage repeatedly joins wine imagery with address to the Creator or
    divine Thou and states that being with Thou in the tavern is better than praying
    without Thou in the mosque.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:13
  - ev:15
  confidence: medium
  cautions: The passage does not explicitly state whether wine, tavern, and beloved
    are literal, allegorical, or both; interpretation should remain cautious.
- id: motif:2
  label: contradictory divine command and human passion
  taxonomy_refs:
  - duality
  basis: The speaker says the divine Thou placed irresistible passion in humans while
    prohibiting them from yielding to it, using cup-and-spilling images to express
    contradiction.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: medium
  cautions: The available taxonomy has no exact determinism/free-will category; duality
    is only a broad fit.
- id: motif:3
  label: ascent from lower world toward higher world
  taxonomy_refs:
  - ascent
  - mystical_quest
  - departure
  basis: The speaker compares himself to a sparrow-hawk trying to fly away from this
    world of mysteries to a higher world, and another quatrain speaks of attaining
    the step of the eternal throne.
  evidence_refs:
  - ev:6
  - ev:13
  confidence: high
  cautions: The ascent is framed as hoped-for or visionary, and the sparrow-hawk image
    includes failure or fall below.
- id: motif:4
  label: no return of the dead from hidden secrets
  taxonomy_refs: []
  basis: Several quatrains state that those who have gone away do not return, and
    one says they do not disclose the secrets concealed behind the curtain.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:15
  confidence: high
  cautions: The passage emphasizes non-return and secrecy rather than providing an
    afterlife journey map.
- id: motif:5
  label: humans as cosmic puppets and playthings
  taxonomy_refs: []
  basis: The passage explicitly describes humans as puppets and playthings of the
    Wheel of Heaven on a human checkerboard, ending in the coffin of annihilation.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: No supplied motif-family reference exactly matches cosmic play, fate,
    or determinism.
- id: motif:6
  label: world-image emerging from and returning to a vast sea
  taxonomy_refs:
  - annihilation_union
  basis: Worldly things are called a fantastic image that comes out of a vast sea
    and later re-enters the same sea.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage supports emergence and return, but the specific metaphysical
    meaning of the sea is not explained in the excerpt.
- id: motif:7
  label: memento mori of vanished royal glory
  taxonomy_refs:
  - wisdom
  basis: A bird questions the skull of Kai-Kawous about the disappearance of his glory
    and clarion, presenting royal power as transient.
  evidence_refs:
  - ev:17
  confidence: high
  cautions: The passage does not narrate Kai-Kawous's life; only his skull and lost
    glory are present.
- id: motif:8
  label: present-moment wisdom against anxiety and hypocrisy
  taxonomy_refs:
  - wisdom
  basis: The speaker advises not to question past or future, to value present pleasure,
    to avoid hypocrisy, and not to sell eternity for the instant of this world.
  evidence_refs:
  - ev:18
  - ev:19
  - ev:20
  confidence: high
  cautions: This is ethical and reflective counsel rather than a narrative mythic
    episode.
