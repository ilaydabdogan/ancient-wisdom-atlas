canonical_text:
  quote: ''
  summary: The passage explains perceived inconsistencies in Omar Khayyam's poetry
    through his theological education, Islamic predestination debates, Persian philosophical
    and mystical influences, and comparisons with Ecclesiastes, Lucretius, and Voltaire.
    It emphasizes the conception of God as the only real agent, the problem of evil,
    predestination, skepticism, mysticism, resurrection, charity, and religious emotion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Omar is described as having studied in youth under the Suni theologian Imam
    Muaffik and as having been indoctrinated with the conception of the One God, called
    the Only Real Agent.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a theology dominated by Almighty Power leaves no room
    for Nature, human will, chance, or any other Ahriman to bear responsibility for
    evils such as storms, earthquakes, and wicked people.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Book of Job is cited as addressing bold complaints to the Deity over a
    righteous man's undeserved misfortunes and as ending in resignation before inscrutable
    Providence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ecclesiastes is described as saying that one event comes to all, that injustice
    and wrong appear triumphant, and as concluding at different points in favor of
    carpe diem and fear of the Lord.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that Ecclesiastes and Omar resemble one another in having
    double and contradictory practical conclusions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: After Islam was established, Moslem theologians are said to have been troubled
    by the existence of evil in the handiwork of the Almighty Author and Governor
    of all.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The discussion of predestination includes divine prescience, the predestination
    of some vessels to honour and others to dishonour, and mechanical necessity called
    Jabr.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: Omar is said to dwell constantly on predestination and to be affected by it
    in a double way.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Omar is described as born in Khorassan, familiar with Moslem philosophers,
    probably affected by mysticism, and not necessarily affiliated with a Sufi order.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage says Omar's philosophical studies would stimulate skeptical and
    irreligious dispositions, while his Mystic leanings would act in the contrary
    direction.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage rejects a parallel between Omar and Lucretius, saying Omar was
    not an atheist and that the conception of laws of nature was foreign to his habits
    of thought.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage compares Omar with Voltaire in flippancy, irreverence, and concern
    for kindness and charity, but distinguishes Omar by his strong religious emotions
    and devotional and Mystical quatrains.
  category: relationship
  evidence_refs:
  - ev:6
