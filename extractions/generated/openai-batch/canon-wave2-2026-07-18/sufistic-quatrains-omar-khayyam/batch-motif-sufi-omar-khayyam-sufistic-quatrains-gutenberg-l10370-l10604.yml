canonical_text:
  quote: ''
  summary: A sequence of quatrains presents paradise imagery, counsel on endurance
    and solitude, reflections on mortality, wine and cupbearer imagery, divine causality,
    a potter transforming human remains into vessels, a dialogue between a Shaikh
    and a harlot, ethical maxims about love and compassion, and allusions to Noah,
    Khizr, Elias, the Qur'an, Job, the Vulgate, and Sufi mystical interpretation in
    editorial notes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Verdure and crystal Kausars appear where the speaker looks, and formerly barren
    plains are described as smiling like heaven with maids of Paradise.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage advises not relying on friends in the false world, enduring grief,
    and asking no sympathy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Two principal dictates of wisdom are stated: fasting is better than eating
    every meat, and living alone is better than mating with all.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker asks about unripe grapes becoming sweet, wine becoming sharp again,
    and whether one carved block can become both lute and pipe.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: At dawn a bird cries; the cry is explained as showing in dawn's looking-glass
    that a night of careless life has passed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A cupbearer is summoned to pour blood-red wine as a cure for the world's despite.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sages and rulers such as Aristo, Caesar, Jemshid, and Bahram are said to end
    in the tomb.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In a potter's shop, a potter turns his wheel and makes pitcher heads and handles
    from monarchs' heads and beggars' feet.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The speaker says true senselessness must be attained by draining the Etern
    Cupbearer's goblet, and not every fool can gain it.
  category: speech
  evidence_refs:
  - ev:9
  - ev:26
- id: obs:10
  text: Before death's portal and before potters make jugs from the speaker and Love,
    the speaker asks that wine be poured from a jug into cups.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Love is asked to lift sorrow's burden from the lover's heart while Love's
    graces remain.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Death is figured as a cup that will flow, and the addressee is urged to acquire
    substance here because there is none there for the empty-handed.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The speaker addresses Thou as the one who framed the lots of quick and dead,
    turns heaven's wheel, created sinful slaves, and is questioned about blame.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: The speaker wishes to drench the body with wine so that passers-by might mistake
    the speaker for wine.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: A Shaikh accuses a harlot of being a slave to drink and lechery; she replies
    that she is what she seems and asks whether he is all he seems to be.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: When drunk, the speaker would value the whole earth at a barley-corn, and
    a vintner refuses the speaker as a pledge for wine.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: Thou is described as hiding a face in clouds, displaying it in the universe,
    and being both spectator and spectacle.
  category: speech
  evidence_refs:
  - ev:17
  - ev:28
- id: obs:18
  text: Making one soul rejoice is preferred to planting a desert with a colony, and
    binding one freeman with chains of love is preferred to freeing a thousand captives.
  category: speech
  evidence_refs:
  - ev:18
- id: obs:19
  text: A person who gives sorrow to another's heart is told that he has slain his
    own wit and peace of mind.
  category: speech
  evidence_refs:
  - ev:19
- id: obs:20
  text: Drinking two maunds of wine is said to free the spirit from saintly airs and
    grief.
  category: action
  evidence_refs:
  - ev:20
- id: obs:21
  text: Wine, wheat bread, mutton, and a tulip-cheeked companion in a hut are said
    to surpass a Sultan's lot.
  category: setting
  evidence_refs:
  - ev:21
- id: obs:22
  text: Even if one were Khizr or Elias, the passage advises knowing none and being
    known by none.
  category: speech
  evidence_refs:
  - ev:22
- id: obs:23
  text: The speaker says repentance has failed, rejects preaching about Noah and his
    flood, and asks instead for a flood of wine to drown pain.
  category: speech
  evidence_refs:
  - ev:23
