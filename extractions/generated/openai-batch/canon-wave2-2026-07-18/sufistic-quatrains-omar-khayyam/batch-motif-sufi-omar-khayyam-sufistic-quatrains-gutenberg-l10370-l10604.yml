  - ev:3
  - ev:22
  confidence: high
  cautions: ''
- id: motif:6
  label: beloved relieves sorrow and binds by love
  taxonomy_refs:
  - divine_beloved
  basis: Love is directly addressed as able to lift sorrow from the lover's heart,
    and chains of love are valued over freeing captives.
  evidence_refs:
