candidate_motifs:
- id: motif:1
  label: wine as consolation, liberation, and mystical cup
  taxonomy_refs:
  - mystical_quest
  basis: Wine is repeatedly requested to cure worldly pain, free the spirit, and is
    linked with the Etern Cupbearer's goblet and an editorial Qur'anic allusion to
    paradise wine.
  evidence_refs:
  - ev:6
  - ev:9
  - ev:20
  - ev:23
  - ev:27
  confidence: medium
  cautions: The passage often presents wine literally; mystical reading is supported
    by the edition's Sufistic framing and notes but should be reviewed.
- id: motif:2
  label: death equalizes and returns bodies to vessels
  taxonomy_refs:
  - death_rebirth
  basis: Sages, rulers, monarchs, and beggars all end in the tomb or become material
    for pottery; the speaker and Love are also imagined as future jugs.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  confidence: medium
  cautions: The evidence supports death and material transformation; it does not describe
    full resurrection or personal rebirth.
- id: motif:3
  label: divine creator questioned over human fault
  taxonomy_refs:
  - divine_judgment
  basis: The speaker addresses Thou as creator of humans and asks whether Thou can
    blame sinful slaves whom Thou created.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The quatrain raises blame and responsibility but does not present a formal
    judgment scene.
- id: motif:4
  label: divine self-disclosure as spectator and spectacle
  taxonomy_refs:
  - annihilation_union
  - duality
  basis: Thou is described as hiding and displaying a face in the universe and as
    both spectator and spectacle, sole to Thyself.
  evidence_refs:
  - ev:17
  - ev:28
  confidence: medium
  cautions: The nondual or union interpretation is implied by the language and editorial
    comparison, but the quatrain itself remains compact.
- id: motif:5
  label: wisdom through restraint, solitude, and endurance
  taxonomy_refs:
  - wisdom
  basis: The passage gives explicit wisdom maxims about fasting, solitude, enduring
    grief, not relying on friends, and remaining unknown.
  evidence_refs:
