  - ev:18
  - ev:21
  confidence: low
  cautions: The passage does not explicitly identify Love or the tulip-cheeked companion
    as divine; taxonomy assignment is tentative.
- id: motif:7
  label: flood transposed into wine
  taxonomy_refs:
  - flood_and_renewal
  basis: Noah's flood is explicitly rejected as preaching material, while the speaker
    requests a flood of wine to drown pain.
  evidence_refs:
  - ev:23
  confidence: low
  cautions: The flood image is allusive and inverted; renewal is not stated.
comparison_claims:
- id: claim:1
  claim: The dawn looking-glass image is explicitly compared in the note to Job's
    sky as a molten looking-glass.
  claim_level: visual_similarity
  target: Job's image of the sky as a molten looking-glass
  evidence_refs:
  - ev:5
  - ev:25
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim rests on the editor's brief note; no broader narrative equivalence
    is asserted.
- id: claim:2
  claim: The headache-free wine in the quatrain is explicitly noted as an allusion
    to the wine of Paradise in Qur'an lvi.17.
  claim_level: same_function
  target: Qur'anic wine of Paradise, Qur'an lvi.17
  evidence_refs:
  - ev:10
  - ev:27
  counter_evidence_refs: []
  confidence: high
  limitations: The note supports allusion to a textual detail, not a complete shared
    narrative.
- id: claim:3
  claim: The note connects true senselessness with the Sufi motif of mystical darkness
    of ignorance in Gulshan i Raz.
  claim_level: same_function
  target: Gulshan i Raz motif of mystical darkness of ignorance
  evidence_refs:
  - ev:9
  - ev:26
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is supplied by the editor and should be checked against
    the cited Sufi text.
- id: claim:4
  claim: The divine spectator-and-spectacle quatrain is explicitly compared by the
    note to the Vulgate phrase 'ludens in orbe terrarum' and to Gulshan i Raz.
  claim_level: same_function
  target: Vulgate 'ludens in orbe terrarum' and Gulshan i Raz divine play or self-display
    comparison
  evidence_refs:
  - ev:17
  - ev:28
  counter_evidence_refs: []
  confidence: medium
  limitations: The note gives a comparison but does not establish historical contact
    or direct borrowing.
- id: claim:5
  claim: The mention of Noah and his flood invokes the flood motif but reverses it
    into a request for a flood of wine.
  claim_level: same_motif
  target: Noah flood tradition
  evidence_refs:
  - ev:23
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage uses Noah's flood as a brief allusion and contrast, not
    as a retelling.
