canonical_text:
  quote: ''
  summary: Annotated quatrains 326-347 present a first-person poetic voice confronting
    fate, the world, grief, death, sin, reputation, religious identity, and divine
    mercy through recurring images of wine, taverns, prayer, clay, dust, the Koran,
    judgment-day, and humanity as a microcosm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker opposes fate's annoyances by consuming rosy wine and calls the
    world a murderer whose blood is wine.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker vows to cast away reputation for a divine addressee and to bear
    penalty until judgment-day.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speakers describe themselves as straying in the rondure of Being, humbled,
    weary of the world's griefs, and sated with its pleasures.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker calls the world false, chooses wine and gladness, and says he
    would rebel even if Allah granted penitence.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker imagines Death trampling and draining him, then asks to be molded
    into a cup filled with wine so its scent may make him breathe again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: At dawn the speaker says he will strengthen his heart with wine, shatter the
    glass of good repute, renounce long hopes, and grasp tresses and a lute.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker claims that even if he had sinned the sins of all mankind, the
    divine addressee would incline to mercy and help the neediest.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The speaker accepts possible labels such as wine-bibber, Gueber, and infidel,
    while rejecting sectarian misnaming and declaring himself his own.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The speaker says he has not ceased from drink, will drink on Kadr's feast,
    and will embrace and kiss the wine-jar.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The speaker claims knowledge of being and not-being, and of things above and
    below, but would renounce this lore if shown a higher grade than drink.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The speaker says he drinks wine but is not a libertine, rejects self-adoration,
    and inclines to wine-worship.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Mankind is described as molded of clay, kneaded in distress, tasting the world
    briefly, and passing away.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: The speakers make the wine-jar's lip their place of prayer, drink lessons
    of true manhood there, and pass their lives in taverns to repair time mis-spent
    in mosques.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Man is described as the whole creation's summary, the apple of wisdom's eye,
    and the signet of the ring of existence.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:15
  text: The speakers aspire to heaven while in flesh, but when the fleshly clog is
    dropped they are seen to have come from dust and to return to dust.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The speaker explains an apparent fast-breaking as unintended, saying he thought
    the weary day had ended and breakfast-time had arrived.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:17
  text: Joy and pleasure are described as repeatedly mixed with grief, gall, and sorrow.
  category: attribute
  evidence_refs:
  - ev:17
- id: obs:18
  text: At dawn the speaker goes to tavern haunts with distraught Kalendars and asks
    the divine knower for grace to learn to pray.
  category: sequence
  evidence_refs:
  - ev:18
- id: obs:19
  text: The speaker holds the Koran in one hand and a wine-cup in the other, inclines
