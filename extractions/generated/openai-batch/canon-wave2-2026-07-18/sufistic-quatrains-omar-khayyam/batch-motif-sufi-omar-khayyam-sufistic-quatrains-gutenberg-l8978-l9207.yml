candidate_motifs:
- id: motif:1
  label: wine as devotional or anti-reputational practice
  taxonomy_refs:
  - mystical_quest
  basis: Wine is repeatedly chosen over reputation, conventional learning, and mosque
    observance; the wine-jar's lip becomes a place of prayer, and the speaker asks
    for divine grace to learn to pray in tavern company.
  evidence_refs:
  - ev:6
  - ev:10
  - ev:11
  - ev:13
  - ev:18
  confidence: medium
  cautions: The passage often uses wine literally or provocatively; only one editorial
    note says a related quatrain is probably mystical, so the spiritual reading requires
    review.
- id: motif:2
  label: death transformed into vessel and possible renewed breath
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: After Death destroys the body, the speaker asks to be molded into a wine-filled
    cup whose scent may make him breathe again.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The quatrain presents a poetic wish or image; it does not state an achieved
    resurrection.
- id: motif:3
  label: humanity as microcosmic signet of existence
  taxonomy_refs:
  - wisdom
  basis: Man is described as creation's summary, wisdom's precious apple, and the
    signet of the ring of existence; the note explicitly says man is the microcosm.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The available taxonomy has no exact microcosm family; 'wisdom' is the
    closest supported reference.
- id: motif:4
  label: clay-and-dust mortality
  taxonomy_refs: []
  basis: Mankind is molded of clay and distress, tastes the world briefly, passes
    away, and returns to dust after the fleshly clog is dropped.
  evidence_refs:
  - ev:12
  - ev:15
  confidence: high
  cautions: This is a mortality motif rather than a clear death-rebirth pattern in
    these lines.
- id: motif:5
  label: sacred and transgressive dual identity
  taxonomy_refs:
  - duality
  basis: The speaker is miscalled by sects, may be named wine-bibber or infidel, and
    later stands with Koran in one hand and wine-cup in the other, half wrong and
    half right.
  evidence_refs:
  - ev:8
  - ev:19
  confidence: high
  cautions: The passage supports moral and religious doubleness, but not a full mythic
    twin or cosmic dualism.
- id: motif:6
  label: divine mercy despite sin and judgment
  taxonomy_refs:
  - divine_judgment
  basis: The speaker invokes judgment-day, penitence, sins of all mankind, divine
    mercy, help in need, and grace to learn to pray.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:7
  - ev:18
  confidence: high
  cautions: The judgment and mercy language is devotional and rhetorical; no narrative
