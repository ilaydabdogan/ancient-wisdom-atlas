candidate_motifs:
- id: motif:1
  label: Impermanence and present-focused counsel
  taxonomy_refs:
  - wisdom
  basis: Several quatrains emphasize that life passes quickly, the future is uncertain,
    and the past and future days should not trouble the speaker.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:19
  - ev:20
  confidence: high
  cautions: This is an aphoristic theme rather than a narrative motif.
- id: motif:2
  label: Hidden or inexpressible mystical knowledge
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: The passage says perfect love has its own language and that the speaker holds
    a secret and sees a place he can only describe, not unveil.
  evidence_refs:
  - ev:2
  - ev:11
  confidence: medium
  cautions: The passage does not narrate an actual quest; the motif is inferred from
    the stated hiddenness of knowledge and love.
- id: motif:3
  label: Wine as privileged state or counsel
  taxonomy_refs: []
  basis: Wine is repeatedly recommended by the speaker and by the old man, and an
    intermediate state between drunkenness and reason is praised as containing life.
  evidence_refs:
  - ev:3
  - ev:12
  - ev:14
  confidence: high
  cautions: The passage itself presents wine as drink and state; any further Sufi
    allegorical reading requires external interpretation and is not asserted here.
- id: motif:4
  label: Destiny overriding human effort
  taxonomy_refs:
  - wisdom
  basis: Destiny presents the available moves on the terrestrial chessboard, God imprints
    what should be, and destiny overturns the speaker's projects.
  evidence_refs:
  - ev:6
  - ev:10
  - ev:13
  - ev:20
  confidence: high
  cautions: No specific mythic episode is narrated.
- id: motif:5
  label: Human bodies transformed into clay, dust, and vessels
  taxonomy_refs:
  - death_rebirth
  basis: The jug is described as formerly a loving creature with an arm, and dust
    is said to have formed beautiful eyes.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The transformation is poetic and material; it does not explicitly describe
    personal rebirth.
- id: motif:6
  label: Plural sacred stations to one Deity
  taxonomy_refs: []
  basis: The passage groups temple of idols, Kaaba, bells, mehrab, church, chapel,
    and cross as forms or places of worship and homage to the Deity.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is an internal theological comparison within the quatrain, not evidence
    of historical contact among traditions.
- id: motif:7
  label: Absent beloved who wounds and preoccupies all
  taxonomy_refs:
  - divine_beloved
  basis: The capitalized addressee's absence is the thing that bruises deeply, and
    everyone may be preoccupied with that addressee.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: The passage capitalizes the addressee but does not explicitly identify
    the addressee as divine in this quatrain.
- id: motif:8
  label: Annihilation yielding immortality and revival
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The passage says a branch of immortality shoots up from annihilation and
    that the speaker's soul has been revived by the breath of Jesus.
  evidence_refs:
  - ev:18
  confidence: high
  cautions: The statement is doctrinal or poetic rather than a full resurrection narrative.
- id: motif:9
  label: Reversal of named opposites by their effects
  taxonomy_refs:
  - duality
  - wisdom
  basis: The quatrain reverses ordinary categories by treating faithful strangers
    as kin, betraying kin as enemies, curing poison as antidote, and harmful antidote
    as poison.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: This is a wisdom pattern, not a mythic plot.
