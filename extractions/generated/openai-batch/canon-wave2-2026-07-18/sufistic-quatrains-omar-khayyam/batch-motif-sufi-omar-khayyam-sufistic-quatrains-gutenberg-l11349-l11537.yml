  rights_note: Public domain Project Gutenberg text; summarized.
- id: ev:11
  type: summary
  locator: lines 11349-11537, quatrain 32
  quote_or_summary: The speaker can only vaguely tell a secret, cannot elaborate his
    thought, can only trace a description of a place he sees, and cannot unveil his
    secret.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain Project Gutenberg text; summarized.
- id: ev:12
  type: summary
  locator: lines 11349-11537, quatrain 33
  quote_or_summary: After false money is removed from a joyous dwelling, an old man
    returning from the tavern tells the speaker to drink wine because other lives
    will follow in the speaker's long sleep.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain Project Gutenberg text; summarized.
- id: ev:13
  type: summary
  locator: lines 11349-11537, quatrain 34
  quote_or_summary: The speaker says resignation alone avails before Providence's
    decrees, while seeming and hypocrisy avail among men; destiny overturns all his
    strongest projects.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain Project Gutenberg text; summarized.
- id: ev:14
  type: summary
  locator: lines 11349-11537, quatrain 40
  quote_or_summary: The listener is told to imitate the New-year tulip, take a cup,
    and drink wine with a fair girl if possible, because the blue wheel or dome can
    suddenly overturn a person.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain Project Gutenberg text; summarized.
- id: ev:15
  type: summary
  locator: lines 11349-11537, quatrain 35
  quote_or_summary: A faithful stranger is to be treated as kin, a betraying kinsman
    as enemy; poison that cures is an antidote, and an unsuitable antidote is poison.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain Project Gutenberg text; summarized.
- id: ev:16
  type: summary
  locator: lines 11349-11537, quatrain 36
  quote_or_summary: The capitalized addressee's absence alone can bruise deeply; no
    one acute is free from the addressee's charms, and all may be preoccupied with
    the addressee.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain Project Gutenberg text; summarized.
- id: ev:17
  type: summary
  locator: lines 11349-11537, quatrain 38
  quote_or_summary: The speaker asks whether the one who fashioned the cup would destroy
    it, and asks by what love beautiful heads, arms, and hands are created and by
    what hate destroyed.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain Project Gutenberg text; summarized.
- id: ev:18
  type: summary
  locator: lines 11349-11537, quatrain 39
  quote_or_summary: Fear of death and abhorrence of annihilation are attributed to
    ignorance; annihilation sends up a branch of immortality, and the speaker's soul
    has been revived by the breath of Jesus.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain Project Gutenberg text; summarized.
- id: ev:19
  type: summary
  locator: lines 11349-11537, quatrain 42
  quote_or_summary: Because the celestial wheel and destiny have not been favorable,
    it does not matter whether one counts seven heavens or eight; again, the past
    day and the not-yet-come day need not trouble the speaker.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain Project Gutenberg text; summarized.
- id: ev:20
  type: summary
  locator: lines 11349-11537, quatrain 41
  quote_or_summary: Since things do not happen as desired, the passage questions the
    purpose of designs and efforts, lamenting that arrival is too late and departure
