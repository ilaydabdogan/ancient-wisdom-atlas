canonical_text:
  quote: ''
  summary: A sequence of quatrains reflects on fleeting life, youth, wine, wounded
    heart and departing soul, destiny and predestination, human bodies becoming dust
    or vessels, religious places as stations of worship, hidden secrets of love, tavern
    counsel, reversals of poison and antidote, the absent beloved, creation and destruction,
    annihilation giving rise to immortality, and seasonal drinking under the unstable
    heavens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says a turn of existence passes quickly like wind over the desert
    and distinguishes the future day and the past day as not worth anxiety.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes a priceless ruby and rare pearl as having their own
    origin and character, and says perfect love is explained in a language of its
    own that is not conveyed to people.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker repeatedly counsels drinking wine in youth or happiness and connects
    wine with pleasure, altered awareness, and a state between drunkenness and reason.
  category: action
  evidence_refs:
  - ev:3
  - ev:14
- id: obs:4
  text: The speaker addresses the heart and soul, saying the heart is bruised by grief
    and the soul will finally leave the body.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker warns that the day after tomorrow cannot be counted on and urges
    not losing the present instant of life in inaction.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage compares life under destiny to moves presented on a chessboard
    of the terrestrial ball.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: An earthen jug is described as having once been a loving and unhappy creature,
    with its handle imagined as an amorous arm around a girl's neck.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Dust underfoot is said to have without doubt formed the eyes of someone young
    and fair.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The temple of idols, Kaaba, bells, mehrab, church, chapel, and cross are all
    described as places or means of homage to the Deity.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Existing things are said to have been predestined on the tablet of creation,
    and human efforts against destiny are described as lost.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The speaker says he can only vaguely tell a secret, cannot fully explain his
    thought, sees a place he can only describe, and possesses a secret he cannot unveil.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: An old man returning from the tavern tells the speaker to drink wine because
    other lives will follow in the speaker's long sleep.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The decrees of Providence are said to call for resignation, and destiny is
    said to overturn the speaker's projects despite every ruse.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: The passage advises treating a faithful stranger as kin and a betraying kinsman
    as an enemy; it also says a curing poison should be regarded as an antidote and
    a harmful antidote as poison.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:15
  text: A capitalized addressee's absence is described as the only thing that can
    bruise deeply, and all are said to be preoccupied with that addressee.
  category: relationship
  evidence_refs:
  - ev:16
- id: obs:16
  text: The speaker asks why the one who fashioned the cup would destroy it and asks
    by what love beautiful heads, arms, and hands are created and by what hate destroyed.
  category: speech
  evidence_refs:
  - ev:17
- id: obs:17
  text: Fear of death and abhorrence of annihilation are attributed to ignorance;
    from annihilation a branch of immortality is said to shoot up.
  category: attribute
  evidence_refs:
  - ev:18
- id: obs:18
  text: The speaker says his soul has been revived by the breath of Jesus and that
