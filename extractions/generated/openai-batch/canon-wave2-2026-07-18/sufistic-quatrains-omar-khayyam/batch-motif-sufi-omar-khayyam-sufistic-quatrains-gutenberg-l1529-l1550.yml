  quote: ''
  summary: The speaker says long-loved idols have damaged his public credit, honour,
    and reputation. He recalls repeated vows of repentance and questions whether he
    was sober when he made them. Spring arrives with a rose and tears apart his worn
    penitence. Wine is said to have acted faithlessly and robbed him of honour, yet
    the speaker wonders what vintners could buy as precious as the goods they sell.
