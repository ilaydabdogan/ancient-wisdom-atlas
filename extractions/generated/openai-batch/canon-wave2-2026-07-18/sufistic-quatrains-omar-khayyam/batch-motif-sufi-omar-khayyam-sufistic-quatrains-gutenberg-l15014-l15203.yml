candidate_motifs:
- id: motif:1
  label: drink and act before death or departure
  taxonomy_refs:
  - departure
  - wisdom
  basis: Multiple quatrains urge drinking, relieving grief, or establishing a foundation
    before death, time’s completion, unexpected calling, or forced departure.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:18
  confidence: high
  cautions: The passage emphasizes mortality and departure but does not present a
    full afterlife journey map or explicit rebirth sequence.
- id: motif:2
  label: divine beloved sought through longing and separation
  taxonomy_refs:
  - divine_beloved
  - mystical_quest
  basis: The addressed Thou is called master, creator, hidden and revealed in creation,
    and the well-beloved Divinity; the speaker cannot find a means to join Thee and
    cannot bear separation.
  evidence_refs:
  - ev:4
  - ev:11
  - ev:20
  - ev:21
  confidence: high
  cautions: The passage’s devotional reading is supported by the parenthetical identification
    of the well-beloved as the Divinity, but the surrounding wine and beloved language
    remains poetic and multivalent.
- id: motif:3
  label: identity confusion or union through wine
  taxonomy_refs:
  - annihilation_union
  basis: The speaker says that after drinking, observers would confuse his identity
    with wine, and another quatrain links drinking with doubt over whether the addressed
    presence is Thou.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The text gives literal identity-confusion language, but interpreting it
    as mystical annihilation is a candidate reading rather than a literal event.
- id: motif:4
  label: wine against ascetic warning and divine judgment
  taxonomy_refs:
  - divine_judgment
  basis: Warnings against drinking invoke torment, the day of reckoning, and burning
    as fire, but the speaker values wine-given joy above goods of this world and the
    next.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage reports and contests judgment warnings; it does not narrate
    an actual judgment scene.
- id: motif:5
  label: earthly garden joy preferred to Paradise
  taxonomy_refs: []
  basis: The speaker says a garden with wine and lute is preferable to Paradise with
    houris and Koocer.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No taxonomy reference is assigned because the available motif list has
    no direct garden-Paradise inversion category.
- id: motif:6
  label: human dust remade as vessel
  taxonomy_refs: []
  basis: The speaker imagines the potter making another pitcher from the dust of the
    speaker and addressee.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The line suggests mortality and material transformation but does not explicitly
    describe resurrection or rebirth.
- id: motif:7
  label: moral hypocrisy exposed by marginal figure
  taxonomy_refs:
  - wisdom
  basis: A prostitute, after being accused by a Sheikh, turns the challenge back by
    asking whether he is what he seems to be.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage is brief and does not develop a full trickster or reversal
    narrative.
- id: motif:8
  label: world as unstable small object
  taxonomy_refs: []
  basis: The entire world is compared to a bowl rolling in a hollow and to a barley
    grain unnoticed by the drunken sleeper.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The image is cosmological and satirical, but no listed taxonomy motif
    directly matches it.
- id: motif:9
  label: hidden and revealed creator as self-beholder
  taxonomy_refs:
  - wisdom
  basis: The addressed Thou is said to conceal and reveal itself in created things
    and to be both maker and beholder of the spectacle.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The motif label captures a theological pattern in the passage; the available
    taxonomy only broadly matches it as wisdom.
- id: motif:10
  label: renunciation rejected in favor of wine and divine presence
  taxonomy_refs:
  - mystical_quest
  - divine_beloved
  basis: The cupbearer is told that the speakers rejoice with wine in the presence
    of the well-beloved Divinity and do not offer the renunciation of Nessouh.
  evidence_refs:
  - ev:20
  confidence: medium
  cautions: The references to Nessouh and Noe are not explained in the passage, so
    the extraction does not infer their broader narrative context.
