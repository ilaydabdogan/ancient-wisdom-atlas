  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source metadata; excerpt summarized.
- id: ev:16
  type: summary
  locator: Quatrain 448, lines 15118-15123
  quote_or_summary: Bread, two mens of wine, plentiful meat, a desert spot, and a
    young beauty with tulip-tinted cheeks are described as joy not available to any
