- id: ev:10
  type: summary
  locator: Quatrain 442, lines 15076-15084
  quote_or_summary: The world is likened to a bowl rolling in a hollow and to a grain
    of barley unnoticed while the speaker slept dead drunk; the speaker says he pawned
