  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source metadata; excerpt summarized.
- id: ev:11
  type: summary
  locator: Quatrain 443, lines 15086-15091
  quote_or_summary: Thou is said sometimes to be concealed and sometimes revealed
    in all created things; Thou is both maker of the spectacle and Thine own beholder.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source metadata; excerpt summarized.
- id: ev:12
  type: summary
  locator: Quatrain 444, lines 15093-15097
  quote_or_summary: The passage states that peopling the whole earth would not gladden
    a saddened soul and that gently enslaving a free man would be more advantageous
