canonical_text:
  quote: ''
  summary: A sequence of quatrains addresses companions, a cupbearer, wine, and a
    divine or beloved Thou. The speaker repeatedly urges wine-drinking before death
    and departure, describes divine governance and hidden/revealed presence, stages
    a moral exchange between a Sheikh and a prostitute, imagines tavern pawnage and
    the world as a rolling bowl, and contrasts worldly joy, anonymity, and longing
    for union with warnings of judgment, destiny, and separation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An addressed “idol” is described as being on a journey through the world and
    is urged to draw wine from a fountain-head into a pitcher before a potter makes
    another pitcher from the dust of the speaker and addressee.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A friend is urged to lighten the grief of a loving heart while still able,
    because the present kingdom of grace will not last and the friend will be unexpectedly
    called.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The addressee is told to make a foundation here below before becoming drunk
    by the cup of death and before the revolutions of time are complete.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker addresses a Thou as disposer of the lots of the living and dead,
    governor of the Wheel of the Heavens, master, and creator of all.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker describes a season of roses, joyous society, wine, dancers, a
    garden, a flask of wine, and a lute, and says these are preferable to Paradise
    with houris and Koocer.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: A cupbearer is addressed amid light, wine, moon, and rose imagery; the speaker
    says the heart burns like fire and asks for wine.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Wine is directly addressed, and the speaker says he would drink so much that
    observers would confuse his identity with wine.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A Thou called the repose of the speaker’s soul is urged to drink wine until
    the speaker can doubt that it is Thou.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: A Sheikh accuses a prostitute of being in wine and in the toils of law; she
    acknowledges the description and asks whether the Sheikh is what he seems to be.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The world is likened to a bowl rolling in a hollow, unnoticed while the speaker
    slept dead drunk, and the speaker says he pawned himself at a tavern for a cup
    of wine.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The addressed Thou is said sometimes to be concealed from all and sometimes
    revealed in all created things, and is described as both maker and beholder of
    the spectacle.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: A quatrain states that gentleness enslaving a free man is more advantageous
    than giving freedom to a thousand slaves.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The passage reports warnings that drinking will lead to torment, the day of
    reckoning, and burning like fire, but replies that a day made joyous by wine is
    more precious than goods of this world and the next.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: A friend is told that casting grief into a carefree heart would make the friend
    ignorant despite any wisdom.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: The addressee is told to drink two mens of wine in every circumstance and
    society, with the stated result of freedom from scornful looks and gestures of
    disdain.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: A loaf of bread, two mens of wine, plentiful meat, a desert spot, and a young
    beauty are described as producing a joy no Sultan can procure.
  category: setting
  evidence_refs:
  - ev:16
- id: obs:17
  text: The passage says city renown leads others to think one wicked, retirement
    to a corner leads others to suspect conspiracy, and the best way is to know none
    and be known by none.
  category: speech
  evidence_refs:
  - ev:17
- id: obs:18
  text: The speaker says that, if free from destiny and from good and bad in a disordered
    world, he would prefer not to have existed rather than be forced to go away.
  category: speech
  evidence_refs:
  - ev:18
- id: obs:19
  text: The speaker says he has broken the bonds of all vows and asks whether breaking
    a thousand vows is better than breaking a pitcher of wine.
  category: speech
  evidence_refs:
  - ev:19
- id: obs:20
  text: The cupbearer is addressed again; the speakers have wine and rejoice in the
    presence of the well-beloved identified parenthetically as the Divinity, reject
    the renunciation of Nessouh, mention the story of Noe, and ask for wine as the
    repose of the soul.
  category: speech
  evidence_refs:
  - ev:20
- id: obs:21
  text: The speaker says he sees neither means of joining himself to Thee nor possibility
    of living separated from Thee even for a breath, and describes torment, grief,
    and pain.
  category: speech
  evidence_refs:
  - ev:21
