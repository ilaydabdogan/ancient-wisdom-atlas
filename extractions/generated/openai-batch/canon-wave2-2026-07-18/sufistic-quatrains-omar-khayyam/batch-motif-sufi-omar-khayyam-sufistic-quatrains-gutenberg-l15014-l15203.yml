  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source metadata; excerpt summarized.
- id: ev:17
  type: summary
  locator: Quatrain 449, lines 15125-15131
  quote_or_summary: Renown in a city leads to being thought wicked, and retirement
    to a corner leads to being regarded as a conspirator; even were one Elias or Saint
    Jude, the best way is to know none and be known by none.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source metadata; excerpt summarized.
- id: ev:18
  type: summary
  locator: Quatrain 450, lines 15133-15140
  quote_or_summary: The speaker says that if he were free from destiny and from good
    and bad in a disordered world, he would prefer not to have lived or existed rather
    than be forced to go away.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source metadata; excerpt summarized.
