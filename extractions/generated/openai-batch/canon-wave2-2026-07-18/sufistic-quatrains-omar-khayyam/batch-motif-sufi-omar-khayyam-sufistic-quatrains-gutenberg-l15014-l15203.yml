  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source metadata; excerpt summarized.
- id: ev:14
  type: summary
  locator: Quatrain 446, lines 15106-15110
  quote_or_summary: A friend is told that if his satisfaction is casting grief into
    a carefree heart, he may mourn with his wisdom all his life and is strangely ignorant.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source metadata; excerpt summarized.
- id: ev:15
  type: summary
  locator: Quatrain 447, lines 15112-15116
  quote_or_summary: The addressee is urged to drink two mens of wine in every circumstance
    and society; the one who does so is freed from scornful looks and gestures of
