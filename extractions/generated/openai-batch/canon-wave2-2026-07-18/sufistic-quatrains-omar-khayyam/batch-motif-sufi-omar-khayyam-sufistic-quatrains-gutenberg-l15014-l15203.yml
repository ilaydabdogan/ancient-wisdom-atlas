  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source metadata; excerpt summarized.
- id: ev:13
  type: summary
  locator: Quatrain 445, lines 15099-15104
  quote_or_summary: Warnings say not to drink, lest one become prey to torment and
    burn as fire on the day of reckoning; the reply says a day made joyous by wine
