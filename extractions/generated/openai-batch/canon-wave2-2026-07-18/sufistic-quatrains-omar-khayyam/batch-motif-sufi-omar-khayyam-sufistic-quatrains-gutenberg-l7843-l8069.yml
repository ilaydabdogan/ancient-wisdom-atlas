- id: ev:11
  type: summary
  locator: '233'
  quote_or_summary: The sun strikes roofs with an eastern ray, and the herald of dawn
    raises his voice to call for drinking today.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: '234'
  quote_or_summary: Comrades are asked to remember a friend with tears and, when circling
    wine-cups reach his seat, to turn one upside down to cheer his dust.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: '226'
  quote_or_summary: People string beads of learned lumber and tell many stories of
    Allah but do not solve the riddle of the skies, then return to slumber.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: '227'
  quote_or_summary: Certain folk are called asses laden with conceit and empty glittering
    drums; they are slaves of name and fame.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: '236'
  quote_or_summary: Hypocrites build on saintly show and treat the body as the spirit's
