canonical_text:
  quote: ''
  summary: A sequence of quatrains and notes treats death among companions, false
    saintliness, human formation and dissolution through elements, spiritual ignorance,
    judgment, the sky as an inverted vessel, love as self-offering, dawn drinking,
    memorial wine-cups, grievance against divine change, and mercy or predestination
    in relation to sin and virtue.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says former comrades shared life's feast and wine but have been
    taken one by one by Death and are now gone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Certain hypocrites are described as begging in streets, refusing work, and
    claiming saintly status like Shibli and Junaid while being denied that status.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says the great Founder moulded him and mixed baser metal with
    gold, so he cannot become better or fairer than when first made.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Joyous drinkers and mosque saints are both said to be lost at sea without
    finding a shore, while only One is awake and all others sleep.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker describes himself as mixed from Not-being's water and clay, afflicted
    by grief's fire, blown like wind, and finally swept away as crumbling earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the fair soul leaves the mansion, each element returns to its primal
    state and life's furnishings are dismantled by fate.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A quatrain states that on the day of final scrutiny a person will be rated
    by quality and requited as they are.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Brazier is said to have made many heads like bowls and to have set one
