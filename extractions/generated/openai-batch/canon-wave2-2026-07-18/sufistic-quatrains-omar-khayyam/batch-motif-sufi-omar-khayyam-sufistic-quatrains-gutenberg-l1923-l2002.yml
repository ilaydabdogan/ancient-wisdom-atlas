literal_observations:
- id: obs:1
  text: The narrator states that the whole of FitzGerald's material is before him
    and that FitzGerald's first edition drew on the two or three previously mentioned
    texts rather than other writings by or attributed to Omar Khayyam.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator states that other Oriental poets influenced FitzGerald's work,
    especially Ferid ud din Attar's Mantik ut-tair, and says direct or exclusive cases
    are listed in the following parallels.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator classifies FitzGerald's quatrains numerically, including forty-nine
    faithful paraphrases, forty-four composite quatrains, two from Nicolas' text,
    two reflecting the whole spirit of the original poem, two exclusively influenced
    by Attar, two influenced by Hafiz, and three suppressed quatrains not attributable
    to original lines by the narrator's search.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says Nicolas' 1867 text and translation stimulated FitzGerald's
    interest and may explain many later variations and additions; it also states that
    at least two later FitzGerald quatrains came from that text.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The narrator says he collated 5,235 Persian ruba'iyat and appended references
    to texts where each Persian ruba'i appeared in identical or varied form.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator states that the ruba'iyat inspiring FitzGerald are generally
    those represented in nearly all manuscripts and texts examined, and that Ouseley
