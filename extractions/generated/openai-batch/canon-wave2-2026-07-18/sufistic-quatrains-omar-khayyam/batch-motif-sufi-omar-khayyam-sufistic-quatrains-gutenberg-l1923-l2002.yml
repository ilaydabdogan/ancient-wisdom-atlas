    with important Calcutta variations noted.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator says FitzGerald tended after the second edition to remove quatrains
    suggested only by the general tone or sentiment of the original poem rather than
    by identifiable ruba'iyat.
  category: action
  evidence_refs:
  - ev:5
