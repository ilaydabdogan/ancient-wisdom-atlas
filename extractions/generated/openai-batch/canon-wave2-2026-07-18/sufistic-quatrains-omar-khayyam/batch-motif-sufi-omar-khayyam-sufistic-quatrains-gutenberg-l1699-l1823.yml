  confidence: medium
  cautions: The note is brief and does not explain the legend’s broader narrative
    context.
- id: motif:3
  label: Two-in-one compass circle and return
  taxonomy_refs:
  - duality
  - return
  basis: Omar’s quatrain and Donne’s verses both use the two-footed compass, fixed
    centre, circular motion, and final reunion.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The note calls Omar’s example a mathematical jest; a mystical interpretation
    is not explicitly supplied in this passage.
- id: motif:4
  label: Creator as potter and human as clay or vessel
  taxonomy_refs:
  - divine_judgment
  basis: The passage explicitly says the pot-and-potter relation to man and Maker
    is widespread and quotes a theological comparison of God’s power over humans to
    a potter’s power over clay vessels for honour or dishonour.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The available taxonomy only partially captures the creator-potter image;
    the passage emphasizes formation and divine disposal more than a full judgment
    scene.
- id: motif:5
  label: Speaking or personified vessel
  taxonomy_refs: []
  basis: The Aristophanes example presents a pot that calls a bystander to witness
    its mistreatment.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage uses the example as a literary oddity; it does not connect
    it directly to a mythic narrative beyond vessel personification.
- id: motif:6
  label: Lunar renewal after fasting month
  taxonomy_refs:
  - seasonal_cycle
  - death_rebirth
  basis: The close of Ramazan is marked by anxious watching for the new moon, and
    Omar’s quatrain presents the old moon or month as dying and a young moon as replacing
    it.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The passage is an editorial note on calendar ritual and poetic image;
    it does not present a full mythic cycle.
