candidate_motifs:
- id: motif:1
  label: Ground-poured wine as libation or benefit to the dead
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The passage describes wine poured on the ground before drinking, possibly
    as libation to Earth, sacrifice of superfluity, or refreshment for the dust of
    a dead wine-worshipper; Hafiz is cited with a similar act.
  evidence_refs:
  - ev:1
  - ev:2
