    rather than settled meanings.
- id: motif:2
  label: Death angel using fruit from the Tree of Life
  taxonomy_refs:
  - sacred_tree_axis
  basis: Azrael’s mission is accomplished by holding an apple from the Tree of Life
    to the nostril.
  evidence_refs:
