canonical_text:
  quote: ''
  summary: 'The passage presents three first-edition quatrains: one in which the speaker
    asks Heaven what guiding lamp Destiny had for her children in darkness and receives
    the answer of blind Understanding; one advising withdrawal from the quarrel of
    the Universe and the wrangling of the Wise; and one urging the filling of the
    Cup because Time passes, Yesterday is dead, Tomorrow unborn, and Today may be
    sweet. Editorial notes identify possible or absent parallels for the quatrains,
    especially a stated inspiration for No. 37 in O. 20 and O. 17.'
  language: English
  quote_policy: summarized
