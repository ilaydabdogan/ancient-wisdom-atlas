candidate_motifs:
- id: motif:1
  label: Hidden divine knowledge beyond mortal ken
  taxonomy_refs:
  - wisdom
  - forbidden_knowledge
  basis: Mortal ken is veiled; Allah's mysteries, God's secrets, and the divine secret
    are described as inaccessible, restricted, or hidden from knaves and fools.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  - ev:7
  confidence: medium
  cautions: The passage emphasizes secrecy and limitation, but does not narrate a
    transgressive quest for forbidden knowledge.
- id: motif:2
  label: Self-effacement before or within the divine
  taxonomy_refs:
  - annihilation_union
  basis: An editorial note describes souls reabsorbed in the Divine essence; another
    quatrain speaks of being stripped of self after death, and the speaker says he
    drinks to attain unconsciousness of self.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:15
  confidence: high
  cautions: The record relies partly on Whinfield's explanatory note for the explicit
    reabsorption reading.
- id: motif:3
  label: Divine Beloved and love's illumination
  taxonomy_refs:
  - divine_beloved
  basis: The divine is addressed as the Loved One; hearts lit by love are entered
    in the book of love, and the editorial note compares Hafiz on the light of the
    Beloved's face.
  evidence_refs:
  - ev:6
  - ev:14
  confidence: high
  cautions: The quatrainic addressee in quatrain 48 is not explicitly identified,
    so that image is not central to the motif assignment.
- id: motif:4
  label: Divine judgment and apocalyptic signs
  taxonomy_refs:
  - divine_judgment
  basis: The passage invokes hell, heaven, a dreadful day, wrath rending the sky,
    darkened stars, doom, and entrance or exclusion from heaven.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:14
  - ev:15
  confidence: high
  cautions: Several quatrains also critique fear-and-reward religion, so the motif
    is presented as thematic material rather than doctrinal endorsement.
- id: motif:5
  label: Sleep as an image of death
  taxonomy_refs: []
  basis: A sage in a dream calls sleep death's twin-brother and says the tomb will
    provide enough sleep.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: Available taxonomy does not include a simple sleep-death motif family;
    no rebirth element is present.
- id: motif:6
  label: Wine as means of truth or mystical self-forgetting
  taxonomy_refs:
  - mystical_quest
  - annihilation_union
  basis: The wine-cup is associated with Truth at hand, and the speaker says drinking
    is not for riot but to attain unconsciousness of self.
  evidence_refs:
  - ev:8
  - ev:15
  confidence: medium
  cautions: Wine also appears in playful and antinomian contexts, so a single symbolic
    function should not be overgeneralized.
- id: motif:7
  label: World as illusion or nothingness
  taxonomy_refs:
  - wisdom
  basis: The world, speech, hearing, earth's quarters, and chambered secrets are all
    called naught, with an editorial gloss identifying the meaning as illusion or
    Maya.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The Maya comparison is editorial; the quatrain itself uses repeated negation
    rather than a narrative myth of illusion.
- id: motif:8
  label: Living vegetation from buried human remains
  taxonomy_refs: []
  basis: Turf beside a stream is imagined as growth from dust of buried tulip cheeks,
    and the listener is warned not to tread it lightly.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The image suggests material transformation and reverence for remains,
    but does not explicitly present resurrection or rebirth.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the quatrain's image of sleep as death's
    twin-brother with a Homeric expression.
  claim_level: same_motif
  target: Homeric formula cited as "Kasignetos thanatoio"
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is supplied by the editor's note; the passage provides
    no broader argument for historical contact.
- id: claim:2
  claim: The apocalyptic rending of the sky and darkening of stars is explicitly linked
    by the editor to Qur'an lxxxii.1.
  claim_level: same_motif
  target: Qur'anic apocalyptic signs in Koran lxxxii.1
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to textual allusion or shared imagery, not to
    a full eschatological system.
- id: claim:3
  claim: The description of love's devotees as ants rather than Solomons is explicitly
    tied by the editor to the Qur'anic story of Solomon and the ants.
  claim_level: same_motif
  target: Koran xxvii.18, Solomon and the ants
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The quatrain uses the contrast briefly for humility; it does not retell
    the Qur'anic episode.
- id: claim:4
  claim: The image of hearts illuminated by love is compared by the editor with Hafiz's
    statement that where love is, the light of the Beloved's face is present.
  claim_level: same_function
  target: Hafiz, Ode 79, love and the Beloved's light
  evidence_refs:
  - ev:14
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is thematic and intra-Persian/Sufi receptional; no direct
    dependence is established in the passage.
- id: claim:5
  claim: The quatrain that calls the world and all perception naught is glossed by
    the editor as illusion, using the term Maya.
  claim_level: same_function
  target: Maya / all-as-illusion concept noted by editor
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The term Maya appears in the editorial note rather than the quatrain;
    the passage does not develop an Indic doctrinal comparison.
