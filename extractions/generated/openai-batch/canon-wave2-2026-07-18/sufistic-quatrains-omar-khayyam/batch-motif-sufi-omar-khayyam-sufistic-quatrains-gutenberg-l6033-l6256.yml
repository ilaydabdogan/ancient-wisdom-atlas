canonical_text:
  quote: ''
  summary: Quatrains 47-68 present reflections on mortal ignorance, divine secrets,
    heaven and hell, sleep and death, apocalyptic judgment, wine, love, religious
    exclusion, worldly illusion, human lusts, buried bodies becoming turf, and Qur'anic
    rules around drinking months. Editorial notes compare selected images with Homer,
    the Qur'an, Hafiz, and the concept of Maya.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mortal knowledge is described as bounded by a veil, and earth's dark bosom
    is described as man's only home.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says he has surveyed the world and found no moon or cypress comparable
    to the addressee.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Synagogue, cloister, mosque, and school are named as places where hell's terrors
    and heaven's lures govern human hearts.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Those who master Allah's mysteries are said not to scatter empty chaff about
    heaven and hell; an editorial note explains this as souls reabsorbed in the Divine
    essence having no concern with material heaven and hell.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The world, speech, hearing, the four quarters of earth, and chambered secrets
    are each called naught; an editorial note glosses this as illusion or Maya.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In a dream, a sage asks why life is consumed in sleep, calls sleep death's
    twin-brother, and says the tomb will provide enough sleep.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage links knowledge of life's secrets before death with knowledge
    of God's secrets after death, and speaks of being stripped of self tomorrow.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: On a dreadful day, wrath rends the sky and darkness dims the stars; the speaker
    says he will seize the Loved One's skirt and question the doom of guiltless ones.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The divine secret is said not to be confided to knaves and to be denied to
    fools, forcing hopes to be hidden from all.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The speaker addresses a cupbearer, says a bright wine-cup gives Truth at hand,
    later says wine and rose once delighted him, and then calls for wine as days pass
    swiftly.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Love's devotees are described as not Moslems and not Solomons but ants, with
    wan faces and tattered rags.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: The speaker says he wedded Luck, offered her a dower, and received her reply
    that a gay heart was sufficient.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: The speaker calls himself an outcast from mosque and foe to church, asks Allah
    of what clay he was formed, and compares himself to a sceptic monk or ugly courtesan.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: Men's lusts are compared to house-dogs, foxes, hares, wolves, and tigers.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:15
  text: Turf beside a stream is likened to a cherub's lip or to growth from the dust
    of buried tulip cheeks, and the listener is told not to tread it scornfully.
  category: object
  evidence_refs:
  - ev:13
- id: obs:16
  text: Hearts illuminated by love, whether in mosque or synagogue, are said to have
    their names written in the book of love and to be untroubled by hopes of heaven
    or fears of hell.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:17
  text: Wine is said to outweigh realms and royal insignia; the speaker says drinking
    is for attaining unconsciousness of self, not riot or violation of divine law.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:18
  text: The final quatrain names Rajab, Sha'ban, and Ramazan while referring to strict
    Qur'anic restrictions on drinking and to months claimed by God and the Prophet.
  category: speech
  evidence_refs:
  - ev:16
