candidate_motifs:
- id: motif:1
  label: Inaccessible divine secrets and mystical search for wisdom
  taxonomy_refs:
  - wisdom
  - mystical_quest
  basis: The passage repeatedly describes hidden divine secrets, the speaker's searches
    and travels, and questions about what can be known at death or when separated
    from self.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:7
  confidence: high
  cautions: The quatrains are lyrical reflections rather than a continuous narrative
    quest.
- id: motif:2
  label: Sin, pardon, and contested afterlife judgment
  taxonomy_refs:
  - divine_judgment
  basis: Sin and pardon are discussed directly, while Hell and Paradise recur as objects
    of fear, hope, indifference, or disputed prediction.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:14
  - ev:19
  - ev:20
  confidence: high
  cautions: The passage questions ordinary afterlife expectations but does not present
    a formal judgment scene.
- id: motif:3
  label: Divine or transcendent beloved addressed through beauty and complaint
  taxonomy_refs:
  - divine_beloved
  basis: The addressee's beauty exceeds moon and cypress; the speaker identifies as
    an idolater of love and calls for the Beloved at death; an Idol is questioned
    for taking life.
  evidence_refs:
  - ev:3
  - ev:8
  - ev:12
  - ev:19
  confidence: medium
  cautions: The passage's beloved, Idol, and God may overlap in Sufi reception, but
    the literal text does not always explicitly identify them as the same figure.
- id: motif:4
  label: Wine as relief from self and contact with the divine
  taxonomy_refs:
  - annihilation_union
  basis: Wine is connected with rejoicing, the cupbearer, the claim that God is in
    the drinkers' hands, and the statement that drinking is for a passing knowledge
    of relief from self.
  evidence_refs:
  - ev:10
  - ev:13
  - ev:20
  confidence: medium
  cautions: The text says relief from self but does not explicitly narrate full mystical
    union or annihilation.
- id: motif:5
  label: Human death transformed into natural growth
  taxonomy_refs:
  - death_rebirth
  - seasonal_cycle
  basis: The passage connects burial and earth-sleep with an image of green plants
    growing beside a brook from dust that once was a rose-colored face.
  evidence_refs:
  - ev:6
  - ev:16
  confidence: medium
  cautions: The transformation is vegetal and poetic; it is not presented as bodily
    resurrection.
- id: motif:6
  label: Personified world as bride with dowry of joy
  taxonomy_refs: []
  basis: The world is explicitly called the bride of the human race and speaks of
    her dowry as joy of heart.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: No broader marriage rite or sacred exchange narrative is developed in
    the passage.
- id: motif:7
  label: Cosmic disorder as setting for protest against the life-giver
  taxonomy_refs:
  - chaos
  basis: The speaker imagines the heavens confounded and stars obscured, then confronts
    the Idol over the taking of life.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The cosmic disorder is brief and embedded in a personal address rather
    than a full cosmogonic or apocalyptic narrative.
