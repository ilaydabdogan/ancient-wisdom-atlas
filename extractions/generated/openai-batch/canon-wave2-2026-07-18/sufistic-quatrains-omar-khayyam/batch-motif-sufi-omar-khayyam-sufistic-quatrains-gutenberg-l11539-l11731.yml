  text: The speaker addresses Khayyam and states that pardon exists because sin has
    occurred, making fear unnecessary in that context.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says no one can reach the secrets of God behind a mysterious curtain,
    and that humans have no dwelling other than the earthly mind.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker reports long searching in the inconstant world and says the addressee's
    visage and form surpass the moon and cypress.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: People in mosque, school, church, and synagogue are described as fearing Hell
    and seeking Paradise, while those who penetrate the All-Powerful's secrets are
    said not to bear that disquiet.
  category: relationship
  evidence_refs:
  - ev:4
