canonical_text:
  quote: ''
  summary: A sequence of quatrains addresses Khayyam, God, an unnamed beloved or idol,
    a sage, and a cupbearer. The passage reflects on sin and pardon, inaccessible
    divine secrets, the emptiness of worldly travel and knowledge, wine as joy and
    relief from self, sleep and burial, apocalyptic questioning of a life-giving addressee,
    secrecy, love, afterlife hopes and fears, and the return of human dust into green
    growth beside water.
  language: English
  quote_policy: summarized
literal_observations:
