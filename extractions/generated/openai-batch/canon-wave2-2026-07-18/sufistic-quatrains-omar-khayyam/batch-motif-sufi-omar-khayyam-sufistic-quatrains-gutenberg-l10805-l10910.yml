canonical_text:
  quote: ''
  summary: 'Introductory prose frames the Nicolas translation of Khayyam, explains
    the translator-editor''s decision to publish, credits assistance from Hassan-Ali-Khan,
    and recounts a transmitted biography: Khayyam studies at Nishapur with Abdul-Kassem
    and Hassan-Sebbah; the three make a compact of mutual aid; their characters and
    later paths diverge, with Khayyam described as a contemplative Sufi poet, Abdul-Kassem
    rising to become Nizam-el-Moulk under Alp-Arslan, and Hassan-Sebbah described
    as violent and cruel.'
