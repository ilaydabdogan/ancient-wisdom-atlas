canonical_text:
  quote: ''
  summary: A sequence of quatrains presents a first-person speaker and companions
    centered on wine, cup, tavern, beloved, mortality, religious critique, friendship,
    revelation through intoxication, sacrifice-like surrender to wine, the brevity
    of life, and personified Destiny and Earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A voice from the tavern summons joyous drinkers to arise and fill a cup of
    wine before Fate fills the cup of existence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker addresses a beloved or Idol as the chosen object of the heart
    and as more precious than soul, eyes, and life.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The beloved is described as having a hidden veil raised and as arriving rapidly
    like wind that fans a fire left by absence.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The world is described as a temporary tent where the problem of creation remains
    unsolved and people depart with regret.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker addresses Khadja, asks for one lawful desire and guidance in the
    way of God, and tells him to heal his own sight and leave the group in peace.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker asks that a pitcher of wine be brought before pitchers are made
    from the speakers' own dust.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: For death rites, the speaker requests washing with vine juice, praise of cup
    and wine instead of prayer, and to be sought in the dust of the tavern floor on
    the day of doom.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: An addressee called an adorable Moon is urged to drink from a silver cup because
    it will long turn in the firmament after the humans are absent.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The lover or true believer is wished to be intoxicated all year, mad, absorbed
    with wine, and dishonored; sound reason is said to bring chagrin.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The brim of the cup is said to bear a verse full of light, contrasted with
    the Koran being read only intermittently.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage defends the drunkard against blame from a non-drinker and says
    some non-drinkers commit acts worse than drunkenness.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The speaker says bodily beauty is evident but the reason the celestial author
    placed the speaker on earth has not been demonstrated.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: A perfect friend or heart is valued above a hundred Kaabas made of earth and
    water.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: When the speaker takes a cup of wine and becomes intoxicated, a devouring
    state of fire is accompanied by miracles and water-clear words that explain the
    mystery of all things.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The group offers souls in holocaust to the laughing lips of the divine juice,
    while a cup-bearer holds a flask and overflowing cup as if inviting them to receive
    pure blood.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: The group sits among ruins with wine and dancers, has pawned soul, heart,
    goods, and everything except the cup, and claims to be beyond hope of pardon,
    fear of punishment, and the four elements.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:17
  text: Faith and incredulity, doubt and certainty, and life and death are each described
    as separated by only a breath; the hearer is urged to pass that breath gaily.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:18
  text: The Wheel of Destiny is accused of destruction, hate, and tyranny, and Earth
    is imagined as having valuable treasures in its bosom.
  category: speech
  evidence_refs:
  - ev:14
