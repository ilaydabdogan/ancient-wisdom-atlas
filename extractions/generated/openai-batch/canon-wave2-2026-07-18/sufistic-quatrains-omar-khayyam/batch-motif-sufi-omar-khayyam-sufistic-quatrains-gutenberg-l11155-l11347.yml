candidate_motifs:
- id: motif:1
  label: Tavern wine as revelatory wisdom
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: Wine, cup, and tavern are repeatedly linked to summons, luminous verse, miracles,
    and words explaining the mystery of all things.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:10
  confidence: medium
  cautions: The passage strongly links wine with knowledge and revelation, but does
    not require deciding whether the wine is literal, symbolic, or both.
- id: motif:2
  label: Beloved dearer than life
  taxonomy_refs:
  - divine_beloved
  basis: The addressed beloved or Idol is called the chosen object of the heart and
    more precious than soul, eyes, and life.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage does not explicitly identify the beloved as divine; the taxonomy
    link is therefore cautious.
- id: motif:3
  label: Death, dust, and transformed vessel
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The speaker imagines human dust becoming pitchers, requests wine-centered
    death rites, and says to seek him in the tavern floor dust on the day of doom.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: medium
  cautions: A complete rebirth or resurrection scene is not narrated; the support
    is limited to dust transformation and eschatological reference.
- id: motif:4
  label: Sacrificial self-surrender to intoxicating divine juice
  taxonomy_refs:
  - sacrifice
  - annihilation_union
  basis: The speakers offer their souls in holocaust to the divine juice and pawn
    soul, heart, and possessions while claiming freedom from punishment and elemental
    limits.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage states sacrifice-like surrender; union or annihilation is
    only cautiously inferred from the surrender and transcendence language.
- id: motif:5
  label: Impermanence and breath-thin life
  taxonomy_refs:
  - wisdom
  basis: The world is a temporary tent, life tends toward decay, and life and death
    are separated by only a breath.
  evidence_refs:
  - ev:3
  - ev:11
  - ev:13
  confidence: high
  cautions: This is a thematic wisdom pattern rather than a narrative myth episode.
- id: motif:6
  label: Heart over formal shrine
  taxonomy_refs:
  - wisdom
  basis: The passage says a hundred Kaabas made of earth and water are not worth one
    heart and urges the hearer to seek a heart.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage makes an explicit value contrast, but does not narrate a shrine-centered
    mythic episode.
- id: motif:7
  label: Personified destiny as destructive power
  taxonomy_refs: []
  basis: The Wheel of Destiny is directly accused of destruction, hate, and tyranny
