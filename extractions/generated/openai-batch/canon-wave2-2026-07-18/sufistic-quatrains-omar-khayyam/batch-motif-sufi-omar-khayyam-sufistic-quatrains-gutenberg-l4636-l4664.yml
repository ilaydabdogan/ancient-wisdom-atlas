  quote: ''
  summary: Quatrain XCIX imagines old acquaintances meeting under a blossoming branch
    leaning over a wall. An editorial note links it to a story told by Nizam ul-Mulk
    and recorded by FitzGerald. Quatrain CVII says it would be better to cancel one
    luckless human soul from the Scroll of Universe than to add to an ever-growing
    flood of anguish. A cited parallel says what the Pen has written never changes
    and grief, even tears of blood, cannot increase anything beyond what is fixed.
