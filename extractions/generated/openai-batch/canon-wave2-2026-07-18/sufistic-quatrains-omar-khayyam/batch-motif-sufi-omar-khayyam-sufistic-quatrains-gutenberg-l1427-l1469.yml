canonical_text:
  quote: ''
  summary: 'The speaker addresses a divine or creator figure, questioning responsibility
    for snares, predestination, fall, sin, and forgiveness. The passage then shifts
    to the Kuza-Nama: at the close of Ramazan, the narrator stands in an old potter''s
    shop among rows of clay vessels. Some vessels speak; one asks who is the Potter
    and who is the Pot, and another argues that a being shaped from common earth should
    not be returned to common earth in vain.'
  language: English
  quote_policy: summarized
