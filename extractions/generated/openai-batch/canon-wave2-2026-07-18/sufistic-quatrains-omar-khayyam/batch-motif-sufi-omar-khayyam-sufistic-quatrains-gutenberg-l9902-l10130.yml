  rights_note: Public domain source; summarized for extraction.
- id: ev:8
  type: summary
  locator: quatrain 422
  quote_or_summary: All creatures, small and great, worship and pray to the Lord,
    who takes away woe and gives weal, or may give and take as he pleases.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:9
  type: summary
  locator: quatrain 423 and note 423
  quote_or_summary: Old age is described as movement through a sad vale, thick nails
    like a horse's hoof, and a ragged beard like an ass's tail; the note identifies
    it as old age.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:10
  type: quote
  locator: quatrain 424 and note 424
  quote_or_summary: Humankind is “a nothing, built on empty wind,” “hovering in the
    abyss,” with “a void before” and “a void behind.” The note mentions Takwin and
    compares “nunc stans.”
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; short quotation used for extraction.
- id: ev:11
  type: summary
  locator: quatrain 425
  quote_or_summary: Each morning the speaker says he will repent of wine and taverns,
    but while it is spring and roses bloom, he asks to be released from the promise.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:12
  type: summary
  locator: quatrain 426
  quote_or_summary: The speaker advises avoiding vain philosophy, looking at tangled
    curls, and shedding the bottle's life-blood into a cup before death sheds human
    blood and feasts.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:13
  type: summary
  locator: quatrain 427
  quote_or_summary: The heart is challenged to read a dark riddle where wise men failed,
    then advised to drink and make heaven below because heaven above may not be granted.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:14
  type: quote
  locator: quatrain 428 and note 428
  quote_or_summary: Those who have passed away “Sleep in delusion's dust”; their “dogmas
    were but air.” The note compares Ecclesiastes on wisdom as vanity.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; short quotation used for extraction.
- id: ev:15
  type: quote
  locator: quatrain 429 and note 429
  quote_or_summary: "“You lose yourself, but find your Self”; drinking “His entrancing
    cup” hastens escape. The note glosses: “Die to self, to live in God.”"
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; short quotation used for extraction.
- id: ev:16
  type: summary
  locator: quatrain 430
  quote_or_summary: The speaker says he is a wine-bibber, asks why people rail at
    him, and says that if all evil actions made men drunk, no sober people would be
    seen.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:17
  type: quote
  locator: quatrain 431
  quote_or_summary: The addressee is “Child of four elements and sevenfold heaven”;
    “Once gone, nor hell will send you back, nor heaven.”
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; short quotation used for extraction.
- id: ev:18
  type: summary
  locator: quatrain 432 and note 432
  quote_or_summary: The speaker says God besets the way with snares, threatens to
    slay if he falls, rules the world irresistibly, and imputes sin; the note identifies
