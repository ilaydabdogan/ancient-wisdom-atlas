candidate_motifs:
- id: motif:1
  label: Floral renewal from earth
  taxonomy_refs:
  - death_rebirth
  - seasonal_cycle
  basis: A rose is said to have sunk to earth and sprung from earth again, and spring
    roses later accompany the suspension of a repentance vow.
  evidence_refs:
  - ev:1
  - ev:11
  confidence: medium
  cautions: The renewal is literal botanical imagery in a lyric setting; the passage
    does not narrate a human or divine resurrection.
- id: motif:2
  label: Wine as refuge from repentance, dogma, and uncertainty
  taxonomy_refs:
  - mystical_quest
  basis: Wine is repeatedly requested or defended while repentance, philosophy, dogma,
    death, and uncertainty about heaven are questioned.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:11
  - ev:13
  - ev:14
  - ev:16
  confidence: medium
  cautions: The passage alternates literal wine-drinking language and Sufi-adjacent
    commentary; the symbolic force should be reviewed rather than assumed for every
    occurrence.
- id: motif:3
  label: Self-loss in the Loved One and recovery of true Self
  taxonomy_refs:
  - annihilation_union
  - divine_beloved
  basis: The heart loses itself and finds its Self through the Loved One's sweets
    and cup; the note glosses this as dying to self to live in God.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: The explicit Sufi gloss comes from the editor's note within the passage,
    not solely from the quatrain wording.
- id: motif:4
  label: Grace, pardon, and divine judgment beyond merit
  taxonomy_refs:
  - divine_judgment
  basis: The speaker relies on free grace rather than merit, asks pardon for ill deeds,
    and discusses sin, punishment, and after penalties.
  evidence_refs:
  - ev:6
  - ev:18
  - ev:19
  - ev:20
  confidence: high
  cautions: The quatrains also challenge the logic of divine responsibility and judgment,
    so the motif includes tension rather than a single doctrinal claim.
- id: motif:5
  label: Human transience between voids and non-return after death
  taxonomy_refs: []
  basis: Humankind is called nothing between voids; predecessors sleep in dust, and
    the addressee is told that neither hell nor heaven will send the person back once
    gone.
  evidence_refs:
  - ev:10
  - ev:14
  - ev:17
  confidence: high
  cautions: No detailed afterlife journey map is supplied; the emphasis is on mortality,
    void, and non-return.
- id: motif:6
  label: Failure of philosophy and inherited wisdom
  taxonomy_refs:
  - wisdom
  basis: The passage dismisses philosophy as vain, says wise men have failed at the
    dark riddle, and calls the dogmas and lore of predecessors air and wind.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: The motif is a critique or inversion of wisdom rather than a straightforward
    celebration of wisdom.
- id: motif:7
  label: Divinely made human nature under divine agency
  taxonomy_refs:
  - duality
  basis: The speaker says God made his form and mould, then later says God sets snares,
    rules irresistibly, and imputes sin when the speaker obeys.
  evidence_refs:
  - ev:7
  - ev:18
  confidence: medium
  cautions: The available taxonomy ref 'duality' is only a loose fit for the tension
    between divine agency and human culpability.
- id: motif:8
  label: Hostile wheel of heaven and elemental disruption
  taxonomy_refs:
  - chaos
  basis: The wheel of heaven thwarts desire, tears joy, fouls water with earth, and
    turns air to fire.
  evidence_refs:
  - ev:21
  confidence: medium
  cautions: This is a single lyric complaint against heaven rather than a full cosmogonic
    chaos narrative.
comparison_claims:
- id: claim:1
  claim: The note links the rose or flower passage with Moschus on mallows, indicating
    a cautious literary parallel in floral recurrence imagery.
  claim_level: visual_similarity
  target: Moschus on the mallows
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: low
  limitations: The note is brief and does not quote Moschus or specify the exact shared
    wording or motif function.
- id: claim:2
  claim: The note says Sa'di's Gulistan offers another explanation of the expression
    concerning cypress and lily as free, supporting comparison at the level of a shared
    expression or interpretive tradition.
  claim_level: linguistic_similarity
  target: Sa'di, Gulistan, Book viii, explanation of cypress and lily as 'free'
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only the editor's summary and does not reproduce
    Sa'di's explanation.
- id: claim:3
  claim: The note compares the void-between-voids formulation with the Schoolmen's
    term 'nunc stans,' suggesting a cautious conceptual comparison about existence
    or time.
  claim_level: same_function
  target: Schoolmen's term 'nunc stans' applied to Time
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: low
  limitations: The comparison is editorial and conceptual; it is not evidence of historical
    contact within the passage.
- id: claim:4
  claim: The note explicitly compares the dismissal of wisdom and lore with Ecclesiastes'
    statement that the quest for wisdom is vanity.
  claim_level: same_function
  target: Ecclesiastes vanity-of-wisdom pattern
  evidence_refs:
  - ev:14
  counter_evidence_refs: []
  confidence: medium
  limitations: The note supports a thematic comparison, but the passage does not establish
    dependence or shared transmission.
- id: claim:5
  claim: The note identifies the divine-agency claim with the Sufi view that Allah
    is the only real agent, supporting comparison to a Sufi doctrinal pattern of divine
    agency.
  claim_level: same_function
  target: Sufi doctrine of Allah as Fa'il i hakiki, the only real agent
  evidence_refs:
  - ev:18
  counter_evidence_refs: []
  confidence: high
  limitations: This relies on the editor's note within the passage and should not
    be generalized beyond this quatrain without further corpus evidence.
