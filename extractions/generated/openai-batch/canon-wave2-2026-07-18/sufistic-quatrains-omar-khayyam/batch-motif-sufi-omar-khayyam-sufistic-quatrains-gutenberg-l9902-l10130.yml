canonical_text:
  quote: ''
  summary: A sequence of translated quatrains and notes treats roses, bulbuls, cypress,
    lily, wine, repentance, divine grace, human formation by God, worship, old age,
    human nothingness, philosophical doubt, departed predecessors, the Loved One,
    heaven and hell, divine agency, pardon, possible afterlife penalties, and the
    hostile wheel of heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bulbuls are described as doting on roses and complaining when breezes tear
    the roses' veils; the speaker proposes sitting beneath a rose that has sunk to
    earth and sprung from earth again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cypress and lily are described as members of the leafy tribe called free;
    one has tongues yet is silent, and one has hands that take no bribe.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker asks a cupbearer to bring a wine-cup and a pleasing chain that
    entangles wise men and fools together.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker reproaches himself for a wasted life, forbidden meats, lusts,
    omissions of right action, wrongdoing, and a blackened face.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker says he could repent of everything except wine and says he could
    not abjure Magian wine even if he became a Musulman.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker says hope rests on God's free grace, not on merit, and that mercy
    can count ill done as undone and good undone as done.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker says God gave him his form, works marvels in it, and made him
    from a divine mould.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: All creatures are said to worship and pray to the Lord, who takes woe away
    and gives weal, or may take away instead.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Old age is described through going to and fro in a sad vale, thickened nails
    like a horse's hoof, and a ragged beard like an ass's tail.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Humankind is addressed as unenlightened, a nothing built on empty wind, hovering
    in an abyss with void before and behind.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The speaker says he vows each morning to repent of wine and tavern visits,
    but asks to be released from the promise while spring roses bloom.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The speaker advises avoiding vain philosophy, looking instead at tangled curls,
    and pouring the bottle's life-blood before death sheds human blood.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The heart is asked whether it can read a dark riddle where wise men failed;
    the advice is to drink and make heaven below because heaven above is uncertain.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Those who have gone before are said to sleep in delusion's dust; a boy is
    told to fetch wine, and dogmas and lore are called air and wind.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: The heart is told that feeding on the Loved One's sweets makes it lose itself
    and find its Self; drinking His cup hastens escape from quick and dead.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: The speaker identifies himself as a wine-bibber and says that if every evil
    action made people drunk, no sober people would be seen.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:17
  text: A human addressee is called a child of four elements and sevenfold heaven
    and told that once gone, neither hell nor heaven will send the person back.
  category: speech
  evidence_refs:
  - ev:17
- id: obs:18
  text: The speaker says God sets snares, threatens death if the speaker falls, rules
    the world irresistibly, and imputes sin when the speaker obeys.
  category: speech
  evidence_refs:
  - ev:18
- id: obs:19
  text: The speaker asks that divine grace sober him though drunk with sins and pardon
    his ill deeds.
  category: speech
  evidence_refs:
  - ev:19
- id: obs:20
  text: The speaker says that if life were an empty play, every day would be a festival
    and people could fulfill desire without fear of later penalties.
  category: speech
  evidence_refs:
  - ev:20
- id: obs:21
  text: The wheel of heaven is addressed as thwarting the speaker's desire, tearing
    joy, fouling drinking water with earth, and turning air into fire.
  category: speech
  evidence_refs:
  - ev:21
