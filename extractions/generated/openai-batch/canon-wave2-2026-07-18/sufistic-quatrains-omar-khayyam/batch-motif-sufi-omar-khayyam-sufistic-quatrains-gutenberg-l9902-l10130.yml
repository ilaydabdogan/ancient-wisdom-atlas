- id: ev:19
  type: summary
  locator: quatrain 433
  quote_or_summary: The speaker addresses the divine essence as beyond human thought,
    says sins and righteous deeds seem alike as nothing, and asks grace to sober him
    and pardon ill deeds.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:20
  type: summary
  locator: quatrain 434 and note 434
  quote_or_summary: The speaker says that if life were an empty play, every day would
    be festive and people could gain desire without fear of after penalties; the note
    mentions a Quranic allusion.
  source_text_path: texts/public-domain/sufi/project-gutenberg/sufistic-quatrains-omar-khayyam.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:21
  type: quote
  locator: quatrain 435
  quote_or_summary: The “wheel of heaven” thwarts desire, fouls “water” with earth,
    and turns “air” to “fire.”
