candidate_motifs:
- id: motif:1
  label: Impermanence and urgent present enjoyment
  taxonomy_refs:
  - wisdom
  basis: The passage repeatedly says life is brief, tomorrow is uncertain, death will
    summon people, and the present should be used for wine or rejoicing.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:7
  - ev:9
  - ev:20
  confidence: high
  cautions: The available taxonomy has no specific carpe-diem or memento-mori family,
    so the broader wisdom reference is approximate.
- id: motif:2
  label: Tavern intoxication as privileged setting
  taxonomy_refs:
  - mystical_quest
  basis: Wine, tavern dwelling, rapt unconsciousness, and being above the four elements
    recur, and an editorial note says one opening quatrain is considered mystical.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:19
  - ev:22
  confidence: medium
  cautions: The quatrains may be read literally, metaphorically, or mystically; the
    passage includes one note calling a quatrain mystical but does not systematize
    the symbolism.
- id: motif:3
  label: Death ritual relocated to the tavern
  taxonomy_refs: []
  basis: The speaker asks to be washed with wine after death, given a bacchanalian
    chant, buried beneath the tavern threshold, and later imagined as exhaling wine
    fragrance from the tomb.
  evidence_refs:
  - ev:6
  - ev:17
  confidence: high
  cautions: This is a local image cluster rather than a supplied taxonomy family.
- id: motif:4
  label: Day of doom and heavenly admission
  taxonomy_refs:
  - divine_judgment
  basis: The speaker refers to the day of doom and asks for admission to heavenly
    courts in a quatrain whose note identifies the addressee as Muhammad.
  evidence_refs:
  - ev:6
  - ev:16
  confidence: medium
  cautions: The passage mentions judgment-related settings but does not narrate an
    actual judgment scene.
- id: motif:5
  label: Heart as sacred locus superior to shrine
  taxonomy_refs:
  - wisdom
  basis: The passage advises against vexing another and says a hundred Ka'bas do not
    equal one heart, instructing the hearer to seek a heart rather than the Ka'ba.
  evidence_refs:
  - ev:15
  - ev:18
  confidence: high
  cautions: The taxonomy reference is broad; the passage itself supplies the heart-versus-Ka'ba
    contrast.
- id: motif:6
  label: Divine presence in created beauty and image
  taxonomy_refs: []
  basis: The heavenly Artisan forms human beauty, and an idol explains its worship
    by saying divine charm is conferred upon it through the worshipper’s eyes; the
    note glosses the quatrain as meaning all is of God, even idols.
  evidence_refs:
  - ev:12
  - ev:14
  confidence: medium
  cautions: This extraction follows the passage and note without expanding into a
    wider doctrine.
- id: motif:7
  label: After-us indifference to future ruin
  taxonomy_refs:
  - wisdom
  basis: In the fish-and-duck exchange, the duck dismisses the brook’s future after
    its own death, and the note glosses the meaning as “Après nous le déluge.”
  evidence_refs:
  - ev:23
  confidence: high
  cautions: The motif is supported by the editorial gloss, but it appears in only
    one quatrain.
