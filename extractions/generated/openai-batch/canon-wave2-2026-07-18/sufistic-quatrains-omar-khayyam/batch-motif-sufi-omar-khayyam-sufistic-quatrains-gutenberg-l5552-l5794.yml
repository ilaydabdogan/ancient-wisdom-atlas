canonical_text:
  quote: ''
  summary: The passage presents the opening quatrains and notes of Whinfield’s Omar
    Khayyam. The quatrains repeatedly place the speaker among wine, taverns, cups,
    bowls, and revellers while reflecting on mortality, the uncertainty of tomorrow,
    death, the day of doom, religious admonition, the heart, divine creation, heavenly
    courts, and a brief fish-and-duck fable glossed as “Après nous le déluge.”
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dawn cry in the tavern tells the brethren of the revellers’ guild to arise
    so that wine may fill their measure before the measure of their days is filled.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A speaker asks who brought an addressed person from the harem at nightfall
    to someone who burns like fire and trembles like hot air in that person’s absence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says human sojourn below lasts only a day, yields grief and woe,
    and ends with unresolved riddles and regrets.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker addresses Khaja, asks him to finish preaching, claims to walk
    aright, and tells Khaja to heal his purblind eyes.
  category: speech
  evidence_refs:
  - ev:4
