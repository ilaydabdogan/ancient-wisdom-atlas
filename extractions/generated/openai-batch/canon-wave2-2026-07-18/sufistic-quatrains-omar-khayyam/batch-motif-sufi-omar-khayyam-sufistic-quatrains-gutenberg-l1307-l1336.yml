canonical_text:
  quote: ''
  summary: Four quatrains describe an angelic figure arriving at dusk by an open tavern
    door with a vessel and bidding the speaker taste the Grape. The Grape is praised
    as able to confute many jarring sects and to transmute life’s leaden metal into
    gold. Mahmud is portrayed as destroying fears and sorrows that infest the soul.
    The speaker then urges leaving the Wise to wrangle and letting the quarrel of
    the universe be.
