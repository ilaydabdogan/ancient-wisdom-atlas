canonical_text:
  quote: ''
  summary: A sequence of quatrains and editorial notes treats human sorrow, divine
    planning, the dead as dust awaiting judgment, fleeting pleasures, ethical charity
    over ritual law, wine and cups, a destructive flood allusion, the nearness yet
    invisibility of the divine, the potter kneading clay that speaks as a former man,
    renunciation of worldly bonds in seeking Him, fate written by the eternal pen,
    the no-return road of death, and the dark cosmic wheel that grants no second life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Heaven is said to multiply human sorrows, and the unborn are imagined as able
    to decide whether to come into life if they knew those ills.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressee is told not to foresee the future or vex the brain, but to leave
    Allah's plans to him because he formed them without consulting the addressee.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The tenants of tombs decay to dust, lack self-knowledge, and have sundered
    atoms floating about the world until judgment day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Earthly goods and pleasures are compared to dew that adorns flowers for one
    short night and then disappears.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says not to heed the Sunna or divine law if the addressee gives
    the poor their portion and does not injure or abuse anyone; on that basis heaven
    and wine are promised.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Youth is described as the time to court the vine, quaff the cup, and recline
    with revellers; a past flood of water that laid waste the earth is used to urge
    floods of wine.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:7
  text: The world, wealth, and poverty are said not to find Thee, though Thee is very
    near; human ears and eyes are described as deaf and blinded.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:8
  text: Wine is called the grape's blood and is made to speak, saying it dedicates
    its life-blood to the drinkers.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:9
  text: A cup concealed in the heavenly blue is said to be one that all mortals must
    drink in turn.
  category: object
  evidence_refs:
  - ev:11
- id: obs:10
  text: A busy potter kneads a lump of clay, and the clay asks to be used gently because
    it was a man yesterday.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A seeker of Him is told to abandon child and wife, sever ties to life, and
    cut bonds like with a knife.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:12
  text: The world is called a fleeting show, and the addressee is told to bow down
    and bear fate because the eternal pen will not unwrite its roll.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:13
  text: No one is said to have returned from the long road travelled by those who
    went before; when one goes, one will not return.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:14
  text: The dark wheel is addressed as having slain many lovers and as granting no
    second life once one life is spent.
  category: speech
  evidence_refs:
  - ev:15
