    a caravan leaving for the Dawn of Nothing; question endless pursuit and dispute;
    prefer the fruitful grape; describe a new marriage in which the speaker divorces
    barren Reason and marries the Daughter of the Vine; and state that, despite defining
    oppositions such as IS and IS-NOT, the speaker cared only for Wine.
