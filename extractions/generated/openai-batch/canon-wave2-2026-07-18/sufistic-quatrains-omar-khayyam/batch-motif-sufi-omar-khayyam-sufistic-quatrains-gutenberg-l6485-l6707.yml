canonical_text:
  quote: ''
  summary: A sequence of quatrains and editorial notes addresses moral accusation,
    wine, divine grace, predestination, death, deceptive fortune, flowers associated
    with the dead, the soul’s search for heavenly knowledge, and the speaker’s lack
    of free will.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker asks why moral men defame and misjudge him and names weakness
    for grape and female charms as his faults.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who follows passion is said to depart as a helpless pauper, and the
    addressee is told to remember origin, identity, action, and destination.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The skies enclose weary lives; tears are likened to a Jihun river; hell is
    described as fire kindled from grief; heaven is described as a brief peace stolen
    from woes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker says he drowns in sin and has a dark soul, asks for clemency and
    light, and contrasts earned heaven with a free gift.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker asks whether the maker fashioned him for hell or heaven and says
    he will not renounce cup, lute, and love.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Censors from right and left command the speaker to renounce wine; the speaker
    answers by treating wine as a foe whose blood should be drunk.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Good and evil in human nature and weal and woe are attributed to heaven’s
    decrees, not to movements of the skies.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Allah is said to have mixed the speaker’s clay, foreknown his acts, and willed
    every act; the speaker asks whether punishment in hell is just.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Drinkers are told not to stop drinking on Friday, to count all days the same,
    and to worship God rather than days.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Grace is discussed through Adam’s banishment from Paradise and through the
    claim that grace shown to sinners is true grace, while grace earned by works is
    not.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Dame Fortune is personified as smiling guilefully, carrying a sharp scimitar,
    and offering a poisonous sweetmeat.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: Rose and tulip beds are associated with a monarch’s shed blood, and a violet’s
    purple tuft is associated with the head of a black-moled girl.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: Wine is compared to a melting ruby; the cup is compared to its mine and to
    the body; wine is compared to the soul and to blood held in tears.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: Wine is praised as eternal life, youth’s fruit, old age’s balm, and part of
    a time of roses, wine, and friends.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: The speaker urges drinking wine because a long sleep in the tomb will come
    without friend or wife, and says withered tulips never bloom again.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: Preachers describe the sweetness of Houri brides, but the speaker says wine
    is sweeter and contrasts present cash with future credit.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:17
  text: The speaker’s soul asks to be taught heavenly lore; the speaker tells the
    soul to learn the Alif, and the note identifies this with the sufficiency of the
    One.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:18
  text: The speaker says he did not come by free will, must go against his wish like
