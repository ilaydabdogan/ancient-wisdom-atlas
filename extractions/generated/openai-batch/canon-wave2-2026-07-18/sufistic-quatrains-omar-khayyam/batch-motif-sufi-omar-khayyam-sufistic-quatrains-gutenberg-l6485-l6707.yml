  category: speech
  evidence_refs:
  - ev:19
- id: obs:20
  text: Hearts free from worldly cares are said to have bliss, while others contain
    seeds of bitter woe.
  category: attribute
  evidence_refs:
  - ev:20
- id: obs:21
  text: A person with wisdom’s seed either strives to work Allah’s will or exalts
    the cup and works his own.
  category: sequence
  evidence_refs:
  - ev:21
