candidate_motifs:
- id: motif:1
  label: Predestination questioned before divine judgment
  taxonomy_refs:
  - divine_judgment
  basis: The speaker repeatedly asks whether he was made for hell or heaven, says
    Allah foreknew and willed his acts, and questions the justice of hell-punishment.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage frames the issue as a rhetorical complaint within quatrains,
    not as a systematic doctrine.
- id: motif:2
  label: Grace as gift rather than earned wage
  taxonomy_refs:
  - sacred_exchange
  basis: Heaven earned by painful works is called a wage rather than a free gift,
    and grace is defined as grace shown to sinners rather than merit earned by works.
  evidence_refs:
  - ev:4
  - ev:10
  confidence: medium
  cautions: The exchange language is explicit, but it is theological and poetic rather
    than a described ritual exchange.
- id: motif:3
  label: Wine preferred to deferred heavenly reward
  taxonomy_refs:
  - sacred_exchange
  basis: The speaker refuses to trade earthly cash for heavenly credit, says wine
    is sweeter than promised Houri brides, and urges holding present cash over future
    credit.
  evidence_refs:
  - ev:5
  - ev:16
  confidence: medium
  cautions: Wine may have layered literary or mystical associations, but this extraction
    records only the passage’s literal contrasts.
- id: motif:4
  label: Mortality and non-return from the tomb
  taxonomy_refs:
  - death_rebirth
  basis: The speaker urges drinking before a long sleep in the tomb and says withered
    tulips never bloom again.
  evidence_refs:
  - ev:15
  confidence: medium
  cautions: The passage stresses death and non-return; the death_rebirth taxonomy
    is only a broad family reference and the quatrain denies reblooming.
- id: motif:5
  label: Flowers associated with the dead
  taxonomy_refs:
  - death_rebirth
  - seasonal_cycle
  basis: Rose, tulip, and violet growth are linked to the blood or head of dead human
    figures.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The text does not explicitly state resurrection or transformation; it
    only associates flowers with prior human death.
- id: motif:6
  label: Single sacred sign as complete wisdom
  taxonomy_refs:
  - wisdom
  basis: The soul asks for heavenly lore, and the speaker says that knowing the Alif
    is enough; the note glosses this as knowledge of the One.
  evidence_refs:
  - ev:17
  confidence: high
  cautions: The theological interpretation of Alif comes from the supplied editorial
    note.
- id: motif:7
  label: Worldly fortune as deceptive destroyer
  taxonomy_refs: []
  basis: Dame Fortune is personified as smiling deceitfully, carrying a sharp scimitar,
    and giving a poisonous sweetmeat.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: No available taxonomy reference precisely matches the personified Fortune
    image.
- id: motif:8
  label: Human being as puppet under compulsion
  taxonomy_refs:
  - duality
  basis: The speaker says he came not by free will, goes against his wish, and remains
    a puppet.
  evidence_refs:
  - ev:18
  confidence: medium
  cautions: The duality reference is limited to the tension between free will and
    compulsion.
comparison_claims:
- id: claim:1
  claim: The supplied editorial note says quatrain 107 recalls the chorus in Oedipus
    Coloneus, supporting a cautious comparison around mortality and non-return.
  claim_level: same_motif
  target: chorus in Oedipus Coloneus
  evidence_refs:
  - ev:15
  counter_evidence_refs: []
  confidence: low
  limitations: The passage gives only the editorial comparison and does not quote
    the Greek chorus or specify the exact parallel.
- id: claim:2
  claim: The supplied editorial note links the Alif expression to Hafiz, saying Hafiz
    Ode 416 uses a similar expression about knowing the One.
  claim_level: linguistic_similarity
  target: Hafiz, Ode 416, expression about knowing the One
  evidence_refs:
  - ev:17
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison rests on the note’s statement; the Hafiz passage is
    not included here for independent comparison.
