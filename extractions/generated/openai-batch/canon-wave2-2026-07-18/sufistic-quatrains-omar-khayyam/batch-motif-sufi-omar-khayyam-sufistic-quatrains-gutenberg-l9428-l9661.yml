  quote: ''
  summary: The passage presents quatrains and notes on the world as a body animated
    by God, the cup and wine offered by an enchanting beloved or cupbearer, earthly
    pleasure amid uncertainty and mortality, critique of dogmatic searches for truth,
    prayer for pardon and release from self, and images of veil, wheel, turf, dust,
    bulls, river bank, tavern, and fortune.
