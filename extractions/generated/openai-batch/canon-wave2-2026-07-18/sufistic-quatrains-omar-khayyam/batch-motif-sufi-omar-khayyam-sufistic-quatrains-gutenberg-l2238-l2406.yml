candidate_motifs:
- id: motif:1
  label: Seasonal abundance against mortal transience
  taxonomy_refs:
  - seasonal_cycle
  basis: Roses bloom and vanish, spring and December fold the leaves of life, the
    moon cycles after human death, and the first summer month takes or fells royal
    figures.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The seasonal_cycle taxonomy is directly supported by seasonal and lunar
    imagery; the passage does not frame this as a formal death-and-rebirth myth.
- id: motif:2
  label: Wine and the cup as counsel under fleeting life
  taxonomy_refs:
  - wisdom
  basis: Repeated imperatives urge filling the cup, drinking wine, bringing wine,
    and treating sweet or bitter drink as secondary because life passes.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  - ev:10
  confidence: high
  cautions: The passage is from a Sufistic anthology, but this excerpt itself does
    not define wine as a mystical or esoteric symbol.
- id: motif:3
  label: Repentance cast off in spring
  taxonomy_refs:
  - wisdom
  basis: The addressee is told to fling the winter-garment of repentance into spring
    fire; parallel lines contrast repentance from goblet and cup with the season of
    roses and the abandonment of zealot practices.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: The metaphorical value of repentance, zealotry, and spring may vary by
    reading; the passage gives literary parallels rather than doctrinal explanation.
- id: motif:4
  label: Time as a flying bird
  taxonomy_refs: []
  basis: The passage uses the Bird of Time and explicitly notes that the image of
    the flight of time permeates the quatrains, with an Attar parallel of a bird fluttering
    along an appointed path.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The Attar line quoted is a literary parallel to the image; it is not presented
    as proof of direct borrowing.
- id: motif:5
  label: Worldly kingship relativized by wine, time, and simple joy
  taxonomy_refs:
  - wisdom
  basis: Kings are taken away by time and season; wine is judged better than kingdoms,
    crowns, empires, and thrones; wilderness joy with provisions is outside any Sultan's
    power.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:12
  - ev:14
  confidence: high
  cautions: This is extracted as a didactic-literary motif; the passage does not assign
    a mythic function to each named ruler.
- id: motif:6
  label: Wilderness companionship as paradise enough
  taxonomy_refs: []
  basis: A book of verses, wine, bread, and the singing companion in the wilderness
    are said to make the wilderness sufficient as paradise; the source parallel calls
    such wilderness sitting a joy beyond the Sultan.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: The companion is not identified in the passage as divine; no divine-beloved
    taxonomy is applied.
