canonical_text:
  quote: ''
  summary: Heron-Allen analyzes FitzGerald quatrains VII-XII and their Persian parallels.
    The passage presents rain-washed roses, a nightingale exhorting wine-drinking,
    spring opposed to repentance, time and life figured through a bird, wine, moon
    cycles, and falling leaves, the seasonal disappearance of roses and kings, the
    devaluation of royal power, and wilderness companionship with verses, wine, and
    bread as sufficient paradise.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A translated quatrain from O. 67 describes a temperate pleasant day, rain
    washing dust from roses, and a nightingale addressing a yellow rose with an exhortation
    to drink wine.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Quatrain VII tells the addressee to fill the cup, cast a winter-garment of
    repentance into the fire of spring, and notes that the Bird of Time has only a
    short way to flutter before being on the wing.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The commentary says quatrain VII is composite and that the image of the flight
    of time permeates the quatrains; it identifies a similar bird-flight image in
    Attar's Mantik ut-tair.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Parallel quatrains for VII include a speaker repenting of goblet and cup,
    then abandoning grief in the season of roses, and an instruction to bring wine
    and abandon zealot practices while flowers bloom.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Quatrain VIII contrasts Naishapur or Babylon and sweet or bitter drink, while
    stating that the Wine of Life oozes drop by drop and the Leaves of Life fall one
    by one.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A source quatrain for VIII says life passes, questions the importance of Baghdad
    and Balkh, urges wine-drinking, and says the moon will continue passing through
    the month after the speaker and addressee are gone.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A parallel for VIII shows a Saki holding a bottle and wine oozing over the
    rim of a cup.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The commentary states that the leaves of life recur as leaves of a tree or
    a book, and cites a vine leaf falling from a branch as FitzGerald's inspiration.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Quatrain IX connects daily roses, the vanished Rose of Yesterday, the first
    summer month, and the removal of Jamshyd and Kaikobad; cited parallels describe
    roses scattered to dust, leaves of life folded by seasonal return, and many Jams
    and Kais flung to earth.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Quatrain X and its parallels value cup or draught of wine above kingdoms,
    crowns, empires, and thrones.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: A cited source for quatrain X says not to bow the neck though Rustum son of
    Zal is an enemy and not to be grateful though Hatim Tai is a friend.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Quatrain XI places the speaker along a strip of herbage between desert and
    cultivated land, where the names of slave and sultan are forgotten, while Mahmud
    remains on a golden throne.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:13
  text: Quatrain XII imagines a book of verses beneath a bough, a jug of wine, a loaf
    of bread, and a singing companion in the wilderness, declaring that wilderness
    sufficient as paradise.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:14
  text: A source for XI-XII lists bread, a gourd of wine, mutton, and the speaker
    with the addressee in the wilderness as a joy beyond the power of any Sultan.
  category: relationship
  evidence_refs:
  - ev:14
