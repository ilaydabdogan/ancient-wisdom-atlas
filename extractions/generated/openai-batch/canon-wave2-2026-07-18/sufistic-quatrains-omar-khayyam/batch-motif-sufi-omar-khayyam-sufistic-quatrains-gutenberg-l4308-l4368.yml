  text: In C., a rising moon is described as waxing and waning repeatedly, looking
    through the same garden for the speaker's group and for one person in vain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The source version O. 5 says no one will guarantee tomorrow, urges making
    the lovesick heart happy now, and commands wine-drinking in moonlight because
    the moon will seek the group and not find them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: In CI., the speaker addresses the Saki and asks that, when the Saki passes
    among star-scattered guests on the grass and reaches the spot where the speaker
    made One, an empty glass be turned down.
