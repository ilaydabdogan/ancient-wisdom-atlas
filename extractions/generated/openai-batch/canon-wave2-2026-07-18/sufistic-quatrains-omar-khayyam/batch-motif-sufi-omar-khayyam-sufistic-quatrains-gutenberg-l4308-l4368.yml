  text: In XCIX., the speaker addresses Love and imagines conspiring with Him to grasp
    the entire scheme of things, shatter it, and remould it nearer to the heart's
    desire.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prose-introduced source version C. 395 states that if the speaker had
