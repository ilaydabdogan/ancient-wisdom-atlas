  summary: The passage gives editorial variant readings for stanzas XLIII-XLVIII.
    Images include an angel offering a dark drink at a river to the soul, a clay suburb,
    a tent for rest, Existence closing an account, ocean or seven seas compared with
    a pebble-cast, and a final sequence of annihilation, the Well of Life, setting
    stars, and a caravan moving toward the Dawn of Nothing.
