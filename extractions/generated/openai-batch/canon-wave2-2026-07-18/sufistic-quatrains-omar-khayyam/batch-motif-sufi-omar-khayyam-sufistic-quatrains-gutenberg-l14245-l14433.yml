candidate_motifs:
- id: motif:1
  label: Self-loss and union with the divine or whole
  taxonomy_refs:
  - annihilation_union
  basis: The speaker asks to be freed from himself, recommends forgetfulness of self,
    and gives the drop-ocean parable in which apparent separation is nearly illusory.
  evidence_refs:
  - ev:1
  - ev:9
  - ev:13
  confidence: high
  cautions: The passage uses lyric and symbolic speech; the exact doctrinal interpretation
    should be reviewed.
- id: motif:2
  label: Mystical seeking through wine, tavern, and intoxication
  taxonomy_refs:
  - mystical_quest
  basis: The speaker seeks preoccupation with God while repeatedly preferring wine,
    drunkenness, the tavern, and release from ordinary knowledge or devotion.
  evidence_refs:
  - ev:1
  - ev:9
  - ev:12
  confidence: medium
  cautions: The passage is a sequence of lyric counsels rather than a narrative quest
    with stages.
- id: motif:3
  label: Mortality and material transformation after death
  taxonomy_refs:
  - death_rebirth
  basis: Human bodies are imagined becoming turf, dust, bricks, kiln material, and
    a skull-pitcher; beautiful forms are also said to become cups and gourds.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:8
  - ev:10
  confidence: medium
  cautions: The transformation is physical and cyclical; explicit resurrection or
    spiritual rebirth is not stated.
- id: motif:4
  label: Life-giving beloved
  taxonomy_refs:
  - divine_beloved
  basis: An addressed figure's lips produce the water of life, and related stanzas
    invoke the Charm of the Heart, ruby lips, tresses, and a sweet-lipped friend.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  - ev:14
  confidence: medium
  cautions: The addressee shifts between divine, beloved, and companion language;
    a specifically divine beloved reading needs human review.
- id: motif:5
  label: Paradox of wisdom, knowledge, and good-and-bad duality
  taxonomy_refs:
  - wisdom
  - duality
  basis: The speaker asks to be freed from knowledge of good and bad, later treats
    good and bad as two bowls rolling in a ditch, and describes wise people as humble
    under the firmament.
  evidence_refs:
  - ev:1
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage often rejects or relativizes knowledge rather than presenting
    a straightforward wisdom teaching; duality is moral rather than personified.
- id: motif:6
  label: Sin, pity, punishment, and uncertain pardon
  taxonomy_refs:
  - divine_judgment
  basis: The speaker tests sin against divine pity, questions punishment for evil,
    and warns against relying upon pardon.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: No formal judgment scene or afterlife tribunal is narrated.
