canonical_text:
  quote: ''
  summary: A sequence of quatrains addresses God, friends, beloved figures, wine,
    death, sin, and cosmic uncertainty. The speaker asks to be freed from self and
    moral calculation, reflects on bodies becoming turf, bricks, and vessels, depicts
    ruined kingship and a questioning bird, repeatedly urges wine and forgetfulness,
    questions judgment and pardon, and closes with a parable of a drop separated from
    the ocean that is told separation is nearly illusory.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first-person speaker asks God to deliver him from worldly calculation,
    preoccupy him with God, free him from himself, and make him drunk so that he is
    freed from knowledge of good and bad.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Wheel of Heaven is said to continue after the deaths of the speaker and
    friend, and the friend is urged to sit on turf before new turf grows from their
    dust.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the loss of the souls of the speaker and friend, bricks are placed on
    their tombs, and their dust is imagined being thrown into a brick-maker's kiln
    to make bricks for other tombs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A once-splendid castle associated with sovereigns is shown as ruined, with
    a turtledove seated on the battlements crying a repeated question of where.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker asks what advantage comes from entering or leaving the world and
    asks where hopes and pure men have gone after being consumed under celestial fire
    and becoming smoke or dust.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: An addressed figure has lips said to secrete the water of life; the speaker
    objects to a cup kissing those lips and speaks of being soaked in the blood of
    the flask.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker says God made him and benefited him, then speaks about sin, pity,
    punishment for evil, and the danger of relying on pardon.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The speaker urges taking a cup and gourd, says moon-like idols have repeatedly
    become cups and gourds, and says wine is bought while the world is sold for two
    grains of barley.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Several quatrains recommend wine, joy, drunkenness, forgetfulness of self,
    and turning away from knowledge, devotion, religious prohibition, and fear.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The speaker states that life is brief or uncertain, that the envelope of being
    will be torn, that the skull may become a pitcher, and that the next breath may
    not be completed.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The firmament is described as an overturned porringer above human heads, while
    the cup and flask are described as lip to lip with blood flowing between them.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The speaker says he swept the tavern sill with his hair, stopped reflecting
    on good and bad in this world and the next, and saw them as two bowls rolling
    in a ditch while overcome with wine.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: A drop of water weeps because it is separated from the ocean; the ocean laughs
    and says that they are all and that separation is only by a nearly invisible point.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: The speaker advises not to be prey to sorrow, not to dwell on the dead, and
    to give the heart to a sweet-lipped, fairy-like friend while not being deprived
    of wine.
  category: speech
  evidence_refs:
  - ev:14
