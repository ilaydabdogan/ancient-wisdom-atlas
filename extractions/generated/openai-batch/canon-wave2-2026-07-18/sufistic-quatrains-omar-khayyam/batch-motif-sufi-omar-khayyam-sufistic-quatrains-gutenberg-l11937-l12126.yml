canonical_text:
  quote: ''
  summary: A sequence of quatrains exhorts listeners to free themselves from passion
    and greed, question their origin and destination, distrust worldly permanence,
    and drink wine in the face of mortality. The speaker argues with ideas of Paradise,
    Hell, divine mercy, predestination, formal piety, cosmic fate, and the passing
    of life, repeatedly invoking God, the cup, the moon, the wheel of heaven, and
    burial in wine and vine wood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker tells listeners to free themselves from passions and greed, become
    poor like a mendicant, and ask what they are, where they came from, what they
    are doing, and where they are bound.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The universe is described as a point in life, the Djeihoun/Oxus as a trace
    of tears and blood, Hell as a spark of worry, and Paradise as an instant of repose.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker addresses God as a sinful revolting slave and asks for divine
    will, light, control, pity, and benevolence.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker says he does not know whether the creator belongs to Paradise
    or Hell, but says he presently enjoys wine, a girl, a zither, and a green field,
    which he says are also found in the promised future Paradise.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Opponents from the left and right ask the speaker to abstain from wine because
    they call wine an enemy of religion; the speaker answers by saying he will drink
    it as the blood of an enemy.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Moonlight is said to cut the black robe of night, and the speaker urges drinking
    because the moon will continue shining on the earth after the present people are
    gone.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker says not to blame the wheel of the heavens for human good and
    bad, and says no shield can resist an arrow hurled by Destiny.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A heart without complete abstinence from earthly things is pitied; a heart
    free from care can be joyous, and joy is associated either with seeking God's
    will or with taking a cup of wine.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The speaker says God fashioned the clay of his body, knew his actions in advance,
    and asks why he should burn in hell-fire at the last day if his sins were not
    committed without God's orders.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The speaker says one should adore the All-Powerful rather than days, and says
    there is no difference between days with respect to drinking wine.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The speaker asks why the first sinner was thrown out of terrestrial Paradise,
    and defines mercy as pardon given while he remains a sinner.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The speaker tells a listener to leave knowledge, take the cup, stop worrying
    about Paradise and Hell, seek the Koocer, sell a silken turban for wine, and wear
    a simple woolen band identified as an emblem of Sufism.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The speaker identifies himself as the torch of joy and the cup of Djem, and
    says that once the torch is extinguished or the cup broken, he is nothing.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: The speaker calls for dancers, wine, and the gourd, and names a head lost
    in wine, an amorous girl, and the noise of dawn as dear things in this world.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Life is said to slip away; the soul must pass through the lips; the moon will
    continue its phases after the speaker and addressee; life is likened to a passing
    caravan, and night is said to slip away.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The maker of the world's foundations and the wheel of the heavens is said
    to have afflicted the human heart and buried many beautiful lips and locks of
    hair in earth and dust.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: Careless people are warned not to be duped by the world, and are told to seek
    a friend identified in brackets as God and to drink wine quickly.
  category: speech
  evidence_refs:
  - ev:17
- id: obs:18
  text: The speaker asks companions to pour wine to change his face from amber-yellow
    to ruby-colored; after death he wants to be washed in wine and placed in a coffin
    and bier made from vine wood.
  category: speech
  evidence_refs:
  - ev:18
