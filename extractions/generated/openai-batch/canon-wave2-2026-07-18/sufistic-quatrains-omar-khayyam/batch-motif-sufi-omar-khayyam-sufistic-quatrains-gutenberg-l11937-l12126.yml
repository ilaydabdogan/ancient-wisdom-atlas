candidate_motifs:
- id: motif:1
  label: Self-emptying and inquiry into origin and destination
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: The passage opens by commanding release from passions and greed, mendicant
    poverty, and inquiry into what one is, where one comes from, and where one is
    bound.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is exhortative lyric rather than a full narrative quest.
- id: motif:2
  label: Wine and cup as recurring counterpoint to religious anxiety
  taxonomy_refs: []
  basis: Wine, the cup, and drinking recur in settings involving Paradise, Hell, critics
    of religion, joy, the Koocer, dawn, seeking God, and burial.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:8
  - ev:12
  - ev:14
  - ev:17
  - ev:18
  confidence: high
  cautions: The passage often treats wine literally; mystical symbolism should not
    be assumed beyond explicit Sufi and divine references in the passage.
- id: motif:3
  label: Divine mercy contested against obedience, sin, and judgment
  taxonomy_refs:
  - divine_judgment
  basis: The speaker asks whether Paradise as a reward for obedience is merely a debt,
    questions hell-fire under divine predestination, and defines mercy as pardon of
    a sinner.
  evidence_refs:
  - ev:3
  - ev:9
  - ev:11
  confidence: high
  cautions: The quatrains present argument and prayer rather than a narrated judgment
    scene.
- id: motif:4
  label: Predestination and human culpability
  taxonomy_refs:
  - divine_judgment
  basis: The speaker says God fashioned his clay, knew his acts, and that his sins
    were not committed without divine orders, then questions punishment in hell-fire.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: Only the speaker's rhetorical position is present; no doctrinal resolution
    is supplied.
- id: motif:5
  label: Cosmic cycles outlasting human life
  taxonomy_refs: []
  basis: The moon shines after the present generation, passes through phases after
    the speaker and addressee, and is paired with images of slipping life, night,
    and buried beauty.
  evidence_refs:
  - ev:6
  - ev:15
  - ev:16
  confidence: high
  cautions: No explicit seasonal or resurrection cycle is stated.
- id: motif:6
  label: God as friend within the path of love
  taxonomy_refs:
  - divine_beloved
  basis: The wheel of heaven is said to be embarrassed in the path of divine love,
    and careless people are told to seek a friend identified as God.
  evidence_refs:
  - ev:7
  - ev:17
  confidence: medium
  cautions: The identification of the friend as God and the phrase divine love appear
    in editorial brackets in the supplied passage.
- id: motif:7
  label: Funeral consecrated by wine and vine
  taxonomy_refs: []
  basis: The speaker asks to be washed in wine after death and to have a coffin and
    bier made from vine wood.
  evidence_refs:
  - ev:18
  confidence: high
  cautions: The passage states death and burial wishes but does not state rebirth
    or resurrection.
