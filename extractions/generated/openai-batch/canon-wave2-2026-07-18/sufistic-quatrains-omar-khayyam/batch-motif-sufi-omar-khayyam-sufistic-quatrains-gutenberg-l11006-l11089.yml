  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Near Mount Alamout, Sandjar awakens to find a dagger sunk in the earth near
    his bed's bolster, with its blade piercing a note addressed to him.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: The note warns Sandjar that the same hand which set the dagger in the earth
