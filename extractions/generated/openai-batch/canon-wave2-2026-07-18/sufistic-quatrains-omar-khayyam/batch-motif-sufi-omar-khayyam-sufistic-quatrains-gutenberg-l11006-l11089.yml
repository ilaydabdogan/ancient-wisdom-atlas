canonical_text:
  quote: ''
  summary: The passage narrates Nizam-el-Moulk's court stratagem against Hassan-Sebbah,
    Hassan's disgrace and withdrawal from court, his journey to Syria and later recruitment
    of followers in Persia, his fortification at Alamout, the death and assassination
    of Nizam-el-Moulk, Hassan's violent expansion, and Sultan Sandjar's abandonment
    of an attack after finding a dagger and warning note by his bed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nizam-el-Moulk waits in a corner of the audience hall for the result of his
    stratagem.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Alp-Arslan's signal, Hassan-Sebbah places a fhrist, described as a little
    book or index, at the monarch's feet and uses it with leaflets in a defter taken
    from a trusted helper.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the first call, Hassan fails to find the desired leaflet, becomes troubled
    and confused, and is forced to retire after Alp-Arslan reprimands him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nizam-el-Moulk then tells the King that regularity could hardly be expected
    from so serious a work done hastily by incapable people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: After the check at court, Hassan never again appears there, travels to Syria,
    adopts the dogmas of the Ishmaelite sect, and resolves to import them into Persia
    with additional novelties aligned with Sufi opinions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hassan returns to Persia while concealing himself from Nizam-el-Moulk, lives
    at Ispahan and Rhei, gathers recruits, neophytes, and malcontents, and forms a
    project to make the sovereign tremble on his throne.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: Hassan goes with a limited number of disciples to the mountain of Alamout
    near Kazbin, fortifies himself there, and raids the surrounding country to provide
    for and equip his troop.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Alp-Arslan dies, leaves his estates to Malek-Chah, and recommends that Malek-Chah
    entrust administration to Nizam-el-Moulk.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Malek-Chah, listening to calumnious reports, removes Nizam-el-Moulk's turban
    and inkstand, described as insignia of high functions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Nizam-el-Moulk is found under his tent in the royal camp, assassinated by
    a satellite of Hassan-Sebbah; before dying, he writes a verse to Malek-Chah recommending
    his twelve sons.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Hassan-Sebbah continues violent excursions, kills without regard to rank or
    sex, and causes trouble and confusion across the empire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Malek-Chah sends troops against Hassan, but Hassan's followers increase and
