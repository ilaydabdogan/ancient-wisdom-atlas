canonical_text:
  quote: ''
  summary: The passage presents and comments on several quatrains attributed to Omar
    Khayyam in a Sufi-oriented anthology. It includes images of a momentary taste
    of Being from a well in a waste, a caravan of life reaching Nothing, a secret
    divided from truth by a hair or an Alif, an elusive Presence taking all forms
    while remaining, a divine spectacle contrived and watched by itself, a question
    about knowing after self-abandonment, and a turn from intellectual dispute toward
    grape, wine, and the personified Daughter of the Vine.
  language: English
  quote_policy: summarized
