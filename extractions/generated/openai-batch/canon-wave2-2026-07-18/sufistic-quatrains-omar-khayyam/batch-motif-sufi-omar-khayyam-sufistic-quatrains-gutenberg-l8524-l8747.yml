canonical_text:
  quote: ''
  summary: A sequence of quatrains and notes presents speaking cups in a potter's
    shop; encounters with wine, sages, Khizir, Elias, and divine mercy; reflections
    on creeds, forgiveness, fate, the Creator as potter, the wheel of heaven, mortality,
    illusion, love, and the difficult quest for Truth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a potter's shop, a company of cups is seen conversing, and one cup asks
    who made, sells, and buys the crockery.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A speaker leaving a tavern sees a sage carrying a great wine-jug; when asked
    about shame, the sage answers that Allah has boundless mercy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wine is called life's fount; Khizir is named its guardian, and the speaker
    likens himself to Elias in finding it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage instructs drinking wine by day and night with music, spilling
    one drop and drinking the rest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker rejects the seventy-three creeds except the creed of loving the
    divine addressee.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker asks for virtues to be counted sparingly, sins to be forgiven
    by the score, and faults not to kindle divine wrath.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that fate is fixed and grief cannot defeat or cheat coming
    ill.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: A chalice made with profound wit and crowned with signs of the Maker's favor
    is dashed to pieces by the world's Potter.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Wine is described as a spirit or limpid soul inside the earthenware of the
    cup.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: The wheel of heaven is addressed as feeling no ties of bread or salt and as
    flaying the speaker.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Dawn breaks and rends night's canopy; the speaker urges a morning draught
    because many dawns will come when the speakers are absent.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: A warning addresses people who do not tremble at hell fires or wash in remorse's
    water; death's winds will quench the vital torch, and earth may expel guilty dust.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The world is called a hollow pageant, vain illusion, and baseless dream; wise
    men are said to know that things are not what they seem.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: Wine-cups are to be shared with maidens compared to cypresses and roses before
