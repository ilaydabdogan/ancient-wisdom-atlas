  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: Love shines forth, overcomes the speaker, leaves the tongue dumb while the
    heart speaks, and the speaker dies of thirst beside water-brooks.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: Truth is said not to be shown to lofty thought or bought with gold; yielding
