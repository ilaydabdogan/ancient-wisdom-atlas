- id: motif:2
  label: creator as potter breaking a formed vessel
  taxonomy_refs: []
  basis: A chalice praised as a Maker-favored masterpiece is dashed to pieces by the
    world's Potter.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The divine identity of the 'world's Potter' is metaphorical but strongly
    suggested by the paired phrase 'Maker's favour.'
- id: motif:3
  label: wine as life-giving fount or water of life
  taxonomy_refs:
  - mystical_quest
  basis: Wine is called life's fount, guarded by Khizir, and linked in the note with
    Elias's discovery of the water of life.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The text equates wine with the fount; the taxonomy link to mystical quest
    is supported by the life-fount search imagery but remains broad.
- id: motif:4
  label: divine beloved beyond creeds
  taxonomy_refs:
  - divine_beloved
  basis: The speaker says that among the seventy-three creeds he holds only the creed
    of loving the divine addressee, rendering faith, unfaith, obedience, and sin secondary.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The addressee is not named in the quatrain, though the devotional address
    is explicit.
- id: motif:5
  label: plea for divine mercy against wrath and sin
  taxonomy_refs:
  - divine_judgment
  basis: The speaker asks that sins be forgiven, faults not kindle divine wrath, and
    forgiveness be granted by Muhammad's tomb.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage emphasizes mercy more than formal judgment.
- id: motif:6
  label: fixed fate and unavoidable death
  taxonomy_refs: []
  basis: Fate is said to be fixed; grief cannot alter coming ill; Death's winds and
    blasts extinguish bodily life; the knot of death remains unsolved.
  evidence_refs:
  - ev:7
  - ev:12
  - ev:14
  - ev:17
  confidence: high
  cautions: This is a recurring reflective theme across adjacent quatrains rather
    than a single narrative episode.
- id: motif:7
  label: world as illusion or dream
  taxonomy_refs:
  - wisdom
  basis: The world is called a hollow pageant and baseless dream, and wise men are
    said to know appearances are deceptive.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The taxonomy reference is broad; the passage's own language supports an
