canonical_text:
  quote: ''
  summary: The passage presents three quatrain units. One laments the passing of spring,
    the rose, youth, and a nightingale or bird of joy. Another wishes for a fountain
    or place of repose for a fainting traveller and imagines renewed blossoming like
    verdure after a long time. A third wishes that an angel, writer, recorder, or
    God might alter the roll or book of fate, erase a name, inscribe it differently,
    or improve the speaker’s condition.
