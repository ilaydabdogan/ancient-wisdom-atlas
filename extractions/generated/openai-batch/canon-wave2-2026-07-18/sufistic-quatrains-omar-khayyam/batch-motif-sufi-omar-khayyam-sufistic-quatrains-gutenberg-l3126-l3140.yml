  summary: A quatrain says that when an Angel associated with a darker drink finds
    the addressee by a river-brink and offers a cup, inviting the soul to come forth
    to the lips and drink, the addressee should not shrink. A note says the quatrain
    derives from C. 256, where a cup in the invisible depths of the firmament is made
    available for all to drink in due time; when one's turn arrives, one should not
    lament but drink wine gaily.
