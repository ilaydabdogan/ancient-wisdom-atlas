canonical_text:
  quote: ''
  summary: The passage presents quatrains and notes in which the soul is urged to
    cast off bodily dust and ascend; the body is likened to a temporary tent occupied
    by a Sultan-like soul before death and fate remove it; existence is imagined as
    a bowl or goblet from which the Eternal Saki pours innumerable bubble-like lives;
    and human coming and departure are described as insignificant before the continuing
    world, with death figured as passing behind a veil or curtain of divine secrets.
  language: English
