canonical_text:
  quote: "“I am a Sufi and not ambitious”"
  summary: Nizam-el-Moulk, at the height of power, is visited by Khayyam and Hassan-Sebbah,
    who recall a contract among the three. Khayyam asks for the revenues of his native
    village so he may live as a Sufi poet and contemplative. Hassan asks for a place
    at court. Nizam grants both requests. Hassan gains favor with the monarch, envies
    Nizam, accuses him of mismanaging finances, and offers to prepare the accounts
    in forty days. Nizam counters by bribing Hassan’s confidant through a loyal favorite,
    who disorders the leaves of Hassan’s financial record before its official presentation.
  language: English
  quote_policy: quoted
