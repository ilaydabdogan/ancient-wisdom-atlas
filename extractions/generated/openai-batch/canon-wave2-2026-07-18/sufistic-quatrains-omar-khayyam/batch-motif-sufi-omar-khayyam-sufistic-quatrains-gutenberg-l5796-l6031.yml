candidate_motifs:
- id: motif:1
  label: brief life and present enjoyment
  taxonomy_refs:
  - wisdom
  basis: Several quatrains define life as a breath, a day or two, or something that
    soon deceases, and counsel present use rather than trust in tomorrow.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The taxonomy reference is broad; the passage gives gnomic counsel rather
    than a narrative wisdom tale.
- id: motif:2
  label: predestination and futility of resistance
  taxonomy_refs: []
  basis: The passage figures fate as heaven's wheel, dice, and writing on a tablet,
    and says human cunning cannot resist God's will or fate.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: high
  cautions: No specific taxonomy family in the supplied list directly names predestination.
- id: motif:3
  label: divine beloved longing
  taxonomy_refs:
  - divine_beloved
  basis: The passage says no heart is not torn from Thee and no soul does not pine
    for Thee; an editor's note also identifies the love in another quatrain as real
    love of God.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The divine addressee is represented lyrically, not through a narrative
    encounter.
- id: motif:4
  label: mystical secrecy and station
  taxonomy_refs:
  - mystical_quest
  basis: The speaker claims knowledge of a mystery but says he cannot unfold the secrets
    of the station where he dwells; the note glosses the state as ecstasy.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage names a hidden station but does not narrate a full quest sequence.
- id: motif:5
  label: death yielding immortality and new life
  taxonomy_refs:
  - death_rebirth
  - resurrection
  - annihilation_union
  basis: Death is said to yield the tree of immortality; 'Isa breathes new life into
    the soul; the editor connects the verse with the Sufi doctrine of subsistence
    after annihilation.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The quatrain gives a compressed doctrinal image rather than a full resurrection
    narrative.
- id: motif:6
  label: human remains as vessel or dust of former beauty
  taxonomy_refs: []
  basis: A jug is imagined as formerly loving and embracing a waist, and dust underfoot
    is possibly the former apple of a beauty's eye.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The imagery suggests transformation or remembrance of the dead, but it
    does not explicitly narrate rebirth.
- id: motif:7
  label: universal prayer across religious forms
  taxonomy_refs: []
  basis: Pagodas, mosques, church-bells, church, Ka'ba, rosary, and cross are all
    described as diverse tongues of world-wide prayer.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is a doctrinal or comparative statement within the quatrain rather
    than a mythic episode.
- id: motif:8
  label: wine and tavern counsel before death
  taxonomy_refs:
  - wisdom
  basis: The passage repeatedly advises drinking wine or lifting cups in response
    to life's bitterness, mortality, and the long sleep to come.
  evidence_refs:
  - ev:5
  - ev:11
  confidence: medium
  cautions: The passage supports the literal imagery; any further allegorical reading
    of wine should be reviewed.
- id: motif:9
  label: mercy reserved for sinners
  taxonomy_refs: []
  basis: The passage states that one who does not sin can make no claim to mercy and
    that mercy was made for sinners.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The passage gives a compact theological aphorism without a judgment scene.
comparison_claims:
- id: claim:1
  claim: The editor explicitly compares the 'wheel of heaven' image to Sir Thomas
    Browne's phrase 'wheel of things,' while glossing it as destiny or fortune.
  claim_level: visual_similarity
  target: Sir Thomas Browne's 'wheel of things'
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The note supplies a literary comparison only; it does not assert borrowing
    or historical contact.
- id: claim:2
  claim: The editor compares the quatrain's middle state between drunkenness and sobriety
    to the Epicurean golden mean and cites Ecclesiastes vii.16-17.
  claim_level: same_function
  target: Epicurean golden mean and Ecclesiastes vii.16-17
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is editorial and thematic; the quatrain itself does
    not name Epicureanism or Ecclesiastes.
- id: claim:3
  claim: The editor compares the image of God making and destroying cups to Job's
    statement that divine hands made and yet destroy the speaker.
  claim_level: same_function
  target: 'Job: ''Thy hands have made me, yet thou dost destroy me'''
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison rests on the editor's note and a shared making/destroying
    pattern, not on a demonstrated textual relationship.
- id: claim:4
  claim: The editor identifies the death-immortality quatrain with the Sufi doctrine
    of Baka ba'd ul fana and refers to Gulshan i Raz.
  claim_level: same_motif
  target: Sufi doctrine of Baka ba'd ul fana in Gulshan i Raz
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: high
  limitations: The quatrain is brief; the doctrinal identification is supplied by
