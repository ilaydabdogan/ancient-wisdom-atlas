  quote: ''
  summary: A sequence of quatrains reflects on brief life, death, fate, divine love,
    the soul's embodiment and departure, wine and the tavern, universal prayer across
    religious forms, predestination, mystical secrecy, mercy for sinners, and death
    yielding immortality through new life breathed by 'Isa.
  language: English
  quote_policy: summarized
