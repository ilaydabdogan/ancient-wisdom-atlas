canonical_text:
  quote: ''
  summary: A sequence of quatrains and editorial notes treats longing for union with
    an absent love, dawn tavern scenes, wine as relief from sorrow, predestination,
    divine judgment, complaints against heaven and Fortune, annihilation or naughtness
    of existence, the human being as a body-soul composite and microcosm, Adamic dust
    in a potter’s clay, and moral counsel about lust, religious speech, justice, and
    despair.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he sighs in vain for union with his love, suffers the pangs
    of absence, and cannot tell his grief to a friend.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At dawn the speaker hears the Muezzin’s call while standing before the vintner’s
    hall, and tells devotional talk to be still.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: An addressed joyful angel is asked to pour wine and sing of Jemshids and Khosraus
    who have died under the rolling months.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker asks that revellers not be frowned on and says that if someone
    is doomed to hell, drinking or not drinking will not alter the result.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker wishes Allah would rebuild the skies and earth, erase his name
    from a roll, or relieve his necessities.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:6
  text: The speaker asks the Lord for a flowing cup of bounty, unbegged-for bread,
    and wine that makes him beside himself and frees him from woe.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:7
  text: Omar is addressed as having a burning heart and as perhaps destined to burn
    in hell and feed its fires; he is warned not to teach Allah clemency.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:8
  text: An editorial note reports that after death Omar appeared to his mother in
    a dream and repeated the quatrain about hell and Allah’s clemency.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: The speaker says a person’s lot was settled yesterday without asking permission;
    the editorial note labels this predestination.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:10
  text: The speaker says he would not have come if asked, would prefer not to go if
    asked, and would annihilate all coming, being, and going if asked.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:11
  text: Man is compared to a cup with soul as wine, flesh to a pipe with spirit as
    voice, and man to a magic lantern with light inside.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:12
  text: The speaker sees a potter pounding earth and pottery shreds, and with insight
    thinks the material is Adam’s dust.
  category: action
  evidence_refs:
  - ev:15
- id: obs:13
  text: A mystery from the spirit world states that creation is summed up in man,
    who includes angel, demon, man, and beast; the note calls this man as microcosm.
  category: attribute
  evidence_refs:
  - ev:19
- id: obs:14
  text: The wheel of heaven and Dame Fortune are accused of supplying or cherishing
    base and bad people while making good people suffer poverty and annoyance.
  category: speech
  evidence_refs:
  - ev:14
  - ev:17
  - ev:21
- id: obs:15
  text: The speaker warns that carnal lusts wear out the spirit and will sooner or
    later destroy the soul.
  category: speech
  evidence_refs:
  - ev:18
- id: obs:16
  text: The speaker advises speaking well of Moslem, Christian, and Jew in order to
    be esteemed and avoid criticism.
  category: speech
  evidence_refs:
  - ev:20
- id: obs:17
  text: The speaker counsels abandoning grief and despair, being just in an unjust
    world, and thinking oneself naught because the issue of the world is naught.
  category: speech
  evidence_refs:
  - ev:22
