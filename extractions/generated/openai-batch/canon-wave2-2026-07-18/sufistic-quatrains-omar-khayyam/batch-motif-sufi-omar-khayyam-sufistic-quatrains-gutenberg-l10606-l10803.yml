  claim: The editor links the quatrain’s statement about some being doomed to hell
    with Qur’an xvi.38 on Allah guiding some and others being doomed to err.
  claim_level: same_function
  target: Qur’an xvi.38 as cited in the note to quatrain 485
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
