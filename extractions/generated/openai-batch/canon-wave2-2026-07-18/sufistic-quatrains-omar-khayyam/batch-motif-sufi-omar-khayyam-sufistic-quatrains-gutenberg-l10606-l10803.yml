  limitations: The passage gives only the editor’s brief citation and does not quote
    or analyze the wider Qur’anic context.
- id: claim:2
  claim: The editor compares the speaker’s rejection of coming, going, and being with
    Ecclesiastes’ expression of hatred for life.
  claim_level: same_function
  target: Ecclesiastes, cited only as 'Therefore I hated life' in the note to quatrain
    490
  evidence_refs:
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to an editorial note and a short cited phrase;
    no detailed textual alignment is provided.
