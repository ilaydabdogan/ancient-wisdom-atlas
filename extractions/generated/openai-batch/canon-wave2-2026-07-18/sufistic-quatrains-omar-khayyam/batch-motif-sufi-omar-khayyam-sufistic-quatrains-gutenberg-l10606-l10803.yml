candidate_motifs:
- id: motif:1
  label: Longing for union with an absent beloved
  taxonomy_refs:
  - divine_beloved
  basis: The speaker explicitly seeks union with love and suffers absence.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The beloved is not explicitly called divine in the quatrain; the taxonomy
    link relies on the Sufi source context and union language.
- id: motif:2
  label: Tavern wine opposed to formal piety
  taxonomy_refs: []
  basis: The dawn Muezzin’s call is juxtaposed with the speaker’s presence at the
    vintner’s hall and command to silence devotional talk.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage gives the juxtaposition literally; any deeper doctrinal reading
    would require external context.
- id: motif:3
  label: Wine as consolation or self-forgetfulness
  taxonomy_refs: []
  basis: The speaker asks for wine to become beside himself and stop the headache
    of woe, and the Saki brings wine when his mood is sad.
  evidence_refs:
  - ev:7
  - ev:16
  confidence: high
  cautions: The passage does not specify whether the wine is literal, symbolic, or
    both.
- id: motif:4
  label: Predestined lot and divine judgment
  taxonomy_refs:
  - divine_judgment
  basis: The quatrains speak of being doomed to hell, having one’s lot fixed beforehand,
    and being unable to instruct Allah in clemency.
  evidence_refs:
  - ev:4
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage emphasizes predestination and judgment, but does not provide
    a full doctrinal exposition.
- id: motif:5
  label: Posthumous return in a dream
  taxonomy_refs:
  - return
  basis: The Persian preface note reports that Omar appeared to his mother in a dream
    after death and repeated a quatrain.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: This motif occurs in an editorial note about the preface, not in the quatrain
    text itself.
- id: motif:6
  label: Annihilation or naughtness of existence
  taxonomy_refs:
  - annihilation_union
  basis: The speaker says he would annihilate coming, being, and going, and later
    advises thinking oneself naught because the issue of the world is naught.
  evidence_refs:
  - ev:11
  - ev:22
  confidence: medium
  cautions: The passage states annihilation and naughtness but does not explicitly
    state union; the taxonomy link is partial.
- id: motif:7
  label: Human being as microcosm
  taxonomy_refs:
  - wisdom
  basis: A note explicitly identifies man as microcosm, and the quatrain says creation
    is summed up in man, who includes angel, demon, man, and beast.
  evidence_refs:
  - ev:19
  confidence: high
  cautions: The available taxonomy lacks a dedicated microcosm category; the wisdom
    link is broad.
- id: motif:8
  label: Body as vessel or instrument for inner soul or spirit
  taxonomy_refs: []
  basis: Man is likened to a cup holding soul as wine, flesh to a pipe holding spirit
    as voice, and a magic lantern holding light.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage presents analogies rather than a narrative episode.
- id: motif:9
  label: Adamic dust reused by the potter
  taxonomy_refs: []
  basis: The speaker sees a potter working earth and pottery shreds and thinks, with
    insight, that the material is Adam’s dust.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: The passage does not narrate a full creation scene; it presents an insight
    about material being worked by a potter.
- id: motif:10
  label: Fall of kings under time
  taxonomy_refs: []
  basis: The joyful angel is asked to sing how Jemshids and Khosraus bit the dust,
    overwhelmed by rolling months from Tir to Dai.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage uses royal mortality as an example; it does not develop a
    full royal-legitimacy or seasonal-cycle myth.
- id: motif:11
  label: Unjust heaven or Fortune favoring the bad
  taxonomy_refs: []
  basis: The wheel of heaven and Dame Fortune are accused of rewarding base or bad
    people while burdening good people and the speaker.
  evidence_refs:
  - ev:14
  - ev:17
  - ev:21
  confidence: high
  cautions: The figures are personifications in complaint poems; no independent mythic
    narrative is supplied.
