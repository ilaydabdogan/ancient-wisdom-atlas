canonical_text:
  quote: ''
  summary: A sequence of quatrains counsels the heart, soul, and friends to live joyously,
    practice charity and non-harm, drink wine amid the shortness of life, and accept
    destiny. The passage presents images of the world as a temporary house, beings
    as dust and clay, wine as the blood of the vine and an antidote to grief, water
    as a past world-destroying force, the divine or transcendent Thou as unreachable
    despite being named and seen, and death as a long road from which none return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The heart is told to imagine the world as a furnished house or domain of disorder,
    to live joyously, and to realize it rests there only briefly before rising and
    going away.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker summarizes religious obligation as duty toward the Divinity, sharing
    bread, avoiding evil speech, rendering evil to no one, and then asks for wine
    while promising a future life.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says water once ruined the world by annihilating it, and the speaker
    answers this by urging drowning oneself in wine and living in drunkenness.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wine is requested from a ruby vessel into a crystal cup, while all beings
    are described as dust that can disappear in a two-day tempest.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A transcendent Thou is addressed as the object of a quest that leaves both
    dervish and rich without means of reaching Thee; all speak the name but are deaf,
    and all see the presence but are blind.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
