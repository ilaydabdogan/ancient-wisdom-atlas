canonical_text:
  quote: ''
  summary: Section XXXII presents a first-person speaker before a door without a key
    and a veil that cannot be seen through; after brief talk of “ME and THEE,” both
    terms cease. The notes compare this with quatrains about the secret of Eternity,
    a curtain, and inaccessible fate or destiny. Section XXXIII depicts Earth, seas,
    and Heaven as unable to answer, with seas mourning their Lord; the note says this
    was taken from Attar’s Mantik ut-tair story in which a spiritual observer questions
    the blue, mourning, boiling sea, and the sea says it grieves separation from the
    Friend.
  language: English
  quote_policy: summarized
