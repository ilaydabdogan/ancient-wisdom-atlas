canonical_text:
  quote: ''
  summary: A sequence of translated quatrains and editorial notes presents Ramazan
    abstinence, the world as a temporary lodging and ruin of former kings, repeated
    exhortations to drink wine and enjoy spring, music, and companionship, reflections
    on flowers arising from dust, wine as enduring essence through changing forms,
    distrust of the multitude, the nothingness of worldly life, a sage entering a
    wine-house with a prayer mat, the body as a tent for spirit, death as tent-pitcher
    and cutter, and human departure toward unknown divine secrets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note states that Ramazan is the “Mahammadan Lent,” and quatrain 69 says
    wine and kisses must be foregone during Ramazan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The world is described as a caravanserai, a pied pavilion of night and day,
    a feast where many Jamshids sat, and a couch where many Bahrams lay.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker urges the addressee to grasp goblets and drink while roses bloom,
    because Time is a treacherous foe and another such day may not be seen.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A palace once ruled by Bahram is now a place where wild roes give birth and
    tigers stray; the hunter king is described as prey to death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tears fall from gloomy skies; drink is linked with flowers blooming; the speaker
    says his dust may later yield flowers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Friday is identified as the day of assembly or Sabbath, and the speaker urges
    drinking two bowls instead of one.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Wine is said to sustain myriad forms and take the shapes of plants and creatures,
    while its essence remains after forms perish; the note says wine means the divine
    Noumenon.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: One speaker says the people’s fire bears only smoke, fate makes him lift his
