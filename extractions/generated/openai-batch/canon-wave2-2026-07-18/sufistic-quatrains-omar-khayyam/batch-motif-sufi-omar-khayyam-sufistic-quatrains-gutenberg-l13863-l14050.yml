canonical_text:
  quote: ''
  summary: A sequence of quatrains reflects on humanity’s place in creation, wine
    and intoxication, tavern life, religious law, Ramadan, worldly hardship, mortality,
    seasonal pleasure, the cupbearer, and paradoxes of lawful and prohibited conduct,
    joy and sorrow, wisdom and ignorance, and return to earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says that humans are the aim of universal creation and compares
    the world to a ring whose jeweled signet is the human group.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Drunkenness is described as transporting the speakers from misery to joys,
    raising their heads to the skies, freeing them from the body, and returning them
    to the earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speakers are repeatedly associated with wine; wine animates their society,
    and they call themselves adorers of wine.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the season of roses, the speaker wishes to infringe the law of the Koran
    in the company of fair companions, spreading rose-colored wine over green turf.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker imagines being in a green prairie with beauties, partaking of
    green hasheesh before going under the earth covered with green sod.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'The passage pairs ordinary food and drink with grief: water is followed by
    a bitter beverage, and bread dipped in salt is followed by reopened wounds of
    the heart.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker advises quiet conduct in a tavern and says to sell the turban
    and the Koran to buy wine, passing through the mosque school without stopping.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: At dawn the speaker goes to the tavern among kalendar hypocrites and asks
    the master of concealed secrets to grant faith if prayer is desired.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The speakers hold the Koran in one hand and the cup in the other, alternating
    between what is lawful and what is prohibited, and say they are neither completely
    infidel nor absolutely Musulman.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: A salutation is sent to Mostapha asking why whey is lawful while wine is prohibited;
    another salutation to Khayyam says wine is lawful for intelligent men and prohibited
    only to the ignorant.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: An addressee is warned to consider the terrible day and last breath, and another
    addressee is told to take wine from the hand of the eternal cupbearer to be freed
    from cares of this world and the other.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage describes life as a walk around a circle without end and distinguishes
    those who understand its good and bad sides from those who do not know themselves
    or worldly things.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Joy, sorrow, and pain are declared identical for one who accounts for human
    ills, and the good and bad of the world are said to end one day.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: When the nightingale is heard and roses blossom, the addressee is urged to
    seize a ruby cup of wine and take revenge for endured torments for two or three
    days.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: A clay cup is said to possess a soul, and wine is described as diaphanous
    water shot with liquid fire.
  category: object
  evidence_refs:
  - ev:15
- id: obs:16
  text: During Ramadan, the speaker says the hardship of fasting has turned days and
    nights around, leading him to think he is eating the morning repast.
  category: speech
  evidence_refs:
  - ev:16
