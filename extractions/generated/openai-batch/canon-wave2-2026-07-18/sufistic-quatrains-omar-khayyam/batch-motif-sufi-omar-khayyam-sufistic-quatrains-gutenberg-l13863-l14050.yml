candidate_motifs:
- id: motif:1
  label: Humanity as creation’s central signet
  taxonomy_refs:
  - world_center
  basis: The human speaker group is named as the aim of creation and as the jeweled
    signet of the world-ring.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage uses a centralizing image but does not describe a literal
    geographic world center.
- id: motif:2
  label: Intoxication as ascent and release from bodily bondage
  taxonomy_refs:
  - ascent
  basis: Drunkenness raises the speakers’ heads to the skies and frees them from thraldom
    to the body before return to earth.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not specify whether the ascent is literal, emotional,
    or mystical.
- id: motif:3
  label: Cup from eternal cupbearer as release from cares
  taxonomy_refs:
  - mystical_quest
  basis: The addressee is told to take wine from the eternal cupbearer and thereby
    be freed from the cares of this world and the other.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The spiritual function is suggested by release from both worlds, but the
    passage also presents wine in concrete social terms.
- id: motif:4
  label: Paradox of sacred law and prohibited pleasure
  taxonomy_refs:
  - duality
  basis: The speakers hold the Koran and cup together, alternate between lawful and
    prohibited, and are neither wholly infidel nor wholly Musulman.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The extraction records the explicit paradox without resolving doctrinal
    meaning.
- id: motif:5
  label: Seasonal garden pleasure before burial
  taxonomy_refs:
  - seasonal_cycle
  basis: Rose season, nightingale song, blossoms, wine, green turf, and green sod
    frame short-lived enjoyment before going under earth.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:14
  confidence: medium
  cautions: The seasonal imagery is explicit; its ritual or calendrical significance
    is not specified.
- id: motif:6
  label: Return to earth and ensouled clay vessel
  taxonomy_refs: []
  basis: The speakers return to earth, the speaker anticipates going under sod, and
    a clay cup is said to possess a soul.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:15
  confidence: medium
  cautions: The passage does not explicitly say the clay cup was made from a dead
    person or describe rebirth.
- id: motif:7
  label: Wisdom and ignorance on the endless circle
  taxonomy_refs:
  - wisdom
  basis: The passage contrasts people who understand the good and bad sides of the
    endless circular walk with those who know neither themselves nor worldly things;
    it also distinguishes intelligent and ignorant men regarding wine.
  evidence_refs:
  - ev:10
  - ev:12
  confidence: high
  cautions: The wisdom motif is conceptual rather than narrative.
- id: motif:8
  label: Equivalence of joy and sorrow before the end
  taxonomy_refs:
  - duality
  basis: Joy, sorrow, and pain are said to be identical for one who accounts for human
    ills, and good and bad in the world are said to end.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: This is a reflective aphoristic pattern, not a developed plot motif.
