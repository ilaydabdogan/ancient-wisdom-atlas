  summary: A set of variant readings for several numbered stanzas includes images
    of bread under a bough, wine, verse, an addressed Thou, cash versus promise, green
    herb, vintage and time, Two Worlds, a return through the same door, cultivated
    growth, Heaven giving the vine, knots on the road, an obscuring veil, Heaven's
