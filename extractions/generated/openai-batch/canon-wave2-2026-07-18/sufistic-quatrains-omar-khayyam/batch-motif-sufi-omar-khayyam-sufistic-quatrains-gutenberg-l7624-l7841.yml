canonical_text:
  quote: ''
  summary: English quatrains 198-218 and editorial notes. The speaker repeatedly invokes
    wine, grape-juice, cups, cupbearers, spring flowers, death, divine address, poverty,
    wisdom, celestial cycles, and the Ramazan-Shawwal transition. The passage criticizes
    worldly folly, formal learning, and divination; counsels feasting before death;
    praises wine as truth or balm; and uses allusions to Musa, 'Isa, Allah, and divine
    judgment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rich men who take to drink are said to defy the world in riot and die as beggars;
    the speaker asks for emerald hemp in a ruby pipe to blind care's serpent eye.
  category: action
  evidence_refs:
  - ev:1
