candidate_motifs:
- id: motif:1
  label: Wine as truth, balm, and practical wisdom
  taxonomy_refs:
  - wisdom
  basis: Wine or grape-juice is identified with Truth, said to heal grief, and recommended
    over vain philosophy as a form of timely wisdom.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:16
  confidence: high
  cautions: The extraction does not decide whether wine is literal, metaphorical,
    Sufi-symbolic, or all of these within the wider work.
- id: motif:2
  label: Feasting before death
  taxonomy_refs: []
  basis: The speaker urges friends to feast before death chills the breath and earthworms
    consume the body; elsewhere life is described as a loan to be repaid to Heaven.
  evidence_refs:
  - ev:5
  - ev:13
  confidence: high
  cautions: This is an ethical and poetic pattern rather than a full narrative myth.
- id: motif:3
  label: Seasonal renewal and revival
  taxonomy_refs:
  - seasonal_cycle
  - resurrection
  basis: Spring adorns the earth with flowers; plants revive as if by 'Isa's breath,
    and later floral imagery accompanies wine-pouring.
  evidence_refs:
  - ev:4
  - ev:12
  confidence: high
  cautions: The resurrection reference is allusive and simile-based; the passage does
    not narrate a resurrection event.
- id: motif:4
  label: Divine intimacy confronting judgment
  taxonomy_refs:
  - divine_judgment
  basis: The speaker addresses the divine as known intimately, contrasts intimates
    with strangers, and responds to the statement that sinners will be burned with
    fire.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage gives a brief address, not a developed theology of divine
    nearness.
- id: motif:5
  label: Limits of learned wisdom and divination
  taxonomy_refs:
  - wisdom
  basis: The passage criticizes fools without deep research, enlighteners unable to
    escape dark night, philosophers of Being and Nonentity, and augurs who distrust
    their own presage.
  evidence_refs:
  - ev:2
  - ev:11
  - ev:14
  - ev:16
  confidence: high
  cautions: The critique is poetic and satirical; it does not reject every form of
    knowledge explicitly.
- id: motif:6
  label: Cyclic heavenly return and renewed birth
  taxonomy_refs:
  - death_rebirth
  - seasonal_cycle
  basis: Heavenly adorners come by night, depart by morning, move between Heaven's
    skirt and earth's pouch, and are said to be born anew while Allah lives.
  evidence_refs:
  - ev:15
  confidence: medium
  cautions: The identity of the heavenly adorners is not fully specified in the passage;
    the cycle may concern stars or celestial appearances rather than human rebirth.
- id: motif:7
  label: Humble sustenance over domination and servitude
  taxonomy_refs: []
  basis: The speaker says half a loaf and water from a broken crock are preferable
    to ruling over another poor person or bowing to another as vassal.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is a moral-social pattern, not a mythic episode.
- id: motif:8
  label: Return of festivity after Ramazan
  taxonomy_refs:
  - return
  - seasonal_cycle
  basis: When Ramazan is past and Shawwal comes back, feast, song, joy, and wine-skin
    traffic return.
  evidence_refs:
  - ev:17
  confidence: high
  cautions: The passage names a religious calendar transition but does not elaborate
    ritual details beyond feast, song, joy, and wine-skin carriers.
- id: motif:9
  label: Serpent-subduing gem lore applied to care
  taxonomy_refs:
  - serpent
  basis: The speaker asks for emerald hemp to blind care's serpent eye, and the note
    states that emerald is supposed to blind serpents.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The serpent is metaphorically linked to care in the quatrain; the emerald-serpent
    belief is supplied by the editorial note.
