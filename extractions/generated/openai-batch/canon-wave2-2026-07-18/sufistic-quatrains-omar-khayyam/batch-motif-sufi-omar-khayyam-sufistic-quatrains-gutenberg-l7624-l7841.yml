- id: obs:3
  text: The passage describes fools as not doing deep research, not stepping beyond
    themselves, dressing finely, and plotting to despoil others of credit.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: At false dawn the speaker calls for cups to be filled with the pure blood
    of the vine and says the bitterness of truth is a token that Truth is wine.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The spring earth is described with green bowers, flowering trees, revived
