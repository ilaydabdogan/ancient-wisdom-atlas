  summary: The passage presents several quatrains and notes on mortality, the one-way
    road through darkness after death, the insufficiency of prophetic or learned revelations,
    a soul sent into the Invisible that returns with an inward answer, and heaven
    and hell reinterpreted as states or reflections within the self.
  language: English
