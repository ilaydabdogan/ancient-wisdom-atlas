canonical_text:
  quote: ''
  summary: Heron-Allen analyzes FitzGerald's first six quatrains, giving Persian manuscript
    parallels and noting images of dawn overcoming night, tavern summonses to wine,
    mortal departure without return, spring renewal with Moses and Jesus imagery,
    vanished legendary glory beside vine and garden, and the nightingale crying to
    the rose.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first FitzGerald quatrain depicts the Sun scattering Stars, driving Night
    from Heaven, and striking the Sultan's Turret with light.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cited C. 134 parallel depicts the Sun casting a noose of morning on roofs,
    the day as Kai Khosru throwing a stone into a bowl, and the Herald of Dawn crying
    “Drink ye!”
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The second FitzGerald quatrain describes a voice inside a tavern calling while
    the phantom of false morning dies and asking why a drowsy worshipper remains outside
    when the temple is prepared within.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The cited C. 5 parallel has a morning cry from the tavern telling a tavern-haunting
    profligate to arise so that wine may fill the measure before the measure of life
    is filled.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Hafiz lines cited by Heron-Allen describe dawn, a cloud canopy, the morning
    draught, a shut wine tavern, and an appeal to the Keeper of the Gates to open.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The third FitzGerald quatrain places people before the tavern at cock-crow,
    shouting for the door to open and saying that they have little time to stay and
    may not return after departure.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The parallels cited for the third quatrain include the morning draught, cock-crow,
    the Saki, wine, the street of vintners, and statements that those gone do not
    come back or that the moment of existence cannot be found again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The fourth FitzGerald quatrain says the New Year revives old desires, the
    thoughtful soul retires to solitude, Moses' white hand appears on the bough, and
    Jesus sighs from the ground.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Ouseley parallels for the fourth quatrain mention spring breezes, the
    world adorned, hope of rain, yearnings toward the desert, Moses' hand appearing
    on every bough, and Jesus' breath or exhalation coming from the earth or breeze.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: The fifth FitzGerald quatrain says Iram is gone with its rose, Jamshyd's seven-ringed
    cup is unknown, but a ruby still kindles in the vine and gardens blow by the water.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Heron-Allen describes the fifth quatrain as composite, noting Persian poetic
    references to Jamshyd, ruby in wine, and gardens by water, while saying he has
    not found the Garden of Iram in quatrains attributed to Omar Khayyam.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The sixth FitzGerald quatrain states that David's lips are locked, while the
    Nightingale cries “Wine” and “Red Wine” to the Rose in high-piping Pehlevi.
  category: speech
  evidence_refs:
  - ev:12
