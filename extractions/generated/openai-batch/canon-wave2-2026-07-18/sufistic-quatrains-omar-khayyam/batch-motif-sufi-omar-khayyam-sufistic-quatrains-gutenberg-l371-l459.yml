  quote: ''
  summary: The passage describes a Sufi spiritual voyage requiring divine attraction,
    devotion, elevation, and a guide; it traces stages from the seeker through love,
    isolation, contemplation, ecstasy, revelation, union with God, and final absorption
    after death. It also reports a seven-stage celestial account of the soul after
    death, gives historical claims about Sufism, and explains Sufi poetic symbolism
    in which wine, wine-shop, wine-cup, and Beloved are given spiritual meanings.
  language: English
  quote_policy: summarized
