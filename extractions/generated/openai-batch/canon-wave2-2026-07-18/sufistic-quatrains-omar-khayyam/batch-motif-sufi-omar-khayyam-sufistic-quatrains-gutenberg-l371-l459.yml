  text: 'The voyager is said to require three aids: attraction, devotion, and elevation;
    the journey includes roads toward God and in God, and cannot be accomplished without
    a guide or monitor.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The believer moves through named states or identities, including tâlib, mourid,
