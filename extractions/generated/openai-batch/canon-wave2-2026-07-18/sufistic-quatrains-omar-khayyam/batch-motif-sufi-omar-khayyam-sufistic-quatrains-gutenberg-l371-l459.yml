    knowledge, and ecstasy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After revelation of the true nature of God, the traveler reaches union with
    God; the passage says he cannot go further except through death, by which he reaches
    absorption in the Divinity.
  category: sequence
  evidence_refs:
  - ev:2
