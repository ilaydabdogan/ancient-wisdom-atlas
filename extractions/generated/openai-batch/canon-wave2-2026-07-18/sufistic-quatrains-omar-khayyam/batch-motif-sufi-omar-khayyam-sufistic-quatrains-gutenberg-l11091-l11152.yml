canonical_text:
  quote: ''
  summary: The passage presents Khayyam as living apart from political turmoil, studying
    Sufi philosophy with friends, seeking ecstatic contemplation through sociable
    study and entertainment. It describes a moonlit gathering with wine, music, and
    companions; a gust of wind extinguishes candles and breaks a wine pitcher, prompting
    Khayyam to address an audacious quatrain to God. After seeing his face blackened
    in a mirror, interpreted as heavenly punishment, he composes another quatrain
    questioning divine punishment for human sin. The passage then comments on Sufi
    opposition to the doctrine of future punishment and ends with a translator's note.
  language: English
