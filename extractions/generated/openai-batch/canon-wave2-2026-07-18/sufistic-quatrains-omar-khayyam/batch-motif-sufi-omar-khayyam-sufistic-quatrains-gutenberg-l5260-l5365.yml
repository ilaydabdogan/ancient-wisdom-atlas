  quote: ''
  summary: 'The introduction argues that Omar Khayyam is best translated in verse,
    discusses English quatrain metre and translator fidelity, and then classifies
    Omar''s quatrains under six subject heads: complaints against fate, satire, love
    poems of separation and reunion with the Beloved, praise of spring, antinomian
    wine and afterlife themes, and addresses to the Deity seeking pardon or mystical
    union with Truth.'
  language: English
  quote_policy: summarized
