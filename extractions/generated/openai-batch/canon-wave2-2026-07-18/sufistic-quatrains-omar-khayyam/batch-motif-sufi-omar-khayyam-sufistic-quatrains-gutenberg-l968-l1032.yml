  summary: Seven Fitzgerald first-edition quatrains present dawn as an awakening force,
    a tavern call to fill the cup before life ends, an irreversible departure, New
    Year and spring images linked with solitude and named sacred figures, lost legendary
    splendors contrasted with continuing vine and garden, a nightingale calling for
    wine to a rose, and a final warning that Time is already in flight.
  language: English
