canonical_text:
  quote: ''
  summary: A sequence of quatrains in which the speaker addresses the Wheel of Heaven,
    religious authorities, friends, God, wine, mortality, and the soul. The passage
    uses recurring images of wine, the cosmic wheel, the body as earth and water,
    the world as tent or lantern, the black book of deeds, the potter's workshop,
    fire, and a compass whose two points will unite.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker addresses the Wheel of Heaven, says its circular course does not
    satisfy him, and asks to be delivered from its chain.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker contrasts his own drinking of the vine with the city mufti, whom
    he accuses of drinking the blood of human beings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says the wisest course is to seek joy in the heart through a cup
    of wine and not dwell on the present or past.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The soul is described as loaned, groaning in prison, and capable of being
    freed from the shackles of reason for an instant.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker imagines death as bodily particles detaching like dry leaves and
    his dust later being sifted by a mason.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The vault of heaven and the universe are likened to a lantern, with the sun
    as its light and human beings as images on it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The speaker says God formed him of earth and water and predestined both his
    good and evil deeds.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A friend is invited to disregard today and tomorrow, treat brief existence
    as spoils, and later join those who departed long ago after abandoning the old
    tent of the world.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Wine is said to give reflection to intelligence, the heart, and religion;
    the devil is said hypothetically to have adored Adam if he had tasted wine.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The speaker calls for arising, dancing, clapping hands, and drinking in the
    presence of narcissus-eyed beauties.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The speaker says there is only one friend, glossed in the passage as God,
    toward whom he can extend his hand.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The speaker is saddened by the motion of the Wheel of the Heavens and says
    he is in revolt against his vile nature.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: The speaker describes people on the earth as asleep, others as buried in its
    depths, and a desert of Not-being containing those not yet come and those already
    departed.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:14
  text: Because divine pity is promised, the speaker says he has no fear of sin, the
    journey, or the black book.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:15
  text: The speaker says he does not fear the world, dying, or the soul going its
    way; he fears only not having lived well.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:16
  text: The speaker asks for wine before people are transformed into pitchers in a
    potter's workshop.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:17
  text: The speaker answers an ignorant man of God by identifying his group as tavern
    patrons, overcome with wine, cup in hand, and near the object of love; the accuser
    is linked with chaplet, hypocrisy, and infernal machinations.
  category: relationship
  evidence_refs:
  - ev:16
- id: obs:18
  text: The speaker proposes selling royal and religious objects, including a diadem,
    crown, turban, cassock, and chaplet, in exchange for flute music or wine.
  category: action
  evidence_refs:
  - ev:17
- id: obs:19
  text: Sorrow over the world is called a poison, wine an antidote, and the world
