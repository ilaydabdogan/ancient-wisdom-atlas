  - ev:21
  confidence: medium
  cautions: The union language is explicit, but assigning it to annihilation-union
    is a candidate classification rather than a stated doctrine in the passage.
- id: motif:4
  label: divine predestination, mercy, and judgment record
  taxonomy_refs:
