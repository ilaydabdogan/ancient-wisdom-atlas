- id: motif:3
  label: imprisoned soul seeking release and union
  taxonomy_refs:
  - mystical_quest
  - annihilation_union
  basis: The soul is loaned and imprisoned by reason, while the speaker and soul are
    later figured as two compass points that will finally unite.
  evidence_refs:
