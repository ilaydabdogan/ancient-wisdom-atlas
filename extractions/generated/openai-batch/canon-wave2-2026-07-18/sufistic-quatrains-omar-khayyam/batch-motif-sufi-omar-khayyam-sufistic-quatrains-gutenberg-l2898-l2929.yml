canonical_text:
  quote: |-
    A lamp amid the Darkness; and I heard,
    As from Without--«THE ME WITHIN THEE BLIND!»
  summary: 'The quatrain depicts a speaker seeking a lamp amid darkness in relation
    to a hidden inner “THEE/ME.” The commentary frames the quatrain as a Sufi exposition
    of emanation from God and reabsorption into God, and compares it with two passages
    from the Mantik ut-tair: one in which the Creator addresses David from behind
    the Curtain of the Secret, and another asserting that “I” and “thou” are one with
    no duality.'
  language: English
  quote_policy: quoted
