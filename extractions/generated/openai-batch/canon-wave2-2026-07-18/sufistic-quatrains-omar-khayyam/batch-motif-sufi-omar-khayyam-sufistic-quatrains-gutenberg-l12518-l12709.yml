canonical_text:
  quote: ''
  summary: A sequence of quatrains presents a first-person speaker and addressees
    reflecting on mortality, wine, the tavern, beloved figures, religious observance,
    Paradise, divine knowledge, embodied limitation, and the inaccessible First Cause.
    The speaker repeatedly urges drinking before death, imagines his posthumous clay
    or dust remade for tavern service, contrasts present wine with promised afterlife
    joys, and states that God knows hidden faults while ultimate origins remain unknown.
  language: English
  quote_policy: summarized
