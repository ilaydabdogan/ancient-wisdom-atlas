candidate_motifs:
- id: motif:1
  label: posthumous body reused for tavern service
  taxonomy_refs: []
  basis: The speaker asks that his clay become a wine jar and later that his dust
    become a brick to stop a crevice in the tavern wall.
  evidence_refs:
  - ev:1
  - ev:19
  confidence: high
  cautions: The passage imagines material reuse after death; it does not present a
    full resurrection or rebirth narrative.
- id: motif:2
  label: wine as sorrow-remedy and perfecting agent
  taxonomy_refs:
  - wisdom
  basis: Wine is said to remove sorrow, give wings to melancholy, appear as a mark
    on intelligence, and act as a soul helping man toward perfection.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:16
  confidence: medium
  cautions: The passage can be read literally as praise of wine; any symbolic or initiatory
    interpretation requires review.
- id: motif:3
  label: annihilation of individual being into the Whole
  taxonomy_refs:
  - annihilation_union
  basis: The speaker refers to the annihilation of being and to bodily members being
    lost in the Whole.
  evidence_refs:
  - ev:10
  - ev:12
  confidence: high
  cautions: The text states loss in the Whole but does not explicitly describe a completed
    union scene.
- id: motif:4
  label: beloved or idol as focus of longing
  taxonomy_refs:
