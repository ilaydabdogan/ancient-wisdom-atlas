canonical_text:
  quote: ''
  summary: A sequence of quatrains urges detachment from appearances, repeated wine-drinking,
    joy, and contentment in the face of death, bodily dissolution, cosmic recurrence,
    ignorance, and unfulfilled love. God is addressed as friend, cupbearer, and pardoner;
    wine is linked with soul-rejoicing, occult understanding, ablution, fire, and
    the water of life. The passage also uses images of roses, nightingales, tomb-dust,
    clay bricks, a potter, simourg, owl, tree, book, thorn, comb, pearls, and seasonal
    renewal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker asks how long the addressee will be deceived by colors and perfumes
    and says that even being Zemzem or the water of life would not prevent entering
    the earth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several quatrains instruct the addressee not to renounce wine, especially
    amid roses, nightingales, and favorable seasons.
  category: action
  evidence_refs:
  - ev:2
  - ev:14
- id: obs:3
  text: God is described as the friend who pours wine for the speaker and as the cupbearer
    of eternity who produces many Khayyams in the cup of creation.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:4
  text: The speaker says that after death his tomb dust should be leveled, his body's
    earth mixed with wine, and made into a cover for a wine-jar.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says the stars continue their movement, while the speaker's body
    may become bricks for others' palaces.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: The soul is described as crying after the body from which it is separated,
    and the head is described as being trampled under the potter's feet.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: A happy person is described as passing unknown and being lifted like the simourg
    into the skies, while an owl sits among worldly ruins.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:8
  text: Drinkers are said to understand the language of roses and wine and the things
    of an occult order.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:9
  text: In the tavern, ablutions can be made only with wine, and a torn veil of shame
    cannot be repaired.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:10
  text: The speaker laments wasted existence, lack of happiness, approaching death,
    unfulfilled love, and ignorance of love's enigma.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:11
  text: The passage advises discernment in the regions of the soul, silence concerning
    worldly things, and a paradoxical state of being without eyes, tongues, and ears
    while possessing them.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:12
  text: The passage praises contentment with bread, clothing, and freedom from being
    master or servant.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:13
  text: The passage says not to plant the tree of sadness in the heart, but to peruse
    the book of joy and follow the heart while life remains brief.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:14
  text: The speaker asks God for pardon, saying human obedience does not increase
    God's empire and human sins do not diminish God's immensity.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:15
  text: The speaker contrasts holding a wine cup with taking the Koran and says the
    only fire known to him is kindled by wine.
  category: object
  evidence_refs:
  - ev:16
- id: obs:16
  text: The passage says that pressing a rose-cheeked charmer to the heart is accompanied
    by the sting of a thorn, and compares this to a comb cut into teeth before caressing
    perfumed hair.
  category: relationship
  evidence_refs:
  - ev:17
- id: obs:17
  text: The speaker wishes always to hold the juice of the vine and to keep love for
    beautiful idols like houris, even if told that God ordered renunciation.
  category: speech
  evidence_refs:
  - ev:18
- id: obs:18
  text: The speaker says he must go, that only one pearl out of a hundred has been
    pierced, and that many important things remain unheard because of human ignorance.
  category: speech
  evidence_refs:
  - ev:19
