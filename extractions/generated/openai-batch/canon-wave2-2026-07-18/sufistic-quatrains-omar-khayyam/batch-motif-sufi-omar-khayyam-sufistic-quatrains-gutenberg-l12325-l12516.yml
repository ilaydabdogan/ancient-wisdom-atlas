candidate_motifs:
- id: motif:1
  label: wine as life-giving or revelatory substance
  taxonomy_refs:
  - annihilation_union
  - mystical_quest
  basis: Wine is linked with the water of life, God as pourer, joy of the soul, tavern
    ablution, and drinkers' understanding of occult matters.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage presents wine literally and symbolically in a Sufistic translation
    context, but it does not explicitly define a doctrinal interpretation.
- id: motif:2
  label: mortal body transformed into earth, vessel, and building material
  taxonomy_refs:
  - death_rebirth
  basis: The body is imagined after death as tomb dust, earth mixed with wine for
    a jar-cover, bricks for palaces, and matter under the potter's feet.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage emphasizes transformation of remains; it does not explicitly
    narrate personal resurrection.
- id: motif:3
  label: cosmic recurrence under the heavens
  taxonomy_refs:
  - seasonal_cycle
  basis: The Wheel of the Heavens, stars in continued movement, repeated travelers
    through the world, and seasonal imagery frame human life as brief within continuing
    cycles.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:20
  confidence: medium
  cautions: The recurrent pattern is poetic and cosmological rather than a developed
    mythic cycle.
- id: motif:4
  label: divine beloved or divine cupbearer
  taxonomy_refs:
  - divine_beloved
  basis: God is named as friend pouring wine for the speaker, cupbearer of eternity,
    and divine addressee asked for pardon.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:15
  confidence: medium
  cautions: The term 'friend [God]' is supplied by the translation's bracketed gloss;
    the passage blends devotional and wine imagery.
- id: motif:5
  label: quest for hidden wisdom and failure to solve love's enigma
  taxonomy_refs:
  - wisdom
  - mystical_quest
  basis: The passage speaks of occult understanding known to drinkers, discernment
    in the regions of the soul, ignorance, unfulfilled love, and important things
    left unheard.
  evidence_refs:
  - ev:9
