canonical_text:
  quote: ''
  summary: A sequence of quatrains reflects on hostile fate, vanished youth, false
    wisdom, wine-house imagery, dependence on divine grace, death and bodily return
    to earth, ascent beyond the ruined world, restraint of speech and senses, simple
    independence, divine pardon, courtship and garden imagery, and the unknowability
    of human coming and going.
  language: English
  quote_policy: summarized
literal_observations:
