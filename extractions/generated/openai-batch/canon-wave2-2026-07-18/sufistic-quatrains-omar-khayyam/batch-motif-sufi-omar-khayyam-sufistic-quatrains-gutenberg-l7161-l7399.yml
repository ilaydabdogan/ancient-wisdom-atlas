  text: Youth is described as an outworn volume and as a bird whose arrival and departure
    went unnoticed.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ignorant fools claim superior wisdom and condemn dissimilar people as infidels.
  category: speech
  evidence_refs:
