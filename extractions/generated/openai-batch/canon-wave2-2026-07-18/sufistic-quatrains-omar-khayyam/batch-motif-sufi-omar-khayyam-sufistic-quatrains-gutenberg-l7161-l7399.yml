candidate_motifs:
- id: motif:1
  label: false wisdom condemning outsiders
  taxonomy_refs:
  - wisdom
  basis: The fools are described as ignorant yet claiming surpassing wisdom and damning
    those unlike themselves as infidels; the note compares the saying to Job.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The specific social target is only probable in the note.
- id: motif:2
  label: wine-house against religious formalism
  taxonomy_refs: []
  basis: The wine-house, wine-bowls, and tavern-hunter are contrasted with Pharisaic
    garments, blue robes, book, pulpit, and a dry zealot’s fire.
  evidence_refs:
  - ev:4
  - ev:11
  - ev:15
  confidence: medium
  cautions: The passage can be read literally as wine imagery; symbolic Sufi interpretation
    is suggested by the collection context but not required by these lines alone.
- id: motif:3
  label: divine grace before repentance and pardon
  taxonomy_refs:
  - divine_judgment
  basis: The speaker says repentance cannot occur before Allah’s grace softens the
    heart and asks Allah to pardon rather than punish.
  evidence_refs:
  - ev:6
  - ev:14
  confidence: high
  cautions: The motif is devotional rather than narrative in this passage.
- id: motif:4
  label: post-mortem transformation into earth-made objects
  taxonomy_refs: []
  basis: The speaker imagines the dead body becoming clay for a wine-jar stopper and
    ashes becoming bricks for another’s house.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: This is material transformation after death, not an explicit resurrection
    or rebirth.
- id: motif:5
  label: celestial confinement and unknowable fate
  taxonomy_refs: []
  basis: The wheel on high strikes the afflicted, the blue canopy closes people in,
    and the reason for coming and going is unknown.
  evidence_refs:
  - ev:1
  - ev:8
  - ev:21
  confidence: medium
  cautions: The passage does not identify a named fate deity or a full cosmological
    system.
- id: motif:6
  label: ascent from ruined earth to sky
  taxonomy_refs:
  - ascent
  basis: Glad hearts are said to leave ruined earth and wing their way Simurgh-like
    to the sky.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The ascent is presented in a brief simile rather than an extended journey
    narrative.
- id: motif:7
  label: beloved and garden longing
  taxonomy_refs:
  - divine_beloved
  basis: The passage includes longing for a rose-cheeked fair, a Houri maid, a lady’s
    hair, and a rose addressed in a wine-filled garden scene.
  evidence_refs:
  - ev:16
  - ev:17
  - ev:19
  confidence: medium
  cautions: The available lines state erotic and garden imagery; identifying the beloved
    as divine is plausible in Sufi reception but not explicit in every image.
- id: motif:8
  label: simple independence as blessed lot
  taxonomy_refs: []
  basis: The quatrain praises one who has bread, a small nest, no master, and no slaves.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: This is an ethical maxim rather than a developed mythic episode.
- id: motif:9
  label: guarding the soul through silence and sensory restraint
  taxonomy_refs:
  - wisdom
  basis: The speaker counsels wariness in the soul’s domain and acting as if without
    tongue, ear, or eye while retaining them.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage gives instruction but no named initiatory setting.
comparison_claims:
- id: claim:1
  claim: The editor explicitly compares the quatrain on fools claiming wisdom to Job’s
    rebuke, where the people are ironically treated as if wisdom would die with them.
  claim_level: same_function
  target: Book of Job satirical rebuke of false wisdom
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an editorial comparison in the passage; it does not establish
    historical contact or dependence.
- id: claim:2
  claim: The editor notes that Hafiz also treats blue robes of certain dervishes as
    a mark of hypocrisy, comparable to this passage’s azure robes and religious garments
    in the wine-house scene.
  claim_level: same_motif
  target: Hafiz, Ode V, blue robes of hypocritical dervishes
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The note supports a Persian literary comparison but gives no full parallel
    text and no direct borrowing claim.
