- id: obs:4
  text: The wine-house is filled with a glad company, while religiously marked garments
    are burned or trodden in mire.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'People are compared to Zamzam or the fount of life: they rise and then sink
    again into earth.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker says the Friend’s wine gladdens the heart and that repentance
    requires Allah’s grace to soften the heart.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker asks that, after death, his body be ground, kneaded with wine
    into clay, and used to stop a wine-jar.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The sky is described as a blue canopy that closes people in, and beings like
    the speaker are compared to bubbles in the eternal Cupbearer’s wine.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The dead lie long in the tomb while stars keep watch, and ashes are imagined
    as being molded into bricks for another person’s buildings.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Glad hearts that avoid notoriety and display do not remain like gloomy owls
