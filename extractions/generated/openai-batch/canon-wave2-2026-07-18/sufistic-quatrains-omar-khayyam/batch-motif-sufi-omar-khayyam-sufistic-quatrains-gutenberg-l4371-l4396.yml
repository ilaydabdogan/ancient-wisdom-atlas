  quote: Khayyam, who stitched the Tents of Science, / Has fallen in Grief's furnace
    and been suddenly burned
  summary: An appendix explains that stray quatrains from FitzGerald's Introduction,
    Notes, and early editions are being identified with original texts. Under “PAGE
    4,” a quatrain depicts Khayyam as a maker of the “Tents of Science” who is burned
    in Grief's furnace, whose life-ropes are cut by Fate's shears, and whom the Broker
    of Hope sells for nothing. The note identifies the quatrain as Prof. Cowell's
    literal translation of O. 22 and lists references.
