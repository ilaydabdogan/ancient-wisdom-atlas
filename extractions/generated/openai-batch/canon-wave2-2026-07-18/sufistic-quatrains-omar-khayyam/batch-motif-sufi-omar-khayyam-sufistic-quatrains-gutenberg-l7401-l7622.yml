candidate_motifs:
- id: motif:1
  label: Divine omniscience exposes hypocrisy
  taxonomy_refs: []
  basis: The heavenly Sage knows veins, hairs, and hearts, making hypocritical deception
    impossible before Him.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage states divine knowledge plainly but does not develop a longer
    narrative of exposure.
- id: motif:2
  label: Wine as transformative wisdom and anti-creedal remedy
  taxonomy_refs:
  - wisdom
  basis: Wine gives wings, inspires bodies as a soul, uproots metaphysical weeds,
    functions as alchemy, and is linked to the wise drinker.
  evidence_refs:
  - ev:2
  - ev:10
  - ev:18
  - ev:19
  confidence: high
  cautions: The wine may be literal, metaphorical, or both; this extraction does not
    decide beyond the supplied wording.
- id: motif:3
  label: Ritual abstinence reversed by feast drinking
  taxonomy_refs: []
  basis: The speaker abstains through Ramazan, welcomes Bairam, and plans to drink
    before Ramazan's banishment of wine.
  evidence_refs:
  - ev:2
  - ev:12
  confidence: high
  cautions: The motif is calendrical and poetic rather than a developed mythic episode.
- id: motif:4
  label: Parts swallowed in the Whole
  taxonomy_refs:
  - annihilation_union
  basis: The speaker acts before the parts are swallowed in the Whole, and the editorial
    note explicitly identifies this as reabsorption in the Divine essence.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The basis relies partly on the translator's note, not only on the verse
    wording.
- id: motif:5
  label: Divine beloved beyond paradisal rewards
  taxonomy_refs:
  - divine_beloved
  basis: The passage contrasts Houris in Paradise with the discovery, after the veil
    is lifted, of distance from Thee; it also distinguishes true love from counterfeit
    worldly love.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  confidence: medium
  cautions: The identity of Thee is not fully explained within the excerpt, though
    the surrounding divine language supports a divine addressee.
- id: motif:6
  label: Soul imprisoned in the body and restrained by law
  taxonomy_refs: []
  basis: The soul laments its prisoned state and would quit the earth-born co-mate,
    but religious law restrains it.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage gives a compact lyric image rather than a full soul-journey
    narrative.
- id: motif:7
  label: Limits of human wisdom before divine mystery
  taxonomy_refs:
  - wisdom
  basis: Sages cannot unravel the eternal tangle; no eye pierces God's decrees; seventy
    years of pondering leaves the speaker baffled.
  evidence_refs:
  - ev:14
  - ev:16
  confidence: high
  cautions: The motif concerns epistemic limit, not necessarily forbidden knowledge
    in the strict sense.
- id: motif:8
  label: Death's nearness relativizes worldly change
  taxonomy_refs: []
  basis: Death presses at the heels and the brink of death makes alternations of wine
    and dregs, silk and tatters, of slight account.
  evidence_refs:
  - ev:7
  - ev:13
  confidence: high
  cautions: No rebirth or afterlife journey is narrated in these lines.
- id: motif:9
  label: Final judgment tempered by divine goodness
  taxonomy_refs:
  - divine_judgment
  basis: The last trumpet, judgment, and doom to hell are invoked, but the speaker
    appeals to perfect goodness as reassurance.
  evidence_refs:
  - ev:17
  confidence: high
  cautions: The quatrain presents a theological argument rather than a detailed judgment
    scene.
- id: motif:10
  label: Divorce from faith and reason; marriage to the vine
  taxonomy_refs: []
  basis: The speaker says old faith and reason will be divorced three times before
    taking the daughter of the vine as wife.
  evidence_refs:
  - ev:20
  confidence: medium
  cautions: The image uses legal and marital language metaphorically; it is not classified
    here as sacred marriage.
- id: motif:11
  label: Predestined transgression or drinking under divine prescience
  taxonomy_refs: []
  basis: The speaker argues that Allah knew before time that the speaker would drink
    and asks how that prescience could be thwarted.
  evidence_refs:
  - ev:21
  confidence: high
  cautions: The passage frames predestination around wine-drinking specifically.
comparison_claims:
- id: claim:1
  claim: The editor's note explicitly compares the quatrain on the veil of God's decrees
    and baffled human understanding to a saying from Job about the incomprehensibility
    of divine power.
  claim_level: same_function
  target: Book of Job theme of divine incomprehensibility
  evidence_refs:
  - ev:16
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is supplied by the editor's note; it does not by itself
    establish historical dependence.
- id: claim:2
  claim: The 'two-and-seventy creeds' image is connected by the note to the Islamic
    tradition that Muhammad's people divide into seventy-three sects, most associated
    with fire.
  claim_level: same_motif
  target: Islamic seventy-three sects tradition
  evidence_refs:
  - ev:18
  counter_evidence_refs: []
  confidence: medium
  limitations: The poem's number and the cited tradition's number differ in the supplied
    note; the claim rests on the editor's gloss.
- id: claim:3
  claim: The triple divorce of old faith and reason echoes the legal triple-divorce
    formula noted with reference to Koran ii. 230.
  claim_level: linguistic_similarity
  target: Qur'anic/legal triple divorce formula
  evidence_refs:
  - ev:20
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison concerns legal language reused metaphorically; no broader
    narrative contact is established.
