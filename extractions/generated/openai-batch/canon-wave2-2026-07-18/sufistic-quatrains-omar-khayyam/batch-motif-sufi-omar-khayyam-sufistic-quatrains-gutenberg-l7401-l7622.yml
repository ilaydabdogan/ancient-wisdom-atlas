canonical_text:
  quote: ''
  summary: The passage collects quatrains on divine omniscience, wine and ritual abstinence,
    prayer and fasting, worldly and true love, union with the Whole, the soul's confinement
    in the body, death, the limits of wisdom, paradise, final judgment, religious
    creeds, divorce imagery, and Allah's foreknowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A heavenly Sage is described as counting veins and hairs, while human hypocrisy
    cannot deceive the one to whom hearts are bare.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says wine gives wings to weary people, reports abstaining from
    drink during Ramazan, and welcomes Bairam night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker spends a night in bewilderment with tear-drops on the breast and
    says an overturned cranium cannot hold wine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker says prayer and fasting once attracted the heart, but purity is
    stained with wine and prayers are wasted.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker worships rose-red cheeks, keeps a hand on the bowl, and speaks
    of parts being swallowed in the Whole; the note says the line alludes to reabsorption
    in the Divine essence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage contrasts counterfeit worldly love with true love that rests not,
    sleeps not, and craves neither drink nor meat.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker questions attempts to survey Being and Not-being, says death presses
    at one's heels, and recommends drinking or dreaming life away.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage mentions Houris in Paradise, a lifted veil, and distance from
    the addressed Thee.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Paradise is described as containing Houris and fountains running with wine
    and oxymel.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: Wine is said to make a mountain dance, to be a soul inspiring bodies, and
