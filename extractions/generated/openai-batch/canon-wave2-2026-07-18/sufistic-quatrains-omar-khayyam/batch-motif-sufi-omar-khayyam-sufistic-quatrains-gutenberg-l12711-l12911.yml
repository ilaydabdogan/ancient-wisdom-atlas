canonical_text:
  quote: ''
  summary: A sequence of quatrains counsels detachment from worldly bonds, states
    that destiny and Providence remain inaccessible, presents God as ultimately gentle
    despite claims of judgment and Hell, repeatedly praises wine as truth, elixir,
    relief, and life-giving drink, evokes spring renewal through Moses and Jesus imagery,
    asks friends to remember Khayyam after death, complains of the Wheel of Heaven,
    and ends with tomb-dwellers returned to dust and humanity held in ignorance until
    doom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker tells the addressee to restrain envy of worldly things, break
    bonds to good and bad below, and live contentedly because heavenly motion continues
    and life is short.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says no one has gone behind the curtain of destiny or learned
    the secrets of Providence, despite seventy-two years of reflection.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports claims of last-day judgments and divine anger, then asserts
    that goodness emanates from pure goodness and that God will be seen as gentle.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wine is repeatedly described as ending heart-disquiet, freeing the drinker
    from meditations on seventy-two sects, and destroying infirmities.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker says wine prohibition depends on the drinker, quantity, and company,
    and asks who would drink it if not the wise.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker imagines drinking two cups after divorcing religion and reason
    and espousing the daughter of the vine.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The speaker says God has eternally known that he would drink wine, and that
    not drinking would make divine prescience ignorance.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage depicts an emerald placed in the bowl of a ruby pipe to blind
    the serpent of grief.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ignorant beings are described as never spending a night in quest of truth,
    never stepping outside themselves, wearing lordly garments, and slandering the
    irreproachable.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: At dawn the addressee is told to hold the sparkling cup; wine is identified
    with truth because truth is said to be bitter in mortal mouths.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Spring growth is described with verdure, buds on branches, plants springing
    from earth, and clouds opening their eyes and weeping.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The buds are compared to the hand of Moses, and the plants are said to be
    revivified as if by the breath of Jesus.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The addressee is told not to seek silver or gold, but to eat with a friend
    before warm breath is cooled, since enemies will later eat him.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Wine poured by the cupbearer is said to extinguish the fire of anger in burning
    eyes and to drive away many sorrows from the heart.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: When violets and roses appear, the wise person is said to drink wine until
    the cup can be dashed against a stone to show emptiness.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: The speaker contrasts a devotee and a stranger with a friend who knows God,
    and rejects the threat that sin will lead to Hell as something for one who does
    not know God.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:17
  text: A cup of wine, the brick covering a wine jar, and the napkin used on wine-moistened
    lips are valued above empires, lives, and turbans.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:18
  text: The speaker asks friends to gather after his death, rejoice together, and
    remember poor Khayyam when the cupbearer raises old wine.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:19
  text: The Wheel of Heaven is said to have never been propitious, to deny happiness,
    and to plunge the speaker into grief.
  category: action
  evidence_refs:
  - ev:16
- id: obs:20
  text: The Wheel of Heaven is said to multiply griefs, place nothing below that it
    does not soon bear away, and make the unborn better off not coming into the world.
  category: action
  evidence_refs:
  - ev:18
- id: obs:21
  text: Wine is described as giving eternal life, being a source of youthful joy,
    burning like fire, and driving away care.
  category: attribute
  evidence_refs:
  - ev:19
- id: obs:22
  text: The addressee is told not to trouble heart and soul with being, because the
    addressee was not asked an opinion about the making of things.
  category: speech
  evidence_refs:
  - ev:20
- id: obs:23
  text: The inhabitants of the tomb are said to have returned to earth as dust, with
    their atoms scattered and separated.
  category: setting
  evidence_refs:
  - ev:21
- id: obs:24
  text: The passage asks what drink has soaked the human race and held it in dizzy
    ignorance of all things until the day of doom.
  category: speech
  evidence_refs:
  - ev:21
