candidate_motifs:
- id: motif:1
  label: worldly detachment under cosmic transience
  taxonomy_refs:
  - wisdom
  basis: The passage counsels restraint from worldly envy, breaking bonds, avoiding
    silver and gold, eating with a friend before death, and accepting the given making
    of things.
  evidence_refs:
  - ev:1
  - ev:10
  - ev:20
  confidence: medium
  cautions: The passage frames this as counsel rather than a narrative quest or renunciation
    episode.
- id: motif:2
  label: inaccessible destiny and limits of knowledge
  taxonomy_refs:
  - wisdom
  basis: No one reaches behind the curtain of destiny or knows Providence; even seventy-two
    years of reflection leave the enigma unexplained.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage emphasizes ignorance rather than acquisition of secret knowledge.
- id: motif:3
  label: divine judgment tempered by divine mercy
  taxonomy_refs:
  - divine_judgment
  - divine_beloved
  basis: The last day, judgment, anger, Hell, divine goodness, gentleness, pity, and
    God as dear Friend are all explicitly invoked.
  evidence_refs:
  - ev:3
  - ev:13
  confidence: high
  cautions: The passage disputes fearful judgment rhetoric rather than detailing a
    judgment scene.
- id: motif:4
  label: wine as salvific truth and elixir
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: Wine ends disquiet, releases the drinker from sectarian meditations, is called
    truth, elixir, divine juice, bitter yet sweeter than life, and a giver of eternal
    life.
  evidence_refs:
  - ev:4
  - ev:8
  - ev:11
  - ev:17
  - ev:19
  confidence: high
  cautions: The passage itself praises wine in literal and figurative language; a
    specifically esoteric reading requires human review.
- id: motif:5
  label: seasonal renewal with prophetic miracle imagery
  taxonomy_refs:
  - seasonal_cycle
  - resurrection
  basis: Verdure, buds, plants, clouds, violets, and roses appear; plants are revivified
    as if by Jesus' breath and buds are likened to Moses' hand.
  evidence_refs:
  - ev:9
  - ev:12
  confidence: medium
  cautions: The resurrection taxonomy is supported only as imagery of plant revivification,
    not as a full resurrection narrative.
- id: motif:6
  label: mortality and dissolution into dust
  taxonomy_refs: []
  basis: Tomb inhabitants return to earth as dust, atoms are scattered, and human
    ignorance persists until doom.
  evidence_refs:
  - ev:21
  confidence: high
  cautions: The passage does not narrate a return from death for human figures.
- id: motif:7
  label: hostile cosmic wheel of grief and loss
  taxonomy_refs: []
  basis: The Wheel of Heaven denies happiness, plunges the speaker into grief, multiplies
    griefs, and soon bears away whatever it places below.
  evidence_refs:
  - ev:16
  - ev:18
  confidence: high
  cautions: No available taxonomy reference exactly matches the Wheel of Heaven as
    fate-like cosmic adversity.
