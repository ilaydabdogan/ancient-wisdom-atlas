canonical_text:
  quote: ''
  summary: A sequence of quatrains urges wine, joy, beauty, and song in the face of
    annihilation, death, adverse fate, and worldly cares. It includes a potter-workshop
    scene with speaking pitchers, an encounter with a drunken old man, claims that
    wine is water of life and balm for the soul, preference for divine love over sectarian
    creeds, pleas for pardon, personification of the Wheel of Heaven, dawn and seasonal
    imagery, and confidence in the Creator's clemency.
  language: English
  quote_policy: summarized
