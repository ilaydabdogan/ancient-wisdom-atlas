canonical_text:
  quote: ''
  summary: A sequence of quatrains reflects on the impermanence of the world, the
    speaker's preference for wine, tavern, cup, and beloved over formal religious
    observance, the brevity and sorrow of human life, divine pity despite sin, and
    imagined postmortem transformation of the speaker's dust into a wine vessel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the world is not a permanent dwelling and that debates
    about creation or the world's eternity will not matter once the speaker no longer
    exists.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says one should not deprive oneself of wine or the favors of the
    well-beloved.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says he goes to the mosque through duty but not to pray, and says
    he once stole a prayer-rug and keeps returning after it is worn out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage calls wine the blood of the world and calls the world the speaker's
    murderer.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker says he is willing to undergo blame, penalty, and even long torment
    for love of the addressed beloved.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker describes human life within the circle of being as degraded and
    says it would be better finished if not lived according to vows.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The speaker says he would devise joy and limpid wine for the perishable world
    and would not obey a command to renounce wine.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The speaker imagines falling at the feet of death, being reduced by a destroying
    angel, and having his dust made into a flask whose wine-perfume might briefly
    revive him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The speaker identifies himself as a chief patron of the tavern, in rebellion
    against the law, and crying to God during long wine-soaked nights.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage urges rising before or at dawn, breathing briefly, and drinking,
