- id: motif:5
  label: divine mercy appealed to after sin
  taxonomy_refs:
  - divine_judgment
  basis: The speaker imagines committing all sins and still expects divine pity, appealing
    to a divine promise about a future day of infirmity.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The passage emphasizes mercy and appeal more than a formal judgment scene.
- id: motif:6
  label: annihilation and being subordinated to drunkenness
  taxonomy_refs:
  - annihilation_union
  basis: The speaker explicitly names annihilation and being, claims to understand
    them, and says such knowledge may be annihilated if there is a higher human state
    than drunkenness.
  evidence_refs:
  - ev:17
  confidence: medium
  cautions: The passage names annihilation and being, but does not explicitly describe
    union; the mapping is thematic rather than narrative.
- id: motif:7
  label: dawn outlasting mortal breath
  taxonomy_refs: []
  basis: The passage personifies Dawn or Aurora as breathing for long years after
