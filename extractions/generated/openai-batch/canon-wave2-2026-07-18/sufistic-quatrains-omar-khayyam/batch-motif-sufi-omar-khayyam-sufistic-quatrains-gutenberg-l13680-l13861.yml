- id: motif:2
  label: wine and tavern replacing formal religious observance
  taxonomy_refs: []
  basis: The speaker contrasts mosque, prayer-rug, and formal prayer with wine, tavern,
    and the wine-jar as a place of prayer.
  evidence_refs:
  - ev:2
  - ev:9
  - ev:18
  - ev:20
  confidence: high
  cautions: This is a repeated symbolic pattern in the passage; no specific external
    taxonomy family is assigned.
- id: motif:3
  label: postmortem transformation into wine vessel and momentary revival
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The speaker imagines his dust becoming a flask whose wine perfume might revive
    him and later wishes his dust-made pitcher to remain full of wine.
  evidence_refs:
  - ev:7
  - ev:16
  confidence: medium
  cautions: The revival is explicitly temporary and imagined; it is not a full resurrection
    narrative.
- id: motif:4
  label: beloved devotion through blame and torment
  taxonomy_refs:
  - divine_beloved
  basis: The passage links the beloved with desired favors and with a love for which
    the speaker accepts blame, penalty, and prolonged torment.
  evidence_refs:
