canonical_text:
  quote: ''
  summary: The passage presents quatrains LXXVII, LXXXVI, and XC with editorial commentary.
    LXXVII says Philosopher and Doctor are each only a link in an eternal chain that
    cannot be escaped or broken. The editor says no authority or inspiration is found
    for it. LXXXVI has a speaker refuse, even under fear of a wrathful face, to call
    injustice grace; tavern fellows would reject such cowardice. The editor compares
    it to C.8, where fellow drunkards condemn a mean or ungenerous drunkard. XC describes
    a barely heard whisper among a group, imaged as ashes of an almost extinguished
    tongue that the speaker’s ear kindles into living word. The editor says XC evolved
    from O.103 and relates it to earlier quatrains.
  language: English
  quote_policy: summarized
