  summary: Four quatrains describe a rose speaking as it scatters its treasure in
    the garden; worldly hopes that may become ashes or briefly prosper before vanishing
    like snow in the desert; hoarders and spenders of golden grain alike not becoming
    desirable earth after burial; and the world as a battered caravanserai where sultans
    stay briefly and depart.
