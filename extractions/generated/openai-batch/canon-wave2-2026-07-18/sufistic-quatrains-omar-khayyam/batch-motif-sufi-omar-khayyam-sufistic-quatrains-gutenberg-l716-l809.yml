canonical_text:
  quote: ''
  summary: The passage explains Khayyam's poetic name as meaning tentmaker, quotes
    lines that turn tentmaking into images of science, grief, Fate, and Hope, recounts
    an anecdote in which Omar predicts that roses will fall over his tomb, and describes
    the later fulfillment of that prediction. It then compares the grave story to
    other vegetation-covered tombs, discusses Omar's difficult reception among Sufis
    and later Persian poets, and presents manuscript-opening quatrains concerning
    Hell, mercy, God, Pantheism, and atonement.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Khayyam is explained as a poetical name meaning a tentmaker, and the passage
    notes that some Persian poets derive names from occupations.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The quoted lines say Khayyam stitched the tents of science, was burned in
    grief's furnace, had the tent ropes of his life cut by Fate, and was sold for
    nothing by the broker of Hope.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The anonymous preface says Omar Khayyam died at Naishapur in Hegira 517/A.D.
    1123 and describes him as unrivalled in science and the paragon of his age.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Khwajah Nizami of Samarcand, identified as one of Omar's pupils, says he often
    conversed with Omar in a garden, where Omar predicted his tomb would be in a place
    where the north wind could scatter roses over it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Years later, Nizami visited Omar's resting-place outside a garden and found
    fruit trees extending over the wall and dropping flowers so thickly that the tombstone
    was hidden.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A commentator says Omar's grave story recalled Cicero's account of finding
    Archimedes' tomb buried in grass and weeds, and also mentions Thorwaldsen's wish
    to have roses grow over him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that Omar was regarded askance in his own time, was hated
    and dreaded by Sufis, and that Persian poets including Hafiz borrowed from his
    material while turning it to mystical use.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage characterizes Omar as having found no Providence but destiny and
    no world but this, and as making the most of the present world through the senses.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Oxford and Calcutta manuscripts are said to begin with tetrastichs out
    of alphabetical order; the Calcutta one is said to have arisen from a dream in
    which Omar's mother asked about his future fate.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Calcutta quatrain addresses one who burns in heart for those in Hell and
    asks why that speaker keeps crying for God to have mercy on them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Bodleian quatrain is described as pleading Pantheism by way of justification
    and says, as atonement, that the speaker never misread one for two.
  category: speech
  evidence_refs:
  - ev:7
