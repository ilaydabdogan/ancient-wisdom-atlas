  quote: ''
  summary: The passage argues over whether Omar Khayyam should be read as a Sufi mystic.
    It cites scholarly disagreement, contrasts literal and mystical interpretations
    of wine imagery, compares Omar with Persian Sufi poets such as Hafiz, Jelaluddin,
    Jami, and Attar, and concludes that readers may choose a mystical reading, though
    the editor favors a literal reading of Omar's wine as grape wine.
  language: English
  quote_policy: summarized
