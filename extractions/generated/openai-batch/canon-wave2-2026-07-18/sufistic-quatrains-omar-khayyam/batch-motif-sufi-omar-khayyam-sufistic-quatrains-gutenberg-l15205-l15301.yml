canonical_text:
  quote: ''
  summary: A sequence of quatrains urges morning wine in the tavern, addresses the
    cupbearer, idol, and God, contrasts wine with prayer and formal devotion, invokes
    Hell, Paradise, divine pardon, the register of life, fallen kings, minimal subsistence,
    celestial bodies, and the inability of sages to pass beyond night and death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker addresses the cupbearer, says it is time for morning wine in the
    tavern, questions whether the moment is for prayer, and tells the cupbearer to
    leave discourse on tradition and devotion and drink.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: An idol whose coming brings happiness is addressed; the speaker asks for a
    refrain and wine, and says the months of Tir and Di have overturned many potentates
    like Djem and Kai.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker advises avoiding coarseness before drinkers and a bad reputation
    before sages, then says to drink wine; Hell-fire and Paradise are named in relation
    to one's destiny.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker wishes God would reconstruct the world, erase the speaker's name
    from the register of life, or increase the joys of the speaker's existence from
    a mysterious treasure.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker asks God to open the door of benefits, bring fortune, free the
    speaker from dependence on creatures, and make the speaker drunk with wine until
    freed from all knowledge and head torments.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A burned addressee is said to deserve life anew yet also to be worthy only
    of adding fuel to Hell, and is questioned for asking the Divinity to pardon Omar.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker says he cannot live without limpid wine, that the body is a burden
    without the juice of the vine, and recalls the cupbearer offering another cup
    when the speaker lacks strength to take it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The speaker says a remaining breath of life is due to the cupbearer's care,
    that discord still reigns among men, that a known quantity of wine remains, and
    that the remaining span of life is unknown.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: A man with enough bread for two days and a drop of fresh water drawn into
    a cracked pitcher is presented as someone who should not be commanded by or serve
    an equal.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Since Venus and the moon appeared in the sky, the speaker says nothing below
    has been seen preferable to ruby wine, and wonders how wine-merchants can buy
    anything better than what they sell.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Those with knowledge and virtue are described as torches to their disciples,
    yet they have not progressed beyond profound night and have returned to death's
    long sleep after leaving fables.
  category: speech
  evidence_refs:
  - ev:11
