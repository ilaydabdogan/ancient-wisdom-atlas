  quote: ''
  summary: Editorial notes record alternate readings for stanzas XXXVI, XXXVIII, XXXIX,
    XL, XLI, and XLII. The variants include drinking and kissing a lip, mankind cast
    from poor earth, parched herbage, a tulip lifting a chalice or tass for heavenly
    wine, earth-born addressees inverted by Heaven to Earth like an empty cup, resignation
    of human or divine anxieties, and a cup/lip image tied to what all begins and
    ends in.
  language: English
