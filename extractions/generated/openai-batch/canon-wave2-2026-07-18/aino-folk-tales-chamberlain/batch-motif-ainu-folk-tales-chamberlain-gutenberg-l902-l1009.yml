canonical_text:
  quote: ''
  summary: 'The passage contains several Ainu etiological tales: fox tricks or defeats
    otter, monkey, and tiger, explaining the absence of monkeys and tigers in Aino-land
    and the craftiness of foxes; Okikurumi feeds people in the dangerous new-made
    world through Turesh until a man violates a prohibition against seeing her, causing
    her dragon transformation, lightning destruction, and Okikurumi''s withdrawal;
    good and bad gods dispute rule of the world, and the fox-god''s westward sighting
    of sunrise causes the brilliant gods to rule.'
  language: English
  quote_policy: summarized
