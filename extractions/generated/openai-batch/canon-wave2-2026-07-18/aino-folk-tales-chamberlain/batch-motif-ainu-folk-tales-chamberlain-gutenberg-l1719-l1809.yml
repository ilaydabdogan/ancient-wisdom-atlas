canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which an Aino returns by boat after
    being rescued by the chief of the salmon, who commands future offerings and worship.
    It then gives the tale of a young hunter who follows a bear into a mountain cavern
    leading to Hades, eats fruits there, becomes a serpent, is restored through the
    advice of a pine-tree goddess, returns briefly to the human world, and finally
    goes back to Hades because a goddess there has lured him and wishes to marry him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Aino hides in one of a large fleet of boats; after the boats reach land,
    he sees people drawing and drinking water at a river mouth, and his own boat later
    reaches his native place, where sailors throw him into the water and disappear.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In a dream, an old chief identifies himself as the chief of the salmon and
    the divine fish; he says he saved the Aino from dying in the waves and that the
    night spent with him was actually a whole year.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The salmon chief asks the Aino to offer rice-beer, set up divine symbols in
    his honour, and worship him with a libation formula; he warns that failure to
    worship will make the Aino poor.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A handsome, brave young hunter pursues a large bear through dangerous mountain
    heights until the bear disappears down a hole in the ground; the hunter follows
    and enters an immense cavern.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The hunter emerges from the cavern into another world described as more beautiful
    than the world of men, with trees, houses, villages, and human beings; while seeking
    the bear, he eats grapes and mulberries.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: After eating the fruits, the hunter looks at his body and finds that he has
    been transformed into a serpent, with his cries changed into hisses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: At the entrance to the homeward cavern, the transformed hunter sleeps at the
    foot of a very large pine-tree; the pine-tree goddess appears in a dream and says
    he ate poisonous fruits of Hades.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: The pine-tree goddess tells him that to recover his proper shape he must climb
    to the top of the pine-tree and fling himself down.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The serpent-hunter climbs the pine-tree, flings himself down, regains human
    form, sees an immense serpent body ripped open nearby, thanks the pine-tree, sets
    up divine symbols in its honour, and returns through the tunnel-like cavern to
    the world of men.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: In a second dream, the pine-tree goddess says he cannot remain long among
    humans after eating the grapes and mulberries of Hades, and that a goddess in
    Hades had assumed the form of a bear to lure him because she wishes to marry him.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: After the second dream, the hunter becomes gravely sick; a few days later
    he goes again to Hades and does not return to the land of the living.
  category: sequence
  evidence_refs:
  - ev:11
