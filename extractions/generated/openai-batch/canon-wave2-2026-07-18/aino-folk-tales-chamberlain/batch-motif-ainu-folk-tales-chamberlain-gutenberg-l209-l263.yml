canonical_text:
  quote: ''
  summary: Introductory commentary states that some tales in the collection are derived
    from Japanese tales or wider myth cycles, while other material is presented as
    genuinely Aino. It names examples including the Salmon-king, Island of Women,
    the deadly food of Hades compared with Persephone, a cunning Fox-god linked to
    Japanese fox mythology, a westward sunrise episode linked to the Wager of the
    Phoenix, and the Panaumbe/Penaumbe contrast. It also comments on Aino belief in
    explanatory myths and wonder-tales.
  language: English
  quote_policy: summarized
