- id: motif:8
  label: Divine beloved promised marriage after death
  taxonomy_refs:
  - divine_beloved
  - sacred_marriage
  basis: In the dream, the god says he gave the woman a child because he loves her
    and that she will become his wife when she dies.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The promised union is posthumous and narrated through a dream; no wedding
