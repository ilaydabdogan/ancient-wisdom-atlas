canonical_text:
  quote: ''
  summary: 'The passage contains three tale segments: an Aino man enters a cavern
    and visits Hades, where the dead do not recognize him and offerings cling to him
    until he returns; a beautiful unmarried woman conceives by sunlight from a god,
    gives birth first to a little snake and then receives a human son who becomes
    a prosperous hunter; and a senior chief announces that he will buy good dreams,
    then punishes a silent chief by burying him up to the chin.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Aino man wants to find out whether stories about an under-world are true.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He enters an immense cavern at the river-mouth of Sarubutsu, passes through
    darkness toward a glimmer of light, and emerges into Hades.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hades contains trees, villages, rivers, the sea, and large junks loading fish
    and seaweed; its people include Ainos, Japanese, and persons the visitor knew
    when they were alive.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The visitor sees the inhabitants of Hades, but they do not seem to see him;
    the dogs of Hades see him and bark fiercely.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The people of Hades judge that an evil spirit has come among them and throw
    dirty food to appease it; when the visitor throws the food away, it returns to
    the pocket in his bosom.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In a house near the beach, the visitor finds his father and mother looking
    youthful; his mother runs away trembling, and his father falls yelling when addressed
    and touched.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The visitor's parents and others set up divine symbols and pray for the evil
    spirit to depart.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The visitor departs through the cavern with the unclean offerings still clinging
    to him, and they leave him only after he returns to the world of men.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A beautiful woman without a husband becomes pregnant although her intended
    husband has not lain with her; others suspect another man, and the intended husband
    is angry.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The woman gives birth to a little snake, and her mother asks what god has
    begotten the child before throwing it away because human beings cannot keep it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the snake is thrown away, a crying baby is found outside, carried in,
    identified as a boy, and kept.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The woman learns in a dream that sunlight through the roof opening caused
    her pregnancy and that a god gave her the child because he loved her.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The god in the dream says that when the woman dies she will become his wife,
    and that their son will have many children when he gets a wife.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The son grows into a fine man, kills many deer and bears, cannot be caught
    when pursued by bears, becomes rich, marries, has children, and has descendants
    living to the narrator's day.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:15
  text: A thickly populated village is governed by six chiefs, the oldest of whom
    has authority over the other five.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: The senior chief holds a feast and tells the other five chiefs to report their
    overnight dreams the next day, saying he will buy any good dream.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: Four chiefs report bad dreams; the fifth does not come, is brought by force,
    refuses to speak, and is buried up to his chin in front of the senior chief's
    house.
  category: sequence
  evidence_refs:
  - ev:9
