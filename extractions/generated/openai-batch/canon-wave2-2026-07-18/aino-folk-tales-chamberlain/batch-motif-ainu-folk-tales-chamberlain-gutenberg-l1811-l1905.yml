- id: motif:1
  label: Journey to the underworld through a cavern
  taxonomy_refs:
  - afterlife_journey_map
  - hero_descent
  basis: A living Aino enters a cavern, reaches Hades, observes its landscape and
    inhabitants, and returns to the human world.
