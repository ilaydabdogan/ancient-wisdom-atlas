- id: motif:2
  label: Afterlife as a world resembling ordinary life
  taxonomy_refs:
  - afterlife_journey_map
  basis: Hades contains villages, rivers, sea activity, Aino and Japanese inhabitants,
    and people known when alive.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage describes the setting literally and does not provide a systematic
    afterlife geography.
- id: motif:3
  label: Living visitor invisible to the dead, but visible to dogs
  taxonomy_refs: []
  basis: The visitor sees the inhabitants, they do not see him, and only the dogs
    perceive him and bark.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No broader taxonomy reference is supplied for this specific perception
    motif.
- id: motif:4
  label: Offerings to a presumed evil spirit become clinging pollution
  taxonomy_refs: []
  basis: The people throw dirty food to appease the presumed spirit; the discarded
    food repeatedly returns and clings until the visitor leaves Hades.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage treats the offerings as dirty food for evil spirits, not as
    a reciprocal sacred exchange with a successful outcome.
- id: motif:5
  label: Dead parents appear youthful but do not recognize the living child
  taxonomy_refs: []
  basis: The visitor finds his dead father and mother not old but in youth and strength;
    they respond to him with terror.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives one family encounter and does not generalize this condition
    to all dead persons.
- id: motif:6
  label: Divine conception by sunlight
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  - miraculous_child
  basis: The woman becomes pregnant without a human husband; a dream explains that
    the sun's light through the roof was the means by which a god gave her a child.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The god is unnamed in the passage, and the relation between the god and
    the physical sun is described through sunlight rather than a named solar deity.
- id: motif:7
  label: Serpent-born miraculous child becomes human
  taxonomy_refs:
  - serpent
  - miraculous_child
  - shapeshifter
  basis: The woman bears a little snake that is thrown away, after which a human baby
