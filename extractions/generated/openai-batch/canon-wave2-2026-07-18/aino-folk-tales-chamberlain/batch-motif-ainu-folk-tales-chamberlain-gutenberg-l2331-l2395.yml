  summary: The passage first recounts a conflict in which Tun-uwo-ush steals a deer
    and a woman while the deer keeper is away at a festival; after two elder brothers
    die in battle, the youngest brother summons allies, kills Tun-uwo-ush and his
    followers, and recovers both the woman and the deer. It then lists dream omens
    concerning rain, disease, luck, victory, hunting success, weapons, wounds, celestial
    bodies, bridges, and an absent wife.
