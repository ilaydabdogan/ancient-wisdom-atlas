canonical_text:
  quote: ''
  summary: Okikurumi escapes after cutting a rope and revives the dead Samayunguru.
    The shark later dies at the river-mouth of Saru with the harpoon and its materials
    embedded or growing in its body, is rejected by scavengers, and rots away; a warning
    is addressed to present-day sharks. In the Panaumbe and Penaumbe cycle, Panaumbe
    calls for a ferry, feigns death when foxes arrive by boat, kills them with a bludgeon,
    spares one limping fox, and becomes rich by selling their flesh and skins. Penaumbe
    imitates the same plan, but the limping fox warns the others to weep farther away,
    so Penaumbe catches none and dies miserably. In the following tale, Panaumbe opens
    his anus at the sea-shore; whales, salmon, and other fishes mistake it for a cavern,
    enter it, and are later trapped in his house, making him rich.
  language: English
  quote_policy: summarized
