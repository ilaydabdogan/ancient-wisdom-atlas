canonical_text:
  quote: ''
  summary: 'The passage contains several Aino etiological tales: a man recovers his
    demon-stolen wife through the help of an oak-god and a golden horse, after a disruptive
    ascent to the sky; horses multiply from the golden horse. A second tale explains
    the first appearance of horses through a horse that killed and impersonated a
    woman''s husband. A sunrise tale explains how crows and foxes help prevent a devil
    from swallowing the sun and therefore share human food. A final tale explains
    the sex of the sun and moon through an exchange between female and male luminaries.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who had lost his wife searched for her across hills, valleys, forest,
    and sea-shore.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man found an oak-tree on a plain; the oak-tree was also a house inhabited
    by a kind-looking old man who identified himself as the god of the oak-tree.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The oak-god told the man to ride a golden horse up to the sky and sing while
    riding through the streets there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The golden horse, with golden saddle and trappings, flew up to the sky, where
    the man found a beautiful world and an immense city.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The people of the sky complained that the visitor from the lower world smelled
    bad; the chief god of the sky said the man would be made to find his wife if he
    went away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The oak-god said a demon had stolen the wife, kept her shut in a box, and
    was distracted by the man's ride and singing in heaven.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The oak-god brought back the wife, gave the man the gold horse, forbade further
    sky journeys on it, and told the couple to breed from it; horses eventually filled
    Aino land.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the next tale, a skilful husband went to the mountains, disappeared, and
    returned at night carrying a deer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The woman cried out that the returned man was not her husband and described
    a dangerous sexual incompatibility.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Neighbours entered the woman's house; a strong man struck the returned husband
    with a stick, and he turned into a horse, ran away neighing, and was later beaten
    to death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The tale states that the real husband had been killed and supplanted by the
    horse, that this was the first time the Ainos saw horses, and that ancient creatures
    could assume human shape.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: At sunrise in the east, a devil tries to swallow the sun.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Someone thrusts two or three crows or foxes into the devil's mouth while the
    sun rises higher; crows and foxes are said to share human food in return for this
    service.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The female luminary formerly came out at night, but after being shocked by
    outdoor immoralities she exchanged roles with the male luminary; the sun is now
    female and the moon male.
  category: sequence
  evidence_refs:
  - ev:9
