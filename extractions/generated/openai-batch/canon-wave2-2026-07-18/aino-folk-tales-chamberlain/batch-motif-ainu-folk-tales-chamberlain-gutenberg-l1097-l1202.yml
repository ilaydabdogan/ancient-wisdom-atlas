canonical_text:
  quote: ''
  summary: The passage contains two moral tales. In the first, a fisherman kindly
    feeds a hungry raven and is led to a divine household, where he receives gold-
    and silver-producing puppies; an imitator who gives the raven a mud-smeared fish
    and greedily mistreats the puppies receives only dung. In the second, a habitual
    liar and extortionist is changed into a fox as divine punishment, sleeps beneath
    an oak tree, dreams of a divine woman who identifies herself with the tree, and
    is restored to human form after being admonished to reform.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fisherman lays a net across a river, kills many fish, sees a hungry raven,
    washes a fish, and throws it to the raven.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The raven eats joyfully, later speaks like a human being, thanks the man,
    and invites him to come to the raven's old father.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The raven flies through the air while the man follows on foot to a large house;
    inside, the raven appears in human form though still described as a raven, and
    is identified as a divine girl and daughter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A divine old man, with a divine old woman also present, thanks the fisherman
    for feeding his daughter good fish and says he has brought him there to reward
    him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The divine old man gives the fisherman a gold puppy and a silver puppy whose
    excrements are gold and silver; the fisherman feeds them a little at a time, sells
    the metal, and becomes rich.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Another man imitates the first by setting a net in the river and catching
    fish, but he smears a fish with mud before throwing it to the raven.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The second man follows the raven to the large house, where the divine old
    man angrily calls him bad-hearted but still gives him a gold puppy and a silver
    puppy on condition that he treat them properly.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The second man feeds the puppies plentifully, including dirty things, hoping
    for much metal; instead they excrete only dirty dung, filling his house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The tale states that good-hearted men could become rich, while gods became
    angry at bad-hearted men's misdeeds; it admonishes people not to be bad-hearted.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: A man habitually tells lies and extorts things from people; while walking
    and thinking of lies, he hears non-human speech, says 'Pau! pau!', and discovers
    that his body is a fox's.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:9
- id: obs:11
  text: The fox-bodied man fears dogs, leaves the road for the mountains, finds a
    large leafy oak tree, and lies crying beneath it.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: In a dream, a divine woman comes from a large house and says he has become
    a bad god or devil as divine punishment for misdeeds.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The divine woman says she is the tree, made chief of trees by heaven, and
    will turn him into a man again because his death beside her house would defile
    her.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Branches at the top of the tree break and crash down; the man wakes restored
    to human form, worships the tree, returns home, and ceases misbehaving.
  category: sequence
  evidence_refs:
  - ev:8
