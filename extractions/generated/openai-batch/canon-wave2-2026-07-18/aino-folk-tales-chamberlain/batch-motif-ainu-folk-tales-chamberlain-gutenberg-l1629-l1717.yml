canonical_text:
  quote: ''
  summary: The passage contains the tale of an Aino chieftain of Iwanai and his two
    sons who are blown by wind to a women-only land, hosted and seasonally married
    there, told about the local women's seasonal sexual danger and wind conception,
    and then returned home with a marked scabbard as evidence. It also begins a second
    tale in which an Aino fisherman is blown by wind for six nights to another land,
    hosted by an old chief of divine aspect, and instructed to return by boat while
    hiding his head and not looking.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Aino chieftain of Iwanai and his two sons go to sea to catch sea-lions;
    after spearing one and cutting the rope, a gale drives their boat onward to a
    beautiful land.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women in fine garments come from the mountains to the shore, carrying a beautiful
    woman in a litter; she says the land is woman-land and that no men live there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chieftainess says the men will be cared for until autumn, become husbands
    in winter, and be sent home the following spring.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The three men are placed in a room with golden netting like a mosquito-net,
    fed by the chieftainess, and watched by many women during the day.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: In autumn, the chieftainess sends the two sons to two vice-chieftainesses
    and keeps the chieftain as her own husband.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The chieftainess states that, when grass sprouts in spring, teeth sprout in
    the women's vaginas, making cohabitation with men impossible.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The chieftainess states that the east wind is the women's husband and that
    women conceive by turning toward it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The chieftainess states that male children are killed and removed when they
    become fit to lie with women, so the country has women only.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: On the last night, the chieftain uses a beautiful scabbard during intercourse,
    and the teeth leave marks on the scabbard.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The chieftainess directs the men to sail straight ahead on a fair wind, and
    they return to Iwanai, where their wives are wearing widows' caps.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The returned men tell the story of woman-land, and the Ainos see the marked
    scabbard.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: In the next tale, an Aino fisherman is driven by a great wind and drifts for
    six nights before reaching land, a rivulet, a populous place, and the house of
    a chief.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The chief in the second tale is described as an old man of very divine aspect
    and offers the fisherman lodging for one night before sending him home.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: The old chief says some of his people will go to the fisherman's country for
