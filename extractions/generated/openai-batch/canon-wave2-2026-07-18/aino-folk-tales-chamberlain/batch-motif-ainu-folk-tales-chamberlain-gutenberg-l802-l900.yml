canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a mole-god admonishes foxes
    for taking human shape and making counterfeit treasures, then explains their later
    fruit-eating relationship with crows. It then gives the tale 'The Stolen Charm,'
    in which a puppy, fox-cub, and rat recover a god-given silver ship charm from
    an ogre at the top of a mountain at the end of the world, restoring their sick
    master and explaining attitudes toward rats and fox-dog relations. The passage
    closes with the beginning of another tale in which a fox, otter, and monkey steal
    goods from a Japanese rich man.
  language: English
  quote_policy: summarized
