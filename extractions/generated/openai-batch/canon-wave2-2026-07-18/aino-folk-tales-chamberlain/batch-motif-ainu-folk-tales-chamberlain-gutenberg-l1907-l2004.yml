canonical_text:
  quote: ''
  summary: The passage gives the end of a tale in which the God of the Privy rescues
    a good junior chief, leads him to the badger-goddess, and the wicked senior chief
    dies after imitating a false burial ordeal. The badger-goddess marries the good
    man, who becomes senior chief. A second tale tells of a jealous mother who sets
    her baby afloat in a box; the gods cause her to reveal the act, and the father
    later recovers the child downstream and remarries. A third tale begins with a
    beautiful bride whose marriages fail because a warning voice speaks from her body;
    water treatment fails, and she flees to the mountains and a magnolia-tree.
  language: English
  quote_policy: summarized
