canonical_text:
  quote: ''
  summary: The passage concludes one tale in which a girl dreams that a tree is a
    house and a goddess reveals that a wicked fox has possessed and lured her; her
    father later exorcises the fox with a carved likeness, after which she marries
    and has children. A second tale tells of a jealous older wife who feigns illness
    and demands her stepchild's heart; merciful servants substitute a dog's heart
    and save the child. The older wife later elopes with a black-clad young man, wakes
    in the forest, and finds both him and herself changed into crows. The husband
    is warned in a dream to take back his younger wife and child, and the tale states
    that men thereafter mostly abandoned polygyny. A third tale begins with a rascal
    who fakes signs of a divine peacock in a pine tree, deceives a chief with a false
    report that the chief's house is burning, and is ordered rolled in a mat and thrown
    into a river.
  language: English
  quote_policy: summarized
