canonical_text:
  quote: ''
  summary: 'The passage contains short Ainu folk-lore scraps: a fragment explaining
    why Ainu people cannot read; memories of an ancient magical age; a sea monster
    and boat rescue; bird omens involving cuckoos, owls, and a sky peacock; trees
    turning into divine bears; a coition taboo; birth and naming customs; the primordial
    pre-eminence of oak, pine, and mugwort; and an ancestral deer that attracts other
    deer and brings wealth.'
  language: English
  quote_policy: summarized
