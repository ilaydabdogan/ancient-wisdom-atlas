candidate_motifs:
- id: motif:1
  label: Etiology of lost reading ability
  taxonomy_refs: []
  basis: The fragment explicitly states that a prior event explains why Ainu people
    have not been able to read.
  evidence_refs:
  - ev:1
  confidence: low
  cautions: The causal story is not included in this excerpt, only its concluding
    statement.
- id: motif:2
  label: Lost magical age and decrepit present world
  taxonomy_refs: []
  basis: The Good Old Times contrasts an ancient age of magical travel, flight, and
    rapid growth with the present world in which good things are gone.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No supplied taxonomy family directly names this lost-age pattern.
- id: motif:3
  label: Food causing human-to-horse transformation
  taxonomy_refs:
  - shapeshifter
  basis: People who eat the quickly produced grain are transformed into horses.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage describes passive transformation, not voluntary shape-shifting.
- id: motif:4
  label: Sea monster repelled by a foul object
  taxonomy_refs: []
  basis: A sailor saves a boat from a ship-swallowing monster by throwing a loin-cloth
    into its mouth, which the monster refuses to swallow.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives no broader comparative frame or named taxonomy family
    for this episode.
- id: motif:5
  label: Bird nest as hidden wealth-bringing object
  taxonomy_refs: []
  basis: A person who obtains a cuckoo nest and lets no one else see it becomes rich
    and prosperous.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The motif is limited to this short omen statement.
- id: motif:6
  label: Bird omen of household disease or fire
  taxonomy_refs: []
  basis: A cuckoo at the window-sill foretells disease, and a cuckoo on the roof foretells
    the house burning.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No cause is given beyond the omen relationship.
- id: motif:7
  label: Owl rain of gold confers wealth
  taxonomy_refs: []
  basis: Rain falling from the youngest owl, glossed as gold from its eyes, makes
    the person beneath it rich.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The gold interpretation appears in a bracketed explanatory note.
- id: motif:8
  label: Sky bird descends for birth and returns upward
  taxonomy_refs: []
  basis: The sky peacock descends to earth only to give birth and then returns to
    the sky with its young.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: Although upward return is present, the passage does not present a human
    or initiatory ascent.
- id: motif:9
  label: Tree matter transforming into divine bears
  taxonomy_refs:
  - shapeshifter
  basis: Rotten branches or roots of trees sometimes turn into bears, which are called
    divine walking creatures and must not be killed.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The transformation is from tree matter to animal, not a recurring personal
    shapeshifter.
- id: motif:10
  label: Sexual stillness taboo protecting husband's fortune
