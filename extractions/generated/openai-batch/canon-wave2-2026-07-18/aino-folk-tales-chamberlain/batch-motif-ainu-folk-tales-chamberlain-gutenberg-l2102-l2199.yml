canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which a bound rascal escapes drowning
    by deceiving a blind old man into taking his place, then deceives a village chief
    with a story about a river goddess, leading to the chief's drowning and the rascal's
    usurpation of the chief's house and office. It then includes an editorial note
    on Yoshitsune/Hongai Sama and begins a myth in which Okikurumi and his sister
    Tureshi teach the Ainos arts; Okikurumi possesses two knowledge-giving treasures,
    a piece of writing and an abacus. An unknown divine-appearing man becomes Okikurumi's
    helper and son-in-law, steals the treasures, flees by boat with Tureshi, and Tureshi
    creates a fecal mountain in the sea to block Okikurumi's pursuit.
  language: English
