canonical_text:
  quote: ''
  summary: The passage presents paired Panaumbe and Penaumbe episodes. Penaumbe imitates
    a wealth-getting method involving opening his body toward the sea, but releases
    poisonous insects in his sealed house and dies. In the sea-lion tale, Panaumbe
    tricks a sea-lion by pretending to remove lice while eating flesh and fat from
    its head; he then escapes pursuit by taking a narrow valley path, trapping the
    sea-lion, killing it, and becoming rich. Penaumbe learns of the act, insults Panaumbe’s
    household, repeats the deception, ignores the better path at a fork after the
    crow’s speech, and is eaten. The opening of the next tale has Panaumbe stretching
    his penis to Matomai, where the lord mistakes it for a divine pole, dries garments
    on it, and Panaumbe retrieves the garments and becomes rich.
  language: English
  quote_policy: summarized
