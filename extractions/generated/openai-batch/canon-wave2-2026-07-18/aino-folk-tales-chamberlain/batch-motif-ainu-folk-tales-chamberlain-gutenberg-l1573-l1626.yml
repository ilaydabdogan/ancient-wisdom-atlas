canonical_text:
  quote: ''
  summary: The passage contains the end of a moral tale in which Penaumbe, seeking
    wealth by imitating or forestalling another, stretches his penis across the sea
    as a supposed divine pole, loses it when it is cut, and becomes poor because he
    ignored advice. It then gives a tale in which the Chief of the Mouth of the River
    challenges the Chief of the Upper Current of the River to drink the sea dry; the
    latter answers by requiring that all river mouths first be closed, shaming the
    challenger and receiving his treasures.
  language: English
  quote_policy: summarized
