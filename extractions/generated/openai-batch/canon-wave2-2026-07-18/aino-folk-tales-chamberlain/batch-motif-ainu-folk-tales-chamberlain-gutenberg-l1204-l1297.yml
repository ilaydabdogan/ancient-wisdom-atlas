canonical_text:
  quote: ''
  summary: The passage contains two moral tales. In the first, a childless couple
    take in a crying boy found by a tree in the mountains; food disappears and a dream
    later reveals that the boy was a wicked rat in human shape, whose death ends pollution
    and is followed by the couple receiving a child. In the second, a sick boy is
    visited by divine playmates who reveal themselves as a tray and pestle made by
    an ancestral axe; the axe has been discarded and is angry. When the father restores
    and honors the axe, the boy is healed and becomes a soothsayer aided by unseen
    divine object-informants.
  language: English
  quote_policy: summarized
