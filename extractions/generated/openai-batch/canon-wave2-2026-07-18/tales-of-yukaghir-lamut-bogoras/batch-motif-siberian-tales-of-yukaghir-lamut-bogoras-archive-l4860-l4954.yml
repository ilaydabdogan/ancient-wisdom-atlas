canonical_text:
  quote: ''
  summary: 'The supplied passage closes one tale with a wolf-like howl that puts a
    bear and householders to sleep, a skin-boat departure, a long homeward journey,
    and the travelers’ reunion with wives after three years. It then begins the Kolyma
    version of the Tale of La’la: La’la is wealthy in furs and a warrior; Chukchee
    attackers plan to raid him; while La’la and his younger brother are in the woods,
    the brother climbs a tree and watches the attackers kill the old father, loot
    the household, and abuse the mother.'
  language: English
  quote_policy: summarized
