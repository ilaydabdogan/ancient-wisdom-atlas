  text: The visitors go out and find a skin boat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The travelers give up journeying farther, turn homeward, make almost no landings,
    and sail steadily on.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: They revisit only people whose intestines they had provided with openings,
