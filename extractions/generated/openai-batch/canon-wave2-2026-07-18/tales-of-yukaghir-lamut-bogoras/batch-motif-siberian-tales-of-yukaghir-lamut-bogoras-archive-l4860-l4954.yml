  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The journey lasts three complete years of twelve months each.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The travelers have wives at home; some wives had been pregnant when the men
