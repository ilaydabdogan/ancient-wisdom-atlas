canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a bear directs a man to
    take a hidden ring, prepare a grave, kill him, remove a hidden crucifix and chain,
    and bury two bears who are revealed to have been merchant-class lovers meeting
    in bear form. It then gives a children’s story about an old woman who sends her
    three daughters to a Bad Merchant for food; after refusals, punishment, rejection,
    and grief, she kills the daughters and herself. An editorial note frames such
    children’s stories as short, repetitive, partly folktale and partly real-life,
    with a possible connection to older Yukaghir story elements.
  language: English
  quote_policy: summarized
