canonical_text:
  quote: ''
  summary: A woman repeatedly demands a costly new dress for church. Her husband kills
    a young bull, removes the hide whole with horns, hoofs, muzzle, and tail, and
    sews her into it as the promised dress. She goes to church looking like a cow
    or horned being; people are frightened, and the priest tries to expel what he
    thinks may be the Devil with incense. She interprets these reactions as special
    honor. On returning home, her husband declares her a cow, halters and stables
    her, flogs her until the bullskin falls away in shreds, and says she is again
    a woman.
  language: English
  quote_policy: summarized
