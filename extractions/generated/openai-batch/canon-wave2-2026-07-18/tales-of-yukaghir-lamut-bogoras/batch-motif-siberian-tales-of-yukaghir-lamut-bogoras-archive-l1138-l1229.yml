canonical_text:
  quote: When he reached the bottom, it was like another earth.
  summary: The passage closes a tale fragment in which a man kills a black fox that
    tries to bargain with him. A new tale begins about a rich man of unknown birthplace
    who is forced to marry a She-Monster. While lamenting by a water-hole, he meets
    a water-woman. The Monster-Woman puts him into a deathlike sleep with her thimble,
    ambushes the water-woman, and shoots her in the heart. The man awakens, finds
    the water-hole full of blood, and plunges into it. At the bottom he reaches another
    earth with strange rich vegetation, a river, and a silver Lamut tent. Inside,
    the wounded water-woman and her two brothers accuse or absolve him. She instructs
    him to restore her by crossing two stretches of land to a third country, where
    a silver hill holds three she-storks. He reaches the hill, is noticed, falls into
    despair, turns into a little shrew, and hears the storks speaking in Lamut before
    they fly around the hill.
  language: English
  quote_policy: quoted
