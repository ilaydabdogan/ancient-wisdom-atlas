canonical_text:
  quote: "“A big rock, which extended from the ground up to heaven was standing there.”"
  summary: A clever only daughter is carried by a whirlwind to a mountain rock reaching
    heaven. After a bluejay refuses to help her and a snow-bunting brings climbing
    equipment, she climbs the rock with two other abducted girls but cuts their lines
    after they admit they would quarrel over a single husband. At the top she finds
    a well-stocked house belonging to One-Side, a one-limbed, one-eyed man whose household
    objects work by command. She discovers hidden female assistants under a flint
    stone and begins preparing a kettle of water while angry and jealous. The supplied
    passage ends mid-action.
  language: English with embedded Russian words and a Yukaghir refrain/transliteration
    in the song passage
  quote_policy: quoted
