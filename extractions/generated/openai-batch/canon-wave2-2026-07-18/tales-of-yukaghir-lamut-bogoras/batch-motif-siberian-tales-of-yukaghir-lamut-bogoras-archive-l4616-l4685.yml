canonical_text:
  quote: ''
  summary: The Unclean Idol’s vermin children defend a girl who fed them, and the
    Idol rewards her with a sable overcoat and silver money. Her father retrieves
    her alive, while a small dog truthfully announces her return with money despite
    the stepmother’s attempts to make it say she is returning as bones. Envious, the
    stepmother sends her own daughter to the Idol’s house for similar gifts. The second
    girl cooks at the fire but beats the vermin children when they appear. After they
    complain, the Unclean Idol tears the girl in two, swallows her, and leaves only
    bones, which the father later brings home in a bag. The dog announces the bones,
    and the mother laments too late.
  language: English
  quote_policy: summarized
