canonical_text:
  quote: ''
  summary: An old woman warns an inactive old man that Yaghishna, an unclean female
    idol or monster, is approaching. After repeated warnings he arms himself, fails
    to harm her body with arrows, and kills her only after the woman tells him to
    aim at her anus. The couple chop up, burn, and scatter Yaghishna’s remains, then
    search her house. A wooden dish releases many small children, whom they kill before
    burning the house. Afterward the old man becomes active and provides food and
    clothing.
  language: English
  quote_policy: summarized
