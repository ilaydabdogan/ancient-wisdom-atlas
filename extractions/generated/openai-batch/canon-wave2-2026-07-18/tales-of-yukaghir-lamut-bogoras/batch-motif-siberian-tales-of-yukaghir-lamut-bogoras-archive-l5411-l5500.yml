canonical_text:
  quote: ''
  summary: 'The passage first tells of monstrous pikes in a lake near the Lena River:
    one struggles with an elk until both die, another is nearly hauled through the
    ice by men and dogs, another has swallowed canoe fragments, and a man who sees
    the eyes of a giant pike sacrifices to the pikes and refuses thereafter to eat
    pike. A note compares giant pikes in certain lakes with Chukchee and Ainu material.
    The passage then gives the Story of the Fish-Woman: a poor solitary man receives
    an old hook, catches Sherkala the fish-girl, brings her home, and discovers that
    while he is absent she becomes a young woman, prepares food from fish roe, and
    keeps house. He burns her fish skin; she says she must go away and melts into
    sea water.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A lake in the district of Shigansk near the Lena River is said to contain
    monstrous pikes able to swallow a man or a reindeer.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A pike catches a large elk by the muzzle while the elk drinks, and both animals
    die after neither can pull the other from or into the water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bones of the elk and pike are found in shallow water, and the pike cheek
    bones are large enough to be used as a small hut sheltering one man.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A chief officer has a large iron hook made, baits it with elk brisket, fastens
    it to a strong elkhide cord, and lowers it under the lake ice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A caught pike is too heavy for ten men to pull up easily; after twelve dogs
    are attached, its head reaches the ice but the hole is too small, the line snaps,
    and the pike is lost.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Another caught pike contains fragments of a canoe and a paddle in its stomach.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A canoe traveler sees two large round eyes under water on opposite sides of
    his canoe, with the distance between them about the length of his double paddle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The frightened traveler paddles away, leaves his nets, reaches shore, sacrifices
    to the family of pikes, refuses to eat pike flesh, and is nicknamed Pike John.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The note says giant pikes living in certain lakes are also compared with a
    Chukchee story and Ainu material.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: A poor man living alone has no fish nets or fish hook and asks merchants for
    a hook; after two refusals, a third merchant gives him an old pointless hook.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: On the third day of angling, the poor man pulls Sherkala, the fish-girl, to
    the surface and decides to take her home.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After Sherkala is placed in the corner of the house, the man returns from
    fishing to find the house cleaned and a meal ready, although no visible person
    is there.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: When the man stays home, dinner does not appear, so he later pretends to leave
    and secretly watches through the window.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Sherkala rises as far as her tail, turns into a young pretty girl, opens her
    belly, removes fish roe, puts it in a kettle, sweeps the floor, and orders the
    house.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: The man rushes in, seizes Sherkala's fish skin from the floor, throws it into
    the fire, and burns it.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: Sherkala says they had lived happily and that now she must go away; she falls
    down and melts into sea water.
  category: sequence
  evidence_refs:
  - ev:14
