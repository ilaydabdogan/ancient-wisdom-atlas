  - ev:2
- id: obs:4
  text: The island people have neither anus nor urethra.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The island people kill wild reindeer, cook the meat in huge iron kettles,
    place the kettles under their bare armpits, inhale the steam through their armpits,
    and then throw the meat down the bank.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Men with long staffs warn the voyagers not to touch the discarded meat, call
    it bad offal, and invite them to eat clean provisions instead.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The island people give the voyagers choice meat, dried fat, and bladders filled
    with pure oil, and the voyagers eat heartily.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: An old man watches the voyagers eat and remarks on their manner of eating.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The knowing one urges the old man to eat; the old man says the lack of anus
    and urethra would make eating dangerous, but then eats a large meal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: After eating, the old man feels pain in his buttocks and cries out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The man with incantations shapes a splinter of drift larchwood, pronounces
    incantations over it, and uses it to make an anus and a urethra for the old man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The old man immediately eases himself in both ways and becomes like an ordinary
    man, while the others still lack openings.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: The next morning the visitors are asked to furnish the whole population with
    anus and urethra, and they are paid generously with costly fur.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: After receiving provisions on this island, the voyagers take along plenty
    of dried meat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: On another island the voyagers find a large single house on the bank where
    an old man and his wife live.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:16
  text: A big brown bear is tied to a post before the entrance and serves as the old
    couple’s watchdog.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:17
  text: Near the house stand two drying racks filled with human flesh, including ornamented
    limbs and heads.
  category: object
  evidence_refs:
  - ev:7
- id: obs:18
  text: The old man asks his wife to bring cloud-berries for the guests; she brings
    a dish of carefully cut fingertips of women and children, described as resembling
    berries.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: The knowing one tells his companions not to eat the fingertips but to hide
    them in their clothing.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:20
  text: The voyagers go outside as if to ease themselves, loosen their girdles, and
    the hidden fingertips fall to the ground.
  category: action
  evidence_refs:
  - ev:8
- id: obs:21
  text: The old woman prepares beds for the travelers, and the knowing one says they
    cannot stay.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:22
  text: The knowing one proposes to smoke his pipe, knock out glowing ashes, howl
