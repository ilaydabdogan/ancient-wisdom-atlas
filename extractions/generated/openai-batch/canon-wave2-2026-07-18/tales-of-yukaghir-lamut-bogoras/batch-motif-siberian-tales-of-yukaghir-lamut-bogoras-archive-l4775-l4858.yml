canonical_text:
  quote: ''
  summary: Voyagers pass by one-sided people and land on an island whose inhabitants
    lack anus and urethra, live by inhaling steam from cooked reindeer meat through
    their armpits, and discard the meat as refuse. The voyagers are fed clean provisions.
    An old man of the island tries ordinary eating; after pain, the knowing one uses
    incantations and a sharpened drift-larch splinter to make him an anus and urethra.
    The next morning the whole population requests the same operation and pays with
    fur. The voyagers then reach another island with an old couple, a bear used as
    a watchdog, drying racks of human flesh, and fingertip “cloud-berries”; the knowing
    one warns the travelers not to eat and begins planning an escape using pipe ashes
    and a wolf howl.
  language: English
  quote_policy: summarized
