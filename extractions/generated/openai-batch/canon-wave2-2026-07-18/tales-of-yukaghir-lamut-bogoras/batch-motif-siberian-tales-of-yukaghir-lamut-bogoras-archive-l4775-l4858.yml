- id: obs:1
  text: The voyagers are afraid of one-sided people and sail past without landing
    among them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The voyagers are carried to another island, land, walk along the shore, and
    find a village with many houses and large heaps of food near a steep bank.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The food heaps are mostly wild reindeer meat, piled higher than a man’s stature.
  category: object
  evidence_refs:
