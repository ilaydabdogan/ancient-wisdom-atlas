canonical_text:
  quote: ''
  summary: 'The supplied passage closes a tale in which a wager participant enters
    an empty hut containing a dead shaman, ignores staged drum and iron noises, cuts
    off the shaman''s braid, and wins horses from his companions. The passage then
    begins “Tale of a Shaman”: a Kolyma head man visits an Aldan tribute chief whose
    wife is gravely ill; seven shamans have worked for nine days without success,
    so the chief asks whether the head man''s young one-eyed assistant, associated
    with fits and possible shamanic power, can help. The assistant agrees to try if
    given ritual clothing, is dressed in an oversized shamanistic garment, and is
    about to be girdled.'
  language: English
  quote_policy: summarized
