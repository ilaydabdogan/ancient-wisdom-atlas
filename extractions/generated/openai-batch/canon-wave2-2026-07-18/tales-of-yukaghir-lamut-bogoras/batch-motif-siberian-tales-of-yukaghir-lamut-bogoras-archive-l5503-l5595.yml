canonical_text:
  quote: ''
  summary: The passage describes former Yukaghir practices surrounding household bags
    containing ancestral bones. The bags are kept in small raised storehouses, addressed
    as “grandfather,” consulted for hunting and trading by testing their heaviness
    or lightness, given offerings, sometimes asked for loans from their stored goods,
    and treated as protectors. A narrated example tells how an uncle fleeing an evil
    spirit took refuge in the grandfather’s house; the bag moved him to safety, lay
    across the entrance like a sentry, and later indicated by lightness that he could
    leave safely.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When an old grave-box decayed, Yukaghir people gathered the dry bones, placed
    them in a bag of harlot skin, and kept the bag in a small storehouse on wooden
    supports.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: The bag of bones was used as a means of divination before hunting trips.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: The people addressed the bone charms as “grandfather” and asked how a hunting
    trip would turn out.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the bag felt heavy when lifted, this indicated an unsuccessful hunt, misfortune,
    or possible death; if it felt very light, this indicated good luck.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The same lifting consultation was used before going to Russian settlements
    for trade.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After returning from hunting, people brought the grandfather meat, fat, marrow
    and blood soup, tea, sugar, tobacco, and hard tack, putting these into the bag.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When lacking tea or tobacco, people asked the grandfather for a loan from
    his stores and lifted the bag; lightness meant consent, while heaviness meant
    refusal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Every house and family had such a bag as its own protector, brought sacrifices
    to it, and expected it to defend them and keep them in good condition.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The narrator’s uncle went by wooden canoe down the river to inspect deadfalls
    and get fishing nets from a hut at an autumn fishing place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the hut, the uncle heard something behind him and saw a “fright” coming.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Unable to retreat or run ahead, the uncle remembered that his grandfather’s
    house was nearby, climbed to it, opened the door, fell across the sill, and called
    for help.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: When the uncle regained consciousness, he was lying where the bag of bones
    had been, while the bag lay near the entrance across the sill.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that the bag had moved the man to its own place and lain
    near the entrance like a sentry.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The uncle asked whether he should go or stay, specifying that lightness should
    mean permission to go and heaviness should mean he should remain for safety.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The bag was lighter than a cobweb, so the uncle returned it to its former
    place, went to the river, boarded his canoe, and reached home; the fright did
    not return.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The account was told by Nicholas Vostryakoff, described as a Russianized Yukaghir
    man, in Omolon in the Kolyma country in summer 1900.
  category: other
  evidence_refs:
  - ev:9
