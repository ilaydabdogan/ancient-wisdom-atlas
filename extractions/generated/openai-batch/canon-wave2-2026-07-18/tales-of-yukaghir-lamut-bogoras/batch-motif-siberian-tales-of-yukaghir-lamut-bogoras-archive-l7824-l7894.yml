canonical_text:
  quote: ''
  summary: The passage ends one tale in which a girl receives a net and an iron-covered
    box that provides food and drink, while the Yagha-Witch sends her own daughter
    to the water-hole. The daughter follows a road through the water-hole to the lower
    world, receives a large larch-covered box from an old woman, opens it with her
    mother, and both are burned by a flame. The old man and his daughter then go to
    the lower world, where the old man marries the old woman. The passage then begins
    the story of Magus, whose four sons have fragile or unnatural body parts and die
    one after another after an elk hunt.
  language: English
  quote_policy: summarized
