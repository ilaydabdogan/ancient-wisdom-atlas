canonical_text:
  quote: ''
  summary: The passage contains a complete tale in which a forest-being has a human-descended
    son who refuses calls from forest kin, undergoes three escalating night conflicts,
    and is finally killed by the old forest-demon; his wife escapes with the children.
    It also contains the opening of “Story of Transformed Bears,” in which a male
    bear mourns a drowned female bear and leads a Christian hunter to her body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A forest-being, described as a hairy man, lived in the woods and roamed the
    country.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The forest-being married a Russian girl and had a son; the son later married
    and had two children.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The son told his wife that his father was calling him, said he did not want
    to go, took a barrel of alcohol, and set off with her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a dense forest, the husband warned his wife that an elder brother would
    come to fetch him and instructed her to stay inside the tent without looking out
    or calling.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the first night, after the husband drank one pail of alcohol and went outside,
    the wife heard noise; in the morning nearby trees had bark peeled and branches
    broken, and the husband was exhausted on the ground.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: On the second night, the husband expected his eldest brother, drank another
    pail of alcohol, and went outside; the wife heard louder noises, and in the morning
    trees were cut down and the husband lay half dead until she nursed him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the third night, the husband expected the old one, told his wife to leave
    with the children if he was killed, drank the last pail of alcohol, and went outside.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After a prolonged fight, the old forest-demon wound his son around a large
    larch tree and left him dead and disfigured.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The wife took the children and went back to her father.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the following tale opening, a male and female bear swam across a large
    river; the male reached shore and the female drowned.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The male bear waited for the female bear’s body and dragged it to a safe place.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A Christian hunter camped nearby, made a fire and tea, saw the male bear coming,
    took up his bow, then laid it down after seeing the bear weeping like a man.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: At dawn the bear tugged and nudged the hunter, indicated a direction, led
    him to the river, and showed him the female bear’s body hidden in moss.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The bear indicated the female bear’s right foreleg, and the hunter understood
    that the bear wanted him to skin that leg.
  category: action
  evidence_refs:
  - ev:9
