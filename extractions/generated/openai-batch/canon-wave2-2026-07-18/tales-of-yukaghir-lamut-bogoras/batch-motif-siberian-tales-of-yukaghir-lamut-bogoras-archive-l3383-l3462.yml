canonical_text:
  quote: ''
  summary: Three sisters take turns remaining at home with a crying baby named Cu'mo
    while the others hunt. Each sister is seized by fright, hides under the bed, and
    witnesses the baby speak in a deep man's voice, command itself to become large,
    grow until its head reaches the roof, eat stored meat from the rafters, and then
    become small again when the hunters return. After the eldest sister confirms the
    reports, the sisters boil liquid and fat in a kettle, distract the baby, throw
    it in, and flee with nine driving reindeer; Cu'mo pursues them with the kettle.
  language: English
  quote_policy: summarized
