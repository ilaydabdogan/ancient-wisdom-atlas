canonical_text:
  quote: ''
  summary: 'La’la and his younger brother return home and find the household ravaged:
    the father has been killed, the mother is gone, and weapons and goods have been
    taken. They pursue the assaulters to a camp on a frozen lake. La’la plans to turn
    his brother into a fox as a lure, enters the Chukchee camp by deception, retrieves
    his bow, quiver, and snowshoes, and then kills the pursuers one by one while the
    fox evades their arrows.'
  language: English
  quote_policy: summarized
