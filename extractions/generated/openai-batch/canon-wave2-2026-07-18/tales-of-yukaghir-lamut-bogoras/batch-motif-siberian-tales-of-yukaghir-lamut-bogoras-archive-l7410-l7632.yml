canonical_text:
  quote: ''
  summary: 'The passage closes a Pondandi tale in which a girl repeatedly sets dangerous
    tasks for a suitor she hopes to be rid of: killing large animals, moving a stone
    or mountain, and following an arrow shot into the sky. Pondandi succeeds, returns
    handsome with reindeer, proves his identity by showing his old clothes and the
    skin of a snotty youth in a tree, and marries Latka’s daughter after their families’
    herds join. A Kolyma lay of Bondandi follows for comparison, describing Bondandi
    being told to kill an elk and driving away visiting girls. The passage then begins
    a story about Kundirik, born after an old couple pray to God for a child.'
  language: English, with a bilingual Russian/Cyrillic section in the lay
  quote_policy: summarized
