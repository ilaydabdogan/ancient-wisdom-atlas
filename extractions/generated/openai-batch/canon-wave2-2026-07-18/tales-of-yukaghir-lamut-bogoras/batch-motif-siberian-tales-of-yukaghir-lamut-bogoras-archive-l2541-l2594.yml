canonical_text:
  quote: ''
  summary: After an earlier son does not return, aged parents pray to God and receive
    another son. The new son learns from old woman Underskin that Raven-Man carried
    off his sister and killed his brother. He leaves to find them, reaches Raven's
    house, is warned by his sister, meets Raven when he arrives and turns into a young
    man, fails an iron-nut contest, is pushed into an overheated bath-house, killed,
    eaten, and has his bones gathered into a pouch and hung high on a tree.
  language: English
  quote_policy: summarized
