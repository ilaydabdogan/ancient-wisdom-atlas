canonical_text:
  quote: ''
  summary: The passage contains a tale in which an old man pretends to die, has his
    wife and son place him in an abandoned hut with goods, and is later discovered
    cooking and eating a hidden elk alone. His wife sends a ptarmigan through the
    chimney to attack him, refuses at first to accept him as her living husband, beats
    him with a poker, and forces him to share the elk. The passage also begins a separate
    bear tale about a Tungus household that keeps a beautiful younger daughter secluded
    in her sleeping room under the care of an old woman nurse.
  language: English
  quote_policy: summarized
