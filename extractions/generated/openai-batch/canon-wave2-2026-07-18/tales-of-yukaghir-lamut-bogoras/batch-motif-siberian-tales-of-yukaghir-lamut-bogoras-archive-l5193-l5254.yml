  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: La’la puts on fine clothing, covers it with a shabby overcoat made of skin
    shreds, and travels on snowshoes to a river village of thirty houses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At a water-hole near the village, women and girls laugh at La’la, insult him
    as shabby, spit at him, kick him, and pour water over him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Three sisters come to the water-hole; the two elder sisters laugh at La’la,
    but the youngest does not laugh and refuses to ill-use him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The youngest sister asks who La’la is, tells him to get up and come to her
    house, and describes her house as the highest, isolated house with a dazzling
    white skin cover; she says her father is the village chief, the strongest man,
    and the best hunter.
  category: speech
  evidence_refs:
