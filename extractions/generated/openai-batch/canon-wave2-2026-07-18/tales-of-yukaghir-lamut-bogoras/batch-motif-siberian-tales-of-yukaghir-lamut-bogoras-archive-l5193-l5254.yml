canonical_text:
  quote: ''
  summary: In a fragment of the tale of La’la, his younger brother appears in fox
    form and distracts the Chukchee while La’la uses a heavy bow to kill many of them
    and spare the rest with a warning. La’la then tells his mother he will seek a
    wife, travels in fine clothes hidden under a shabby overcoat, is mocked and abused
    at a water-hole, and is accepted by the youngest of three sisters, whose father
    is the village chief. The girl brings him home, feeds him, and marries him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'An old man says La’la’s weapons have been taken: his bow, quiver, and arrows;
    several men are needed to bring the bow and quiver because of their weight.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: La’la takes the bow, tries to string it, lets it go, and says it is too strong
    for him to string.
  category: action
  evidence_refs:
  - ev:1
