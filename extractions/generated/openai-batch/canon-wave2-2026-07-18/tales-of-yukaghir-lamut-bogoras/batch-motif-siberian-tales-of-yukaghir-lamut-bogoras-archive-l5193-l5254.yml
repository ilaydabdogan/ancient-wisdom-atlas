  text: La’la’s younger brother has turned into a fox and runs in view of the Chukchee,
    who look at the fox and forget everything else.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: La’la seizes the bow and shoots the Chukchee; in three hours he kills five
