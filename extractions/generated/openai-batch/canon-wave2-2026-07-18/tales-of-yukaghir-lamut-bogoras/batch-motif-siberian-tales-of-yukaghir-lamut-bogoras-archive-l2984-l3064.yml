canonical_text:
  quote: ''
  summary: 'The passage closes a Grass-Blade-Girl tale in which a young man recognizes
    his former bride, hears her recount how she began as a grass blade that became
    a girl, and kills Yaghishna after she interrupts the story. It then begins the
    tale of Alder-Block: a childless old woman finds an infant boy in her house, raises
    him, names him Alder-Block, and he grows into a carpenter and canoe-maker. He
    leaves by sea to see wonders and reaches an island where the witch Yagha and her
    multi-eyed daughters try to lure him with cakes; he puts the Five-Eyes Girl to
    sleep, takes the cakes, humiliates her, and breaks her back. Editorial notes compare
    the tale and Witch Yagha with European and Old-Russian traditions.'
  language: English
  quote_policy: summarized
