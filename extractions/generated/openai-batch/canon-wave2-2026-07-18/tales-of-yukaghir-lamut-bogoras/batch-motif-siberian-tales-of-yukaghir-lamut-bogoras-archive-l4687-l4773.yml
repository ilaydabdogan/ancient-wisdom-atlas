canonical_text:
  quote: "“Let us travel, that we may see all the wonders of the sea!”"
  summary: A group from a Maritime village set out by skin boat to see sea wonders.
    On one island they encounter an underground village of Polar Fox people, where
    an old man warns them to leave because they have trampled Fox children above ground.
    They depart and reach another island where a giant tree in the sea submerges and
    emerges laden with fish while one-sided people split, rejoin, and catch fish with
    their fingers.
  language: English
  quote_policy: quoted
