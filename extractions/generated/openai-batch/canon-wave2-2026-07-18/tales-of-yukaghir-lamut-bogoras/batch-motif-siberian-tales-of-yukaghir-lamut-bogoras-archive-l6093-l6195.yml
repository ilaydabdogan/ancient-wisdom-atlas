canonical_text:
  quote: ''
  summary: The passage concludes a tale in which Yaghishna leaves a girl to watch
    a spark and forbids her to open one sealed storehouse. The girl opens it, finds
    charmed reindeer, removes them, crosses a river, and deceives Yaghishna about
    how she crossed. Yaghishna tries to imitate the false instructions, falls into
    the river, bursts, and is carried away while naming household uses for her body
    parts. The passage then begins the story of a hungry household in which an old
    couple and their children consume remaining reindeer food, a younger daughter
    dies after choking, and family conflict escalates over hunger.
  language: English
  quote_policy: summarized
