canonical_text:
  quote: ''
  summary: 'Cu''mo pursues three sisters. Each sister throws a small object behind
    her, transforming it into a vast obstacle: an ivory mountain, a flint mountain,
    and finally a river of fire. Cu''mo gnaws through the two mountains but perishes
    at the river of fire. The sisters continue on foot, cross a deep river by means
    of an old woman''s leg stretched out like a bridge, and are then imprisoned when
    the old woman reveals she is Cu''mo''s mother. A parenthetical editorial note
    says the unfinished continuation would have told how Fox saved the girls from
    the She-Monster by substituting stuffed clothes.'
  language: English
  quote_policy: summarized
