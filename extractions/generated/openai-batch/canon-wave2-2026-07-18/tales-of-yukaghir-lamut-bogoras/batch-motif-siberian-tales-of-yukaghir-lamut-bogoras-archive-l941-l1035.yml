canonical_text:
  quote: ''
  summary: A young man kills a Wolf-woman shaman by overturning a kettle of ice-cold
    water over her. He then agrees to carry her body home for a promised bride, stages
    an apparent accident with hidden blood bladders and nails in his heels, tricks
    the Wolf-woman's children into thinking they have nearly killed him, receives
    their sister, returns to claim another promised girl, and then kills his sister-in-law
    before distributing the two women between himself and his brother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman later identified as a Wolf-woman shaman drums while the young
    man overturns a kettle of ice-cold water over her and places the kettle over her
    head and shoulders; she shudders and dies.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The young man leaves the house, joins the people outside, and later suggests
    that they have wrongly left the shaman alone in the house.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The old man fears that the Wolf-woman's children will avenge her death and
    says that someone must carry her body to her own house.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old man offers his pretty young daughter as a reward if the young man
    carries the body away and returns alive.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young man requests two ptarmigan bladders filled with fresh warm blood,
    places them under his armpits, and drives iron nails into the flesh of his heels.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The young man places the dead old woman on a saddle and fastens her so that
    she appears like a living person riding a horse.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the wolves' house, the wolf children call out that their mother is coming;
    the young man warns them not to frighten his horse, secretly spurs the horse with
    the nails in his feet, and falls along with the dead body as the blood bladders
    burst.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The wolf children believe that their imprudence has nearly killed the stranger
    and fear that his kin will come for revenge.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The wolf children offer their sister if the man will not die; he gradually
    acts as though recovering and then fully revives.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The young man leaves with the wolf children's sister, returns to the old man
    alive, claims the promised girl, and goes back to his brother with two women and
    three horses.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The young man cuts off his sister-in-law's head, says she will have no more
    paramours, gives the old man's daughter to his brother, and takes the old woman's
    daughter for himself.
  category: action
  evidence_refs:
  - ev:7
