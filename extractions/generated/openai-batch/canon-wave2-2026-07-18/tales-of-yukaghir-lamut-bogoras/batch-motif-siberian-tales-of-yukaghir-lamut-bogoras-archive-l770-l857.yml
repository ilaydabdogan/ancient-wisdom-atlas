canonical_text:
  quote: ''
  summary: An unmarried brother visits his married brother’s house, discovers the
    wife with a strange man, and later reveals the hidden man to the husband. The
    husband kills the adulterer, regrets the act, and the unmarried brother carries
    the corpse back to the dead man’s family, arranging it in bed so that it appears
    to be asleep.
  language: English
  quote_policy: summarized
