  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The married brother asks his wife to prepare a good meal for the visitor,
    but the unmarried brother refuses to eat because a strange man is hidden in the
    house.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
