canonical_text:
  quote: ''
  summary: A man, after appearing from shrew form, catches one of three stork sisters
    and tells them about their injured sister. The storks follow him home; the youngest,
    later called a shaman, removes an arrow from the patient. The healed woman marries
    the man. On the homeward journey, despite a warning not to sleep, the man falls
    asleep and a two-headed Eagle-Man abducts the bride. The youngest stork rescues
    her, blesses the couple, and they return home to live happily.
  language: English
  quote_policy: summarized
