canonical_text:
  quote: ''
  summary: A young man marries a girl whose mouth and sleeves produce valuables and
    furs. During the journey home, a water errand separates him from her near Yaghishna’s
    house. Yaghishna traps the bride in a deep dark underground cellar, takes her
    clothes, becomes exactly like her, and replaces her on the sledge. At the husband’s
    home the false bride lacks the bride’s marvels and later feeds a son with her
    heel instead of her breast. The husband takes her back, where Grass-Blade-Girl
    is again with the old woman. A flashback explains that the true girl escaped the
    corpse-filled cellar, was torn apart by bears and wolves sent by the witch, and
    from her blood grew grass which the old woman gathered to restore Grass-Blade-Girl.
  language: English
  quote_policy: summarized
