canonical_text:
  quote: ''
  summary: In the first tale segment, a younger brother returns home while an older
    young man refuses to leave a place where a girl has visited him. The father and
    male neighbors forcibly bring the young man home. The father waits in the house;
    the girl arrives after sunset, sees him, wails, and withdraws into the woods.
    He follows her tracks to an ancient wooden grave-box by a small river, where the
    tracks vanish and a skeleton is found. He disjoints the bones and places them
    separately. The young man then wastes away, asks to be treated as his love was
    treated, and is laid beside the girl's bones. In the following tale, Small-Pox
    appears as a tall, lean woman to a solitary man, seeks other humans, detects them
    by sounds of iron, and is tricked into entering a ptarmigan bladder. The man dries
    the bladder near the fireplace until Small-Pox is weakened; she promises not to
    touch his kin if they wear red tufts on their caps. He releases her and sends
    her downriver on a board.
  language: English
  quote_policy: summarized
