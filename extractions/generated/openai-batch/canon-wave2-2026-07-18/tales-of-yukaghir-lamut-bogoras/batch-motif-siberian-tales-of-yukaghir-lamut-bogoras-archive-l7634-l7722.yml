canonical_text:
  quote: ''
  summary: A boy named Kundirik is promised to a Bear after the Bear attacks his father.
    His parents leave him with dolls on a window sill, and the Bear seizes him. Kundirik
    tricks the Bear into sleeping in a hole and kills him with stones. He later curses
    inhospitable daughters so that they stick to the floor, tricks an old woman adviser
    into being killed by a horse, releases the daughters, receives the youngest in
    marriage, returns to his parents, and finally brings his parents and their house
    to his father-in-law's place by spoken command.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man goes hunting wild reindeer, is attacked by a Bear, and is threatened
    with death for his whole household unless he gives the Bear his son Kundirik.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man promises Kundirik to the Bear and returns home covered with his
    own blood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother cries, prepares dolls for Kundirik, places him on the window sill
    with the dolls, and the parents leave the house forever.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bear calls for Kundirik; Kundirik answers as if he is alternately outside
    and inside, while he is on the window sill, and the Bear breaks the wooden wall
    and seizes him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kundirik tells the Bear that his father used to carry him on his shoulders,
    and the Bear carries him that way.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Kundirik and the Bear come to a big hole in the ground with aspen poles and
    a sleeping place of green branches; Kundirik says it was their sleeping place,
    and the Bear enters the hole and sleeps.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kundirik gathers heavy stones, says his stomach hurts and that he will defecate
    stones, then pushes the stones into the hole, crushing and killing the Bear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Kundirik enters a house where a man and his three daughters live; the father
    asks the daughters to give the stranger food and drink, but they refuse and tell
    him to look for it himself.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Kundirik commands that the girls' buttocks stick to the flooring; in the morning
    the boards lift along with them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kundirik is sent to fetch the old man's old mother for counsel; she asks him
    to help with her wraps, sledge, defecation, and wiping.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Kundirik tells the old woman to go to a horse for cleaning; the horse bites
    her naked buttocks, tears her in two, and mice, ermine, spermophile, toads, and
    grubs come out of her lacerated anus.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Kundirik reports that the old woman died, then commands that the girls be
    detached from the flooring, and they become free.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The youngest daughter is given to Kundirik in marriage; he takes her home,
    where his parents live in a small hut with a small fire and a bubbling tea kettle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Kundirik returns to his father-in-law, calls for his father and mother to
    come over, and they appear together with their house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: A source note identifies the tale as told by Barbara Karyakin at Marinsky
