canonical_text:
  quote: ''
  summary: A boy called Alder-Block survives three attempts by Yaghishna's daughters
    to put him into an oven by pretending not to understand the required posture and
    making each daughter demonstrate, then pushing each into the oven. He cooks them,
    prepares their meat as a meal, hides their heads beneath Yaghishna's bed, and
    waits. Yaghishna returns, cannot swallow the food, discovers the heads, attacks
    the boy, and nearly kills him. The boy asks to relieve himself, goes to her storehouse,
    drinks from a well of water of life and youth, and switches its place with a well
    of water of death. Yaghishna later drinks the death water by mistake and dies.
    Alder-Block takes her wealth, provisions, and life-water to his mother, who drinks
    and becomes young.
  language: English
  quote_policy: summarized
