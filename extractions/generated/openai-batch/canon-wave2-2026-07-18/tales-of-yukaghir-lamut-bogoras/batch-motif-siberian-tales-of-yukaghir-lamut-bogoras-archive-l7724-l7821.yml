canonical_text:
  quote: ''
  summary: The passage contains the end of one tale and the beginning of another.
    In the first, a shaman watches a village troubled by nightly disappearances, wounds
    a black dog intruder, traces the injury to the priest’s wife, and exposes her
    as the destroyer of villagers. In the second, an abused stepdaughter sent by a
    Yahga-Witch stepmother to wash an old net loses it in a water-hole, descends to
    the lower world, performs cleaning and tending tasks, and is received by an old
    woman who gives her a silver net before the excerpt breaks off.
  language: English
  quote_policy: summarized
