canonical_text:
  quote: ''
  summary: 'A tale fragment ends with a woman killing the monster Kosetoka by tricking
    him into a painful game. A Markova tale then begins: an old man locks his wife
    out to keep reindeer meat for himself. She leaves, asks birds where to find people,
    receives help only from a snow-bunting she had treated kindly, and then moves
    among households, obtaining a goose, fraudulently turning it into a swan and then
    a doe by false claims. She steals a sledge and harness, drives away singing, and
    an arctic fox asks to ride with her.'
  language: English
  quote_policy: summarized
