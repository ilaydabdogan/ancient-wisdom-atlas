canonical_text:
  quote: ''
  summary: 'The passage contains a tale episode in which Machekur ignores his wife''s
    warning about the Mice-Girls, is overfed, tricked with a bladder attached to him,
    and soils the house when it bursts. It then begins a tale of Mouse and Snow-Bunting:
    Mouse has ample winter stores and shelter, Snow-Bunting moves in, Mouse first
    proposes that they eat Snow-Bunting''s food and later withholds her own food,
    nearly starving Snow-Bunting until spring warmth permits foraging. The range ends
    with the arrival of summer birds and the introduction of a toad who is said to
    be a transformed prince''s daughter.'
  language: English
  quote_policy: summarized
