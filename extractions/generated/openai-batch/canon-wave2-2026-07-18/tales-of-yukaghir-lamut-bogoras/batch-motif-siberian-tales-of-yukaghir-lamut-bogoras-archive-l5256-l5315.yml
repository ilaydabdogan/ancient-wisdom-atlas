canonical_text:
  quote: ''
  summary: A lazy young man from a seashore village wanders away singing. A young
    woman in a self-moving iron canoe traps him with an iron paddle, carries him across
    the sea, and says he will be her husband. In the other country he sees a house
    with drying poles full of human flesh and body parts. A lean old man warns him
    that the inhabitants are man-eaters, that the young woman eats husbands after
    the bridal night, and that he must avoid eating human flesh and survive a nighttime
    ordeal.
  language: English
  quote_policy: summarized
