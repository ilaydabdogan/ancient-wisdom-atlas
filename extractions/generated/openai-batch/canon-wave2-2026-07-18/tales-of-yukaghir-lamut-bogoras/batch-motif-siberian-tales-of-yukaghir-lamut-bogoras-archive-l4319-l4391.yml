canonical_text:
  quote: ''
  summary: 'A hunter catches sables with his dog and later hunts with two companions.
    After an unequal division of twenty sable skins, the hunters encounter an unfamiliar
    house beside a thin birch tree and meet an aged man. The old man recounts a similar
    story: as a former hunter who was close-fisted in sharing, he was transformed
    by a young woman into a wolf, then into grass, restored to human form, and then
    transformed the woman into a birch tree using a remembered formula.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hunter goes out with his horse and hunting dog, finds tracks of four sables,
    and the dog chases the sables to an open lake where all four are caught on the
    ice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hunter crosses the lake, makes a fire, prepares food, and skins the sables;
    two companions arrive, congratulate him, and agree to hunt with him the next morning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the joint hunt, the hunters have twenty sable skins; the first hunter
    says he caught more than half, but the two companions give him five skins and
    keep fifteen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first hunter says the division is unfair, proposes six skins apiece with
    two surplus, accepts the five skins after refusal, feels wronged, and departs
    without greeting.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The companions follow him silently and the group sees a house near the trail
    that they say they had never seen before; a very thin, high birch tree stands
    near the entrance.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Inside the house is an old man described as very small, wizened, extremely
    thin, and with limbs like grass blades.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first hunter tells the old man about the unequal sharing, and the old
    man answers that he will tell a story of a similar kind.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the old man's embedded story, he says that he too was once a hunter who
    caught game easily but was too exacting and close-fisted when sharing with companions.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The old man says a young woman struck him and commanded him to become a wolf
    for three days; he became a wolf, ran for three days, returned, was struck again,
    and became a man again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The young woman next leads him near a village, strikes him, and commands him
    to become a bunch of grass near the trail, where sledges pass over him and cause
    pain and fear.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After an unspecified time, the woman restores him to human form; he retaliates
    by striking her and commanding her to become a birch tree, and she becomes one.
  category: sequence
  evidence_refs:
  - ev:8
