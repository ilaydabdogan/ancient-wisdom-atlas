canonical_text:
  quote: ''
  summary: The passage ends one tale in which a house master learns that a violent
    Bad Merchant kills people wherever he travels. The house master distracts him
    with peltries, seizes his lance, strikes and binds him, frees the coerced workman,
    and is later praised by his elder brothers for liberating the country. The passage
    then begins a tale about a girl abused by her stepmother; after the father sees
    he cannot protect her, he says he will carry her to the Unclean Idol to be eaten
    and end her suffering.
  language: English
  quote_policy: summarized
