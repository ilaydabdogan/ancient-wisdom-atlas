canonical_text:
  quote: ''
  summary: A Lamut man finds a person-shaped stone that becomes his wife. Later he
    repeatedly visits a girl in a river or water-hole and plays shooting games with
    her. The stone wife casts sleep on him, disguises herself in his clothes, and
    shoots the water girl. The man descends through the water to another world, where
    a chief's daughter is sick from an arrow wound. After he touches the arrow she
    dies; he changes clothes with the body and keeps vigil. Two spoonbills arrive,
    turn into young girls, and revive the dead girl by blowing and spitting on her.
  language: English
  quote_policy: summarized
