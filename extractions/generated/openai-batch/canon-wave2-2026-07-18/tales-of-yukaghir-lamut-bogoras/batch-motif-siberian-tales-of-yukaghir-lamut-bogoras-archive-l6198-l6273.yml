canonical_text:
  quote: ''
  summary: 'The passage contains the end of one tale in which children fail to wake
    an old woman, one child cuts her in two, an older boy kills his younger brother
    and little sister in a burning oven, and Yaghishna arrives and kills the older
    boy. It then gives the provenance for that tale. The next tale, “Story of Five
    Brothers,” tells of five brothers: two see fresh wolf tracks, the eldest brother
    returns, three brothers are overcome by snow, wind, river ice, water, and earth,
    are frozen into the river ice until spring, melt with the ice, and one opens his
    eyes before dying again. Editorial notes discuss a negative final refrain and
    the possibility that the five-brothers tale is a mutilated version of a longer
    story.'
  language: English
  quote_policy: summarized
