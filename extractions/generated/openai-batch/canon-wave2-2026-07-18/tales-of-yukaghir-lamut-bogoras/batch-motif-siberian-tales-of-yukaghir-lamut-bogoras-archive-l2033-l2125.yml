canonical_text:
  quote: ''
  summary: A Tungus family has three daughters who become female geese when they gather
    berries and fly to sea islands. On an island they encounter One-Side, a man with
    only one side whose heart and lungs protrude when he breathes. Later, while the
    sisters gather berries, the youngest daughter's wings disappear. Her sisters accuse
    her and abandon her. One-Side appears with the wings, asks her to marry him, and
    takes her to his wooden house. They have a son, and One-Side proves a successful
    hunter. While he is hunting, the elder sisters carry off his wife and son. The
    son calls out, and One-Side shoots a forked arrow toward the voice, cutting off
    one of the boy's fingers, which he keeps. After a year of searching, One-Side
    reaches a village, identifies his mistreated son by the missing finger, and learns
    that the mother has been made a drudge by her elder sisters.
  language: English
  quote_policy: summarized
