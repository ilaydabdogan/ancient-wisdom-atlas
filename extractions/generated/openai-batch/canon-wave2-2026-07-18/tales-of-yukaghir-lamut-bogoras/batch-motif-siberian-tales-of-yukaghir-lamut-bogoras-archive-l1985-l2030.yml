canonical_text:
  quote: ''
  summary: Russian people question Lamut men about their identity and hunting methods.
    Young Lamut men demonstrate archery and snowshoe reindeer hunting. The Russians
    praise their strength, name them close friends and assistants, urge them to fight
    hostile outsiders, give them iron goods and tobacco, and the Russian chief institutes
    tribute in a black book. A source note identifies the teller as Ulashkan, a Lamut
    man, and a footnote describes the Lamut as Russian allies against other tribes.
  language: English
  quote_policy: summarized
