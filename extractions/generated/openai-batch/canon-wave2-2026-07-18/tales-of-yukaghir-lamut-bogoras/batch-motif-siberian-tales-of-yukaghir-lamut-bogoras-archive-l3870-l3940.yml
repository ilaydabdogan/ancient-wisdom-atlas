  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the church bell rings, the young man crosses himself and says he is safe;
    the monster answers that he is safe for now but may be caught later.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The young man reports to the priest that monsters in the woods are probably
    unburied corpses walking abroad and attacking human beings.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The priest lays a curse of the Church on the monsters, after which people
