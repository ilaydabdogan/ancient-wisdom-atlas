canonical_text:
  quote: ''
  summary: 'The passage closes one Kolyma tale: a youngest brother flees a brother-like
    monster, delays it with a blackened kettle and incantation, reaches a village
    at the sound of a church bell, and reports walking corpse-like monsters to a priest,
    who curses them. The passage then opens another tale: two Lamut brothers sent
    to distant traps discuss wishing for a girl helper in the wilderness; a beautiful
    girl arrives at midnight, becomes the elder brother''s wife, leaves at dawn, and
    returns the next evening.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fleeing party travels through night and day, reaches a log cabin after
    sunset, and the dogs refuse to pass it, rush inside, and fight as if attacking
    an unseen being.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The second brother proposes staying overnight in the log cabin, while the
    youngest warns that a monster and their brother may appear and punish them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The second brother says he does not fear the warned brother and says he has
    become as bad as he; the youngest then sees that the second brother has iron teeth
    half a foot long.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A shuffling of snowshoes is heard outside, and a being similar to their brother
    in face and body enters silently and attacks the second brother.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The second brother and the brother-like being fight like wolves, and the youngest
    brother slips outside, takes the dogs, and flees.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After midnight, the youngest hears a distant shaman-like voice saying that
    a man is pursuing his own brother to gnaw bones, eat meat, and drink blood.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The youngest remembers older people saying that a monster can be delayed by
    striking it with an old kettle.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The youngest loosens the kettle, utters an incantation, and strikes the monster's
    face with the blackened kettle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The monster falls face down, says the young man is too clever, and threatens
