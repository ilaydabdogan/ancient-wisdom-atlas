  evidence_refs:
  - ev:1
- id: obs:2
  text: The bear places the girl in the lair in fall, enters himself, stops up the
    entrance, and they sleep most of the time.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When hungry, the girl signals to the bear; he extends a paw, and she sucks
    fat from its thickest part until satisfied.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: As the days grow longer, a heavy weight presses the girl down; she cannot
