canonical_text:
  quote: ''
  summary: A girl sitting alone is seized by a bear and carried to his lair. During
    the cold season she sleeps there with him and is fed by sucking fat from his paw.
    As the days lengthen she becomes the bear's wife. In the warm season the bear
    brings game, later obtains a firebrand, knife, ax, and meat for her, and she cooks
    the meat on wooden spits. Footnotes state that similar tales occur among native
    tribes of the region and describe local fear and avoidance of naming the bear.
  language: English
  quote_policy: summarized
