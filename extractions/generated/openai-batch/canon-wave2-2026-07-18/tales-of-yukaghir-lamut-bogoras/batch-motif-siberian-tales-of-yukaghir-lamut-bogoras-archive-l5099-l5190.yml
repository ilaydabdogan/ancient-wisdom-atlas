canonical_text:
  quote: ''
  summary: 'The passage closes one La’la tale: an old woman feeds La’la, directs him
    to a village where Raven has taken his son and where Raven’s abducted wives appear
    by moonlight, and La’la and the women burn the iron-bodied Raven-Son in his house
    before La’la returns with the women. The passage then begins an Anadyr version:
    La’la, a strong Chuvantzi warrior, learns while cutting a birch tree that the
    Chukchee have attacked his family, pursues them with his youngest brother and
    mother nearby, and plans a fox-transformation decoy at the enemy camp.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman cuts a narrow piece from her coat, chops it, cooks it in a kettle,
    and La’la eats food described as fat meat of wild reindeer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman tells La’la to go to a smooth, ice-like place with a village,
    to ignore children near the houses, and to go to a solitary scab-covered small
    boy identified as his son.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old woman says Raven has carried off La’la’s boy and that, after sunset
    and moonrise when Raven sleeps, three women who are Raven’s wives will come out
    and cry; she says they were all carried off from their husbands.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: La’la meets the three women, asks how Raven-Son can be killed, and the women
    say his body is iron and that he can be killed only by setting his house on fire
    while he sleeps.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: La’la and the three women gather fuel, surround the house with a wall of wood
    as high as the vent-hole, and set it on fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Raven-Son burns with the house, La’la scatters the cold ashes to the winds,
    then goes home with the three women, keeping his own wife and sending the other
    two back to their former husbands.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: In the Anadyr version, an old Chuvantzi man has four sons; the middle son
    is La’la, who is very strong and fights the Chukchee.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: While La’la cuts a birch tree for a sledge, his youngest brother, from the
    top of a birch tree, sees the Chukchee attacking the family but repeatedly describes
    the events to La’la as ravens and crows.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: La’la and his youngest brother return home, find their father and brothers
    murdered and the herd gone, then pursue the Chukchee caravan, where their mother
    trails behind dragging tent poles.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Near the Chukchee camp, La’la tells his youngest brother to stay back and,
    when signaled with La’la’s first finger, to turn into a fox and run in full view
    of the Chukchee.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: La’la approaches the Chukchee camp and tells the people there that he came
    too late and wanted to kill La’la; Chukchee speakers answer that La’la has been
    killed.
  category: speech
  evidence_refs:
  - ev:11
