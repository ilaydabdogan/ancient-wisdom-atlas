canonical_text:
  quote: ''
  summary: 'An old hunter dreams he and his wife will die, has her throw away three
    storehouses of food, and both later die after panicking over a fly at their soup.
    A tale of two girls follows: they meet men from the Upper Land, survive attacks
    by Yaghishna and avenging fire-breathing horses, but burn when the elder lights
    a wax taper to thank God, followed by a brief inconsistent epilogue saying they
    live. The passage then begins a tale in which a She-Fox tricks a Cock into opening
    a window-skin and carries him away while he calls to the Tom-Cat.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man and old woman have three large storehouses filled with land game,
    sea mammals, and fish.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: After dreaming that they will die, the old man orders the old woman to throw
    the stored food to ravens, crows, and water; she does so over three days despite
    first refusing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The next morning both are alive and hungry, and the old woman finds scraps
    that they cook into soup.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A fly lands on the kettle; the old woman and old man attack it, the kettle
    is overturned, the old woman is killed by the old man’s hatchet, and the old man
    dies from a fish bone in his throat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Two girls encounter men identified as people from the Upper Land, who say
    Yaghishna is coming; the girls are afraid and ask to be taken along.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:6
  text: Yaghishna strikes the girls with a big knife but cannot wound them; one girl
    takes the knife and kills Yaghishna in the heart.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: Horses breathing fire and seeking revenge for Yaghishna trample the girls
    with iron hoofs but cannot wound them; the horses leave with their fire breath
    extinguished.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: The girls try to thank God; when the elder lights a wax taper, her finger
    flames up and both girls burn to death.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: After the reported burning deaths, the narration adds that the girls live,
    receive good things, and recently washed their house.
  category: other
  evidence_refs:
  - ev:10
- id: obs:10
  text: A Tom-Cat and a Cock live together; the Tom-Cat goes to fetch fuel and tells
    the Cock to bake pancakes.
  category: action
  evidence_refs:
  - ev:11
- id: obs:11
  text: A She-Fox sings to the Cock, asks to enter or warm one nail, and the Cock
    makes a small hole in the window-skin.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:12
  text: The She-Fox inserts her nail, tears off the window-skin, carries the Cock
