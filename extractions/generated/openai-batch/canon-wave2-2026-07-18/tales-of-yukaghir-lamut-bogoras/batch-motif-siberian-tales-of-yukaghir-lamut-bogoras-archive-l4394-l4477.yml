canonical_text:
  quote: ''
  summary: The passage concludes one tale in which a punished old man warns greedy
    hunters, dies, and a birch tree becomes a woman who calls herself hunting luck
    and rewards the one hunter who buries him with an inexhaustible money pouch. It
    then begins another tale, 'Story about the Bad Merchant,' introducing three brothers,
    the stay-at-home brother, and the arrival of a richly dressed armed merchant with
    a workman, pack-horses, and a woman in fox garments.
  language: English
  quote_policy: summarized
