canonical_text:
  quote: ''
  summary: Alder-Block Boy repeatedly crosses the sea by canoe to take cakes set on
    the shore by Yaghishna's daughters. He uses a spoken command for eyes to fall
    asleep, then takes the cakes and humiliates and injures the hidden trap-setters.
    One daughter is restored by water of life and youth. When Yaghishna herself hides,
    the boy forgets to put her tenth eye to sleep; she catches him and orders her
    daughters to cook him in a ground oven while she summons her brother.
  language: English
  quote_policy: summarized
