- id: obs:1
  text: Alder-Block Boy paddles back across the sea to his mother and brings her cakes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy's mother is astonished, asks where the cakes came from, hears his
    account, and warns that the witch Yagha will devour him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After his mother falls asleep, Alder-Block goes down to the water, boards
    his canoe, and sets off again at night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The girls prepare a vessel with cakes on the shore, and the second sister
    hides nearby to catch the boy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy calls aloud for a sequence of eyes to fall asleep; the hidden girl
    falls asleep.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boy empties the vessel of cakes into his canoe, defecates upon the girl,
    breaks her back with his paddle, and paddles away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The injured girl crawls to her mother; her mother sprinkles her with water
    of life and youth, and the girl becomes sound again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The boy's mother reproaches him for secretly going away at night and repeats
    that the witch Yagha will devour him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The youngest daughter repeats the shore trap with a vessel full of cakes;
    the boy commands eight eyes to sleep, takes the cakes, defecates upon her, strikes
    her back with the paddle, and escapes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Yaghishna herself hides near the vessel on the shore; the boy counts eyes
    to the ninth but forgets the tenth eye.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Because the tenth eye is not put to sleep, Yaghishna catches the boy by the
    breeches when he tries to defecate upon her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Yaghishna carries the boy home, calls him a small reindeer, and says her daughters
    could not catch him but she has caught him.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: Yaghishna says there is an oven dug in the ground and orders the daughters
    to cook the boy for a meal while she calls her brother.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The eldest daughter brings an iron shovel.
  category: action
  evidence_refs:
  - ev:7
