canonical_text:
  quote: ''
  summary: An editorial note discusses houses with two entrances and compares the
    practice with Maritime Koryak and Kamchadal houses. In the tale fragment, One-Side
    enters a house after an aunt strikes his son at the front entrance, is entertained,
    challenges two brothers-in-law to an archery contest, kills them and his wife’s
    sisters, and takes his wife and son home. Later he removes a one-sided skin disguise,
    hangs it on a high larch tree, appears as a handsome young man, proves his identity
    to his wife by showing the skin, and is accepted by her.
  language: English
  quote_policy: summarized
