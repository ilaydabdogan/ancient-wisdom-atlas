canonical_text:
  quote: ''
  summary: A young Lamut man leaves his parents in a deserted country to look for
    people. He reaches an unknown river camp, becomes an adopted son-in-law, and is
    judged through fishing and hunting episodes in which animals appear to him as
    human beings while the camp people identify them as fish and reindeer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Lamut man travels in Chaun toward East Cape with his wife and young son,
    and the surrounding country is described as deserted.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young son says he will look for people and take a wife among them, despite
    his father's warning not to go.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man travels on snowshoes and reaches an unknown river with a large
    camp and tents in two clusters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the camp he stays with a man who has one daughter and is treated as an
    adopted son-in-law.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At open water on the river, the son-in-law catches a small human-appearing
    child on his fish-line, throws it back from fear, and then does the same with
    another.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old man and the other people identify the human-appearing catch as fish
    and say that throwing it back will spoil fishing luck and endanger their existence.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The camp people catch a small human child, put it on a wooden spit, roast
    it before the fire, and eat it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The human son-in-law later catches many fish, all described as human, and
    covers the heap with sticks and stones.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In spring, the old man tells the son-in-law to hide behind a large tree while
    others drive wild reindeer-bucks toward him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The young man sees two giant naked men with hair reaching the ground run past
    him and is too frightened to shoot.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The old man says the beings were wild reindeer-bucks, accuses the young man
    of spoiling the hunt, and expels him as son-in-law.
  category: speech
  evidence_refs:
  - ev:8
