canonical_text:
  quote: ''
  summary: 'In the first tale, a starving old man receives reindeer from the Master
    of the Desert after promising to observe the Lamut custom of giving the best food
    to poor neighbors. After the family later refuses to feed poor strangers, the
    reindeer vanish and the family dies of hunger. In the next tale, an Arctic Fox
    uses a fish weir on an icy river to deceive larger animals: a Bear is made to
    sit still until frozen, then is eaten by the Fox''s young, and the Fox begins
    a similar ruse with a Wolf.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old father wanders all day in open country, finds nothing, stops in the
    desert, and cries aloud in despair.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master of the Desert hears the old father's voice, comes from underground,
    and asks what he wants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old father says his wife and children have had nothing to eat for ten
    days, are starving, and that his hunting boots are full of holes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Master of the Desert says he owns reindeer, will give food, and instructs
    the old father to give the best morsel to a poor neighbor when he has food.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The old wife points out a sleeping boy moving his mouth as if chewing and
    says this presages good luck.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The next morning a large gray herd of reindeer comes to the camp; the largest
    bucks have backs worn by saddles and are identified as the riding reindeer of
    the Master of the Desert.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The people live on the reindeer through the winter and later move camp in
    spring according to Lamut reindeer-herding custom.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At a camp with many tents, the old woman advises her husband not to feed poor
    strangers and to move away.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: After they move away and camp alone, all the reindeer are gone in the morning;
    only tracks remain, and the narrator says they may have ascended to the sky.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Master of the Reindeer is said to grow angry because of their close hands
    and hard hearts and to take away his property.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: When they return to the camp, the people refuse them help because they formerly
    gave nothing; the old couple go away and starve to death.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: An Arctic Fox constructs a fish weir on a small river in winter while cutting
    the ice, and a Bear asks for a share of the catch.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The Fox tells the Bear to sit on wet floor planks and keep watch without moving,
    saying movement would frighten the fish away.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: The Bear sits there for three days and becomes frozen to the ice.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: The Fox calls his children, says he has caught a big fat bear for them, and
    the young foxes bite the Bear to death and eat him.
  category: action
  evidence_refs:
  - ev:14
- id: obs:16
  text: A Wolf later comes to the Fox, asks for a share, and the Fox tells him to
    put his bushy tail into the water and remain still.
  category: sequence
  evidence_refs:
  - ev:15
