canonical_text:
  quote: ''
  summary: A father takes his daughter by sledge to the Unclean Idol's house and leaves
    her there. Following his instructions, she uses ashes and coals to make food,
    but feeds the Unclean Idol's hungry vermin children until nothing remains for
    herself. The next morning the Unclean Idol arrives flying with broad paper wings.
    An editorial note says the term is usually used in Russian stories but here refers
    simply to a monster.
  language: English
  quote_policy: summarized
