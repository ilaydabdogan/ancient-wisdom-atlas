canonical_text:
  quote: ''
  summary: A childless Tungus reindeer owner adopts a human-looking fawn given by
    a doe as a son. The foster child, Reindeer-Born, rapidly devours the herd, so
    the man flees. He finds an iron house with a transparent, thought-reading woman
    who becomes his wife and gives him a neckerchief for protection. On his return,
    Reindeer-Born pursues him; the neckerchief becomes an iron saw, cuts down a tree,
    and the falling tree kills Reindeer-Born. The man returns to the woman in the
    iron house.
  language: English
  quote_policy: summarized
