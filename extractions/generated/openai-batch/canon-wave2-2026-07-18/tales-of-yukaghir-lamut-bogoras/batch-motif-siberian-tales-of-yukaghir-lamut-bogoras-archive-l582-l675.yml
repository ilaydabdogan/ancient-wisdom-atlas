canonical_text:
  quote: ''
  summary: A Tundra Yukaghir tale, with a hero called a Lamut, tells how a tired man
    shelters by a riverbank fire, encounters the Wood-Master with an iron sledge and
    iron reindeer-buck, accidentally causes their destruction through fear, and is
    required to restore them. He repairs the sledge and revives the buck by words
    and touch, refuses wealth, and receives lifelong food through five self-acting
    bows that kill elk. The passage then begins a tale in which Tungus fishers at
    a river mouth encounter a whale-sized sea-spirit who demands one human victim
    each day and threatens their fishing gear, fish, and canoes if they refuse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tale is identified as Tundra Yukaghir, though the hero is called a Lamut.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lamut becomes tired, finds a cavity under a steep riverbank, makes a fire,
    and waits there for better weather.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: He sees a huge iron sledge, a similarly huge iron reindeer-buck attached to
    it, and a black-faced man as tall as a larch tree.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the Lamut cries out in fear, the iron sledge breaks into small pieces
    and the iron buck is scattered to ashes, while the tall man remains standing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The tall man, identified in speech as the Wood-Master or Forest-Owner, angrily
    accuses the Lamut of destroying his property and demands that he repair the sledge
    and restore the driving reindeer-buck to life.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Wood-Master says the Lamut had been thinking about him and calling him
    in his mind, which caused the Wood-Master to come.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Lamut asks to walk alone, saying he cannot achieve anything in the presence
    of another being, and the Wood-Master permits this.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Lamut walks around bushes and speaks commands for the sledge and buck
    to become whole again; they become whole.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Lamut first touches the buck with his right hand and commands it to live,
    but it remains lifeless; when he touches it with his left hand and repeats the
    command, the buck starts and comes to life.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Wood-Master offers immense wealth, but the Lamut asks instead for plenty
    of food for his whole life.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Wood-Master tells the Lamut to go home, sleep, and set five large self-acting
    bows in the forest the next morning, promising that they will give him ample food.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: When the Lamut returns home, his wife says he has been gone several days;
    he reports a heavy snowstorm, but she says there has been no trace of any storm.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The five self-acting bows kill five big elks the first night, and thereafter
    the Lamut catches five elks each time, accumulates meat and skins, becomes rich,
    and lives in plenty until death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the next tale, Tungus fishers living at the mouth of a river see a sea-spirit
    as big as a whale coming up from under the water.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: The sea-spirit says it wants to devour the people, then allows all but one
    to go home on condition that one man be brought to the sea each day as food.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The sea-spirit threatens to carry off nets, drive away fish, overturn canoes,
    and devour the people if they do not obey.
  category: speech
  evidence_refs:
  - ev:8
