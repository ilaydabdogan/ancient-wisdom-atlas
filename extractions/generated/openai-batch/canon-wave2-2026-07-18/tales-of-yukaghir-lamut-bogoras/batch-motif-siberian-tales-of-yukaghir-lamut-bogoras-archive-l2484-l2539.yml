canonical_text:
  quote: ''
  summary: A daughter has been carried away. Her parents pray for a son, who grows
    quickly and later learns from the old woman Underskin that Raven-Man abducted
    his sister. The young man journeys to Raven-Man's desert house, meets his sister,
    and encounters Raven-Man, who arrives as a raven and turns into a young man. Raven-Man
    outdoes him at cracking iron nuts, then pushes him into an overheated steam bath,
    roasts and eats him, and orders the wife to gather the bones into a pouch and
    hang them on a tree.
  language: English
  quote_policy: summarized
