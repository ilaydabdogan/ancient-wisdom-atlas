canonical_text:
  quote: ''
  summary: A wife craves pike, eats a large pike with iron teeth, and afterward bears
    a rapidly growing girl. The girl threatens to eat the family, causing her brother
    to flee. He reaches a tundra house, quiets tied wolves and bears, marries a white-bodied
    girl with long auburn hair, and later returns home on a six-legged reindeer. He
    finds that the Pike-Girl has eaten his parents. He deceives her by sleeping on
    the roof with his legs through the chimney-hole, escapes, and is pursued. The
    Pike-Girl tears and eats legs from the reindeer. When the young man continues
    on foot, his blunt arrow becomes an iron tree with him on top. The Pike-Girl gnaws
    the tree with her iron teeth, and the young man asks a jay to summon his wife’s
    dogs.
  language: English
  quote_policy: summarized
