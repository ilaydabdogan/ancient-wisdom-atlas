canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a Kolyma shaman treats a woman by
    cutting, sucking, blowing on, reassembling, and singing over her body until she
    revives and recovers. A tribute chief offers the shaman a richly equipped swift
    horse and money; the shaman accepts only the horse and a smaller amount of paper
    money, then sends the horse flying away to his mother and sister. The passage
    then begins a hunting tale about three hunting companions, their seasonal sable
    and fox hunts, and a poorer companion’s impatience when the others delay after
    the first snow.
  language: English
  quote_policy: summarized
