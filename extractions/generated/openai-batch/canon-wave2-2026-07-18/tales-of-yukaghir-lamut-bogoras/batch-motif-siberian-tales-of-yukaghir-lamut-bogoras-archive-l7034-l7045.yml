canonical_text:
  quote: ''
  summary: A woman driving a sledge is approached first by a wolverene and then by
    a bear, each asking to ride. She tells each to sit on the sledge stanchion using
    an insulting formula. The bear sits down and breaks the sledge. The old woman
    asks for wood to repair it, and the arctic fox brings a rotten log, which she
    rejects. A note says the Russian version is rhymed prose and differs from usual
    European Russian rhymed versions of the latter half of the tale.
