canonical_text:
  quote: ''
  summary: Three brothers stop at successive log cabins during a sled journey. Iron-toothed
    beings appear inside the cabins, and the eldest brother repeatedly sends the younger
    two away while he fights alone. After one fight he becomes nonhuman and iron-toothed.
    The younger brothers flee homeward, but the eldest catches up, warns them not
    to stop at the first cabin, and says he will chase and punish them if they do.
  language: English
  quote_policy: summarized
