  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Lamut men cross a mountain ridge near the Wolverene River, come to the upper
    Chogodon River, and separate their reindeer herds.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Some young men boast that they can kill any enemies, while old men advise
    caution and warn that rash words and arrogance are punished.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: At dawn, enemies from the east, identified as Chukchee, arrive in great numbers,
    attack the tents, and kill people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: People at the rear gather a few things and flee on riding reindeer while the
