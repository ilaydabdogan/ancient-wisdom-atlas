canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a young man kills two human
    reindeer-bucks by tying their hair to a tree and smoking them, then flees with
    his wife, who is changed after walking around a new fire. It then gives a tale
    of a Chukchee invasion, in which Lamut men boast despite elders' warnings, are
    attacked from the east, and flee while abandoning wounded kin and goods. The passage
    closes with the beginning of a cannibal story, where a family flees neighbors
    who want to eat their daughter, reaches another man-eating group, and the daughter
    is married to a rich reindeer breeder for a hundred reindeer.
  language: English
  quote_policy: summarized
