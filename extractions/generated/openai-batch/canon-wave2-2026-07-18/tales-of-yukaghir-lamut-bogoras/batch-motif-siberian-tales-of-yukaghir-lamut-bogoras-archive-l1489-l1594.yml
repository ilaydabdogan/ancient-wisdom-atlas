  text: He ties the sleeping men's long hair around a tree, makes a large fire on
    the windward side, and they are killed by smoke.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: He reports that he killed both reindeer-bucks; the household gains food, but
    he cannot eat it, so real reindeer are slaughtered for him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: His wife says the others are angry at the continual slaughters and intend
    to kill him, and she advises him to flee to his own country.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wife agrees to go with him and says she will eat fish and reindeer meat
