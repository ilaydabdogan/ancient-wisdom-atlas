canonical_text:
  quote: ''
  summary: 'The excerpt first concludes a tale in which a jay refuses to act as messenger,
    a snow-bunting carries a request to a wife, the wife sends wolves and bears, and
    a Pike-Girl transforms into an ermine before being caught, cut up, burned, and
    scattered as ashes. The passage then begins “The She-Monster”: three orphaned
    sisters live alone; the eldest consumes meat stores and their parents’ bodies
    from the graves; the two younger sisters decide to flee, receive feathers from
    wild geese, fly away, and are warned not to answer or look back if pursued.'
  language: English
  quote_policy: summarized
