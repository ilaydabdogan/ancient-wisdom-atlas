canonical_text:
  quote: ''
  summary: Two adjacent Kolyma tales are included. In a Christmas divination episode,
    girls go to “wed the snow,” trace a magic circle by a water-hole, flee when something
    appears from the bubbling water, and are saved in an old woman’s house when copper
    saucepans worn on their heads are pulled down by a fire-breathing black iron stove
    instead of their own heads. In a comic tale, a husband tests his foolish wife
    by staging impossible catches and false explanations, so that when she later reports
    a real treasure to the chief officer, her account is dismissed because she dates
    it by the staged absurdities.
  language: English
  quote_policy: summarized
