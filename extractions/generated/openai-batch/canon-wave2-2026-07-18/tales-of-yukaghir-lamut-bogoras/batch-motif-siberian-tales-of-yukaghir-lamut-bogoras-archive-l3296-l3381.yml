canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a monster appears from the hearth
    coals, a woman transforms an iron-bound box into a raised storehouse refuge, a
    fox twice tricks the monster out of weapons, and a winged horse and husband destroy
    the monster and cast its remains into the sea. The passage then begins a tale
    about three sisters who find a baby-like piece of stone after wishing for a child;
    the stone child becomes human and is nursed.
  language: English
  quote_policy: summarized
