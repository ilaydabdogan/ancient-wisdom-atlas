canonical_text:
  quote: ''
  summary: The passage is an introduction by Waldemar Bogoras describing the collection,
    selection, attribution, transcription, form, translation, and annotation of tales
    from Russianized natives, Russian creoles, and related groups in the Kolyma and
    Anadyr regions. It notes possible Yukaghir, Lamut, and Chuvantzi provenience,
    Russian influence on titles, and some formal resemblance to ancient Russian lays.
  language: English
  quote_policy: summarized
