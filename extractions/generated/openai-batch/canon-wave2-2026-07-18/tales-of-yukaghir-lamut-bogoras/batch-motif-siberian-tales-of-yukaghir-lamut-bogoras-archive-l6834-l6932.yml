canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a man kills and burns a
    devouring stone wife and returns to a water girl; a Lamut tale in which three
    sisters survive a massacre, the eldest learns the enemies' hidden vulnerability
    in a reindeer liver full of maggots, destroys the maggots, and kills the enemy
    camp; and the beginning of a Yukaghir tale in which two sisters encounter Kose-toka,
    with one escaping by feigned death and another drawing him into a frozen-lake
    game involving stone scrapers.
