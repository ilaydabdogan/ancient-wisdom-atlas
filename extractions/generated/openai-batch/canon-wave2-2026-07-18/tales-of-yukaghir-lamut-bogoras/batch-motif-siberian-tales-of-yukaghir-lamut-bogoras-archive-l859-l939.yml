canonical_text:
  quote: ''
  summary: A young unmarried man returns to a mourning household despite warning,
    hears that a son died after cutting off his own head, falsely claims he can fetch
    a shaman, and travels until he finds an old wolf-woman in a remote cabin. He brings
    her back as a shaman. During her performance, he uses horses with burning willow
    brooms tied to their tails to create a panic outside, while the crowd forgets
    the old woman and he slips back into the house.
  language: English
  quote_policy: summarized
