canonical_text:
  quote: ''
  summary: 'The passage closes one tale: a girl kills vermin with scalding water,
    hides in a box, is found by One-Side/Li''giman, and is ordered to manage a reindeer-sledge
    migration. She sings while traveling, obtains poor and then good tent poles, meets
    a handsome young man who proves he is her one-sided husband by transforming, and
    returns to a mourning village where her parents rejoice and become ashes. The
    passage then begins a separate Raven Tale, in which a childless old couple prays
    to God and receives a daughter who grows rapidly and goes berrying as Raven-Man
    is introduced.'
  language: English with embedded song text and Russian footnote material
  quote_policy: summarized
