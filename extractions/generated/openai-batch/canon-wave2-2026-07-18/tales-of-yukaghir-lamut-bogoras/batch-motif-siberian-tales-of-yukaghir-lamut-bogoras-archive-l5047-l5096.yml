canonical_text:
  quote: ''
  summary: La’la kills one old man, marries another to his mother, restores his brother
    to human form, and gives goods taken from the Chukchee to three people. He later
    marries a chief’s daughter and has two children. After a meal of heath cock, his
    wife vanishes while carrying out the remains; traces in the snow suggest a winged
    abductor. La’la leaves his children at home and searches. A Buzzard refuses information
    because La’la has shot at him, while a Bluejay helps because La’la formerly allowed
    it to peck at food. The Bluejay names Raven-Son, with an iron beak and grass tail,
    as the abductor. La’la finds underground openings inhabited by old women, one
    of whom turns a shred of her apron into a meal.
  language: English
  quote_policy: summarized
