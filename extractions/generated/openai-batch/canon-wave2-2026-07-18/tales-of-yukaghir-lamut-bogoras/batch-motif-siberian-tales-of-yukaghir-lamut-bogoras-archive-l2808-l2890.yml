canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a woman abducted and made wife by
    a bear is helped by her shaman brother-in-law, who changes into a bear and defeats
    the captor. The woman returns home ill and later gives birth to Bear-Ear. The
    passage then begins the tale of Grass-Blade-Girl, in which a childless old woman
    keeps a long grass blade that becomes a girl with miraculous wealth-producing
    powers, attracting a suitor.
