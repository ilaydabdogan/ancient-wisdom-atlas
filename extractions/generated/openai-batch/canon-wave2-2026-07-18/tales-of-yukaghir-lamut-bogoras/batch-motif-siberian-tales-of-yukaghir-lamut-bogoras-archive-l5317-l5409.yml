canonical_text:
  quote: ''
  summary: A young man returns to his cannibal bride’s house, avoids eating human
    meat, discovers and uses her hidden iron weapons to kill her, prepares her flesh
    as breakfast for her parents, escapes by an iron canoe with an old adviser, and
    leaves the parents to drown in a sabotaged wooden canoe. The woman’s pursuing
    head becomes a coastal boulder called Woman’s Head; the canoe also becomes stone,
    and passers-by are said to offer sacrifice at the place for success in a love-suit.
  language: English
  quote_policy: summarized
