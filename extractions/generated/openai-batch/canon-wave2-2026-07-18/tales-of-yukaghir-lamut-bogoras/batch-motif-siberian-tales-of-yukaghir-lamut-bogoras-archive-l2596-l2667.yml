canonical_text:
  quote: a bottle containing the water of life and youth
  summary: A prayer-given youngest son learns that Raven-Man took his sister and destroyed
    his elder brothers. He travels to Raven-Man's house, outdoes him in cracking iron
    nuts, burns him in the bath house, retrieves his brothers' bones, restores them
    with water of life and youth, and returns home with his siblings.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The parents pray to God for a son or daughter, and God gives them a son described
    as the last one to be given.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy grows strong and asks whether he ever had brothers or sisters; his
    parents avoid telling him because they fear he will go away and perish.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy shoots an arrow into old woman Underskin's chimney-hole, and she tells
    him that Raven-Man took away his sister and destroyed his brothers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy tells his parents that he will look for Raven-Man whether or not they
    give their blessing, and then he sets off despite their sorrow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After a long journey the boy finds a house where his sister sits; she recognizes
    him and warns that Raven-Man will devour him like the others.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Raven-Man flies home, croaks for food, lands on the roof, and turns into a
    strong man before entering the house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Raven-Man has his wife bring four dozen iron nuts; the young man cracks two
    or three while Raven-Man is trying to open one.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Raven-Man sends his wife to heat the steam bath; she cries, and Raven-Man
    warns that he may swallow her some day, then says this is only a joke.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the bath house, the young man insists Raven-Man enter first, pushes him
    inside, sets the bath house on fire, burns Raven-Man, and scatters the ashes to
    the winds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The sister climbs to a tree and takes down the brothers' bones; the young
    man enters the storehouse and finds a bottle of water of life and youth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The young man joins the oldest brother's bones and sprinkles them three times;
    flesh appears, then skin, and then the brother sits up alive. He repeats this
    for the second brother.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The siblings gather Raven-Man's goods and return to their parents; the parents
    are joyful and become ashes scattered around.
  category: sequence
  evidence_refs:
  - ev:10
