canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which Magus tricks and kills
    the evil spirit Kosetoka after killing Kosetoka’s children, followed by the “Story
    of Gege-Woman,” where an old man’s three sons disobey a warning, encounter Gege-Woman
    at the seashore, and the first two are devoured after rejecting her food. The
    youngest accepts her food and lives with her, but later flees after his father
    traps the predatory animals; Gege-Woman and Haihai-Woman fight over him and kill
    each other, after which he and his family take their property and become rich.
  language: English
  quote_policy: summarized
