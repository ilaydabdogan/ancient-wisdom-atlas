  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The She-Monster enters the house and warns the human sister not to leave for
    long; the human sister goes out, and the boy slips out after her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The mother and boy enter a wooden box at a storehouse; the mother addresses
    it, and it becomes an iron storehouse standing high on twelve iron supports.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The She-Monster catches the girl, swallows her, and later spits out her small
    bones.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The She-Monster gnaws at the iron supports until only three remain; the husband
