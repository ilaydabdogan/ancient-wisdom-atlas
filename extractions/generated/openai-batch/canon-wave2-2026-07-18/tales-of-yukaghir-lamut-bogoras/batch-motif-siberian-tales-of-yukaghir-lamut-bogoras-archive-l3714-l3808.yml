canonical_text:
  quote: "“She took off her feathers and turned into her former self.”"
  summary: A youngest feathered sister escapes a pursuing She-Monster, marries a young
    man after dropping feathers through his chimney, and has two children. The She-Monster
    later returns, injures both children, devours the daughter, attacks a magically
    transformed iron refuge holding the mother and son, and is killed and destroyed
    by the husband. The passage then begins a separate tale about three brothers traveling
    in lonely places.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The eldest sister, identified as a She-Monster, pursues from the ground while
    the others fly above; the second sister looks back and falls into the monster’s
    mouth, where she is swallowed without chewing.
  category: sequence
  evidence_refs:
  - ev:1
