  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The youngest sister reaches a solitary house, sits near the chimney-hole,
    and watches a young man feathering arrows by the fireplace.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the young man lacks feathers, the youngest sister drops white, black,
    and another feather through the chimney; after he asks whether she is human or
    an evil spirit, she removes her feathers, becomes her former self, descends into
    the house, and becomes his wife.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The married couple live together; the woman gives birth first to a boy and
    then to a girl, while the husband goes out daily in search of game.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: One spring day the children play on the earth bench in front of the house;
