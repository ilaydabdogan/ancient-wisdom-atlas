canonical_text:
  quote: "“O Cat, my Cat! The Fox is carrying me off”"
  summary: The passage concludes an animal tale in which the Fox carries off the Cock,
    the Cock calls to the Cat, and the Cat pursues the Fox. A dulcimer song at the
    Fox’s house leads to members of the Fox’s household being sent out with cakes
    and killed. The Tom-Cat then catches the Cock, takes him home, beats him, and
    warns him to keep the door closed. Editorial notes compare the tale with Old World
    and European Russian versions and mention a variant motif in which the Cock is
    killed, treated with ice and fire, revives, and crows.
  language: English
  quote_policy: quoted
