canonical_text:
  quote: ''
  summary: The passage contains an animal tale in which the bear is made master of
    beasts, the wild reindeer refuse obedience, and a reindeer fawn gains delays from
    the Forest-Owner until its iron-like antlers allow it to kill him. The fawn claims
    chiefship, defeats the bear in war, but is killed from behind by a wolf, explaining
    why reindeer die by wolf attack rather than natural death. The passage then begins
    a tale of a great shaman seeking the best husband for his daughter by transforming
    into foxes, an ermine, and a fish; most men are dragged into water and drowned,
    while a poor wandering young man survives river, rock, forest, and sea ordeals.
  language: English
  quote_policy: summarized
