canonical_text:
  quote: ''
  summary: A man named Latka dies, leaving his daughter alone with his assistant Pondandi.
    Pondandi stops doing household work and sits silently across the river, staring
    at her while she makes fire, fetches water, cooks, and asks what he wants. When
    she asks whether he wants to marry her, he jumps and dances; she then tells him
    to kill a big brown bear for a blanket if he wants marriage. A source note describes
    probable Chuvantzi provenance and compares the verse form with an old Russian
    lay and a Kolyma similar lay/lullaby.
  language: English
  quote_policy: summarized
