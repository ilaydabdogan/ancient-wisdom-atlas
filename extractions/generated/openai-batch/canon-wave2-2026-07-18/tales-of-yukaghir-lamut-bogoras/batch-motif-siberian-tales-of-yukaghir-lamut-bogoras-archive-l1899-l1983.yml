canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a Lamut man searching for lost reindeer
    is confronted by a huge white old man, sees the herd going up to the sky, and
    becomes fixed in stone. It then gives a tale of a great shaman who challenges
    a wandering boy to a shamanistic contest; the shaman's tiny bear is defeated by
    the boy's louse, and the shaman dies. The passage begins a further tale describing
    olden Lamut life in the mountains before Russians arrived, with stone and bone
    implements and snow melted for water over fire.
  language: English
  quote_policy: summarized
