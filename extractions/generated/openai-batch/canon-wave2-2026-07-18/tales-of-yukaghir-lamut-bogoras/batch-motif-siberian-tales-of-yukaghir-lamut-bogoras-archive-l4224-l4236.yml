canonical_text:
  quote: ''
  summary: A Kolyma shaman says he will give a signal and may then be girded. He practices
    by making three raven-like croaks, three bear-like roars, and three wolf-like
    howls. He then rises so that his head pierces the roof and his garment bursts
    between the shoulders; the door opens and seven shamans are hurled. An editorial
    note relates this to shamanistic fits, improvised singing, unknown-language speech,
    and lack of memory afterward.
  language: English
  quote_policy: summarized
