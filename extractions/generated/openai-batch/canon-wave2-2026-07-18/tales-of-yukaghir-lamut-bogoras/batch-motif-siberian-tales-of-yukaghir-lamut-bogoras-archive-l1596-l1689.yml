canonical_text:
  quote: ''
  summary: The passage contains the end of one tale, in which a woman is fattened
    by her husband, warned by a poor herdsman, escapes on reindeer, and is protected
    when her father kills three pursuers. It then begins a Lamut tale in which a hungry
    old shaman, refused food by wealthy reindeer owners, dreams that wolves scatter
    the herd; after he moves away, the herd disappears, wolf tracks are seen, a snowstorm
    erases the trail, and the remaining people starve.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A husband slaughters fat bucks and gives his wife the best fat, while her
    parents rejoice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A poor young herdsman says that the feeding is meant to fatten the woman before
    she is slaughtered and eaten.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: At night the husband feels the woman’s haunches and belly and says she is
    still not fat enough, telling her to eat more fat and marrow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The herdsman advises the woman to flee by cutting through the cover of the
    sleeping room.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fugitives rip open the sleeping-room cover, take riding reindeer, and
    ride away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Three men pursue the fugitives; the father waits in a narrow pass with a bow
    and kills the pursuers one after another.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The girl reaches another country and marries a rich reindeer breeder described
    as well-meaning and ignorant of human flesh.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In winter some Lamut camp together, but wealthy reindeer owners give nothing
    to an old shaman who has no food.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: After sleeping hungry, the old shaman dreams that wolves scatter the reindeer
    herd and moves his camp away with a hunter from his family.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The next morning the reindeer are gone, wolf tracks are visible in the deep
    snow, and the richest man has no riding reindeer left.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: A violent snowstorm lasts several days, covers the reindeer tracks and human
    tracks, and leaves the people without game or food.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The starving people eat saddles, harnesses, tent covering, and clothes, and
    finally gnaw their own hands.
  category: action
  evidence_refs:
  - ev:10
