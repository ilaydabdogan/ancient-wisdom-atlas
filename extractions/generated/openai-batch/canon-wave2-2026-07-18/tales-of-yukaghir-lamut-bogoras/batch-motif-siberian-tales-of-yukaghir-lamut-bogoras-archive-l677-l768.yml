canonical_text:
  quote: ''
  summary: A Tungus community gives repeated human victims to a sea-spirit. When the
    chief's only daughter is left by the sea, a parentless wandering young man stays
    with her, fights the sea-monster, and kills it. A herdsman then murders the sleeping
    rescuer, claims the deed, and seeks to marry the girl. The girl and other village
    girls recover the rescuer's body with a huge drag-net; healing water from under
    a rock revives him. The true rescuer is recognized, the herdsman is killed, and
    the young man marries the chief's daughter.
  language: English
  quote_policy: summarized
