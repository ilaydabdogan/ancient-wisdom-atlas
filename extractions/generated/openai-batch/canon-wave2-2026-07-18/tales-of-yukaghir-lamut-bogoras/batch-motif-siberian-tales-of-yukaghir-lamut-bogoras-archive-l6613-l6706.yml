  quote: ''
  summary: The passage contains the ending of one domestic tragic-comic tale, the
    complete 'Story of a Small Girl,' and the beginning of 'Story about Yaghishna.'
    Repeated episodes include old couples, children obtained or born abruptly, household
    cooking tasks, fatal choking, fire and fuel, family anger, deaths, a girl sinking
    through the earth, brothers following her, and an encounter with the she-monster
    Yaghishna who offers adoptive kinship and reacts violently when rejected.
