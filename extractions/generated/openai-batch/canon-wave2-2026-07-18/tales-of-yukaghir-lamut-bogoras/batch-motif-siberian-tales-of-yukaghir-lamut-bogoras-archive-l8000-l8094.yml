canonical_text:
  quote: ''
  summary: The passage contains a tale of three brothers married to three sisters.
    While the brothers are away checking deadfalls, beings who appear to be the husbands
    return; the youngest sister notices their black, protruding iron teeth, flees,
    makes a clothed tree-stump decoy beside a fire, hardens a wooden stake, and kills
    a pursuing monster when it bites the decoy. Neighboring men later find the original
    settlement empty, and the real husbands return after a week. The passage then
    begins another tale in which Fox escapes a man and dogs with Owl's help but is
    killed when Owl drops her from the air.
  language: English
  quote_policy: summarized
