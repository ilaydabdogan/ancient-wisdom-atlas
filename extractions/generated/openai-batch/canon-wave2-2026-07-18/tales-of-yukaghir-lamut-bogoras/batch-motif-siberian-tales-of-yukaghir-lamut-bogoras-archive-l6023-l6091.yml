canonical_text:
  quote: ''
  summary: The passage contains the end of one Yaghishna tale about Kundarik and the
    beginning of another. In the first, Yaghishna threatens Kundarik’s parents, pursues
    the boy, and is tricked into being impaled and then trapped in a grave-like hole.
    Kundarik returns to his parents. In the second, Yaghishna enters after parents
    flee, finds their swaddled daughter, places her near the chimney under a dish,
    prepares a fire and frying pan, and commands and questions the girl.
