canonical_text:
  quote: "“A great disease is coming towards us...”"
  summary: A powerful Yukaghir shaman on the Indighirka foresees a great disease,
    hides at a crossway, overhears three red sisters, and traps the eldest through
    a red hair in a sealed iron box placed in fire. After releasing and feeding her,
    she rejoins her sisters, who report destroying villages and leaving one boy and
    one girl alive in one of them. The passage then begins another tale in which a
    shaman dies while practicing with his drum, is left in an empty hut after the
    people move away, and young Yakut men challenge one another to cut off his braid
    at midnight.
  language: English
  quote_policy: quoted
