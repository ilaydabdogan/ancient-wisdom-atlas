  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The shaman orders a big fire, places the box in it, and rakes the fire until
    the box glows red.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A wailing human-like voice from the box asks to be set free; the shaman continues
