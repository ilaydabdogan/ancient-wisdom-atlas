canonical_text:
  quote: ''
  summary: A father keeps his daughter's name secret and promises her as wife to whoever
    can guess it. An overworked servant whispers the name at an ice hole; a monster
    emerges, learns the name, guesses it before the household, and marries the daughter.
    The bride receives a winged horse as dowry and follows the monster down through
    the river ice hole to his under-river settlement, where she is frightened by other
    monsters and escapes when the horse flies back upward. The monster predicts she
    will remarry, have three children, and that he will come again. She later marries
    a mighty hunter, has the predicted children, and warns him not to tether the horse
    to a green tree; he eventually forgets and does so.
  language: English
  quote_policy: summarized
