canonical_text:
  quote: ''
  summary: The excerpt contains the Tundra Yukaghir tale of an unnamed girl pursued
    by an evil spirit, using transformed objects and animal transformations during
    flight, ending at a Lamut tent where the spirit appears as the eldest of three
    brothers and marries her. It also includes the beginning of a tale about a poor
    man who wishes to see the Wood-Master and becomes lost in a snowstorm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed girl knows no man, does not know her parents, owns many reindeer,
    summons strayed reindeer by singing, and finds fire and cooked food ready at home.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A darkness approaching across half the sky is identified as an evil spirit
    with one lip touching the sky, the other dragging on the ground, and an open mouth
    ready to swallow things.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The girl takes an iron-tipped staff and flees from the evil spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The girl throws a small ivory comb behind her; it becomes a dense forest that
    interrupts the pursuit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The evil spirit swallows, chews, digests, and defecates the forest, after
    which it becomes a small ivory comb again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The girl loosens a red handkerchief, which becomes a fire extending from heaven
    to earth; the evil spirit drinks a river dry and uses the water to extinguish
    the fire.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: By striking the ground with her staff, the girl successively becomes an arctic
    fox, a wolverene, a wolf, and a bear with a copper bell in each ear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The pursuing mouth continues after the girl through her animal transformations
    and nearly swallows her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The girl reaches a Lamut tent covered with white skins, falls unconscious
    at the entrance, and awakens with a young man standing on each side of her.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The evil spirit appears behind the girl in the form of a handsome youth who
    is combing and parting his hair.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Three young men invite the girl into the tent; the one formerly appearing
    as the evil spirit says they are three brothers, identifies himself as eldest,
    and says he wanted to bring her to his tent.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The girl chooses the eldest brother as her husband, marries him, and lives
    with him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the next tale opening, a poor man catches hares in deadfalls for his family,
    wonders what the Wood-Master looks like, and later becomes lost during a heavy
    snowstorm.
  category: sequence
  evidence_refs:
  - ev:11
