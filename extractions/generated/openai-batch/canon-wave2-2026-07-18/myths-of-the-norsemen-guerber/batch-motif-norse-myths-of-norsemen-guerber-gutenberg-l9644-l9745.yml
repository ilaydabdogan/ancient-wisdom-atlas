canonical_text:
  quote: ''
  summary: The passage recounts Helgi's battle against the Hundings, Dag's killing
    of Helgi with Odin's spear, Gudrun's night visit to Helgi's tomb, Helgi's entrance
    into Valhalla and Gudrun's renewed Valkyr role. It then recounts Sinfiotli's poisoning
    by Borghild, Sigmund's grief, Odin appearing as a one-eyed boatman to take Sinfiotli
    away by skiff, Sigmund's marriage to Hiordis, and Sigmund's final battle in which
    a one-eyed warrior shatters his sword before he is mortally wounded.
  language: English
  quote_policy: summarized
