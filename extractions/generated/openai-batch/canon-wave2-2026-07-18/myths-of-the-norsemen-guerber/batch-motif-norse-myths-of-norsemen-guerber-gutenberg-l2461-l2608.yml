canonical_text:
  quote: ''
  summary: The passage introduces Thor/Donar as a thunder god of disputed parentage,
    remarkable strength, fosterage by Vingnir and Hlora, admission to Asgard, possession
    of a realm and great hall, and association with lower-status dead. It describes
    his fiery appearance, inability to cross Bifröst, journey by rivers to the Urdar
    fountain and Yggdrasil, his magic hammer Miölnir with gauntlet and belt, ritual
    uses of the hammer sign, and his storm hat, chariot, and goats.
  language: English
  quote_policy: summarized
