  quote: ''
  summary: The passage describes Nicors and other lesser water divinities, including
    Undines, Stromkarls, Nixies, Necks, Father Rhine, and the Lorelei. It recounts
    water spirits recognized by wet garments, playing music near streams, seeking
    assurances of salvation, and the Lorelei luring boatmen to death, aiding and possibly
    taking a fisherman, and escaping armed captors by spell and water-chariot.
  language: English
  quote_policy: summarized
