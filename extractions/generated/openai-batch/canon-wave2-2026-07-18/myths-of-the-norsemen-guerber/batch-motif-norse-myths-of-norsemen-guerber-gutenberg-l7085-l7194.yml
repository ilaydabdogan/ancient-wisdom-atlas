  quote: ''
  summary: Thor fishes for Iörmungandr with an ox head, struggles with the Midgard
    snake, and loses it when Hymir cuts the line. Thor then proves his strength by
    breaking Hymir's beaker, lifting the huge kettle sought for Ægir's feast, slaying
    pursuing frost giants with Miölnir, and returning with Tyr to Ægir. The passage
    also describes Ægir and Ran as cruel sea divinities and mentions mermen and mermaids
    whose swan plumage or seal-garments may be found by mortals.
  language: English
  quote_policy: summarized
