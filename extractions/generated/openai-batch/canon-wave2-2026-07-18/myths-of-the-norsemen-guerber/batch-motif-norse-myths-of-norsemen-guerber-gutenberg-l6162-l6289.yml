canonical_text:
  quote: ''
  summary: The passage describes the Norns as three independent goddesses of fate
    named Urd, Verdandi, and Skuld, associated with past, present, and future. They
    dwell by Yggdrasil near the Urdar fountain, weave fate, tend the sacred tree,
    guard golden apples, care for swans, sometimes visit mortals in swan plumage or
    mermaid-like forms, and are consulted by gods including Odin. The passage also
    mentions lesser Norns as human guardian spirits and begins the story of Nornagesta
    with three Norns visiting a newborn child in Denmark.
  language: English
  quote_policy: summarized
