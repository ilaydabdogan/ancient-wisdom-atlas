  quote: Odin, Wuotan, or Woden was the highest and holiest god of the Northern races.
  summary: The passage describes Odin as the highest god, Allfather, god of wisdom,
    victory, battle, and protector of heroes. It describes his throne Hlidskialf,
    appearance, sacred objects, ravens, wolves, halls in Asgard, Valhalla, and the
    Valkyrs' conveyance of chosen slain warriors to Valhalla.
  language: English
