canonical_text:
  quote: ''
  summary: Loki returns to Idavold with a mistletoe shaft, manipulates the blind Hodur
    into throwing it, and Balder falls dead. The gods mourn, Frigga asks that Hel
    be entreated to release Balder, and Hermod volunteers to ride Sleipnir toward
    Nifl-heim. Meanwhile the gods prepare Balder's ship Ringhorn as a funeral pyre
    with costly offerings. Nanna dies beside Balder, companion animals are slain,
    thorns are placed on the pyre, and Odin adds Draupnir and whispers into his dead
    son's ear.
  language: English
  quote_policy: summarized
