canonical_text:
  quote: ''
  summary: 'The passage interprets Balder’s death and mourning in seasonal, ethical,
    and ritual terms: all things weep for Balder except Thok; the weeping is associated
    with spring thaw; Balder and Nanna in an underground prison send Draupnir and
    a flowery tapestry to Odin and Frigga; Balder, Hodur, and Loki are read as good,
    evil, and tempter; a midsummer festival with bonfires honors Balder’s death and
    descent to the lower world and is said to have been replaced by St. John’s day.'
  language: English
  quote_policy: summarized
