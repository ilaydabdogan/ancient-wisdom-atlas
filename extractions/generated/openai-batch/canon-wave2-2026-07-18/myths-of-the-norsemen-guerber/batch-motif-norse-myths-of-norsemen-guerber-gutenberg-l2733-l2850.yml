  quote: ''
  summary: The passage recounts dwarfs forging magical objects while Loki, disguised
    as a gadfly, interferes; the gods judge a wager between Brock and Loki; Loki is
    punished by having his lips sewn; Thor's hammer is described as a weapon against
    giants and harmful cold; and Thor begins a journey to Jötun-heim, where his goats
    are slain, eaten, and restored after a bone-breaking transgression by Thialfi.
