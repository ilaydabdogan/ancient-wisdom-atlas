canonical_text:
  quote: ''
  summary: The passage presents Eástre/Ostara as a spring goddess identified with
    Frigga and linked with Easter, coloured eggs, Easter-stones, flowers, and bonfires.
    It then describes related Germanic forms of the goddess as Bertha or the White
    Lady, Frau Gode/Wode, Vrou-elde, Nerthus/Hlodyn, and Huldra, emphasizing functions
    including care for unborn or unbaptized children, agriculture, spinning, noble
    ancestry, death omens, prosperity, the Wild Hunt, a veiled land-blessing procession,
    ritual bathing, and protection of cattle.
  language: English
  quote_policy: summarized
