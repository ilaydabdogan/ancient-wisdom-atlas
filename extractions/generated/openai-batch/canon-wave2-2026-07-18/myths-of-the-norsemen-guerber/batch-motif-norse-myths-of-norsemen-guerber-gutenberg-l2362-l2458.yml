  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: public_domain
- id: ev:4
  type: summary
  locator: lines 2379-2387
  quote_or_summary: Stone altars known as Easter-stones are dedicated to Ostara, crowned
    with flowers, and used in games with dancing by bonfire light despite denunciations
    and edicts.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: public_domain
- id: ev:5
  type: summary
  locator: lines 2389-2396
  quote_or_summary: In parts of Germany, Frigga, Holda, or Ostara is called Brechta,
    Bertha, or the White Lady; in Thuringia she dwells in a hollow mountain and watches
    Heimchen, souls of unborn or unbaptized children.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: public_domain
- id: ev:6
  type: summary
  locator: lines 2396-2404
  quote_or_summary: Bertha watches over agriculture; her infant troop waters plants
    with jars; tradition says she left the country with her infant train dragging
    her plough and settled elsewhere.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: public_domain
- id: ev:7
  type: summary
  locator: lines 2404-2410
  quote_or_summary: Bertha is called the legendary ancestress of several noble families
    and is associated with the mythical mother of Charlemagne and a Golden Age saying
    about Bertha spinning.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: public_domain
- id: ev:8
  type: summary
  locator: lines 2411-2415
  quote_or_summary: Bertha's large flat foot is attributed to pressing the treadle
    of her wheel; medieval art represents her as splay-footed, la reine pédauque.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: public_domain
- id: ev:9
  type: summary
  locator: lines 2416-2422
  quote_or_summary: As ancestress of the imperial house of Germany, the White Lady
    is said to appear in the palace before a family death or misfortune; the passage
    mentions an 1884 newspaper report of such a sighting.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: public_domain
- id: ev:10
  type: summary
  locator: lines 2423-2428
  quote_or_summary: Bertha is renowned for spinning and regarded as patroness of that
    work; during the twelve nights between Christmas and January 6 she inspects household
    spinning.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: public_domain
- id: ev:11
  type: summary
  locator: lines 2429-2435
  quote_or_summary: Maidens with careful work receive golden thread or fine flax;
    careless spinners have wheel and flax damaged and may be punished if they failed
    to honor the goddess by eating seasonal cakes.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: public_domain
- id: ev:12
  type: summary
  locator: lines 2436-2442
  quote_or_summary: In Mecklenburg, the same goddess is Frau Gode or Wode, female
    form of Wuotan or Odin; her appearance brings prosperity, and she leads the Wild
    Hunt on a white horse with attendants changed into hounds and wild beasts.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: public_domain
- id: ev:13
  type: summary
  locator: lines 2443-2452
  quote_or_summary: In Holland she is Vrou-elde, linked to the Dutch name for the
    Milky Way; in Northern Germany she is Nerthus or Mother Earth, whose sacred car
    is kept on an island and used for a yearly veiled journey to bless the land, drawn
    by two cows and escorted by priests.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: public_domain
- id: ev:14
  type: summary
  locator: lines 2452-2457
  quote_or_summary: When Nerthus passes, people cease warfare, lay aside weapons,
    wear festive attire, and avoid quarrels until she returns to her sanctuary.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: public_domain
- id: ev:15
  type: summary
  locator: lines 2457-2464
  quote_or_summary: Afterward the car and goddess are bathed in a secret lake, the
    Schwartze See in Rügen, which swallows the assisting slaves; priests then resume
    watch over the sanctuary and grove.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: public_domain
- id: ev:16
  type: summary
  locator: lines 2465-2472
  quote_or_summary: In Scandinavia, the goddess is Huldra and has attendant wood-nymphs
    who sometimes dance with mortals on the village green and are identified by a
    cow's tail beneath long snow-white garments.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: public_domain
- id: ev:17
  type: summary
  locator: lines 2472-2476
  quote_or_summary: Huldra folk are protectors of cattle on mountain-sides and sometimes
