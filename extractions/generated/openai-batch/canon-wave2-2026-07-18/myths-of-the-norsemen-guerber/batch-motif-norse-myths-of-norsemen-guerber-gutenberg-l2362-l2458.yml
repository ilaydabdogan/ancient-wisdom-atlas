candidate_motifs:
- id: motif:1
  label: Spring renewal after winter
  taxonomy_refs:
  - seasonal_cycle
  - death_rebirth
  - resurrection
  basis: Eástre/Ostara is explicitly connected with spring and Nature's resurrection
    after the long death of winter.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is a later retelling and uses interpretive language such as
    identification with Frigga.
- id: motif:2
  label: Ritual exchange of life-symbol eggs
  taxonomy_refs:
  - sacred_exchange
  - resurrection
  basis: The passage describes exchanging coloured eggs and explains the egg as a
    type of the beginning of life and later as symbolical of the Resurrection.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The egg is not described as a cosmic egg; no cosmic-creation function
    is stated.
- id: motif:3
  label: Spring goddess festival at stones and fire
  taxonomy_refs:
  - seasonal_cycle
  basis: Easter-stones dedicated to Ostara are crowned with flowers, while young people
    dance around them by bonfire light.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage describes custom and dedication but does not give a mythic
    narrative for the festival.
- id: motif:4
  label: Mother goddess and agricultural guardianship
  taxonomy_refs:
  - mother_goddess
  - seasonal_cycle
  basis: Bertha watches over agriculture and cares for plants; Nerthus is called Mother
    Earth and journeys to bless the land; Huldra folk protect cattle.
  evidence_refs:
  - ev:6
  - ev:13
  - ev:17
  confidence: high
  cautions: Several regional names are treated as one goddess by the passage, but
    external confirmation is not provided here.
- id: motif:5
  label: Guardian of unborn or unbaptized child-souls
  taxonomy_refs: []
  basis: Bertha dwells in a hollow mountain and watches Heimchen, described as souls
    of unborn children and of those who died unbaptized.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage gives location and guardianship but does not describe an afterlife
    journey.
- id: motif:6
  label: Mythic ancestress of noble or imperial lineages
  taxonomy_refs:
  - royal_legitimacy
  basis: Bertha is described as legendary ancestress of several noble families and
    as ancestress of the imperial house of Germany.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: medium
  cautions: The passage gives genealogical prestige associations rather than a detailed
    succession myth.
- id: motif:7
  label: Female supernatural judge of household labor
  taxonomy_refs:
