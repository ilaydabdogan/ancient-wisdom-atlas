canonical_text:
  quote: ''
  summary: Sigurd gains the ability to understand birds when Fafnir's blood touches
    his lips. The birds warn him that Regin plots against him and advise him to kill
    Regin, take the dragon's treasure, and eat the dragon's heart and blood. Sigurd
    follows the advice, equips himself with the hoard, and hears from the birds of
    a sleeping warrior maiden on a flame-ringed mountain. He rides through the flames,
    enters a shield-hung castle, finds an armored sleeper, removes her armor, and
    awakens Brunhild, who loves him at first sight and identifies herself as a Valkyr
    connected with Odin's command.
  language: English
  quote_policy: summarized
