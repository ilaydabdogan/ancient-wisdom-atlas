canonical_text:
  quote: ''
  summary: Frithiof visits his father's burial mound, asks Balder how to atone, receives
    a vision of a new temple, and builds a splendid sanctuary. King Helgé later attempts
    to destroy a forgotten shrine in the Finnish mountains and is killed when the
    deity's image falls on him. In the consecrated Balder temple, Frithiof disarms,
    reconciles with Halfdan through a handclasp, and receives Ingeborg as bride when
    Halfdan places her hand in his.
  language: English
  quote_policy: summarized
