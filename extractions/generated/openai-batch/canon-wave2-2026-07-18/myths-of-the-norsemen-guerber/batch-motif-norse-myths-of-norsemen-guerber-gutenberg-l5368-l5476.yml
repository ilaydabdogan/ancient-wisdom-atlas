  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In distress, the twelve jurists call upon Forseti for help, and a thirteenth
    passenger appears in the vessel.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The newcomer silently takes the rudder, steers toward the highest waves, brings
    the vessel to an island, and motions the men to disembark.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The stranger flings his battle-axe, and a limpid spring gushes from the spot
    where the axe falls.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The twelve men drink the spring water silently, sit in a circle, and observe
