canonical_text:
  quote: ''
  summary: 'The passage describes Forseti, son of Balder and Nanna, as a wise and
    gentle god of justice who dwells in Glitnir and reconciles disputes. It then recounts
    the Heligoland story: twelve Frisian elders seeking to compile laws are driven
    off course by a storm, pray to Forseti, and are joined by a thirteenth passenger
    who guides them to an island, creates a spring with a battle-axe, delivers a legal
    code, vanishes, and is identified as Forseti. The island is made holy, its spring
    and judicial customs are revered, and justice is associated with the light seasons
    rather than winter.'
  language: English
  quote_policy: summarized
