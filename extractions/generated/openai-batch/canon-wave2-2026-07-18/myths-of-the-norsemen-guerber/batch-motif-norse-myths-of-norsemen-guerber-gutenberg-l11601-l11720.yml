canonical_text:
  quote: ''
  summary: The passage opens with a poetic address to the sea as a desired barrow.
    Helgé pursues Frithiof with ten dragon-ships, but they sink, and Frithiof departs
    in Ellida. Frithiof then lives as a sea-roving viking, later returns north, disguises
    himself in a bear-hide, and enters Sigurd Ring's court during Yule. He hides his
    identity, displays great strength, is recognized emotionally by Ingeborg, answers
    Sigurd Ring's vow over the Yule boar with a counter-vow, drains a huge mead horn,
    and is invited to remain at court until spring.
  language: English
  quote_policy: summarized
