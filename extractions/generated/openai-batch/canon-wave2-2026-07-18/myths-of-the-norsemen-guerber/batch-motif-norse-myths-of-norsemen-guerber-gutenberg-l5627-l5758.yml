  quote: ''
  summary: The passage recounts Loki stealing Freya's necklace after changing into
    a flea, Heimdall's shapeshifting pursuit and recovery of the necklace, an authorial
    interpretation of the episode as a conflict between drought and rain, and the
    story of Heimdall as Riger visiting three households whose offspring become the
    ancestors of thralls, husbandmen, nobles, and kings.
  language: English
  quote_policy: summarized
