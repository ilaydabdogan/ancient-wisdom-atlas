canonical_text:
  quote: ''
  summary: The passage recounts a trial in which Siggeir, Volsung, and nine Volsung
    sons fail to draw a divine sword from an oak or Branstock, while the youngest
    son, Sigmund, draws it easily. Siggeir envies and covets the weapon, invites the
    Volsungs to his court, ambushes them, kills Volsung, captures the sons, and takes
    Sigmund's sword. Signy warns her kin and later helps Sigmund survive after the
    brothers are chained to a fallen oak and a monster devours them one by one; honey
    on Sigmund's face lures the beast close enough for him to bite its tongue, break
    his bonds, kill it, and hide in the forest.
  language: English
  quote_policy: summarized
