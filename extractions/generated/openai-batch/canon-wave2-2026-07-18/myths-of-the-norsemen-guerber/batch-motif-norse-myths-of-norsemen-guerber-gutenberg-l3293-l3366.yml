  summary: Thor defeats Geirrod by catching and returning a red-hot wedge, then sets
    the petrified giant corpse up as a monument. The passage then describes Thor's
    worship, names derived from him, Yule rites involving an oak log, red bridal customs,
    wooden temples and statues, and a conversion episode in which King Olaf has a
    Thor idol smashed, revealing vermin inside and ending local reverence for the
    image.
