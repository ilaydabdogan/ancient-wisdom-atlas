canonical_text:
  quote: ''
  summary: The excerpt recounts a Teutonic/Nibelungenlied version of Sigurd/Siegfried's
    death, Gudrun's flight and later magic-persuaded marriage to Atli, Atli's scheme
    to trap the Niblung princes for their hoard, Gudrun's attempted warning, the burial
    of the hoard in the Rhine, the battle at Atli's hall, and Gunnar's refusal under
    torture to reveal the treasure while Högni lives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that in the Teutonic version Sigurd/Siegfried is lured
    from a forest hunting party to a brook and struck through the back with a spear;
    his body is brought home and laid at his wife's feet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gudrun flees from her father's house after being robbed of joy and takes refuge
    with Elf, Sigurd's foster father.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gudrun befriends Thora, stays several years, embroiders Sigurd's great deeds
    on tapestry, and watches over her daughter Swanhild.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Atli, Brunhild's brother and King of the Huns, demands atonement from Gunnar
    for Brunhild's death, and Gunnar promises Gudrun to him after her widowhood.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Niblung brothers and Grimhild find Gudrun; Grimhild administers a magic
    potion, and Gudrun is persuaded to leave Swanhild in Denmark and become Atli's
    wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Gudrun secretly detests Atli, and the birth of Erp and Eitel does not console
    her for earlier losses and Swanhild's absence.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Atli hears Gudrun's descriptions of Niblung wealth and secretly plans a pretext
    for seizing it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Atli sends Knefrud or Wingi to invite the Niblung princes to his court while
    intending to kill them once they are in his power.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Gudrun sends her brothers a rune message with the ring Andvaranaut, around
    which she has twined a wolf's hair.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The messenger partly effaces the runes and changes their meaning; Gunnar accepts
    the invitation despite warnings from Högni and Grimhild and an ominous dream of
    Glaumvor.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Before departing, Gunnar buries the Niblung hoard in a deep hole in the Rhine;
    only the royal brothers know the location, and they swear never to reveal it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The royal band rides to Atli's hall, recognizes that they have been trapped,
