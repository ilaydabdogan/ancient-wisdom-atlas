  summary: The passage describes the birth and heavenly course of Day, the pursuit
    of Sun and Moon by wolves, eclipse explanations, moon-children with a water pail,
    the appointment of time and seasons, the giant source of cold winds, the division
    of beings from Ymir's flesh into dwarfs and elves, and Odin leading the gods to
    Idawold beyond the unfrozen stream Ifing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The goddess of Night has three husbands and three children: Aud by Naglfari,
    Jörd by Annar, and Dag by Dellinger.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gods provide Dag with a chariot drawn by the white steed Skin-faxi, whose
    shining mane illuminates the world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sköll and Hati are wolves who pursue Sun and Moon with the aim of swallowing
    them and returning the world to primeval darkness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Eclipses are explained as moments when the wolves overtake the radiant orbs;
    human clamour frightens the wolves into releasing them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says the gods are finite because they descend from an alliance
    between the divine element Börr and the mortal Bestla, and are doomed to perish
    with the world they made.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mani is accompanied by Hiuki and Bil, described as waxing and waning moon-children
    snatched from earth, where a cruel father made them carry water all night.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The gods appoint Sun, Moon, Day, Night, named parts of the day, Summer, and
    Winter to mark the procession of the year and the seasons.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Summer descends from Svasud and is loved by all except Winter; Winter is the
    son of Vindsual, who is son of Vasud, the personification of icy wind.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hræ-svelgr, a giant clad in eagle plumes at the far northern verge of heaven,
    produces cold blasts when he raises his arms or wings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Maggot-like creatures breed in Ymir's flesh; the gods give them forms, intelligence,
    and divide them into two classes.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Dark, treacherous, cunning beings are sent underground to Svart-alfa-heim,
    are forbidden daylight on penalty of turning to stone, and collect hidden gold,
    silver, and precious stones.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Fair, good, useful beings are called Fairies and Elves and sent to Alf-heim,
    between heaven and earth, from which they can attend plants, flowers, birds, butterflies,
    and moonlit dances.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: Odin leads the gods to Idawold, a broad plain far above the earth and beyond
