candidate_motifs:
- id: motif:1
  label: Birth of personified Day from Night and Dawn
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  basis: Dag, identified with Day, is born to the goddess of Night and Dellinger,
    the god of dawn.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage is a later English retelling and gives only a compact genealogy.
- id: motif:2
  label: Celestial ascent and course of Day
  taxonomy_refs:
  - ascent
  basis: Day drives a shining courser from the east up the ascent of heaven, bringing
    light to the world.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage presents the motion poetically through quoted verse and prose
    paraphrase.
- id: motif:3
  label: Celestial bodies pursued and swallowed by monsters
  taxonomy_refs:
  - chaos
  basis: Sköll and Hati pursue Sun and Moon to swallow them and return the world to
    primeval darkness; eclipses occur when they temporarily overtake them.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage links the final success of the wolves to the end of the world
    but does not describe the full Ragnarök episode here.
- id: motif:4
  label: Noisy rescue of eclipsed light
  taxonomy_refs: []
  basis: People raise a deafening clamour during eclipses, frightening the wolves
    into dropping Sun or Moon so the celestial course resumes.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No ritual details beyond clamour are supplied.
- id: motif:5
  label: Finite gods from divine and mortal ancestry
  taxonomy_refs:
  - duality
  - divine_parent_child
  basis: The gods are said to spring from an alliance between the divine element Börr
    and mortal Bestla and therefore to be finite and doomed to perish with the world.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: This is presented as an explanatory belief in the retelling; the passage
    does not expand the genealogy.
- id: motif:6
  label: Moon-children carrying water
  taxonomy_refs: []
  basis: Hiuki and Bil are children taken by Mani from earth, formerly forced to carry
    water, and imagined as visible on the moon with their pail.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage includes the author's comparison to Jack and Jill but provides
    no independent textual evidence for the comparison.
- id: motif:7
  label: Personified seasonal cycle and opposition
  taxonomy_refs:
  - seasonal_cycle
  - duality
  basis: Summer and Winter are appointed as rulers of seasons and described as enemies
    with contrasting lineage and character.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The seasonal conflict is summarized briefly and not narrated as a full
    mythic episode.
- id: motif:8
  label: Cold winds from a giant bird-form at the edge of heaven
  taxonomy_refs: []
  basis: Hræ-svelgr, a giant in eagle plumes at the northern edge of heaven, creates
