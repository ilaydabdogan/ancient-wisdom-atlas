canonical_text:
  quote: ''
  summary: 'The passage recounts a buried magic sword found by Attila, his victories,
    his death at Ildico''s hands, the sword''s later reappearance and attribution
    to St. Michael, then describes Tyr''s relation to Valkyrs and Valhalla and begins
    the Fenris story: Loki and Angur-boda''s monstrous children are discovered, Hel
    and Iörmungandr are cast into other realms, and Fenris is fed by Tyr before breaking
    two attempted bonds.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed German soldier carried a sword whose presence assured victory,
    later buried it secretly under his hut by the Danube, and refused on his deathbed
    to disclose its location.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dying soldier said the sword would be found by the man destined to conquer
    the world, but that the finder would not escape the curse.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Attila found the buried sword after a cow was wounded by its exposed point,
    identified it as Cheru's sword, brandished it, and announced that he would conquer
    the world.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Ildico, a Burgundian princess whose father Attila had slain, took the sword
    on her wedding night while Attila was intoxicated and killed him in bed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sword later reappeared for the Duke of Alva, was associated with the victory
    of Mühlberg, and was afterward said to belong to the Archangel St. Michael.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tyr is described as brave and wise, commanding Odin's Valkyrs and designating
    warriors whom they should transfer to Valhalla.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tyr is described and represented as one-armed, with several explanations offered
