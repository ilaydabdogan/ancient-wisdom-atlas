  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Loki secretly married the giantess Angur-boda in Jötun-heim, and she bore
    Fenris, Hel, and Iörmungandr; the children grew too large to remain hidden in
    their cave.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Odin saw the growing monsters from Hlidskialf, feared they might later invade
