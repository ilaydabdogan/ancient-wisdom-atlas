canonical_text:
  quote: ''
  summary: The passage recounts Niörd and Skadi's attempt to divide their married
    life between Skadi's mountain home, Thrym-heim, and Niörd's sea home, Nôatûn.
    Niörd finds the mountain environment unbearable, and the pair eventually part
    and return to their separate homes. The narrator interprets them as personifications
    of winter and summer, gives later traditions about Skadi's marriages and royal
    offspring, describes Skadi's hunting and winter-travel associations, and summarizes
    Niörd's maritime worship and plant associations.
  language: English
  quote_policy: summarized
