canonical_text:
  quote: ''
  summary: Loki attempts to evade the gods by burning a half-made net and hiding in
    a stream as a salmon, but Kvasir infers the use of a net and Thor catches him.
    Loki is bound in a cavern with fetters made from his son's entrails, and Skadi
    sets a serpent above him to drip venom. Sigyn catches the venom in a cup except
    when she must empty it, and Loki's writhing is said to cause earthquakes. The
    passage also notes Loki's future release at Ragnarok and later associations with
    Saturn, Satan, and Saturday traditions.
  language: English
  quote_policy: summarized
