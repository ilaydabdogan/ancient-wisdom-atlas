canonical_text:
  quote: ''
  summary: The passage describes dwarfs or black elves as small subterranean beings
    formed by the gods from life in Ymir's flesh, wise and future-knowing but vulnerable
    to sunlight unless hidden or wearing the Tarnkappe. It recounts the Kallundborg
    legend, where Esbern bargains with a troll to build a church and avoids forfeiting
    his eyes and heart by learning the troll's name through Helva's prayers and a
    troll-wife's song. It also describes dwarf kings, subterranean wealth, magic items,
    and dwarven craftsmanship of famous jewels and weapons.
  language: English
  quote_policy: summarized
