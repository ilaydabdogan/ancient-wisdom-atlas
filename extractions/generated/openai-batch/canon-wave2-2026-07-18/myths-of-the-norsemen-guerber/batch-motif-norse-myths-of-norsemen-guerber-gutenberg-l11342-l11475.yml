canonical_text:
  quote: ''
  summary: Frithiof refuses to lie during Helgé's judgment and is sent on a perilous
    tribute-demanding voyage to the Orkneys. Before departure he asks Ingeborg to
    elope, but she refuses from duty to her brothers. Helgé then has witches raise
    a storm against Frithiof's ship Ellida. Frithiof distributes pieces of his armlet
    as tribute to Ran, commands Ellida against the whale-riding witches, and reaches
    Orkney, where Angantyr recognizes the ship and Atlé prepares to challenge him.
  language: English
  quote_policy: summarized
