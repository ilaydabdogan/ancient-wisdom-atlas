  summary: The passage recounts Odin's punishment of Brunhild, her enchanted sleep
    behind flame, Sigurd's betrothal oath to her, variant accounts involving their
    daughter Aslaug, Sigurd's arrival among the Niblungs, Grimhild's forgetfulness
    potion causing him to marry Gudrun, Gudrun's change after eating Fafnir's heart,
    and Sigurd's blood-brotherhood covenant with Gunnar and Högni.
