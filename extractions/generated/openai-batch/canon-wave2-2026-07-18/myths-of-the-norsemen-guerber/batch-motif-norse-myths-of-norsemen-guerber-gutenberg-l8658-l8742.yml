  quote: ''
  summary: 'The passage presents several giant and troll legends: a rejected giant’s
    arrow is blocked by another giant’s hat and all are petrified into landmarks;
    a church-bell-hating giant throws a rock, leading to a troll horn theft and curse;
    giants are said to create sandhills; and a colossal giant ship, the Mannigfual,
    explains the whiteness of Dover cliffs and the formation of Bornholm and Christiansoë.'
