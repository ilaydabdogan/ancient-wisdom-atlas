  quote: ''
  summary: The passage describes Ægir and Rán's nine daughters as personified waves,
    explains names and images associated with Ægir and the sea, and recounts the opening
    of the Thor-and-Tyr journey to the giant Hymir for a great brewing kettle, ending
    with Thor rowing toward the Midgard snake using an ox head as bait.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ægir and Rán have nine daughters called the Waves or billow-maidens.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Waves sport over the sea, shift between playful and violent moods, and
    usually come out when their brother the Wind is abroad.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Waves are said to go about in triplets and to help favoured Viking ships
    by smoothing obstacles and speeding them toward their goals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Ægir is identified by other names: Eagor among Anglo-Saxons, Hler among Northern
    nations, and Gymir because he conceals things in the sea.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Because the sea was said to seethe and hiss, the ocean was called Ægir's brewing
    kettle or vat.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ægir's servants Elde and Funfeng are described as emblems of sea phosphorescence
    and as attendants at banquets in the sea depths.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ægir visits the Æsir in Asgard, listens to Bragi's tales, and invites the
    Æsir to a harvest feast at Hlesey.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ægir says his food will be adequate but his brewing kettle is too small for
    drink, so Thor volunteers to procure a suitable kettle and travels with Tyr.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Thor and Tyr travel east of the Elivagar in Thor's goat chariot, leave it
    at Egil's house, and proceed to Hymir, who owns a very large kettle.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Hymir's dwelling, Tyr recognizes an old hag with nine hundred heads as
    his grandmother and a beautiful young giantess as his mother; the mother receives
    the visitors hospitably.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Tyr's mother tells the visitors to hide under huge kettles because Hymir is
    hasty and may kill guests with a baleful glance.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: When Hymir learns visitors have come, his look toward their hiding place splits
    the rafter, causing kettles to fall and all but the largest to break.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Hymir slays three oxen for the guests; Thor eats two of them, and Hymir says
    he must fish early for breakfast.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Thor joins Hymir's fishing trip, kills Hymir's largest ox Himinbrioter, cuts
