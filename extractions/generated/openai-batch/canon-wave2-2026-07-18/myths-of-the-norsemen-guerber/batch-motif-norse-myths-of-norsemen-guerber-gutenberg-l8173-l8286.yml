canonical_text:
  quote: ''
  summary: 'A peasant couple seeks help from Odin, Hoenir, and Loki to save their
    son from the giant Skrymsli. Odin and Hoenir hide the boy in transformed forms,
    but the giant finds him each time. Loki hides the boy as an egg in a fish, rescues
    him, and kills the giant through a trap and magical countermeasure. The passage
    then begins the story of the Giant Architect: the gods seek a fortress for Asgard,
    accept a bargain proposed by an unknown builder in exchange for the sun, moon,
    and Freya, and later threaten Loki when the builder, aided by the horse Svadilfare,
    nearly completes the work.'
  language: English
  quote_policy: summarized
