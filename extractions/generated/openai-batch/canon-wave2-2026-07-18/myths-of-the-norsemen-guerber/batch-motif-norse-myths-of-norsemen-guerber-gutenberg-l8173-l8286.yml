  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Loki snatches the egg from Skrymsli, transforms it back into the child, and
    tells the boy to run home through the boathouse and close the door behind him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Skrymsli runs into a spike placed by Loki in the boathouse; Loki cuts off
    one leg, then cuts off the other and throws flint and steel between the severed
    limb and trunk to prevent magical rejoining.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After Skrymsli is slain, the peasants consider Loki the mightiest of the heavenly
    council because he delivered them effectively where the other gods gave temporary
    aid.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The gods fear that frost giants might enter Asgard despite Bifröst and Heimdall's
    watchfulness, so they decide to build an impregnable fortress.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: An unknown architect offers to build the fortress if the gods give him the
    sun, moon, and Freya as his reward.
  category: speech
  evidence_refs:
  - ev:5
