- id: obs:1
  text: The parents pray to Odin for help, and Odin changes the boy into a grain of
    wheat hidden in an ear of grain in a field.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skrymsli goes to the field, mows the wheat, selects the ear containing the
    boy, and nearly takes the correct grain before Odin removes it and restores the
    boy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hoenir changes the boy into a fluff of down and hides him in the breast of
    a swan swimming in a nearby pond.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Skrymsli seizes the swan and is about to swallow the down, but Hoenir wafts
    it away and restores the boy to his parents.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Loki carries the boy out to sea and conceals him as a tiny egg in the roe
    of a flounder.
  category: action
