canonical_text:
  quote: ''
  summary: The passage introduces Frey as a Vanir god, child of Niörd and either Nerthus
    or Skadi, welcomed into Asgard as a hostage and given Alf-heim as a tooth-gift.
    It describes his residence among the Light Elves, his associations with sunshine,
    summer showers, magical objects, the golden boar Gullin-bursti, the steed Blodug-hofi,
    and the ship Skidbladnir. It then recounts Frey's ascent to Odin's throne Hlidskialf,
    his distant sight of Gerda in the frozen North, his love-sickness, and Skirnir's
    offer to woo Gerda for him in exchange for Frey's steed and sword.
  language: English
  quote_policy: summarized
