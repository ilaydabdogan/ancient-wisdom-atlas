- id: ev:4
  type: summary
  locator: lines 4516-4526; sword paragraph
  quote_or_summary: Frey receives a marvellous sword, emblem of sunbeams, which fights
    by itself once drawn; he wields it against frost giants and is sometimes confounded
    with Tyr or Saxnot because of it.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 4527-4537; Gullin-bursti paragraph
  quote_or_summary: Dwarfs from Svart-alfa-heim give Frey Gullin-bursti, the golden-bristled
    boar; the boar is described as a sun personification, with bristles linked to
    solar rays, golden grain, or agriculture, and as first teaching mankind to plough.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 4540-4545; boar and chariot paragraph
  quote_or_summary: Frey sometimes rides Gullin-bursti and sometimes harnesses the
    boar to a golden chariot containing fruits and flowers scattered over the earth.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 4546-4559; steed and ship paragraph
  quote_or_summary: Frey owns Blodug-hofi, a steed that crosses fire and water at
    his command, and Skidbladnir, a cloud-ship that sails over land and sea, has favourable
    winds, expands to carry gods and equipment, and folds like a napkin into a pocket.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 4568-4576; beginning of 'The Wooing of Gerda'
  quote_or_summary: Frey ascends Odin's throne Hlidskialf, sees over the earth toward
    the frozen North, and watches a beautiful maiden enter the house of the frost
    giant Gymir; her raised hand and beauty illuminate sea and sky.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 4577-4585; Gerda and Frey's love-sickness paragraph
  quote_or_summary: The maiden is named Gerda and identified as a personification
    of the flashing Northern lights; Frey returns to Alf-heim longing to make her
    his wife, becomes melancholy, and Niörd sends Skirnir to find the cause.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 4586-4592; Frey's confession to Skirnir
  quote_or_summary: Skirnir learns from Frey about the ascent of Hlidskialf and the
    fair vision; Frey confesses love and despair, fearing Gerda will not favor him
    because she is daughter of Gymir and Angur-boda and kin to Thiassi.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: quote
  locator: lines 4593-4602; quoted Skirner's Lay stanza
  quote_or_summary: '"In Gymer''s court I saw her move" and "Her snow-white arms and
    bosom fair / Shone lovely, kindling sea and air."'
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
  rights_note: Public domain source; short excerpt quoted.
- id: ev:12
  type: summary
  locator: lines 4604-4607; Skirnir's offer
  quote_or_summary: Skirnir says he sees no reason for despair and offers to woo Gerda
    in Frey's name if Frey lends him his steed and gives him the glittering sword
    as reward.
  source_text_path: texts/public-domain/norse/project-gutenberg/myths-of-the-norsemen-guerber.md
