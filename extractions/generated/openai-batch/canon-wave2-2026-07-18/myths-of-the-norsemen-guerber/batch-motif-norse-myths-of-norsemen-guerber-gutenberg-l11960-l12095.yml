  quote: ''
  summary: The passage introduces the decline of the Norse gods, links their end to
    their finite and mixed nature, describes Loki's corrupting influence, and presents
    the onset of Ragnarok through moral collapse, Fimbul-winter, wolves devouring
    the sun and moon, bound monsters breaking free, Nidhug attacking Yggdrasil, alarm
    birds and Heimdall sounding warnings, the gods riding to Vigrid, and Iörmungandr
    emerging from the sea.
  language: English
  quote_policy: summarized
