canonical_text:
  quote: ''
  summary: The passage describes Hel as Loki and Angurboda's daughter, born with Iörmungandr
    and Fenris, and recounts Odin's banishment of the three beings. It maps Hel's
    underworld realm in Nifl-heim through roads, a river boundary, bridge, toll-taking
    guardian, Ironwood, gate, watchdog, and Hel's hall. It also describes categories
    of the dead sent to Hel and human fear of bloodless death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hel is described as the daughter of Loki and the giantess Angurboda, born
    in a dark cave in Jötun-heim together with Iörmungandr and Fenris.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The three offspring are described as emblems of pain, sin, and death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Odin resolves to remove Loki''s brood: the serpent is cast into the sea,
    Fenris is chained, and Hel is hurled into Nifl-heim and given power over nine
    worlds.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hel's realm is placed under the earth and reached by a painful journey through
    cold, dark northern regions; Hermod on Sleipnir is said to have traveled nine
    nights before reaching the river Giöll.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Giöll forms the boundary of Nifl-heim and is crossed by a crystal or glass
    bridge guarded by Mödgud, who takes a toll of blood from each spirit.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Spirits cross using horses or wagons burned with the dead, and the dead are
    equipped with Hel-shoes for the rough journey.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the bridge, the spirit passes through Ironwood to Hel-gate, where Garm
    watches from the Gnipa cave and can be appeased by a Hel-cake.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Inside the gate are intense cold, darkness, the cauldron Hvergelmir, glaciers,
    and streams including Leipter and Slid, with naked swords rolling in Slid's waters.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hel's hall Elvidner is described through personified furnishings and implements,
    including Hunger as dish, Greed as knife, Sloth as maid, Sorrow as bed, and Conflagration
    as curtains.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Hel receives perjurers, criminals, those who die without shedding blood, and
    those who die of old age or disease.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says the innocent are treated kindly by Hel, but the inhabitants
    of the North still fear her realm and may choose spear-wounding, falling, burning,
    or sword-death to avoid bloodless death and join loved ones or the gods.
  category: action
  evidence_refs:
  - ev:8
