canonical_text:
  quote: ''
  summary: Odin compels a reluctant Vala to prophesy Balder's death, its avenger,
    and the limits of her further speech. Odin returns to Asgard reassured by Frigga's
    report that all things have sworn not to harm Balder. The gods test Balder's invulnerability
    in play. Loki, disguised as an old woman, learns from Frigga that mistletoe alone
    was excluded from the oath, then finds and magically alters it.
  language: English
  quote_policy: summarized
