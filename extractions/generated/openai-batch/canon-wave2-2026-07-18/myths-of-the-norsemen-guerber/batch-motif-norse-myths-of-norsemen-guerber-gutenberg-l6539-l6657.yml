canonical_text:
  quote: ''
  summary: 'The passage recounts Völund after the loss of his Valkyr wife Alvit: his
    brothers search for their wives, while he remains, cherishes her ring, and forges
    duplicates. King Nidud captures and maims him, takes his magic sword and Rhine-gold
    ring, and compels him to work as a smith and build a labyrinth. Völund prepares
    wings, deceives Nidud with a substitute sword, kills Nidud''s sons, makes objects
    from their remains, drugs Bodvild, escapes by flight with his sword and ring,
    and later reunites with Alvit in Alf-heim. The passage also notes Völund''s later
    legendary weapons and introduces broader tales of swan maidens or Valkyrs, especially
    Brunhild.'
  language: English
  quote_policy: summarized
