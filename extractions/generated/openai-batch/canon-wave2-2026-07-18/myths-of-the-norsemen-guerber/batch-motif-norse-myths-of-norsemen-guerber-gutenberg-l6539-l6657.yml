candidate_motifs:
- id: motif:1
  label: Valkyr or swan maiden as mortal beloved
  taxonomy_refs:
  - divine_beloved
  basis: Alvit is Völund's absent Valkyr wife, and the passage explicitly frames the
    material within broader tales of swan maidens or Valkyrs who consorted with mortals,
    naming Brunhild as a leading example.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:8
  - ev:10
  - ev:12
  confidence: high
  cautions: The passage uses a later retelling and summarizes multiple traditions;
    it does not provide a single uniform mythic version.
- id: motif:2
  label: Captive master smith forced to craft for a king
  taxonomy_refs: []
  basis: Nidud captures and maims Völund, confines him to an island, and forces him
    to forge weapons and ornaments and build a labyrinth.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No available taxonomy reference exactly matches this craft-captivity pattern.
- id: motif:3
  label: Theft of magical sword and love ring leading to revenge
  taxonomy_refs:
  - sacred_theft
  basis: Nidud takes Völund's magic sword and Rhine-gold love ring; Völund later substitutes
    a false sword, recovers the sword and ring, and completes his revenge.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
  confidence: medium
  cautions: The objects are magical or love-token objects, but the passage does not
    call them sacred; the taxonomy link is therefore approximate.
- id: motif:4
  label: Winged escape from captivity
  taxonomy_refs:
  - ascent
  - departure
  basis: Völund prepares wings modeled on Valkyr wings, rises into the air, avoids
    the king's archer, and flies away.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: high
  cautions: The passage describes artificial wings and flight, not a bodily transformation.
- id: motif:5
  label: Revenge through transformation of victims' remains into gifts
  taxonomy_refs: []
  basis: Völund kills Nidud's sons and makes vessels and ornaments from their skulls,
    eyes, and teeth, sending these objects to their unsuspecting family.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: No available taxonomy reference directly matches this motif.
- id: motif:6
  label: Labyrinth built under compulsion
  taxonomy_refs: []
  basis: Nidud compels Völund to build an intricate labyrinth, and the passage connects
    a maze in Iceland with "Völund's house."
  evidence_refs:
