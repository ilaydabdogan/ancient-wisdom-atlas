- id: motif:7
  label: Legendary smith as maker of heroic weapons
  taxonomy_refs:
  - culture_hero
  basis: The passage credits Völund with magic weapons, impenetrable armour, and celebrated
    swords associated with heroic traditions.
  evidence_refs:
  - ev:1
  - ev:9
  confidence: medium
  cautions: The text presents Völund as a craftsman of heroic objects, but does not
    explicitly label him a culture hero.
- id: motif:8
  label: Reunion with lost supernatural wife in Alf-heim
  taxonomy_refs:
  - return
  - divine_beloved
  basis: After his escape, Völund goes to Alf-heim, finds his beloved wife, and lives
