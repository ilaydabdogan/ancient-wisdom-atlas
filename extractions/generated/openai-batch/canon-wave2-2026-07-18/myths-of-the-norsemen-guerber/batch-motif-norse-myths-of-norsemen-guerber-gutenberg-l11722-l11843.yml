canonical_text:
  quote: ''
  summary: 'Frithiof rescues Sigurd Ring and Ingeborg from a fissure in the ice, later
    resists a bird’s urging to kill the sleeping king, and is revealed to have been
    tested by Ring. Ring approaches death, cuts death runes, blesses Ingeborg, Frithiof,
    and his son, and dies. At the Thing, Frithiof refuses kingship, raises Ring’s
    son on a shield, and swears to uphold him. The passage then summarizes variant
    endings: in some accounts Frithiof conquers Ingeborg’s brothers and later rules
    elsewhere; in Tegnér’s version he refuses immediate union with Ingeborg and sails
    away to seek Balder’s forgiveness.'
  language: English
  quote_policy: summarized
