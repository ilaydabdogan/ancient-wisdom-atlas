canonical_text:
  quote: ''
  summary: The passage introduces Tegnér's Frithiof Saga and gives background from
    the Thorsten saga. Haloge, identified parenthetically with Loki, comes north with
    Odin, rules northern Norway, and has two daughters who are carried off by suitors
    and settle on islands under Haloge's curses and spells. Haloge's grandson Viking
    is born on Bornholm and grows into an exceptionally large and strong youth. A
    Swedish princess, Hunvor, oppressed by a giant suitor, summons Viking. Viking
    receives the magic sword Angurvadel from his father, defeats the giant in a holmgang,
    postpones marriage because of age custom, and goes voyaging in a dragon ship.
    He is persecuted by the giant's magical kin but, with his friend Halfdan, escapes
    dangers, slays enemies, rescues Hunvor after she is carried off to India, and
    settles in Sweden. The passage then describes winter feasting, scaldic songs of
    raids and battle, a fight that leads to friendship with Njorfe, Viking's family
    and Njorfe's family, blood brotherhood between their fathers, jealousy among their
    sons, and a rough ball game that injures several players.
  language: English
  quote_policy: summarized
