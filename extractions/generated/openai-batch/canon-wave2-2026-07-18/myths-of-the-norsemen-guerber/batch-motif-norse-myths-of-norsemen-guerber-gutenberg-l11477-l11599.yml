canonical_text:
  quote: ''
  summary: Frithiof duels and wrestles Atlé, spares him, is received by Angantyr,
    obtains a gift in place of tribute, returns to find his home burned, learns of
    Ingeborg's marriage, confronts Helgé in Balder's temple, removes an arm-ring from
    Balder's image, accidentally sets the temple ablaze, and departs into exile by
    ship.
  language: English
  quote_policy: summarized
