canonical_text:
  quote: ''
  summary: Frithiof and Ingeborg grow up together under Hilding’s care and fall in
    love, though Hilding warns that Frithiof’s lower rank makes him an unsuitable
    match for the king’s daughter. King Belé, nearing death, presents Helgé and Halfdan
    as successors at a Thing near Balder’s shrine and asks that his burial mound face
    Thorsten’s so their spirits may commune across the firth. After Belé and Thorsten
    die, Helgé and Halfdan rule, while Frithiof lives at Framnäs with inherited treasures.
    Frithiof later declares his love to Ingeborg, sails to the royal brothers, and
    asks for her hand, offering loyalty and service; Helgé rejects him as a peasant’s
    son.
  language: English
  quote_policy: summarized
