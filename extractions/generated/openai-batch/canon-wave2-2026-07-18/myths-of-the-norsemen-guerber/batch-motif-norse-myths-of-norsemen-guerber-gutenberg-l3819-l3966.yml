canonical_text:
  quote: ''
  summary: Odin enters a mountain through a hole bored by Baugi, using snake form
    to evade treachery. Inside a stalactite-hung cave he woos Gunlod, gains access
    to the vessels of mead, drains them, and escapes in eagle form toward Asgard while
    Suttung pursues him. The Æsir burn Suttung, and Odin disgorges the draught of
    inspiration for the gods, with stray drops reaching earthly poets. The passage
    then describes Bragi, son of Odin and Gunlod, his magical golden harp, his life-giving
    song, his meeting and marriage with Idun, and Odin’s consecration of him as heavenly
    minstrel.
  language: English
  quote_policy: summarized
