canonical_text:
  quote: ''
  summary: The passage describes Loki as a Norse figure associated with hearth fire,
    life, mischief, deception, and later evil. It presents conflicting accounts of
    his kinship with Odin and his parentage, describes his association with Thor,
    lists several thefts or betrayals involving divine figures, names his wives and
    children, and reports folk sayings connecting Loki with hearth-fire, summer heat,
    and the sun drawing water. It ends by introducing an episode in which a giant
    wins a peasant’s only son in a game and will claim him unless he can be hidden.
  language: English
  quote_policy: summarized
