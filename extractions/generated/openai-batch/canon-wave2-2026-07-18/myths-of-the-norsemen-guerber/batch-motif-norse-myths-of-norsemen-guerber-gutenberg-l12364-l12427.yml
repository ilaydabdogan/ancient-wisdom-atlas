canonical_text:
  quote: ''
  summary: After the destruction associated with Ragnarok, a small band of gods finds
    Gimli still standing as a radiant refuge for the virtuous. The passage then describes
    an unnamed, more mighty God who rules over Gimli, judges mankind, and separates
    good from bad. It also describes separate heavenly dwellings for dwarfs and giants,
    and includes authorial commentary that some mythologists see Christian influence
    in these eschatological motifs.
