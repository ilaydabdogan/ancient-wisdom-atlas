canonical_text:
  quote: ''
  summary: The supplied passage first quotes Rigsmál on the sons of Jarl and Kon's
    knowledge of runes, then describes Hermod as Odin's swift son, divine messenger,
    battle-associated attendant, and escort of warriors to Valhalla. Odin sends Hermod
    north on Sleipnir to compel the Finnish magician Rossthiof to reveal the future.
    Hermod overcomes magical obstacles, binds Rossthiof, witnesses ominous signs including
    a stream of blood and a rapidly growing armed boy, and learns a prophecy that
    one of Odin's sons will be murdered and later avenged by a son born to Rinda.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sons of Jarl are described as growing up and performing martial actions
    such as breaking horses, bending shields, smoothing shafts, and shaking ash spears.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kon the young is said to know runes, including everlasting runes and life
    runes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hermod is introduced as one of Odin's sons, Odin's special attendant, bright
    and beautiful, and notably rapid in motion.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Because of his speed, Hermod is employed by the gods as a messenger and is
    ready to go to any part of creation at Odin's sign.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Odin gives Hermod a helm and corselet and sometimes entrusts him with Gungnir
    to cast over combatants before battle.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hermod is associated with battle, sometimes accompanies the Valkyrs to earth,
    and escorts warriors to Valhalla.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hermod's distinctive attribute is a wand or staff called Gambantein, described
    as the emblem of his office.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Odin, troubled by fears for the future and dissatisfied with the Norns' answers,
    orders Hermod to don armour, saddle Sleipnir, and ride to the land of the Finns.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Finns are described as living in frozen polar regions and as being thought
    able to call cold storms and possess occult powers.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Rossthiof is described as a Finnish magician who lures travellers, robs and
    slays them, and has reluctant power to predict the future.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hermod rides north carrying Odin's runic staff and passes safely through phantom-like
    monsters, invisible snares, and pitfalls.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Hermod reaches Rossthiof's abode, masters the attacking giant, binds him,
    and refuses release until Rossthiof promises to reveal what is asked.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Rossthiof's incantations are accompanied by the sun hiding behind clouds,
    the earth trembling, and storm winds howling.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Hermod sees a distant stream of blood, a beautiful woman, and then a little
    boy who grows rapidly and brandishes a bow and arrows.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Rossthiof interprets the blood stream as portending the murder of one of Odin's
