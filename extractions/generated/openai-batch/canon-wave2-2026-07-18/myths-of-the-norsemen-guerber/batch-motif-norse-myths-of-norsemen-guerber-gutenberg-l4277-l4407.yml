canonical_text:
  quote: ''
  summary: The passage describes Niörd as a Vanic hostage among the Æsir, ruler of
    winds and the near-shore sea, protector of commerce, fishing, summer warmth, and
    harvests. It recounts his seashore dwelling at Nôatûn, his association with Nerthus,
    and the arrival of Skadi seeking compensation for her father Thiassi’s death.
    Loki’s comic goat-prank softens Skadi’s anger; the gods show her Thiassi’s eyes
    set as stars and allow her to choose a husband by looking only at the gods’ feet.
    She chooses Niörd, thinking he is Balder, and later finds Nôatûn’s sea sounds
    intolerable.
  language: English
  quote_policy: summarized
