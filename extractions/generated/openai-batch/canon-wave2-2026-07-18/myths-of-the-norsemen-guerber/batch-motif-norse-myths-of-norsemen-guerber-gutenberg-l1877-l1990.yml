candidate_motifs:
- id: motif:1
  label: Divine marriage honored by ritual feast
  taxonomy_refs:
  - sacred_marriage
  basis: The passage makes Frigga's wedding to Odin a cause of divine rejoicing and
    the origin of later anniversary and wedding-feast honors.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is a later retelling and gives no ritual details beyond feast,
    song, and healths.
- id: motif:2
  label: Motherly and conjugal goddess
  taxonomy_refs:
  - mother_goddess
  basis: Frigga is queen of the gods, called motherly and conjugal in function, and
    worshipped by married lovers and tender parents.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: medium
  cautions: The passage emphasizes marriage and household patronage more than biological
    motherhood.
- id: motif:3
  label: Concealed foreknowledge
  taxonomy_refs:
  - wisdom
  basis: Frigga is said to know the future but to keep that knowledge unrevealed.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage does not present an explicit quest for this knowledge.
- id: motif:4
  label: Afterlife dwelling for virtuous spouses
  taxonomy_refs: []
  basis: Frigga invites virtuous husbands and wives to Fensalir after death so they
    can remain together.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage names an afterlife destination but does not describe a journey
    map or judgment procedure.
- id: motif:5
  label: Sacred theft of divine gold
  taxonomy_refs:
  - sacred_theft
  basis: Frigga secretly takes gold from Odin's temple statue and uses it to obtain
    a marvellous necklace.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The thief is herself divine, and the passage frames the act as adornment
    rather than culture-bringing theft.
- id: motif:6
  label: Magical service exchanged for a favor
  taxonomy_refs:
  - sacred_exchange
  basis: The dwarf agrees to prevent the statue from speaking if Frigga smiles graciously
    upon him, then performs the deed.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The exchange is brief and the value of the smile is not elaborated.
- id: motif:7
  label: Divine withdrawal followed by winter and restoration
  taxonomy_refs:
  - seasonal_cycle
  basis: Odin's departure removes blessings, permits frost-giant devastation, and
    after seven months his return releases and blesses the earth.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The seasonal reading is supported by the cold, vegetation loss, and timed
    return, but the passage presents it within a specific divine anger narrative.
- id: motif:8
  label: Divine impersonation and usurpation
  taxonomy_refs:
  - shapeshifter
  basis: Odin's brothers assume his form during his absence and take his throne and
    wife.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage states they assume his form but gives few details of transformation
    or deception.
