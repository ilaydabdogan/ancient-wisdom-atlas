- id: obs:2
  text: After the wedding, its anniversary is celebrated with feast and song, and
    Frigga is declared patroness of marriage; her health is proposed with that of
    Odin and Thor at wedding feasts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Frigga is described as goddess of the atmosphere or clouds and is represented
    in snow-white or dark garments according to her moods.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Frigga sits beside Odin on Hlidskialf, can look over the world, and knows
    the future but does not reveal it.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Frigga is represented as tall, beautiful, stately, crowned with heron plumes,
    wearing white robes and a golden girdle with keys.
