canonical_text:
  quote: ''
  summary: The passage describes Frigga as queen of the gods, wife of Odin, patroness
    of marriage, household life, conjugal and motherly love, possessor of hidden future
    knowledge, and mistress of Fensalir. It recounts her theft of gold from Odin's
    statue to make a necklace, Fulla's aid through a dwarf who destroys the statue,
    Odin's angry withdrawal with his blessings, the ensuing usurpation and frost-giant
    devastation, and Odin's return after seven months to restore the earth.
  language: English
  quote_policy: summarized
