canonical_text:
  quote: ''
  summary: The passage recounts Skuld's decree that Nornagesta's life will last only
    as long as a taper, the preservation and later lighting of that taper, and Nornagesta's
    death when it goes out. It then describes Norns as Vala or prophetesses, their
    later appearance as fairies or witches, Dises in battle and ritual contexts, the
    Fylgie guardian spirit, allegorical readings of the Norns' web, and Skuld's possible
    association with Valkyries and Hel.
  language: English
  quote_policy: summarized
