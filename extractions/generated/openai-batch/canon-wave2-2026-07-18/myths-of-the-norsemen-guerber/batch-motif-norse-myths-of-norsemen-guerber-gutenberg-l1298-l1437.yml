canonical_text:
  quote: ''
  summary: The passage describes a Northern belief that the soul can leave the body
    in mouse form, then links Odin as leader of disembodied spirits with the Pied
    Piper of Hamelin. It recounts the Piper luring rats to drown and later leading
    Hamelin’s children into the Koppelberg, interpreted by the source as a hollow
    mountain or grave. It then recounts the Bishop Hatto legend, in which murdered
    peasants’ souls take rat form and devour the bishop as judgment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Northern peoples generally believed the soul could
    escape from a body in the shape of a mouse, emerging from the mouth of a corpse
    or moving through the mouths of people in a trance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that while the soul was absent no remedy could revive the
    patient, but animation returned when the soul came back.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Odin is described as leader of all disembodied spirits and as identified in
    the Middle Ages with the Pied Piper of Hamelin.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hamelin is described as overrun with rats; a reward is offered, and a piper
    in parti-coloured garments agrees to remove them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The piper plays through the streets, the rats are compelled to follow in a
    procession, and they drown in the river Weser.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: After the people of Hamelin refuse to pay the reward, the piper plays again
    and the children come out of the houses and follow him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The piper leads the children to the Koppelberg, which opens to receive the
    procession and closes after the last child passes out of sight; the children are
    not seen in Hamelin again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The source explicitly interprets Odin as the piper, the flute tones as the
    whistling wind, the rats as souls of the dead, and the hollow mountain as the
    grave.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: Bishop Hatto is described as a miserly prelate who, during famine, burns the
    poor alive in a deserted barn after likening them to rats rather than giving them
    stored grain.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: After the killing, a swarm of rats identified as the souls of the murdered
    peasants pursues Hatto to a stone tower in the Rhine, gnaws through its walls,
    and devours him alive.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
