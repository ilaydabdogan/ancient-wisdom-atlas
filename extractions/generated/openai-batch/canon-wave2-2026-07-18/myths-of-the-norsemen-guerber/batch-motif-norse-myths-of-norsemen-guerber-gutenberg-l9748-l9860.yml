canonical_text:
  quote: ''
  summary: A one-eyed grey-and-blue stranger intervenes in battle and Sigmund’s Odin-given
    sword breaks, leading to Sigmund’s death. Sigmund instructs Hiordis to preserve
    the sword fragments for their unborn son, foretold to surpass and avenge him.
    Hiordis and her maid exchange garments before meeting the Viking Elf, who later
    discerns Hiordis’s identity by questioning their morning habits. Elf marries Hiordis
    and raises her son Sigurd, who is named after a water-sprinkling ceremony. Sigurd
    is educated by the ancient wise smith Regin and later, when choosing a horse,
    meets a one-eyed stranger who directs him to test the horses in a river.
  language: English
  quote_policy: summarized
