canonical_text:
  quote: ''
  summary: The passage recounts war between gods and frost-giants, the marriage of
    Börr and Bestla, the birth of Odin, Vili, and Ve, the slaying of Ymir, and a deluge
    from Ymir's blood that leaves Bergelmir and his wife as survivors. It then describes
    the gods forming Midgard, ocean, hills, cliffs, trees, heavens, and clouds from
    Ymir's body; setting four dwarfs to support the sky; making stars, sun, and moon
    from sparks; appointing Mani and Sol to guide celestial chariots; and entrusting
    Night to Nott and Hrim-faxi.
  language: English
  quote_policy: summarized
