canonical_text:
  quote: ''
  summary: Gudrun and Brunhild quarrel while going to bathe in the Rhine, and Gudrun
    displays Andvaranaut as proof against Brunhild. Brunhild's grief and anger lead
    her to press for Sigurd's death. Guttorm, urged by Högni and aided by Grimhild's
    potion, murders Sigurd while he sleeps; Sigurd kills Guttorm while dying. Sigurd's
    son is also slain. Gudrun mourns silently until Sigurd's head is placed in her
    lap. Sigurd is laid on a funeral pyre with arms, armor, the Helmet of Dread, his
    steed, and servants. Brunhild kills herself and is burned with Sigurd, with an
    unsheathed sword placed between them. The passage then notes Wagner's variant,
    where Brunhild rides into the funeral flames.
  language: English
  quote_policy: summarized
