canonical_text:
  quote: ''
  summary: The passage describes dwarf-made magical swords; the departure of dwarfs
    from the Northlands after unbelief; changeling superstitions involving dwarf child
    substitution and recovery methods; troll women who become Maras or nightmares;
    a place legend in which trolls become mountain rocks at sunrise; and a conjecture
    identifying dwarfs with Phoenician miners.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The dwarfs manufactured the sword Tyrfing, gave it to Angantyr, and the sword
    could cut iron and stone, fight of its own accord, and required blood before it
    could be sheathed after being drawn.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Angantyr had Tyrfing buried with him; his daughter Hervor visited his tomb
    at midnight, recited magic spells, and forced him to rise from the grave and give
    her the blade.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sword Angurvadel was said to be forged by dwarfs in Eastern lands, inherited
    by Frithiof, fitted with a hammered-gold hilt, and marked with runes that were
    dull until battle, when they flamed red.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dwarfs are described as generally kind and helpful, performing household and
    agricultural work, but leaving a house permanently if ill-treated or mocked.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: When worship of the old gods ceased in the Northlands, the dwarfs withdrew;
    a ferryman carried invisible, heavy passengers across a river at night and was
    told they were the departing dwarfs.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Popular superstition says dwarfs tried to improve their race by winning human
    wives or by stealing unbaptized children and substituting their own offspring
    for a human mother to nurse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Dwarf babies substituted for human babies were called changelings and were
    recognizable by puny, wizened forms.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A woman could recover her own child and be rid of the changeling either by
    brewing beer in egg-shells or by greasing the child's feet and holding them near
    flames until the dwarf parents came to exchange the children.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Troll women were said to be able to change into Maras or nightmares and torment
    chosen victims.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: If a victim stopped the hole by which a Mara entered his room, she was at
