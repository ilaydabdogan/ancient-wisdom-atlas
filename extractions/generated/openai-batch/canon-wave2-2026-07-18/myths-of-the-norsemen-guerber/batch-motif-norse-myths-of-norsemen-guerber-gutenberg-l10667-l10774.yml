candidate_motifs:
- id: motif:1
  label: Hero crosses a fiery barrier to win a bride or prize
  taxonomy_refs:
  - fire
  basis: Gunnar says Sigurd rode the Wavering Fire and won the Queen of Glory for
    him.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage reports the deed briefly and does not narrate the full crossing
    episode.
- id: motif:2
  label: Treasure secret withheld under threat and torture
  taxonomy_refs: []
  basis: Gunnar demands Högni’s heart before speaking of the gold, then refuses to
    reveal the secret once Högni is dead.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No external motif index is assigned from the available taxonomy.
- id: motif:3
  label: Captive hero in serpent pit calms snakes with music
  taxonomy_refs:
  - serpent
  basis: Gunnar is thrown into a den of venomous snakes and plays a harp with his
    toes, lulling all but one reptile.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives this as a death scene rather than an escape.
- id: motif:4
  label: Transformed relative as fatal serpent
  taxonomy_refs:
  - serpent
  - shapeshifter
  basis: The snake that kills Gunnar is said to be Atli’s mother in snake form.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage phrases the identification as something that 'was said,' so
    the transformation is reported rather than directly narrated.
- id: motif:5
  label: Revenge through a cannibalistic kin-feast
  taxonomy_refs: []
  basis: Gudrun kills her sons and serves Atli their roasted hearts and blood at a
    banquet.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The available taxonomy list has no specific cannibal feast or revenge-feast
    category.
- id: motif:6
  label: Destructive revenge by palace fire
  taxonomy_refs:
  - fire
  basis: One version says Gudrun sets fire to the palace, reveals her deed, stabs
    Atli, and dies in the flames.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: This is one of several versions; it is local destruction, not a world-destroying
    fire.
- id: motif:7
