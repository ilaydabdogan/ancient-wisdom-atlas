canonical_text:
  quote: ''
  summary: Gunnar recounts Sigurd’s winning of treasure, crossing of the Wavering
    Fire, sworn brotherhood, and murder. Atli demands Högni’s heart to force Gunnar
    to reveal the treasure, but Gunnar refuses once Högni is dead. Gunnar is cast
    into a snake den, plays a harp with his toes, and is killed by one snake said
    to be Atli’s mother in snake form. Gudrun takes revenge on Atli by killing their
    sons and serving their hearts and blood at a feast; alternate versions describe
    her burning the palace and dying, killing Atli and drowning herself, or being
    borne by waves to Jonakur. Swanhild is falsely accused and trampled by horses;
    Gudrun sends her sons to avenge her. Sörli and Hamdir kill Erp, maim Ermenrich,
    and are killed by stones at the instruction of a one-eyed stranger.
  language: English
  quote_policy: summarized
