canonical_text:
  quote: ''
  summary: The passage presents Freya as a Norse goddess of beauty and love, sister
    of Frey and daughter of Niörd and Nerthus or Skadi. She receives Folkvang and
    Sessrymnir in Asgard, chooses half the battle-slain, leads Valkyrs, and hosts
    the chosen slain along with pure maidens and faithful wives. It also recounts
    her marriage to Odur, his departure, her golden and amber tears, her search for
    him under many names, their reunion under myrtle-trees, and the renewal of nature
    as they return home.
  language: English
  quote_policy: summarized
