canonical_text:
  quote: ''
  summary: Loki, threatened by the gods, borrows Freya's falcon plumage, retrieves
    Idun from Thrym-heim, and flees with her while Thiassi pursues in eagle form.
    The gods burn prepared fuel, bring Thiassi down, kill him, recover Idun's youth-giving
    apples, and place Thiassi's eyes in the heavens. The narrator interprets the myth
    seasonally. A second fragmentary Idun myth describes her fall from Yggdrasil into
    Nifl-heim, where Odin sends Bragi, Heimdall, and another god with a wolfskin;
    Idun remains silent and tearful, and Bragi stays beside her with his harp mute.
  language: English
  quote_policy: summarized
