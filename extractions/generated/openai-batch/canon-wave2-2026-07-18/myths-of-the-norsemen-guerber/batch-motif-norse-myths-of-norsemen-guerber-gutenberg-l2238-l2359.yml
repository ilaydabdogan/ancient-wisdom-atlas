canonical_text:
  quote: ''
  summary: A shepherd enters Holda's jeweled cave, chooses blue flowers rather than
    precious stones, and receives both the flowers and seed. The seed becomes flax,
    and Holda teaches the peasant household to harvest and make linen, bringing wealth
    and long life until the flowers droop and the peasant returns to the mountain
    cave. The passage then recounts the medieval Tannhäuser tradition in which Holda,
    as Frau Venus, lures mortals into the Hörselberg cave; Tannhäuser seeks absolution,
    is initially refused by the Pope, returns to the cave, and is pardoned when the
    Pope's withered staff blooms. The passage also notes Holda's Quickborn fountain,
    her chariot, and a wheelwright whose repair chips turn to gold, followed by a
    poetic image of Fricka riding with rams and a golden whip.
  language: English
  quote_policy: summarized
