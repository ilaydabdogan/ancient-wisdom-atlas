canonical_text:
  quote: ''
  summary: Sigmund and Signy bury their family's bones and plan vengeance against
    Siggeir. Signy sends her sons to Sigmund for testing, but they fail; she then
    exchanges forms with a witch, visits Sigmund in disguise, and later bears Sinfiotli,
    who passes severe courage and serpent-poison tests. Sigmund trains Sinfiotli.
    The pair don wolf-skins, become wolves, kill and devour, fight each other, and
    Sinfiotli dies. Sigmund observes a weasel revived by a magic leaf, receives a
    similar leaf from a raven, and restores Sinfiotli to life. On the ninth night
    the wolf-skins fall off and are burned, ending the spell.
  language: English
  quote_policy: summarized
