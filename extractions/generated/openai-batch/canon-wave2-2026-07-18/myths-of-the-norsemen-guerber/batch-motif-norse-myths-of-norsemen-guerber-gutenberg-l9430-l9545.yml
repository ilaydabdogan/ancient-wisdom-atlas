  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage presents restoration to life, but not a full afterlife journey
    or extended rebirth cycle.
- id: motif:9
  label: Burning the enchanted animal skin to end transformation
  taxonomy_refs:
