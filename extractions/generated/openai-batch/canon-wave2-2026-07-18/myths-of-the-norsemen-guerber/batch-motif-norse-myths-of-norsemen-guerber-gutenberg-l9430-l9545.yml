- id: motif:2
  label: Sibling pair coordinating revenge
  taxonomy_refs:
  - sibling_pair
  basis: Brother and sister Sigmund and Signy jointly bury the bones, agree on vengeance,
    and coordinate future aid.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The sibling relation is explicit, but the passage's main emphasis is revenge
    rather than the sibling pair as an independent symbolic pattern.
- id: motif:3
  label: Initiatory testing of children for courage
  taxonomy_refs:
  - initiation
  basis: Signy's sons are sent to Sigmund to prove worthy for revenge; Sinfiotli later
    passes pain and adder-in-meal tests.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage does not use the term initiation; the motif label describes
    the repeated testing pattern.
- id: motif:4
  label: Form exchange and disguised union to produce a suitable avenger
  taxonomy_refs:
  - shapeshifter
  basis: Signy exchanges forms with a witch, visits Sigmund unrecognized, and later
    gives birth to a son marked as a true Volsung hero.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage calls Signy's decision a crime; the extraction does not treat
    the union as ritually sanctioned.
- id: motif:5
  label: Serpent and poison ordeal
  taxonomy_refs:
  - serpent
  - initiation
  basis: Sinfiotli must bake meal containing a hidden adder, and the passage contrasts
    Sigmund's venom immunity with Sinfiotli's immunity to reptile stings.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The adder functions as a test object in this passage; broader serpent
    symbolism is not specified.
- id: motif:6
  label: Wolf-skin shapeshifting under spell
  taxonomy_refs:
  - shapeshifter
  basis: Two wolf-skins are linked to werewolves under a spell; Sigmund and Sinfiotli
    don the skins and become wolves.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage attributes the transformation to the skins and spell but does
    not explain the spell's origin.
- id: motif:7
  label: Fatal combat between transformed companions
  taxonomy_refs: []
  basis: After taking wolf form, Sigmund and Sinfiotli are overcome by wolfish passions
    and fight until Sinfiotli dies.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No available taxonomy reference precisely matches companion combat in
    animal form.
- id: motif:8
  label: Restoration of the dead by magic herb and bird-borne aid
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: A dead weasel is restored by a leaf; a raven drops a similar leaf, which
