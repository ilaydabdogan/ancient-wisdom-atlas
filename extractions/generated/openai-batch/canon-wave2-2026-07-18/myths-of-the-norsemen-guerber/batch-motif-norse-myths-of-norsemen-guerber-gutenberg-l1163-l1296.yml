canonical_text:
  quote: Odin was worshipped as the leader of all disembodied spirits.
  summary: The passage describes Odin/Woden as a wind-god and Wild Huntsman who rides
    through the air with an eight-footed steed, a mounted host, and baying hounds.
    The Wild Hunt is treated as a storm apparition, an omen of war, pestilence, death,
    and later historical disaster. It includes beliefs about punishment or reward
    for joining the halloo, a spectral black dog left behind, varying quarry, later
    substitute leaders, seasonal winter hunting, harvest offerings for Odin's horse,
    and regional names across Northern Europe.
  language: English
  quote_policy: quoted
