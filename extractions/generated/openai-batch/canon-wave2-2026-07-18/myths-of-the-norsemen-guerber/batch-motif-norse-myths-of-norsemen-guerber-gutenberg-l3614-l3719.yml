canonical_text:
  quote: ''
  summary: The passage recounts that the Æsir, unable to bind Fenris with ordinary
    fetters, send Skirnir to the dwarfs or dark elves for a magical bond called Gleipnir.
    Fenris agrees to be bound only if one of the Æsir places a hand in his mouth as
    a pledge; Tyr does so and loses his hand when the wolf realizes he is trapped.
    The gods further secure and silence Fenris, whose blood forms the river Von, and
    the wolf remains bound until the last day. The passage also reports later interpretations
    of the myth and notes commemorations of Tyr's name.
  language: English
  quote_policy: summarized
