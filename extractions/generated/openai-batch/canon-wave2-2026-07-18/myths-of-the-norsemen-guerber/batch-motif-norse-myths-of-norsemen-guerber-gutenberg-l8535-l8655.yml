canonical_text:
  quote: ''
  summary: The passage describes giants as primordial beings born in Ginnunga-gap,
    opponents of the gods, and ancestors of a surviving giant race through Bergelmir
    and his wife. It recounts their confinement in Jötun-heim, their knowledge of
    the past, Odin's wisdom contest with Vafthrudnir, Thor's war against frost and
    mountain giants, legends explaining mountains and streams through giant activity,
    an elemental genealogy from Fornjotnr, a Merovingian descent legend from a sea
    giant in ox form, and a later story of the rejected giant Senjemand.
  language: English
  quote_policy: summarized
