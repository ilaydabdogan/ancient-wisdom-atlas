canonical_text:
  quote: ''
  summary: 'The passage describes events leading into the final battle: Iörmungandr
    stirs the sea; Nagilfar and another hostile ship sail toward Vigrid; Hel and underworld
    beings emerge; Surtr rides through a fiery sky-breach and Bifröst collapses; the
    gods prepare despite known doom; Odin consults the Urdar fountain, the Norns,
    and Mimir; the opposing hosts assemble; paired combats begin; Fenris swallows
    Odin; and a quoted stanza says Vithar will avenge him.'
  language: English
  quote_policy: summarized
