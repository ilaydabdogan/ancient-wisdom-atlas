canonical_text:
  quote: ''
  summary: Hermod rides to Hel to seek Balder's release. Balder remains in Hel with
    Nanna, and Hel says he may return only if all animate and inanimate things weep
    for him. The gods send heralds through the world; nearly all things weep, but
    the giantess Thok refuses, preventing Balder's return. The passage then describes
    Vali's birth and vengeance on Hodur, and gives a seasonal/light-darkness explanation
    of the myth.
  language: English
  quote_policy: summarized
