canonical_text:
  quote: ''
  summary: The passage first notes animals held sacred to Freya and the later black-cat
    witch image. It then describes Uller as winter-god, hunter, archer, shield-god,
    death/Wild Hunt figure, seasonal ruler in Odin's absence, spouse in regional traditions,
    recipient of worship and oaths, sender of snow and aurora, and a figure linked
    with Balder, Hel, Nifl-heim, and the seasonal contest of light and darkness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The swallow, cuckoo, and cat are said to have been held sacred to Freya; cats
    are connected in the passage with later depictions of witches with coal-black
    cats.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Uller is identified as the winter-god, son of Sif and stepson of Thor; he
    loves cold, travels on broad snowshoes or glittering skates, hunts in northern
    forests, and wears thick furs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: As god of hunting and archery, Uller is represented with a quiver, arrows,
    and a huge bow; the yew is named as his favorite tree, and he dwells at Ydalir,
    the damp vale of yews.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Uller is considered second only to Odin as winter-god and is said to take
    Odin's place during Odin's winter absence, ruling Asgard and Midgard until Odin
    returns and drives him away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Uller is considered a god of death, rides in the Wild Hunt, and sometimes
    leads it; a report says he changed a piece of bone into a vessel by magic runes
    so it could carry him over land or sea.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Because snowshoes resemble shields and winter ice shields the earth, Uller
    is surnamed the shield-god and is invoked by people about to enter duels or desperate
    fights.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: In Christian times, St. Hubert is said to have taken Uller's place in popular
    worship as hunter and patron of the first month, associated with Sagittarius the
    bowman.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: In Anglo-Saxon and German contexts Uller is named Vulder or Holler; in some
    German areas Holler is considered husband of Holda, and he covers her fields with
    snow to make them fruitful in spring.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Scandinavians are said to have described Uller as married to Skadi, Niörd's
    divorced wife and the female personification of winter and cold; the pair live
    harmoniously because their tastes are congenial.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Temples are dedicated to Uller; a sacred oath ring lies on his altars and
    is said to sever the finger of a premeditated perjurer; worshippers visit his
    shrine in November and December to ask for snow as a sign of good harvest, and
    he is associated with the aurora borealis.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: Other authorities say Uller is Balder's special friend because he also spends
    part of the year in Nifl-heim with Hel; Uller endures yearly summer banishment
    there, while Balder joins him at Midsummer as light yields to darkness associated
    with Hodur.
  category: sequence
  evidence_refs:
  - ev:11
