canonical_text:
  quote: ''
  summary: 'During Ragnarök, several gods and monsters kill one another; Vidar avenges
    Odin by destroying Fenris. Surtr sets fire to heaven, earth, Hel, Yggdrasil, and
    the divine palaces, after which the earth sinks beneath boiling sea. The passage
    then describes regeneration: the earth rises again, a new sun shines, Lif and
    Lifthrasir survive and repopulate the renewed world, and surviving or returning
    gods gather on Ida, recover Thor''s hammer, and find the old golden disks.'
  language: English
  quote_policy: summarized
