canonical_text:
  quote: ''
  summary: The passage describes Frey's death and mound-burial, temple worship and
    oaths, sacrificial practices, his attributes as a deity, and several Yule customs
    associated with him, including the fire-wheel, boar's-head feast, oaths over the
    boar of atonement, and later bacon or ham rewards for marital harmony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People continued paying taxes to Frey by pouring gold, silver, and copper
    coins into a mound through three openings until they discovered after three years
    that he was dead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Because peace and prosperity remained undisturbed, Frey's corpse was not burned,
    and the passage says this inaugurated mound-burial in place of the funeral pyre
    in many places.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A mound near Gamla Upsala is said to bear Frey's name, and Frey's statues
    were placed in the great temple there.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Frey's name was included in solemn oaths together with Niörd and Odin.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Weapons were not admitted in Frey's temples.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Oxen or horses were sacrificed to Frey, and a heavy gold ring was dipped in
    the victim's blood before an oath was taken upon it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Frey's statues are described as roughly hewn wooden blocks, and the last sacred
    image is said to have been destroyed by Olaf the Saint.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Frey is described as god of sunshine, fruitfulness, peace, and prosperity,
    patron of horses and horsemen, and deliverer of captives.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Yule month, also called Thor's month, was sacred to Frey and Thor and began
    on the longest night of the year, called Mother Night.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Yule feast was described as a time of feasting and rejoicing because it
    heralded the return of the sun.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The festival name Yule is explained as meaning wheel, because the sun was
    supposed to resemble a wheel revolving across the sky.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: In England, Germany, and along the Moselle, people assembled on a mountain,
    set fire to a straw-twined wooden wheel, rolled it downhill, and let it plunge
    into water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Northern peoples celebrated Yule with dancing, feasting, and drinking, and
    each god was pledged by name.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage says early Christian missionaries encouraged drinking to the health
    of the Lord and the twelve apostles when converting Northern heathens.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Boar's flesh was eaten at Yule in honor of Frey, and the boar's head was crowned
    with laurel and rosemary and carried ceremonially into the hall.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The father of the family laid his hand on the dish called the boar of atonement
    and swore faithfulness to family and obligations; others present followed this
    example.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The boar's head could be carved only by a man described as having unblemished
    reputation and tried courage.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:18
  text: The boar's head is described as a sacred emblem that inspired fear and was
    used as a helmet ornament for Northern kings and heroes.
  category: object
  evidence_refs:
  - ev:9
- id: obs:19
  text: Because Frey's name Fro was treated as phonetically the same as a German word
    for gladness, the passage says he was considered patron of every joy and invoked
    by married couples seeking harmony.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:20
  text: Couples who lived harmoniously for a certain time were publicly rewarded with
    boar's flesh, later replaced in English and Viennese customs by a flitch of bacon
    or a ham.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
