canonical_text:
  quote: ''
  summary: The passage presents Vidar as the silent son of Odin and the giantess Grid,
    associated with forest, imperishable nature, survival after the gods' destruction,
    and rule over a renewed world. It describes his dwelling Landvidi, his large protective
    shoe, a prophecy by the Norns and Wyrd concerning Odin's fall and Vidar's vengeance,
    the reaction of the world tree and its creatures, and Vidar's final struggle with
    Fenris.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Odin loves and weds the giantess Grid, who dwells in a cave in the desert;
    their offspring is Vidar, described as strong and taciturn.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vidar is said to connect the gods with forests and nature, to survive their
    destruction, and to rule over a regenerated earth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vidar's dwelling is Landvidi, a palace decorated with green boughs and fresh
    flowers in an impenetrable primeval forest.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vidar is depicted as tall, handsome, armed, armoured, and wearing a great
    iron or leather shoe.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: One explanation says Grid designed Vidar's shoe as protection because he would
    fight against fire on the last day; this is compared to Grid's iron gauntlet shielding
    Thor against Geirrod.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Another explanation says Vidar's shoe was made from leather scraps donated
    or discarded by northern cobblers, and that shoemakers observed a religious practice
    of giving away leather odds and ends so the shoe would withstand Fenris's teeth.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: In Valhalla the gods welcome Vidar, and Odin leads him to the Urdar fountain,
    where the Norns are weaving their web.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Norns answer Odin's questions oracularly, and Wyrd explains that if Odin
    falls in the last battle, Vidar will avenge him and rule a regenerated world.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: As Wyrd speaks, the world tree's leaves flutter, the eagle on its top bough
    flaps its wings, and Nidhug pauses his destructive work at the tree's roots.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Grid rejoices with Odin when she hears that Vidar will survive the older gods
    and rule over the new heaven and earth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Vidar returns silently to Landvidi, sits on his throne, and ponders eternity,
    futurity, and infinity without revealing any secrets.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage explicitly describes Vidar as a symbol of resurrection and renewal,
    with new shoots and blossoms replacing what has decayed.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: Fenris is said to destroy Odin and then attack Vidar; Vidar uses the protected
    foot against Fenris's lower jaw, seizes the upper jaw, and rends the wolf apart.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Some mythologists are reported as supposing that Vidar had one leg and personified
    a waterspout that would quench the wildfire personified by Fenris.
  category: other
  evidence_refs:
  - ev:11
