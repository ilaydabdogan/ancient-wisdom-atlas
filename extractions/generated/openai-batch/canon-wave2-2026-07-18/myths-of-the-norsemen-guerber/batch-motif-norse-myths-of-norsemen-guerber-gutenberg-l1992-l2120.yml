candidate_motifs:
- id: motif:1
  label: Divine adjudication of battle by first sight
  taxonomy_refs:
  - divine_judgment
  basis: Odin states that victory will be given to the people he first sees in the
    morning, and the decision results in victory for the Winilers.
  evidence_refs:
