  - ev:5
  confidence: high
  cautions: The passage frames the outcome as divine favor in battle, not as a formal
    court or moral judgment.
- id: motif:2
  label: Clever spouse redirects divine intention
  taxonomy_refs:
  - wisdom
  basis: The passage opens by saying Odin, god of wit and wisdom, is sometimes no
    match for Frigga; she detects his plan, turns his couch, and secures her favored
    people's victory.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The wording is from a later retelling and includes gendered characterization;
    extraction records the episode's action rather than endorsing the framing.
