  summary: The passage recounts a feud between Viking's and Njorfe's families, Thorsten's
    survival and later adventures, Jokul's magical attacks and transformation of Ingeborg,
    the recovery of magical treasures including the dragon ship Ellida and Völund's
    ring, and the births and fosterage of Frithiof and Ingeborg.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A game between the sons of Njorfe and Viking ends in violence after one of
    Njorfe's sons strikes an opponent, and the injured man later kills his assailant.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Viking banishes the son who killed Njorfe's child because of his oath to avenge
    Njorfe's wrongs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Viking gives his sword Angurvadel to Thorsten and tells him to remain on an
    island in Lake Wener until danger has passed.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Njorfe's sons use a conjurer's art to cause a great frost so they can cross
    the lake ice and attack Thorsten and his brothers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the attack, Viking finds Thorsten and Thorer still alive and hides them
    in a cellar beneath his dwelling until they recover.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Njorfe's surviving sons use magic arts to discover that their opponents are
    alive and make another unsuccessful attempt to kill them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Jokul kills the king of Sogn, banishes the heir Belé, and changes the king's
    daughter Ingeborg into the appearance of an old witch.
  category: action
  evidence_refs:
  - ev:6
