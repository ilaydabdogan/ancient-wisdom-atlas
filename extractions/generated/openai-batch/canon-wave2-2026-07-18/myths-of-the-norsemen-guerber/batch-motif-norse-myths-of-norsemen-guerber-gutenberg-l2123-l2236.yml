canonical_text:
  quote: ''
  summary: The passage lists offices of Frigga's attendants; recounts Gefjon's receiving
    of the unwedded dead, her ploughing and removal of land to form Seeland and Lake
    Mälar, and her role as ancestress of the Skioldungs; describes Eira, Vara, Vör,
    and Snotra; compares Holda/Frau Holle with Frigga; and begins a Tyrolean story
    about Holda's gift of flax and a peasant who discovers a glacier doorway while
    hunting on a mountain.
  language: English
  quote_policy: summarized
