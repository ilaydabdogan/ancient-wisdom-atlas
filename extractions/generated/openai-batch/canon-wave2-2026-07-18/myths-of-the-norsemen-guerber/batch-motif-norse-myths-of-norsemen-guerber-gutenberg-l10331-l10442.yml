canonical_text:
  quote: ''
  summary: After Giuki's death, Gunnar becomes king and is urged by Grimhild to wed
    Brunhild, who sits in a golden hall surrounded by flames and will marry only the
    warrior who braves the fire. Gunnar cannot pass the fire, so Sigurd and Gunnar
    magically exchange appearances. Sigurd, in Gunnar's form, rides Greyfell through
    the flames, is accepted by Brunhild under her binding injunction, lies beside
    her with a sword between them for three nights, takes Andvaranaut from her hand,
    and receives her promise to come to the Niblung court. Sigurd returns, exchanges
    forms back with Gunnar, tells Gudrun the secret, and gives her the ring. Brunhild
    arrives, Sigurd's spell breaks when he meets her eyes, and Brunhild later grieves
    while Gunnar grows suspicious.
  language: English
  quote_policy: summarized
