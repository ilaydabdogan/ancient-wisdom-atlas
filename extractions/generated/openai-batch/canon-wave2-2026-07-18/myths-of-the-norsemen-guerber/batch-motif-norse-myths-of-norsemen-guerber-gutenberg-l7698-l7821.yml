canonical_text:
  quote: ''
  summary: The gods cannot launch Balder's heavily laden funeral ship, so the giantess
    Hyrrokin is summoned. She arrives riding a wolf with a snake bridle, launches
    the ship with great force, and nearly provokes Thor's anger. Thor consecrates
    the pyre, but kicks the dwarf Lit into the fire. The burning ship drifts out to
    sea and disappears, leaving the world dark in mourning. The gods return to a joyless
    Asgard, anxious over the coming Fimbul-winter, while Frigga waits for Hermod.
    Hermod rides toward Hel, crosses the river Giöll by the Giallar-bridge, is challenged
    by Mödgud as a living rider entering the realm of the dead, learns Balder and
    Nanna have passed that way, and leaps Sleipnir over Hel-gate.
  language: English
  quote_policy: summarized
