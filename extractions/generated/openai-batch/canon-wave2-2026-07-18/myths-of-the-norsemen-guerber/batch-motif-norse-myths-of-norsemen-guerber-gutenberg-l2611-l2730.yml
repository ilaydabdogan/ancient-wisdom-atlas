  quote: ''
  summary: The passage describes Thor as a noisy charioteer, outlines his marriages
    and children, tells how Thor outwits the dwarf Alvis by prolonging a knowledge
    test until sunrise petrifies him, and recounts how Loki cuts off Sif's golden
    hair, is forced by Thor to obtain a replacement from dwarfs, and then enters a
    wager over dwarf craftsmanship that produces magical objects including the boar
    Gullin-bursti.
