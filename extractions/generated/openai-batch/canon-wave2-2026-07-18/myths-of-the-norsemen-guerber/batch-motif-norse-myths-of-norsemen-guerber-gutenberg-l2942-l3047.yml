canonical_text:
  quote: ''
  summary: The passage concludes the episode in which Utgard-Loki explains that Thor,
    Loki, and Thialfi had been opposed by magical disguises of natural and cosmic
    forces, then vanishes in mist. It then recounts Odin racing Hrungnir to Valhalla,
    the Æsir receiving the giant as a guest, Hrungnir drunkenly threatening Asgard
    and Sif, Thor challenging him to a duel, the giants making a clay squire, and
    Thor killing Hrungnir while being wounded by a flint fragment.
  language: English
  quote_policy: summarized
