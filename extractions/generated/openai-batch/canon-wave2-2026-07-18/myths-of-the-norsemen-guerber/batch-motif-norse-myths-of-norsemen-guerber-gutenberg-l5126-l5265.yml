  summary: The passage describes Freya's adornments and magical possessions, including
    Brisinga-men and falcon plumes; her chariots and animal associations; her honors
    and temples; her aid to Ottar in a property dispute through transformation, genealogy,
    and a memory potion; accounts of her desired or attributed marriages; and the
    later transfer or demonization of her worship after Christianization.
