candidate_motifs:
- id: motif:1
  label: Sacred exchange for a divine ornament
  taxonomy_refs:
  - sacred_exchange
  basis: Freya acquires Brisinga-men from dwarfs only after agreeing to the demanded
    exchange.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage presents the transaction plainly but does not frame it with
    a formal motif label.
- id: motif:2
  label: Coveted divine jewel and attempted theft
  taxonomy_refs:
  - sacred_theft
  basis: Loki covets Brisinga-men and would have stolen it, but Heimdall's watchfulness
    prevents the theft.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The theft remains attempted rather than completed in this passage.
- id: motif:3
  label: Feather or falcon garment enabling flight
  taxonomy_refs:
  - shapeshifter
  basis: Freya's falcon garb lets the wearer move through the air as a bird and is
    used by Freya and borrowed by Loki.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage describes birdlike flight through a garment, not a full bodily
    transformation.
- id: motif:4
  label: Search for the missing beloved
  taxonomy_refs:
  - stolen_beloved
  - divine_beloved
  basis: Freya uses the falcon garment when seeking the missing Odur, identified elsewhere
    in the passage among her associated husbands.
  evidence_refs:
  - ev:3
  - ev:12
  confidence: medium
  cautions: The passage states that Odur is missing but does not explain whether he
    was stolen or why he is absent; 'stolen_beloved' is therefore tentative.
- id: motif:5
  label: Fertility goddess distributing abundance
  taxonomy_refs:
  - mother_goddess
  - seasonal_cycle
  basis: Freya is called goddess of fruitfulness and is represented scattering fruits
    and flowers to gladden mankind.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage emphasizes fruitfulness and abundance but does not narrate
    a full seasonal cycle.
- id: motif:6
  label: Divine aid in legal inheritance through ancestry
  taxonomy_refs:
  - royal_legitimacy
  - wisdom
  basis: Freya helps Ottar prove a long noble ancestry by compelling genealogical
    knowledge and a memory potion, enabling him to win property.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The dispute concerns property and paternal heritage rather than kingship
    specifically, so 'royal_legitimacy' is broader than the immediate case.
- id: motif:7
  label: Animal transformation of a human votary
  taxonomy_refs:
  - shapeshifter
  basis: Freya changes Ottar into a boar and rides him to Hyndla's dwelling.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not state whether Ottar changes himself or is changed
    only by Freya; agency belongs to Freya in the passage.
- id: motif:8
  label: Memory potion for retaining sacred or ancestral knowledge
  taxonomy_refs:
  - wisdom
  basis: Freya compels Hyndla to brew a potion of remembrance for Ottar so he can
    remember extensive genealogical details.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The knowledge is genealogical and legal in function, not explicitly esoteric
    in this retelling.
- id: motif:9
  label: Desired goddess and multiple divine spouse traditions
  taxonomy_refs:
  - divine_beloved
  - sacred_marriage
  basis: Freya is desired by gods, giants, and dwarfs, refuses Thrym, and is said
    in some interpretations to have wedded Odin, Frey, Odur, and others.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage explicitly attributes part of this to mythologists' interpretations
    and a personification of earth, not to a single narrated event.
- id: motif:10
  label: Demonization or relocation of former deity after religious change
  taxonomy_refs:
  - mountain
  basis: After Christianity is introduced, Freya is declared a demon or witch and
    banished to mountain peaks, with the Brocken named as her special abode.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: No available motif-family taxonomy directly covers Christianization or
    demonization; the taxonomy reference is limited to the mountain symbol.
comparison_claims:
- id: claim:1
  claim: The passage states that after Christianity was introduced in the North, the
    solemn toast formerly directed to Freya was transferred to the Virgin or to St.
    Gertrude, indicating a same-function substitution within the described worship
    practice.
  claim_level: same_function
  target: Christian veneration of the Virgin or St. Gertrude as recipients of a transferred
    toast
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to the toast custom described in the passage and
    does not establish broader historical continuity beyond that statement.
- id: claim:2
  claim: The passage contrasts Freya's earlier divine worship with her later classification
    as a demon or witch associated with the Brocken, supporting a cautious comparison
    between former deity and later witch-demon tradition in the retelling.
  claim_level: same_function
  target: Brocken witch or demon-train tradition after Christianization
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports the transformation in status but does not provide
    independent historical evidence for the development of the Brocken tradition.
