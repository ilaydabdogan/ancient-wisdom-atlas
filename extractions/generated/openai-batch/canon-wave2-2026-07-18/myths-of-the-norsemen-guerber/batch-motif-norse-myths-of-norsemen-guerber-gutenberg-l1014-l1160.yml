canonical_text:
  quote: ''
  summary: 'The passage describes the pleasures and martial routines of Valhalla:
    chosen warriors feast in Odin''s hall, are served by Valkyrs, drink mead supplied
    by Heidrun, eat the daily renewed boar Sæhrimnir, fight each other and are healed
    at the dinner horn, dedicate themselves to Odin, receive his war-gifts, and are
    borne by Valkyrs to Valhalla. It also describes Odin''s warlike appearances on
    Sleipnir, his spear and bow, his inspiration of berserker rage, and his many names
    and associations with seamen and wind.'
  language: English
  quote_policy: summarized
