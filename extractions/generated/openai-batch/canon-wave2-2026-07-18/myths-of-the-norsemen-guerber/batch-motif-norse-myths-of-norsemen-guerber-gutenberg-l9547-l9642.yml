canonical_text:
  quote: ''
  summary: Sigmund and Sinfiotli pursue vengeance against Siggeir, are discovered,
    captured, buried alive, and escape with the Odin-given sword hidden by Signy.
    They burn Siggeir's hall; Signy reveals Sinfiotli's birth secret and dies in the
    flames. Sigmund returns to Hunaland, marries Borghild, and fathers Hamond and
    Helgi. The Norns visit Helgi's cradle, and Helgi is later fostered by Hagal, provokes
    Hunding, and escapes pursuit by disguising himself as a servant-maid grinding
    corn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sigmund tells Sinfiotli the story of his wrongs, and Sinfiotli swears to aid
    him in revenge even though he believes Siggeir is his father.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At nightfall Sigmund and Sinfiotli enter the king's hall unseen and hide in
    the cellar behind huge vats of beer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Signy's two youngest children discover the hidden men after golden rings roll
    into the cellar, and the children announce the discovery.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Signy brings the children into the cellar and tells Sigmund to kill them;
    Sigmund refuses, and Sinfiotli beheads them before fighting the attackers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Siggeir sentences Sigmund and Sinfiotli to be buried alive in the same mound
    with a stone partition between them so they cannot see or touch each other.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Signy throws a straw bundle to Sinfiotli; the Goths believe it contains provisions
    that will prolong the prisoners' suffering without aiding escape.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The straw bundle contains the sword Odin had given Sigmund, and Sinfiotli
    and Sigmund use it to cut through the partition and roof and escape.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sigmund and Sinfiotli return to the king's hall, set it on fire, block the
    exits while allowing women to pass, and call on Signy to escape.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Signy refuses to live, embraces Sigmund, reveals the secret of Sinfiotli's
    birth, returns to the flames, and perishes with the rest.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sigmund and Sinfiotli sail back to Hunaland, where Sigmund is welcomed to
    power under the ancestral Branstock tree, marries Borghild, and fathers Hamond
    and Helgi.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Norns visit Helgi while he lies in his cradle, promise him entertainment
    in Valhalla after his earthly life, and bestow bright life and honorific names
    on him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Helgi is fostered by Hagal in keeping with the stated custom of northern kings
