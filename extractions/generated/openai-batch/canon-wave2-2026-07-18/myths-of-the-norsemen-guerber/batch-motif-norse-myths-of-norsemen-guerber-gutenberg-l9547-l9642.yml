  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: At fifteen Helgi enters Hunding's hall, leaves an insulting message, is pursued
    to Hagal's dwelling, and avoids detection by disguising himself as a servant-maid
    grinding corn.
  category: sequence
  evidence_refs:
  - ev:10
