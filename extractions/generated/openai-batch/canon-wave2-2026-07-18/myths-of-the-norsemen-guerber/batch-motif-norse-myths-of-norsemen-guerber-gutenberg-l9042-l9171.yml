canonical_text:
  quote: ''
  summary: The passage describes light or white elves as small beneficent beings inhabiting
    the air between heaven and earth under Frey's governance. It recounts elf dancing
    and fairy rings, mortal danger or favor in such rings, compulsive elf music, will-o'-the-wisps
    as elf lights, later fairy rulership by Oberon and Titania, household mischief,
    Alf-blot offerings, and tree or plant-linked maidens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A class of tiny creatures called Lios-alfar, light or white elves, inhabited
    the realms of air between heaven and earth and were governed by Frey from Alf-heim.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elves are described as lovely, beneficent, pure, innocent, and small enough
    to move unseen.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The elves tended flowers, birds, and butterflies and came down to earth on
    moonbeams to dance on the green.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Their hand-in-hand circular dancing made fairy rings marked by greener and
    more luxuriant grass.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: One belief says a mortal standing in a fairy ring could see fairies and gain
    their favour, while another says the mortal must die.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Sir Olaf or Master Olof example has him encounter dancing elf-folk before
    his wedding; by the next morning he, his bride, and his mother are dead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The elf-dance air compelled listeners to dance, and a mortal reproducing it
    could be forced to play until death unless the tune was reversed or violin strings
    were cut.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Will-o'-the-wisps were known in the North as elf lights and were supposed
    to mislead travellers.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Jack-o'-lanterns were identified in popular superstition as restless spirits
    of murderers returning to the scenes of their crimes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Later accounts place fairyland under Oberon and Titania, with the highest
    fairy revels on earth held on Midsummer night.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Elves and related beings were said to visit human dwellings and tangle horses'
    manes and tails, producing elf-locks.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Alf-blot offerings to elves included a small animal or a bowl of honey and
