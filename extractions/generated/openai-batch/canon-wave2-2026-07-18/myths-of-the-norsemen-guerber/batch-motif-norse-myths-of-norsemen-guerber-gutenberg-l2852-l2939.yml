canonical_text:
  quote: ''
  summary: Thor leaves his goats in another man's care and travels on foot with Loki
    and young companions into a misty barren country. They sleep in what appears to
    be a strange house, later revealed to be the giant Skrymir's mitten. Skrymir guides
    them toward Utgard, but his wallet cannot be opened, and Thor's hammer-blows do
    not harm him. The travelers arrive at Utgard-loki's ice castle, where Loki, Thor,
    and Thialfi undergo contests of eating, drinking, running, and lifting, each failing
    against the giant court's challengers or test objects.
  language: English
  quote_policy: summarized
