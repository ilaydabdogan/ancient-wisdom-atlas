canonical_text:
  quote: ''
  summary: After peace is made between the Æsir and Vanas, both parties spit into
    a vase, and the gods create Kvasir from the saliva. Kvasir, renowned for wisdom
    and goodness, teaches and benefits humankind. The dwarfs Fialar and Galar murder
    him, drain his blood into three vessels, and mix it with honey to make a mead
    that grants poetic inspiration. After further killings, the dwarfs surrender the
    mead to Suttung, who has his daughter Gunlod guard it in a hollow mountain. Odin,
    seeking the draught, travels disguised to Jötun-heim, causes nine thralls to die
    in a quarrel over a whetstone, serves Baugi for a promised taste of the mead,
    and has Baugi bore toward the cave with the auger Rati.
  language: English
  quote_policy: summarized
