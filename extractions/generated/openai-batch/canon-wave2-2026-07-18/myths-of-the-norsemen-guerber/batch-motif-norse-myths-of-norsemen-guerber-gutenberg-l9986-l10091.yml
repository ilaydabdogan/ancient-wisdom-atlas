canonical_text:
  quote: ''
  summary: Regin, exiled among men, teaches civilizing arts and seeks a hero to avenge
    him against Fafnir, who has become a treasure-hoarding dragon. Sigurd accepts
    the dragon-slaying task after securing a reforged ancestral sword, receives prophecy
    and disguised guidance, avenges his father by killing Lygni, then kills Fafnir
    from a trench. Regin then demands that Sigurd roast Fafnir's heart for him, claiming
    it contains might, wisdom, and hoarded lore.
  language: English
  quote_policy: summarized
