canonical_text:
  quote: ''
  summary: Thor is freed from a giant's pinioning leg by his young son Magni, whom
    he rewards with the steed Gullfaxi. Thor later seeks Groa's magical healing for
    a stone splinter in his forehead, but her spell fails after he interrupts with
    news about Orvandil and the star called Orvandil's Toe. In a following episode,
    Thor discovers that his hammer is missing; Loki, using Freya's falcon plumes,
    learns that Thrym has stolen and buried it and demands Freya as bride. Freya refuses,
    so Heimdall advises that Thor dress as Freya and Loki as her handmaiden; they
    ride toward Jötunheim in Thor's goat-drawn chariot.
  language: English
  quote_policy: summarized
