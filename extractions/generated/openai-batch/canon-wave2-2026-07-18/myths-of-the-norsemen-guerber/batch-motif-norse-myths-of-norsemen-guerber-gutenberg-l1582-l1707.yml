canonical_text:
  quote: ''
  summary: 'The passage recounts Odin as god of wisdom and inventor of runes, gaining
    runic knowledge through nine nights of self-wounding on Yggdrasil. It then narrates
    the story of Geirrod and Agnar: Odin and Frigga foster the brothers in disguise;
    Geirrod betrays Agnar and becomes king; Frigga accuses Geirrod of inhospitality;
    Odin tests him as the Wanderer/Grimnir; Geirrod binds him between fires; Agnar
    gives him ale; Odin prophesies Geirrod''s death and reveals his divine form.'
  language: English
  quote_policy: summarized
