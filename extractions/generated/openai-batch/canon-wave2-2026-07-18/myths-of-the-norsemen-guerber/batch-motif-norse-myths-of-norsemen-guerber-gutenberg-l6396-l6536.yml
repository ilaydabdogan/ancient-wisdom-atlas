canonical_text:
  quote: ''
  summary: The passage describes the Valkyrs as Odin's battle maidens, cloud and air
    beings who choose slain warriors for Valhalla, carry them by horse through the
    air, bring dew and frost through their cloud-steeds, appear as death omens to
    Vikings at sea, serve mead in Valhalla, and in one tale are detained as wives
    after their swan plumage is seized until they recover it or the spell breaks and
    they escape.
  language: English
  quote_policy: summarized
