  text: The Valkyrs also ride over the sea, snatch dying Vikings from sinking dragon-ships,
    or beckon from the strand as a sign of a final struggle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Their number varies, often being given as nine; they are called divinities
    of the air, Norns, or wish maidens, and are said to be led by Freya and Skuld.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Valhalla, after laying aside their weapons, the Valkyrs pour heavenly mead
    for the Einheriar and new arrivals.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Valkyrs fly to earth in swan plumage, remove it beside a secluded stream
    to bathe, and can be prevented from leaving if a mortal secures the plumage.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Olrun, Alvit, and Svanhvit are surprised by Egil, Slagfinn, and Völund, who
    seize their swan plumage and force them to stay on earth as wives; after nine
    years the maidens escape.
  category: sequence
  evidence_refs:
