canonical_text:
  quote: ''
  summary: The passage recounts two giant legends. In the first, Princess Ilse, daughter
    of the giant of the Ilsenstein, loves the mortal Lord of Westerburg despite her
    father's prohibition; after her father tears a gap between their dwellings, she
    leaps into the flood below and becomes an undine who haunts the waters and entices
    mortals. In the second, a young giantess mistakes a farmer and his team for playthings
    and carries them home, but her father orders their return and says humans will
    one day drive away the giant folk and master the earth.
  language: English
  quote_policy: summarized
