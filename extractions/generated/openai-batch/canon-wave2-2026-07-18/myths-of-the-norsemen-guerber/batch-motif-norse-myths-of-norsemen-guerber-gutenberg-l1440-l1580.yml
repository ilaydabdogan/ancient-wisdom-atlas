canonical_text:
  quote: ''
  summary: The passage moves from a local legend of fiery punishment near the Rat
    Tower to Odin's identification with Irmin and a celestial chariot tradition. It
    then recounts Odin's visit to Mimir's wisdom spring, his sacrifice of an eye for
    a draught, his acquisition of knowledge, and his making of Gungnir from Yggdrasil.
    Finally, Odin tests his wisdom in disguise against the giant Vafthrudnir, wins
    by asking a question only he can answer, and the narrator notes the fragmentary
    ending and a later suggestion about Balder's resurrection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A red sunset glow above the Rat Tower near Bingen on the Rhine is described
    as the reflection of hell fire in which a wicked bishop is being punished for
    a crime.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In parts of Germany, Odin was considered identical with the Saxon god Irmin,
    whose statue, the Irminsul near Paderborn, was destroyed by Charlemagne in 772.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Irmin is said to possess a heavy brazen chariot that travels across the sky
    along the Milky Way, called Irmin's Way by the ancient Germans.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The rumbling of Irmin's chariot is sometimes heard by mortals as thunder,
    and the chariot is identified in the sky with the Great Bear, also called Odin's
    or Charles's Wain.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Odin visits Mimir's spring, described as the fountain of wit and wisdom, where
    the future is visible in the liquid depths, and asks for a draught.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mimir refuses Odin's request unless Odin gives one of his eyes in exchange.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Odin plucks out one of his eyes, and Mimir keeps it as a pledge by sinking
    it into the fountain, where it shines.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the exchange, Odin has one eye, which the passage says is considered
    emblematic of the sun.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Odin drinks from Mimir's fount and gains the knowledge he sought.
