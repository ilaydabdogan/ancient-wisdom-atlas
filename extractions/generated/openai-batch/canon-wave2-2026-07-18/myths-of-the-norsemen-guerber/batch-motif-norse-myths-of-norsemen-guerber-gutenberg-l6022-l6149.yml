canonical_text:
  quote: ''
  summary: The passage recounts Odin's repeated disguised attempts to win Rinda, his
    magical compulsion of her marriage, the birth and rapid maturation of Vali as
    Balder's avenger, an explicit seasonal interpretation of the myth, and Vali's
    future survival after the gods' last battle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Billing, king of the Ruthenes, is old, faces invasion, and has a daughter,
    Rinda, who refuses to choose a husband.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cloaked, broad-hatted stranger concealing one eye enters Billing's palace,
    asks about the king's distress, and offers to command the army.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stranger is identified as Odin; he wins a victory and then asks permission
    to woo Rinda.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Rinda rejects Odin's first proposal and strikes him when he attempts to kiss
    her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Odin persists because Rossthiof's prophecy states that only Rinda can bear
    the destined avenger of Odin's murdered son.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Odin assumes the form of a smith named Rosterus, makes silver and gold ornaments,
    receives Billing's permission to court Rinda, and is again rejected and struck
    by her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Odin next appears as a dashing warrior; when he again attempts to kiss Rinda,
    she pushes him away and he falls to one knee.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Odin uses a magic rune stick and a spell against Rinda, after which she becomes
    rigid and apparently lifeless.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After Rinda revives, she is described as having lost her senses and as melancholy
    mad.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Odin, disguised as an old woman named Vecha or Vak, offers to cure Rinda,
    prescribes a foot-bath, then requests exclusive care over the bound patient.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After gaining power over Rinda, Odin compels her to wed him and releases her
    from bonds and spell only after she promises to be his wife.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Rinda bears Vali, who grows to full stature in a single day.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Vali goes to Asgard with bow and arrow, without washing, combing, or resting,
    to avenge Balder's death upon Hodur.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage explicitly interprets Rinda as the hard-frozen rind of the earth,
    Odin as the sun, the footbath as a shower, the release from spell as thaw, and
    Vali's vengeance as new light after wintry darkness.
  category: other
  evidence_refs:
  - ev:10
- id: obs:15
  text: Vali is said to be one of the twelve deities in Glads-heim, to share Valaskialf
    with Odin, and to be destined to survive the gods' last battle and reign with
    Vidar over the regenerated earth.
  category: attribute
  evidence_refs:
  - ev:11
