canonical_text:
  quote: ''
  summary: Odin encounters nine sleeping wave-maidens by the sea and weds them; they
    jointly bear Heimdall. Heimdall is nourished by earth, sea, and sun, quickly reaches
    maturity, and becomes guardian of Bifröst, the rainbow bridge between heaven and
    earth. The gods give him keen senses, little need for sleep, a sword, and the
    Gjallar-horn, whose blast will summon beings and announce the final battle. The
    passage describes his palace Himinbiorg, white armor, wisdom, golden teeth, golden-maned
    horse, and his detection of Loki attempting to steal Freya’s necklace after entering
    her palace as a fly.
  language: English
  quote_policy: summarized
