canonical_text:
  quote: ''
  summary: Frithiof, offended by Helgé, splits a royal shield on a consecrated spot
    and sails away. Sigurd Ring seeks Ingeborg's hand; unfavorable omens and Halfdan's
    insult lead Ring to prepare war. Helgé and Halfdan seek Frithiof's aid through
    Hilding, but Frithiof initially refuses while speaking in chess metaphors about
    saving his queen. The brothers make a treaty giving Ingeborg and tribute to Sigurd
    Ring. Frithiof meets Ingeborg in Balder's temple despite a rule against speech
    between man and woman there; he argues that Balder would approve their pure love,
    compares it with Balder's love for Nanna, and they plight troth before the shrine.
    They exchange tokens, including Völund's arm-ring. Frithiof later offers military
    aid if the kings grant him Ingeborg, but Helgé challenges him over whether he
    has defiled Balder's temple by speaking with her.
  language: English
  quote_policy: summarized
