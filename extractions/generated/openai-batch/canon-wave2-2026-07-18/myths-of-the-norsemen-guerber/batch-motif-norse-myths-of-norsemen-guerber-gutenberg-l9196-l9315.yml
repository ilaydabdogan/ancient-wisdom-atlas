canonical_text:
  quote: ''
  summary: The passage introduces the Sigurd cycle as heroic lays of the Volsung family.
    It recounts Sigi’s crime, outlawry, Odin’s aid, kingship, and death; Rerir’s vengeance
    and the goddess-sent apple leading to Volsung’s birth; Volsung’s hall with the
    Branstock oak; Signy’s unwanted marriage to Siggeir; and the appearance of a one-eyed
    stranger, understood as Odin, who plants a victory-giving sword in the Branstock
    for the warrior able to draw it out.
  language: English
  quote_policy: summarized
