canonical_text:
  quote: ''
  summary: Sigurd tests horses in a stream and selects the tireless Grane/Greyfell,
    a descendant of Sleipnir. Regin then recites the story of Hreidmar and his sons
    Fafnir, Otter, and Regin; Loki kills Otter while Otter is in animal form, Hreidmar
    binds the gods and demands gold to cover the otter-skin, Loki takes Andvari's
    treasure and ring, Andvari curses the gold, and Fafnir kills Hreidmar and seizes
    the hoard.
  language: English
  quote_policy: summarized
