canonical_text:
  quote: ''
  summary: The passage describes Idun as keeper of apples that preserve the gods'
    youth, then recounts how Loki is coerced by the storm giant Thiassi, appearing
    as an eagle, into luring Idun out of Asgard. Thiassi abducts Idun and her fruit
    to Thrym-heim; the gods begin to age, discover Loki's role, and compel him to
    admit his betrayal.
