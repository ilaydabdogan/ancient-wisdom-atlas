canonical_text:
  quote: ''
  summary: A mouse lives in a hole above buried gold on a farmer's land. The kind
    farmer feeds the mouse, and the mouse repays him with daily golden sovereigns,
    receiving meat in return. A black cat named Grimalkin threatens to eat the fattened
    mouse and forces him to surrender the meat each day. The mouse grows thin and
    tells the farmer, who places him inside a transparent glass object, likely an
    inkstand. When the cat demands meat and the mouse refuses, the cat swallows the
    mouse together with the glass object, cannot digest it, dies, and the mouse escapes
    and resumes the daily exchange with the farmer.
  language: English
  quote_policy: summarized
