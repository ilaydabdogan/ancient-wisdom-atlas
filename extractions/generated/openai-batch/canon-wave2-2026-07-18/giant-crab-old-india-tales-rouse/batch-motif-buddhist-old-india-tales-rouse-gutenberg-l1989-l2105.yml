canonical_text:
  quote: ''
  summary: A wild Goose king in the mountains has a Crow wife whose son Streaky grows
    up among crows on a dust-heap. Streaky is proud of being different. His goose
    half-brothers carry him on a stick to visit their mountain home, but he rudely
    treats them like a pair of horses and compares his transport to a city king’s
    carriage. King Goose rebukes him and sends him back to the dust-heap, where he
    remains.
  language: English
