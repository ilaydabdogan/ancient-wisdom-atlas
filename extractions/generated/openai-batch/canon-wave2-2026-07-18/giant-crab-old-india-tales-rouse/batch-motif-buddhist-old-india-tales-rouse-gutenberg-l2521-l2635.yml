canonical_text:
  quote: ''
  summary: King Godfrey, a wise and praised ruler, seeks knowledge of his faults and
    travels in disguise. In a narrow lane he meets another disguised king whose carriage
    blocks the way. The two coachmen compare the kings and find them equal in worldly
    measures, then compare their virtues in verse. Godfrey's virtues are judged superior
    because he answers anger, wrongdoing, miserliness, and lies with mildness, goodness,
    gifts, and truth. The other king yields, receives advice, and both kings return
    home to rule well.
  language: English
  quote_policy: summarized
