canonical_text:
  quote: '"After all," said he to himself, "it was only one pea."'
  summary: A monkey steals steamed peas from people preparing a meal for their horses.
    When one pea falls, he neglects the peas in his mouth and hands while searching
    for the lost pea, loses the rest, is driven off by the men, and ends with no dinner
    except the smell of boiled peas. The narrator presents the loss as a lesson against
    greed.
