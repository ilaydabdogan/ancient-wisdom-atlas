canonical_text:
  quote: the porter who sits by the gates of Death
  summary: A cruel king called the Great Yellow King dies, and the city rejoices.
    His palace porter weeps, not from affection, but because the king used to strike
    him and he fears the porter at Death's gates may refuse the king and send him
    back. Another man assures him that the king is dead and cannot return, so the
    porter is comforted.
