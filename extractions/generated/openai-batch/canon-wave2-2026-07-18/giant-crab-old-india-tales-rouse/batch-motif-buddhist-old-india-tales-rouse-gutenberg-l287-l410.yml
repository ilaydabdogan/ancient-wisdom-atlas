  quote: ''
  summary: A crocodile in a wide river tries to obtain a monkey's heart for his wife
    by offering to carry the monkey across the river to fruit trees. Midstream he
    reveals the plot and begins to sink. The monkey deceives him by claiming his heart
    is left in a tree, reaches the opposite bank, climbs a fig-tree, and mocks the
    crocodile's foolishness.
