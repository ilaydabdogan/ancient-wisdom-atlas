  quote: "“Birds of a feather flock together.”"
  summary: A fierce horse named Chestnut is used by a king and groom to damage a dealer’s
    horses so the king can buy them cheaply. The dealer later brings an equally vicious
    horse, Strongjaw, expecting a fight, but Chestnut and Strongjaw immediately become
    friendly. The king pays properly, and a wise minstrel explains the event with
    the maxim that like goes with like.
