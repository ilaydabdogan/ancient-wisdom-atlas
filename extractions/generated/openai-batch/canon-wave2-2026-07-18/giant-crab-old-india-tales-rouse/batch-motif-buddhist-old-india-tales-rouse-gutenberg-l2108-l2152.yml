canonical_text:
  quote: ''
  summary: A king publicly displays his costly meals. A man who wants to taste the
    royal food runs in shouting that he has news, gains access to the king, pretends
    to be faint with hunger, is fed from the king's own dish, and then reveals that
    his news is simply that he was hungry and now is not. The crowd is shocked, but
    the king laughs, lets him go, and warns him not to repeat the trick.
  language: English
