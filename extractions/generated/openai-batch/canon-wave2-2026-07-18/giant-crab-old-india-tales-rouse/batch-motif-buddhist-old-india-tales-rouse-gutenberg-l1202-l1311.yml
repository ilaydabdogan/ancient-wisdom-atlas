canonical_text:
  quote: ''
  summary: A cruel prince is thrown into a flooded river by his servants and survives
    by clinging to an uprooted tree. A snake, a rat, and a parrot also take refuge
    on the tree. A hermit rescues them all, warms them by a fire, and tends the animals
    before the prince. The snake and rat promise treasure, and the parrot promises
    rice, while the prince only pretends gratitude. Later, when the hermit visits
    the prince, now king, the king orders him flogged and impaled. The hermit tells
    the story, and the servants punish the wicked king instead.
  language: English
  quote_policy: summarized
