  quote: ''
  summary: A poor farmer loses one of his two oxen and needs another for ploughing.
    His courtier son trains him for a year to ask the king using a memorized verse,
    but in the royal court the farmer mistakenly asks the king to take his remaining
    ox. The king laughs, the son replies cleverly, and the king gives the farmer several
    fine oxen.
