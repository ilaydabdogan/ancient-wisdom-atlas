canonical_text:
  quote: ''
  summary: 'A giant crab lives in a mountain lake and kills animals that come to drink.
    A great Elephant and his wife devise a plan: the crab seizes the Elephant, the
    wife distracts the crab with flattery, and the Elephant crushes it. The animals
    thank the Elephant pair and make them King and Queen. The crab’s claws remain,
    are carried away by floodwaters, and become war drums.'
  language: English
  quote_policy: summarized
