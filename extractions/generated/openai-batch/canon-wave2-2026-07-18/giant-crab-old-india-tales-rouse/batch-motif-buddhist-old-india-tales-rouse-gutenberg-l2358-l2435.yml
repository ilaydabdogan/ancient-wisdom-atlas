canonical_text:
  quote: ''
  summary: In Ceylon, a city of she-goblins lures shipwrecked sailors with food, clothing,
    marriage, and magical illusions of ordinary country life. The goblins secretly
    keep former husbands imprisoned and eat them at night. The sailors' captain discovers
    the danger, warns his companions, and those who believe him are rescued by a fairy's
    winged horse. Those who remain are killed and eaten by the goblins.
  language: English
  quote_policy: summarized
