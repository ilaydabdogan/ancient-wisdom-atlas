  quote: ''
  summary: A Jackal living near a lion family in the Himalaya Mountains proposes marriage
    to the Lioness. Her brothers react to the insult; two die by striking the transparent
    wall of the Jackal's Crystal Cave, while the youngest understands the barrier.
    The youngest lion's loud coaxing frightens the Jackal to death, and the Lioness
    lives on with one remaining provider.
