canonical_text:
  quote: ''
  summary: A fowler catches quails by hiding, imitating their call, and throwing a
    net over them. A wise quail teaches the flock to put their heads through the net's
    meshes and fly away together, carrying the net to a bush where they can escape
    underneath. This succeeds repeatedly until the quails quarrel. When the fowler
    nets them again, their dispute prevents coordinated lifting, and he puts them
    in a basket and takes them home.
