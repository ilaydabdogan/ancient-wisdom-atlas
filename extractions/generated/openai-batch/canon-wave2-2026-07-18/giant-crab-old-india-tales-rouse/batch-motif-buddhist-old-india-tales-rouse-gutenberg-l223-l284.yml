  summary: A cat feigns holiness and ascetic practice to gain the trust of rats, who
    bow to him daily. He secretly eats the last rat in their procession until the
    chief rat notices the troop shrinking, investigates, evades the cat's attack,
    bites him, and the rats devour the cat and live peacefully afterward.
