canonical_text:
  quote: ''
  summary: A crane offers to carry fish from a drying pool to a cool lake, but secretly
    eats them at a tree. After the fish are gone, he tries the same deception on a
    crab. The crab secures himself by gripping the crane's neck, discovers the deceit,
    forces the crane to land him safely at the lake, and then kills the crane.
  language: English
  quote_policy: summarized
