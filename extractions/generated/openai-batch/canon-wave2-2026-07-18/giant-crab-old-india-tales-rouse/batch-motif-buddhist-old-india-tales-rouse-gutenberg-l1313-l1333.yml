canonical_text:
  quote: ''
  summary: After the Wicked Prince is replaced by the Hermit as king, the Hermit visits
    the Snake, Rat, and Parrot. The Snake and Rat give hidden treasure, and the Parrot
    summons many parrots who bring enough rice to feed the people. The beasts are
    said to have kept their promise through gratitude, while the ungrateful Prince
    is killed. The Hermit rules kindly; the people and animals eventually go to heaven
    because the animals overcame love of money and gave their wealth away in gratitude.
  language: English
  quote_policy: summarized
