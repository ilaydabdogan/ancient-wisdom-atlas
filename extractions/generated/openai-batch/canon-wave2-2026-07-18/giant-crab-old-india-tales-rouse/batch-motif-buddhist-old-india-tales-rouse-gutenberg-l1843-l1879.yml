  quote: ''
  summary: A lion and a she-jackal have a cub who looks like a lion but sounds like
    a jackal. While playing with young lions, the cub tries to roar and instead yelps,
    causing the others to question him. The old lion confirms the cub's jackal mother
    and advises him to remain silent, after which the cub avoids speaking among the
    lions.
