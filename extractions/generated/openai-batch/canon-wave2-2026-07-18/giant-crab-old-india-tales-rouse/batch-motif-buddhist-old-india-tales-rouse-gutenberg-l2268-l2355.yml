canonical_text:
  quote: ''
  summary: A mountain Lion notices a Boar at a lake and plans to eat him later. The
    Boar misreads the Lion's withdrawal as fear and challenges him. After boasting
    at home, the Boar becomes frightened when the other boars warn him of the Lion's
    strength. An old wise Boar advises him to cover himself in mud. At the appointed
    meeting the Lion is disgusted by the dirt and refuses to touch him. The Boar claims
    victory, but the other boars do not believe him and leave the place.
