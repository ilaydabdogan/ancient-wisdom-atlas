canonical_text:
  quote: ''
  summary: A man entrusts two talking parrots, Beaky and Tweaky, to watch a thievish
    maid while he is away. Beaky openly warns the maid and is tempted by stolen sugar,
    then seized and plucked bald. Tweaky remains silent, later reveals the event indirectly
    through a repeated taunt and a verse about wisdom in shutting one’s eyes. The
    master understands and expels the maid.
