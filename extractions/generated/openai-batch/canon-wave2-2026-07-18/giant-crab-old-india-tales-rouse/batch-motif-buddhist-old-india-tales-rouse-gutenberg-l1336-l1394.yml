canonical_text:
  quote: ''
  summary: A water-bound goblin lives in a forest pool and eats animals that enter
    the water. During a drought, thirsty monkeys reach the pool; their king notices
    tracks going in but not out and warns them. Two monkeys enter anyway and are dragged
    under. A man arrives, hears the warning, recognizes the danger, and drinks through
    a hollow reed. The monkeys imitate him, drink safely from the bank, and the goblin
    later starves.
