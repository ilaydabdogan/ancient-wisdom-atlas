canonical_text:
  quote: '"And who ever heard, my lord, of a rat eating a plough?"'
  summary: A man entrusts his plough to a friend, who sells it and falsely claims
    that a rat ate it. The plough owner hides the friend's son safely and answers
    with the equally impossible claim that a hawk carried the boy off. In court, the
    judge understands the counter-trick, orders restitution, and the boy is returned
    after the plough is restored.
  language: English
