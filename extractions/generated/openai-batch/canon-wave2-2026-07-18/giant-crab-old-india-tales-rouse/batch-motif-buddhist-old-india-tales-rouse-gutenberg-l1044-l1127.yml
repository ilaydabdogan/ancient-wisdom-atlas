canonical_text:
  quote: ''
  summary: A gardener leaves his park to attend a fair and entrusts watering the garden
    to monkeys he has treated kindly. The monkeys, led by their chief, misunderstand
    water supply and plant care, pull up plants to measure root length, and water
    them according to root size. The garden is ruined. The gardener rebukes the monkeys,
    but his master blames the gardener for putting monkeys in charge and dismisses
    him.
  language: English
