canonical_text:
  quote: ''
  summary: A powerful goblin haunts an empty house outside a city gate and may eat
    anyone who sneezes there unless protective blessing formulas are exchanged. A
    father and son, shut out of the city at sunset, stay in the haunted house. The
    goblin raises dust to make the father sneeze, but the son and father speak the
    required formulas in time. The son then admonishes the goblin and persuades him
    to stop eating men, become vegetarian, and follow the travellers as an errand-boy.
  language: English
  quote_policy: summarized
