  summary: A young quail leaves the ploughed farm where it usually feeds and is caught
    by a falcon near the forest. The quail persuades the falcon that it could not
    be caught on its own ground, returns to a ploughed field, dodges behind a clod,
    and the pursuing falcon strikes the clod and dies. The narrator closes with practical
    morals about staying with familiar conditions and not risking what is already
    held.
