  summary: A poor young man seeking fortune is shipwrecked and cast alone onto a small
    island. A wingless flying pig arrives carrying a brilliant diamond. The man takes
    the diamond, discovers it grants wishes for movement and flight, learns the pig
    is a magician whose power depends on the diamond, traps and kills the pig, cooks
    it with sunlight reflected through the jewel, and uses the diamond to fly to the
    nearest land.
