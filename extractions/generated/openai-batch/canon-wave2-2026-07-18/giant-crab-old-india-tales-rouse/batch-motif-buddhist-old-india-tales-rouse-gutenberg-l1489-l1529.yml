  summary: A flood leaves a wolf trapped on a rock without food. The wolf reframes
    his forced hunger as a holy Friday fast. A fairy tests him by taking the form
    of a little kid; the wolf immediately abandons his pretended piety and tries to
    eat it. The fairy reveals herself, rebukes him as a hypocrite, and punishes him
    by leaving him on the rock to fast for a week.
