canonical_text:
  quote: "“the royal road out of the cave into the light”"
  summary: The passage discusses the ordering and purpose of mathematical studies
    in education. Astronomy and harmonics are redirected away from sensory observation
    toward intellectual problems, and the mathematical sciences are presented as a
    prelude to dialectic. Dialectic is described as withdrawing from sense, contemplating
    the idea of good, and elevating the soul through an image of leaving a cave for
    light and acquiring a new faculty of sight.
  language: English
  quote_policy: quoted
