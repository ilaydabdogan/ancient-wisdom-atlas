  summary: The passage is a comparative analytical discussion of Plato's Republic,
    Augustine's De Civitate Dei, and Dante's De Monarchia. It describes heavenly city
    ideals, the fall of Rome, Christian and pagan judgment, resurrection, divine authority,
    and the political-theological vision of a universal empire.
