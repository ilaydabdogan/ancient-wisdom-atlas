literal_observations:
- id: obs:1
  text: Plato's Republic is described as having been called a church rather than a
    state, and as related to an ideal city in the heavens embodied in Augustine's
    De Civitate Dei.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says some men blamed the overthrow of Rome on the anger of old
    Roman deities at neglected worship, while Augustine argued that Roman destruction
    was due to pagan vices rather than Christianity.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Augustine is described as comparing Gentile religions with the faith of Christ
    and tracing a parallel between the kingdom of God in Jewish scripture and kingdoms
    of the world in gentile writers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Augustine is described as treating heathen mythology, Sibylline oracles, Plato's
    myths, and Neo-Platonist dreams as matters of fact.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Augustine is said to look forward to a time when Christian and Pagan are brought
    before a judgment-seat and the true City of God appears.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Augustine is said to discuss miracles of his own day and to view nature and
    the human frame as a foretaste of the heavenly state and bodily resurrection.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Augustine is described as believing that the Timaeus idea of creation is derived
    from Genesis and as noticing a coincidence between a saying of Plato and the Exodus
    revelation to Moses.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:8
  text: Dante's De Monarchia is described as a vision of Universal Empire, understood
    as the natural and necessary government of the world with divine authority distinct
    from the Papacy.
  category: attribute
  evidence_refs:
  - ev:7
