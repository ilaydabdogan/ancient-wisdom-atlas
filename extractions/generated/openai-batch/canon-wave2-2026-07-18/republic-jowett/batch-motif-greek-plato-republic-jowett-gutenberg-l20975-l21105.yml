canonical_text:
  quote: ''
  summary: The passage describes how predatory money-making in an oligarchic state
    multiplies debt and poverty, how a luxurious ruling class becomes weak, how class
    conflict makes the state sick and leads to democracy, and how democracy is characterized
    by freedom, variety, permissiveness, and images of a many-colored robe and a bazaar
    of constitutions.
  language: English
  quote_policy: summarized
