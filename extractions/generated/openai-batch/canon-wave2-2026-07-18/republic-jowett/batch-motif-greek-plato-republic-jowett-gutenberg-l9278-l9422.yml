canonical_text:
  quote: ''
  summary: Socrates and Thrasymachus argue over how justice should be defined. Socrates
    challenges restrictions on possible answers, presents himself as an ignorant learner,
    and asks Thrasymachus to speak. Thrasymachus defines justice as the interest of
    the stronger and explains this through ruling governments that make laws for their
    own interests. Socrates questions whether rulers can err and suggests that Thrasymachus's
    definition then implies that justice can require the opposite of the stronger's
    interest.
  language: English
  quote_policy: summarized
