canonical_text:
  quote: ''
  summary: The passage characterizes Thrasymachus as Plato’s blustering Sophist and
    contrasts his weakness in argument with Socrates’ mastery of dialectic. It describes
    an unequal, humorous contest in which Thrasymachus is irritated, defeated, and
    later protected by Socrates, while also noting uncertainty about the historical
    Thrasymachus and later testimony about his reputation.
  language: English
  quote_policy: summarized
