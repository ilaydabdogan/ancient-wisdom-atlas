  text: The passage says criticism has often referred works to design, but ancient
    writings can contain elements not comprehended in an original design because the
    plan grows during writing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that many designs may be spoken of in a great work as well
