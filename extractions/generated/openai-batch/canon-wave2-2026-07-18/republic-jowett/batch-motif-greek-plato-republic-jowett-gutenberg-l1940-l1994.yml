canonical_text:
  quote: ''
  summary: 'Jowett''s analysis says that Republic Book III gives Plato''s nearest
    approach to a theory of art: true art is simple, ideal, morally formative, and
    suited to youth. The passage then notes Plato''s relative silence about creative
    arts and his idea of a work of art and the State as wholes. It also summarizes
    Plato''s contrast between physicians, who should know illness personally, and
    judges, who should know vice without youthful participation in evil.'
  language: English
  quote_policy: summarized
