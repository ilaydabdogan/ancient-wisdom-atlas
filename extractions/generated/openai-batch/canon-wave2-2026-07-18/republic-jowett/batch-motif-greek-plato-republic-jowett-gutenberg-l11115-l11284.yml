canonical_text:
  quote: ''
  summary: Socrates and Glaucon discuss how a city that expands beyond natural necessity
    requires more occupations, land, physicians, and eventually war. They then reason
    that war requires a specialized army or guardian class, whose members must be
    naturally fitted, trained, spirited, brave, and somehow both dangerous to enemies
    and gentle to friends.
  language: English
  quote_policy: summarized
