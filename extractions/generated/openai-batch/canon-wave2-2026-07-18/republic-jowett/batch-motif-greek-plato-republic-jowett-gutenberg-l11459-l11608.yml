canonical_text:
  quote: God is not the author of all things, but of good only.
  summary: 'A dialogue passage argues that stories portraying gods as violent, quarrelsome,
    deceptive, or causes of evil should not be taught to future guardians. The speaker
    proposes rules for poets: God must be represented as good, as the cause of good
    only, and not as author of evil; a second question is raised about whether God
    changes shape or remains fixed in his proper image.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker says stories in which a young man could justify grave crimes or
    chastising his father by divine precedent should not be repeated in the State.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage forbids telling future guardians about wars in heaven, plots and
    fights among gods, battles of giants, and quarrels of gods and heroes with friends
    and relatives.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says children should first be told that quarrelling is unholy
    and that citizens have never quarrelled with one another.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrative examples to be excluded include Hephaestus binding his mother
    Here, Zeus hurling Hephaestus away for defending her, and battles of gods in Homer.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stated reason for excluding such tales is that a young person cannot judge
    allegorical and literal meanings, and early impressions may become indelible and
    unalterable.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker says he and Adeimantus are founders of a State who must know the
    forms and limits poets should observe, while not themselves composing the tales.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker states that God must always be represented as he truly is and
    that God is truly good.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The argument proceeds that what is good is not hurtful, does no evil, and
    is a cause of well-being.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
