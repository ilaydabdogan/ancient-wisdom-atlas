canonical_text:
  quote: ''
  summary: 'The passage analyzes Plato''s higher education: after earlier training,
    education resumes through mathematics, abstraction, and dialectic. It presents
    mathematics as ordering particulars and preparing the mind, then places dialectic
    and the idea of good above mathematics. It also notes limitations in Plato''s
    account, Aristotle''s criticism, and the enduring influence of an ideal of knowledge.'
  language: English
  quote_policy: summarized
