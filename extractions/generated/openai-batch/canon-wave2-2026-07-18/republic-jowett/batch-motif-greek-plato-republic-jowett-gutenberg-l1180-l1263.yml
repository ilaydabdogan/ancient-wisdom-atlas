  summary: The passage analyzes Glaucon and Adeimantus as pressing Socrates on justice,
    reputation, reward, and consequences. It presents Socrates as enlarging justice
    into an ordering principle for the State and individual, then describes the Republic's
    method of looking first to society and then to the individual, with the perfect
    State as the condition in which justice, happiness, the good man, and the good
    citizen coincide.
