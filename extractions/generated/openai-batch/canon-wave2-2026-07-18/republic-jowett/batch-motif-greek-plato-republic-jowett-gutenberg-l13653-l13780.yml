canonical_text:
  quote: ''
  summary: In Book IV, Adeimantus asks whether Socrates' proposed guardians are made
    miserable by lacking property, pay, and ordinary luxuries. Socrates replies that
    the founding aim is the happiness and justice of the whole State, not the disproportionate
    happiness of one class. He uses analogies of a painted statue, husbandmen dressed
    as royalty, and potters feasting instead of working to argue that each class must
    perform its own function. He then identifies wealth and poverty as causes of artistic
    and civic deterioration that guardians must prevent from entering the city. Adeimantus
    ends by asking how such a city could fight a rich and powerful enemy without wealth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Adeimantus asks Socrates how to answer the charge that the guardians are being
    made miserable because, although the city belongs to them, they lack lands, large
    houses, gold, silver, hospitality, and other marks of fortune.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Socrates adds that the guardians are fed but not paid beyond their food and
    therefore lack money for journeys, mistresses, and other luxuries commonly thought
    to constitute happiness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Socrates says the aim in founding the State is not the disproportionate happiness
    of any one class, but the greatest happiness of the whole, in order to discover
    justice in the ordered State and injustice in the ill-ordered State.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Socrates compares the State to a painted statue, saying one should not make
    the eyes so beautiful that they cease to function as eyes, but should make the
    whole beautiful through proper proportion.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Socrates says that assigning guardians the wrong kind of happiness would make
    them cease to be guardians, just as husbandmen dressed in royal apparel or potters
    feasting by the fireside would cease to perform their proper work.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Socrates says that merely seeming guardians turn the State upside down, while
    real guardians have the power to give order and happiness to the State and are
    meant to be true saviours rather than destroyers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Socrates says the guardians, auxiliaries, and all other classes must be compelled
    or induced to do their own work in the best way, so that the whole State grows
    in noble order and each class receives its natural proportion of happiness.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Socrates identifies wealth and poverty as two causes of deterioration in
    the arts: a rich potter becomes indolent and careless, while a poor potter lacks
    tools or instruments and cannot teach sons or apprentices equally well.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Socrates describes wealth and poverty as evils that the guardians must watch
    against because they may enter the city unobserved; wealth produces luxury and
    indolence, poverty produces meanness and viciousness, and both produce discontent.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Adeimantus asks how the city will be able to go to war against a rich and
    powerful enemy if it is deprived of the financial resources of war.
  category: speech
  evidence_refs:
  - ev:8
