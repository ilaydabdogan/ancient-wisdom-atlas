canonical_text:
  quote: "“Until philosophers are kings...”"
  summary: Socrates states that cities and humankind will not be free from evils until
    philosophers rule or rulers possess philosophical wisdom. Glaucon warns that this
    claim will provoke hostile reaction, and Socrates proceeds to define the true
    philosopher as a lover of wisdom as a whole and as a lover of the vision of truth,
    distinguishing such a person from lovers of sights, performances, or minor arts.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker says he is about to face what he likens to the greatest wave,
    even if it breaks over him in laughter and dishonour.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Socrates says cities and the human race will not rest from evils until philosophers
    become kings or rulers possess philosophy, so that political greatness and wisdom
    meet.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Glaucon warns that many respectable people would metaphorically seize weapons
    and run at Socrates because of his statement, and he offers good-will and advice
    as assistance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Socrates says the interlocutors must explain who the philosophers are, identifying
    some natures as fit to study philosophy and lead, and others as followers rather
    than leaders.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Socrates argues by analogy that a true lover loves the whole object of love,
    comparing this to lovers of youth, lovers of wine, and ambitious people who desire
    honour.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Socrates says the philosopher is a lover not of a part of wisdom only, but
    of the whole, and describes the philosopher as eager for every sort of knowledge.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Glaucon objects that lovers of sights and musical amateurs might be included
    too broadly, mentioning people who run about to Dionysiac festivals to hear every
    chorus.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Socrates rejects those groups as only an imitation and identifies true philosophers
    as lovers of the vision of truth.
  category: speech
  evidence_refs:
  - ev:7
