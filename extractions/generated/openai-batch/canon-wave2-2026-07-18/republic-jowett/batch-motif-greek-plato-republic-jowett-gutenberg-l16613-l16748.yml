canonical_text:
  quote: ''
  summary: The passage discusses how the proposed guardians should treat Hellenic
    opponents as friends to be corrected rather than enemies to be destroyed, then
    shifts to the question whether the ideal State can exist. Socrates frames the
    discussion as an inquiry into justice and the ideal State, arguing that ideals
    guide judgment even if actual cities only approximate them. He then introduces
    the need to identify the least possible change that could reform existing States.
