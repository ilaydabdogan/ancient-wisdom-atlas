canonical_text:
  quote: ''
  summary: 'The dialogue argues that the tyrannical state and the tyrannical soul
    correspond to one another: both are enslaved, poor, fearful, and miserable. It
    contrasts tyranny with rule under a king, calls for a judge who can see past the
    tyrant’s outward display, and offers an illustration of a slave owner carried
    by a god into a wilderness where civic protection is absent and fear of the slaves
    becomes acute.'
  language: English
  quote_policy: summarized
