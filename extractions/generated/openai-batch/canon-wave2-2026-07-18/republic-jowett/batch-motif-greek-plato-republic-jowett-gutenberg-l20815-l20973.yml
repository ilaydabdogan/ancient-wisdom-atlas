canonical_text:
  quote: "“the man, then, will be at war with himself; he will be two men, and not
    one”"
  summary: 'The passage describes the formation of the oligarchical individual from
    a timocratic household: the son of a ruined public man abandons ambition, turns
    to money-making, enthrones the covetous element in his soul, subordinates reason
    and spirit to wealth, suppresses rogue desires by fear, and becomes divided within
    himself. It then turns to the origin of democracy from oligarchy, where wealth-seeking
    rulers profit from spendthrift youths and create dispossessed, armed, resentful
    men eager for revolution.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A representative of timocracy has a son who first imitates his father, while
    the father is later described as ruined by the State, possibly through trial,
    death, exile, loss of civic privileges, and confiscation of property.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The son, after seeing the ruin, is described as fearful, humbled by poverty,
    turning to money-making, and removing ambition and passion from the ruling place
    in his soul.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The concupiscent and covetous element is described as occupying the vacant
    throne and acting as a great king within the son.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Reason and spirit are described as sitting on the ground beside the inner
    sovereign and being restricted to calculating wealth and admiring riches or rich
    men.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The oligarchical individual and the oligarchical State are said to resemble
    one another in the value they set upon wealth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The individual is described as penurious and laborious, satisfying necessary
    appetites, subduing other desires as unprofitable, saving something out of everything,
    and making a purse for himself.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says the man lacks cultivation and has made a blind god director
    of his chorus and given him chief honour.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Dronelike desires, described as pauper and rogue desires, are said to exist
    in him and to be forcibly kept down by his ordinary way of life.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: His rogueries are said to become visible when he has an opportunity to act
    dishonestly, with the guardianship of an orphan given as an example.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: His bad passions are said to be restrained by necessity, fear, and concern
    for possessions rather than by reason.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The man is described as being at war with himself and as being two men rather
    than one, though his better desires usually prevail over inferior ones.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The true virtue of a unanimous and harmonious soul is said to flee far away
    from him.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The miser is described as unwilling to spend money in contests for glory,
    fighting with only a small part of his resources, commonly losing the prize and
