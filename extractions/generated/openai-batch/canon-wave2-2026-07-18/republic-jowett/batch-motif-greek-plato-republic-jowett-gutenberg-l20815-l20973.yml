  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The change from oligarchy into democracy is introduced as arising from a State
    whose aim is to become as rich as possible.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Oligarchical rulers are described as knowing that their power rests on wealth
