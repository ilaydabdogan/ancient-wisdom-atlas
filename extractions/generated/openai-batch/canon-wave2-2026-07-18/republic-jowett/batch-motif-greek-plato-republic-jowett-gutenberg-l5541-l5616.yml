canonical_text:
  quote: 'the poet is like the painter in two ways: first he paints an inferior degree
    of truth, and secondly, he is concerned with an inferior part of the soul.'
  summary: The passage argues that Homer and the poets have not shown practical civic
    benefit like lawgivers, inventors, or teachers of a way of life. It presents poets
    as imitators of appearances, compares them with painters, distinguishes use, making,
    and imitation, and claims that calculation and reason counter deceptive appearances
    while poetry nourishes the irrational and sorrowful part of the soul.
  language: English
  quote_policy: quoted
