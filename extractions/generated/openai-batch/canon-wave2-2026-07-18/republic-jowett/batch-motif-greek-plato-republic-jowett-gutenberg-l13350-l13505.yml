canonical_text:
  quote: ''
  summary: Socrates and an interlocutor discuss balanced education, the selection
    of rulers and guardians, the testing of candidates against forgetting, force,
    fear, pleasure, and deception, and the appointment or rejection of candidates
    according to the outcome of these trials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who mixes music with gymnastic in proper proportion and attunes them
    to the soul is called a true musician and harmonist in a higher sense than a string-tuner.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The city is said to require such a presiding figure if its government is to
    last.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dialogue asks who should rule and who should be subject, and states that
    elders and the best people should rule the younger.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The best guardians are described as wise, efficient, specially careful of
    the State, and as loving what they regard as sharing their own interests.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Guardians are to be selected by observing those who throughout life are eager
    to do what benefits their country and reluctant to act against its interests.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Candidate guardians are to be watched at every age to see whether they keep
    their resolution and do not forget or cast off duty to the State under force or
    enchantment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage classifies involuntary loss of conviction as occurring through
    theft, force, or enchantment, with theft explained through persuasion or time,
    force through pain or grief, and enchantment through pleasure, fear, or deception.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Candidates are to perform actions in which they may forget or be deceived;
    those who remember and are not deceived are selected, while those who fail are
    rejected.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Further tests include toils, pains, conflicts, terrors, and pleasures, with
    comparisons to testing colts amid noise and proving gold in a furnace.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A candidate who comes out of the trial victorious and pure at every age is
    appointed ruler and guardian, honored in life and death, and given sepulture and
    memorial honors; a failed candidate is rejected.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The fuller title of guardian is applied to the higher class that protects
    against foreign enemies and internal civic harm, while the younger men formerly
    called guardians are designated auxiliaries and supporters of the rulers' principles.
  category: relationship
  evidence_refs:
  - ev:9
