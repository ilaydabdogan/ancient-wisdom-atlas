canonical_text:
  quote: ''
  summary: 'A speaker presents a figure of human enlightenment and unenlightenment:
    chained prisoners in an underground cave see only shadows cast by a fire and mistake
    them for truth. One prisoner is released, painfully turns toward light, is dragged
    upward to the sun, gradually learns to see the upper world, reasons about the
    sun as cause of visible order, pities those still in the cave, and would be darkened
    again if returned below.'
  language: English
  quote_policy: summarized
