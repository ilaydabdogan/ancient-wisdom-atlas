canonical_text:
  quote: ''
  summary: 'The passage summarizes rules for educating Plato''s guardians: art, music,
    and gymnastics must be simple and formative of the soul; diet and medicine should
    avoid luxury and excessive care. Homeric examples are used for simple heroic diet
    and medicine. Asclepius is described as refusing to prolong lives made useless
    by intemperance, and a Pindaric story of Asclepius being struck by a thunderbolt
    for restoring a rich man to life is explicitly rejected.'
  language: English
  quote_policy: summarized
