canonical_text:
  quote: the diviner metal is within them
  summary: 'The passage prescribes a communal and austere way of life for the guardians:
    no private property beyond necessity, no closed private houses or stores, fixed
    support from citizens, and common messes. It explains that they possess divine
    gold and silver within themselves and must not touch, wear, share a roof with,
    or drink from ordinary gold or silver. This rule is said to preserve them and
    the State; if they acquire private homes, lands, or money, they will become tyrannical
    enemies and bring ruin. Glaucon assents.'
  language: English
  quote_policy: quoted
