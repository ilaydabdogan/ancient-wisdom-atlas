  quote: ''
  summary: 'The passage presents an argument about poetry and imitation: the speaker
    prefers truth over Homer, explains beds and tables through universal ideas, distinguishes
    divine, artisan, and pictorial making, and concludes that painters and tragic
    poets produce imitations removed from reality and can deceive undiscerning audiences.'
  language: English
  quote_policy: summarized
