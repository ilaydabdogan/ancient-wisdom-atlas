canonical_text:
  quote: the true philosopher in his relation to the State
  summary: Socrates and Adeimantus discuss the qualities required for philosophical
    rule, Adeimantus objects that philosophers are commonly seen as useless or corrupt,
    and Socrates answers with a parable of a ship whose untrained sailors seize control
    while the true pilot is dismissed as useless. Socrates then states that the figure
    describes the true philosopher's relation to the State.
  language: English
  quote_policy: quoted
