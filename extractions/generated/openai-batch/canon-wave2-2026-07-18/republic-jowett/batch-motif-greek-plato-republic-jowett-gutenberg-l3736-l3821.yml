canonical_text:
  quote: '"the enlightenment or unenlightenment of our nature"'
  summary: 'The passage recounts the cave figure: chained humans in an underground
    den perceive shadows cast by a fire; one is painfully turned and dragged upward,
    gradually sees reflections, heavenly lights, and the sun; after returning, he
    is mocked and a liberator may be killed. The passage then interprets the cave,
    fire, upward way, sun, and idea of good, describes education as turning the soul
    toward light, and applies the pattern to philosopher-rulers who must return to
    serve the state.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A speaker introduces a figure concerning enlightenment and unenlightenment
    in human nature.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Human beings are imagined living from childhood in an underground den, with
    necks and legs chained so that they can only see into the den.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A fire, a raised way, and a low wall stand between the prisoners and moving
    figures who carry works of art and images of humans and animals made of wood and
    stone.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The prisoners see only shadows cast on the wall, give names to those shadows,
    and may hear echoes that seem to come from the shadows.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the prisoners are turned toward the real images and light, they experience
    pain, grief, dazzled eyes, and an impulse to look back toward easier sights.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A prisoner is imagined being dragged up a steep and rugged ascent into the
    presence of the sun, then gradually learning to perceive shadows, reflections
    in water, the moon, the stars, and finally the sun.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The sun is described as giving the year and seasons and as the author of visible
    things; those who pass from darkness to light rejoice and regard the honours of
    the den as worthless.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: When an enlightened person descends again into the underground dwelling, he
    sees poorly at first, is mocked by the others, and a person trying to free and
    enlighten others may be killed if caught.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage explicitly identifies the cave or den with the world of sight,
    the fire with the sun, the upward way with the way to knowledge, and the idea
    of good as last seen with difficulty.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Instruction is contrasted with giving eyes to the blind; the faculty of sight
    is said to be already present, while the soul requires turning toward the light.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Pleasure and desire are described as leaden weights binding the soul to earth;
    cutting them away turns intelligence toward truth.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The rulers must be chosen from natures able to ascend to light and knowledge
    of the good, but they are not allowed to remain there and must be forced down
    again among the captives for the common good.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The trained philosophers are addressed as rulers and kings of the hive and
    are required to use their eyes in the dark among those who quarrel about shadows.
  category: speech
  evidence_refs:
  - ev:9
