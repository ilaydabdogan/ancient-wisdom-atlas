canonical_text:
  quote: Love is his tyrant, and lives lordly in him and lawlessly,
  summary: 'The passage describes the tyrannical character: desires exhaust his resources,
    drive him to defraud and plunder, lead him to violate parents and sacred places,
    and make him in waking life what lawless dreams had previously revealed. The account
    then extends the same pattern from the individual soul to the city and political
    tyrant.'
  language: English
  quote_policy: quoted
