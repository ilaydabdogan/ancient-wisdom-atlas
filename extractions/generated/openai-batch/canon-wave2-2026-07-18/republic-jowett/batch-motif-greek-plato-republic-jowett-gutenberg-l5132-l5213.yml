canonical_text:
  quote: "“Like man, like State,—the tyrannical man will answer to tyranny”"
  summary: The passage describes the tyrannical person as ruled by unnecessary desires
    and by Love, committing crimes against parents and community, and then compares
    the tyrannical individual with the tyrannical state. It argues that the tyrant
    appears powerful but is inwardly enslaved, miserable, fearful, and captive to
    passions.
  language: English
  quote_policy: quoted
