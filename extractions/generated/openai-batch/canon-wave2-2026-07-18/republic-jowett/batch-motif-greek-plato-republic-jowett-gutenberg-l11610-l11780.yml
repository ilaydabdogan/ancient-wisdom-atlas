canonical_text:
  quote: ''
  summary: Socrates argues with Adeimantus that what is best and perfect is least
    subject to alteration; since God and divine things are perfect, God cannot change
    into many forms or lie. The speakers reject poetic representations of gods as
    disguised strangers, Proteus and Thetis as shape-changing, Here as disguised as
    a priestess, and frightening stories told to children. They distinguish the hated
    'true lie' in the soul from a verbal lie that may be useful in limited human cases,
    including mythic tales about ancient times. They conclude that the divine is simple,
    truthful, unchanging, and non-deceptive, and they reject examples such as Zeus
    sending a lying dream to Agamemnon.
  language: English
  quote_policy: summarized
