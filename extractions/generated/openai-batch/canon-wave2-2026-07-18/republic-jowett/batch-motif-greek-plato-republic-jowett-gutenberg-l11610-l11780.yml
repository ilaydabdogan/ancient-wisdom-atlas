  text: Things at their best, including healthy bodies, vigorous plants, and well-made
    composite objects, are said to be least altered by outside influences and circumstances.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: God and the things of God are described as perfect in every way.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speakers infer that God can hardly be compelled by external influence
    to take many shapes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speakers reason that if God changed himself, the change could only be
    for the worse, and no god or human would desire to make himself worse.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The conclusion is stated that every God remains absolutely and forever in
    his own form.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Socrates says poets should not tell stories in which gods take the disguise
    of foreign strangers and walk through cities in many forms.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Socrates says no one should slander Proteus and Thetis or introduce Here as
