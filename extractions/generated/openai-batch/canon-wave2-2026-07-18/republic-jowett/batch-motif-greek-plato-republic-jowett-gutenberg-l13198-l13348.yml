canonical_text:
  quote: ''
  summary: Socrates argues that a virtuous nature, not a vicious one, can know both
    virtue and vice and thus serve as a good judge. He describes law, medicine, music,
    and gymnastic as arts aimed at ordering body and soul, especially by harmonizing
    the spirited and philosophical principles of human nature. Excessive devotion
    to music softens and weakens spirit, while excessive devotion to gymnastic makes
    the mind savage and dull. The passage ends with an image of a god-given pair of
    arts adjusting the two principles like instrument strings until harmonized.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A good man is said to have a good soul; the criminal and suspicious person
    judges others by himself and cannot recognize an honest man because he lacks a
    pattern of honesty within himself.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The good and wise judge is identified with a virtuous nature educated by time;
    vice is said not to know virtue, while virtue can know both virtue and vice.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The proposed state’s medicine and law are said to minister to better natures,
    give health to soul and body, leave incurable bodily disease to die, and put an
    end to corrupt and incurable souls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Youth educated in simple music that inspires temperance are said to be reluctant
    to go to law.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The musician practicing simple gymnastic is described as avoiding medicine
    except in an extreme case, and his exercises are meant to stimulate the spirited
    element rather than develop muscles.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Music and gymnastic are described as two arts whose teachers chiefly intend
    the improvement of the soul, not merely separate training of soul and body.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Exclusive devotion to gymnastic is said to produce hardness and ferocity;
    exclusive devotion to music is said to produce softness.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The guardians are said to need both spirited courage and philosophical gentleness,
    and these qualities should be in harmony; the harmonious soul is temperate and
    courageous, while the inharmonious soul is cowardly and boorish.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Soft music is described as pouring into the soul through the ears; at first
    it tempers spirit like iron, but if prolonged it melts and wastes spirit, cuts
    out the soul’s sinews, and produces a feeble warrior.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: When music weakens a naturally strong spirit, the person becomes excitable,
    flames up at provocation, is quickly extinguished, and grows irritable and impracticable.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Violent exercise and heavy feeding without music and philosophy are said first
    to increase pride and spirit, then to leave intelligence feeble, dull, blind,
    and without nourishment.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The person formed only by gymnastic is described as a hater of philosophy,
    uncivilized, not using persuasion, like a wild beast, and living in ignorance
    and lack of grace.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: Human nature is said to have two principles, the spirited and the philosophical;
    some God is said to have given mankind two corresponding arts so that the principles
    may be tightened or relaxed like instrument strings until harmonized.
  category: relationship
  evidence_refs:
  - ev:10
