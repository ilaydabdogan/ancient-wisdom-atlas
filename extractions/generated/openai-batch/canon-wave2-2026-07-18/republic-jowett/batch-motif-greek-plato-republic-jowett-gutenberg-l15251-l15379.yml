canonical_text:
  quote: ''
  summary: At the opening of Book V, Socrates is interrupted before continuing his
    account of defective states. Polemarchus, Adeimantus, Glaucon, and Thrasymachus
    insist that he explain the proposed community of women and children among the
    guardians. Socrates hesitates, calls the topic difficult and dangerous, invokes
    Nemesis against the risk of false speech, receives encouragement, and agrees to
    return to the question of women, children, and guardians.
  language: English
  quote_policy: summarized
