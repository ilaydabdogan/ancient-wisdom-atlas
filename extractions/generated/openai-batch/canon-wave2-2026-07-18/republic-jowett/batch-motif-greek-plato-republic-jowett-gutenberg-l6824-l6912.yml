canonical_text:
  quote: ''
  summary: The passage criticizes Plato’s proposed regulations about marriage and
    reproduction. It argues that treating human reproduction like animal breeding
    ignores mind, affection, family ties, duty, and truth. It contrasts Plato’s proposal
    of state-held children and selected breeding pairs with animal parental care,
    Greek poetic respect for family, and monogamous moral norms, then lists historical
    examples presented as evidence of deterioration when sexual and family relations
    depart from those norms.
  language: English
  quote_policy: summarized
