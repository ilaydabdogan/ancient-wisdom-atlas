canonical_text:
  quote: ''
  summary: 'The passage summarizes Socrates'' argument that the State and the individual
    soul correspond, and that the soul contains distinct principles: desire, reason,
    and spirit or passion. It uses examples of thirst, Leontius'' attraction and revulsion
    toward corpses, spirited indignation, a shepherd-and-dog metaphor for reason restraining
    spirit, and a Homeric quotation about rebuking the soul.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Socrates is described as preparing to identify the individual and the State
    after proving that there are three parts of the individual soul.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that qualities of states are treated as qualities of the
    individuals composing them, giving examples of Scythians and Thracians as passionate,
    the speaker's own race as intellectual, and Egyptians and Phoenicians as covetous.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The argument asks whether reasoning, desiring, and anger belong to one whole
    soul or to separate principles within the soul.
  category: other
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:4
  text: The passage provisionally assumes that the same thing in the same relation
    cannot do, be, or suffer opposites, while allowing examples such as a man standing
    still while moving his arms and a top fixed in place while rotating.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Thirst is treated as a desire for drink, and the thirsty soul is said to be
    capable of receiving opposed impulses, one saying to drink and the rational one
    saying not to drink.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the story of Leontius, he passes dead bodies near the executioner, feels
    both longing to see them and abhorrence, first turns away and shuts his eyes,
    then tears them open and addresses them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage describes passion or spirit as a third principle that often assists
    reason against desire and is not found assisting desire against reason.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A case is given in which a man suffering unjustly is supported by indignation,
    while hunger and thirst cannot tame him until reason quiets spirit through the
    image of a shepherd restraining a dog.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The passage distinguishes passion from reason by saying passion exists in
    children and brutes and by citing Homer on striking the breast and rebuking the
    soul.
  category: other
  evidence_refs:
  - ev:8
