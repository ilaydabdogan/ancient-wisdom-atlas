canonical_text:
  quote: ''
  summary: Socrates argues with Adeimantus that gifted natures become especially bad
    when badly educated. He describes the public as the strongest educator, overwhelming
    youth through collective praise, blame, coercion, and popular opinion. He compares
    mercenary Sophists to a man who studies the moods of a powerful beast and mistakes
    skill in pleasing it for wisdom. The world, he says, cannot accept absolute beauty
    or philosophy and therefore censures philosophers; he asks how the true philosopher
    might be preserved in such conditions.
  language: English
  quote_policy: summarized
