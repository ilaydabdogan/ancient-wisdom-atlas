canonical_text:
  quote: ''
  summary: 'Socrates argues that a true art has no defect of its own and attends only
    to the good of its subject: medicine to the body, horsemanship to the horse, the
    physician to the patient, and the pilot to sailors. He concludes that a ruler,
    insofar as ruler, seeks the interest of the subject rather than his own. The argument
    is said to upset the definition of justice, after which Thrasymachus responds
    with a mocking question about Socrates'' nurse and says he has not learned to
    distinguish shepherd from sheep.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker asks whether an art can be faulty or deficient like sight or hearing
    and whether it would then need another supplementary art without end.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker states that every art remains pure and faultless when true, perfect,
    and unimpaired, and that it considers the interest of its subject matter.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Medicine is said to consider the interest of the body, and horsemanship the
    interest of the horse.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Arts are said not to care for themselves, because they have no needs, but
    only for what is subject to the art.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The arts are described as superiors and rulers of their own subjects, and
    Thrasymachus assents reluctantly.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Socrates states that no science or art considers or enjoins the interest of
    the stronger or superior, but only that of the subject and weaker; Thrasymachus
    contests this and then acquiesces.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The true physician is described as prescribing for the good of the patient,
    ruling the human body as subject, and not being a mere money-maker.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The pilot, in the strict sense, is described as a ruler of sailors and as
    providing for the sailors' interest rather than his own.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Socrates concludes that no ruler, insofar as ruler, considers or enjoins his
    own interest, but only what is for the subject or suitable to the art.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After this point in the argument, the definition of justice is said to have
    been completely upset.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Thrasymachus responds by asking whether Socrates has a nurse and says she
