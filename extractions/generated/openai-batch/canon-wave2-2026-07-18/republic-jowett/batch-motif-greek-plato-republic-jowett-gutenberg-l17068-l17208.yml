canonical_text:
  quote: But those who love the truth in each thing are to be called lovers of wisdom
    and not lovers of opinion.
  summary: The passage distinguishes knowledge, ignorance, and opinion. Knowledge
    is linked with being, ignorance with not-being, and opinion with things that are
    between being and not-being. It contrasts those who attend to many beautiful things
    with those who know absolute and unchanging realities, calling the latter lovers
    of wisdom.
