canonical_text:
  quote: ''
  summary: The passage argues that if women are to perform the same civic and military
    duties as men, they should receive the same nurture and education, using male
    and female dogs as an analogy. It anticipates ridicule of women exercising naked,
    wearing armour, and riding horses, and compares this anticipated ridicule to earlier
    ridicule of naked male exercise among Greeks. The speakers then frame objections
    based on differing natures, compare the difficulty of the argument to swimming
    in deep water and needing miraculous help, and distinguish fair reasoning from
    verbal contradiction.
  language: English
  quote_policy: summarized
