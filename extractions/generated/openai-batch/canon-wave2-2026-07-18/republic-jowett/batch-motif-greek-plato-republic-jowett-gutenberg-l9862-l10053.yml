canonical_text:
  quote: ''
  summary: In a dialectical exchange, the first-person speaker questions Thrasymachus
    about his claim that perfect injustice is more profitable than perfect justice.
    Thrasymachus classifies injustice with wisdom, virtue, strength, and discretion,
    while describing justice as simplicity. The speaker tests this by comparing the
    just and unjust person to skilled and unskilled practitioners, including musicians,
    physicians, knowledgeable people, and ignorant people, concluding that the wise
    and good do not seek to overreach their like, whereas the bad and ignorant seek
    to overreach both like and unlike.
  language: English
  quote_policy: summarized
