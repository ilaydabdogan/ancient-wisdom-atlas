canonical_text:
  quote: ''
  summary: 'The passage summarizes proposals for a communal ideal State: shared property
    and kinship reduce internal conflict; children are trained for war under supervision;
    cowards are punished and brave fighters rewarded; fallen warriors and benefactors
    receive posthumous honors; warfare among Hellenes is limited as a family quarrel
    aimed at reconciliation; an interlocutor presses Socrates on whether such a State
    is possible, and Socrates describes the challenge as a third wave.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Citizens of the proposed State are described as one-minded and as having no
    private property beyond their bodies, reducing lawsuits and contention.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage permits striking when insulted but states that younger men will
    not strike elders because of reverence for kin and fear of family retaliation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Citizens are said to be free from flattery of the rich, household cares, borrowing,
    and nonpayment.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The citizens and their children are compared with Olympic victors and are
    said to receive maintenance during life and honorable burial after death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The communal principle is said to fit military service, and parents take children
    to watch battles as part of training.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Young warriors are placed under experienced veterans and given swift, tractable
    steeds, compared to wings, so that they can escape danger.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Cowards and deserters are degraded to the class of husbandmen, while gentlemen
