canonical_text:
  quote: ''
  summary: The passage defines civic courage as law-shaped true opinion about dangers
    that education preserves against pleasure, pain, fear, and desire, using dyeing
    as an analogy. It then turns to temperance, describing self-mastery as the better
    principle ruling the worse in the soul and in the city, and identifying civic
    temperance with harmony and agreement between rulers and subjects.
  language: English
