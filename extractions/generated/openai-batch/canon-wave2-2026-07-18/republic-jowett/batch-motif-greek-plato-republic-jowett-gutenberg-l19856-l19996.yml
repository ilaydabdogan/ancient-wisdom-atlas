canonical_text:
  quote: ''
  summary: The dialogue defines the dialectician as one who can grasp the essence
    of each thing and rationally define the good. It argues that future rulers of
    the ideal State must receive dialectical education, be selected for soundness
    of body and mind, and avoid partial or defective devotion to truth and learning.
    Philosophy is personified as disgraced by unqualified students and deserving restoration
    by her true followers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speakers defer a fuller correlation and subdivision of the subjects of
    opinion and intellect.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dialectician is described as one who attains a conception of the essence
    of each thing.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The person who cannot impart such a conception is said to fail in intelligence
    to the degree of that inability.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Knowledge of the good is said to require rational abstraction and definition,
    the ability to answer objections, and appeal to absolute truth rather than opinion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A person lacking this knowledge is described as apprehending only a shadow
    by opinion, dreaming and slumbering in life, and reaching the world below.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The future rulers of the ideal State are not to be set in authority over the
    highest matters if they lack reason.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A law is proposed requiring an education that produces skill in asking and
    answering questions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Dialectic is called the coping-stone of the sciences and is placed above every
    other science.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Candidates for the studies are to be chosen for reliability, bravery, beauty
    if possible, noble temper, and natural gifts useful for education.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The required natural gifts include keenness, ready acquisition, good memory,
    endurance, and love of labour in bodily and intellectual discipline.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Philosophy’s present disrepute is attributed to people who study her without
    vocation.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The true sons of philosophy are said to be the ones who should take her by
    the hand, not bastards.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: A votary of philosophy should not be half industrious and half idle, loving
    bodily exercise while hating learning, listening, or enquiry.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: A soul is called halt and lame if it hates voluntary falsehood but tolerates
    ignorance and involuntary falsehood.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: States and individuals are said to err when they fail to distinguish the true
    son from the bastard in virtues and appoint defective rulers or friends.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: If only sound pupils in body and mind enter the education and training, they
    are said to save the constitution and the State; otherwise philosophy will receive
    greater ridicule.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: The speaker says he became indignant because philosophy was undeservedly trampled
    under foot.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:18
  text: The speaker rejects choosing old men for this education and states that youth
    is the time for extraordinary toil.
  category: attribute
  evidence_refs:
  - ev:13
