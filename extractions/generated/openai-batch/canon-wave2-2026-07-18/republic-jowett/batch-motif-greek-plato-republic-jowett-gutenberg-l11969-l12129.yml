canonical_text:
  quote: ''
  summary: The speaker argues that poetry and stories for guardians and youth should
    exclude excessive laughter, divine misconduct, impertinent speech toward rulers,
    sensual indulgence, greed for gifts, and insolence toward gods. He permits truthfulness
    as the norm, allows rulers alone to use falsehood for public good, approves examples
    of obedience and endurance, and evaluates Homeric passages accordingly.
  language: English
  quote_policy: summarized
