canonical_text:
  quote: ''
  summary: Thrasymachus argues that justice benefits the stronger ruler and harms
    subjects, while injustice benefits the unjust, especially in the form of tyranny.
    He gives examples from contracts, taxation, public office, theft, temple-robbing,
    and enslavement. Socrates and the company ask him to remain and defend the claim;
    Socrates frames the discussion as an inquiry into the best way to live and returns
    to the shepherd-and-flock analogy for rulership.
  language: English
  quote_policy: summarized
