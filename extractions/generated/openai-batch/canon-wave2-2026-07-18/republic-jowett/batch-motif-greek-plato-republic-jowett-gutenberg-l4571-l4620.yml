canonical_text:
  quote: ''
  summary: The passage analyzes the individual democrat as the son of a miserly oligarch.
    It distinguishes necessary from unnecessary pleasures, describes the youth’s exposure
    to pleasures and companions, and presents an allegory in which passions and false
    spirits seize the soul as a citadel, exile modesty and temperance, restore vices
    under honorable names, and leave the person alternating among pleasures and pursuits
    without firm discrimination.
  language: English
  quote_policy: summarized
