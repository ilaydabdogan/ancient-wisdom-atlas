canonical_text:
  quote: "“is he awake or in a dream only?”"
  summary: Socrates distinguishes lovers of sights and sounds from philosophers, contrasts
    dreamlike confusion of copies with waking recognition of absolute beauty, and
    argues that knowledge, opinion, ignorance, being, not-being, and an intermediate
    condition have distinct objects or faculties.
  language: English
  quote_policy: quoted
