canonical_text:
  quote: ''
  summary: The passage argues that injustice strengthens bestial and spirited elements
    within a human being while weakening the inner human or divine ruling principle.
    Justice is described as cultivating and harmonizing the inner parts, making the
    lion-like element an ally, restraining the many-headed monster, and allowing divine
    wisdom or lawful authority to rule. The passage also compares accepting money
    to enslave one's noblest part with Eriphyle accepting a necklace for her husband's
    life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes the unjust person as feeding a multitudinous monster,
    strengthening the lion-like qualities, starving the man within, and allowing the
    parts to fight, bite, and devour one another.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The supporter of justice says the man within should master the whole human
    creature, watch over the many-headed monster like a husbandman, cultivate gentle
    qualities, restrain wild ones, make the lion-heart an ally, and unite the parts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage defines the noble as subjecting the beast to the man or god in
    man, and the ignoble as subjecting the man to the beast.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage asks whether receiving gold and silver would profit someone if
    it meant enslaving the noblest part to the worst, and compares this to selling
    children and to Eriphyle taking a necklace as the price of her husband's life.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage links intemperance with the huge multiform monster being too much
    at large; pride and bad temper with the lion and serpent element growing; luxury
    and softness with weakening the same creature; and flattery with making a lion
    become a monkey.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says everyone is better ruled by divine wisdom within, or by external
    authority if internal rule is impossible; it also says law and child-rearing aim
    to establish an inner guardian and ruler analogous to the constitution of a state.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says undetected injustice makes a person worse, while detection
    and punishment silence and humanize the brutal part, liberate the gentler element,
    and ennoble the soul through justice, temperance, and wisdom.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The person of understanding is said to honor studies that impress these qualities
    on the soul and to regulate bodily habit and training so as to preserve harmony
    of the soul.
  category: action
  evidence_refs:
  - ev:8
