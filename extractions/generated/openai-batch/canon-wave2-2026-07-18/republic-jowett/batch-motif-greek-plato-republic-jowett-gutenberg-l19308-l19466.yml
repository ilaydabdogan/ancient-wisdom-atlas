canonical_text:
  quote: ''
  summary: A philosophical dialogue argues that contradictory sense-impressions awaken
    calculation and intelligence, leading the soul from visible confusion toward intelligible
    truth. Arithmetic is prescribed for guardians because it trains pure thought,
    serves both military and philosophical purposes, and helps the soul pass from
    becoming to being; geometry is then introduced for military applications.
  language: English
  quote_policy: summarized
