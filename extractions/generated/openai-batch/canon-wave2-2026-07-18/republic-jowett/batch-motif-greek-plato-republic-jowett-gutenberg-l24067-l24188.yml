canonical_text:
  quote: the soul which cannot be destroyed by an evil, whether inherent or external,
    must exist for ever
  summary: A dialectical argument maintains that the soul is not destroyed by bodily
    or external harms, concludes that the soul is immortal, and then contrasts the
    soul’s present disfigured condition with its original purity. The soul is compared
    to the sea-god Glaucus, whose true form is obscured by waves and marine accretions;
    the passage says the soul should be examined through its love of wisdom and kinship
    with the immortal, eternal, and divine.
  language: English
  quote_policy: quoted
