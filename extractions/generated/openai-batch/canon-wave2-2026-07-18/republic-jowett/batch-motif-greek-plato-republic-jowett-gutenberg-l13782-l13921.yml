canonical_text:
  quote: ''
  summary: The speaker argues that a unified and well-trained city can withstand richer
    divided cities, should preserve its unity and self-sufficiency, assign citizens
    according to nature, prioritize education and nurture, and guard music and gymnastic
    from innovation because changes in musical modes are said to alter the laws of
    the State.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says the proposed side would have trained warriors against an
    army of rich men and compares this advantage to a skilled boxer defeating multiple
    untrained wealthy opponents.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker proposes sending an embassy to one of two opposing cities, saying
    the proposed city has no silver or gold and offering the ally the spoils of the
    other city.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker compares the proposed city's fighters to lean wiry dogs and the
    wealthy opposing side to fat tender sheep.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Other States are described as plural rather than single: each city is said
    to contain a city of the poor and a city of the rich, which are at war with one
    another, along with smaller divisions.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The proposed State is said to be greatest in deed and truth while its wise
    order continues, even if it has no more than a thousand defenders.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The proper limit of the State's growth is said to be the amount consistent
    with unity; the city is to be neither large nor small, but one and self-sufficing.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Guardians' offspring are to be degraded if inferior, while naturally superior
    offspring from lower classes are to be elevated into the guardians' rank.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Each citizen is to be assigned to the work nature intends, so each person
    and the whole city will be one and not many.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Education and nurture are identified as the sufficient central concern; well-educated
    citizens are said to become sensible and able to handle other civic matters.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Marriage, possession of women, and procreation of children are said to follow
    the principle that friends have all things in common.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A well-started State is compared to a wheel moving with accumulating force;
    good nurture and education are said to implant good constitutions that improve
    over time.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Rulers are told to preserve music and gymnastic in their original form and
    to prevent innovation.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Damon is cited as saying that when modes of music change, the fundamental
    laws of the State change with them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The guardians are said to lay the foundations of their fortress in music,
    and lawlessness is said to steal in easily.
  category: action
  evidence_refs:
  - ev:8
