  text: The passage contrasts social reformers who isolate the animal part of human
    nature with a speaker who describes humans as many-sided and moving between good
    and evil.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes a hypothetical human condition in which passions are
    controlled by no divine or human authority, with no shame, decency, or higher
    affection sanctifying natural instincts.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that strength and health are not the only desirable qualities,
    and gives mind, character, and soul as more important considerations.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage discusses heredity through parents, remoter ancestors, race, and
    the general condition of mankind, including inherited physical and mental traits.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:5
  text: The passage rejects the idea that suitable marriage arrangements or lots could
    reliably produce figures such as Shakespeare or Milton, and uses Spartan exposure
