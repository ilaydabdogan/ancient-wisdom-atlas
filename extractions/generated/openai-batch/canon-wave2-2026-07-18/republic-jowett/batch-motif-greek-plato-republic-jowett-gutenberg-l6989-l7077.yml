canonical_text:
  quote: ''
  summary: The passage argues against reducing human beings to animal breeding, health,
    or strength. It presents humans as morally complex beings shaped partly by heredity
    and circumstance but also capable of self-direction through knowledge, moral affection,
    and will. It criticizes artificial marriage or breeding schemes attributed to
    Plato and contrasts inherited necessity with the possibility of prevention, cure,
    and self-created life.
  language: English
  quote_policy: summarized
