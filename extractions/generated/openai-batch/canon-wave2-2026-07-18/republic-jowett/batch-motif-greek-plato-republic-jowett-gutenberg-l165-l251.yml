canonical_text:
  quote: ''
  summary: The passage presents Plato and the Republic as foundational for later philosophical,
    educational, political, and imaginary-state traditions. It summarizes the Republic
    as a search for Justice, the construction of an ideal and higher State ruled by
    philosopher-kings, a sequence of political degeneration, the exclusion of imitative
    poetry, and a concluding vision or revelation of another life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Plato is described as a captain or leader of followers, and the Republic is
    described as an original model for later imaginary States.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage attributes wide influence to Plato in philosophy, education, theology,
    politics, and later conceptions such as unity of knowledge, law, and equality
    of the sexes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Republic is summarized as an argument whose subject is the search after
    Justice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Cephalus first hints at justice; Socrates and Polemarchus discuss it; Thrasymachus
    caricatures it; Glaucon and Adeimantus reduce it to abstraction; and Socrates
    constructs an ideal State in which it reappears.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The rulers' first care in the first State is education, including religion,
    morality, music, gymnastic, poetry, and harmony between individual and State.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A higher State is described in which no one calls anything his own, there
    is neither marrying nor giving in marriage, kings are philosophers, philosophers
    are kings, and education lasts through the whole of life.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ideal State is said to degenerate in order from the perfect ideal to the
    government of the soldier and lover of honour, then to democracy, and then to
    tyranny.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says that when the wheel comes full circle the account does not
    begin a new human period but ends after passing from the best to the worst.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The old quarrel of poetry and philosophy is resumed; poetry is judged an imitation
    thrice removed from truth; Homer and dramatic poets are condemned and banished
    as imitators.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The idea of the State is said to be supplemented by a revelation of a future
    life and, in the final book, by a vision of another life.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:9
- id: obs:11
  text: The passage divides the Republic into five natural divisions, ending with
    the relation of philosophy to poetry and the happiness of citizens crowned by
    a vision of another life.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:9
