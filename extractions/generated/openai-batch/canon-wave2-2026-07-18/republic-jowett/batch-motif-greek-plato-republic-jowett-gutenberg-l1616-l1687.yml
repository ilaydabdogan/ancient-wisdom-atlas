  quote: ''
  summary: The passage classifies poetic narrative styles, discusses whether guardians
    in the ideal State should imitate characters or actions, rejects complex mimetic
    performance, and then regulates music, harmony, instruments, metre, and rhythm
    according to simplicity and the formation of the soul.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Poetry is described as narrative of past, present, or future events, with
    three kinds: simple, imitative, and mixed.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first scene in Homer is used as an example of mixed description and dialogue
    that can be transformed into descriptive narration or dialogue alone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The State questions whether guardians should be imitators and states that
    one person cannot play many parts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Guardians already have the care of freedom as their business and should imitate
    only good actions if they imitate at all.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The actor’s mask is said to be apt to become the actor’s face.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage forbids representations of several human types and states, including
    quarrelling or weeping women, slaves, bullies, cowards, drunkards, madmen, blacksmiths,
    animals, rivers, and a raging sea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A good or wise man is said to prefer descriptive style with little imitation,
    while a man without self-respect imitates anyone and anything by gesture and voice.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The State is not adapted for complexity because one man plays one part only.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A polyphonous pantomimic poet is to be received respectfully but denied a
    place in the State, which prefers a rough, honest poet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A song or ode is said to have subject, harmony, and rhythm; lamenting and
    convivial harmonies are banished, while Dorian and Phrygian remain for war and
    peace.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Many-stringed and variously shaped instruments, especially the flute, are
    rejected; the lyre and harp are permitted in town and Pan’s-pipe in the fields.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Music and metres undergo a purgation; metres should be simple, suitable to
    the occasion, and ordered so that style conforms to subject and metre to style.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The simplicity and harmony of the soul should be reflected in style, metre,
