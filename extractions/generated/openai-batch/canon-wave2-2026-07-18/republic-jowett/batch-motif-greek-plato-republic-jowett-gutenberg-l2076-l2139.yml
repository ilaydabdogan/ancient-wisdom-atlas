  summary: The passage analyzes the second paradox in terms of mind, body, reason,
    appetite, health, and self-command. It describes higher and lower tendencies in
    human nature as sometimes opposed and sometimes reconciled, then criticizes Plato’s
    handling of medicine, diet, gradual healing, and bodily care. It closes with brief
    style notes on music, the construction of the State, poets, citizen metals, and
    Asclepius.
