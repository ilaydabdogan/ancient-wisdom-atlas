canonical_text:
  quote: ''
  summary: 'The passage summarizes the opening movement of Plato''s Republic: Socrates
    and Glaucon are detained after a festival and brought to Cephalus'' house; Cephalus
    discusses old age, wealth, justice, and the world below; Socrates begins testing
    definitions of justice; Polemarchus inherits the argument and defends a Simonidean
    account of justice as helping friends and harming enemies, which Socrates refutes
    through examples involving weapons, contracts, theft, friends and enemies, and
    the rejection of returning evil for evil.'
  language: English
  quote_policy: summarized
