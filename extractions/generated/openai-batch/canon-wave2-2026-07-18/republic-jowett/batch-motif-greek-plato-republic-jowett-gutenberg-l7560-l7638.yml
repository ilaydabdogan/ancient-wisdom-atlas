canonical_text:
  quote: ''
  summary: The passage analyzes Plato’s treatment of gymnastic education, medicine,
    and law. It presents gymnastic and music as disciplines for improving the mind,
    discusses medicine in relation to bodily and mental wholeness, and compares legal
    disorder to diseases of a State that multiply like hydra heads unless prevented
    through education.
  language: English
  quote_policy: summarized
