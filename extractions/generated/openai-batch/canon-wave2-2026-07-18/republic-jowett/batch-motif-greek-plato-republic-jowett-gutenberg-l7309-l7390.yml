canonical_text:
  quote: ''
  summary: Jowett's introductory analysis discusses Plato's application of metaphysical
    ideas to psychology and politics, the Idea of Good, its relation to God or the
    divine Creator, an explicit comparison between Hebrew prophetic faith and Greek
    philosophical contemplation, and the ideal and corrupt forms of the philosopher-statesman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Plato imagined truths of psychology might be reached by deduction,
    while treating the method used in the Fourth Book as imperfect and provisional.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: After reaching the Idea of Good as the end of dialectic, Plato is described
    as refusing to define the nature and divisions of the science.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says previous sciences must first be studied before the philosopher
    can enter final rest.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Plato is described as aware of the vacancy of his ideal while enthusiastic
    in contemplating it; the passage uses the image of looking into an orb of light
    and being warmed and elevated.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Hebrew prophet is said to believe that faith in God would enable him to
    govern the world, while the Greek philosopher is said to imagine that contemplation
    of the good would make a legislator.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Both the Hebrew and Greek modes are described as finding repose in a divine
    perfection that may be personal or impersonal and both external and internal.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage notes that the Timaeus does not mention the Idea of Good and the
    Republic does not mention the divine Creator of the world, then asks how God and
    the Idea of Good relate.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says the Idea of Good appears to be another mode of conceiving
    God, and paraphrases it as an intelligent principle of law and order in the universe
    embracing man and nature.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The question whether a ruler or statesman should be a philosopher is said
    to remain of interest, and the passage states that some persons have united command
    with thought and reflection.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The philosopher-statesman is described as unpopular with the mass of mankind
    because his motives and power are not understood and because he may be thought
    to neglect common feelings or immediate events.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage lists corruptions or false forms of the philosopher-statesman,
    including indecision, principles used to cover policy changes, susceptibility
    to others' arts, and courtly liberal opinions without liberal actions.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: The ideal figure is described as perfectly balancing thought and action, being
    equal to the present and reaching toward the future, but as never yet seen.
  category: attribute
  evidence_refs:
  - ev:11
