canonical_text:
  quote: ''
  summary: A dialogue passage argues that measuring, numbering, weighing, calculation,
    and law-directed reason reveal a better rational principle in the soul, distinct
    from an inferior principle opposed to measure. It extends this distinction to
    grief and imitation, saying that poetry and other imitative arts appeal more to
    the passionate, fitful, grieving part than to the calm rational part.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The arts of measuring, numbering, and weighing are said to aid human understanding,
    so that apparent size, quantity, and weight yield to calculation, measure, and
    weight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The calculating and rational principle in the soul measures and certifies
    equality, greater-than, and less-than relations.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the same faculty cannot hold contrary opinions at
    the same time about the same thing.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A part of the soul that has opinions contrary to measure is distinguished
    from a part that has opinions in accordance with measure; the measure-trusting
    part is called better, and the opposed part inferior.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Painting, drawing, and imitation in general are described as far removed from
    truth and as associated with a principle within us that is also removed from reason.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says imitation imitates human actions and the rejoicing or sorrowing
    that follows imagined good or bad results.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A good man who loses a son or another very dear thing is said to sorrow but
    to moderate his sorrow.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage contrasts how a grieving person behaves when seen by equals with
    how he may behave when alone.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Law and reason are said to bid resistance to sorrow and recommend patience,
    counsel, ordering affairs after events have occurred, and applying a remedy to
    what is sickly or fallen.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Another principle is said to incline toward recollection of troubles and lamentation
    and is described as irrational, useless, cowardly, and rebellious.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The rebellious principle is said to provide varied material for imitation,
    while the wise and calm temperament is described as harder to imitate and harder
    for a theatre crowd to appreciate.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The popular imitative poet is said to prefer the passionate and fitful temper
    rather than the rational principle in the soul.
  category: relationship
  evidence_refs:
  - ev:12
