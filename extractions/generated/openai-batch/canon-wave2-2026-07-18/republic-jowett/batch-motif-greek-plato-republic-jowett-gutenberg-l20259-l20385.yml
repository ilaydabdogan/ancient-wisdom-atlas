canonical_text:
  quote: States are as the men are; they grow out of human characters.
  summary: Socrates and Glaucon resume the argument about the perfect State, list
    four inferior forms of government, connect political constitutions with corresponding
    human dispositions, and begin to ask how timocracy arises from aristocracy through
    discord in the ruling classes.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speakers state that in the perfect State wives, children, education, war,
    and peace are held in common, with the best philosophers and bravest warriors
    as kings.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The governors are described as placing soldiers in common houses without private
    or individual possessions, while the soldiers receive maintenance from other citizens
    and care for themselves and the State.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The discussion returns to a previously interrupted plan: examine four false
    forms of government and the corresponding individual defects to compare the best
    and worst persons.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The four named inferior governments are Crete and Sparta, oligarchy, democracy,
    and tyranny, with tyranny called the fourth and worst disorder of a State.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says governments vary as human dispositions vary, because States
    are made from the human natures within them rather than from “oak and rock.”
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The proposed method is to examine the State first and then the corresponding
    individual character, ending with the city of tyranny and the tyrant’s soul.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Political changes are said to originate in divisions within the actual governing
