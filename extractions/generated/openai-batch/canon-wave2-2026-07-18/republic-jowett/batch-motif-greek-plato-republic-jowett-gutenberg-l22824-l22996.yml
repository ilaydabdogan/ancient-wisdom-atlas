canonical_text:
  quote: ''
  summary: 'The passage argues that reason-guided desires yield truer pleasures, while
    tyrannical desires are farthest from true pleasure. It calculates the king as
    vastly superior to the tyrant in pleasure, then proposes a visual image of the
    soul: a many-headed beast, a lion, and a man joined into one form and covered
    by a human exterior, with explicit analogy to composite creatures of ancient mythology.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The spirited or passionate element is described as being in the same case
    when a passionate man acts from envy, ambition, violence, contention, anger, or
    discontent without reason or sense.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lovers of money and honour are said to have the truest pleasures attainable
    to them when they pursue pleasure under the guidance and company of reason and
    knowledge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the whole soul follows the philosophical principle and has no division,
    its several parts are said to be just, to do their own business, and to enjoy
    their best and truest pleasures.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: When either of the other two principles prevails, it compels the rest of the
    soul to pursue a shadow-like pleasure that is not their own.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Lustful and tyrannical desires are placed at the greatest distance from reason,
    while royal and orderly desires are placed nearest to reason.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The tyrant is said to live at the greatest distance from true or natural pleasure,
    while the king is said to live at the least distance from it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The tyrant is described as having run away from the region of law and reason
    and as dwelling with slave pleasures described as his satellites.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: A numerical comparison states that the king lives 729 times more pleasantly
    than the tyrant, and that the tyrant is more painfully situated by the same interval.
  category: other
  evidence_refs:
  - ev:3
- id: obs:9
  text: The good and just man is said to be superior to the evil and unjust man in
    pleasure, and immeasurably greater in propriety of life, beauty, and virtue.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The speaker proposes making an image of the soul so that an opponent's words
    may be presented before his eyes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The proposed soul-image is compared to composite creations of ancient mythology,
    with Chimera, Scylla, and Cerberus named as examples of beings in which multiple
    natures grow into one.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The first modeled form is a multitudinous many-headed monster with heads of
    tame and wild beasts, able to generate and metamorphose them at will.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: A second form is made like a lion, and a third form is made like a man; the
    lion is smaller than the first form, and the man is smaller than the lion.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The three forms are joined so that they grow into one, and the outside is
    fashioned into a single human image so that an observer who cannot look within
    believes it to be one human creature.
  category: action
  evidence_refs:
  - ev:7
