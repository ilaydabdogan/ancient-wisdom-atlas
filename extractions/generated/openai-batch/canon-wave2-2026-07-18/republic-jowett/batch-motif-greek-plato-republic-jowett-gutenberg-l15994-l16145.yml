canonical_text:
  quote: ''
  summary: The passage describes proposed regulations for marriage, offspring, and
    kinship among the guardians; argues that the best State is unified by shared pleasures
    and pains; compares the State to a body that feels injury in one part; and distinguishes
    the titles used by rulers, subjects, and guardians in the proposed State from
    those used in other States.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a specified age, men and women may range at will, but lineal ascendant
    and descendant marriages are prohibited, and any embryo from such unions is to
    be prevented from seeing the light; if born, the offspring is not to be maintained.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Children born in the seventh or tenth month after the hymeneal are assigned
    kinship terms: male children are called sons, female children daughters, and the
    bridegroom is called father.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Children begotten at the same time are called brothers and sisters and are
    generally prohibited from intermarrying.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Marriage between brothers and sisters is allowed if the lot favours them and
    they receive the sanction of the Pythian oracle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The guardians of the State are said to have their wives and families in common.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The argument asks what the legislator’s chief aim should be in lawmaking and
    State organization, especially what counts as the greatest good and greatest evil.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Discord, distraction, and plurality where unity ought to reign are identified
    as the greatest evil, while the bond of unity is identified as the greatest good.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Unity is described as a community of pleasures and pains in which all citizens
    are glad or grieved on the same occasions.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A State is described as disorganized when one half triumphs and the other
    half grieves over the same events.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Differences in States are said to originate in disagreement about the terms
    ‘mine,’ ‘not mine,’ ‘his,’ and ‘not his.’
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The best-ordered State is described as one in which the greatest number of
    persons apply ‘mine’ and ‘not mine’ to the same things in the same way.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: 'The individual body is used as an analogy: when a finger is hurt, the whole
    frame feels the hurt and sympathizes with the affected part.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: In a well-ordered State, when any citizen experiences good or evil, the whole
    State makes the case its own and rejoices or sorrows with that citizen.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The State under discussion has rulers and subjects, and all call one another
    citizens.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: In the proposed State, the people call the rulers saviours and helpers, and
    the rulers call the people maintainers and foster-fathers.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: In other States, rulers are generally called masters, democratic States call
    them rulers, and rulers call the people slaves.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: Guardians would not speak of another guardian as a stranger, because each
    person they meet is regarded by kinship terms such as brother, sister, father,
    mother, son, daughter, child, or parent.
  category: relationship
  evidence_refs:
  - ev:9
