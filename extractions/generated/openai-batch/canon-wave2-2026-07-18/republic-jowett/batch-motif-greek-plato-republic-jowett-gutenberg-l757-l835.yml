canonical_text:
  quote: "‘Listen,’ he says, ‘my answer is that might is right, justice the interest
    of the stronger: now praise me.’"
  summary: 'The passage analyzes early definitions of justice, sets aside poetic authority
    through dialectic, compares a moral question in Plato with a Persian mystic saying
    and a Christian precept of forgiveness, and summarizes Thrasymachus’ challenge
    to Socrates: justice is the interest of the stronger, rulers make laws for themselves,
    and large-scale injustice is more profitable than justice.'
  language: English
  quote_policy: quoted
