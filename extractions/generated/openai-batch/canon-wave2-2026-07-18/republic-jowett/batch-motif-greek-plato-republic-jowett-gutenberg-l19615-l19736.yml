canonical_text:
  quote: ''
  summary: The speaker distinguishes rational knowledge of being and the unseen from
    sensory study of visible heavens or heard harmonies. He argues that astronomy
    should use the visible heavens only as a pattern for higher mathematical inquiry,
    and that harmony likewise should seek numerical principles rather than merely
    compare audible notes. The Pythagoreans are cited for calling astronomy and harmony
    sister sciences, but are also criticized for not reaching the natural harmonies
    of number.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says only knowledge of being and the unseen can make the soul
    look upwards; sensory seeking, whether directed at heavens, ground, water, or
    land, is described as the soul looking downwards.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The starry heaven is described as visible and beautiful, but inferior to true
    motions, true number, and true figure, which are apprehended by reason and intelligence
    rather than sight.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The spangled heavens are to be used as a pattern for higher knowledge and
    are compared to excellently made figures or pictures by Daedalus or another great
    artist.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A true astronomer is said to regard heaven and its contents as framed by their
    Creator in the most perfect manner, while denying that visible material proportions
    are eternal and without deviation.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker says astronomy should employ problems and leave the heavens alone
    if it is to make reason useful.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker says motion has many forms and identifies a second study as counterpart
    to the study already named.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The second study is related to the ears and harmonious motions as the first
    is related to the eyes and stars; the studies are called sister sciences by the
    Pythagoreans.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Teachers of harmony are described as comparing heard sounds and consonances,
    placing their ears close to strings, disputing intervals, and setting ears before
    understanding.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The speaker describes some investigators as teasing and torturing strings,
    and says the Pythagoreans investigate the numbers of heard harmonies but do not
    reach the natural harmonies of number.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The pursuit described is called useful if sought with a view to the beautiful
    and good, but useless if pursued in another spirit.
  category: attribute
  evidence_refs:
  - ev:9
