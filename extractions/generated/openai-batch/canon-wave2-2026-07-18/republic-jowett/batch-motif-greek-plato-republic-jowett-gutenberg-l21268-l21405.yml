canonical_text:
  quote: ''
  summary: 'The passage describes a young man whose soul is overtaken by vain conceits,
    appetites, and personified vices, while virtues and counsel are excluded. He becomes
    the democratic man, living without fixed order among many pleasures. The argument
    then turns to democracy: its excessive love of freedom is said to lead toward
    tyranny, limitless liberty, and anarchy entering households and even animals.'
  language: English
  quote_policy: summarized
