canonical_text:
  quote: true love is a love of beauty and order—temperate and harmonious
  summary: Socrates discusses the education of guardians through music and gymnastic.
    Musical education requires recognition of virtue and vice in their forms and images;
    true love is linked to beauty, order, temperance, and restraint. Gymnastic training
    is then described as lifelong bodily discipline directed by a trained soul, with
    guardians expected to avoid intoxication, luxury, and fragile athletic habits.
    Homeric campaigning heroes are cited as a model for simple soldierly fare.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Musical education for the speakers and the guardians depends on knowing the
    essential forms of temperance, courage, liberality, magnificence, their kindred
    forms, and their contrary forms, and on recognizing their images in small and
    great things.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A beautiful soul harmonizing with a beautiful form and cast in one mould is
    described as the fairest sight for one who can see it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man with the spirit of harmony is said to love the loveliest and not to
    love an inharmonious soul; a merely bodily defect may be tolerated.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pleasure is said to deprive a man of the use of his faculties as pain does,
    to have no affinity to temperance or virtue, and to have affinity with wantonness
    and intemperance.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: True love is defined as love of beauty and order, temperate and harmonious,
    and intemperate or mad pleasure is excluded from lover and beloved.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A proposed law for the city limits a friend's familiarity with his love to
    what a father would use toward a son, only for a noble purpose and with consent;
    going further is treated as coarseness and bad taste.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Music is said to end in the love of beauty, and gymnastic is introduced as
    the next training for the youth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Gymnastic, like music, should begin in early years, be careful, and continue
    through life.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The good soul is said to improve the body as far as possible, rather than
    bodily excellence improving the soul; care of the body is entrusted to the adequately
    trained mind.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Guardians must abstain from intoxication, because a guardian who is drunk
    and requires another guardian is treated as ridiculous.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The guardians' food is discussed as part of training for the great contest.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: The bodily habit of ordinary athletes is called sleepy and perilous to health;
    such athletes are said to sleep away their lives and become dangerously ill if
    they depart from their customary regimen.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Warrior athletes are to be like wakeful dogs, seeing and hearing keenly and
    enduring changes of water and food, summer heat, and winter cold on campaign without
    breaking down in health.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: Excellent gymnastic is called the twin sister of simple music, and military
    gymnastic is described as simple and good.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: 'Homer is cited as feeding campaigning heroes on soldiers'' fare: no fish
    though they are by the Hellespont, no boiled meats, and only roast food that requires
    lighting a fire rather than carrying pots and pans.'
  category: object
  evidence_refs:
  - ev:11
- id: obs:16
  text: Sweet sauces are said to be absent from Homer and avoided by professional
    athletes; Syracusan dinners, Sicilian cookery, a Corinthian girl as fair friend,
    and Athenian confectionery are rejected and compared to panharmonic melody and
    song with all rhythms.
  category: speech
  evidence_refs:
