  summary: 'The passage gives educational counsel for a later-life Platonic pursuit
    of knowledge, then discusses ancient views of political history: mutability, fate
    and chance, Golden Age hopes, recurring cycles of civilization, destruction and
    preservation after deluge, ancient monuments, and the sacral authority of the
    founding legislator and unchanging laws.'
