canonical_text:
  quote: "“imitations, beginning in early youth ... grow into habits and become a
    second nature”"
  summary: Socrates explains the difference between imitation and simple narration,
    illustrates it by rewriting a Homeric scene involving Chryses, Agamemnon, and
    Apollo, classifies poetic genres by their use of imitation, and argues that guardians
    should imitate only virtuous characters because repeated imitation shapes character.
  language: English
  quote_policy: quoted
