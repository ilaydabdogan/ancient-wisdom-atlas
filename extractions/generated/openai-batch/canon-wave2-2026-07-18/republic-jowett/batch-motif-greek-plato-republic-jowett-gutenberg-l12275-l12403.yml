    for the god.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Agamemnon is described as angry, ordering the priest to depart, and saying
    that the daughter of Chryses will not be released.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The old man leaves in fear and silence, calls upon Apollo, recalls services
