canonical_text:
  quote: "“Mortal souls, behold a new cycle of life and mortality. Your genius will
    not be allotted to you, but you will choose your genius”"
  summary: Er and other spirits arrive before Lachesis. A prophet or Interpreter arranges
    them, announces that mortal souls will choose their next lives and associated
    genius according to lots, and lays out many samples of lives. The passage then
    emphasizes the peril of choosing wrongly and urges discernment of good and evil,
    justice, truth, and the mean as the way of happiness in life and after death.
  language: English
  quote_policy: quoted
