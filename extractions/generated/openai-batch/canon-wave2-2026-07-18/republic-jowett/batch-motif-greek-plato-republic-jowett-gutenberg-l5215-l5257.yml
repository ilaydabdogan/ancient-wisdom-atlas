canonical_text:
  quote: ''
  summary: The passage contrasts the unjust, tyrannical person who rules others but
    not himself with the just self-mastered person, then presents a second proof based
    on three kinds of pleasure corresponding to reason, passion, and desire. It argues
    that the philosopher, guided by reason and experienced in the other pleasures,
    can judge that rational pleasure is highest, followed by ambition and then money-making.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A miserable public ruler is described as master of others while not master
    of himself, unsatisfied in desire, fearful, and distracted.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Command is said to worsen the ruler’s jealous, hateful, faithless, envious,
    and unrighteous temper, making him a misery to himself and others.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A proclamation states that the best and justest man is happiest and is the
    most royal master of himself, while the unjust man is the greatest tyrant of himself
    and of his State.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The assertion is extended to the condition of being seen or unseen by gods
    or men.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The second proof divides pleasure according to three elements of the soul:
    reason, passion, and desire.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Desire includes avarice and sensual appetite; passion includes ambition, party-feeling,
    and love of reputation; reason is directed to truth and is careless of money and
    reputation.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The money-maker praises wealth, the ambitious man praises honour, and the
    philosopher regards the fruition of truth as the only genuinely good pleasure.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Experience and knowledge are named as the criterion for judging the pleasures,
    and the philosopher is said to have the widest experience and truest knowledge.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The rational life is ranked as the pleasantest, the life of ambition second,
    and the life of money-making third.
  category: sequence
  evidence_refs:
  - ev:6
