  summary: In Book III of the dialogue, the speaker argues that stories told to the
    young guardians must be regulated. Terrifying depictions of Hades, shades, and
    lamentations by heroes or gods are to be removed because they may make future
    warriors fear death, imitate grief, and lack self-control.
  language: English
  quote_policy: summarized
