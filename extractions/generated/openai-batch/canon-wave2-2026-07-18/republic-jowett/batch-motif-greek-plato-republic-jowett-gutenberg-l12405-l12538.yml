canonical_text:
  quote: "“one man plays one part only”"
  summary: The dialogue distinguishes acceptable and unacceptable forms of imitation
    in poetry and narration for the State. Good speakers may imitate virtuous persons
    sparingly, while bad or pantomimic performers imitate many voices, gestures, animals,
    sounds, and instruments. The speakers prefer a simple style that imitates virtue
    and reject manifold imitation as unsuitable to a State where each person has a
    single function. A versatile poet is honored but sent away, while a rougher and
    severer storyteller is retained for the education of soldiers and the health of
    souls.
  language: English
  quote_policy: quoted
