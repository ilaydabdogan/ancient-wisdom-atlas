canonical_text:
  quote: ''
  summary: Socrates and an interlocutor discuss the educational order and purpose
    of mathematical sciences. Geometry is valued because it turns the soul toward
    being, truth, and the idea of good, rather than merely serving practical ends.
    Astronomy and solid geometry are placed in a corrected curriculum, with emphasis
    on the soul’s inner sight and on state support for neglected studies. The interlocutor
    praises astronomy as leading the soul upward, while Socrates questions that formulation.
  language: English
  quote_policy: summarized
