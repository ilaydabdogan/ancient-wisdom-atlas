  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The speaker corrects the order of studies: after plane geometry should come
    solid geometry, concerned with cubes and depth, before astronomy as the motion
    of solids.'
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
