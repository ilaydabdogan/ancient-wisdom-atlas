- id: obs:1
  text: The speaker asks whether the more advanced part of geometry helps make the
    vision of the idea of good easier by compelling the soul to turn its gaze toward
    the place of full being.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The discussion distinguishes geometry that compels a view of being from geometry
    concerned only with becoming.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says ordinary geometricians speak in practical terms such as squaring,
    extending, and applying, while the real object of the science is knowledge.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker and respondent agree that geometry aims at knowledge of the eternal
    rather than of what is perishing and transient.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker says geometry draws the soul toward truth, creates the spirit
    of philosophy, and raises up what has been allowed to fall down.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker says the inhabitants and youth of the city should learn geometry,
