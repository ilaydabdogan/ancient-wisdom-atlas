canonical_text:
  quote: the true ruler is not meant by nature to regard his own interest, but that
    of his subjects
  summary: Socrates argues by analogy from specialized arts that offices and governments
    properly serve those over whom they preside, not their own advantage. He distinguishes
    the pay received by practitioners from the proper goods of their arts, explains
    why good men may rule only under necessity, and returns to the question whether
    the just or unjust life is more advantageous.
  language: English
  quote_policy: quoted
