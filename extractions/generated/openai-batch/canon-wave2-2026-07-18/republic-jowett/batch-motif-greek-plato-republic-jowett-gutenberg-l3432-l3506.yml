canonical_text:
  quote: ''
  summary: 'The passage analyzes Plato''s account of philosophers and higher natures:
    philosophers are useless because society does not use them; exceptional natures
    may be corrupted by public opinion, politics, institutions, or adverse surroundings;
    false philosophy can occupy the vacant place of true philosophy; and the sixth
    book turns toward a longer method, a heavenly pattern of the state, and divisions
    of knowledge and soul.'
  language: English
  quote_policy: summarized
