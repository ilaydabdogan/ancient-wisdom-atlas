    proposed community of wives and children. It presents doubts about examining the
    bases of social life, describes Plato's ideal as replacing private family interests
    with universal brotherhood and race-improving selection, and contrasts this with
    modern and Christian valuation of vulnerable persons, the image of God, and family
    morality.
