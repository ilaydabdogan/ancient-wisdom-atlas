canonical_text:
  quote: ''
  summary: 'The passage interprets Plato''s cave allegory as both political and philosophical.
    The cave or den is treated as the narrow lower sphere of politics and law, while
    light and the upper world are associated with eternal ideas and the good. Those
    who return from the upper world are at first ineffective and persecuted among
    the den''s inhabitants, but later perceive lower things more accurately. The passage
    distinguishes two disorders of vision: one from moving out of darkness into day,
    and another from descending from higher light into the den for others'' benefit.
    It then applies these patterns to modern politicians, theorists, professionals,
    and people altered by inward illumination.'
