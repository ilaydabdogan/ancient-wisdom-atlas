    of justice apart from reputation or external rewards. It contrasts Glaucon’s argument
    with Thrasymachus’s, compares such arguments to theories grounding right in power
    or self-interest, discusses the mixed good and evil in human nature, and explains
    Plato’s dramatic presentation of Socrates under interrogation about justice, happiness,
    and ideals.
