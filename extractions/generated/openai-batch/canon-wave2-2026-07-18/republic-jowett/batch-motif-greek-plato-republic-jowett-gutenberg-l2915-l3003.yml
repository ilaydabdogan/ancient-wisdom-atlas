canonical_text:
  quote: ''
  summary: Jowett's introductory analysis summarizes the argument that the ideal just
    state remains a valid model even if not fully realized, and that cities will not
    cease from ill until kings become philosophers or philosophers become kings. The
    passage distinguishes true philosophers, who know abstract realities, from lovers
    of sights and sounds, who remain with opinion, dreamlike perception, and ambiguous
    objects between being and not-being. It then describes Book V as a new beginning
    moving toward community of property and family and the kingdom of philosophers,
    structured by the image of successive waves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ideal polity is said to have been formed in the search for justice, with
    the just man corresponding to the just State.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says an ideal may retain value even if no reality fully realizes
    it, and that possible changes might approximate the ideal State.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'A proposed change is called the great wave: kings must become philosophers
    or philosophers must become kings for cities and the human race to cease from
    ill.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Socrates is imagined as being attacked by the world with sticks and stones
    for the hard saying, and he is urged to prepare an answer.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The philosopher is described as a lover of knowledge in every form and is
    contrasted with indiscriminate lovers and lovers of sights and sounds.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Those who recognize abstract ideas such as justice, beauty, good, and evil
    are called philosophers; those limited to sounds and colors are said to lack the
    waking vision of absolute realities.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Knowledge, ignorance, and opinion are distinguished by their objects: being,
    not-being, and an intermediate that both is and is not.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ambiguous objects of sense are described as moving disorderly between being
    and not-being, and the person confined to them is called a lover of opinion rather
    than a philosopher.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Book V is described as a new beginning that maintains community of property
    and family and transitions to the kingdom of philosophers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The image of first, second, third, and greatest waves is said to provide a
    scheme or plan for the book and to accompany the reception of Plato's proposals.
  category: sequence
  evidence_refs:
  - ev:7
