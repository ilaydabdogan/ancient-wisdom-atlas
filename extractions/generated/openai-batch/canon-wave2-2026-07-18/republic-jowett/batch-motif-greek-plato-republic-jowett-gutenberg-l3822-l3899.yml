  quote: ''
  summary: 'The passage analyzes the education of rulers: philosophy is presented
    as a conversion of the soul from darkness and becoming toward light and being.
    Arithmetic and geometry are described as disciplines that raise the mind beyond
    sensory confusion toward abstract truth, true being, and the idea of good, while
    also having lesser military uses.'
