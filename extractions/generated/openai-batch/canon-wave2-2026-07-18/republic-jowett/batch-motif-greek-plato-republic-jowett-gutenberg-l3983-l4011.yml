  summary: A dialogue turns from prelude to the nature and paths of dialectic. The
    speaker says Glaucon cannot follow without prior scientific discipline, describes
    dialectic as rising above hypotheses and leading the soul from ignorance to upper-world
    light, lists grades of cognition, and concludes that future rulers must be trained
    in dialectical question and answer.
