canonical_text:
  quote: ''
  summary: The passage argues that poets should not tell or repeat stories in which
    gods or divine-lineage heroes commit evil acts, because such tales corrupt the
    young. It rejects particular accusations against Achilles, Theseus, and Peirithous,
    defers rules about stories of ordinary men until justice has been defined, and
    then turns from poetic subject matter to poetic style, distinguishing narration
    from imitation through an example from Homeric epic.
  language: English
  quote_policy: summarized
