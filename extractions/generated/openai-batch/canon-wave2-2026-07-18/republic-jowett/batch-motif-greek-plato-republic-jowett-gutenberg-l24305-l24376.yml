canonical_text:
  quote: ''
  summary: 'The speaker introduces the tale of Er, who dies in battle, remains undecayed,
    returns to life on his funeral pile, and reports what his soul saw in the other
    world: judges, paired openings of earth and heaven, postmortem paths, rewards
    and punishments, returning souls in a meadow, and the punishment of Ardiaeus and
    other grave sinners.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker introduces the account as a hero tale about Er and distinguishes
    it from tales told by Odysseus to Alcinous.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Er, son of Armenius and Pamphylian by birth, is slain in battle; after ten
    days his body is found unaffected by decay, and on the twelfth day he returns
    to life on the funeral pile.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Er says that when his soul left the body he journeyed with a great company
    to a mysterious place with two openings in the earth and two openings in heaven.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Judges sit in the intermediate space; after judgment, the just are commanded
    to ascend by the heavenly way on the right, and the unjust to descend by the lower
    way on the left.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The judged carry sentences and symbols of deeds, with the just bearing them
    in front and the unjust bearing them on their backs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Er is told that he is to be a messenger carrying the report of the other world
    to men and is instructed to hear and see what is there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Er observes souls departing through openings after sentence, while other souls
    ascend from earth dusty and worn or descend from heaven clean and bright.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Arriving souls go into a meadow, encamp as at a festival, embrace acquaintances,
    and converse about the realms above and beneath.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Souls from below remember a thousand-year journey beneath the earth with sorrow,
    while souls from above describe heavenly delights and visions of beauty.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: For wrongs done, souls suffer tenfold over a thousand years; rewards for beneficence,
    justice, and holiness are in the same proportion.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage mentions additional retributions for piety and impiety toward
    gods and parents, and for murderers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: One spirit asks about Ardiaeus the Great, and another says he will not come;
    Ardiaeus is described as a former tyrant who murdered his aged father and elder
    brother and committed other crimes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: At the mouth of a cavern, Ardiaeus and other tyrants or great criminals attempt
    to return to the upper world, but the mouth roars when incurable or insufficiently
    punished sinners try to ascend.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Wild men of fiery aspect seize the blocked sinners; Ardiaeus and others are
    bound, thrown down, scourged, dragged along the road, carded on thorns, and announced
    as being taken to hell.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The souls fear hearing the roaring voice; when there is silence, they ascend
    one by one with great joy.
  category: sequence
  evidence_refs:
  - ev:10
