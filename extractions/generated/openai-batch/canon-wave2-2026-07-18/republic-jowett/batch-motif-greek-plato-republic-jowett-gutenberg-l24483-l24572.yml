canonical_text:
  quote: ''
  summary: A messenger from the other world reports how souls choose their next lives,
    have their choices ratified by divine figures associated with destiny, drink from
    a river that causes forgetfulness, and are sent upward to birth. The passage ends
    with moral counsel to pursue justice, virtue, and wisdom during the soul’s long
    pilgrimage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prophet announces that even the last chooser can have a happy existence
    if he chooses wisely and lives diligently, and warns the first chooser not to
    be careless.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first chooser selects the greatest tyranny without fully considering it,
    later laments when he sees its evils, and blames chance and the gods rather than
    himself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some souls coming from heaven are described as inexperienced in suffering
    and as having virtue by habit rather than philosophy, while pilgrims from earth
    have suffered and are slower to choose.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The messenger reports that philosophy and good fortune in the lot can make
    the journey to another life and back smooth and heavenly rather than rough and
    underground.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The souls’ choices are often based on memories of previous lives, including
    named souls choosing bird, animal, human, or private lives.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men pass into animals, and tame and wild animals change into one another and
    into corresponding human natures.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After choosing, each soul goes to Lachesis, receives the genius chosen as
    guardian and fulfiller of the choice, and is led to Clotho and Atropos.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Clotho draws the souls within the revolution of the spindle, Atropos makes
    the threads irreversible, and the souls pass beneath the throne of Necessity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The souls travel in scorching heat to a barren plain of Forgetfulness, encamp
    by the river of Unmindfulness, drink its water, and forget all things; those not
    saved by wisdom drink more than necessary.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At midnight, a thunderstorm and earthquake occur, and the souls are driven
    upward toward birth like shooting stars.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The messenger is prevented from drinking the water, cannot explain how he
    returned to the body, and awakens on a pyre.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The closing counsel urges obedience to the tale, passage safely over the river
    of Forgetfulness, and continued pursuit of justice and virtue because the soul
    is immortal.
  category: speech
  evidence_refs:
  - ev:6
