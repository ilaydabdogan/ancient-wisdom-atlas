- id: obs:3
  text: Lamentation and sorrowful strains are rejected; the mixed or tenor Lydian,
    full-toned or bass Lydian, and similar harmonies are named as expressive of sorrow
    and are to be banished.
  category: action
  evidence_refs:
  - ev:3
