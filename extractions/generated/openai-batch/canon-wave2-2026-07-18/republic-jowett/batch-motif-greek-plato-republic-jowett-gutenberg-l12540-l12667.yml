  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Only the lyre and harp are left for use in the city, while shepherds may have
    a pipe in the country.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage explicitly describes the musical preference as preferring Apollo
    and his instruments to Marsyas and his instruments.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The speakers describe their musical restrictions as purging the State that
