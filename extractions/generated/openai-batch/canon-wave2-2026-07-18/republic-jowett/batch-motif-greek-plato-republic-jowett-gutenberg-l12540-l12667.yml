canonical_text:
  quote: ''
  summary: A dialogue passage argues that song has words, melody, and rhythm; that
    melody and rhythm should follow the words; that sorrowful, relaxed, drunken, or
    overly complex harmonies and instruments should be excluded from the ideal city;
    and that Dorian and Phrygian harmonies, simple instruments, and suitable rhythms
    should be retained because they express courage, temperance, and a harmonious
    life. The passage also names Apollo and Marsyas as contrasting references for
    preferred and rejected instruments, and describes the process as purging the luxurious
    State.
  language: English
  quote_policy: summarized
