canonical_text:
  quote: ''
  summary: The passage explains an image of the soul as a hidden composite of a many-headed
    beast, a lion, and a man. Justice strengthens the human and rational element,
    allies it with the lion-like spirited element, and restrains the many-headed monster;
    injustice feeds the beast and starves the man. The passage argues that selling
    or degrading the nobler, diviner part of oneself for wealth is worse than Eriphyle
    selling her husband’s life for a necklace. It connects vices with the release
    or distortion of beast, lion, serpent, and monkey-like elements, and ends by describing
    a person who orders body, wealth, honor, and political life according to the heavenly
    pattern of the ideal city.
  language: English
  quote_policy: summarized
