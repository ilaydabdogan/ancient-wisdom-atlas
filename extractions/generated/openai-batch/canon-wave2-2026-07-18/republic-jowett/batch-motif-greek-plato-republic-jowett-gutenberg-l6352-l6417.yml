canonical_text:
  quote: ''
  summary: 'Jowett''s analysis describes many features of Plato''s ideal Hellenic
    State as Spartan in inspiration or correspondence: military training, prohibition
    of precious metals, common meals, state control over private life, communal tendencies,
    regulation of marriage and women’s education, censorship of poetry and music,
    elder councils, and military moderation. The passage also describes the ideal
    State''s first decline as reverting to a Spartan type and notes Athenian admiration
    for Lacedaemon as part of a wider longing for imagined simplicity.'
  language: English
  quote_policy: summarized
