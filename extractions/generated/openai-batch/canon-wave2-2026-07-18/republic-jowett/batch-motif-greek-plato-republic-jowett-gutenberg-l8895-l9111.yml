canonical_text:
  quote: ''
  summary: Socrates and Polemarchus examine whether justice means giving each what
    is owed or proper, especially doing good to friends and harm to enemies. Through
    analogies with crafts, deposits, safekeeping, and theft, Socrates draws a paradoxical
    conclusion that the just keeper would also be a thief, then invokes Homeric Autolycus.
    The exchange turns to whether friends and enemies are truly or only apparently
    good or evil, and Polemarchus rejects the implication that it is just to injure
    those who do no wrong.
  language: English
  quote_policy: summarized
