  summary: The passage considers whether private property and current wealth distribution
    are historically contingent rather than final. It imagines future social arrangements
    in which property is more public, common, and directed toward the culture and
    benefit of all. It contrasts the practical statesman’s skepticism with the philosopher’s
    ability to imagine common property becoming fixed in a society, summarizes Aristotelian
    objections to Plato’s community of property, and suggests that organized and enlightened
    masses might pursue the common interest.
