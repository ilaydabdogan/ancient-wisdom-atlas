canonical_text:
  quote: ''
  summary: Glaucon reopens the discussion with Socrates after Thrasymachus’ withdrawal.
    He asks how justice should be classified among goods, challenges Socrates to praise
    justice for its own sake, and states a common account in which laws and mutual
    covenants arise as a compromise among people who have experienced both doing and
    suffering injustice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The discussion appears to have ended, but Glaucon reopens it because he is
    dissatisfied with Thrasymachus’ retirement.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Glaucon asks Socrates whether he wishes really to persuade them, or only to
    seem to have persuaded them, that justice is always better than injustice.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Glaucon distinguishes three classes of goods: those welcomed for their own
    sake, those desirable both in themselves and for their results, and those pursued
    only for reward or result despite being disagreeable.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Socrates places justice in the highest class of goods, desired both for itself
    and for its results.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Glaucon says many people place justice in the troublesome class, pursued for
    rewards and reputation but considered disagreeable in itself.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Glaucon says Thrasymachus seems to have been charmed by Socrates’ voice like
    a snake.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Glaucon asks to consider justice and injustice apart from rewards and results,
    asking what they are in themselves and how they work in the soul.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Glaucon proposes to revive Thrasymachus’ argument by discussing the nature
    and origin of justice, the unwilling practice of justice, and the claim that the
    unjust life is better than the just life.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the common account reported by Glaucon, doing injustice is called naturally
    good, suffering injustice evil, and the evil of suffering injustice greater than
    the good of doing it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the same account, people who have experienced both doing and suffering
    injustice agree among themselves to have neither, giving rise to laws and mutual
    covenants.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The account defines justice as a mean or compromise between doing injustice
    without punishment and suffering injustice without power of retaliation.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The account says justice is tolerated not as a good but as a lesser evil,
    honored because people lack the ability to do injustice without restraint.
  category: speech
  evidence_refs:
  - ev:9
