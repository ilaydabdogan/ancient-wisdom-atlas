canonical_text:
  quote: ''
  summary: 'The passage prescribes honors for brave soldiers, including affectionate
    privileges, reproductive privileges, Homeric-style food honors, hymns, and precedence
    at sacrifices. It then discusses the glorification and burial of those who die
    nobly, invoking Hesiodic language about the golden race and guardian beings. It
    also sets rules for Hellenic warfare: Hellenes should not enslave Hellenes, plunder
    corpses, prevent burial, offer kin-spoils at temples, devastate Hellenic territory,
    or burn houses. The passage distinguishes external war against barbarians from
    internal Hellenic discord and frames Hellas as a shared kin-land with common temples.'
  language: English
  quote_policy: summarized
