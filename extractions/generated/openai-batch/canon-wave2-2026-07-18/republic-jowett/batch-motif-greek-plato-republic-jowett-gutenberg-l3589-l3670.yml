canonical_text:
  quote: There is a truth, one and self-existent, to which by the help of a ladder
    let down from above, the human intelligence may ascend.
  summary: The passage analyzes Plato’s divided line, the relation of shadows, images,
    sense objects, numbers, ideas, understanding, reason, and the Idea of good. It
    explains the Good through images of a ladder of ascent, the sun, light, and a
    highest principle. It also lists features of Book VI, including Socrates’ hesitating
    method, Glaucon’s limited understanding, Socrates’ internal prohibitory sign,
    divine preservation of good, a future state of discussion, and several figures
    for the philosopher, public opinion, and philosophy personified.
  language: English
  quote_policy: quoted
