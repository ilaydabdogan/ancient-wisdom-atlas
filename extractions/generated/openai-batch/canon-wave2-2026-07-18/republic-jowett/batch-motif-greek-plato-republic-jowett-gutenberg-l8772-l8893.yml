canonical_text:
  quote: "“the tales of a world below and the punishment which is exacted there of
    deeds done here”"
  summary: Socrates questions Cephalus about wealth, old age, inherited and acquired
    fortune, and justice. Cephalus says wealth can help a good person face death without
    fear of underworld punishment, unpaid offerings to gods, or unpaid debts to men.
    Socrates challenges the definition of justice as truth-telling and debt repayment
    by using the example of returning deposited arms to a friend who is not in his
    right mind. Cephalus leaves to attend sacrifices, and Polemarchus continues the
    discussion by citing Simonides on repayment of debts.
  language: English
  quote_policy: quoted
