canonical_text:
  quote: ''
  summary: Glaucon presents the Ring of Gyges story and uses it to argue that people
    practice justice from necessity rather than choice. Gyges descends into an earthquake
    opening, takes a gold ring from a superhuman corpse inside a hollow bronze horse,
    discovers it grants invisibility, and uses it to seduce the queen, kill the king,
    and seize power. The passage then contrasts hypothetical perfectly just and unjust
    persons, separating being just from appearing just, so that judgment can be made
    about which life is happier.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The argument proposes giving both just and unjust persons power to do what
    they will in order to observe where desire and self-interest lead them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says people are diverted into the path of justice by the force
    of law.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gyges is described as a shepherd serving the king of Lydia; a storm and earthquake
    open the earth where he is feeding his flock.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gyges descends into the opening, sees a hollow brazen horse with doors, and
    finds inside a more-than-human dead body wearing a gold ring.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Gyges takes the ring from the dead body and reascends.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the shepherds' assembly, turning the ring's collet inward makes Gyges invisible,
    while turning it outward makes him reappear; he tests this repeatedly.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Gyges arranges to be sent to court, seduces the queen, conspires with her
    against the king, kills the king, and takes the kingdom.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The two-ring hypothetical says that neither a just nor an unjust person would
    remain steadfast in justice if invisibility made transgression safe.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The passage lists possible acts under impunity: taking property, entering
    houses, lying with anyone, killing or releasing prisoners, and becoming like a
    god among men.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The argument concludes that where someone thinks he can safely be unjust,
    he is unjust, because injustice is believed more profitable to the individual
    than justice.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: An invisible person who did no wrong would be considered foolish by observers,
    although they would praise him publicly from fear of suffering injustice themselves.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: To judge the just and unjust lives, the passage proposes isolating a perfectly
    unjust man and a perfectly just man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The perfectly unjust man is imagined as committing unjust acts while maintaining
    the greatest reputation for justice and recovering from exposure through speech,
    force, courage, strength, money, and friends.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: The perfectly just man is imagined as noble and simple, wishing to be rather
    than seem good, clothed only in justice, thought worst while being best, and remaining
    so until death.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: After the two extremes of justice and injustice are established, the passage
    asks which of the two is happier.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: The narrating speaker tells Glaucon that he has polished the two figures for
    decision as if they were two statues.
  category: speech
  evidence_refs:
  - ev:8
