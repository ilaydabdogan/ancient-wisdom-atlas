canonical_text:
  quote: ''
  summary: The passage summarizes the rise and conduct of a tyrant, including false
    beneficence, war, taxation, purges, bodyguards, temple-robbery, and a metaphor
    of the tyrant as a violent son of the people. It then comments on Plato’s account
    of declining constitutions, the obscure first decline from the ideal state, and
    timocracy as an honor-loving, Spartan-like military government.
  language: English
