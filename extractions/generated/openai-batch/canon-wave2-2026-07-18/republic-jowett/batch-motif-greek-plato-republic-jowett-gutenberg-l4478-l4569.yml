canonical_text:
  quote: two nations are struggling together in one—the rich and the poor
  summary: The passage analyzes oligarchy as a divided state ruled by wealth, describes
    the oligarchical man as inwardly ruled by avarice, explains democracy as arising
    from conflict between rich and poor, and characterizes democracy as free, varied,
    lawless, and indiscriminately equalizing.
  language: English
