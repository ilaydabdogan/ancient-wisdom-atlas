canonical_text:
  quote: "“the spirit of contention and ambition”"
  summary: 'The speaker describes a timocratic state and the corresponding timocratic
    character: secretive money-love, honor-love, obedience to authority, military
    self-assertion, and inner conflict caused by household and civic influences that
    weaken rational education. The passage ends by turning toward oligarchy.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Men of the described stamp are said to long secretly for gold and silver and
    to hoard them in dark private places, magazines, treasuries, and castles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: They are described as miserly because they cannot openly acquire the money
    they prize, and as spending another person's resources on pleasures while evading
    the law, which is likened to a father.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: They are said to have neglected the true Muse, companion of reason and philosophy,
    and to have honored gymnastic more than music.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The described form of government is called a mixture of good and evil, with
    contention and ambition predominating because of the passionate or spirited element.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The corresponding man is described as self-assertive, less cultivated, a friend
    of culture, a good listener but not a speaker, rough with slaves, courteous to
    freemen, and obedient to authority.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The corresponding man loves power and honor, claims rulership because he is
    a soldier with feats of arms, and loves gymnastic exercises and the chase.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The timocratic youth is said to despise riches when young but to be increasingly
    attracted to them as he ages because of an avaricious element and the loss of
    his best guardian.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Philosophy tempered with music is named as the guardian that takes up abode
    in a person and saves virtue throughout life.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The origin of the timocratic youth is described as the son of a brave father
    dwelling in an ill-governed city, where the father avoids honors, offices, litigation,
    and exerting his rights.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The mother complains to the son that his father lacks a government place,
    gives her no precedence among women, is not eager about money, avoids conflict
    in courts and assembly, is indifferent to her, and is only half a man and too
    easy-going.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Old servants privately tell the son to retaliate against people who wrong
    his father and to be more of a man; public examples teach that those who mind
    their own business are despised and busy-bodies are honored.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'The youth is drawn in opposite ways: the father waters and nourishes the
    rational principle, while others encourage the passionate and appetitive; under
    joint influence he gives the inner kingdom to the middle principle and becomes
    arrogant and ambitious.'
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage marks completion of the second form of government and second character
    type, then begins the transition to oligarchy.
  category: sequence
  evidence_refs:
  - ev:10
