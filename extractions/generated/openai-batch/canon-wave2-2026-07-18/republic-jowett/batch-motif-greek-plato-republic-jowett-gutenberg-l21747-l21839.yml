canonical_text:
  quote: ''
  summary: 'Socrates and his interlocutor discuss tyranny: tragic poets are described
    as praising tyrants, a tyrant maintains companions and an army by confiscating
    sacred treasures and private fortunes, and the people are compared to a father
    who discovers that the tyrant-son he fostered has become violent and enslaving.
    The passage concludes that excessive liberty passes into the harshest slavery.'
  language: English
  quote_policy: summarized
