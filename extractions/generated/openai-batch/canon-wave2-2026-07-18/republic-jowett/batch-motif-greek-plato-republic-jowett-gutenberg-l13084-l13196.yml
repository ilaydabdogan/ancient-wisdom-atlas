canonical_text:
  quote: ''
  summary: Socrates argues that excessive care of the body obstructs virtue, study,
    and public duties. He presents Asclepius as a public-minded healer who cured generally
    healthy people with definite ailments but did not prolong useless lives; cites
    the sons of Asclepius treating wounded warriors at Troy; rejects a poetic report
    that Asclepius, son of Apollo, accepted a bribe to heal a dying rich man and was
    struck by lightning; and distinguishes the expertise required of physicians from
    that required of judges.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Excessive care of the body beyond gymnastic discipline is described as hostile
    to virtue, study, thought, and self-reflection.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Asclepius is described as curing generally healthy persons who had a definite
    ailment, using purges and operations and allowing them to live as usual.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Asclepius is described as refusing gradual treatments for bodies diseased
    through and through, on the ground that such cures would not benefit the person
    or the State.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sons of Asclepius are described as heroic healers at the siege of Troy
    who treated Menelaus' wound after Pandarus wounded him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The same healers are said not to prescribe detailed diet or drink afterward
    and not to treat unhealthy and intemperate subjects.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tragedians and Pindar are said to report both that Asclepius was the son of
    Apollo and that he was bribed to heal a rich dying man, for which he was struck
    by lightning; Socrates refuses to accept both claims together.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Physicians are said to cure the body with the mind and to benefit from experience
    of bodily disease, while a sick mind is said to be unable to cure.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The judge is said to govern mind by mind and should learn evil through long
    observation of others rather than through personal contamination.
  category: attribute
  evidence_refs:
  - ev:7
