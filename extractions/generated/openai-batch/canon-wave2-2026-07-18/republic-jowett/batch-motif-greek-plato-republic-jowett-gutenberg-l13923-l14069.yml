canonical_text:
  quote: ''
  summary: Socrates and Adeimantus discuss how lawless amusement can spread into customs,
    contracts, laws, and constitutions; how early education in music and orderly play
    can form virtuous citizens; why good people need few detailed laws; and why constant
    legal tinkering in ill-ordered states resembles invalids seeking remedies without
    self-restraint and reformers cutting off hydra heads.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A spirit of licence is described as beginning in amusement, entering manners
    and customs, moving into contracts, laws, and constitutions, and ending in an
    overthrow of private and public rights.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speakers state that youth should be trained from the first in a stricter
    system because lawless amusements make youths lawless and prevent them from becoming
    well-conducted and virtuous citizens.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A good beginning in play and music is said to produce a habit of good order
    that accompanies people in their actions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The habit of order is said to be a principle of growth and able to raise fallen
    places in the State.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Examples of lesser rules include silence before elders, standing and making
    elders sit, honouring parents, garments, shoes, hair, deportment, and manners.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The speakers say that precise written enactments about manners are unlikely
    to be lasting and that the direction in which education starts a person determines
    future life.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: The passage lists possible laws about the agora, dealings between people,
    artisans, injury, juries, dues, markets, police, and harbours, then says good
    men can find necessary regulations for themselves.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Socrates says the laws already given need God to preserve them; Adeimantus
    adds that without divine help people keep making and mending their laws and lives
    in hope of perfection.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: People who keep making and mending laws are compared to invalids without self-restraint
    who do not abandon intemperate habits.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The invalids are described as doctoring themselves, increasing and complicating
    disorders, and expecting cure from remedies advised by others.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A truthful adviser says eating, drinking, wenching, and idling must be given
    up, and that drug, cautery, spell, amulet, or other remedy will not avail without
    that change.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Ill-ordered States are described as forbidding citizens, under pain of death,
    to alter the constitution while praising those who flatter and gratify the regime
    as great statesmen.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Some ministers of political corruption are said to be deluded by the applause
    of the multitude into believing that they are statesmen.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: A man who cannot measure is said to be likely to believe many others who cannot
    measure when they declare that he is four cubits high.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Paltry reformers are said to think legislation will end frauds in contracts
    and similar wrongs, while actually cutting off the heads of a hydra.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The true legislator is said not to trouble himself with this class of enactments;
    in an ill-ordered state they are useless, and in a well-ordered state they naturally
    arise from previous regulations.
  category: speech
  evidence_refs:
  - ev:7
