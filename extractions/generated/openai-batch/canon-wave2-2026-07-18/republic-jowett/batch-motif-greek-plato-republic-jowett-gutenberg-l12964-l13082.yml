canonical_text:
  quote: ''
  summary: The passage argues that simple education and training produce temperance
    and health, while complexity, intemperance, litigation, and indulgent medical
    care reveal a badly ordered state and person. It contrasts contemporary medicine
    with the reputed older practice of Asclepius and Homeric healers, criticizes Herodicus
    for prolonging illness, compares a working carpenter’s limited use of medicine
    with the idle rich, and cites Phocylides on livelihood and virtue.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Complexity is said to engender license and disease, while simplicity in music
    is called the parent of temperance in the soul and simplicity in gymnastic the
    parent of health in the body.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When intemperance and diseases multiply in a state, halls of justice and medicine
    are described as opening and attracting attention from slaves and freemen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker calls it a sign of bad education when people claiming liberal
    education need first-rate physicians and judges and surrender themselves to other
    men as lords and judges.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A further stage of disgrace is described as a person spending life in courts
    as plaintiff or defendant and taking pride in litigious and dishonest maneuvering.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker distinguishes medical help for wounds or epidemics from medical
    dependence caused by indolence and habits of life.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Indolent people are described as filling their bodies with waters and winds,
    as if their bodies were a marsh, leading the sons of Asclepius to name diseases
    such as flatulence and catarrh.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage recalls that the wounded hero Eurypylus in Homer drinks Pramnian
    wine with barley-meal and grated cheese, and that the sons of Asclepius at Troy
    do not blame the giver of the drink or rebuke Patroclus.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Herodicus is described as a sickly trainer who combined training and doctoring,
    tended his mortal disease, lived as a valetudinarian, and struggled on to old
    age.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The speaker says Asclepius did not teach valetudinarian arts because in well-ordered
    states each individual has an occupation and no leisure to be continually ill.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A carpenter who is ill is said to ask for a rough cure, reject elaborate dietetics
    because he has no time to be ill, and then either recover and work or die without
    further trouble.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The rich man is contrasted with the worker as having no specially appointed
    work, and Phocylides is cited as saying that once a man has a livelihood he should
    practise virtue.
  category: speech
  evidence_refs:
  - ev:9
