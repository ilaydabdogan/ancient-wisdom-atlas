  summary: The passage argues that potential guardians must combine steadfast courage
    with aptitude for learning. Such aspirants must be tested through dangers, pleasures,
    and many kinds of knowledge, take a longer intellectual route, and grasp the idea
    of good, without which virtues and statecraft are not truly known.
  language: English
  quote_policy: summarized
