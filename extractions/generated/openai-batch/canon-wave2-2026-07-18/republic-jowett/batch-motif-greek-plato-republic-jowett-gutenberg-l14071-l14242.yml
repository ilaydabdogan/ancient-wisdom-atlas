canonical_text:
  quote: He is the god who sits in the centre, on the navel of the earth
  summary: 'The dialogue assigns sacred ordinances to Apollo of Delphi, then turns
    to a search for justice in the ideal city by identifying its four virtues: wisdom,
    courage, temperance, and justice. Wisdom is located in the guardians’ knowledge
    of the whole city, and courage in the fighting part’s preservation of educated
    beliefs about what is and is not to be feared.'
  language: English
  quote_policy: quoted
