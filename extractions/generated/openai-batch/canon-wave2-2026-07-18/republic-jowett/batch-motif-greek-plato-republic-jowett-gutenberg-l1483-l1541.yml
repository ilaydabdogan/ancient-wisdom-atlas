canonical_text:
  quote: The lie in the soul is a true lie
  summary: The passage analyzes Plato's rejection of allegorical mythology, the coexistence
    and later philosophical reinterpretation of Greek religion, and a distinction
    between a grave inner falsehood called the lie in the soul and lesser verbal falsehoods
    sometimes useful to humans.
  language: English
  quote_policy: quoted
