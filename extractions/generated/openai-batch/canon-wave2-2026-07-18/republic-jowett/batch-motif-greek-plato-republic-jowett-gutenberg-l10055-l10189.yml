canonical_text:
  quote: ''
  summary: A dialogue sequence argues that the just person is wise and good while
    the unjust person is evil and ignorant. The speakers then test whether injustice
    can make states or groups powerful, concluding that injustice produces division,
    hatred, fighting, sedition, and self-enmity, while justice produces harmony and
    friendship. The passage ends by granting that the gods are just, making the unjust
    enemies of the gods and the just their friends.
  language: English
  quote_policy: summarized
