canonical_text:
  quote: ''
  summary: 'The passage presents and interprets a parable of a ship: an impaired captain
    is overpowered by sailors who want the helm though they lack seamanship, while
    the true pilot who observes winds and stars is mocked. The passage identifies
    the true pilot with the philosopher and the mutinous sailors with politicians
    who make the philosopher appear useless. It also describes the philosopher as
    loving truth and contemplating the absolute, while noting the corruption of some
    professed philosophers.'
  language: English
  quote_policy: summarized
