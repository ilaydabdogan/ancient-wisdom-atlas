canonical_text:
  quote: ''
  summary: The passage lists the dialogue’s persons and setting, then opens Book I
    with Socrates narrating his visit with Glaucon to the Piraeus for prayers and
    a festival of Bendis. Polemarchus and others stop them from returning to the city
    and invite them to stay for a night festival and horseback torch-race. At Polemarchus’s
    house they meet Cephalus, who has been sacrificing and speaks with Socrates about
    old age, bodily pleasures, conversation, temperament, and freedom from passions.
  language: English
