canonical_text:
  quote: your dog is a true philosopher.
  summary: The speakers use the behavior of well-bred dogs to define the guardian's
    combined gentleness, spirit, and love of wisdom. They then turn to the education
    of guardians through music, literature, and gymnastics; propose censoring children's
    tales; and criticize Homeric and Hesiodic stories that misrepresent gods and heroes,
    especially stories about Uranus, Cronus, and Cronus' son, which should be silenced
    or restricted to a few mystery hearers with an extraordinary sacrifice.
  language: English
  quote_policy: quoted
