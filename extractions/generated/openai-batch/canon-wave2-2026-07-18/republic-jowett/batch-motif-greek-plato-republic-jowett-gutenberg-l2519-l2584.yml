canonical_text:
  quote: virtue is the health and beauty and well-being of the soul, and vice is the
    disease and weakness and deformity of the soul.
  summary: The passage summarizes Plato's argument that virtues in the state and in
    the individual soul correspond. It describes reason ruling over inferior passions,
    justice as each part doing its own work and binding the soul harmoniously, injustice
    as disorder and disease, and a later logical discussion distinguishing reason,
    anger, and desire.
  language: English
