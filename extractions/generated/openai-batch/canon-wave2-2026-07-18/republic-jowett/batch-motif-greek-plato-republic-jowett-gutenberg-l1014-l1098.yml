canonical_text:
  quote: Appearance is master of truth and lord of happiness.
  summary: The passage summarizes arguments that justice is a compact made by those
    too weak to commit injustice, imagines invisibility rings like Gyges' ring as
    a test of justice, contrasts the socially successful unjust man with the persecuted
    just man, and reports Adeimantus' account of poetic and ritual teachings that
    promise rewards, afterlife pleasures, punishments, and expiations. A hypothetical
    youth concludes that seeming virtuous while practicing injustice may be advantageous
    if divine penalties can be appeased.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Justice is described as a compact made by sufferers who cannot also be doers
    of injustice, so that they will have neither doing nor suffering injustice.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The just and unjust are imagined as having rings like Gyges' ring that make
    them invisible; the argument says no difference would appear between them because
    everyone would do evil if able.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ideal unjust man is described as skilled, wealthy, eloquent, strong, highly
    reputed, able to rule, marry, trade, aid friends, harm enemies, and worship the
    gods with wealth gained dishonestly.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ideal just man is described as noble and simple, being rather than seeming
    just, without reward, thought to be the worst, and subjected to scourging, racking,
    binding, blinding, and impalement.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Adeimantus says people are taught to be just for rewards, reputation, wealthy
    marriages, and high offices.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Homer and Hesiod are cited as picturing fat sheep, heavy fleeces, rich corn-fields,
    and fruiting trees that gods provide in this life for the just.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Orphic poets are said to add an afterlife picture in which heroes of Musaeus
    and Eumolpus recline on couches at a festival with garlands and immortal drunkenness
    as virtue's reward.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The wicked are said to be buried in a slough and made to carry water in a
    sieve.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mendicant prophets are said to offer atonement for sins through sacrifices,
    festive games, charms, and invocations, and to promise release of souls from purgatory
    while appealing to books ascribed to Musaeus and Orpheus.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A hypothetical youth reasons that he should turn to appearance, put on a show
    of virtue, use deceit, and rely on sacrifices or atoning powers for divine or
    afterlife consequences.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The concluding argument says that more than human virtue is needed to save
    a person and that one praises justice only when incapable of injustice.
  category: speech
  evidence_refs:
  - ev:7
