canonical_text:
  quote: The excess of liberty, whether in States or individuals, seems only to pass
    into excess of slavery.
  summary: 'The speaker describes a democratic society in which family, civic, educational,
    servile, gender, and even human-animal hierarchies are leveled by liberty. He
    argues that excessive liberty produces tyranny and slavery, then analyzes democracy
    through a drone metaphor: idle spendthrifts, wealthy persons who yield wealth
    like honey, and working people led by figures who redistribute property and accuse
    the rich.'
  language: English
  quote_policy: quoted
