canonical_text:
  quote: ''
  summary: Socrates and Glaucon discuss the banishment of imitative poetry from the
    well-ordered State, the conditional possibility of poetry defending itself and
    returning, the danger of poetic seduction to justice and virtue, and the beginning
    of an argument that the soul is immortal because its own evils corrupt but do
    not dissolve it.
  language: English
  quote_policy: summarized
