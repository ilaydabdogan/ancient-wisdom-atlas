canonical_text:
  quote: ''
  summary: The passage analyzes Plato's Republic as a synthesis of Athenian freedom,
    Spartan or Dorian discipline, Hellenic tradition, and Pythagorean institutional
    and intellectual models. It notes the myth of earth-born men, the four ages of
    the world, the Pythagorean way of life, music, number, transmigration, and the
    music of the spheres. It also describes the ideal State as impossible in ordinary
    reality, retained as a pattern or vision, and conditionally linked to a king's
    son becoming a philosopher.
