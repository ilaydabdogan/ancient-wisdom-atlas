canonical_text:
  quote: ''
  summary: The speaker describes philosopher-legislators remaking the State as if
    clearing and repainting a tablet, using absolute justice, beauty, and temperance
    as models for human life. The passage argues that philosophers must rule for the
    State to be realized, that royal-born philosophers or a single obedient city under
    one ruler could make the ideal polity possible, and that future rulers must be
    tested, educated, and selected as rare philosopher-guardians.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The State and the manners of men are compared to a tablet whose existing picture
    is rubbed out to leave a clean surface before any laws are inscribed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After producing the clean surface, the constitution-makers proceed to trace
    an outline of the constitution.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: While filling in the constitution, the constitution-makers look both to absolute
    justice, beauty, and temperance and to the human copy, mixing elements of life
    into an image of a man.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The image of a man is conceived according to another image which Homer is
    said to call the form and likeness of God.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The constitution-makers erase one feature and put in another until human ways
    are made, as far as possible, agreeable to the ways of God.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The philosopher is characterized as a lover of truth and being, akin to the
    highest good, and capable of becoming perfectly good and wise under favorable
    circumstances.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that States and individuals will have no rest from evil
    until philosophers rule, and that the imaginary State will not be realized otherwise.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The speaker says that sons of kings or princes may be philosophers by nature
    and need not all inevitably be destroyed.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: A single man with a city obedient to his will could bring the ideal polity
    into existence, and a ruler may impose the described laws if citizens are willing
    to obey.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The enactment of the proposed laws is described as difficult but not impossible.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The remaining question concerns how, by what studies and pursuits, and at
    what ages the saviours of the constitution are to be created.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Potential rulers are to be lovers of their country and are to be tested by
    pleasures, pains, hardships, dangers, and other critical moments; those who fail
    are rejected, while those who remain pure are made rulers and rewarded in life
    and after death.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The argument is personified as having turned aside and veiled her face to
    avoid the question that has now arisen.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The speaker states that the perfect guardian must be a philosopher and that
    the essential gifts rarely grow together.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: Quick intelligence, memory, sagacity, cleverness, high spirit, and magnanimity
    are described as qualities that do not often combine in an orderly and settled
    person; such persons may be driven by impulses and lose solid principle.
  category: attribute
  evidence_refs:
  - ev:12
