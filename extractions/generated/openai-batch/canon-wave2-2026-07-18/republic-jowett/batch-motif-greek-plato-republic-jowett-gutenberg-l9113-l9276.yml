canonical_text:
  quote: he came at us like a wild beast, seeking to devour us
  summary: Socrates and Polemarchus revise the definition of friend and enemy, argue
    that injuring anyone makes them worse and therefore cannot be just, reject the
    maxim that justice means helping friends and harming enemies, and are interrupted
    by Thrasymachus, who attacks Socrates' method and demands a clear answer about
    justice.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: 'Polemarchus proposes correcting the terms friend and enemy: a true friend
    is one who both seems good and is good; one who only seems good only seems to
    be a friend.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Socrates asks whether the just person ought to injure anyone, and Polemarchus
    answers that the just person ought to injure wicked enemies.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The argument states that injured horses, dogs, and humans are deteriorated
    in the qualities proper to each, and that injured humans become worse in human
    virtue, identified as justice.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Socrates argues by analogy that a musician cannot make people unmusical by
    music, a horseman cannot make people bad horsemen by horsemanship, heat cannot
    produce cold, drought cannot produce moisture, and the good cannot harm anyone.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Socrates and Polemarchus conclude that injuring another person is not the
    act of a just person and that the definition of justice as repayment of good to
    friends and evil to enemies is not true.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Socrates says he and Polemarchus are prepared to take up arms against attributing
    the rejected saying to Simonides, Bias, Pittacus, or another wise man or seer;
    he suggests instead that a rich and powerful man may have first said it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Thrasymachus repeatedly tries to take control of the argument, waits through
    the discussion, and after a pause comes at Socrates and Polemarchus like a wild
    beast seeking to devour them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Thrasymachus roars at the company, calls the discussion folly, demands that
    Socrates both ask and answer, and rejects answers such as duty, advantage, profit,
    gain, or interest unless there is clearness and accuracy.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Socrates says he is trembling and compares the inquiry into justice to searching
    for gold, calling justice more precious than many pieces of gold.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Thrasymachus replies with a bitter laugh and accuses Socrates of irony and
    of avoiding an answer.
  category: speech
  evidence_refs:
  - ev:7
