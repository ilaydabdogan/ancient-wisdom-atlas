canonical_text:
  quote: ''
  summary: 'The passage contrasts two modern ideals: the future of humanity in this
    world and the future of the individual in another world. It then discusses how
    hopes may be surrendered to the will of God, how divine realities are described
    through similitudes or negations, and how the Christian divine man/Saviour is
    related to the Church, the human heart, Plato''s ''likeness of God,'' and the
    Idea of Good.'
  language: English
  quote_policy: summarized
