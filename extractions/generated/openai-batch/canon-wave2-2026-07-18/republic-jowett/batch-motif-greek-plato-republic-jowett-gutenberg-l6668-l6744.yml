canonical_text:
  quote: ''
  summary: The passage speculates on the accelerating progress of civilization through
    criticism, education, science, cooperation, and possible contact between East
    and West. It then summarizes Plato’s proposals concerning community of property,
    wives and children, and common education and occupations for men and women. It
    argues that Plato treats sex difference as limited to begetting and bearing children,
    compares human sexes with male and female animals, and contrasts Greek female
    ideals in goddesses and heroines with the limited social position of Athenian
    women and with Plato’s proposed ideal of female companionship in war, government,
    and training.
  language: English
  quote_policy: summarized
