  quote: '"Only our ancestral deity sitting upon the centre and navel of the earth"'
  summary: The passage first assigns the ordering of religion to Apollo of Delphi,
    described as the ancestral deity at the earth’s centre and navel. It then analyzes
    Plato’s priority of civic duty, right, truth, and the well-being of the State
    over individual happiness or utility, while acknowledging utility as a secondary
    principle. It extends the same issue to politics, describes the true leader as
    above ambition, and notes themes of the whole, harmony, limited state size, and
    humorous examples in the argument.
