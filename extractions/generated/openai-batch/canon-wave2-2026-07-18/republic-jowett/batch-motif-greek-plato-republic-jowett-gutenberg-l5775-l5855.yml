canonical_text:
  quote: ''
  summary: Souls journey to a bright cosmic column and the spindle of Necessity, where
    Sirens and the daughters of Necessity maintain celestial order. An interpreter,
    speaking for Lachesis, casts lots and presents many possible lives for mortal
    souls to choose, emphasizing responsibility for the choice. The passage then gives
    moral instruction about choosing wisely and describes examples of souls choosing
    new human or animal lives, including Orpheus, Ajax, Agamemnon, Thersites, and
    Odysseus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The souls of pilgrims resume a journey on the eighth day, travel four days
    to see a bright rainbow-like line of light, and after one more day reach it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bright column is described as binding the whole universe together and
    having ends fastened to heaven.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: From the column hangs the distaff of Necessity, with an adamant hook and spindle
    and a whorl made of nested parts on which heavenly bodies turn.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The heavenly whorls have differing sizes, colors, and motions, including an
    outer motion and inner circles moving in the opposite direction at different speeds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Siren stands hymning on each circle, while Lachesis, Clotho, and Atropos
    sit on thrones, sing of time, and guide the circles with their hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: An interpreter arranges the arriving souls, takes lots and samples of lives
    from Lachesis, and announces that mortal souls must choose lives and bear responsibility
    for the choice.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The interpreter casts lots and places many samples of lives before the souls,
    including human and animal lives, tyrannies, famous lives, and mixed lives involving
    wealth, poverty, sickness, and health.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that education should teach a person to refuse evil, choose
    good, consider the soul, avoid extremes, and choose with understanding.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The first soul to choose selects a tyranny, later discovers that it involves
    devouring his own children, laments, and blames chance and the gods rather than
    himself.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Several named souls choose or change into new lives or forms, including birds,
    a lion, an eagle, an athlete, a workwoman, a monkey, and a private man.
  category: action
  evidence_refs:
  - ev:8
