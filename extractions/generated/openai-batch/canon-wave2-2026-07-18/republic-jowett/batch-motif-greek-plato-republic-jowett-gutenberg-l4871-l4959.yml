literal_observations:
- id: obs:1
  text: The passage lists portraits of political character types, including the timocratical
    man, oligarchical man, democratic man, and tyrant.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The democratic man is described as marked by uncontrolled license and freedom
    and is represented under the image of a State with a citadel receiving embassies.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tyrant is associated with parricide, an obscene dream, extreme misery,
    and a wild-beast nature in the sequence of character types.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage describes drones of two kinds and a final image of a monster drone
    having wings.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: The 'number of the State' is presented as an obscure puzzle and is compared
    in obscurity with the Number of the Beast in the Book of Revelation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Plato's number is described as a 'solemn jest of the Muses,' with the passage
    suggesting satire on symbolic uses of number.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Aristotle is reported as saying that all things change in a cycle and that
    a base of numbers in the ratio 4:3, combined with a figure of five, gives two
    harmonies when the number becomes solid.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Pythagorean triangle is described through the numbers 3, 4, and 5, with
    the squares of the two lesser sides equaling the square of the hypotenuse.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: A perfect or cyclical number is called divine or perfect, while a human or
    imperfect number is said to have four terms and three intervals and to concern
    generations or births.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that the number of generations or births presides over
    them mysteriously, analogously to stars or to Pythagorean numerical figures assigned
    to opportunity, justice, and marriage.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The proposed explanation treats two harmonies as making 8000, associates 8000
    with Spartan citizens, and suggests that 400 could symbolize guardians while the
    larger oblong harmony could symbolize the people.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The numbers 3, 4, and 5 are said to refer possibly to orders in the State
    or parts of the soul, virtues, forms of government, the Pythagorean triangle,
    and intervals of the musical scale.
  category: relationship
  evidence_refs:
  - ev:5
