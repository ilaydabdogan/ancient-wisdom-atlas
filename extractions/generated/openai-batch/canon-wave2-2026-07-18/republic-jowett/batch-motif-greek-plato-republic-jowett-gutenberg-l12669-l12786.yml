canonical_text:
  quote: ''
  summary: Socrates argues that rhythm, harmony, style, and artistic images shape
    the temper of the soul. He proposes regulating poets and other artists so the
    guardians or youth encounter beautiful sights and sounds, and he compares trained
    discernment to recognizing alphabet letters and their reflections.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Socrates says Damon should be consulted about which rhythms express meanness,
    insolence, fury, other unworthiness, and opposite feelings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that grace or absence of grace follows good or bad rhythm,
    that rhythm and harmony follow words and style, and that style depends on the
    temper of the soul.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Beauty of style, harmony, grace, and good rhythm are said to depend on the
    true simplicity of a rightly and nobly ordered mind and character; youth are to
    aim at these graces and harmonies.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Painting, weaving, embroidery, architecture, manufacture, and animal and vegetable
    nature are described as having either grace or absence of grace; ugliness and
    discord are allied to ill words and ill nature, while grace and harmony are allied
    to goodness and virtue.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Socrates asks whether poets and other artists should be required to express
    the good and prohibited from showing vice, intemperance, meanness, and indecency,
    with nonconforming artists excluded from the State.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage contrasts guardians growing among images of moral deformity like
    a noxious pasture with youth dwelling in a land of health among fair sights and
    sounds, where beauty flows into eye and ear.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Musical training is described as potent because rhythm and harmony enter the
    inward places of the soul, impart grace, and enable the rightly educated person
    to perceive faults and receive the good before knowing the reason why.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Socrates compares trained recognition to learning alphabet letters in varied
    sizes and combinations and then recognizing their reflections in water or a mirror.
  category: sequence
  evidence_refs:
  - ev:6
