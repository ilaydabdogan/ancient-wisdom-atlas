canonical_text:
  quote: ''
  summary: 'In a dialogue, Socrates and an interlocutor discuss the guardian class:
    its happiness is to serve the whole state rather than private gain; guardian men
    and women are to share education, children, civic watching, hunting, and war;
    children are to observe war under guarded conditions, mounted on swift tractable
    horses so they can escape danger; cowardice and capture are assigned penalties;
    and a distinguished warrior is to receive crowns, the right hand of fellowship,
    and reciprocal kisses from youthful comrades.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker recalls an earlier charge that the guardians were being made unhappy
    because they had nothing, and answers that the state is being fashioned for the
    happiness of the whole rather than of one class.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says a guardian who tries to possess the whole state instead of
    remaining in a safe and harmonious life should learn the Hesiodic saying that
    half is more than the whole.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men and women are described as sharing a common way of life, including common
    education, common children, watching over citizens, going to war, keeping watch,
    and hunting together like dogs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Children who are strong enough are to go on expeditions with the guardians
    so that they may observe and help in the work they will later perform, like artisans'
    or potters' children observing their craft.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The presence of young ones is said to be an incentive to parental valour,
    while the interlocutor raises the danger that children and parents might both
    be lost in defeat.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The proposed first step is to make children spectators of war while securing
    them against danger by choosing safer expeditions and placing them under experienced
    veterans.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Children are metaphorically to be furnished with wings by being mounted on
    swift, tractable horses, so that they can see war and escape by following elder
    leaders if danger arises.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A soldier who leaves rank, throws away arms, or commits another act of cowardice
    is proposed to be degraded into the rank of husbandman or artisan.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A soldier who allows himself to be taken prisoner is proposed to be given
    to the enemies as their lawful prey.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'A hero who has distinguished himself is to receive honour from youthful comrades:
    each crowns him, he receives the right hand of fellowship, and he is to kiss and
    be kissed by them.'
  category: sequence
  evidence_refs:
  - ev:7
