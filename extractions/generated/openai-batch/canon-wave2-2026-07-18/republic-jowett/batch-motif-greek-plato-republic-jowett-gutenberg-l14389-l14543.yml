canonical_text:
  quote: ''
  summary: In dialogue, the first-person speaker distinguishes temperance from courage
    and wisdom, compares the search for justice to a hunt through a dark and perplexing
    wood, recognizes justice as a principle already present in the inquiry, and defines
    justice as each person or class doing its own proper work and not meddling in
    another's role.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Temperance is described as unlike courage and wisdom because it extends through
    the whole State and produces harmony among weaker, stronger, and middle groups
    concerning rule.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speakers state that three of four virtues have been found in the State,
    leaving justice as the remaining quality to identify.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first-person speaker addresses Glaucon and likens their search for justice
    to huntsmen surrounding cover so that justice does not escape.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Glaucon describes himself as a follower who can see only what the speaker
    shows him, and the speaker tells him to pray and follow.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The inquiry is described as having no path and taking place in a dark and
    perplexing wood, after which the speaker claims to perceive a track and expects
    the quarry not to escape.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker says that justice had been at their feet from the beginning and
    compares their error to looking for something already in their hands.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Justice is identified with the earlier principle that one person should practice
    one thing, the thing for which that person's nature is best adapted.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Justice is further described as doing one's own business and not being a busybody.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Justice is described as the remaining virtue when temperance, courage, and
    wisdom are abstracted, and as the cause, condition, and preservative of the other
    virtues.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The quality of each person doing their own work is said to be present across
    children, women, slaves, freemen, artisans, rulers, and subjects.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the legal analogy, suits are decided on the principle that a person should
    neither take what belongs to another nor be deprived of what is their own.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The speaker says that a carpenter doing a cobbler's work, or a cobbler doing
    a carpenter's work, would not greatly harm the State.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The speaker says that a trader forcing entry into the warrior class, a warrior
    entering the class of legislators and guardians, or one person combining trader,
    legislator, and warrior roles would ruin the State.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: The speaker concludes that, because there are three distinct classes, meddling
    or changing from one class into another is the greatest harm to the State and
    may be called evil-doing.
  category: relationship
  evidence_refs:
  - ev:11
