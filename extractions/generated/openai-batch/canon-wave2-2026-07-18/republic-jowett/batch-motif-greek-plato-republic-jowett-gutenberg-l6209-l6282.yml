canonical_text:
  quote: ''
  summary: 'The passage analyzes Plato''s argument for the soul''s immortality, then
    summarizes and compares the mythic vision of Er: an otherworld journey with a
    cosmic cylinder, spindle, Necessity, Fates, a column of light, planetary orbits,
    music of the spheres, and post-mortem retribution. It also notes possible comparisons
    with the Zend Avesta, Homer, and other Platonic cosmological or otherworld passages
    while cautioning against unsupported claims of Zoroastrian borrowing.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The immortality argument is described as resting on an absolute dualism of
    soul and body.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The soul is described as having vice as its own proper evil, yet not being
    destroyed by vice or by any other force in the argument.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says Plato also depicts the soul as able to be overgrown by earthy
    incrustations, losing its original form, and as affected by bodily or physical
    states.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The vision of another world is ascribed to Er, son of Armenius, and Clement
    of Alexandria is reported as saying Er was Zoroaster.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tale is described as having an oriental character and as comparable with
    pilgrimages of the soul in the Zend Avesta, while the passage says there is no
    evidence elsewhere in Plato for acquaintance with Zoroaster.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The vision's local arrangement is said to be less distinct than in the Phaedrus
    and Phaedo, with astronomy mingled with symbolism and mythology.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The great sphere of heaven is represented as a cylinder or box containing
    seven planetary orbits and the fixed stars.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The cylinder is suspended from an axis or spindle turning on the knees of
    Necessity; the Fates guide the revolutions, whose harmonious motion produces the
    music of the spheres.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The relationship between the spindle, chains, and column of light is described
    as uncertain; the column holds together the heaven, while the spindle is of adamant.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The column of light is interpreted in the passage as the imaginary axis of
    the earth rather than the Milky Way, and its comparison to a rainbow concerns
