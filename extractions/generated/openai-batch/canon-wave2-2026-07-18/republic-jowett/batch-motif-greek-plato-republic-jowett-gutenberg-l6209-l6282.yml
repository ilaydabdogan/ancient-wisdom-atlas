  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'The Republic''s heavenly picture is compared with the Timaeus: both distinguish
    fixed stars from planets and have heavenly bodies moving around the axis of the
    world, though details are uncertain.'
  category: relationship
  evidence_refs:
  - ev:6
