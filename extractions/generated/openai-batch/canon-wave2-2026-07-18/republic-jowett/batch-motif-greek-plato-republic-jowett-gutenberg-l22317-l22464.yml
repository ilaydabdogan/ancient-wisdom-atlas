canonical_text:
  quote: ''
  summary: 'Socrates and his interlocutor describe the tyrant as fearful, enslaved
    by desires, compelled to flatter servants and base people, unable to travel freely,
    and more miserable when he holds public power. They rank five types of men or
    constitutions by happiness and justice, placing the royal self-ruled person first
    and the tyrannical person last. They then begin a second proof from the tripartite
    soul, distinguishing learning, spirited anger, and appetite, with corresponding
    types: lovers of wisdom, honour, and gain.'
  language: English
  quote_policy: summarized
