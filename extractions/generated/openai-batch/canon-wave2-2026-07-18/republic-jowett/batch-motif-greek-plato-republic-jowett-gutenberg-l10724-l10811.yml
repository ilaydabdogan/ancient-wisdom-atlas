  quote: ''
  summary: A speaker challenges Socrates to show that justice is intrinsically better
    than injustice, not merely better in reputation, rewards, or honors. The speaker
    contrasts deceptive appearances with the true effects of justice and injustice
    in the soul. Socrates praises Glaucon and Adeimantus for arguing the case for
    injustice while remaining unconvinced, quotes a verse honoring their lineage,
    and says he must defend justice as best he can.
