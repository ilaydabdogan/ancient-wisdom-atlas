canonical_text:
  quote: ''
  summary: The speaker characterizes democracy as forgiving, varied, disorderly, and
    indiscriminately egalitarian, then analyzes how a democratic individual emerges
    from an oligarchical upbringing through competing necessary and unnecessary desires.
    The young man is drawn by pleasure-seeking companions and desires, experiences
    inner faction and conflict, sometimes regains order, but eventually fresh desires
    multiply, seize the citadel of his soul, and allow false conceits to replace true
    words and fair pursuits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Democracy is personified as forgiving, careless about trifles, disregarding
    previously established principles, and honoring anyone who professes to be the
    people's friend.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Democracy is described as a charming form of government, full of variety and
    disorder, dispensing a kind of equality to equals and unequals alike.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The individual democratic man is presented as arising from a miserly and oligarchical
    father who trained him in his own habits.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Necessary pleasures are defined as those that cannot be removed, whose satisfaction
    benefits a person, with simple food and health-related condiments given as examples.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Unnecessary desires are defined as desires that may be removed by training
    from youth, do no good or may do harm, and include luxurious foods and other pleasures
    beyond necessity.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A drone is described as someone surfeited with unnecessary pleasures and enslaved
    by unnecessary desires, while the person subject only to necessary desires is
    called miserly and oligarchical.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: A young man brought up in a vulgar and miserly way tastes drones' honey and
    associates with fierce and crafty natures who provide refinements and varieties
    of pleasure.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage compares the young man's change to a city in which like elements
    help like elements, with desires from outside assisting kindred desires within
    him.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: When a father or kindred advise or rebuke the young man, an oligarchical ally
    is said to aid him, producing faction, opposite faction, and war within his soul.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: At times the democratic principle gives way to the oligarchical, some desires
    die or are banished, reverence enters the young man's soul, and order is restored.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Fresh desires later spring up, become fierce and numerous because their father
    does not know how to educate them, draw the young man to old associates, and breed
    and multiply in him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The multiplied desires seize the citadel of the young man's soul when it lacks
    accomplishments, fair pursuits, and true words; false and boastful conceits and
    phrases then mount upward and take their place.
  category: sequence
  evidence_refs:
  - ev:12
