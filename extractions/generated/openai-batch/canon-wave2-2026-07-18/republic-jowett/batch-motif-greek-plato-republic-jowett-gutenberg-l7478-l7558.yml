  quote: Education is represented by him, not as the filling of a vessel, but as the
    turning the eye of the soul towards the light.
  summary: The passage summarizes Plato’s views on knowledge, virtue, education, and
    the reform of mythology. Education is described as eliciting what is already in
    the mind and orienting the soul toward light. Early education should use controlled
    stories and moral-religious principles, while inherited myths about gods, the
    underworld, and heroes should be reformed for the moral formation of youth.
  language: English
