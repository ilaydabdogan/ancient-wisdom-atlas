canonical_text:
  quote: ''
  summary: In Book VI, the speaker and Glaucon distinguish true philosophers from
    false or unphilosophical natures. The passage argues that those who grasp eternal
    truth, love knowledge, possess truthfulness, temperance, courage, justice, gentleness,
    pleasure in learning, and memory are fit to guard the laws and rule the State.
  language: English
  quote_policy: summarized
