  text: The speaker says the argument has brought true and false philosophers into
    view.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The speaker asks which of two classes should rule the State: those able to
    grasp the eternal and unchangeable, or those who wander among the many and variable.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The answer proposed is that the rulers or guardians should be those best able
    to guard the laws and institutions of the State.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage compares a guardian’s needed knowledge to having eyes, and compares
    lack of knowledge of true being and lack of a clear pattern to blindness.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Those who know the truth of each thing, while not lacking experience or virtue,
    are said to deserve first place unless they fail in some other respect.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker proposes to define the philosopher’s nature and says that only
    those in whom the required qualities are united should rule the State.
  category: speech
  evidence_refs:
  - ev:4
