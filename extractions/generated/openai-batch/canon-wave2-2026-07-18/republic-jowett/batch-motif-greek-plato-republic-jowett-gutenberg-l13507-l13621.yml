canonical_text:
  quote: formed and fed in the womb of the earth
  summary: 'The speaker proposes a civic fiction or royal lie: citizens are to be
    told that they were formed in the earth, which is their mother and nurse, and
    that God mixed different metals into different people to assign civic ranks. The
    tale includes an oracle warning that the State will be destroyed if a brass or
    iron man guards it. The passage then discusses arming the earth-born guardians,
    establishing their encampment and dwellings, sacrificing to the proper Gods, and
    preventing the auxiliaries from becoming predatory rulers over the citizens.'
  language: English
  quote_policy: quoted
