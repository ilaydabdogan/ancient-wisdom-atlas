canonical_text:
  quote: pleasures which are approved by the lover of wisdom and reason are the truest.
  summary: The passage compares three lives—the money-maker, lover of honour, and
    philosopher—by asking whose pleasures are most trustworthy. It argues that experience,
    wisdom, and reason qualify the philosopher to judge pleasure, ranks the philosophical
    life highest, and then analyzes pleasure, pain, and a neutral state of rest, denying
    that mere absence of pain is pleasure.
  language: English
  quote_policy: quoted
