canonical_text:
  quote: ''
  summary: The speaker argues that neither the uneducated nor those who never finish
    education are fit to govern. The founders must compel the best minds to ascend
    to knowledge of the good, then descend again among the prisoners in the den to
    share political labors. The passage describes philosopher-guardians as reluctant
    rulers, educated to see truly, and formed by a turning of the soul from darkness
    toward light and true being.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The uneducated and uninformed, and those who never end their education, are
    said to be unable ministers of State for different reasons.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The founders of the State are to compel the best minds to attain the greatest
    knowledge and continue ascending until they arrive at the good.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After ascent, the best minds are not to remain in the upper world; they must
    descend again among the prisoners in the den and share their labors and honors.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The legislator aims at happiness in the whole State rather than happiness
    for one class, binding citizens together by persuasion and necessity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The philosophers are described as brought into the world to be rulers of the
    hive, kings of themselves and the other citizens, and better educated for a double
    duty.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Each philosopher must go down to the general underground abode, acquire the
    habit of seeing in the dark, and recognize images and what they represent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Other States are described as places where men fight over shadows and struggle
    for power; the best State is said to be governed by those most reluctant to govern.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The pupils are allowed to spend much of their time together in heavenly light,
    but they must take office as a stern necessity.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Future rulers are to have a life better than political rule and to be rich
    in virtue and wisdom rather than silver and gold.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Those who govern should not be lovers of the task, because rival lovers of
    rule will fight.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The proposed production of guardians is framed as bringing them from darkness
    to light, compared in the passage to an ascent from the world below to the gods.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The process is distinguished from turning over an oyster-shell and is instead
    described as the turning round of a soul toward the true day of being.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The passage ends by proposing inquiry into the kind of knowledge that can
    effect this change.
  category: speech
  evidence_refs:
  - ev:12
