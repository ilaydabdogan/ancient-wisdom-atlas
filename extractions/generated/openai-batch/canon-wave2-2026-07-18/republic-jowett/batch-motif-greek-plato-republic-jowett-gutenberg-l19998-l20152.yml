canonical_text:
  quote: ''
  summary: 'The passage outlines a non-compulsory education for future rulers: early
    arithmetic, geometry, and other preparatory studies are to be taught as play;
    youth are tested through gymnastics, military exposure, lessons, and dangers;
    selected candidates are advanced at twenty and again at thirty to dialectic. The
    speaker warns that dialectic can produce lawlessness if introduced without caution,
    and explains this through an image of a son who discovers that his supposed parents
    are not his real parents and then turns toward flatterers. This image is applied
    to students whose inherited beliefs about justice and honor are refuted before
    they discover truth.'
  language: English
  quote_policy: summarized
