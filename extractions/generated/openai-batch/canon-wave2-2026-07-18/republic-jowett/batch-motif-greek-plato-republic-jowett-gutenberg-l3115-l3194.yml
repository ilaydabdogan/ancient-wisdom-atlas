canonical_text:
  quote: Let us bring her into the light of day
  summary: 'The passage analyzes why philosophy becomes disreputable: rare philosophic
    natures are corrupted by unsuitable social conditions, public opinion acts as
    a coercive teacher, gifted youths are flattered into ambition, and unworthy persons
    dishonor philosophy. A small remnant of genuine philosophers withdraws from corrupt
    public life, while philosophy is said to need a proper state in which to flourish.'
  language: English
  quote_policy: quoted
