  quote: ''
  summary: The passage contrasts philosophers and ordinary statesmen in political
    life, criticizes Plato’s analogy between state and individual and his blending
    of ethics with politics, discusses music as an image of harmony in life and the
    world, and presents Plato’s education as lifelong and extending to after-life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the philosopher tends to fail in routine political life,
    while the ordinary statesman tends to fail in extraordinary crises.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ordinary statesman in crisis is described as guided by old maxims and
    party prejudices, unable to perceive the signs of the times, and looking backward
    rather than forward.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old order is described as making a poor figure when confronted with the
    new, and political changes are described as often made blindly and convulsively.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fixed ideas of a reactionary statesman are compared to madness, growing
    upon him and excluding the judgment of others.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says Plato assimilates the state to the individual and fails to
    distinguish Ethics from Politics.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The will or character of a state or nation is described as a balance or surplus
