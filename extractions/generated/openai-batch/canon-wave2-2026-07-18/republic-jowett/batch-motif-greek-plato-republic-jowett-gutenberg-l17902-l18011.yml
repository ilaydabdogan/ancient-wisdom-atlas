  text: The small class has tasted philosophy as a sweet and blessed possession and
    has seen the madness of the multitude.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The philosopher is compared to a man fallen among wild beasts who neither
    joins others’ wickedness nor can singly resist them, and therefore keeps quiet
    and goes his own way.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The philosopher is compared to one who shelters behind a wall from a storm
    of dust and sleet driven by wind.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Adeimantus says the withdrawn philosopher will have done a great work before
    departing; the speaker replies that a greater work would be possible in a State
    suitable to him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The speaker says no existing government is adapted to the philosophic nature,
    and compares that nature to exotic seed sown in a foreign land and changed by
    new soil.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker says that if philosophy finds a State matching her own perfection,
    philosophy will be seen as truly divine while other things are human.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The speaker says the State would require a living authority with the same
    idea of the constitution that guided the legislator.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The remaining question is how the study of philosophy can be ordered so that
    it does not ruin the State; the speaker adds that great attempts are risky and
    that the good is hard.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Current students of philosophy are described as young, devoting only spare
