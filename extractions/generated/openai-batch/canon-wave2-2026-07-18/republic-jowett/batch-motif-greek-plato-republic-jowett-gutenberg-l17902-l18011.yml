canonical_text:
  quote: "“the worthy disciples of philosophy will be but a small remnant”"
  summary: The passage describes true philosophers as a rare remnant who withdraw
    from corrupt public life, compares them to a man among wild beasts and to one
    sheltering from a storm, argues that philosophy needs a suitable State and living
    constitutional authority, criticizes current shallow study of philosophy, invokes
    Heraclitus’ daily extinguished and relit sun, and proposes a life-course education
    of body and soul ending in happiness here and in another life.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker says that worthy disciples of philosophy are a small remnant and
    gives examples including an exile, a lofty soul in a mean city, gifted people
    who leave the arts, and people restrained as Theages was.
  category: relationship
  evidence_refs:
  - ev:1
