canonical_text:
  quote: "“Love is the lord of the house within him, and orders all the concerns of
    his soul.”"
  summary: The passage analyzes how the tyrannical man arises from the democratic
    character through uncontrolled unlawful appetites, corrupting influences, and
    a master passion identified with Love. It contrasts lawless appetites active when
    reason sleeps with temperate preparation for sleep in which reason is awakened
    and the irrational elements are pacified.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage introduces the tyrannical man as the remaining character to be
    examined, asking how he is formed from the democratic man and whether he lives
    happily or miserably.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Certain unnecessary pleasures and appetites are described as unlawful; in
    some people they are controlled by laws, reason, and better desires, while in
    others they are stronger and more numerous.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the reasoning, human, and ruling power is asleep, a wild beast within
    rises to satisfy desires and is said to be ready for any folly or crime.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A healthy and temperate person awakens rational powers before sleep, feeds
    them on noble thoughts and enquiries, moderates appetites, pacifies the passionate
    element, and so comes nearer to truth and is less subject to lawless visions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker states that in all people, even good people, there is a lawless
    wild-beast nature that peers out in sleep.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The democratic man is recalled as having been trained by a miserly parent,
    then influenced by refined and licentious people, and finally settling into moderate
    indulgence in various pleasures.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The democratic man’s son is imagined as being drawn by seducers into a lawless
    life called perfect liberty, while different parties support his moderate or opposing
    desires.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The seducers, called dire magicians and tyrant-makers, implant in the son
    a master passion to rule over idle and spendthrift lusts, imaged as a monstrous
    winged drone.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Other lusts are described as buzzing around the implanted drone-like nature,
    nourishing the sting of desire; the lord of the soul, with Madness as captain
    of his guard, removes better principles, purges temperance, and brings in madness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says that Love has of old been called a tyrant, and also says
    that a drunken or deranged man has the spirit or fantasy of a tyrant.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The tyrannical man is said to come into being when nature, habit, or both
