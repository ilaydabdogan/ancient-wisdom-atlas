canonical_text:
  quote: ''
  summary: Adeimantus objects that Socrates' guardians would be made miserable by
    lacking private wealth despite ruling the city. Socrates answers that the constitution
    aims at the good of the whole State, not one class, and argues for functional
    specialization, moderation in wealth, unity, disciplined guardianship, and education
    as the safeguard of law and order. He contrasts proper education with superficial
    legislation and compares failed reformers to patients who refuse to change their
    habits and to statesmen trying to cut off Hydra-like human rogueries at one blow.
  language: English
  quote_policy: summarized
