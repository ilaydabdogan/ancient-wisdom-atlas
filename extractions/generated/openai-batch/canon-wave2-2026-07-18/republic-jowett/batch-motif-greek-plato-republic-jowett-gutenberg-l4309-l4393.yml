  quote: They are like trees which have been frequently transplanted.
  summary: The passage analyzes Plato’s picture of youth unsettled by new ideas, distinguishes
    mathematician and dialectician, alludes to Palamedes, Agamemnon, and earthborn
    men, summarizes the perfect State, and introduces Book VIII’s sequence of constitutions
    and corresponding human natures.
  language: English
