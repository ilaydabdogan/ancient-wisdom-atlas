canonical_text:
  quote: ''
  summary: The passage defends the apparent uselessness of true philosophers by comparing
    them to expert pilots and physicians whom others fail to use. It describes the
    true philosopher as following Truth, seeking being rather than appearances, hating
    falsehood, and possessing virtues. It then explains how rare philosophic natures
    can be corrupted by their own qualities, external goods, and unsuitable conditions,
    using plant and seed imagery.
  language: English
  quote_policy: summarized
