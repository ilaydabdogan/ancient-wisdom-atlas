canonical_text:
  quote: Not pleasure and pain, but law and reason shall rule in our State.
  summary: The passage argues that poetry can excite and nourish passions, should
    be excluded from the ideal state unless it can prove its usefulness, and contrasts
    poetic pleasure with law, reason, justice, virtue, and the immortal soul. It then
    presents an argument that the soul is not destroyed by bodily or moral evils and
    closes with the image of the soul in its present condition as like the sea-god
    Glaucus, maimed and encrusted by the sea-world.
  language: English
  quote_policy: quoted
