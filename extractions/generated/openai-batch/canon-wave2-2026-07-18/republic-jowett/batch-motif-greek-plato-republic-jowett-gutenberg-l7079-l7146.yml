canonical_text:
  quote: All the children born in his state are foundlings.
  summary: The passage criticizes Plato's treatment of marriage and child-rearing
    in the ideal state, argues that family and mother-child bonds are necessary, compares
    Plato's use of Sparta as a model, defends exceptional individuals against state
    suppression, and frames population and marriage as a difficult social problem
    likened to a wound the state physician cannot safely treat.
