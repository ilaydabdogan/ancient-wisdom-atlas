canonical_text:
  quote: ''
  summary: The passage introduces Book V by showing Socrates pressed by several interlocutors
    to explain the proposed community of women and children. Socrates then argues
    that female guardians should share the same education and employments as male
    guardians, including music, gymnastics, and war, because sex difference alone
    does not determine civic function.
  language: English
