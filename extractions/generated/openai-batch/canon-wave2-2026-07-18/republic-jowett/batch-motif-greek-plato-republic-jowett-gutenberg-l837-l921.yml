canonical_text:
  quote: ''
  summary: The passage summarizes Socrates' continued examination of Thrasymachus
    on justice, rulership, gain, virtue, strength, and happiness. It presents arguments
    that rulers serve others rather than themselves, that injustice depends on a remnant
    of justice for collective action, and that justice is the soul's excellence by
    which happiness is attained. The exchange ends at the festival of Bendis with
    Socrates admitting that he still does not know what justice is.
  language: English
  quote_policy: summarized
