canonical_text:
  quote: ''
  summary: The passage compares later utopian works with Plato's Republic and related
    traditions. It discusses More's Utopia through Hythloday, the Utopians, satire,
    and a Republic image of the philosopher sheltering from a storm; Bacon's New Atlantis,
    especially Solomon's House and textual borrowings; and Campanella's City of the
    Sun, including communal family arrangements, wall-based education, public religion,
    confession, perpetual prayer, Trinity theology, solar imagery, and rejection of
    graven images.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hythloday is described as the hero of a discourse and is unwilling to become
    a minister of state because he expects to lose independence and not be heeded.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Utopians are said to be unable to understand the doctrine of Second Intentions
    and related scholastic logical rules.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Utopians are said to rank hunting as the lowest, vilest, and most abject
    part of butchery.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A philosopher from the Republic is described as standing out of the way under
    a wall until a storm of sleet and rain has passed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: More is said to remark that many precepts of Christ are more at variance with
    ordinary Christian lives than the discourse of Utopia.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The New Atlantis is described as a fragment, inferior to Utopia, ingenious
    but lacking creative fancy and credibility.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The governor of Solomon's House is given external state and a minutely described
    dress, and is also said to have a look of pity toward men.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Bacon is said to borrow several things from the Timaeus and to add thoughts
    and passages from the Hebrew Scriptures.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The City of the Sun is said to resemble Plato's Republic; its citizens have
    wives and children in common, and temporary marriages are arranged by magistrates.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The City of the Sun does not use Plato's system of lots but pairs selected
    male and female natures according to philosophical rules.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Infants are brought up by their mothers in public temples until age two, then
    committed to the State at the start of their third year.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Children in the City of the Sun are taught first from paintings of many kinds
    displayed on the city walls rather than from books.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The city has six interior circuits of walls and a seventh outer wall; the
    outer wall bears painted figures of legislators and philosophers, while the interior
