canonical_text:
  quote: ''
  summary: 'Book X opens with a dialogue about rejecting imitative poetry. The speaker
    argues that poetic imitation harms understanding unless its nature is known, says
    truth must be preferred even over Homer, and investigates imitation through examples
    of beds, tables, forms, craftsmen, a mirror that produces appearances, and the
    painter as an imitator. The passage culminates in a threefold hierarchy: the natural
    bed made by God, the particular bed made by the carpenter, and the painted bed
    made by the imitator.'
  language: English
  quote_policy: summarized
