canonical_text:
  quote: "“This and no other is the root from which a tyrant springs; when he first
    appears above ground he is a protector.”"
  summary: The dialogue explains how a popular champion or protector becomes a tyrant.
    It invokes an Arcadian tale of Lycaean Zeus in which tasting a human victim’s
    entrails leads to becoming a wolf, and applies this image to a leader who sheds
    civic and kin blood, requests a bodyguard, wages wars, purges good citizens, and
    relies on paid followers and freed slaves.
  language: English
  quote_policy: quoted
