canonical_text:
  quote: "“the child of the good whom the good begat in his own likeness”"
  summary: 'Socrates declines to define the Good directly and instead explains its
    offspring, the sun. He distinguishes visible many things from intelligible ideas,
    describes light as the bond enabling sight and visibility, and compares the sun’s
    relation to sight with the Good’s relation to mind and intelligible truth. The
    soul is likened to the eye: it understands when turned toward truth and being,
    but has unstable opinion when turned toward becoming and perishing.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Glaucon asks whether the supreme principle of the good is knowledge, pleasure,
    or different from either.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Socrates says he will not presently state the actual nature of the good, but
    will speak of the child of the good, which is likest it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dialogue distinguishes many beautiful and good things from absolute beauty
    and absolute good; the many are said to be seen but not known, while the ideas
    are known but not seen.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sight and visible color require a third nature, named light, for seeing and
    being seen.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Light is described as a noble bond linking sight and visibility.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sun is identified as the heavenly lord of light; it is not sight itself,
    but the author of sight and the source from which the eye’s power is dispensed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sun is called the child of the good, begotten in the good’s likeness,
    and placed in the visible world in relation to sight as the good is in the intellectual
    world in relation to mind.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Eyes see dimly and are nearly blind when directed toward objects lit only
    by moon and stars, but see clearly when directed toward objects on which the sun
    shines.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The soul is compared to the eye: when resting on what truth and being illuminate,
    it perceives and understands; when turned toward becoming and perishing, it has
    opinion only and lacks stable intelligence.'
  category: relationship
  evidence_refs:
  - ev:6
