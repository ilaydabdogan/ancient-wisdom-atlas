    be interested in realities rather than imitations.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Homer is questioned as to whether he benefited any state, aided a war, produced
    an invention, or founded a private way of life; the respondent says no such record
    is known.
  category: sequence
  evidence_refs:
  - ev:5
