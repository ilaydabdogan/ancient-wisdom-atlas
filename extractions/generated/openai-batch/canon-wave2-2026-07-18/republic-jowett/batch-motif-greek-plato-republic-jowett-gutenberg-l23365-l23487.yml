canonical_text:
  quote: "“these were but imitations thrice removed from the truth”"
  summary: 'Socrates and Glaucon discuss imitation. The passage argues that painters
    and tragic poets imitate appearances rather than realities, may deceive undiscerning
    viewers, and should not be credited with comprehensive knowledge. Homer is examined
    as an example: the speaker asks whether he produced public benefits as a lawgiver,
    strategist, inventor, or private teacher, and the respondent says no such achievements
    are recorded.'
  language: English
  quote_policy: quoted
