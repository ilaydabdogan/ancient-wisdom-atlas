  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A painter can portray a cobbler, carpenter, or other artist without knowing
    that craft, and may deceive children or simple persons with a picture seen from
    a distance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A person claiming to have found someone who knows all arts and all things
    is described as likely deceived by a wizard or actor because he cannot analyze
    knowledge, ignorance, and imitation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage reports that some people say tragedians and Homer know all arts,
    human things, virtue and vice, and divine things; the speaker raises the possibility
    that this is an illusion caused by imitation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The speaker argues that someone able to make both an original and an image
