canonical_text:
  quote: ''
  summary: Socrates continues a dialectical argument with Thrasymachus about justice
    and injustice. He argues from examples of the functions and excellences of organs
    and tools to the claim that the soul has its own function and excellence. Justice
    is treated as the soul's excellence, injustice as its defect; therefore the just
    person lives well and happily, while the unjust person lives badly and miserably.
    Socrates then says the discussion has not yet discovered what justice itself is.
  language: English
  quote_policy: summarized
