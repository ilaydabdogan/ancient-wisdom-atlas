canonical_text:
  quote: ''
  summary: The speaker closes the argument that justice is best in itself and begins
    restoring to justice its visible rewards. He argues that gods truly know the just
    and unjust, care for the just in life and death, and oppose the unjust. Human
    rewards are compared to a race in which the true runner finishes and is crowned,
    while the unjust are eventually exposed and punished. The passage ends by announcing
    greater recompenses for both just and unjust after death.
  language: English
  quote_policy: summarized
