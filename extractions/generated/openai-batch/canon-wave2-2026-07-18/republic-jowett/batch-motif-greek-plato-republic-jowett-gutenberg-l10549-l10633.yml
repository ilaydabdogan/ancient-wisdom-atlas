literal_observations:
- id: obs:1
  text: The speaker frames a coarse description as words placed in the mouths of eulogists
    of injustice.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A just man who is thought unjust is described as scourged, racked, bound,
    blinded, and finally impaled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The unjust man is described as pursuing reality rather than appearances, wanting
    to be really unjust rather than merely seeming unjust.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The unjust man who is thought just is said to rule in the city, arrange marriages,
    trade advantageously, defeat antagonists, become rich, benefit friends, and harm
    enemies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The unjust man who is thought just is said to offer sacrifices and gifts to
    the gods abundantly and magnificently, and therefore to be considered dearer to
    gods and men than the just man.
  category: relationship
  evidence_refs:
  - ev:2
