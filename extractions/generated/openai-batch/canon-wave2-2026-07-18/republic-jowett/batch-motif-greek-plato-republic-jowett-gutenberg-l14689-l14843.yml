canonical_text:
  quote: ''
  summary: A dialectical exchange classifies desire among opposites, distinguishes
    simple from qualified desires, treats thirst and hunger as relative to drink and
    food, and argues that a restraining pull against thirst must be different from
    the thirsty principle, illustrated by an archer whose two hands perform opposite
    actions.
  language: English
  quote_policy: summarized
