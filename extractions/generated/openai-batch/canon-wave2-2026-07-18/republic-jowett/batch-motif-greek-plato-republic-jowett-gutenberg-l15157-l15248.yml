canonical_text:
  quote: "“virtue is the health and beauty and well-being of the soul”"
  summary: Socrates compares justice and virtue in the soul to health and natural
    order in the body, and vice and injustice to disease and disorder. The interlocutor
    accepts that a corrupted vital principle makes life not worth having. Socrates
    then uses an ascent and viewing metaphor, saying the argument has reached a height
    like a tower from which one can see virtue as one and vice as having many forms.
    He begins classifying corresponding forms of soul and State, naming monarchy and
    aristocracy as one form when ruled by trained governors.
