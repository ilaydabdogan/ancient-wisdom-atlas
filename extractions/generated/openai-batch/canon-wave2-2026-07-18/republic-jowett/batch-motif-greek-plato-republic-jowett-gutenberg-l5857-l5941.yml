canonical_text:
  quote: ''
  summary: 'The excerpt closes the Myth of Er: souls pass through named powers associated
    with lot, spindle, irreversible threads, Necessity, Forgetfulness, and rebirth;
    Er alone is prevented from drinking and later awakens on a pyre. The passage then
    gives a moral conclusion about the immortal soul, Justice, Knowledge, and reward,
    followed by analysis of Book X, Socrates'' attack on poets, Plato''s hostility
    to poetry, and the degradation attributed to actors.'
  language: English
  quote_policy: summarized
