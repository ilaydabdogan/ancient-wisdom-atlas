canonical_text:
  quote: ''
  summary: The passage explains the idea of good by analogy with the sun, then introduces
    a divided line separating visible and intelligible realms. The visible realm includes
    shadows, reflections, and physical things; the intelligible realm includes mathematical
    reasoning from hypotheses and a higher movement of the soul toward a principle
    above hypotheses.
  language: English
  quote_policy: summarized
literal_observations:
