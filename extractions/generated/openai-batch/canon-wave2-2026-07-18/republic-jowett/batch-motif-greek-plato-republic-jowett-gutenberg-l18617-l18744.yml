  text: The idea of good is said to impart truth to known things and the power of
    knowing to the knower.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Truth and knowledge are described as beautiful and as like the good, but not
    identical with the good; the good is described as higher in honour.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sun is described as author of visibility in visible things and of generation,
    nourishment, and growth, while not itself generation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The good is analogously described as author of knowledge, being, and essence,
    while exceeding essence in dignity and power.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Two ruling powers are posited: one over the intellectual world and one over
    the visible world.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A line is imagined as cut into two unequal parts, each again divided in the
    same proportion, corresponding to the visible and the intelligible.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first visible section consists of images, including shadows and reflections
    in water and smooth polished bodies.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Another visible section includes visible animals, growing things, and made
    things.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The copy is related to the original as opinion is related to knowledge.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the lower intelligible subdivision, the soul uses figures as images, proceeds
    hypothetically, and descends toward a conclusion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the higher intelligible subdivision, the soul passes beyond hypotheses
    and goes up to a principle above hypotheses, proceeding through ideas themselves.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Students of geometry and arithmetic assume hypotheses such as odd, even, figures,
    and angles, and reason from them to conclusions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Mathematical students use visible forms and drawn figures, but are said to
    think of ideals such as the absolute square and absolute diameter.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage says the things sought by mathematical reasoning can only be seen
    with the eye of the mind.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: The soul is described as compelled to use hypotheses in this kind of intelligible
    search and as unable there to rise above the region of hypothesis.
  category: action
  evidence_refs:
  - ev:7
