canonical_text:
  quote: ''
  summary: The passage analyzes Plato’s treatment of pure mathematics, astronomy,
    harmonics, vision, and the idea of good. It contrasts ancient and modern conceptions,
    links Plato’s mathematical abstractions to Pythagorean notions, describes number
    as acquiring sacredness through truth and certainty, and explains Plato’s account
    of sense perception as confused flux ordered by reason into visible and intelligible
    distinctions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says a modern mathematician would sympathize with Plato’s delight
    in pure mathematics and with studying number and figure in themselves rather than
    their practical application.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage attributes to Plato a conception of one science of solids in motion
    including earth and heavens, with astronomy, harmonics, and related sciences studied
    in relation to one another and to the idea of good.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage criticizes Plato for supposing he could construct the heavens
    a priori through mathematical problems and determine harmony apart from the human
    ear, while also saying he may have shown prophetic insight into abstract dynamics.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the metaphysical philosopher sees mathematics as an educational
    instrument that strengthens attention, order, construction, and the grasp of quantitative
    differences.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage traces Plato’s attempted connection between mathematics and higher
    moral and intellectual ideas to ancient Pythagorean notions about abstract numbers,
    unity, indivisibility, and absolute number.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the truth and certainty of numbers gave them sacredness in
    the eyes of an ancient philosopher and suggests that order and fixedness may have
    had moral and elevating influence.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage describes Plato’s view of sense as Heraclitean flux, imagined
    as confused and blurred to a half-awakened infant eye; the mind then attempts
    to set this chaos in order and distinguishes the visible from the intelligible.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage distinguishes Pythagorean harmonists, mere empirics, and the Platonic
    idea of harmony; the Pythagoreans are called masters of the art but deficient
    in its relation to the good, while the empirics experiment by listening to sound
    intervals.
  category: relationship
  evidence_refs:
  - ev:5
