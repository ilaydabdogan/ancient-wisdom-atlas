canonical_text:
  quote: the gifts of nature are alike diffused in both; all the pursuits of men are
    the pursuits of women also
  summary: A dialogue examines whether differences of sex justify different civic
    pursuits and education. The speaker argues that only differences relevant to a
    pursuit matter, that men and women can share guardian qualities, and that qualified
    women should receive the same music, gymnastic, and civic guardian training as
    men.
