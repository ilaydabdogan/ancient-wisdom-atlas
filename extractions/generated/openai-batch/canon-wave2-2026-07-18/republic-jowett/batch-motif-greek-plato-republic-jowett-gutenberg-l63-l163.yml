canonical_text:
  quote: ''
  summary: The passage introduces Plato's Republic as a major philosophical work,
    emphasizes its treatment of knowledge, logic, psychology, politics, and metaphysics,
    and then situates it within a larger unfinished design involving the Timaeus and
    Critias. It describes the Atlantis material as a mythical history of wars between
    Athenians and Atlantis, interpreted as a struggle for liberty representing Persia
    and Hellas, and speculates that a completed narrative might have celebrated Hellenic
    independence, Marathon and Salamis, Athens' order, and the favor of Apollo and
    Athene.
  language: English
  quote_policy: summarized
