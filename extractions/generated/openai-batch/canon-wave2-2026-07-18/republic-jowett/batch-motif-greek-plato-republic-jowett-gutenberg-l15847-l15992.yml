canonical_text:
  quote: ''
  summary: 'The passage argues that the guardian class should be regulated like carefully
    bred animals: rulers should secretly manage marriages and births, use deception
    and lots, hold public hymeneal festivals with sacrifices and songs, rear selected
    offspring separately, hide inferior or deformed offspring, control nursing so
    mothers do not recognize their children, and condemn reproduction outside prescribed
    ages or without official sanction as unconsecrated.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage compares breeding dogs, birds, horses, and animals by selecting
    the best and those of ripe age, warning that careless breeding causes deterioration.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rulers are said to need unusual skill and to use falsehood and deceit
    as medicines for the good of their subjects.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The best members of each sex are to be united with the best as often as possible,
    inferior members with inferior members as seldom as possible, and the policy is
    to remain a secret known only to rulers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Public festivals are proposed for bringing brides and bridegrooms together,
    with sacrifices and hymeneal songs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The number of weddings is to be left to rulers, who are to consider population
    size, war, disease, and similar causes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ingenious lots are to be invented so that less worthy participants blame ill
    luck rather than the rulers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Braver and better young men are to be given greater access to women so that
    they may have as many sons as possible.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Male or female officers are to take offspring of good parents to a pen or
    fold with nurses in a separate quarter, while inferior or deformed offspring are
    to be put away in an unknown place.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Mothers are to be brought to the fold when full of milk, but precautions are
    to prevent any mother from recognizing her own child.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Wet-nurses may be used, suckling is not to be prolonged, and nurses and attendants
    are to handle night care and other burdens.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The prescribed childbearing ages are twenty to forty for women and twenty-five
    to fifty-five for men.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Reproduction outside the prescribed age or without the sanction of rulers
    is described as unholy, unrighteous, bastard, uncertified, and unconsecrated.
  category: attribute
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:13
  text: At sanctioned hymeneals, priestesses, a priest, and the whole city are to
    offer sacrifices and prayers for the new generation to be better and more useful
    than their parents.
  category: action
  evidence_refs:
  - ev:9
