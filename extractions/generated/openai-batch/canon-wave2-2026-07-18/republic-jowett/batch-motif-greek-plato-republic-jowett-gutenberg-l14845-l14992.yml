canonical_text:
  quote: ''
  summary: The passage argues that the soul contains distinct rational, appetitive,
    and spirited principles. A story about Leontius illustrates a conflict between
    desire and abhorrence at the sight of executed bodies. The spirited element is
    described as normally siding with reason against desire, and the soul is compared
    to the three-class structure of the State. The argument concludes that justice
    in the individual, as in the State, consists in each part doing its own work.
  language: English
  quote_policy: summarized
