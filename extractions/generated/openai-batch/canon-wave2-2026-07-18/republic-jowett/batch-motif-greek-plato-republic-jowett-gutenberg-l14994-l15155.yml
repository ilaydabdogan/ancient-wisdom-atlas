canonical_text:
  quote: ''
  summary: The passage argues that reason should rule the soul, spirit should serve
    as its ally, and desire should be guarded. It defines courage, wisdom, temperance,
    justice, and injustice through the relation of the three soul-parts, compares
    justice in the individual to justice in the State, and describes the just person
    as inwardly ordered and harmonized like notes in a scale.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rational principle is described as wise, caring for the whole soul, and
    fit to rule; the passionate or spirited principle is described as its subject
    and ally.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Music and gymnastic are said to bring reason and passion into accord, sustaining
    reason with words and lessons and moderating passion through harmony and rhythm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Reason and spirit, once nurtured and educated, are said to rule and keep guard
    over the concupiscent part, which is called the largest soul-part and insatiable
    of gain.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The concupiscent soul is said to be capable of growing strong through bodily
    pleasures and attempting to enslave and rule beyond its own sphere.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Reason is described as counseling, while spirit fights under its leader and
    executes reason’s commands and counsels.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Courage is defined as spirit retaining reason’s commands about what should
    or should not be feared, in both pleasure and pain.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wisdom is attributed to the small ruling part that proclaims commands and
    knows what is in the interest of each of the three parts and of the whole.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Temperance is defined as friendly harmony among reason, spirit, and desire,
    with all agreeing that reason should rule and not rebelling.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The just State and the just person are said to be less likely to steal deposits,
    commit sacrilege or theft, betray friends or country, break oaths, commit adultery,
    dishonour parents, or fail in religious duties.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage says that a divine power was suspected of conducting the inquiry
    to a primary form of justice, and that civic division of labour was a shadow of
    justice.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'Justice is described as inward order: the just person does not let inner
    elements interfere, becomes master of himself, binds together the three principles
    like notes of a scale, and calls actions that preserve this harmony just and good.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Injustice is described as strife among the three principles, meddlesomeness,
    interference, and a soul-part rising against the whole like a rebellious subject
    against a true prince.
  category: attribute
  evidence_refs:
  - ev:7
