canonical_text:
  quote: ''
  summary: 'The passage summarizes the selection and education of future rulers: they
    must possess intellectual and moral fitness, be trained through staged selection
    at youth, age twenty, age thirty, and age fifty, pass through dialectic and civic
    experience, return to contemplate the idea of good, govern the State, train successors,
    and after death receive blessed honors. It also warns that premature dialectic
    can destabilize inherited principles and describes philosopher-kings and women
    sharing in governance.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Future rulers are to be selected for constancy, valor, noble manners, quick
    learning, mental endurance, memory, diligence, and combined intellectual and moral
    virtues.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The selected natures are described as sound in body and soul and as potential
    saviours of the State.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Disciples are to be young; early learning is described as play used to detect
    natural ability.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After two or three years of bodily gymnastics, a selection is made at age
    twenty, and the sciences previously learned in fragments are brought into relation
    with one another and with true being.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At age thirty, another selection is made of those able to withdraw from the
    world of sense into the abstraction of ideas.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage warns that dialectic can become dangerous when it unsettles a
    person’s inherited principles.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The danger of dialectic is illustrated through a person raised among reputed
    parents and flatterers who learns he is a supposititious son and reverses his
    loyalties.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A troublesome questioner asks about the just and good and may argue that virtue
    is vice and vice virtue, leading the hearer to cease honoring former doctrines.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Young persons are compared to puppies who play with arguments and are reasoned
    into and out of opinions, whereas a thirty-year-old is said to argue more soberly.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: After dialectical training beginning at thirty, the student spends fifteen
    years going down into the den, commanding armies, and gaining experience of life.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At fifty, the trained ruler returns to the end of all things, uplifts his
    eyes to the idea of good, orders life after that pattern, governs when needed,
    and trains successors.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: At death, the ruler departs to the islands of the blest and receives sacrifices
    and worship approved by the Pythian oracle.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Women are said to share in all things with men, and the completed State may
    come into being when philosopher-kings arise as servants of justice.
  category: relationship
  evidence_refs:
  - ev:9
