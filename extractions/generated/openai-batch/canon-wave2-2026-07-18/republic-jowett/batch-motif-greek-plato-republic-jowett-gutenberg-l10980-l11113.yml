canonical_text:
  quote: ''
  summary: The passage describes the development of a constructed State through production,
    trade, merchants, sailors, a market-place, money, retail-traders, and hirelings.
    Socrates then asks where justice and injustice arise, and the answer locates them
    in citizens' dealings. A simple, moderate way of life is described, including
    food, seasonal clothing, family feasting, wine, garlands, hymns to the gods, and
    limits on household size. Glaucon objects that this resembles a city of pigs and
    asks for sofas, tables, sauces, and sweets. Socrates distinguishes the healthy
    State from a luxurious State at fever-heat, listing added luxuries, arts, and
    materials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: External exchange requires home production sufficient in quantity and quality
    for those who supply the city's wants; the city therefore needs more husbandmen,
    artisans, merchants, and sailors.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Within the city, exchange is organized through buying and selling, requiring
    a market-place and a money-token.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Salesmen or retail-traders remain in the market-place to exchange money for
    goods and goods for money, while merchants travel from city to city.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hirelings are described as servants who sell bodily strength for labour, with
    hire named as the price of their labour.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the State is said to be matured, Socrates asks where justice and injustice
    arose, and the answer places them in the dealings of citizens with one another.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The simple State's inhabitants produce necessities, build houses, work differently
    in summer and winter, eat grain foods, recline on reeds, leaves, yew, or myrtle,
    feast with children, drink wine, wear garlands, hymn the gods, and keep family
    size within their means.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Additional relish and dessert are added to the simple diet, including salt,
    olives, cheese, roots, herbs, figs, peas, beans, myrtle-berries, and acorns roasted
    at the fire; the diet is linked to moderation, peace, health, old age, and inheritance
    by children.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Glaucon objects that Socrates has described feeding a city of pigs and asks
    for ordinary conveniences such as sofas, tables, sauces, and sweets.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Socrates identifies Glaucon's request as a move from the creation of a State
    to the creation of a luxurious State, calling the simple constitution healthy
    and the luxurious one a State at fever-heat.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The luxurious State adds furniture, dainties, perfumes, incense, courtesans,
    cakes, painting, embroidery, gold, ivory, and other materials beyond houses, clothes,
    and shoes.
  category: object
  evidence_refs:
  - ev:9
