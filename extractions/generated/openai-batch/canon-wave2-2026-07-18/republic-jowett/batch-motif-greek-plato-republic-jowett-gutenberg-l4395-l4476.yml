  text: The leading characteristic of the timocratic State is said to be party spirit
    and ambition.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: The timocratic man is described as contentious, self-asserting, ill-educated,
    obedient to rulers, fond of power and honour, and later avaricious after losing
    philosophy.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The timocratic man's father is a good man who has withdrawn from politics;
