  text: Timocracy is described as intermediate between aristocracy and oligarchy and
    as retaining a warlike character.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The new government resembles the ideal in obedience to rulers, contempt for
    trade, common meals, and devotion to warlike and gymnastic exercises.
  category: attribute
  evidence_refs:
  - ev:4
