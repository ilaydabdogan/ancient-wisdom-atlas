canonical_text:
  quote: ''
  summary: The passage explains the decline from an ideal state into timocracy and
    then oligarchy. It invokes the Muses in Homeric style to describe fated decay,
    cycles of fertility and sterility, a geometrical law of generation, the mixing
    and conflict of metallic social races, the rise of ambition and wealth-seeking,
    and the formation of a corresponding timocratic character through family and social
    influences.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage asks how timocracy arises from the perfect State and identifies
    division among rulers as the immediate cause.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The heavenly Muses are invoked to answer, and their answer says human things
    are fated to decay and the perfect State will not escape when the wheel comes
    full circle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Plants and animals are said to have times of fertility and sterility, which
    rulers fail to ascertain, causing children to be born out of season.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Divine creations are described as having a perfect cycle or number, while
    human creation has a number that declines from perfection and contains a rule
    or law of generation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: When the law of generation is neglected, marriages become unpropitious, inferior
    offspring are born, the State declines, education decays, and division arises.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Gold, silver, brass, and iron are said to form a chaotic mass during the decline
    of the State.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The iron and brass races and the silver and gold races pull the State in different
