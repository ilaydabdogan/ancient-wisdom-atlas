canonical_text:
  quote: ''
  summary: Socrates and Glaucon discuss the dangers of giving dialectic to the young
    too early, the staged education and testing of future philosopher-rulers, their
    eventual contemplation of the absolute good, their duty to govern and train successors,
    their blessed honors after death, and the conditions under which a perfect state
    might be founded by philosopher kings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young beginners who taste argument too early are described as arguing for
    amusement, contradicting and refuting others by imitation, and behaving like puppy-dogs
    that pull and tear at those nearby.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After many victories and defeats in argument, these young arguers may quickly
    cease believing what they previously believed, and philosophy may gain a bad reputation
    among others.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: An older person is said to imitate the dialectician seeking truth rather than
    the eristic who contradicts for amusement.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Disciples of philosophy are to be orderly and steadfast, not chance aspirants
    or intruders.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The study of philosophy is proposed as replacing gymnastics and continuing
    exclusively for five years.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After this study, the trainees are to be sent down again into the den and
    compelled to hold military or other offices suitable for young men, so that their
    firmness under temptation may be tested.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The office-holding and testing stage is said to last fifteen years.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At fifty years of age, survivors distinguished in action and knowledge reach
    their consummation by raising the eye of the soul to the universal light and beholding
    the absolute good.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The absolute good is described as the pattern according to which the State,
    individual lives, and the rulers' own lives are to be ordered.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The mature rulers are to make philosophy their chief pursuit while also ruling
    for the public good as a duty when their turn comes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After raising successors and leaving them as governors, the rulers will depart
    to the Islands of the Blest; the city will give them public memorials, sacrifices,
    and honors as demigods if the Pythian oracle consents, otherwise as blessed and
    divine.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Socrates says the account applies to governesses as well as governors, as
    far as women's natures can go.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Glaucon compares Socrates to a sculptor who has made faultlessly beautiful
    statues of the governors.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The perfect State is said to be possible when true philosopher kings are born
    in a State, despise present-world honors, esteem right, and serve justice.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The philosopher kings would begin by sending inhabitants older than ten into
    the country, taking possession of their children, and training those children
    in the stated habits and laws.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: This method is said to allow the State and constitution to attain happiness
    most quickly and easily.
  category: relationship
  evidence_refs:
  - ev:10
