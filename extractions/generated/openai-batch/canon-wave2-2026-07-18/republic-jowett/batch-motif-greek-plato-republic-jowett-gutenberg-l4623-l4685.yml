canonical_text:
  quote: ''
  summary: The passage analyzes how democracy turns into tyranny through excess freedom,
    social leveling, class conflict, demagogic exploitation, and the rise of a popular
    protector who becomes a tyrant. It uses images of wine, yokes, drones, honey,
    bodily humors, a tree, a Lycaean wolf-transformation fable, wings, and the chariot
    of State.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tyranny is said to spring from democracy, as democracy springs from oligarchy;
    both changes arise from excess.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The democrat names freedom as the great natural good of life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The democratic State demands a strong wine of freedom and punishes or insults
    rulers who do not provide it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Anarchy and leveling are described as extending through the State, private
    houses, social ranks, gender relations, and animals.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Citizens become unable to endure written or unwritten laws and do not want
    anyone called their master; excess freedom passes into excess slavery.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Rogues and paupers are compared to drones with and without stings and to phlegm
    and bile in the human body.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: In democracy, drones are described as more numerous and active; the keener
    sort speak and act, while others buzz about the bema and block opponents from
    being heard.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Respectable thriving individuals can be squeezed for possessions, while labourers
    and artisans make up the mass of the people.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The people are drawn together by honey supplied by the rich; demagogues keep
    the greater part and give the mob only a taste.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Rich victims resist after being stung by drones and become oligarchs in self-defense;
    accusations and convictions for treason follow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The people nurse a protector into greatness, and from this root the tree of
    tyranny springs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: An old fable of the temple of Zeus Lycaeus says that one who tastes human
    flesh mixed with other victims becomes a wolf.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The protector tastes human blood, slays and exiles people, proposes debt abolition
    and land division, and must either perish or become a wolf, meaning a tyrant.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: If driven out, the protector returns from exile, asks the people for a bodyguard,
    crushes rivals, and stands in the chariot of State as a full-blown tyrant.
  category: sequence
  evidence_refs:
  - ev:8
