canonical_text:
  quote: ''
  summary: Spirits depart from a meadow on a timed journey and reach a cosmic region
    marked by a bright column-like line of light, the chains and belt of heaven, and
    the spindle of Necessity. The passage describes nested celestial whorls, their
    colors and motions, and the sirens and Fates who sing and guide the cosmic revolutions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The spirits tarry seven days in a meadow, are obliged to proceed on the eighth
    day, and after four more days reach a place where they can see from above.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: They see a line of light, straight like a column, extending through heaven
    and earth and resembling a brighter, purer rainbow.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: After another day's journey they reach the place of the light and see the
    ends of the chains of heaven; the light is described as the belt of heaven that
    holds together the circle of the universe.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The spindle of Necessity is extended from the ends of the chains, and all
    revolutions turn upon it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The spindle has a steel shaft and hook, and its whorl is partly steel and
    partly other materials; eight hollow whorls fit inside one another like vessels.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The whorls differ in size, color, brightness, and celestial association, including
    fixed stars, sun, moon, Saturn, Mercury, Venus, Mars, and Jupiter.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The whole spindle moves in one direction, while the seven inner circles move
    slowly in the other direction with ranked speeds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The spindle turns on the knees of Necessity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A siren stands on the upper surface of each circle, goes round with it, and
    hymns one tone or note; the eight tones together form one harmony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Three Fates, daughters of Necessity, sit on thrones at equal intervals, wear
    white robes and chaplets, and accompany the harmony of the sirens with their voices.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Lachesis sings of the past, Clotho of the present, and Atropos of the future;
    Clotho touches the outer circle, Atropos touches and guides the inner circles,
    and Lachesis lays hold of either in turn.
  category: action
  evidence_refs:
  - ev:5
