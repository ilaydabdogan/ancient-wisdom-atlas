canonical_text:
  quote: ''
  summary: The passage comments on More and the Utopians in comparison with Plato.
    It describes Utopian religious toleration, limits on civic participation for those
    denying the soul's immortality, exile of a disruptive religious zealot, public
    prayers acceptable to all sects, belief among the wisest Utopians in an unknown
    divine power called the Father of all, political and moral reforms, a possible
    heaven-inspired truth beyond reason, affinities with Greek and Platonic thought,
    and an inversion of wealth-values in which gold and jewels are treated as shameful,
    childish, or servile ornaments.
  language: English
  quote_policy: summarized
