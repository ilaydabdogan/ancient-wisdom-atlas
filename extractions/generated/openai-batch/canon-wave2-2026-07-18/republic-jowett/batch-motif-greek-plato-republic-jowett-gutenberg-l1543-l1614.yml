canonical_text:
  quote: ''
  summary: 'The passage summarizes Plato''s proposed regulation of poetic and mythic
    material for civic education: frightening underworld tales, heroic and divine
    lamentation, divine laughter, sensual excess, bribery, cruelty, and claims that
    injustice prospers are to be excluded because they encourage fear, intemperance,
    and imitation of bad models among the young.'
  language: English
  quote_policy: summarized
