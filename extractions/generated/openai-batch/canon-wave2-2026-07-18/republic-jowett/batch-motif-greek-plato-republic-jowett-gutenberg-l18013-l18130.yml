canonical_text:
  quote: ''
  summary: Socrates argues that true philosophers, or rulers divinely inspired by
    true philosophy, must govern for cities and individuals to attain perfection.
    He describes public resistance to philosophy, blames pretenders for that hostility,
    and portrays the philosopher as contemplating fixed divine order and fashioning
    political life after a heavenly pattern.
  language: English
  quote_policy: summarized
