canonical_text:
  quote: ''
  summary: 'The passage argues that justice receives rewards in life and after death,
    then introduces the story of Er: a warrior thought dead who revives on his funeral
    pyre and reports seeing postmortem judgment, upward and downward paths, rewarded
    and punished souls, and the special punishment of tyrants such as Ardiaeus.'
  language: English
  quote_policy: summarized
