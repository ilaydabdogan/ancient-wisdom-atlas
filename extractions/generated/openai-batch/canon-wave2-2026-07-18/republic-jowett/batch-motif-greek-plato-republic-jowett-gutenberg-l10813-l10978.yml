canonical_text:
  quote: the true creator is necessity, who is the mother of our invention.
  summary: The speakers resume an inquiry into justice and injustice. The speaker
    proposes studying justice first in the larger State and then in the individual,
    imagines a State in process of creation, and derives its origin from human needs,
    mutual assistance, exchange, specialization of labor, tools, livestock, and import
    supply.
  language: English
  quote_policy: quoted
