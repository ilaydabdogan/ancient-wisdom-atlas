canonical_text:
  quote: justice is the interest of the stronger
  summary: Socrates presses Thrasymachus's claim that justice is the interest of the
    stronger by asking whether rulers may be mistaken about their interests. Polemarchus
    and Cleitophon intervene over the interpretation. Thrasymachus replies that, in
    the strict sense, the true ruler or skilled practitioner does not err while acting
    according to that skill. Socrates then asks about the true physician, the true
    pilot, and the interests served by an art, ending with medicine ministering to
    the needs of the body.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Socrates states that if rulers can be mistaken about their own interest and
    justice requires subjects to obey, then weaker subjects may be commanded to do
    what injures the stronger.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Polemarchus agrees with Socrates and says Thrasymachus has acknowledged both
    that rulers may command against their own interest and that subjects obeying them
    is justice.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cleitophon interposes that Thrasymachus meant the stronger's apparent interest,
    namely what the stronger thought to be his interest.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Thrasymachus denies that he calls a mistaken person stronger at the time of
