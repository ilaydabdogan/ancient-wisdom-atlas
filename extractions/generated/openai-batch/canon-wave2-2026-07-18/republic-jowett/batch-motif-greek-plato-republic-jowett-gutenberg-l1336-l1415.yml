canonical_text:
  quote: ''
  summary: 'The passage analyzes Plato''s proposed education of the young, emphasizing
    censorship of nursery tales and rejection of poetic stories that depict gods as
    immoral, deceptive, changeable, or authors of evil. It states two principles:
    God is the author of good only, and God is true and unchanging. It then summarizes
    Plato''s construction of a primitive State from mutual need and division of labor,
    and compares his picture of primitive life with other interpretive models.'
  language: English
  quote_policy: summarized
