canonical_text:
  quote: The idea of good is one of those sacred words or forms of thought
  summary: The passage interprets Plato's idea of good as a sacred philosophical form
    replacing older mythology, described as unity, truth, light, cause, universal
    reason, and the life/light of the world. It contrasts mathematical preparation
    with the goal of the good and compares the idea of good with the God of the Timaeus
    as impersonal philosophical and personal mythological aspects of the same conception.
  language: English
  quote_policy: quoted
