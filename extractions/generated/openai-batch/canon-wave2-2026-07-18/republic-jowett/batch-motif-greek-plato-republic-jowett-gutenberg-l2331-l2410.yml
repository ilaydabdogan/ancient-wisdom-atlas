canonical_text:
  quote: ''
  summary: 'The passage summarizes a Socratic inquiry into justice in the ideal State.
    Socrates and Glaucon search for justice by identifying the other civic virtues:
    wisdom in the guardians, courage in soldiers, temperance as harmony among classes,
    and justice as each person doing their own work. The passage uses images of candlelight,
    dyeing, musical harmony, hunting, large and small letters, and light to explain
    the inquiry.'
  language: English
  quote_policy: summarized
