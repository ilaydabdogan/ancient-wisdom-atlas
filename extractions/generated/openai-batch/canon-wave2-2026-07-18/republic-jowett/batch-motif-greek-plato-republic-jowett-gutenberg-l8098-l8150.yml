canonical_text:
  quote: ''
  summary: The passage compares Plato’s Republic with Cicero’s De Republica, emphasizing
    Cicero’s Roman patriotic and political focus, his reliance on Platonic models,
    his treatment of reason, justice, mixed government, democracy, tyranny, and his
    adaptation of Plato’s vision of Er into the Somnium Scipionis. It judges Cicero’s
    work as rhetorically Roman and inferior to Plato in form, matter, and originality.
  language: English
  quote_policy: summarized
