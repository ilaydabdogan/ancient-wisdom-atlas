canonical_text:
  quote: ''
  summary: Socrates proposes to examine justice first in the State and then in the
    individual. The passage summarizes the construction of a simple city from human
    needs, division of labor, exchange, and modest living; Glaucon objects that this
    is a city of pigs and asks for comforts. A luxurious city then requires many arts
    and occupations, produces disease and desire for neighboring land, and gives rise
    to war. The guardian class is defined through warlike aptitude and the image of
    the dog, which is gentle to friends, fierce to strangers, and likened to a philosopher
    because it discriminates by knowing or not knowing.
  language: English
  quote_policy: summarized
literal_observations:
