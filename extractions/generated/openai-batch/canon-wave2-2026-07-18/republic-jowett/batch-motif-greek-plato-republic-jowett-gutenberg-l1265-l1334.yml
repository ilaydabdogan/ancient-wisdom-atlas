  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The luxurious State requires many arts, instruments, ornaments, performers,
    artisans, animal keepers, and physicians, with luxury named as the source of disorders.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The need to feed superfluous mouths leads to taking part of a neighbor's land,
    reciprocal desire for land, the origin of war, the addition of a camp, and the
    conversion of the citizen into a soldier.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The art of war is said to require time to learn and a natural aptitude for
    military duties.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The guardian of a State is said to require both gentleness toward friends
