canonical_text:
  quote: The imitator or maker of the image knows nothing of true existence; he knows
    appearances only.
  summary: Socrates argues to Glaucon that poets and other imitators lack knowledge
    of the realities they depict. He compares poets to painters, distinguishes users,
    makers, and imitators, and explains how visual illusions and conjuring exploit
    weaknesses in perception.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Socrates asks Glaucon whether Homer, if he had possessed knowledge capable
    of improving humankind, would not have gained devoted followers like recognized
    educators.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Homer and Hesiod are discussed as figures who would not have been allowed
    to wander as rhapsodists if they had truly been able to make people virtuous.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Poetical individuals beginning with Homer are described as imitators who copy
    images of virtue and do not reach truth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The poet is compared to a painter who can make a likeness of a cobbler without
    understanding cobbling.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Poetic words, metre, harmony, and rhythm are said to give persuasive coloration
    to subjects that the poet only imitates.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The tales of poets are said to look poor when stripped of musical coloration
    and recited in plain prose.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The imitator or maker of an image is said to know appearances rather than
    true existence.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the example of bit and reins, the painter paints them, the leather-and-brass
    worker makes them, and the horseman knows their right form by use.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'Three arts are distinguished: one that uses, one that makes, and one that
    imitates.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The flute-player is presented as the user who knows the quality of flutes
    and instructs the flute-maker, who attains correct belief by listening.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The imitator is said to lack both knowledge and true opinion about the goodness
    or badness of imitations.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Imitation is called play or sport, and tragic poets are identified as imitators
    in the highest degree.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Imitation is described as concerned with something thrice removed from truth.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: A body appears large when near and small when distant; an object appears straight
    outside water and crooked in water; concave and convex appearances are confused
    by color illusion.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: Conjuring and deception by light and shadow are said to impose on the weakness
    of the human mind with an effect like magic.
  category: action
  evidence_refs:
  - ev:9
