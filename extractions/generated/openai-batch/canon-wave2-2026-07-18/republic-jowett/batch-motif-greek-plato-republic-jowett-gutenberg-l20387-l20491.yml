canonical_text:
  quote: everything which has a beginning has also an end
  summary: In an answer attributed to the Muses, an apparently stable city is said
    to decay because rulers cannot know the numerical law governing births. Mistimed
    unions produce inferior successors, educational neglect, mingling of metal-named
    races, discord, property division, enslavement of former freemen, and a militarized
    intermediate regime.
  language: English
  quote_policy: quoted
