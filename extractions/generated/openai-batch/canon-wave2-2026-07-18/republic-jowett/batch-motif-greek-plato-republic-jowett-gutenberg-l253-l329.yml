canonical_text:
  quote: ''
  summary: 'The passage analyzes the structure and unity of Plato''s Republic, describing
    a movement from a Hellenic state to an ideal kingdom of philosophy. It then explains
    the relation between justice and the State through paired metaphors: soul and
    body, idea and reality, inner kingdom and external Church, heavenly house and
    earthly building, and warp and woof. It concludes that justice functions as inner
    law of the soul, a principle of afterlife rewards and punishments, and a harmony
    reflected in states, nature, and heavenly bodies.'
  language: English
