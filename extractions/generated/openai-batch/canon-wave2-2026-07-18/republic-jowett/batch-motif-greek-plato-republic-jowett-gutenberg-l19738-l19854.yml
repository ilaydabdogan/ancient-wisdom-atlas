canonical_text:
  quote: the ascent from the underground den to the sun
  summary: 'Socrates explains that the prior studies have value only when grasped
    in relation to one another and that they are a prelude to dialectic. Dialectic
    is described as an intellect-only pursuit that moves by reason toward the absolute
    good. The passage recalls the release of prisoners from chains, movement from
    shadows to light, ascent from an underground den to the sun, and the soul’s eye
    being lifted upward by dialectic. It contrasts mathematical understanding with
    dialectic and ends by distinguishing four divisions of cognition: science, understanding,
    belief, and perception of shadows.'
  language: English
  quote_policy: quoted
