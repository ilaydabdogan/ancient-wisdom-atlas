canonical_text:
  quote: philosophy is left desolate, with her marriage rite incomplete
  summary: The passage describes how a naturally gifted youth may be flattered by
    friends and fellow-citizens, become proud, resist instruction, and be prevented
    from turning to philosophy. Philosophy is then personified as a deserted woman
    whose proper companions have forsaken her; unworthy persons enter and dishonor
    her, and their alliance with her produces sophisms rather than true wisdom.
  language: English
  quote_policy: quoted
