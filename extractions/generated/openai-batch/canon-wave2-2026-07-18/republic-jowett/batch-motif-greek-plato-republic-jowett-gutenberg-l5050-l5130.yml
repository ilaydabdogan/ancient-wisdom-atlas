- id: obs:4
  text: The passage summarizes Plato’s general meaning as divine creation being perfect
    and represented or presided over by a perfect or cyclical number, while human
    generation is imperfect and represented or presided over by an imperfect number
    or series of numbers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says that people who found order in number imagined number giving
