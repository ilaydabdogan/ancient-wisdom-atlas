canonical_text:
  quote: ''
  summary: The passage analyzes a numerical riddle in Plato, rejects some specific
    mathematical interpretations, and presents perfect or cyclical number as related
    to divine creation and imperfect number as related to human generation. It then
    turns to Book IX, introducing the tyrannical man, unlawful appetites active when
    reason sleeps, temperate preparation for sleep, the wild-beast nature in dreams,
    and the implantation of a monster-drone love by corrupting companions.
  language: English
  quote_policy: summarized
