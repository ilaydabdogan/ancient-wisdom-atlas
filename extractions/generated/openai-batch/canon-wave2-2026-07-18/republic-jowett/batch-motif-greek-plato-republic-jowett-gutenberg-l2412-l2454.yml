canonical_text:
  quote: ''
  summary: The passage analyzes Plato's account of justice in relation to the virtues,
    the tripartite soul, and the classes of the State. It describes justice as sought
    by a method of residues, compares it with temperance and harmony, presents it
    as the order of the whole soul and State, and connects the discussion to the question
    whether the virtues are one or many, the four cardinal virtues, Aristotle's universal
    justice, and the more universal idea of the good.
  language: English
  quote_policy: summarized
