canonical_text:
  quote: ''
  summary: A philosophical dialogue distinguishes apparent pleasures from true pleasures,
    uses an upper/middle/lower-region analogy for mistaken judgment, contrasts bodily
    and soul satisfactions, describes people without wisdom as animal-like and confined
    to lower or intermediate experience, and compares mixed pleasures to shadows,
    including Stesichorus' example of Greeks fighting over Helen's shadow at Troy.
  language: English
  quote_policy: summarized
