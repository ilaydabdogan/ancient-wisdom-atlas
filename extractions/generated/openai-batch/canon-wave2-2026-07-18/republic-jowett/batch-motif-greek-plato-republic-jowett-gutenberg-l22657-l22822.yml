  text: The passage distinguishes pleasures that appear real by contrast with pain
    from true pleasure.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pleasures of smell are presented as pleasures without antecedent pains, while
    many violent bodily pleasures are described as reliefs of pain.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker posits upper, middle, and lower regions, and says a person moving
    from lower to middle may imagine he has gone up or reached the upper region if
    he has never seen the true upper world.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ignorance of the true upper, middle, and lower regions is used to explain
    mistaken ideas about pleasure, pain, and the intermediate state.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Hunger and thirst are described as bodily deficiencies; ignorance and folly
    are described as deficiencies of the soul; food and wisdom are named as corresponding
    satisfactions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Things concerned with the invariable, immortal, and true are said to have
    purer being than things concerned with the variable and mortal.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that what is filled with more real being has truer pleasure,
