canonical_text:
  quote: ''
  summary: The speaker argues that the guardians’ communal family and property arrangements
    will make kinship terms effective in action, unify pleasures and pains, prevent
    disputes over possessions and households, maintain peace through law and age hierarchy,
    free the guardians from household economic troubles, and grant them rewards like
    but greater than those of Olympic victors for saving the State.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker asks whether family names such as father should imply actual care,
    reverence, duty, obedience, and legal-religious blame for violation of those duties.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children are described as hearing all citizens repeat claims about those indicated
    to them as parents and kinsfolk.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The city is said to use language of harmony and concord, with common expressions
    of being well or ill and common pleasures and pains.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The guardians’ community of women and children is named as the chief reason
    for their common feeling.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The well-ordered State is explicitly compared to the body and its members
    when affected by pleasure or pain.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The guardians are not to have houses, lands, or other property; their pay
    is to be food from the other citizens, and they are to have no private expenses.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Community of property and families is said to keep the guardians from tearing
    the city apart through disputes about mine and not mine, and to orient them toward
    a common end.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Because the guardians have nothing but their persons to call their own, suits,
    complaints, and quarrels over money, children, or relations are said to disappear
    among them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The law allows equals to defend themselves against equals, makes protection
    of the person necessary, and is said to limit quarrels before they become more
    dangerous.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Elders are assigned the duty of ruling and chastising the younger, while the
    younger are not to strike, use violence against, or slight elders unless magistrates
    command it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'Shame and fear are called two guardians that prevent violence against elders:
    shame because elders stand in a parental relation, and fear because the injured
    person will be helped by kin.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The laws are said to help citizens keep peace, and the lack of quarrels among
    guardians is said to prevent division in the rest of the city.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: The guardians are said to be delivered from flattery between poor and rich
    and from household economic pains such as raising a family, borrowing, repudiating
    debts, and storing money with women and slaves.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Their life is called blessed like that of Olympic victors and more blessed;
    their victory is the salvation of the whole State, and they receive a crown, public
    rewards while living, and honourable burial after death.
  category: sequence
  evidence_refs:
  - ev:7
