canonical_text:
  quote: ''
  summary: 'A dialogue passage argues that women among the guardians should share
    the same education, exercises, war duties, and communal life as male guardians,
    with lighter tasks assigned to them. A larger proposed law makes wives and children
    common among the guardians, with parents and children not knowing one another
    individually. The speaker postpones the question of possibility and explains the
    proposed utility and implementation: rulers and auxiliaries must obey and command
    properly, matched men and women will live and train in common, licentiousness
    will be forbidden, matrimony will be treated as sacred, and animal pairing and
    breeding are introduced as an analogy.'
  language: English
  quote_policy: summarized
