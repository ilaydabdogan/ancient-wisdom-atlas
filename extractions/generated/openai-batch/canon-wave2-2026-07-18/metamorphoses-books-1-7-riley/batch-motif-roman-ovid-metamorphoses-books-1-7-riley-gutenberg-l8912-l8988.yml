canonical_text:
  quote: ''
  summary: Arethusa recounts how Alpheus spoke from the stream and pursued her as
    she fled naked across named Arcadian and Elean places. She invoked Dictynna, who
    concealed her in a cloud. Under siege, Arethusa dissolved into water and became
    a stream; Alpheus became his own waters to mingle with her. The Delian Goddess
    then opened the ground, and Arethusa was carried through dark caverns to Ortygia
    and the upper air.
  language: English
  quote_policy: summarized
