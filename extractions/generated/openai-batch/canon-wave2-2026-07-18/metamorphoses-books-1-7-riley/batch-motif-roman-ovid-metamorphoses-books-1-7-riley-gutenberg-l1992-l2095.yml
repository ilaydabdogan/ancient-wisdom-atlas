literal_observations:
- id: obs:1
  text: The bridal procession is described as carrying five torches before the bride;
    among Romans, the nuptial torch was lit at the bride’s parental hearth and carried
    by a boy whose parents were alive.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The torch is also described as used at funerals to light the pile and because
    funerals were often nocturnal; the note connects life with being between two torches.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Claros is described as having a temple and oracle of Apollo, with a nearby
    mountain and grove sacred to him; Patara is described as a place where Apollo
    gave oracular responses for six months of the year.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The note says early medical art concerned the medicinal qualities of herbs
    and simples, and it offers an allegorical explanation for Apollo or the Sun as
    discoverer of healing.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Apollo is described as always represented as youthful and as never growing
    old; the note connects this to Apollo as the Sun and to fire, which is said never
    to grow old.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Apollo’s pursuit of Daphne is compared to a greyhound pursuing a hare, illustrating
    the god’s eagerness and the nymph’s anxiety to escape.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The note says Pope’s Windsor Forest imitated this passage in describing the
    nymph Lodona pursued by Pan and transformed into a river.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Players of Apollo’s cithara are described as crowned with laurel; laurel is
    also described as a Roman emblem of victory used on fasces, weapons, triumphing
    generals, and victory branches.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The civic crown of oak leaves before Augustus Caesar’s Palatium gate is described
    as accompanied by laurel branches on either side.
  category: setting
  evidence_refs:
  - ev:6
