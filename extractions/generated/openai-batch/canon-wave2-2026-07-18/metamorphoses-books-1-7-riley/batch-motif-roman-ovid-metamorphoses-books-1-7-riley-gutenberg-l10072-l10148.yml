candidate_motifs:
- id: motif:1
  label: musical challenge to a god followed by punishment
  taxonomy_refs:
  - divine_judgment
  basis: Marsyas challenges Apollo after becoming proud of his flute skill and receives
    the punishment described by Ovid; Apollo’s vengeance is also mentioned in the
    river allegory.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: high
  cautions: The explanation also allows a historicized reading in which the opponent
    may have been a priest or prince bearing Apollo’s name.
- id: motif:2
  label: theft or recovery of a divine instrument
  taxonomy_refs:
  - sacred_theft
  basis: The passage reports that Marsyas either stole Minerva’s flute or found it
    after Minerva discarded it, and that the instrument became fatal to him.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: 'The passage gives variant accounts: theft in one source and finding a
    discarded object in another.'
- id: motif:3
  label: defeated figure becomes associated with a named river
  taxonomy_refs: []
  basis: Suidas is cited for the account that Marsyas, mortified at defeat, threw
    himself into the river near Celenæ and the river thereafter bore his name.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: This is presented as one variant explanation among several ancient reports.
- id: motif:4
  label: silenced victim communicates through textile craft
  taxonomy_refs: []
  basis: Philomela, after Tereus cuts out her tongue and confines her, weaves her
    story on cloth and sends it to Progne.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage summarizes this action but does not yet narrate the full later
    consequences.
- id: motif:5
  label: violent seizure and concealment of a female relative by marriage
  taxonomy_refs:
  - stolen_beloved
  basis: Tereus, already married to Progne, falls in love with Philomela, ravishes
    her, mutilates her to prevent discovery, and confines her in a forest stronghold.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The taxonomy label is only approximate because the passage describes unilateral
    violence rather than a mutually beloved stolen partner.
- id: motif:6
  label: ill-omened marriage with funerary signs
  taxonomy_refs: []
  basis: The wedding lacks Juno, Hymeneus, and the Graces; the Furies carry funeral
    torches, prepare the wedding couch, and an ill-boding owl sits on the bridal chamber
    roof.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No explicit taxonomy family in the supplied list exactly matches ominous
    or inverted wedding rites.
comparison_claims:
- id: claim:1
  claim: 'The passage itself presents the Apollo-Marsyas story as a motif with multiple
    ancient explanations: river allegory, historicized musical contest, preserved
    skin at Celenæ, suicide into a river, and Minerva’s flute traditions.'
  claim_level: same_motif
  target: Ancient accounts of the Apollo-Marsyas story cited from Livy, Quintus Curtius,
    Herodotus, Strabo, Pausanias, Aulus Gellius, Suidas, Ovid’s Fasti, and Apollodorus
    as quoted by Pausanias
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The passage is an explanatory note summarizing sources; it does not
    provide independent excerpts from those sources.
- id: claim:2
  claim: 'The passage supports a cautious comparison between two forms of the Minerva-flute
    episode: one in which Marsyas steals the flute and another in which he finds it
    after Minerva discards it.'
  claim_level: same_motif
  target: Variant accounts of Marsyas acquiring Minerva’s flute
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The variants differ on whether Marsyas commits theft or merely finds
    the discarded instrument.
