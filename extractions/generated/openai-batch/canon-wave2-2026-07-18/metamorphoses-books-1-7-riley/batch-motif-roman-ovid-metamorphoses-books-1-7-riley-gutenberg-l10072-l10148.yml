canonical_text:
  quote: ''
  summary: 'The passage first explains variant ancient accounts of Marsyas: his parentage,
    flute-playing, possible allegorical connection with a noisy Phrygian river, challenge
    to Apollo, punishment, death or river association, and acquisition of Minerva’s
    discarded or stolen flute. It then introduces the story of Tereus, Progne, and
    Philomela: Tereus marries Progne, later violates Philomela, mutilates and confines
    her, and Philomela communicates her fate by weaving. The narrative proper begins
    with Tereus aiding Athens, marrying Progne under ominous signs, becoming father
    of Itys, and later hearing Progne ask to see her sister.'
  language: English
  quote_policy: summarized
