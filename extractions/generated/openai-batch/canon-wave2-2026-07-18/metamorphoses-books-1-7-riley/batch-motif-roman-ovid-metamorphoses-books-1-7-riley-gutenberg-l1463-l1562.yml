canonical_text:
  quote: ''
  summary: The commentary compares Ovid’s Deucalion flood with wider deluge traditions,
    especially the Genesis flood. In the narrated fable, Deucalion and Pyrrha survive
    the deluge in a little ship on Mount Parnassus, worship local divine powers, and
    are described as upright and pious. Jupiter sees the flooded world and the surviving
    pair, disperses the clouds, and Neptune commands Triton to sound a trumpet that
    recalls the waters. As the land reappears, Deucalion laments the empty world and
    addresses Pyrrha as both sister and wife, saying that the mortal race remains
    in them alone.
  language: English
  quote_policy: summarized
