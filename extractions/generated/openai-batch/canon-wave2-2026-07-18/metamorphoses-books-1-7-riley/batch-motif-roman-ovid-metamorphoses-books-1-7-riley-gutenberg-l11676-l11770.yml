canonical_text:
  quote: ''
  summary: After Theseus escapes death and is recognized by his father, Ægeus celebrates
    with sacrifices and the people praise Theseus for defeating a series of dangerous
    beings and robbers. The civic joy is interrupted by the news that Minos is preparing
    war to avenge Androgeus. Minos gathers island allies and conquests, and the passage
    also reports a treacherous woman who betrayed a citadel for gold and was transformed
    into a gold-loving jackdaw.
  language: English
  quote_policy: summarized
