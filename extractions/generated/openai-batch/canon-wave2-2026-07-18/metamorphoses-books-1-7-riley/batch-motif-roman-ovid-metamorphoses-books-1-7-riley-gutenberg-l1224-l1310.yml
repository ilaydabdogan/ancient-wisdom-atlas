canonical_text:
  quote: ''
  summary: An explanatory note compares Ovid's deluge tradition and the figure of
    one just man with Genesis and Noah. The fable narrates Jupiter's visit to Lycaon's
    Arcadian palace, Lycaon's test of the divine visitor by murdering and cooking
    a hostage, Jupiter's fiery destruction of the house, Lycaon's transformation into
    a wolf, and Jupiter's declaration that wider mankind deserves vengeance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The explanatory note says Ovid follows a prevailing tradition that closely
    adheres to Scripture concerning divine punishment of the earth by a deluge.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The explanatory note says the King of heaven calls the Gods to a grand council
    to deliberate punishment of mankind for wickedness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The explanatory note cites Genesis as saying God saw human wickedness and
    resolved to destroy humans, beasts, creeping things, and birds.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The explanatory note says tradition preserved the fact that amid universal
    corruption there was at least one just man, and that it attributed to Deucalion
    the merit belonging to Noah.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The fable summary describes Lycaon, king of Arcadia, testing whether his guest
    is Jupiter by having a hostage's body prepared and served, after which the god
    changes him into a wolf.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Jupiter passes Arcadian mountains and groves and enters the inhospitable abode
    of the Arcadian tyrant as twilight brings on night.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Jupiter gives a signal that a god has arrived; the people begin adoration,
    while Lycaon derides their supplications and proposes a test.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Lycaon prepares to destroy Jupiter unexpectedly while he is asleep.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lycaon cuts the throat of a hostage, boils part of the limbs, roasts part
    over fire, and places them on the table.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Jupiter uses avenging flames to overthrow the house upon the household gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Lycaon flees to the countryside, howls, fails to speak, and turns his desire
    for slaughter against sheep.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Lycaon's garments change into hair and his arms into legs; he becomes a wolf
    while retaining old traits such as hoariness, violence of feature, bright eyes,
    and ferocity.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: Jupiter says one house has fallen but that more than one house deserves destruction,
    because Erinnys reigns wherever earth extends and men deserve vengeance.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: A footnote identifies Cyllene and Lycæus as Arcadian mountains sacred respectively
