canonical_text:
  quote: ''
  summary: 'The passage first adds an explanatory variant in which Mercury kills Argus
    after Hierax wakes him and changes Hierax into a spar-hawk. It then introduces
    Book II, Fable I: Phaëton seeks confirmation from Apollo that he is his son; Apollo
    swears by the Styx to grant a request; Phaëton asks to drive the solar chariot,
    with disastrous danger to the world. The narrative describes the radiant palace
    of the Sun, its cosmic carvings of sea, earth, heaven, and Zodiac signs, and Phaëton''s
    ascent to the palace. Phaëton approaches Phoebus, who sits among personified times
    and seasons, asks for proof of his parentage, receives an embrace and verbal recognition,
    and is promised any gift under a divine oath.'
  language: English
  quote_policy: summarized
