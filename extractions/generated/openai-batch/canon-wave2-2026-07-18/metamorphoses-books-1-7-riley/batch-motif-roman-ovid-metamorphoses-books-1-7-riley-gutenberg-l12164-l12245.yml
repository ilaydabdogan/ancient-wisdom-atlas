canonical_text:
  quote: ''
  summary: 'The passage first explains a rationalizing account of the Myrmidons as
    cave-dwelling or plague-surviving people later associated with ants by name. It
    then introduces and begins the tale of Cephalus and Procris: Cephalus resists
    Aurora, tests Procris in disguise, later receives from her a dog and a dart once
    given by Diana, and recounts how the divine Aurora carried him off while he was
    hunting and sent him back with an ominous warning about Procris.'
