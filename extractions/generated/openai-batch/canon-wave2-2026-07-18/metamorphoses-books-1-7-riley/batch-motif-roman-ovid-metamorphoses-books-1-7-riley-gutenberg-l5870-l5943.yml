  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says Bacchus smote Pentheus and axe-bearing Lycurgus and hurled
    the bodies of Etrurians into the sea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Bacchus is described with lynxes yoked to his chariot and followed by Bacchanals,
    Satyrs, and Silenus, amid youths, women, tambourines, cymbals, and pipe music.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The daughters of Minyas alone remain indoors, interrupt the festival with
    labor, and continue wool-carding, thread-twirling, weaving, and directing handmaids
