canonical_text:
  quote: ''
  summary: The passage introduces Book IV with the daughters of Minyas refusing Bacchic
    rites and occupying themselves indoors with textile work and storytelling. It
    summarizes the tale of Pyramus and Thisbe, describes the prescribed festival of
    Bacchus and his epithets, attributes, retinue, and punishments of impious figures,
    and lists several possible transformation stories before the narrator chooses
    the tale of a blood-changed tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The introductory fable summary says the daughters of Minyas do not celebrate
    Bacchus and instead pass the ceremonial time by telling stories, including the
    adventures of Pyramus and Thisbe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the summarized tale, Thisbe reaches the meeting place first, sees a lioness,
    hides in a cave, and drops her veil.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pyramus finds Thisbe's veil stained with blood, believes Thisbe is dead, and
    kills himself with his sword.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Thisbe returns from the cave, finds Pyramus in his blood, and kills herself
    with the same weapon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Alcithoë, daughter of Minyas, rejects the rites of Bacchus, denies that Bacchus
    is the offspring of Jupiter, and has her sisters as partners in impiety.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A priest orders women to lay aside their work, wear skins, loosen their hair-fillets,
    put garlands on their hair, and carry green thyrsi.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The priest warns that the deity's resentment will be severe if he is affronted.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Matrons and newly married women obey, put aside webs, work-baskets, and unfinished
