canonical_text:
  quote: ''
  summary: Perseus is borne by winds across the sky and stops in the western kingdom
    of Atlas. Atlas, fearing an oracle that a son of Jove would take gold from his
    tree, has walled his orchard and set a dragon to guard it. He refuses Perseus
    hospitality and tries to expel him. Perseus exposes Medusa's features, and Atlas
    is transformed into a mountain whose body becomes woods, ridges, summit, and stones,
    with heaven and stars resting on him.
  language: English
  quote_policy: summarized
