canonical_text:
  quote: ''
  summary: The passage first gives explanatory material on Europa’s genealogy, variant
    parentage, and the possible naming of Europe from Europa, including a poetic tale
    about Juno’s daughter stealing paint for Europa. It then summarizes and narrates
    Cadmus’s companions drawing water from the fountain of Mars, the dragon that guards
    it killing them, Cadmus discovering the bodies, fighting the dragon, and finally
    piercing its neck against an oak. The fable summary also states that Minerva advises
    Cadmus to sow the dragon’s teeth, producing armed men who kill one another except
    for five who help found Thebes.
  language: English
  quote_policy: summarized
