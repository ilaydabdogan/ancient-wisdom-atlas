canonical_text:
  quote: ''
  summary: The passage gives an explanatory account of Ino, Athamas, Nephele’s children,
    Melicerta, and related cult identifications, then narrates Cadmus and Hermione
    leaving Thebes for Illyria and being transformed into serpents after Cadmus reflects
    on the dragon he once killed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Athamas is described as son of Æolus and husband successively of Themisto,
    Ino, Nephele, and again Ino; his children include Helle and Phryxus by Nephele,
    and Learchus and Melicerta by Ino.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ino is said to have tried to destroy Nephele’s children; a famine at Thebes
    is attributed to parched seed, and a reported Delphic oracle says Nephele’s children
    must be sacrificed to remove the affliction.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Phryxus, warned of his stepmother’s designs, sails with his sister Helle toward
    Colchis; Helle dies in the passage associated with the Hellespont.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Athamas discovers Ino’s deceit, kills Learchus in rage, and pursues Ino; Ino
    flees with Melicerta and throws herself from a rock into the sea.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The explanation says a story was probably invented in which the gods changed
    Ino and Melicerta into sea deities named Leucothoë and Palæmon; it also notes
    later worship and Roman names Matuta and Portunus.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The explanation treats Ovid’s metamorphosis of some of Ino’s attendants into
    birds and others into rocks as a poetic way to say that some escaped and others
    died.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: Cadmus, described as son of Agenor and founder of Thebes, leaves his city
    with his exiled wife Hermione and reaches Illyria after family calamities.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Cadmus recalls piercing a dragon with his spear and sowing the dragon’s teeth
    in the ground; he asks to be made into a serpent if the gods are avenging that
    act.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: 'Cadmus is transformed into a serpent: his body lengthens, scales appear,
    his legs join into one tapering form, his tongue divides, and his speech becomes
    hissing.'
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Hermione asks why the gods do not turn her into a similar serpent; Cadmus,
    already partly transformed, licks her face, enters her bosom, embraces her, and
    reaches her neck.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Attendants are alarmed, but the two serpents soothe them, creep together into
    a nearby grove, do not shun or wound humankind, and remember what they once were.
  category: sequence
  evidence_refs:
  - ev:11
