canonical_text:
  quote: "“For ever may you live in that pool.”"
  summary: 'A speaker recounts a Lycian tradition: Latona, fleeing Juno with her divine
    twins and suffering thirst, asks countrymen for water at a lake. They refuse,
    threaten her, and muddy the water. Latona pronounces that they should live forever
    in the pool, and they are transformed into frogs. Footnotes add explanations and
    variant details concerning the Chimæra and a related account of Latona and the
    Lycian peasants.'
  language: English
  quote_policy: quoted
