canonical_text:
  quote: ''
  summary: 'The passage gives explanatory notes on Pyreneus, the Muses, Pierus, and
    the Pierides, then presents the opening of Calliope''s song: Ceres is praised
    as giver of agriculture and laws; Typhoeus is pinned beneath Sicily; Pluto surveys
    the island out of fear for the underworld; Venus commands Cupid to wound Pluto
    with an arrow so that Ceres''s daughter will be joined to him.'
  language: English
  quote_policy: summarized
