canonical_text:
  quote: "“they are no more two, and their form is twofold”"
  summary: Salmacis pretends to yield the place to the stranger but hides nearby while
    Hermaphroditus enters the pleasant water. She desires him, enters the stream,
    seizes him against his will, clings to him, and prays that they never be separated.
    The deities answer by uniting the two bodies into one twofold human shape. Hermaphroditus
    then asks his father and mother that any man entering the streams become half
    a man; the parents assent and taint the fountain with ambiguous drugs.
  language: English
  quote_policy: quoted
