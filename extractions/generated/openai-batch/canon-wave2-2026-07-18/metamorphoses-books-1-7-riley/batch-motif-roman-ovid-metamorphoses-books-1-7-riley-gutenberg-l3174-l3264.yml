canonical_text:
  quote: ''
  summary: The passage first gives explanatory and comparative interpretations of
    the Phaëton fable, including moral allegory, variant parentage, excessive heat,
    biblical and Egyptian parallels, and an astrological note. It then narrates Jupiter
    striking Phaëton with lightning to prevent universal destruction, the wreck of
    the solar chariot, Phaëton’s fall into the Eridanus, and the burial and mourning
    that follow. The fable heading also states that Phaëton’s sisters are transformed
    into poplars and their tears into amber.
  language: English
  quote_policy: summarized
