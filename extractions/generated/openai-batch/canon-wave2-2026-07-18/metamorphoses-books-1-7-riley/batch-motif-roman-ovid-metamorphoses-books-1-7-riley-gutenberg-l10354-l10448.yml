canonical_text:
  quote: ''
  summary: A prose explanation frames the Philomela and Progne story, followed by
    the episode in which Progne uses the nighttime rites of Bacchus to recover Philomela,
    brings her home, plans vengeance against Tereus, murders her son Itys with Philomela,
    cooks the body, serves it to the unsuspecting Tereus, and reveals the deed by
    words and by showing Itys's bloody head. The fable headnote also summarizes the
    later transformations of Progne, Philomela, and Tereus into birds.
  language: English
  quote_policy: summarized
