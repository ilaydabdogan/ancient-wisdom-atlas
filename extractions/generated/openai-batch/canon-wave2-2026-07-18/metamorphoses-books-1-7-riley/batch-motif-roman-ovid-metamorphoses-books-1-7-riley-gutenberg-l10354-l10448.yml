- id: obs:2
  text: The fable headnote states that Progne delivers Philomela from captivity, brings
    her to Tereus's court, murders Itys with Philomela, serves him to Tereus, flees
    Tereus's fury, and that the three are changed into birds.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the nighttime triennial festival of Bacchus, Progne dresses with vine leaves,
    deer skin, and a light spear, moves with followers through the woods, and pretends
    that her anger is Bacchic inspiration.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Progne reaches a lonely dwelling, shouts a Bacchic cry, breaks open the gates,
    seizes Philomela, covers her with Bacchic badges and ivy, and brings her across
    Progne's threshold.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Philomela shudders on entering Tereus's house; after Progne removes the ritual
    disguise, Philomela keeps her eyes down and uses her hand in place of speech because
    her tongue has been torn out.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Progne rejects tears as an adequate response and names possible acts of revenge
    against Tereus, including burning the palace, cutting his tongue, eyes, or genitals,
    or killing him with many wounds.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: When Itys comes to Progne, his affectionate greetings and kisses briefly move
    her to tears, but she then looks between him and Philomela and resolves that tenderness
    toward Tereus's child would be wrong.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Progne drags Itys to a remote part of the house, strikes him with a sword
    while he cries to his mother and clings to her, and Philomela cuts his throat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Progne and Philomela mangle Itys's body; some parts boil in cauldrons and
    others roast on spits, while the inner rooms stream with blood.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Progne sets the prepared meal before Tereus while he is unaware, falsely claims
