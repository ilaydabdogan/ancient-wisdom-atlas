canonical_text:
  quote: ''
  summary: Ino climbs an overhanging sea-rock and throws herself and her burden into
    the sea. Venus pities her kin and asks Neptune to make them deities; Neptune removes
    their mortality, changes their names and shapes, and makes them Palæmon and Leucothoë.
    Sidonian attendants mourn and reproach Juno, who transforms them into fixed rocks
    or birds. The included notes also summarize traditions about unburied spirits
    at the Styx, the Furies, and several punished underworld figures.
  language: English
  quote_policy: summarized
