canonical_text:
  quote: ''
  summary: Pentheus angrily questions Acœtes, who identifies himself and recounts
    his humble maritime background. Acœtes describes landing at Dia, where his crew
    brought a beautiful wine-heavy boy from lonely fields as a prize. Acœtes recognized
    something divine in the boy and opposed the crew’s greedy plan; Lycabas attacked
    him. Bacchus/Liber then spoke and asked that the ship be directed to Naxos, his
    home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pentheus looks at Acœtes in anger, threatens him with destruction as an example
    to others, and asks his name, parents, country, and reason for attending new sacred
    rites.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Acœtes answers without fear, gives his name, says Mæonia is his country, and
    says his parents were of humble station.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Acœtes says his father was a poor fisherman whose only trade involved line,
    hooks, rod, and streams, and that he left Acœtes no fields, flocks, or herds.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Acœtes says he learned to guide a ship’s helm and to observe constellations,
    winds, and suitable harbors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: While making for Delos, Acœtes lands at Dia, orders his men to fetch fresh
    water, surveys the breeze from an eminence, and returns to the vessel.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Opheltes, the chief mate, returns leading a beautiful boy whom he regards
    as a prize; the boy appears heavy with wine and sleep and follows with difficulty.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Acœtes examines the boy’s dress, looks, and gait, concludes that nothing in
    him seems mortal, says a deity is in that body, and prays for favor and pardon
    for the crew.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Dictys tells Acœtes to stop praying for the crew; named sailors and the rest
    approve, and the narration attributes their response to greed for booty.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Acœtes says he will not allow the ship to be damaged by the sacred freight
    and opposes the others at the entrance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Lycabas becomes enraged, seizes Acœtes by the throat, nearly throws him overboard,
    and Acœtes survives by grasping a rope; the crew approves.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Bacchus, identified by the narrator, speaks as if waking from wine-sleep and
    asks what the sailors are doing, how he came there, and where they intend to carry
    him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Proreus tells Bacchus to lay aside fear and name the desired port; Liber directs
    them to Naxos and says it is his home and will be hospitable.
  category: speech
  evidence_refs:
  - ev:9
