canonical_text:
  quote: ''
  summary: Tereus sails to the Piraeus and petitions his father-in-law to send Philomela
    to visit Progne. When Philomela appears richly adorned, Tereus becomes intensely
    desirous, considers gifts, corruption of attendants, or seizure, and disguises
    his own wishes as Progne's request. Philomela asks her father for permission to
    visit her sister; the father yields, a banquet follows, and Tereus remains sleepless
    with desire.
  language: English
  quote_policy: summarized
