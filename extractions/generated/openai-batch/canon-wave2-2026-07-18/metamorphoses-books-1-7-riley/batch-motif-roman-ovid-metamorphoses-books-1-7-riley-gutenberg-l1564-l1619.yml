  text: Themis is described as the daughter of Cœlus and Terra, and as instructing
    men to ask the Gods only for what was lawful and right.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The murex is identified as the shell-fish from which Tyrian purple was procured,
    and the note says Triton may have had his neck and shoulders studded with murex
    shells.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief Triton is described as the son of Neptune and Amphitrite, preceding
    Neptune and proclaiming his arrival by the sound of his shell.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Triton is described as having an upper body resembling a human being and lower
    parts ending in a fish tail.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The buccina is explained as a conch-shell horn or trumpet used to proclaim
