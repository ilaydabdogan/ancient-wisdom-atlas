canonical_text:
  quote: ''
  summary: Explanatory notes identify Themis as an earlier Delphic oracle figure;
    describe murex shells, Triton, and the conch-shell trumpet; gloss a retreat signal
    and Neptune restoring marine order; explain the kinship of Deucalion and Pyrrha;
    and allude to Prometheus creating humans from clay with stolen heavenly fire.
  language: English
  quote_policy: summarized
