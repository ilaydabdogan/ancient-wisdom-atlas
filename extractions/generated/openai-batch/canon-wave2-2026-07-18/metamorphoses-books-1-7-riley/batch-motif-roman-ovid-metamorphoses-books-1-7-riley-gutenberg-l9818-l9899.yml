canonical_text:
  quote: ''
  summary: The passage is a set of explanatory notes on Niobe and the opening of Latona's
    episode. It surveys variant ancient accounts of Niobe's parentage, children, their
    deaths, and her transformation into rock; it rationalizes Apollo's and Diana's
    arrows as poetic attributions of plague deaths; it mentions laurel branches as
    protective signs during plague; and it summarizes Latona's punishment of countrymen
    who deny and muddy pond water by transforming them into frogs.
  language: English
  quote_policy: summarized
