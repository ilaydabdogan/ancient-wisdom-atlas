- id: obs:1
  text: Pallas embroiders Athens, the dispute over the country's name, twelve celestial
    gods seated with Jupiter in the middle, Neptune producing a horse from rock, and
    Pallas producing an olive shoot from earth struck by her spear.
  category: action
  evidence_refs:
