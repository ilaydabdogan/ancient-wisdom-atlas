  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Arachne also depicts Neptune, Phoebus, Liber, and Saturn in varied forms or
    disguises, including bull, Enipeus, ram, steed, bird, dolphin, rustic, hawk, lion
    skin, shepherd, grapes, and horse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Pallas cannot blame Arachne's work, but grieves at its success, tears the
