  text: Pallas gives herself shield, lance, helmet, and Ægis in her embroidery, and
    the gods admire the olive; Victory is described as the end of that work.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Pallas adds four small corner scenes showing Rhodope and Hæmus as mountains,
    the Pygmæan matron changed to a crane, Antigone changed to a bird or white crane,
    and Cinyras weeping while embracing temple steps that had been his daughters'
    limbs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pallas surrounds the borders of her textile with olive and ends the work with
    her own tree.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Arachne, called the Mæonian Nymph, depicts Europa deceived by the form of
