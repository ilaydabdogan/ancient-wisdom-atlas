canonical_text:
  quote: and {as} a spider, she works at her web as formerly.
  summary: Pallas depicts the contest over Athens, divine spectators, Neptune's horse,
    her own olive, and warning examples of figures punished or transformed. Arachne,
    called the Mæonian Nymph, depicts Europa and a catalogue of gods using disguises
    or transformed forms to seize, deceive, or impregnate women. Pallas cannot fault
    the craft, tears the web, strikes Arachne, and after Arachne hangs herself, curses
    her to live hanging and changes her into a spider that continues weaving.
  language: English
  quote_policy: quoted
