canonical_text:
  quote: ''
  summary: Phaëton's uncontrolled solar chariot sets the world ablaze. Clouds, vegetation,
    cities, nations, mountains, rivers, and springs burn, smoke, boil, or dry out.
    Phaëton is overwhelmed by heat, smoke, darkness, and the motion of the winged
    steeds. The passage also gives etiological explanations for the complexion of
    the Æthiopians, Libya's dryness, and the Nile's hidden head and empty mouths.
  language: English
  quote_policy: summarized
