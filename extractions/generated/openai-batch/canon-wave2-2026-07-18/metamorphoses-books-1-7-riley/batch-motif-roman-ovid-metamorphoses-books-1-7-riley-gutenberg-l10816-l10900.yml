canonical_text:
  quote: ''
  summary: 'Translator footnotes explain background details for the beginning of Book
    VII: the Argo and Thessalian geography, Medea’s family and divinely inspired love
    for Jason, the Argonauts, Hecate’s genealogy and lunar identifications, Jason’s
    protective drug, the sacred field of Mars, dragon’s teeth, Lethean waters, and
    Jason’s native city of Iolcos.'
  language: English
  quote_policy: summarized
