canonical_text:
  quote: ''
  summary: 'The passage first gives explanatory notes on the ancient tradition that
    the Pygmies were in continual warfare with cranes, then discusses an etymological
    and narrative explanation for a crane-transformation fable involving Pygas and
    Œnoë/Gerane. It then introduces the Niobe episode: Theban women honor Latona,
    Niobe boasts against the goddess, Apollo and Diana avenge their mother by killing
    Niobe’s children, and Niobe is transformed into a statue. The opening narrative
    stresses Niobe’s failure to heed Arachne’s punishment and her pride in her offspring.'
  language: English
  quote_policy: summarized
