canonical_text:
  quote: ''
  summary: After Tereus realizes he has eaten his own son, he pushes away the table,
    invokes the Furies, laments himself as his son's sepulchre, and pursues the daughters
    of Pandion. The daughters are changed into winged birds, while Tereus is changed
    into the crested bird called epops. Pandion dies prematurely from the affliction
    and goes to Tartarus.
