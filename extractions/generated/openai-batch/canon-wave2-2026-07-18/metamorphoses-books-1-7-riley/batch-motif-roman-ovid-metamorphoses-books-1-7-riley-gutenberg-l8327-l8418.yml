canonical_text:
  quote: ''
  summary: The passage first gives an explanatory note that ancient authors accounted
    for Etna’s fires and earthquakes by saying a vanquished giant, Typhoeus or Enceladus,
    lay beneath the mountain. The fable then narrates Pluto’s seizure of Proserpina
    near Pergus, Cyane’s failed resistance and dissolution into water, Ceres’ restless
    search for her daughter with torches lit at Etna, and the beginning of the episode
    in which an old woman gives Ceres a barley drink before a boy mocks her.
  language: English
  quote_policy: summarized
