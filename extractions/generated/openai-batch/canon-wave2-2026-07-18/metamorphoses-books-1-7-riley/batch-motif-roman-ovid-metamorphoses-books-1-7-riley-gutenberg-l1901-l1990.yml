canonical_text:
  quote: ''
  summary: Apollo pursues Daphne, explaining that love drives him and identifying
    his divine powers. Daphne flees, calls on her father Peneus and on Earth for aid,
    and is transformed into a laurel tree. Apollo embraces the transformed tree, declares
    the laurel his own, assigns it ritual and civic honors, and the laurel appears
    to nod assent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Apollo addresses the fleeing nymph and says he is not an enemy, while also
    saying that love is the cause of his following her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Apollo compares Daphne's flight to prey animals fleeing predators, including
    lamb from wolf, deer from lion, and dove from eagle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Apollo identifies himself as served by Delphian land, Claros, Tenedos, and
    Patara; says Jupiter is his father; claims prophetic, musical, archery, and healing
    powers; and states that herbs cannot cure his love.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Daphne continues to flee while Apollo follows, and the narration says her
    beauty is increased by her flight.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chase is compared to a greyhound pursuing a hare in an open field.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Apollo is described as swifter because he is aided by the wings of love, and
    Daphne is described as fleeing in fear.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: When Daphne's strength is spent, she looks to the waters of Peneus and asks
    her father for aid if rivers have divine power.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Daphne asks Earth either to open and swallow her or to change the form that
    has caused her to be desired and harmed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After Daphne's prayer, her limbs become torpid, bark covers her breast, her
    hair becomes leaves, her arms become branches, her feet become roots, and a leafy
    canopy covers her features.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Apollo touches the tree and perceives a breast still throbbing beneath the
    new bark.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Apollo embraces and kisses the branches as though they were limbs, while the
    wood shrinks from his kisses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Apollo declares that because Daphne cannot be his wife, she will at least
    be his tree, the laurel.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Apollo assigns the laurel to his hair, lyre, and quiver, and says it will
