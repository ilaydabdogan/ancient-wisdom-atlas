canonical_text:
  quote: ''
  summary: After a Muse speaks, Pallas hears articulate voices from nine magpies in
    the boughs. Urania explains that these birds were the Pierides, daughters of Pierus
    and Evippe, who challenged the Muses to a singing contest judged by Nymphs. The
    first challenger sang of Typhoeus terrifying the gods, who fled to Egypt and hid
    in animal forms. Pallas asks to hear the Muses' answer, and Calliope prepares
    to sing with ivy in her hair and lyre strings tuned.
  language: English
  quote_policy: summarized
