canonical_text:
  quote: ''
  summary: Ceres searches for Proserpine, receives signs and testimony about her daughter’s
    presence in Pluto’s realm, devastates Sicilian agriculture in grief and anger,
    appeals to Jupiter, and receives a conditional ruling about Proserpine’s return.
    The summary portion also states that pomegranate seeds prevent full return, Ascalaphus
    is changed into an owl, the Sirens receive wings to search, and Proserpine’s year
    is divided between earth and the Infernal Regions.
  language: English
  quote_policy: summarized
