  quote: ''
  summary: 'The speaker announces a poem about forms changed into new bodies and invokes
    the gods. The passage then describes the first condition of the universe as Chaos:
    sea, earth, heaven, air, and opposing qualities are intermixed. God and bounteous
    Nature end this disorder by separating heaven, earth, waters, and air, assigning
    the fiery heaven, air, earth, and waters to their proper regions.'
  language: English
