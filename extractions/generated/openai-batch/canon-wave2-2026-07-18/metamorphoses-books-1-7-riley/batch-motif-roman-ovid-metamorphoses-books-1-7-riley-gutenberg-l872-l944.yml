canonical_text:
  quote: ''
  summary: The passage first gives an explanatory comparison between Ovid's formation
    of man, Genesis, Prometheus, Minerva, and several proposed Scriptural identifications.
    It then introduces the first of the four ages of the world, the Golden Age, characterized
    by innocence, justice, absence of law and war, social safety, and spontaneous
    abundance from an unploughed Earth.
  language: English
