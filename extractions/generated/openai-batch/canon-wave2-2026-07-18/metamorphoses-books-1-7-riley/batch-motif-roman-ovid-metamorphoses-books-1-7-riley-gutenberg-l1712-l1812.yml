canonical_text:
  quote: ''
  summary: The passage explains Deucalion’s flood tradition, refuge on Mount Parnassus,
    the stone-or-child etymology, and Deucalion’s later honors. It then narrates Earth
    producing creatures and monsters from heated post-flood mud, including the serpent
    Python. Apollo kills Python with arrows and institutes the Pythian games as a
    memorial, with notes on the Nile analogy and variant traditions about the games.
  language: English
