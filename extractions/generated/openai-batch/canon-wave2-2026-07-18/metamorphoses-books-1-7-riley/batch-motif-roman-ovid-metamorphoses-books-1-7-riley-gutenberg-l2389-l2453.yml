canonical_text:
  quote: ''
  summary: 'The passage first offers an editorial explanation that myths may derive
    from historical material altered by tradition and poetic invention. It then recounts
    the fable of Pan and Syrinx: Syrinx, a Naiad of Arcadia devoted to Diana-like
    virginity, flees Pan’s pursuit until the river Ladon blocks her. She asks her
    Naiad sisters to change her; Pan grasps reeds instead of her body, hears wind
    sounding through them, and makes a seven-piped reed instrument that preserves
    Syrinx’s name.'
  language: English
  quote_policy: summarized
