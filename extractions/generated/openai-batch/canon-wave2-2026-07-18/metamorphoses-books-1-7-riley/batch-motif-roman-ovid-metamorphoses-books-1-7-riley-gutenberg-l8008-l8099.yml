canonical_text:
  quote: ''
  summary: The passage includes explanatory notes on the Andromeda sea-monster, the
    supposed petrifying power of Perseus, and the setting of the next fable. In the
    fable, Polydectes denies Perseus’s victory over Medusa and is turned to stone
    by Medusa’s face. Minerva travels to Mount Helicon to visit the Muses, learns
    that Pegasus created a new spring with his hoof after springing from Medusa’s
    blood, and hears a Muse recount how Pyreneus deceitfully hosted the Muses, attempted
    violence against them, and died while trying to follow their winged escape.
  language: English
  quote_policy: summarized
