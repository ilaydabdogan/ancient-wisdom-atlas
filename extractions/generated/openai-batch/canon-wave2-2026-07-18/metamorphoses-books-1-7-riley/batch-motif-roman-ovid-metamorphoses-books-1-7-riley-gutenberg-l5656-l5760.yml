canonical_text:
  quote: ''
  summary: The passage compares a man’s torn limbs to autumn leaves stripped from
    a lofty tree, then says the Ismenian matrons, warned by such examples, adopt the
    new worship by offering frankincense and honoring sacred altars. The accompanying
    notes identify mythic persons and cult objects connected with Bacchus, including
    Pentheus’ genealogy, Theban descent from dragon teeth, tambourines, the thyrsus,
    Acrisius’ refusal of Bacchic rites, Bacchus’ assumed name Acœtes, and several
    constellation traditions involving Amalthea, Taygete, and the Hyades.
  language: English
  quote_policy: summarized
