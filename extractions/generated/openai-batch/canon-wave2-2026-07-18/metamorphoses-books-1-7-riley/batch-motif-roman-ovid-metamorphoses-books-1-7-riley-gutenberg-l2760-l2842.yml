canonical_text:
  quote: ''
  summary: The father prepares Phaëton for the solar chariot, warns him to keep a
    middle celestial course and to restrain the horses, and urges him to reconsider.
    Phaëton takes the reins; the horses of the sun set out after Tethys opens the
    barriers. Because the driver is too light and inexperienced, the chariot leaves
    its usual path. Phaëton panics at the height, at strange heavenly forms, and especially
    at the Scorpion, drops the reins, and the horses run uncontrolled through pathless
    regions of the sky.
  language: English
  quote_policy: summarized
