canonical_text:
  quote: ''
  summary: The explanatory note describes ancient philosophical and poetic accounts
    of Chaos as pre-existent matter ordered by a divine architect and compares this
    tradition with Genesis, Sanchoniatho, and Greek borrowing. The following fable
    summary and narrative describe a deity dividing and arranging the world into globe,
    waters, landforms, zones, atmosphere, winds, firmament, stars, and living inhabitants;
    the summary also states that Prometheus forms a human body from earth and water
    and Minerva animates it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The explanation says ancient philosophers supposed pre-existent matter that
    later received form and order from a powerful cause, and describes God as architect
    rather than creator of the universe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The explanation identifies this pre-existent matter with Chaos sung by poets
    and says Hesiod was the first to mention it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The explanation states that this system was a confused and disfigured tradition
    of the creation of the world as mentioned by Moses, and says Genesis 1-2 illuminates
    the mythological system of world formation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The explanation reports that Sanchoniatho is associated with ideas concerning
    Chaos, a Genesis 1:2 phrase about darkness over the deep, a priest named Jerombaal,
    a Phoenician original, a translation by Philo Judaeus, and doubts about that translation's
    authenticity.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fable summary states that God gives form and regularity to the universe,
    while Prometheus molds earth tempered with water into a human form animated by
    Minerva.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A deity divides the separated mass into distinct members and gathers it into
    the form of a vast globe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The deity commands the sea to surround the globe and adds springs, pools,
    lakes, and bounded rivers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The deity extends plains, lowers valleys, covers woods with green leaves,
    and raises craggy mountains.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The deity distinguishes the enclosed earth into five zones or climates: a
    hot middle zone, two snowy zones, and two temperate zones.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Air hangs over the earth, and vapors, clouds, thunder, lightnings, and cold-bringing
    winds are assigned stations.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'Four winds occupy directional regions: Eurus toward the east, Zephyrus toward
    the west, Boreas toward the north, and the South Wind in the cloudy, rainy opposite
    quarter.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The firmament is placed above the atmospheric region and is described as clear,
    without gravity, and without the dregs of earth.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the separations are fixed, stars formerly hidden beneath Chaos begin
