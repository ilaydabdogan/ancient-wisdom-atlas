canonical_text:
  quote: ''
  summary: The passage first gives explanatory rationalizations of the Sun's discovery
    of the Mars and Venus adultery story. It then narrates Clytie's jealousy of Leucothoë,
    her disclosure of Leucothoë's encounter with the Sun to Leucothoë's father, the
    father's burial of Leucothoë alive, the Sun's unsuccessful attempt to revive her,
    Leucothoë's transformation into a frankincense tree, the Sun's rejection of Clytie,
    and Clytie's wasting away and transformation into a flower that still turns toward
    the Sun.
  language: English
  quote_policy: summarized
