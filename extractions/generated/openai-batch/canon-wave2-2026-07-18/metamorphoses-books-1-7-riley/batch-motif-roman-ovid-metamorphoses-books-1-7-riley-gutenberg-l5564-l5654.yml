canonical_text:
  quote: ''
  summary: Acœtes recounts that sailors deceived Bacchus at sea and steered away from
    the promised destination; the ship became motionless, Bacchic plants and visionary
    animals appeared, and the sailors were transformed into aquatic forms while Acœtes
    alone was spared. Pentheus rejects the account, orders Acœtes imprisoned and tortured,
    but the prison opens by itself. Pentheus then goes to Cithæron to observe Bacchic
    rites and is attacked, dismembered, and beheaded by his frenzied mother and female
    kin, who mistake him for a boar.
  language: English
  quote_policy: summarized
