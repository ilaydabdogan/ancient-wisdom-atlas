canonical_text:
  quote: ''
  summary: 'The explanatory note reports two ancient interpretations of the story
    of Orithyïa: Plato treats it as an allegory of accidental drowning after being
    blown into the sea by wind, while Apollodorus and Pausanias treat it as based
    on Boreas seizing Orithyïa near the Ilissus and carrying her to Thrace, where
    she becomes mother of the twins Calaïs and Zethes. The note adds that these twins
    later deliver Phineus from Harpies who steal food from his table.'
  language: English
  quote_policy: summarized
