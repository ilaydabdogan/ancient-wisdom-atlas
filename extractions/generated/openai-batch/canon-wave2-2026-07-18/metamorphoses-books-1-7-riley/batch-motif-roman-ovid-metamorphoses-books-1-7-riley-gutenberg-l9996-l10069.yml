- id: obs:4
  text: During the punishment, Marsyas' skin is stripped away, and blood, nerves,
    veins, bowels, and lungs are described as exposed.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The inhabitants of the country, Fauns, woodland deities, Satyrs, Olympus,
    Nymphs, and mountain herders mourn Marsyas.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The earth receives the falling tears, turns them into a stream, and sends
    forth a clear Phrygian river named Marsyas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: After these narratives, the people return to present events and mourn Amphion
