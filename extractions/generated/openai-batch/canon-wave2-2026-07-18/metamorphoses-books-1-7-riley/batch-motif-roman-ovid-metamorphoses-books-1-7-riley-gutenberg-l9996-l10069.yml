canonical_text:
  quote: ''
  summary: 'The passage begins with an explanatory note suggesting possible origins
    and functions of a preceding Latona story, including an etiological account of
    frogs. It then recounts the fable of Marsyas: the Satyr challenges Apollo on the
    flute, loses, is flayed alive, and is mourned by local beings. The tears shed
    for Marsyas are absorbed by the earth and become a Phrygian river bearing his
    name. The passage then returns to mourning for Amphion and his race and notes
    Pelops'' ivory shoulder, explained as a divine repair after his body was cut apart
    by his father. Footnotes report ancient variants and iconographic traditions concerning
    Marsyas and Olympus.'
  language: English
  quote_policy: summarized
