canonical_text:
  quote: "“Now thou mayst tell, if tell thou canst, how that I was seen by thee without
    my garments.”"
  summary: A hunting leader halts the day's hunt near a blood-stained mountain. In
    the sacred valley of Gargaphie, Diana bathes in a natural grotto with nymph attendants.
    The grandson of Cadmus wanders into the grotto, sees Diana without garments, and
    is sprinkled with water by her. She transforms him into a stag-like form while
    his understanding remains. He flees, sees his horns reflected in the stream, cannot
    speak, and is detected by the hunting dogs, who begin pursuit.
  language: English
  quote_policy: quoted
