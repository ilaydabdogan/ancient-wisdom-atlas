canonical_text:
  quote: ''
  summary: The explanatory note identifies Centaurs as half-human, half-horse monsters
    and rationalizes them as early horsemen; it presents Chiron as a learned teacher
    of medicine, music, astronomy, heroes, and the constellations used by the Argonauts.
    The fable then introduces Mercury’s love for Herse, his approach to Aglauros for
    access, Aglauros’s demand for gold, Minerva’s anger over Aglauros’s earlier profane
    viewing of hidden mysteries, and Minerva’s visit to the dark cave-abode of Envy.
  language: English
  quote_policy: summarized
