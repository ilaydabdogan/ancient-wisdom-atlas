  quote: ''
  summary: Explanatory notes on Triptolemus, Ceres's mysteries at Eleusis, the possible
    Egyptian source of the cult or agricultural methods, rationalizations of winged
    dragons and Lyncus's transformation, an oracle requiring Erectheus to sacrifice
    Proserpine, lists of early initiates, and the later division of Athenian kingship
    and Eleusinian hierophancy.
  language: English
  quote_policy: summarized
