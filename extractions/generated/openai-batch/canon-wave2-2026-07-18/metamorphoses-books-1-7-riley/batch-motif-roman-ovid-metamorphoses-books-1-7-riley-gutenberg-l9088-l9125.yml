  text: Triptolemus is said to have reigned at Eleusis when the mysteries of Ceres
    were established there.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Philochorus is cited for Triptolemus traveling by ship, carrying corn to different
    countries, and introducing the worship of Ceres as her priest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage refers to a story in which Ceres nursed Triptolemus with her own
    milk and purified him by fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The explanation contrasts an agricultural reading with a cultic reading, saying
    the story more probably concerns the introduction of Ceres's mysteries, possibly
    from Egypt, while improved tilling may also have come through contact with Egypt.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says Triptolemus's travel dangers probably gave rise to the story
    of Lyncus, whose cruelty caused him to be changed into a lynx.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The winged dragons associated with Triptolemus are explained either through
    an equivocal Phoenician word or through Philochorus's report that the ship was
    called a flying dragon because it bore a dragon figure on its prow.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A fragment of Stobaeus is cited for an oracle telling Erectheus that he would
