canonical_text:
  quote: ''
  summary: 'The passage first gives an editor''s explanation of the Actaeon-Diana
    fable and summarizes variant ancient accounts. It then introduces and begins the
    Semele episode: Juno, angry that Semele is pregnant by Jupiter, resolves to destroy
    her, assumes the form of Semele''s nurse Beroë, persuades Semele to ask Jupiter
    to come in the majesty in which he comes to Juno, and Jupiter swears by the Stygian
    stream to grant the unnamed request.'
  language: English
  quote_policy: summarized
