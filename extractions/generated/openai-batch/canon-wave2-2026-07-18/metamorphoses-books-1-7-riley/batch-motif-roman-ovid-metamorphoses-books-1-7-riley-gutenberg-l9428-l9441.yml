canonical_text:
  quote: ''
  summary: 'Three footnotes explain mythic references: Saturn as father of the Centaur
    Chiron by Phillyra; Arachne’s uncomplimentary choice of subjects concerning the
    Gods; Clarke’s rendering of “improba”; and the “Hecatean Herb” as aconite or wolfsbane,
    linked either to Hecate’s poisonous herb knowledge or, in some accounts, to foam
    from Cerberus when Hercules dragged him from the infernal regions.'
