canonical_text:
  quote: ''
  summary: Ceres wishes to recover her daughter, but the Fates do not allow it because
    Proserpine has broken her fast by eating seven pomegranate grains. Ascalaphus,
    who alone saw this, discloses it and prevents her return; the Queen of Erebus
    changes him into an owl. The daughters of Achelous are described as maidens with
    bird feathers and feet because, after searching for Proserpine in vain, they wished
    for wings to move over the waves; their faces and voices remain human. The footnotes
    add ritual and textual variants concerning the pomegranate, the number of grains,
    the discoverer of Proserpine's fate, and Ascalaphus' punishment.
  language: English
  quote_policy: summarized
