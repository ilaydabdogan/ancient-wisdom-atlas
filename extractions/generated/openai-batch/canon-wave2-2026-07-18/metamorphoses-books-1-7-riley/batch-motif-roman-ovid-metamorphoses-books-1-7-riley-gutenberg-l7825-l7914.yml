canonical_text:
  quote: ''
  summary: Perseus is attacked in a household battle by Phineus and his followers.
    Overwhelmed by numbers, he warns his friends to turn away and uses the head of
    the Gorgon/Medusa to turn attackers into stone. Phineus pleads for life, but Perseus
    petrifies him as a lasting monument. Perseus then enters his native city with
    his wife and attacks Proetus, who had seized Acrisius's citadel, and the Gorgon's
    eyes prevail against him.
  language: English
  quote_policy: summarized
