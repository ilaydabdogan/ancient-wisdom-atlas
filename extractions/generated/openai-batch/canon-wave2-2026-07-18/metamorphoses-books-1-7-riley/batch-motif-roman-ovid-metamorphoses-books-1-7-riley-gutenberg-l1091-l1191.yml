canonical_text:
  quote: ''
  summary: An explanatory note distinguishes the war of the Giants from Jupiter's
    war with the Titans and speculates about Biblical analogues. The fable then describes
    Jupiter seeing human crimes, summoning a divine council by the Milky Way at his
    heavenly palace, and declaring that mortals must be cut off because of widespread
    guilt and Lycaon's offense. The gods assent to vengeance, and Jupiter recounts
    having descended from Olympus in human form to inspect the earth. Footnotes explain
    the Milky Way as a road to Jupiter's palace, mention a myth of Juno's milk and
    Hercules, and distinguish ranks of deities.
  language: English
  quote_policy: summarized
