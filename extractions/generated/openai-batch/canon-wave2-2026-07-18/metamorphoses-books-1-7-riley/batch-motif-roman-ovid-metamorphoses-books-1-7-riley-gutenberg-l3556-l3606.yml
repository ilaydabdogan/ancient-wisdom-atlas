canonical_text:
  quote: ''
  summary: The sea gods grant a request, and the daughter of Saturn travels through
    the liquid air in a chariot with variegated peacocks. The passage explains that
    peacocks were recently tinted after the killing of Argus and that the raven, formerly
    white or silver, became black because of its chattering tongue. Coronis is described
    as the beautiful Larissaean beloved of the Delphian God while she remained chaste;
    the bird of Phoebus discovers her infidelity and flies to report it. A prattling
    crow follows and warns that the errand is fruitless and that its presaging voice
    should not be despised. Footnotes add translation notes and explanatory material,
    including a rationalizing account of Calisto and a note on Erymanthus.
  language: English
  quote_policy: summarized
