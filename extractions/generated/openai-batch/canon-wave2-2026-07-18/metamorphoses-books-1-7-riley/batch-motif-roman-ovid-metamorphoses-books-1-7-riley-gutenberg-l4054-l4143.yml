canonical_text:
  quote: ''
  summary: The passage gives a rationalizing explanation of Mercury, Herse, and Aglauros,
    then narrates how Pallas sends the personified Envy to infect Aglauros with jealousy
    of Herse. Envy contaminates Aglauros with poison and painful images of Herse's
    fortune. Aglauros blocks Mercury at the threshold, and when Mercury opens the
    door with his wand she becomes immobile and turns into a bloodless stone statue.
  language: English
  quote_policy: summarized
