canonical_text:
  quote: ''
  summary: 'Book VI synopsis describing a sequence of mythic episodes: Pallas and
    Arachne contest weaving and Arachne becomes a spider; Niobe exalts her lot above
    Latona’s and loses her children before becoming rock; other remembered punishments
    and transformations include Lycian rustics into frogs and Marsyas flayed by Apollo;
    Tereus, Progne, Philomela, Pandion, Erectheus, Orithyia, Boreas, Calais, and Zethes
    are introduced through violence, grief, transformation, succession, and genealogy.'
  language: English
  quote_policy: summarized
