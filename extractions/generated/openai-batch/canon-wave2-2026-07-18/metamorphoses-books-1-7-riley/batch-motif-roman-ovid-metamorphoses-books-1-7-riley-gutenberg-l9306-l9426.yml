canonical_text:
  quote: ''
  summary: A series of explanatory footnotes identifies places, ritual objects, gods,
    and mythic figures connected with the Arachne episode and related mythological
    examples. The notes describe divine revelation before Arachne, dyeing vessels,
    the Rock of Mars, the twelve consenting gods, and multiple stories of pride, divine
    punishment, divine shapeshifting, sexual violence or seduction by gods, transformations
    into animals, stone, temple steps, and constellation placement.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Persons from Mygdonia are described as likely visitors who came to see Arachne's
    works; many present honored the revealed goddess, while Arachne alone remained
    unmoved.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Brazen cauldrons are identified as vessels used for dyeing, preferred over
    iron vessels.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Rock of Mars is identified with the Areiopagus, said to be named from
    the trial of Mars after Neptune accused him of slaying Halirrothius.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The twelve consenting gods are listed as Vulcan, Mars, Sol, Neptune, Jupiter,
    Hermes, Vesta, Diana, Ceres, Juno, Minerva, and Venus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A rendered line describes a female figure making a wild horse spring from
    an opening in a rock.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The queen of the Pygmies, named Gerane by Aelian and Pygas by other writers,
    was worshipped as a goddess, despised the worship of deities, and was changed
    into a crane, an enemy of the Pygmies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Antigone boasted that she resembled Juno because of her beautiful hair; Juno
    changed her hair into serpents, and the deities later transformed her into a stork.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Daughters of Cinyras boasted that they surpassed Juno in beauty; Juno changed
    them into temple steps and transformed Cinyras into stone while he embraced the
    steps.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Asterie was ravished by Jupiter in the form of an eagle; while fleeing his
    wrath, she was changed by him into a quail and afterward into a stone.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Antiope was seduced by Jupiter in the form of a satyr and bore two sons, Zethus
    and Amphion.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Jupiter changed himself into fire, or according to some into an eagle, to
    seduce Aegina, who became the mother of Aeacus by him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Mnemosyne became the mother of the Nine Muses after being seduced by Jupiter.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: Proserpine is explained as called Deois from her mother Ceres, with an etymological
    note tied to Ceres seeking her daughter.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: Canace or Arne, daughter of Aeolus, was seduced by Neptune under the form
    of a bull.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: Neptune took the form of the river Enipeus and committed violence upon Iphimedeia,
    who became mother of Otus and Ephialtes by him.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: Neptune changed Theophane into a sheep and himself into a ram, begetting the
    ram with the golden fleece.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: By Neptune, Ceres became mother either of the horse Arion or, according to
    some, of an unnamed daughter.
  category: relationship
  evidence_refs:
  - ev:17
- id: obs:18
  text: Medusa is said by some to be the mother of Pegasus by Neptune, while another
    account says Pegasus sprang from her blood when Perseus slew her.
  category: sequence
  evidence_refs:
  - ev:18
- id: obs:19
  text: Melantho is described as mother of Delphus by Neptune.
  category: relationship
  evidence_refs:
  - ev:19
- id: obs:20
  text: Erigone, daughter of Icarus, was placed among the constellations.
  category: sequence
  evidence_refs:
  - ev:20
