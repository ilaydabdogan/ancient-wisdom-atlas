canonical_text:
  quote: ''
  summary: The explanatory note rationalizes traditions about Phaeton's grieving relatives
    becoming amber-distilling trees and Cycnus becoming a swan. In the fable, Jupiter
    surveys and repairs the world after fire, sees Callisto in Arcadia, assumes Diana's
    form to approach her, and commits violence against her. Callisto later rejoins
    Diana's company in shame; during bathing, her condition is exposed, and Diana
    expels her from the sacred springs and from her train.
  language: English
  quote_policy: summarized
