canonical_text:
  quote: ''
  summary: 'The passage first gives explanatory interpretations for a Carian fountain
    reputed to change men into women. It then narrates Bacchus punishing the daughters
    of Minyas: their weaving becomes ivy and vine, the house fills with supernatural
    signs, and the sisters become bats. A following synopsis and opening scene introduce
    Juno’s anger against Ino, her plan to use madness as vengeance, and a mapped description
    of the route and city of the underworld, including Styx, Pluto’s palace, judgment,
    and punishments of shades.'
  language: English
  quote_policy: summarized
