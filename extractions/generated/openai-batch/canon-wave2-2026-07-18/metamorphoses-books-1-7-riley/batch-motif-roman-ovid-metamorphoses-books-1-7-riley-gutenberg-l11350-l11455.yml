candidate_motifs:
- id: motif:1
  label: rejuvenation of an aged body by blood or potion
  taxonomy_refs:
  - death_rebirth
  basis: The explanation treats Æson’s restoration to youth as either youthful blood
    restoring the decrepit and aged or Medea’s plant-based potion giving new spirits
    and strength.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage concerns renewed youth rather than literal death and rebirth;
    the taxonomy reference is approximate.
- id: motif:2
  label: poisoned remedy sought for a parent
  taxonomy_refs: []
  basis: Pelias’s daughters seek Medea’s aid for their father, but the explanation
    says Medea may have substituted venomous herbs that immediately killed him.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No supplied taxonomy family precisely matches this pattern.
- id: motif:3
  label: dragon-borne aerial escape after violent revenge
  taxonomy_refs:
  - serpent
  - ascent
  - departure
  basis: Medea escapes punishment by mounting into the air with winged dragons and
    later flees Jason on Titanian dragons after killing the bride, king, and her sons.
  evidence_refs:
  - ev:4
  - ev:8
  confidence: high
  cautions: The dragons function as aerial conveyance; the serpent taxonomy is supported
    by dragon/serpent equivalence in the note but remains broad.
- id: motif:4
  label: destructive revenge by fire, drugs, and sword
  taxonomy_refs: []
  basis: Medea’s revenge uses Colchian drugs, a burning royal house, and the sword
    that kills her sons.
  evidence_refs:
  - ev:3
  - ev:8
  confidence: high
  cautions: Although fire is central, the burning is local to a palace rather than
    a world-destroying fire.
- id: motif:5
  label: flood survivor escapes by wings
  taxonomy_refs:
  - flood_and_renewal
  - ascent
  basis: Cerambus is lifted on wings and escapes when the earth is covered by the
    flood of Deucalion; the note gives winged transformation variants.
  evidence_refs:
  - ev:4
  - ev:9
  confidence: high
  cautions: The passage emphasizes escape from flood, not renewal after flood.
- id: motif:6
  label: metamorphosis into birds or winged forms
  taxonomy_refs:
  - shapeshifter
  - ascent
  basis: 'The passage repeatedly names figures who become or use winged forms: Cerambus,
    a dove from a daughter’s body, a boy transformed into a swan, Combe with wings,
    a royal couple as birds, Phineus and Periphas flying, and Polypemon’s granddaughter
    on new wings.'
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The individual transformations differ in cause and narrative context.
- id: motif:7
  label: human or object metamorphosis into animal form
  taxonomy_refs:
  - shapeshifter
  - serpent
  basis: The passage includes a stone dragon associated with a transformation into
    dragon or serpent, an ox disguised as a stag, horned matrons, a dove, a swan,
    birds, and a sea-calf transformation.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:10
  - ev:11
  confidence: high
  cautions: Some cases are brief allusions or footnote explanations rather than full
    narratives.
