canonical_text:
  quote: ''
  summary: The passage first gives explanatory interpretations of Medea’s restoration
    of Æson’s youth and her possible poisoning of Pelias. It then narrates Medea’s
    flight from Corinth after killing Pelias, burning Creon’s palace, killing her
    sons by Jason, and escaping on winged dragons. Her aerial route passes places
    associated with floods, transformations into birds and animals, divine punishments,
    dangerous gazes, spontaneous generation from rain-fed mushrooms, and other metamorphic
    stories.
  language: English
  quote_policy: summarized
