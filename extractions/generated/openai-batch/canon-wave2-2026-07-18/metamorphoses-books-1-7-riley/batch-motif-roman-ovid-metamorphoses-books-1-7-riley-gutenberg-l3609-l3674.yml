canonical_text:
  quote: "“Thou wilt find that my fidelity was my ruin.”"
  summary: The passage first explains Callisto’s association with the Bear constellation
    and Arcas with the Lesser Bear. It then gives the fable of a virgin associated
    with Apollo who becomes a crow after reporting to Minerva that Aglauros opened
    the basket containing the motherless child Ericthonius and a dragon. The narrator
    also recounts being pursued by the God of the Ocean and being transformed into
    a black-feathered bird with Minerva’s aid.
  language: English
  quote_policy: quoted
