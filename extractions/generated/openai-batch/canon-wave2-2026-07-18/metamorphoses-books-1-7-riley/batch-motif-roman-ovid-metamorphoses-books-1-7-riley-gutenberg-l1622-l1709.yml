canonical_text:
  quote: ''
  summary: A prefatory explanation describes Jupiter, Neptune, and Pluto as possibly
    deified brother-kings among whom the world was divided, with Neptune receiving
    the sea. The main passage narrates Deucalion and Pyrrha consulting Themis after
    the loss of the human race; Themis gives an obscure command to throw behind them
    the bones of their great mother. Deucalion interprets this as stones from Earth,
    and the stones they cast become men and women.
  language: English
  quote_policy: summarized
