canonical_text:
  quote: ''
  summary: Book VII opens with Jason and the Argonauts arriving in Colchis to seek
    the Golden Fleece. Conditions involving dangerous labors are set. Medea, daughter
    of Aeetes, experiences love for Jason as a force opposed to reason. She debates
    aiding him against bulls, earth-born enemies, and a dragon; considers betrayal
    of her father and homeland; imagines securing Jason by oath and marriage; weighs
    departure with him over perilous seas; and finally reproaches herself for giving
    a respectable name to guilt.
  language: English
  quote_policy: summarized
