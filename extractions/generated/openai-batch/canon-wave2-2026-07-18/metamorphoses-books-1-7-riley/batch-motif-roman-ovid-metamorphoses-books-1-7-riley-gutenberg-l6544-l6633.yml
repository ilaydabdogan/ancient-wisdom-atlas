canonical_text:
  quote: ''
  summary: 'The passage gives explanatory notes on several transformations and origins,
    then begins the story of Salmacis and Hermaphroditus: a nymph of a spring desires
    the wandering youth Hermaphroditus, addresses him with erotic and marital language,
    and persists after his rejection. The introductory fable summary states that she
    later seizes him in the water and they become one body retaining different sexes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Daphnis is described as a shepherd turned into stone after affronting the
    Nymph Thalia; the explanation interprets the stone change as expressing insensibility.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Scython is described as changing sex; the explanation connects this report
    to Thrace changing from a masculine to a feminine name through the name Thracia.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Celmus is described as wise and moderate, unaffected by passions, and changed
    into adamant; an alternate account says Jupiter enclosed him in an impenetrable
    tower for revealing the immortality of the gods.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Crocus and Smilax are given alternate accounts: as a chaste married pair
    changed into flowers, or as a youth and nymph turned into flowers after Crocus
    rejected Smilax’s advances.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Curetes are said to have sprung from rain, or to descend from Uranus and
    Tita; they watched over Jupiter’s infancy and were later slain by him for concealing
    Epaphus.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The fable summary says Salmacis falls in love with Hermaphroditus, is rejected,
    seizes him while he is bathing, and the two become one body while retaining different
    sexes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The fountain of Salmacis is described as infamous, with waters that enervate
    and soften those bathed in them.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hermaphroditus is described as a boy born to Mercury and the Cytherean Goddess,
    nursed by Naiads in the caves of Ida, and bearing a face and name derived from
    both parents.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: At fifteen, Hermaphroditus leaves Ida and his place of nursing, wanders through
    unknown places and rivers, and comes to a clear pool near Lycia and Caria.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The pool is clear to the bottom, without reeds, sedge, or rushes, and is bordered
    by green turf and grass.
  category: setting
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: Salmacis dwells at the pool but is not associated with hunting, bows, speed,
    or Diana; her sisters urge her to take hunting equipment, but she refuses.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Salmacis bathes in her spring, combs her hair while looking into the water,
    rests on leaves or grass, gathers flowers, sees Hermaphroditus, and wishes to
    possess him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Before approaching Hermaphroditus, Salmacis arranges her appearance and then
    addresses him as godlike, asks whether he has a wife, and asks to be his wife
    if he has none.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: Hermaphroditus blushes and is said not to know love; when Salmacis seeks kisses
    and places her hands on his neck, he tells her to desist or he will flee.
  category: sequence
  evidence_refs:
  - ev:12
