candidate_motifs:
- id: motif:1
  label: Metamorphosis into stone, adamant, or flowers
  taxonomy_refs:
  - shapeshifter
  basis: Several explanatory notices describe named figures transformed into stone,
    adamant, or flowers.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: medium
  cautions: The taxonomy term 'shapeshifter' is broader than these mostly passive
    transformations; the passage presents some as allegorical or alternate explanations.
- id: motif:2
  label: Sex transformation and dual-sex bodily union
  taxonomy_refs:
  - duality
  - annihilation_union
  - shapeshifter
  basis: Scython is reported as changing sex, and the Salmacis-Hermaphroditus summary
    states that two figures become one body retaining different sexes.
  evidence_refs:
  - ev:2
  - ev:6
  confidence: high
  cautions: The Scython notice is rationalized as a place-name gender shift, while
    the Salmacis-Hermaphroditus union is only summarized in this passage segment.
- id: motif:3
  label: Rejected erotic pursuit by a nymph
  taxonomy_refs:
  - divine_beloved
  - stolen_beloved
  basis: Smilax’s rejected advances toward Crocus and Salmacis’s rejected pursuit
    of Hermaphroditus both present a nymph desiring an unwilling youth; Salmacis later
    seizes him in the water according to the summary.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:11
  - ev:12
  confidence: medium
  cautions: The available taxonomy references are approximate; the passage does not
    frame the youth as stolen in a full abduction narrative beyond the seizing described
    in the summary.
- id: motif:4
  label: Divine child nursed by nymphs in a cave or mountain setting
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  - miraculous_child
  basis: Hermaphroditus is born to two divine parents and nursed by Naiads in the
    caves of Ida, with his face and name reflecting both parents.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not describe danger at birth or miraculous deeds in infancy;
    'miraculous_child' is inferred only from divine parentage and unusual combined
    identity.
- id: motif:5
  label: Rain-born or Heaven-and-Earth descent
  taxonomy_refs:
  - sacred_birth
  basis: The Curetes are said to have sprung from rain, with an alternate descent
    from Uranus and Tita, identified as Heaven and Earth.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: This appears in an explanatory note rather than in a narrated birth scene.
- id: motif:6
  label: Infant god guarded by attendants who later suffer punishment
  taxonomy_refs:
  - divine_parent_child
  basis: The Curetes watch over Jupiter’s infancy, but Jupiter later slays them for
    concealing Epaphus from his wrath.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage gives the relationship briefly and does not narrate the guarding
    or slaying in detail.
- id: motif:7
  label: Enfeebling or transformative spring water
  taxonomy_refs: []
  basis: The Salmacis fountain is described as having known properties that enervate
    and soften bathers, and the fable summary links the water scene with the bodily
    union of Salmacis and Hermaphroditus.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The cause of the water’s properties is explicitly said to be unknown at
    this point in the passage.
