  quote: ''
  summary: An introductory summary of Book III recounts Cadmus being sent to seek
    Europa, his dragon-slaying and founding of Thebes, the transformations and deaths
    of Actaeon, Narcissus, Echo, Etrurian sailors, and Pentheus, Juno’s destruction
    of Semele, Bacchus’s survival, and Tiresias’s judgment, blindness, and prophetic
    gift.
