canonical_text:
  quote: ''
  summary: 'The passage summarizes episodes from Book II: Phaëton seeks proof that
    Phœbus is his father and drives the Sun''s chariot, causing a worldwide fire before
    Jupiter kills him with a thunderbolt; mourners and several later figures undergo
    transformations; Jupiter, Juno, Mercury, Apollo, and others act in episodes involving
    disguise, sexual violence, theft, prophecy, punishment, and the carrying of Europa
    to Crete.'
  language: English
  quote_policy: summarized
