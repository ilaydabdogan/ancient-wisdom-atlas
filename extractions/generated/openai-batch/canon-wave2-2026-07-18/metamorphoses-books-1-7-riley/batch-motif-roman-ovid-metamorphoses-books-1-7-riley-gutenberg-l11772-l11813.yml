  summary: A sequence of explanatory footnotes identifies Cercyon, Sinnis, Alcathoë/Megara,
    Scyron, several islands near Crete, Cimolus, Seriphos, and Sithonian/Arne. The
    notes summarize lethal contests with travelers, Theseus’s defeat of robbers, Alcathous’s
    rebuilding of Megara and killing of a ravaging lion, Eleusis as a place sacred
    to Ceres and her mysteries, and several geographical or philological details.
