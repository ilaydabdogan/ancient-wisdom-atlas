  quote: ''
  summary: 'The passage summarizes Book VII episodes: Medea helps Jason win the Golden
    Fleece; later she uses drugs and stratagems involving rejuvenation and killing;
    Minos wages war against Aegeus and seeks alliances; Aeacus refuses Minos and sends
    the Myrmidons; Cephalus recounts his abduction by Aurora, his disguise-test of
    Procris, and the fatal consequences of gifts from Procris.'
