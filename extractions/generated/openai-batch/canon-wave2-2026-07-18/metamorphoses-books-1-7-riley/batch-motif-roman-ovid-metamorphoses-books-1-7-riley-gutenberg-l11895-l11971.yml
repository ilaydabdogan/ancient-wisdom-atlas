canonical_text:
  quote: A dreadful pestilence fell upon my people, through the anger of the vengeful
    Juno
  summary: In a dialogue about aid to Athens, Æacus tells Cephalus how many inhabitants
    died in a plague attributed to Juno's anger. The plague corrupts air and water,
    kills animals and humans, overwhelms medicine, and leaves the sick dying beside
    water, on roads, and under the sky.
  language: English
  quote_policy: quoted
