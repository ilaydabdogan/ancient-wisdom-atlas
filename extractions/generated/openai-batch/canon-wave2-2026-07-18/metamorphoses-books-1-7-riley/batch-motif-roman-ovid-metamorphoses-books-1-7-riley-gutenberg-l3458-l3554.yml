canonical_text:
  quote: ''
  summary: Explanatory notes identify Diana as Trivia and Dictynna and explain Calisto’s
    Parrhasian epithet. The main passage recounts Juno’s jealousy over Calisto and
    Jupiter, Juno’s transformation of Calisto into a bear, Arcas’s near killing of
    his transformed mother, Jupiter’s removal of mother and son into the sky as constellations,
    and Juno’s appeal to Tethys and Ocean to keep those stars from their waters. The
    fable heading also states that a raven is changed from white to black as punishment
    for garrulity.
  language: English
  quote_policy: summarized
