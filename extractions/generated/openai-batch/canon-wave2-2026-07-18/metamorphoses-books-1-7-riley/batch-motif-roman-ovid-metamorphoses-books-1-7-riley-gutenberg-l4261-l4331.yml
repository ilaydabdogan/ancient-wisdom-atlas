canonical_text:
  quote: ''
  summary: Jupiter has carried Europa away in the form of a bull. Agenor orders Cadmus
    to seek his sister and not return unless he finds her. After fruitless wandering,
    Cadmus consults the Delphic oracle, which tells him to follow an unyoked heifer
    and build a city where it lies down. Cadmus follows the cow to the appointed place,
    prepares sacrifice to Jupiter, and sends servants for water. The nearby ancient
    grove contains a water-filled cavern inhabited by a dragon sacred to Mars.
  language: English
  quote_policy: summarized
