canonical_text:
  quote: ''
  summary: A transformed daughter of Inachus comes to her father’s riverbank, sees
    her new horns in the water, and is not recognized by her kin until she traces
    letters in the dust. Inachus laments her bovine condition and his own divine inability
    to die. Argus removes her to distant pastures and watches from a mountain. Jupiter
    orders Mercury to kill Argus. Mercury descends with wings, wand, and cap, disguises
    himself as a shepherd, plays a reed pipe, and tries to lull Argus’s many watchful
    eyes to sleep.
  language: English
  quote_policy: summarized
