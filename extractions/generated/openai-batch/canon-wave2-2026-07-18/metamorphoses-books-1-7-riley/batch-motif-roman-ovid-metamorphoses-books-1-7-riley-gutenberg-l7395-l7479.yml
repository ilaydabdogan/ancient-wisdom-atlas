canonical_text:
  quote: ''
  summary: The passage summarizes and narrates Perseus arriving in Æthiopia after
    the Atlas episode, finding Andromeda bound to a rock as punishment ordered by
    Ammon for her mother’s words, bargaining with her parents to receive her in marriage
    if he saves her, and killing the sea monster through winged aerial combat. The
    introductory explanation also notes the Gorgon’s head hidden under seaweed and
    plants turning them to coral, Perseus giving thanks, marrying Andromeda, and later
    recounting Medusa’s death and Minerva’s transformation of Medusa’s hair into serpents.
  language: English
  quote_policy: summarized
