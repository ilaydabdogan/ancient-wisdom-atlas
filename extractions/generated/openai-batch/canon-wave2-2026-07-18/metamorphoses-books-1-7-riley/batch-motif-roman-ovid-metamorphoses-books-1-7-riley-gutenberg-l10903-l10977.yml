canonical_text:
  quote: ''
  summary: 'The explanatory passage recounts the background of the Argonaut expedition:
    family conflict around Athamas, Ino, Nephele, Phryxus, and Helle; Phryxus''s arrival
    and death in Colchis; Jason''s involvement through Pelias''s oracle-driven plot;
    the naming and voyage of the Argo; episodes at Lemnos and with Phineus and the
    Harpies; and rationalizing explanations of the Argo''s name and the Harpy story.'
  language: English
  quote_policy: summarized
