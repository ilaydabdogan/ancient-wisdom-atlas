candidate_motifs:
- id: motif:1
  label: family conflict prompting sibling sea-flight
  taxonomy_refs:
  - departure
  - sibling_pair
  basis: Ino's hatred of Nephele's children leads Phryxus to prepare a ship and flee
    with Helle.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage summarizes background in explanatory prose rather than narrating
    the scene poetically.
- id: motif:2
  label: fatal sibling voyage over water
  taxonomy_refs:
  - sibling_pair
  basis: Phryxus and Helle flee together by ship, but Helle dies on the voyage while
    Phryxus reaches Colchis.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: Only one of the sibling pair survives; no fuller account of Helle's death
    is included in the passage.
- id: motif:3
  label: treasure recovery and vengeance expedition
  taxonomy_refs:
  - mystical_quest
  - departure
  basis: After Æetes seizes Athamas's treasures and Phryxus is killed, the Greeks
    prepare an expedition to recover the treasures and avenge the death.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The available taxonomy term 'mystical_quest' is broader than the literal
    stated goal of recovering treasure and avenging death.
- id: motif:4
  label: oracle-marked hero sent into peril
  taxonomy_refs:
  - departure
  - royal_legitimacy
  basis: Pelias fears an oracle about a one-shoed person, recognizes Jason after his
    river crossing, and sends him with the Argonauts expecting he will perish.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage reports the motive and sign but does not narrate the oracle's
    full setting.
- id: motif:5
  label: named vessel and heroic crew
  taxonomy_refs:
  - departure
  basis: Jason is chosen leader by young nobles, and the adventurers embark in the
    ship Argo, from which they are called Argonauts.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is an expedition pattern rather than a complete plot by itself.
- id: motif:6
  label: island of husband-killing women and temporary unions
  taxonomy_refs: []
  basis: At Lemnos, the Argonauts find women who killed their husbands and take wives
    from among them, with Jason receiving Hypsipyle.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage offers only a brief summary and no ritual or divine framing
    for the unions.
- id: motif:7
  label: food-snatching female monsters afflict a king
  taxonomy_refs: []
  basis: The Harpies persecute Phineus by snatching victuals from his table and are
    described as winged monsters with women's faces.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No direct taxonomy reference from the supplied list matches this specific
    monster motif.
- id: motif:8
  label: rescue through pursuit halted by divine intervention
  taxonomy_refs: []
  basis: The Argonauts, especially Calais and Zethes, pursue the Harpies until Iris
    commands them to stop and promises Phineus will no longer suffer persecution.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not specify why Iris has authority over the Harpies.
- id: motif:9
  label: monster rationalized as social or natural affliction
  taxonomy_refs:
  - wisdom
  basis: The explanation reports interpretations of the Harpies as Phineus's daughters
    whose extravagance ruined him or as grasshopper swarms causing famine.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The taxonomy reference is only a broad fit for interpretive or explanatory
    knowledge; the passage itself presents these as later explanations.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the mythic Harpies with rationalizing explanations
    in which the same deprivation function is attributed either to Phineus's daughters
