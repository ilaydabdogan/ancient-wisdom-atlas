  quote: ''
  summary: The explanatory notes propose Egyptian origins or analogues for Greek ideas
    of the afterlife and Cerberus, then rationalize Cerberus as a serpent at Tænarus
    and explain Thessalian witchcraft stories through poisonous herbs and lunar invocations.
    The fable narrative begins with Minos seeking allies for war over his dead son,
    being refused by Æacus of Ægina because of an Athenian alliance, and Cephalus
    arriving from Athens to request aid from Æacus.
  language: English
