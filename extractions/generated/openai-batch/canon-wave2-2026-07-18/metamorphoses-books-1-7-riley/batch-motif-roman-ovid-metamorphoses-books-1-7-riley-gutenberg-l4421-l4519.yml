canonical_text:
  quote: ''
  summary: After Cadmus kills a dragon, an unidentified voice predicts that he too
    will be seen in dragon form. Pallas descends and instructs him to sow the dragon's
    teeth in ploughed earth as seeds of a future people. Armed men rise from the furrows,
    fight one another as newly born brothers, and only five remain, including Echion,
    who lays down his weapons and makes concord. Cadmus then uses these survivors
    as associates when building the city ordered by the oracle of Phoebus.
  language: English
  quote_policy: summarized
