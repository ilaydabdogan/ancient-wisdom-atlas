canonical_text:
  quote: ''
  summary: 'The passage summarizes Book I: Chaos is ordered into elements; humans
    are created; the Ages and the Giants'' revolt follow; Jupiter punishes impious
    beings, destroys humanity and animals by a Deluge except for Deucalion and Pyrrha,
    and the human race is renewed. It then summarizes episodes of generated beings,
    Python''s death, the Pythian games, Daphne''s transformation, Io''s transformation
    and restoration, Argus''s death, Syrinx''s transformation, and Epaphus''s birth.'
  language: English
  quote_policy: summarized
