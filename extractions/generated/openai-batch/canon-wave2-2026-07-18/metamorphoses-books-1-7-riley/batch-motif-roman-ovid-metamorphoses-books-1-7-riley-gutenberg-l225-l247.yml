- id: motif:3
  label: Heaven-aspiring Giants defeated by a deity
  taxonomy_refs:
  - divine_judgment
  basis: The Giants aspire to sovereignty of the heavens and are slain by Jupiter.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The divine-judgment classification is based on Jupiter's lethal response;
    the passage does not elaborate a trial or judgment scene.
- id: motif:4
