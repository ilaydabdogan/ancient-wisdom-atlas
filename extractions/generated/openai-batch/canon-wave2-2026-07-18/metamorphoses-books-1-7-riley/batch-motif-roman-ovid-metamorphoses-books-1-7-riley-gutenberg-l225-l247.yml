  confidence: high
  cautions: The passage is an introductory summary and gives no detailed cosmogonic
    narration beyond the division.
- id: motif:2
  label: Human creation from earth and water
  taxonomy_refs: []
  basis: Man is created from earth and water after the ordering of Chaos.
