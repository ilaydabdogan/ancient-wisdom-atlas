  quote: "“Now, as a Goddess, she is worshipped by the linen-wearing throng[112] {of
    Egypt}.”"
  summary: The passage explains Argus as a wise watcher associated with a hundred
    eyes and with Juno’s peacock; narrates Io’s divinely caused wandering, supplication
    at the Nile, restoration from cow form, and worship in Egypt as Isis; then introduces
    Epaphus and Phaëton, whose disputed divine parentage leads Phaëton to ask Clymene
    for proof and depart toward the Sun’s rising-place.
