canonical_text:
  quote: ''
  summary: Pyramus and Thisbe, lovers in adjoining Babylonian houses, are forbidden
    by their fathers to marry. They communicate through a small chink in the shared
    wall and arrange a nighttime escape to meet at the tomb of Ninus beneath a mulberry
    tree near a spring. Thisbe arrives first, flees from a blood-mouthed lioness into
    a cave, and drops her veil. The lioness tears the veil. Pyramus later finds tracks
    and the bloodied veil, believes Thisbe has been killed, and kills himself with
    his sword under the tree. His blood darkens the mulberries. Thisbe returns, sees
    the changed tree and Pyramus on the bloody ground, embraces him, and calls to
    him.
  language: English
  quote_policy: summarized
