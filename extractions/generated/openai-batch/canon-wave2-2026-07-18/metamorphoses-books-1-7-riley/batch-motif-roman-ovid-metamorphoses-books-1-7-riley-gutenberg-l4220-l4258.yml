canonical_text:
  quote: ''
  summary: 'An explanatory note treats the Europa episode euhemeristically: it distinguishes
    several figures named Zeus or Jupiter, identifies the present fable with Jupiter
    Asterius of Crete, and proposes that Asterius abducted Europa by ship. It explains
    the bull element through a bull-shaped ship figure-head, a general named Taurus,
    or a Phoenician word meaning either ship or bull. It adds that Europa was honored
    as a divinity after death with a festival called Hellotia.'
  language: English
  quote_policy: summarized
