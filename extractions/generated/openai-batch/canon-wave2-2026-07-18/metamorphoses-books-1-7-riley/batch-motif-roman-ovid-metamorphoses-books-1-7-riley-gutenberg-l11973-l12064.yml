  summary: 'A speaker describes a devastating plague: bodies lie everywhere, prayers
    and sacrifices at Jupiter''s temple fail, sacrificial animals collapse before
    being struck, omens in entrails become unreadable, corpses accumulate near sacred
    places, some people die by suicide, and normal funeral rites collapse under the
    number of dead.'
