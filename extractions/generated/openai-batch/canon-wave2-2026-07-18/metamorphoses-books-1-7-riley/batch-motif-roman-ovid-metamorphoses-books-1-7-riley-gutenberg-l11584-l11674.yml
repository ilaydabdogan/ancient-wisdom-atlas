canonical_text:
  quote: ''
  summary: The passage gives explanatory variants about Medea after Jason’s remarriage,
    including the deaths of Creon, Glauce, and Medea’s children; rationalizes several
    metamorphosis stories as escape, concealment, grief, name-pun, or historical explanations;
    and begins the next fable, where Medea attempts to poison the newly arrived Theseus
    with aconite derived from Cerberus, but Aegeus recognizes his son and knocks away
    the cup as Medea escapes by enchantment.
  language: English
  quote_policy: summarized
