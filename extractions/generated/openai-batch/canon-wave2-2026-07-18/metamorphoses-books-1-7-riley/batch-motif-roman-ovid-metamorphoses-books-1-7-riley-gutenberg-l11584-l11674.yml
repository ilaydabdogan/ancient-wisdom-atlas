    to Creon’s palace where Creon and his daughter are burned, and then kill her own
    children.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports alternate accounts in which Corinthian women or Corinthians
    kill Medea’s children, and annual sacrifices are offered at their tomb to appease
    their ghosts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Apollodorus is reported as saying that Medea sent Glauce a crown dipped in
    combustible gum, causing the princess to burn and die.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Medea is said to go from Corinth to Thebes, where Hercules promised aid against
    Jason but did not provide it, and then to Athens, where she married Ægeus.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage suggests that Medea’s winged dragons may be based on a ship called
