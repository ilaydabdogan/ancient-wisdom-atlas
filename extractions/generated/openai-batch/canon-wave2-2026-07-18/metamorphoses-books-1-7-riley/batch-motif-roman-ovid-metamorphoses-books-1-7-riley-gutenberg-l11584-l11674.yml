- id: obs:7
  text: 'The passage gives a rationalizing rule: escape from imminent danger could
    be reported as transformation into a bird; hiding in a cave as transformation
    into a serpent; excessive tears as transformation into a fountain; and a damsel
    lost in a wood as becoming a Nymph or Dryad.'
  category: sequence
  evidence_refs:
