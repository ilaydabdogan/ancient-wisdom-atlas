comparison_claims:
- id: claim:1
  claim: 'The passage explicitly compares variant traditions for the death of Medea’s
    children: one account attributes the killing to Medea, while Euripides’ chorus
    and Pausanias-associated reporting attribute it to Corinthians, with later sacrifices
    at the tomb.'
  claim_level: same_motif
  target: Variant Medea-child-death traditions in Euripides and Pausanias as summarized
    in the passage
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The passage summarizes authorities rather than quoting their full accounts
    or establishing historical dependence among them.
- id: claim:2
  claim: 'The passage contrasts two functionally similar accounts of Glauce’s death:
    burning in Creon’s palace and death by a combustible crown sent by Medea.'
  claim_level: same_function
  target: Apollodorus’s combustible crown version of the Glauce episode
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the passage’s own summary of the variants.
- id: claim:3
  claim: The passage itself identifies a recurring explanatory pattern in which reported
    metamorphoses are treated as narrative translations of escape, cave concealment,
    grief, loss in woods, historical disasters, moral traits, or name resemblance.
  claim_level: same_function
  target: Rationalized metamorphosis pattern within Ovidian allusions as explained
    by the passage
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: This is an explanatory claim made by the translator/commentator, not
    necessarily a claim made by Ovid’s narrative voice.
