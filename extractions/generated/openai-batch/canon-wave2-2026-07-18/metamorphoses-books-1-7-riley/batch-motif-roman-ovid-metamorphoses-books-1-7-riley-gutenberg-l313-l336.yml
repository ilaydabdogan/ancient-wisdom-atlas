candidate_motifs:
- id: motif:1
  label: Repeated metamorphosis of persons and objects
  taxonomy_refs:
  - shapeshifter
  basis: 'The passage repeatedly reports transformations: sisters into bats, webs
    into vines, Clytie into a sunflower, attendants into rocks, Cadmus and wife into
    serpents, Atlas into a mountain, and seaweed into coral.'
  evidence_refs:
  - ev:5
  - ev:7
  - ev:10
  - ev:11
  - ev:13
  confidence: high
  cautions: The available taxonomy label 'shapeshifter' is broader than some involuntary
    transformations in the passage.
- id: motif:2
  label: Divine punishment or hostile divine intervention causing transformation or
    madness
  taxonomy_refs:
  - divine_judgment
  basis: The sisters neglect rites and are transformed through Bacchus; Juno sends
    a Fury who drives Ino insane.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage summary implies but does not fully narrate the causal logic
    of punishment for every transformation.
- id: motif:3
  label: Blood causing transformation or generation
  taxonomy_refs: []
  basis: Pyramus and Thisbe's blood changes the mulberry's color, and Medusa's blood
    produces serpents.
  evidence_refs:
  - ev:2
  - ev:12
  confidence: high
  cautions: The two blood events occur in different narrated episodes within the same
    summary.
- id: motif:4
  label: Two beings united into one body
  taxonomy_refs:
  - annihilation_union
  basis: Salmacis and Hermaphroditus are said to become united into one body.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage provides only a summary, not the circumstances or valence
    of the union.
- id: motif:5
  label: Mother and child enter the sea and become deities
  taxonomy_refs:
  - death_rebirth
  basis: Ino leaps into the sea with Melicerta and, by Venus's intercession, both
    become sea deities while attendants mourn them as dead.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The text says attendants bewail them as dead but does not state that they
    literally die before becoming deities.
- id: motif:6
  label: Divine disguise to gain access to a beloved
  taxonomy_refs:
  - divine_beloved
  - shapeshifter
  basis: The Sun assumes Eurynome's form so that he might enjoy Leucothoë.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The summary is brief and does not provide Leucothoë's perspective or the
    detailed narrative context.
- id: motif:7
  label: Serpent transformation and serpent birth from blood
  taxonomy_refs:
  - serpent
  basis: Cadmus and his wife become serpents, and serpents are produced by Medusa's
    blood.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The serpent events occur in separate episodes.
- id: motif:8
  label: Heroic rescue followed by marriage
