canonical_text:
  quote: ''
  summary: 'Book IV summary: Alcithoë and her sisters neglect rites, spin, and tell
    several stories of love, exposure, jealousy, union, and transformation. Bacchus
    transforms the sisters and their webs. Juno sends a Fury against Ino, leading
    to madness, a leap into the sea with Melicerta, their transformation into sea
    deities, and the attendants'' transformation into rocks. Cadmus and his wife leave
    Thebes and become serpents. Perseus beheads Medusa, whose blood produces serpents,
    turns Atlas into a mountain, frees Andromeda, changes seaweed into coral, and
    marries Andromeda.'
  language: English
  quote_policy: summarized
