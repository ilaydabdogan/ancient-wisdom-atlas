canonical_text:
  quote: ''
  summary: A first-person husband recounts how Aurora changed his shape so he could
    return to Athens unknown and test his wife's fidelity with bribes. His wife resists
    but finally wavers under increased rewards; he reveals himself, accuses her, and
    she leaves him. After his apology they are reconciled, and she gives him a dog,
    Lælaps, and a javelin that had come from Cynthia. He then recounts a Theban plague-monster
    sent by Themis after the solved riddle of the son of Laius. Lælaps is released
    against the elusive monster; the chase remains unresolved until two marble statues
    appear, one seeming to flee and the other to bark in pursuit, apparently because
    a god wished both contestants to remain unconquered.
  language: English
  quote_policy: summarized
