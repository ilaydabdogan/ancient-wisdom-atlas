canonical_text:
  quote: ''
  summary: Medea conducts a secluded magical rite to restore Æson’s youth, using altars,
    fire, water, sulphur, blood, a cauldron, and many gathered ingredients. The potion
    causes signs of renewal in a dried olive branch and the ground, and Æson becomes
    vigorous and dark-haired again after his old blood is replaced with the juices.
    Liber sees the marvel and requests similar aid for his nurses. Medea then feigns
    estrangement from her husband, wins the confidence of Pelias’ daughters, demonstrates
    apparent age reversal on an old ram, enchants Pelias and his guards into sleep,
    and urges the daughters to cut their father so she may replace his old blood.
  language: English
  quote_policy: summarized
