canonical_text:
  quote: ''
  summary: Editorial footnotes and an explanatory note discuss the Cephalus and Procris
    episode. The notes mention possible jealousy caused by similarity between the
    names Aura and Aurora, a custom of catching a dying person’s breath, and the identification
    of Telamon and Peleus as two sons. The explanation rationalizes Cephalus’s association
    with Aurora through his love of early-morning hunting, recounts Procris’s affair,
    flight to Crete, rivalry with Pasiphaë, return and reconciliation, and the gift
    of a dog and javelin. It also recounts the poetic tradition that the dog was made
    by Vulcan and passed through Jupiter, Europa, Minos, and Procris; the pursuit
    of a ravaging beast or monstrous fox; a rationalizing interpretation of the beast
    as a pirate and the dog as a captain named Cyon; the petrifaction story; and Cephalus’s
    condemnation, exile to Cephalenia, and succession by his son Celeus.
  language: English
  quote_policy: summarized
