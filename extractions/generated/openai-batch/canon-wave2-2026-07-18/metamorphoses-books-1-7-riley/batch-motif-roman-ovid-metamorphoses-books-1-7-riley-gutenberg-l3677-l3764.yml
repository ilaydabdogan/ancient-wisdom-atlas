canonical_text:
  quote: ''
  summary: The passage first explains traditions about Ericthonius, including his
    parentage, exposure, deformed legs, invention of chariots, institution of the
    Panathenaea, reception into heaven as Auriga, and half-serpent explanation. It
    then narrates Nyctimene’s transformation into an owl for incest, the raven’s report
    of Coronis’s infidelity, Apollo’s killing of Coronis, his regret, his rescue of
    their unborn child from the funeral flames, and his punishment of the raven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ericthonius is described as the son or foster-child of Athene or Minerva,
    with other explanations connecting him to Vulcan, Earth, Cranaus’s daughter, and
    a priest of Vulcan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: One account says Ericthonius was exposed and found in a temple dedicated to
    Minerva and Vulcan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ericthonius is said to have disputed the crown of Athens with Amphictyon,
    later succeeded him, invented chariots to hide deformed legs, and instituted the
    Panathenaea at Athens.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hyginus is cited as saying Ericthonius was received into heaven as Auriga,
    and that his leg deformity occasioned the saying that he was half man and half
    serpent.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Apollodorus is cited as saying Ericthonius was born in Attica, was the son
    of Cranaë daughter of Attis, dethroned Amphictyon, and became the fourth king
    of Athens.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nyctimene is said to have had a criminal passion for her father Nycteus, and
    the Gods transform her into an owl to punish her incest.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: As a bird, Nyctimene avoids human gaze and light, conceals her shame in darkness,
    and is expelled from the sky by other birds.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The raven reports to Apollo that Coronis has lain with a youth of Haemonia.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: After hearing the report, Apollo’s laurel, usual looks, plectrum, and color
    forsake him before he takes up his bow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Apollo shoots Coronis in the breast with an arrow, and Coronis says she might
    have been punished after first giving birth, but now two will die together.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Apollo repents too late, blames himself for listening and becoming enraged,
    hates the raven, bow, string, hand, and arrows, and unsuccessfully attempts healing
    arts.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: When Coronis’s funeral pile is prepared, Apollo performs premature obsequies
    and does not allow his own offspring to sink into the same ashes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Apollo snatches the child from the flames and from the womb of the mother
    and carries him to the cave of the two-formed Chiron.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Apollo forbids the raven, which had expected a reward for truthful speech,
    to perch any longer among the white birds.
  category: action
  evidence_refs:
  - ev:10
