candidate_motifs:
- id: motif:1
  label: culture hero founds technologies and festival
  taxonomy_refs:
  - culture_hero
  basis: Ericthonius is said to have invented chariots and instituted the Panathenaea.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage is explanatory and skeptical about the chariot-invention claim,
    noting Egypt’s earlier acquaintance with chariots.
- id: motif:2
  label: ascent to constellation after death
  taxonomy_refs:
  - ascent
  basis: Hyginus is cited as saying Ericthonius was received into heaven as Auriga,
    the Charioteer.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage reports the motif through a cited source rather than narrating
    the ascent directly.
- id: motif:3
  label: serpentine hybrid body
  taxonomy_refs:
  - serpent
  basis: Ericthonius’s leg deformity is said to have occasioned the statement that
    he was half man and half serpent.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage treats the serpent form as an explanatory saying derived from
    deformity, not as a narrated transformation.
- id: motif:4
  label: transformation as divine punishment
  taxonomy_refs:
  - shapeshifter
  - divine_judgment
  basis: The Gods punish Nyctimene’s incest by transforming her into an owl.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The transformed form is an owl; no taxonomy symbol for owl is available.
- id: motif:5
  label: night bird marked by shame and exclusion
  taxonomy_refs:
  - shapeshifter
  basis: Nyctimene as a bird avoids human gaze and light, hides in darkness, and is
    expelled from the sky by all the birds.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: This is a behavioral consequence of transformation rather than a separate
    transformation event.
- id: motif:6
  label: truth-telling messenger punished
  taxonomy_refs:
  - trickster_boundary
  basis: The raven truthfully reports Coronis’s infidelity, expects a reward, and
    is instead barred from white birds.
  evidence_refs:
  - ev:6
  - ev:10
  confidence: medium
  cautions: The raven is not explicitly called a trickster; the fit rests on boundary-crossing
    speech and punishment.
- id: motif:7
  label: divine beloved killed by jealous god
  taxonomy_refs:
  - divine_beloved
  - divine_judgment
  basis: Apollo kills Coronis, his mistress, after hearing of her infidelity.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage frames Apollo’s action as cruel vengeance and later repentance,
    not as formal divine trial.
- id: motif:8
  label: divine parent rescues unborn child from mother’s death
  taxonomy_refs:
  - divine_parent_child
  - miraculous_child
  basis: Apollo rescues his own offspring from Coronis’s womb and the funeral flames
    and takes the child to Chiron’s cave.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The child is not named in the passage; the record should not infer later
    identity from outside knowledge.
- id: motif:9
  label: child removed from fire and womb
  taxonomy_refs:
  - sacred_birth
  basis: The child is snatched from both the flames and the womb before sharing the
    mother’s ashes.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage presents an extraordinary rescue at death, but it does not
    explicitly call the birth sacred.
