  quote: ''
  summary: The explanatory note offers rationalizing conjectures for myths involving
    Medusa, Pegasus, Chrysaor, coral, and Andromeda. It suggests that Pegasus and
    Chrysaor may have been ships, that coral from Medusa's blood may reflect safer
    coral fishing after the Gorgons' defeat, and that Andromeda's exposure may derive
    from a coerced betrothal to a pirate or from variants identifying the monster
    with Phineus or with a ship.
