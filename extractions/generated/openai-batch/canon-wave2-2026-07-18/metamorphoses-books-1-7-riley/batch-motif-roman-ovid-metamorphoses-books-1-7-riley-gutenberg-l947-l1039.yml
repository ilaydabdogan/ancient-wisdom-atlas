  summary: 'The explanatory note connects the Golden Age with Edenic innocence and
    the Fall. The passage then recounts a decline through Silver, Bronze, and Iron
    Ages: Saturn is displaced by Jupiter, the year is divided into seasons, shelters
    and agriculture begin, warfare and vice increase, humans mine hidden metals, social
    bonds collapse, and Astræa/Justice leaves the bloodied earth.'
  language: English
