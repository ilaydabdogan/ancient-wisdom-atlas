canonical_text:
  quote: Jupiter, at the prayer of his son Æacus, transforms the ants that are in
    the hollow of an old oak into men
  summary: The passage gives explanatory background about Minos, Androgeus, and Minos's
    revenge, then narrates how Æacus, after losing his people, prays to Jupiter. At
    a sacred oak he sees ants, asks for citizens as numerous as they are, receives
    thunder and lightning as an omen, dreams the ants become human, and wakes to find
    a new people whom he names Myrmidons.
  language: English
  quote_policy: quoted
