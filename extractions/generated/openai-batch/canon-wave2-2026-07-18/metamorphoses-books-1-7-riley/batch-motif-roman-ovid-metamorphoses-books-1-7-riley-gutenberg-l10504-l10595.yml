candidate_motifs:
- id: motif:1
  label: Bird metamorphosis as character-symbol
  taxonomy_refs:
  - shapeshifter
  basis: The passage explicitly treats the changes of Philomela, Progne, and Tereus
    into bird-forms and explains their symbolic fit to the characters.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The bird identities vary between reported authors, so the specific mapping
    of figure to bird is not stable across all cited traditions.
- id: motif:2
  label: Mother kills child and laments
  taxonomy_refs: []
  basis: The explanation describes Progne as having murdered her son in frenzy, and
    the Homeric-related variant describes Ædon killing Itylus by mistake and lamenting
    him.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: medium
  cautions: The passage presents multiple versions with different names and circumstances;
    it does not explicitly name a broader taxonomy family for this pattern.
- id: motif:3
  label: Divine abduction of beloved after refused consent
  taxonomy_refs:
  - stolen_beloved
  - divine_beloved
  basis: Boreas fails to obtain Erectheus' consent for marriage with Orithyïa and
    then carries her away by force.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage frames Orithyïa as later made wife and mother, but it presents
    the taking itself as violent abduction.
- id: motif:4
  label: Personified storm-god uses elemental violence
  taxonomy_refs: []
  basis: Boreas identifies violence as proper to himself and lists storm, sea, tree,
