canonical_text:
  quote: ''
  summary: The passage first explains the bird-transformations of Philomela, Progne,
    and Tereus and records variant traditions about these figures, including reversed
    bird identities and a Homeric version involving the death of Itylus. It then narrates
    Boreas' failed suit for Orithyia, his decision to use force, his violent wind-powers,
    his abduction of Orithyia to Thrace, and the birth and later wing-growth of their
    twin sons Calaïs and Zethes, who sail with the Minyæ in quest of the Golden Fleece.
  language: English
  quote_policy: summarized
