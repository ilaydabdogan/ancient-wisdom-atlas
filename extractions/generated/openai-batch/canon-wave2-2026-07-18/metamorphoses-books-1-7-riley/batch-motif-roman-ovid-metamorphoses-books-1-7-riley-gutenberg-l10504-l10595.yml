comparison_claims:
- id: claim:1
  claim: The passage itself reports a variant in which Anacreon and Apollodorus reverse
    the bird transformations, assigning Philomela to the swallow and Progne to the
    nightingale rather than the other way around.
  claim_level: same_motif
  target: Anacreon and Apollodorus versions of the Philomela-Progne bird-transformation
    story
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The note gives only the reversal, not full narrative details from those
    authors.
- id: claim:2
  claim: The passage presents the Homeric allusion as a related but different tradition
    centered on a lamenting bird-woman and the death of Itylus, without Tereus or
    Progne in the same form.
  claim_level: same_motif
  target: Homeric Philomela or Ædon-Itylus lament tradition
  evidence_refs:
  - ev:3
  counter_evidence_refs:
  - ev:3
  confidence: medium
  limitations: The passage explicitly says Homer seems to have known nothing of Tereus
    or Progne, so the relationship is a variant resemblance rather than identity of
    narrative details.
- id: claim:3
  claim: The passage reports a localization variant in which the same Philomela-related
    event is placed by some writers at Daulis in Phocis rather than in Thrace.
  claim_level: same_motif
  target: Daulis/Phocis localization of the Philomela-Tereus story
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not name the writers who place the event at Daulis,
    and this is a localization comparison rather than a developed motif comparison.
