canonical_text:
  quote: ''
  summary: 'The passage describes a cosmic conflagration: the earth cracks open, Tartarus
    is exposed to light, seas and springs dry up, sea creatures and sea deities suffer
    from heat, and Neptune cannot rise from the water. The personified Earth, scorched
    and parched, addresses the sovereign of the gods, asking why divine lightning
    delays if she is doomed to burn, reminding him of her fertility and service, and
    warning that the seas, sky, Atlas, and the whole universe may collapse back into
    ancient chaos. She then withdraws into herself and toward the caverns near the
    underworld.'
  language: English
  quote_policy: summarized
