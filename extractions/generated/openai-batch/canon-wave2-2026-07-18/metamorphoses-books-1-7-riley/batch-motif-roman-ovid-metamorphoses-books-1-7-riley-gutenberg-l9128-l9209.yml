canonical_text:
  quote: ''
  summary: The passage opens Book VI with the Arachne episode. A prefatory summary
    states that Arachne challenges Minerva in textile skill, is struck after the contest,
    hangs herself, and is transformed into a spider. The narrative then describes
    Minerva/Tritonia resolving not to let divine majesty be slighted, Arachne’s humble
    origins and admired wool-working skill, Arachne’s denial that Pallas taught her,
    Pallas’s disguised warning as an old woman, Arachne’s refusal, Pallas’s self-revelation,
    and the beginning of the weaving contest on two looms.
  language: English
  quote_policy: summarized
