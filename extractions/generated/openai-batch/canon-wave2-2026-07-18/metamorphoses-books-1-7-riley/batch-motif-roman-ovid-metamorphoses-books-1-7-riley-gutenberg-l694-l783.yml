canonical_text:
  quote: "“Then Man was formed.”"
  summary: 'The passage describes the creation of humanity after other living beings
    exist. It gives alternate explanations: an Artificer forms man from divine elements,
    or the newly made Earth, still containing heavenly atoms and mixed with stream
    water, is shaped by the son of Iapetus into the image of the ruling gods. Humanity
    is given an upright face to look toward heaven and the stars. The included explanatory
    notes also compare a cosmogonic command in Ovid with Genesis 1:3 and discuss rivers
    and astronomical zones.'
