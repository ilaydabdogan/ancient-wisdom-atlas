canonical_text:
  quote: ''
  summary: The passage first gives an explanatory account of the Arethusa and Alpheus
    tradition, attributing the story to linguistic confusion and noting ancient claims
    that Alpheus passed under the sea to Sicily. It then narrates Ceres sending Triptolemus
    through the air with seeds and a dragon-drawn chariot to cultivate the earth;
    in Scythia, the envious king Lyncus tries to kill him and is changed into a lynx.
    The passage closes with the Muses' victory in a singing contest and the transformation
    of the daughters of Pierus into magpies.
  language: English
  quote_policy: summarized
