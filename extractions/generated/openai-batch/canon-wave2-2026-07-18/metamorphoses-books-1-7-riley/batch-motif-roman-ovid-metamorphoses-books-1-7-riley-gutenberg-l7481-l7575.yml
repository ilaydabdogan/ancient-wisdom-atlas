canonical_text:
  quote: what was a plant in the sea, out of the sea becomes stone
  summary: After freeing Andromeda, Perseus lays Medusa's severed head on seaweed,
    causing the origin of coral. He sacrifices to Mercury, Minerva, and Jove, marries
    Andromeda, and at a feast recounts how he seized the shared eye of the daughters
    of Phorcys, reached the Gorgons, used his shield reflection to decapitate Medusa,
    and saw Pegasus and another winged offspring arise from her blood. He also explains
    that Minerva changed Medusa's hair into snakes after Neptune violated her in Minerva's
    temple.
  language: English
  quote_policy: quoted
