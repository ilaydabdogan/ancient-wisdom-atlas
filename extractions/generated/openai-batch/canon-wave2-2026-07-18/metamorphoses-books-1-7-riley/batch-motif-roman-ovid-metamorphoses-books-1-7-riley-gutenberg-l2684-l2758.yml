canonical_text:
  quote: ''
  summary: Phaëton asks his divine father for the solar chariot and horses for one
    day. His father, bound by an oath, warns that the task is beyond mortal strength
    and describes the steep heavenly road, the rotating sky, zodiacal dangers, and
    fire-breathing horses. Phaëton persists, and at dawn his father has the Hours
    yoke the horses to the ornate chariot.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Phaëton asks for his father’s chariot and for command and guidance of the
    wing-footed horses for one day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father regrets his oath and says the requested gift is unsafe, too great
    for Phaëton’s strength and youth, and not suited to mortals.
  category: speech
  evidence_refs:
  - ev:2
