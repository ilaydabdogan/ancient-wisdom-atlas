  text: The father says no one except himself can stand on the fire-bearing axle-tree
    and that even Jupiter cannot guide the chariot.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The father describes the route as a steep ascent, a high middle region of
    heaven, and a steep descent, with the heavens rotating rapidly in the opposite
