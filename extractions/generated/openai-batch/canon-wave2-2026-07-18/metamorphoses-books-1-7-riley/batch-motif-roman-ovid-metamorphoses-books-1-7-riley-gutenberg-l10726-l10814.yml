canonical_text:
  quote: ''
  summary: A maiden’s checked passion for the son of Æson revives when she sees him.
    He asks for her aid and promises marriage. After oaths sworn by divine powers,
    she gives him enchanted herbs and instructions. In a public trial he withstands
    fire-breathing bulls, yokes them, ploughs a field, sows dragon’s teeth, and overcomes
    the armed men who grow from the earth by throwing a stone that turns them against
    one another. He then uses herbs and sleep-inducing words to lull the sleepless
    dragon guarding the Golden Fleece, gains the gold, and returns victorious to Iolcos
    with the maiden as his wife.
  language: English
  quote_policy: summarized
