canonical_text:
  quote: ''
  summary: The passage opens Book V with a summary of Perseus’ conflict with Phineus
    over Andromeda and then narrates the eruption of violence at Cepheus’ court. Phineus
    attacks during a marriage-feast context, Cepheus rebukes him by recalling Andromeda’s
    rescue from a sea-monster peril, weapons are exchanged, Pallas aids Perseus, and
    Perseus kills Athis with a smoking billet from the altar. The introductory summary
    also notes later petrifications by the Gorgon head and the restoration of Acrisius.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fable summary says Phineus, to whom Andromeda had previously been promised,
    attacks Perseus in the palace with adherents; Perseus later uses the Gorgon head
    to turn Phineus and his followers into stone, takes Andromeda to Argos, turns
    Proetus into stone, and restores Acrisius.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Cepheus’ court, a gathering associated with a marriage-feast changes into
    clamor and warfare; the narrator compares the sudden tumult to a calm sea disturbed
    by winds.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Phineus appears first among the attackers, shakes an ashen spear with a brazen
    point, and calls himself the avenger of a wife ravished from him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Cepheus rebukes Phineus, saying Andromeda was not taken by Perseus but by
    the anger of divine or monstrous powers, and that Perseus saved her from death
    after Phineus failed to help her while she was bound.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Phineus throws his spear; it lodges in a cushion, Perseus throws it back,
    Phineus retreats behind an altar, and the spear instead strikes Rhoetus in the
    forehead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Cepheus leaves by the entrance of the house, invoking right, good faith, and
    the gods of hospitality as witnesses that the disturbance is contrary to his will.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Pallas arrives, protects Perseus with her shield, and gives him courage.
  category: action
  evidence_refs:
  - ev:7
