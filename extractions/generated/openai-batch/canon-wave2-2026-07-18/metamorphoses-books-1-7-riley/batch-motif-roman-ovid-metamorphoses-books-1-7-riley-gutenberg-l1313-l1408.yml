canonical_text:
  quote: ''
  summary: An explanatory note cautiously compares Lycaon with Cain and discusses
    variant accounts of Lycaon and human sacrifice. The fable then presents Jupiter
    deciding to destroy corrupt humanity by a universal flood rather than by fire.
    Winds, rains, Iris, Neptune, and the rivers contribute to the inundation until
    land and sea are indistinguishable and human activities are displaced into a drowned
    landscape.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The explanatory note says it is possible that Cain may have been the original
    of Lycaon, noting name similarity and that each is mentioned as a first murderer.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note says Cain murdered Abel while Abel was offering sacrifice and was
    personally called to account by the Almighty.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The note compares Lycaon's punishment with Cain's sentence to be a fugitive
    and wanderer, associating Lycaon with the wolf as an animal shunned by men and
    animals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The note reports variant ancient accounts of two Lycaons, including one who
    slew human victims on an altar to Jupiter at Lycosura, while also noting accounts
    that Lycaon was a virtuous prince.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: Jupiter resolves to extirpate mankind by a universal deluge because of universal
    corruption.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The gods approve or silently assent to Jupiter's speech, but the entire destruction
    of the human race grieves them and prompts questions about the future earth, altar
    offerings, and wild beasts.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Jupiter tells the gods not to be alarmed and promises to raise a new generation
    from a wondrous source, unlike the preceding race.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Jupiter considers using thunder, but avoids it because the ether and sky might
    catch fire and because Fate has decreed a future time when sea, earth, and heaven
    will burn.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Jupiter lays aside the Cyclops-forged weapons and chooses to destroy mankind
    beneath waves and rains.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Jupiter shuts the North Wind and cloud-dispelling blasts in the caverns of
    Aeolus and sends forth the South Wind.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The South Wind appears dark and wet, squeezes the clouds, and produces torrents;
    Iris collects waters and supplies the clouds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Neptune aids Jove with waves, commands the rivers to open their abodes, and
    strikes the Earth with his trident, causing water sources to open.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The rivers rush across the plains and carry away standing corn, groves, flocks,
