canonical_text:
  quote: ''
  summary: 'The passage gives explanatory and variant accounts of Daphne, including
    pursuit by a figure called Apollo, a laurel etymology, a Pausanias version involving
    Leucippus in female disguise, and an identification of Daphne with Manto. It then
    begins the Io episode: in the Tempe valley the river Peneus dwells in a cavern
    among waters and nymphs, the river Inachus mourns his missing daughter Io, and
    Jupiter pursues Io, lures her toward a grove, covers the earth with darkness,
    stops her flight, and ravishes her.'
  language: English
  quote_policy: summarized
