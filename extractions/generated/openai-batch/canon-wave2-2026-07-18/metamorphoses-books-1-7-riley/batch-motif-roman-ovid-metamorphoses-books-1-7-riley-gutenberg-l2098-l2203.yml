comparison_claims:
- id: claim:1
  claim: The passage presents Pausanias’ Arcadia account as another version of the
    Daphne story, replacing the river-death/laurel explanation with a plot involving
    Leucippus’ female disguise, Apollo’s rivalry, exposure during bathing, and death
    by arrows.
  claim_level: same_motif
  target: Pausanias, Arcadia version of Daphne
  evidence_refs:
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The passage paraphrases Pausanias and does not quote the Arcadia text
    directly.
- id: claim:2
  claim: The passage reports Diodorus Siculus’ identification of Daphne with Manto,
    linking the Daphne figure to a Delphic oracle-giving woman.
  claim_level: same_function
  target: Diodorus Siculus tradition identifying Daphne with Manto
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: Only the identification and oracular function are summarized; no extended
    Diodorus context is provided.
- id: claim:3
  claim: The passage reports an Antiochene local tradition that the adventure happened
    in the suburbs of Antioch and gave that place the name Daphne.
  claim_level: same_motif
  target: Antioch local Daphne tradition
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states the local claim briefly and does not narrate the
    Antiochene version separately.
