canonical_text:
  quote: ''
  summary: A battle scene in which Perseus and other combatants kill many named opponents.
    Lycabas tries to avenge the dying Athis and dies upon him. Phineus accidentally
    wounds the neutral Idas. Emathion is killed while clinging to altars. A peaceful
    musician is killed and then avenged. Doorposts, a bowl, swords, spears, and javelins
    are used amid a long catalogue of deaths.
  language: English
  quote_policy: summarized
