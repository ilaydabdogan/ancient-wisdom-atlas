canonical_text:
  quote: ''
  summary: 'An explanatory note rationalizes the Leucothoë, Orchamus, Clytie, and
    Apollo material through plant lore, then a brief catalogue introduces several
    transformations: Daphnis to stone, Scython from man to woman, Celmus to adamant,
    the Curetes from a rain shower, and Crocus and Smilax to flowers. Footnotes add
    geographical and antiquarian explanations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The editor says no ascertained historical fact is known for Leucothoë being
    buried alive by Orchamus or for Clytie becoming a sunflower, and suggests the
    story may rest on natural philosophy.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The editor suggests Leucothoë may have been called the daughter of Orchamus
    because Orchamus, king of Persia, first introduced the frankincense tree called
    Leucothoë into his kingdom.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage explains Leucothoë's love for Apollo by connecting the tree with
    an aromatic medicinal drug and Apollo with the invention of physic.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Clytie's jealousy is explained as possibly based on a naturalists' claim that
    the sunflower kills a nearby frankincense tree; Pliny is said not to mention this
    property.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: Orchamus is said to be mentioned nowhere else by ancient writers except in
    this instance.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: The fable heading lists transformations of Daphnis, Scython, Celmus, Crocus,
