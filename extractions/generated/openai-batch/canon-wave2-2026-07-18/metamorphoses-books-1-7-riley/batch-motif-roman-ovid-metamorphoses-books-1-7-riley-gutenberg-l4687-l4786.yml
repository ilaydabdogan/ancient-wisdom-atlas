canonical_text:
  quote: Words are wanting to his wishes; the air resounds with their barking.
  summary: The passage narrates Actaeon fleeing over rough terrain from his own hounds,
    unable to speak and identify himself to them. The dogs wound and tear him while
    his companions, not recognizing him, call out for Actaeon as though absent; Diana's
    rage is said to end only with his death. The passage also includes translator
    notes on Cadmus' family, Boeotian and local geography, names of attendants, and
    a note comparing ceremonial sprinkling before transformation with other supernatural
    tales.
  language: English
