canonical_text:
  quote: ''
  summary: Juno descends from heaven to the underworld, observes punished figures,
    and commissions the Fury Tisiphone to involve Athamas in crime. Tisiphone travels
    to Athamas and Ino, uses snakes and a maddening poison to infect their minds,
    and Athamas kills the infant Learchus while Ino flees with Melicerta invoking
    Bacchus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Juno, daughter of Saturn, leaves her celestial habitation and goes to the
    underworld because of hatred and anger.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Juno's entry, the threshold groans and Cerberus raises a threefold mouth
    to bark three times at once.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Juno summons the Sisters begotten of Night, who sit before adamant prison
    doors and comb black vipers from their hair.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The underworld place is called accursed and contains punished figures: Tityus,
    Tantalus, Sisyphus, Ixion, and the granddaughters of Belus.'
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Juno asks why Athamas is not suffering eternal punishment and says she wants
    the palace of Cadmus not to stand and the Furies to involve Athamas in crime.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Tisiphone shakes the snakes from her face and tells Juno to consider her command
    already done.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: After Juno returns, Iris purifies her by sprinkling water before Juno enters
    heaven.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Tisiphone departs with a blood-reeking torch, a blood-red cloak, and twisted
    snakes; Mourning, Fright, Terror, and Madness attend her.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: When Tisiphone reaches Athamas's threshold, the house shows fearful signs,
    Athamas and his wife are terrified, and the Erinnys blocks the passage while her
    snakes hiss and vomit corruption.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Tisiphone tears two snakes from her hair and throws them at Ino and Athamas;
    the snakes creep along their breasts and strike their minds rather than their
    limbs.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Tisiphone carries a poison made from Cerberus's foam, Echidna's venom, mental
    aberrations, forgetfulness, crime, tears, rage, love of murder, fresh blood, and
    hemlock boiled in a brass vessel.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Tisiphone throws the maddening poison into the breasts of Athamas and Ino,
    moves their inmost vitals, waves her torch, and then returns to Pluto's realms.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Athamas, filled with rage, imagines his wife as a lioness with two young,
    seizes Learchus from his mother, whirls him like a sling, and dashes the infant
    against stones.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Ino, roused by grief or by the poison, flees distracted with dishevelled hair
    while carrying Melicerta and crying out to Bacchus; Juno smiles at Bacchus's name.
  category: sequence
  evidence_refs:
  - ev:14
