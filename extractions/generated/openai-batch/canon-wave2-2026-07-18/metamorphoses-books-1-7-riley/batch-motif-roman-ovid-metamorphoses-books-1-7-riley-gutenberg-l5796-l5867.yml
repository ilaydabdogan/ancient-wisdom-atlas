canonical_text:
  quote: ''
  summary: The passage is an explanatory mythographic note on Bacchus. It lists multiple
    Bacchus figures, identifies the most ancient Bacchus with Egyptian Osiris, describes
    the transfer and alteration of Bacchic/Osirian worship from Egypt to Greece, rationalizes
    the thigh-birth story through an ambiguity between thigh and mountain hollow,
    describes Bacchus as a vine cultivator and teacher of arts, summarizes Trieterica
    festival practices, and gives rationalizing accounts of Pentheus' death and the
    mariners associated with Bacchus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage reports that Cicero and other authors mention multiple deities
    named Bacchus, and that Diodorus Siculus mentions three: an Indian Bacchus, a
    horned son of Jupiter and Ceres, and the Theban son of Jupiter and Semele.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Herodotus and Plutarch identify the true and most ancient
    Bacchus as born in Egypt and originally called Osiris.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the worship of this divinity passed from Egypt to Greece,
    where Orpheus introduced it and altered it, dedicating Osirian mysteries to Bacchus,
    grandson of Cadmus.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says Semele delivered Bacchus in the seventh month, after which
    a report arose that Jupiter enclosed him in his thigh to complete gestation; the
    explanation connects this to a Greek word meaning either thigh or hollow of a
    mountain and to nursing on Mount Nysa.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bacchus is described as applying himself to vine cultivation, teaching useful
    arts, being honored as a divinity, and having his worship spread to neighboring
    countries.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the Trieterica festival, celebrated every three years, Bacchantes carried
    the god's figure in a chariot drawn by two tigers or panthers, wore vine-leaf
    crowns, held thyrsi, ran frantically, made noise with tambourines and brazen instruments,
    and shouted Bacchic names.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that Greeks added ceremonies described as licentious to
    a ceremonial received from Egyptians, and that these additions were repeatedly
    suppressed and re-established.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Pentheus, son of Echion and Agave and successor of Cadmus, is said to have
    opposed abuses in Bacchic mysteries, gone to Mount Cithæron to chastise Bacchantes,
    and been torn apart by worshippers including his mother and aunt.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A Pausanias variant says Pentheus climbed a tree to observe secret orgies,
    was discovered by Bacchantes, and was put to death for his curiosity.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The mariners' transformation story is rationalized as involving Etrurian merchants
    whose vessel bore a dolphin or porpoise figure at the prow, who were shipwrecked
    near Naxos, after which a report spread that Bacchus destroyed them for impiety.
  category: sequence
  evidence_refs:
  - ev:10
