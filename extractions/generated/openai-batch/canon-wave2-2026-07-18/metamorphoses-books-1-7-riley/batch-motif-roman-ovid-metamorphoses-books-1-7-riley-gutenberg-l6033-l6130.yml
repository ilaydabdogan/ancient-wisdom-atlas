canonical_text:
  quote: ''
  summary: 'Thisbe finds the dying Pyramus, interprets his death as caused by his
    own hand and by love, vows to follow him in death, asks both sets of parents to
    bury them together, asks the tree to bear black fruit as a mourning memorial of
    their blood, and kills herself with Pyramus''s sword. Her prayers move the gods
    and the parents: the fruit becomes black when ripe, and the lovers'' remains are
    placed in the same urn. The supplied lines also include translator footnotes on
    Minyas, Bacchic rites and epithets, Lycurgus, and Minerva/spinning.'
  language: English
  quote_policy: summarized
