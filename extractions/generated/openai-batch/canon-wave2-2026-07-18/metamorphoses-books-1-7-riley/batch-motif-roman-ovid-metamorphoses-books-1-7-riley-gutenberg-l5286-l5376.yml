canonical_text:
  quote: ''
  summary: A youth remains beside water, gazing at a deceptive image that he desires
    but cannot touch. He recognizes the image as himself, laments the impossibility
    of separation from his own body, wastes away, dies, continues looking at himself
    in Stygian waters, and is mourned by Echo, Naiads, and Dryads. His body is not
    found; a yellow flower with white leaves is found instead.
  language: English
  quote_policy: summarized
