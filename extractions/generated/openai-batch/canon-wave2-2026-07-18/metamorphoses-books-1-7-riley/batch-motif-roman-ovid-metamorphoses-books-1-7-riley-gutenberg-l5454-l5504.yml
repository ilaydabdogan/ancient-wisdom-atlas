canonical_text:
  quote: ''
  summary: 'After the son of Echion rejects an unnamed speaker, the prophet''s predictions
    are fulfilled: Liber arrives, and the community runs to previously unknown rites.
    Pentheus denounces the ritual sounds, wine, women, dress, and implements; urges
    Theban men to remember their dragon ancestry; says he would prefer Thebes destroyed
    by war rather than taken by an unarmed boy; cites Acrisius as a precedent for
    resisting the deity; and orders servants to bring the ringleader in chains. Cadmus,
    Athamas, and friends try unsuccessfully to restrain him; his fury increases. The
    servants return blood-stained, say they have not seen Bacchus, and bring an Etrurian
    attendant of the deity''s rites with his hands bound behind his back.'
  language: English
  quote_policy: summarized
