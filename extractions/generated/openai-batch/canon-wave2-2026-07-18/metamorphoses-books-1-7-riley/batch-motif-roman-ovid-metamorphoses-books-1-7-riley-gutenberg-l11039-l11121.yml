- id: obs:2
  text: 'Medea rejects the idea of transferring a portion of Jason''s life and instead
    promises to attempt a greater favor: restoring the long years of her father-in-law
    by her arts, with aid from the triple-form goddess.'
  category: speech
  evidence_refs:
