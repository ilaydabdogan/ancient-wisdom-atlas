canonical_text:
  quote: ''
  summary: Medea, moved by Jason's plea but refusing to transfer part of his life,
    promises by her arts and Hecate's aid to renew Æson's years. At the full moon
    she goes out alone at midnight, performs triple gestures with water and cries,
    and invokes Night, Stars, the Moon, Hecate, Earth, natural powers, and gods of
    night. She recounts powers over rivers, sea, winds, serpents, mountains, ghosts,
    and earlier Argonautic feats, then asks for juices to renew old age. A heaven-sent
    chariot drawn by winged dragons carries her to gather herbs from mountains, rivers,
    and shores for nine days and nights. Returning, she erects altars to Hecate and
    Youth, sacrifices a black ram with blood, wine, and warm milk offerings, invokes
    earth and underworld deities, and has Æson, asleep and like one dead, placed on
    herbs at the altars.
  language: English
  quote_policy: summarized
