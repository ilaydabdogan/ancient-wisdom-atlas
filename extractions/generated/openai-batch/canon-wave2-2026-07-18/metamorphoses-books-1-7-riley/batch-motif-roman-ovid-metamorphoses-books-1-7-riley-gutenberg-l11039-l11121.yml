- id: obs:3
  text: After the moon becomes full, Medea leaves the house at midnight alone, barefoot,
    with loose garments and unadorned hair.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The setting is still and asleep: men, birds, beasts, hedges, foliage, and
    air are quiet, while the stars alone twinkle.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Medea raises her arms to the stars, turns herself three times, sprinkles her
    hair three times with stream water, gives three yells, and kneels on the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Medea invokes Night, Stars, Moon, three-faced Hecate, charms and arts, Earth,
    winds, mountains, rivers, lakes, deities of groves, and gods of night.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: In her invocation Medea states that, through these powers and her charms,
    she can reverse rivers, calm or rouse the sea, move clouds and winds, break serpent
    jaws, move rocks, oaks, forests, and mountains, make Earth groan, summon ghosts
    from tombs, and draw down the Moon.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Medea recalls earlier aid involving the fire-breathing bulls, dragon-born
    warriors, the sleepless guardian of the golden fleece, and the transfer of the
    treasure to Greek cities.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Medea says she needs juices by which old age may be renewed and receive back
    its early years; she notes that a chariot drawn by winged dragons has arrived.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Medea mounts the heaven-sent chariot, strokes the harnessed dragons, is borne
    aloft, and guides them while she gathers herbs from named mountains, rivers, waters,
    and shores, cutting some with a brazen sickle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After nine days and nine nights of travel, the dragons have been fed only
    by the odors of plants, yet they cast off aged skins.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: 'On returning, Medea stands outside the threshold under the sky, avoids contact
    with her husband, and erects two turf altars: one to Hecate on the right and one
    to Youth on the left.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Medea decorates the altars with vervain and forest boughs, digs two trenches
