canonical_text:
  quote: ''
  summary: After mourning Phaëton, his sisters are gradually transformed into trees;
    their mother tries to free them, but wounded branches bleed and the daughters
    speak until bark covers their mouths. Tears from the new branches become amber
    carried by the river. Cycnus mourns Phaëton by the Eridanus and is transformed
    into a swan, thereafter avoiding fire and choosing water. The Sun, Phaëton’s father,
    grieves, resents Jupiter’s lightning, threatens to stop driving the light-bearing
    chariot, and is pressed by the gods and Jupiter to resume his task.
  language: English
  quote_policy: summarized
