canonical_text:
  quote: ''
  summary: 'Commentary surveys historical, geographical, and allegorical explanations
    for the rape of Proserpine: Pezeron links Pluto with western Spain and mines;
    Le Clerc links the abduction with Aidoneus or Orcus in Epirus and pirates; Banier
    links Ceres with Isis, famine, Eleusinian rites, and grain buried in the earth.
    A brief note says Stellio’s transformation into a newt may be poetic invention.'
  language: English
  quote_policy: summarized
