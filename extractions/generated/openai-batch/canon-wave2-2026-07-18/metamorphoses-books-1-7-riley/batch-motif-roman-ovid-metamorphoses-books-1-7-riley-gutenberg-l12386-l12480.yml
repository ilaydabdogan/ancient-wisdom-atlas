canonical_text:
  quote: ''
  summary: The explanatory note distinguishes two princes named Cephalus and reports
    variant treatment of their genealogy and actions. The fable recounts Cephalus
    explaining how Procris, made jealous by a report that his calls to the breeze
    meant a beloved Nymph named Aura, hid in the forest to watch him. Cephalus mistook
    her rustling for a wild beast, struck her with the javelin she had given him,
    and she died after learning that Aura was only the breeze. The frame narrative
    closes with Æacus arriving with sons and soldiers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The explanation distinguishes two princes named Cephalus: one son of Mercury
    and Herse, associated with Aurora and Syria; another son of Deïoneus and Diomeda,
    married to Procris. It also states that Ovid and other writers treat the son of
    Deïoneus as carried off by Aurora and returned to Procris.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fable summary says Procris goes jealously to the forest to surprise Cephalus,
    and Cephalus mistakes the rustling in the thicket for a wild beast and kills her
    with the javelin she had formerly given him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cephalus recalls an early period of mutual marital love with Procris and describes
    hunting alone in the woods at dawn, relying on his javelin rather than servants,
    horses, hounds, or nets.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After hunting, Cephalus seeks cool shade and calls affectionately to the breeze
    for relief from heat and fatigue.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: An unnamed listener hears Cephalus's ambiguous calls to the breeze and thinks
    the repeatedly invoked name belongs to a beloved Nymph.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The unnamed informer tells Procris what he heard; Procris faints, grieves,
    fears a rival, remains uncertain, and decides not to condemn Cephalus unless she
    sees the matter herself.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: On the next morning Cephalus again calls to the breeze in the woods, hears
    sounds among leaves, thinks they are made by a wild beast, and throws his weapon.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The thrown weapon strikes Procris in the breast; Cephalus finds her dying,
    blood-stained, and drawing the javelin from her wound, then tries to bind and
    stanch the wound.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Before dying, Procris asks Cephalus not to let the Nymph Aura share their
    marriage; Cephalus understands the mistaken name and explains it, and Procris
    dies while looking at him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Cephalus tells the story in tears to weeping listeners, after which Æacus
    enters with his two sons and newly levied soldiers.
  category: sequence
  evidence_refs:
  - ev:10
