canonical_text:
  quote: ''
  summary: Pandion tearfully entrusts Philomela to Tereus for travel and return. Once
    at sea and then on his own shore, Tereus treats her as the object of his desire,
    confines her in a hidden dwelling in an ancient wood, violates her by force, and
    later cuts out her tongue to prevent disclosure. He returns to Progne with a false
    report of Philomela's death, and Progne performs mourning rites for an imaginary
    shade.
  language: English
