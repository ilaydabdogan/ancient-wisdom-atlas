    proclaims under divine impulse that the women of Ismenus should worship Latona
    and Latona's two children with frankincense, prayers, and laurel-wreathed hair.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Theban women obey by adorning their temples with laurel leaves, offering
    frankincense on sacred fires, and uttering supplications.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Niobe arrives surrounded by attendants, wearing gold-interwoven Phrygian garments,
    and is described as beautiful, angry, and haughty in bearing.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Niobe questions why Latona is worshipped at the altars while Niobe's own claimed
    godhead receives no frankincense.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Niobe asserts prestigious ancestry and connections, naming Tantalus, the sister
    of the Pleiades, Atlas, and Jupiter, and she also cites rule over Phrygians, the
    palace of Cadmus, Theban walls, and wealth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Niobe says that she has seven daughters and seven sons, with future sons-in-law
    and daughters-in-law.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Niobe contrasts her fourteen children with Latona's two children and describes
    Latona as once refused by heaven, earth, and water until Delos gave her an unstable
    resting place.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: Niobe orders the women to leave the sacrifice and remove laurel from their
    hair.
  category: speech
  evidence_refs:
