canonical_text:
  quote: ''
  summary: Manto, daughter of Tiresias, commands the Theban women to offer prayers,
    frankincense, and laurel-wreathed worship to Latona and Latona's two children.
    Niobe interrupts, boasts of her ancestry, rule, wealth, beauty, and fourteen children,
    disparages Latona's wandering and two children, and orders the sacrifice abandoned.
    The women leave the sacrifice unperformed but murmur worship. Latona, indignant
    on Mount Cynthus, tells Phoebus and Phoebe that Niobe has questioned her divinity
    and slighted her children; Phoebus and Phoebe descend through the air toward the
    citadel of Cadmus to punish Niobe.
  language: English
  quote_policy: summarized
