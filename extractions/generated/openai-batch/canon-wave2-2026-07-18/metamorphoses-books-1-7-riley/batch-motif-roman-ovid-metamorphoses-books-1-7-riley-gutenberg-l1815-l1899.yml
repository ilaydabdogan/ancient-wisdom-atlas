canonical_text:
  quote: ''
  summary: 'The passage gives explanatory interpretations of Apollo’s defeat of Python,
    then begins the fable of Apollo and Daphne: Apollo mocks Cupid, Cupid wounds Apollo
    with love and Daphne with aversion, Daphne rejects marriage and seeks perpetual
    virginity, and Apollo burns with desire while Daphne flees.'
  language: English
