  text: The same explanation says Cadmus killed all except Chthonius, Udeus, Hyperenor,
    Pelor, and Echion, who became reconciled to him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Another explanation says Cadmus truly killed a serpent that was troubling
    Bœotian territory.
  category: action
  evidence_refs:
  - ev:3
