canonical_text:
  quote: ''
  summary: The passage gives explanatory interpretations of Echo as a poetic or historical
    account of an echo phenomenon, then begins the story of Narcissus. Narcissus has
    rejected or deceived others; a despised person prays that he too may love without
    attaining what he loves, and Rhamnusia assents. At a clear, untouched spring,
    Narcissus sees his own reflection, loves the insubstantial image, tries vainly
    to kiss and embrace it, and the fable heading states that he pines to death and
    is changed by the gods into a flower.
  language: English
  quote_policy: summarized
