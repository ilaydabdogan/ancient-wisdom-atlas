canonical_text:
  quote: ''
  summary: 'The passage first gives explanatory commentary on Cadmus and Hermione:
    Cadmus is driven from Thebes, retires to Illyria with Hermione, and later traditions
    are said to have reported them as serpents. It then introduces the Perseus and
    Atlas episode: Perseus, son of Jupiter and Danaë, carries Medusa’s head into Africa;
    blood from the head produces serpents; Atlas resists Perseus because of an oracle,
    and Perseus changes Atlas into a mountain. The narrative excerpt also describes
    Acrisius denying the divine parentage of Bacchus and Perseus, Danaë’s golden-shower
    conception, and the Libyan ground producing snakes from the Gorgon’s blood.'
  language: English
  quote_policy: summarized
