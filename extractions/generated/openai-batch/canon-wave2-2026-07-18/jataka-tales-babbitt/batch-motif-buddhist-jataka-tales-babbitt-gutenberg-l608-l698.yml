canonical_text:
  quote: ''
  summary: A merchant caravan crosses a hot desert by night. After the pilot falls
    asleep, the caravan returns to the same place after discarding most of its water
    and firewood. The merchant refuses to give up, finds a tuft of grass, hears water
    under a rock, and urges a serving-lad to strike the rock. The rock breaks, water
    fills the well, the caravan recovers, marks the well with a flag, reaches the
    city, sells its goods, and returns home.
  language: English
  quote_policy: summarized
