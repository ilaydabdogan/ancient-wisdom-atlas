canonical_text:
  quote: ''
  summary: A baby elephant is given to a woman who cares for him and becomes known
    as Granny. The elephant, called Granny's Blackie, plays with village children.
    Seeing that Granny is old and burdened with work, he goes to the river bank, hires
    himself out to pull heavily loaded wagons through shallow water, insists on receiving
    the promised payment, and brings the silver home to Granny. Thereafter he does
    the hard work while Granny rests.
  language: English
  quote_policy: summarized
