canonical_text:
  quote: ''
  summary: A king with three sons refuses the queen's request to give the kingdom
    to the youngest, Sun Prince, and sends the older sons to the forest for safety;
    Sun Prince chooses to accompany them. At a pond controlled by a water-sprite,
    Sun Prince and Moon Prince fail to answer a question about the Good Fairies and
    are taken into the sprite's cave. The eldest prince recognizes the danger, answers
    correctly in moral terms, chooses the youngest brother for release out of compassion,
    and is rewarded with both brothers' return. The brothers later return to the palace,
    where the eldest becomes king and provides a home for the water-sprite.
  language: English
  quote_policy: summarized
