canonical_text:
  quote: ''
  summary: A dishonest king dismisses an honest court Valuer and appoints a foolish
    peasant who will set prices to the king's advantage. When a horse-dealer's five
    hundred horses are valued at only a measure of rice, the former honest Valuer
    advises the horse-dealer how to expose the new Valuer. After accepting a present,
    the foolish Valuer declares before the king that the measure of rice is worth
    the king's whole city. The ministers laugh, the king is ashamed, and the foolish
    Valuer is driven out.
