  quote: That little Pig is eating the food of death!
  summary: Two ox brothers work on a farm while a pig receives choice food because
    it is being fattened for a wedding feast. Little Red questions the unequal feeding;
    Big Red warns that the pig’s fine food leads to death. After the pig is killed
    and cooked, Little Red recognizes that plain food with long life is better than
    brief luxury ending in death.
