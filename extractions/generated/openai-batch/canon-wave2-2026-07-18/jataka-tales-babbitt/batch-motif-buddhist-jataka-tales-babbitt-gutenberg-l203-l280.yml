  summary: A monkey living in a tree on a river bank is targeted by a crocodile whose
    mother wants a monkey heart to eat. The crocodile lures the monkey onto his back
    with the promise of ripe fruit on an island, then reveals he intends to drown
    him. The monkey claims he left his heart in the tree, persuades the crocodile
    to return, escapes into the branches, and taunts the crocodile from above.
