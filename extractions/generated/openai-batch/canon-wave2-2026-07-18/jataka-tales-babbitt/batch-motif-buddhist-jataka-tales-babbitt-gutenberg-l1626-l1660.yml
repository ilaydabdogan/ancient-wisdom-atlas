  quote: ''
  summary: 'The passage explains hostility between crows and owls through an old tale:
    when birds sought a king, they first favored the Owl, but an old Crow objected
    to the Owl''s sour appearance. The Crow fled, the Owl pursued him, enmity began
    between crows and owls, and the birds chose a Turtle Dove as king instead.'
