canonical_text:
  quote: ''
  summary: A proud owner wagers that his strong Ox can pull a line of one hundred
    wagons. When the owner whips and insults the Ox during the public test, the Ox
    refuses to move and the owner loses his forfeit. At home the Ox speaks, objects
    to the mistreatment, and accepts the owner's apology. The next day the owner feeds,
    adorns, praises, and gently touches the Ox, who pulls the wagons successfully;
    the crowd praises the Ox and the man recovers what he lost.
  language: English
