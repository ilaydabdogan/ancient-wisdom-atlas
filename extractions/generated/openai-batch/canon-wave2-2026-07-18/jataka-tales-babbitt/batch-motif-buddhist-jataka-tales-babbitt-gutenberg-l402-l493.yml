canonical_text:
  quote: ''
  summary: A brass-and-tinware merchant and a greedy fellow merchant enter a town
    and divide the streets for trade. In a poor household, an old woman and her granddaughter
    possess an old bowl without knowing it is gold. The greedy merchant tests it,
    recognizes its value, falsely calls it worthless, and leaves hoping to return
    for it cheaply. Another merchant recognizes the gold, says his goods are worth
    less than the bowl, and gives all his money and wares while retaining eight pennies
    for the boat fare. The greedy merchant returns too late, laments losing a fortune,
    and cannot stop the other merchant’s boat from crossing the river.
  language: English
