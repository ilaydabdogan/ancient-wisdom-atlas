  quote: ''
  summary: A king's sons see an unfamiliar turtle in their courtyard lake and call
    it a demon. The king orders the turtle killed. After several methods are proposed,
    an old man who fears water suggests throwing the turtle where the lake flows into
    the river. The turtle pretends this would be especially dreadful, so the king
    orders it done; the turtle escapes safely down the river to its old home.
