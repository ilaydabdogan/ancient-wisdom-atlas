  summary: A rabbit sleeping under a palm-tree hears a coconut fall and assumes the
    earth is breaking up. Other rabbits and animals repeat the alarm and run. A lion
    stops them, traces the report back to the first rabbit, returns with him to inspect
    the place, identifies the fallen coconut as the cause, and tells the others. The
    passage concludes that the animals might still be running without the wise King
    of Beasts.
