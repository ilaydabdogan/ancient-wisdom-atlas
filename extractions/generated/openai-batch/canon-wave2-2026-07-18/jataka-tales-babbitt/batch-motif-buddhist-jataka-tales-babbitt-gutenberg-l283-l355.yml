canonical_text:
  quote: ''
  summary: A monkey relocates downriver to avoid a crocodile. He crosses between a
    riverbank and a fruit-tree island by using a rock in the water. The crocodile
    hides on the rock to ambush him, but the monkey detects the trick, makes the crocodile
    answer as if he were the rock, then persuades him to open his mouth. Knowing the
    crocodile will shut his eyes, the monkey leaps onto the crocodile's head and escapes
    to his tree. The crocodile acknowledges the monkey's cunning and says he will
    leave him alone.
  language: English
  quote_policy: summarized
