  quote: ''
  summary: A flock of quails is repeatedly caught by a fowler until their wise leader
    teaches them to lift the net together and leave it on a thorn-bush. This cooperative
    escape succeeds for several days. After an accidental slight, the quails divide
    into quarrelling sides and refuse to lift the net together, allowing the fowler
    to catch and sell them.
