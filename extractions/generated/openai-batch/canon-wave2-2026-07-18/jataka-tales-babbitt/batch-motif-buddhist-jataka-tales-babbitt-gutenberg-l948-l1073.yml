canonical_text:
  quote: ''
  summary: A wise merchant and a foolish young merchant set out separately with goods.
    The foolish merchant crosses a desert first, is deceived by a demon disguised
    as a wet traveler, throws away his water, and is overcome. Later the wise merchant
    meets the same demon, recognizes the deception, keeps his water, questions his
    men about signs of rain or ponds, and reaches the abandoned wagons of the earlier
    caravan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two merchants prepare to travel from the same city with goods for sale; the
    thrifty merchant decides they should not travel together because resources such
    as wood, water, and grass would be strained.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger merchant chooses to go first, while the thrifty merchant accepts
    following behind and sees practical advantages in doing so.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before crossing the desert, the foolish merchant fills large water-jars, loads
    them into a wagon, and starts across the desert.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A wicked demon living on the desert sands plans to make the foolish merchant
    empty the water-jars so that he can overpower him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The demon changes into the likeness of a noble gentleman, creates a carriage
    drawn by milk-white oxen, equips ten demons as armed men, and makes the party
    appear wet and recently come through water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The disguised demon tells the foolish merchant that a forest with ponds and
    frequent rain lies ahead and advises him to empty the water-jars.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The foolish merchant empties every water-jar; no forest or water is found,
    and the men and oxen become hungry and thirsty.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At night the demons attack the weakened caravan, carry off every man, drive
    away the oxen, and leave the loaded carts behind.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The wise merchant later meets the same demon in the desert and recognizes
    him as a demon because he casts no shadow.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The wise merchant refuses to throw away the water before seeing another source
    of water.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: When his men urge him to discard the water, the wise merchant asks whether
    anyone knows of a pond or lake, feels damp wind, or sees a rain cloud; the answers
    are negative.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The wise merchant concludes that the travelers were demons trying to weaken
    the caravan and orders that not even a half-pint of water be thrown away.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Before nightfall the wise merchant’s caravan comes upon the loaded wagons
