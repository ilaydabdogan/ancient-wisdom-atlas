canonical_text:
  quote: It is wrong to hurt any one. It is wrong to kill.
  summary: A gentle royal elephant hears robbers praise cruelty and killing, imitates
    their teaching, and kills keepers. A wise man diagnoses the cause as bad talk
    overheard near the stall and advises that good men speak moral instructions within
    the elephant's hearing. After hearing that it is wrong to hurt or kill, the elephant
    becomes gentle again.
  language: English
