- id: obs:3
  text: The Crane tells the Fishes he knows a pond in the deep woods with plenty of
    water and offers to carry them there one by one on his back.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A little Fish doubts the Crane and says the Crane wants to eat the Fishes
    one by one.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Crane proposes taking a trusted Fish to see the other pond and bringing
    him back; a big Fish goes, sees the pool, and returns to report it to the other
    Fishes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the Fishes want to go, the Crane carries individual Fishes away from
    sight into the woods, eats them, and continues until all the Fishes in the pond
    are eaten.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The next day the Crane finds no Fish left, only a Crab on the sand, and offers
    to take the Crab to the same fine pond.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Crab refuses to ride on the Crane's back and says he will go only if he
    can hold the Crane's neck with his claws; the hungry Crane agrees despite knowing
    Crabs have a tight grip.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the place where the Crane had eaten the Fishes, the Crab sees no pond,
