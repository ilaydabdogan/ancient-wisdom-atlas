canonical_text:
  quote: ''
  summary: During a drought, a Crane offers to carry Fishes from a drying pond to
    a better pond. After one Fish verifies that the other pond exists, the Crane instead
    carries the Fishes into the woods and eats them. A Crab agrees to go only if he
    can grip the Crane's neck with his claws. At the place where the Fish bones lie,
    the Crane threatens the Crab, but the Crab pinches the Crane's neck so that the
    Crane's head falls off.
  language: English
  quote_policy: summarized
