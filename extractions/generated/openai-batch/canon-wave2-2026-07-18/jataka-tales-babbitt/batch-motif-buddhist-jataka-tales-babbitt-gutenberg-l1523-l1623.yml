  text: A summer with very little rain leaves animals, especially Fishes, suffering
    for lack of water; one pond's water is very low.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Crane sits on the bank watching the Fishes in the low-water pond.
  category: action
  evidence_refs:
