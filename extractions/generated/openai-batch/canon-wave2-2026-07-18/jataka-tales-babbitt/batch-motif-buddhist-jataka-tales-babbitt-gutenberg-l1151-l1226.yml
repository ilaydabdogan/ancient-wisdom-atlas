canonical_text:
  quote: ''
  summary: A golden Banyan Deer, king of a herd, is confined with another deer herd
    in a royal hunting park. To reduce random slaughter, the two deer kings arrange
    that one deer will voluntarily present itself each day. When a mother deer with
    a young fawn is chosen and her own king refuses delay, the Banyan Deer king takes
    her place. The human king, moved by his mercy, spares him, the mother deer, and
    all deer in park and forest.
  language: English
  quote_policy: summarized
