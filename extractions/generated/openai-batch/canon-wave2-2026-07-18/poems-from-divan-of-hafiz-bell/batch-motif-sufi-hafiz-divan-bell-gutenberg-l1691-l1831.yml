canonical_text:
  quote: ''
  summary: The passage gathers several lyric sections in which Hafiz or the first-person
    speaker contrasts divine mercy, ascetic piety, wine, tavern imagery, love-longing,
    music, inner fire, death, pilgrimage, and a final plea for the beloved’s return
    to restore life and sight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says a divine thrall may miss the road and err in order to be
    taught wisdom through distress, otherwise pardon and mercy would be meaningless.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Zealot is said to thirst for Kausar’s wine, while Hafiz prefers an earthly
    cup; the speaker asks what God’s design is between the two.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker asks where his ruined life, noble deeds, road, drunkenness, piety,
    preacher, lute, tavern fane, tavern priest, and wine are.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker remembers past meetings, an absent friend’s bright face, an extinguished
    lamp and sun, and bows his head in dust upon a stair while saying the addressed
    presence is everywhere.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker warns his heart not to look at the beloved’s dimple, saying danger
    lurks there, and says he has forgotten patience, steadfastness, and sleep.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Lady is addressed as holding the speaker’s heart and not heeding him; the
    speaker also praises God for not testing His slave in vain.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker says someone within his silent heart weeps, that his soul will
    tear apart a painted veil, and asks a minstrel to play sad music on a zither.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker says he has not listened to earthly glories, but only to the beloved’s
    beauty; sleep has left him, and he dreams of the beloved from night until day.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker’s heart is described as a sad hermit staining the cloister floor
    with blood; he asks to be washed and covered with love’s wine.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Fire worshippers are described as bowing and magnifying the speaker’s name
    because a living flame burns in his heart and pierces Death’s door.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A minstrel’s nighttime song is said to weave the speaker’s life into the lay,
    proclaim the beloved’s love, shake Life’s secret lyre, and leave echoes of desire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A nightingale nourishes a red rose with drops of heart’s blood; a wind catches
    the boughs and entwines thorns about the nightingale’s heart.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The speaker says the wind of Death swept away his hopes and that a departing
    beloved left him the harder pilgrimage.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The speaker asks a camel-driver to help lift his fallen load and asks that
    Pity be his comrade on the road.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The speaker’s face is dusty and his eyes wet; he laments that a beloved sought
    lodging in the grave too soon.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: The speaker describes Death as winning the game on the chequered floor of
    Night and Day.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: The final section calls for return so that strength may enter a wounded heart,
    life may pause at the deserted door, the cold dead body may breathe and burn,
    and the speaker’s eyes may be opened.
  category: speech
  evidence_refs:
  - ev:9
