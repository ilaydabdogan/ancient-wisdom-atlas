  summary: 'The passage presents a historical and doctrinal account of Sufism: it
    links early Islamic sectarian developments, Shi''ite allegorical interpretation,
    Persian and Indian mystical influences, the Yekaneh Bina doctrine of all things
    existing only in God, and Sufi teaching on union with God, self-annihilation,
    ascetic practice, ecstatic poetic drunkenness, and four stages of divine manifestation.'
  language: English
  quote_policy: summarized
