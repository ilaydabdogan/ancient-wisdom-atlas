canonical_text:
  quote: ''
  summary: 'Editorial notes explain allusions in Hafiz: a borrowed Arabic opening
    line attributed to Yezid ibn Moawiyah; the musk deer whose perfume is obtained
    at the cost of its blood and life; the Sufi title Pir-i-Maghan as a transformed
    figure of tavern-keeper and spiritual guide; an allegorical quest for love involving
    the nightingale, humiliation, sorrow, a magic garden, and the Cup-bearer’s wine
    of divine knowledge; and the legend of Shedad’s Garden of Irem, built to rival
    Eden, destroyed by a heavenly noise, preserved invisibly as a monument of divine
    justice, and briefly discovered by Colabah.'
  language: English
  quote_policy: summarized
