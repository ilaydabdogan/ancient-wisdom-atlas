comparison_claims:
- id: claim:1
  claim: The Garden of Irem episode is explicitly compared within the passage to the
    Garden of Eden, because Shedad’s garden is described as intended to rival Eden
    in beauty.
  claim_level: same_function
  target: Garden of Eden as paradisal model
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives only the comparison of intended rivalry in beauty;
    it does not equate the two gardens or provide a broader Eden narrative.
- id: claim:2
  claim: 'The Pir-i-Maghan explanation links a tavern-keeper/caravanserai figure with
    a Sufi wise guide pattern: practical hospitality to road travellers is reinterpreted
    as spiritual refreshment for travellers on life’s road.'
  claim_level: same_function
  target: Sufi spiritual guide / wisdom-guide pattern
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is internal to the note’s etymological and symbolic
    explanation, not a claim of historical contact beyond the stated Persian religious
    history.
- id: claim:3
  claim: The musk note supports a cautious functional comparison between musk won
    from the deer’s life-blood and the lover’s blood-like tears, both presenting valued
    fragrance or love-expression through bodily suffering.
  claim_level: same_function
  target: suffering or blood as source of value in lover symbolism
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage itself calls this a play of meaning, but it does not develop
    a wider mythological comparison.
- id: claim:4
  claim: The allegory of the poet’s search for love corresponds within the passage
    to a mystical-quest pattern, since the quest moves through failed earthly devotion,
    humiliation and sorrow, unanswered nature, and divine knowledge.
  claim_level: same_motif
  target: mystical quest for divine love
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The description is mediated by an expositor’s explanation of the poem.
