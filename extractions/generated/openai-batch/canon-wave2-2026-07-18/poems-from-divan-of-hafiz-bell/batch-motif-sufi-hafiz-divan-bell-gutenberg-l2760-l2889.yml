canonical_text:
  quote: ''
  summary: Four lyric sections invoke spring flowers, wine, the Saki or Cup-bearer,
    a beautiful beloved, moral warning against the deceptive world and idolatry, a
    stream-and-tavern setting of enjoyment, an address to one lying under the dust
    or in the grave, and a lament that love, friendship, music, life-giving waters,
    and cosmic order have vanished or grown silent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening section names cypress, tulip, and eglantine, asks the Saki for
    three cups of wine, and presents Spring as a bride of the meadows.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says a song made in one night will travel across plains and mountain-tops
    toward distant Ind and Bengal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A beautiful female figure is described through magical eyes, raised curtains,
    walking in flowered meadows, and dew gathering on jasmine.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker warns not to leave the path of righteousness, describes the world
    as a wrinkled crone who lures and plunders, and contrasts Moses from Sinai with
    Samir and the calf of gold.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The wind of Spring blows from the Shah’s garden; a tulip holds dewy heavenly
    wine; Hafiz is asked to sing of longing for Ghiyasuddin the Sultan, and breezes
    will carry the lament to the King.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A later section sets the scene by a stream under willow shade, with song,
    a sweet mistress, a Cup-bearer, and a close friend, urging enjoyment of time.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Those burdened by desire for a fair face are told to throw branches of wild
    rue upon fire; the speaker’s soul is compared to a bride with rich thoughts and
    jewels.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The speaker gives thanks for good company, moonlight, riverbanks, the Saki’s
    eyes like a wine-cup, and finally urges Hafiz to turn his feet toward the tavern
    where fair robbers teach sweetness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the spring section, eglantine, rose, and tulip rise from dust; the speaker
    asks why an addressed person still lies under dust and says tears will fall on
    the grave until that person thrusts a head from the earth.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The final section says true love has vanished, friendship has parted, Khizr’s
    feet linger, the waters of life are no longer clear, the rose is pale, and the
    wind of Spring is questioned.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: A ball of God’s favour and mercy comes to the players’ feet, but no horseman
    leaps out to renew the game.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Roses bloom without bird-song; the nightingale is silent; heaven’s music and
    the planets are silent; Zohra’s lute is questioned; no one presses the vine’s
    fruit and the foaming bowl is absent.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The poem asks who laid waste a city of kings, says no ruby has been won from
    the mine of manhood for years, and ends by saying no one knows the secret of God’s
    dread task or what has befallen the wheels of Time.
  category: speech
  evidence_refs:
  - ev:13
