canonical_text:
  quote: ''
  summary: Bell’s introduction discusses whether Hafiz’s imagery of wine, love, and
    the cup-bearer should be read mystically or literally. The passage emphasizes
    natural beauty, human love, bereavement, passionate images of love surviving death,
    and the comparison of Reason’s effect on Love to a raindrop disappearing in the
    ocean. It also compares Hafiz’s Persian literary status with Shakespeare’s English
    status and cites Fitz-Gerald’s praise of Hafiz and Omar Khayyam.
  language: English
  quote_policy: summarized
