    wine, cosmic kingship, and Solomonic allusions; refuge in a vizir’s house from
    legal pursuit; support from another vizir who founded a college for him; and later
    praise, dissatisfaction, or declined invitations involving the rulers Oweis and
    Ahmed of Baghdad.'
