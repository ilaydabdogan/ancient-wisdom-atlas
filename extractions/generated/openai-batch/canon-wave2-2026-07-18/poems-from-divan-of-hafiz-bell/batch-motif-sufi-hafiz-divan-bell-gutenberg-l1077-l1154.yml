  summary: Bell discusses the extent and character of Sufi and mystical elements in
    Hafiz, citing images of wine, love, the Beloved, the tavern threshold, the cup,
    the Garden of Paradise, sacred trees, fate, and divine desire. She then cautiously
    compares Persian and Indian mystical poetry with Western allegorical and devotional
    traditions, including troubadours, the Romance of the Rose, St. Francis, and Beatrice.
