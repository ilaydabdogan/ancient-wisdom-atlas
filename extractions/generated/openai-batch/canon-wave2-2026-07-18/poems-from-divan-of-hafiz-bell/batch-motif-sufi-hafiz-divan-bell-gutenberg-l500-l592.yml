  quote: ''
  summary: A biographical introduction recounts Hafiz’s disappointing visit to Shah
    Yahya at Yezd, his homesickness for Shiraz, a failed attempt to travel to India,
    favor from the Sultan of Hormuz, friendship with Mansur, old-age laments over
    lost youth, forebodings after Timur’s entry, later victory verses, and the poet’s
    death, tomb, garden, pilgrimage reputation, and cypress at Mosalla.
  language: English
  quote_policy: summarized
