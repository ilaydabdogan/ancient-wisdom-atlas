  quote: ''
  summary: In poem XXXIII, the speaker says Love’s secret treasure remains protected
    and that loyal lovers still weep. The speaker receives the perfume of the beloved’s
    curls on the wind, describes being wounded by the beloved’s brows and waiting
    for healing, connects rubies and lips with heart-blood, asks that the beloved’s
    curls not waylay the pilgrim soul like robbers, and ends by calling on Hafiz to
    sing again of weeping eyes and a deep fountain of tears.
