canonical_text:
  quote: ''
  summary: 'Editorial notes gloss several stanzas: one stanza is described as mysterious;
    Sidreh and Tuba are identified as trees in the Garden of Paradise, with Tuba described
    as a vast tree of abundance; later notes mention possible descent to Avernus,
    Sufi and orthodox distinctions around reward, Sufis as “lovers of wine,” Adam’s
    expulsion from Eden, and a Last Judgment tradition with more degrees of blessedness
    than punishment because divine mercy exceeds justice.'
  language: English
