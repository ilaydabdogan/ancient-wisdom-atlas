  quote: ''
  summary: The passage contrasts Hafiz and Dante as near-contemporaries responding
    differently to political and spiritual disorder. Dante is described as historically
    grounded and as making visionary journeys through heaven and hell, while Hafiz
    is described as largely indifferent to contemporary events and oriented toward
    broader philosophical insight. The passage then quotes Renan on Indian and Persian
    mystical poetry, especially the difficult interweaving of divine and earthly love
    and the role of allegorical interpretation.
