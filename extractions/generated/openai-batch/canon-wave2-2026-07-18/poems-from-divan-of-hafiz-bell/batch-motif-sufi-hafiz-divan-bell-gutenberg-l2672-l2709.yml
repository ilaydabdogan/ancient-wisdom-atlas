canonical_text:
  quote: ''
  summary: The speaker urges filling a golden goblet with wine before death and the
    Vale of Silence. He asks a cypress tree to shade his dust after death, calls for
    bitter tears to cleanse him for the road between Earth and Heaven, contrasts the
    zealot’s self-regard with grief, and declares that only an unsullied heart may
    reflect the Lady’s grace. The Lady’s curling locks wound like snakes, her red
    lips can heal like a bezoar, and her perfume leads Hafiz to tear his robe and
    lay it beneath her feet.
  language: English
  quote_policy: summarized
