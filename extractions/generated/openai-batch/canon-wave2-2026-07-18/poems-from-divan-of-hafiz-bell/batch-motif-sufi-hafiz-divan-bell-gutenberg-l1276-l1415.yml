canonical_text:
  quote: ''
  summary: The passage contains four Hafiz lyrics in English translation. A speaker
    calls for wine, describes love as a difficult road, receives tavern counsel, hears
    camel bells calling for departure, depicts a stormy sea, laments shame, and cites
    wisdom about abandoning the world. Later poems personify a bird and rose, portray
    tavern threshold humility, Irem’s garden, hidden Love, Saki’s heavenly wine, messages
    carried by wind or lapwing to a distant Lady, divine grace and God’s image in
    a mirror-like face, and a beloved whose features are linked with life, tears,
    death, and Love’s dart.
  language: English
  quote_policy: summarized
