candidate_motifs:
- id: motif:1
  label: Love as difficult road and renewed departure
  taxonomy_refs:
  - mystical_quest
  - departure
  basis: The passage repeatedly frames love through difficult ways, road and hostelry
    imagery, a command to bind the burden and depart, and the claim that Love’s road
    has no halting-place.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:7
  confidence: high
  cautions: The passage supplies journey imagery but does not give a single continuous
    narrative itinerary.
- id: motif:2
  label: Wine and tavern as access to sacred or hidden Love
  taxonomy_refs:
  - mystical_quest
  - sacred_exchange
  basis: The speaker asks for the cup; the Tavern-keeper gives counsel involving red
    wine and a prayer carpet; the tavern threshold requires supplication and tears;
    Saki’s heavenly wine graces the feast where Love’s secret remains remote.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:6
  confidence: medium
  cautions: The sacred value of the wine is supported by wording such as heavenly
    wine and Love’s diviner breath, but detailed doctrinal interpretation is not supplied
    in the passage.
- id: motif:3
  label: Distant beloved as divine or ideal focus
  taxonomy_refs:
  - divine_beloved
  - mystical_quest
  basis: The beloved or Lady is remote, receives wind-borne devotion, is seen in absence,
    and is linked to God’s image mirrored in the face or glass and to life-and-death
    power over lovers.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  confidence: medium
  cautions: The passage can also be read as courtly love lyric; the divine-beloved
    classification rests on explicit God-image and heavenly-grace language within
    the passage.
- id: motif:4
  label: Tears, drowning, and water ordeal of love
  taxonomy_refs:
  - mystical_quest
  basis: The speaker’s tears, a storm sea, whirlpools, a drowning voice, the sea of
    tears drowning patience and wisdom, and wells or waters of life cluster around
    the speaker’s suffering in love.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  - ev:6
  - ev:10
  confidence: medium
  cautions: The water imagery is recurrent, but the passage does not explicitly present
    a formal ritual ordeal.
- id: motif:5
  label: Wisdom and renunciation of the world
  taxonomy_refs:
  - wisdom
  basis: 'Hafiz is told to hold in mind what the wise have written: if he attains
    his life’s desire, he should cast the world aside and abandon it.'
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The wisdom statement appears as quoted counsel rather than an enacted
    narrative outcome.
- id: motif:6
  label: Flower mortality in the garden
  taxonomy_refs:
  - seasonal_cycle
  basis: The bird tells the new rose that many flowers have bloomed and died, and
    the rose accepts that she was born to fade.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage emphasizes fading and mortality; it does not explicitly describe
    a full cycle of seasonal return.
- id: motif:7
  label: Messenger wind or bird sent to the beloved
  taxonomy_refs:
  - mystical_quest
  - divine_beloved
  basis: The speaker sends the east wind or Lapwing of the day to the Lady in Saba
