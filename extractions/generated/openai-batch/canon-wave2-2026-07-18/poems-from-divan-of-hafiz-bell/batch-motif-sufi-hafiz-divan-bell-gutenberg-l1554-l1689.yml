evidence:
- id: ev:1
  type: summary
  locator: 1554-1561
  quote_or_summary: Wine is requested for king and slave; the banquet is alike for
    all; after the feast, low and mighty bow beneath Life’s archway at the tavern’s
    second door.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain source; summary provided.
- id: ev:2
  type: summary
  locator: 1562-1568
  quote_or_summary: The road to mirth passes through affliction; God’s treaty asks
    whether he is Lord of the earth; man assents with a sigh; the speaker counsels
    against dispute over Is and Is Not.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain source; summary provided.
- id: ev:3
  type: summary
  locator: 1569-1575
  quote_or_summary: Assaf’s pomp, wind-steeds, and bird-speech have fled; their lord
    is dead; an arrow flies briefly and then falls in dust.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain source; summary provided.
- id: ev:4
  type: summary
  locator: 1576-1580
  quote_or_summary: Hafiz is addressed as a tongue speaking through a slender reed,
    and his verses and song move from lip to lip.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain source; summary provided.
- id: ev:5
  type: summary
  locator: 1583-1590
  quote_or_summary: The cup-bearer is asked to set the glass afire with wine’s light;
    the minstrel is asked to sing; the goblet reflects the glow of Love’s red cheek.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain source; summary provided.
- id: ev:6
  type: summary
  locator: 1591-1597
  quote_or_summary: The speaker asks that beauties’ charms not be checked until Love
    comes in cypress and ruddy pine-tree imagery; love gives life, and the speaker’s
    constancy lives in the Book of the World.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain source; summary provided.
- id: ev:7
  type: summary
  locator: 1598-1604
  quote_or_summary: The Day of Reckoning is imagined; the Sheikh’s lawful cheer and
    the speaker’s forbidden draught are contrasted; drunken comrades shine as the
    speaker reaches for wine.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain source; summary provided.
- id: ev:8
  type: summary
  locator: 1605-1611
  quote_or_summary: The wind is asked to pass the garden of the heart’s dear master
    and carry a message asking why the speaker’s name has been forgotten, with mortality
    in view.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain source; summary provided.
- id: ev:9
  type: summary
  locator: 1612-1618
  quote_or_summary: Hafiz’s tears are to be scattered like grain to snare the Bird
    of Joy; the heart shrinks like a tulip in cold night air; Fortune is addressed
    as a song-bird to be caught.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain source; summary provided.
- id: ev:10
  type: summary
  locator: 1619-1622
  quote_or_summary: The heavens are a green sea and the crescent moon a slender bark;
    Kawameddin is addressed as vizir and pilgrim.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain source; summary provided.
- id: ev:11
  type: summary
  locator: 1625-1650
  quote_or_summary: A repeated refrain calls singer and Saki to fresh song and red
    wine; the stanza mentions hidden love-play, kisses, life twined with the vine,
    and hours that have flown.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain source; summary provided.
- id: ev:12
  type: summary
  locator: 1651-1660
  quote_or_summary: A woman has stolen the speaker’s heart and adorns herself; the
    dawn wind is asked to go to the fairy’s street and whisper Hafiz’s tale.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain source; summary provided.
- id: ev:13
  type: summary
  locator: 1663-1669
  quote_or_summary: Mirth, spring, a fair garden, cup-bearer, and flagon are praised;
    pleasant hours slip from Fate, and attempts to know the end of mortal care are
    vain.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain source; summary provided.
- id: ev:14
  type: summary
  locator: 1670-1676
  quote_or_summary: Life hangs on a single thread; present comfort is urged; Waters
    of Life and Irem’s Paradise are mentioned beside a mighty stream where people
    sing of wine and go their way.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain source; summary provided.
- id: ev:15
  type: summary
  locator: 1677-1689
  quote_or_summary: The modest and merry share kinship; differences are dismissed;
    the Curtain’s secret is unknown, Heaven is mute, and dispute with the one who
    holds the Curtain is rebuked.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain source; summary provided.
