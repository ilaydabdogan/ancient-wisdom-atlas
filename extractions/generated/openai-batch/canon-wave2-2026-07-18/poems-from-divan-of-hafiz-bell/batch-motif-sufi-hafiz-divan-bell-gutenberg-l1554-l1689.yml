  confidence: high
  cautions: No historical comparison is implied by this extraction.
- id: motif:8
  label: joy or fortune as a bird to be captured
  taxonomy_refs: []
  basis: Tears are scattered like grain to snare the Bird of Joy, and Fortune is addressed
