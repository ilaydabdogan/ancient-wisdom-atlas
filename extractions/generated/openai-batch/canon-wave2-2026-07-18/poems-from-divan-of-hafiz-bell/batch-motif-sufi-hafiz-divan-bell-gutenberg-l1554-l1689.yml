candidate_motifs:
- id: motif:1
  label: banquet that equalizes social ranks before life’s threshold
  taxonomy_refs: []
  basis: The same banquet and wine are offered to king and slave, and low and mighty
    alike pass beneath Life’s archway.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage frames the image lyrically rather than as a narrative myth
    episode.
- id: motif:2
  label: divine covenant between God and humanity
  taxonomy_refs:
  - covenant
  basis: The passage explicitly presents God’s treaty and man’s assenting answer.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The covenant is invoked briefly within a lyric stanza.
- id: motif:3
  label: affliction as the road to joy
  taxonomy_refs:
  - mystical_quest
  basis: The speaker states that the road must pass through affliction before reaching
    the halting-station of mirth.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The quest structure is metaphorical and compressed, not narrated as a
    full journey.
- id: motif:4
  label: vanishing worldly power and impermanence
  taxonomy_refs:
  - wisdom
  basis: Assaf’s pomp and mastery are gone, the lord is dead, and the arrow falls
    into dust after a short flight.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The available taxonomy has no more specific impermanence motif; the wisdom
    label is broad.
- id: motif:5
  label: wine-mediated encounter with the beloved
  taxonomy_refs:
  - divine_beloved
  basis: Wine, goblet, song, and the cup-bearer are repeatedly linked with seeing
    or seeking Love, the beloved, master, or fairy.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  - ev:11
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage itself does not explicitly state that the beloved is divine;
    this classification follows the lyric pattern and should be reviewed.
- id: motif:6
  label: divine judgment and reversal of lawful versus forbidden drink
  taxonomy_refs:
  - divine_judgment
  basis: The Day of Reckoning is invoked while comparing the Sheikh’s lawful cheer
    with the speaker’s forbidden draught.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The stanza speculates about judgment rather than narrating an adjudication.
- id: motif:7
  label: messenger wind to an absent beloved
  taxonomy_refs: []
