canonical_text:
  quote: ''
  summary: 'The passage gives biographical and anecdotal material about Hafiz: his
    uncertain early life, association with Sheikh Mahmud Attar, criticism of blue-clad
    strict Sufis, use of wine and tavern imagery for wisdom, adoption of a dervish
    habit, a tradition about completing his uncle’s Sufi poem and receiving a curse
    on his works, and early patronage by Abu Ishac, whose fall is lamented with images
    of fate and a falcon of death.'
