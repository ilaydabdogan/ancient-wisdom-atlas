canonical_text:
  quote: ''
  summary: A sequence of Hafiz lyrics presents grief in absence, messages from the
    beloved’s village, extravagant praise and barter for a beloved, wine and garden
    imagery, the limits of human wisdom before the Hidden, allusions to Joseph and
    Zuleika, acceptance of fate, warnings against judgment, hope for paradise after
    death, and a spring scene where wine overcomes rock-like repentance.
  language: English
  quote_policy: summarized
