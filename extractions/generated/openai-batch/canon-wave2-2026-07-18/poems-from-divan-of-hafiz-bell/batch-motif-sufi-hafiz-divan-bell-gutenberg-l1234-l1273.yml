  summary: The passage explains a Sufi poetic code in which terms such as wine, tavern,
    rose, beauty, and other images are said to carry mystical meanings known to the
    initiated. It then cautions that Hafiz should not be read as wholly mystical or
    wholly material, and summarizes his outlook as a search for a desired but uncertain
    truth, ending with the image of the unknown secret of the veil.
  language: English
