canonical_text:
  quote: ''
  summary: 'The passage gives explanatory notes to a Hafiz poem: a quoted travel account
    describes dervishes as outwardly holy but often impostors; later notes explain
    Sufi meanings of the prayer carpet, wine, tavern, robe, and grape; a historical
    anecdote tells how Hafiz accepted an invitation from Mahmud Shah Bahmani, set
    out toward India, gave away his travel funds to a robbed acquaintance, was assisted
    by merchants, boarded a ship at Hormuz, turned back after a storm, and sent the
    poem as an excuse, after which the ruler sent him another gift.'
