canonical_text:
  quote: ''
  summary: The passage presents grief and parting as temporary, urges departure from
    the mosque toward the tavern because life is brief, exhorts the Heart to enjoy
    the present before Ramazan, praises the rose while she blooms between Spring and
    Autumn, asks the Minstrel to sing, and describes Hafiz rising from darkness through
    melody before returning to darkness with a farewell.
  language: English
  quote_policy: summarized
