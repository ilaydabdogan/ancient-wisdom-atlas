  summary: The lyric speaker embraces wine and love despite hidden Fate, reflects
    on dead kings reduced to dust and clay, alludes to Ferhad and Shirin, urges drinking
    while life lasts, is summoned back by Ruknabad and Mosalla, and closes with Hafiz,
    music, and the fragility of Life’s thread.
