canonical_text:
  quote: ''
  summary: The passage contains two lyric sections. In the first, the speaker dreams
    of angels at a tavern, Adamic clay made into a cup, Love's wine, a divine burden
    too great for Heaven, Adam's temptation, competing creeds, the moth drawn to Love's
    fire, and Hafiz removing the veil of Ignorance. In the second, the speaker repeatedly
    asks that friends, dead lovers, former liberators, rose gardens by the Zindeh
    Rud, and those who held the key to his heart not be forgotten.
  language: English
