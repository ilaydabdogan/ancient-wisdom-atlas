candidate_motifs:
- id: motif:1
  label: Beloved as healing, sovereign, and inspiring presence
  taxonomy_refs:
  - divine_beloved
  basis: The beloved's lips are healing, the moon serves her, the speaker dreams at
    her feet, and closeness to the Beloved is remembered as worthy of thanksgiving.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:14
  - ev:15
  confidence: medium
  cautions: The passage uses lyric love language; it does not explicitly identify
    the beloved as divine, despite Sufi context and capitalization of Beloved.
- id: motif:2
  label: Hidden wisdom found in tavern wine rather than formal worship space
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: The speaker says Love's passionate wisdom was found while drunk within tavern
    gates and remains undivined in the mosque.
  evidence_refs:
