  locator: XXVIII, final stanza
  quote_or_summary: The beloved is said to set the uncut gems of Hafiz's inmost thought
    aright and string verse beside verse.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain; Project Gutenberg source metadata.
- id: ev:6
  type: summary
  locator: XXIX, stanza 1
  quote_or_summary: Joseph shall return from Canaan after his face was hidden; the
    heart is told to weep no more as roses and joy will return.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain; Project Gutenberg source metadata.
- id: ev:7
  type: summary
  locator: XXIX, stanza 2
  quote_or_summary: Life's Spring returns to green meadows; the world's secret is
    not learned, yet Love's fire may burn behind the veil.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain; Project Gutenberg source metadata.
- id: ev:8
  type: summary
  locator: XXIX, stanza 3
  quote_or_summary: The turning wheel and Heaven's wheel of Fate will change; a pilgrim
    nearing Mecca is wounded by maghilan, but the desert blooms again.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain; Project Gutenberg source metadata.
- id: ev:9
  type: summary
  locator: XXIX, stanza 4, opening
  quote_or_summary: The river of mortality roars around the unstable house of Life;
    Noah pilots the heart and guides its ark to the desired shore.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain; Project Gutenberg source metadata.
- id: ev:10
  type: summary
  locator: XXIX, stanza 4, closing
  quote_or_summary: The goal is far and the road perilous, yet every path leads to
    the same abode where the load is dropped.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain; Project Gutenberg source metadata.
- id: ev:11
  type: summary
  locator: XXIX, stanza 5
  quote_or_summary: Enemies persecute the speaker and Love has fled; God counts tears
    and hears weeping; Hafiz is told to take the Koran and recite litanies.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain; Project Gutenberg source metadata.
- id: ev:12
  type: summary
  locator: XXX, stanza 1
  quote_or_summary: Shiraz is hailed as peerless and guarded by God; Ruknabad's limpid
    stream is likened to Khizr's fount and gives life for aye.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain; Project Gutenberg source metadata.
- id: ev:13
  type: summary
  locator: XXX, stanza 2
  quote_or_summary: The north wind carries ambergris between Jafrabad and Mosalla;
    Gabriel's peace abides there, and Shiraz's beauties are praised.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain; Project Gutenberg source metadata.
- id: ev:14
  type: summary
  locator: XXX, stanza 3
  quote_or_summary: The speaker asks the east wind for news of the maid with drunken
    eyes and says that in dreams his head rests at her feet.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain; Project Gutenberg source metadata.
- id: ev:15
  type: summary
  locator: XXX, stanza 4
  quote_or_summary: If the Cup-bearer pours wine and requires blood, the speaker's
    heart should yield its crimson flood like milk; Hafiz is urged to give thanks
    for days holding the Beloved close.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain; Project Gutenberg source metadata.
- id: ev:16
  type: summary
  locator: XXXI, opening stanza
  quote_or_summary: Dawn's musk-strewing wind blows; the ancient world turns to youth
    again; Spring's chalice and flower cups are described.
  source_text_path: texts/public-domain/sufi/project-gutenberg/poems-from-divan-of-hafiz-bell.md
  rights_note: Public domain; Project Gutenberg source metadata.
