canonical_text:
  quote: ''
  summary: A group of Hafiz lyrics remembers intimacy with the beloved, tavern wine,
    hidden love-wisdom, and desire; consoles the heart through images of Joseph's
    return, spring renewal, pilgrimage, Noah's ark, divine hearing, and Koran recitation;
    praises Shiraz, Ruknabad, fragrant winds, Khizr's life-giving fount, Gabriel's
    peace, the Cup-bearer, and the Beloved; and closes with spring-like renewal of
    the ancient world.
  language: English
  quote_policy: summarized
