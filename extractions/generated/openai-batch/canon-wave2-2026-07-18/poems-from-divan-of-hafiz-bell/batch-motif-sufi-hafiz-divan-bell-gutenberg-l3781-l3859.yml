canonical_text:
  quote: ''
  summary: The passage gives explanatory notes on Hafiz, chiefly recounting the Qur'anic
    and later traditional story of Adam's creation, the angels' command to worship
    him, Eblis's refusal, and the use of this legend in Hafiz's tavern and wine-cup
    imagery. It also notes variant identifications of the forbidden fruit, a comparison
    between the seventy-two Islamic sects and branches of Noah's family after Babel,
    and the name Zindeh Rud as River of Life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Qur'anic citation says God announced that he would place a substitute on
    earth, taught Adam the names of all things, had Adam declare those names to the
    angels, and commanded the angels to worship Adam; Eblis refused and became numbered
    among unbelievers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Later tradition says Gabriel, Michael, and Israfil were each ordered to take
    seven handfuls of clay of red, white, and yellow from the earth, but each returned
    empty-handed after the earth prayed not to be robbed of her substance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same tradition says Azrail, the angel of death, took the seven handfuls
    from the earth and promised that human substance would return to the earth when
    humans ceased to live.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: God moulded the figure of man from the clay, left it forty days to dry, and
    then breathed the breath of life into its nostrils.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The angels came to gaze on the clay figure, and Eblis kicked it and found
    that it rang hollow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Eblis refused to serve the clay figure because he had been created of pure
    fire, and God cast him out of Paradise.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The rest of the angels acknowledged Adam's superiority after God made Adam
    tell them the names of all creatures of the earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The commentator says Hafiz speaks of angels standing at a tavern door where
    man may enter and receive instruction in God's wisdom, while the angels must knock
    in vain.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The commentator says Hafiz speaks of the angels moulding a wine-cup from the
    despised clay out of which the human body was moulded.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The commentator interprets man as a vessel into which divine love and wisdom
