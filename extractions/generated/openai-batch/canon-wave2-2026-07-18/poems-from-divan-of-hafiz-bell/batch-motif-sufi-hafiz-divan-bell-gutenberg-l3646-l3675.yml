canonical_text:
  quote: ''
  summary: 'The note recounts the Persian legend of Ferhad, Shirin, and Khusro Parwiz:
    Shirin''s reported identities, Khusro''s capture of the true Cross, Ferhad''s
    love and mountain task, Khusro''s false report of Shirin''s death leading to Ferhad''s
    death, and Shirin''s later suicide over Khusro''s body. It then describes scarlet
    tulips on a barren Persian hillside and notes a tradition that the poem was sent
    to the King of Golconda.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note says the loves of Ferhad and Shirin are famous in Persian legend,
    and reports variant identifications of Shirin, including Mary or Irene and daughter
    of the Emperor Maurice.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Khusro Parwiz is said to have conquered Jerusalem and carried off the true
    Cross, which had been enclosed in a gold box and buried in the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Khusro Parwiz was devotedly attached to Shirin, while Shirin had given her
    heart to Ferhad.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ferhad, despairing because Shirin's rank placed her far above him, wandered
    through deserts and mountains calling her name and carved sculptures on the rock
    Behistun.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The King told Ferhad that if he cut through the rock and made a stream from
    the other side of the mountains flow through it, he would relinquish Shirin to
    him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ferhad nearly completed the task before Khusro sent false news of Shirin's
    death; Ferhad then threw himself from the top of the rock and died.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Khusro Parwiz was violently killed by his son, who then proposed marriage
    to his father's widow.
  category: sequence
