  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that smoke from burning rue has power to avert the evil
    eye according to Persian superstition.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Zohra is identified as the planet Venus, the musician of the heavens, and
    the protector of earthly musicians and singers.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: God sent Harut and Marut to earth as judges and taught them a secret word
    by which they could return to heaven each evening.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Zohra demanded that Harut and Marut destroy her husband, worship her gods,
    and drink wine; the angels refused murder and idolatry but drank wine and revealed
    the secret word.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After hearing the secret word, Zohra pronounced it, rose into heaven, and
