canonical_text:
  quote: ''
  summary: 'Translator''s notes explain allusions in Hafiz poems: the Bengal Sultan
    Ghiyasuddin and three handmaidens commemorated in an ode; an Islamic account of
    Al Samiri making and animating the golden calf; a Persian belief that burning
    rue averts the evil eye; and the legend of Zohra/Venus, Harut, and Marut, in which
    two angels are tempted, reveal a secret heavenly word, and are punished in Babel
    while Zohra becomes a star.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ghiyasuddin Purabi fell sick, was nursed by three handmaidens named Cypress,
    Tulip, and Rose, and recovered.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other ladies of the Sultan were jealous and contemptuously nicknamed the three
    handmaidens “the three bath women” because they had washed the king's body during
    illness.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ghiyasuddin composed the first line of a couplet and sought completion of
    the ode; after court poets failed, the line was sent to Hafiz, who composed an
    ode that pleased the Sultan.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The note identifies three cups of wine, parrots of India, and Persian sweetmeat
    as allusions to the three maidens, the Bengal court poets, and Hafiz's ode respectively.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Al Samiri is described as a magician and alchemist whom Pharaoh employed as
    a rival to Moses, though he could not match Moses' wonders.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Al Samiri made a calf from the Israelites' ornaments by melting them in a
    furnace, and the Israelites worshipped the image.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Al Samiri put dust from the footsteps of the horse of the angel Gabriel into
