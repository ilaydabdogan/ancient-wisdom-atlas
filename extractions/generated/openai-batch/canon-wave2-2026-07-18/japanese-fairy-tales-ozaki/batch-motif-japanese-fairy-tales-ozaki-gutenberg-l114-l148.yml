canonical_text:
  quote: ''
  summary: The preface explains that this English collection of Japanese fairy tales
    arose from a suggestion associated with Andrew Lang, was translated from modern
    versions by Sadanami Sanjin, and was adapted for young Western readers while preserving
    Japanese story material and expressions. The compiler acknowledges translation
    help, identifies sources for two stories, names the illustrator, and describes
    adding local color or incidents from other versions.
  language: English
  quote_policy: summarized
