canonical_text:
  quote: ''
  summary: Hidesato confronts an enormous fiery centipede threatening the Dragon King's
    palace. Two arrows fail, but after he wets his last arrow with human saliva, the
    arrow kills the centipede. A violent storm follows, then dawn reveals the centipede
    dead in the lake. The Dragon King and his household honor Hidesato as their preserver,
    feast him, and send him home with gifts carried by transformed fish-servants.
    The gifts are later found to have magic power, except for one ordinary bell that
    Hidesato gives to a nearby temple.
  language: English
  quote_policy: summarized
