canonical_text:
  quote: ''
  summary: Ototachibana leaps into the sea, after which the storm ceases and Yamato
    Take lands safely. Yamato Take conquers the Eastern Barbarians, mourns his wife
    at Usui Toge, and is associated with the name Azuma. After fulfilling his father’s
    orders, he travels through Owari to Omi, where villagers fear a mountain monster.
    He vows to kill it, encounters and strangles a serpent on Ibuki Mountain, becomes
    poisoned, recovers in hot mineral springs, and returns to Ise, where his priestess
    aunt thanks the Sun Goddess Amaterasu for his preservation.
  language: English
  quote_policy: summarized
