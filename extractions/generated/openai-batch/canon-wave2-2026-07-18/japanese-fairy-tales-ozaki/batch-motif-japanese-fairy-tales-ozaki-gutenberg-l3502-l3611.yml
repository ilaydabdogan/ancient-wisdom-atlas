canonical_text:
  quote: ''
  summary: A daughter denies accusations of cursing someone loved by her father. Her
    father demands to see what she has hidden, and she reveals a mirror that belonged
    to her deceased mother. The girl explains that she looks into it to meet her mother,
    following her mother’s last words. The father realizes she has mistaken her own
    reflection, which resembles her mother’s face, for her mother. He apologizes for
    suspecting her and praises her filial piety. The jealous stepmother, who had prompted
    the misunderstanding, overhears, enters, bows, confesses her jealousy and false
    suspicion of magic, asks forgiveness, and promises to love the girl. The girl
    forgives her, and the family thereafter lives happily together.
  language: English
  quote_policy: summarized
