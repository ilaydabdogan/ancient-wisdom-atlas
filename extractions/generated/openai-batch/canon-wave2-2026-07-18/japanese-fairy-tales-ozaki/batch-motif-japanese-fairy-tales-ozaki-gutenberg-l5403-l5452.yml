canonical_text:
  quote: ''
  summary: The monkey is welcomed by the crab’s family and treated as an honored guest
    at a feast, then taken to a tea-ceremony room and left waiting. As he tries to
    pour hot water from a kettle at the charcoal fireplace, a hidden chestnut bursts
    from the ashes and strikes him. A bee then stings him, and a stone mortar with
    other stones falls on him from the gate. The young crab confronts the monkey for
    murdering his father and kills him, avenging the father’s death.
