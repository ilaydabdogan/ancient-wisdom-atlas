canonical_text:
  quote: "“He has come all this way down to the bottom of the sea to our Kingdom...”"
  summary: 'Ryn Jin, the Dragon King of the Sea, formally receives the Happy Hunter
    as an honored guest in the Sea Palace. After a feast and entertainment by sea
    attendants and princesses, the Happy Hunter recalls his purpose: to recover his
    brother’s lost fishing hook. Ryn Jin summons the sea creatures, and the cuttlefish
    identifies the red bream, Tai, as likely having the hook in his throat. Tai admits
    that he snapped at the bait unintentionally and that the hook remains lodged in
    his throat.'
  language: English
  quote_policy: quoted
