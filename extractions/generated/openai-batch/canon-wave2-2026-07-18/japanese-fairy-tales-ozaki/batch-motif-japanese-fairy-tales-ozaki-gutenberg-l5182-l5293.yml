canonical_text:
  quote: ''
  summary: A monkey and a crab find a persimmon seed and a rice-dumpling. The monkey
    persuades the crab to exchange the dumpling for the seed, which the crab plants.
    The seed grows into a persimmon tree, but the crab cannot climb it and asks the
    monkey for help. The monkey eats the ripe fruit himself, refuses the crab any,
    then throws hard unripe persimmons at the crab until the crab dies. The crab's
    son finds his father's broken body and weeps.
  language: English
