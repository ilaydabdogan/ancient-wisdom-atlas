  summary: An old man with a large wen on his cheek goes into the hills to gather
    firewood. A mountain storm forces him to shelter inside a hollow tree. After the
    storm, he sees a gathering of horned demons holding a feast with music, drinking,
    and dancing. Drawn by his love of dancing, he joins them despite fear for his
    life. The demon chief praises his skill, offers him wine, and asks him to return.
