canonical_text:
  quote: ''
  summary: Sentaro reaches an island called the country of Perpetual Life on a magical
    paper crane, becomes a resident there, and discovers that its deathless inhabitants
    desire death because they have heard of Paradise. In this inverted land, poisons
    are eaten as desirable food but do not kill anyone. After three hundred years,
    Sentaro tires of the unchanging life, prays to Jofuku, and the paper crane carries
    him back toward Japan, despite his later regret.
  language: English
  quote_policy: summarized
