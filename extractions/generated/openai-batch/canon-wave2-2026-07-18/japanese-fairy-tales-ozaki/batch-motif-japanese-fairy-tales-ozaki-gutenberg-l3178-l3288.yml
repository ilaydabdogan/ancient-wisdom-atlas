canonical_text:
  quote: "“As the sword is the soul of a samurai, so is the mirror the soul of a woman”"
  summary: During her husband's absence, a wife works at spinning, weaving, and teaching
    her child. The husband returns from travel and gives the daughter a doll and cakes,
    then gives his wife a mirror. He explains its reflective use and its traditional
    associations with a woman's soul, the heart, and imperial insignia. The wife vows
    to treasure it. Years later the daughter grows to sixteen, and the mother's illness
    disrupts the family's happiness as she prepares to speak to her daughter from
    her sickbed.
  language: English
  quote_policy: quoted
