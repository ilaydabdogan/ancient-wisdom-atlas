canonical_text:
  quote: ''
  summary: A demon chief takes a good old man’s cheek wen as a pledge, which removes
    the growth without pain. A wicked neighbor with his own wen tries to repeat the
    event by hiding in the same hollow tree and dancing before the demons, but his
    poor imitation displeases them; the chief throws the earlier wen onto his right
    cheek, leaving him with two wens. The passage then begins a separate story about
    the giant Chinese Empress Jokwa, who repaired broken heavens and a sky-supporting
    pillar damaged during a rebellion.
  language: English
