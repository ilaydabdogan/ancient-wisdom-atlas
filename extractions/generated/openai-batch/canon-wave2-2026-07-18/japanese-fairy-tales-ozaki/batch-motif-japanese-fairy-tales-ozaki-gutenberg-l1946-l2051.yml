canonical_text:
  quote: ''
  summary: A childless noble couple in Nara makes a pilgrimage to Hase-no-Kwannon
    and prays for a child. A daughter, Hase-Hime, is born and named as Kwannon's gift.
    Her mother dies after giving moral instructions. The father remarries Princess
    Terute, who treats Hase-Hime cruelly. Hase-Hime excels at music, performs before
    the Emperor, receives gifts, and provokes Terute's jealousy, which grows into
    a desire to kill her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Prince Toyonari Fujiwara and Princess Murasaki live in Nara as a married noble
    couple and are sorrowful because no child has been born to them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The couple wants a child to gladden their old age, carry on the family name,
    and maintain ancestral rites after their deaths.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The couple decides to make a pilgrimage to the temple of Hase-no-Kwannon because
    they believe Kwannon answers mortals' prayers in the form most needed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Hase, the couple stays for a long time, daily offers incense, and prays
    to Kwannon; the passage states that their prayer is answered.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A daughter is born to Princess Murasaki and is named Hase-Hime, or Princess
    of Hase, because she is described as the gift of Kwannon at that place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When Hase-Hime is five, Princess Murasaki becomes dangerously ill, calls her
    daughter, strokes her head, and gives instructions about obedience, filial conduct,
    kindness, and becoming a model woman.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hase-Hime listens respectfully, promises to do as instructed, and grows up
    as a good and obedient little princess.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: After Princess Murasaki's death, Prince Toyonari marries Princess Terute,
    who is described as cruel-hearted and unloving toward Hase-Hime.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Princess Terute repeatedly says to herself that Hase-Hime is not her child,
    while Hase-Hime bears unkindness patiently, waits upon her stepmother, and obeys
    her.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Hase-Hime studies music, poetry, the koto, letter writing, and verse; at twelve
    she and Princess Terute are summoned to perform before the Emperor.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the Festival of the Cherry Flowers, the Emperor commands Hase-Hime to play
    the koto and Princess Terute to accompany her on the flute; the Emperor sits behind
    a bamboo curtain so that he can see without being seen.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: Hase-Hime plays well, Princess Terute fails in the accompaniment, and the
    Emperor sends gifts to Hase-Hime; Terute becomes jealous.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Princess Terute has a son and thinks that, if Hase-Hime were absent, her son
    would have all of his father's love; this thought grows into a desire to take
    Hase-Hime's life.
  category: sequence
  evidence_refs:
  - ev:10
