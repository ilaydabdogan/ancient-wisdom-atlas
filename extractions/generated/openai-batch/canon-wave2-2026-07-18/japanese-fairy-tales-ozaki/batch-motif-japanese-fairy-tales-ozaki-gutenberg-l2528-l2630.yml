canonical_text:
  quote: ''
  summary: A poor, childless bamboo-cutter finds a tiny radiant girl inside a glowing
    bamboo stem and takes her home to be raised by his wife. The couple becomes happy
    and wealthy after her arrival. The child rapidly grows into a beautiful, light-giving
    young woman named Princess Moonlight. Her beauty becomes famous, and many suitors
    try unsuccessfully to see or court her; five Knights persist through hardship
    and seasons, but the bamboo-cutter says he cannot compel her because he is not
    her real father.
  language: English
  quote_policy: summarized
