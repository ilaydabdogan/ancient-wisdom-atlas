  summary: 'An old performing monkey overhears that his master plans to sell him to
    the butcher. The monkey seeks advice from a wild boar known for wisdom. The boar
    proposes a staged abduction of the master''s infant son so the monkey can rescue
    the child and regain favor. The plan succeeds: the parents spare the monkey, send
    the butcher away, and the monkey lives peacefully thereafter.'
