canonical_text:
  quote: "“The time has come,” he said, “for Princess Moonlight to return to the moon
    from whence she came.”"
  summary: Princess Moonlight reveals that she came from the moon and must soon return.
    The Emperor and her foster-parents attempt to prevent her departure with guards,
    but a cloud descends from the moon bearing a flying chariot and luminous beings.
    Their chief explains that her earthly life was a punishment and that the bamboo-cutter’s
    prosperity was a reward for caring for her. Princess Moonlight is revealed in
    radiance, placed in the chariot, comforts her foster father, and gives him her
    embroidered outer garment as a keepsake.
  language: English
  quote_policy: quoted
