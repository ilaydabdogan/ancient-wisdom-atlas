  quote: one of the pillars upholding the Heavens was broken so that one corner of
    the sky dropped till it touched the earth
  summary: Hako and Eiko recognize their deliverer as more than human. The Empress
    Jokwa seeks help from Shikuyu, the Fire King, against the rebel wizard Kokai,
    a master of water. Shikuyu leads Jokwa’s army, uses ashes from a burned shrub
    to neutralize Kokai’s flood, detects Kokai’s attempted deception in combat, and
    routes the enemy. Kokai dies by striking his head against the rocks of Mount Shu.
    His fall bursts the mountain, releases fire and lava, breaks a pillar supporting
    Heaven, and leaves Heaven and earth damaged as Jokwa travels to inspect the disaster.
  language: English
  quote_policy: quoted
