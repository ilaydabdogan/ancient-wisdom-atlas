canonical_text:
  quote: ''
  summary: Empress Jokwa repairs a broken part of the sky with paste made from stones
    of five colors and mends a broken heavenly pillar with the legs of a great tortoise.
    Darkness remains because the Sun and Moon have withdrawn after Mount Shu burst
    forth with fire and damaged the roads of Heaven. Jokwa sends two wise men in magic
    chariots to inform the Sun and Moon that the roads and pillar have been restored.
    The Sun and Moon resume their journeys, light returns to earth, and the people
    rejoice.
  language: English
