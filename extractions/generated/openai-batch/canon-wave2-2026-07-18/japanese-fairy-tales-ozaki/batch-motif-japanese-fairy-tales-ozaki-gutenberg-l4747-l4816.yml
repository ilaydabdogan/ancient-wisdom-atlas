  quote: ''
  summary: A withered tree bursts into bloom, and the Daimio rewards and names the
    good old man Hana-Saka-Jijii. The envious neighbor tries to imitate him by using
    ashes from the burned mortar, falsely claims to be the true Hana-Saka-Jijii, fails
    to make a dead tree bloom, and is imprisoned as an impostor. The good old man
    becomes prosperous and lives happily.
