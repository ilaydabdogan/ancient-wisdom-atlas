  quote: ''
  summary: Momotaro asks his old parents for permission to leave home, explains that
    he intends to conquer cannibal devils on a sea island northeast of Japan, receives
    his father’s blessing and rice-cake provisions, departs, recruits a dog after
    a roadside confrontation, and meets a monkey who asks to join while the dog quarrels
    with it.
