canonical_text:
  quote: ''
  summary: Two suitors of Princess Moonlight attempt to satisfy quests for rare objects.
    The First Knight substitutes a stone bowl from a Kyoto temple for Buddha’s bowl,
    but the Princess detects that it does not shine and rejects it. The Second Knight
    secretly has jewelers make a counterfeit branch from the gold and silver tree
    of Mount Horai, then invents a long sea-voyage story to explain it. The unpaid
    jewelers reveal the deception; the Princess pays them, returns the branch, and
    the disappointed Knight withdraws to the mountains after beating the workmen.
  language: English
  quote_policy: summarized
