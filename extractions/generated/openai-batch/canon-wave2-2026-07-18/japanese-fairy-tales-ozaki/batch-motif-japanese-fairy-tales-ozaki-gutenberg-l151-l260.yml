canonical_text:
  quote: ''
  summary: Fujiwara Hidesato, known as Tawara Toda or My Lord Bag of Rice, sets out
    armed for adventure and reaches the Seta-no-Karashi bridge over Lake Biwa. A giant
    serpent-dragon blocks the bridge, but he walks over it without fear. The dragon
    disappears and a strange man appears, identifying himself as the Dragon King of
    the Lake. The Dragon King explains that he took serpent-dragon form to find a
    brave human and asks Hidesato to kill a monster centipede that lives on Mount
    Mikami and carries off his family. Hidesato agrees and is led through parted lake
    waters to the Dragon King's palace under the bridge, where he is feasted by aquatic
    attendants. At midnight the palace shakes, and two fiery eyes approach from the
    opposite mountain; the Dragon King identifies them as the centipede.
  language: English
  quote_policy: summarized
