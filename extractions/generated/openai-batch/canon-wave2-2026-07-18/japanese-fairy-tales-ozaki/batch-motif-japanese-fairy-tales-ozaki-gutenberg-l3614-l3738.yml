canonical_text:
  quote: ''
  summary: Opening portion of "The Goblin of Adachigahara." The passage describes
    Adachigahara as a haunted plain where a cannibal goblin is said to take the form
    of an old woman and where travelers have disappeared. A lost Buddhist pilgrim
    arrives at dusk, finds a poor cottage, is admitted by an old woman, warmed and
    fed, and then is warned not to approach or look into an inner room while she goes
    out for wood. Alone in the dim hut, he becomes frightened and curious.
