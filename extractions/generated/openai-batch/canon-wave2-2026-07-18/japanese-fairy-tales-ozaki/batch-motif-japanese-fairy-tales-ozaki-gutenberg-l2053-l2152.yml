canonical_text:
  quote: ''
  summary: A jealous stepmother prepares poisoned wine for Hase-Hime but mistakenly
    gives it to her own son, who dies. Later, Hase-Hime is recognized as a gifted
    young poetess. During floods at Nara, the roaring Tatsuta River disturbs the Emperor
    and temple prayers fail. The court recalls an earlier poetess, Ono-no-Komachi,
    said to have moved Heaven by verse, and Hase-Hime is ordered to compose a poem-prayer.
    She reads the poem by the river, raising it toward Heaven; the river becomes quiet
    and the Emperor recovers. She is rewarded with rank and a new title. Her stepmother’s
    jealousy increases, and she orders an old servant to take Hase-Hime to the Hibari
    Mountains and kill her.
  language: English
  quote_policy: summarized
