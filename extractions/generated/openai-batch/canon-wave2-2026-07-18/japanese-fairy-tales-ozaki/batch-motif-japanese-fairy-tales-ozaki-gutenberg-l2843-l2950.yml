canonical_text:
  quote: ''
  summary: The Third Knight obtains a purported fire-rat skin from China, but Princess
    Moonlight tests it by fire and it burns. The Fourth Knight delegates a quest for
    a dragon’s five-color-radiating jewel, later searches by ship, meets a storm,
    falls ill, and abandons the Princess. The Fifth Knight fails to find the swallow’s
    shell. The Emperor hears of Princess Moonlight’s beauty, sends a court lady, then
    visits her himself; when he tries to bring her to court, she begins to fade into
    a shadow until he promises to leave her free.
  language: English
  quote_policy: summarized
