canonical_text:
  quote: ''
  summary: 'The passage introduces Kintaro, the Golden Boy: after his father Kintoki
    dies following disgrace at court, Kintaro''s mother flees to the Ashigara Mountains,
    where Kintaro is born. Kintaro grows with exceptional strength, helps woodcutters
    with an ax, befriends and commands animals, and presides over a wrestling game
    in which the hare defeats the monkey and receives a rice-dumpling prize before
    the monkey asks for a rematch.'
  language: English
  quote_policy: summarized
