canonical_text:
  quote: As soon as his feet touched the flood it divided
  summary: Kokai, a giant rebel wizard, raises a revolt after failing to become emperor
    and uses a Water Devil to flood the country. Empress Jokwa appoints the young
    warriors Hako and Eiko to command her front army. After rivalry over command,
    both lead the army against Kokai. In battle Kokai retreats and then uses magic
    to raise another flood. Hako and Eiko are nearly drowned, but a white-haired old
    man on a miraculous island parts the flood and makes a road. When Kokai attacks
    him, the old man transforms into a white crane and flies upward into the heavens.
  language: English
  quote_policy: quoted
