canonical_text:
  quote: "“Oh, joy! I have got my arm back again!”"
  summary: Watanabe keeps the severed arm of an ogre locked in an iron-banded box.
    An old woman claiming to be his former nurse visits at night, persuades him to
    show her the arm, seizes it, reveals herself as the ogre, and escapes through
    the roof into mist and clouds. The ogre then avoids Kyoto, and the city is safe
    at night.
  language: English
  quote_policy: quoted
