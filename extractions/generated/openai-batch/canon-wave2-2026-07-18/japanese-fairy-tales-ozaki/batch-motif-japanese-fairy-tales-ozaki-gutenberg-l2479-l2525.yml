canonical_text:
  quote: ''
  summary: Sentaro dreams that a storm destroys his paper crane and leaves him in
    the sea, where a shark threatens him. He awakens before a shrine and receives
    a visit from a messenger sent by Jofuku, who explains that the dream was a test
    of Sentaro's desire to avoid death. The messenger tells him to abandon the search
    for hermit life and the Elixir of Life, return home, fulfill family and ancestral
    duties, and study a book of precepts. Sentaro obeys and prospers.
  language: English
