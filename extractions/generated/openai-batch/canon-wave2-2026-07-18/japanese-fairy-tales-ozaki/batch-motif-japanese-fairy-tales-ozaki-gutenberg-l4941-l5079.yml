canonical_text:
  quote: ''
  summary: A chief steward instructs the jelly fish to lure a monkey from Monkey Island
    to the Dragon King's Palace by flattering him and describing the palace. The jelly
    fish finds a monkey in a pine tree, persuades him to ride across the sea on his
    back, and midway reveals that the Dragon Queen needs the liver of a live monkey.
    The frightened monkey conceals his fear and begins to devise a way to escape.
  language: English
