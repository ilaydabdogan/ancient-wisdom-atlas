canonical_text:
  quote: ''
  summary: The jelly fish reveals that he brought the monkey because the monkey's
    liver is needed. The monkey deceives him by claiming that he has left his livers
    hanging on a pine-tree, persuades him to return to Monkey Island, escapes into
    the tree, and mocks him. The jelly fish returns to the Dragon King of the Sea
    and confesses his failure. The Dragon King orders the jelly fish's bones removed
    and has him beaten and thrown into the water. The narrator concludes that this
    punishment explains why jellyfish are now soft and boneless.
  language: English
  quote_policy: summarized
