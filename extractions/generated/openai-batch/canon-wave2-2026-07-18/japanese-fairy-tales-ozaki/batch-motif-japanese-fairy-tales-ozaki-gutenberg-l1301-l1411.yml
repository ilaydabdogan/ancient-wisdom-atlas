canonical_text:
  quote: ''
  summary: 'After the badger kills and cooks the farmer''s wife, the farmer grieves.
    A nearby rabbit hears him, promises to avenge the wife, and begins a sequence
    of deceptive punishments against the badger: burning a grass bundle on the badger''s
    back, applying a painful red-pepper mixture as supposed medicine, and then planning
    a fishing trip using two boats, one wooden and one clay.'
  language: English
  quote_policy: summarized
