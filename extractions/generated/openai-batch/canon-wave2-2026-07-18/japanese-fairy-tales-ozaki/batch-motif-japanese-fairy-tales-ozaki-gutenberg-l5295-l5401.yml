canonical_text:
  quote: ''
  summary: The young crab concludes from persimmon-related clues that the monkey murdered
    his father. He decides not to attack directly, recruits the mortar, bee, and chestnut
    to help with revenge, and conceals his knowledge. The monkey boasts and worries
    about discovery, then is reassured by the crab settlement’s apparent ignorance.
    A messenger invites him to a seventh-day memorial festival for the old crab, presenting
    the death as an accident; the monkey falsely mourns, accepts, and sets out for
    the feast.
  language: English
  quote_policy: summarized
