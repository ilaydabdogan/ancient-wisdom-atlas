canonical_text:
  quote: ''
  summary: 'Five suitors petition the bamboo-cutter to intercede with Princess Moonlight.
    The old man urges her to consider marriage and recalls finding her as a tiny being
    in a radiant bamboo. The Princess refuses immediate marriage and sets acquisition
    trials: each suitor must bring a rare or supernatural object from distant places.
    The suitors despair at the difficulty but later resolve to attempt the quests.'
  language: English
  quote_policy: summarized
