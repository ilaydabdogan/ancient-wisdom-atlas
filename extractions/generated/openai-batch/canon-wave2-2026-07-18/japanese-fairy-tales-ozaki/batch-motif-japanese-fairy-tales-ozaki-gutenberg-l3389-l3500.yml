  quote: ''
  summary: A jealous stepmother complains about her stepdaughter, decides to drive
    her from the house, and tells her husband that the girl is using image-magic to
    kill her. The father doubts the accusation but investigates. The daughter, who
    has actually been withdrawing to look into a mirror and remember her dead mother,
    hides the mirror when her father enters. Misreading her behavior, he angrily questions
    her about cursing her stepmother; she does not understand the accusation and tries
    to clear herself.
