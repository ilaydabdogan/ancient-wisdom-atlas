canonical_text:
  quote: "“take out this mirror and in the clear and shining surface you will always
    see me”"
  summary: A dying mother gives her daughter a mirror and tells her she may see her
    there after death. After the mother dies, the daughter grieves, looks into the
    mirror, sees a youthful image of her mother, and believes it is her mother’s soul.
    The mirror becomes a source of daily consolation and moral resolve. After a year,
    the father remarries, and the new stepmother later treats the girl unkindly and
    tries to separate father and child.
