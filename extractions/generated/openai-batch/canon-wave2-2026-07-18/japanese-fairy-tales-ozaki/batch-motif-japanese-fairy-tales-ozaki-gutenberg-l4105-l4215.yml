canonical_text:
  quote: ''
  summary: 'At a well near the Sea King’s Palace, two sea princesses see the Happy
    Hunter reflected in the water from a tree above them. He asks for water, receives
    it in a jeweled cup, and gives a magatama jewel in return. The parties exchange
    identities: he is Hohodemi, grandson of Amaterasu, and they are the daughters
    of Ryn Jin, the Sea King. Hohodemi explains that he has come to the undersea realm
    seeking help to recover his brother’s lost fishing hook. The princesses escort
    him toward their father, and Ryn Jin orders his court and the chief fish of the
    sea to welcome the august visitor ceremoniously.'
  language: English
  quote_policy: summarized
