canonical_text:
  quote: ''
  summary: Prince Yamato enters the tent of the rebel chiefs Kumaso and Takeru in
    female disguise, serves wine, kills Kumaso with a hidden dagger, and then wounds
    Takeru, who names him Yamato Take before dying. On his return route, Yamato Take
    deceives another outlaw, Idzumo Takeru, by feigned friendship, a swimming invitation,
    and a sword substitution at the River Hinokawa; he then beheads him. The narrator
    summarizes that Yamato Take defeats the king’s foes by wisdom, strength, and craft,
    brings peace, and receives honor from the king on returning to the capital.
  language: English
  quote_policy: summarized
