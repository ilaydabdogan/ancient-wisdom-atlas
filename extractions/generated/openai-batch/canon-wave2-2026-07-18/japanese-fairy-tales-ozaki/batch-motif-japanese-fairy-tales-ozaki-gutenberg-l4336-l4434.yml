canonical_text:
  quote: ''
  summary: A cuttlefish removes the lost hook from the Tai and brings it to Ryn Jin,
    who returns it to the Happy Hunter. The Happy Hunter asks that the Tai be forgiven.
    After staying three years in the Sea Realm, the Happy Hunter asks to return to
    Japan and to his brother. Ryn Jin sorrowfully accepts his departure and gives
    him two ancestral Tide-Jewels, the nanjiu and kanjiu, which control flood and
    ebb tides.
  language: English
