canonical_text:
  quote: ''
  summary: Urashima Taro returns from the Sea King’s realm to his home shore and village,
    discovers that three hundred years have passed while he experienced only a few
    days away, and learns that his parents and acquaintances are dead. Seeking a way
    back to the Princess beyond the sea, he opens the tamate-bako despite her prohibition.
    A purple cloud leaves the box, and Urashima immediately ages and dies on the beach.
    The narrator closes with a moral warning against disobedience.
  language: English
