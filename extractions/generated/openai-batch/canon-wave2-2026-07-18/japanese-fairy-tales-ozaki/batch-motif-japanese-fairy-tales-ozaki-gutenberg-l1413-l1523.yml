canonical_text:
  quote: ''
  summary: The passage closes the badger tale with the rabbit luring the badger into
    a clay boat, letting it dissolve in the water, and killing him in revenge for
    the old woman's murder; the rabbit then reports this to the old farmer and becomes
    his companion. A new tale begins by describing the shinansha, a south-pointing
    carriage invented by the mythological Chinese emperor Kotei. Kotei's birth is
    preceded by a celestial portent. During war against the rebel magician Shiyu,
    Kotei first suffers defeat from magical fog, then invents the shinansha to guide
    his army through fog. Shiyu escapes across a flooded river by magic, while Kotei,
    lacking boats, halts and later observes a spider floating across a pond on a leaf.
  language: English
  quote_policy: summarized
