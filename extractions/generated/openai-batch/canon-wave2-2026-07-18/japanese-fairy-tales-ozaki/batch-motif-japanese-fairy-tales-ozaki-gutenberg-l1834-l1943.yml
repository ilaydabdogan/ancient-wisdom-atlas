canonical_text:
  quote: ''
  summary: A disguised general recognizes Kintaro’s extraordinary strength, reveals
    himself as Sadamitsu, and offers to take Kintaro to Lord Minamoto-no-Raiko to
    train as a samurai. Kintaro’s mother entrusts him to the general. Kintaro departs
    from the mountain, is farewelled by his mother and tamed animals, becomes Raiko’s
    vassal, rises to chief of the Four Braves, kills a cannibal monster in its den,
    gains honor and wealth, and fulfills his promise to care for his mother in the
    Capital.
  language: English
