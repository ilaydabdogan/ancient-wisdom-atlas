canonical_text:
  quote: ''
  summary: After escaping a burning prairie, Prince Yamato Take attributes his survival
    to the sword of Murakumo and to Amaterasu, renames the sword Kusanagi-no-Tsurugi,
    and names the place Yaidzu. He travels east with his wife Ototachibana, neglects
    her while favoring Princess Miyadzu, and then attempts to cross the straits from
    Idzu to Kadzusa. After he scoffs at the sea, a storm raised by the Sea God endangers
    the boat. Ototachibana declares that she will give her life in place of Yamato
    Take’s to appease the sea and bring him safely to shore.
  language: English
  quote_policy: summarized
