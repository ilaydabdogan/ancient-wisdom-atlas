canonical_text:
  quote: ''
  summary: The passage introduces the sacred imperial treasures of Japan, especially
    the sword later called the grass-cleaving sword, and frames its renaming through
    the story of Prince Yamato. Yamato, a young royal son, is ordered by Emperor Keiko
    to subdue rebel brothers in Kiushiu. Before departing he prays at Ise, receives
    a robe from his aunt Princess Yamato, encounters impassable terrain near the enemy
    headquarters, and chooses stratagem. With his wife Ototachibana's help he disguises
    himself as a woman and goes alone toward the enemy camp with a hidden dagger.
  language: English
