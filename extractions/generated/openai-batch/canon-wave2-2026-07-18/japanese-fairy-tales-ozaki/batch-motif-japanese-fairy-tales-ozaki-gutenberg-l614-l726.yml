  quote: ''
  summary: After the old man receives treasure from the sparrows' small box, the old
    woman reproaches him for not taking the larger box. Driven by greed, she goes
    to the bamboo grove and demands the larger box from the Lady Sparrow. The Lady
    Sparrow gives it to her. The old woman opens it on the way home and terrifying
    demons and creatures emerge, frightening her. Back home, the old man says her
    wickedness has met its reward.
