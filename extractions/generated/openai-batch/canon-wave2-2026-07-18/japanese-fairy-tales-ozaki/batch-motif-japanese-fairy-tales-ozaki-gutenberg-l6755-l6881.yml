canonical_text:
  quote: ''
  summary: In Kyoto, people fear a cannibal ogre said to haunt the Gate of Rashomon
    at twilight. During a feast, the knight Hojo repeats the rumor, and Watanabe rejects
    it as an old woman’s story because Raiko had previously destroyed ogres at Oeyama.
    Challenged to prove the matter, Watanabe arms himself, takes a paper signed by
    his comrades, and rides to the gate on a dark stormy night. After posting the
    paper, he is seized from behind by a huge hairy arm. He cuts at it with his sword
    and confronts an enormous fire-breathing ogre. They fight until the ogre flees.
    Watanabe cannot catch it, but he finds and carries home the severed arm as proof
    and trophy.
  language: English
  quote_policy: summarized
