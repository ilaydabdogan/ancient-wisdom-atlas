canonical_text:
  quote: ''
  summary: Prince Yamato Take is sent east by his father the King to subdue a rebellion.
    The King gives him a royal spear. On the way, the Prince worships at Ise, where
    his aunt, the Princess of Yamato and High Priestess, gives him the sword Murakumo
    and a bag of flints. In Suruga, the governor feigns hospitality and lures him
    into a deer hunt on a grassy plain, then sets the grass on fire around him. The
    Prince uses the flints and sword to create a counter-fire and cut the grass. The
    wind changes, saving him unharmed, while the governor is burned in the flames
    he had set.
  language: English
  quote_policy: summarized
