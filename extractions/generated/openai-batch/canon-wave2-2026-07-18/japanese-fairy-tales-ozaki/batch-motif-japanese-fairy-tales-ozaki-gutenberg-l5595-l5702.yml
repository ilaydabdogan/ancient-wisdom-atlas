canonical_text:
  quote: ''
  summary: A wounded hare is first given a malicious false cure that worsens his pain,
    then meets a kind figure who prescribes washing in pond water and rolling on kaba
    flowers. The hare recovers, learns the helper is Okuni-nushi-no-Mikoto, predicts
    that Princess Yakami will choose him over his brothers, and the prediction is
    fulfilled. The coda says Okuni-nushi-no-Mikoto is worshiped in parts of Japan
    and the hare is famous as the White Hare of Inaba.
  language: English
  quote_policy: summarized
