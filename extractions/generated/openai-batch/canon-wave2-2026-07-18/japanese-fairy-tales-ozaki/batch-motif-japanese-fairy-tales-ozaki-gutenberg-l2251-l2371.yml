canonical_text:
  quote: ''
  summary: Sentaro, an idle man afraid of sickness and death, recalls stories of long-lived
    rulers and Shin-no-Shiko's search for the Elixir of Life. He seeks hermits associated
    with Horaizan, Mount Fuji, and high peaks, then prays at Jofuku's shrine. Jofuku
    appears, says Sentaro's desire is selfish and that he is unfit for hermit austerities,
    but sends him toward a deathless country on a paper crane that grows and flies
    away over the mountains toward the sea.
