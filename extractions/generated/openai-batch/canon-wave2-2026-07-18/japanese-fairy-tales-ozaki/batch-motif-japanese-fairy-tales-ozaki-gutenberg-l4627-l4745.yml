canonical_text:
  quote: ''
  summary: After the dog Shiro is killed by the wicked neighbor and buried beneath
    a yenoki tree, Shiro’s kind master obtains the tree, makes a mortar from it, and
    finds that it produces abundant rice cakes. The greedy neighbor borrows the mortar,
    breaks it, and burns it when it yields foul-smelling matter for him. Shiro’s master
    takes the ashes; when they touch autumn trees, the trees burst into bloom. A Knight
    sent by a Daimio summons the old man to make a withered favorite cherry tree flower,
    and the old man climbs the tree and scatters the ashes over its branches.
  language: English
