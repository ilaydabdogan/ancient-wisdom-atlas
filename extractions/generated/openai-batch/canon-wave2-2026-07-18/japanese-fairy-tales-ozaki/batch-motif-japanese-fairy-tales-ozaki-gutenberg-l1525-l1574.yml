canonical_text:
  quote: "“Do not be afraid. This is a messenger from Heaven. My time here is finished!”"
  summary: Kotei invents boats after observing a leaf carry a spider across a river,
    uses them to move his army and defeat Shiyu, then rules peacefully and beneficially.
    After a long reign, a golden-glittering Dragon descends as a messenger from Heaven.
    Kotei mounts it and ascends skyward with the Empress and a few courtiers, while
    others fail to board. Later, Kotei’s bow and arrow fall to the palace courtyard
    and are preserved as sacred relics.
  language: English
  quote_policy: quoted
