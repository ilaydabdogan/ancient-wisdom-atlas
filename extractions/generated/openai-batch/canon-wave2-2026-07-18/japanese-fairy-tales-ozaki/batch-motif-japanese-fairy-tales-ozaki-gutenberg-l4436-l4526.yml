  quote: ''
  summary: Ryn Jin gives the Happy Hunter tide-controlling jewels and sends him back
    to Japan on a giant crocodile. The Happy Hunter returns the lost fishing hook
    to his brother, the Skillful Fisher, who has usurped his place and later attempts
    to kill him. The Happy Hunter uses the flood and ebb tide jewels to overwhelm
    and then save his brother, who repents, restores his rights, and acknowledges
    him as Lord of Japan. Peace follows.
