  summary: A white hare living on Oki wants to cross the sea to Inaba. He deceives
    a crocodile into summoning many crocodiles to form a line across the water, walks
    over their backs while pretending to count them, and reaches the mainland. After
    he mocks them, the crocodiles catch him, pull out his fur, and leave him injured
    on the beach, where prince-like men find him crying.
