canonical_text:
  quote: ''
  summary: 'Opening portion of “The Tongue-Cut Sparrow”: an old man loves and cares
    for a tame sparrow, while his wife dislikes it. The sparrow eats starch by mistake,
    truthfully confesses and apologizes, but the old woman angrily cuts off its tongue
    and drives it away. The old man returns, learns what happened, grieves, and sets
    out the next morning through hills, woods, and bamboo clumps to search for the
    tongue-cut sparrow.'
