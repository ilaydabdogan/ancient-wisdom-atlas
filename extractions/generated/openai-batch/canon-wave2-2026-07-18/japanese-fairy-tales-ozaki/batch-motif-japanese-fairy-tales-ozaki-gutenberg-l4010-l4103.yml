  summary: The Skillful Fisher threatens the Happy Hunter over a lost fishing hook.
    On the seashore, the Happy Hunter meets Shiwozuchino Okina, who advises him to
    seek Ryn Jin, the Dragon King of the Sea, in Ryn Gu. The old man makes him a basket-like
    boat that carries him through the sea to the Sea King’s Palace. At the palace
    gate, the Happy Hunter waits hidden in a katsura tree above a well and observes
    two beautiful women or princesses carrying golden buckets to draw water.
