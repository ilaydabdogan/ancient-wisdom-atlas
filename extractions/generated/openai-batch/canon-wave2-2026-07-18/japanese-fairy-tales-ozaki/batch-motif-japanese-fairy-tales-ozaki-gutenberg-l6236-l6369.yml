canonical_text:
  quote: ''
  summary: An elderly peasant couple work separately, the man cutting grass and the
    woman washing clothes at the river. A huge peach floats downstream; the woman
    chants an old charm-verse and claps, and the peach comes to her. She takes it
    home. When her husband tries to cut it, it splits by itself and a child emerges,
    saying he is not a demon or fairy but was sent by Heaven in response to their
    longing for a child. The couple name him Momotaro, Son of a Peach. He grows into
    a strong, courageous, wise youth and thanks his foster-father.
  language: English
  quote_policy: summarized
