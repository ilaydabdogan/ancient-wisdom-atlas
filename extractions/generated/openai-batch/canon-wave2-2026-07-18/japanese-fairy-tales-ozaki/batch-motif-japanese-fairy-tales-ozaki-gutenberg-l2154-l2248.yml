canonical_text:
  quote: ''
  summary: Katoda removes Hase-Hime under the stepmother’s orders but secretly spares
    her and shelters her in a wilderness cottage. Prince Toyonari searches for his
    missing daughter, later discovers her while hunting in the Hibari Mountains and
    hearing her read Buddhist scriptures, and brings her home after Katoda reveals
    the truth. The stepmother flees in disgrace, Katoda is rewarded, and Hase-Hime
    later marries an adopted heir, is remembered as wise and devout, and is associated
    with a preserved Buddhist tapestry.
  language: English
