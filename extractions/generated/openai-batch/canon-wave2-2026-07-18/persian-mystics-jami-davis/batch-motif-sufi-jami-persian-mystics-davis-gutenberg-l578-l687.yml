canonical_text:
  quote: ''
  summary: 'The passage concludes an editorial summary of Yúsuf and Zulaikha: Zulaikha’s
    words lead Yúsuf to interview her; she asks for beauty, youth, and his love; Yúsuf
    grants youth and beauty, prays, and receives Gabriel’s word before marriage. The
    passage then reports Zulaikha’s later piety, a House of Prayer built for her,
    Yúsuf’s death, and Zulaikha’s soul joining him. It interprets the poem as revealing
    the Beloved, approached through purification after passion as an idol is broken.
    The passage then introduces Jámí’s Baháristán as a garden-organized didactic work
    modeled on Sa‘di’s Gulistán, written for Jámí’s son, and divided into eight “Gardens.”'
  language: English
  quote_policy: summarized
