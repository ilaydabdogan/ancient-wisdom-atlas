canonical_text:
  quote: ''
  summary: 'The passage summarizes episodes from Salámán and Absál: Absál becomes
    Salámán’s lover, the lovers flee, the king sees them in a world-reflecting mirror
    and compels their return, and a later fire scene leaves Absál consumed while Salámán
    survives and is instructed in Celestial Love. It then summarizes Jámí’s Lawá''ih
    as a Sufi mystical treatise teaching abandonment of earthly loves, rejection of
    vanity and merely worldly knowledge, destruction of self, union with the Divine,
    and the indwelling of the Beloved in the emptied heart.'
  language: English
  quote_policy: summarized
