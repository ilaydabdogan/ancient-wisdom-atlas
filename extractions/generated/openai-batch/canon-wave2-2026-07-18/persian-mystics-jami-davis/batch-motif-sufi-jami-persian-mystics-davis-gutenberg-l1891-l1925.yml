canonical_text:
  quote: ''
  summary: A prose anecdote tells how 'Abdullah Ibn Ja'far encounters an enslaved
    guardian of a date-grove who gives his entire daily allowance of two loaves to
    a hungry dog and chooses to fast. 'Abdullah judges the slave more liberal than
    himself, buys both the slave and the date-grove, gives the grove to him, and emancipates
    him. A concluding poem exhorts bravery, manliness, guarding the heart and tongue,
    returning good for evil, and making beneficence a rule.
