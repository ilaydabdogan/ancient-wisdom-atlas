canonical_text:
  quote: ''
  summary: An unnamed speaker asks Wámik why he moves silently like a shadow, meditating
    night and day, and calls him wounded by Azra. Wámik answers by imagining withdrawal
    with Azra to a remote desert fountain, pitching a tent there forever and gazing
    on his Beloved until the distinction between gazer and beloved disappears into
    one undivided being. He states that whatever is not One suffers absence and that
    Love's city has room only for One. A following couplet counsels doing good and
    turning from ill.
  language: English
  quote_policy: summarized
