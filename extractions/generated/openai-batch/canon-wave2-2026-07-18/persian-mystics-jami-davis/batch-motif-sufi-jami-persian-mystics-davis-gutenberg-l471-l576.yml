canonical_text:
  quote: Dream not that "Truth" can be revealed by words
  summary: 'The passage first presents Jámí’s emphasis on silence before Truth and
    the Beloved, then summarizes the plot and mystical turn of Jámí’s Yúsuf and Zulaikha:
    Zulaikha’s passionate pursuit, idolatrous attachment, false accusation, Yúsuf’s
    imprisonments and rise through dream interpretation, and Zulaikha’s later blindness,
    poverty, roadside longing, and idol-shattering renunciation.'
  language: English
  quote_policy: quoted
