  summary: In three short lyric and didactic sections, a first-person voice describes
    crossing land, sea, plains, and mountains to reach a sanctuary of Union with Thee;
    an admonition warns that pride is nearly invisible and hard to remove from the
    heart; another first-person voice addresses the Beloved and says the Beloved's
    door and threshold are preferred over Paradise, houris, or wages.
