  summary: An Arab of the desert praises an Arab chief in verse, asks for the chief's
    generous hand, and kisses it. After the chief jokes that the Arab's lip-hairs
    scratched his hand, the Arab answers with a humorous comparison of porcupine bristles
    and a lion's paw. The chief values the witty reply more than the poem and gives
    monetary rewards for both.
