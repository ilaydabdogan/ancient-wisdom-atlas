canonical_text:
  quote: ''
  summary: Zulaikha breaks an idol with a flint stone, performs a penitential ablution
    with heart-blood and tears, bows to the dust, and prays to God for forgiveness
    and restoration. In a later dialogue, Yusuf asks about her lost youth, beauty,
    eye-light, straightness, pearls, gold, and crown; she answers that absence from
    him, grief, and gifts made in praise of his beauty have emptied her of former
    adornments, leaving her heart as Love's storehouse.
  language: English
  quote_policy: summarized
