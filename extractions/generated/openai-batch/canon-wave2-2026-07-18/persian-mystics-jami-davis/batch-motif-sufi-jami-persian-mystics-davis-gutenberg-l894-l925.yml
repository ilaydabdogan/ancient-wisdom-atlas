  quote: I leave both worlds behind to follow her!
  summary: The passage praises Reason as the ancient fountain from which prophets
    drew and identifies the wise as the only prophets. It then presents a speaker
    addressing a Shah in submissive devotion, lamenting weakness and entrapment, and
    saying that thought or sight of the moon-like beloved causes him to abandon both
    worlds to follow her. A final love lyric says that without the lover even Heaven
    would be constricted, while with the lover even an ant's eye would exceed Heaven.
