canonical_text:
  quote: |-
    Choose a love wherewith on the day of reckoning
        Thou mayest abide in the eternal abode.
  summary: A maiden and a youth declare mutual love. The girl expresses a wish for
    physical intimacy. The youth says he shares the desire, but refuses because he
    fears that a non-pious friendship will become enmity on the day of resurrection.
    He departs while reciting lines urging the heart to abandon transient love and
    choose a love that endures at reckoning.
  language: English
  quote_policy: quoted
