canonical_text:
  quote: ''
  summary: The passage recounts Jámí’s visionary summons to Sufi instruction, ascetic
    discipline, regard for holy men, pilgrimage disputes, public punishments after
    a textual deception, avoidance of royal gifts, retirement from public life, and
    the opening of the allegory of Salámán and Absál, where a childless king is counselled
    by a sage and receives a son by magic.
  language: English
  quote_policy: summarized
