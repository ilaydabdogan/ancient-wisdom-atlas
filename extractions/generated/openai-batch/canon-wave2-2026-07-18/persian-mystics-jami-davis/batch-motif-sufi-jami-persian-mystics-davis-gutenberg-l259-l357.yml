candidate_motifs:
- id: motif:1
  label: Visionary summons to spiritual discipleship
  taxonomy_refs:
  - initiation
  - mystical_quest
  basis: A spirit-mediated vision commands Jámí to go to an indispensable spiritual
    instructor, and he obeys by seeking instruction.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage presents this as biographical rather than as a fully narrated
    mythic initiation cycle.
- id: motif:2
  label: Ascetic discipline as spiritual formation
  taxonomy_refs:
  - initiation
  - mystical_quest
  basis: Jámí lives under a holy man as a rigid ascetic and performs strenuous penances
    before returning to society.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage does not explicitly state an initiatory ritual structure beyond
    instruction and penance.
- id: motif:3
  label: Pilgrimage to a holy city
  taxonomy_refs:
  - mystical_quest
  - departure
  basis: Jámí travels on pilgrimage to Mecca, described as the holy city of Islam,
    and is received with honor on the journey.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: medium
  cautions: The pilgrimage is embedded in biography and dispute narrative; no supernatural
    journey stages are described.
- id: motif:4
  label: Exposure of deceptive alteration of sacred or authoritative text
  taxonomy_refs:
  - forbidden_knowledge
  - wisdom
  basis: A mutilated literary passage is publicly examined and the suppressed beginning
    and end, plus added offensive material, are discovered.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: low
  cautions: The available taxonomy only loosely fits; the text does not frame the
    deception as forbidden knowledge.
- id: motif:5
  label: Renunciation or avoidance of royal gifts
  taxonomy_refs:
  - sacrifice
  basis: Jámí avoids the Sultán of Rúm's munificence and resists invitations from
    rulers despite honors and costly presents.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: low
  cautions: The passage says Jámí wished to avoid munificence, but it does not explicitly
    interpret this as sacrificial renunciation.
- id: motif:6
  label: Wise counsellor in a Tower of Wisdom
  taxonomy_refs:
  - wisdom
  basis: The Shah of Yunan is counselled by a sage who keeps the Tower of Wisdom.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: The passage labels the setting and role directly, but the allegorical
    significance is not detailed in the excerpt.
- id: motif:7
  label: Childless ruler receives a son by magic
  taxonomy_refs:
  - miraculous_child
  basis: The king laments his childless marriage and desire for a son; the wish is
    then fulfilled by magic and the son is named Salámán.
  evidence_refs:
  - ev:16
  - ev:17
  confidence: high
  cautions: The passage states magical fulfillment but gives no details of the magical
    procedure.
- id: motif:8
  label: Devoted nurse turns from the world to the child
  taxonomy_refs: []
  basis: Absál is chosen as nurse and is described as closing her eyes to all the
    world beside Salámán after seeing him.
  evidence_refs:
  - ev:17
  - ev:18
  confidence: medium
  cautions: The passage only begins the relationship and does not yet develop its
    later allegorical or narrative function.
