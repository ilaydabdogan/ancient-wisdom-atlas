canonical_text:
  quote: ''
  summary: After hearing the Buddha, the people of Ramma honor the Bodhisatta Sumedha
    with offerings. Sumedha takes on the Perfections, bows to Dīpankara, resolves
    to become a Buddha after a vast span of time, and rises into the air toward Himavanta.
    Angels and men praise and bless him with flower offerings and natural similes.
    The passage then recounts Dīpankara’s teaching, conversions, assemblies, and final
    Nirvāṇa.
  language: English
  quote_policy: summarized
