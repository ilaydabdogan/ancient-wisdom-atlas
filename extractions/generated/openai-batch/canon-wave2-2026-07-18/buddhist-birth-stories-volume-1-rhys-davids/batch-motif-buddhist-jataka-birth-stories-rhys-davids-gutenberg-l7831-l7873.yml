canonical_text:
  quote: ''
  summary: A wise merchant finds abandoned carts and bones, forms a guarded circular
    encampment, proceeds cautiously, sells his goods profitably, and returns home.
    The Teacher interprets the story as a lesson on holding to truth, contrasts truth
    and untruth in terms of karmic results, teaches the Four Truths, converts five
    hundred disciples, and identifies the Jātaka characters with Devadatta, his followers,
    the Buddha’s attendants, and himself.
  language: English
  quote_policy: summarized
