canonical_text:
  quote: ''
  summary: The Teacher, while at Jetavana, explains that the Buddha had renounced
    the world not only in the present life but also formerly. In the former story,
    King Makhā Deva of Mithilā sees a grey hair found by his barber, treats it as
    a messenger of aging and death, hands the kingdom to his eldest son, becomes a
    hermit in Makhā Deva’s Mango-grove, practices goodwill and meditation, is reborn
    in the Brahma heaven, later returns as King Nimi, and again becomes a hermit.
    The Teacher then identifies the former figures with Ānanda, Rāhula, and himself.
    The following story begins with Bhaddiya, formerly anxious as a guarded king but
    now joyful as an Arahat wandering in forests, and the Teacher states that Bhaddiya
    had also been joyful in a former birth.
  language: English
  quote_policy: summarized
