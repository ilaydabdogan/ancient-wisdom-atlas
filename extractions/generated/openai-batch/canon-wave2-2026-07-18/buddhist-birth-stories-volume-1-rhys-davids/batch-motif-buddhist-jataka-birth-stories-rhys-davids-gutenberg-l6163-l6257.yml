canonical_text:
  quote: ''
  summary: Sujātā prepares a milk-rice offering on the May full moon. The preparation
    is marked by miraculous milk, right-turning bubbles, no smoke, and divine assistance.
    Puṇṇā sees the Bodisat shining at a tree and reports to Sujātā, who brings milk-rice
    in a golden vessel and offers it with water. The Bodisat receives the offering,
    bathes in the Nerañjarā river, eats forty-nine portions, and is later sustained
    for forty-nine days after Buddhahood by meditative joy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sujātā prepares an offering on the May full-moon day by concentrating milk
    through successive groups of cows down to eight cows, a process called “working
    the milk in and in.”
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the eight cows are milked, the calves keep away of their own accord and
    streams of milk pour into new vessels.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: As the rice-milk boils, large bubbles turn to the right and move together;
    no drop is lost and no smoke rises from the fireplace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Four guardian angels watch by the fireplace, Brahma holds a canopy over it,
    Sakka arranges and lights the fire, and gods infuse the Sap of life into the vessel
    of milk-rice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sujātā tells Puṇṇā that their god is gracious that day and sends her to keep
    watch by the holy place.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bodisat has seen five dreams during the night, concludes that he will
    become a Buddha that day, washes and dresses, and sits at the foot of a tree while
    lighting it with his glory.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Puṇṇā sees the Bodisat at the foot of the tree and sees the tree appear gold-colored
    from rays issuing from his body; she thinks the god has descended from the tree
    to receive the offering.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: After Puṇṇā reports to Sujātā, Sujātā gives her ornaments and declares her
    to be in the place of an elder daughter.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sujātā places the cooked milk-rice in a gold vessel, covers and wraps it,
    adorns herself, carries it to the Nigrodha-tree, bows, uncovers it, and brings
    scented water in a golden vase.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Bodisat’s earthenware pot disappears; he stretches out his right hand
    to receive water, and Sujātā places the milk-rice vessel in his hand.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Bodisat leaves the tree on the right hand, goes to the bank of the Nerañjarā
    river at the Supatiṭṭhita ferry, descends into the river, and bathes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After dressing in the garb of Arahats, the Bodisat faces east, divides the
    rice into forty-nine balls, eats it without water, and has no other food for forty-nine
    days after becoming a Buddha at the foot of the Tree of Wisdom.
  category: sequence
  evidence_refs:
  - ev:9
