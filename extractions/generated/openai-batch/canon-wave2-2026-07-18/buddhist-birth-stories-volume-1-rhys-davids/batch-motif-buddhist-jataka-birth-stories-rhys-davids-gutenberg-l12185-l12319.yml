canonical_text:
  quote: ''
  summary: 'The passage closes a tale in which a peacock loses a bride through immodest
    display, and the Teacher connects that past event with a present monk’s loss through
    immodesty. It then begins the Sammodamāna Jātaka: the Teacher admonishes relatives
    against quarrelling by telling of quails who escape a fowler’s net while united,
    but are captured after they fall into dispute.'
