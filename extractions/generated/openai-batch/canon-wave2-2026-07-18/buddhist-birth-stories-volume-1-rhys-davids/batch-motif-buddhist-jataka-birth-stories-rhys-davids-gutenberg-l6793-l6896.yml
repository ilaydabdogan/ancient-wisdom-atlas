canonical_text:
  quote: ''
  summary: 'The passage narrates the Buddha’s early teaching and conversions after
    enlightenment: the five elders become disciples and attainments follow; Yasa,
    his companions, nobles, and ascetics are received into the order; missionaries
    are sent out; Uruvela Kassapa renounces fire sacrifice and publicly declares discipleship;
    King Bimbisara and his retinue receive teaching and attainments.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One knows the thoughts of the five elders, directs a pervasive
    feeling of love toward them, and they rise, bow, and welcome him despite their
    earlier resolve.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The five elders initially address him by name or as “Brother,” and he announces
    that he is a Buddha and should not be addressed in that way.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Buddha sits on a prepared place, is surrounded by myriads of angels, and
    teaches the discourse called The Foundation of the Kingdom of Righteousness to
    the five attendant elders.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kondanya and myriads of angels attain the Fruit of the First Path during or
    after the discourse; the other four elders attain the same fruit over the following
    days, and all five attain Nirvana after the discourse On the Non-existence of
    the Soul.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Yasa leaves his home in weariness of the world, is called by the Buddha with
    the words “Follow me,” and attains the Fruit of the First Path and then Arahatship.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Yasa’s fifty-four companions are received into the order with the formula
    “Follow me” and are caused to attain Arahatship.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After sixty-one persons have become Arahats, the Buddha sends sixty mendicants
    in different directions to preach and teach.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the way to Uruvela, the Buddha overcomes thirty Bhadda-vaggiyan nobles,
    receives them into the order, and sends them out to the surrounding regions.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Uruvela, the Buddha performs three thousand five hundred miracles, overcomes
    three Hindu ascetic brothers including Uruvela Kassapa and their thousand disciples,
    receives them into the order, and teaches them on Gayā-sīsa hill.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: King Bimbisara comes to the Buddha with priests and nobles, falls at the Buddha’s
    feet, and sits respectfully to one side with his retinue.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Buddha’s feet are described as bearing the mystic figure of a sacred wheel
    and emitting a halo like a canopy of cloth of gold.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Priests and nobles wonder whether Uruvela Kassapa is the Buddha’s religious
    student or the Buddha is Uruvela Kassapa’s student.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Uruvela Kassapa states that reliance on sense objects, sensual love, and sacrifice
    is dross while sin remains, and that he finds no charm in offerings.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Uruvela Kassapa bows at the Buddha’s feet, declares the Buddha his master
    and himself the disciple, rises into the air seven times to increasing heights
    measured by palm-trees, descends, salutes, and sits aside.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The multitude praises the power of the Buddhas and says that Uruvela Kassapa
    has broken through the net of delusion and yielded to the successor of the Buddhas.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: The Buddha states that he had overcome Uruvela Kassapa in former ages too,
    utters the Mahā Nārada Kassapa Jātaka, proclaims the Four Truths, and the king
    of Magadha with nearly all his retinue attains the Fruit of the First Path.
  category: sequence
  evidence_refs:
  - ev:12
