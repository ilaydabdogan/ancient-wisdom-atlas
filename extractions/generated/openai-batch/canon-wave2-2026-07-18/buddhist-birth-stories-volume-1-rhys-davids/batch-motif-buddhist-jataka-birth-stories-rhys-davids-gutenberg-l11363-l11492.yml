canonical_text:
  quote: Speak kindly; never speak in words unkind!
  summary: The Buddha rebukes abusive monks by telling of Nandi Visāla, a Bodisat
    bull raised by a Brāhman. The bull refuses to pull a hundred loaded carts when
    insulted, but succeeds when addressed kindly, bringing wealth to the Brāhman.
    The tale is closed with a moral against harsh speech and an identification of
    the Brāhman as Ānanda and the bull as the Buddha in a former birth.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Master tells the story at Jetavana after the Six monks admit to scorning,
    snubbing, annoying, and abusing peaceable monks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the past tale, the Bodisat is born as a bull during the reign of a king
    of Gandhāra in Takkasilā.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Brāhman receives the young bull, names him Nandi Visāla, treats him like
    a son, and feeds him gruel and rice.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: When grown, Nandi Visāla decides to reveal his strength and provide sustenance
    for the Brāhman, instructing him to wager that the ox can move one hundred laden
    carts.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The wager is arranged with a rich cattle-owner, and one hundred carts are
    filled with sand, gravel, and stones, ranged in a row, and tied together.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: At the first attempt, the Brāhman bathes, feeds, garlands, and yokes Nandi
    Visāla, but then calls him a brute and a wretch; the bull stands still.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: After the failed pull, the cattle-owner claims the thousand-piece bet, and
    the Brāhman returns home grieving.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Nandi Visāla asks whether he has ever damaged the Brāhman's property, says
    the insult was the Brāhman's fault, and tells him to wager two thousand and not
    call him a wretch again.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: At the second attempt, the Brāhman addresses Nandi Visāla as “my beauty,”
    and the bull drags the hundred heavily laden carts forward.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The cattle-owner pays the Brāhman two thousand, bystanders give Nandi Visāla
    a large sum, and the wealth becomes the Brāhman's property.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Teacher states that harsh words are pleasant to no one, gives a verse
    enjoining kind speech, and identifies the Brāhman as Ānanda and Nandi Visāla as
    himself.
  category: speech
  evidence_refs:
  - ev:10
