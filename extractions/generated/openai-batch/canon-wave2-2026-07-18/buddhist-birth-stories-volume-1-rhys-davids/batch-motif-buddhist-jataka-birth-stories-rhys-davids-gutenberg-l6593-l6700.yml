canonical_text:
  quote: ''
  summary: After awakening, the Master dispels angels' doubts with a miraculous double
    appearance, spends successive weeks near the throne and Bo-tree in gaze, walking,
    doctrinal contemplation, and meditation, and then remains unmoved when Māra and
    Māra's daughters attempt to find fault in him or allure him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain angels doubt why Siddhattha remains seated; the Master knows their
    thoughts, rises into the air, and makes another appearance like himself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master stands northeast of the throne, reflects that he attained omniscience
    there, and spends seven days gazing at the spot; the spot becomes known as the
    Dāgaba of the Steadfast Gaze.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Master creates a cloistered walk between the throne and the spot where
    he stood, walks there for seven days, and the place becomes known as the Dāgaba
    of the Jewelled Cloister.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: For the fourth week, angels create a house of gems northwest of the Bo-tree;
    the Master sits there cross-legged thinking out the Abhidhamma Pitaka.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the fifth week, the Master goes to the Shepherd’s Nigrodha-tree, sits meditating
    on the Truth, and enjoys the sweetness of Nirvāna.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Māra thinks he has long sought a fault in the Master, finds no sin in him,
    and concludes that the Master is beyond his power.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Māra sits on the highway and draws sixteen lines on the ground while reflecting
    on sixteen attainments or perfections he did not reach.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Craving, Discontent, and Lust, the three daughters of Māra, find their father
    sorrowful and ask why he is sad.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Māra tells his daughters that the mendicant is escaping his power; they reply
    that they will bring him captive by their influence.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Māra says his daughters cannot bring the Master under their influence because
    he stands firm in faith and is unwavering.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The daughters approach the Blessed One and offer to wait upon him; he pays
    no attention to their words and does not raise his eyes to them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The daughters assume many female appearances, including virgins, women with
    differing childbirth histories, middle-aged women, and older women; six times
    they approach the Blessed One and offer themselves as handmaidens.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The narrator reports an alternative claim by some teachers that the Blessed
    One commanded the women to remain elderly with broken teeth and bald heads, and
    then rejects that claim.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Blessed One tells the daughters to depart and states that he has put away
    lust, ill-will, and folly.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Two cited verses describe the Sinless One and the Wise One as not subject
    to disturbance, guile, sin, venomous desire, or craving.
  category: speech
  evidence_refs:
  - ev:10
