canonical_text:
  quote: ''
  summary: Footnotes discuss the age, iconographic depiction, textual transmission,
    linguistic explanation, and moral or religious framing of several Jātaka-related
    fables. Notable items include a Bharhut relief of a gosling choosing a peacock
    as husband, an etymological explanation of the Golden Goose and Goose with the
    Golden Eggs, references to parallels in Pañca Tantra, Mahā-bhārata, Hitopadeśa,
    Kalila and Dimna, Arabian Nights, and other traditions, a mystical epithet of
    fire/Agni, a stag destroyed by thoughtless love, pride before a fall, hierarchy
    etiquette, a gift to a Pacceka Buddha, and the definition of Ariya-puggalas.
  language: English
  quote_policy: summarized
