canonical_text:
  quote: ''
  summary: Dīpankara Buddha sees that the hermit Sumedha will become the Buddha Gotama
    after vast ages and publicly prophesies details of his future birth, associates,
    renunciation, nourishment, river crossing, and enlightenment beneath the sacred
    fig tree. Sumedha rejoices, the assembly and heavenly beings honor him, and he
    sits among flowers to investigate the Perfections while angels identify the event
    as matching omens of former Bodhisattas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dīpankara stands near Sumedha's head, sees him lying in the mire, and uses
    prescient vision to perceive that he will become the Buddha Gotama after four
    asankheyyas and a hundred thousand cycles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dīpankara publicly prophesies Sumedha's future identity, residence at Kapilavatthu,
    mother Māyā, father Suddhodana, chief disciples, attendant, and chief female disciples.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The prophecy describes a future sequence in which Gotama leaves Kapila, undertakes
    austerities or great exertion, receives rice milk or rice pottage, goes by the
    Neranjarā river, approaches the Bodhi tree, and attains Buddhahood at an Indian
    fig tree.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sumedha rejoices that his prayer will be accomplished, and the multitudes
    call him an embryo Buddha and a tender shoot that will grow into a Buddha.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The multitudes compare their hope for future attainment under Sumedha's Buddhahood
    to people crossing a river at a lower ford when they cannot cross at the opposite
    ford.
  category: speech
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:6
  text: Dīpankara, Arhats, angels, men, and other beings make offerings or salutations
    to the Bodhisatta and then depart.
  category: action
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:7
  text: After the others leave, the Bodhisatta rises, says he will investigate the
    Perfections, and sits cross-legged on a heap of flowers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Angels in ten thousand worlds assemble, praise Sumedha, say that the auguries
    of former Bodhisattas have appeared, and urge him to make a strenuous effort.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The verse portion states that men, Nāgas, and Gandhabbas bowed down to Sumedha
    and departed.
  category: action
  evidence_refs:
  - ev:5
