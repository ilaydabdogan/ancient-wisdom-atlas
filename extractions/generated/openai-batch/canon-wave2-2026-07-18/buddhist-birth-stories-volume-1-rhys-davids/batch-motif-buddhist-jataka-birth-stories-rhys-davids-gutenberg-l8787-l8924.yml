canonical_text:
  quote: ''
  summary: 'The passage begins the Deva-Dhamma Jātaka frame story. A wealthy monk
    is rebuked by the Buddha for retaining many possessions and briefly reacts by
    throwing off his robe. The Buddha reminds him that in a former existence as a
    water-sprite he had lived with shame and conscience. The past story then describes
    princes in Benares: Prince Mahiŋsāsa, the Moon Prince, and their half-brother
    the Sun Prince. A queen demands the kingdom for the Sun Prince through a promised
    boon, and the king sends the older princes away to avoid danger; the Sun Prince
    joins them. In the Himālaya, the Bodisat sends the Sun Prince to fetch water from
    a pond guarded by a water-sprite, who seizes those who enter unless they know
    true divinity. The Sun Prince enters, is seized, and answers that the Sun and
    Moon are gods.'
  language: English
  quote_policy: summarized
