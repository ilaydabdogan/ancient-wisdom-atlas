    arranging a private hermitage, kitchen, storehouse, food supplies, attendants,
    and multiple garments for his own use.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Country brethren see the monk's robes and coverlets, question whether they
    are all his, and bring him before the Teacher as a monk with much property.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Teacher asks whether the monk has many things and contrasts his luxury
    with teachings of contentment with little, simplicity, seclusion, and self-control.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The monk angrily throws off his robe and stands in the assembly wearing only
    a cloth around his loins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Teacher says the monk formerly had a sense of shame and lived conscientiously
    for twelve years as a water-sprite; after hearing this, the monk robes himself
    again and stands respectfully aside.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the past story, Brahma-datta rules in Benares; the Bodisat is born as Prince
    Mahiŋsāsa, another son is born as the Moon Prince, the Bodisat's mother dies,
    and another queen bears the Sun Prince.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Sun Prince's mother invokes a promised boon and asks the king to give
    the kingdom to her son, but the king refuses to give it to him alone.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king fears that the queen may plot evil against the older princes and
    sends them into the forest, telling them to return and rule after his death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Sun Prince learns why his brothers are leaving and decides to go away
    with them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Himālaya region, the Bodisat sits at the foot of a tree and sends the
