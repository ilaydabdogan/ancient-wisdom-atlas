  quote: ''
  summary: The passage surveys the Indian textual history of the Jātaka or Birth Stories.
    It states that research is incomplete, notes similarities with Brahmanical and
    older Buddhist materials, explains the Jātaka theory of identifying story characters
    with the Buddha in previous births, and describes the Cariyā-Piṭaka, Buddhavaṃsa,
    Northern Buddhist tradition, and Jātaka Mālā as sources or analogues for birth
    stories organized around the Bodisat’s acquisition of perfections across many
    lives.
  language: English
