canonical_text:
  quote: ''
  summary: The passage recounts a royal request that sons not be received into the
    Order without parental permission; a remembered false report of the Buddha's death
    and a linked former-birth story; the conversion and patronage of Anātha Piṇḍika;
    the construction, procession, dedication, and acceptance of Jetavana monastery;
    and verses praising the merit and practical benefits of giving dwellings to monks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a child had been taken into the Order, the king grieved and asked that
    sons not be received into the Order without the leave of father and mother; the
    Blessed One granted the request.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king said that during the Buddha's austerities an angel had reported that
    his son was dead, but the king rejected the report and said his son would not
    die before attaining Buddhahood.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Blessed One replied that formerly the king had not believed even when
    bones were shown and his son was said to be dead; he then told the story of his
    Birth as the Great Keeper of Righteousness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the former-birth story ended, the king attained the Fruit of the Third
    Path, and the Blessed One established his father in the Three Fruits before returning
    to Rājagaha.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Anātha Piṇḍika came to Rājagaha with merchandise in five hundred carts, heard
    that a Buddha had arisen, approached the Teacher early in the morning through
    a door opened by angelic power, heard the Truth, and became converted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Anātha Piṇḍika gave a great donation to the Order and received the Teacher's
    promise to come to Sāvatthi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Along the road to Sāvatthi, Anātha Piṇḍika built resting-places at every league
    and bought Jetavana Grove with gold pieces laid side by side over the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Jetavana he constructed a residence including a pleasant room for the Sage,
    dwellings for the eighty Elders, other residences, halls, open roofs, ponds, and
    terraces.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: For the Buddha's arrival, Anātha Piṇḍika sent a procession including his son
    with youths bearing five-colored flags, his daughters with damsels carrying full
    water-pots, his wife with matrons carrying food vessels, and himself with traders
    in new robes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Blessed One entered Jetavana with lay disciples in front and monks attending
    him, and the grove was described as brightened by the halo from his person like
    gold-dust.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When Anātha Piṇḍika asked how to deal with the Wihāra, the Buddha instructed
    him to give it to the Order of Mendicants, present and future.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Anātha Piṇḍika poured water from a golden vessel over the Sage's hand and
    dedicated Jetavana Wihāra to the Order of Mendicants with the Buddha at their
    head and to monks from every direction, present and future.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Master accepted the Wihāra and taught that monasteries ward off cold,
    heat, animals, creeping things, gnats, rains, heat, and winds.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The verses say that giving monks a dwelling-place for safe and peaceful thought
    is a worthy deed, and that wise people should build monasteries and give food,
    drink, clothes, and dwellings to the upright.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The verses state that monks shall preach the Truth, which dispels grief, and
    that one who receives it sins no more and dies away.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Anātha Piṇḍika's dedication festival lasted nine months, and the passage states
    that he spent fifty-four koṭis on the monastery in total.
  category: attribute
  evidence_refs:
  - ev:9
