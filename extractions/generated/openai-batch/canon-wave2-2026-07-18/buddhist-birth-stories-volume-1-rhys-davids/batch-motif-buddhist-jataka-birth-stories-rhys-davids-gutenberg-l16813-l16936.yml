canonical_text:
  quote: ''
  summary: 'A sequence of editorial footnotes explains Buddhist doctrinal terms, monastic
    customs, story details, and cross-references: the Three Gems; meditation as a
    self-produced path toward realization, Nirvāna, and escape from transmigration;
    the Happy State and its six divisions; ordination formulae; the Buddha’s perception
    of those he can benefit; monastic meals, seniority, and stewardship; and miscellaneous
    story notes including the Himālaya Mountains, Little Roadling, Chullaka, a coconut-shell
    cup, attendants, merchants, and a comparison with the Kathā Sarit Sāgarā.'
  language: English
  quote_policy: summarized
