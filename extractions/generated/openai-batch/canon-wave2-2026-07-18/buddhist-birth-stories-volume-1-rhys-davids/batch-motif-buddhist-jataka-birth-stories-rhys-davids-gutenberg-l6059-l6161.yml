canonical_text:
  quote: ''
  summary: The Bodisat eats begged scraps after self-admonition, rejects a king's
    offer of sovereignty in favor of complete enlightenment, studies and leaves two
    trance teachers, undertakes the Great Struggle at Uruvela, is served by five mendicants,
    practices extreme fasting with angelic support, is falsely reported dead and recovers,
    abandons penance as not the way to Wisdom, resumes ordinary food and regains bodily
    signs, is deserted by the five mendicants, and the passage closes with Sujātā's
    conditional prayer and offering-vow to a Nigrodha-tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Great Being collected scraps of food, left the city, sat facing east under
    the shadow of the Paṇḍava rock, and ate after overcoming revulsion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He admonished himself by recalling that he had wished to become like a mendicant
    and live by begging food after leaving easy access to fine food.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: An unnamed king, after hearing from his men and seeing the Bodisat, offered
    him all his kingdom.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bodisat said he had no desire for wealth or sinful pleasures and had left
    all in hope of attaining complete enlightenment.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king requested that after Buddhahood the Bodisat come first to his kingdom,
    and the Bodisat granted the request.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Bodisat joined Āḷāra Kāḷāma and Uddaka, son of Rāma, and acquired their
    systems of ecstatic trance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After deciding that those attainments were not the way to wisdom, he went
    to Uruvela, called the spot pleasant, and devoted himself to the Great Struggle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Five mendicants, including Kondanya, stayed with the Bodisat for six years
    and served him while expecting that he would become a Buddha.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Bodisat undertook extreme penance by living on one oil seed, one grain
    of rice, or fasting entirely, while angels infused the sap of life into him through
    the pores of his skin.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: During the fasting his body became skeletal and dark, the Thirty-two signs
    of a Great Being disappeared, and he fainted and fell while walking in meditation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Some angels said the mendicant Gotama was dead, others described his condition
    as that of Arahats, and messengers told Suddhodana that his son had died before
    Buddhahood.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Suddhodana refused to believe the death report, citing his certainty that
    his son could not die without attaining Wisdom; the Bodisat then recovered consciousness
    and stood up.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Bodisat concluded that penance was not the way to Wisdom, begged ordinary
    food through villages and towns, regained the Thirty-two signs, and his body became
    gold-colored again.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The five mendicants judged him unable to attain Omniscience after taking material
    food, left him with their robes and begging bowls, and went to Isipatana.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Sujātā, daughter of Senāni the landowner, prayed to a Nigrodha-tree for marriage
    into an equal-ranking family and a firstborn son, vowing an annual offering if
    the prayer succeeded.
  category: speech
  evidence_refs:
  - ev:11
