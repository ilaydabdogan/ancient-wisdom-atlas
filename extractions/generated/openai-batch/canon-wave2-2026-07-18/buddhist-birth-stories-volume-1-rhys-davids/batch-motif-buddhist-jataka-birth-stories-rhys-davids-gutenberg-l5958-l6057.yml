canonical_text:
  quote: ''
  summary: The Bodisat reaches the river Anomā, crosses it, renounces the world, sends
    Channa back with ornaments and Kanthaka, cuts off his hair and diadem, and receives
    mendicant requisites through Ghaṭikāra. Sakka enshrines the hair and diadem in
    heaven. Kanthaka dies of grief and is reborn in Tāvatiŋsa heaven. The Bodisat
    then stays in a mango grove and later begs in Rājagaha, where his appearance causes
    wonder.
  language: English
  quote_policy: summarized
