canonical_text:
  quote: ''
  summary: The passage concludes a Jātaka in which Sakka admonishes and tests Well-born
    across rebirths, rewards her righteousness, and later marries her after she is
    reborn as a Titan’s daughter. The Teacher uses the story to reprove a monk for
    harming small creatures in water and identifies former-birth figures. The next
    Jātaka begins with a luxurious monk who behaves immodestly and loses the faith;
    the Teacher introduces a former-birth tale in which animal groups have kings,
    and the Golden Goose’s daughter chooses the peacock as her husband from an assembly
    of birds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sakka says that some beings were reborn as attendants because of charity,
    while the addressed female figure was reborn as an animal because she had not
    done such works; he tells her to live righteously and confirms her in the Five
    Commandments.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sakka tests her by lying before her in the form of a fish; when the crane
    realizes the fish is alive, she lets it go, and Sakka praises her ability to keep
    the Commandments.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After a later change of existence, she is born in a potter’s household in
    Benares.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sakka appears in the village as an old woman with a cart of golden cucumbers
    and says she will give them only to people who live righteously.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Well-born recognizes that the offer is meant for her, affirms that she lives
    righteously, and receives the golden cucumbers and the cart.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Well-born continues in righteousness and is later born as the daughter of
    a Titan named ‘The Son of Misunderstanding’; the passage attributes her great
    beauty to her virtue.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Her Titan father assembles the Titans so that she may choose a husband; Sakka
    takes the form of a Titan and goes to the assembly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Well-born sees Sakka among the Titans, is moved by love from a former birth,
    and chooses him as her husband.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sakka leads Well-born to the heavenly city, gives her the post of honour among
    many houris, and later passes away according to his deeds.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Teacher reproves a monk by saying that former wise men offered up their
    lives rather than destroy life, whereas the monk drank unstrained water containing
    living creatures.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Teacher identifies Mātali the charioteer as Ānanda and Sakka as himself.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the frame of the Dancing Peacock story, a monk admits he is luxurious,
    becomes angry, tears off his robe and lower garment, stands naked before the Teacher,
    and returns to lay status after bystanders cry shame.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Teacher says that the monk has now lost the jewel of faith through immodesty
