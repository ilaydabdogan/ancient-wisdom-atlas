canonical_text:
  quote: ''
  summary: 'The passage recounts Mangala Buddha''s assemblies, a mass attainment of
    Arhatship and miraculous monastic equipment, the cosmic extent of Mangala''s bodily
    light, and two former Bodhisatta deeds used to explain that radiance: giving his
    children to a disguised demon and ritually setting his own body on fire while
    circumambulating a Buddha''s relic shrine without harm.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'After one asankheyya, four Buddhas are said to be born in the same cycle:
    Mangala, Sumana, Revata, and Sobhita.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mangala Buddha is said to have three assemblies of saints, with the third
    associated with nine hundred millions.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Prince Ānanda, described as Mangala Buddha's step-brother, comes with a large
    assembly to hear the Teacher preach the Law, and the whole group attains Arhatship
    with analytical Knowledges.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Teacher stretches out his right hand, calls the group priests, and they
    immediately become equipped with miraculously obtained robes and bowls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mangala Buddha's bodily light permanently fills ten thousand worlds and makes
    trees, earth, mountains, seas, and ordinary articles appear covered with a golden
    film.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: During Mangala Buddha's ninety-thousand-year lifespan, the sun, moon, and
    other heavenly bodies are said not to shine by their own light, and night and
    day are not distinguished by light levels.
  category: setting
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The narrator says other Buddhas can also fill ten thousand worlds or more
    with lustre at will, but Mangala Buddha's permanent world-filling lustre results
    from a prayer made in a former existence.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: In a former Bodhisatta existence corresponding to the Vessantara existence,
    he dwells with his wife and children on a mountain like Vanka mountain.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: A demon named Kharadā_th_ika approaches the Bodhisatta in the guise of a brahmin
    and asks for the Bodhisatta's two children.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Bodhisatta joyfully gives both children, causing the ocean-girt earth
    to quake; the demon then devours the children while the Bodhisatta looks on.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Bodhisatta feels no sorrow at the devouring of the children, experiences
    joy at the gift, and prays that rays of light may one day issue from him in that
    way.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: In another former existence, the Bodhisatta visits a Buddha's relic shrine,
    declares that he ought to sacrifice his life, prepares his body and a golden vessel
    with clarified butter and wicks, sets fire to his body, and circumambulates the
    shrine through the night.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: While the Bodhisatta burns and circumambulates until dawn, not even a hair
    root is heated; the passage explains this with the statement that Truth or Religion
    protects the one who follows it.
  category: attribute
  evidence_refs:
  - ev:10
