canonical_text:
  quote: ''
  summary: The passage opens the first Jataka frame narrative. At Jetavana near Sāvatthi,
    Anātha Piṇḍika brings five hundred heretical friends with offerings to the Blessed
    One and the monastic order. They see the Buddha’s radiant marks and hear his discourse,
    abandon their former refuge, and take refuge in the Buddha. After the Buddha leaves
    for Rājagaha they return to their former belief, but when he comes back, Anātha
    Piṇḍika reports this relapse. The Buddha questions them, they admit it, and he
    teaches the unmatched qualities of the Buddha and the Three Gems. He says refuge
    in the Buddha, Truth, and Order prevents rebirth in hell or painful states and
    leads to heaven; he further teaches that meditation on the Buddha, Truth, and
    Order gives entrance and fruit of the paths and leads toward enlightenment and
    Nirvāna.
  language: English
  quote_policy: summarized
