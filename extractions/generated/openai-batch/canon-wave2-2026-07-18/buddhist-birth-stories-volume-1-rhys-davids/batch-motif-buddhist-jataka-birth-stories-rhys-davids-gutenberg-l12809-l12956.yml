canonical_text:
  quote: ''
  summary: 'The passage closes the story of the partridge, monkey, and elephant by
    emphasizing reverence for age, observance of commandments, heavenly destiny, and
    the Buddha’s identification of the animals with Moggallāna, Sāriputta, and himself.
    It then opens the Baka Jātaka: a Jetavana tailor-monk deceives other monks with
    robes made from old rags; a country robe-maker deceives him in the same way; the
    Teacher says this pattern also occurred in a former birth. The former-birth tale
    begins with the Bodisat as a tree genius near a lotus pond where a crane plans
    to trick fish during a dry-season water shortage.'
  language: English
  quote_policy: summarized
