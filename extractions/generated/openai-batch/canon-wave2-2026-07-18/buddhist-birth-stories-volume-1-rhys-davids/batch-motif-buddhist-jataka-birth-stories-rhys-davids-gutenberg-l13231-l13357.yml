canonical_text:
  quote: ''
  summary: A fairy living in the turret over a merchant’s fourth gate is disturbed
    by the Buddha and monks entering the house. She tries to stop the merchant’s religious
    giving by persuading his business manager, his eldest son, and later the impoverished
    merchant himself. The manager and son refuse. The Buddha teaches the merchant
    that even a poor gift is not trifling if given with a believing heart to worthy
    recipients, and cites his former life as Velāma. When the fairy urges the merchant
    to abandon Gotama and restore his estate, he declares his faith immovable like
    Mount Sineru, expels her from the house, and she leaves with her children to approach
    the city’s guardian god.
  language: English
  quote_policy: summarized
