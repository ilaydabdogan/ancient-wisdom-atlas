- id: obs:10
  text: The Master said that when he was Velāma he gave away the Seven Treasures and
    maintained a great donation, but did not attain refuge in the Three Gems or keep
    the Five Precepts because the recipients were unfit.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the merchant became poor, the fairy appeared to him at midnight and
