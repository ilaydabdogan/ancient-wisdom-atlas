canonical_text:
  quote: ''
  summary: 'The passage ends the story of Nanda and the buried gold: Sāriputta reports
    a monk whose behavior changes by circumstance; the Teacher says the same happened
    in a former birth. In the past, an old landowner buried treasure in a forest and
    told the slave Nanda to disclose it to his son. When the son asks Nanda to show
    the place, Nanda becomes proud and abusive while standing over the buried treasure.
    The son consults the Bodisat, who infers that the treasure lies exactly where
    Nanda becomes insolent and instructs the son how to recover it. The son follows
    the advice, restores the estate, gives gifts, and dies according to his deeds.
    The Teacher identifies Nanda with the monk under Sāriputta and the wise squire
    with himself. The passage then begins the Khadirangāra Jātaka, introducing Anātha
    Piṇḍika at Jetavana as a great donor to the Buddhist Faith and the Order, including
    daily offerings, unreclaimed loans, lost family wealth washed from a river bank
    to the sea, and household provision for monks.'
  language: English
  quote_policy: summarized
