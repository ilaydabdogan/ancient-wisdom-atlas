  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The young man reasons that Nanda intends to show the treasure but becomes
    insolent at the place, and he decides to ask his father’s friend, the Bodisat.
  category: action
  evidence_refs:
  - ev:5
