canonical_text:
  quote: ''
  summary: The passage contains the Lakkhaṇa Jātaka, framed as the Buddha's explanation
    of Sāriputta's return with followers and Devadatta's loss of followers. In the
    former-birth story, the Bodisat is an elder deer who gives each of his two sons
    five hundred deer to lead during crop season. Brownie travels carelessly and loses
    his herd, while Beauty travels prudently, avoids danger, and returns with all
    five hundred deer. The Buddha identifies Brownie with Devadatta and Beauty with
    Sāriputta.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master tells this story at the Bambu-grove near Rājagaha in connection
    with Devadatta, who made a schism in the Order and went to Gayā-sīsa with mendicants.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master sends Sāriputta and other brethren to preach to the mendicants;
    Sāriputta returns at dawn with five hundred, while Devadatta is described as having
    no followers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the former-birth narrative, the Bodisat is born as a deer, becomes head
    of a herd of one thousand deer, and has two sons named Lakkhaṇa/Beauty and Kāḷa/Brownie.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: When old, the Bodisat places five hundred deer under each son and later warns
    them that crop time brings pit-falls, stakes, stone traps, and snares set by humans.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The Bodisat instructs his sons to lead their herds to the mountainous part
    of the forest and return after the crops are cut.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Brownie travels at dawn, evening twilight, and other unsuitable times past
    village gates; men kill many deer, and after the return journey he arrives alone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Beauty avoids village gates, does not travel by day, dawn, or evening twilight,
    travels at midnight, and returns to his parent with all five hundred deer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Bodisat speaks a stanza contrasting Beauty, who returns with his troop
    of kin, with Brownie, who is deprived of what he had.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Master connects the two stories by identifying Brownie with Devadatta,
    Beauty with Sāriputta, Beauty's attendants with the followers of the Buddha, and
    the father deer with himself.
  category: relationship
  evidence_refs:
  - ev:8
