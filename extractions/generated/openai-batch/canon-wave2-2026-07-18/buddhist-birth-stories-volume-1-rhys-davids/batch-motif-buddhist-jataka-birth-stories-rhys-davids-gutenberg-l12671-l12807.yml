canonical_text:
  quote: ''
  summary: The Teacher addresses a lodging dispute in which Sāriputta is left without
    a sleeping place after others occupy the lodgings. He teaches that respect and
    precedence in his religion should follow age and seniority, then introduces a
    former-life animal tale. In the tale, a partridge, monkey, and elephant living
    near a Banyan tree on the Himalayan slope decide to determine which of them is
    eldest. They compare their memories of the Banyan tree; the partridge claims seniority
    because the tree grew from seeds he had voided after eating fruit from an older
    Banyan.
  language: English
  quote_policy: summarized
