canonical_text:
  quote: ''
  summary: 'Sumedha reasons through similes about seeking Nirvā_n_a: a man should
    seek a cleansing lake, an escape road, and a physician or teacher when they are
    available. He then compares abandoning attachment to the perishable body with
    casting off a corpse, refuse, a broken ship, or dangerous robbers. After pondering
    these similes, he gives away wealth, renounces pleasures, leaves Amara for Himavanta,
    makes a hermitage near Dhammaka, adopts ascetic life, lives at the foot of a tree
    on wild fruits, and attains the eight Attainments, five Supernatural Faculties,
    and supernatural knowledge.'
  language: English
  quote_policy: summarized
