canonical_text:
  quote: ''
  summary: 'Sumedha resolves that he will become Buddha and searches for the conditions
    that make a Buddha. He successively identifies and vows to fulfill four perfections:
    almsgiving, morality, self-abnegation, and wisdom. Each perfection is explained
    through an analogy: an overturned water-jar emptying itself, a Yak guarding its
    tail, a prisoner longing for release, and a monk obtaining subsistence by begging
    from all families.'
  language: English
  quote_policy: summarized
