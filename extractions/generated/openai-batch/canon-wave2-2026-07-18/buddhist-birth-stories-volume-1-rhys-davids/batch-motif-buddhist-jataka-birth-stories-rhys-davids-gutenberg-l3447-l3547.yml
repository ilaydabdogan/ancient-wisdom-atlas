canonical_text:
  quote: ''
  summary: Dīpankara Buddha approaches along a prepared road with attendant saints
    while angels and humans offer music, flowers, perfumes, and homage. The hermit
    Sumedha lies prone in the mire so the Buddha and disciples may pass over him rather
    than tread in mud. While lying there, Sumedha reflects that he could attain liberation
    alone, but instead resolves to seek omniscience, become a Buddha, and carry men
    and angels across the Ocean of Existence in the Ship of Truth.
  language: English
  quote_policy: summarized
