canonical_text:
  quote: ''
  summary: The passage describes distinctive events surrounding the future Buddha’s
    conception, pregnancy, birth at Lumbini, divine reception, purity, heavenly water
    showers, seven strides, royal emblems, victory proclamation, and related birth-speech
    episodes in the Mahosadha and Vessantara births, ending with the thirty-two Good
    Omens at birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: From the incarnation of the future Buddha, four angels with swords guard the
    Bodisat and his mother from harm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother sees the child within her clearly, and after his birth she dies
    seven days later and is reborn in the City of Delight.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother of a Bodisat gives birth standing after exactly ten months of pregnancy;
    this is described as a distinctive quality of the mother of a Buddha elect.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Queen Mahā Māyā asks King Suddhodana to go to Devadaha; he agrees, prepares
    the road, and sends her in a golden palanquin with a large retinue.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Lumbini grove between the two towns is filled with fruits, flowers, bees,
    and birds; the queen desires to enter and enjoy the sal-tree grove.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the monarch sal-tree, a branch bends within reach; the queen grasps it,
    her pains begin, a curtain is drawn, and she gives birth standing while holding
    the branch.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Four pure-minded Mahā Brahma angels bring a golden net, receive the future
    Buddha on it, place him before his mother, and announce that a mighty son has
    been born.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The future Buddha leaves the womb erect, with hands and feet extended, unsoiled,
    pure, fair, and shining; two showers of water come down from heaven and refresh
    him and his mother.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the angels, four kings receive him on antelope-skin cloths, then men
    receive him on fine cloth; he stands on the ground and looks toward the East.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Thousands of world-systems become visible to him; men and angels offer garlands
    and say no one is like him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: He searches the ten directions, takes seven strides, and at the seventh step
    proclaims a victory shout beginning, “I am the chief of the world,” while Brahma
    holds a white umbrella, Suyāma follows with a fan, and other deities carry royal
    symbols.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the Mahosadha birth, Sakka places fine sandal-wood in the newborn’s hand;
    the child answers that it is medicine, and the medicine later heals the blind,
    deaf, and others.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: In the Vessantara birth, the newborn stretches out his right hand and asks
    whether there is anything in the house to give; his mother places a bag containing
    a thousand in his hand.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: The passage states that the future Buddha uttered his voice immediately after
    leaving the womb in three births, and that the thirty-two Good Omens appeared
    at the moment of this birth as at conception.
  category: sequence
  evidence_refs:
  - ev:12
