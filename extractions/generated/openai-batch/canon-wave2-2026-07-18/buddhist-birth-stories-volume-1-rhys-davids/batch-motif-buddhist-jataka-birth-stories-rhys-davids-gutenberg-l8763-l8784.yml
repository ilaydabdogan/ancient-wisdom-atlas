  summary: Ministers mock a valuation that makes the royal city and horses worth a
    measure of rice. The Bodisat states the valuation in a stanza. The king is ashamed,
    removes the foolish valuer, appoints the Bodisat as Valuer, and the Teacher concludes
    by identifying the past figures with present ones.
