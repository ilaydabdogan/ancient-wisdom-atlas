canonical_text:
  quote: ''
  summary: A mountain stag follows a roe from the inhabited country despite her warning
    that the country is dangerous. A hunter ambushes the road, kills the stag, cooks
    and eats part of the flesh, and carries the rest home. The Bodisat, presented
    as a tree fairy dwelling in the wood, interprets the stag’s death as caused by
    lust and recites a rebuking stanza while woodland fairies honor him. In the frame
    conclusion, the Master teaches the Four Truths, the love-sick monk is converted,
    and the characters are identified with present figures.
  language: English
  quote_policy: summarized
