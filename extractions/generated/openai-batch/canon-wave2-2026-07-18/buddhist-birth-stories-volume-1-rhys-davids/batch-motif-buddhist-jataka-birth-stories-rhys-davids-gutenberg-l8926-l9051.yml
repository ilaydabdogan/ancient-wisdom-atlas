canonical_text:
  quote: ''
  summary: A water-sprite or ogre captures the Bodisat's brothers at a pond and tests
    whether they know what is divine. The Bodisat recognizes the danger, resists the
    lure to enter the water, teaches that divine nature belongs to the morally pure
    and kind, explains an apparently irregular choice between his brothers, receives
    both brothers back, converts the ogre, and later returns to Benares to rule righteously.
    The frame identifies the figures with the Buddha, Ānanda, Sāriputta, and a monk.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A being carries a brother down into the water and confines him in a cave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Moon Prince is sent after the delayed brother, answers that the far-spreading
    sky is divine, and is also seized and confined.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bodisat notices the brothers' delay, sees footprints going down into the
    water, concludes the pond is haunted by a water-sprite, and stands armed with
    sword and bow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The demon takes the form of a woodman and invites the Bodisat to enter the
    lake to bathe, drink, eat lotus stalks, and pick flowers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Bodisat identifies the disguised figure as the captor of his brothers,
    and the demon says he has been granted those who go down into the pond except
    those who know what beings are divine.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the Bodisat offers to teach about divine beings, the water-sprite bathes
    him, gives him food and water, adorns him with flowers and perfumes, and prepares
    a couch in an arbour.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Bodisat teaches that beings called divine are pure in heart, fear sin,
    and are good and kindly in word and deed.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The water-sprite is moved, trusts the Bodisat, offers to return one brother,
    and questions why the Bodisat asks for the younger rather than honoring seniority.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Bodisat explains that the younger brother's mother had asked for the kingdom
    for him, that the father sent the boys to the forest for safety, and that the
    Bodisat wants to avoid blame if the younger boy is missing.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The water-sprite praises the Bodisat as one who both knows and acts according
    to divine nature, then brings forth and returns both brothers.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Bodisat tells the ogre that his present ogre birth results from former
    evil deeds, warns him against continued sin and rebirth in evil states, and succeeds
    in converting him.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The converted ogre protects the Bodisat; after seeing by the stars that his
    father has died, the Bodisat returns to Benares, takes the kingdom, appoints the
    Moon Prince and Sun Prince to offices, provides for the water-sprite, and rules
    righteously.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: In the frame, the Teacher teaches the Four Truths, a monk enters the First
    Stage of the Path, and the Buddha identifies the past figures with present Buddhist
    figures and himself.
  category: sequence
  evidence_refs:
  - ev:13
