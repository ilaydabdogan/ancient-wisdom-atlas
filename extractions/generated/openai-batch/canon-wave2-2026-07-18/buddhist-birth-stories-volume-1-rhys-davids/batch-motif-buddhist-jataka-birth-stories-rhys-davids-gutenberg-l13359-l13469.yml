canonical_text:
  quote: ''
  summary: A fairy who had urged Anātha Piṇḍika to stop supporting the Buddha and
    the Order is expelled from her dwelling. After being refused help by an intermediary
    and by the four guardians, she appeals to Sakka. Sakka refuses to intercede directly
    but instructs her to make restitution by recovering debts, sea-lost wealth, and
    ownerless treasure, thereby refilling the merchant’s treasury. She obeys, confesses
    at midnight to the merchant, and is taken before the Buddha. The Buddha teaches
    that sin and goodness are recognized when their fruits ripen. The fairy attains
    the Fruit of Conversion, asks pardon, and receives it from both the Teacher and
    the merchant. Anātha Piṇḍika then asks whether his continued giving despite her
    obstruction counts as merit.
  language: English
  quote_policy: summarized
