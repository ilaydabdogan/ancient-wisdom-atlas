canonical_text:
  quote: ''
  summary: The passage gives the end of a Jātaka fable in which a hawker disguises
    an ass in a lion's skin, the ass is exposed by braying, beaten, and dies; it then
    comments on cross-cultural parallels and on the Bodisat's moral stanza. The passage
    then begins the Kacchapa Jātaka, where the future Buddha is a royal adviser seeking
    to cure a talkative king. A tortoise befriends two haŋsas, is carried by them
    on a stick toward their mountain cave home, lets go when he tries to answer villagers,
    falls into the palace courtyard, and splits in two.
  language: English
  quote_policy: summarized
