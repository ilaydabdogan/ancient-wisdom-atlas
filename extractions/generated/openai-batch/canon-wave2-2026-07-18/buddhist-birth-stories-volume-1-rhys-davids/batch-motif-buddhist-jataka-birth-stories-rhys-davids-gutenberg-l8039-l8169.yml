  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Bodisat goes to the river, pays eight pennies to a boatman, and departs
    in the boat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The covetous hawker returns for the dish, learns that a just dealer has already
    taken it, scatters his own money and goods, seizes his yoke as a club, and pursues
    the Bodisat.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: At the riverside, the hawker calls for the boat to stop, the Bodisat tells
    the boatman not to stop, and the hawker dies after violent grief and bleeding.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The narrator states that this was the first time Devadatta harboured hatred
