canonical_text:
  quote: ''
  summary: A frame discourse at Sāvatthi uses a past-birth story to encourage a discouraged
    monk. In the story, the Bodisat as a Seriva dealer truthfully values a poor household's
    neglected golden dish and pays generously for it, while an avaricious rival who
    had tried to deceive the household loses the vessel, pursues the Bodisat, and
    dies from grief and hatred. The closing verse warns that failure in the present
    opportunity will bring remorse like that of the Seriva trader.
  language: English
  quote_policy: summarized
