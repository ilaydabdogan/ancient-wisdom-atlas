- id: obs:1
  text: At Sāvatthi, the Blessed One addresses a monk discouraged in his efforts to
    obtain spiritual enlightenment and introduces the example of a Seriva trader who
    lost a valuable golden vessel.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the past story, the Bodisat and another tin-and-brass dealer cross the
    Tēla-vāha river, enter Andhapura, and divide the city streets between them for
    trading.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A once-wealthy family has become poor; only a girl and her grandmother remain,
    and they possess a dirty, neglected vessel without knowing that it is gold.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The avaricious hawker tests the dish, finds that it is gold, falsely says
    it is not worth even a halfpenny, throws it down, and leaves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The girl and grandmother call the Bodisat because he appears pleasant and
