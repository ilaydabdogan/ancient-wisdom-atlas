  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: A horse-dealer brought five hundred horses, and the foolish valuer priced
    them at a single measure of rice; the dealer received the rice and the horses
    were placed in the stable.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The former valuer advised the horse-dealer to bribe the foolish valuer and
    ask him in the king’s presence to value the measure of rice.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the royal audience, the foolish valuer affirmed that five hundred horses
