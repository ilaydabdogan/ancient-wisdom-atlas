canonical_text:
  quote: ''
  summary: 'The passage opens the Taṇḍula-Nāḷi Jātaka. In the frame story, the monk
    Udāyin mishandles food-ticket distribution after objecting to Dabba’s stewardship,
    causing disorder in the hall. The Teacher says Udāyin has caused loss through
    stupidity before and tells a past-life story: a covetous king replaces the Bodisat,
    a competent valuer, with a foolish peasant. The fool values five hundred horses
    at one measure of rice. On the Bodisat’s advice, the horse-dealer bribes the fool
    and asks him before the king to value that measure of rice; the fool declares
    it worth all Benares, exposing the absurdity.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dabba held the office of steward in the Order and issued food-tickets; Udāyin
    objected when he received inferior rice and was then given the basket of tickets
    to distribute.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:2
  text: Udāyin did not know which tickets or storehouses corresponded to better or
    inferior rice and used scratches on a wall or floor to track turns.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: When monk numbers changed, Udāyin’s scratches no longer matched the correct
    turns, but he said he would trust the marks rather than the monks.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Boys and novices expelled Udāyin from the distribution hall, saying his ticket-giving
    deprived the brethren of their due.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Teacher asked Ānanda about the tumult, received Ānanda’s report, and said
    Udāyin had formerly also brought loss on others through stupidity.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the past-life story, Brahma-datta was king in Benares and the Bodisat was
    his valuer, assigning proper prices to horses, elephants, jewelry, gold, and similar
    goods.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king was covetous and appointed a stupid miserly peasant as valuer to
    preserve his treasure.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The appointed fool valued goods without regard to their real value, deciding
