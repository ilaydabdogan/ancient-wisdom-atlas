canonical_text:
  quote: "“he who gave alms to the Pacceka Buddha, standing on the lotus after defeating
    the Tempter, was I myself.”"
  summary: 'The Teacher concludes a discourse to a householder, says the householder’s
    First Path insight made it unsurprising that he was unmoved by a Fairy, and contrasts
    this with wonders done by the wise in former times. He then connects the Jātaka:
    a Pacceka Buddha died without a new being arising to inherit his Karma, and the
    donor who gave alms to him after defeating the Tempter is identified as the Teacher
    himself.'
