canonical_text:
  quote: "“As one might nurse a tiny flame, / The able and far-seeing man, / E’en
    with the smallest capital, / Can raise himself to wealth!”"
  summary: A pupil of Chullaka repeatedly turns small resources, services, and market
    information into greater wealth. He rewards Chullaka out of gratitude, is made
    heir and later city treasurer, and the Buddha closes the Jātaka by explaining
    its moral and identifying the past-life figures.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The young man buys molasses and water with a farthing, gives them to garland-makers,
    receives flowers and flowering shrubs, and in a short time gains eight pennies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After wind and rain blow dry sticks, branches, and leaves into the king’s
    garden, the young man offers to remove them if the gardener gives them to him,
    and the gardener agrees.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man gives molasses to children so that they collect the leaves and
    sticks into a heap, then sells the heap as firewood to the king’s potter for sixteen
    pennies and five vessels.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After obtaining twenty-four pennies, the young man places a pot of water near
    the city gate and supplies five hundred grass-cutters with drink; they say he
    has served them and ask what they can do for him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The young man asks the grass-cutters to do him a good turn when need arises,
    and he also makes friends with a trader by land and a trader by sea.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the land trader reports that a horse-dealer is coming with five hundred
    horses, the young man asks each grass-cutter for a bundle of grass and asks them
    not to sell their own grass until his is sold.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The horse-dealer cannot get grass elsewhere in the city and buys the young
    man’s five hundred bundles for a thousand pence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the sea trader reports that a large vessel has arrived, the young man
    hires a carriage, goes to the port with a display of respectability, gives his
    seal-ring as a deposit for the ship’s cargo, and has a tent and ceremonial announcement
    protocol arranged.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: About a hundred merchants from Benares come to buy the ship’s goods; after
    hearing that another merchant has already paid deposit, they give the young man
    money to become shareholders and further money for him to relinquish his remaining
    share.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The young man returns to Benares with two hundred thousand, brings one hundred
    thousand to Chullaka out of gratitude, and says he gained the wealth by adhering
    to Chullaka’s words.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Chullaka gives the young man his grown-up daughter in marriage, makes him
    heir to the family estates, and after Chullaka’s death the young man receives
    the post of city treasurer.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Buddha gives a verse comparing the growth of wealth from small capital
    to nursing a tiny flame.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Buddha states that Little Roadling has now become great in religion through
    him and formerly became great in riches through him; he identifies Chullaka’s
    pupil as Little Roadling and Chullaka as himself.
  category: relationship
  evidence_refs:
  - ev:10
