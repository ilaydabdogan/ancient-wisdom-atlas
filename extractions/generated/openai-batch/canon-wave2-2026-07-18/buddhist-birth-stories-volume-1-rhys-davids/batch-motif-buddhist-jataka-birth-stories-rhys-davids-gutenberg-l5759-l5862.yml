canonical_text:
  quote: ''
  summary: A divine being in the likeness of the royal barber adorns the Bodisat with
    a miraculous turban. After a public procession, the Bodisat hears of his son's
    birth and the child is named Rāhula, understood here as an impediment or bond.
    Kisā Gotamī praises the Bodisat, prompting his reflection on lasting peace through
    the extinguishing of lust, hatred, delusion, and other troubles; he sends her
    a pearl necklace as a teacher's fee. In the palace, he takes no pleasure in music
    and dance, wakes to see the performers asleep in disorder, compares the palace
    to a charnel-house and life to a burning house, and resolves on the Great Renunciation.
    He orders Channa to saddle Kanthaka; the horse understands the purpose and neighs,
    but the gods silence the sound.
  language: English
  quote_policy: summarized
