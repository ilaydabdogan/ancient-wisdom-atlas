canonical_text:
  quote: ''
  summary: The passage narrates the future Buddha’s decision to become a Buddha, his
    departure from a heavenly realm, Mahā Māyā’s ritual preparation and dream, the
    dream-conception through a white elephant entering her right side, the Brāhmans’
    prophecy of the child’s destiny, and widespread cosmic, social, bodily, and natural
    omens at the moment of incarnation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The future Buddha grants the deities’ prayer and says the time has arrived
    for him to become a Buddha.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: He enters the grove of Gladness with angels, later departs from there, and
    is conceived in the womb of Lady Mahā Māyā.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: During the Midsummer festival, Lady Mahā Māyā bathes in perfumed water, gives
    largesse, wears rich attire, eats pure food, vows to observe the Eight Commandments,
    lies on a royal couch, sleeps, and dreams.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Four archangels, called Guardians of the world, lift Mahā Māyā in her couch
    and carry her to the Himālaya mountains, placing her under the Great Sāla-tree
    on the Crimson Plain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The queens of the Guardians take Mahā Māyā to the lake of Anotatta, bathe
    her, dress her in heavenly garments, anoint her, adorn her with heavenly flowers,
    and lay her on a couch in a golden mansion.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The future Buddha appears as a superb white elephant, carries a white lotus
    in his trunk, utters a far-reaching cry, enters the golden mansion, bows three
    times to his mother’s couch, touches her right side, and seems to enter her womb.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After hearing the dream, the rāja summons sixty-four eminent Brāhmans, feeds
    them milk-rice with ghee and honey, gives them garments and cows, and asks what
    will come of the dream.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Brāhmans say the queen has conceived a male child who will become either
    a Universal Monarch if he remains a householder or a Buddha if he adopts the religious
    life.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the moment the future Buddha becomes incarnate, the ten thousand world-systems
    quake and an immeasurable light appears with the Thirty-two Good Omens.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Among the omens, the blind see, the deaf hear, the dumb speak, the crooked
    become straight, the lame walk, prisoners are freed, hellfire is extinguished,
    hungry ghosts receive food and drink, animals cease fear, illnesses are allayed,
    and people speak kindly.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Other omens include self-sounding instruments and ornaments, clear heavens,
    pleasant breeze, untimely rain, water welling from the earth, rivers stopping,
    ocean water becoming fresh, flowers and lotuses appearing everywhere, trees blooming,
    and the ten-thousand world-systems drawing together like a wreath.
  category: sequence
  evidence_refs:
  - ev:9
