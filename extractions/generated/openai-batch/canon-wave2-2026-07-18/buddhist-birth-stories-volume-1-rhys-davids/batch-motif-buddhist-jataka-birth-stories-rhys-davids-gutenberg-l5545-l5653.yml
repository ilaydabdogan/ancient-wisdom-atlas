canonical_text:
  quote: ''
  summary: Eight Brāhmans interpret signs associated with the Bodisat. Seven give
    a twofold prophecy that he may become either a Universal Monarch or a Buddha,
    while Kondanya gives an unambiguous prophecy that he will become a Buddha. Kondanya
    later renounces and leads four others who become the Company of the Five Elders.
    King Suddhodana tries to prevent the prince from seeing the four omens that would
    lead him to renunciation. During a ploughing festival, the child Bodisat is left
    beneath a Jambu-tree, enters the first Jhāna, and is associated with a miraculous
    stationary circular tree-shadow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eight Brāhmans are described as recognizers of signs who had interpreted the
    dream on the night of conception.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Seven of the Brāhmans raise two fingers and give an alternative prophecy:
    if the marked man remains a householder he becomes a Universal Monarch, and if
    he takes vows he becomes a Buddha.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kondanya, the youngest Brāhman, raises one finger and gives an unambiguous
    prophecy that the Bodisat will become a Buddha rather than remain in household
    life.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kondanya is said to have made a deep resolve of holiness under former Buddhas,
    to have reached his last birth, and to surpass the other seven in wisdom.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The seven older Brāhmans instruct their sons to take vows under the son of
    King Suddhodana when he gains omniscience, and the seven later die and are reborn
    according to their deeds.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kondanya renounces, settles at Uruvela, later hears that Siddhattha has taken
    vows, and invites the sons of the Brāhmans to take vows in imitation of him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Four of the Brāhmans' sons follow Kondanya and take vows; together they come
    to be called the Company of the Five Elders.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'The king is told that his son will forsake the world after seeing four omens:
    an aged man, a sick man, a dead body, and a monk.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The king wants his son to exercise rule over the four great continents and
    surrounding islands, and he stations guards in the four directions to keep those
    four kinds of sights away from him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Eighty thousand clansmen each dedicate a son to attend the child whether he
    becomes a Buddha or a king, and nurses are appointed for the Bodisat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At the Ploughing Festival, the town is ornamented, servants wear new garments
    and garlands, and a thousand ploughs are yoked, including silver-ornamented ploughs
    and a gold-ornamented royal plough.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The king places the child beneath a leafy Jambu-tree on a couch with a gold-starred
    canopy and curtain, leaves a guard, and goes away to plough.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: When the nurses leave to see the king's glory, the Bodisat finds himself alone,
    sits cross-legged, holds his breath, and enters the first Jhāna.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The shadows of other trees turn, but the shadow of the Jambu-tree remains
    steady and circular; the nurses see the child and the shadow-miracle and report
    it to the king.
  category: action
  evidence_refs:
  - ev:10
