canonical_text:
  quote: |-
    “Wings I have that will not fly,
    Feet I have that will not walk;
    My parents, too, are fled away!
    O All-embracing Fire--go back!”
  summary: The Teacher tells how, in a past life as a helpless young quail, the Bodisat
    was abandoned in a nest when a jungle fire approached. Relying on virtue, truth,
    recollection of past Buddhas, and an Act of Truth, he commanded the fire to turn
    back; it receded and went out, leaving the spot protected from fire through the
    kalpa. The Teacher then explains the present fire immunity of the wood through
    that past act and identifies the former figures. The passage also begins the next
    Jātaka frame, where a monk’s forest hut burns and local people delay helping him.
  language: English
  quote_policy: quoted
