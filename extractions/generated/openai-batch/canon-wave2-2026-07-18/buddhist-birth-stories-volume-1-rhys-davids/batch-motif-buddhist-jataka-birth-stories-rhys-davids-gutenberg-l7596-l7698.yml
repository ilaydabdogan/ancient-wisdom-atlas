canonical_text:
  quote: ''
  summary: The Blessed One frames a former-life story about people who mistook a false
    refuge and were destroyed by demons in a haunted desert, while those adhering
    to right belief were saved. Anātha Piṇḍika asks him to explain the hidden matter.
    In the past, during Brahma-datta’s reign at Benares, the Bodisat is born as a
    merchant and prepares five hundred carts, while another foolish merchant prepares
    another five hundred. They decide not to travel together; the foolish merchant
    goes first, while the Bodisat chooses to follow later for practical advantages.
    The first caravan enters a sixty-league waterless, demon-haunted wilderness with
    water-pots filled. A desert demon plans to make them discard their water and appears
    with a wet, lotus-adorned retinue in a carriage drawn by milk-white bulls, then
    greets the merchant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One says that formerly some men trusted their own reason, mistook
    a non-refuge for a refuge, became prey to demons in a haunted wilderness, and
    came to disaster, while others adhering to right belief found good fortune in
    the same desert.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Anātha Piṇḍika performs obeisance and asks the Blessed One to reveal how the
    self-sufficient reasoners were destroyed and the truth-holders were saved.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The past story is set in Kāsi, in the city of Benares, during the reign of
    King Brahma-datta.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Bodisat is born in a merchant family, grows up, and travels for trade
