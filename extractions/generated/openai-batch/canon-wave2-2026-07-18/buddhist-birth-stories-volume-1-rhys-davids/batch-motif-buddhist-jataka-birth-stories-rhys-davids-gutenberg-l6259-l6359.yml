canonical_text:
  quote: ''
  summary: After eating milk-rice, the Bodisat casts a golden vessel into the river
    as a sign of whether he will become a Buddha that day. The vessel moves upstream
    to the Nāga king's palace and joins bowls of previous Buddhas. The Bodisat proceeds
    to the Tree of Wisdom, receives grass from Sotthiya, tests positions around the
    Bo-tree, finds the steadfast spot used by all Buddhas, creates a grass seat, and
    vows not to leave until complete insight. Māra then leads a vast army to prevent
    his liberation; divine beings who had praised the Bodisat flee, leaving him seated
    alone.
  language: English
  quote_policy: summarized
