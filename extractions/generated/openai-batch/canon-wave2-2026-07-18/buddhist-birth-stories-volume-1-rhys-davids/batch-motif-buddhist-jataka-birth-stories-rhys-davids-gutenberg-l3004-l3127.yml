  summary: 'The passage catalogs Jātaka stories represented in bas-relief on ancient
    monuments, notes further monument scenes identified or unidentified, and begins
    the Nidānakathā by framing the Jātakas as accounts of the Bodhisatta’s many births
    and the Buddha biography in three epochs: distant, intermediate, and proximate.'
  language: English
