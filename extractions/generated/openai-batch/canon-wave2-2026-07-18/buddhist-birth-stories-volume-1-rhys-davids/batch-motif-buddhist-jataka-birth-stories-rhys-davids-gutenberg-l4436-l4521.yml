canonical_text:
  quote: ''
  summary: The Bodhisatta, born as the brahmin Suruci, invites a Buddha and his immense
    monastic assembly to receive alms. Suruci worries about seating them, causing
    Indra's throne to grow warm. Indra sees the situation, assumes the form of a carpenter,
    and miraculously raises a vast jeweled hall with seats, decorations, and water
    vessels. Suruci recognizes the hall as divine, resolves to give alms for a week,
    and feeds the assembly with human and angelic assistance. The passage also comments
    that Bodhisattas are not satisfied by external gifts alone, citing the Sivijātaka
    eye-gift. At the end, the Teacher predicts Suruci's future Buddhahood as Gotama,
    and Suruci resolves to give up household life.
  language: English
  quote_policy: summarized
