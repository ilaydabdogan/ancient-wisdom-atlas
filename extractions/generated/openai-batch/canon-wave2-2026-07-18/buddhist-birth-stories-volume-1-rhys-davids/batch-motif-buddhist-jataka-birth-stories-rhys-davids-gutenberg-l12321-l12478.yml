canonical_text:
  quote: ''
  summary: The passage closes one quail story with a moral against quarrelling among
    relatives, then gives the Maccha Jātaka, in which a lovesick monk is taught through
    a former-birth story of a fish captured through desire and rescued by the Bodisat
    as a chaplain. It then begins the Vaṭṭaka Jātaka frame, where a jungle fire approaches
    the Buddha and the monks, but goes out at the place where the Buddha stands; the
    Buddha attributes this to a former act.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master states that quarrelling among relatives is a root of misfortune
    and identifies the foolish quail with Devadatta and the wise quail with himself.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A monk admits that he is love-sick because he cannot forsake the woman who
    was formerly his wife.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Master tells the monk that this woman harms him and says that in a former
    birth the monk was about to be killed through her when the Master saved him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the former-birth tale, the Bodisat is the private chaplain of Brahma-datta
    in Benāres.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A female fish smells a net, avoids it, and escapes, while the male fish swimming
    after her goes into the net.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Fishermen pull up the net, seize the male fish alive, put it on the sand,
    and prepare a fire and spit to cook and eat it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The captured fish laments that his greatest distress is not physical pain
    but the thought that his wife may believe he deserted her for another.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The chaplain understands the language of animals, hears the fish’s lament,
    and decides to save him so that he will not die in an unhealthy state of mind
    and be reborn in hell.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The chaplain asks the fishermen for the captured fish, takes it, exhorts it
    to sin no more, and throws it back into the water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the discourse, the depressed monk is said to be established in the fruit
    of conversion, and the Teacher identifies the female fish with the former wife,
    the male fish with the depressed monk, and the chaplain with himself.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: While the Master journeys through Magadha with disciples, a great jungle fire
    arises and spreads toward them.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: Some unconverted monks, terrified by fear of death, propose making a counter-fire
    and begin to get a light with fire-sticks.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Other monks rebuke the plan to make a counter-fire and urge the group to go
    to the Master, citing the power of the Buddhas.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The jungle fire reaches near the place where the Buddha stands and then goes
    out, leaving a space it cannot pass over.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: The Teacher says the fire goes out not through present power but through the
    power of a former act, and that no fire will burn the spot through the whole kalpa.
  category: speech
  evidence_refs:
  - ev:12
