canonical_text:
  quote: "“Surely thou shalt be a Buddha!”"
  summary: The Bodhisatta sits cross-legged in joyful ecstatic meditation and reflects
    that he has mastered supernatural faculties. Dwellers or angels of ten thousand
    worlds proclaim that he will become a Buddha and identify many cosmic, natural,
    moral, and visionary omens as signs of that destiny. After hearing Dīpankara Buddha
    and the angels, the Bodhisatta reasons that the word of Buddhas cannot fail and
    confirms inwardly that he will become a Buddha.
  language: English
  quote_policy: quoted
