canonical_text:
  quote: ''
  summary: A demon deceives a foolish merchant caravan into discarding its water in
    an arid desert, leading to the death of the men and oxen. Later, the Bodisat prepares
    carefully, preserves water, recognizes the demon by physical and environmental
    signs, reasons with his followers, and orders them not to discard any water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A merchant asks a muddy, wet, lotus-bearing demon whether rain and lotus-covered
    tanks lie along the road he has come by.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The demon claims that beyond a green forest the country abounds with water,
    rain, full pools, ponds, and lotuses.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The demon questions the contents of the carts, learns that the heavy last
    cart carries water, and advises the merchant to break the pots and pour the water
    away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The foolish merchant accepts the demon’s word, has the pots broken, and pours
    away all the water without saving even a cupful.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the water is discarded, the caravan finds no water ahead; the men become
    weary, cannot drink or cook rice, unyoke the wagons, arrange them in a circle,
    tie the oxen to the wheels, and sleep.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At night demons come from their city, kill all the men and oxen, eat their
    flesh, leave bones behind, and the five hundred loaded carts remain standing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After waiting a month and a half, the Bodisat leaves the city, fills vessels,
    stores plentiful water, and orders his men not to use water or eat unfamiliar
    wilderness plants without asking him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the demon appears again, the Bodisat identifies the wilderness as arid,
    notices the demon’s red eyes, boldness, and lack of shadow, and infers that the
    earlier merchant’s caravan likely fell prey.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Bodisat tells the demon that travelling merchants do not throw away water
    until they see more water.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Bodisat’s men report the lotus-bearing, wet-looking visitors’ claim of
    rain and urge that the stored water be thrown away to lighten the carts.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Bodisat questions his men about lakes, rain-wind, clouds, lightning, and
    thunder in the desert, and they answer that none of these signs has been observed.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Bodisat declares that the visitors are demons seeking to weaken the caravan
    by making them discard water, predicts that the previous caravan’s loaded wagons
    will be found, and orders that no water be thrown away.
  category: speech
  evidence_refs:
  - ev:8
