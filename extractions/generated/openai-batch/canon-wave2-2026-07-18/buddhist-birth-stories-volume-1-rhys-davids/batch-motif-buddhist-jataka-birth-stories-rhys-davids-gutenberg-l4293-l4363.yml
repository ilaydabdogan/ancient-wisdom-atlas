canonical_text:
  quote: ''
  summary: The passage recounts an earlier age of Dīpankara Buddha, including the
    speaker as a matted-hair ascetic with supernatural faculties, mass conversions,
    Dīpankara's attendants, family, disciples, Bodhi-tree, superhuman stature, long
    life, saving activity, death, and the disappearance of his glory. It then introduces
    Koṇḍañña Buddha after a vast interval and describes the Bodhisatta as the universal
    monarch Vijitāvin, who gives offerings to the Buddha-led priesthood, receives
    a prediction of future Buddhahood, renounces his kingdom, becomes a monk, gains
    religious attainments, and is reborn in the Brahma heavens. Koṇḍañña's family,
    disciples, Bodhi-tree, stature, and lifespan are also listed.
  language: English
  quote_policy: summarized
