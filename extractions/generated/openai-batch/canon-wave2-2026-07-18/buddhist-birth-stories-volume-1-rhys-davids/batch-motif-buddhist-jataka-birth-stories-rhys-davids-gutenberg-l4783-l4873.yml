canonical_text:
  quote: ''
  summary: The passage catalogs five past Buddhas and corresponding former births
    of the Bodisat. In each entry, the Bodisat appears in a named form, performs devotion,
    donation, renunciation, or teaching, and receives a prophecy of future Buddhahood.
    The entries also list each Buddha's city, parents, disciples, servitor, chief
    female disciples, Bo-tree, body height, lifespan, and assemblies.
  language: English
  quote_policy: summarized
