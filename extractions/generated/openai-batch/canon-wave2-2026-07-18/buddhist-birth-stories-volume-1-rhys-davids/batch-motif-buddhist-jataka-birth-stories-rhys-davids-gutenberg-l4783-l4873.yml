- id: obs:1
  text: Tissa and Phussa are described as two Buddhas born in one kalpa ninety-two
    world-cycles ago.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The Bodisat is born as Sujāta, takes vows, acquires rishi powers, offers heavenly
    flowers to Tissa, spreads a flower-awning in the sky, and receives a prophecy
    of future Buddhahood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bodisat is born as Vijitavī, lays aside his kingdom, takes vows under
    Phussa, learns the three Piṭakas, preaches the Law, fulfills the Perfection of
    Morality, and receives a prophecy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bodisat is born as Atula, a mighty and powerful snake king, gives Vipassin
    a golden chair inlaid with seven kinds of gems, and receives a prophecy of future
    Buddhahood.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
