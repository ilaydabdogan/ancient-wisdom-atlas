canonical_text:
  quote: ''
  summary: The passage narrates Little Roadling's ordination, inability to learn a
    verse because of a past act of mocking a dull monk, exclusion by his elder brother
    from a meal invitation, intervention by the Buddha, meditation on a white cloth
    that becomes soiled, a vision teaching that inner stains are lust, anger, and
    delusion, his attainment of Arahatship, and a former-life parallel involving a
    king's soiled robe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The grandfather consents to Little Roadling's ordination, and the Elder initiates
    him and teaches him to live according to the Ten Commandments.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After reaching the noviciate, Little Roadling is described as dull and unable
    to memorize even one verse in four months.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage explains Little Roadling's present dullness as a consequence of
    a former life in which he mocked a dull brother monk during a recitation lesson.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elder brother declares Little Roadling unfit for the discipline and expels
    him from the monastery, though Little Roadling still loves the religion of the
    Buddhas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Jīvaka invites the Buddha and about five hundred monks to a morning meal,
    and Great Roadling accepts the invitation for all except Little Roadling.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Little Roadling overhears that he has been excluded from the invitation and
    decides to return to lay life and perform lay good deeds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Teacher becomes aware of Little Roadling's situation, waits at the gateway
    on the road he will pass, and meets him as he leaves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Teacher tells Little Roadling that his profession of religion took place
    under him and tells him to stay with him rather than return to lay life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Teacher gives Little Roadling a very white cloth and instructs him to
    sit facing East, rub the cloth up and down, and repeat the words about removal
    of impurity.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: As Little Roadling rubs the cloth, it becomes soiled; he observes the change
    and recognizes the reality of decay and death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Teacher sends a visible glorious vision of himself to Little Roadling
    after knowing that Little Roadling's mind has opened.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The vision teaches that Little Roadling must remove inner stains, and the
    stanzas identify lust, anger, and delusion, rather than dust, as the true stains.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: When the stanzas are finished, Little Roadling attains Arahatship, gains the
    intellectual gifts of an Arahat, and understands all the Scriptures.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that Little Roadling had formerly been a king who soiled
    a pure white robe with sweat, reflected on impermanency, and that this earlier
    incident helped bring about his conversion.
  category: sequence
  evidence_refs:
  - ev:9
