canonical_text:
  quote: ''
  summary: 'Jīvaka presents water to the Buddha, who says monks are present despite
    Great Roadling''s denial. Little Roadling manifests a thousand monks in the Mango-grove,
    and the true Little Roadling is identified when the first claimant is taken by
    the hand and the others disappear. After the meal Little Roadling gives a concise
    benedictive discourse. Monks praise the Buddha for giving him Arahatship and scriptural
    understanding in a single meal. The Buddha enters the hall, receives their report,
    and says Little Roadling has become great in religion through him now and had
    formerly become great in riches through him. The Buddha reveals a past birth:
    when Brahma-datta ruled in Benares, the Bodisat was the wise treasurer Chullaka,
    who saw a dead mouse and said that a clever young man could start a trade with
    it. A poor young man took the mouse and received a farthing for it.'
  language: English
  quote_policy: summarized
