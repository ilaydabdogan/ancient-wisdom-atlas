canonical_text:
  quote: ''
  summary: The passage lists qualities attributed to beings destined for Buddhahood
    and summarizes many former births in which the Bodisat fulfills Perfections, including
    almsgiving, goodness, renunciation, wisdom, resolution, patience, truth, good-will,
    and equanimity. It concludes with Vessantara’s earth-shaking generosity, his rebirth
    in Tusita heaven, and the definition of the Distant Epoch from the Resolution
    at Dīpaŋkara’s feet to the City of Delight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The verses state that those destined to Buddhahood do not become women and
    are not found among hermaphrodites or eunuchs.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The verses describe the Bodisats as free from deadly sins, pure-living, aware
    of karma, bent on renunciation, and acting for the world’s welfare while fulfilling
    all perfection.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says there is no limit to the Bodisat’s existences in which he
    fulfilled the Perfection of Almsgiving.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Wise Hare birth, the Bodisat sees someone coming for food and offers
    his own self.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In examples of the Perfection of Goodness, the Bodisat appears in snake-king
    births and in the Saŋkhapāla Birth is pierced with stakes and struck with javelins
    without anger toward the sons of Bhoja.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In examples of Renunciation, the Bodisat forsakes or rejects a kingdom.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Sattubhatta Birth, the Bodisat as Senaka uses wisdom to free a brahman
    from pain by pointing out a snake that had entered the bellows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Mahā-Janaka Birth, the Bodisat is in the midst of the waters out of
    sight of shore and crosses the Great Ocean.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Khantivāda Birth, the Bodisat is struck with a sharp axe and is not
    angry with the king of Kāsi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the Mahā-Sutasoma Birth, the Bodisat guards the word of Truth, offers his
    life, and delivers a hundred warriors.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the Ekarāja Birth, the Bodisat declares that no man terrifies him and that
    he takes delight in kindness and purity.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: In the Somahaŋsa Birth, the Bodisat lies in a cemetery with dead bones as
    a pillow and remains indifferent to mockery, praise, spitting, garlands, and perfumes.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: In the Vessantara birth, the Bodisat’s free-giving is said to shake the earth
    seven times.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: After passing away from the Vessantara birth, the Bodisat reassumes existence
    in the Tusita heaven.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: The passage identifies the Dūrenidāna period as extending from the Resolution
    at the feet of Dīpaŋkara to the birth in the City of Delight.
  category: sequence
  evidence_refs:
  - ev:13
