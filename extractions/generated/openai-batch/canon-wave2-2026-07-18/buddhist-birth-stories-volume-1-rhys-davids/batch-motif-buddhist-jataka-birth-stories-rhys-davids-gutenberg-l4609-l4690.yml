canonical_text:
  quote: ''
  summary: The passage lists successive Buddhas and associated Bodisat births. Under
    Paduma, the Bodisat is born as a lion, reveres the Buddha in trance, attends him
    for seven days, trusts the Order, and receives a prophecy of future Buddhahood.
    Under Nārada, the Bodisat is a sage who has attained wisdom and meditative acquisitions,
    gives sandalwood to the Buddha and Order, and receives the same prophecy. Under
    Padumuttara, the Bodisat Jaṭila gives robes to the Buddha and Order and is prophesied
    to become a Buddha. Under Sumedha, the Bodisat Uttara gives a great donation,
    hears the Law, takes refuge, renounces home, takes vows, and is prophesied to
    become a Buddha. Each Buddha is also associated with assemblies, disciples, a
    Bo-tree, bodily scale, and lifespan.
  language: English
  quote_policy: summarized
