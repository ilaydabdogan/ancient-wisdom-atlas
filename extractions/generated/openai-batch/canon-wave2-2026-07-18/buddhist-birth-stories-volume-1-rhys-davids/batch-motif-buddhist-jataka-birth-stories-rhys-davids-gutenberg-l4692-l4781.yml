  quote: ''
  summary: The passage lists five former Buddhas—Sujāta, Piyadassin, Atthadassin,
    Dhammadassin, and Siddhattha—along with their assemblies, cities, families, disciples,
    Bo-trees, bodily dimensions, and ages. In each entry the Bodisat appears in a
    particular identity, makes a gift or offering, and receives a prophecy from the
    Teacher. Several verses praise the Buddhas with imagery of greatness, enlightenment,
    light, and the ending of darkness.
