canonical_text:
  quote: ''
  summary: 'The passage closes the Naḷapāna story: the Bodisat hollows Naḷa-canes
    by invoking the Ten Great Perfections, commands all canes around the pond to be
    perforated, and uses them so his monkey troop can drink without falling under
    a water-demon''s power. The narrator lists the hollow canes among four Kalpa-lasting
    Wonders. The Teacher identifies the water-demon as Devadatta, the monkeys as the
    Buddha''s retinue, and the monkey king as himself. The next Jātaka begins with
    a frame about Devadatta''s attempts to kill the Teacher, then tells of the Bodisat
    as a Kurunga antelope who detects a hunter''s tree-platform trap from the unnatural
    falling of fruit, addresses the tree, escapes a thrown javelin, and warns the
    hunter of hellish consequences.'
  language: English
  quote_policy: summarized
