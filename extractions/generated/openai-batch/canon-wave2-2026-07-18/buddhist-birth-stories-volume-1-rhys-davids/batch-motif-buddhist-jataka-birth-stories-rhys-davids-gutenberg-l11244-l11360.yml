canonical_text:
  quote: ''
  summary: A Jātaka frame identifies a present old monk and lay convert as former
    close allies. In the former-birth tale, the Bodisat is a minister to King Brahma-datta.
    A dog becomes closely attached to the king’s state elephant after feeding near
    him in the stable. When a peasant buys and removes the dog, the elephant refuses
    food, drink, and bathing. The Bodisat diagnoses grief from separation, advises
    a proclamation to recover the dog, and the dog returns. The elephant shows affection
    and resumes eating. The Teacher then identifies the dog with the lay convert,
    the elephant with the old monk, and the minister with himself.
  language: English
  quote_policy: summarized
