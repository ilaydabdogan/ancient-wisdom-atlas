canonical_text:
  quote: "“the Bodisat appears as a sort of chorus, a moralizer only, and not an actor
    in the play”"
  summary: The passage discusses the textual history and arrangement of the Jātaka
    collection. It reports a Ceylon tradition that an original Jātaka book consisted
    of verses alone, but the author argues that many prose Birth Stories may have
    existed before the verses were added. It identifies a possibly older group in
    which the Bodisat functions only as a moralizing chorus, including cases where
    the Bodisat is a tree deity. It also describes the artificial classification of
    the collection by number of verses, the conventional but inexact count of 550
    Jātakas, and the likelihood that the collection contains many more independent
    tales and anecdotes.
  language: English
