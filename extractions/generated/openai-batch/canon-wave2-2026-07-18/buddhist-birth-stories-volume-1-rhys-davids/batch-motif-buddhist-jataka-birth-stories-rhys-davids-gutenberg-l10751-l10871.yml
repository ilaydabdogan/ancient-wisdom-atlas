canonical_text:
  quote: |-
    “Though fallen on his side,
    And wounded sore with darts,
    The Bhoja’s better than a hack!
    So harness me, O charioteer!”
  summary: At Jetavana, the Teacher addresses a monk who has lost heart and tells
    a former-birth tale. The Bodisat, born as the king of Benares's Bhoja thoroughbred
    charger, helps a knight capture besieging kings. Though wounded after the sixth
    capture, the horse insists on being re-harnessed, helps capture the seventh king,
    counsels mercy and righteous rule, and dies. The Teacher applies the tale to perseverance,
    the monk attains Arahatship, and the Jataka identities are stated.
  language: English
  quote_policy: quoted
