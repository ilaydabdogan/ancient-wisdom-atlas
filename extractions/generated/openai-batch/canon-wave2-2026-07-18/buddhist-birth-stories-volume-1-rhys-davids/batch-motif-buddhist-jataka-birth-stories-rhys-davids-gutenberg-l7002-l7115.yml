canonical_text:
  quote: ''
  summary: A king repeatedly sends courtiers to summon or communicate with the Blessed
    One, but the messengers hear the teaching, attain Arahatship, and remain with
    the Order. The king then sends Kāḷa Udāyin, a trusted companion of the future
    Buddha, who also becomes an Arahat but successfully urges the Blessed One to visit
    his father and relations. In spring the Blessed One begins the journey to Kapilavatthu
    with a large company of mendicants. Udāyin flies ahead to the king, receives a
    bowl of food for the Buddha, and miraculously conveys it through the air to the
    Master.
  language: English
  quote_policy: summarized
