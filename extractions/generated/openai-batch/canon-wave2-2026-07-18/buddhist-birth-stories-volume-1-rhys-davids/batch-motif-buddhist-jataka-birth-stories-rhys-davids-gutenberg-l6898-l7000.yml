canonical_text:
  quote: ''
  summary: The passage narrates a king's invitation to the Buddha, a vast crowd at
    Rājagaha, Sakka's disguised descent to clear a path and praise the Buddha, the
    royal donation of the Bambu Grove with a water-pouring gesture, an earthquake
    at the monastery's acceptance, the conversion and appointment of Sāriputta and
    Moggallāna, and Suddhodana's dispatch of an envoy to summon his son.
  language: English
  quote_policy: summarized
