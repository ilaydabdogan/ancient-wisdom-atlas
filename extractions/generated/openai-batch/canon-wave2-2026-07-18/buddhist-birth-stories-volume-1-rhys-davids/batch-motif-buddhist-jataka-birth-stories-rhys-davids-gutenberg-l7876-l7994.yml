canonical_text:
  quote: ''
  summary: 'A present-time frame introduces a mendicant who abandons solitary meditation
    after failing to attain insight. The Buddha rebukes him by recalling that formerly
    his energy helped save the men and bullocks of five hundred wagons in a sandy
    desert. At the monks’ request, the Buddha begins the past-birth story: the future
    Buddha is born as a merchant, travels with five hundred carts through a hot sandy
    desert, and the caravan becomes lost after discarding its water. When the party
    despairs, the Bodisat refuses to lose heart and sees a tuft of Kusa-grass, inferring
    that water lies beneath it.'
  language: English
  quote_policy: summarized
