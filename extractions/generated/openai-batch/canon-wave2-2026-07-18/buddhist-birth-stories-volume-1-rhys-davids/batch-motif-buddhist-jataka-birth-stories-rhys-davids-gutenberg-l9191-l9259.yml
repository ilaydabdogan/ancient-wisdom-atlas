canonical_text:
  quote: ''
  summary: A wealthy Brāhman Bodisat renounces worldly life, becomes a hermit in the
    Himālaya region, and leads many ascetics. During a rainy-season stay in Benares
    under royal patronage, the king asks him to remain while his senior pupil leads
    the ascetics back to the Himālayas. The senior pupil, himself a former king who
    renounced power, later visits the teacher and expresses joy without rising for
    the king. The Bodisat explains that the pupil rejoices in meditation and religious
    life, teaches the king a verse about freedom from dependence and desire, and is
    later reborn in Brahma heaven. The frame identifies the past pupil as Bhaddiya
    the Elder and the master as the Teacher himself.
  language: English
  quote_policy: summarized
