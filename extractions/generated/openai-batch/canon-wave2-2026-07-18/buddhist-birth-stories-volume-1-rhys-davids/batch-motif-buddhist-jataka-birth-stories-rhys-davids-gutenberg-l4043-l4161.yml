canonical_text:
  quote: ''
  summary: The passage describes Sumedha seeking and resolving to fulfill the ninth
    Perfection of Good-will and the tenth Perfection of Equanimity, using water and
    earth as models of impartiality. He realizes that the ten Perfections are the
    sole conditions of Buddhahood and are established in his own heart, then masters
    them repeatedly. His mastery is described through images of sacrifice, oil-mixing,
    and cosmic churning with Mount Meru. By the power of his piety, the earth of ten
    thousand worlds quakes, frightening the people of Ramma. Dīpankara reassures them
    that the quake is not dangerous and is caused by Sumedha investigating the Conditions
    followed by the Buddhas.
  language: English
  quote_policy: summarized
