canonical_text:
  quote: ''
  summary: 'Māra and his host attack Siddhattha, the Great Being and future Buddha,
    as he sits alone and meditates on the Ten Perfections. Māra sends storms of wind,
    water, rocks, weapons, charcoal, ashes, sand, mud, and darkness, but each assault
    loses power or is transformed into flowers, fragrance, or harmless forms. Māra
    then claims the seat for himself; Siddhattha answers that the virtues, self-renunciation,
    knowledge, salvation of the world, and wisdom make the seat his. Māra’s javelin
    and the host’s rocks also become floral offerings. The passage ends with a contest
    over witnesses for almsgiving: Māra calls his host, while Siddhattha calls the
    unconscious solid earth to witness his alms as Wessantara.'
  language: English
  quote_policy: summarized
