canonical_text:
  quote: "“Verily nothing that is composite is enduring!”"
  summary: 'A Jetavana frame recounts a monk whose prior goldsmith births make the
    meditation on impurity ineffective. Sāriputta brings him to the Buddha, who provides
    a different object of contemplation: a beautiful lotus that decays before the
    monk’s eyes. The monk understands impermanence and attains Arahatship. The monks
    praise the Buddha’s knowledge of dispositions, and the Buddha says he knew such
    dispositions formerly as well. The embedded past tale begins with Brahma-datta
    reigning in Benares, the Bodisat as adviser, and a royal charger refusing to enter
    a ford after a common hack has been rubbed down there.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage introduces the Tittha Jātaka in a Jetavana frame about a junior
    monk under the Minister of Righteousness who had formerly been a goldsmith.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sāriputta prescribes the Meditation on Impurity, but the monk fails for four
    months; the passage explains this by saying he had been born five hundred times
    in a goldsmith’s house and found impurity hard to grasp after long exposure to
    pure gold.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Sāriputta concludes that only a Buddha can lead the monk to the Truth and
    brings him to the Master, who says Sāriputta does not understand hearts and motives.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Master gives the monk better robes and pleasant food, takes him on a monastery
    walk, creates a pond with lotuses in a mango-grove, and tells him to watch one
    exceptionally beautiful lotus.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The watched lotus loses color, its petals fall, its heart falls to pieces,
    and only the centre knob remains.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The monk reflects from the flower’s decay to the possible decay of his own
