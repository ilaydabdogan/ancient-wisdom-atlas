    eyes are opened.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The Master sends an appearance of himself with a stanza about uprooting self-love
    and following the Way of Peace; when the stanza ends, the monk reaches Arahatship
    and rejoices.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The monks later say Sāriputta lacked knowledge of the monk’s disposition while
    the Master obtained Arahatship for him in one day; the Master replies that he
    knew this disposition formerly also.
  category: speech
  evidence_refs:
  - ev:7
