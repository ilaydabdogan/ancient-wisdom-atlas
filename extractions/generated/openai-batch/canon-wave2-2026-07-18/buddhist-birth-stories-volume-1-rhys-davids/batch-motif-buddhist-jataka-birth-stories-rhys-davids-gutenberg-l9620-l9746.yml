canonical_text:
  quote: "“I, giving my life to her, and accepting death in her place, have lain down.”"
  summary: A deer king, identified as the Bodisat, substitutes himself for a pregnant
    roe scheduled for execution. The human king is moved by this act and grants safety
    first to the Bodisat and the roe, then to deer, four-footed animals, birds, and
    fish. The Bodisat instructs the king in righteousness and later regulates the
    protected deer so they do not damage crops. The frame identifies the past-birth
    figures with figures in the present story.
  language: English
  quote_policy: quoted
