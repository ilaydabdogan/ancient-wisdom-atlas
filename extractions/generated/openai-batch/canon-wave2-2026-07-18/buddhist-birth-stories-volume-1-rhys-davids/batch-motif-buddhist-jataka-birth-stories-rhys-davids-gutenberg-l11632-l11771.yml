canonical_text:
  quote: ''
  summary: 'At Jetavana the Master admonishes a monk attracted to a fat girl by telling
    a former-birth tale: the Bodisat was an ox named Big-red, whose brother Little-red
    envied a pig named Sausages because the pig was fed boiled rice while the oxen
    received grass and straw. Big-red explains that the pig''s rich food is food leading
    to death, because the household is fattening him for a wedding feast. Sausages
    is killed and cooked, and Little-red learns that humble food is safer. The Master
    identifies the pig with the love-sick monk, Little-red with Ānanda, and Big-red
    with himself. The passage then begins the Kulāvaka Jātaka frame, in which two
    monks dispute over a water-strainer; one drinks unstrained water containing living
    creatures. The Master cites wise heavenly rulers who stopped their car during
    flight rather than harm living things, sacrificing glory and life for the young
    of the Supaṇṇas. The past tale begins with the Bodisat born as Prince Magha, a
    generous commandment-keeping householder.'
  language: English
  quote_policy: summarized
