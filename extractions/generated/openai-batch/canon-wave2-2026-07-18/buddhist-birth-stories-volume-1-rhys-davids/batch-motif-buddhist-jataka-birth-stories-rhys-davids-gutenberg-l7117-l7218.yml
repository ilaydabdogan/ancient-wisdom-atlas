  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sākyas place children and young people in front and instruct them to bow,
    while the older relatives intend to sit behind them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Blessed One perceives that his relatives are not paying him reverence,
