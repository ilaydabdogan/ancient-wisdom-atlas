canonical_text:
  quote: ''
  summary: The passage recounts the Blessed One's arrival among the Sākyas, their
    initially proud refusal to honor him, his aerial miracle that compels their obeisance,
    a selective miraculous rain linked to a former birth as Wessantara, and the next
    day's alms round in Kapilavatthu, where the mother of Rāhula sees and praises
    his transformed mendicant and luminous Buddha appearance.
  language: English
  quote_policy: summarized
