canonical_text:
  quote: ''
  summary: The Teacher discourages a Feast of the Dead involving the destruction of
    life and tells of a Brahman who prepared a goat for such a rite. The goat, remembering
    former births, explains that because he once killed a goat for the same rite he
    has had his head cut off through many births and will die again that day; he also
    pities the Brahman who would incur the same result by killing him. The Brahman
    releases and protects the goat, but the goat is killed when a thunderbolt splits
    a rock and a fragment severs its head. The Bodisat, born there as a tree genius,
    appears seated in the sky and teaches the crowd against taking life. The people
    abandon killing, keep precepts, give gifts, and perform good deeds. The Teacher
    identifies himself with the former tree genius.
  language: English
  quote_policy: summarized
