canonical_text:
  quote: There is nothing worse than greed, they say.
  summary: The excerpt introduces the Vāta-Miga Jātaka, “The Greedy Antelope.” In
    the frame story, the monk Tissa, known for strict food discipline, is lured from
    the Order by a slave-girl using favorite foods. The Master says this is not the
    first time he has fallen through desire for taste, and tells a former story in
    which the gardener Sanjaya uses honey-smeared grass to draw a swift antelope into
    the king’s palace.
  language: English
  quote_policy: quoted
