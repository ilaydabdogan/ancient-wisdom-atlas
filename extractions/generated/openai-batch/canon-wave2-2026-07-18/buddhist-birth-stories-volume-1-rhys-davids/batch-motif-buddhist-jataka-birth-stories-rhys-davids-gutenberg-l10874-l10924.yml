canonical_text:
  quote: "“The thoroughbred’s still full of fire!”"
  summary: The Teacher tells a Jātaka at Jetavana for a monk who lost heart. In a
    past life, during a siege of Benares, a wounded elder Sindh war horse identified
    as the Bodisat insists on being reharnessed, helps break the final enemy line,
    and dies after exhorting the king. The Teacher identifies the past king as Ānanda
    and the horse as the Supreme Buddha.
  language: English
  quote_policy: quoted
