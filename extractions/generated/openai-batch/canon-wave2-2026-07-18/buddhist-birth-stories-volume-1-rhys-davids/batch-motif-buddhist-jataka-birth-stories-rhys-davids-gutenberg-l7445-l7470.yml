canonical_text:
  quote: ''
  summary: The passage lists successive Buddha eras in which merchants purchase the
    same spot by covering it with valuable objects or coins and build monasteries
    there. It then states that the spot was not deserted by any Buddhas and that the
    Blessed One lived there from the attainment of omniscience under the Bo-tree until
    death, before the text turns to the Birth stories.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the time of the Blessed Buddha Vipassin, Punabbasu Mitta buys the same
    spot by laying golden bricks over it and builds a monastery one league in length.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the time of the Blessed Buddha Sikhin, Sirivaḍḍha buys the same spot by
    standing golden ploughshares over it and builds a monastery three-quarters of
    a league in length.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the time of the Blessed Buddha Vessabhū, Sotthiya buys the same spot by
    laying golden elephant feet along it and builds a monastery half a league in length.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the time of the Blessed Buddha Kakusandha, Accuta buys the same spot by
    laying golden bricks over it and builds a monastery a quarter of a league in length.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the time of the Blessed Buddha Koṇāgamana, Ugga buys the same spot by laying
    golden tortoises over it and builds a monastery half a league in length.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the time of the Blessed Buddha Kassapa, Sumaŋgala buys the same spot by
    laying golden bricks over it and builds a monastery sixty acres in extent.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the time of the current Blessed One, Anātha Piṇḍika buys the same spot
    by laying kahāpaṇas over it and builds a monastery thirty acres in extent.
  category: action
  evidence_refs:
  - ev:7
