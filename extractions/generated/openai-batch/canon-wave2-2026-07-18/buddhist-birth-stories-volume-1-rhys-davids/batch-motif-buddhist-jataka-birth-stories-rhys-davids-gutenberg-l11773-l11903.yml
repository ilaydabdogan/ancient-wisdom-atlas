- id: obs:4
  text: The Bodisat reconciles the thirty men and confirms them in the Five Commandments.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The men perform public works: clearing roads and paths, removing stones and
    obstructing trees, smoothing rough places, making causeways, digging ponds, building
    public halls, giving gifts, and keeping the Commandments.'
  category: action
  evidence_refs:
  - ev:3
