canonical_text:
  quote: "“this is our spell, this is our defence, this is our strength!”"
  summary: The Bodisat, identified as Magha the young Brāhman, leads thirty village
    men in moral discipline and public works. A village headman, angered by lost revenue,
    denounces them to the king as robbers. The king orders them trampled by elephants,
    but after the Bodisat urges loving-kindness toward the slanderer, king, and elephant,
    the elephants refuse. The Bodisat explains that their only spell is harmlessness,
    the Five Commandments, love, gifts, and charitable works. The king rewards them.
    Later, they build a rest-house at a crossroads, initially excluding women; Piety
    secures a share in the work by arranging for the needed pinnacle.
  language: English
  quote_policy: quoted
