  text: The village headman says he used to gain from fines, taxes, and pot-money
    when the men drank strong drink, took life, or broke the Commandments.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The village headman reports to the king that robbers are sacking villages,
    and the men are brought before the king as prisoners.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king orders the prisoners trampled to death by elephants without first
    inquiring into what they had done.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Before the elephants are brought, the Bodisat tells the men to keep the Commandments
    in mind and regard the slanderer, the king, and the elephant with the same kindness
    they have toward themselves.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The elephants refuse to trample the prisoners; each elephant cries out and
    runs away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The king suspects a drug or spell; after a search finds nothing, the Bodisat
    says they do have a spell.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Bodisat defines their spell as destroying no life, taking nothing ungiven,
