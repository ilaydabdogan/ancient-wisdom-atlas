canonical_text:
  quote: ''
  summary: The passage narrates the early religious vocation of the future mother
    of Kumāra Kassapa. She seeks ordination, is refused by her parents, marries, conceives
    without knowing it, and later gains her husband's consent to enter the Order of
    Nuns. When her pregnancy becomes visible, Devadatta orders her expulsion without
    inquiry. She appeals to the Buddha at Jetavana, and the Buddha arranges a public
    investigation before royal and lay witnesses, with Upāli and Visākhā assigned
    to determine whether conception occurred before or after ordination.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master is said to tell the story at Jetavana about the mother of the Elder
    named Kumāra Kassapa.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman is described as the daughter of a rich merchant of Rājagaha, rooted
    in virtue, despising transient things, and destined for future Arahatship.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: She asks her parents to let her take vows according to the Buddha's teaching
    leading to Nirvāna, but they refuse because she is their only daughter in a wealthy
    family.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: After being unable to gain her parents' permission, she plans to seek ordination
    after entering another family; she later marries and conceives without knowing
    it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: During a city feast, she does not anoint or dress herself for celebration,
    although the rest of the city keeps the feast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: She explains to her husband that the body is made of constituent parts, is
    impermanent, corrupt, disease-bearing, death-bound, and destined for the charnel-house.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Her husband suggests that she become a nun, grants her leave, gives a costly
    donation, and brings her to a nunnery where she is admitted among those siding
    with Devadatta.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When signs of pregnancy become visible, the nuns ask her about it; she says
    she does not know how it is, but that she has kept the vows.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The nuns bring the matter to Devadatta, stating that they do not know whether
    she conceived as a laywoman or as a nun.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Devadatta thinks that he will be disgraced if people say he condones a pregnant
    nun and orders her expulsion without inquiry.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The young nun says she entered the religious life under the Buddha rather
    than Devadatta and asks to be taken to the Master at Jetavana.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The nuns travel from Rājagaha to Jetavana, salute the Master, and tell him
    the whole matter.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Teacher thinks the child was conceived while she was still in the world
    but decides the case should be heard publicly to prevent hostile talk.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Teacher summons King Pasenadi, named lay supporters, Visākhā, and other
    distinguished persons, and instructs Upāli to examine the affair in the presence
    of the church.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Upāli calls Visākhā before the king and assigns her to determine the date
    of ordination and whether conception occurred before or after it.
  category: action
  evidence_refs:
  - ev:10
