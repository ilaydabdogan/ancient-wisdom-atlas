canonical_text:
  quote: ''
  summary: In a frame scene, the Teacher praises a householder's firmness and tells
    a former-life tale. In the tale, the Bodisat is born as the Treasurer of Benāres,
    practices giving, and prepares to feed a Pacceka Buddha. Māra creates a deep fiery
    pit to stop the almsgiving, but the Bodisat refuses to turn back, walks into the
    fire, is supported by a lotus, gives the food, and later preaches charity and
    righteousness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Teacher says the householder is converted, firm in faith, and was not
    turned back by a weak Fairy; he contrasts this with former wise people who gave
    gifts even when Māra threatened them with burning.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the request of Anātha Piṇḍika, the Teacher tells a tale.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Long ago, while Brahma-datta reigned in Benāres, the Bodisat was born in the
    family of the Treasurer of Benāres, grew up in luxury, mastered branches of knowledge
    by sixteen, and became Treasurer after his father's death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: As Treasurer, the Bodisat built six Gift-halls, gave gifts, kept the Precepts,
    and observed Sabbath-days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Pacceka Buddha, after rising from a seven days' trance, prepared himself
    with water from Anotatta lake, stood on Mount Manosilā, created a begging-bowl,
    traveled through the sky, and stood at the Treasurer's door as breakfast was being
    taken in.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the Bodisat saw the Pacceka Buddha, he rose and instructed a servant
    to bring the gentleman's bowl.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Māra resolved to stop the Treasurer's gift and prevent the Pacceka Buddha
    from receiving food; he created an eighty-fathom-deep pit of live coals in the
    house and remained in the sky.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The servant and other people who saw the burning pit were terrified; people
    who came up one after another fled away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Bodisat understood the obstacle as the work of Vasavatti Māra, took the
    dish of rice, went to the edge of the fire pit, looked up, and saw Māra in the
    sky.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In dialogue, Māra identifies himself, admits creating the fire pit, and says
    his purpose is to stop the almsgiving and destroy the life of the Pacceka Buddha.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Bodisat declares that he will allow Māra to do neither thing, addresses
    the Pacceka Buddha, says he will not turn back even if he falls into the coal
    pit, and asks him to receive the food.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Holding the dish of rice firmly, the Bodisat walks into the fiery furnace.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A large lotus-flower rises from the bottom of the fiery pit, receives the
    Bodisat's feet, and sends up pollen that covers his body like golden dust.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Standing in the lotus-flower, the Bodisat pours the food into the Pacceka
    Buddha's bowl.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Pacceka Buddha receives the food, gives thanks, throws the bowl aloft,
    rises into the sky before the people, and passes away toward the Himalayan mountain
    regions.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Māra goes away sorrowing over his defeat.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The Bodisat, still standing on the lotus, preaches the Law to the people in
    praise of charity and righteousness, returns home with the multitude, gives gifts
    and performs good works for life, and dies according to his deeds.
  category: sequence
  evidence_refs:
  - ev:10
