canonical_text:
  quote: ''
  summary: 'A monk tells the Teacher that unsuitable lodging prevented him from completing
    meditation. The Teacher responds with a former-birth tale: the Bodisat was once
    a wise bird living near a lofty tree with a flock. Seeing dust and smoke from
    rubbing branches, he predicts fire and urges the birds to fly away. Wise birds
    follow him; foolish birds mock the warning and remain. The tree catches fire,
    and the remaining birds are blinded by smoke, fall into the flames, and die. The
    Teacher applies the lesson to knowing suitable and unsuitable places, proclaims
    the Truths, and identifies the wise bird as himself.'
  language: English
  quote_policy: summarized
