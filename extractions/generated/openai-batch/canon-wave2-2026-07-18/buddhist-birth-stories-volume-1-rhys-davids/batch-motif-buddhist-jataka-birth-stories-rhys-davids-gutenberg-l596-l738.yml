canonical_text:
  quote: ''
  summary: 'The passage presents several Jātaka-related narrative examples: a tortoise
    dies after speaking while being carried through the air by birds; the Bodisat
    uses the story to admonish a talkative king; a Jackal and Crow fable depicts reciprocal
    flattery for food and is rebuked by a tree-god; and the beginning of the Mahosadha
    Jātaka shows a Yakshiṇī stealing a child and the future Buddha setting a judgment-hall
    test between rival claimants. The passage also includes editorial comparisons
    to Aesopic, Pañca Tantra, and other language traditions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The future Buddha reasons that a tortoise had made friends with wild ducks,
    held a stick in its mouth while being carried through the air toward the hills,
    tried to speak, released the stick, fell from the sky, and died.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The future Buddha tells the king that chatterboxes and people whose words
    have no end come to grief, and the verses say the tortoise killed himself by uttering
    his voice.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The king recognizes that the teaching applies to him; the Bodisat states openly
    that anyone who talks beyond measure meets mishap, after which the king becomes
    a man of few words.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator states that the tortoise story is also found in Greek, Latin,
    Arabic, Persian, and most European languages, and compares it with Aesopic and
    Pañca Tantra forms involving eagles.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Jackal and Crow story is introduced as a tale told in ridicule of Devadatta
    and Kokālika, who were said to ascribe to each other virtues neither possessed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Jackal and Crow tale, the Bodisat is born as a tree-god dwelling in
    a grove of Jambu-trees during Brahma-datta’s reign in Benāres.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: A crow sits on a Jambu-tree branch eating fruit; a jackal sees him and decides
    to flatter him in order to get some fruit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The jackal praises the crow as a fine singing-bird; the crow returns compliments
    to the jackal and shakes the Jambu-tree branch so fruit falls.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The tree-god sees the jackal and crow eating together after flattering one
    another, calls them chatterers of lies, manifests in an awful shape, and frightens
    them away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The narrator suggests that outside regions where crow and jackal are familiar
    scavengers, the story may have been shortened into the fable of the Fox and the
    Crow with cheese, while also arguing against the cheese version as the original
    source.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the Mahosadha Jātaka episode, a woman takes her child to the future Buddha’s
    tank, bathes the child, and enters the water to bathe herself; a Yakshiṇī sees
    the child and wants to eat it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Yakshiṇī takes the form of a woman, asks to nurse the child, carries it
    off, and claims the child as her own when the mother pursues her.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The future Buddha hears the dispute at his Judgment Hall, draws a line on
    the ground, instructs the Yakshiṇī to hold the child’s arms and the mother to
    hold its legs, and says the child will belong to whoever drags him over the line.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: When the two women pull the child, the mother sees the child suffer, grieves
    deeply, lets him go, and stands weeping.
  category: action
  evidence_refs:
  - ev:11
