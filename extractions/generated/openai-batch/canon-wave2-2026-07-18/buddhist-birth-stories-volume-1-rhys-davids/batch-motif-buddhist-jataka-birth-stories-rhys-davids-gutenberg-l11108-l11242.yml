canonical_text:
  quote: Evil communications corrupt good manners.
  summary: In the frame story, a monk ordained under the Teacher is drawn by another
    monk to eat food connected with Devadatta and is rebuked. The Teacher tells a
    past tale in which a gentle royal elephant hears robbers speak of violence, becomes
    violent, and kills keepers. The Bodisat diagnoses the cause as bad overheard speech
    and restores the elephant by having holy men speak righteousness nearby.
  language: English
  quote_policy: quoted
