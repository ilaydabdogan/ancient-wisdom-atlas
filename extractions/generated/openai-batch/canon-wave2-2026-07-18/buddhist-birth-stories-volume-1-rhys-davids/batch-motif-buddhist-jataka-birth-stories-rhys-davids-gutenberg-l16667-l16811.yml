canonical_text:
  quote: O house-builder! I have seen (thee). Again a house thou canst not build for
    me.
  summary: The passage explains Nirvāna as the cessation of craving and the eventual
    non-renewal of consciousness after bodily death. It presents verses in which a
    speaker, after many births, finds the house-builder, breaks the rafters and central
    support of the house, and reaches the extinction of evil desire. The notes compare
    this house figure with passages in Manu, the Lalita Vistara, and the Ādi Granth,
    and also mention relic-legends, a twin-miracle, and an alternate miracle account
    involving a jewelled terrace in the sky.
  language: English
  quote_policy: quoted
