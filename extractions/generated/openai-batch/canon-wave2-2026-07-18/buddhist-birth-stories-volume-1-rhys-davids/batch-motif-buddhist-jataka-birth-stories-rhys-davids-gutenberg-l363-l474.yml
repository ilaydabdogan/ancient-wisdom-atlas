canonical_text:
  quote: ''
  summary: 'The passage introduces the Jātaka Book as a Buddhist collection of old
    stories framed by commentary and, according to orthodox belief, by the Buddha’s
    recollection of previous births. It describes traditional transmission claims,
    questions their historical certainty, notes alleged resemblances and borrowing
    between Buddhist and Western stories, explains the translator’s literal method,
    and begins the Sīha-camma Jātaka: under King Brahma-datta in Benāres the future
    Buddha is a peasant farmer, while a hawker disguises his ass in a lion’s skin
    and lets it graze in rice and barley fields, causing watchmen to avoid it because
    they mistake it for a lion.'
  language: English
  quote_policy: summarized
