canonical_text:
  quote: ''
  summary: A crane deceives fish in a drying pond by promising to carry them to a
    lotus-covered pond, but instead eats them at a Varaṇa-tree. A crab suspects the
    crane, grips its neck during transport, forces it to put him down at the pond,
    and kills it. A tree genius praises the outcome with a moral verse, and the Teacher
    identifies the past-life figures with present figures. The excerpt then begins
    the Nanda Jātaka frame about a monk under Sāriputta whose conduct changes during
    travel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The crane describes the original pond as having very little water and food
    under great heat, and offers to carry the fish in his beak to a large lotus-covered
    pond.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fish initially voice distrust, saying a crane taking thought for fish
    is unheard of and suspecting that he aims to eat them one after another.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fish send a large one-eyed fish as a tester; the crane shows him the other
    pond and returns him, and his report persuades the fish to go.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The crane takes the old purblind fish to a Varaṇa-tree, kills it with his
    beak, eats its flesh, throws away its bones, and repeats this with all the fish.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the fish are gone, a crab remains; the crane invites the crab with the
    same claim of transport to the large pond.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The crab privately reasons that the crane may not have released the fish and
    plans to cut the crane's throat if he is not put into the pond.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The crab proposes holding the crane around the neck with his claws, and the
    crane agrees without perceiving that the crab is trying to outwit him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: While carrying the crab, the crane shows him the pond but then turns toward
    the Varaṇa-tree and points out the heap of fish-bones before saying he will devour
    the crab.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The crab tightens his grip on the crane's neck, the crane begs for life, and
    after the crane places the crab at the pond's edge the crab cuts through the crane's
    neck before entering the water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Genius living in the Varaṇa-tree observes the affair, applauds, and recites
    a verse saying that a clever villain will not prosper by villainy.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Teacher says that the present man had been outwitted before in the same
    way and identifies the crane with the Jetavana robe-maker, the crab with the country
    robe-maker, and the tree genius with himself.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The next story begins at Jetavana with a monk under Sāriputta who is meek
    and devoted at first, becomes proud and disobedient during a tour in south Magadha,
    and becomes as before when back at Jetavana.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
