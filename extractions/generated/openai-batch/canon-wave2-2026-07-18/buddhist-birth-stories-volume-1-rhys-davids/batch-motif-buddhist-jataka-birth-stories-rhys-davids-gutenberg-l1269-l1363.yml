  summary: The passage argues that the Christian romance of Barlaam and Joasaph derives
    from the life of the Buddha and that Joasaph or Josaphat is a corruption of Bodisat.
    It describes the romance’s translation and popularity, then explains Christian
    canonization practices and how Barlaam and Josaphat entered Western martyrologies,
    while the Greek Church manual names only Iosaph, son of Abenēr, king of India.
  language: English
