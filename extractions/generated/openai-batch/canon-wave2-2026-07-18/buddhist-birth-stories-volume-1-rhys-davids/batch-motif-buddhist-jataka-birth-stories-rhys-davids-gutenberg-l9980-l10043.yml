canonical_text:
  quote: ''
  summary: 'At Jetavana, the Master addresses a foul-mouthed monk who admits he is
    abusive and will not take admonition. The Master tells a former-life story: the
    Bodisat was a stag living in a forest herd. His sister-roe Kharādiyā entrusted
    her son to him to learn the devices of deer, but the nephew failed to attend and
    ignored seven admonitions. The nephew deer was caught in a snare, the Bodisat
    refused further instruction after the seventh transgression, and a hunter killed
    the deer and took his flesh. The Master then identifies the nephew deer with the
    abusive monk, the sister with Uppala-vaṇṇā, and the admonishing deer with himself.'
  language: English
  quote_policy: summarized
