canonical_text:
  quote: Anger he conquers by calmness, / And by goodness the wicked;
  summary: Two righteous kings meet in a narrow cart-track where both chariots cannot
    pass. Their charioteers compare rank, power, wealth, and lineage, find them equal,
    and then compare their rulers' righteousness. The king of Benāres is judged superior
    because he answers anger with calmness, evil with goodness, stinginess with gifts,
    and lies with truth. Mallika yields the road, receives exhortation, and both kings
    later practice charity and go to heaven. The editor comments that the tale teaches
    that goodness is the true measure of greatness and links the verse to the Dhammapada
    and the Mahābhārata.
  language: English
  quote_policy: quoted
