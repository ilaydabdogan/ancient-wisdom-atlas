canonical_text:
  quote: ''
  summary: After viewing Rāhula and Rāhula's sleeping mother without waking them,
    the Bodisat departs the palace on Kanthaka with Channa. Angels aid the silent
    exit and open the city gate. Māra tries to stop him by promising universal sovereignty;
    the Bodisat rejects kingship for Buddhahood. The earth turns to let him look back
    at the city, and divine and superhuman beings honor his departure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bodisat goes to the apartments of Rāhula's mother and opens her chamber
    door after sending Channa on an errand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A lamp fed with sweet-smelling oil burns dimly in the inner chamber.
  category: object
  evidence_refs:
