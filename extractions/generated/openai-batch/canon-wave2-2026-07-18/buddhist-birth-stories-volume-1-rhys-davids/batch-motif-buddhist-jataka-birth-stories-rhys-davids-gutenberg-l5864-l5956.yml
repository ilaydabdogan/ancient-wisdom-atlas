    resting on her son's head.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Bodisat decides not to lift her hand because she might wake and prevent
    his departure; he resolves to see his son after becoming a Buddha and leaves the
    palace.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: A narratorial note says a Jātaka commentary's statement that Rāhula was seven
