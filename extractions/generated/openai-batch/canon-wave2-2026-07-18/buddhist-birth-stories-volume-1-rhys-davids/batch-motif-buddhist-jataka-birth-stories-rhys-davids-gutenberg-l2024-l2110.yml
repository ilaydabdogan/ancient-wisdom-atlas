canonical_text:
  quote: ''
  summary: 'The passage discusses sources related to Indian story collections and
    then explains the structure of Jātaka stories: an introductory present story,
    a birth story of the past, and a conclusion in which the Buddha identifies personages
    across the two stories. It cautions that this identification should not be understood
    as transmigration of souls, but as continuity of character and karma across successive
    Bodisats. It also describes verses spoken by the Buddha or Bodisat within these
    story structures.'
  language: English
  quote_policy: summarized
