canonical_text:
  quote: ''
  summary: A horse refuses to enter water at a ford. The Bodisat investigates, learns
    that a hack had just been watered there, infers the horse's vanity, and orders
    it taken to another ford. The horse is then bathed and fed. The king honors the
    Bodisat for understanding even an animal's motive, and the Master identifies the
    past figures with present ones.
