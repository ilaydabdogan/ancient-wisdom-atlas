canonical_text:
  quote: ''
  summary: 'A Lady privately examines a young nun and establishes that her pregnancy
    began before she entered the religious life; the Elder publicly declares her innocent.
    The nun bears a son, Kassapa, who is taken into royal care, becomes a monk, gains
    pre-eminence in eloquence, and attains Arahatship, while his mother reaches Nirvana.
    The monks praise the Buddha as the compassionate refuge who saved both mother
    and son, and the Buddha says he had been their refuge in a former birth. The former-birth
    story begins: the Bodisat is born as a splendid golden deer, the King of the Banyan
    Deer, near another golden deer, the Monkey Deer. A hunting king’s subjects trap
    deer in an enclosed park for the king’s use; the king spares the two golden deer
    but continues killing other deer. The herd reports this to the Bodisat, who calls
    the Monkey Deer.'
  language: English
  quote_policy: summarized
literal_observations:
