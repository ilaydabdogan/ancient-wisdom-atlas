  text: The Elder tells the assembly that the young nun is innocent, after which she
    bows in gratitude and returns to the nunnery with the other nuns.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young nun gives birth to a son described as strong in spirit and as the
    result of a wish she had made at the feet of Padumuttara the Buddha.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A king hears the child’s cry near the nunnery, decides that nuns should not
    be hindered by child care, and has the child raised by women of his harem as a
    prince named Kassapa.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kassapa enters the noviciate at age seven, later receives full orders, becomes
    eminent in eloquence, and attains Arahatship; his mother obtains spiritual insight
    and reaches Nirvana.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The brethren say that Devadatta nearly ruined Kassapa and his mother, while
    the Buddha, described as compassionate and forbearing, became the means of salvation
    to both.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Buddha says that he has not only now been a source of salvation and refuge
