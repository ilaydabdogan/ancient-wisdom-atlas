comparison_claims:
- id: claim:1
  claim: The Indian story of the pig and oxen is presented as substantially the same
    as a Hebrew version by Berachia ben Natronai, with two donkeys replacing two oxen.
  claim_level: same_motif
  target: Unpublished Hebrew book by Berachia ben Natronai
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports the comparison secondhand and does not quote the
    Hebrew version.
- id: claim:2
  claim: The falcon-and-cock fable is treated as analogous to the Indian animal story
    because it contrasts service to humans with the danger of becoming food.
  claim_level: same_function
  target: Falcon and cock fable in Anvar i Suhaili, Livre des Lumières, Cabinet des
    Fées, Bidpai et Lokman, and La Fontaine
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The note calls the story analogous, not identical; the animal characters
    and plot details differ.
- id: claim:3
  claim: The calf-and-draught-ox fable parallels the same didactic pattern in which
    an apparently favored animal is led to sacrifice while the laboring ox is spared.
  claim_level: same_function
  target: Aesop-type calf and draught ox fable
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage frames it as one of the so-called Aesop’s Fables and gives
    only a brief summary.
- id: claim:4
  claim: Jātaka No. 286 is identified as the same story in nearly the same words,
    with different naming and verse count.
  claim_level: same_motif
  target: Jātaka No. 286
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The note mentions differences in the pig’s name, number of verses,
    and possible meaning of a location term.
- id: claim:5
  claim: A related tale occurs with variations in the Dhammapada commentary, though
    its introductory story differs.
  claim_level: same_motif
  target: Dhammapada commentary on verse 30
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not specify the variations.
- id: claim:6
  claim: The Sakka-and-Titans story is described as a Buddhist modification of current
    legends that reverses the lesson by making victory depend on kindness to animals
    rather than force.
  claim_level: same_motif
  target: Current legends about Sakka conquering the Titans
  evidence_refs:
  - ev:15
  counter_evidence_refs: []
  confidence: low
  limitations: The earlier forms of the current legends are not identified or summarized
    in this passage.
- id: claim:7
  claim: The owl-crow feud is linked both to Jātaka No. 270 and to Book III of the
    Pañca Tantra, where the note says the main story is founded on the feud.
  claim_level: same_motif
  target: Jātaka No. 270 and Book III of the Pañca Tantra
  evidence_refs:
  - ev:16
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states the literary relationship but does not recount the
    detailed Jātaka No. 270 or Pañca Tantra narratives.
