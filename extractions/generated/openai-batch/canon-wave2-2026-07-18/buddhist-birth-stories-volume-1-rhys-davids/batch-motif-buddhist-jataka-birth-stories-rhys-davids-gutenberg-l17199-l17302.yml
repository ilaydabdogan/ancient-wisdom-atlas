candidate_motifs:
- id: motif:1
  label: animal refusal reveals a sacred demand
  taxonomy_refs: []
  basis: The elephant’s refusal of food is interpreted as a desire for a Dāgaba, prompting
    the king to build the temple.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage is a footnote summary rather than a full tale, so the broader
    narrative function is not given.
- id: motif:2
  label: conversion discourse at tale ending
  taxonomy_refs:
  - wisdom
  basis: The commentator states that the Four Truths discourse belongs at the end
    of every Jātaka and is noted when blessed to a conversion.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: This is an exegetical convention, not a narrative episode in the passage.
- id: motif:3
  label: teacher enters other realms to instruct deluded beings
  taxonomy_refs:
  - ascent
