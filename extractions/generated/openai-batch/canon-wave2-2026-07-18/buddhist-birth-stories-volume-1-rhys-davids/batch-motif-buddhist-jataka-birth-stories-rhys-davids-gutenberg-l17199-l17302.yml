canonical_text:
  quote: ''
  summary: 'A series of scholarly footnotes discusses Jātaka-related legends and parallels:
    an elephant prompting a king to build a Dāgaba, the Jātaka convention of ending
    with a Four Truths discourse, bad monks connected with Vinaya rules, a rainy-season
    festival and legends of the Buddha teaching angels and descending to hell, intelligent
    but non-speaking animals, comparative animal fables about food and slaughter,
    a Hall of Piety inscription under a tree, Sakka defeating Titans through kindness
    to animals, and the owl-crow feud in Jātaka and Pañca Tantra tradition.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A king sends Mahinda to learn why the state elephant refused food; Mahinda
    discovers that the elephant wants a Dāgaba built, and the king has the temple
    built at once.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentator says that a discourse on the Four Truths is to be understood
    at the end of every Jātaka, though it is mentioned only when connected with a
    conversion in the introductory story.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The “Six” are described as six bad monks in Buddhist legend whose deeds and
    words occasioned many Vinaya rules for the Order.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A December festival is described as celebrating the close of WAS, the rainy-season
    residence during which members of the Order had to remain in one place.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Buddha is said to have spent WAS among angels to teach them, and a later
    form of the legend says he descended into hell for a similar purpose.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The old woman’s “Blackie” could understand what was said to him and communicate
    his own meaning, but could not speak.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The note explains the pig-name Muṇika by reference to meat cut into small
    pieces and preserves the joke in translation.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: The note says the Indian story reached Europe independently of the Kalilag
    and Dimnag and Barlaam and Josaphat literatures, and that a Hebrew version has
    two donkeys instead of two oxen.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: In an analogous animal fable, a falcon contrasts his service to humans with
    a cock’s attempts to escape, and the cock replies that he has never seen a falcon
    brought to table or frying in a pan.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: In an Aesop-type fable, a calf laughs at a draught ox; later the ox rests
    during a feast while the calf is led to sacrifice.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Jātaka No. 286 is described as the same story in nearly the same words, with
    the pig named Sālūha and with three verses instead of one.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: A related tale is said to appear, with variations and a different introductory
    story, in the commentary on verse 30 of the Dhammapada.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Bodisat puts a stone seat under a tree outside so that people entering
    can read an inscription identifying the place as the Hall of Piety.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Well-born is described as the Bodisat’s niece and servant, and as expecting
    to share in the merit of his work.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: Sakka is said to conquer the Titans not by might but through kindness to animals.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: An election causes a lasting feud between the owl and the crow; the feud is
    treated at length in Jātaka No. 270, and Book III of the Pañca Tantra is said
    to be founded on it.
  category: sequence
  evidence_refs:
  - ev:16
