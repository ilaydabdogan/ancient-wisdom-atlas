  - wisdom
  basis: The Buddha is said to go among angels for their instruction and, in a later
    legend, to descend into hell for a similar purpose.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The hell descent is explicitly identified as a later form of the legend;
    the passage does not narrate the full descent.
- id: motif:4
  label: intelligent animal communicates without speech
  taxonomy_refs: []
  basis: Blackie understands human speech and can communicate meaning, though he cannot
