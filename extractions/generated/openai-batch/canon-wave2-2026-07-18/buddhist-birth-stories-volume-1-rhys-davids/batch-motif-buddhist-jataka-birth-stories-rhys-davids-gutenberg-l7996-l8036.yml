canonical_text:
  quote: ''
  summary: A Bodisat, identified later as a caravan leader, directs digging for water.
    When a rock causes the workers to despair, he detects water beneath it and instructs
    a page to strike the stone. The rock splits, water rises, and the caravan survives
    and prospers. The Buddha then states a verse on firm resolve and continued effort,
    teaches the Four Truths, and identifies the past figures with present members
    of his community and himself.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hoe is brought, a spot is dug to sixty cubits, the diggers' spade strikes
    a rock, and the group gives up in despair.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bodisat thinks water must be under the rock, descends into the well, tests
    the stone by sound, and hears water gurgling beneath it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bodisat tells his page that if he gives up they will all be lost, and
    instructs him to take an iron hammer into the pit and strike the rock.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The page obeys with determination, strikes the stone, and the rock splits
    in two and falls below, no longer blocking the stream.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Water rises in the well to the height of a palm-tree; the group drinks and
    bathes, cooks rice, eats, and feeds the oxen.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At sunset the group puts up a flag by the well, goes to the appointed place,
    sells merchandise at double and treble profit, returns home, lives to old age,
    and passes away according to deeds.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Bodisat gives gifts, performs other virtuous acts, and passes away according
    to his deeds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Buddha's verse says that men of firm resolve dug into sand until they
    found drink, and that the wise, strong through continued effort, find Rest if
    they do not weary.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the discourse, the Buddha declares the Four Truths, and the despairing
    priest is established in Arahatship, identified parenthetically with Nirvāna.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Buddha identifies the past page with the present brother without perseverance,
    the other men with the attendants on the Buddha, and the caravan leader with himself.
  category: relationship
  evidence_refs:
  - ev:7
