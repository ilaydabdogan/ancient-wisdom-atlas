  summary: The passage gives a historical argument for the antiquity of the Jātaka
    or Birth Stories. It describes the Council of Vesāli, a division in the Buddhist
    Order, the Dīpavaṃsa accusation that the Great Council altered scriptures and
    set aside part of the Jātaka, and archaeological evidence from Buddhist relief
    carvings at Sānchi, Amaravatī, and Bharhut showing Jātaka scenes around relic
    shrines.
