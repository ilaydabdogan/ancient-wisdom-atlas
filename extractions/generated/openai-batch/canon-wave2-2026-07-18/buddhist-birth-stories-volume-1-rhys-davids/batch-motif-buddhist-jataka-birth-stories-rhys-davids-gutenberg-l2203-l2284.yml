canonical_text:
  quote: ''
  summary: 'The passage summarizes Rhys Davids’s view of how the Jātaka Book arose:
    earlier fables, parables, and stories ascribed to the Buddha were given sacred
    status by identifying their best characters with the Buddha in previous births;
    these materials were collected, transmitted, translated, and preserved. It also
    describes the Jātakas as moral teaching through parable, emphasizing inherited
    character, karma, the likeness between humans and animals, and kindness toward
    animals.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author says the probable rise of the Jātaka Book lay in Indian Buddhists
    of the third or fourth century B.C. repeating fables, parables, and stories ascribed
    to the Buddha and giving them sacredness by identifying the best character in
    each with the Buddha in a previous birth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the word “Jātaka” was used for stories sanctified by this
    identification and that its earliest known use is in inscriptions on the Buddhist
    Tope at Bhārhut.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the accepted Jātakas were likely brought together early into
    a collection, supported by traditions concerning a Jātaka Book at the Councils
    of Vesāli and mentions in the Aŋguttara Nikāya and the Saddharma Puṇḍarīka.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the Verses are probably to be ascribed to the compiler of
    an early collection and in some cases are later than the Stories.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says traditions about when and why some Jātakas were uttered by
    the Buddha gave rise to early Introductory Stories, which later generated imitations
    and were handed down as commentary before entering the present collection in Ceylon.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage contrasts the “Stories of the Past” as fresh and simple with the
    “Stories of the Present” and the long Introduction, which it compares to medieval
    Legends of the Saints.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says the Jātakas were carried to Ceylon in Pāli when Buddhism
    was first introduced there, translated into and preserved in Sinhalese except
    for the verses, and later compiled in the fifth century A.D. into the Pāli Jātaka
    Book.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says there is no reasonable doubt that the Buddha taught by parables
    and that he may have invented fables or tales of previous birth to explain conduct
    failures among monks or draw morals from contemporary events.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The passage says Jātaka teaching inculcates two distinctive lessons: the
    powerful influence of inherited character and the essential likeness between humans
    and other animals.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage connects the likeness of humans and animals with sympathy toward
