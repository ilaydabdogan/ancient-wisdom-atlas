candidate_motifs:
- id: motif:1
  label: Four omens leading toward renunciation
  taxonomy_refs:
  - departure
  - wisdom
  basis: The future Buddha encounters old age, sickness, death, and a renunciant;
    these sights disturb him and lead him to think of renouncing the world.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The taxonomy labels are broad; the passage itself specifically names the
    signs as the Omens.
- id: motif:2
  label: Royal pleasure enclosure delaying renunciation
  taxonomy_refs:
  - departure
  basis: The king provides seasonal mansions and pleasures, then orders entertainments
    and guards to prevent Siddhattha from forsaking the world.
  evidence_refs:
  - ev:2
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage presents these measures as attempts to maintain pleasure and
    prevent renunciation, not as imprisonment in a fully explicit legal sense.
- id: motif:3
  label: Public proof of princely martial skill
  taxonomy_refs:
  - royal_legitimacy
  basis: After kin criticize Siddhattha as untrained and pleasure-loving, he demonstrates
    unmatched archery skill before the people and ends their doubt.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage proves competence before kin, but it does not explicitly frame
    the display as accession or kingship legitimation.
- id: motif:4
  label: Divine preparation for a sacred departure
  taxonomy_refs:
  - departure
  - mystical_quest
  basis: Sakka recognizes the time for Siddhattha's final adornment and announces
    that he will carry out the Great Renunciation at midnight, sending Vissakamma
    to adorn him.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The passage states the coming Great Renunciation and future Enlightenment,
    but the broader quest is only implied within this excerpt.
- id: motif:5
  label: Divine beings stage transformative signs
  taxonomy_refs:
  - wisdom
  basis: The gods deliberately show Siddhattha the Omens when Enlightenment is near,
    using represented figures to prompt recognition of decay, illness, death, and
    renunciation.
  evidence_refs:
  - ev:7
  - ev:10
  - ev:11
  confidence: high
  cautions: The extracted motif is limited to this passage's divine staging of signs
    and does not assert a wider cross-cultural pattern without further evidence.
comparison_claims:
- id: claim:1
  claim: 'The passage reports two versions of the same four-omen sequence: in the
    main narration the omens are encountered across repeated outings with royal countermeasures
    after several of them, while the Dīgha Nikāya reciters are said to place all four
    Omens on the same day before the pleasure-ground visit.'
  claim_level: same_motif
  target: Dīgha Nikāya reciters' version of the four Omens
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: high
  limitations: This comparison is based only on the passage's own report of the Dīgha
    Nikāya variant; no external Dīgha Nikāya text is consulted here.
