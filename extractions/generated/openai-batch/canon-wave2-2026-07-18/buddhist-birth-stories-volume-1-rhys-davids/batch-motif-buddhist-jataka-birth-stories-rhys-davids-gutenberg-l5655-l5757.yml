canonical_text:
  quote: ''
  summary: The passage describes Siddhattha's royal pleasures, a public demonstration
    of his archery skill, and a sequence of outings in which divine beings show him
    the omens of old age, sickness, death, and renunciation. The king tries to prevent
    his renunciation with entertainments and guards. A variant attributed to Dīgha
    Nikāya reciters says all four omens were seen on the same day. The passage ends
    with Sakka sending Vissakamma to adorn Siddhattha before the Great Renunciation
    at midnight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rāja went to see a miracle and paid homage to his son, calling it the
    second homage paid to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Bodisat grew to manhood, and the king had three seasonal mansions made
    for him: one nine stories high, one seven stories high, and one five stories high.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bodisat lived amid great majesty with forty thousand dancing girls, self-playing
    musical instruments, and the mother of Rāhula as his principal queen.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the public assembly, the clansmen said Siddhattha was devoted to pleasure,
    learned nothing, and would be unprepared if war broke out.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Bodisat said there was no art he needed to learn and arranged to show
    his skill to his kindred after seven days.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before the people, the Bodisat showed twelvefold skill in archery and was
    described as unsurpassed by other masters of the bow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The charioteer decorated the chariot, harnessed four white Sindhi state horses
    to it, and the Bodisat rode toward the garden.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Angels decided that Siddhattha's time to attain Enlightenment was near and
    made a son of the gods represent an aged man visible only to the future Buddha
    and his charioteer.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the Bodisat learned about the aged man, he said life was shameful because
    every living being decays, and he returned to the palace with an agitated heart.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The king was told that his son had seen an old man and would forsake the world;
    he ordered concerts and plays and increased the guards to keep him in pleasure.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: On later outings, the future Buddha saw a sick man and a dead man represented
    by the gods, made the same inquiry as before, and returned to the palace agitated
    each time.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: After the sick-man and dead-man omens, the king repeated his previous orders
    and increased the guards at greater distances around the palace.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: On another outing, the future Buddha saw one who had abandoned the world,
    carefully and decently clad.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The charioteer, though not knowing mendicants by experience, was inspired
    by the gods to identify the figure as a mendicant friar and describe the advantages
    of renouncing the world.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: After seeing the renunciant, the future Buddha cherished the thought of renouncing
    the world and continued to his pleasure ground.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: The repeaters of the Dīgha Nikāya are said to give a variant in which he saw
    all four Omens on the same day before going to the pleasure ground.
  category: other
  evidence_refs:
  - ev:12
- id: obs:17
  text: At the pleasure ground he enjoyed himself, bathed in a beautiful lake, sat
    on the royal resting stone at sunset, and attendants brought garments, ornaments,
    garlands, perfumes, and ointments.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:18
  text: Sakka's throne became warm; he perceived that Siddhattha would carry out the
    Great Renunciation at midnight and sent Vissakamma to adorn him with heavenly
    array.
  category: action
  evidence_refs:
  - ev:14
