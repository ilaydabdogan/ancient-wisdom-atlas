canonical_text:
  quote: ''
  summary: The passage concludes a judgment story in which the future Buddha identifies
    the true mother of a child and exposes a Yakshiṇī who intended to eat the child.
    It then notes a similar judgment attributed to Solomon in the Hebrew Book of Kings.
    The next tale, DADHI-VĀHANA JĀTAKA, begins with Sakka giving magical objects to
    hermits, followed by a wild boar and a shipwrecked man using a magical gem that
    grants flight.
  language: English
  quote_policy: summarized
