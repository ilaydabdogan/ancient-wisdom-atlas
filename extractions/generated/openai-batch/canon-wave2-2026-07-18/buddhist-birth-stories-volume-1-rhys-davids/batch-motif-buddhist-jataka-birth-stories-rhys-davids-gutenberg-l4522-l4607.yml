canonical_text:
  quote: ''
  summary: The passage catalogs successive Buddhas and Bodhisatta encounters in a
    distant epoch. It describes ordination and rebirth in the Brahma heavens, Mangala
    Buddha’s death with darkness over ten thousand worlds, and subsequent Buddhas
    Sumana, Revata, Sobhita, and Anomadassin. In several entries the Bodhisatta is
    born in a prior identity, hears of or hears a Buddha, makes devotional offerings
    or gifts, is established in the Three Refuges in some cases, and receives a prediction
    of future Buddhahood. Each Buddha entry also lists city, parents, disciples, servitor,
    female disciples, Bodhi-tree, bodily height, and lifespan details.
  language: English
  quote_policy: summarized
