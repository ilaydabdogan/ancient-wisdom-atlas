canonical_text:
  quote: ''
  summary: 'The passage narrates the Buddha’s return among his royal kin: the king
    objects to alms-begging, the Buddha identifies begging with the lineage of Buddhas,
    and the king gains progressive spiritual attainments. The king hosts the Buddha,
    the mother of Rāhula reveres him and is described as imitating his ascetic practices,
    Nanda is drawn into the Order during his wedding festivities, and Rāhula asks
    for a paternal inheritance; the Buddha resolves to give him spiritual wealth and
    instructs Sāriputta to receive him into the Order.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king is agitated by the Buddha’s begging for food and asks why he puts
    the royal family to shame by begging.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king appeals to royal descent from the Great Elected and says no chief
    in that line has begged daily food.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Buddha distinguishes the king’s royal succession from his own succession
    of Buddhas, saying many Buddhas begged and lived on alms.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Buddha recites verses urging holy life and virtue, after which the king
    attains the Fruit of the First and Second Paths.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: After hearing the story of the Birth as the Keeper of Righteousness, the king
    attains the Fruit of the Third Path; at death under the white canopy of state,
    he attains Arahatship.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After realizing the Fruit of Conversion, the king takes the Buddha’s bowl,
    conducts the Buddha and his retinue to the palace, and serves them food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The women of the household come to do obeisance to the Buddha, except the
    mother of Rāhula, who remains behind and says he may come to her if she has value
    in his eyes.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The Buddha goes with his two chief disciples to the apartments of the king’s
    daughter and says she should not be rebuked however she welcomes him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The king’s daughter comes quickly, holds the Buddha by the ankles, lays her
    head on his feet, and performs obeisance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The king reports that his daughter adopted yellow dress, one meal a day, sleeping
    on a floor mat, and abstention from garlands and unguents after hearing of the
    Buddha’s practices.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Buddha says the king’s daughter had formerly watched over herself while
    wandering among mountains without a protector, and he tells the story of his Birth
    as the Moonsprite.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: During combined festivals for Nanda’s coronation, housewarming, and marriage,
    the Buddha visits Nanda, gives him his bowl to carry, and departs with the aim
    of making him abandon the world.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Janapada Kalyāṇī sees Nanda going away and calls after him; Nanda follows
    the Buddha to the Wihāra and is received into the Order unwillingly.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The mother of Rāhula adorns the boy and sends him to ask the Buddha, identified
    as his father, for his inheritance and treasure.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Rāhula approaches the Buddha, speaks of the happiness of his shadow, and follows
    him asking for his inheritance; neither the Buddha nor the disciples stop him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The Buddha reflects that material wealth perishes and brings vexation, and
    resolves to give Rāhula the sevenfold wealth of the Arahats obtained under the
    Bo-tree as a spiritual inheritance.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: The Buddha tells Sāriputta to receive Rāhula into the Order.
  category: speech
  evidence_refs:
  - ev:9
