canonical_text:
  quote: ''
  summary: A king accepts the Bodisat dog's exhortation, grants security to all living
    creatures, supplies royal food for dogs, performs charity and good deeds, and
    is reborn in the world of the gods. The Dog's teaching lasts for a long time;
    the Bodisat dies according to his deeds. The Teacher identifies the king as Ānanda,
    the others as the Buddha's attendants, and the Dog as himself in a former birth.
