canonical_text:
  quote: ''
  summary: The passage recounts the Bodisat’s birth companions, heavenly rejoicing
    and prophecy, Kāḷa Devala’s recognition and lament, Nālaka’s renunciation and
    later attainment, and the fifth-day naming and sign-recognition rite.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the time of the Bodisat’s birth in the Lumbini grove, several named persons,
    an animal, the Bo-tree, and treasure vases also came into being and are called
    the Sahajātā, or Connatal Ones.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: People from both towns took the Bodisat to Kapilavastu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Angels in the Tāvatiŋsa heaven rejoiced and said that a son born to King Suddhodana
    would become a Buddha while seated under the Bo-tree.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ascetic Kāḷa Devala was resting in the Tāvatiŋsa heaven, saw the rejoicing
    angels, and asked them why they were glad.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The angels told Kāḷa Devala that Suddhodana’s son would become a Buddha and
    found a Kingdom of Righteousness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kāḷa Devala came down from the angel-world, entered the king’s house, and
    asked to see the newborn son.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the child was brought to salute Kāḷa Devala, the future Buddha turned
    his feet and placed them on the ascetic’s matted hair.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kāḷa Devala did homage to the Bodisat, and the king also did homage to his
    own son.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Kāḷa Devala examined the marks on the Bodisat’s body, perceived that he would
    become a Buddha, smiled, then wept because he would not live to see that event.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When people asked whether misfortune would befall the child, Kāḷa Devala replied
    that no misfortune was in him and that he would assuredly become a Buddha.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Kāḷa Devala instructed his nephew Nālaka to give up the world because the
    newborn would become a Buddha in thirty-five years, and Nālaka immediately adopted
    ascetic clothing and went to the Himālaya mountains.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the Tathāgata attained complete Enlightenment, Nālaka heard the way
    of salvation, returned to the Himālayas, reached Arahatship, and later passed
    away near a Golden Hill.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: On the fifth day, the Bodisat’s head was bathed for the naming rite; the king’s
    house was perfumed and decorated, milk-rice was prepared, and one hundred and
    eight Brāhmans were honored and asked to recognize the child’s signs.
  category: action
  evidence_refs:
  - ev:8
