canonical_text:
  quote: ''
  summary: 'The passage describes three heavenly proclamations: a coming new age accompanied
    by cosmic destruction, a future Buddha, and a future universal monarch. After
    hearing the Buddha proclamation, deities from many world-systems gather in the
    Heaven of Delight and urge the Bodisat to attain Buddhahood for the salvation
    of mankind. The Great Being then considers the proper time, place, lineage, father,
    mother, and remaining lifespan of the mother for his human advent.'
  language: English
  quote_policy: summarized
