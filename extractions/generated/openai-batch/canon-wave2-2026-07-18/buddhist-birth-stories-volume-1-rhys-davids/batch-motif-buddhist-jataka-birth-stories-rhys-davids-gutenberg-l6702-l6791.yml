canonical_text:
  quote: ''
  summary: 'The passage recounts post-awakening episodes of the Blessed One: women
    admit he was not moved by unholy desire; he spends weeks near trees, is shielded
    by Mucalinda the snake-king during a storm, and has no bodily wants. Sakka and
    Guardian Angels provide fruit, washing water, and a bowl. Merchants Tapassu and
    Bhalluka offer food, take refuge, receive hair relics, and enshrine them. The
    Buddha hesitates to teach the deep Truth until the ruler of the Brahma heavens
    begs him to proclaim it. He chooses the five mendicants near Benares as first
    recipients and sets out, meeting Upaka before arriving near them.'
  language: English
  quote_policy: summarized
