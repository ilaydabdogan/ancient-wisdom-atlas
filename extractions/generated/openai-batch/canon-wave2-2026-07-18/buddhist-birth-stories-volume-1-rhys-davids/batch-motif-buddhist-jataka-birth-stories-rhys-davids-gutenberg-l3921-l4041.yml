  summary: 'Sumedha continues investigating the conditions that bring about Buddhaship.
    He resolves to undertake the fifth through ninth perfections: Exertion, Longsuffering,
    Truth, Resolution, and Good-will. Each perfection is illustrated by a comparison
    to a natural or celestial model: the lion, the earth, Venus, a rocky mountain,
    and water.'
