  summary: The passage describes the hermit Sumedha adopting ascetic practices, attaining
    supernatural faculties, remaining absorbed in meditation while Dīpankara Buddha
    appears with cosmic signs, and later joining the people of Ramma in preparing
    a road for Dīpankara, choosing manual labor over supernatural power.
