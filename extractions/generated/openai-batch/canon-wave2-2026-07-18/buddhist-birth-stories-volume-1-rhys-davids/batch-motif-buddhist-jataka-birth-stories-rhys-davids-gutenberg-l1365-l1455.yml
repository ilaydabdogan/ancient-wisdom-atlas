canonical_text:
  quote: ''
  summary: The passage surveys claimed Western transmissions and parallels of Buddhist
    Birth Stories. It discusses the identification of St. Josaphat with Gotama the
    Buddha, alleged derivations of Sinbad, Arabian Nights tales, La Fontaine, Shakespearean
    story elements, and other European tales from Buddhist or Indian sources, and
    then considers possible explanations for parallels between Buddhist Birth Stories,
    Greek fables in Babrius and Phaedrus, and the Judgment of Solomon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some writers who translated or composed works based on the Josaphat story
    noted that Josaphat had been canonized, and the romance hero is usually called
    St. Josaphat in the titles of those works.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that Professor Liebrecht identified Josaphat with the
    Buddha, and that Professor Max Müller pointed out that Gotama the Buddha, under
    the name St. Josaphat, was officially recognized, honoured, and worshipped in
    Catholic Christendom as a Christian saint.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author says he has followed the Western history of the Buddhist Book of
    Birth Stories along only two channels and that the inquiry is not exhausted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that a learned Italian had proved that many stories about
    Sinbad the Sailor derive from the same treasury of stories, and that a similar
    remark applies to other Arabian Nights tales.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: La Fontaine is said to acknowledge indebtedness to French versions of Kalilah
    and Dimnah, while Benfey and others traced the same stories or ideas to Poggio,
    Boccaccio, Gower, Chaucer, Spenser, and other later writers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that the three caskets and the pound of flesh in The Merchant
