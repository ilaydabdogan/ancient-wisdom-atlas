  summary: The passage argues that the Jātakas are valuable for studying folklore,
    social customs, and popular beliefs, especially because they are presented as
    comparatively uncorrupted evidence of early Aryan social life. It contrasts this
    value with the limitations of ancient elite literature and modern travellers’
    reports, then acknowledges scholarly assistance from Childers, Carpenter, and
    Fausböll.
