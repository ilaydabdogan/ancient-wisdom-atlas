  quote: "“Verily there is nothing worse in the world than this lust of taste!”"
  summary: A deer or antelope enters a hall, is shut in, and panics at the sight of
    men. The king interprets the animal’s danger as caused by greed for taste, recites
    a verse about greed and Sanjaya’s control over the deer, then releases the animal
    to the forest. The Master closes the discourse by identifying the past figures
    with the present monk, slave-girl, and himself.
