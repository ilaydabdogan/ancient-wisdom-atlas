canonical_text:
  quote: "“Whene’er the load be heavy... Let them yoke ‘Blackie’ then, And he will
    drag the load!”"
  summary: In a Jātaka frame, the Buddha answers praise of his unequalled power by
    telling of a former birth as a black bull raised like a son by a poor old woman.
    The bull seeks hire to support her, drags five hundred carts across a ford when
    other bullocks fail, insists on the full agreed payment, returns exhausted, and
    is cared for by the old woman. The Buddha identifies the old woman as Uppala-vaṇṇā
    and Blackie as himself.
  language: English
  quote_policy: quoted
