canonical_text:
  quote: "“This is no righteous vengeance; this is slaughter of the weak!”"
  summary: 'The passage closes the Kurunga Antelope story by identifying past figures
    with Devadatta and the Teacher. It then tells the Kukkura Jātaka: the Bodisat
    is born as a dog living in a cemetery, protects other dogs from an unjust royal
    order of slaughter, exposes the palace dogs as the real culprits, and instructs
    the king in righteous conduct.'
