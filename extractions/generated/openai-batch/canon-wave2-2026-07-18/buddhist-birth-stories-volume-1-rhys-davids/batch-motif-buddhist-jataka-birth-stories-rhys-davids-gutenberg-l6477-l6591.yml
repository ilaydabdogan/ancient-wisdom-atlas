canonical_text:
  quote: ''
  summary: Siddhattha calls the Earth as witness to his former gift as Wessantara.
    The Earth answers, Māra's forces flee, and heavenly beings celebrate at the Bo-tree.
    During the night the Great Being acquires successive knowledges, realizes the
    Chain of Causation, and attains complete Enlightenment at dawn. Cosmic wonders
    follow, including quaking world-systems, blossoming trees, light in dark hells,
    sweet ocean waters, halted rivers, healed bodies, and broken bonds. He sings a
    triumph hymn about the end of rebirth and craving, reflects on past sacrifices
    across births, and remains seated seven days in the bliss of Nirvāna.
  language: English
  quote_policy: summarized
