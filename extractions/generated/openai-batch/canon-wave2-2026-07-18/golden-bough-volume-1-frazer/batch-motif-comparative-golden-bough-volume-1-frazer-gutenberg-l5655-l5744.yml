canonical_text:
  quote: ''
  summary: Frazer describes Mid-Lent customs in Italy, Spain, South Slav regions,
    Bohemia, Silesia, Eisenach, and Upper Lusatia involving the mock sawing or execution
    of an Old Woman or Death figure, followed in some cases by the carrying in of
    a decorated tree, doll, or green branch associated with Summer, May, flowers,
    or life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A custom called “sawing the Old Woman” was observed in Italy and Spain on
    the Fourth Sunday in Lent; a hideous figure representing the village’s oldest
    woman was dragged out and sawn in two amid loud noise from bells, pots, and pans.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Palermo, an old woman was drawn through the streets on a cart, mounted
    a scaffold, and mock executioners sawed at a blood-filled bladder fitted to her
    neck, after which she pretended to faint and die.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Florence, an Old Woman effigy stuffed with walnuts and dried figs was fastened
    to the top of a ladder and sawn through at Mid-Lent, causing the dried fruit to
    fall for the crowd to scramble after.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Several child or youth customs use miniature or symbolic saws: Roman urchins
    pin paper ladders on women, Neapolitan boys strike passers-by with cloth saws
    marked with gypsum, and boys at Montalto carry cane saws and jeer at old people.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Calabrian women gather at Mid-Lent and feast on figs, chestnuts, honey, and
    similar foods, calling the gathering “sawing the Old Woman.”
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Barcelona, boys run through the streets with saws, wood, and collection
    cloths, sing that they seek the oldest woman of the city to saw her in two for
    Mid-Lent, then pretend to find her, saw something in two, and burn it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: South Slav variants include Croat and Carniolan sayings that an old woman
    is being taken outside the gates or village and sawn in two at Mid-Lent; the North
    Slavonian expression for keeping Mid-Lent means “sawing the Old Wife.”
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Frazer states that in the preceding ceremonies the return of Spring, Summer,
    or Life after the expulsion of Death is implied or announced, while in the following
    ceremonies it is openly enacted.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In parts of Bohemia, an effigy of Death is buried at sunset; then girls cut
    down a young tree with a green crown, hang a woman-doll on it, decorate it with
    green, red, and white ribbons, and carry it into the village as Líto or Summer.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In Silesian villages, a figure of Death is stripped and thrown into water
    or torn up in a field; afterward boys carry a ribboned fir-tree with colored egg-shells
    and cloth pieces through the streets while collecting pennies and singing of bringing
    Summer, May, and flowers back.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: At Eisenach, young people fastened a straw-man representing Death to a wheel,
    carried it to a hilltop, set it on fire, and let the figure and wheel roll downhill;
    then they cut and decorated a tall fir-tree and set it up in the plain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In Upper Lusatia, a Death figure made of straw and rags is dressed with a
    veil from the last bride and a shirt from the house of the most recent death,
    mounted on a pole, pelted with sticks and stones, carried out of the village,
    and thrown into water or across another village’s boundary.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In Upper Lusatia, participants break green branches on the way home, and youths
    from the neighboring village may throw the Death figure back because they do not
    want Death among them.
  category: sequence
  evidence_refs:
  - ev:7
