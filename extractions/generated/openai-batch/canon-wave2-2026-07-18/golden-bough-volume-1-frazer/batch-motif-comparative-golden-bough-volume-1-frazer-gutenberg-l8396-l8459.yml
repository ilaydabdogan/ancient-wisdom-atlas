  summary: Frazer lists examples from Ecuador, Mexico, the Pawnees, West Africa, Lagos
    and Benin, the Marimos, and the Gonds in which human victims, blood, hearts, flesh,
    or ashes are used in sowing, harvest, or spring rites intended to secure crop
    fertility.
  language: English
  quote_policy: summarized
literal_observations:
