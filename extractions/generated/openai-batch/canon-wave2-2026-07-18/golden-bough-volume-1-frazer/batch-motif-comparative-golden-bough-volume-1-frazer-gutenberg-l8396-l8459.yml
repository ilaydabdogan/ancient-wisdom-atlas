  text: The Indians of Guayaquil are described as sacrificing human blood and men's
    hearts when sowing fields.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a Mexican harvest-festival, a criminal victim was crushed between two large
    stones, buried, and followed by a feast and dance.
  category: sequence
  evidence_refs:
