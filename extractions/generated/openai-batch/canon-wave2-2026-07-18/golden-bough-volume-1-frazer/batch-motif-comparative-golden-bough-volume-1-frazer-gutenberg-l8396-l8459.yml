    to the sun and was called the meeting of the stones.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Pawnees annually sacrificed a human captive in spring when sowing fields,
    believing omission would cause crop failure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Pawnee sacrifice is said to have been enjoined by the Morning Star or
    by a bird sent as its messenger.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Pawnee captive victim was dressed richly, fattened, kept ignorant of the
