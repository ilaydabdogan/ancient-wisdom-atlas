canonical_text:
  quote: ''
  summary: 'Frazer interprets spring rites in which foliage-clad human figures are
    mimically slain as rites involving representatives of the tree-spirit or vegetation
    spirit. He explains the killing as a renewal mechanism: the divine or vegetation
    spirit, weakened through its aging human embodiment or by winter decay, is killed
    in its old form so that it may revive in a younger, stronger incarnation. He links
    water rites involving the Pfingstl to rain-charms and cites examples in which
    the Wild Man is restored to life by a doctor or where Dr. Iron-Beard appears as
    a restorer figure.'
  language: English
  quote_policy: summarized
