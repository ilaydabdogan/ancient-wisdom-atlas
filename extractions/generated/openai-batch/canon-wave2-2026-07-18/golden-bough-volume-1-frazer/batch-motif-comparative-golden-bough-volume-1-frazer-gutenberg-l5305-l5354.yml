- id: obs:1
  text: The passage identifies personages slain in mimicry as representatives of the
    tree-spirit or spirit of vegetation as manifested in spring.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The actors are described as dressed in bark, leaves, and flowers and appearing
    at a seasonal time associated with vernal vegetation figures.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two slain men are said to be directly connected with May-trees, which the
    passage distinguishes as impersonal representatives of the tree-spirit, unlike
    personal figures such as the May King or Grass King.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Pfingstl is described as being drenched with water and as wading up to
    the middle into a brook; the passage classifies these acts as rain-charms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage asks why the spirit of vegetation would be killed in spring and
    answers by referring to the previously proposed explanation for killing a divine
    king or priest.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Divine life incarnate in a mortal body is described as liable to weakness,
    taint, corruption, and increasing enfeeblement as the human incarnation ages.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old representative of the god is killed so that the divine spirit may
    be conveyed to a vigorous successor or new incarnation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The killing of the god's human incarnation is described as a necessary step
    toward revival or resurrection in a better form rather than extinction of the
    divine spirit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The decay of vegetation in winter is presented as interpreted by primitive
    man as the vegetation spirit growing old and weak, requiring renovation by being
    slain and brought to life in a younger form.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Saxon and Thüringen custom, the Wild Man is shot and then brought to
    life by a doctor; in the Wurmlingen ceremony Dr. Iron-Beard is said probably to
    have had a similar role, and in another spring ceremony he pretends to restore
    a dead man to life.
  category: sequence
  evidence_refs:
  - ev:7
