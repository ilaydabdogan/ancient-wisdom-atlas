canonical_text:
  quote: ''
  summary: Frazer surveys European harvest customs in which the last sheaf or last
    standing corn is treated as the Corn-mother, Harvest-mother, Great Mother, crop-specific
    mother, Old Woman, Mother-sheaf, or Ceres. The sheaf may be cut, beaten, driven
    out, dressed as a woman, carried home, drenched, danced around, stored in a barn,
    scattered as seed, placed in a manger, or burned on a pyre with prayers for fertility.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Corn-mother is said to be present in the last handful of corn left standing
    in the field, and its cutting is described as catching, driving away, or killing
    her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the last sheaf is treated as captured, it is carried home joyfully, honored
    as a divine being, placed in the barn, and the corn-spirit is said to appear again
    at threshing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Hadeln, reapers stand around the last sheaf and beat it with sticks while
    calling that the Corn-mother is there and warning one another not to be caught
    by her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Danzig and Holstein, the last ears or last sheaf are made into a doll or
    dressed in women’s clothes and called the Corn-mother, Old Woman, or similar name;
    in Holstein the sheaf is drenched with water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Bruck in Styria, the last sheaf is shaped as a woman by the oldest married
    woman, while selected ears are made into a flower-twined wreath carried by the
    prettiest village girl.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In some Styrian villages, the Corn-mother is carried on a pole, placed at
    a harvest supper and dance, later hung in a barn, and the last man to strike at
    threshing is called the son of the Corn-mother, tied up in her, beaten, and carried
    through the village.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Styrian wreath made from the Corn-mother is later dedicated, its grain is
    rubbed out by a seven-year-old girl and scattered among young corn, and its straw
    is placed in the manger at Christmas to benefit cattle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Westerhüsen, the last corn cut is shaped as a woman with ribbons and cloth,
    fastened on a pole, waved so that it appears alive, and kept on the threshing-floor
    until threshing is finished.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Among Slavic examples and in Galicia, the last sheaf or wreath is named for
    the crop as Rye-mother, Wheat-mother, Oats-mother, Barley-mother, or similar;
    the Galician wreath is placed on a girl’s head, kept until spring, and some of
    its grain is mixed with seed-corn.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Near Auxerre, the last sheaf is made into a clothed and crowned puppet called
    Ceres, given a branch in its breast, placed at a dance, stripped and pulled apart
    by girls, burned on a pyre, and addressed in prayer for a fruitful year.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: In Upper Brittany, the last sheaf is always made in human shape; if the farmer
    is married, it is made double, with a small corn-puppet inside a larger one, and
    is called the Mother-sheaf.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: In Osnabrück, Westphalia, and Erfurt, last or heavy sheaves are called the
    Harvest-mother or Great Mother and are carried, danced with, or brought to the
    barn.
  category: sequence
  evidence_refs:
  - ev:11
