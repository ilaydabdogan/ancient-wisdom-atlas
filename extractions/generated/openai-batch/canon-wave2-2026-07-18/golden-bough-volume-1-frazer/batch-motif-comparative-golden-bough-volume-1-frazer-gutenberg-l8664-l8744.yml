canonical_text:
  quote: ''
  summary: 'Frazer argues that the Lityerses legend and European harvest customs point
    to an annual killing, actual or mimicked, of a person treated as the corn-spirit:
    a stranger, the last reaper/binder/thresher, the master, or Lityerses himself.
    He further connects Lityerses, as son of the King of Phrygia, with a conjectured
    custom of slaying divine or priestly kings or their sons as substitutes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that human beings have been killed to promote crop growth
    and that Phrygian legend and European folk-custom are used to support this conclusion
    for Phrygia and Europe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lityerses story and European harvest customs are said to indicate that
    the slain person represented the corn-spirit.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the representative of the corn-spirit was supposedly
    killed annually on the harvest-field, and it notes an analogous annual slaying
    of a representative of the tree-spirit in Europe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Passing strangers are described as being regarded as manifestations of the
    corn-spirit escaping from cut or threshed corn, and as being seized and slain.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: One version of the Phrygian legend has Lityerses' victims as persons defeated
    by him in a reaping contest; Frazer supposes that in one version they were wrapped
    in corn-sheaves and beheaded.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: European harvest customs are described as including contests to avoid being
    last, rough handling of the last reaper, and mimic killing of the person who gives
    the last threshing stroke.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage describes a belief-model in which the corn-spirit lurks in the
    standing corn, retreats before the harvesters, is expelled from the last corn,
    last sheaf, or last grain, and assumes the form of the nearest person.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'Lityerses is said to have been slain, probably as he slew others: wrapped
    in a corn-sheaf, beheaded, and cast into a river, apparently on his own land.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Modern harvest customs are said to carry out the pretence of killing as often
    on the master, farmer, or squire as on strangers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage identifies Lityerses as son of the King of Phrygia and connects
    his death conjecturally with customs of slaying divine or priestly kings, or a
    king's son in the king's stead.
  category: relationship
  evidence_refs:
  - ev:6
