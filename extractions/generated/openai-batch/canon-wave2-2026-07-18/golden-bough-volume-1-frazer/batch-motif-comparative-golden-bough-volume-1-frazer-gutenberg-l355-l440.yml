  summary: The passage summarizes rites and associated figures of Diana's grove at
    Nemi, including fertility petitions, fire rites, purification, Egeria's water,
    and the Virbius/Hippolytus legend. It then frames two questions about the priest
    of Nemi—why he had to slay his predecessor and first pluck the Golden Bough—and
    begins a comparative discussion of royal titles joined to priestly duties across
    several ancient and historical societies.
