canonical_text:
  quote: These grains of rice are the soul of the rice.
  summary: Frazer compares European harvest customs with rice-harvest rites in Borneo,
    Burma, and Java. Among the Dyaks, the rice soul is secured at harvest through
    grains caught in cloth or obtained during a ritual involving an altar, bamboos,
    a white streamer, dancing, music, and attendants; some of this rice soul is later
    planted with seed. Among the Karens, a failing field is explained as the rice
    soul being detained, and a formula summons the rice-kelah back from many places.
    In Java, selected rice ears are adorned and called the Rice-bride and Rice-bridegroom;
    a wedding feast and bridal chamber in the barn precede full housing of the harvest,
    and the pair is not to be disturbed for forty days.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: At harvest, the Dyaks of Northern Borneo hold a special feast whose object
    is to secure the soul of the rice so that the produce will not rot and decay.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In one Dyak mode, a priest catches the rice soul in the form of a few grains
    of rice in a white cloth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In another Dyak mode, a shed outside the village and a high altar with leafy
    bamboo posts and a hanging white streamer are set up for the rite.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dyak men and women dance; elders and priests seize the white streamer; an
    elder shakes the bamboos; small stones, hair bunches, and rice grains fall and
    are picked up by attendants.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The fallen rice grains are identified as the soul of the rice, and at sowing
    time some of them are planted with other seeds.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The Karens of Burma suppose that a rice-field fails to flourish when the soul
    of the rice is detained from the rice; if it cannot be called back, the crop will
    fail.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Karen formula summons the rice-kelah to the field and to the rice from
    rivers, directions, animals, river sources and mouths, distant countries, kingdoms,
    and granaries.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the rice-harvest in Java, before reaping begins, a priest or sorcerer selects
    ears of rice, ties them together, smears them with ointment, and adorns them with
    flowers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The decorated rice ears are called the Rice-bride and the Rice-bridegroom;
    their wedding feast is celebrated, and the cutting of the rice begins immediately
    afterward.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the Java rice is being brought in, a bridal chamber is partitioned in
    the barn with a new mat, a lamp, and toilet articles; sheaves represent wedding
    guests, and no one may enter the barn for forty days after the rice is housed.
  category: setting
  evidence_refs:
  - ev:5
