candidate_motifs:
- id: motif:1
  label: lament over the cut crop as death and desired return of the corn-spirit
  taxonomy_refs:
  - dying_and_returning
  - seasonal_cycle
  basis: The Egyptian first-sheaf cry is interpreted as a dirge for the corn-spirit's
    death under the sickle and a prayer for its return.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is Frazer's interpretation of the Egyptian evidence, not a direct
    statement by ancient participants.
- id: motif:2
  label: agricultural lament named for a dead or missing youth
  taxonomy_refs:
  - seasonal_cycle
  basis: Maneros, Linus/Ailinus, Bormus/Borimus, and Lityerses are all presented as
    named songs attached to harvest or vintage contexts and to youth figures who die,
    vanish, or are mourned.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage itself notes that some names may arise from verbal misunderstandings
    rather than original personal names.
- id: motif:3
  label: first sheaf or first ears as embodiment of crop life
  taxonomy_refs:
  - seasonal_cycle
  basis: The first cut corn is inferred to contain the corn-spirit; Java's first rice
    ears represent the Corn-bride and Corn-bridegroom; the Russian first sheaf is
    specially preserved and its grain added to seed-corn.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The Egyptian component is explicitly inferential; the Java and Russia
    examples are reported as parallels without full local context in this passage.
- id: motif:4
  label: stranger as corn-spirit representative killed at harvest
  taxonomy_refs:
  - sacrifice
  - seasonal_cycle
  basis: Frazer proposes that strangers passing the harvest field were treated as
    embodiments of the corn-spirit, seized, bound in sheaves, beheaded, and cast into
    water as a rain-charm.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage phrases this as a supposition based on grounds to be examined;
