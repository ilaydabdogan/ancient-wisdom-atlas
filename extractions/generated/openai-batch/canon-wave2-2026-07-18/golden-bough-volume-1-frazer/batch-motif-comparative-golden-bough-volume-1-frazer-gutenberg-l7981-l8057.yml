canonical_text:
  quote: ''
  summary: Frazer compares harvest and vintage songs and customs from Egypt, Phoenicia/Western
    Asia, Bithynia, Phrygia, Java, Russia, and Europe. He treats laments named Maneros,
    Linus/Ailinus, Bormus/Borimus, and Lityerses as agricultural songs associated
    with cut grain, dead or missing youth figures, and possible representations or
    killings of the corn-spirit. The passage culminates in a proposed interpretation
    of the Lityerses story as reflecting a harvest custom involving strangers, sheaves,
    beheading, and water as a rain-charm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Egyptian reapers lamented over the first sheaf cut and invoked
    Isis in connection with the discovery of corn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Greeks called the Egyptian reapers' plaintive cry Maneros and explained
    it by a story of Maneros, the only son of the first Egyptian king, who invented
    agriculture and died untimely.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage identifies the Egyptian formula mââ-ne-hra as meaning “come thou
    back” and says it occurs in Egyptian writings including a dirge of Isis in the
    Book of the Dead.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Frazer supposes that the cry over the cut corn was a dirge for the death of
    the corn-spirit and a prayer for its return; he infers that the first corn cut
    was believed to contain the corn-spirit and to die under the sickle.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage says the first ears of rice in Java represent the Corn-bride and
    the Corn-bridegroom.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In parts of Russia the first sheaf is reaped by the mistress, placed near
    holy pictures, threshed separately, and some grain is mixed with the next year's
    seed-corn.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: In Phoenicia and Western Asia a plaintive song called Linus or Ailinus was
    sung at vintage and probably at harvest; Greeks explained it as a lament for a
    youth named Linus.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: One story says Linus was brought up by a shepherd and torn to pieces by his
    dogs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage says Linus or Ailinus may derive from ai lanu, “woe to us,” and
    may have been uttered in mourning for Adonis; Sappho is said to have regarded
    Adonis and Linus as equivalent.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: In Bithynia Mariandynian reapers chanted a mournful ditty called Bormus or
    Borimus.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Bormus is described as a handsome youth who went to fetch water for reapers
    and was never heard of again; the reapers sought him in plaintive strains afterward.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: In Phrygia harvesters sang a song called Lityerses at reaping and threshing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: One Lityerses story says he fed and watered strangers, compelled them to reap,
    wrapped them in a sheaf, cut off their heads with a sickle, and carried away the
    bodies wrapped in corn stalks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage reports that Hercules slew Lityerses and threw his body into the
    river; another version says Lityerses challenged people to reaping matches and
    was slain by a stronger reaper.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: Frazer proposes that Lityerses stories may describe a Phrygian harvest custom
    in which strangers were treated as embodiments of the corn-spirit, bound in sheaves,
    beheaded, and thrown into water as a rain-charm.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: Frazer says comparison with European harvest customs should attend to reaping
    matches and binding in sheaves, killing the corn-spirit or representatives, and
    treatment of visitors or strangers to the harvest-field.
  category: other
  evidence_refs:
  - ev:7
