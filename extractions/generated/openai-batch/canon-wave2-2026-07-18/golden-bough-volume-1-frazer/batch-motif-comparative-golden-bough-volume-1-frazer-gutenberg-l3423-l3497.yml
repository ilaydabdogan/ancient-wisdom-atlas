canonical_text:
  quote: Sometimes the lost soul is brought back in a visible shape.
  summary: Frazer lists reported beliefs and rites in which a human soul can leave
    the body, appear in visible or tangible forms, be recovered by ritual specialists,
    restored through bodily points such as the head or forehead, or captured by spirits
    and human sorcerers in objects, snares, jars, tusks, and other media, with illness
    or death following if the soul is not restored.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In the Melanesian example, a woman catches a fluttering, moth-like thing at
    the moment of a neighbor's death, calls it the soul, and opens her hands above
    the corpse's mouth, but the corpse does not revive.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Salish or Flathead account, a person's soul may be separated from the
    body temporarily without immediate death or awareness, but the soul must soon
    be restored or the person will die.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Salish or Flathead account, the names of men who have lost souls are
    revealed to the medicine-man in a dream, and the soulless men dance and sing through
    the village at night before entering a dark lodge.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Salish or Flathead recovery rite uses a closed dark lodge, a small roof
    hole, a bunch of feathers, matting, a fire, and soul forms described as bits or
    splinters of bone, wood, or shell.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Salish or Flathead medicine-man sorts out souls of dead people before
    returning living persons' souls, because giving a dead person's soul to a living
    man would cause instant death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the Salish or Flathead rite, each soul is placed on its owner's head and
    patted with prayers and contortions until it descends into the heart.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the Amboina, Babar Islands, and nearby island examples, branches, leaves,
    tree roots, offerings, or wax are used in rites for recovering souls detained
    or caught by spirits associated with trees.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
- id: obs:8
  text: In the Dyak and Nias examples, the soul may be conjured into a cup, appear
    as hair or a miniature human being, or take the form of a firefly caught in a
    cloth and placed on the patient's head or forehead.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that souls may be extracted from bodies or detained during
    wanderings not only by ghosts and demons but also by men, especially sorcerers.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the Fiji example, a scarf is used or threatened as an instrument for catching
    a criminal's soul; if caught, the soul is folded up and nailed to a chief's canoe,
    and the criminal pines and dies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the Danger Island example, sorcerers set cinet snares with loops sized
    for fat or thin souls and watch for the soul to leave in the shape of a bird or
    insect.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the Serer example, an enemy's soul is conjured into a large red earthenware
    jar deposited under a consecrated tree, after which the victim dies.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the Congo example, enchanters are said to enclose human souls in ivory
    tusks and sell them to a white man, who makes them work under the sea; the person
    whose soul is sold dies in due course.
  category: relationship
  evidence_refs:
  - ev:10
