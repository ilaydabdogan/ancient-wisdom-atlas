canonical_text:
  quote: ''
  summary: 'The passage surveys rain-making practices in multiple traditions: disturbing
    sacred springs, killing or distressing animals to move divine pity, using fire
    to imitate lightning or threaten the sky, performing an elaborate Dieyerie ceremony
    with blood, down, stones, gypsum, water, a tree, and a hut, and citing Greek,
    Roman, Etruscan, and Rhodian practices involving springs, oak branches, chariots,
    stones, and weather-working magicians.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents disturbing the haunts of a rain-god as a way of constraining
    him and connects this with troubling sacred springs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Dards are said to believe that placing a cowskin or other impure thing
    in certain springs will cause storms.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Other cited springs or fountains are described as producing rain or flooding
    when a stone or stick is thrown into them, or when they are touched or even looked
    at.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Zulus are described as killing a heaven-bird during drought, throwing
    it into a pool, and expecting heaven to rain in mourning for it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Guanches of Teneriffe are described as leading sheep to sacred ground
    and separating lambs from their dams so that the bleating might move the god.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Heathen Arabs are described as tying bushes to cattle, setting the bushes
    on fire, driving the cattle to a mountain top, and praying for rain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says the Arab cattle-and-fire rite may imitate lightning or may
    threaten the sky; it also describes West African rain-makers threatening to send
    up a flame to set the sky on fire if rain does not come.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Dieyerie ceremony, a hole is dug, a hut is made over it, two inspired
    men are bled by an old influential man, and the blood is made to flow onto other
    men of the tribe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the Dieyerie ceremony, down is thrown; the passage states that the
    blood is thought to represent rain, the down clouds, and two large stones gathering
    clouds that presage rain.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Dieyerie ceremony includes carrying the stones about fifteen miles and
    placing them high in the tallest tree, while other men throw fine gypsum into
    a water-hole so that Mooramoora sees and causes clouds to appear.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Dieyerie men surround the hut, butt it with their heads, force through
    it repeatedly, and wreck it; the passage states that piercing the hut symbolizes
    piercing the clouds and the hut's fall symbolizes the fall of rain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: 'The passage also notes another Australian mode of rain-making: burning human
    hair.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage states that Greeks and Romans sought to procure rain by magic
