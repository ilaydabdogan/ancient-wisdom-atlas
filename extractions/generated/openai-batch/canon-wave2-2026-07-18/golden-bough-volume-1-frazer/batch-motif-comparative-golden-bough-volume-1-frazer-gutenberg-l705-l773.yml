candidate_motifs:
- id: motif:1
  label: Rain induced by disturbing sacred water
  taxonomy_refs: []
  basis: Several examples link rain, storms, or flooding to troubling springs or fountains,
    including impure objects, thrown objects, touch, sight, and an oak branch dipped
    into a spring.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: high
  cautions: The passage reports Frazer's comparative framing; individual local meanings
    are only summarized.
- id: motif:2
  label: Rain-making by sympathetic imitation of storm, clouds, or rain
  taxonomy_refs: []
  basis: The passage describes blood as rain, down and stones as clouds, a hut as
    clouds, chariot rattling as thunder, torches as lightning, and possibly Arab fire
    as lightning on the horizon.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:9
  - ev:10
  confidence: high
  cautions: Some interpretations are explicitly tentative in the passage, especially
    the Arab example.
- id: motif:3
  label: Coercing or threatening a sky or rain power
  taxonomy_refs: []
  basis: The passage begins with constraining the rain-god by disturbing his haunts
    and later describes rain-makers threatening heaven with a flame if rain does not
    come.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: medium
  cautions: The coercive reading is explicit for the rain-god and West African examples
    but only one possible interpretation for the Arab rite.
- id: motif:4
  label: Rain obtained through death, bleeding, or distress
  taxonomy_refs:
  - sacrifice
  basis: The passage includes the killing of a heaven-bird, separation of lambs from
    their dams to elicit divine pity, and ritual bleeding whose blood represents rain.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  confidence: medium
  cautions: The text does not call all these acts sacrifices; the taxonomy reference
    is most direct for ritual killing or bloodletting and less direct for lamb separation.
- id: motif:5
  label: Rain stone or cloud stone activated by movement or placement
  taxonomy_refs: []
  basis: The Dieyerie stones stand for gathering clouds and are placed high in a tree,
    and the Roman lapis manalis is dragged into Rome to bring rain.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:11
  confidence: medium
  cautions: The Dieyerie and Roman stone examples have similar rain-related function,
    but the passage does not assert a historical relationship.
- id: motif:6
  label: Shapeshifting weather magician
  taxonomy_refs:
  - shapeshifter
  basis: The Telchines are described as magicians able to change their shape and bring
    clouds, rain, and snow.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: Only the Telchines are explicitly described as shapeshifters in this passage;
    Etruscan wizards are weather or water workers but not shapeshifters here.
- id: motif:7
  label: Fire used in rain-making
  taxonomy_refs: []
  basis: Fire appears in the Arab burning-bush cattle rite, the West African threat
    to the sky, the burning of human hair, and Salmoneus' blazing torches imitating
    lightning.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:10
  confidence: high
  cautions: 'The passage assigns different functions to fire in different examples:
    imitation, threat, and a briefly noted Australian rain-making method.'
comparison_claims:
- id: claim:1
  claim: The passage groups Greek and Roman practices with a broader cross-cultural
    pattern of using magic to procure rain when ordinary prayers or processions fail.
  claim_level: same_function
  target: cross-cultural rain-making magic
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a general comparative statement in the passage, not a detailed
    proof of shared origin.
- id: claim:2
  claim: The passage explicitly compares the Arcadian practice of dipping an oak branch
    into a spring with a similar rain-making mode in Halmahera near New Guinea.
  claim_level: same_function
  target: Halmahera near New Guinea rain-making by troubling water
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The Halmahera practice is referenced as already discussed and is not
    described in detail within this passage.
- id: claim:3
  claim: The passage compares the probable thunder-imitation of the Crannon bronze
    chariot with Russian mock thunder and lightning in a rain-charm.
  claim_level: same_function
  target: Russian mock thunder and lightning rain-charm
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The Russian example is only briefly referenced here; the comparison
    rests on Frazer's interpretation of rattling as thunder imitation.
- id: claim:4
  claim: The Arab burning-bush cattle rite and Salmoneus' torches and noise-making
    are both presented in terms of imitating storm phenomena, especially lightning
    or thunder.
  claim_level: visual_similarity
  target: ritual imitation of lightning and thunder
  evidence_refs:
  - ev:4
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not directly pair these two examples; the Arab interpretation
    is given as tentative.
- id: claim:5
  claim: The rain-god constraint frame and the West African threat to set the sky
    on fire share a coercive rain-making function within the passage's comparative
    presentation.
  claim_level: same_function
  target: coercive rain-making directed at rain-god or sky
  evidence_refs:
  - ev:1
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports examples from distinct traditions and does not
    argue historical contact or common inheritance.
