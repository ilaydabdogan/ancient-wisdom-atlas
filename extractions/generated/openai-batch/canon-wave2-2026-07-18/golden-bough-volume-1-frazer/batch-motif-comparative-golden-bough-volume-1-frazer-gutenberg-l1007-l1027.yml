canonical_text:
  quote: ''
  summary: Frazer describes the idea of a man-god or human being with divine powers
    as belonging to an earlier religious stage in which gods and humans were viewed
    as similar in kind. He distinguishes temporary incarnation, called inspiration
    or possession and associated with divination or prophecy, from permanent incarnation,
    in which a divine spirit dwells in a human body and the god-man is expected to
    work miracles. He adds that such miracles are understood not as breaches of natural
    law but as unusually striking manifestations of common power.
  language: English
  quote_policy: summarized
