canonical_text:
  quote: ''
  summary: Frazer interprets Egyptian and Western Asian harvest cries as long-drawn
    calls connected with the death of a corn-spirit and with Osiris. He then describes
    the Devonshire custom of “crying the neck,” in which a final bundle of wheat ears
    is selected, raised, cried over in repeated formulae, carried toward the farmhouse,
    and sometimes defended with a pail of water. A related Devonshire report links
    the custom to the “spirit of harvest,” and the passage notes farmhouse display
    of the neck and an incomplete notice of a similar Cornwall last-sheaf custom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Egyptian reapers’ annual cry across the fields announced
    the death of the corn-spirit, described as the rustic prototype of Osiris.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Similar harvest cries are said to have been heard in Western Asia; the passage
    says ancient writers called them songs, while Frazer suggests they may have been
    a few words sung or cried on a prolonged note.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The passage proposes that Greek travellers in Asia or Egypt might hear foreign
    harvest cries, fail to understand the words, take them for names such as Maneros,
    Linos, Lityerses, or Bormus, and compare the cries of different peoples.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Devonshire reapers are described as uttering similar cries and performing
    a field ceremony called “crying the neck” after the wheat is cut.
  category: action
  evidence_refs:
  - ev:7
  - ev:3
- id: obs:5
  text: In the Devonshire ceremony, an old man or other knowledgeable person selects
    a small bundle of the best wheat ears, ties and arranges it, and this bundle is
    called “the neck” of wheat.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the field is cut, reapers, binders, and women stand in a circle, while
    the person with “the neck” stands in the centre holding it with both hands.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The group stoops, then rises while raising arms, hats, and the neck, crying
    “the neck” three times; they then cry “wee yen” or “way yen” three times with
    the same movement.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the repeated cries, the participants laugh loudly, throw hats or caps
    into the air, caper about, and may kiss the girls.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: One participant runs with “the neck” to the farmhouse, where a dairymaid or
    young female domestic waits with a pail of water; if he enters by another way
    he may kiss her, but otherwise he is soused with water.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Devonshire cry is described as having a strong effect at a distance, with
    one observer claiming to have heard several necks cried in one night, some four
    miles away.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Mrs. Bray is reported to have seen Devonshire reapers standing in a circle
    on rising ground with sickles aloft, while a man in the middle held ears of corn
    tied with flowers and the party shouted three times.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: In Mrs. Bray’s report, the group went home with women and children carrying
    boughs of flowers, shouting and singing; a man-servant said they were making their
    customary games to the spirit of harvest.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage says “the neck” is generally hung up in the farmhouse for up to
    two or three years, and begins to note a similar Cornwall custom in which the
    last sheaf is decked with ribbons.
  category: object
  evidence_refs:
  - ev:6
