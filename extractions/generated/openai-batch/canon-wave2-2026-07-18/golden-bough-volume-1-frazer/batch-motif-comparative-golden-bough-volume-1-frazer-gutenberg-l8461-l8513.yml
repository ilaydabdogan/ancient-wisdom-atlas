canonical_text:
  quote: ''
  summary: Frazer describes Khond or Kandh Meriah human sacrifices to the Earth Goddess
    Tari Pennu or Bera Pennu, said to secure crops, health, and protection from misfortune.
    The passage outlines who could become a victim, how victims were treated as consecrated
    beings, the distribution of flesh to fields, and the procession, adornment, relic-taking,
    dance, and prayer surrounding the rite.
  language: English
  quote_policy: summarized
