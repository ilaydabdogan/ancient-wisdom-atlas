canonical_text:
  quote: ''
  summary: 'Frazer surveys rites and beliefs involving forest or tree spirits, sacred
    trees, and seasonal tree customs: Esthonian rites for Metsik, Circassian veneration
    of a pear-tree, fertility and childbirth practices involving trees, and European
    May-tree or May-bough customs intended to bring tree-spirit blessings to households.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some Esthonians are said to believe in Metsik, a mischievous forest spirit
    who has the welfare of cattle in his hands.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Esthonian villagers annually make an image of Metsik from straw or sometimes
    a corn-sheaf, dress or prepare it, fasten it to a tree, dance before it, and offer
    prayer and sacrifice for protection of cattle and corn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Circassians are said to regard a pear-tree as protector of cattle and
    to adore a young pear-tree brought from the forest as a divinity.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At an autumn festival the Circassian pear-tree is carried indoors with music
    and cries, covered with candles, topped with cheese, and accompanied by eating,
    drinking, and singing before being returned to the courtyard.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage links a May Day green bush placed before a beloved maiden with
    belief in the fertilising power of the tree-spirit.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Among the Kara-Kirgiz, barren women are described as rolling on the ground
    under a solitary apple-tree to obtain offspring.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Swedish districts, pregnant women are described as clasping a guardian-tree
    to ensure easy delivery, and the tree is protected by taboos against injury.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In some Congo-region tribes, pregnant women make garments from bark of a sacred
    tree because they believe it protects them from dangers of childbirth.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The story of Leto clasping trees before giving birth to Apollo and Artemis
    is mentioned as possibly pointing to a similar Greek belief.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage describes European May-tree and May-pole customs in which people
    cut a tree or branches in woods and bring them to the village or to houses with
    rejoicing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The stated intention of the May-tree and branch customs is to bring to the
    village and households blessings that the tree-spirit can bestow.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Examples from Westmeath, Northamptonshire, Cornwall, northern England, and
    Abingdon involve green bushes, planted trees or stumps, decorated boughs, flowered
    branches, garlands, music, and song at May time.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
