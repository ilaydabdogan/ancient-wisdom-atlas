canonical_text:
  quote: ''
  summary: The passage surveys May Day and Whitsuntide customs in several European
    regions involving children or villagers carrying garlands, boughs, birches, or
    May-trees, singing, collecting gifts, marking homes with greenery, dressing and
    immersing a birch-tree, and decorating houses, streets, and vehicles with green
    leaves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Saffron Walden and Debden on May 1, little girls go door to door singing
    and carrying garlands, usually with a doll dressed in white placed in the middle
    of each garland.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Seven Oaks on May Day, children carry boughs and garlands from house to
    house while begging for pence; the garlands are two interlaced hoops covered with
    blue and yellow flowers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Vosges villages on the first Sunday of May, young girls go house to house
    singing in praise of May; if given money they fasten a green bough to the door,
    and if refused they utter a negative wish about children and bread.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Mayenne, boys called Maillotins formerly went farm to farm on May 1 singing
    carols, receiving money or a drink, and planting a small tree or tree-branch.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Russian villagers before Whitsunday go into the woods, sing, weave garlands,
    cut down a young birch-tree, and dress or adorn it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Russian dressed birch-tree is carried home with dancing and song, set
    up in a house, treated as an honoured guest until Whitsunday, and visited on intervening
    days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: On Whitsunday the Russian villagers take the dressed birch-tree to a stream,
    fling it into the water, and throw their garlands after it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Frazer comments that the dressing of the birch in woman’s clothes shows the
    tree is conceived as personal, and that its being thrown into a stream is most
    probably a rain-charm.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: Frazer states that before Whitsunday in Russia, villages and towns are decorated
    with young birch-trees, boughs, and green leaves, including streets, houses, rooms,
    and railway engines.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: In Altmark at Whitsuntide, serving-men, grooms, and cowherds formerly distributed
    crowns made of birch-branches and flowers to farmers, who hung them in houses
    until the following year.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Near Zabern in Alsace, bands carry May-trees; one man wears a white shirt
    and has a blackened face, a large May-tree is carried before him, each member
    carries a smaller tree, and another person collects eggs and bacon in a basket.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In parts of Sweden on May Eve, lads carry fresh birch twigs, proceed with
    a village fiddler at their head, sing May songs asking for fine weather, harvest,
    and blessings, collect gifts, and place a leafy twig above a cottage door when
    well received.
  category: sequence
  evidence_refs:
  - ev:7
