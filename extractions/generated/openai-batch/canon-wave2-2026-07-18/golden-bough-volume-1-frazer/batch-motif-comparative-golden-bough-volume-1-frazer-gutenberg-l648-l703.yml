canonical_text:
  quote: ''
  summary: The passage catalogs reported rain-making customs from several regions.
    It describes water-drenching and bathing rites, field rites involving women and
    agricultural implements, black animals and black smoke used as rain-cloud analogues,
    and coercive or punitive treatment of rain-gods, fetishes, animals, humans, or
    effigies to obtain rain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that a leaf-dressed girl represents the spirit of vegetation
    and that drenching her with water imitates rain.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Russian example, women seize a passing stranger and throw him into
    a river or soak him completely when rain is wanted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says a passing stranger is often taken for a god or spirit in
    such contexts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the Minahassa example, a priest bathes as a rain-charm.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Georgian example, marriageable girls are yoked in couples, led by a
    priest, and made to wade through rivers, puddles, and marshes while vocalizing
    and praying.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the Transylvanian example, naked girls led by an older naked woman steal
    a harrow, carry it to a brook, set it afloat, sit on it, and keep small flames
    burning at its corners before leaving it in the water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the Indian example, naked women drag a plough across a field by night;
    the passage notes that water immersion or sprinkling is not stated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Several animal-based rain charms are described, including a black sheep in
    Peru, a black cat in Sumatra, black smoke from an ox stomach among the Bechuanas,
    a black pig in Timor, and a black goat among the Garos.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that the black color of certain animals is part of the
    charm because it is associated with darkening the sky with rain-clouds.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Several examples involve punishing or degrading rain-related sacred figures
    or objects when rain is not obtained, including a Chinese dragon, Feloupe fetishes,
    Orinoco toads, and a Comanche slave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage suggests that the Comanche slave may represent the god, comparing
    this possible role to the leaf-clad Dodola.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: In the Battambang example, a governor prays to Buddha for rain, a bright-colored
    dummy is placed on a plain, and elephants are driven to trample it to pieces.
  category: sequence
  evidence_refs:
  - ev:5
