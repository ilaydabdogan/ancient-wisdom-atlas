  quote: ''
  summary: Frazer argues that temporary or mock kings could function as substitutes
    for a divine king whose life was ritually due, and extends the comparison to royal
    sons, first-born children, purchased children, criminals, and other victims sacrificed
    in crises or to deities. He cites examples from Semitic, Phoenician, Carthaginian,
    New South Wales, Florida, Senjero, Russian, Egyptian, and Bilaspur contexts.
  language: English
  quote_policy: summarized
