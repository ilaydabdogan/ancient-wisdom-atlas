canonical_text:
  quote: ''
  summary: Frazer describes temporary incarnation or inspiration as a widespread belief
    in which a spirit or deity possesses a person, produces bodily signs, and speaks
    through the person. He surveys examples in which intoxication, sacrificial blood,
    sacred tree materials, smoke, or ritual tests of sacrificial victims are connected
    with prophecy or divine presence, and he adds examples where inspired persons
    are believed to gain protective or superhuman power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Temporary incarnation or inspiration is described as a condition in which
    a spirit or deity possesses a person, the person’s own personality lies in abeyance,
    bodily signs appear, and utterances are accepted as the spirit’s voice.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Mangaia, priests said to house gods were called “god-boxes” or “gods,”
    drank an intoxicating liquor before oracles, and their frenzied words were received
    as a god’s voice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: One described method of producing temporary inspiration is sucking or tasting
    the fresh blood of a sacrificed victim.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:4
  text: At Argos and Aegira, female ritual specialists consume sacrificial animal
    blood before prophesying or divining; the Aegira priestess descends into a cave
    before prophecy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Southern India, a devil-dancer drinks blood from a decapitated goat, dances
    violently, is described as demon-possessed, and is consulted by bystanders.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At a Minahassa festival, a priest twice drinks blood from a killed pig and
    is made to sit and predict the rice crop; the passage also cites blood-tasting
    or blood-sucking by priests or diviners at Rhetra and among Hindoo Koosh tribes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Another described method of producing temporary inspiration uses branches,
    leaves, twigs, smoke, or ingestion connected with sacred trees.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Hindoo Koosh example, sacred cedar twigs are burned and the Dainyal
    or sibyl inhales smoke until convulsions and collapse are followed by a chant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Apollo’s prophetess is said to eat sacred laurel before prophecy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says many peoples expect sacrificial victims to show signs of
    inspiration through convulsive bodily movement, trembling, or shaking; unmoving
    animals may be rejected as unfit for sacrifice.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Water or wine is poured on an animal’s head in some sacrificial tests; if
    the animal shakes its head it may be accepted, and if not it may be rejected.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The temporarily inspired person is said to acquire divine knowledge and, at
    least sometimes, divine power.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: In Cambodia, a man believed chosen by the local god for temporary incarnation
    is taken to the god’s altar and then venerated and asked to protect villages against
    plague.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: At Hylæ in Phocis, sacred men inspired by Apollo’s image are said to leap
    down precipices, tear up huge trees, and carry them through narrow defiles; inspired
    dervishes are said to belong to the same class.
  category: action
  evidence_refs:
  - ev:8
