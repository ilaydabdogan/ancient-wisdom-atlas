canonical_text:
  quote: ''
  summary: The passage lists examples in which kings, chiefs, high priests, or sacred
    animals are held responsible for rain, crops, famine, pestilence, health, fish,
    or the wider course of nature. When scarcity or calamity occurs, communities punish,
    depose, threaten, or kill the responsible sacred ruler or animal, including named
    cases of Domalde, Olaf, and Koch.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Antaymours of Madagascar, the king is said to be responsible for
    crop growth and for every misfortune affecting the people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In some West African examples, subjects bind a king and take him to the grave
    of his forefathers when prayers and offerings to the king fail to obtain rain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the Scythians put their king in bonds when food was scarce.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Banjars are described as rewarding the king in fine weather and insulting
    or beating him during drought or excessive rain until the weather changes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The people of Loango are described as accusing and deposing their king when
    harvests fail or fishing is blocked by heavy surf.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: On the Pepper Coast, the Bodio is described as responsible for community health,
    earth fertility, and fish abundance; he is deposed if the country suffers in these
    respects.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says the old Burgundians deposed their king if crops failed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the Swedish Domalde episode, chiefs decide during famine that the king
    is the cause of scarcity and sacrifice him for good seasons, smearing his blood
    on divine altars.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the Olaf episode, people attribute famine to the king’s inadequate sacrifices,
    march against him, surround his dwelling, burn him inside it, and give him to
    Odin for good crops.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the Chukch case, Shamans declare that chief Koch must be sacrificed because
    of a reindeer pestilence, and Koch’s son stabs him with a dagger.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: On Niuē, kings are also high priests and are supposed to make food grow; in
    times of scarcity people kill them, eventually ending the monarchy because no
    one will be king.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: In the ancient Egyptian case, priests secretly threaten sacred animals during
    calamities following drought, and kill the animals if the evil does not abate.
  category: sequence
  evidence_refs:
  - ev:12
