canonical_text:
  quote: '"when the divine king or priest is put to death his spirit is believed to
    pass into his successor"'
  summary: Frazer argues that the killing of divine persons may be understood with
    the idea that the slain divinity's soul passes to a successor. He notes a lack
    of direct proof for this specific succession but cites examples in which a dying
    person's soul or breath is caught, transferred, or received by heirs, ritual specialists,
    women seeking conception, infants, friends, or images.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that the explanation of killing divine persons assumes,
    or can be combined with, the idea that the soul of the slain divinity is transmitted
    to a successor.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that he has no direct proof for the transmission of the
    slain god's soul to a successor and that a link in the chain of evidence is wanting.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the soul of an incarnate deity is often supposed to transmigrate
    at death into another incarnation, and reasons that this could also apply to violent
    death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the Nias example, the eldest son usually succeeds a father in the chieftainship,
    but if incapacitated, the father chooses another son during his lifetime.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Nias example, the chosen son must establish succession by catching
    the dying chief's last breath, and with it the soul, in his mouth or in a bag.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the Nias example, brothers and sometimes strangers crowd around the dying
    man to catch his soul as it passes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In one Nias incident, a candidate bored a hole in the floor and sucked in
    the chief's last breath through a bamboo tube.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: When a Nias chief has no son, his soul is caught in a bag fastened to an image
    representing the deceased, and the soul is believed to pass into the image.
  category: object
  evidence_refs:
  - ev:2
- id: obs:9
  text: Among the Takilis or Carrier Indians, when a corpse is burned, a priest pretends
    to catch the soul of the deceased in his hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: In the Carrier example, the priest communicates the captured soul to the dead
    man's successor by throwing his hands toward him and blowing upon him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: In the Carrier example, the person receiving the soul takes the name and rank
    of the deceased.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:12
  text: In the Carrier example, the priest can transmit the soul to whom he chooses,
    though he is said generally to follow the regular line of succession.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:13
  text: Algonkin women who wished to become mothers gathered near a dying person hoping
    to receive and be impregnated by the passing soul.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: Among the Seminoles of Florida, when a woman died in childbed, the infant
    was held over her face to receive her departing spirit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: The passage says Romans caught the breath of dying friends in their mouths
