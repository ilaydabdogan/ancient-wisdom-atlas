canonical_text:
  quote: ''
  summary: 'Frazer describes several sacred or priestly rulers: Kukulu in Lower Guinea,
    Chitomé or Chitombé in Congo, and the high pontiff of the Zapotecs in Southern
    Mexico. These figures are surrounded by restrictions, treated as divine or exceptionally
    sacred, associated with natural or cosmic stability, and in some cases linked
    to first-fruits offerings, continence rules, dangerous shadow or ground-contact
    taboos, and hereditary pontifical succession. Frazer then generalizes that such
    rulers are valued as preservers of nature and society but may be constrained,
    dismissed, or killed if they fail in that role.'
  language: English
  quote_policy: summarized
