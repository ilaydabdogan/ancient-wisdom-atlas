comparison_claims:
- id: claim:1
  claim: The passage groups Japanese and West African sacred-ruler examples under
    a shared pattern in which the order of nature, and even the world’s existence,
    is bound up with the life of a king or priest.
  claim_level: same_motif
  target: Japanese divine kings or Mikado as referenced by Frazer, compared with West
    African priestly kings
  evidence_refs:
  - ev:1
  - ev:2
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The Japanese details are referenced but not supplied in this passage,
    so the comparison can only be recorded at the level stated by Frazer here.
- id: claim:2
  claim: Frazer presents the Zapotec high pontiff as a close parallel to the Mikado
    in divine reverence and pontifical status, while noting that the Zapotec pontiff’s
    supernatural powers are not specified.
  claim_level: same_function
  target: Mikado, as referenced within the passage
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  counter_evidence_refs:
  - ev:6
  confidence: medium
  limitations: The passage itself cautions that the Zapotec pontiff’s supernatural
    powers are unspecified and only probably resembled those of the Mikado and Chitomé.
- id: claim:3
  claim: Kukulu and Chitomé share a West African pattern of a sacred figure whose
    conduct or life is tied to environmental or cosmic stability and surrounded by
    prohibitions.
  claim_level: same_motif
  target: West African priestly or divine king pattern within the passage
  evidence_refs:
  - ev:1
  - ev:2
  - ev:7
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: 'The specific effects differ: Kukulu is linked mainly with wind, navigation,
    storms, and atmosphere, while Chitomé is linked with first-fruits, continence,
    and world survival.'
- id: claim:4
  claim: The Congo and Zapotec examples both use continence rules around pontifical
    sacredness, though the actors and occasions differ.
  claim_level: same_function
  target: Chitomé continence rule and Zapotec priestly continence rule
  evidence_refs:
  - ev:2
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: In the Congo case the rule applies to married people while Chitomé
    is away; in the Zapotec case continence is imposed on priests, especially the
    high pontiff.
