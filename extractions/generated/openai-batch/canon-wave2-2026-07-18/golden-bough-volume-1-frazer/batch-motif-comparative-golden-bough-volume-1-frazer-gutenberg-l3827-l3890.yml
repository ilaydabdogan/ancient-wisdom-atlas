candidate_motifs:
- id: motif:1
  label: clinging ghost or spirit removed from the body
  taxonomy_refs: []
  basis: The rice-and-fowl rite and the Basuto hand-scratching rite are both presented
    as ways to remove a ghost or spirit adhering to a person after exposure to danger
    or death.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage is comparative scholarship rather than a primary myth narrative;
    the Basuto explanation is phrased by the author as an inference.
- id: motif:2
  label: ritual severing of personal connection from objects
  taxonomy_refs: []
  basis: The Nias example describes scrubbing purchased weapons and clothes to efface
    all connection between the objects and their former owners.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives a single ethnographic example for this object-focused
    pattern.
- id: motif:3
  label: threshold reception with sacrifice, blood, fire, or incense
  taxonomy_refs:
  - sacrifice
  basis: Travellers are described as being received before village entry with sacrifice,
    fire, incense, embers, or goat blood sprinkled on the path.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The taxonomy reference captures the sacrificial part of the motif, but
    not all listed elements such as fire, incense, or embers.
- id: motif:4
  label: reciprocal hostile gesture converted into hospitality
  taxonomy_refs: []
  basis: The Cumberland Inlet ceremony has the sorcerer strike the stranger, the stranger
    strike the sorcerer in return, and the two kiss before hospitable reception.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly explain the function of the blows beyond
    including the ceremony among stranger-reception practices.
- id: motif:5
  label: outsider or object feared as transformed enemy
  taxonomy_refs:
  - shapeshifter
  basis: Villagers refusing Speke ask whether the tin boxes might be the plundering
