canonical_text:
  quote: ''
  summary: The passage compares rites for removing ghosts, spirits, or dangerous influences
    from persons, objects, strangers, travellers, and hostile spaces. Examples include
    rice picked from a body by a fowl, scratched hands treated with magic stuff, scrubbing
    purchased weapons and clothes, sacrifices or fire at village entry, blood on a
    path, reciprocal blows and kissing in stranger reception, refusal of feared outsiders,
    ceremonies to make land common, a branch rite for protection, and fire carried
    or thrown to purify space.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Borneo and Celebes, rice is sprinkled on the head or body of a person thought
    to be infested by dangerous spirits, and a fowl picks up the rice, thereby removing
    the spirit or ghost described as clinging to the skin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Basutos who have carried a corpse to the grave have their hands scratched
    with a knife and magic stuff rubbed into the wound.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people of Nias scrub and scour purchased weapons and clothes to efface
    connection between the objects and their former owners.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Travellers before entering villages in Afghanistan and parts of Persia may
    be received with animal life, food, fire, or incense; the passage also mentions
    lighted embers thrown under a traveller’s horse with words of welcome.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Emin Pasha is described as entering a Central African village where two goats
    were sacrificed, their blood sprinkled on the path, and the chief stepped over
    the blood to greet him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Among Eskimos of Cumberland Inlet, a sorcerer meets a stranger, strikes the
    stranger’s exposed cheek, then offers his own cheek for a blow from the stranger,
    after which they kiss and the stranger is received hospitably.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A village refused Speke admission because its inhabitants feared a white man
    and tin boxes, wondering whether the boxes were the plundering Watuta transformed.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says fear of alien visitors is often mutual and that Maoris entering
    a strange land performed ceremonies to make it noa, or common, lest it had been
    tapu, or sacred.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: On the Maclay Coast of New Guinea, a native companion broke a branch from
    a tree, whispered to it, spat something on each party member’s back, struck them
    with the branch, and buried the branch under withered leaves in the jungle.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: In Australia, strangers invited into a district carry lighted bark or burning
    sticks as they approach the owning tribe’s encampment, saying this clears and
    purifies the air.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: When two Greek armies advanced to battle, sacred men marched in front bearing
    lighted torches, threw them into the space between the armies, and withdrew unmolested.
  category: sequence
  evidence_refs:
  - ev:11
