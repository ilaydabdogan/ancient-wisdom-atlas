  confidence: low
  cautions: This is a reported fear or suspicion, not an enacted transformation narrative;
    the shapeshifter taxonomy reference is therefore tentative.
- id: motif:6
  label: protective purification before entering strange territory
  taxonomy_refs: []
  basis: The passage frames Maori ceremonies, the New Guinea branch rite, Australian
