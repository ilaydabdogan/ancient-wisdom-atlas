canonical_text:
  quote: Attis was described by an ancient authority as “a reaped ear of corn.”
  summary: Frazer compares Attis, Lityerses, and Bormus as harvest or vegetation figures
    whose representatives, deaths, disappearances, or songs are interpreted through
    seasonal rites involving tree-spirits, corn-spirits, human victims, last sheaves,
    water, and annual lamentation or return.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: At Pessinus, the high-priest is said to have been annually slain in the character
    of Attis, who is described as a vegetation god and as a reaped ear of corn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage presents a possible identification of Attis with Lityerses, but
