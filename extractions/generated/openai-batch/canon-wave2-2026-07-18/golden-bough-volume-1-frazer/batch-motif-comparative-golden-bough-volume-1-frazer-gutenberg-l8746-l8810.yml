  category: relationship
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: The passage says that one people may have two distinct vegetation deities
    with separate personal representatives slain at different times of year.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Attis is associated with a tree-god and a spring slaying, while Lityerses
    is associated with summer or autumn harvest time.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Attis worship is described as a state religion that spread to Italy, while
