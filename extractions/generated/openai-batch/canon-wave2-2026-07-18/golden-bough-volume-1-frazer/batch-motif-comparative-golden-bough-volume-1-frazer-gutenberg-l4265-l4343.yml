- id: motif:2
  label: taboo on sharp instruments near the dead or the soul
  taxonomy_refs: []
  basis: The passage compares multiple death customs in which knives, needles, axes,
    sewing, cutting, or edge-up blades are avoided while a corpse, soul, or ghost
    is near.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: The examples come through Frazer's comparative framing; individual local
