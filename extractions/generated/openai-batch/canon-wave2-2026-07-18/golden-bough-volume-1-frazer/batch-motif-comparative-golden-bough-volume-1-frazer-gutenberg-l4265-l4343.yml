canonical_text:
  quote: ''
  summary: Frazer discusses aversion to iron as a possible reaction to novelty and
    as a religious taboo, then describes iron being used as a protective charm against
    spirits, ghosts, demons, or death. He also compares customs that avoid weapons
    or sharp instruments near a dead person, a soul, or a sacred ruler, because such
    instruments are thought capable of injuring the soul or spirit.
  language: English
  quote_policy: summarized
