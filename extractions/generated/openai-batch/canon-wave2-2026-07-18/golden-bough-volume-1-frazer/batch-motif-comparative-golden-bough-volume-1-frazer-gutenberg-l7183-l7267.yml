canonical_text:
  quote: ''
  summary: The passage discusses reported human and animal sacrifices in rites of
    Dionysus, then summarizes Frazer's comparative interpretation of the Greek myth
    of Demeter and Proserpine as a vegetation and corn myth involving loss, descent
    to the underworld, return, and seasonal revival. It also surveys folk personifications
    of grain as Corn-mother, Rye-mother, Pea-mother, Flax-mother, and related field
    figures in European folklore.
  language: English
  quote_policy: summarized
