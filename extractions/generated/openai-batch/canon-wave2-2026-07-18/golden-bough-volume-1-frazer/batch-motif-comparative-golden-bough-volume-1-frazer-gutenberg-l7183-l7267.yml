    evidence from the Syrian myth is provided here.
- id: claim:2
  claim: The passage states that the Greek myth of Demeter and Proserpine is substantially
    identical with the Phrygian myth of Cybele and Attis.
  claim_level: same_motif
  target: Phrygian myth of Cybele and Attis
  evidence_refs:
  - ev:6
