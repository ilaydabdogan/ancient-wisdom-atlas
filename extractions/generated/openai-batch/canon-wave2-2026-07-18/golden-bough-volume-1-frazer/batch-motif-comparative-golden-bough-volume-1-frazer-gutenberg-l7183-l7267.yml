    Dionysus and that a goat was later substituted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Orchomenus, the passage says the priest of Dionysus annually pursued women
    of the Oleiae family with a drawn sword and had the right to slay any one he overtook.
  category: action
  evidence_refs:
  - ev:3
