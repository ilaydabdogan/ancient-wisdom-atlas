candidate_motifs:
- id: motif:1
  label: Sacrificial victim representing a slain god
  taxonomy_refs:
  - sacrifice
  - dying_and_returning
  basis: The passage says slain bull, goat, and possibly human victim represented
    the slain god in Dionysus rites.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: medium
  cautions: The passage phrases the human-victim interpretation as supposition and
    notes possible ritual misinterpretation.
- id: motif:2
  label: Human sacrifice replaced by animal substitute
  taxonomy_refs:
  - sacrifice
  basis: At Potniae a child is said to have been formerly sacrificed, with a goat
    later substituted; the passage also discusses animal victims treated as human
    beings.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: medium
  cautions: The author cautions that some traditions of human sacrifice may be misinterpretations
    of animal ritual.
- id: motif:3
  label: Abduction to the underworld as bride
  taxonomy_refs:
  - stolen_beloved
  - sacred_marriage
  - departure
  basis: Pluto carries Proserpine from the flower-gathering scene into the subterranean
    world to be his bride.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage summarizes the myth rather than giving a full primary-source
    narrative.
- id: motif:4
  label: Mourning mother searches for lost daughter
  taxonomy_refs:
  - mother_goddess
  - divine_parent_child
  basis: Demeter mourns Proserpine's loss, searches over land and sea, and learns
    her fate from the Sun.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: Frazer interprets both mother and daughter as corn goddesses; that interpretation
    should be distinguished from the narrated action.
- id: motif:5
  label: Withholding of crop growth after divine loss
  taxonomy_refs:
  - seasonal_cycle
  - mother_goddess
  basis: Demeter keeps seed hidden and prevents growth, threatening human starvation
    until Proserpine is fetched back.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The crop symbolism is explicitly Frazer's interpretation in this comparative
    passage.
- id: motif:6
  label: Seasonal descent and return from the underworld
  taxonomy_refs:
  - death_rebirth
  - dying_and_returning
  - seasonal_cycle
  - ascent
  - return
  basis: Proserpine spends part of each year underground and returns in spring; the
    passage calls this annual death and resurrection, descent and ascension.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The exact duration underground varies in the passage between one third
    and one half of the year.
- id: motif:7
  label: Grain personified as mother or old woman
  taxonomy_refs:
  - mother_goddess
  - seasonal_cycle
  basis: The passage lists many European folk expressions and beliefs in which corn,
    rye, peas, flax, or grain fields are personified as mother or old-woman figures.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
  - ev:15
  - ev:16
  confidence: high
  cautions: These are reported folklore analogies used to support an etymological
    and interpretive argument about Demeter.
- id: motif:8
  label: Last sheaf as embodied field spirit
  taxonomy_refs:
  - seasonal_cycle
  basis: The Styria example describes the Corn-mother as a female puppet made from
    the last sheaf of corn and dressed in white.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: The passage provides a single reported village example within a comparative
    survey.
