canonical_text:
  quote: ''
  summary: 'Frazer describes customs in which a divine or royal ruler is killed at
    a fixed term before signs of decline appear. He gives South Indian examples: a
    Quilacare king who must publicly mutilate and kill himself at a twelve-year jubilee
    as a sacrifice to an idol, and a modified Calicut/Samorin custom in which challengers
    may try to kill the king at a twelve-year jubilee and succeed him if successful.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes between rulers killed after visible decline and
    rulers killed while still vigorous because a fixed term has expired.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In some parts of Southern India, the fixed reign period is described as twelve
    years.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: In Quilacare, a house of prayer contains an idol, and a great feast or jubilee
    is celebrated for it every twelve years.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Quilacare king is said to have no more than twelve years to reign, from
    one jubilee to the next.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the completion of the twelve years, people assemble, money is spent feeding
    Bramans, and the king prepares a wooden scaffolding covered with silken hangings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Quilacare king bathes at a tank with ceremonies and music, prays to the
    idol, mounts the scaffolding, cuts parts of his body with knives, and finally
    cuts his own throat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king’s self-killing is explicitly described in the passage as a sacrifice
    to the idol.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A person who wishes to reign for the next twelve years must be present watching
    the Quilacare king’s death and undertake the same martyrdom for love of the idol
    before being raised as king.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Samorin or King of Calicut formerly had to cut his throat in public at
    the end of a twelve-year reign.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the modified Samorin custom, a jubilee is proclaimed after twelve years,
    a tent is pitched, a feast lasts ten or twelve days, guns fire, and challengers
    may try to kill the Samorin in his tent.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Under the modified custom, the person who kills the Samorin succeeds him in
    his empire.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the 1695 jubilee account, three men attacked the guards with sword and
    target, killed and wounded many, and were themselves killed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A fifteen- or sixteen-year-old nephew of one attacker entered the tent and
    struck at the Samorin’s head, but a burning brass lamp over the king’s head spoiled
    the blow; the guards then killed the youth.
  category: sequence
  evidence_refs:
  - ev:7
