canonical_text:
  quote: "“the spirit of the corn—the Old Man of vegetation—is driven out”"
  summary: Frazer catalogues harvest customs in which a person associated with the
    last sheaf, last ears, or last threshing stroke is wrapped in straw or corn-stalks,
    named as an Old Man or harvest figure, processed, danced with, rolled, drenched,
    or otherwise treated ceremonially. He then states that these cases express the
    idea of a corn-spirit driven from the last cut or threshed grain, wintering in
    the barn, and returning to the fields at sowing. A Central Provinces Indian last-corn
    custom is presented as having much the same ideas, with the last corn made into
    a sheaf, carried home, and fastened up to avert the evil-eye.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A woman was tied in pease-straw, brought with music to the farmhouse, and
    danced with by harvesters until the pease-straw fell off.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Around Stettin, women raced not to be last; the woman placing the last sheaf
    on the wagon was called the Old Man, swathed in corn-stalks, decked with flowers,
    and given a straw helmet.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Stettin Old Man carried the harvest-crown to the squire, held it over
    his head, uttered good wishes, and later had the right to choose a dance partner.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Blankenfelde, the woman who bound the last rye sheaf was saluted with a
    cry, tied into the last sheaf with only her head free, capped with rye-stalks,
    called the Harvest-man, made to dance before the last wagon, given a present,
    and released.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Gommern and Neuhausen, the person connected with the last ears or last
    sheaf was wrapped in corn or oats, carried or danced around, and at Neuhausen
    saluted as the Oats-man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Brie the farmer was tied in the first sheaf; at Udvarhely and Dingelstedt
    a person or man was encased in corn or the last sheaf, crowned or called the Old
    Man, and then soused or drenched with water, rolled, or brought home on the last
    wagon.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Nördlingen and in parts of Oberpfalz, the person connected with the last
    threshing stroke was wrapped in straw, rolled on the threshing-floor, or carried
    to a neighbor who had not finished threshing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In Thüringen a sausage was stuck in the last sheaf at threshing, thrown with
    the sheaf on the threshing-floor, named Barrenwurst or Banzenwurst, and eaten
    by all the threshers; afterward a man encased in pease-straw was led through the
    village.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The author states that in these cases the spirit of the corn, called the Old
    Man of vegetation, is driven out of the last cut or threshed corn, lives in the
    barn during winter, and returns to the fields at sowing-time.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the Central Provinces of India, reapers left a final plot of corn, rushed
    at it, tore it up, cast it into the air, shouted victory to named beings, made
    a sheaf tied to a bamboo, carried it home in the last harvest cart, and fastened
    it at the threshing-floor to a tree or cattle-shed to avert the evil-eye.
  category: sequence
  evidence_refs:
  - ev:8
