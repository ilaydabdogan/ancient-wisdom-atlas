canonical_text:
  quote: ''
  summary: Frazer discusses Egyptian traditions linking Osiris, harvest, human sacrifice,
    red-haired victims, ash-scattering, dismemberment, and water rites. He recounts
    the legend of Busiris, interprets slain or effigy figures as representatives of
    the corn-spirit, and compares these practices with other agricultural sacrificial
    and fertility customs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that in Egypt the slain corn-spirit, identified as the dead
    Osiris, was represented by a human victim whom reapers killed in the harvest-field
    and mourned with a dirge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Busiris legend states that Busiris sacrificed strangers on an altar to
    Zeus, after a Cyprian seer prescribed an annual human sacrifice to end a nine-year
    barrenness; Hercules later escaped sacrifice and killed Busiris and his son.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage explicitly states that the Busiris legend implies an annual human
    sacrifice intended to prevent crop failure or returning infertility.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Busiris is identified as the city called _pe-Asar_, “the house of Osiris,”
    which contained the grave of Osiris; human sacrifices at the grave were said to
    involve red-haired men whose ashes were scattered with winnowing-fans.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Frazer proposes that a red-haired stranger represented ripe corn and Osiris
    at harvest, was slain, mourned, burned, and had his ashes scattered over fields
    to fertilise them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage compares the Egyptian choice of a red-haired representative with
    other customs involving resemblance to crops, including Mexican and African examples,
    Roman red-haired puppies, and a Bavarian sower’s golden ring.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage compares the scattering and winnowing of the Egyptian victim’s
    ashes with Marimo, Khond, Vendée, Mexican, and African practices involving ashes,
    threshing, winnowing, grinding, or agricultural implements.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The story of Osiris’s body fragments being scattered and buried by Isis is
    presented as possibly recalling the division and field-burial of a human victim,
    or as a mythical expression for seed scattering.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The story of Osiris’s body in a coffer being thrown into the Nile by Typhon
    is interpreted as possibly pointing to throwing a victim’s body, body part, or
    later an effigy into water as a rain or Nile-rise charm.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:10
  text: The passage notes an objection that red-haired victims may have represented
    Typhon rather than Osiris, because the victims were called Typhonian and red was
    associated with Typhon; it adds that Osiris is often black but more commonly green,
    and compares green and black Demeter.
  category: other
  evidence_refs:
  - ev:11
