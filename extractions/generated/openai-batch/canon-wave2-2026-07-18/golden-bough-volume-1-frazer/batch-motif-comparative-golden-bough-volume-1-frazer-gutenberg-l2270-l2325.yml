canonical_text:
  quote: ''
  summary: Frazer, quoting Mannhardt, summarizes spring customs in which the spirit
    of vegetation is represented by a May-tree, bough, flower, or by a human figure
    dressed in leaves and flowers. The representative is carried in processions from
    house to house to bring blessings to fowls, fruit trees, and crops, and gifts
    may be requested. Frazer then describes examples from Russia, Little Russia, France,
    Holland, and North Brabant in which girls or boys are dressed in foliage or flowers
    and carried or led through villages.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that spring processions often represent the spirit of vegetation
    by both a May-tree and a man or girl dressed in green leaves or flowers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the same spirit animates the tree, is active in lesser
    plants, manifests in the first flower of spring, appears in a May-rose girl, and
    is associated with the Walber as giver of harvest.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The procession with the representative of the divinity is said to produce
    beneficial effects on fowls, fruit trees, and crops.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mummer is described as an actual representative of the spirit of vegetation
    rather than merely an image.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Attendants on the May-rose and May-tree wish that people who refuse gifts
    such as eggs or bacon should receive no share in the spirit's blessings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says people believed the god of growth was present unseen in the
    bough and was brought by procession to each house to bestow blessing.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Names such as May, Father May, May Lady, and Queen of the May are said to
    blend an anthropomorphic vegetation spirit with a personification of the season.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'The passage describes a sequence of representations: vegetable form alone,
    vegetable and human form together, and finally a living person alone, usually
    marked by leaves, flowers, or a name.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Russian and Little Russian examples include a birch-tree dressed in women's
    clothes, a Pinsk girl enveloped in birch and maple foliage and carried through
    the village, and a girl called a poplar with bright flowers in her hair.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: French and Dutch examples include boys clothing one boy in leaves for house-to-house
