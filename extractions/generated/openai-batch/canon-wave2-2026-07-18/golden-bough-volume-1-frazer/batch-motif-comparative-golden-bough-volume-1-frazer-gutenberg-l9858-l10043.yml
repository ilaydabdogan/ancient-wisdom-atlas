canonical_text:
  quote: they meant to marry _Keremet_ to the kindly and fruitful _mukyl’c in_, the
    earth-wife
  summary: 'In footnote 350, Frazer reports a Wotjak custom described during a period
    of bad harvests: the Wotjaks attributed the calamity to the wrath of the god Keremet
    because he was unmarried, processed to a sacred grove in decorated wagons like
    a bride-fetching party, feasted there, cut out a square piece of turf, and took
    it home. The reported interpretation is tentative: the rite may have been intended
    as a marriage of Keremet to the fruitful earth-wife, mukyl’c in.'
  language: English
  quote_policy: quoted
