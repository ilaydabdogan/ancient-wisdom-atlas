canonical_text:
  quote: ''
  summary: Frazer surveys May and spring customs in which trees, boughs, leaf-clad
    or straw-clad human figures, water-drenching, sacrifice, and house-to-house flower-bearing
    are connected with vegetation, rain, cattle, and household fruitfulness. European
    examples include May singers, May-trees, Father May, Walber, and Green George;
    the Bengal Oraon example centers on sál blossoms, the grove goddess Sarna Burhi,
    and a priest drenched with water after distributing flowers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A May song wishes that people who give nothing lose fowls, grape clusters,
    nuts, and corn; the produce of the year is said to depend on gifts to the May
    singers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children go about on May Day with green boughs, singing, collecting money,
    and are described as bringing plenty and good luck to houses with the spirit of
    vegetation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Russian Lithuania on 1 May, a green tree was set up before the village,
    a chosen girl was crowned and wrapped in birch branches, and people danced, sang,
    and shouted beside the May-tree.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Brie, a May-tree is set up in the village with flowers, leaves, twigs,
    and green branches; girls dance round it while a lad wrapped in leaves and called
    Father May is led about.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Bavaria, a Walber tree is erected before a tavern, and a man called the
    Walber dances round it while covered in straw with ears of corn forming a crown
    above his head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Carinthia on St. George’s Day, young people decorate a felled tree with
    flowers and garlands, carry it in procession, and include a young man called Green
    George clothed in green birch branches.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the close of the Carinthian ceremonies, an effigy of Green George, or in
    some places the young man himself, is thrown or ducked into water with the stated
    intention of ensuring rain for summer greenness.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In some Carinthian places cattle are crowned and driven from their stalls
    while a song says that Green George is brought and should feed the herds well,
    otherwise he is to go to the water.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that powers of making rain and fostering cattle are attributed
    both to the tree-spirit in the tree and to the tree-spirit represented by a living
    man.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Oraons hold a spring festival while sál trees are blossoming, because
    they think the marriage of earth is then celebrated and sál flowers are needed
    for the ceremony.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Oraon villagers go with their priest to the Sarna sacred grove, where the
    goddess Sarna Burhi is supposed to dwell and to influence rain; the priest sacrifices
    five fowls there.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After gathering sál flowers, the priest carries them from house to house;
    women wash his feet, kneel to him, dance with him, and receive flowers over the
    doorway and in their hair.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the priest places sál flowers at a house, the women empty water-jugs
    over him; a feast and all-night dancing by young people follow.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that the flower-bearing priest is equivalent to the goddess
    of the flowering tree, that his drenching is like the ducking of Green George,
    and that he dispenses rain and fruitfulness to houses and especially to women.
  category: relationship
  evidence_refs:
  - ev:9
