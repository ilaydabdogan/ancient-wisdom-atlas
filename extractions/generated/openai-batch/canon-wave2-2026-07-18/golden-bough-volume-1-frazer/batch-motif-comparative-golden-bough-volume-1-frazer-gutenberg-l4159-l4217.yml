canonical_text:
  quote: the common feature of all these persons is that they are dangerous and in
    danger
  summary: Frazer compares taboos applied to sacred rulers, priests, persons associated
    with death, menstruation, childbirth, puberty, homicide, circumcision, and first
    warfare. He emphasizes shared rules of avoidance, exclusive use of vessels or
    clothing, seclusion, purification, and burning of objects, and interprets these
    as attempts to contain a dangerous spiritual force.
  language: English
  quote_policy: quoted
