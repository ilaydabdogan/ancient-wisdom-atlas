canonical_text:
  quote: ''
  summary: Frazer surveys reported customs and mythic examples in which people or
    supernatural figures are said to make wind rise, make wind stop, sell wind, enclose
    wind in objects, or confront wind and storm as a personal force.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage introduces the idea that wind can be made to blow or be still
    by human action.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Yakut traveler uses a stone found in an animal or fish, horse-hair, a stick,
    waving, and a spell to bring a cool breeze.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Omaha Wind clan flap blankets to start a breeze against mosquitoes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Haida Indian performs a fair-wind rite involving fasting, a raven, fire,
    the edge of the sea, four sweeps over water, a spruce-tree, an opened beak, and
    a spoken request for wind for a set number of days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A New Britain sorcerer uses burnt lime, chanting, plant sprigs, a small fire,
    circling the fire, ashes, and water to make wind blow in a chosen direction.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Windbound fishermen at Fladda's chapel walk sunwise round the chapel and pour
    water on a moist bluish stone to obtain a favorable breeze.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Finnish wizards are said to sell wind enclosed in three knots, with stronger
    winds released by undoing successive knots; similar wind-selling is attributed
    in the passage to Lappland, Lewis, and the Isle of Man.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage gives examples of winds enclosed in bags or bamboo, including
    a Norwegian witch's bag, Ulysses' leather bag from Aeolus, Perdoytus' leather
    bag, and the Motumotu idea that an Oiabu sorcerer has a bamboo for each wind.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The author explicitly notes that the discussion has shifted from custom into
    mythology when giving examples such as Aeolus, Perdoytus, and the Motumotu sorcerer.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Shetland old women are said to claim rule over storms and to live by selling
    wind.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Hottentots hang a fat skin on a pole to make the wind lose force, while in
    parts of Austria people throw meal, chaff, or feathers to the wind and tell it
    to stop.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:12
  text: Eskimos of Alaska perform a calm-making ceremony in which a wind demon is
    invited to a fire, water is thrown on the fire, arrows and guns are discharged,
    and cannon fire is requested.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Payaguas, Guaycurus, and Batta villagers confront storm or wind with firebrands,
    fists, screaming, weapons, and blows at an invisible foe.
  category: action
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
