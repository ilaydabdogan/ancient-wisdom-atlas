comparison_claims:
- id: claim:1
  claim: Within the passage, the Finnish knots, Norwegian witch's bag, Aeolus' leather
    bag, Perdoytus' leather bag, and the Motumotu sorcerer's bamboo are functionally
    comparable as containers from which winds may be released or controlled.
  claim_level: same_function
  target: wind-container pattern across custom and mythology examples
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage supports functional comparison only; it does not provide
    evidence for historical contact or common inheritance.
- id: claim:2
  claim: The passage presents object-manipulation rites among Yakut, Omaha, Haida,
    New Britain, and Fladda examples as comparable ways to obtain or produce wind.
  claim_level: same_function
  target: ritual wind-making practices
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The ritual details differ substantially, and the comparison follows
    Frazer's cataloguing context rather than a stated shared origin.
- id: claim:3
  claim: The Austrian, Alaska Eskimo, Payagua, Guaycuru, and Batta examples are comparable
    in treating wind or storm as an addressee, demon, enemy, or target of intimidation.
  claim_level: same_function
  target: personified wind appeased, frightened, or attacked
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  - ev:14
  - ev:15
  counter_evidence_refs: []
  confidence: medium
  limitations: The degree of personification varies; some examples explicitly mention
    a demon or invisible foe, while others show personifying treatment through speech
    or action.
