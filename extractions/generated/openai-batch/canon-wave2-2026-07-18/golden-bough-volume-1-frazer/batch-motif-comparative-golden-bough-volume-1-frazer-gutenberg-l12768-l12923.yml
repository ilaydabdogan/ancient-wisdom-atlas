canonical_text:
  quote: ''
  summary: 'A block of footnotes cites sources and gives extended comparative notes
    on agricultural folk customs: a Cingalese threshing-floor knot meant to prevent
    devils from reducing a grain heap; a Thüringen Rush-cutter detected by a threshing
    test; and several customs of leaving or knotting unreaped crop portions for named
    beings such as the Old Rye-woman, Corn-mother, Little Wood-woman, Old Woman, Volos,
    and the aul'' man.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Cingalese threshing-floor custom called Goigote, after a sheaf has
    been threshed and before it is removed, the grain is heaped up and the threshers
    sit around it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The threshers take stalks with ears of corn attached, tie a knot jointly,
    and bury it in the grain heap until threshing, winnowing, and measuring are finished.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stated object of the Goigote ceremony is to prevent devils from diminishing
    the amount of corn in the heap.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Frazer states that the key in a European custom is probably intended to serve
    the same purpose as the knot in the Cingalese custom.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Thüringen, a dreaded being called the Rush-cutter was said to walk through
    fields on St. John's Day with sickles tied to his ankles, cutting avenues in the
    corn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: To detect the Rush-cutter, seven bundles of brushwood were silently threshed
    on the threshing-floor; the stranger appearing at the barn door during the threshing
    was identified as the Rush-cutter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The note says that in some customs a little of the crop is left on the field
    for a spirit under names other than the Poor Old Woman.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Neftenbach, the first three ears of corn reaped are thrown away on the
    field to satisfy the Corn-mother and to make the next year's crop abundant.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Thüringen, when after-grass is gathered, a little heap is left on the field
    for the Little Wood-woman in return for her blessing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Kupferberg in Bavaria, some corn is left standing and is said to belong
    to the Old Woman, with words asking that she be kind again the next year.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: In Russia, a patch of unreaped corn is left in the field, the ears are knotted
    together, and the practice is called the plaiting of the beard of Volos.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Russian unreaped patch is described as tabooed, with a belief that anyone
    who meddles with it will shrivel and become twisted like the interwoven ears.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the North-east of Scotland, a few stalks were sometimes left unreaped for
    the aul' man; Frazer says this is probably equivalent to the German Old Man.
  category: relationship
  evidence_refs:
  - ev:7
