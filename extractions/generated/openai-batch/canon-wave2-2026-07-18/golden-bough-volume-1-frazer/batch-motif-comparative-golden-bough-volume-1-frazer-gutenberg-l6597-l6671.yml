  basis: Isis, sister and wife of Osiris, mourns and searches for his body and later
    for the scattered fragments.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The body is hidden, carried away, and scattered; the passage does not
