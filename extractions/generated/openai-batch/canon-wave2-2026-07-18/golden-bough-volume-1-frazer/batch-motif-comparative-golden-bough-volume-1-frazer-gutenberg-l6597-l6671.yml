candidate_motifs:
- id: motif:1
  label: divine civilizer introduces agriculture and law
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: Osiris gives laws, teaches worship, introduces grain cultivation, and travels
    spreading civilization; Isis discovers wheat and barley.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage frames these actions within Frazer’s summary of the Osiris
    myth, not as an independently quoted Egyptian source.
- id: motif:2
  label: god killed in a sealed vessel cast onto water
  taxonomy_refs:
  - ark_vessel
  - death_rebirth
  basis: Osiris is trapped in a decorated coffer, sealed, thrown into the Nile, and
    carried by water to the sea.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The available taxonomy has an ark/vessel family, but the object in the
    mythic murder is specifically a coffer rather than an ark.
