canonical_text:
  quote: ''
  summary: 'Frazer summarizes the myth of Osiris: Osiris civilizes Egypt, is killed
    by Set/Typhon in a sealed coffer cast into the Nile, is sought by Isis, enclosed
    in a Byblus tree-pillar, retrieved, dismembered into fourteen pieces, searched
    for and buried by Isis, and avenged by Horus. The passage then summarizes annual
    rites for Osiris’ death and burial, including mourning, search, lamentation, Sokari
    processions, erection of the Ded pillar, and a Plutarch-reported ark, golden casket,
    water, and crescent image rite.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Osiris is described as son of the earth-god Qeb/Seb and as a king on earth
    who gave laws and taught worship of the gods.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Isis, identified as the sister and wife of Osiris, discovered wild wheat and
    barley; Osiris introduced their cultivation, after which Egyptians abandoned cannibalism
    for a corn diet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Osiris travelled over the world spreading civilization.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Set/Typhon and seventy-two others plotted against Osiris, trapped him in a
    decorated coffer, sealed it with nails and molten lead, and threw it into the
    Nile, from which it floated to the sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Isis mourned and searched for Osiris’ body until she found the coffer at Byblus
    on the Syrian coast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: An erica tree had grown around the coffer, and the King of Byblus had cut
    the tree down and made it into a palace pillar; Isis opened the trunk and removed
    the coffer.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Typhon later found the coffer while hunting a boar by full moon, recognized
    Osiris’ body, tore it into fourteen pieces, and scattered the pieces.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Isis travelled through the marshes in a papyrus boat seeking the fragments
    and buried each fragment she found; this was given as an explanation for many
    graves of Osiris in Egypt.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Another version says Isis left an effigy of Osiris in every city so Osiris
    could be worshipped in many places and Typhon could not find the real corpse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Horus fought Typhon, conquered and bound him; Isis released Typhon, angering
    Horus, who removed his mother’s crown before Hermes replaced it with a cow-head-shaped
    helmet.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that the rest of the myth included the dismemberment of
    Horus and the beheading of Isis.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Annual rites of Osiris’ death and burial included five days of mourning, earth-ploughing,
    search for the mangled body, rejoicing at its discovery, burial, and lamentations
    attributed to Isis and Nephthys.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The next day was a joyous festival of Sokari, the hawk-headed Osiris of Memphis,
    with priestly processions carrying banners, images, and sacred emblems around
    temples.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The festival ended with erection of the Tatu/Tat/Ded pillar, a column with
    crossbars at the top; a Theban tomb shows the king, relatives, and a priest raising
    it with ropes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Ded pillar is said to have been interpreted in later Egyptian theology
    as the backbone of Osiris, and Frazer reports an interpretation of its erection
    as representing Osiris’ resurrection.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: Plutarch is reported as describing priests carrying a sacred ark to the sea,
    pouring drinking-water into a golden casket, shouting that Osiris was found, and
    forming and adorning a crescent-shaped image from mould mixed with water.
  category: sequence
  evidence_refs:
  - ev:9
