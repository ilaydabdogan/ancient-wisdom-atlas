canonical_text:
  quote: ''
  summary: 'The passage describes two reported temporary-rulership ceremonies: in
    Siam, a three-day temporary king performs agricultural and omen rites while enjoying
    royal privileges; in Upper Egypt, towns choose a three-day mock ruler who deposes
    the governor, holds tribunal, and is then ritually condemned, with a shell burned
    and a Fellah emerging from the ashes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Siam, a temporary king is appointed for three days on the sixth day of
    the moon in the sixth month, while the real king remains shut in his palace.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Siamese temporary king’s satellites seize and confiscate goods in bazaars,
    shops, and harbour vessels, which must be redeemed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Siamese temporary king goes to a city field where a gilded plough drawn
    by decorated oxen is brought, the plough is anointed, and the oxen are rubbed
    with incense.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Siamese mock king draws nine furrows, followed by aged palace dames scattering
    the first seed of the season.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Spectators scramble for the newly sown seed, believing that mixing it with
    seed-rice will ensure a plentiful crop.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the ploughing, foods are set before the oxen; the first food eaten is
    treated as an omen for the coming year, though interpretations differ.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Siamese temporary king stands leaning against a tree with one foot resting
    on the other knee, is popularly called King Hop, and officially titled Phaya Phollathep,
    “Lord of the Heavenly Hosts.”
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A second Siamese ceremony in the cold season lasts three days and includes
    procession to an open place opposite the Temple of the Brahmans, where poles dressed
    like May-poles are used for swinging.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: During the second Siamese ceremony, the Lord of the Heavenly Hosts stands
    on one foot on a decorated seat under a gilt canopy, with Brahmans standing at
    his sides, while other Brahmans swing and dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Dancing Brahmans draw water from a copper caldron with buffalo horns and sprinkle
    it on the people; this is said to bring luck, peace, health, and prosperity.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: If the Siamese officiant lets his foot down, this is treated as a bad omen
    for state and throne and brings penalties; if he stands firm, he is believed to
    have gained victory over evil spirits and retains seizure privileges.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In Upper Egypt, on the first day of the Coptic solar year when the Nile is
    generally highest, regular government is suspended for three days and each town
    chooses a ruler.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Upper Egyptian temporary lord wears a tall fool’s cap, long flaxen beard,
