canonical_text:
  quote: ''
  summary: Frazer presents comparative examples in which winds, whirlwinds, and dust
    columns are treated as animate or spirit-bearing forces that can be attacked,
    driven away, or interpreted as moving spirits or souls. He then generalizes that
    early thought blurs the distinction between humans and gods, treats supernatural
    agents as coercible, and later shifts from magic toward prayer, sacrifice, and
    eventually natural-law reasoning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Herodotus is reported as saying that the Psylli marched in a body to make
    war on the south wind after Sahara wind dried their water-tanks, and that the
    simoom buried them in the desert.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Bedouins of Eastern Africa pursue whirlwinds with drawn creeses
    and stab into the dusty column to drive away an evil spirit believed to ride on
    the blast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Australia, red sand columns moving across the desert are said to be regarded
    as spirits passing along.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: An athletic young black man is said to have run after a moving sand column
    to kill it with boomerangs, returned weary, said he had killed Koochee, and also
    said Koochee had growled at him and he must die.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In some parts of India, dust columns are supposed to be bhuts going to bathe
    in the Ganges.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Californian Indians are said to think dust columns are happy souls ascending
    to the heavenly land.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Breton peasant throws a knife or fork at a gust lifting hay to prevent the
    devil from carrying off the hay.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: German peasants throw a knife or hat at a whirlwind because they believe a
    witch or wizard is in it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Frazer states that, in the stage of thought under discussion, supernatural
    agents are not treated as greatly superior to humans and may be frightened or
    coerced into doing human will.
  category: other
  evidence_refs:
  - ev:9
- id: obs:10
  text: Frazer describes a later ritual shift in which prayer and sacrifice take the
    leading place while magic is relegated to the background, and then says magic
    later helps prepare the way for science by investigating causal sequences.
  category: sequence
  evidence_refs:
  - ev:10
