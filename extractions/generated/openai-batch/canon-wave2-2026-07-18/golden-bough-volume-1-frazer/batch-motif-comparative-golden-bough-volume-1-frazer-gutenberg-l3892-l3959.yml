canonical_text:
  quote: ''
  summary: Frazer surveys examples in which travelers, strangers, envoys, gifts, foreign
    goods, or foreign contact are treated as dangerous through magic, disease, or
    poison, requiring purification, quarantine, ordeal, avoidance, or ritual rebirth
    before social or royal contact.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person returning from a journey is said to be suspected of having contracted
    magical evil from strangers and may need purification before re-entering the society
    of tribe and friends.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bechuanas are described as cleansing themselves after journeys by shaving
    their heads and similar acts to avoid evil contracted from strangers by witchcraft
    or sorcery.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In parts of Western Africa, a man returning after a long absence must wash
    with a particular fluid and receive a mark on his forehead from a sorcerer before
    visiting his wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two Hindoo ambassadors returning from England are described as polluted by
    contact with strangers and restored to purity by being dragged through a pure-gold
    image associated with the female power of nature or the sacred Yoni.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Damaras returning after a long absence are given a small portion of fat from
    particular animals said to possess virtues.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: In some of the Moluccas, a young girl waits at the door with water in a caladi
    leaf, throws the water over the face of a returning brother or young blood-relation,
    and welcomes him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: On Savage Island, strangers in distress and returning islanders from ships
    are said to have been killed from fear of disease, and ship-goods were hung in
    the bush for weeks before use.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Envoys visiting a Tartar Khan, together with the gifts they brought, had to
    pass between two fires before admission to his presence.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Subject chiefs and retinues visiting Kalamba bathe in two brooks on two successive
    days, sleep in the open market-place, approach Kalamba naked, receive white marks,
    dress, and undergo a pepper ordeal with confession, questions, and vows.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: At Kilema, a stranger is besmeared or besprinkled with a medicine made from
    a distant plant or tree mixed with sheep or goat blood before being admitted to
    the king.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The kings of Monomotapa, Kakongo, and Loango are described as avoiding foreign
    stuffs, European goods, contact with persons wearing foreign stuffs, or the sight
    of a white man's house.
  category: relationship
  evidence_refs:
  - ev:11
