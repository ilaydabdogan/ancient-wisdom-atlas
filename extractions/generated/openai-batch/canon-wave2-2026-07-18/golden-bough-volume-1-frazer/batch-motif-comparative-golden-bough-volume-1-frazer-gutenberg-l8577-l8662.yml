canonical_text:
  quote: ''
  summary: Frazer interprets Khond Meriah sacrifices and other cited human sacrifices
    as rites in which the victim's body, blood, tears, ashes, or flesh are treated
    as having direct fertilizing, rain-making, or crop-identifying power. He then
    compares these practices with European harvest customs involving the corn-spirit,
    the last sheaf, symbolic killing, and water rites.
  language: English
  quote_policy: summarized
