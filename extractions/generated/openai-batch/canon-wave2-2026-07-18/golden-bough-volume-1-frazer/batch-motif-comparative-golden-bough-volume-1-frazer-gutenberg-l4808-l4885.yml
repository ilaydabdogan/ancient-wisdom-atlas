- id: obs:1
  text: The passage states that in some places a king was killed after a year of reign
    and replaced by a new king.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Babylonian Sacaea is described as an annual five-day festival beginning
    on the sixteenth day of the month Lous.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the Sacaea, masters and servants changed places, with servants giving
    orders and masters obeying.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A condemned prisoner was dressed in royal robes, seated on the king’s throne,
    allowed to command, feast, enjoy himself, and lie with the king’s concubines.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the end of the five days, the condemned mock king was stripped of royal
    robes, scourged, and crucified.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage argues that the condemned man’s access to the king’s concubines
    indicates that he was to die in the king’s stead and had to exercise full royal
    rights during the brief substitution.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage presents the Babylonian custom as a modification of a stricter
    rule requiring the king’s death after bodily decay or a fixed period.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says that the king could abdicate for a few days while a temporary
    king reigned and suffered in his place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that the king is slain in his character as a god and that
