canonical_text:
  quote: ''
  summary: Frazer discusses customs in which a king is killed, replaced temporarily
    by a substitute, or symbolically displaced during an annual festival. The passage
    describes the Babylonian Sacaea, where a condemned prisoner is made mock king
    and then executed, and a Cambodian rite in which the king abdicates for three
    days while a temporary King February processes and conducts a rice-harvest rite.
  language: English
  quote_policy: summarized
