  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Cambodia, the king annually abdicated for three days in the month of Méac
    and refrained from acts of authority, touching seals, and receiving revenues.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Cambodian temporary king was called Sdach Méac, or King February, and
