canonical_text:
  quote: ''
  summary: Frazer describes several Central and Eastern European customs called Carrying
    out or Driving out Death. Communities make a puppet, straw-man, doll, or other
    effigy named Death, carry it out of a village or town, and destroy it by drowning,
    burning, beating, dismembering, or throwing it away. Songs and statements often
    pair the removal of Death with bringing in Summer, Spring, the New Year, or Life.
    Some variants attach omens of death, redemption by money, fertility wishes, food
    rewards, and protection from sickness or plague to the rite.
  language: English
  quote_policy: summarized
