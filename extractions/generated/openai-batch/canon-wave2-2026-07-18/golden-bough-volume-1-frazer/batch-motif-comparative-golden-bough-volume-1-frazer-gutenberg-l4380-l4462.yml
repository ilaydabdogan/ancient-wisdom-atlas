canonical_text:
  quote: It is a common rule that royal blood must not be shed upon the ground.
  summary: The passage surveys reported customs in which royal, chiefly, human, or
    animal blood is kept from falling on the ground. It gives examples of non-bloody
    executions, blood received on bodies or vessels, animal killing without bloodshed,
    and an explanation that blood is connected with the soul and can make places or
    objects taboo or sacred.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states a rule that royal blood must not be shed on the ground
    and that executions of kings or royal family members are arranged to avoid spilling
    royal blood on the earth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Siamese examples, a rebel generalissimo has the King of Siam killed
    in an iron caldron with wooden pestles so that royal blood does not mix with earth;
    other listed modes include starvation, suffocation, use of scarlet cloth and scented
    wood, sewing in a leather sack with a stone and throwing into a river, and breaking
    the neck with sandal-wood clubs before water disposal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kublai Khan has Nayan killed by wrapping him in a carpet and tossing him until
    death, with the stated reason that imperial-line blood should not be spilled on
    the ground or exposed before Heaven and the Sun; related Tartar, Burmese, and
    Tonquin examples are also given.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage lists royal or noble bloodshed-avoidance examples from Ashantee,
    Madagascar, and Uganda, including drowning, burning alive, and burning a young
    king's brothers while preserving a few for succession.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage extends the pattern beyond royalty by describing a general reluctance
    to shed blood or let it fall on the ground, including punishment by beating in
    Cambaluc and white blankets placed under Captain Christian at execution.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Australian examples describe blood from circumcision, tooth-removal initiation,
    medical bleeding, and a rain-making ceremony being received on or sprinkled upon
    human bodies rather than allowed to fall on the ground.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the South Celebes childbirth example, a female slave stands under a raised
    house and receives blood in a basin on her head as it trickles through the bamboo
    floor.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage gives animal examples in which cattle or food animals are stoned,
    beaten, suffocated, stunned, or suffocated in smoke so that blood is not shed;
    it also notes that cattle may be invested with sanctity among some pastoral groups.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage proposes that reluctance to shed blood on the ground is probably
    explained by belief that the soul is in the blood and that ground touched by such
    blood becomes taboo or sacred.
  category: other
  evidence_refs:
  - ev:9
- id: obs:10
  text: New Zealand examples state that a high chief's blood falling on a canoe or
    in a house makes the canoe or house sacred to the chief.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage concludes that a general prohibition on spilling a tribesman's
    blood on the ground applies with special strictness to chiefs and kings and may
    survive for them after it ceases for others.
  category: relationship
  evidence_refs:
  - ev:11
