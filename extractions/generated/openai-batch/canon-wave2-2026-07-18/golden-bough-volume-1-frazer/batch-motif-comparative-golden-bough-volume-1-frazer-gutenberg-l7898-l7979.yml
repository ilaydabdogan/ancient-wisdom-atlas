canonical_text:
  quote: "“death and resurrection of Proserpine”"
  summary: Frazer explains Greek corn mythology through a proposed shift from an immanent
    corn-spirit to an external corn deity, producing double personifications such
    as Demeter and Proserpine. He then connects Proserpine’s death and resurrection
    with vegetation deities and with harvest or vintage customs associated with Osiris,
    Adonis, Attis, and Dionysus.
  language: English
