literal_observations:
- id: obs:1
  text: In the cited Bion passage, the anemone is said to spring from tears and the
    rose from the blood of Adonis.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Alexandrian ceremony as described here, only the image of Adonis appears
    to have been thrown into the sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The note states that Myrrha or Smyrna is borrowed from Phoenician and that
    the mother's name as well as the son's was taken directly from the Semites.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Egyptians are said to have celebrated the nativity of the sun's walking-sticks
    after the autumnal equinox, when the sun's heat and light diminished and it was
    supposed to need a staff.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Greek scholion cited in the passage interprets Adonis as sown grain that
    spends six months in the earth and six months with Aphrodite, understood as the
    temperate air.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Jerome's cited interpretation connects the killing and resurrection of Adonis
    with seeds dying in the earth and crops being reborn from dead seeds.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Other cited sources interpret Adonis rites or the figure of Adonis as referring
    to mature crops, seasonal fruits, or the cutting of ripe fruits.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Several cited authorities mention women as planting the Gardens of Adonis,
    while another wording allows either male or female planters.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The note says that in hot southern countries dependent on irrigation, the
    purpose of the charm is to secure a plentiful flow of water in streams.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The month Thammuz is described as varying by local Syrian calendars from midsummer
    to autumn, or from June to September.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: A Sardinian custom is noted in which pots are kept in a dark warm place and
    children leap across the fire.
  category: action
  evidence_refs:
  - ev:10
