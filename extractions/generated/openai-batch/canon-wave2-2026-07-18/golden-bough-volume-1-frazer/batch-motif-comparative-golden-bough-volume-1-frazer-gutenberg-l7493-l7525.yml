  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In parts of Bavaria and Thüringen, the man who threshes the last sheaf is
    said to have the Old Woman or Old Corn-woman, is tied in straw, carried or carted
    about, and finally set on a dunghill or taken to a neighbour who has not finished
    threshing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In Poland, the last-stroke thresher is called Baba, is wrapped in corn, and
    is wheeled through the village.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Lithuania, the last sheaf is sometimes not threshed, but is shaped as a
    female figure and carried to the barn of a neighbour who has not finished threshing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: In parts of Sweden, a stranger woman on the threshing-floor may be encircled
    with a flail, have corn-stalks wound round her neck, receive a crown of ears,
    and be called the Corn-woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Swedish stranger woman is described as being taken to be the corn-spirit
