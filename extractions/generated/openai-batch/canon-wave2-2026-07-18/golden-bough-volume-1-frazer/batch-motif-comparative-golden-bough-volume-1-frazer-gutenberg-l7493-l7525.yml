canonical_text:
  quote: ''
  summary: Frazer describes European threshing-floor customs in which the corn-spirit
    is thought to retreat into the last sheaf, which is called Mother-corn, Old Woman,
    Baba, or Corn-woman. The last thresher, a female-shaped sheaf, a stranger woman,
    or the farmer’s wife may be treated as the corn-spirit through wrapping, carrying,
    naming, mock threshing, or mock winnowing.
  language: English
  quote_policy: summarized
