  text: The corn-spirit in the last sheaf is described as either perishing under blows
    of the flail or fleeing to still-unthreshed corn on a neighbouring farm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The last corn to be threshed is called Mother-corn or the Old Woman.
  category: speech
  evidence_refs:
