  quote: ''
  summary: Footnotes discuss the date of the Osiris death festival, annual finding
    and burial rites for Osiris, ancient references to Osiris’s dismemberment, revivals,
    rebirths, and burials, agricultural interpretations of Osiris as grain or fertile
    power, ritual actions involving wood, linen, libations, and a moon-shaped chest,
    and a comparison between Isis and Demeter as mourning goddesses who sit by a well
    while searching for a lost loved one.
