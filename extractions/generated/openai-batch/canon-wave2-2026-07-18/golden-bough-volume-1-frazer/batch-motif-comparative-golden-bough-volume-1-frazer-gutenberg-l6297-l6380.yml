canonical_text:
  quote: ''
  summary: Frazer argues that the gardens of Adonis are vegetation charms, then describes
    a Bengal Karma tree festival connected with rice planting and a Sardinian St.
    John midsummer custom involving pots of rapidly sprouted grain. He interprets
    the Bengal tree, barley blades, and water immersion as crop-growth and rain charms,
    and compares the Sardinian grain pots and former images in them to the gardens
    and images of Adonis.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that gardens of Adonis are regarded as charms to promote
    vegetation, especially crops, and are compared with spring and midsummer folk-customs
    of modern Europe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Oraons and Mundas, young people of both sexes cut a young Karma
    tree or branch in the forest, return with dancing, singing, and drums, and plant
    it in the middle of the village dancing-ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A sacrifice is offered to the Karma tree, and the next morning youths linked
    arm-in-arm dance in a circle around the tree, which is decorated with coloured
    cloth and straw ornaments.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The head-man’s daughters cultivate pale yellow barley blades in moist sandy
    soil mixed with turmeric, carry the blades in baskets, prostrate themselves, and
    place some before the Karma tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the festival actions, the Karma tree is removed and thrown into a stream
    or tank.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The author interprets the Karma tree rite as fostering rice growth, the barley
    blades as stimulating the tree-spirit with a visible example of rapid plant growth,
    and the immersion of the tree as a rain-charm.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage contrasts the Bengal rite, where the tree-spirit appears as a
    tree, with Adonis worship, where the spirit appears anthropomorphically as a dead
    man and the gardens indicate his vegetable nature.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: In Sardinia, a young man asks a girl to be his comare or sweetheart and offers
    to be her compare; her family accepts the invitation as an honour.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Sardinian girl makes a cork-bark pot, fills it with earth, sows wheat
    and barley, waters it in the sun, and by St. John’s Eve the grain has sprouted;
    the pot is called Erme or Nenneri.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: On St. John’s Day, the young man and girl process to a church with attendants,
    break the grain pot against the church door, then eat, drink, sing, join hands,
    and dance in a ring.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: At Ozieri, grain pots are placed on decorated window-sills; formerly a female-dressed
    statuette, cloth doll, or Priapus-like paste figure was placed on each pot, but
    the Church forbade the practice.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: At Ozieri, a bonfire is kindled; a young man and girl stand on opposite sides,
    grasp a long stick across the fire, pass it three times back and forth, and this
    seals their relationship.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The passage states that the Sardinian pots of grain correspond to the gardens
    of Adonis and that the former images in the pots answer to images of Adonis.
  category: relationship
  evidence_refs:
  - ev:12
