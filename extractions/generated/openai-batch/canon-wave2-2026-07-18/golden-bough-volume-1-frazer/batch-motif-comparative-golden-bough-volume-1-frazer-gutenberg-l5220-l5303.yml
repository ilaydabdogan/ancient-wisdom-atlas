canonical_text:
  quote: ''
  summary: The passage catalogs several Central European Whitsuntide and Shrovetide
    customs involving disguised Wild Men or Kings. These figures are dressed in vegetation,
    bark, straw, flowers, or crowns; chased, captured, struck, shot at, stabbed, tried,
    symbolically beheaded, carried away, revived, or represented by an effigy thrown
    into water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Saxony and Thüringen, a Whitsuntide ceremony involves a young man enveloped
    in leaves or moss and called the Wild Man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Saxony/Thüringen Wild Man hides in the wood, is sought by village lads,
    led captive out of the wood, and fired at with blank muskets.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Saxony/Thüringen Wild Man falls as if dead, is bled by a lad dressed as
    a doctor, comes to life again, is bound on a waggon, and is taken through the
    village for gifts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the Erzgebirge custom, two men disguised as Wild Men, one in brushwood
    and moss and one in straw, are led through streets, chased in the marketplace,
    shot, and stabbed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Erzgebirge Wild Men carry bladders from which they spurt blood on the
    people before being carried on boards to the alehouse.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Near Schluckenau, a Wild Man is chased through streets, trips over a cord,
    is caught, and an executioner stabs a blood-filled bladder worn on his body so
    that blood reddens the ground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Schluckenau custom, a straw-man made to look like the Wild Man is placed
    on a litter the next day and thrown into a pool; the ceremony is called burying
    the Carnival.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In Semic, a Whit-Monday King wears a tree-bark robe adorned with flowers,
    a bark crown decorated with flowers and branches, ferns around his feet, a mask,
    and carries a hawthorn switch.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Semic King is led through the village by a rope fastened to his foot,
    chased around farmhouses, and struck on his bark robe with a wooden sword before
    a gratuity is demanded.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the Königgrätz district, young men and girls assemble under lime-trees,
    make garlands, choose a King and Queen, process to the alehouse, and crown them
    with garlands.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the Königgrätz district, the King is accused, tried, judged, made to kneel
    on a white cloth if guilty, and symbolically beheaded when a crier strikes hats
    off his head with a wooden sword.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the Pilsen district, a bark-clad King wearing flowers, ribbons, and a gilt
    paper crown rides a flower-decked horse to a green bough arbour under May-trees.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the Pilsen custom, the King flees on horseback; if caught, he is scourged
    or beaten, dismounted, and the executioner strikes off his crown while bystanders
    cry out.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage explicitly calls the Schluckenau rite very similar to an Erzgebirge
    Shrovetide custom and later refers to Bohemian examples as mimic executions.
  category: relationship
  evidence_refs:
  - ev:7
