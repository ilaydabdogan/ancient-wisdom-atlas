candidate_motifs:
- id: motif:1
  label: Reflection as external soul or life-double
  taxonomy_refs: []
  basis: Multiple cited examples identify a person’s reflection in water or a mirror
    with the person’s soul, and Frazer names this the reflection-soul.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The evidence is Frazer’s comparative summary of reported beliefs, not
    direct primary field testimony in this passage.
- id: motif:2
  label: Harm or capture of reflection causes death or soul-loss
  taxonomy_refs: []
  basis: The passage describes stabbing or threatening a reflection, beasts or crocodiles
    taking reflections, a spirit taking life through a reflection, and water-spirits
    dragging the reflection-soul under water.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The examples come from different traditions and are presented through
    Frazer’s synthesis.
- id: motif:3
  label: Avoidance or concealment of reflecting surfaces protects the soul
  taxonomy_refs: []
  basis: The passage cites taboos against looking into water, customs of covering
    or turning mirrors after death, covering shiny things, and covering mirrors during
    illness or at night.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The protective rationale is partly Frazer’s explanatory framing.
- id: motif:4
  label: Fatal sight of water-being or water-reflection leading to pining death
  taxonomy_refs: []
  basis: Frazer connects Narcissus’s death after seeing his reflection with an English
    superstition that whoever sees a water-fairy must pine and die.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The Narcissus connection is explicitly presented as Frazer’s hypothesis
    about an earlier meaning of the story.
- id: motif:5
  label: Multiple souls with divergent fates
  taxonomy_refs: []
  basis: Some Fijians are reported to believe in a dark soul going to Hades and a
    light soul identified with reflection.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: Only one example of this specific two-soul distinction appears in the
    passage.
- id: motif:6
  label: Sleep or dream as risky soul projection
  taxonomy_refs: []
  basis: The passage compares mirror dangers with dreams and sleep, in which the soul
    is projected out of the body and may meet a ghost or fail to return.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: medium
  cautions: This motif appears mainly as a comparison used to explain mirror customs
    rather than as the passage’s central topic.
comparison_claims:
- id: claim:1
  claim: 'The passage explicitly treats the reflection-soul as functionally parallel
    to the shadow-soul: both are external forms of the person exposed to injury or
    capture.'
  claim_level: same_function
  target: shadow-soul vulnerability pattern
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: This is Frazer’s analytic comparison within the passage and does not
    establish historical contact among the cited traditions.
- id: claim:2
  claim: The passage explicitly compares mirror-covering after a household death with
    the Aru custom of not sleeping in a house after a death, because both guard the
    projected soul from a lingering ghost.
  claim_level: same_function
  target: Aru custom of not sleeping in a house after a death
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: Only the functional analogy is supported here; no shared origin is
    demonstrated.
- id: claim:3
  claim: The passage explicitly compares covering mirrors in a sick-room with rules
    forbidding sick people to sleep, because both practices respond to a danger that
    the soul may leave the body and not return.
  claim_level: same_function
  target: rules against allowing sick people to sleep
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is explanatory and does not by itself show historical
    relationship.
- id: claim:4
  claim: Frazer treats the Narcissus story as belonging to the same broad motif pattern
    as beliefs that seeing one’s reflection in water endangers the soul.
  claim_level: same_motif
  target: classical story of Narcissus
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states this as a probable origin and notes that the later
    love-of-self explanation may have replaced an older meaning.
- id: claim:5
  claim: The passage presents mirror-covering or mirror-turning after death as a recurrent
    custom with the same protective function across several named regions and communities.
  claim_level: same_function
  target: mirror-covering customs after death in Oldenburg, Germany, England, Scotland,
    Madagascar, and among Suni Mohammedans of Bombay
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The recurrence is reported in the passage, but independent invention,
    diffusion, or common inheritance is not established.
