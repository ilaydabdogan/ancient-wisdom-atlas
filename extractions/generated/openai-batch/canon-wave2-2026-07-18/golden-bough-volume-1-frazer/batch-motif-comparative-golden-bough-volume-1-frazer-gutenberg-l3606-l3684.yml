  text: The Andamanese are reported to regard reflections in mirrors, rather than
    shadows, as souls.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Some Fijians are reported to distinguish two souls: a dark one that goes
    to Hades and a light one that is the person’s reflection in water or a mirror.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Motumotu of New Guinea are reported to have thought their looking-glass
    reflections were their souls.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
