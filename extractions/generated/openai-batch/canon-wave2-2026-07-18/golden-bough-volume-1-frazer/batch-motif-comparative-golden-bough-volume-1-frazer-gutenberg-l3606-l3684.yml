canonical_text:
  quote: ''
  summary: Frazer surveys beliefs and customs in which a person’s reflection in water
    or a mirror is treated as a soul or external life-double. The passage lists dangers
    to the reflection, taboos against looking into water, interpretations of Narcissus
    and water-fairy lore, and customs of covering mirrors after death, during illness,
    or at night to prevent soul-loss or capture by ghosts or other beings.
  language: English
  quote_policy: summarized
