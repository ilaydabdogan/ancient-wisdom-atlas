- id: obs:4
  text: Frazer describes an early mode of thought in which the world is worked by
    personal supernatural agents who may be moved by appeals.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says prayers, promises, or threats may be used to secure fine
    weather and crops from gods, and that a person who believes a god is incarnate
    in himself need appeal to no higher power.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Frazer defines one principle of sympathetic magic as the production of an
    effect by imitating it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: One example says a person's image may be made and destroyed in the belief
    that the represented person will suffer and perish simultaneously.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Moroccan example describes a fowl or pigeon with a red bundle charm tied
    to its foot; the charm's constant motion is believed to keep the target person
    restless.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Nias example says a captured wild pig's back is rubbed with nine fallen
    leaves so that nine more wild pigs will fall into the pit as the leaves fell from
