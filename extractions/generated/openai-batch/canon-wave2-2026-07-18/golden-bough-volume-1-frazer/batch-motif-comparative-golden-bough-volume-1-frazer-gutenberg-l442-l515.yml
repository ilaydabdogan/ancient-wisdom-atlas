  text: Ancient kings are described as commonly holding priestly office, but the passage
    says this does not exhaust the religious aspect of kingship.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kings are described as revered in many cases not merely as priestly intercessors
    but as gods able to bestow blessings on subjects and worshippers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kings are said to be expected to provide rain, sunshine in due season, crop
    growth, and similar benefits.
  category: action
  evidence_refs:
