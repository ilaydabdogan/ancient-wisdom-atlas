    the net to catch game.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'Crop-sowing examples connect bodily or object length and motion with desired
    crop growth: a flax sower uses a long swaying seed bag and long strides, while
    Sumatra rice sowers let their hair hang loose to obtain long stalks.'
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The passage says magic sympathy is believed to exist between a person and
    severed hair or nails, allowing someone possessing them to affect the person at
    a distance.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage says rules govern people left at home while friends are fishing,
    hunting, or at war, because breaches are believed to injure the absent friends
    in corresponding ways.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: In the Dyak example, a head-hunter's wife or sister must wear a sword day
    and night and avoid daytime sleep or early bedtime so he will think of his weapons
    and not be surprised by an enemy while asleep.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: In the Laos example, an elephant hunter warns his wife not to cut her hair
