canonical_text:
  quote: ''
  summary: 'Frazer argues that ancient kings were often treated not only as priests
    but as divine beings expected to secure rain, sunshine, crops, and other blessings.
    He then explains two routes to the idea of a man-god: belief in personal supernatural
    agencies and belief in sympathetic magic. The passage gives examples of imitative
    and contact magic involving images, charms, animals, leaves, nets, crop-sowing
    gestures, hair, nails, and conduct rules for relatives of absent hunters or warriors.'
  language: English
  quote_policy: summarized
literal_observations:
