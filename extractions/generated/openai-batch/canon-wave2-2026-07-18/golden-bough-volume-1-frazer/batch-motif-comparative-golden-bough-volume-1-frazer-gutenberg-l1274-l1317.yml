literal_observations:
- id: obs:1
  text: Spanish conquerors entering the Colombian Andes are described as finding the
    Chibchas, Muyscas, or Mozcas living with agriculture, two kingdoms, and a spiritual
    allegiance to the high pontiff of Sogamozo or Iraca.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The high pontiff of Sogamozo or Iraca is said to have gained sanctity through
    a long ascetic novitiate, so that waters, rain, and weather obeyed his will.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Waganda are said to believe in a god of Lake Nyanza who sometimes dwells
    in a man or woman.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The embodied Lake Nyanza god is described as feared, consulted as an oracle,
    and able to inflict or heal sickness, withhold rain, and cause famine.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king of Loango is honored as a god and is believed to be able to give
    rain when he wishes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: In December, the people of Loango come to beg the king for rain, and the king
    stands on his throne and shoots an arrow into the air, which is supposed to bring
    rain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king of Mombaza is briefly said to be described in much the same way as
    the king of Loango.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king of Quiteva is described as ranking with the deity, receiving prayers
    and gifts from subjects who ask him for rain, fair weather, or relief from winds
    and storms.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Among the Barotse, an old belief is reported that a chief is a demigod, and
    people gather at the chief’s yard in heavy thunderstorms for protection from lightning.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Barotse are described as kneeling before the chief and asking him to open
    the water-pots of heaven and send rain on their gardens.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The chief of Mowat in New Guinea is believed to affect crop growth and to
    coax dugong and turtle to come and be taken.
  category: attribute
  evidence_refs:
  - ev:7
