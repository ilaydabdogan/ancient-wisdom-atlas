canonical_text:
  quote: ''
  summary: 'Frazer lists several reported practices in which souls are treated as
    separable from living persons: Hawaiian sorcerers catch souls in calabashes; Canadian
    Indian wizards obtain a victim’s soul through familiar spirits and injure it;
    an Amboina doctor replaces a lost patient’s soul with one taken from another person;
    a Karen wizard transfers a sleeper’s soul to a dead man, creating alternating
    deaths and revivals; and Nass River doctors attempt to recover a patient’s soul
    from a doctor or a head-doctor’s box.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Hawaii example, sorcerers catch souls of living people, shut them in
    calabashes, and give them to people to eat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Hawaii example, squeezing a captured soul in the hands is said to reveal
    where people have been secretly buried.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Canadian Indian example, a wizard sends familiar spirits to bring a
    victim’s soul in the shape of a stone or similar object.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Canadian Indian example, the wizard strikes the captured soul with
    a sword or axe until it bleeds, and the person to whom it belongs languishes and
    dies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Amboina example, a doctor who thinks a patient’s soul has been carried
    away by a demon seeks to replace it with a soul taken from another person.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Amboina example, the doctor asks at a house at night who is there;
    if someone answers, the person’s soul is believed to pass into a clod of earth
    taken from before the door.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Amboina example, the doctor puts the clod under the patient’s pillow,
    performs ceremonies to convey the stolen soul into the patient, and fires two
    shots to frighten the soul from returning to its owner.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Karen example, a wizard catches the wandering soul of a sleeper and
    transfers it to the body of a dead man, causing the dead man to live and the sleeper
    to die.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Karen example, friends of the sleeper engage another wizard to steal
    the soul of another sleeper, producing an indefinite succession of deaths and
    resurrections.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the Nass River example, a doctor may be thought to have swallowed a patient’s
    soul by mistake, and other doctors physically manipulate him in an attempt to
    recover it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the Nass River example, if the soul is not recovered from the doctors,
    it is thought to be in the head-doctor’s box; the head-doctor is held upside down,
    his head is washed, and water from the washing is poured on the sick man’s head.
  category: sequence
  evidence_refs:
  - ev:6
