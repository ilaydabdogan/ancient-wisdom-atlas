canonical_text:
  quote: ''
  summary: Frazer argues that mock killings in North European folk-custom may preserve
    earlier real human sacrifice, then gives comparative examples of real, modified,
    sham, and effigy sacrifices. He next turns to his explanation of the priest of
    Nemi and frames a wider inquiry into the killing and resurrection of a god as
    animal, tree, corn, or human representative.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that mock killing of the Wild Man and the King in North
    European folk-custom is assumed to be a modern substitute for an older practice
    of killing them in earnest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that human sacrifices were commonly offered by ancestors
    of North European peoples identified as Celts, Teutons, and Slavs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Arizona example, an older Feast of Fire sacrifice is described as cutting
    a victim's throat, opening the breast, and removing the heart; a later modified
    form allows blood to flow from the throat wound and then heals it with medicine.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Artemis ritual at Halae, a man's throat is cut and blood flows, but
    he is not killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At a Nias chief's funeral, slaves may be beheaded after a little hair is cut
    off; when the required number is too great or unavailable, some slaves undergo
    a sham decapitation with the back of a sword.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Vishnu-worshipper expiation example, a victim undergoes a pretended
    sacrifice and resurrection through incision, bleeding, fainting or feigned death,
    and revival by sprinkling blood drawn from another worshipper's thigh.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage describes non-living substitutes for sacrifice, including images
    made of butter, paste, or barley meal, straw-men, and a clothed wooden human image
    that is beheaded and buried before Mahadeo.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: The Bhagat priest's speech presents the wooden image as a man sacrificed to
    Mahadeo according to ancient custom and asks for timely rain and plentiful harvest.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The author says he has been explaining why the priest of Nemi was required
    to be slain by his successor, while acknowledging the explanation as probable
    rather than certain.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The author identifies the god mainly discussed so far as the tree-god and
    refers to the death and resurrection of this god.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage proposes to examine killing the god and belief in the god's resurrection
    in hunting, pastoral, and agricultural stages, where the slain god may be an animal,
