canonical_text:
  quote: ''
  summary: Frazer surveys European harvest customs in which the last sheaf or final
    standing corn is named as an old female or old person, dressed or shaped as a
    human figure, associated with marriage omens, carried home, sometimes drenched
    with water, and interpreted as a representation of the corn-spirit. He also reports
    customs of tying a person into the last sheaf, making the final sheaf unusually
    large or heavy to secure next year's crop, and throwing sickles at the final corn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The last sheaf is sometimes called the Grandmother or Granny and may be adorned
    with flowers, ribbons, and a woman's apron.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In East Prussia, reapers address the woman who binds the last sheaf as getting
    the Old Grandmother.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Magdeburg custom described, men and women servants strive for the last
    sheaf, and the person who gets it is said to marry in the next year, with the
    spouse characterized as old or widowed according to the person's sex.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Near Belfast, the last sheaf is not cut in the usual way; reapers throw sickles
    at it, plait it, keep it until autumn, and associate obtaining it with marriage
    during the year.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The last sheaf is often called the Old Woman or Old Man and may be shaped
    and dressed as a woman; the cutter or binder is said to get the Old Woman.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: In one West Prussian custom, both the dressed last sheaf and the woman who
    binds it are called the Old Woman, brought home on the last wagon, and drenched
    with water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Hornkampe, when a binder lags behind, the last sheaf is dressed as a man
    or woman and called by the laggard's name, while bystanders tell the laggard that
    he or she has got the Old Woman and must keep her.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that a person called by the same name as the last sheaf
    and seated beside it is identified with it, so that the corn-spirit is represented
    in duplicate by a human being and by a sheaf.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The person who cuts or binds the last sheaf may be tied or wrapped into it;
    the passage compares this to a person wrapped in branches or leaves representing
    a tree-spirit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The last sheaf called the Old Woman is often larger or heavier than other
    sheaves, sometimes with a stone fastened inside or with several sheaves tied together.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that making the last sheaf unusually large or heavy is
    a sympathetic-magic charm intended to secure a large and heavy crop in the following
    year.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: In Denmark, the last sheaf may be called the Old Rye-woman, Old Barley-woman,
    or Old Wheat-woman, made in human shape, dressed in clothes, and carried home
    on the last wagon while harvesters drink and cheer beside it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In Scotland, the female figure made from the last corn may be called Carlin,
    Maiden, or Witch depending on timing; in County Antrim, blindfolded reapers throw
    sickles at plaited last corn, and the person who cuts it puts it over his door.
  category: sequence
  evidence_refs:
  - ev:8
