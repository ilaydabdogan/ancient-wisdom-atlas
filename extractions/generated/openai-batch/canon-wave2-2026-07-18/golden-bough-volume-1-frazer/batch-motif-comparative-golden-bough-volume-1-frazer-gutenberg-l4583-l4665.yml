canonical_text:
  quote: "“the spiritual life commences where the corporeal existence terminates”"
  summary: Frazer compares beliefs and customs in which natural death, old age, illness,
    or visible signs of aging are avoided through voluntary death, burial alive, strangling,
    throat-cutting, or regicide. He first treats common persons whose afterlife condition
    is believed to match their condition at death, then focuses on divine or sacred
    rulers whose natural death is said to threaten cosmic order, dynastic continuity,
    or royal fitness.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage reports that Mangaians distinguish between weak spirits of those
    who die naturally and strong spirits of those slain in battle.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that some people prefer to kill themselves or be killed
    before becoming feeble so that their souls enter future life vigorous rather than
    decrepit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports Fijian self-immolation and voluntary suicide among old
    men, connected with the belief that people retain in the afterlife the faculties
    they have at death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Fijian example, an aging man calls his relations, announces that he
    is worn out and has determined to be buried, and they later bury him alive.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Vaté, aged people are said to have been buried alive at their own request,
    and failure to bury an old chief alive is described as a family disgrace.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the Kamants as reported in the passage, a village priest cuts the throat
    of a nearly expiring relative to prevent natural death and to allow the soul to
    enter the mansions of the blessed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The people of Congo are said to believe that if the pontiff Chitomé died naturally,
    the world would perish and the earth would be annihilated.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the Chitomé fell ill and seemed likely to die, his destined successor
    entered with a rope or club and strangled or clubbed him to death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Ethiopian kings of Meroe are described as worshipped as gods and as obeying
    priestly commands to die, issued with an oracle as authority.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ergamenes disregarded the priests’ command to die, entered the Golden Temple
