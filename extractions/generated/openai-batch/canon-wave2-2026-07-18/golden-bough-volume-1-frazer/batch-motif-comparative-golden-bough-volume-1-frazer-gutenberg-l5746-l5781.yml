canonical_text:
  quote: ''
  summary: Frazer describes spring or Ascension customs in which a figure called Death
    is made, carried out, destroyed, stripped, drowned, or transformed, and life,
    summer, fruit-eating, and bathing are treated as restored or made safe afterward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Death is represented by a puppet that is thrown away, while Summer or Life
    is represented by branches or trees brought back.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Lusatia, women make a straw puppet, clothe it in a white shirt, give it
    a broom and a scythe, carry it to the village boundary, and tear it in pieces.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After tearing the Lusatian puppet apart, the women cut down a fine tree, hang
    the shirt on it, and carry the tree home singing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Near Hermanstadt in Transylvania, school-girls construct a Death figure from
    a threshed-out corn-sheaf and a broomstick, dress it in a village matron’s Sunday
    clothes, and display it at a window.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After vespers, the girls carry the effigy in procession around the village
    while boys are excluded.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The straw bundle is stripped of its attire, thrown to the boys, carried off,
    and flung into the nearest stream.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the second part of the Transylvanian ceremony, one girl is dressed in the
    clothes and ornaments formerly worn by the Death figure and is led in procession
    around the village.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Popular belief in the passage says fruit may be eaten only after the ceremony
    because Death or unwholesomeness has been expelled from it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The river in which Death has been drowned is afterward considered fit for
    public bathing.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Neglecting the customary ceremony is said to entail death to one of the young
    people or loss of virtue to a girl.
  category: speech
  evidence_refs:
  - ev:10
