candidate_motifs:
- id: motif:1
  label: Sacred tree or branch as agricultural fertility power
  taxonomy_refs:
  - sacred_tree_axis
  - seasonal_cycle
  basis: The passage repeatedly describes trees, branches, or cedar sprigs as fostering
    crop growth, protecting corn, or fertilising seed at harvest and sowing times.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage supports sacred-tree fertility, but it does not describe a
    cosmic axis or world-tree structure beyond local ritual placement and power.
- id: motif:2
  label: Seasonal cutting, carrying, and setting up of a sacred tree
  taxonomy_refs:
  - sacred_tree_axis
  - seasonal_cycle
  basis: The Lhoosai cut and set up a harvest tree; Bechuanas carry hack-thorn branches
    when corn is ripe; Gilgit youths bring a cedar branch to the village; Wends set
    up an oak-tree in the village.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  - ev:10
  confidence: high
  cautions: The examples are presented comparatively by the author; no direct historical
    link among them is established in the passage.
- id: motif:3
  label: Offerings and sacrifice to a tree or tree-spirit
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Sacrifice, spirits, rice, wine, oil, bread, fruit, goat blood, and songs
    of sacrifice are directed toward or associated with sacred trees or the personified
    cedar.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage describes ritual exchange and offerings, but does not provide
    participant explanations for every example.
- id: motif:4
  label: Tree-spirit bestows children, herds, food, and milk
  taxonomy_refs:
  - seasonal_cycle
  - sacred_exchange
  basis: The Gilgit cedar is said to bless women and multiply herds; household speech
    says the cedar spray brings children, food, and cattle; the song credits the Dread
    Fairy King with wife, sons, and children; European May-trees and boughs are associated
    with milk and cattle.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The taxonomy lacks a specific fertility motif label; seasonal and exchange
    references are approximate functional classifications.
- id: motif:5
  label: Herds driven to or around a sacred tree-place for increase
  taxonomy_refs:
  - seasonal_cycle
  - sacred_tree_axis
  basis: Gilgit goats are driven to the Chili stone for omens about future kids, and
    Wends drive cattle around an oak-tree to make them thrive; Frazer also explicitly
    states that the cedar’s influence is meant to be imparted to goats.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The Gilgit goat rite involves omen-taking as well as increase; the Wend
    rite is explicitly for thriving.
- id: motif:6
  label: Purification by cedar smoke and fire applied to seed
  taxonomy_refs:
  - seasonal_cycle
  basis: At Gilgit wheat-sowing, seed is held over smoke from a cedar bonfire, and
    part of it is baked into a cake on the same fire for the ploughman.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: This is a specific ritual operation; broader fire-purification symbolism
    is not explained in the passage.
comparison_claims:
- id: claim:1
  claim: The passage presents tree and branch rites in India, Africa, Gilgit, and
    Europe as sharing the function of promoting crop, herd, or household fertility.
  claim_level: same_function
  target: Cross-regional sacred tree or branch fertility rites cited by Frazer
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is based on functional similarity in Frazer’s presentation;
    the passage does not establish historical contact or common origin.
- id: claim:2
  claim: The passage explicitly compares the European May-tree or May-pole with the
    Gilgit cedar as possessing similar powers over women and cattle.
  claim_level: same_function
  target: European May-tree or May-pole and Gilgit Chili cedar
  evidence_refs:
  - ev:5
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison concerns attributed powers only; no shared ritual history
    is shown.
- id: claim:3
  claim: The Wend practice of driving cattle around an oak-tree is presented as another
    instance of a tree rite intended to make animals thrive.
  claim_level: same_function
  target: Wend oak-tree cattle rite compared with other tree fertility rites in the
    passage
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only a brief notice of the Wend rite and does not
    detail its theology or origin.
