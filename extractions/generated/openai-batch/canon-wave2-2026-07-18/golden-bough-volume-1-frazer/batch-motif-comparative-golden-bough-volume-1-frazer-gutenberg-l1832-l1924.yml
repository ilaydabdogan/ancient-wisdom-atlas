canonical_text:
  quote: ''
  summary: Frazer describes a set of seasonal tree and branch rites from India, Africa,
    Gilgit, Ireland, Germany, and Wend communities. The examples include felling or
    carrying sacred trees, restrictions on cutting timber during crop seasons, cedar
    smoke and offerings applied to seed, sacrifices and household rites involving
    a cedar branch, goat and cattle fertility practices, and European May-tree rites
    associated with milk and thriving herds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a Lhoosai harvest festival, the chief and people enter the forest, fell
    a large tree, carry it into the village, set it up in the midst, offer sacrifice,
    pour spirits and rice over it, and end with a feast and dance performed only by
    unmarried men and girls.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Bechuanas, the hack-thorn is described as very sacred; cutting a
    bough and carrying it into the village during the rainy season is a serious offence,
    but when corn is ripe each man brings home a branch to repair the village cattle-yard.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Many tribes of south-eastern Africa are said not to cut timber while corn
    is green because they fear crop destruction by blight, hail, or early frost.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among the Aryan tribes of Gilgit, at the beginning of wheat-sowing, wheat
    from the Raja’s granary is mixed with sprigs of sacred Chili cedar, held over
    smoke from a cedar bonfire, and partly made into a cake baked on the same fire
    and given to the ploughman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that in the cited cases the power of fostering crop growth
    and cultivated plants is ascribed to trees.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sacred Chili cedar of Gilgit is said to multiply herds and bless women
    with offspring, in addition to fertilising corn.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: At wheat-sowing in Gilgit, three chosen unmarried youths purify themselves
    for three days and go to the mountain where the cedars grow, taking wine, oil,
    bread, and fruit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The youths sprinkle wine and oil on a selected cedar, eat bread and fruit
    as a sacrificial feast, cut off a branch, bring it to the village, and place it
    on a large stone beside running water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A goat is sacrificed, its blood is poured over the cedar branch, a dance with
    weapons follows, the goat’s head is carried aloft and used as a target, the flesh
    and wine reward good shots, the bones are thrown into the stream, and a general
    ablution occurs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Each man takes a cedar spray home; when his wife asks what he has brought,
    he answers that he has brought children, food, cattle, and whatever is wanted.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the household rite, the wife pours wine and water on some cedar leaves
    and places them on the fire, sprinkles the rest with flour and hangs them from
    the ceiling, sprinkles flour on her husband, and addresses him as one who has
    come from far.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The cedar is addressed as Shiri Bagerthum, described as the dreadful king
    and as a form of address used when praying to the cedar for wants to be fulfilled.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The next day the wife bakes cakes, drives the family goats to the Chili stone,
    pelts them with pebbles while invoking the Chili, and omens about the number and
    sex of future kids are drawn from the direction in which the goats run.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: A song sung for five days addresses a Dread Fairy King, speaks of sacrifice
    before him, and attributes filled houses, wife, sons, right ways, and many children
    to him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage says that in Europe the May-tree or May-pole is supposed to have
    powers over women and cattle similar to the Gilgit cedar.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: In parts of Germany on May 1, peasants set up May-trees at stable and byre
    doors, one for each horse and cow, to make cows yield much milk.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: Camden is cited as saying that the Irish fancy a green bough fastened against
    the house on May-day will produce plenty of milk that summer.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: Some Wends on July 2 set up an oak-tree in the middle of the village with
    an iron cock on top, danced around it, and drove cattle around it to make them
    thrive.
  category: sequence
  evidence_refs:
  - ev:10
