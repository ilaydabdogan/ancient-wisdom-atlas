canonical_text:
  quote: The divine person is a source of danger as well as of blessing
  summary: The passage describes beliefs that the Mikado’s used vessels and clothes,
    and the food, garments, tinder-box, or other objects associated with New Zealand
    or Maori chiefs, could transmit dangerous sacred power or tapu to unauthorized
    users, causing illness, fear, or death. Frazer generalizes this as an ambivalent
    sacred power requiring the divine king or god-man to be guarded and guarded against.
  language: English
  quote_policy: quoted
