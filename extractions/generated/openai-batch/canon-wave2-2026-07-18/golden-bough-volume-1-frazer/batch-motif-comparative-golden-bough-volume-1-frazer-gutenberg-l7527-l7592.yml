canonical_text:
  quote: ''
  summary: Frazer surveys European harvest customs in which the last corn, sheaf,
    or corn-spirit is personified as a child, baby, maiden, bride, or bridal pair.
    The passage describes ritual cutting, dressing, carrying home, storing, dancing,
    and in some cases feeding the preserved sheaf to animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the corn-spirit may be conceived as old or mature,
    but in other cases as young, including as a child separated from its mother by
    the sickle.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Polish custom described, people call out to the man cutting the last
    handful of corn that he has cut the navel-string.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In some West Prussian districts, the figure made from the last sheaf is called
    the Bastard, a boy is wrapped in it, the woman binding the sheaf represents the
    Corn-mother in labor, and an old woman acts as grandmother and midwife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the West Prussian enactment, the boy in the sheaf whimpers like an infant,
    is wrapped in a sack like swaddling bands, and is carried to the barn to avoid
    the cold.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In parts of North Germany, the last sheaf or puppet is called the Child or
    Harvest Child.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the North of England, the last handful of corn was cut by the prettiest
    girl, dressed as the Corn Baby or Kern Baby, brought home with music, displayed
    at the harvest supper, and usually kept in the parlour for the rest of the year;
    the girl was called the Harvest Queen.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Kent, the Ivy Girl is described as a human-shaped figure made from some
    of the best corn, dressed and adorned by women, and brought home on the last load
    of corn.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Near Balquhidder, the last handful is cut by the youngest girl, made into
    a female doll called the Maiden, dressed with paper and ribbons, and kept in the
    farmhouse, sometimes until the next year's Maiden is brought in.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: On some Gareloch farms, the last standing corn was called the Maiden, divided,
    plaited, cut by a girl thought lucky and soon to marry, dressed with ribbons,
    and hung in the kitchen with a date attached.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: On other Gareloch farms, the last handful was called the Maidenhead or the
    Head, plaited or ribboned, hung for a year, and then its grain was given to poultry.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the North of Scotland, the Maiden is kept until Christmas morning and divided
    among cattle to make them thrive during the year.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In Aberdeenshire, the clyack sheaf was cut by the youngest girl, dressed in
    women's clothes, carried home in triumph, and later given to a mare in foal or
    to the oldest cow.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The names Bride, Oats-bride, and Wheat-bride are applied in Germany and Scotland
    to the last sheaf and sometimes to the woman who binds it.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: In some German harvest festivals, a straw-dressed man and woman called the
    Oats-wife and Oats-man, or Oats-bride and Oats-bridegroom, dance, and corn-stalks
    are plucked from their bodies until they are bare.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: In Silesia, the woman who binds the last sheaf is called the Wheat-bride or
    Oats-bride and is brought to the farmhouse with a harvest crown, a bridegroom,
    bridesmaids, and the formality of a wedding procession.
  category: sequence
  evidence_refs:
  - ev:8
