canonical_text:
  quote: ''
  summary: 'Frazer surveys beliefs and practices in which trees and crops are treated
    as animate beings: trees are said to have souls, receive offerings, be married,
    become pregnant, feel pain, bleed when cut, and sometimes embody the dead or ancestors.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that tree-worship rests on the notion that trees are animate
    and have souls like human beings.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Wanika are described as treating the destruction of a cocoa-nut tree as
    equivalent to matricide because the tree gives life and nourishment like a mother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Siamese monks are described as avoiding breaking tree branches because destroying
    anything is understood as forcibly dispossessing a soul.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Dyaks are described as ascribing souls to trees, avoiding the cutting
    of old trees, and appeasing a fallen old tree by setting it up, smearing it with
    blood, and decking it with flags.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: People in Congo are described as placing calabashes of palm-wine at the foot
    of certain trees so the trees may drink when thirsty.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Shrubs, trees, orchards, and fruit-trees are described as being formally married
    in India and Germany, including ceremonies with bridegroom and bride representatives
    and straw ropes tied around fruit-trees.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the Moluccas, clove-trees in blossom are described as treated like pregnant
    women, with noise, light, fire, and covered heads avoided near them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Rice in Java and Orissa is described as pregnant when in bloom or growing,
    with noise avoided and ceremonies observed as for human females.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: 'Trees are described as feeling injuries: felled oaks are said to shriek or
    groan, Ojebway medicine-men claim to hear trees wailing under the axe, and Austrian
    and Jarkino woodmen beg trees for pardon.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Several examples describe cut trees or plants as bleeding, including a red-juiced
    plant, a Samoan grove whose bleeding tree is followed by illness and death for
    cutters, and a Tyrolean larch whose wound is linked to the woodman’s body.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Some trees are described as animated by souls of the dead, including transformed
    fathers, forefathers in trees, and an empress with three daughters embodied in
    a drifted tree.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage explicitly notes that the Annamite story of blood flowing from
    an incised tree will remind readers of Virgil’s story of Polydorus.
  category: other
  evidence_refs:
  - ev:6
