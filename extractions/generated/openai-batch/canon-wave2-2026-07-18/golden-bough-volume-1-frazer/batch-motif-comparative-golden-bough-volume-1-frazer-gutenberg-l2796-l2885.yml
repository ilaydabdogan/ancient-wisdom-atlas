canonical_text:
  quote: He is the point of support on which hangs the balance of the world.
  summary: Frazer introduces royal and priestly taboos by describing sacred rulers
    as supernatural or divine figures whose persons are thought to affect nature and
    social order. He then gives the Mikado or Dairi of Japan as a typical example,
    describing restrictions on the emperor’s body, movement, exposure, food vessels,
    clothing, and imperial crown.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that early kings or priests are often thought to have supernatural
    powers or to be incarnations of deities, and are held responsible for weather,
    crops, and similar calamities.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When drought, famine, pestilence, or storms occur, people may attribute the
    misfortune to the king’s negligence or guilt and punish him with bonds, stripes,
    deposition, or death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage describes a model in which the ruler’s person is considered the
    dynamical centre of the universe, so that even small movements may disturb nature.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ruler’s life is said to require careful regulation so that neither voluntary
    nor involuntary acts upset the established order of nature.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Mikado or Dairi is identified as the spiritual emperor of Japan and as
    an incarnation of the sun goddess who rules gods and men.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says that once a year all the gods wait upon the Mikado and spend
    a month at his court; during that month temples are believed to be deserted.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The quoted description says the Mikado must not touch the ground with his
    feet and must be carried on men’s shoulders when he goes anywhere.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The quoted description says the Mikado’s sacred person must not be exposed
    to the open air and that the sun is not thought worthy to shine on his head.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Mikado’s hair, beard, and nails are not to be cut, though cleaning may
    occur at night while he sleeps, because what is removed then is described as stolen
    from him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In ancient times the Mikado was said to sit immobile on the throne with the
    imperial crown on his head for hours every morning to preserve peace and tranquillity
    in the empire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: If the Mikado turned or looked for a long time toward part of his dominions,
    war, famine, fire, or another major misfortune was apprehended.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The imperial crown was later treated as the palladium whose mobility could
    preserve peace, and was placed on the throne for hours every morning in place
    of the emperor’s immobile body.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Mikado’s food must be prepared in new pots and served in new dishes, which
    are usually broken after one use to prevent laymen from using them.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage reports a belief that a layman eating from the Mikado’s sacred
    dishes would suffer swelling and inflammation of the mouth and throat.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage reports a similar belief that a layman wearing the Dairi’s sacred
    garments without permission would suffer swellings and pains throughout the body.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: An earlier account is cited as repeating taboos against the Mikado touching
    the ground, being shone upon by sun and moon, removing bodily superfluities, and
    eating from reused vessels.
  category: sequence
  evidence_refs:
  - ev:9
