canonical_text:
  quote: ''
  summary: Frazer compares European harvest customs with spring customs, arguing that
    both treat a vegetation spirit as represented by a plant object and by a human
    participant. He describes the last sheaf, Corn-mother, Old Woman, Maiden, grain,
    straw, cattle-feeding, rain-making, and fertility practices as examples of sympathetic
    magical rites performed outside temples and without priests, addressed to spirits
    rather than individualized gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that harvest customs are analogous to spring customs, with
    the tree-spirit represented by both a tree and a person, and the corn-spirit represented
    by both the last sheaf and the person who cuts, binds, or threshes it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The equivalence between the person and the sheaf is described as being shown
    by shared naming, wrapping the person in the sheaf, and matching the Mother or
    Maiden sheaf to an older married woman or youngest girl as cutter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage compares European customs with Mexican maize-related human offerings,
    stating that the ages of human beings varied with the age of the maize and that
    they were probably representatives of the corn-spirit rather than victims offered
    to it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The corn-spirit is said to have fertilising influence over vegetation, cattle,
    and women.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Practices cited for the corn-spirit’s influence include scattering grain from
    the last sheaf among young corn in spring, giving the last sheaf’s straw to cattle
    at Christmas, giving a pregnant-woman-shaped Mother-sheaf to the farmer’s wife,
    and associating the binder or recipient of the last sheaf with childbirth or marriage
    in the next year.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The passage lists marks of primitive religion: no priests, no temples, recognition
    of spirits rather than gods, and magical rather than propitiatory rites.'
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: European peasant spring and harvest customs are described as performed by
    ordinary participants in woods, meadows, beside brooks, in barns, on harvest fields,
    and on cottage floors.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The named supernatural beings in these customs are described as general spirits
    such as Barley-mother, Old Woman, and Maiden, not individualized deities such
    as Ceres, Proserpine, or Bacchus.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Examples of magical rites include throwing the Corn-mother into a river to
    secure rain and dew, making the Old Woman heavy to get a heavy crop, strewing
    last-sheaf grain among young crops, and giving the last sheaf to cattle so they
    thrive.
  category: action
  evidence_refs:
  - ev:6
