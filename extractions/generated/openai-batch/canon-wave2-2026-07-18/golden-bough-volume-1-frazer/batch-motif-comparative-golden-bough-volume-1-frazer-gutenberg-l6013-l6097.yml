canonical_text:
  quote: ''
  summary: Frazer analyzes spring and midsummer customs involving the expulsion or
    death of a figure called Death, winter, Kore, or deity images. He notes mixed
    ritual attitudes of mourning and hostility, describes torch expulsions in Silesia
    and Albania, and gives an Indian spring rite in Kânagrâ where girls create and
    marry images of Siva and Pârvatî, then immerse and mourn them. He explicitly compares
    the Indian rite with European vegetation-spirit and May marriage customs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says some spring and midsummer ceremonies include a solemn funeral,
    lamentations, and mourning attire connected with the death of a beneficent vegetation
    spirit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage also describes an effigy being carried out with glee, assailed
    with sticks and stones, and addressed with taunts and curses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bearers are described as hurrying home after discarding the effigy, and the
    passage reports a belief that someone must soon die in any house into which the
    effigy has looked.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'Frazer distinguishes two opposed features in these ceremonies: sorrow, affection,
    and respect for the dead, alongside fear, hatred, and rejoicing at the dead figure’s
    death.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Königshain, villagers of all ages go with straw torches to a nearby hill
    called Todtenstein, light the torches, and return singing that Death has been
    driven out and Summer brought back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Albania, young people light resinous wooden torches on Easter Eve, process
