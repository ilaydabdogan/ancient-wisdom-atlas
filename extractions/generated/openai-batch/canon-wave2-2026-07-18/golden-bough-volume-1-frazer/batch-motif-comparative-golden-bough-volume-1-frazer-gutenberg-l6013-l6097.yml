  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage reports that some explain the Albanian ceremony as driving out
    winter, and that Kore is conceived as a malignant being who devours children.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Kânagrâ district, the Ralî Ka melâ is a spring custom performed entirely
    by young girls.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The girls bring baskets of dûb grass and flowers to a fixed place, pile them
    in a heap over ten days, set two three-pronged branches over the heap, and have
    two clay images made on the upper points.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The two clay images represent Siva and Pârvatî, and the girls divide into
    two parties and marry the images with the customary ceremony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the image marriage, the girls hold a feast funded by contributions from
    their parents.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: At the next Sankrânt, the girls go to the riverside, throw the images into
