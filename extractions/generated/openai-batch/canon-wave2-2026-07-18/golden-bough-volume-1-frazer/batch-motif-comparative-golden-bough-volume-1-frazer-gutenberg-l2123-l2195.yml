literal_observations:
- id: obs:1
  text: The passage says the original practice was likely to set up a new May-tree
    every year, because the custom was meant to bring in the newly awakened fructifying
    spirit of vegetation in spring.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the meaning of the custom was forgotten, the May-tree could become a
    permanent holiday centre, decorated with fresh flowers on May Day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Weverham in Cheshire, May-poles are described as hung with garlands and
    topped with a leafy birch or similar slender tree spliced to the pole to appear
    as one tree.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage compares the renewal of the May-tree with the renewal of the Harvest-May,
    saying each is intended to secure and preserve a fresh portion of the fertilising
    spirit of vegetation through the year.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says the Harvest-May promotes crop growth, while the May-tree
    or May-branch also extends its efficacy to women and cattle.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old May-tree, May-tree pieces, Palm Sunday bushes, and possibly the Greek
