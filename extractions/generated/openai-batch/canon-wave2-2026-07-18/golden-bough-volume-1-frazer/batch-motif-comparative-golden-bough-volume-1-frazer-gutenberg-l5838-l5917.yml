canonical_text:
  quote: ''
  summary: Frazer compares European spring and harvest customs involving May-trees,
    Summer-trees, effigies called Death, Carnival figures, the Esthonian Metsik or
    Wood-spirit, and corn-spirit figures. He argues that several of these rites represent
    the death, expulsion, revival, or embodiment of a tree-spirit or spirit of vegetation,
    with seasonal names such as May, Summer, Carnival, and Death treated as later
    abstractions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Trees or branches are brought into the village after the destruction of the
    figure called Death; their bearers say they are bringing in Summer.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A doll is sometimes attached to the Summer-tree and is described as a duplicate
    representative of Summer, comparable to the pairing of a May-tree and May Lady.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Summer-trees are adorned with ribbons and similar decorations; large ones
    may be planted and climbed, while small ones may be carried door to door by children
    who sing and collect money.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bearers of the Summer-tree sometimes announce that they are bringing in
    both Summer and May, and the passage states that bringing in May and bringing
    in Summer are essentially the same custom apart from name and date.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage argues that if the May-tree is an embodiment of the tree-spirit
    or spirit of vegetation, then the Summer-tree must likewise be such an embodiment.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Summer-tree is said in some cases to be a revivification of the effigy
    of Death, leading the author to infer that the effigy called Death can embody
    the tree-spirit or spirit of vegetation.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fragments of the effigy of Death are believed to have vivifying and fertilising
    influence on both vegetable and animal life.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The effigy of Death may be made from birchen twigs, a beech branch, a threshed-out
    corn-sheaf, or hemp, and may be hung on a little tree and carried about by girls
    collecting money.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage describes the expulsion of Death and bringing in of Summer, in
    some cases, as another form of the death and resuscitation of the spirit of vegetation
    in spring; it also mentions the burial and resurrection of Carnival as probably
    expressing the same idea.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: An Esthonian straw figure carried out of the village on Shrove Tuesday is
    called the Wood-spirit or Metsik; it is fixed to the top of a tree in the wood
    for a year and receives prayers and offerings to protect herds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage conjectures that the names Carnival, Death, and Summer are late
    and inadequate expressions for beings embodied in older customs, and that Death
    in these spring ceremonies originally meant dying or dead winter vegetation.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: In harvest analogies, the last sheaf may be called the Dead One; children
    are warned that Death sits in the corn; and a Saxon children’s game represents
    Death by a child covered with maize leaves.
  category: relationship
  evidence_refs:
  - ev:8
