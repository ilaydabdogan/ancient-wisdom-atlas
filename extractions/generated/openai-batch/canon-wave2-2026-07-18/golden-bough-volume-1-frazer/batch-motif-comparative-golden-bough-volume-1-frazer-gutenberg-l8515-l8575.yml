canonical_text:
  quote: ''
  summary: 'The passage describes a human sacrifice ritual: the victim is anointed,
    touched, sometimes processed through the village, prevented from resistance, killed
    by several locally varying methods, dismembered, and portions of flesh, ashes,
    or remains are distributed to villages, fields, streams, houses, granaries, and
    new corn. One portion is offered to the Earth Goddess. The passage also notes
    post-sacrifice restrictions and later substitution of a goat for a human victim
    in one place.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the last morning, nocturnal orgies resumed until noon, after which the
    assembly proceeded to the sacrifice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The victim was anointed with oil, and each person touched the anointed part
    and wiped the oil on his own head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In some places the victim was taken door to door; some people plucked hair
    from his head, and others asked for spittle to anoint their heads.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The victim was not to be bound or visibly resist; his arm bones, and if necessary
    leg bones, were broken, though opium sometimes made this unnecessary.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The method of killing varied by place, with strangulation or squeezing to
    death described as among the commoner methods.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In one method, a cleft green tree branch held the victim’s neck or chest while
    the priest and assistants tried to close the cleft.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the priest wounded the victim with an axe, the crowd cut flesh from
    the bones while leaving the head and bowels untouched.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Chinna Kimedy, the victim was dragged through fields while the crowd hacked
    flesh from his body, avoiding the head and intestines, until he died.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Another method in the same district fastened the victim to the proboscis of
    a revolving wooden elephant while the crowd cut flesh from him while he remained
    alive.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In one district the victim was slowly killed by fire on a sloping stage; the
    passage states that more tears meant a more abundant supply of rain, and the body
    was cut to pieces the next day.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Flesh cut from the victim was taken rapidly to villages by deputed persons
    or relays, while those who stayed home fasted until it arrived.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The priest divided the flesh into two portions; one was offered to the Earth
    Goddess by burial in a hole, with earth added by each man and water poured from
    a hill gourd.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The other portion was divided among heads of houses, who rolled flesh shreds
    in leaves and buried them in preferred fields behind their backs without looking.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: In some places, each man carried his portion of flesh to the stream watering
    his fields and hung it on a pole there.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: For three days after the sacrifice houses were not swept; in one district
    silence was observed, fire was not to be given out, wood was not cut, and strangers
    were not received.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: The head, bowels, and bones were watched overnight and then burned with a
    whole sheep; ashes were scattered over fields, laid on houses and granaries, or
    mixed with new corn to preserve it from insects.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: Sometimes the head and bones were buried rather than burned.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: After suppression of human sacrifices, inferior victims were substituted in
