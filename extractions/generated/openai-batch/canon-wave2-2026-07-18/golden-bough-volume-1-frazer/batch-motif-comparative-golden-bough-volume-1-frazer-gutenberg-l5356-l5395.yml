canonical_text:
  quote: ''
  summary: Frazer compares North European ritual masker-kings with the King of the
    Wood or priest of Nemi. He emphasizes vegetal dress and settings, violent death
    or life-threatening pursuit, office retained by proving bodily vigor, ritualized
    flight, and legends or customs in which a killed tree-spirit representative or
    King of the Wood is restored to life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the North European personages and the King of the
    Wood or priest of Nemi have striking points of similarity.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The northern maskers are described as kings wearing bark and leaves and holding
    court by a hut of green boughs and fir-trees.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The northern kings are said to die a violent death, though they may escape
    it temporarily through bodily strength and agility.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In several northern customs, flight and pursuit of the king form a prominent
    ceremonial element; in one case, outrunning pursuers preserves the king's life
    and office for another year.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage compares the annual life-risk of one northern king with the King
    of Calicut's twelve-yearly defense of his life and the priest of Nemi's continual
    defense against assault.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage generalizes that the god-man's life is prolonged when he proves
    in fight or flight that his bodily strength has not decayed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Flight is said to figure in both the legend and practice of the King of the
    Wood, who had to be a runaway slave in memory of the flight of Orestes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage conjectures that the Arician king may have been allowed a chance
    for his life by flight and that the Roman regifugium may originally have been
    a similar flight.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: In Saxony and Thüringen, the representative of the tree-spirit is described
    as killed and then brought to life again by a doctor.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The legend of Hippolytus or Virbius says that after being killed by his horses
    he was restored to life by Aesculapius.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that the slaying of the King of the Wood may be understood
    as a step toward revival or resurrection in his successor.
  category: sequence
  evidence_refs:
  - ev:6
