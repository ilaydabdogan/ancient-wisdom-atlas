literal_observations:
- id: obs:1
  text: The passage distinguishes between a view in which a tree-spirit is incorporated
    in and animates a tree, and another view in which the tree is only the spirit’s
    dwelling that can be abandoned.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When felling a tree, the Pelew Islanders are described as conjuring the tree-spirit
    to leave it and settle on another tree.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Pádams of Assam are described as believing a lost child has been stolen
    by wood spirits; they cut down trees until the spirits give up the child, which
    is found in the fork of a tree.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before felling a forest tree, the Katodis choose a tree of the same kind,
    present a cocoa-nut, burn incense, apply red pigment, and ask it to bless the
    undertaking.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Galeleze clearing a wood must not cut the last tree until the spirit in
    it has been induced to go away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Mundaris leave sacred groves standing when land is cleared, and the Miris
    avoid unnecessary cutting of trees because of concern about sylvan or wood spirits.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In Sumatra, after a tree is felled, a young tree is planted on the stump and
    betel and small coins are placed there as a new home and compensation for the
    tree-spirit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In Chedooba a green sprig is placed on the stump when a large tree falls,
    and German woodmen make a cross on the stump while the tree is falling so the
    spirit can live on the stump.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage reports old Prussian belief that gods inhabited high trees and
    gave audible answers; the great oak at Romove is described as a special dwelling-place
    of the god.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Battas, Curka Coles, and Samogitians are described as associating certain
    trees, treetops, groves, or their animals with spirits that resent injury or punish
    offenders.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage states that sacred and inviolable groves are generally assumed
    to be inhabited or animated by sylvan deities, and gives Livonian and Wotjak examples
    where injury to trees is followed by death or sickness.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage describes goat’s blood sprinkled on a tree before cutting in Gilgit,
    a Roman pig sacrifice before thinning a grove, and Arval Brothers’ expiation when
    a bough or tree fell in a sacred grove.
  category: action
  evidence_refs:
  - ev:6
