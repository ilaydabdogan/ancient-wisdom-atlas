  summary: The passage is a set of footnotes. It explains a soul-restoration custom
    in which a missing soul is sought in a head-doctor's box or body, the head-doctor
    is inverted and washed, and the washing water is poured on the patient. It also
    notes a proposed comparison between soul-hunting practices and Ezekiel xiii.17
    sqq., gives a belief involving a hyaena, a dog, moonlight, and a shadow, and mentions
    Chinese brass mirrors hung over idols to scare evil spirits.
