canonical_text:
  quote: ''
  summary: Frazer surveys harvest customs concerning the last standing corn. The final
    sheaf or handful is called the neck, head, tail, or related body part of a corn-spirit
    or animal-form figure; reapers cut or throw sickles at it, sometimes keep it for
    luck, drench its carrier with water as a rain-charm, or accompany the last cutting
    with cries and ritual gestures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A call-and-response formula announces that someone has gotten the “neck.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Devonshire and Cornish customs, a last bunch of ears is described as
    the neck of the corn-spirit, which is beheaded when the bunch is cut down.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Shropshire, the last handful of standing corn was called the “neck” or
    “gander’s neck,” plaited, cut by thrown sickles, and then taken to the farmer’s
    wife to keep for good luck until the next harvest.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Other regional examples identify the last corn with a goat’s neck, a head,
    a hare’s tail, a cat’s tail, or a fox’s tail, and include cutting or claiming
    that body part.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage generalizes that the corn-spirit is conceived in human or animal
    form and that the last standing corn is treated as part of its body, such as neck,
    head, tail, or navel-string.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Devonshire custom drenches with water the person who brings in “the neck”;
    the passage identifies this as a rain-charm and compares it to pouring water on
    Osiris or his representative.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In Germany, reapers cry “Waul,” “Wol,” or “Wôld” when cutting the last corn;
    in some places a flower-decked stick is inserted into the last patch, ears are
    fastened to it, hats are removed, and the cry is repeated three times, sometimes
    with whetstones clashed on scythes.
  category: sequence
  evidence_refs:
  - ev:6
