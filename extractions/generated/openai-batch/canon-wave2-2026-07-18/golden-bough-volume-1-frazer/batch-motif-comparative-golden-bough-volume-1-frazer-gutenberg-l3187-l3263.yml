canonical_text:
  quote: ''
  summary: Frazer summarizes beliefs and stories in which the soul leaves the body
    during sleep or waking life, may be detained or misdirected, and may cause sickness
    or death unless it returns. The passage gives examples involving fighting souls,
    deceased souls, lizard-, fly-, and butterfly-form souls, ritual calling-back of
    the soul among Mongols, and Indian tales of transferring souls into other bodies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that a sleeper's soul is supposed to wander from the body
    and visit places dreamed of; if it is permanently detained away from the body,
    the person dies.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives examples in which a sleeper's soul may fight another sleeper's
    soul or may be carried off by the soul of a recently deceased person.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Aru Islands example, household members avoid sleeping in a house on
    the night after a death because the deceased person's soul is believed to remain
    there.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Santal story, a man's soul leaves his sleeping body as a lizard, enters
    a water pitcher, is trapped when the pitcher is covered, and returns when the
    pitcher is uncovered; the body revives.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Transylvanian story, a motionless woman awakens after a captured fly
    is released and flies into her mouth; the men who see this conclude that she is
    a witch.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states a rule that a sleeper should not be awakened abruptly because
    the soul may be away and may not have time to return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Bombay example, changing a sleeper's appearance is described as dangerous
    because the returning soul may fail to recognize its body.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the Servian example, a sleeping witch's soul leaves as a butterfly; if
    the body is turned around, the butterfly soul may fail to re-enter through the
    mouth and the witch dies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that the soul may also leave during waking hours, producing
    sickness or death if the absence is prolonged.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the Mongol example, the patient's body is made attractive, friends call
    the patient's name, a cord is stretched from the patient's head to the hut door,
    a priest addresses the returning soul, seed is thrown over the sick person, and
    the cord is worn for seven days.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The Indian stories describe souls being transferred into dead or deserted
    bodies, including a king's soul entering a Brahman's body, a hunchback's soul
    entering the king's body, and a soul transferred into a parrot's body.
  category: sequence
  evidence_refs:
  - ev:10
