canonical_text:
  quote: ''
  summary: 'Footnotes collect comparative references on harvest customs and vegetation
    rites: the last sheaf kept as an Old Man or Maiden; a possible Cyprian rite of
    Ariadne involving a young man imitating childbirth; a Minnitaree rite in which
    a woman pretends to produce a maize stalk from her stomach to secure a future
    crop; seasonal timing of Proserpine''s descent; gestures toward the last sheaf;
    Demeter''s control of corn growth; Egyptian first-ear harvest rites; and references
    to laments or figures such as Linus, Bormos, and Lityerses.'
  language: English
