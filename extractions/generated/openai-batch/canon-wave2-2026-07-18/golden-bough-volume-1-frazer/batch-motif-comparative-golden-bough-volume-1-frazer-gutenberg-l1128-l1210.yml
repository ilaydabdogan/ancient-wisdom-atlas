canonical_text:
  quote: ''
  summary: The passage surveys reports of living persons, rulers, priests, chiefs,
    slaves, beggars, and ritual specialists being treated as gods, incarnations, possessors,
    or representatives of divinity in several regions. It describes associated powers,
    royal deification, offerings and sacrifices, oracle-giving, healing, possession,
    ritual substitution, animal guardian forms, a bamboo-tree representing heaven,
    and a Toda dairy sanctuary with a divine milkman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Marquesas Islands, a small class of men were said to be deified during
    life and believed to have supernatural power over elements, harvests, disease,
    and death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Human sacrifices were offered to the Marquesan human gods to avert their wrath,
    and one described human god could call for multiple victims at a time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The described Marquesan human god lived in seclusion in an enclosed house
    containing an altar, with human skeletons hung head-down on house beams and nearby
    trees.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: For the South Sea Islands generally, the passage says each island had a man
    who represented or personified divinity; such men were called gods and could be
    kings, priests, or subordinate chiefs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tanatoa of Raiatea and kings of Tahiti are described as deified rulers who
    received worship, sacrifices, prayers, or sacred regalia identifying them with
    gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Samoa, gods generally appeared in animal form but were sometimes permanently
    incarnate in men who gave oracles, received offerings, healed the sick, and answered
    prayers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Fiji, the passage reports no certain boundary between departed spirits,
    gods, and living men; some priests and old chiefs were considered sacred and could
    claim divinity.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Pelew Islands, a god could possess a person temporarily or permanently;
    a permanently chosen person was called a korong and might be raised to rule as
    god and king.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Among some Molucca Islanders, a slave was placed under a bamboo-tree representing
    heaven, ate and drank offerings in heaven’s name, and thereafter represented heaven
    at festivals.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In Tonquin, villages chose guardian spirits often in animal form, and the
    passage gives an example of a beggar honoured as a living patron-divinity.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: In India, kings are described as nearly present gods, an infant king as a
    deity in human form, and certain living persons of strength, valour, or supposed
    miraculous power as liable to be worshipped as gods.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Among the Todas, the dairy is described as a sanctuary, and the milkman who
    attends it is described as a god.
  category: relationship
  evidence_refs:
  - ev:8
