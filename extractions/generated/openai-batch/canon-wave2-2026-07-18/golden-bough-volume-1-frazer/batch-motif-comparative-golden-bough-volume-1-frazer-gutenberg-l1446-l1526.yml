canonical_text:
  quote: ''
  summary: 'The passage surveys several sacred or mystic offices: rain and storm kings
    in Congo and Upper Nile regions, an Alfai rain-making priest-king near Abyssinia,
    and Cambodian-associated Kings of Fire and Water among the Chréais/Jaray. These
    figures are credited with powers over rain, storms, locusts, hurricanes, or sacred
    talismans, receive tribute or offerings, and in some cases face death or reluctance
    because the office is dangerous.'
  language: English
  quote_policy: summarized
