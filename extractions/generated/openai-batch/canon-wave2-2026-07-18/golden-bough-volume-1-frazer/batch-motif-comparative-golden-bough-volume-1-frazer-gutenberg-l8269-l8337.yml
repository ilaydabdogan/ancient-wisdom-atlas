canonical_text:
  quote: "“strangers are also regarded as embodiments of the corn-spirit”"
  summary: Frazer describes European harvest and threshing customs in which passers-by,
    masters, strangers, or stranger women are stopped, encircled, bound with grain
    or tools, threatened with mowing or striking language, and required to pay a forfeit,
    provide drink, or receive corn-spirit names.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: 'The passage explicitly likens modern reapers to Lityerses: they seize a passing
    stranger and tie him up in a sheaf, while their language and gestures are said
    to indicate a desire to cut off his head, though not to complete that act.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Mecklenburg, when a master, mistress, or stranger enters or passes the
    field on the first day of reaping, mowers face the person, sharpen and clash scythes,
    and a leading woman ties a band around the person’s left arm; the person must
    pay a forfeit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Near Ratzeburg, harvesters stop work, march toward a master or person of mark,
    arrange themselves in line, use scythes in a formal display, make a speech, whet
    scythes loudly in measured time, and bind the person with corn-ears or a silken
    band.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In parts of Pomerania, a passer-by is stopped by a corn-rope, surrounded by
    reapers, and addressed with words saying that the gentleman must be mowed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Ramin, a stranger encircled by reapers is addressed with a speech calling
    the cutting implement a naked sword and saying the joke will end if he provides
    beer and brandy, but otherwise the sword has a right to strike.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the district of Lüneburg, a person entering the harvest-field is asked
    whether he will engage a good fellow; if he agrees, harvesters mow some swaths
    while yelling and then ask for drink-money.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that on the threshing-floor strangers are regarded as embodiments
    of the corn-spirit and treated accordingly.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: At Wiedingharde in Schleswig, a stranger who agrees to learn the flail-dance
    has the arms of a threshing-flail put around his neck as if he were a sheaf of
    corn and pressed tightly enough to nearly choke him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: In some parishes of Wermland, a stranger entering a threshing-floor has a
    flail put around his neck and a straw rope around his body.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the Wermland example, a stranger woman entering the threshing-floor has
    a flail put around her body and a wreath of corn-stalks around her neck, while
    threshers call her the Corn-woman and Corn-maiden.
  category: speech
  evidence_refs:
  - ev:9
