canonical_text:
  quote: ''
  summary: Frazer describes European harvest customs in which the person who cuts,
    binds, or threshes last is mocked, roughly treated, or made to bear an anthropomorphic
    last sheaf called the Old Man. Examples from near Danzig, Aschbach in Bavaria,
    and Kloxin near Stettin involve contests to avoid being last, carrying or delivering
    the Old Man, food portions, dancing, masking or cross-dressing, and an explicit
    interpretation that the last worker represents the corn-spirit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that in modern Europe the person who cuts, binds, or threshes
    the last sheaf is often subjected to rough treatment, ridicule, or an expectation
    of misfortune.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Harvest workers are described as reluctant to perform the final act of reaping,
    threshing, or binding, leading to a contest to avoid finishing last.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Near Danzig, remaining winter corn is divided among women binders, who begin
    a speed contest at the cry, “Seize the Old Man.”
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Danzig example, the woman who binds the last sheaf carries the Old
    Man, identified as the last sheaf shaped like a man, to the farmhouse and delivers
    it to the farmer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Danzig example, the Old Man is placed at supper, given food, placed
    in the yard, and danced around or danced with.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Danzig woman who bound the last sheaf is herself called the Old Man until
    the next harvest and is mocked with that cry.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: At Aschbach in Bavaria, reapers say they will drive out the Old Man, reap
    as fast as possible, and announce that the person who cuts the last handful or
    stalk has the Old Man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Aschbach, the last reaper may be given a black mask and clothes of the
    other gender, a dance follows, and the Old Man receives a double food portion
    at supper.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that the last person at reaping, binding, or threshing
    is regarded as the representative of the corn-spirit.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that binding the last person in corn-stalks more fully
    expresses the idea of representing the corn-spirit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: At Kloxin near Stettin, the Old Man is a large corn bundle decorated with
    flowers and ribbons and shaped roughly like a human figure.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: At Kloxin, the Old Man is fastened to a rake or strapped on a horse, brought
    with music to the village, and delivered to the farmer with a speech asking for
    a present.
  category: sequence
  evidence_refs:
  - ev:5
