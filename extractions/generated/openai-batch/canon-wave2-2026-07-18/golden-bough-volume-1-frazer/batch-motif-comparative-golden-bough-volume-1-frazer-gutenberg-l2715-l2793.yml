canonical_text:
  quote: ''
  summary: Frazer argues that the cult of Diana at the Arician grove and the priesthood
    of the King of the Wood can be explained as forms of tree-spirit or woodland deity
    worship. He links Diana, the Golden Bough, the King of the Wood, sacred spring,
    perpetual fire, fertility powers, and regional pilgrimage to comparative examples
    from European folk-custom and other traditions.
  language: English
  quote_policy: summarized
