canonical_text:
  quote: the soul or spirit of the animal is in the blood
  summary: Frazer compares prohibitions on touching raw flesh or eating blood, explaining
    them through a belief that animal life or soul is in the blood. He cites the Flamen
    Dialis, Pelew post-killing taboos, Esthonian and North American abstentions from
    blood, blood-disposal practices among Slave, Hare, Dogrib, and Jewish hunters,
    and similar beliefs among Romans, Arabs, and some Papuan tribes.
  language: English
  quote_policy: quoted
