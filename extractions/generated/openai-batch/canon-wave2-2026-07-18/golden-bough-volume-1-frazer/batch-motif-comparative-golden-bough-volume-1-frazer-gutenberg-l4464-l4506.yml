  quote: ''
  summary: Frazer explains a prohibition on the Flamen Dialis walking under a trellised
    vine by connecting vine, grape juice, blood, soul, wine, intoxication, and possession.
    He then cites Egyptian and Aztec examples in which wine or pulque is treated as
    blood or as the vehicle of divine possession.
