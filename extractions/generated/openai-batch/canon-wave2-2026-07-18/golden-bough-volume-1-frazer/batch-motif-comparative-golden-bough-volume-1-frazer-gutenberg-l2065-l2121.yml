canonical_text:
  quote: ''
  summary: Frazer describes St. John's Eve and May Day customs involving decorated
    May-poles or May-trees in Sweden, Bohemia, Cornwall, Germany, and Austria, including
    fires, dancing, jumping or leaping over fire, lover-divination with garlands,
    preservation of garlands and embers, and annual renewal of trees in some regions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Sweden, midsummer, especially St. John's Eve on 23 June, is identified
    as the chief season for the ceremonies described.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Swedish houses are cleansed and garnished with green boughs and flowers; young
    fir-trees are raised near the homestead, and small arbours may be built in gardens.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Stockholm, a leaf-market sells many decorated May-poles of varying heights.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bonfires are lit on hills in Sweden, and people dance around them and jump
    over them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Swedish May-pole is described as a tall, straight spruce-pine tree stripped
    of branches and decorated with hoops, crosspieces, bows, leaves, flowers, cloth,
    gilt egg-shells, and a vane or flag at the top.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Swedish May-pole is decorated by village maidens; people gather from all
    quarters and dance around it in a large ring.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In parts of Bohemia, a May-pole or midsummer-tree is erected on St. John's
    Eve; lads fetch a tall fir or pine and set it on a height, where girls decorate
    it with nosegays, garlands, and red ribbons.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Brushwood, dry wood, and other combustible materials are piled about the Bohemian
    tree and set on fire after darkness falls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bohemian lads formerly climbed the burning tree to retrieve garlands and ribbons,
    but the custom was forbidden because it caused accidents.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Bohemian young people sometimes fling burning besoms into the air or run downhill
    with them while shouting.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the Bohemian tree is consumed, young men and their sweethearts stand
    on opposite sides of the fire and look at each other through garlands and through
    the fire to test whether they will be true lovers and marry.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Bohemian couples throw garlands three times across the smouldering fire, join
    hands, and leap three times across the glowing embers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Singed garlands are taken home and kept through the year; portions are burned
    during thunderstorms and fed to cattle when cattle are sick or calving.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Charred bonfire embers are placed in cornfields, meadows, and on house roofs
    to keep house and field from bad weather and injury.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: In England, the village May-pole is described as usually permanent in later
    times, though sometimes renewed annually.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: Cornish people are described as cutting a tall elm on May-eve, bringing it
    into town with rejoicing, fitting a pole to it, painting it, erecting it publicly,
    and dressing it on holidays with garlands, ensigns, and streamers.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: In parts of Germany and Austria, the May-tree or Whitsuntide-tree is renewed
    annually by felling and setting up a fresh tree.
  category: sequence
  evidence_refs:
  - ev:11
