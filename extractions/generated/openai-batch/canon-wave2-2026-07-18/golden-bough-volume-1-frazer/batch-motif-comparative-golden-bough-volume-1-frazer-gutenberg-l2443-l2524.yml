canonical_text:
  quote: Often the spirit of vegetation in spring is represented by a queen instead
    of a king.
  summary: Frazer surveys European spring, May Day, Lent, Whitsuntide, and Shrove
    Tuesday customs in which vegetation or tree-spirit is represented by queens, king-and-queen
    pairs, bridal pairs, leaf-clad sleepers, birch wreath rites, garlands, and a straw
    puppet disposed of by water or fire.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that the spirit of vegetation in spring is often represented
    by a queen rather than a king.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Libchowic neighbourhood, girls dressed in white and wearing first spring
    flowers lead a flower-crowned girl called the Queen through the village; they
    whirl and sing, and the Queen announces spring, wishes luck and blessings, and
    receives presents.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In German Hungary, girls choose the prettiest girl as Whitsuntide Queen, fasten
    a tall wreath on her brow, carry her singing through the streets, stop at houses,
    sing ballads, and receive presents.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In south-east Ireland on May Day, the prettiest girl was chosen Queen of the
    district for twelve months, crowned with wild flowers, and associated with feasting,
    dancing, sports, procession, and presiding over rural gatherings; marriage before
    the next May Day ended her authority.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage says the spirit of vegetation is sometimes represented by a king
    and queen, a lord and lady, or a bridegroom and bride, and connects this with
    tree-spirit representation and trees being married to each other.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Examples of paired figures include a Bohemian king and queen under a canopy,
    a Grenoble king and queen on a throne, a Headington lord and lady joined by a
    white handkerchief, and Saxon bridal or princely pairs sought outside the village
    and led back with music.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: At Headington on May Day, children carried garlands door to door, sang that
    they came to show a garland because it was May Day, and received money; afterward
    the lord put his arm around the lady and kissed her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Near Briançon on May Day, lads wrap in green leaves a young man whose sweetheart
    has left him; he lies on the ground pretending to sleep, and a girl who likes
    him wakes him, raises him, offers her arm and a flag, and the pair lead dancing
    at the alehouse.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: In the Briançon custom, the leaf-clad man is called the bridegroom of the
    month of May, must marry his partner within the year to avoid exclusion from young
    people's company, and his leaf garment is made with flowers into a nosegay worn
    by the partner.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: In the Nerechta district, girls go to a birch wood, wind a band around a stately
    birch, twist lower branches into a wreath, kiss each other in pairs through the
    wreath, enact a sleeping-and-waking scene, twine garlands, throw them into water,
    and read their fate from the floating garlands.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage notes that the sleeper role in the Russian custom was probably
    once sustained by a lad.
  category: other
  evidence_refs:
  - ev:4
- id: obs:12
  text: Among the Slovenes of Oberkrain on Shrove Tuesday, people drag a straw puppet
    through the village, then throw it into water or burn it, and judge the next harvest
    by the height of the flames; a female masker follows and says she is a forsaken
    bride.
  category: sequence
  evidence_refs:
  - ev:5
