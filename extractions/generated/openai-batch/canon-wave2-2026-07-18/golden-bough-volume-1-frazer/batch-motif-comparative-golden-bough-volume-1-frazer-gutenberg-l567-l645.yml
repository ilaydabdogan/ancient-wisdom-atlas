canonical_text:
  quote: ''
  summary: The passage surveys rain-making rites from several regions. It describes
    ritual imitation of thunder, lightning, mist, rain, and clouds; water being sprinkled,
    poured, squirted, or spilled; stones, sacred images, bones, plants, and a vegetation-clad
    girl being wetted or processed; and Frazer's explanation that such actions are
    examples of sympathetic or imitative magic.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a village near Dorpat, three men climbed fir-trees in an old sacred grove
    when rain was wanted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Dorpat rite included drumming on a kettle or cask to imitate thunder,
    striking fire-brands to imitate lightning, and sprinkling water with twigs by
    a man called the rain-maker.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the Dorpat example is sympathetic magic in which the
    desired event is supposed to be produced by imitating it.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: In Halmahera a wizard dipped a branch in water and sprinkled the ground, while
    in Ceram bark was dedicated to spirits and laid in water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In New Britain a rain-maker wrapped striped creeper leaves in a banana leaf,
    moistened the bundle, buried it, and imitated the sound of rain with his mouth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Among the Omaha, members of the sacred Buffalo Society danced around a vessel
    of water, sprayed water into the air, spilled it, drank from the ground, became
    muddy, and again made a mist-like spray.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Among the Wotjobaluk, a rain-maker used water in his hair and squirted or
    twirled it westward to make spray like rain; the passage also says squirting water
    from the mouth is a West African rain-making method.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Several examples involve dipping stones, crystals, or sacred objects in water,
    dropping water on them, or throwing water onto slabs, rocks, or named stones.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
- id: obs:9
  text: In Samoa a stone was housed as the representative of a rain-making god, and
    priests carried it in procession and dipped it in a stream during drought.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the Fountain of Baranton, peasants used water from the spring on a nearby
    slab; the passage says a cross was sometimes dipped there to procure rain.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: In Mingrelia a holy image was dipped in water daily until rain came, and in
    Navarre an image of St. Peter was taken to a river amid prayers and threats to
    duck it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In New Caledonia rain-makers blackened themselves, dug up a dead body, took
