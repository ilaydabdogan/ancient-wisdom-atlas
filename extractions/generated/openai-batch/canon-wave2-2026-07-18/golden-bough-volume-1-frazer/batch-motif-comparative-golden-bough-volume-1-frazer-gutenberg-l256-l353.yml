  summary: Frazer opens the chapter with the setting of Lake Nemi and the sacred grove
    of Diana Nemorensis, then describes the rule by which the priest known as King
    of the Wood held office only until another man killed him. He summarizes legends
    connecting the Nemi rite with Orestes, Tauric Diana, human sacrifice, Aeneas,
    and the Golden Bough.
