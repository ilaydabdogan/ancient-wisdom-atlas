canonical_text:
  quote: "“Come to life, come to life has our Kostrubonko!”"
  summary: Frazer describes Russian spring and midsummer funeral, burial, effigy,
    fire, water, lamentation, and revival rites associated with named figures including
    Kostrubonko, Kupalo, Marena, Kostroma, Lada, and Yarilo, then interprets them
    as comparable to German and Austrian customs and as rites concerning vegetation
    decline and revival.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that Russian funeral ceremonies resembling “Burying the
    Carnival” and “Carrying out Death” are celebrated under the names Kostrubonko,
    Kostroma, Kupalo, Lada, and Yarilo, and are observed in spring and at midsummer.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Eastertide in Little Russia, singers form a circle around a girl lying
    on the ground as if dead, sing that Kostrubonko is dead, and then rejoice when
    the girl suddenly springs up.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: On Midsummer Eve, a straw figure of Kupalo is dressed in woman’s clothes with
    a necklace and floral crown; a felled tree decked with ribbons is named Marena,
    and both the tree and figure are later stripped and thrown into a stream.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Kupalo rite includes a bonfire over which young men and maidens jump in
    couples while carrying the figure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Penza and Simbirsk, maidens choose one of their number to play Kostroma,
    salute her, place her on a board, carry her to a stream, and bathe her in the
    water.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Murom district, Kostroma is represented by a straw figure dressed in
    woman’s clothes and flowers, carried to water, attacked and defended by two sides,
    stripped, torn apart, trodden underfoot, and flung into the stream while defenders
    pretend to mourn.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the district of Kostroma, an old man carries a small coffin containing
    a Priapus-like figure representing Yarilo; women chant dirges, a grave is dug
    in open fields, and the figure is lowered into it amid weeping before games and
    dances begin.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In Little Russia, a figure of Yarilo is laid in a coffin and carried through
    the streets after sunset while women mourn that he is dead; men shake the figure
    as if trying to recall him to life, and the figure is finally buried in a grave.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The author states that these Russian customs are of the same nature as Austrian
    and German “Burying the Carnival” and “Carrying out Death” customs.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The author interprets Russian Kostroma, Yarilo, and related figures as original
    embodiments of the spirit of vegetation whose death preceded revival, and proposes
    that midsummer timing may relate to the shortening days and hoped-for renewal
    of plant life.
  category: other
  evidence_refs:
  - ev:8
  - ev:9
