  claim: The passage presents Dionysus as belonging to a wider pattern of vegetation
    gods who die violently and return to life, with ritual enactment of the divine
    suffering, death, and resurrection.
  claim_level: same_motif
  target: vegetation-god death-and-return pattern
  evidence_refs:
  - ev:1
  - ev:8
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: This is an explicit scholarly comparison in the source passage, not
    independent evidence of historical contact.
- id: claim:2
  claim: The passage compares pomegranates springing from Dionysus's blood with flowers
    springing from the blood of Adonis and Attis.
  claim_level: same_function
  target: blood-generated plant traditions of Adonis and Attis
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the image of a plant arising from divine
    blood; the passage does not claim identical narratives.
- id: claim:3
  claim: The passage states that Dionysus and Osiris were both conceived as vegetation
    deities associated with the lower world or the dead.
  claim_level: same_function
  target: Osiris as lower-world vegetation deity
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The claim follows Frazer's comparative interpretation within this passage
    and does not by itself establish historical contact or common inheritance.
- id: claim:4
  claim: The passage cautiously connects the annual underground sojourn of vegetation
    deities with their identification as gods of the dead.
  claim_level: same_function
  target: vegetation deities spending part of the year underground
  evidence_refs:
