canonical_text:
  quote: ''
  summary: Frazer summarizes myths and rites concerning the violent death, dismemberment,
    preservation of the heart, restoration, resurrection, underworld descent, and
    seasonal return of Dionysus, with Cretan, Delphic, Argive, and Lydian ritual or
    local traditions noted.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dionysus is described as a vegetation god believed to have died violently
    and been brought to life again, with his sufferings, death, and resurrection enacted
    in sacred rites.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Cretan myth as related here, Jupiter/Zeus is said to have entrusted
    the child Dionysus, along with throne and sceptre, to guards while going abroad.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Juno/Hera is said to have disliked the child, bribed the guards, and lured
    Dionysus with toys and a crafted looking-glass into an ambush.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The Titans are said to have attacked Dionysus, cut him limb from limb, boiled
    his body with herbs, and eaten it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Minerva/Athena is said to have kept Dionysus's heart and given it to Jupiter/Zeus,
    revealing the crime.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Jupiter/Zeus is said to have killed the Titans by torture, made an image enclosing
    the child's heart, and built a temple for Dionysus.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Pomegranates are said to have sprung from the blood of Dionysus.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: One version says Apollo pieced together Dionysus's severed limbs and buried
    them on Parnassus; the grave of Dionysus was shown in the Delphic temple beside
    a golden statue of Apollo.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Other versions describe Dionysus as made young again by Demeter, rising after
    burial and ascending to heaven, being raised by Zeus while wounded, or being begotten
    anew through the preserved heart.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Cretans are said to have held a biennial festival representing the sufferings
    and death of Dionysus, and where the resurrection belonged to the myth it was
    also enacted in the rites.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that the mysteries of Dionysus taught, or were used as
    evidence for, immortality of the soul.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: A different myth says Dionysus descended into Hades to bring up his mother
    Semele from the dead.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Argive tradition places the descent through the Alcyonian lake and celebrates
    his return by summoning him from the water with trumpet blasts while throwing
    a lamb into the lake as an offering to the warder of the dead.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage says the Lydians celebrated the advent of Dionysus in spring and
    that the god was supposed to bring the season with him.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage states that vegetation deities imagined to spend part of each
    year underground may become gods of the lower world or of the dead, and says Dionysus
    and Osiris were both so conceived.
  category: relationship
  evidence_refs:
  - ev:10
