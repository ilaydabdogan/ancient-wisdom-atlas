candidate_motifs:
- id: motif:1
  label: violent death and return of a vegetation god
  taxonomy_refs:
  - dying_and_returning
  - death_rebirth
  - resurrection
  basis: Dionysus is explicitly described as dying violently, being brought to life
    again, and having these events enacted in rites; multiple resurrection or rebirth
    variants are summarized.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:8
  confidence: high
  cautions: This is Frazer's comparative framing of the traditions rather than a single
    primary narrative version.
- id: motif:2
  label: dismembered god whose body is restored
  taxonomy_refs:
  - death_rebirth
  basis: The Titans dismember Dionysus, and later versions describe Apollo or Demeter
    piecing together the limbs.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage presents multiple versions that differ on burial, restoration,
    and resurrection.
- id: motif:3
  label: preserved heart as remnant enabling memorial or rebirth
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The heart is preserved, enclosed in an image, swallowed by Zeus in one version,
    or made into a potion through which Semele conceives Dionysus.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: The function of the heart differs among versions.
- id: motif:4
  label: underworld descent to recover a dead mother
  taxonomy_refs:
  - hero_descent
  basis: A distinct myth says Dionysus descended into Hades to bring Semele up from
    the dead.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives only a brief summary of the descent narrative.
- id: motif:5
  label: ritual summoning from water with offering to the dead
  taxonomy_refs:
  - sacrifice
  basis: Argives summon Dionysus from the water by trumpet blasts and throw a lamb
    into the lake as an offering to the warder of the dead.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not describe the full ritual sequence beyond these actions.
- id: motif:6
  label: seasonal return of a vegetation deity from underground
  taxonomy_refs:
  - seasonal_cycle
  - death_rebirth
  basis: The passage connects Dionysus's spring advent with the broader pattern of
    vegetation deities spending part of each year underground and becoming associated
    with the lower world.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The author notes that whether the Argive rite was a spring festival is
    not apparent.
- id: motif:7
  label: child invested with royal authority
  taxonomy_refs:
  - royal_legitimacy
  - divine_parent_child
  basis: Zeus/Jupiter transfers throne and sceptre to the child Dionysus before leaving.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage identifies this Cretan version as Euhemeristic and does not
    develop royal legitimacy as its main theme.
- id: motif:8
  label: mystery rite teaching immortality through divine resurrection
  taxonomy_refs:
  - initiation
  - resurrection
  basis: The Cretan festival enacts death and, where present, resurrection, and Plutarch
    is cited for immortality of the soul as revealed in the mysteries of Dionysus.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage says a doctrine of resurrection or immortality 'appears' to
    have been inculcated, so the claim is cautiously stated.
comparison_claims:
