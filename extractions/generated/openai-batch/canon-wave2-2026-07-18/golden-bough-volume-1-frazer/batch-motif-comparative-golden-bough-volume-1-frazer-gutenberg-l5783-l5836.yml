canonical_text:
  quote: "“the so-called Death—must be supposed to be endowed with a vivifying and
    quickening influence”"
  summary: 'Frazer argues that ritual figures of Death, after being destroyed or discarded,
    are treated as sources of renewed life and fertility: their clothing is transferred
    to a tree or girl, their fragments are placed in fields, mangers, or nests, cattle
    are struck after the rite, and a Leipzig effigy is thrown into a river for fertility,
    cleansing, and disease-aversion.'
  language: English
  quote_policy: quoted
