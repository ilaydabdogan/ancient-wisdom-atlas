canonical_text:
  quote: ''
  summary: Frazer describes European harvest and threshing customs in which a passing
    stranger, the last-corn worker, or the last sheaf is treated as an embodiment
    or representative of the corn-spirit. He explains some actions as treating the
    crop-spirit as an impoverished owner robbed by harvesters, gives examples of “Poor”
    or “Beggar” names for last sheaves, notes a Dutch Zealand madder-harvest custom
    involving pursuit and burial of a stranger, compares the pattern with the Lityerses
    story, and briefly mentions the Greek idea that gods may appear as foreigners.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the harvest-field and threshing-floor customs described, a passing stranger
    is regarded as a personification of the corn or corn-spirit and is treated like
    corn through actions such as mowing, binding, and threshing in show.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: During a madder-harvest custom in Zealand, a stranger who taunts the workers
    may be chased by two fast runners, brought back to the field if caught, buried
    in the earth at least up to the middle, jeered at, and subjected to a bodily excretion
    act before his face.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage explains that the spirit of corn and other cultivated plants is
    sometimes conceived as the owner of the plants, so harvesting, root-digging, and
    fruit-gathering are described as stripping him of property and reducing him to
    poverty.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Several regional examples name the last sheaf, its puppet, or the person binding
    it with poor or beggar terms, including Poor Old Woman, Poor Woman, Beggar-man,
    Rye-beggar, and Beggar.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The stranger in the madder-field explanation is treated as the representative
    of the robbed plant owner, while the madder-diggers are described as acting like
    robbers who immobilize him and bury him like the madder-roots.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that Greeks were familiar with the idea that a passing
    stranger may be a god and cites Homeric gods appearing in the likeness of foreigners.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the modern European harvest customs summarized, the person who cuts, binds,
    or threshes the last corn is treated as an embodiment of the corn-spirit by being
    wrapped in sheaves, killed in mimicry with agricultural implements, and thrown
    into water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage claims that similarities between these modern customs and the
    Lityerses story suggest that the Lityerses story describes an old Phrygian harvest-custom.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage notes that in the modern parallels actual killing is omitted or
    only mimically enacted, and it introduces the need to show cases of human killing
    as an agricultural ceremony for field fertility.
  category: other
  evidence_refs:
  - ev:9
