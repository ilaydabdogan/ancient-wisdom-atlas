canonical_text:
  quote: ''
  summary: Frazer describes Sicilian Easter plates of sprouting grain placed on Good
    Friday sepulchres and compares them to the gardens of Adonis. He then introduces
    Attis as a Phrygian counterpart to Adonis, summarizes accounts of Attis's death,
    transformation, and spring festival rites, including a sacred pine, blood-offering,
    mourning, celebration of resurrection, and bathing of Cybele's image and sacred
    objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sicilian women sow wheat, lentils, and canary-seed in plates before Easter,
    keep them in the dark, water them, tie the sprouting stalks with red ribbons,
    and place the plates on church sepulchres with effigies of the dead Christ on
    Good Friday.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that these sprouting plates are placed on sepulchres just
    as gardens of Adonis were placed on the grave of the dead Adonis.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states that the Sicilian custom is probably a continuation, under
    a different name, of Adonis worship.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Attis is presented as a Phrygian deity comparable to Adonis in Syria, associated
    by the author with vegetation and with an annual spring festival of mourning and
    rejoicing over death and resurrection.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says the legends and rites of Attis and Adonis were so similar
    that ancient people sometimes identified them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Attis is described as a fair youth beloved by the Phrygian goddess Cybele.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Two accounts of Attis''s death are given: he was killed by a boar, or he
    mutilated himself under a pine-tree and died from loss of blood.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says Attis's worshippers, especially the people of Pessinus, abstained
    from eating swine.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After his death Attis is said to have been changed into a pine-tree.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the spring equinox a pine-tree was cut in the woods, brought into Cybele's
    sanctuary, treated as a divinity, adorned with woollen bands and violets, and
    fitted with the effigy of a young man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Violets are said to have sprung from the blood of Attis, as anemones from
    the blood of Adonis.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: On the Day of Blood, the high priest drew blood from his arms and presented
    it as an offering; mourning over an effigy and solemn burial are also described
    as probable parts of the rite.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Festival of Joy, or Hilaria, is described as probably celebrating the
    resurrection of Attis soon after the celebration of his death.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Roman festival closed with a procession to the brook Almo, where Cybele's
    cart, her image, and other sacred objects were bathed; after returning, the cart
    and oxen were strewn with fresh spring flowers.
  category: sequence
  evidence_refs:
  - ev:10
