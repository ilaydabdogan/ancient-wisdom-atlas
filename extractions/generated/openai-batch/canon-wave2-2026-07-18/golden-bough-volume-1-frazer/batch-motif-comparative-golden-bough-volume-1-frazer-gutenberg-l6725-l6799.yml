canonical_text:
  quote: ''
  summary: Frazer presents Osiris as both corn-spirit and tree-spirit, describing
    rituals and iconography in which Osiris is enclosed in, represented by, or associated
    with trees, plants, grain, water, and annual burning of a wooden image. He then
    discusses Isis as difficult to define originally but strongly associated in cited
    sources with wheat, barley, corn-fields, harvest rites, bread, and Greek identification
    with Demeter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Osiris was described as both a corn-spirit and a tree-spirit,
    with the tree-spirit role presented as probably earlier.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A ceremony described by Firmicus Maternus involved cutting down a pine-tree,
    hollowing its center, making an image of Osiris from the removed wood, and placing
    the image in the hollow of the tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Osiris image made from the tree was kept for a year and then burned; Frazer
    says this was exactly like the treatment of an Attis image attached to a pine-tree.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage connects the tree-cutting ceremony with the mythic discovery of
    the body of Osiris enclosed in an erica tree and with the erection of the Tatu
    pillar at the close of the annual Osiris festival.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Denderah, the tree of Osiris is described as a conifer, and a coffer containing
    the body of Osiris is represented as enclosed within the tree.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage reports that pine-cones were offered to Osiris, that a Louvre
    manuscript says cedar sprang from Osiris, and that sycamore and tamarisk were
    also treated as his trees.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nut, the mother of Osiris, is frequently represented in a sycamore.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A tamarisk is represented overshadowing the coffer of Osiris, and another
    tamarisk scene at Philae shows two men pouring water on the tree.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that Osiris is represented as a corpse with ears of corn
    sprouting from him and sometimes as a mummy covered with a tree or plants.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: In inscriptions Osiris is called "the one in the tree" and "the solitary one
    in the acacia."
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Osiris's worshippers were forbidden to injure fruit-trees and were also not
    allowed to stop up wells of water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The passage says the original meaning of Isis is difficult to determine and
    notes that she is called many-named or thousand-named in Egyptian and Greek inscriptions.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The discovery of wheat and barley is attributed to Isis, and at her festivals
    stalks of these grains were carried in procession.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: At harvest-time, Egyptian reapers laid down the first cut stalks, beat their
    breasts, lamented, and called upon Isis.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Isis is given epithets linking her with the green crop, greenness of the earth,
    bread, corn-fields, fruits of the earth, ears of corn, and wheat-fields.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:16
  text: The Greeks are said to have identified Isis with Demeter in her character
    as a corn-goddess.
  category: relationship
  evidence_refs:
  - ev:6
