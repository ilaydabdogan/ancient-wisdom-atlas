canonical_text:
  quote: ''
  summary: Frazer describes harvest customs in Poland, Bohemia, Cracow, Lithuania,
    Russia, Bulgaria, Northumberland, and Cambridge involving the last sheaf or harvest
    figure. The last sheaf is often named as an Old Woman, Baba or Boba, shaped as
    a female figure, carried in a waggon, drenched with water, danced with, or treated
    as a Corn-queen, Corn-mother, or Harvest Queen. Some variants include a human
    last binder being named or wrapped as the figure, disposal of a doll in river
    or fire for crop fertility, and northern English harvest figures associated by
    cited observers with Ceres.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Poland the last sheaf is commonly called Baba, meaning Old Woman, and is
    said to have the Baba sitting in it.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In some Bohemian examples the Baba is made from the last sheaf in the figure
    of a woman with a great straw hat and is carried home on the last harvest-waggon.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Bohemian Baba may be delivered to the farmer, along with a garland, by two
    girls.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Women binding sheaves strive not to be last, because the passage reports a
    belief that the woman who binds the last sheaf will have a child next year.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The last sheaf may be tied with other sheaves into a large bundle with a green
    branch stuck on top.
  category: object
  evidence_refs:
  - ev:1
- id: obs:6
  text: Harvesters may call the woman who binds the last sheaf the Baba or say she
    has the Baba, and she then makes a corn puppet in female or male form.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: A doll called the Harvest-woman may be made from the last sheaf and adorned
    with ribbons; the oldest reaper dances first with the doll and then with the farmer's
    wife.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: In the Cracow district, if a man binds the last sheaf people say the Grandfather
    sits in it, and if a woman binds it they say the Baba sits in it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: In the Cracow district a woman associated with the last sheaf may be wrapped
    in the sheaf, carried on the last harvest-waggon, drenched with water at the house,
    remain in the sheaf until the dance is over, and retain the name Baba for a year.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: In Lithuania the last sheaf is called Boba, or Old Woman; it is said to sit
    in the last standing corn, and the last binder or last potato-digger may long
    retain names such as Old Rye-woman or Old Potato-woman.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Lithuanian Boba is made into the form of a woman, carried through the
    village on the last harvest-waggon, drenched with water at the farmer's house,
    and danced with.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: In Russia the last sheaf is often shaped and dressed as a woman and carried
    with dance and song to the farmhouse.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Bulgarian harvesters make a doll from the last sheaf called the Corn-queen
    or Corn-mother, dress it in a woman's shirt, carry it round the village, and either
    throw it into the river for rain and dew or burn it and strew the ashes on the
    fields.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: A Northumberland Harvest Queen image is described as finely dressed, crowned
    with flowers, holding a sheaf of corn under one arm and a sickle in one hand,
    taken to the field, fixed on a pole, and brought home after reaping.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: A Cambridge harvest-home example describes a performer dressed in woman's
    clothes, with painted face, ears of corn on the head, other symbols of Ceres,
    and carriage in a waggon through the streets while people call the rite drawing
    the Harvest Queen.
  category: sequence
  evidence_refs:
  - ev:7
