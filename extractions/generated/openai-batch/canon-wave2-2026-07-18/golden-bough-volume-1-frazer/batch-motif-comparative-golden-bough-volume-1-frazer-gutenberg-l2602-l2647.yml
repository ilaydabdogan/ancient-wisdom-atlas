canonical_text:
  quote: ''
  summary: 'Frazer describes the Boeotian Little and Great Daedala festivals at Plataea:
    an oak is selected by a raven, cut down, made into a bride-dressed image, processed
    to the river Asopus, stored, and later burned with accumulated images and animal
    sacrifices on Mount Cithaeron. He gives an origin story involving Hera, Zeus,
    a false bride, and reconciliation, then compares the rites to European spring
    and midsummer customs involving felled, dressed, immersed, or burned trees.'
  language: English
  quote_policy: summarized
