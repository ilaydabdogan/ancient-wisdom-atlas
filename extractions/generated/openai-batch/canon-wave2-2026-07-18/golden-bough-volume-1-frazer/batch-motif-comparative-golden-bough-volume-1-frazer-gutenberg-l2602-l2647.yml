  text: The Boeotians of Plataea held a festival called the Little Daedala every few
    years.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the festival day, participants went into an ancient oak forest, placed
    boiled meat on the ground, and watched the birds that gathered around it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a raven carried away a piece of meat and settled on an oak, the people
    followed it and cut down that tree.
  category: sequence
  evidence_refs:
