canonical_text:
  quote: ''
  summary: Frazer argues that the King of the Wood, as an incarnation of the tree-spirit
    or vegetation spirit, was killed so that divine vitality could pass undiminished
    to a stronger successor. He compares this rule with the Chitombé and the King
    of Calicut, then adduces Northern European rural festivals in which leaf-clad
    representatives of the tree-spirit are drenched, symbolically executed, or associated
    with a decorated May-tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The King of the Wood is described as regarded as an incarnation of the tree-spirit
    or spirit of vegetation, with power to make trees bear fruit and crops grow.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The life of the god-man is said to be precious and guarded by precautions
    or taboos against demons and sorcerers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the valued life of the man-god necessitates violent
    death to preserve it from the decay of age.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The King of the Wood is said to have to be killed so that the divine spirit
    incarnate in him may be transferred in unabated vigor to his successor.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The rule of office is described as lasting until a stronger person slays the
    incumbent; defeat and death are treated as proof that the incumbent’s strength
    is failing.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Chitombé is described as a figure upon whose life the existence of the
    world was supposed to hang and who was slain by his successor when he showed signs
    of breaking up.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The later King of Calicut is described as holding office on terms like the
    King of the Wood, except that he could be attacked only once every twelve years.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Frazer conjectures that the King of the Wood may earlier have been killed
    at the end of a set period without a chance for his life.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: The Lower Bavarian Pfingstl is described as a Whitsuntide representative of
    the tree-spirit clothed from head to foot in leaves and flowers.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Lower Bavarian rite, boys with swords accompany the leaf-clad boy,
    people douse him with water, he wades into a brook, and one boy pretends to cut
    off his head.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: At Wurmlingen, young fellows ride to the wood, cut leafy oak branches, and
    envelop the last rider to leave the village from head to foot in the branches.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Wurmlingen leaf-clad rider is given a long artificial neck, an artificial
    head, and a false face.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: A decorated May-tree is cut and entrusted to a May-bearer in the Wurmlingen
    ceremony.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the Wurmlingen procession, an executioner announces that the leaf-clad
    man has been condemned to death and cuts off his false head.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: After the false-head beheading at Wurmlingen, riders race to the May-tree,
    and the first to wrench it from the ground keeps it with its decorations.
  category: sequence
  evidence_refs:
  - ev:6
