  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage mentions a custom in modern Europe in which a figure of “Death”
    is torn into pieces and the fragments are buried in fields to improve crop growth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage reports Manetho's statement that ancient Egyptians burned red-haired
