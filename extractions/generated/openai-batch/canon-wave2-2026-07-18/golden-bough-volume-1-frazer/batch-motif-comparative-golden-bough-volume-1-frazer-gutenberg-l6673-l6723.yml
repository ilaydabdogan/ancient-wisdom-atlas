canonical_text:
  quote: ''
  summary: Frazer compares Osiris with Adonis and Attis as gods whose violent deaths
    are ritually mourned and annually celebrated. He presents Osiris as a vegetation
    and corn deity, discusses a Philae image of Osiris' dead body with corn stalks
    watered by a priest, interprets scattered or sieved remains as possible agricultural
    imagery, and compares related customs of distributing fragments or ashes to fertilize
    fields, including Egyptian red-haired victims and Mexican sacrifices keyed to
    maize growth stages.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage states that Osiris, Adonis, and Attis are similar in myth and
    ritual: each has an untimely violent death mourned by a loving goddess and annually
    celebrated by worshippers.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Osiris is described as a deity of vegetation who first taught humans the use
    of corn, began an annual festival with ploughing, and introduced vine cultivation.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A chamber in the temple of Isis at Philae is described as showing the dead
    body of Osiris with corn stalks springing from it, while a priest waters the stalks
    from a pitcher.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The inscription accompanying the Philae representation says that Osiris of
    the mysteries springs from the returning waters.
  category: speech
  evidence_refs:
