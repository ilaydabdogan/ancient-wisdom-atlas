  quote: ''
  summary: The passage describes sacred gifts from Cambodian Kings of Fire and Water,
    including a candle, rice, and sesame used in ritual contexts, then turns to Frazer’s
    comparative discussion of departmental kings of nature and European tree-worship,
    including sacred groves, sacred oaks, and sacred trees at Rome.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kings of Fire and Water send a huge wax candle and two calabashes, one
    containing rice and the other sesame, to the Cambodian monarch.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The candle bears the impress of the Fire King’s middle finger, is kept for
    sacred uses, is placed by Brahmans beside the regalia, and provides wax for tapers
    burned on altars on solemn days.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author conjectures that the candle contains the seed of fire and that
    the rice and sesame are gifts associated with the Water King, rain, and agricultural
    fruits.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: In times of calamity such as plague, floods, and war, a little sacred rice
    and sesame is scattered on the ground to appease maleficent spirits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The author presents the Cambodian examples as departmental kings of nature
    and uses them to frame the search for a King of the Wood comparable to the Arician
    priest.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage describes ancient Europe as heavily forested and gives examples
    from the Hercynian forest, Britain, northern Italy, and Greece.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage reports Grimm’s view that Teutonic words for temple make it probable
    that the oldest German sanctuaries were natural woods.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tree-worship is said to be attested among European Aryan groups including
    Celts, Germans, ancient Prussians, Lithuanians, Greeks, and Italians.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
- id: obs:9
  text: At Upsala, every tree in a sacred grove is said to have been regarded as divine.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Romove, sacred oaks were tended by priests who maintained a perpetual fire
    of oak-wood in a holy grove.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the Roman Forum, the sacred fig-tree of Romulus was worshipped, and the
