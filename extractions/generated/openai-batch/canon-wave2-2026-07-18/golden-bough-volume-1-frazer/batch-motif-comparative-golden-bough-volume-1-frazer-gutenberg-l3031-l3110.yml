canonical_text:
  quote: ''
  summary: 'Frazer gives comparative examples in which kingship is treated as dangerous
    or burdensome, including forced succession, abdication to infant heirs, and divisions
    between nominal-sacred sovereignty and effective temporal power. He then introduces
    a theory of taboos around divine kings or priests: death is explained as the permanent
    absence of the soul, while sleep or trance is temporary absence, so taboos function
    to keep the soul in the body or secure its return.'
  language: English
  quote_policy: summarized
