canonical_text:
  quote: the corn-spirit is often believed to be killed at reaping or threshing
  summary: Frazer compares the Lityerses story with European harvest customs in which
    a corn-spirit is said to be killed at reaping or threshing. He gives examples
    involving the last sheaf, last stalks, last stroke, puppets, human representatives,
    water-drenching or immersion, and the binding of strangers or first-time visitors
    in crop material.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage introduces a comparison between the Lityerses story and European
    harvest customs, stating that the corn-spirit is often believed to be killed at
    reaping or threshing.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Norway and Bavaria, the end of haymaking or the last stroke at threshing
    is described as killing named crop figures such as the Old Hay-man, Corn-man,
    Oats-man, or Wheat-man.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Lothringen and Lithuania, the last corn or last handful is associated with
    an Old Woman, Boba, or Old Rye-woman, and the person who cuts it is said to kill
    or behead her.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In one Lithuanian threshing scene, the final flail stroke after a command
    to halt identifies the striker as the one who has struck the Old Rye-woman dead;
    he then treats the others to brandy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Lithuanian example represents the slain corn-spirit with a female figure
    made of corn-stalks, dressed in clothes, and placed under the last heap of corn
    to be threshed.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage also describes a man lying under the last corn while it is threshed
    upon his body, and a farmer's wife being thrust with the last sheaf under a threshing-machine
    in a pretended threshing and winnowing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Volders and in Carinthia, persons connected with the last threshing or
    last sheaf are bound with straw, crowned or garlanded with straw, dragged, and
    flung into a river or brook.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage explicitly says that throwing the representative of the corn-spirit
    into a stream, like drenching him with water, is a rain-charm.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the discussion of strangers and first-time visitors, reapers or threshers
    in Germany bind passers-by, farmers, or guests with ropes made of corn-stalks
    until a forfeit is paid.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Examples from Solör, Soest, and Nördlingen describe entrants or passers-by
    being tied in a sheaf, flax, or straw ropes and required to pay ransom, forfeit,
    or brandy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Brie, an outsider passing a harvest-field is chased, bound in a sheaf,
    bitten on the forehead, and told that he shall carry the key of the field.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage explains that carrying the key of the field is equivalent to being
    called the Old Man and thus to being treated as an embodiment of the corn-spirit.
  category: relationship
  evidence_refs:
  - ev:8
