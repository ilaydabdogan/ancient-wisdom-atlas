canonical_text:
  quote: ''
  summary: Frazer interprets the gardens and images of Adonis, European water-drenching
    customs, and a Babylonian Thammuz legend as related rain- and vegetation-renewal
    rites based on sympathetic magic. The passage also describes Istar descending
    to Hades for the water of life and notes Thammuz’s association with a great tree
    at the earth’s centre.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author interprets the gardens of Adonis as representatives or manifestations
    of Adonis in vegetable form, while images represent him in anthropomorphic form.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Adonis ceremonies were intended as charms to promote
    the growth and revival of vegetation through sympathetic magic.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage gives examples of sympathetic action: sprinkling water to make
    rain, lighting fire to make sunshine, and mimicking crop growth to secure harvest.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The rapid growth of wheat and barley in Adonis gardens is linked by the author
    to making corn shoot up, and their throwing into water is linked to securing fertilising
    rain.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: European customs described include throwing effigies of Death and Carnival
    into water and drenching a leaf-clad person to produce rain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Wallachia and among Roumanians and Saxons of Transylvania, a girl or person
    associated with a crown or wreath of the last cut corn is drenched with water
    for the sake of future crops.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Prussian ploughing and harvest customs, ploughmen, sowers, or the wearer
    of the last-corn wreath are splashed, ducked, or drenched with water to ensure
    rain or crop increase.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Babylonian legend summarized here, Istar descends to Hades to fetch
    the water of life to restore the dead Thammuz.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The author describes a probable Babylonian Thammuz festival in which a dead
