canonical_text:
  quote: ''
  summary: Frazer presents comparative examples of beliefs that the human soul is
    a smaller or subtler double of the body, may depart at death or through bodily
    openings, and can be retained by ritual measures such as closing openings, catching
    or bottling the soul, tying bands, and using rice to lure a bird-like soul to
    remain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'A European missionary tells Australian interlocutors that he is “two in one”:
    a visible great body and an invisible little one; the great body dies and is buried
    while the little body flies away.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Australian interlocutors reply that they also are two and have a little
    body within the breast; when asked where it goes after death, answers include
    behind the bush, into the sea, or not knowing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Hurons are described as thinking the soul has head, body, arms, and legs,
    forming a complete little model of the person.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Eskimos are described as believing that the soul has the same shape as
    the body but is more subtle and ethereal.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The people of Nias are described as thinking that before birth each person
    receives a soul measured by desired weight or length, and that lifespan is proportioned
    to soul length.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that the soul is commonly supposed to escape by natural
    openings of the body, especially the mouth and nostrils.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Examples of preventing soul escape include fish-hooks attached to a sick man,
    a hollow bone used by a Haida medicine-man to bottle departing souls, holding
    a dying person’s mouth and nose, snapping thumbs when someone yawns, and sealing
    a dying person’s openings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Childbirth protections in Celebes include tying a tight band around the expectant
    mother and, among the Alfoers of Celebes, closing house openings, stopping chinks,
    tying animal mouths, and requiring people present to keep their mouths shut.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says the soul is often conceived as a bird ready to take flight.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Rice, clucking sounds, and related fowl imagery are described as ways to attract
    or detain the soul in examples from Java, the Battas of Sumatra, and Celebes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At festivals in South Celebes, the soul is said to be in especial danger of
    being lured away by envious demons.
  category: relationship
  evidence_refs:
  - ev:6
