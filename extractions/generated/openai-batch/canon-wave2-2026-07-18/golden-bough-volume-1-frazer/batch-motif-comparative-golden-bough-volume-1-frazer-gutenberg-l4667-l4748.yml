canonical_text:
  quote: ''
  summary: Frazer surveys customs and reported rules concerning divine or royal rulers
    whose bodily defects, illness, or actions affect their legitimacy and their subjects.
    The passage includes Sofala kings killed for defects, a leprous prince who resolves
    to poison himself, a Quiteva who abolishes a tooth-loss death law, conjectures
    about Ethiopian royal execution, examples of defectless kingship and courtly imitation,
    and an Old Prussian divine spokesman who self-immolates with sacred fire before
    a holy oak.
  language: English
  quote_policy: summarized
