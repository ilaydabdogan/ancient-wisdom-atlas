- id: obs:1
  text: The passage says the kings of Sofala were regarded as gods by their people
    and were entreated to give rain or sunshine as needed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Sofala custom described, even a slight bodily blemish such as the loss
    of a tooth was treated as sufficient cause for putting a god-king to death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prince Sedanda, afflicted with leprosy, resolved to follow the country
    law by poisoning himself and naming his successor because a sovereign should have
    no bodily defect.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An unnamed Quiteva who had lost a tooth publicly announced the loss, refused
    to die, condemned the earlier practice, and established a new law allowing sane
    successors to follow his precedent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author conjectures that Ethiopian kings may have been killed when bodily
    defects or signs of decay appeared, and connects this conjecture with an oracle
    against a blemished reign and a Spartan warning against a lame reign.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage reports rules or conditions requiring rulers in Wadâi and Angoy
    to have no obvious bodily blemish.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A later Ethiopian rule is reported in which, if the king became maimed, all
    his courtiers had to undergo the same mutilation; the author suggests this may
    have replaced the earlier killing of a defective king.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the court of the Sultans of Darfur, courtiers imitate the Sultan's cough,
    sneeze, and fall from a horse; a follower who remains mounted when the Sultan
    falls is beaten.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the court of the King of Uganda, everyone imitates the king's laugh, sneeze,
    cold, and haircut.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the court of Boni, courtiers do what the king does, including standing,
