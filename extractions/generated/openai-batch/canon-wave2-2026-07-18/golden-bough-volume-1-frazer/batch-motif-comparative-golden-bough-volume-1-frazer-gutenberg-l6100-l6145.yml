canonical_text:
  quote: death and resurrection of vegetation
  summary: 'Frazer frames the rites of several Egyptian and Western Asian deities
    as ceremonies of vegetation decay and revival, then summarizes Adonis/Thammuz
    traditions: Adonis is a youthful beloved of Aphrodite/Astarte, killed by a boar,
    mourned annually, represented by corpse-like images, sometimes revived the next
    day, ritually married and cast into the sea at Alexandria, and mourned/revived
    at Byblus where red river water and anemones are linked to his blood.'
  language: English
  quote_policy: quoted
