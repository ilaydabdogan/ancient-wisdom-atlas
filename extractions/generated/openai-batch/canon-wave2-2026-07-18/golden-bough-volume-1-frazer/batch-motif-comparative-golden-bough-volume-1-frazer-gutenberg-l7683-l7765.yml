canonical_text:
  quote: ''
  summary: Frazer compares agricultural rites in which a crop-spirit or crop-mother
    is embodied in a puppet, sheaf, or selected plant, preserved through the agricultural
    cycle, renewed or destroyed if weak, buried or distributed as a talisman, and
    invoked to promote crop growth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A puppet representing the corn-spirit is kept until the next harvest as a
    charm to maintain the corn-spirit in life and activity through the year.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ancient Peruvians are described as taking a portion of the most fruitful maize,
    placing it in a granary called Pirua with ceremonies, and watching for three nights.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Peruvian maize portion is wrapped in rich garments, venerated, and called
    the mother of the maize.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ritual specialists ask whether the maize/Pirua has strength to continue until
    the next year; if not, it is burned and another is made so that the maize seed
    will not perish.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:5
  text: Frazer reports that Peruvians believed useful plants to be animated by divine
    beings who cause their growth, with plant-specific mothers such as Maize-mother,
    Quinoa-mother, Cocoa-mother, and Potato-mother.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Figures of these plant mothers were made from plant materials, dressed in
    women’s clothes, and worshipped.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Maize-mother is described as a puppet made of maize stalks, dressed in
    full female attire, and believed to have power to produce and give birth to much
    maize.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Frazer states that the Peruvian Mother of the Maize was normally kept for
    a year, but was killed and replaced if her strength appeared to fail.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Zapotec harvest custom, priests, nobles, and people process to the maize
    fields, select the largest and finest sheaf, carry it to a temple altar adorned
    with wild flowers, sacrifice to the harvest god, wrap the sheaf in linen, and
    keep it until seed-time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At seed-time the Zapotec sheaf is enclosed in an ornamented wild-beast skin,
    carried back to its field, deposited in a subterranean chamber, accompanied by
    sacrifice to field gods, and covered with earth before sowing begins.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Near harvest, the buried Zapotec sheaf is disinterred; its grain is distributed
    and preserved as talismans until harvest.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Frazer says the purpose of keeping the finest Zapotec sheaf buried in the
    maize field from seed-time to harvest was to quicken the growth of maize.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the Punjaub, the largest cotton plant is selected when cotton boles begin
    to burst, sprinkled with buttermilk and rice-water, bound with cotton from other
    plants, called mother-cotton, saluted, and prayed to so other plants may resemble
    it in produce.
  category: sequence
  evidence_refs:
  - ev:7
