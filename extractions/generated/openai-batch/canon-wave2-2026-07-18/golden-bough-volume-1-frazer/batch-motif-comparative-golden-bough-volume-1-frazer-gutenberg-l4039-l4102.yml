  quote: ''
  summary: Frazer lists examples of rulers whose movements or visibility are restricted
    because of their sacred status, including secluded kings, rulers accessed by signals
    for judgment, and royal processions hidden by barriers. He then turns to taboos
    concerning food remains and vessels, describing cases where remnants may be used
    for harmful magic and where kings or ritual specialists must use separate vessels
    or avoid eating and drinking with others.
  language: English
  quote_policy: summarized
