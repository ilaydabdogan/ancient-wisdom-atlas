canonical_text:
  quote: ''
  summary: Frazer lists European seasonal customs in which a person is covered or
    encased in leaves, branches, or greenery and led or processed through a village,
    often collecting gifts and later feasting. He then interprets such figures as
    equivalent to May-trees, May-boughs, or May-dolls and as representatives of the
    beneficent spirit of vegetation, sometimes titled king or queen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Ruhla, when trees begin to green in spring, children assemble on a Sunday,
    go into the woods, and choose a playmate as the Little Leaf Man.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chosen child is covered with branches until only his shoes show; openings
    are made for sight, and two children lead him to prevent stumbling or falling.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Ruhla children sing and dance from house to house, ask for gifts of food,
    sprinkle the Leaf Man with water, and then feast on the collected food.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: In England, Jack-in-the-Green is a chimney-sweeper encased in a pyramidal
    wicker frame covered with holly and ivy and topped with flowers and ribbons; he
    dances on May Day with chimney-sweeps who collect pence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In parts of France, a young fellow is enclosed in a leaf-covered wicker framework
    and led about.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Frickthal, village lads secretly make a leaf-covered basketwork frame called
    the Whitsuntide Basket and try to set it and its wearer beside the village well
    while neighbouring lads try to carry it off to their own well.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Near Ertingen, the Lazy Man goes about on Midsummer Day hidden under a tall
    fir-covered wicker frame, ringing a bell and remaining silent while costumed attendants
    speak in character.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Ertingen procession begs from door to door and later holds a feast with
    what is collected.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Frazer states that the leaf-clad person led about is equivalent to the May-tree,
    May-bough, or May-doll carried house to house by begging children.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Frazer states that both the leaf-clad person and the May-tree, May-bough,
    or May-doll are representatives of the beneficent spirit of vegetation, whose
    household visit is rewarded with food or money.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Frazer says the vegetation representative is often called king or queen, with
    examples including May King, Whitsuntide King, and Queen of May.
  category: attribute
  evidence_refs:
  - ev:7
