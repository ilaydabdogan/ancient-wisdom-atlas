- id: claim:3
  claim: Across the cited examples, the passage presents a broader comparative pattern
    in which the soul is separable, vulnerable to capture or displacement, and recoverable
    by ritual action.
  claim_level: same_motif
  target: Cross-cultural soul loss and soul recovery pattern in the passage
