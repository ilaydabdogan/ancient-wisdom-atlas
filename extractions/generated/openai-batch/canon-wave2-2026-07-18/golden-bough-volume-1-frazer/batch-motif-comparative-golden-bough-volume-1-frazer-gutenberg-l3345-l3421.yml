canonical_text:
  quote: ''
  summary: The passage surveys reported beliefs and rites in which a human soul may
    be inhaled, abducted, displaced, wrapped, caught, ransomed, substituted, or restored
    by demons, gods, ritual specialists, friends, wizards, or doctors across several
    named cultures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Annamites are reported to believe that a demon can inhale a man's breath
    and soul when the man meets and speaks to him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Dyak leaving a forest asks the demons to return his soul, because a forest-devil
    may have carried it away without his awareness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Moluccas, illness is attributed to a devil carrying a person's soul
    to the devil's dwelling at a tree, mountain, or hill.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Friends of the Moluccan patient bring offerings to the devil's abode, pray
    for the soul's release, let a hen loose as ransom, and later tell the patient
    that the soul has been released.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: A later Moluccan account describes a friend calling the patient's name three
    times, motioning with a cloth as if catching the soul, returning without looking
    aside or speaking, and placing the cloth on the patient's throat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A substitute doll may be offered to the demon in exchange for the patient's
    soul, and the Mongols are reported to make a birch-bark horse and a doll for the
    demon to take instead of the patient.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Among the Alfoers of Celebes, a house-warming ceremony includes a priest hanging
    a bag, reciting a list of gods through the night, offering egg and rice, and placing
    the soul-filled bag on household members' heads.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Among the same Alfoers, a sick man's soul may be recovered by lowering a bowl
    by a belt from a window and fishing until the soul is caught and hauled up.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: When an Alfoer priest brings back a sick man's soul in a cloth, a girl shades
    him with a palm leaf and a man follows with a sword to deter other souls from
    rescuing the captured soul.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: In a Samoan story, mountain gods pass a dying chief's soul wrapped in a leaf,
    and one young wizard receives it in the dark after being mistaken for a god.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Samoan wizards open the leaf and let the soul back into the chief, after
    which he brightens and lives.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Battas of Sumatra are reported to believe that a living person's soul
    may transmigrate into an animal, and a doctor may be asked to extract a patient's
    soul from a fowl where an evil spirit has hidden it.
  category: relationship
  evidence_refs:
  - ev:12
