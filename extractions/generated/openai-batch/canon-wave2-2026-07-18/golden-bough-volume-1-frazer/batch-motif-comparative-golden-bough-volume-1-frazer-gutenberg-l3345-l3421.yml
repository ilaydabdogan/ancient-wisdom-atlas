  claim: The passage explicitly presents the Moluccan substitute doll and the Mongol
    birch-bark horse with doll as similar exchanges intended to divert a demon from
    the patient to a substitute.
  claim_level: same_function
  target: Moluccan substitute-doll rite and Mongol birch-bark horse/doll rite
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives only brief descriptions and does not establish historical
    connection.
- id: claim:2
  claim: 'The passage groups several Alfoer procedures as local variants for recovering
    or securing souls: a house-warming bag rite, bowl-fishing for a sick man''s soul,
    and cloth-borne soul return.'
  claim_level: same_function
  target: Alfoer bag, bowl, and cloth soul-recovery procedures
