canonical_text:
  quote: ''
  summary: Frazer interprets an awakening sleeper ceremony as probably representing
    spring vegetation revival while noting uncertainty about the roles of the sleeper
    and the waking girl. He describes spring customs involving Brüd or Bridget beds,
    May Brides, Whitsuntide Brides, and May-trees, then argues that persistent European
    peasant customs point to ancient tree-worship and comparable Greek and Roman practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that the awakening of a forsaken sleeper in the ceremonies
    probably represents the revival of vegetation in spring, but says the roles of
    the sleeper and the waking girl cannot be securely assigned.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage recalls that the Oraons of Bengal celebrate the marriage of earth
    in spring when the sál-tree is in blossom, while warning against using this to
    fix the roles in European ceremonies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Hebrides on Candlemas day, household women make a sheaf of oats into
    a female-dressed figure, place it in a large basket with a wooden club, and call
    it Brüd’s bed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Hebridean participants welcome Brüd three times and in the morning inspect
    the ashes for an impression of Brüd’s club, treating the impression as a good
    crop and prosperity omen and its absence as ill omen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Another account describes a bed of corn and hay near the door on the night
    before Candlemas, an invitation to Bridget to enter, and candles left burning
    near the bed through the night.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says that the marriage of the spirit of vegetation in spring is
    often implied by calling a human representative “the Bride” and dressing her in
    wedding attire.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Altmark at Whitsuntide, boys carry a May-tree or lead a boy covered in
    leaves and flowers, while girls lead a May Bride from house to house; the May
    Bride sings for a present and links giving or withholding with abundance or lack
    during the year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In parts of Westphalia, two girls lead a flower-crowned girl called the Whitsuntide
    Bride from door to door while singing for eggs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Bresse in May, a girl called la Mariée is adorned with ribbons and nosegays,
    led by a gallant, preceded by a lad carrying a green May-tree, and accompanied
    by songs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The author concludes that similar European peasant customs represent the tree-spirit
    or spirit of vegetation and uses their persistence and similarity to infer former
    tree-worship in Aryan Europe and comparable Greek and Roman practices.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
