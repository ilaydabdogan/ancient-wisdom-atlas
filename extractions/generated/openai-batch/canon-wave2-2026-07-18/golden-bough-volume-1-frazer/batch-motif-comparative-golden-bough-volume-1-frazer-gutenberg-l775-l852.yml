  quote_or_summary: Primitive man is said to fancy he can make the sun shine and hasten
    or stay its setting; the Ojebways, treating an eclipse as the sun being extinguished,
    shoot fire-tipped arrows upward to rekindle its light.
  source_text_path: texts/public-domain/comparative/project-gutenberg/golden-bough-volume-1-frazer.md
  rights_note: Public domain source; metadata permits full-text use.
- id: ev:2
  type: summary
  locator: lines 780-785
  quote_or_summary: During a lunar eclipse, some Indian tribes of the Orinoco bury
    lighted brands in the ground because, if the moon is extinguished, all fire on
    earth would be extinguished except fire hidden from the moon’s sight.
  source_text_path: texts/public-domain/comparative/project-gutenberg/golden-bough-volume-1-frazer.md
  rights_note: Public domain source; metadata permits full-text use.
- id: ev:3
  type: summary
  locator: lines 785-804
  quote_or_summary: A New Caledonian wizard makes a sunshine charm from plants, coral,
    child hair, and ancestor bones, places it on a mountain-top altar, kindles fire
    when the sun rises from the sea, rubs stone with coral, invokes ancestors, and
    asks the sun to burn hot and consume clouds; the ceremony is repeated at sunset.
  source_text_path: texts/public-domain/comparative/project-gutenberg/golden-bough-volume-1-frazer.md
  rights_note: Public domain source; metadata permits full-text use.
- id: ev:4
  type: summary
  locator: lines 804-817
  quote_or_summary: When the sun rises behind clouds, the Sun clan of the Bechuanas
    says it grieves their heart; work stops, previous food is given to matrons or
    old women and nursing children, people wash in the river, men exchange hearth
    stones for river stones, the chief kindles fire in his hut, subjects take light
    from it, and a dance follows.
  source_text_path: texts/public-domain/comparative/project-gutenberg/golden-bough-volume-1-frazer.md
  rights_note: Public domain source; metadata permits full-text use.
- id: ev:5
  type: summary
  locator: lines 817-821
  quote_or_summary: The passage states that in these cases lighting flame on earth
    seems intended to rekindle solar fire, and notes that the Sun clan of the Bechuanas
    deem themselves true kinsmen of the sun.
  source_text_path: texts/public-domain/comparative/project-gutenberg/golden-bough-volume-1-frazer.md
  rights_note: Public domain source; metadata permits full-text use.
- id: ev:6
  type: summary
  locator: lines 821-826
  quote_or_summary: 'Melanesians make sunshine with a mock sun: a round stone wound
    with red braid and owl feathers for rays and hung on a high tree, or a stone laid
    on the ground with white rods radiating like sunbeams.'
  source_text_path: texts/public-domain/comparative/project-gutenberg/golden-bough-volume-1-frazer.md
  rights_note: Public domain source; metadata permits full-text use.
- id: ev:7
  type: summary
  locator: lines 826-831
  quote_or_summary: 'The passage says sunshine-making can be the converse of rain-making:
    a white or red pig is sacrificed for sunshine and a black one for rain; some New
    Caledonians drench a skeleton to make rain but burn it to make sunshine.'
  source_text_path: texts/public-domain/comparative/project-gutenberg/golden-bough-volume-1-frazer.md
  rights_note: Public domain source; metadata permits full-text use.
- id: ev:8
  type: summary
  locator: lines 833-836
  quote_or_summary: In a Peruvian Andean pass, two ruined towers on opposite hills
    have iron hooks for stretching a net between them, and the net is intended to
    catch the sun.
  source_text_path: texts/public-domain/comparative/project-gutenberg/golden-bough-volume-1-frazer.md
  rights_note: Public domain source; metadata permits full-text use.
- id: ev:9
  type: summary
  locator: lines 838-844
