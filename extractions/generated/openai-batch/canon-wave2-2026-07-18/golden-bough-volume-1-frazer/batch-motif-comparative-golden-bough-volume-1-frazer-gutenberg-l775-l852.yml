canonical_text:
  quote: ''
  summary: The passage surveys examples, as reported by Frazer, in which different
    peoples are said to make sunshine, rekindle eclipsed solar or lunar light, preserve
    fire, catch or detain the sun, release an imprisoned sun, or hasten the sun’s
    setting through ritual acts involving fire, stones, trees, reeds, nets, bones,
    sacrifices, and other objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that primitive man is imagined as believing he can make
    the sun shine and can hasten or delay its setting.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ojebways are reported to have treated an eclipse as the sun being extinguished
    and to have shot fire-tipped arrows upward to rekindle its light.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some Indian tribes of the Orinoco are reported to have buried lighted brands
    during a lunar eclipse to keep earthly fire from being extinguished with the moon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A New Caledonian wizard is described as preparing a bundle from plants, coral,
    child hair, and ancestor remains, placing it at a mountain-top altar, kindling
    fire at sunrise, rubbing stone with coral, invoking ancestors, and addressing
    the sun.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the sun rises behind clouds, the Sun clan of the Bechuanas are described
    as stopping work, distributing the previous day’s food to matrons or old women,
    washing in the river, exchanging hearth stones for river stones, taking fire from
    the chief’s hut, and dancing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage explicitly interprets several flame-lighting practices as attempts
    to rekindle solar fire and notes that the Bechuana Sun clan regard themselves
    as kinsmen of the sun.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: Melanesians are reported to make sunshine by constructing a mock sun from
    a round stone with red braid and owl feathers, or by placing a stone with white
    rods radiating from it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage contrasts white or red pig sacrifice for sunshine with black pig
    sacrifice for rain, and contrasts drenching a skeleton for rain with burning it
    for sunshine.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Two ruined towers in a Peruvian Andean pass are described as having hooks
    for stretching a net between them, with the net intended to catch the sun.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Travellers in Fiji are reported to tie reed tops together to detain the sun,
    and the passage compares this to entangling the sun in a Peruvian net and to stories
    of men catching the sun in a noose.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Lithuanian priests are reported to have told of a period when a powerful king
    shut the sun in a strong tower until the signs of the zodiac broke the tower open
    with an iron hammer and released the sun.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Australian, Yucatan, and South African practices are described in which sod,
    stone, grass, or eyelashes are placed, moved, or blown in relation to the sun,
    trees, branches, paths, or travel in order to delay sunset or keep a meal waiting.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The passage reports an Australian custom of placing stones in trees to mark
    the sun’s height for followers, suggests this may have led to the idea of arresting
    the sun at the marked point, and adds that Australians may throw sand and blow
    toward the sun to make it set faster.
  category: sequence
  evidence_refs:
  - ev:12
