candidate_motifs:
- id: motif:1
  label: Earthly fire used to rekindle or preserve celestial light
  taxonomy_refs: []
  basis: The Ojebways shoot fire-tipped arrows toward an eclipsed sun; Orinoco tribes
    bury brands during a lunar eclipse; the New Caledonian wizard and Bechuana rite
    kindle fires; the passage states that earth flame is supposed to rekindle solar
    fire.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The general interpretation is Frazer’s framing of reported practices,
    not an explanation supplied by every group described.
- id: motif:2
  label: Making sunshine through analogical objects or ritual operations
  taxonomy_refs: []
  basis: The New Caledonian rite addresses the sun through fire, coral, stones, and
    charms, while Melanesians use a mock sun of stone, red braid, feathers, and radiating
    rods to make sunshine.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: The passage presents these examples through a comparative scholarly lens;
    local meanings beyond the described actions are not supplied.
- id: motif:3
  label: Sacrifice or treatment of remains to obtain sunshine or rain
  taxonomy_refs:
  - sacrifice
  basis: The passage states that white or red pigs are sacrificed for sunshine and
    black pigs for rain, and that some New Caledonians drench a skeleton for rain
    but burn it for sunshine.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: Only the pig example is explicitly called sacrifice; skeleton drenching
    or burning is a related ritual contrast but not explicitly labeled sacrifice.
- id: motif:4
  label: Catching, entangling, or detaining the sun
  taxonomy_refs: []
  basis: A Peruvian net is intended to catch the sun, Fiji travellers tie reeds to
    detain the sun, and the passage mentions widespread stories of men catching the
    sun in a noose.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The noose stories are mentioned generally without individual source details
    in this passage.
- id: motif:5
  label: Imprisoned sun released by powerful agents and a sacred implement
  taxonomy_refs:
  - return
  basis: In the Lithuanian priests’ story, the sun is invisible for months because
    a king has shut it in a tower; the signs of the zodiac break the tower open with
    an iron hammer and release the sun.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The available taxonomy reference 'return' only broadly fits the sun’s
    release after absence; the passage does not use that term.
- id: motif:6
  label: Travel rites to retard or hasten the sun
  taxonomy_refs: []
  basis: Australian, Yucatan, and South African travellers use sods, stones, grass,
    eyelashes, sand, and blowing to stay the sun, delay a meal, mark the sun’s progress,
    or hasten sunset.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: Frazer’s proposed explanation that marking the sun’s progress may be confused
    with arresting it is explicitly tentative.
- id: motif:7
  label: Kinship between human group and the sun
  taxonomy_refs: []
  basis: The Sun clan of the Bechuanas is said to deem itself the veritable kinsmen
    of the sun.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage gives the kinship claim briefly and does not describe a fuller
    genealogy or myth.
comparison_claims:
- id: claim:1
  claim: The passage groups several practices as sharing the function of using earthly
    flame to rekindle, preserve, or intensify celestial fire or light.
