canonical_text:
  quote: ''
  summary: Frazer describes sympathetic magic as a belief that acts or qualities cause
    resembling effects, illustrates it with Bechuana charms using ferret, insect,
    ox, and frog qualities, distinguishes an inspired man-god from a man-god empowered
    through physical sympathy with nature, and introduces supposed human control over
    rain, sun, and wind.
  language: English
  quote_policy: summarized
