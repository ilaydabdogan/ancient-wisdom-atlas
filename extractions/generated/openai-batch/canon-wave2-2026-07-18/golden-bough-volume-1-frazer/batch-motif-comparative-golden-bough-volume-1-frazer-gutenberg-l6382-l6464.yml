  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: In Italy and Sicily, plants are put in water or earth on St. John’s Eve, and
    their blooming or fading on St. John’s Day is used for omens, especially about
    love.
  category: sequence
  evidence_refs:
  - ev:8
