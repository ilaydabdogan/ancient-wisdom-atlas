  text: The Swedish and Bohemian examples include the raising of a May-pole or Midsummer-tree,
    and in Bohemia the tree is burned in the bonfire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Russian ceremony, a straw figure of Kupalo is placed beside a May-pole
    or Midsummer-tree, carried to and fro across a bonfire, and finally cast into
    water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Kupalo is represented in duplicate, by the Midsummer-tree
    and by an anthropomorphic straw effigy.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Blekinge, Sweden, a Midsummer Bride is elected, chooses her bridegroom,
    and the pair are temporarily regarded as man and wife.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Young men and girls in some parts of Germany leap over midsummer bonfires
