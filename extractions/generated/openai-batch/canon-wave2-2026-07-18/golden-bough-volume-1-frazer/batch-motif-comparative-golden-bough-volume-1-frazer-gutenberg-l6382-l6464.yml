canonical_text:
  quote: ''
  summary: Frazer discusses European midsummer customs involving bonfires, May-poles
    or Midsummer-trees, plant effigies, ritual couples, forced grains, and plant divination.
    He interprets these practices as connected with vegetation, crop growth, luck,
    love omens, and personified or deity-like representatives such as Kupalo/Kupole
    and Adonis.
  language: English
  quote_policy: summarized
